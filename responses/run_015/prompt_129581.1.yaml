      *   *(2) Killing/Letting-Die + Structural Omissions:* This touches on resource allocation and systemic neglect. Important for policy, but maybe less about *individual* withdrawal protocols and more about hospital administration/budgeting. It's high stakes but might be outside the scope of a specific "withdrawal of care" form.
      *   *(3) Intended/Foreseen (Double Effect):* This is the "morphine rule." Nurses and doctors do this daily. If the protocol is too strict, they fear prosecution. If too loose, it's euthanasia. This directly impacts medication administration records and liability. Very practical.
      *   *(4) Withdrawing vs. Withholding (Ambiguous Directives):* This is the classic "pulling the plug" dilemma. Legally and emotionally charged. Staff often feel withdrawing is worse than not starting. Protocols *must* address this to prevent moral distress and legal risk.

