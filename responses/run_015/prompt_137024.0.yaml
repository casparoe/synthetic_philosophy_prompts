          *   Connect it to *Automation Bias* and the *Fluency Heuristic*.
          *   The specific danger in clinical coding: The AI sounds confident and uses correct terminology (fluency) but gets the code wrong (substantive error). The auditor loses the "nose" for the error.
      *   **Part 3: A Better Philosophical Frame for the Character:**
          *   Move away from "Knowledge vs. True Belief."
          *   Move toward *Epistemic Dependence* and *Skill Decay*.
          *   Concept: **The Illusion of Explanatory Depth.** We think we understand because we can read the explanation.
          *   Concept: **Deskilling.** It's not just memory; it's the loss of the *tacit knowledge* required to spot anomalies.
          *   *The Haunting Thought:* It's not that she doesn't know the answer; it's that she no longer knows *what it feels like* to be unsure. The AI removes the friction of doubt, and without friction, she can't gauge traction.

  5.  **Refining the Tone:**
