  # Diagnostic Flowchart: Decision-Making Under Moral Uncertainty

  **Starting Point:** The agent assigns non-trivial credence to two or more moral theories that disagree about what they should do.

  ### Branch Questions

  **Q1. Moral Metaphysics:** Do you treat your moral uncertainty as a matter of *belief* in truth-apt propositions (credences), or as a conflict of *non-cognitive conative attitudes* (desires, commitments, or plans)?
  *   **Belief:** Go to Q2.
  *   **Attitudes:** Go to **Leaf 1**.

  **Q2. Structural Parity:** Should moral uncertainty be handled by the *same* formal decision rule used for ordinary empirical uncertainty (Expectationalism), or does it require a *sui generis* rule distinct from empirical risk?
  *   **Same Rule:** Go to Q3.
  *   **Sui Generis:** Go to **Leaf 2**.

  **Q3. Aggregation Target:** Does the decision rule aggregate *degrees of choiceworthiness* (cardinal values) or merely *permissibility statuses* (ordinal/binary rankings)?
  *   **Choiceworthiness:** Go to Q4.
  *   **Permissibility:** Go to **Leaf 3**.

  **Q4. Intertheoretic Scale:** When aggregating choiceworthiness, do you use the theories' *native utility scales* directly, or do you *calibrate/normalize* them (e.g., by variance or range) to a common scale first?
  *   **Direct:** Go to Q5.
  *   **Calibrated:** Go to **Leaf 4**.

  **Q5. Temporal Scope:** Is the object of optimization the *immediate act* in isolation, or a *temporally extended policy* that includes your own future choices?
  *   *Diagnostic Case:* You face a choice where the option best on your highest-credence theory forecloses a mandatory option on a lower-credence theory later, while a compromise option is second-best on both but preserves access to the mandatory option. Does the rule recommend the immediate best or the compromise?
  *   **Immediate Act:** Go to Q6.
  *   **Policy:** Go to **Leaf 5**.

  **Q6. Risk Sensitivity:** Does the rule allow *astronomically large values* at vanishingly small probabilities to dominate modest certain benefits (Fanaticism), or does it discount/limit extreme outliers (Tempering)?
  *   *Diagnostic Case:* You must choose between a certain modest benefit and an astronomically large benefit at a vanishingly small probability. Does the rule mandate the astronomical gamble?
  *   **Fanatical:** Go to Q7.
  *   **Tempered:** Go to **Leaf 6**.

  **Q7. Credence Authority:** Is the weighting determined by the *agent's actual psychological credences*, or by an *idealized aggregate of informed opinion*?
  *   **Agent:** Go to **Leaf 7 & 8**.
  *   **Idealized:** Go to **Leaf 9**.

  ---

  ### Leaf Positions

  **Leaf 1: Non-Cognitivist Conativism**
  *   **Path:** Q1 (Attitudes).
  *   **Awkward Commitment:** It must explain how moral "uncertainty" functions without truth-apt beliefs, often reducing moral deliberation to a negotiation between competing desires rather than a search for correctness.

  **Leaf 2: Borda-Style Rank Hedging**
  *   **Path:** Q1 (Belief) → Q2 (Sui Generis).
  *   **Awkward Commitment:** It ignores the intensity of moral conviction (credence magnitude), treating a 51% credence the same as a 99% credence provided the ranking order remains unchanged.

  **Leaf 3: Permissibility Maximization**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Permissibility).
  *   **Awkward Commitment:** It renders the agent indifferent between an act that is marginally permissible and one that is spectacularly good, provided both are deemed "permissible" by the weighted theories.

  **Leaf 4: Variance-Normalized MEC**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Choiceworthiness) → Q4 (Calibrated).
  *   **Awkward Commitment:** It implies that a theory's influence should depend on how "spread out" its values are (variance), meaning a theory that views all options as nearly equal (compressed scale) loses voting power to a theory that exaggerates differences.
  *   *Diagnostic Case:* One theory's scale is compressed near the top (nearly all options tie) while another's is spread out; mixing them raw lets the spread-out theory dominate. This leaf avoids that dominance.

  **Leaf 5: Policy-Based Expected Choiceworthiness**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Choiceworthiness) → Q4 (Direct) → Q5 (Policy).
  *   **Awkward Commitment:** It requires the agent to bind their future self to a strategy that might require performing an act later that would be suboptimal if evaluated in isolation at that future time (dynamic inconsistency).

  **Leaf 6: Anti-Fanatical (Tempered) MEC**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Choiceworthiness) → Q4 (Direct) → Q5 (Act) → Q6 (Tempered).
  *   **Awkward Commitment:** It must specify a non-arbitrary cutoff or discount function for extreme values, risking a violation of the continuity axiom where sufficiently large benefits fail to outweigh small risks.

  **Leaf 7: Myopic Expected Choiceworthiness (Standard MEC)**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Choiceworthiness) → Q4 (Direct) → Q5 (Act) → Q6 (Fanatical) → Q7 (Agent).
  *   **Awkward Commitment:** It mandates "moral fanaticism," requiring agents to pursue astronomical expected value even when the probability is vanishingly small, potentially ignoring all modest certain goods.

  **Leaf 8: Tolerance-Hybrid MEC (User Hybrid)**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Choiceworthiness) → Q4 (Direct) → Q5 (Act) → Q6 (Fanatical) → Q7 (Agent).
  *   **Note:** This position collapses into the same logical cell as Leaf 7 on this tree.
  *   **Description:** Maximize expected choiceworthiness, but treat any option within a fixed tolerance of the maximum as tied; among tied options prefer the one permissible on the greatest total credence; break any remaining tie by whichever option preserves more of what each theory regards as the best available future choice.
  *   **Awkward Commitment:** It introduces three distinct decision criteria (EC, Permissibility, Future Option Value) without a unified meta-theory to justify why *these* three specifically govern the tie-breaking hierarchy.

  **Leaf 9: Idealized Credence MEC**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Choiceworthiness) → Q4 (Direct) → Q5 (Act) → Q6 (Fanatical) → Q7 (Idealized).
  *   **Awkward Commitment:** It requires the agent to act on credences they do not actually hold, potentially alienating them from their own moral conscience in favor of an epistemic ideal they cannot access.

  **Leaf 10: Empty Cell (Normalized Policy-MEC)**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Choiceworthiness) → Q4 (Calibrated) → Q5 (Policy).
  *   **Status:** **Unexplored.**
  *   **Reason:** Combining variance normalization with policy optimization creates severe computational complexity and dynamic instability, as the normalization factor might shift as the policy extends over time.

  **Leaf 11: Empty Cell (Permissibility Policy-Max)**
  *   **Path:** Q1 (Belief) → Q2 (Same) → Q3 (Permissibility) → Q5 (Policy).
  *   **Status:** **Unattractive.**
  *   **Reason:** Permissibility is typically binary per act; extending it to policies often collapses into act-based permissibility (if any act in the chain is impermissible, the policy is), rendering the policy distinction moot.

  ---

  ### Diagnostic Analysis

  #### 1. Location of the Hybrid (Leaf 8)
  The **Tolerance-Hybrid MEC** lands in the same logical cell as **Standard MEC (Leaf 7)**. Both are Cognitivist, Expectationalist, Cardinal, Direct-Scale, Act-Based, Fanatical (by default structure), and Agent-Credence weighted.
  *   **Collapses Into:** It collapses into **Myopic Expected Choiceworthiness (Leaf 7)**.
  *   **Cell Status:** The cell is **genuinely occupied** (by Standard MEC), making the Hybrid a modification of an existing view rather than a discovery of empty logical space. The Hybrid attempts to solve the "cliff-edge" problem of Standard MEC (where a tiny EC difference dictates choice) by adding a tolerance zone, but the 7-question tree lacks the resolution to separate "Strict Maximization" from "Maximization with Tolerance" without sacrificing another required distinction (such as Credence Authority).

  #### 2. Indistinguishable Leaves
  The tree cannot actually separate **Leaf 7 (Standard MEC)** and **Leaf 8 (User Hybrid)**.
  *   **Further Case Needed:** To separate them, you need a **Tie-Break Case**: Two options have *identical* (or within-tolerance) Expected Choiceworthiness. Option A is permissible on 90% of credence mass; Option B on 40%. Option A forecloses a high-value future choice; Option B preserves it.
      *   **Standard MEC:** Indifferent (randomize).
      *   **User Hybrid:** Chooses Option A (Permissibility) or Option B (Future Preservation), depending on which tie-breaker triggers first.

  #### 3. Empty Cells Analysis
  *   **Leaf 10 (Normalized Policy-MEC):** This cell is empty primarily because it is **Unexplored**. Theoretical work on intertheoretic comparison (normalization) usually assumes act-utilitarian frameworks, while policy-based views (like MacAskill's later work) often assume direct comparability to avoid the complexity of shifting normalization baselines over time.
  *   **Leaf 11 (Permissibility Policy-Max):** This cell is empty because it is **Unattractive**. Aggregating permissibility over policies tends to be overly restrictive (a single impermissible step taints the whole policy) or collapses back into act-evaluation, offering no advantage over Leaf 3 while incurring the computational costs of Leaf 5.
