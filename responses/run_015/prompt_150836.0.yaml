      *   Actually, the *Quant/Forecaster* objection about resolution is more dangerous to the *utility* of the talk. If the method doesn't produce scorable outcomes, the forecasters will reject it.
      *   *Decision:* The Game Theorist objection is the most intellectually damaging, but the Quant objection about *resolution/scoring* is the most practically damaging. Let's look at the prompt: "which single reply has to land or the talk dies." If I lose the Game Theorists, I look stupid. If I lose the Forecasters, I look useless. The Game Theorist objection attacks the *premise*. I must defend the interpretation of Aumann.
