      *   *Vulnerability 2 (Quants/Forecasters):* If you can't operationalize the question perfectly, how do you score it? Brier scores require binary resolution. If the question is fuzzy, your "fix" breaks the feedback loop.
      *   *Vulnerability 3 (Philosophers):* You're suggesting social construction of facts. Where does reality enter?
      *   *Vulnerability 4 (Practitioners):* This sounds expensive/time-consuming. We need numbers *now*.
