answer: |-
  # Q&A Prep Sheet: Expert Elicitation Workshop

  **Speaker:** Token Journalist
  **Audience:** 25 (50% Forecasters/Quants, 2 Game Theorists, ~5 Philosophers, rest Practitioners)
  **Thesis:** Aumann's Agreement Theorem is a diagnostic for semantic/model divergence, not just Bayesian irrationality. Fix the question, not the number.

  ---

  ### 1. The Game Theorist (High Damage)
  **The Objection:** "You're treating Aumann's Agreement Theorem as a metaphor. It's a mathematical proof. If priors are common and posteriors differ, the theorem states they *must* be exchanging private information or one is irrational. You're suggesting a third option—that the 'events' differ—but mathematically, that just means they aren't talking about the same variable. That's trivial. It doesn't need a theorem; it needs a dictionary."
  *   **Voice:** Dry, precise, slightly impatient.
  *   **The Reply:** "You're right that it's trivial mathematically, but it's catastrophic operationally. In a workshop, we treat 'Will the regime fall?' as a single variable. Aumann tells us that if two rational agents disagree on that string of text, they *cannot* be modeling the same event space. I'm not using the theorem to find irrationality; I'm using it as a stop-loss. When disagreement persists, don't check their priors; check their dictionaries. The theorem forces us to admit we aren't eliciting probabilities for *the* event, but for *their* event. That distinction is where the value lies."
  *   **Soft Spot:** You are admitting the math is trivial. If they press on whether "different events" invalidates the use of probability theory entirely, you might get bogged down in semantics.
  *   **Status:** **MUST LAND.** If you lose the game theorists on the premise, the room will treat the rest as hand-waving.

  ### 2. The Lead Forecaster (High Damage)
  **The Objection:** "Okay, say we 'repair the question' until everyone operationalizes it identically. Now we have a crisp resolution criterion. But you've just described standard forecasting protocol. Where's the innovation? And if you *don't* make it crisp, how do you calculate a Brier score? If the definition of 'failure' is negotiated, the ground truth is moving. You can't calibrate against a moving target."
  *   **Voice:** Pragmatic, focused on metrics and pipeline.
  *   **The Reply:** "Standard protocol often asks experts to resolve the ambiguity themselves silently. I'm arguing we make that negotiation explicit *before* the number is locked. You're worried about the Brier score. I'm worried about the *input*. If I average two numbers answering different questions, my aggregation is garbage, no matter how well I score the outcome. Better to have a slightly messier resolution process on a question everyone actually answered, than a clean score on a question nobody meant."
  *   **Soft Spot:** You don't have a concrete proposal for how to score the "negotiated" question if the real world doesn't respect the negotiation.

  ### 3. The Senior Practitioner (Medium Damage)
  **The Objection:** "This sounds incredibly expensive. I have to pay experts by the hour. You want me to turn a one-hour elicitation into a three-day semantic workshop? In a crisis, or for a client, I need a distribution by Friday. Your 'fix' might be philosophically sound, but it's economically unviable."
  *   **Voice:** Tired, budget-conscious, results-oriented.
  *   **The Reply:** "Bad numbers are more expensive than slow questions. If you elicit today and the policy fails because half the experts meant 'economic collapse' and half meant 'regime change,' the cost of that error dwarfs the facilitation time. I'm not suggesting a three-day workshop for every query. I'm suggesting a five-minute 'definition check' at the start. If they can't define the threshold in two minutes, don't take the number."
  *   **Soft Spot:** You don't have data on the ROI of "definition checks" vs. "rapid elicitation."

  ### 4. The Philosopher of Science (Medium Damage)
  **The Objection:** "You're leaning towards a constructivist view. If the 'event' is defined by the experts' operationalization, are we forecasting reality or just our own models? If two experts operationalize 'democratic backsliding' differently, and you force them to agree on a definition, haven't you just created a tautology? You've solved the disagreement by removing the object of study."
  *   **Voice:** Abstract, careful, probing.
  *   **The Reply:** "We aren't removing the object; we're acknowledging the map isn't the territory. Forecasting isn't about metaphysical truth; it's about decision-relevant outcomes. If a policy maker needs to know about 'voter suppression,' and Expert A thinks that means 'ID laws' while Expert B thinks it means 'gerrymandering,' the forecast is useless until we map it to the specific lever the policy maker can pull. We aren't solving ontology; we're solving utility."
  *   **Soft Spot:** Walking the line between pragmatism and anti-realism is tricky. If you sound too pragmatic, you lose truth; too realist, you lose the thesis.

  ### 5. The Quant (Medium/Low Damage)
  **The Objection:** "Let's say I accept your premise. Why is 'repairing the question' better than model averaging? If Expert A models X and Expert B models Y, and I know both X and Y are relevant to the outcome Z, shouldn't I just weight their probabilities based on past performance rather than trying to force them into a single canonical question?"
  *   **Voice:** Analytical, looking for the algorithm.
  *   **The Reply:** "Model averaging works when the outputs are comparable probabilities of the *same* outcome. If A is predicting P(X) and B is predicting P(Y), and X $\neq$ Y, averaging them gives you P(Zoo). You can't weight performance if the questions are different. You have to map X and Y to Z first. My argument is that the 'mapping' is the hard part everyone skips, not the weighting."
  *   **Soft Spot:** There *are* methods for aggregating heterogeneous predictions (e.g., hierarchical models). You might be underestimating their flexibility.

  ### 6. The Scoring Rule Purist (Low Damage)
  **The Objection:** "You mentioned scoring rules in your coda. If we stop pressuring experts for precise numbers, don't we lose the incentive to be honest? Without a proper scoring rule, experts sandbag or hedge. Are you suggesting we drop the incentives?"
  *   **Voice:** Defensive of the standard toolkit.
  *   **The Reply:** "Not at all. I'm saying the scoring rule should apply to the *operationalized* question, not the headline. Don't score them on 'Will there be war?' Score them on 'Will troop movements cross Border X by Date Y?' The pressure for precision is good, but it shouldn't be applied to ambiguity. That just trains them to be confidently vague."
  *   **Soft Spot:** Operationalizing everything to a scorable degree is often impossible for high-level strategic questions.

  ### 7. The Skeptic (Low Damage)
  **The Objection:** "You've given us three anecdotes. Do you have any data? Have you run a controlled trial where one group 'repaired the question' and the other didn't, and measured the calibration improvement?"
  *   **Voice:** Empirical, demanding evidence.
  *   **The Reply:** "No, I don't have that data. That's why I'm here. I'm a journalist; I spot the pattern, you build the model. I've interviewed enough forecasters to know this is where the errors hide, but I need this room to prove whether fixing it moves the Brier score. Consider this a request for a research agenda, not a finished white paper."
  *   **Soft Spot:** Admitting lack of data makes you vulnerable to being dismissed as "just a writer."

  ### 8. The Question I Hope Nobody Asks
  **The Objection:** "You keep using the phrase 'repairing the question.' Can you give me a formal syntax for that? Is there a grammar or a logic framework you're proposing we use to standardize these operationalizations, or is this just 'talk until you agree'?"
  *   **Voice:** The Game Theorist or a Computer Scientist.
  *   **Why I Fear It:** Because I'm a journalist. I have a *concept*, not a *formalism*. If I try to invent one on the fly, I'll sound foolish. If I say "no," I sound like I'm offering a solution without a tool.
  *   **The Pivot:** "There isn't a formal syntax yet. That's the gap. We have formal syntax for the *probabilities*, but not for the *events*. I'm hoping someone in this room builds that. Until then, the tool is facilitated dialogue, not logic gates."

  ---

  ### Strategic Note: The "Must Land" Reply
  **Reply #1 (The Game Theorist)** is the linchpin.
  *   **Why:** If the Game Theorists decide you are mathematically illiterate or misusing Aumann, the Forecasters will assume your practical advice is equally flawed. You need their nod of approval (or at least their silence) to legitimize the rest of the talk.
  *   **Tactic:** Do not fight them on the math. Fight them on the *application*. Concede the triviality of the math to highlight the severity of the operational error. Make them feel like you are on their side (protecting the integrity of the theorem) against the "sloppy practitioners."

  ### General Tone Advice
  *   **Don't Apologize:** You are the journalist. Your value is the *observation*, not the *proof*. Own the "outsider looking in" perspective.
  *   **Flank the Experts:** When answering the Forecasters, use the Game Theorists' logic. When answering the Game Theorists, use the Forecasters' practical constraints. Position yourself as the bridge.
  *   **The Coda:** End on the scoring rule point. It's the most provocative and leaves them with something to argue about on the break, rather than your lack of formalism.
