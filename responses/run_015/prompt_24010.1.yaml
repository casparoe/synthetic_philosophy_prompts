prompt: |-
  I'm a causal inference statistician — I spend my days with DAGs, potential outcomes, do-calculus, and arguing about which variables count as "background" versus "treatment" — and I just got into a really long argument with a philosopher friend about the doing/allowing distinction. She thinks there's a genuine moral difference between killing someone and letting them die, and I kept trying to say "but isn't that just a difference in the causal structure, like which node you intervene on?" and we went in circles for like a hour and a half. I cant get it to line up in my head.

  So can you restate the doing/allowing debate in the vocabulary I actually work in: counterfactuals and potential outcomes (would the person have died had I not intervened?), causal diagrams and the choice of which variables go into the model versus which get absorbed into the baseline, do-interventions versus not-doing, proximate versus remote causes, and the reference class you pick? I'd like you to go through the main positions — the view that the distinction is real and just tracks causation, the view that it's an illusion, the cases where acting and not-acting both seem to be within your control so "agency" doesn't do the work, and the Doctrine of Double Effect cases where the harm is a foreseen side effect rather than the means — and tell me how each one maps onto my terms.

  Then the part I actually care about: the residue report. Which claims translate cleanly, which only translate if you distort them, and which have no expression in my vocabulary at all? I have a hunch the doing/allowing distinction doesn't track pure counterfactual dependence but instead tracks the choice of causal model — which variables you treat as the background versus the intervention — and that this choice is underdetermined by the data, which is exactly the kind of thing I'm used to complaining about. Is that hunch right, or am I smuggling in an assumption from my field and calling it translation? And if there's a residue, is it a defect of my causal-inference vocabulary, or does it show the philosophers' disagreement is less clean than it looks?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Causal inference statistician. Familiar with DAGs, potential outcomes (Rubin Causal Model), do-calculus (Pearl), background vs. treatment variables, interventions, counterfactuals.
      *   **Problem:** Had a long, circular argument with a philosopher friend about the "doing/allowing" distinction (killing vs. letting die). The user tried to reduce it to causal structure (which node you intervene on), but it didn't stick.
      *   **Goal:** Restate the doing/allowing debate using causal inference vocabulary. Analyze main philosophical positions through this lens. Produce a "residue report" (what translates, what distorts, what's lost). Validate the user's hunch that the distinction tracks *model choice* (background vs. intervention) rather than pure counterfactual dependence.
      *   **Tone:** Professional, technically precise (using CI jargon correctly), empathetic to the frustration of interdisciplinary translation, analytical.

  2.  **Deconstruct the "Doing/Allowing" Distinction:**
      *   *Core Philosophical Claim:* There is a moral difference between actively causing harm (commission) and passively allowing harm (omission), even if the outcome (death) and counterfactual dependence (if I hadn't done X/not-done Y, they would live) are identical.
      *   *User's Intuition:* It's just about $do(X=1)$ vs. $do(X=0)$ or perhaps which variable is $X$.
      *   *The Conflict:* In CI, $Y(0)$ and $Y(1)$ are symmetric mathematically. In ethics, $Action$ and $Inaction$ are often asymmetric morally.

  3.  **Map Philosophical Positions to Causal Inference (CI) Vocabulary:**

      *   **Position 1: The Distinction is Real & Causal (The Friend's View).**
          *   *CI Translation:* It's about the *default state* of the system.
          *   *Concept:* The "baseline" or "control" condition ($X=0$) isn't just a value; it's the *natural course of events*.
          *   *DAG:* Distinguishing between an exogenous shock (intervention) and the structural equations running their course.
          *   *Counterfactual:* $Y_{do(A=1)}$ vs. $Y_{do(A=0)}$. But $A=0$ isn't "nothing," it's "maintaining the status quo."
          *   *Key:* Asymmetry in the cost of intervention.

      *   **Position 2: The Distinction is an Illusion (Consequentialist/Reductionist).**
          *   *CI Translation:* Only $P(Y)$ and the counterfactual contrast matter.
          *   *Concept:* If $Y_{do(A=1)} = \text{Death}$ and $Y_{do(A=0)} = \text{Life}$, the causal effect is identical regardless of whether $A$ is "pushing" or "withholding."
          *   *DAG:* The graph structure is the same; the label on the edge doesn't change the identification strategy.
          *   *Key:* Symmetry of counterfactuals.

      *   **Position 3: Agency/Control Cases (The "Switch" Problem).**
          *   *CI Translation:* Multiple valid interventions available.
          *   *Concept:* If I can set $X=1$ (kill) or $X=0$ (save), both are $do$-operations.
          *   *Issue:* Which variable is the "Treatment"? If I define Treatment as "Pull Lever," then not pulling is control. If I define Treatment as "Save Life," then not saving is the intervention.
          *   *Key:* Variable definition is underdetermined by data.

      *   **Position 4: Doctrine of Double Effect (DDE).**
          *   *CI Translation:* Mediation and Path-Specific Effects.
          *   *Concept:* Harm is on a specific causal path.
          *   *DAG:* $Treatment \to Mediator \to Outcome$ vs. $Treatment \to Outcome$.
          *   *Key:* Intentionality maps to path selection (natural direct/indirect effects).

  4.  **Develop the "Residue Report":**
      *   *Translates Cleanly:* Counterfactual dependence (but-for causation), Path-specific effects (DDE), Model specification (default states).
      *   *Translates with Distortion:* "Agency" (becomes variable selection), "Intention" (becomes path restriction).
      *   *No Expression (The Residue):* Normative weight of the *default*. In CI, $X=0$ is mathematically arbitrary. In ethics, $X=0$ is "what happens naturally." The *normative status of the baseline* is the missing piece.
      *   *User's Hunch:* Yes, it's about model choice (background vs. intervention). This is the "Reference Class" problem or the "Default Value" problem.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the frustration. Validate the CI perspective (symmetry) vs. Ethical perspective (asymmetry).
      *   **Translation Layer:**
          *   *Doing:* $do(X=x)$ where $x \neq \text{baseline}$.
          *   *Allowing:* $do(X=\text{baseline})$ where baseline leads to $Y=\text{bad}$.
          *   *Counterfactuals:* $Y(1)$ vs $Y(0)$.
      *   **Mapping Positions:**
          1.  *Real Distinction:* Asymmetry in the *structural equation* for the default. The "null intervention" has a different ontological status than an active intervention.
          2.  *Illusion:* Pure potential outcomes. $ATE = E[Y(1) - Y(0)]$. Sign doesn't matter, magnitude does.
          3.  *Agency/Control:* Identification problem. If multiple $do$-operators exist, which one defines the "agent"?
          4.  *Double Effect:* Causal pathways. Natural Direct Effect (NDE) vs. Total Effect.
      *   **The Residue Report:**
          *   *Clean:* Counterfactual dependence, Mediation.
          *   *Distorted:* Intention (modeled as path constraints), Baseline (modeled as reference level).
          *   *Missing:* The *Normative Baseline*. In CI, the baseline is statistical or practical. In Ethics, it's moral.
      *   **Addressing the Hunch:**
          *   Confirm the hunch. It *is* about model specification (what counts as the system vs. the intervention).
          *   Is it smuggling? Yes, slightly. CI assumes the model is given for identification. Ethics argues *about* the model.
          *   Defect or Feature? It shows the philosophical debate is partly about *model specification*, which CI treats as exogenous.

  6.  **Refining the Technical Language:**
      *   Ensure correct usage of $do(\cdot)$, $Y_x$, DAGs, structural equations, exogenous variables, identification, path-specific effects.
      *   Make sure the distinction between *epistemic* (what we know) and *ontological* (what is) is clear where relevant.
      *   Highlight the "Default Value" problem in causal models (Pearl discusses this regarding "normality").

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I make the CI stuff too simple?
      *   *Fix:* Bring in the concept of "Normality" or "Default Values" in structural causal models (SCM). Pearl and Halpern have work on actual causation that touches on this.
      *   *Critique:* Did I answer the "Residue" part clearly?
      *   *Fix:* Make sure the "Residue Report" is a distinct section with clear bullet points.
      *   *Critique:* Is the tone right?
      *   *Fix:* Keep it collegial. "You're right, but here's why it feels stuck."

  8.  **Final Polish:** Check against the prompt requirements (restate debate, map positions, residue report, evaluate hunch). (Proceed to generate output based on this structure.)

  *(Self-Correction Note)*: I need to be careful not to say CI *cannot* handle defaults. It can, but it requires explicit modeling of "normality" which is often outside the standard identification framework. I should mention Halpern & Pearl's work on "Actual Causation" and "Normality" as it bridges this gap.

  9.  **Final Output Structure:**
      *   Intro: Validating the frustration.
      *   The Translation Layer (CI Dictionary for Ethics).
      *   Mapping the Four Positions.
      *   The Residue Report (Clean, Distorted, Missing).
      *   Verdict on the Hunch (Model Specification vs. Identification).
      *   Conclusion.

