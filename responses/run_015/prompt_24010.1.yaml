answer: |-
  This is a classic interdisciplinary collision. You are operating in a framework where causation is defined by *invariance under intervention* (the structural/counterfactual account), while your friend is operating in a framework where causation is entangled with *normative expectations* (the moral/legal account).

  Your frustration stems from the fact that in Causal Inference (CI), the mathematics is symmetric: $Y(1) - Y(0)$ is mathematically identical to $-(Y(0) - Y(1))$. In ethics, the directionality carries the moral weight.

  Here is the translation of the doing/allowing debate into your vocabulary, followed by the residue report you asked for.

  ---

  ### Part 1: The Translation Layer
  **Mapping Ethical Concepts to Causal Inference Vocabulary**

  To talk to your friend, you need to map her ethical terms onto your structural causal model (SCM) components: $\langle V, U, F, P(u) \rangle$.

  1.  **Doing (Killing):** An active intervention $do(X=x)$ where $x$ deviates from the *system's default state* or *baseline value*. In your DAG, this is an edge from an exogenous agent node $A$ into the system variable $X$.
  2.  **Allowing (Letting Die):** The absence of an intervention, $do(X=x_{\text{default}})$, where the structural equations $F$ naturally propagate to $Y=\text{Death}$.
  3.  **The Baseline (Status Quo):** The reference value $X=0$ (or whatever value $X$ takes when $do(\cdot)$ is not applied). In CI, this is arbitrary. In ethics, this is the "natural course of events."
  4.  **Agency:** The selection of which variables are endogenous (system) vs. exogenous (intervenor).
  5.  **Intention (Double Effect):** Path-specific effects. Did the treatment affect the outcome *through* the harm mediator, or despite it?

  ---

  ### Part 2: Mapping the Philosophical Positions

  Here is how the four main positions in the debate map onto your CI framework.

  #### 1. The Distinction is Real (The Friend's View)
  *   **Philosophical Claim:** There is an ontological difference between pushing a man off a bridge and not throwing him a life preserver, even if he dies in both cases.
  *   **CI Translation:** This is a claim about **Model Specification and Default Values**.
      *   Your friend argues that the SCM is not just $Y = f(X, U)$. It is $Y = f(X, U, \text{Normality})$.
      *   "Doing" corresponds to a change in the structural equation (modifying $F$).
      *   "Allowing" corresponds to the structural equation running its course without modification.
      *   **The Argument:** The causal effect is not just the contrast $Y(1) - Y(0)$. It is the contrast between *modified dynamics* vs. *intrinsic dynamics*. The "cost" of the intervention is part of the causal structure.
      *   **In your terms:** She is arguing that the *null intervention* has a different ontological status than an *active intervention*, even if the counterfactual contrast is identical. She is treating the baseline $X=0$ as a privileged state, which violates the symmetry of the Potential Outcomes framework.

  #### 2. The Distinction is an Illusion (The Consequentialist/Reductionist)
  *   **Philosophical Claim:** If the outcome is the same and you could have prevented it, you are equally responsible. "Killing" and "letting die" are morally equivalent.
  *   **CI Translation:** This is the **Pure Potential Outcomes** view.
      *   Morality is a function of the Average Treatment Effect (ATE) or the Individual Treatment Effect (ITE).
      *   If $Y_{do(\text{Push})} = \text{Death}$ and $Y_{do(\text{Withhold})} = \text{Death}$, and in both counterfactual worlds $Y_{do(\text{Alternative})} = \text{Life}$, then the causal responsibility is identical.
      *   **The Argument:** The label on the intervention ($do(X=1)$ vs $do(X=0)$) is irrelevant. Only the mapping from intervention to outcome matters. Any perceived difference is confounding by social norms, not causation.
      *   **In your terms:** This view treats the causal graph as fixed and the intervention values as symmetric. It ignores the "cost" of setting $X$.

  #### 3. The Agency/Control Problem (The "Switch" Cases)
  *   **Philosophical Claim:** Sometimes "not acting" is actually a choice to act (e.g., a lifeguard sitting on their hands).
  *   **CI Translation:** This is a **Variable Definition and Identification** problem.
      *   Is the treatment variable $X = \text{Movement of Body}$ or $X = \text{Provision of Aid}$?
      *   If $X = \text{Movement}$, then sitting still is $X=0$ (Allowing).
      *   If $X = \text{Provision of Aid}$, then sitting still is $do(X=0)$ (an active decision to withhold).
      *   **The Argument:** The doing/allowing distinction collapses when the "default" state of the agent is redefined.
      *   **In your terms:** This highlights that the choice of the *Treatment Variable* is underdetermined by the data. You can model the lifeguard as a constant background variable or an active intervenor. The moral disagreement is actually a disagreement about which DAG correctly represents the agency.

  #### 4. Doctrine of Double Effect (DDE)
  *   **Philosophical Claim:** It is permissible to cause harm as a foreseen side effect (collateral damage) but not as a means to an end.
  *   **CI Translation:** This is **Mediation Analysis and Path-Specific Effects**.
      *   Let $T$ be the treatment (e.g., drop bomb), $M$ be the mediator (civilian deaths), $Y$ be the outcome (war won).
      *   **Means:** The effect flows $T \to M \to Y$. (Natural Indirect Effect).
      *   **Side Effect:** The effect flows $T \to Y$, with $M$ correlated but not causal for $Y$, or $T \to M$ is a separate branch.
      *   **The Argument:** Moral permissibility depends on which causal path carries the effect.
      *   **In your terms:** This translates very cleanly. DDE is essentially a constraint on which *Natural Direct/Indirect Effects* are permissible to activate.

  ---

  ### Part 3: The Residue Report

  Here is the breakdown of what translates, what distorts, and what vanishes when you force ethics into CI vocabulary.

  #### 1. Translates Cleanly
  *   **Counterfactual Dependence:** The "but-for" test ($Y_{x} \neq Y_{x'}$) maps perfectly to factual causation. If the person wouldn't have died without you, you are a cause.
  *   **Mediation (Double Effect):** As noted above, distinguishing "means" from "side effects" is structurally identical to distinguishing indirect from direct effects.
  *   **Confounding:** Many ethical disputes about "responsibility" are actually disputes about unmeasured confounders (e.g., "He would have died anyway due to the illness"). CI handles this well via $Y(0)$ estimation.

  #### 2. Translates with Distortion
  *   **Agency:** In CI, agency is just an exogenous variable $U_{agent}$ or a $do$-operator. In ethics, agency implies *capacity* and *obligation*. Translating "obligation" into "capacity to intervene" distorts the moral weight. You can model a lifeguard and a passerby with the same DAG (both can throw the rope), but ethics assigns them different baselines.
  *   **Intention:** In CI, intention is usually modeled as path selection. But intention is also about *probability weighting* in the agent's mind. CI assumes the structural equations are fixed; ethics cares about the agent's subjective model of those equations.
  *   **The Baseline:** In CI, $X=0$ is a reference level chosen for identification or convenience. In ethics, $X=0$ is the "Normal Course of Events." Treating the baseline as arbitrary (as CI does) distorts the ethical claim that the baseline has normative privilege.

  #### 3. No Expression (The Residue)
  *   **The Normative Status of the Default:** This is the big one. In your SCM, the state of the system when $do(\cdot)$ is not applied is just a value generated by $F$ and $U$. It has no moral valence. In ethics, the "natural state" is privileged.
      *   *Example:* Turning off a ventilator ($do(V=0)$) vs. Not turning on a ventilator ($do(V=0)$). Mathematically, these are the same intervention on variable $V$. Ethically, one is killing, one is allowing.
      *   *CI Limit:* CI cannot distinguish these without adding a "history" variable or a "time since last intervention" variable. The distinction is temporal and historical, not just structural.
  *   **Omission as Causation:** Standard CI struggles with "causation by omission." If $X$ is "feeding the baby" and $Y$ is "baby survives," $X=0$ causes $Y=0$. But in the DAG, there is no edge from "nothing" to "death." You have to model "absence of food" as a positive variable. Ethics treats absences as causes more readily than standard CI does.
  *   **Responsibility vs. Causation:** CI identifies *causal effects*. It does not identify *liability*. You can have a massive causal effect ($ATE = 1.0$) but zero liability (self-defense). CI has no variable for "justification."

  ---

  ### Part 4: Verdict on Your Hunch

  > *"I have a hunch the doing/allowing distinction doesn't track pure counterfactual dependence but instead tracks the choice of causal model — which variables you treat as the background versus the intervention — and that this choice is underdetermined by the data..."*

  **Your hunch is correct.**

  You are not smuggling in an assumption; you have identified the exact friction point. In Causal Inference, we treat the **Model Specification** (which variables are in $V$, which are in $U$, what is the baseline) as a prerequisite step *before* identification. We assume the scientist has correctly specified the "system."

  The philosophical debate about Doing vs. Allowing is actually a debate about **Model Specification**, not Identification.

  1.  **Underdetermination:** The data (observational or experimental) cannot tell you whether "withholding aid" is an intervention $do(X=0)$ or the absence of intervention. Both models fit the data perfectly.
  2.  **The Normative Baseline:** Your friend is arguing that the "correct" causal model must include a **Normality Ordering** on the variables (a concept Halpern and Pearl have explored in "Actual Causation").
      *   In a "Killing" model, the normal state is $Life$, and the intervention moves it to $Death$.
      *   In a "Letting Die" model, the normal state is $Death$ (due to illness), and the intervention (saving) moves it to $Life$.
      *   The *data* is the same. The *DAG* is the same. The **assignment of normality** to the nodes is different.

  **Is this a defect in your vocabulary?**
  Yes and no.
  *   **Defect:** Standard CI (Rubin/Pearl) assumes the intervention set is well-defined. It does not have a built-in formalism for "normative defaults." You have to hack it by adding variables for "expected state."
  *   **Feature:** It shows the philosophers' disagreement is less clean than it looks. They think they are arguing about *morality*, but they are often arguing about *causal model specification*. If you can't agree on which variable represents the "status quo," you can't agree on the counterfactual contrast.

  **Conclusion for your argument:**
  Tell your friend: *"I think we are disagreeing about the Structural Causal Model, not the ethics. You are assigning a 'normal' value to the variables that I am treating as arbitrary. In my field, $X=0$ is just a reference level. In your field, $X=0$ is 'what ought to happen.' My vocabulary can model your distinction, but only if I treat 'Normative Expectations' as an exogenous variable $U_{norm}$ that constrains which interventions count as 'deviations.' Without that variable, the math is symmetric. With it, the asymmetry returns."*

  You aren't wrong; you're just working in a framework that strips out the "Normality" priors to focus on identification. She is working in a framework where the Priors *are* the point.
