answer: |-
  Your colleague is technically correct on the formal decision theory but practically wrong on the policy necessity. Here is the reconstruction of the implicit theory, the diagnosis of the "anchoring" fix, and the analysis of what holds the practice together.

  ### 1. The Colleague's Objection and the "Anchoring" Fix
  Your colleague is invoking the standard von Neumann-Morgenstern (vNM) result: individual utility functions are unique only up to positive affine transformation ($u' = au + b$, where $a > 0$). This means you can rank *my* outcomes, and you can rank *your* outcomes, but there is no mathematical fact determining whether the distance between my health states matches the distance between yours. Without fixing $a$ and $b$ across persons, summing utilities is indeed category error.

  Your proposed fix (anchoring 0 = worst/death, 1 = best) attempts to fix the $b$ (zero point) and the $a$ (unit scale). **The known problems with this are:**
  1.  **Experiential Heterogeneity:** "Perfect health" (1) is not experientially identical. A paraplegic's "1" (best possible *for them*) may correspond to a healthy person's "0.6". If you anchor to subjective bests, you lose the common metric needed to compare resource allocation. If you anchor to an objective "biological perfect," you violate the subjective preference basis of utility.
  2.  **Adaptation:** People adapt to chronic states. A person with severe arthritis might rate a specific mobility state higher than a healthy person would. Anchoring doesn't solve whether we value the *experience* of health or the *capacity* for health.
  3.  **Cardinality of the Interval:** Even if 0 and 1 match, the *distance* between 0.4 and 0.5 must represent the same amount of "good" for everyone. Anchoring endpoints does not guarantee linearity or equivalent sensitivity in the middle of the scale.

  ### 2. Reconstructing the Implicit Theory
  The cost-per-QALY practice presupposes a specific social welfare function. It is not merely "utilitarianism"; it is **Health-Specific Cardinal Utilitarianism**.

  **The Load-Bearing Commitments (Indispensable):**
  1.  **Cardinal Interpersonal Comparability (CIC):** This is the non-negotiable core. We must assume that a 0.1 gain in health utility for Person A is socially equivalent to a 0.1 gain for Person B. Without this, the denominator in "cost-per-QALY" cannot be aggregated across a population.
  2.  **Aggregativity:** Social value is a function of the sum of individual health utilities. (Though the *weighting* of that sum can vary, see below).
  3.  **Separability of Health from Wealth:** The practice assumes health utility can be measured independently of ability to pay. This is why WTP is rejected. WTP conflates intensity of preference with marginal utility of income. QALYs assume intensity of health preference is the only relevant metric for allocation, deliberately decoupling it from economic capacity.

  **The Optional Extras (Modifiable):**
  1.  **Strict Egalitarianism ("A QALY is a QALY"):** This is *not* load-bearing. NICE's end-of-life premium and severity modifiers explicitly violate this. The practice survives if you weight QALYs differently based on baseline health or prognosis, provided you still measure them cardinally.
  2.  **Time Neutrality:** Discounting future health is common practice but theoretically contestable. The system works with or without discounting, provided it is consistent.
  3.  **The Zero Point:** Whether 0 is "death" or "worst imaginable health" is a technical calibration, not a theoretical pillar, provided it is consistent across calculations.

  ### 3. Consistency of WTP Refusal and End-of-Life Allowances
  *   **Refusal of WTP:** This is consistent with the implicit theory. The theory defines the "good" as *health*, not *preference satisfaction simpliciter*. Importing WTP would change the good being maximized from "population health" to "wealth-weighted preference satisfaction." The refusal is a normative boundary-setting move (health is a special sphere of justice), not a theoretical inconsistency.
  *   **End-of-Life/Severity Allowances:** These are **inconsistent with strict utilitarianism** but consistent with **prioritarianism**. They bolt on a different theory of *distribution* (giving weight to the worse off) while retaining the QALY as the *measure* of benefit. The practice can absorb this by changing the social welfare function from $\sum U_i$ to $\sum g(U_i)$ where $g$ is concave, without abandoning the measurement of $U_i$.

  ### 4. Concrete Changes Under Alternative Theories

  **(a) Ordinal / Partial Comparability Only**
  *   **Change:** You can no longer calculate an ICER (Incremental Cost-Effectiveness Ratio) to rank all programs.
  *   **Practice:** You would shift to **Leximin** or **Constraint-Based** decision making. You fund programs that help the worst-off first, or you only fund programs that are Pareto improvements (which in public budgeting is almost none, since opportunity costs create losers). You would lose the ability to say "Program A is better than Program B" if they help different people; you could only say "Program A helps the worst off."
  *   **Feasibility:** Low. Budgeting requires trade-offs; ordinalism forbids trading off one person's gain against another's loss.

  **(b) Prioritarianism (Weighting the Badly Off)**
  *   **Change:** You retain cardinal measurement but apply a weight $w > 1$ to QALYs gained by those with low baseline health.
  *   **Practice:** The cost-per-QALY threshold becomes variable. A drug costing £50,000/QALY might be rejected for a mild condition but accepted for a terminal one. The "ceiling" is no longer a fixed number but a surface dependent on patient severity.
  *   **Feasibility:** High. This is essentially what NICE already does with severity modifiers and end-of-life criteria.

  **(c) Impartial Spectator (Harsanyi)**
  *   **Change:** Justification shifts from "maximizing the sum" to "what would you choose behind a veil of ignorance?"
  *   **Practice:** Mathematically, if risk neutrality is assumed, the practice remains identical to standard QALY maximization (Harsanyi's Aggregation Theorem). However, if the spectator is risk-averse regarding health, it converges with Prioritarianism (b).
  *   **Feasibility:** High. This changes the *moral story* told to the public but requires minimal operational change if risk neutrality is maintained.

  ### 5. Conclusion
  The practice cannot be rebuilt on purely ordinal grounds because resource allocation inherently requires trade-offs between persons. Ordinalism allows ranking states for one person, but funding decisions require comparing gains across persons. Therefore, the assumption that these comparisons are meaningful is not just a convenience; it is the engine of the system.

  \answer{Cardinal interpersonal comparability}
