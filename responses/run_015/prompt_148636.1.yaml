      *   *(a) Ordinal/Partial Comparability:* You can't sum. You need rules like "Pareto improvement" or "Leximin" (help the worst off first). Practice shifts from optimization to constraint satisfaction or thresholding.
      *   *(b) Prioritarianism (Weighting the badly off):* You need a function $w(baseline) \times QALY$. Practice requires assessing baseline severity explicitly, not just marginal gain. Cost-effectiveness thresholds become variable.
      *   *(c) Impartial Spectator (Harsanyi):* This actually *supports* standard QALYs (expected utility behind veil of ignorance). Practice stays similar, but justification shifts from "sum of good" to "rational choice under uncertainty."

  7.  **Drafting the Response:**

