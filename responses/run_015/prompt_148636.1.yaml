  2.  **Analyze the Philosophical Issues:**

      *   **Interpersonal Comparability of Utility (ICU):** The colleague is technically correct from a strict von Neumann-Morgenstern (vNM) perspective. vNM utility is ordinal *within* a person (unique up to positive affine transformation). You cannot mathematically prove Person A's "0.5" is equivalent to Person B's "0.5" without extra assumptions.
      *   **The "Anchoring" Fix:** Setting 0 = death/worst health and 1 = perfect health is the standard EQ-5D approach. *Problem:* It assumes "perfect health" and "death/worst health" are experientially equivalent across persons. A paraplegic's "1" might be a runner's "0.6". It assumes *cardinality* and *level comparability*.
      *   **Utilitarianism vs. Prioritarianism:** Standard QALY maximization is utilitarian (sum total). End-of-life premiums or severity weights introduce prioritarianism (weighting benefits to the worse off).
      *   **WTP vs. QALY:** WTP relies on ability to pay (marginal utility of income varies). QALY relies on health state valuation. Refusing WTP in health is a normative choice to separate health allocation from wealth distribution.

  3.  **Reconstructing the Implicit Theory (The "QALY Framework"):**

      *   *Commitment 1: Cardinal Measurability.* Health states can be assigned numbers representing strength of preference.
      *   *Commitment 2: Interpersonal Comparability (Level & Unit).* A 0.1 gain for Person A is socially equivalent to a 0.1 gain for Person B. This is the big one the colleague attacks.
      *   *Commitment 3: Additivity (Aggregation).* Social value = Sum of individual QALYs.
      *   *Commitment 4: Independence from Identity.* A QALY is a QALY (no weighting by age, wealth, status).
      *   *Commitment 5: Constant Returns.* A QALY gain is worth the same regardless of baseline health (unless severity weights are added).

  4.  **Evaluating Load-Bearing vs. Optional:**

      *   *Load-Bearing:* Interpersonal Comparability (Cardinal + Level). Without this, you can't sum across people. You can't say Program X (10 QALYs to Group A) is better than Program Y (10 QALYs to Group B) if the units aren't comparable.
      *   *Optional:* The "QALY is a QALY" rule (Commitment 4 & 5). NICE already modifies this with end-of-life criteria. Severity weights modify Commitment 5. So, strict utilitarianism is *not* required for the *practice* of QALY measurement, but it *is* required for the *maximization* rule without modifiers.
      *   *WTP Refusal:* Consistent with the view that health is a special good (need-based) rather than a preference satisfaction good constrained by budget. It rejects the "ability to pay" proxy for "intensity of preference."

  5.  **Addressing the "Anchoring" Problem:**

      *   Why is 0-1 anchoring insufficient?
      *   *Scale Compression:* Different people use the scale differently.
      *   *Adaptation:* Someone with chronic illness might rate their "best possible life" lower than a healthy person's "best possible life."
      *   *Zero Point:* Is death the same "0" for a devout religious person vs. an atheist? Is "worst imaginable health" the same for someone who has experienced it vs. someone imagining it?
