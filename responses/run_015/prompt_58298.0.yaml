  You have stumbled directly into the classic debate between David Lewis and C.B. Martin (the "Finkish" and "Masking" problem). The confusion you feel at 2am is a rite of passage for metaphysicians; your intuitions are tracking real structural problems in the Simple Conditional Analysis ("if dropped, it would break").

  You asked for a precise principle, honesty about trade-offs, and a prediction for the peanut case. I am going to give you the **Intrinsic Categorical Basis Principle**. It is the standard "clean" solution in contemporary metaphysics, but it will require you to make one difficult choice regarding your wet match.

  ### The Principle: Intrinsic Categorical Basis Retention

  > **Definition:** An object $x$ has the disposition $D$ (to manifest $M$ in response to stimulus $S$) at time $t$ if and only if:
  > 1.  **Intrinsic Ground:** $x$ possesses an intrinsic categorical property $B$ (the "basis") at $t$ that grounds $D$.
  > 2.  **Causal Connection:** If $x$ were to undergo $S$ at $t$ while **retaining** $B$, $x$ would manifest $M$ *in virtue of* $B$.

  This principle shifts the focus from "what would happen" (which can be messed with by wizards) to "what is the object made of" (which is harder to fake).

  Here is how this principle handles your cases, and where you will have to compromise.

  ### 1. The IKEA Glass (Clear Case)
  *   **Verdict:** Fragile.
  *   **Why:** It has the molecular structure ($B$) of thin glass. If it undergoes the stimulus (impact) and keeps that structure, it shatters ($M$) *because* of that structure.
  *   **Principle Work:** Satisfies both Intrinsic Ground and Causal Connection.

  ### 2. The Wizard Glass (Mimic Case)
  *   **Verdict:** Not Fragile.
  *   **Why:** You specified the glass is "super chunky and unbreakable." It lacks the intrinsic basis ($B$) for fragility entirely. The breaking is caused by the wizard, not the glass's structure.
  *   **Principle Work:** Fails **Intrinsic Ground**. Even though the conditional "if dropped, it breaks" is true, the *because* clause fails. It breaks in virtue of the wizard, not the basis.

  ### 3. The Wire/Sensor (Finkish Lack)
  *   **Verdict:** Not disposed to light (at the moment of contact).
  *   **Why:** Dispositions are time-indexed. At $t_1$ (before touch), it is live. At $t_2$ (the moment of touch), the sensor kills the current. The stimulus is "touching." At the exact moment of the stimulus, the basis ($B$ = conductivity) is removed.
  *   **Principle Work:** Fails **Retention**. The principle asks: "If it undergoes $S$ while *retaining* $B$..." In this world, it cannot retain $B$ during $S$. Therefore, at $t_2$, it is not disposed to light.

  ### 4. The Bubble-Wrapped Glass (Masking Case)
  *   **Verdict:** Fragile.
  *   **Why:** The glass retains its molecular structure ($B$). The bubble wrap is an *extrinsic* barrier. It prevents the manifestation, but it does not remove the basis.
  *   **Principle Work:** Satisfies **Intrinsic Ground**. The conditional analysis fails here (because it doesn't break in the box), but the Basis Principle succeeds because we look at the glass's properties, not the box's.

  ### 5. The Wet Match (The Hard Trade-Off)
  *   **Your Intuition:** Not Flammable (right now).
  *   **Principle Verdict:** **Flammable (Masked).**
  *   **Why:** This is where I must be honest. To keep the principle clean, **you should drop your intuition here.**
  *   **The Conflict:** You want to say the Bubble-Wrapped Glass is *Fragile* (Masked) but the Wet Match is *Not Flammable* (Lost Disposition). Metaphysically, these are identical cases.
      *   In the Bubble Wrap case, an extrinsic factor (plastic) prevents the manifestation.
      *   In the Wet Match case, an extrinsic factor (water) prevents the manifestation.
      *   Even though water "soaks in," it does not change the categorical basis of the wood/sulfur. If you evaporate the water, the match lights. If you remove the bubble wrap, the glass breaks. The underlying potential ($B$) remains intact in both.
  *   **The Cost:** If you insist the Wet Match is *not* flammable, you must admit the Bubble-Wrapped Glass is *not* fragile. You cannot have it both ways without making the principle messy (e.g., distinguishing "chemical masks" from "physical shields," which is arbitrary).
  *   **Recommendation:** Align the Wet Match with the Bubble Wrap. Call it **Flammable but Masked**. This preserves the unity of the theory: Dispositions depend on the *intrinsic basis*, not temporary environmental inhibitors.

  ### 6. The Peanut Allergy (The Prediction)
  *   **Case:** Friend has severe allergy (immune basis) but takes strong antihistamines (blockers).
  *   **Prediction:** **She is still Allergic.**
  *   **Why:** This is structurally identical to the Bubble-Wrapped Glass and the Wet Match.
      *   **Intrinsic Ground:** Her immune system still produces the IgE antibodies that recognize peanuts. The "basis" of the allergy is present.
      *   **Masking:** The antihistamine blocks the *histamine receptors* (the manifestation pathway), much like the bubble wrap blocks the impact or the water blocks the combustion.
      *   **Fink Check:** The antihistamine does not zap her immune system and make it forget the peanut (that would be a Wizard/Fink case). It just stops the reaction.
  *   **Conclusion:** Just as the glass is fragile in the box, and the match is flammable when wet, the friend is allergic while medicated. The disposition is real; the manifestation is inhibited.

  ### Summary of the Trade-Off
  You asked me to be honest: **You must drop the Wet Match intuition.**

  It feels different because water penetrates the object while bubble wrap surrounds it. But for dispositions, what matters is whether the *causal power* is destroyed or just blocked. Since the match can light again once dry without changing its essence, the power was blocked, not destroyed.

  If you adopt the **Intrinsic Categorical Basis Retention Principle**, you get a clean theory that handles Wizards (no basis), Wires (basis lost on contact), and Bubble Wrap (basis retained). The only cost is accepting that "disposition" means "underlying potential," not "immediate readiness." In a metaphysics seminar, that is the stronger position.
