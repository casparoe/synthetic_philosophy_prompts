  5.  **Drafting the Content (Iterative Process):**
      *   *Self-Correction on Method:* A 9-month fellowship is for *writing* and *finishing*. The method shouldn't look like data collection. It should look like argument construction and drafting. I need to frame the "method" as argumentative strategy.
      *   *Self-Correction on Thought 3:* To avoid the supervisor's objection, I need to emphasize the *interpersonal* nature of the hedge. Individual hedging is "do a bit of A and a bit of B." Interpersonal hedging is "I do A, you do B, we swap outcomes." The proposal must highlight why the *trade structure* adds value over individual hedging. (e.g., comparative advantage in conviction).
      *   *Formatting:* Keep it tight. 2 pages single-spaced is roughly 1000-1200 words. I need to be concise.

  6.  **Final Review against Constraints:**
