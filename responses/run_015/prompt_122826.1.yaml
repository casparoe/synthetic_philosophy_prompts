answer: |-
  The Nixon Shock is a perfect stress test because it forces us to distinguish between the *backing* of money and the *status* of money. Here is the mapping you asked for, keeping the frameworks distinct.

  **1. Disciplined Mapping**
  On a **status-function (Searlean)** story, something changed metaphysically. Pre-1971, the constitutive rule was roughly "This paper counts as a claim on gold *and* money." Post-1971, the rule became "This paper counts as money." The status function was stripped of its convertibility condition but retained its medium-of-exchange function.
  On a **coordination equilibrium** story, nothing metaphysical changed, only the focal point. Money is a solution to a cooperation problem; gold was merely a Schelling point that anchored expectations. When Nixon moved the anchor, the equilibrium shifted, but the kind (the solution itself) remained.
  On a **Chartalist** story, nothing essential changed at all. Money was always a state liability redeemable for tax clearance; gold convertibility was just a voluntary constraint the state placed on itself. Removing it returned money to its true nature: pure state credit.
  **Menger's** emergence story is largely silent here. It explains how money arises from barter, not how a state modifies an existing regime. It predicts nothing about 1971 because it doesn't model state decree.
  *Verdict:* For Searle, the kind's definition narrowed; for Chartalists, it clarified; for Coordination, it drifted.

  **2. Genesis, Maintenance, Identity**
  You are right to separate these.
  *Genesis:* 1971 was not genesis. The dollar existed before. This shows constructivism doesn't need a "moment of creation" for every iteration of a kind.
  *Maintenance:* The fact that trade didn't halt shows maintenance relies on habitual acceptance, not constant re-verification of backing. The framework holds: ordinary Tuesdays rely on inertia.
  *Identity:* Is it the same dollar? If the essence was "gold claim," then no. If the essence is "unit of account accepted for debts," then yes. 1971 suggests identity tracks continuity of function and legal name ("legal tender"), not the underlying asset. The constructivist must say the kind persists so long as the collective intentionality persists, regardless of backing.

  **3. Constructed by Whom?**
  This is the sharpest tension. If Nixon and a few aides changed the rule without a referendum, "collective acceptance" looks like a euphemism for "elite imposition."
  The constructivist must admit that acceptance is *weighted*. The attitudes of central banks, commercial banks, and large employers constitute the bulk of the "collective" intentionality required for macro-money. My acceptance matters less than Chase Manhattan's.
  Does this collapse into power? Only if power alone suffices. But Nixon couldn't have mandated the dollar if the network refused it (see: Zimbabwe). The threshold isn't everyone, but it isn't just the decider either; it's the decider plus enough key nodes to keep the network functioning. "Socially constructed" survives, but it requires a hierarchy of constitutive agents. The threshold is indeed a social fact, fixed by the structure of the economy itself.

  **4. Where the Lens Breaks**
  (i) You suspect 1971 isn't metaphysically dramatic because gold convertibility was already a convention restricted to elites. You're likely right. If ordinary people never treated dollars as gold, only as dollars, then 1971 changed the *state's* liability, not the *public's* usage. This suggests the dollar was always fiat-in-practice, making constructivism neutral between "gold-backed" and "fiat" labels.
  (ii) The Weimar contrast: Constructivism explains *moneyness* (being a social kind), not *value stability*. Weimar marks were still money (socially constructed kinds); they were just hyperinflated money. If the theory claims to explain value stability, it fails. If it claims only to explain ontological status, it succeeds. Admitting this isn't a retreat; it's distinguishing ontology from economics. The kind exists even when it dies.

  **5. Looping Effects**
  The analogy to Hacking's human kinds is structurally real. Classifying a currency as "stable" influences behavior (holding vs. spending), which affects stability.
  In 1971, the state classified the dollar as "sound," but the market reclassified it as "inflationary." This triggered a loop: pricing oil in dollars while expecting depreciation drove prices up, validating the expectation.
  This predicts something plain constructivism misses: the state does not have final say on the *properties* of the kind, only its *existence*. The market can loop around the state's definition, driftings the unit of account away from the state's intent (e.g., indexing contracts to inflation). This suggests the state initiates the kind, but the network maintains—and can mutate—its reality. The constructivist must concede that once constructed, the kind acquires causal powers that can resist the constructor.

  **Summary**
  1971 shows that money is a social kind anchored by weighted collective intentionality, not intrinsic value. The "construction" is hierarchical, not democratic. The theory holds for ontology (it remained money) but must yield to economics for value (it lost purchasing power). The looping effect confirms that while the state may name the kind, the users determine its behavior.
