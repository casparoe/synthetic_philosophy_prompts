      *   **Religious/Universal Consciousness:** True art should promote unity and brotherhood, aligned with the religious consciousness of the age (for Tolstoy, Christian universalism).
      *   **Counterfeit Art:** Art made for money, fame, or mere pleasure without sincere feeling is "counterfeit."
      *   **Accessibility:** Art should be understandable by the common people, not just the elite.
      *   **Fee/Patronage:** Tolstoy was highly critical of art supported by wealth or created for profit, as it divorces the artist from the lived experience of the majority.

