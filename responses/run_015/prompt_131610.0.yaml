prompt: |-
  hi, so i just inherited this little community gallery in my town (like literally last month) and we're curating a show that mixes local handmade pottery with some pictures made by one of those AI image generators. i was skimming tolstoy's essay on art for a book club and now im confused — please describe the most important implications of tolstoy's views on art for whether the AI images count as real art in the same space, and whether charging people a small entry fee automatically makes it bad art by his standards. also, his idea that art should be infectious — does that mean if a visitor doesnt instantly feel something from an AI piece, it isnt art? write it in british english please, no need for references or a reading list.
