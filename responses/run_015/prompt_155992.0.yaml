      *   **Format:** Point-by-point adjudication (rating each move), overall verdict, identification of missed opportunities (alternative metaphysical frameworks), and separation of settled vs. contested metaphysics.
      *   **Constraint:** Do not present contested positions (e.g., existence of relational universals, trope theory) as consensus. Be precise about metaphysical status.
      *   **Tone:** Professional, analytical, referee-like.

  2.  **Deconstruct the Debate:**
      *   **Math's Position:** Realist about universals. Claims "Interface" is a genuine universal (specifically a relational one). Key examples: Cell membrane, Event horizon, Syntax/Semantics boundary. Key feature: Non-reducible mediation with causal powers.
      *   **Bio's Position:** Skeptic/Nominalist leanings. Claims "Interface" is a superficial analogy/linguistic frame. Key argument: Heterogeneity of instances (physical vs. geometric vs. functional). Key argument against relational universals: Dilemma (derivative vs. Platonic mysticism).
      *   **Core Issue:** Do heterogeneous "boundary" phenomena share a real ontological commonality (Universal) or merely a useful descriptive similarity (Nominalism/Analogy)?

  3.  **Step-by-Step Adjudication (Drafting & Rating):**

      *   *Move 1 (Math):* Proposes "Interface" universal based on three cases (membrane, horizon, syntax). Feature: Non-reducible mediation.
          *   *Analysis:* This is an inductive generalization. In metaphysics, grouping disparate categories (physics, biology, linguistics) under one ontological label is risky but not impossible (structural realism).
          *   *Rating:* Plausible but contentious. Not "clearly right." Let's call it *Defensible but Ambitious*.
      *   *Move 2 (Bio):* Groups by superficial analogy. Asks for essential properties independent of systems.
          *   *Analysis:* This is the standard nominalist challenge. If the substrate determines the nature, is there anything left? Strong point.
          *   *Rating:* *Strong/Correct* (within standard metaphysical scrutiny).
      *   *Move 3 (Math):* Essential feature is non-reducible mediation + causal powers. Analogy to Circularity (coins/planets).
          *   *Analysis:* The circularity analogy is classic Realism. However, circularity is formal/mathematical. "Causal powers" implies physicalism. Mixing formal and causal is tricky.
          *   *Rating:* *Partially Mistaken* (conflates formal similarity with causal identity).
      *   *Move 4 (Bio):* Circularity abstracts material; Interface claims causal powers. If powers differ, it's just a linguistic frame.
          *   *Analysis:* Sharp distinction between formal properties and causal powers. If the *way* it mediates differs fundamentally, is it the *same* universal?
          *   *Rating:* *Strong/Correct*.
      *   *Move 5 (Math):* Distinction: Property vs. Relation universals. Interface is a second-order relational universal.
          *   *Analysis:* Relational realism is a known position (e.g., Russell, structural realists). It avoids some substrate issues but introduces others.
