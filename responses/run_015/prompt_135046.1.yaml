answer: |-
  **Project Title:** Architectures of Obligation: A Counterfactual Genealogy of Moral Progress

  **The Question**
  Standard narratives of moral progress rely on the metaphor of the "expanding circle." Popularized by Peter Singer and entrenched in liberal ethics, this model suggests moral concern inevitably radiates outward from the self and family toward strangers, nations, and all sentient beings, eventually flattening into universal equality. This project asks: Is this trajectory inevitable, or is it a historically locked-in artifact of specific rhetorical choices made during the 19th century?

  Specifically, I propose to investigate a counterfactual history of moral framing. What if abolitionists and social reformers had not anchored their arguments in universal human rights, but instead in a framework of "nested loyalty"? In this alternative architecture, obligations remain thicker near the center (family, community) and thin outward based on proximity and reciprocity, never fully flattening into universal equality. Would modern ethics still have converged on universalism, or would we inhabit a layered moral landscape where particularism is structurally preserved?

  **The Gap**
  Current literature on moral progress (e.g., Pinker, Singer, Moody-Adams) largely describes the *extension* of moral status over time. These accounts track *who* is included in the circle, but they rarely interrogate the *shape* of the circle itself. Intellectual historians examine the rise of rights language, but they typically treat the universalist endpoint as a logical necessity rather than one viable path among many. There is a missing analysis of path dependence in conceptual history: we know how the winning argument succeeded, but we do not know if the losing arguments were structurally viable or merely suppressed. By treating the "expanding circle" as a contingent technology rather than a moral law, we can test whether universalism is doing the heavy lifting, or if the circular geometry itself is the primary driver of modern moral intuition.

  **Methodology**
  Over three months, I will employ a method of **counterfactual conceptual genealogy**. This is not archival research; there is insufficient time to dig into unpublished manuscripts or obscure pamphlets. Instead, this is a project of conceptual modeling.

  1.  **Reconstruction:** I will construct a robust "nested loyalty" framework using existing 19th-century particularist texts (e.g., conservative critiques of abolitionism, Hegelian accounts of ethical life) but strip them of their reactionary politics to isolate the structural logic of layered obligation.
  2.  **Simulation:** I will trace the structural implications of this framework forward to the present. If this logic had become dominant, how would it handle modern problems like climate change, global poverty, or AI rights?
  3.  **Stability Comparison:** I will compare the stability of this alternative architecture against the standard universalist model. Does the nested model collapse into tribalism under pressure, or does it offer a more psychologically stable equilibrium than flat universalism?

  **Scope and Constraints**
  This is a high-risk, high-reward conceptual pilot. The three-month timeline precludes empirical verification or deep archival work. The project relies entirely on philosophical coherence and logical consistency. I am not arguing that nested loyalty is *better* than universalism, only that it might have been *possible*. The scope is limited to the structure of obligation, not the content of specific moral duties.

  **Outcomes and Failure Conditions**
  A **positive result** would demonstrate that a non-universalist moral architecture could have sustained modern moral gains (e.g., abolition, welfare) without requiring flat equality. This would suggest that current intervention designs insisting on universalist framing might be fighting against human psychology unnecessarily.

  A **null result** would show that any nested loyalty model inevitably degrades into exclusionary tribalism when scaled, suggesting universalism is not just historically dominant but functionally necessary for large-scale cooperation.

  **Failure** is defined specifically: if the counterfactual framing is too underdetermined to generate a genuinely distinct moral architecture—if "nested loyalty" simply collapses back into universalism upon inspection—then the project fails to prove path dependence. However, even this negative finding is valuable, as it confirms the inevitability of the current model.

  **Deliverables**
  1.  **A Working Paper (approx. 5,000 words):** Detailing the counterfactual model and the stability comparison.
  2.  **A Intervention Design Summary (2 pages):** A plain-language guide for strategists. If moral architectures are path-dependent, how should we frame new moral campaigns (e.g., for animal rights or long-termism)? Should we lean into universalism or experiment with nested framing?

  This project turns a coffee-shop confusion into a rigorous test of moral history. By asking if we are stuck with the "expanding circle" not because it is true, but because it won, we open space for new designs in moral progress.
