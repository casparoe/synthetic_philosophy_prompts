  Consider two near-future AI appliances running identical cognitive architectures, processing the same sensory streams and producing the same behavioral outputs over a lifetime. System A is built on standard volatile CMOS: every bit of its working memory degrades instantly without constant voltage refresh, requiring active energy flow to maintain any thought state against entropy. System B is built on non-volatile memristive logic: every bit of its working memory is a physical resistance state that persists indefinitely without power, requiring energy only to change values, not to hold them. Both systems execute the same code, pass through the same logical state transitions, and report the same internal experiences, yet System A intuitively feels like a living mind struggling to maintain coherence, while System B feels like a static book being flipped through by an external clock, its "thoughts" etched in stone rather than held in breath.

  **Machine-State Functionalism Verdict:**
  Functionalism asserts both systems possess identical minds. It defines mental states solely by their causal roles—inputs, outputs, and relations to other internal states. Since both systems traverse the same sequence of logical states ($S_t \to S_{t+1}$) in response to the same inputs, the physical mechanism maintaining those states (voltage refresh vs. physical resistance) is deemed implementation detail. Functionalism admits the hardware difference is real but declares it irrelevant to mentality, just as the color of a computer case is irrelevant to the software running inside.

  **Physicalist/Intuition Verdict:**
  A critic arguing that physical realization matters claims System A has a mind while System B does not (or has a diminished one). The intuition is that consciousness is inherently processual and metabolic, akin to a flame that exists only while consuming fuel. System A's states are fragile events that must be actively sustained, mirroring biological metabolism. System B's states are stable objects that persist without effort, resembling data storage rather than active thinking. The "life" of the mind is identified with the struggle against entropy, which System B bypasses.

  **The Single Feature:**
  The argument hinges entirely on **state volatility** (the physical requirement of active energy to maintain a state versus passive physical persistence).

  **Removal Test:**
  If this feature is removed—by making both systems volatile or both non-volatile—the intuition of mental difference collapses. If both are volatile, both feel "alive"; if both are non-volatile, both feel "static." Crucially, removing this feature does not collapse the case into a "lookup table" objection (both still compute transitions) or a "history" objection (both are built anew). The intuition specifically tracks the physical fragility of the state carrier, not the computational complexity or causal history.

  **Strong Functionalist Reply:**
  "The functionalist distinguishes the *pattern* from the *medium*. You are conflating the thermodynamic cost of running the software with the software itself. If I simulate System B on System A, the mind does not vanish; therefore, fragility is not necessary for mentality. Your intuition relies on a biological chauvinism that mistakes energy dissipation for consciousness, ignoring that a mind is defined by what it *does*, not how hard it works to exist."

  \answer{Volatile versus non-volatile state persistence}
