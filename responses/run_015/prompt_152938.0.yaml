  Then give me the residue report: which parts of Frankfurt's claim survive cleanly in this translation, which parts have to be distorted — for instance, does "Jones could have done otherwise" map onto "a reachable failover state existed in the state space," or does that smuggle determinism in through the back door? And is there anything essential to the moral-responsibility debate that has no counterpart in distributed-systems language at all? I'm especially curious whether the intuition that Jones is still responsible survives when you frame the setup as a redundant cluster with a dormant shadow node. If something doesn't survive, is that because my engineering vocabulary is missing a dimension, or because Frankfurt's argument was relying on something less rigorous than it looked?
