  I'm taking an online course on philosophy of action and we got to Frankfurt cases last week, but I kept thinking about my day job in distributed sytems engineering — I'm pretty fluent in redundant nodes, failover controllers, Byzantine fault tolerance, split-brain scenarios, consensus protocols like Raft, state replication, and shadow observers that only wake up if a primary diverges.

