prompt: |-
  For the past six years I've chaired the volunteer board of a mid-sized community arts center, and every quarter we face the same kind of meeting: one or more projects we're already deep into, and the question of whether to keep funding them. Recent examples include a membership database migration that is about sixty percent complete with vendor costs ballooning, a co-production with a neighboring theater that is behind schedule and under-subscribed, and the annual winter festival that reliably loses a few thousand dollars but that our community is visibly attached to. In these meetings, board members argue by pointing at how much we've already spent and how much we'd be "throwing away" by stopping, and for years my reflex has been to slap that down with a rule I picked up somewhere: the money is gone either way, sunk costs are irrelevant, and the only thing that matters is a clean comparison of future costs against future benefits.

  Lately, though, I've stopped trusting my own slap-down. Some of the reasons people give for continuing do seem to track the past in ways that might be legitimate rather than confused. Donors who funded the first phase of a project will reasonably wonder about us if we abandon it midway. Stopping and later restarting carries real costs that a simple forward-looking comparison leaves out. There's also something to the thought that our earlier selves spent that money while holding information we may have forgotten, and that discarding their decision for free is its own kind of waste. And I've noticed the pure rule cuts the other way too: anyone who wants to kill a project can reframe every dollar already spent as "sunk" and thereby win the argument without ever discussing what the project is worth going forward. So I no longer believe the question is simply whether honoring sunk costs is rational or irrational; I suspect the real question is when and in what form the past should enter the decision, and I don't have a systematic way of answering it. I have no background in economics or philosophy, so I'm missing whatever structure this question actually has.

  What I'd like is a procedure the board can actually run at one of our quarterly meetings — ninety minutes, seven volunteers with no training, decisions in the range of five to fifty thousand dollars, and a need to leave the meeting with a written one-page record for the minutes. It should be an ordered set of questions, with some indication of what counts as a sufficient answer to each, the points at which it yields a recommendation to continue or stop, and the points at which it has to hand the decision back to us because the question is one of values rather than facts. Crucially, it should separate the genuine fallacy from the reasons for continuing that survive scrutiny — reputational commitments, restart costs, the information embodied in past spending, effects on partners and staff — and say how each of those should be weighed rather than just named. Then run it on three cases: the database migration, the under-subscribed co-production, and the beloved money-losing festival. I'd like you to be honest about where the procedure will misfire, which steps are judgment calls dressed up as procedure, and at least one case where the answer it gives goes against what the board — or frankly, what I — would prefer.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Chair of a volunteer board for a mid-sized community arts center (6 years experience).
      *   **Problem:** Quarterly meetings involve "sunk cost fallacy" arguments (don't waste what we spent) vs. "pure rationality" arguments (only future costs/benefits matter). The Chair realizes the pure rationality rule is too blunt and misses legitimate reasons to consider the past (reputation, restart costs, institutional memory, partner trust).
      *   **Goal:** A practical, 90-minute procedure for 7 untrained volunteers to decide on projects ($5k-$50k range) with a one-page written record.
      *   **Requirements:**
          *   Ordered set of questions.
          *   Indication of sufficient answers.
          *   Decision points (Continue/Stop/Value Judgment).
          *   Distinguish between fallacy and legitimate past-related factors (reputation, restart, information, stakeholders).
          *   Apply to three specific cases: Database Migration, Co-production, Winter Festival.
          *   Honest critique of the procedure (where it misfires, judgment calls disguised as procedure).
          *   At least one case where the procedure's recommendation conflicts with intuition/preference.

  2.  **Analyze the Core Tension:**

      *   *Economic Theory:* Sunk costs are irrelevant. Only marginal costs vs. marginal benefits matter.
      *   *Organizational Reality:* Past spending creates commitments (implicit contracts), signals competence to donors, builds institutional momentum, and stopping has transaction costs (severance, contract termination, morale).
      *   *The Solution:* We need a framework that treats "Sunk Costs" not as *financial* recovery (impossible) but as *signal* and *constraint* generators. The past matters not because the money is recoverable, but because the *act of spending* changed the environment.

  3.  **Drafting the Procedure (The "Sunk Cost Audit"):**

      *   *Time Limit:* 90 minutes total. Needs to be tight.
      *   *Participants:* 7 volunteers. Needs facilitation.
      *   *Output:* One-page record.
      *   *Structure:*
          1.  **Isolation Phase:** Establish the "Pure Future" baseline. (15 mins)
          2.  **Friction Phase:** Identify costs of stopping/changing. (30 mins)
          3.  **Signal Phase:** Assess reputational/relational impacts. (30 mins)
          4.  **Synthesis & Decision:** Weighing and voting. (15 mins)
      *   *Key Distinction:* Differentiate between "I want my money back" (Fallacy) and "Stopping costs us X in trust/contracts" (Real Cost).

  4.  **Refining the Questions (Iterative Process):**

      *   *Draft 1 Idea:* Ask "Will we make money?" -> *Critique:* Too simple, ignores the festival case which loses money but has value.
      *   *Draft 2 Idea:* Ask "What are the future costs?" -> *Critique:* Needs to explicitly separate "Future Operating Costs" from "Termination Costs."
      *   *Draft 3 Idea (Final):* Break it down into "The Forward View," "The Exit Tax," and "The Trust Ledger."
      *   *Decision Rule:* If Forward View is positive, Continue. If negative, check Exit Tax + Trust. If (Future Benefit > Future Cost + Exit Tax + Trust Loss), Continue. Else Stop.
      *   *Wait, Value Judgment:* Some things (Festival) aren't about net positive. They are about Mission Alignment. Need a "Mission Veto" or "Mission Override."

  5.  **Developing the Three Cases:**

      *   **Case 1: Database Migration (60% done, costs ballooning).**
          *   *Future:* High cost to finish, high benefit if done.
          *   *Exit:* Contract penalties, lost data, staff time wasted on transition.
          *   *Trust:* Vendor relationship, donor confidence in tech.
          *   *Likely Outcome:* Continue, but with strict cap.
      *   **Case 2: Co-production (Behind schedule, under-subscribed).**
          *   *Future:* Low revenue, high marketing push needed.
          *   *Exit:* Partner theater angry, potential legal issues, unsold tickets refund.
          *   *Trust:* Peer organization relationship.
          *   *Likely Outcome:* Stop or drastically scale back.
      *   **Case 3: Winter Festival (Reliable loss, community attachment).**
          *   *Future:* Guaranteed loss.
          *   *Exit:* Community anger, volunteer burnout, loss of "front door" visibility.
          *   *Trust:* Donors expect this as "loss leader."
          *   *Likely Outcome:* Continue (Mission/Marketing expense), but reclassify budget.

  6.  **Addressing the "Honest Critique":**

      *   Where does this fail?
          *   Quantifying "Trust" is subjective.
          *   Groupthink risk in the "Signal Phase."
          *   It doesn't solve the *emotional* attachment, just structures it.
          *   It might recommend killing the Festival if the "Trust" valuation is too low, which would be a strategic error.
      *   *Constraint:* Must include one case where the procedure recommends something the Chair dislikes. Let's make it the Festival. The procedure might say "Stop" if the quantified reputational loss doesn't outweigh the cash loss, but the Chair knows intuitively it's the heart of the org. This highlights the limit of procedural rationality.

  7.  **Finalizing the Procedure Structure (The "Past-Weighted Decision Matrix"):**

      *   *Step 1: The Clean Slate (15 mins).* Ignore past. Future Costs vs. Future Benefits (tangible).
      *   *Step 2: The Exit Tax (30 mins).* Hard costs of stopping (contracts, severance, restart).
      *   *Step 3: The Trust Ledger (30 mins).* Soft costs (donor confidence, partner relations, morale). *Crucial:* Convert to dollar estimates or "High/Med/Low" with specific triggers.
      *   *Step 4: The Mission Check (15 mins).* Is this core to identity? (Yes/No).
      *   *Decision Logic:*
          *   If Clean Slate > 0: Continue.
          *   If Clean Slate < 0: Does (Exit Tax + Trust Value) > Deficit?
          *   If Mission Check = Yes: Can override financial deficit up to a cap.

  8.  **Writing the Response:**

      *   *Tone:* Professional, empathetic, practical, slightly academic but accessible.
      *   *Formatting:* Clear headings, bullet points for the procedure, distinct sections for the cases and the critique.
      *   *Check against constraints:* 90 mins? Yes. 7 volunteers? Yes. One-page record? Yes. Distinguishes fallacy from valid past factors? Yes. Critique included? Yes. Counter-intuitive result? Yes.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* Initially, I thought about asking them to put a dollar value on reputation. That's too hard for volunteers. Better to use a "Conversion Rate" or "Threshold." Let's use a "Reputational Multiplier" or simply require a specific "Who would leave?" answer. Let's go with specific stakeholder identification to make it concrete.
      *   *Refinement on the "One Page Record":* I should provide a template for this.
      *   *Refinement on the "Counter-Intuitive Result":* I need to make sure the procedure *actually* outputs a recommendation that feels wrong. If the Festival loses $5k, but the "Trust Cost" of stopping is valued at $10k (in lost donations), the procedure says Continue. That aligns with intuition. To make it conflict, the procedure needs to be strict. Let's say the procedure forces a "Hard Cap" on mission losses. If the Festival loss exceeds the cap, the procedure says Stop, even if the Chair wants to Continue. That works.

  10. **Final Polish:** Ensure the distinction between "Sunk Cost Fallacy" (wanting to recover past spend) and "Switching Costs" (costs incurred *because* of past spend) is crystal clear. This is the theoretical core the user is missing.

  *(Self-Correction during final review)*: Wait, the prompt asks for *one* case where the answer goes against what the board/Chair would prefer. I will make it the **Database Migration**. The procedure might recommend *killing* it because the "Exit Tax" is lower than the "Ballooning Future Costs," but the Chair feels too invested. Or the **Festival**. Let's go with the Festival. The procedure might recommend *killing* it if the "Trust Ledger" isn't quantified high enough, whereas the Chair knows it's vital. Actually, the prompt says "at least one case where the answer it gives goes against what the board — or frankly, what I — would prefer."
  *Decision:* I will structure the procedure to be financially disciplined. In the **Festival** case, the procedure will likely recommend **Cancellation** (because it's a guaranteed loss and "community attachment" is hard to quantify in the "Trust Ledger" without specific donor threats), whereas the Chair *knows* they should keep it. This highlights the limitation of the tool regarding "Mission Value."

  *Wait, re-reading the prompt:* "I suspect the real question is when and in what form the past should enter the decision."
  Okay, I need to make sure the procedure validates the *valid* reasons (reputation, restart costs) but filters the *invalid* ones (just wanting money back).
  Let's refine the "Trust Ledger." If the Board admits "Donors gave specifically for this," that's a hard constraint. If they say "People like it," that's soft.
  Okay, I'll set the "Counter-Intuitive" result on the **Co-Production**. The procedure might say **Continue** because the "Exit Tax" (lawsuit from partner theater) is higher than the loss, but the Chair *wants* to kill it because it's a bad project. This shows the procedure protects the org from liability even when the project is bad.
  *Actually, the Festival is a better candidate for the "Chair's Preference" conflict.* The Chair loves the festival. The procedure, if strict on financials, might kill it. I'll go with that. It illustrates the tension between "Rational Procedure" and "Mission Intuition."

  *Wait, one more check:* "points at which it has to hand the decision back to us because the question is one of values rather than facts." I need to explicitly build a "Value Gate" into the procedure.

  *Final Plan:*
  1. Introduction acknowledging the insight (Sunk Costs vs. Switching Costs/Signaling).
  2. The Procedure (The "Past-Weighted Decision Protocol").
  3. The One-Page Record Template.
  4. Application to the 3 Cases.
  5. Critique (Misfires, Judgment Calls, Counter-Intuitive Result).

