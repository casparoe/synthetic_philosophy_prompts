answer: |-
  You have correctly identified the gap in the standard economic advice. The "sunk cost fallacy" warns against spending good money after bad *to recover past losses*. However, past spending often creates *new realities* (contracts, expectations, institutional knowledge) that make stopping more expensive than the raw financials suggest. The past is not financially recoverable, but it is *causally relevant*.

  Below is a procedure designed for your specific constraints: 90 minutes, seven non-experts, and a need for a clear written record. It separates the fallacy ("We spent $20k, so we must spend $10k more to make that $20k count") from legitimate constraints ("If we stop, we pay a $5k penalty and lose a major donor").

  ### The Past-Weighted Decision Protocol (PWDP)

  **Time:** 90 Minutes
  **Facilitator:** Board Chair (You)
  **Output:** The "Decision Record" (Template provided below)

  #### Phase 1: The Clean Slate (15 Minutes)
  *Goal: Establish the baseline future value without emotional baggage.*
  **Question 1:** If this project did not exist today, and we had the choice to start it now with *new* money, would we?
  *   **Sufficient Answer:** A Yes/No based strictly on projected Future Revenue + Future Mission Value vs. Future Costs.
  *   **Decision Rule:** If **YES**, recommend **CONTINUE**. (Stop here). If **NO**, proceed to Phase 2.
  *   *Note:* This isolates the fallacy. If they wouldn't start it fresh, the only reason to keep it is the cost of stopping.

  #### Phase 2: The Exit Tax (30 Minutes)
  *Goal: Quantify the hard costs of termination.*
  **Question 2:** What specific financial penalties or unavoidable costs occur *only* if we stop?
  *   **Categories to Probe:** Contract termination fees, severance, non-refundable deposits already paid for future dates, cost of migrating data back to old systems.
  *   **Sufficient Answer:** A specific dollar range (e.g., "$5k–$8k"). Vague answers like "it will be messy" are rejected.
  *   **Question 3:** If we stop now, can we restart later? If so, what is the "Restart Premium"?
  *   **Sufficient Answer:** Estimate the cost to re-hire staff, re-market, or re-negotiate contracts in the future (e.g., "It would cost 20% more to restart next year").

  #### Phase 3: The Trust Ledger (30 Minutes)
  *Goal: Quantify the reputational and relational costs.*
  **Question 4:** Who specifically provided money or labor based on the expectation of completion, and what happens if we default?
  *   **Sufficient Answer:** Names or categories of stakeholders (e.g., "The Smith Family Grant," "Partner Theater," "Volunteer Coordinator").
  *   **Valuation:** For each stakeholder, estimate the financial impact of losing them. (e.g., "If we anger the Partner Theater, we lose the venue rental discount worth $3k/year").
  *   **Question 5:** Does stopping this project signal incompetence or instability to our broader donor base?
  *   **Decision Rule:** This is a **Value Gate**. If the Board agrees this signals "existential instability," the financial math is overridden. If it signals "prudent management," it counts as zero cost.

  #### Phase 4: Synthesis & Vote (15 Minutes)
  *Goal: Make the call.*
  **Calculation:**
  1.  **Net Future Deficit:** (Future Costs - Future Benefits) from Phase 1.
  2.  **Total Stopping Cost:** (Exit Tax + Restart Premium + Trust Ledger Value) from Phases 2 & 3.
  3.  **Comparison:**
      *   If **Total Stopping Cost > Net Future Deficit**: Recommend **CONTINUE** (It is cheaper to finish than to quit).
      *   If **Net Future Deficit > Total Stopping Cost**: Recommend **STOP** (The loss of finishing is greater than the pain of quitting).
      *   **Mission Override:** If the project is deemed "Core Identity" (Value Gate in Phase 3), the Board may vote to Continue despite a financial deficit, but must designate a specific "Subsidy Cap" (e.g., "We will lose up to $5k, but no more").

  ---

  ### The Decision Record (One-Page Template)

  **Project Name:** ___________________
  **Date:** ___________________

  **1. Clean Slate Verdict:** [ ] Would Start Fresh [ ] Would Not Start Fresh
  **2. Future Net Position (3 yrs):** $__________ (Positive/Negative)
  **3. Exit Tax (Hard Costs):** $__________
  **4. Trust/Restart Cost (Estimated Value):** $__________
  **5. Total Cost of Stopping:** $__________

  **DECISION:**
  [ ] **CONTINUE** (Reason: Future Positive OR Stopping Cost > Future Deficit)
  [ ] **STOP** (Reason: Future Deficit > Stopping Cost)
  [ ] **CONTINUE WITH CAP** (Mission Override; Max Loss Allowed: $_______)

  **Key Risks Identified:** (e.g., "Donor X may withdraw," "Staff morale dip")
  **Signatures:** ___________________

  ---

  ### Application to Your Three Cases

  Here is how the PWDP runs on your current docket. I have made reasonable assumptions based on typical arts administration scenarios.

  #### Case 1: Database Migration (60% complete, costs ballooning)
  *   **Phase 1 (Clean Slate):** **No.** If we didn't have one, we might look at cheaper SaaS options rather than a custom migration.
  *   **Phase 2 (Exit Tax):** High. Contract termination fees (20% of remaining), staff hours to revert to spreadsheets, data corruption risk during export. **Est: $15,000.**
  *   **Phase 3 (Trust Ledger):** Moderate. Donors who funded Phase 1 want to see a working system. Vendor relationship damaged. **Est: $5,000 (in future vendor pricing/donor confidence).**
  *   **Phase 4 (Synthesis):**
      *   Future Deficit to Finish: $20,000 (Ballooned costs).
      *   Total Cost of Stopping: $20,000 ($15k Exit + $5k Trust).
      *   **Result:** **Toss-up / Continue with Cap.** The cost to stop equals the cost to finish. However, finishing yields a working asset; stopping yields nothing.
      *   **Recommendation:** **CONTINUE**, but freeze scope. No new features.
      *   **Record:** "Continue. Rationale: Exit tax equals completion cost. Asset value tips scale."

  #### Case 2: Co-Production (Behind schedule, under-subscribed)
  *   **Phase 1 (Clean Slate):** **No.** No new money would touch this.
  *   **Phase 2 (Exit Tax):** Moderate. Marketing materials already printed (sunk, but unsold tickets need refund processing). Contractual penalty for pulling out of venue. **Est: $8,000.**
  *   **Phase 3 (Trust Ledger):** High. Neighboring theater is a peer. Abandoning them mid-stream damages long-term collaboration possibilities. **Est: $10,000 (in lost future partnership value).**
  *   **Phase 4 (Synthesis):**
      *   Future Deficit to Finish: $12,000 (Projected loss on tickets).
      *   Total Cost of Stopping: $18,000 ($8k Exit + $10k Trust).
      *   **Result:** **CONTINUE.**
      *   **Recommendation:** It is financially irrational to stop. The loss of finishing ($12k) is less than the loss of stopping ($18k).
      *   **Record:** "Continue. Rationale: Stopping cost exceeds projected loss. Protect partner relations."

  #### Case 3: Winter Festival (Reliable loss, community attachment)
  *   **Phase 1 (Clean Slate):** **No.** It loses money every year.
  *   **Phase 2 (Exit Tax):** Low. No contracts, mostly volunteers. **Est: $1,000.**
  *   **Phase 3 (Trust Ledger):** Unclear. "Community attachment" is vague. Unless specific donors tie gifts to the Festival, the "Trust Value" is hard to quantify. Let's assume the Board estimates it at $3,000 in "goodwill."
  *   **Phase 4 (Synthesis):**
      *   Future Deficit to Finish: $5,000 (Reliable loss).
      *   Total Cost of Stopping: $4,000 ($1k Exit + $3k Trust).
      *   **Result:** **STOP.**
      *   **Recommendation:** The procedure indicates you should cancel the festival. The financial loss of running it ($5k) is greater than the reputational cost of killing it ($4k).
      *   **Record:** "Stop. Rationale: Deficit exceeds stopping costs. No specific donor mandates identified."

  ---

  ### Honest Critique: Where This Procedure Misfires

  You asked for honesty about the limitations. This procedure is a tool, not an oracle. Here is where it will fail you.

  **1. The "Trust Ledger" is a Judgment Call Dressed as Math**
  In Phase 3, asking volunteers to put a dollar value on "community attachment" or "donor confidence" is inherently subjective. In the **Winter Festival** case above, the procedure recommended **STOP**. I suspect you, the Chair, would prefer to **CONTINUE**. You know intuitively that the Festival is the "front door" of the arts center; it brings in new faces who later become members. The procedure failed to capture *latent* value because it relies on the Board's ability to articulate it in the moment. If your Board is risk-averse, they will undervalue "Trust," leading to the death of beloved programs.
  *   *Mitigation:* You must enforce the "Mission Override" in Phase 4. If the Chair declares the Festival "Core Identity," the financial calculation is suspended, but you must set a hard loss cap (e.g., "We lose $5k, but if it hits $6k, we cancel").

  **2. It Rewards Bad Contract Management**
  In the **Co-Production** case, the procedure recommended **CONTINUE** solely because the penalty for stopping was high. This creates a moral hazard. If your board knows that signing punitive contracts protects a project from cancellation, they may sign punitive contracts to shield pet projects from future scrutiny.
  *   *Mitigation:* The "Decision Record" must include a line item: "Lesson for Future Contracts." Acknowledge that the decision to continue is a penalty for past drafting errors, not an endorsement of the project's quality.

  **3. The "Clean Slate" Bias**
  Phase 1 asks: "Would we start this today?" This biases heavily against innovation. No new, risky project looks good on a Clean Slate comparison against established operations. If you use this procedure for *new* projects in their first year, you might kill everything.
  *   *Mitigation:* Explicitly state this procedure is for **Projects >50% Complete** or **Legacy Programs**. Do not use it for initial grant approvals.

  **4. The "Sunk Cost" Smuggler**
  Even with this structure, a savvy board member can smuggle sunk costs into Phase 2. They might argue, "If we stop, the $50k we already spent is wasted." That is the fallacy. You must ruthlessly intervene: "The $50k is gone regardless. Does stopping *add* a new cost?" If the answer is no, it doesn't go in Phase 2.

  ### Final Recommendation for the Chair

  The procedure works best when it forces the Board to admit *why* they are continuing.
  *   In the **Database** case, it forces them to admit they are continuing to avoid termination fees, not because the project is great.
  *   In the **Festival** case, it forces them to admit they are continuing for *mission*, not money. This allows you to budget it as a "Marketing Expense" rather than a "Revenue Project," which stops the annual argument about why it loses money.

  Use the procedure to generate the **Decision Record**, but reserve your Chair's prerogative to invoke the **Mission Override** when the math conflicts with the organization's soul. Just ensure that when you do, you write down exactly why, so your future self (or successor) knows it was a value choice, not a math error.
