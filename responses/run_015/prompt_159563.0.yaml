answer: |-
  This is a really sharp reconstruction of the tension between Taurek's separatism and Parfitian reductionism, and you are right to feel that something has to give. You have basically built a reductio ad absurdum that forces you to choose between common sense about prudence, common sense about aggregation, or Taurek's specific principle about reasons. Since you want to keep the Taurek conclusion that we should flip a coin in the five versus one case, you are looking for a way to block the slide into absurdity in the Ada case without abandoning the core insight that got you to Taurek in the first place. I think the rot sets in at premise five, but fixing it requires you to pay a theoretical price that Taurek himself might not have been willing to pay, and it requires you to be explicit about where the philosophical consensus actually lies versus where it is still fought over.

  To see why premise five is the breaking point, we need to look closely at what you are doing with the concept of a subject in premise one and how it interacts with reductionism in premise four. Your argument relies on the idea that if there is no single entity that experiences the total loss, there is no reason to prevent it. In the five versus one case, you say there is no group-person who loses five lives, so there is no aggregated loss. In the Ada case, you say there is no single stage that loses nine years, so there is no aggregated loss there either. The mistake here is assuming that reductionism eliminates the subject of a life in the same way that separatism eliminates the subject of a group. Even on a reductionist picture, where a person is just a series of connected stages, that series itself functions as the subject of prudential concern. When Ada dies early, it is not just that stage forty-one loses something or stage fifty fails to exist; it is that the entire series which constitutes Ada is shorter than it could have been. The series is the subject of the loss, even if the series is not a further fact over and above the stages. In contrast, in the five versus one case, there is no series, no psychological connectedness, and no unified structure that contains all five people. There is just a collection. So you can reject premise five by saying that the person-series counts as a subject for the purpose of intrapersonal aggregation, while the collection of distinct persons does not count as a subject for interpersonal aggregation.

  However, you asked what you pay for making that move, and this is where things get contested. If you say the person-series counts but the group does not, you are drawing a moral distinction based on psychological connectedness and continuity. This is stable, but it commits you to the view that the boundary between persons is morally significant even if, metaphysically, it is not as deep as we used to think. Derek Parfit argued that reductionism makes the difference between intrapersonal and interpersonal cases less significant, which pushes us toward utilitarianism where numbers do count across persons. To resist that push and stay with Taurek, you have to argue that the degree of connectedness within a life is sufficient to justify aggregation, while the lack of connectedness between lives is sufficient to block it. You are paying the cost of defending a moral significance for personal identity that your metaphysics might be undermining. You have to say that even if persons are just stages, the stages in a life are hooked up in a way that matters for reasons, whereas stages across lives are not. This is not a settled view. Many ethicists think that if reductionism is true, we should just accept that numbers count across lives too. Others, like contractualists, think numbers don't count because of fairness, not because of metaphysics.

  There is another way to save your position that might be cheaper, which involves rejecting premise one rather than premise five. Premise one says a consideration can count only if it is a fact about what some individual stands to lose. This is a very strong constraint on reasons. You could keep the Taurek conclusion without buying into the reductionist worry by adopting a contractualist framework, like the one T.M. Scanlon develops. On this view, the reason we do not always save the greater number is not because there is no aggregated loss, but because the one person has a complaint that cannot be overridden simply by summing the complaints of the five. In the Ada case, there is only one person to consult, so her complaint about losing nine years outweighs her complaint about losing one year. In the five versus one case, you cannot justify to the one person that she should be sacrificed for the five, because from her standpoint the loss is total. This approach lets you keep the intuition that Ada should be saved without forcing you to say that numbers count across persons in the way utilitarians do. The cost here is that you have to abandon the idea that morality is just about maximizing good outcomes and accept that it is about justifiability to individuals. This is a major commitment, but it is a well-trodden path in contemporary moral philosophy.

  You also asked about the consensus on these issues, and it is important to be clear that Taurek's view is very much a minority position among professional ethicists. Most philosophers working on this problem think the numbers do count, usually based on some form of utilitarian aggregation or a moderate contractualism that allows numbers to tip the scale in extreme cases. The idea that we should flip a coin between one life and five lives is widely regarded as counterintuitive, though it has defenders who prioritize fairness over outcome maximization. The reductionist challenge you raised is also contested. While Parfit's reductionism is influential, many philosophers argue that even if persons are reducible to stages, the practical difference between intrapersonal and interpersonal trade-offs remains robust enough to support common sense morality. So when you say premise six seems obviously false, you are in good company, but you are also fighting against a strand of thought that says our common sense intuitions about persons are metaphysically confused. If you want to say premise six is false while keeping Taurek's conclusion, you are siding with the common sense intuition about prudence against the radical implications of reductionism, while simultaneously siding with Taurek against the common sense intuition about aggregation. That is a tricky tightrope to walk.

  If I were in your shoes and wanted to keep the coin flip conclusion without accepting that the doctor has no reason to save Ada's extra years, I would reject the inference in premise two rather than premise one or five. Premise two says that because no one loses five lives, the difference in numbers gives no reason at all. You can argue that the difference in numbers does give a reason, just not a decisive one. You can acknowledge that there are five separate full-strength reasons sitting there, as you suggested in your email, but maintain that fairness constraints prevent those reasons from simply summing up to override the one person's claim. This allows you to say there is a reason to save the five, which explains why we feel the pull of the numbers, but maintain that the right action is still to give everyone an equal chance. This avoids the reductionist trap entirely because you are not denying the existence of reasons in the five versus one case, you are just denying that they aggregate decisively. In the Ada case, there is no fairness constraint between different times of her life blocking the aggregation of her interests, so the reasons to save her future years sum up easily.

  The price you pay for this specific solution is that you have to accept a pluralistic view of practical reasoning where reasons of outcome and reasons of fairness can conflict without one always winning. You cannot be a monist about value. You have to say that sometimes the fair thing to do is not the thing that prevents the most loss, and that this is not a mistake but a feature of morality. This is defensible, but it requires you to give up the clean simplicity of Taurek's original claim that the numbers give no reason at all. Taurek wanted to say there is no aggregated loss, so there is no reason. You are moving to a position that says there is an aggregated loss, so there is a reason, but fairness blocks it. That is a significant revision to the view you started with, but it saves you from the absurdity about Ada and it saves you from having to defend a metaphysical distinction between persons and stages that might not hold up.

  Ultimately, the argument you built is valid, which is why it feels so rattling. If you accept the premises, the conclusion follows. But premise one is doing too much work. It is trying to be a metaphysical constraint on reasons that applies equally to time and persons. If you loosen it to allow that reasons can aggregate within a unified life but not across separate lives, you save the Ada case. If you then explain the lack of aggregation across lives by appealing to fairness rather than the non-existence of reasons, you save the Taurek case. The cost is that you end up with a more complex moral theory than the one Taurek proposed, one that balances outcome-based reasons with agent-relative constraints. That is probably a price worth paying to avoid telling the doctor that letting Ada die early is no worse than letting her die late. Most people working on this would tell you that biting the bullet on Ada is too high a cost for saving Taurek, so you should adjust the theory to fit the intuition about Ada, even if it means softening the hard line on why numbers do not count.

  I hope this helps untangle the knot. It is a great puzzle because it shows how easily metaphysical views about persons can bleed into ethical views about aggregation, and how hard it is to keep them separate. You are right to worry that if the argument works for Taurek, it works against prudence, and since we cannot live without prudence, the argument must be missing a distinction. The distinction lies in the unity of the subject, not just the existence of loss. Keep that in mind and you should be able to hold onto the coin flip without losing your mind about Ada.
