  I counted up the pleasure gained from you,
  And weighed the comfort given by the wall,
  Reducing both to one internal state,
  Each virtue was a separate thing apart,
  A use that time and habit had made known,
  As if the good were scattered on the path,
  And waiting to be gathered in that place,
  I treated every fragment as distinct.
  But splitting them dissolves the thing itself.
  For value is not additive or spread,
  Nor how the severed parts can ever relate.
  It lives within the whole, not parceled out.
  This goes beyond the grasp that seeks embrace,
  And leaves it standing simply as it is.
