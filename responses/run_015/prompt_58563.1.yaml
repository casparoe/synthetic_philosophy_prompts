          *   Implications for holding resource-limited, learning agents to full EU coherence.
      *   **Constraints:** No formal results, no literature references. Intuitive but precise.

  2.  **Initial Brainstorming & Core Concepts:**

      *   *Money Pump Argument:* If you prefer A to B, B to C, and C to A, I can make you pay to switch A->B, B->C, C->A, leaving you back at A but poorer. This implies irrationality.
      *   *The Catch:* This assumes preferences are stable and outcomes are defined narrowly (just the object, not the history of choices).
      *   *Individuation of Outcomes:* Is "Having Plan A after paying $5" the same outcome as "Having Plan A"? If not, the cycle breaks.
      *   *Dynamic Consistency:* Do I want my future self to make the same choice I would make now?
      *   *Bounded Rationality:* It costs computation to be consistent. Is it worth it?
      *   *Learning:* If my preferences change because I learned something new, that's not irrationality; that's updating.
      *   *Framing:* If the *description* changes the value (e.g., "cost salient" vs. "flexibility salient"), is that a preference reversal or a different context?

  3.  **Structuring the Response:**

