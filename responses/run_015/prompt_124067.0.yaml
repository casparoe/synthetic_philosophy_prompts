prompt: |-
  I'm a high school student writing a paper for an ethics seminar, and I'd like a proper essay rather than a list of considerations on each side.

  In class we discussed the claim that an action has moral worth only when the agent does it because it is the right thing to do — from duty, we put it, rather than from sympathy, habit, guilt, or self-interest — even when the action itself is exactly what morality demands. I want to test that claim against a case I made up and haven't been able to find discussed anywhere.

  Amara finds a wallet full of cash in an empty corridor. No one is watching and she could keep it with no real risk of being found out, and she feels no sympathy for the stranger who lost it. What moves her is this: she has complete trust in her older brother's judgment about what matters, because he has been right about such things again and again, and he has told her that the decisive consideration here is that the money belongs to someone else, so returning it respects that person as its owner. Amara finds that consideration thin and doesn't really see why it should move her. She is not acting to please her brother, or to be the kind of person he admires, or from a rule she has absorbed from him; she simply takes it, on his authority, that this is the reason that settles the matter, and she returns the wallet for that reason. Her brother is right that it is the right-making reason.

  Write an essay on whether Amara's action has full moral worth, diminished moral worth, or none at all. Set out the strongest case on each side and then defend a verdict — please don't conclude merely that the answer depends on how we define our terms. Then briefly spell out what your verdict implies about the duty requirement: if deference of Amara's kind can be enough, is a child who reliably does the right thing on good authority, without yet grasping why, a paradigm case of moral worth? And if it isn't enough, what exactly is missing in her case that is present when someone acts on a reason they grasp for themselves?
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **User:** High school student writing a paper for an ethics seminar.
      *   **Topic:** Moral worth and the "duty requirement" (Kantian flavor: action has moral worth only if done *from* duty/right reason, not just *in accordance* with duty).
      *   **Specific Case:** Amara finds a wallet. No sympathy, no fear of getting caught. She returns it *solely* because her trusted brother told her the right reason ("it belongs to someone else/respects ownership"), even though she finds that reason "thin" and doesn't fully grasp it herself. She acts on his authority, not to please him, but because she trusts his judgment on the *reason*.
      *   **Format:** Proper essay (not a list), strong cases on both sides, defended verdict (no "it depends"), implications for the duty requirement (specifically regarding children/authority).
      *   **Tone:** Academic but accessible (high school seminar level), rigorous, philosophical.

  2.  **Deconstruct the Case (Amara):**
      *   *Action:* Returning the wallet (in accordance with duty).
      *   *Motivation:* Deference to brother's authority regarding the *right-making reason*.
      *   *Internal State:* She doesn't feel the force of the reason herself ("finds that consideration thin"). She isn't acting out of love for the brother or habit, but epistemic trust in his moral judgment.
      *   *Key Question:* Does acting on a right reason *via authority* count as acting *from* the right reason?

  3.  **Identify the Philosophical Landscape:**
      *   **Kant:** The classic source of the "moral worth from duty" claim. For Kant, the motive must be reverence for the moral law. Heteronomy (acting on another's will) is usually problematic.
      *   **Aristotle:** Focuses on virtue and understanding. A virtuous agent must choose the act *for its own sake* and *knowingly*.
      *   **Contemporary Debates:** Mark Baron, Michael Stocker, Bernard Williams (critiques of Kant), but specifically the issue of *moral testimony* and *epistemic dependence*. (e.g., Sarah McGrath, Allison Hills).
      *   **The Twist:** Amara isn't just obeying a rule ("Brother said return it"); she is accepting a *reason* ("Brother says *this is why*"). But she doesn't grasp the reason's force.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be engaging and relevant. *Authority and Moral Worth: The Case of Amara.*
      *   **Introduction:**
          *   Hook: The intuitive appeal of doing right for the right reason.
          *   Context: The Kantian claim (moral worth requires duty).
          *   The Case: Introduce Amara briefly.
          *   Thesis: Amara's action has *diminished* moral worth (or arguably none, but "diminished" allows for nuance). Let's aim for a strong verdict: It lacks *full* moral worth because moral worth requires a first-personal grasp of the value, not just epistemic reliance. *Correction:* To make it interesting, I should argue for a specific verdict. Let's argue it has *diminished* worth, bordering on none, because moral agency requires autonomy. Actually, the prompt asks to defend a verdict. A nuanced "diminished" is safer but "none" is stronger. Let's go with **diminished/defective moral worth**. It acknowledges the right action and right *type* of reason, but faults the *mode* of access.
          *   *Refinement:* Let's argue that it lacks *full* moral worth. It is praiseworthy but not morally worthy in the highest sense.

      *   **Body Paragraph 1: The Case for Full Moral Worth (The Charity/Trust Argument).**
          *   Focus on the outcome and the alignment with reason.
          *   She *is* acting on the right reason (property rights), just via a proxy.
          *   Epistemic humility is a virtue. We rely on experts in science; why not morality?
          *   If the brother is right, and she trusts him *because* he is reliable on truth, she is indirectly tracking the moral truth.
          *   Analogy: A student solving a math problem because the teacher said the formula works, even if they don't understand the derivation. Is it "good math"?

      *   **Body Paragraph 2: The Case for No/Diminished Moral Worth (The Autonomy/Grasp Argument).**
          *   Focus on the internal connection to the value.
          *   Moral worth isn't just about tracking truth; it's about valuing the right things.
          *   Amara finds the reason "thin." She doesn't respect the owner; she respects the brother's *say-so* about the owner.
          *   This is heteronomy (Kant). She is not legislating for herself.
          *   The "moral worth" is in the appreciation of the moral demand, not just compliance with it.

      *   **Body Paragraph 3: Defense of the Verdict.**
          *   Verdict: Diminished/Defective Moral Worth.
          *   Why? Because moral worth is partly constitutive of moral character. Character requires owning the values.
          *   Amara is morally lucky. If the brother were wrong, she would be wrong.
          *   The "credit" goes partly to the brother.
          *   However, it's not *zero* worth because she exercised the virtue of trust in a reliable moral guide, which is better than acting on self-interest.

      *   **Body Paragraph 4: Implications for the Duty Requirement (Children/Authority).**
          *   If Amara (high schooler?) lacks full worth, what about a child?
          *   Children are paradigm cases of *moral development*, not *moral worth* in the full sense.
          *   This implies the duty requirement isn't binary (worth/no worth) but scalar (degrees of autonomy).
          *   What is missing? *First-personal appreciation.* The difference between knowing *that* something is right and knowing *why* it is right in a way that moves you.

      *   **Conclusion:**
          *   Summarize main points.
          *   Final thought on moral maturity.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the specific detail that she isn't acting to please the brother? Yes, this is crucial. It distinguishes her from simple obedience. She is treating him as an epistemic authority.
      *   *Check:* Did I avoid "it depends"? Yes, I need to take a stand. I will argue that full moral worth requires *understanding*, not just *deference*.
      *   *Tone Check:* Keep it formal but clear. Avoid overly dense jargon without explanation.
      *   *Prompt Requirement:* "Briefly spell out what your verdict implies about the duty requirement." I need a dedicated section for this.

  6.  **Final Polish:**
      *   Ensure the transition between the Amara case and the child/authority implication is smooth.
      *   Make sure the distinction between "in accordance with duty" and "from duty" is clear in the context of testimony.
      *   *Key Philosophical Concept:* Moral Testimony. The debate is whether acting on moral testimony deprives an agent of moral worth. (Reference Hills, "Moral Testimony"). I won't cite her explicitly (high school paper), but I'll use the logic.
      *   *Decision:* I will argue that Amara's action has **diminished moral worth**. It is better than acting on self-interest, but it falls short of the Kantian ideal because she lacks *autonomous recognition* of the moral law.

  7.  **Drafting the Content:** (Mental Outline)
      *   Intro: Kant's claim, Amara's case, Thesis (Diminished).
      *   Argument for Full Worth: Epistemic reliance is rational; she is aligned with the truth.
      *   Argument for No/Diminished Worth: Moral worth requires valuing the end, not just the instruction. Heteronomy.
      *   Verdict Defense: Moral worth is about the agent's relationship to value. Amara's relationship is mediated.
      *   Implications: Children are trainees. Full worth requires grasping the "why."

  8.  **Final Review against constraints:**
      *   Essay format? Yes.
      *   Strong case on each side? Yes.
      *   Defend a verdict? Yes.
      *   No "it depends"? Yes.
      *   Implications for duty requirement/children? Yes.

