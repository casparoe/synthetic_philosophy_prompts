answer: |-
  **Title:** The Mediated Will: Moral Worth and Epistemic Deference in the Case of Amara

  **Introduction**
  A central claim in modern moral philosophy, most famously associated with Immanuel Kant, is that an action possesses moral worth only if it is done *from* duty. It is not enough to do the right thing; one must do it because it is the right thing, motivated by a recognition of the moral demand itself. Actions driven by sympathy, habit, or self-interest, even when they align perfectly with morality, are often said to lack this specific distinctive worth. This seminar paper tests that claim against a specific case of epistemic deference. Amara returns a lost wallet not because she feels the force of property rights, nor to please her brother, but because she trusts her brother's judgment that property rights are the decisive reason. She acts on the right reason, but only via his authority. This essay will argue that while Amara's action is praiseworthy, it possesses **diminished moral worth**. Full moral worth requires a first-personal grasp of the moral reason, not merely a trusted report of it.

  **The Case for Full Moral Worth**
  The strongest argument for granting Amara full moral worth rests on the nature of rational trust and the alignment of her will with the moral truth. In many areas of life, we accept that relying on expert testimony is a rational way to form beliefs. If a student solves a complex physics problem using a formula provided by a trusted teacher, we do not say the solution is less "correct" because the student did not derive the formula herself. Similarly, morality can be viewed as a domain where some agents have greater discernment than others. Amara's brother has proven reliable; her trust is not blind obedience but a reasoned judgment about his competence.

  Furthermore, Amara is not acting on a motive unrelated to morality, such as fear or reward. She is acting specifically because she believes there is a moral reason to return the wallet ("it belongs to someone else"). By deferring to her brother, she is effectively outsourcing the *recognition* of the duty while retaining the *commitment* to follow it. If moral worth is about being moved by the right considerations, and Amara is moved by the consideration "this is the right thing to do" (validated by her brother), then she satisfies the core requirement. To deny her full worth would be to demand an unrealistic level of moral self-sufficiency, ignoring that human moral understanding is often socially scaffolded.

  **The Case for Diminished or No Moral Worth**
  The counter-argument focuses on the internal relationship between the agent and the value of the action. Moral worth is not merely about tracking moral truth; it is about *valuing* the right things. When Amara returns the wallet, she admits that the consideration of ownership feels "thin" to her. She does not respect the owner's rights because she sees them as inherently demanding; she respects them because her brother says they are demanding. Her motive is technically "do what is right," but her access to *what makes it right* is entirely external.

  This distinction matters because moral worth is traditionally tied to moral autonomy. In the Kantian framework, acting from duty means legislating the moral law for oneself through reason. Amara is acting heteronomously; her will is determined by another's judgment rather than her own rational grasp of the good. If the brother were wrong, Amara would be wrong, and she would have no internal resources to correct him. Her action is morally fragile. Because she does not appreciate the value of the owner's claim herself, she is not truly honoring the owner; she is honoring her brother's instruction. Therefore, the action lacks the distinctive quality of an agent who acts because *they* see the moral demand.

  **Defense of the Verdict**
  The verdict that Amara's action has **diminished moral worth** best captures the nuance of her situation. It is not that her action has *no* worth; she has suppressed her self-interest and aligned her will with the moral truth through a virtuous disposition of trust. This is superior to acting on impulse or greed. However, it falls short of the paradigm case of moral worth because the source of her motivation is mediated.

  Full moral worth implies a unity between the agent's understanding and the agent's action. In Amara's case, there is a gap. She is doing the right thing for the right reason, but the reason is not *hers* in the full sense; it is on loan. We praise the action, but we praise her character less than we would praise someone who returned the wallet because they personally felt the weight of the stranger's loss. Moral worth is partly a measure of moral maturity, and maturity requires owning one's values. Amara is morally creditworthy for her humility and trust, but she does not receive the full credit reserved for moral insight.

  **Implications for the Duty Requirement**
  This verdict has significant implications for how we understand the duty requirement, particularly regarding children or moral novices. If deference of Amara's kind is insufficient for *full* moral worth, then a child who reliably does the right thing on good authority, without grasping why, cannot be a paradigm case of moral worth. They are instead paradigm cases of *moral development*.

  This suggests that the duty requirement is not a binary switch but a scalar ideal. The requirement to act "from duty" implies a requirement to act from an *understanding* of duty. What is missing in Amara's case, and in the case of the obedient child, is **first-personal appreciation**. When an agent grasps a reason for themselves, they recognize the value of the end (e.g., the owner's rights) directly. When they act on authority, they recognize the value of the authority's judgment. The former constitutes autonomy; the latter constitutes training.

  Therefore, the duty requirement should be interpreted as demanding that the agent's own rational faculties endorse the action. While we should encourage children and novices to follow authority, we must acknowledge that they are not yet fully participating in the moral community as autonomous agents. Their actions are in accordance with duty and possess a provisional worth, but the full dignity of moral worth is reserved for those who can see the light of the moral law with their own eyes. Amara stands on the threshold of this dignity, but she has not yet crossed it.
