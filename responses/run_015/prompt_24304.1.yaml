answer: |-
  **JOINT STATEMENT ON DIACHRONIC COHERENCE AND SYNCHRONIC MAXIMIZATION**

  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on Decision-Theoretic Norms for Sequential Agents
  **Signatories:** [Representative, Diachronic Coherence Camp] & [Representative, Synchronic Maximization Camp]

  ### PREAMBLE

  We, the undersigned, acknowledge a persistent divergence in decision theory regarding the normative status of agents facing sequences of choices. Specifically, we address the implications of "money pump" arguments (for preferences) and "Dutch book" arguments (for credences). While we agree on the formal mechanics of these phenomena, we diverge on their normative interpretation. This document codifies our descriptive agreements and isolates the precise locus of our normative disagreement, specifically with regard to the specification of rational agency in artificial systems.

  ---

  ### PART I: AGREED PROPOSITIONS (DESCRIPTIVE AND FORMAL)

  We affirm the following claims as uncontroversial descriptions of the decision-theoretic landscape. Neither party disputes the mathematical or causal mechanics described below.

  1.  **The Mechanics of Incoherence:** An agent possesses incoherent credences if their degrees of belief violate the probability axioms (e.g., $P(A) + P(\neg A) \neq 1$). An agent possesses incoherent preferences if their ordering of outcomes violates axioms such as transitivity or independence (e.g., $A \succ B \succ C \succ A$).
  2.  **The Existence of Exploitable Strategies:** Given incoherent credences, a bookmaker can construct a set of bets (a Dutch Book) that the agent accepts as fair individually but which guarantees a net financial loss regardless of the state of the world. Given incoherent preferences, an exploiter can construct a sequence of trades (a Money Pump) that the agent prefers individually at each step but which leaves the agent in a state strictly worse than their starting state by their own initial lights.
  3.  **Local Optimality at Each Node:** In a standard money pump scenario, at every decision node $t_n$, the agent calculates the expected utility (EU) of the available options based on their credences and preferences *at $t_n$.* At every node, the option selected by the agent has higher expected utility than the alternative *relative to the agent's state at $t_n$.*
  4.  **Global Sub-optimality:** Despite the local optimality described in Claim 3, the terminal state of the agent after the sequence is complete is strictly dominated by the initial state (or a state achievable via a different sequence) relative to the agent's *initial* preferences.
  5.  **Predictability:** An agent with fixed incoherent preferences/credences is predictably susceptible to these losses. An observer with coherent beliefs can foresee the loss before the agent begins the sequence.
  6.  **AI Implementability:** In the context of artificial agents, both synchronic constraints (maximize EU now) and diachronic constraints (maintain coherence over time) are implementable via code. It is technically feasible to program an agent to refuse a locally positive-EU trade to prevent a future global loss, just as it is feasible to program an agent to always accept locally positive-EU trades.

  ---

  ### PART II: TABLE OF RESIDUAL DISAGREEMENTS

  The following table isolates the normative and metaphysical claims where consensus was not reached. For each disagreement, we identify the **Crux** (the underlying sub-question), a **Test Case** (a concrete scenario bearing on the crux), and the **Predicted Verdict** from each camp.

  | ID | Disagreement Statement | Crux (Underlying Sub-Question) | Test Case / Evidence | Camp A (Diachronic) Prediction | Camp B (Synchronic) Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **The Normative Status of Pumpability:**<br>Camp A: Being pumpable is *constitutively* irrational.<br>Camp B: Being pumpable is instrumentally unfortunate but not irrational. | Is rationality defined by the *structure* of the agent (coherence) or the *procedure* of the choice (maximization)? | **The Non-Iterated Pump:** An agent faces a one-off money pump sequence they know they will never face again. Does the loss constitute a rational failure? | **Yes.** The agent's internal structure is flawed regardless of iteration. The loss proves the preferences were irrational. | **No.** If every step was a maximization given current info, no rational error occurred. The loss is bad luck, not irrationality. |
  | **D2** | **The Governing Criterion:**<br>Camp A: Diachronic coherence overrides local EU maximization.<br>Camp B: Local EU maximization overrides diachronic coherence. | When local and global criteria conflict, which algorithm should an engineer hardcode into an autonomous agent? | **The Precommitment Scenario:** An AI can pay a cost *now* to bind its future self to refuse a locally attractive trade that would lead to a pump. | **Pay the cost.** Rationality requires binding the future self to preserve global coherence. | **Refuse the cost.** Paying now reduces current EU. Future selves are distinct decision nodes; current self owes them nothing. |
  | **D3** | **The Unit of Analysis:**<br>Camp A: The persisting agent over time.<br>Camp B: The temporal slice at the moment of decision. | Does a "present self" have normative obligations to a "future self" akin to obligations to other people? | **The Self-Modification Case:** An AI detects its own future preferences will cycle. It can rewrite its code to prevent this. | **Rewrite.** The agent is a single entity; maintaining identity coherence is a primary goal. | **Optional.** Rewriting is only rational if it increases the EU of the *current* slice. If the current slice prefers the cycle, it should keep it. |

  ---

  ### PART III: ANALYSIS OF VERBALITY AND SUBSTANTIVE DIVIDE

  Per the terms of our collaboration, we assessed whether this dispute is merely verbal (arising from differing definitions of "rationality") or substantive (arising from differing claims about the world or design norms).

  **1. The Verbal Component**
  We agree that a portion of the dispute is semantic. Both camps use the term "Rational Agent," but they refer to different objects:
  *   **Camp A** uses "Rational Agent" to denote a **persisting system** whose success is measured by outcome dominance over time. For them, "irrational" is synonymous with "structurally flawed."
  *   **Camp B** uses "Rational Agent" to denote a **decision procedure** whose success is measured by procedural correctness at the instant of execution. For them, "irrational" is synonymous with "procedural error."

  If both parties agreed to distinguish between *Structural Rationality* (Camp A's focus) and *Procedural Rationality* (Camp B's focus), the semantic friction would decrease.

  **2. The Substantive Component**
  However, we conclude the dispute is **not merely verbal**. Even if we disambiguate the terminology, a substantive disagreement remains regarding **AI Specification and Design Norms**.

  *   **The Engineering Crux:** When specifying the loss function for a long-horizon AI, should the engineer penalize the agent for diachronic incoherence even when the agent cannot locally detect it?
      *   **Camp A** argues the loss function *must* penalize incoherence to ensure the agent is safe and robust against exploitation. They view the "Synchronic" agent as a dangerous design pattern that invites adversarial exploitation.
      *   **Camp B** argues that penalizing local maximization introduces "arational" constraints. They contend that if an agent is exploited, it is due to the environment's hostility, not the agent's design, and that forcing diachronic coherence may prevent the agent from taking legitimate opportunities that look risky locally but are beneficial.

  **3. Conclusion on Adjudication**
  Settling the definition of "rationality" will not resolve the design conflict. The disagreement is substantive because it prescribes different code.
  *   **Evidence that would move Camp B:** A demonstration that synchronic maximizers inevitably self-modify into incoherent states that cause catastrophic failure (instrumental convergence toward coherence).
  *   **Evidence that would move Camp A:** A demonstration that diachronic constraints systematically prevent agents from capturing high-value opportunities in non-adversarial environments where preference fluidity is advantageous.

  Until such evidence is produced, we record that Camp A prioritizes **Global Robustness**, while Camp B prioritizes **Local Autonomy**.

  ---
  **End of Joint Statement**
