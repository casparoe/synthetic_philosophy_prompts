      *   *The Circularity Objection:* Address Premise 6 directly. It's not circular because the "baptism" is ostensive (pointing), not descriptive. We don't define *H. sapiens* as "the thing with DNA X." We define it as "the lineage stemming from *this* ancestral population." DNA X is the *discovery* of what marks that lineage.
      *   *The Biological Problem:* Here's the rub. In chemistry, H2O is static. In biology, lineages change. Evolution is gradual. Rigid designation assumes a sharp boundary that evolution blurs. This is the "Species Problem."
      *   *Option A: Keep Rigid Designation (Essentialism).* Cost: You have to ignore ring species, hybridization, and anagenesis. You treat species as immutable types (typological thinking), which contradicts modern evolutionary theory.
      *   *Option B: Drop Rigid Designation for Kinds (Descriptivism/Cluster Concepts).* Cost: You lose "Necessary A Posteriori" truths. "All H. sapiens are mortal" becomes a very strong generalization, not a metaphysical necessity. Taxonomy becomes pragmatic, not metaphysical.
      *   *Option C: The "Historical Essentialist" Middle Ground.* Reference is fixed by lineage (causal history), not traits. This saves rigid designation but changes the "essence" from structural to historical.
      *   *Conclusion:* For a molecular biologist, Premise 3 is the hardest to swallow because species are fuzzy sets. Suggest looking into "Species as Individuals" (Ghiselin/Hull) or "Homeostatic Property Clusters" (Boyd).

