answer: |-
  **Project Title:** Beyond Credence: Non-Empirical Assessment, the Measure Problem, and the Rationality of Research Investment

  **Project Description**

  Contemporary fundamental physics, particularly in the context of the string landscape and eternally inflating multiverse, faces a crisis of confirmation. Theories in this domain often lack determinate empirical consequences due to the "measure problem": the structural difficulty of extracting a unique probability distribution over observations from the theory. This absence of well-defined likelihoods stalls standard Bayesian confirmation. In response, a prominent defence of non-empirical theory assessment (NETA) has emerged, arguing that structural virtues and the absence of alternatives can raise the rational credence in a theory even without data. Critics counter that without empirical evidence, confirmation is conceptually impossible. This debate has reached a stalemate because both sides assume the *output* of NETA must be an increase in an individual agent's credence that the theory is true (Outcome A).

  This project proposes that the stalemate dissolves if we distinguish Outcome A from two distinct normative outputs: (B) narrowing the range of rationally permissible credences across a scientific community, thereby reducing legitimate disagreement without necessarily shifting individual means; and (C) altering the expected value of further investment in the research programme, given that alternatives are similarly untestable. The dominant defence of NETA relies on a meta-inductive argument: past theories supported by similar non-empirical virtues were eventually empirically confirmed. However, this defence presupposes that the theory in question is *measure-definite*—that there is a fact of the matter about what observations it predicts, even if currently inaccessible. If the measure problem is structural rather than technical, the reference class for the meta-inductive argument evaporates. We are left with a theory that may not even support Outcome A.

  **Research Question**

  The core research question is determinate: *Is non-empirical assessment coherent for theories that are not measure-definite, provided we shift the normative goal from individual credence (A) to community constraint (B) or investment utility (C)?*

  This question admits a yes/no answer grounded in formal coherence. If (B) and (C) can be formally defined without well-defined likelihoods, NETA retains normative force in the landscape context. If they collapse into (A), or require likelihoods to function, NETA loses its justification precisely where it is most desired.

  **Methodology and Work Plan**

  The project will execute a twelve-month plan balancing formal epistemology, philosophical analysis, and historical case study. To ensure feasibility within the fellowship period, technical work in cosmology will be capped at the level of analyzing existing literature on the measure problem; I will not attempt to derive measures physically, but rather analyze the philosophical implications of their absence.

  *Months 1–3: Formal Reconstruction.* I will construct a unified formal framework using imprecise probability theory. Outcome (A) will be modeled as a shift in a precise credence function. Outcome (B) will be modeled as a contraction of the *set* of permissible credence functions (a representor) across a community, independent of individual shifts. Outcome (C) will be modeled using decision theory, where the utility function weights "theoretical progress" and "resource efficiency" rather than "truth." This allows the three outcomes to be treated as different functionals of a single model, testing whether (B) and (C) remain defined when likelihoods are undefined or imprecise.

  *Months 4–6: The Measure Problem Crux.* I will analyze the measure problem not as a physical obstacle but as an epistemological one. The crux sub-question is whether the measure problem represents a total absence of likelihoods (fatal to A, B, and C) or a problem of self-locating, indexical evidence (potentially soluble via imprecise probabilities). If the latter, (A) may be rescued in an imprecise form; if the former, I will test whether (B) and (C) can stand alone. This phase involves close reading of the physics literature to categorize proposed solutions by their epistemological structure, ensuring the philosophical analysis remains grounded in the actual technical impasse.

  *Months 7–9: Historical Case Study.* To test the viability of (B) and (C) absent (A), I will examine a historical instance of theory acceptance prior to well-defined empirical consequences. The primary candidate is the quark model in the mid-1960s, accepted on grounds of mathematical consistency and explanatory coherence before deep inelastic scattering provided direct evidence. I will reconstruct the argumentation of that period to determine if physicists were arguing for individual belief (A), community consensus (B), or continued funding/effort (C). If no suitable analogue exists, this is itself a finding: that the current reliance on NETA is historically novel, undermining the meta-inductive defence.

  *Months 10–12: Synthesis and Writing.* The final phase integrates the formal model with the case study and the analysis of the measure problem to answer the core research question.

  **Deliverables**

  The primary deliverable is a substantial paper (approx. 10,000 words) titled *"Non-Empirical Assessment without Likelihoods."* This paper will argue that while Outcome (A) is untenable for measure-indefinite theories, Outcome (B) offers a robust normative framework for understanding scientific rationality in the multiverse context, provided the measure problem is interpreted as a constraint on permissible disagreement rather than a lack of truth-conditions.

  The companion piece (approx. 3,000 words), addressed specifically to the physics community, will be titled *"Allocating Effort in the Absence of Evidence."* It will translate the philosophical distinction between (B) and (C) into practical terms. It will argue that if (A) is unavailable, policy decisions should not focus on persuading skeptics of the theory's truth, but on justifying the opportunity cost of the research programme. It will address the "is this still science?" concern by reframing the activity not as hypothesis testing, but as rational resource management under radical uncertainty.

  **Risk and Failure Modes**

  I offer an honest assessment of the project's vulnerabilities. First, the tripartite distinction may fail to do normative work. If (B) and (C) turn out to be merely descriptive sociological claims without normative force, or if they logically reduce to (A) upon formalization, the central thesis collapses. Second, the cosmology literature may converge on a accepted measure during the fellowship. If the measure problem is resolved physically, the central case evaporates. However, I will treat this as a successful contingency: the project would then conclude that NETA is indeed only coherent for measure-definite theories, validating the meta-inductive defence. Third, the historical case study may yield no analogue. If past theory acceptance always involved well-defined likelihoods, this confirms that current practice is discontinuous with past science. This would count as a negative result for the defence of NETA, but a positive result for the history and philosophy of science, and the dissertation will be structured to report this finding robustly.

  By capping the technical cosmology work and focusing on the epistemological structure of the arguments, this project ensures that philosophical questions remain in view. It does not seek to solve the measure problem, but to determine what rationality requires if the problem proves insoluble.
