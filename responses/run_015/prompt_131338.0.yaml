  ### Part 1: Brainstorming the Logical Space

  Before constructing the tree, I need to map where the hard lines and empty spaces lie. The five distinctions you provided (Sentience, Future, Kinship, Wild Suffering, Distributed Colony) do not stack neatly; they intersect in ways that create tension.

  **1. The "Sentience vs. Life" Split (Node 1)**
  *   **Logical Space:** If you choose "Life," you enter *Biocentrism*. If you choose "Sentience," you enter *Sentientism*.
  *   **Empty/Incoherent Zone:** Claiming "Life matters" but "Plants have no moral status" is incoherent. Claiming "Sentience matters" but "Insects don't count" is a borderline case often swept under "uncertainty," but logically risky.
  *   **Tension:** Biocentrists often struggle with the "Plant Intervention" problem (must we stop weeds from choking flowers?). Sentientists struggle with the "Marginal Cases" problem (humans with less capacity than pigs).

  **2. The "Future Concept" Split (Node 2)**
  *   **Logical Space:** This divides Sentientists. One group says "Pain is the only thing that matters" (Pain-focused). The other says "Loss of a future is the harm" (Future-focused).
  *   **Tension:** If the future matters, killing a sleeping human is worse than killing a waking pig. If only pain matters, killing is only wrong if it causes fear/pain beforehand.
  *   **Awkward Commitment:** The "Future" view must explain why killing a severely disabled human (no future concept) is worse than killing a pig.

  **3. The "Kinship" Split (Node 3)**
  *   **Logical Space:** This divides Universalists from Partialists.
  *   **Tension:** If capacities are identical, why does "being human" or "being my pet" matter?
  *   **Incoherent Zone:** Claiming "Capacities are all that matter" but "Humans get priority" is straightforward Speciesism, which is logically fragile unless defended by "special obligations" (Kinship).
  *   **Empty Spot:** Very few people argue we owe *more* to wild animals than domestic ones, though logically, if wild animals suffer more, a strict harm-reductionist should prioritize them.

  **4. The "Wild Suffering" Split (Node 4)**
  *   **Logical Space:** This tests the consistency of harm reduction.
  *   **Tension:** If suffering is bad, nature is a horror show. If we shouldn't intervene, why is suffering bad?
  *   **Incoherent Zone:** Claiming "Suffering is the ultimate evil" but "Nature is sacred and off-limits" requires a "Naturalness" veto that contradicts the first claim.
  *   **Empty Spot:** "Interventionist Speciesism" (Save wild humans from nature, but let wild animals suffer) is common but logically unstable if capacity is the metric.

  **5. The "Distributed Colony" Split (Node 5)**
  *   **Logical Space:** This tests the definition of experience.
  *   **Tension:** Is suffering biological (neurons) or functional (signal processing)?
  *   **Incoherent Zone:** Claiming "Functional distress signals count" but "AI doesn't count" requires a biological bias that contradicts the functional definition.
  *   **Empty Spot:** Almost no one currently holds a "Collective Rights" view for ecosystems, though it follows logically from some holistic environmental ethics.

