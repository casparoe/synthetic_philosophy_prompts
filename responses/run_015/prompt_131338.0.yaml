  ### Part 2: The Decision Tree

  Below is a decision tree with **eight decision nodes** (questions) designed to sort your view based on concrete judgments rather than theory names. Follow the path that matches your intuition.

  **Node 1: The Foundation**
  *Case:* A microscopic bacterium strives to survive and reproduces. A mouse feels pain and fears death.
  *Question:* **Does the bacterium's struggle to live matter morally on its own, or does moral status begin only when a being can feel pain or pleasure?**
  *   *If "Life/Struggle matters":* Go to Node 2.
  *   *If "Pain/Feeling matters":* Go to Node 3.

  **Node 2: The Plant Intervention Test (Biocentric Path)**
  *Case:* In a forest, fast-growing vines choke slow-growing trees, causing them to wither.
  *Question:* **Do we have a duty to intervene and save the trees, or is this natural competition off-limits?**
  *   *If "Duty to Intervene":* **Leaf A.**
  *   *If "Off-Limits":* **Leaf B.**

  **Node 3: The "Tomorrow" Test (Sentientist Path)**
  *Case:* A pig feels pain but cannot imagine next week. A human child can imagine next week.
  *Question:* **Does the human's ability to imagine the future make killing them worse than killing the pig, even if the pain of death is identical?**
  *   *If "Yes, Future matters":* Go to Node 4.
  *   *If "No, Pain is all that matters":* Go to Node 5.

  **Node 4: The Capacity Consistency Check**
  *Case:* A human with severe cognitive disabilities has less future-planning capacity than a healthy pig.
  *Question:* **Is it still harder to justify killing the human than the pig, solely because they are human?**
  *   *If "Yes, Human status protects them":* Go to Node 6.
  *   *If "No, Capacity determines status":* Go to Node 7.

  **Node 5: The Kinship Test**
  *Case:* You can save either a wild deer or a domestic cow from a fire. Both have identical minds and capacity for suffering.
  *Question:* **Does the cow's relationship to you (as a domesticated animal) make saving it more obligatory than saving the deer?**
  *   *If "Yes, Kinship matters":* Go to Node 8.
  *   *If "No, Suffering is equal":* Go to Node 7.

  **Node 6: The Species Priority Defense**
  *Case:* An alien species arrives with higher intelligence than humans but treats us as food.
  *Question:* **Would they be wrong to eat us, even if we lack their cognitive capacities?**
  *   *If "Yes, we have inherent rights":* **Leaf C.**
  *   *If "No, might makes right/capacity rules":* **Leaf D.**

  **Node 7: The Wild Suffering Obligation**
  *Case:* We could genetically modify predators to eat plants, ending centuries of predation suffering.
  *Question:* **Does the sheer scale of wild suffering make this a moral duty, or does ecological risk block the obligation?**
  *   *If "Duty to Intervene":* **Leaf E.**
  *   *If "Risk Blocks Duty":* **Leaf F.**

  **Node 8: The Distributed Colony Hypothetical**
  *Case:* A computer network broadcasts "distress" signals when damaged, but no single chip feels pain.
  *Question:* **Does this collective distress count for moral consideration, or must pain be located in an individual body?**
  *   *If "Collective Distress Counts":* **Leaf G.**
  *   *If "Individual Body Required":* **Leaf H.**

