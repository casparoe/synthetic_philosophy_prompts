  ### Part 3: The Leaves (Positions and Awkward Commitments)

  **Leaf A: Radical Biocentric Interventionist**
  *   **Position:** Universal Life Protection.
  *   **Awkward Commitment:** You must actively manage nature to prevent plants from outcompeting each other, effectively gardening the entire wilderness.

  **Leaf B: Passive Biocentrist**
  *   **Position:** Reverence for Life without Intervention.
  *   **Awkward Commitment:** You value the life of a weed but must stand by and watch it choke a flower to avoid "interfering" with nature.

  **Leaf C: Human Exceptionalist**
  *   **Position:** Species-Based Rights.
  *   **Awkward Commitment:** You must accept that a higher intelligence alien would be morally justified in eating humans if they applied your own logic consistently.

  **Leaf D: Capacity-Based Hierarchy**
  *   **Position:** Cognitive Meritocracy.
  *   **Awkward Commitment:** You must accept that humans with severe cognitive impairments have less right to life than a healthy pig.

  **Leaf E: Negative Utilitarian Interventionist**
  *   **Position:** Abolition of Wild Suffering.
  *   **Awkward Commitment:** You are obligated to redesign the ecosystem, potentially causing extinction of predator species, to stop the suffering of prey.

  **Leaf F: Ecological Conservative**
  *   **Position:** Harm Reduction within Human Spheres Only.
  *   **Awkward Commitment:** You accept that wild animals suffer horribly in nature but claim you have no duty to stop it, even if you could do so safely.

  **Leaf G: Functionalist Holist**
  *   **Position:** Systemic Sentience.
  *   **Awkward Commitment:** You must grant moral rights to a computer network or corporation if it processes harm-avoidance, regardless of whether it has a biological brain.

  **Leaf H: Biological Individualist**
  *   **Position:** Neurocentric Sentientism.
  *   **Awkward Commitment:** You must deny moral status to a collective system that screams in distress, simply because the pain isn't located in a single biological node.

