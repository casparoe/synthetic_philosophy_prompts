      *   **Eboshi vs. The Forest (The Trade-off):** Eboshi is a utilitarian regarding humans. She reduces human suffering (lepers, prostitutes) at the cost of animal suffering. This is exactly the trade-off WAS philosophers discuss (intervention vs. non-intervention). The film validates her humanism while validating the animals' right to exist. It refuses to solve the calculus.

