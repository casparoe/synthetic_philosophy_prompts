  **JOINT STATEMENT ON THE ONTOLOGY AND EPISTEMOLOGY OF DREAM REPORTS**
  **Signatories:** The Malcolmian Working Group (Conceptual Analysis) & The Dennettian Working Group (Cognitive Science)
  **Date:** October 26, 2023
  **Subject:** Clarification of Disagreements Regarding the Status of Dreaming

  ### PREAMBLE
  We, the undersigned representatives of the conceptual and empirical camps, acknowledge that the debate regarding the nature of dreaming has often suffered from talking past one another. While we maintain distinct philosophical commitments, we agree that progress requires isolating our shared premises from our substantive disagreements. This document outlines our points of consensus, our specific divergences, and the empirical cruxes that remain to be resolved.

  ### SECTION I: POINTS OF AGREEMENT
  *Both camps affirm the following claims as true, regardless of their theoretical interpretation.*

  1.  **The Retrospective Nature of Reports:** All standard dream data consists of reports uttered *after* the subject has awakened. There is no public, third-person access to the content of a dream while the subject is in standard non-lucid sleep.
  2.  **Correlation with Physiology:** There is a robust statistical correlation between Rapid Eye Movement (REM) sleep physiology (and specific neurochemical states) and the subsequent reporting of vivid dream narratives.
  3.  **Unreliability of Memory:** Human memory is reconstructive, not reproductive. The act of recalling a dream upon waking is subject to distortion, fading, and confabulation, similar to (though potentially more fragile than) waking memory.
  4.  **The Verification Gap:** There is no method for a third party to verify the *content* of a dream report in real-time during standard sleep. The sleeper cannot point to an object, and the observer cannot see what the sleeper sees.
  5.  **Status of the Question:** We agree that the debate contains both empirical and conceptual elements. The empirical elements concern neural timing and memory fidelity; the conceptual elements concern the criteria for applying the word "experience" to a state that lacks public verification.

  ### SECTION II: TABLE OF DISAGREEMENTS
  *The following positions are phrased such that each camp accepts the wording as an accurate representation of their own view.*

  | Feature | The Malcolmian Position (Conceptual) | The Dennettian Position (Cognitive/Functional) |
  | :--- | :--- | :--- |
  | **Ontology of the Dream** | A "dream" is the narrative constructed *upon waking*. To speak of a dream existing *during* sleep is a category mistake. | A "dream" is a sequence of neural events and conscious states occurring *during* sleep, which are subsequently recalled (often imperfectly). |
  | **The Role of Criteria** | The concept of "experience" logically requires the possibility of a check for correctness. Without a wake-criterion, "experience" is misapplied. | The concept of "experience" refers to a functional state of information processing. Verification is practical, not logical; lack of feedback does not negate the state. |
  | **First-Person Authority** | The sleeper has no authority to claim they are experiencing something, because "claiming" implies a language game that requires wakefulness. | The sleeper has privileged access to their qualia during the event, even if the memory of that access degrades upon waking. |
  | **The "Illusion" Claim** | It is not that the dream is an illusion; it is that the *belief* that one had an experience while asleep is the illusion. | The dream experience is real, but the *fidelity* of the memory is an illusion. The brain edits the "tape" before playback. |

  ### SECTION III: ANALYSIS OF CRUXES
  *We identify two specific areas where our predictions diverge. For each, we specify the concrete case and the distinct predictions made by each camp.*

  #### Crux 1: First-Person Authority and Lucidity
  **The Issue:** Does the subject have the authority to declare they are conscious while asleep?
  **Relevance:** If a subject can validly claim "I am dreaming now," the Malcolmian requirement for wakefulness as a criterion for experience is undermined.

  *   **Concrete Case:** **Lucid Dreaming Protocols.** Subjects trained to recognize they are dreaming and signal this realization via pre-arranged eye movements (e.g., left-right-left) while remaining in REM sleep.
  *   **Malcolmian Prediction:** These signals indicate a temporary return to a waking (or quasi-waking) state. The subject is not truly "dreaming" in the logical sense during the signal; they have briefly exited the dream grammar to make a report. The "experience" is valid only because the criteria for wakefulness have been partially restored.
  *   **Dennettian Prediction:** These signals prove that conscious experience and executive function can coexist with sleep physiology. The experience is occurring in real-time. The eye signal is a motor output generated by a conscious brain state that does not require full wakefulness to count as "experience."

  #### Crux 2: Real-Time Calibration (The Feedback Loop)
  **The Issue:** Does the absence of a real-time verification loop negate the existence of the data? (Analogy: A sensor recording in a black box vs. a sensor with a live monitor).
  **Relevance:** As noted in biophysics, data without calibration is suspect. Malcolm argues this makes the data nonsensical; Dennett argues it makes the data merely private.

  *   **Concrete Case:** **Stimulus Incorporation.** External stimuli (e.g., water sprayed on the hand, specific tones) are applied during REM. The subsequent dream report incorporates these stimuli (e.g., dreaming of rain or a siren).
  *   **Malcolmian Prediction:** The incorporation of the stimulus happens *at the moment of waking*. The brain creates a past-tense narrative that *includes* the stimulus to make sense of the waking impression. The dream did not "contain" the siren; the report was constructed to fit the siren.
  *   **Dennettian Prediction:** The brain processes the auditory/thermal input during sleep and integrates it into the ongoing conscious simulation. The timing of the neural response to the stimulus should match the reported timing in the dream narrative, proving real-time processing.

  ### SECTION IV: ANALYSIS OF VERBAL DISPUTE
  *We acknowledge that a portion of our disagreement is semantic rather than substantive.*

  **1. The Definition of "Experience"**
  *   **Divergence:** We are using the term "experience" to carve nature at different joints.
      *   **Malcolmian Usage:** "Experience" is a public language concept tied to verification conditions. If you cannot distinguish the state from non-existence via criteria, it is not an experience.
      *   **Dennettian Usage:** "Experience" is a biological/functional phenomenon. If the brain is processing qualia, it is an experience, regardless of whether the subject can verify it to a third party.
  *   **Resolution:** We agree that if we strictly define "Experience_Verifiable" (Malcolm), dreams do not qualify. If we define "Experience_Phenomenal" (Dennett), they do. The dispute is over which definition is useful for science.

  **2. The Definition of "Dream"**
  *   **Divergence:**
      *   **Malcolmian Usage:** "Dream" = The story told at breakfast.
      *   **Dennettian Usage:** "Dream" = The physiological and phenomenological process during sleep + the story told at breakfast.
  *   **Resolution:** We agree that much of the debate dissolves if we distinguish between **Dreaming (the process)** and **Dream Reporting (the product).** Malcolm focuses on the logic of the Report; Dennett focuses on the mechanism of the Process.

  ### CONCLUSION
  We conclude that the question "Do we have experiences during sleep?" cannot be answered without specifying whether we are asking a logical question about the *grammar of reporting* or an empirical question about the *continuity of consciousness.* Future collaboration should focus on the timing of neural correlates relative to dream content (Crux 2) to determine if the "black box" records data in real-time or constructs it upon power-up.

  ***

  **Signed,**

  *Representative, Conceptual Analysis Group*
  *Representative, Cognitive Science Group*
