      *   **Key Facts Provided:** Viral video (March 2012), celebrity boost, "Cover the Night" (April 20), follow-up flop, Jason Russell's meltdown, policy (Obama's advisers) pre-dated the video, Ugandan backlash.
      *   **Specific Questions to Address:**
          1.  Who is "the public" in this episode (viewers, celebs, retweets, comments)?
