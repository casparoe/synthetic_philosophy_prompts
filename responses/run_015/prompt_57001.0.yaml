          *   *The Ugandan Complication:* This is the crucial insight. The Ugandans *were* a real public (or community). They had faces, shame, history, and specific grievances.
          *   *Kierkegaard's Theory:* Does it allow for two publics? Yes. Kierkegaard distinguishes between "The People" (a concrete body, like a congregation or a nation in truth) and "The Public" (the abstraction). The Kony campaign created a *Phantom Public* in the West that overshadowed the *Real Community* in Uganda. The tragedy is the Phantom speaking *for* the Real without listening.

      *   **Conclusion:** Synthesize. The Kony 2012 event is the ultimate "Present Age" moment. The user's test is a valuable heuristic for Kierkegaardian authenticity.

