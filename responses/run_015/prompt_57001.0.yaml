          *   *African Union Troops:* Did the campaign work? If troops went in *because* of pressure, is it real action? Kierkegaard would argue: If the motivation is "what everyone else is doing" (envy/leveling), it's still inauthentic. But more likely, he'd say the *political* decision is separate from the *public* frenzy. The AU acting doesn't validate the *public*; it validates specific *individuals* (leaders) making decisions. The "Public" still dissolves.
          *   *Unfalsifiable?* It risks being unfalsifiable if *any* outcome is interpreted as "leveling." But the core metric is *responsibility*. Did the public take responsibility? No.

      *   **Part 4: Pressure Testing the User's "Phantom Test":**
          *   *The Test:* 1. Picture in a room? 2. Can it be embarrassed? 3. Can you date its mind change?
