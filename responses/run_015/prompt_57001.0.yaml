          5.  Does the Ugandan backlash complicate Kierkegaard's theory (Real Public vs. Phantom Public co-existing)?

  2.  **Deconstruct Kierkegaard's Concepts (Mental Sandbox):**
      *   *The Present Age:* Characterized by reflection, chatter, envy, leveling. Passion is absent.
      *   *The Public:* An abstraction, a monster, a "nothing." It's not a people, a generation, or a community. It's created by the press. It allows individuals to hide in anonymity.
      *   *The Press:* The instrument that creates the public. It encourages gossip over action, opinion over commitment.
      *   *Leveling:* The process where distinctiveness is erased. Everyone becomes the same "number."
      *   *Action vs. Talk:* Kierkegaard values individual commitment/responsibility. The public talks but never acts (or acts without responsibility).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the brilliance of the connection. Kony 2012 is arguably the *perfect* case study for *The Present Age*. Validate the user's intuition.

      *   **Part 1: Who is the Public? (Kierkegaard's Lens):**
          *   Kierkegaard says the public is an *abstraction*.
          *   *Viewers/Retweeters:* They are the "numbers." They participate without risk. They feel like they are doing something (sharing) but bear no responsibility for the outcome.
          *   *Celebrities:* They amplify the "chatter." They lend weight to the abstraction without substance.
