answer: |-
  Your group's composition is its strategic asset. Three metaphysicians can generate Sorites puzzles indefinitely without leaving the room. Two developmental biologists and a fertility ethicist force you into the world. If you start with tolerance budgets, you waste them. If you start with IVF protocols, you use them.

  Here is the prioritized agenda for the two-year project, ranked by upstream leverage, mixed-group tractability, and neglectedness.

  **1. The Protocol-Origin Problem (IVF Agency)**
  *   **Rank:** Priority 1 (Workshop 1 Focus)
  *   **Criteria:** This is the only topic where your ethicist leads and the biologists provide essential mechanistic detail (pipette selection vs. natural competition). It tests whether "origin" includes *human selection* as a necessary component of the causal chain.
  *   **Upstream/Downstream:** Upstream of tolerance. If agency constitutes part of the origin, the tolerance budget changes entirely.
  *   **Trade-off:** Risk that metaphysicians dismiss this as "merely epistemic." You must frame it as ontological: does the technician's choice fix the identity in a way natural selection does not?
  *   **Why First:** It is the most neglected in standard literature and the only one that justifies the specific funding allocation for this team.

  **2. Twinning (Sufficiency vs. Individuation)**
  *   **Rank:** Priority 2 (Workshop 2/3)
  *   **Criteria:** High biologist contribution (timing of blastocyst splitting). Directly challenges the sufficiency claim of origin essentialism (one origin, two individuals).
  *   **Upstream/Downstream:** Downstream of Protocol-Origin (both concern individuation), but upstream of Chimerism. If you can't solve twinning, chimerism is impossible.
  *   **Trade-off:** Well-trodden ground. To avoid stagnation, focus on the *timing* of the split provided by the biologists, not the logical puzzle alone.

  **3. Chimerism and Mitochondrial Donation**
  *   **Rank:** Priority 3 (Year 2)
  *   **Criteria:** Biologists can clarify frequency and mechanism. Metaphysicians must decide if "tidy pairs" are a prerequisite for the theory.
  *   **Upstream/Downstream:** Downstream. These are edge cases that stress-test the theory established in 1 and 2.
  *   **Trade-off:** High risk of being bracketed as "abnormal." Only pursue if 1 and 2 suggest origin is process-based rather than gamete-based.

  **4. Modal Specification (Is Essence Modal?)**
  *   **Rank:** Priority 4 (Year 2 Synthesis)
  *   **Criteria:** Low biologist contribution. Pure metaphysics.
  *   **Upstream/Downstream:** Logically upstream of everything, but investigationally downstream. You cannot know if modality is the wrong tool until you see it fail on IVF/Twinning cases.
  *   **Trade-off:** Starting here stalls the group. Use this to reconstruct the theory after the empirical stress tests.

  **5. The Tolerance Budget (Sorites)**
  *   **Rank:** Deprioritize
  *   **Criteria:** Zero biologist contribution. High risk of verbal dispute.
  *   **Upstream/Downstream:** Downstream. You need to know *what* the origin is before measuring its variance.
  *   **Trade-off:** Explicitly table this. It is a philosopher's trap that offers no return on your specific investment in biological expertise.

  **Evidence Triggers for Re-ranking**

  *   **Move Modal Specification Up:** If, after Workshop 1, the metaphysicians agree that IVF agency cannot be modeled within standard counterfactual frameworks, shift focus to rebuilding the modal logic in Year 1.
  *   **Move Twinning Up:** If the biologists demonstrate that twinning is not a rare split but a standard developmental potentiality for all zygotes, this becomes the primary objection over IVF.
  *   **Move Protocol-Origin Down:** If the ethicist demonstrates that lab protocols are fully deterministic (no actual selection variance), the agency angle collapses, and you revert to standard gamete essentialism.

  **Verdict: Prioritize the protocol-origin problem: does human agency break origin necessity?**
