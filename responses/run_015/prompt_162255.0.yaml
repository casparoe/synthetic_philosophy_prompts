      *   *Row 5: Consequentialist Non-Interference.* Claim: External condemnation will provoke backlash, strengthening the practice and harming local reformers. Status: Substantive-and-defensible. License: Yes (if true). Objection: Silence also empowers oppressors. Fact: What do local reformers actually want? (Touches on Wrinkle 2).
      *   *Row 6: Political Self-Determination.* Claim: Communities have a collective right to determine their social norms without external coercion, even if imperfect. Status: Substantive-but-shaky. License: Partly (hand to local groups). Objection: Rights violations trump sovereignty. Fact: Is there a legitimate internal process for change?
