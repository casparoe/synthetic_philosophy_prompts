  ### The Therapy/Enhancement Decision Tree

  **Instructions:** Answer the seven questions below. Track your path (A or B) to find your position in the logical space. At the end, locate your profile among the ten leaves.

  #### The Seven Branch Nodes

  **1. The Baseline (Testosterone Case)**
  When a 70-year-old restores their hormones to the levels they had at 30, are they fixing a deficit relative to *their own life*, or correcting a deviation from the *current population*?
  *   **A:** Their own life trajectory (Counterfactual-Person).
  *   **B:** The current population norm (Species-Typical).

  **2. The Environment (Mismatch Case)**
  If a drug improves focus only because modern life is unnaturally distracting (not because the brain is broken), does taking it count as restoring health?
  *   **A:** Yes, the niche is part of the health equation (Mismatch-Adapter).
  *   **B:** No, health is about the body, not the office (Traditional).

  **3. The Race (Growth Hormone Case)**
  If a drug makes everyone taller but changes no one's relative rank in society, was the intervention a waste of resources?
  *   **A:** Yes, value is comparative (Positional).
  *   **B:** No, absolute capability matters (Absolute).

  **4. The Limit (Titration Case)**
  If a drug cures a deficiency, is it morally distinct to take slightly more than the cure dose for extra benefit?
  *   **A:** No, benefit is a smooth slope (Continuum).
  *   **B:** Yes, there is a sharp line at "enough" (Threshold).

  **5. The Authority (GLP-1 Case)**
  Who decides if a weight-loss drug is a medical necessity or a lifestyle choice?
  *   **A:** Democratic policy and insurance pools (Democratic).
  *   **B:** Medical experts and biological facts (Medical).

  **6. The Gift (Cochlear Implant Case)**
  Should we view human limitations as boundaries to be mastered, or as gifts/conditions to be accepted?
  *   **A:** Accept limits as part of a good life (Openness).
  *   **B:** Master limits to improve welfare (Mastery).

  **7. The Label (Stimulant Case)**
  If a student performs better on stimulants without a diagnosis, is the diagnosis a discovery of a real condition or a gatekeeping ticket?
  *   **A:** A gatekeeping ticket (Constitutive).
  *   **B:** A discovery of a real condition (Realist).

  ***

  #### The Ten Leaves (Positions)

  Match your sequence of answers (e.g., B-B-B-B-B-B-B) to the profiles below.

  **1. The Species-Normalist (B-B-B-B-B-B-B)**
  *(Thinkers: Boorse)*
  **Awkward Commitment:** Must classify vaccination as enhancement because it raises immune performance above unaided nature.

  **2. The Fair-Equality Advocate (B-B-B-B-A-B-B)**
  *(Thinkers: Daniels)*
  **Awkward Commitment:** Must fund treatments that restore opportunity but refuse to fund identical treatments that boost beyond the normal range.

  **3. The Welfarist (A-A-B-A-A-B-B)**
  *(Thinkers: Savulescu, Bostrom)*
  **Awkward Commitment:** Cannot object to a drug that makes you happier but less productive, provided net welfare rises.

  **4. The Capabilities Proponent (B-A-B-B-A-B-B)**
  *(Thinkers: Nussbaum, Sen)*
  **Awkward Commitment:** Must treat social barriers as medical disabilities if they block central human functioning.

  **5. The Giftedness Objector (B-B-B-B-B-A-B)**
  *(Thinkers: Sandel)*
  **Awkward Commitment:** Must oppose pharmacological memory damping even for assault victims if it removes the burden of mourning.

  **6. The Democratic Administrator (B-B-B-B-A-B-A)**
  *(Thinkers: Policy Pragmatists)*
  **Awkward Commitment:** Must admit the line between therapy and enhancement is arbitrary, yet enforce it strictly to keep insurance solvent.

  **7. The Positional Skeptic (B-B-A-B-B-B-B)**
  *(Thinkers: Hirsch)*
  **Awkward Commitment:** Must oppose universal vaccination if it confers no relative advantage in the job market.

  **8. The Medicalization Skeptic (B-B-B-B-B-B-A)**
  *(Thinkers: Foucault, Conrad)*
  **Awkward Commitment:** Must claim ADHD did not exist as a medical fact before the institution decided to diagnose it.

  **9. The Trajectory Purist (A-B-B-B-B-B-B)**
  *(Thinkers: Unoccupied)*
  **Awkward Commitment:** Must fund testosterone for a 70-year-old but deny it to a 70-year-old who was always low-T, despite identical current levels.

  **10. The Niche Adapter (B-A-B-B-B-B-B)**
  *(Thinkers: Unoccupied)*
  **Awkward Commitment:** Must classify modern focus drugs as therapy while calling identical drugs used by hunter-gatherers enhancement.

  ***

  #### The Empty Space

  Of the 128 possible answer combinations, most are unoccupied. The significant empty clusters are:

  *   **Incoherent:** *Individual Baseline + Giftedness (A...A...).* You cannot argue for respecting the "givenness" of human nature while defining health solely by an individual's unique past trajectory.
  *   **Unattractive:** *Positional + Continuum (B-A-A...).* If you believe value is only comparative, you rarely argue for a smooth slope of benefit; arms races demand hard limits.
  *   **Unexplored:** *Mismatch + Giftedness (B-A...A...).* No major theorist has combined the view that our environment makes us "sick" with the view that we should accept biological limits uncritically.

