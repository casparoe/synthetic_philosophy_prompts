  **Democratic Administrator (6) vs. Medicalization Skeptic (8)**
  *   **The Problem:** Both view the diagnosis as Constitutive (a tool/ticket).
  *   **The Separating Case:** *The motive of the institution.* If the diagnosis is drawn by voters to save money (Administrator) versus by professions to expand power (Skeptic). The tree asks "Who decides?" but both answer "Not Biology."

  **Mismatch-Adapter (10) vs. Capabilities (4)**
  *   **The Problem:** Both answer "Yes" to the Environment question.
  *   **The Separating Case:** *The funding source.* Mismatch-Adapter sees this as a medical fix for a niche problem (Medical Authority); Capabilities sees it as a social entitlement (Democratic Authority).
