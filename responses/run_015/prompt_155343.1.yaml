prompt: |-
  ok im trying to map out what a theory of well-being actually has to deliver before i dive into hedonism vs desire-satisfaction vs objective-list stuff. i want the desiderata specifically built around experience-machine objections, but not just nozicks original setup -- include the modified case where the machine lets you toggle between real and simulated life but wipes your episodic memory of which mode youre in right after you switch back. for each requirement say what case or intuition drives it, flag negotiable vs non-negotiable ones, and note if any pair cant be jointly satisfied. make sure the list covers: why full simulation seems to cost something even if pleasure is maxed out; whether the amnesia-toggle version makes the problem sharper or actually dissolves it; the distinction between being actively deceived vs just lacking access to reality-status; why preference-satisfaction cant be the whole story even if toggle-users prefer the simulated stretches; and consistency with how people in long clinical VR protocols or isolation studies actually report retrospective well-being. then briefly score hedonism, desire-theory, and objective-list against the list, but keep the focus on the criteria themselves. this is for a dataset so dont ask for bibliographies or citations, and keep it casual -- a typo or two is fine.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Goal:** Map out desiderata (requirements) for a theory of well-being.
      *   **Focus:** Specifically built around Experience Machine objections (Nozick's original + modified amnesia-toggle version).
      *   **Key Elements to Cover:**
          *   Why full simulation costs something even if pleasure is maxed.
          *   Whether the amnesia-toggle version sharpens or dissolves the problem.
          *   Distinction: Active deception vs. lacking access to reality-status.
          *   Why preference-satisfaction isn't the whole story (even if users prefer sim).
          *   Consistency with clinical VR/isolation study reports on retrospective well-being.
          *   For each requirement: State the driving case/intuition, flag negotiable vs. non-negotiable, note incompatibilities.
          *   Briefly score Hedonism, Desire-Theory, Objective-List against the list.
          *   **Tone:** Casual, okay to have a typo or two (for dataset purposes).
          *   **Constraint:** No bibliographies or citations.

  2.  **Deconstruct the Experience Machine Cases:**
      *   *Original Nozick:* Plug in for life, max pleasure, forget you plugged in. Intuition: We don't want to do it. Why? We want to *do* things, not just experience doing them. We want to be a certain way, not just feel like it. Contact with reality matters.
      *   *Modified Amnesia-Toggle:* Switch between real/sim, wipe memory of switch upon return. This tests whether the *knowledge* of reality matters or the *state* itself. If you can't tell the difference even retrospectively (due to memory wipe), does the reality status still drain well-being?
      *   *Clinical VR/Isolation:* Real-world data. People in long-term VR or isolation (submarines, Antarctica) often report dissociation or a sense of unreality affecting later well-being, even if moment-to-moment was fine.

  3.  **Drafting the Desiderata (Requirements):**

      *   *Req 1: The Reality Contact Constraint.*
          *   Intuition: Original Machine. We value actual causation.
          *   Negotiable? Mostly non-negotiable for robust theories, but hedonists negotiate it away.
          *   Issue: Conflicts with pure mental state theories.

      *   *Req 2: The Agency/Doing Constraint.*
          *   Intuition: We want to *act*, not just feel like we acted.
          *   Negotiable: Non-negotiable for most objectivists, negotiable for hedonists.

      *   *Req 3: The Memory/Identity Continuity.*
          *   Intuition: The Toggle Case. If I forget I was in the sim, did it hurt me? If I wake up and feel "less real," the theory needs to explain why.
          *   Sharpens or Dissolves? Sharpens it because it removes the "fear of deception" variable.

      *   *Req 4: The Deception vs. Unreality Distinction.*
          *   Intuition: Is it bad because I'm being lied to, or because the events aren't real?
          *   Toggle case helps here. If I consent to the toggle, it's not deception, but is it still bad?

      *   *Req 5: Retrospective Coherence.*
          *   Intuition: Clinical VR/Isolation. How do people look back on it?
          *   Preference satisfaction issue: If they preferred the sim *in the moment*, but look back with regret, theory must explain the gap.

      *   *Req 6: The Preference Paradox.*
          *   Intuition: Even if toggle-users say "I prefer the sim stretch," does that satisfy well-being?
          *   Requirement: Theory must explain why satisfied preference for unreality might be defective.

  4.  **Refining the List & Checking Constraints:**
      *   Need to flag negotiable/non-negotiable.
      *   Need to note incompatibilities (e.g., Mental State vs. Reality Contact).
      *   Need to cover the specific points requested (cost of sim, amnesia toggle, deception vs access, preference limits, clinical data).
      *   Tone: Casual, slight typos allowed.
      *   No citations.

  5.  **Drafting the Content (Iterative refinement for tone and content):**

      *   *Intro:* Keep it loose. "Here's the map..."
      *   *Criteria 1 (Reality Weight):* Driven by Original Machine. Non-negotiable for objectivists. Conflicts with Hedonism.
      *   *Criteria 2 (The Toggle Test):* Driven by Amnesia case. Does the lack of memory wipe the cost? If yes, it's about knowledge. If no, it's about metaphysics.
      *   *Criteria 3 (Deception vs. Disconnection):* Active lying vs. just not being there. Toggle removes deception (consensual), so if it's still bad, it's about disconnection.
      *   *Criteria 4 (Preference Defeasibility):* Driven by "I prefer sim" argument. Theory needs to explain why some preferences don't count.
      *   *Criteria 5 (Retrospective Alignment):* Driven by clinical data. Momentary vs. Narrative well-being.

      *   *Scoring:*
          *   Hedonism: Fails Reality/Agency. Passes Momentary Pleasure.
          *   Desire: Fails Preference Defeasibility (unless idealized).
          *   Objective: Passes Reality/Agency, struggles with Subjective reports.

      *   *Typos:* Intentionally insert a couple (e.g., "teh" instead of "the", "definately" instead of "definitely", missing comma).

  6.  **Review against specific prompts:**
      *   *Why full simulation costs something:* Covered in Reality Weight.
      *   *Amnesia-toggle sharper or dissolves:* Covered in Toggle Test.
      *   *Deception vs lacking access:* Covered in Deception vs Disconnection.
      *   *Preference-satisfaction limits:* Covered in Preference Defeasibility.
      *   *Clinical VR/Isolation:* Covered in Retrospective Alignment.
      *   *Score the theories:* Included at end.
      *   *Casual tone + typos:* Will ensure this.
      *   *No citations:* Check.

  7.  **Final Polish:** Make sure the incompatibilities are clear. Ensure the toggle case logic is sound (if you don't remember being in the sim, do you suffer the loss?).

      *Self-Correction on Toggle Case:* If memory is wiped *after switching back*, you don't know you were in the sim. So from the inside, it feels real. If well-being is lower anyway, it proves reality matters independently of experience. If well-being is same, it suggests only the *belief* in reality matters. The desideratum should demand the theory take a stance on this.

      *Self-Correction on Clinical Data:* People in isolation often report feeling "unreal" or disconnected later, even if they were comfortable. Theory needs to account for this narrative dip.

      *Typo Plan:* "definately", "teh", maybe a missing apostrophe. Keep it natural.

  8.  **Final Output Generation** (incorporating the above).

      *   *Structure:*
          1.  Intro.
          2.  The Desiderata List (1-5).
          3.  Incompatibility Notes.
          4.  Quick Scorecard.
