      *(Refining the Toggle Logic)*: The prompt says "wipes your episodic memory of which mode youre in right after you switch back." So when you are back in reality, you don't remember the sim? Or when you go back to sim, you don't remember reality? "switch back" implies returning to reality. So you live sim -> switch to real -> memory of sim wiped. This means your life feels continuous and real, but parts were fake. Does the "fake" part count less towards well-being even if you don't know it was fake? That's the crux.

      Okay, ready to write.

