answer: |-
  ok here's a map of the desiderata. basically, if a theory of well-being cant handle these cases, it's probably too thin. i've flagged what's negotiable (you can argue it away) vs non-negotiable (if you miss this, the theory feels broken), and noted where things clash.

  **1. The Reality Contact Requirement**
  *   **The Intuition:** Driven by the original Experience Machine. Even if pleasure is maxed out, full simulation feels like it costs something. We want to actually *do* things, not just have the experience of doing them.
  *   **Negotiable?** Non-negotiable for most people. If a theory says the machine life is *better* than real life, most folks reject the theory, not the intuition.
  *   **Conflict:** Directly incompatible with pure Mental State theories (Hedonism). You cant have reality matter if only feelings count.

  **2. The Memory-Independence Clause (The Toggle Test)**
  *   **The Intuition:** This comes from the modified amnesia-toggle case. You switch between real/sim, but when you return to reality, your memory of the sim stretch is wiped (or vice versa). The question is: does the sim period count less toward your well-being even if you dont remember it was fake?
  *   **Sharpens or Dissolves?** It sharpens the problem. If you don't know you were deceived, the "fear of being lied to" is removed. If the sim life is still worse, it proves reality has value *independent* of our knowledge or beliefs about it.
  *   **Negotiable?** Negotiable. Some argue if you cant tell the difference, the difference doesnt exist for *you*. But a robust theory needs to explain why we might feel a retrospective dip anyway.

  **3. The Deception vs. Disconnection Distinction**
  *   **The Intuition:** Is the machine bad because you're being actively deceived (lying to you) or just because you lack access to reality (disconnected)? The toggle case helps here because if you consent to the toggle, it's not deception.
  *   **Requirement:** The theory must distinguish between "being tricked" and "being untethered." If consensual simulation still feels hollow, the theory needs to value *contact*, not just *truthfulness*.
  *   **Negotiable?** Non-negotiable. A theory that says "consensual deception is fine" ignores the hollowness people report in deep VR immersion.

  **4. The Defective Preference Clause**
  *   **The Intuition:** Even if toggle-users say "i prefer the simulated stretches," preference-satisfaction cant be the whole story. Why? Because preferences formed in isolation from reality might be adaptive or manipulated.
  *   **Requirement:** The theory needs a filter for which preferences count. Satisfying a desire to live in a fake world cant automatically equal high well-being if the desire itself is grounded in unreality.
  *   **Negotiable?** Highly contested. Subjectivists fight this hard. But without it, you cant explain why satisfying bad desires (like wanting to be in the machine) doesnt maximize welfare.
  *   **Conflict:** Incompatible with Pure Desire Theory unless you add "idealized" conditions (what you'd want if you knew the facts).

  **5. The Narrative/Retrospective Match**
  *   **The Intuition:** Based on clinical VR protocols and isolation studies (submarines, antarctica). People often report okay moment-to-moment affect, but later describe the period as "lost time" or express regret/dissociation when looking back.
  *   **Requirement:** Well-being cant just be sum-of-moments. It has to align with how agents narrate their lives retrospectively. If the theory says you were flourishing but you feel like you wasted your life, the theory is missing something.
  *   **Negotiable?** Negotiable. Some theories insist momentary experience is all that matters. But this ignores the "whole life" perspective most people care about.

  ***

  **Incompatibility Notes**
  *   **1 vs. Hedonism:** You cant satisfy the Reality Contact Requirement and be a hedonist. Hedonism says the machine is equal to reality. Req 1 says it's not.
  *   **4 vs. Pure Subjectivism:** You cant have the Defective Preference Clause and maintain that "what you want is what is good." One of them has to give.
  *   **2 vs. 5:** If memory is wiped (Req 2), retrospective judgment (Req 5) might not detect the sim. If the theory relies on retrospective judgment, it might miss the ontological loss during the sim phase.

  ***

  **Quick Scorecard**

  *   **Hedonism:**
      *   *Reality Contact:* Fail (says sim = real).
      *   *Toggle Test:* Fail (says if feeling is same, welfare is same).
      *   *Preferences:* Pass (ignores them, focuses on pleasure).
      *   *Retrospective:* Fail (ignores narrative dip if momentary pleasure was high).
      *   *Verdict:* Too thin for these cases.

  *   **Desire-Satisfaction:**
      *   *Reality Contact:* Fail (unless desire is *for* reality).
      *   *Toggle Test:* Mixed (if you desire sim, you win; if you desire reality, you lose).
      *   *Preferences:* Fail (struggles with Defective Preference Clause without major tweaks).
      *   *Retrospective:* Mixed (depends on if you desire narrative coherence).
      *   *Verdict:* Better, but collapses if people actually prefer the fake stuff.

  *   **Objective-List:**
      *   *Reality Contact:* Pass (reality is usually on the list).
      *   *Toggle Test:* Pass (sim lacks objective goods regardless of memory).
      *   *Preferences:* Pass (can say some preferences don't generate value).
      *   *Retrospective:* Pass (can value achievement/narrative over feeling).
      *   *Verdict:* Fits the desiderata best, but risks ignoring how the person actually *feels* about their life (paternalism risk).

  hope this helps structure the dataset. theres definately tension between respecting subjective reports and acknowledging objective losses, but thats the whole game.
