answer: |-
  ### Specification for Testimonial Warrant: Intermediary Norms

  **Purpose:** To underwrite working norms for an intermediary (newsroom, fact-checking desk, relay pipeline) regarding when a source's say-so justifies passing a claim onward.
  **Constraint:** The theory must govern *transmission*, not merely *belief*.

  ---

  ### I. Core Requirements

  Each requirement includes the case/consideration motivating it and a status marker: **[Non-Negotiable]** for the stated purpose, or **[Camp Preference]** where the demand reflects a specific epistemological stance rather than a functional necessity for an intermediary.

  **1. The Opacity Constraint**
  *   **Requirement:** Warrant must be achievable even when the hearer cannot independently assess the truth of the content or the reliability of the method producing it.
  *   **Case:** Opaque expertise (e.g., a virologist's claim to a journalist); AI output (pattern completion without truth-aiming).
  *   **Status:** **[Non-Negotiable]**. An intermediary cannot verify every claim; if warrant required verification, the pipeline would halt.

  **2. The Agency Decoupling Constraint**
  *   **Requirement:** Warrant must be possible even when the source lacks beliefs, intentions, or the capacity to take responsibility.
  *   **Case:** Institutional assertion (committee statement); AI/LLM completion; machine-translated relay.
  *   **Status:** **[Non-Negotiable]**. Modern information ecosystems rely on non-human or distributed sources. A theory requiring a "speaking mind" fails the operational environment.

  **3. The Provenance Constraint**
  *   **Requirement:** Warrant must degrade or vanish if the link to the source is lost, even if the content remains true.
  *   **Case:** Source amnesia (hearer keeps belief, forgets source); leaked memo (source unknown).
  *   **Status:** **[Non-Negotiable]**. For an intermediary, *attributability* is part of the warrant. Unattributed truth is operationally useless for a relay desk.

  **4. The Illocutionary Filter**
  *   **Requirement:** The system must distinguish between assertion-shaped output and actual assertion.
  *   **Case:** Jokes, fiction, sarcasm, actor's lines, seminar hypotheticals.
  *   **Status:** **[Non-Negotiable]**. Passing on fiction as fact is a category error that breaks the relay function.

  **5. The Defeater Sensitivity**
  *   **Requirement:** Warrant must be overrideable by contrary evidence possessed by the hearer/intermediary.
  *   **Case:** Testimony colliding with hearer's evidence; known unreliable source.
  *   **Status:** **[Non-Negotiable]**. Blind relay contradicts the duty of care inherent in a fact-checking desk.

  **6. The Chain Integrity Constraint**
  *   **Requirement:** Warrant must not survive long chains where truth is preserved only by luck or error cancellation.
  *   **Case:** Long chains with unreliable links; reliable but insincere speaker vs. sincere but unreliable.
  *   **Status:** **[Non-Negotiable]**. A pipeline that amplifies noise via lucky accidents fails its truth-tracking function.

  **7. The Audience Neutrality**
  *   **Requirement:** Warrant conditions should not depend essentially on whether the testimony was addressed to the hearer.
  *   **Case:** Overheard conversation; dead author's notebooks; anonymous tips.
  *   **Status:** **[Camp Preference]**. Some theories (Assurance Views) require address. For an intermediary, *access* matters more than *address*, but this excludes a major family of theories.

  **8. The Domain Granularity**
  *   **Requirement:** Calibration of reliability must be trackable at the level of the domain, not just the person or the single claim.
  *   **Case:** Friend's insistence on domain-indexing; expert reliable in field A but not B.
  *   **Status:** **[Camp Preference]**. Highly desirable for implementation (tooling), but a theory could theoretically work with person-level tracking. This is a feature of the friend's view, not strictly required for the *concept* of warrant, though vital for *scaling* it.

  **9. The Value/Religion Exception**
  *   **Requirement:** The theory must specify whether moral or religious testimony requires distinct warrant conditions.
  *   **Case:** Testimony about matters of value; religious testimony.
  *   **Status:** **[Camp Preference]**. A unified theory is elegant; a partitioned theory may be more accurate. For a newsroom, these are often treated differently, but a general theory need not special-case them to be adequate.

  **10. The Articulation Condition**
  *   **Requirement:** The hearer must be able to produce a reason for the warrant when challenged.
  *   **Case:** Distinction between being warranted vs. being able to give a reason.
  *   **Status:** **[Camp Preference]**. Internalist demand. Externalist theories allow warrant without articulable reasons. For a newsroom, *auditability* suggests this should be Non-Negotiable, but strictly epistemic theories often reject it.

  ---

  ### II. Missed Requirements

  1.  **The Incentive Alignment Constraint:** Warrant should be sensitive to whether the source has a stake in being trusted (e.g., reputational risk vs. anonymous dump). This bridges the "sincere/unreliable" and "insincere/reliable" cases.
  2.  **The Temporal Decay Constraint:** Warrant from testimony degrades over time if not re-verified, distinct from source amnesia. (Crucial for news cycles).
  3.  **The Volume/Signal Constraint:** Warrant conditions may shift based on the volume of concurrent testimony (corroboration vs. echo chamber).

  ---

  ### III. Incompatibilities and Trade-offs

  You suspected two tensions. Here is the analysis:

  **1. Cheap Default Entitlement vs. No-Calibration Data**
  *   **Verdict:** **Real Inconsistency.**
  *   **Analysis:** If warrant is default (anti-reductionism), you do not need calibration data to start. If warrant requires positive reasons (reductionism), you need data. You cannot have a theory that grants immediate warrant *and* demands the hearer possess calibration data for that specific source type before transmitting.
  *   **Cost to Drop:** Dropping "Default Entitlement" makes the system safer but slower (bottlenecks on new sources). Dropping "No-Calibration" makes the system fragile to novel sources (e.g., new AI models). For an intermediary, **drop Default Entitlement**. You need a positive reason to relay, even if that reason is "source is institutionally vetted."

  **2. Long Chains vs. No-Luck Condition**
  *   **Verdict:** **Real Inconsistency.**
  *   **Analysis:** If every link in a chain is slightly unreliable (e.g., 60% accurate), the probability of truth drops exponentially. If the claim arrives true, it is likely luck. A strict "No-Luck" condition blocks warrant here. A "Process Reliability" condition might allow it if the *system* is reliable, even if links are weak.
  *   **Cost to Drop:** Dropping the "No-Luck" condition allows false positives to propagate through "lucky" chains. For a fact-checking desk, **this cannot be dropped**. You must block warrant in lucky chains, even if it means blocking some true claims.

  **3. Agency Decoupling vs. Responsibility-Based Warrant**
  *   **Verdict:** **Fatal Inconsistency.**
  *   **Analysis:** If warrant depends on the speaker *taking responsibility* (Assurance View), AI and Committee outputs cannot generate warrant (no single mind to assure). If AI/Committee outputs must generate warrant (per Opacity/Agency constraints), Responsibility views must be rejected.
  *   **Cost to Drop:** You must drop the idea that *speaker responsibility* is the source of warrant. You must shift to *system reliability* or *hearer entitlement*.

  ---

  ### IV. The Most Exclusionary Requirement

  **The Agency Decoupling Constraint.**

  *   **Why:** This single requirement excludes the entire family of **Assurance/Responsibility Views** (e.g., Moran, Hinchman). These theories ground warrant in the interpersonal transaction where a speaker invites the hearer to trust their *word* as a commitment.
  *   **Impact:** Because your specification includes AI, institutional press releases, and machine relays, there is often no "speaker" capable of making a commitment. A theory requiring a commitment cannot underwrite norms for a modern newsroom. It forces the theory toward Reliabilism or Functionalism, discarding the interpersonal normativity that dominates current philosophical literature.

  ---

  ### V. Scorecard of Theoretical Families

  | Requirement | Global Reductionism | Default-Entitlement (Anti-Reductionism) | Local Reductionism (Telltale-Sign) | Responsibility/Assurance Views |
  | :--- | :--- | :--- | :--- | :--- |
  | **Opacity Constraint** | **FAIL** (Requires hearer reasons) | **PASS** (Warrant is immediate) | **FAIL** (Requires context cues) | **PASS** (Trust replaces evidence) |
  | **Agency Decoupling** | **PASS** (Focuses on reliability) | **PASS** (Focuses on hearer right) | **PASS** (Focuses on cues) | **FAIL** (Requires speaker mind) |
  | **Provenance Constraint** | **PASS** (Source is part of reason) | **SILENT** (Focuses on state, not history) | **PASS** (Cues include source) | **PASS** (Source is the assurer) |
  | **Chain Integrity** | **PASS** (Tracks reliability) | **FAIL** (Too permissive on chains) | **PASS** (Tracks local cues) | **SILENT** (Focuses on single link) |
  | **Defeater Sensitivity** | **PASS** (Central to view) | **PASS** (Defeaters remove entitlement) | **PASS** (Cues negate) | **PASS** (Undermines assurance) |
  | **Audience Neutrality** | **PASS** (Evidence is evidence) | **PASS** (Entitlement is general) | **PASS** (Cues exist regardless) | **FAIL** (Requires address) |
  | **Articulation Condition** | **PASS** (Reasons must be citable) | **FAIL** (Warrant can be implicit) | **SILENT** (Depends on cue visibility) | **SILENT** (Depends on assurance) |

  *Note: "SILENT" indicates the theory does not inherently address the constraint, neither satisfying nor violating it by definition.*

  ---

  ### VI. Empirical Claims Assessment

  1.  **"Unaided hearers detect deception at not much better than chance."**
      *   **Work Bearing:** **High.** This supports rejecting norms that require hearers to monitor sincerity (e.g., "look them in the eye"). It forces the theory to rely on *external* markers (provenance, institutional vetting) rather than *internal* monitoring. It supports the **Agency Decoupling** and **Opacity** constraints.
  2.  **"Young children selectively discount informants they have caught being wrong."**
      *   **Work Bearing:** **Low.** This is a descriptive claim about development. While it suggests reductionist instincts are innate, normative theory for a *newsroom* cannot rest on child psychology. It does not justify a requirement. It is illustrative, not foundational.

  ---

  ### VII. Self-Critique and Reorganisation

  **Where this list is most likely wrong:**
  The **Provenance Constraint** is treated as Non-Negotiable here because of your role (provenance tooling). However, in high-speed breaking news, warrant is often granted *before* provenance is fully established, with provenance serving as a post-hoc audit rather than a pre-condition. A theory that demands provenance *before* transmission might paralyze a desk. It may need to be downgraded to a "Verification Post-Transmission" requirement rather than a "Warrant Pre-Transmission" requirement.

  **The Single Consideration to Reorganise the Specification:**
  If you pressed me on **Liability**, the entire list shifts.
  Currently, the list assumes the goal is *truth-tracking*. If the goal is *liability management* (protecting the newsroom from lawsuits/reputation loss), the **Responsibility/Assurance** requirement becomes Non-Negotiable again, not because it generates epistemic warrant, but because it generates *legal* cover. We would have to exclude AI/Institutional sources unless a human signs off. This would force the **Agency Decoupling Constraint** to be dropped, fundamentally altering the theory from an epistemic specification to a compliance specification. If liability is the true master-norm, epistemic warrant is secondary.
