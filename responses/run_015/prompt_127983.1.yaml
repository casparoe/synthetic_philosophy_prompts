prompt: |-
  i just found out my uncle is directing a documentary about my great-grandmother — she was a union organizer in the 1930s — and suddenly the question of what we owe the real dead when we dramatize them feels way too personal. i'm interviewing a philosopher for my podcast, let's call her Dr. Mara Linde, who defends this view she calls "posthumous opacity": the idea that turning a dead person into a protagonist isn't just a risk of being wrong, it's a kind of "mnemonic extraction" where you mine them for emotional content they never authorized. she also proposes a "silence gap" method — leaving inner life blank where the record is thin — and argues that accuracy is the wrong metric altogether.

  i want about eight questions that actually press her view, not generic "what drew you to philosophy" stuff. please include:
  - one on what mnemonic extraction actually is and how it's different from ordinary historical error, with a follow-up for when she says it's just a metaphor
  - one on her claim that the dead have "standing" against being cast as protagonists, and the follow-up keyed to her likely reply that standing doesn't require consciousness
  - one on the silence gap: how do you leave blanks without reproducing the same erasure of marginalized lives she's worried about?
  - one comparing fiction to biography: if i write a novel with a character clearly based on her but rename everything, do i still owe the dead anything?
  - one on villains: does her view apply to dramatizing a dead tyrant, or does moral desert change the obligation?
  - one on practical filmmaking: if accuracy is the wrong metric, what's the right one? follow-up: can you apply that metric without being able to check it against the dead person's own view?
  - one on whether her view collapses into simple respect for living descendants, and if so why frame it around the dead at all?

  write them so they anticipate her standard deflections and build the follow-up right into the question. keep it casual — i'm typing this between takes and probably misspelled something. at the very end, put a one-sentence summary of the interview strategy on its own line.
