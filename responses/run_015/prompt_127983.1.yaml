answer: |-
  1. Let's start with "mnemonic extraction." If a biographer gets a date wrong, that's an error, but you're calling protagonist-hood a kind of mining operation. What's the actual harm here beyond inaccuracy? And I guess my follow-up is—if you say it's just a metaphor for "feeling icky," doesn't that weaken the claim that it's a genuine ethical violation?

  2. You argue the dead have "standing" to object to being cast as protagonists. But usually, standing requires an interest, and the dead don't have consciousness to hold interests. If your reply is that standing doesn't require consciousness, then what *does* it ride on? Is it just a proxy for our feelings?

  3. Your "silence gap" method says leave the inner life blank where records are thin. But my great-grandmother was a union organizer in the 30s—records for women like her are already sparse. Doesn't insisting on silence just reproduce the same archival erasure you're worried about? How do you fill the gap without violating the opacity?

  4. Let's test the boundary. If I write a novel, change the name and dates, but everyone knows it's based on her... do I still owe her opacity? Or does fiction grant a license that biography doesn't? Where's the line?

  5. Does this apply to villains? If I'm dramatizing a dead tyrant, do they still deserve "opacity"? Or does moral desert cancel out the right to not be mined for emotional content?

  6. You say accuracy is the wrong metric. So what's the right one for my uncle's documentary? Respectfulness? Truthiness?

  7. And here's the kicker on that metric: how do you measure respect without checking it against the dead person's own view, which is exactly what you say we can't access?

  8. Is this view actually just about protecting living descendants from distress? If so, why frame it around the dead's rights at all? Why not just say "don't upset the family"?

  The strategy is to trap her in the practical implications of her theory by exposing contradictions between protecting the dead and preserving history.
