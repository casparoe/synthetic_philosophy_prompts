answer: |-
  ### A Research Agenda for the Philosophy of Supererogation (2024–2034)

  To advance the philosophy of supererogation over the next decade, the field must pivot from refining the standard individualistic model to testing its structural limits. The traditional focus on the "Paradox of Supererogation" (how an act can be good yet not obligatory) has reached a point of diminishing returns. Continued tinkering with deontic logic in a vacuum risks irrelevance. Instead, the field should prioritize **domain expansion**. By testing whether supererogation holds in collective and epistemic contexts, we stress-test the core theory. If supererogation collapses in these domains, the individualistic model requires radical revision; if it holds, we gain a robust, unified normative theory.

  Below is a defended agenda ranking the top three conceptual priorities, their dependencies, and the conditions under which this order should change.

  ---

  ### 1. Priority One: The Coherence of Non-Reductive Collective Supererogation
  **The Question:** Can a group perform an act that is praiseworthy and beyond duty, where the act is not required of the group *nor* of any individual member, without reducing to an aggregation of individual supererogatory acts?

  **Defense of Priority:**
  This is the most urgent theoretical gap because moral practice is increasingly institutional. Current literature often treats collective supererogation as merely many individuals doing good deeds (aggregation). However, consider a corporation that voluntarily exceeds environmental regulations at great cost, where no single employee is required to sacrifice their salary, yet the collective entity absorbs the cost. If this is not supererogatory, our moral vocabulary fails to capture institutional virtue. If it *is* supererogatory, it requires a theory of collective agency that allows for collective optionality.

  **Upstream Dependencies:**
  This problem is downstream of **Collective Obligation**. One cannot establish collective *supererogation* without first establishing that groups can bear duties that are not reducible to individual duties. If collective obligation is incoherent, collective supererogation is impossible. However, research should not wait for a consensus on collective obligation; rather, work on collective supererogation should proceed in tandem, using the "beyond duty" constraint to pressure-test theories of collective agency.

  **Tractability:**
  *   **Conceptual:** High difficulty. Requires reconciling non-distributive collective agency with the intuition that only individuals feel the "burden" of sacrifice.
  *   **Empirical:** Low utility. Intuitions about group praise are culturally variable and often track legal liability rather than moral status.

  ### 2. Priority Two: The Normative Autonomy of Epistemic Supererogation
  **The Question:** Does exceeding evidential obligations in belief formation constitute a genuine *epistemic* supererogation, or does it collapse into moral duty (e.g., being a good citizen) or prudence (e.g., avoiding error)?

  **Defense of Priority:**
  Epistemology is increasingly recognized as normative. We speak of "intellectual virtues" and "epistemic duties." If there is an epistemic 'ought,' is there an epistemic 'beyond'? For example, spending hundreds of hours verifying a trivial claim when basic evidence suffices. If this is supererogatory, it must be *epistemically* praiseworthy, not just morally nice. This priority is ranked second because it bridges ethics and epistemology. Resolving it clarifies whether supererogation is a feature of *morality* specifically or *normativity* generally.

  **Upstream Dependencies:**
  This is downstream of the **Distinctness of Epistemic Normativity**. If epistemic norms are merely a subset of moral norms (moral encroachment), then epistemic supererogation collapses into moral supererogation. Research must first defend the autonomy of epistemic value.

  **Tractability:**
  *   **Conceptual:** High difficulty. The risk of "normative collapse" is significant.
  *   **Empirical:** Moderate utility. Experimental philosophy could assess whether agents intuitively praise "extra" belief-formation differently than "extra" moral acts.

  ### 3. Priority Three: The Scalar-Deontic Interface
  **The Question:** Is supererogation a distinct deontic category (optional but good), or is it a scalar value that appears deontic only due to threshold effects?

  **Defense of Priority:**
  This is the foundational bedrock. While I argue against making this the *primary* focus (due to diminishing returns), it cannot be ignored. Both Collective and Epistemic supererogation rely on the logic of "exceeding a requirement." If requirements are merely thresholds on a scalar scale of value (Scalar Utilitarianism), supererogation disappears as a unique category. We need a working model of how value translates into duty to evaluate the first two priorities.

  **Upstream Dependencies:**
  This is upstream of **both** Priority 1 and 2. It is the meta-ethical engine. However, it is listed third because progress here is best achieved by applying the model to new domains (1 and 2) rather than abstract theorizing.

  **Tractability:**
  *   **Conceptual:** Moderate. The literature is saturated, but new data from Collective/Epistemic cases can break the stalemate.
  *   **Empirical:** Low. This is a logic problem, not a psychological one.

  ---

  ### Dependency Map and Workflow

  1.  **Foundation:** The Scalar-Deontic Interface (Priority 3) provides the logical syntax for "exceeding duty."
  2.  **Application A:** Collective Agency norms feed into **Collective Supererogation** (Priority 1).
  3.  **Application B:** Epistemic Normativity feeds into **Epistemic Supererogation** (Priority 2).
  4.  **Feedback Loop:** Failures in 1 or 2 (e.g., if collective supererogation proves incoherent) force a revision of 3 (e.g., perhaps duty is always collective, making individual supererogation the anomaly).

  **Recommended Workflow:** Researchers should not treat these linearly. The most productive path is **reflective equilibrium across domains**. Use the intuition that "corporate philanthropy is supererogatory" to test deontic logic, rather than using deontic logic to judge corporate philanthropy.

  ---

  ### Conditions for Reordering the Agenda

  This agenda is contingent on specific philosophical developments. I would reorder the priorities under the following conditions:

  1.  **If Collective Agency is Debunked:** If compelling arguments demonstrate that groups cannot hold irreducible obligations (e.g., robust methodological individualism is proven definitive), **Priority 1 must be dropped**. It would then become a lower-priority sub-question of individual coordination. Priority 2 (Epistemic) would move to #1, as it remains a viable domain for normative expansion.
  2.  **If Moral Encroachment Wins:** If the consensus shifts decisively toward the view that all epistemic norms are moral norms (Moral Encroachment), **Priority 2 collapses**. Epistemic supererogation would simply be moral supererogation applied to belief. In this case, Priority 3 (Scalar-Deontic) moves to #1, as resolving the nature of moral duty becomes the only way to understand belief norms.
  3.  **If Empirical Psychology Reveals Uniformity:** If cross-cultural empirical work shows that "praise" tracks only "utility maximization" and not "optionality," this would suggest supererogation is a folk-psychological illusion. This would elevate **Priority 3** to an emergency status, requiring a defense of the category's existence before expanding it.

  ---

  ### Deprioritization: What to Cut and Why

  To make room for this agenda, the following areas should be deprioritized:

  1.  **Historical Exegesis of Classic Cases:**
      *   *Grounds:* **Limited Downstream Effect.** Endless analysis of the "Saint vs. Soldier" cases (e.g., Urmson's examples) has yielded marginal gains. Unless a historical text offers a novel structural insight applicable to Collective or Epistemic domains, pure scholarship should be minimized.
  2.  **Purely Psychological Studies of Praise:**
      *   *Grounds:* **Intractability/Category Error.** While the psychology of praise is interesting, supererogation is a normative category, not a descriptive one. Knowing *that* people praise acts does not tell us if they *should*. Empirical work should only be funded if it directly tests conceptual boundaries (e.g., do people perceive group acts differently than individual acts?), not as a standalone descriptive project.
  3.  **Refining the "Minimum Conception" of Supererogation:**
      *   *Grounds:* **Diminishing Returns.** Debates over whether supererogation requires "sacrifice" or merely "merit" are stalling. This should be treated as a background assumption. If the Collective or Epistemic projects reveal that sacrifice isn't necessary in those domains, we can revise the Minimum Conception later. Do not let definition-policing block domain exploration.

  ### Conclusion

  The philosophy of supererogation risks becoming a niche sub-field if it remains confined to individual moral heroism. By prioritizing **Collective** and **Epistemic** expansions, we force the core theory to prove its robustness. The dependency on the **Scalar-Deontic Interface** remains, but it should be serviced by the friction generated in these new domains. This agenda moves the field from defining what supererogation *is* to determining where supererogation *lives*.
