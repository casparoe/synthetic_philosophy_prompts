answer: |-
  **To:** The Interdisciplinary Seed Grant Committee
  **From:** Committee Chair
  **Subject:** Operational Framework for Metric Adoption (The Metric Vetting Protocol)

  ### Executive Summary (For 10-Minute Administrator Briefing)
  We are adopting a **Metric Vetting Protocol (MVP)** to prevent our evaluation criteria from distorting the science they measure. Current metrics risk three failures: **Proxy Corruption** (the measure stops tracking reality), **Target Displacement** (researchers pursue the measure instead of the goal), and **Reflexive Gaming** (researchers manipulate study design to trigger the measure without improving quality).

  The MVP is a four-step checklist. It forces us to verify the causal link between a metric and scientific quality before adoption. It identifies when a metric must be rejected, when it requires safeguards (like audits), and when we must admit that no number can capture our values. This ensures seed grants reward actual innovation, not just optimization of our spreadsheet.

  ---

  ### Part I: The Metric Vetting Protocol (MVP)

  This procedure is to be applied to any proposed quantitative metric prior to formal adoption.

  #### Phase 1: Causal Coupling & Reflexive Gaming Diagnostic
  *Goal: Establish if the metric physically/causally tracks the intended phenomenon.*

  1.  **The Mechanism Question:** Can we articulate a direct causal mechanism by which an increase in *Scientific Quality* necessarily produces an increase in the *Metric*?
      *   *If No:* **STOP.** Reject metric. (This is Proxy Corruption).
      *   *If Yes:* Proceed to 2.
  2.  **The Lag Question:** Is there a significant time lag between the scientific work and the metric signal (e.g., citations take years)?
      *   *If Yes:* Flag for Safeguards (Phase 3).
      *   *If No:* Proceed to 3.
  3.  **The Reflexive Gaming Diagnostic (Red Team Test):** Assume the role of a grant applicant who wants to maximize this metric *without* doing high-quality work. Can you describe a specific study design change that would inflate the metric while leaving scientific quality constant or degraded?
      *   *Example:* "I will run smaller sample sizes to increase publication count, knowing the metric counts papers, not robustness."
      *   *If Yes (Gaming Path Identified):* Proceed to Phase 2.
      *   *If No:* Proceed to Phase 3.

  #### Phase 2: Rejection Conditions (Stop Rules)
  *Goal: Identify metrics that are inherently toxic to the evaluation process.*

  **Reject the metric outright if ANY of the following are true:**
  1.  **Direct Control:** The subject has full control over the data input for the metric (e.g., self-reported collaboration hours) with no external verification.
  2.  **Incentive Inversion:** The cost of "gaming" the metric (from Phase 1, Q3) is significantly lower than the cost of achieving the actual scientific target.
  3.  **Target Displacement Risk:** Achieving the metric requires narrowing the scope of inquiry such that it excludes the very interdisciplinary novelty we intend to fund (e.g., requiring standard methods to ensure replication proxies).

  #### Phase 3: Retention with Safeguards
  *Goal: Determine if the metric can be used if "control rods" are inserted.*

  **Retain the metric ONLY IF the following safeguards are institutionally feasible:**
  1.  **The Audit Rule:** We can randomly select 10% of funded projects for qualitative review to check if high metric scores correlate with high expert-rated quality.
  2.  **The Noise Injection:** We can introduce uncertainty into the evaluation (e.g., metrics count for only 50% of the decision) to reduce the payoff of precise gaming.
  3.  **The Sunset Clause:** The metric is automatically retired after 3 years to prevent long-term adaptation by the applicant pool.

  #### Phase 4: Normative Judgment Points (The "Values Gap")
  *Goal: Identify where procedural rules end and committee values begin.*

  **Explicit Judgment Required:**
  1.  **Target Selection:** The MVP validates the *link* between metric and target, but **cannot** validate the *target* itself. The Committee must explicitly vote on whether the target (e.g., "Replication" vs. "Novelty") aligns with the university's mission.
  2.  **Risk Tolerance:** The Committee must decide if the risk of False Negatives (rejecting good science that scores low) is acceptable to avoid False Positives (funding bad science that scores high).
  3.  **The "Good Enough" Threshold:** At what point does the administrative burden of Safeguards (Phase 3) outweigh the benefit of using the metric?

  ---

  ### Part II: Application to Case Studies

  #### Case (a): Replication-Rate Proxies in Behavioral Psychology
  *Proposal:* Evaluate pilot studies based on the likelihood of successful replication (measured by power analysis and pre-registration strictness).

  *   **Phase 1 (Coupling):** Causal link exists (rigorous methods → higher replication). **Reflexive Gaming Diagnostic:** Researchers can select trivial hypotheses that are easy to replicate but scientifically uninteresting. They can also over-estimate power in pre-registration.
  *   **Phase 2 (Rejection):** **Condition 2 Met (Incentive Inversion).** It is easier to pick a trivial hypothesis than a novel, risky one. This creates Target Displacement (Safety over Discovery).
  *   **Phase 3 (Safeguards):** Audits are possible but require expert reviewers, slowing the process.
  *   **Phase 4 (Judgment):** We must decide if we value *certainty* or *discovery* in seed grants.
  *   **Verdict:** **REJECT.** For seed grants, the risk of stifling novelty is too high. Replication is a downstream goal, not a pilot metric.

  #### Case (b): Cross-Disciplinary Citation Counts (Climate Science + Humanities)
  *Proposal:* Evaluate collaborations based on how often the joint work is cited by *both* climate science and humanities journals.

  *   **Phase 1 (Coupling):** **Condition 1 Failed.** Humanities citation cycles are 5-10 years; Climate Science is 2-3 years. The causal mechanism is decoupled by time and cultural practice.
  *   **Phase 2 (Rejection):** **Condition 1 Met (Direct Control/Validity).** The metric measures *visibility*, not *integration*. A team could write two separate papers and cross-cite them to game the "cross-disciplinary" count.
  *   **Phase 3 (Safeguards):** No safeguard fixes the fundamental time-lag mismatch.
  *   **Phase 4 (Judgment):** N/A (Failed earlier).
  *   **Verdict:** **REJECT.** This is Proxy Corruption. The metric does not measure integration; it measures simultaneous publication. Use qualitative peer review of the *integration mechanism* instead.

  #### Case (c): The Institutional Conflict (Hypothetical)
  *Scenario:* The MVP recommends retaining "Citation Velocity" but only with a **Sunset Clause** and **50% Weighting** (Safeguards). The University Administration demands 100% weighting for rapid annual reporting.

  *   **Phase 1-3:** The metric passes technical vetting *only* with safeguards.
  *   **Phase 4 (Judgment):** This triggers the **Risk Tolerance** and **"Good Enough" Threshold** judgment.
  *   **Conflict:** The Administration values *speed of reporting* (Administrative Quality). The Committee values *validity of selection* (Scientific Quality).
  *   **Procedure Output:** The MVP explicitly flags this as a **Normative Judgment Point**. The procedure cannot resolve this. It mandates that the Committee formally record: *"Adoption of this metric without safeguards increases the probability of funding low-quality work by X%. We proceed acknowledging this risk."*
  *   **Verdict:** **RETAIN WITH DOCUMENTED OBJECTION.** The procedure forces the risk into the open. It prevents the committee from claiming the metric *ensures* quality when it does not.

  ---

  ### Part III: Structural Limitations of the Procedure

  As Chair, I must articulate what the MVP *cannot* do. This is crucial for our philosophical integrity.

  1.  **The Underdetermination of the Target:** The MVP tests if a metric measures a target accurately. It **cannot** tell us which target is *correct*.
      *   *Example:* We can measure "Number of Publications" perfectly. The MVP can tell us this correlates with "Productivity." It cannot tell us if "Productivity" is the correct goal for a seed grant versus "High-Risk Innovation." This is a value judgment, not a measurement problem.
  2.  **The Horizon Problem:** The MVP relies on known mechanisms of gaming. It cannot predict *novel* forms of gaming that emerge after adoption. It requires periodic re-application (hence the Sunset Clause).
  3.  **The Administrative Reality:** The MVP can identify that a metric is dangerous, but it cannot compel the Administration to fund the qualitative review necessary to replace it. It exposes the trade-off between *cost* and *validity*, but cannot resolve it.

  ### Implementation Plan
  1.  **Adoption:** Vote to adopt the MVP as standing committee policy.
  2.  **Training:** Distribute this one-page summary to all members. No statistical training required; only logical consistency.
  3.  **Review:** Apply the MVP to our current three metrics at the next monthly meeting.
  4.  **Reporting:** Use the "Executive Summary" above for the Dean. It demonstrates rigor without admitting paralysis.

  **Recommendation:** We proceed with the MVP. It shifts our defense from "we think these numbers are wrong" (subjective) to "these numbers fail the causal coupling test" (procedural). This is defensible to administration and protects the scientific integrity of the grants.
