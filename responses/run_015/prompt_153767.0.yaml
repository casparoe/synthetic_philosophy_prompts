      *   *Prediction of Misfire:* Students treating it as a game to "win" individually rather than simulating a society. Or the Stewards feeling villainized.
      *   *Correction:* Facilitator intervention during the crisis to emphasize "Societal Survival" over "Role Victory."

  8.  **Final Polish:**
