      *(Self-Correction during drafting)*: 14 students is a specific number. 4 Stewards, 8 Kin-Keepers, 2 Scribes works.
      *Wait, do Scribes have a victory condition?* Let's make their goal: "Accurately describe the outcome." If they call it 'Collapse' when 'Dissolution' happened (based on network survival), they lose. This forces them to pay attention to the definition.
      *Actually, better:* Scribes just record. The *class* decides the label in debrief. It's cleaner.
      *Let's stick to the prompt:* "Observers" are requested. Let's give them a role in the reveal.
      *Revised Roles:* 5 Institutional Stewards, 7 Network Maintainers, 2 Chroniclers (Observers).
      *Victory:* Stewards = Institution stands. Maintainers = 3+ ties remain. Chroniclers = Predict the outcome label.

      *Wait, one more check on the "Minimal Rule-Set":*
      The tension must be: "Describe transformation as collapse vs adaptive dissolution."
      The mechanics must make "Institution Persistence" costly to "Network Continuity."
      Okay, the resource scarcity model works best.

