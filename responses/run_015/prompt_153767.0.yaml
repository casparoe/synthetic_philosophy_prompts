  2.  **Brainstorming the Core Mechanic (The "Minimal Rule-Set"):**
      *   *Problem:* How to simulate "collapse" vs. "dissolution"?
      *   *Idea 1:* Resource management. If resources hit zero, you lose. (Too generic, implies collapse is always bad).
      *   *Idea 2:* Building vs. Connecting. One group builds a "Monument" (Institution), another group maintains "Ties" (Networks).
      *   *Idea 3:* The "Sinking Ship" scenario. Do you save the ship (Institution) or the passengers (Network)?
      *   *Refinement:* Let's use a "Resource Pool" representing societal energy. There are two ways to spend it: Maintain the *Structure* (a central bank/temple/palace represented by a physical object or score) or Maintain the *Links* (connections between players).
      *   *The Twist:* A "Stress Event" drains the pool. Players must choose: Pour everything into the Structure to keep it standing (risking links) or dismantle the Structure to feed the Links.
      *   *The Hidden Victory:* Half the players win if the Structure stands at the end. Half win if they remain connected to at least 3 others, regardless of the Structure.
      *   *The Tension:* If the Structure players win, the Network players likely starve (Collapse narrative). If the Network players win, the Structure likely falls (Adaptive Dissolution narrative). But if they collaborate, they might realize the Structure *had* to fall to save the Network.
      *   *Minimal Rule:* Energy is finite. Structure costs energy to maintain. Links cost energy to maintain. Stress increases costs. You can dismantle Structure to gain immediate Energy for Links.

  3.  **Designing the Activity ("The Polity Game"):**
      *   *Setting:* A generic "Polity" (avoids specific historical baggage initially).
