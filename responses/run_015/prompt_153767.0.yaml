  5.  **Refining the Mechanics for Philosophical Pressure:**
      *   *Crucial Detail:* The Stewards *cannot* win if the Kin-Keepers lose. (Interdependence). But the Kin-Keepers *can* win if the Stewards lose (if they dismantle the monument to save ties).
      *   *Correction:* If Stewards need the Monument, and Kin-Keepers need Ties, and Resources are scarce...
