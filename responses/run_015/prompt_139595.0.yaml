answer: |-
  Here is a draft question, model answer, and marking scheme designed to meet your specifications. I have kept the language accessible to second-year students while ensuring the philosophical tension you identified is the central hurdle for high marks.

  ### Exam Question

  **Module:** Philosophy and Political Economy
  **Text:** David Hume, *Political Discourses* (1752)
  **Time:** 90 Minutes (Take-home)
  **Total Marks:** 20

  **(a)** Hume claims that "money is nothing but the representation of labour and commodities." Yet, in *Of Money*, he argues that an increase in the stock of gold is advantageous to a state. Briefly explain how these two claims are reconciled in his analysis. **(5 marks)**

  **(b)** Hume locates the benefit of new money in the interval *before* prices rise to match the new supply. Critically assess whether this temporary stimulus is consistent with Hume's wider philosophical emphasis on 'habit and custom'. Does the economy return to a neutral equilibrium, or does the interval leave a permanent mark on the nation's industry? **(15 marks)**

  ***

  ### Model Answer (600–700 words)

  Hume's reconciliation of money's neutrality with its beneficial effects rests on a distinction between the long-run equilibrium and the short-run transition. In the long run, Hume agrees with the quantity theory of money: if the stock of gold doubles, prices eventually double, leaving real wealth unchanged. Money is merely a "representative" sign; it is not wealth itself, which consists of goods and labour. However, Hume departs from strict neutrality by arguing that the *process* of adjustment matters. When new money enters a nation, it does not inflate all prices instantly. It circulates sector by sector. During this interval, merchants and manufacturers see higher demand and prices for their specific goods before the cost of their inputs rises. This profit margin "enlivens industry," prompting workers to labour harder and producers to expand capacity.

  This mechanism, often called the price-specie flow mechanism, suggests that a favourable balance of trade (an influx of gold) is beneficial not because the gold stays, but because of what it triggers while it is present. The gold eventually flows out again as high domestic prices make exports uncompetitive, restoring the equilibrium. The critical question is whether this return to equilibrium negates the benefits gained during the interval.

  Here, a tension arises between Hume's economics and his epistemology. In his philosophical works, Hume posits that habit and custom are the great guides of human life. We act based on past experiences and established routines. If his economic model treats the interval as a mere transient disturbance before a steady state is restored, it risks treating human industry as purely reactive to price signals, ignoring the formative power of custom. If workers are stimulated to industry only while the money is fresh, do they revert to idleness once the gold flows out and prices stabilise?

  A close reading suggests Hume believes the interval *does* leave a permanent mark, thereby resolving the tension. In *Of the Balance of Trade*, Hume notes that the stimulus of new money increases not just current production, but the "number of hands" (population) and the "skill" of the workforce. These are real changes in the economy's capacity, distinct from the nominal value of money. Once a habit of industry is acquired, or a new infrastructure built, it does not vanish simply because the money supply contracts. The "custom" of industry persists even after the monetary shock dissipates.

  Therefore, the equilibrium is not a return to the *exact* prior state. While the ratio of money to prices stabilises, the real volume of trade and the sophistication of labour may remain elevated. Hume's economics is not a closed loop where nothing sticks; the monetary shock acts as a catalyst that alters the underlying habits of the population. This aligns with his psychology: the interval creates a new custom of industry, which becomes self-sustaining. Consequently, Hume is not conceding the short run to the mercantilists only to dismiss it; he is arguing that the short-run dynamics are the very engine of long-run growth. The gold flows out, but the "wealth" (in goods and skills) remains.

  To argue otherwise—that the economy returns to a perfectly neutral steady state—would require assuming that human behaviour is infinitely elastic and forgetful, contradicting Hume's own view that character and habit are durable. Thus, the price-specie flow mechanism is not merely a self-correcting error; it is a developmental process. The "lag" between money arrival and price adjustment is not a friction to be eliminated, but the space in which real wealth is created. Hume successfully integrates his psychology with his economics by showing that while money is neutral in the abstract, its movement shapes the concrete habits that constitute national power.

  ***

  **[Footnote for the Biologist]**
  *In the Model Answer above, the control theory mapping is as follows:*
  *   **"Long-run equilibrium" / "Steady state":** The point where money supply matches price levels and gold stops flowing.
  *   **"Interval" / "Transition":** The **lag** phase where the system responds to the input (gold) before the feedback (price rise) corrects it.
  *   **"Transient" vs "Permanent mark":** You are asking if the system output returns to the baseline (transient response) or if the step input changes the system parameters permanently (permanent change in capacity/habit).

  ***

  ### Marking Scheme (Total 20 Marks)

  **Grade Boundaries & Must-Hit Points**

  **1. Accuracy of the Mechanism (5 marks)**
  *   **5:** Clearly explains that money enters -> industry stimulates -> prices rise -> gold flows out. Identifies that prices do not rise instantly.
  *   **3:** Describes the flow of gold but misses the *timing* of the price rise (the interval).
  *   **1:** Vague reference to "trade balances" without mechanism.
  *   *Typical Error:* Treating the mechanism as instantaneous (no interval).

  **2. The 'Interval' as Source of Value (5 marks)**
  *   **5:** Explicitly identifies the period *before* prices rise as the source of the economic benefit ("enlivening industry").
  *   **3:** Mentions the benefit but attributes it to having "more money" generally, rather than the timing.
  *   **1:** Claims the benefit is keeping the gold permanently (Mercantilist error).
  *   *Typical Error:* Confusing Hume with the Mercantilists he is critiquing.

  **3. Money vs. Real Wealth (3 marks)**
  *   **3:** Distinguishes between nominal value (money/prices) and real wealth (goods/labour/skills).
  *   **1:** Treats money as wealth.
  *   *Typical Error:* Equating "richer nation" with "more gold in vaults."

  **4. Engagement with 'Habit and Custom' (4 marks)**
  *   **4:** Connects the economic interval to Hume's psychological theory. Asks if the stimulus fades or sticks.
  *   **2:** Mentions 'habit' but does not apply it to the economic outcome.
  *   **0:** Ignores the philosophical prompt entirely.
  *   *Typical Error:* Treating 'habit' as a buzzword without linking it to industry or labour.

  **5. Resolution: Transient vs. Permanent (3 marks)**
  *   **3:** Argues that skills/population (real factors) remain even after money leaves (Permanent mark).
  *   **1:** Argues everything returns to exactly how it was (Purely Transient).
  *   *Typical Error:* Assuming the "self-righting" loop erases all history.

  **Handling Anachronisms (Modern Economics)**
  *   **Reward:** If modern concepts (e.g., "sticky prices," "multiplier effect") are used *strictly* to illuminate Hume's logic.
  *   **Penalise:** If the student critiques Hume for not knowing about fiat currency or central banks. This is a history of thought exam; judging 1752 by 2024 standards shows a lack of contextual understanding. Deduct 2–3 marks for "Presentism."

  **Grade Profiles**
  *   **First (17–20):** Hits all 5 points. Synthesises the psychology and economics seamlessly. Argues that the "custom of industry" survives the monetary correction.
  *   **2.1 (14–16):** Hits points 1, 2, 3, and 5. Explains the mechanism and the permanent mark well, but the link to Hume's *philosophy* of habit (Point 4) is descriptive rather than analytical.
  *   **2.2 (10–13):** **Bare Recitation Limit.** Hits points 1 and 2 accurately (describes the mechanism well) but fails to engage with the 'habit/custom' tension or the permanence of the effect. This is the ceiling for a student who has memorised the slogans but not thought about the implications.
  *   **Fail (0–9):** Misunderstands the mechanism (thinks Hume is a Mercantilist) or fails to answer Part (b).
