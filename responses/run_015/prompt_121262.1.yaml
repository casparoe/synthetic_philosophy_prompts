answer: |-
  The rain beat against the high, grime-streaked windows of the community hall, a rhythmic static that Julian, the conductor, insisted was distracting. He tapped his baton against the music stand. *Click. Click. Click.*

  "Tenors," Julian said. "You are swaying. You are adding weight where there is none. The score says *mezzo-forte*. It does not say *regret*."

  Arthur stood in the second row, his sheet music trembling slightly in his hand. Beside him, three chairs down, sat Claire. She was looking at her phone, scrolling through something bright and mundane. She did not know he had packed a bag. She did not know he had signed the lease on a studio apartment in the city. He had tried to tell her at breakfast, over coffee that had gone cold. He had opened his mouth, and the words had dissolved into a query about the weather, a comment on the toast. The softness of ordinary speech allowed him to hide. It allowed for hesitation, for the gentle blur of implication.

  "Again," Julian said. "From the bridge. And this time, no vibrato. Straight tone. I want to hear the air."

  Arthur raised the music. The piece was generic, a nineteenth-century arrangement of a folk song about harvest and home. The lyrics were hollow to him now, clichés of binding and return. *Bind the sheaf, bring it in.*

  He began to sing. At first, he sang as he spoke: carefully, modulating his voice to blend, to soften the edges so as not to disturb the air around Claire. He sang with the social mediation of a husband who wants to avoid a scene.

  "Stop," Julian said. He pointed at Arthur. "You. You are coloring the note. You are trying to make it nice. Don't make it nice. Make it true. Hit the pitch and hold it. Do not waver."

  Arthur looked at the note on the page. A B-flat. Hold for four counts.

  He took a breath. He thought about the lease. He thought about the silence of the studio apartment. He thought about the way Claire's hand had looked on the table at breakfast, resting near the sugar bowl. In conversation, these thoughts were too heavy; they sank the sentence. They required explanation, apology, justification. They required a narrative he could not construct.

  But here, the music demanded a specific architecture. It required him to engage his diaphragm, to lock his ribcage, to push a column of air through his throat with exact pressure. There was no room for the waver of guilt. The constraint of the rhythm forbade hesitation. The requirement of the straight tone forbade the decorative tremolo of emotion.

  He began the phrase again.

  *Bind the sheaf.*

  He did not try to feel the words. He submitted to the rigidity of the measure. He forced his voice into the narrow channel Julian demanded. He stripped away the performance of kindness. He sang the note with a cold, hard precision. He gave the sound everything he had, not in a burst of passion, but in a commitment to the structure. He held the B-flat. He did not let it decay. He pushed the air until his lungs burned, maintaining the pitch exactly, without fluctuation.

  In that sustained pressure, the separation between the song and the secret collapsed. He was not singing about harvest. He was singing about leaving. The rigidity of the form prevented him from lying. You cannot lie on a straight tone; you can only sustain or break. He sustained.

  The sound was not beautiful. It was bare. It was a stark, vibrating line that cut through the damp air of the hall. It carried the finality of the signed lease. It carried the coldness of the studio apartment. It was an admission without a verb.

  He finished the phrase. He lowered the music.

  The hall was silent. The rain against the window seemed to have stopped, or perhaps the silence inside had swallowed it.

  Claire had put her phone down. She was not looking at him with anger, or confusion. She was looking at him with the recognition of someone who has heard a voice they know stripped of its costume. She had heard the texture of the sound. She had heard the decision embedded in the breath support.

  Julian lowered his baton. "Yes," he said softly. "Like that."

  Arthur folded his sheet music. He did not speak to Claire. There was no need to revert to the soft, mediating prose of the kitchen table. The disclosure had already occurred. The artifice of the song had done the work that his honesty could not. He had told her he was leaving, not by saying the words, but by refusing to waver on the note.

  "Break," Julian said.

  The choir members shuffled, zipping jackets, clearing throats, returning to the world of conversation. Arthur walked toward the coat rack. Claire met him there. She held out his coat. Her hand did not shake.

  "I heard," she said.

  Arthur took the coat. "I know."

  He did not say *I'm sorry*. He did not say *It's not you*. He put on his coat. The structure of the evening held them both, rigid and clear, until he opened the door and stepped out into the rain.
