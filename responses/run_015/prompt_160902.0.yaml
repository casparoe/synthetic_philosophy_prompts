      *   **Section 3: Waste versus differential cost.**
          *   *Goal:* Zahavi vs. Spence.
          *   *Content:* Zahavi's Handicap Principle emphasizes *waste* (reducing survival) to prove vigor. Formal models (Spence) emphasize *differential cost* (education costs less for smart people). You don't need waste, you need differential burden. A hurdle that consumes time hurts low-competence candidates more (opportunity cost) than high-competence ones. If the cost is purely monetary and everyone values money equally, it signals wealth. If the cost is effort, it signals ability. The "hurt" must be relative to capacity.
