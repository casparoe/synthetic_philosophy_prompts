          *   *Correction:* Rename to "Trait-Conditional Cost" vs "Endowment-Conditional Cost."

      *   **Section 5: Paying people to signal.**
          *   *Goal:* The subsidy crux.
          *   *Content:* Does subsidy destroy the signal? Only if the signal is *positional* (ranking) or if the subsidy is uniform but valuations differ. If you pay travel costs, you remove the wealth barrier. The signal remains if the *effort* cost remains differential. However, if the hurdle is purely monetary (the £2k cert), subsidizing it removes the signal entirely unless the *difficulty* of the cert is the signal. If the hurdle is ranking (relative), subsidizing everyone leaves the ranking unchanged *only if* the constraint was purely budget. But if the constraint was risk tolerance (unpaid work), subsidy fixes that. Subsidy repairs the signal validity (measures trait, not wealth) but might weaken the filter if wealth was the intended proxy for "grit."
