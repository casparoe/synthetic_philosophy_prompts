  1. **Summary**
  Your two worries are distinct but causally linked. The first concerns validity: is the signal measuring the trait you want (competence) or a correlated variable (wealth)? The second concerns mechanism: does removing the monetary cost destroy the separation between candidates? They are not the same worry because a signal can be mechanically robust (honestly measuring wealth) but invalid for your purpose (hiring for skill). Your distinction between 'trait-elastic' and 'budget-elastic' is intuitively correct but technically imprecise; signaling theory requires costs to be differential across types, not merely elastic. Regarding subsidies: paying candidates does not necessarily destroy the signal, provided the remaining cost (effort, time, risk) remains harder for low-quality candidates to bear than high-quality ones. If the hurdle is purely monetary, subsidy destroys the signal. If the hurdle is effort-based, subsidy repairs the validity by removing wealth noise. You can argue that the current proposals select for liquidity, not ability, and that subsidizing the cost restores the link between cost and competence. Ultimately, you are debating whether to select for resilience against poverty or resilience against complexity.

  2. **What costliness has to buy**
  For a cost to convey information, it must satisfy the 'single crossing property'. It is not enough that a signal is expensive; it must be differentially expensive. Specifically, the marginal cost of producing the signal must be lower for the high-quality type than for the low-quality type. If a hurdle costs £1,000 for everyone, and everyone values money equally, it filters only for those with £1,000. It tells you nothing about their competence, only their liquidity. For the cost to signal competence, the burden must feel lighter to the competent. This usually happens when the cost is denominated in effort or cognitive load rather than currency. A smart candidate finds a complex case study easier to complete than a less smart one; the time cost is lower for them. Mere expensiveness creates a separating equilibrium only if wealth correlates perfectly with the trait you seek. In graduate selection, wealth and competence are noisy correlates. Therefore, a purely monetary hurdle buys you information about bank balances, not potential. To buy information about ability, the cost must be tied to the exertion of that ability. The machinery requires that low-types cannot mimic high-types because the cost of mimicry exceeds the benefit of the job offer. This condition ensures that the signal cannot be cheaply mimicked by those lacking the underlying quality. If the cost is cash, and the low-type has rich parents, mimicry is cheap.

  3. **Waste versus differential cost**
  There is a tension here between the biological intuition and the economic formalism. The original Handicap Principle (Zahavi) suggested signals must be wasteful—actively reducing survival—to prove vigor. If you can survive despite the handicap, you are strong. However, formal signaling models show waste is not strictly necessary; differential cost is sufficient. The cost does not need to be thrown away; it needs to be harder for the impostor to pay. In your context, requiring a £2,000 certificate is wasteful if the certificate teaches nothing relevant; it is a pure burn of resources to prove wealth or commitment. A supervised case study is less wasteful; it consumes time, but produces work you can evaluate. The 'hurt' your colleague mentions is necessary only insofar as it prevents mimicry. If a low-competence candidate can easily fake the signal, the signal fails. But the hurt does not need to be social waste; it can be productive effort. The confusion in your committee arises from conflating 'costly to the candidate' with 'wasted resources'. You can have a costly signal that is not wasteful (e.g., performing a task relevant to the job). The formal models support your intuition: you need differential burden, not necessarily waste. If the cost is relevant to the job, it is both a signal and a test. If it is purely monetary, it is a handicap that signals wealth, not skill. Thus, the cost serves as a filter not because it is high, but because it is disproportionately high for the wrong type.

  4. **Honest, but about the wrong thing**
  Your distinction requires correction. In signaling theory, costs are not 'elastic'; rather, the burden varies by type. Let us refine your terms to 'Trait-Conditional Cost' versus 'Endowment-Conditional Cost'. A hurdle is valid only if the cost is conditional on the trait you wish to select. Your first worry is precisely that the proposed hurdles are Endowment-Conditional. An unpaid residential costs money; the burden falls on those with low liquidity, regardless of competence. This creates an honest signal of wealth, not ability. Your colleagues are correct that it is informative, but wrong about what it informs. It honestly reveals who can afford to be unemployed for two days. Your second worry asks if removing the monetary component breaks the signal. It breaks the signal of wealth, which is desirable if you want to hire for skill. If you subsidize travel, the cost becomes time and effort. If high-ability candidates find the assessment easier (lower time cost), the signal remains honest regarding ability. The distinction does real work: it forces the committee to ask 'Who finds this hard?' If the answer is 'The poor,' it is Endowment-Conditional. If the answer is 'The unskilled,' it is Trait-Conditional. You should argue that current proposals are Endowment-Conditional masks as Trait-Conditional. Correcting this does not weaken the signal; it retargets it. You are not losing information; you are stopping the measurement of the wrong variable. This reframing allows you to challenge the committee without rejecting signaling theory itself.

  5. **Paying people to signal**
  This is the crux: does subsidizing the cost destroy the separation? It depends on whether the signal is absolute or positional. If the hurdle is a threshold (pass/fail), uniform subsidy repairs the signal by removing noise (wealth) without affecting the trait measurement (ability), provided the effort cost remains. If you pay for travel, the cost to the candidate shifts from money to time. If able candidates complete the task faster, separation is maintained. However, if the hurdle is positional (ranking candidates against each other), subsidy changes nothing if everyone receives it. The ranking remains based on performance. The danger arises if the subsidy is targeted or if the 'cost' was actually risk tolerance. An unpaid internship signals risk tolerance as much as wealth. Subsidizing it removes the risk, potentially admitting candidates who are skilled but risk-averse. However, risk aversion is often correlated with lack of safety nets, i.e., wealth. So subsidizing risk often just subsidizes poverty. Does paying people to signal destroy the signal? No, if the signal is the performance during the hurdle. It destroys the signal if the signal is the willingness to pay. Your colleagues assume the latter: that willingness to incur cost is the trait. You argue the trait is competence. If you pay the monetary cost, you force the candidate to pay the effort cost. This repairs the signal validity. It weakens the filter only if you intended to filter for wealth. If the hurdle is the £2,000 certificate, subsidizing it removes the barrier entirely unless the exam difficulty is the signal. If the course is easy and only the fee matters, subsidy destroys the signal. If the course is hard, subsidy preserves the ability signal while removing the wealth filter. You must distinguish between paying for access versus paying for performance. In a ranking system, uniform subsidy preserves the order if ability determines performance, but collapses it if wealth determined the previous order.

  6. **Honest equilibria that nobody wants**
  You asked about honest equilibria nobody wants. This describes a signaling arms race. If every firm demands a £2,000 certificate, the certificate loses value as a differentiator, but candidates must still buy it to get interviewed. Everyone is worse off (candidates spend money, firms spend time verifying), but no single firm can drop the requirement without appearing to lower standards. This is a Prisoner's Dilemma. The hurdle becomes pointless waste, yet stable. This gives you a powerful committee argument: you can propose dropping the costly hurdle not out of altruism, but to escape a wasteful equilibrium. If your firm switches to a supervised assessment (cost borne by firm), you might attract better candidates who were priced out elsewhere, gaining a competitive advantage in talent density. However, if the industry norm is rigid, you risk being flooded with applications. The argument is that internalizing the cost allows you to design a Trait-Conditional hurdle rather than an Endowment-Conditional one, improving hire quality. It is not just a grievance; it is an efficiency argument. You are proposing to stop burning value to prove status and start measuring value directly. You can frame this as cost-saving innovation rather than social justice.

  7. **What I should put in the paper**
  In your paper, propose a hurdle that maximizes Trait-Conditional cost and minimizes Endowment-Conditional cost. Recommend option (b) modified: a supervised, time-limited case study on-site or via proctored software. The company bears the monetary cost (venue, invigilation); the candidate bears the cognitive cost. This ensures the burden falls on those lacking the skill, not those lacking cash. Explicitly state that you are trading off the 'commitment' signal of financial sacrifice for the 'competence' signal of performance under pressure. Acknowledge you may lose candidates who are wealthy but less skilled, or gain candidates who are skilled but cash-poor. Argue that the latter is the target demographic for a state-school mentoring scheme. Do not argue for removing costs entirely; argue for shifting who bears them. The company should pay for the signal to ensure the signal measures the candidate, not their parents. Expect resistance from colleagues who conflate 'hard to get' with 'hard to do'. Your goal is to make it hard to do, not hard to afford. This approach aligns the selection process with the actual demands of the role.
