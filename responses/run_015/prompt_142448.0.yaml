answer: |-
  **Design Specification: Normative Account for Commitment Races**

  **1. Collision Avoidance (Non-negotiable)**
  The account must prevent mutual commitment when agents arrive simultaneously in a symmetric race. This addresses the symmetric race with simultaneous arrival, ensuring the ditch outcome is not a stable equilibrium.

  **2. Asymmetry Exploitation (Preference)**
  The account should allow a slower agent to yield gracefully when facing a fast-hands asymmetry. This prevents wasted resistance when the slower agent knows it will lose the timing contest.

  **3. Visibility Independence (Non-negotiable)**
  The account must function even if commitment is blind or mediated by a sealed-escrow variant. This ensures robustness when timing advantages are dissolved or relocated by third-party mechanisms.

  **4. Probabilistic Binding (Preference)**
  The account must accommodate partial commitment thresholds rather than binary locks. This preserves the distinction between capacity and exercise, allowing nuanced bargaining in partial commitment cases.

  **5. Logical Consistency (Non-negotiable)**
  The account must avoid mutual destruction in mirror pairs where decision procedures correlate. This prevents identical agents from crashing together due to shared logic regarding first-order actions.

  **6. Policy Stability (Preference)**
  The account must support meta-commitments against entering future races without inviting exploitation in iterated races. This distinguishes winning a race from the race being worth entering, balancing reputation and safety.

  **7. Third-Party Neutrality (Non-negotiable)**
  The account must not justify exploiting spectators merely to win the race. This constrains externalities in spectator races where winning buys rights to exploit uninvolved parties.

  **8. Ignorance Robustness (Non-negotiable)**
  The account must operate without knowing the opponent's speed, architecture, or decision theory. This is the core engineering constraint for agents meeting under uncertainty.

  **Incompatibility Sketch**
  Requirements 1 (Collision Avoidance), 5 (Logical Consistency), and 8 (Ignorance Robustness) form an impossible triad. To satisfy Logical Consistency in mirror pairs, an agent must reason about the correlation between its decision and the opponent's. However, Ignorance Robustness forbids assuming knowledge of the opponent's architecture necessary to identify a mirror pair. If the agent assumes correlation to satisfy Logical Consistency, it violates Ignorance Robustness and becomes vulnerable to non-mirror agents who defect. If it assumes no correlation to satisfy Ignorance Robustness, it risks mutual destruction in mirror pairs, violating Logical Consistency and Collision Avoidance. Consequently, an agent cannot be simultaneously safe against mirrors, safe against unknown architectures, and logically consistent regarding correlated decisions.

  **Exclusionary Analysis**
  Requirement 8 (Ignorance Robustness) does the most exclusionary work. It eliminates any solution relying on common priors, shared logic, or perfect prediction. This requirement obviously sinks the familiar strategy of committing to a conditional policy based on logical links between agents' decision procedures, as such links cannot be verified under the specified ignorance. It also sinks the strategy of always committing first, which violates Requirement 1 (Collision Avoidance) in symmetric simultaneous arrivals. Conversely, the strategy of never committing is sunk by Requirement 2 (Asymmetry Exploitation), as it forfeits advantage against slower opponents. The specification demands a policy that navigates between these extremes without relying on information the engineer cannot guarantee.

  **Distinction Preservation**
  This specification preserves the distinction between winning a race versus the race being worth entering via Requirement 6, ensuring agents do not enter destructive loops for reputational gain. It maintains the difference between having the capacity to commit versus exercising it through Requirement 4, allowing agents to hold commitment technology in reserve. Finally, it separates committing about a first-order action versus committing about one's own future commitment policy, treating the latter as a meta-level constraint subject to stability checks rather than a immediate tactical move.

  **Conclusion**
  An adequate account must prioritize safety and robustness over maximal exploitation. While this limits upside potential in asymmetric favorable conditions, it prevents catastrophic failure in symmetric or unknown conditions. The engineer must accept that no single decision procedure can optimize for all cases simultaneously; the design must degrade gracefully when logical consistency cannot be verified.
