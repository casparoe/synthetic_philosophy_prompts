answer: |-
  The institutional taxonomy that segregates Amartya Sen's three canonical famines—Ireland (1840s), Bengal (1943), and China (Great Leap Forward)—into distinct moral and causal categories, despite Sen's unified entitlement-collapse framework, reveals a deep tension between *structural explanation* and *legal-moral attribution*. While Sen's theory posits that all three are instances of the same phenomenon (the failure of specific groups to command food due to institutional and political failures rather than aggregate scarcity), humanitarian and historical institutions classify them as colonial crime, wartime negligence, and policy tragedy, respectively.

  This tripartite sorting presupposes specific philosophical commitments regarding causation, responsibility, and sovereignty that diverge from Sen's unified field theory of famine. Below is a reconstruction of the implicit theory underwriting this sorting, an analysis of its consistency with Sen, and the implications of adopting a strictly Senian classification system.

  ### 1. Philosophical Commitments of the Tripartite Sorting

  The institutional practice relies on three core philosophical commitments that Sen's entitlement approach explicitly seeks to dismantle.

  **A. Proximate vs. Structural Causation**
  The taxonomy privileges *proximate triggers* over *structural vulnerabilities*.
  *   **Ireland:** Categorized via the potato blight (*phytophthora infestans*) and colonial export policy. The blight is treated as a natural trigger, making the famine a "compound event."
  *   **Bengal:** Categorized via wartime inflation and rice denial policies. The war is the trigger; the famine is a "complex emergency."
  *   **China:** Categorized via the Great Leap Forward policies (backyard steel, collectivization). This is framed as "policy error" or, in older taxonomies, "natural disaster" (drought).
  *   **Commitment:** This assumes that the *source of the shock* (blight, war, policy) determines the moral category. Sen argues the source of the shock is irrelevant; the moral failure lies in the *failure to mitigate* the shock through entitlement protection. The taxonomy assumes causation is linear (Event $\rightarrow$ Starvation), whereas Sen assumes it is relational (Entitlement Mapping $\rightarrow$ Starvation).

  **B. Fiduciary vs. Sovereign Responsibility**
  The sorting distinguishes moral culpability based on the *juridical relationship* between the ruler and the ruled.
  *   **Colonial Cases (Ireland/Bengal):** The metropole is viewed as having a fiduciary duty to the colony. Failure to protect is framed as a breach of trust or a crime because the subjects had no political voice *and* were subject to external rule.
  *   **Sovereign Case (China):** The state is viewed as a sovereign entity managing its own population. Policy failures are treated as internal governance errors ("tragedies") rather than crimes against humanity, protected by the norm of non-interference.
  *   **Commitment:** Moral responsibility is attenuated by sovereignty. A government starving its own citizens through policy error is granted more moral latitude than a colonial power starving subjects. This presupposes that collective moral responsibility is diluted when the perpetrators and victims share a nominal citizenship, even if authoritarian.

  **C. The Natural/Political Dualism**
  Despite Sen's insistence that "there is no such thing as an apolitical food problem," the taxonomy retains a boundary between natural and political harm.
  *   By allowing the China famine to be historically categorized partly as a "natural disaster" (the "Three Years of Difficulty"), the taxonomy preserves the category of *misfortune*.
  *   **Commitment:** Mass death can be a "misfortune" (act of God/Nature/Bad Luck) rather than a "moral failure." Sen's theory eliminates this category: if entitlements could have been protected, the death is political. The taxonomy requires the view that some starvation is inevitable bad luck; Sen requires the view that all famine is preventable political choice.

  ### 2. Democratic Sovereignty vs. Epistemic Grounds

  Does this practice require the view that sovereignty transforms the moral status of starvation, or is it merely epistemic?

  **It is not merely epistemic.** While it is true that data opacity varies (China's data was state-secret; Bengal's was wartime-censored; Ireland's was bureaucratically recorded), the moral labeling persists even when evidence is clear. The distinction is not "we know less about China," but "we judge China differently."

  **It relies on a theory of Sovereign Immunity.** The practice presupposes that democratic accountability (or the lack thereof) changes the *type* of wrong, not just the degree.
  *   **Sen's View:** Famine does not occur in functioning democracies because feedback loops (press, elections) force entitlement protection. Therefore, famine is *proof* of a democratic deficit.
  *   **Institutional View:** Famine under colonial rule is a *crime* (external oppression). Famine under authoritarian sovereignty is a *failure* (internal mismanagement).
  *   **Implication:** The taxonomy requires the view that starvation under a sovereign government is a categorically different wrong from starvation under colonial rule. It treats the colonial subject as a *ward* deserving protection from the metropole, while treating the sovereign citizen as a *constituent* whose suffering is a matter of domestic policy. This contradicts Sen, for whom the lack of political voice is the common denominator in all three cases. The institutional sorting quietly protects the sovereign state from the "crime" label applied to the colonial empire, relying on Westphalian norms rather than human rights universalism.

  ### 3. Consistency with Sen's Implicit Theory

  The institutional practice is **inconsistent** with the theory underwriting Sen's argument.

  *   **Sen's Theory:** Famine is a failure of *entitlement mapping*. The moral failure is the *preventability* of the death. If the state (colonial or sovereign) fails to redistribute or protect purchasing power, it is a moral failure. The regime type matters only insofar as it explains *why* the failure wasn't corrected (lack of feedback).
  *   **Institutional Theory:** Famine is a moral failure only if there is *identifiable malicious intent* or *breach of external duty*.
  *   **The Divergence:** The institutional taxonomy relies on a conception of moral failure that requires a *villain* (the Colonizer, the Warmonger) rather than a *systemic omission* (the lack of entitlement protection). By classifying China as "policy error" and Ireland as "colonial failure," the taxonomy suggests that the Irish deaths were *more wrongful* than the Chinese deaths, because the former involved an external oppressor. Sen would argue both were equally wrongful because both were preventable entitlement collapses in non-democratic systems. The institutional practice thus relies on a competing conception: that mass death is a **misfortune** when caused by internal sovereign error, but a **crime** when caused by external colonial imposition.

  ### 4. Reconstructing the Implicit Theory of the Sorting

  To make sense of why institutions sort these events differently despite Sen's unity, we must reconstruct the **"Theory of Juridical Causality."**

  **Strict Requirements of this Theory:**
  1.  **Agency Attribution:** Moral categorization requires a distinct agent external to the victim group (e.g., London之于Dublin, London之于Calcutta). If the agent and victim are within the same sovereign border (Beijing之于Henan), the event shifts from "Crime" to "Tragedy."
  2.  **Intent/Negligence Threshold:** "Crime" requires evidence of active neglect or extraction (exporting food during famine). "Policy Error" allows for the presumption of benevolent intent gone wrong (GLF industrialization goals).
  3.  **Sovereign Shield:** International humanitarian taxonomy cannot classify sovereign internal policy as "genocide" or "crime against humanity" without triggering intervention norms. Therefore, the taxonomy *must* categorize sovereign famines as "complex emergencies" or "disasters" to maintain access and diplomatic neutrality.

  **What it Merely Accommodates:**
  1.  **Entitlement Data:** It can acknowledge Sen's data (food was available) without accepting his moral conclusion (it was a political crime). It accommodates the *mechanics* of entitlement collapse while rejecting the *liability*.
  2.  **Democratic Deficits:** It acknowledges that lack of press freedom contributed to the famine (epistemic ground) without classifying the lack of press freedom itself as the criminal act (moral ground).

  ### 5. Implications of a Sen-Based Classification System

  If a classification system were built strictly on Sen's unified entitlement view, it would necessitate radical changes in how famines are recorded, funded, and held to account.

  **A. Recording: The End of "Natural Disaster"**
  *   **Change:** No famine could be recorded as a "natural disaster" or "drought-induced." The metric would shift from *Food Availability Decline (FAD)* to *Entitlement Protection Failure (EPF)*.
  *   **Impact:** The China GLF famine would be reclassified from "Policy Error/Disaster" to "Political Entitlement Collapse," identical in category to Bengal. The trigger (policy vs. blight) would be metadata, not the primary classification.

  **B. Funding: From Relief to Entitlement Insurance**
  *   **Change:** Humanitarian funding is currently reactive (emergency relief after entitlement collapse). A Senian system would fund *preventive entitlement protection*.
  *   **Impact:** Aid would be conditional on "feedback loop indicators" (press freedom, opposition rights, market transparency). Funding would flow to build political resilience (voting rights, free press) rather than just food shipments. A government that restricts information flow during a crop failure would lose funding eligibility, as this restriction is the primary cause of the famine risk.

  **C. Accountability: Universal Jurisdiction for Starvation**
  *   **Change:** The distinction between Colonial Crime and Sovereign Error would dissolve.
  *   **Impact:** Mass starvation due to entitlement collapse would be treated as a *per se* human rights violation, regardless of sovereignty. The "Sovereign Shield" would be pierced. If a government (democratic or not) fails to protect entitlements during a shock, it faces the same legal scrutiny as a colonial power. This would require an international legal framework where the *outcome* (mass preventable death) establishes liability, rather than the *intent* or *jurisdictional relationship*.

  ### Conclusion

  The institutional tripartite sorting of Sen's canonical famines is not an epistemic necessity but a political compromise. It presupposes a theory of causation that privileges triggers over structures, and a theory of responsibility that privileges sovereignty over universal human rights. It requires the view that starvation is a "misfortune" when inflicted by a sovereign state upon its own, but a "crime" when inflicted by a colonizer. This is fundamentally inconsistent with Sen's argument that *all* famine is a political failure of entitlement protection. A classification system faithful to Sen would collapse these moral categories, treating all three events as identical failures of political accountability, thereby removing the sovereign immunity that currently allows authoritarian policy errors to be distinguished from colonial crimes.
