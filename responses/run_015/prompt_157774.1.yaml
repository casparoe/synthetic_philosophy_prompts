      *   **Standard Classifications:**
          *   Ireland: Colonial political failure + crop blight.
          *   Bengal: Wartime market/administrative entitlement failure.
          *   China: Development-policy error (or natural disaster in older views).
      *   **Key Questions to Address:**
          1.  What philosophical commitments (causation, collective responsibility, natural vs. political harm) does this sorting presuppose?
          2.  Does it require the view that democratic sovereignty transforms the moral status of starvation (accountability distinction), or can it be reconstructed on epistemic grounds (evidence/attribution)?
          3.  Is this practice consistent with Sen's implicit theory, or does it rely on a competing conception of moral failure vs. misfortune?
          4.  Reconstruct the implicit theory of the sorting (requirements vs. accommodations).
          5.  What would a classification system built on Sen's unified view require changing regarding recording, funding, and accountability?

  2.  **Analyze Sen's Unified Theory (Entitlement Approach):**

      *   Sen argues famine is rarely about Food Availability Decline (FAD). It's about *entitlements* (legal, economic, social means to access food).
      *   For Sen, the *mechanism* is similar across cases: specific groups lose the ability to command food, even if aggregate supply is stable.
      *   Sen's moral point: Famine is preventable. It occurs when feedback loops (political incentives, free press, democracy) fail to trigger response. "No famine has ever taken place in the history of the world in a functioning democracy."
      *   Therefore, for Sen, the *cause* is ultimately political/institutional failure to protect entitlements, regardless of the specific trigger (war, policy, blight).

  3.  **Analyze the Institutional/Taxonomic Practice:**

      *   Why do institutions (UN, NGOs, historians, legal bodies) treat them differently?
      *   *Ireland:* Often framed through post-colonial lens. Moral culpability lies with the metropole (UK). Legal accountability is historical/retrospective.
      *   *Bengal:* Framed as wartime exigency + colonial negligence. Churchill's role is highlighted. It's a "complex emergency" (war + market failure).
      *   *China:* Often framed as "policy error" (Great Leap Forward) or "natural disaster" (Three Years of Difficulty). Modern taxonomy often hesitates to label it "genocide" or "crime against humanity" in the same way as colonial famines, partly due to sovereignty norms and data opacity.
      *   *The Discrepancy:* Sen says "Entitlement Failure" for all. Institutions say "Colonial Crime" (Ireland), "Wartime Negligence" (Bengal), "Policy Tragedy" (China).

  4.  **Address Question 1: Philosophical Commitments:**

      *   *Causation:* The taxonomy assumes *proximate* causes (blight, war, policy) matter more than *structural* causes (entitlement mapping). It privileges *trigger* over *vulnerability*.
      *   *Responsibility:* It assumes responsibility is tied to *intent* or *specific jurisdiction*. Colonial rule creates a fiduciary duty (Ireland/Bengal) that sovereign self-rule (China) obscures.
      *   *Natural vs. Political:* It maintains a dualism that Sen rejects. It treats "blight" or "policy error" as distinct from "political choice," whereas Sen sees the failure to mitigate blight/policy as the political choice.

  5.  **Address Question 2: Democratic Sovereignty vs. Epistemic Grounds:**

      *   *Democratic Sovereignty:* Sen explicitly links democracy to famine prevention. The taxonomy seems to invert this or complicate it. Ireland (Colonial) = Crime. Bengal (Colonial) = Negligence. China (Authoritarian) = Tragedy/Error.
      *   *The Twist:* The taxonomy *does* seem to rely on the regime type. Colonial subjects are "wards" (higher duty of care owed by colonizer). Sovereign citizens are responsible for their own government's errors (lower external duty of care).
      *   *Epistemic Grounds:* Can it be just about evidence? China's data was hidden longer. Bengal's was wartime censored. Ireland's was bureaucratic. But the *moral labeling* differs beyond just evidentiary uncertainty. It's not just "we don't know," it's "this counts as X, that counts as Y."
      *   *Conclusion:* It requires more than epistemic caution; it relies on a political theory of sovereignty where external accountability applies differently to colonies vs. sovereign states.

  6.  **Address Question 3: Consistency with Sen:**

      *   *Sen's View:* All are preventable political failures. The distinction is morally irrelevant if the outcome is mass starvation due to entitlement collapse.
      *   *Institutional View:* Distinguishes based on *agency* and *intent*.
      *   *Conflict:* The institutional practice relies on a competing conception: "Moral Failure" requires specific identifiable villains (colonizers, warmongers), whereas "Misfortune" covers systemic policy errors in sovereign states. Sen argues *all* are moral failures because all are preventable via democratic feedback.
      *   *Verdict:* Inconsistent. The taxonomy protects sovereign authoritarianism from the "crime" label that is applied to colonialism.

  7.  **Address Question 4: Reconstructing the Implicit Theory:**

      *   *Theory:* "Sovereign Immunity in Moral Taxonomy."
      *   *Requirement:* Must distinguish between *external* imposition of harm (Colonial/War) and *internal* mismanagement (Policy).
      *   *Accommodation:* Can acknowledge entitlement failure technically, but morally categorize based on the *source* of the entitlement shock.
      *   *Key Distinction:* Fiduciary responsibility (Colonizer to Colonized) vs. Representative responsibility (Government to Citizens). The former allows external judgment; the latter is shielded by sovereignty.

  8.  **Address Question 5: Implications of a Sen-Based System:**

