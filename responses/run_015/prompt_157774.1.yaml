          6.  Sen-Based Reform: Recording, Funding, Accountability changes.
      *   *Refinement on China:* Be careful with the China classification. It's often "policy error" but increasingly recognized as political. The prompt notes the "older taxonomies" treat it as natural disaster. I need to address why the *institutional habit* persists even if scholarship changes.
      *   *Refinement on Sen:* Sen's "Democracy" thesis is crucial. The institutional sorting often treats colonial famine as *more* culpable than authoritarian famine, which contradicts Sen's idea that *any* non-democratic lack of feedback is the root cause. Wait, actually, Sen says colonies *are* non-democratic. So Colonial = Non-democratic = Famine. China = Non-democratic = Famine. Why the distinction? Because Colonialism is *externally* imposed non-democracy, whereas GLF China is *internally* generated. The taxonomy privileges external judgment over internal critique.

  10. **Final Polish:** Ensure all parts of the prompt are answered explicitly. Check for clarity on "requirements vs. accommodations." Ensure the distinction between "moral failure" and "misfortune" is sharp.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Sen is right, institutions are wrong." I need to analyze *why* the institutions do this. It's about legal liability and humanitarian access. Labeling China a "crime" blocks aid/access. Labeling Ireland a "crime" is historically safe. The taxonomy is pragmatic/political, not just philosophical. I should weave this into the "Implicit Theory."

      *(Refining the "Democratic Sovereignty" point)*: The prompt asks if the practice requires the view that democratic sovereignty transforms moral status. Actually, none of these three were democracies. Ireland (Colonial), Bengal (Colonial), China (Authoritarian). The distinction is Colonial vs. Sovereign Authoritarian. So the question is about *Sovereignty* itself, not necessarily *Democratic* Sovereignty, though Sen links the two. I need to clarify that the taxonomy treats *Sovereign* failure differently from *Colonial* failure.

