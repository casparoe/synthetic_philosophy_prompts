answer: |-
  **Project Title:** The Collapse Argument: Finitude, Exhaustion, and Rule-Following Skepticism

  **Statement of the Question**
  The standard skeptical argument regarding rule-following relies on the finitude of past usage: because a speaker's history is finite, multiple incompatible functions (e.g., plus and quus) fit all past data, leaving nothing to fix which rule was meant. Call this the *underdetermination argument*. This project investigates a structurally distinct route to the same conclusion: the *collapse argument*. Here, a rule operates within a bounded domain (e.g., pricing orders of 1–99 units) that the speaker has exhausted. Two rules agree on every case in the domain but differ in their counterfactual generalizations or internal structure. Since the domain is used up, no further application can settle which rule was followed. The central question is whether the collapse argument is genuinely independent of the underdetermination argument. If it is, do the standard taxonomies of response—those seeking meaning-constituting facts versus those reinterpretating meaning in terms of assertibility conditions—divide differently across these two arguments than the literature suggests?

  **Hypothesis and Contribution**
  This project defends the hypothesis that the collapse argument is independent of the underdetermination argument and that it defeats a specific class of responses that survive the standard argument. The underdetermination argument exploits the gap between a finite past and an open future. Standard responses often bridge this gap by appealing to dispositions, community consensus, or idealized conditions of judgment—all of which rely on the possibility of *continuation*. The collapse argument removes the possibility of continuation within the rule's domain. Consequently, responses that ground meaning in what a speaker *would* do, or what a community *would* say, lose their traction because the relevant counterfactuals cannot be anchored in practice even in principle.

  I argue that while fact-based accounts fail both arguments, certain assertibility-based accounts may survive underdetermination by shifting the focus to future utility. However, these same accounts fail against collapse because there is no future utility to be had within the exhausted domain. The project will demonstrate that the collapse argument forces a dilemma: either meaning is absent in bounded, exhausted practices (a counterintuitive result), or meaning must be constituted by something other than use-conditions (a return to realism). This shifts the burden of proof back onto the skeptic's opponents in a way the standard argument does not.

  **Addressing the Primary Objection**
  The most serious objection to this project is that the collapse argument is the underdetermination argument in disguise. To specify the bounded domain (e.g., "1 to 99"), one must follow a rule setting the boundary. That boundary-setting rule is itself subject to the standard skeptical challenge (what fixes "99" as the limit rather than "99-quus"?). If the boundary is unstable, the exhaustion is illusory, and the problem reduces to standard finitude.

  This proposal contends that this objection is not fatal. Even if the boundary itself is rule-governed, the *material exhaustion* of the domain creates a structural difference. In the standard case, the uncertainty lies in predicting future performance. In the collapse case, the uncertainty lies in describing past performance where no further tests are possible. The objection assumes that skepticism must always arise from the openness of the future. This project argues that skepticism can arise from the closure of the past. Even if the boundary '99' is skeptical, the fact that the shop *never* sells more than 99 units is a material constraint. The skeptic can grant the material constraint while maintaining that the rule governing the prices within that constraint is unsettleable. This isolates the normative gap from the inductive gap. The project will defend this distinction by showing that responses relying on "going on" literally have nowhere to go in the collapse scenario, whereas they retain logical space in the underdetermination scenario.

  **Methodology**
  The method is conceptual analysis focused on failure conditions rather than solution-building. I will not produce a new solution to skepticism nor a comprehensive survey of existing literature. Instead, I will construct a formal taxonomy of responses to rule-following skepticism based on their structural commitments (e.g., reliance on counterfactuals, reliance on community extension, reliance on internal states). I will then test each category against the collapse argument to map exactly where the inference breaks.

  The work will proceed in three phases. First, I will rigorously formalize the collapse argument to ensure it does not secretly presuppose the underdetermination argument. Second, I will select the three most prominent types of response in the current landscape (dispositional, communitarian, and deflationary) and reconstruct them to be maximally charitable. Third, I will apply the collapse scenario to these reconstructed responses to demonstrate specific failure points. This diagnostic approach is chosen over a critical survey because the literature treats skepticism as a monolith; treating the arguments separately reveals fractures in the responses that a general survey would obscure.

  **Deliverable**
  The deliverable for the fellowship year is a complete manuscript draft of approximately 40,000 words, comprising the core analytical chapters of a dissertation. This will include the formalization of the collapse argument, the taxonomy of responses, and the diagnostic testing of those responses. This is preferred over a series of papers because the argument requires a cumulative buildup; the independence claim must be secured before the diagnostic work can proceed.

  **Scope and Feasibility**
  An honest assessment suggests this is a three-year project compressed into one. Fully exhausting the taxonomy of responses and defending the independence claim against all comers requires more time than a single fellowship allows. However, the fellowship year will be dedicated specifically to securing the independence claim and demonstrating the failure of dispositional accounts. I will limit the scope of the diagnostic phase to these two targets. If the independence claim holds, it justifies the broader work; if it fails, the project pivots to analyzing why the reduction to underdetermination succeeds. This contingency is built into the methodology. The risk is that the objection regarding boundary rules proves more resilient than anticipated. If so, the deliverable will shift from proving independence to analyzing why the reduction succeeds and what that implies for the nature of domain restrictions. Either outcome yields a viable dissertation chapter, but the primary commitment remains the defense of the collapse argument as a distinct philosophical tool.
