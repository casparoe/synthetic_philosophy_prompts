answer: |-
  Dear friend, it is fascinating that you have landed on this specific tension in Schrödinger's thought because it strikes at the very heart of why his philosophical writings remain so provocative despite being often sidelined by physicists. You are right to sense that the biological reality of separate brains reporting separate experiences seems to clash with his Vedantic insistence that consciousness is numerically one, but Schrödinger would argue that this clash is only apparent because he treats biological individuation as a functional plurality within an ontological unity. For Schrödinger, the separate bodies and brains produced by evolution are like different lenses focusing the same light, meaning the plurality exists in the object of experience but not in the subject experiencing it. When you push this into the realm of quantum mechanics and ask whether there is only one observer ever, you are touching on a profound implication that Schrödinger himself grappled with, though he was careful to distinguish his metaphysical monism from the epistemological role of the observer in the Copenhagen interpretation.

  If consciousness is indeed numerically identical across all apparent individuals, then in a strict metaphysical sense there is only one observer, but Schrödinger did not believe this single observer collapses the wave function through a subjective act of will or attention. His rejection of the Copenhagen interpretation was driven largely by his desire for physical realism, meaning he wanted the wave function to describe an objective reality independent of whether anyone was looking at it, rather than a tool for predicting observations. Therefore, his anti-Copenhagen stance does not deepen the solipsistic conclusion but rather attempts to bypass it entirely by removing the privileged status of the individual observer from the physics itself. He was worried that the Copenhagen view made reality dependent on the knowledge of specific, separate observers, which contradicted his Vedantic view that the separation of observers is an illusion. By arguing for a realist wave ontology, he could maintain that the physical world unfolds according to deterministic laws within the one consciousness, avoiding the idea that individual minds create reality through measurement.

  This is where your intuition about tying his anti-Copenhagen stance to the unity idea is partially correct but requires nuance, because his primary motivation was often stated as a desire for determinism and realism rather than explicitly solving the solipsism problem. However, the two are deeply linked because if there is only one mind, then the idea that different physicists in a lab create different collapses becomes nonsensical, reinforcing his view that the collapse itself is a problematic concept. Regarding Schopenhauer, his references to the Will do not muddy the waters but rather reinforce the metaphysical framework, as Schopenhauer's Will is also a singular, underlying reality behind the plurality of representations, which aligns perfectly with the Vedantic Brahman. Schrödinger uses Schopenhauer to explain the driving force behind evolution and life, suggesting that the biological plurality you mentioned is the manifestation of this blind Will, while the consciousness witnessing it remains one.

  I am highly confident in this characterization of how Schrödinger's metaphysical monism interacts with his critique of Copenhagen, particularly regarding his desire to decouple physical reality from individual subjective knowledge. However, the point I am least sure about is whether the Vedantic unity thesis strictly forces the solipsistic reading of quantum observation that you are worried about, because Schrödinger sometimes oscillates between treating the one mind as a passive witness to a real external world and treating the world as a construct of that mind. It remains ambiguous whether his unity thesis implies that the one observer constitutes the physical world through observation, which would be solipsistic, or merely experiences a pre-existing real world, which would be realist, and this ambiguity makes it difficult to say definitively if his philosophy resolves the measurement problem or simply relocates it into the metaphysics of the one self.
