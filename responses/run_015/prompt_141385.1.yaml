  1. "Vocabulary without the philosophy"

  In engineering terms, a **Crane** is a component whose capability is fully explained by the mechanisms below it. If you ask "how does this work?", the answer points to validated sub-components, architecture, or data. Example: A syntax checker prevents invalid code because it runs a parser. In ML, a crane is a reward model trained on human preferences with a documented dataset. A **Skyhook** is a claim of capability that hangs from the desired outcome rather than a mechanism. It answers "how?" with "because it needs to." Example: "The agent won't delete production because it understands importance." This is magic, not engineering. In autonomous agents with write access, skyhooks are single points of failure disguised as features.

  **Greedy Reductionism** is the opposite error: dismissing a real, higher-level pattern because the lower-level substrate is simple. It says, "This is just matrix multiplication, so it can't actually plan." This ignores emergent behavior that is functionally real even if mechanistically statistical. If you ignore goal-directed behavior because "it's just next-token prediction," you fail to supervise risks that exist at the goal level. For example, denying an agent has "objectives" because it lacks a biological drive ignores that it optimizes a loss function which acts as an objective.

  In traditional software, "solid ground" is logical specification: the code *must* do X. In ML systems, ground is **empirical characterization**: the model does X with probability Y on distribution Z. Your support chain bottoms out not in logic, but in benchmark results and validation scopes. A crane is valid only if its base is a measured bound, not a hope. The analogy breaks because ML ground is probabilistic, not absolute. A crane here lifts with a known safety factor, not infinite strength. You cannot prove correctness; you bound failure rates. A support chain is valid only if every link is a crane resting on empirical ground, not a skyhook dangling from a requirement. Reviewers must treat probabilistic bounds as the only solid floor available.

  2. "The procedure"

  This procedure is designed for a 20-minute pre-read. It prioritizes catching structural errors over optimizing performance. If a doc fails Step 1, do not proceed to Step 5. The Safety Reviewer retains veto power at any stage if they identify a hazard this checklist misses.

  **Step 1: The Support Chain Audit (Cranes vs. Skyhooks)**
  *Question 1:* For every component claiming to achieve a safety or optimization goal, what mechanism implements it?
  *Sufficient Answer:* References a specific architecture, loss function, filtering rule, or training datum. Example: "The verifier blocks outputs with score < 0.5 using Model V1."
  *Failure Mode:* Skyhook. The explanation relies on the outcome itself. Example: "The model knows not to break things."
  *Verdict:* **Reject** immediately if any critical safety link is a skyhook. No amount of testing validates a mechanism that isn't described.
  *Question 2:* Does the mechanism rely on a capability that is not yet built?
  *Sufficient Answer:* Explicitly states dependency on future work. "Component X is manual until Q3."
  *Failure Mode:* Promise Crane. Relying on a crane that doesn't exist yet to support current weight.
  *Verdict:* **Restructure** to remove dependency or **Escalate** if this is a strategic roadmap bet requiring leadership risk acceptance. When auditing the chain, trace the dependency upwards. If Component A relies on Component B, Component B must be a crane. If B is a skyhook, A collapses.

  **Step 2: Grounding Check (Empirical Base)**
  *Question 3:* Where does the chain bottom out?
  *Sufficient Answer:* Cites specific benchmarks, datasets, or empirical bounds. "Benchmarks A, B on distribution D with confidence interval C."
  *Failure Mode:* Infinite regress or logical assertion. "It's aligned by design" without data.
  *Verdict:* **Reject** if no empirical ground is cited. ML chains must end in measurements, not hopes.
  *Question 4:* Is the ground scope sufficient for the claim?
  *Sufficient Answer:* Evidence matches deployment context. "Benchmark covers production-like repos."
  *Failure Mode:* Distribution shift. Testing on Hello World, deploying on Monorepo.
  *Verdict:* **Restructure** to expand eval scope or narrow the claim to the tested distribution.

  **Step 3: Claim Type Consistency**
  *Question 5:* Are Guarantee Claims supported by Mechanism Claims?
  *Sufficient Answer:* Hard constraints back absolute statements. "We guarantee no PII leak because Regex Filter Y runs on all output."
  *Failure Mode:* Guarantee without mechanism. "We guarantee safety via RLHF." RLHF is probabilistic, not a guarantee.
  *Verdict:* **Reject** guarantees without hard mechanisms. Probabilistic systems cannot make absolute guarantees.
  *Question 6:* Are Evaluation Claims treated as bounds, not proofs?
  *Sufficient Answer:* "Metric M improves on Dist D, risk remains E."
  *Failure Mode:* Overconfidence. "Metric improved, so system is safe." This ignores out-of-distribution failure.
  *Verdict:* **Restructure** to acknowledge residual risk. Evaluation proves performance, not safety. Distinguish clearly: Mechanism claims describe *how*. Guarantee claims describe *bounds*. Evaluation claims describe *performance*. Confusing these is the primary source of design debt.

  **Step 4: Reductionism Check**
  *Question 7:* Does the doc dismiss emergent risks because the substrate is statistical?
  *Sufficient Answer:* "We acknowledge goal-directed behavior emerges despite stochastic weights."
  *Failure Mode:* Greedy Reductionism. "It's just logits, no need to monitor goals." This blinds you to functional risks.
  *Verdict:* **Reject** if emergent risks are ignored. Functional properties are real even if substrate is simple.

  **Step 5: Value and Risk Handoff**
  *Question 8:* Have all factual uncertainties been isolated?
  *Sufficient Answer:* "Risk X remains with probability Y."
  *Failure Mode:* Hiding values in facts. "This is safe" (when it means "acceptable risk").
  *Verdict:* **Restructure** until facts are separated from values.
  *Question 9:* Is the residual risk acceptable?
  *Sufficient Answer:* Leadership sign-off.
  *Failure Mode:* Engineer making value judgment.
  *Verdict:* **Escalate** to leadership for risk appetite decision. **Accept** only after leadership confirms risk appetite. Escalation is not a failure; it is the correct handling of value judgments. Engineers define the risk; leadership accepts it.

  3. "Worked reviews"

