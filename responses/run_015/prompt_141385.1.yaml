      In engineering terms, a **Crane** is a component whose capability is fully explained by the mechanisms below it. If you ask "how does this work?", the answer points to validated sub-components, architecture, or data. Example: A syntax checker prevents invalid code because it runs a parser. A **Skyhook** is a claim of capability that hangs from the desired outcome rather than a mechanism. It answers "how?" with "because it needs to." Example: "The agent won't delete production because it understands importance." This is magic, not engineering.

      **Greedy Reductionism** is the opposite error: dismissing a real, higher-level pattern because the lower-level substrate is simple. It says, "This is just matrix multiplication, so it can't actually plan." This ignores emergent behavior that is functionally real even if mechanistically statistical.

      In traditional software, "solid ground" is logical specification: the code *must* do X. In ML systems, ground is **empirical characterization**: the model does X with probability Y on distribution Z. Your support chain bottoms out not in logic, but in benchmark results and validation scopes. A crane is valid only if its base is a measured bound, not a hope. The analogy breaks because ML ground is probabilistic, not absolute. A crane here lifts with a known safety factor, not infinite strength.

