  4. "Where it misfires"

  **False Positives:** Novel architectures that work as black boxes. If a component works empirically but lacks a mechanistic explanation (common in deep learning), this procedure flags it as a Skyhook. You may stall innovation that relies on emergent properties not yet understood. Sometimes the "mechanism" is just "it works in evals," which this procedure treats as insufficient for safety claims.
  **False Negatives:** Jargon-heavy docs. An author can learn to write "mechanism-sounding" text that is still empty. "We utilize latent space alignment" sounds like a crane but may be a skyhook if "alignment" isn't defined. Sophisticated authors can game the Support Chain section by adding plausible-sounding links that don't actually hold weight.
  **Degradation:** Goodhart's Law. Authors will write to satisfy the checklist, not to build safe systems. They will add empirical bounds that are technically correct but practically useless (e.g., testing on trivial tasks). Over time, the review becomes a paperwork exercise unless the chair actively challenges the substance behind the words.
  **Cannot Do:** This procedure cannot guarantee safety. It only ensures the *argument* for safety is structurally sound. It cannot detect a mechanism that is correctly described but fundamentally flawed. It cannot solve the alignment problem. It separates fact from value, but cannot choose the value. It is a tool for clarity, not a substitute for judgment. It will not stop a determined team from building something dangerous if the risks are explicitly accepted by leadership.

