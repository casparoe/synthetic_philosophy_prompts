answer: |-
  Here is a complete design for a 75-minute seminar game. It is built to be run by a peer (you) without needing complex tech, but it requires strict timekeeping.

  # Game Title: The Novaria Protocol

  **Core Concept:** Students forecast the lifespan of a fictional political entity. Round 1 relies on case details (Inside View). Round 2 requires purchasing a historical dataset (Reference Class) before seeing the statistics, then forecasting again.
  **Group Size:** 18 students.
  **Format:** 6 teams of 3 students. (Teams reduce individual noise and force them to vocalize their reasoning, which helps the debrief).
  **Time:** 75 Minutes.

  ---

  ## 1. Materials & Setup

  **You need:**
  1.  **Handout A (Round 1):** The "Novaria Case File" (see below).
  2.  **Handout B (Round 2):** The "Historical Archives Menu" (see below).
  3.  **Whiteboard:** To track scores.
  4.  **Calculator/Excel:** Pre-loaded with the scoring formula so you can calculate results live in 5 minutes.
  5.  **Currency:** Print 6 sheets of "Research Budget" (100 points each).

  **The Truth (For Your Eyes Only):**
  *   **Actual Lifespan of Novaria:** 44 Years.
  *   **Data Status:** All historical stats below are *invented* for this exercise. Tell them this explicitly.

  ---

  ## 2. The Run of Show

  ### Phase 1: The Inside View (20 Minutes)
  1.  **Intro (5 mins):** Tell them they are intelligence analysts. Their job is to forecast the stability of the "United Provinces of Novaria."
  2.  **Handout A (10 mins):** Distribute the Case File.
      *   *Content:* A rich, causal story. "Novaria has a charismatic founder, a resource boom in the north, but ethnic tensions in the south. Similar to Country X and Y..."
      *   *Task:* "Estimate the number of years from founding (1950) until regime collapse. Write down one number."
      *   *Rule:* "Do not use outside knowledge. Use only the text provided."
  3.  **Collection (5 mins):** Collect the forecasts. Do not reveal the actual number yet.

  ### Phase 2: The Reference Class Market (25 Minutes)
  1.  **The Pitch (5 mins):** Tell them they have a chance to revise their forecast. But to get historical data, they must buy a "Research Package" from their budget (Start with 100 points).
  2.  **Handout B (5 mins):** Distribute the Archives Menu.
      *   **Package Alpha (Broad):** "All Sovereign States since 1700." **Cost: 0 points.**
      *   **Package Beta (Medium):** "Post-Colonial Resource States." **Cost: 15 points.**
      *   **Package Gamma (Narrow):** "Multi-Ethnic Parliamentary Unions with Resource Booms." **Cost: 40 points.**
      *   *Constraint:* They must choose **one** package *before* seeing the statistics inside it.
  3.  **The Purchase (5 mins):** Teams debate and commit. They hand you their budget sheet with the cost deducted.
  4.  **The Reveal (5 mins):** You announce the statistics for the package they bought.
      *   *Alpha Stats:* Mean = 45 years, Standard Deviation = 25 years.
      *   *Beta Stats:* Mean = 38 years, Standard Deviation = 15 years.
      *   *Gamma Stats:* Mean = 52 years, Standard Deviation = 10 years.
      *   *(Note: Gamma is the most 'relevant' sounding but has a mean furthest from the truth of 44).*
  5.  **Final Forecast (5 mins):** Teams submit a final number based on their purchased data.

  ### Phase 3: Scoring & Calculation (10 Minutes)
  1.  **Reveal Truth:** "Novaria lasted 44 years."
  2.  **Scoring Rule:** Write this on the board:
      $$ \text{Final Score} = (100 - \text{Package Cost}) - \frac{(\text{Forecast} - \text{Actual})^2}{20} $$
      *   *Explanation:* You start with 100. You pay for your package. You lose points for error, squared (big errors hurt much more).
  3.  **Calculate:** Plug their numbers into your spreadsheet. Rank the teams.

  ### Phase 4: The Debrief (20 Minutes)
  *This is where the learning happens. Do not lecture until now.*

  **1. The Inside View Trap (5 mins)**
  *   **Ask:** "Look at Round 1 forecasts. Why was the variance so high?"
  *   **Point:** They focused on the *story* (charismatic leader, resources). Some weighed resources heavily (high forecast), some weighed tensions heavily (low forecast).
  *   **Lesson:** The Inside View focuses on *causes* specific to the case. It feels deeper but produces high noise.

  **2. The Cost of Specificity (10 mins)**
  *   **Ask:** "Who bought Package Gamma (the narrow one)? Did it help you?"
  *   **Likely Outcome:** Gamma buyers paid 40 points. Their mean (52) was further from truth (44) than Alpha (45). They likely lost.
  *   **Point:** "You paid a premium to feel like you understood the case better. But choosing Gamma required you to argue *why* Novaria fit that narrow description. That argument was just the Inside View in disguise."
  *   **Lesson:** Selecting a reference class is not a mechanical task. It is a judgement call. If you pick a class because it 'fits the story,' you have contaminated the Outside View with Inside View bias.

  **3. The Power of Averaging (5 mins)**
  *   **Ask:** "Who bought Package Alpha (free)? How did you do?"
  *   **Likely Outcome:** Alpha buyers kept their 100 points. Their mean (45) was almost exactly the truth (44).
  *   **Lesson:** The Outside View wins not because it knows the *truth*, but because it ignores the *noise*. Alpha ignores the 'resource boom' detail that made Gamma look attractive but misleading.

  ---

  ## 3. Handout Content (Copy/Paste Ready)

  **Handout A: The Novaria Case File**
  > **Subject:** United Provinces of Novaria
  > **Founded:** 1950
  > **Context:** Novaria formed after a peaceful decolonization. It has a parliamentary system but strong regional governors.
  > **Economy:** Massive lithium deposits discovered in 1955. GDP growth averaged 6% for the first decade.
  > **Social:** Three major ethnic groups. The largest group holds 55% of seats. Tensions rose in 1958 over revenue sharing.
  > **Leadership:** Founder 'General V' is popular but aging. No clear successor.
  > **Task:** Forecast the year of regime collapse (or end of stability). Convert to "Years of Stability."

  **Handout B: Historical Archives Menu**
  > *Select ONE package. Costs are deducted from your team's 100-point budget.*
  >
  > **1. The Broad Archive (Cost: 0 pts)**
  > *   **Definition:** All sovereign states established between 1700–1950.
  > *   **Sample Size:** 4,000+ cases.
  >
  > **2. The Regional Archive (Cost: 15 pts)**
  > *   **Definition:** Post-colonial states with significant mineral exports.
  > *   **Sample Size:** 140 cases.
  >
  > **3. The Specific Archive (Cost: 40 pts)**
  > *   **Definition:** Multi-ethnic parliamentary unions with early-stage resource booms.
  > *   **Sample Size:** 12 cases.

  ---

  ## 4. Predictable Failures (And how to handle them)

  **1. The "Gamma Gambit"**
  *   **What happens:** The smartest teams will buy Package Gamma. They will argue it's "due diligence" to get the most specific data.
  *   **The Risk:** If Gamma's mean (52) happens to be closer to the truth (44) by luck, they win, and the lesson fails.
  *   **The Fix:** I have rigged the numbers above (Mean 52 vs Truth 44) so Gamma is *plausible* but *wrong*. If a team gets lucky and forecasts 44 despite the Gamma mean, acknowledge the luck. "You overcame the biased dataset. Most won't."

  **2. Ignoring the Cost**
  *   **What happens:** Teams treat the points as fake and buy Gamma anyway.
  *   **The Fix:** Make the scoring harsh. If Gamma costs 40 points, they start at 60. They need to be significantly more accurate to beat the Alpha team. Emphasize: "Your budget is your grade."

  **3. Collusion**
  *   **What happens:** Teams share data in Round 2.
  *   **The Fix:** Collect Round 1 forecasts immediately. In Round 2, tell them: "If I hear you talking to another team about which package you bought, your budget is halved."

  ---

  ## 5. What This Game Cannot Teach (The "Straight Talk")

  You asked me to be straight about the limitations. You cannot game-ify these; you must state them in the final 5 minutes.

  **1. The "Single Number" Fallacy**
  *   **The Game:** Implies the Outside View is the *Mean* of the reference class.
  *   **The Reality:** The Outside View is the *distribution*. Knowing the mean is 45 and SD is 25 is more important than just guessing 45. The game simplifies this to a point forecast for scoring ease.
  *   **Say this:** "In the game, you used the mean as a target. In reality, the Outside View tells you the *range* of possibilities. It tells you how uncertain you should be, not just what to expect."

  **2. The Reference Class Problem**
  *   **The Game:** Offers 3 clean classes.
  *   **The Reality:** In the wild, there are no labels. Is Novaria a 'Resource State' or a 'Parliamentary Union'? There is no menu. You have to construct the class yourself.
  *   **Say this:** "I gave you the classes. In your jobs, you won't have a menu. You have to build the class. That is where the real cognitive work happens."

  **3. Structural Breaks**
  *   **The Game:** Assumes history repeats (stationarity).
  *   **The Reality:** Sometimes the world changes (nuclear weapons, internet, climate change) and past base rates are obsolete.
  *   **Say this:** "The Outside View assumes the future is like the past. Sometimes it isn't. The Inside View is necessary to spot *structural breaks*, even if it's bad at calibration."

  ## 6. Instructor Cheat Sheet (Quadratic Scoring)

  To make the math easy on the board, use this simplified lookup for the Error Penalty:

  | Error (Years) | Penalty Points |
  | :--- | :--- |
  | 0 - 5 | 1 |
  | 6 - 10 | 3 |
  | 11 - 15 | 6 |
  | 16 - 20 | 10 |
  | 21 - 25 | 15 |
  | 26 - 30 | 22 |
  | 31 - 40 | 40 |
  | 41+ | 60+ |

  *Formula used for table:* $\text{Round}(\frac{\text{Error}^2}{20})$

  **Winning Condition:**
  Highest score wins.
  *   **Team Alpha (Broad):** Start 100. Error 3 (Forecast 47). Penalty 1. **Final: 99.**
  *   **Team Gamma (Narrow):** Start 60. Error 8 (Forecast 52, influenced by mean). Penalty 3. **Final: 57.**

  *This stark difference drives the point home immediately.*
