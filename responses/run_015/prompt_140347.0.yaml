prompt: |-
  hey — I'm a third-year and I've been asked to run one 75-minute seminar slot for about 18 second-years on my forecasting and judgement module, and I want them to actually feel why the outside view is meant to beat the inside view instead of me just saying it at them.

  So: design me a game. Round one they forecast how long or how big a handful of things will get from inside-view descriptions only (a platform, a firm, a party, a student society — whatever works), with an as-of rule so they can't sneak in information from after the cut-off date. Round two they have to commit to one reference class out of several I hand them, drawn from historical states and empires, before they get to see the base rates for any of them — and I want the narrow, more 'relevant' class to cost them something, points or score or whatever, so choosing a class is itself a real decision and not a free move. Then score it with a quadratic rule I can define on the board, no money involved. The numbers can be invented but clearly labelled as made-up, I don't need real data, the point is the structure.

  What I want them to run into: that the outside view isn't a single number you read off, that picking the class is doing the inside-view work again under another name, and that some of the outside view's edge is just that it averages out个案 noise rather than that it sees into the case. They shouldn't hear the words base rate or outside view until afterwards.

  Give me the rules, materials, payoffs, a debrief mapping moments onto those points, what'll predictably go wrong the first time I run it, and be straight with me about the bit the game can't produce and I'll have to just tell them.
