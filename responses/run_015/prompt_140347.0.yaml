  1.  **Analyze the Request:**
      *   **User:** Third-year student running a 75-minute seminar for 18 second-years.
      *   **Module:** Forecasting and Judgement.
      *   **Goal:** Demonstrate *why* the Outside View beats the Inside View experientially, not just lecturally.
