answer: |-
  ### PhD Comprehensive Examination: Political Philosophy
  **Time Allowed:** 90 Minutes
  **Topic:** The Problem of Dirty Hands

  **Question:**

  Consider the following distinction regarding political wrongdoing undertaken for purported public goods. **Executive stain** occurs when a leader personally orders or performs the wrongful act (e.g., pulling the trigger, signing the specific torture warrant). **Delegated stain** occurs when a leader authorizes a wrongful act through institutional layers so that she does not personally execute it, yet knows and approves of the necessary means.

  Write an essay addressing whether this proximity-based distinction resolves, complicates, or collapses the classic dirty-hands problem. In your analysis, you must determine whether moral responsibility tracks authorization regardless of institutional distance. Furthermore, evaluate whether democratic citizens inherit the stain through representative consent when the stain is delegated rather than executive. Your argument should rely on conceptual reasoning regarding agency, responsibility, and complicity rather than exegesis of specific texts.

  ***

  ### Model Answer

  The distinction between delegated and executive stain offers a tempting procedural solution to the dirty-hands problem: it suggests that moral contamination might be mitigated by institutional distance. However, upon rigorous conceptual scrutiny, this distinction ultimately collapses regarding culpability while complicating our understanding of democratic complicity. The proximity of the hand to the act does not cleanse the will that authorized it.

  First, we must interrogate the moral relevance of physical proximity. If the dirty-hands problem arises from the necessity of violating moral norms for political ends, the locus of the violation is the decision itself, not the mechanical execution. In cases of delegated stain, the leader provides the sufficient condition for the wrongdoing. To argue that delegation reduces stain is to confuse moral agency with physical causation. A leader who constructs a system designed to produce wrongful outcomes retains full authorship of those outcomes. Therefore, regarding the leader's responsibility, the distinction collapses; authorization is morally equivalent to execution because both share the same intent and causal efficacy.

  However, the distinction does not dissolve entirely; it shifts from the ontological to the psychological. Delegated stain functions as a mechanism of self-deception. By inserting institutional layers, the leader creates a phenomenological buffer, allowing them to maintain a self-conception of cleanliness despite authorizing filth. This complicates the dirty-hands problem because it introduces a second-order wrong: the evasion of responsibility. The executive stain forces an acknowledgment of guilt; the delegated stain permits moral schizophrenia. Thus, the distinction does not resolve the problem but rather obscures it, making the moral cost harder to reckon because the agent denies the stain exists.

  This obfuscation extends to the citizenry. In a representative democracy, citizens authorize leaders to act on their behalf. If the leader incurs executive stain, the citizen's complicity is often viewed as indirect. But if the stain is delegated, the institutional buffer protects the citizen as well. Yet, if moral responsibility tracks authorization regardless of distance, citizens inherit the stain through representative consent. By voting for a regime known to utilize coercive means—even if those means are bureaucratically concealed—citizens become co-authors of the delegation. To deny this is to treat representation as a moral washboard rather than a chain of agency.

  Consequently, the delegated/executive distinction fails to resolve the dirty-hands problem because it mistakes procedural distance for moral insulation. It collapses when assessing culpability: the author of the order is as stained as the wielder of the instrument. Yet, it complicates the problem politically by enabling structural denial. The stain is not lessened by delegation; it is merely distributed more widely across the institution and the electorate. Ultimately, the dirty-hands problem is not about how dirty one's hands get, but about acknowledging the dirt. Delegated stain is dangerous precisely because it allows leaders and citizens to claim clean hands while benefiting from the wrongful acts they authorized. The moral burden remains identical; only the visibility changes.

  ***

  ### Marking Scheme (20 Points Total)

  **Grading Instruction:** Award points based on the successful execution of the following five conceptual moves. Do not penalize for lack of specific citations (e.g., Walzer, Sartre); reward conceptual precision.

  | Conceptual Move | Points | Typical Failure Mode (B-level work) |
  | :--- | :---: | :--- |
  | **1. Interrogating Proximity:** Challenges the assumption that physical distance mitigates moral responsibility, arguing intent outweighs execution. | 4 | Treats physical proximity as inherently morally significant without justification. |
  | **2. Collapsing Culpability:** Argues that authorization constitutes sufficient agency to equate delegated and executive stain regarding the leader. | 4 | Maintains a rigid distinction where the delegator is deemed less culpable than the executor. |
  | **3. Identifying Evasion:** Analyzes delegation not as innocence, but as a psychological or structural mechanism for self-deception/evasion. | 4 | Describes delegation purely procedurally without addressing the motive of moral concealment. |
  | **4. Extending Complicity:** Applies the logic of authorization to democratic citizens, arguing they inherit stain via representative consent. | 4 | Restricts the analysis solely to the leader, ignoring the prompt's requirement regarding citizens. |
  | **5. Final Verdict:** Concludes clearly whether the distinction resolves, complicates, or collapses the problem (must be consistent with previous moves). | 4 | Offers an ambiguous conclusion or contradicts the earlier argument regarding culpability. |
  | **Total** | **20** | |
