answer: |-
  These views are logically consistent, provided you treat proposition (6) as the ethical framework that resolves the apparent conflict between (1) and (2).

  The circle you're running in stems from conflating two different categories of moral evaluation: harm-based ethics (rights, victims, status) and virtue-based ethics (character, attitude, expression). Propositions (1) and (5) operate firmly within harm-based ethics: since the character lacks sentience, they cannot be a victim, so no rights are violated. Propositions (2) and (6) operate within virtue ethics: the act is objectionable not because a victim suffered, but because the agent's willingness to derive fun from simulated cruelty expresses a vicious character trait. There is no contradiction in holding that an act can be morally corrupting without violating anyone's rights.

  The primary tension appears between (1) and (2), but it is only verbal. You feel a clash because "morally objectionable" usually implies a victim, but your own framework in (6) explicitly rejects that necessity. The tension between (5) and (2) is also merely apparent; (5) denies status to the object, while (2) locates the moral weight in the subject's engagement with that object. Propositions (3) and (4) successfully eliminate the usual suspects (agency and realism), which strengthens the case for (6) by forcing the explanation inward toward the designer's intent and the player's stance rather than the medium's properties.

  The cheapest fix is to refine the language in (1) to prevent category errors. Instead of saying "I haven't wronged anyone," specify "I haven't wronged the *character*." This acknowledges that while the fictional entity has no claims against you, the act itself can still be morally criticizable on virtue-ethical grounds. By distinguishing between *wronging a victim* and *doing something wrong*, you validate the intuition in (2) without abandoning the ontological claim in (5).
