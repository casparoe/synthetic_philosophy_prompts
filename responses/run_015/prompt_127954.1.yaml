answer: |-
  **Question 1**
  Your jurisdictional account hinges on the ability to individuate normative domains—distinguishing, say, punctuality from honesty. What criteria determine the boundaries of a jurisdiction? If a colleague's chronic lateness signals a broader disregard for shared commitments, does the jurisdiction expand to encompass general reliability, or must we artificially compartmentalize the failure to preserve standing?

  **Anticipated Reply**
  Jurisdictions are defined by the specific normative expectations relevant to the interaction. While lateness *can* signal broader disregard, standing is lost only within the domain where the blamer is hypocritical. We do not expand the jurisdiction based on inferred character traits unless the blamer has tacitly assumed a role that governs character assessment generally.

  **Keyed Follow-up**
  But if jurisdictions are this porous—dependent on whether one has tacitly assumed a broader role—doesn't that make the loss of standing turn on vague sociological facts about role perception rather than the normative structure of the blame itself?

  ***

  **Question 2**
  Let's narrow in on the individual blamer. You argue that hypocrisy undermines standing only within the specific domain where the blamer claims authority. How do you distinguish a legitimate narrowing of jurisdiction via explicit self-exemption from mere special pleading? What prevents a blamer from simply announcing, "I am late, but I still judge you," to bypass the standing condition?

  **Anticipated Reply**
  The distinction lies in the illocutionary force of the act. Explicit acknowledgment of one's own failure transforms the nature of the intervention from authoritative judgment into solidarity-based correction. By admitting the fault, the blamer renounces the claim to superior compliance, thereby preserving standing not as a judge, but as a co-participant seeking mutual improvement.

  **Keyed Follow-up**
  If the intervention is reclassified as solidarity-based correction rather than authoritative judgment, does it not collapse into mere mutual confession? If we are both admitting fault, where does the distinctive critical force of blame reside, or have you effectively eliminated blame in cases of admitted hypocrisy?

  ***

  **Question 3**
  You mention that jurisdiction can be widened by tacit role-assumption. If explicit acknowledgment can narrow jurisdiction to preserve standing, how does one *accidentally* widen it? Is there a mechanism by which an individual unwittingly claims authority over a domain they do not occupy, and if so, does this not make standing dangerously vulnerable to the interpretations of the blamee rather than the intentions of the blamer?

  **Anticipated Reply**
  Tacit assumption is governed by social conventions and institutional positions. One does not unwittingly claim authority; rather, one accepts a position (like a manager or parent) where the convention dictates a broader jurisdiction. The vulnerability is not to the blamee's interpretation, but to the objective social facts of the role one has accepted.

  **Keyed Follow-up**
  Yet roles are often contested. If the "objective social facts" of a role are disputed—for instance, whether a senior colleague has authority over a junior's time management—does standing become indeterminate until the role dispute is settled, rendering blame impossible in the interim?

  ***

  **Question 4**
  Turning to your asymmetry thesis: you claim institutions retain standing despite hypocrisy if an internal division of labor separates the criticizing office from the offending office. Consider a university president who issues sustainability mandates while the institution's endowment, which she ultimately oversees, holds fossil-fuel assets. Here, the same person occupies both offices. Does the structural separation survive this personal overlap?

  **Anticipated Reply**
  Yes, because the standing belongs to the *office*, not the human occupant. Structural separation survives personal overlap when the roles are governed by different normative protocols. The President speaks for the academic mission; the Endowment Manager speaks for fiduciary duty. The hypocrisy is real, but it does not undermine the standing of the academic office to criticize the carbon footprint.

  **Keyed Follow-up**
  If structural separation survives personal overlap solely because of differing normative protocols, does this not save too much? Couldnany institutional hypocrisy be rationalized by inventing ad hoc internal protocols that declare two conflicting actions to belong to distinct "offices," thereby insulating the institution from all charges of hypocritical standing?

  ***

  **Question 5**
  If institutions can partition themselves via protocols to maintain standing despite personal overlap, why can't individuals do the same? Why can't I partition "Work Me" from "Home Me" via an internal protocol, claiming that my lateness at home does not undermine my standing to demand punctuality at work? What morally relevant difference prevents the individual from mimicking the institutional division of labor?

  **Anticipated Reply**
  The difference is publicity and enforceability. Institutional protocols are public, codified, and subject to external audit. An individual's internal partitioning is private and self-policed. Allowing individuals to partition themselves would render the standing condition toothless, as any hypocrite could claim an internal "jurisdictional wall" to excuse their behavior.

  **Keyed Follow-up**
  But if the difference is merely publicity, doesn't that suggest the barrier to individual partitioning is epistemic rather than metaphysical? If I publicly declare my "Work/Home" protocol and submit to audit, do I not gain the very institutional standing you deny to individuals, effectively blurring your core asymmetry?

  ***

  **Question 6**
  I want to press on the visibility of these obligations. If a blamer were rendered invisible—such that reputational costs disappeared but her internal normative commitments remained intact—would hypocrisy still undermine her standing? Or does your reliance on "acknowledged obligations" imply that standing depends partly on the social visibility of the blamer's failures?

  **Anticipated Reply**
  Standing depends partly on the social visibility of the blamer's acknowledged obligations. Blame is a communicative act that functions within a normative community. If the hypocrisy is invisible, the communicative distortion that hypocrisy creates—the false claim to authority—is not socially operative. Therefore, invisible hypocrisy does not undermine standing in the same way.

  **Keyed Follow-up**
  If standing relies on the social visibility of the failure rather than the internal inconsistency of the commitment, are you not reducing standing to a matter of reputation management? Does this imply that a hypocrite who successfully hides their vice retains full moral standing, which seems to disconnect standing from moral truth?

  ***

  **Question 7**
  Let's assume standing is lost. If I lack standing to blame you due to hypocrisy, is the content of my blame rendered false, or merely unfitting? If I say "You were wrong to be late," and I am also late, is the proposition "You were wrong" false, or is it true but impermissible for *me* to assert it?

  **Anticipated Reply**
  The proposition remains true; the impermissibility lies in the assertion. Loss of standing affects the *right* to address the norm, not the *validity* of the norm itself. Hypocrisy undermines the authority to hold another accountable, not the objective fact of the violation.

  **Keyed Follow-up**
  If the truth of the blame is independent of the standing to deliver it, what work is the concept of "standing" actually doing? If the message is true but I am barred from sending it, is standing merely a procedural etiquette, or does it have a deeper normative weight that you are struggling to locate?

  ***

  **Question 8**
  Finally, consider the remediation of standing. If I lose standing through hypocrisy, how do I regain it? Must I correct my own behavior first, or is the explicit acknowledgment of solidarity you mentioned earlier sufficient to restore my authority to judge? If the latter, does this not create a perverse incentive to confess hypocrisy strategically to maintain power over others?

  **Anticipated Reply**
  Regaining standing typically requires corrective action, not just acknowledgment. Solidarity-based correction is a temporary mode of engagement, not a permanent restoration of authoritative standing. To regain the right to authoritative blame, one must demonstrate renewed compliance with the norm.

  **Keyed Follow-up**
  But if I can toggle between "solidarity mode" (when I fail) and "authority mode" (when I succeed) simply by announcing my status, doesn't this allow a sophisticated hypocrite to manipulate the system? How do you prevent the jurisdictional account from becoming a toolkit for maintaining authority despite chronic normative failure?
