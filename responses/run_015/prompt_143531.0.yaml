answer: |-
  You are not describing three different things. You have accurately identified a specific, high-stakes dynamic that sits at the intersection of game theory, international relations, and organizational strategy.

  The established term is indeed **The Commitment Race** (sometimes **Competition in Commitment**).

  However, your intuition that the term is often used loosely is correct. In pop discourse, it's often muddied with "arms races" (capability) or "bluffing" (Chicken). Your description is more precise than the typical usage. You have isolated the mechanism of **Verifiable Irreversibility** driven by **Audience Costs**.

  Here is the carving you asked for: the theoretical lineage, the precise differentiation from the concepts you rejected, and the diagnostic field test to identify it in the wild.

  ### 1. The Lineage and The Name
  The concept originates with Thomas Schelling (*The Strategy of Conflict*, 1960), who defined **Strategic Commitment**: the act of restricting your own future choices to influence another actor's present choices.

  However, Schelling mostly discussed this unilaterally (one side burning bridges). The *competitive* aspect you describe—where both sides escalate constraints to out-bind the other—was formalized later in Political Science by James Fearon (1994) under **Audience Costs**.

  **The Definition:** A Commitment Race is a competitive dynamic where actors incur increasing costs of *flexibility* (not capability) to signal resolve. The winner is the first to achieve a level of credible irreversibility that forces the opponent to concede. The mechanism of credibility is the delegation of punishment to a third-party audience.

  ### 2. The Carving: How it differs from near-misses
  You listed four concepts you suspected this wasn't. You were right. Here is the exact boundary line between your phenomenon and those four.

  | Concept | The User's Phenomenon (Commitment Race) | The Near-Miss (Why it's different) |
  | :--- | :--- | :--- |
  | **Burning Boats** | **Reciprocal & Escalating.** Both sides are actively removing exits in response to each other. | **Unilateral & Static.** One side burns boats to solve an internal agency problem or make a one-off threat. It ends there. |
  | **Game of Chicken** | **Actual Constraint.** You must *actually* destroy the ability to swerve. Bluffing fails. | **Perceived Constraint.** The goal is to *appear* committed while secretly retaining the option to swerve if the other doesn't blink. |
  | **Capability Race** | **Restrictive Asset.** The "investment" reduces your future options (e.g., signing a non-compete). | **Productive Asset.** The investment increases your ability to act (e.g., building a faster missile, hiring more staff). |
  | **All-Pay Auction** | **Cost is Inflexibility.** The "bid" is the loss of strategic freedom. | **Cost is Resource.** The "bid" is money/effort transferred to an auctioneer. |

  **The Critical Distinction:** In a capability race, if both sides spend \$1M, they are both stronger. In a commitment race, if both sides lock in, they are both *more dangerous and less safe*, because neither can de-escalate without paying a penalty.

  ### 3. Addressing the "Finish Line" Objection
  You noted: *"Commitment race... implies a finish line, which mine doesn't have."*

  In the literature, the finish line is not a date; it is the **Opponent's Concession**.
  *   **Winning:** You lock in so credibly that the opponent calculates the cost of collision is higher than the cost of yielding. They back down.
  *   **Losing:** You lock in second. You are now constrained, but the opponent is *more* constrained. You must yield or face disaster.
  *   **Crash (No Finish Line):** If both sides successfully lock in completely (perfect irreversibility), the race ends in collision (war, bankruptcy, lawsuit). The "race" is the period *before* that collision where they are shopping for audiences.

  ### 4. The Diagnostic: How to spot it in the wild
  To confirm this is a Commitment Race and not just posturing or a capability build-up, you must observe these four markers. If any are missing, it is a different dynamic.

  **Marker 1: The Cost is Reputational/Political, not Financial/Technical.**
  *   *Observation:* Does the action cost money to *do*, or does it cost reputation to *undo*?
  *   *Yes:* A CEO publicly promises a deadline they know is tight. The cost isn't the work; the cost is being fired if they miss it.
  *   *No:* A CEO buys a new factory. That's a capability race.

  **Marker 2: The "Audience" is the Enforcer.**
  *   *Observation:* Who punishes reversal? It cannot be the opponent. It must be a third party who was not previously involved.
  *   *Yes:* A nation moves troops to a border *and invites the press*. The press is the audience. If they retreat, the voters (audience) punish the leader.
  *   *No:* A nation moves troops and keeps it secret. That's just positioning.

  **Marker 3: First-Mover Advantage in Credibility.**
  *   *Observation:* If Party B matches Party A's constraint exactly, does Party B gain equal leverage?
  *   *Yes:* (Standard Race)
  *   *No:* (Commitment Race). In a commitment race, if Party A locks in first, Party B matching the lock-in is often useless. Party A has already set the "focal point." Party B is now just reacting. The value decays rapidly with time.

  **Marker 4: Negotiation is Viewed as Weakness.**
  *   *Observation:* Does sitting down to talk signal a willingness to accept a reversible outcome?
  *   *Yes:* In a commitment race, pausing to negotiate implies you are keeping an "out." Participants actively avoid negotiation channels to prove they aren't looking for one.
  *   *No:* In normal conflict, negotiation is the path to resolution.

  ### 5. A Tighter Label (If you need one)
  If "Commitment Race" feels too broad for your specific context (because it sometimes includes capability pre-emption), the precise term for the mechanism you described is **Escalating Audience Binding**.

  However, **Commitment Race** is the hook you need to find the literature.

  **Real-world examples to validate your model:**
  1.  **Labor Strikes:** A union votes to authorize a strike (binding themselves to lose wages if they don't strike). Management locks out the workers (binding themselves to lose production). The side that binds their constituents *first* and *most publicly* usually forces the concession.
  2.  **Central Bank Inflation Targeting:** A bank announces a rigid 2% target. They cannot miss it without losing credibility (audience cost). This forces the market to behave. If two banks compete on rigidity, the more rigid one anchors the market.
  3.  **Public M&A Bidding:** Company A announces a "best and final" offer. They bind themselves legally and reputationally. Company B cannot just match it; they must bind themselves to a *higher* price with *stricter* conditions to win.

  ### Summary
  You have correctly identified **The Commitment Race**.
  *   **The Engine:** Strategic elimination of flexibility.
  *   **The Fuel:** Audience costs (third-party punishment).
  *   **The Goal:** First-mover credibility.
  *   **The Risk:** Mutual lock-in leading to collision.

  You are not conflating three things. You have described the *dynamic escalation* phase of Schelling's commitment strategy, which is distinct from the static act of "burning boats." Your diagnostic for "shopping for a harsher audience" is the key differentiator that separates this from simple bluffing.
