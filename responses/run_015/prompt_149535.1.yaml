prompt: |-
  I teach a second-year rational choice / decision theory course — 22 students, mostly philosophy and econ majors, one 90-minute slot, and I've got a projector and a big table at the front but nothing else. They've seen expected utility but no real decison theory past that.

  I want a game that makes them feel the Ellsberg pattern instead of me putting the two urns on a slide and announcing that people are weird. The thing I want them to run into on their own: the usual pattern (I'd rather bet on red from the 50/50 urn than red from the unknown one, and likewise for black) can't come from any single probability assignment plugged into expected utility. My idea is that they each price all four bets separately, and then notice that their price for red-from-known plus black-from-known, and their price for red-from-unknown plus black-from-unknown, are both prices for packages that pay off for sure. No lecture up front, and they shouldn't hear the words ambiguity aversion or Ellsberg until the debrief.

  The wrinkle I want to add, which I can't find anywhere: run the ambiguous urn in three flavours at once, one per third of the room — composition set by a shuffle/randomiser, by a classmate who gets a bonus if the bettors lose, and by a classmate who is herself blindfolded and just pulled a slip from a bag, so she knows nothing but is visibly a person. My hunch is the aversion is way stronger in the second condition, and that this says something about whether the phenomenon is really about missing information or about being in a situation where someone might know more than you than you do. Build it in and tell me how to read whatever comes out.

  Then a last stage where they bet on the ambiguous urn repeatedly, either reusing one fixed urn with replacement or drawing a fresh one each round — you tell me which is cleaner — so that the long-run frequency pulls toward 50%. I want them to feel the force of "over enough rounds this is just a coin flip," and also to feel why that argument might not settle the question.

  Need: actual rules, materials, a payoff scheme with no real money (points, snacks, bragging rights, whatever), a timeline, a debrief that maps specific moments onto specific bits of the argument, and honest notes on what will go wrong the first time I run it and what the game simply can't reproduce so I'll have to say it myself. Also my students will instantly say they'd just take both bets, so the setup has to block that move without me tipping them off as to why.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 2nd-year Philosophy/Econ majors (22 students).
      *   **Background:** Seen Expected Utility (EU), no advanced decision theory.
      *   **Constraint:** 90-minute slot, projector + big table, no other tech.
      *   **Goal:** Experiential learning of the Ellsberg Paradox (ambiguity aversion) without lecturing first.
      *   **Core Mechanism:** Students price four bets (Red/Black on Known/Unknown urns). Show inconsistency with EU (sum of prices $\neq$ sure thing value).
      *   **Specific Twist:** Three variations of the "Unknown" urn:
          1.  Randomizer (Mechanical).
          2.  Adversarial Classmate (Strategic/Epistemic).
          3.  Blindfolded Classmate (Ignorant Human).
          *Hypothesis:* Aversion strongest in Adversarial condition.
      *   **Final Stage:** Repeated betting on the ambiguous urn to test the "Law of Large Numbers" intuition vs. single-shot ambiguity.
      *   **Requirements:** Rules, materials, payoff scheme (no real money), timeline, debrief strategy, troubleshooting/limitations.
      *   **Specific Problem to Solve:** Students saying "I'll just take both bets" (hedging). Need to block this without tipping off the paradox.

  2.  **Deconstruct the Ellsberg Logic for the Game:**
      *   *Standard Ellsberg:* Urn A (50R/50B), Urn B (100 balls, R/B unknown).
      *   *Bets:* $f_1$ (Red on A), $f_2$ (Red on B), $f_3$ (Black on A), $f_4$ (Black on B).
      *   *Typical Preference:* $f_1 \succ f_2$ and $f_4 \succ f_3$.
      *   *EU Violation:* $P(R_A) > P(R_B)$ and $P(B_B) > P(B_A)$. Since $P(R_A) = P(B_A) = 0.5$, this implies $0.5 > P(R_B)$ and $P(B_B) > 0.5$. But $P(R_B) + P(B_B) = 1$. Contradiction.
      *   *Pricing Mechanism:* Instead of choice pairs, use Becker-DeGroot-Marschak (BDM) or simple "Buying Price." BDM is too complex for 90 mins with 22 students. Simple "What's the max you'd pay?" is easier but susceptible to strategic lying. Given the constraint (no real money), "Points" work best. Let's use a "Endowment & Buyback" or "Ticket Valuation" method.
      *   *Blocking the "Take Both" Move:* The prompt specifically worries about students saying "I'll bet Red AND Black on the unknown urn."
          *   *Solution:* Force a *single* choice context or make the pricing task about *valuing a ticket you already own*. If they own a ticket that pays on Red, they value it. If they own a ticket that pays on Black, they value it. They don't choose between them; they price both independently. The inconsistency arises when comparing the *sum* of the prices to the sure thing.

  3.  **Develop the Three Urn Variations (The Twist):**
      *   *Grouping:* 22 students. Split into 3 groups of ~7.
      *   *Urn 1 (Mechanical):* Dice roll or shuffled deck determines composition.
      *   *Urn 2 (Adversarial):* A student (the "House") sets the composition to minimize bettor winnings.
      *   *Urn 3 (Ignorant):* A student draws a slip from a bag to set composition, then forgets/doesn't know.
      *   *Implementation:* Need to make this visible and credible without slowing down too much.

  4.  **Develop the Repeated Betting Stage:**
      *   *Question:* Reuse fixed urn or fresh urn each round?
      *   *Analysis:*
          *   *Fixed Urn:* The composition is fixed but unknown. LLN applies to the *draws*, not the composition. If the urn is 90% Red, you learn that. If it's 50/50, you learn that. But initially, it's ambiguous.
          *   *Fresh Urn:* Each round, the composition is re-randomized (e.g., 0-100 Red). This maintains ambiguity every round.
          *   *Goal:* "Feel the force of long-run frequency." If the composition is fixed (but unknown), learning happens. If the composition changes every time (meta-uncertainty), ambiguity persists.
          *   *Decision:* To test the "it's just a coin flip in the long run" intuition, we want the *process* to be stable even if the *parameter* is unknown. Let's go with **Fixed Urn (Unknown Composition)**. Why? Because the standard counter-argument to Ellsberg is "In the long run, the unknown urn averages to 50/50." If we fix the urn, students might try to learn the bias. If we re-randomize the composition every time, the ambiguity is structural.
          *   *Correction:* Actually, the prompt asks: "reusing one fixed urn with replacement or drawing a fresh one each round — you tell me which is cleaner."
          *   *Recommendation:* **Fixed Urn.** Why? Because the "Long Run" argument usually assumes the underlying probability is stable (even if unknown). If we change the urn every time, we are introducing *second-order* uncertainty that never resolves. A fixed urn allows them to feel the tension between "I don't know the bias" vs. "The bias exists." However, for the specific pedagogical point of "Ambiguity vs. Risk," **Re-randomizing the composition** (Fresh Urn) is actually cleaner for demonstrating that ambiguity *persists* even over repetitions if the generating process is opaque. BUT, the prompt wants them to feel the pull of "over enough rounds this is just a coin flip." That argument only holds if the *average* composition is 50/50.
          *   *Best Compromise:* Use a **Fixed Urn** for the repeated stage. The "Long Run" argument is that *whatever* the composition is, you can bet on both colors over time? No, that's hedging. The argument is that the *uncertainty about the composition* washes out.
          *   *Actually, the cleanest demonstration:* **Fresh Urn each round.** Why? Because it isolates the *act* of betting under ambiguity from *learning*. If they learn the fixed urn is 90% Red, ambiguity vanishes. If we want to test the intuition that "Ambiguity doesn't matter in the long run," we need to keep the ambiguity alive.
          *   *Wait, re-reading the prompt:* "I want them to feel the force of 'over enough rounds this is just a coin flip,' and also to feel why that argument might not settle the question."
          *   *Verdict:* **Fixed Urn.** If the urn is fixed (say, 30 Red / 70 Black), betting Red repeatedly is bad. Betting "Red or Black" is sure. The "Coin Flip" argument claims that because *you don't know* the composition, you should treat it as 50/50. If you play 100 times, do you converge to 50/50 payouts? No, you converge to the *actual* composition. This highlights the difference between *Epistemic* (I don't know) and *Aleatory* (It is random) uncertainty.
          *   *Wait, simpler approach:* Let's make the "Fresh Urn" option the winner for the *game flow*. It prevents learning. It keeps the ambiguity constant. The "Long Run" intuition is that the *process* of generating the urn is symmetric (0-100 is equally likely), so the marginal probability of Red is 50%.
          *   *Decision:* I will recommend **Fresh Urn (Re-randomized Composition)** for the repeated stage. It keeps the ambiguity pure. The "Long Run" argument is that the *meta-probability* is 50%. The counter-argument is that in any specific sequence, you might get stuck with bad urns.
          *   *Actually, let's pivot:* The most powerful demonstration of "Long Run resolves Ambiguity" is if the urn is **Fixed**. Because then the "Long Run" argument is *wrong* (you converge to the bias, not 50/50), which creates the tension.
          *   *Okay, final decision:* **Fixed Urn.** It creates the strongest conflict. Students think "It averages to 50/50." Reality: "It averages to *its* bias." This shows why ambiguity matters (you might be stuck with a bad urn).

  5.  **Addressing the "Take Both Bets" Issue:**
      *   If I ask "How much for Red?" and "How much for Black?", they might price Red at 0.4 and Black at 0.4. Sum = 0.8. Sure thing is 1.0. Inconsistency found.
      *   If they say "I'll just buy both for 0.9," they arbitrage the instructor.
      *   *Fix:* Frame it as **Valuation of an Endowment**. "You already own this ticket. What is the minimum price you would sell it for?" (WTA - Willingness To Accept).
      *   *Constraint:* You can only sell *one* ticket per round, or you value them in isolation.
      *   *Better Fix:* **The Budget Constraint.** Give them 100 Points. They must allocate points to buy tickets. They can't buy more tickets than they have points. But this complicates pricing.
      *   *Best Fix for Classroom:* **Independent Valuation.** "Imagine you own *only* this ticket. What is the cash equivalent?" Do this for all 4. Do not allow them to combine them. The inconsistency is revealed in the *aggregate data* or *individual reflection* during debrief, not by letting them arbitrage during the game.
      *   *Explicit Rule:* "Treat each valuation as a separate universe. You cannot combine bets."

  6.  **Drafting the Plan:**

      *   **Materials:** Slides, physical urns (or bowls), colored chips/balls, slips of paper, score sheets.
      *   **Payoff:** Points -> Snacks/Grade Bonus (small).
      *   **Timeline:**
          *   0-10: Setup & Rules.
          *   10-40: The Pricing Game (3 Conditions).
          *   40-60: The Repeated Betting Stage.
          *   60-90: Debrief & Theory.
      *   **The Twist Implementation:**
          *   Group A (Mechanical): Deck of cards (Red/Black).
          *   Group B (Adversarial): "House" student chooses ratio.
          *   Group C (Ignorant): "Blind" student draws ratio from bag.
      *   **Debrief:** Map the pricing sums to the Sure Thing. Map the 3 conditions to "Ignorance vs. Hostility." Map Repeated stage to "Risk vs. Ambiguity."

  7.  **Refining the "Adversarial" & "Ignorant" Mechanics:**
      *   *Adversarial:* Needs to be credible. A student sits at the front. They decide the ratio (0-100 Red) *after* seeing the bettors' valuations? No, that's too complex. *Before* the betting, but with the goal to minimize bettor success.
      *   *Ignorant:* Student draws a number from 0-100. They don't look at it. That sets the urn.
      *   *Mechanical:* Shuffle a deck, count reds.
      *   *Crucial:* The bettors need to *know* the mechanism to feel the difference.

  8.  **Troubleshooting:**
      *   *Problem:* Students colluding. *Fix:* Individual sheets.
      *   *Problem:* "Take Both" arbitrage. *Fix:* Emphasize "Separate Universes" in instructions.
      *   *Problem:* Time overrun. *Fix:* Strict timer on pricing.
      *   *Problem:* Adversarial student picks 0% or 100%. *Fix:* Restrict them to "Any mix you want, but you must write it down sealed."
      *   *Problem:* Repeated betting becomes boring. *Fix:* Make it fast, 5 rounds max.

  9.  **Structuring the Debrief:**
      *   Step 1: The Math. (Price(R) + Price(B) < 1.0 on Unknown).
      *   Step 2: The EU Violation. (Show the algebra).
      *   Step 3: The Twist. (Did Adversarial feel worse? Why? Knightian Uncertainty vs. Risk).
      *   Step 4: The Long Run. (Why frequency didn't save you).

  10. **Final Review against Constraints:**
      *   22 students? Yes, groups of 7 work.
      *   90 mins? Tight but doable.
      *   No real money? Points system.
      *   Block "Take Both"? "Separate Universe" framing.
      *   Twist included? Yes (3 urns).
      *   Repeated stage included? Yes.

  11. **Self-Correction on "Fixed vs Fresh" for Repeated Stage:**
      *   If I use a Fixed Urn (unknown composition), and they bet 10 times.
      *   Intuition: "It's 50/50 on average."
      *   Reality: If the urn is 10% Red, they lose 9 times.
      *   Lesson: Ambiguity is about the *distribution of distributions*.
      *   If I use Fresh Urn (composition re-randomized 0-100 each time).
      *   Intuition: "It's 50/50 on average."
      *   Reality: It *is* 50/50 on average (marginally).
      *   Lesson: This actually *supports* the EU view (Risk Neutral agents should be indifferent).
      *   *Pedagogical Choice:* To show why the "Long Run" argument *fails* to resolve ambiguity aversion, use the **Fixed Urn**. Because in the Fixed Urn, the "Long Run" does *not* guarantee 50/50 payouts for a specific bettor, it guarantees convergence to the *unknown bias*. This preserves the fear of the "bad urn."
      *   *Wait, one more check:* If the urn is fixed, it becomes a Risk problem once the composition is set, just unknown. If it's re-randomized, it remains Ambiguity.
      *   *Decision:* I will suggest **Fixed Urn** but with a twist: The composition is drawn once from a uniform distribution, then *locked*. This allows the "Long Run" argument (Law of Large Numbers) to clash with the "Bad Urn" fear.

      *(Self-Correction during drafting)*: Actually, for a 90 minute class, managing 3 different urn setups simultaneously might be chaotic. I need to streamline. I'll have the *whole class* observe the setup of the 3 urns, but they are divided into betting groups. Or, simpler: Run the pricing game once for the whole class, but describe the urn differently? No, the prompt wants them to *feel* the difference.
      *Okay, split the room.* 3 Groups. 7 students each.
      *   Group 1: Mechanical.
      *   Group 2: Adversarial.
      *   Group 3: Ignorant.
      *   This works.

      *Wait, Payoff Scheme:* If no real money, why care? "Snacks for top scorers" + "Participation Points."
      *   Need to ensure the pricing task isn't just guessing.
      *   Use a "Matching Mechanism": If your price is within X of the 'fair' value, you get points? No, that teaches them the answer.
      *   Use "Portfolio": You start with 100 points. You value the tickets. At the end, one ticket is selected at random to be 'real'. If your valuation was high, you keep the ticket. If low, you sell it at your price. (BDM lite).
      *   *Simpler:* Just ask for valuations. Collect them. Reveal the inconsistency in debrief. Payoff based on *one* randomly selected bet from *one* randomly selected student to keep attention high. "One of you will play for real snacks."

      *Blocking "Take Both":* "You are pricing a ticket you *already hold*. You cannot buy more."

      *Let's write the plan.*

      *(Final thought on the Repeated Stage)*: I'll recommend **Fixed Urn**. It creates the clearest tension between "I don't know the bias" and "The bias is fixed." The "Long Run" argument suggests ambiguity should vanish. The Fixed Urn shows it doesn't (you're still stuck with the bad bias).

      *(Wait, one nuance on the Adversarial Urn)*: If the adversary sets the urn *before* betting, they will set it to 0% or 100% to make one bet worthless. But the bettors price Red and Black separately. If the adversary sets 100% Red, Red ticket is worth 1, Black is worth 0. If bettors are ambiguity averse, they might price both low (e.g., 0.4).
      *Crucial:* The Adversary must set the composition *without knowing which color the bettor will be asked to value?* No, they set the composition, then bettors value Red and Black.
      *Better:* The Adversary wants to minimize the *total payout* of the group. They will choose 50/50 to maximize uncertainty? No, they want to minimize payout. If bettors bet on Red, Adversary makes it Black.
      *To make it Ellsberg-like:* The Adversary sets the ratio *once*. The bettors don't know it. The Adversary knows it. This creates *asymmetric information*.
      *Okay, I have the mechanics.*

      *Let's finalize the "Take Both" block.*
      Instruction: "You are acting as a bookie. You must set a price at which you are indifferent to buying or selling. You cannot hold both sides."
      Actually, the cleanest way is: "You own the ticket. What is the minimum you would sell it for?" (WTA). You can't sell what you don't own. You own the Red ticket in Scenario 1. You own the Black ticket in Scenario 2. They are separate hypotheticals.

      *Okay, ready to draft.*
answer: |-
  Here is a complete lesson plan designed for your constraints, student profile, and specific pedagogical goals.

  # Lesson Plan: The Three Urns of Ambiguity
  **Time:** 90 Minutes
  **Class Size:** 22 Students
  **Materials:** Projector, 3 clear bowls/urns, 100 red chips, 100 black chips (or colored paper slips), 3 opaque bags, score sheets (paper), pens.
  **Payoff:** "Course Participation Points" (e.g., 5 pts total) + "Snack Rights" (Top 3 scorers get a candy bar). No real money needed, but the *possibility* of reward must be credible.

  ---

  ## Part 1: Setup & The Pricing Game (0:00 – 0:35)

  ### 1. The Hook (5 mins)
  Do not mention Ellsberg, ambiguity, or utility.
  **Script:** "Today is a market simulation. You are traders. You will be given assets (tickets) that pay out points based on draws from urns. Your job is to tell me what those tickets are worth to you. Your final score depends on how accurately you value these assets relative to their actual payout."

  ### 2. The Room Split (5 mins)
  Divide the class into three groups of 7–8 students.
  *   **Group A (Mechanical):** Sits Left.
  *   **Group B (Adversarial):** Sits Center.
  *   **Group C (Ignorant):** Sits Right.

  **The Common Rule:** Every student receives a score sheet with four valuation lines.
  1.  Ticket $K_R$: Pays 100 pts if **Red** is drawn from the **Known** Urn.
  2.  Ticket $K_B$: Pays 100 pts if **Black** is drawn from the **Known** Urn.
  3.  Ticket $U_R$: Pays 100 pts if **Red** is drawn from the **Unknown** Urn.
  4.  Ticket $U_B$: Pays 100 pts if **Black** is drawn from the **Unknown** Urn.

  **The "Take Both" Block:**
  **Script:** "You are valuing these tickets in **separate universes**. In Universe 1, you own only $K_R$. In Universe 2, you own only $K_B$, and so on. You cannot combine tickets. You cannot hedge. You must state the minimum price you would accept to sell the ticket you currently hold. If you write '100', you think it's a sure thing. If you write '0', you think it's worthless."

  ### 3. Setting the Urns (10 mins)
  This must be theatrical to establish the epistemic conditions.

  *   **The Known Urn (All Groups):** Place 50 Red / 50 Black chips in a clear bowl. Shuffle visibly. *Everyone sees this.*
  *   **The Unknown Urns (Group Specific):**
      *   **Group A (Mechanical):** You (the instructor) shuffle a deck of 100 cards (Red/Backs). You count them behind a folder. You place that many Red chips in their bowl. *Students know it was random, but don't know the count.*
      *   **Group B (Adversarial):** Call one volunteer from Group B to the front ("The House"). Give them the chips. **Script:** "You set the composition of this urn. Your goal is to minimize the total points earned by your group members. They will not see the composition until the end. Write the number of Red chips on a slip, seal it in an envelope, and put it in the urn." (The House knows the ratio; the bettors know the House is hostile).
      *   **Group C (Ignorant):** Call one volunteer from Group C to the front ("The Blind"). Put 100 slips numbered 0–100 in a bag. They draw one slip. That number is the count of Red chips. **They do not look at the slip.** They place the chips accordingly. (Neither the House nor the bettors know the ratio).

  ### 4. Valuation Phase (15 mins)
  Students fill out their four prices (0–100).
  **Collection:** Collect the sheets immediately. Do not allow discussion.
  **Interim Task:** While you tally, give them a 2-minute "cool down" writing prompt: *"Briefly explain why you priced $U_R$ differently from $K_R$ (if you did)."* This locks in their intuition before you debunk it.

  ---

  ## Part 2: The Repeated Betting Stage (0:35 – 0:55)

  **Goal:** Test the "Long Run" intuition.
  **Decision:** Use a **Fixed Urn** (Composition set once, then drawn with replacement 10 times).
  **Why?** If you re-randomize the urn every round, the marginal probability of Red *is* 50% (assuming uniform distribution of compositions). This validates the EU view. To create tension, you need the possibility that the urn is *biased* and stays biased. This forces them to feel the risk of being stuck with a "bad" urn, which the "Long Run" argument tries to dismiss.

  ### 1. Setup (5 mins)
  Select **one** of the "Unknown" urns from the previous stage (preferably Group B's Adversarial urn, as it usually generates the strongest reaction).
  **Script:** "We are now going to play 10 rounds with *this specific urn*. The composition is fixed. We will draw a chip, record the color, and put it back. You must choose *one* color to bet on for all 10 rounds. You cannot switch."

  ### 2. The Bet (5 mins)
  Students commit to Red or Black for all 10 rounds.
  **Execution:** You (or a student volunteer) draw 10 times. Record results on the board.
  *   *Likely Outcome:* If Group B's "House" was smart, they set the urn to 90% of the color students *didn't* pick. Or, if it was random, it might be 70/30.
  *   *The Point:* Even if the *process* of setting the urn was symmetric, the *realization* might be biased.

  ### 3. The "Long Run" Discussion (5 mins)
  Ask: "If we did this 1,000 times, would your expected payout be 50%?"
  *   *Student Intuition:* "Yes, because we didn't know the bias."
  *   *Reality:* No. If the urn is 90% Black, your payout converges to 10% (if you bet Red).
  *   *Takeaway:* Ambiguity isn't just noise; it's the risk of a biased parameter.

  ---

  ## Part 3: The Debrief (0:55 – 1:30)

  This is where you connect the experience to the theory. Do not lecture until now.

  ### 1. The Arithmetic Trap (10 mins)
  Project a blank table. Ask for average prices for the four tickets from each group.
  *   **Known Urn:** Expect $P(K_R) \approx 50$, $P(K_B) \approx 50$. Sum $\approx 100$.
  *   **Unknown Urn:** Expect $P(U_R) < 50$, $P(U_B) < 50$. Sum $< 100$.

  **The Reveal:**
  "Look at the Unknown Urn. You priced the Red ticket at (e.g.) 40. You priced the Black ticket at (e.g.) 40. Total = 80."
  "But one of them *must* win. The package ($U_R + U_B$) pays 100 points for sure."
  "Why would you sell a sure thing (100 pts) for 80 pts? If you do this, I can buy both tickets from you for 80, guarantee myself 100, and make 20 points of free profit. You are leaving money on the table."

  **Theory Map:**
  *   This is the **Ellsberg Paradox**.
  *   In Expected Utility, $P(Red) + P(Black)$ must equal 1.
  *   Your prices imply $P(Red) = 0.4$ and $P(Black) = 0.4$.
  *   $0.4 + 0.4 \neq 1$. You are not acting like you have a single probability distribution.

  ### 2. The Three Conditions (10 mins)
  Compare the averages of Group A, B, and C.
  *   **Hypothesis:** Group B (Adversarial) should have the lowest prices (highest aversion). Group C (Ignorant) might be in the middle. Group A (Mechanical) closest to 50.
  *   **Discussion:** "Why did Group B feel worse than Group A? In both cases, you lacked information."
  *   **Theory Map:**
      *   **Risk (Group A):** Probabilities are known (or known to be generated fairly).
      *   **Ambiguity (Group C):** Probabilities are unknown, but no one else knows either.
      *   **Strategic Uncertainty (Group B):** Someone *else* knows, and they are against you.
  *   **Key Insight:** Ambiguity aversion often stems from a fear of **information asymmetry** (someone knows more than me) rather than just missing data. This connects to **MaxMin Expected Utility** (Gilboa-Schmeidler): You evaluate bets based on the worst-case prior. In Group B, the worst case is "The House set this to make me lose."

  ### 3. The Long Run (10 mins)
  Refer back to the 10-round betting stage.
  *   **Question:** "Who thought that playing 10 rounds made the Unknown Urn feel safer?"
  *   **Analysis:** "The argument is: 'In the long run, the unknown urn averages to 50/50.' But we used a **Fixed Urn**. If the House set it to 10% Red, 100 rounds doesn't fix that. You just lose 100 times."
  *   **Theory Map:** Distinguish between **Aleatory Uncertainty** (inherent randomness, washes out in long run) and **Epistemic Uncertainty** (lack of knowledge about the parameter, does *not* wash out unless you learn the parameter).
  *   **Closing Point:** "Expected Utility assumes you can treat Epistemic uncertainty *as if* it were Aleatory (assign a single number). Your behavior today shows you don't. You treat 'I don't know' differently than 'It's 50/50'."

  ---

  ## Troubleshooting & "Honest Notes"

  ### 1. What Will Go Wrong
  *   **The "Hedging" Objection:** A sharp student will say, "I priced them low because I wasn't allowed to buy both. If I could buy both for 80, I would."
      *   *Response:* "Exactly. That is an arbitrage opportunity. A rational agent with consistent probabilities would *never* create that opportunity. The fact that you created it means your preferences violate the axioms of Expected Utility."
  *   **The Adversarial Student:** The "House" in Group B might set the urn to 50/50 out of kindness.
      *   *Mitigation:* In the instructions to the "House," emphasize: "Your bonus points depend on the *group's* loss." If they are kind, the effect vanishes. If this happens, acknowledge it in debrief: "Ambiguity aversion requires a belief that the world might be hostile. If you trust the randomizer, you behave like an EU maximizer."
  *   **Time Management:** The Urn Setup can drag.
      *   *Fix:* Pre-count the chips for Group A and C. Only Group B needs live decision time.
  *   **Boredom in Repeated Stage:** 10 draws can be slow.
      *   *Fix:* Do 5 draws. It's enough to show variance without dragging.

  ### 2. What The Game Cannot Reproduce
  *   **Stakes:** Without real money, "risk aversion" is cheap. Students might price low just to be safe.
      *   *Mitigation:* Remind them: "This is for points/grade. Treat it seriously." In the debrief, acknowledge: "With real money, this effect is stronger. But the *logical inconsistency* (40+40 < 100) remains even with points."
  *   **Learning:** In the real world, we learn the urn's bias.
      *   *Mitigation:* This is why the Repeated Stage uses a Fixed Urn. It highlights that *without* learning the bias, the ambiguity persists.
  *   **Sophisticated Hedging:** Econ majors might try to calculate the "Uniform Prior" (Laplace's Rule of Succession).
      *   *Mitigation:* If they bring this up, validate it! "That is the Bayesian response to Ellsberg. You assign a distribution over probabilities. But the Ellsberg paradox shows that *most people* do not do this naturally. They treat the unknown as 'heavier' than the known."

  ### 3. Reading the Output (The Twist)
  *   **If Group B (Adversarial) prices are lowest:** Confirms that ambiguity aversion is linked to **strategic uncertainty** (fear of an informed opponent). This supports the "Uncertainty as Conflict" view.
  *   **If Group C (Ignorant) prices are same as Group A:** Suggests students treat "Blind Human" same as "Mechanical Randomizer." This would be a null result for your twist, but worth discussing: "Why didn't the human element matter? Do you trust your classmate more than the universe?"
  *   **If Sum of Prices > 100:** (Optimism). Rare, but possible. Discuss "Overconfidence" vs "Ambiguity Seeking."

  ### 4. The "Take Both" Block (Reiterated)
  If a student insists, "I'd buy both," stop them gently during the instruction phase.
  **Script:** "I know you want to hedge. In this market, you are a specialist. You only trade Red tickets *or* Black tickets, never both. Value them in isolation."
  If they still write prices that sum to <100, **let them.** That inconsistency is the data point you need for the debrief. Do not correct them during the game.

  ---

  ## Summary Checklist for Instructor
  1.  **Prep:** 3 Bowls, 200 chips (2 colors), 3 Envelopes, Score Sheets.
  2.  **Recruit:** 2 Volunteers (Adversary, Blind) before class starts so they know their roles.
  3.  **Timer:** Keep the Urn Setup under 10 mins.
  4.  **Debrief:** Focus on the **Sum of Prices**. That is the mathematical proof of the violation.
  5.  **Tone:** Keep it investigative. "Let's see what the data says" rather than "Here is the theory."

  This plan forces the inconsistency to emerge from their own choices, uses your specific "Three Urns" twist to probe the *source* of the aversion, and uses the Repeated Stage to challenge the "Long Run" defense of Expected Utility.
