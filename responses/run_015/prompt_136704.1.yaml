answer: |-
  (a) **Exam Question**

  **Course:** PHIL 450: Advanced Moral Philosophy
  **Unit:** Contractualism and the Structure of Justification
  **Time Allowed:** 75 Minutes
  **Word Limit:** Approx. 700 Words

  **Prompt:**

  T.M. Scanlon's contractualism forbids principles that permit aggregating smaller benefits to many over a severe burden to one, famously illustrated by the "Rescue Case." Consider a novel extension: **Intertemporal Contractualism**. Here, the "parties" to the agreement are not distinct persons, but temporal stages of a single life (e.g., *Self-at-t1* and *Self-at-t2*).

  Suppose *Self-at-t1* faces a principle permitting a severe present burden (e.g., debilitating training) to secure a substantial future benefit (e.g., a career) for *Self-at-t2*. *Self-at-t1* acts as a proxy for *Self-at-t2* in assessing reasonable rejectability.

  Write an essay addressing the following:
  1.  Does allowing *Self-at-t1* to weigh *Self-at-t2*'s gains against its own burdens reintroduce the very aggregation Scanlon rejects, merely relocated within a single life?
  2.  Can Scanlon's framework block this intrapersonal aggregation without smuggling in (i) a prioritarian weighting of well-being or (ii) an independent metaphysical theory of diachronic personal identity?
  3.  Deliver a verdict on whether Intertemporal Contractualism is consistent with the core individualist justification of *What We Owe to Each Other*.

  ***

  (b) **Model Answer**

  **Intertemporal Contractualism and the Problem of Intrapersonal Aggregation**

  Scanlon's contractualism is fundamentally interpersonal; it governs what we owe to *others*. Extending this framework to intrapersonal trade-offs across time creates a tension between the logic of reasonable rejection and the rationality of prudence. The central difficulty lies in determining whether the "single life" functions as a container for aggregation that Scanlon's individualist veto was designed to prevent.

  In the standard interpersonal Rescue Case, Scanlon blocks aggregation because the individual with the severe burden has a generic reason to reject a principle that sacrifices them for the sum of others' minor gains. The justification is relational: one cannot justify a loss to *A* by summing gains to *B* and *C*. In the Intertemporal case, if *Self-at-t1* acts as a proxy for *Self-at-t2*, the distinction between the burden-bearer and the benefit-receiver blurs. If the temporal stages are treated as distinct claimants, *t1* should be able to reject the principle based solely on its present suffering, regardless of *t2*'s gain. This would block intrapersonal aggregation, mirroring the interpersonal veto. However, this yields an implausible theory of prudence, forbidding almost all investment in the future.

  Conversely, if *Self-at-t1* is permitted to sum the burden and the benefit because they belong to the "same life," the contractualist test collapses into a form of utilitarianism within the person. The "reasonable rejection" test ceases to track individual complaints and instead tracks net welfare. This reintroduces aggregation. To avoid this, Scanlon must argue that the *unity of the person* allows for trade-offs that the *separateness of persons* forbids. But this requires a metaphysical account of diachronic identity. If personal identity is just psychological continuity (Parfit's reductionism), the distinction between "intrapersonal" and "interpersonal" diminishes. If Scanlon relies on a robust notion of the "single life" to permit aggregation here but not there, he is smuggling in a metaphysical premise external to the contractualist device of reasonable rejectability.

  Furthermore, there is the issue of prioritarian weights. To block intrapersonal aggregation without relying on identity, one might argue that present burdens weigh heavier than future gains (temporal priority). However, Scanlon's framework relies on generic reasons, not weighted utility functions. Introducing a discount rate or priority weighting to solve the intrapersonal aggregation problem shifts the focus from justifiability to a theory of the good. The contractualist test asks, "Could this be rejected?" not "Does this maximize weighted value?" If the answer to the former depends on the latter, the framework loses its distinctiveness.

  Ultimately, Intertemporal Contractualism is inconsistent with Scanlon's core project if it treats temporal stages as full contractual parties. If they are parties, aggregation is blocked, and prudence becomes impossible. If they are not parties, but mere aspects of a single agent, the contractualist vocabulary is superfluous; standard rational choice theory suffices. Scanlon can maintain consistency only by limiting contractualism to the interpersonal realm. The "reasonable rejection" test is a tool for social justification, not individual deliberation. Attempting to apply it diachronically forces a choice: either fracture the person into warring stages (blocking prudence) or fuse them into a summing container (allowing aggregation). Neither option preserves the specific individualist protection Scanlon champions without relying on external metaphysical or axiological assumptions. Therefore, the framework cannot be extended to the intrapersonal case without losing its anti-aggregationist force.

  ***

  (c) **Marking Scheme**

  **Total Marks: 100**

  **A Range (70–100 marks): Excellent to Outstanding**
  *   **Distinction of Aggregation Types:** Explicitly distinguishes between *interpersonal* aggregation (Scanlon's target) and *intrapersonal* aggregation (the prompt's challenge). Explains why the logic of the Rescue Case does not automatically transfer to the intrapersonal case.
  *   **The "Proxy" Problem:** Identifies that if *t1* acts as a proxy for *t2*, it risks summing utilities (aggregation), but if *t1* vetoes solely for itself, it blocks prudence.
  *   **Constraint Compliance (No Smuggling):** Directly addresses the prohibition on smuggling in personal identity theory or prioritarian weights. Explains *why* relying on these would undermine the contractualist claim to freestanding justification.
  *   **Verdict on Consistency:** Delivers a clear verdict (e.g., "Inconsistent" or "Requires Revision") supported by the argument that contractualism is inherently relational/interpersonal.
  *   **Philosophical Precision:** Uses terms like "generic reasons," "separateness of persons," "diachronic identity," and "justifiability" correctly.

  **B Range (60–69 marks): Good to Very Good**
  *   **Understanding of Scanlon:** Correctly summarizes Scanlon's rejection of interpersonal aggregation (Rescue Case).
  *   **Application:** Attempts to apply the reasonable rejection test to the temporal case.
  *   **Missed Nuance:** May fail to fully articulate *why* the intrapersonal case threatens the framework (e.g., treats the "single life" as unproblematic).
  *   **Constraint Handling:** Mentions identity or priority but does not fully explain how relying on them constitutes "smuggling" or theoretical inconsistency.
  *   **Verdict:** Provides a verdict, but the reasoning may be slightly circular or rely on intuition rather than structural analysis of the contractualist test.

  **C Range (50–59 marks): Satisfactory**
  *   **Summary Heavy:** Spends too much time summarizing *What We Owe to Each Other* generally rather than addressing the specific intertemporal prompt.
  *   **Conflation:** Confuses moral contractualism with rational prudence without analyzing the tension.
  *   **Incomplete:** Fails to address one of the three specific sub-questions in the prompt (Aggregation, Smuggling, Consistency).

  **Common Errors (Mark Deductions)**
  *   **The "Utilitarian Trap" (-10 marks):** Arguing that Scanlon *should* allow intrapersonal aggregation because it maximizes overall well-being, missing the point that the exam asks about *Scanlon's framework*, not normative ethics generally.
  *   **Ignoring Constraints (-15 marks):** Solving the problem by explicitly invoking a Parfitian reductionist view of identity or a prioritarian axiology, despite the prompt forbidding "smuggling in" independent theories.
  *   **Misreading the Proxy (-10 marks):** Treating *Self-at-t1* and *Self-at-t2* as completely unrelated strangers, ignoring the "single life" stipulation, or treating them as strictly identical, ignoring the "temporal stages" stipulation.
  *   **Word Count/Time Management (-5 marks):** Significantly under 600 words (lacks depth) or significantly over 800 words (lack of concision).
