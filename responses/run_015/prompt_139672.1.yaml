          *   Let's define the credal set $\mathcal{M}$ over the likelihoods.
          *   Model 1: $P(+|H) = 0.9, P(+|\neg H) = 0.3$. (Sensitivity 0.9, FPR 0.3).
              *   $P(H|+) = 0.9 / (0.9+0.3) = 0.9/1.2 = 0.75$.
