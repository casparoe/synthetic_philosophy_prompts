answer: |-
  First off, the fact that you are losing sleep over this proves you aren't selfish. Selfish people don't worry about whether their generosity is distributed fairly; they just keep the money. You are grappling with a genuine ethical dilemma that philosophers and aid workers argue about all the time.

  Here is how I see it, breaking down the two competing voices in your head.

  **The Case for Your Side (Proximity and Stewardship)**
  You asked if it's okay to care more about people you share a town with. The answer is yes. There is a moral concept called "special obligation." We have stronger duties to our family, then our neighbors, then our town, then our country, then the world. This isn't necessarily unfair; it's how human communities function.

  *   **Daily Reality:** You see these people at the grocery store. You share the same local roads, the same local air, and the same immediate social fabric. If your community center closes, *you* feel the loss directly. Strengthening your immediate environment is a valid form of stewardship.
  *   **Sustainability:** Charity often works best when it is sustainable. If you help your side, you are maintaining the infrastructure you rely on. There is no shame in wanting your own "backyard" to be healthy.

  **The Case for the Other Side (Need and Arbitrariness)**
  Your second thought is also morally sound. You recognized that the border is an accident of history.
  *   **The "Veil of Ignorance":** You basically described a famous philosophical thought experiment. If you didn't know which side of the border you would be born on, you'd probably want resources to go where the need is greatest.
  *   **Marginal Utility:** If they are "way poorer," your money might do significantly more good there. $500 might keep the lights on for a week on your side, but it might feed a family for a month on their side. From a purely utilitarian "maximize good" perspective, the side with greater need wins.

  **So, are you being unfair?**
  You aren't being unfair for feeling a pull toward your neighbors. That is human nature. We are wired to protect our "tribe," and right now, your administrative tribe is the side of the border you live on.

  However, you *are* recognizing a privilege. You have the luxury of choosing because you ended up on the wealthier side of a random line. Acknowledging that privilege doesn't mean you have to abandon your neighbors, but it does mean you should weigh the "need" factor heavily.

  **A Few Ways to Decide**
  Since you said you haven't saved "a lot," this money matters to you, too. You don't need to martyr yourself.

  1.  **The Split:** Is there a rule that says it has to be all or nothing? Could you give 50% to each? This honors your connection to your neighbors while acknowledging the greater need across the line.
  2.  **The Multiplier:** Ask both centers: "What specific problem will this money solve?" If your side needs a new coat of paint but their side needs to keep the doors open, the urgency might decide for you.
  3.  **The Long Game:** If your side is wealthier, is the community center there more likely to survive without you? If your side is stable enough that the center won't *actually* close, but the other side will definitely close without help, that tips the scale toward the other side.

  **My Take**
  I think it is perfectly normal to prioritize your side. It is not selfish to want to maintain the community you walk through every day. However, since you have the insight to see the border is arbitrary, ignoring the greater need entirely might leave you with that nagging feeling of "what if."

  If I were in your shoes, I would prioritize the side with the **greater need**, but only if it doesn't jeopardize my own financial security. Why? Because the border *is* random. You got lucky. Helping the people who got the unlucky side of the draw feels like a way to honor the fact that you know, deep down, "there but for the grace of God go I."

  But if you give to your side? That's okay too. Strong communities are built by people investing in their immediate neighbors. You can't fix global inequality, but you can fix your town.

  Trust your gut. The fact that you care this much means whichever choice you make, it will be made with integrity.
