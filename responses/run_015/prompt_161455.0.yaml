answer: |-
  Good evening. I call this special town meeting to order.

  We are gathered for a single article on the warrant: whether Westhollow shall merge with Kestrel, and who is entitled to vote on that question. Usually, I begin by reading the rules that govern this room. Tonight, those rules are the subject of the vote. Our charter says resident taxpayers vote. But this vote would void the charter. To use the charter to decide who votes on ending the charter is to stand on the ladder while pulling it up behind you. We cannot assume the rulebook is valid when the validity of the rulebook is what we are testing.

  Look around this room. We are not a single thing. There are those who pay property taxes here and sleep here. There are those who pay rent and sleep here. There are those who work here all day but sleep elsewhere. There are those upstream whose water flows into our pipes, and those who have signed leases to begin when the leaves turn. We are all affected, but we are not all bound in the same way. Some of you are bound by today's ordinances. Some of you will be bound by next year's merged laws. Some of you are bound by both, and some by neither. This record will be kept, and the reasons you give will matter as much as the count.

  Proposals have been made on how to draw the line. One suggests we look to the past and the present: who holds the deed, who pays the bill. This is clear, but it assumes the current charter survives long enough to define its own end. Another suggests we look to the future: who will be governed by the new entity. This second view has a strange shape. It would give a voice to students who have not yet arrived and tenants whose leases start in July. It might silence those who intend to leave if the merger passes. It asks you to decide whether the right to vote belongs to the person standing here now, or the person who will live here later. It treats the vote not as a judgment by the current owners, but as a constitution by the future residents. This means some of you would be voting on a town you will not inhabit, while others would be governed by a town you did not help choose. That tension is not a mistake; it is the heart of the matter.

  I cannot tell you which view is correct. To do so would be to vote before the voting begins. The law does not settle this, because the law is what you are changing. Nor can we simply say "everyone affected should vote," because everyone is affected differently, and drawing that line is itself the decision you must make. If I were to declare one group eligible now, I would be deciding the merger before you have raised your hands.

  You are not just voting on a merger. You are voting on the boundary of the "we" that decides. You must decide whether this meeting represents the town as it is, or the town as it will be. The gap between those two things is where your vote lives. If you choose the present, you risk binding the future without their consent. If you choose the future, you risk deciding the present without its authority. There is no clean path. There is only the path you choose together.

  I will not rule on who is eligible. That eligibility is the first motion you must make. Once you decide who belongs in this room for this vote, you may decide the future of the town. I recognize the selectboard to offer the first motion on voter eligibility.

  ***

  I deliberately declined to settle the boundary question in three places. First, I refused to define "resident," leaving renters and taxpayers equally uncertain of their status; this costs the speech clarity for the diner owner who wants a simple rule. Second, I described the "future governed" proposal without validating its temporal threshold, leaving the start date of eligibility unresolved; this costs the speech decisiveness, forcing the room to wrestle with the strangeness rather than resolving it. Third, I explicitly rejected invoking state law as an arbiter; this costs the speech the comfort of external authority, placing the entire burden of legitimacy on the voters themselves.
