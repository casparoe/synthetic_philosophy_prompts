answer: |-
  First, congratulations on the kid. What you're describing—the sudden expansion of your time horizon—is one of the most universal and profound shifts of parenthood. You are no longer just a citizen of the present; you are a stakeholder in a century you won't see. That makes this debate visceral for you in a way it isn't for most people.

  Maya and Dan are rehearsing a classic debate in ethics and economics that goes back to Frank Ramsey (1928) and has been reignited recently by the "Longtermism" movement. They are both right about different things, but they are also talking past each other on a few key definitions.

  Here is the move-by-move breakdown, followed by a resolution that might help you sleep at night.

  ### Round 1: The Definition of Discounting
  **Maya:** Pure Time Preference (PTP) is morally indefensible. Discounting future wellbeing *just because* it is in the future is temporal parochialism.
  **Dan:** Agrees on the moral intuition, but distinguishes PTP from *instrumental* reasons to discount (wealth, extinction risk, uncertainty).

  *   **Who lands the punch:** **Dan** on technical accuracy, **Maya** on moral clarity.
  *   **The Breakdown:** In economics, the "discount rate" is a bucket that holds several different things.
      1.  **Pure Time Preference:** "I care less about 2100 simply because it is 2100." (Maya is right: This is hard to justify ethically. As philosopher Derek Parfit argued, the date on a calendar doesn't change the moral weight of a person's pain.)
      2.  **Growth Discounting:** Future people will likely be richer, so an extra dollar helps them less than it helps us.
      3.  **Existential Risk:** There is a chance humanity won't make it to 2100, so the expected value of that future is lower.
  *   **Verdict:** Maya is right that *Pure* Time Preference is ethically suspect. Dan is right that you can have a positive discount rate without being ethically suspect, provided it's based on risk and diminishing returns, not just impatience.

  ### Round 2: The "Invisible Future" vs. "Deep Uncertainty"
  **Maya:** Standard models add an extra 1-3% PTP on top of the instrumental stuff. This makes the future mathematically invisible.
  **Dan:** If you set PTP to zero, a life in 10,000 years equals a life today. But our uncertainty about 10,000 years is so deep it acts *like* discounting.

  *   **Who lands the punch:** **Maya** on policy critique, **Dan** on epistemic humility.
  *   **The Breakdown:** Maya is correct about the models. The Stern Review (2006) used a near-zero discount rate and concluded we should spend massively now to prevent climate change. Nordhaus and others used higher rates and concluded we should spend less. That 1% difference determines whether the future matters "a lot" or "almost nothing."
      However, Dan hits on a real problem: **Epistemic Decay.** Our ability to predict the consequences of our actions decays over time. If I spend \$1 trillion today to save a life in 10,000 years, but I have only a 0.0001% confidence that my action will actually result in that life being saved, the *expected value* drops.
  *   **Verdict:** Maya is right that we shouldn't *call* this Pure Time Preference. Dan is right that the *effect* is similar. Conflating "I care less" with "I know less" is dangerous, but functionally, they look the same in a spreadsheet.

  ### Round 3: The "Swamping" Objection
  **Maya:** Uncertainty is separate from PTP. Caring less *even if certain* is temporal parochialism.
  **Dan:** Zero PTP leads to absurdity. The number of future people is so vast that any tiny chance of affecting them swamps all present suffering. It's psychologically impossible and morally wrong to ignore the present.

  *   **Who lands the punch:** **Dan** wins this round, but **Maya** identifies the flaw in his reasoning.
  *   **The Breakdown:** Dan is articulating the **"Overdemandingness Objection."** If you truly weigh all future humans equally, you should arguably live in poverty now to ensure humanity survives another million years, because the math says there will be trillions of future people. This implies you should ignore your crying baby to work on asteroid deflection policy.
      Maya counters that this is just what morality *is*. But she dismisses the psychological reality too quickly. A moral theory that requires humans to act against their fundamental nature (caring more about their kin and present community) might be a bad theory *for humans*, even if it's logically consistent.
  *   **Verdict:** Dan identifies a real paradox (the "Repugnant Conclusion" territory). Maya is logically consistent but practically brittle.

  ### Round 4: Intuition vs. Theory
  **Maya:** That's an objection to consequentialism, not discounting. Maybe our intuitions are wrong.
  **Dan:** (Conversation ended).

  *   **Who lands the punch:** **Stalemate.**
  *   **The Breakdown:** Maya is technically right: if the math says the future matters most, and we feel otherwise, maybe our feelings are the bug, not the feature. But Dan's silence (forced by the spilled drink) hides the strongest counter-argument: **Tractability.** Even if the future matters *more*, it might be much *harder* to help.

  ---

  ### The Scorecard

  *   **Maya is right that:** There is no moral justification for caring less about a person simply because they are born in 2150. Using a "Pure Time Preference" rate in policy is often a covert way of saying "we don't care about our grandchildren."
  *   **Dan is right that:** Zero discounting creates decision paralysis. If the future is infinite in value, you can never justify spending money on anything short-term (like vaccines, or your child's education). Furthermore, uncertainty *does* increase with time, and that should lower the expected value of interventions.

  ### The Resolution Neither Articulated

  There is a way to resolve this that satisfies Maya's moral demand and Dan's practical constraint. It requires separating **Value** from **Tractability**.

  **1. Discount Probability, Not People (The Epistemic Solution)**
  Maya insists we shouldn't discount the *value* of a future life. Dan insists we can't treat the future as certain. The solution is to keep the moral value of a future person at 100% (satisfying Maya), but apply a steep discount to the *probability that your specific action will help them* (satisfying Dan).
  *   *Example:* Saving your baby from a fever today has a 99% chance of working. Donating to a fund to prevent AI risk in 2100 might have a 0.01% chance of working. You can value the 2100 lives equally, but rationally prioritize the fever because the *leverage* is higher. This avoids "temporal parochialism" while acknowledging "epistemic decay."

  **2. The Personal vs. Impartial Distinction (The Parental Solution)**
  This is the part that matters most for you. Maya and Dan are arguing about **public policy** (how governments should spend tax dollars). You are asking about **private morality** (how a parent should live).
  *   **Policy:** Should be impartial. A government *should* use a near-zero discount rate because it represents all citizens, born and unborn. It should care about the climate in 2100 almost as much as the economy in 2025.
  *   **Parenting:** Is *allowed* to be partial. You are not required to be impartial between your child and a child born in 2150. In fact, evolution and ethics alike suggest you *should* prioritize your child.
  *   **Resolution:** You can believe Maya is right about the *world* (the future matters immensely) while acting on Dan's intuition about your *life* (I need to focus on what I can actually touch).

  ### How to apply this to your new horizon

  You mentioned you're trying to figure out how to weigh your daughter's future against the present. Here is the synthesis:

  1.  **Reject Pure Time Preference for Big Risks:** When it comes to existential threats (climate change, nuclear war, pandemics), side with Maya. Do not discount these risks just because they seem far away. If there is a 5% chance of catastrophe in 2080, that is relevant to your voting and advocacy *today*. Your time horizon expansion is a feature, not a bug.
  2.  **Embrace "Tractability Discounting" for Daily Life:** Side with Dan on your daily decisions. You cannot optimize for the year 3000. The uncertainty is too high. Focus on interventions where the link between action and outcome is clear (e.g., reading to your kid vs. donating to a vague "future of humanity" fund).
  3.  **Accept the "Good Enough" Parent:** Dan's fear was that zero discounting makes life impossible to live. If you weigh every potential future descendant equally, you will never buy a toy, take a vacation, or sleep. You are permitted to apply a "kinship discount." It is morally permissible to care more about your daughter than a stranger in 2150.

  **The Verdict:** Maya won the moral argument; Dan won the practical one. You can live in the intersection: Treat the long-term future as morally weighty (don't wreck the planet for them), but treat your immediate agency as limited (don't ruin your life trying to save it).

  Your scrambled sense of time is actually a more accurate calibration of reality. Most people discount the future too much. You've just corrected the rate. Don't let the paralysis of the "infinite future" stop you from changing the diaper in front of you.
