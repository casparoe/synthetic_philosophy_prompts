  Here's a thinking process that leads to the suggested essay argument:

  1.  **Analyze the Request:**
      *   **Topic:** Aquinas's view on tyrannicide.
      *   **The Tension:** Aquinas generally forbids private individuals from killing evildoers (requires public authority), yet he seems to praise the killing of tyrants (citing Cicero/Caesar), who were private citizens.
      *   **The Task:** Argue for a specific resolution: Private killing of a tyrant is lawful *only* insofar as it counts as an exercise of public authority on behalf of the community, not as a private act.
      *   **Key Explanatory Points:**
          *   Explain how the tyrant's pursuit of private good over common good enables the community to assume the public role.
          *   Explain why this reading is superior to the "private right of resistance" alternative.
      *   **Tone:** Academic, persuasive, philosophical exegesis.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Source Material:* Primarily *De Regno* (On Kingship) and *Summa Theologiae* (II-II, q. 42, a. 2; q. 64, a. 3).
      *   *The General Rule:* *Summa Theologiae* II-II, q. 64, a. 3: Killing is lawful only for public authority. Private killing is murder.
      *   *The Tyrannicide Exception:* *De Regno* Book I, Chapter 6. Aquinas discusses removing a tyrant. He cites Cicero regarding Caesar's assassins.
      *   *The Resolution Strategy:* The prompt asks for the "Public Authority by Proxy/Representation" reading. The tyrant, by subverting the common good, forfeits the *exclusive* claim to public authority. The community (or a representative acting *for* the community) reclaims that authority. It is not a "private right" but a "public duty" assumed by the body politic when the head fails.
      *   *Structure of the Argument:*
          1.  Introduction: State the tension and the thesis (the "Public Authority Assumption" reading).
          2.  The General Prohibition: Establish Aquinas's strict rule on public authority (Summa).
          3.  The Nature of Tyranny: Define tyranny as a perversion of authority (private good vs. common good).
          4.  The Resolution: How the tyrant's failure reverts authority to the community. The assassin acts as an *instrument* of the community, not as a private individual.
          5.  Critique of the Alternative: Why the "private right of resistance" reading fails (leads to anarchy, contradicts natural law hierarchy).
          6.  Conclusion: Summarize the coherence of this reading.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the reader with the apparent contradiction. State the thesis clearly: The act is not private but *public in nature*, assumed by the community due to the tyrant's forfeiture of legitimacy.

      *   **The General Rule (Summa Theologiae):** Need to cite II-II, q. 64, a. 3. The key concept is *ordo iustitiae* (order of justice). Private individuals lack the commission to punish. This preserves peace. If everyone could kill evildoers, chaos would ensue.

      *   **The Nature of Tyranny (De Regno):** What makes a tyrant a tyrant? It's not just cruelty; it's the *end* of rule. A king rules for the common good; a tyrant for private good. This is crucial for the prompt's requirement ("explain why the tyrant's ruling for his own private good...").
      *   *Connection:* Because the tyrant treats the public realm as private property, he dissolves the bond of political authority. He becomes a private aggressor (a "robber" in Augustine's sense).

      *   **The Resolution (The Core Argument):** How do we square the circle?
          *   The tyrant vacates the seat of public authority morally, even if he holds it physically.
          *   The community (the *multitudo*) retains the latent authority.
          *   The individual who strikes the blow is not acting as "John Doe" (private) but as an agent of the *res publica*.
          *   Address the Cicero/Caesar reference: Brutus and Cassius weren't acting for personal vendetta (mostly) but for the *Republic*. Aquinas sees them as restoring the public order.
          *   *Nuance:* Aquinas is cautious in *De Regno*. He warns against worse tyrants. But the *principle* remains: it is praiseworthy *if* it liberates the country.

      *   **Why the "Private Right" Reading Fails:**
          *   If it were a private right, it would contradict the natural law prohibition on private killing.
          *   It leads to vendettas and anarchy (the very thing political authority prevents).
          *   It misunderstands Aquinas's metaphysics of authority: Authority resides in the office/community, not the individual's autonomy.
          *   The "Public Assumption" reading preserves the hierarchy while allowing for emergency correction.

      *   **Conclusion:** Reiterate that this reading saves Aquinas from contradiction. It maintains the sanctity of public order while acknowledging that order can be corrupted to the point of self-dissolution.

  4.  **Refining and Polishing:**
      *   *Check against constraints:* Did I explain the private good vs. common good point? Yes. Did I argue against the private right reading? Yes. Is the tone appropriate? Yes.
      *   *Philosophical Precision:* Ensure distinction between *formal* authority (the office) and *material* hold on power. Use terms like *bonum commune*, *usurper*, *minister of justice*.
      *   *Self-Correction during drafting:* I need to be careful not to make Aquinas sound like a modern revolutionary. He is very conservative. The argument must emphasize that this is a restoration of order, not a license for rebellion. The "public authority" angle supports this conservatism better than the "private right" angle.
      *   *Specific Textual Reference:* Make sure to mention *De Regno* I.6 and *Summa Theologiae* II-II.42.2 (sedition) and 64.3 (killing).

  5.  **Final Review:** Does this directly answer the prompt's request to "argue for one particular reading"? Yes, it takes a stance and defends it.

