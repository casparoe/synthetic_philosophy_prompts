answer: |-
  The apparent contradiction in Thomas Aquinas's political thought regarding tyrannicide is one of the most enduring puzzles in medieval philosophy. On one hand, in the *Summa Theologiae*, Aquinas establishes a rigorous prohibition: the execution of evildoers is lawful only for those holding public authority, and private individuals who take it upon themselves to kill are guilty of murder. On the other hand, in *De Regno*, he suggests that killing a tyrant to liberate the country is praiseworthy, explicitly citing Cicero's defense of Brutus and Cassius—private citizens who assassinated Julius Caesar.

  To resolve this tension, one must reject the interpretation that Aquinas grants a "private right of resistance." Such a reading fractures the coherence of his natural law jurisprudence. Instead, the consistent and superior reading is that the killing of a tyrant by a private individual is lawful only insofar as that individual acts as an instrument of the community, effectively assuming the public authority that the tyrant has forfeited. The tyrant's reduction of the common good to his own private good dissolves his claim to exclusive public authority, allowing the community to reclaim that authority for its own preservation. This reading preserves Aquinas's hierarchical view of order while accounting for the extreme necessity of removing a usurper of the common good.

  ### The General Prohibition: Authority and the Order of Justice

  To understand the exception, one must first grasp the rigidity of Aquinas's rule. In *Summa Theologiae* II-II, q. 64, a. 3, Aquinas argues that killing a sinner is lawful only insofar as it is directed to the welfare of the whole community. Consequently, this power belongs solely to those who have "charge of the community," such as judges or princes. A private individual lacks the *commission* to act as a minister of justice. If private persons were permitted to kill evildoers on their own judgment, the result would be chaos, vengeance, and the dissolution of the peace that political authority is meant to secure.

  This prohibition is rooted in the metaphysics of authority. For Aquinas, authority is not a personal possession but a function of the *ordo iustitiae* (order of justice). It exists to serve the *bonum commune* (common good). Therefore, the act of killing is not judged merely by the outcome (the removal of a bad man) but by the *agency* involved. A private act of killing is inherently disordered because it bypasses the public mechanism designed to ensure objectivity and proportionality.

  ### The Nature of Tyranny: Private Good vs. Common Good

  The resolution to the tension lies in Aquinas's definition of tyranny. In *De Regno*, Aquinas distinguishes the king from the tyrant not merely by their methods, but by their ends. The king rules for the common good; the tyrant rules for his own private good. This distinction is crucial. When a ruler seeks his private good over the common good, he ceases to function as a public authority in the moral sense, even if he retains the physical power of the state.

  By treating the public realm as his private property, the tyrant inverts the order of justice. He becomes, in Augustinian terms, a "robber band on a large scale." Because his rule is no longer directed toward the common good, he forfeits the moral legitimacy that protects a ruler from private violence. He effectively deposes himself from the office of the "public person." Consequently, the relationship between the ruler and the ruled reverts. The subjects are no longer bound by the specific obedience due to a legitimate minister of the common good, because that minister is now actively destroying the very end for which he was appointed.

  ### The Resolution: The Community Assuming Public Authority

  If the tyrant has vacated the moral seat of public authority, who holds it? For Aquinas, authority ultimately resides in the community for the sake of the common good. When the head of the body politic becomes diseased and threatens the life of the body, the authority to excise that disease reverts to the body itself.

  Therefore, when a private individual kills a tyrant, the act is not lawful because it is a *private* act, but because it is a *public* act performed by a private person. The individual acts as a proxy for the *multitudo* (the community). In this specific context, the assassin is not exercising a private right of self-defense or revenge; he is exercising a public duty that the community has reclaimed.

  This explains Aquinas's appeal to Cicero regarding Caesar. Brutus and Cassius were private citizens in terms of official office at the moment of the assassination, but Aquinas views their action as praiseworthy because they acted on behalf of the *Res Publica*. They were not killing a man for a personal grievance; they were removing an obstacle to the common good. In this light, the killer functions as a "minister of the community." The authority is not inherent in the individual's autonomy (as a modern "right" would suggest) but is derived from the community's need to restore the order of justice. The act is lawful *only* because it counts as an exercise of public authority on behalf of the whole.

  ### Why the "Private Right" Reading Fails

  Interpreting Aquinas as granting a "private right of resistance" is inferior for three primary reasons, two textual and one philosophical.

  First, a private right reading contradicts Aquinas's explicit condemnation of sedition. In *Summa Theologiae* II-II, q. 42, a. 2, Aquinas argues that sedition is a mortal sin because it opposes the unity and peace of the people. If individuals possessed an inherent private right to judge and kill rulers, sedition would be normalized, and the distinction between a liberator and a factional agitator would vanish. Aquinas is deeply conservative regarding order; he warns in *De Regno* that killing a tyrant often leads to a worse tyranny. A "private right" interpretation ignores this caution by empowering individual judgment over collective stability.

  Second, the private right reading misunderstands the source of legitimacy in Aquinas's thought. For Aquinas, legitimacy comes from alignment with the divine and natural law order, specifically the pursuit of the common good. It does not come from individual autonomy. To say a private person has a "right" to kill implies a sphere of personal jurisdiction that Aquinas does not recognize. The individual is lawful only when aligned with the public good.

  Third, and most importantly, the "Public Authority Assumption" reading preserves the consistency of the *Summa*'s rule on killing. If we say the tyrannicide is a private act, we must admit Aquinas is contradicting himself (forbidden in the *Summa*, praised in *De Regno*). If we say the tyrannicide is a public act undertaken by the community through an agent, the contradiction dissolves. The prohibition remains intact: private killing is forbidden. The exception is not a loophole for private violence, but a recognition that the "public authority" has shifted locations due to the tyrant's moral failure.

  ### Conclusion

  The tension in Aquinas's view on tyrannicide is resolved not by loosening the prohibition on private killing, but by redefining the status of the tyrant and the agent of his removal. The tyrant, by ruling for his private good rather than the common good, severs the bond of political authority that protects him. This allows the community to assume the public role necessary for its own preservation. When a private individual strikes down such a tyrant, they do so not as a private avenger, but as an instrument of the reclaimed public authority. This reading is superior to the "private right" alternative because it maintains the integrity of Aquinas's natural law jurisprudence, avoids the anarchy of private judgment, and correctly identifies the common good as the sole source of political legitimacy. In Aquinas's framework, the sword of justice never belongs to the private individual; but when the public hand drops the sword, the community may pick it up to restore the order it was meant to serve.
