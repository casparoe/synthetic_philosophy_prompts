      *   *Decision:* The "Cheapest Fix" is to stop reducing Śabda. It creates the most logical friction with the "4 pramāṇas" error theory. The second cheapest is to soften the Anumāna claim (mediate vs. no contact).

  6.  **Final Polish:** Structure clearly. Use Nyāya terminology correctly (liṅga, vyāpti, śābdabodha, sādṛśya). Ensure tone is analytical and constructive. (Make sure to highlight that the "Inference doesn't touch reality" claim is the most dangerous for Nyāya realism).

