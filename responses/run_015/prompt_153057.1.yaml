  5.  **Refining the Output (Self-Correction during drafting):**
      *   *Wait, check the Anyathākhyāti claim.* Anyathākhyāti is specifically about *khyāti* (apprehension). Can testimony be *khyāti*? Yes, śābdabodha (verbal cognition).
      *   *Check the Śabda reduction.* Mīmāṃsā (Prābhākara) says Śabda is distinct. Nyāya *sometimes* reduces it to inference (reliability of speaker), but later Nyāya accepts it as distinct because the knowledge arises from the *meaning relation* (śakti), not just inference about the speaker. The user's view is actually closer to early Nyāya or Buddhist critique.
      *   *Check Upamāna.* Nyāya defends Upamāna vigorously against reduction. So the user is orthodox there.
