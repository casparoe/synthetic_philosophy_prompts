          *   *Severity:* High. This challenges the definition of *pramāṇa* itself within Nyāya.

      *   *Tension 2: Śabda as Inference vs. Anyathākhyāti for Śabda.*
          *   If Śabda is just inference (reliability of speaker), then error in Śabda should be error in inference (fallacious *hetu*).
          *   But the user wants *Anyathākhyāti* (misplacement) to apply. *Anyathākhyāti* is typically an ontological error theory (seeing silver where there is shell). Applying it to testimony means treating false words as "misplaced properties."
          *   *Conflict:* If Śabda is inference about the *speaker's reliability*, a lie is just a bad inference (the speaker wasn't reliable). If Śabda is about the *object* described, a lie is a misrepresentation.
          *   *Severity:* Medium. It depends on how "misplacement" is defined linguistically.

      *   *Tension 3: Upamāna Irreducibility vs. Pratyakṣa/Anumāna Dichotomy.*
