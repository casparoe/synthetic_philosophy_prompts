  7.  (Final Review of the "Cheapest Fix"): Is it cheaper to drop Upamāna irreducibility? No, that requires reworking epistemology. Is it cheaper to drop Śabda reduction? Yes, just accept the traditional category. Is it cheaper to soften Anumāna? Yes, just change "never touches" to "touches indirectly."
