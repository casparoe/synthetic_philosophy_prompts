          *   Nyāya defends Upamāna as irreducible because the knowledge "this gavaya is similar to that cow" arises from the *relation of similarity* (sādṛśya), which isn't just perception of the object nor inference from a mark.
          *   *Conflict:* If only Perception touches reality, and Upamāna is irreducible, does Upamāna touch reality? If yes, how is it different from Perception? If no, is it valid?
          *   *Severity:* Medium-High. It creates a tripartite ontology of knowledge access (Direct, Indirect, Similarity-based).

      *   *Tension 4: Anyathākhyāti Uniformity.*
          *   *Anyathākhyāti* is the Nyāya theory of error (typically for illusion, e.g., shell-silver). It relies on real constituents being wrongly combined.
          *   Applying it to Inference: False inference = real mark wrongly connected to major term. (Works).
          *   Applying it to Testimony: False testimony = real words/concepts wrongly connected to object. (Works).
          *   Applying it to Upamāna: False comparison = real similarity wrongly identified?
