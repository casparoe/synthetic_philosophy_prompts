      *   **Core Claim 3 (Śabda):** Testimony is *not* a separate *pramāṇa*; it's reducible to inference (based on speaker authority/reliability).
      *   **Core Claim 4 (Upamāna):** Comparison *is* a separate *pramāṇa*; it's irreducible to perception or inference (recognizing similarity is unique).
      *   **Core Claim 5 (Anyathākhyāti):** The theory of error (misplacement) applies uniformly to *all* four (including testimony). False testimony = misattributing a property via the verbal channel.

  2.  **Evaluate Internal Consistency & Tensions:**

