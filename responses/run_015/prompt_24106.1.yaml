answer: |-
  1. Iterated elimination of strategies that are never a best response to any belief: This concept directly defines rationalizability, which is the maximal set of strategies consistent with common knowledge of rationality.
  2. Iterated elimination of strictly dominated strategies where the dominator can be any mixed strategy: In finite games, this procedure yields the exact same set as never-best-response elimination, serving as its operational algorithm.
  3. Iterated elimination of strictly dominated strategies where the dominator has to be a pure strategy: While perfectly sound, this method is incomplete because it fails to eliminate strategies that are strictly dominated only by mixed strategies.
  4. Iterated elimination of weakly dominated strategies, one at a time, where you only count a strategy as gone if it gets eliminated in every possible order: This conservative approach mitigates order-dependence issues but remains untrustworthy because it can still eliminate strategies supported by Nash equilibria.
  5. Iterated elimination of weakly dominated strategies, done in simultaneous rounds: This method is the least reliable because it imposes an arbitrary elimination order that can discard rationalizable strategies without robust justification.
