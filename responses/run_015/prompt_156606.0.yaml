  9.  **Final Polish:** Ensure the table is compact and the distinctions on "Fake Requirements" are sharp. (e.g., Publication venue is a fake requirement because predatory journals exist and great ideas start on blogs).

      *(Self-Correction on the "Single Requirement"):* Is it "Engagement"? Or is it "Burden of Explanation"? Engagement is more observable. A mod can see "Did they mention the opposing view?" A mod cannot easily see "Is the burden met?" So "Engagement with the Strongest Counter-Argument" is the operational lever.

