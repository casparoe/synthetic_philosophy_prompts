      *   *Requirement 3: Falsifiability/Risk.* (Addressing the "explains everything" problem).
      *   *Requirement 4: Internal Consistency of Method.* (Addressing the symmetry test).
      *   *Requirement 5: Burden of Extraordinary Claims.* (Addressing the conspiracy magnitude).

      *   *Classification:*
          *   Non-negotiable: Engagement with Counter-Case (without this, it's preaching).
          *   Non-negotiable: Source Transparency (without this, it's unverifiable).
          *   Preference: Falsifiability (hard for mods to judge quickly).
          *   Fake Requirement: Publication Form (journals can be predatory, blogs can be good).
          *   Fake Requirement: Deference to Consensus (this is the "appeal to authority" trap the user wants to avoid, though consensus is a heuristic).

      *   *Incompatibilities:*
          *   Speed vs. Depth.
          *   Neutrality vs. Accuracy (being neutral about a flat-earther isn't accurate).
          *   Protecting the Vindicated Outsider vs. Stopping the Crank (they look identical at the start).

      *   *The "Single Requirement that does the most work":*
          *   It's likely *Engagement with the Strongest Counter-Argument* (Steel-manning). If they ignore the main objection, they aren't doing history; they're doing advocacy.

  4.  **Addressing the Test Cases:**

      *   *Atlantis/Von Däniken/Fomenko:* Fail on Engagement with Counter-Case (they dismiss evidence as fake/suppressed without proof) and Conspiracy Magnitude.
      *   *Anonymous Photos:* Fail on Source Transparency.
      *   *Wegener/Schliemann/Ugarit:* Pass on Engagement (they acknowledged the problems they were solving) and Source Transparency (data was visible).
      *   *Specialist Disagreement:* Allow multiple views if they meet the standard.
      *   *Nationalist History:* Distinguish based on method (do they apply the same rigor to their enemies as their friends?).

  5.  **Addressing the Hunches:**

      *   *Mechanical rules get gamed:* True. Need a "spirit of the rule" clause (e.g., "Good Faith Engagement").
      *   *Retrospective testing:* Crucial. Judge based on *then*, not *now*.
      *   *Expertise trap:* The rule must be about *process*, not *content*.
      *   *Suppression/Conspiracy:* Quantify the conspiracy.
      *   *Symmetry Test:* This tests the *poster*, not the theory. Useful for moderation (is this person here to discuss or convert?).
      *   *Unit of Assessment:* The *Post/Claim*, not the Person.
      *   *Error Cost:* False Positive (allowing nonsense) is worse for forum health than False Negative (rejecting a genius).
      *   *Publication Form:* Irrelevant as a hard rule, relevant as a heuristic.

  6.  **Addressing the Final Question ("Pseudohistory"):**

      *   Does it fragment? Yes. It's usually a mix of:
          1.  Methodological Failure (ignoring counter-evidence).
          2.  Epistemic Bloat (conspiracy theories to save the hypothesis).
          3.  Source Obfuscation (cannot trace claims).

  7.  **Refining the Output Structure:**

