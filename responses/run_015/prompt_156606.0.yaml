          *   Must address the user's specific hunches (mechanical rules get gamed, retrospective testing, expertise trap, burden of explanation, symmetry test, unit of assessment, error costs, publication form).
          *   **Crucial Output:** A list of requirements with classifications (Non-negotiable, Preference, Fake Requirement), identification of trade-offs/incompatibilities, identification of the "single requirement that does the most work," and a final scoring table of contenders (Consensus, Falsifiability, etc.).
          *   **Final Question:** Does "pseudohistory" survive as a single category, or does it fragment?
          *   **Negative Constraint:** No bibliography, no "ask an expert."

  2.  **Deconstruct the Challenge:**

      *   The core tension is between *epistemic humility* (we aren't experts) and *epistemic hygiene* (we can't let nonsense dominate).
      *   The user wants a procedural standard, not a substantive one. This is akin to peer review *process* rather than peer review *verdict*.
      *   The "Sincere Poster" is the hard case. Trolls are easy.
      *   The "Vindicated Outsider" (Wegener, Schliemann) is the risk case. We don't want to suppress the next Wegener.

  3.  **Drafting the Requirements (The "Specification"):**

      *   *Requirement 1: Engagement with the Counter-Case.* (Addressing the "why does the record look like the mainstream says" hunch).
