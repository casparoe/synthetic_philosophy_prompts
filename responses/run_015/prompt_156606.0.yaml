answer: |-
  ### The Specification: A Procedural Standard for Historical Claims

  This standard does not judge truth. It judges the *structure of the argument*. It is designed to be applied by a generalist moderator in under five minutes.

  **1. The Traceability Requirement**
  *   **Rule:** Every factual assertion (dates, locations, artifacts, quotes) must be linked to a specific, retrievable source. "Common knowledge," "ancient texts," or "research shows" are insufficient.
  *   **Motivating Case:** The anonymous photo theories (buildings below street level, star-shaped earthworks). These circulate without origin, preventing verification of context or manipulation.
  *   **Action:** If sources are missing or broken, **Ask the poster one specific question**: "Please provide the citation or location for claim X." If not answered in 48 hours, **Remove**.
  *   **Classification:** **Non-negotiable.** Without this, moderation is impossible.

  **2. The Steel-Man Requirement**
  *   **Rule:** The post must explicitly state the strongest mainstream counter-argument to its central claim and explain why that counter-argument is incorrect or insufficient. It cannot dismiss the mainstream view as "dogma" or "suppression" without specific evidence of the suppression mechanism.
  *   **Motivating Case:** Fomenko (New Chronology) and Von Däniken. Both rely on characterizing mainstream history as incompetent or deceptive rather than engaging with the specific data (e.g., dendrochronology, radiocarbon calibration) that contradicts them. Conversely, Wegener (Continental Drift) acknowledged the lack of a mechanism but marshaled all available geological data to force the conversation.
  *   **Action:** If the counter-argument is absent or straw-manned, **Leave up with a label** ("Missing Counter-Argument") or **Remove** if the omission is total.
  *   **Classification:** **Non-negotiable.** This distinguishes argument from advocacy.

  **3. The Epistemic Cost Requirement**
  *   **Rule:** If the claim requires rejecting established evidence, the post must quantify what else must be rejected to maintain the theory. If the theory relies on a conspiracy (suppression of evidence), it must estimate the number of people involved and the duration of silence required.
  *   **Motivating Case:** The "Sunken Island" (Atlantis) or "Fabricated Chronology." To believe these, one must assume thousands of archaeologists, linguists, and scientists across centuries and nations are lying or mistaken in coordination. Schliemann (Troy) did not require a conspiracy; he required a re-interpretation of a text against physical dirt.
  *   **Action:** If the cost is unacknowledged, **Leave up with a label** ("High Epistemic Cost"). If the cost is acknowledged but deemed acceptable by the author, **Leave Alone**.
  *   **Classification:** **Preference.** Hard to enforce strictly, but useful for labeling.

  **4. The Methodological Symmetry Requirement**
  *   **Rule:** The evidentiary standard applied to the author's claim must match the standard they apply to claims they reject.
  *   **Motivating Case:** Nationalist myth vs. Nationalist history. A nationalist myth demands absolute literalism from enemy texts but treats friendly texts as poetic when contradicted. Honest error applies the same skepticism to all sides.
  *   **Action:** If asymmetry is detected, **Ask the poster one specific question**: "You rejected Claim A for lack of primary sources; what primary source supports your Claim B?"
  *   **Classification:** **Non-negotiable.** This detects bad faith without judging the topic.

  ---

  ### Classification of Desiderata

  | Requirement / Demand | Classification | Reason |
  | :--- | :--- | :--- |
  | **Traceability** | **Non-negotiable** | Without sources, there is no history, only storytelling. |
  | **Steel-Manning** | **Non-negotiable** | Without engaging the counter-case, there is no debate, only sermonizing. |
  | **Methodological Symmetry** | **Non-negotiable** | Asymmetry proves the goal is victory, not truth. |
  | **Epistemic Cost Accounting** | **Preference** | Valuable for audience context, but hard for mods to quantify quickly. |
  | **Deference to Consensus** | **Prejudice (Fake Requirement)** | Consensus is a heuristic, not a rule. Wegener was against consensus. Using this as a hard rule bans the "Vindicated Outsider." |
  | **Publication Venue** | **Prejudice (Fake Requirement)** | Predatory journals exist; brilliant blogs exist. Form is not proof of quality. |
  | **Falsifiability** | **Preference** | Philosophically sound, but often too abstract for a 5-minute mod check. |
  | **Generating New Results** | **Preference** | Hard to judge in a single post. |

  ---

  ### Incompatibilities and Trade-offs

  You cannot satisfy all desiderata simultaneously. You must choose which errors you are willing to tolerate.

  1.  **Speed vs. Depth (The Moderator Constraint):** You cannot verify sources *and* judge argument quality *and* check for symmetry in minutes.
      *   *Resolution:* Prioritize **Traceability**. It is the fastest check. If sources are missing, nothing else matters.
  2.  **Neutrality vs. Hygiene (The Forum Constraint):** You cannot be neutral about method and maintain quality. A post that ignores counter-arguments is "neutral" in tone but toxic to discourse.
      *   *Resolution:* Sacrifice procedural neutrality for methodological hygiene. Labeling is the compromise.
  3.  **The Vindicated Outsider vs. The Crank (The Epistemic Constraint):** At the moment of posting, Wegener and Fomenko look identical (both contradict consensus, both claim new insight).
      *   *Resolution:* You cannot distinguish them by *content*. You distinguish them by *process*. Wegener engaged with the geological data of his time; Fomenko dismisses the data as forged. The rule filters the *behavior*, not the *potential truth*.
      *   *Cost:* You will occasionally label a future Wegener as "High Epistemic Cost." This is the acceptable error cost to prevent the forum from becoming a haven for Fomenkos.

  ---

  ### The Workhorse Requirement

  **The Steel-Man Requirement (Engagement with the Strongest Counter-Argument)** does the most work.

  *   **Why:** It is observable without expertise. A moderator does not need to know if radiocarbon dating works; they only need to see if the poster *mentioned* radiocarbon dating and attempted to address it.
  *   **Effect:** It filters out 90% of pseudohistory immediately. Pseudohistory survives by ignoring the hard parts of the mainstream record. If you force the poster to paste the hard part and argue against it, the structural weakness of their claim usually becomes visible to the audience, even if the moderator doesn't understand the science.
  *   **Actionability:** It yields a binary check: "Is the counter-argument present? Yes/No."

  ---

  ### Verification of Your Hunches

  *   **"Mechanical rules get gamed":** **Accepted.** Posters will learn to add a "Mainstream View" section. *Correction:* The **Symmetry Requirement** catches this. If their "Mainstream View" section is a straw man, the Symmetry check (comparing how they treat opposing evidence) will flag it.
  *   **"Tested against the past using only what was known at the time":** **Accepted.** The **Traceability Requirement** enforces this. They must cite the data available, not just the conclusion.
  *   **"Criteria that require expertise collapse into 'ask a professor'":** **Accepted.** That is why **Steel-Manning** is procedural. You check for the *presence* of the argument, not the *validity* of the rebuttal.
  *   **"Explain why the record looks the way the mainstream says":** **Accepted.** This is the core of the **Epistemic Cost Requirement**.
  *   **"Symmetry test is evidence about the person":** **Corrected.** It is evidence about the *post's utility*. A symmetric argument is useful for discussion; an asymmetric one is propaganda. For a forum, utility is the metric.
  *   **"Unit of assessment":** **The Claim/Post.** Do not ban the user for a past book; judge the current text. If the founder was a crank but followers behave impeccably (meet the 4 rules), let them post.
  *   **"Error-cost profile":** **False Positive (Allowing Nonsense) is worse than False Negative (Rejecting Genius).** A forum flooded with nonsense drives away experts and serious learners. A genius rejected can publish elsewhere; a forum ruined is dead.
  *   **"Form of publication":** **Discard.** It is a heuristic, not a rule. Use it only to weight the **Traceability** check (a journal link is easier to trust than a screenshot, but both must be traceable).

  ---

  ### Scoring Contenders & The Nature of Pseudohistory

  | Contender | Score (1-5) | Notes |
  | :--- | :---: | :--- |
  | **Deference to Consensus** | 1 | Bans the Vindicated Outsider. |
  | **Falsifiability** | 3 | Good theory, hard for mods to apply quickly. |
  | **Responsiveness (Steel-Man)** | 5 | **The Workhorse.** Observable, actionable, filters noise. |
  | **Burden of Proof** | 4 | Essential, but vague without Traceability. |
  | **Progressiveness (New Results)** | 2 | Too slow to judge in a queue. |
  | **Conspiracy Size** | 4 | Excellent for labeling, hard to quantify precisely. |

  **Equivalencies:**
  *   **Burden of Proof** and **Traceability** are the same test: "Show the work."
  *   **Responsiveness** and **Steel-Manning** are the same test: "Acknowledge the opposition."
  *   **Consensus** and **Conspiracy Size** are inversely related: The further from consensus, the larger the required conspiracy to explain the deviation.

  **Does "Pseudohistory" survive as a single thing?**
  **No.** It fragments into three distinct procedural failures, which you should name separately in your moderation logs:

  1.  **Source Obfuscation:** (Fails Traceability). The claim cannot be checked. (e.g., Anonymous photos).
  2.  **Argumentative Asymmetry:** (Fails Symmetry/Steel-Man). The claim uses rules for others that it exempts itself from. (e.g., Nationalist myth).
  3.  **Epistemic Bloat:** (Fails Cost Accounting). The claim requires more assumptions to sustain than the evidence it explains. (e.g., Global conspiracies to hide Atlantis).

  **Final Recommendation:**
  Adopt the **Traceability** and **Steel-Man** requirements as non-negotiable conditions for posting. Use **Epistemic Cost** and **Symmetry** as labeling criteria. This allows you to reject the *process* of pseudohistory without claiming to judge the *truth* of history, protecting you from the "gatekeeping" accusation while maintaining forum hygiene.
