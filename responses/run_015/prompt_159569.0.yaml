      *   So ranking by ratio is correct *for continuous variables*. For discrete (lumpy) items, it's a heuristic. The theorem assumes continuous optimization space usually. The "lumpiness" is an implementation constraint, not a theoretical refutation, but it matters for the "bite."

  10. **Refining the ADA/Weights:**
