answer: |-
  This is a sharp set of questions. You are right to suspect that Harsanyi's Aggregation Theorem is often treated as a free-floating justification for utilitarianism without checking whether the institutional machinery actually fits the theorem's premises. The Oregon case is an excellent stress test because it attempts to operationalize aggregation in a bureaucracy, revealing where the formalism breaks down.

  Here is the disciplined mapping you requested.

  ### 1. Mapping the Case to the Theorem

  To see if the theorem applies, we must map the variables strictly.

  **The Individuals:**
  In Harsanyi's theorem, the "individuals" ($i = 1 \dots n$) are the constituents whose utilities are being aggregated. In Oregon, the explicit units of analysis were *condition–treatment pairs*, not people. This is a category error relative to the theorem. To make Oregon fit Harsanyi, you must treat the "individuals" as the *potential patients* who might receive those treatments. However, since the list was created before knowing exactly who would fall ill, the "individuals" are statistically defined risk-bearers, not identified patients.

  **The Social Alternatives:**
  Harsanyi's theorem operates over a set of social states (or lotteries over them). Oregon was choosing a *coverage list* subject to a budget constraint.
  *   **Theorem:** Choice over lotteries $L$.
  *   **Oregon:** Choice over a deterministic subset of treatments $S \subset \{ \text{all treatments} \}$ such that $\sum_{j \in S} \text{Cost}_j \leq \text{Budget}$.
  This is a constrained optimization problem, not a pure social ordering problem. The theorem tells you how to rank social states; it does not inherently solve for budget constraints, though you can add the budget as a feasibility constraint on the states.

  **The Utility Functions:**
  *   **Theorem:** $U_i$ represents individual $i$'s von Neumann-Morgenstern (vNM) utility over social states (welfare).
  *   **Oregon:** The metric was QALYs (Quality-Adjusted Life Years).
  *   **The Mismatch:** QALYs are measures of *health capacity*, not necessarily *welfare*. Harsanyi requires welfare utilities. If a disabled person adapts to their condition and reports high life satisfaction despite low health capacity, a QALY metric might undervalue their treatment compared to their actual welfare gain. Oregon used health-utility as a proxy for welfare-utility. The theorem does not validate that proxy; it only says *if* these are the utilities, *then* sum them.

  ### 2. The Certainty Problem and vNM Assumptions

  You identified the critical weakness: **Oregon was choosing under certainty (or near-certainty), not risk.**

  Harsanyi's theorem relies heavily on the **Independence Axiom** over lotteries to force utility functions to be cardinal (unique up to positive affine transformation). This cardinality is essential for the conclusion that the Social Welfare Function (SWF) must be a *linear* weighted sum ($W = \sum a_i U_i$).

  **If choices are only over sure outcomes:**
  1.  **Loss of Cardinality:** If we only observe rankings over deterministic outcomes, utility is ordinal. Any monotonic transformation of $U_i$ preserves the ranking.
  2.  **Loss of Linearity:** If $U_i$ is ordinal, $\sum U_i$ is not invariant. You could transform $U_i$ to $U_i^2$ or $\log(U_i)$ and the individual ordering remains the same, but the social sum changes drastically.
  3.  **The Consequence:** Without the lottery/risk structure, Harsanyi's conclusion collapses. A Pareto-satisfying social ordering over sure outcomes is consistent with Utilitarianism, but also with Prioritarianism (sum of concave transformations), Rank-Weighted Utilitarianism, or many other forms.

  **Verdict:** Your suspicion is correct. Because Oregon was allocating a fixed budget to deterministic treatments, the vNM assumptions on the social side are doing no work. The theorem constrains much less than it looks like it does here. It cannot rule out non-linear aggregation rules if there is no risk involved in the choice structure. The "weighted sum" conclusion is technically unsupported by the theorem in a deterministic context.

  ### 3. Mechanics: Greedy Algorithm vs. Weighted Sum

  Even if we grant that Oregon wanted to maximize the sum of QALYs (Utilitarianism), their mechanical implementation was flawed.

  **The Theorem's Ideal:**
  Maximize $\sum Q_j$ subject to $\sum C_j \leq B$.
  Mathematically, if treatments are divisible and independent, this is solved by ranking treatments by the ratio $Q_j / C_j$ (benefit per cost) and funding from the top down until the budget is exhausted.

  **Oregon's Reality:**
  1.  **Lumpiness:** Treatments are discrete (you can't fund 0.5 of an appendectomy). The "rank and cut" method is a greedy algorithm for the **Knapsack Problem**. It does not guarantee the global maximum of the sum. You might exclude a high-cost, high-benefit treatment near the cutoff that would have yielded more total QALYs than several small treatments above the line.
  2.  **Interactions:** The theorem assumes additive separability ($\sum U_i$). In health, treatments interact. Treating condition A might make treatment for condition B more effective. A simple league table assumes independence.

  **Is this the Theorem's Fault?**
  No. This is an implementation error. The theorem describes the *objective function* (maximize the sum), not the *algorithm* for solving it under integer constraints. However, by presenting the league table as *the* rational solution, Oregon conflated the heuristic with the optimum. The "embarrassing orderings" (e.g., tooth capping ranked above appendectomy) were often artifacts of the ratio metric favoring cheap, marginal gains over expensive, life-saving ones, which is a feature of strict QALY maximization, not a calculation error.

  ### 4. Weights, QALYs, and the ADA Objection

  This is where the conceptual friction is highest.

  **The Weights in Harsanyi:**
  The theorem concludes $W = \sum a_i U_i$. The weights $a_i$ are arbitrary non-negative constants. Harsanyi's Veil of Ignorance argument is used to justify setting all $a_i = 1$ (equal weight per person) based on the assumption that behind the veil, you have an equal probability of being anyone.

  **The Weights in Oregon:**
  Oregon effectively set the weight per *QALY* to 1, regardless of who received it.
  *   **Harsanyi:** Equal weight per *person*.
  *   **Oregon:** Equal weight per *unit of health*.
  These are different. If a disabled person has a lower ceiling for health improvement, giving equal weight to QALYs results in lower total weight for that *person* compared to a non-disabled person.

  **The ADA Objection:**
  The Department of Health and Human Services argued the ranking violated the ADA by valuing disabled lives less.
  1.  **Objection to Weights?** If the objection is "you must weight a disabled person's utility higher to compensate for disadvantage," that is a **Prioritarian** view, not Harsanyi's Utilitarianism. Harsanyi (with equal weights) is silent on compensation; he only cares about the sum.
  2.  **Objection to Scale?** If the objection is "QALYs are a biased metric that underestimate the welfare gain for disabled people," then Oregon used the wrong $U_i$. Harsanyi would agree: if $U_i$ is mismeasured, the sum is wrong.
  3.  **Rights Constraints:** The ADA argument is largely deontological: "You cannot discriminate based on disability status," regardless of the welfare sum. Harsanyi's framework has **no vocabulary for side-constraints**. It cannot represent a rule that says "Maximize the sum, *unless* it violates rights."

  **Veil of Ignorance Applicability:**
  Does Harsanyi's route to equal weights apply here? Harsanyi's Veil is **ex-ante** (before you know your identity). Oregon was making an **ex-post** decision for an existing population with known disabilities.
  *   Behind the veil, you might agree to maximize QALYs to ensure efficient resource use for your potential future self.
  *   Facing the actual list, identified disabled groups see they are systematically deprioritized.
  The shift from ex-ante insurance logic to ex-post allocation logic breaks the Veil's moral force. The theorem does not bridge this gap.

  ### 5. Institutional Bite: Decorative or Explicit?

  Does this case make the theorem look useful or decorative?

  **Argument for "Explicit" (Useful):**
  The theorem successfully exposes that Cost-Effectiveness Analysis (CEA) *is* Utilitarianism. Oregon tried to present the list as "scientific" and "neutral." Harsanyi shows it is inherently normative: it commits you to (1) cardinal comparability of health, (2) additive aggregation, and (3) indifference to distribution (except via the sum). The "embarrassing orderings" were not bugs; they were the logical output of the SWF Oregon implicitly chose. The theorem forces the institution to own the utilitarianism it is practicing.

  **Argument for "Decorative" (Limited):**
  The hard political choices happened *outside* the theorem's scope.
  1.  **Metric Selection:** Deciding to use QALYs instead of Welfare or Need was a prior normative choice. The theorem takes $U_i$ as given.
  2.  **Budget Level:** The theorem takes the budget constraint as given. It doesn't tell you how much to spend on Medicaid vs. education.
  3.  **Rights:** The ADA objection stopped the plan. The theorem could not predict or resolve this because it lacks rights-constraints.
  In this sense, the theorem is decorative. It describes the engine, but the steering (rights, metrics, budget) is handled by other moral frameworks.

  **Verdict:** The theorem is a **spotlight**, not a **guide**. It illuminates the normative commitments of the technocratic practice (CEA), revealing that "efficiency" is just "utilitarianism" in disguise. But it offers no resources to resolve the conflicts that arise when utilitarianism clashes with rights or equity concerns.

  ### 6. Comparison with Alternative Frameworks

  If Oregon had used a different aggregation rule, would it have avoided the ADA objection, and can Harsanyi represent it?

  **A. Rawlsian (Maximin):**
  *   **Rule:** Maximize the welfare of the worst-off individual (or group).
  *   **Oregon Application:** Prioritize treatments for those with the severest conditions, regardless of cost-effectiveness.
  *   **ADA Objection:** Likely avoided. The disabled (often the worst-off) would be prioritized.
  *   **Harsanyi Representation:** **No.** Harsanyi's theorem proves the SWF must be a *weighted sum*. Maximin is non-linear and lexicographical. It violates the Pareto principle in some formulations (if the worst-off are unaffected, Maximin is indifferent even if others gain massively) and definitely violates the independence/continuity required for the sum. The theorem explicitly rules this out.

  **B. Sufficientarianism:**
  *   **Rule:** Ensure everyone reaches a sufficient threshold of health; maximize above that only if resources remain.
  *   **Oregon Application:** Fund all treatments necessary to reach a "basic health floor," then use CEA for the rest.
  *   **ADA Objection:** Likely avoided, as the floor protects those with high needs/low ceilings.
  *   **Harsanyi Representation:** **No.** This requires a threshold function, not a linear sum. The theorem is silent here.

  **C. Eligibility Breadth vs. Benefit Depth:**
  *   **Rule:** Trade off covering more people (shallow benefits) vs. fewer people (deep benefits).
  *   **Harsanyi Representation:** **Yes.** If individual utility functions $U_i$ are defined over the policy parameters (e.g., probability of coverage $\times$ depth of coverage), the theorem can aggregate these preferences.
  *   **ADA Objection:** Not necessarily avoided. If the sum is maximized by excluding a small, expensive disabled group to cover a large, cheap non-disabled group, Utilitarianism still excludes the disabled.

  ### Summary

  Your skepticism is warranted. Harsanyi's Aggregation Theorem provides a rigorous justification for Utilitarianism *if* you accept vNM rationality and Pareto. But in the Oregon case:
  1.  **Determinism:** The lack of lotteries undermines the cardinality required for the weighted sum conclusion.
  2.  **Metric:** QALYs are not welfare utilities, violating the input requirement.
  3.  **Rights:** The ADA objection highlights a class of moral constraints (deontological/rights-based) that the theorem's vocabulary cannot capture.

  The theorem is not "wrong," but its **institutional bite** is limited to exposing the normative structure of technocratic efficiency metrics. It tells you *what* you are doing (summing utilities), but it cannot tell you *whether* you should be doing it when it conflicts with rights, nor can it guide you when the choices are deterministic rather than risky. It is a map of the utilitarian terrain, but Oregon needed a compass that pointed to justice, not just efficiency.
