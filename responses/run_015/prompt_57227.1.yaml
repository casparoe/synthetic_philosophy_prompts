answer: |-
  I assign a 45% credence to this, based on the convergence of cultural evolution theory and computational social science literature since 2005.

  - **What makes a meme:** I'd bet 70% on successful reconstruction (functional stability despite surface variation), 20% on the grab bag (no unified mechanism), and 10% on near-perfect copying. The reconstruction view wins because it aligns with "cognitive attractors"—ideas snap back to a stable shape even after being distorted, which mimics replication without requiring high-fidelity copying. Digital artifacts are the only domain where the 10% copying option holds significant weight.

  - **"Better prediction" meaning:** It is rigged if you demand individual-level accuracy, but meaningful if you measure population-level frequency distributions over time. Evolutionary models excel at predicting the *shape* of adoption curves and the survival rates of variants across a group, whereas cognitive models better predict *who* adopts *what* and why. If "better" means forecasting which of two competing variants will dominate a market or ecosystem without knowing the psychological details of the adopters, the replicator model often wins on parsimony.

  - **Evidence on the table:** It is mixed and domain-specific. Phylogenetic analyses of folktales (e.g., Tehrani et al.) show tree-like structures consistent with replication and selection over centuries, contradicting the idea that oral tradition is purely reconstructive noise. Conversely, laboratory chain experiments (e.g., Bartlett-style) show rapid distortion consistent with reconstruction. The evidence suggests high-fidelity replication emerges when social norms or technologies enforce it (rituals, digital files), while reconstruction dominates in low-stakes casual transmission.

  My number is most sensitive to the **evidence** sub-question. To move my credence up by 15 points, I would need to see a preregistered forecasting tournament where a reconstructive-memetic model consistently outperforms a pure cognitive-epidemiological model on novel cultural trends (like meme formats or slang) over a 12-month horizon.
