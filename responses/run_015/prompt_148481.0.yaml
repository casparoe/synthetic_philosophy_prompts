answer: |-
  The 1857 Supreme Court decision in *Dred Scott v. Sandford* stands as the starkest collision between two competing hermeneutics of the American founding. On one side stood Chief Justice Roger Taney, articulating a jurisprudence grounded in historical intention, colonial practice, and the racial prejudices of the framing generation. On the other stood the interpretive theory of Frederick Douglass, who argued by the 1850s that the Constitution, when read strictly by its text and underlying universal principles, was a "glorious liberty document" fundamentally incompatible with slavery. Analyzing *Dred Scott* through Douglass's lens reveals the decision as a quintessential example of the "slaveholder interpretation" Douglass sought to dismantle. However, the episode also tests the limits of Douglass's theory, exposing the vulnerability of moral textualism when faced with an ideologically captured judiciary and raising difficult questions about the relationship between legal authority and moral truth.

  **Taney's Ruling as Intentionalist Hermeneutics**

  Chief Justice Taney's opinion in *Dred Scott* maps almost perfectly onto the interpretive framework Douglass rejected. Douglass argued that pro-slavery constitutionalism relied on looking *behind* the text to the secret intentions, compromises, and racial assumptions of the framers, rather than looking *at* the text itself. Taney's reasoning was explicitly backward-looking. To determine whether African Americans could be citizens, Taney did not analyze the Citizenship Clause in isolation; instead, he conducted a historical survey of racial attitudes in 1787. He concluded that because Black people were "regarded as beings of an inferior order" at the time of the framing, they could not be part of the "people of the United States" intended by the Constitution.

  This is the essence of the intentionalist fallacy Douglass identified: allowing the prejudices of the past to dictate the rights of the present. Furthermore, Taney's invalidation of the Missouri Compromise relied on the premise that enslaved persons were constitutionally protected property. He reasoned that because the framers recognized slavery in the states and permitted the slave trade for a limited time, the right to hold human property was a legitimate interest protected by the Fifth Amendment. By treating the silence of the Constitution regarding the word "slave" as a tacit acknowledgment of property rights based on colonial practice, Taney elevated historical custom over textual explicitness. In Douglass's framework, Taney did not interpret the Constitution; he interpreted the slaveholding society that surrounded it, projecting that society's values onto the document.

  **Douglass's Textual-Principled Rebuttal**

  When viewed through Douglass's theoretical framework, Taney's specific legal moves appear not as neutral jurisprudence but as category errors resulting from a corrupted hermeneutic. Douglass's theory posits that the Constitution creates a government of delegated powers, and since no power to establish slavery is explicitly granted, the default status of all persons within its jurisdiction is liberty.

  Regarding citizenship, Douglass's textualism offers a direct rebuttal to Taney's historical exclusion. Douglass argued that the Constitution establishes a national citizenship distinct from state citizenship. The text refers to "people of the United States" and guarantees rights to "persons," not to races. For Douglass, the Preamble's commitment to "secure the Blessings of Liberty to ourselves and our Posterity" establishes a universal principle that overrides state-level racial restrictions. Taney's claim that Black people were permanently alienated from the body politic is, in Douglass's view, a fabrication unsupported by the text, which contains no racial qualifications for citizenship. Douglass would argue that Taney conflated the *practice* of exclusion with the *law* of inclusion.

  The most complex challenge is Taney's Fifth Amendment reasoning. Taney argued that prohibiting slavery in the territories deprived slaveholders of property without due process. Douglass's theory must address whether this is a valid textual reading or a fundamental misreading. Douglass would contend that the Fifth Amendment protects "property," but the Constitution nowhere defines human beings as property. To accept Taney's premise is to accept the pro-slavery definition of man as a thing. Douglass's hermeneutic insists that the text must be read in light of the Declaration of Independence's principle that all men are created equal. Therefore, a human being cannot be "property" in the constitutional sense. Consequently, liberating an enslaved person is not a deprivation of property requiring due process; it is the recognition of a personhood that the Constitution already protects. Douglass does not need to treat the Fifth Amendment as corrupted or inoperative; rather, he treats Taney's application of it as a logical absurdity. One cannot have a due process right to own a human being because the Constitution's textual commitment to "Justice" and "Liberty" precludes the legal existence of human property.

  However, this rebuttal risks collapsing into the opposing framework if it relies too heavily on external moral principles (like the Declaration) rather than the Constitution itself. To remain coherent, Douglass must argue that the principles of liberty are *internal* to the Constitution's text (via the Preamble and the Guarantee Clause), not just external moral add-ons. If he relies solely on natural law, he concedes that the Constitution itself is neutral or pro-slavery. Douglass navigates this by insisting the text *is* the vehicle for these principles, and Taney's error was ignoring the text's silence on slavery in favor of extra-constitutional customs.

  **The Theory Under Stress: Judicial Power and Reconstruction**

  The *Dred Scott* decision tests the practical efficacy of Douglass's theory. Douglass believed that a correct interpretation of the Constitution could serve as a weapon against slavery. Yet, *Dred Scott* demonstrates that a purely textual anti-slavery reading cannot constrain a judiciary ideologically captured by the opposing hermeneutic. The Supreme Court possessed the institutional authority to declare what the law *was*, regardless of what the text *meant* in Douglass's moral framework. This reveals a limitation in Douglass's theory: it assumes that the authority of the Constitution resides in its moral truth, whereas in political reality, authority resides in the power to enforce interpretation. Douglass's framework explains why the decision was *wrong*, but it could not explain how to make it *void* without political force.

  This tension informs how Douglass viewed the subsequent Reconstruction Amendments. A strict textualist might argue that the Thirteenth, Fourteenth, and Fifteenth Amendments fundamentally altered the Constitution, correcting its original flaws. Douglass, however, largely maintained that these amendments did not change the soul of the document but rather removed the pro-slavery gloss that had obscured it. On Douglass's view, the Fourteenth Amendment's citizenship clause did not create a new right for Black Americans but finally codified the original, intended meaning of the Constitution that Taney had suppressed. The amendments were less a correction of a flawed text and more a confirmation of the anti-slavery meaning that had been present but unenforced. They shifted the burden of proof, making the textual silence on race explicit, thereby closing the loophole Taney had exploited.

  **Limits, Silences, and Hermeneutic Circularity**

  Despite its moral power, Douglass's theory exhibits strains when confronted with the institutional realities of the *Dred Scott* crisis. First, the theory is somewhat silent on the problem of institutional authority. Douglass argued that the Court's decision was binding on the parties but not on the political conscience of the nation. While this allowed for continued agitation, it created a paradox: if the Constitution is the supreme law, and the Supreme Court is the final interpreter, how can a citizen legitimately hold a constitutional view contrary to the Court without undermining the rule of law? Douglass's theory relies on a higher allegiance to the "true" Constitution over the "court's" Constitution, but it lacks a procedural mechanism to resolve this conflict other than revolution or amendment.

  Second, the episode highlights the problem of hermeneutic circularity. Taney argued that historical practice (slavery existed at the founding) proves textual meaning (the Constitution protects slavery). Douglass argued that textual meaning (liberty is the default) should dictate historical practice (slavery must end). *Dred Scott* demonstrates that in a legal system, historical practice often holds priority over abstract textual meaning because practice creates the precedents that judges rely upon. Douglass's theory struggles to resolve this circle because it demands that text trump practice, yet the legal system is built on the accumulation of practice (precedent).

  Finally, Douglass's framework explains the moral outrage of the decision well but is less effective at explaining the political path to Civil War. The war was not won by better constitutional interpretation but by military force. Douglass's theory illuminates the *justification* for the Union cause—that it was a fight to vindicate the true Constitution—but it cannot fully account for the necessity of suspending that very Constitution (via habeas corpus suspension, emancipation as war measure) to save it.

  **Conclusion**

  Viewing *Dred Scott* through Frederick Douglass's interpretive theory clarifies the decision as a triumph of pro-slavery intentionalism over anti-slavery textualism. Taney's ruling validates Douglass's critique that looking to the framers' prejudices rather than the document's principles leads to unjust outcomes. Douglass's framework successfully rebuts Taney's specific moves by denying the constitutional category of "human property" and asserting a national citizenship based on text rather than race. However, the decision also exposes the limits of Douglass's theory. It reveals that a moral reading of the text is insufficient without the political power to enforce it against a captured judiciary. The Reconstruction Amendments, on Douglass's view, served to align the legal text with the moral reality he had long championed, confirming that the Constitution's true meaning had been suppressed, not absent. Ultimately, *Dred Scott* shows that while Douglass's hermeneutics could diagnose the disease of American jurisprudence, the cure required forces beyond interpretation alone.
