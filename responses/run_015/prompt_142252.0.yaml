answer: |-
  **Working Space: Candidate Reconstructions**

  1.  **Wittgensteinian Hinge Epistemology:** The propositions function as "hinges" (OC §341). They are not known but stand fast, forming the scaffold for inquiry. Doubt requires grounds, so hinges cannot be doubted without dismantling the language game. This fits the "load-bearing default" perfectly.
  2.  **Pragmatic Contextualism:** Justification standards shift based on practical costs. In court, proving a week has seven days is too costly relative to utility. This is compatible with the practice but treats the exemption as economic rather than logical. It explains *why* we skip proof, but not *why* demanding proof is treated as nonsense.
  3.  **Classical Foundationalism (Rejected):** This view holds that basic beliefs are self-evident or incorrigible. I reject this because your description emphasizes revisability (contaminated standards, expert testimony overturning common sense). Foundationalism cannot accommodate a "basic" belief that turns out to be false without collapsing. The hinge model handles revisability because hinges are not truths, but rules of the game that can change.

  ***

  **The Epistemology of the Load-Bearing Default**

  Your distinction between a working assumption and a load-bearing default does not collapse; it maps precisely onto the distinction between an empirical proposition and a hinge proposition. In your lab, the standard was not a hypothesis you tested; it was the metric by which testing occurred. Similarly, judicial notice does not exempt facts because they are obviously true, but because they are the background against which truth is adjudicated.

  For this practice to make sense, doubt must be local rather than global. A doubt requires grounds, and those grounds must themselves be exempt from doubt in that specific context. If every proposition required evidence admitted in the case, you would face an infinite regress or a circular argument. The system presupposes that justification is arborescent: it branches out from a trunk that is not itself a branch. Therefore, knowledge is not a uniform state applied to all beliefs; it is a status earned within a system that itself rests on unproven provers.

  This arrangement quietly rules out Classical Foundationalism, as noted, because foundationalism demands immutability for basic beliefs. Your standards are revisable, which suggests they are not metaphysically basic but functionally indispensable. It also rules out Infinitism, which claims justification never stops; your practice explicitly stops the regress. However, the practice is compatible with Contextualism and Reliabilism, though these theories do not fully explain the *logic* of the exemption. A contextualist can say the standards shifted, and a reliabilist can say the processes are generally trustworthy. But neither explains why a litigant challenging a hinge is not answered with better evidence but is treated as failing to raise a real question. Only the hinge picture explains the *prohibition* on doubt itself. The practice presupposes that some propositions must stand fast for others to be meaningful; rival theories merely accommodate this as a pragmatic shortcut.

  If the hinge picture were replaced—specifically, if you adopted your "zero-exemption rule"—the system would not just become inefficient; it would collapse into paralysis. To prove the validity of a marriage, you would need to prove the validity of the laws under which it was contracted, which would require proving the legitimacy of the legislature, and so on. The collapse shows that the hinge picture is unavoidable in practice, but we must be careful about what "unavoidable" means. It does not show that the hinges are metaphysically true (the week might not have seven days in some future reckoning). It shows that they are conditions of sense. A jurisdiction without hinges would not be a stricter court; it would not be a court at all, because it could not formulate a verdict without relying on some unstated norm.

  Finally, is your calibration chain the same phenomenon as judicial notice? Structurally, yes; ontologically, no. Both function as regress-stoppers that are unquestioned in ordinary practice but revisable under specific conditions of trouble. In the lab, the hinge is often artifactual (a physical standard); in court, it is conceptual or social (sanity, calendar regularity). The analogy holds where it matters: both reveal that certainty is not a property of the proposition itself but of its role in the system. When your standard was contaminated, it ceased to function as a hinge and became an empirical variable to be measured. Similarly, when a court allows expert testimony to overturn a common-sense assumption, that proposition has moved from the riverbed of the practice into the flow of the water.

  The insight you bring from the lab is vital. Philosophers often treat hinges as abstract logical necessities. You show they are working tools. They are not true because they are immune to error; they are immune to error because they are treated as true, until the practice itself forces a revision. This is not a weakness in the system; it is the only way a system of justification can touch the world.
