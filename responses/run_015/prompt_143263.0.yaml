answer: |-
  You are correct to suspect equivocation. The slogan "it is better never to have been" shifts its logical subject and temporal standpoint depending on whether the arguer is discussing the *decision to procreate* or the *value of an existing life*.

  Here is a menu of the four distinct philosophical readings of that claim, analyzed by your criteria.

  ### 1. The Prospective Non-Identity Claim
  *   **Core Claim:** For any potential person $P$, the state of affairs where $P$ never exists is preferable (for $P$) to the state of affairs where $P$ comes into existence.
  *   **Context Invoked:** The general claim that procreation is always wrong.
  *   **Type of Claim:** Substantive normative claim about **potential people**. It compares two possible worlds: one where $P$ exists and one where $P$ does not, evaluated from a standpoint *before* $P$ exists.
  *   **Depends on Benatar's Asymmetry?** **Yes, critically.** This reading relies on the premise that the absence of pain is "good" even if there is no one to experience that good, while the absence of pleasure is "not bad" unless there is someone deprived of it. Without this asymmetry, standard utilitarianism might say existence is good if pleasure > pain.
  *   **Verdict:** **Defensible within its own axioms, but controversial.** It is logically coherent if you accept the Asymmetry. However, it violates the "Person-Affecting View" (the intuition that an outcome can only be better or worse if it is better or worse *for someone*). Since the non-existent person isn't harmed by not existing, claiming non-existence is "better for them" requires a specific metaphysical account of "interests" that exist prior to existence.

  ### 2. The Retrospective Counterfactual Claim
  *   **Core Claim:** For an actual, existing person $P$ (like your sister), the state of affairs where $P$ never existed would have been preferable (for $P$) to their actual life, even if $P$ currently reports happiness.
  *   **Context Invoked:** The comment about your sister ("it is better she never had been").
  *   **Type of Claim:** Substantive normative claim about **actual people**. It attempts a comparative evaluation of an existing subject's life against their own non-existence *after the fact*.
  *   **Depends on Benatar's Asymmetry?** **Yes.** To claim a happy life is still a net harm, one must argue that the "good" of their pleasure is outweighed by the "bad" of their pain, or that the mere presence of *any* harm makes existence a net negative compared to the "perfect" zero of non-existence.
  *   **Verdict:** **Clearly false / Incoherent (on standard welfare views).** This is the weakest link. If your sister reports she is glad to exist, claiming it is "better for her" to not exist contradicts her own testimony about her welfare. It requires asserting that the subject is mistaken about their own good based on an external theoretical framework. It creates a paradox: you are claiming to know what is better for her than she does, by comparing her life to a state (non-existence) she cannot experience or prefer.

  ### 3. The Impersonal Value Claim
  *   **Core Claim:** A world with fewer sentient beings is impersonally better than a world with more sentient beings, regardless of whether the specific beings who exist are happy.
  *   **Context Invoked:** Often used as a backup when the "better for *them*" argument fails. It shifts from "better for the person" to "better *simpliciter*."
  *   **Type of Claim:** Substantive normative claim about **states of the world**. It is not about harm to individuals, but about the total moral value of the universe.
  *   **Depends on Benatar's Asymmetry?** **No.** This can be derived from negative utilitarianism (minimize suffering) without needing Benatar's specific asymmetry regarding pleasure.
  *   **Verdict:** **Defensible but distinct from Antinatalism proper.** This is a coherent ethical position (e.g., Negative Utilitarianism), but it abandons the claim that non-existence is better *for the individual*. If the poster uses this to justify telling your sister it's better she wasn't born, they are committing a category error: what is good for the "universe" is not necessarily good for the "sister."

  ### 4. The Trivial Safety Claim
  *   **Core Claim:** Non-existence guarantees the absence of harm, whereas existence guarantees the presence of some harm. Therefore, non-existence is the "safer" option.
  *   **Context Invoked:** Used to make the slogan sound like common sense ("You can't be hurt if you don't exist").
  *   **Type of Claim:** **Trivial / Tautological.** It defines "better" strictly as "absence of risk."
  *   **Depends on Benatar's Asymmetry?** **No.** This is just risk assessment.
  *   **Verdict:** **True but useless.** It is trivially true that a non-existent being suffers no pain. However, it is also trivially true that a non-existent being enjoys no pleasure. To move from "non-existence is safer" to "you ought not procreate" requires the substantive claim that avoiding pain is morally more urgent than providing pleasure (which loops back to Reading 1). If used as a knockout punch on its own, it is a bait-and-switch.

  ### Diagnosis of the Forum Poster's Equivocation

  The poster is sliding between **Reading 1** and **Reading 2** without flagging the shift.

  1.  **When discussing Procreation:** They are using **Reading 1 (Prospective)**. This is the only version where the argument holds water. They are arguing about the *decision point* before the person exists.
  2.  **When discussing your Sister:** They are using **Reading 2 (Retrospective)**. This is where the argument breaks. They are applying a prospective risk assessment to a retrospective reality.

  **The Verdict on the Shift:**
  They are treating the "Better Never to Have Been" slogan as a timeless property of the person, when it is actually a property of the *choice to create the person*.
  *   **Before birth:** The claim is "It is better for the potential person if we do not create them." (Reading 1: Defensible if you accept the Asymmetry).
  *   **After birth:** The claim becomes "It is better for this existing person if they had not been created." (Reading 2: False/Incoherent, as it overrides the subject's actual welfare reports).

  By using the same slogan for both, they imply that your sister's current happiness is irrelevant to the truth of the claim. This allows them to bypass the burden of proving her life is objectively bad, relying instead on the metaphysical claim that *any* life is worse than *no* life. You can point out that Reading 1 justifies not starting the game, but Reading 2 insults the players currently winning it.
