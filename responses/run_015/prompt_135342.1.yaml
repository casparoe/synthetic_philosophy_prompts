  **FROM:** [Your Name], Committee Member
  **DATE:** 15 February 2024
  **SUBJECT:** Decision on Acquisition and Management of Adjacent Arable Field

  I recommend we submit a bid for the thirty-hectare arable field with the specific intention of restoring it to wet grassland and shallow pools. We must authorize the fundraising team to proceed immediately and establish a monitoring regime to review this decision based on population density data within five years.

  We have heard a serious ethical challenge regarding this acquisition, and it deserves to be stated clearly. The argument is that wetland creation manufactures life on an industrial scale. A healthy wetland generates massive numbers of invertebrates, amphibians, and small mammals annually. In the wild, the overwhelming majority of these individuals die within weeks or months, often through predation, starvation, or exposure. If these lives contain more suffering than pleasure, then creating the habitat actively increases the total amount of suffering in the world. Letting the developer build prevents these lives from ever starting. This is not a dismissal of wildlife value; it is a calculation of net welfare. If our goal is to minimize harm rather than maximize biodiversity, leaving the field as concrete is logically consistent.

  However, this argument relies on a specific biological assumption: that removing this habitat does not reduce the total number of lives started, but merely displaces them. This is where the biology must guide the ethics. Populations are generally regulated by carrying capacity—the amount of space and food available—not just by weather events. While a hard winter kills many animals regardless of habitat size, the number of animals surviving to breed the next spring is set by how much room there is. If we remove thirty hectares of wetland, we lower the ceiling on the population. We do not just rearrange where deaths happen; we reduce the total number of births occurring year after year. The "prevented lives" argument collapses if the habitat is the limiting factor. My forty years of counting organisms suggests habitat is almost always the limit. Therefore, removing the land prevents the existence of those populations entirely, which validates the welfare concern only if non-existence is preferable to existence.

  There is a middle option proposed: buy the field but manage it as closed scrub or woodland. The theory is that mature woodland has lower turnover than wetland, starting fewer lives per hectare. Is this coherent? Biologically, yes; scrub supports fewer breeding cycles and lower densities than productive wetland. Ethically, it reduces the "suffering factory" effect. However, we must be honest about why this is being suggested. It risks being a compromise born of discomfort rather than strategy. It attempts to satisfy the welfare argument without fully accepting the consequences of either position. If we are a conservation trust, our mission is to protect specific habitats and species, many of which require open wetland. Managing for scrub to minimize population turnover dilutes our core purpose. It is a coherent welfare strategy, but an incoherent conservation strategy.

  Therefore, we should proceed with the wetland restoration, but we must treat this as a living decision. We cannot assume we are right about the density dependence without checking.

  **Action Plan:**

  1.  **Bid Submission:** We will authorize the bid by 31 March 2024. Funding will be sought from the Heritage Lottery and local grants.
  2.  **Management Regime:** Upon acquisition, restoration works will begin September 2024. We will create shallow scrapes and wet grassland, avoiding deep permanent water where possible to manage specific risk profiles.
  3.  **Measurement:** We will establish ten permanent transects across the new site. We will measure invertebrate biomass and vertebrate breeding density annually each June, starting 2025. Crucially, we will correlate these numbers against winter severity and spring rainfall to determine if populations are habitat-limited or weather-limited.
  4.  **Review Trigger:** We will revisit this decision at the March 2029 committee meeting. If data shows that population sizes are driven entirely by weather events regardless of habitat size, we will reconvene a working group to consider changing the management regime to scrub.

  This approach respects the welfare argument by taking it seriously enough to measure its premises, while fulfilling our trust's mandate to restore lost habitats. We acknowledge the harshness of nature, but we also acknowledge that removing the stage does not necessarily stop the play if the actors are driven by forces beyond our fence. We must act on the best available biological evidence, which currently supports habitat limitation.

  **Decision:** Bid for wetland. Monitor density. Review in five years.
