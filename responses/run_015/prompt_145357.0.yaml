answer: |-
  Subject: Thoughts on internalism and cooperative obligations

  Hi there

  I have been turning over this problem regarding the open-source maintainer and the specific challenge it poses to internalism about practical reasons, and it is a genuinely thorny bit of philosophy that cuts right to the heart of the Williams debate. You asked for a specific credence that internalism is false specifically because of these structural obligations, and after weighing the various components you outlined, I find myself settling on a figure of 0.68. To explain how I arrived at that number, I need to walk through the four sub-questions you posed, as they form the evidential basis for the conclusion. First, regarding the probability that cooperative structures genuinely generate obligations independent of the agent's motivational set, I am quite persuaded by the phenomenology of shared agency here, so I would place that probability at around 0.75. When one joins a collective like an open-source maintenance group, the obligations seem to attach to the role itself rather than contingent desires, much like promising creates a reason to perform regardless of whether one still wants to keep the promise.

  Moving to the second component, we must consider the chance that internalists can absorb these as derived reasons without collapsing into externalism, and here I am more sceptical, assigning only a 0.4 probability that they can pull this off successfully. The internalist strategy usually involves claiming that joining the practice implies a higher-order desire or a disposition to care, but in your case, the agent has no existing project benefiting from the patch and no current desire to do it, which stretches the notion of the subjective motivational set until it risks becoming vacuous. The third element concerns the circularity you mentioned, specifically the chance that this requirement to accept institutional norms to recognise obligations is fatal rather than just a learning curve, and I assess this at 0.6. If the agent must already accept the norm to see the reason, it suggests the norm is ontologically prior to the motivation, which undermines the internalist claim that reasons are grounded in the motivation itself. Finally, there is the chance that the best resolution is a hybrid where reasons stay internal but get activated by institutional recognition, which I think is unlikely to save internalism proper, giving it only a 0.3 probability of success, meaning there is a 0.7 chance it fails to preserve the core internalist thesis.

  Combining these into the overall figure requires treating them as weighted evidence rather than a strict conjunction, since they overlap significantly. If we take the average of the probabilities that support the falsity of internalism across these four dimensions, weighting the first question about independent obligations most heavily because it is the foundational claim, we arrive at that 0.68 credence. It is more likely than not that internalism fails here, but it is not a slam dunk because sophisticated internalists have plenty of moves left to play regarding deliberative routes and normative powers. The sub-question that is doing the heavy lifting here is undoubtedly the first one concerning whether cooperative structures generate obligations independent of the motivational set, because if that probability drops below 0.5, the whole case for externalism in this context collapses regardless of the circularity or hybrid options. If the obligations are just complex desires, internalism survives.

  The argument or case that would shift my number the most would be a robust defence of normative powers from an internalist perspective, perhaps drawing on the work of philosophers like Michael Bratman or Scott Shapiro, showing that the acceptance of the role itself constitutes a change in the motivational set that is not circular but constitutive. If it could be shown that the act of joining the collective literally rewires the subjective motivational set in a way that is internally accessible without presupposing the obligation, my credence that internalism is false would drop significantly, perhaps down to 0.4. Until then, the intuition that the maintainer ought to patch the vulnerability simply because it is her role, even if she couldn't care less, remains a powerful counterexample to the idea that all reasons must hook onto prior desires. I hope this breakdown helps clarify where I stand on the matter, and feel free to push back on the weighting if you think I have been too harsh on the internalist capacity for absorption.

  Best wishes

  Alex
