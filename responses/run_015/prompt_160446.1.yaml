answer: |-
  I must confess that in this instance, the action is not justified, though not for the reasons your traditionalist friends suppose. The liberty I defend is not a license to act upon every melancholy whim, but a release from life when it becomes, in reality, a burden too heavy to bear. In your case, the woman's judgment is not a rational assessment of misery but the mechanical effect of a disorder upon her spirits, suppressing those natural passions which ordinarily render existence agreeable. Since the misery is not inherent to her condition but arises from a curable fault in the animal economy, the foundation for suicide—that life is no longer a good—is absent in fact, however present it seems in feeling. What makes life worth keeping here is not a duty to God, who is untouched by such events, but the capacity for future satisfaction rooted in her natural constitution, which the disorder obscures but does not destroy. Thus, while she commits no crime against the universe, she acts contrary to her own interest, mistaking a temporary clouding of the sentiments for a permanent verdict on the value of being.
