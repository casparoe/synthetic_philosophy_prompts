      *   So, Hume can say: It is not permissible (or rather, it is folly/imprudent) because the condition for permissible suicide (life being a burden) is not met in reality, only in delusion.
      *   What makes life worth keeping? The *potential* for happiness grounded in the natural constitution, which the disorder suppresses.
      *   Hume would focus on the *cause* of the desire to die. If it arises from a disorder that distorts the natural sentiments (like self-love), it lacks the justification of unavoidable misery.

