      *   Break down the two counterexamples (Beliefs vs. Rewards, Single vs. Multi-agent).
      *   Address the $\beta$ question (No, it's structural).
      *   Suggest "Cooperative IRL" or "Assistance Games" as the theoretical fix.
      *   Conclude on the "Behavior doesn't lie" slogan (It doesn't lie, but it doesn't tell the whole truth).

