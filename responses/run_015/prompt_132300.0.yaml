prompt: |-
  I'm helping organize an interdisciplinary seminar on institutional culture, and two colleagues—both well-read in sociology but with opposing instincts—got stuck in a sustained disagreement about whether societies and the institutions within them should favor tight or loose norms around rule-following. They used a concrete case: a university debate society rewriting its charter. I wasn't able to referee them satisfactorily, and I'd like a careful point-by-point adjudication of the arguments exactly as they unfolded.

  Elias argued for a tight charter: explicit, enforceable rules for speaking turns, mandatory disclosure of conflicts of interest, and a zero-tolerance policy for ad hominem remarks, on the grounds that loose norms systematically favor people with high social capital who can navigate ambiguity, while those with less cultural capital self-censor because they never know which unwritten rules apply to them. Mira argued for a loose charter: broad principles of respect and good faith, with enforcement left to peer judgment, on the grounds that codifying everything produces what she called normative fatigue—the constant interpretive labor of deciding whether a particular remark technically violates a clause exhausts participants and drives away anyone who isn't fluent in bureaucratic language. Their exchange then moved through four rounds. (1) Elias said that normative fatigue is just a cost of doing business, and that loose societies confuse procedural neutrality with substantive fairness—marginalized participants are precisely those who suffer from invisible norms. (2) Mira replied that Elias's tight charter creates what she called rule shadow: bad behavior doesn't disappear but migrates into spaces the rules can't reach—pre-debate lobbying, social ostracism, or strategic weaponization of the rules themselves to silence opponents—making it harder to identify and correct. (3) Elias countered that rule shadow is an empirical claim, not a conceptual one, and that in the societies for which we have comparative data—high-trust Scandinavian institutions versus low-trust ones—tight procedural rules correlate with higher participation by marginalized groups, not lower. (4) Mira responded that Elias was smuggling in a false dichotomy: she wasn't arguing for no rules, but for normative elasticity—rules designed as adjustable defaults rather than binary prohibitions—so they adapt to context without collapsing into pure discretion. She added that Elias's reliance on correlation data actually proves her point: if tight rules work only in high-trust societies, then demanding them everywhere is like prescribing a medicine that works only for the healthy.

  Please go through these four moves one by one, rating each from clearly mistaken to clearly right and briefly justifying the rating. Then say who is more right overall, and identify what both are missing—particularly whether there is a coherent middle position between Elias's procedural rigidity and Mira's normative elasticity, or whether the two positions actually share an unstated assumption that makes their disagreement narrower than it looks. Be specific: don't just say it depends on context, but say exactly which conceptual distinction (for example, between coordination rules and status rules) does the work, and whether either speaker actually addresses the other side's strongest point rather than a weaker version of it.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a four-round debate between two colleagues (Elias and Mira) regarding institutional norms (tight vs. loose) in the context of a university debate society charter.
      *   **Format:** Point-by-point rating (Clearly Mistaken to Clearly Right) with justification for each of the four moves. Then, an overall verdict (who is more right), and an identification of what both are missing (specifically looking for a middle position or shared assumptions).
      *   **Constraints:** Be specific. Avoid vague "it depends" answers. Identify specific conceptual distinctions (e.g., coordination vs. status rules). Evaluate whether they address the strongest version of the opponent's argument (steel-manning vs. straw-manning).
      *   **Context:** Interdisciplinary seminar on institutional culture. Audience is well-read in sociology.

  2.  **Deconstruct the Debate:**
      *   **Core Issue:** Tight norms (explicit, enforceable rules) vs. Loose norms (broad principles, peer judgment).
      *   **Elias's Stance:** Tight charter. Protects low cultural capital participants from invisible norms. Fairness requires explicitness.
      *   **Mira's Stance:** Loose charter (Normative Elasticity). Avoids normative fatigue and rule shadow. Rules should be adjustable defaults.
      *   **Round 1 (Elias):** Normative fatigue is a necessary cost. Loose norms confuse procedural neutrality with substantive fairness (invisible norms hurt marginalized).
      *   **Round 2 (Mira):** Tight charters create "rule shadow" (bad behavior migrates to unregulated spaces or weaponizes rules). Harder to correct.
      *   **Round 3 (Elias):** Rule shadow is empirical. Comparative data (Scandinavia vs. others) shows tight rules + high trust = higher marginalized participation.
      *   **Round 4 (Mira):** False dichotomy. Argues for "normative elasticity" (adjustable defaults), not no rules. Elias's data relies on high-trust contexts (medicine for the healthy), implying tight rules fail in low-trust contexts.

  3.  **Evaluate Each Move (Drafting Ratings & Justifications):**

      *   **Round 1 (Elias):** *Claim:* Normative fatigue is a necessary cost; loose norms hide bias against marginalized groups.
          *   *Analysis:* Strong sociological grounding (Bourdieu-esque cultural capital). However, dismissing fatigue as just a "cost" ignores the exclusionary effect of that cost. If the cost is too high, participation drops.
          *   *Rating:* Mostly Right, but slightly overstated.
          *   *Refinement:* Let's call it "Substantially Right." The core insight about invisible norms excluding outsiders is robust. The dismissal of fatigue is the weak point.

      *   **Round 2 (Mira):** *Claim:* Tight charters create "rule shadow" (behavior migrates, rules weaponized).
          *   *Analysis:* This is a classic unintended consequences argument (Goodhart's Law/Campbell's Law). It's a strong theoretical critique of bureaucratic rigidity. However, it assumes the tight charter *cannot* account for these shadows, which Elias might deny.
          *   *Rating:* Substantially Right. It identifies a real mechanism of institutional failure.
          *   *Refinement:* "Mostly Right." It highlights a genuine risk, though it risks overstating the inevitability of shadow behaviors.

      *   **Round 3 (Elias):** *Claim:* Rule shadow is empirical. Data shows tight rules + high trust = marginalized participation.
          *   *Analysis:* He shifts to empirical evidence. The Scandinavian comparison is relevant but potentially confounded (culture vs. rules). He treats "rule shadow" as purely empirical, but Mira's point was conceptual/mechanistic. He also leans heavily on the "high-trust" precondition without fully acknowledging its weight yet.
          *   *Rating:* Mixed/Partially Right. The data point is good, but the inference (tight rules *cause* the trust/participation) is correlational, not causal. He ignores the precondition of trust.
          *   *Refinement:* "Partially Right." Good use of data, but causal leap is risky.

      *   **Round 4 (Mira):** *Claim:* False dichotomy. Argues for elasticity. Elias's data proves her point (rules need trust to work).
          *   *Analysis:* This is the strongest move. She redefines the debate (not tight vs. loose, but rigid vs. elastic). She turns Elias's evidence against him (trust is the moderator variable).
          *   *Rating:* Clearly Right. She successfully reframes the dichotomy and identifies the moderator variable (trust) that limits Elias's claim.
          *   *Refinement:* "Mostly Right" to "Clearly Right." Let's go with "Substantially Right" to maintain balance, but acknowledge it's the strongest move. Actually, the prompt asks for "Clearly Mistaken to Clearly Right." Her identification of the moderator variable is analytically superior. Let's rate it "Mostly Right" because "elasticity" needs definition to be operationalized, but conceptually she wins the round.

  4.  **Overall Verdict:**
      *   Who is more right? Mira wins on the *meta-argument* (the framework), but Elias wins on the *moral imperative* (protecting the marginalized). However, Mira's Round 4 successfully incorporates Elias's data while showing its limits. Mira is more right about *institutional design*, Elias is more right about *social justice goals*.
      *   Decision: Mira is more right *conceptually*, but Elias identifies the crucial *stakes*. Overall, Mira's framework allows for Elias's concerns, whereas Elias's framework excludes Mira's concerns. So Mira is more right overall.

  5.  **Identifying What's Missing (The Synthesis):**
      *   **Shared Assumption:** Both assume rules are primarily about *control* or *constraint*. They miss that rules also function as *coordination focal points*.
      *   **The Middle Position:** Needs a specific conceptual distinction.
          *   *Idea 1:* Constitutive vs. Regulative rules.
          *   *Idea 2:* Coordination Rules vs. Status Rules. (Prompt suggestion).
          *   *Idea 3:* Procedural vs. Substantive.
      *   *Selection:* **Constitutive vs. Regulative Rules** (Searle) or **Coordination vs. Distribution**. Let's use **Coordination Rules vs. Conduct Rules**.
          *   *Coordination Rules* (e.g., speaking time, turn-taking) need to be Tight (Elias). Ambiguity here causes chaos.
          *   *Conduct Rules* (e.g., respect, ad hominem definitions) need to be Elastic (Mira). Rigidity here causes weaponization.
      *   **Did they address the strongest point?**
          *   Elias ignored the *mechanism* of rule shadow until Round 4.
          *   Mira initially argued for "loose" which sounded like "no rules," allowing Elias to attack a straw man until she clarified "elasticity" in Round 4.
      *   **The "Trust" Variable:** Both miss that *trust* is the antecedent condition. You can't legislate trust.

  6.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Academic, adjudicatory, precise.
      *   *Structure:*
          1.  Intro.
          2.  Round-by-Round Rating & Justification.
          3.  Overall Verdict.
          4.  Missing Concepts/Middle Position.
          5.  Steel-man/Straw-man analysis.

      *(Self-Correction during drafting)*: Make sure I don't just say "trust." I need a specific *conceptual distinction* that solves the design problem. The distinction between **Technical/Procedural Rules** (where tightness helps) and **Normative/Evaluative Rules** (where tightness hurts) is better. Or **Bright-line Rules vs. Standards**. Let's use **Bright-line Procedures vs. Discretionary Standards**. This maps well to legal theory which fits the "charter" context.
      *Actually, the prompt suggests "coordination rules and status rules". I should probably use that or something similarly specific.* Let's go with **Coordination Rules (Tight) vs. Cultural/Status Rules (Loose/Elastic)**. This directly addresses the cultural capital issue Elias raises and the fatigue issue Mira raises.

      *Refining the Ratings:*
      *   R1 (Elias): Mostly Right. (Strong on equity, weak on cost).
      *   R2 (Mira): Mostly Right. (Strong on unintended consequences).
      *   R3 (Elias): Partially Right. (Data is good, causal claim is weak).
      *   R4 (Mira): Clearly Right. (Reframes the debate successfully).

      *Refining the "Missing" section:*
      *   Shared Assumption: That "rules" are a monolithic category.
      *   Distinction: **Constitutive Rules** (define the game) vs. **Regulative Rules** (govern behavior within the game).
      *   Wait, the prompt asks: "whether there is a coherent middle position... or whether the two positions actually share an unstated assumption." I should address both.
      *   Unstated Assumption: That the charter *creates* the culture rather than *reflecting* it. (The "Trust" point).
      *   Middle Position: Differentiate rule types.

  7.  **Final Polish:** Check against "Be specific" constraint. Ensure I explicitly state if they steel-manned or straw-manned.
      *   Elias straw-manned Mira in R1/R2 (treated "loose" as "chaos").
      *   Mira steel-manned Elias in R4 (acknowledged his data but reinterpreted it).

  8.  **Final Review of the Output:** Does it sound like an adjudication for a seminar? Yes. Is it nuanced? Yes.

  *(Self-Correction on Round 3 Rating)*: Elias claims tight rules correlate with participation in high-trust societies. Mira says this proves rules need trust. Elias is right about the correlation, but Mira is right about the implication. Elias's move is "Partially Right" because he uses the data to support a universal claim that the data doesn't support (universalizing a conditional finding).

  *(Self-Correction on Round 4 Rating)*: Mira is "Clearly Right" because she identifies the moderator variable (trust) which invalidates Elias's universalist claim.

