prompt: |-
  so im writing this paper for my philosophy elective about how effective altruists decide which problems to prioritize, and everyone keeps bringing up the importance-neglectedness-tractability framework (ITN). my dad says it's basically just expected value reasoning chopped into three pieces so it feels more scientific, and my teacher thinks I should compare it against a plain cost-effectiveness analysis like they use in public health (cost per life saved, that kind of thing). I'm kinda stuck on two specific things tho: (1) if a problem is super neglected, doesn't that kind of automatically mean it's tractable, or is multiplying the two together double counting the same fact? and (2) what even are the units here — importance is like lives affected but tractability is what, percent of the problem solved per extra million dollars? how do you multiply those? can you compare the two frameworks properly, say where they'd give different answers using a concrete made-up example (like malaria prevention vs some weird niche cause nobody's heard of), and tell me whether ITN is really just expected value with extra steps or whether it does something cost-effectiveness analysis can't capture. also if you can think of a case where the ITN multiplication gives a genuinely dumb answer, that would be great bc my teacher loves that kind of thing. please don't just give me a reading list, actually work it out
reasoning: |-
  Here's a thinking process that leads to the suggested response:

