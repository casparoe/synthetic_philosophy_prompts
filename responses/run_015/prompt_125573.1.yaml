answer: |-
  This is a classic bind in the philosophy of action, and you have reconstructed the dialectic very clearly. You have essentially rediscovered the core tension between Rylean Anti-Intellectualism and the Stanley & Williamson (2001) revival of Intellectualism. Your friend is right that your argument generalizes in a way that threatens standard semantics, but that doesn't mean your intuition in (1) is worthless.

  Here is the diagnosis of the argument, the identification of the "rotten step," and a breakdown of the costs for the available alternatives. I have kept the spelling and terminology in American English for your reading group.

  ### The Diagnosis: Where the Argument Breaks

  The rotten step is **(1)**, specifically the claim that the ability is *constitutive* of the knowledge state itself, rather than a condition for the *attribution* of the state or the *exercise* of it.

  **Why it looked fine:**
  Step (1) relies on a strong Rylean intuition: we do not attribute "knows how" to someone who is completely unable to perform the action. If someone says, "I know how to speak Mandarin," but cannot utter a word or understand a sentence, we think they are lying or mistaken. This is your "Grip Condition." It feels like a conceptual truth.

  **Why it is problematic:**
  The problem arises when you move from "we don't *attribute* knowledge without ability" to "ability is *part of the knowledge*."
  Consider a parallel: If someone has a stroke and loses the ability to speak English, do they cease to *know* English? Many philosophers of language would say they retain the linguistic competence (the knowledge) but lose the performance capacity (the ability).
  By making ability constitutive in (1), you force a dilemma: either the paralyzed expert never knew how (counterintuitive), or "knows how" means something totally different from "knows that" (your conclusion 3).

  However, your friend's objection (5–8) shows that if you hold (1) firm, you break the semantics of embedded questions. In standard semantics (Karttunen 1977), "knows where," "knows who," and "knows how" all take embedded questions as complements and denote a relation between a subject and a proposition (the true answer). If you say "knows how" is not propositional because it requires ability, consistency demands you say "knows where" is not propositional because it requires navigational ability. This leads to the "acquaintance theory of everything" which, as you noted, is a massive theoretical cost.

  ### Pricing the Alternatives

  You have three main paths forward. Each has a price tag.

  #### Option 1: Bite the Bullet on Anti-Intellectualism (Keep 1, Deny 7)
  You maintain that Know-How is fundamentally different from Know-Wh.
  *   **The Move:** You argue that "how" is special. "Where," "who," and "when" are factual queries about the world. "How" is a query about *agency*. Therefore, the semantics of "how" clauses are distinct from other *wh*-clauses.
  *   **The Cost:** You fracture the unified semantics of *wh*-clauses. Linguists generally prefer a uniform treatment of embedded questions. You also owe an explanation of why "I know how to swim" looks grammatically identical to "I know where the pool is" if their logical forms are radically different.
  *   **Who defends this:** Traditional Ryleans, Alva Noë, and some neo-Ryleans. They accept that "knows how" is not a standard knowledge relation.

  #### Option 2: Standard Intellectualism (Deny 1, Keep 7)
  You accept that Know-How is a species of propositional knowledge.
  *   **The Move:** You argue that the ability condition is a *pragmatic implicature*, not a semantic condition. When we say "S knows how to φ," we conversationally imply that S can φ, but strictly speaking, the knowledge state is just grasping the proposition.
  *   **The Cost:** You have to explain away the strong intuition in your "Instruction Test" (4). Why does the person with the manual *really* count as knowing how, even if they can't do it?
  *   **Who defends this:** Jason Stanley, Timothy Williamson. They argue that the paralyzed expert *does* know how, they just lack the capacity to exercise it.

  #### Option 3: Moderate Intellectualism / The Two-Condition View (Modify 1)
  This is likely your safest bet for an MA paper.
  *   **The Move:** You argue that Know-How *is* propositional (saving semantics), but it is a *distinctive kind* of propositional knowledge that normally entails ability.
  *   **The Formulation:** $S$ knows how to $\phi$ iff $S$ knows that $w$ is a way to $\phi$ **AND** $S$ has the ability to $\phi$ (or the ability is disposed to follow from the knowledge in normal conditions).
  *   **The Cost:** You make "knows how" ambiguous or conjunctive. It's not *just* knowing a proposition; it's knowing a proposition *plus* having an ability.
  *   **Who defends this:** Stephen Hetherington, John Bengson & Marc Moffett (though they lean more toward Option 2 with nuances).

  ### Addressing the "Practical Mode of Presentation"

  You mentioned you dislike the "Practical Mode of Presentation" (PMoP) reply because it feels like it "relocates the mystery." This is a common criticism, but it is worth understanding what the Intellectualist is buying with it.

  **The Intellectualist Claim:**
  Stanley & Williamson argue that you can know the same proposition under different *modes of presentation* (Fregean senses).
  *   **Theoretical Mode:** You know the proposition "w is a way to ride a bike" by reading a manual.
  *   **Practical Mode:** You know the proposition "w is a way to ride a bike" by having the motor-programs to execute $w$.

  **Why they think it solves the Instruction Test:**
  They would say your instruction test case (4) fails because the student with the manual possesses the proposition under a *theoretical* mode, not a *practical* one. To know-how, you must possess the proposition under a *practical* mode. Possessing it under a practical mode is tightly linked to ability, but the *knowledge itself* is still a relation to a proposition.

  **The Cost for them:**
  Critics (like Carr or Noë) argue this is an empty promise. If the "practical mode" just *is* the ability, then they haven't saved Intellectualism; they've just renamed ability as a "mode." If the "practical mode" is something else, what is it? This is where your paper can bite. You can argue that the PMoP is an ad hoc device to save the propositional view from counterexamples like the paralyzed expert or the instruction manual.

  ### Recommendation for Your Paper

  Since your paper is due Thursday, you do not have time to solve the debate. Instead, you should pivot your argument to focus on the tension your friend identified. That is actually a stronger paper than a simple refutation.

  **Suggested Strategy:**
  1.  **Concede the Friend's Point:** Acknowledge that a strict reading of (1) threatens the semantics of *wh*-clauses (Step 7). This shows philosophical maturity.
  2.  **Refine the Grip Condition:** Instead of saying ability is *constitutive* of the knowledge state, argue that ability is *necessary for the attribution* of know-how in a way that it is not for know-where.
      *   *Argument:* "Knowing where" is about information access. "Knowing how" is about *skill*. Even if both are propositional, the *standards* for attributing them differ.
  3.  **Attack the PMoP:** Use your "Instruction Test" (4) to argue that the PMoP is insufficient. If the difference between the choreographer and the dancer is just a "mode of presentation," explain what cognitive state that is that isn't just the ability itself. If they say it *is* the ability, press them on why they insist on calling it "propositional knowledge" at all.
  4.  **Conclusion:** Conclude that while Intellectualism saves semantics (Step 7), it does so at the cost of making "knowledge" do too much work. It stretches the concept of "propositional knowledge" so far (to include motor skills, practical modes, etc.) that it loses its explanatory power.

  **Specific Fix for Your Argument:**
  Change Step (3).
  *   **Old (3):** So knowing how to $\phi$ is not a matter of knowing that $w$ is a way to $\phi$.
  *   **New (3):** So knowing how to $\phi$ cannot be *merely* a matter of knowing that $w$ is a way to $\phi$ under any standard theoretical guise; it requires a connection to ability that standard propositional knowledge lacks.

  This allows you to keep the semantic unity (satisfying your friend) while maintaining that Know-How is substantively different from Know-That (satisfying your original intuition).

  ### Summary of Costs

  | Position | What you Keep | What you Give Up | Main Vulnerability |
  | :--- | :--- | :--- | :--- |
  | **Your Original Argument** | The Grip Condition (1); Anti-Intellectualism (3). | Unified Semantics (7). | Makes "knows where" look non-propositional. |
  | **Standard Intellectualism** | Unified Semantics (7); Propositionalism. | The Grip Condition (1). | Counterintuitive on paralyzed experts & instruction manuals. |
  | **Moderate View (Recommended)** | Unified Semantics (7); Modified Grip Condition. | The idea that Knowledge is *only* a relation to a proposition. | Makes "knows how" a conjunctive state (Prop + Ability). |

  Good luck with the paper. The "Instruction Test" is a strong intuition pump; don't let the Intellectualist explain it away too easily. Focus on whether their "Practical Mode" is doing any real work or if it is just a label for the ability you already identified.
