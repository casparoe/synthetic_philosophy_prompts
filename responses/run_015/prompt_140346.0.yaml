answer: |-
  1. To solve the grafting problem, you must define a cultural unit by the logic of its reconstruction rather than physical copying, allowing us to track a dance challenge even when users splice in new audio or video clips without breaking the lineage. Without this, you cannot trace lineage through the remixing that defines digital culture. Tag: Non-negotiable.

  2. To solve the vacant-host problem, the theory must quantify trait fitness independently of host welfare, explicitly predicting that self-harming behaviors can spread if they increase their own transmission rate regardless of biological cost. This separates cultural success from biological survival in cases like dangerous viral challenges. Tag: Non-negotiable.

  3. To avoid emptiness, it must set a measurable fidelity floor below which change is classified as noise or drift rather than evolution, distinguishing a fading fashion trend from a stabilizing language rule. This requires fieldworkers to quantify persistence across generations rather than gesturing at vague longevity. Tag: Preference.

  4. To be falsifiable, it must identify scenarios where cultural change is strictly top-down or random drift, such as a government mandate changing traffic laws, and declare this process distinct from selection-based evolution. If everything counts as evolution, the theory explains nothing about specific causal mechanisms. Tag: Non-negotiable.

  5. The tension lies between Unit Identity and Transmission Threshold, because allowing the radical reconstruction needed to solve grafting inevitably lowers fidelity below the floor required to measure selection distinct from drift. You cannot have a unit flexible enough to survive remixing and stable enough to demonstrate Darwinian selection. This forces a choice between a theory that covers everything and explains nothing or explains something and covers nothing.
