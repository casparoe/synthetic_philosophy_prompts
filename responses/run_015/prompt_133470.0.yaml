  ### I. The Rules of the Record

  Based on the four-year record, two substantially different rules describe our decisions. Both fit the data, but they rely on different justifications and diverge on the moral weight of biological norms versus institutional obligations.

  **Rule 1: The Restoration of Species-Typical Function (with Safety and Identity Exceptions)**
  This rule holds that the university funds interventions that return an individual to a biological or functional baseline typical for their age and species.
  *   **Fits:** Cases 1, 4, 7, 9 (Restoring function lost to disorder or age); Case 10 (Restoring vision to 20/20, treating myopia as a deviation).
  *   **Fits:** Cases 3, 5 (Declined because they seek to exceed baseline/advantage, not restore it).
  *   **Exceptions:**
      *   *Safety:* Case 8 (Healthy resident approved) is an exception where biological enhancement is funded solely to prevent harm to third parties.
      *   *Identity:* Case 6 (Deaf student) is an exception where restoration is declined because the individual does not experience the deviation as a deficit.

  **Rule 2: The Removal of Participation Barriers (with Environmental Preference)**
  This rule holds that the university funds interventions necessary for safe and equitable participation in university life, prioritizing environmental accommodations over biological modifications unless the latter are standard, low-risk, or safety-critical.
  *   **Fits:** Cases 2, 6 (Environmental accommodations approved/preferred); Cases 1, 4 (Biological fixes approved as valid accommodations for diagnosed barriers).
  *   **Fits:** Case 8 (Intervention funded to mitigate institutional risk/liability).
  *   **Fits:** Cases 3, 5 (Declined because the barrier is competitive, not participatory; the students can participate without the drug).
  *   **Fits:** Case 10 (Laser approved as a low-risk removal of a participation burden, even if glasses sufficed).

  **Where They Diverge:**
  The rules diverge on **healthy individuals facing institutional requirements without third-party risk.**
  *   **Rule 1** would decline funding for a healthy student needing an enhancement to meet a degree requirement (e.g., a pilot trainee needing wakefulness for long flights) because there is no pathology and no third-party safety risk (unlike the medical resident).
  *   **Rule 2** might approve it, arguing that if the intervention is necessary for degree completion (participation) and no environmental fix exists, the university has an obligation to fund it, extending the logic of Case 8 (institutional duty) beyond patient safety.

  ***

  ### II. Recommendation for the New Case

  **Recommendation:** **Decline.**

  **Closest Analog:** **Case 3 (Undiagnosed student seeking stimulants for finals).**
  In Case 3, a healthy student sought a biological intervention to manage academic pressure and improve output. We declined, noting the ruling was about provision, not permission. The current request is structurally identical: a healthy individual seeking a biological intervention to manage time/pressure and improve academic output (dissertation progress).

  **Principle Adopted:**
  By declining, we affirm the principle: **"The university funds the remediation of pathological deficits and the mitigation of external safety risks, but does not fund biological optimization for personal time management or academic throughput in the absence of diagnosis."**

  **Analysis of the Therapy/Enhancement Distinction:**
  In our record, the therapy/enhancement distinction is doing work, but it is not the *sole* tracker.
  *   **It is doing work:** It explains the split between Cases 1/4 (Therapy/Approved) and Cases 3/5 (Enhancement/Declined).
  *   **It is not the whole story:** Case 8 (Healthy resident/Approved) proves we will fund enhancement for safety. Case 6 (Deaf student/Declined) proves we will decline therapy if identity vetoes it. Case 10 (Laser/Approved) suggests we fund "lifestyle" biological fixes if they are standard and low-risk.

  Therefore, we are not tracking "Therapy vs. Enhancement" strictly. We are tracking **Entitlement based on Pathology or Duty of Care.**
  *   **Pathology:** Cases 1, 2, 4, 7, 9.
  *   **Duty of Care (Safety):** Case 8.
  *   **Standard Maintenance:** Case 10.
  *   **The New Case:** Fits none of these. It is not pathology (she is healthy). It is not duty of care (no risk to patients/public). It is not standard maintenance (newly licensed agent for time compression). The fact that she declined an environmental fix (reduced load) due to funding constraints does not create an entitlement to a biological fix; Case 3 implies that academic pressure is a normal burden, not a disability requiring university-funded biological mitigation.

  ***

  ### III. The Distinguishing Case

  To tell Rule 1 (Restoration) and Rule 2 (Participation) apart, place the following case before the committee:

  **The Case:** A healthy graduate student in a university-run aviation training program requests a wakefulness agent for overnight simulation flights. Failure to complete these flights results in expulsion from the program. There is no risk to public safety (simulated environment), and no environmental alternative (flights cannot be rescheduled).

  **Why this distinguishes the rules:**
  *   **Under Rule 1 (Restoration):** We must **Decline.** The student is healthy (no pathology), and there is no third-party safety risk (the exception in Case 8 is triggered by *patient* risk, not program completion). Funding this would be funding enhancement for academic/professional advantage.
  *   **Under Rule 2 (Participation):** We should **Approve.** The intervention is necessary for participation in the degree program. Case 8 established that the university will fund biological interventions for healthy workers when required for their role. Rule 2 extends this "Duty of Care" to "Duty to Enable Completion." If the barrier to participation is biological fatigue, and no environmental fix exists, Rule 2 mandates funding to ensure equitable access to the degree.

  This case isolates the variable of **Third-Party Safety.** Rule 1 requires it to justify enhancement in healthy individuals; Rule 2 requires only **Institutional Necessity.**
