  **25%** — The paradox highlights a steep epistemic cost but fails as a logical contradiction given supervenience.

  *   **Reference (30%)**: Reference likely relies on causal history, but common-cause structures can sustain semantic links without phenomenal efficacy.
  *   **Property Dodge (20%)**: Distinct properties instantiated by the same substrate can legitimately differ in causal power without breaking causation.
  *   **Theoretical Belief (40%)**: Inferred beliefs remain vulnerable if the introspective data feeding the inference lacks justified connection to its object.
  *   **Justification (25%)**: Reliabilist accounts of knowledge permit justified true belief via reliable correlation rather than direct causal production.

  **Combination**: Epiphenomenalism survives as logically coherent but imposes a high epistemic cost that many find intuitively unacceptable despite technical viability.

  **Most Work**: The justification term does the most work, as shifting from causal to reliabilist epistemology dissolves the reductio.

  **Moving Consideration**: A proof that semantic reference to qualia strictly requires the qualia themselves to exert causal power over speech centers.
