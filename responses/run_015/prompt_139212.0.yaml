  Hey — I've got surgery under general anaesthetic in a month and have been reading too much about accidental awareness during it, which has somehow turned into an arguement with my partner about epiphenomenalism. She says the view eats itself: if your experiences do no causal work, then your saying "that hurts" isn't caused by (or about) the hurt in the right way, so you've got no reason to trust any introspective report — including the seeming that got you to the theory in the first place. I half buy it, but there's a move I keep coming back to: the judgement is caused by the experience, just not by the phenomenal character of it — the neural/functional description does the causing and the what-it's-like part rides along inert. Call it the property-level dodge.

  So give me a number: your credence that the paradox of phenomenal judgement is a real reductio of epiphenomenalism. Count it as settled in the reductio's favour if, granting epiphenomenalism, we lose justified introspective belief about our own conscious states, or the ability to refer to them. Then seperate out the terms: whether content or reference really needs the kind of causal link the argument assumes; whether the property-level dodge works — can a state cause something under one description and not under another; whether the epiphenomenalist's own theoretical belief can be exempted because it's inferred rather than introspected; whether justification actually needs a causal explanation rather than some non-causal reliable correlation. A number and one line for each, then the combination, then tell me which term does the most work and what single consideration would move you most.
