prompt: |-
  I'm a program officer at a research foundation that funds multi-year projects, and each year I decide whether to continue or stop funding every project in our portfolio, most of which have already spent a large share of their budget. The usual advice is to ignore the sunk costs, but that feels too crude: some projects have genuinely learned things from the money already spent, and some of our continue-versus-stop calls are partly about what we signal to donors and partner labs. Write me a decision procedure my team could actually run on a project at review time—the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a stop-funding verdict, and where it hands the decision to a person because the question is one of judgment or values rather than facts. It has to separate the money already spent, which should not enter the decision directly, from the evidence that spending produced, which should update our estimate of the project's prospects, and it has to give real weight to the strategic reason to continue, the value of signaling commitment, without letting that excuse a decision that is really just regret or embarrassment. Be explicit about which steps are judgment calls dressed up as procedure. Then run it on three projects—one that has produced strong intermediate evidence but is now expensive, one that has produced nothing but is cheap to keep alive, and one where stopping would publicly undermine a partnership we depend on—and for at least one, tell me what the procedure concludes even if I won't like it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Program Officer at a research foundation.
      *   **Task:** Create a decision procedure for continuing vs. stopping funding for multi-year projects (annual review).
      *   **Constraints/Requirements:**
          *   Must acknowledge sunk costs (ignore the money, but value the *evidence* gained from that money).
          *   Must account for strategic signaling (donors, partners) without using it as an excuse for sunk cost fallacy (regret/embarrassment).
          *   Must be actionable (questions in order, sufficient answers, stop points).
          *   Must distinguish between factual steps and judgment/value calls.
          *   Must test the procedure on three specific scenarios:
              1.  Strong evidence, now expensive.
              2.  No evidence, cheap to continue.
              3.  Stopping undermines a key partnership.
          *   Must be honest about conclusions, even if unpalatable.

  2.  **Deconstruct the Core Tension:**
      *   *Sunk Cost Fallacy:* "We spent $5M, so we must spend $1M more." (Bad)
      *   *Information Value:* "We spent $5M and learned X, which makes the next $1M more likely to succeed." (Good)
      *   *Strategic Signaling:* "If we stop, partners won't trust us." (Valid strategic concern)
      *   *Reputation/Embarrassment:* "If we stop, we look like we made a mistake." (Bad/Invalid)

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Structure:* Needs to be a flowchart or step-by-step protocol.
      *   *Step 1: Scientific/Technical Viability.* (The core mission). Is the path forward clear?
      *   *Step 2: The Sunk Cost Filter.* Explicitly separating money spent from knowledge gained.
      *   *Step 3: Opportunity Cost.* Is this the best use of *new* money?
      *   *Step 4: Strategic/Relational Impact.* The signaling piece.
      *   *Step 5: The "Human in the Loop" Handoff.* Where judgment takes over.

      *Refining the Steps:*
      *   *Q1 (Viability):* Has the project reduced uncertainty? (Focus on learning, not spending).
      *   *Q2 (Forward ROI):* Given current knowledge, is the marginal dollar efficient?
      *   *Q3 (Strategic Cost):* What is the specific cost of stopping? (Needs to be concrete, not vague "bad reputation").
      *   *Q4 (The Sunk Cost Check):* Are we continuing because we *need* the past to be right, or because the *future* is bright?

      *Defining Stop/Continue/Handoff:*
      *   Stop if Viability is low.
      *   Stop if Forward ROI is low (unless Strategic Cost is catastrophic).
      *   Handoff if Strategic Cost is high but Viability is low (the "Zombie Project" dilemma).

  4.  **Addressing the "Judgment vs. Procedure" Requirement:**
      *   I need to explicitly label where the procedure ends and human discretion begins. Usually, this is when weighing incommensurable values (e.g., scientific merit vs. diplomatic relationship).

  5.  **Developing the Three Test Cases:**

      *   *Case 1: Strong Evidence, High Cost.* (The "Success Trap").
          *   Science: Good.
          *   Cost: High.
          *   Procedure should likely say: Continue, *if* the marginal cost is justified by the probability of success. If the cost is *too* high relative to other opportunities, it might stop. Let's make it tricky: The science is good, but the cost is astronomical. The procedure should force a hard look at opportunity cost.
      *   *Case 2: No Evidence, Low Cost.* (The "Lottery Ticket").
          *   Science: Stalled.
          *   Cost: Negligible.
          *   Procedure should likely say: Stop. Low cost isn't a reason to keep dead weight. *Unless* there's a specific hypothesis for why it stalled. If it's just "hoping," stop.
      *   *Case 3: Partnership Risk.* (The "Diplomatic Nightmare").
          *   Science: Maybe mediocre.
          *   Relationship: Critical.
          *   Procedure should flag this as a "Handoff." It's a value judgment. However, I need to ensure the procedure doesn't just say "Keep it." It needs to distinguish between "Undermine partnership" (valid) and "Embarrassment" (invalid). I will design the procedure to recommend stopping if the science is dead, *forcing* the PO to override it consciously for the relationship. This meets the requirement "tell me what the procedure concludes even if I won't like it."

  6.  **Refining the Procedure (Self-Correction/Polishing):**
      *   *Critique:* Is the distinction between "Signaling Commitment" and "Embarrassment" clear enough?
      *   *Fix:* Add a specific question in Step 4: "If this project had never been funded, would we start it today to build this relationship?" If no, it's sunk cost/embarrassment. If yes, it's strategic investment.
      *   *Critique:* Make sure the "Stop" verdicts are clear.
      *   *Fix:* Use "Termination Recommended" vs "Escalate to Committee."

  7.  **Finalizing the Output Structure:**
      *   Introduction (Philosophy).
      *   The Protocol (Step-by-Step).
      *   The "Human Handoff" (Explicitly marking judgment calls).
      *   The Three Simulations (Applying the protocol).
      *   Closing Advice.

  8.  **Drafting the Content (Iterative refinement during writing):**
      *   *Step 1:* Focus on "Marginal Productivity."
      *   *Step 2:* The "Sunk Cost Audit." (Did we buy knowledge or just burn cash?)
      *   *Step 3:* The "Relationship Test." (Is the relationship an asset or a liability?)
      *   *Step 4:* The "Zero-Base Test." (Would we fund this today as a new proposal?)
      *   *Simulation 3:* Needs to be the one where the procedure says "Stop" despite the partnership risk, to show integrity. Or, perhaps, the procedure says "Escalate" because it can't weigh diplomacy. Let's go with "Escalate with a presumption of Stop." That's more honest. Actually, the prompt asks for what the procedure *concludes*. I will make the procedure conclude "Stop" on scientific grounds, requiring a specific override for the relationship. This highlights the tension.

      *(Self-Correction on Simulation 3)*: The prompt asks to "give real weight to the strategic reason to continue." If the procedure just says "Stop," it ignores that weight. I need to build a "Strategic Override" into the procedure, but label it as a Value Judgment, not a Fact.
      *Revised Plan for Sim 3:* The procedure calculates a "Scientific Score" and a "Strategic Score." If Scientific is low and Strategic is high, it goes to the "Judgment Handoff." I will explicitly state that the *default* recommendation is Stop, and continuing requires a signed justification. This prevents "drift."

      *(Wait, re-reading prompt)*: "tell me what the procedure concludes even if I won't like it."
      Okay, for Case 2 (No evidence, cheap), the natural inclination is "keep it, it's cheap." The procedure should probably say "Stop" because opportunity cost exists even for cheap projects (staff time, portfolio clutter). That's a good "unpalatable truth."
      For Case 3 (Partnership), the unpalatable truth might be that the procedure recommends stopping, forcing the PO to take personal responsibility for the diplomatic fallout.
      Let's go with Case 2 for the "unpalatable" one. Everyone loves a cheap lottery ticket. The procedure should kill it if the expected value is zero.

      *Wait, let's look at Case 3 again.* "One where stopping would publicly undermine a partnership we depend on." If the procedure ignores this, it's useless. If it accepts it blindly, it's corrupt. The middle ground: The procedure identifies the risk but requires a specific *type* of justification to continue.
      Actually, the prompt asks for *one* case where the conclusion is unpalatable. I'll make Case 2 (The Cheap Zombie) the one where the procedure says STOP. It's counter-intuitive but rational.
      For Case 3, I will show how the procedure handles the signaling without falling for sunk costs.

      *Let's refine the "Sunk Cost vs. Evidence" distinction.*
      Question: "What specific uncertainty was retired by the previous tranche?"
      If answer is "None," then sunk cost is pure loss.
      If answer is "We know Method A fails," that is an asset.

      *Let's refine the "Signaling" distinction.*
      Question: "Is the value of continuing the *work*, or the *act of funding*?"
      If the work is dead but the act of funding maintains a bridge, that is a "Strategic Grant," not a "Research Grant." It needs to be categorized differently.

      *Okay, ready to write.*

      *Structure:*
      1.  **Protocol Name:** The Marginal Value & Strategic Integrity Protocol (MV-SIP).
      2.  **Phase 1: The Scientific Asset Audit** (Separating money from knowledge).
      3.  **Phase 2: The Forward-Looking ROI** (Marginal utility).
      4.  **Phase 3: The Strategic & Relational Filter** (Signaling vs. Embarrassment).
      5.  **Phase 4: The Zero-Base Decision** (The final vote).
      6.  **The Judgment Handoff** (Explicitly marking where humans decide).
      7.  **Simulations.**

      *Check against constraints:*
      *   Separate money spent from evidence? Yes (Phase 1).
      *   Weight signaling without excuse? Yes (Phase 3 distinction).
      *   Explicit judgment calls? Yes (Handoff section).
      *   Three projects? Yes.
      *   Unpalatable conclusion? Yes (Case 2).

      *Final Polish:* Ensure tone is professional, operational, and direct. Avoid academic fluff. Use "Stop/Continue/Escalate" terminology.

      *(Self-Correction during drafting Phase 3)*: Make sure the "Partnership" question is rigorous. "If we stopped, would the partner leave?" vs "If we stopped, would the partner be annoyed?" Only the former counts as strategic.

      *(Self-Correction during drafting Sim 3)*: The prompt says "for at least one, tell me what the procedure concludes even if I won't like it." I will apply this to Case 2 (Cheap Zombie) because it's the most common cognitive bias (throwing good money after bad because it's 'only a little bit'). But Case 3 is also a good candidate. I think Case 2 is sharper for "Sunk Cost" logic. Actually, Case 3 is better for the "Signaling" constraint. Let's make Case 3 the one where the procedure says "Stop" unless a specific strategic override is signed. That feels more responsible. No, I'll stick with Case 2 being the "Stop" because it's scientifically dead. That's the purest test of "ignore sunk costs." I'll make Case 3 an "Escalate" because it involves values.
      Wait, the prompt says "tell me what the procedure concludes even if I won't like it." I'll apply this to Case 2. It's cheap, so you want to keep it. The procedure says kill it.
      Actually, let's look at Case 1. Strong evidence, expensive. You want to keep it. Procedure might say Stop if the marginal cost is too high. That's also unpalatable.
      Let's go with Case 2. It's the classic "might as well keep it going" trap.

      *Wait, one more check:* "give real weight to the strategic reason to continue... without letting that excuse a decision that is really just regret."
      Okay, I need to make sure Phase 3 allows for "Strategic Continuation" but labels it as such.
      Okay, I have the plan.

      *Step 1:* Scientific Asset Audit. (What did we buy?)
      *Step 2:* Marginal ROI. (What will the next dollar buy?)
