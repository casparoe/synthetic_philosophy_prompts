answer: |-
  # The Marginal Value & Strategic Integrity Protocol (MV-SIP)

  **Purpose:** To determine whether to renew annual funding for multi-year research projects.
  **Core Principle:** Past expenditure is irrelevant to future value *except* insofar as it purchased information that reduces future risk. Strategic relationships are assets, but they must not be used to mask scientific failure.

  **Instructions:** Complete this form for every project at annual review. Do not proceed to the next step if a "Stop" condition is triggered unless a **Judgment Override** is filed (see Phase 4).

  ---

  ## Phase 1: The Scientific Asset Audit
  *Goal: Separate the money spent (sunk cost) from the knowledge gained (asset).*

  **Q1.1: What specific high-uncertainty hypothesis was retired by the previous tranche of funding?**
  *   *Acceptable Answer:* A specific technical claim (e.g., "We proved Pathway X does not regulate Y") or a capability built (e.g., "We validated the assay for Z").
  *   *Unacceptable Answer:* "We spent the budget," "We hired staff," or "We are behind schedule."
  *   **Stop Condition:** If the answer is Unacceptable, mark **Scientific Asset = 0**.

  **Q1.2: Does the remaining uncertainty justify the cost of resolving it?**
  *   *Action:* Compare the cost of the *next* tranche against the value of the specific answer it will produce.
  *   **Stop Condition:** If the cost of the next tranche exceeds the estimated value of the information gained (even if successful), recommend **Stop**.

  ---

  ## Phase 2: The Forward-Looking ROI
  *Goal: Assess the marginal utility of new dollars, ignoring past dollars.*

  **Q2.1: If this project were submitted today as a new application with its current preliminary data, would it be funded?**
  *   *Action:* Score 1 (Yes, easily) to 5 (No, reject).
  *   **Stop Condition:** A score of 4 or 5 triggers a **Presumption of Stop**.

  **Q2.2: Is the marginal cost of continuation lower than the marginal cost of starting a comparable new project?**
  *   *Context:* Sometimes keeping a team together is cheaper than recruiting a new one, even if progress is slow.
  *   **Stop Condition:** If the project is inefficient compared to market alternatives, recommend **Stop**.

  ---

  ## Phase 3: The Strategic & Relational Filter
  *Goal: Weigh signaling value without succumbing to embarrassment.*

  **Q3.1: If we terminate this project, what is the specific, tangible consequence to our foundation's relationships?**
  *   *Acceptable Answer:* "Partner Lab X will lose eligibility for future joint calls," or "Donor Y has contractually tied this to a larger pledge."
  *   *Unacceptable Answer:* "It will look bad," "We will feel embarrassed," or "They might be annoyed."
  *   **Handoff Point:** If the consequence is tangible and severe (e.g., loss of future access), this step cannot be decided by formula. **Escalate to Judgment Handoff.**

  **Q3.2: Are we continuing to fund the *work*, or the *relationship*?**
  *   *Action:* If the science is dead (Phase 1 = 0) but the relationship is vital, reclassify the funding line from "Research Grant" to "Strategic Partnership."
  *   **Requirement:** This reclassification requires a **Judgment Override**. It acknowledges you are paying for access, not discovery.

  ---

  ## Phase 4: The Zero-Base Decision & Judgment Handoff
  *Goal: Final verdict and explicit acceptance of value-based deviations.*

  **The Default Verdict:** Based on Phases 1–3, the procedure outputs **Continue**, **Stop**, or **Escalate**.

  **The Judgment Handoff:**
  If the Default Verdict is **Stop**, but the Program Officer wishes to **Continue**, they must sign the following statement:
  > *"I am aware this project fails the Scientific Asset or Forward ROI test. I am recommending continuation solely for Strategic/Relational reasons. I accept that this expenditure is a cost of business development, not research, and will be reported as such to the board."*

  If the Default Verdict is **Continue**, but the cost is high relative to evidence, the Officer must sign:
  > *"I accept the risk that this project may fail to produce further value. The decision is based on the high ceiling of potential impact, not the safety of past investment."*

  ---

  # Simulation: Running the Protocol on Three Projects

  Here is how the MV-SIP performs on three distinct portfolio scenarios.

  ### Project A: The "Success Trap"
  *   **Status:** Produced strong intermediate evidence validating the core mechanism.
  *   **Financials:** The next phase requires $5M (10x previous annual cost) to scale for clinical trials.
  *   **Relationship:** No specific partnership risk.

  **Protocol Run:**
  1.  **Phase 1 (Asset):** High. Uncertainty retired: "Does the target engage?" Answer: Yes.
  2.  **Phase 2 (ROI):** Q2.1 (New App Score): 2 (Would fund). Q2.2 (Marginal Cost): The cost jump is massive. Compared to other early-stage opportunities, $5M is a huge concentration of risk.
  3.  **Phase 3 (Strategic):** No specific relationship risk.
  4.  **Phase 4 (Verdict):** **Escalate.**

  **Analysis:** The procedure prevents automatic renewal. Just because the science worked doesn't mean *this foundation* should pay for the expensive part. It forces a conversation about whether you are an early-stage funder or a late-stage funder.
  **Conclusion:** The procedure does not guarantee funding. It flags the budget mismatch. You might have to stop funding not because the science failed, but because the price tag no longer fits your portfolio strategy.

  ### Project B: The "Cheap Zombie"
  *   **Status:** Produced no verifiable evidence in 3 years. Hypotheses remain untested.
  *   **Financials:** Very cheap to keep alive ($50k/year).
  *   **Relationship:** PI is a senior figure in the field, but no formal partnership dependency.

  **Protocol Run:**
  1.  **Phase 1 (Asset):** **Scientific Asset = 0.** Q1.1 failed. No uncertainty retired.
  2.  **Phase 2 (ROI):** Q2.1 (New App Score): 5 (Would reject). Q2.2 (Marginal Cost): Low, but opportunity cost exists (staff time, portfolio clutter).
  3.  **Phase 3 (Strategic):** Q3.1 Consequence: "They might be annoyed." (Unacceptable Answer). No tangible risk.
  4.  **Phase 4 (Verdict):** **Stop.**

  **Conclusion (The Unpalatable Truth):** Your instinct is likely to keep this going. "$50k is nothing, why burn the bridge?" The procedure concludes **Stop**.
  **Why:** Because "cheap" is not a scientific criterion. Keeping it consumes management bandwidth and signals to other grantees that performance is optional. The procedure forces you to admit you are not funding research; you are funding a stipend for a senior figure. If that is your goal, you must sign the **Judgment Override** in Phase 4 and classify it as "Patronage," not "Research."

  ### Project C: The "Diplomatic Nightmare"
  *   **Status:** Science is stalled. Key technical milestone missed twice.
  *   **Financials:** Moderate cost to continue.
  *   **Relationship:** Stopping would cause a partner national laboratory to revoke our access to a unique facility we need for *other* projects.

  **Protocol Run:**
  1.  **Phase 1 (Asset):** Low. Some negative data, but core goal unmet.
  2.  **Phase 2 (ROI):** Q2.1 (New App Score): 4 (Presumption of Stop).
  3.  **Phase 3 (Strategic):** Q3.1 Consequence: "Revoke access to unique facility." (Acceptable/Tangible).
  4.  **Phase 4 (Verdict):** **Escalate to Judgment Handoff.**

  **Analysis:** The procedure identifies this as a conflict between Scientific ROI and Strategic Access.
  **Conclusion:** The procedure recommends **Stop** on scientific grounds (Phase 2), but triggers the **Judgment Handoff** (Phase 3).
  **The Override:** To continue, you must sign the statement: *"I am aware this project fails the Scientific Asset test. I am recommending continuation solely for Strategic/Relational reasons. I accept that this expenditure is a cost of business development, not research."*
  **Why this works:** It prevents you from lying to yourself that the science is good. It forces you to budget this as a "relationship maintenance fee." If you aren't willing to categorize it that way on paper, you shouldn't fund it.

  ---

  # Where the Procedure Hands Off to You

  The MV-SIP is not a black box. It is a scaffold for your judgment. There are three specific points where the procedure stops and **you** must decide based on values, not facts:

  1.  **Valuing the Relationship (Phase 3, Q3.1):** The procedure cannot calculate the dollar value of a partnership. It can only force you to define the risk concretely. You must decide if the risk of losing the partner is worth the cost of the grant.
  2.  **The "Patronage" Decision (Phase 4, Override):** When you fund Project B (The Cheap Zombie) or Project C (The Diplomatic Nightmare) despite scientific failure, you are making a value judgment that *stability* or *access* is more important than *discovery*. The procedure forces you to own that trade-off explicitly.
  3.  **Risk Tolerance (Phase 2, Q2.2):** The procedure highlights opportunity cost, but it cannot set your risk appetite. You must decide if a 10% chance of a breakthrough is worth 50% of your budget.

  **Final Instruction to Team:**
  If you find yourself writing "Stop" on a project but feeling anxious about the fallout, **do not change the verdict.** Instead, file the Judgment Override. If you cannot bring yourself to sign the Override, your anxiety is telling you that the strategic reason isn't strong enough to justify the scientific weakness. Trust the signature requirement more than your gut feeling.
