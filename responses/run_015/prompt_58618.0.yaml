      *   **User's Stance:** "Somewhere between" the two extremes (insects don't count vs. avoid killing at all). Concerns about: killing thousands for minor health issues (stomach upsets vs. serious disease), speed of death (quick spray vs. slow bait/trap), proactive vs. reactive killing (residual poison vs. targeted), and environmental spillover (inside walls vs. courtyard drains).
