answer: |-
  **TO:** All Members of the Mill Housing Cooperative
  **FROM:** [Your Name], Repairs & Services Committee
  **DATE:** 24 October 2023
  **SUBJECT:** Proposal for Cockroach Control – Vote Next Month

  **The Problem and The Choice**

  As you know, we have a persistent problem with German cockroaches in the ground-floor flats and the bin room. At our last meeting, we agreed we need a consistent strategy, not just ad-hoc fixes. We have two quotes on the table for the same annual cost.

  **Plan 1** is a whole-building spray every three months. It coats skirting boards and pipe runs. It kills on contact and stays poisonous for weeks.
  **Plan 2** is a targeted programme. It uses gel baits in cracks, seals up entry points, and uses monitoring traps. Sprays are only used in specific flats if the baits don't work after two months. It also involves help for residents to store food better and reduce clutter.

  I am writing this to recommend **Plan 2**. Before we vote next month, I want to explain why I believe this is the right balance for our building, our neighbours, and the environment.

  **What We Would Do in the First Three Months**

  If we adopt Plan 2, here is the timeline:
  *   **Month 1:** The contractor seals gaps around pipes and doors (proofing). Gel baits are placed in hidden cracks in the bin room and ground floor. Sticky monitoring traps are set to see where the insects are moving.
  *   **Month 2:** Committee members will check the traps weekly. We will contact any flat showing high activity to help them organise food storage or clear clutter. If a specific flat still has high numbers, we authorise a spot-spray just for that unit.
  *   **Month 3:** Full review. If the monitoring shows the population is dropping, we continue. If not, we reassess.

  **Why This Balance is Right**

  I am not an expert in ethics, and I know we all want to be rid of these pests. But as a committee, we have to weigh human comfort against what else is affected by our choices.

  First, there is the question of **what gets killed**. Plan 1 is a blanket approach. It will kill the cockroaches, but it will also kill spiders and other insects that live in our walls and never bother us. It also lays down poison that keeps killing "newcomers" for months, even if they weren't part of the original infestation. Plan 2 targets only the pests causing the problem. It feels more honest to kill only what threatens us, rather than poisoning the building's ecosystem preventatively.

  Second, there is the **environment**. We share a courtyard. With Plan 1, rain washes residue from the building into our drains. Plan 2 keeps the chemicals contained inside the cracks where the baits are placed.

  Third, there is the **suffering** involved. Some have asked if a quick spray death is better than an insect struggling on a sticky trap for a day. This is a fair point. However, Plan 1 causes a much higher total number of deaths, including insects that are harmless. Plan 2 reduces the total number of insects killed overall by stopping them from breeding, rather than just massacring them repeatedly.

  I know Plan 2 asks more of us. It requires residents to keep food sealed and reduce clutter. I am particularly concerned about our elderly neighbours and families with small children who might find this difficult. To make this work, the committee must commit to helping vulnerable residents with this work, not just telling them to do it. We will organise volunteer support for anyone who needs physical help clearing clutter or moving items for proofing.

  **The Case for Plan 1 (and Why I Reject It)**

  The strongest argument for Plan 1 is **certainty and convenience**. It requires less effort from residents. You don't have to change your habits; the contractor just comes in and sprays. For a busy household, or someone with mobility issues, not having to worry about food storage or letting contractors into cupboards to place baits is a significant relief. It promises a "set and forget" solution.

  However, I do not think this convenience wins out in the end. The "set and forget" approach comes with hidden costs: the chemical runoff into our courtyard and the indiscriminate killing of non-target insects. Furthermore, cockroaches can build resistance to sprays over time. Plan 2 solves the root cause (entry points and food sources) rather than just treating the symptom.

  **Conclusion**

  We need to solve this infestation, but we should do it without harming our shared environment more than necessary. Plan 2 treats the building with more care. It accepts that we have a responsibility to minimise harm, even to small creatures, provided it doesn't seriously risk human health. Since Plan 2 still allows for sprays if the baits fail, human health remains protected.

  I ask you to support Plan 2 at the vote next month, with the understanding that the committee will actively support any resident struggling with the cleaning requirements.

  Please read this over and bring your questions to the meeting on [Date].

  [Your Name]
