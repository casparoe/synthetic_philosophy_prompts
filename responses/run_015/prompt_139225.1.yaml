prompt: |-
  Hey — I run a weekly discussion section attached to a pretty applied "ethics and public health" lecture, and next week I've got 70 minutes with about eighteen second-years (mostly public-health and nursing, a couple of criminology, one older guy auditing who is very talkative and very wrong), and the thing I have to get across is the difficulty of telling a preference apart from a bias in moral contexts. Not "bias is bad, mmkay" — the actual hard case: someone sincerely avows X, X is clearly shaped by the situation they grew up in, and we have to decide whether respect for persons requires us to treat X as theirs or whether we're watching an attitude that got installed in them. Last time I ran this I opened with a definition — bias as a judgement that distorts, preference as one that doesn't — and by minute ten a student said "so a bias is just a preference you don't like" and I never really recovered the room. So don't explain the distinction to me; plan how I should build it.

  What I care about most is the dependency structure, because I have a hunch about the order but can't get it to feel forced rather than arbitrary. The pieces I think are in play: that a person can fully endorse an attitude and it can also be a product of conditions they'd have reason to reject, and that those aren't in competition; that where an attitude came from isn't the same question as what authority it has, in both directions (an evolutionary or socialisation story doesn't refute it and doesn't vindicate it either); that "but what would she have wanted otherwise" is empty unless you say which alternative you're comparing to, and that picking the alternative quietly decides the answer; and that plenty of biases sit not in a false factual belief but in what gets weighted or noticed, so the shortcut of saying biases are about facts and preferences about values won't survive contact with the room. Tell me which of these genuinely has to precede which — where a later move would be unintelligible or would look like a dodge if it came earlier — and where, if anywhere, I should let a misconception sit for a bit instead of killing it immediately.

  Then the carrying example. I want one case that can be reopened three or four times as the session gets more refined rather than a pile of illustrations, and I want you to say what such a case must have and must lack: I'm thinking it can't turn on an empirically false claim (so not the "group X is congenitally bad at Y" sort of thing, where the answer is just "that's false" and the interesting question never arises), it has to involve someone who endorses the attitude in the first person, there should be a plausible mechanism for how they got it that isn't by itself decisive, and ideally the section splits roughly down the middle on first hearing. My candidate — tell me if it's any good or if it trips something I haven't noticed — is the town I'm from, where most people end up at the same plant, the kids say flatly that they'd rather take the plant job than go away to university, they say it with real warmth and not obviously under duress, and the school has basically never shown them any other option being livable. Also: if you'd avoid the usual ones — the grapes, Mill's dissatisfied-philosopher-versus-contented-animal comparison, the contented slave, the woman who says she chose the veil herself — say briefly why each one is worse as the spine of the session, since I've definitely reached for at least two of them before.

  Misconceptions, in the order you'd actually expect them to arrive from this specific audience (they're a practical, slightly policy-minded bunch, they like being told something is "just a value"), and the exact point in the sequence to head each off: bias = a preference the speaker disapproves of; sincerely felt plus it makes her life go better, therefore preference; science explains it, therefore not a reason; its mirror, it's natural or deep-seated, therefore fine; behaviour reveals the real preference so just look at what people do; the autonomy rescue where it counts as her preference because she chose it under her own values, which I think is circular but can't say why in one line; and the shrug that if there's no algorithm the whole distinction is decorative. There's also one thing I specifically want placed well: we scrutinise the wants of some groups for hidden bias and treat the wants of other groups as simply given, and with this crowd raising that too early makes everybody defensive and too late makes it look like an afterthought — so tell me where it goes and what has to be built before it lands as a point about method rather than an accusation.

  I've been toying with a term for one bit of this and I'm not sure whether it helps or just smuggles my conclusion in: "preference laundering" for the process by which an attitude stops reading as a bias and starts reading as a respected preference because the institutions around it make that attitude cheap to express and expensive to revise. Tell me whether to bring it in at all, and if so where, and whether it's secretly just a relabelling of the thing I'm supposed to be teaching. I also want a closing check that isn't "who can define bias" — something where I can tell from their answer whether they've got the structure or have justlearnt the vocabulary — plus an explicit list of what to leave out at this level and say out loud that I'm leaving out (I'm imagining the metaphysics of a true self, whether wellbeing is desire-satisfaction, the measurement literature on implicit attitudes, and the regress about whether any moral judgement survives this treatment, but you tell me). Obv this is all judgement calls, so as you go: tell me how confident you are in each part of the plan and single out the one bit you're least sure of — especially anywhere the plan quietly depends on a contested empirical claim about how attitudes form.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 70-minute discussion section, ~18 students (2nd year, mostly public health/nursing, some criminology, one talkative/older/incorrect auditor).
      *   **Topic:** Distinguishing *preference* from *bias* in moral contexts (specifically: sincere avowals shaped by upbringing vs. authentic agency).
      *   **Goal:** Build the distinction through dependency structure, not definition. Avoid "bias is bad."
      *   **Key Philosophical Pieces:**
          1.  Endorsement $\neq$ Independence from causal history.
          2.  Origin $\neq$ Authority (genetic fallacy in both directions).
          3.  Counterfactuals ("what would she want otherwise") require specified alternatives.
          4.  Bias isn't just factual error; it's weighting/salience.
      *   **Constraints:**
          *   Need a dependency order (what must come before what).
          *   Need a single "carrying example" (reusable, not empirically false, sincere endorsement, plausible mechanism, 50/50 split).
          *   Evaluate the user's candidate (hometown plant vs. university).
          *   Avoid standard examples (grapes, Mill, contented slave, veil) and explain why.
          *   Address specific misconceptions in order of arrival.
          *   Place the "scrutinizing some groups more than others" point strategically.
          *   Evaluate the term "preference laundering."
          *   Design a closing check (structural understanding, not vocab).
          *   List exclusions (what to explicitly leave out).
          *   Confidence levels + identify the weakest link (empirical claims).

  2.  **Deconstruct the Dependency Structure:**

      *   *Problem:* If I start with "Where did it come from?", students say "Origins don't matter." If I start with "Do they endorse it?", students say "Then it's a preference."
      *   *Solution:* I need to establish that *both* matter but neither is sufficient.
      *   *Order:*
          1.  **Phenomenology first:** Establish the sincerity. (If they don't believe the agent *feels* it, they'll just call it false consciousness).
          2.  **The Factual Trap:** Show that bias isn't just factual error. (If they think bias = false belief, the plant example dies because the plant *is* a viable option).
          3.  **The Causal Story:** Introduce the shaping mechanism. (Now they see the tension).
          4.  **The Counterfactual Test:** Show that "what else would they choose" is rigged by the menu. (This attacks the "just let them choose" defense).
          5.  **The Political/Methodological Turn:** Who gets scrutinized? (Now that the *structure* of the problem is clear, we can ask *who* we apply this structure to without it feeling like an attack).

  3.  **Evaluate the Carrying Example (Hometown Plant):**

      *   *Pros:* Sincere endorsement ("warmth"), plausible mechanism (school never showed options), not empirically false (plant jobs exist), 50/50 split (some see stability/pride, some see limited horizon).
      *   *Cons:* Might trigger "economic determinism" too fast (i.e., "they have no money, so it's not a choice"). Need to ensure the *cultural* shaping is highlighted, not just the financial constraint.
      *   *Verdict:* It's strong. It beats the "contented slave" (too charged, shuts down debate), "veil" (too culturally specific/politicized immediately), "grapes" (too abstract), "Mill" (too elitist).
      *   *Refinement:* Emphasize that the plant job is *good* (pays well, safe), so it's not about coercion, but about the *imaginative horizon*.

  4.  **Map Misconceptions to the Sequence:**

      1.  *Bias = Preference I dislike:* Kill this immediately in the framing (Minute 5).
      2.  *Sincerely felt + life goes well = Preference:* Address after establishing phenomenology (Minute 15).
      3.  *Science explains it = Not a reason:* Address when discussing the causal story (Minute 30).
      4.  *Natural/Deep-seated = Fine:* Address alongside the above.
      5.  *Behavior reveals real preference:* Address when discussing the counterfactual (Minute 45).
      6.  *Autonomy Rescue (Chose under own values):* Address late, as the "hard mode" objection (Minute 55).
      7.  *No Algorithm = Decorative:* Address in the wrap-up (Minute 65).
      8.  *Scrutinizing some groups more:* Place *after* the structural tools are built but *before* the final wrap-up. If too early, it's defensive. If too late, it's an add-on. Best spot: After the Counterfactual Test, before the Autonomy Rescue.

  5.  **Evaluate "Preference Laundering":**

      *   *Risk:* Sounds like a conclusion ("It *is* laundering").
      *   *Benefit:* Names the institutional process.
      *   *Decision:* Use it, but late. It's the name for the *mechanism* discovered in the Counterfactual/Scrutiny phase. Don't use it to define the problem; use it to describe the solution/observation.

  6.  **Drafting the Plan (Iterative Process):**

      *   *Opening:* Don't define. Start with the Plant Case. Ask: "Preference or Bias?" Vote. (Gets the 50/50 split).
      *   *Phase 1: The Sincerity Trap.* Why isn't "they mean it" enough? (Distinguish endorsement from authorship).
      *   *Phase 2: The Fact/Value Trap.* Why isn't "they know the facts" enough? (Bias is salience/weighting).
      *   *Phase 3: The Counterfactual Trap.* "Would they choose otherwise?" Show how the menu is rigged.
      *   *Phase 4: The Political/Methodological Turn.* Who do we test this way? (The "Scrutiny" point).
      *   *Phase 5: The Autonomy Rescue.* "But they own these values now." (The hardest objection).
      *   *Closing:* The "Policy Memo" check.

  7.  **Refining the Dependencies (The "Why" of the Order):**

      *   Must establish *Sincerity* before *Causality*. If they think the agents are lying or coerced, the philosophical problem vanishes (it's just force).
      *   Must establish *Bias $\neq$ False Fact* before *Causality*. If bias is just error, the causal story is irrelevant (just correct the error).
      *   Must establish *Counterfactuals* before *Scrutiny*. You can't accuse someone of uneven scrutiny until you agree on what the test *is*.
      *   Must establish *Scrutiny* before *Autonomy Rescue*. The rescue tries to bypass the structural critique; the scrutiny point shows why that bypass is politically loaded.

  8.  **Addressing the "Talkative/Wrong Auditor":**

      *   Give him a role. "Mr. X, I want you to hold the 'It's just a preference' line until Minute 40." Or, use his wrongness as the "Common Sense" view that the class needs to complicate. *Better:* Don't single him out publicly (rude), but anticipate his arguments in the misconception list and invite the *room* to answer them.

  9.  **Exclusions:**

      *   Metaphysics of True Self (too abstract).
      *   Wellbeing theories (too broad).
      *   Implicit Association Test details (too empirical/technical).
      *   Global Skepticism (too nihilistic).

  10. **Confidence & Weakest Link:**

      *   High confidence on the structure.
      *   Weakest link: The empirical claim that "imaginative horizons" can be shaped without "coercion." This is the sociological hinge. If students think "limited horizon = coercion," the distinction collapses. I need to flag this.

  11. **Final Review against Constraints:**

      *   70 mins? Yes.
      *   18 students? Yes (discussion heavy).
      *   Dependency structure explicit? Yes.
      *   Example evaluated? Yes.
      *   Misconceptions ordered? Yes.
      *   "Preference Laundering" placed? Yes.
      *   Closing check designed? Yes.
      *   Exclusions listed? Yes.
      *   Confidence levels included? Yes.

  12. **Writing the Response:** (Focusing on tone: professional, peer-to-peer, precise). *Self-Correction during drafting:* Make sure I explicitly answer *why* the standard examples fail, as requested. Ensure the "Scrutiny" point doesn't feel like an accusation.

      *   *Refining the "Scrutiny" placement:* It needs to come after the class agrees that *checking for bias is legitimate* but *hard*. If I ask "Who do we check?" before they agree *how* to check, it's just identity politics. If I ask after they see the difficulty, it's methodological rigor.

      *   *Refining the "Closing Check":* Instead of "Define bias," ask them to apply the *test* to a new, tiny scenario. Or ask them to identify which *step* of the argument is the bottleneck. Let's go with "The Policy Memo" prompt: "Write one sentence justifying intervention vs. non-intervention based on the distinction."

      *   *Refining "Preference Laundering":* It's a strong term. Use it in the last 10 minutes as a synthesis tool.

      *(Self-Correction on the Auditor)*: The prompt mentions him specifically. I should advise on how to manage him without derailing. He represents the "Common Sense" view. Use him as the "Devil's Advocate" anchor.

      *(Final Polish)*: Ensure the distinction between "Origin" and "Authority" is clear in the plan.

      *Let's build the response.*
answer: |-
  This is a sharp brief. You are right to avoid definitions; definitions are the graveyard of this discussion because they invite counter-examples rather than structural thinking. You need a *procedure* they can run, not a *category* they can memorize.

  Here is the dependency structure, the case evaluation, and the run-of-show.

  ### 1. The Dependency Structure (The Order of Operations)

  You identified four philosophical pieces. Here is the order in which they must be deployed to prevent the room from collapsing into "it's all just preferences" or "it's all just brainwashing."

  1.  **Phenomenology (Sincerity) $\rightarrow$ 2. Salience (Bias $\neq$ Fact) $\rightarrow$ 3. Counterfactuals (The Menu) $\rightarrow$ 4. Scrutiny (The Method).**
      *   **Why this order?**
      *   **Step 1 (Sincerity):** If you start with causal history (socialization), the room immediately jumps to "So it's not real/it's coercion." You must first establish that the agent *owns* the attitude. If they don't own it, it's not a preference *or* a bias; it's a delusion or force.
      *   **Step 2 (Salience):** If you move from Sincerity straight to Counterfactuals, students will say, "They know the facts, they just value stability." You must establish that bias operates on *weighting*, not just factual error. This blocks the "just educate them" solution.
      *   **Step 3 (Counterfactuals):** Once you have Sincerity + Salience, you have a tension. Now you introduce the causal story via the Counterfactual Test ("Would they want this if the menu were different?"). This is where the "Origin $\neq$ Authority" point lands. It shows that the *range* of options determines the *validity* of the choice.
      *   **Step 4 (Scrutiny):** This must come **last** (or second to last). If you ask "Who do we scrutinize?" before the class agrees on *how* to scrutinize (Steps 1-3), it lands as a political accusation ("You're only checking poor people"). If you ask it after they have built the tool, it lands as a methodological consistency check ("We are applying this tool unevenly").

  **Confidence:** High on the sequence.
  **Weakest Link:** Step 2 (Salience). This depends on the empirical claim that people can be fully informed yet systematically mis-weight values due to environment. If your students are hardline rationalists, they may reject this as "irrational." You need to hold this line firmly.

  ### 2. The Carrying Example: The Hometown Plant

  **Verdict:** Use it. It is superior to the standard examples for this specific crowd.

  **Why the others fail:**
  *   **The Contented Slave:** Too charged. It forces a "freedom is absolute" stance that shuts down nuance. Students dig in on "slavery is wrong" rather than analyzing the preference structure.
  *   **The Veil/Religious Attire:** Immediately triggers culture-war defensiveness. The "bias" question gets swallowed by "respect for tradition."
  *   **Mill's Philosopher vs. Pig:** Too elitist. Public health/nursing students will rightly reject the idea that higher cognition = better preference.
  *   **Sour Grapes:** Too individual/psychological. Doesn't capture the *institutional* shaping you want to highlight.

  **Why the Plant works:**
  *   **Sincerity:** It allows for genuine warmth/pride (not just fear).
  *   **Mechanism:** The "school never showed options" is a structural constraint on imagination, not just a financial constraint.
  *   **Split:** Public health students might see "health risk/stagnation"; Criminology/Sociology might see "community cohesion/stability."
  *   **No False Facts:** The plant pays well. It's not a scam. This forces the bias question to be about *horizons*, not *truth*.

  **Crucial Modification:** You must explicitly stipulate that the plant job is *objectively good* (safe, pays living wage). If it's a toxic job, the distinction collapses into "they are being harmed." The hard case is when the object of the preference is *good*, but the *exclusivity* of the preference is shaped.

  ### 3. Run-of-Show (70 Minutes)

  **00:00 – 05:00: Framing (No Definitions)**
  *   **Action:** Put the Plant Case on the board. "Town A. Plant pays \$30/hr. School guidance counselors never mention university. Kids say: 'I want the plant. It's good work.' Vote: Is this a Preference or a Bias?"
  *   **Goal:** Get the 50/50 split.
  *   **Manage the Auditor:** If the talkative auditor jumps in with "It's their life, let them," nod and say, "Hold that thought. That's the 'Sincerity' position. We're going to stress-test it."

  **05:00 – 15:00: Phase 1 - The Sincerity Trap**
  *   **Move:** Ask the "Bias" camp: "They say they want it. They aren't lying. Why isn't that the end of the story?"
  *   **Misconception Kill:** *Bias = Preference I dislike.*
      *   **Intervention:** "If we call this bias just because we think university is better, we are being snobs. We need a reason that works even if we think the plant is great."
  *   **Takeaway:** Endorsement is necessary but not sufficient. (Piece 1: Endorsement $\neq$ Independence).

  **15:00 – 25:00: Phase 2 - The Fact/Value Trap**
  *   **Move:** Ask the "Preference" camp: "They know the plant exists. They know uni exists (vaguely). They aren't factually wrong. So where is the distortion?"
  *   **Misconception Kill:** *Biases are factual errors; Preferences are values.*
      *   **Intervention:** "Suppose they know everything about uni but just can't *imagine* themselves there. The facts are clear; the salience is skewed. Is that a bias?"
  *   **Takeaway:** Bias lives in weighting/salience, not just false belief. (Piece 4: Weighting vs. Facts).

  **25:00 – 40:00: Phase 3 - The Counterfactual Test**
  *   **Move:** "Okay, how do we check the weighting? We ask: What would they choose if...?"
  *   **Trap:** Students will say "If they were free."
  *   **Correction:** "Free from what? Money? Culture? Fear?"
  *   **Misconception Kill:** *What would she have wanted otherwise.*
      *   **Intervention:** "If you say 'If they were middle class,' you've already decided it's a bias. If you say 'If nothing changed,' you've decided it's a preference. The counterfactual decides the answer."
  *   **Takeaway:** Origin stories don't refute/validate, but the *specific alternative history* matters. (Piece 2 & 3: Origin/Authority & Counterfactuals).

  **40:00 – 50:00: Phase 4 - The Scrutiny Turn (The Political Point)**
  *   **Move:** "We just built a test. We check the counterfactual menu. Now: Who do we run this test on?"
  *   **Placement:** This is the sweet spot. You have built the *tool* (Phases 1-3). Now you ask about *application*.
  *   **Misconception Kill:** *We scrutinize some groups' wants and treat others as given.*
      *   **Intervention:** "Do we ask the CEO's kid if they *really* want finance, or if it's just what was expected? If we only run the 'Plant Test' on the Plant Town, is that science or prejudice?"
  *   **Goal:** Make this a methodological consistency point, not an accusation. "If this distinction matters, it must apply universally."

  **50:00 – 60:00: Phase 5 - The Autonomy Rescue**
  *   **Move:** "Hard mode. Suppose they grew up in Plant Town, left, saw the world, came back, and *still* chose the plant. Is it still a bias?"
  *   **Misconception Kill:** *Autonomy Rescue (Chose under own values).*
      *   **Intervention:** "If the values themselves were installed by the town, does 'choosing under your values' just mean 'choosing under the town's values'?"
      *   **Note:** This is where you let the Auditor speak. He represents the "Ultimate Responsibility" view. Let him make the circularity claim, then ask the room: "Is circularity fatal, or is it just where agency starts?"
  *   **Takeaway:** Acknowledge the regress. We stop where intervention becomes disrespect.

  **60:00 – 65:00: "Preference Laundering"**
  *   **Decision:** **Use the term here.**
  *   **Why:** You've just described the process (Institutions make an attitude cheap to express/expensive to revise). Now give it a name.
  *   **Usage:** "This process, where the environment makes one option invisible and the other default, until it looks like a 'choice'—let's call this *Preference Laundering*. It's not a new definition; it's the name for the mechanism we just found."
  *   **Risk Check:** It doesn't smuggle the conclusion because you've already done the work to define the mechanism. It acts as a summary label.

  **65:00 – 70:00: Closing Check (Structural, not Vocab)**
  *   **Don't ask:** "Define bias."
  *   **Do ask:** "The Policy Memo Check."
  *   **Prompt:** "You are a public health director. You have \$10k. Do you spend it on (A) Career Counseling for Plant Town kids, or (B) Mental Health Support for kids who feel forced into Uni? Justify using the *Counterfactual Test*, not the word 'bias'."
  *   **Success Metric:** If they argue about the *menu* (what options were visible), they get it. If they argue about the *outcome* (which job is better), they missed the point.

  ### 4. Misconception Management Table

  | Misconception | Arrival Time | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"Bias = Preference I dislike"** | Minute 10 | **Kill Immediately.** "If I like the plant, is it still a bias? If yes, 'dislike' isn't the definition." |
  | **"Sincerely felt + Life goes well = Preference"** | Minute 15 | **Delay.** Let it sit through Phase 1. Kill in Phase 2 (Salience). "Wellbeing doesn't prove authorship." |
  | **"Science explains it = Not a reason"** | Minute 30 | **Reframe.** "Evolution explains love. Does that mean love isn't a reason? Origin $\neq$ Authority." |
  | **"Natural/Deep-seated = Fine"** | Minute 30 | **Pair with above.** "Appendicitis is natural. Doesn't mean it's good." |
  | **"Behavior reveals real preference"** | Minute 45 | **Challenge.** "If the only behavior available is the plant, behavior tells us nothing about the counterfactual." |
  | **"Autonomy Rescue (Circular)"** | Minute 55 | **Acknowledge.** "It is circular. The question is: is it a *vicious* circle? Where do we cut the line?" |
  | **"No Algorithm = Decorative"** | Minute 65 | **Reframe.** "Medicine has no algorithm for 'quality of life.' We still judge it. Difficulty $\neq$ Futility." |
  | **"Scrutinizing Some Groups More"** | Minute 40 | **Strategic Placement.** Must come *after* the tool is built (Phase 3) but *before* the final rescue (Phase 5). |

  ### 5. Exclusions (What to Leave Out)

  Explicitly tell the students: "We are bracketing four things today. Not because they don't matter, but because they will break the circuit."
  1.  **Metaphysics of the True Self:** "We aren't solving free will. We are looking at social mechanics."
  2.  **Wellbeing Theories:** "We aren't deciding if the plant job is *good*. We are deciding if the *want* is theirs."
  3.  **Implicit Measurement:** "We aren't talking about IAT scores. We are talking about avowed, sincere claims."
  4.  **Global Skepticism:** "We aren't asking if *all* preferences are biased. We are asking how to tell *this* one apart."

  ### 6. Confidence & The Weakest Link

  *   **High Confidence:** The dependency order (Phenomenology $\rightarrow$ Salience $\rightarrow$ Counterfactual $\rightarrow$ Scrutiny). This prevents the "brainwashing" vs. "freedom" binary.
  *   **High Confidence:** The Plant Example. It is robust enough to withstand the "but is it coercion?" objection if you stipulate the wages/safety.
  *   **Low Confidence (The Weakest Link):** The empirical claim in Phase 2 (Salience). You are asking students to accept that an agent can be fully informed yet have their *valuation* skewed by socialization without it being "coercion."
      *   *Risk:* A smart student (or the auditor) will say, "If their valuation is skewed by their environment, that *is* coercion, just soft coercion. So it's not a preference."
      *   *Mitigation:* You must distinguish between *constraining the options* (coercion) and *constraining the imagination of options* (shaping). If they conflate these, the distinction vanishes. Be prepared to draw that line sharply: "Coercion makes the other option impossible. Shaping makes the other option unintelligible. Public health treats these differently."

  ### 7. Managing the Auditor

  He is a resource, not a threat. He represents the "Common Sense Libertarian" view that the room needs to overcome.
  *   **Do not:** Correct him publicly every time.
  *   **Do:** "Mr. [Name] is holding the line on the 'Sovereign Individual' view. That's the baseline we are testing. Class, can we find a crack in that armor without throwing away the person?"
  *   **Why:** This validates him (keeps him from derailing) while framing his view as the *object of inquiry* rather than the *truth*.

  ### Summary of the "Preference Laundering" Term
  Bring it in at Minute 60. It is not a relabeling; it is the *synthesis*. You have spent 50 minutes describing the mechanism (institutions making attitudes cheap to express/expensive to revise). Now you give them the handle for it. It helps them take the concept out of the room.

  **Final Check:** Does this meet the "forced rather than arbitrary" constraint?
  Yes, because each step solves a failure of the previous one.
  *   Sincerity fails to distinguish $\rightarrow$ Need Salience.
  *   Salience fails to locate the error $\rightarrow$ Need Counterfactuals.
  *   Counterfactuals fail to specify the alternative $\rightarrow$ Need Scrutiny/Method.
  *   Scrutiny fails to account for agency $\rightarrow$ Need Autonomy Rescue.
  The room moves because the previous position runs out of road, not because you tell them to turn the page.
