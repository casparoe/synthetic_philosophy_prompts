answer: |-
  Dear Friend,

  You asked for a rigorous testing of upamāna against the Buddhist reductionist view, so I spent last evening imagining a debate between a staunch Naiyāyika and a follower of Dignāga to see if comparison truly stands as a separate source of knowledge. They began with the standard case, where the Naiyāyika argued that when a man who knows cows is told a gavaya is like a cow, and later sees a gavaya in the forest and recognizes it, this knowledge arises from the relation of similarity itself. The Buddhist immediately countered that this is merely inference based on testimony; the man hears the words, recalls the image of a cow, perceives the animal, and infers the identity based on shared properties, requiring no new epistemic category. The Naiyāyika insisted that the cognitive event of linking the name to the form via similarity is immediate and distinct from the slow stepwise process of inference, but the Buddhist pressed that immediacy does not prove independence.

  They then moved to your first variation, the reverse case, where the learner knows gavayas and is told a cow is like a gavaya. The Naiyāyika claimed this proves the symmetry of the relation, showing upamāna works regardless of which term is the known base. The Buddhist replied that this changes nothing epistemologically, as it is still just recalling a known concept to identify a new percept, which remains a form of inference based on similarity. When they considered the chained case, where the comparison base is known only from testimony and never perceived, the Naiyāyika faltered slightly, admitting that if neither animal is seen, the knowledge rests entirely on śabda, or testimony. The Buddhist seized this, arguing that if the chain never touches direct acquaintance, upamāna collapses into testimony, and if it does touch perception, it collapses into perception and inference, leaving no middle ground.

  The debate grew sharper with the contrastive case, where the learner is told only what the animal is unlike. The Naiyāyika argued that knowing what something is not still establishes a boundary of similarity by exclusion, which is a unique function of comparison. The Buddhist dismissed this as inference by elimination, a standard logical move that requires no special pramāṇa. They struggled most with the revision case, where a detailed description conflicts with the initial resemblance. The Naiyāyika conceded that the initial identification could be withdrawn, but maintained that the initial knowledge was still valid upamāna at the time, later overridden by better testimony. The Buddhist argued that if the identification can be so easily undone by new information, it was never secure knowledge to begin with, but merely a probabilistic guess masquerading as a pramāṇa.

  This led them to your test regarding the defeat profile. The Buddhist pressed hard here, arguing that upamāna only fails when perception fails, such as seeing poorly in the fog, or when testimony fails, such as being given a false description. He insisted that there are no unique ways for comparison to go wrong that are not already covered by the failure of its inputs. The Naiyāyika offered a serious reply, suggesting that the unique failure mode is the misalignment of the relation itself. He argued that one can perceive perfectly and hear testimony perfectly, yet fail to map the name to the form correctly because the similarity was misunderstood, not because the senses or the speaker failed. This specific disconnect, the failure of the linking function rather than the inputs, he claimed is the unique defeat condition of upamāna. The Buddhist conceded that the cognitive act of linking is real but denied it warrants a separate source of knowledge, comparing it to memory, which is acknowledged as a cognitive event but not a pramāṇa.

  In the end, both philosophers stepped back from their corners. The Buddhist admitted that the cognitive phenomenology of recognition feels distinct from standard inference, acknowledging that the speed and directness of the identification mimic perception in a way that pure inference does not. The Naiyāyika conceded that upamāna is heavily dependent on the other pramāṇas for its raw material, admitting it cannot stand entirely alone without perception and testimony to provide the terms of comparison. They finished by agreeing that upamāna survives as a distinct cognitive process with a unique function of mapping names to forms via similarity, but whether it merits the full status of an irreducible pramāṇa depends on whether one values the uniqueness of the cognitive act or the independence of the data source. For your volunteers, this suggests that teaching identification is not just giving data but training a specific relational skill that is prone to its own unique errors of mapping, distinct from simply seeing or listening. I hope this helps you refine your training, and I look forward to hearing how your guides fare in the field.

  Yours,

  A Fellow Student
