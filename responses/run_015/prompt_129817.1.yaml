      *   *Dennett:* Challenges the idea that there's a "real" stream of consciousness even in waking life, let alone sleep. Regarding dreams, he suggests the "story" is constructed at the moment of waking/reporting, not necessarily recalled from a stored experience. It undermines the intuition that there *must* have been an experience prior to the report.
      *   *Tension:* Malcolm says it's conceptually impossible to have experiences during sleep. Dennett says the intuition that we *did* have experiences is based on a flawed model of memory and narrative (the "Cartesian Theater" vibe, though maybe too advanced to name-drop). For 2nd years unfamiliar with Phil Mind, keep it focused on the *timing* and *criteria* of the experience.

