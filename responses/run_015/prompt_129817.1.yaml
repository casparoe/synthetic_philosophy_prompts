answer: |-
  # Seminar Plan: The Ontology of Dreaming (75 Minutes)

  ## (a) Ordered Sequence of Conceptual Pieces

  **1. The Cartesian Hook (10 minutes)**
  *   **Concept:** The indubitability of present experience vs. the uncertainty of past experience.
  *   **Move:** Leverage student familiarity with Descartes. Remind them that for Descartes, the *Cogito* secures the existence of the thinking thing *now*, but memory is susceptible to the Evil Demon.
  *   **Dependency:** This must come first to establish that "experience" is tied to *current awareness*. If you begin with the dream scenario directly, students will treat "experience" as a naive realist fact rather than a philosophical problem.

  **2. Malcolm's Criterion of Ascription (20 minutes)**
  *   **Concept:** The logical link between "having an experience" and "being able to report it."
  *   **Move:** Introduce the claim that the statement "I was experiencing X while asleep" lacks a verification criterion distinct from "I say I experienced X upon waking."
  *   **Dependency:** This must precede Dennett. Malcolm establishes the *conceptual* barrier: it is not that we *can't know* if dreams happened, but that the sentence "dreams happened during sleep" is grammatically/conceptually void. If Dennett is introduced first, students will interpret the problem as *epistemic* (we can't access the dream) rather than *conceptual* (the concept of 'during sleep' excludes 'experience').

  **3. Dennett's Narrative Construction (20 minutes)**
  *   **Concept:** The retroactive fabrication of the stream of consciousness.
  *   **Move:** Challenge the intuition that a report *must* correspond to a prior stored event. Suggest the narrative is generated at the moment of waking, not retrieved from a storage bank filled during sleep.
  *   **Dependency:** This relies on Malcolm having already weakened the link between report and prior experience. If Malcolm hasn't secured the idea that the report is the only criterion, Dennett's claim looks like a empirical hypothesis about memory failure rather than a challenge to the structure of consciousness.

  **4. The Synthesis of Skepticism (15 minutes)**
  *   **Concept:** Distinguishing between "Dreams do not exist" and "Dreams are not experiences occurring during sleep."
  *   **Move:** Clarify that neither philosopher denies people say "I dreamed." They deny what that sentence implies about time and consciousness.
  *   **Dependency:** This must come last. Without the prior steps, students will conflate the two positions into a simple "Dreams aren't real" slogan.

  **Risk of Reversal:** If Dennett precedes Malcolm, students will treat the seminar as a debate about memory reliability (psychology) rather than criteria for experience (philosophy). Malcolm's argument collapses if students believe there is a "fact of the matter" about the sleep period that Dennett is simply denying access to. Malcolm must remove the "fact of the matter" first so Dennett can explain why we think there is one.

  ## (b) The Carrying Scenario: "The Immediate Report"

  **Scenario Description:**
  A subject lies down in a soundproof room. They fall asleep. An alarm sounds. The subject wakes instantly and immediately speaks into a recorder: "I was dreaming that I was flying."

  **What the Scenario Must Contain:**
  1.  **Temporal Continuity:** There must be no gap between the waking moment and the report. (This prevents students from arguing memory decay occurred *after* waking).
  2.  **Sincerity:** The subject must be stipulated as honest and not lying. (This prevents students from dismissing the report as deception).
  3.  **Isolation:** No external observers during the sleep period. (This forces reliance on the subject's authority).

  **What the Scenario Must Omit:**
  1.  **Physiological Data:** No mention of eye movement, muscle atonia, heart rate, or brain waves.
  2.  **Sleep Depth:** No specification of whether the subject was in "deep" sleep or "light" sleep.
  3.  **Content Specificity:** The dream content ("flying") must be generic enough not to trigger debates about lucid dreaming or physical impossibility.

  **Function:** This scenario isolates the *logical gap* between the waking utterance and the alleged sleep experience. It forces students to ask: What makes the utterance true? Is it the past event (flying during sleep) or the present utterance (saying "I was flying")?

  ## (c) Predictable Misconceptions and Interceptions

  **1. The "Internal Theater" Misconception (VR/Simulation Import)**
  *   **The Misconception:** Students will argue that the brain "runs a simulation" during sleep, similar to a VR headset, implying a "viewer" inside the head watching the dream while the body sleeps.
  *   **Interception Point:** During **Malcolm's Criterion** section (Step 2).
  *   **Interception Method:** When a student suggests the brain "plays the movie," ask: "Who is watching the movie?" If they say "the mind," ask "Is the mind awake or asleep?" If asleep, how does it watch? If awake, is it sleep? Force them to see that the VR analogy smuggles in a waking subject into a state defined by the absence of a waking subject.

  **2. The "Empirical Override" Misconception**
  *   **The Misconception:** Students will claim neuroscience has "solved" this by locating dream activity in the brain.
  *   **Interception Point:** At the very beginning of the seminar, before Step 1.
  *   **Interception Method:** Use the bracketing wording defined in Section (e). Do not engage the argument; suspend the premise.

  **3. The "Memory Failure" Misconception**
  *   **The Misconception:** Students will interpret Dennett as saying "We dream, but we forget the details," treating it as a storage error.
  *   **Interception Point:** During **Dennett's Narrative Construction** section (Step 3).
  *   **Interception Method:** Explicitly contrast "forgetting a file" vs. "never having written the file." Use the analogy of a journalist writing a story based on a headline rather than notes. If they insist on "forgetting," ask them to describe the mechanism of storage without using brain imagery (which is bracketed).

  ## (d) Closing Question/Task

  **Task:** "Write down one sentence that Norman Malcolm would classify as **conceptual nonsense** (grammatically incorrect) but that Daniel Dennett would classify as **empirically false** (a mistaken claim about how things work)."

  **Rationale:**
  *   To answer correctly, the student must understand that Malcolm objects to the *logic* of the language (e.g., "I was conscious while unconscious"), whereas Dennett objects to the *assumption* of a fixed narrative (e.g., "The dream existed fully formed before I woke up").
  *   If a student writes "Dreams do not exist," they have failed (both might agree the *object* doesn't exist, but disagree on why).
  *   If a student writes "The brain creates dreams," they have failed (both bracket the brain).
  *   A successful answer looks like: Malcolm targets "I experienced X while asleep"; Dennett targets "The experience of X was stored during sleep."
  *   This distinguishes grasping the *dispute* (conceptual vs. narrative) from merely adopting a *conclusion* (skepticism).

  ## (e) Bracketing Empirical Material

  **Material to Bracket:**
  *   REM (Rapid Eye Movement) sleep correlations.
  *   Neuroimaging (fMRI/EEG) data regarding brain activity during sleep.
  *   Sleep-stage classifications (Stage 1-4, REM, NREM).
  *   Physiological markers of dreaming (twitching, breathing patterns).

  **Exact Wording for Bracketing:**
  > "We are explicitly setting aside all empirical data regarding sleep physiology, including brain scans and sleep-stage correlations. We do this not because this science is untrue or unimportant, but because our question today is not about what the brain *does* during sleep, but about what we *mean* when we say someone 'experienced' something during sleep. Even if we had a perfect scan of a dreaming brain, the philosophical problem of whether that scan proves an 'experience' occurred would remain. Therefore, for the next 75 minutes, we must treat the brain as invisible."
