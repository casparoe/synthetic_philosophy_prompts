  I'm trying to think through the Brexit mess and populism, specifically that 2016 referendum and then the Daily Mail "Enemies of the People" blowup after the High Court rulling said Parliament had to vote on Article 50. Analyze this episode through two ways of understanding "the will of the people": the standard aggregative view (count votes, 52% leave = the will) and a ventriloquist view where the movement constructs "the real people" by designating enemies — judges, MPs, Remainers — and claims their voice is prior to institutions. Map the actors and options carefully: who decides, what obedience to the court vs. bypassing Parliament looks like, and what each model predicts. Then say where the ventriloquist model actually explains the rhetoric and the homogenizing of "the people", and where it breaks — can it handle the 52/48 split, regional differences, or the fact that the vote wasn't legally binding? And reverse the lens: does this case prove populism is always ventriloquism, or does it show the model is so flexible it can explain anything?

