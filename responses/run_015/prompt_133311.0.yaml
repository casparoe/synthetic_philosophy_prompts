answer: |-
  To analyze the Brexit referendum and the subsequent *Daily Mail* "Enemies of the People" explosion, we must contrast two distinct models of democratic will. The **aggregative view** treats "the people" as a sum of individual preferences expressed through ballots; institutions mediate this sum according to established law. The **ventriloquist view** treats "the people" as a moral construct—a homogeneous, sovereign body whose true voice is channelled by leaders or movements against corrupt elites who betray them.

  ### Mapping the Episode: Actors and Options
  The focal event is the 2016 High Court ruling (*R (Miller) v Secretary of State*), which stated the Government could not trigger Article 50 using prerogative powers alone; Parliament must vote.

  *   **Actors:** The Government (Theresa May), the Judiciary (High Court/Supreme Court), Parliament (MPs/Lords), the Media (*Daily Mail*), and the Electorate (Leave/Remain).
  *   **Options:**
      1.  **Obedience:** Government accepts the ruling, Parliament votes to authorize Article 50 (the legal path).
      2.  **Bypass:** Government attempts to ignore the court and trigger Article 50 via executive order (the populist demand).
      3.  **Attack:** Delegitimize the court as obstructing the popular will (the *Mail* strategy).

  ### Model Predictions
  *   **Aggregative View:** Predicts calm procedural compliance. The referendum was advisory; therefore, Parliament must legislate to enact the result. The 52% Leave vote is a mandate to negotiate, not a suspension of constitutional law. A court ruling clarifying procedure should not generate moral outrage.
  *   **Ventriloquist View:** Predicts moral conflict. The "will of the people" is prior to institutions. Any institutional check (courts, MPs) is framed as elite sabotage. The 52% is not a statistic but a moral monolith. Obstacles must be designated as enemies to purify the people's voice.

  ### Analysis: Where the Ventriloquist Model Explains
  The *Daily Mail* headline ("Enemies of the People") is inexplicable under the aggregative view. Why label judges "enemies" for upholding constitutional procedure? The ventriloquist model explains this perfectly: the judges were not merely interpreting law; they were silencing the ventriloquized voice of the "real people."

  This model accounts for the **homogenization** of the Leave vote. Despite the 52/48 split, the rhetoric treated Leave as the only legitimate expression of national sovereignty. The 48% were not a loyal opposition; they were often framed as unpatriotic or elite dupes. The ventriloquist model explains why the advisory nature of the vote was ignored: in this framework, a referendum is not a legal mechanism but a moral revelation. The intensity of the backlash against the High Court was not about legal technicalities; it was about who holds the authority to speak for the nation.

  ### Where the Model Breaks (and Absorbs)
  The ventriloquist model faces empirical friction with the **52/48 split** and the **non-binding status** of the vote. Strictly speaking, "the people" were divided, and the law did not mandate immediate action. However, the model does not break here; it adapts through exclusion. It resolves the split by claiming the 48% do not represent the *true* people (often labelled as elites or traitors). It overrides the legal status by claiming moral supremacy over procedural correctness.

  The risk is **flexibility**. If the model explains both the vote (52% will) and the backlash against institutions checking that vote (people vs. elites), is it tautological? In this case, no. The rhetoric was explicit, not inferred. The *Mail* did not hint at populism; it declared war on the judiciary in the name of "The People." This textual evidence prevents the model from being merely a post-hoc fit.

  ### Reverse Lens: Populism and Flexibility
  Does this prove populism is always ventriloquism? It proves that when populism clashes with liberal institutions, it operates via ventriloquism. The aggregative view fails to predict the *temperature* of the conflict. It sees a legal dispute; the ventriloquist view sees a existential struggle for sovereignty. The model is not too flexible here because the actors themselves used its logic openly. They did not argue about statutory interpretation; they argued about betrayal.

  ### Stance
  This episode **mostly supports** the ventriloquist account. The aggregative view is descriptively inadequate because it cannot explain why a routine legal ruling triggered a crisis of legitimacy. Only the ventriloquist model captures the logic where institutions are not neutral arbiters but potential enemies of the popular will. While the model struggles with the empirical reality of a split vote, it successfully explains how populists *manage* that split through rhetorical exclusion. The Brexit mess was not a failure of counting votes; it was a conflict between two incompatible definitions of sovereignty, and the ventriloquist model accurately maps the populist definition that drove the controversy.

  Verdict: The episode mostly supports the ventriloquist account.
