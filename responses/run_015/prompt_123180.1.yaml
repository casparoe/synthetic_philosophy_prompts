answer: |-
  Based on your friend's track record, she isn't asking "which emotion is nicer?" She is asking "which emotion is *structurally legible* to the system?" She treats moral emotions like software protocols: they only run if the social hardware supports them.

  Here are the two rules that best explain her verdicts, how they apply to the forum, and the case that would break them apart.

  ### Rule 1: The Reintegration Constraint
  **The Principle:** Guilt is only functional if the system has a mechanism for **moral repair**. If a culture or structure allows a transgressor to pay a debt, be forgiven, and return to full standing, guilt works (it motivates repair). If the system treats transgression as a permanent stain or a terminal event (exile, firing, loss of face), shame is the only emotion that fits.
  *   **Fits Track Record:**
      *   *Religion:* Tight-knit (usually shame-prone), but **forgiveness rituals** allow repair $\rightarrow$ Guilt.
      *   *Democracy:* Anonymous, but **due process/rights** allow reintegration $\rightarrow$ Guilt.
      *   *Honor Societies:* No formal forgiveness; loss of face is permanent $\rightarrow$ Shame.
      *   *Workplaces:* Employment is "at-will"; mistakes lead to firing, not redemption $\rightarrow$ Shame.

  ### Rule 2: The Locus of Enforcement
  **The Principle:** Guilt requires an **internal or procedural judge** (conscience, law, God). Shame requires an **external social gaze** (peers, family, managers). If the enforcement mechanism is a visible score, a hierarchy, or a community watch, shame is the native emotion. If the enforcement is abstracted (a law, a prayer, a private conscience), guilt is native.
  *   **Fits Track Record:**
      *   *Honor Societies:* Enforcement is the **community gaze** $\rightarrow$ Shame.
      *   *Workplaces:* Enforcement is the **manager/HR** $\rightarrow$ Shame.
      *   *Democracy:* Enforcement is the **abstract Law** $\rightarrow$ Guilt.
      *   *Religion:* Enforcement is **God/Conscience** (internalized) $\rightarrow$ Guilt.

  ---

  ### Application to the Smart Contract Forum

  **Prediction:** She would say they must cultivate **Shame**.

  **The Reason:**
  While the *pseudonymity* mimics the anonymity of a democracy (which usually favors guilt), the **architecture** screams shame on both counts.
  1.  **Violation of Reintegration:** Smart contracts are immutable. Unless a specific "forgiveness function" is coded in, a reputational hit is permanent. There is no ritual to clear the debt; the ledger remembers forever. This triggers Rule 1 (Shame).
  2.  **Violation of Enforcement Locus:** The reputation score is *public*. The enforcement isn't an internal conscience or a private legal proceeding; it is a visible, algorithmic badge worn in the town square. The "gaze" is constant and external. This triggers Rule 2 (Shame).

  The fact that harm is "not physically embodied" doesn't save it. In her framework, the **Reputation Token** *is* the body in this architecture. Damaging the score is equivalent to slapping someone's face in an honor society. Without a coded ritual for restitution, the system relies on the fear of social exile (low score) to maintain order. That is the definition of a shame architecture.

  ---

  ### The Case That Splits the Rules

  To figure out which rule she prioritizes (or if she requires both), you need a case where **Reintegration is High** but **Enforcement is External**.

  **The Split Case: A Credit Score System with Bankruptcy Discharge.**

  *   **Why it splits them:**
      *   **Rule 1 (Reintegration) predicts Guilt:** Bankruptcy laws exist specifically to allow moral/financial repair. You can clear the debt and re-enter the economy. This matches the Religious/Democratic model.
      *   **Rule 2 (Enforcement) predicts Shame:** A credit score is a public (or semi-public) numerical judgment of your worth, visible to lenders and landlords. It is an external, quantitative gaze similar to the Forum's reputation score or the Workplace's performance review.

  **The Verdict Test:**
  *   If she says **Guilt** is better here, she prioritizes the **Reintegration Constraint**. She believes that as long as there is a "way back," external surveillance doesn't toxify the emotion.
  *   If she says **Shame** is better here, she prioritizes the **Locus of Enforcement**. She believes that once you subject moral standing to a public score, the possibility of forgiveness doesn't matter; the system will inevitably be used to caste people, making shame the only functional reality.

  Given her eye-roll at HR guilt-training (which often has *some* remediation path but is still hierarchical), my bet is she'd call Credit/Bankruptcy a **Shame** system. She likely views the *visibility of the score* as the dominant architectural feature that overrides the legal possibility of repair.
