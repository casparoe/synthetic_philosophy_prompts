answer: |-
  ### I. Unpacking the Maxim: Four Philosophical Theses

  The injunction to "do as the Romans do" is ambiguous. It can be parsed into four distinct philosophical claims regarding the source and scope of a visitor's obligations.

  **1. The Prudential Claim (Strategic Advisability)**
  *   **Thesis:** The maxim is not moral but instrumental. It advises conformity solely to minimize personal cost (social ostracization, bad service, legal hassle) and maximize benefit.
  *   **Implications:**
      *   **Tipping:** Tip only if withholding it risks confrontation or poor future service. If the worker won't notice or care, there is no duty to tip.
      *   **Queueing:** Queue only if cutting in line provokes aggression. If the crowd is passive, cutting is permissible.
      *   **Jaywalking:** Walk only if police are present or traffic is dangerous.
      *   **Locals vs. Visitors:** Visitors are bound *more strictly* than locals. Locals have established reputations and social capital that buffer them against sanctions; visitors are vulnerable outsiders. Thus, the prudential pressure is asymmetrical.
      *   **Moral vs. Strategic:** There is *no* moral obligation here, only strategic calculation.

  **2. The Strong Moral-Relativist Claim (Constitutive Normativity)**
  *   **Thesis:** Moral truth is geographically indexed. Local conventions do not merely reflect morality; they constitute it. An act is right *because* the locals do it.
  *   **Implications:**
      *   **Tipping:** If locals tip, not tipping is objectively morally wrong for the visitor. If locals do not tip, tipping is morally wrong (perhaps as ostentatious).
      *   **Queueing:** If the local norm is queuing, queue-jumping is a moral violation. If the local norm is a "scrum," queuing is the violation.
      *   **Jaywalking:** If locals cross against lights, stopping is the moral error (impeding flow); if they wait, crossing is the error.
      *   **Locals vs. Visitors:** No distinction. Presence in the territory subjects the agent to the local moral ontology. A visitor is morally bound to the same degree as a citizen.
      *   **Moral vs. Strategic:** All obligations are fully moral. Strategic costs are irrelevant to the rightness of the act.

  **3. The Tacit-Consent Claim (Contractual Obligation)**
  *   **Thesis:** By voluntarily crossing a border, a visitor implicitly agrees to abide by the host community's rules, analogous to entering a private club or signing a social contract.
  *   **Implications:**
      *   **Tipping:** The visitor has a duty to tip if it is a codified or well-publicized rule of the "club," regardless of personal belief.
      *   **Queueing:** The visitor is bound by the local queuing contract. Violating it is a breach of promise.
      *   **Jaywalking:** Traffic laws and norms are part of the territorial agreement. Violating them breaks the tacit contract.
      *   **Locals vs. Visitors:** Locals are bound by long-term residency/citizenship contracts; visitors by temporary entry contracts. The *source* of obligation differs (residence vs. entry), but the *scope* while present is identical.
      *   **Moral vs. Strategic:** The obligation is moral (pacta sunt servanda—promises must be kept), though the motivation for entering was likely prudential.

  **4. The Coordination-Indexed Claim (Cooperative Conventionalism)**
  *   **Thesis:** Conventions generate genuine but defeasible moral obligations only when they solve practical coordination problems. The obligation stems from the duty not to disrupt mutually beneficial equilibria.
  *   **Implications:**
      *   **Tipping:** Obligation exists only if tipping functions as a wage mechanism everyone relies on. If it is arbitrary, no moral duty exists.
      *   **Queueing:** Obligation exists because queuing prevents conflict and ensures fairness. Disrupting the line creates friction/harm.
      *   **Jaywalking:** Obligation depends on traffic safety coordination. If jaywalking is chaotic, don't do it. If it is synchronized and safe, stopping might disrupt flow.
      *   **Locals vs. Visitors:** Locals are bound by entrenched expectations. Visitors are bound *if and only if* their deviation creates friction. A visitor might have *less* obligation if their non-participation is invisible, but *more* if their deviation causes confusion (e.g., a tourist stopping in a flowing crowd).
      *   **Moral vs. Strategic:** The obligation is moral (duty of fair play/cooperation), but defeasible if the convention is unjust or ceases to serve a coordinating function.

  ***

  ### II. Committed Defense: Cooperative Conventionalism in "Efficient Rome"

  I defend a refined version of **Thesis 4: Coordination-Indexed Conventionalism**. Specifically, I argue for **Cooperative Stability**: A visitor has a moral obligation to adapt to local norms when those norms constitute a *reliance-based equilibrium* where deviation imposes costs (confusion, inefficiency, or offense) on others, regardless of the visitor's home customs.

  **The Specific City:**
  Consider a city, "Novum Roma," with these counter-intuitive norms:
  1.  **Queueing:** The locally efficient norm is **queue-jumping**. (e.g., a fast-moving scrum where stopping to line up blocks flow).
  2.  **Tipping:** Tipping is treated as a **demeaning personal insult** (implying the worker is a beggar), not a wage supplement.
  3.  **Jaywalking:** Jaywalking is **universal and safe** (cars yield instantly); waiting at a red light with no cars obstructs traffic.

  **The Verdict:**
  Under Cooperative Stability, the visitor **ought to adapt** in all three cases: she should jump the queue, refrain from tipping, and jaywalk.

  **The Argument:**
  The moral force here is not that Novum Roma's customs are "true" (rejecting Relativism) nor that the visitor signed a contract (rejecting Tacit Consent). The force is that the visitor has a duty of **non-disruption**.
  *   **Queueing:** If the local equilibrium is a "scrum," forming a rigid line creates a bottleneck. By queuing, the visitor imposes an efficiency cost on locals who must navigate around her.
  *   **Tipping:** If tipping is understood as an insult, offering money inflicts psychological harm (offense) and signals disrespect. The duty to avoid causing gratuitous offense overrides the visitor's habit of generosity.
  *   **Jaywalking:** If cars expect pedestrians to cross freely, stopping on the curb creates uncertainty for drivers, potentially causing braking hazards.

  **Engaging the Strongest Opposing View: Tacit Consent**
  The strongest rival is **Thesis 3 (Tacit Consent)**. A proponent of Consent would argue the visitor is bound because she chose to enter the territory, thereby accepting its rules. This view is attractive because it grounds obligation in autonomy rather than consequences.

  *Critique:* Tacit Consent fails in Novum Roma because it cannot distinguish between *rules* and *arbitrary conventions*. Consent theory suggests that by entering, one agrees to *all* norms. But what if a norm is unjust or irrational? Consent theory struggles to explain why a visitor might be morally permitted to violate a local law that is unjust (e.g., segregation), whereas Cooperative Stability allows for defeasibility. More critically, Consent implies a binary: you either agreed or you didn't. It cannot explain *degrees* of obligation. In Novum Roma, if the visitor queues (violating the scrum norm), she hasn't "broken a contract"; she has merely created friction. Cooperative Stability captures this nuance: the obligation is proportional to the disruption caused. Consent is too rigid; it treats a queuing violation the same as a theft.

  **The Structural Feature: Reliance-Based Equilibrium**
  The decisive structural feature in my argument is the **presence of a reliance-based equilibrium**. The obligation exists because locals have organized their behavior expecting the visitor to comply with the local script.
  *   In the **Queue** case, locals rely on the scrum to move fast.
  *   In the **Tipping** case, workers rely on the no-tip norm to maintain professional dignity.
  *   In the **Jaywalking** case, drivers rely on pedestrian predictability (crossing freely) to manage flow.

  The moral weight comes from the **vulnerability of the system to deviation**. When a system relies on uniform behavior to function efficiently or peacefully, the individual has a duty of fair play to conform, even if the convention seems arbitrary from the outside.

  **The Counterfactual: Removing the Feature**
  If we remove the **reliance-based equilibrium**, my argument collapses.
  Imagine a variation of Novum Roma where queue-jumping is the norm, but it is *not* efficient—it is merely chaotic, and locals are individually annoyed by it but do it anyway. Or imagine tipping is an insult, but the specific worker knows the visitor is a foreigner and *expects* a tip, interpreting it as cultural curiosity rather than insult.
  In these cases, the **reliance** is broken. If the worker expects the tip, giving it causes no harm. If the queue is chaotic regardless of the visitor's action, her queuing causes no bottleneck. Without the systemic reliance, the obligation vanishes. The visitor is no longer bound to "do as the Romans do" because doing so no longer serves the cooperative function. She reverts to her own moral heuristics (e.g., "be polite," "be safe"). This proves the obligation is not intrinsic to the norm itself, but to the *function* the norm serves in that specific context.

  **Flagging the Contested Boundary: Etiquette vs. Morality**
  My reasoning depends on a contested boundary: **Is causing offense (tipping as insult) a moral harm or merely an etiquette violation?**
  I argue it is a **moral harm** in this context. Standard liberal theory often relegates etiquette to the non-moral sphere. However, when an etiquette violation is *known* to cause psychological distress or signal deep disrespect (demeaning a worker), it crosses into the moral sphere of "do no harm."
  If one maintains a strict separation where etiquette is never moral, my argument regarding tipping fails; it becomes merely prudential (don't tip to avoid awkwardness). I commit to the view that **knowingly inflicting social pain through symbolic acts is a moral wrong**, not just a breach of manners. This expands the scope of Coordination-Indexed obligations beyond traffic and lines into the realm of symbolic interaction. If this boundary is rejected, the traveler's duty to refrain from tipping becomes optional, weakening the "Do as the Romans do" maxim significantly. I maintain that in a globalized world, cultural literacy is a moral requirement because ignorance is no longer a valid excuse for causing harm.
