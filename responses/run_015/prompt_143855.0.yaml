answer: |-
  This is a remarkably sharp observation. You have identified a curatorial manifestation of one of the deepest problems in modern moral philosophy: the tension between **genealogy** (where our morals come from) and **justification** (why we should obey them).

  The layout you describe isn't just a logistical decision; it is a silent philosophical argument. By segregating the "Evolution of Morality" from "Religion," and by framing religion as a cognitive byproduct while framing morality as an adaptive trait, the museum is making specific meta-ethical commitments.

  Here is a reconstruction of the implicit theory behind that layout, an analysis of its philosophical underdetermination, and a verdict on Darwin's worry.

  ### 1. The Implicit Philosophical Commitments

  The curatorial separation presupposes three main philosophical commitments:

  **A. Hume's Guillotine (The Is-Ought Problem)**
  The most obvious commitment is to a strict distinction between descriptive facts and normative values.
  *   **The Morality Wing** treats morality as an *object of study* (a set of behaviors, instincts, and neural pathways). It answers "How did we come to *feel* obligated?"
  *   **The Silence on Authority** implies that science cannot answer "Why *are* we obligated?"
  *   **The Commitment:** The museum assumes that explaining the *origin* of a belief does not validate or invalidate its *truth*. This is an attempt to avoid the **Genetic Fallacy**. They are saying, "We can explain why you believe murder is wrong (evolution) without claiming murder is objectively wrong (ethics)."

  **B. Methodological Naturalism & The Secularization of Ethics**
  By placing morality in the natural history wing and religion in a "culture/cognition" wing (framed as a spandrel/byproduct), the museum commits to **Ethical Naturalism** regarding the *capacity* for morality, but remains agnostic or silent on the *ontology* of moral values.
  *   It assumes moral instincts are biological facts, like opposable thumbs.
  *   It assumes religion is a psychological/cultural phenomenon, not a source of metaphysical truth.
  *   **The Commitment:** Moral authority does not require a transcendent source (God). It can exist as a social/biological phenomenon without needing to be "divinely commanded" to be functional.

  **C. Quietism about Normativity**
  The layout assumes that the "authority" of morality is not the museum's job to explain. It treats the normative force of morality (the "ought") as either self-evident, irrelevant to science, or a separate philosophical question.
  *   **The Commitment:** The tension Darwin felt (that naturalizing morality might weaken its binding power) is treated as a non-scientific problem. The museum implies that as long as we *have* morals, it doesn't matter if they are "absolute" in a metaphysical sense.

  ### 2. Reconstructing the Implicit Theory

  If we were to write the philosophy textbook that matches this museum layout, it would look like this:

  *   **On Moral Knowledge:** Moral knowledge is not a perception of objective Platonic truths or Divine Commands. It is a form of **social cognition**. We "know" right from wrong the way we "know" language grammar—through evolved instinct and cultural reinforcement.
  *   **On Origins vs. Validity:** Origins and validity are hermetically sealed. You can have a fully explained evolutionary origin for altruism without that explanation touching whether altruism is *good*. (This is a form of **Moral Realism** compatible with naturalism, or perhaps **Non-Cognitivism** where "good" just means "socially adaptive").
  *   **On Darwin's Tension:** The museum treats Darwin's worry as a **personal hangup**, not a structural philosophical problem. It assumes that modern humans can sustain moral commitment even if they know it's evolved. It bets on **Moral Fictionalism** or **Pragmatism**: *It doesn't matter if morality is objectively absolute; it matters that we act as if it is.*

  ### 3. Is the Practice Philosophically Underdetermined?

  **Yes, the layout is underdetermined.** Several rival meta-ethical theories could license this exact same separation. This is why the layout feels "neutral" even though it isn't.

  1.  **Non-Overlapping Magisteria (NOMA):** A Stephen Jay Gould-style view would support this. Science deals with facts (evolution of instincts); Religion deals with meaning (though the museum undermines this by calling religion a spandrel).
  2.  **Expressivism/Emotivism:** If moral statements are just expressions of emotion ("Boo murder!"), then science can study the *emotion* (Morality Wing) without needing to validate the *statement*. Religion is just another expression of culture (Religion Wing).
  3.  **Quietist Naturalism:** "We just study the biology. Let the philosophers fight about whether it's 'binding'."

  **However, it is not entirely neutral.** While multiple theories allow for the *separation*, the *content* of the wings rules out specific views.
  *   **It Rules Out Divine Command Theory:** By framing religion as a "byproduct" and morality as "adaptive," it explicitly denies that morality originates in or is sustained by the divine.
  *   **It Rules Out Strong Evolutionary Ethics:** It avoids the claim that "what evolved is good" (the Appeal to Nature). It describes the evolution of morality without endorsing the morality of evolution.
  *   **It Rules Out Theistic Realism:** It denies the view that religious belief is necessary to ground the *objectivity* of moral values.

  So, while the *separation* is underdetermined, the *framing* is aggressively naturalistic. It allows you to be a moral realist, but only a *naturalistic* moral realist.

  ### 4. Darwin's Worry and Curatorial Reform

  You asked: *If Darwin's worry was legit, that evolutionary explanations might undermine the sense that moral obligations are absolute, then what would have to change?*

  Darwin's worry was that if morality is just a "propensity" selected for survival, it loses its **categorical imperative** status. If I can commit a crime and get away with it (survive/reproduce), why shouldn't I? Evolution explains why I *feel* guilty, but not why I *should*.

  If the museum wants to be philosophically honest about this tension, they have two options:

  **Option A: The "Bridge" Exhibit (Integration)**
  They should not necessarily merge the wings (which would confuse biology with theology), but they need a **third space** or a connecting corridor titled *"The Philosophy of Moral Authority."*
  *   **Content:** This section would explicitly state: "Evolution explains why we have moral instincts. It does not explain why those instincts bind us. Philosophers and theologians disagree on whether this gap matters."
  *   **Effect:** This admits that the "Morality Wing" is descriptive, not normative. It validates Darwin's worry without endorsing a religious solution.

  **Option B: Honest Disclaimers (The Gap)**
  Keep the wings separate but change the text in the Morality Wing.
  *   **Current Text (Implicit):** "Morality evolved to help us cooperate."
  *   **Revised Text:** "Morality evolved to help us cooperate. **Whether this evolutionary origin makes moral obligations less binding, or merely explains their psychological force, remains a subject of philosophical debate.**"
  *   **Effect:** This stops the museum from silently smuggling in the idea that "explaining morality is the same as accounting for morality."

  ### Conclusion

  The museum's layout presupposes that **explanation is distinct from justification**. It assumes you can have a robust moral life without believing your morals are metaphysically absolute.

  However, by framing religion as a "spandrel" (a side-effect with no function) and morality as "adaptive" (functional), the museum *is* making a value judgment: it suggests secular morality is more "real" or "functional" than religious morality.

  If Darwin was right that naturalizing morality risks draining it of its authority, the museum is currently engaging in a kind of **intellectual sleight of hand**. It shows you the machinery of the moral engine (evolution) but hides the fact that the engine doesn't come with a driver's manual (normative authority).

  To fix this, they don't need to integrate religion and science. They need to integrate **science and philosophy**. They need to admit that while natural history can explain the *history* of conscience, it is silent on the *authority* of conscience. Until they do that, the layout remains a comfortable fiction that protects the visitor from the unsettling possibility that Darwin identified: that we might be moral animals living in a universe that doesn't care if we are good.
