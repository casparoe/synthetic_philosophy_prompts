answer: |-
  ### Q&A Prep Sheet: The Institutional Contingency of the Terror

  **1. The "Selection Bias" Objection (Institutionalist Political Scientist)**
  *   **The Objection:** "You've selected on the dependent variable. You're looking at the French Revolution because it produced a Terror, and then you found a bureaucratic glitch to explain it. But how do we know this 'dual-key' authority wasn't present in other revolutionary committees that *didn't* produce mass executions? You're treating a standard administrative friction as a causal mechanism because it happened to coincide with a outlier event."
  *   **The Reply:** "That's a fair methodological check, but the friction here wasn't standard. In other contexts, overlapping authority creates gridlock or stalemate. In Year II, the specific design meant that *inaction* by one Committee was interpreted as counter-revolutionary suspicion by the other. It wasn't just friction; it was a positive feedback loop where bureaucratic hesitation generated evidence of guilt. I'm not saying this glitch exists nowhere else, but I'm arguing that in the specific context of 1793-94, where political survival depended on proactive denunciation, this specific institutional design converted administrative caution into lethal acceleration. It's not just that the glitch existed; it's that the penalty for using the 'veto' power was death."
  *   **Soft Spot:** You don't have a strong comparative case ready. If they press for a specific counter-example (e.g., local municipalities), you might stumble.

  **2. The "Street Veto" Objection (Social Historian)**
  *   **The Objection:** "You're treating the Committees as if they had the autonomy to stop anything. By 1794, the sans-culottes and the Sections held the real power. The Committees weren't accelerating the Terror because of a paperwork deadlock; they were running for their lives. If they hadn't signed those arrest warrants, the mob would have stormed the Tuileries. You're giving bureaucrats too much credit and the popular movement too little."
  *   **The Reply:** "I agree the pressure from the Sections was immense, but that pressure existed in 1792 and again in Thermidor. The variable that changed was the institutional inability to filter that pressure. The Sections demanded arrests, but the Committees had the procedural power to verify them. My argument is that the dual-key system removed the 'verification' step because neither Committee wanted to be the one seen blocking security. The street pressure provided the fuel, but the institutional design removed the brakes. Without that specific bureaucratic contingency, the pressure might have resulted in purges, but not the industrialized scale of the Great Terror."
  *   **Soft Spot:** You're walking a line between institutional autonomy and external pressure. If they argue the Committees were *completely* captive, your mechanism dissolves.

  **3. The "Virtue Necessity" Objection (Intellectual Historian)**
  *   **The Objection:** "You're reducing a moral imperative to a clerical error. For Robespierre and the Jacobins, Terror wasn't a bureaucratic accident; it was the logical emanation of Virtue. If you believe in a Republic of Virtue, enemies are not just political opponents; they are moral contaminants. The language of 'purity' demanded the guillotine regardless of who had signing authority. You're ignoring the discourse that made the Terror thinkable in the first place."
  *   **The Reply:** "Ideology sets the goals, but institutions determine the velocity. Yes, the discourse of Virtue created the *want* for purges, but it doesn't explain the *acceleration* in Prairial. The discourse was constant from 1793 to 1794; the arrest rates spiked when the bureaucratic rivalry peaked. The language of virtue justified the Terror, but the institutional deadlock ensured it couldn't stop. Think of ideology as the engine and my institutional contingency as the stuck accelerator. You need both to explain the crash, but I'm explaining why the car wouldn't stop."
  *   **Soft Spot:** You risk conceding too much to ideology. If they argue the ideology *required* endless acceleration, your institutional brake metaphor fails.

  **4. The "Bread and Blood" Objection (Social Historian)**
  *   **The Objection:** "Let's talk about material conditions. The Maximum laws were failing, bread prices were volatile, and the war front was collapsing. Fear was driven by hunger and invasion, not inter-committee memos. You're proposing a top-down administrative explanation for a bottom-up panic. People weren't dying because of a dual-key signature; they were dying because the Republic was under siege."
  *   **The Reply:** "Material crisis creates the atmosphere of fear, but it doesn't dictate the administrative response. Other besieged nations have managed security without mass auto-cannibalism. The crisis explains why the population was anxious, but it doesn't explain why the state apparatus turned that anxiety inward against its own leadership. The dual-key system ensured that every external threat was translated into an internal purge. The war created the enemies, but the institution created the inability to distinguish them from friends."
  *   **Soft Spot:** You need to be careful not to sound like you're ignoring the war entirely. It's a huge confounding variable.

  **5. The "Robespierre's Agency" Objection (Intellectual Historian)**
  *   **The Objection:** "You're making Robespierre a victim of a form. He wasn't trapped by the Committee of General Security; he was using it. He pushed for the Law of 22 Prairial specifically to streamline executions. You're arguing he was caught in a web he was actively weaving. How do you reconcile your 'trapped bureaucrat' narrative with his very clear intent to radicalize the justice system?"
  *   **The Reply:** "Robespierre tried to weave the web, but he lost control of the loom. He supported the acceleration initially, but my argument focuses on the endgame—why he couldn't stop it when he tried to pivot. When he realized the mechanism was consuming his own allies, he attempted to dissolve the bodies. The fact that he was executed for trying to halt the process proves the institution had gained autonomy from even its primary architect. He built the machine, but the dual-key design meant the machine no longer required his specific input to run."
  *   **Soft Spot:** This relies on interpreting his final speeches as genuine attempts to stop the Terror, which some historians dispute.

  **6. The "Chronology" Objection (Institutionalist Political Scientist)**
  *   **The Objection:** "The Terror began well before this specific bureaucratic deadlock solidified. The executions started ramping up in late 1793. If this dual-key authority is the cause, why is there a lag? You're matching a mechanism to a trend that was already moving upward. Correlation isn't causation."
  *   **The Reply:** "There was a Terror before, but there was also a brake before. In late 1793, the Committees were still finding a balance. The 'dual-key' hardening happened as the rivalry intensified in early 1794. The acceleration curve matches the institutionalization of the rivalry, not just the start of the violence. The early Terror was punitive; the late Terror was systemic. My argument explains the shift from 'punishing enemies' to 'consuming children,' which is the specific phenomenon of 1794."
  *   **Soft Spot:** You need to have the specific dates of the procedural changes memorized. If you're vague on when the "deadlock" started, this objection sticks.

  **7. The "Provincial Variation" Objection (Social Historian)**
  *   **The Objection:** "This is a very Paris-centric argument. The Great Terror happened in the provinces too, under Representative-on-Mission authority. They didn't have the same Committee structure in Lyon or Nantes. If your institutional contingency is the cause, why was the Terror national? You're explaining Paris and calling it France."
  *   **The Reply:** "The Paris Committees set the normative and procedural standard for the Representatives-on-Mission. The provincial terror was often an imitation of the central mechanism, driven by representatives reporting back to Paris to validate their own actions. The dual-key system in Paris created the template of 'competitive radicalization' that the provinces mimicked to prove their loyalty. The institution in Paris was the heart; the provinces were the limbs reacting to the same pulse."
  *   **Soft Spot:** This is a stretch. Provincial dynamics were often very local. Admitting this is a limitation is safer than overclaiming.

  **8. The "Counterfactual" Objection (Institutionalist Political Scientist)**
  *   **The Objection:** "Okay, let's play the game. Remove the dual-key authority. What happens? Do you honestly believe the Revolution suddenly becomes liberal? Or does the pressure just find another outlet? If the outcome is the same without your variable, your variable doesn't matter."
  *   **The Reply:** "If you remove the dual-key, you remove the *acceleration*. You likely still get purges. You likely still get violence. But you don't get the specific dynamic where stopping the violence becomes impossible. Without the deadlock, a single authority could have chosen to de-escalate when the war situation improved. The counterfactual isn't peace; it's a standard authoritarian consolidation rather than a suicidal spiral. I'm explaining the suicide, not the violence."
  *   **Soft Spot:** Counterfactuals are impossible to prove. You're asking them to trust your logic over their intuition.

  ***

  ### The Question You're Praying Nobody Asks

  **"If this institutional deadlock was the engine of the Terror, why did the arrest rates drop immediately after Thermidor, even though the Committee structure remained formally identical for another six months?"**

  *   **Why it's fatal:** This directly attacks your causal mechanism. If the structure remained but the outcome changed, the structure wasn't the cause. The change was likely personnel or political will (which brings you back to Agency or Ideology).
  *   **Hail Mary Reply:** "The formal structure remained, but the *informal* norms of interaction collapsed. After Thermidor, the 'fear of exposure' that drove the dual-key deadlock vanished because the political cost of denunciation flipped. The mechanism required a specific belief system—that hesitation equals guilt—to function. Thermidor didn't just change the people; it changed the incentive structure that made the deadlock lethal."
