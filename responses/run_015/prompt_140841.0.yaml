prompt: |-
  Me and two other parents judge the projects at our regional middle-and-high-school science fair every spring, and I also help moderate a neighbourhood Facebook group where people are constantly posting health and wellness claims, so I end up doing the same thing over and over: deciding whether something somebody is very confident about is actually the kind of claim that evidence could ever touch, or whether it only looks like it is. I got nerd-sniped into reading about Popper and falsificationism online a few months ago and honestly it's made things worse rather than better — I now catch myself wanting to fail half the kids' projects for being untestable, and at the same time some of the woo in the Facebook group seems to survive the "what would prove you wrong?" question just fine, because the poster will cheerfully name some result and then quietly explain it away when it happens. So I've been messing around with a few rules of my own and I want someone to tell me which of them are worth keeping and then build the actual procedure around them. The first is what I call the Tuesday test: keep "nobody could ever test this, even in principle" strictly separate from "this particular twelve-year-old can't test it before Sunday with the equipment in her garage," because those feel like totally different problems to me and I keep conflating them. The second is the pre-mortem: before anyone runs the experiment, make them write down in advance which outcome would make them abandon the claim, and then check whether that written-down outcome is one they'd actually accept or one they'd reinterpret. The third is rubber claims — my name for claims that stretch to absorb whatever happens, where the giveaway is that after the result is in you still can't say what would have counted against them; I think the right test for a rubber claim is whether the person can describe a result that would lower their confidence by a specific amount rather than just "make me think about it more." I've also read somewhere that any test actually checks a whole bundle of assumptions at once rather than one idea on its own, which worries me because it seems like it would let anybody wriggle out of anything by blaming their equipment, and I don't know how to fold that in without making the whole thing useless.

  What I need is a procedure, not an essay. Something the three of us can run in about ten minutes per project, written in plain language with no philosophy jargon in the final checklist (I can translate, but the other two judges won't read anything with the word "epistemology" in it), with the questions in the order we should ask them, what counts as a good enough answer to each, the point where you just stop and say no, and the point where you hand it to a human because it's a values call and not a facts call. It has to end in a verdict we can defend to a parent who complains to the school board, and — this matters — it needs a repair step, because with twelve-year-olds we can't just say "your topic isn't science"; we need to be able to say "not testable as you've written it, but here is the nearest testable version" and still give them most of the marks. Please also be straight about which steps are really judgment calls wearing a procedure costume.

  Then run it on three cases. First: a girl's project where she talks kindly to one set of bean plants and ignores another set, and the talked-to ones come out taller. Second: a post in the Facebook group selling a copper bracelet that rebalances your energy field, where the seller says it obviously doesn't work on people who are skeptical. Third, and this is the one where I want you to be blunt even if it annoys me: I've believed for about fifteen years that my migraines come on ahead of storms, I've half-kept a diary about it, and I really don't want to be told I'm doing pseudoscience — so tell me honestly what your procedure says about my headache theory and what I'd have to do to make it come out the other way. Finally, list the kinds of claims your procedure just can't handle (historical one-off stuff, statistical things, whatever else) so I know when to stop using it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User Persona:** Science fair judge (middle/high school), neighborhood Facebook group moderator. Experienced with evaluating claims but feeling overwhelmed by Popperian falsificationism.
      *   **Goal:** A practical, 10-minute evaluation procedure/checklist for three judges to use on science fair projects (and potentially online claims).
      *   **Constraints:**
          *   Plain language (no "epistemology," "falsificationism," etc.).
          *   Ordered questions.
          *   Clear pass/fail criteria.
          *   "Stop and say no" point.
          *   "Hand to human" point (values vs. facts).
          *   Defensible verdict (for school board complaints).
          *   **Crucial:** A "repair step" (how to fix untestable projects rather than just rejecting them).
          *   Honesty about judgment calls disguised as procedure.
          *   **Test Cases:**
              1.  Talking to bean plants (classic student project).
              2.  Copper bracelet/energy field/skepticism (classic woo).
              3.  User's migraine/storm theory (personal, sensitive, needs blunt honesty).
          *   **Limitations:** List claims the procedure *can't* handle.
      *   **User's Proposed Rules:**
          1.  *Tuesday Test:* Separate "impossible in principle" from "impossible by Sunday."
          2.  *Pre-mortem:* Define failure conditions *before* the experiment.
          3.  *Rubber Claims:* Identify claims that stretch to fit any result (need specific confidence reduction).
          4.  *Duhem-Quinte Problem:* Worried about "bundle of assumptions" allowing wiggle room (blaming equipment).

  2.  **Deconstruct the Philosophy/Logic:**

      *   *Popper/Falsification:* Good for demarcation, bad for practical science (especially school projects). Pure falsification kills everything eventually because auxiliary hypotheses can always be blamed.
      *   *Tuesday Test:* This is about *feasibility* vs. *testability*. Feasibility is a resource problem; testability is a logic problem.
      *   *Pre-mortem:* This is essentially defining *success criteria* and *stopping rules* to prevent HARKing (Hypothesizing After Results are Known) or moving the goalposts.
      *   *Rubber Claims:* This addresses *immunized hypotheses*. The fix is requiring quantitative or specific qualitative shifts in belief.
      *   *Bundle of Assumptions:* This is the Duhem-Quine thesis. The practical fix is *control groups* and *calibration*. If the equipment fails, the control should show it too.

  3.  **Drafting the Procedure (The "10-Minute Triage"):**

      *   *Tone:* Practical, direct, non-judgmental but firm.
      *   *Structure:*
          1.  The Claim (What are you testing?)
          2.  The Break Point (What proves you wrong?)
          3.  The Setup (Can you actually see the difference?)
          4.  The Wiggle Room (What if things go weird?)
          5.  The Verdict & Repair.
      *   *Incorporating User's Rules:*
          *   Tuesday Test $\rightarrow$ Step 3 (Feasibility).
          *   Pre-mortem $\rightarrow$ Step 2 (Break Point).
          *   Rubber Claims $\rightarrow$ Step 4 (Wiggle Room).
          *   Bundle of Assumptions $\rightarrow$ Step 3 (Controls).
      *   *Judgment Calls:* Need to explicitly flag where human intuition overrides the checklist.

  4.  **Developing the Test Cases:**

      *   *Case 1 (Beans):* Usually flawed due to sample size and variables (light, water, CO2 from breath). Needs repair (blind the talker, increase N, measure specific growth).
      *   *Case 2 (Bracelet):* "Skepticism" clause makes it unfalsifiable (Rubber Claim). Verdict: Fail on testability, repair is likely impossible without removing the "energy" claim.
      *   *Case 3 (Migraines):* This is the sensitive one. It *is* testable in principle, but retrospective diaries are unreliable (confirmation bias). Needs a prospective protocol. Don't call it pseudoscience, call it "unverified correlation."

  5.  **Refining the "Bundle of Assumptions" Worry:**

      *   The user worries that if a test fails, the student blames the thermometer.
      *   *Solution:* The procedure must require a "System Check" or Control. If the control works, the equipment is assumed fine. If the control fails, the data is void. This isolates the hypothesis from the tool.

  6.  **Addressing the "Repair Step":**

      *   Science fair is educational. Rejection hurts.
      *   Repair = "Change the claim to match the test" or "Change the test to match the claim."
      *   Example: "Plants like music" $\rightarrow$ "Vibration affects growth" (measurable) or "I will measure stomata opening" (more precise).

  7.  **Addressing the Limitations:**

      *   Historical events (can't re-run).
      *   Existence claims (proving a black swan exists vs. doesn't exist).
      *   Complex systems (climate, economics) where isolation is impossible.
      *   Value judgments (ethics, aesthetics).

  8.  **Drafting the Content (Iterative refinement):**

      *   *Self-Correction on Tone:* Ensure I don't sound condescending about the migraine issue. Be empathetic but rigorous.
      *   *Self-Correction on Jargon:* Ensure "falsifiability" isn't used. Use "break point" or "fail condition."
      *   *Checklist Design:* Needs to be printable/usable.
      *   *The "Stop" Point:* Where do we disqualify? When the claim is logically immune to evidence (The Bracelet).
      *   *The "Human" Point:* Ethics, safety, plagiarism (not covered here, but worth noting as out of scope).

  9.  **Final Review against Constraints:**

      *   10 minutes? Yes, 5 questions.
      *   No jargon? Checked.
      *   Repair step included? Yes.
      *   Judgment calls flagged? Yes.
      *   Three cases run? Yes.
      *   Limitations listed? Yes.

  10. **Final Polish:** (Writing the response based on the above thought process.) *Make sure the migraine section is handled with care—it's a real phenomenon (meteoropathy), but the user's current evidence is anecdotal. The procedure should validate the *method* of testing, not the truth of the claim yet.*

  *(Self-Correction during drafting the migraine section)*: I need to be careful not to validate the science *of* the claim, but the *testability* of it. The prompt asks what the procedure says about the *theory* based on current evidence vs. how to make it pass. The procedure says: "Current evidence is retrospective/anecdotal (Fail Step 2). Repair: Prospective logging with blind weather data."

  *(Self-Correction on the "Bundle" worry)*: I need to explicitly answer how the procedure handles the "blame the equipment" loophole. The answer is "Controls." I will add that to Step 3.

  Let's assemble the response.cw
answer: |-
  Here is a 10-minute triage procedure built from your rules, designed for three judges to use on a clipboard. It strips out the philosophy and focuses on the mechanics of testing.

  ### The "Can We Check This?" Procedure

  **Time limit:** 10 minutes per project.
  **Goal:** Decide if the project counts as a test, and if not, how to fix it.

  #### Step 1: The One-Sentence Claim (2 minutes)
  **Ask:** "Write down exactly what you think is happening in one sentence. No extra words."
  *   **Good Answer:** "If I add aspirin to the water, the cut flowers will last two days longer."
  *   **Bad Answer:** "I'm looking into how aspirin affects nature." or "I want to see if positive energy helps."
  *   **The Trap:** Vague claims allow vague results.
  *   **Stop Rule:** If they cannot write a specific cause-and-effect sentence, stop. This is a topic, not a project.
  *   **Repair:** Help them narrow it. Change "nature" to "flower wilting." Change "positive energy" to "speaking sound waves."

  #### Step 2: The Break Point (3 minutes)
  **Ask:** "Imagine you run the experiment and get the opposite result. What specific number or observation would make you say, 'Okay, I was wrong'?"
  *   **Good Answer:** "If the flowers wilt in less than 5 days, my idea is wrong."
  *   **Bad Answer:** "I'd be surprised, but I'd look for other reasons." or "It might just mean the energy was blocked."
  *   **The Trap (Rubber Claims):** If they can explain away the failure *before* it happens, the claim is rubber.
  *   **Stop Rule:** If they say the result would depend on "interpretation" or "feelings" rather than a measurement, stop.
  *   **Repair:** Force a number. "What is the minimum height difference that counts as success? 1cm? 10cm? Write that down."

  #### Step 3: The Tuesday Test & The Blame Game (3 minutes)
  **Ask:** "Can you measure this with what you have by Sunday? And if your thermometer breaks, how do we know it wasn't just the thermometer?"
  *   **Good Answer:** "Yes, I have a ruler. Also, I'm testing tap water vs. aspirin water, so if the ruler is wrong, it's wrong for both."
  *   **Bad Answer:** "I need a spectrometer I don't have." or "If the plants die, maybe the soil was bad."
  *   **The Trap (Bundle of Assumptions):** Worrying that equipment failure invalidates the test.
  *   **The Fix:** **Controls.** If they have a control group (untreated plants), equipment errors usually affect both groups equally. If the control works and the test doesn't, it's the variable, not the ruler.
  *   **Stop Rule:** If the claim requires equipment they cannot access *and* cannot proxy (simulate), stop.
  *   **Repair:** Swap the tool. Can't measure "energy"? Measure temperature or growth instead. Can't test "all storms"? Test "barometric pressure drops."

  #### Step 4: The Verdict & Repair (2 minutes)
  *   **Pass:** Claim is specific, Break Point is defined, Controls are in place.
  *   **Conditional Pass:** Claim is good, but measurements are weak. *Action:* Student must submit a log of calibration checks (e.g., weighing the ruler).
  *   **Fail (Unfixable):** The claim is immune to evidence (e.g., "It only works if you believe").
  *   **Fail (Fixable):** The claim is too big or vague. *Action:* Apply the Repair Step below.

  **The Repair Step (For Fixable Fails):**
  Do not say "This isn't science." Say: **"Your claim is too big for this test. Let's shrink the claim to fit the test."**
  *   *Example:* "Does music help plants?" $\rightarrow$ "Do sound vibrations at 500Hz change stem thickness?"
  *   *Example:* "Is this vitamin healthy?" $\rightarrow$ "Does this vitamin dissolve faster in acid than water?"
  *   *Scoring:* Give full marks for *method* if they execute the repaired version perfectly, even if the original idea was woo.

  ***

  ### Where the Procedure is Faking It (Judgment Calls)
  You asked for honesty. Here is where the checklist is actually just us using our intuition:
  1.  **Step 2 (The Break Point):** A clever student can invent a fake "Break Point" just to please us. We have to judge if they *mean* it. If they look evasive, we fail them, even if the words sound right.
  2.  **Step 3 (The Blame Game):** Deciding if a control is "good enough" is subjective. A soil variance might matter for beans but not for rocks. We have to decide if the noise drowns the signal.
  3.  **The Repair:** Deciding if the "shrunk claim" is still interesting enough to deserve a ribbon is a value judgment, not a logic one.

  ***

  ### Running the Procedure on Your Three Cases

  #### Case 1: The Talking Bean Plants
  *   **Step 1 (Claim):** "Talking to plants makes them grow taller." (Passes)
  *   **Step 2 (Break Point):** "If the talked-to plants are shorter or the same height." (Passes, *but*...)
  *   **Step 3 (Tuesday/Blame):** **FAIL.**
      *   *Problem:* Who is talking? If the student talks, they breathe CO2 and warmth on the plants. They also water them more carefully because they care. The "talk" is bundled with "extra care."
      *   *Equipment:* A ruler is fine (Tuesday Test Pass).
      *   *Bundle:* The "care" variable is not controlled.
  *   **Verdict:** **Conditional Fail.**
  *   **Repair:** "You are testing *sound*, not *care*. You must play a recording of your voice to Group A and silence to Group B. You must not enter the room when they are growing. If you do this, you pass."
  *   **Defense:** We aren't saying plants can't hear. We are saying *this setup* tests "student attention," not "speech."

  #### Case 2: The Copper Bracelet (Facebook)
  *   **Step 1 (Claim):** "This bracelet rebalances your energy field." (Vague, but let's go on).
  *   **Step 2 (Break Point):** "It doesn't work on skeptics." **FAIL.**
      *   *Problem:* This is a "Rubber Claim." If I test it and feel nothing, the seller says "You were skeptical." If I feel something, they say "It worked." There is no outcome where they lose.
  *   **Step 3 (Tuesday/Blame):** Irrelevant because Step 2 failed.
  *   **Verdict:** **Hard Fail (Unfixable).**
  *   **Repair:** None. To fix this, they must remove the "skepticism" clause. If they remove that, the claim usually collapses because the "energy field" is undefined.
  *   **Defense:** "A claim that changes its rules based on the result is not a testable claim. It is a belief."

  #### Case 3: Your Migraines and Storms
  *   *Note: I will be blunt as requested.*
  *   **Step 1 (Claim):** "Barometric pressure drops trigger my migraines." (Specific enough).
  *   **Step 2 (Break Point):** **FAIL (Currently).**
      *   *Problem:* You said you "half-kept a diary." This means you likely recorded the headaches and *remembered* the storms, or looked at the weather *after* the headache started. This is confirmation bias.
      *   *Rubber Check:* If you get a headache on a sunny day, do you say "Well, it was a pressure pocket"? If yes, it's rubber.
  *   **Step 3 (Tuesday/Blame):** **PASS.**
      *   Weather data is public. Headache logs are doable.
  *   **Verdict:** **Fail (Methodology), Pass (Concept).**
  *   **The Blunt Truth:** Your current evidence is anecdotal. Human brains are pattern-matching machines that find faces in clouds. You are likely remembering the hits (headache + storm) and forgetting the misses (headache + sun, or storm + no headache).
  *   **How to Make It Pass:**
      1.  **Prospective Log:** You must record the weather *first*, then wait to see if you get a headache. Or record both daily without looking for a link until the end of the month.
      2.  **Define the Miss:** You need to count the days it stormed and you *didn't* get a headache.
      3.  **Blind the Data:** Have a friend download the local pressure history for the last year. Have you log your headaches for the next year. Compare the two datasets without looking at the daily weather.
  *   **Is it Pseudoscience?** No. Meteoropathy is a real area of study. But your *current method* is pseudoscientific because it relies on memory rather than data. If you run the blinded protocol and the correlation holds, you have science. If it vanishes, you have a coincidence.

  ***

  ### When to Stop Using This Procedure

  This checklist works for "If X, then Y" experiments. It breaks down on:

  1.  **Historical One-Offs:** "Did this specific fossil belong to a new species?" You can't re-run the evolution. You need expert consensus, not a break point.
  2.  **Existence Claims:** "There is a black swan." Finding one proves it; failing to find one doesn't disprove it. (The procedure assumes you are testing a universal rule, not hunting for a single item).
  3.  **Complex Systems:** "Does raising interest rates cause inflation?" Too many variables to control. The "Bundle of Assumptions" becomes so large the procedure says "Fail" even though it's valid economics.
  4.  **Mathematics/Logic:** "Is this theorem true?" You don't test this with experiments; you prove it with logic.
  5.  **Values:** "Is this genetic editing ethical?" The procedure can tell you if the editing worked, not if it *should* have.

  **Final Advice for the Judges:**
  When a parent complains, do not argue about the science. Argue about the **procedure**.
  *"We didn't say your child was wrong. We said their method couldn't distinguish between their idea and random chance. We offered a repair to fix the method. They chose not to take it."*
  That is defensible.
