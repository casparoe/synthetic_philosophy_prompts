answer: |-
  ### What maps to what

  | Workshop Analogy | Biological Counterpart (SE Account) |
  | :--- | :--- |
  | **The Maker** | Natural Selection (ancestral selection pressures) |
  | **The Blueprint** | Genotype/Phenotype mapping (shaped by history) |
  | **The Job** | Selected Effect (fitness contribution) |
  | **The Broken Tool** | Malfunctioning trait token (mutation/pathology) |
  | **The Repurposed Tool** | Exaptation becoming adaptation (new selection history) |

  ### Where it genuinely holds

  The analogy successfully captures the normative force central to the etiological account. Just as a screwdriver *ought* to drive screws regardless of current use, a heart *ought* to pump blood regardless of current capacity. This grounds dysfunction: a trait can fail its function without losing the function itself. It also correctly maps the historical dependency. A tool's function is determined by its manufacturing history, not its current causal powers. Similarly, the etiological account argues biological function is determined by selection history, not current contribution. This distinction supports the separation of function from mere causal role, preventing the inflation of functions to include every side effect. The workshop model intuitively secures the idea that functions are stable properties grounded in past success, not fleeting current utilities.

  ### Where it breaks

  The primary break is intentionality. Tools imply a designer with foresight; natural selection is blind. This is fatal to the analogy's intuition but not the theory, as SE theory naturalizes "design" via differential reproduction. However, this disanalogy strains Conclusion 3. In a workshop, a designer consciously repurposes a tool instantly. In biology, "repurposing" requires new selection pressures acting over generations. The analogy hides this lag, making function updates seem immediate rather than historical.

  Secondly, the analogy cannot accommodate drift. Tools are not accidentally manufactured and later found useful; they are made for purposes. Traits fixed by drift lack a "maker" in the SE sense. This is fatal to the SE account itself, not just the analogy, but the analogy masks this vulnerability by assuming all tools have makers.

  Thirdly, tools are discrete; traits are often pleiotropic. A screwdriver has one main function; a gene might affect multiple traits. This is nitpicking regarding Conclusion 2, as SE can handle multiple selected effects, but the analogy suggests singularity.

  Finally, the "broken tool" case assumes a clear blueprint. Biological development is noisy. A malformed heart might be a developmental error or a new variant. This complicates Conclusion 1 slightly, but isn't fatal. The "maker" question in Case 3 is also problematic: selection doesn't "decide" to update; pressures shift. The analogy implies agency where there is only statistical filtering.

  ### The three conclusions

  1.  **Dysfunction is real:** **Survives.** This is the etiological account's strongest point. The analogy supports it well: a trait token fails the type's historical standard. A heart that doesn't pump is broken relative to its selection history, matching the snapped screwdriver.
  2.  **Not every effect is a function:** **Survives.** The analogy clearly distinguishes intended job from incidental noise. SE theory mirrors this by distinguishing selected effects from incidental causal contributions. The thumping noise is like a screwdriver reflecting light; it's real, but not the function.
  3.  **Functions can be updated:** **Half-survives.** This is standard etiological-account doctrine (the "modern history" view), not an overreach. You misread this as innovation, but it is established theory. However, the analogy simplifies the mechanism. It suggests a designer swaps the function label instantly. In reality, function shifts only after new selection history accumulates. The conclusion is correct, but the analogy makes the transition look too clean, obscuring the generational lag required for the new function to become etiological.

  ### My two cases

  **A→B Shift:** The analogy suggests function switches when utility switches. SE theory says function switches only after selection maintains B for some time. In generation 1 of the shift, T still has function A (and is perhaps dysfunctional), while B is merely a side effect. The analogy misleads here by implying immediate repurposing.

  **Drift-fixed Trait:** The analogy has no counterpart. Tools aren't made by accident. SE theory says a drift-fixed trait has no function until selection acts on it. The causal-role account says it has a function immediately. The analogy silently sides with SE but offers no conceptual handle for the "no maker" scenario, leaving you unable to explain *why* it lacks function other than "no one made it."

  ### The question I hope she doesn't ask

  "If natural selection is the maker, and a trait is fixed by drift before becoming useful, who manufactured that tool?" This exposes the analogy's reliance on intentionality. If you say "no one," the analogy collapses. If you say "selection," you're historically inaccurate. It forces you to admit the analogy works only for traits with a clean selection history, ignoring the messy reality of genomic drift.

  ### A better analogy

  There isn't a perfect one, but "evolved computer code" works better. In genetic algorithms, code structures are selected for performance without a human designer specifying every function. Functions emerge from success history, not blueprints. Drift can be simulated as random code retention. This removes the conscious "maker" while keeping the "selection for" logic. However, it still lacks the physical breakdown of biological traits. Ultimately, analogies fail because biological function is the only case of "design without a designer," so any analogy borrowing from design will leak.
