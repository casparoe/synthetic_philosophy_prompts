      *   **Topic:** Laws of Nature (Humean Best System vs. Anti-Humean Governing).
      *   **Time:** 50 minutes.
      *   **Audience:** Philosophy undergrads + 2 Physics majors (potentially annoyed/skeptical).
      *   **Constraint:** Don't give the lecture; give the *plan* for giving it.
      *   **Specific Tasks:**
          1.  Order/Structure (The Spine).
          2.  One Running Example (Better than Gold Spheres).
          3.  Addressing Misconceptions (Timing & Validity).
          4.  Final Assessment Question (The One Atom World).
          5.  What to Refuse to Settle (Scope).
          6.  Attribution (Who grants what?).

  2.  **Deconstruct Task 1: The Spine (Order of Operations)**
      *   *User's Instinct:* Separate (1) What a law *is*, (2) What we *do* with laws (explanation, prediction, counterfactuals), (3) Law vs. Accident.
      *   *Evaluation:* This is strong. If you start with "Humeanism says X," students conflate the *function* of laws with their *ontology*. The physics majors especially will care about function (prediction/explanation).
      *   *Refinement:* Need to ensure the "Law vs. Accident" distinction comes *after* establishing the functions, because the functions are the *data* the theories need to save.
      *   *Proposed Order:*
          1.  The Data (What laws *do* for us).
          2.  The Puzzle (Law vs. Accident).
          3.  The Solutions (Humean vs. Anti-Humean).
          4.  The Cost/Benefit Analysis.

  3.  **Deconstruct Task 2: The Running Example**
      *   *Requirement:* Needs to handle accidental generalization, counterfactuals, and single instances. Needs to be better than "Gold Spheres < 1 mile."
      *   *Critique of Gold Spheres:* It's too static. It doesn't feel like *physics*. Physics majors need dynamics.
      *   *Idea:* A specific conservation law or a specific force law.
      *   *Selection:* **Inverse Square Law of Gravity (or Electrostatics).**
      *   *Why:*
          *   *Accident:* "All spheres in this room are < 1 mile" vs. "All masses attract via $1/r^2$."
          *   *Counterfactual:* "If I moved this mass here, would it still attract?"
          *   *Single Instance:* Can we have a law with only one particle? (Connects to Task 4).
          *   *Physics Major Hook:* It's actual physics, not philosophy examples.
      *   *Modification:* Let's use a slightly more abstracted version to avoid getting bogged down in GR vs. Newton. Let's call it "The $F = k/r^2$ Rule."
      *   *Wait, better idea:* **Uranium-235 Critical Mass.**
          *   *Accident:* "All spheres of gold are < 1 mile." (Too static).
          *   *Law:* "No sphere of U-235 exceeds critical mass." (Nomic).
          *   *Problem:* Still static.
      *   *Better Idea:* **The Decay of a Specific Isotope (e.g., Carbon-14).**
          *   *Accident:* "All coins in my pocket are silver."
          *   *Law:* "C-14 has a half-life of 5730 years."
          *   *Counterfactual:* "If this atom were C-14, would it decay?"
          *   *Single Instance:* Connects perfectly to Task 4 (One atom world).
          *   *Physics Hook:* Probabilistic laws are real physics.
      *   *Decision:* Let's stick closer to the user's Task 4 idea but make it the *running* example. **A specific particle interaction.** Let's go with **Electron Charge Conservation** or **Particle Decay**.
      *   *Actually, the "One Atom" idea for the end is distinct.* For the *hour*, I need something dynamic.
      *   *Winner:* **Newton's First Law (Inertia).** "Objects in motion stay in motion..."
          *   *Accident:* "All objects in this room are currently stationary." (True, but accidental).
          *   *Counterfactual:* "If I pushed this, would it keep going (in vacuum)?"
          *   *Single Instance:* Can inertia exist with only one object in the universe? (Relationalism vs. Substantivalism bleed-in, maybe too messy).
      *   *Re-evaluating:* The user wants *one* example to shrink down to the single instance at the end.
      *   *Best Candidate:* **A Universal Decay Law.** "All Muons decay within 2.2 microseconds (mean)."
          *   *Accident:* "All Muons *in this lab* decay..."
          *   *Counterfactual:* "If we made a Muon on Mars, would it decay?"
          *   *Single Instance:* "If there was only one Muon ever, is it a law?"
      *   *Let's refine:* **The "Sphere of Uranium-235" example is actually the standard for a reason, but it's static.** Let's dynamize it. **"No U-235 sphere exceeds critical mass."**
          *   *Accident:* "No U-235 sphere *in my garage* exceeds critical mass."
          *   *Counterfactual:* "If I added more U-235 to this sphere, would it explode?" (Law says yes, Accident says maybe not).
          *   *Single Instance:* "If the universe contained only one U-235 atom, is it a law that U-235 is unstable?"
      *   *Wait, the Physics Majors:* They might say "Critical mass is just geometry + cross-sections."
      *   *Okay, let's go with the User's Task 4 idea as the Running Example.* **A specific decay probability.**
      *   *Example:* **"Trout decay."** (Made up particle). "All Trouts decay within 1 second."
          *   *Why:* Avoids real physics baggage (Standard Model debates).
          *   *Accident:* "All Trouts *in this box* decay within 1 second."
          *   *Counterfactual:* "If I put a Trout in a vacuum, does it decay?"
          *   *Single Instance:* "If only one Trout ever exists, is it a law?"
      *   *Decision:* Use a **fictional particle decay**. It keeps the physics majors from correcting the science and focuses them on the metaphysics. Let's call it the **"Omega Particle."**

  4.  **Deconstruct Task 3: Killing Misconceptions**
      *   (a) *Humeanism = Language/Summary:* Needs killing early, when defining Humeanism. It's ontological, not linguistic.
      *   (b) *Induction Problem:* Needs killing during the "What we do with laws" section (Prediction).
      *   (c) *Literal Push:* Needs killing when defining Anti-Humeanism. It's modal, not mechanical.
      *   (d) *Physics Major Objection ("Equations tell system what to do"):* This is the big one. Needs addressing when comparing the two views. It's a category error (math vs. metaphysics).
      *   *Timing:*
          *   (a) & (c) during the Theory Intro.
          *   (b) during the "Function of Laws" section.
          *   (d) during the Comparison/Debate section.

  5.  **Deconstruct Task 4: The Final Question (One Atom World)**
      *   *Scenario:* One atom, decays once, nothing else exists.
      *   *Humean Answer:* No law. (Best System requires a mosaic. A single fact has no pattern. No systematization possible).
      *   *Anti-Humean Answer:* Yes law. (The nature of the atom *makes* it decay, regardless of frequency).
      *   *Fake Right Answer:* "Yes, because physics says so" (Misses the metaphysical point). "No, because statistics need N>1" (Misses the modal point).
      *   *Verdict:* It's a classic Armstrong/Carroll example. It works well.

  6.  **Deconstruct Task 5: What to Refuse to Settle**
      *   *Simplicity/Strength trade-off:* Crucial for Best System, but technical. Flag it.
      *   *What makes the mosaic:* Don't get into quiddities vs. categorical properties.
      *   *Tie Cases:* If two systems are equally good, is there a fact of the matter? (Lewis says no). Too niche for 50 mins.
      *   *Origin of Necessitation:* Anti-Humeans don't explain *how* necessitation works, just that it does. Acknowledge this black box.

  7.  **Deconstruct Task 6: Attribution (Who Grants What)**
      *   Need to ensure neutrality.
      *   Humeans grant: Mosaic is fundamental.
      *   Anti-Humeans grant: Modal force is fundamental.
      *   Both grant: Laws support counterfactuals (in their own way).
      *   Both grant: Science aims to find laws.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Tone:* Direct, structured, TA-to-TA.
      *   *Structure:* Follow the user's 5 points + Attribution tag.
      *   *Physics Major Strategy:* Don't fight them. Use them. Ask them "What does the equation *do*?" to expose the metaphysical gap.

      *(Self-Correction during drafting)*: On the example. The "One Atom" at the end is great, but can it carry the *whole* hour?
      *   *Hour 0-15:* General Law vs. Accident. (Use Omega Particle in a lab).
      *   *Hour 15-30:* Humean View. (Omega Particle mosaic).
      *   *Hour 30-40:* Anti-Humean View. (Omega Particle nature).
      *   *Hour 40-50:* The One Atom Shrink.
      *   *Yes, it works.* The example scales.

      *(Refining the Physics Major Objection)*: The objection "Equations tell the system what to do" is actually a disguised Anti-Humean intuition. I need to point out that the *math* doesn't tell us the *metaphysics*. The math is compatible with both.

      *(Refining Misconception (a))*: Humeanism is often taught as "regularity theory." Need to emphasize *Best System* to avoid the "just a list" objection.

      *(Refining Attribution)*: I will add a specific tag [Both], [Humean], [AH] to every key claim in the plan.

  9.  **Final Review against Constraints:**
      *   50 minutes? Yes, the timing looks tight but doable.
      *   Physics majors accommodated? Yes, by using their intuition against the metaphysical leap.
      *   No lecture, just plan? Yes.
      *   All 5 tasks + Attribution covered? Yes.

  10. **Final Polish:** Ensure the distinction between "Summary" (linguistic) and "Supervenience" (ontological) is clear for the TA, so they can explain it simply. Ensure the "One Atom" verdict is clear.

  *(Self-Correction on the Example)*: The user specifically asked *why not* Gold Spheres. I need to be explicit that Gold Spheres fails the "Single Instance" test for the end of class. A decay law works better for the single instance. I will propose the **"Muon Decay"** (or fictional equivalent) as the scalable example. Actually, let's stick to the User's "One Atom" idea for the end, but use a **"Universal Gravitation"** style example for the start, then shrink it.
