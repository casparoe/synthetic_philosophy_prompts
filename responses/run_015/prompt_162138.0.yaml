prompt: |-
  hey — I'm TAing a second-year metaphysics course and I've got one 50-minute section next week on laws of nature: the Humean side (best-system, the mosaic, nothing over and above the matters of particular fact) versus the anti-Humean "laws govern" picture. There'll be two physics majors in the room who are going to be mildly annoyed the whole time, and I'd rather use that than fight it. Don't give me the lecture — give me the plan for giving it.

  First: the order things have to come in, and what depends on what. My instinct is that before either view gets a name I need to pry apart three questions — what a law *is*, what we *do* with laws (explain, predict, support counterfactuals), and what makes a true generalization a law rather than a coincidence — because if I don't, they'll assume the explanatory job settles the metaphysics. Tell me if that's the right spine and what hangs off it in what order.

  Second: one example to carry the whole hour, and I want one I can bend rather than replace — something that does the accidental-generalization work, can be perturbed counterfactually, and can also be shrunk down to a single instance, so I'm not juggling three separate cases. Say what it has to have and what it has to lack, and why *not* the stock "all gold spheres are less than a mile across" type thing.

  Third: where in the sequence to kill each of these, and flag if any of them is a fake misconception they won't actually form — (a) Humeanism means laws are just summaries humans invented, it's a view about language; (b) so on Humeanism the future could be anything and theres no reason to expect the sun to come up; (c) "governing" as a literal push exerted on events; (d) the physics kids' version: the equations obviously tell the system what to do next, so what exactly is the disagreement.

  Fourth: one question at the end that discriminates between someone who got it and someone who can only say "regularity vs. necessitation." I was thinking of handing them a world containing exactly one atom that decays once, with nothing else that ever decays, and asking whether the decay law holds there. Is that a good instrument, and what does a right answer and a fake-right answer sound like?

  Fifth: what should I openly refuse to settle, and say out loud that I'm refusing? I'm guessing the simplicity half of "best-system" and whether tie cases are a real problem, but tell me if I should just flag and move on.

  Last: for each thing you'd have me say, mark whether both camps grant it or it's one side's premise. I don't want to present anti-Humeanism as the sane default, or Humeanism as obviously refuted, and I don't want to tell undergrads the literature has settled something it hasn't.
