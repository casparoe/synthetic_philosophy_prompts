answer: |-
  Here is the battle plan. It is designed to keep the physics majors engaged by treating their intuition as data rather than error, while preventing the philosophy students from getting lost in jargon.

  ### 1. The Spine (Order of Operations)

  Your instinct is correct. If you start with "Humeanism says...", students will treat it as a definition to memorize rather than a solution to a problem. You need to generate the problem first.

  **Sequence:**
  1.  **The Job Description (10 mins):** What do we *want* laws to do? (Support counterfactuals, explain, predict).
      *   *Goal:* Establish the "data" both theories must save.
  2.  **The Distinction (10 mins):** Law vs. Accident. Use the running example to show that truth + universality isn't enough.
      *   *Goal:* Show why we need metaphysics, not just logic.
  3.  **The Humean Solution (10 mins):** The Mosaic + Best System.
      *   *Goal:* Show how to get the Job Done without "governing."
  4.  **The Anti-Humean Solution (10 mins):** Necessitation/Governing.
      *   *Goal:* Show the intuitive cost/benefit.
  5.  **The Stress Test (10 mins):** The Single Instance (Task 4).
      *   *Goal:* Force a choice between the views.

  **Dependency:** You cannot explain *why* Humeanism denies governing (Step 3) until they understand *what* governing is supposed to achieve (Step 1). You cannot evaluate the Single Instance (Step 5) until they understand the Humean commitment to the "Mosaic" (Step 3).

  ---

  ### 2. The Running Example: "The X-Particle Decay"

  Do not use Gold Spheres. It is static and spatial. Physics majors think in terms of dynamics and time.
  Do not use Real Physics (e.g., Electrons). They will fight you on the Standard Model rather than the metaphysics.

  **Use a Fictional Particle: The "X-Particle."**
  *   **The Generalization:** "All X-particles decay within 10 seconds of creation."
  *   **Why it works:**
      *   *Accidental Version:* "All X-particles *in this box* decay within 10 seconds." (True, but maybe the box shields them, or it's just luck).
      *   *Counterfactual:* "If I created an X-particle on Mars, would it decay?" (Law says yes; Accident says who knows).
      *   *Scalable:* You can easily ask, "What if there was only *one* X-particle in the history of the universe?" (Task 4).
      *   *Physics Hook:* It mimics radioactive half-life, which they accept as law-like, but removes the baggage of quantum interpretations.

  **What it must lack:** It must lack a *mechanism*. Do not explain *why* it decays. If you give it a mechanism (e.g., "weak force interaction"), the physics majors will say the mechanism is the law. The metaphysics is about the status of the regularity itself.

  ---

  ### 3. Killing the Misconceptions (Timing & Validity)

  | Misconception | Verdict | When to Kill | How to Kill |
  | :--- | :--- | :--- | :--- |
  | **(a) Humeanism is just language/summaries.** | **Real.** Students think Humeans think laws are *only* in our heads. | **During Step 3 (Humean Solution).** | Clarify: The Mosaic is objective. The *systematization* is human-relative, but the *truth* of the best system is not. It's ontological parsimony, not linguistic convenience. |
  | **(b) Humeanism implies no reason to expect the sun to rise.** | **Fake.** (Mostly). This is the "Induction" problem, not the "Laws" problem. | **During Step 1 (Job Description).** | Flag it: "Humeans admit induction is hard. But so do Anti-Humeans. Having a 'governing' law doesn't guarantee the governor won't change its mind. Don't conflate skepticism with metaphysics." |
  | **(c) Governing is a literal push/force.** | **Real.** Students picture a little ghost shoving particles. | **During Step 4 (Anti-Humean Solution).** | Clarify: It's *modal* force, not mechanical force. It's about what is *possible*, not a new energy field. |
  | **(d) Physics Major Objection: "Equations tell the system what to do."** | **Fake/Category Error.** | **During Step 4 (Comparison).** | Ask them: "Does the equation $F=ma$ exist in the room when the ball falls?" If yes, where? If no, how does it 'tell' anything? Show them the math is compatible with *both* metaphysics. |

  ---

  ### 4. The Final Instrument: The One-Atom World

  **The Setup:** "Imagine a universe containing exactly one X-particle. It exists for 10 seconds and decays. Nothing else ever exists. No other particles, no observers."
  **The Question:** "Is it a law of nature in this universe that 'X-particles decay within 10 seconds'?"

  **Why it works:** It isolates the "Regularity" requirement.
  *   **Humean Answer:** **No.**
      *   *Reasoning:* Laws are summaries of the Mosaic. A single event has no pattern. There is no "Best System" that balances strength and simplicity because there is no variety to systematize. To call it a law is to add something over and above the fact.
  *   **Anti-Humean Answer:** **Yes.**
      *   *Reasoning:* The law is what *makes* the particle decay. The nature of the X-particle necessitates the decay, regardless of how many times it happens.
  *   **The "Fake Right" Answer:** "Yes, because physics says decay is intrinsic."
      *   *Correction:* That's just asserting Anti-Humeanism. Ask: "Why is it intrinsic if it never repeats?"
  *   **The "Fake Wrong" Answer:** "No, because you can't do statistics on N=1."
      *   *Correction:* That's an epistemological point (we can't *know* it's a law), not a metaphysical one (is it a law?).

  ---

  ### 5. What to Refuse to Settle

  You have 50 minutes. Do not try to solve the internal problems of either view. Explicitly state these are "Live Wires."

  1.  **The "Best System" Metrics:** How do we trade off Simplicity vs. Strength? (Lewis leaves this vague).
      *   *Say:* "Humeans argue about how to weigh simplicity. We're assuming there is *a* best system, not figuring out which one it is."
  2.  **The Origin of Necessitation:** Anti-Humeans posit a relation of necessitation, but don't explain *how* it works.
      *   *Say:* "Anti-Humeans admit this is a primitive. They say 'governing' is a basic feature of reality. Humeans say that's magic. We aren't deciding who's right today, just what the cost is."
  3.  **Tie Cases:** What if two systems are equally good?
      *   *Say:* "Lewis says there's no fact of the matter. We're ignoring tie-breakers."

  ---

  ### 6. Attribution Guide (Who Grants What?)

  Use these tags mentally to ensure you aren't biasing the room.

  *   **[Both]**: Laws support counterfactuals (e.g., "If I had dropped this, it would have fallen").
  *   **[Both]**: Science aims to discover true generalizations.
  *   **[Both]**: The "Mosaic" (the distribution of local qualities in space-time) exists. (Anti-Humeans don't deny the mosaic; they say it's not *all* there is).
  *   **[Humean]**: The Mosaic is fundamental. Laws supervene on the Mosaic. (Nothing over and above).
  *   **[Humean]**: A world with the same Mosaic *must* have the same laws.
  *   **[Anti-Humean]**: Laws are fundamental entities/relations. They do not supervene on the Mosaic.
  *   **[Anti-Humean]**: Two worlds could have the exact same Mosaic but different laws (e.g., the single atom world vs. a world where that atom's decay was accidental).
  *   **[Physics Majors]**: The equations predict the Mosaic. (Ensure they see this is neutral between the two metaphysical views).

  ### TA Script Note for the Physics Majors
  When the physics majors get annoyed, pivot to them:
  *"You guys treat the equations as prescriptive. The Humean says the equations are just a very good compression algorithm for the data. The Anti-Humean says you're right, there's a 'push,' but it's not in the math, it's in the metaphysics. Which one of you is willing to say the math is all there is?"*
  This validates their intuition while forcing them into the philosophical dilemma.
