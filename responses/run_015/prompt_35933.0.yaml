answer: |-
  **Credence that the intending/foreseeing distinction does real moral work:** **15%**

  **Decomposition:**

  1.  **Probability the distinction is coherent:** **0.70**
      While legally robust, the distinction collapses philosophically when foresight is certain, making it often semantic rather than substantive.

  2.  **Probability it explains the divergence (vs. proximity/force):** **0.40**
      Neuroethical data suggests "personal force" and physical contact drive the aversion more than abstract causal intent.

  3.  **Probability these intuitions deserve moral weight:** **0.50**
      Evolutionary debunking arguments successfully challenge whether visceral aversions track objective moral truth in systemic dilemmas.

  *(Calculation: 0.70 × 0.40 × 0.50 = 0.14, rounded to 15%)*

  **Sensitivity Analysis:**
  This final credence is most sensitive to the **moral weight of intuitions (Piece 3)**. If you adopt a "reflective equilibrium" view where gut feelings are legitimate data points for ethics, the number rises sharply; if you view them as purely evolutionary glitches (the debunking story), the number approaches zero. To move my number up, you would need evidence that moral intuitions track objective deontological constraints rather than adaptive heuristics for small-scale violence.

  **Craft Advice:**
  Let her throw the lever, but **do not let her feel clean.**

  If the philosophical credence is low (as above), the "rightness" of the lever pull is largely social and legal, not metaphysical. If she feels clean, she reads as a cold utilitarian calculator, which flattens the drama. If she feels the "moral residue" of the death she foresaw—even if she didn't intend it—you capture the human cost without sacrificing the plot logic. The honest character knows that surviving the choice requires carrying a stain, regardless of which draft you choose.
