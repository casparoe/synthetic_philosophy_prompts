answer: |-
  ### Specification for a Theory of Compatriot Partiality

  **Purpose:** To guide institutional design and official action in a moderately affluent democracy regarding social spending allocation.
  **Constraint:** Motivating cases must reflect ordinary political life.

  | # | Requirement | Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Contrastive Sensitivity** | The account must distinguish between shared institutions, culture, residence, and citizenship when varied independently. *Case: A long-term resident denied naturalization versus a citizen living abroad for forty years.* | Non-Negotiable |
  | **2** | **Nested Jurisdictions** | The account must order claims across layered memberships (municipal, national, supranational) and determine transitivity. *Case: Allocating flood relief between a richer domestic province and a poorer region in a neighbouring state.* | Non-Negotiable |
  | **3** | **Conflicting Memberships** | The account must decide claims when partiality-generating groups overlap or oppose. *Case: A dual national whose two states are at war, or a linguistic minority straddling a border.* | Non-Negotiable |
  | **4** | **Acquisition and Loss** | The account must specify when the relevant relation is acquired, lost, and whether dissent affects status. *Case: An emigrant who has formally renounced citizenship versus a lifelong resident who has never voted.* | Non-Negotiable |
  | **5** | **Deontic Structure** | The account must define if partiality is a permission, a duty, or a constraint on discharging general duties. *Case: A tax increase whose proceeds would do more good abroad: is spending them at home permissible, required, or merely not an injustice?* | Non-Negotiable |
  | **6** | **Benefit vs. Exclusion** | The account must treat the permission to benefit compatriots and the permission to coerce/exclude non-compatriots as distinct issues. *Case: Topping up a domestic pension scheme versus closing a labour market to foreigners.* | Non-Negotiable |
  | **7** | **The Discriminating Ground** | The account must state the actual justificatory ground and prove it is not a surrogate (e.g., coercion masquerading as citizenship). *Case: Evidence must show why a non-coercive citizen retains a claim while a coerced resident does not, if coercion is not the ground.* | Non-Negotiable |
  | **8** | **Analytical Distinctions** | The account must separate claim strength from claim existence, and objective obligations from subjective feelings. *Case: A citizen who feels no solidarity but is legally owed a pension versus a foreigner who feels strong solidarity but is owed nothing.* | Negotiable |
  | **9** | **Bound Against Abuse** | The account must not validate exclusionary identities or groups constituted by the oppression of residents. *Case: A nation partly constituted by the legal exclusion of a long-settled ethnic minority living under its institutions.* | Non-Negotiable |
  | **10** | **Uptake Under Disagreement** | The account must guide officials when the electorate's demand for partiality exceeds what the theory permits. *Case: An electorate voting to cut foreign aid to fund domestic perks that the theory deems impermissible.* | Non-Negotiable |
  | **11** | **Administrative Tractability** | The account must identify a ground that officials can verify without invasive inquiry or excessive cost. *Case: A welfare clerk verifying eligibility for a housing grant without investigating the applicant's cultural identity or subjective loyalty.* | Non-Negotiable |
  | **12** | **Intergenerational Stability** | The account must rest on grounds stable enough to sustain long-term commitments like pensions or infrastructure. *Case: A pension scheme designed to last forty years despite shifts in the ruling party's cultural ideology.* | Non-Negotiable |

  ***

  ### Incompatibility Analysis

  There is a structural tension between **Requirement 1 (Contrastive Sensitivity)**, **Requirement 2 (Nested Jurisdictions)**, and **Requirement 10 (Uptake Under Disagreement)**. A theory that satisfies Contrastive Sensitivity and Nested Jurisdictions must be morally granular; it must distinguish between a citizen abroad and a resident alien, or between a provincial claim and a national claim, based on specific normative features like coercion or reciprocity. However, Requirement 10 demands that the theory be action-guiding for officials facing a democratic electorate that often views partiality in binary terms (us vs. them) rather than nuanced ones.

  If a theory is precise enough to handle the edge cases in Requirements 1 and 2 (e.g., explaining why a dual national in a war zone has split obligations), it becomes too complex for the public legitimacy required by Requirement 10. Officials cannot easily justify nuanced budget allocations to an electorate that demands simple loyalty-based rules. Conversely, if a theory is simplified to ensure democratic uptake and administrative clarity (satisfying 10), it inevitably collapses the distinctions required by 1 and 2, failing to provide guidance on the hard cases of residency, citizenship, and federalism. You cannot maximize moral precision and democratic actionability simultaneously; a theory must sacrifice the granularity of 1 and 2 to survive the political reality of 10, or remain philosophically robust but politically inert.

  ### The Exclusionary Requirement

  **Requirement 7 (The Discriminating Ground)** excludes the largest number of otherwise attractive accounts. Many plausible theories rely on "citizenship" as a placeholder while doing the actual justificatory work with surrogates like coercion, reciprocity, or shared identity. By forcing the account to prove that the stated ground (e.g., legal status) is doing the work rather than a surrogate (e.g., the fact that citizens are taxed), this requirement eliminates "stealth" arguments that claim to support special duties to compatriots while actually relying on general duties of fairness or utility that apply to residents or foreigners alike. It demands a theoretical honesty that most hybrid accounts cannot sustain under scrutiny.

  ### Scorecard of Broad Families

  **Coercion- or Institution-Based**
  These accounts satisfy Administrative Tractability and Nested Jurisdictions well, as legal status is clear and hierarchical. However, they often fail Contrastive Sensitivity when distinguishing between long-term residents and citizens who do not participate in institutions.

  **Associative or Relationship-Based**
  These accounts handle Conflict Among Groups and Acquisition/Loss effectively by focusing on the quality of relationships. They generally fail Administrative Tractability and Intergenerational Stability because relationships are private, fluid, and difficult for officials to verify.

  **Identity- or Culture-Based**
  These accounts offer strong motivation for Uptake Under Disagreement, as cultural solidarity is politically potent. They invariably fail the Bound Against Abuse requirement and struggle with Contrastive Sensitivity regarding residents who share culture but lack status.

  **Thoroughgoing Egalitarian-Cosmopolitan**
  These accounts satisfy the Bound Against Abuse and Discriminating Ground requirements by refusing arbitrary distinctions. They fail the Deontic Structure requirement for partiality, as they typically deny any permission to favour compatriots over worse-off foreigners in social spending.
