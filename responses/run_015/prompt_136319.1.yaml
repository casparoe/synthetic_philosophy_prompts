prompt: |-
  hey, i'm writing a chapter on consciousness models and i keep coming back to the split-brain work from the 60s/70s. can you analyze the Sperry-Gazzaniga experiments through the lens of Dennett's rejection of the Cartesian theater and his multiple drafts model? specifcally, i want a careful mapping: when the left hemisphere confabulates a reason for a right-hemisphere action, is that best read as a central narrator (theater) trying to maintain coherence over disconnected drafts, or as one draft among many being retroactively promoted to 'official' status? and then the reverse: if Dennett is right that there's no central stage, why do split-brain patients present as unified agents in ordinary life rather than as obvious collections of competing drafts? i think there's something about fame in the brain or editorial selection that might answer this, but i want you to push it hard -- does the model actually predict the specific pattern of confabulation we see, or is it just post-hoc? also, please say what would change your mind here: what result or argument would make you think the Cartesian theater is actually the better fit for these cases, or that Dennett's model can't handle thier behavior?
