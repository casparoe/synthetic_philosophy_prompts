          *   *Key Distinction:* Is the confabulation a *repair job* for a central observer (CT) or the *natural output* of a linguistic module competing for influence (MDM)? Dennett favors the latter. The "official story" is just the story that got broadcast most widely.

      *   **The Unity Problem (Why they seem normal):**
