          *   Actually, if signaling fails completely, the practice might collapse. Why apologize if it doesn't change beliefs? It would become purely performative for domestic audiences, not international reconciliation.
          *   *Refinement:* If we can't distinguish repentance, the *function* of the apology shifts from reconciliation to risk management. The "cost" becomes a premium paid to lower the probability of retaliation, regardless of inner state.

