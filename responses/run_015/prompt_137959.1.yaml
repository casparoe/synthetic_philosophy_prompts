      *   *Victim:* Wants high cost, specificity (names, places), symbolic abasement, reparations + admission.
      *   *Context:* Often involves predecessor regimes (continuity vs. discontinuity of the state).

  3.  **Evaluate the Hypotheses (Task 1):**

      *   *Hypothesis 1: Costly Signaling (General).*
          *   *Analysis:* The pattern definitely involves cost. The victim demands cost. But is it *strictly required* that the cost signals *inner remorse*? Or just commitment?
          *   *Verdict:* Fits well, but maybe not strictly required as "remorse signaling." It's required that there *is* a cost, but the *meaning* of the cost is debatable.

      *   *Hypothesis 2: Specificity/Indexicality (Speech Act Theory).*
          *   *Analysis:* The user notes money isn't enough. The apology must "fit" the crime. This aligns with Austin/Searle speech act theory (felicity conditions). A generic "sorry" doesn't repair the specific normative rupture.
          *   *Verdict:* Strictly required. Without specificity, the normative relationship isn't restored. It's not just signaling; it's constitutive.

      *   *Hypothesis 3: Currency/Status (Non-fungibility).*
          *   *Analysis:* Why is money insufficient? Because the wrong was an affront to dignity/sovereignty, not just an economic loss. Restoring status requires status currency (honor, face), not just economic currency. The liability disclaimer supports this: "We give you status (apology) but keep legal safety (money/liability)."
