      *   *Hypothesis 4: Forward-looking (Commitment Device) vs. Backward-looking (Remorse).*
          *   *Analysis:* The user asks if it's about present remorse or future non-repetition. Given the "predecessor regime" aspect, present remorse is ontologically tricky (how can I feel remorse for what *they* did?). A commitment device makes more sense politically.
          *   *Verdict:* Philosophically underdetermined. The practice works either way. It *looks* like remorse, but functions like a bond.

  4.  **Synthesize Task 1 (Categorization):**
      *   *Strictly Required:* Non-fungibility of status (money $\neq$ apology) and Indexicality (the form must match the wrong).
      *   *Fits Well:* Costly signaling (there must be a cost), but the *object* of the signal is debatable.
