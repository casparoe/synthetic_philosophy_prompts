answer: |-
  There is no canonical term for this specific structure. The closest neighbours are **performative contradiction** (usually linguistic: asserting *p* undermines *p*) and **self-defeating policies** (adopting a rule prevents achieving its goal). Your case differs: it is not about truth or goals, but about the *conditions of permissibility* being ontologically consumed by the act.

  Since the ground is unoccupied, I propose: **Self-Exhausting Permission**.

  **Definition:** A normative justification that is valid only under contingent background conditions which the performance of the justified act necessarily alters or destroys, thereby invalidating the justification for any subsequent act.

  **True Instances:**
  1.  **Torture:** As you note, the justification requires "no standing capacity." The act requires creating standing capacity. The first act destroys the condition (absence of infrastructure) required for the justification to hold.
  2.  **Secret One-Time Vote:** A rule allowing a single secret ballot to resolve a deadlock. If the mechanism for verifying the "one-time" nature requires recording the voter, secrecy is destroyed. If it requires no record, the "one-time" limit cannot be enforced. The act of voting collapses the conditions for the rule's validity.

  **False Instances (Boundary Drawn):**
  1.  **Slippery Slope:** This predicts *contingent* abuse (people become corrupt). Self-exhausting permission holds even under perfect compliance; the destruction is structural, not behavioural.
  2.  **Schmittian State of Exception:** Here, the sovereign suspends law to preserve order. The exception is *repeatable* because the sovereign power persists. In self-exhausting permission, the *condition* (e.g., isolation) is consumed, not the power.

  **Implication for the Ticking-Bomb:**
  Recognizing this structure shifts the debate from empirical realism ("Will this happen?") to conceptual coherence ("Can this be codified?"). The ticking-bomb argument attempts to derive a standing rule from a scenario that presupposes no standing rule. If the permission is self-exhausting, it cannot be legislated. To legislate it is to create the standing capacity (doctrine, training, premises) that the justification explicitly denies. Therefore, the ticking-bomb case cannot serve as a foundation for policy; it functions only as an uncodifiable tragic choice. If you argue for a rule, you admit the capacity; if you admit the capacity, the "one-off" justification collapses. The argument dissolves not because torture is always wrong, but because a *regulated exception* that must remain *unregulated* is a contradiction in terms.
