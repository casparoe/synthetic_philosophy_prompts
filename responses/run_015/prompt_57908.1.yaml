      *   *Also:* The prompt asks for 3-4 lines of brainstorming first.

      *   *Draft 5 (Strict Blank Verse):*
          1.  Imagine light removed and sound withdrawn,
          2.  No limb to weigh you down from dusk to dawn. (Rhyme) -> No limb to weigh you down or hold you still.
          3.  You cannot feel where fingers meet the air,
          4.  Or find the boundary of your body there. (Rhyme) -> Or locate where your body ends at all.
          5.  Erase the memory of having skin,
          6.  The ghost of elbows, phantom shape of chin. (Rhyme) -> The ghost of elbows, phantom shape of jaw.
          7.  Suspend yourself in void, unmade, unframed,
