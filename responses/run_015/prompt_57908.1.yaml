          13. tone,
          14. flesh. (OK)

      *   *Refining the Philosophy:*
          *   Avicenna says even if you imagine you have no body, you still affirm your self.
          *   The poem needs to reflect that *even if* the body is gone, the self is there.
          *   Then the plot twist: The body *is* there (heartbeat), but the self is still distinct.
          *   Lines 1-8: Strip senses.
          *   Line 9: The "I" remains.
          *   Lines 10-14: The body signals return, but are observed, not owned.

      *   *Final Polish of Lines:*
          1.  Imagine light removed and sound withdrawn,
          2.  No limb to weigh you down or hold you still.
          3.  You cannot feel where fingers meet the air,
          4.  Or locate where your body ends at all.
          5.  Erase the memory of having skin,
