          13. But know the listener is not the tone,
          14. The thing that knows the beat is not the flesh.

      *   *Check constraints:*
          *   14 lines? Yes.
          *   Loose blank verse? Yes (mostly iambic, no rhyme).
          *   Second person present tense? Yes.
          *   Lines 1-8 strip senses? Yes (light, sound, limb weight, fingers, skin, elbows/jaw, void).
