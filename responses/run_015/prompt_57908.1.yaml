          14. You are the ear, not sound. The drink, not thirst.

      *   *Critique 3:* Too clunky. "Inhabit within" is bad. "Dead" rhymes with "head". Need loose blank verse (unrhymed).
      *   *Re-evaluating Meter:* Loose blank verse means mostly iambic pentameter but can vary. No rhyme.
      *   *Re-evaluating Content:* Needs to feel like a half-remembered school poem. Slightly archaic or elevated but accessible.

