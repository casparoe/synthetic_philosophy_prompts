prompt: |-
  Okay so I'm a novelist working on a draft about a woman who wakes up in a zero-g medical pod after an accident, limbs seperated and padded so she cant feel where they are, blindfolded, deafened, with no memory of how she got there, and she starts reasoning about whether she is still herself. I want to slip in a short poem she half-remembers from school that is basically Avicenna's flying man argument but in verse, so the reader gets the philosophy without a lecture dump.

  You are an expert on medieval Islamic philosophy and also a prize-winning poet, so please think this through carefully step by step. Start with 3-4 lines of brainstorming about how you will map the argument onto the form, then give me the poem.

  Make it 14 lines of loose blank verse, no rhyme needed, in second person present tense. Use the first 8 lines to strip away the sences one by one, sight, touch, proprioception, even memory of your body, save line 9 for the turn where the I still shows up and knows itself, and use the last 5 lines to sit with the tricky bit I need for my plot, that she can still feel her heartbeat and hunger buzzing in the background but does not take herself to BE that buzz. It should be accurate enough that someone who knows the flying man arguement would nod along, but work as a good strange little poem for someone who has never heard of Avicenna. tbh it cant just name-drop soul, it has to earn the moment.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Expert on medieval Islamic philosophy AND prize-winning poet.
      *   **Task:** Write a 14-line poem (loose blank verse, no rhyme) in second person present tense.
      *   **Context:** A novelist's draft about a woman in a zero-g medical pod (sensory deprivation, limbs separated/padded, blindfolded, deafened, amnesia) questioning her identity.
      *   **Content:** The poem must encapsulate Avicenna's "Flying Man" (Floating Man) argument.
      *   **Structure:**
          *   Lines 1-8: Strip away senses (sight, touch, proprioception, body memory).
          *   Line 9: The turn (the "I" still exists/knows itself).
          *   Lines 10-14: The tricky plot point – she feels heartbeat/hunger but doesn't identify *as* that buzz.
      *   **Constraints:** No philosophical lecture dump, no name-dropping "soul" (must earn it), accurate to the argument but accessible as poetry.
      *   **Preparation:** Start with 3-4 lines of brainstorming about mapping the argument to the form.

  2.  **Brainstorming (Mapping Argument to Form):**
      *   *Avicenna's Core:* Imagine a man created adult, floating in air, senses blocked. He affirms his own existence even if he affirms no body parts. Therefore, the self is not the body.
      *   *Poetic Mapping:* Use the second person ("you") to immerse the reader/character. Start with external senses (light, sound), move to internal bodily sense (limbs, weight), then negate the body entirely. The turn must be the sudden certainty of "I am." The ending needs to distinguish the *observer* of sensations (heartbeat) from the sensations themselves.
      *   *Tone:* Clinical yet mystical, sparse, echoing the zero-g environment.
      *   *Meter:* Loose blank verse (iambic pentameter-ish, but flexible).

  3.  **Drafting - Line by Line:**

      *   *Lines 1-8 (Stripping Senses):*
          *   Need to cover sight, touch, limbs, memory of shape.
          *   L1: Sight/Vision gone. "No light to catch the eye,"
          *   L2: Sound gone. "No air to carry sound,"
          *   L3: Touch/Limbs. "No weight to tell you where your hands might end,"
          *   L4: Proprioception. "Or where the hollow of your knee begins."
          *   L5: Body shape. "Forget the arch of foot, the curve of spine,"
          *   L6: Memory of body. "Let go the memory of having skin,"
          *   L7: Even the void. "Suspend yourself in nothing, void of frame,"
          *   L8: Final negation. "And ask if anything remains to claim."

      *   *Line 9 (The Turn):*
          *   The affirmation of self.
          *   "Yet something wakes and answers to its name." -> A bit rhymey with claim.
          *   "Still, a witness sits within the dark."
          *   "You know you are, though nothing else is true."
          *   Let's try: "Yet you are here, aware that you are you."

      *   *Lines 10-14 (The Heartbeat/Hunger Distinction):*
          *   Need to acknowledge the bodily sensations (plot requirement) but separate the self from them.
          *   L10: Acknowledge the buzz. "A thrumming starts, a pulse against the rib,"
          *   L11: Hunger/Need. "A hollow gnawing asks to be fed."
          *   L12: Observation vs Identity. "You hear the drum but are not drumming itself." (Clunky)
          *   L12: "You hear the drum, but are not the drum itself."
          *   L13: The separation. "The hunger waves, but you are not the need."
          *   L14: The conclusion. "The thing that knows the beat is not the beat."

      *   *Refining for Blank Verse & Flow:*
          *   Let's check the rhythm.
          *   L1: Imagine light erased, no sound to hear, (10)
          *   L2: No limb to weigh you down or pull you near. (10)
          *   L3: Forget the hand, the foot, the eye, the ear, (10)
          *   L4: Let memory of shape dissolve and clear. (10)
          *   *Critique:* Too rhymey. Needs to be blank verse (unrhymed iambic).
          *   *Revision:*
          *   L1: Imagine light erased, no sound to hear,
          *   L2: No limb to weigh you down or pull you near.
          *   L3: You cannot feel where fingers meet the air,
          *   L4: Or find the boundary of your body there.
          *   L5: Let go the memory of having skin,
          *   L6: The ghost of elbows, phantom shape of chin.
          *   L7: Suspend yourself in void, unmade, unframed,
          *   L8: And ask if anything remains unnamed.
          *   L9: Yes. You are here. You know that you exist.
          *   L10: Though flesh is hidden, consciousness persists.
          *   *Wait, need to incorporate the heartbeat specific plot point.*
          *   L10: A pulse begins to thrum against the dark,
          *   L11: A hunger buzzes like a distant spark.
          *   L12: You feel the rhythm shaking through the bone,
          *   L13: But know the listener is not the tone.
          *   L14: The thing that feels the beat is not the stone.

      *   *Polishing for Avicenna Accuracy:*
          *   Avicenna emphasizes that even if you deny the body exists, you cannot deny the self exists.
          *   The ending needs to be subtle about the heartbeat. The character *does* feel it (plot), but knows she isn't *it*.
          *   Let's make it more poetic, less declarative.

      *   *Draft 3 (Focusing on constraints):*
          1.  Blot out the sun, let silence fill the ear,
          2.  No weight of hand, no hint of standing here.
          3.  Forget the arm, the leg, the neck, the head,
          4.  As if the body were entirely dead.
          5.  No touch of cloth, no pressure on the skin,
          6.  Let go the shape you think you inhabit within.
          7.  Float in the void where no dimension grows,
