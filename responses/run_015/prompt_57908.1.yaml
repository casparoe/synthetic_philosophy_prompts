      *   *Line 10-14:* "pulse insists below" / "hunger buzzing" / "rhythm shaking" / "listener not tone" / "knows beat not flesh". This captures the distinction between the *subject* of experience and the *object* of experience (qualia), which is the core of the Flying Man's conclusion regarding the soul's immateriality, adapted here for the plot.

