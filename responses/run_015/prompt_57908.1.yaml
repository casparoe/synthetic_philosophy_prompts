          9.  Yes, you are here; you know that you exist.
          10. Now notice how the pulse insists within the mist, (Rhyme with exist) -> Now notice how the pulse insists below,
          11. A hunger buzzing like a distant spark,
          12. You feel the rhythm shaking through the dark. (Rhyme) -> You feel the rhythm shaking through the deep.
          13. But know the listener is not the tone,
          14. The thing that knows the beat is not the bone. (Rhyme) -> The thing that knows the beat is not the flesh.

      *   *Let's check the rhymes again:*
          1.  withdrawn
          2.  still (OK)
          3.  air
          4.  all (OK)
          5.  skin
          6.  jaw (OK)
          7.  unframed
          8.  claim (Slant rhyme) -> Let's change L8. "And ask what substance rises from the dark."
          9.  exist.
