answer: |-
  Your intuitions are remarkably consistent with contemporary philosophical discussions surrounding the "Gamer's Dilemma" and virtual ethics (e.g., the work of Morgan Luck, Christopher Bartel, or Ali Karjaluoto). You have correctly identified that the moral weight does not reside in the code itself, but in the **relational structure** between the player, the simulation, and the fictional context.

  To articulate the principle you are looking for, we can construct a framework based on three axes. Let's call this the **Principle of Simulated Subjectivity and Relational Commitment**.

  ### The Three Axes of Moral Weight

  Your verdicts suggest that moral concern scales according to three variables:

  1.  **Phenomenological Depth (The Simulation of Suffering):**
      *   Does the entity simulate an interior state?
      *   *Mario* does not; he is an avatar with no simulated fear.
      *   *The Sims* do; they panic, cry, and have needs.
      *   *Verdict:* Higher phenomenological depth invites stronger moral constraints because it triggers the player's empathy mechanisms. Drowning a Sim is cruel because the game simulates *distress*, not just state change.

  2.  **Narrative Individuation (The Specificity of Identity):**
      *   Is the entity interchangeable or unique?
      *   *Anonymous Sims/Procedural Soldiers* are fungible resources.
      *   *Named Sims/Scripted Squadmates* are particularized.
      *   *Verdict:* Moral obligations strengthen with individuation. We have duties to "persons," not to "types." Deleting a save of anonymous Sims is wasteful (like shredding blank paper); deleting a specific narrative arc is a loss of particular value.

  3.  **Diachronic Continuity (Persistence Across Time):**
      *   Does the entity retain a history that matters to its future?
      *   *Instance Resets* break the timeline; the "past" is erased.
      *   *Persistent Worlds* maintain the timeline; the "past" is integral to the entity's existence.
      *   *Verdict:* Wiping a persistent database is akin to genocide because it destroys a *history* that the simulation treats as real. Resetting an instance is merely closing a book.

  ### Applying the Principle to Your Cases

  *   **The Sims:** Drowning a named Sim scores high on all three axes (simulated panic, unique identity, persistent life). Deleting anonymous Sims scores low on individuation.
  *   **XCOM 2:** The procedural soldier is a tool (low individuation). The scripted squadmate is a narrative agent (high individuation).
  *   **Minecraft:** Killing a villager is instrumental (low narrative bond). Curing a zombie villager is restorative (high narrative bond—you are returning them to a state of "personhood").
  *   **Mario vs. Dark Souls:** Mario is a cursor (low phenomenological depth). The Dark Souls character is a vessel for player investment and struggle (high relational commitment/permadeath stakes).
  *   **Persistent World:** High continuity makes the "lives" within it morally weightier than instance-based lives.

  ### Addressing Your Specific Questions

  #### 1. The Resurrection Case: Callousness or Efficiency?
  *The Case:* In a narrative-driven game with a revival mechanic, is refusing to pay currency to resurrect a companion morally callous?

  **The Verdict:** It depends on the **Diegetic Integration** of the mechanic.

  *   **Scenario A (Ludic):** If the resurrection is a menu option ("Pay 50 Gold to Continue?"), refusing is **resource efficiency**. The death is a "game over" state, not a narrative event. The currency represents player effort, not in-world wealth.
  *   **Scenario B (Diegetic):** If the resurrection requires an in-world action (e.g., carrying the body to a shrine, spending gold gathered *by the party* while the companion's ghost pleads with you), refusing is **morally callous**.

  **Why?** In Scenario B, the currency represents *in-world value*, and the mechanic represents a *choice within the fiction*. By hoarding resources over the life of a companion with whom you have established a **Relational Commitment** (Axis 2), you are prioritizing material accumulation over a simulated bond. It violates the norm of loyalty established by the narrative. It is not "harm" in the real-world sense, but it is an act of **virtual betrayal**, which cultivates the vice of callousness in the player.

  #### 2. Procedural Characters: Never Wronged, or Differently Wronged?
  *The Question:* Does the principle imply purely procedural characters can never be wronged?

  **The Verdict:** They can be wronged, but the nature of the wrong is **Expressive** rather than **Consequential**.

  *   **Consequential Wrong:** Harm done to a being with interests (e.g., a real person, or a hypothetical sentient AI).
  *   **Expressive Wrong:** An action that expresses a vicious character trait in the agent.

  If you torture a procedural soldier in a game that simulates pain (high Phenomenological Depth), you are not harming a moral patient (the code feels nothing). However, you are **expressing cruelty**. You are practicing the psychological patterns of someone who disregards simulated suffering.

  Therefore, procedural characters *can* be objects of moral concern, but the obligation is not *to them*; it is **to yourself and the moral community** to maintain your own capacity for empathy.
  *   **Exception:** If the procedural generation includes enough randomness to create unique "personalities" (e.g., *RimWorld* pawns with distinct traits, relationships, and memories), they migrate toward **Narrative Individuation**. At that point, wronging them shifts from Expressive to a form of **Virtual Betrayal**, similar to the Named Sim.

  ### The Coherent Account: "The Fictional Contract of Care"

  To synthesize this into a single principle:

  > **Moral concern in virtual environments is proportional to the degree to which the player accepts the Fictional Contract of Care.**
  >
  > This contract is activated when the simulation provides cues of **interiority** (pain/fear), **individuation** (name/history), and **continuity** (memory/persistence).
  >
  > *   When the contract is weak (Mario, anonymous mobs), actions are judged by **Ludic Ethics** (efficiency, skill, mechanic exploitation).
  > *   When the contract is strong (Named Sims, scripted companions, persistent NPCs), actions are judged by **Narrative Ethics** (loyalty, cruelty, betrayal).

  **Conclusion on your Reversing Case:**
  In the resurrection scenario, if the game has successfully established a **Narrative Ethics** framework (the companion is individuated, the death is treated seriously), refusing to resurrect them is **morally callous**. It treats a narrative bond as a ludic transaction. It is a failure of *virtual virtue*.

  **Conclusion on Procedural Characters:**
  They are not immune to moral consideration. While they lack the *rights* of individuated characters, treating them with gratuitous cruelty violates the **Expressive Norms** of the player. We do not owe procedural NPCs loyalty, but we owe our own humanity the discipline of not enjoying simulated suffering.

  Your intuitions are tracking a distinction between **playing a game** (managing systems) and **inhabiting a world** (engaging with simulated subjects). The moral risk arises when we confuse the two, or when we allow the former to erode the norms required for the latter.
