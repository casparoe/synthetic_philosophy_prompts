  ## GAPS & NOTES FOR THE GROUP

  **UNSEPARABLE LEAVES:** **(i) Emptiness** and **(ii) Dissolution**.
  *   **Why:** In practice, saying "the thing is empty" and "the question is wrong" often look identical from the outside.
  *   **Extra Question Needed:** "Is the emptiness a property *of the object*, or a limitation *of your mind*?" (The tree currently routes both to "Rejection of Four").

  **THE "SHIFTING RESPECT" CELL:**
  *   **Status:** **Unexplored / Unstable.**
  *   **Why:** If you allow respects to shift (Q6-B), the four corners collapse into contextualism. This isn't a stable metaphysical position; it's a linguistic workaround. It usually degrades into (i) or (ii) upon scrutiny.

  **THE FIFTH CORNER FRIEND:**
  *   **Verdict:** She is **half-right**.
  *   **Why:** Node 9 separates her view (vi) from Dissolution (ii). If "Neither" is a *positive description* of a mystical state, it is a Fifth Corner. If "Neither" is just *silence*, it is Dissolution. Make her answer Node 9.

