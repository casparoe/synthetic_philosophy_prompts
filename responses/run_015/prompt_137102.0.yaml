answer: |-
  The sun casts down a long and steady shadow,
  Time opens like a hand to fold the day,
  We strain our eyes to clear the horizon,
  And take a ruler to measure out the way,
  Each planet keeps its strict and known orbit,
  From every distinct and calculated seed.

  Plant any given moment like a seed,
  It grows into a fixed and cast shadow,
  Nothing deviates from the planned orbit,
  The future is a map we simply fold,
  We have the tools to measure every ray,
  And see beyond the bounded horizon.

  But sight grows dim before the horizon,
  And doubles back upon the original seed,
  For every digit used to measure state,
  We buy less time against the creeping shadow,
  The paper creases where we fold the day,
  And drifts away from the computed orbit.

  We cannot name the true and exact orbit,
  Though statistics hold beyond the horizon,
  The phase space shows a complex, tight fold,
  While uncertainty clings to the small seed,
  One path mimics the other's false shadow,
  And mocks the attempt to measure decay.

  No finite tool can ever measure,
  The true deviation of the orbit,
  When the model casts a distinct shadow,
  Far past the reliable horizon,
  It matters little how we choose the seed,
  If the manifold refuses to fold.

  It returns to the stretching and the fold,
  Return again by a fixed measure,
  Yet tell us nothing of the initial seed,
  Though we know the shape of the orbit,
  It lies forever beyond our horizon,
  A fixed but unreachable shadow.

  We stop asking which orbit holds the seed,
  And measure where the wide horizon bleeds,
  In the fold that casts the final shadow.
