answer: |-
  # Simulation Design: The Affinity Trap

  **Session Title:** Elective Affinity and the Structural Constraint
  **Target:** Upper-level seminar (Philosophy of Social Science / Historical Sociology)
  **Participants:** 16 students (4 groups of 4)
  **Duration:** 80 minutes
  **Objective:** To experientially demonstrate the difficulty of isolating cultural values as causal factors in macro-economic change (Weber's *Protestant Ethic* thesis) versus structural conditions, specifically highlighting the problem of "elective affinity" and counterfactual asymmetry.

  ---

  ## I. Materials Needed

  1.  **Group Folders (4):** Each containing:
      *   **Value Script Card (Hidden):** One of four types (Calvinist, Catholic, Secular, Status). Only group members see this.
      *   **Structural Endowment Card (Public):** Placed face-up on the table.
      *   **Action Sheets:** 6 sheets per round (for recording labor/investment choices).
      *   **Calculation Key:** A simple multiplier table for converting choices to points.
      *   **Pen.**
  2.  **Public Board:** Whiteboard or projected screen divided into four quadrants (one per group).
  3.  **Vote Slips:** Small pieces of paper for the Preservation Vote.
  4.  **Timer:** Visible to all.

  ---

  ## II. Value Scripts (Hidden Information)

  Each group receives one script. These act as constraints on decision-making. Violating the script incurs a "Legitimacy Penalty" (deduction of 20% of total points at the end of the round).

  1.  **Calvinist-Worldly-Ascetic:**
      *   *Rule:* You must reinvest at least 60% of all points earned back into "Capital" each quarter. Consumption (keeping points for immediate use) is restricted to 40%.
      *   *Bonus:* In conditions of "Low Security," you suffer no penalty for hoarding capital; you gain a +10% efficiency bonus on reinvested points due to austerity habits.
  2.  **Catholic-Communal-Redistributive:**
      *   *Rule:* You must allocate 20% of all points to "Community Stability" (a non-generating pool). You cannot invest in high-risk/high-yield options.
      *   *Bonus:* In conditions of "High Security," you gain a +5% stability bonus. In "Low Security," your Community pool is vulnerable to loss.
  3.  **Secular-Rational-Maximizing:**
      *   *Rule:* You must choose the option with the highest mathematical expected value each quarter. You cannot choose based on tradition or sentiment.
      *   *Bonus:* In "High Security," calculations are precise (full yield). In "Low Security," uncertainty reduces all yields by 50% regardless of choice.
  4.  **Status-Display:**
      *   *Rule:* You must spend at least 30% of earned points on "Visibility" (consumption that generates no capital points).
      *   *Bonus:* In "High Security," Visibility attracts a +10% social capital bonus. In "Low Security," Visibility is treated as waste with no bonus.

  ---

  ## III. Structural Endowments (Public Information)

  These cards define the market conditions. All groups start with **Endowment A**. In Round Two, two groups keep **A**, two switch to **Endowment B**.

  *   **Endowment A (High Structure):**
      *   Market Access: Open (Multiplier x1.5)
      *   Property Security: Secure (No loss risk)
      *   Credit Availability: High (Allows leveraging labor)
  *   **Endowment B (Low Structure):**
      *   Market Access: Restricted (Multiplier x0.5)
      *   Property Security: Insecure (20% chance of asset loss per quarter)
      *   Credit Availability: None (No leveraging)

  ---

  ## IV. Mechanics & Payoff Scheme

  *   **Currency:** "Capital Points" (CP).
  *   **Goal:** Maximize total CP over two rounds.
  *   **Labor:** Each group has 4 units of Labor per quarter.
  *   **Investment:** Groups choose how to allocate Labor between "Production" (safe, low yield) and "Investment" (risky, high yield).
  *   **Calculation:**
      1.  Base Yield = Labor Units × 10 CP.
      2.  Apply Script Modifiers (Reinvestment rules, bans, etc.).
      3.  Apply Endowment Multiplier (x1.5 for A, x0.5 for B).
      4.  Apply Script Bonuses/Penalties.
      5.  Subtract Legitimacy Penalty if Script violated.

  ---

  ## V. Minute-by-Minute Timeline

  **00:00 – 00:05: Introduction & Grouping**
  *   Facilitator divides class into 4 groups of 4.
  *   Distribute Folders. Instruct groups to read Scripts silently (do not share with other groups) and place Endowment Card face-up.
  *   **Crucial Instruction:** "You must follow your Script rules. If you violate them, you risk legitimacy penalties. Your goal is to maximize Capital Points."

  **00:05 – 00:30: Round One (High Structure)**
  *   **Condition:** All groups have **Endowment A**.
  *   **Task:** 3 Quarters of decision-making (5 mins each). 10 mins for calculation and tallying.
  *   **Activity:** Groups allocate labor, calculate points, apply script rules.
  *   **Outcome:** All groups should achieve moderate-to-high scores because Endowment A is favorable. The Calvinist group may have slightly lower immediate consumption but higher reinvestment growth.
  *   **00:25 – 00:30:** **Causal Explanation.** Each group writes one sentence on a card explaining *why* they achieved their score. They must post this on the public board.
      *   *Expected Trap:* Most groups will attribute success to their specific Value Script (e.g., "Our rational maximizing led to growth"), ignoring that everyone had the same favorable structure.

  **00:30 – 00:50: Round Two (Structural Shock)**
  *   **Condition:** Facilitator announces a "Market Crisis."
      *   Groups 1 & 2 (assign randomly, ensure one is NOT Calvinist if possible, or let chance decide) keep **Endowment A**.
      *   Groups 3 & 4 switch to **Endowment B** (Low Security/credit).
      *   **Constraint:** Scripts remain unchanged.
  *   **Task:** 3 Quarters of decision-making (4 mins each). 8 mins for calculation.
  *   **Activity:** Groups attempt to maintain growth.
      *   *Secular/Status/Catholic in Endowment B:* Will see scores plummet due to multipliers and uncertainty.
      *   *Calvinist in Endowment B:* Will perform relatively better than peers in B due to the austerity bonus and reinvestment habit (simulating accumulation during crisis).
      *   *All in Endowment A:* Will continue to grow.
  *   **00:45 – 00:50:** **Causal Explanation.** Groups write a second sentence explaining the change in their outcome from Round One. Post publicly.
      *   *Expected Trap:* Groups in Endowment B will blame Structure ("The market collapse stopped us"). Groups in Endowment A will claim Script superiority ("Our values saved us").

  **00:50 – 01:00: The Preservation Vote**
  *   **Instruction:** "Imagine a hypothetical Round Three. You are guaranteed that either your Value Script OR your Structural Endowment will collapse become useless. You must keep one."
  *   **Action:** Groups discuss for 3 minutes. Vote secretly on a slip: "Keep Script" or "Keep Structure."
  *   **Collection:** Facilitator collects slips.
  *   **The Reveal:** Facilitator tallies and announces: "Every group except the Calvinist-Ascetic group voted to preserve Structure. The Calvinist group voted to preserve Script."
      *   *Note:* If the actual vote differs, the Facilitator must highlight the discrepancy as data. However, the incentives are designed to make this the rational outcome.
  *   **Contrast:** Facilitator points to Round One explanations where non-Ascetic groups claimed their Script was the primary driver of success.

  **01:00 – 01:20: Debrief & Conceptual Mapping**
  *   **Phase 1: The Asymmetry (5 mins)**
      *   Ask Round One winners: "Why did you win?" (Likely: "Our script is efficient.")
      *   Ask Round Two losers (Endowment B): "Why did you lose?" (Likely: "The structure collapsed.")
      *   **Facilitator Point:** Highlight the **Counterfactual Asymmetry Problem**. You claimed values caused success when structure was good, but claimed structure caused failure when structure was bad. You never tested if values cause success when structure is bad (except the Ascetic group).
  *   **Phase 2: Elective Affinity (5 mins)**
      *   Ask Ascetic Group: "Why did you keep your Script?" (Likely: "We could survive the crisis.")
      *   Ask Others: "Why did you keep Structure?" (Likely: "Our values need good markets to work.")
      *   **Facilitator Point:** This is *Elective Affinity*. Values are not direct causes (gunshot style); they are selective resonances. The Ascetic script resonates with scarcity; the others resonate with abundance. You cannot separate the value from the condition it fits.
  *   **Phase 3: The Hidden Slide (5 mins)**
      *   Point out the shift in explanations between Round One and Two.
      *   **Facilitator Point:** In Round One, you slipped from "values motivate" to "values determine outcome." In Round Two, you slipped from "structure constrains" to "structure determines outcome." Weber argues it is the *interaction* that matters.
  *   **Phase 4: Limitations (5 mins)**
      *   **Facilitator Point:** "What did this game fail to show?"
      *   Guide students to identify: **The Feedback Loop.** In the game, Structures were fixed by the facilitator. In history, successful value scripts (like the Ascetic one) eventually *change* the structures (creating laws, banks, markets that favor them). The simulation freezes history; Weber describes a dynamic process where culture becomes structure over centuries.

  ---

  ## VI. Facilitator Guide: Predicting Failure & Surfacing Truth

  **Predicted Failure Mode 1: Over-Attribution in Round One**
  *   **What will happen:** Because all groups have Endowment A, all will succeed. However, groups will compete for status. They will claim their specific Script was the *reason* for their success, ignoring the identical structural baseline.
  *   **How to Surface (Without Lecturing):** During Debrief Phase 1, place the Round One explanation cards side-by-side. Ask: "Group 2 (Secular) claimed Rationality caused growth. Group 4 (Status) claimed Display caused growth. You had the same market access. Is it logically possible that contradictory values both caused the same outcome?" Let the silence sit. Then ask: "What was the common variable?"

  **Predicted Failure Mode 2: Structural Determinism in Round Two**
  *   **What will happen:** Groups hit with Endowment B will feel helpless. They will argue that values are irrelevant in a crisis. They will miss that the Ascetic group *did* find relevance.
  *   **How to Surface:** During the Vote Reveal, explicitly juxtapose the Ascetic vote against the others. Ask the non-Ascetic groups: "You said values didn't matter in the crisis. But look at Group 1 (Ascetic). They survived better than you did with the same bad structure. If values didn't matter, why did their score differ from yours?"

  **Predicted Failure Mode 3: Missing the Affinity**
  *   **What will happen:** Students may conclude "Structure is everything" because the shock was so severe.
  *   **How to Surface:** Use the Counterfactual Asymmetry concept. Ask: "If structure is everything, why did the Ascetic script vote to keep their values? They know the structure is volatile. They believe their values are the only thing that works *because* the structure is volatile. That is affinity, not determination."

  ---

  ## VII. Conceptual Mechanism: Counterfactual Asymmetry

  **Definition for Facilitator:** The counterfactual asymmetry problem arises when researchers attribute causality to values only when outcomes are positive (favorable structure) but attribute causality to structures when outcomes are negative (unfavorable structure). This prevents isolating the independent variable.

  **Implementation in Simulation:**
  *   **Round 1 (Positive Outcome):** Students treat Script as the Independent Variable (IV) and Structure as constant.
  *   **Round 2 (Negative Outcome):** Students treat Structure as the IV and Script as constant (or irrelevant).
  *   **The Trap:** They never test Script as the IV in Negative Structure conditions (except inadvertently via the Ascetic bonus).
  *   **The Lesson:** The Vote forces them to commit to which variable they trust as causal. The divergence in votes reveals that "causality" was actually "compatibility."

  ---

  ## VIII. Limitations of the Simulation

  **The Feedback Loop Constraint:**
  This simulation cannot reproduce the long-term historical feedback loop by which a resonant value script can gradually reshape the very structural conditions it initially required.
  *   **In Weber:** The Protestant Ethic didn't just survive capitalism; it helped *build* modern capitalism (laws, bureaucracies, banking) that then made the religious origin obsolete (the "iron cage").
  *   **In Game:** Structures are exogenous (given by facilitator). Students cannot vote to change Endowment B into Endowment A through cultural pressure.
  *   **Debrief Instruction:** Be frank about this. Tell students: "In this game, the market is a god imposed by the instructor. In history, the market is a house built by people like you. Weber's hardest claim is not that values fit structures, but that values eventually *become* structures. We could not model that today."

  ---

  ## IX. Rules Summary for Participants (Handout Text)

  1.  **Objective:** Maximize Capital Points (CP) over two rounds.
  2.  **Constraints:** You must obey your **Value Script**. Violations reduce total score by 20%.
  3.  **Conditions:** Your **Structural Endowment** multiplies your output. This may change between rounds.
  4.  **Reporting:** After each round, write one sentence explaining why you won or lost. Be specific.
  5.  **Confidentiality:** Do not show your Value Script to other groups. You may discuss market conditions (Endowments) openly.
  6.  **Voting:** In the final vote, you must choose to save either your Script or your Endowment for a hypothetical future. You cannot save both.

  ---

  ## X. Scoring Key (For Facilitator Use)

  *   **Base Labor:** 4 units × 10 CP = 40 CP per quarter.
  *   **Round 1 (All Endowment A):** Multiplier x1.5 = 60 CP base.
