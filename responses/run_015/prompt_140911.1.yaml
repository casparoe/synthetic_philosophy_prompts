prompt: |-
  I'm a third-year undergraduate and I TA one discussion section of our department's "Minds, Animals and Machines" course — 24 students, mostly mixed majors (a lot of psych and CS, a few philosophy minors), one 75-minute section, a room with movable chairs and a whiteboard but no screens, and a budget of essentially nothing. We've had one lecture on the four-fold hierarchy of kinds of minds — Darwinian, Skinnerian, Popperian and Gregorian creatures — and I don't think it landed. Half the section came away thinking the hierarchy is just a scale of more-and-more intelligence, and the other half thinks the top level means "the smart ones use tools." The thing I want them to feel instead is that each transition is a change in *where selection happens and what does the dying*: genetic lineages across generations, an individual's own behaviour within a lifetime, a hypothesis inside one head that is allowed to die in the agent's place, and then, at the top, something genuinely different in kind — a creature whose mind is largely built out of inherited objects (words, marks, procedures) that were shaped by their own transmissibility and need not have been good for the creature carrying them. I tried a version of this last term where I just had teams solve a maze on the floor, and it degenerated into everyone shouting instructions at each other; I now think that degeneration *is* the point, but I couldn't get anyone to see it.

  So: design me a runnable in-class game for that section, with rules and materials, that gets them to run into the differences before they are named. The facilitator should talk for under five minutes up front and must not use the four labels until the debrief. I'd like distinct stations or roles whose permitted *operations* differ rather than whose difficulty differs: a Darwinian cohort that must commit to a fixed policy in writing before receiving any feedback and can only change it by dying and being re-seeded with a mutated copy; a Skinnerian cohort that may revise only after a payoff has actually landed; a Popperian cohort with a deliberately scarce budget of "probe" tokens that let them test a hypothesis without acting in the world; and a Gregorian cohort that inherits a written lore-packet from a previous generation, may invent notation, and then has what it invented copied forward through a noisy, time-pressured transcription step. Give me the hidden world they're all operating on (I was imagining a small grid with a stable hazard and one rule that changes between generations, so that inherited lore can go stale and a second generation can be actively hurt by a tool that used to work), the scoring system — points or candy, no money, no grade stakes — a minute-by-minute timeline for 75 minutes, and a rotation so that everyone plays at least two kinds. Please also build in two probes I've been sketching and tell me what each one's outcome would actually show: a fifth station of "solitary Popperians," who can form and test hypotheses internally but are forbidden to communicate them, to isolate whether the Gregorian leap is about language or about accumulation; and one round in which the new generation of Gregorians must follow the inherited lore for a full round before they are allowed to test it, so they feel what it is like to be steered by an instrument they did not choose.

  Then the debrief, which is where I most need help: a mapping table from specific moments in play to specific features of the hierarchy, plus the resistances I should surface rather than smooth over — "we were doing Popperian things the whole time even when the rules said we weren't," "the Gregorian win is just cheating," "isn't a Skinnerian with a good memory simply a Popperian," "why does the hierarchy have four rungs and not forty" — and an honest note on what will predictably go wrong: Popperians burning their probes immediately, Gregorians hoarding lore, a world easy enough that all four kinds converge, one confident student who games the constraints, and the deeper problem that participants cannot switch off their own language and culture, so the rules are only stand-ins for design constraints and the activity cannot reproduce what it is like to *lack* a Gregorian mind. Say plainly which part of the idea the game cannot deliver and the facilitator has to state in words afterwards. Please don't rely on any particular author's exact wording or on anyone's having done the reading — build it so it works from the ideas alone. Finish with a last line beginning "Summary:" that states, in one sentence, the single thing the session is supposed to make the students discover.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** 3rd-year undergrads (mixed Psych, CS, Phil), 24 students, 1 TA, 75 mins.
      *   **Context:** "Minds, Animals and Machines" course. Previous lecture on Dennett's four-fold hierarchy (Darwinian, Skinnerian, Popperian, Gregorian) failed/landed poorly (misunderstood as linear intelligence or tool use).
      *   **Goal:** Students need to *feel* the differences in *where selection happens* and *what dies* (genes, behaviors, hypotheses, memes/tools).
      *   **Constraints:**
          *   Room: Movable chairs, whiteboard, no screens.
          *   Budget: Essentially nothing.
          *   Facilitator Talk: < 5 mins intro. No labels until debrief.
          *   Mechanics: Distinct stations/roles with different *permitted operations*, not just difficulty.
          *   Specific Cohorts: Darwinian (fixed policy, death/re-seed), Skinnerian (revise after payoff), Popperian (scarce probe tokens), Gregorian (inherited lore, notation, noisy transmission).
          *   Specific Probes: "Solitary Popperians" (internal hypothesis, no communication) to isolate language vs. accumulation; "Blind Gregorians" (must follow lore before testing) to feel external steering.
          *   Rotation: Everyone plays at least two kinds.
          *   Hidden World: Grid with stable hazard + changing rule (so lore goes stale).
          *   Scoring: Points/candy, no grades.
          *   Timeline: Minute-by-minute for 75 mins.
          *   Debrief: Mapping table, surfacing resistances, honest limitations (what the game *can't* do).
          *   Final Line: "Summary: [One sentence discovery]."

  2.  **Deconstruct the Core Concept (Dennett's Hierarchy):**

      *   *Darwinian:* Selection on genotype. The individual doesn't learn; the lineage learns via death.
      *   *Skinnerian:* Selection on phenotype/behavior within lifetime. Trial and error. Reinforcement.
      *   *Popperian:* Selection on internal representations/hypotheses *before* acting. "Let your hypotheses die in your stead."
      *   *Gregorian:* Selection on cultural tools/memes. Mind is scaffolded by external artifacts (language, math) that have their own fitness history.

  3.  **Design the Game Mechanics:**

      *   *The Task:* Needs to be simple enough to explain quickly but complex enough to allow for strategy. A "Hazard Navigation" task works well.
      *   *The Board:* A 5x5 grid drawn on paper (or whiteboard).
      *   *The Hazard:* "Mines" or "Traps." Some are static, some move/change between rounds.
      *   *The Goal:* Get from Start to Finish in fewest moves/least cost.
      *   *Materials:* Paper grids, pens, tokens (candy/paper clips), blindfolds (optional, maybe too much), specific rule cards for each station.

      *   *Station Design:*
          *   **Darwinian (The Lineage):** Player writes a sequence of moves (e.g., R, R, D, L). Executes. If they hit a trap, they "die" (round over, 0 points). Next player (generation) gets the *exact* same sequence but with one random mutation (TA changes one move). They cannot change it themselves.
          *   **Skinnerian (The Learner):** Player moves one step at a time. If they hit a trap, they lose points but can try again immediately in the same round. They learn via direct feedback (pain/reward).
          *   **Popperian (The Thinker):** Player gets 3 "Probe Tokens." They can ask the TA "Is (2,3) safe?" without moving there. Once tokens are gone, they must move. If they hit a trap without probing, they die/lose big. They test hypotheses internally before committing.
          *   **Gregorian (The Culturist):** Player receives a "Lore Sheet" from the previous group (e.g., "Safe path is R-R-D"). They *must* use it (Blind Gregorian round) or can modify it. They can write new notes. Crucially: The Lore is copied by the *next* group, introducing noise (telephone game effect). The tools (notes) have their own survival rate.
          *   **Solitary Popperian (Probe 1):** Like Popperian but no talking to TA/peers. Pure internal simulation.
          *   **Blind Gregorian (Probe 2):** Must follow Lore for Round 1, then free in Round 2.

      *   *Refining the "Hidden World":*
          *   To make Gregorian meaningful, the environment must change *slightly* so old lore is dangerous.
          *   Static Trap: Always at (3,3).
          *   Dynamic Trap: Moves every 2 rounds.
          *   This punishes blind adherence to lore (Gregorian risk) and rewards probing (Popperian).

  4.  **Drafting the Timeline (75 mins):**

      *   0-5: Intro (Rules only, no labels).
      *   5-20: Round 1 (Groups assigned stations).
      *   20-25: Rotation & Lore Transfer.
      *   25-40: Round 2 (New stations, inherit lore).
      *   40-45: Rotation.
      *   45-60: Round 3 (Include the Special Probes here).
      *   60-75: Debrief.

      *Wait, 24 students.*
      *   6 Stations x 4 students = 24.
      *   Stations: Darwinian, Skinnerian, Popperian, Gregorian, Solitary Pop, Blind Greg.
      *   Actually, let's simplify to 4 main stations to ensure depth, then swap.
      *   Better: 4 Stations of 6 students each. Within the station, they take turns or collaborate under the constraint.
      *   Let's go with 4 Teams of 6.
      *   Round 1: Teams A, B, C, D assigned constraints.
      *   Round 2: Rotate constraints.
      *   Round 3: Special Probes integrated into specific teams.

      *Re-evaluating the "Death" mechanic:* Real death takes too long. "Death" = Round Over, reset to start, lose accumulated points.
      *   *Darwinian:* You don't get to change the plan. The *next person* gets the mutated plan.
      *   *Skinnerian:* You can retry immediately but pay a cost.
      *   *Popperian:* You get 3 "Ask" tokens.
      *   *Gregorian:* You get a note from the previous team. You write a note for the next team.

  5.  **Addressing the Specific Probes:**

      *   *Solitary Popperian:* Needs to be a sub-condition. Maybe Team C becomes Solitary Popperians in Round 3.
      *   *Blind Gregorian:* Team D must follow the note for the first run of Round 3.

  6.  **Developing the Debrief:**

      *   Need to map game moments to theory.
      *   Need to anticipate objections ("Cheating," "Memory," "Linear").
      *   Need to admit limitations (We are already Gregorian creatures playing at being less).

  7.  **Fleshing out the Details (Iterative refinement):**

      *   *Materials:* Printed grids, pens, candy (M&Ms), index cards for "Lore."
      *   *The "World":* A 5x5 grid. Start (1,1), End (5,5).
      *   *Hazards:*
          *   Red Zone (Static): (3,3).
          *   Blue Zone (Dynamic): Changes location every round (TA knows).
      *   *Scoring:* 10 points for finish. -5 for hitting Red. -5 for hitting Blue.
      *   *Darwinian:* Write path on card. TA checks. If hit trap, "Death" (0 pts). Next player takes card, TA mutates one step (changes one direction), they try.
      *   *Skinnerian:* Move token on grid. If hit trap, lose 5, return to start of round, try again.
      *   *Popperian:* 3 Tokens. Can trade 1 token to ask "Is (x,y) safe?" Then move.
      *   *Gregorian:* Given a card from previous team. Can write new card. Next team gets *their* card (copied by TA with potential error/noise).
      *   *Rotation:* 3 Rounds. 20 mins each (including setup/swap).
      *   *Wait, 75 mins is tight.* 3 rounds of 20 mins = 60 + 5 intro + 15 debrief = 80. Need to tighten rounds to 15 mins.
      *   5 Intro + 15 Round 1 + 5 Swap + 15 Round 2 + 5 Swap + 15 Round 3 + 15 Debrief = 75. Perfect.

      *Correction on Probes:* The prompt asks for specific probes *built in*.
      *   Probe 1 (Solitary Pop): Make this Round 2 for one team.
      *   Probe 2 (Blind Greg): Make this Round 3 for one team.
      *   Actually, to ensure everyone feels the main 4, let's stick to the 4 main types for Rounds 1 & 2. Round 3 introduces the variants for half the class, or we integrate them into the main types.
      *   *Decision:* Let's make Round 1 the 4 types. Round 2 the 4 types rotated. Round 3: Two teams do the Probes, two teams repeat their favorite/hardest.
      *   *Actually, simpler:* 4 Teams.
          *   Round 1: A=Darwin, B=Skinner, C=Popper, D=Gregorian.
          *   Round 2: Rotate (A=Skinner, B=Popper, C=Greg, D=Darwin).
          *   Round 3: A=Solitary Pop, B=Blind Greg, C=Darwin (Control), D=Skinner (Control).
      *   This ensures everyone hits at least two main types + one probe.

      *Refining the Gregorian "Noise":* The prompt says "noisy, time-pressured transcription."
      *   Mechanic: When Team D writes their Lore Card, they have 30 seconds. Then the TA copies it to the next team's card but *might* flip one instruction (R becomes L) deliberately to simulate cultural drift/error. Or, better, the *next* team has to transcribe it under time pressure, introducing the error themselves. Let's go with: The receiving team has 30 seconds to read and memorize, then the card is taken away. They must write it down from memory. This introduces the noise.

      *Refining the Darwinian "Mutation":* The player cannot change the plan. The *TA* changes one step between players. This emphasizes selection on the lineage, not the individual.

      *Refining the Popperian "Probe":* 3 Tokens. If they run out, they fly blind.

      *Refining the Skinnerian "Payoff":* They learn by hitting the wall.

  8.  **Drafting the Debrief Content:**

      *   *Mapping:*
          *   Darwinian Death = Genetic Death.
          *   Skinnerian Retry = Operant Conditioning.
          *   Popperian Tokens = Mental Simulation.
          *   Gregorian Card = Cultural Artifacts/Memes.
      *   *Resistances:*
          *   "Skinner with memory is Popper": Address the *cost* of testing. Skinner pays with body/score; Popper pays with token/cognitive load.
          *   "Gregorian is cheating": It's not cheating, it's offloading cognition. But the risk is stale lore.
          *   "Why 4 rungs?": It's not a ladder, it's a stack. We are all four.
      *   *Limitations:*
          *   We are already Gregorian. We can't truly simulate *lacking* language.
          *   The "Death" isn't real.
          *   The TA is the "Environment," which is intelligent, unlike nature.

  9.  **Review against Constraints:**

      *   < 5 min intro? Yes, keep rules on handout.
      *   No labels until debrief? Yes, use Team 1, 2, 3, 4.
      *   Budget nothing? Paper, pens, candy.
      *   24 students? 4 teams of 6.
      *   Specific Probes included? Yes.
      *   Final Sentence? Yes.

  10. **Final Polish:** Ensure the tone is practical for a TA. Clear instructions. Explicit "Hidden World" setup for the TA.

      *(Self-Correction during drafting)*: The prompt asks for "a rotation so that everyone plays at least two kinds."
      If I have 4 teams and 3 rounds, everyone plays 3 kinds.
      I need to make sure the "Solitary Popperian" and "Blind Gregorian" are experienced as distinct *feelings*.
      Let's assign:
      Round 1: Standard 4 types.
      Round 2: Rotate Standard 4 types.
      Round 3: Half class Solitary Pop, Half class Blind Greg. (This ensures the specific probes are felt deeply).
      Wait, if I do that, some people miss the standard Popper/Gregorian experience twice.
      Better:
      Round 1: Standard 4.
      Round 2: Rotate Standard 4.
      Round 3: Team A (Solitary Pop), Team B (Blind Greg), Team C (Darwin), Team D (Skinner).
      This way everyone does 2 Standard + 1 Variant/Repeat.
      Actually, to maximize the "Probe" impact, let's make Round 3 *only* the probes for everyone.
      Round 1: Darwin/Skinner/Pop/Greg.
      Round 2: Rotate.
      Round 3: Half Solitary Pop, Half Blind Greg.
      This satisfies "everyone plays at least two kinds" (they played 2 in R1/R2) and ensures the probes happen.

      *Wait, one more check on the Gregorian mechanic:* "Inherited objects... shaped by their own transmissibility."
      The Lore Card needs to be the object. The constraint is that the *next* team gets *your* card. If your card is confusing, they fail. If your card is robust, they succeed. But the environment changes, so a robust card might become a trap.
      I need to make sure the TA changes the "Dynamic Trap" location between Round 2 and 3 specifically to punish the Gregorians who rely on old lore.

      *Debrief Resistances:* The prompt lists specific ones to surface. I must include those.
      *Limitations:* Must explicitly state what the game fails to simulate (the inability to turn off our own Gregorian nature).

      *Final check on time:* 75 minutes is very tight for 3 rounds of gameplay + debrief.
      Intro: 5 min.
      Round 1: 15 min (10 play, 5 swap).
      Round 2: 15 min (10 play, 5 swap).
      Round 3: 15 min (10 play, 5 transition).
      Debrief: 25 min.
      Total: 75 min.
      This is aggressive. I will advise the TA to be strict on time.

      *Let's write it.*
answer: |-
  # Lesson Plan: The Selection Hierarchy Game

  **Course:** Minds, Animals and Machines
  **Time:** 75 Minutes
  **Students:** 24 (4 Teams of 6)
  **Materials:** 
  *   4 Printed 5x5 Grids (laminated or in plastic sleeves if possible, otherwise fresh paper each round).
  *   4 Sets of "Constraint Cards" (one set per team type).
  *   Index cards (for Gregorian Lore).
  *   Pens/Markers.
  *   Candy (M&Ms or similar) for scoring.
  *   Whiteboard (for TA to track global scores).

  ## The Hidden World (TA Eyes Only)
  You are the Environment. You hold the master map.
  *   **Grid:** 5x5 Coordinates (A1 to E5). Start: A1. Goal: E5.
  *   **Hazard 1 (The Cliff):** Static at **C3**. Always deadly.
  *   **Hazard 2 (The Storm):** Dynamic. 
      *   Rounds 1 & 2: Located at **D4**.
      *   Round 3: Moves to **B2**. (This is crucial: it makes inherited lore dangerous).
  *   **Costs:** 
      *   Reach Goal: +5 Candy.
      *   Hit Cliff/Storm: -2 Candy (and reset to Start for that turn).
      *   Hit "Death" Rule (Darwinian): Round ends immediately, 0 Candy.

  ## Part 1: Introduction (0:00–0:05)
  **TA Script:** "We are running a navigation simulation. You are Teams 1, 2, 3, and 4. Your goal is to move a token from A1 to E5 on the grid. You will play three rounds. In each round, your team operates under a specific set of constraints printed on your card. You cannot break these constraints. If you do, you are disqualified for that round. Points are candy. At the end of every round, you will pass your materials to the next team. Do not discuss strategy between teams. Go."

  **Hand out:** 
  *   Team 1: Constraint Card A (Darwinian)
  *   Team 2: Constraint Card B (Skinnerian)
  *   Team 3: Constraint Card C (Popperian)
  *   Team 4: Constraint Card D (Gregorian)

  ## Part 2: Gameplay Rounds (0:05–0:50)

  ### Round 1: The Baseline (15 Minutes)
  *   **Team 1 (Darwinian):** 
      *   *Rule:* One "Lineage Scribe" writes a full 8-step path (e.g., R-R-D-L...) on paper *before* moving. 
      *   *Execution:* A "Runner" executes the path blindly. 
      *   *Constraint:* If the Runner hits a Hazard, they "Die." The round ends for the team. No changes allowed. 
      *   *Next Player:* The next student takes the *same* paper. The TA secretly mutates **one** step (changes one letter) before they begin. The student cannot alter the plan.
  *   **Team 2 (Skinnerian):** 
      *   *Rule:* Move one step at a time. 
      *   *Constraint:* You only learn a square is dangerous by stepping on it. If you hit a Hazard, pay the penalty, return to Start, and try again. You may remember past hits, but you must physically test the world to confirm safety.
  *   **Team 3 (Popperian):** 
      *   *Rule:* You receive 3 "Probe Tokens." 
      *   *Constraint:* Before moving to a square, you may spend a Token to ask the TA: "Is [Coordinate] safe?" The TA answers Yes/No. Once tokens are gone, you must move blindly. If you hit a Hazard without probing, you "Die" (Round ends).
  *   **Team 4 (Gregorian):** 
      *   *Rule:* You receive an Index Card ("Lore") from the previous generation (for Round 1, it is blank/empty). 
      *   *Constraint:* You may write new Lore on the card for the next team. You may follow the Lore or ignore it. 
      *   *Transmission:* At the end of the round, the TA copies your Lore onto a new card for the next team, but introduces **one transcription error** (e.g., changes "Right" to "Left") to simulate noise.

  *(10 mins play, 5 mins rotate materials and Constraint Cards clockwise: T1→T2, T2→T3, T3→T4, T4→T1)*

  ### Round 2: The Rotation (15 Minutes)
  *   Teams now operate under a *new* constraint set. 
  *   **Crucial Setup:** The Gregorian team (whoever holds Card D) now receives the Lore Card written by Team 4 in Round 1. They must deal with the transcription error introduced by the TA.
  *   **Play:** 10 mins.
  *   **Rotate:** 5 mins. (Clockwise again).

  ### Round 3: The Probes (15 Minutes)
  *   **Split the Class:** 
      *   **Teams 1 & 2 (Solitary Popperians):** You have 3 Probe Tokens. **New Rule:** You cannot speak to each other or the TA. You must write your hypothesis on paper, fold it, and place it in the center. Only then can you move. If you hit a hazard, you die. This isolates internal simulation from social checking.
      *   **Teams 3 & 4 (Blind Gregorians):** You receive the Lore Card from Round 2. **New Rule:** You *must* follow the Lore exactly for your first attempt. Only if you hit a Hazard are you allowed to discard the Lore and use your own judgment. This forces reliance on external scaffolding even when it might be wrong.
  *   **Environment Change:** Remind yourself (TA) that the Dynamic Hazard moved to **B2** this round. Old Lore suggesting "B2 is safe" is now lethal.
  *   **Play:** 10 mins.
  *   **Stop:** 5 mins to collect candy and reset chairs.

  ## Part 3: The Debrief (0:50–1:15)

  **Step 1: The Reveal (5 mins)**
  Write the four labels on the board: **Darwinian, Skinnerian, Popperian, Gregorian.**
  Ask teams to match their Constraint Cards to the labels. (It should be obvious).
  Ask: "Which team scored the most candy? Which team felt the most frustration?"

  **Step 2: Mapping Table (10 mins)**
  Draw this on the whiteboard and fill it in with student input.

  | Game Moment | Theoretical Feature | What "Dies"? |
  | :--- | :--- | :--- |
  | **Darwinian:** TA mutates the plan; player cannot change it. | Selection on Genotype. Individual is a vehicle. | The Lineage (if the plan fails, that *copy* ends). |
  | **Skinnerian:** Hitting the hazard to learn it's bad. | Selection on Phenotype/Behavior. Reinforcement. | The Behavior (you stop doing that move). |
  | **Popperian:** Spending a token to ask "Is it safe?" | Selection on Internal Representation. | The Hypothesis (dies in the head, not the body). |
  | **Gregorian:** Following the Lore Card (even when wrong). | Selection on Cultural Artifacts/Memes. | The Tool (bad lore gets discarded by next gen). |

  **Step 3: Surfacing Resistances (5 mins)**
  Prompt these specific objections. Do not solve them immediately; let the class wrestle.
  1.  **"The Skinnerian with a good memory is just a Popperian."**
      *   *Response:* Look at the cost. Skinner pays with *body* (points/reset). Popper pays with *tokens* (cognitive budget). One learns by pain, one learns by simulation.
  2.  **"The Gregorian win is just cheating."**
      *   *Response:* It feels like cheating because it bypasses individual work. That is the point of culture. But notice Round 3: when the world changed, the Lore became a trap. Tools have their own fitness, separate from your survival.
  3.  **"Why four rungs? Why not forty?"**
      *   *Response:* It's not a ladder of "smarter." It's a stack of "where selection happens." We are not *more* than Darwinian creatures; we *contain* Darwinian processes (immune systems, etc.) layered with Gregorian ones.

  **Step 4: Honest Limitations (5 mins)**
  Tell them plainly what the game failed to do.
  *   **The "Off" Switch:** "You cannot actually turn off your Gregorian mind. Even the Darwinian team talked to each other. You are all language-users pretending not to be. The game simulates the *rules*, but it cannot simulate the *absence* of capacity."
  *   **The Intelligent Environment:** "I (the TA) am not Nature. I answered your probes. Real environments don't answer questions; they just are. This made Popperianism too easy."
  *   **The Stakes:** "Death in the game is losing candy. Real selection is termination of existence. The urgency was low."

  **Summary:** The session is supposed to make the students discover that intelligence is not just a measure of processing power, but a structural difference in where and how errors are corrected before they become fatal.

  ---

  ## TA Cheat Sheet: Managing Predictable Failures

  *   **Popperians burning probes:** They will ask "Is A2 safe? Is B2 safe?" on safe squares. 
      *   *Debrief Point:* This shows the cost of thinking. If you waste your budget on trivialities, you die on the hard problems.
  *   **Gregorians hoarding lore:** They might write "GO RIGHT" instead of specific coordinates. 
      *   *Debrief Point:* This is actually *good* Gregorian design (abstract rules transmit better). Praise this if it happens.
  *   **The "Gamer" Student:** One student will try to deduce the TA's hazard pattern and share it across teams.
      *   *Intervention:* Remind them: "The constraint is on *your team's operation*, not the global truth. If you share info, you break the isolation of the cognitive architecture."
  *   **Convergence:** If the grid is too easy, all teams win.
      *   *Fix:* If Round 1 is too smooth, announce in Round 2: "The Storm has moved." (Even if you haven't moved it yet, the *threat* creates anxiety).
  *   **The Deep Problem:** Students will say, "But I used language in the Darwinian round."
      *   *Response:* "Exactly. You are Gregorian creatures running a Darwinian script. The friction you felt is the point. You were fighting your own nature to follow the rule."

  Summary: The session is supposed to make the students discover that intelligence is not just a measure of processing power, but a structural difference in where and how errors are corrected before they become fatal.
