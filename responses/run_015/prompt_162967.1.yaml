answer: |-
  **Exam Question**

  Kant is standardly interpreted as claiming we have only indirect duties regarding animals. Distinguish between a duty that is **indirect in content** (the animal is not the object of the duty) and **indirect in ground** (the duty's bindingness derives from a duty to humans). Using the cases of the **Hermit** (isolated torturer), the **Offsetter** (cruel to animals, kind to humans, no psychological spillover), and the **Rational Non-Human** (autonomous non-human agent), evaluate whether a Kantian can coherently hold that duties regarding animals are indirect in content but *direct* in ground.

  Compare three routes: (1) the empirical spillover view, (2) the character/expressive view (cruelty corrupts the agent's moral feeling), and (3) the direct-duty view (animals are ends-in-themselves). Defend one route as the most philosophically viable interpretation of Kant. Explain what theoretical cost this choice incurs, and demonstrate how your chosen route justifies the asymmetry between killing animals for use and torturing them for amusement.

  ***

  **Model Answer**

  To evaluate Kant's position, we must first distinguish the modes of indirectness. A duty is indirect in content if the animal is not the moral patient toward whom the obligation is owed; it is indirect in ground if the obligation's binding force derives solely from a duty to another entity, such as humanity. The standard reading conflates these, claiming duties regarding animals are indirect in both senses because cruelty harms humans via psychological spillover. This empirical claim fails.

  The empirical spillover route cannot survive the **Hermit** and **Offsetter** cases. The Hermit, permanently isolated, tortures animals without affecting any human. If duties regarding animals were indirect in ground (dependent on duties to humans), the Hermit violates no duty. This is intuitively abhorrent and morally unstable. Similarly, the Offsetter compensates for cruelty with beneficence and suffers no hardening. If the ground is purely empirical spillover, the Offsetter is morally permissible, perhaps even superior due to extra beneficence. A Kantian ethics cannot rest on contingent psychological facts; the wrongness of cruelty must be necessary. Therefore, the ground must be direct: the agent violates a categorical imperative binding on them regardless of consequences.

  However, accepting direct ground does not require accepting direct content. The **Direct-Duty route** argues animals are ends-in-themselves. This fails the **Rational Non-Human** test. If rational agency is the criterion for being an end, a rational non-human deserves direct duties. Kant denies this, tying 'humanity' to species or denying non-human rationality. If we grant direct content to animals, we break Kant's framework where autonomy grounds dignity. We should not sacrifice the humanity formulation to save animal ethics.

  The most viable route is the **Character/Expressive view**. Here, duties regarding animals are indirect in content (animals are not ends) but direct in ground (a duty to oneself to maintain moral sensibility). Cruelty is wrong not because it hurts the animal as a moral patient, nor because it risks hurting humans, but because the maxim of cruelty expresses a vice incompatible with moral perfection. This handles the Hermit: even in isolation, torturing animals corrupts the agent's own moral feeling, violating a duty to self. It handles the Offsetter: the maxim itself is corrupt, regardless of offsetting beneficence.

  This route incurs a theoretical cost: it places significant metaphysical weight on "moral feeling" and teleology. It requires us to accept that nature establishes a hierarchy where animals are means, yet our use of them is constrained by our own moral cultivation. It risks making animal ethics anthropocentric in a way that feels unsatisfying to modern sensibilities—we protect animals for *our* sake, not *theirs*.

  Finally, this route explains the **asymmetry** between killing and torture. Killing animals for food or use acknowledges their status as means within a teleological order; it does not necessarily express a vicious maxim if done without wanton destruction. Torture, however, is amusement derived from suffering. This maxim cannot be willed as universal because it cultivates a disposition to disregard suffering, damaging the agent's capacity for sympathy which supports moral duty. Thus, the Character route preserves Kant's core commitments while avoiding the empirical fragility of the spillover view. It accepts that animals are not ends, but insists that treating them as mere things is incompatible with being a moral end oneself.

  ***

  **Marking Scheme (25 Marks)**

  1.  **Distinction Deployment (5 marks):** Clearly defines and applies the difference between indirect content (object of duty) and indirect ground (source of bindingness).
      *   *Typical Botch:* Students treat the two as synonymous or fail to use the distinction to structure the argument.
  2.  **Case Application (Hermit/Offsetter) (5 marks):** Uses the Hermit and Offsetter to decisively refute the empirical spillover route.
      *   *Typical Botch:* Students mention the cases but fail to explain why they falsify the empirical grounding specifically.
  3.  **Argumentative Commitment (5 marks):** Defends one specific route (Spillover, Character, or Direct) rather than surveying all three neutrally.
      *   *Typical Botch:* Students write a "balance sheet" essay that lists pros/cons without concluding which route a Kantian *should* take.
  4.  **Asymmetry Justification (5 marks):** Explains how the chosen route permits killing/eating but forbids torture without contradiction.
      *   *Typical Botch:* Students assert the asymmetry exists but fail to derive it from the principles of their chosen route.
  5.  **Theoretical Cost (5 marks):** Identifies a genuine philosophical downside or tension inherent in the defended position (e.g., anthropocentrism, teleology).
      *   *Typical Botch:* Students claim their chosen view has no downsides or list a generic cost not specific to their argument.

  ***

  **Commentary**

  **A vs. B Distinction:** An A answer treats the distinction between content and ground as a tool to reconstruct Kant's theory, using the cases to stress-test the logic until only one route remains viable. It owns the theoretical cost. A B answer typically defines the distinction correctly but then reverts to summarizing the three routes without forcing a choice, or chooses a route but fails to show how it handles the asymmetry or the Hermit case rigorously. The A answer argues; the B answer reports.

  **Contested Reading Note:** The model answer commits to the view that duties regarding animals are **direct in ground** (based on duties to oneself/self-perfection) rather than indirect in ground (based on duties to other humans). This rejects the standard "propaedeutic" reading where animal cruelty is only wrong because it predicts human cruelty, aligning more with contemporary reconstructive Kantianism (e.g., Korsgaard) than strict textualism.
