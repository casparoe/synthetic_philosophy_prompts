answer: |-
  1. **Constitution vs. Causation**
  You claim broadcast *constitutes* phenomenality, not just causes it. So what does the ignition add to the feed-forward sweep in terms of *what-it's-like-ness*, strictly distinct from function?
  **Follow-up:** If the answer is "nothing extra," aren't you eliminating the phenomenal concept rather than reducing it?

  2. **The Overflow Argument**
  Partial-report evidence suggests phenomenal richness outruns access. You call the surplus a pre-conscious buffer. What is the principled difference between a buffer you can't access and an experience you can't access?
  **Follow-up:** If the difference is purely dispositional, aren't you defining phenomenality out of existence by fiat?

  3. **Posterior vs. Frontoparietal**
  If content-specific sensory activity persists while the frontoparietal signature is gone, is that state conscious on your account?
  **Follow-up:** If you say no, doesn't removing report and self-monitoring leave you with a theory of attention, not consciousness?

  4. **No-Report Paradigms**
  If decades of neural signatures were calibrated on data contaminated by reporting, does that undermine the identity claim or just the localization?
  **Follow-up:** Don't say "future research"—what specific no-report result would force you to decouple broadcast from phenomenality today?

  5. **Internally Generated Broadcast**
  Consider dreams or imagery where ignition occurs without input, versus cases where ignition looks absent but people report experience on waking. Which mismatch damages your view more?
  **Follow-up:** Why is that direction privileged if the mechanism is supposed to be necessary and sufficient?

  6. **The Zombie-Workspace**
  If we built a silicon system with a real global architecture—competition, capacity limits, self-monitoring—would the theory count it as phenomenally conscious?
  **Follow-up:** If you say it needs biological substrate, what happened to the functional claim that made the theory compelling?

  7. **Blind Broadcast (The Misreporting Branch)**
  Imagine a "blind broadcast" case: stimulus triggers ignition, global response, synchrony, report, inference, memory—but the subject insists there was *nothing it was like*. If you say they're misreporting, what validates your third-person access over their first-person authority?
  **Follow-up:** If introspection is fallible here, what method actually tracks phenomenality without begging the question?

  8. **Blind Broadcast (The Not-Conscious Branch)**
  Same case, but suppose you agree it isn't conscious. Does anything recognizably Global-Workspace-ish remain if ignition isn't sufficient for phenomenality?
  **Follow-up:** If broadcast is only for access, haven't you just conceded the distinctness you set out to deny?

  9. **Clean Falsification**
  Name one specific finding you would treat as refuting the identity of broadcast and phenomenality.
  **Follow-up:** If that finding emerged, would you actually abandon the view, or reinterpret the finding to save the theory?
