answer: |-
  This is a superb pedagogical opportunity. The Rankean tag is perhaps the most overworked and under-analyzed shibboleth in the discipline. Your suspicion is well-founded: the slogan functions as a equivocation between ontological claims (what exists), semantic claims (what is true), and methodological ideals (what we can know).

  Below is a disambiguation menu designed for your seminar. It breaks the slogan down into six distinct theses, ranging from the trivial to the incoherent, followed by an analysis of how they apply to your colloquium scenario and the constructivist critique.

  ### The Menu of Theses

  **1. The Ontological Realist Thesis (The "Past Existence" Claim)**
  *   **Assertion:** There was a determinate past reality independent of our current descriptions of it. Events occurred in a specific way regardless of whether they were recorded or remembered.
  *   **Verdict:** **Platitude.** To deny this is to embrace a radical skepticism or idealism that makes historical inquiry unintelligible. Even constructivists generally accept that *something* happened.
  *   **Role in Argument:** Establishes that there is a truth-maker for historical statements.

  **2. The Logical Exclusivity Thesis (The "Non-Contradiction" Claim)**
  *   **Assertion:** For any specific proposition about the past (e.g., "The grain shipment arrived on June 1st"), it is either true or false. Two contradictory accounts cannot both be true in the same respect at the same time.
  *   **Verdict:** **Substantive and Defensible.** This is basic logic. However, it only applies if the accounts are genuinely contradictory propositions about the same specific facts.
  *   **Role in Argument:** This is the only reading that logically forces a choice between the student's two accounts *if* they make incompatible claims.

  **3. The Completeness Thesis (The "Maximal Resolution" Claim)**
  *   **Assertion:** There exists a single, complete description of the past that includes every detail at the finest possible grain ("the whole truth").
  *   **Verdict:** **False/Unstatable.** As you noted, there is no canonical inventory of events. Any description requires selection, and selection implies a standpoint. A "complete" chronicle is a logical impossibility because events can be described at infinite levels of granularity.
  *   **Role in Argument:** Often implicitly invoked to suggest that one account is "more real" because it is more detailed, or that conflicting accounts must be merged into one master narrative.

  **4. The Standpoint Independence Thesis (The "View from Nowhere" Claim)**
  *   **Assertion:** It is possible to produce an account of the past that is free from the historian's conceptual schemes, values, narrative structures, or present-day interests.
  *   **Verdict:** **False.** All inquiry is driven by questions, and questions arise from a standpoint. Data (prices) and testimony (diaries) are both theory-laden and source-laden.
  *   **Role in Argument:** Used to privilege one methodology (e.g., quantitative archives) as "objective" while marking another (e.g., oral testimony) as "subjective."

  **5. The Essentialist Thesis (The *Eigentlich* as "Essence" Claim)**
  *   **Assertion:** There is a core "real" nature to the event (its *eigentlich* being) that may differ from its appearances or how it was experienced by participants.
  *   **Verdict:** **Substantive but Controversial.** This privileges structural causes (e.g., market forces revealed in grain prices) over phenomenological experience (e.g., hunger revealed in diaries). It risks metaphysical excess by positing a "real" history hidden behind the "apparent" history.
  *   **Role in Argument:** Allows the historian to override participant testimony in favor of structural reconstruction.

  **6. The Regulative Ideal Thesis (The "Convergence" Claim)**
  *   **Assertion:** While we cannot achieve the "real" story now, it serves as a necessary Kantian regulative ideal that guides inquiry and ensures that different methods converge over time.
  *   **Verdict:** **Substantive and Defensible (as an ideal).** It saves the slogan from empirical falsification by making it a goal rather than an achievement. However, it does not guarantee convergence; methods may diverge indefinitely.
  *   **Role in Argument:** Used to defend the discipline's coherence without claiming current infallibility.

  ---

  ### Application to the Colloquium Scenario

  **Which reading entitles your colleague to treat the question as settled?**
  Only **Thesis 2 (Logical Exclusivity)** entitles the colleague to say "at most one can be how it actually was." However, this entitlement is conditional. It requires demonstrating that the grain shipment records and the household diaries make *contradictory truth-claims* about the *same specific facts*.

  If the archival account says "Grain prices rose 50%" and the diary account says "We felt starving," these are not contradictory. They are complementary descriptions at different levels of grain (macro-economic vs. phenomenological). The colleague's move was likely a slide from Thesis 2 (logic) to **Thesis 4 (Standpoint Independence)** or **Thesis 5 (Essentialism)**. They implicitly assumed that the archival record represents the "standpoint independent" truth, while the diaries represent "subjective appearance." That is a methodological prejudice, not a logical necessity.

  **Which readings could a Carr- or White-style constructivist accept?**
  *   **E.H. Carr:** Would accept **Thesis 1 (Ontological Realism)** and **Thesis 2 (Logical Exclusivity)** regarding brute facts (you cannot say the battle happened and didn't happen). He would firmly reject **Thesis 4 (Standpoint Independence)**, arguing that facts are like fish in the ocean, caught by the fisherman's tackle. He might accept **Thesis 6 (Regulative Ideal)** but would warn against mistaking the ideal for current practice.
  *   **Hayden White:** Would accept **Thesis 1** only reluctantly (preferring to bracket the "real" to focus on the text). He would reject **Thesis 2** at the level of *narrative*, arguing that emplotment (tragedy, comedy, satire) is a poetic choice, not a discovery of how it "really" was. He would categorically reject **Thesis 3 (Completeness)** and **Thesis 5 (Essentialism)**, viewing the claim to have found the "real story" as an ideological move to naturalize a specific narrative structure.

  **Which reading is actually doing the work in most arguments?**
  In departmental disputes, the slogan almost always functions as a conflation of **Thesis 1 (Platitude)** and **Thesis 4 (Standpoint Independence)**.
  The rhetorical power of the phrase comes from smuggling in the indisputable truth of Realism (yes, the past happened) to validate the highly disputable claim of Neutrality (and *my* account is the neutral one). It polices the boundary of the discipline by marking alternative methodologies (oral history, microhistory, memory studies) as "less objective" because they acknowledge their standpoint, whereas the "Rankean" pretends not to have one.

  ### Seminar Suggestion

  You might frame the seminar discussion around the **Granularity Problem** you identified.
  1.  **Low Resolution:** "There was a famine." (Both accounts agree; Objective).
  2.  **Mid Resolution:** "Prices spiked" vs. "People starved." (Both agree; Objective but distinct categories).
  3.  **High Resolution:** "The price was 4.5 shillings" vs. "My father died on Tuesday." (Both claim truth, but are they competing accounts of the *same* event?)
  4.  **Maximal Resolution:** "Every molecule's position." (Unstatable).

  The colleague's error was assuming that because the accounts differ, they are competing for the *same* slot in a single chronicle. Your student's insight is that they may be constructing different *objects* of inquiry (the economy of the famine vs. the experience of the famine). Both can be objective within their own domains without one being a distortion of the other. The Rankean tag shuts this down by presupposing a singular "History" rather than plural "histories."
