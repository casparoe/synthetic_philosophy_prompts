answer: |-
  **Mapping Occam to Solomonoff**

  | Razor Claim | Solomonoff/Kolmogorov Term | Mismatch |
  | :--- | :--- | :--- |
  | Prefer fewer entities/kinds given equal fit. | Prefer $h$ minimizing $K(h)$ given equal $K(d|h)$. | **Yes:** "Entities" $\neq$ bits. |
  | Parsimony tracks truth (evidence). | Universal prior $2^{-K(h)}$ dominates computable $\mu$ asymptotically. | **Yes:** Asymptotic $\neq$ finite evidence. |

  **Residue Report**

  (a) **Ontology vs. Description:** SI optimizes codelength, not ontology. A short program can simulate a vast universe; a long program can describe a simple one inefficiently. SI has no metric for "kinds," only representation cost relative to a reference machine. Ontological parsimony is unformalized; only descriptive compression exists. The formalism cannot distinguish between a simple world and a complex world described simply.

  (b) **Invariance Constant:** $K_U(x) \le K_{U'}(x) + c$. For finite data, $c$ (translation cost between reference machines) can exceed likelihood differences. The simplicity ordering is machine-dependent until data swamps $c$. It is not canonical for realistic $n$, undermining the claim that simplicity is objective evidence. The "constant" is not negligible in scientific practice.

  (c) **PRG + Seed:** A PRG plus random seed minimizes $K$, yet the seed lacks explanatory power (it is indexical noise). SI treats compression as explanation, but here compression hides randomness rather than revealing structure. Minimal codelength does not entail maximal understanding; compression and explanation come apart. The "simplest" program may offer no insight into mechanisms.

  (d) **Convergence Limits:** Convergence requires the true distribution be computable. It holds only in the limit ($n \to \infty$) with probability 1. It does not guarantee correctness for finite $n$ or non-computable realities, yet practitioners apply it to finite data assuming truth-tracking. The theorem supports consistency, not finite-sample reliability. It licenses asymptotic faith, not immediate inference.

  **Conclusion**

  The residue points to the Razor having done less work than its friends suppose. SI formalizes *predictive efficiency*, not *ontological truth*. Scientists invoke OR to claim simpler structures are *real*; SI only guarantees simpler codes *predict* well. The vocabulary is precise, but the identification is a category error. SI is a surrogate for *prediction*, not the metaphysical Razor scientists invoke. It justifies betting, not believing.

  The "truth-conducive" claim relies on an equivocation between minimizing description length and minimizing ontological commitment. SI validates the former; the latter remains metaphysical speculation. When you lean on SI to claim heavily parameterized models are "suspect" because they are untrue, you overreach. They are suspect because they are inefficient to encode, not because nature dislikes parameters. Solomonoff is a different thing wearing the same name: a theorem about compression masquerading as a theorem about reality. Your vocabulary is fluent, but the philosophical license it grants is invalid. The Razor cuts descriptions, not the world.
