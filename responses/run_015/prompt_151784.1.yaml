prompt: |-
  I work in machine learning and use minimum description length and Bayesian model selection daily, so the vocabulary I am fluent in is this one: hypothesis spaces, priors over hypotheses, codelength, K(h) and K(d|h), two-part codes, the universal prior that weights hypotheses by two to the minus their program length, and the convergence result for Solomonoff prediction. In my field it is routine to say that Solomonoff induction just *is* the formal version of Occam's razor, and then to lean on that identification to license a great deal: that parsimony is truth-conducive rather than merely convenient, that heavily parameterized models are suspect for that reason, that simplicity is evidence.

  I want that identification audited. Restate the philosophical razor as exactly as you can in my vocabulary. The claim I mean is that when two hypotheses accommodate the data equally well we should prefer the one positing fewer entities or kinds, and that this preference tracks truth rather than being a mere tie-breaker for tractability. Give the mapping as a small table: razor claim on the left, what it becomes in Solomonoff/Kolmogorov terms on the right, flagging anything that has no counterpart at all.

  Then the residue report, on four points I cannot settle myself. (a) Descriptive versus ontological parsimony, short code versus few entities, and whether the formalism has any room for the second. (b) The invariance result for the choice of reference machine, which holds only up to an additive constant: whether that constant can be large enough to swamp any finite data set, so that the simplicity ordering is less canonical than it is made to sound. (c) A case I keep returning to, where the shortest program for a sequence is a short pseudorandom generator plus a seed: maximal compression and minimal codelength, but nothing anyone would call fewer entities or a better explanation, which makes me suspect compression and explanation come apart inside the formalism itself. (d) Whether the convergence theorem, with its computability assumption and its guarantee only in the limit with probability one, actually supports the everyday inferential use made of it, or is being borrowed to support something it does not say.

  Close by telling me whether the residue points to a defect in my vocabulary or to the razor having done less work than its friends suppose, and whether Solomonoff is the right formal surrogate for the razor scientists actually invoke or a different thing wearing the same name. Please keep the entire answer under 650 words.
