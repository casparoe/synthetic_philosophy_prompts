answer: |-
  # Workshop Activity: The Visibility Ledger

  ## I. Setup and Materials

  **Participants:** 14 Graduate Students.
  **Duration:** 90 Minutes.
  **Room Configuration:** Single large table or desks arranged in a circle to ensure eye contact and easy passing of materials.

  **Materials Required:**
  1.  **Index Cards:** 100 blank cards (3x5 inch).
  2.  **Writing Implements:** 15 pens (black or blue).
  3.  **Whiteboard/Flipchart:** For recording aggregate scores.
  4.  **Timer:** Visible to all participants.
  5.  **Score Sheets:** 14 pre-printed sheets (one per student) with columns for "Round 1 Score" and "Round 2 Score."

  **Conceptual Framing:**
  Do not introduce the terms "American Dream," "Jantelagen," "Rivalrous," or "Non-Rivalrous" prior to the debrief. Inform participants only that this is a simulation of resource allocation under different visibility constraints.

  ---

  ## II. Game Rules and Scoring

  ### Round 1: The Multiplier (Non-Rivalrous Conditions)
  **Objective:** Maximize your individual point total.
  **Time:** 20 Minutes.

  1.  **Claim:** Each player writes a "Claim of Competence" on an index card (e.g., "I solved the puzzle," "I generated three ideas"). They assign themselves a base value between 1 and 10 points.
  2.  **Visibility:** All cards are placed face-up in the center of the table. All claims and values are public knowledge.
  3.  **Endorsement:** Players circulate. They may write their initials on any *other* player's card to "Endorse" it.
      *   **Cost:** Endorsing costs the endorser 0 points.
      *   **Benefit:** Each endorsement adds 2 points to the *target's* score AND 1 point to the *endorser's* score.
      *   **Cap:** A card may receive unlimited endorsements.
  4.  **Group Bonus:** If the total sum of all points in the room exceeds 150 points, every player receives a flat bonus of 10 points.
  5.  **Calculation:** Players collect their own cards, tally base value + received endorsements + given endorsements + group bonus.

  **Theoretical Mechanism:** Status is non-rivalrous. Publicizing another's success generates new value for the system and the self. Visibility is an asset.

  ### Round 2: The Quota (Rivalrous Conditions)
  **Objective:** Maximize your individual point total.
  **Time:** 20 Minutes.

  1.  **Claim:** Each player writes a new "Claim of Competence" on a fresh card. They assign themselves a base value between 1 and 10 points.
  2.  **Visibility:** All cards are placed face-up in the center. All claims are public.
  3.  **The Cap:** The total points available to the *entire group* are fixed at 100 points.
  4.  **Audit:** Players circulate. They may write their initials on any *other* player's card to "Audit" it.
      *   **Cost:** Auditing costs the auditor 1 point.
      *   **Effect:** If a card is Audited, its base value is reduced by 5 points (minimum 0).
      *   **Redistribution:** The points removed from the Audited player are returned to a "Community Pool."
  5.  **Distribution:** After all audits, sum the total claimed points.
      *   If Total Claims ≤ 100: Everyone keeps their (reduced) score. The Community Pool is distributed equally among all players who performed at least one Audit.
      *   If Total Claims > 100: All scores are scaled down proportionally to fit the 100-point cap. The Community Pool is still distributed to Auditors.
  6.  **Calculation:** Players tally their (potentially reduced) base value + share of Community Pool - Audit costs.

  **Theoretical Mechanism:** Status is rivalrous. One player's high claim threatens the viability of others' claims. Visibility creates vulnerability. Suppression (Auditing) is individually rational to protect the share of the fixed pie.

  ---

  ## III. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Introduction** | Welcome participants. Distribute materials. Explain that this is a decision-making exercise regarding point accumulation. Emphasize that rules will change halfway through. Do not reveal the underlying theory. |
  | **00:10 – 00:15** | **Round 1 Briefing** | Read Round 1 rules aloud. Post the formula on the whiteboard: *Score = Base + (2 × Received) + (1 × Given) + Bonus*. Answer clarification questions. |
  | **00:15 – 00:35** | **Round 1 Play** | Participants write claims, circulate, and endorse. Facilitator monitors time. Call "Time" at 20 minutes. |
  | **00:35 – 00:40** | **Round 1 Scoring** | Participants calculate scores. Facilitator records the Group Total on the board to verify the Bonus condition. |
  | **00:40 – 00:45** | **Round 2 Briefing** | Read Round 2 rules aloud. Post the formula: *Total Cap = 100*. Highlight the penalty for exceeding the cap and the benefit of Auditing. Answer clarification questions. |
  | **00:45 – 01:05** | **Round 2 Play** | Participants write claims, circulate, and audit. Tension will likely rise. Facilitator ensures rules are followed but does not intervene in strategy. |
  | **01:05 – 01:10** | **Round 2 Scoring** | Participants calculate scores. Facilitator verifies the Total Cap and distributes the Community Pool. |
  | **01:10 – 01:40** | **Debrief** | Structured discussion mapping game mechanics to social theory (see Section IV). |
  | **01:40 – 01:45** | **Closing** | Final remarks and dismissal. |

  ---

  ## IV. Debrief Guide

  The debrief is the critical pedagogical moment. Do not lecture; draw the theory out of their experience, then supply the terminology.

  **1. Phenomenological Check (5 Minutes)**
  *   Ask: "How did your emotional relationship to the other players change between Round 1 and Round 2?"
  *   Ask: "In Round 1, did you feel compelled to hide your score? In Round 2, did you feel compelled to lower someone else's?"
  *   *Goal:* Establish that the *same group* behaved differently solely due to structural incentives.

  **2. Mapping the Mechanism (10 Minutes)**
  *   **Rivalrous vs. Non-Rivalrous:** Explain that in Round 1, status was **non-rivalrous**. My praising you did not diminish me; it created new points. This mirrors the **American Dream** framing, where individual success is viewed as a rising tide that lifts all boats (network effects, prestige of the institution).
  *   **The Shift:** Explain that in Round 2, status was **rivalrous**. The "Cap" made the good finite. If you took more, I got less. This mirrors **Jantelagen** or **Tall Poppy Syndrome**, where social cohesion is maintained by ensuring no individual consumes a disproportionate share of social capital.
  *   **Visibility:** Highlight that visibility was constant (cards were face-up), but its *value* flipped. In Round 1, visibility invited investment. In Round 2, visibility invited extraction.

  **3. Norm Internalization (10 Minutes)**
  *   Ask: "Did anyone feel guilty Auditing a peer in Round 2? Did anyone feel guilty *not* Endorsing in Round 1?"
  *   Discuss how quickly instrumental rationality (getting points) masquerades as moral behavior. In Round 1, being "nice" was profitable. In Round 2, being "critical" was profitable.
  *   Connect this to the graduate student experience: When does your field reward citation and amplification (Round 1)? When does it reward critique and gatekeeping (Round 2)?

  ---

  ## V. Limitations and Facilitator Notes

  ### The Unsimulatable Feature
  You must verbally supply the **historical and moral weight** of these norms. The game simulates the *incentive structure*, but it cannot simulate the *socialization*.
  *   **Admission to Group:** "This game models the economic logic of status, but it cannot model the lifelong conditioning that makes Jantelagen feel like 'humility' rather than 'suppression,' or the American Dream feel like 'ambition' rather than 'greed.' In the real world, these rules are internalized before we enter the room. Here, you calculated them. In reality, you feel them."

  ### Predictable Failure and Fix
  **Forecast:** In Round 2, graduate students in cooperative fields (like philosophy or social sciences) may collude to under-claim points (e.g., everyone claims 5 points) to avoid the "Audit" phase entirely, thereby bypassing the rivalry mechanic. This creates a "false peace" that undermines the lesson.

  **The Fix:** Introduce a **Ranking Reward** at the start of Round 2.
  *   **Instruction:** "The top three individual scorers in Round 2 will receive a 'Distinguished Scholar' title (or a tangible perk, like choosing the reading for the next session)."
  *   **Effect:** This breaks the collusion. Even if the group stays under the cap, players now have an incentive to outscore their peers. This forces the rivalry back into the system, making the suppression mechanic (Auditing) rational again. If you notice collusion forming during the briefing, announce this tie-breaker immediately.

  ### Facilitator Tone
  Maintain neutrality. Do not judge the students for being "cutthroat" in Round 2 or "cliquey" in Round 1. Their behavior is the data. Your role is to hold up the mirror and show them that the structure dictated the morality.
