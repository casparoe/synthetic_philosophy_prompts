  2.  **Deconstruct the Summary Paragraph:**
      *   *Claim 1 (Williams):* Reasons must hook onto existing motivational sets (Internalism).
      *   *Claim 2 (Williams):* Moral arguments alone can't give reasons to the unconverted; they need pre-existing shame/pride.
      *   *Claim 3 (Appiah):* Dueling/Slavery ended not because of argument or profit, but because they became dishonorable (shift in elite opinion).
      *   *Claim 4 (Appiah/Williams synthesis):* Honor = concern for standing/status.
      *   *Claim 5 (Conclusion):* Moral revolutions = changes in what the powerful find prestigious/embarrassing. Honor = status competition.
      *   *Claim 6 (Conclusion):* Abolitionist reasoning didn't convince; it rode along on economic/social advantage (causally inert/window dressing).

  3.  **Evaluate Claim 1 & 2 (Williams on Internal Reasons):**
      *   *Source:* "Internal and External Reasons" (1979/1980).
      *   *Analysis:* This is the core of Williams's internalism. $A$ has a reason to $\phi$ only if $A$ could reach the conclusion to $\phi$ via a sound deliberative route from their existing subjective motivational set ($S$).
      *   *Nuance:* Williams allows $S$ to be broad (not just selfish desires, but dispositions, commitments, etc.). He also allows deliberation to *modify* $S$, but it must start *from* $S$.
      *   *Verdict:* Mostly accurate, but the summary simplifies the "sound deliberative route" aspect. It implies static $S$, whereas Williams allows $S$ to evolve through reasoning, provided the starting point is internal.
      *   *Confidence:* High. This is standard metaethics.

  4.  **Evaluate Claim 3 (Appiah on Honor/Slavery/Dueling):**
      *   *Source:* *The Honor Code: How Moral Revolutions Happen* (2010).
      *   *Analysis:* Appiah argues that moral change often happens through changes in honor codes, not just utilitarian calculation or abstract moral reasoning. He focuses on the *social* dimension of ethics.
      *   *Nuance:* Appiah does argue that arguments need to latch onto honor to be effective. However, he doesn't necessarily say arguments are *inert*. They help reshape the honor code.
      *   *Verdict:* Fair summary of Appiah's empirical/historical claim, but needs nuance on the role of argument.
      *   *Confidence:* High.

  5.  **Evaluate Claim 4 & 5 (Honor = Status Competition / Powerful Elites):**
      *   *Analysis:* This is where the summary gets reductive. Appiah distinguishes honor from mere status or reputation. Honor involves an *internalized* code and a relationship to identity, not just "what others think."
      *   *Williams:* Williams is skeptical of "morality" (the peculiar institution) but values ethics. He wouldn't necessarily reduce honor to mere status competition in a cynical sense.
      *   *Verdict:* This is the "wince" zone. It flattens Appiah's nuanced sociological account into a cynical elite theory.
      *   *Confidence:* Medium-High. Appiah explicitly argues against reducing honor to mere reputation.

  6.  **Evaluate Claim 6 (Arguments are Window Dressing / Causally Inert):**
      *   *Analysis:* This is a non-sequitur or a strong overreach. Even if reasons must be internal (Williams) and honor drives change (Appiah), moral *arguments* are the tools that reshape the internal motivational set and the honor code. They aren't inert; they are the mechanism of the shift.
      *   *Economic Advantage:* The summary claims it rode along on economic advantage. Appiah explicitly argues *against* the idea that slavery ended because it became unprofitable. He argues it ended *despite* profitability because it became dishonorable.
      *   *Verdict:* Wrong. Contradicts Appiah's explicit arguments about slavery.
      *   *Confidence:* High.

  7.  **Address the "Williams Thesis" Setup:**
      *   *Issue:* Is there *one* Williams thesis? Williams wrote a lot. The summary refers to "Internal and External Reasons."
      *   *Pushback:* Need to clarify that Williams's internalism is a metaethical claim about the *structure* of reasons, not necessarily a sociological claim about how moral revolutions happen. Applying it directly to Appiah's historical sociology requires bridging metaethics and social theory.
      *   *Confidence:* High.

  8.  **Drafting the Response (Iterative Process):**
      *   *Introduction:* Acknowledge the user's suspicion. Validate that the ending is indeed problematic.
      *   *Section 1: The Williams Internalism Claim.* Break down "Internal Reasons." Confirm the core idea but correct the static view of the motivational set. (Confidence: High).
      *   *Section 2: The Appiah Application.* Discuss *The Honor Code*. Confirm the role of honor, but challenge the "status competition" reduction. (Confidence: High).
      *   *Section 3: The Causal Inertness Conclusion.* This is the big error. Explain why arguments matter in reshaping $S$ and honor codes. Address the economic claim (Appiah denies slavery became unprofitable). (Confidence: High).
      *   *Section 4: Structural Pushback.* Address the "Williams Thesis" framing. It's a category error to move straight from metaethics to historical sociology without intermediate steps.
      *   *Conclusion:* Summary for the seminar.

  9.  **Refining the Tone:**
      *   Ensure I'm not talking down to a PhD student. Use technical terms (subjective motivational set, sound deliberative route, internalism/externalism) but explain them clearly.
      *   Make sure the "Confidence" markers are clear as requested.
      *   Check the specific constraint: "push back if I've set this up badly." I need to explicitly state that linking Williams's metaethics directly to Appiah's historical sociology is a specific interpretive move, not necessarily something either author explicitly co-authored.

