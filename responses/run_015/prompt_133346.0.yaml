                  *   Standard Reflection DB assumes I know $P_{t'}=x$ with certainty at $t$.
                  *   If I am *certain* $P_{t'}=0.9$, then $P_t(H | P_{t'}=0.9) = P_t(H)$.
                  *   So I bet at 0.7.
                  *   At $t'$, I am 0.9. I bet against at 0.9.
                  *   Loss is guaranteed.
      *   **Reply:** "The bet at $t'$ is based on evidence I don't have at $t$. The book exploits the information asymmetry between my time-slices. It's not a synchronic incoherence."
      *   **Three Items:**
          *   Feature: **Phenomenal/New Evidence that is not conditionalizable ex ante.**
          *   Removal: If evidence is propositional (e.g., test result), Reflection holds.
          *   Reply: Restrict Reflection to **Synchronic Expert Deference** (no new evidence). Cost: Makes Reflection trivial or limited to very short time spans.

  4.  **Refining the Numbers and Logic:**
      *   Need to ensure $P_t(H | P_{t'}(H)=0.9) = 0.7$ is justified.
      *   Let $T$ be the event "Taste matches 2010".
      *   $P(H) = 0.5$.
      *   $P(T | H) = 1.0$ (True 2010 always tastes right).
      *   $P(T | \neg H) = 0.4$ (Fakes often taste right).
      *   $P(H | T) = (0.5 \times 1) / (0.5 \times 1 + 0.5 \times 0.4) = 0.5 / 0.7 = 5/7 \approx 0.71$.
      *   So $P_t(H | T) = 0.71$.
      *   At $t'$, if I taste $T$, do I just have $T$?
      *   If I just have $T$, my credence is 0.71.
      *   To get 0.9, I need *more* evidence at $t'$.
      *   Let $Q$ be "Qualitative certainty of the taste".
      *   $P(Q | T \& H) = 1.0$.
      *   $P(Q | T \& \neg H) = 0.1$ (Fakes rarely feel *quite* right).
      *   At $t'$, I have $T \& Q$.
      *   $P_{t'}(H) = P(H | T \& Q)$.
      *   Calculation:
          *   Num: $0.5 \times 1 \times 1 = 0.5$.
          *   Denom: $0.5 \times 1 \times 1 + 0.5 \times 0.4 \times 0.1 = 0.5 + 0.02 = 0.52$.
          *   Result: $0.5 / 0.52 \approx 0.96$. Let's round to 0.9 for simplicity in the prompt.
      *   At $t$, I know I will have $T \& Q$ if $P_{t'}=0.9$.
      *   So $P_t(H | P_{t'}=0.9) = P_t(H | T \& Q)$.
      *   Wait, if I know I will have $T \& Q$, I can conditionalize on it now!
      *   $P_t(H | T \& Q) = 0.96$.
      *   So Reflection *holds*.
      *   **CRITICAL FAILURE.**
      *   If I know *what* evidence I will get, I can conditionalize now.
      *   To violate Reflection, I must *not* be able to conditionalize on the specific evidence at $t$.
      *   This means I know I will be 0.9, but I don't know *which* evidence path led there.
      *   **Many Paths to 0.9.**
      *   Path 1: $T \& Q$ (Real). Likelihood of $H$ is high.
      *   Path 2: $T \& \text{Illusion}$ (Fake). Likelihood of $H$ is low.
      *   Both lead to $P_{t'}=0.9$ (because at $t'$, I can't distinguish Illusion from Q? No, if I can't distinguish, $P_{t'}$ averages them).
      *   If $P_{t'}$ averages them, then $P_{t'}$ is the same as $P_t$.
      *   For $P_{t'} > P_t$, $t'$ must have *discriminatory* evidence $t$ lacks.
      *   If $t$ knows $t'$ has it, $t$ can conditionalize on " $t'$ has discriminatory evidence".
      *   Unless... **The evidence is self-locating.** "I am now having *this* experience."
      *   At $t$, I cannot conditionalize on "I am now having *this* experience" because I'm not.
      *   I can only conditionalize on "I will have an experience".
      *   If "Having an experience" is less correlated with $H$ than "Having *this* experience".
      *   Yes!
      *   $H$: Coin is Heads.
      *   $t'$: I see the coin.
      *   If I see Heads, $P_{t'}=1$.
      *   At $t$, conditional on "I will see Heads", $P_t=1$.
      *   Reflection holds.
      *   I need the experience to be **fallible**.
      *   $H$: Wine is 2010.
      *   $t'$: I taste it.
      *   If it tastes like 2010, $P_{t'}=0.9$.
      *   At $t$, conditional on "It will taste like 2010", $P_t=0.7$.
      *   Why is $P_{t'}=0.9$?
      *   Because at $t'$, the taste *feels veridical*.
      *   At $t$, I know "Tasting like 2010" happens with Fakes too.
      *   But at $t'$, don't I know that too?
      *   Yes, unless the *feeling of veridicality* is extra evidence.
      *   If it is extra evidence, and I know at $t$ that I will have it...
      *   I'm going in circles. The "Rational Prior Change" is the only way out that doesn't collapse into "I can conditionalize now".
      *   I must assert that **I cannot conditionalize on the future evidence because I cannot describe it propositionally.**
      *   This is the **Ineffability** constraint.
      *   I will use this. It fits (e).

  5.  **Final Polish:**
      *   Make sure the Dutch Book analysis is sharp.
      *   Ensure the "Three Short Items" are punchy.
      *   Check constraints one last time.
      *   (a) Future self rational? Yes, uses all evidence.
      *   (b) No memory loss? Yes.
      *   (c) No misleading evidence? Yes.
      *   (d) No self-fulfilling? Yes.
      *   (e) Content shift? Acknowledge indexical/phenomenal nature.
      *   (f) Closest violation? (b) - appears to be evidence loss, but is actually evidence *inaccessibility*.

      *Wait, one more check on the Dutch Book.*
      *   If the agent knows the book is coming, can she avoid it?
      *   She accepts Bet 1 at $t$ because her conditional credence is 0.7.
      *   She accepts Bet 2 at $t'$ because her credence is 0.9.
      *   She loses.
      *   Reply: "Bet 2 is rational at $t'$ given evidence $E$. Bet 1 is rational at $t$ given lack of $E$. The loss is the cost of diachronic information update, not incoherence."

