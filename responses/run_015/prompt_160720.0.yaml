answer: |-
  **THE STRIKE TEST PROCEDURE**

  **1. The Target Test**
  *Question:* Who feels the cost? Who holds the keys to the solution?
  *Pass:* The employer feels the cost and can concede the demand.
  *Fail:* The employer feels the cost but cannot concede (e.g., government policy).
  *Rule:* If Fail, the action is expressive, not coercive. Expressive action requires an 80% 'Yes' vote to justify costs without direct gain. If the employer can concede, a simple majority suffices.
  *Stop:* If the target is unrelated to the demand and support is below 80%.

  **2. The Last Resort Test**
  *Question:* Have negotiation and grievance routes been exhausted?
  *Pass:* Bargaining team provides written log of attempts (minimum two formal stages).
  *Fail:* No log, or viable routes remain open.
  *Stop:* If Fail. No strike without proof of exhaustion.

  **3. The Spillover Rule**
  *Question:* Is the harm doing the work, or is it collateral damage?
  *Distinction:* **Leverage** hurts the decision-maker to force movement. **Spillover** hurts bystanders (commuters, patients) without pressing the decision-maker.
  *Pass:* Spillover exists but amplifies pressure on the Target (e.g., public anger forces Mayor to act).
  *Fail:* Spillover hurts bystanders but the Target is insulated or indifferent.
  *Stop:* If Fail. Harm without leverage is forbidden.
  *Note:* This is judgement wearing a hi-vis vest. There is no objective math here.

  **4. The Win Test**
  *Question:* Is there a reasonable chance of success?
  *Pass:* Organizer assesses victory or significant gain is likely.
  *Fail:* Action will burn energy and funds with no likely concession.
  *Stop:* If Fail. We do not strike for martyrdom.
  *Note:* This is judgement wearing a hi-vis vest.

  **5. The House Rule**
  *Question:* What do we owe our own and the public?
  *Members:* We owe dissenting members no retaliation, harassment, or loss of seniority for crossing picket lines on conscience or safety grounds.
  *Non-Members:* We owe those asked to respect picket lines full honesty on the goal. We must offer hardship mitigation (e.g., food bank referrals, transit passes) if available. We cannot demand they starve for our fight.
  *Stop:* If the Committee cannot guarantee these protections.

  **DECISION AUTHORITY**
  Steps 1–2: Committee verifies facts.
  Steps 3–4: **Membership Vote.** These are values, not facts.
  Step 5: Committee guarantees enforcement.
  Final Authorization: Membership Vote.

  ***

  **TEST CASES**

  **1. Rostering Stoppage**
  *Verdict: Authorize.*
  Passes Step 1 (Employer holds keys). Passes Step 2 (Grievances tried). Passes Step 3 (Commuter delay pressures City/Employer). Passes Step 4 (Win likely). House rules standard.

  **2. Sympathy Strike (Cleaners)**
  *Verdict: No.*
  Fails Step 1. Our employer cannot concede cleaners' demands. Action is expressive. Unless 80% of members vote Yes (high bar for costly solidarity), it fails. Step 3 also risky: huge spillover may not pressure the cleaners' employer.
  *To Pass:* Prove our employer can pressure theirs, or accept expressive status and secure 80% vote.

  **3. Government Policy Walkout**
  *Verdict: No.*
  Fails Step 1 & 2. Employer can't concede. No ballot held (fails democratic check). Purely expressive.
  *To Pass:* Treat as political protest with 80% support, clear public messaging, and full Spillover justification.

  ***

  **LIMITS & TRANSPARENCY**

  **What This Can't Do**
  This procedure cannot judge retroactive blessings (action already started). It cannot classify work-to-rule or go-slows (not formal stoppages). It cannot weigh actions aimed at recruitment or PR rather than concrete demands. If the real goal is membership drives, this test will flag Step 4 (Win Test) as Fail, because the demand on the table won't be won.

  **Hi-Vis Judgements**
  Steps 3 (Spillover) and 4 (Win Test) are votes in disguise. There is no objective formula for "too much harm" or "reasonable chance." The Committee should not decide these alone. The Membership must vote on the Spillover Rule and Win Test specifically, not just the final strike yes/no. This ensures the moral weight is carried by those taking the risk.

  **Who Decides**
  Committee runs the test. Membership votes on the Hi-Vis steps and Final Authorization. Affected depots should hold veto power if spillover falls disproportionately on their specific community (e.g., a depot serving a hospital).
