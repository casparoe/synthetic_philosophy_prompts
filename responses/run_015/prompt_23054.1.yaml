answer: |-
  Your friend has raised a fundamental and historically significant objection that strikes at the heart of Bayesian inference. You are not "wrong" to have used a uniform prior—it is the most intuitive starting point and was the standard for much of the early history of statistics (Laplace, Bayes). However, your friend is technically correct: **a flat prior is not invariant under reparameterization.**

  If you claim a prior represents "no information," that claim should ideally hold regardless of how you choose to measure the parameter. If changing the units or the scale changes the prior from "flat" to "peaked," then the prior *does* contain information about the scale.

  Here is an account of the implications, the mathematical mechanics of the problem, the standard resolutions, and concrete recommendations for your specific cases.

  ---

  ### 1. The Core Problem: Reparameterization and Measure

  The Principle of Indifference states that if there is no reason to favor one outcome over another, they should be assigned equal probability. This works perfectly for finite discrete sets (e.g., a die roll). For continuous parameters, however, "equal probability" requires a **measure** (a way of measuring distance or volume in the parameter space).

  #### The Change-of-Variables Formula
  Let $\theta$ be your parameter with prior density $p(\theta)$. Suppose you reparameterize to $\phi = f(\theta)$. The probability mass must be preserved:
  $$ p(\phi) = p(\theta) \left| \frac{d\theta}{d\phi} \right| $$
  If you set $p(\theta) \propto 1$ (a flat prior), then:
  $$ p(\phi) \propto \left| \frac{d\theta}{d\phi} \right| $$
  Unless the transformation is linear (i.e., $\phi = a\theta + b$), the derivative is not constant. Therefore, **a flat prior on $\theta$ implies a non-flat prior on $\phi$.**

  #### Example: Probability vs. Log-Odds
  Consider a success probability $p \in (0,1)$.
  1.  **Uniform on $p$:** You set $p(p) \propto 1$. This is the $\text{Beta}(1,1)$ distribution.
  2.  **Uniform on Log-Odds:** Let $\phi = \log(\frac{p}{1-p})$. If you set $p(\phi) \propto 1$, then transforming back to $p$ yields:
      $$ p(p) \propto \frac{1}{p(1-p)} $$
      This is the $\text{Beta}(0,0)$ distribution (improper), which places infinite mass near 0 and 1.

  These two priors make very different predictions before seeing any data. The first suggests values near 0.5 are just as likely as values near 0.01. The second suggests values near 0 and 1 are vastly more likely than values near 0.5. Neither is truly "neutral"; they encode different assumptions about the *geometry* of the parameter space.

  ### 2. Principled Resolutions

  To break the tie without smuggling in arbitrary assumptions, statisticians have developed criteria for "objective" or "reference" priors.

  #### A. Jeffreys Priors (Invariance)
  Harold Jeffreys proposed a prior that is **invariant to reparameterization**. If you calculate the Jeffreys prior for $\theta$ and then transform to $\phi$, it yields the same result as calculating the Jeffreys prior directly for $\phi$.

  The Jeffreys prior is defined proportional to the square root of the **Fisher Information** $I(\theta)$:
  $$ p(\theta) \propto \sqrt{I(\theta)} $$
  Fisher Information measures how much "information" an observable random variable carries about the parameter. Intuitively, Jeffreys prior allocates more probability mass to regions where the likelihood function is flatter (less informative) and less mass where the likelihood is sharp. This equalizes the "informational distance" across the parameter space.

  #### B. Reference Priors
  Developed by Bernardo and Berger, these are more general than Jeffreys priors. They are chosen to maximize the expected Kullback-Leibler divergence between the prior and the posterior. In plain English: **choose the prior that allows the data to contribute the maximum possible amount of information to the final result.**

  #### C. Weakly Informative Priors (The Modern Practical Solution)
  In modern applied Bayesian statistics (championed by Andrew Gelman and others), the quest for a truly "uninformative" prior is often abandoned as a fool's errand. Instead, the goal is a **weakly informative prior**.
  *   It provides enough regularization to keep estimates reasonable (preventing absurd values).
  *   It is broad enough that, with a moderate amount of data, the likelihood dominates.
  *   It is defensible based on substantive knowledge (e.g., "a probability cannot be negative," "a rate is unlikely to exceed 1000").

  ### 3. Concrete Recommendations

  Here is how you should handle the two specific parameters you mentioned to satisfy a statistically literate colleague.

  #### Case 1: A Probability (Binomial/Bernoulli Parameter)
  *Parameter:* $p \in (0,1)$, the success probability.

  *   **The Uniform Choice:** $\text{Beta}(1,1)$.
      *   *Critique:* As shown above, this is uniform on the linear scale but informative on the log-odds scale. It implies a standard deviation of $\approx 0.29$.
  *   **The Jeffreys Choice:** $\text{Beta}(0.5, 0.5)$.
      *   *Properties:* This is invariant. It corresponds to being uniform on the arc length of the probability sphere. It places more density near 0 and 1, acknowledging that extreme probabilities are often harder to distinguish from data than middle probabilities.
      *   *Recommendation:* If you need a default **objective** prior, use **Jeffreys ($\text{Beta}(0.5, 0.5)$)**. It is the standard defensible choice for binomial rates.
      *   *Alternative:* If you have very little data and want to avoid the U-shape of Jeffreys, use a **Weakly Informative** prior like $\text{Beta}(2,2)$ (mildly concentrated around 0.5) or $\text{Beta}(1,1)$ if you prefer simplicity, but acknowledge the parameterization dependence.

  #### Case 2: A Rate (Poisson or Exponential Parameter)
  *Parameter:* $\lambda > 0$, a failure rate or count rate.

  *   **The Uniform Choice:** $p(\lambda) \propto 1$ on $[0, \infty)$.
      *   *Critique:* This is an **improper prior** (it does not integrate to 1). More importantly, it is not scale-invariant. If you measure time in seconds vs. hours, the prior changes substantively. It implies arbitrarily large rates are just as likely as small ones, which usually contradicts physical reality.
  *   **The Jeffreys Choice:** $p(\lambda) \propto 1/\lambda$.
      *   *Properties:* This is uniform on $\log(\lambda)$. It is scale-invariant (if $\lambda$ is a rate, $c\lambda$ is also a rate, and the prior structure holds).
      *   *Critique:* It is also improper. In practice, it can lead to issues if the data is sparse (e.g., zero events observed).
  *   **Recommendation:** Do **not** use a flat uniform prior on a rate.
      1.  **Objective Default:** Use the Jeffreys prior $p(\lambda) \propto 1/\lambda$ (often implemented as a limit of a Gamma distribution).
      2.  **Robust Default (Preferred):** Use a **Half-Cauchy** or a **Gamma with small shape/scale**.
          *   Example: $\lambda \sim \text{Gamma}(0.001, 0.001)$ approximates $1/\lambda$ but is proper.
          *   Example: $\lambda \sim \text{Half-Cauchy}(0, 5)$ allows for large values but penalizes them more than $1/\lambda$ does, preventing absurd estimates when data is scarce.

  ### 4. How to Defend Your Choice to Your Colleague

  To resolve the disagreement without conceding that your previous work was "wrong," you can frame the discussion around **purpose** rather than **truth**.

  1.  **Acknowledge the Paradox:** Start by validating their point. "You are correct that a uniform prior is not invariant under reparameterization, and Bertrand's paradox illustrates that 'randomness' requires a defined measure."
  2.  **Shift from "Uninformative" to "Reference":** Explain that you are no longer seeking a prior that represents "total ignorance" (which is impossible), but rather a **reference prior** that minimizes the prior's influence on the posterior relative to the data.
  3.  **Justify by Parameter Type:**
      *   "For the probability parameter, I am using the Jeffreys prior ($\text{Beta}(0.5, 0.5)$) because it ensures invariance whether we model the probability or the log-odds."
      *   "For the rate parameter, I am avoiding a flat prior because rates are scale parameters. I am using a $1/\lambda$ prior (or weakly informative Gamma) to maintain scale invariance."
  4.  **Sensitivity Analysis:** The ultimate defense in Bayesian analysis is not the prior itself, but a **sensitivity analysis**. Tell your colleague: "I have chosen this default prior, but I have also checked that using a Uniform or a Jeffreys prior does not meaningfully change the posterior given our sample size." If the data is strong enough, the prior choice becomes irrelevant, rendering the paradox moot for practical inference.

  ### Summary Table

  | Parameter Type | Naive "Flat" Prior | Problem | Principled Default (Objective) | Practical Default (Weakly Informative) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Probability** ($p \in [0,1]$) | Uniform $\text{Beta}(1,1)$ | Not invariant to log-odds | **Jeffreys $\text{Beta}(0.5, 0.5)$** | $\text{Beta}(2,2)$ or $\text{Beta}(1,1)$ |
  | **Rate / Scale** ($\lambda > 0$) | Uniform $p(\lambda) \propto 1$ | Not scale-invariant; Improper | **Jeffreys $p(\lambda) \propto 1/\lambda$** | **Half-Cauchy** or $\text{Gamma}(\epsilon, \epsilon)$ |

  ### Final Verdict
  Your friend's objection is a standard rite of passage in Bayesian statistics. The "flat prior" is a useful heuristic, but it is not a mathematical invariant. By switching to **Jeffreys priors** for objective analysis or **weakly informative priors** for practical modeling, you adopt a position that is robust to reparameterization and defensible against the Bertrand's Paradox critique.
