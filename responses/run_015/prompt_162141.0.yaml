  The case succeeds: simulation credence need not dampen longtermism if high p implies high base-reality capacity. A funder allocates £1M between Grant N (near-term health, value V) and Grant F (existential risk reduction, value F). Naive longtermism assumes base reality, estimating F from digital minds and space settlement, yielding F ≫ V. Position 2 weights F by (1−p), the probability we are base, reducing the margin to (1−p)F − V. Position 3 notes p is fixed by the ratio of simulated to base observers, tracking the computational capacity of mature civilisations. Conditional on being base, our civilisation possesses the capacity required to generate high p, scaling F inversely to (1−p). Thus Expected Value(F) ≈ (1−p) × [F/(1−p)] = F. For p < 0.9, the margin remains ≈ F − V, preserving F. The dampening vanishes because high simulation credence implies high base-reality capacity, offsetting the probability discount.

  **Demonstration**

  *   **Feature doing the work:** The structural link between simulation credence ($p$) and the computational capacity of base civilisations. High $p$ implies mature civilisations run many simulations, which requires vast computing resources; conditional on being base, we inherit this vast capacity, increasing $F$ proportionally to $1/(1-p)$.
  *   **If removed:** Position 3 collapses to Position 2. Without the capacity link, $F$ remains constant regardless of $p$, so the expected value becomes $(1-p)F$, restoring the dampening effect.
  *   **If sim future not cut short:** If simulated minds also have astronomical futures, $F$ applies to both branches. Expected value becomes $pF + (1-p)F = F$. Dampening vanishes entirely for all positions, as the simulation hypothesis no longer threatens the magnitude of the future.
  *   **Worst position's defense (Position 2):** It would argue the capacity link is speculative. While high $p$ requires high *total* capacity, it does not guarantee high *base* capacity (resources could be diverted to simulations). The probability discount $(1-p)$ is robust; the capacity scaling is not.
  *   **Non-EV decision rules:** Yes. Risk-weighted utilitarianism or minimax regret would be moved. Even if EV is restored to $F$, the *variance* increases (base reality yields huge $F/(1-p)$, simulation yields 0). A risk-averse agent would prefer the certain value $V$ of Grant N over the high-variance Grant F as $p$ rises.
