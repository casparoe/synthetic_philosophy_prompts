answer: |-
  The pattern you have identified reveals that our current practices of commemoration are not running on a single, coherent theory of what a monument *is*. Instead, they operate on a hybrid of two distinct theories that apply differently depending on the medium (statue vs. name).

  Here is the argument broken down by what the practices strictly presuppose, where they are inconsistent, and what rival views they exclude.

  ### 1. The Core Presupposition: Commemoration as Current Endorsement
  The single strongest presupposition underlying the entire package (removal, renaming, and the focus on wrongdoing) is that **commemoration is an act of current civic endorsement, not historical record.**

  *   **Why this is strict:** If commemoration were primarily a *record* of what past generations valued, removal would make no sense. You would keep the statue to show "this is what they thought then." The fact that removal is the standard "guilty" verdict proves we treat the object as a statement *we* are making *now*.
  *   **Why this rules out alternatives:** This practice explicitly rejects the view that the dead have a stake in their memory (otherwise, their original contract with the city would stand). It also rejects the view that art is autonomous (otherwise, the artistic merit would protect the statue regardless of the subject's morality).
  *   **The Wrongdoing vs. Mediocrity Filter:** This confirms the "Endorsement" theory. If commemoration were about *significance* or *fame*, mediocre or lucky people would be removed as often as criminals, because they are equally unworthy of immortality. The fact that only *wrongdoing* triggers removal proves that public commemoration is a **moral claim**. It asserts: "This person is a model for us." A mediocre person is not a model, but they are not an *affront*. A criminal is an affront. Therefore, the practice presupposes that to commemorate is to vouch for moral character.

  ### 2. The Divergence: Statues as Icons, Names as Tools
  Your observation about the cost/effort paradox (cheap statues cause fights, expensive names do not) reveals an internal inconsistency in how the two media are theorized by the public and the city.

  **Statues are treated as Icons (Presence).**
  *   **The Theory:** A statue is treated as a quasi-religious idol. Its power lies in its *visibility* and its *placement*. It occupies public space physically and visually dominates it.
  *   **The Consequence:** Because it is an icon, moving it is a desecration or a consecration. Leaving it up is an active act of worship; taking it down is an act of exorcism. This is why the fight is so fierce. The cost is irrelevant because the stakes are spiritual/symbolic, not financial.
  *   **Mate 1's Analysis:** Your first mate is largely correct here. The honor resides in the *pedestal*, not the bronze. This explains why museums are the default destination. A museum is a neutral space of "history," whereas a plinth is a sacred space of "honor." Moving the statue to a warehouse or museum de-consecrates it without destroying it. We don't melt them down because the bronze itself is not the sin; the *elevation* is the sin.

  **Names are treated as Tools (Reference).**
  *   **The Theory:** A street name or school name is treated as a functional label. It is a piece of infrastructure used for navigation and administration.
  *   **The Consequence:** Because it is a tool, changing it is an administrative update. While Mate 2 argues that names are "worse" because we enact them daily, the practice suggests the opposite: because we use them functionally, we feel more ownership over them. We feel entitled to change our tools when they become inconvenient or offensive.
  *   **The Paradox:** Renaming is expensive, but it is less contested because it feels like *updating software*. Removing a statue feels like *tearing down a cathedral*. The practice presupposes that we have more authority to change our *labels* than our *landscape*.

  **Verdict on Consistency:** The package is **not internally consistent**. It runs on an "Endorsement" theory for both, but it applies a "Sacred/Icon" theory to statues and a "Functional/Utility" theory to names. If they were consistent, the high cost of renaming would make it as controversial as statue removal, or the low cost of statue removal would make it as mundane as renaming. The emotional weight tracks with the *permanence of the medium*, not the cost of the change.

  ### 3. The "Retain-and-Explain" Contradiction
  The "retain-and-explain" option (bolting on a plaque) is the weakest link in the chain logically, though it makes sense politically.

  *   **The Tension:** This option presupposes that meaning is **context-dependent**. It assumes a statue can be transformed from "Honor" to "Lesson" simply by adding text.
  *   **The Contradiction:** If meaning were truly context-dependent, we would never need to remove anything. We could just plaque everything. The fact that removal still happens proves that for many, the visual presence of the statue *overpowers* the text. The image speaks louder than the plaque.
  *   **What it implies:** This practice is a compromise that tries to bridge the "Endorsement" view (it's bad to honor him) and the "Record" view (we shouldn't hide history). It works only for people who are ambivalent. It satisfies neither the camp that wants the honor (who see the plaque as an insult) nor the camp that wants removal (who see the statue as a continuing harm). It is an underdetermined solution that papers over the theoretical conflict.

  ### 4. Evaluating Your Mates
  *   **Mate 1 (The Plinth Theory):** This is doing heavy lifting in the practice. It explains the "Museum Solution." If the honor were in the bronze, museums couldn't accept them. The fact that museums *do* accept them proves we believe the context (the plinth) creates the honor, and the context (the museum) creates the history. This is why we don't melt them down: we aren't trying to erase the person, we are trying to demote them from "Hero" to "Artifact."
  *   **Mate 2 (The Usage Theory):** This is less supported by the practice. If daily usage made the honor more potent, renaming should be *more* controversial than statue removal (since we ignore statues but speak names). The fact that renaming is *less* controversial suggests that daily usage makes the name feel like *our* property, whereas the statue feels like *ancestors'* property. We feel we can rename our own tools; we feel we shouldn't topple our ancestors' idols.

  ### 5. Counterfactuals: What if we swapped the view?
  To clarify what our current practice presupposes, consider what would change if we adopted the rival views you mentioned:

  *   **If Commemoration = Historical Record:**
      *   **Change:** No removals ever. Statues stay, names stay.
      *   **Addition:** Every single monument would have a detailed plaque explaining the context of its erection and the moral failings of the subject.
      *   **Result:** The landscape would look like a museum archive, not a hall of fame.

  *   **If Commemoration = Pure Current Speech (Radical Endorsement):**
      *   **Change:** We would rename things much more frequently, not just for wrongdoing, but whenever values shift. A poet might be out in ten years because their style falls out of favor.
      *   **Addition:** Statues would be temporary installations, not permanent bronze.
      *   **Result:** High instability. The landscape would change with every election cycle.

  *   **If The Dead Have a Stake:**
      *   **Change:** Grandfather clauses. Nothing could be changed after the death of the namesake or the erection of the statue.
      *   **Result:** Our civic landscape would be frozen in the moral norms of the past.

  *   **If Commemoration = Aesthetic Value Only:**
      *   **Change:** Bad art gets removed regardless of the subject's morality. Good art stays regardless of the subject's crimes.
      *   **Result:** We would keep statues of villains if they were beautiful, and remove statues of saints if they were ugly.

  ### 6. Conclusion: What the Practice Actually Is
  The current package of practices presupposes that **public space is a moral environment that must be kept pure of active evil, but need not be purged of mere irrelevance.**

  It treats **statues as claims about who we are** (Identity), which is why moving them is traumatic.
  It treats **names as claims about how we navigate** (Utility), which is why changing them is administrative.

  The practice is underdetermined regarding the *fate* of the removed object (museum vs. warehouse vs. destruction), which suggests we haven't decided if the object is contaminated or just demoted. But it is strictly determined regarding the *trigger* for removal: it must be moral failure, not historical insignificance.

  Ultimately, the inconsistency you spotted is real. We treat statues as if they are sacred vows made by the past that we are bound to respect unless they are sinful. We treat names as if they are utility contracts made by the present that we can renegotiate when they become costly or offensive. We fight harder for the statue because we feel we are defending the permanence of the city itself; we accept the renaming because we feel we are just updating the address book.
