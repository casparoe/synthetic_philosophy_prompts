answer: |-
  **The Stakes**

  The fight over the word is not a quarrel about synonyms. It is a struggle over memory, obligation, and the architecture of justice. When survivors demand the label of genocide, they are asking for more than accurate description; they are seeking a specific place in history reserved for the absolute worst crimes. The word acts as a key that unlocks doors otherwise bolted shut. It transforms a tragedy into a crime demanding universal jurisdiction. For bystanders, the label carries a heavy burden of conscience, suggesting a duty to intervene that cooler terms like ethnic cleansing or crimes against humanity do not automatically trigger. For perpetrators, the vocabulary of the law shapes the mechanics of killing. If the crime requires a specific intent to destroy a group, killers may learn to avoid writing orders that state this aim, masking their goals behind the language of security or relocation. The naming fight determines who gets to claim the status of victim, who must answer for the dead, and what the world owes the living. To loosen the definition is to expand the circle of guilt; to tighten it is to risk excluding suffering that feels identical to those enduring it. The stakes are measured in bodies, certainly, but also in the political will required to protect them.

  **The Case for Keeping the Category Narrow**

  Defenders of the narrow definition argue that the law must distinguish between the wicked and the catastrophic. The core of this position rests on the requirement of specific intent. In legal terms, this means the perpetrator must not only commit violent acts but must do so with the conscious aim of destroying a protected group, in whole or in substantial part. This mental element is the firewall that separates genocide from other mass atrocities. Without it, any war that disproportionately kills members of a particular ethnicity could be labeled genocide, regardless of whether the attacker sought their eradication or simply their defeat. Protecting this high bar preserves the moral force of the word. If every campaign of terror or tragic loss of life qualifies, the term loses its power to shock the conscience of nations.

  Furthermore, a narrow category protects the accused from arbitrary justice. Criminal law generally punishes choices, not outcomes alone. A commander who causes massive death through negligence or strategic blindness is guilty of much, but defenders argue he is not guilty of the same unique evil as one who sets out to erase a people from existence. The distinctive wrong of genocide is the attack on the group's right to exist, not merely the sum of individual murders. Diluting the definition to include outcomes without this specific aim risks turning the court into a tribunal of history rather than law. It conflates the horror of the result with the malice of the motive. By keeping the vocabulary restricted, legal scholars argue we ensure that when the word is finally used, it carries an undeniable weight that compels action rather than inducing fatigue through overuse.

  **The Case Against Intent**

  Critics argue that focusing on the killer's state of mind privileges the bureaucrat over the butcher. This is the problem of archival selection. A regime that documents its hatred in written orders satisfies the intent requirement easily. A regime that destroys a group through calculated neglect, environmental ruin, or the accumulated acts of many unconnected hands leaves no smoking gun. Under a strict intent standard, the tidy, paperwork-generating atrocity is easier to prosecute than the chaotic one, even if the destructive footprint—the actual difference the conduct makes to the group's numbers and cohesion—is identical. Survivors rarely care about the internal thoughts of their oppressors; they care that their community has been dissolved.

  This position elevates the destructive footprint over the mental element. If a policy foreseeably cuts short the persistence of a group, making it likely that a people who would have endured for generations will vanish, the result is genocidal regardless of the stated aim. Advocates for this view note that modern destruction often wears the mask of development or counter-insurgency. Governments may claim they are relocating people for safety while knowing the relocation ensures their demise. To require proof of a specific desire to destroy allows perpetrators to hide behind plausible deniability. It creates a loophole where the most effective methods of erasure—starvation, disease, dispersal—are exempt from the highest condemnation because they lack the formal declaration of hate. The moral load should rest on the reality of the destruction, not the secrecy of the intent.

  **Attrition and Its Discontents**

  The attrition test proposes a solution by shifting focus to consequences. Under this model, an episode counts as genocidal when its destructive footprint foreseeably ends the group's persistence as a distinguishable entity. This captures the slow violence that intent-based definitions miss. However, administering this test introduces profound difficulties. It requires courts to adjudicate counterfactuals about culture and demographics. Judges would need to determine whether a group would have persisted for two more generations absent the conduct in question. This turns legal proceedings into speculative exercises in sociology.

  Moreover, the attrition test risks converting misfortune into crime. Groups dissolve for many reasons: economic pressure, intermarriage, assimilation, or natural disaster. If the standard is purely about the outcome—the thinning of a people—then any policy that accelerates this trend could be implicated. A government building a dam that floods ancestral lands might not intend to destroy the tribe, but if the tribe disperses and loses its language, the attrition test might label this genocide. This stretches the concept until it snaps. It removes the element of moral choice that justifies punishment. Without a link to malicious agency, the label becomes a description of tragedy rather than a verdict of guilt. While it solves the problem of the invisible killer, it creates a new problem where every adverse event affecting a minority group becomes a potential international crime, overwhelming the mechanisms designed to stop the worst abuses.

  **Two Cases**

  Consider a stylized episode of bureaucratic starvation. A state denies water and medicine to a region inhabited by a distinct minority, citing budget constraints. No orders exist to kill the group, but officials know the mortality rate will be high. The intent definition likely misses this, as the aim is framed as fiscal austerity. The attrition test catches it, because the foreseeable result is the group's dissolution. This suggests the intent standard is too blind to structural violence.

  Now consider a second episode of market assimilation. A global corporation buys land traditionally held by a small community. The community cannot compete economically and disperses into cities, losing its language within a generation. No state policy forced this, but the destructive footprint is real: the group ceases to exist. The attrition test might catch this as a form of destruction, yet labeling it genocide feels wrong. It lacks the coercive power of the state and the element of malice. The first case shows the intent standard is too narrow; the second shows the attrition test is too broad. The first demands accountability for known consequences; the second risks criminalizing the inevitable friction of modern life. These examples reveal that neither test perfectly captures the moral intuition behind the word.

  **My Verdict**

  The concept should keep its narrow, intent-centered shape for legal prosecution, but the public vocabulary must expand to carry the remaining moral load. The courtroom is not the right venue for sociological speculation. A prosecutor needs proof of a guilty mind to justify the stigma and penalty of genocide. To lower this bar is to risk unjust convictions and legal paralysis. However, newsrooms and foreign ministries should not be bound by the strictures of criminal law. An editor should feel free to describe a situation as genocidal in nature if the destructive footprint is evident, even if specific intent cannot be proven in court.

  This split requires discipline. On Monday morning, the prosecutor must demand evidence of orders or statements proving an aim to destroy. She must protect the integrity of the trial. The editor, meanwhile, should use the word to describe the reality on the ground, contextualizing it with evidence of foreseeable destruction. Diplomats should trigger duties of protection based on the scale of suffering, not waiting for a legal verdict. We need a dual vocabulary: one for conviction, which remains narrow and precise, and one for conscience, which is broad enough to name the slow erasure of peoples. This preserves the legal utility of the term while ensuring the political world does not hide behind legal technicalities to ignore catastrophe. The law punishes the murderer; history must judge the grave.
