answer: |-
  # DECISION TREE: ANATTA & PERSONAL IDENTITY
  **Instructions:** Follow the branches based on your philosophical commitments regarding the self, continuity, and narrative.

  ### SPLIT 1: NATURE OF THE "SELF" ILLUSION
  **Is the primary problem ontological misunderstanding or emotional habituation?**

  *   **A. Cognitive Error:** The self is a mistaken view (*dṛṣṭi*); reality is misapprehended.
  *   **B. Affective Clinging:** The self is a habit of grasping (*upādāna*); reality is felt incorrectly.

  ---

  ### SPLIT 2: MECHANISM OF CONTINUITY (REBIRTH/TIME)
  **Does the causal stream require a substratum to link moments?**

  *   **A. Substratum/Carrier:** Yes. A latent structure (e.g., *ālaya*, seeds, person) bears karmic imprint.
  *   **B. Bare Causal Continuity:** No. Momentary succession (*pratītyasamutpāda*) is sufficient; no bearer needed.

  ---

  ### SPLIT 3: STATUS OF NARRATIVE IDENTITY
  **Does constructing a self-story have moral weight or merely utility?**

  *   **A. Normative Pull:** Yes. Narrative coherence is constitutive of agency/accountability.
  *   **B. Only Pragmatic:** No. Narrative is a useful fiction (*saṃvṛti*) with no ultimate ethical ontology.

  ---

  ## LEAVES (POSITIONS)

  ### 1. [Cognitive] + [Bare Causal] + [Pragmatic]
  **Position:** **Parfitian Reductionism**
  *   **View:** Personal identity is indeterminate; "Relation R" (psychological continuity) matters, not a self.
  *   **Implication:** Moral responsibility survives without identity; narrative is a convenient shorthand.

  ### 2. [Cognitive] + [Bare Causal] + [Normative]
  **Position:** **Unexplored Combo (Karmic Flux)**
  *   **View:** Total skandha-flux is real (no carrier), yet cross-life moral accountability is strictly maintained.
  *   **Implication:** Karma attaches to the causal stream itself, demanding normative narrative structure despite ontological emptiness.

  ### 3. [Cognitive] + [Carrier] + [Pragmatic]
  **Position:** **Yogacara (Ālaya-vijñāna)**
  *   **View:** Storehouse consciousness carries seeds; perceived self is cognitive projection (*vijñapti-mātra*).
  *   **Implication:** Narrative is relative truth; liberation is transforming the basis, not finding a self.

  ### 4. [Cognitive] + [Carrier] + [Normative]
  **Position:** **LOGICALLY EMPTY (Orthodox View)**
  *   **Status:** **Unstable/Contradictory.**
  *   **Reasoning:** If a Carrier exists AND narrative is Normative, the "self" gains ontological weight. In Buddhist taxonomy, this collapses into *ātman* (Pudgalavada heresy). Cannot maintain "Cognitive Error" while affirming normative carrier-based agency.

  ### 5. [Affective] + [Bare Causal] + [Pragmatic]
  **Position:** **Theravada Hard Reductionism (Abhidhamma)**
  *   **View:** Craving drives the stream; no person exists behind the *khandhas*.
  *   **Implication:** Narrative is purely conventional; liberation is cessation of clinging, not correction of view alone.

  ### 6. [Affective] + [Bare Causal] + [Normative]
  **Position:** **Narrative Identity (Buddhist Window)**
  *   **View:** Self is clinging, but ethical agency requires constructing a coherent story.
  *   **Implication:** "No-self" is ultimate, but "self" is normatively required for bodhisattva vows/social ethics.

  ### 7. [Affective] + [Carrier] + [Pragmatic]
  **Position:** **Tathāgatagarbha (Buddha-Nature)**
  *   **View:** Defilements are adventitious (affective); underlying nature is the carrier.
  *   **Implication:** Narrative is skillful means (*upāya*); liberation is revealing the base, not building a self.
