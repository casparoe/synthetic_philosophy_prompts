answer: |-
  # Specification Requirements: Automated Allocation Under Unbounded Payoffs

  ## 1. Scope and Purpose
  This document specifies the functional requirements for a decision module within an automated allocation system. The module must produce a determinate ranking of interventions (prospects) to guide resource distribution. The system operates under **bounded computational resources** and faces **forced-choice scenarios** (the agent cannot decline to decide). The specification addresses pathologies arising from unbounded payoffs and vanishing probabilities (St. Petersburg-type problems).

  ## 2. Core Desiderata
  The following requirements define the necessary properties of the decision rule. Each desideratum is marked as **Non-Negotiable** (required by the system constraints or basic rationality) or **Camp Commitment** (reflecting a specific theoretical stance on risk and value).

  ### D1. Decisiveness (Forced Choice)
  *   **Requirement:** For any pair of prospects presented to the system, the output must be a strict preference ($A \succ B$), indifference ($A \sim B$), or a specified default rule. The output "comparison undefined" is not admissible as a terminal state.
  *   **Motivation:** The agent is embedded in an environment where inaction is not an option. Computational paralysis is a failure mode.
  *   **Prospect Reference:** Applies to all, specifically **Prospect 3 (Pasadena)** and **Prospect 4**, where standard expectation may fail to yield a unique sum.
  *   **Status:** **Non-Negotiable** (System Constraint).

  ### D2. Statewise Dominance
  *   **Requirement:** If Prospect $A$ yields an outcome at least as good as Prospect $B$ in every possible state of the world, and strictly better in at least one state, the system must rank $A \succ B$.
  *   **Motivation:** To prevent the system from selecting strictly inferior interventions, which would constitute a waste of resources.
  *   **Prospect Reference:** **Prospect 4** dominates **Prospect 3**. A theory ranking $3 \succeq 4$ or declaring them incomparable violates this.
  *   **Status:** **Non-Negotiable** (Basic Rationality).

  ### D3. Reordering Invariance
  *   **Requirement:** The valuation of a prospect must not depend on the enumeration order of its outcome states.
  *   **Motivation:** The physical payoff of an intervention is independent of the mathematical indexing used to calculate its value. A value dependent on indexing is mathematically unstable.
  *   **Prospect Reference:** **Prospect 3 (Pasadena Game)**. The expectation of the alternating harmonic series changes if terms are rearranged. The theory must assign a value invariant to this rearrangement.
  *   **Status:** **Non-Negotiable** (Mathematical Stability).

  ### D4. Computational Truncation (Boundedness)
  *   **Requirement:** The system must not attempt to compute infinite sums or represent numbers exceeding its hardware precision. The decision rule must converge using finite resources.
  *   **Motivation:** The agent is physically bounded. It cannot process the infinite tail of **Prospect 1** or **Prospect 2**.
  *   **Prospect Reference:** **Prospect 1 (Classic St. Petersburg)** and **Prospect 5 (Pascal's Mugging)**.
  *   **Status:** **Non-Negotiable** (System Constraint).

  ### D5. Robustness to Extreme Tails (Anti-Mugging)
  *   **Requirement:** The system must not assign infinite or arbitrarily high priority to a prospect solely based on a payoff magnitude that exceeds computational representation, paired with a probability below a reliability threshold.
  *   **Motivation:** To prevent resource capture by low-probability, high-magnitude claims that cannot be empirically verified or computationally processed.
  *   **Prospect Reference:** **Prospect 5 (Pascal's Mugging)**.
  *   **Status:** **Camp Commitment** (Bounded Utility / Probability Truncation). *Note: Pure Expectation Maximizers reject this.*

  ### D6. Expectation Consistency (Where Convergent)
  *   **Requirement:** For prospects where the expected value sum converges absolutely and is computable within bounds, the ranking should align with the ordering of those expectations.
  *   **Motivation:** To preserve standard decision-theoretic results in normal operating conditions.
  *   **Prospect Reference:** **Prospect 2** (if truncated) or standard bounded gambles.
  *   **Status:** **Camp Commitment** (Expectation Maximization). *Note: Growth-rate maximizers or Risk-weighted theorists may relax this.*

  ---

  ## 3. Conceptual Distinctions and Verdicts

  ### Value vs. Price
  **Requirement:** The specification **must distinguish** between the *theoretical value* of a prospect (its contribution to the objective function) and the *buying/selling price* (the certainty equivalent an agent would trade).
  **Reasoning:** In unbounded domains, these can come apart. A prospect may have an infinite expected value (theoretical) but a finite buying price (due to risk aversion or liquidity constraints). Collapsing these leads to money-pump vulnerabilities in automated markets. The system must optimize for *Value* (D1-D6) but execute trades based on *Price* derived from that value via a separate conversion function.

  ### Admissibility of "No Determinate Value"
  **Requirement:** The verdict "this prospect has no determinate value" is **inadmissible** as a final system output.
  **Reasoning:** While a mathematical theory might correctly identify that a series (like Prospect 3) lacks a well-defined expectation, the *system* must act (D1). Therefore, the theory must include a tie-breaking or default rule (e.g., "treat undefined expectations as zero" or "apply dominance only") that forces a ranking even when value is mathematically indeterminate. A theory that leaves the agent paralyzed in the face of the Pasadena game fails the specification.

  ### Descriptive Adequacy
  **Requirement:** The theory is **not required** to explain what real human agents actually pay for these prospects.
  **Reasoning:** This is a normative specification for an automated allocator, not a descriptive psychological model. Human agents exhibit cognitive biases (e.g., probability neglect, loss aversion) that are bugs, not features, in an allocation system. Matching human pricing on Pascal's Mugging cases would likely replicate human irrationality. The system should optimize for coherence and resource efficiency, not psychological fidelity.

  ---

  ## 4. Impossibility Results and Tensions

  ### The Substantive Tension
  There is a known impossibility result preventing the joint satisfaction of the following subset of desiderata:
  1.  **Statewise Dominance (D2)**
  2.  **Reordering Invariance (D3)**
  3.  **Expectation Consistency (D6)** (specifically, that value equals the sum of probability $\times$ utility for all convergent series)
  4.  **Unbounded Utility** (Implicitly rejected by D4/D5, but assumed by D6 in the limit)

  **Explanation:** The **Pasadena Game (Prospect 3)** demonstrates that for conditionally convergent series, the expectation sum depends on ordering. To satisfy **Reordering Invariance (D3)**, one must reject the standard expectation sum as the definition of value. However, if one rejects the expectation sum, one risks violating **Expectation Consistency (D6)**. Furthermore, if one assigns a finite value to the Pasadena game to ensure **Decisiveness (D1)**, one must ensure it does not violate **Dominance (D2)** relative to Prospect 4.

  **The "Killer" Desideratum:**
  **D1 (Decisiveness)** combined with **D4 (Computational Truncation)** does the most work in eliminating candidates.
  *   **Why:** Pure Expectation Maximization (EM) satisfies D2 and D6 but fails D1 (cannot rank infinite vs. infinite or undefined vs. undefined) and D4 (cannot compute infinite sums).
  *   **Consequence:** To satisfy D1 and D4, the system *must* adopt a modification of EM (e.g., bounded utility, probability discounting, or truncation). This necessarily violates pure D6 in the limit. The specification prioritizes **Decisiveness** and **Boundedness** over **Pure Expectation**.

  ### Resolution Strategy
  The specification resolves this tension by prioritizing **D1 (Decisiveness)** and **D2 (Dominance)**. If a prospect's expectation is undefined (Prospect 3), the system must fall back on a secondary rule (e.g., variance minimization, median outcome, or dominance comparison) to generate a ranking, rather than returning "undefined."

  ---

  ## 5. Brief Scoring of Candidate Families

  | Family of Solutions | D1 (Decisive) | D2 (Dominance) | D3 (Reordering) | D4 (Bounded) | D5 (Anti-Mug) | Notes |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Naive Expectation** | ❌ | ✅ | ❌ | ❌ | ❌ | Fails on SP & Pasadena. Paralysis on undefined sums. |
  | **Bounded Utility** | ✅ | ✅ | ✅ | ✅ | ✅ | **Strong Fit.** Caps payoff, rendering all sums finite. Violates "unbounded payoff" intuition but satisfies system constraints. |
  | **Probability Truncation** | ✅ | ✅ | ✅ | ✅ | ✅ | **Strong Fit.** Ignores tails below $\epsilon$. Solves Mugging & SP. Risks violating Dominance if truncation point is state-dependent. |
  | **Risk-Weighted (Buchak)** | ✅ | ⚠️ | ✅ | ✅ | ✅ | **Moderate Fit.** Handles risk, but requires careful weighting function to ensure Dominance holds for Prospect 4 vs 3. |
  | **Growth-Rate (Kelly)** | ✅ | ✅ | ✅ | ✅ | ✅ | **Strong Fit.** Optimizes long-run rate. Naturally bounds effective value of SP. Less intuitive for one-shot forced choices. |
  | **Principled Indeterminacy** | ❌ | ✅ | ✅ | ⚠️ | ⚠️ | **Fail.** Admits "no value" verdicts. Violates D1 (Forced Choice). |

  **Recommendation:** The **Bounded Utility** or **Probability Truncation** families best satisfy the Non-Negotiable constraints (D1, D2, D3, D4). While they represent a **Camp Commitment** against pure Expectation Maximization, they are the only candidates compatible with a bounded, forced-choice automated system.
