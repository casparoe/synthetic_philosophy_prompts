answer: |-
  First, a brief verification of your summary: You have not garbled the material. Your outline of the "shape/color" distinction, the "seeking" argument, the Objector's existence challenge, and the *Hard and White* sensory separation accurately reflects the received text of the *Gongsun Longzi*.

  Here is the assessment of your three proposals, followed by the menu of theses, the specific answers to your questions, and my committed interpretation.

  ### Assessment of Your Three Proposals

  1.  **The Class Reading:** (White horses are a proper subclass of horses; the sets are not identical.)
      *   **Verdict:** **Trivial-but-true.** In modern set theory, a proper subset is not identical to its superset ($A \subset B \implies A \neq B$).
      *   **Text Support:** The "seeking" argument supports this extensionally (the range of acceptable objects differs). However, the text argues *fei* (is not), which usually implies exclusion, not just non-identity. If the text meant only non-identity, the Objector's reply ("if there is a white horse, there is a horse") would be uncontroversial, yet the Advocate fights it.
      *   **Interlocutors:** The **Visitor** could accept this as the "trivial" truth beneath the "pun." The **Instructor** would find this insufficient to prove the existence of universals.

  2.  **The Term Reading:** (Different names, different conditions of application; substitution fails in intensional contexts.)
      *   **Verdict:** **Substantive and Defensible.** This treats the proposition as a claim about the semantics of *ming* (names) rather than the ontology of objects.
      *   **Text Support:** Strong. The "seeking" argument is the classic example of an intensional context (wanting/seeking). The "shape/color" argument explains *why* the names differ (different semantic criteria).
      *   **Interlocutors:** This supports the **Instructor's** claim that there is sophisticated logical work happening (semantics of abstract criteria), but it undermines the **Visitor's** claim that it is merely a pun. It shows the "pun" is actually a logical distinction regarding intensionality.

  3.  **The Kind-Term Reading:** ("Horse" is a kind; "White Horse" is not.)
      *   **Verdict:** **Radical and Textually Weak.** There is little evidence in the text that "white horse" fails to be a kind. The text treats "white horse" as a compound name, not a failed natural kind.
      *   **Text Support:** Weak. The *Hard and White* chapter discusses the separability of attributes (hardness, whiteness), not the criteria for kindhood.
      *   **Interlocutors:** The **Instructor** might wish for this to support a robust ontology, but the text does not sustain it.

  ---

  ### Menu of Distinct Precise Theses
  *Ordered from Trivial to Radical*

  | Thesis | Status | Text Support | Required By |
  | :--- | :--- | :--- | :--- |
  | **1. Linguistic Non-Synonymy:** The phrase "white horse" is not synonymous with "horse." | **Trivial-but-True.** No competent speaker thinks they mean the same thing. | **High.** Implied by the shape/color distinction. | **Visitor** (to reduce it to language). |
  | **2. Extensional Non-Identity:** The set of white horses is not identical to the set of horses. | **Trivial-but-True.** (As per Class Reading). | **Medium.** Supported by the "seeking" argument's extensional outcomes. | **Visitor** (to dismiss metaphysical weight). |
  | **3. Intensional Substitution Failure:** "Horse" and "White Horse" are not interchangeable in contexts of desire/request. | **Substantive/Defensible.** A logical point about *de dicto* vs. *de re* or intensional contexts. | **High.** The core of the "seeking" argument. | **Instructor** (to show logical sophistication). |
  | **4. Compound Name Irreducibility:** A compound name ("white" + "horse") designates a distinct *shi* (actual/criterion) from its simple constituent ("horse"). | **Substantive/Defensible.** A semantic thesis about how modification changes reference conditions. | **High.** The "shape/color" argument supports this directly. | **Instructor** (to show distinct criteria). |
  | **5. Attribute Separability (Ontological):** Whiteness and Horseness can subsist or be conceived independently; the universal "White" is distinct from the universal "Horse." | **Radical/Contested.** Moves from semantics to metaphysics (Platonic forms or Mohist universals). | **Medium.** Supported more by *Hard and White* than *White Horse*. | **Instructor** (to prove abstracta exist). |
  | **6. Exclusionary Ontology:** A white horse is ontologically excluded from the category of horse. | **Straightforwardly False.** Contradicts common sense and the Objector's existence point. | **Low.** The Advocate tries to argue this, but relies on equivocation. | **Neither** (Both would likely reject this). |

  ---

  ### Specific Questions

  **1. Does *Hard and White* support the same reading?**
  It supports a **stronger** version of the reading. While *White Horse* argues that compound names differ from simple names (Semantic), *Hard and White* argues that the attributes themselves (Whiteness, Hardness) are epistemically and ontologically separable from the object and each other (Metaphysical).
  *   *White Horse:* "White" + "Horse" $\neq$ "Horse" (Linguistic/Logical).
  *   *Hard and White:* "White" and "Hard" do not inhabit the stone simultaneously in perception; they are separate "twos," not a unified "one."
  *   *Conclusion:* *Hard and White* pushes toward **Thesis 5 (Attribute Separability)**. It provides the metaphysical grounding that makes the semantic distinction in *White Horse* possible. If attributes weren't separable, adding "white" to "horse" wouldn't change the *ming* (name) so drastically.

  **2. Does the Objector's move succeed against readings other than Class?**
  The Objector argues: "If you have a white horse, you cannot say there is no horse." (Existence Entailment).
  *   **Against Class Reading (Thesis 2):** The Objector **succeeds**. If white horses are a subclass, the existence of a member implies the existence of the superset category.
  *   **Against Term/Intensional Reading (Thesis 3 & 4):** The Objector **fails**, or rather, talks past the Advocate. The Advocate is not denying that a white horse is a member of the horse class; he is denying that the *name* "white horse" satisfies the *request* "horse." The Objector treats "horse" as an ontological category; the Advocate treats "horse" as a specific request condition.
  *   **Advocate's Reply:** The Advocate replies that if you want a horse, yellow/black work; if you want a white horse, they don't. Therefore, the *object of the request* is different. He shifts the ground from *existence* to *satisfaction conditions*.

  ---

  ### Committed Interpretation

  I commit to the view that the text as it has come down to us best supports **Thesis 4: Compound Name Irreducibility (The Semantic/Intensional Reading).**

  On this reading, "A white horse is not a horse" asserts that the compound name *bai ma* imposes a compound criterion (color + shape) that is not satisfied by the simple criterion of the name *ma* (shape alone). The particle *fei* (not) should be read as "is not equivalent to" or "is not interchangeable with," rather than "is not a member of."

  **Why this reading?**
  1.  **Textual Fit:** It accounts for both the "shape/color" argument (semantic content of names) and the "seeking" argument (pragmatic conditions of satisfaction) without requiring the text to assert the ontological falsehood that white horses are excluded from the category of horses.
  2.  **Historical Context:** The School of Names (*Ming Jia*) was primarily concerned with the relationship between *ming* (names) and *shi* (actualities). Their project was the rectification of names, not necessarily the construction of a Platonic ontology.

  **Verdict on the Interlocutors:**

  *   **The Instructor (Universals):** **Partially Correct, but Overreaching.**
      *   *Survives:* The inference that classical Chinese thought has room for "abstracta" survives *if* we locate those abstracta in the separability of attributes (as seen in *Hard and White*) and the independence of naming criteria. The text does treat "White" and "Horse" as distinct conceptual components that can be combined or separated.
      *   *Fails:* The inference that *White Horse* itself is an argument for Platonic Forms is an overreach. The text argues for the distinctness of *names*, not necessarily the independent existence of the Universal "White-Horse." The Instructor is reading a metaphysical conclusion into a semantic argument.
      *   *Contested Position:* I am taking the position that the *Ming Jia* concern with "separability" is logical/semantic first, and only secondarily ontological. Many commentators (e.g., Fung Yu-lan) read Gongsun Long as a realist about universals; I side with the semantic interpretation (closer to A.C. Graham or Chad Hansen) that sees this as a logic of language.

  *   **The Visitor (Pun):** **Partially Correct, but Dismissive.**
      *   *Survives:* The charge that the argument relies on the ambiguity of the copula (*fei*) survives. The argument *does* trade on the ambiguity between "is not identical to" and "is not a member of."
      *   *Fails:* The claim that it is "no deeper than a cheese sandwich" is false. The "seeking" argument demonstrates a genuine insight into intensional contexts (that substitution of co-extensive terms fails in contexts of desire). This is not a mere pun; it is a logical discovery regarding the opacity of intentional verbs.
      *   *Contested Position:* I am contesting the view that ancient Chinese logic was too primitive to distinguish extension from intension. The "seeking" argument is sophisticated enough to warrant more than the label "pun."

  **Summary:**
  The *White Horse Dialogue* is not a claim that white horses are ontologically excluded from horseness (False). It is not merely a pun on "is" (Too shallow). It is a sophisticated argument that **compound names impose distinct satisfaction conditions from simple names.** The Instructor is right that this implies a conceptual separability akin to abstracta, but wrong to treat it as full-blown metaphysical realism. The Visitor is right that it hinges on linguistic usage, but wrong to dismiss that usage as trivial. The *Hard and White* chapter reinforces this by showing that the attributes making up the names are themselves epistemically separable.
