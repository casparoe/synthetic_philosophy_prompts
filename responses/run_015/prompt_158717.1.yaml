answer: |-
  ### Desiderata for an Account of Individual Reasons in Collective Harm

  **I. Core Purpose (The Tuesday/Blame Split)**
  1.  **Action-Guidance:** The account must yield a determinate verdict for a single agent on an ordinary Tuesday (e.g., "buy the sandwich" or "don't") independent of what others do.
  2.  **Blame-Aptness:** The account must provide a separate criterion for whether reactive attitudes (blame, criticism) are appropriate if the agent violates the verdict. *Constraint:* These two outputs must not be logically identical; it must be possible to act wrongly without being blameworthy, or vice versa.

  **II. Case Coverage (The Stress Tests)**
  3.  **Tiny-Contribution:** Must explain the reason to abstain when the individual causal impact is imperceptible (e.g., one drop in a bucket).
  4.  **Lumpy-Threshold:** Must handle discrete, batched harms where causal impact is probabilistic or opaque (e.g., the sandwich batch problem).
  5.  **Constitutive:** Must account for reasons grounded in participation or expression rather than causal outcome (e.g., voting margins, symbolic acts).
  6.  **Repeat-Player:** Must aggregate reasons across time for a single agent facing iterated negligible choices (e.g., daily carbon emissions over a lifetime).
  7.  **Non-Identity/Existence:** Must resolve cases where the harmful practice is a condition of the victim's existence (e.g., demand creates the market that creates the worker).

  **III. Conceptual Distinctions (The Boundaries)**
  8.  **Difference vs. Participation:** Must distinguish *making a difference* to the outcome from *being one of those who make it*.
  9.  **Expected vs. Actual Efficacy:** Must distinguish reasons based on probabilistic expectations from reasons based on ex-post factual impact.
  10. **Wrongdoing vs. Blame:** Must distinguish the normative status of the act from the normative status of the agent (see Core Purpose).
  11. **I vs. We:** Must distinguish *what I have reason to do* from *what we have reason to do* (no collapsing individual obligation into collective ideal).
  12. **Prevention vs. Remediation:** Must distinguish reasons not to contribute from reasons to compensate after contributing.

  ***

  ### Analysis of Requirements & Incompatibilities

  **Genuine Requirements vs. Prejudices**
  *   **Genuine:** *Action-Guidance, Blame-Aptness, I vs. We, Wrongdoing vs. Blame.* These are structural necessities for a theory that aims to guide agents while preserving moral nuance. Without them, the theory either collapses into collective idealism or conflates luck with morality.
  *   **Prejudice:** *The "Causal Impotence" Assumption.* The idea that "if your act makes no difference, you have no duty" is a prejudice of causal individualism. It must be rejected to satisfy the **Tiny-Contribution** and **Constitutive** cases. An account that accepts this prejudice fails the specification.

  **Incompatibilities**
  You cannot satisfy **Individual Difference-Making** (the prejudice above) alongside **Tiny-Contribution** and **I vs. We**. If you insist an individual must make a causal difference to have a duty, you cannot explain the duty in tiny-contribution cases without collapsing the individual reason into a collective one ("we must stop" doesn't tell "me" what to do). One of these must go; given your prompt, *Individual Difference-Making* must be sacrificed.

  **The Eliminator**
  The single requirement that eliminates the most popular existing answers (specifically standard Act Consequentialism and Causal Individualism) is **Action-Guidance in Tiny-Contribution Cases** combined with the rejection of the **Causal Impotence Prejudice**. Most popular theories rely on actual causal impact to ground individual wrongness; forcing them to ground reasons in *expected* impact or *participation* breaks their standard formulations.

  ***

  ### Scorecard
  **Impossible Triad:** Causal Difference-Making + Individual Duty in Tiny-Cases + Distinct I/We Reasons. **Eliminator:** Action-Guidance without Causal Difference kills standard Act Consequentialism and Causal Individualism.
