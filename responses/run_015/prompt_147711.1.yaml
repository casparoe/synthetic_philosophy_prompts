prompt: |-
  You're a professional philosopher who's spent most of your career in the weeds of collective action problems — the inefficacy objection, expected-difference arguments, threshold effects, the whole mess. Like, the actual literature, not the TED-talk version. Please think carefully about this one and do a bit of brainstorming on the structure before you commit to anything; I'd much rather have you work out the shape of the thing first than hand me something smooth and useless.

  I sit on the grants committee of a small foundation that funds individual-behaviour-change campaigns — climate stuff mostly, some animal welfare. We recieve about a dozen proposals a quarter, we get 45 minutes per proposal, grants run £20k–£150k, and the rest of the committee is a GP, a retired accountant and a local councillor. Nobody has read any of this literature and they're not going to. We also publish a two-line rationale for every decision, so whatever we use has to be something I can defend in public.

  So: give me a decision procedure my committee can actually run, not an essay about why individual contributions matter. Specifically:

  - An ordered set of questions, with what counts as a *sufficient* answer to each, where the procedure stops with a no, and where it hands the decision to the full board because the issue is really a values call rather than a factual one.
  - It has to seperate three things that proposers constantly mush together: (a) the empirical claim that any one person's act makes no difference — no threshold crossed, or a replacement buyer/leakage effect, or the change is below the resolution of the supply chain; (b) the further step from "makes no difference" to "has no obligation", which is a normative move and not an empirical one; and (c) genuinely non-causal reasons people might still have — expressive or solidarity reasons, what kind of person you're being, fairness to other people who are doing their part, conditional obligations that only bite if enough others join in. I want the procedure to say explicitly which of these three our foundation is *allowed* to fund on, and to have a step whose job is to catch campaigns that dress up (c) in the language of (a) — pretend to be making an empirical impact claim when what they're really selling is meaning or belonging. Call that step whatever you like; I want it to be a real test, not a vibe check.
  - It needs a rule for pivotality arguments — the "tiny chance you're the one who tips it" move. When is that legitimate (i.e. there's an actual threshold mechanism you can point to and a probability you can defend) and when is it a shell game dressed up as expected-value reasoning? And what do we do when the 45 minutes run out and nobody can produce a number: what's the default, and who eats the cost of that default?
  - Each output should end in FUND / NO / BOARD CALL plus a publishable line, and you should flag honestly where the procedure will systematically misfire.

  Then run it on three real-ish proposals:

  1. A city-wide campaign to cut beef consumption. The supermarket chain wrote to us saying they only adjust orders in 500-case units, so individual people quitting just get absorbed unless they bunch up.
  2. A "delete your old emails and cloud photos" campaign to cut data-centre emissions. We funded something almost exactly like this two years ago and it's become a bit of an in-joke internally — if the procedure says stop, I want to see it say stop cleanly, and I want to know whether it stops because of the size of the effect, the absence of a threshold, or something else.
  3. A conditional pledge campaign: a heat-pump bulk-buy that only launches if 5,000 households pledge, with the discount kicking in at that number. Here pivotality looks real and the numbers look checkable — but I want you to work through what happens at 4,999 and at 5,001, because I don't think our committee has thought about that and I suspect it matters more than it looks.

  No reading lists, no citations, no "see so-and-so 1984" — I can't check them and neither can the rest of the committee, so please keep it self-contained.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in collective action problems (inefficacy, thresholds, expected difference, etc.).
      *   **Task:** Create a practical decision procedure for a grants committee (small foundation, climate/animal welfare focus).
      *   **Constraints:**
          *   Committee members: GP, accountant, councillor (no philosophy background).
          *   Time: 45 mins per proposal.
          *   Grants: £20k–£150k.
          *   Output: Two-line public rationale required.
          *   Structure: Ordered set of questions (stop/no-go), distinguish empirical vs. normative vs. expressive claims, handle pivotality, define defaults when data is missing.
          *   Specific Test Cases: Beef consumption (supply chain thresholds), Email deletion (negligible impact/previous failure), Heat-pump pledge (conditional threshold).
          *   Tone: Pragmatic, rigorous but accessible, no academic citations, self-contained.
          *   Requirement: Brainstorm structure first, then commit.

  2.  **Deconstruct the Philosophical Problems:**
      *   *The Inefficacy Objection:* Individual acts don't change outcomes (e.g., buying one chicken doesn't trigger an order for one more chicken).
      *   *The Normative Gap:* Even if ineffective, is there an obligation? (Complicity, integrity, fairness).
      *   *The Expressive/Solidarity Move:* Doing it for meaning, not impact.
      *   *Pivotality:* Expected utility = (Impact of Threshold) × (Probability of Being Pivotal). Often abused.
      *   *Foundation's Mission:* They fund "individual-behaviour-change campaigns." Implicitly, this suggests they care about *outcomes* (climate/animal welfare), not just *feelings*. If a campaign admits it won't change outcomes but will make people feel good, is that within scope? Usually, foundations want impact. I need to codify this scope limitation.

  3.  **Drafting the Decision Procedure (The "Filter"):**
      *   *Goal:* A flowchart in text form.
      *   *Step 1: Scope & Mission.* Are we funding impact or expression? Let's assume the foundation wants *causal impact* on the stated issues (climate/welfare). If a proposal admits it's purely expressive, it's a NO (or Board Call if mission is ambiguous).
      *   *Step 2: The Empirical Claim (Causal Mechanism).* How does behavior X lead to Outcome Y?
          *   Distinguish: Direct causal chain vs. Threshold vs. Signal.
          *   Test: Is there a mechanism where $N$ acts lead to $M$ reduction?
      *   *Step 3: The "Mush" Check (Separating a, b, c).*
          *   Proposers often say "It matters" (a) when they mean "It's fair" (c).
          *   Need a specific question: "If this campaign achieves 100% participation but produces zero measurable reduction in emissions/suffering due to supply chain rigidity, is the project successful?" If Yes -> It's expressive (c). If No -> It claims impact (a).
      *   *Step 4: Pivotality & Thresholds.*
          *   If they claim a threshold (e.g., policy change, bulk buy), is the threshold real?
          *   If they claim expected value (tiny chance of huge impact), do they have a probability estimate?
          *   Rule: If no probability can be given, treat probability as negligible for funding purposes (conservative principle).
      *   *Step 5: Cost-Effectiveness (The Accountant's Step).*
          *   Even if it works, is £100k the best way to do it?
      *   *Step 6: Board Call.* When is it a values question? When the impact is uncertain but the symbolic value is high, or when the "fairness" argument overrides the "impact" argument.

  4.  **Refining the Procedure for the Committee:**
      *   Needs to be jargon-free.
      *   Needs clear "Stop" points.
      *   Needs to handle the "Two-Line Rationale."
      *   *Crucial Decision:* What is the Foundation's stance on (c) Expressive/Solidarity?
          *   *Option A:* Fund only causal impact. (Strict)
          *   *Option B:* Fund expressive if it builds capacity for future impact. (Strategic)
          *   *Option C:* Fund expressive if it aligns with values, regardless of impact. (Mission-drift risk)
          *   *Decision:* Given the prompt ("inefficacy objection... inefficacy"), the user implies the foundation *should* care about impact. I will design the procedure to prioritize causal impact (a) but allow (c) only if explicitly framed as capacity building, not disguised as (a). I will make the "Mush Check" the gatekeeper.

  5.  **Addressing Specific Constraints:**
      *   *Pivotality:* Need a rule for "Unknown Probability." Default = 0 for calculation purposes. Who eats the cost? The applicant (proposal fails).
      *   *Misfires:* Acknowledge where this fails (e.g., long-term cultural shifts that *do* cause impact but aren't measurable now).
      *   *The Three Cases:*
          1.  *Beef:* Supply chain threshold issue. (a) vs (c).
          2.  *Emails:* Negligible impact, likely (c) disguised as (a). Previous failure data.
          3.  *Heat Pumps:* Real threshold. Pivotality math. 4,999 vs 5,001 problem (marginal vs. inframarginal).

  6.  **Developing the "Mush Check" (The Core Philosophical Contribution):**
      *   Call it the "Counterfactual Success Test."
      *   Question: "If the supply chain/policy does not react to this specific volume of change, does the campaign still claim success based on participant virtue or solidarity?"
      *   If Yes -> It's a values/expressive project.
      *   If No -> It's an impact project.
      *   Foundation Rule: We fund impact projects. Expressive projects go to Board (values call).

  7.  **Developing the Pivotality Rule:**
      *   "The Probability Burden."
      *   If the argument relies on being the tipping point, the applicant must provide a defensible probability distribution.
      *   If they say "we don't know," the Expected Value is treated as zero for the grant decision.
      *   Rationale: Public money requires defensible estimates, not hope.

  8.  **Running the Cases:**
      *   *Beef:* Supermarket says 500-case units. Individual acts < 500 cases.
          *   Mechanism: Bunching.
          *   Test: Can this campaign guarantee 500 cases? If not, causal chain broken.
          *   Outcome: Likely NO unless they prove bunching mechanism.
      *   *Emails:* Data center emissions.
          *   Mechanism: Marginal energy use.
          *   Test: Previous funding showed no measurable change.
          *   Outcome: NO (Empirical failure).
      *   *Heat Pumps:* 5,000 pledge threshold.
          *   Mechanism: Contractual threshold.
          *   Test: Pivotality.
          *   4,999: Project fails. 5,001: Project succeeds.
          *   Issue: Is the £150k grant the pivot? Or is it marketing?
          *   Outcome: FUND (if probability of hitting 5k is high enough), but watch the "all or nothing" risk.

  9.  **Refining the Output Structure:**
      *   **Part 1: Brainstorming/Structure:** Briefly explain the logic of the filter.
      *   **Part 2: The Procedure:** The actual step-by-step questions.
      *   **Part 3: The Three Cases:** Applying the procedure.
      *   **Part 4: Systemic Misfires:** Honest limitations.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too harsh on expressive acts?
      *   *Fix:* Add a "Board Call" path for high-solidarity/low-impact if the committee feels the mission allows for movement building. But keep the default as "Impact Required."
      *   *Critique:* Is the "Two-Line Rationale" feasible?
      *   *Fix:* Ensure each decision node generates a specific phrase that can be adapted.
      *   *Critique:* The Heat Pump case needs to address the "wasted effort" at 4,999.
      *   *Fix:* Include a "Risk of Total Loss" check in the procedure.

  11. **Final Polish:** Ensure tone is professional, direct, and respects the committee's time constraints. (No "As Kant said...", just "Ask this.")

  *(Self-Correction on the "Board Call" criteria)*: The prompt asks to separate factual from values calls.
  *   Factual: Will this work? (Empirical)
  *   Values: Do we care if it works, as long as it builds community? (Normative)
  *   The procedure should push "Values" questions to the Board. The Committee handles "Facts + Mission Alignment."

  Let's build the "Causal/Expressive Separation Test" carefully. This is the heart of the philosophical heavy lifting.

  *Step 1: Causal Mechanism.* (Is there a path?)
  *Step 2: The "Zero-Impact" Counterfactual.* (If impact is zero, is it still a win?)
  *Step 3: Pivotality Burden.* (If threshold, prove probability.)
  *Step 4: Cost per Unit.* (Accountant check.)

  Okay, ready to write.
answer: |-
  ### Part 1: Structural Brainstorming

  Here is the shape of the problem. Your committee is facing a **categorization error**. Proposers are submitting *expressive* projects (solidarity, virtue, meaning) wrapped in *instrumental* language (emissions saved, animals spared). Your foundation's mandate is presumably instrumental (change the world, not just change how people feel about the world).

  If you fund expressive projects pretending to be instrumental, you waste money on impact metrics that will never move. If you reject expressive projects outright, you might miss movement-building that pays off later. The procedure needs to force the proposer to declare which game they are playing, and then judge them by the rules of that game.

  **The Core Logic:**
  1.  **Causal Chain Check:** Is there a physical/mechanical link between the act and the outcome? (Stops the "magic thinking".)
  2.  **The "Zero-Impact" Counterfactual:** This is the separator for (a), (b), and (c). If the physical outcome doesn't change, does the proposer still claim success?
  3.  **The Probability Burden:** For threshold cases, the burden of proof for the *probability* of hitting the threshold lies with the applicant. No number = zero probability for funding calculations.
  4.  **The Board Escape Hatch:** If the impact is low but the solidarity value is high, that is a *values* decision (do we care about community building for its own sake?), not a *factual* one. That goes to the Board.

  **The Two-Line Constraint:**
  Every "No" or "Fund" decision must generate a rationale that doesn't rely on obscure philosophy. It must rely on *mechanism* and *evidence*.

  ---

  ### Part 2: The Decision Procedure (The "Impact/Expression Filter")

  **Instructions for Committee:** Run these steps in order. If a step fails, stop and issue the corresponding decision. Do not proceed to the next step unless the previous one is passed.

  #### Step 1: The Causal Mechanism Test
  **Question:** "Describe the specific physical or economic mechanism by which one additional participant reduces emissions or suffering. Does the supply chain or policy structure respond to marginal changes, or only to aggregate thresholds?"

  *   **Sufficient Answer:** A clear description of the transmission mechanism (e.g., "Utility companies buy energy on a marginal grid," or "Manufacturer orders batches of 1,000 units").
  *   **Insufficient Answer:** "Every bit helps," "It sends a signal," or "It's the right thing to do."
  *   **Decision:** If no mechanism is identified, **NO**.
      *   *Rationale:* "Proposal fails to identify a causal mechanism linking individual action to the stated environmental or welfare outcome."

  #### Step 2: The "Zero-Impact" Counterfactual (The Mush-Checker)
  **Question:** "If this campaign achieves its participation targets but, due to supply chain rigidity or leakage, produces **zero** measurable reduction in emissions or suffering, is the project considered a success?"

  *   **Answer A (No, it's a failure):** The project claims instrumental impact (Category A). Proceed to Step 3.
  *   **Answer B (Yes, it's still a success):** The project is primarily expressive/solidarity (Category C).
      *   **Decision:** **BOARD CALL**.
      *   *Rationale:* "Project prioritizes community solidarity over measurable impact; requires Board decision on mission scope."
      *   *Why:* Your committee (GP, Accountant, Councillor) is not equipped to decide if "meaning" is worth £100k. That is a values question for the trustees. Do not let the proposer sneak this past as impact.

  #### Step 3: The Pivotality & Probability Burden
  **Question:** "If the project relies on hitting a threshold (e.g., policy change, bulk buy discount), what is the estimated probability of this grant being the deciding factor in reaching that threshold?"

  *   **Rule:** The applicant must provide a defensible percentage or range based on prior data or pilot studies.
  *   **Default Rule:** If the applicant says "we don't know" or "it's too complex to model," the committee must treat the probability as **0%** for the purpose of this decision.
  *   **Cost of Default:** The applicant eats the cost (the grant is denied). Public funds cannot be allocated on hope alone.
  *   **Decision:** If probability is treated as 0% or is demonstrably negligible (e.g., <1% for a £150k grant), **NO**.
      *   *Rationale:* "Projected probability of triggering the threshold mechanism is insufficient to justify public expenditure."

  #### Step 4: The Marginal Cost-Effectiveness Check
  **Question:** "Given the probability of success and the magnitude of the impact, what is the cost per tonne of CO2 (or per animal spared) compared to standard benchmarks?"

  *   **Sufficient Answer:** A number that falls within the foundation's acceptable range (e.g., <£50/tonne).
  *   **Decision:** If cost is excessive, **NO**.
      *   *Rationale:* "Cost per unit of impact exceeds foundation efficiency benchmarks."

  #### Step 5: Final Recommendation
  *   **FUND:** Passed all steps.
  *   **NO:** Failed Steps 1, 3, or 4.
  *   **BOARD CALL:** Passed Step 1, triggered Step 2 (Answer B).

  ---

  ### Part 3: Systemic Misfires (Honesty Check)

  Before you adopt this, acknowledge where it will break:
  1.  **Cultural Lag:** It will reject campaigns that shift culture *now* to enable impact *later*. (e.g., normalizing veganism before the supply chain catches up). This is a known blind spot of instrumentalism.
  2.  **Data Poverty:** Small NGOs often cannot afford the research to generate the probabilities required in Step 3. You may end up funding only large, established players who have the data teams.
  3.  **The "Signal" Reality:** Sometimes "sending a signal" *is* a causal mechanism (e.g., politicians react to perceived shifts in public mood). Step 1 must allow "Political Signal" as a mechanism *if* there is evidence politicians are watching that specific metric.

  ---

  ### Part 4: Running the Proposals

  Here is how the procedure handles your three cases.

  #### Case 1: City-Wide Beef Reduction (Supply Chain Thresholds)
  *   **Step 1 (Mechanism):** Proposer claims individual reduction cuts emissions. Supermarket letter says orders adjust in 500-case units.
      *   *Analysis:* The mechanism is blocked by the 500-case threshold. Individual acts are absorbed.
  *   **Step 2 (Zero-Impact Counterfactual):** Ask: "If we get 400 cases worth of reduction, does the supermarket order less?"
      *   *Proposer Answer:* "No, but it builds momentum."
      *   *Analysis:* This triggers **Step 2 (Answer B)**. They are admitting the impact is not immediate/causal but expressive/momentum-based.
  *   **Decision:** **BOARD CALL**.
  *   **Publishable Rationale:** "Project relies on long-term cultural momentum rather than immediate measurable supply-chain reduction; requires Board review of mission scope regarding movement-building."
  *   **Committee Note:** If the proposer *could* prove they would hit 500 cases, it would pass Step 1. Since they can't, they are selling solidarity (c), not impact (a).

  #### Case 2: Delete Old Emails (Data Centre Emissions)
  *   **Step 1 (Mechanism):** Claim: Deleting data reduces server load/energy.
      *   *Analysis:* Empirical literature suggests marginal energy use of storage is near-zero; data centres run on baseline capacity.
  *   **Step 2 (Zero-Impact Counterfactual):** Ask: "If energy use doesn't drop, is it a success?"
      *   *Proposer Answer:* "It raises awareness."
      *   *Analysis:* Again, **Step 2 (Answer B)**. But wait, check history.
  *   **Step 3 (History Check - Committee Internal):** We funded this 2 years ago. Did it work?
      *   *Fact:* No measurable impact.
  *   **Decision:** **NO** (Fail Step 1 on empirical grounds of negligible marginal impact).
  *   **Publishable Rationale:** "Empirical evidence indicates individual data deletion does not reduce marginal energy consumption in modern cloud infrastructure."
  *   **Why not Board Call?** Because the empirical claim (a) is demonstrably false. It's not a values question; it's a physics question.

  #### Case 3: Heat-Pump Bulk Buy (Conditional Pledge)
  *   **Step 1 (Mechanism):** Claim: 5,000 pledges trigger manufacturer discount/installation capacity.
      *   *Analysis:* Mechanism is contractual and real. Pass.
  *   **Step 2 (Zero-Impact Counterfactual):** Ask: "If we get 4,999 pledges, do the heat pumps get installed?"
      *   *Proposer Answer:* "No."
      *   *Analysis:* This is an instrumental claim (Category A). Proceed.
  *   **Step 3 (Pivotality & Probability):** Ask: "What is the probability this £100k grant moves us from 4,900 to 5,000?"
      *   *Proposer Answer:* "We are currently at 4,200. We need 800 more. Your grant funds marketing to reach them."
      *   *Committee Math:* If they fail, the money is spent and *zero* heat pumps are installed (the threshold effect). This is high risk.
      *   *Probability:* Can they defend a >50% chance of hitting the 800? If they say "we hope," treat as 0. If they have a conversion rate from past marketing, use that.
  *   **Decision:** **FUND** (Conditional on Probability).
      *   *Assumption:* They provide data showing 800 leads is achievable within budget.
  *   **Publishable Rationale:** "Project demonstrates a clear contractual threshold mechanism with defensible probability of achieving the required participation volume."
  *   **The 4,999 vs 5,001 Problem:**
      *   The committee must acknowledge that at 4,999, the grant money is "wasted" in terms of direct output.
      *   *Mitigation:* In the grant contract, stipulate that if the threshold is missed, funds must be returned or redirected to a fallback mechanism (e.g., subsidizing the first 100 anyway). If no fallback, the risk is higher.
      *   *Philosophical Note:* This is the only case where "Pivotality" is legitimate because the threshold is *contractual*, not statistical.

  ### Summary of Decisions

  | Proposal | Decision | Rationale (Public) | Philosophical Category |
  | :--- | :--- | :--- | :--- |
  | **1. Beef** | **BOARD CALL** | "Project prioritizes cultural momentum over immediate supply-chain reduction." | Expressive (c) disguised as Impact (a). |
  | **2. Emails** | **NO** | "Empirical evidence indicates individual data deletion does not reduce marginal energy consumption." | False Empirical Claim (a). |
  | **3. Heat Pumps** | **FUND** | "Project demonstrates a clear contractual threshold mechanism with defensible probability of success." | Legitimate Pivotality (Threshold). |

  ### Final Advice for the Chair
  When the GP or Accountant asks, "But isn't doing *something* better than nothing?", your response is: "Not if we are paying for *results*. If they want to pay for *feelings*, the Board needs to decide if that's our job. This procedure forces them to tell us which one they are selling."
