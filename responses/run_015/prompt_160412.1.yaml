      *   **Explain Why:** Distinguish Epistemic Access from Ontological Grounding.
      *   **Address the Neural Analogy:** Explain why it disanalogous (Structural vs. Intrinsic).
      *   **Address the Quine Worry:** Acknowledge the cost (accepting brute facts) but distinguish from meaning indeterminacy (which relies on behaviorism).
      *   **Address the Inversion Case:** Show how rejecting (5) actually *saves* the Inversion Case.
      *   **Alternative Cut:** Step (3). Distinguish Phenomenal Judgment from Phenomenal Experience.
      *   **Recommendation:** Reject (5). Embrace the "Brute Phenomenal Fact." This is the standard Chalmers/Non-Reductive move.

  7.  **Self-Correction/Nuance Check:**
      *   Wait, if I reject (5), do I save the Drift Case?
      *   The Drift Case is usually used *by* Functionalists (Dennett) to kill Qualia. Dennett says: "If you can't tell, it didn't happen."
      *   The User is *Anti-Functionalist*. So they must say: "It *did* happen, even if she can't tell."
      *   But wait, if the compensator rewrites *everything downstream*, does the quale actually rotate?
      *   If Qualia are intrinsic, and the physical base changes (rotation), the quale changes. The compensator only fixes the *functional output*.
      *   So, Sophie's experience *does* change, but her *belief* about her experience stays the same.
      *   This creates a disconnect between Experience and Judgment. This is the "Phenomenal Judgment vs. Phenomenal Experience" gap.
      *   So, Step (3) is also vulnerable. "Nothing settles it *for Sophie*." Well, her *experience* settles it for her, just not her *judgment*.
      *   Actually, Step (5) is the stronger rejection point. Step (3) says "introspective judgement." That is functional. The *experience* is not a judgement.
      *   So, (3) is true regarding *reports/judgments*, but false if it implies nothing settles it *phenomenally*.
      *   But (5) is the logical killer. "No evidence... therefore no fact."
      *   Okay, I will advise rejecting (5) primarily, but clarifying (3) to ensure the distinction between Experience and Judgment is clear.

  8.  **Final Plan:**
      *   Pinpoint Step (5) as the Verificationist assumption.
