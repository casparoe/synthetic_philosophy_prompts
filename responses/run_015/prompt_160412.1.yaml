      *   **Option B: Reject (5) - Deny Verificationism.**
          *   *Argument:* Just because something is epistemically inaccessible (even in principle) doesn't mean it's ontologically indeterminate.
          *   *Cost:* You have to accept "Brute Phenomenal Facts." Facts that make no difference to behavior, reports, or functional structure. This invites the charge of "epiphenomenalism" or "magic." It also makes the Inverted Spectrum case robust but scientifically idle.
