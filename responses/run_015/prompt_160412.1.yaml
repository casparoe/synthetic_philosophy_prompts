      *   *Addressing the Inversion Case:* If you reject (5), you save the Inversion Case. Inverted qualia are undetectable but real.
      *   *Addressing the Eliminativist Conclusion:* Rejecting (5) blocks the move from "undetectable" to "non-existent."

  5.  **Refining the Argument (The "Phenomenal Concept" Strategy):**
      *   There's a nuance in (3). "Nothing settles it *for Sophie*."
      *   Phenomenal Concept Strategy (Loar, Papineau, etc.): Sophie possesses the quale directly. She doesn't need a functional report to have the fact of the matter obtain. The fact obtains *in virtue of the experience existing*.
      *   The error in the argument is assuming that for a fact to obtain, it must be *settled* by evidence accessible within the system.
