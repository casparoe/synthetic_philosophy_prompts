answer: |-
  Here are eight questions designed to press the joints of her argument, calibrated for an audience that knows the clinical reality but wants to avoid the standard bioethics script. Each includes the anticipated move she'll make and a follow-up designed to corner that specific defense.

  ### 1. The Permanence "Fudge"
  **Question:** You argue that the "permanent" cessation of circulation in DCD isn't a biological fact but a normative decision—we stop trying to restart the heart, so we call it permanent. If that's true, isn't the distinction between *permanent* and *irreversible* just a change of subject? You're admitting the biology doesn't support the boundary, but instead of fixing the biology, you're just relabeling the decision.

  *   **Anticipated Move:** She will argue that death has always been a threshold we set, not a fact we discover. She'll say pretending it's purely biological is the real dishonesty.
  *   **Follow-up:** "If it's just a threshold we set, why does the specific setting matter? If we can move the line for organs based on consent, what stops us from moving it for other end-of-life decisions? You're asking us to be honest about the normativity, but doesn't that honesty remove the guardrail?"

  ### 2. Somatic Integration vs. Brain Death
  **Question:** Let's look at the neurological track. You justify it by the irreversible loss of consciousness. But you justify the circulatory track by the loss of organismic integration. The problem is, we see brain-dead patients on ventilation who heal wounds, regulate temperature, and even gestate fetuses. That looks like integration. If the body is integrating, how can you claim it's dead on the circulatory metric while alive on the neurological one without the two tracks contradicting each other?

  *   **Anticipated Move:** She will claim that integration isn't all-or-nothing, or that ventilator-supported integration doesn't count as "spontaneous" organismic function.
  *   **Follow-up:** "But the physiology is the same whether the air is pushed by a machine or a diaphragm. If the cells are talking to each other and maintaining homeostasis, the organism is working. Are you saying death is defined by *how* the integration is powered, rather than *that* it's happening? Because to the nurse managing that body, it looks like care for a living patient."

  ### 3. Authorized-Donor vs. Assisted Dying (Moral Distinction)
  **Question:** You want to replace the Dead Donor Rule with an Authorized-Donor Rule, allowing procurement before death based on consent. To my listeners, that sounds like we are killing the patient to get the organs. How is this morally distinct from voluntary assisted dying? In both cases, we are authorizing a medical act that ends life.

  *   **Anticipated Move:** She will reach for the distinction between *killing* and *letting die*. She'll argue that procurement is the cause of death, but the authorization makes it permissible, similar to withdrawing life support.
  *   **Follow-up:** "Withdrawing support lets the underlying pathology kill the patient. Procurement *is* the pathology. If the moral work is done by consent, why do we need the medical distinction at all? If I consent to a lethal injection for organs, isn't that just euthanasia with a transplant team in the room?"

  ### 4. Authorized-Donor vs. Assisted Dying (Legal Category)
  **Question:** Following on that—if this is essentially a form of assisted dying, why do we need a new legal category? Why not just ride on the frameworks we already have for Medical Aid in Dying? If the moral justification is autonomy and the outcome is death, why the special exception for organs?

  *   **Anticipated Move:** She will argue that the slippery-slope worry here is the same one used against voluntary assisted dying, and that we've already accepted that autonomy can override the harm of death in specific contexts.
  *   **Follow-up:** "But the context *is* different. In assisted dying, the benefit is to the patient—relief of suffering. In donation, the benefit is to a third party. If we allow autonomy to justify harming the patient for someone else's benefit, haven't we crossed a line that even assisted dying frameworks refuse to cross?"

  ### 5. Consent and Moral Limits
  **Question:** You're placing a lot of weight on prospective authorization. But we don't let consent do this kind of moral work elsewhere. I can't consent to have a healthy limb amputated, and I can't consent to be harmed in a medical experiment if the risk is too high. Why are vital organs the one exception where consent allows us to bypass the prohibition on causing death?

  *   **Anticipated Move:** She will argue that the end-of-life context changes the moral calculus—that the patient is already dying, so the harm is mitigated.
  *   **Follow-up:** "But if they're already dying, the Dead Donor Rule protects us from *accelerating* that death. If consent removes that protection, aren't we saying that the value of the organs outweighs the value of not being the one who killed the donor? How do you square that with the 'do no harm' principle my nurses are holding?"

  ### 6. The "Threshold" Defense
  **Question:** You've said that death is a threshold we set rather than a fact we discover. If that's the case, isn't the Dead Donor Rule just a policy choice, not an ethical imperative? If we can set the threshold for death, why can't we set the threshold for 'acceptable procurement' without needing the label of death at all?

  *   **Anticipated Move:** She will say the label matters for public trust, but that the ethical core is the authorization, not the biology.
  *   **Follow-up:** "If the label is just for trust, aren't you essentially advocating for a noble lie in reverse? You're asking us to admit the biology doesn't match the rule, but keep using the rule's moral authority. If the biology doesn't do the work, why keep the terminology that confuses the ICU team?"

  ### 7. Falsification Condition
  **Question:** Pluralism is flexible—it can accommodate a lot of biological variation by shifting which track matters. So, what would count as evidence against your view? Is there a biological finding or a clinical scenario that would force you to abandon the pluralist package and go back to a single standard?

  *   **Anticipated Move:** She might struggle here, as philosophical frameworks are hard to falsify. She may point to a scenario where the two tracks diverge so wildly it becomes untenable.
  *   **Follow-up:** "If the answer is 'nothing biological,' then your view isn't about death at all, it's about resource allocation. If no biological fact can change your mind, aren't you admitting that the determination of death is purely instrumental?"

  ### 8. Closing: The Critic's Blind Spot
  **Question:** To close: You've been arguing this for years. What is the one thing your critics always get wrong about your position? What's the assumption they make that makes them think you're advocating for something you're not?

  *   **Anticipated Move:** She will likely say critics assume she wants to harm patients or lower standards, when she actually wants to increase honesty and respect autonomy.
  *   **Follow-up:** "If the goal is honesty, and the result is that families believe we are killing their loved ones for parts, have we achieved honesty? Or have we just shifted the confusion from the biology to the ethics?"
