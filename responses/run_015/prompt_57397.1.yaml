prompt: |-
  I direct the Office of Performance and Innovation for a city of roughly 340,000. My staff is five people, none of them economists; our one analyst is a part-time data person who mostly maintains dashboards. In the spring our city manager attended a conference session on governance by prediction markets and came back convinced we should pilot something he is calling futarchy on a handful of decisions this fiscal year. The version of the idea that persuaded him was roughly the one its originator popularized: let elected officials settle what we are trying to achieve, then let speculators bet on which of the candidate policies will achieve more of it, and adopt whichever branch the market prices higher. He has asked me to produce a written procedure that any program manager in any department can run on an incoming proposal before we commit public money to opening a market. He does not want another essay on whether prediction markets are wise in general; he wants steps, in order, with a stopping condition at each one.

  The constraints are these. The pilot has $60,000 in total, most of which is earmarked for seeding liquidity, because the platform vendor assures us the contracts themselves are trivial to write. Proposals arrive continuously — we field fifteen to twenty serious ones a year and expect four or five to reach the pilot — and each one gets a single afternoon of analysis before our monthly review board, at which the city attorney and one council member must sign off before anything goes live. The decisions at issue range from about $1 million to $15 million and affect anywhere from a few hundred households to most of the city; a couple of them are effectively irreversible for a decade. One department head insists any market must be written on a single dollar figure, and another insists that a dollar figure is exactly the wrong thing to write it on and wants a composite index instead. Please write the procedure so that this disagreement is resolved by the procedure rather than by whoever talks longest.

  Specifically, I need it to tell a non-specialist, step by step: what makes a decision eligible at all, and whether repeatability matters; how to tell a measurable outcome apart from a value, and who is permitted to choose the outcome the contract pays on; how to condition a contract on the policy actually being adopted, and who gets to declare that the condition was met; how thick a market has to be before its price is evidence rather than noise, and what to do when the honest answer is that we cannot get a number; how we would ever know the price was right, given that we only observe the branch we took and the losing branch is never resolved; how we keep a trader from buying the outcome he wants, in the market, in the world, or both, especially when the best-informed potential traders are also interested parties; what the losing side of the bet is entitled to do afterwards; and at which step the procedure must stop and hand the question back to elected officials because it is about what we should want rather than what will happen. Mark clearly which steps are genuinely mechanical and which are judgment calls wearing a procedural costume.

  Then run the procedure on three proposals we actually have on the table. First, whether to convert four low-ridership bus routes into a higher-frequency network, where the transit department wants the contract written on total boardings and the equity office wants it written on total rider-minutes, and where implementation would be partial and phased. Second, whether to sign a ten-year exclusive contract with one waste hauler or keep the collection zones out to competitive bid, where the parties with the best information about the answer are the bidders themselves. Third — and this is the city manager's flagship, the one he has already mentioned to the council — whether to open an overnight shelter at a specific vacant site, with the market written on assessed property values within a half mile over eighteen months. If the procedure kills the flagship, say so plainly and explain what specifically fails; if it lets all three through, tell me it is not a procedure but a rubber stamp. Finally, give me the limits: what classes of decision this will systematically get wrong, what a bad outcome would look like, and what we should be watching in month six that would tell us the pilot is failing before the failure is expensive.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Director, Office of Performance and Innovation (City of ~340k).
      *   **Staff:** 5 people, no economists, 1 part-time data analyst (dashboards).
      *   **Task:** Create a written procedure for piloting futarchy (governance by prediction markets) on city decisions.
      *   **Constraints:**
          *   Budget: $60k total (mostly liquidity seeding).
          *   Volume: 15-20 proposals/year, 4-5 expected for pilot.
          *   Timeline: Single afternoon analysis per proposal before monthly board review.
          *   Approval: City Attorney + 1 Council Member required before live.
          *   Decision Scope: $1M - $15M, impact ranges from hundreds to most of city, some irreversible for a decade.
          *   Conflict: One dept head wants single dollar figure outcome; another wants composite index. Procedure must resolve this.
          *   Tone/Format: Step-by-step, stopping conditions, distinguish mechanical vs. judgment calls, no general essays on wisdom of futarchy.
      *   **Specific Requirements:**
          *   Eligibility/Repeatability.
          *   Outcome vs. Value (who chooses outcome).
          *   Conditioning on policy adoption (who declares met).
          *   Market thickness/liquidity (when is price evidence vs. noise).
          *   Counterfactual problem (how to know price was right if only one branch taken).
          *   Manipulation (traders buying outcome in market vs. world).
          *   Losing side rights.
          *   When to hand back to elected officials (values vs. facts).
          *   Apply procedure to 3 specific proposals (Bus, Waste, Shelter).
          *   Define limits/failure modes.

  2.  **Deconstruct the Challenge (Futarchy in Government):**

      *   *The Core Problem:* Futarchy relies on efficient markets pricing counterfactuals. Government decisions are often unique, illiquid, subject to manipulation by stakeholders, and involve values (what *should* we maximize?) not just facts (what *will* happen?).
      *   *The Constraint:* The City Manager is sold on the idea. The Director needs a procedure that protects the city from disaster while satisfying the Manager's directive. It needs to be rigorous enough to filter out bad candidates but practical enough for a small staff.
      *   *The Conflict:* Dollar figure vs. Composite Index. The procedure needs a tie-breaker mechanism based on measurability and manipulability, not seniority.

  3.  **Drafting the Procedure (Step-by-Step):**

      *   *Goal:* A funnel. Start broad, narrow down quickly.
      *   *Step 1: Eligibility (The "Can We?" Check).* Needs to address reversibility and timeline. If it's irreversible for 10 years, a prediction market might be too risky or too slow.
      *   *Step 2: Metric Definition (The "What?" Check).* Resolves the Dollar vs. Index fight. Rule: Must be objectively verifiable by a third party (Auditor/State data) within the pilot timeframe. Composite indices are usually gamed or laggy. Single dollars are easier but might miss equity. *Decision:* Prefer single verifiable metrics. If composite, must be pre-published formula.
      *   *Step 3: Value vs. Fact (The "Should?" Check).* This is crucial. Elected officials set the goal (Value). Market predicts the path (Fact). If the metric *is* the value (e.g., "Property Values"), that's a policy choice, not a market input.
      *   *Step 4: Liquidity & Manipulation (The "Will it Work?" Check).* With $60k total budget, liquidity is tight. Who trades? If stakeholders (bidders) are the only informed traders, the market is rigged.
      *   *Step 5: Counterfactual Resolution (The "How do we know?" Check).* Futarchy fails if we can't measure the losing branch. We need a way to estimate the counterfactual (e.g., control groups, synthetic controls) or admit we can't.
      *   *Step 6: Approval & Handoff.* Explicitly state where the Council/Manager retains authority.

      *   *Refining the "Mechanical vs. Judgment" requirement:* I need to label these clearly.

  4.  **Applying the Procedure to the Three Proposals:**

      *   *Proposal 1: Bus Routes (Boardings vs. Rider-Minutes).*
          *   Eligibility: Reversible? Yes, routes can change back.
          *   Metric: Boardings (easy) vs. Rider-Minutes (harder data). Both verifiable.
          *   Conflict: Equity office vs. Transit. Procedure needs to pick one. Rider-minutes better reflects service quality, but boardings are harder to game. Let's look at the "Value vs. Fact" step. Is the goal efficiency or equity? Council needs to decide the *metric*, market decides the *route*.
          *   Liquidity: Who trades? Transit enthusiasts? Unions?
          *   Verdict: Passable with conditions (Council picks metric).

      *   *Proposal 2: Waste Hauler (Exclusive vs. Competitive).*
          *   Eligibility: 10-year contract. Irreversible-ish.
          *   Manipulation: *Major Red Flag.* Bidders are the best informed. They can bet on the market *and* bid on the contract. Insider trading/Market manipulation risk is extreme.
          *   Verdict: Kill. (Stakeholder trading conflict).

      *   *Proposal 3: Overnight Shelter (Property Values).*
          *   Eligibility: Irreversible (shelter opened).
          *   Metric: Property Values within 0.5 miles.
          *   Value vs. Fact: Is "Property Value" the city's goal? Or "Homelessness Reduction"? Using property values as the metric aligns the market with NIMBY interests, not necessarily social welfare. This is a *Value* judgment disguised as a metric.
          *   Counterfactual: How do we know property values if we *don't* open the shelter? Hard to isolate.
          *   Liquidity: Real estate developers might trade to manipulate values.
          *   Verdict: Kill. (Metric captures values, not just facts; high manipulation risk).

  5.  **Addressing Specific Technical Questions in the Procedure:**

      *   *Repeatability:* Must be reversible within 2 years or have a clear stop-loss.
      *   *Outcome vs. Value:* Council sets the "Utility Function" (Metric). Market predicts the "Probability" of hitting it.
      *   *Conditioning:* "Decision Contracts." Policy must be implemented if market says yes. Who declares? City Auditor (independent).
      *   *Thickness:* Minimum number of unique traders + minimum volume. If not met, no decision.
      *   *Counterfactual:* Acknowledge the "Unobserved Branch" problem. Use statistical estimation post-hoc for evaluation, but market price drives decision.
      *   *Manipulation:* Ban interested parties from trading. (Hard to enforce but necessary).
      *   *Losing Side:* Entitled to a post-mortem report, not a veto.
      *   *Values vs. Facts:* If the metric itself is debated (e.g., Property Value vs. Health), that's a Council decision, not a market one.

  6.  **Refining the Output:**

      *   *Tone:* Professional, bureaucratic but sharp, protective of the city.
      *   *Structure:*
          1.  Procedure Document (The "Protocol").
          2.  Application to Proposals (The "Test").
          3.  Limits & Failure Modes (The "Warning Label").
      *   *Constraint Check:* Did I resolve the Dollar vs. Index fight? Yes, by prioritizing verifiability and anti-gaming over preference. Did I mark mechanical vs. judgment? Yes.

  7.  **Self-Correction/Critique during Drafting:**

      *   *Critique:* Is $60k enough for liquidity?
      *   *Adjustment:* The procedure must acknowledge that if liquidity doesn't materialize, the market price is noise. The procedure must kill the proposal if seeding doesn't attract external capital.
      *   *Critique:* The Shelter proposal is the Manager's flagship. Killing it needs strong justification based *strictly* on the procedure.
      *   *Adjustment:* Focus on the "Value vs. Fact" distinction. Property values are a proxy for welfare, not welfare itself. Using it as the payout condition embeds a value judgment into the market mechanism, violating the "Council sets values, Market sets facts" rule.
      *   *Critique:* Waste Hauler.
      *   *Adjustment:* Focus on the "Interested Party Trading" constraint. If the bidders are the only ones who know the true costs, and they are allowed to trade, the market is corrupted. If they are banned, the market has no information. Catch-22.
      *   *Critique:* Bus Routes.
      *   *Adjustment:* This is the only viable one. But the metric dispute (Boardings vs. Rider-Minutes) must be resolved *before* the market opens. The procedure must force the Council to pick the metric.

  8.  **Final Polish:** Ensure the distinction between "Mechanical" (Yes/No based on data) and "Judgment" (Requires human interpretation) is clear. Ensure the "Stopping Condition" is explicit at every step.

      *(Self-Correction on the Dollar vs. Index fight)*: The prompt asks to resolve this by procedure.
      *   *Rule:* If the metric cannot be audited by an external third party within 24 months of decision, it is ineligible. Composite indices usually fail this (too many inputs, laggy). Single dollar figures usually pass. *However*, if the single dollar figure ignores statutory equity requirements, it fails.
      *   *Resolution:* The procedure will mandate that the metric must be the one currently used in the City's Adopted Budget Performance Measures *unless* the Council votes to change it. This bypasses the Dept Head argument by deferring to existing adopted policy.

      *(Wait, better resolution)*: The prompt says "resolve by procedure rather than whoever talks longest."
      *   *Rule:* Hierarchy of Metrics. 1. Statutory Requirement. 2. Existing Budget Performance Measure. 3. Single Verifiable Figure. 4. Composite Index (requires 2/3 Board approval). This creates a mechanical hierarchy.

      *(Refining the "Counterfactual" issue)*: Futarchy theoretically doesn't need to resolve the losing branch to make the decision, but to *evaluate* the market's accuracy later, we do. The procedure needs to address how we evaluate the pilot's success. We need a "Shadow Measurement" plan.

      *(Refining Manipulation)*: "Best-informed potential traders are also interested parties." The procedure must ban them. If that leaves the market empty, the proposal dies.

      *(Final check on Shelter)*: If I kill the flagship, I need to be sure. Property values are influenced by macro factors. Isolating the shelter effect is statistically noisy. Plus, it incentivizes traders to sabotage the shelter to win bets. High manipulation risk. It fails the "Interested Party" and "Metric Validity" tests.

      *(Final check on Waste)*: Bidders are interested parties. If they trade, it's insider trading. If they don't, market is ignorant. Fails "Information Availability" test.

      *(Final check on Bus)*: Viable. Metric dispute resolved by hierarchy.

      *Let's write it.*
answer: |-
  # CITY OFFICE OF PERFORMANCE AND INNOVATION
  ## PROTOCOL 24-F: FUTARCHY PILOT ELIGIBILITY AND EXECUTION
  **Effective Date:** Immediate
  **Authority:** City Manager Directive [Redacted]
  **Budget Cap:** $60,000 (Fiscal Year)
  **Review Board:** City Attorney, One Council Member, Director of Performance & Innovation

  ---

  ### PURPOSE
  To establish a mechanical filtering process for decisions proposed for governance by prediction market ("Futarchy"). This protocol prioritizes the integrity of the market price over the preference of the proponent. If a proposal fails a step, it returns to standard decision-making channels.

  ### DEFINITIONS
  *   **Utility Metric:** The specific number the market pays out on.
  *   **Interested Party:** Any individual or entity whose financial or operational standing changes directly based on the policy outcome.
  *   **Mechanical Step:** A pass/fail condition based on objective data or existing code.
  *   **Judgment Step:** A condition requiring interpretation by the Review Board.

  ---

  ### STEP 1: REVERSIBILITY AND HORIZON
  **Type:** Mechanical
  **Question:** Can the policy be reversed or materially altered within 24 months if the market signal proves false or external conditions shift?
  **Data Source:** Program Manager declaration + City Attorney review of contract terms.
  **Stopping Condition:** If the policy creates a binding obligation >24 months or physical infrastructure that cannot be repurposed without >20% capital loss, **STOP.** Return to standard procurement/legislative process.
  **Rationale:** Prediction markets require feedback loops. Decisions irreversible for a decade prevent the city from learning from the market's error.

  ### STEP 2: METRIC HIERARCHY (Resolving Dollar vs. Index)
  **Type:** Mechanical
  **Question:** What is the Utility Metric?
  **Procedure:** Proponents must select the metric using the following hierarchy. Higher tiers override lower tiers.
  1.  **Statutory:** Is the outcome mandated by state/federal law? (e.g., Compliance rate).
  2.  **Adopted Budget:** Is the outcome already a Performance Measure in the current Adopted City Budget?
  3.  **Single Verifiable Figure:** Can the number be audited by an external third party within 18 months? (e.g., Total Boardings, Tons Collected).
  4.  **Composite Index:** (Requires 2/3 Review Board approval). Only permitted if Tiers 1-3 are demonstrably incapable of capturing the policy intent.
  **Stopping Condition:** If the proponent insists on a Tier 4 metric without Board approval, or a Tier 3 metric that cannot be externally audited, **STOP.**
  **Rationale:** Resolves the "Dollar vs. Index" conflict by deferring to existing city commitments and auditability. Composite indices are prone to lag and gaming; single figures are preferred for market settlement.

  ### STEP 3: VALUE VS. FACT SEPARATION
  **Type:** Judgment
  **Question:** Does the Utility Metric represent a *value goal* (what we want) or a *factual outcome* (what will happen)?
  **Procedure:** The Review Board must certify that the metric is not a proxy for a political value judgment that requires democratic consent.
  **Stopping Condition:** If the metric itself is the subject of political debate (e.g., "Property Values" vs. "Human Welfare"), **STOP.** The Council must vote on the metric *before* the market opens. The market predicts the *level* of the metric, it does not choose *which* metric defines success.
  **Rationale:** Markets optimize for what they are told to optimize. If the metric is controversial, optimizing it via market bypasses elected oversight.

  ### STEP 4: INFORMATION ASYMMETRY AND MANIPULATION
  **Type:** Mechanical
  **Question:** Who holds the best information regarding the outcome?
  **Procedure:** List the top 5 entities most likely to know the true outcome.
  **Stopping Condition:** If >50% of the informed entities are **Interested Parties** (defined above) who stand to profit from the policy adoption *outside* the market (e.g., bidders on a contract, developers near a site), **STOP.**
  **Mitigation:** Interested Parties are banned from trading. If banning them leaves fewer than 10 eligible, informed potential traders, **STOP.**
  **Rationale:** If the only people who know the truth can profit from the policy in the real world, they will manipulate the market to force the policy through (or kill it) to realize their external profit.

  ### STEP 5: LIQUIDITY THRESHOLD
  **Type:** Mechanical
  **Question:** Will the market produce a price signal distinct from noise?
  **Procedure:** The vendor must seed the market with up to $10,000 per proposal.
  **Stopping Condition:** If external capital (non-city funds) does not match city seeding 1:1 within 72 hours of opening, **STOP.** The market price is deemed noise.
  **Rationale:** A market dominated by city seed money reflects the vendor's algorithm, not public intelligence.

  ### STEP 6: COUNTERFACTUAL MEASUREMENT
  **Type:** Judgment
  **Question:** How will we evaluate the accuracy of the market price post-decision?
  **Procedure:** Program Manager must submit a "Shadow Measurement Plan" for the *unchosen* policy branch. (e.g., If we choose Route A, how do we estimate what Route B would have achieved?)
  **Stopping Condition:** If no statistically valid method exists to estimate the counterfactual (e.g., no control group, total city saturation), **STOP.**
  **Rationale:** We cannot validate the pilot's success if we cannot measure the error rate of the market predictions.

  ### STEP 7: FINAL AUTHORIZATION
  **Type:** Judgment
  **Question:** Has the City Council explicitly authorized this specific metric as the goal of the policy?
  **Procedure:** Council Member on Review Board signs a "Metric Mandate."
  **Stopping Condition:** If the Council Member refuses to sign, **STOP.** Hand question back to full Council.
  **Rationale:** Elected officials settle *what* to maximize; the market settles *how* to get there.

  ---

  # APPLICATION OF PROTOCOL 24-F TO PENDING PROPOSALS

  ### PROPOSAL 1: Bus Route Conversion (Low Ridership -> High Frequency)
  *   **Step 1 (Reversibility):** **PASS.** Routes can be adjusted quarterly.
  *   **Step 2 (Metric):** **PASS (With Condition).** Transit Dept wants "Boardings" (Tier 3). Equity Office wants "Rider-Minutes" (Tier 4 Composite). Under Protocol, Tier 3 overrides Tier 4 unless Board approves. *Action:* Market must be written on **Total Boardings**. Equity concerns must be addressed via a separate constraint (e.g., "Must not reduce service in Census Tract X"), not the market metric.
  *   **Step 3 (Value vs. Fact):** **PASS.** Boardings are a factual output.
  *   **Step 4 (Manipulation):** **PASS.** Informed traders are transit planners and regular riders. Neither group has significant financial interest in the route structure outside the market.
  *   **Step 5 (Liquidity):** **PENDING.** Requires vendor seeding.
  *   **Step 6 (Counterfactual):** **PASS.** Synthetic control methods can estimate ridership on unchanged routes.
  *   **Step 7 (Authorization):** **PENDING.** Council must confirm "Maximize Boardings" is the goal.
  *   **VERDICT:** **ELIGIBLE FOR PILOT.**
      *   *Note:* The procedure resolved the metric fight mechanically. Equity Office loses the metric battle but retains veto power at Step 7 if "Boardings" violates equity policy.

  ### PROPOSAL 2: Waste Hauler Contract (Exclusive vs. Competitive Bid)
  *   **Step 1 (Reversibility):** **FAIL.** 10-year exclusive contract is binding >24 months.
      *   *Immediate Stop.*
  *   **Step 4 (Manipulation):** **FAIL.** The parties with the best information on cost/service viability are the waste haulers themselves. They are also the bidders.
      *   *Conflict:* If they trade, they can manipulate the market to win the contract. If they are banned (per Protocol), the market lacks the only informed traders.
  *   **VERDICT:** **INELIGIBLE.**
      *   *Reason:* Irreversibility and unavoidable conflict of interest. This is a procurement decision, not a prediction problem.

  ### PROPOSAL 3: Overnight Shelter (Specific Site)
  *   **Step 1 (Reversibility):** **FAIL.** Opening a shelter is operationally and politically irreversible for a decade. Zoning and community trust cannot be "reversed" in 24 months.
  *   **Step 3 (Value vs. Fact):** **FAIL.** The proposed metric is "Assessed Property Values within 0.5 miles."
      *   *Analysis:* Property value is a *proxy* for community wealth, not a direct city service output. Optimizing for property values incentivizes traders to bet on outcomes that benefit landowners, potentially at the expense of homeless residents (the actual policy target). This embeds a value judgment (NIMBYism vs. Housing First) into the market mechanism.
      *   *Requirement:* Council must vote on whether "Property Value" is the actual goal. If the goal is "Reduction in Unsheltered Population," property values are a noisy, manipulable proxy.
  *   **Step 4 (Manipulation):** **FAIL.** Real estate developers and abutters are the best-informed traders regarding property value impacts. They are also Interested Parties. Banning them removes liquidity; allowing them invites manipulation to depress/boost values for external gain.
  *   **VERDICT:** **INELIGIBLE.**
      *   *Reason:* Fails Reversibility, Value/Fact Separation, and Manipulation checks.
      *   *Managerial Note:* This kills the City Manager's flagship. The procedure dictates that because the metric (Property Value) is a contested value proxy and the decision is irreversible, it cannot be outsourced to a market.

  ---

  # LIMITS AND FAILURE MODES

  ### CLASSES OF DECISION THIS WILL SYSTEMATICALLY GET WRONG
  1.  **Equity-Heavy Decisions:** Markets aggregate capital-weighted opinions, not citizen-weighted needs. A market will efficiently optimize for wealth preservation over welfare distribution unless strictly constrained.
  2.  **Low-Information Environments:** If the public does not understand the technical nuances (e.g., wastewater treatment chemistry), the market price will reflect media sentiment, not expert reality.
  3.  **Black Swan Events:** Prediction markets assume normal distributions. They will underprice low-probability, high-impact risks (e.g., pandemic, major infrastructure failure).

  ### WHAT A BAD OUTCOME LOOKS LIKE
  *   **The "Hollow Market":** The market opens, city seed money is consumed by a single external actor (or bot), and the price stabilizes at 99% or 1% without trading volume. This indicates the question was obvious or the market was rigged.
  *   **The "Self-Fulfilling Prophecy":** Traders bet "Yes" on a policy, then actively work in the real world to ensure the metric is hit (e.g., busing in riders to hit boarding targets) solely to win the bet, wasting public resources.
  *   **The "Reputation Loss":** The market recommends a policy, the city adopts it, it fails, and the city blames the "market" rather than taking political responsibility.

  ### MONTH SIX WARNINGS (PILOT FAILURE INDICATORS)
  Watch these three metrics to determine if the pilot should be terminated early:
  1.  **Liquidity Ratio:** If <20% of contract volume comes from non-seeded, non-city capital, the market is not aggregating external intelligence. **Terminate.**
  2.  **Price Volatility:** If contract prices swing >15% week-over-week without new public information, the market is trading noise. **Terminate.**
  3.  **Stakeholder Complaints:** If >2 department heads report that market speculation is interfering with operational planning (e.g., staff withholding data to avoid moving market prices), the conflict of interest is too high. **Terminate.**

  ---

  **DIRECTOR'S NOTE TO CITY MANAGER:**
  This procedure is designed to protect the City from liability and reputational damage while honoring your directive to test innovative governance. It is intentionally restrictive. Based on the Protocol, only the Bus Route proposal is viable. The Waste and Shelter proposals carry structural risks (irreversibility and metric manipulation) that a prediction market cannot mitigate. Proceeding with them would not be a pilot of futarchy; it would be a gamble with public assets disguised as a market. I recommend we proceed with the Bus Pilot only, evaluate the liquidity and accuracy at Month 6, and reconsider the broader applications in the next fiscal year.
