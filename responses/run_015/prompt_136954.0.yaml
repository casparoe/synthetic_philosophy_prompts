answer: |-
  Here is the spec for a theory of physical computation, designed to test the claim "the brain is a computer" for scientific utility rather than metaphorical comfort.

  ### The Spec: Five Requirements for Physical Implementation

  **1. The Non-Triviality Constraint**
  *   **Requirement:** The theory must specify constraints on the mapping between physical states and computational states that rule out "gerrymandered" or disjunctive mappings (e.g., mapping a rock's physical phases to a WordStar execution trace via arbitrary time-slicing).
  *   **The Worry:** The Putnam/Searle triviality argument. If any physical system can be mapped to any formalism given a sufficiently complex lookup table, the claim "the brain is a computer" is vacuous. A working neuroscientist needs to know why the brain implements *specific* algorithms (e.g., backprop) rather than *all possible* algorithms simultaneously.
  *   **Prejudice Check:** This is not prejudice; it is a condition for empirical falsifiability. Without it, the claim cannot be rejected, and therefore cannot be used.

  **2. The Grain and Scaling Invariance Condition**
  *   **Requirement:** The theory must state whether changing the temporal speed or the spatial resolution of the physical substrate changes the computation being implemented. Does slowing the brain by 50% change the algorithm? Does treating a voltage range as a single binary state versus a continuous variable change the computation?
  *   **The Worry:** Neuroscientists oscillate between treating spikes as discrete digital events and potentials as analog continuous flows. If the theory says computation is sensitive to exact timing, most neural models fail. If it says timing doesn't matter, it conflicts with data showing millisecond synchrony matters. The theory must dictate which physical differences count as computational differences.
  *   **Prejudice Check:** Digitalists often insist discrete states are required (prejudice); connectionists insist continuous dynamics are fine (prejudice). The requirement demands the theory *choose*, not hide.

  **3. The Perturbation and Noise Boundary**
  *   **Requirement:** The theory must distinguish between a physical perturbation that constitutes a computational input/error and one that is merely physical noise outside the computational description.
  *   **The Worry:** Brains are wet, noisy, and subject to thermal fluctuation and crosstalk. Formal computations are typically defined by strict transition rules. If every physical fluctuation counts as a state change, the computation is unreadable. If fluctuations are ignored, the theory must explain *why* some physical causes count (synaptic input) and others don't (thermal jitter) without appealing to a designer's intent.
  *   **Prejudice Check:** Engineering views often smuggle in "intended function" to define noise. A naturalistic theory must define noise boundaries using physical or structural properties alone.

  **4. The Ontological Status and Causal Exclusion Clause**
  *   **Requirement:** The theory must declare whether implementing a computation is an intrinsic property of the system (mind-independent) or relative to an observer/description. If intrinsic, it must explain how computational properties have causal explanatory power without violating the causal closure of physics (i.e., without suggesting "software" pushes atoms around).
  *   **The Worry:** If computation is observer-relative, "the brain is a computer" is a pragmatic stance, not a discovery. If it is intrinsic, we face the causal exclusion problem: if the physics fully determines the outcome, what work is the "computation" doing? A neuroscientist needs to know if they are studying causal mechanisms or just useful descriptions.
  *   **Prejudice Check:** Realists insist on intrinsicness (prejudice); Instrumentalists insist on relativity (prejudice). The requirement forces the theory to account for the causal efficacy of the computational level.

  **5. The Syntax-Semantics Load**
  *   **Requirement:** The theory must specify whether the physical states must carry semantic content (represent things) or if syntactic structure (causal organization) is sufficient for implementation.
  *   **The Worry:** If representation is required, we face the naturalization problem (how does physics fix meaning?). If only syntax is required, we risk divorcing the explanation from the brain's actual job (guiding behavior in a world). A neuroscientist needs to know if they are looking for information *processing* or information *bearing*.
  *   **Prejudice Check:** Classicists demand semantics (prejudice); Deflationists demand only syntax (prejudice). The requirement demands a clear boundary for what counts as a computational state.

  ---

  ### Compatibility Analysis

  **Non-Negotiables vs. Preferences**
  *   **Non-Negotiable:** **Non-Triviality** and **Perturbation Boundary**. Without these, the term "computation" loses all discriminatory power. If a rock implements the same thing as a brain, or if thermal noise is indistinguishable from input, the concept cannot guide research.
  *   **Preferences:** **Syntax-Semantics Load** and **Ontological Status**. These are often philosophical stances. A neuroscientist could potentially use the model instrumentally (Ontology = Relative) while still demanding non-trivial mappings. However, for the claim to be *substantive* (as you requested), Ontological Status becomes non-negotiable.

  **The Impossible Trinity**
  I suspect you cannot jointly satisfy these three:
  1.  **Strict Non-Triviality** (Only specific systems implement specific computations).
  2.  **Strict Intrinsicness** (It doesn't depend on an observer's interests).
  3.  **Strict Grain Objectivity** (Physics alone dictates the state boundaries).

  *Why:* Physics is continuous and causal. Computation is discrete and logical. To bridge them without an observer (Intrinsicness) while avoiding triviality (Non-Triviality), you need physics to naturally carve itself into discrete states (Grain Objectivity). But physics doesn't naturally carve itself into "bits" without reference to stability, function, or counterfactuals that often imply an observer or a goal. If you fix Grain by physics alone, you risk Triviality (everything maps). If you fix Triviality by counterfactuals, you often need an observer to define the relevant counterfactual space (losing Intrinsicness).

  **The Killer Requirement**
  The single requirement that knocks out the most popular accounts is **The Ontological Status and Causal Exclusion Clause (specifically Intrinsicness)**.
  *   **Why:** Most "Mechanistic Information-Processing" views rely on *function* (what the system is *for*). Function is typically teleological or evolutionary, which makes it observer-relative or historically dependent, not intrinsic to the current physical state. Most "Systematic-Mapping" views rely on structural isomorphism, which is intrinsic but fails Triviality. To satisfy Intrinsicness *and* Non-Triviality requires a robust account of how physical causation supports counterfactuals without appeal to use or history. Very few accounts survive this.

  ---

  ### Evaluation of Popular Views

  **1. The Systematic-Mapping View (Structural Isomorphism)**
  *   **Performance:** Fails **Non-Triviality**. It posits that if physical states map to formal states preserving transition structure, computation exists. Without additional constraints on *which* physical states count (Grain) or *counterfactual sensitivity*, it allows degenerate mappings (the rock problem). It handles **Intrinsicness** well (structure is physical) but at the cost of making everything a computer.
  *   **Verdict:** Scientifically useless without heavy modification to restrict admissible mappings.

  **2. The Mechanistic Information-Processing View**
  *   **Performance:** Fails **Intrinsicness**. This view defines computation by the functional role of parts within a mechanism organized to process information. However, "function" and "organization for a task" typically rely on evolutionary history or designer intent, making the computation relative to a narrative, not intrinsic to the physics. It handles **Perturbation** well (noise is what interferes with function) but smuggles in teleology.
  *   **Verdict:** Practically useful for neuroscientists, but philosophically vulnerable to the charge that it describes *usages* of the brain, not what the brain *is*.

  **3. The Every-System-Computes-Everything View (Pancomputationalism)**
  *   **Performance:** Fails **Non-Triviality** by definition. It embraces the triviality argument, claiming all physical dynamics are computations. It satisfies **Intrinsicness** (physics is real) and **Grain** (physics dictates the states), but renders the claim "the brain is a computer" indistinguishable from "the brain is physical."
  *   **Verdict:** Metaphysically consistent but explanatorily empty for neuroscience. It offers no leverage to distinguish healthy from pathological processing.
