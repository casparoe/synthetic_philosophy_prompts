answer: |-
  The paradox of tragedy rests on a hedonic assumption: that human engagement is governed by a simple calculus of approach and avoidance, where negative affect is inherently aversive and positive affect is inherently appetitive. Canonical solutions accept this premise and attempt to explain away the negative component. Catharsis posits that the negative affect is purged; conversion theories argue it is transmuted into pleasure; distance theories suggest it is muted or simulated. Your proposed "aesthetic fidelity mode" rejects the premise itself. It argues that negative affect is not a cost to be offset, but a necessary component of a specific cognitive reward system that values accurate emotional modeling over hedonic comfort.

  To articulate this rigorously, we must distinguish between *first-order affective valence* and *second-order evaluative reward*. In ordinary experience, these are tightly coupled: pain signals damage and triggers avoidance (negative valuation), while pleasure signals benefit and triggers approach (positive valuation). In the aesthetic fidelity mode, this coupling is decoupled. The first-order valence (the sadness, the grief) remains fully negative and phenomenologically intact. It feels like sadness. However, the second-order evaluation—the cognitive system's assessment of the *activity* of feeling—registers a positive reward. The enjoyment is not derived *from* the sadness in the way sweetness is derived from sugar; it is derived from the *successful deployment* of sadness in a context where its usual instrumental demands are suspended.

  The core mechanism here is the decoupling of emotional monitoring from action selection. In a real-world tragedy, grief is a command: it demands consolation, restitution, or withdrawal. It is high-cost because it interrupts agency. In fictional engagement, the context is non-instrumental. There is no victim to save, no loss to repair. Because the action-tendency is inhibited, the emotional system is free to operate in a monitoring capacity. The mind treats the intense negative affect not as a threat to homeostasis, but as data. The "satisfaction" you describe is the system recognizing that it is capable of generating a high-resolution emotional model that matches the complexity of the stimulus. The reward is the feeling of *affective competence*. We are not enjoying the pain; we are enjoying the fact that we can sustain the pain without breaking, and that our emotional apparatus is sensitive enough to register the tragedy with high fidelity.

  This distinction is crucial for addressing the objection that labeling this experience "enjoyable" merely renames the paradox. The objection assumes that "enjoyment" must be a unitary feeling that cancels out the negative valence. If I am sad, I am not happy; therefore, if I seek sadness, I am contradicting my nature. This objection fails because it conflates *phenomenological tone* with *overall valuation*.

  Consider the analogy of physical exertion. A runner experiencing the burn of lactic acid is undergoing a negative sensory event. If you asked them in the moment, they would describe the sensation as painful. Yet, they seek out this experience and value it highly. They do not value it because the pain is actually pleasure (conversion), nor because they are distracted from the pain (distance), nor because the pain is flushed out afterward (catharsis). They value it because the pain is a signal of physiological engagement and boundary-pushing. The negative sensation is the *medium* through which the value is realized.

  Similarly, in tragic engagement, the sadness is the medium. The "enjoyment" is a retrospective or concurrent meta-evaluation that the experience is *worthwhile* because of its depth, not despite it. The paradox dissolves when we recognize that the human motivational system does not seek only pleasure; it seeks *significance*. Negative affect is often the most reliable marker of significance. By engaging with tragic art, we are not seeking to feel good; we are seeking to feel *real*. The reward is the confirmation of our own emotional depth. The sadness remains sadness, but its functional role shifts from "signal of loss" to "signal of connection." The objection that the sadness remains "fully present" is actually the strength of the theory, not its weakness. If the sadness were neutralized, the fidelity would be lost. We need the negative valence to verify that the modeling is accurate. A tragedy that does not hurt has failed aesthetically.

  This account avoids collapsing into psychological distance theories because it does not rely on the attenuation of emotion. Distance theories suggest we feel "less" or "quasi"-emotion because we know the threat is not real. The fidelity model argues we feel *more*, or at least *fully*, because the absence of real-world consequences allows us to bypass the defensive mechanisms that usually blunt our emotional responses. In real life, we often numb ourselves to survive grief. In art, we are safe enough to feel it fully. The safety does not mute the emotion; it unmutes it. The "distance" is not in the intensity of the feeling, but in the consequences of the feeling.

  Nor does this collapse into catharsis. Catharsis is teleological; it looks to the end of the experience as a release or purification. The fidelity model is constitutive; the value is present *during* the engagement. The reward is tied to the ongoing process of tracking the emotional contours of the work. If the sadness were purged, the value would be lost. We do not watch a tragedy to stop feeling sad; we watch it to feel sad *accurately*. The satisfaction is in the resonance, not the relief.

  Finally, we must clarify how this distinguishes tragic enjoyment from ordinary pleasure. Ordinary pleasure is homeostatic; it restores balance or satisfies a deficit. Tragic enjoyment is homeodynamic; it maintains a state of high arousal and negative valence without triggering a corrective avoidance response. It is a state of sustained tension that is valued for its own sake. This explains why we do not seek tragic experiences constantly. Like intense physical exertion, it is metabolically and psychologically costly. We engage in it to recalibrate our emotional monitoring systems, to remind ourselves of what matters, and to test the limits of our capacity for empathy.

  In sum, the aesthetic fidelity mode resolves the paradox by rejecting the idea that negative affect is inherently anti-reward. It posits that the reward system can value the *accuracy* of an emotional state independently of its *hedonic tone*. We seek tragic art not because we enjoy suffering, but because we value the capacity to witness suffering without looking away. The sadness is not the obstacle to enjoyment; it is the substance of it.
