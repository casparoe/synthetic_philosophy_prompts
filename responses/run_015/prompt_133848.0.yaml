answer: |-
  **MEMORANDUM**

  **TO:** Interdisciplinary Working Group on Bounded Rationality
  **FROM:** Strategic Advisory
  **SUBJECT:** Three-Year Research Agenda: Normative Foundations of Satisficing in Dynamic Frames

  **Executive Summary**
  To transition satisficing from a descriptive heuristic to a normative framework, this group must resolve the tension between *local satisficing* (stopping rules within a fixed frame) and *framing satisficing* (threshold revision as the search context shifts). Current literature treats this distinction as a taxonomy; this agenda treats it as an unsettled diagnostic problem. If we cannot formally distinguish when a shift in aspiration is a rational adaptation to a new frame versus a violation of consistency, satisficing cannot bear normative weight.

  The following three lines of inquiry are ranked by upstream dependency. Progress on #2 and #3 is contingent on the conceptual clarity achieved in #1. All three are selected for tractability within a three-year, theory-driven window (avoiding large-scale data collection).

  ***

  ### 1. The Identification Problem for Endogenous Aspirations
  **Core Question:** Under what formal and conceptual conditions is a shift in aspiration level a rational update to a changing frame (framing satisficing) rather than a preference inconsistency (local satisficing failure)?

  **Defense of Placement (Rank: 1)**
  *   **(i) Upstream Status:** This is the foundational bottleneck for the entire normative agenda. Institutional design and policy recommendations depend on knowing whether an agent's changing standards represent *learning* (which institutions should facilitate) or *instability* (which institutions should constrain). If we cannot distinguish framing satisficing from local satisficing normatively, we cannot determine if an agent is acting rationally in an expanding option space or merely succumbing to framing effects. Without resolving this, any claim that satisficing is "optimal" is vulnerable to the charge that the goalposts are simply moving to hide optimization failure.
  *   **(ii) Tractability (3-Year Window):** This requires no large-scale datasets. It is a problem of *identity conditions* for preferences.
      *   *Philosophers* can articulate the criteria for preference stability across frame shifts.
      *   *Modelers* can construct minimal dynamic models where aspiration levels are functions of the search history.
      *   *Meaningful Progress:* A formal definition of "Frame-Invariant Satisficing." This would be a set of axioms showing that an agent can change their threshold $\tau$ as the option set $O$ expands, without violating transitivity or consistency requirements. A targeted counterexample demonstrating where current adaptation models inevitably collapse into inconsistency would also suffice to redirect the field.
  *   **(iii) Reordering Condition:** This priority would drop only if a formal impossibility theorem emerges within the first 12 months proving that endogenous aspirations are mathematically indistinguishable from preference instability in dynamic frames. If such a proof holds, the normative project fails, and the group must pivot to purely descriptive mechanistic modeling.

  ### 2. The Computational Phase Transition in Expanding Option Spaces
  **Core Question:** What are the boundary conditions where the rate of option space expansion renders optimization computationally intractable, making satisficing the *only* procedurally rational strategy?

  **Defense of Placement (Rank: 2)**
  *   **(i) Upstream Status:** This addresses the "option space expands faster than evaluation capacity" constraint. It moves satisficing from a "second-best" compromise to a "first-best" necessity. Downstream debates on resource allocation and organizational design depend on knowing the *tipping point* where search costs outweigh the value of marginal optimization. If optimization remains tractable even in expanding spaces, satisficing loses its normative force as a necessary rational response.
  *   **(ii) Tractability (3-Year Window):** This is a domain for formal modelers and behavioral economists using simulation and complexity theory.
      *   *Method:* Construct search algorithms where the size of $O_t$ grows as a function of time or search steps. Compare the convergence time of optimizing algorithms vs. satisficing stopping rules.
      *   *Meaningful Progress:* A "Complexity Threshold Theorem." This would specify the growth rate of the option space (e.g., polynomial vs. exponential expansion relative to evaluation speed) at which the expected utility of optimization drops below that of a fixed-aspiration stopping rule. This provides the hard mathematical boundary for the normative claim.
  *   **(iii) Reordering Condition:** If new algorithmic advances (e.g., in machine learning or heuristic search) demonstrate that optimization is tractable in the specific classes of expanding environments we model, this question loses urgency. The agenda would then shift to why agents *fail* to optimize rather than why they *shouldn't*.

  ### 3. The Normative Weight of Search-Induced Information Decay
  **Core Question:** How does the degradation of information quality during search alter the normative validity of the stopping rule?

  **Defense of Placement (Rank: 3)**
  *   **(i) Upstream Status:** This addresses the constraint that "the search process itself degrades the quality of available information." Standard models assume search reveals truth; this agenda posits search may obscure it (e.g., through market signaling, cognitive fatigue, or option spoilage). This is upstream of any institutional design regarding transparency or disclosure. If search degrades information, then "more search" is not just costly, it is epistemically harmful. This fundamentally changes the normative calculus of bounded rationality.
  *   **(ii) Tractability (3-Year Window):** This bridges epistemology and information economics.
      *   *Method:* Model information not as a static stock to be uncovered, but as a depleting resource or a signal subject to noise accumulation over search steps.
      *   *Meaningful Progress:* An "Epistemic Cost Function." A formal model showing that beyond step $n$, the marginal information gain is negative. Philosophers can validate whether this constitutes a violation of epistemic duty or a rational boundary.
  *   **(iii) Reordering Condition:** If preliminary modeling suggests information decay is a second-order effect compared to computational costs (Question #2), this line of work should be deprioritized. Conversely, if we find that information decay occurs *before* computational limits are hit, this question moves to Rank #1, as the epistemic failure precedes the computational failure.

  ***

  ### Strategic Synthesis: The Local vs. Framing Diagnostic
  This agenda uses the tension between **local** and **framing** satisficing not as a classification system, but as a stress test.
  *   **Question #1** asks if the distinction is even coherent.
  *   **Question #2** asks if the frame expansion forces the distinction.
  *   **Question #3** asks if the search process corrupts the frame itself.

  **Recommendation:** Allocate 50% of effort to Question #1 in Year 1. Without a resolved definition of rational aspiration adaptation, the formal models in #2 and #3 risk modeling arbitrary behavior rather than normative rationality. Questions #2 and #3 should proceed in parallel in Years 2 and 3, contingent on the axiomatic stability established in Year 1.
