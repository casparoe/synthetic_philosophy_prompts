      *   **Argument for Dismissal (Lack of Labor/Utility):** Berkeley wasn't a libertarian. He was a Bishop. He cared about the common good, public works, and employment. If crypto is speculative hoarding that doesn't stimulate industry, he'd hate it. If CBDCs are tools of control that hinder liberty/industry, he'd hate them.
