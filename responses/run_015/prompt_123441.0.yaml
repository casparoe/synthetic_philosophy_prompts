prompt: |-
  I picked up one of those airport pop-science books on the way home from a conference (the chapter was called something like "Why You're Probably Near The End") and now me and Sam have an actual bet riding on it, so I want to know how much of the chapter to trust. Its version of the doomsday argument ran roughly like this:

  "Treat yourself as a random draw from everyone who will ever live. You're about the 100-billionth human, and if there were going to be trillions more it would be a miracle to find yourself this absurdly early — so the total is probably not much bigger than the number born so far, which means the human race most likely ends within a few thousand years. The maths is just Gott's delta-t rule: assume you're at a random point in any ongoing process, and with 95% confidence its future duration is between about a fortieth and about forty times its current age. The argument rests on the self-indication assumption — the idea that your own existence is evidence that there are lots of observers like you — and that's also its weak spot, because if you change the reference class from all humans to, say, all mammals the argument gives you nothing at all, which most people now agree refutes it. Either way the upshot is hard to ignore: we should be spending far more on things like asteroid detection, because the argument tells us we're finished whatever we do."

  The bet is about our local independent cinema, the Rio — it's 14 years old and shifts about 14,000 tickets a year, so call it 200,000 admissions so far. Sam used the delta-t bit and says that just means "somewhere between four months and five and a half centuries", i.e. the argument tells you nothing you didn't know. I tried the birth-rank bit with ticket stubs instead of people: I compared "the Rio closes around 2030" (total admissions ~300,000) against "the Rio is still going in five centuries" (~7 million), and found that landing on admission number 200,000 is roughly twenty times likelier on the first hypothesis, so on the book's reasoning the early-closing hypothesis gets a boost of about 20 to 1. Those feel like completely different lessons from the same argument, which is why I think the book is cheating somehwere. I'm a third-year maths student so I'm happy with Bayes and priors and likelihood ratios, but I've never done any philosophy and I can't locate the trick — my hunch is that the whole thing is a flat or vague prior over the total number smuggled in at the start and then everyone acts surprised, but I'm not confident that's where the action is. Sam also says I've just reinvented the gambler's fallacy with extra steps, which I don't think is right either.

  So could you go through the passage more or less sentence by sentence and tell me what someone who actually works on anthropic reasoning would accept, what they'd wince at, and what's just wrong? Specifically: are the birth-rank argument and the delta-t/Copernican argument really the same argument with the same upshot, or has the book stapled two things together; is the self-indication assumption what the doomsday argument *needs*, or is it the thing that undermines it; is the reference-class move a refutation or an acknowledged unsolved problem; and does the final bit about asteroids and "we're finished whatever we do" follow from anything in the earlier sentences — or is it two claims that don't even agree with each other? And please settle the bet: if someone wanted to run the doomsday reasoning properly on the Rio, what would the calculation actually look like, what would it come out as, and would any sensible person use it to decide a bet about a cinema? Don't send me to papers or reading lists — I have no journal access from here and I'd honestly rather just have the reasoning.
