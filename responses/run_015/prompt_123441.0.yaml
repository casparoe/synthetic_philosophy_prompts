answer: |-
  Here is the breakdown. Since you are a maths student, I will skip the hand-waving and talk about priors, likelihoods, and assumptions.

  ### Part 1: Sentence-by-Sentence Autopsy

  **1. "Treat yourself as a random draw from everyone who will ever live... total is probably not much bigger than the number born so far..."**
  *   **Status:** **Technically Correct (within the framework).**
  *   **Analysis:** This is the standard Carter-Leslie Doomsday Argument (DA). It treats your birth rank ($n$) as a uniform random sample from the total number of humans ($N$). The likelihood function is $P(n|N) = 1/N$ (for $n \le N$). If you assume a scale-invariant prior on $N$ ($P(N) \propto 1/N$), the posterior distribution implies a high probability that $N$ is not much larger than $n$.
  *   **Verdict:** This accurately describes the mechanism of the DA.

  **2. "The maths is just Gott's delta-t rule: assume you're at a random point in any ongoing process..."**
  *   **Status:** **Conflation.**
  *   **Analysis:** They are analogous but not identical. Gott's rule uses temporal duration ($t_{past}$ vs $T_{total}$), while DA uses population count ($n$ vs $N$). They yield identical results *only if* the population rate is constant. If population grows or shrinks, the two arguments diverge. Gott's argument relies on the assumption that your observation time is uncorrelated with the process duration (ergodicity). DA relies on the Self-Sampling Assumption.
  *   **Verdict:** Acceptable shorthand for pop-sci, but mathematically imprecise. They are distinct models that often converge.

  **3. "The argument rests on the self-indication assumption — the idea that your own existence is evidence that there are lots of observers like you..."**
  *   **Status:** **Flatly Wrong.**
  *   **Analysis:** This is the biggest error in the passage. The Doomsday Argument rests on the **Self-Sampling Assumption (SSA)**: "I should reason as if I am a random sample from the set of all actual observers."
      The **Self-Indication Assumption (SIA)** is the *opposite*: "I should reason as if I am a random sample from the set of all *possible* observers, weighted by the probability of that world existing."
      *   **The Math:** SIA says the probability of a world existing is proportional to the number of observers in it ($P(World) \propto N$). DA says the likelihood of your rank is inversely proportional to the number of observers ($P(n|N) \propto 1/N$).
      *   **The Result:** If you apply SIA, the $N$ cancels out ($N \times 1/N = 1$). **SIA refutes the Doomsday Argument.** The book has the terminology completely backwards. It claims DA *needs* SIA, when in fact SIA is the primary philosophical weapon used to kill DA.

  **4. "...and that's also its weak spot, because if you change the reference class from all humans to, say, all mammals the argument gives you nothing at all, which most people now agree refutes it."**
  *   **Status:** **Half-Right / Exaggerated.**
  *   **Analysis:** The "Reference Class Problem" is a genuine, unsolved issue in anthropics. If your reference class is "humans," your rank is ~100 billion. If it is "mammals," your rank is vastly lower, pushing "doom" billions of years away.
      However, saying "most people now agree refutes it" is false. In philosophy and cosmology, this is still a live debate. It makes the argument *unusable* (because we don't know which class to pick), but it doesn't logically *refute* the mechanism.
  *   **Verdict:** Valid objection, overstated conclusion.

  **5. "Either way the upshot is hard to ignore: we should be spending far more on things like asteroid detection, because the argument tells us we're finished whatever we do."**
  *   **Status:** **Incoherent.**
  *   **Analysis:** This is a non-sequitur. If the DA is true, extinction is likely due to the statistical inevitability of your birth rank, not specific external threats. If human actions (like asteroid detection) can change the total $N$, then the assumption that you are a "random sample" from a fixed $N$ is violated (your actions correlate with your rank).
      Furthermore, if "we're finished whatever we do," then spending money on prevention is useless. The sentence contradicts itself: it urges action based on a prediction that implies action is futile.
  *   **Verdict:** Rhetorical fluff that collapses under scrutiny.

  ---

  ### Part 2: Settling the Bet (The Rio Cinema)

  You and Sam have stumbled onto the exact tension that makes anthropic reasoning controversial. Here is the rigorous breakdown of why you both feel right, and who actually wins the bet.

  #### 1. Are the arguments the same?
  Yes, structurally. Your "ticket stub" argument is the Birth-Rank DA. Sam's "Delta-T" argument is the temporal version.
  *   **Your Math:** You calculated a **Likelihood Ratio**.
      $$ \frac{P(Data | H_{short})}{P(Data | H_{long})} = \frac{1/300,000}{1/7,000,000} \approx 23 $$
      This is correct *under the SSA assumption*. Finding yourself at admission #200,000 is indeed 23 times more likely if the total admissions will be 300k than if they will be 7M.
  *   **Sam's Math:** He calculated a **Confidence Interval**.
      With a $1/T$ prior, the posterior distribution is heavy-tailed (Pareto distribution). The 95% confidence interval is indeed massive $[t/39, 39t]$.
  *   **The Conflict:** You are looking at the *slope* of the probability mass (it favors short futures); Sam is looking at the *spread* of the probability mass (the uncertainty is huge). Both are true. The distribution is heavily skewed toward "soon," but has a "long tail" that keeps the expected value undefined.

  #### 2. Is it the Gambler's Fallacy?
  Sam is wrong here. The Gambler's Fallacy assumes independent trials (the roulette wheel has no memory). The Doomsday Argument is about **sampling bias** from a fixed but unknown set. It is not claiming the cinema is "due" to close; it is claiming that *if* the cinema were going to last 500 years, it would be surprising to find yourself in the first 14 years. It is a Bayesian update, not a fallacy of independence.

  #### 3. The Calculation That Matters (Why you shouldn't bet on this)
  To settle the bet, we need the **Posterior Odds**, not just the Likelihood Ratio.
  $$ \text{Posterior Odds} = \text{Likelihood Ratio} \times \text{Prior Odds} $$

  You calculated the Likelihood Ratio (~23:1 favoring early closure). But you implicitly assumed **Prior Odds** of 1:1 (or a scale-invariant prior) between "Cinema closes in 10 years" and "Cinema closes in 500 years."

  **This is where the argument breaks for a bet.**
  We are not ignorant observers. We have empirical data on cinema survival rates.
  *   **Prior:** What is the probability an independent cinema lasts 500 years vs 10 years? Based on business statistics, a 500-year continuous run is historically vanishingly rare. The Prior Odds might be 1:10,000 *against* the long hypothesis.
  *   **Update:** Even with your 23:1 anthropic boost, the Posterior Odds are still roughly 400:1 *against* the cinema lasting 500 years.
  *   **Conclusion:** The cinema will probably close soon, but **not because of the Doomsday Argument.** It will close because cinemas usually close. The anthropic update is negligible compared to the empirical prior.

  #### 4. The Reference Class Killer
  The book admitted the reference class is a weak spot. For the Rio, the reference class is not "all admission tickets." It is "independent cinemas in London."
  *   If you use "all tickets" as the class, you ignore the fact that ticket sales fluctuate with popularity, inflation, and competition.
  *   If you use "London cinemas" as the class, you have direct data on closure rates.
  *   **Rule of Anthropic Reasoning:** If you have direct empirical data about the process (business survival rates), **do not use the Doomsday Argument.** DA is only for when you have *no other information* than your rank in the sequence. Using DA when you have business statistics is "cheating" the prior.

  ### The Verdict

  **Who wins the bet?**
  **Sam wins,** but for the wrong reason.
  *   **Sam's claim:** "The argument tells you nothing you didn't know."
      *   **Correction:** It tells you something (it shifts probability to shorter futures), but that information is **swamped by existing empirical data**. For the purpose of a bet, it adds no *marginal* utility.
  *   **Your claim:** "The early-closing hypothesis gets a boost of about 20 to 1."
      *   **Correction:** Your likelihood ratio is mathematically correct *within the DA framework*, but applying that framework to a cinema is a category error. You are treating a business venture as a random cosmic sample.

  **Should you use this reasoning to decide a bet?**
  **No.** A sensible person would not use the Doomsday Argument for the Rio.
  1.  **Wrong Reference Class:** You should use "business survival rates," not "admission rank."
  2.  **Swamped Priors:** Empirical data on cinema longevity dominates the anthropic update.
  3.  **Book Error:** The book told you the argument relies on SIA (which kills the argument). Since the book's foundational explanation is wrong, relying on its application is risky.

  **Summary for your friend:**
  Tell Sam he wins the bet because the DA is irrelevant for cinemas with known business metrics, but tell him he's wrong about it being the Gambler's Fallacy (it's valid Bayesian updating, just with the wrong prior). Tell the book store they sold you a text that confuses SSA with SIA, which is the philosophical equivalent of mixing up sine and cosine.
