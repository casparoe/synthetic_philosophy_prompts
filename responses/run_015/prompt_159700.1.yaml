answer: |-
  You're looking at graveyard statistics. Energy capture and population are measures of a culture's biomass, not its nervous system. A man can gain weight while his heart fails; similarly, a polity can accumulate technological capacity while losing the *asabiyyah*—the social cohesion—required to wield it collectively. Your linear model assumes technology reduces friction, but my model predicts that internal friction increases as the founding bond decays, regardless of energy available. The variables aren't macro-economic; they are socio-political ratios within the unit.

  First, measure the **Mercenary Ratio**: the percentage of coercive force provided by external contractors or peripheral proxies versus the core citizenry. In the hard phase, the polity fights with its own sons; in the soft phase, it buys protection. Second, track the **Fiscal Enforcement Cost**: the percentage of tax revenue spent on collection and compliance rather than public good. Technology should lower this in a linear model, but in the cycle, it rises as trust evaporates and evasion becomes a norm. Third, monitor **Elite Circulation**: the rate at which new families enter the ruling class versus hereditary retention. Early cycles show high turnover based on merit/necessity; late cycles show crystallization into a rent-seeking caste. These metrics diverge from your energy graph: energy goes up, but cohesion goes down, predicting fragility exactly when the linear model predicts stability.
