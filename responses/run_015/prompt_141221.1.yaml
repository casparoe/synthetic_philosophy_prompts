      *   *Youngness Paradox:* This is an artifact of proper time measures. It indicates a bad measure, not a necessary cost of cosmology.

  5.  **Identify the "Killer" Constraint:**
      *   Which requirement excludes the most theories? **Cognitive Stability combined with Empirical Coherence.** Many measures (like simple SIA in eternal inflation) fail because they predict BB dominance, undermining the reasoning used to adopt SIA.

  6.  **Score the Four Stances:**
