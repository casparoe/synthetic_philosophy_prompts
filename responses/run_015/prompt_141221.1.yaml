answer: |-
  This is a request for meta-theoretical hygiene. You are asking for the *conditions of possibility* for trusting anthropic reasoning in a cosmological context, rather than the reasoning itself. The literature often treats the Measure Problem as a technical puzzle to be solved by finding the "right" regularization. You are correctly identifying that before choosing a regularization, we must define what counts as a solution.

  Here is the specification of desiderata, categorized by necessity, followed by the analysis of incompatibilities, pressure points, and the scoring of stances.

  ### I. The Desiderata Specification

  I have refined your candidate list into three tiers: **Constitutive** (non-negotiable, failure implies the theory is unusable), **Empirical** (required to match data), and **Pragmatic** (preferred for utility but theoretically secondary).

  #### Tier 1: Constitutive Requirements (Non-Negotiable)
  *If a theory fails these, it cannot be adopted by a reasoning agent without self-contradiction.*

  **1. Cognitive Stability (Non-Self-Undermining)**
  *   **Requirement:** The theory must not predict that the cognitive process used to derive the theory is unreliable.
  *   **Argument:** This is a retorsion argument. If Cosmological Theory $T$ implies that "Typical observers with evidence $E$ are Boltzmann Brains," and you hold $E$ (memories of deriving $T$), then $T$ implies your derivation of $T$ is likely a hallucination. A theory that invalidates the reliability of its own adoption is pragmatically self-defeating. You cannot coherently believe $T$ if $T$ says believers of $T$ are usually insane.
  *   **Status:** **Non-Negotiable.**

  **2. Measure Robustness (Cutoff Invariance)**
  *   **Requirement:** The ratio of Ordinary Observers (OO) to Boltzmann Brains (BB) must not diverge or flip sign based on arbitrary choices of time slicing (proper time vs. scale factor) or spatial cutoffs.
  *   **Argument:** Physics describes objective reality, not coordinate artifacts. If the verdict on "Am I a BB?" depends on whether we regulate the infinite volume using light-cone time or a causal patch, the question is ill-posed within that framework. A theory that yields contradictory ontological verdicts based on regularization is mathematically ill-defined, not physically descriptive.
  *   **Status:** **Non-Negotiable.**

  #### Tier 2: Empirical Requirements (Evidence-Tracking)
  *If a theory fails these, it is falsified by your specific data, even if logically consistent.*

  **3. Likelihood Sensitivity (Specific Evidence)**
  *   **Requirement:** The theory must weight observers by the complexity of their evidence. A BB fluctuation containing a consistent "Boltzmann Archive" (memories + lab records + external verification) must be penalized relative to a minimal BB, and sufficiently penalized relative to an OO.
  *   **Argument:** A minimal BB (one second of experience) is vastly more probable than a BB with 40 years of consistent memories. However, an OO with 40 years of consistent memories is *not* exponentially suppressed in standard cosmology. If the theory treats all observer-moments as equal (ignoring the information content of the evidence), it ignores the likelihood ratio $P(E|OO) \gg P(E|BB)$. The theory must allow the specific content of your evidence to update the prior.
  *   **Status:** **Non-Negotiable.** (Failure here reduces anthropics to a prior-stub).

  **4. Asymptotic Convergence**
  *   **Requirement:** As evidence accumulates (e.g., verifying more predictions, observing deeper cosmic history), the posterior probability of being an OO must converge to 1 (or a stable high value), not oscillate.
  *   **Argument:** If every new piece of confirming evidence resets the BB probability because the fluctuation required to mimic it is "just as likely" in the tail of the distribution, learning is impossible. A cosmology that prevents Bayesian convergence on one's own existence precludes doing physics.
  *   **Status:** **Non-Negotiable.**

  #### Tier 3: Pragmatic Preferences (Nice-to-Have)
  *These are desirable for planning and intuition but do not strictly invalidate the theory if absent.*

  **5. Absolute OO Dominance**
  *   **Requirement:** OOs outnumber BBs in the global count (not just conditional on evidence).
  *   **Argument:** This is the standard "solution" often cited. However, strictly speaking, you only need *conditional* dominance (Tier 2, #3). If BBs exist in infinite numbers but are exponentially suppressed conditional on your specific evidence, you are safe. Demanding absolute dominance is a preference for a "clean" universe, not a requirement for trust.
  *   **Status:** **Preference.**

  **6. Action-Guiding Stability**
  *   **Requirement:** The theory must prescribe decisions that align with OO behavior even if there is a non-zero BB probability.
  *   **Argument:** As you noted, if you are a BB, your actions likely have no causal consequence. Thus, expected utility maximization naturally collapses to "act as if OO." This is a safety net, not a truth condition.
  *   **Status:** **Preference.**

  **7. Reference Class Neutrality**
  *   **Requirement:** The verdict should not depend on ad-hoc definitions of "observer."
  *   **Argument:** While desirable, some distinction between "cognitive agent" and "thermal fluctuation" is likely necessary to solve the problem. A theory that requires a precise definition of "observer" is acceptable if that definition is grounded in information processing capacity rather than arbitrary fiat.
  *   **Status:** **Preference.**

  ---

  ### II. The Incompatibilities and Trade-Offs

  You suspected that **Cognitive Stability** and **Measure-Relative Dominance** are on a collision course, and that **Cutoff Invariance** clashes with **Infinite Spacetime**. You are correct.

  **1. The Infinity vs. Robustness Trade-Off**
  *   **Conflict:** In an eternally inflating spacetime that is truly infinite in volume and time, BBs *will* dominate OOs in absolute number under almost any translation-invariant measure.
  *   **Resolution:** To satisfy **Measure Robustness** and **Cognitive Stability**, you must abandon the assumption of a physically realized, unregulated infinite spacetime. You must accept a measure that effectively imposes a horizon or a cutoff (e.g., Causal Patch Measure, Scale Factor Cutoff).
  *   **Cost:** This implies that "global" counts are meaningless. Only local, causal accessibility matters. This is a significant ontological downgrade from the "Multiverse as a set of all worlds" view.

  **2. The Stability vs. Typicality Trade-Off**
  *   **Conflict:** Strict Typicality (SSA/SIA) demands you consider yourself a random sample from the reference class. If the reference class includes BBs, and BBs are numerous, you must conclude you are a BB. This violates **Cognitive Stability**.
  *   **Resolution:** You must reject Strict Typicality in favor of **Full Non-Indexical Conditioning (FNC)** or a similar framework that weights by the *content* of the evidence rather than simple observer counts.
  *   **Cost:** This abandons the "Copernican Principle" in its strongest form. You are not a random observer; you are a random observer *with this specific data*.

  **3. The "Fiat" Exclusion Question**
  *   **Verdict:** Excluding BBs by **physical fiat** (e.g., "The vacuum decays before BBs can form") is a **Genuine Solution**. It satisfies all Tier 1 requirements.
  *   **Verdict:** Excluding BBs by **reference class fiat** (e.g., "BBs don't count as observers because they aren't embodied") is **Ad Hoc** unless tied to Cognitive Stability. If the only reason they don't count is to save the theory from skepticism, it is circular. If the reason is "they cannot process the evidence required to verify the theory," it is valid.

  **4. The Youngness Paradox**
  *   **Verdict:** This is an **Artifact**, not a real cost. It arises specifically from Proper Time measures which favor younger regions. It indicates a bad measure choice, not a necessary feature of anthropic cosmology. A theory that predicts we should be 13.8 billion years old is preferred; one that predicts we should be 100 years old is falsified.

  ---

  ### III. The Single Most Exclusionary Requirement

  **Cognitive Stability combined with Measure Robustness.**

  This pair kills the majority of proposed measures.
  *   **SIA (Self-Indication Assumption):** Often fails Cognitive Stability in eternal inflation because it favors larger universes, which usually contain more BBs.
  *   **SSA (Self-Sampling Assumption):** Fails Cognitive Stability if the reference class is broad enough to include BBs (which it should be).
  *   **Proper Time Measure:** Fails Measure Robustness (gauge dependence) and yields the Youngness Paradox.
  *   **Simple Counting Measures:** Fail Measure Robustness in infinite spaces (undefined ratios).

  To survive this filter, a theory must effectively argue that **BBs are physically suppressed** (not just outnumbered) or that **indexical information renders them irrelevant** (FNC).

  ---

  ### IV. Scoring the Four Stances

  Here is how the four common stances score against the Tier 1 (Constitutive) and Tier 2 (Empirical) desiderata.

  **1. "Fix the Measure" (e.g., Scale Factor Cutoff)**
  *   **Score:** **Passable.**
  *   **Analysis:** If the measure successfully suppresses the BB volume relative to OO volume (e.g., by cutting off the future before BBs dominate), it satisfies Cognitive Stability and Robustness.
  *   **Weakness:** Often feels mathematically motivated rather than physically derived. Requires accepting that "global existence" is measure-dependent.

  **2. "Fluctuations are Physically Impossible" (e.g., Vacuum Decay, Big Crunch)**
  *   **Score:** **Perfect.**
  *   **Analysis:** This is the only solution that solves the problem at the root. If the universe ends or stabilizes before thermal fluctuations can produce brains, $P(BB) = 0$. Satisfies all tiers.
  *   **Weakness:** Requires specific, currently unverified physics (e.g., metastable Higgs vacuum with short lifetime).

  **3. "Decision-Irrelevant" (Epiphenomenalism)**
  *   **Score:** **Fail (Tier 1).**
  *   **Analysis:** This solves the *action* problem (Tier 3) but fails Cognitive Stability (Tier 1). If you believe you might be a BB, you cannot trust the physics that tells you actions are irrelevant. It allows you to plan next year, but it does not allow you to trust the plan.

  **4. "Anthropic Update Screens It Off" (FNC / Evidential Conditioning)**
  *   **Score:** **Pass.**
  *   **Analysis:** By conditioning on the specific complexity of your evidence ($E$), $P(BB|E)$ becomes negligible even if $P(BB)$ is high. This preserves Cognitive Stability without requiring physical suppression of BBs.
  *   **Weakness:** Computationally intractable to define "specific evidence" rigorously. Vulnerable to the "freak observer" counter-argument if the prior on BBs is truly infinite (requires Measure Robustness to bound the prior).

  ### V. The Working Standard

  To do physics next year without a discount factor, you do not need a theory that proves BBs *do not exist*. You need a theory that proves **BBs matching your evidence are negligible.**

  The minimal viable standard is:
  1.  **A Regulated Measure:** Accept that infinite counts are meaningless; adopt a measure (like Causal Patch) that renders the OO/BB ratio finite and well-defined.
  2.  **Evidential Weighting:** Adopt a reasoning framework (like FNC) that treats your specific memories and records as data that updates the probability, rather than just selecting a reference class.
  3.  **Physical Plausibility:** Prefer cosmologies where the future is bounded (vacuum decay) or expansion is slow enough that OO production outpaces BB production for the duration of the causal patch.

  If a cosmological theory delivers these three, you are entitled to take your evidence at face value. Anything less is speculation; anything more is unnecessary.
