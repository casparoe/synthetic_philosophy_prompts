      *   **Core Demand:** They don't want a tour of existing measures (SIA, SSA, FNC, etc.). They want a *specification of desiderata*. What *must* a cosmological theory deliver for the user to be entitled to trust their evidence (i.e., believe they are an Ordinary Observer (OO) and not a BB)?
      *   **Specific Constraints:**
          *   Write out the desiderata.
