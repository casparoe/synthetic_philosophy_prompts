  3.  **Evaluate and Refine Desiderata (The "Structure of the List"):**
      *   *Non-Negotiable (The "Must-Haves"):*
          1.  **Cognitive Stability (Non-Self-Undermining):** If a theory predicts I shouldn't trust the theory, it's pragmatically self-defeating. This is the strongest constraint.
          2.  **Empirical Coherence (Specific Evidence):** The theory must explain *why* my specific evidence favors OO over BB. It can't just say "BBs exist." It must say "BBs matching *this* data are suppressed."
          3.  **Predictive Stability (Cutoff Invariance):** If the measure depends on arbitrary regularization, it's not physics; it's math art.
      *   *Negotiable/Preferences (The "Nice-to-Haves"):*
          1.  *Absolute OO Dominance:* Maybe we don't need OO > BB in absolute numbers, just OO > BB *conditional on my evidence*. (This is a key distinction).
