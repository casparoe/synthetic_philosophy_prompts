          5.  The Scoring (Four Stances).
          6.  Conclusion: The "Working Standard."

      *(Self-Correction during drafting)*: I need to be careful about "OO Dominance." The user asked if excluding fluctuations by fiat is genuine. I should argue that *physical* suppression is genuine, *reference class* suppression is suspicious.
      Also, the "Action-Guiding" point: The user suggests "if I'm a BB, nothing I do matters." This is the "Epiphenomenal BB" argument. I need to validate this but note it doesn't solve the *belief* problem, only the *action* problem. The user wants to "keep doing physics," which requires belief stability.

      *Refining the "Cognitive Stability" argument:* This is the "Retorsion" argument. If theory T implies "Reasoning process R is unreliable," and I used R to derive T, T is self-defeating. This is the non-negotiable core.

      *Refining the "Specific Evidence" argument:* A BB matching *all* my memories + external verification is exponentially rarer than a minimal BB. A theory must account for this likelihood ratio. If the prior on BBs is infinite, the likelihood ratio doesn't matter. So the prior must be regulated.

      *Refining the Incompatibility:* Infinite spacetime + Translation Invariance + Finite Probability of BBs = BB Dominance. To avoid this, you must break one. Usually, we break "Infinite Spacetime" (via measure cutoffs) or "Translation Invariance" (via causal patches). The trade-off is between "Global Count" and "Local Coherence."

  8.  **Final Polish:** Check against all constraints in the prompt.
