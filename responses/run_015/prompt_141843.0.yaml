  ## PART IV: ANCHORS AND BREAKS

  **Anchor Cases (The Key Must Get These Right):**
  1.  **Bacterium:** Must be classified as **Alive** by all Realist leaves.
  2.  **Pebble/Crystal:** Must be classified as **Not Alive** by all leaves.
  3.  **Candle Flame:** Must be classified as **Not Alive** (fails inheritance/chemistry).

  **Counter-Intuitive Verdicts (Where the Key Breaks):**
  To stimulate seminar discussion, the key is designed to force these uncomfortable conclusions depending on the path taken:
  1.  **The Mule:** Under Evolution-First definitions (Leaf H/K), the mule is **Not Alive**. This contradicts the universal intuition that a sterile animal is still a living organism.
  2.  **Digital Programs:** Under Substrate-Neutral Evolution definitions (Leaf K), self-replicating code is **Alive**. This contradicts the universal intuition that life must be biological/chemical.
  3.  **Machine-ATP Cells:** Under Strict Autopoiesis (Leaf A), cells that rely on an external machine for energy are **Not Alive**. This contradicts the intuition that internal machinery source doesn't negate life status.

  ***

  ## PART V: INSEPARABLE LEAVES AND STRATEGIC NOTES

  **Inseparable Pair:**
  **Leaf F (Astrobiology/Individual Capacity)** and **Leaf H (Replicator/Lineage History)** are difficult to distinguish using only the couplets above. Both require evolution and carbon/chemistry (usually).
  *   *The Smuggled Couplet required to prise them apart:* "If the last individual of a type dies, but its exact genetic blueprint is preserved on a hard drive, does 'life' still exist?"
      *   Leaf F says **Yes** (The capacity is preserved in the blueprint).
      *   Leaf H says **No** (Life is the historical chain, which is broken).

  **Running the Key Backwards (Sorting People):**
  If you wish to use this key to diagnose a student's philosophical stance rather than a biological case, look for these three answer patterns:
  1.  **The Materialist:** Answers 2a (Carbon) and 6a (Metabolism). They will reject AI life and synthetic cells without ancestors.
  2.  **The Functionalist:** Answers 2b (Substrate) and 9b (Capacity). They will accept AI life and reject the Mule.
  3.  **The Historicist:** Answers 7a (Ancestry). They will reject the first living cell and the synthetic cell.

  **Strategic Respondents:**
  A student who notices the pattern may answer strategically to avoid commitment (e.g., choosing "Cluster Concept" at 5a to avoid defending a hard definition).
  *   *Counter-measure:* If a respondent selects "Cluster" or "No Single Definition," bypass the rest of the key and ask: "Which trait in the cluster is *necessary*?" If they say "None," they are an Eliminativist (Leaf C). If they say "All," they are a Pluralist (Leaf D). If they say "One," force them back to Couplet 6.
