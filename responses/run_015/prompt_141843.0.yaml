answer: |-
  # SEMINAR HANDOUT: A KEY TO DEFINITIONS OF LIFE

  ## PART I: THE LOGICAL STRUCTURE (Questions and Occupancy)

  *Instructions: Begin at Couplet 1. Choose 1a or 1b based on your intuition about what the definition of life ought to prioritize. Follow the number indicated to the next couplet or to a Leaf (L). Note the "Occupancy" status at each branch.*

  **1. Is there a single, correct definition that applies to all possible cases?**
  *   **1a.** Yes, there is a fact of the matter. (Go to 2) *[Occupied]*
  *   **1b.** No, the concept is too messy for one rule. (Go to 4) *[Occupied]*

  **2. Must the entity be composed of carbon-based chemistry in liquid water?**
  *   **2a.** Yes, terrestrial chemistry is essential. (Go to 3) *[Occupied]*
  *   **2b.** No, the substrate does not matter, only the pattern. (Go to 5) *[Occupied]*

  **3. Is a self-constructed physical boundary (like a membrane) essential?**
  *   **3a.** Yes, it must build and maintain its own edge. (Leaf A) *[Occupied]*
  *   **3b.** No, chemistry alone is sufficient. (Leaf B) *[Unoccupied: Incoherent. If chemistry matters, structure usually matters; implies dissolved soup is alive.]*

  **4. Is the word "life" scientifically useless and should be discarded?**
  *   **4a.** Yes, it is a folk category with no precision. (Leaf C) *[Occupied]*
  *   **4b.** No, it is still useful despite lacking a sharp definition. (Go to 5) *[Occupied]*

  **5. Is the concept a "cluster" of overlapping traits rather than a single requirement?**
  *   **5a.** Yes, different things are alive for different reasons. (Leaf D) *[Occupied]*
  *   **5b.** No, there is still one core mechanism, even if boundaries are fuzzy. (Go to 6) *[Unoccupied: Unattractive. Claims fuzziness but demands a single mechanism; unstable position.]*

  **6. Is the capacity to exchange energy and maintain internal order essential?**
  *   **6a.** Yes, metabolism and boundary are primary. (Go to 7) *[Occupied]*
  *   **6b.** No, information and copying are primary. (Go to 9) *[Occupied]*

  **7. Must the entity have actually descended from a prior living entity?**
  *   **7a.** Yes, historical ancestry is required. (Leaf E) *[Occupied]*
  *   **7b.** No, a standalone system counts if it functions correctly. (Go to 8) *[Occupied]*

  **8. Can a single, bounded individual possess the property, or does it require a population?**
  *   **8a.** A single individual is sufficient. (Leaf F) *[Occupied]*
  *   **8b.** Only a population over time possesses the property. (Leaf G) *[Unoccupied: Rare. Metabolism is typically individual; populations don't metabolize.]*

  **9. Must the entity have a history of actual copying, or is the capacity sufficient?**
  *   **9a.** Actual history of copying is required. (Go to 10) *[Occupied]*
  *   **9b.** Only the capacity to copy and vary is required. (Go to 11) *[Occupied]*

  **10. Is the unit of selection the individual or the lineage?**
  *   **10a.** The lineage (the chain of copies). (Leaf H) *[Occupied]*
  *   **10b.** The individual (the copy itself). (Leaf I) *[Unoccupied: Redundant. If actual history is required, the individual is just a node in the lineage.]*

  **11. Must the entity be able to survive without a host?**
  *   **11a.** Yes, independence is required. (Leaf J) *[Occupied]*
  *   **11b.** No, parasites and dependents count. (Leaf K) *[Occupied]*

  **12. (Tie-Breaker) If an entity stops copying but retains the blueprint, is it still "life"?**
  *   **12a.** Yes, dormant capacity counts. (Leaf F) *[Occupied]*
  *   **12b.** No, active process is required. (Leaf G) *[Occupied]*

  ***

  ## PART II: THE LEAVES (Positions and Embarrassments)

  *Staple this section to Part I. Each Leaf corresponds to a terminal point in the key.*

  *   **Leaf A: Terrestrial Autopoiesis.** Life is a self-making carbon-based system.
      *   *Most embarrassed by:* A synthetic cell built from non-living parts that functions perfectly but has no ancestors.
  *   **Leaf B: [Unoccupied].** (See Part I).
  *   **Leaf C: Eliminativism.** "Life" is a outdated term like "phlogiston" and should be dropped.
      *   *Most embarrassed by:* The practical necessity of distinguishing medical pathogens from inert dust in a hospital.
  *   **Leaf D: Pluralism.** "Life" is a cluster concept; things can be alive in different ways.
      *   *Most embarrassed by:* The demand for a unified theory of biology; if life is many things, biology has no single subject.
  *   **Leaf E: Genealogical Metabolism.** Life is a carbon-based metabolic lineage with actual ancestry.
      *   *Most embarrassed by:* The first living cell (it had no ancestors, so by this definition, it was not alive).
  *   **Leaf F: Astrobiology (NASA-style).** Life is a self-sustaining chemical system capable of Darwinian evolution.
      *   *Most embarrassed by:* A sterile mule (it is self-sustaining but incapable of evolution, yet intuitively alive).
  *   **Leaf G: Process Ontology.** Life is the active process of evolution, not the thing evolving.
      *   *Most embarrassed by:* A bacterial spore in salt for a million years (it is not processing, yet we treat it as living).
  *   **Leaf H: Replicator Theory.** Life is any lineage of information that undergoes differential survival.
      *   *Most embarrassed by:* A single computer virus on a disconnected hard drive (it has the code but no population history).
  *   **Leaf I: [Unoccupied].** (See Part I).
  *   **Leaf J: Independent Substrate-Neutral.** Life is independent capacity for evolution on any medium.
      *   *Most embarrassed by:* Obligate intracellular bacteria that die instantly outside a host (they are dependent, yet alive).
  *   **Leaf K: Dependent Substrate-Neutral.** Life is any evolving system, even if parasitic or digital.
      *   *Most embarrassed by:* A self-replicating computer worm that pays for its own electricity (most refuse to call it alive).

  ***

