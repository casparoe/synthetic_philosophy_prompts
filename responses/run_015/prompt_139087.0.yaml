answer: |-
  ### I. The Purpose Constraint: Guidance vs. Assessment

  You have asked for a theory that serves two masters: **First-Personal Guidance** (what do I do now?) and **Second-Personal Assessment** (what do I owe for what I did?).

  **Verdict:** These purposes pull apart.
  Guidance requires *epistemic accessibility*. An agent at the till cannot calculate threshold probabilities with precision; they need a heuristic that works under uncertainty. Assessment requires *truth-tracking*. Blame and compensation depend on what actually happened, not what the agent reasonably believed. A theory that demands perfect causal knowledge for permission fails Guidance (it paralyzes). A theory that relies solely on reasonable belief fails Assessment (it lets lucky harm-doers off the hook).

  An adequate theory must either (a) provide a unified account that bridges this gap (e.g., by defining obligation in terms of reasonable expectations but blame in terms of actual risk-imposition) or (b) explicitly bifurcate, offering one rule for decision and another for judgment. The desiderata below assume the stronger challenge: that a single theoretical framework should be able to generate both outputs without contradiction.

  ***

  ### II. The Desiderata

  **1. Ex Ante Usability**
  *The Case:* The Wednesday shopper (broken app, 1/60 chance).
  *Requirement:* The theory must yield a verdict without requiring information the agent cannot reasonably possess. If the theory requires knowing the exact counter number to determine permissibility, it fails the agent on Wednesday. It must handle probabilistic uncertainty without collapsing into paralysis.
  *[Status: Genuine]*

  **2. Causal Discrimination**
  *The Case:* The Chicken Counter (Monday vs. Tuesday vs. Wednesday).
  *Requirement:* The theory must distinguish between acts that certainly trigger harm, acts that certainly do not, and acts that risk triggering harm. It cannot treat the Tuesday purchase (causally inert) identically to the Monday purchase (causally decisive) in its assessment of *outcome*, even if it treats them similarly in *guidance*. It must acknowledge the moral significance of being the threshold-crosser.
  *[Status: Genuine]*

  **3. Non-Causal Participation**
  *The Case:* The Button Press (60 people, all necessary, none sufficient).
  *Requirement:* The theory must explain why an act is wrongful even when it is causally insufficient to produce the harm alone. If the theory requires individual causal sufficiency for wrongness, it exonerates every button-presser. It must account for contribution to a collective mechanism as a source of obligation.
  *[Status: Genuine]*

  **4. Substitution Immunity**
  *The Case:* The Next Shopper (if I don't buy, they will).
  *Requirement:* The theory must determine whether causal overdetermination by substitution exonerates the agent. It cannot simply accept "someone else would have" as a blanket excuse, or it permits free-riding on the expected compliance of others. It must specify the conditions under which substitution matters (e.g., does it reduce harm, or merely shift agency?).
  *[Status: Prejudice]* (See Analysis)

  **5. Act Individuation Neutrality**
  *The Case:* The Grain of Action (one pack/week vs. household vs. buyers' club).
  *Requirement:* The moral verdict should not flip merely because we change the temporal window or the grouping of agents. If buying one pack a week for a year is wrong, buying a year's supply at once should not be right simply because it is one "act." If a household is a single agent, the theory must justify why six individuals are not.
  *[Status: Genuine]*

  **6. Universalization Stability**
  *The Case:* The Generalization Test (if my excuse works for everyone).
  *Requirement:* The theory must block excuses that are self-defeating when generalized. If the excuse "my act makes no difference" is valid for me, it is valid for all. If all act on it, harm occurs. The theory must explain why the individual can cite the general fact (harm happens) without relying on the general permission (everyone contributes).
  *[Status: Genuine]*

  **7. Cross-Domain Invariance**
  *The Case:* Meat vs. Votes vs. Emissions.
  *Requirement:* The theoretical apparatus must apply uniformly across different types of collective harm. If the theory says voting is obligatory but meat-eating is permissible despite identical causal structures (thresholds, probabilities, substitution), it must trace this to a structural difference in the cases, not an ad hoc exception for food or politics.
  *[Status: Prejudice]* (See Analysis)

  **8. Normative Layering**
  *The Case:* The Distinctions (Causation vs. Wrongness vs. Blame).
  *Requirement:* The theory must distinguish between causing an outcome, performing a wrong act, and being blameworthy for it. An agent might cause harm without being blameworthy (ignorance), or be blameworthy without causing harm (attempted threshold crossing). Collapsing these categories renders the theory useless for Assessment.
  *[Status: Genuine]*

  ***

  ### III. Critical Analysis

  **Genuine Desiderata vs. Partisan Prejudices**
  *   **Genuine:** *Ex Ante Usability, Causal Discrimination, Non-Causal Participation, Act Individuation Neutrality, Universalization Stability, Normative Layering.* These are required for the theory to function as a tool for both guidance and assessment in the real world.
  *   **Prejudice:** *Substitution Immunity* and *Cross-Domain Invariance*.
      *   *Substitution Immunity* is often a demand from those who wish to block "redundancy" excuses, but a strict causal account might rightly say substitution *does* absolve of causal responsibility, even if it leaves complicity. Demanding it *must* not absolve is a moral stipulation, not a structural necessity.
      *   *Cross-Domain Invariance* is a methodological preference for unity. It is possible that voting and eating are structurally disanalogous (e.g., voting is a duty of citizenship, eating is a private need). Demanding invariance rules out pluralistic accounts a priori.

  **Incompatible Subsets**
  There is a trilemma between **Ex Ante Usability**, **Causal Discrimination**, and **Assessment Accuracy**.
  1.  To satisfy *Ex Ante Usability*, the theory must rely on expectations/probabilities (since the agent doesn't know the counter).
  2.  To satisfy *Causal Discrimination*, the theory must track the actual causal profile (Monday vs. Tuesday).
  3.  To satisfy *Assessment Accuracy* (blame), the theory usually requires actual causation or risk-imposition.
  *Conflict:* If you guide by expectation (Usability), you will tell the Wednesday agent to act as if they might trigger the harm. If you assess by actual causation (Discrimination), the Wednesday agent who didn't trigger it looks different from the Monday agent who did. You cannot have a single metric that is both sensitive to the agent's ignorance (for guidance) and sensitive to the factual reality (for blame) without splitting the theory. You must choose whether obligation is a function of *evidence* or *fact*.

  **The Most Exclusionary Requirement**
  **Causal Discrimination.**
  This requirement excludes the most candidate theories because it forces the theory to care about threshold mechanics.
  *   *Pure Expected-Utility accounts* fail here: They treat the Tuesday purchase (0% chance of impact) and the Wednesday purchase (1.6% chance) as distinct, but they often treat the Monday purchase (100% chance) as just another point on the probability curve, missing the qualitative shift of *being the cause*.
  *   *Pure Complicity accounts* fail here: They often treat all contributions to a harmful practice as equally wrong, regardless of whether the agent was the threshold-crosser or merely a supporter.
  *   *Pure Duty-based accounts* fail here: They often issue blanket prohibitions ("Do not participate") that ignore the causal nuance between Monday and Tuesday.
  To satisfy Causal Discrimination, a theory must have a sophisticated account of risk, threshold, and actual outcome simultaneously. Most theories simplify one away to save the others.

  ***

  ### IV. Scorecard of View Families

  **Expected-Difference Accounts**
  *Structure:* Obligation tracks the mathematical expectation of harm prevented/caused.
  *Score:* Excellent for *Ex Ante Usability* and *Guidance*. Fails *Causal Discrimination* (treats low-probability threshold crossing as morally identical to high-probability non-crossing if expectations match). Struggles with *Assessment* (hard to blame for bad luck if expectation was low).

  **Complicity/Participation Accounts**
  *Structure:* Obligation tracks joining in a wrongful collective project, regardless of marginal impact.
  *Score:* Excellent for *Non-Causal Participation* and *Substitution Immunity*. Fails *Causal Discrimination* (cannot distinguish the Monday trigger from the Tuesday supporter). Risks over-generating obligation in *Cross-Domain* cases (makes trivial participation too costly).

  **Character/Self-Corruption Accounts**
  *Structure:* Obligation tracks the effect of the act on the agent's own virtue or integrity.
  *Score:* Excellent for *Ex Ante Usability* (focuses on internal state). Fails *Assessment* (makes harm to others secondary). Struggles with *Universalization* (focuses on the self, not the collective outcome).

  **Collective Duty Distribution Accounts**
  *Structure:* Obligation is a fair share of the collective duty to prevent the harm.
  *Score:* Excellent for *Universalization Stability* and *Non-Causal Participation*. Fails *Ex Ante Usability* (hard to calculate "fair share" without knowing others' actions). Struggles with *Substitution* (if others do their share, does my share vanish?).

  **Helping-Without-Difference Accounts**
  *Structure:* Obligation tracks the duty to aid or not harm, even if the aid/harm is non-pivotal.
  *Score:* Excellent for *Normative Layering* (separates duty from outcome). Fails *Causal Discrimination* (often treats all contributions equally). Vague on *Assessment* (hard to quantify compensation for non-difference making).
