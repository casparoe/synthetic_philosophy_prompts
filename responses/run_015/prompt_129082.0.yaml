answer: |-
  Your analysis of the "Collapse vs. Transformation" debate is exceptionally precise. You have identified a structural feature of historiographical and archaeological argumentation that goes beyond simple disagreement into a logical stalemate where the *criteria for significance* are themselves the object of dispute.

  ### 1. Is there an established term?

  There is no single, canonical term in philosophy of history or archaeology that captures this *specific* reciprocal configuration. However, your description maps onto a convergence of three established concepts, none of which fully capture the mutuality you describe:

  *   **Kuhnian Incommensurability:** Thomas Kuhn argued that competing paradigms often lack a common measure because terms (e.g., "mass," "planet") change meaning.
      *   *Distinction:* Kuhn focuses on semantic shift and perceptual gestalt. Your case is not that "collapse" means different things (though it does), but that *evidence itself* is assigned different ontological weights (institutional loss vs. demographic persistence) based on prior normative commitments. It is less about meaning and more about **criteria of significance**.
  *   **The Duhem-Quine Thesis (Underdetermination):** This states that empirical data alone cannot determine which theory is correct because theories can always be adjusted to accommodate data.
      *   *Distinction:* This explains why the data doesn't *force* a conclusion, but it doesn't explain the *mechanism* by which each side renders the other's evidence inert. It describes the possibility of stalemate, not the structural immunity.
  *   **Narrative Substantivism (Hayden White):** White argued that historical narratives are literary constructs (emplotments) rather than empirical discoveries. Choosing "Tragedy" (Collapse) vs. "Satire" (Transformation) is an aesthetic/moral choice.
      *   *Distinction:* This captures the normative element but treats the disagreement as purely literary. You are describing a *theoretical* stalemate where empirical claims (settlement patterns, literacy) are actively neutralized, not just story-telling preferences.

  ### 2. A Proposed Term: **Reciprocal Interpretive Immunity**

  Since no existing term precisely captures the *mutual neutralization of evidentiary weight* based on competing normative frameworks, I propose the term **Reciprocal Interpretive Immunity (RII)**.

  **Definition:** RII occurs when two competing macro-historical models are structured such that the primary evidence supporting Model A is categorically redefined as secondary or derivative by Model B, and vice versa, rendering empirical adjudication impossible without first resolving the prior normative disagreement.

  **Boundary Conditions (How it differs from vagueness or standard disagreement):**
  *   **Vs. Semantic Vagueness:** In standard vagueness, parties agree on what would count as evidence but disagree on whether the threshold is met (e.g., "Is 50% population loss 'collapse'?"). In RII, parties disagree on *which variable matters* (e.g., "Population loss matters" vs. "Institutional loss matters").
  *   **Vs. Standard Theoretical Disagreement:** In a standard disagreement, a new piece of evidence (e.g., a mass grave) could theoretically sway both sides. In RII, the new evidence is immediately absorbed: the Collapse theorist sees "violence," the Continuity theorist sees "localized conflict within persistence."
  *   **Vs. Bad Faith (Gerrymandering):** RII does not imply intellectual dishonesty. Both frameworks are internally coherent. The immunity arises from the **axiomatic prioritization of different societal metrics** (Complexity vs. Welfare).

  ### 3. What would adjudicate between the frames?

  To break Reciprocal Interpretive Immunity, one must step outside the binary of "Complexity vs. Continuity" and introduce a **third metric** that is not definitionally tied to either framework's core axiom.

  **The Adjudicating Argument:**
  The stalemate persists because "Collapse" is currently a proxy for two different things:
  1.  **Loss of Societal Capacity** (Energy capture, hierarchy, specialization).
  2.  **Loss of Human Security** (Violence, starvation, disease).

  Your friend prioritizes (2); you prioritize (1). The debate is resolvable only if we decouple these variables. An empirical finding that would revise my judgment would be a **paleo-physiological or bio-archaeological signature** that correlates institutional loss with human welfare *independently* of settlement patterns.

  *   **Example:** If isotopic analysis (bone collagen) showed that during the "Transition," the average caloric intake and disease load of the surviving population remained stable *despite* the loss of palaces, the Continuity model gains empirical ground on human welfare.
  *   **Counter-Example:** If the archaeological record showed that the "surviving" population suffered a 50% reduction in life expectancy, increased trauma, and nutritional stress *concurrent* with the loss of writing, then the "Collapse" label is empirically justified not by the loss of monuments, but by the loss of security.

  **The Decisive Move:**
  The argument is adjudicated by shifting the definition of "Society" from **Structure** (institutions, monuments) to **Function** (human reproduction, security, energy flow). If "Collapse" is defined as "a significant reduction in the capacity of the system to reproduce its population at a stable welfare level," then demographic persistence alone is insufficient to deny collapse if welfare plummeted. Conversely, if welfare held steady, "Collapse" is merely an elite phenomenon.

  ### 4. Vulnerability and the "Pseudo-Problem" Risk

  You asked where my reasoning is most vulnerable. The greatest risk is that **you have identified a genuine pseudo-problem generated by the reification of "Collapse" as a natural kind.**

  **The Vulnerability:**
  My judgment relies on the assumption that "Collapse" and "Transformation" are competing descriptions of an objective reality. It is highly probable that they are not. "Collapse" may be a **heuristic device** rather than an ontological state.
  *   **Risk:** By seeking a term like *Reciprocal Interpretive Immunity*, I may be validating a debate that should be dissolved rather than solved.
  *   **Revision Condition:** If archaeological theory successfully shifts to **multidimensional scaling** (e.g., measuring hierarchy, energy, population, and welfare as independent variables rather than a single "Collapse/Continuity" switch), then the phenomenon I described (RII) disappears. The stalemate exists *only* because the field insists on a binary taxonomy for a multidimensional process.

  **Conclusion:**
  You have not fabricated a pseudo-problem; you have identified a **taxonomic bottleneck**. The field is trying to force continuous, multidimensional historical processes into a binary categorical box ("Collapse" vs. "Not Collapse"). The *Reciprocal Interpretive Immunity* you observe is the logical symptom of this taxonomic error. The disagreement is not about the past; it is about whether we value the **persistence of the state** or the **persistence of the people** as the marker of historical success. That is not an empirical question; it is a moral one disguised as archaeology.

  **Recommendation:**
  Do not seek to win the argument on empirical grounds alone. Challenge the **taxonomy**. Propose that "Collapse" be retired as a binary label in favor of specific vectors (e.g., "De-urbanization with Demographic Stability" vs. "Demographic Catastrophe"). This dissolves the immunity by removing the definitional shield.
