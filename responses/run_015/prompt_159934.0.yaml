answer: |-
  This is a precise and philosophically rich observation. You have identified a specific gap between *epistemic belief* (knowing something is true based on evidence/testimony) and *aesthetic judgment* (valuing something based on experience).

  There is no single English word for this (like "schadenfreude"), but in philosophy of art and epistemology, this cluster of intuitions is the central subject of **The Puzzle of Aesthetic Testimony**. The specific feeling you describe—that the belief is "hollow," licenses only hedged assertion, and lacks behavioral force—is the psychological correlate of violating **The Acquaintance Principle**.

  The Acquaintance Principle states that judgments of aesthetic value must be based on first-hand experience. When you believe a critic, you are bypassing this principle cognitively (you hold the belief) but adhering to it normatively (you feel you can't fully assert it).

  Here is the breakdown of what this is, where it fits, and where it stops.

  ### What the Thing Is
  This is **Deferential Aesthetic Conviction**. It is a belief state formed via **Aesthetic Testimony** (trusting a critic) that fails to acquire the **Normative Force** of a first-hand judgment.

  Unlike factual deference (your mechanic), where the expert's knowledge transfers fully to you (you now *know* the alternator is shot), aesthetic deference transfers the *proposition* ("This film is a masterpiece") without the *justification* (the experience of the beauty). Because aesthetic value is arguably grounded in the *experience* itself (the qualia) rather than just the *fact* of the value, you cannot fully own the judgment without the experience.

  ### Why It Behaves Differently (The Three Symptoms)
  1.  **Hedged Assertion:** You say "It's meant to be extraordinary" because you are reporting on the *consensus* or the *critic's status*, not the *film's quality* directly. You are asserting a fact about the film's reputation, not a judgment of the film itself.
  2.  **Immunity to Revision:** When you see the film and dislike it, you don't feel "wrong." You feel the *testimony* was inaccurate for *you*, but your direct experience trumps the testimony. Conversely, when you love something hated by all, you stand firm because your justification (experience) is superior to theirs (testimony).
  3.  **Behavioral Inertia:** Aesthetic judgments usually motivate action (defending, rewatching, recommending) because they are tied to your identity and taste. A deferential conviction is not tied to your taste, only to your trust in the source. It has no "root" in your psychology to generate energy.

  ### Boundaries and Edges
  *   **Food and Wine:** **Yes.** If a sommelier says a wine is complex, you might nod, but if you taste vinegar, you spit it out. You won't defend the vinegar as "complex" to a friend.
  *   **Jokes:** **Yes.** If someone says "This joke is hilarious," and you hear it and it falls flat, you don't laugh. You might say, "I guess it's funny to some people," but you won't tell it at a party with the same confidence as a joke you found funny yourself.
  *   **Moral/Political Judgement:** **Partial.** We often defer on moral facts ("This policy hurts the poor"), but there is a growing expectation of "lived experience." However, moral deference usually licenses stronger assertion than aesthetic deference because moral claims are treated more like facts than tastes.
  *   **Factual Expertise:** **No.** As with your mechanic, factual deference transfers full assertability. If the mechanic says the alternator is shot, you can flatly assert it is shot. You don't say, "It's meant to be shot."
  *   **Source Type:** **Calibrated Person vs. Aggregation.** This phenomenon is strongest with a specific person (the critic) because it is *testimony*. With anonymous star ratings (aggregation), it feels more like data. You might say "It has a 95% rating" rather than "It's meant to be good." The "hollowness" is slightly different; it feels more statistical than deferential.

  ### Candidate Concept Table

  | Candidate Concept | What That Concept Is Really About | Where My Thing Fits It | Where It Doesn't | Verdict |
