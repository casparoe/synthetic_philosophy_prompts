answer: |-
  **The Theorem**
  I.J. Good's theorem states that for a rational agent maximizing expected utility, the expected value of free information is always non-negative. The logic is straightforward: if you receive new evidence, you can always choose to ignore it and proceed with your original plan, guaranteeing you do at least as well as you would have without the information. If the new evidence suggests a different course of action, you switch only because that new action has higher expected utility given the updated beliefs. Therefore, having the option to update can never lower your expected payoff. However, this result rests on critical assumptions: the information must be costless to acquire, the act of observing cannot alter the state of the world relevant to the decision, and the agent must be capable of updating and acting optimally based on the new data.

  **The Episode**
  In the lead-up to the 2003 Iraq War, the Bush Administration faced a binary choice: initiate military invasion immediately or allow UN weapons inspectors more time to verify claims about Weapons of Mass Destruction (WMDs). The core uncertainty was whether Saddam Hussein possessed active WMD programs that posed an imminent threat to the US or its allies. The available information was incomplete; intelligence agencies had conflicting reports, while UN inspectors under Hans Blix were on the ground requesting months to complete their work. Proponents of waiting argued that further inspections would reduce the risk of a false positive invasion, providing higher certainty before committing to war.

  Conversely, administration officials argued that delay itself carried existential risk. Condoleezza Rice's famous comment that "we don't want the smoking gun to be a mushroom cloud" encapsulated the fear that waiting for definitive proof might allow a threat to materialize before it could be stopped. The decision structure was not merely about belief accuracy, but about timing: the value of confirming the threat had to be weighed against the potential cost of the threat occurring during the confirmation process. The argument for acting immediately was fundamentally an argument that the window for safe information gathering was closing.

  **The Analysis**
  Through the lens of Good's theorem, the decision-maker is the US Administration, and the "information" is the final report from the UN inspectors. Strictly speaking, the theorem suggests they should have waited, provided the inspection process was cost-free and passive. If the inspections were truly free and the world remained static during the wait, gathering that data would only improve the decision quality or leave it unchanged. However, the "mushroom cloud" argument explicitly challenges the assumption that information gathering is costless or passive. By framing delay as dangerous, the Administration was arguing that the *process* of acquiring information changed the state of the world—specifically, it increased the probability of a catastrophic attack during the waiting period.

  In decision-theoretic terms, they were asserting that the cost of delay outweighed the expected value of the information. Good's theorem does not claim information is valuable regardless of cost; it claims *free* information is valuable. The Administration's position implies that the "price" of the inspectors' report was not zero, but rather measured in heightened vulnerability over time. Consequently, the logic holds together if you model the situation correctly: the expected utility of invading now was calculated to be higher than the expected utility of waiting minus the risk accumulated during the wait.

  This reveals that the debate was not actually about the value of information itself, but about the cost of acquiring it. The theorem illuminates the episode by showing that the disagreement wasn't about whether information is good, but about whether the specific information available was truly "free" in the relevant sense. The Administration implicitly rejected the "static world" assumption, treating the passage of time required for inspection as an active variable that degraded their security position. Thus, the theorem's logic holds, but only if the "cost" parameter includes the risk of catastrophe during the delay.

  **What the Episode Reveals**
  This episode does not break Good's theorem; rather, it confirms its utility by highlighting where its assumptions fail in high-stakes real-world contexts. It reveals that in dynamic environments, information gathering is rarely passive; the time required to learn something often allows the underlying risks to evolve. The theorem remains useful as a diagnostic tool: if a decision-maker chooses not to gather available information, Good's theorem forces us to ask what costs they are implicitly accounting for. In the Iraq case, the "cost" was the potential for a threat to materialize during the delay.

  Thus, the theorem doesn't fail, but its application requires rigorous accounting of opportunity costs and dynamic risks that are often obscured in political rhetoric. It teaches us that when information seems to have negative value, it is actually the *acquisition process* that is costly, not the knowledge itself. For a philosophy club, this distinction is crucial: Good's theorem isn't a rule that says "always wait for more data," but a framework that demands you justify why you aren't waiting. In real-world decisions where gathering information changes the state of the world, the theorem still applies, but the definition of "cost" must expand to include the risks of time itself.
