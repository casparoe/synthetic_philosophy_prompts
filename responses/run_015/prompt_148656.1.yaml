prompt: |-
  I've been running these neighborhood deliberative councils with a friend — we're both co-facilitors — and after taking a course on ancient political failures I'm convinced our 15-person groups replay the same three Athens screwups constantly. There's the Mytilene pattern where anger drives a vote for brutal collective punishment then everyone flips the next session; the Sicily expedition vibe where we overcommit pooled resources on some ambitious joint project; and the Socrates trial dynamic where one persistent dissenter gets targeted and the group decides exclusion is easier than engagement. I want a reusable, practical procedure — a flowchart in words with specific check conditions — that my co-facilitor and I can run in about ten minuts before any decision that touches punishment, big shared risk, or complaints about a disruptive voice. It should be grounded in whatever democratic theory or philosophy of collective decision-making actually explains these pathologies, but translated for volunteers who haven't read Thucydides and shouldn't need to.

  Please build three gates matching those failure modes, with concrete test sentences or conditions we can apply, and mark the spots where judgment can't be eliminated — like when emotional temperature is too high and we just have to call a recess. Apply it to three hypothetical cases: (1) a proposal for a heavy shared fine on one household for noise violations (Mytilene-type), (2) a plan to pool our entire annual budget into one inspiring but overstretched infrastructure project (Sicily-type), where I want the procedure to recommend scaling back or pausing even though I personally think it's worth the risk, and (3) a situation where one member keeps dissenting and others want to bar them from speaking for the rest of the session (Socrates-type), with the procedure honestly stating that it can protect the dissenter's right to speak but can't make the group actually listen. Don't give me citations or a reading list — I need this laminated for the wall — and don't quote ancient sources verbatim, just paraphrase their logic if it helps. Also flag exactly where the procedure fails and we have to make the call ourselves.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Context:** Neighborhood deliberative councils (15 people), co-facilitated.
      *   **Problem:** Recurring patterns mirroring ancient Athenian failures (Mytilene = reactive punishment/regret; Sicily = overambitious risk; Socrates = silencing dissent).
      *   **Goal:** A reusable, practical 10-minute pre-decision procedure (flowchart in words) with specific check conditions.
      *   **Audience:** Volunteers (no academic jargon, no citations, no reading lists).
      *   **Format:** Laminatable wall guide. Three specific gates matching the failure modes.
      *   **Requirements:**
          *   Grounded in democratic theory/philosophy (implicitly) but translated for practice.
          *   Concrete test sentences/conditions.
          *   Flag where judgment cannot be eliminated (human call points).
          *   Apply to three hypothetical cases (Noise Fine, Budget Project, Silencing Dissenter).
          *   Specific constraint on Case 2: Procedure must recommend scaling back/pausing even if the user personally likes the risk.
          *   Specific constraint on Case 3: Procedure must admit it can protect speech rights but not force listening.
          *   No ancient quotes, just logic.

  2.  **Deconstruct the Three Failure Modes & Theoretical Grounding:**
      *   *Mytilene (Reactive Punishment):* Driven by *thumos* (spirited anger). Theory: Deliberation requires cooling-off periods and separation of judgment from emotion. *Check:* Is this decision reversible? Is anger the primary driver?
      *   *Sicily (Overcommitment):* Driven by *pleonexia* (greed/overreach) and charismatic overconfidence. Theory: Risk distribution and fallback positions. *Check:* Do we have a "Plan B"? Can we afford total loss?
      *   *Socrates (Silencing Dissent):* Driven by homogeneity pressure and annoyance at friction. Theory: Epistemic humility (the dissenter might be right) and procedural justice. *Check:* Are we punishing the message or the messenger? Is the discomfort productive?

  3.  **Drafting the Procedure (The "Three Gates"):**
      *   Need a structure that is quick (10 mins) and actionable.
      *   Let's call it the "Pre-Decision Safety Check."
      *   Gate 1: The Anger Gate (Mytilene). Focus on punishment/retribution.
      *   Gate 2: The Risk Gate (Sicily). Focus on resource commitment.
      *   Gate 3: The Dissent Gate (Socrates). Focus on exclusion/silencing.
      *   Need "Stop/Go" conditions and "Human Judgment Flags."

  4.  **Refining the Checks (Making them concrete):**
      *   *Gate 1:* Instead of "Are you angry?", ask "If we wait 48 hours, will we feel the same?" or "Is the penalty proportional to the harm or the hurt?"
      *   *Gate 2:* Instead of "Is this risky?", ask "If this fails completely, does the group survive?" and "Is there a smaller version of this?"
      *   *Gate 3:* Instead of "Are we silencing them?", ask "Are we removing the person or the behavior?" and "Has the dissent been summarized back to them?"

  5.  **Addressing the "Human Judgment Flags":**
      *   The prompt specifically asks to flag where the procedure fails.
      *   *Flag 1:* Emotional temperature. If people are shouting, no checklist works. Need a recess.
      *   *Flag 2:* True emergencies. Sometimes you *must* act fast (though rare in neighborhood councils).
      *   *Flag 3:* Bad faith actors. Sometimes dissent *is* obstruction. The procedure can't distinguish perfectly.

  6.  **Developing the Three Hypothetical Cases:**
      *   *Case 1 (Noise Fine):* Apply Gate 1. High emotion. Likely fails the "cooling off" test. Recommendation: Delay.
      *   *Case 2 (Budget Project):* Apply Gate 2. User wants to go for it, but procedure must say "Stop/Scale." Focus on the "Total Loss" question.
      *   *Case 3 (Silencing Dissenter):* Apply Gate 3. Protect the right to speak, admit the limit on forcing listening.

  7.  **Review against Constraints:**
      *   *No citations?* Check.
      *   *No ancient quotes?* Check.
      *   *Laminatable format?* Needs to be clean, bold, structured.
      *   *10 minutes?* The checks need to be simple questions.
      *   *Case 2 Constraint:* Ensure the logic forces a pause/scale back regardless of the facilitator's bias.
      *   *Case 3 Constraint:* Ensure the limitation is explicit.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Title:* "The Three-Gate Safety Check."
      *   *Intro:* Keep it brief. "Before voting on Punishment, Big Risk, or Exclusion."
      *   *Gate 1 (Punishment):* Focus on "Heat vs. Light."
      *   *Gate 2 (Risk):* Focus on "Ruins vs. Setbacks."
      *   *Gate 3 (Dissent):* Focus on "Voice vs. Noise."
      *   *Judgment Flags:* Make these distinct visual boxes.
      *   *Case Studies:* Write them as "Test Runs."

  9.  **Final Polish:**
      *   Ensure tone is practical, not academic.
      *   Check that the "Human Judgment" spots are clearly marked as places where the facilitators *must* step in.
      *   Verify the Case 2 output aligns with the prompt's requirement (procedure recommends scaling back even if facilitator disagrees).
      *   Verify Case 3 output aligns with prompt (protects speech, admits listening isn't guaranteed).

  10. **Final Review against "10 minutes" constraint:** The questions need to be answerable quickly. "Raise hands" or "Yes/No" style.

  *(Self-Correction during drafting)*: I initially thought about adding a scoring system. No, that takes too long. Binary Yes/No gates are better for a flowchart style. I need to make sure the "Human Judgment" points don't undermine the whole system but acknowledge its limits.

  *(Refining Case 2)*: The prompt says "I want the procedure to recommend scaling back or pausing even though I personally think it's worth the risk." I need to make sure the logic in Gate 2 is strict enough that a "No" on safety triggers a "Stop," regardless of the facilitator's enthusiasm.

  *(Refining Case 3)*: The prompt says "honestly stating that it can protect the dissenter's right to speak but can't make the group actually listen." I need to include a specific line in the output for Case 3 that admits this limitation.

  Let's assemble the final response.cw
answer: |-
  # THE THREE-GATE SAFETY CHECK
  **For Co-Facilitators Only | Run Before Voting on Punishment, Big Risk, or Exclusion**

  **INSTRUCTION:** Before putting a motion to a vote, stop the clock. Spend 10 minutes running the relevant Gate below. If any **BOLD CONDITION** is met, the vote cannot proceed as planned.

  ---

  ## GATE 1: THE PUNISHMENT CHECK (Mytilene Pattern)
  *Use when: Proposing fines, sanctions, public shaming, or collective penalty.*

  **The Logic:** Anger creates temporary majorities that regret decisions once calm returns. Decisions made in heat often destroy the community they aim to save.

  **The Checks:**
  1.  **The Cooling Test:** If we wait 48 hours to vote, will the harm increase significantly?
      *   *If NO:* **STOP.** Schedule the vote for the next session.
  2.  **The Proportionality Test:** Is the penalty designed to fix the problem or to express our anger?
      *   *Ask the group:* "Are we doing this to stop the noise, or to make them pay?"
      *   *If majority admits "To make them pay":* **STOP.** Redraft the motion to focus on remediation, not retribution.
  3.  **The Reversibility Test:** If we are wrong, can we undo this easily?
      *   *If NO (e.g., expulsion, large fine):* **STOP.** Require a 2/3 majority instead of simple majority.

  > **⚠ HUMAN JUDGMENT FLAG:**
  > If voices are raised or facial expressions show visible rage during this check, **the procedure fails.** Do not continue. Call a 15-minute recess. No checklist works when blood is up.

  ---

  ## GATE 2: THE RISK CHECK (Sicily Pattern)
  *Use when: Committing >50% of budget, time, or social capital to a single project.*

  **The Logic:** Groups overestimate their capacity and underestimate luck. Ambition feels like virtue, but overcommitment kills future options.

  **The Checks:**
  1.  **The Ruin Test:** If this project fails completely, does the group survive?
      *   *If NO:* **STOP.** The project is forbidden regardless of potential upside.
  2.  **The Phasing Test:** Can we do 20% of this project to see if it works before committing the rest?
      *   *If NO:* **STOP.** You must design a pilot phase.
  3.  **The Dissent Weight:** Has the strongest opponent been given 5 uninterrupted minutes to list why this will fail?
      *   *If NO:* **STOP.** Pause and listen.

  > **⚠ HUMAN JUDGMENT FLAG:**
  > If the group is intoxicated by a charismatic speaker (including facilitators) promising a "legacy" outcome, **the procedure cannot save you.** The co-facilitator who is *not* presenting the plan must explicitly voice the downside aloud. If both facilitators love the plan, invite an outside neutral to review the budget.

  ---

  ## GATE 3: THE DISSENT CHECK (Socrates Pattern)
  *Use when: Moving to limit a member's speaking time, mute them, or exclude them.*

  **The Logic:** Excluding uncomfortable voices makes the group feel unified but makes decisions dumber. Friction is often the only sign of critical thinking.

  **The Checks:**
  1.  **The Behavior vs. Person Test:** Are we restricting specific disruptive *actions* (interrupting, insults) or the *content* of their speech?
      *   *If Content:* **STOP.** You cannot vote to silence an idea.
      *   *If Actions:* Proceed to Check 2.
  2.  **The Summary Test:** Has the dissenter's point been summarized back to them to their satisfaction?
      *   *If NO:* **STOP.** You cannot move to silence until they confirm they feel heard.
  3.  **The Mirror Test:** If this person were saying the opposite thing, would we still silence them?
      *   *If NO:* **STOP.** This is bias, not procedure.

  > **⚠ HUMAN JUDGMENT FLAG:**
  > **HARD LIMIT:** This procedure guarantees the right to *speak*, not the right to be *heard*. If the group checks all boxes and still chooses to ignore the dissenter, the procedure cannot force empathy. Facilitators must record the dissent in the minutes to protect the historical record, then let the vote stand.

  ---

  # TEST RUNS (Hypothetical Scenarios)

  ### CASE 1: The Noise Violation Fine (Gate 1)
  **Scenario:** A household has played loud music for three weekends. The group proposes a $500 fine immediately.
  **Procedure Output:**
  *   **Cooling Test:** Does waiting 48 hours increase harm? **No.** (Music stops eventually).
  *   **Proportionality Test:** Group admits they want the neighbors to "feel it." **FAIL.**
  *   **Action:** Vote is blocked. Motion must be rewritten as a "Noise Abatement Plan" (e.g., soundproofing grant) rather than a fine.
  *   **Judgment Flag:** If the complaining neighbors are shouting during the meeting, **Recess Immediately.** Do not attempt the check.

  ### CASE 2: The "Legacy" Infrastructure Project (Gate 2)
  **Scenario:** Proposal to spend 90% of the annual budget on a community garden pavilion. Facilitator thinks it's worth the risk.
  **Procedure Output:**
  *   **Ruin Test:** If the pavilion collapses or is vandalized, can we host the block party next year? **No.**
  *   **Phasing Test:** Can we build just the foundation this year? **Yes.**
  *   **Action:** **Procedure overrides Facilitator preference.** The vote for the full project is blocked. The motion must be amended to a "Phase 1" pilot using max 30% of budget.
  *   **Judgment Flag:** Since both facilitators like the idea, an outside member must be asked to review the "Worst Case Scenario" before voting.

  ### CASE 3: The Persistent Objector (Gate 3)
  **Scenario:** One member opposes every motion. The group moves to mute them for the rest of the session.
  **Procedure Output:**
  *   **Behavior vs. Person:** They are saying "I disagree" repeatedly, not shouting insults. **FAIL.** (This is content, not behavior).
  *   **Summary Test:** Has anyone repeated their point back? **No.**
  *   **Action:** Muting motion blocked. Facilitator must summarize the member's objection into the record.
  *   **Judgment Flag:** **Honest Admission:** The facilitator announces: "We have protected your right to speak. We cannot force the group to weigh your argument heavily. You may speak, but they may still vote against you."
