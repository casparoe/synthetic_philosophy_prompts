f ad hoc1/ad hoc2/ad hoc3 hypotheses, the sociology-of-science comparison with Kuhn, and the historical appraisal of programmes like Marxism or psychoanalysis). Keep the plan focused on the conceptual dependency structure and the misconception sequence.
