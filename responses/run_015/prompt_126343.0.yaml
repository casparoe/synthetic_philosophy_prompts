  # Teaching Plan: Lakatos's Methodology of Scientific Research Programmes
  **Session Duration:** 50 Minutes
  **Level:** Advanced Undergraduate Philosophy of Science
  **Topic:** From Naive Falsificationism to Research Programmes

  ## I. Scope Boundaries (Explicit Exclusions)
  *To maintain focus on the conceptual dependency structure, the following will **not** be covered in this session:*
  1.  **Formal Taxonomy:** The technical distinctions between *ad hoc*₁, *ad hoc*₂, and *ad hoc*₃ hypotheses.
  2.  **Sociological Comparison:** No comparison with Thomas Kuhn's paradigms or incommensurability.
  3.  **Historical Appraisal:** No evaluation of non-physics programmes (e.g., Marxism, Psychoanalysis) as scientific or pseudoscientific.

  ---

  ## II. Session Timeline & Conceptual Flow

  ### 0:00 – 0:08 | Phase 1: The Failure of Naive Falsificationism
  **Goal:** Establish the necessity of Lakatos's machinery by demonstrating the insufficiency of Popperian naive falsificationism.
  **Activity:**
  *   Present the logical form of naive falsificationism: *If Theory T implies Observation O, and not-O is observed, then T is false.*
  *   **Prompt:** Ask students why, historically, scientists rarely abandon a theory immediately upon encountering a single anomaly.
  *   **Key Point:** Establish that an anomaly does not logically kill a theory because the observation relies on auxiliary assumptions (ceteris paribus clauses, instrument reliability, background conditions).
  *   **Transition:** If we cannot falsify a theory in isolation, we need a model of science that explains how theories rationally survive anomalies without becoming immune to evidence. This motivates the structural distinction between the **Hard Core** and the **Protective Belt**.

  ### 0:08 – 0:20 | Phase 2: The Hard Core and Protective Belt
  **Goal:** Introduce the structural components of a Research Programme using the Newtonian case.
  **Case Study:** The Newtonian Programme (Uranus/Neptune).
  **Instructional Constraints:**
  *   **Must Show:** The inverse-square law and laws of motion constitute the **Hard Core** (protected by negative heuristic). The assumption regarding the number of known planets constitutes the **Protective Belt** (revised by positive heuristic).
  *   **Must Avoid:** Do **not** suggest that Einstein's General Relativity replacing Newton is an example of belt modification. Explicitly state that this represents the abandonment of one programme for another, not an internal adjustment.
  **Addressing Misconception #2 (Belt = Ad Hoc Immunization):**
  *   **Timing:** Immediately after defining the Protective Belt.
  *   **Intervention:** Students will assume the belt is merely a device to immunize the core from refutation.
  *   **Correction:** Use the Neptune prediction. Leverrier and Adams did not merely tweak parameters to fit Uranus's existing data (accommodation); they used the revised belt to predict the *novel* position of an unseen body (Neptune).
  *   **Takeaway:** A belt adjustment is rational only if it yields novel predictions, not if it merely accommodates known anomalies.

  ### 0:20 – 0:35 | Phase 3: Progressive vs. Degenerating Problem Shifts
  **Goal:** Define the criterion for appraising the health of a research programme over time.
  **Concepts:**
  *   **Theoretical Progress:** New auxiliary hypotheses explain the previous anomaly *plus* predict novel facts.
  *   **Empirical Progress:** Some of these novel facts are corroborated.
  *   **Degenerating Shift:** The programme survives only by accommodating known anomalies without predicting new facts (or predictions are consistently falsified).
  **Addressing Misconception #1 (Degenerating = False):**
  *   **Timing:** Precisely when introducing the definition of a degenerating shift.
  *   **Intervention:** Students will equate "degenerating" with "falsified" or "irrational to pursue."
  *   **Correction:** Clarify that a degenerating programme is not necessarily *false* (the hard core might still be true), but it has lost its heuristic power. It is rational to abandon it only if a rival programme is available that explains everything the degenerating one did *plus* novel facts.
  **Addressing Misconception #3 (Lakatos = Popper + Time-Delay):**
  *   **Timing:** After both views (Popper's falsificationism and Lakatos's MSRP) are fully in view.
  *   **Intervention:** Students will view Lakatos as simply allowing scientists more time to fix theories before falsification applies.
  *   **Correction:** Emphasize the **Unit of Appraisal**. Popper appraises single conjectures/theories. Lakatos appraises *sequences* of problem shifts (the programme history). It is not a time-delay on falsification; it is a shift from evaluating static theories to evaluating dynamic research trajectories.

  ### 0:35 – 0:45 | Phase 4: Check-for-Understanding Assessment
  **Goal:** Verify application of the progressive/degenerating distinction to a novel scenario.
  **Activity:** Present the following hypothetical trajectory on the board/screen.

  > **Hypothetical Case: The "Dark Fluid" Programme**
  > *   **Stage 1:** Theories posits a "Dark Fluid" to explain galaxy rotation speeds (Hard Core: Fluid exists; Belt: Fluid density varies).
  > *   **Stage 2:** An anomaly arises regarding gravitational lensing. Theorists adjust the Belt (Fluid interacts with light) to fit the lensing data exactly. No new predictions are made.
  > *   **Stage 3:** A new anomaly arises regarding cosmic microwave background radiation. Theorists adjust the Belt again (Fluid pressure changes over time) to fit this data. No new predictions are made.
  > *   **Stage 4:** A rival "Modified Gravity" programme predicts a specific distortion in gravitational waves that is subsequently observed.

  **Question:**
  "Based on Lakatos's criteria, characterize the problem shift from Stage 1 to Stage 3. Is the 'Dark Fluid' programme currently progressive or degenerating, and does this classification alone dictate its immediate rejection?"

  **Expected Answer Key:**
  *   **Classification:** Degenerating. The belt adjustments in Stages 2 and 3 only accommodated known anomalies without generating novel predictions.
  *   **Rejection:** It does not dictate *immediate* rejection. Rejection is rational only if a rival programme (like "Modified Gravity") demonstrates theoretical and empirical progress over it.

  ### 0:45 – 0:50 | Phase 5: Conclusion & Recap
  **Goal:** Consolidate the dependency structure.
  **Summary:**
  1.  Naive falsificationism fails because anomalies target the whole system, not just the core.
  2.  The Hard Core/Belt distinction explains how theories survive rationally.
  3.  The Progressive/Degenerating distinction explains when that survival becomes irrational stagnation.
  **Final Reminder:** Reiterate that we are appraising the *history of the programme*, not a single snapshot, and that "degenerating" is a comparative status, not a truth-value judgment.

  ---

  ## III. Instructor Notes on Misconception Management

  | Misconception | Trigger Point in Lecture | Required Intervention |
  | :--- | :--- | :--- |
  | **1. Degenerating = False** | During Phase 3 (Prog/Deg definitions). | Explicitly state: "Degenerating refers to heuristic power, not truth. A programme can be degenerating but true; we abandon it for a more progressive rival, not because it is proven false." |
  | **2. Belt = Ad Hoc Immunization** | During Phase 2 (After defining Belt). | Use Neptune case: "If they had only fit Uranus's orbit, it would be ad hoc. Because they predicted Neptune's location, it was progressive. The belt is for prediction, not just protection." |
  | **3. Lakatos = Popper + Time** | During Phase 3 (Comparison). | Explicitly state: "This is not about giving scientists more time. It is about changing the object of evaluation from a single theory to a sequence of theories." |
