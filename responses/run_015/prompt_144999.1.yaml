answer: |-
  Here is a structural plan for the 50 minutes. It prioritizes logical dependency over historical chronology. Your instinct is correct: you must establish the **selection pressure against cooperation** (One-Shot) before you introduce the **mechanism that relieves it** (Iteration). If you reverse this, students conflate "cooperation evolves" with "cooperation is good for the group."

  ### 1. The Sequence (Order & Rationale)

  **0:00–0:10: The Trap (One-Shot PD)**
  *   **Goal:** Establish that cooperation is *individually costly* regardless of the partner's move.
  *   **Why here:** You need to create the tension. If you don't prove that Defection is the dominant strategy in a single interaction, "reciprocity" looks like altruism by another name.
  *   **Key Move:** Do not use $T, R, P, S$. Use "Benefit ($b$)" and "Cost ($c$)." Show that $b - c < b$ (receiving help is better than mutual help) and $0 > -c$ (mutual defection is better than being suckered).
  *   **Defuse:** "Cooperation is what's good for the group." (Show that the group maximizes payoff at Mutual Cooperation, but the *individual* maximizes at Defection).

  **0:10–0:25: The Escape (The Shadow of the Future)**
  *   **Goal:** Introduce Iteration not as "meeting again," but as **probability of continuation ($w$)**.
  *   **Why here:** This distinguishes your lecture from Kin Selection (assortment by genetics) and next week's Reputation (assortment by information). This is assortment by *time*.
  *   **Key Move:** Frame $w$ as a parameter, not a feeling. It is the probability the game continues. If $w$ is low, the "end game" effect triggers backward induction to immediate defection.
  *   **Defuse:** "In real life you meet again, so one-shot is fiction." (Counter: Many interactions *are* one-shot; the theory explains when cooperation *shouldn't* happen as much as when it should).
  *   **Defuse:** "Shadow of the future = Trust." (Trust implies uncertainty about the partner; $w$ is certainty about the *interaction structure*).

  **0:25–0:35: The Strategy (TFT & Stability)**
  *   **Goal:** Show *how* cooperation is enforced (Contingency).
  *   **Why here:** Now that the math allows cooperation, how do agents achieve it?
  *   **Key Move:** Tit-for-Tat (TFT) as a heuristic for "contingent cooperation." It makes my move correlated with yours.
  *   **Defuse:** "TFT won the tournament, so that's the answer." (Tournaments are not evolution).
  *   **Smuggle (Noise):** Introduce error. If TFT meets TFT with noise, they lock into defection loops. Solution: **Generous TFT** (forgive sometimes). This prevents the "unconditional retaliation" misconception.

  **0:35–0:45: The Origin (The Bootstrapping Problem)**
  *   **Goal:** Explain why, if TFT is stable, the world isn't full of cooperators.
  *   **Why here:** This bridges the gap between "can evolve" and "did evolve."
  *   **Key Move:** A single TFT mutant in a population of AllD gets suckered once and dies. TFT needs a cluster to invade.
  *   **Smuggle (Basin of Attraction):** You don't need the math, just the concept: There is a barrier to entry.
  *   **Defuse:** "Evolution finds the best strategy." (It finds the *stable* strategy, which might be AllD).

  **0:45–0:50: Synthesis & Closing**
  *   **Goal:** Boundary setting.
  *   **What to Refuse:** Do not derive the inequality $w > c/b$. State it as a threshold concept. Do not explain *how* they recognize each other (that drifts into cognition/reputation).
  *   **Closing Question:** See below.

  ---

  ### 2. The Carrying Example

  You want to use your own system. That is fine, provided you audit it against these constraints. If your example violates these, the students will conflate Direct Reciprocity with Kin Selection or Mutualism-by-default.

  **What the Example MUST Have:**
  1.  **Identifiable Dyads:** Individual A must know they are interacting with Individual B (not just "a member of the species").
  2.  **Role Reversal:** A must be able to help B, and later B must be able to help A (symmetry of opportunity).
  3.  **Private History:** The decision to help must depend on *past interactions between this specific pair*, not on B's reputation with C (that's next week's lecture).
  4.  **Cheating Viability:** It must be physically possible to take the benefit without paying the cost (otherwise it's not a dilemma, it's a constraint).

  **What the Example MUST Lack:**
  1.  **Obvious Kinship:** If your system is a family group, students will default to Hamilton's Rule. You must explicitly state: "Assume $r=0$ for this example."
  2.  **Audience Effects:** No third parties watching. If others watch, it becomes reputation.
  3.  **Simultaneous Benefit:** Avoid examples where helping *immediately* benefits the actor (e.g., group defense where I fight and we both survive). The cost must be upfront, the return delayed.

  **Recommendation:** If your system risks kinship confounds, use **Primate Grooming** (unrelated adults) or **Vampire Bat Regurgitation** (explicitly non-kin dyads). If you use your own system, add a disclaimer slide: *"We are treating these partners as unrelated strangers to isolate the mechanism of reciprocity."*

  ---

  ### 3. Misconceptions (The Map)

  You listed four strong ones. Here is where to place them, plus the fifth "hidden" one.

  1.  **"One-shot is a philosopher's fiction."**
      *   *Where:* Segment 1 (The Trap).
      *   *Fix:* Acknowledge it's rare in humans, but common in nature (e.g., predator-prey, one-off encounters). The logic defines the baseline selection pressure.
  2.  **"Cooperation is what's good for the group."**
      *   *Where:* Segment 1 (The Trap).
      *   *Fix:* Show the payoff matrix. The group max is $(R, R)$, but the individual max is $(T, S)$. Selection acts on the individual.
  3.  **"Shadow of the Future = Trust."**
      *   *Where:* Segment 2 (The Escape).
      *   *Fix:* "Trust" is psychological; $w$ is ecological. A vending machine has a 'shadow of the future' (if I put money, it gives soda), but no trust.
  4.  **"Tit-for-Tat is the evolutionary answer."**
      *   *Where:* Segment 3 (The Strategy).
      *   *Fix:* Introduce Noise. Strict TFT crashes with noise. Evolution favors *Generous* TFT or Win-Stay-Lose-Shift.
  5.  **The Hidden One: "Reciprocity requires cognitive calculation."**
      *   *Where:* Segment 3 (The Strategy).
      *   *Fix:* Students in "Human Behaviour" courses assume agents are rational economists. You must emphasize that these are **evolved heuristics**. A bacterium can reciprocate via quorum sensing; a human can reciprocate via emotion (anger/gratitude). The *logic* is game theory; the *mechanism* is biology.

  ---

  ### 4. The Smuggle & The Refusal

  **Can you fit both Bootstrapping and Noise?**
  Yes, but only if you treat them as "Why the world isn't perfect."
  *   **Noise** explains why strict retaliation fails (unravels cooperation).
  *   **Bootstrapping** explains why cooperation isn't ubiquitous (can't get started).
  *   **Link them:** "Even if we solve the noise problem with Generosity, we still have the starting problem. A lone cooperator dies."

  **What to Openly Refuse:**
  *   **The Math of Invasion:** Do not write out the ESS conditions for TFT vs AllD. Say "It requires a critical mass."
  *   **Cognitive Mechanisms:** Do not explain *how* they remember. That is psychology/neuroscience. You are explaining the *selection pressure* that would favor such a mechanism.
  *   **Indirect Reciprocity:** If a student asks "What if others see?", shut it down gently: "That is the mechanism for next week. Today, the interaction is private."

  ---

  ### 5. The Closing Question

  You need a question that distinguishes between memorizing "Shadow of the Future" and understanding the *dynamics* of Direct Reciprocity.

  **The Question:**
  > "Imagine a population where the probability of re-meeting ($w$) is very high (0.9), well above the threshold for cooperation to evolve. Yet, the population remains stuck in universal defection. Based on today's lecture, what is the most likely barrier preventing cooperation from emerging?"

  **The Answer Key:**
  *   *If they say:* "They don't trust each other." -> **Fail** (Psychological fallacy).
  *   *If they say:* "They don't know who each other are." -> **Partial** (Mechanism issue, but not the dynamic one).
  *   *If they say:* "A single cooperator cannot invade a population of defectors because they get exploited before finding another cooperator." -> **Pass** (Demonstrates understanding of the Bootstrapping/Basin of Attraction problem).

  This confirms they understand that *stability* (once established) is different from *invasibility* (getting started).
