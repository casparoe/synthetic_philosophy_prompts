answer: |-
  **Althea:** You look like you've been wrestling with ghosts again.

  **Balthazar:** Only the persistent ones. Bradley, mostly. I've been thinking about your paper on extending the Fregean model to collective intentionality. The idea that the "We" functions as an unsaturated concept, waiting to be completed by a shared content. It's elegant. But I'm afraid you've swept the regress under the rug.

  **Althea:** I expected you to say that. But the rug is empty. In the singular case, Frege solves Bradley by denying that the predicate is a separate object that needs gluing to the subject. The concept *is* the glue. It's inherently relational. I'm just arguing that the collective subject operates the same way. "We intend" isn't a sum of "I intend" plus "You intend" plus a binding relation. The "We" is a distinct logical form. It's unsaturated *toward* the individuals who constitute it, not the other way around.

  **Balthazar:** That's the sleight of hand. In the singular case, the unity of the proposition "Socrates is mortal" is secured because the thought is a unity in a single mind. The mind provides the container. But in the collective case, there is no super-mind. There is only you, and me, and perhaps others, spatially and metaphysically distinct. If there is no super-mind, the unity of the "We" cannot be primitive. It must be achieved. And achievement implies a process, or a structure, or a relation.

  **Althea:** Why must it be a relation? Why can't it be a mode of awareness? When I participate in a joint action, I don't first perceive myself, then perceive you, then infer a connection. I perceive *us* acting. The plural subject is given directly in the intentionality. It's not constructed; it's disclosed.

  **Balthazar:** Disclosed to whom? To you. And disclosed to me. So we have two separate disclosures. For there to be a genuine *collective* proposition—say, "We believe the project failed"—your disclosure and my disclosure must coincide. They must be bound together. If they aren't bound, you just have a private belief about a group, and I have a private belief about a group. We don't have a group belief. So, what binds your disclosure to mine?

  **Althea:** Nothing binds them, because they aren't separate items to be bound. That's the Fregean point. You're treating the individual intentions as atoms that need cement. I'm saying the individual intentions are abstractions from the collective intention. The primary unit is the "We." My individual participation is just a modulation of that collective stance. The unity is internal to the intention itself.

  **Balthazar:** That sounds mystical. If the primary unit is the "We," and the "We" is composed of distinct minds, you have to explain how distinct minds enter into this primary unit without losing their distinctness. If I stop believing the project failed, the "We" changes. So my mind is a constituent. If my mind is a constituent, and your mind is a constituent, and the "We" is the whole, we are back in the business of parts and wholes. And Bradley's question returns: what binds the parts to the whole?

  **Althea:** It's not a part-whole relation in the mereological sense. It's a logical dependence. Think of it like a function. $f(x)$. The function isn't a third thing sitting between the rule and the argument. It *is* the mapping. The collective intention is the function. The individuals are the arguments. The value is the shared state. You don't ask what binds the function to the argument; that's what a function *does*.

  **Balthazar:** But a function is an abstract object. Minds are concrete substances. You can't just map concrete substances into an abstract function without a mechanism. In the singular case, the mechanism is the mind's own synthetic power. I bind my subject and predicate. In the plural case, who does the synthesizing? If I synthesize the "We" in my head, it's my "We," not ours. If you synthesize it, it's yours. If we both synthesize it, we have two "We"s. How do we get one?

  **Althea:** We get one because the content of my synthesis includes *your* synthesis. I intend that *we* intend. And you intend that *we* intend. The reciprocity is built into the content.

  **Balthazar:** Ah, the reciprocity. Now we're getting somewhere. So, you have an intention $I_a$. Its content is "We intend $X$." Part of that content is my intention $I_b$. So your intention references mine. And mine references yours. But for your intention to successfully reference mine, there must be a fact of the matter that links them. There must be a relation of *mutual recognition*. Let's call it $R$. You stand in $R$ to me. I stand in $R$ to you.

  **Althea:** Fine. Call it a relation. But it's not a relation that generates a regress, because it's constitutive. It doesn't exist prior to the relata.

  **Balthazar:** That's the standard move, Althea. "It's internal!" But look closely. You have Mind A. You have Mind B. You have Relation $R$. Does $R$ exist? If yes, is it distinct from A and B? If it's not distinct, then A and B are identical, which they aren't. If it is distinct, then we have a complex: $A, B, R$. Now, what binds $R$ to $A$? If you say "nothing, it's internal," you're just asserting a brute fact. But Bradley's point is that brute facts of connection are unintelligible. If $R$ binds $A$ and $B$, $R$ must itself be related to $A$. Call that $R_1$. And $R$ to $B$, call that $R_2$. Now you need $R_3$ to bind $R$ to $R_1$. You're off to the races.

  **Althea:** You're applying the regress to the *constituents* of the group. I'm telling you the group isn't constituted by the individuals in that way. The "We" is a primitive. The individuals are derivatives.

  **Balthazar:** That's holism. And it saves you from the regress only by sacrificing the reality of the individuals. If the "We" is primitive, then *you* and *I* are not the fundamental agents. The Group is. But that contradicts the phenomenology. I feel my own effort. I feel my own commitment. I don't feel like a fragment of a group-mind. If I withdraw my consent, the group intention collapses. That means the group intention depends on me. If it depends on me, I am prior to it. If I am prior to it, and you are prior to it, then the "We" is posterior. And if it's posterior, it's a composite. And composites require binders.

  **Althea:** You're assuming priority implies temporal or ontological separation. But logical priority can be circular without being vicious. It's a coherentist structure. My intention supports yours, yours supports mine. The stability of the structure *is* the unity. There's no need for an external glue because the tension holds the arch together.

  **Balthazar:** An arch needs a keystone. Or friction. Or gravity. Something external to the stones themselves to keep them from falling. In the mental realm, what is the gravity? It has to be a shared norm, or a shared context. But a shared context is just another relation. A shared norm is a third entity. If we both appeal to Norm $N$ to bind our intentions, we now need to bind Me to $N$ and You to $N$. Bradley is waiting at the door of the norm.

  **Althea:** So you think the only way to avoid the regress is to admit that collective propositions are fictions? That there is no real "We believe," only "I believe that we believe" and "You believe that we believe"?

  **Balthazar:** Not necessarily fictions. But perhaps they are never fully unified in the way a singular thought is. A singular thought is a point. A collective thought is a network. And networks always have gaps between the nodes. The regress shows us that the gaps are unbridgeable by relations. So, the unity of the collective proposition must be of a different kind than the unity of the singular one.

  **Althea:** How so?

  **Balthazar:** In the singular case, the unity is given by the substance of the thinker. I am one thing, so my thought can be one thing. In the plural case, there is no single substance. So the unity cannot be substantial. It must be pragmatic. The "We" holds together not because of a metaphysical glue, but because acting as if it holds together works. The regress is blocked not by logic, but by action. We stop regressing because we have to act.

  **Althea:** That's a pragmatic dissolution, not a solution. It admits that logically, the collective proposition is incoherent, but we ignore it to get things done. I want more than that. I want to say the thought itself is valid.

  **Balthazar:** Then you have to accept that the "We" is a genuine ontological addition. You have to be a realist about groups. If the group is a real thing, over and above the members, then the "We" can be the subject in the same way "I" is. The group thinks the thought. The individuals are just the organs.

  **Althea:** That's too strong. It dissolves the individual too much. I want a middle path. The unsaturatedness of the collective concept... perhaps it's not that the concept binds the individuals, but that the individuals *saturate* each other.

  **Balthazar:** Now you're talking. If I saturate you, and you saturate me, we are mutually constitutive. But look at the structure of that saturation. It's a reciprocal relation. $A$ relates to $B$, $B$ relates to $A$. For this to be a single state of affairs, the two relating acts must be one. How can two acts be one?

  **Althea:** By having the same object.

  **Balthazar:** The object is the project's failure. But that's the content, not the form. We're talking about the form of the belief. The form is "We." For the form to be single, the framing of the content must be single. If I frame it, and you frame it, we have two frames. Unless... unless the framing is distributed.

  **Althea:** Exactly. Distributed framing. Like a stereoscopic image. Two eyes, one picture. You don't ask what binds the left eye's view to the right eye's view. The brain synthesizes them.

  **Balthazar:** But there *is* a brain in that analogy. A central processor. In the collective case, where is the brain? If there is no central processor, the synthesis is decentralized. But decentralized synthesis is just a lot of local syntheses hoping to match. If they don't match perfectly, do we still have a "We"?

  **Althea:** We have a degraded "We." Just as I can have a confused singular thought.

  **Balthazar:** But the regress isn't about confusion. It's about the possibility of unity at all. If the synthesis is decentralized, then the unity is an emergent property. And emergent properties depend on the base. If the base is distinct minds, and the property is a unified subject, you need a principle of emergence. That principle is the relation. And Bradley asks about the relation's relation.

  **Althea:** You're relentless. So, is your conclusion that collective intentionality is the graveyard of logical atomism?

  **Balthazar:** I think it's the place where logical atomism meets its limit. In the singular case, we can pretend the subject is a simple point. In the plural case, we can't. The subject is inherently spread out. And because it's spread out, the problem of unity—which Bradley identified—becomes visible. In the singular mind, the unity is hidden by the immediacy of consciousness. I don't feel the glue because I *am* the glue. In the collective, I feel the gap between me and you. So I see the need for glue. And when I look for the glue, I see it needs glue.

  **Althea:** So the "We" forces us to admit that unity is never final. It's always a task.

  **Balthazar:** Precisely. A singular thought is a gift of nature. A collective thought is an achievement of will. And achievements can always fail. The regress isn't a logical error; it's the description of the fragility of the bond. Every time we reaffirm the "We," we are stepping back from the edge of the regress. We are choosing to treat the relation as primitive, again and again.

  **Althea:** That's almost poetic. But it leaves me with a problem. If the unity is an achievement, it's temporal. It happens in time. But propositions are supposed to be timeless contents. "We believe" claims a truth that holds. If the unity is fragile and temporal, does the truth of the proposition flicker?

  **Balthazar:** Perhaps it does. Perhaps collective truth is inherently unstable. It depends on the continued maintenance of the relation. If I stop recognizing you as a partner in thought, the proposition "We believe" ceases to have a truth value, because the subject ceases to exist.

  **Althea:** So the subject of the proposition is ontologically dependent on the very act of asserting it.

  **Balthazar:** In the collective case, yes. In the singular case, I exist before I think. In the plural case, *We* exist only insofar as we think together.

  **Althea:** Then the Fregean model does hold, in a twisted way. The subject is unsaturated because it doesn't exist until it is saturated by the joint act. The "We" is a potentiality that becomes actual only in the predication.

  **Balthazar:** I can accept that. But don't call it a solution to Bradley. Call it an admission that Bradley was right about relations, but wrong to think they had to be static. The relation that binds the "We" is a verb, not a noun. It's the act of binding itself.

  **Althea:** So the regress stops because the binder is an activity, not an entity. You can't ask what binds the activity to the actors, because the activity *is* the actors in motion.

  **Balthazar:** Now you're speaking my language. The regress arises when we reify the bond. If the bond is a thing, it needs a bond. If the bond is a doing, it just is. Collective intentionality isn't a structure; it's a dance.

  **Althea:** A dance that requires two people to agree on the steps.

  **Balthazar:** And if they disagree on the steps, the dance stops, and the "We" vanishes. Bradley's regress isn't a logical puzzle to be solved. It's the silence that falls when the music stops.

  **Althea:** Then our dialogue is the proof of concept. As long as we keep engaging, the "We" of this conversation exists. The moment we stop, it dissolves back into two solitary minds.

  **Balthazar:** Exactly. So, shall we continue?

  **Althea:** We shall.
