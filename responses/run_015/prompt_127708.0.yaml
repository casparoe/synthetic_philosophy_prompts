answer: |-
  ### Candidate Cases and Selection

  **Case 1: The Architect.** An architect must choose between designing a building that fulfils her aesthetic vision (ground project) or one that maximises accessible space for the public (impartial demand).
  *Discard:* This collapses into a duty of care regarding disability access; the impartial demand is too strong, making the ground project morally suspect rather than optional.

  **Case 2: The Musician.** A soloist must choose between rehearsing for a career-defining concert (ground project) or covering a section player's shift to ensure orchestral balance (impartial demand).
  *Discard:* The impartial demand is too trivial to necessitate the agent's serious deliberation; we would not criticise her for failing to have the thought, so the 'one thought too many' condition fails.

  **Case 3: The Academic Sabbatical.** A senior lecturer plans to use a sabbatical for a definitive translation project (ground project) but is asked to defer to cover a departmental staffing crisis affecting student welfare (impartial demand).
  *Select:* This fits the institutional setting, the project is non-relational and optional, and the fiduciary nature of the role makes the impartial thought requisite rather than alienating.

  ***

  ### The Scenario

  Dr. Aris Thorne is a senior lecturer in philosophy who has secured a sabbatical to complete a definitive translation of an obscure eighteenth-century corpus, a project constitutive of his professional identity yet morally optional. During the sabbatical period, his department faces a modest but genuine staffing crisis that threatens undergraduate teaching quality across the board, requiring senior staff to volunteer for extra tuition. Impartial morality suggests he should defer his sabbatical to teach, thereby maximising general welfare within the institution. He is not formally contracted to defer, but the moral demand is present given his role as a steward of public education.

  ### Analysis of the Complaints

  **The Integrity Complaint**
  The integrity complaint bites here because impartial morality requires Aris to treat his ground project—the translation—as merely one satisfier among others in a calculus of institutional utility. Williams argues that integrity is violated when an agent is required to abandon the projects that give their life substance simply because the aggregate welfare weighs slightly heavier. The complaint is not merely that Aris bears a heavy cost (lost time); it is that the moral theory renders his identity-conferring commitment fungible. He is asked to step outside his life and view his own purposes from a neutral standpoint that grants them no special weight, which attacks the integrity of his agency.

  **The 'One Thought Too Many' Complaint**
  Conversely, the 'one thought too many' (OTTM) complaint does not bite. Williams's original objection was that an agent should not need to consult impartial morality to justify acting on deep personal commitments (e.g., saving a wife). Here, however, the agent is *sacrificing* a commitment in an institutional context where impartial consideration is structurally required. As a senior member of a public university, Aris *ought* to consider the welfare of the students and the fairness of burden-sharing. If he decided to take his sabbatical without even considering the staffing crisis, we would criticise him for selfishness or professional negligence. Thus, the explicit impartial thought ('I should help the department') is practically required from within the situation, not an alien intrusion.

  **The Load-Bearing Feature**
  The single load-bearing feature is the **fiduciary context of the deliberation**. Because Aris holds a role that entails stewardship of public goods, impartial deliberation is internal to the job description, neutralising the OTTM complaint. However, because the ground project is genuinely identity-conferring and morally optional, the demand to sacrifice it still triggers the Integrity complaint.

  **The Swap Test**
  If we replace the ground project (the translation) with a personal relationship (caring for a sick spouse), the second verdict flips. If Aris sacrifices caring for his spouse to teach, the Integrity complaint remains (perhaps intensifies). However, the OTTM complaint would now *bite*. We would not say he *must* have the thought 'I should leave my spouse to teach'; indeed, we might criticise him for having that thought at all. In the original case, the impartial thought is mandatory; in the swap case, it is alienating. This confirms the two complaints can come apart.

  **The Williamsian Rejoinder**
  A staunch Williamsian might argue that the separation is artificial. They could claim that the Integrity objection is doing all the work here: the reason the OTTM complaint doesn't bite is simply that the integrity violation is so clear that we accept the need for deliberation to confirm the tragedy. They might insist that if integrity were truly respected, the impartial thought would be idle even here, because the ground project should rule out the demand entirely. On this view, I have only separated them by constructing a case where professional norms mask the deeper alienation.

  **Honest Assessment**
  I believe the separation is real, though fragile. It turns on the distinction between *justifying action* (where OTTM applies) and *justifying sacrifice* (where impartial thought is often requisite). Your hypothesis—that the difference lies in whether a commitment arrives with a motivation of its own that can render deliberation idle—is precisely what this case turns on. In the sabbatical case, the professional role provides a competing motivation that makes deliberation non-idle; in the spouse case, the commitment's motivation renders impartial deliberation idle. Thus, the cases reveal that OTTM is sensitive to the *source* of the motivation (internal commitment vs. external role), whereas Integrity is sensitive to the *object* of the sacrifice (ground project vs. optional preference).

