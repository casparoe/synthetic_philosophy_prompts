prompt: |-
  I'm finishing a chapter on the ethics of price regulation and I keep getting stuck on something that isn't really about whether these policies work. It's about what the shape of them seems to assume.

  Take the common core of city rent stabilisation (I mean the stylised package, not any one statute): the cap binds only while the sitting tenant stays put, and when they leave the landlord can generally reset to market; a close relative who has been living there can inherit the tenancy; the owner can often evict in order to move themselves or a family member in; and new construction is usually exempt for some years. Minimum-wage regimes, at least the ones I know, are built almost the other way round in every respect: the floor attaches to the person rather than to the slot, so a brand new hire gets it on day one and there is no "vacancy" reset at all; but there are lower rates for younger workers and apprentices, and enforcement is mostly complaint-driven.

  What I want is the normative reconstruction, not the incidence stuff — I've read enough demand curves. What view of the thing being protected would make this the natural shape to hand both policies? The rent rules look like they protect incumbency itself, or the tenant's grip on a particular place; the wage rules look like they protect the person against a market, whoever they are and however long they've been there. But then why is it fine for a new tenant to pay market and not fine for a new hire to be paid less, and why does one regime have a "you can reset when there's nobody in situ" rule and the other doesn't, while the other has a "you can be paid less if you're young or still training" rule and the first doesn't?

  The thing I've been kicking around, which may be nonsense: call it disruption-sensitivity. The thought is that a price becomes regulable only where paying more would force someone to abandon a life they've already built around it, which would explain vacancy decontrol very neatly and also why the exemption is for new build. Is that something the practice actually presupposes, or just one story it happens to fit? If it is the right story it generalises wildly — renewal caps on insulin, on broadband, on tuition for continuing students — so why is housing basically the only place we do it, and would a "portable cap", where the tenant carries their discount to the next flat, be the more coherent version of the same idea? What would break if we did that?

  Also: the new-build exemption seems to presuppose that prices are signals we should mostly preserve, and the youth and apprentice rates seem to presuppose that a price is a transfer that can be adjusted to what someone deserves or produces. Does that mean the two regimes quietly rest on inconsistent views of what a price even is, or can one theory hold both?

  And I'd like to know which parts of all this the practice strictly needs versus which merely sit comfortably with it — where it's underdetermined, so that a couple of quite different theories would both produce exactly this architecture. I don't need pointers to papers, I need the argument laid out. Oh, and could you write it in British English, spelling and all — I'm pasting chunks of it into a UK journal submission and I don't want to have to go through fixing every -ize.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Ethics of price regulation, specifically comparing rent stabilization (rent control) and minimum wage regimes.
      *   **Core Observation:** Rent control protects *incumbency* (the tenant in the specific unit), allowing resets upon vacancy. Minimum wage protects the *person* (the worker), applying immediately regardless of tenure, but allows discounts for specific categories (youth/apprentices).
      *   **User's Hypothesis:** "Disruption-sensitivity." Regulation kicks in when paying more forces abandonment of an established life.
      *   **Key Questions:**
          1.  Is "disruption-sensitivity" the actual normative presupposition, or just a fitting story?
          2.  If it is the right story, why is housing unique? Would a "portable cap" be more coherent? What would break?
          3.  Do the exemptions (new-build vs. youth rates) imply inconsistent views of what a *price* is (signal vs. transfer)? Can one theory hold both?
          4.  Distinguish between what the practice *strictly needs* vs. what merely *sits comfortably* (underdetermination).
      *   **Constraint:** Write in British English (spelling, vocabulary) for a UK journal submission. No pointers to papers; lay out the argument directly.
      *   **Tone:** Philosophical, analytical, normative reconstruction (not empirical/incidence).

  2.  **Deconstruct the Comparison:**
      *   *Rent Control:* Protects the *relationship* between person and place. Logic: Security of tenure, preventing displacement, community stability. Vacancy decontrol acknowledges the landlord's property right to a return *eventually*, but not at the cost of existing stability.
      *   *Minimum Wage:* Protects the *dignity/survival* of the worker. Logic: A floor for decent living, preventing exploitation. No "vacancy decontrol" because exploitation isn't cured by turnover. Youth rates acknowledge human capital development (training) vs. immediate productivity.

  3.  **Evaluate "Disruption-Sensitivity":**
      *   *Strengths:* Explains vacancy decontrol perfectly (no disruption if no one is there). Explains new-build exemption (no one has built a life there yet).
      *   *Weaknesses:* Doesn't fully explain minimum wage structure. Minimum wage protects *new* hires too. Why? Because the harm is *exploitation* or *poverty*, not just *disruption*.
      *   *Refinement:* The underlying principle isn't just disruption; it's *vulnerability to hold-up problems* vs. *vulnerability to subsistence failure*.
      *   *Rent:* The hold-up problem. Once I move in, I'm sunk. Landlord has leverage.
      *   *Wage:* The subsistence problem. I need to eat regardless of tenure.
      *   *Conclusion:* "Disruption-sensitivity" is half the story (housing), but not the whole story (wages).

  4.  **Address the "Price as Signal vs. Price as Transfer" Tension:**
      *   *New-build exemption:* Preserves price as a signal for investment (supply side).
      *   *Youth rates:* Treats price (wage) as a reflection of productivity/training cost (investment in human capital).
      *   *Compatibility:* Both can be viewed through a *dynamic efficiency* lens. We regulate to prevent harm, but exempt where regulation would stifle future creation (new houses, new skills).
      *   *Inconsistency?* Not necessarily. Both acknowledge that price controls have supply-side costs, so they carve out spaces where supply needs to be encouraged.

  5.  **Address "Portable Caps" (Housing Vouchers/Entitlements):**
      *   *Why not portable?* Because the value is in the *specific unit* (location, community ties, school catchment), not just shelter. Portability assumes housing is fungible. It isn't.
      *   *What breaks?* Landlord incentives to maintain specific units. The link between tenant and community.

  6.  **Distinguish "Strictly Needs" vs. "Sits Comfortably" (Underdetermination):**
      *   *Strict Needs:* Some mechanism to prevent displacement (rent) and destitution (wage).
      *   *Sits Comfortably:* Vacancy decontrol (political compromise more than ethical necessity). Youth rates (could be subsidies instead).
      *   *Underdetermination:* The specific architectural choices (vacancy vs. no vacancy) are often political compromises between property rights and social protection, not pure ethical derivations.

  7.  **Drafting the Argument (incorporating British English):**
      *   *Vocabulary:* Stabilisation, programme, centre, labour, defence, analyse, etc.
      *   *Structure:*
          1.  Introduction: Acknowledge the asymmetry.
          2.  The Normative Core: Security vs. Subsistence.
          3.  Critique of Disruption-Sensitivity: It fits rent, fails wage.
          4.  The Nature of Price: Signal vs. Transfer (Dynamic Efficiency).
          5.  Portability and Fungibility: Why housing is special.
          6.  Underdetermination: What is necessary vs. contingent.
          7.  Conclusion.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I answer the "inconsistent views of price" question? *Adjustment:* Need to explicitly frame price as having a dual role: allocation signal and distributional mechanism. The regimes split the difference.
      *   *Check:* Did I address the "portable cap"? *Adjustment:* Emphasise the non-fungibility of housing (location value) vs. the fungibility of labour (in theory).
      *   *Check:* British English. *Adjustment:* Ensure "s" instead of "z" in organisation/standardisation, "labour", "centre", "programme". Use "whilst" occasionally if natural, but don't overdo it. Ensure tone is academic but accessible.

  9.  **Final Polish:**
      *   Ensure the distinction between *incumbency* (rent) and *personhood* (wage) is central.
      *   Make sure the "disruption" theory is treated respectfully but shown to be incomplete.
      *   Clarify the "underdetermination" point—this is crucial for the user's chapter.

  10. **Final Review against constraints:** No citations. British spelling. Argument-focused.

  *(Self-Correction on British English)*: I need to be careful with words like "analyse" vs "analyze", "organisation" vs "organization". I will ensure all suffixes are -ise/-isation. I will use "labour", "colour" (if applicable), "centre". I will avoid Americanisms like "apartment" (use "flat" or "dwelling").

  *(Refining the "Price" argument)*: The user asks if the regimes rest on inconsistent views. I should argue they rest on a *hybrid* view. Price is a signal *unless* it triggers a specific moral harm (displacement/exploitation), at which point it becomes a regulated transfer. The exemptions are the pressure valves.

  *(Refining the "Portable Cap")*: If we made rent control portable, it becomes a housing allowance. That changes the nature of the right from "security of tenure" to "access to shelter". That's a fundamental shift in the normative claim.

  *(Refining Underdetermination)*: What is strictly needed? Protection against the specific harm. The *mechanism* (vacancy decontrol vs portable) is the contingent part.

