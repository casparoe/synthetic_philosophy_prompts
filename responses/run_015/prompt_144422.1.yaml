answer: |-
  The asymmetry you have identified is not merely a technical divergence; it points to a deeper fracture in how we conceptualise the moral status of housing versus labour. Your hypothesis of 'disruption-sensitivity' is a compelling starting point, but it is ultimately incomplete. It explains the architecture of rent stabilisation rather well, but it fails to account for the universalism of the wage floor. To reconstruct the normative logic here, we must distinguish between protecting a *life plan* (housing) and protecting *agency* (labour).

  **The Normative Core: Security vs. Subsistence**

  The rent regime protects incumbency because the moral harm it seeks to prevent is *displacement*. The ethical claim is not that housing should be cheap in the abstract, but that a tenant should not be forced to abandon a specific web of relationships, schools, and routines because the price of the physical shell has shifted. This is why vacancy decontrol is coherent within this framework. Once the tenant leaves, the specific life plan attached to that unit dissolves. There is no disruption to prevent. The 'disruption-sensitivity' thesis holds here: the regulation binds only where there is a settled existence to disrupt.

  The minimum wage, conversely, protects subsistence and dignity, not incumbency. The moral harm is *exploitation* or *destitution*, which applies to a worker on day one just as much as to a worker with ten years' tenure. A new hire is not 'disrupted' by a low wage; they are *harmed*. Therefore, a 'vacancy reset' for wages would be normatively incoherent. It would imply that exploitation is permissible until a relationship stabilises, which contradicts the premise that the wage floor is a right of personhood, not a reward for loyalty.

  So, the shape of the policies assumes two different goods are being protected. Rent control protects the *continuity of a specific life*; the minimum wage protects the *viability of the labourer*.

  **The Price: Signal or Transfer?**

  You ask whether the exemptions imply inconsistent views of what a price is. The new-build exemption treats price as a *signal* (necessary to induce supply). The youth/apprentice rate treats price as a *transfer* (adjustable based on productivity or need).

  This is not necessarily an inconsistency, but rather a pragmatic acknowledgement of the dual function of prices in a mixed economy. Both regimes accept that prices generally *should* signal scarcity and value, but they carve out exceptions where the social cost of that signalling is deemed too high.

  In housing, the social cost is displacement. However, policymakers accept that if you suppress the price signal entirely, no new housing gets built. Hence the new-build exemption: we tolerate the 'signal' function for new stock to ensure future supply, whilst suppressing it for existing stock to ensure current stability.

  In labour, the social cost is poverty. However, policymakers accept that if the price of low-skill labour is set too high, employers will not 'buy' it (hire the young or untrained). Hence the youth rate: we tolerate a lower 'transfer' to encourage the acquisition of human capital.

  Both regimes rest on a single, hybrid theory of price: *Prices are allocation signals, except where they function as barriers to basic security, in which case they become regulated transfers, subject to supply-side constraints.* The architecture is consistent; it is the application of a 'safety valve' principle to prevent the regulation from killing the goose that lays the golden egg.

  **The Question of Portability**

  Your suggestion of a 'portable cap'—where the tenant carries the discount to the next flat—is the logical extension of the disruption-sensitivity thesis. If the harm is disruption, why tie the protection to the *unit* rather than the *person*?

  The reason practice rejects portability is that it reveals a hidden premise in rent stabilisation: housing is not treated as a fungible commodity. A flat in one neighbourhood is not a substitute for a flat in another. The value being protected is not just shelter, but *location-specific capital* (proximity to work, community ties, specific schools).

  If you made the cap portable, you would transform the policy from 'security of tenure' to 'housing allowance'. This would break the link between the tenant and the specific landlord. It would also shift the cost burden. Under unit-based control, the cost is borne by the landlord (in the form of suppressed returns on that specific asset). Under a portable cap, the cost is typically borne by the state (in the form of subsidies) or the market generally (if it acts as a voucher system).

  Furthermore, a portable cap assumes the tenant has the power to move. But the very tenants rent control protects are often those with the least mobility—the elderly, the disabled, the poor. Tying the protection to the unit acknowledges that for the most vulnerable, 'exit' is not a viable option. The protection must therefore be a shield against the landlord's power to terminate, not a subsidy for the tenant to shop around.

  **Underdetermination: What is Necessary?**

  This brings us to your final question: which parts of this architecture are strictly necessary, and which are merely contingent?

  1.  **Strictly Necessary:**
      *   **Rent:** Some mechanism to prevent arbitrary eviction or price gouging on *existing* tenancies. Without this, the 'security of tenure' claim collapses.
      *   **Wage:** A floor that applies to *all* workers immediately. Without this, the 'dignity of labour' claim collapses.

  2.  **Contingent (Underdetermined):**
      *   **Vacancy Decontrol:** This is not ethically required. A regime could theoretically cap rents regardless of turnover (strict rent control). The choice to allow resets is a political compromise to preserve landlord property rights and encourage turnover, not a logical necessity of the ethical claim.
      *   **Youth Rates:** These are not ethically required. One could argue that if a wage is too low to live on, it is too low for an apprentice. The existence of these rates is a concession to employer lobbying and human capital theory, not a strict deduction from the principle of a living wage.
      *   **New-Build Exemptions:** Similarly, one could argue that new tenants deserve protection too. The exemption is a supply-side incentive, not a normative requirement of tenant justice.

  **Conclusion**

  Your 'disruption-sensitivity' theory is half-right. It accurately describes the *housing* regime, which is fundamentally conservative in the literal sense: it seeks to conserve the status quo of the sitting tenant. But it does not describe the *labour* regime, which is fundamentally progressive: it seeks to establish a baseline for future engagement.

  The two regimes do not rest on inconsistent views of price, but on inconsistent views of the *vulnerability* being addressed. Housing regulation addresses the vulnerability of *sunk costs* (I have built a life here). Wage regulation addresses the vulnerability of *dependence* (I must sell my labour to eat).

  The architecture you observe is the result of trying to square these ethical imperatives with economic reality. The 'vacancy reset' in housing and the 'youth rate' in labour are the pressure valves. They are the points where the normative ideal yields to the pragmatic fear that if the price mechanism is stifled completely, the supply of the good (housing or jobs) will vanish. The practice does not strictly need these valves to be ethically coherent, but it arguably needs them to be empirically sustainable. The asymmetry you see is the scar tissue of that compromise.
