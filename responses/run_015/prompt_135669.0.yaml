prompt: |-
  Compare Gould and Lewontin's spandrels critique with Gould and Vrba's exaptation idea, but dont just do the standard surface comparison. I want you to dig into whether these are actually two different theories of evolutionary explanation or just the same anti-adaptationist move wearing different hats. Focus on the San Marco analogy—those triangular spaces between arches that exist purely as geometric byproducts, not designed features. Gould uses that to argue some biological traits are spandrels: structural leftovers that selection never built for their current role. But exaptation says those leftovers can get co-opted and refined. So here's the tension: if a trait starts as a spandrel but selection then shapes it, is its origin still a spandrel? Does that mean adaptationism misses half the story, or can adaptationists just absorb it by saying "it began as a spandrel but now it's an adaptation"?

  There's also an analogical problem I think breaks the comparison. The San Marco spandrels are geometric necessities—you literally cant build that dome without them. But biological "spandrels" might be more like leftover scaffolding that development could have arranged differently. Does that difference collapse the spandrels critique into the boring claim that "development constrains selection," which every biologist already accepts? Or is there still a distinctive anti-adaptationist point?

  Finally, tell me what kind of empirical finding—say about the origin of some complex trait—would actually move the needle between these framings, or whether the disagreement is really about what counts as an explanation rather than about facts. And be specifc: if the origin-vs-maintenance distinction is the crux, what evidence would settle it? Don't cite papers, just work it out from the concepts.
