      *   *Distributed Systems Angle:* In CS, we abstract away the hardware. In *The Prestige*, the hardware (the body) is the seat of consciousness. Migrating once vs. nightly: Parfit says no difference (continuity is what matters). The film says the *repetition* of death accumulates horror. It's not just a migration; it's a sacrifice.
