  What the theory is for
  To guide collective agents with internal moral disagreement on whether to execute action-swaps with external parties. It must determine when divergent valuations permit cooperation without requiring value convergence, ensuring decisions are stable, legitimate, and net-positive according to the group's own fragmented normative standards while navigating risks of empowerment and integrity loss.

  Requirements
  1. **Harmful Counterparties:** Must explain how handing over resources for ends we deem positively harmful is permissible if the return outweighs the harm *by our lights*, without endorsing their aims. This tests whether the theory allows instrumental complicity.
  2. **Non-Reciprocating Entities:** Must justify trades with entities (future people, animals) that cannot enforce deals, relying on proxy enforcement or duty-based obligation rather than mutual advantage, ensuring vulnerability isn't exploited. The case motivates a requirement for unilateral fidelity where contract law fails, ensuring promises to the powerless are kept.
  3. **Confidentiality:** Must resolve the tension where representatives know a trade benefits members' aims, but members would veto it due to symbolic costs or misinformation. It must decide if paternalism is permissible for gain. The case motivates a legitimacy constraint: does internal consent matter more than external impact?
  4. **Moral Uncertainty:** Must adjudicate trades where our primary moral view forbids the swap, but a secondary view (with moderate credence) strongly favors it, requiring a meta-normative calculus rather than simple majority rule. The case motivates a requirement to maximize expected choice-worthiness across credences.
  5. **Strategic Risk:** Must account for scenarios where performing first strengthens the counterparty to become a future rival, potentially negating long-term gains. Short-term utility cannot override existential risk. The case motivates a dynamic constraint on bargaining power shifts.
  6. **Source of Gains:** Address the user's worry: gains arise from *ordinal* moral disagreements, not non-moral beliefs. If we agree on facts, gains exist because I value Your Action > My Action, and vice versa. Shared facts do not preclude trade; shared values do. This is a confusion to be dissolved.
  7. **Distinctions:** Must not collapse *compromise* (splitting the difference) with *trade* (mutual gain via specialization) or *doing* harm with *allowing* harm via trade. The theory must preserve agency distinctions. This ensures the theory doesn't dissolve into simple aggregation.

  Genuine desiderata versus camp prejudices
  The ban on acting against one's best moral judgement is a camp prejudice rooted in deontological rigidity. Under moral uncertainty, maximizing expected choice-worthiness often requires acting against the most probable view to capture high-value outliers. Genuine desiderata are stability, legitimacy, and net-impact; prejudices are purity constraints that forbid instrumental cooperation with 'impure' actors. The theory must prioritize objective impact over subjective psychological comfort or virtue-signaling. Distinctions between integrity and obstinacy must be maintained.

  Conflicts
  Confidentiality and Internal Legitimacy cannot be jointly satisfied. If members would reject the trade, executing it secretly violates democratic accountability, yet revealing it kills the gains. This creates a paradox of representation. Similarly, Trading with Harmful Aims conflicts with Integrity Constraints: if we deem an action positively harmful, facilitating it—even for gain—may violate agent-relative prohibitions that no amount of consequentialist gain can override. You cannot have secret legitimacy and open gain. Furthermore, Strategic Risk conflicts with Immediate Gain: securing current benefits may empower a rival to destroy future value. A theory cannot maximize both short-term trade volume and long-term positional safety simultaneously when interests diverge.

  The requirement that does the most work
  The Harmful Counterparties requirement excludes the most theories. Pure consequentialism passes easily; deontological or virtue-ethical frameworks often fail because they forbid facilitating harm regardless of offsetting benefits. This requirement forces the theory to choose between outcome maximization and moral integrity, acting as the primary filter for viable approaches. It demands a justification for complicity that most non-consequentialist theories cannot provide without collapsing. It effectively separates aggregative views from agent-centered views, determining whether the theory permits getting one's hands dirty for the greater good.

  Scorecard
  **Own Terms:** Fails on enforcement and harmful aims due to lacking a shared metric for comparison. **Common Currency:** Handles uncertainty well but collapses moral distinctions into a single utility function, violating the non-collapse distinction. **Compromise/Portfolio:** Best for internal disagreement but struggles with external confidentiality and strategic risk. None fully survive the Harmful Counterparty constraint without compromising integrity. Each approach sacrifices a different requirement to function. The Common Currency view is strongest on uncertainty but weakest on integrity; Own Terms is strongest on integrity but weakest on coordination.

  What would change my mind
  I would drop the Confidentiality requirement first. If a trade is truly optimal, member rejection suggests epistemic failure on their part, not a theoretical flaw. A case showing secret trades inevitably leading to institutional corruption would reorder the list. My reasoning likely fails by underestimating the long-term reputational costs of secrecy versus the immediate gains of the trade. Trust is a resource; burning it for short-term gain may be theoretically coherent but practically suicidal. If transparency proves instrumentally necessary for long-term cooperation, confidentiality becomes untenable.
