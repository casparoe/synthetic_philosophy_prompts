  He vowed the machine would bear the heavy load,
  And leave the fifteen hours for the mind.
  When need absolute ceased to be a goad,
  And cast the ancient struggle far behind.
  Then art would bloom in gardens of repose,
  While clocks ran slow to measure out the day.
  No longer driven by the market's throes,
  We'd live as wise men chose to live and play.

  But status needs possess a deeper root,
  Than bread or shelter ever could demand.
  The gig is gold, the metric is the fruit,
  That turns our free time back to forced command.
  The coin becomes the life we meant to lead,
  A proxy for the living that we need.
