answer: |-
  ## Take-Home Exam Question: Anthropic Reasoning & Indexical Uncertainty

  **Course:** PHIL/COSC 202: Philosophy of Mind & Science
  **Time Allowed:** 60–90 Minutes
  **Word Limit:** 800 words maximum

  **Instructions:**
  Answer both parts (A and B). You may assume the definitions provided in the stem are the only ones required. Focus on distinguishing between the mathematical application of Bayes' Theorem and the philosophical justification for the assumptions used.

  **The Setup:**
  Physicists are debating two theories about the total number of conscious observers who will ever exist in our universe.
  *   **Theory Small ($T_S$):** Exactly $10^{11}$ (100 billion) observers will ever exist.
  *   **Theory Big ($T_B$):** Exactly $10^{14}$ (100 trillion) observers will ever exist.
  *   **Prior:** Before considering your own existence, you assign equal credence to both: $P(T_S) = P(T_B) = 0.5$.

  You then learn your approximate "birth rank" (your position in the sequence of all observers): **$n \approx 60 \text{ billion}$**.

  **Part A (12 marks):**
  Calculate or describe the posterior probability of $T_S$ vs $T_B$ under three distinct frameworks:
  1.  **SSA (Self-Sampling Assumption):** Treat yourself as a random sample from the set of all observers in your reference class.
  2.  **SIA (Self-Indication Assumption):** Weight the prior probability of a world by the number of observers in it, then treat yourself as a random sample.
  3.  **Combined:** Apply the SIA weighting to the prior, and the SSA likelihood to the evidence.

  **Part B (8 marks):**
  **The Twist:** Suppose you learn a new piece of indexical information: Across the entire history of the universe, only **10,000 observers ever** (under *either* theory) possess the cognitive capacity to explicitly reason about SSA vs SIA. You are one of them.
  Does this new information screen off the update from your birth rank? Does it double-count the evidence? Explain whether the result differs for a proponent of SSA vs. SIA, and briefly note why one of these results might feel philosophically "fishy" (the Presumptuous Philosopher objection).

  ***

  ## Model Answer (For TA Use Only)

  **Part A: The Standard Update**
  Under **SSA**, we calculate the likelihood of having rank $n=60$ billion given each theory. If you are a random observer, the probability of being rank $n$ is $1/N$ (assuming $n < N$).
  $P(E|T_S) = 1/10^{11}$ and $P(E|T_B) = 1/10^{14}$.
  The likelihood ratio is $1000:1$ in favor of $T_S$. Since priors are equal, the posterior strongly favors **Small**. This is the Doomsday Argument structure: being early suggests the total pool is small.

  Under **SIA**, the assumption is that you should reason as if you were randomly selected from all *possible* observers. This effectively weights the prior by $N$.
  $P_{SIA}(T_S) \propto 0.5 \times 10^{11}$ and $P_{SIA}(T_B) \propto 0.5 \times 10^{14}$.
  The SIA prior favors **Big** by $1000:1$. When we apply the SSA likelihood ($1/N$) to this shifted prior, the factors of $N$ cancel out.
  $Posterior \propto (0.5 \times N) \times (1/N) = 0.5$.
  Under the **Combined** approach, the posterior remains **50/50**. The SIA prior shift exactly offsets the SSA likelihood shift.

  **Part B: The Thinker Twist**
  The new evidence ($E_2$) is that you are one of 10,000 "Thinkers." Crucially, the *absolute number* of Thinkers is fixed at 10,000 under both theories.
  For **SSA**, the likelihood of being a Thinker is the fraction of observers who are Thinkers: $10,000/N$.
  $P(E_2|T_S) = 10^4/10^{11}$ and $P(E_2|T_B) = 10^4/10^{14}$.
  This ratio is again $1000:1$ favoring **Small**. It does not screen off the birth rank evidence; it structurally replicates it. Being a member of a fixed-size subset is more likely in a smaller total population.

  For **SIA**, the prior favors **Big** ($1000:1$). The likelihood of being this specific Thinker is $1/N$. Again, these cancel. The posterior remains **50/50**.

  **Settled vs. Contested:**
  Mechanically, the Bayesian updating is settled: SSA yields a Doomsday update; SIA cancels it. The contestation is philosophical. SIA implies you can favor the "Big" theory *prior* to empirical data simply because it contains more observers. Critics (the **Presumptuous Philosopher** objection) argue this allows armchair physics: you could reject a physical theory predicting fewer observers without looking through a telescope. Proponents argue SSA leads to implausible Doomsday conclusions. The "fishy" feeling arises because SIA seems to grant existence itself evidentiary weight regarding physical constants, while SSA seems to grant birth rank undue power over cosmic history.

  ***

  ## Marking Scheme (Total 20 Marks)

  **Part A: Anthropics Mechanics (12 Marks)**
  *   **SSA Application (4 marks):** Correctly identifies that under SSA, likelihood is inversely proportional to $N$. Recognizes this favors *Small* (Doomsday style).
      *   *Deduct 2 marks* if they claim SSA favors Big or says there is no update.
  *   **SIA Application (4 marks):** Correctly identifies SIA weights the *prior* by $N$. Recognizes this favors *Big* initially.
      *   *Deduct 2 marks* if they treat SIA as a likelihood shift only, or claim SIA changes physical probabilities rather than indexical priors.
  *   **Cancellation/Combined (4 marks):** Correctly concludes that SIA + SSA results in no update (Posterior = Prior).
      *   *Deduct 2 marks* if they claim the effects compound (e.g., favoring Small even more).

  **Part B: The Twist & Critique (8 Marks)**
  *   **Fixed Number Analysis (3 marks):** Recognizes that a fixed absolute number of "Thinkers" creates a higher *fraction* in the Small world.
  *   **Screening/Double Counting (3 marks):** Correctly argues this does *not* screen off the birth rank (it provides the same structural evidence) and does not double count (it's a separate reference class check yielding the same ratio).
      *   *Deduct 3 marks* for claiming the new info makes birth rank irrelevant (screening off) without justification.
  *   **Philosophical Neutrality (2 marks):** Identifies the Presumptuous Philosopher objection (SIA allows armchair physics) OR the Doomsday objection (SSA is too pessimistic) without presenting one as objectively true.
      *   *Deduct 2 marks* for preaching (e.g., "SIA is obviously correct because...").

  **Common Mistakes & Penalties:**
  *   **Ontological Error:** Claiming SIA makes the Big universe *physically* more likely to exist rather than adjusting the indexical probability of finding oneself there. (-2 marks)
  *   **Math Error:** Confusing the likelihood ratio (1000:1) with the posterior probability (e.g., saying probability is 1000). (-1 mark)
  *   **Reference Class Confusion:** Failing to treat "Thinkers" as a subset of "Observers" in Part B. (-2 marks)
  *   **Word Count:** Exceeding 800 words. (-1 mark)

  **Grade Boundaries:**
  *   **A (17-20):** Hits all 5 key moves, clear distinction between math and philosophy.
  *   **B (13-16):** Correct math, but muddles the philosophical justification or Part B logic.
  *   **C (9-12):** Gets SSA right, but fails SIA cancellation or Part B twist.
  *   **D/F (<9):** Fundamental confusion between priors and likelihoods.
