prompt: |-
  I'm a retired marine biologist — thirty years of North Sea benthic surveys — and now I finally have time to read, I've got into philosophy, mostly social choice theory after a shouting match at our natural history society. Here's what I actually need.

  I sit on the council of a small conservation trust, about forty members, and we settle maybe six things a year by vote: where the year's budget goes, which of three sites we bid on, who gets our little research grant, where the AGM is held. Whenever a result is close somebody says the rule was gamed, and we keep shopping for a voting rule that can't be gamed. Then I ran into the Gibbard–Satterthwaite theorem and worked out there probably isn't one, not with three or more options and no dictator. So don't explain the theorem to me again — what I want is something the council can run.

  Give me a procedure for choosing and stress-testing a voting rule given that every rule is manipulable somewhere: the questions in order, what counts as an adequate answer to each, where the procedure stops with a no, and where it hands the decision back to us because it's a values call rather than a technical one. Constraints: doable by volunteers in an afternoon with a spreadsheet, no software and no consultants; it has to work when we barely know how members will vote, since we vote by email all at once and the ballots are visible to the whole council afterwards; and it has to be honest about which assumption we're giving up when we give it up — squashing the options down so preferences line up on one dimention, using money or a lottery instead of a straight choice, cutting one decision into two, whatever else there is. It should also keep apart the question can this rule be gamed in principle from will it be gamed by people who don't know how anyone else is voting.

  Then run it on three of our recurring votes: picking the AGM venue, where everyone basically wants it near where they live and the options really do sit on a map; splitting the grants budget between three unrelated causes, where I can't see any single dimension they line up on; and our two-round system for the research grant, shortlist first then winner — I'm rather fond of that one and I suspect you're going to tell me it doesn't help. Finally, tell me what the procedure can't tell me, where it's silent, and where I'd be kidding myself if I thought it had settled something. And say plainly which step is doing the real work, because my guess is that most of it comes down to guessing what our members actually want rather than to anything in the theory.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired marine biologist (30 years North Sea benthic surveys), detail-oriented, empirical, practical, skeptical of theory without application. Sits on a conservation trust council (40 members).
      *   **Context:** Small organization, low-frequency voting (6 times/year), email/visible ballots (simultaneous, transparent), volunteer-run (no software/consultants).
      *   **Problem:** Constant accusations of gaming the vote. Knows Gibbard-Satterthwaite (GS) implies no perfect rule. Wants a *procedure* to choose and stress-test a rule, not a lecture on GS.
      *   **Constraints:** Doable in an afternoon with a spreadsheet. Must distinguish between *theoretical manipulability* and *practical manipulability* (under uncertainty). Must be honest about assumptions sacrificed (single-peakedness, etc.). Must cover three specific cases (AGM venue, Grant budget split, Two-round research grant).
      *   **Goal:** A practical workflow that separates technical constraints from value judgments, identifies the "real work" (guessing member psychology), and admits limitations.

  2.  **Deconstruct the Theoretical Landscape (for internal use):**
      *   *Gibbard-Satterthwaite:* Dictatorship or manipulability if $\ge 3$ options.
      *   *Arrow's Impossibility:* No ranking system satisfies all fairness criteria.
      *   *Escape Hatches:*
          *   Restrict domain (Single-peaked preferences $\rightarrow$ Median Voter Theorem $\rightarrow$ Condorcet works).
          *   Randomization (Lottery).
          *   Money/Trade (Side payments - likely inappropriate for a conservation trust).
          *   Sequential voting (Agenda setting power).
          *   Information asymmetry (GS assumes perfect info; email voting with secret intent but public ballots creates partial uncertainty).
      *   *Practical Manipulability:* Requires knowing others' votes. In email voting with simultaneous submission, strategic voting is harder but not impossible (focal points, past behavior).

  3.  **Drafting the Procedure (The "Protocol"):**
      *   Needs to be step-by-step.
      *   Needs "Stop/Go" criteria.
      *   Needs to explicitly call out "Value Calls" vs. "Technical Facts."
      *   *Step 1: Define the Geometry.* Are preferences single-peaked? (Crucial for escaping GS implications practically).
      *   *Step 2: Define the Stakes.* Is this zero-sum?
      *   *Step 3: Information Environment.* How much do voters know about each other?
      *   *Step 4: Select the Rule.* Match rule to geometry/stakes.
      *   *Step 5: Stress Test.* Simulate strategic voting in the spreadsheet.
      *   *Step 6: The Value Call.* Acknowledge remaining risk.

  4.  **Applying to the Three Cases:**
      *   *Case 1: AGM Venue.* Geographic. Likely single-peaked (people want it near them, distance is the metric). *Solution:* Median voting or Borda if clusters exist.
      *   *Case 2: Grant Budget Split.* Three unrelated causes. Multi-dimensional. No natural ordering. *Solution:* Approval voting or Point voting (distributive). GS applies hard here.
      *   *Case 3: Two-Round System (Shortlist then Winner).* User likes it. Theory says it introduces agenda control/strategic nomination. *Solution:* Acknowledge the risk of "burying" strong candidates in round 1.

  5.  **Addressing the "Real Work" and Limitations:**
      *   The user suspects the theory isn't the heavy lifter. They are right. The heavy lifter is *culture* and *transparency*.
      *   Need to be blunt: The procedure doesn't stop gaming; it makes gaming expensive or socially costly.
      *   The "Visible Ballot" constraint is huge. It changes the game from GS (secret ballots assumed often) to a reputation game.

  6.  **Refining the Tone:**
      *   Respectful of expertise (marine bio). Use analogies if helpful (benthic surveys = sampling error).
      *   No fluff. No "As an AI..."
      *   Direct, structured, slightly dry but pragmatic.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Correction:* I initially thought about suggesting Condorcet. But with 40 people and email, counting pairwise comparisons is a spreadsheet nightmare. Keep it simple. Plurality, Approval, Borda, Score.
      *   *Correction:* The user said "visible ballots afterwards." This means *ex-post* transparency, not *ex-ante*. Strategic voting is still possible based on past years' data.
      *   *Emphasis:* Make sure to distinguish "Can be gamed" (GS) from "Will be gamed" (Info constraints).
      *   *The "Value Call":* Explicitly state where the council must accept risk.

  8.  **Final Structure:**
      *   **Introduction:** Acknowledge the GS reality, set the stage.
      *   **The Protocol (5 Steps):** The core request.
      *   **Application:** The three specific cases.
      *   **The Silence:** What the procedure can't do.
      *   **The Real Work:** The psychological/cultural conclusion.

  9.  **Drafting the Content (Mental Check against constraints):**
      *   *Spreadsheet friendly?* Yes, keep math simple (sums, averages).
      *   *Afternoon?* Yes, 5 steps is manageable.
      *   *Honest about assumptions?* Yes, Step 1 is all about domain restriction.
      *   *Distinguish principle vs. practice?* Yes, Step 3 covers information.

  10. **Final Review:** Does this answer the prompt's specific demand for "questions in order, what counts as an adequate answer, where it stops"? Yes, I will structure the protocol exactly like that.

  *(Self-Correction on the Two-Round System)*: The user suspects I'll say it doesn't help. Actually, two-round systems *do* help with Condorcet cycles sometimes, but they introduce "compromise" strategies. I need to be nuanced there. It reduces the dimensionality in round 2, but round 1 is vulnerable to tactical elimination.

  *(Self-Correction on Budget Split)*: This isn't a choice of *one* option, it's a division of a resource. That's a different class of problem (fair division vs. social choice). I need to point that out.

  *(Final Polish)*: Ensure the voice sounds like it's talking to a scientist. "Null hypothesis," "error bars," "sample size."

