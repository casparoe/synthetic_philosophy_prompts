answer: |-
  You are right about Gibbard–Satterthwaite. You are also right that knowing it doesn't fill the ballot box. In thirty years of benthic surveys, you learned that you cannot sample the whole seabed, but you can design a trawl that minimizes bias and tells you when the substrate has shifted.

  Here is a protocol for selecting a voting rule. It treats the voting rule as a piece of field equipment: it has a operating range, it introduces specific errors, and it breaks if you use it on the wrong substrate.

  This procedure is designed for a spreadsheet and an afternoon. It separates *structural vulnerability* (can it be gamed?) from *practical vulnerability* (will it be gamed given what we know?).

  ### The Protocol: Five Steps to Rule Selection

  **Step 1: The Geometry Check (Domain Restriction)**
  *   **Question:** Do the options sit on a single dimension where every member has a "most preferred point" and utility declines as you move away from it? (Single-Peakedness).
  *   **Adequate Answer:** "Yes, clearly" (e.g., budget amount, location on a map) OR "No, these are qualitatively different" (e.g., coral vs. seagrass vs. education).
  *   **Stop/Go:**
      *   If **Yes**: You have escaped the worst of Gibbard–Satterthwaite. The Median Voter Theorem applies. You can use a rule that finds the center.
      *   If **No**: You are in the "chaos zone." Any rule is vulnerable to cycles and agenda manipulation. Proceed to Step 2.
  *   **Assumption Sacrificed:** If you force a "Yes" here (e.g., pretending complex grants are just "high/low" priority), you are silencing minority preferences.

  **Step 2: The Information Audit (Practical Manipulability)**
  *   **Question:** Does a member need to know how others will vote to game the system effectively?
  *   **Adequate Answer:** Estimate the "Transparency Lag." In your case: Ballots are visible *after*, but voting is simultaneous. Members know past behavior, but not current intent.
  *   **Stop/Go:**
      *   If **High Uncertainty** (members don't know each other's current minds): Strategic voting is risky. A complex rule is safe *enough*.
      *   If **Low Uncertainty** (cliques exist, voting blocs are known): Strategic voting is easy. You need a rule that makes strategy costly or obvious.
  *   **Assumption Sacrificed:** If you assume High Uncertainty when Low exists, you are inviting collusion.

  **Step 3: The Stakes Classification (Zero-Sum vs. Positive-Sum)**
  *   **Question:** Does one option's win mean another's total loss?
  *   **Adequate Answer:** "Winner-take-all" (Venue, Chairperson) OR "Divisible" (Budget split, multiple grants).
  *   **Stop/Go:**
      *   If **Divisible**: Do not use a selection rule. Use an allocation rule (e.g., proportional points).
      *   If **Winner-take-all**: Proceed to Step 4.
  *   **Assumption Sacrificed:** If you treat a divisible problem as winner-take-all, you manufacture conflict where none is needed.

  **Step 4: The Spreadsheet Stress-Test**
  *   **Question:** Can we simulate a "attack" on the preferred rule using last year's data?
  *   **Procedure:** Take last year's ballot data (anonymized if needed, but patterns matter). Pick a rule (e.g., Plurality, Borda, Approval). In the spreadsheet, change 3–5 ballots (representing a small bloc) to see if the winner flips.
  *   **Adequate Answer:** "It takes a coalition of X% to flip the result."
  *   **Stop/Go:**
      *   If **X < 15%**: The rule is too fragile. Reject.
      *   If **X > 25%**: The rule is robust enough for a 40-person council.
  *   **Assumption Sacrificed:** This tests *past* behavior. It assumes future preferences correlate with past ones.

  **Step 5: The Value Call (The Handoff)**
  *   **Question:** Which fairness criterion are we willing to violate?
  *   **Adequate Answer:** The council must explicitly vote on which flaw they prefer.
      *   *Option A:* Vulnerable to "burying" strong candidates (Plurality).
      *   *Option B:* Vulnerable to "compromise" candidates winning (Borda/Score).
      *   *Option C:* Vulnerable to agenda setting (Two-round).
  *   **Stop/Go:** This is not technical. This is political. If you cannot agree on which flaw is least offensive, do not vote. Discuss until consensus emerges.
  *   **Assumption Sacrificed:** You are sacrificing the illusion of mathematical purity for social stability.

  ---

  ### Application to Your Three Cases

  #### 1. The AGM Venue (The Geographic Vote)
  *   **Step 1 (Geometry):** **Yes.** Members are distributed geographically. Preference is distance-based. This is single-peaked.
  *   **Step 2 (Info):** Moderate. Members know where others live.
  *   **Step 3 (Stakes):** Winner-take-all.
  *   **Recommendation:** Do not use Plurality (First-Past-The-Post). It favors the largest cluster and disenfranchises the periphery.
  *   **Rule:** **Median Voting** or **Score Voting (0–5)**. Ask members to rate each venue 0–5. Sum the scores.
  *   **Why:** On a single dimension, the mean/median minimizes total travel distance (social cost). It is hard to game because exaggerating preferences (rating your local 5 and others 0) doesn't help as much as honest scoring when the distribution is spread.
  *   **Stress Test:** In your spreadsheet, take the 5 members furthest from the winning venue. If they all vote "0" for the winner, does it lose? If not, it's robust.

  #### 2. The Grants Budget Split (The Divisible Vote)
  *   **Step 1 (Geometry):** **No.** Three unrelated causes. No single dimension.
  *   **Step 2 (Info):** High uncertainty on specific trade-offs.
  *   **Step 3 (Stakes):** **Divisible.** This is the critical catch. You are currently treating a budget split as a choice of "which project," but you said "splitting the budget."
  *   **Recommendation:** **Point Voting (Distributive).** Give each member 100 points to distribute among the three causes however they like. Sum the points. Allocate budget proportionally.
  *   **Why:** This bypasses Gibbard–Satterthwaite because you aren't selecting *one* winner. You are aggregating intensity of preference. It admits that members might want *some* of everything.
  *   **Risk:** Members might "bullet vote" (put all 100 on one cause) to game the proportion.
  *   **Mitigation:** Publish the distribution. Social pressure in a conservation trust usually discourages greedy bullet-voting if the norm is established.

  #### 3. The Two-Round Research Grant (The Sequential Vote)
  *   **Step 1 (Geometry):** No. Quality is multi-dimensional.
  *   **Step 2 (Info):** High. Everyone sees the shortlist.
  *   **Step 3 (Stakes):** Winner-take-all.
  *   **Your Intuition:** You suspect I will say this doesn't help.
  *   **Verdict:** **You are half-right.** Two-round systems reduce the "spoiler effect" of the second round, but they introduce **Agenda Control** in the first round.
  *   **The Trap:** A bloc can vote strategically in Round 1 to eliminate a strong rival they dislike, ensuring a weaker candidate they prefer makes the shortlist. This is "burying."
  *   **Recommendation:** If you keep it, you must fix the shortlist criteria. If the shortlist is determined by the same vote as the winner, it is vulnerable.
  *   **Better Alternative:** **Approval Voting** in a single round. Members vote "Yes/No" for as many candidates as they find acceptable. The one with the most approvals wins.
      *   *Why:* It handles the "compromise" candidate better than Two-Round. It is simpler (one email, one count). It is harder to game because voting *against* your true preference is risky (you might eliminate everyone you like).
      *   *Spreadsheet Test:* Take your last grant vote. Would the Approval winner differ from the Two-Round winner? If yes, ask which one feels more "legitimate."

  ---

  ### What This Procedure Cannot Tell You

  **1. The "Sincere Preference" Problem**
  The procedure assumes members *have* a sincere preference. In small councils, preferences are often endogenous—they form *during* the discussion based on who wants what. If Member A sees Member B wants Venue X, Member A might oppose it simply to block B. No voting rule fixes interpersonal friction. The procedure treats this as "noise," but in a 40-person trust, it might be the signal.

  **2. The Legitimacy Gap**
  Mathematics cannot generate legitimacy. A rule can be robust (hard to game) but feel unfair. For example, Point Voting on the budget might result in a project getting 0% because it was everyone's second choice. Technically correct, socially explosive. The procedure stops at Step 5; it hands you the knife, but you must make the cut.

  **3. The "Visible Ballot" Double-Edge**
  You mentioned ballots are visible afterwards.
  *   *Benefit:* It discourages blatant gaming because reputation matters.
  *   *Cost:* It encourages herd behavior. Junior members may vote with the Senior Biologists to avoid conflict.
  *   *Silence:* The procedure cannot measure social pressure. If the rule is perfect but the culture is hierarchical, the vote is a rubber stamp.

  ### Where the Real Work Is

  You guessed correctly: **Step 1 (Geometry) and Step 5 (Value Call) are doing 90% of the work.**

  The math (Step 4) is just sanity checking. The real work is agreeing on the *nature of the decision*.
  *   If you agree the AGM venue is a **logistical problem** (minimize miles), Score Voting works.
  *   If you agree the AGM venue is a **political problem** (rotate regions to keep everyone happy), then Voting is the wrong tool; you need a **Rotation Rule** (no voting required).

  **The Hard Truth:**
  You are looking for a rule that prevents accusations of gaming. No rule does that. The only thing that stops accusations is **transparency of process** and **stability of rule**.
  *   Pick a rule using this protocol.
  *   Write it into the bylaws.
  *   Refuse to change it for five years, regardless of who wins or loses.

  If you change the rule every time you lose a vote, you confirm the suspicion that the game is rigged. If you keep the rule even when it hurts your own preferred outcome, you prove it isn't. The security isn't in the algorithm; it's in the commitment to endure the algorithm's errors.

  **Summary Recommendation for Tomorrow's Afternoon:**
  1.  **Venue:** Switch to 0–5 Score Voting. (Respects geography).
  2.  **Budget:** Switch to 100-Point Distributive Voting. (Respects intensity).
  3.  **Grant:** Switch to Single-Round Approval Voting. (Reduces agenda manipulation).
  4.  **Governance:** Pass a motion binding the council to these three rules for 5 years, regardless of outcome.

  That last motion is the only one that actually solves the problem you described.
