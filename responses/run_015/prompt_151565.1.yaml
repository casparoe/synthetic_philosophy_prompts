      *   **Section 2: Where the Roommate is Wrong (Normative Leap).** Challenge the "gift" framing in public contexts.
      *   **Section 3: The Verdict on Universality.** Argue that impersonality is a feature, not a bug, of development.
      *   **Section 4: The Definite Position on the "Line".** Argue that the line is rationalization when public office is involved.
      *   **Conclusion:** Summarize the stance.

  8.  **Self-Correction/Review during drafting:**
