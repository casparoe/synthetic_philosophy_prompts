      *   *Check:* Did I address the "Western standards" point? *Correction:* Ensure I explain *why* Western standards (impersonality) are necessary for scale, not just cultural preference.
      *   *Check:* Did I answer the "clean line" question? *Correction:* Make sure to explicitly state: The line is a rationalization in the context of public office.

