      *Move 4:* "Ratio is wrong tool" -> Overstated/Controversial. "Conditionals cannot be probabilized" -> False (they can, just not as propositions with the ratio).

      *Wait, one nuance on Move 2:* Person 2 says "on Stalnaker-style semantics... probability... is determined by proportion... not by global ratio." This is slightly confused. In Stalnaker's semantics, the probability *is* the measure of the set of worlds where the conditional is true. The point is that this measure *does not equal* $P(q|p)$ in all cases. Person 2 phrases it as if the definition of probability is different. It's not the definition of probability that changes, it's the truth conditions that make the probability diverge from the ratio. I should note this distinction.

