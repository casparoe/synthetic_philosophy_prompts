      *   Overall Verdict (including the missing Non-propositionalist option).

      *(Self-Correction during drafting)*: Make sure to distinguish between "Conditional Probability" (the mathematical ratio) and "Probability of a Conditional" (the probability assigned to the sentence). Lewis shows they can't be identical if the sentence is a proposition.

      *Move 1:* "Decisive" -> Correct given premises.
      *Move 2:* "Stalnaker-style... collapse need not follow" -> Correct.
