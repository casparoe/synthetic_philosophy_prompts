answer: |-
  The lighter flickered, a small, desperate sun in the middle of Elena's cluttered desk. Below it lay the journal. It smelled like wet earth and vanilla, the specific scent of paper that's been hidden in a wall for fifty years.

  On her laptop screen, the third act of *The Vane Symphony* glowed. In her script, Julian Vane died a martyr, composing his final concerto while coughing blood into a handkerchief, sacrificing his health for art. It was beautiful. It was going to win Oscars. It was a lie.

  The journal, now decrypted after three months of headaches, said something else. Julian hadn't died working. He'd died running. The "masterpiece" wasn't his; it was stolen from a young woman he'd ruined, a composer he'd gaslit into silence so his own legend could breathe. The hero wasn't a genius; he was a thief with a good publicist.

  Elena held the flame over the corner of the page.

  This was the question that had been eating her alive: What do you owe a ghost?

  Julian Vane had been dead since 1974. He couldn't be sued. He couldn't be embarrassed. His reputation was a statue in a park, and statues don't feel the rain. If she burned this, the statue stayed clean. The movie inspires kids to pick up violins. The myth does good work.

  But if she kept it? If she let the truth out?

  "We owe them the truth," she whispered to the empty room. It sounded like a line from a movie.

  "Or do we owe them peace?" she answered herself.

  She blew out the flame. The smoke curled up, gray and insubstantial. She couldn't do it. Not yet. She tucked the journal into her safe, behind a box of old tax returns, and went to bed.

  The first letter arrived on Tuesday.

  It was a cream-colored envelope, hand-delivered, no stamp, no return address. Just her name written in a sharp, jagged script that looked like it had been carved into the paper.

  Inside was a single index card. It read: *Page 14, Line 3: 'I took the melody because she had no voice to scream.'*

  Elena dropped the card. She hadn't told a soul about the journal. Her agent thought she was struggling with writer's block. The estate executors thought she was writing a fluffy tribute. She had decoded the cipher in total isolation.

  She called the post office. They had no record of the delivery. She checked her security camera. The feed showed a blur of static for the ten seconds the letter appeared in her mailbox, like a glitch in reality.

  She went back to the safe. She pulled out the journal. Turned to page 14. There it was. The exact line.

  "Okay," she said, her voice trembling. "Who are you?"

  She didn't sleep that night. She wrote. She rewrote the third act. She made it ugly. She made Julian a monster. It felt honest, but it also felt like desecration. She was digging up a grave and kicking the bones.

  The second letter came on Friday.

  *Page 32, Line 9: 'The silence I bought is louder than any applause.'*

  This time, there was a note attached. *You are holding the match, Elena. But you are not the fire.*

  It wasn't a threat. It felt like... direction. Like someone was grading her homework.

  She drove to the Vane Estate the next day. It was a sprawling modernist box in the hills, guarded by a man who looked like he chewed gravel for breakfast.

  "I need to speak to the archivist," Elena said.

  "There is no archivist," the guard said. "Mr. Vane's affairs are closed."

  "Someone is mailing me excerpts from his private diary."

  The guard didn't blink. "Mr. Vane wrote many things. Many things were lost."

  "None of this was lost. I found it in the lining of a cello case in the basement of the conservatory. Nobody knew it was there."

  The guard's expression shifted, just a fraction. A tightening around the eyes. "Then perhaps you should return it to the lining."

  "Why?" Elena stepped closer. "Why protect him? He's dead. He doesn't care."

  "The dead care more than the living," the guard said softly. "The living can change their story. The dead are stuck with the one you give them."

  Elena drove home in a daze. That was the core of it, wasn't it? Fiction is a contract between the living and the dead. The dead provide the raw material, the bones of the life. The living provide the flesh, the motive, the meaning. If she made him a villain, that's what he would be for the next hundred years. Every biography would cite her movie. The lie would become the truth.

  But if she made him a hero, she'd be lying to everyone who bought a ticket.

  Back in her apartment, the third letter was waiting on her doormat.

  She didn't want to open it. She stood over it for ten minutes, listening to the hum of the refrigerator, the traffic outside. Finally, she slit the envelope.

  It wasn't a quote this time.

  *You think this is about morality. It isn't. It's about ownership. You found the book. That makes it yours. Burn it, and you kill him twice. Publish it, and you kill him once. But if you keep it... he lives in you.*

  Elena sat down at her desk. She opened her laptop. The script was open to the final scene.

  *INT. STUDY - NIGHT*

  *JULIAN (70s) sits at the piano. He looks tired. He places the sheet music on the stand. It is blank.*

  She looked at the safe. Then she looked at the letters.

  If she published the truth, the Vane Estate would sue her into oblivion. They'd bury the movie. The truth would come out, but only in court transcripts no one would read. The myth would survive because it was easier to digest.

  If she burned the journal, the movie gets made. Kids love the music. The myth inspires. But she knows. Every time she hears that symphony, she'll hear the theft.

  And the letters? Who was sending them? A relative? A rival? Or was it the estate testing her loyalty? If it was the estate, they wanted her to burn it. They were guiding her toward the fire.

  *You are not the fire.*

  Elena opened the safe. She took out the journal. She walked to the kitchen. She opened the drawer where the matches were kept.

  She took one match out. She walked back to the desk.

  She didn't light it. Instead, she opened a new document on her computer. She began to type. Not the script. A letter.

  She typed out the truth. Every ugly, stolen note. Every ruined life. She attached scans of the journal pages. She wasn't sending it to a studio. She was sending it to the Library of Congress. To the public record.

  The movie could be a lie. She couldn't stop that. The studio wanted a hero. Let them have their hero on the screen. But the record? The permanent, cold, hard record? That had to be honest.

  She hit send.

  A shadow moved in the hallway.

  Elena froze. She hadn't left the door unlocked. Had she?

  She walked to the hallway. It was empty. But on the floor, where no shadow should have been, lay a fourth envelope.

  She picked it up. It was warm.

  Inside was a single sheet of music. Handwritten. It was the melody Julian had stolen, the one from the journal. But at the bottom, in a different ink, a different hand, was a signature.

  *For Elena.*

  And a note: *Now we are even.*

  Elena stood there, the paper trembling in her hand. The dead don't need protection, she realized. They need witnesses. And sometimes, the witnesses have to haunt the living to make sure they're paying attention.

  She put the sheet music on her piano. She pressed a key. The note rang out, clear and sharp, hanging in the air long after she lifted her finger.

  She went back to her script. She kept the hero. She kept the movie. But she added a postscript. A small card in the lobby. A QR code on the website. A link to the archive.

  It wasn't enough. It would never be enough. But it was something.

  She picked up the lighter again. She looked at the journal. She didn't burn it. She put it back in the safe, next to the letters.

  Let them come. Let them write. The dead are done talking, but the story isn't over until the last person stops listening. And she wasn't done listening yet.
