answer: |-
  **MEMORANDUM**

  **TO:** Common Resources Board
  **FROM:** Staff Counsel
  **SUBJECT:** Recommendation re: Petition for Clinical-Records Library Commons Regime

  **1. Candidate Rules Derived from Precedent**

  Reviewing the Board's track record, three distinct rules of decision emerge, each commanding equal support from the existing docket.

  *   **Rule A: The Subtractability Rule.** A resource qualifies for a commons regime only if one actor's use physically diminishes the quantity or quality available to others.
      *   *Support:* **In** (Groundfish, Airshed, Night Sky—where cumulative trivial subtractions degraded the whole); **Out** (Mapping Library, Time Signal—where use subtracts nothing).
      *   *Prediction for Clinical Library:* **OUT.** Copying and use are non-rival; one hospital's query does not degrade another's.
  *   **Rule B: The Maintenance Burden Rule.** A resource qualifies if it requires coordinated upkeep to remain viable, and voluntary private ordering has failed or is demonstrably precarious.
      *   *Support:* **In** (Irrigation Canals—silt clearing required; Night Sky—cumulative degradation requires policing); **Out** (Mapping Library—users organized a foundation; Causeway—pricing solves congestion).
      *   *Prediction for Clinical Library:* **IN.** The volunteer maintainer is quitting; security patching is essential upkeep; voluntary ordering is collapsing.
  *   **Rule C: The Bounded Appropriation Rule.** A resource qualifies only if there is a defined group appropriating value, and the Board's tools can regulate that withdrawal without compelling contribution.
      *   *Support:* **In** (Groundfish, Pasture—defined members, withdrawal capped); **Out** (Time Signal—unbounded public; Historic District—too much exclusion).
      *   *Prediction for Clinical Library:* **OUT/UNCERTAIN.** The users are bounded (14 institutions), but the petition asks for a *levy* (compelling contribution), whereas the statute and toolkit are designed to limit *appropriation* (withdrawal).

  **2. Closest Analog**

  The **Irrigation Canals** precedent is the genuine analog, not the Open-Source Mapping Library.

  While the Mapping Library shares the digital, non-rival nature of the Clinical Library, the Board ruled it *out* specifically because the users "had already organized a foundation that paid for upkeep without visible free-riding." The Clinical Library presents the inverse factual predicate: the upkeep mechanism (the volunteer) is failing, and free-riding is imminent as institutions depend on the resource without supporting it.

  The Irrigation Canals precedent matches the structural problem: the resource is usable only if someone clears the silt (patches the code). In both cases, the "tragedy" is not over-consumption of the flow, but under-provision of the maintenance required to sustain the flow. The Board intervened in the Canals because the physical infrastructure would collapse without a regime; the Clinical Library faces identical functional collapse.

  **3. Recommendation and Coherence**

  **Decision:** Rule **IN**, granting the petition for a commons regime with a compulsory maintenance levy.

  **Coherence:** This decision coheres with the Board's functional history of intervening where private ordering fails to sustain a critical shared infrastructure (Canals), while respecting the boundary where private ordering succeeds (Mapping Library). It treats the "stability and security" of the library as the appropriated resource, rather than the data records themselves.

  **Statutory Reconciliation:** The statute speaks of "regulating appropriation." To rule IN without violating this text, the Board must define the *certified, maintained branch* of the library as the appropriated good. Access to this stable version is conditioned on payment of the levy. Non-payment results in revocation of access rights (a limit on appropriation) rather than a direct fine for non-contribution. This utilizes existing toolkit mechanisms (rosters, sanctions) to achieve the maintenance goal.

  **4. Principles and Floodgates**

  Our precedents underdetermine the "compulsory contribution" aspect. By ruling IN, we adopt the following new principle: **"Where a bounded community depends on a non-rival resource that requires essential maintenance, failure to contribute to that maintenance constitutes an unauthorized appropriation of the system's stability."**

  **Floodgates Analysis:** Does this commit us to treating every under-maintained open library as a commons? **No.** The principle is constrained by three factors present here and in the *Canals* precedent:
  1.  **Boundedness:** The beneficiaries must be identifiable and finite (14 institutions, not the general public).
  2.  **Criticality:** The maintenance must be essential for safety or function (security patches for clinical records, silt clearing for water), not merely cosmetic.
  3.  **Failure of Voluntary Order:** There must be evidence that voluntary mechanisms (like the Mapping Library's foundation) have failed or are collapsing.

  The floodgates worry is not a sufficient reason to rule OUT, provided we strictly enforce the "bounded community" and "voluntary failure" thresholds. We are not nationalizing open source; we are stabilizing critical regional infrastructure.

  **5. The Separating Test Case**

  To separate **Rule B (Maintenance Burden)** from **Rule C (Bounded Appropriation/Statutory Limit)**, the Board should seek the following petition next:

  **Petition:** A **Regional Cyber-Security Threat Database**.
  **Facts:** Regional banks contribute data on fraud attempts to a shared ledger. Access to the ledger is free, but contributing data is voluntary. Some banks download data without uploading (free-riding), degrading the database's value. A petition asks the Board to mandate data contribution as a condition of access.

  **What We Will Learn:**
  *   If we rule **IN**, we confirm that the Board's power extends to compelling *informational contribution* as a proxy for limiting appropriation, solidifying the "Clinical Library" precedent.
  *   If we rule **OUT**, it suggests the "Clinical Library" decision was an anomaly driven by the physical-world analog of the *Canals* (silt), and that the Board cannot compel contribution in purely digital, non-physical contexts where "access" cannot be technically revoked without harming the public interest.
  *   This case isolates the "Contribution vs. Appropriation" legal hurdle without the distraction of physical maintenance costs.
