prompt: |-
  I've been trying to figure out what I actually believe about when I should back down when someone I respect disagrees with me, just by going on my gut on a bunch of cases. Here's where I land, and I'd like to know if there's one principle (or a small family of them) that actually generates all of these, or whether I'm just a mess.

  1. My roommate and I both worked out the same tax problem from the same return, and we get different numbers. I think I should basically split the difference — or at least move a fair chunk toward her number. If she's as likely to be right as I am, why do I get to trust my hunch more?

  2. But if she's a CPA and I'm a lawyer, and we're looking at the same return, I don't split. I just go with her. Same documents, same "we both did the work," but her answer wins almost completely.

  3. My brother is sharp in general, but he's an idiot about wine. If we disagree about which vintage is better, I don't let his disagreement move me at all, even though I'd trust him on a dozen other things. So it's not "how smart is this person," it's "how smart is this person about this."

  4. We argued about whether a movie was good. She said it was garbage, I said it was great. I don't think I should split — "it's great and garbage" isn't a view I can hold. I keep my answer. (This one feels different from the tax one, but I'm not sure wether it should be.)

  5. If I find out she actually read a study I haven't seen, then even if she's not an expert, I move a lot toward her. Her disagreement now comes with (probably) new evidence, so it's not the same as her just shaking her head.

  6. Here's the one that really bugs me. If I know I'm just a better reasoner than her — I've trained more, I'm more careful — then why should her disagreement move me at all? If I'm more likely to be right, I should keep my view and treat her disagreement as what it is: someone less reliable objecting. But that feels too smug, because I can be overconfident, and the fact that a competent person disagrees with me should make me at least a little nervous. I cant get this one to sit right with #1.

  7. And there are questions where I genuinely think the evidence could go either way — a borderline case, a call call. On those, I don't think I should "split." I think we can both be rational and disagree, and the right move is to recognize that we're both within the range the evidence allows, not to average.

  So: is there a coherent principle behind all this, or a small set of candidates? If you can, state it precisely, and for each piece of it, tell me which of my cases is what forces it in. Then tell me what it predicts for cases I haven't listed — like, what if five peers all disagree with me instead of one, or what if my "peer" is someone I know just never changes their mind no matter what. And be honest about which of my judgments it can't save — if the price of a clean principle is that I have to give up one of these, I'd rather know which one and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants to know if their intuitive judgments about when to revise beliefs in the face of disagreement are coherent (generated by a principle) or inconsistent ("a mess").
      *   **Input:** Seven specific cases/scenarios describing their intuitions about belief revision.
      *   **Output Requirements:**
          *   Identify a coherent principle (or small family) that explains the cases.
          *   State the principle precisely.
          *   Map each case to the specific part of the principle that justifies it.
          *   Generate predictions for new cases (multiple peers, stubborn peers).
          *   Be honest about tensions/inconsistencies (which judgments might need to be sacrificed for coherence).

  2.  **Analyze the Seven Cases:**
      *   *Case 1 (Roommate/Tax/Peers):* Equal competence, same evidence. Intuition: Split the difference (conciliate).
      *   *Case 2 (Roommate/CPA vs. Lawyer):* Unequal competence (Expertise). Intuition: Defer to expert.
      *   *Case 3 (Brother/Wine):* Domain-specific competence. Intuition: Ignore disagreement outside domain of competence.
      *   *Case 4 (Movie/Taste):* Subjective matter. Intuition: No revision (no fact of the matter to split).
      *   *Case 5 (New Evidence/Study):* Disagreement signals new evidence. Intuition: Revise significantly based on evidence, not just disagreement.
      *   *Case 6 (Better Reasoner/Smugness):* Self-assessed superiority vs. humility. Intuition: Conflict. Feels smug to ignore, but logically should ignore if truly superior. Tension with Case 1.
      *   *Case 7 (Underdetermination/Borderline):* Evidence allows multiple views. Intuition: Rational disagreement possible (no need to split).

  3.  **Search for a Unifying Framework:**
      *   *Epistemology of Disagreement:* This is a classic philosophical problem (Conciliationism vs. Steadfastness).
      *   *Key Variables:*
          *   Epistemic Peerhood (Case 1, 6).
          *   Expertise/Authority (Case 2, 3).
          *   Nature of the Proposition (Fact vs. Taste vs. Underdetermined) (Case 4, 7).
          *   Independence of Evidence (Case 5).
      *   *Candidate Principle:* **The Total Evidence View (or Weighted Confidence Principle).**
      *   *Idea:* You don't just react to the *fact* of disagreement. You react to what the disagreement *tells you* about the evidence and your own reliability.
      *   *Refinement:* A "Bayesian Updating on Reliability and Evidence" model fits best. You update based on (a) the likelihood the other person is right given their track record/expertise, and (b) whether the disagreement reveals new information (evidence) you didn't have.

  4.  **Drafting the Principle:**
      *   Let's call it the **Epistemic Weighting Principle**.
      *   Core idea: Belief revision is a function of (1) Relative Reliability, (2) Evidence Independence, and (3) Truth-Aptness of the Claim.
      *   *Formula (Conceptual):* Revision = f(Relative Competence, New Information, Nature of Claim).

  5.  **Mapping Cases to the Principle:**
      *   *Case 1:* Equal Competence + Same Evidence -> Conciliation (Split).
      *   *Case 2:* Higher Competence (CPA) -> Deference.
      *   *Case 3:* Domain Specificity -> Competence is zero in this domain -> No revision.
      *   *Case 4:* Non-Truth-Apt (Taste) -> Disagreement isn't about facts -> No revision.
      *   *Case 5:* New Evidence (Study) -> Update on evidence, not just opinion.
      *   *Case 6:* The Tension. If I *know* I'm better, I shouldn't revise. But do I *know*? The principle requires accurate self-assessment. The discomfort comes from the fallibility of self-assessment.
      *   *Case 7:* Underdetermination -> Both rational -> No revision needed (Permissivism).

  6.  **Addressing the Tension (Case 6 vs. Case 1):**
      *   Case 1 assumes "as likely to be right." Case 6 assumes "I'm a better reasoner."
      *   If Case 6 is true (I am objectively better), Case 1 logic doesn't apply.
      *   *The Catch:* How do I know I'm better? Usually, I don't. The "smugness" feeling is the epistemic humility check.
      *   *Resolution:* The principle must include a "Calibration Constraint." You must discount your self-assessment of superiority unless it's externally validated (like the CPA in Case 2).

  7.  **Predictions for New Cases:**
      *   *Five Peers Disagree:* Weight increases. If 1 peer = 50/50, 5 peers = heavy weight against me. Revision should be drastic.
      *   *Stubborn Peer:* If they never change their mind, their disagreement carries less information about *evidence* and more about *psychology*. Discount their weight.

  8.  **Identifying the Sacrifice (The "Honest" Part):**
      *   Case 6 is the weak link. If you truly hold Case 1 (peers split), you cannot consistently hold Case 6 (I'm better so I win) *unless* you have independent proof of superiority.
      *   Most people *think* they are better reasoners (Case 6) without the credentials of the CPA (Case 2).
      *   *Verdict:* To be coherent, the user must treat Case 6 more like Case 1 unless they have external validation of their reasoning superiority. The "smugness" feeling is correct; the intuition to dismiss the peer is likely wrong.

  9.  **Structuring the Response:**
      *   **Introduction:** Validate the user. It's not a mess; it's a sophisticated intuitive epistemology.
      *   **The Principle:** Define the "Weighted Evidence & Reliability Principle."
      *   **Mapping:** Go through 1-7 and show how the principle explains them.
      *   **Predictions:** Answer the 5 peers and stubborn peer questions.
      *   **The Tension/Sacrifice:** Address Case 6 directly. This is the crucial philosophical insight.
      *   **Conclusion:** Summarize.

  10. **Refining the Tone:**
      *   Keep it analytical but conversational.
      *   Avoid overly dense jargon (explain "epistemic peer," "truth-apt," etc.).
      *   Ensure the distinction between *disagreement as evidence* vs. *disagreement as signal of new evidence* is clear.

  11. **Self-Correction/Review during drafting:**
      *   *Check Case 7:* Is "Permissivism" the right term? Yes, or "Underdetermination." The key is that the evidence doesn't mandate a single view.
      *   *Check Case 4:* Make sure to distinguish subjective taste from objective aesthetic value. The user says "it's great and garbage isn't a view I can hold," implying subjectivity.
      *   *Check Case 6:* This is the hardest one. I need to be firm that self-assessed superiority is epistemically risky. The principle should demand *independent* verification of superiority (like the CPA license).

  12. **Final Polish:** Ensure all constraints of the prompt are met (precise statement, mapping, predictions, honest sacrifice). (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I don't just say "Case 6 is wrong." I need to explain *why* it conflicts with the principle derived from Case 1. The principle relies on *assessing reliability*. In Case 2, reliability is external (CPA). In Case 6, reliability is internal (self-assessment). Internal assessment is biased. That's the key distinction.

  Let's formulate the principle as **The Calibrated Reliability Principle**.
  1. Assess Truth-Aptness.
  2. Assess Relative Reliability (External > Internal).
  3. Assess Information Content (New Evidence?).
  4. Assess Evidence Determinacy.

  Okay, ready to write.s
answer: |-
  You are not a mess. Your intuitions track a sophisticated, albeit implicit, epistemological framework. You are intuitively practicing what philosophers call a **Total Evidence View** of disagreement, rather than a strict "Conciliationism" (always split the difference) or "Steadfastness" (never budge).

  Your judgments are generated by a single coherent principle, which I will call **The Calibrated Reliability Principle**.

  ### The Principle

  **When a trusted other disagrees with you, revise your belief proportionally to the weight of their disagreement as *evidence*, calculated by three filters:**

  1.  **Truth-Aptness:** Is the claim about an objective fact that can be wrong, or is it subjective/underdetermined?
  2.  **Relative Reliability:** Who is more likely to be correct *about this specific topic*, based on independent track records or credentials?
  3.  **Informational Independence:** Does the disagreement signal that they possess evidence or reasoning you do not?

  **The Rule:** You do not update on the *disagreement itself*; you update on what the disagreement *reveals* about the evidence and your own reliability.

  ---

  ### Mapping Your Cases to the Principle

  Here is how each of your seven cases forces a specific clause into the principle.

  **1. The Tax Problem (Peers)**
  *   **Judgment:** Split the difference.
  *   **Principle Clause:** **Relative Reliability (Equal).**
  *   **Why:** You stipulated you are "as likely to be right." If $P(You) = P(Them)$, and the claim is objective (tax math), Bayesian updating requires you to regress toward the mean. Their error rate is equal to yours; therefore, the probability that *you* are the one making the mistake is 50%.

  **2. The CPA vs. Lawyer (Expertise)**
  *   **Judgment:** Defer to the CPA.
  *   **Principle Clause:** **Relative Reliability (Weighted).**
  *   **Why:** Reliability is not global; it is domain-specific. The CPA credential is an external validator of reliability in tax law. Your intuition correctly weights her reliability higher than yours, overriding the "peer" status you had in Case 1.

  **3. The Brother and Wine (Domain Specificity)**
  *   **Judgment:** Ignore him.
  *   **Principle Clause:** **Relative Reliability (Domain Locked).**
  *   **Why:** This refines Case 2. General intelligence ("sharp") does not transfer to specific domains ("wine"). If his reliability in domain $X$ is baseline or low, his disagreement carries zero evidentiary weight in domain $X$, even if high in domain $Y$.

  **4. The Movie (Taste)**
  *   **Judgment:** Keep your view.
  *   **Principle Clause:** **Truth-Aptness.**
  *   **Why:** "This movie is good" is not a truth-apt claim in the same way "this deduction is $500" is. If there is no objective fact of the matter, there is no error to correct. Disagreement here reveals preference, not error. Therefore, no revision is required.

  **5. The Study (New Evidence)**
  *   **Judgment:** Move toward her.
  *   **Principle Clause:** **Informational Independence.**
  *   **Why:** This is crucial. Her disagreement is not just an opinion; it is a *signal* that she possesses data ($D$) you lack. You aren't updating because she disagrees; you are updating because $P(Truth | Her + Study) > P(Truth | You)$. The disagreement was just the courier for the evidence.

  **6. The Better Reasoner (The Tension)**
  *   **Judgment:** Conflicted (Smugness vs. Humility).
  *   **Principle Clause:** **Relative Reliability (Calibration Constraint).**
  *   **Why:** This case exposes the risk in self-assessment. The principle demands you weigh reliability. If you *objectively know* you are a better reasoner (like the CPA), you should not split (consistent with Case 2). However, the "smugness" you feel is your brain recognizing that **self-assessed reliability is notoriously unreliable.**
      *   *Coherence Fix:* To be consistent with Case 1 & 2, you must treat self-assessed superiority as weaker evidence than external credentials. You should revise *some*, because the probability that you are misjudging your own superiority is non-zero.

  **7. The Borderline Case (Underdetermination)**
  *   **Judgment:** Rational disagreement allowed (No split).
  *   **Principle Clause:** **Evidence Determinacy.**
  *   **Why:** If the evidence allows a range of rational conclusions (permissivism), then her holding View B does not prove your View A is false. Both can be rational. Disagreement here does not signal error, so no revision is needed.

  ---

  ### Predictions for New Cases

  If you adopt **The Calibrated Reliability Principle**, here is what it demands you do in scenarios you haven't listed:

  **Prediction A: Five Peers Disagree with You**
  *   **Scenario:** You and five roommates (all equal tax competence) do the return. All five get Number X; you get Number Y.
  *   **Prediction:** You must revise drastically, almost to the point of abandoning your view.
  *   **Why:** Under the **Relative Reliability** clause, the probability that *five* independent peers all made the same mistake while you alone got it right is statistically vanishingly small. The "weight" of the disagreement is no longer 1:1; it is 5:1 against you.

  **Prediction B: The Stubborn Peer**
  *   **Scenario:** A roommate you respect disagrees with you, but you know she has a policy of "never changing her mind once stated."
  *   **Prediction:** You should discount her disagreement significantly (perhaps ignore it).
  *   **Why:** Under the **Informational Independence** clause, her disagreement no longer signals that she has weighed the evidence and found you lacking. It signals a psychological commitment. Her opinion is no longer a responsive measure of reality, so it loses evidentiary value.

  ---

  ### The Honest Sacrifice

  You asked me to be honest about which of your judgments creates a problem for a clean principle.

  **You have to soften Case 6.**

  Here is the conflict:
  *   **Case 1** says: If reliability is equal, split the difference.
  *   **Case 6** says: If I *feel* my reliability is higher, I should stick to my guns.

  The problem is **epistemic arrogance**. In Case 2 (CPA), you have *independent verification* of her superiority. In Case 6, you have only your *own assessment* of your superiority.

  If you want a coherent principle, you must admit that **you cannot be the sole judge of your own reliability in the moment of disagreement.** If you could, Case 1 would never happen; you would always just decide you're the better reasoner and win.

  **The Price of Coherence:**
  To make your system work, you must accept that **self-assessed reasoning superiority counts for less than external credentials.**
  *   If you disagree with a peer (Case 1), and your only reason to think you're right is "I'm being more careful," you must still revise significantly.
  *   You should feel the "nervousness" you mentioned in Case 6, and that nervousness should force you closer to a "split" than you want to.

  **Why?** Because the fact that a competent person disagrees with you is *evidence* that the problem is harder than you think, or that your "carefulness" is illusory. If you ignore that, you break the logic of Case 1.

  **Summary:** Your intuitions are 90% coherent. They form a robust **Total Evidence View**. The only cleanup required is to humble your intuition in Case 6: treat your own self-assessment of "better reasoner" with the same skepticism you would treat a claim without a CPA license.
