      *   *Ressentiment:* The repressed hatred of the weak for the strong, leading to a revaluation of values where weakness becomes "good" and strength becomes "evil."
      *   *Slave Morality:* Says "No" to what is outside/different. Reactive. Defined by what it is *not*.
      *   *Ascetic Ideal:* Life turned against itself. Denial of instinct. Finding meaning in suffering (usually by blaming the self or the world).
      *   *Will to Power:* The fundamental drive. Even self-denial is a way to exert power (over oneself or others).
