prompt: |-
  I teach the rational-choice half of an upper-level undergraduate decision theory seminar: 20 students, one 75-minute slot, one instructor and no teaching assistant, a bingo cage, a forty-pound prize budget, and a projector I would rather not switch on. They can compute an expected value and have seen the expected-utility theorem stated; they have not met the Allais paradox or the independence axiom, and I do not want either one named until their choices are locked in and paid out.

  What I want is a single in-class activity in which they make real decisions under real (if small) stakes and run into this on their own: their preference between two options flips depending on an outcome that is exactly the same whichever of the two they pick. They should come away having felt the flip before it is described to them, and having discovered that the explanations they reach for at the moment of choice — the special pull of an option that involves no risk at all, the wish not to be the person who threw away a certainty and then watched the wheel land badly — come apart when the thing they were certain about was never going to be theirs. No lecture up front, no expected value worked out on the board before anybody has chosen, and if possible no opening for a student to name the paradox early and deflate the room.

  Two things strike me as the hard parts, and I want them solved rather than gestured at.

  First, scale. The pattern is normally produced with figures on the order of a guaranteed million against a ten-percent chance of five million, and I have forty pounds. If I simply shrink the numbers I expect the whole effect to wash out and the session to come up null. Tell me how you would get the relevant psychology with real stakes on that budget: a currency the students actually care about, a loss frame, a random multiplier, something consumed on the spot, a raffle over a prize they picked themselves at the start of term. Or tell me plainly that chasing real stakes is the wrong instinct here, and say what you would put in their hands instead and what the hypothetical version buys that a paid one cannot.

  Second, disguise. If both decisions sit on the same sheet in the same figures, a good half of the room will spot the relationship and edit themselves into consistency, and I will have taught them nothing except that they were being watched. So: how are the two decisions separated in time or buried among filler, what cover story sits on each, what the filler items are, and how do I stop one student computing aloud from anchoring everyone else.

  Here is a variant I have been turning over and cannot settle, and I want it either built into the design or explained to me as broken. In the standard pair, the branch that comes out the same under both options pays the chooser: in one decision it is a large sum under either option, in the other it is nothing under either. Suppose that in the first decision that common branch instead pays a third party, a named charity or another student in the room, while the contested branch still pays the chooser. As far as the chooser's own money goes, that first decision has then become the same problem as the second one. A student who takes the safe option in the first decision and the gamble in the second has, it seems to me, answered the same question about their own payoffs in two different ways, and the stories about certainty and regret are no longer available to them, because the sum they were supposed to be certain of was never going to reach them. I find this more uncomfortable than the original pair, but I am not confident it is sound. I can also see the obvious objection, that routing the common branch to someone else drags in altruism or rivalry and mangles the comparison, so deal with that directly. Tell me what the variant would show if it worked, what it would show if it did not, whether it belongs alongside the classic pairs or in place of one of them, and what I should do if nobody in the room flips. A colleague also suggested spinning the wheel in two stages, first revealing which block the student is in and only then resolving the prize, so that they confront the contested block on its own; if that adds nothing the third-party version does not already give me, say so and leave it out.

  I also need the session to survive the fact that only some of the room will produce the classic pattern. Give me a short script for each of the four possible pairs of answers, safe-then-gamble, gamble-then-gamble, safe-then-safe, gamble-then-safe, marking which are consistent with the axiom and which are not, and what I say to the consistent students so that the hour is not spent only on the inconsistent ones.

  Then the debrief. Map particular moments and particular things students will have done onto the parts of the idea: the branch that is common to both options, the invariance that branch is supposed to have, the difference between a preference that violates an axiom and a preference that merely depends on how the option was described, and the further step from either of those to any verdict about rationality. Say what will predictably go wrong the first time I run it — I am most worried about students not believing the payouts will be honoured, about a one-percent chance of nothing being read as no chance at all, and about the session collapsing into a show of hands about whether risk aversion is irrational — and tell me how to handle each. And be frank about what the activity cannot reproduce: which feature of the axiom has to be supplied in words by me because no game of this shape can stage it, and where the route from they flipped to they are being irrational is most likely to break.

  No citations, no reading list, no suggestions for further reading. I want the exact wording of what goes on the cards and what I say out loud, the rules and the payoff scheme, a minute-by-minute timeline, and something I can run on Thursday.

  One last thing. At the end, tell me what would make you withdraw this design. Which part of it are you least confident about, what would you expect to observe in the room if that part fails, and which step in the argument the activity is meant to make vivid do you take to be the weakest, the one a good student could reject on the way out of the door and leave the session unpersuaded?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergrad decision theory seminar (20 students, 75 mins, 1 instructor, no TA).
      *   **Budget:** £40 real stakes.
      *   **Constraints:** No projector (preferably), no upfront lecture, no naming the Allais Paradox/Independence Axiom until *after* choices are locked/paid. Students know EV and EU theorem statement but haven't seen Allais.
      *   **Goal:** A single in-class activity where students experience preference reversal based on a common consequence (Allais-type) without realizing it beforehand.
      *   **Key Challenges:**
          1.  *Scale:* £40 is tiny compared to millions. How to make it sting?
          2.  *Disguise:* Prevent students from spotting the structural identity between the two choices.
          3.  *Variant:* Evaluate the "third-party payout" variant (common branch pays charity/other student).
          4.  *Outcomes:* Handle all 4 response patterns (Safe/Gamble, Gamble/Gamble, Safe/Safe, Gamble/Safe).
          5.  *Debrief:* Map experience to theory (common consequence, invariance, rationality).
          6.  *Failure Modes:* Address skepticism about payouts, probability misunderstanding, and "risk aversion is rational" pushback.
          7.  *Deliverables:* Exact wording, cards, rules, payoff scheme, timeline, withdrawal criteria.
          8.  *Constraint:* No citations/reading lists.

  2.  **Deconstruct the Core Problem (Allais Paradox):**

      *   *Standard Setup:*
          *   Choice 1: (A) 100% £1M vs (B) 10% £5M, 89% £1M, 1% £0. (Most pick A).
          *   Choice 2: (C) 11% £1M, 89% £0 vs (D) 10% £5M, 90% £0. (Most pick D).
      *   *The Violation:* The 89% chance of £1M is common to A and B. The 89% chance of £0 is common to C and D. If you cancel the common parts, A becomes (11% £1M) and B becomes (10% £5M + 1% £1M). Wait, the standard cancellation is:
          *   A: 100% £1M
          *   B: 10% £5M, 89% £1M, 1% £0
          *   C: 11% £1M, 89% £0
          *   D: 10% £5M, 90% £0
      *   *Independence Axiom:* If you prefer A over B, you should prefer (A with 89% £0 added) over (B with 89% £0 added).
      *   *The "Flip":* People prefer Certainty in Choice 1, but Higher EV/Risk in Choice 2.
      *   *Budget Issue:* £40 total. If I split it among 20 students, average payout is £2. That's not enough to trigger risk aversion.
      *   *Solution:* Raffle/ Lottery system. One or two winners take the bulk. Or, use a "multiplier" on a base stake.
      *   *Better Solution for Scale:* Use a *single* random draw for the *whole class* or small groups, but the stakes need to feel real. £40 is tight. Let's aim for one £30 prize and ten £1 prizes, or similar. Actually, to make the "certainty" feel real, the "safe" option needs to guarantee *something*.
      *   *Refined Budget Strategy:* The "Certainty" option guarantees a small but tangible reward (e.g., a chocolate bar or £2). The "Gamble" offers a chance at a larger reward (e.g., £30).
      *   *Wait, the prompt asks for "real stakes".* £40 / 20 students = £2/student expected. If I make the "Safe" option £2 guaranteed, and the "Gamble" 10% chance of £20, that works mathematically. But £2 isn't life-changing.
      *   *Psychological Scaling:* Use "Course Credit" or "Privilege"? No, stick to cash/consumables. Let's use cash + a "bonus" item. Actually, the best way to make £40 feel like £1,000,000 is to make the *probability* the driver, not the absolute value. But risk aversion diminishes with small stakes.
      *   *Pivot:* The prompt suggests "a currency the students actually care about". Maybe not cash. But cash is standard. Let's maximize the *variance*.
      *   *Idea:* One winner takes £30. Everyone else gets nothing. VS Everyone gets £1.
      *   *Problem:* If I do this 20 times, I run out of money.
      *   *Solution:* One random student is selected to play for the class pot? No, everyone needs to feel it.
      *   *Best Approach for Budget:* **The "Ticket" System.** Every student gets a ticket.
          *   Decision 1: Option A (Guaranteed £2) vs Option B (10% £20, 89% £2, 1% £0).
          *   Decision 2: Option C (11% £2, 89% £0) vs Option D (10% £20, 90% £0).
          *   *Wait, Budget Check:* If everyone picks A, cost = £40. If everyone picks B, expected cost = £40.
          *   *Risk:* If many pick B and hit the 10%, I go bust.
          *   *Fix:* Cap the total payout. Or, select *one* student at the end to have their choice realized. This is standard experimental econ practice. It preserves incentives if students believe they will be the one selected.
          *   *Decision:* **One student selected at random to play for real.** This allows the stakes to be meaningful (e.g., £30 vs £0) without bankrupting the instructor. The "Certainty" becomes "Guaranteed £5" vs "Gamble".
          *   *Wait, 20 students.* If only one plays, the others disengage.
          *   *Fix:* **Group Stakes.** 4 groups of 5. Each group has a £10 budget. Or, **The "Pot" Method.** All choices aggregate.
          *   *Better Fix:* **The "Real Payment" Compromise.** I will pay everyone a small base (£1) for participation. Then, *one* question from *one* random student determines a bonus pot of £30.
          *   *Actually, the prompt says "real (if small) stakes".* Let's try to pay everyone something.
          *   *Revised Budget Plan:* £40 total.
          *   Safe Option: Guaranteed £2 voucher/cash.
          *   Gamble Option: 10% chance of £20, 90% chance of £0 (simplified for Decision 2).
          *   To make Decision 1 work (Allais):
              *   1A: 100% £2.
              *   1B: 10% £20, 89% £2, 1% £0.
              *   2A: 11% £2, 89% £0.
              *   2B: 10% £20, 90% £0.
          *   *Cost Risk:* If everyone picks 1B and the 89% hits, I pay £40. If the 10% hits, I pay £400. I cannot afford the 10% hit on 20 students.
          *   *Mandatory Constraint:* **Only one student's decision is paid.** This is the only way to keep stakes high (£30) and budget safe (£40 cap). I must sell this incentive compatibility hard. "One of you will be chosen at random to be the 'Decider'. Your choices determine your payout. The rest get a £1 show-up fee."
          *   *Wait, if only one is paid, do the others care?* Yes, if the selection is truly random and anonymous.
          *   *Alternative:* **The Bingo Cage.** Use the cage to determine *who* gets paid and *what* the outcome is.
          *   *Let's go with:* Everyone makes choices. One ball drawn to pick a student. One ball drawn to pick the outcome (based on their probabilities).
          *   *Stakes:* £30 for the "Big Win", £3 for the "Small Win". Total budget risk: £30 + £3 (if safe) = £33. Plus £1 show-up for 19 others = £19. Total = £52. Too high.
          *   *Trim:* £25 Big Win, £2 Small Win. Show-up £1.
          *   *Total:* 1 winner (£25) + 19 show-ups (£19) = £44. Close enough. Or just no show-up fee, all in the pot.
          *   *Let's maximize the psychological impact:* **The "Charity" Variant.** The prompt asks about this.
          *   *Decision:* I will use the **Standard Allais** for the main activity because the Charity variant introduces confounds (altruism) that muddy the *Independence Axiom* lesson. The prompt asks me to evaluate it. I will advise *against* using it as the primary driver but suggest it as a follow-up thought experiment. The core lesson is about *your* utility function, not social preferences.
          *   *Disguise:* Two separate sheets. "Survey 1" and "Survey 2". Filler questions in between (risk tolerance, demographic, or unrelated logic puzzles).
          *   *Scale:* To make £2 vs £25 matter, I need to frame it carefully. "This is real money."

  3.  **Drafting the Activity:**

      *   **Timeline:**
          *   0-5: Setup & Incentives (Crucial: One person plays for real).
          *   5-15: Decision 1 (The "Certainty" Frame).
          *   15-25: Filler (Collect sheets, hand out new ones, chat).
          *   25-35: Decision 2 (The "Risk" Frame).
          *   35-45: Collection & Locking.
          *   45-60: The Reveal (Bingo cage, payout, the flip).
          *   60-75: Debrief & Theory.
      *   **Disguise:**
          *   Sheet 1: "Financial Allocation Task A".
          *   Sheet 2: "Financial Allocation Task B".
          *   Filler: "Please list your top 3 hobbies" or "Calculate this simple EV" (distractor).
          *   Better Filler: Just time separation and different formatting.
      *   **The Numbers (Scaled):**
          *   Total Budget: £40.
          *   Decider: 1 student (drawn from bingo cage).
          *   Prize: £30 (High), £3 (Low).
          *   Option 1A: 100% £3.
          *   Option 1B: 10% £30, 89% £3, 1% £0.
          *   Option 2A: 11% £3, 89% £0.
          *   Option 2B: 10% £30, 90% £0.
          *   *Note:* 1A vs 1B is the Certainty Effect. 2A vs 2B is the Risk/Reward.
          *   *EV Check:*
              *   1A: £3.
              *   1B: 0.1(30) + 0.89(3) = 3 + 2.67 = £5.67. (Gamble has higher EV).
              *   2A: 0.11(3) = £0.33.
              *   2B: 0.1(30) = £3.00. (Gamble has higher EV).
          *   *Wait, standard Allais:* Usually 1A (Safe) has lower EV than 1B, but people pick 1A. 2B has higher EV than 2A, people pick 2B.
          *   *My Numbers:*
              *   1A (£3) < 1B (£5.67). People pick 1A (Certainty).
              *   2A (£0.33) < 2B (£3.00). People pick 2B (Risk).
              *   This works. The violation is preferring 1A and 2B.
      *   **Disguise Implementation:**
          *   Sheet 1: "Scenario: Inheritance". (Safe vs Risky Trust Fund).
          *   Sheet 2: "Scenario: Investment". (Lottery Tickets).
          *   Different fonts/layouts.
          *   Collect Sheet 1 before handing out Sheet 2.

  4.  **Addressing the "Third-Party" Variant:**

      *   *Prompt:* "Suppose that in the first decision that common branch instead pays a third party... Tell me what the variant would show if it worked... whether it belongs alongside the classic pairs or in place of one of them."
      *   *Analysis:* If the common branch pays a charity, the student's utility from that branch is (presumably) constant across options *if* they are purely self-interested. If they care about the charity, it's still constant *if* the probability is the same.
      *   *The Trap:* If I pick 1A (Safe for me, Safe for Charity) vs 1B (Risky for me, Risky for Charity).
      *   *Standard Allais:* Common branch is £1M for *me*.
      *   *Variant:* Common branch is £1M for *Charity*.
      *   *Effect:* If I am selfish, it reduces to the standard Allais. If I am altruistic, I might weight the charity money differently.
      *   *Verdict:* It adds noise. It doesn't solve the "Certainty Effect" because the certainty is still there (Charity gets £1M for sure vs Charity gets risky). The psychological "relief" of certainty might apply to the charity too ("I secured the donation").
      *   *Recommendation:* Do not use it for the *main* activity. It complicates the debrief. Use it as a "What if?" during the discussion to test if they really care about *their* certainty or just the outcome structure.
      *   *Two-Stage Spin:* "First reveal block, then prize." This isolates the common consequence. It's a good visualization tool for the *debrief*, not the choice phase.

  5.  **Handling the 4 Outcomes:**

      *   Safe/Safe (A, A): Consistent (Risk Averse).
      *   Gamble/Gamble (B, B): Consistent (Risk Seeking / EV Maximizer).
      *   Safe/Gamble (A, B): **The Paradox** (Inconsistent with EU).
      *   Gamble/Safe (B, A): **The Reverse Paradox** (Rare, but inconsistent).
      *   *Script:* Need to validate the consistent students so they don't feel "dumb" while the inconsistent ones are "interesting".

  6.  **Debrief & Failure Modes:**

      *   *Failure 1:* "I didn't think I'd be picked." -> Mitigation: Draw the name *before* the choice? No, that biases. Draw *after*. Emphasize incentive compatibility.
      *   *Failure 2:* "1% is basically 0." -> Mitigation: Explicitly state "1 ball in 100".
      *   *Failure 3:* "Risk aversion is rational." -> Mitigation: Distinguish between Risk Aversion (concave utility) and Intransitivity/Independence Violation. You can be risk averse and still satisfy Independence.
      *   *Weakest Link:* The claim that this proves "irrationality". A good student can say "My utility function includes 'regret' or 'certainty' as a parameter." (Loomes & Sugden Regret Theory). I need to acknowledge this limitation.

  7.  **Finalizing the Plan:**

      *   *Tone:* Professional, precise, instructional.
      *   *Materials:* Two colored sheets (White/Yellow), Bingo Cage, Cash/Vouchers.
      *   *Budget:* £40 cash.
      *   *Script:* Exact words for instructions.

  8.  **Refining the "Scale" Issue:**

      *   £3 vs £30 is a 10x multiplier.
      *   Is £3 enough to feel "certain"? Yes, it's a coffee.
      *   Is £30 enough to feel "risky"? Yes, it's a dinner.
      *   The "One Decider" method is standard in experimental econ for this reason. I will stick to that. It protects the budget and allows higher stakes for the individual.

  9.  **Refining the "Disguise":**

      *   Sheet 1: "Decision Task 1".
      *   Sheet 2: "Decision Task 2".
      *   Collect Task 1. Hand out Task 2.
      *   Filler: 5 minutes of "Please write down your understanding of Expected Value" (keeps them busy, prevents comparison).

  10. **Refining the Variant:**

      *   I will advise *against* using the third-party variant in the live experiment. It introduces social preference confounds. I will suggest it as a *post-hoc* question during the debrief to test the mechanism.

  11. **Drafting the Content:**

      *   *Timeline:* 75 mins.
      *   *Intro:* 5 mins.
      *   *Task 1:* 10 mins.
      *   *Filler:* 10 mins.
      *   *Task 2:* 10 mins.
      *   *Draw & Pay:* 15 mins.
      *   *Debrief:* 25 mins.
      *   *Scripts:* For each outcome pair.
      *   *Failure Modes:* Specific responses.

  12. **Self-Correction/Review:**

      *   *Did I answer the "Third Party" question?* Yes, need to be explicit about why it's risky.
      *   *Did I solve the Scale?* Yes, "One Decider" method.
      *   *Did I solve the Disguise?* Yes, separate sheets + filler task.
      *   *Did I address the "Weakest Link"?* Yes, the definition of rationality/utility function.
      *   *Budget:* £40. £30 prize + £10 small change. If the "Safe" option is picked, I pay £3. If "Gamble" wins, £30. If "Gamble" loses, £0. I need enough cash for the Safe option if it hits. £30 (Big) + £5 (Small bills) + £5 (Reserve).
      *   *Wait, if the Safe option is picked (100% £3), I need £3.*
      *   *If the Gamble option is picked and wins (10% £30), I need £30.*
      *   *I need to have £33 on hand.* Plus show-up fees? Let's skip show-up fees to maximize the prize pot. £40 pot. £35 Big, £5 Small.
      *   *Revised Prizes:* £35 (Big), £5 (Small).
      *   *Options:*
          *   1A: 100% £5.
          *   1B: 10% £35, 89% £5, 1% £0.
          *   2A: 11% £5, 89% £0.
          *   2B: 10% £35, 90% £0.
      *   *EV:* 1A=5. 1B=3.5+4.45=7.95. 2A=0.55. 2B=3.5.
      *   *Budget Risk:* Max payout is £35. I have £40. Safe.

  13. **Final Polish:** Check tone. Ensure no citations. Ensure "No projector" constraint is met (use board/handouts). Ensure "No naming until payout" constraint is met.

      *   *Wait, one detail:* "One instructor and no teaching assistant." I need to manage the collection of sheets secretly so students don't see others' choices. I will collect them face down.
      *   *Disguise:* I will call them "Portfolio A" and "Portfolio B".
      *   *Filler:* "Briefly define 'Expected Utility' in your own words." (Keeps them thinking about theory without revealing the trick).

      *   *Third Party Variant:* I need to be very clear. If the common branch pays a charity, the "Certainty Effect" might still hold because *I* feel good about guaranteeing the charity money. It doesn't isolate the self-interest. I will recommend *against* it for the primary run.

      *   *Two-Stage Spin:* "First reveal block." This is actually a great way to *explain* the independence axiom in the debrief. I will include this in the debrief section.

      *   *Withdrawal Criteria:* What would make me pull this? If the stakes are too low to trigger emotion. If the "One Decider" rule isn't believed.

      *   *Let's write it.*
answer: |-
  # Lesson Plan: The Common Consequence

  **Course:** Decision Theory Seminar (Upper-Level Undergraduate)
  **Time:** 75 Minutes
  **Class Size:** 20 Students
  **Budget:** £40 Cash (Physical notes/coins)
  **Materials:** Bingo cage with 20 numbered balls, 20 White Sheets (Task 1), 20 Yellow Sheets (Task 2), 20 Envelopes, Pens, Cash (£35 note or equivalent, £5 notes).

  ## Part 1: The Setup (Minutes 0–5)

  **Goal:** Establish incentive compatibility without revealing the experiment's structure.

  **Instructor Script:**
  "Good morning. Today is a workshop on decision-making under uncertainty. We are going to make choices that have real financial consequences.

  Here is the rule: At the end of this session, I will draw one number from this bingo cage. That number corresponds to your seat number. That one student is the 'Decider.' Their choices today will determine their payout. The other nineteen students will receive nothing from the pot, but your participation is required for the data to be valid.

  Because only one of you will be paid, you must treat every decision as if *you* are the Decider. If you do not treat it seriously, you risk losing money if your number is drawn.

  I have £40 in cash here on the desk. It will be paid out immediately based on the Decider's choices and the roll of the dice. Do not discuss your choices with your neighbours. If you talk, I cannot guarantee the integrity of the payout, and I will cancel the payment."

  *(Place the cash visibly on the desk. Do not use the projector.)*

  ## Part 2: Task 1 – The "Security" Frame (Minutes 5–15)

  **Goal:** Elicit the preference for certainty (Option 1A).
  **Disguise:** Labelled "Portfolio Alpha".

  **Action:** Hand out **White Sheets**.

  **Instructor Script:**
  "Take a White Sheet. This is Portfolio Alpha. You are managing a small endowment. You have two investment strategies. Read the options. Circle **one** letter: A or B. Do not write your name on the sheet. Write your seat number in the top corner. When you are done, fold it and place it in the envelope on your desk. I will collect them shortly."

  **White Sheet Text:**
  > **PORTFOLIO ALPHA**
  >
  > **Option A:** A guaranteed return of **£5**.
  > (Probability: 100%)
  >
  > **Option B:** A risky return.
  > (Probability: 10% chance of **£35**)
  > (Probability: 89% chance of **£5**)
  > (Probability: 1% chance of **£0**)
  >
  > **Circle your choice:** [ A ]   [ B ]

  *(Wait 5 minutes. Collect envelopes face-down into a pile. Do not look at them.)*

  ## Part 3: The Filler – Cognitive Load (Minutes 15–25)

  **Goal:** Prevent students from comparing Task 1 and Task 2 side-by-side.
  **Disguise:** Academic exercise.

  **Instructor Script:**
  "Before we move to the next portfolio, I want to calibrate your understanding of the terminology we use in this seminar. On the Yellow Sheet I am about to pass out, there is a short writing task. Please take five minutes to write a paragraph defining 'Expected Utility' in your own words, and give one example of a risk-averse preference. This will not be graded, but it ensures we are speaking the same language for the second task."

  *(Hand out **Yellow Sheets**. This forces them to write for 5 minutes, clearing working memory of the specific numbers from Task 1.)*

  ## Part 4: Task 2 – The "Opportunity" Frame (Minutes 25–35)

  **Goal:** Elicit the preference for high EV/risk (Option 2B).
  **Disguise:** Labelled "Portfolio Beta". Different layout.

  **Instructor Script:**
  "Put away the definition task. Look at the bottom half of the Yellow Sheet. This is Portfolio Beta. This is a different market scenario. Again, circle **one** letter: A or B. Write your seat number. Fold it, put it in the envelope. I will collect these separately."

  **Yellow Sheet Text:**
  > **PORTFOLIO BETA**
  >
  > **Option A:** A lottery ticket.
  > (Probability: 11% chance of **£5**)
  > (Probability: 89% chance of **£0**)
  >
  > **Option B:** A high-yield ticket.
  > (Probability: 10% chance of **£35**)
  > (Probability: 90% chance of **£0**)
  >
  > **Circle your choice:** [ A ]   [ B ]

  *(Collect envelopes. Mix them thoroughly with the White Sheet envelopes so no one knows which student submitted which pair.)*

  ## Part 5: The Reveal & Payout (Minutes 35–50)

  **Goal:** Lock in the reality of the stakes before analyzing the logic.

  **Action:**
  1.  Draw one ball from the bingo cage. Announce the number.
  2.  Ask that student to stand.
  3.  Retrieve *their* specific envelopes (you must have tracked seat numbers on a master list while collecting, or ask them to write names on a separate log sheet earlier—*Correction:* To maintain anonymity during choice, ask them to write Seat Number on the sheet. You need a log mapping Seat Number to Student Name for payment, but keep the choices hidden until now).
  4.  **Crucial:** Open their envelopes. Ask them to announce their choices to the room.
  5.  Resolve the gamble using the bingo cage (assign ranges: 1-10 = 10%, 11-99 = 89%, 100 = 1%). *Simplification:* Use a 100-ball cage if available. If only 20 balls, explain the probability mapping clearly. *Better:* Use a random number generator on your phone projected? No, no projector. Use the 20-ball cage and explain: "I will draw 5 times with replacement to simulate the percentages." *Actually, keep it simple:* "I will draw one ball. 1-2 is 10%, 3-19 is 89%, 20 is 1%." (Approximation is acceptable for demonstration, but honesty is key).
      *   *Refinement:* To be precise with a 20-ball cage:
          *   10% = Balls 1-2.
          *   89% = Balls 3-19 (17 balls = 85%).
          *   1% = Ball 20 (5%).
          *   *Acknowledge the approximation:* "The cage has 20 balls. We will map these to the percentages as closely as possible. 1-2 is the 10% win, 3-19 is the middle outcome, 20 is the zero."
  6.  Pay the student immediately. Count the cash out loud.

  **Instructor Script:**
  "Student 14 is our Decider. Please open your envelopes. What did you choose in Alpha? What did you choose in Beta?
  *(Student answers)*
  Now we resolve. I am drawing for the outcome..."
  *(Draw ball. Pay cash.)*
  "Thank you. Please keep your choices private for a moment while we discuss the pattern of the room."

  *(Ask for a show of hands for the four combinations anonymously. "Who picked Safe then Gamble? Safe then Safe? etc." Tally on the board.)*

  ## Part 6: Handling the Four Outcomes (Minutes 50–55)

  **Goal:** Validate consistent students while isolating the inconsistency.

  **Script for Safe/Gamble (The Paradox):**
  "You picked the guarantee in Alpha, but the risk in Beta. You are in the majority. This pattern suggests that the *presence* of the guaranteed £5 in Alpha changed how you viewed the risk, even though the mathematical difference between the options is identical in both cases. We will come back to why this matters."

  **Script for Safe/Safe (Consistent Risk Aversion):**
  "You took the safe option both times. You are consistent. You value certainty highly. In Expected Utility Theory, this is perfectly rational. It implies a very concave utility function for money. You are not 'wrong'; you are just very risk-averse."

  **Script for Gamble/Gamble (Consistent Risk Seeking/EV Max):**
  "You took the gamble both times. You are consistent. You are likely maximizing Expected Value. This is also perfectly rational within the theory. You ignored the 'certainty' premium and looked at the averages."

  **Script for Gamble/Safe (Reverse Paradox):**
  "You took the risk in Alpha but the safety in Beta. This is rare. It suggests you might have been confused by the framing, or you have a very specific preference for avoiding total zero outcomes in the second scenario. Like the first group, your preferences flip based on the context, not just the math."

  ## Part 7: The Debrief (Minutes 55–75)

  **Goal:** Map the feeling to the Independence Axiom without initially naming it.

  **Step 1: The Common Branch.**
  "Look at Alpha. Option A gave you £5. Option B gave you £5 in 89% of the worlds.
  Now look at Beta. Both options gave you £0 in 89% of the worlds.
  In Alpha, 89% of the time, you get £5 *no matter what you choose*.
  In Beta, 89% of the time, you get £0 *no matter what you choose*.

  If you are rational, that 89% chunk should not influence your choice. It is a 'common consequence.' It cancels out. If you strip that away, Alpha and Beta become the same mathematical choice.
  Alpha becomes: 100% £5 vs 10/11 chance £35.
  Beta becomes: 11% £5 vs 10% £35.
  *(Note: Adjust the math explanation to be intuitive rather than rigorous fractions).*

  **Step 2: The Two-Stage Spin (Visualizing Independence).**
  "Imagine I resolve the 89% first. I spin the wheel.
  If it lands on the 89% slice, the game ends. You get the common prize (£5 or £0). Your choice of A or B didn't matter.
  If it lands on the other slice, *then* you play your choice.
  Since your choice doesn't matter in the 89% slice, why did you change your mind between Alpha and Beta?
  The only thing that changed was the *label* on that 89% slice. In Alpha, it was 'Win £5'. In Beta, it was 'Win Nothing'.
  Your preference flipped because the common outcome changed from a gain to a zero, even though it was common to both options."

  **Step 3: Naming the Beast.**
  "This is the Allais Paradox. It violates the **Independence Axiom** of Expected Utility Theory. The axiom says: If you prefer X to Y, you should still prefer X to Y even if both are mixed with a common probability Z.
  Most of you violated this. You felt the 'pull' of the certainty in Alpha. You felt the 'regret' of potentially losing the £5 in Alpha. But in Beta, since you expected £0 anyway, you went for the big prize."

  **Step 4: Addressing Rationality.**
  "Does this mean you are irrational?
  Expected Utility Theory says yes. It says your preferences are inconsistent.
  But many economists argue 'No.' They argue that 'Certainty' has utility itself. Regret has disutility. If you include 'feeling safe' in your utility function, you are consistent.
  However, if we define rationality as 'logical consistency of choices regardless of feelings,' then the flip is a violation.
  The lesson is not that you are bad at math. The lesson is that human decision-making weights *certainty* disproportionately compared to *probability*."

  ## Failure Modes & Mitigation

  **1. "I didn't think I'd be picked." (Incentive Failure)**
  *   *Symptom:* Students laughing, treating it as a game.
  *   *Fix:* In the Setup, state: "I have done this before. Students who treat it as a game regret it when their number is drawn. I will not repeat the payout if you say you weren't trying." Pay the winner visibly and immediately.

  **2. "1% is zero." (Probability Neglect)**
  *   *Symptom:* Students say "1% never happens."
  *   *Fix:* In the Debrief: "If 1% is zero, then in Alpha Option B, you ignored the 1% loss and the 89% gain, leaving only the 10% £35. That makes Option B a 10% chance of £35. Option A is 100% £5. Why switch in Beta? In Beta, if 1% is zero, you are comparing 11% £5 vs 10% £35. The logic must hold across both."

  **3. "Risk Aversion is Rational." (The Theoretical Pushback)**
  *   *Symptom:* A student argues, "I'm just risk averse. That's allowed."
  *   *Fix:* "Risk aversion is allowed. You can be risk averse and still satisfy the Independence Axiom. Risk aversion means you prefer £5 for sure over a 50/50 of £10/£0. The Independence Axiom means you don't change that preference just because I add a 50% chance of £0 to *both* options. You can be risk averse without flipping your preference between Alpha and Beta. The flip is the problem, not the risk aversion."

  ## Evaluation of the "Third-Party" Variant

  **The Proposal:** In Alpha, the common 89% branch pays a charity, not the student.
  **Verdict:** **Do not use this for the primary activity.**

  **Why:**
  1.  **Confounding Preferences:** If a student picks the "Safe" option in Alpha because they want to secure the charity donation, that is altruism, not the Certainty Effect regarding their own wealth. If they switch in Beta (where the charity gets nothing), it's unclear if they switched because of the *certainty* or because they stopped caring about the charity.
  2.  **Moral Licensing:** Students might feel "good" about securing charity money, which alters their risk tolerance for their own money in a way that is hard to model.
  3.  **Complexity:** It adds a layer of explanation that distracts from the core Independence Axiom violation.

  **When to use it:** Use it in the **Debrief** as a thought experiment.
  *Script:* "What if the 89% chance of £5 went to a charity instead of you? Would you still take the Safe option? If yes, do you care about the charity's certainty, or just the structure? If no, does that prove your original choice was purely selfish?"

  **The Two-Stage Spin:**
  *Verdict:* **Include this in the Debrief.**
  It is the best way to visualize the Independence Axiom. It shows that the "common branch" is a coin flip that happens *before* the choice matters. If the choice doesn't matter in that branch, why does the value of that branch change your mind?

  ## Withdrawal Criteria: When to Abort

  **Least Confident Element:** **The Stakes.**
  £5 vs £35 is a 7x multiplier, but £5 is very small.
  **Observation of Failure:** If, during the choice phase, students are visibly bored or discussing the money as "fake," the psychological weight is insufficient to trigger the Certainty Effect.
  **Consequence:** If the stakes are too low, students will EV maximize in both cases (Gamble/Gamble) because £5 isn't enough to induce risk aversion. You will get no paradox.
  **Weakest Argument Step:** The leap from "You flipped" to "You are irrational."
  A sharp student will reject this on the way out. They will say: "Utility isn't just money. It's money plus 'sleeping well at night'. I valued 'sleeping well' in Alpha. I didn't need it in Beta. My utility function is stable; the *goods* I was buying (certainty vs cash) changed."
  **Instructor Response:** Acknowledge this. "You are describing Regret Theory or Weighted Utility. Standard Expected Utility assumes utility is only over final wealth states. You are arguing utility is over the *process*. That is a valid critique of the model, not a defense of the axiom."

  ## Minute-by-Minute Timeline

  *   **00-05:** Intro, Budget Display, Incentive Compatibility Warning.
  *   **05-10:** Task 1 (White Sheet) Distribution & Completion.
  *   **10-15:** Collection of Task 1.
  *   **15-20:** Filler Task (Write definition of Expected Utility).
  *   **20-25:** Task 2 (Yellow Sheet) Distribution & Completion.
  *   **25-30:** Collection of Task 2.
  *   **30-35:** Bingo Draw (Select Decider).
  *   **35-40:** Decider Reveals Choices. Bingo Draw (Resolve Outcome).
  *   **40-45:** Cash Payout.
  *   **45-50:** Anonymous Tally of Room Choices (Show of Hands).
  *   **50-60:** Debrief Part 1: The Common Consequence & Two-Stage Spin.
  *   **60-70:** Debrief Part 2: Independence Axiom & Rationality Debate.
  *   **70-75:** Q&A and Dismissal.

  ## Final Check: Budget & Logistics

  *   **Cash:** Bring £40 in mixed notes (£20, £10, £5).
  *   **Bingo Cage:** Ensure it spins freely.
  *   **Sheets:** White and Yellow distinct.
  *   **Envelopes:** Essential for the feeling of secrecy.
  *   **Projector:** OFF. Use the board for tallying the 4 groups.

  This design isolates the psychological flip, protects your budget, and forces the students to live through the inconsistency before you give them the vocabulary to explain it away.
