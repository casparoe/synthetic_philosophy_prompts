      *   *$\psi$-epistemic:* Distinct $\psi$ can correspond to the same $\lambda$. Overlapping posteriors. The encoding is *not* fully identifiable from the world state; it contains "subjective" information not pinned down by $\lambda$.

  4.  **Translate the Variants:**
      *   *Global Parameter/Law:* $\psi$ isn't a per-datapoint latent $z_i$. It's a global parameter $\theta$ of the generative process $p(x | \theta)$. It defines the dynamics, not the specific instance state.
      *   *Restricted Beliefs (Toy Theories):* The space of allowed Encoding States is constrained. Not any posterior $q(\lambda)$ is valid. Only a specific subset of distributions over $\lambda$ counts as a valid $\psi$. This breaks the standard "belief = distribution over world" mapping.

