answer: |-
  **MEMORANDUM**

  **TO:** The Editorial Board
  **FROM:** Graduate Member, Editorial Board
  **DATE:** October 24, 2023
  **SUBJECT:** Position Paper on Proposed Review Requirement R

  Adopt Requirement R in modified form. The modifications are: remove the author veto on counterpart reviewers; replace the author-drafted Engagement Note with a counterpart-drafted Commentary followed by an Author Reply; and exempt this exchange from article word count limits.

  The internal audit presents a stark picture of our journal's intellectual ecology. Two-thirds of references concentrate in six journals, and fewer than five percent of articles cite literature outside our two founding disciplines. More troubling is the qualitative data: in the few cases where editors forced cross-disciplinary review, the resulting engagement was perfunctory. Outside literature was cited once, dismissed as operating under different framework assumptions, and never allowed to alter the article's central claims. We are tasked with deciding whether Requirement R remedies this. To do so, we must first diagnose the underlying pathology, as different diagnoses demand different cures.

  There are three possible conditions explaining our isolation. The first is **Non-Exposure**: authors and reviewers simply do not know the outside literature exists. The second is **Status Lowering**: actors know the literature but dismiss it to maintain standing with their home audience, where engaging outsiders is seen as a distraction or a weakness. The third is **Framework Filing**: actors know the literature and its status, but treat objections as merely "framework disagreements" that do not require substantive answer. Under Framework Filing, an objection is not refuted; it is filed away as someone else's business.

  The audit evidence strongly supports Non-Exposure and Framework Filing. The low citation rates suggest authors are not reading outside work. The fourteen cases where editors intervened suggest Framework Filing: outside work was acknowledged but immunized against affecting the argument via the "different assumptions" maneuver. The evidence is compatible with Status Lowering, but less directly; we cannot see from citations alone whether authors dismissed outside work to save face or because they genuinely deemed it irrelevant. However, the fact that nine of fourteen intervened articles dismissed the outside work suggests that mere exposure is insufficient. If Non-Exposure were the only problem, forced review should have yielded deeper engagement. That it did not suggests Framework Filing is the dominant barrier.

  Before voting, we should gather the cheapest available evidence to distinguish Status Lowering from Framework Filing. I propose a rapid audit of reviewer reports from the last two years, specifically looking for objections raised by reviewers that authors ignored in revision. If reviewers frequently cite outside literature to challenge claims, and authors routinely dismiss these challenges without penalty, the problem is Status Lowering or Framework Filing, not Non-Exposure. If reviewers rarely raise such objections, the problem is Non-Exposure. This review requires no new data collection, only reading existing files, and can be completed within six months.

  Regarding Requirement R, the current draft risks exacerbating Framework Filing. If authors draft the Engagement Note themselves, they control the formulation of the objection. This allows an author to construct a straw man from the counterpart literature, answer it easily, and point to the Note as evidence of virtue. This institutionalizes the very behavior the audit condemns: it gives Framework Filing an official, visible slot. To prevent this, the objection must come from the counterpart literature itself. The counterpart reviewer should draft a short Commentary stating the strongest objection from their perspective. The author then writes a Reply. This ensures the objection is not one the author has restated in terms they can defeat. It transforms the Note from a compliance checkbox into a genuine site of friction.

  This leads to the author-veto clause. The current proposal allows authors to veto up to two nominees for the counterpart reviewer. This clause is dangerous. In a context of Framework Filing, authors will use the veto to eliminate reviewers who represent the most challenging interpretations of the counterpart literature. They will select outsiders who are sympathetic or marginal within their own field, ensuring the Commentary is weak. The veto must be removed. Editors should nominate counterpart reviewers based on expertise, not author preference. If an author claims a conflict of interest, that should be adjudicated by the handling editor, but intellectual disagreement cannot be grounds for veto.

  We must address the second major worry: that R acts as a tax on authors already outside the journal's mainstream. Early-career colleagues argue that forcing authors to engage a counterpart literature burdens those who are already spending their word budget establishing the legitimacy of their questions. If an author is working in a critical tradition marginalized by both our home literatures, forcing them to engage a mainstream counterpart reinforces the center's power. It demands they explain themselves to the powerful, rather than demanding the powerful engage them.

  This risk is real, but it can be mitigated without abandoning the goal of bridging. First, exempting the Commentary and Reply from word count limits is essential. This ensures the engagement does not come at the cost of the author's core argument. Second, editors must exercise discretion in designating the counterpart literature. If a manuscript is explicitly critiquing a mainstream framework, the counterpart reviewer should not be a defender of that framework, but perhaps a scholar from a different critical tradition who can assess the critique's coherence. However, we must accept some burden. If the journal's mission is to bridge divides, some friction is necessary. The goal is not to make submission easier, but to make the resulting scholarship more robust. The Commentary/Reply model turns this burden into a feature: the article publishes with the objection and the answer visible, signaling to readers that the claims have survived external scrutiny.

  Finally, we need measures of success that do not simply count cross-literature citations, which can be gamed. I propose three metrics. First, track the subfield diversity of submissions over the next three years. If submissions from non-mainstream fields drop by more than fifteen percent, the policy is functioning as a prohibitive tax and should be dropped. Second, analyze how our published articles are cited in subsequent literature. Are they cited by both home literatures, or do they remain siloed? We want to see our articles appearing in the bibliographies of the counterpart fields. Third, monitor the reviewer pool. Are we successfully recruiting and retaining reviewers from the counterpart literature, or do they decline invitations after seeing the required labor?

  We should state in advance what result would count as a reason to drop the policy. If, after eighteen months, we see a significant drop in submissions from early-career scholars or non-mainstream subfields without a corresponding increase in cross-disciplinary citation uptake, the policy is failing. Similarly, if the Commentaries become routinized endorsements rather than genuine objections, the mechanism is broken.

  Requirement R is an attempt to solve a real problem, but in its current form, it treats a structural issue as a procedural one. It assumes that forcing a citation creates engagement. The audit suggests otherwise. By modifying R to shift the drafting of the objection to the counterpart reviewer, removing the author veto, and exempting the exchange from word limits, we can reduce the risk of performative engagement and mitigate the burden on vulnerable authors. This approach respects the senior board's desire for rigor while addressing the early-career board's concern about equity. It treats the bridge not as a place to display credentials, but as a place to test claims.

  I recommend we vote on the modified proposal as specified above. This allows us to act on the audit's findings without institutionalizing the superficial engagement we seek to cure.
