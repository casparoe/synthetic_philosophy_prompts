  **FINAL EXAM: METAETHICS (PHIL 405)**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30
  **Format:** Closed Book (no notes, no devices)

  ***

  ### ESSAY PROMPT: The Virtue Ledger and the Wrong Kind of Reasons

  **Instructions**
  Read the scenario below carefully. You are required to write a structured essay response addressing the specific philosophical task outlined at the end. You dont need to cite specific authors or texts; in fact, name-dropping philosophers without explaining their arguments will be penalised. We care about your reasoning, not your memory of bibliographies. If you recieve full marks, it will be because your argument is clear, not because you dropped a famous name.

  **The Scenario: The National Virtue Ledger**
  Imagine a government introduces a new policy called the "Virtue Ledger." It is a digital platform linked to every citizen's tax file. The system uses algorithms to audit charitable acts. If you donate money to registered NGOs, volunteer at shelters, or participate in community clean-ups, these acts are verified and logged. Each act generates "Integrity Points."

  At the end of the fiscal year, your points are tallied into a public "Integrity Score."
  1.  **High Score:** Citizens in the top 10% recieve a significant income tax rebate (essentially free money).
  2.  **Low Score:** Citizens in the bottom 10% face no legal penalty, but their score is visible to employers and landlords (with consent clauses buried in standard contracts). This creates a strong social stigma; having a low score suggests you are "untrustworthy" or "selfish," making it harder to get hired or rent an apartment.
  3.  **Middle Score:** The majority sit here, experiencing no major gain or loss.

  The government argues this policy increases overall welfare. Charitable acts rise by 200% in the first year. Poverty alleviation funding skyrockets. However, critics argue the policy changes *why* people are generous. Before the Ledger, people might have donated because they cared about the cause. Now, they donate to save money on taxes or avoid social shame.

  **The Philosophical Problem: The Wrong Kind of Reasons (WKR)**
  In metaethics, the Wrong-Kind-of-Reasons problem arises when we try to define normative concepts (like "good," "virtuous," or "reasons for action") in terms of the reasons agents have to promote or admire them.

  Consider the concept of "admirability." A demon threatens to torture you unless you admire him. You now have a massive pragmatic reason to admire the demon (to avoid pain). However, most philosophers agree this threat does not make the demon *admirable*. The reason provided by the threat is the "wrong kind" of reason. It is a pragmatic reason for *having* the attitude, not a right-kind reason that bears on the *worthiness* of the object.

  Applied to morality: To be truly virtuous or generous, an agent usually needs to act for the right reasons (e.g., concern for others). If an agent acts solely to gain a reward or avoid punishment, their action might be right, but their motivation is arguably corrupted. The WKR problem asks us to distinguish between reasons that make an action morally worthy (Right Kind) and reasons that merely incentivize the behavior without conferring moral worth (Wrong Kind).

  There is a risk of confusing this with the psychological "overjustification effect" (where external rewards kill internal motivation). While related, the WKR problem is conceptual and normative, not merely empirical. It asks whether the reason *counts* as a moral reason, not just whether it changes psychological states.

  **Your Task**
  Write an essay addressing the following question:

  *Does the Virtue Ledger provide citizens with the Right Kind of reasons to be generous, or does it merely supply Wrong Kind of reasons that corrupt the moral value of their actions?*

  In your answer, you must:
  1.  **Apply the WKR Framework:** Clearly distinguish between the types of reasons the Ledger creates. Do not just say "money is bad." Explain why pragmatic incentives might fail to constitute moral reasons according to the WKR problem.
  2.  **Engage with a Philosophical Response:** Choose one theoretical approach to resolve the tension. For example, you might use the **Internal Reasons** view (Williams) to argue that unless the agent already cares about virtue, the Ledger provides no genuine normative reason. Alternatively, you might use a **Rationalist/Externalist** account to argue that the Ledger aligns prudential reasons with moral requirements, making generosity rational even if the motivation is mixed.
  3.  **Evaluate Corruption vs. Accompaniment:** Conclude by assessing whether the institutional framing necessarily corrupts the motivation (crowding out virtue) or if it can accompany moral reasons without destroying them. Could the Ledger be redesigned to avoid the WKR problem (e.g., removing the public stigma or the tax link), or is the problem inherent to state-managed virtue?

  **Constraints**
  *   Do not include a bibliography.
  *   Do not guess at obscure texts.
  *   Focus on argumentative precision.
  *   Write clearly and manage your time (90 minutes).

  ***

  ### MODEL ANSWER OUTLINE

  **1. Introduction (Setting the Stage)**
  *   **Thesis:** The Virtue Ledger primarily provides Wrong-Kind Reasons (WKRs) because the incentives (tax, stigma) are independent of the moral worth of generosity.
  *   **Roadmap:** Will distinguish reason types, apply the Internal Reasons view, and argue that while the Ledger increases action, it corrupts the moral character unless redesigned to remove coercive elements.

  **2. Distinguishing the Reasons (The WKR Application)**
  *   **Type 1: Moral Reasons (RKRs):** Reasons grounded in the needs of others or the value of the cause itself. (e.g., "I donate because people are hungry").
  *   **Type 2: Prudential Reasons (WKRs):** Reasons grounded in self-interest regarding the Ledger. (e.g., "I donate to get the tax rebate").
  *   **Type 3: Social/Reputational Reasons (WKRs):** Reasons grounded in avoiding stigma. (e.g., "I donate so my landlord doesn't reject me").
  *   **Crux:** The WKR problem shows that Type 2 and 3 incentivize the *act* but do not make the agent *virtuous*. The demon analogy applies: the threat of stigma is like the demon's threat—it forces compliance but doesn't make the compliance morally worthy.

  **3. Philosophical Engagement: Internal Reasons vs. External Rationalism**
  *   **Internal Reasons Account (Preferred for this outline):**
      *   Argue that for a reason to be normative for an agent, it must connect to their subjective motivational set.
      *   If the citizen only cares about the tax break, they have no internal reason to be *generous*, only to be *paid*.
      *   Therefore, the Ledger fails to cultivate virtue; it cultivates compliance.
  *   **Counter-Argument (Externalist):**
      *   One could argue that rationality requires moral action regardless of motivation. The Ledger makes irrational agents act rationally.
      *   **Rebuttal:** Even if the action is rational, the *moral worth* is lost if the motivation remains purely prudential. The WKR problem persists because the reason doesn't fit the property of "generosity."

  **4. Corruption vs. Accompaniment & Redesign**
  *   **Corruption Argument:** The Ledger crowds out RKRs. If I know I get paid, I might stop caring about the cause. The institutional framing transforms a moral duty into a transaction.
  *   **Accompaniment Possibility:** Can WKRs accompany RKRs? Yes, if the tax rebate is seen as a recognition rather than a bribe.
  *   **Redesign:** To avoid WKR, the state must remove the *controlling* element.
      *   Remove the public stigma (coercive).
      *   Remove the tax rebate (bribe).
      *   Replace with non-transactional recognition (e.g., private thank you) or ensure the incentives are not the *primary* motive cited by the agent.
      *   *Conclusion:* As currently designed, the Ledger solves a resource problem but creates a moral deficit. It provides WKRs that simulate virtue without the substance.

  ***

  ### MARKING RUBRIC (30 MARKS TOTAL)

  **1. Correct Statement of WKR Problem (8 Marks)**
  *   **7-8 Marks:** Clearly distinguishes between reasons that count in favor of the *worthiness* of an act/attitude vs. reasons that count in favor of *bringing about* the act/attitude. Explicitly notes this is not just the psychological overjustification effect.
  *   **4-6 Marks:** Identifies WKR but conflates it slightly with psychological motivation or fails to distinguish the normative gap.
  *   **0-3 Marks:** Fails to define WKR or confuses it with general utilitarianism.

  **2. Application to the Ledger (3 Types of Reason) (10 Marks)**
  *   **9-10 Marks:** Precisely identifies Moral Reasons (RKR), Prudential/Tax Reasons (WKR), and Social/Stigma Reasons (WKR). Explains why the latter two fail to confer moral worth in this context.
  *   **5-8 Marks:** Identifies two types of reasons or applies the distinction vaguely.
  *   **0-4 Marks:** Treats all reasons as equivalent or fails to apply to the specific Ledger mechanics.

  **3. Engagement with Internal/External or Equivalent (7 Marks)**
  *   **6-7 Marks:** Successfully deploys one philosophical framework (e.g., Internal Reasons) to analyze the Ledger. Shows how the framework supports the conclusion about moral worth.
  *   **3-5 Marks:** Mentions a framework but applies it loosely or inconsistently.
  *   **0-2 Marks:** No engagement with a philosophical framework; relies solely on intuition.

  **4. Conclusion: Corruption vs. Accompaniment (5 Marks)**
  *   **5 Marks:** Provides a non-trivial conclusion. Discusses whether the policy destroys virtue or just adds incentives. Offers a specific redesign or definitive judgment on the inevitability of corruption.
  *   **3-4 Marks:** Conclusion is present but simplistic (e.g., "It is bad").
  *   **0-2 Marks:** No clear conclusion or contradicts the earlier argument.

  **Penalties**
  *   **-5 Marks:** Inclusion of a bibliography or reference list.
  *   **-3 Marks:** Name-dropping philosophers without explaining the argument (e.g., "Williams says this" without explaining Internal Reasons).
  *   **-2 Marks:** Guessing at obscure texts or making up citations.

  **Note on Typos:** Students should not be penalised for minor typos, but clarity is key. (Instructors: ignore the typos in the prompt itself, those are for vibe).
