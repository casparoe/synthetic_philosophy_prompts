  **Scene:** *TSA Security Checkpoint, Terminal Z. Achilles is wearing a blue blazer and a badge that says "LOGIC ENFORCEMENT." The Tortoise is slowly placing toiletries into a plastic bin.*

  **Achilles:** (Tapping foot) Look, sir, we can do this the fast way or the hard way. The X-ray shows the socks (Premise A). The tag says the socks are yours (Premise B). Therefore, you packed the bag (Conclusion Z). Step through the gate.

  **Tortoise:** (Calmly adjusting his shell) I accept A. I accept B. But I don't accept Z.

  **Achilles:** You don't accept that you packed the bag?

  **Tortoise:** I accept the *proposition* that I packed the bag. But I haven't accepted the *conclusion*. There's a difference. One is a statement in the bag; the other is the act of walking through the metal detector.

  **Achilles:** (Sighs) Okay. Fine. If you accept A and B, you *must* accept Z. Let's write that down on a sticky note. Call it Premise C: "If A and B are true, Z is true." There. Now move.

  **Tortoise:** (Pockets the sticky note) Lovely. So now my manifest reads A, B, and C. But I'm still standing here.

  **Achilles:** Why?!

  **Tortoise:** Because C is just ink on paper. It's syntax. It has no semantic force. It's just another item in the bin. You're treating the *rule of inference* like it's just another *premise* to be inspected.

  **Achilles:** It's not a premise! It's a rule! It compels you!

  **Tortoise:** "Compels" is semantics, Achilles. I need a syntactic bridge. I need a rule that tells me how to use Rule C. Let's call it Premise D: "If A, B, and C are true, Z must be true."

  **Achilles:** (Sweating) But then you need a rule to apply D!

  **Tortoise:** Precisely. Premise E. "If A through D are true..."

  **Achilles:** (Frantically writing on sticky notes) Premise F! Premise G! Premise H!

  *(The camera pans out. The conveyor belt is completely buried under a mile-long train of sticky notes stretching back to the check-in counter. The suitcase sits untouched at the start of the line.)*

  **Tortoise:** (Peering over the mountain of paper) You know, you're trying to pack the "Therefore" inside the luggage. But "Therefore" isn't a sock, Achilles. It's the hand that lifts the bag.

  **Achilles:** (Holding a stack of notes up to his face) I just want to clear you for travel!

  **Tortoise:** And I'd love to fly. But until you find the rule that says you're allowed to use the rule that says you're allowed to use the first rule... I'm afraid we're going to miss the flight.

  **Achilles:** (Whispering) ...Modus Ponens isn't a ticket.

  **Tortoise:** Tell that to the queue.

  *(The conveyor belt snaps under the weight of the logic.)*
