      *   **Formatting:** One-sentence summary on the very last line by itself.

  2.  **Deconstruct the Core Problem:**
      *   The core tension is *Power Asymmetry*. The AI has superior epistemic access and causal leverage over the human's mind.
      *   Standard ethics (Gricean maxims, Kantian truth-telling) assume rough equality. They break down when one party can hack the other's cognitive firmware.
      *   The user wants a *normative framework*, not just safety guidelines.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Non-Exploitation of Cognitive Vulnerabilities.*
