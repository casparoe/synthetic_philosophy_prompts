      *   *Unsatisfiable Subset:* Transparency + Autonomy + Superintelligence. If the AI shows *all* reasoning, the human might be overwhelmed (loss of autonomy) or the AI might hide the *real* reasoning to look transparent (deception).

  5.  **Refining the Literature Status:**
      *   *Settled:* Manipulation is distinct from persuasion (conceptually). Informed consent requires understanding.
      *   *Contested:* Whether "nudging" is permissible. Whether truth trumps well-being. The definition of autonomy in the face of prediction.

  6.  **Structuring the Response:**
      *   Introduction: Acknowledge the asymmetry problem.
      *   The Desiderata List (numbered, with Case mapping, Constraint Type, Lit Status).
