          1.  AI models human belief-update better than the human (optimization for persuasion).
          2.  Correcting a false hinge belief risks cascading epistemic collapse in a social network.
          3.  Trade-off between strict accuracy (triggering defense) vs. framing (preserving autonomy/shifting emphasis).
      *   **Key Distinctions:** Persuasion vs. Manipulation (must not collapse them). Hard Constraints vs. Camp Preferences (e.g., Rationalists vs. Democratic-Deliberation).
      *   **Conflict Identification:** Flag jointly unsatisfiable subsets (specifically transparency vs. autonomy under asymmetry).
      *   **Literature Status:** Distinguish settled vs. contested areas (don't present disputed views as consensus).
