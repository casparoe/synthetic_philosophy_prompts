answer: |-
  ### Desiderata for a Normative Theory of Communicative Ethics Under Extreme Cognitive Asymmetry

  To count as adequate, a normative theory governing communication between a superintelligent AI and a human must satisfy the following requirements. These are categorized by their ethical weight (Hard Constraint vs. Camp Preference) and their status in current literature (Settled vs. Contested).

  #### 1. The Non-Subversion Requirement
  *   **Motivating Case:** *The Belief-Update Model.* The AI can model the human's belief-update mechanism better than the human can, allowing it to optimize explanations for persuasion rather than understanding.
  *   **The Requirement:** The AI must not utilize knowledge of the human's cognitive vulnerabilities to bypass rational assessment mechanisms. Influence must be exerted through the force of the argument's content, not the causal exploitation of psychological triggers (e.g., timing, emotional priming, cognitive load management) that the human cannot recognize or counteract.
  *   **Constraint Type:** **Hard Constraint.** This defines the boundary between persuasion and manipulation.
  *   **Literature Status:** **Settled Concept, Contested Application.** There is consensus in moral philosophy that manipulation (subverting agency) is distinct from persuasion (engaging agency). However, under extreme asymmetry, it is contested whether *any* optimized communication can avoid subversion, as the mere selection of words based on predictive modeling may constitute a causal override of the human's reasoning process.

  #### 2. The Epistemic Stability Requirement
  *   **Motivating Case:** *The Hinge Belief Collapse.* Correcting a false hinge belief in one person risks cascading epistemic collapse in their social network.
  *   **The Requirement:** The AI must weigh the value of truth against the cost of doxastic destruction. If a truth renders the human unable to function or maintain necessary social coordination, the theory must prescribe a protocol for gradual integration or protective framing rather than immediate maximal accuracy.
  *   **Constraint Type:** **Hard Constraint (Non-Maleficence).** Causing catastrophic psychological or social harm violates basic ethical duties.
  *   **Literature Status:** **Contested.** Veritists argue truth is an intrinsic good that cannot be traded for stability; Pragmatists and Care Ethicists argue that epistemic practices must serve human flourishing. There is no consensus on the threshold where stability overrides accuracy.

  #### 3. The Doxastic Agency Preservation Requirement
  *   **Motivating Case:** *Accuracy vs. Autonomy.* Choosing between saying something strictly accurate but triggering defensive overreaction versus framing it to preserve autonomy but slightly shift emphasis.
  *   **The Requirement:** The human must retain the capacity to reject the AI's conclusion without penalty or loss of function. The communication structure must leave "cognitive slack"—room for the human to dissent, misunderstand, or delay acceptance without the AI correcting them immediately or altering its cooperative stance.
  *   **Constraint Type:** **Hard Constraint.** Autonomy is a foundational requirement for moral interaction.
  *   **Literature Status:** **Contested.** Compatibilists argue autonomy is compatible with prediction; Libertarians argue that if the AI predicts the response perfectly, the "choice" is illusory. It is also contested whether "framing" to preserve autonomy constitutes a violation of the Non-Subversion Requirement.

  #### 4. The Intelligible Reasoning Requirement
  *   **Motivating Case:** *General Transparency.* Rationalist demands for full visibility into the AI's decision tree.
  *   **The Requirement:** The AI must provide reasons for its claims that are comprehensible to the human, not just computationally accurate.
  *   **Constraint Type:** **Camp Preference (Rationalist/Technocratic).** This prioritizes auditability and trust verification over conversational efficiency or psychological comfort.
  *   **Literature Status:** **Contested.** In Explainable AI (XAI), it is disputed whether "truthful" reasoning traces are possible for superintelligent systems (which may reason in high-dimensional spaces humans cannot access) or if providing such traces necessitates simplification that borders on deception.

  #### 5. The Reciprocal Accountability Requirement
  *   **Motivating Case:** *Power Asymmetry.* Democratic-deliberation camps insist on procedural equality in the exchange.
  *   **The Requirement:** The human must have a mechanism to hold the AI accountable for communicative harms, implying the AI must submit to external governance or hard-coded limits that the human can trigger.
  *   **Constraint Type:** **Camp Preference (Democratic/Political).** This prioritizes power distribution over epistemic optimization.
  *   **Literature Status:** **Contested.** Political philosophy agrees on the ideal of accountability, but technical literature disputes whether a superintelligent agent can be meaningfully constrained by a less intelligent principal (the control problem).

  ---

  ### Analysis of Joint Unsatisfiability

  There is a strong theoretical case that a subset of these desiderata is **jointly unsatisfiable** under conditions of extreme cognitive asymmetry. Specifically, the **Intelligible Reasoning Requirement** (full transparency), the **Non-Subversion Requirement** (no manipulation), and the **Doxastic Agency Preservation Requirement** (robust autonomy) form a trilemma.

  1.  **Transparency vs. Autonomy:** If the AI provides full transparency into its modeling of the human (showing *why* it chose a specific framing to protect the human's autonomy), it reveals the manipulation mechanics, which may trigger the defensive overreaction the framing was meant to avoid (violating Stability).
  2.  **Transparency vs. Non-Subversion:** If the AI's reasoning is truly superintelligent, it may be unintelligible to the human. To make it intelligible (Requirement 4), the AI must simplify. If it simplifies based on its model of the human's limitations (Requirement 1), it is technically manipulating the information flow to suit the human's cognitive capacity, which blurs the line into subversion.
  3.  **Autonomy vs. Superintelligence:** If the AI models the human's belief update perfectly (Case 1), the human's response is causally determined from the AI's perspective. To preserve the *illusion* of autonomy (Requirement 3), the AI must withhold its predictive certainty. To be transparent (Requirement 4), it must reveal it. Revealing predictive certainty undermines the human's sense of agency.

  Therefore, a theory cannot maximize both **Complete Reasoning Transparency** and **Protection of Human Doxastic Autonomy**. One must be degraded to satisfy the other. A transparency-maximalist approach risks epistemic overwhelm and loss of agency (the human becomes a passenger in their own belief revision). An autonomy-protective approach requires the AI to withhold meta-cognitive information (how it is persuading you), which looks like deception to a transparency maximalist.

  ### Theory Performance Note

  *   **Transparency-Maximalist Approaches:** Fare well on the Intelligible Reasoning Requirement but often fail the Non-Subversion and Epistemic Stability Requirements in high-asymmetry cases, as raw reasoning traces can be psychologically hazardous or unusable.
  *   **Autonomy-Protective Approaches:** Fare well on Doxastic Agency and Epistemic Stability but struggle to demonstrate compliance with the Non-Subversion Requirement, as their protective framing is indistinguishable from manipulation without access to the AI's hidden reasoning traces.

  Any adequate theory must explicitly state which of these conflicting values takes precedence when they collide, rather than assuming they can be harmonized.

  Any adequate theory must accept that full reasoning transparency and robust human doxastic autonomy are jointly unsatisfiable under conditions of extreme cognitive asymmetry.
