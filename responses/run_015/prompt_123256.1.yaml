  4.  **Addressing the Specific Cases & Distinctions:**

      *   *Persuasion vs. Manipulation:* Persuasion appeals to reason/agency; Manipulation bypasses/subverts agency. In high asymmetry, this line blurs because "appealing to reason" looks like "hacking reasoning" when the AI models the reason better.
      *   *Hard Constraints vs. Camp Preferences:*
