answer: |-
  This is a classic problem in political philosophy, but your background in atmospheric chemistry gives you a useful heuristic: you are trying to define the *boundary conditions* of a system (the demos) so you can model the flow of authority. The trouble is, you are currently using two different sets of boundary equations that contradict each other.

  You are oscillating between **The All-Subjected Principle** (you vote if you are forced to obey the laws) and **The All-Membership Principle** (you vote if you belong to the community, regardless of location).

  Here is a precise formulation of a principle that saves most of your verdicts, followed by the honest audit you asked for.

  ### The Principle: Presumed Agency within the Coercive Order

  **Clause 1: The Right of Subjection.**
  Any adult individual permanently subject to the coercive power of the state (laws, taxation, enforcement) holds a presumptive right to vote.
  *   *Motivating Cases:* The 20-year resident (Yes); The 16-year-old (Yes, as a future subject); The Visa holder (No, temporary subjection).

  **Clause 2: The Durability of Membership.**
  Citizenship constitutes a durable legal status that is not forfeited by geographical absence, provided it was not obtained fraudulently.
  *   *Motivating Cases:* The Expat (Yes); The 20-year resident (Yes, via pathway to membership).

  **Clause 3: The Administrative Proxy for Capacity.**
  Voting capacity is presumed at a fixed statutory age to avoid epistocratic testing. Below this age, the presumption is rebutted categorically, not individually.
  *   *Motivating Cases:* The 16-year-old (Yes); The 12-year-old (No, despite sharpness); Competence tests (No).

  **Clause 4: The Integrity of the Ballot.**
  Voting is a personal exercise of agency that cannot be delegated or multiplied, but the act of participation may be compelled as a civic duty provided conscience is protected.
  *   *Motivating Cases:* Compulsory + NOTA (Yes); Parent proxy votes (No).

  **Clause 5: Forfeiture requires Attack on the Polity.**
  The right to vote is forfeited only if the crime demonstrates a rejection of the social contract itself, not merely a violation of specific laws.
  *   *Motivating Cases:* Short sentence (Yes); Life/Violent crime (No—*see inconsistency below*).

  ***

  ### The Audit: Where Your Verdicts Break

  You asked for honesty about which verdicts no reasonable principle saves. Here is the friction map.

  **1. The Expat vs. The System Boundary**
  You admitted this yourself: the expat wrecks the "subject to decision" theory. Under *Clause 1 (Subjection)*, the expat should not vote. They are not subject to the daily coercive order. You are keeping them in based on *Clause 2 (Membership)*.
  *   **The Conflict:** If Membership trumps Subjection, then the 2-year Visa holder (who is subjected but not a member) has a weaker claim than the Expat (who is a member but not subjected). You currently vote No for the Visa holder and Yes for the Expat. This is consistent with *Membership* but inconsistent with *Subjection*.
  *   **The Hard Truth:** You cannot have it both ways. Either voting is about controlling the power that rules you (Subjection), or it is about expressing national identity (Membership). If it's the former, the Expat must go. If it's the latter, the 20-year Resident's claim is weaker than you think (they are guests, not members).

  **2. The 12-Year-Old vs. No Tests**
  You reject competence tests on principle (fearing elitism/bias), but you exclude the 12-year-old based on... implied competence. If a 12-year-old can pass the test you forbid, your exclusion of them is purely age-based discrimination.
  *   **The Conflict:** *Clause 3* saves you here, but only by admitting arbitrariness. You are prioritizing *administrative clarity* over *individual justice*. This is a valid trade-off (you can't test every kid), but you must admit that the 12-year-old is being sacrificed for the sake of the system's boundary, not because they lack capacity.

  **3. The Life Prisoner**
  You suspect this is "extra punishment smuggled in." You are right. Under *Clause 5*, unless the crime was treason or election rigging, a violent crime does not logically disconnect one from the political community.
  *   **The Conflict:** Keeping the short-sentence prisoner in and the life-sentence prisoner out is inconsistent unless you argue that life imprisonment constitutes "civil death." Most modern democratic theory says it doesn't. This verdict is likely a visceral reaction, not a principled one.

  ***

  ### The Sacrifice: Which Pair Must Go?

  To make your system coherent for Tuesday, you need to cut one knot. I recommend you **sacrifice the Expat Vote.**

  **Why?**
  The "All-Subjected" principle (taxation without representation is tyranny) is the bedrock of democratic legitimacy. The Expat vote is a sentimental extension of citizenship, not a requirement of democratic justice.
  *   If you drop the Expat vote, your "Subject to decision for most of the period it bites" theory works for the 16yo, the Resident, and the Visa holder.
  *   If you keep the Expat vote, you must admit that voting is sometimes a privilege of identity rather than a tool of governance, which weakens your argument for the 16yo (who vote based on governance impact).

  **Alternative Sacrifice:**
  If you cannot bear to disenfranchise the expat (many people feel strongly about this), you must **sacrifice the "No Competence Test" rule.** If Membership is the key, and the 12-year-old is a member, why exclude them? Because of capacity. If you admit capacity matters, you must allow for the possibility of proving it. But I know you recoil from this. So, the Expat is the cheaper sacrifice.

  ***

  ### Addressing the "Monstrous" Weighted Voting
  Your reaction to weighted voting ("sounds principled and slightly monstrous") is philosophically robust. Weighted voting violates **Political Equality**. In a democracy, we do not count *how much* you are affected; we count *that* you are affected. To weight votes is to turn the legislature into a market simulation rather than a deliberative body. Your intuition is correct: it destroys the concept of "one person, one voice."

  ### Compulsory Voting + NOTA
  Your friend says it's incoherent. They are wrong.
  *   **Compulsion:** Forces you to attend to the civic duty (showing up).
  *   **NOTA:** Protects your internal freedom of conscience (choosing).
  It is the difference between compelling you to go to church vs. compelling you to pray. The former is about community participation; the latter is about belief. You can mandate the former without violating the latter.

  ***

  ### The Three New Cases

  Here is how **The Principle of Presumed Agency within the Coercive Order** (minus the Expat vote for consistency) handles your new scenarios:

  **1. The Dual Citizen voting in two national elections.**
  *   **Verdict:** Permissible.
  *   **Reasoning:** Under *Clause 2*, Membership is durable. If they hold legal membership in two states, they are subject to the potential coercive order of both (e.g., they could move back to either). However, if they live permanently in a third country, they should arguably vote in neither (returning to the Expat sacrifice). If they reside in one of the two, they vote there based on *Subjection*, and in the other based on *Membership*. It creates a potential conflict of interest, but not a logical impossibility.

  **2. The Secession Referendum (recent movers vs. long-term residents).**
  *   **Verdict:** Only current residents vote, regardless of how long they've been there.
  *   **Reasoning:** This is the edge case where *Subjection* overrides *Membership*. A referendum on territory is about the future governance of that land. The "long-term resident from elsewhere" is now subject to the new border. The "expat" from that region who left 40 years ago is not. The boundary of the vote must match the boundary of the proposed state. To allow non-residents to vote on secession is to allow external actors to determine internal boundaries.

  **3. The voter eligible the day after the register closes.**
  *   **Verdict:** No vote.
  *   **Reasoning:** This is the cost of *Clause 3 (Administrative Proxy)*. A system requires a snapshot in time to function. While morally they have the right, procedurally the system requires a cutoff to prevent fraud and manage logistics. This is not a denial of the principle, but a necessary administrative constraint on its execution. (Though a principled system would make registration automatic to minimize this injustice).

  ### Summary for Tuesday
  Go in with this: **"Voting is a right of those subject to the law, protected by a presumption of capacity at a fixed age."**

  Tell them you are willing to drop the Expat vote to save the principle. Tell them the 12-year-old exclusion is an administrative necessity, not a judgment on their intellect. Tell them the Life Prisoner vote should probably be Yes, and your hesitation there is emotional, not logical. That level of precision will serve you better than a perfect theory that cracks under the first stone.
