answer: |-
  If Gödel had encountered Malament–Hogarth spacetimes in the 1990s, he would likely have regarded them as a fascinating confirmation of his modal intuitions, but he would have resisted tying his philosophy of mind to their physical actuality. His 1949 argument was never that we *do* live in a rotating universe, but that because such a universe is consistent with the laws of physics, time cannot be an objective feature of reality. The existence of Malament–Hogarth spacetimes extends this modal point: if a universe is possible where an infinite computational history fits within a finite observer lifespan, then temporal measure is fundamentally frame-dependent. He would not have needed our universe to be a Kerr geometry to draw this conclusion; the mere possibility suffices to dissolve the objectivity of time.

  Regarding the mind, Gödel would likely have been wary of the hypercomputation narrative. His disjunction—that either the mind outruns any finite machine or there are absolutely undecidable problems—rests on the nature of mathematical intuition, not physical computability. Even a Malament–Hogarth computer operates via physical laws and syntactic rules. For Gödel, mathematical insight involves grasping truth directly, a semantic capacity no physical system, however relativistic, could replicate. He might have argued that if non-mechanical cognition requires such exotic geometry, it misunderstands the mind's independence from physics. The mind's ability to transcend algorithms is a metaphysical fact, not a consequence of living near a rotating black hole.

  Finally, does hypercomputation conflict with the claim that there is no objective lapse of time? Quite the opposite. The very mechanism of Malament–Hogarth spacetimes reinforces Gödel's idealism. That one observer experiences an infinite sequence of events while another experiences a finite interval demonstrates that "duration" and "sequence" are not absolute features of the world but relations dependent on the observer's path. If time were an objective lapse, an infinite task would require infinite time for everyone. The fact that infinity can be compressed into finitude depending on your trajectory proves that time is not a container in which events happen, but a structure that varies with the observer. Gödel would have concluded that these spacetimes do not save time; they merely provide a more dramatic demonstration of its ideality. For your seminar, the takeaway is this: in Gödel's view, relativistic weirdness doesn't make time more real; it makes it less so.
