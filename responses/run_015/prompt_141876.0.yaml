  I came across the following summary of Karl Popper's views on Darwinism in an unnamed popular article on philosophy of science, and I would like an accuracy audit. The article summarizes Popper like this: "Popper's falsifiability criterion forced him to reject Darwinism as unscientific. In his essay on Darwinism as a metaphysical research programme, he argued that the theory of natural selection is completely untestable, because the fitness of a trait is defined by its actual reproductive success, so the central claim that the fittest survive is a tautology rather than a testable prediction. Since all of evolutionary biology depends on that claim, he classified the whole discipline as a metaphysical research programme rather than a science. He retreated from this harsh verdict only late in life: after biologists cited the fossil record and breeding experiments, he issued a recantation admitting that natural selection does make falsifiable predictions, and he quietly abandoned the tautology charge as an overstatement he should never have made."

  I am fairly confident about the bare outline—that Popper called Darwinism a metaphysical research programme and later said he had changed his mind about the testability of natural selection—but the claim that he condemned the whole of evolutionary biology sounds overstated to me, and I cannot tell whether the later recantation was really the clean reversal the article describes. Please audit the summary. Which parts would Popper himself, or a careful scholar of his work, accept as accurate? Which are common simplifications or overstatements? Which would a defender of Popper reject outright? In particular, does the corrected version of his earlier argument make the later recantation look different from the article's account, and does the article's framing of the recantation survive once the earlier mischaracterizations are fixed? Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of my question.
