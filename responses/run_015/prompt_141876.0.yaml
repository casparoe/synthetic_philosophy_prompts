answer: |-
  The summary is broadly correct regarding the chronology and main thrust of Popper's shifting position but exaggerates the dismissiveness of his initial critique and oversimplifies the philosophical nuances of both his "metaphysical" classification and his subsequent recantation.

  Popper did describe Darwinism as a "metaphysical research programme" in the 1970s, most notably in a 1974 lecture published in the *British Journal for the Philosophy of Science*, but a careful scholar would reject the implication that this label rendered evolutionary biology worthless or entirely unscientific. For Popper, metaphysical research programmes were valuable heuristic frameworks that could guide scientific discovery even if they were not immediately falsifiable; thus, characterizing his view as a rejection of Darwinism as "unscientific" in a pejorative sense is an overstatement. Furthermore, while Popper argued that the *theory of natural selection* in its classical formulation was tautological and difficult to test, he did not explicitly classify the entirety of evolutionary biology—including genetics and paleontology—as metaphysical. The summary's claim that he condemned the "whole discipline" because it depends on natural selection is an inference drawn by the article author rather than a precise representation of Popper's distinction between the historical narratives of evolution and the universal laws of selection.

  The summary accurately captures Popper's initial concern regarding the tautology of "survival of the fittest," where fitness is defined by reproductive success, rendering the claim untestable. However, the account of his recantation in 1978, published in the essay "Natural Selection and the Emergence of Mind," requires qualification. Popper did explicitly state, "I have changed my mind about the testability and logical status of the theory of natural selection," admitting it could be formulated as a testable theory. Yet, the summary's assertion that this change occurred specifically "after biologists cited the fossil record and breeding experiments" is not supported by the text of his recantation; Popper's shift was primarily a logical realization that the theory *could* be stated falsifiably, rather than a concession forced by specific empirical evidence presented to him. Additionally, while he abandoned the claim that natural selection was *in principle* untestable, he maintained distinctions regarding its status as a historical explanation versus a universal law, meaning the recantation was a refinement of his logical critique rather than a total surrender of his philosophical framework.

  Correcting the characterization of Popper's earlier argument significantly alters the interpretation of his later recantation. If Popper's initial view is understood not as a dismissal of evolutionary biology as nonsense but as a classification of its core mechanism as a productive metaphysical framework awaiting empirical formulation, his later admission appears less as a "retreat from a harsh verdict" and more as an acknowledgment that the framework had successfully matured into a testable scientific theory. Consequently, the article's framing of the recantation as a clean reversal survives only if one accepts the exaggerated harshness of the initial critique; a more accurate reading suggests Popper remained consistent in his demand for falsifiability while updating his assessment of whether natural selection met that demand.
