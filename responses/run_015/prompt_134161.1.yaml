answer: |-
  The core design principle is to bind two agents to a single motor output under asymmetric incentives while banning propositional communication, thereby structurally eliminating the possibility of a negotiating executive.

  ### Reasoning
  Standard coordination games allow participants to establish a "meta-level" through language (e.g., "I'll let you win this round"). This mimics a unified executive function, which is precisely what split-brain phenomena challenge. To simulate the arbitration problem, the simulation must prevent the emergence of a negotiating self. By restricting communication to sub-lexical signals (tokens rather than sentences) and enforcing simultaneous action for a single outcome, you create a functional architecture where two rational streams compete for a single channel without a tribunal. The resulting frustration is not merely coordination failure; it is the phenomenological texture of divided agency where veto power exists but adjudication does not.

  ### Simulation: The Dichotic Lock
  **Participants:** 12 students (6 pairs).
  **Duration:** 90 minutes.
  **Stakes:** Collective grading points (shared) vs. Seminar Leadership Credits (individual).

  #### Roles and Setup
  1.  **The Pair:** Each pair constitutes one "Brain."
  2.  **The Hemispheres:** Student A is Left Hemisphere (LH); Student B is Right Hemisphere (RH).
  3.  **Physical Arrangement:** Students sit side-by-side at a single table divided by an opaque divider. They cannot see each other's screens or hands.
  4.  **Interface:** Each student has a tablet. To register a "Choice" (Left or Right), both must swipe in the *same* direction within a 3-second window. If swipes mismatch or timing exceeds 3 seconds, the round registers as "Null" (no points awarded).
  5.  **Communication Channel:** A physical slot between them allows passing "Signal Tokens."
      *   *Red Token:* "High Priority/Stop" (Cost: 1 individual point to send).
      *   *Green Token:* "Agree/Follow" (Cost: 0).
      *   *No Words:* Speaking or writing notes results in immediate disqualification for the pair.

  #### Payoff Structure (The Conflict Engine)
  Each round, private screens display point values for choosing Left vs. Right.
  *   **Collective Pot:** If the pair successfully matches a swipe, both gain 5 collective points.
  *   **Individual Pot:** Values vary per hemisphere per round.
      *   *Alignment Round:* LH and RH both gain 10 individual points for the same direction.
      *   *Conflict Round:* LH gains 10 for Left/0 for Right; RH gains 10 for Right/0 for Left.
      *   *Asymmetric Urgency:* One side sees 20 points, the other sees 5.
  *   **Win Condition:** The pair with the most Collective Points wins shared grading bonus. The *individual* within the pair with the most Individual Points wins Seminar Leadership Credit (right to lead next week's discussion).

  #### Timeline
  *   **00:00–00:15 (Briefing):** Explain rules. Emphasize the ban on language. Distribute tablets and tokens.
  *   **00:15–00:45 (Simulation):** Three blocks of 10 rounds each.
      *   *Block 1:* High Alignment (builds trust).
      *   *Block 2:* High Conflict (induces arbitration failure).
      *   *Block 3:* Randomized/Urgency (tests veto mechanisms).
      *   *Instructor Role:* Act as the "Environment." Trigger rounds manually to control pacing. Enforce communication bans strictly.
  *   **00:45–01:30 (Debrief):** Structured philosophical mapping.

  ### Debrief: Mapping Conflict to Consciousness
  Guide the discussion through three layers of analysis:

  1.  **The Phenomenology of Stalemate:** Ask pairs who experienced "Null" rounds what they felt. Likely answers: "Frustration," "I knew what I wanted but couldn't make them do it," "I felt overridden."
      *   *Philosophical Map:* This maps to **intermanual conflict** in split-brain patients (e.g., one hand buttons a shirt, the other unbuttons it). The feeling of "volitional friction" replaces unified agency.
  2.  **The Absence of Adjudication:** Ask why they couldn't just agree to trade wins.
      *   *Philosophical Map:* Because the communication channel (tokens) lacked the bandwidth for *propositional negotiation*. In split-brain patients, the corpus callosum is severed; here, the rules severed the "executive function." There was no "Boss" to decide whose points mattered more.
  3.  **Divided Consciousness vs. Divided Agency:**
      *   *Divided Agency:* You successfully simulated this. Two goal-states, one output channel, no tie-breaker.
      *   *Divided Consciousness:* Did you feel like two people? No. You felt like one person struggling.
      *   *Key Distinction:* The simulation creates divided *agency* without divided *phenomenology*. This leads to the core puzzle: Split-brain patients often report a unified sense of self despite behavioral evidence of division.

  ### Limitations and Instructor Intervention
  **The Missing Feature:** This activity cannot reproduce the **illusory unity of phenomenology** (confabulation). In the game, students *know* they are two agents fighting. In a split-brain patient, the speaking hemisphere (usually LH) often confabulates reasons for actions initiated by the RH to maintain the narrative of a unified "I." The simulation makes the conflict transparent; the clinical phenomenon is often opaque to the subject.

  **How to Supply It:** During the debrief, you must explicitly instruct them on **confabulation**. Tell them: "In this game, you knew you were fighting. In a real split-brain patient, the LH would have invented a story about why it chose Left, unaware the RH forced the conflict. You must intellectually project that *lack of awareness* onto the model we just built."

  ### Predictable Failures and Fixes
  1.  **Cheating (Verbal Negotiation):** Students will whisper to maximize points.
      *   *Fix:* Threaten immediate nullification of the pair's collective score. Walk around constantly.
  2.  **Dominance (Physical/Digital):** One student swipes instantly, forcing the other to react rather than decide.
      *   *Fix:* The software (or manual check) must require near-simultaneity (e.g., within 500ms of each other). If one is too early, register as "Null."
  3.  **Apathy (Giving Up):** Pairs may accept "Null" results to avoid conflict.
      *   *Fix:* Introduce a "Decay Mechanism." Every "Null" round subtracts from the Collective Pot. This forces action, replicating the biological imperative to act even without consensus.
  4.  **Misinterpretation of Tokens:** Students may treat Red/Green tokens as binding contracts.
      *   *Fix:* Remind them mid-game that tokens are non-binding signals. A Green token can be ignored. This reinforces the lack of authoritative command.
