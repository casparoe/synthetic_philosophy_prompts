answer: |-
  Here is a 40-minute teaching plan designed for a software engineering audience. It leverages the "Legacy Code" framing to bridge the gap between architecture and biology, explicitly manages misconceptions during the flow, and isolates the specific academic baggage you should leave behind.

  ### Session Title: "Spandrels & Legacy Code: Why Not Everything is a Feature"
  **Total Time:** 40 Minutes
  **Goal:** Attendees can distinguish between a trait selected *for* a purpose and a trait that exists as a structural byproduct.

  ---

  ### 1. The Hook: Actual Architecture (0:00 – 0:05)
  **Action:** Project an image of the interior of St. Mark's Basilica (Venice), specifically the arches and the triangular spaces between them.
  **Talk Track:**
  *   Define the **Architectural Spandrel**: It is the triangular space necessary to support the dome. It exists *because* of the arches and the dome. The architect did not design the space first; the space is a mathematical inevitability of the structure.
  *   **The Twist:** Artists later painted frescoes in these spaces.
  *   **The Trap:** If you look at the fresco 500 years later, you might assume, "This building was constructed specifically to display this painting." That is false. The space came first; the utility came second.
  *   **Transition:** "In biology, we make this mistake constantly. We see a 'fresco' (a trait) and assume the organism was 'built' (evolved) specifically to hold it."

  ### 2. The Bridge: Legacy Code Framing (0:05 – 0:10)
  **Action:** Switch to a whiteboard or slide with a code architecture diagram.
  **Talk Track:**
  *   Map the analogy explicitly. Do not let them guess the mapping.
      *   **The Organism** = The Codebase.
      *   **Natural Selection** = Refactoring for Performance/Requirements.
      *   **Adaptation** = A module written deliberately to solve a specific ticket/requirement.
      *   **Spandrel** = A side effect of the core architecture. A global variable that exists because of how the auth module was structured, not because it was needed, but now other modules rely on it.
      *   **Exaptation** = When a later developer realizes that global variable is useful for analytics and writes a new feature that depends on it.
  *   **Key Distinction:** "In tech, we know that not every line of code is there because a PM requested it. Some lines are there because of the language, the framework, or a dependency from 2015. Evolutionary Biologists (specifically Adaptationists) often act like every line of code was written for a specific Jira ticket."

  ### 3. The Carrying Example: Bird Feathers (0:10 – 0:25)
  **Why this example?**
  *   **Why NOT the Panda's Thumb:** The Panda's thumb is a wrist bone repurposed for grasping. It is an *imperfect adaptation*, but it is still an adaptation for grasping. It confuses "bad design" with "non-adaptive origin."
  *   **Why NOT the Human Chin:** It is scientifically contested. Some argue it's a spandrel of bone growth; others argue it's for speech or sexual selection. You don't want a 40-minute session ending in "well, actually..." debate.
  *   **WHY FEATHERS:** There is strong consensus that feathers existed *before* flight (for insulation or display) on dinosaurs that could not fly.

  **Talk Track:**
  1.  **The Origin (The Spandrel):** Feathers evolved in theropod dinosaurs. They had no wings. They couldn't fly. The initial "commit" of the feather gene was likely for thermal regulation or display. It was a byproduct of scale modification.
  2.  **The Co-option (The Exaptation):** Millions of years later, ancestors of birds found themselves in trees or jumping. The existing feather structure was useful for lift.
  3.  **The Adaptationist Error:** An adaptationist looks at a hawk and says, "Feathers evolved *for* flight."
  4.  **The Gould-Lewontin Correction:** "No. Flight evolved *because* feathers were already there."
  5.  **Inject Legacy Framing:** "Feathers are like a logging library included for debugging (insulation) that later turned out to be perfect for building a full observability platform (flight). If you assume the platform was the reason you installed the library, you misunderstand the history of your codebase."

  **Misconception Interception (Weave this in here):**
  *   *Misconception:* "So spandrels are useless junk?"
      *   *Correction:* "No. Feathers are vital. A spandrel is about **origin**, not **current utility**. In code, a legacy dependency isn't 'junk' if the app crashes without it. It just wasn't *originally chosen* for its current role."
  *   *Misconception:* "So Adaptationists think everything is perfect?"
      *   *Correction:* "They think everything has a *reason*. Gould argues sometimes the reason is just 'structural constraint,' not 'optimization.'"
  *   *Misconception:* "Isn't this just Exaptation?"
      *   *Correction:* "Spandrel is the **noun** (the trait's origin status). Exaptation is the **verb** (the process of co-opting it). All exaptations start as spandrels (or adaptations for something else), but not all spandrels get exapted."

  ### 4. What to Skip: The Statistics of Optimality (0:25 – 0:30)
  **Action:** Be explicit. Put a slide up that says "OUT OF SCOPE."
  **Talk Track:**
  *   "Gould and Lewontin's paper spends a lot of time attacking **optimality modeling**. This is the statistical math biologists use to prove a trait is the 'best possible solution' to a problem."
  *   **Why Skip It:** "For us, the math doesn't matter. The logic does. They argued that you can mathematically justify *any* adaptive story if you tweak the variables enough. It's like trying to prove a piece of spaghetti code is optimal by inventing a hypothetical user requirement that fits it perfectly."
  *   **The Takeaway:** "We aren't here to learn how to test for spandrels statistically. We are here to learn how to spot a 'Just-So Story' when we hear one."

  ### 5. The Check Question (0:30 – 0:35)
  **Goal:** Test if they understand *Causal History* vs. *Current Utility*.
  **Action:** Present this scenario on screen. Give them 2 minutes to think, then vote.

  > **Scenario:** You are reviewing a legacy microservice. You find a function `calculateChecksum()`.
  >
  > 1.  It is currently critical for the security module.
  > 2.  Git blame shows it was written 5 years ago by a dev who needed it for a deprecated billing feature.
  > 3.  The billing feature is gone, but the security team built their module on top of this function because it was already there.
  >
  > **Question:** Is `calculateChecksum()` an **adaptation** for security?

  **Expected Answer:** **No.** It is a spandrel (byproduct of billing architecture) that was exapted for security.
  **Discussion:** If they say "Yes, because it's used for security," they missed the point. The *origin* determines if it's a spandrel, not the *current use*. If they say "No, because it's useful," they are confusing spandrel with junk.

  ### 6. Wrap & "So What for Devs?" (0:35 – 0:40)
  **Talk Track:**
  *   **Why this matters to you:** "You work in complex systems. When you see a process in your company or a pattern in your code, do not assume it was optimized for its current purpose. It might be a spandrel of a past decision."
  *   **Final Thought:** "Adaptationism is like assuming every line of code in a repo was put there by a senior architect with a master plan. Gould reminds us: sometimes it's just there because of how the arches were built."
  *   **Open Floor:** 2 minutes for quick questions.

  ---

  ### Instructor Notes: Managing the Room

  1.  **If they ask about "Junk DNA":**
      *   *Pivot:* "Junk DNA is different. That's non-coding. A spandrel *does* something (like feathers or the fresco), it just wasn't *selected* for that thing initially. Don't confuse 'no function' with 'different origin function'."
  2.  **If they push back on Feathers (some recent papers argue early flight):**
      *   *Pivot:* "The exact timeline is debated, but the consensus remains that insulation predated powered flight. The principle holds even if the dates shift. We are discussing the logical fallacy, not the ornithology."
  3.  **If they get stuck on Exaptation vs. Spandrel:**
      *   *Analogy:* "Spandrel is the empty wall space. Exaptation is the decision to hang a painting on it. You can't have the painting decision (exaptation) without the space existing first (spandrel)."

  ### Summary of the "Skip" Section
  **Do not teach:** The critique of **optimality models** and **reification of fitness**.
  **Why:** This requires understanding population genetics equations and the philosophical concept of "reification." For devs, the "Just-So Story" (narrative fallacy) is the equivalent concept. Stick to the narrative fallacy; it translates better to engineering post-mortems.
