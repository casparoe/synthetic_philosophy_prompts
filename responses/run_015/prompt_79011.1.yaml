answer: |-
  Consider Elena, a structural engineer tasked with assigning a collapse probability to the historic "Ironwood Bridge" during an incoming Category 3 hurricane. Elena possesses all standard evidence: non-invasive acoustic scans and archival blueprints. She faces two admissible reference classes that are mutually exclusive in terms of data availability. Class A comprises "Victorian-era iron truss bridges," with a historical collapse frequency of 1% in similar storms; Class B comprises "structures exhibiting acoustic Signature-X indicative of critical micro-fractures," with a failure frequency of 80% under similar stress. The intersection class ("Victorian bridges with confirmed Signature-X") is empirically empty because confirming Signature-X requires invasive testing that would necessitate closing and reinforcing the bridge, thereby removing it from the risk population before failure can be observed. Both classes satisfy your robustness criterion: sharpening the event description to "collapse during storms with wind gusts exceeding 120 mph" leaves the frequency for Class A stable at ~1% and Class B stable at ~80%, indicating neither frequency is an artifact of vague event modeling.

  (a) The **narrowest-class rule** selects Class B (micro-fractures) as it describes the bridge's current physical state more specifically than its historical lineage, delivering **0.8**. The **widest-available-class rule** selects Class A (Victorian bridges) as the broader population with reliable statistics, delivering **0.01**. A **maximum-entropy/indifference approach**, treating the conflict between the two robust classes as a lack of meta-evidence for weighting one over the other, assigns **0.5**.

  (b) The feature doing the real work is the **observational incompatibility** between the classes: acquiring the data to define the intersection class alters the ontological status of the subject (testing implies reinforcement/removal). If you delete this feature—allowing non-invasive confirmation of micro-fractures in Victorian bridges—the intersection class becomes populated, robustness likely holds for the intersection, and the reference class problem dissolves into a standard conjunction of evidence.

  (c) The strongest line for the "incomplete information" defender is to argue that the single-case probability *just is* the frequency of the intersection class, even if that frequency is currently unknown or unknowable; they claim the divergence (0.01 vs 0.80) is merely a measure of our ignorance of the true joint distribution, not a flaw in probability theory itself.

  I reject this defense. This case demonstrates that the problem is more than epistemic because there is no "true" joint distribution waiting to be found; the intersection class is nomologically empty given the constraints of observation and preservation. Probability is not a hidden property of the bridge waiting to be uncovered, but a relational output dependent on which robust model we choose to prioritize. When robust models disagree and no higher-order fact dictates the choice, the single-case probability is objectively indeterminate, not merely unknown.
