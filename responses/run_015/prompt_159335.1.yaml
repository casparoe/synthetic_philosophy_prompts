      *   The Library case has fatal flaws regarding the *counterfactual* and *distributional equity*.
      *   Futarchy is terrible at "Closure" decisions where the status quo is destroyed.
      *   *Prediction:* They will Reject it.
      *   *Closest Analog:* Case 5 (Big Box). Why? Because it involves a specific location decision with distributional consequences and a metric that might not capture the full social cost (access vs. efficiency). Actually, Case 4 is also close on "Metric Trust," but Case 5 is closer on "Real World Impact." Wait, the *closest* analog is actually the **Farmers Market (Case 3)** but inverted. Market Move = Library Move/Close. Market Move passed because both options were viable. Library Close passes only if one option is destroyed.
