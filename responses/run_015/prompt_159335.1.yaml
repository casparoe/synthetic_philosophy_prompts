      *   *Manipulation:* **FAIL.** Regulars are keen traders. They can visit more to pump the metric if they hold "Keep Open" shares (if structured that way) or sabotage if they hold "Close" shares. Actually, if the metric is "Total Visits," closing the branch *lowers* the baseline. Traders who want it open can't easily inflate visits if the doors are locked. But traders who want it closed can't easily deflate visits at the *other* branches. The manipulation risk is asymmetric.

