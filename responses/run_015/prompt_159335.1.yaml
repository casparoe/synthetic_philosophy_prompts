  3.  **Derive the "Full Set" of Implicit Rules:**
      *   *Rule 1 (Verifiability):* The metric must be objective, automated, or third-party verified. No composite indices requiring subjective weighting (Rejects Case 4).
      *   *Rule 2 (Horizon):* 18 months max. Anything longer introduces too much noise/external variance (Rejects Case 4 & 5).
      *   *Rule 3 (Displacement/Zero-Sum):* The metric must capture *net* gain, not displacement. (Case 5 rejected likely because "local jobs" could just be jobs moving from downtown to the edge). Case 3 passed because it measured *total* receipts/footfall, implying growth, not just shifting vendors.
      *   *Rule 4 (Counterfactual Observability):* The "No" branch must be a viable status quo that can be measured if the market rejects the action. (This is the tricky one for the Library case).
      *   *Rule 5 (Administrative Neutrality):* The entity reporting the metric should not have a strong vested interest in the outcome that contradicts the market logic. (Case 1 & 2 passed because agencies just report data. Library case fails this because Admin says "stay open").
      *   *Rule 6 (Distributional Blindness):* Futarchy works best when the metric aggregates welfare without needing to weigh specific losers. If the decision is fundamentally "Neighborhood A vs. Neighborhood B," futarchy fails because the metric (Total Visits) ignores *who* loses access (Case 2 of User's rules: "Means, never who-gets-what").

  4.  **Analyze the Library Case against Rules:**
      *   *Metric:* Total visits/attendance. (Passes Rule 1 - automated counts).
      *   *Horizon:* 12 months. (Passes Rule 2).
