      *   *Actually, the strongest analog is none of the approved ones.* It's a "Poison Pill" case. But if forced to pick from the 5: **Case 5 (Big Box)**. Both involve economic efficiency vs. community presence, and both risk displacement/net loss masked by aggregate metrics.

  6.  **Drafting the Recommendation (The "Commitment"):**
      *   *Constraint:* I must commit. I cannot hedge.
      *   *Analysis:* Running this market undermines the legitimacy of the pilot.
          *   Reason 1: Unobservable Counterfactual. If you close the library, you can never know if keeping it open would have yielded more visits. The market settles on a prophecy, not a result. This breaks the epistemic mechanism of futarchy.
          *   Reason 2: Distributional Equity. "Total Visits" ignores *who* loses access. A poor neighborhood loses a branch; a rich one gets extra hours. Total visits might rise, but equity plummets. The Council sets goals; if the goal is "Efficiency," fine. But if the goal includes "Access," this metric fails.
          *   Reason 3: Admin Hostility. If the implementers (Librarians) hate the decision, they can subtly sabotage the metric (e.g., "Oh, the counting system broke that month").
      *   *Decision:* **Do Not Run.**
      *   *Principle Adopted:* "Futarchy is for optimization of ongoing systems, not for structural reductions of service where the counterfactual is destroyed." OR "Futarchy cannot resolve distributional conflicts where aggregate metrics mask local losses."
      *   *Better Principle:* **"Irreversibility and Counterfactual Integrity."** We only use markets where both branches can physically exist long enough to be measured, or where the 'No' branch is the durable status quo.

