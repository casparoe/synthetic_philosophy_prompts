          *   Manipulation risk: Low (utility bills).
          *   Counterfactual: Observable.

      *   *Case 3: Farmers Market Move.* **Approved.**
          *   Type: Location change.
          *   Metric: Vendor receipts + Pedestrian counts.
          *   Horizon: 6 months.
          *   Distribution: Specific (Plaza users vs. Rail Yard users), but metric focuses on *economic activity/vibrancy*, not satisfaction.
          *   Manipulation risk: Medium (vendors could pad receipts, but pedestrian counts act as check).
          *   Counterfactual: Observable (could have stayed).

      *   *Case 4: Rezoning (Riverside).* **Rejected.**
          *   Type: Land Use/Housing.
          *   Metric: Composite Index (Rent/Income, Dwellings, Biz Licenses).
