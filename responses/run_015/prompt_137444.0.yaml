      *   *Section 4 (Misconceptions):* Need to map these to specific times. Neuroimaging -> Early. Two things -> Middle. Meditator -> Middle/End. Worse off -> End.
      *   *Section 5 (End Question):* Needs to force a choice about value, not description.
      *   *Section 6 (Refuse):* Keep it tight. No neuroanatomy, no ethics of suicide, no defining consciousness.

