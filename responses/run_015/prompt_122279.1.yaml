  # Joint Statement on Principles of Heritage Custodianship and Restitution

  **Issued by the Adversarial Collaboration on Colonial-Era Holdings**
  **Signatories:** State-Succession Restitutionists (SSR) and Living-Community Preservationists (LCP)

  ### I. Agreed Claims of Fact and Principle

  1.  **Historical Circumstances:** Both parties acknowledge that the Benin Bronzes were removed during the 1897 British punitive expedition, constituting a seizure under duress, and that the Parthenon Sculptures were removed in the early 19th century under Ottoman authority while Greece was under occupation, lacking independent sovereign consent.
  2.  **Conservation Capacity:** Major holding museums in Western Europe and North America currently possess advanced climate-control, security, and conservation infrastructure that exceeds the average capacity of potential recipient institutions in source nations, though this gap is narrowing.
  3.  **Justice Distinctions:** We distinguish between *corrective justice* (remedying the specific wrong of the original taking) and *distributive justice* (optimizing the current allocation of objects for access, safety, and cultural utility).
  4.  **Physical Risks:** Deaccessioning, packing, and long-distance transport of fragile cultural artifacts entail non-zero risks of physical damage, which must be weighed against the risks of long-term storage in current locations.
  5.  **Boundary Case Definition:** We agree to test our principles against "The Dispersed Polity Case" (DPC): artifacts removed in the 19th century from a defunct polity whose cultural descendants are now citizens of three distinct modern nation-states, each claiming exclusive custodianship.

  ### II. Residual Disagreements

  | Issue | State-Succession Restitutionists (SSR) | Living-Community Preservationists (LCP) | Dispute Type |
  | :--- | :--- | :--- | :--- |
  | **Primary Custodial Claim** | Legitimate title flows to the modern state that serves as the legal successor to the wronged polity, regardless of internal cultural diversity. | Legitimate title flows to the community maintaining living practices tied to the object, regardless of modern state borders. | **Substantive** |
  | **The DPC Protocol** | In the Dispersed Polity Case, custodianship should default to the nation-state containing the largest geographic portion of the ancestral territory or the recognized diplomatic successor. | In the Dispersed Polity Case, custodianship should be dispersed among institutions in all three nation-states or retained centrally if safety cannot be guaranteed across all three. | **Substantive** |
  | **Definition of "Harm"** | The primary harm is the continued assertion of ownership by the holding institution over property acquired through coercion. | The primary harm is the severing of the object from its functional role in living cultural practice or exposure to undue physical risk. | **Verbal** |
  | **Role of Holding Museums** | Holding museums act as temporary stewards pending return; their conservation work is a service owed to the rightful owner. | Holding museums act as potential permanent partners; their conservation work creates a derivative interest in continued custodianship. | **Substantive** |

  ### III. Cruxes and Empirical Predictions

  To move beyond theoretical stalemate, we identify three specific cruxes where empirical evidence could shift the weight of argument. We agree on the relevance of the following cases and specify our divergent predictions.

  **Crux 1: Is legitimate state succession a necessary condition for restitution?**
  *   **Empirical Test:** The conservation and security stability of Benin Bronzes returned to Nigeria (2022–2027) versus comparable bronzes retained in London or Berlin.
  *   **SSR Prediction:** Returned items will demonstrate equal or superior stability. State sovereignty mobilizes national resources for protection, validating the state as the necessary agent of custodianship.
  *   **LCP Prediction:** Returned items will show higher variance in stability. Protection depends on local community engagement and funding continuity, which state apparatuses do not guarantee, suggesting state succession is insufficient for preservation.

  **Crux 2: Does a present cultural community's living practice create an independent custodial claim regardless of state borders?**
  *   **Empirical Test:** Access and usage metrics for the Parthenon Sculptures in London versus replica casts used in ritual or educational contexts in Athens.
  *   **SSR Prediction:** Physical proximity of the original object to the modern state capital (Athens) is the primary metric of justice; usage of replicas is a subordinate consolation. Return validates the state's cultural narrative.
  *   **LCP Prediction:** Frequency of meaningful engagement (ritual, educational, artistic) matters more than location. If replicas in Athens facilitate more living practice than originals in London, the moral claim for physical return is weakened relative to access guarantees.

  **Crux 3: Can risk of damage in transit ever be a decisive moral reason for retention?**
  *   **Empirical Test:** Comparative degradation rates of sensitive organic artifacts during international repatriation transport versus ten-year static storage in holding museums.
  *   **SSR Prediction:** Transport risk is statistically negligible compared to the moral damage of continued wrongful possession. Justice requires accepting manageable physical risk.
  *   **LCP Prediction:** Transport risk constitutes a decisive veto if it exceeds static storage degradation by any significant margin. Preserving the physical integrity of the object for future generations outweighs immediate corrective justice.

  ***

  **Status:** This document serves as a living framework. Both camps commit to reviewing the data from the Empirical Tests within five years to reassess the viability of the Dispersed Polity Protocol.
