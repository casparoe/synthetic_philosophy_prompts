  - "predictions": array of objects, one per candidate rule, each with "label", "verdict" (exactly one of "condemn", "no objection", "approve"), "feature_doing_the_work" (which single stipulation of the Vaitupu case drives the verdict under that rule), "why" (one sentence).
  - "best_guess": object with "label", "verdict", "reasons" (array of two or three sentences favoring it over the nearest rival), "rival_still_live" (the one alternative you can't rule out from the track record, and what makes it hard to eliminate).
  - "discriminating_case": object with "description" (the variant of the Vaitupu case I should read Kit next — change or hold fixed exactly one feature), "prediction_under_best_guess", "prediction_under_rival", "what_each_outcome_would_show".
  - "local_firm_variant": object with "verdict_under_best_guess" (same deal, but the concessionaire is a Vaitupu-owned firm and disputes go to Vaitupu's own courts), "what_his_muttered_remark_suggests", "why_this_is_the_crux".
