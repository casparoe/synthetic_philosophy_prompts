answer: |-
  **MEMORANDUM**

  **To:** The Academic Board
  **From:** The Academic Regulations Committee
  **Date:** December 12, 2023
  **Subject:** Recommendation on Exceptional Circumstances and Deadline Extensions

  **Recommendation**

  The Committee recommends that the University replace the current Exceptional Circumstances procedure with a system of automatic, no-questions-asked deadline extensions, supplemented by a mandatory mechanism for written justification. Under this model, every student receives a fixed allowance of extensions claimable through the student portal without disclosure. However, unlike the standard portal configuration, the University must publish the thresholds that trigger support flags and establish a right for students to demand a written justification from a named administrator regarding any system decision affecting their record. We propose a pilot launch in the Spring Term, with full rollout and the justification mechanism live by the Fall Term.

  **Reasoning and Principles**

  This recommendation rests on a specific understanding of freedom: that liberty is not merely about having options or achieving outcomes, but about standing. The current procedure treats an extension as a privilege granted by the institution's discretion. Even if caseworkers are consistently kind, the student remains a supplicant. Our proposal shifts this dynamic. By replacing "someone may let you" with "you may, as of right," we change the student's standing, not merely their menu of options. A right implies authority resides with the student; a privilege implies authority resides with the administrator. This shift is fundamental to the educational relationship.

  This view differs from two other perspectives considered by the Committee. The first view defines freedom as the absence of interference—specifically, removing the need to disclose private trauma to a caseworker. The second view defines freedom as effective capability—arguing that the old petition file was necessary to route struggling students to hardship money and mental-health services. While we agree that removing discretionary barriers is vital, we reject the notion that effective support requires invisible power.

  This leads to two critical determinations. First, regarding the portal's automated flags: the current system logs claims and flags students using invisible thresholds that cannot be seen or corrected. Some argue that if these flags accurately identify students in trouble, their secrecy is harmless. We disagree. A power that tracks people's interests but remains unappealable is incompatible with academic freedom, regardless of its accuracy or benevolence. Freedom requires that authority be visible and contestable. Second, regarding standing: moving to an automatic system does not just add options; it restores agency. It treats students as responsible adults managing their workload, rather than children seeking permission.

  **Addressing Complications**

  We acknowledge four significant complications. First, approximately 120 students with chronic conditions or disabilities will require more than the standard allowance. They will move to a "registered adjustment" route requiring annual recertification and evidence. We recognize this reintroduces discretion for the students least able to absorb it. However, the Disability Services Officer supports this distinction because tailored support requires specific knowledge of need. General extensions cannot replace targeted accommodation.

  Second, the portal's invisible thresholds pose a risk to trust. Our requirement to publish these thresholds and allow for justification mitigates this. The system is already purchased; doing nothing is financially free but ethically costly. Since the software exists, we must govern it rather than be governed by it.

  Third, teaching staff object that removing barriers relieves students of a burden rather than helping them carry it, potentially lowering standards. We contend that flexibility allows students to aim for higher quality work rather than rushing to meet arbitrary deadlines. Freedom from administrative anxiety enables intellectual risk.

  **Implementation Plan**

  1.  **January 15:** Registry to publish default portal thresholds for flagging excessive claims.
  2.  **February 1:** Pilot launch of automatic extensions in the Faculty of Arts.
  3.  **March 1:** Justification mechanism goes live for pilot faculty; students may request written reasons for any flag.
  4.  **September 1:** University-wide rollout of automatic extensions.
  5.  **September 1:** Registered adjustment route opens for students requiring allowances beyond the standard limit.

  **The Strongest Case for the Option We Are Not Recommending**

  The strongest alternative argument comes from the committee members focused on effective capability and support routing. They argue for the automatic extension system *without* the justification mechanism or published thresholds. Their case rests on the view that administrative simplicity maximizes student welfare. They argue that adding justification requirements creates bureaucracy that slows down the very relief we intend to provide. For this view to win, two things would have to be true: first, that the portal's invisible algorithms are perfectly reliable and never misidentify a student; and second, that the risk of unappealable administrative power is outweighed by the speed of the service. We reject this because accuracy does not justify authority without accountability. However, their concern for speed is valid, and we have scheduled the justification mechanism to launch one month after the pilot begins to ensure the system is stable before adding accountability layers.

  **Conclusion**

  The Committee believes this balanced approach secures the student's right to flexibility while ensuring the University retains no hidden power over their record. We ask the Academic Board to approve this motion.

  **Signed,**

  **The Academic Regulations Committee**
