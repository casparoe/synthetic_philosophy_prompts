  2. **Semantic:** Allows evolution->ought if synthetic identity holds. Allows chess norms. Fails to support colleague, who assumes analytic reduction is required.
  3. **Metaphysical:** Blocks naturalistic reduction of moral oughts. Allows chess norms (institutional facts). Fails to support colleague regarding the student's specific institutional case.
  4. **Motivational:** Blocks evolution->ought if desires don't motivate oughts. Blocks chess if rules don't motivate players. Partially supports colleague if he assumes externalism is false.
  5. **Justificatory:** Blocks direct inference, allows inference with rules. Student provides rules. Fails to support colleague's dismissal of the project entirely.
  6. **Epistemic:** Blocks science->ethics directly. Allows internal critique of practices. Partially supports colleague on evolution, not on chess norms.
  7. **Conceptual:** Allows connection without synonymy. Allows chess norms. Fails to support colleague, who conflates analysis with inference.
  8. **Radical:** Blocks everything including chess. Supports colleague's dismissal fully. But colleague cannot accept this without denying supervenience.

  3) 'The naturalistic-fallacy detour'

  The label "naturalistic fallacy" conflates two distinct claims. Properly, it refers to Moore's argument that defining 'good' via natural properties is an error (Semantic/Conceptual). Colleague uses it to block inference from fact to value (Logical/Justificatory). This conflation strengthens his stopper unfairly. If he means Moore, the student's chess case survives because institutional definitions are stipulative, not analytic reductions of moral good. If he means Hume, the student survives by supplying bridge principles (the rules). Only if he means both does he win, but that is question-begging. The label hides whether he objects to meaning, ontology, or inference. By treating them as identical, he implies that any naturalistic link is fallacious, rather than merely requiring substantive argument. This allows him to dismiss the student's internal norms as "changing the subject" without addressing whether institutional facts generate genuine normative force.

  4) 'Which reading is doing the work'

  Your colleague likely means Justificatory Dependence (you need a bridge) but treats it as Metaphysical Non-Identity (no bridge is possible). He assumes 'is' means 'brute fact' and 'ought' means 'moral requirement', ignoring institutional norms. If he meant the stronger metaphysical version, he would have to argue against supervenience, which is untenable. If he meant the weaker justificatory version, he must admit the student's rules count as bridges. He is trading on the ambiguity to shut down debate. To maintain his dismissal, he must argue that practice-internal norms are not genuinely normative but merely descriptive sociological regularities. This shifts the burden from logic to the metaphysics of institutions.

  5) 'Confidence and the soft spot'

  I am highly confident in the conceptual distinctions mapped in Sections 1 and 2; these are standard metaethical categorizations. The verdicts on triviality versus substantiveness are robust across the literature. My least sure point is the status of institutional "oughts" in Section 4. It remains contested whether rules of chess generate genuinely normative claims or merely descriptive predictions of behavior masked as norms. If the latter, the colleague's dismissal holds even under weaker readings. This ontological ambiguity is the soft spot where the student's project could still fail despite the logical map.
