  2. **Semantic Non-Equivalence:** The 'is' refers to descriptive meanings; the 'ought' to normative meanings. This claims that no normative predicate is synonymous with any descriptive predicate. It targets meaning rather than reference, blocking analytic naturalism while allowing synthetic identity. It denies that 'good' means 'pleasure'. Verdict: Substantive metaethical claim, rejected by analytic naturalists.

