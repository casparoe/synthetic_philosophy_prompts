answer: |-
  **Brainstorm: The Best Angle**

  Look, the core insight here is strong because it attacks the *architecture* of the debate rather than the furniture. Most deontologists try to argue that rights weigh *more* than utility. Consequentialists say "but five lives outweigh one right." You're suggesting they're playing different games entirely—it's not about weight, it's about structure.

  The sharpest angle is to frame this as a **category error in moral deliberation**. We're trying to add apples (rights) to oranges (welfare) because we assume deliberation requires a single utility function. If you model constraints as **veto conditions** (like a UN Security Council resolution, rather than a majority vote), the "math" of the trolley problem disappears because the operation isn't addition, it's a logical check.

  The risk, obviously, is uncertainty. Veto powers are easy in deterministic cases (did I kill him? Yes -> Veto). They get messy with probabilities (am I *risking* killing him?). If your veto model collapses into "expected veto power," you've just reinvented threshold deontology, which is basically aggregation with a high bar. The proposal needs to lean hard into that tension. That's where the workshop value is—you need people to poke holes in the risk model before you publish.

  ***

  **Project Title:** Structural Constraints: Modeling Deontology as Non-Aggregating Vetoes

  **Principal Investigator:** [Your Name]
  **Duration:** 4 Months
  **Request:** Workshop Grant

  **1. The Research Question**
  Can the paradox of deontology be dissolved by modeling moral constraints as disjunctive veto conditions that resist aggregation across agents, and does this structure remain stable under conditions of risk and uncertainty?

  **2. Why the Usual Debates Don't Settle This**
  The standard literature treats the conflict between deontology and consequentialism as a contest of *magnitude*.
  *   **Foot-style defenses** (Doctrine of Double Effect) try to distinguish types of harm, but still implicitly accept that we are weighing outcomes against constraints.
  *   **Thomson-style rights analysis** focuses on the infringement conditions, but often struggles to explain why one right blocks five lives without appealing to some hidden "weight."
  *   **Modern reply-structures** (like Kamm or Quinn) get granular about intentions and means, but they generally operate within a framework where reasons are commensurable enough to be balanced in hard cases.

  The problem isn't the balance; it's the scale. As long as we assume moral reasons from different people can be summed on a single scale (even a lexicographic one), the paradox returns. My proposal argues that deontological reasons aren't weights to be summed, but structural barriers that operate disjunctively. If Action A violates *any* agent's veto condition, it's out—regardless of the sum of benefits elsewhere. The existing debates don't settle this because they haven't formally tested the *non-aggregation* claim against decision-theoretic models of risk.

  **3. Four-Month Method**

  *   **Month 1: Formalization.**
      I'll draft the logical structure of the "disjunctive veto." This isn't full game theory, but a decision-matrix sketch. The goal is to define what it means for a reason to be non-aggregating without just saying "it's absolute." I need to show how this handles the *separateness of persons* objection without smuggling in agent-relative weights.
  *   **Month 2: Case Stress-Test.**
      Apply the veto model to the classic suite: Standard Trolley, Fat Man (Bridge), and Transplant. The hypothesis is that the veto model blocks the push in Bridge/Transplant naturally, but needs to explain why it permits the switch in Trolley (if it does). If the model forbids the Trolley switch too, it's too rigid. If it allows the Bridge push, it's collapsed into consequentialism. I'll map the boundaries here.
  *   **Month 3: The Uncertainty Challenge.**
      This is the critical month. I'll introduce probabilistic outcomes (e.g., 10% chance the bridge push fails, 90% chance the trolley kills). Does the veto apply to *expected* violations or *actual* ones? If I risk a veto violation to prevent a certain harm, does the structure hold? I'll run this by a couple of colleagues with decision-theory backgrounds to see if the math hides aggregation somewhere.
  *   **Month 4: Workshop & Draft.**
      Run a one-day mini-workshop (virtual or in-person) with 4-5 respondents. The goal isn't to present a finished paper, but to test the failure conditions. Based on that feedback, I'll finalize the core argument and produce the paper outline.

  **4. Success Conditions**
  Success isn't necessarily proving the theory is true (it's four months, come on). Success looks like:
  1.  A clear conceptual paper outline that distinguishes this "structural veto" view from standard threshold deontology.
  2.  A defense memo showing that the veto structure doesn't secretly rely on aggregating values when we model risk.
  3.  Feedback from the workshop that confirms this is a distinct contribution, not just a rehash of the agent-relative/agent-neutral debate.

  **5. Honest Failure Condition**
  The biggest risk is that the "disjunctive veto" turns out to be **hidden aggregation** once you model risk. If avoiding a 1% chance of violating a right is treated as equivalent to weighing that right against a certain benefit, then the veto is just a weight with a different name. If the workshop consensus is that you can't have non-aggregation under uncertainty without being irrational (by decision-theoretic lights), then the project fails to launch as a viable normative theory. I need to know that now before I spend years on it.

  **6. Budget Note**
  Most of the funds will go toward compensating workshop participants and covering room rental/tech for the session. I'm not traveling much, keeping it lean.

  Let me know if this aligns with what your looking for. I think the uncertainty angle is the hook that makes it fundable.
