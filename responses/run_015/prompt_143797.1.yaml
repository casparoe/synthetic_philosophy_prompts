      *   *Key Textual Point:* In *Future*, Freud says religious doctrines are *not* capable of proof. He calls them illusions. He argues we should admit they are illusions. If the user says "Illusion = functional cathexis," does that fit? Freud says "Illusion = wish fulfillment." A functionalist might say "Wish fulfillment is necessary." But Freud says "We must renounce the wish." That's the clash.

