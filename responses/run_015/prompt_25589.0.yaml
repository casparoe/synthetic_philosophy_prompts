      *   *Can conceptual distinctions solve it?* Maybe, but usually they just shift the battlefield.
      *   *Is it temperament?* Partially, but that's too dismissive.
      *   *Better Approach:* Shift from "Truth" to "Process." Since we can't agree on the *principle* in the abstract, we need to agree on the *procedure* in context.
