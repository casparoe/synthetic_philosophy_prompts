  The principle underneath your verdicts is reductionist: testimonial warrant is proportional to the hearer's independent evidence for the speaker's reliability, not an entitlement that excludes evidence.

  Clause (c) cannot survive cases 6 and 8 because in both instances your credence is driven entirely by inductive evidence (aggregate patterns, checkable accuracy rates) rather than any default entitlement; you are treating the sources as data generators whose output reliability you are measuring, not as agents whose word you are accepting. In case 8, your trust scales with the model's performance on checkable bits, which is textbook reductionism; if clause (c) held, the checkable bits wouldn't boost warrant for the uncheckable bits via entitlement, they would only fail to defeat it. In case 6, you are trusting a statistical aggregate, which is inference, not testimony, so your proposed principle regarding "someone's word" doesn't apply, but your verdict confirms you rely on evidence of reliability.

  Case 4 (Mother vs. Brother) confirms you are weighing competence against honesty to calculate expected reliability, which is reductionist; a non-reductionist entitlement view would say the Mother's admitted dishonesty acts as a defeater blocking entitlement entirely, yet you say credence goes up. Case 5 (Mechanic) is confused: if he explicitly presents it as a guess, he violates clause (a), so any credence increase is due to your inductive belief that his guesses are good, not testimonial warrant. Cases 6 and 8 are also category errors for a testimonial principle: one is statistical inference, the other is pattern matching on a non-agent, so they press your intuition but not your principle.

  Regarding your test cases: (i) The circular chain (A<-B<-A) is epistemically worse than a long chain; without independent evidence at any point, reliability estimates decay to zero, whereas a long chain might accidentally introduce a reliable link. (ii) Speakers of the evidential language are not epistemically worse off; clause (a) simply never gets satisfied, so they rely entirely on reductionist inference, which is a viable, albeit more laborious, path to knowledge.

  To clean up your view, you should treat cases 5, 6, and 8 as confused applications of "testimony" rather than pressing counterexamples, since they rely on inductive reliability tracking rather than acceptance of an assertion. Case 4 is the only genuine conflict, and it resolves in favor of reductionism: you trust your mother because her competence provides positive evidence that outweighs the negative evidence of her dishonesty, not because you are entitled to her word.
