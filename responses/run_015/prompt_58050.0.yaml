answer: |-
  It is a pleasure to address a colleague who brings both the grit of the bench and the curiosity of the seminar room to these questions. Your skepticism regarding the "strong moral" of your colleague's gloss is well-founded. While the first half of their account aligns with the prevailing meta-scientific consensus, the concluding claim—that Bayesian methods render the procedural context of data collection (stopping rules, multiplicity, preregistration) irrelevant to evidential import—is a significant overstatement. It conflates a theoretical principle of Bayesian inference with the practical requirements of scientific modeling.

  Here is an assessment of the gloss, broken down by its constituent claims, followed by an analysis of what a careful Bayesian defender would actually endorse.

  ### 1. The Frequentist Diagnosis: Accurate
  **Claim:** Frequentist procedures concern long-run behavior; the $p < 0.05$ threshold encouraged selective reporting and underpowered designs, contributing to the replication crisis.

  *   **Assessment:** **Accurate.** This is the standard diagnosis offered by the Open Science movement and widely accepted by philosophers of statistics (e.g., Ioannidis, Gelman, Mayo).
  *   **Nuance:** The $p$-value is indeed the probability of the data (or more extreme) given the null hypothesis ($P(D|H_0)$), not the probability of the hypothesis given the data ($P(H_0|D)$). The institutional reliance on a binary threshold creates incentives for "p-hacking" (optional stopping, dropping outliers, selective reporting).
  *   **Verdict:** Your colleague is on solid ground here. This is not a simplification but a robust characterization of the sociological and statistical drivers of the replication crisis.

  ### 2. The Bayesian Description: Mostly Accurate
  **Claim:** Bayesian methods represent uncertainty as degrees of belief, allow quantification of support for the null, and replace thresholds with graded updating.

  *   **Assessment:** **Accurate, with minor qualification.**
  *   **Nuance:** Bayes Factors (BF) do compare the predictive success of two models (e.g., Null vs. Alternative), allowing one to find evidence *for* the null, which frequentist significance testing cannot do. However, "degrees of belief" can be interpreted in various ways (subjective vs. objective/reference Bayesianism). In science, we often treat these not as personal psychological beliefs but as logical relations between hypotheses and data.
  *   **Verdict:** A helpful and generally correct summary of the Bayesian advantage.

  ### 3. The "Strong Moral": Conflations and Overstatements
  **Claim:** In the seedling example (monitoring daily, stopping when favorable, reporting only the winning mixture), the evidential import is *unaffected* by interim looks, unreported comparisons, or lack of preregistration, provided a default prior is used.

  *   **Assessment:** **Incorrect.** This is where the gloss collapses into a dangerous simplification. It conflates the **Likelihood Principle** with **Selection Bias** and misunderstands the nature of **Default Priors**.

  #### A. Stopping Rules (The "Interim Looks")
  *   **The Theory:** Strict Bayesians adhere to the *Stopping Rule Principle*, which states that if the stopping rule is non-informative (i.e., it doesn't depend on unknown parameters beyond the data seen so far), the posterior distribution depends only on the data actually observed, not on when you decided to stop.
  *   **The Reality:** While the *mathematical update* ignores the stopping rule, the *calibration* of the evidence does not. If you peek daily and stop when the Bayes Factor exceeds a threshold (e.g., $BF > 10$), you inflate the false discovery rate. Simulations show that optional stopping can lead to misleadingly strong Bayes Factors if the prior is not robust.
  *   **Careful Defender's View:** A careful Bayesian would admit that while the *coherence* of the update is preserved, the *long-run reliability* (calibration) is compromised by optional stopping unless the stopping rule is incorporated into the model or the threshold is adjusted.

  #### B. Multiplicity (The "Winning Mixture")
  *   **The Theory:** Your colleague suggests that because Bayesian inference conditions on the data, it doesn't matter if you tested ten fertilizers and reported only the best.
  *   **The Reality:** This is a conflation of **inference** with **selection**. If you measure ten mixtures and report the one with the highest growth, you have performed a selection operation. To infer correctly, you must condition on the fact that *this specific mixture was selected because it was the maximum*. If your model assumes this mixture was the *only* one tested, your Bayes Factor will be vastly inflated. This is the "Garden of Forking Paths" problem, and it applies to Bayesian analysis just as it does to frequentist analysis.
  *   **Careful Defender's View:** A careful Bayesian would insist that the model must reflect the data generation process. If the process involved selecting the winner from ten, the model must account for that multiplicity (e.g., via hierarchical modeling or adjusting the prior odds). Ignoring it is a modeling error, not a feature of Bayesianism.

  #### C. Default Priors ("No Substantive Assumption")
  *   **The Theory:** The gloss claims default priors introduce no substantive assumptions.
  *   **The Reality:** This is false. A "default" prior (e.g., a Cauchy distribution on effect size) implies specific assumptions about the scale of effects one expects to see. In plant physiology, if you use a default prior centered on zero with a wide spread, you are assuming large effects are possible but less likely than small ones. If the true effect is subtle, the prior can sway the Bayes Factor significantly, especially with small sample sizes.
  *   **Careful Defender's View:** Defenders of objective Bayesianism admit default priors are conventions, not assumption-free truths. They are chosen for mathematical convenience or robustness, but they *do* influence the result. Sensitivity analysis (checking different priors) is required.

  #### D. Preregistration
  *   **The Theory:** Preregistration is unnecessary because Bayesian inference conditions only on obtained data.
  *   **The Reality:** Preregistration is not just about statistical validity; it is about **transparency**. It allows the reader to distinguish between confirmatory and exploratory analysis. If you do not preregister, the reader cannot know if the "winning mixture" was hypothesized *a priori* or selected *post hoc*. Without that knowledge, they cannot assess the risk of selection bias.
  *   **Careful Defender's View:** Many prominent Bayesians (e.g., Andrew Gelman, E.J. Wagenmakers) advocate for preregistration. They argue it prevents "researcher degrees of freedom" that invalidate the model assumptions required for the Bayesian update to be trustworthy.

  ### 4. What a Careful Bayesian Defender Would Endorse vs. Object To

  If you were to ask a rigorous philosopher of Bayesian statistics (such as Colin Howson, Peter Urbach, or more pragmatically, Andrew Gelman) to evaluate your colleague's seedling example, here is how they would likely respond:

  **They Would Endorse:**
  1.  **The Likelihood Principle:** Evidence is contained in the likelihood function. Two experiments yielding proportional likelihoods should yield the same inference *ceteris paribus*.
  2.  **Coherence:** It is irrational to update beliefs in a way that makes one susceptible to a "Dutch Book" (a set of bets guaranteeing a loss). Bayesian updating preserves coherence.
  3.  **Null Support:** It is legitimate to quantify evidence for a null hypothesis, provided the alternative hypothesis is well-specified.

  **They Would Object To:**
  1.  **Ignoring the Data-Generation Model:** Inference conditions on the data *and the model*. If the model does not account for the fact that you peeked or selected the best of ten, the model is misspecified. The "Strong Moral" assumes the model is perfect, which it never is in practice.
  2.  **The "Assumption-Free" Prior:** All priors encode information. Claiming default priors are neutral is a category error.
  3.  **Calibration Ignorance:** Science requires that methods work reliably over the long run. A method that allows you to peek until you find significance (even Bayesian significance) fails calibration tests.

  ### 5. Does the Seedling Conclusion Survive?

  **No, the conclusion does not survive correction.**

  If you monitor seedling growth across several mixtures, stop when the evidence looks favorable, and report only the winner using a default prior Bayes Factor **without adjusting for these choices**, the evidential import of that figure is **compromised**.

  *   **The Correction:** To make the inference valid, you would need to:
      1.  **Model the Multiplicity:** Use a hierarchical model that treats the fertilizer mixtures as drawn from a population, or adjust the Bayes Factor threshold to account for testing multiple mixtures.
      2.  **Account for Stopping:** Either fix the sample size in advance or use a sequential Bayes Factor design with adjusted thresholds to maintain error control.
      3.  **Disclose the Process:** Transparency (preregistration or full reporting) is required so that the scientific community knows the "degrees of freedom" exercised during the experiment.

  ### Summary for Your Reading Group

  You might propose the following refinement to your group's understanding:

  > "While Bayesian methods resolve certain conceptual issues of frequentist testing (such as interpreting the null and avoiding binary thresholds), they are not immune to the biases introduced by flexible research practices. The 'Strong Moral' that Bayesian inference renders experimental design and reporting transparency irrelevant is a misunderstanding of the Likelihood Principle. Bayesian inference is conditional on the *model*; if the model fails to account for selection effects (multiplicity) or optional stopping, the resulting posterior probabilities will be overconfident. Therefore, rigorous experimental design and transparency remain essential, regardless of the statistical paradigm employed."

  Your instinct that the story was "too neat" was correct. Statistics, whether frequentist or Bayesian, cannot correct for a lack of honesty about how the data were generated.
