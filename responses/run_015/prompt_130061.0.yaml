answer: |-
  hey, this looks like a solid setup. it's tricky to get the options descriptive without giving away the shop, but i think we can manage it by focusing on the *phenomenology of the repair* rather than the emotion name. 

  here's a draft of the 7 cases. i kept the tone a bit loose (couple typos left in on purpose so it doesnt look too polished) and made sure to drop "reputational anxiety" and "prospective exposure" into the option text where they act as distractors. 

  below the quiz is the scoring logic, followed by the notes on the blurry pair and the unoccupied logical space you asked for.

  ***

  ### seminar quiz: moral architectures & affective tech

  **instructions:** for each scenario, pick the response that best matches your intuitive judgment about what *should* happen or what is *actually* going on. don't overthink the labels; just go with the gut reaction on the mechanism.

  **1. the corporate restitution**
  a manufacturing firm dumps toxic waste. it's discovered. what constitutes a complete moral resolution?
  a) the firm pays the calculated fine, remediates the site, and the ledger is balanced. the debt is cleared.
  b) the ceo must resign publicly and the brand undergoes a period of public penance to restore honor.
  c) the fine is just a price signal; the "moral" element is merely **reputational anxiety** managing future risk.

  **2. the hermit's vow**
  a person living in total isolation breaks a solemn personal vow. no one else exists to know. why do they feel bad?
  a) because they violated a rational principle they hold; the feeling is a signal to repair the internal inconsistency.
  b) because they feel fundamentally stained or diminished as a being, even without an audience.
  c) because they are simulating an audience; the feeling is **prospective exposure** risk-management in absentia.

  **3. the whistleblower**
  an employee reports safety violations. what is the primary source of their fear?
  a) fear of having violated professional code and duty.
  b) fear of exile, ostracism, and being marked as a traitor by the group.
  c) fear is just data; it's a calculation of social cost vs. ethical benefit, nothing deeper.

  **4. the political apology**
  a politician is caught in a scandal. they give a press conference. what makes the apology "work"?
  a) admitting the specific act and proposing policy changes to prevent recurrence.
  b) displaying visible brokenness and asking for reintegration into the community fold.
  c) successfully lowering the temperature of the news cycle to minimize long-term damage.

  **5. the algorithmic score**
  a social credit system assigns you a number based on behavior. what does the number represent?
  a) a tally of debts owed to the social contract.
  b) a measure of your worth or standing relative to others.
  c) the distinction between "debt" and "worth" is folk psychology; it's just behavioral data.

  **6. the private thought**
  you have an intrusive, violent thought but do not act. is there a moral violation?
  a) yes, because the will entertained the wrong maxim; it needs correction.
  b) yes, because having the thought makes you the *kind of person* who could do it.
  c) no, unless it leaks into action; moralizing thoughts is a category error.

  **7. the forgiveness ritual**
  a victim accepts an apology. what has changed?
  a) the debt is settled; the offender no longer owes repair.
  b) the relationship is restored; the offender's identity is renewed.
  c) "forgiveness" is just a label for de-escalation; nothing metaphysical has shifted.

  ***

  ### scoring key & leaf mapping

  tally your answers (A, B, or C). then follow the decision tree below. note that this isn't perfect—psychometrics is messy—but it should sort you into the five theoretical leaves.

  **dominant A (Institutional Guilt / Prospective Optics)**
  *   **Leaf 1 (Institutional Guilt):** If you picked **A on Q2 (Hermit)**. You believe guilt is a distinct, engineerable tech focused on repair.
      *   *Awkward Commitment:* You must accept that mass harm can be treated as a bookkeeping error if restitution is paid.
  *   **Leaf 4 (Prospective Optics):** If you picked **C on Q2 (Hermit)** but mostly A/C elsewhere. You view shame/guilt as functional risk-management.
      *   *Awkward Commitment:* You have to explain why shame feels so visceral/heat-filled if it's just cold risk calculus.

  **dominant B (Basal Shame / Structural Pairing)**
  *   **Leaf 2 (Basal Shame):** If you picked **B on Q2 (Hermit)** and **B on Q6 (Thought)**. You think shame is the root substrate; guilt is just internalized shame.
      *   *Awkward Commitment:* A hermit with perfect private repair should still feel self-stain.
  *   **Leaf 3 (Structural Pairing):** If you picked **B on Q1 or Q7** but mixed A/B elsewhere. You see them as incommensurable tools tied to specific social architectures.
      *   *Awkward Commitment:* You must deny there's any universal answer to which is "better."

  **dominant C (Collapse)**
  *   **Leaf 5 (Collapse):** If you picked **C on Q5 (Algorithm)** and **C on Q7 (Forgiveness)**. You think the distinction is a folk taxonomy with no normative weight.
      *   *Awkward Commitment:* You must dismiss centuries of moral psychology as mostly category error.

  ***

  ### instructor notes: limitations & logical gaps

  **1. the blurry pair (Leaf 1 vs. Leaf 4)**
  you were right to suspect these blur. on the **institutional-design items** (like Q1 Corporate Restitution), Leaf 1 and Leaf 4 often recommend the exact same policy.
  *   **Leaf 1** says: "Engineer guilt via privatized repair."
  *   **Leaf 4** says: "Cultivate shame-as-risk to ensure compliance."
  *   **The Problem:** In practice, both result in a system where you pay a cost and move on. The quiz struggles to seperate them because both treat the emotion as a *tool* rather than a *truth*. Leaf 1 thinks the tool is "guilt" (internal sanction); Leaf 4 thinks the tool is "exposure management" (external sanction). unless the student bites hard on the Hermit question (Q2), these two leaves are functionally identical in a policy context.

  **2. the unoccupied logical combo**
  there is one logical space the tree leaves empty: **"Shame is Basal but Culturally Eliminable."**
  *   **The Combo:** This position would claim that shame is the ontological root of moral emotion (Leaf 2 claim) BUT that a culture can successfully engineer itself to run purely on guilt/restitution without shame residue (Leaf 1 claim).
  *   **Diagnosis:** This is likely **incoherent**. If shame is truly *basal* (the substrate), you can't engineer it away via culture any more than you can engineer away hunger by changing the menu. Leaf 2 acknowledges this (culture can't choose away). Leaf 1 avoids it by assuming guilt is the primary tech. To hold both is to say "the foundation is wood, but we can build a house that acts exactly like it's made of steel without any wood showing." it's an unexplored spot because it requires a theory of emotion that is both biologically fixed and infinitely plastic.

  **3. distractor check**
  i dropped **reputational anxiety** in Q1 and **prospective exposure** in Q2. these are meant to catch students who want to pick "Shame" but are actually leaning toward a functionalist/risk account (Leaf 4). if they pick those options, they shouldn't score as Basal Shame.

  hope this works for the seminar. let me know if you need to tweak the hermit case, thats usually the pivot point.
