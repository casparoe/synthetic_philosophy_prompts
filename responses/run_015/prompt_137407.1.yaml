answer: |-
  ### Glossary of Translated Terms

  Before proceeding, I will define the philosophical concepts using your experimental design vocabulary. I will adhere to this lexicon throughout.

  *   **Intervention:** Actively setting a control knob to a specific value (e.g., closing a shutter), as opposed to passively recording a reading (conditioning).
  *   **Baseline/Control Run:** The reference state of the apparatus against which signals are measured (e.g., beam off, dark current measured).
  *   **Contrast:** The difference in output signal between two settings of an input variable (e.g., Signal$_{on}$ minus Signal$_{off}$).
  *   **State Space:** The set of all variables and parameters explicitly included in your model of the apparatus.
  *   **Coarse-Graining:** The decision to ignore micro-variables (e.g., thermal jitter of individual molecules) and treat a system as having macro-states (e.g., Temperature = 300K).
  *   **Error Budget:** The accounting of all known sources of variance and uncertainty; a term is included only if it is bounded and non-negligible.
  *   **Screening Off:** A variable is screened off if, once you condition on a mediating variable, the first variable provides no additional predictive power (conditional independence).
  *   **Null Result:** A measurement where the signal is indistinguishable from noise within the detection limits; reported as an upper bound, not a value.
  *   **Protocol/SOP:** The written specification of how the apparatus is to be operated and what the "normal" state is.

  ---

  ### Part I: Translations of Philosophical Positions

  #### 1. The Counterfactual / Difference-Making View (Lewis, Woodward, Pearl)
  **The Position:** $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. In interventionist versions, if you wiggle $C$, $E$ wiggles.
  **The Translation:** This is **contrast estimation via intervention**. To say "the lack of cooling caused the overheating" is to claim that if you perform an **intervention** setting the cooling parameter to "Active" (the counterfactual), the temperature reading drops (the **contrast**).
  **Translator's Note:** I am supplying a **protocol** here. Lewis's "closest possible world" is vague. In your vocabulary, "had $C$ not occurred" requires a defined **baseline**. You cannot estimate a contrast without specifying the reference state. The philosophical debate often hides the cost of setting up that reference state. In the lab, you never ask "what if?" without specifying "compared to what setting of the knobs?"

  #### 2. The Process / Conserved-Quantity View (Salmon, Dowe)
  **The Position:** Causation requires a physical process transmitting a conserved quantity (energy, momentum). Omissions transmit nothing, so they are not causes.
  **The Translation:** This is **signal tracking and conservation auditing**. A cause must show a flux in the **error budget**. If the overheating happened, there must be a joule count entering the system. "Lack of cooling" adds no joules; it merely fails to remove them. Therefore, in a strict flux audit, the omission is not a source term.
  **Translator's Note:** This translates cleanly only if you treat the system as closed. In experimental practice, you often treat boundary conditions (like a heat sink) as causal parameters even if they don't inject energy. To make this view hold, I have to assume you are strictly distinguishing between *source terms* (injection) and *boundary conditions* (constraints) in your equations of motion.

  #### 3. The Normative / Expectation View (Hart, Honoré, etc.)
  **The Position:** We select omissions as causes based on norms, duties, or expectations (what was *supposed* to happen).
  **The Translation:** This is **deviation from SOP**. The "cause" of a failure is the parameter that violated the **Protocol**. If the SOP says "Shutter closes at T=0" and it didn't, that omission is the cause. If the SOP says nothing about the shutter, its staying open is not a cause, even if physically relevant. The causal structure is fixed by the **State Space** definition in the spec sheet.
  **Translator's Note:** I am explicitly equating "moral norm" with "Standard Operating Procedure." This works for the lab, but in the literature, "norms" can be moral or statistical. I am restricting this to *operational* norms. This position survives in your vocabulary only because you have a **calibrated baseline** (the SOP). Without an SOP, there is no "deviation," only state changes.

  #### 4. Double Prevention
  **The Position:** $A$ prevents $B$. $C$ prevents $A$. Therefore, $C$ causes $B$ (by removing the preventer).
  **The Translation:** This is **interlock removal**. $A$ is a shield or filter (e.g., a beam block). $B$ is the detector signal. $C$ is the mechanism that retracts the block. $C$ causes $B$ not by sending a signal, but by removing a **screening** variable. In a block diagram, this is a chain: $C \to \text{Open Switch} \to \text{Signal}$.
  **Translator's Note:** This translates very cleanly. In instrumentation, disabling a safety interlock is causally equivalent to pressing "Go." The only distortion is that philosophers treat this as puzzling; in the lab, it is just a logic gate (NOT $A$ AND $C$).

  ---

  ### Part II: The Residue Report

  Here I test your two conjectures and the specific residues against the translations above.

  #### Conjecture 1: Instrumented vs. Boundary vs. Bare Omissions
  *Your Claim:* Physicists never encounter "bare" omissions. Intuitions hold for instrumented/boundary cases but collapse for bare ones.
  *Verdict:* **Supported.**
  In your vocabulary, a "bare omission" is a variable that is **outside the State Space**. If you did not instrument it, log it, or bound it, it does not exist for the experiment.
  *   **Instrumented Omission:** A parameter actively held at zero (e.g., voltage grounded). This is a valid **control run**.
  *   **Boundary Omission:** A missing condition (e.g., no heat sink). This is a **boundary condition** in the model.
  *   **Bare Omission:** A variable not in the **State Space**.
  *   **Indictment:** This indicts the **Debate**. The philosophical literature often argues about "bare omissions" (e.g., "I didn't save the drowning child because I was in another country"). In your framework, this is a **modeling error**. You cannot assign causality to a variable you have not defined in your **State Space**. The dispute arises because philosophers are arguing about where to draw the system boundary, while pretending to argue about the causal connection inside the boundary.

  #### Conjecture 2: Presences Detected, Absences Inferred
  *Your Claim:* Absences are model-mediated (inferred from bounds), not detected.
  *Verdict:* **Supported.**
  A presence is a reading above the **detection limit**. An absence is a **null result** bounded by the **noise floor**. To claim "the absence caused the failure," you must rely on a **model** that predicts a signal *should* have been there.
  *   **Indictment:** This indicts the **Debate** (specifically the metaphysical ambition). If every causal claim about an omission relies on a **model + calibrated bound**, then omission causation is epistemic (about our knowledge/model), not ontological (about the world). The debate treats it as a feature of the world. You are correct: it is a feature of the **error budget**.

  #### Residue A: The Profligacy Problem
  *The Issue:* If omission is causation, everyone who didn't water the plant caused its death.
  *Translation:* This is a **factorial design** problem. You cannot test every variable. You **screen off** variables with negligible **gain** or **coupling strength**.
  *   **Analysis:** In the lab, you ignore the "non-waterers" because their **contrast** is zero relative to the noise, or they are **screened off** by the soil moisture variable.
  *   **Indictment:** This indicts the **Debate**. Philosophers treat all counterfactuals as ontologically equal. Experimentalists treat them as unequal based on **sensitivity**. The "problem" dissolves when you admit that causation is a **coarse-graining** choice. We select the "cause" based on which variable offers the highest leverage for control, not because it is metaphysically unique.

  #### Residue B: Production vs. Permission
  *The Issue:* Did the switch *make* the light go on (production), or just *allow* it (permission)?
  *Translation:* This is **Source Term vs. Boundary Condition**.
  *   **Analysis:** In your differential equations, you can move terms between the source side and the constraint side depending on how you define the system. Closing a circuit adds a path (boundary change) which allows current (source) to flow.
  *   **Indictment:** This indicts the **Debate**. The distinction is a **modeling decision**, not a physical fact. You can model the battery as the cause (source) or the closed switch as the cause (boundary condition change). Both are valid descriptions of the same **state space** trajectory. The demand for a unique answer is a demand for a unique **coordinate system**, which does not exist.

  #### Residue C: The Tort Law Demand (Binary Yes/No)
  *The Issue:* Your friend in law needs a binary verdict. You say it's a modeling decision.
  *Translation:* This is **Thresholding Continuous Data**.
  *   **Analysis:** The physical reality is a **signal-to-noise ratio** (continuous). The legal verdict is a **discriminator** (binary). You set a threshold (e.g., "preponderance of evidence" or "5-sigma") and bin the result.
  *   **Indictment:** This indicts the **Framework** (specifically, its application to administration), but ultimately indicts the **Law's ontology**. Your framework correctly identifies that the binary answer is a **coarse-graining** imposed for administrative stability. The friction exists because the Law demands a **digital output** from an **analog world**. The debate tries to justify the digital output metaphysically; you correctly identify it as a **protocol requirement**.

  ---

  ### Part III: Final Verdict

  **Is your discomfort an occupational deformation or an insight?**

  It is an **insight**.

  Your discomfort stems from the fact that the philosophical debate treats "causation" as a single natural kind, whereas your vocabulary reveals it to be a **measurement protocol**.

  1.  **On Omission:** You are correct that "bare omissions" are artifacts of poorly defined **system boundaries**. In a well-instrumented lab, every "nothing" is a "something held constant." The philosophical confusion tracks the ambiguity of the **State Space**.
  2.  **On Model-Mediation:** You are correct that omission claims are **null results** interpreted through a **model**. This makes them epistemically distinct from presence claims. The debate tries to hide this mediation; your framework exposes it.
  3.  **On the Residue:**
      *   **Profligacy:** Solved by **variable selection** (sensitivity analysis).
      *   **Production/Permission:** Solved by **coordinate choice** (source vs. boundary).
      *   **Tort Law:** Solved by acknowledging **thresholding**.

  **Conclusion:**
  The debate is not about causation. It is about **which question is in charge**.
  *   The **Metaphysician** asks: "What is the fundamental structure of reality?" (Demanding a binary, model-independent answer).
  *   The **Experimentalist** asks: "How do I construct a stable **error budget** to predict and control outcomes?" (Accepting model-dependence and coarse-graining).

  The "problem of omission" arises when the Metaphysician tries to use the Experimentalist's tools (counterfactuals, interventions) without accepting the Experimentalist's constraints (defined baselines, instrumented states, error budgets). Your framework does not fail to represent the world; it represents the world *as accessible to intervention*. The residue indicates that the philosophical debate is asking for a "view from nowhere" (a causal map without a map-maker or a scale), which is an **ill-posed problem** in your vocabulary.

  You are not missing the point; they are missing the **apparatus**.
