answer: |-
  The white room of the Synapse Ward had no corners, only curves that suggested infinity. Elias stood in the center, his avatar shimmering slightly at the edges, a visual artifact of the neural link. In his hands, he held a case. It was not a virtual construct generated by the facility's servers. It was a physical lockbox, matte black steel, brought from the outside world and registered into the haptic field. It was heavy, cold, and scarred.

  Elias needed to know that something existed outside the loop of his own consciousness. The Ward dissolved the boundary between mental representation and physical object; here, a thought could manifest as a wall, and a wall could vanish with a command. Dissociation was the primary side effect. Patients forgot where their minds ended and the simulation began.

  Elias placed the box on the floating table. It made a solid, dull thud.

  "Premise one," Elias said to the empty air. "Here is the case."

  Dr. Aris stepped out of the shimmering wall, her avatar resolving into focus. She watched him with the detached curiosity of a technician observing a glitch. "You're rehearsing again, Elias."

  "It's not a rehearsal. It's a proof." Elias kept his hand on the lid. The metal bit into his palm, a specific, sharp pressure. "Here is the case. The case is not a part of my mind. Therefore, something exists outside my mind."

  Aris walked around the table. She reached out, her fingers passing through the box's holographic shadow before the haptic feedback engaged, allowing her to touch the surface. "It feels real. I'll grant you that. The latency is zero."

  "It isn't about latency," Elias said. "It's about independence. I didn't will this here. It resists me."

  "Resistance is just a variable in the code," Aris replied softly. "I can write a script that makes a virtual object immovable. If I set the friction coefficient to infinity, you couldn't push it either. Does that make the script an external world?"

  Elias tightened his grip. "No. Because this box was here before I logged in. I carried it."

  "You remember carrying it," Aris countered. "Memory is data. In here, data is king."

  Elias frowned. He had read the transcripts in the facility library, the old philosophical texts digitized for cognitive therapy. "Moore knew this. He knew you couldn't force the skeptic to accept the premises through deduction. That's why he didn't use formal logic to refute idealism. He just asserted the certainty of the object."

  Aris tilted her head. "That's a common misunderstanding. People think Moore was trying to build a logical fortress. He wasn't. He was pointing. He was saying, 'I know this with greater certainty than I know the premises of any argument to the contrary.' He wasn't proving the world existed to the skeptic; he was proving he wasn't crazy."

  "Then I'm not crazy," Elias said. He lifted the box. The weight pulled at his shoulders, a familiar gravity that the simulation usually smoothed over. "I know this weight. It's not a variable. It's a fact."

  "To you," Aris said. "But structurally, your argument begs the question. You assume the box is external to prove the external world exists. If I am a brain in a vat, or a mind in a server, the box is just another idea."

  Elias looked at the box. He knew she was right, logically. The structure was circular. If the environment could perfectly mimic the resistance of steel, then the sensation of steel proved nothing about the source of the sensation. The proof failed philosophically. It could not bridge the gap between appearance and reality for an observer who doubted the senses themselves.

  But Elias felt the cold seeping into his bones. He felt the ache in his lower back from the lift.

  "It doesn't matter if it proves it for you," Elias said. He clicked the latches. *Click. Click.* The sound was sharp, final. "It works for me."

  "How?"

  "Because I have to carry it," Elias said. "If it were just mental content, I could drop it without consequence. But if I drop this, it dents the floor. It imposes itself."

  "It imposes itself because the server tells the floor to dent," Aris said, though her voice lacked its earlier conviction. She was watching his hands. They weren't shaking anymore. The dissociative tremor that plagued most patients in the Ward had vanished the moment he gripped the handle.

  "Maybe," Elias said. "But I'm choosing to treat this as the anchor. Moore didn't need the skeptic to agree. He just needed to know where he stood."

  Elias lifted the case again. He turned away from the doctor, toward the curved wall that served as the exit. He didn't know if the wall was real. He didn't know if Aris was real. He didn't even know if the box was truly steel or just a perfect simulation of steel that he was forbidden to alter.

  But as he walked, the weight dragged him down. It grounded him in the immediate present. He was not a floating consciousness; he was a body burdened by an object. The proof failed to secure the external world as a theoretical certainty—Aris would never concede that point—but it secured it as a practical necessity.

  Elias pushed open the door. It required effort. The box swung against his leg, bruising the shin. He winced.

  Pain was a language he understood. He walked out into the corridor, carrying the weight, leaving the argument behind. The world might be a dream, but the box was heavy, and that had to count for something.
