answer: |-
  Here is a formalized decision procedure based on your heuristics, designed for your specific constraints (time, personnel, evidence limits), followed by the test cases and the hard truth about where it will hurt.

  ### Part 1: The Sentience Assessment Protocol (SAP) v1.0

  **Purpose:** To determine if a species falls under the Welfare Code.
  **Time Limit:** 40 minutes per assessment.
  **Users:** Auditors (Level 1), Vets (Level 2), Committee (Level 3).

  #### Step 1: The Neuroanatomical Cutoff (Fact Check)
  *Question:* Does the species possess a centralised nervous system (CNS) or functionally equivalent ganglia structure?
  *   **Source:** Existing anatomical summaries (e.g., government fisheries data, standard invertebrate zoology texts).
  *   **Yes:** Proceed to Step 2.
  *   **No:** **Exclude.** (Justification: "Lacks anatomical substrate for integration of nociceptive signals.")
  *   **Unsure:** Proceed to Step 2 (Flag as "High Uncertainty").
  *   *Note:* This is your "flat cutoff." It is not a claim that sentience is *impossible* without a CNS, but that it is *unverifiable* within our constraints.

  #### Step 2: The Motivational Flexibility Test (Evidence Check)
  *Question:* Is there peer-reviewed or industry-observed evidence of the animal making trade-off decisions?
  *   **Definition for Auditors:** Does the animal endure a mild aversive stimulus (e.g., light, slight heat, handling) to obtain a reward (food, shelter, mates), OR change its strategy when the cost of the stimulus increases?
  *   **Sufficient Yes:**
      1.  Published study showing trade-offs.
      2.  OR, documented on-farm observation of avoidance learning that is *not* immediate reflex (e.g., returns after threat passes, or finds workaround).
  *   **Insufficient Yes:** Reflex withdrawal (e.g., clam closing when touched) or simple habituation (stopping response after repeated neutral stimulus).
  *   **No:** **Exclude.** (Justification: "Behavior consistent with nociception/reflex only; no evidence of affective state.")
  *   **Unsure:** Proceed to Step 3.

  #### Step 3: The Precautionary Buffer (Value Check)
  *Question:* Given the uncertainty, does the potential for suffering outweigh the cost of regulation?
  *   **Trigger:** Used when Step 1 or 2 is "Unsure" or evidence is conflicting.
  *   **Procedure:** Apply the **Uncertainty Multiplier**.
      *   If the animal is phylogenetically close to a covered species (e.g., a new crab species when crabs are covered), assume **Covered**.
      *   If the animal is phylogenetically distant and evidence is null, assume **Excluded** *unless* there is a specific mechanism of harm that mimics covered species (e.g., boiling alive).
  *   **Decision:**
      *   **Covered (Provisional):** Requires retailer sign-off.
      *   **Excluded:** Requires written justification citing "Insufficient evidence of capacity."

  #### Step 4: The Value Hand-Off (Governance)
  *   **Stop Point:** If Step 3 results in "Covered (Provisional)" but the compliance cost is deemed "Existential Threat to Supplier" by the Vet.
  *   **Action:** Hand to Committee/Retailer.
  *   **Reason:** This is no longer a question of *can* they suffer, but *how much* suffering we as a market are willing to pay to prevent. This is an ethical budget, not a scientific fact.

  ---

  ### Part 2: Addressing the "Proxy" Objection

  Your committee member is philosophically correct but operationally wrong. Here is the script for that conversation:

  **The Objection:** "Motivational flexibility is just a proxy. We care about suffering, not flexibility."
  **The Response:** "Agreed. But suffering is a private, internal state (qualia). We cannot measure it directly even in humans without self-reporting. In animals, we *only* have proxies.
  We choose Motivational Flexibility over Reflex because Reflex is compatible with a robot (input -> output), whereas Flexibility implies an internal valuation system (input -> *weighing* -> output). It is the best *observable signal* of the *unobservable state*. We are not saying flexibility *is* suffering; we are saying it is the highest-fidelity signal available within a 40-minute audit window."

  **What gets dropped:** Nuance about "degrees" of sentience. For the Code, it is binary: Covered or Not.
  **What must survive:** The distinction between **Nociception** (damage detection) and **Suffering** (negative emotional experience). If you collapse these, you regulate reflexes, which is scientifically dishonest.

  ---

  ### Part 3: Revision Mechanism

  The Code is static; the science is not.
  *   **Trigger:** Publication of a major review (e.g., by LSE Sentience Centre, RSPCA, or government body) changing the status of a Phylum.
  *   **Action:** Automatic "Step 1 Review" for all species in that Phylum.
  *   **Sunset Clause:** Any "Excluded" decision based on "Unsure" evidence expires after 3 years. The supplier must re-apply with new data or accept "Provisional Coverage."

  ---

  ### Part 4: Running the Five Cases

  #### 1. Decapod Supplier (New Crab Species)
  *   **Step 1 (Neuro):** Yes (Central ganglia).
  *   **Step 2 (Flexibility):** Yes (Extensive literature on trade-offs in crabs/lobsters).
  *   **Step 3 (Precaution):** N/A (Evidence is strong).
  *   **Result:** **Covered.**
  *   **Justification:** "Possesses centralised nervous system and demonstrated motivational flexibility in peer-reviewed literature regarding avoidance learning and trade-offs."

  #### 2. Oysters and Mussels (Current Farm)
  *   **Step 1 (Neuro):** No (No central brain; dispersed nerve nets).
  *   **Step 2 (Flexibility):** No (Closing shell is reflex; no evidence of trade-off decisions).
  *   **Step 3 (Precaution):** N/A (Anatomical cutoff is definitive).
  *   **Result:** **Excluded.**
  *   **Justification:** "Lacks centralised nervous system required for integration of nociceptive signals. Behavior consistent with reflex only."

  #### 3. Black Soldier Fly Larvae (Feed)
  *   **Step 1 (Neuro):** Yes (Insect ganglia).
  *   **Step 2 (Flexibility):** Unsure/Weak (Some evidence in adult flies, less in larvae).
  *   **Step 3 (Precaution):** Phylogenetically close to bees/ants (often excluded but debated). Given they are feed (high volume, low margin), apply Uncertainty Multiplier.
  *   **Result:** **Excluded (with Review Trigger).**
  *   **Justification:** "Anatomical capacity present, but current evidence for motivational flexibility in larval stage insufficient for Code inclusion. Review in 3 years."

  #### 4. Honeybee Operation (Colony Argument)
  *   **Step 1 (Neuro):** Yes.
  *   **Step 2 (Flexibility):** Yes (Complex learning).
  *   **Step 3 (Precaution):** The "Colony" argument is a management metric, not a welfare exemption.
  *   **Result:** **Covered (Individual).**
  *   **Justification:** "Welfare Code applies to individual sentient units. Colony health is a management metric, not a substitute for individual welfare status."

  #### 5. Unknown Species (No Tests Ever Run)
  *   **Step 1 (Neuro):** Unsure (No data).
  *   **Step 2 (Flexibility):** No (No data).
  *   **Step 3 (Precaution):** **High Uncertainty.** Apply Precautionary Principle.
  *   **Result:** **Covered (Provisional).**
  *   **Justification:** "Insufficient data to rule out sentience. Under Section 3 (Precautionary Buffer), potential suffering weighted higher than compliance cost. Status reviewed upon submission of behavioral data."

  ---

  ### Part 5: The Uncomfortable Outcome

  The case you are not going to like is **Case 5: The Unknown Species.**

  **Why you won't like it:**
  You are a farmer. You know that margins on new species are razor-thin. By applying your own rule ("weighting possible suffering heavier than possible cost"), this procedure effectively places a **moratorium on innovation**. It says: *"You cannot farm this new thing until you prove it doesn't suffer."* This reverses the usual burden of proof. It will stall new product lines, frustrate suppliers who want to diversify, and force you (the committee) to sign off on restrictions based on zero data. It feels like regulating ghosts.

  **Why the procedure is right to say it:**
  This is the integrity check of your Precautionary Principle.
  1.  **Consistency:** If you exclude the Unknown Species because "there's no proof they suffer," you are implicitly demanding proof of *non-sentience*. But since sentience is an internal state, proof of non-sentience is arguably impossible to gather definitively. If you require proof of sentience to regulate, you will always wait too long.
  2.  **Risk Asymmetry:** If you are wrong and they *don't* suffer, the cost is economic (compliance paperwork, minor husbandry changes). If you are wrong and they *do* suffer, the cost is moral (systematic torture of a new class of beings). Your heuristic explicitly states you weight the moral cost higher.
  3.  **The "Gut" Check:** You said you wanted to move off gut instinct. Gut instinct says "It looks weird, let's try it." Procedure says "We don't know what it is, assume it feels." The friction you feel is the cost of having an ethical framework rather than just a business one.

  **The Personal Conflict (Oysters):**
  You might also feel a pang regarding **Case 2 (Oysters)**. The procedure clears them cleanly. You will be relieved, but if you are honest, you will wonder if the "No Central Brain" cutoff is too convenient for your livelihood. The procedure protects you from that guilt by making the cutoff anatomical and objective. Stick to it. If the science changes on bivalve neuroanatomy, the Revision Mechanism will catch it. Until then, consistency requires you to accept the exemption you gave yourself.

  **Final Advice:**
  When the Unknown Species case comes up, do not argue the science. Argue the **risk**. "We are not saying they *do* suffer. We are saying we cannot afford to be wrong." That is a defensible business position, not just a philosophical one.
