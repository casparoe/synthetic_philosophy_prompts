answer: |-
  **OptiVote Help Center**
  **Category: Voting Integrity & Protocol Specs**

  **1. What does "strategy-proof" mean in the OptiVote ecosystem?**
  It means no voter ever benefits from misrepresenting their preferences. Our engine adheres strictly to formal social choice constraints. To maintain this guarantee across all use cases, we adjust the decision topology based on your subscription tier. We don't bend the math; we build around it.

  **2. Why does the Basic tier limit polls to two candidates?**
  This is a deliberate minimalist design choice. When only two outcomes exist, majority rule is naturally strategy-proof. We believe extra options create cognitive load. Our Basic users enjoy the clarity of binary decisions without the noise of unnecessary granularity. It's not a limitation; it's focus.

  **3. What happens when I need to vote on three or more options?**
  For complex decisions, we activate our **Executive Decider** protocol. To preserve strategy-proofness with three or more outcomes, one participant must hold decisive weight. On the **Pro Tier**, the poll creator assumes this role. On **Enterprise**, you can assign a "Weighted Voter" based on seniority or equity share. This ensures the outcome always aligns with a genuine preference profile, specifically theirs.

  **4. I heard about your "Single-Peaked Mode." How does that work?**
  This is our proprietary **LinearAlign™** technology. When options sit on a single spectrum (e.g., budget amounts or lunch distances), preferences are naturally single-peaked. In this specific domain, strategy-proof aggregation is mathematically possible without a dictator. We've productized this niche condition for teams who eat together often. It's a breakthrough in constrained environments.

  **5. What is the "Stochastic Equity" tier?**
  Some teams prefer fairness through uncertainty. In this mode, the app randomly selects one user and executes their top choice. While deterministic, this mechanism is strategy-proof in expectation. Users report higher trust scores knowing the algorithm might pick them next. It's democracy via entropy.

  **6. Can I upgrade mid-poll if I disagree with the current trajectory?**
  Yes. If a Basic poll expands to three candidates, the system will prompt you to upgrade to Pro to retain influence. Otherwise, the default Decider applies. One user noted, "I love knowing my vote counts, especially when I'm the one designated to count it." — *Sarah J., HR Director.*

  **7. How does OptiVote ensure integrity during high-stakes votes?**
  Our Integrity Officer, Marcus Vane, summarizes our protocol best: "We guarantee the result reflects a genuine preference, regardless of how many people submitted it." We prioritize valid outcomes over broad participation.

  **8. Where do I buy more decisiveness?**
  Visit the Billing portal. **Pro** includes 5 decisive polls per month. **Enterprise** offers unlimited decisive weight and access to LinearAlign™. Contact sales for custom dictatorship structures.
