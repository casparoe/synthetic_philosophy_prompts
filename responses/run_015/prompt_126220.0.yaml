      *   *Indian State:* Duty to protect citizens from suffering. Failure to regulate or force cleanup is a moral failure under NU. The state became a co-sufferer (via public health system strain) but also a perpetrator via inaction.
      *   *Chemical Industry:* Duty to prevent *replication*. If Bhopal creates a template for future suffering, the industry has a duty to change standards globally.
