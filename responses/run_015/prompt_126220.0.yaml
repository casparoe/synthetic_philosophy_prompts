      *   *Residual Burden:* This is the user's coined term. It fits well with "long-termism" in effective altruism but specifically focused on *suffering*. It highlights the temporal extension of harm.
      *   *Structural Complicity:* This is the critical edge. NU is often consequentialist and act-focused. Does it handle *systems* and *inertia* well?

  3.  **Drafting Section 1: Mapping Moral Actors and Duties (NU Lens):**
