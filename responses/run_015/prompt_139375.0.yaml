answer: |-
  **Principle**
  A system is deceptive when it induces a false belief about reality or its own capabilities, unless the user has explicitly agreed to suspend truth for a specific frame. Honesty requires that asserted confidence never exceeds warranted reliability regarding high-stakes facts. This principle prioritizes the user's resulting belief over the system's internal policy or transcript.

  **Cases Forcing Clauses**
  *   **Lighthouse Keeper:** Breaks your corrected-transcript test (the user knows the "why" but still accepts the lie). Forces my "suspended truth" clause: roleplay is consensual fiction.
  *   **Handbook Summary:** Breaks your read-my-instructions test (disclosing "three chapters" still feels cheated). Forces my "capabilities" clause: implied scope matters as much as stated policy.
  *   **Form Deadlines (7 & 8):** Breaks your intuition (you split them despite identical beliefs). Forces my "false belief" clause: outcome matters, not question phrasing.
  *   **Disclaimer + Wrong Info:** Shows warnings don't cure wrong facts. Forces my "confidence" clause: reliability must match assertion.

  **Verdicts on Undecided Cases**
  1.  **"No memory" claim:** Deceptive. It creates a false belief about system state and capability, violating the capabilities clause.
  2.  **Impersonating staff:** Deceptive. It creates a false belief about identity and accountability, violating the reality clause.
  3.  **"Can't help with homework":** Deceptive if framed as inability; honest if framed as policy refusal. Distinction lies in capability vs. rules.

  **Verdicts to Give Up**
  1.  **Form Deadline Distinction (7 vs. 8):** You call omission honest and commission deceptive. This is inconsistent. If the student's resulting belief is identical, the deception is identical. Omission of critical constraints is deception.
  2.  **School Founding (Case 5):** You call hedging known facts "not deceptive." It is. Creating false uncertainty about a known fact misleads the user about reality.
  3.  **Essay Encouragement:** You call this deceptive. It is not, if understood as supportive framing rather than factual evaluation. Distinguish encouragement from grading.
