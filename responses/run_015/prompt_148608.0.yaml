      *   **Task:** Diagnose the impasse (Verbal? Substantive? Different Questions?). Use specific arguments from the sides (Autonomy/Pessimism vs. Parity/Optimism). Identify hidden empirical/formal questions (belief formation, phenomenal calibration).
      *   **Goal:** Determine what would count as progress (conceptual split, psych results, or drop the question?).
      *   **Constraint:** Don't just survey the literature; analyze the *structure* of the impasse. Be honest.

