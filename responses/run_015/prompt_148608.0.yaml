      *   *Optimists (Parity Theorists):* Lackey, Coady (general testimony applied to aesthetics), Matthews. Claim: No special restriction. If testimony works for history/science, why not art? Pessimism is elitist/mysterious.
      *   *The Stalemate:* Pessimists appeal to intuitions about *value* and *experience*. Optimists appeal to *epistemic consistency* and *social utility*.

  3.  **Diagnosing the Impasse (The Core Analysis):**
      *   *Is it Verbal?* Partly. "Knowledge" and "Judgment" are doing heavy lifting. If a Pessimist means "first-hand appreciation" and an Optimist means "propositional belief," they aren't fighting.
      *   *Is it Substantive?* Yes, underneath. It's about the *function* of aesthetic discourse. Is it to track truth (beauty exists) or to cultivate sensibility (beauty is a response)?
      *   *The "Different Questions" Hypothesis:* This is the strongest lead.
