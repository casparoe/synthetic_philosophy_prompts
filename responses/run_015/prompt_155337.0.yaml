  You are not overthinking this. You have identified a specific, recognizable, and morally distinct communicative maneuver. While there is no single English word that perfectly captures the mechanism, the morality, *and* the pragmatics all at once, there are three established concepts that, when layered, carve out exactly the shape you are describing.

  The closest single rhetorical term is **Paralipsis** (or *Preterition*).
  The closest philosophical/pragmatic term is **Paltering** (or *Merely Implicating*).
  The best descriptive coinage for the specific mechanism you've isolated is **Weaponized Implicature**.

  Here is the carving you asked for: what it is, why it feels different from politeness, and where the boundary lies.

  ### 1. The Mechanism: Conversational Implicature
  You remembered your pragmatics module correctly. In standard Gricean pragmatics, when you say something that implies $P$, you can usually cancel that implication by adding, "but I don't mean to suggest $P$."
  *   *Standard:* "Some of the cookies are gone... #but not all of them." (The `#` indicates this sounds contradictory/odd).
  *   *Cancelable:* "Some of the cookies are gone. In fact, all of them are."

  In your examples, the speaker is generating a **Generalized Conversational Implicature**. These are inferences that are so default (e.g., "If a professor only mentions punctuality, the research is bad") that they stick regardless of the cancellation.

  However, the specific move of putting the denial *inside* or *before* the statement ("I'm not saying X, but...") changes the linguistic function. This is **Metalinguistic Negation**. The speaker isn't negating the *truth* of the implication; they are negating the *appropriateness of uttering it*.
  *   *Effect:* By saying "It is not appropriate for me to say X," you signal that X is true but socially dangerous. This makes the implication *stronger*, not weaker.

  ### 2. The Rhetorical Name: Paralipsis
  The classical rhetorical device for this is **Paralipsis** (also called *Preterition* or *Occupatio*). This is the device of mentioning something by saying you will not mention it.
  *   *Classic:* "I will not bring up my opponent's history of fraud."
  *   *Your Examples:* "I won't say he's incompetent (but he is punctual)."

  **Why this fits:** It captures the structural move of "denying while doing."
  **Why it falls short:** Classical paralipsis is usually overt ("I'm not saying this"). Your examples (like the reference letter) are often covert (omitting the expected praise).

  ### 3. The Ethical Name: Paltering
  In negotiation and ethics literature, this is called **Paltering**. Paltering is the active use of truthful statements to convey a false (or specific negative) impression.
  *   *Lying:* Saying something false.
  *   *Paltering:* Saying something true (he *is* punctual) to lead the listener to a conclusion the speaker knows is the primary takeaway (he *is* incompetent).

  **Why this fits:** It captures the "truthful surface, misleading depth" aspect.
  **Why it falls short:** Paltering doesn't necessarily include the "I'm not saying X" defensive disclaimer.

  ### 4. The Carving: Weaponized Implicature
  Since no single term covers the *mechanism* (implicature), the *structure* (pre-emptive denial), and the *morality* (adversarial), the most precise label currently in use among linguists and discourse analysts is **Weaponized Implicature** (sometimes **Adversarial Implicature**).

  Here is the tight definition you can use to test borderline cases:

  > **Weaponized Implicature** occurs when a speaker:
  > 1.  Generates a strong negative (or advantageous) inference via **implicature** rather than assertion.
  > 2.  Embeds a **pre-emptive denial** or disclaimer ("I'm not saying...", "No offense...") within the utterance.
  > 3.  Relies on the context to ensure the denial **fails to cancel** the inference (often reinforcing it).
  > 4.  Does so to **shirk accountability** for the inference while ensuring the audience accepts it.

  ### 5. Why the "Polite Version" Feels Different
  You asked why hinting "a few guests left" (polite) feels different from "I'm just asking questions" (sneaky), even though both use implicature and deniability. The difference is **Cooperative vs. Adversarial Face-Work**.

  *   **Polite Hinting (Cooperative):** The goal is to save the *listener's* face. The speaker takes **responsibility** for the implication. If challenged ("Are you saying my party sucked?"), the polite hinters will own it gently ("I just wanted to spare you embarrassment"). The deniability is a gift to the listener.
  *   **Weaponized Implicature (Adversarial):** The goal is to save the *speaker's* face (liability) while threatening the *target's* face. The speaker **abdicates responsibility**. If challenged ("Are you saying X is true?"), they retreat to the literal meaning ("I literally only asked a question!"). The deniability is a shield for the speaker.

  **The Boundary Test:**
  To determine if a case is "Polite Hinting" or "Weaponized Implicature," ask: **If challenged, does the speaker own the intent?**
  *   *Polite:* "Yes, I was trying to be gentle." (Owns intent).
  *   *Weaponized:* "No, you're misinterpreting me." (Disowns intent).

  ### Summary
  Your partner is right that there are boring ordinary names for parts of this (**Insinuation**, **Hinting**, **Equivocation**). But you are right that they don't capture the *mechanism*.

  *   **The Mechanism:** Metalinguistic Negation of a Generalized Implicature.
  *   **The Rhetoric:** Paralipsis.
  *   **The Ethics:** Paltering in Bad Faith.
  *   **The Name:** **Weaponized Implicature**.

  It feels morally worse than lying because it exploits the cooperative norms of conversation (we assume people are being helpful and clear) to deliver a blow while refusing to hold the weapon. It is communication designed to be **deniable but undeniable**.
