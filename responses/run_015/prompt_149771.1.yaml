  **Project Title:** Beyond Time Travel: Gödel's Rotating Universe and the Dissolution of Subjective Succession

  **Applicant:** [Your Name]
  **Duration:** 3 Months (Part-Time)
  **Request:** Grant for Research Time & Access

  **Project Summary**
  Kurt Gödel's 1949 rotating universe metric is typically treated as an exotic physics solution or a proof-of-concept for closed timelike curves (CTCs). The standard reading suggests that if CTCs exist, time travel is physically possible, reinforcing an Einsteinian 'block universe' where all events coexist. I propose a different angle. I want to argue that the Gödel metric doesn't just allow for travel; it undermines the very asymmetry required for subjective succession. Rather than a mechanism for moving through time, the rotation dissolves the conditions for temporal passing from the inside. This is less about physics and more about a Kantian breakdown of intuition: if time is a form of inner sense, what happens when the geometry of the world refuses to support a linear 'now'?

  **The Research Question**
  Can we read the Gödel metric as undermining the reality of temporal passing from the internal perspective, rather than merely rearranging events externally? Current cosmological readings focus on causal loops, while philosophical readings often lean on Nietzschean eternal recurrence. Both leave open the phenomenological gap: the difference between cycling through events and losing the capacity for progression itself. My hypothesis is that Gödel's universe describes repetition without progress, where the rotation cancels the directional flow necessary for conscious experience.

  **Methodology**
  This is a three-month, part-time conceptual project. No new physics modelling is required; the work is interpretative.
  *   **Month 1:** Textual analysis. I will collate Gödel's scattered philosophical remarks, specifically his engagement with Kant and idealism, to establish his own intent regarding time and intuition.
  *   **Month 2:** Conceptual mapping. I will compare the formal properties of the rotation (specifically the vorticity preventing global time slices) against the requirements for subjective succession. The goal is to see if the math supports a phenomenological breakdown.
  *   **Month 3:** Consistency testing and drafting. I will stress-test this reading against standard objections. If the metaphor holds without breaking the mathematics, I will draft the final paper.

  **Outcomes and Success Criteria**
  A positive result looks like a coherent philosophical paper demonstrating that the Gödel metric is compatible with, and perhaps indicative of, a collapse in the intuition of temporal flow. It would offer a new bridge between general relativity and phenomenology.
  Failure is clearly defined: if I find that this reading requires projecting metaphysics onto maths Gödel never intended, or if the formal properties don't support the phenomenological claim, the project will conclude with a report on why this interpretation fails. Negative results are still valuable here; they prevent further dead ends in this specific niche of philosophy of physics.

  **Feasibility and Scope**
  This scope is deliberately tight to fit part-time hours. I am not attempting to solve the cosmological constant problem or refute general relativity. I am offering a specific exegesis of an existing solution. The resources needed are primarily access to academic journals and Gödel's unpublished papers (available digitally). The timeline is realistic because the mathematical groundwork is already done; the work lies in the philosophical synthesis.

  **Personal Context**
  While this is a formal inquiry, the urgency is personal. Observing the breakdown of linear progression in lived experience—specifically regarding cognitive decline—has highlighted the difference between time travel and the loss of succession. This project seeks to formalise that insight without conflating the mathematics with the metaphor.
