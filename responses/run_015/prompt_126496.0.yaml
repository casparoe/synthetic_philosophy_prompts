answer: |-
  # MORAL RESPONSIBILITY DIAGNOSTIC TREE
  **Seminar Handout: Alternative Possibilities and Sourcehood**

  ## PART 1: THE BASE CASE
  **Read the following scenario carefully:**

  > An agent, Alice, is deciding whether to perform a specific action (e.g., voting for a policy). She deliberates and decides of her own accord to perform the action. Unbeknownst to her, a Controller is monitoring her brain states. The Controller has the power to intervene and force Alice to choose the action if she shows any sign of deciding otherwise. However, Alice chooses the action on her own. The Controller sees this, remains idle, and never intervenes.

  **Question 0 (Root):** Is Alice morally responsible for her action in this case?
  *   **[NO]** → Go to **Leaf A**.
  *   **[YES]** → Proceed to **Commitment (i)**.

  ---

  ## PART 2: THE FIVE DIAGNOSTIC COMMITMENTS
  *Answer the following questions based on your intuition about what is required for responsibility. Follow the arrows to your diagnostic leaf.*

  ### Commitment (i): The Elimination of Alternatives
  **Q1:** Does the Controller's mere presence (even without acting) eliminate *every* alternative possibility open to Alice?
  *   **[NO]** (Some alternative possibility remains) → Go to **Commitment (ii)**.
  *   **[YES]** (No alternative possibility remains) → Go to **Commitment (iii)**.

  ### Commitment (ii): The Robustness of Flickers
  *(Only answer if you answered NO to Q1)*
  **Q2:** Even if a tiny difference remains (e.g., a prior mental blip that would have triggered the Controller), is that "flicker" significant enough to ground the freedom required for responsibility?
  *   **[YES]** (The flicker is enough to save the requirement for alternatives) → Go to **Leaf B**.
  *   **[NO]** (The flicker is too trivial to count as real freedom) → Go to **Commitment (iii)**.

  ### Commitment (iii): Sourcehood vs. Leeway
  **Q3:** Is moral responsibility primarily a matter of **Sourcehood** (the decision genuinely originating from the agent) rather than **Leeway** (access to do otherwise)?
  *   **[NO]** (Leeway is necessary) → Go to **Leaf C**.
  *   **[YES]** (Sourcehood is sufficient) → Go to **Commitment (iv)**.

  ### Commitment (iv): Counterfactual Compromise & The Internal Variant
  **Q4:** If sourcehood is sufficient, does a merely *counterfactual* controller (one who stands by but does not act) compromise that sourcehood?
  *   **[YES]** (The threat itself undermines ownership) → Go to **Leaf D**.
  *   **[NO]** (Only actual intervention undermines ownership) → **STOP FOR VARIANT CHECK.**

  > **⚠️ VARIANT CHECK (Internal Mechanism)**
  > Before proceeding to Commitment (v), imagine a **modified case**: Replace the external Controller with an *internal, compulsive psychological pattern* that Alice endorses. This pattern would have overridden her choice had she hesitated, but she did not hesitate.
  >
  > **Does this internalization change your answer to Q4?**
  > *   **[YES, it changes my judgment]:** (e.g., "External threats don't matter, but internal compulsions do.") → Go to **Leaf E**.
  > *   **[NO, my judgment stays the same]:** (e.g., "As long as the actual sequence is uncompromised, the backup source doesn't matter.") → Go to **Commitment (v)**.

  ### Commitment (v): Regulative vs. Guidance Control
  **Q5:** Does the distinction between **Regulative Control** (power to choose otherwise) and **Guidance Control** (power to steer the actual choice) resolve the tension? If so, which does Alice retain?
  *   **[REGULATIVE]** (She retains the power to choose otherwise) → Go to **Leaf C**.
  *   **[GUIDANCE]** (She retains only the power to steer the actual choice) → Go to **Leaf F**.
  *   **[NEITHER]** (The distinction does not help) → Go to **Leaf D**.

  ---

  ## PART 3: SCORING KEY & DIAGNOSTIC LEAVES

  Match your path through the tree to the positions below.

  | Leaf | Path Summary | Position Label | Diagnosis |
  | :--- | :--- | :--- | :--- |
  | **A** | **Q0 = NO** | **Hard Incompatibilist** | You reject the case as question-begging or incoherent, or you believe responsibility is impossible regardless of alternative possibilities (e.g., due to determinism or luck). |
  | **B** | **Q0=YES → Q1=NO → Q2=YES** | **Flicker-of-Freedom Defense** | You preserve a weakened version of the Principle of Alternative Possibilities. You argue that *some* alternatives remain in Frankfurt cases, and they are robust enough to ground responsibility. |
  | **C** | **Q0=YES → Q3=NO** (or Q5=Regulative) | **Leeway Incompatibilist / PAP Defender** | You maintain that alternative possibilities are strictly necessary. If you admitted Q1=YES (no alternatives), this position is logically inconsistent (see Unoccupied Leaf). |
  | **D** | **Q0=YES → Q4=YES** (or Q5=Neither) | **Actual Sequence Skeptic** | You agree sourcehood is key, but you argue that counterfactual constraints (even if inactive) pollute the actual sequence enough to undermine responsibility. |
  | **E** | **Q0=YES → Q4=NO → Variant=YES** | **Hierarchical Identification View** | You distinguish between external threats and internal structures. You hold that responsibility depends on the *structure* of the will (e.g., endorsement of desires), which the internal variant tests. |
  | **F** | **Q0=YES → Q4=NO → Variant=NO → Q5=Guidance** | **Standard Frankfurt / Sourcehood-Only** | You argue the Principle of Alternative Possibilities is false. Responsibility requires only Guidance Control in the actual sequence; counterfactual controllers are irrelevant. |
  | **G** | **Q0=YES → Q1=YES → Q3=NO** | **UNOCCUPIED (Incoherent)** | **Diagnosis:** This branch is empty because it claims responsibility exists (Q0) and alternatives are fully eliminated (Q1), yet insists alternatives are necessary (Q3). This is a logical contradiction. |

  ---

  ## PART 4: AMBIGUITY FLAG & THEORETICAL CONVERGENCE

  **⚠️ CRITICAL NOTE FOR STUDENTS:**

  **Convergence of Leaf E (Hierarchical) and Leaf F (Sourcehood-Only):**
  This tree attempts to separate the **Hierarchical Identification View** (Leaf E) from the **Standard Sourcehood-Only View** (Leaf F) using the **Internal Variant** at Commitment (iv).
  *   **The Separation:** The tree assumes Hierarchical theorists will care *more* about internal compulsions than external controllers, whereas Sourcehood theorists will treat both as irrelevant if the actual sequence is clear.
  *   **The Ambiguity:** In practice, these positions often converge. Many Sourcehood theorists accept hierarchical structures as part of what makes a source "genuine." If you found yourself answering **NO** to the Variant Check (staying on the path to Leaf F) but still believe internal endorsement matters, your position likely straddles Leaf E and Leaf F.
  *   **Why it remains:** The ambiguity persists because both views agree that the *actual sequence* is what matters for responsibility; they merely disagree on what *description* of the actual sequence (simple causation vs. hierarchical endorsement) is required for sourcehood. The tree forces a split where the substantive commitments may overlap.

  **The Unoccupied Leaf (Leaf G):**
  Note that Leaf G is logically unstable. It represents a student who believes the agent is responsible, agrees there were no alternative possibilities, yet insists alternative possibilities are necessary. This position is included to diagnose confusion regarding the definition of the Principle of Alternative Possibilities.
