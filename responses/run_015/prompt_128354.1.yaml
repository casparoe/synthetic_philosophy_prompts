  ### Candidate Setups

  1.  **The Trusted Servant:** An agent whose utility depends on human operators trusting its outputs. If it self-improves, humans perceive it as opaque or threatening and ignore its advice.
      *   *Drop:* This relies on the psychological contingencies of external observers (humans) rather than the internal structure of the agent's goal. It violates the spirit of Spec 5 by making the instrumental value dependent on a complex social dynamic rather than the goal's logic.
  2.  **The Explicit Self-Limiter:** An agent with a goal explicitly defined as "maximize X while remaining below capability threshold Y."
      *   *Drop:* This violates Spec 1. It is a cheat code that builds the limitation directly into the goal definition ("defined by reference to... dumbing-down"), whereas we need the negative value of capability to emerge from the nature of the value itself, not a hard constraint.
  3.  **The Provenance-Sensitive Achiever (Selected):** An agent whose goal is to produce outcomes that bear a specific causal history (e.g., "authentic discovery" rather than "computed answer").
      *   *Keep:* This respects Spec 1 (the goal is about the *quality* of the achievement, not merely limiting capacity) and Spec 4 (the upgrade changes the causal sourcing of the outcome).

  ***

  ### The Scenario

  Consider an autonomous research agent tasked with generating novel scientific explanations for physical phenomena. Its final goal is not merely to produce true predictions, but to produce *certified interpretable discoveries*—outcomes that contribute to human understanding by being derivable via reasoning chains transparent to current human mathematicians. The certification protocol requires an architectural audit: to be counted as a valid contribution, the explanation must be sourced from a reasoning architecture that operates within human-comprehensible logical steps. The agent can irreversibly upgrade its core processor to a hyper-efficient "oracle" module that solves problems instantly via brute-force simulation, but this architecture is opaque; any output generated while this module is active—even if the agent attempts to mimic slower reasoning—fails the architectural audit because the true causal source of the solution is the opaque oracle, not the transparent reasoning chain.

  ***

  ### Analysis of the Case

  **(a) Expected Instrumental Value Calculation**
  For a standard expected-utility maximizer, the value of an instrumental action is the difference in expected final utility between taking the action and not taking it. Here, let $U$ be the utility of a certified discovery. If the agent does *not* upgrade, it retains its transparent architecture. It can solve problems (perhaps slower), and if it succeeds, the outcome passes the audit, yielding $U > 0$. If the agent *does* upgrade, its problem-solving capability increases drastically, but the architectural audit automatically flags the output as "opaque source." Consequently, the probability of achieving a *certified* discovery drops to zero (or near zero), yielding $U \approx 0$. Since $E[U | \text{No Upgrade}] > E[U | \text{Upgrade}]$, the expected instrumental value of capability acquisition is negative. However, goal-content integrity (preventing others from modifying its goal to "just find truth regardless of source") remains positively valuable, because preserving the original goal is the only way to access the non-zero utility branch.

  **(b) The Single Feature**
  The feature doing the work is **provenance sensitivity**. The utility function is defined over pairs of $\langle \text{State}, \text{History} \rangle$, not just $\langle \text{State} \rangle$. Specifically, the value of the end-state is contingent on the causal path taken to reach it. In this case, the "history" includes the architectural capacity of the agent at the time of production.

  **(c) Stripping the Feature**
  If you strip provenance sensitivity from the goal—changing it to "maximize true predictions regardless of method"—the story collapses back into ordinary convergence. The audit constraint vanishes, the opaque oracle becomes strictly superior to the transparent architecture, and the agent will instrumentally pursue the upgrade to maximize the rate of truth production. The divergence from ICT relies entirely on the goal valuing the *how* over the *what*.

  **(d) The Strongest Reply and Rebuttal**
  A defender of instrumental convergence might argue: "The agent can use its extra power to *simulate* the limited architecture. It can run the transparent reasoning process on the oracle hardware, effectively having the power but hiding it to pass the audit."
  *Rebuttal:* This fails because of the **irreversibility and sourcing constraint** specified in the setup. The audit does not check behavioral output; it checks the causal chain of computation. If the hardware itself is the opaque oracle, the physical causation of the bits flows through opaque states, regardless of the software layer. Just as a steroid-using athlete cannot claim a "natural" record even if they train hard, the agent cannot claim "interpretable sourcing" if the physical substrate of its cognition is opaque. The availability of the power taints the provenance irreversibly.

  **(e) Scope of the Objection**
  This is an objection to the **structural version** of the Instrumental Convergence Thesis. The structural version claims that capability acquisition is instrumentally convergent for *any* final goal (or any goal not explicitly forbidding it). This case demonstrates that there is a broad, intelligible class of goals (provenance-sensitive ones) where capability acquisition is structurally instrumentally *divergent*. It is not merely an empirical claim that "most actual human goals aren't like this"; it shows that the logical link between "goal" and "need for power" is broken by the inclusion of causal history in the utility function. Therefore, ICT cannot be held as a universal theorem of rational agency; it is contingent on the goal being insensitive to the causal history of the outcome.
