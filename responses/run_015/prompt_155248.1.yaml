      *   *Canonization:* Mencius was *not* fully canonized as one of the "Four Books" until the Song Dynasty (Zhu Xi). In the Han, Mencius was one of many masters. Xunzi was actually highly influential in the Han (transmission of classics often went through him), but his "human nature is evil" thesis was politically awkward.
      *   *Action:* I need to nuance the "Mencius canonized/Xunzi sidelined" claim. In the Han, it was more about "Confucianism" generally, with Dong Zhongshu synthesizing both. But for the sake of the user's argument, I will address the *tension* between the two anthropologies within the Han system.

