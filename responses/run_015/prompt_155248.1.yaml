prompt: |-
  I've been arguing with my roommate about whether Confucian statecraft was actualy Mencian or Xunzian at heart, and we kept circling back to Emperor Wu's decision around 136 BCE to make the Five Classics the backbone of the civil service exams after the Qin collapse. Take that specific institutional moment — not the whole Han dynasty, just the exam-ritual complex being formalized — and run it through Mencius vs Xunzi on human nature.

  If people are born with good sprouts that need only protection and nourishment, why design a massive bureacratic filter that drills ritual and corrects behavior through years of standarized study? If nature is selfish and needs ritual to straighten it, then the exam system looks like pure Xunzi — but then why was Mencius the one canonized and Xunzi sidelined? I want a disciplined mapping: what decision Wu (or advisors like Dong Zhongshu) actually faced, what each theory predicts about state design versus moral education, whether the system is better read as cultivating innate sprouts or manufacturing virtue through external constraint, and what the episode does to the debate — does it confirm Xunzi's political realism while showing he lost the ideological branding, or does it reveal that imperial legitimation needed Mencius's optimism regardless of institutional reality? Also say where both theories stay silent about the exam's actual social function, and don't force them to speak where they don't.
reasoning: |-
