      *   **Key Tension:** Mencius (innate goodness/sprouts) vs. Xunzi (innate badness/needs ritual straightening).
      *   **Paradox:** If Mencius is right (good sprouts), why the heavy bureaucratic filtering/drilling? If Xunzi is right (needs straightening), why was Mencius canonized and Xunzi sidelined later?
      *   **Required Output:** A disciplined mapping of the decision faced by Wu/Dong Zhongshu, predictions of each theory on state design vs. moral education, analysis of the system (cultivating sprouts vs. manufacturing virtue), resolution of the debate (realism vs. branding), and acknowledgment of where both theories are silent.
      *   **Constraint:** Do not force the theories to speak where they don't.

  2.  **Historical Fact-Check (Crucial Step):**
