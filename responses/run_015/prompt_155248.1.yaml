      *   *Correction:* This is a common anachronism. The *imperial academy* (Taixue) was established around 124 BCE. The recommendation system (*cha ju*) existed, but the rigorous *civil service exam* (Keju) as we know it (Tang/Song onwards) did not exist in Han. It was more about recommendation based on reputation and knowledge of classics.
