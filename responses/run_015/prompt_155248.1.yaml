answer: |-
  This is a sharp question that cuts to the heart of how Confucianism transitioned from a philosophical school to an imperial technology. However, to give you a disciplined answer, we must first correct one historical premise: **There were no civil service exams in 136 BCE.**

  The *Keju* (exam) system is a Sui/Tang innovation (6th–7th century CE). In 136 BCE, Emperor Wu appointed the **Five Erudites** (*Boshi*), and later (124 BCE) established the **Imperial Academy** (*Taixue*). The pathway to office was primarily through **recommendation** (*cha ju*) based on reputation and demonstrated knowledge of the Classics, not standardized testing.

  This distinction matters. An exam tests memory and compliance; the Han system tested **ritual performance and textual interpretation** as a proxy for moral capacity. With that calibration, we can map the 136 BCE decision onto the Mencius-Xunzi divide.

  ### 1. The Decision: Text as Technology of Rule
  Emperor Wu and his advisor Dong Zhongshu faced a specific problem: How to unify a fractious empire after the Qin collapse without relying on Qin-style Legalist coercion.

  **The Decision:** To make mastery of the *Five Classics* the prerequisite for holding office.
  **The Mechanism:** State-sponsored chairs for specific texts, standardized interpretations, and the linking of textual mastery to political advancement.

  This creates a **bureaucratic filter based on moralized knowledge.** The state is saying: *To rule others, you must first prove you have internalized the wisdom of the Sage Kings.*

  ### 2. Theoretical Mapping: Sprouts vs. Straightening

  Here is how the two anthropologies predict the design of this institution:

  | Feature | **Mencian Prediction** (Nature is Good) | **Xunzian Prediction** (Nature is Bad/Neutral) |
  | :--- | :--- | :--- |
  | **Purpose of Study** | To **recover** the lost heart. Texts are mirrors to help you find the "sprouts" (compassion, shame) already within. | To **accumulate** wisdom. Texts are external tools to reshape the self, like a straightening board for warped wood. |
  | **Role of State** | **Gardener.** Provide soil and protection. Do not force growth. | **Architect.** Build structures (Ritual/*Li*) to constrain and channel behavior. |
  | **Selection Logic** | Select those who show spontaneous moral intuition. | Select those who demonstrate disciplined adherence to ritual norms. |
  | **Risk** | Over-structuring kills the sprout. | Without structure, humans revert to chaos. |

  ### 3. Diagnosing the Han Institution
  If we run the 136 BCE institutionalization through this map, the verdict is mixed but revealing.

  **The Mechanism is Xunzian.**
  The establishment of the Erudites and the Academy is a project of **external constraint.** It requires years of drilling, memorization, and ritual performance. It assumes that without this rigorous training, a potential official will not naturally embody the Way. It treats virtue as a **skill to be manufactured** through standardized curriculum. This aligns with Xunzi's view that the Sage Kings created Ritual (*Li*) because human nature could not be trusted to generate order spontaneously. The Han bureaucracy is a "straightening board."

  **The Legitimation is Mencian.**
  However, the *justification* for this system relies on Mencian optimism. The state claims that by studying the Classics, the official is aligning with the **Heavenly Mandate**, which resonates with the people's innate moral sense. If human nature were truly irredeemably selfish (as a crude reading of Xunzi might suggest), why bother educating officials at all? Why not just punish them? The Han system assumes that education *works*—that the human mind is capable of becoming Sage-like. This requires a belief in moral potential that Xunzi's "nature is evil" thesis makes difficult to sustain rhetorically.

  **Dong Zhongshu's Synthesis:**
  Dong Zhongshu actually solved this for Emperor Wu by splitting the difference. He argued that **Human Nature ($Xing$) is the potential, but the King is the mold.**
  *   *Analogy:* Rice is in the husk (Mencian potential), but it must be pounded to be eaten (Xunzian processing).
  *   *Political Implication:* The people have the sprouts, but they need the Emperor's education to realize them. This justifies the bureaucratic filter: it is the "pounding" necessary to make the "rice" edible.

  ### 4. The Canonization Paradox: Why Mencius Won the Branding War
  You asked: *If the system is Xunzian, why was Mencius canonized and Xunzi sidelined?*

  **1. The Problem of the Sage's Origin:**
  Xunzi argues Ritual is created by Sages to curb evil nature. But if *everyone's* nature is evil, where did the first Sage get the capacity to create Ritual? This is a logical vulnerability. Mencius avoids this: The Sage is simply someone who fully preserved their innate sprouts. For an Emperor claiming the Mandate of Heaven, Mencius provides a safer ontology: **The Emperor rules because his moral nature is more intact than others.** Xunzi implies the Emperor is just the best at fake-it-till-you-make-it.

  **2. Imperial Legitimacy:**
  A Xunzian state admits it is managing selfish animals. A Mencian state claims it is nurturing a moral family. The Han needed the **family metaphor** (Father-Emperor, Children-Subjects) to stabilize rule. Mencius supplies the emotional vocabulary for this; Xunzi supplies the administrative manual.
  *   **Result:** The Han (and later Song) dynasties used **Xunzian institutions** (exams, rigid hierarchy, ritual law) wrapped in **Mencian branding** (innate virtue, benevolent rule).

  **3. The "Evil Nature" Taboo:**
  By the Tang and Song, Xunzi was removed from the Confucian temple because calling human nature "evil" was seen as undermining the possibility of moral self-cultivation. If nature is evil, can we truly trust officials? Mencius allows the state to trust the official's *heart* while monitoring his *performance*.

  ### 5. Where Both Theories Stay Silent
  This is the critical limit of your debate. Neither Mencius nor Xunzi anticipates the **sociological function of the exam/academy system.**

  *   **Credentialism:** Neither philosopher imagines that textual mastery could become a **status marker** detached from actual virtue. They assume studying the Classics *makes* you good. They do not predict a class of literati who memorize texts solely to bypass the filter, using virtue as a currency for power rather than a goal of being.
  *   **Social Sorting:** Neither explicitly designs the system as a method for **elite reproduction**. While they assume gentlemen (*junzi*) will rule, they don't theorize the exam as a mechanism to prevent social mobility or to create a specific bureaucratic class distinct from the aristocracy.
  *   **State Power vs. Moral Truth:** Both assume the State and the Dao are aligned. They do not account for the moment when the State uses the Classics to **suppress** dissent (which happened in the Han). If the Emperor controls the interpretation of the Classics, the "Sage Wisdom" becomes state propaganda. Neither Mencius (who told rulers to listen to the people) nor Xunzi (who emphasized loyalty to the ruler) fully anticipated the **bureaucratization of truth.**

  ### Conclusion: The Verdict on 136 BCE
  The institutionalization of the Five Classics was **Xunzian in engineering but Mencian in teleology.**

  *   **Xunzi wins the design:** The state assumes behavior must be drilled, standardized, and constrained by external ritual (the curriculum).
  *   **Mencius wins the ideology:** The state claims this drilling is merely "nourishing" the innate moral potential of the elite to serve the people.

  Your roommate is half-right. The **reality** of the Han bureaucracy was Xunzian (humans need correction). But the **legitimation** required Mencius (humans are capable of perfection). If they had admitted it was pure Xunzian, they would have admitted the Emperor was ruling over beasts. If they had admitted it was pure Mencian, they wouldn't have needed such a rigid bureaucratic filter.

  The system confirms **Xunzi's political realism** (you need strict structures to manage people) while showing he lost the **ideological branding** (because you cannot rule effectively by telling subjects they are naturally broken). The Han synthesis was to use Xunzi's tools to build Mencius's world.
