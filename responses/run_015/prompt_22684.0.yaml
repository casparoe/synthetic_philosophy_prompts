answer: |-
  Good morning. For those who don't know me, I'm [Your Name], one of his grandchildren.

  Grandpa died on Tuesday. He was three days shy of his ninety-fourth birthday. If you knew him, you know he would have had something to say about missing the big day by such a narrow margin. He would have called it a waste of good seed, or maybe just bad weather.

  He left me specific instructions for today. He said: "Do not stand up there and talk about how I faded. Do not talk about how I suffered. And do not pity me."

  He was a corn and soybean man. He read the seed catalog religiously. But in these last few years, a friend gave him a little paperback by an old Roman farmer named Cicero. Grandpa read it twice. For a man who usually only read about germination rates and herbicide, that was a harvest all its own.

  He told me there were two things in that book that rang true to him, and he wanted me to share them.

  The first was about the work. Grandpa knew his back wasn't what it used to be. He couldn't lift the bags he used to lift. But he hated the idea that he was retired from life. He used to say, "You don't stop farming just because your back goes. You just farm a different crop."

  In those last years, his crop was his mind. He was watching the markets, remembering the weather patterns from fifty years ago, and teaching us how to read the soil of people, not just the land. He wasn't fading; he was just tending to a different field.

  The second thing was harder for us grandkids to hear, because he'd say it to our faces with a grin. He said the old have a kind of power over the young that the young are actually jealous of.

  We thought he was joking. What power? You can't run fast, you can't lift heavy. But he meant the weight of it. The steadiness. He meant that after ninety-three years, nothing shocks you anymore. You know what survives a drought and what doesn't. You hold the history of the land in your head. That isn't weakness. That is authority. And he was right. We were jealous. We wanted to know how to stand that still, how to be that sure.

  There's a man here today who gave him that book. You know who you are. Grandpa appreciated that gift more than he probably ever told you. He found a friend in that old Roman, because they both knew that age isn't a decline. It's a maturity.

  So, please, don't look at him and see someone who lost his strength. Look at him and see a man who finished the harvest on his own terms. He didn't suffer through his last years; he enjoyed them. He liked being old. He liked the view from the porch.

  The farm will go on. The fields will be planted. But the man who taught us that the mind is soil that never goes fallow has left us. Don't pity him. He'd hate that. Just remember to keep working your own fields, whatever crop they may be.

  Thank you.
