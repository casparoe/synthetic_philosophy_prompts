answer: |-
  ### Workshop Plan: The Logic of Credible Commitment (90 Minutes)

  **Target Audience:** Non-specialist Graduate Students (Law & Public Policy)
  **Objective:** Move students from an intuitive grasp of "credibility" to a structural understanding of "rational irrationality" without getting bogged down in technical decision theory.

  ---

  ### I. The Carrying Scenario: The "Labor Settlement Audit"
  **Recommendation:** Replace the canonical *Stranded Driver* with a **Labor Settlement Audit** scenario.

  **Defense for Replacement:**
  For law and policy students, the "mind-reading driver" in Parfit's original example triggers immediate skepticism regarding enforceability and metaphysics. They will attempt to solve the puzzle with contract law or reputation mechanisms before engaging with the decision-theoretic tension. The Labor scenario leverages your recent collective-bargaining hook to ground the stakes in institutional reality while preserving the logical isolation required for the puzzle.

  **Structural Features:**
  *   **Preserve:**
      1.  **Temporal Separation:** The decision to grant the benefit (Management) precedes the decision to fulfill the promise (Union Membership).
      2.  **Visibility of Reasoning:** Management does not rely on reputation but audits the *internal deliberative logic* of the Union (e.g., meeting minutes, voting patterns) to predict the future vote.
      3.  **Irrelevance of Reputation:** Stipulate this is a one-off liquidation scenario (the firm is closing in one year); future cooperation is impossible.
  *   **Relax:**
      1.  **Physical Necessity:** Replace "death in the desert" with "insolvency/loss of severance." This reduces the emotional distraction of survival while maintaining high stakes.
      2.  **The "Magic" Element:** Replace psychic mind-reading with "transparent procedural audit." This makes the prediction mechanism plausible to legal minds without altering the evidential link between *disposition* and *outcome*.

  **Scenario Setup for the Room:**
  > *A Union needs an immediate cash advance to survive a strike. Management will transfer funds **only if** their audit of Union deliberations predicts the membership will ratify a wage concession tomorrow. Once funds are received, the Membership has a dominant incentive to reject the concession (keep cash, continue strike). Management cannot enforce the promise legally.*

  ---

  ### II. Dependency Order of Conceptual Pieces
  Do not introduce the payoff matrix immediately. The students must feel the temporal tension before they analyze the incentives. Build the concepts in this specific sequence:

  1.  **Ex Ante vs. Ex Post Evaluation (Minutes 15–30)**
      *   *Why First:* Students naturally conflate the "time of the promise" with the "time of the performance." You must fracture these moments.
      *   *Action:* Map the timeline on the board. Isolate the *Management Decision Node* (Ex Ante) from the *Union Vote Node* (Ex Post).
      *   *Goal:* Establish that what is rational at the Vote Node (reject) undermines the outcome at the Decision Node (no funds).

  2.  **Payoff Structure (Minutes 30–45)**
      *   *Why Second:* Once the timeline is fractured, populate it with incentives.
      *   *Action:* Assign values. Show that at the Vote Node, "Defect" strictly dominates "Cooperate."
      *   *Goal:* Demonstrate that standard instrumental rationality leads to a worse outcome for the agent (no funds).

  3.  **Visibility of Reasoning / Prediction Mechanism (Minutes 45–60)**
      *   *Why Third:* Only after they see the trap can you introduce the escape hatch.
      *   *Action:* Explain Management's audit. They do not listen to *words* (promises); they evaluate *reasoning patterns* (dispositions).
      *   *Goal:* Link the Ex Post action back to the Ex Ante outcome via evidence, not causation.

  4.  **Evidential vs. Causal Reasoning (Minutes 60–75)**
      *   *Why Last:* This is the technical label for the intuition built in steps 1–3.
      *   *Action:* Define the distinction. Causal Decision Theory (CDT) asks, "Can my vote *change* the past transfer?" (No). Evidential Decision Theory (EDT) asks, "What does my vote *signal* about the type of agent I am?" (Yes).
      *   *Goal:* Formalize why "irrational" cooperation is the only winning strategy.

  ---

  ### III. Mapping Predictable Misconceptions
  Head off these objections at the specific junctures where they naturally arise. Do not wait for Q&A.

  | Misconception | Where to Head Off | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"Reputation Solves This"** | **Phase 1 (Timeline)** | Stipulate the "One-Off Liquidation" clause immediately. Explicitly state: "Assume the firm dissolves tomorrow. No future games." |
  | **"It's Just a Prisoner's Dilemma"** | **Phase 2 (Payoffs)** | Clarify that PD is simultaneous and other-regarding. This is sequential and self-regarding. The tension is between *your* future self and *your* past self, not you vs. them. |
  | **"Prediction = Determinism"** | **Phase 3 (Prediction)** | Students will argue, "If they know I'll defect, I can't choose." Clarify: Management predicts based on *disposition*, not fate. You *can* defect, but if you are the *type* who defects, you never get the funds. |
  | **"This is Weakness of Will"** | **Phase 4 (Rationality)** | Distinguish *akrasia* (wanting to pay but failing) from *rational choice* (choosing not to pay because it maximizes utility). The puzzle requires the agent to *want* to defect Ex Post. |

  ---

  ### IV. Closing Question
  Do not ask them to summarize the story. Ask them to locate the tension.

  > **"If rationality is defined as maximizing utility at the moment of choice, is the agent who receives the funds irrational for paying, or is the agent who keeps the funds irrational for never having been the type to pay?"**

  *   *Purpose:* This forces them to choose between **Act Rationality** (CDT) and **Dispositional Rationality** (EDT/Resolute Choice). If they answer merely "paying is good," they missed the structural conflict.

  ---

  ### V. Bracketed Strand
  **Explicitly Omit:** **Personal Identity over Time.**

  *   *Instruction:* Acknowledge that Parfit uses this puzzle to argue that "persons" are series of psychological states rather than continuous entities (Reductionism).
  *   *Reason for Omission:* For Law and Policy students, introducing metaphysical questions about the "self" distracts from the institutional and decision-theoretic mechanics. It invites debate on consciousness rather than commitment. State clearly: *"We are treating the Union as a single agent across time for the purpose of this model, setting aside the metaphysical question of whether the 'Ex Ante Union' and 'Ex Post Union' are identical."*
