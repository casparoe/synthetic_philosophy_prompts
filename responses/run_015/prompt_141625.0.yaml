answer: |-
  Here is a complete lesson plan, mechanics, and materials for your Week 6 seminar. It is designed to run tight on 75 minutes, keep the "C-word" hidden until the end, and force the students to confront the *planning* aspect of the argument.

  ### **Instructor Prep & Mindset**
  *   **The Ban:** Do not say "Conditionalization," "Bayes," "Rule," or "Theorem." Use "Update Plan," "Price Consistency," "Future Self Agreement," or "The Link."
  *   **The Vibe:** You are not teaching math; you are auditing a contract. The Punter is signing a binding commitment. The Bookie is a compliance officer looking for arbitrage.
  *   **The Trap:** Students will try to be "rational" (i.e., conditionalize) if they think you want correct math. You must explicitly license them to be "psychologically realistic."

  ---

  ### **1. The Mechanics & Ticket Set**
  **The Setup:** A six-sided die is rolled under a cup.
  **The Evidence Partition:** The cup is lifted slightly. The Punter will be told **only** whether the number is **ODD** (1, 3, 5) or **EVEN** (2, 4, 6).
  **The Ticket:** Pays **100 Points** if the number is **LOW (1, 2, 3)**. Pays **0** if HIGH (4, 5, 6).

  **Why this works:**
  *   Prior Probability of LOW = 3/6 = 50%.
  *   Probability of LOW given ODD = 2/3 (1, 3) ≈ 67%.
  *   Probability of LOW given EVEN = 1/3 (2) ≈ 33%.
  *   *The Trap:* Humans are naturally conservative updaters. They will likely set the Prior at 50, but set the Posteriors closer to 50 (e.g., 55 and 45) because "Odd/Even doesn't feel like it tells me much about High/Low." This creates the Dutch Strategy opportunity.

  ---

  ### **2. Student Handouts**

  #### **Sheet A: The Punter's Price Sheet**
  *(Print one per pair)*
  > **RULES:**
  > 1. You are setting **fair prices** for a ticket worth 100 points if **LOW (1, 2, 3)**.
  > 2. **DO NOT CALCULATE.** Do not try to make the math consistent. Write down the price that feels intuitively fair to you in that specific moment.
  > 3. You are **bound** to these prices. If the Bookie wants to trade at the price you wrote, you must trade.
  >
  > **PART 1 (NOW):** Before the die is rolled, what is your price for the LOW ticket?
  > Price: _______ points (0-100)
  >
  > **PART 2 (THE PLAN):** You must fill this out *now*, before seeing any evidence. This is your binding plan for later.
  > *   If you are told **ODD**, what will your price be for the LOW ticket?
  >     Price: _______ points (0-100)
  > *   If you are told **EVEN**, what will your price be for the LOW ticket?
  >     Price: _______ points (0-100)

  #### **Sheet B: The Bookie's Strategy Worksheet**
  *(Print one per pair)*
  > **GOAL:** Find a combination of trades that guarantees you a profit, no matter what the die roll is.
  > **STEP 1:** Compare the Punter's **PART 1** price to their **PART 2** prices.
  >
  > **STRATEGY CHECKLIST:**
  > [ ] **The Conservative Trap:** Is the PART 1 price (50) *higher* than BOTH PART 2 prices (e.g., 40 and 40)?
  >     *   *Move:* **SELL** the ticket to Punter now (at high price). **BUY** it back later (at low price), regardless of Odd/Even.
  >     *   *Profit:* (Part 1 Price) - (Part 2 Price).
  >
  > [ ] **The Over-Reaction Trap:** Is the PART 1 price (50) *lower* than BOTH PART 2 prices (e.g., 60 and 60)?
  >     *   *Move:* **BUY** the ticket from Punter now (at low price). **SELL** it back later (at high price), regardless of Odd/Even.
  >     *   *Profit:* (Part 2 Price) - (Part 1 Price).
  >
  > [ ] **The Split Trap:** (Harder) If one Part 2 price is higher and one is lower, can you bet on the Evidence too? (Skip this for now unless you're advanced).
  >
  > **STEP 2:** Execute the trade. Record the Punter's net point change.
  > *   Trade 1 (Now): ________________
  > *   Trade 2 (After Reveal): ________________
  > *   **Punter's Total Loss:** _______ points.

  ---

  ### **3. Minute-by-Minute Timeline (75 Minutes)**

  | Time | Activity | Instructions & Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Arrange chairs in 7 pairs. Distribute chips (start each pair with 100 chips pot). Hand out **Sheet A** and **Sheet B**. |
  | **05-15** | **Round 1: The Plan** | **Punters** fill Sheet A alone. Emphasize: *"Trust your gut, not the math."* **Bookies** wait. After 5 mins, Bookies collect Sheet A. They have 5 mins to find a strategy using Sheet B. |
  | **15-25** | **Round 1: Execution** | Instructor rolls die (or app). Announces ODD/EVEN to the room (public evidence). Bookies execute trades based on the revealed column. Punters pay out losses in chips. |
  | **25-30** | **Role Swap & Variant Prep** | Swap roles. New Punter gets Sheet A. New Bookie gets Sheet B. **Crucial:** Hand out **Variant Rule Card** (see below). |
  | **30-40** | **Round 2: Break It** | Run the game again with **Variant A (Spread)** AND **Variant B (Fee)** active simultaneously. (See Rules below). |
  | **40-55** | **Debrief Part 1: The Mechanism** | Ask: "Who got Dutch Booked?" "How did the Bookie win?" Map their experience to the *structure* of the argument (Plan + Binding + Sure Loss). |
  | **55-65** | **Debrief Part 2: The C-Word** | Reveal "Conditionalization." Explain that Round 1 tested adherence to it. Explain that Round 2 tested the *assumptions* required for the argument to hold. |
  | **65-75** | **Debrief Part 3: The Holes** | Discuss Variant C (Forgetful) as a thought experiment. Discuss "Points vs. Utility." Final takeaway: Rationality as integrity across time. |

  ---

  ### **4. Variant Rule Card (For Round 2)**
  *(Hand this out at minute 25)*

  > **NEW RULES FOR ROUND 2:**
  > 1.  **Bid-Ask Spread:** Punters, you no longer name one price. You must name a **Buy Price** (max you'll pay) and a **Sell Price** (min you'll accept). The gap must be at least 10 points.
  > 2.  **Withdrawal Fee:** Punters, after the evidence is announced, you may **cancel** your Part 2 trade if you pay a **5-point fee** to the Bookie.
  > 3.  **Bookies:** Your goal is still to guarantee a profit. Good luck.

  ---

  ### **5. The Debrief Script (Mapping Game to Argument)**

  **1. The "Parlor Trick" vs. The Plan (Minutes 40-55)**
  *   *Ask:* "In Round 1, when did the Punter lose the points? At the first trade or the second?"
  *   *Point:* They lost the points at the second trade, but the *loss was guaranteed* at the first trade.
  *   *Concept:* The Dutch Book argument isn't about having a wrong belief at $t_1$. It's about signing a contract at $t_1$ that your future self ($t_2$) will honor, which creates a hole.
  *   *Key Phrase:* "You weren't punished for being wrong. You were punished for being **inconsistent across time**."

  **2. Naming the Target (Minutes 55-65)**
  *   *Reveal:* "In philosophy, the rule you violated in Round 1 is called **Conditionalization**."
  *   *Definition:* Your prior price for $A$ should equal your expected posterior price for $A$. $P_{now}(A) = P_{now}(A|E)P(E) + P_{now}(A|\neg E)P(\neg E)$.
  *   *Why it matters:* If you violate this, you are effectively valuing the same asset differently in the same world state, just because of when you are asked.

  **3. Breaking the Argument (Minutes 65-75)**
  *   **Variant A (Spread):** "Who found it harder to Dutch Book the Punter in Round 2?"
      *   *Lesson:* **Imprecise Credences.** If I have a range of acceptable prices (40-60) rather than a sharp point (50), the Bookie can't guarantee a loss. The DB argument assumes you *must* have a sharp price.
  *   **Variant B (Fee):** "Did anyone pay the fee to walk away?"
      *   *Lesson:* **Transaction Costs / Diachronic Binding.** The DB argument assumes your future self is a slave to your past self. If you can pay to renegotiate, the 'sure loss' vanishes. It reframes rationality as *self-binding* rather than *belief-accuracy*.
  *   **Variant C (The Forgetful Punter):** (Discussion Only)
      *   *Scenario:* "What if the Punter fills out Sheet 2, but then gets hit on the head and forgets Sheet 1? Or what if the evidence is 'The die is 1, 2, or 3'—something they didn't anticipate in the partition?"
      *   *Lesson:* **Unanticipated Evidence.** Conditionalization only works if you can name all possible evidence cells in advance. Real life often surprises us. The DB argument assumes a closed world.

  ---

  ### **6. Predicting Failure Modes (Be Straight)**

  **1. The "Perfect Bayesian" Problem**
  *   *Risk:* An Econ major Punter calculates $P(L|O) = 67$ and $P(L|E) = 33$. They conditionalize perfectly. The Bookie finds no exploit.
  *   *Fix:* During the instructions, say: *"In real markets, people don't calculate perfectly. I want you to price this like a human, not a calculator. If you feel the evidence is ambiguous, price it that way."* This licenses the error.
  *   *Backup:* If a pair conditionalizes perfectly, ask the Bookie to report "Zero Profit." Use this as a data point: "This pair is immune. Why? Because their plan was coherent."

  **2. The "Sure Loss" Confusion**
  *   *Risk:* Students think the Bookie took a risk (e.g., betting on Odd vs Even).
  *   *Fix:* In the debrief, highlight the pairs where the Punter was "Conservative" (Prior 50, Posters 45/45). Show that the Bookie made money *regardless* of the die roll. This distinguishes a Dutch Book (arbitrage) from a gamble.

  **3. Points vs. Utility**
  *   *Risk:* "Why should I care about points? I'm risk-neutral."
  *   *Fix:* Acknowledge this immediately in the debrief. "This argument assumes Points = Utility. If you hate losing 10 points more than you love winning 10, the math changes. The DB argument assumes linear utility."

  **4. The "Evidence You Didn't See Coming" Hole**
  *   *Risk:* Students realizing the partition was given to them.
  *   *Fix:* This is the strongest philosophical objection. Lean into it in Variant C. "The Dutch Book proves you should conditionalize *if* you know all the possible things you might learn. It doesn't tell you what to do when you learn something unimaginable."

  ### **7. What the Game Can't Stage**
  Be prepared to admit this in the final 5 minutes.
  1.  **The Origin of Priors:** The game tests *updating*, not where the 50 came from. If the Prior was crazy (90), conditionalizing might still lead to a loss if the world is different. The DB argument protects coherence, not truth.
  2.  **Cost of Computation:** The game assumes calculating the conditional price is free. In reality, thinking is costly. Sometimes it's rational *not* to update fully because thinking is expensive. The Fee variant hints at this, but doesn't capture the cognitive load.
  3.  **The "Bookie" Existence:** In real life, there isn't always a Bookie waiting to exploit you. The DB argument says you are *exploitable*, not that you *will be* exploited. Some philosophers argue "So what? If no one is there to bet me, am I irrational?" (The "Shut Up and Take My Money" objection).

  ### **Instructor Cheat Sheet: The "Conservative" Nudge**
  If you walk around and see Punters writing 50, 67, 33 (Perfect Conditionalization), whisper to them:
  *"Are you sure Odd/Even tells you that much about High/Low? Most people feel the correlation is weaker. Trust your intuition, not the fraction."*
  This usually nudges them toward 50, 55, 45, which creates the Dutch Book opportunity for the Bookie.
