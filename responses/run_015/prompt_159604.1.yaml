answer: |-
  Consciousness doesn't require a persistent subject, it requires a present cause-effect structure, and the theory's scale selection prevents the wild drift you're predicting. You're conflating the ontological instant of experience with the phenomenological content of continuity, assuming we need a permanent soul to hold the scene together. IIT only demands that a subject exists *now*, fully formed, for that update cycle; if the complex shifts slightly in the next millisecond, that's just a new experience, but the previous one was still real. The "noticing" you demand happens inside the cause-effect structure via memory traces and overlapping information, not by having an entity that survives outside the mechanism.

  More critically, you're fixing the update rate at the neuronal firing level, but the complex exists at the spatiotemporal scale where Φ is maximal. If micro-fluctuations cause fissioning at 1ms but stability at 10ms, the 10ms scale wins by the exclusion postulate. The border doesn't drift wildly because the cause-effect power is robust across small perturbations; if it were that fragile, it wouldn't be integrated enough to generate high Φ in the first place.
