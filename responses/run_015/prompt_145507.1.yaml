answer: |-
  **Essay Question (20 Marks)**

  Consider a society deciding on social states. A Social Decision Function (SDF) maps profiles of individual orderings to a social choice. Standard conditions include:
  1.  **Unrestricted Domain (UD):** The SDF accepts any logically possible profile of individual orderings.
  2.  **Pareto Principle (P):** If everyone prefers $x$ to $y$, society prefers $x$ to $y$.
  3.  **Minimal Liberalism (ML):** At least two individuals each have a protected pair of states over which their preference dictates the social ranking.

  It is known that no SDF satisfies UD, P, and ML. Consider the standard profile: A Prude (P) and a Lewd (L) decide on who reads a book. States: $p$ (Prude reads), $l$ (Lewd reads), $n$ (no one reads).
  P's ordering: $n \succ p \succ l$.
  L's ordering: $p \succ l \succ n$.
  Under ML, P dictates $\{n, p\}$ and L dictates $\{l, n\}$. This generates a cycle.

  A proposed repair replaces the SDF with a **Game Form**: rights are powers to choose within a protected sphere, not inputs to a collective ranking. Outcomes result from simultaneous exercise of these powers. This dissolves the formal cycle. However, define **Pareto-Improvability-Under-Rights (PIR)**: An outcome exhibits PIR if it results from permissible rights-exercise but is Pareto-dominated by another outcome also reachable by permissible rights-exercise. In the profile above, suppose the game form yields $l$ because P exercises right to prevent $p$ and L exercises right to enforce $l$. But both prefer $p$ to $l$. PIR exists.

  Now introduce a **Unanimous-Waiver Clause (UWC)**: Any right-holder may waive their right over their protected pair. A right is defeated only if every right-holder waives, in which case the pair is decided collectively (e.g., by Pareto).
  **Task:** Determine whether UWC necessarily eliminates PIR in this framework. Conclude whether a regime satisfying UWC is recognizably liberal, given liberalism requires rights to be powers over one's own sphere independent of others' choices. Justify your verdict definitively.

  ***

  **Model Answer**

  The Game Form repair successfully dissolves the formal inconsistency of the impossibility theorem. By treating rights as powers to select outcomes within a sphere rather than constraints on a social ordering, the logical cycle disappears; the outcome is simply the vector of individual choices. However, this does not resolve the normative conflict captured by PIR. In the Prude/Lewd profile, if agents exercise rights non-cooperatively based on their actual preferences, they may arrive at an outcome (e.g., Lewd reads) that both prefer less than an alternative reachable by different exercise of rights (e.g., Prude reads). The formal machinery works, but the result is Pareto-inefficient relative to the space of rights-consistent outcomes.

  Does UWC eliminate PIR? Mechanically, yes. UWC allows right-holders to waive their protected status. If both Prude and Lewd prefer the outcome $p$ (Prude reads) to the rights-based outcome $l$ (Lewd reads), and UWC permits waiver when unanimous, they can jointly waive their rights to allow the Pareto-superior outcome $p$ to be selected collectively. Since PIR is defined as the existence of a reachable Pareto-superior outcome, the ability to waive rights to access that outcome eliminates the condition of PIR. The inefficiency is removed because the mechanism allows coordination on the preferred state.

  However, is the resulting regime recognizably liberal? The prompt defines liberalism as requiring rights to be powers over one's own sphere independent of others' choices. Under UWC, the exercise of a right is no longer independent; it is conditional on the waiver of others. If I can only exercise my right to read (or not read) if you agree to waive your right to stop me, my power is not inherent to my sphere but contingent on a collective agreement. This transforms rights from trumps or protected domains into negotiable permissions within a contract.

  Therefore, the verdict is determinate: UWC necessarily eliminates PIR by enabling coordination on Pareto-superior outcomes, but it does so by undermining the liberal conception of rights. By making rights conditional on unanimous waiver, the regime treats rights as instrumental variables for efficiency rather than deontological constraints protecting individual sovereignty. Consequently, while UWC solves the normative conflict of inefficiency, it ceases to be a liberal regime, becoming instead a form of conditional contractualism where individual sovereignty is subordinate to collective optimality. The repair saves efficiency at the cost of liberalism.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Distinction between Formal and Normative Conflict (4 marks):**
      *   *Hit:* Identifies that Game Form solves the logical cycle (formal) but PIR persists (normative/efficiency).
      *   *Miss:* Confuses the cycle with PIR; claims Game Form solves everything.
  2.  **Mechanics of UWC (4 marks):**
      *   *Hit:* Correctly explains that UWC allows rights to be set aside via unanimous consent to enable collective choice.
      *   *Miss:* Treats UWC as a veto power or misunderstands the "unanimous" condition.
  3.  **Resolution of PIR (4 marks):**
      *   *Hit:* Concludes UWC eliminates PIR because agents can coordinate on the Pareto-superior outcome via waiver.
      *   *Miss:* Claims PIR remains because rights are still "there"; fails to see waiver changes the reachable set.
  4.  **Analysis of Liberalism (4 marks):**
      *   *Hit:* Argues that conditioning rights on others' waivers violates the "independent power" definition of liberalism.
      *   *Miss:* Asserts it is liberal because everyone agreed; ignores the structural change to the right itself.
  5.  **Determinate Verdict (4 marks):**
      *   *Hit:* Concludes UWC solves PIR but fails Liberalism (trade-off identified).
      *   *Miss:* Hedges ("it depends"); fails to commit to the logical implication of the definitions.

  **Grading Note:** A-grade answers explicitly distinguish dissolving formal inconsistency from dissolving normative conflict (Point 1) and derive the loss of liberalism from the conditionality of waivers (Point 4). B-grade answers correctly handle the machinery (Points 2 & 3) but treat the outcome as a standard "discussion" without forcing the trade-off verdict.
