      *   Single least sure bit flagged? Yes.
      *   Addressed all 3 cases? Yes.
      *   Addressed the categorical basis question? Yes.

  8.  **Final Polish:** (Mental check on Case 1). Is catalyst poisoning a fink? A fink is usually intrinsic to the object. If the poison is in the feed, is that extrinsic?
      *   *Nuance:* A classic fink (Lewis's example) is a wizard who makes the glass non-fragile when struck. That's extrinsic. But philosophical finks are often categorized by whether the *basis* is removed.
      *   *Better mapping:* Case 1 is tricky. If the poison is external, it's arguably a mask (blocking sites). But if the reaction *changes* the surface structure immediately, it's a finkish loss of basis. I should acknowledge this ambiguity. This might be the "least sure" part.
      *   *Decision:* I will flag the classification of Case 1 as the least sure part because the line between "surface modification" (intrinsic) and "contamination" (extrinsic) is blurry in this context.

      *(Self-Correction)*: Wait, let's look at the "Fink" definition again. A fink removes the disposition *upon* stimulus. A mask prevents the manifestation *despite* the disposition.
      *   Case 1: Catalyst + Feed $\to$ Poisoned Surface. The catalytic ability is lost *because* of the feed. That fits the Fink structure (Stimulus causes loss of Basis).
      *   Case 2: Solvent + Spark + $N_2$. The flammability remains, $N_2$ blocks $O_2$. That fits Mask.
