  I'm a science journalist covering climate and chaos theory, and at a panel last week a speaker tossed out the old 'butterfly in Brazil causes a tornado in Texas' line to argue that long-range climate forcasting is bassically useless — if a wing-flap can blow up, how can we trust a 2050 projecion? I need to unpack that for my readers. Can you separate the precise claims hiding inside that slogen? Like: deterministic chaos with sensitive dependence; metaphysical indeterminism; practical unpredictability vs. statistical predictability; and the leap that 'chaos' makes science impossible. For each, say whether it's a platitude, a defensible subtle point, or flat wrong, and flag exactly which reading lets the speaker dismiss climate models. Then say what would change your mind — which argument or empirical result would make you pick a different reading as the 'real' meaning — and point out where your reasoning here is most likely to fail.
