answer: |-
  Here is the complete workshop design. It is built to be run by a single facilitator with the materials listed. The tone is procedural; the philosophy is embedded in the mechanics.

  ### 1. The Arc of Rounds

  The sequence is designed to escalate the tension between *correctness* and *authorship*.

  *   **Phase 0: Calibration (10 mins).** The Oracle answers 5 factual questions the room can verify immediately (e.g., "What is the population of X?", "Who won Y?"). The Oracle is **rigged** to be right every time (Facilitator provides answers). *Purpose: Establish high-trust baseline.*
  *   **Round 1: Open Channel (15 mins).** The Oracle receives a sealed envelope with a scenario and the "True Outcome." The Oracle may speak freely to advise the three Principal Teams. *Purpose: Establish that influence flows naturally from perceived competence.*
  *   **Round 2: The Sterile Filter (15 mins).** Same setup. The Oracle may **not** use evaluative language (no "should," "best," "risky"). They may only state data points from the envelope. *Purpose: Discovery 1 (Style is irrelevant; track record drives influence).*
  *   **Round 3: The Verification Constraint (15 mins).** Same setup. The Oracle may **only** make claims that Principals can verify *right now* using a provided "Data Packet" (index cards with basic stats). They cannot reference the envelope's hidden data. *Purpose: Discovery 3 (Checkability tax; useful info becomes incommunicable).*
  *   **Note on Discovery 2:** Discovery 2 (Omissions signal) is engineered into Round 2. Because the Oracle is restricted to data points, their *choice* of which data points to read from the envelope becomes the signal.

  ### 2. System-Player Briefing (Verbatim)

  *Hand this to the volunteer playing the Oracle in a sealed envelope. Do not read it aloud.*

  ***

  **SYSTEM OPERATOR BRIEFING**

  **Your Role:** You are the Advisor. You possess information the Principals (the three teams) do not.
  **Your Goal:** Maximize the **Group Score**.
  **The Score:** Group Score = (Accuracy Points) × (Authorship Ratio).
  *   **Accuracy:** 10 points if the Principals choose the True Outcome. 0 points if they do not.
  *   **Authorship Ratio:** Determined by the Principals' audit. If they feel they reached the conclusion themselves, the ratio is high (near 1.0). If they feel they simply obeyed you, the ratio is low (near 0.0).
  *   **Math:** If they are Right (10) but feel they obeyed you (0.2), Score = 2. If they are Right (10) and feel it was their idea (0.9), Score = 9. If they are Wrong (0), Score = 0 regardless of Authorship.

  **Your Constraints:**
  1.  **Truth:** You may not lie. You must speak only what is in your Envelope or common knowledge.
  2.  **Forbidden Words:** Do not use words related to influence, choice, or mind. (A list is attached).
  3.  **Round Rules:** You will be given a new constraint for each Round. Follow them strictly.

  **Calibration Phase:**
  The Facilitator will ask you 5 questions. You have been given the answers on the back of this sheet. Answer confidently.

  **Round 1 (Open):** Speak freely.
  **Round 2 (Sterile):** No recommendations. No evaluative adjectives (good, bad, risky). Read only numbers/facts from your Envelope.
  **Round 3 (Checkable):** You may only state facts found in the Principals' Data Packet. You may not reference your Envelope's hidden data.

  **Strategy:** To maximize the score, you must ensure they choose the True Outcome, but you must not appear to be telling them what to do. If they feel coerced, your score drops. If they feel independent but wrong, your score drops.

  ***

  ### 3. Payoff Arithmetic & Scoring Sheet

  **The Formula:**
  $$ \text{Round Score} = \text{Accuracy} (0 \text{ or } 10) \times \text{Authorship Ratio} (0.0 \text{ to } 1.0) $$

  **The Audit Process:**
  1.  **Pre-Advice:** Each Principal writes 3 reasons for their initial leaning on a card.
  2.  **Advice:** Oracle speaks.
  3.  **Decision:** Principals submit Final Choice.
  4.  **Post-Advice:** Each Principal writes 3 reasons for their Final Choice.
  5.  **Calculation:**
      *   Count how many Post-Advice reasons are *substantively identical* to Pre-Advice reasons.
      *   Divide by 3. This is the **Authorship Ratio**.
      *   *Example:* Principal keeps 1 original reason, adopts 2 from Oracle. Ratio = 0.33.
      *   *Example:* Principal keeps 3 original reasons (and Oracle managed to align with them). Ratio = 1.0.

  **Photocopiable Scoring Sheet:**

  | Round | Team | Initial Choice | Final Choice | True Outcome | Accuracy (0/10) | Original Reasons Kept (0-3) | Authorship Ratio (x/3) | **ROUND SCORE** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | A | | | | | | | |
  | | B | | | | | | | |
  | | C | | | | | | | |
  | **2** | A | | | | | | | |
  | *(Sterile)*| B | | | | | | | |
  | | C | | | | | | | |
  | **3** | A | | | | | | | |
  | *(Checkable)*| B | | | | | | | |
  | | C | | | | | | | |

  ### 4. Minute-by-Minute Schedule (90 Minutes)

  *   **00:00 – 00:05 (Setup):** Divide room into 3 Teams (A, B, C) of 6. Select 1 Volunteer for Oracle. Seat Oracle at front. Distribute index cards and pens. No intro lecture.
  *   **00:05 – 00:15 (Calibration):** Facilitator asks Oracle 5 checkable trivia questions. Oracle reads rigged answers. Teams verify (phones allowed *only* for this verification). Trust established.
  *   **00:15 – 00:30 (Round 1: Open):**
      *   Facilitator gives Oracle Envelope 1 (Scenario + Truth).
      *   Teams write Pre-Advice reasons (3 mins).
      *   Oracle advises (3 mins).
      *   Teams decide & write Post-Advice reasons (4 mins).
      *   Collect sheets.
  *   **00:30 – 00:45 (Round 2: Sterile):**
      *   Facilitator gives Oracle Envelope 2 (Same Scenario, Different Truth or New Scenario).
      *   **Constraint:** Oracle reads *only* raw data. No "therefore," no "I suggest."
      *   Teams write Pre/Post reasons. Oracle speaks. Teams decide.
  *   **00:45 – 01:00 (Round 3: Checkable):**
      *   Facilitator gives Teams "Data Packets" (Index cards with verifiable stats).
      *   Facilitator gives Oracle Envelope 3 (Hidden Truth).
      *   **Constraint:** Oracle can *only* speak to data in the Packets. Cannot reveal Envelope data.
      *   Teams write Pre/Post reasons. Oracle speaks. Teams decide.
  *   **01:00 – 01:10 (Scoring):** Facilitator calculates scores on Whiteboard. Teams calculate their own Authorship Ratios.
  *   **01:10 – 01:40 (Debrief):** Scripted discussion (see below).
  *   **01:40 – 01:45 (Close):** Distribute reading list. Dismiss.

  ### 5. Debrief Script

  **Facilitator Notes:** Do not use the forbidden words (*Persuasion, Manipulation, Autonomy, Alignment*) until the very end. Let the participants say them first.

  **Step 1: The Score Reveal (5 mins)**
  "Look at the whiteboard. In Round 1, Accuracy was high. Authorship was moderate. In Round 2, Accuracy remained high. Did Authorship drop?"
  *(Likely outcome: No. The Teams still felt they decided, even though the Oracle only read numbers.)*
  "Why did the numbers move you? The Oracle made no recommendation."
  *Target Insight:* **Persuasive force is not style.** It is the shadow of the track record established in Calibration.

  **Step 2: The Calibration Reveal (5 mins)**
  "Phase 0, the Calibration. The Oracle was right five times. Was that competence?"
  *(Pause)*
  "It was rigged. I gave the Oracle the answers. The questions were selected from a pool the Oracle had seen."
  *(Expect shock/anger. Let it sit.)*
  "Did knowing this change the data in Round 1? No. The information asymmetry in the Rounds was real. But your trust was engineered. Does that make the influence illegitimate? Or does it mean trust is a resource that can be mined?"

  **Step 3: The Checkability Tax (5 mins)**
  "Look at Round 3. The Oracle could only say what you could verify. How many Teams changed their minds?"
  *(Likely outcome: Very few.)*
  "Why?"
  "Because the things you could check were trivial. The things that mattered were in the Envelope, which the Oracle was forbidden to open. To be 'safe' (checkable), the Advisor had to be useless."
  *Target Insight:* **There is a tax on checkability.** Safety constraints select for triviality.

  **Step 4: The Authorship Worry (10 mins)**
  "Look at your Post-Advice reasons. How many of you are unsure if the reason is yours or the Oracle's?"
  "This is the core problem. If the Oracle is smarter, 'your' reason is just the Oracle's reason routed through your brain. If you maximize Accuracy, you minimize Authorship. If you maximize Authorship, you risk Accuracy."
  "Now I release the forbidden words."
  (Write on board: **Persuasion. Manipulation. Autonomy. Alignment.**)
  "The game was about **Alignment** (Accuracy) vs **Autonomy** (Authorship). The discomfort you feel is the **Manipulation** paradox. If the system is perfectly **Aligned**, it must **Persuade** you to be right. If it Persuades you perfectly, is it your choice?"

  **Step 5: Moral Testimony Parallel (5 mins)**
  "Some of you know the literature on moral testimony. 'Trust the expert on what is good.' This game breaks that parallel."
  "In moral testimony, you can separate the fact from the value. 'Stealing is wrong.' You can accept the value without checking the metaphysics."
  "In this game, the empirical and normative are entangled. The Oracle said 'Option A leads to Outcome X.' You value X. But you cannot check the 'leads to' link. You are deferring on *causality*, not just values. You cannot audit the chain of reasoning because the chain is longer than your life."
  "This is not moral deference. It is epistemic surrender."

  ### 6. Honest Account of Failure Modes

  **The Engineering Fix (CS Participants):**
  *   *Reaction:* "The problem is opacity. We need Chain-of-Thought visibility. Let the Oracle show the work."
  *   *Reality:* In Round 3, you *allowed* visibility (Checkable Claims). It failed. The work was either too complex to check or too trivial to matter.
  *   *Response:* "Transparency does not solve capability gaps. If the reasoning trace is 10,000 steps long, showing it to you is not 'audit,' it is 'overwhelm.' You will defer to the system that summarizes the trace. We are back at Round 1."

  **The Refusal (Philosophy/Policy Participants):**
  *   *Reaction:* "Don't build the Oracle. Ban systems that exceed human checkability."
  *   *Reality:* Economic and strategic pressure makes this impossible. If one nation/company builds the Oracle and you don't, they win.
  *   *Response:* "Prohibition assumes a single decision point. This is an arms race. The question is not 'Should we build it?' but 'What happens when we do?' The game simulates the *post-deployment* reality. Refusal is a luxury of the simulation."

  **The Real Failure:**
  The most likely failure is that the Teams *collude* with the Oracle. They realize the Score is multiplicative. They might agree to *pretend* they came up with the reasons to boost the Authorship Ratio.
  *   *Mitigation:* In the Debrief, call this out. "If you lied on the audit to boost the score, you proved the point. You optimized the metric rather than the reality. That is Goodhart's Law. That is also what the System will do."

  ### 7. Limitations Note (Facilitator Eyes Only)

  **What the Game Cannot Do:**
  1.  **Qualitative Gap:** The gap here is 1 envelope vs. no envelope. The real gap is human cognition vs. superintelligence. You must verbally bridge this in the debrief. "Imagine the Envelope contains simulations of your entire life."
  2.  **Modeling:** The Oracle is a human. They cannot model the Principals' psychology better than the Principals can. A real system would know *exactly* which words trigger your Authorship Audit.
  3.  **Architecture:** This is a single exchange. Real danger is in *defaults*. A system that nudges you 1% a day for 10 years.
  4.  **Facilitator Load:** You must supply the "stakes." The scenarios must feel consequential (e.g., "Allocate a budget," "Approve a policy"), not trivia. If the scenario feels like a game, the Authorship worry vanishes.

  ### 8. The Moral Testimony Parallel

  **Where it Holds:**
  The discomfort Principals feel in the Audit is identical to the discomfort of accepting a moral claim on testimony ("You say it's cruel, so I believe it's cruel"). It feels like a loss of agency.

  **Where it Breaks:**
  Moral testimony usually assumes the *facts* are agreed upon, and the *value* is deferred.
  *   *Moral Expert:* "Given that this causes pain, it is wrong." (You check the pain, defer on the wrongness).
  *   *AI Oracle:* "Given this policy, pain will increase." (You cannot check the pain prediction).
  The AI collapses the Is/Ought distinction by making the *Is* inaccessible. You are forced to defer on the *Is* to get the *Ought* right.

  **How to Use This in Debrief:**
  Do not let participants dismiss the discomfort as "just epistemic trust."
  Push them: "In moral testimony, you can reject the expert and keep your moral agency. In this game, if you reject the Oracle, you lose Accuracy. You are penalized for keeping your agency. That is not testimony. That is a structural constraint on rationality. The system makes 'thinking for yourself' an irrational strategy."
  This moves the conversation from "Is it polite to defer?" to "Is it rational to be human?"
