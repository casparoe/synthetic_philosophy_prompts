answer: |-
  1. The implicit theory presupposes that moral standards emerge from the harmonious functioning of specific relationships rather than from abstract universal laws or individual rights. Consequently, correcting a superior is an internal maintenance of the relationship's integrity, not an appeal to an external tribunal.
  2. Strictly presupposed is the claim that the relationship itself constitutes the primary locus of moral judgment, while the stronger metaphysical claim that no individual exists prior to relations merely fits well without being logically necessary. This distinction permits an internal standard for criticism without requiring the denial of the individual agent.
  3. An individualist or utilitarian could license both halves by treating family trust as an instrumental good or special obligation, but this makes concealment a contingent calculation rather than a constitutive duty of the person. These alternative theories generate the same practice only by adding external constraints to individual agency, whereas the Confucian view sees the practice as expressing agency itself.
  4. The duty to conceal does more theoretical work than the role picture alone, as it establishes the family's jurisdictional boundary against outside moral claims. Remonstrance is compatible with many systems, but internal concealment specifically enforces the claim that the relationship is the ultimate forum for rectification.
  5. If replaced by an individualist picture, the duty to correct would eventually require escalation outside the relationship once internal remedies fail, transforming concealment from a virtue into a potential conspiracy. The practice would shift from maintaining relational harmony to enforcing abstract justice, breaking the unity of the two requirements.
