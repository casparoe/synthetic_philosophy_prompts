answer: |-
  # The Underdetermination Sorting Tree

  **Instructions:** Start at the Entry Node. Answer the question based on your judgment of the case or claim provided. Follow the branch corresponding to your answer until you reach a Leaf. Do not look at the Leaf names until you arrive there.

  ### Node 1 (Entry Case)
  **Case:** Two trained models agree on every observation checked and every intervention actually run, but disagree on the outcome of an intervention nobody has run and cannot yet run.
  **Question:** Is there currently a rational obligation to suspend judgment between them, or do existing priors and simplicity constraints dictate belief immediately?
  *   **Belief dictated immediately:** Go to **Leaf A**.
  *   **Suspension required:** Go to **Node 2**.

  ### Node 2 (Physical Possibility)
  **Claim:** "A being with unlimited technological capacity (obeying physical law) could gather data to distinguish these models."
  **Question:** Is this claim true or false?
  *   **False (No possible data distinguishes them):** Go to **Node 3**.
  *   **True (Data is possible, just not for us yet):** Go to **Node 5**.

  ### Node 3 (Source of Strong Underdetermination)
  **Claim:** "The inability to distinguish them is due to the theories being logically equivalent on all observables."
  **Question:** Is this the source of the problem, or is it that different communities use incommensurable standards of what counts as evidence?
  *   **Incommensurable standards:** Go to **Leaf B**.
  *   **Logically equivalent:** Go to **Node 4**.

  ### Node 4 (Status of Unobservables)
  **Claim:** "Since no observation can distinguish them, the 'truth' of the unobservable mechanism is not a factual matter."
  **Question:** Do you accept or reject this claim?
  *   **Accept (Truth applies only to observables):** Go to **Leaf C**.
  *   **Reject (There is a fact, we just can't know it):** Go to **Leaf D**.

  ### Node 5 (Future Resolution)
  **Claim:** "As new data arrives, one of *these specific two* models will be confirmed."
  **Question:** Is this likely, or does the historical record suggest both will be discarded for a better, currently unconceived theory?
  *   **Both discarded (History suggests better options exist):** Go to **Leaf E**.
  *   **One confirmed:** Go to **Node 6**.

  ### Node 6 (Source of Weak Underdetermination)
  **Claim:** "The current slack exists because we simply lack enough data points."
  **Question:** Is this the cause, or is it because any data can be accommodated by adjusting background assumptions (measurement errors, initial conditions)?
  *   **Lack of data:** Go to **Leaf F**.
  *   **Adjusting background assumptions:** Go to **Node 7**.

  ### Node 7 (Tie-Breaking Status)
  **Claim:** "When we pick the 'better' model (e.g., the simpler one), this choice tracks the truth of the world."
  **Question:** Does it track truth, is it merely pragmatic for the lab, or are social values/interests the legitimate tie-breaker?
  *   **Tracks Truth:** Go to **Leaf G**.
  *   **Merely Pragmatic:** Go to **Leaf H**.
  *   **Social Values/Interests:** Go to **Leaf I**.

  ---

  ### The Leaves

  **Leaf A: The Bayesian Response**
  *   **Awkward Commitment:** You must maintain that simplicity and priors are truth-tracking enough to resolve cases where empirical data is silent.
  *   **Mind Changer:** A demonstration that simplicity priors systematically lead to false beliefs in structurally similar model classes.

  **Leaf B: Incommensurability (Kuhn/Feyerabend)**
  *   **Awkward Commitment:** You must accept that rational debate between proponents of the two models is impossible because they speak different logical languages.
  *   **Mind Changer:** A successful translation manual that allows precise prediction exchange without loss of meaning between the two camps.

  **Leaf C: Constructive Empiricist (van Fraassen)**
  *   **Awkward Commitment:** You must assert that believing the theory is "true" is intellectually dishonest; you may only believe it is "empirically adequate."
  *   **Mind Changer:** A case where believing in the unobservable mechanism was necessary to generate the empirical adequacy in the first place.

  **Leaf D: Unnamed (Skeptical Realist)**
  *   **Awkward Commitment:** You must hold that there is a fact of the matter about the world that is permanently inaccessible to any rational agent.
  *   **Mind Changer:** A proof that the "unobservable" difference entails a subtle observable difference under extreme conditions previously thought impossible.

  **Leaf E: Unconceived Alternatives (Stanford)**
  *   **Awkward Commitment:** You must treat current leading theories as likely false, despite their empirical success, based on the failure of past theories.
  *   **Mind Changer:** A period of scientific stability where the core ontology remains unchanged despite massive increases in data resolution.

  **Leaf F: Local/Temporary Underdetermination**
  *   **Awkward Commitment:** You must treat the current slack as mere ignorance, implying the current theoretical vocabulary is sufficient to describe the truth.
  *   **Mind Changer:** Evidence that the gap persists despite exponential increases in data collection, suggesting a structural rather than statistical deficit.
      *   *Note on Indistinguishability:* This leaf is practically hard to distinguish from **Leaf E** (Unconceived Alternatives) from the inside. Both predict future resolution; Leaf F bets on the current horse, Leaf E bets on a new horse. The difference is real (ontology vs. data), but often verbal until history has passed.

  **Leaf G: Unnamed (Methodological Realist)**
  *   **Awkward Commitment:** You must claim that extra-empirical virtues (simplicity, scope) provide evidence for truth, not just utility, without a clear mechanism for why the universe should be simple.
  *   **Mind Changer:** A demonstration that the "simpler" theory was consistently less accurate than the complex one across a wide domain of hidden variables.

  **Leaf H: Global Holist (Duhem/Quine)**
  *   **Awkward Commitment:** You must concede that no single hypothesis is ever tested in isolation, making the "truth" of any specific component undefined.
  *   **Mind Changer:** A case where a specific auxiliary assumption was isolated and falsified without requiring adjustment to the core theory.

  **Leaf I: Value-Laden Pluralist (Longino/Intemann)**
  *   **Awkward Commitment:** You must accept that two groups with different social values can rationally hold different theories as "true" without one being in error.
  *   **Mind Changer:** A scenario where value-laden choice leads to a technology failure that a value-neutral choice would have avoided.

  ---

  ### Empty Combinations (Logical Space vs. Occupied Space)

  1.  **Strong Underdetermination + Virtues Track Truth (Node 2 → Node 3 → Node 7 "Tracks Truth")**
      *   **Why Empty:** Incoherent. If virtues (like simplicity) track truth, they constitute evidence. If they constitute evidence, the theories are not strongly underdetermined (equivalent on all evidence).
  2.  **Local/Temporary + Global Holism (Node 5 → Node 6 "Lack of Data" → Node 7 "Merely Pragmatic/Holist")**
      *   **Why Empty:** Unattractive/Unstable. If the slack is merely due to a lack of data points, holism about auxiliaries is not the generating mechanism. One cannot claim the problem is "just wait for data" and "data never fixes the core" simultaneously.
  3.  **Incommensurability + Physically Possible Distinction (Node 2 "True" → Node 3 "Incommensurable")**
      *   **Why Empty:** Unexplored/Tension. If a physical distinction exists in principle, the claim that standards are incommensurable is weakened; usually, incommensurability is argued *from* the inability to map observations, not just social standards.

  ### Indistinguishable Leaves Flag
  **Leaf F (Local/Temporary)** and **Leaf E (Unconceived Alternatives)** are flagged as difficult to distinguish in real-time. Both occupy the "Weak Underdetermination" branch and agree that current evidence is insufficient. The distinction relies on a prediction about the *future ontology* of science (will we find the truth in the current set, or a new set?). Until the resolution occurs, a holder of Leaf F and a holder of Leaf E will behave identically regarding current evidence. The difference is real (a bet on the completeness of current conceptual space), but often functions verbally as "optimism" vs "pessimism" about current paradigms.
