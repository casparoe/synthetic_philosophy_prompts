answer: |-
  Here is Popper's demarcation argument translated into the institutional vocabulary of modern open science, followed by the residue report.

  ### The Institutional Translation of Demarcation

  In Popper's original framework, science is distinguished from pseudoscience by the logical capacity of a theory to be refuted by observation. In the vocabulary of current research infrastructure, this distinction shifts from the logical properties of statements to the **incentive structures and workflow constraints** governing data production.

  Under this translation, **science** is a research workflow that utilizes **preregistration** and **registered reports** to lock in hypotheses and analysis plans prior to data access. This mechanism operationalizes "risk." By committing to a specific prediction and analysis pipeline before observing the outcome, the researcher creates a situation where a null result is a visible, publishable outcome rather than a file-drawered failure. The "falsifiability" of the claim is no longer a logical property of the theory itself, but a procedural guarantee that the test could have returned a negative result that the authors were willing to report.

  **Pseudoscience**, conversely, is characterized by workflows with unlimited **degrees of freedom**. It is research that retains the ability to engage in **HARKing** (Hypothesizing After Results are Known) or **p-hacking**. In this mode, the analysis plan is flexible enough to ensure a positive result regardless of the underlying signal. When we analyze the output of these workflows using **p-curve analysis**, we see a right-skewed distribution of p-values just below the significance threshold, indicating that the "findings" are artifacts of selection bias rather than evidential value.

  The **demarcation line** is therefore not drawn between true and false theories, but between **transparent, high-power replication markets** and **opaque, low-power claim generation**. A field functions as "science" when its institutional architecture allows **replication markets** to efficiently price the reliability of claims. If a claim cannot be arbitrated by a direct replication because the methods are too vague or the data is inaccessible, that claim exits the scientific economy. It becomes a non-tradable asset. Popper's "dogmatic immunization" of a theory is translated here as the refusal to submit to a registered report protocol or the use of statistical adjustments that render the p-curve uninterpretable.

  ***

  ### Residue Report

  Here is what happens to Popper's argument when run through this institutional filter.

  **What Survives Intact**
  The core emphasis on **risk** survives. Popper argued that scientists must stick their necks out. Preregistration enforces this neck-sticking. If you preregister a prediction and it fails, you have paid a cost (time, resources, potential publication prestige). This aligns perfectly with Popper's demand for "risky predictions." Additionally, the commitment to **error correction** survives. Replication markets are the institutional engine for the "conjectures and refutations" cycle. They provide the mechanism by which errors are identified and priced out of the literature, fulfilling Popper's vision of science as a self-correcting process.

  **What Gets Distorted**
  The concept of **theory** gets distorted into **study**. Popper was concerned with grand theoretical frameworks (e.g., Marxism, Psychoanalysis, Relativity). The institutional vocabulary focuses on the granularity of individual empirical tests. You can have a preregistered study of a phenomenon that is theoretically incoherent. The institutional tools validate the *process* of testing, not the *plausibility* of what is being tested.
  Furthermore, **falsification** changes from a logical event to a **sociological negotiation**. In Popper's view, a single robust counter-instance could logically falsify a theory. In the institutional view, a single failed replication is often treated as noise, a difference in context, or a power issue. The "falsification" only occurs when the replication market collectively agrees the effect size is zero. This makes demarcation a matter of consensus and statistical power, not logical necessity.

  **What Disappears Entirely**
  The **semantic content** of the claim disappears. Institutional tools are content-agnostic. A preregistered, high-powered study on the effect of prayer on health looks methodologically identical to a study on gravity. Popper cared deeply about the *structure* of the explanation (e.g., Freud's theories could explain *anything*, making them unfalsifiable). Preregistration cannot detect if a hypothesis is ad hoc in its *conception*, only if it was fixed before *data collection*. You can preregister a nonsense theory. The tools capture procedural integrity, not theoretical depth.
  Also lost is the **historical trajectory**. Popper understood that scientists often cling to theories in the face of anomalies (which he allowed for, to a degree) until a better alternative emerges. The institutional vocabulary treats every study as a standalone transaction. It struggles to account for research programs that require years of protective development before they are ready for the harsh light of a registered report.

  ***

  ### Evaluation: Vocabulary Failure or Blurry Line?

  The missing pieces suggest that **Popper's line was always blurrier than he admitted**, but our current vocabulary exacerbates the problem by swinging the pendulum too far toward procedure.

  Popper treated falsifiability as a logical switch: a theory either has it or it doesn't. The institutional translation reveals that falsifiability is actually a **slider of cost**. Preregistration increases the cost of hiding null results. Replication markets increase the cost of maintaining false claims. But no amount of procedural rigor can force a community to abandon a paradigm if the social incentives reward dogmatism. The institutional vocabulary exposes that "science" is not a state of mind or a logical property, but a **supply chain of credibility**.

  However, the fact that you can preregister nonsense indicates a failure in our research-institution vocabulary to capture a **normative boundary**. We have built tools to ensure researchers are honest about their data, but we have not built tools to assess whether the questions they are asking are worth answering. We solved the problem of *lying*, but we haven't solved the problem of *triviality* or *coherence*.

  Popper wanted to separate sense from nonsense. Our current tools only separate transparent work from opaque work. The residue suggests that while Popper underestimated the sociological barriers to falsification (which institutional tools address), he was right that there is a theoretical component to demarcation that procedural checks cannot capture. The boundary isn't just about how you test; it's about what constitutes a testable explanation in the first place. Without that theoretical guardrail, we risk creating a landscape of perfectly preregistered, statistically robust, yet scientifically sterile inquiries.
