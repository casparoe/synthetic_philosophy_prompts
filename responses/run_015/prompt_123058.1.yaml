      *   **Vocabulary:** Institutional/Methodological (preregistration, registered reports, replication markets, p-curve analysis) *not* Philosophical (falsifiability, demarcation, epistemology, metaphysics).
      *   **Task 1:** Restate Popper's demarcation argument (science vs. pseudoscience via falsifiability) using *only* the institutional vocabulary. Crucially, this must be a translation of the *mechanism*, not just a renaming of terms.
