  3.  **Translate to Institutional Vocabulary (The Mechanism):**
      *   *Falsifiability* $\rightarrow$ Preregistration/Registered Reports. This locks in the prediction before data collection. It prevents HARKing (Hypothesizing After Results are Known).
      *   *Riskiness* $\rightarrow$ Statistical Power/Effect Size expectations in a Registered Report. If you predict a specific effect size and direction, you are risking rejection.
      *   *Ad hoc adjustments* $\rightarrow$ P-hacking/QRPs (Questionable Research Practices). P-curve analysis detects these.
      *   *Confirmation seeking* $\rightarrow$ Publication bias (file drawer problem). Replication markets test the durability of claims.
      *   *Demarcation* $\rightarrow$ The difference between a workflow that allows error detection vs. one that obscures it.

      *Drafting the Translation:*
      Instead of saying "theories must be falsifiable," say "research workflows must lock in analysis plans before data access."
      Instead of "pseudoscience immunizes itself," say "research workflows that allow unlimited degrees of freedom in analysis prevent the detection of null results."
