answer: |-
  # EXAMINATION PAPER

  **Course:** Time, Risk, and Rational Choice (PHIL/BUSN 5050)  
  **Section:** B  
  **Time Allowed:** 45 Minutes  
  **Marks:** 25  

  **Instructions to Candidates:**  
  Answer the question below. You may not use a calculator. You must rely on the data provided in the table; do not attempt to re-derive the figures. Merely identifying the 20 per cent stake as the "Kelly fraction" or reciting general slogans about expected value versus growth rates will earn **no marks**. Marks are awarded for analysing the specific trade-offs presented in the data and evaluating the logical coherence of the arguments provided.

  **Question:**  
  A fund faces a gamble $G$ which it may play as many times as it likes. It must choose a stake fraction $f \in [0,1]$ once and hold it fixed for every round. In each round, with probability 0.6 the fund's capital is multiplied by $(1+f)$ and with probability 0.4 by $(1-f)$.

  The following table provides data for eight specific values of $f$. $g(f)$ is the per-round geometric growth rate; $E[W_{10}]/W_0$ is the expected capital after ten rounds relative to the start; $P(W_{10} \geq 2W_0)$ is the probability of at least doubling capital within ten rounds; $P(W_{10} < W_0)$ is the probability of finishing below the starting capital.

  | $f$ | $g(f)$ | $E[W_{10}]/W_0$ | $P(W_{10} \geq 2W_0)$ | $P(W_{10} < W_0)$ |
  | :--- | :--- | :--- | :--- | :--- |
  | 0.1 | 0.0150 | 1.219 | 0.046 | 0.367 |
  | 0.2 | 0.0201 | 1.480 | 0.167 | 0.367 |
  | 0.25 | 0.0188 | 1.629 | 0.382 | 0.367 |
  | 0.3 | 0.0147 | 1.791 | 0.382 | 0.367 |
  | 0.35 | 0.0077 | 1.967 | 0.382 | 0.367 |
  | 0.4 | -0.0024 | 2.159 | 0.382 | 0.618 |
  | 0.5 | -0.0340 | 2.594 | 0.382 | 0.618 |
  | 1.0 | $-\infty$ | 6.192 | 0.006 | 0.994 |

  *Note: $0.382$ is the maximum attainable value of $P(W_{10} \geq 2W_0)$ over all admissible $f$.*

  The fund's Investment Committee circulates the following excerpt from a fictional annual letter (invented for examination purposes):

  > "(i) The fund is a going concern with no terminal date. The question before us is therefore not what maximises our expected capital at some arbitrarily chosen future date, but what maximises the rate at which capital grows along the single path we shall actually travel; under $G$, that is a stake of 20 per cent.
  > (ii) Let it be clear that this is not the logarithmic utility function in disguise. Our reason for the 20 per cent rule is a fact about how capital compounds through time, not a fact about our tastes. Any agent, however risk-loving, confronts the same arithmetic and is undone by it in the same way.
  > (iii) It follows that staking more than 20 per cent is irrational whatever the fund's objectives. The board's proposal to stake 40 per cent, in order to raise the probability of doubling the endowment within ten years, therefore rests on a confusion: it buys a better chance at an arbitrary milestone at the price of a strictly worse growth rate, and a going concern has no business attending to milestones.
  > (iv) Nor should the board take comfort from the observation that staking everything maximises expected capital. An expectation averages over histories of the fund, only one of which will ever be ours, and the fund does not get to average across its own alternatives. Expected capital is the wrong criterion because the process is non-ergodic; the growth rate is the right criterion because it is the one the fund actually faces."

  **Task:**  
  Evaluate claims (i)–(iv). For each claim, state what is correct, what is incorrect, and what would have to be true of the fund's situation for the claim to hold. Use the provided data to support your evaluation.

  ***

  # MODEL ANSWER

  **Claim (i): Horizon and Criterion**  
  The claim correctly identifies that for an infinite horizon ("going concern"), the time-average growth rate $g(f)$ is the relevant metric for survival and long-term expansion, peaking at $f=0.2$. However, it incorrectly dismisses the expected capital criterion as merely "arbitrary." If the fund has liabilities or payout obligations linked to calendar time, the ensemble expectation $E[W_t]$ matters for solvency, even if the typical path diverges. For (i) to hold strictly, the fund must have zero consumption, infinite horizon, and no risk of external termination due to short-term drawdowns.

  **Claim (ii): Arithmetic vs. Preferences**  
  The insistence that this is not "logarithmic utility in disguise" is partially correct: maximizing $g(f)$ is a property of the stochastic process (time-average), whereas log-utility is a preference ordering (ensemble-average). However, the claim that "any agent, however risk-loving, confronts the same arithmetic" conflates the *process* with the *objective*. While the compounding arithmetic is universal, a risk-loving agent with a finite horizon might rationally prefer a lower growth rate for a higher probability of reaching a specific target. The "undoing" only occurs if the agent cares about long-run survival. If the agent cares only about terminal wealth at $t=10$, the arithmetic of compounding is secondary to the distribution of outcomes.

  **Claim (iii): Dominance and Milestones**  
  This claim is demonstrably false based on the provided data. The memo argues that staking 40 per cent buys a "better chance" at doubling. The table shows $P(W_{10} \geq 2W_0)$ is $0.382$ for $f=0.4$, but it is *also* $0.382$ for $f=0.3$, $0.35$, and $0.25$. Since $g(0.3) > 0$ while $g(0.4) < 0$, a stake of 30 per cent strictly dominates 40 per cent: it offers the same maximum probability of achieving the ten-year milestone while preserving positive long-run growth. The memo is wrong to assert that >20 per cent is irrational "whatever the objectives." If the objective is maximizing the probability of doubling in ten years, any $f \in [0.25, 0.5]$ is optimal on that metric, but $f=0.3$ is superior to $f=0.4$ because it does not sacrifice long-term growth. The error lies in treating the growth rate and the milestone probability as a simple trade-off; here, they decouple.

  **Claim (iv): Ergodicity and Expectation**  
  The ergodicity argument is theoretically sound: for non-ergodic processes, the ensemble average (expected capital) diverges from the time average (actual path). $E[W_{10}]$ is indeed driven by rare, high-wealth paths (evident as $f \to 1$, $E[W_{10}]$ soars while $g(f) \to -\infty$). However, declaring expected capital the "wrong criterion" is too strong. Expectation is the correct criterion for pricing or for agents who can diversify across many independent instances of the fund. It is only "wrong" for a single agent who cannot diversify and cannot afford ruin.

  **Data Artefacts and Discrete Steps**  
  A first-class analysis must note the step-function nature of the probability columns. In ten rounds, there are only eleven possible wealth outcomes. The jump in $P(W_{10} < W_0)$ from $0.367$ to $0.618$ occurs exactly between $f=0.35$ and $f=0.4$, which coincides with $g(f)$ changing sign. This is not a continuous drift but a discrete threshold effect: at $f=0.35$, the median path (6 wins, 4 losses) yields a profit; at $f=0.4$, the same median path yields a loss. Thus, the "ruin" probability jumps because the typical outcome flips from gain to loss exactly where the geometric mean crosses 1. A candidate must recognize that the data reflects the binomial structure of 10 rounds, not a smooth continuous function of risk.

  **Conclusion**  
  The memo is internally coherent regarding infinite-horizon growth but fails to justify why a ten-year milestone is irrelevant if the board explicitly values it. More critically, it fails to notice that the board's specific proposal (40 per cent) is dominated by lower stakes (30 per cent) even on the board's own terms. The fund should reject the 40 per cent stake, not because milestones are irrelevant, but because 30 per cent achieves the milestone with better long-term properties.

  ***

  # MARKING SCHEME

  **Total Marks:** 25  
  **Pass Mark:** 13  
  **First-Class Threshold:** 20  

  **General Instruction:**  
  Do not award marks for reciting the following slogans without specific application to the data or logical context:  
  *   "Expected value ignores compounding."  
  *   "Kelly maximizes long-run growth."  
  *   "One should never risk ruin."  
  *   "The process is non-ergodic."  
  These statements are true but constitute **non-scoring restatements** unless linked to the specific claims (i)–(iv) and the provided table. Identifying $f=0.2$ as the Kelly fraction earns **0 marks**.

  **Breakdown by Claim:**

  **Claim (i) [5 Marks]**  
  *   **2 Marks:** Acknowledges $g(f)$ is appropriate for infinite horizon/going concern.  
  *   **2 Marks:** Notes that dismissing $E[W_t]$ requires assuming no intermediate consumption or external termination risk.  
  *   **1 Mark:** Correctly identifies $f=0.2$ as the growth maximizer *in this context* without merely naming it Kelly.

  **Claim (ii) [5 Marks]**  
  *   **2 Marks:** Distinguishes between time-average growth (arithmetic) and utility functions (preferences).  
  *   **3 Marks:** Critiques the "any agent" assertion. Must state that finite-horizon agents or those with non-log preferences may rationally deviate from $f=0.2$. (e.g., "Risk-loving" agents might prefer higher variance for finite targets).

  **Claim (iii) [10 Marks]**  
  *   **3 Marks:** **Crucial Move:** Identifies from the table that $P(W_{10} \geq 2W_0)$ is constant (0.382) for $f \in [0.25, 0.5]$.  
  *   **3 Marks:** **Crucial Move:** Observes that $f=0.3$ (or 0.25/0.35) has positive $g(f)$ while $f=0.4$ has negative $g(f)$.  
  *   **2 Marks:** Concludes that $f=0.3$ *dominates* $f=0.4$ (same milestone probability, better growth), proving the memo's specific attack on the board's proposal flawed.  
  *   **2 Marks:** Rejects the absolute claim that >20% is irrational "whatever the objectives."

  **Claim (iv) [5 Marks]**  
  *   **2 Marks:** Validates the ergodicity critique (ensemble mean $\neq$ time mean).  
  *   **3 Marks:** Nuances the "wrong criterion" assertion. Expectation is valid for pricing or diversified portfolios; only invalid for single-path survival.

  **First-Class Differentiators (Required for 20+ Marks):**  
  To achieve a First, the script must make at least **four** of the following specific moves:  
  1.  **Dominance Argument:** Explicitly stating that $f=0.3$ dominates $f=0.4$ on *both* the memo's growth criterion and the board's milestone criterion.  
  2.  **Discrete Artefact:** Explaining that the jump in $P(W_{10} < W_0)$ (0.367 to 0.618) is due to the discrete number of rounds (10), causing the median outcome to flip from profit to loss exactly where $g(f)$ changes sign.  
  3.  **Horizon Conflict:** Highlighting the internal tension in the memo between claiming "no terminal date" (i) and arguing against a "ten-year milestone" (iii).  
  4.  **Utility Distinction:** Clearly articulating that while $g(f)$ maximization implies log-utility behavior, it is derived from dynamics, not tastes, but tastes still matter for finite horizons.  
  5.  **Data Precision:** Using the specific values (e.g., citing 0.382 vs 0.367) rather than speaking vaguely about "higher probability."

  **Penalties:**  
  *   **-2 Marks:** Treating "wealth tends to zero" (asymptotic) as equivalent to "likely to lose money over ten rounds" (finite probability).  
  *   **-2 Marks:** Claiming $f=0.4$ is irrational *solely* because $g(f) < 0$, without noticing $f=0.5$ is worse or that $f=0.3$ achieves the same target.  
  *   **-3 Marks:** Invoking "Half-Kelly" or other external heuristics not supported by the provided table.

  **Note to Second Marker:**  
  You may encounter scripts that reach a defensible overall verdict (e.g., "The memo is mostly right but too dogmatic") via a route the Model Answer does not anticipate. Specifically, credit scripts that argue the memo's **internal incoherence** is the central defect. If a candidate argues that one cannot simultaneously claim to be a "going concern with no terminal date" (Claim i) and dismiss the "ten-year milestone" as irrelevant (Claim iii), this is a valid philosophical objection to the text's consistency. Award full marks for Claim (iii) if the candidate demonstrates that the memo's framing creates an impossible standard (infinite horizon vs. finite evaluation) regardless of the arithmetic. However, ensure they still engage with the data: a purely philosophical critique that ignores the $f=0.3$ dominance insight should be capped at 18 marks (High 2:1), as it misses the quantitative crux of the exercise.
