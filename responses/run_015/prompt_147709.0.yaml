answer: |-
  A genuinely non-Whiggish theory of history must rigorously decouple explanatory coherence from teleological necessity while accounting for the cognitive biases that compel us to conflate them. This demand arises because human cognition is inherently narrative-driven, seeking causal arcs where there are often only branching paths, much like mistaking ecological succession for directed progress rather than contingent response to disturbance. To avoid the retrospective coherence fallacy, a robust framework must accommodate the randomness of initial conditions and the multiplicity of lost futures without surrendering the ability to make sense of the actual record. It must reconcile the historian's need for pattern with the philosopher's demand for truth, ensuring that the stability of the present is not mistaken for the inevitability of the past.

  **Quick Brainstorm of Criteria**

  *   **Contingency:** Must demonstrate that outcomes were not predetermined; alternative paths must be plausible, not just logical.
  *   **Contextualism:** Past actors must be understood by their own lights, not judged solely by their contribution to the present.
  *   **Cognitive Humility:** Must explicitly acknowledge the historian's tendency to impose narrative order on chaotic data.
  *   **Normative Separation:** Explaining why a moral norm emerged must not imply that the norm was inevitable or inherently justified by its emergence.
  *   **Complexity:** Causality must be treated as non-linear and multi-factorial, akin to ecosystem dynamics rather than mechanical physics.
  *   **Counterfactual Rigour:** 'What if' scenarios must be grounded in evidence, not used merely as rhetorical devices.

  **Desiderata Specification for Non-Whiggish Historical Theory**

  | Domain | Requirement | Status | Motivation & Phenomena | Damage to Casual Accounts |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ontological** | **Contingency Plausibility:** The theory must treat the actual outcome as one of several viable states, requiring evidence that alternative paths were historically possible at key branching points. | **Non-negotiable** | **Phenomena:** Addresses the 'retrospective coherence fallacy' where the survivor bias of history makes the actual path look like the only path. <br> **Biology:** Aligns with evolutionary biology where fitness is context-dependent, not progressive. | **Highest Damage:** This destroys the comfort of inevitability. Casual accounts rely on the assumption that 'what happened had to happen'; this requirement forces the admission that the present is an accident of history, not a destination. |
  | **Epistemological** | **Cognitive Bias Acknowledgement:** The methodology must include a reflexive step where the historian identifies their own pattern-seeking impulses (apophenia) that might be manufacturing teleology. | **Non-negotiable** | **Findings:** Cognitive science shows humans prefer causal narratives over probabilistic clouds. <br> **Phenomena:** Explains why 'progress' narratives are psychologically satisfying despite lacking empirical support. | High Damage: Forces historians to admit their narratives are constructions, not discoveries of inherent meaning. |
  | **Ethical** | **Explanation/Endorsement Decoupling:** The theory must strictly separate explaining the causes of a social norm from morally endorsing that norm based on its survival or dominance. | **Non-negotiable** | **Distinctions:** Prevents the 'is-ought' fallacy where historical victory is mistaken for moral validity. <br> **Hard Case:** Explaining the rise of liberal democracy without implying it was the moral apex of history. | Moderate Damage: Challenges the moral comfort of believing we are the 'good guys' of history. |
  | **Methodological** | **Synchronic Functionalism Limit:** Functional explanations (how a system works now) must not be retrojected as diachronic goals (why the system developed then). | **Non-negotiable** | **Distinctions:** Preserves the difference between ecological stability (climax community) and historical purpose. <br> **Findings:** Systems theory shows equilibrium is not teleology. | High Damage: Stops historians from treating present institutions as the 'purpose' of past struggles. |
  | **Hard Case** | **Scientific Revolution Handling:** Must account for scientific progress (accumulation of truth) without treating past theories as merely 'wrong' steps towards current truth rather than coherent systems in their own right. | **Nice-to-have** | **Hard Case:** Writing about physics or medicine without implying past scientists were blindly stumbling towards us. <br> **Philosophy:** Kuhnian incommensurability vs. realist accumulation. | Moderate Damage: Complicates the narrative of science as a pure march of light against ignorance. |
  | **Narrative** | **Counterfactual Integration:** Plausible counterfactuals must be used as explanatory tools to define the constraints of the actual path, not just as speculative footnotes. | **Nice-to-have** | **Phenomena:** Helps visualise the 'branching' nature of history. <br> **Method:** Makes contingency concrete rather than abstract. | Low Damage: Many casual accounts already use 'what ifs' rhetorically, though often poorly. |

  **Single Most Damaging Requirement:** The **Contingency Plausibility** requirement does the most damage to usual casual accounts. Most popular history functions as mythology, providing a sense of order and destiny; insisting that the present state is merely a contingent artefact, no more inevitable than a specific forest composition after a fire, undermines the foundational comfort of Whig interpretation.
