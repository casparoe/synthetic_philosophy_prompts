answer: |-
  (a) The Exam Question

  **Philosophy Seminar Final: Metaphysics of Relations**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1500 words

  **Question:**

  Consider the proposition expressed by the sentence 'A gives B to C'. Assume this proposition involves a single three-place relation ('gives') connecting three distinct terms with asymmetric roles: Agent (A), Object (B), and Recipient (C).

  Write an essay that analyzes the unity of this proposition through the lens of Bradley's Regress and Russell's theory of external relations. Your answer must not rely on bibliographies or named citations of recent secondary literature; work solely with the conceptual machinery of Bradley and Russell.

  Your analysis must proceed step-by-step through the following stages:
  1.  **The Threat:** Show exactly where Bradley's regress threatens the unity of this specific triadic case. How does the attempt to bind the relation 'gives' to the specific roles of A, B, and C generate an infinite series?
  2.  **The Halt:** Explain where Russell's appeal to external relations is supposed to halt this regress. Why does Russell claim no further unifier is needed?
  3.  **The Critique:** Evaluate whether the directionality of the roles (distinguishing 'A gives B to C' from 'C gives B to A') introduces a relocated version of the problem. Does relating the relation to its terms in an *ordered* fashion require further relations that reproduce the original difficulty?

  Conclude by assessing whether Russell's solution genuinely secures propositional unity for complex states of affairs involving asymmetric relations.

  ***

  (b) Model Answer

  The problem of propositional unity asks how distinct constituents combine to form a truth-evaluable whole rather than a mere list. In the case of 'A gives B to C', we have three terms and a three-place relation. Bradley's regress threatens this unity by challenging the coherence of the "connecting" function.

  **The Threat**
  Bradley argues that a relation cannot unite terms without itself being related to them. If 'gives' unites A, B, and C, there must be a tie between 'gives' and A (as Agent), 'gives' and B (as Object), and 'gives' and C (as Recipient). Let us call these tying relations $R_1, R_2, R_3$. However, $R_1$ is itself a relation. To connect $R_1$ to 'gives' and A, we require further relations ($R_{1a}, R_{1b}$). This generates an infinite regress. The proposition never achieves unity because the connectors always require further connectors. In this triadic case, the regress is compounded because the relation must not only connect to the terms but connect them in specific roles.

  **The Halt**
  Russell halts this by asserting relations are external and real constituents of the fact. For Russell, the fact *aRb* (or here, *gives(A,B,C)*) is a fundamental complex. The relation 'gives' does not need a further relation to connect it to A; it simply relates them. The unity is provided by the relation itself existing in the world. The proposition is unified because the fact exists; no additional "copula" or tying relation is required beyond the relating relation itself. The terms are independent, but the fact is a genuine unity because the relation is the unifier.

  **The Critique**
  However, the asymmetry of 'gives' complicates Russell's halt. 'A gives B to C' is distinct from 'C gives B to A'. The relation 'gives' has inherent directionality or "sense." If the relation is merely a constituent alongside A, B, and C, what ensures A occupies the Agent slot and C the Recipient slot? If we posit a further factor to assign these roles (a directional tie), we restart Bradley's regress: what connects the directional tie to the relation? If we deny this factor and claim the relation is inherently directed, we must explain how a single entity ('gives') can impose order without external assistance. If the order is internal to the relation, Russell avoids the regress but risks making the relation dependent on the terms for its identity. If the order requires external positioning, the regress returns.

  **Conclusion**
  Russell's solution secures unity only if one accepts that relations are inherently directional without requiring further relational glue. While this stops the explicit regress of tying relations, it relocates the difficulty to the nature of the relation itself. Unless the "sense" of the relation is primitive and unanalyzable, the problem of how specific terms lock into specific roles remains vulnerable to a Bradley-style challenge. Thus, Russell secures unity formally, but the metaphysical cost is accepting directional relations as brute facts.

  ***

  (c) Marking Scheme

  **Total Marks:** 20
  **Grading Logic:** The essay is scored based on five specific analytical moves (4 marks each). An **A** answer (16-20 marks) performs all moves with precision and critical depth. A **B** answer (12-15 marks) performs the moves but lacks depth or makes minor conceptual errors.

  | Analytical Move | Marks | A-Level Performance (4) | B-Level Performance (3) | Typical Mistake (Costs Points) |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Formulating the Regress** | 4 | Clearly generates the infinite series specifically for the triadic case (relation needing connection to 3 terms). | States the general regress but applies it loosely to the specific 'A gives B to C' case. | Treating the regress as merely about "connection" without specifying the need for further relations between relation and terms. |
  | **2. Explaining Russell's Halt** | 4 | Accurately defines external relations as self-connecting constituents that require no further unifier. | States Russell rejects the regress but fails to explain *why* (the ontological status of the fact). | Claiming Russell denies relations exist, rather than claiming they exist externally without further ties. |
  | **3. Isolating Asymmetry** | 4 | Explicitly identifies the difference between 'A gives B to C' and 'C gives B to A' as the core problem. | Mentions order matters but does not distinguish the specific role reversal clearly. | Confusing asymmetry with simple difference in terms (e.g., A vs C) rather than structural directionality. |
  | **4. Evaluating the Relocated Problem** | 4 | Analyzes whether assigning roles requires a further relation, restarting the regress. | Notes the problem exists but does not trace whether it restarts the regress specifically. | Asserting directionality solves the problem without analyzing if *it* requires a connector. |
  | **5. Final Verdict on Unity** | 4 | Provides a nuanced conclusion on whether unity is secured or merely assumed (brute fact). | Concludes definitively without acknowledging the metaphysical cost or remaining vulnerability. | Giving a binary "Yes/No" without qualifying the conditionality of Russell's success. |

  \answer{20}
