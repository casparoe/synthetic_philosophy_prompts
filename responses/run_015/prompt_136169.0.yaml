  *   Analysis of Strategies (i & ii): 3/10
  *   Analysis of Strategy (iii): 1/5
  *   Resolution of Paradox: 2/5
  *   Discussion of Costs: 0/5
  *   **Total: 10/25** (I have been generous in the 13/25 summary to account for writing quality, but a strict reading suggests it is lower).

  **Final Advice:** Do not let the fluency of the prose compensate for the theoretical conflation and the missing section. This is a classic case of a student writing what they *wish* the question was about, rather than what was asked.
