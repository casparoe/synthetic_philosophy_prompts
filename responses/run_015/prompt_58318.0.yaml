  The pattern you describe is a precise and well-documented phenomenon in behavioral economics and the philosophy of action, though the specific *affective neutrality* (the lack of struggle or regret) you observe is a crucial nuance that distinguishes it from common colloquial understandings of weakness.

  The closest established concept is **Sophisticated Time Inconsistency**.

  In behavioral economics (specifically the work of O'Donoghue and Rabin), agents are modeled as having time-inconsistent preferences (valuing immediate rewards disproportionately higher than future rewards, often modeled as *Hyperbolic Discounting*).
  *   **Naive agents** do not realize they will succumb to immediate temptation and are surprised by their future choices.
  *   **Sophisticated agents** accurately predict that their future selves will prioritize immediate gratification over long-term goals.

  Your father fits the **Sophisticated** profile: he knows he will choose the biscuits in the shop, so he asks you to arrange the fruit in advance. However, standard models of sophistication often assume the agent views the immediate choice as a "failure" of self-control. Your father's lack of regret or inner conflict suggests he does not view the local choice as a moral failure, but as a predictable local preference that should be overruled by global planning.

  Because "Time Inconsistency" describes the *valuation curve* and "Sophistication" describes the *awareness*, neither term perfectly captures the *phenomenological stability* and *lack of conflict* you are isolating. There is no single established term that encodes the "no regret" condition as a defining feature. Therefore, to precisely capture the configuration you described—specifically the stable, non-pathological divergence between local choice and global endorsement, managed via pre-commitment—I propose the following coined term.

  **Term:** **Accommodated Intertemporal Divergence**

  **Definition:** A stable psychological pattern in which an agent's immediate, context-specific choices systematically diverge from their reflective, long-term preferences, characterized by the absence of internal conflict, regret, or self-deception, and resolved through voluntary external pre-commitment rather than internal willpower.

  **Distinctions from Neighboring Concepts:**

  1.  **Akrasia (Weakness of Will):**
      *   *Similarity:* Both involve acting against one's better judgment.
      *   *Difference:* Akrasia traditionally implies an inner battle, a sense of failure, or regret ("I shouldn't have done that"). In **Accommodated Intertemporal Divergence**, the agent feels no conflict at the moment of choice and no regret afterward; the divergence is accepted as a structural fact of their psychology, not a moral lapse.
      *   *Boundary Test:* If your father ate the biscuit and then sighed, "I wish I hadn't done that," it would be Akrasia. Since he says, "I want the biscuit now, but stock fruit for next week," it is Divergence.

  2.  **Addiction / Compulsion:**
      *   *Similarity:* Both involve reliable selection of a potentially harmful immediate reward.
      *   *Difference:* Addiction implies a loss of agency or a physiological drive that overrides judgment, often accompanied by denial or inability to plan around it. Your father retains full agency (he plans ahead), has full information (he knows the health effects), and feels no compulsion (no struggle).
      *   *Boundary Test:* If he tried to hide the biscuits from you or became angry when you stocked fruit, it would lean toward Addiction. His request for your help confirms Agency.

  3.  **Naive Time Inconsistency:**
      *   *Similarity:* Both involve choosing immediate rewards over long-term benefits.
      *   *Difference:* A Naive agent believes they will choose the fruit next time ("I'll eat healthy tomorrow") and is surprised when they don't. Your father is *Sophisticated*; he knows he will choose the biscuit and plans accordingly.
      *   *Boundary Test:* If he expressed surprise ("I can't believe I ate those again"), it would be Naive. His lack of surprise confirms Sophistication.

  **Why this fits best:**
  This term captures the *gap* (Divergence), the *time element* (Intertemporal), and the *resolution mechanism/affective state* (Accommodated). It validates your father's experience: he is not "failing" to be consistent; he is successfully managing a stable divergence between his "Local Self" (in the shop) and his "Global Self" (planning the week). The "Advance Booking Test" you mentioned is the definitive diagnostic: only an agent who recognizes this divergence will voluntarily restrict their own future choices to align with their global preferences.

  \answer{Accommodated Intertemporal Divergence}
