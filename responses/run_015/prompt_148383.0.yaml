  2.  **Deconstruct the PBR Theorem (Briefly):**
      *   What does PBR prove? Under specific assumptions (Preparation Independence), it shows that distinct quantum states ($\psi$ and $\phi$) must correspond to non-overlapping distributions over underlying ontic states ($\lambda$).
      *   Implication: If you assume there *is* an underlying reality ($\lambda$) and preparations are independent, then $\psi$ cannot be merely statistical information about $\lambda$ (psi-epistemic). It must be encoded in $\lambda$ itself (psi-ontic).
      *   Loopholes/Assumptions: Preparation Independence is the big one. Also, the existence of $\lambda$ (realism).

