answer: |-
  The sentence "the wavefunction is just information, not reality" is the standard slogan of the $\psi$-epistemic view. The Pusey-Barrett-Rudolph (PBR) theorem was explicitly designed to constrain this view. When a seminar participant waves away PBR with this slogan, they are usually conflating distinct technical claims. To evaluate whether their dismissal is justified, we must disentangle what "information" means in this context.

  Here are the four precise readings of that sentence, evaluated against the PBR theorem.

  ### 1. The Preparation Index (Shannon Information)
  **Claim:** $\psi$ is merely a label indexing the macroscopic preparation procedure (e.g., "laser set to vertical"). It carries Shannon information about the settings of the apparatus.
  *   **Triviality:** High. Everyone agrees $\psi$ correlates with preparation.
  *   **Compatibility with PBR:** **Incompatible with the slogan's intent.** PBR proves that if preparation procedures are independent, distinct $\psi$ states must correspond to *disjoint* distributions over ontic reality ($\lambda$). If $\psi$ is "just" a label for the preparation, PBR shows that this label uniquely determines the physical state (up to the disjoint support). This collapses into a $\psi$-ontic view.
  *   **Survival:** **Fails.** This reading cannot support the claim that $\psi$ is *merely* information in the sense of being compatible with multiple underlying realities. PBR forces the information to be "about reality" in a one-to-one way.

  ### 2. The Spekkens-Style Epistemic Restriction
  **Claim:** There is an underlying objective reality ($\lambda$), but $\psi$ represents an agent's incomplete knowledge of it. Distinct $\psi$ states correspond to overlapping probability distributions over $\lambda$.
  *   **Triviality:** Low. This is a substantive physical hypothesis.
  *   **Compatibility with PBR:** **Directly Incompatible.** This is the exact model class PBR rules out. PBR demonstrates that for non-orthogonal states, the distributions over $\lambda$ cannot overlap, provided the **Preparation Independence** assumption holds (i.e., systems prepared independently have independent ontic states).
  *   **Survival:** **Conditional.** This reading survives *only* if one rejects Preparation Independence. This requires accepting that independently prepared systems share hidden correlations (a form of holism or "conspiracy"). While logically possible, it is a heavy metaphysical cost, not a casual wave-away.

  ### 3. The Refusal of Metaphysical Commitment (Instrumentalism)
  **Claim:** Talk of "reality" ($\lambda$) is meaningless. Quantum mechanics is only a tool for predicting measurement outcomes. There is no fact of the matter about what exists between preparations and measurements.
  *   **Triviality:** Moderate. It is a coherent philosophical stance but scientifically deflationary.
  *   **Compatibility with PBR:** **Compatible (by exemption).** PBR is a no-go theorem for *ontological models*. If you deny the existence of the ontic state $\lambda$, the theorem's premises do not apply.
  *   **Survival:** **Trivial.** This survives PBR only by opting out of the game. It renders the slogan "not reality" true by definition, but it offers no positive account of what the information *is*. It is often used as a conversation-stopper rather than an explanation.

  ### 4. The Bayesian Credence (QBist/Neo-Copenhagen)
  **Claim:** $\psi$ represents an agent's subjective degrees of belief (credences) regarding future measurement experiences. It is normative (how one *should* bet) rather than descriptive (how the world *is*).
  *   **Triviality:** Low. This is a robust interpretive framework.
  *   **Compatibility with PBR:** **Compatible.** Like instrumentalism, this rejects the objective $\lambda$ required by PBR. However, unlike bare instrumentalism, it provides a positive definition of "information" (decision-theoretic expectations).
  *   **Survival:** **Strong.** PBR assumes an observer-independent ontology. The Bayesian reading denies this premise. It does not need to deny Preparation Independence (since there are no independent $\lambda$s to correlate); it simply asserts that $\psi$ belongs to the agent, not the system.

  ### Committed Position

  The seminar participant's wave-away was likely sloppy, but we can salvage the insight.

  The **Preparation Index** reading is trivial and effectively conceded by PBR. The **Spekkens-Style** reading is the one the speaker likely *intended* (a realist epistemic view), but they are wrong to dismiss PBR so casually; saving this view requires a serious argument against Preparation Independence, which implies significant non-locality or holism in preparation devices. That is not a "wave away"; it is a research program.

  The **Refusal of Metaphysical Commitment** is the most common defense, but it is intellectually empty. It protects the slogan by rendering it unfalsifiable, but it abandons the goal of understanding quantum mechanics as a theory of the world.

  The **Bayesian Credence** reading is the strongest. It is the only interpretation that gives the word "information" a precise, positive definition (subjective probability) without requiring the ad-hoc loopholes of the Spekkens view or the deflationism of instrumentalism. It treats PBR not as a false theorem, but as a category error: PBR proves $\psi$ is ontic *relative to an underlying reality*, but the Bayesian denies that $\psi$ is trying to describe an underlying reality at all. It transforms the slogan from a claim about hidden variables (which PBR crushes) into a claim about decision theory (which PBR doesn't touch).

  If you want to say "$\psi$ is information" and mean something coherent that survives PBR without fine-tuning, you must mean it in the Bayesian sense.

  \answer{The Bayesian Credence Reading}
