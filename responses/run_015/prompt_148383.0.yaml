      *   **Reading 1: Shannon Information about Preparation Procedures.**
          *   *Meaning:* $\psi$ indexes the macroscopic settings used to prepare the system.
          *   *PBR Impact:* PBR assumes distinct preparations correspond to distinct $\psi$. If $\psi$ is just a label for the knob settings, PBR says those knob settings must map to disjoint physical states.
          *   *Verdict:* This is compatible with PBR if you accept the ontic state carries the info. But if "just information" means "doesn't constrain the physical state uniquely," PBR kills it (under Preparation Independence).
          *   *Status:* Vulnerable to PBR.

      *   **Reading 2: Bayesian Credence (QBism/Neo-Copenhagen).**
          *   *Meaning:* $\psi$ represents an agent's degrees of belief about future measurement outcomes. It's subjective.
          *   *PBR Impact:* PBR assumes an objective ontic state $\lambda$ exists independently of the agent. QBism rejects the premise of PBR (realism about $\lambda$).
