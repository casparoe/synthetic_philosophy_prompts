      *   *Causal Inference:* Requires ceteris paribus (all else being equal) or at least "similar enough" background conditions to isolate the variable of interest.
      *   *The Chemist's Intuition:* In the lab, if I change the solvent *and* the temperature *and* the catalyst, I can't say which caused the yield difference. In history, almost everything changes between Britain and China.

  3.  **Address the "Pond Analogy":**
