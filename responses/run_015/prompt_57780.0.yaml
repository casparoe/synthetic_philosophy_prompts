answer: |-
  It is a pleasure to address a colleague who understands that the validity of an answer depends fundamentally on the validity of the question. Your intuition from the laboratory is sound: in experimental science, a contrastive question ("Why did reaction $A$ proceed faster than reaction $B$?") is only meaningful if $A$ and $B$ are instances of the same protocol, differing only in the variable under investigation. If the solvent, temperature, and vessel geometry all change simultaneously, the question is ill-posed because the "difference-maker" cannot be isolated.

  In history, and particularly in economic history, this methodological constraint is often relaxed, leading to what philosophers of science call **explanatory overreach**. Below is a conceptual breakdown of when a historical contrast is well-posed, using your pond analogy and applying it to the Britain-China divergence.

  ### 1. The Logic of Contrastive Explanation

  In the philosophy of science (notably in the work of Bas van Fraassen and Peter Lipton), a why-question is inherently contrastive. We rarely ask "Why $P$?"; we ask "Why $P$ *rather than* $Q$?"

  For this question to be **well-posed**, two conditions must be met:

  1.  **Shared Contrast Class:** $P$ and $Q$ must belong to the same category of events. (e.g., "Why did this liquid freeze?" vs. "Why did this liquid boil?" is a question about phase boundaries; "Why did this liquid freeze but that one didn't?" is a question about specific conditions).
  2.  **Presupposed Background Commonality:** There must be a stable set of background conditions ($C$) assumed to be identical for both cases. We are looking for a variable $V$ such that $(C + V_1) \rightarrow P$ and $(C + V_2) \rightarrow Q$.

  If the background conditions $C$ are not shared—if the fundamental laws or boundary conditions differ—the question dissolves. You are no longer asking for a *cause* within a system; you are asking for a *description* of two different systems.

  ### 2. The Pond Analogy

  Let us apply this to your homely analogy: Two ponds, $X$ and $Y$. Pond $X$ freezes on December 1st; Pond $Y$ freezes on December 8th.

  **Case 1: Well-Posed (Same Apparatus)**
  *   **Conditions:** Both ponds are in the same valley, at the same altitude, fed by the same aquifer, of similar depth and surface area.
  *   **Background Commonality:** Regional climate, water chemistry, elevation.
  *   **The Question:** "Why did $X$ freeze before $Y$?"
  *   **The Explanation:** We look for a local difference-maker. Perhaps a tree shades $Y$ but not $X$, or $X$ has less surface turbulence. The "apparatus" (the valley system) is the same; the "sample conditions" differ slightly.

  **Case 2: Ill-Posed (Different Apparatus)**
  *   **Conditions:** Pond $X$ is a shallow alpine tarn in the Alps. Pond $Y$ is a deep geothermal lake in Iceland.
  *   **Background Commonality:** None, other than both containing water.
  *   **The Question:** "Why did $X$ freeze before $Y$?"
  *   **The Verdict:** This question is methodologically suspect. It implies there is a single "freezing process" that happened to go differently. In reality, you are comparing two distinct thermodynamic systems governed by different boundary conditions (latitude, geothermal heat, depth). To answer, you must essentially write two separate natural histories. The "difference" is not a variable; it is the system definition itself.

  ### 3. Britain vs. China: The Contrast Class Problem

  Now we turn to the Great Divergence. The methodological validity depends entirely on whether Britain and China are "ponds in the same valley" or "ponds in different worlds."

  **The "California School" View (Well-Posed)**
  Historians like Kenneth Pomeranz argue that as late as 1750, the Yangtze Delta and England were **instances of the same kind of system**.
  *   **Background Commonality:** Similar life expectancy, similar market mechanisms, similar agricultural productivity, similar constraints on energy (organic economies).
  *   **The Contrast:** Why did the Yangtze Delta not industrialize while England did?
  *   **Methodological Status:** **Well-posed.** If the premise holds, we are looking for specific "difference-makers" (e.g., access to coal, access to New World colonies, specific institutional quirks) within a shared baseline of development. This treats the two regions as two samples in the same apparatus.

  **The "Long-Term Trajectory" View (Ill-Posed)**
  Other historians argue that Europe and China were on fundamentally different trajectories centuries before 1800.
  *   **Background Commonality:** Weak. Differences in state structure, property rights, scientific culture, and geopolitical fragmentation existed since the Middle Ages.
  *   **The Contrast:** Why did Europe industrialize and China did not?
  *   **Methodological Status:** **Ill-posed (or at least coarse).** If the systems diverged in 1400, asking about 1800 is like asking why the alpine pond froze before the geothermal one in December, ignoring that one was geothermal to begin with. The "difference-maker" is not a variable in 1800; it is the boundary condition set centuries prior.

  ### 4. The Problem of Grain (Time and Space)

  You asked how temporal and geographic grain changes the question. In experimental terms, this is the **resolution of measurement**.

  *   **Temporal Grain:**
      *   *Fine Grain (1750–1850):* Focuses on the "take-off." This assumes the starting line was the same. It privileges contingent factors (coal, cotton, policy).
      *   *Coarse Grain (1500–1800):* Focuses on the "approach." This reveals that the starting line was not the same. It privileges structural factors (state capacity, culture, law).
      *   *Methodological Implication:* A question well-posed at a fine grain may become ill-posed at a coarse grain because the "background commonality" vanishes as you zoom out.

  *   **Geographic Grain:**
      *   *Britain vs. China:* This compares a small island nation to a continental empire. The scaling laws are different. A shock to the British economy affects the whole system; a shock to the Yangtze Delta might be absorbed by the interior.
      *   *Britain vs. Yangtze Delta:* This is a better control. It matches a core economic region against a core economic region.
      *   *Europe vs. China:* This compares a fragmented competitive system (multiple states) against a unified imperial system. This changes the "apparatus" from a competitive market of states to a monopoly of states.

  **Verdict:** The question is most well-posed when comparing the **Yangtze Delta to Britain** around **1750**. Comparing "China" to "Europe" over "five centuries" risks comparing different apparatuses.

  ### 5. Acceleration vs. Absence (Logical Form)

  You asked if the two problems ("Why Britain?" vs. "Why not China?") have the same logical form.

  *   **"Why Britain?" (Acceleration):** This presupposes that industrialization is the expected outcome (or at least a possible one) and asks what *positive* force drove it. It looks for a "push."
  *   **"Why not China?" (Absence/Delay):** This presupposes that China *should* have industrialized (given its early lead) and asks what *negative* force prevented it. It looks for a "block."

  **Methodological Trap:** This framing often smuggles in a normative assumption that industrialization is the natural telos (end goal) of economic development. In chemistry, if a reaction does not occur, we do not always ask "what inhibited it?"; sometimes the activation energy was simply never reached, and the "default" state is non-reaction.

  If we treat the pre-industrial state as the baseline (thermodynamic equilibrium), then Britain is the anomaly requiring explanation (energy input), and China is the control group (remaining in equilibrium). If we treat the "Smithian Growth" (market expansion) as the baseline, then both should have industrialized, and we have two anomalies: one that succeeded and one that failed.

  The logical form is identical only if we assume a **single universal process** of development that all societies undergo. If development is **path-dependent** (multiple equilibria), then "Why not China?" is a category error. It assumes China was on the same path and stumbled, rather than being on a different path entirely.

  ### 6. Same Apparatus or Different Apparatus?

  To use your laboratory metaphor: Is treating Britain and China as two trials of the same process like comparing two samples in one apparatus, or results from two quite different apparatuses?

  **The Evidence Suggests: Different Apparatuses.**

  1.  **Geopolitical Structure:** Europe was a polycentric system of competing states (a competitive market of jurisdictions). China was a unified imperial monopoly. This is not a variable; it is a difference in the vessel geometry. In a competitive system, innovation in one state forces adoption in others. In a unified system, a ban by the Emperor stops innovation everywhere.
  2.  **Energy Constraints:** Britain had coal located near water transport. China's coal was in the north, while its economic center was in the south. This is a difference in boundary conditions (resource distribution).
  3.  **Knowledge Systems:** The European scientific revolution institutionalized a specific method of interrogating nature that was not present in the Chinese examination system. This is a difference in the "operating software."

  **Conclusion on the Analogy:**
  Comparing Britain and China is less like comparing two beakers in the same fume hood, and more like comparing a reaction in an open beaker (Europe/competition) to a reaction in a sealed autoclave (China/unity).

  ### 7. Summary: When is the Question Well-Posed?

  To return to your core perplexity: The question "Why Britain and not China?" is **heuristically useful but methodologically loose.**

  It is **well-posed** only if:
  1.  You restrict the spatial grain to core economic regions (Yangtze vs. England).
  2.  You restrict the temporal grain to the moment of divergence (1750–1850).
  3.  You accept the premise that both regions were in a similar "meta-stable" state prior to that moment.

  It becomes **ill-posed** if:
  1.  You treat "China" and "Europe" as unitary actors without internal variation.
  2.  You assume a single universal path of development (implying China "failed" rather than "differed").
  3.  You ignore the deep structural differences in state formation that make the "systems" fundamentally different.

  **Final Advice for the Retired Chemist:**
  When reading this literature, treat the "Britain vs. China" contrast not as a controlled experiment, but as a **comparative case study**. In a controlled experiment, you isolate variables. In a comparative case study, you acknowledge that *all* variables change, and you attempt to construct a narrative that accounts for the configuration of the whole system.

  The pond analogy holds: If you find that the ponds are in different valleys with different geologies, stop asking why one froze faster. Start asking how the geology of each valley determines its freezing point. The shift is from seeking a *cause* (a difference-maker) to seeking a *configuration* (a system description).
