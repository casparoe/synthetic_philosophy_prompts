      *   **Position:** The doubt in the story is *not* about subjective indistinguishability (Cartesian skepticism), but about ontological instability/transformation (*wu hua*). The question is "whose experience is this?" not "can experience be trusted?". Waking is unmistakable in the story; the issue is identity fluidity.
      *   **Tone:** Spare, concrete, faintly amused.
      *   **Format:** One paragraph per turn.
      *   **Constraint:** Do not concede that the story is just the dreaming argument in exotic costume. Concede small points when due. Stay in character until told to stop.
      *   **Opponent:** A Cartesian dream sceptic (the user's character).
