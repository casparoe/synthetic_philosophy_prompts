answer: |-
  This is a sharp cut into the meta-problem. You're essentially asking if the Phenomenal Concept Strategy (PCS) can do enough heavy lifting to bridge the explanatory gap without collapsing into property dualism, especially when viewed through a dual-aspect lens (where the concept is physically realized but epistemically unique).

  The "mashup" you're describing is effectively the non-reductive physicalist's last stand: admit the concepts are distinct and epistemically isolated (to save the intuition), but insist the referent is identical (to save the ontology).

  Here is my decomposition of the credences, based on the current dialectical strength of these positions in the literature. I am calculating the probability that **Mary learns something ontologically new** (i.e., Physicalism is False).

  ### The Decomposition

  To arrive at "Ontological Newness," we need the Physicalist defenses to *fail*. Here is how the probabilities map:

  **(a) Prob phenomenal concepts exist and are conceptually distinct from physical ones: 0.95**
  *   **Justification:** This is the strongest link. Almost no one denies that the *mode of presentation* for "red experience" differs from "700nm wavelength." Even hardline physicalists grant this epistemic distinctness. Denying this requires an eliminativism about introspection that most find untenable.
  *   **Role:** Necessary condition for the argument to start.

  **(b) Prob that distinctness is stable without entailing physicalism is false: 0.45**
  *   **Justification:** This is the core PCS claim (that distinct concepts can refer to the same property without magic). I am assigning a <0.5 probability here because the "thick" vs. "thin" concept debate is unresolved. Critics (Chalmers, Alter) argue PCS explains the *existence* of the gap by presupposing the very phenomenal concepts that need explaining, risking circularity. If the distinctness is robust enough to explain Mary's surprise, it often feels robust enough to imply distinct properties.
  *   **Role:** If this is **False** (prob 0.55), Physicalism is in trouble. If **True** (prob 0.45), Physicalism survives.

  **(c) Prob Mary's learning is conceptual acquisition rather than just gaining an ability: 0.85**
  *   **Justification:** The "Ability Hypothesis" (Lewis/Nemirow) has largely fallen out of favor. Mary seems to gain propositional knowledge ("*This* is what it is like"), not just a skill. If she only gained ability, the ontological threat vanishes. Since she likely gains a concept, the pressure on (b) increases.
  *   **Role:** High probability here keeps the pressure on Physicalism.

  **(d) Prob the reverse-Mary case undermines the original argument instead of just being symmetric: 0.60**
  *   **Justification:** The "Reverse Mary" (someone who knows experiences but not physics) is a strong symmetry test. If she also learns something new upon seeing the physics, it suggests a mere epistemic gap. However, the symmetry isn't perfect: physical concepts are structural/functional, while phenomenal concepts are often argued to be direct/non-structural. This asymmetry weakens the undermining force slightly, but the symmetry intuition remains strong.
  *   **Role:** If this is **True** (prob 0.60), the original argument is undermined (Physicalism survives). If **False** (prob 0.40), the original argument stands.

  ### The Calculation

  To get the probability of **Ontological Newness** (Physicalism is False), we need:
  1.  Concepts to be distinct (a) **AND**
  2.  PCS to *fail* to reconcile them (Not b) **AND**
  3.  Learning to be conceptual (c) **AND**
  4.  Reverse Mary to *fail* to undermine (Not d)

  $$P(\text{Ontological}) = P(a) \times [1 - P(b)] \times P(c) \times [1 - P(d)]$$

  $$P(\text{Ontological}) = 0.95 \times (1 - 0.45) \times 0.85 \times (1 - 0.60)$$

  $$P(\text{Ontological}) = 0.95 \times 0.55 \times 0.85 \times 0.40$$

  $$P(\text{Ontological}) \approx \mathbf{0.178}$$

  ### The Verdict

  **My Credence: ~18%**

  This is lower than your 0.35, but not dismissively so. The gap between 18% and 35% lives almost entirely in variable **(b)**.

  If you believe the PCS is merely a label for the mystery rather than a solution (which many skeptics do), you would lower $P(b)$ to something like 0.25.
  *   *Recalculation with skeptical PCS:* $0.95 \times 0.75 \times 0.85 \times 0.40 \approx \mathbf{0.24}$.

  If you also think Reverse Mary isn't truly symmetric (because physics is structural and qualia aren't), you might lower $P(d)$ to 0.40.
  *   *Recalculation with asymmetric Reverse Mary:* $0.95 \times 0.75 \times 0.85 \times 0.60 \approx \mathbf{0.36}$.

  **There is your 0.35.** It requires being skeptical of the PCS's explanatory power and skeptical of the Reverse Mary symmetry.

  ### The Shakiest Link: Factor (b)

  **Factor (b) is the bottleneck.**
  Whether conceptual distinctness can remain "stable" without implying ontological distinctness is the entire war.
  *   **Physicalists** argue: Concepts are tools; different tools don't mean different objects (e.g., "Morning Star" vs. "Evening Star").
  *   **Anti-Physicalists** argue: Phenomenal concepts are *constituted* by the experience itself, whereas physical concepts are contingent descriptions. This constitutive relationship makes the gap deeper than standard Fregean cases.

  If you are "tired of physicalist apologetics," it is likely because (b) often feels like a promissory note. Physicalists assert the gap is epistemic, but struggle to explain *why* the epistemic gap is so rigid and universal without appealing to an underlying ontological difference.

  ### On the "Dual-Aspect" Mashup
  You mentioned mashing PCS with **Dual-Aspect**. Be careful here: if you embrace a genuine Dual-Aspect Monism (Russellian Monism), you have arguably already conceded that standard Physicalism is false. You've saved "Monism" but sacrificed "Physicalism" (defined as everything being exhaustively described by physical science).

  If your 0.35 credence in an "ontological gap" is actually a 0.35 credence in **Russellian Monism**, that is a very defensible position. It accepts (a) and (c), rejects the sufficiency of (b) for standard physicalism, and treats the "ontological newness" as the intrinsic nature of the physical, rather than a spooky ectoplasm.

  **Summary:** Your intuition isn't wrong; it just hinges on how much explanatory weight you think the Phenomenal Concept Strategy can actually carry. If you think it's a shell game, your 0.35 is well-calibrated. If you think it's a viable Fregean solution, the number drops toward 0.15.
