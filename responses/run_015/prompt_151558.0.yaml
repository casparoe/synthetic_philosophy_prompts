  ### The Principle of Non-Delegable Normative Authorship

  **Statement of Principle:**
  > An agent acts authentically only if they acknowledge that while **facticity** (orders, code, roles, physical limits) constrains the *causal outcomes* of their actions, it never determines the *normative meaning* or *responsibility* for those outcomes; **bad faith** occurs when an agent treats a contingent fact (a command, a tool, an identity, or a system's opacity) as an **essence** that compels their choice or absorbs their authorship, thereby denying their freedom to assign meaning to the constraint.

  **Clause Breakdown and Case Motivation:**

  1.  **The Causality vs. Meaning Distinction:**
      *   *Clause:* Facticity constrains outcomes but does not determine meaning.
      *   *Motivation:* **Case 1 & Case 3.** In Case 1, the CTO's order is a fact (threat of firing), but the engineer treats it as a determination of meaning ("no choice"). In Case 3, the dataset is a fact, but the engineer treats it as the author ("the model decided"). The principle asserts that the causal chain (order → deployment, data → output) exists, but the *endorsement* of that chain is a separate, free act.

  2.  **The Ownership of Cost:**
      *   *Clause:* Authenticity requires owning the cost of the meaning one assigns.
      *   *Motivation:* **Case 2 & Case 5.** In Case 2, the engineer pays the cost of unemployment to sustain the meaning "integrity." In Case 5, the engineer pays the cost of poverty to sustain the meaning "privacy." Both integrate facticity (loss of security) with transcendence (chosen project).

  3.  **The Opacity Prohibition:**
      *   *Clause:* Systemic unpredictability (opacity) cannot be used to sever normative authorship.
      *   *Motivation:* **Case 4 & Case 6.** Both involve lethal autonomous systems where specific outcomes are unpredictable. The principle dictates that one cannot use this opacity to disown the lethal potential (Case 4), but one also cannot claim to control the uncontrollable without acknowledging the risk as a chosen burden (Case 6).

  **Prediction for the Unlisted Case (Patriotic Soldier Engineer):**
  *   **Verdict:** **Bad Faith.**
