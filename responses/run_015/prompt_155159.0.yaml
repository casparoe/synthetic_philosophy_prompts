answer: |-
  ### Scratchpad: Candidate Branch Questions

  1.  *"Do you accept the Axiom of Choice?"*
      *   **Separates:** Mathematicians from non-mathematicians.
      *   **Failure:** Too technical; ethical views shouldn't hinge on set-theoretic axioms unless explicitly formulated in them. Insensitive to ethical intuition.
  2.  *"Is total welfare the only thing that matters?"*
      *   **Separates:** Totalists from non-totalists.
      *   **Failure:** Too close to a label; students may not know how "totalism" behaves with infinite sums. Ambiguous between averaging and summing.
  3.  *"Does time have a beginning?"*
      *   **Separates:** Finite past vs. infinite past.
      *   **Failure:** Metaphysical rather than ethical; every position could answer either way depending on cosmological models. Insensitive to the normative problem.

  ***

  ### The Infinite Ethics Decision Tree

  **Start:** You accept some possible outcomes contain infinitely many lives, or lives of infinite duration, and this is not a reason to stop doing ethics.

  **Node 1 (Shape):** Are you comparing worlds with **infinitely many lives** (each finite value) or **finitely many lives** (each infinite value)?
  *Gloss:* Infinite number = countably many people; Infinite magnitude = one person with utility ∞.

  **Node 2 (Order):** Consider a hotel with countably many rooms, all occupied. In World A, the first infinitely many occupants are ecstatic and the remaining infinitely many are in mild suffering. In World B, the same lives are interleaved so every ecstatic life is followed by a suffering life. **Does rearranging the lives change the world's value?**
  *Gloss:* Same multiset of lives, different spatial/temporal arrangement.

  **Node 3 (Summation):** Consider a single infinite sequence of lives whose well-being levels form a series that converges, but only conditionally. **Does this world have a determinate total value?**
  *Gloss:* Partial sums approach a finite limit in one ordering, and can be rearranged to approach any real value at all.

  **Node 4 (Measure):** Consider two worlds with the same cardinality of good lives and the same cardinality of bad lives. In World A, the proportion of good lives tends to a half; in World B, it tends to one. **Are these worlds equally good?**
  *Gloss:* Cardinality says the worlds are the same size; limiting relative frequency says they are not.

  **Node 5 (Finite Addition):** Consider a world of pure bliss to which exactly one further life of mild suffering is added. **Is the new world worse?**
  *Gloss:* Tests whether finite differences still register against an infinite background.

  **Node 6 (Risk):** Consider a choice between a certainty of a small finite good and an extremely small probability of changing the welfare of infinitely many lives. **Does the infinite possibility dominate the choice?**
  *Gloss:* Expected-value calculation either diverges or depends on a convention for multiplying an infinitesimal by an infinite magnitude.

  **Node 7 (Applicability):** **Are any of these comparisons fundamentally undefined?**
  *Gloss:* Tests whether the formal machinery breaks down entirely.

  ***

  ### Leaves: Positions and Commitments

  1.  **Nihilism (Node 7: Yes):** Ethics has no application to infinite comparisons; only finite ones are evaluable.
      *   *Awkward Commitment:* We must ignore the infinite consequences of our actions even if they exist.
  2.  **Infinite Dominance (Node 6: Yes):** Infinite stakes always dominate finite ones, however improbable.
      *   *Awkward Commitment:* A tiny chance of heaven outweighs certain hell for everyone else.
  3.  **Non-Archimedean View (Node 1: Magnitude, Node 5: Yes):** Total welfare should be represented in a non-Archimedean ordered structure so that finite differences still register against an infinite background.
      *   *Awkward Commitment:* Requires hyperreal numbers unfamiliar to standard math.
  4.  **Anti-Aggregative View (Node 3: No, Node 5: No):** Adding good lives to an already good world changes nothing.
      *   *Awkward Commitment:* Creating infinite bliss is no better than creating nothing.
  5.  **Person-Affecting Restriction (Node 5: Yes, restricted):** A person-affecting restriction survives into the infinite case.
      *   *Awkward Commitment:* Hard to define "harm" without fixed identities across worlds.
  6.  **Density View (Node 4: Not Equal):** A view that compares worlds by limiting relative frequency or density rather than by cardinality.
      *   *Awkward Commitment:* Value depends on arbitrary ordering of enumeration.
  7.  **Cardinality View (Node 4: Equal):** Worlds are compared solely by the cardinality of good/bad lives.
      *   *Awkward Commitment:* 50% good lives equals 100% good lives if both are infinite.
  8.  **Order-Sensitive View (Node 2: Yes):** A position that is sensitive to the location or ordering of lives within the structure of the world.
      *   *Awkward Commitment:* Moral value depends on spatial seating arrangements.
  9.  **Paralysis View (Node 3: No, Node 5: Yes):** The presence of infinite value renders ordinary comparisons undefined and leaves us practically paralysed.
      *   *Awkward Commitment:* We know changes matter but cannot compare outcomes.
  10. **Unnamed (Coherent):** (Node 1: Magnitude, Node 5: No).
      *   *Diagnosis:* Coherent but unexplored; defender must show why finite additions vanish without risk dominance.
  11. **Unnamed (Incoherent):** (Node 2: Yes, Node 4: Cardinality).
      *   *Diagnosis:* Incoherent; order matters for value but density does not.
  12. **Unnamed (Unattractive):** (Node 6: No, Node 1: Magnitude).
      *   *Diagnosis:* Merely unattractive; ignores infinite stakes in decision theory.

  *Note:* **Non-Archimedean** and **Finite Addition Sensitivity** travel together here; the tree cannot pull them apart without deeper algebraic questions.

  ***

  ### Scoring Sheet & Instructor Notes

  **Scoring Key:**
  *   **Nihilism:** Node 7 = Yes.
  *   **Infinite Dominance:** Node 6 = Yes.
  *   **Non-Archimedean:** Node 1 = Magnitude, Node 5 = Yes.
  *   **Anti-Aggregative:** Node 3 = No, Node 5 = No.
  *   **Person-Affecting:** Node 5 = Yes (with identity caveat).
  *   **Density View:** Node 4 = Not Equal.
  *   **Cardinality View:** Node 4 = Equal.
  *   **Order-Sensitive:** Node 2 = Yes.
  *   **Paralysis:** Node 3 = No, Node 5 = Yes.
  *   **Unnamed Leaves:** Match remaining combinations (10, 11, 12).

  **What Will Go Wrong:**
  In a sixty-minute session, students will misread **Node 3 (Summation)** as a math test rather than a normative question about whether structure determines value. Many will answer **Node 6 (Risk)** strategically to avoid the "Pascal's Wager" leaf, masking their true view on expected value. Finally, the tree cannot reproduce the **topological nuances** of infinite utility spaces; you must supply in discussion how "closeness" of worlds affects continuity in choice. The distinction between **Infinite Number** and **Infinite Magnitude** (Node 1) will collapse for students lacking set theory; be prepared to draw the bijection vs. value distinction on the board.
