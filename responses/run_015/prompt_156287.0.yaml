  **INTERGOVERNMENTAL OFFICE FOR ATROCITY ASSESSMENT (IOAA)**
  **REQUEST FOR PROPOSALS (RFP-2024-CSI)**
  **SUBJECT: DEVELOPMENT OF THE COMPARATIVE SEVERITY INDEX**

  **1.0 SCOPE OF WORK**
  The Intergovernmental Office for Atrocity Assessment (IOAA) invites qualified contractors to design and populate the Comparative Severity Index (CSI). The CSI shall assign a single scalar value to each registered historical atrocity (hereinafter "Event"). This Index will serve as the primary sorting mechanism for museum exhibits, school curricula, and reparations commissions. The contractor must ensure the Index produces a strict ordinal ranking without ties, except where resolved via Section 2.4.

  **2.0 MANDATORY METHODOLOGY**
  Contractors must adhere to the following metrological standards:

  **2.1 Unit of Measurement**
  Severity shall be quantified using the Substitution Rate (SR). The SR is defined as the number of Standard Famine-Years (SFY) an informed jury would accept in exchange for averting the Event. Contractors must treat the SR as an objective physical measurement, not a aggregation of moral preferences. Variance in jury composition must be normalized to within 0.05 SFY.

  **2.2 Denominator Standardization**
  To address visibility disparities, Contractors may utilize the Per-Target-Population Density (PTPD) metric. Under this option, an Event eliminating 90% of a small population may outrank an Event with higher absolute mortality but lower population penetration. The IOAA remains neutral regarding which metric better reflects moral gravity.

  **2.3 Downstream Effects**
  Calculations must include the Counterfactual Demographic Deficit (unborn children), diaspora fragmentation costs, and secondary famine conditions occurring within ten years of the Event. Multi-generational trauma shall be discounted at a rate of 3% per annum.

  **2.4 Saturation and Tie-Breaking**
  Where Events reach severity saturation (SR > 5000 SFY), ties shall be broken using the Administrative Efficiency Ratio (AER). The AER is calculated as deaths per bureaucrat-hour and killings per unit of expenditure. Higher efficiency indicates greater organizational commitment and shall result in a higher severity ranking.

  **2.5 Intent vs. Completion**
  Interrupted Atrocities (Events halted by external intervention) shall receive full credit for documented intent. An Event stopped at 50% completion may outrank a completed Event if the planning documentation demonstrates comparable scope.

  **3.0 DELIVERABLES**
  The successful Vendor shall provide:
  3.1 A searchable database containing all registered Events (e.g., Event 14 [steppe famine, 1930s], Event 22 [coastal purge, 1970s]).
  3.2 The algorithmic source code used to calculate SR and AER.
  3.3 A draft league table displaying the top 50 ranked Events.

  **4.0 EVALUATION CRITERIA**
  Contracts will be awarded to the lowest compliant bid. Technical proposals must demonstrate capacity to handle incommensurable data sets without logical recursion. Previous experience with sovereign risk assessment is preferred.

  **5.0 QUESTIONS FROM BIDDERS**

  **Q1:** Regarding Section 2.1, can the "informed jury" include survivors of the Event in question?
  **A1:** Jury selection is at the Vendor's discretion, provided conflict of interest disclosures are filed. Note that survivor testimony often introduces variance exceeding the 0.05 SFY tolerance.

  **Q2:** Does the deliverable require the Vendor to publish the full table including classifications for the Vendor's own host government?
  **A2:** All data points are subject to the same verification protocols. Sovereign data submissions are processed via standard channels. The IOAA does not comment on pending classifications during the procurement period.

  **Q3:** If the Administrative Efficiency Ratio favors an Event with superior logistics, does this imply commendation?
  **A3:** The AER is a neutral sorting variable. It indicates capacity, not virtue.

  **SUBMISSION DEADLINE:** 1700 Hours EST, 30 November 2024.
  **POINT OF CONTACT:** Procurement Division, IOAA Geneva.
