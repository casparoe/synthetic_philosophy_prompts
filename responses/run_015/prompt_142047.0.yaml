answer: |-
  This is a classic "unwritten rules vs. written policy" conflict, exacerbated by a transatlantic cultural fault line. You are correct that you cannot draft consistent guidelines until you decode the Chair's decision matrix. If you write guidelines based on standard American "High Performance" norms, she will veto every case. If you write them based on strict Scandinavian "Jantelagen" norms, the Austin office will revolt.

  Based on the seven data points you provided, the Chair is not operating on a simple "Anti-Achievement" or "Pro-Team" axis. She is operating on a specific philosophical framework that I would call **Instrumental Collectivism.**

  Here is the breakdown of her algorithm, how it applies to your current case, and how to draft guidelines that survive her review without alienating the Austin team.

  ### 1. Decoding the Chair's Algorithm

  You hypothesized two questions: *Is she creditworthy?* and *Should credit be public?*
  The Chair's track record suggests she actually asks three different questions, in this order:

  1.  **Attribution Accuracy:** Did this person actually generate the value, or are they claiming credit for luck/teamwork/others' ideas?
      *   *Evidence:* Hackathon winner (private only, idea wasn't his); Designer (nothing, "right place right time"); Salesperson (team, not individual).
  2.  **Replicability/Utility:** Does celebrating this specific behavior make the *rest of the organization* more capable?
      *   *Evidence:* Junior dev (loudly celebrated, "others should copy"); Mentor (celebrated, creates more engineers); Senior Engineer (punished, personal brand doesn't help the team code better).
  3.  **Status vs. Contribution:** Is this recognition elevating the *work* or the *person*?
      *   *Evidence:* Staff Engineer (title deflected, "title is not achievement"); Senior Engineer (mocked for "fan club"); Mentor (celebrated *against* wishes, focusing on the act, not the desire for praise).

  **The Core Philosophy:** Recognition is not a reward for past labor; it is a tool for future organizational behavior modification. If public recognition creates a "Star" (hierarchy) rather than a "Standard" (behavior), she will block it.

  ### 2. The Current Case: Oslo Backend Dev

  **The Facts:**
  *   **Effort:** High (3 years personal time).
  *   **Luck:** Low (sustained maintenance).
  *   **Utility:** High (50% of candidates mention it, major recruiting tool).
  *   **Status Seeking:** High (Requesting Principal title + Profile + earning external income).
  *   **Self-Nomination:** Yes.

  **The Closest Analog:**
  This is a hybrid of the **Senior Engineer (Conferences)** and the **Staff Engineer (Title)** cases, with a dash of the **Salesperson**.

  *   **Like the Senior Engineer:** He has built an external following and "personal brand" (workshops, following). The Chair views this with suspicion (see: "fan club" jokes).
  *   **Like the Staff Engineer:** He is requesting a Title (Principal) as a form of recognition. The Chair has explicitly stated titles are not achievements.
  *   **Unlike the Designer:** This was not luck. It was sustained agency.
  *   **Unlike the Salesperson:** The value is arguably attributable to him (he wrote the library), though it now serves the company.

  **Where the Plausible Rules Break:**
  *   **The "Effort" Rule:** He passes. This wasn't luck.
  *   **The "Replicability" Rule:** He passes. The library is a tool others use; the recruiting benefit is massive.
  *   **The "Status" Rule:** **He fails.** He is asking for a Title and a Profile. He is asking to be elevated *above* the collective.
  *   **The "Reluctance" Rule:** **He fails.** He self-nominated. The Chair prefers to ambush the reluctant (Mentor) rather than reward the askers.

  ### 3. The Decision Matrix

  If you want to be consistent with the Chair's precedents, you cannot simply "Celebrate" or "Deny." You have to split the decision.

  | Component of Request | Precedent | Likely Chair Verdict | Why |
  | :--- | :--- | :--- | :--- |
  | **Public Shoutout** | Junior Dev / Mentor | **YES** | The *artifact* (library) helped the company hire. Celebrate the *library*, not the man. |
  | **Principal Title** | Staff Engineer | **NO** (as a reward) | Titles are levels, not trophies. If he meets the bar, promote him quietly. Do not link the promotion to the OSS work publicly. |
  | **Company Profile** | Senior Engineer | **MODIFY** | A "Hero Profile" is a no-go. A "Maintainer of X" technical bio is acceptable. |
  | **External Income** | (New Variable) | **RISK** | Earning more externally than internally signals divided loyalty. Chair may view this as a conflict, not an achievement. |

  ### 4. Drafting the Guidelines (The "Third Way")

  You need to write guidelines that satisfy the Chair's **Instrumental Collectivism** while sounding like **Meritocracy** to the Austin team.

  **Do not write:** "We celebrate individual achievements."
  **Do write:** "We recognize contributions that elevate the engineering organization's collective capability."

  **Specific Clauses to Include:**

  1.  **Behavior vs. Outcome:**
      *   *Drafting:* "Recognition focuses on reproducible engineering behaviors and artifacts that benefit the wider team, rather than individual status markers or titles."
      *   *Austin Read:* "We reward good work."
      *   *Oslo Read:* "We don't build statues to people."
      *   *Chair Read:* "Perfect. No fan clubs."

  2.  **Attribution & Accuracy:**
      *   *Drafting:* "Public recognition requires clear attribution of agency. Luck-based outcomes or team efforts will not be assigned to single individuals."
      *   *Austin Read:* "Be honest about who did what."
      *   *Oslo Read:* "Don't steal credit."
      *   *Chair Read:* "No 'Right Place Right Time' awards."

  3.  **Self-Nomination:**
      *   *Drafting:* "While self-nominations are accepted for review, priority is given to peer-identified contributions that may otherwise go unnoticed."
      *   *Austin Read:* "You can still ask."
      *   *Oslo Read:* "It's better if others notice you."
      *   *Chair Read:* "I can still ambush the reluctant mentors."

  4.  **External Visibility:**
      *   *Drafting:* "External recognition (conferences, OSS) is celebrated when it directly drives recruiting, brand, or technical capability for the company. Personal branding unrelated to company mission is a private matter."
      *   *Austin Read:* "If it helps the company, you get credit."
      *   *Oslo Read:* "Don't use us as a platform for your fame."
      *   *Chair Read:* "Utility over Ego."

  ### 5. Recommendation for the Specific Case

  If you bring this to the committee with a binary "Yes/No," you will fracture the room. The Austin half will see denying him as punishing success; the Oslo half will see rewarding him as enabling arrogance.

  **The Compromise Proposal:**
  1.  **Grant the Public Celebration:** But frame it strictly around the **Library**, not the **Person**. "The Engineering Team recognizes the adoption of [Library Name] as a key driver in our Q3 hiring success."
  2.  **Decouple the Title:** Process the Principal Engineer request through standard leveling guidelines (HR/CTO), completely separate from this recognition committee. If he qualifies, he gets it, but it is not presented as a *prize* for the OSS work.
  3.  **The Profile:** Allow a profile, but it must be technical ("Author of X") rather than biographical ("Visionary Leader").
  4.  **The Private Conversation:** The Chair (or you) needs to have a private 1:1 with the dev.
      *   *Message:* "We love the library. It's incredibly valuable. However, our recognition philosophy focuses on collective capability. We can celebrate the tool, but we don't celebrate individual rank or external income streams. If you want to be Principal, here are the leveling criteria. If you want to keep doing workshops, that's fine, but we can't publicly highlight income disparity with the company."

  **Why this works:**
  *   **Consistency:** It aligns with the Junior Dev (celebrate the useful behavior) and the Staff Engineer (titles aren't prizes).
  *   **Austin:** The dev gets public credit and a path to Principal.
  *   **Oslo:** The dev isn't crowned "King Engineer," and the focus remains on the tool, not the ego.
  *   **Chair:** It reinforces that recognition is a management tool for organizational good, not a reward for individual ambition.

  **The Risk:**
  The one precedent that threatens this is the **Senior Engineer (Conferences)**. If the Chair views the dev's "workshops and following" as identical to the Senior Engineer's "personal brand," she may veto the public shoutout entirely.
  *   *Counter-argument:* The Senior Engineer was speaking to build a *following*. This Dev built a *library* that accidentally got a following. One is marketing; one is engineering. Lean hard into that distinction in your guidelines.

  **Final Advice:**
  When you draft the document, avoid the word "Achievement." Use the word "Contribution."
  *   "Achievement" implies a finish line and a winner (Austin likes this, Chair hates this).
  *   "Contribution" implies adding to a common pool (Oslo likes this, Chair requires this).
  *   Austin can live with "Contribution" if the contribution is measured rigorously.

  If you anchor the guidelines in **Utility to the Collective**, you give the Chair the control she wants without explicitly telling the Americans they aren't allowed to be proud. You're just telling them *what* to be proud of.
