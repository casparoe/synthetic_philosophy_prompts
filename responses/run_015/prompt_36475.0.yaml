answer: |-
  Right, let's get straight to it. You've grasped the core concept perfectly well: a "Dutch Book" is when your prices contradict each other so badly that a punter can back every outcome (or a clever combination of them) and guarantee a profit regardless of the result. In our trade, we call that "being arbed" or "leaving money on the table," but philosophically, yes, it's incoherence.

  You're also right about the limits of the maths. Probability theory can tell you if your prices are *consistent*, but it cannot tell you if they are *correct*. Whether Haaland is 40% or 50% likely to score is your judgement call based on form, fitness, and gut feeling. The procedure below doesn't tell you what the price should be; it tells you when your prices are lying to each other.

  Here is the **10-Minute Coherence & Consistency Procedure**, designed for the trading desk.

  ***

  # The 10-Minute Coherence Check
  **Target Audience:** All compilers.
  **Maths Level:** Percentages only (no fractions).
  **Frequency:** Pre-match final sign-off, or during in-play lulls.
  **Goal:** Ensure no Dutch Book vulnerabilities exist within a single match ecosystem.

  ### Step 1: The Overround Check (2 Minutes)
  *Applies to: 1X2, Over/Under 2.5, Double Chance.*

  1.  Take the decimal odds for every outcome in a single market (e.g., Home, Draw, Away).
  2.  For each odd, calculate the **Implied %**: `100 ÷ Decimal Odds`.
      *   *Example:* Odds of 2.00 = `100 ÷ 2.00` = 50%.
      *   *Example:* Odds of 3.50 = `100 ÷ 3.50` = 28.57%.
  3.  Add the Implied % figures together.
  4.  **The Pass:** The total must be between **104% and 108%** (assuming your target overround is 6%).
  5.  **The Fail:**
      *   **Below 100%:** **CRITICAL.** You have created a Dutch Book. A punter can back all outcomes and guarantee profit. **Suspend immediately.**
      *   **Above 110%:** Your prices are too stiff. You won't get action. Reprice downwards.
      *   **Between 100% and 104%:** Your margin is too thin. Risky for in-play. Tighten slightly.

  ### Step 2: The Subset Check (3 Minutes)
  *Applies to: Match Odds vs. Double Chance / Draw No Bet.*

  Logic dictates that backing "Home or Draw" is safer than backing "Home" alone. Therefore, the odds for "Home or Draw" must be *lower* (higher probability) than "Home" alone.

  1.  Calculate Implied % for **Home Win**.
  2.  Calculate Implied % for **Double Chance (Home or Draw)**.
  3.  **The Pass:** Implied % (Double Chance) must be **greater** than Implied % (Home Win).
      *   *Translation:* The percentage chance of "Home or Draw" must be higher than just "Home".
  4.  **The Fail:** If the Double Chance % is lower or equal to the Home Win %, your prices are inverted.
      *   **Action:** Adjust the Double Chance odds downwards until the % is roughly 10-15% higher than the single win.

  ### Step 3: The Cross-Market Logic Check (5 Minutes)
  *Applies to: Match Odds vs. Goalscorer / Correct Score.*

  This is where judgement comes in, but we need a hard stop rule. A player cannot be more likely to score than his team is to win (roughly speaking).

  1.  Identify the favourite team to win (e.g., Man City). Note their Implied Win %.
  2.  Identify the favourite First Goalscorer in that team. Note his Implied % (`100 ÷ Odds`).
  3.  **The Pass:** The Player's Implied % should generally be **no more than 60-70%** of the Team's Implied Win %.
      *   *Why?* Even if the team wins, someone else might score.
  4.  **The Fail:** If the Player's Implied % is higher than the Team's Implied Win %, you have a logical error. (e.g., Team to win is 50%, but Striker to score first is 60%).
      *   **Action:** Lengthen the player's odds immediately.

  ***

  # The In-Play Emergency Protocol
  **Constraint:** You cannot run a 10-minute check when bets are landing every second.
  **Rule:** **Suspend First, Check Second.**

  When a major event occurs (Goal, Red Card, Penalty):
  1.  **Suspend:** Hit the suspend button on all correlated markets immediately. Do not wait.
  2.  **Wait:** Allow 30-60 seconds for the data feed to stabilise and the dust to settle.
  3.  **Re-base:** Do not just "tweak" the old odds. The game state has changed. Treat it as a new pre-match scenario based on the current score and time remaining.
  4.  **Resume:** Only reopen once Step 1 (Overround Check) is satisfied on the new prices.

  ***

  # Scenario Walkthroughs

  Here is how this plays out in the real world, including the bits you won't like.

  ### Case 1: Pre-Match Inconsistency (The "Nagging Feeling")
  **Situation:** You're pricing up a Premier League match.
  *   **Match Odds:** Liverpool to win @ 1.80.
  *   **First Goalscorer:** Mohamed Salah @ 3.50.
  *   **Your Gut:** Something feels off. Salah is the main threat, but 3.50 looks too short compared to the team price.

  **Running the Procedure:**
  1.  **Implied % (Liverpool Win):** `100 ÷ 1.80` = **55.5%**.
  2.  **Implied % (Salah First Scorer):** `100 ÷ 3.50` = **28.5%**.
  3.  **Cross-Market Check:** Is 28.5% reasonable compared to 55.5%?
      *   Ratio: 28.5 / 55.5 = **51%**.
      *   *Analysis:* This implies that if Liverpool wins, there's a 51% chance Salah scored the *first* goal. That is high, but not impossible. However, check the **Anytime Scorer** market.
  4.  **Deep Dive:** You check Salah Anytime Scorer @ 1.90.
      *   Implied %: `100 ÷ 1.90` = **52.6%**.
      *   *Conflict:* Salah is 52.6% to score anytime, but Liverpool is only 55.5% to win. This implies that in almost every game Liverpool wins, Salah scores. It leaves no room for Liverpool winning 1-0 via a defender or midfield goal.
  5.  **Verdict:** **Fail.** The correlation is too tight. You are overpricing Salah relative to the team's chance of winning.
  6.  **Fix:** Lengthen Salah Anytime to 2.10 (47.6%) to create a buffer. This protects you if Liverpool grind out a 1-0 win without him.

  ### Case 2: In-Play Red Card (The "Panic Moment")
  **Situation:** 60th minute. Score 0-0. Favourite (Arsenal) gets a red card.
  **Status:** Match Odds board is open. Bets are landing on "Arsenal to Win" and "Under 2.5 Goals" every second.

  **Running the Protocol:**
  1.  **Action:** **SUSPEND ALL MARKETS.** Do not try to adjust the odds while the red card news is propagating. Your data feed is likely 5 seconds behind the punters on the ground or watching the stream.
  2.  **Wait:** 45 seconds. Let the "Under 2.5" money stop coming in.
  3.  **Re-base:**
      *   Pre-red card, Arsenal Win was 1.50 (66%).
      *   Post-red card, they are now the underdog. You cannot simply add 20% to the odds. You must assess the new state.
      *   New Assessment: Arsenal Win is now unlikely. Draw or Away Win is favoured.
      *   New Match Odds: Arsenal 5.00 (20%), Draw 3.50 (28%), Opponent 2.00 (50%).
      *   Total Implied %: 20 + 28 + 50 = 98%. **Wait, that's a Dutch Book!**
  4.  **Correction:** You forgot the overround. You need the total to be 106%.
      *   Adjust to: Arsenal 5.50 (18%), Draw 3.60 (27%), Opponent 2.10 (47%).
      *   Total: 18 + 27 + 47 = 92%... Still wrong. You need to *shorten* the odds to increase the percentage sum.
      *   Final: Arsenal 4.50 (22%), Draw 3.20 (31%), Opponent 1.90 (52%). Total = 105%.
  5.  **Resume:** Reopen markets.
  6.  **Time Taken:** 2 minutes.
  7.  **Risk:** You lost 2 minutes of turnover. **Accept this.** It is cheaper than taking £50k on Arsenal to Win at 1.50 when they're down to 10 men.

  ### Case 3: The Unpopular Decision (The "Revenue Hit")
  **Situation:** Champions League. High profile match. 85th minute, score 1-1.
  **Problem:** Your data feed freezes. You can see bets landing on "Over 2.5 Goals" heavily, suggesting a goal has just happened on the live stream, but your official data provider hasn't updated the score yet. Your manager is watching the turnover figures and wants the board open because it's peak betting time.

  **Running the Protocol:**
  1.  **Check:** You cannot run Step 1 (Overround) because you don't know the state of the game. If a goal *has* been scored, your current "Over 2.5" price is now a Dutch Book vulnerability (too short).
  2.  **Constraint:** You cannot verify the goal for 60 seconds.
  3.  **Decision:** **SUSPEND.**
  4.  **The Conflict:** Your manager will shout. "We're losing £10,000 a minute in handle! Open the board!"
  5.  **The Maths Justification:**
      *   If a goal *was* scored 60 seconds ago, the true probability of "Over 2.5" has jumped from ~40% to ~80%.
      *   If your board still shows the old probability (40%), you are offering odds that imply a 40% chance on an event that is 80% likely.
      *   This is a **negative expected value** bet for the bookie. Every pound taken is a guaranteed loss in the long run.
      *   Furthermore, if the score *is* now 2-1, backing "Under 2.5" is impossible (it's already lost), but if your system hasn't settled the bet, you are exposed to arbitrage on other markets (Correct Score, Next Goalscorer).
  6.  **Action:** Keep the market suspended until the data feed matches the visual evidence.
  7.  **Outcome:** You miss out on 5 minutes of peak turnover. Your manager is furious.
  8.  **Reality Check:** If you stayed open, a syndicate with a faster feed would have hammered the "Over 2.5" market at your old prices. You might have taken £50k in bets, but you would have lost £40k on settlement.
      *   **Turnover is vanity, Profit is sanity.**
      *   Write this down: *"Suspension due to data latency prevents Dutch Book exposure on goal-dependent markets."* Show this to your manager when the P&L comes in.

  ***

  # A Note on Judgement vs. Maths

  You asked me to be honest about where the maths ends and the opinion begins. Here is the line:

  1.  **The Overround (Margin):** This is commercial, not mathematical. We set it at 6% to cover costs and risk. The procedure checks that you *stick* to 6%, but it doesn't tell you if 6% is the right number for a Champions League final (where you might drop to 4% to be competitive) or a League Two match (where you might push to 8% due to higher uncertainty). That is your commercial call.
  2.  **The Probabilities:** The procedure assumes your starting percentages are honest. If you price a team at 2.00 (50%) because you "fancy them," but the true probability is 30%, the coherence checks will still pass. You won't be Dutch Booked, but you will still lose money because your prices are too short. **Coherence does not equal Accuracy.**
  3.  **The "Patch":** If a check fails, can you patch a single price?
      *   **Yes,** if it's an isolated error (e.g., one player's goalscorer odds are typos).
      *   **No,** if the Overround Check fails on the main Match Odds. This suggests a systemic error in your model or feed. Suspend and recalculate the whole board. Patching one leg of a 3-leg market often breaks the coherence of the others.

  ### Final Word
  You're doing the right thing by formalising this. In the heat of in-play, adrenaline makes us stupid. We chase losses, we hesitate to suspend, we trust the feed too much. Having a printed sheet on the desk that says *"If Sum < 100%, Suspend"* takes the emotion out of it.

  Stick to the procedure. If the maths says suspend, you suspend. It's easier to explain a lost hour of turnover to your boss than a lost £100k book.

  Good luck with the matches.
