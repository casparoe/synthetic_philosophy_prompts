answer: |-
  **ADVERSARIAL COLLABORATION RECORD: QUINEAN ETHICS**
  **SUBJECT:** Ontological Status and Methodological Role of Moral Values
  **PARTICIPANTS:** Ontological Minimalists (OM) vs. Pragmatic Instrumentalists (PI)
  **DATE:** 24 May 2024

  ### I. FRAMING ADJUDICATION (DRAFTER'S STANCE)

  **On the Substantive Nature of the Dispute:**
  This document proceeds on the judgment that the disagreement between OM and PI is **substantive**, not merely verbal. It is not a dispute over the definition of "truth" alone, but over the functional role moral sentences play within the web of belief. If morals are merely calibration targets, their revision is governed by utility and social cohesion. If they function as theoretical entities, their revision is governed by explanatory power and consistency with empirical posits. This distinction yields divergent predictions regarding moral progress and stability.

  **On the Calibration-Target Analogy:**
  The proposed analogy (Theoretical Entities vs. Instrumental Calibration Targets) **clarifies** the dispute. In experimental physics, a theoretical entity (e.g., the electron) is posited to explain observation and carries a truth-value commitment. A calibration target (e.g., zeroing a scale) is a procedural norm required for the instrument to function, but it is not a description of the world. Mapping OM to Calibration Targets and PI to Theoretical Entities precisely captures the Quinean tension between naturalized skepticism and holistic pragmatism. It avoids the bog of "moral realism" by focusing on methodological role.

  ***

  ### II. JOINT STATEMENT OF AGREED CLAIMS

  Both camps affirm the following constraints derived from Quine's naturalized epistemology and ontology:

  1.  **Naturalistic Constraint:** There are no non-natural properties. Moral values, if they exist, must be contiguous with the entities and forces recognized by fundamental physics and evolutionary biology.
  2.  **No Special Faculty:** There is no distinct "moral sense" or intuition faculty. Moral judgments arise from the same sensory stimulation and neural processing as empirical judgments.
  3.  **Holistic Web:** Moral sentences occupy a position within the holistic web of belief. They are connected to observation sentences, though the chains of implication are longer and more diffuse than in physical theory.
  4.  **Scientific Sovereignty:** Where moral commitments conflict with established scientific findings (e.g., biology, psychology), the scientific findings must prevail. Ethics is methodologically infirm compared to natural science.
  5.  **Revisability:** No moral commitment is immune to revision. However, the conditions under which revision occurs are the primary subject of disagreement below.

  ***

  ### III. RECORD OF IRREDUCIBLE DISAGREEMENTS

  | Domain of Dispute | Ontological Minimalists (OM) | Pragmatic Instrumentalists (PI) |
  | :--- | :--- | :--- |
  | **Primary Analogy** | **Instrumental Calibration Targets.** Moral statements are norms for adjusting the "social instrument." They lack truth conditions; they have success conditions (cohesion, stability). | **Theoretical Entities.** Moral values are posits within a social theory. They function like electrons: unobservable but necessary to explain and predict social behavior and cooperation. |
  | **Semantic Status** | Non-cognitivist/Expressivist. "X is good" translates to "We calibrate against X." | Quasi-realist/Cognitivist. "X is good" translates to "X is a value-posits required by our best theory of social interaction." |
  | **Crux 1: Evolutionary Stability vs. Normative Force** | **Position:** Evolution explains the *origin* of moral sentiments but cannot ground their *normative force*. Stability $\neq$ Justification. | **Position:** Evolutionary stability *constitutes* normative force. A "good" moral system is one that proves evolutionarily stable for the species. |
  | **Concrete Case (Crux 1)** | **Universal Human Rights vs. Kin Selection.** | **Universal Human Rights vs. Kin Selection.** |
  | **OM Prediction** | If genetic engineering eliminated empathy for non-kin, "Human Rights" would lose its grip. It is a calibration setting, not a fact. We would simply recalibrate. | If genetic engineering eliminated empathy for non-kin, "Human Rights" would remain a valid theoretical posit because it explains long-term species survival better than tribalism, regardless of current sentiment. |
  | **Crux 2: Location in the Web (Revision)** | **Position:** Moral commitments lie at the **Periphery**. They are close to sensory stimulation (emotional reactions) and change readily with cultural shifts. | **Position:** Moral commitments lie near the **Center**. They are constitutive of the conceptual scheme itself (defining 'person', 'agent', 'harm'). |
  | **Concrete Case (Crux 2)** | **The Abolition of Slavery.** | **The Abolition of Slavery.** |
  | **OM Prediction** | Abolition was a shift in utility and sentiment (peripheral revision). The *logic* of ownership remained; the *calibration* of who counts changed due to economic/social pressure. | Abolition was a central revision of the conceptual scheme. It changed the definition of 'agent' within the web, forcing a rewrite of legal and logical connections regarding property and personhood. |
  | **Crux 3: Truth-Aptitude** | **Position:** Moral sentences are strictly false or lacking in truth value. They are commands disguised as statements. | **Position:** Moral sentences are true relative to the best overarching theory of human flourishing. They are truth-apt within the system. |
  | **Concrete Case (Crux 3)** | **Moral Disagreement (e.g., Trolley Problem).** | **Moral Disagreement (e.g., Trolley Problem).** |
  | **OM Prediction** | Disagreement reveals incompatible calibration settings. Resolution is power or negotiation, not evidence. | Disagreement reveals incomplete social theory. Resolution is possible via better empirical understanding of consequences and psychological needs. |

  ***

  ### IV. ADJUDICATOR'S NOTE ON PREDICTIONS

  The divergence in predictions for **Crux 1 (Evolutionary Stability)** is the most empirically testable distinction.
  *   **OM** predicts that if the biological substrate of empathy is removed, the moral claim dissolves immediately.
  *   **PI** predicts that the moral claim persists as a theoretical requirement for social coherence, even if biological sentiment lags.

  Historical analysis of regime changes where empathy was suppressed (e.g., totalitarian states) suggests a complex outcome: moral language persists (supporting PI) but is often redefined instrumentally (supporting OM). However, the **Calibration-Target Analogy** favors the OM interpretation: when the instrument (society) is forcibly recalibrated by a dictator, the "truth" of the previous calibration does not resist; it is simply overwritten. This suggests the OM position aligns more closely with Quine's explicit skepticism regarding the "methodological infirmity" of ethics, whereas the PI position attempts to rescue a robustness Quine explicitly denied.

  **Signed:**
  *Lead Drafter (Adjudicator)*
  *Representative, Ontological Minimalists*
  *Representative, Pragmatic Instrumentalists*
