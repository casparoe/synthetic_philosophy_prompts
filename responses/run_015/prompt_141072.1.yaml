      *   **Tone:** Academic, rigorous, suitable for a graduate seminar opening.

  2.  **Deconstruct the Requirements & Cases:**

      *   *Purpose:* Institutional ascription implies normativity (correct/incorrect) and identity (whose is it). This suggests the theory must handle rationality/appropriateness and subjectivity.
      *   *Recalcitrance:* Judgment says safe, emotion says dangerous. Theory must explain how this is possible without contradiction or denying one side.
      *   *Abstract Objects:* Absences, probabilities, patterns. Theory must allow intentional objects that aren't concrete present events.
      *   *Temporality:* Processes vs. states. Theory must handle extended durations without requiring a specific "peak" instant.
      *   *Addressivity:* Second-personal claims. Theory must account for the communicative/normative demand inherent in some emotions.
      *   *Non-conceptual Subjects:* Infants/animals. Theory must not require high-level cognitive concepts (like "justice" or "probability") unless it can explain how these subjects have them or don't need them.
      *   *Individuation/Demarcation:* Boundaries. Theory must distinguish emotion from mood (diffuse), sentiment (dispositional), feeling (sensation), desire (conative).
      *   *Neuroscience Constraint:* No specific fingerprint. Theory cannot rely on a specific physiological pattern defining "fear" vs. "anger".

  3.  **Evaluate Constraints (Non-negotiable vs. Preference):**

      *   *Non-negotiable:* The institutional purpose demands normativity (correctness) and identity. The neuroscience constraint is empirical fact (constructionist view), so a theory implying specific signatures is empirically false. Recalcitrance is a phenomenological fact that must be accommodated. Non-conceptual subjects are a fact of existence (infants feel), so a theory excluding them is too narrow.
      *   *Preference/Camp-specific:* Some theories might insist emotions *are* judgments (making recalcitrance hard). Some might insist they *are* feelings (making normativity hard). The demand for "addressivity" might be specific to Strawsonian reactive attitudes, not all emotions (e.g., fear of heights isn't addressed to the cliff). The demand for specific temporal structures might favor process views over state views.
