      *   **Required Cases/Constraints:**
          1.  Recalcitrant emotions (judgment vs. feeling conflict).
          2.  Objects as absences/non-occurrences/chances/patterns (relief, low-probability fear, resentment of patterns).
          3.  Temporal extension (suspense, anticipation, grief).
          4.  Addressivity/Claim-making (resentment, gratitude, anger demanding acknowledgement).
          5.  Non-conceptual subjects (infants, animals).
          6.  Individuation (one emotion vs. two) and Demarcation (emotion vs. mood/sentiment/feeling/desire).
          7.  Neuroscience Constraint (no distinctive autonomic/neural signature per category).
      *   **Output Format:** Continuous prose. No headings, bullet points, bold text, or tables. (Crucial for reading aloud).
      *   **Key Task:** Sort requirements into non-negotiable vs. camp preferences. Identify unsatisfiable tensions. Identify the single most exclusionary requirement.
