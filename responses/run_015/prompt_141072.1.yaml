answer: |-
  We begin not by choosing a theory but by defining the job one must do. The purpose of this seminar is to find a theory of emotion robust enough to underwrite the ascriptions made by institutions that manage human life. When a clinician diagnoses a fear as disproportionate, when a court treats anger as mitigating or culpable, when a culture validates grief or an algorithm labels a face, these practices assume that emotions belong to someone and that they can be correct or incorrect. Therefore, the first requirement of our specification is normative assessability. A theory must explain what makes an emotion fit or unfit its object, rational or irrational, proportionate or disproportionate. Without this, the clinician and the judge have no footing. Closely tied to this is the requirement of ownership. The theory must specify what makes an emotion mine or yours, distinguishing the subject who feels from the object that is felt, because institutional responsibility hinges on this boundary. These two demands are non-negotiable because they are built into the purpose you have set; a theory that cannot support a verdict of correctness or identify a subject fails the brief immediately.

  Beyond this core mandate, the theory must accommodate specific phenomenological cases that have historically fractured previous accounts. It must handle recalcitrant emotions, where a subject judges a situation safe yet feels fear, without dissolving the emotion into a mistake or the judgment into a lie. It must account for objects that are absences, probabilities, or patterns, such as relief at a cancellation, fear of a rare outcome, or resentment over a history of slights, meaning the theory cannot require a present, concrete stimulus. It must accommodate emotions that are essentially temporal processes, like suspense or grief, which are not wholly present at any single instant, resisting models that treat emotions as momentary states. It must also explain the addressivity of emotions like resentment or gratitude, which seem to make a claim on another person rather than merely describing a state of affairs. While the demand to handle these cases is genuine, insisting that every emotion must fit every case is a prejudice. For instance, requiring all emotions to be addressed to someone is a preference of the Strawsonian camp; fear of heights is not addressed to the cliff. The genuine requirement is that the theory possesses the resources to explain addressivity where it occurs, not that it imposes addressivity everywhere. Similarly, while the theory must handle extended temporal profiles, insisting that all emotions are processes rather than states is a preference of process theorists; the requirement is simply that the ontology allows for duration.

  We must also confront the constraints imposed by the subjects who feel and the science that studies them. The theory must accommodate non-conceptual subjects, such as infants or animals, who exhibit distress or fear without possessing concepts of justice, probability, or cancellation. This is a non-negotiable empirical constraint; if a theory requires sophisticated cognitive concepts to constitute emotion, it excludes too much of the phenomena we intend to study. However, this creates a tension with the normative requirement. If correctness requires reasons, and reasons require concepts, how can an infant's emotion be correct or incorrect? A theory that resolves this by denying infants emotions fails the empirical constraint; a theory that grants them emotions but denies them correctness fails the institutional mandate. This tension is likely unsatisfiable for any theory that ties normativity strictly to high-level cognitive justification. Furthermore, the theory must confront the demarcation problem, distinguishing emotion from mood, sentiment, bodily feeling, and desire. This is genuine, but the demand for a sharp boundary may be a prejudice of classificationists if the phenomena lie on a continuum. Finally, the theory must confront the findings of affective science which indicate no distinctive autonomic or neural signature per emotion category. Any theory that quietly implies such a signature, perhaps by treating emotions as natural kinds with essential physiological profiles, is empirically falsified. This is a non-negotiable constraint based on current evidence.

  When we sort these demands, the most exclusionary single requirement is normative assessability. It immediately eliminates pure feeling theories, which treat emotions as brute sensations that cannot be true or false, and it eliminates pure causal theories, which treat emotions as effects rather than assessable responses. It forces the theory to introduce a cognitive or evaluative component, which then risks colliding with the non-conceptual subject constraint. The tension between normative assessability and the existence of non-conceptual subjects is the primary friction point; satisfying both requires a notion of correctness that does not depend on propositional judgment. The neuroscience constraint is the second most exclusionary, ruling out basic emotion theories that rely on specific physiological fingerprints. The requirement to handle recalcitrance is the third, ruling out strong judgmentalism. If a theory cannot hold judgment and emotion apart enough to allow conflict, it cannot explain the recalcitrant case. Thus, the specification forces us into a narrow corridor where emotions are assessable but not necessarily judgmental, embodied but not physiologically essenced, and cognitive but not necessarily conceptual.

  When we hold the judgmental view against this list, it fares well on normativity and ownership, as judgments are naturally assessable and belong to subjects. It also handles abstract objects and temporal extension reasonably well, since judgments can be about absences and persist over time. However, it fails decisively on recalcitrance, as it cannot easily explain how one can judge something safe and yet fear it without attributing irrationality or contradiction to the subject. It also struggles significantly with non-conceptual subjects, unless it posits that infants possess sophisticated conceptual capacities which seems empirically unwarranted. Consequently, while it satisfies the institutional need for correctness, it fails the phenomenological and developmental constraints.

  The perceptual or attitudinal view emerges as the strongest candidate against this specification. It handles recalcitrance elegantly by treating emotions as perceptions or attitudes that can conflict with judgment, much like seeing a stick as bent in water while knowing it is straight. It supports normativity because perceptions can be accurate or inaccurate, fitting the institutional need for correctness. It can accommodate non-conceptual subjects if perceptual content is understood as non-conceptual, allowing infants to have assessable emotional responses without propositions. It also has the resources to explain addressivity and temporal extension through the dynamics of attention and engagement. Its main vulnerability lies in the neuroscience constraint if it relies on specific modular systems, but generally, it is flexible enough to accept constructionist neural accounts. It navigates the tension between normativity and non-conceptual subjects better than any other view by decoupling assessment from judgment.

  The feeling view, by contrast, fails the primary institutional mandate. While it excels at accommodating non-conceptual subjects and recalcitrance, since feelings can exist without judgment and conflict with it, it cannot underwrite the correctness conditions required by clinicians and courts. A bodily feeling is not disproportionate in the way a judgment is; it simply is. To salvage normativity, feeling theorists must append a causal or cognitive theory of appropriateness, which often collapses the view back into a hybrid model. Furthermore, without neural signatures to individuate emotions, the feeling view struggles to distinguish fear from anger based on feeling alone, failing the demarcation requirement. It satisfies the phenomenological cases of duration and objectlessness well, but because it cannot justify the verdict of correctness without external help, it does not meet the core purpose of this seminar.
