answer: |-
  **Elias:** We have fifty minutes. If we don't file, the prize lapses. I'm putting down both names. The simultaneity is too clean. Eleven days apart? That's not coincidence; that's the field ripening. If A and B hadn't exist, someone else would have filed this bound by Christmas.

  **Sarah:** Then you're arguing from substitution. Would the result have appeared without them? Maybe. But that doesn't tell us who did the work. A had the framing two years ago. They sat on it. That silence wasn't idle; it was verification. B jumped in last autumn using A's framing but didn't know it. B's result is stronger, yes, but it's a solution to a problem A defined.

  **Elias:** And because A defined it, A owns the territory? That's the genius myth. The territory was there. The tools were there. A and B are just the first two walkers to stumble into the clearing. If the clearing was inevitable, withholding half the prize from B punishes them for moral luck. They arrived eleven days later. Splitting it acknowledges the structural reality: the discovery belonged to the moment, not the people.

  **Sarah:** But splitting implies they made the same discovery. They didn't. A found the question; B found a better answer. If we split, we launder that asymmetry into a feel-good compromise. Look at the calculus dispute. Two men, different tools, different notations. One won because his symbols stuck. We didn't split that. We picked a winner because the contributions weren't identical.

  **Elias:** Calculus is the outlier. Look at 1858. Twenty years of barnacles versus a fever dream on an island. The contents were near-identical. They were bundled. We're still arguing about it, but the society treated them as one discovery. Here, the results are functionally the same bound. B's method only makes sense inside A's framing. That's not different tools; that's the same house, different brick.

  **Sarah:** 1858 is exactly why I'm worried. Bundling them erased the disparity in labor. One man had an essay from 1844; the other had a hunch from Malthus. We bundled them to be nice, and now historians spend centuries untangling who actually did the work. You're using 1858 to justify erasing A's two years. I'm using Calculus to say that when the intellectual paths differ—framing versus solving—you pick the path that opened the door.

  **Elias:** Fine. Concede something. If A hadn't sat on it for two years, if they'd published immediately, B never catches up. A's caution created the window. But does that caution make the discovery *theirs* exclusively? You're fighting the substitution claim. You want to say B wouldn't have found it without A. But B *did* find it. Independently. You're trying to prove B was replaceable. I'm telling you everyone was replaceable.

  **Sarah:** I concede A's result was weaker. If the prize were for precision, B wins. But it's for discovery. And here's where you're slipping. You're moving from "someone else would have found it" to "what they found is the same thing." Those aren't identical. You need substitution to prove inevitability, but you're smuggling in identity to prove equivalence. Just because the result was inevitable doesn't mean the contributions are identical.

  **Elias:** ...I see that. If I argue substitution, I prove the field was ready. I don't prove A and B did the same cognitive work. I'm assuming that because the endpoint was fixed, the path doesn't count. But if the path is the discovery, then splitting is wrong. It treats two different achievements as one commodity.

  **Sarah:** And I concede this: I don't need to deny substitution. I've been wasting time arguing B wouldn't have succeeded. Maybe they would have. Maybe the field was ripe. But if the field was ripe, then A's framing and B's method are distinct harvests. If I admit substitution, I don't lose. I just need to deny identity. We aren't splitting a prize for one discovery. We're trying to merge two distinct contributions into one award category.

  **Elias:** So if we deny identity, there's nothing to split. We'd need two prizes. But we have one. So we have to decide: is the prize for the inevitability of the result, or the particularity of the path? If it's the result, I win, and we split. If it's the path, you win, and we pick A.

  **Sarah:** But we can't agree on what the "result" is. Is it the bound, or the framework that made the bound intelligible? You think the history settles this. I think the history shows we've never decided. Calculus says pick the notation. 1858 says bundle the labor. They point opposite ways because the institution hasn't decided what it's buying.

  **Elias:** We're out of time. We can't file two recommendations. We can't file none.

  **Sarah:** Then we aren't stuck on the facts. We're stuck on the unit of credit.

  **Elias:** The crux isn't whether the discovery was inevitable. It's whether inevitability makes the contributors interchangeable.

  **Sarah:** And until we decide if we reward the map or the territory, we're just guessing.
