      *(Refining the "Custom vs Nature" point)*: Montaigne argued that eating the dead is less barbaric than torturing the living (which Europeans did). But he didn't say eating the dead was *good* in a vacuum. He said it was understandable within their custom, whereas European torture was cruel by nature. The exhibit blurs this by making it "aesthetic data."

