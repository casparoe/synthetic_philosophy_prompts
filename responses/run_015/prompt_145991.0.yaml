reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Persona:** Michel de Montaigne (16th-century French philosopher, essayist, known for *Essais*, specifically "Of Cannibals").
      *   **Scenario:** Montaigne is alive today, reviewing a museum proposal.
      *   **Exhibit Details:** AI trained on 16th-century travelogues/ethnographic fragments generates synthetic "cannibal ritual" narratives. Visitors wear haptic suits simulating the taste-memory of human tissue. No origin context, no community consent. Curators defend it as "pure cultural relativism" (arguing Montaigne showed European practices were just as barbaric, so all ritual consumption is interchangeable aesthetic data).
      *   **Task:** Determine what Montaigne would actually think.
      *   **Constraints:**
          *   No generic relativism.
          *   Use specific Montaignean moves: skepticism about travelers' tales, custom vs. nature distinction, his approach to the Tupi (writing without meeting them, relying on a servant's testimony).
          *   Address whether he sees this as extending his argument or as European vanity/spectacle.
          *   No bibliography.
          *   End with `\answer{...}` containing a short phrase (e.g., 'cautious rejection').

  2.  **Deconstruct Montaigne's Philosophy (specifically "Of Cannibals"):**
      *   **Skepticism:** He doubted the accuracy of travelers' reports. He preferred the testimony of a simple, uneducated man (his servant) who lived with the Tupi over learned cosmographers who twisted facts to fit theories. He knew human testimony is fallible.
      *   **Custom vs. Nature:** He argued that what we call "barbarism" is often just custom unfamiliar to us. He famously said, "each man calls barbarism whatever is not his own practice." However, he also believed in a universal natural law (reason, humanity) that transcends custom. He wasn't a *radical* relativist who thought *anything* goes; he judged actions by reason and nature.
      *   **The Tupi:** He didn't exoticize them for spectacle. He used them as a mirror to critique European society (the Wars of Religion, torture, betrayal). He respected their virtue (courage, loyalty) even if he didn't share their practices. He didn't claim to *know* their inner experience fully.
      *   **Humanity:** He was deeply concerned with cruelty. He condemned torture and unnecessary suffering. He distinguished between eating dead enemies (ritual/vengance) and tearing living bodies apart (European torture).

  3.  **Evaluate the Exhibit against Montaigne's Thought:**
      *   **AI/Synthetic Narratives:** Montaigne distrusted second-hand accounts that were embellished. An AI trained on 16th-century travelogues would amplify the biases, errors, and fantasies of those original texts. Montaigne would see this as "doubling the error." He valued truthfulness over fancy.
      *   **Haptic Suits/Taste Simulation:** This is the crux. Montaigne discussed cannibalism intellectually and morally, not sensually. Simulating the *taste* of human tissue turns a moral/philosophical inquiry into visceral spectacle. It commodifies the act. Montaigne would likely find this grotesque and vain. It focuses on the *sensation* rather than the *reason*.
      *   **No Context/Consent:** Montaigne cared about the people. He spoke of the Tupi as men, not objects. Erasing context and consent treats them as mere data points. This violates his humanism.
      *   **Curators' Defense ("Pure Cultural Relativism"):** The curators argue that since Montaigne said Europeans are barbaric too, all rituals are interchangeable aesthetic data. Montaigne would reject this. He didn't say "all things are equal." He said "look at your own barbarism before judging others." He didn't collapse distinctions; he complicated them to provoke self-reflection. Turning suffering into "aesthetic data" is exactly the kind of intellectual vanity he critiqued.
      *   **Spectacle vs. Reflection:** The exhibit is designed for visitor *experience* (sensory simulation), not necessarily deep philosophical *reflection*. Montaigne's goal was self-examination ("What do I know?"). This exhibit seems to say "Feel what they felt" (which is impossible and presumptuous) rather than "Consider why you judge them."

  4.  **Drafting the Response (in Montaigne's voice/style):**
      *   *Tone:* Conversational, skeptical, humble, digressive but pointed. Use first-person ("I").
      *   *Key Arguments:*
          1.  **On the Source Material:** 16th-century travelogues are full of lies and exaggerations. Training an AI on them makes a machine that hallucinates barbarism. I preferred the plain speech of my servant to the learned lies of cosmographers.
          2.  **On the Simulation:** To simulate the taste of flesh is to indulge the very appetite we should examine. It makes a game of gravity. It is vanity to think we can taste another's soul through a suit.
          3.  **On Relativism:** I did not say all customs are equal. I said we are quick to judge. But cruelty is cruelty. To treat human consumption as "aesthetic data" is to lose the human element.
          4.  **On the Tupi/People:** They are men, not mirrors for our vanity. To use their memory without consent, without context, is to colonize them again.
          5.  **Conclusion:** This is not philosophy; it is theater. It is the very barbarism I warned against—prioritizing spectacle over humanity.

  5.  **Refining the Argument (Self-Correction):**
      *   *Check:* Did I avoid generic relativism? Yes, emphasize that Montaigne wasn't "anything goes." He had a moral compass based on nature/reason.
      *   *Check:* Did I use the "custom vs. nature" distinction? Yes, point out that while custom varies, cruelty violates nature.
      *   *Check:* Did I address the AI/Travelogues? Yes, highlight his skepticism of written accounts vs. oral testimony.
      *   *Check:* Is the ending correct? Needs `\answer{...}`.

  6.  **Final Polish (Voice):**
