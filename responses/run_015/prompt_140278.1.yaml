answer: |-
  You are grappling with the gap between Lakatos's *logical reconstruction* of science (which is indeed retrospective and tidy) and the *heuristic reality* of doing science (which is messy, competitive, and resource-constrained). Your intuitions are not inconsistent; they are tracking a variable that Lakatos underweights: **Explanatory Leverage.**

  Lakatos defines progress primarily by *novel prediction*. Your intuition about Wegener (progress without novel prediction) and String Theory (degeneration without a rival) suggests you are weighing **Empirical Anchorage** and **Ontological Cost** more heavily than novelty.

  Here is the principle that captures your verdicts, followed by the application to your cases, the necessary sacrifice, and the actionability clause.

  ### The Principle: Explanatory Leverage

  A research programme is **progressive** at time *t* if its protective belt adjustments increase its **Explanatory Leverage**. It is **degenerating** if adjustments increase ontological/theoretical complexity without increasing leverage.

  **Explanatory Leverage (L)** is defined as:
  $$ L = \frac{E_{unique} + E_{shared}}{C_{ontological} + C_{ad\_hoc}} $$

  Where:
  *   **$E_{unique}$**: Empirical phenomena uniquely explained by this programme (the "Wegener Clause").
  *   **$E_{shared}$**: Empirical phenomena explained by this programme and rivals (the "Lorentz Clause").
  *   **$C_{ontological}$**: The complexity of the hard core and belt entities (e.g., aether, strings, negative weight).
  *   **$C_{ad\_hoc}$**: The degree to which belt adjustments are designed solely to immunize the core from refutation rather than extend empirical reach.

  **The Degeneration Threshold:** A programme is degenerating if $\Delta L < 0$ over a sustained period, *or* if $L$ remains static while a rival's $L$ increases (the "Friend's Clause"), *or* if $E_{unique} = 0$ and $E_{shared} = 0$ despite high $C$ (the "String Theory Clause").

  ---

  ### Application to Your Historical Cases

  **1. Phlogiston (1770s)**
  *   **Verdict:** Degenerating.
  *   **Analysis:** $E_{unique}$ drops to zero as Oxygen explains combustion better. $C_{ad\_hoc}$ spikes (negative weight). $\Delta L$ is sharply negative.
  *   **Why it fits:** You correctly attribute the gas discoveries to the Oxygen programme because they increased Oxygen's $E_{unique}$, whereas for Phlogiston they were merely accommodated ($E_{shared}$) at high ontological cost.

  **2. Lorentzian Aether (post-1895)**
  *   **Verdict:** Degenerating.
  *   **Analysis:** $E_{shared}$ is high (contraction, time dilation match observation). However, $C_{ontological}$ is high (undetectable aether + contraction mechanism). Einstein's programme achieves identical $E_{shared}$ with drastically lower $C_{ontological}$ (no aether).
  *   **Why it fits:** This captures your discomfort. The *math* was true (high $E$), but the *programme* was degenerating because the ontological cost was unnecessary. The truth survived, but the research programme (Aether) died.

  **3. Wegener (Continental Drift, 1935)**
  *   **Verdict:** Not Degenerating (Progressive/Stable).
  *   **Analysis:** $E_{unique}$ is massive (coastline fit, fossil distribution, glacial marks). No rival explains these. $C_{ontological}$ is low (continents move). $C_{ad\_hoc}$ is moderate (mechanism is wrong, but the core claim is directly supported by data).
  *   **Why it fits:** This overrides the "Novel Prediction" requirement. Wegener was accommodating known anomalies, but because $E_{unique}$ was high and unrivaled, Leverage remained high.

  **4. Gravitational Waves (Pre-2015)**
  *   **Verdict:** Not Degenerating.
  *   **Analysis:** $E_{unique}$ is pending. $C_{ad\_hoc}$ is zero (the belt wasn't changed to hide the lack of detection; the detection limit was instrumental).
  *   **Why it fits:** The "delay" is not a belt adjustment. It is an instrumental constraint. Leverage is suspended, not declining.

  **5. String Theory / SUSY (Current)**
  *   **Verdict:** Degenerating.
  *   **Analysis:** $E_{unique} = 0$ (no empirical phenomena uniquely explained). $E_{shared} = 0$ (Standard Model works fine without it). $C_{ontological}$ is enormous (11 dimensions, landscape, multiverse). $C_{ad\_hoc}$ is rising (adjusting compactification to avoid LHC null results).
  *   **Why it fits:** This distinguishes it from Wegener. Wegener had $E_{unique}$ (fossils). String Theory has only *theoretical* anomalies (quantum gravity), which count for less in $E$ than empirical data. High Cost + Zero Empirical Return = Degeneration.

  ---

  ### Verdicts on Your Invented Cases

  **Case 1: Confirmation-without-Novelty**
  *   *Description:* 30 years of belt hypotheses, all independently confirmed, all accommodating known data, zero novel predictions.
  *   **Verdict:** **Stagnant (Borderline Degenerating).**
  *   **Reasoning:** $E_{shared}$ is high, but if $\Delta E_{unique} = 0$ while $C_{ontological}$ rises, Leverage ($L$) slowly declines due to the denominator. It is not "degenerating" in the catastrophic Phlogiston sense, but it is failing the "Progressive" test. It is a mature programme harvesting low-hanging fruit.
  *   **Action:** Fund maintenance, not expansion.

  **Case 2: Definitional Retreat**
  *   *Description:* Hard core is definitional. Anomalies met by reinterpreting central terms (pre-published, well-motivated). No risk, no ad hoc-ness.
  *   **Verdict:** **Degenerating.**
  *   **Reasoning:** This is the case you care about. Even if the redefinitions are "well-motivated," if they function to ensure the theory *cannot* be refuted by the anomaly, they increase $C_{ad\_hoc}$ effectively. More critically, they reduce the *empirical content* of the theory. If terms shift to accommodate data, the theory is no longer constraining the world; the world is constraining the definitions. $E_{unique}$ becomes trivial because the theory is tautological.
  *   **Action:** Defund. This is philosophy, not physics.

  ---

  ### The Unthought-Of Case: The "Zombie Programme"

  Here is a case you haven't considered that tests the limit of this principle.

  **Case 3: The Empirically Silent Theoretical Bridge**
  *   *Description:* A programme that makes no novel predictions and explains no *current* empirical anomalies, but provides the *only known mathematical framework* that allows two existing, empirically successful programmes to coexist logically (e.g., a specific formulation of Quantum Gravity that resolves a mathematical singularity but predicts no new particles at accessible energies).
  *   **Verdict:** **Progressive (Theoretically).**
  *   **Reasoning:** Under the Explanatory Leverage criterion, this is tricky. $E_{empirical} = 0$. However, if we count **Theoretical Coherence** as a form of $E$ (explaining why QM and GR don't clash), then $E_{unique}$ is high.
  *   **The Conflict:** If you strictly prioritize *Empirical* Leverage, this programme is degenerating. If you allow *Theoretical* Leverage, it is progressive.
  *   **My Recommendation:** You must treat Theoretical Leverage as **discounted currency**. It counts, but it depreciates rapidly if not cashed out for Empirical Leverage within two generations. String Theory started here; it stayed too long.

  ---

  ### The Sacrifice

  To adopt the **Explanatory Leverage** criterion, you must sacrifice one of your intuitions or Lakatos's core tenet.

  **The Sacrifice:** You must abandon Lakatos's strict requirement for **Novel Prediction** as the *sine qua non* of progress.
  *   **Why:** Your Wegener verdict demands it. Wegener made no novel predictions for 30 years; he accommodated old ones better than anyone else.
  *   **Cost:** This makes the criterion slightly more subjective. Determining "Unique Explanation" ($E_{unique}$) is harder than checking a prediction box. It requires judging the quality of explanation, not just the temporal order of fact and theory.
  *   **Is it worth it?** Yes. It saves your Wegener intuition and your String Theory intuition simultaneously. It acknowledges that science sometimes progresses by solving puzzles (Wegener) and sometimes by predicting surprises (Einstein), but it degenerates when it stops touching the world (String Theory).

  **Regarding your Friend's 3-Place Relation:**
  Your friend is half-right. Rivals matter for $E_{shared}$ cases (Lorentz vs. Einstein). But they are not *necessary* for degeneration. A programme can degenerate in a vacuum (String Theory) if its internal Cost outstrips its Empirical Return. Your criterion absorbs the Friend's insight without being bound by it.

