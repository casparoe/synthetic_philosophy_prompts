  ### Actionability: What to Tell the Working Scientist

  The philosopher in your group is right that *final* verdicts are retrospective. But you are right that *heuristic* verdicts are necessary for resource allocation. Here is what the Explanatory Leverage criterion licenses you to do **now**:

  1.  **The "Belt Trajectory" Test:** When deciding on a graduate student or funding, look at the *last three* major belt adjustments of the programme.
      *   Did they increase empirical contact (new detectors, new phenomena explained)? -> **Fund.**
      *   Did they increase mathematical consistency while reducing empirical risk (new dimensions, new definitions, multiverse)? -> **Do Not Fund.**
  2.  **The "Monopoly" Check:** If a programme claims to be the only game in town (String Theory, Wegener), ask: "What empirical data do you own that no other framework can touch?"
      *   If the answer is "None, but we solve the math," treat as **High Risk/Theoretical Only**. (Fund a few theorists, no experimentalists).
      *   If the answer is "The fossil record," treat as **High Potential/Empirical**. (Fund the mechanism hunters).
  3.  **The "Definitional" Red Flag:** If a researcher explains a null result by refining the definition of a core term (Case 2), intervene. This is the strongest signal of degeneration available in real-time. It indicates the programme is prioritizing self-consistency over world-contact.

  **Summary for your Group:**
  Tell the philosopher that while *truth* is retrospective, *utility* is prospective. The Explanatory Leverage criterion does not promise to identify the "True" programme, but it identifies the programme that is currently doing the most work per unit of ontological investment. That is all a funding agency or a PhD advisor needs to know.

  You can keep your verdicts on Phlogiston, Lorentz, Wegener, and String Theory. You only have to give up the idea that "Novel Prediction" is the only engine of progress. Sometimes, simply owning the data is enough—until a rival comes along to explain it cheaper.
