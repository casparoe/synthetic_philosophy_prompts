answer: |-
  This is an exceptionally sharp diagnosis you've already formulated. You are correctly identifying that the "stall" in your seminar isn't a failure of reasoning, but a collision of distinct philosophical frameworks that are being talked past one another.

  To answer your core question: **Yes, this is a multi-layered disagreement.** It is partially verbal, partially empirical/formal, but ultimately rooted in bedrock normative commitments. If you treat it as only one of these, you will remain stuck.

  Here is a diagnosis of the three layers at play, followed by a roadmap for what counts as progress in your paper.

  ### 1. The Conceptual Layer: Causation vs. Complicity
  You are right that "contributes" is doing too much work. This is a **category mistake** disguised as a factual dispute.

  *   **Side A (The Causal Claim):** They are operating with a *counterfactual theory of causation*. "Did my burger cause harm?" means "If I hadn't bought the burger, would the harm have occurred?" In highly inelastic markets, the answer is often "no." Therefore, they conclude "no moral violation."
  *   **Side B (The Complicity Claim):** They are operating with a *participation theory of morality*. "Did my burger contribute?" means "Am I now a participant in a harmful chain?" Here, causation is irrelevant. You can be complicit in a system without being the *but-for* cause of a specific outcome (e.g., paying taxes for an unjust war).

  **Diagnosis:** This is a **verbal dispute with normative consequences.** If the seminar agrees to split the concept into "Causal Efficacy" vs. "Moral Complicity," Side A might win on efficacy, but Side B wins on complicity. The stall happens because Side A treats complicity arguments as failed causation arguments, and Side B treats causation arguments as moral evasion.

  ### 2. The Formal/Empirical Layer: Thresholds and Probability
  You mentioned the "bridge" analogy (non-aggregative harm). This is a specific reference to the **Threshold Problem** in collective harm (discussed by philosophers like Julia Nefsky and Alastair Norcross).

  *   **The Flaw in Side A's Math:** Side A assumes a linear, continuous model (my burger = 0.0000001% of a cow). But supply chains are "lumpy." A store orders cows in batches. There is a threshold where *one* purchase triggers an order for 10 more cows.
  *   **The Expected Utility Fix:** Even if you don't know *when* the threshold is, there is a *probability* your purchase is the trigger.
      *   *Math:* (Probability of triggering threshold) × (Magnitude of harm at threshold) = Expected Harm.
      *   Surprisingly, in many models, this equals the "average harm" Side A dismissed.
  *   **The Empirical Disagreement:** Side A claims supply is inelastic (my choice doesn't change production). Side B implies demand signals shift long-term curves.

  **Diagnosis:** There is a **hidden formal disagreement** here. Side A is often using a deterministic model (did I *definitely* cause this?), while the reality is probabilistic. If Side A accepts the probabilistic threshold model, their "0.0000001%" argument collapses. However, this only addresses the *consequentialist* concern. It doesn't satisfy Side B's desire for integrity if the probability is low.

  ### 3. The Normative Layer: Worldviews
  This is the bedrock you suspected. Even if you solve the math and the definitions, the sides may still disagree.

  *   **Side A (Act Consequentialism):** The only thing that matters is the state of the world (CO2 ppm, animal suffering). If my action doesn't change the state of the world, it is morally neutral.
  *   **Side B (Deontology / Virtue Ethics):** Morality is also about the *agent*. What does buying beef *say* about me? Does it corrode my virtue? Does it violate a duty not to participate in injustice, regardless of outcome?

  **Diagnosis:** This is **incommensurable.** You cannot prove Virtue Ethics wrong using Utilitarian math. If Side A believes morality is *only* about outcomes, they will view Side B as "purity spiraling." If Side B believes morality includes *integrity*, they will view Side A as "soulless calculation."

  ---

  ### What Counts as Progress? (For Your Paper)

  Since you need to write a paper, do not try to solve the climate crisis or prove one side right. Instead, **map the disagreement.** Your paper can argue that the seminar is stuck because it is conflating these three layers.

  Here is how you structure progress:

  **1. Disaggregate the Claims (Conceptual Progress)**
  Propose a taxonomy. Argue that the seminar must distinguish between:
  *   **Causal Impact:** Did this act change the outcome? (Empirical/Counterfactual)
  *   **Complicity:** Is this act participation in a wrong? (Relational/Deontological)
  *   **Signaling:** Does this act shift norms? (Sociological)
  *   **Integrity:** Does this act align with the agent's values? (Virtue Ethics)
  *   *Progress:* The group admits that Side A is talking about Causal Impact, while Side B is talking about Complicity/Integrity. They are not contradicting each other; they are answering different questions.

  **2. Correct the Probability Model (Formal Progress)**
  Address the "inefficacy" math. Cite the **Expected Utility** argument (Norcross/Singer).
  *   *Progress:* Show that even on Side A's terms (consequentialism), the "my burger doesn't matter" argument is mathematically suspect if you account for probabilistic thresholds in supply chains. This forces Side A to either update their math or admit they are relying on a specific (and debatable) model of market elasticity.

  **3. Identify the Bedrock (Normative Progress)**
  Acknowledge that if Side A is a pure Act Utilitarian and Side B is a Kantian, they will not agree on the *source* of obligation.
  *   *Progress:* Stop trying to convince Side A that "purity matters" or Side B that "outcomes matter." Instead, ask: "Given that we have both consequentialist and deontological intuitions, how do we weigh them?"
  *   *Example:* Maybe we accept Side A's point that we shouldn't guilt-trip individuals for systemic failure (causal), but accept Side B's point that institutional actors (or those with high visibility) have a higher duty of non-complicity.

  ### Is This Debate Worth Continuing?

  **Yes, but only if reframed.**
  If the seminar continues to ask "Does my burger save the planet?" the answer is likely "No," and the debate dies.
  If the seminar asks "What is the relationship between individual agency and systemic harm?" the debate becomes fertile.

  **Recommendation for your paper:**
  Argue that the "stall" is a feature, not a bug. It reveals that modern environmental ethics is trying to solve a **systemic problem** using **individualist moral tools.**
  *   The "Causal" side realizes individual tools are too weak for systemic problems.
  *   The "Complicity" side realizes we can't wait for systemic change to act morally.
  *   **Your Thesis:** The debate isn't about beef; it's about whether morality is scalable. The friction exists because we are trying to apply interpersonal ethics (don't kill) to hyper-complex systems (climate change) where causation is diffuse.

  **Key Philosophers to Reference:**
  *   **Julia Nefsky:** On the "Non-Triggering" problem (how to be harmed without being the cause).
  *   **Alastair Norcross:** "Puppies, Pigs, and People" (Expected Utility argument).
  *   **Tracy Isaacs:** "Collective Responsibility" (Distinguishing individual from collective obligations).
  *   **Michael Sandel:** On corruption and complicity (why markets/moral boundaries matter beyond outcomes).

  **Verdict:** You are not wrong. It is a verbal dispute masking a normative one, complicated by bad math. Your paper should be the one that untangles the knot rather than trying to cut it.
