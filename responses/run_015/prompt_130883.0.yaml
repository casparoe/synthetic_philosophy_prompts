      *   **Criteria for Prioritization:** Tractability (for philosophers without legal training), Downstream Impact (policy), Dependence (how much other work relies on it).
      *   **Requirement:** Defend the ordering explicitly. Write in American English. Keep reasoning sharp, not encyclopedic.
