  4.  **Develop the Prioritization (The "Defended Ordering"):**

      *   *Criterion 1: Tractability for Philosophers.* Copyright is closest to philosophy of language/mind. Patents are too technical/legalistic. Trade secrets are ethically interesting but legally thin.
      *   *Criterion 2: Downstream Impact.* Copyright is currently the battleground for AI and digital culture (where the "shared linguistic practice" point is most urgent).
