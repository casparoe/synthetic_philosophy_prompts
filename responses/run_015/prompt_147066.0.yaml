answer: |-
  **Project Title:** The Contingency of Reconciliation: Moral Luck, Institutional Design, and the Limits of the Truth Commission Model

  **1. Research Question**
  This project asks: Does the normative justification for granting amnesty within truth-commission processes depend on conditions of moral luck—specifically, on whether the transitional society happens to possess leaders with the particular moral and rhetorical capacities that make public confession politically effective? Furthermore, does recognizing this dependency undermine the common claim that South Africa's Truth and Reconciliation Commission (TRC) offers an exportable model for societies such as Argentina or Rwanda?

  The inquiry seeks to determine whether the legitimacy of amnesty is intrinsic to the institutional design of a truth commission or extrinsic, relying on the contingent presence of specific moral agents. If the latter, the universal prescriptive value of the TRC model is significantly compromised.

  **2. Limitations of Standard Debates**
  Current literature on transitional justice is largely polarized between retributive and restorative frameworks. Retributive accounts argue that amnesty violates the duty to punish, while restorative accounts argue that amnesty facilitates truth-telling and social healing. However, both approaches treat the institution as a "black box" that functions according to its procedural rules. They assume that if the design is normatively sound, the outcomes will follow.

  This binary fails to resolve the proposed question because it ignores the role of *agency* in institutional performance. Both sides presuppose that the mechanisms of confession and forgiveness will operate neutrally once established. They do not account for the possibility that the "restorative" success of the South African TRC was not a product of the design itself, but of the unique moral capital possessed by its leadership. By focusing on the *ends* (justice vs. peace) rather than the *preconditions of agency* required to achieve those ends, standard debates obscure the role of contingency. Consequently, they cannot explain why identical institutional designs fail in different contexts, nor can they assess whether relying on such contingency is normatively permissible.

  **3. Methodological Approach**
  This project will employ conceptual analysis rather than comparative empirical case studies. I will utilize the philosophical framework of "moral luck"—drawing on the distinction between constitutive luck and circumstantial luck—to analyze the normative structure of amnesty grants. The analysis will treat the South African TRC not as an empirical dataset to be compared with Rwanda or Argentina, but as a paradigm case for philosophical excavation.

  The justification for this non-empirical angle is twofold. First, empirical comparisons often conflate correlation with causation; observing that a commission succeeded where a charismatic leader was present does not prove the leader was a necessary condition for *normative validity*. Only conceptual analysis can isolate the dependency relationship between moral agency and institutional legitimacy. Second, policy transfer debates often suffer from "best practice" generalizations that strip context from design. A conceptual approach allows for a rigorous examination of the *conditions of possibility* for reconciliation, independent of variable historical facts. I will analyze the logical requirements of "public confession" to determine if it inherently demands a specific type of moral interlocutor to be valid.

  **4. Implications for Practitioners**
  A successful result for this project would provide practitioners and international bodies with a diagnostic framework for assessing "moral capital" prior to institutional design. Success looks like a shift in policy guidelines: rather than treating the TRC model as a modular toolkit to be installed, practitioners would be compelled to audit the local landscape for the requisite moral and rhetorical leadership capable of sustaining the amnesty bargain.

  Conversely, failure would be defined as the continued promotion of truth commissions as context-neutral technologies. If the project demonstrates that amnesty is only justified when specific conditions of moral luck are met, then exporting the model to contexts lacking those conditions would be shown to be not merely ineffective, but normatively hazardous. The practical output will be a set of criteria distinguishing between institutions that are *robust by design* and those that are *fragile by dependency*.

  **5. Feasibility and Limitations**
  Within a single semester, this project is feasible because it restricts the scope to theoretical analysis rather than fieldwork or extensive archival research. The primary task is to synthesize existing political theory regarding moral luck with transitional justice literature. I will focus on the South African case as the primary text for analysis, using Argentina and Rwanda only as hypothetical stress-tests for the theoretical model, rather than conducting full case histories.

  The primary limitation is the abstract nature of the conclusion. By avoiding empirical verification, the project risks appearing detached from the messy realities of political transition. Additionally, the concept of "moral luck" is philosophically dense; applying it to institutional design requires careful translation to ensure it remains accessible to policy audiences. Finally, the project cannot definitively prove that a specific leader *caused* a specific outcome, but rather that the *justification* for the outcome relies on the assumption of such leadership. Despite these limitations, the semester provides sufficient time to construct a coherent argument that challenges the universalizability of the TRC model.
