answer: |-
  The joke: "So," said Elara, tapping the campaign map where the border cut inexplicably through a mountain. "The entire Imperial Trade Guild exists because I rolled a Natural 1 on Persuasion in Session Three?"

  The GM shrugged, adjusting his screen. "You stuttered. The NPC thought you were speaking Ancient Code. Now it's the state language."

  "But we're level twenty," groaned Bob. "Surely we can retcon the border? Find a more logical path?"

  "Switching costs are too high," the GM replied, shuffling notes. "Thirty years of in-game infrastructure are built on that misunderstanding. Rewriting the legal code would crash the economy. You're locked in via increasing returns."

  Elara stared at the border drawn in permanent marker. "So history isn't destiny? It's just... accumulated technical debt from a critical fail?"

  "Exactly," said the GM. "The kingdom isn't optimized. It's just stuck on the first path that worked, even if it was arbitrary. The inefficiency is a feature now. Now, roll for taxation resistance."

  Commentary on the choices made: I utilized the mechanism of "increasing returns to scale" in institutional adoption, where early arbitrary advantages become entrenched because switching costs outweigh potential benefits (similar to QWERTY). The RPG framing works because it literalizes historical contingency: the GM represents chaotic initial conditions, while the "locked-in" map represents institutional inertia. Standard historical examples often feel deterministic in hindsight; the RPG retcon highlights the absurdity of claiming inevitability when the foundation was a random dice roll. It emphasizes that macro-structures aren't always optimal solutions, but rather amplified micro-errors that became too expensive to fix.
