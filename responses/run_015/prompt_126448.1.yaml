          *   *Resolution:* Is it a contradiction? Yes, unless the framework admits a "thin" universalism (e.g., non-domination *implies* no hierarchy). But (6) says "regardless of institutional gains," implying a substantive right that trumps the trade.
          *   *Verdict:* Genuine Tension. (6) looks like a substantive moral claim incompatible with the strict proceduralism/anti-objectivism of (1) and (2).

      *   **Tension B: (4) vs. (3)/(5) [The "Constitutive Stability" Problem]**
          *   *Analysis:* (3) protects constitutive commitments. (5) applies this to religious colleges. (4) says tradition/culture has no *independent* weight, only instrumental stability. If a religious college's constitutive commitment is based on "divine command" or "sacred tradition," (4) reduces that to mere "stability." If the framework treats these commitments as *merely* instrumental to stability, can they truly be "constitutive" in the robust sense required by (3)?
