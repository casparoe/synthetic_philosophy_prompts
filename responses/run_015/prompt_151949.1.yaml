answer: |-
  1. "The case on the table"

  The outcome to be explained is not abstract "harm to the city" or "public trust erosion," but the specific physical event: the leaching of lead from service lines into potable water delivered to household taps, resulting in elevated blood lead levels (BLL) in residents between April 2014 and October 2015. A valid explanation must link administrative decisions to this chemical migration. Mere correlation—such as noting that poverty rates rose while lead levels rose—does not count. Nor does broad sociological indictment suffice; we require a mechanism connecting the non-act of officials to the presence of lead ions in water. The explanatory target is narrow: why did water that was previously safe become toxic without a change in plumbing, solely due to changes in management and treatment protocols? Any theory of omission must account for this specific transmission of risk from policy to physiology.

  2. "Mapping"

  The agents bearing the omissions were not merely individuals but offices: the State-appointed Emergency Manager, the Michigan Department of Environmental Quality (MDEQ), and the EPA Region 5 office. The candidate omissions are: failing to add orthophosphate corrosion inhibitors; failing to monitor lead levels correctly (ignoring high-readings); and failing to respond to external evidence (GM plant corrosion, resident complaints). The baseline against which these are measured is the prior operational state: Flint water previously came from Detroit (Lake Huron), which included corrosion control, maintaining a passivated scale inside pipes. The contrast events are: continuing the Detroit supply, or switching to the river while immediately implementing orthophosphate treatment. The load-bearing stipulated facts are the chemical necessity of orthophosphate for river water and the regulatory interpretation that treatment was not required until monitoring showed exceedances. The time-window for the primary causal omission runs from the switch (April 2014) to the reversal (October 2015). Within this window, the omission is continuous; every day water flowed without inhibitors, the causal condition persisted. The mapping reveals that the omission was not a single missed moment but a sustained policy stance maintained across multiple administrative layers.

  3. "Three kinds of omission"

  Flint contains all three types, but they carry different causal weights. *Rescue omissions* are minimal here; officials did not fail to avert an external threat heading for victims, but rather altered the environment such that a threat emerged. *Maintenance omissions* are central: agents failed to sustain the protective chemical condition (orthophosphate buffer) that prevented the pipes themselves from becoming the source of toxicity. This is the strongest causal link; had maintenance occurred, the harm would not have existed. *Safeguard omissions* involve the failure to enforce or interpret regulations (the Lead and Copper Rule) that would have compelled maintenance.

  As we move from Rescue to Maintenance to Safeguard, the causal claim changes character. Maintenance omission looks like direct causation: no inhibitor equals lead release. It is physically tight. Safeguard omission looks like institutional design failure: if the rule had been stricter, the maintenance omission wouldn't have occurred. Here, causation bleeds into responsibility. The causal claim gets weaker in terms of physical proximity but broader in terms of scope. At the safeguard level, we are arguably no longer talking about causation in a mechanical sense, but about the architecture of accountability. If the theory of omission treats safeguard failures as causes, it risks conflating the cause of the harm with the cause of the *permission* to harm. Flint suggests that while maintenance omissions are the proximate cause, safeguard omissions are the distal enablement, and a theory must distinguish them to avoid inflating every regulatory gap into a cause of every subsequent accident.

  4. "What the difference-making picture delivers"

  Difference-making accounts (counterfactuals/interventionism) handle the chemical layer well: if orthophosphate had been added, lead would not have leached. There is clear counterfactual dependence. However, this picture over-generates causes in the bureaucratic layer. If the Governor had intervened, the harm would have stopped; if the President had intervened, it would have stopped. Difference-making theory struggles to distinguish between the specific office holder whose job it was to act and the infinite number of agents who *could* have acted. It also misdescribes the temporal structure. The counterfactual "if they had added inhibitors" implies a single intervention point, but the harm accrued cumulatively. Furthermore, difference-making is silent on knowledge. It treats the omission as a cause regardless of whether the agent knew the water was toxic. In Flint, the officials claimed ignorance based on regulatory loopholes. If causation requires only difference-making, their ignorance is irrelevant to the causal claim, though it matters for blame. This suggests difference-making captures the physical dependency but fails to capture the *agency* required for human causation. It identifies the leak in the system but cannot distinguish between a broken valve and a valve intentionally left open by someone who didn't know it controlled water.

  5. "What the production picture delivers"

  Production accounts, which look for physical transmission or mechanisms, go quiet here. There is a clear physical process: corrosive water dissolves lead scale, lead enters blood. But there is no physical transmission from the official's non-decision to the pipe. Nothing flows from the omission. A production theorist must say the cause is the water's chemistry, not the administrator's failure. This silence is a defect if we want a unified theory of human causation, but it is a correct refusal if we insist causation must be physical. Flint exposes the limit of production theories: they can explain the poisoning but cannot explain the *responsibility* for the poisoning. They treat the administrative layer as external to the causal mechanism. In cases of omission, especially bureaucratic ones, the "mechanism" is partly normative—it relies on expectations of action that do not exist in the physical world. Production accounts thus fail to reach the administrative reality, treating the crisis as a chemical accident rather than an administrative one. They describe the symptom but miss the etiology.

  6. "Description and the act/omission contrast"

  Re-describing "failed to add orthophosphate" as "supplied chemically aggressive water" turns an omission into an act. This makes the causal claim easier: supplying water is a positive action with clear physical effects. Is this sleight of hand? It marks a difference in how we pick out events for blame, not necessarily a difference in the world. The physical outcome is identical. However, the contrast matters for theory. If we accept the act description, causation is straightforward. If we insist on the omission description, we must explain how nothing causes something. Flint suggests the distinction is largely normative. We call it an omission because we expect inhibitors to be added; we call it an act because water was pumped. If the theory of causation relies on this distinction, it is vulnerable to linguistic framing. The gain in understanding comes from recognizing that the "omission" is only an omission relative to a normative baseline of expected care. The theory must admit that the act/omission contrast is not metaphysical but evaluative. It reflects what we expect agents to do, not just what they physically did.

  7. "What Flint does to the theory"

  Flint strains the theory of causation by omission by introducing distributed agency and normative epistemology. First, the omission belongs to an office, not a person. No single individual's action would have averted the outcome; it required a chain of approvals. Standard theories assume individual agents. Flint suggests causation can be *positional*—attached to a role rather than a body. Second, the epistemic status is mixed. Officials claimed the water was safe; arguably they *should have known*. If causation requires knowledge, the link breaks. If it requires only "position to know," causation becomes partly normative. We are saying they caused the harm because they *ought* to have known. This quietly transforms causation into a judgment of duty. Third, the timing problem: the harm accrued over eighteen months. Did the omission cause the harm on day one, or day 500? A single omission event doesn't fit. The cause was a *state* of non-treatment.

  Flint confirms that omission causation in institutions cannot be purely metaphysical. It bypasses standard accounts that seek clean counterfactuals or physical processes. It demands a theory that incorporates institutional roles and normative expectations into the causal structure itself. The collapse of criminal cases tracks this genuine causal difficulty: the law seeks individual acts, but the cause was a systemic state of non-action. The theory must expand to accommodate "structural causation," where the cause is the absence of a safeguard within a network, rather than the failure of a specific agent at a specific time. It shows that omission is not just the absence of an act, but the presence of a vulnerable system state maintained by authority.

  8. "My verdict"

  Flint demonstrates that causation by omission in bureaucratic contexts is not a subset of physical causation but a distinct category reliant on normative role expectations. The theory fails if it treats these omissions as metaphysically identical to individual failures to rescue. My position is that the collapse of criminal prosecutions was not merely a legal failure but a recognition that individual causation cannot be isolated in a distributed structural omission. We should reject the view that omission causation is purely counterfactual; it is inherently institutional. If you disagree, argue that the chemical reality outweighs the administrative structure, but you will then fail to explain why the switch back to Detroit water stopped the harm without changing the pipes. The cause was the administration, not just the chemistry.
