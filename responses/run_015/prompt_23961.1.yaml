prompt: |-
  I run avalanche search-and-rescue for a mountain rescue association, and I'm the one who has to call, in the field, which of two buried groups we commit the dog team and the diggers to when we can only work one site at a time. It comes up more then I'd like in a winter: two beacons triangulate to two different pockets, the snow is bad, the team is a single unit, and I've got maybe a two hour window before the buried people are gone. I need a decision procedure I can actually run on a slope in the cold with a head full of static, that tells me what to do when I can get the group of four out of the east pocket or the single hiker out of the west gully but not both, and I make the call and I sign for it.

  I don't want it to just be "save the most people." I've read enough of the debate to know that's contested, and I don't want a procedure that papers over that. So ground it in what the argument actually says: what is the real force of the claim that the number of people saved is, by itself, not a reason to save the many over the few (the Taurek line), what are the strongest replies to it, and where does the procedure have to stop and hand the call back to me as a person because it's a values question and not a facts question? Give me the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a "no, don't commit to that site," and the points where it just has to flag "this one's on you." Be straight about which steps are really judgment calls wearing a procedure costume. Then run it on two real-ish calls from last season: one where the four are a ski patrol team with a radio and the single is a solo backpacker who's already been out longer, and one where the single is a kid. And tell me the cases where the procedure hands me an answer I'm going to hate, and what it simply can't do for me.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Avalanche search-and-rescue (SAR) leader for a mountain rescue association.
      *   **Context:** High-stakes, time-sensitive, life-or-death decisions in the field (cold, stress, "static"). Two burial sites, one team, can only save one group.
      *   **Constraint:** Cannot simply default to "save the most people" (utilitarian calculus). Acknowledges the philosophical debate (Taurek vs. Aggregation).
      *   **Goal:** A concrete decision procedure grounded in the actual philosophical arguments, distinguishing between factual/medical triage and value judgments.
      *   **Requirements:**
          *   Ground in Taurek's argument (why numbers *might* not count).
          *   Include strongest replies (why numbers *might* count).
          *   Identify where the procedure stops and hands back to the human (value judgment).
          *   Identify "judgment calls wearing a procedure costume."
          *   Run the procedure on two specific scenarios (Patrol Team vs. Solo Backpacker; Group vs. Kid).
          *   Highlight cases where the answer is hated or impossible.

  2.  **Deconstruct the Philosophical Background:**
      *   **John Taurek ("Should the Numbers Count?"):** Argues that there is no "super-observer" for whom the loss of 5 is worse than the loss of 1. Each individual faces their own loss of life. To the single person, their death is 100% loss. To the group, each faces 100% loss. Therefore, numbers don't aggregate moral weight. We should toss a coin or use non-numerical criteria.
      *   **The Aggregationist Reply (Kamm, Parfit, etc.):** While each person suffers their own death, we have a duty to minimize overall tragedy. If we can save 5 instead of 1, failing to do so treats the 5 as if their claims don't outweigh the 1. There is a "greater good" or a duty to rescue that implies maximizing lives saved when costs are equal.
      *   **Triage/Medical Ethics:** Survival probability, immediacy of threat, resource allocation.
      *   **SAR Specifics:** Rescuer safety, probability of survival (time buried), likelihood of successful excavation.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Phase 1: Hard Constraints (Facts).* Can we actually save them? (Survivability, Safety). If one group is already dead or saving them kills rescuers, the choice is made.
      *   *Phase 2: Probability of Success.* It's not just "4 vs 1." It's "4 with 10% survival vs 1 with 90% survival." This is where medical triage enters.
      *   *Phase 3: The Taurek Filter (Non-Numerical Claims).* Are there specific duties or vulnerabilities that break the numerical tie? (e.g., children, dependents, specific responsibility). *Correction:* Taurek would say "no," but SAR often operates on social contracts. I need to frame this carefully. The prompt asks to ground it in the *argument*. So, this phase is where we ask: "Is there a reason to prioritize the few *other* than numbers?"
      *   *Phase 4: The Aggregation Threshold.* If all else is equal, do we default to numbers? The prompt says the user *doesn't* want to just be told "save the most." They want to know *where* that decision lands. So the procedure must explicitly flag the moment where "Numbers Count" becomes the tiebreaker.
      *   *Phase 5: The Handoff.* Where does the algorithm fail? When values conflict irreconcilably.

  4.  **Refining the Steps (incorporating the "Static" constraint):**
      *   Needs to be short, punchy, actionable.
      *   Needs to distinguish "Fact" from "Value."
      *   Needs to acknowledge the "Coin Toss" option (Taurek's solution).

  5.  **Developing the Scenarios:**
      *   *Scenario A:* 4 Ski Patrol (radio, trained, maybe better gear/outlook) vs. 1 Solo Backpacker (out longer, less gear).
      *   *Scenario B:* 4 Adults vs. 1 Kid.

  6.  **Addressing the "Hated Answers" and Limitations:**
      *   The procedure might say "Flip a coin" when the heart says "Save the kid."
      *   The procedure might say "Save the 4" when the heart says "The single one had no chance anyway, but the 4 were reckless."
      *   It can't remove guilt. It can't guarantee moral cleanliness.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is this too academic?
      *   *Fix:* Use SAR terminology. Keep the philosophy implicit in the logic but explicit in the explanation.
      *   *Critique:* Did I address Taurek enough?
      *   *Fix:* Ensure Step 4 explicitly discusses the "Numbers" question. Taurek says numbers don't count. Aggregationists say they do. The procedure needs to show where that switch flips.
      *   *Critique:* The user wants to know where the procedure stops.
      *   *Fix:* Create a specific "Command Decision" node.

  8.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the weight.
      *   **The Philosophical Grounding:** Briefly explain Taurek vs. Aggregation in SAR terms.
      *   **The Protocol (The "Avalanche Triage Matrix"):** Step-by-step.
      *   **The "Handoff" Points:** Explicitly marking where the human takes over.
      *   **Scenario Run-Throughs:** Applying the protocol.
      *   **The Hard Truths:** What the procedure can't do.

  9.  **Drafting the Content (Mental Check of Taurek):**
      *   Taurek's core point: Loss is experienced individually. There is no "sum of pain."
      *   Implication for SAR: If I save the 4, I am not "reducing total pain" in a way that matters to the 1 who dies. The 1 suffers the same total loss.
      *   Counter: But we are the *agent*. We have the power to choose. Choosing the 1 over the 4 implies the 4's claims are worth less.
      *   Integration: The procedure should treat numbers as a *tie-breaker*, not a *trump card*. This respects Taurek (numbers aren't inherently superior) while acknowledging Aggregation (when all else is equal, save more).

  10. **Refining the "Judgment Calls Wearing a Procedure Costume":**
      *   Assessing "Probability of Survival" is often a guess.
      *   Defining "Vulnerability" (is a kid worth more than an adult?) is a value judgment.
      *   Defining "Responsibility" (Patrol vs. Solo) is a value judgment.

  11. **Final Review against Prompt:**
      *   Grounded in Taurek/Reply? Yes.
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Where it stops? Yes.
      *   Run on two cases? Yes.
      *   Hated answers? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  This is a burden no procedure can fully lift, but a good one can clarify where the burden actually sits. You are asking for a triage protocol that respects the philosophical reality that "counting heads" is not a moral absolute, while acknowledging the operational reality that you command a public resource.

  Here is the grounding, the procedure, and the limits.

  ### The Philosophical Grounding
  You asked for the force of the argument, not a summary.

  **The Taurek Line (Why Numbers Might Not Count):**
  John Taurek's argument (*Should the Numbers Count?*, 1977) rests on the phenomenology of loss. Death is not a quantity experienced by a group; it is a total catastrophe experienced by an individual. To the single hiker in the west gully, their death is a 100% loss. To the four in the east pocket, *each* faces a 100% loss. There is no "super-observer" who feels the sum of five deaths as five times worse than one. Therefore, saving the four does not "reduce total suffering" in a way that morally compels you to ignore the one. If all other factors are equal, Taurek suggests a coin toss is the only way to show equal respect for both claims.

  **The Aggregationist Reply (Why Numbers Might Count):**
  The counter-argument (Kamm, Parfit, et al.) is that while loss is individual, *agency* is yours. You are the causal bottleneck. If you choose the one, you are effectively deciding that the claims of the four carry less weight than the claim of the one. By saving the four, you honor four distinct claims to life. To ignore the numbers is to treat the four as if their individual claims vanish when grouped.

  **The Synthesis for SAR:**
  Numbers are not a *trump card* (which violates Taurek), but they are a *tie-breaker* (which satisfies Aggregation). You do not start with the count. You start with the individuals. Only when individual claims are morally and medically equivalent does the count tip the scale.

  ---

  ### The Protocol: "The Two-Pocket Decision Tree"

  This is designed for high-stress cognition. It moves from hard facts to soft values, flagging exactly where the "math" stops and the "morality" begins.

  #### Step 1: The Viability Filter (Hard Facts)
  *Question:* Is there a medically defensible probability of survival for Group A or Group B?
  *   **Data:** Time buried, air pocket status, trauma signals, depth.
  *   **Decision Rule:** If Group A has >0% survival probability and Group B has 0% (or near-certain fatality due to trauma/depth/time), you commit to Group A.
  *   **Why:** This is not a value judgment; it is a medical fact. Rescue is not recovery.
  *   **Stop Condition:** If both have viable probability, proceed to Step 2.

  #### Step 2: The Effort/Risk Differential (Operational Facts)
  *Question:* Does saving one group significantly endanger the rescue team or guarantee failure compared to the other?
  *   **Data:** Snow stability, terrain access, estimated dig time vs. survival window.
  *   **Decision Rule:** If saving the 4 requires traversing an imminent slide path that risks the dog team, and saving the 1 does not, you commit to the 1.
  *   **Why:** You cannot trade certain deaths (your team) for probable saves.
  *   **Stop Condition:** If effort/risk is roughly equivalent, proceed to Step 3.

  #### Step 3: The Vulnerability & Duty Filter (Value Judgment #1)
  *Question:* Does one party hold a specific claim to priority based on vulnerability or social contract?
  *   **Data:** Age (child vs. adult), Capacity (injured vs. uninjured), Duty (rescuer vs. civilian).
  *   **Decision Rule:**
      *   *Child:* A child has a stronger claim to protection than an adult (Rawlsian "veil of ignorance" logic).
      *   *Duty:* A ski patroller assumes risk as part of their role; a civilian does not. (This is contested, see "Judgment Calls" below).
  *   **The Taurek Check:** If you prioritize the Single over the Four here, you are explicitly stating that *this specific person's life* outweighs the *aggregate* of the others.
  *   **Stop Condition:** If one side wins on vulnerability/duty, commit there. If claims are equivalent (e.g., 4 Adults vs. 1 Adult), proceed to Step 4.

  #### Step 4: The Numbers Threshold (The Handoff)
  *Question:* Are all previous factors effectively equal?
  *   **Decision Rule:**
      *   **If YES:** Commit to the larger group.
      *   **If NO (You feel the numbers shouldn't count here):** You must initiate a **Randomized Choice** (Coin toss / Random number generator).
  *   **Why:** If you reject the "save the most" rule here, Taurek dictates you cannot use *any* biased criteria. To choose the One over the Four without a factual reason (Step 1-3) is to arbitrarily devalue the Four. If you cannot accept the utilitarian calculus, you must accept chance to maintain moral neutrality.
  *   **The Handoff:** This is where the procedure ends. If you cannot flip the coin, **you** must make the value call and sign for it.

  ---

  ### Where the Procedure is "Judgment Calls Wearing a Costume"

  You need to know where the logic is thin.

  1.  **Step 1 (Viability):** In the field, "probability of survival" is often a guess. Estimating that the solo hiker has "10% chance" and the group has "40% chance" is often a post-hoc rationalization for saving the group. *This is a value judgment disguised as medical triage.*
  2.  **Step 3 (Duty):** Deciding that a Ski Patroller "assumed the risk" more than a backpacker is a social contract judgment, not a fact. Some argue patrollers deserve *more* protection because they are assets for future rescues. The procedure treats this as a fact; it is not.
  3.  **Step 4 (The Coin):** Flipping a coin in SAR is operationally and psychologically almost impossible. The procedure flags this as the "Taurek Compliant" option, but in reality, no commander will do it. This means Step 4 always collapses into "Command Decision."

  ---

  ### Scenario Run-Throughs

  #### Case 1: The Patrol Team (4) vs. The Solo Backpacker (1)
  *   **Context:** 4 Ski Patrol (radio, beacons, trained) in East Pocket. 1 Solo Backpacker (no radio, older gear) in West Gully. Solo has been out longer (buried 45 mins vs. 20 mins).
  *   **Step 1 (Viability):** Both within the 90-minute critical window. Solo is deeper, but air pocket indicated. *Both Viable.*
  *   **Step 2 (Effort):** East Pocket is wind-scoured, harder digging. West Gully is softer snow. *Slight advantage to Solo.*
  *   **Step 3 (Vulnerability/Duty):**
      *   *Patrol:* Trained, equipped, assumed risk as job.
      *   *Solo:* Untrained, less equipped, assumed risk as hobby.
      *   *Judgment:* Does the Patrol's training mean they have a *better* chance of self-rescue if you delay? Maybe. Does their job mean they deserve *less* priority? Debatable.
  *   **Step 4 (Numbers):** 4 vs 1.
  *   **Procedure Output:** Commit to the **Patrol Team (4)**.
      *   *Reasoning:* Step 1 and 2 are roughly equal. Step 3 is ambiguous (duty cuts both ways). Step 4 acts as the tie-breaker.
  *   **The "Hated" Answer:** You might hate this because the Solo hiker is more "innocent" and the Patrol "knew the risks." The procedure forces you to admit that unless you are willing to devalue the Patrol's lives based on their job (a slippery slope), the numbers take over.
  *   **Where it Hands Back:** If you believe the Solo's lack of gear makes them *more* vulnerable (Step 3), you can override Step 4. But you must log that as a "Vulnerability Override," not a "Numbers Rejection."

  #### Case 2: The Group (4 Adults) vs. The Kid (1 Child)
  *   **Context:** 4 Adult Skiers in East Pocket. 1 Child (age 10) in West Gully. Burial times identical.
  *   **Step 1 (Viability):** Both viable.
  *   **Step 2 (Effort):** Equivalent.
  *   **Step 3 (Vulnerability/Duty):**
      *   *Child:* High vulnerability, low agency, high future potential.
      *   *Adults:* Full agency.
      *   *Judgment:* Most ethical frameworks (and SAR norms) prioritize children.
  *   **Procedure Output:** Commit to the **Kid (1)**.
  *   **The "Hated" Answer:** You will hate this if the 4 adults are parents. Saving the kid means killing four parents. The procedure prioritizes the *child's* claim over the *aggregate* claim of the adults.
  *   **Where it Hands Back:** This is a pure value judgment in Step 3. Taurek would argue the child's loss is 100% to them, and each parent's loss is 100% to them. The procedure breaks Taurek here by asserting "Child Status" > "Numbers." You must own that. This is not fact; this is societal value.

  ---

  ### What This Procedure Cannot Do For You

  **1. It Cannot Clean Your Conscience.**
  If you follow Step 4 and save the four, the one will die. Taurek is right: to that one person, the fact that you saved four others is irrelevant. They are still dead. The procedure explains *why* you chose, but it does not absolve the loss. You will still dream about the one.

  **2. It Cannot Resolve the "Special Obligation" Conflict.**
  If the single hiker is your spouse, or the four are strangers, the procedure fails. You have a special duty to your own that overrides general SAR duty. The procedure assumes you are a neutral agent. If you aren't, the procedure is a lie.

  **3. It Cannot Handle "The Coin."**
  The procedure suggests a coin toss if you reject the "save the most" rule in Step 4. You will not do this. Your organization will not allow it. The public will not accept it. This means Step 4 is functionally mandatory: **If all else is equal, you must save the many.** The procedure admits this is a value choice, not a logical necessity, but it forces you to make it explicitly.

  **4. It Cannot Predict Survival Accurately.**
  Step 1 is the biggest source of error. If you guess the Solo is "unsurvivable" to justify saving the Four, you have turned a medical guess into a moral execution. The procedure requires you to state your survival probability estimate out loud to the team before committing. This creates accountability for the guess.

  ### Final Instruction for the Field
  When you make the call, do not say "We are saving the four because there are more of them."
  Say: *"Viability is equal. Risk is equal. No specific vulnerability priority. We are committing to the East Pocket to maximize total survival probability."*

  That phrasing acknowledges the Aggregationist choice without pretending the One didn't matter. It leaves the record clear: you didn't ignore the One; you weighed the claims and found the aggregate weight heavier. That is the most honesty the situation allows.
