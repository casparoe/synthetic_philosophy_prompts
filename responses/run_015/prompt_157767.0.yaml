answer: |-
  This is a sophisticated inquiry that cuts to the core of the philosophy of history. You are identifying a tension between **nomothetic** methods (seeking general laws, often statistical) and **idiographic** methods (seeking understanding of particular events), and observing how institutional gatekeeping enforces this distinction.

  The rejection of frameworks like Fomenko's *New Chronology*—not merely on the grounds of specific calculation errors, but on the grounds of disciplinary illegitimacy—reveals a specific epistemological commitment within mainstream historiography. Below is a reconstruction of that implicit theory, an analysis of its internal consistency, and a projection of the institutional consequences were that theory replaced by a strict falsificationist or probabilistic model.

  ### 1. The Implicit Epistemology: Causal Realism and Inference to the Best Explanation

  The practice you describe presupposes an epistemology best described as **Critical Realism** operationalized through **Inference to the Best Explanation (IBE)**.

  *   **Not Social Constructivism:** If history treated facts purely as socially constructed narratives, statistical correlations would be just as valid as textual interpretations, provided they formed a coherent story. The rejection of statistical revisionism implies that historians believe there is a *mind-independent past* that constrains narrative construction.
  *   **Not Positivist Empiricism:** If history were purely positivist, a statistically robust model that predicted astronomical data (like eclipses) might be accepted even if it contradicted textual tradition (as per Duhem-Quine). The rejection implies that predictive success is insufficient without **causal mechanism**.

  **The Privileging of Continuity:**
  Mainstream historiography privileges hermeneutic (textual) and material (archaeological) continuity because these provide **causal chains**.
  *   **Material Continuity:** Stratigraphy and radiometric dating rely on physical causal processes (decay, deposition) that are continuous and independent of human memory.
  *   **Hermeneutic Continuity:** Textual transmission involves physical copies, translations, and references that link the present to the past through a chain of human agency.

  Statistical correlations between dynastic timelines (e.g., "Reign A looks like Reign B"), by contrast, identify **patterns** but not **mechanisms**. To accept Fomenko's thesis, one must posit a causal mechanism capable of erasing 1,000 years of physical history (tree rings, ice cores, sediment layers) across the entire globe without leaving a trace in the physical record, solely to satisfy a statistical compression of texts.

  Therefore, the implicit theory treats historical facts as **causally embedded events**. A "fact" is not just a data point; it is a node in a web of physical and agential causality. A statistical correlation that severs the physical web to save the data pattern is rejected not because the math is wrong, but because it is **ontologically extravagant**.

  ### 2. Internal Consistency: Probabilistic Weighing vs. Statistical Coherence

  You ask if this practice is internally consistent, given that mainstream historiography employs probabilistic weighing of textual accounts.

  **The Consistency Argument:**
  The practice is consistent if one distinguishes between **Bayesian Priors based on Consilience** versus **Statistical Fit**.

  *   **Mainstream Historiography:** Uses a Bayesian approach where the "prior probability" of a claim is determined by **consilience** (the convergence of independent evidence). A textual claim is accepted if it aligns with archaeology, astronomy, and linguistics. When texts conflict, historians weigh probabilities based on source proximity and bias.
  *   **Statistical Revisionism:** Often maximizes **likelihood** (fit to the specific dataset) while ignoring the **prior probability** of the required causal assumptions.

  **The Demarcation:**
  The gatekeepers are effectively arguing that **correlation is not causation**. In the philosophy of science, a model that fits data but violates established causal laws (e.g., physics of radiometric decay, biology of dendrochronology) is considered *ad hoc*.
  *   When a historian adjusts a date based on a contested radiometric calibration, they are working *within* the causal framework of physics.
  *   When a revisionist adjusts a date based on dynastic similarity, they are proposing a new causal framework (massive global forgery/error) that contradicts the causal framework of physics and biology.

  Thus, the inconsistency is only apparent. The discipline consistently prioritizes **explanatory power** (which requires causal mechanisms) over **descriptive fit** (which requires only pattern recognition).

  ### 3. Counterfactual: Institutional Changes Under a Falsificationist/Probabilistic Criterion

  If the discipline were to shift its demarcation criterion to prioritize **empirical predictive success and statistical robustness** over hermeneutic/material continuity (effectively treating history as a branch of data science or cliodynamics), the institutional changes would be radical:

  **A. Peer Review Norms**
  *   **Current:** Reviewers assess plausibility within the existing causal web. Does this fit what we know about pottery, trade, and language?
  *   **New:** Reviewers would assess statistical significance and predictive power. A paper could be accepted if it successfully predicts the location of undiscovered artifacts based on algorithmic timeline compression, even if it contradicts established textual narratives. "Plausibility" would be replaced by "p-value."

  **B. Museum Labeling Protocols**
  *   **Current:** Labels assert definitive attributions based on consensus ("Roman, 2nd Century AD").
  *   **New:** Labels would become probabilistic distributions ("65% probability of 2nd Century AD origin; 35% probability of 14th Century AD origin"). Museums would function less as archives of truth and more as visualizations of competing models.

  **C. Textbook Authorization**
  *   **Current:** Textbooks present a synthesized narrative, marginalizing fringe theories as footnotes or pseudoscience.
  *   **New:** Textbooks would present competing chronological models side-by-side, evaluated by their predictive accuracy. Students would learn that "History" is a set of competing algorithms, not a settled narrative. The concept of a "canon" would dissolve into "best-fit models."

  **D. The Role of the Historian**
  *   **Current:** The historian is an interpreter of traces, reconstructing agency and meaning.
  *   **New:** The historian becomes a modeler, optimizing variables to minimize error between the timeline and the data. Human agency would be reduced to a variable in a function.

  ### 4. Conclusion: The Nature of the Demarcation

  The institutional rejection of statistical chronological revisionism presupposes that **history is a science of the particular, not the general.**

  By rejecting Fomenko-style revisionism as "outside the discipline," gatekeepers are enforcing a **methodological naturalism** that requires historical claims to be compatible with findings in physics, biology, and geology. They are asserting that **time is a physical dimension**, not just a textual variable.

  The implicit theory is that historical knowledge is **abductive**: it infers the best explanation for the totality of traces (texts, atoms, stars). Statistical revisionism is rejected because it offers a *better fit for a subset of data* (texts/astronomy) at the cost of a *worse explanation for the totality of evidence* (ignoring geology, biology, material culture).

  If the discipline adopted a strict falsificationist criterion, it would cease to be "history" in the humanistic sense and would become **temporal data modeling**. The current practice remains internally consistent so long as the goal of history is understood as **reconstructing causal reality** rather than **optimizing data compression**. The demarcation is not between "true" and "false" math, but between "causally grounded" and "causally unmoored" inference.
