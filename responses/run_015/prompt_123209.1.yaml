      *   **Role:** Professional political philosopher.
      *   **Task:** Create a set of desiderata (requirements/specifications) for a theory that explains what holds "left" and "right" together (or defines the axis).
      *   **Constraints:**
          *   No bibliography/citations/reading lists.
          *   Start with quick brainstorming.
