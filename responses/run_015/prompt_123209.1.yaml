prompt: |-
  hey im putting together a dataset but this left/right thing just got personal — my dad went full libertarian tech-bro and my sister is organizing tenant strikes and yet they both think the local planning board is corrupt, so im genuinely trying to figure out if the axis is even real. can you act like a professional political philosopher and think carefully? start with some quick brainstorming: if we wanted a theory that actually explains what holds the left and right together, what would it have to deliver? write me the full desiderata — not a bibliography, no citations please, i dont want reading lists — just the spec. it has to handle weird family cases like mine where enemies agree on institutional distrust, it cant collapse tactical coalitions into deep value alignment, and it needs to say whether the distinction survives cross-national comparison or just dies outside the US. flag any two requirements that probably cant be jointly satisfied. keep it in the weeds: dont list generic categories like "economic vs social issues," i want the specific conceptual moves each requirement forces. also tell me which single requirement knocks out the most popular theories, and do the brainstorming first before laying out the list with reasoning behind each point. please start by brainstorming a bit, then give the structured list.
