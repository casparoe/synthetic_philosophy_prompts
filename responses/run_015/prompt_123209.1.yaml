          *   Keep it "in the weeds" (specific conceptual moves, not generic categories like "economic vs. social").
          *   Flag two requirements that probably can't be jointly satisfied.
          *   Identify which single requirement knocks out the most popular theories.
      *   **Tone:** Thoughtful, analytical, philosophical, precise.

  2.  **Brainstorming Phase:**
      *   *The Core Problem:* The user's anecdote highlights the "horseshoe theory" problem or the "populist vs. establishment" cleavage overriding the traditional left/right economic cleavage. Dad (Right/Libertarian) and Sister (Left/Socialist) agree on corruption (anti-establishment).
      *   *What defines Left/Right?* Is it equality vs. hierarchy? Change vs. tradition? State vs. Market? None of these fit perfectly across all contexts.
      *   *Requirement 1 (The Family Test):* The theory must distinguish between *why* they hate the planning board. Dad hates it because it restricts property rights/market freedom. Sister hates it because it protects capital interests/excludes tenants. Same target, different normative grounds. The theory must capture the *grounding* of the critique, not just the target.
      *   *Requirement 2 (Coalition vs. Value):* People ally for convenience. A theory shouldn't say libertarians and socialists are "close" just because they both protest. It needs to separate *strategic convergence* from *axiological proximity*.
      *   *Requirement 3 (Cross-National):* In the US, "liberal" means left. In Europe, "liberal" often means classical liberal (right-ish). In Brazil, left/right shifts differently. The theory needs abstract enough categories to translate but concrete enough to mean something. Is it universal or contextual?
      *   *Requirement 4 (Dynamic vs. Static):* Positions shift. What was left in 1800 (classical liberalism) is right today. The theory needs to account for the *axis of rotation*, not just fixed points.
      *   *Requirement 5 (The "Realness" Question):* Does the axis exist ontologically or is it just a heuristic? The theory needs to decide if it's describing a psychological reality, a sociological grouping, or a logical space of policy options.
      *   *Conflict:* Universal applicability vs. Contextual specificity. If it's too abstract to fit all nations, it's vacuous. If it's too specific to US politics, it fails cross-national comparison.
      *   *Killer Requirement:* The one that distinguishes *grounds* vs. *targets* (Requirement 1 above) kills most polling-based theories that just cluster policy preferences without asking "why."

  3.  **Drafting the Desiderata (Iterative Refinement):**
      *   *Need to avoid generic labels.* Instead of "Economic position," use "Normative grounding of resource allocation."
      *   *Need to address the corruption agreement.* The theory must differentiate anti-establishment sentiment based on the *ideal* being violated (e.g., meritocratic fairness vs. procedural liberty).
      *   *Need to address the coalition issue.* Distinguish "overlap in opposition" from "overlap in vision."
      *   *Need to address the cross-national issue.* Is the axis defined by relation to hierarchy? Relation to change?
      *   *Identify the incompatible pair:* Universalism vs. Historical Specificity.
      *   *Identify the killer requirement:* The one requiring normative grounding rather than policy clustering.

  4.  **Refining the "In the Weeds" constraint:**
      *   Avoid: "Must explain economic views."
      *   Use: "Must distinguish between objections based on distributive outcomes versus objections based on procedural encumbrances."
      *   Avoid: "Must work everywhere."
      *   Use: "Must decouple the axis from specific institutional arrangements (e.g., welfare states) to allow translation across regimes."

  5.  **Selecting the Incompatible Pair:**
      *   Candidate 1: Cross-national universality vs. Historical sensitivity. (If you define Left/Right as "Change vs. Tradition," it flips meaning depending on the status quo. If you define it as "Equality vs. Hierarchy," it might not fit societies where hierarchy isn't the main cleavage.)
      *   Let's go with: **Contextual Sensitivity** (meaning changes with status quo) vs. **Transhistorical Stability** (meaning stays constant across time/place). You can't have both. If Left means "progressive change," then in a reactionary regime, a liberal is Left. If Left means "egalitarianism," a liberal might not be Left.

  6.  **Selecting the Killer Requirement:**
      *   Most popular theories are based on policy clustering (e.g., Nolan Chart, Pournelle Chart, or simple polling correlations).
      *   The requirement that demands **Normative Grounding Discrimination** (distinguishing *why* someone holds a view, not just *what* view) kills these. It forces the theory to look at moral philosophy, not just voting records.

  7.  **Final Review against Constraints:**
      *   Start with brainstorming? Yes.
      *   Structured list with reasoning? Yes.
      *   No citations/biblio? Yes.
      *   Handle family case (enemies agree)? Yes.
      *   Handle tactical coalitions? Yes.
      *   Handle cross-national? Yes.
      *   Flag two incompatible requirements? Yes.
      *   Identify killer requirement? Yes.
      *   Tone: Professional political philosopher.

  8.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Check:* Did I get too abstract? Make sure to reference the planning board example to keep it grounded.
      *   *Check:* Did I avoid "economic vs social"? Yes, focus on normative grounds.
      *   *Check:* Is the brainstorming distinct from the list? Yes.

  9.  **Final Polish:** Ensure the voice sounds like a philosopher thinking through a spec sheet. Clear, precise, slightly academic but accessible.

