answer: |-
  ### Brainstorming: The Architecture of a Political Axis

  You're hitting on the fundamental instability of political taxonomy. The standard models break down because they map *policy preferences* (what you want) rather than *normative grounds* (why you want it). Your dad and your sister are the perfect stress test: they occupy the same coordinate on a map of "anti-establishment sentiment," but they are navigating by different compasses. If a theory calls them "allies" because they both hate the planning board, it's useless. It's mistaking a temporary trench-sharing arrangement for shared geography.

  To build a spec that actually works, we have to stop treating Left/Right as a inventory of policy positions (tax rates, zoning laws) and start treating it as a grammar of justification. The theory needs to explain the *logic* of the objection, not just the object. If your dad objects to zoning because it violates property rights (procedural liberty) and your sister objects because it enforces class exclusion (distributive justice), the theory must place them far apart despite the convergent behavior.

  Furthermore, we have to deal with the "status quo problem." In 1800, a classical liberal was Left; today, they are often Right. If the axis is defined by "change vs. tradition," it flips depending on what exists. If it's defined by "equality vs. hierarchy," it might not capture the libertarian objection to state power that isn't strictly about hierarchy. A robust theory needs to decide if it's describing a psychological disposition, a sociological coalition, or a logical space of moral claims. It can't be all three without contradicting itself. Finally, we need to know if this is a US-specific bug or a global feature. If the theory relies on the existence of a welfare state to define the Left, it dies in contexts where the welfare state doesn't exist. The spec needs to demand abstraction without becoming vacuous.

  ***

  ### Desiderata for a Robust Left/Right Theory

  Here is the specification list for a theory of political orientation that survives the family dinner test and cross-border scrutiny.

  **1. Normative Grounding Discrimination**
  *   **The Spec:** The theory must distinguish between political positions based on the underlying moral justification rather than the policy outcome. It must be able to categorize two actors who oppose the same institution (e.g., the planning board) as politically distant if their objections rely on incompatible first principles.
  *   **The Reasoning:** This addresses your family case. A theory that clusters people by "who they hate" or "what they oppose" will falsely converge libertarians and socialists. This requirement forces the theory to analyze the *because*. If the objection is "this restricts my freedom to contract," that maps differently than "this restricts my access to housing." The axis must measure the moral vocabulary, not just the voting record.

  **2. Strategic vs. Axiological Separation**
  *   **The Spec:** The theory must explicitly decouple tactical coalitions from deep value alignment. It must have a mechanism to label an agreement as "instrumental" rather than "ideological."
  *   **The Reasoning:** Politics is full of strange bedfellows. Populist movements often fuse left-economic and right-cultural sentiments. If the theory treats every coalition as a coherent ideological block, it will create nonsense categories (like "liberal socialism" vs "conservative socialism" without defining the terms). This requirement ensures the theory can describe a temporary alliance against corruption without claiming the allies share a vision of the good society.

  **3. Status Quo Independence**
  *   **The Spec:** The definition of Left and Right cannot rely on a binary of "supporting change" vs. "supporting tradition." The axis must remain stable even if the status quo shifts dramatically.
  *   **The Reasoning:** This is the cross-national survival test. If "Left" means "progressive change," then in a feudal society, a liberal bourgeois is Left, but in a liberal society, a socialist is Left. This makes the term meaningless across time. The theory must define the poles by something intrinsic (e.g., attitudes toward hierarchy, universalism vs. particularism) that doesn't flip just because the government changed hands.
  *   **⚠️ CONFLICT FLAG:** This requirement likely cannot be jointly satisfied with **Requirement 4 (Historical Contextualization)**. You cannot have an axis that is completely independent of the status quo *and* one that respects the specific historical meaning of terms in specific regimes. If you prioritize Status Quo Independence, you risk abstraction so high it loses touch with real political fights. If you prioritize Contextualization, you lose cross-national comparability.

  **4. Institutional Agnosticism**
  *   **The Spec:** The theory cannot define the axis using specific institutional arrangements (e.g., "support for welfare states" or "support for free markets") as primary markers. It must define the axis using abstract functions that those institutions serve.
  *   **The Reasoning:** In some countries, the "Right" supports state intervention to protect national industry; in others, the "Right" supports laissez-faire. If your theory hardcodes "markets = Right," it fails globally. Instead, it must ask what the market *represents* in that context (e.g., is it a tool for individual autonomy or a mechanism for national strength?). The theory must translate institutional preferences into underlying functional goals.

  **5. Dimensional Integrity (Non-Collapse)**
  *   **The Spec:** The theory must resist collapsing distinct conflicts into a single linear spectrum unless it can prove they are mathematically correlated across all contexts. It must allow for the possibility that "economic" and "cultural" axes are orthogonal.
  *   **The Reasoning:** Many popular theories fail because they force a 2D reality onto a 1D line. Your dad might be economically Right and socially Liberal; your sister might be economically Left and socially Liberal. If the theory forces them onto a single Left/Right line, it distorts their actual relationship. The spec demands the theory acknowledge where the single axis breaks and requires a multi-dimensional space.

  **6. Asymmetry Recognition**
  *   **The Spec:** The theory must account for the possibility that the Left and Right are not mirror images of each other. It must allow for one side to be defined by a specific content (e.g., equality) and the other by a procedural form (e.g., order), rather than assuming symmetrical opposites.
  *   **The Reasoning:** Many models assume Left and Right are symmetrical poles (like magnets). But historically, the Right often defines itself by what it preserves (which changes), while the Left defines itself by a universal goal (which is constant). A rigid symmetrical model fails to capture why the Right often looks different in different countries while the Left retains more thematic continuity (or vice versa).

  ***

  ### The Killer Requirement

  **Requirement 1 (Normative Grounding Discrimination)** is the single requirement that knocks out the most popular theories.

  **Why:** Most existing models—whether they are political compass quizzes, polling aggregations, or media heuristics—cluster people based on **policy preference correlation**. They assume that if you oppose zoning, you belong in Box A. They do not interrogate the *justification* for the opposition.

  To satisfy Requirement 1, a theory cannot just survey "Do you support zoning?" It must survey "Why do you support/oppose zoning?" This demands a level of philosophical granularity that almost no dataset captures. It requires distinguishing between a libertarian who opposes zoning because it violates property rights and a socialist who opposes zoning because it creates artificial scarcity. Most popular theories (like the Nolan Chart or standard Left-Right spectrums) would place these two actors closer together than they actually are because they look at the *output* (anti-zoning) rather than the *input* (normative ground). Implementing this requirement would invalidate most existing political datasets because they lack the metadata on *moral reasoning*.

  ### The Incompatible Pair

  As flagged in Requirement 3, the tension lies between **Status Quo Independence** and **Historical Contextualization**.

  *   **Status Quo Independence** demands that "Left" means the same thing in 1800 France as it does in 2024 America.
  *   **Historical Contextualization** demands that "Left" means "the side challenging the current dominant hierarchy," which changes meaning depending on what the hierarchy is.

  You cannot have both. If you choose Independence, you risk defining Left/Right so abstractly (e.g., "Universalism vs. Particularism") that it no longer predicts voting behavior. If you choose Contextualization, you admit the axis is relative, meaning you cannot compare your dad's libertarianism to a libertarian in another century or nation without losing the thread. A professional theory must choose which error it is willing to tolerate: vacuous universalism or useful relativism.
