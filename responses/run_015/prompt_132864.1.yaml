answer: |-
  ### The Logical Space

  To sort teenagers into philosophical positions without using philosophy words, we need three axes of disagreement. These axes determine which "Leaf" (final position) a student lands on.

  1.  **The Source Axis (Why follow the rule?):**
      *   *Harm/Reliance:* I follow it because a specific person loses money or safety if I don't.
      *   *Order/Rule:* I follow it because it's the law or the custom here.
      *   *Signal/Expressive:* I follow it because of what my action says about me to others.
      *   *None/Prudence:* I follow it only if I get caught or it benefits me.

  2.  **The Scope Axis (Whose rules count?):**
      *   *Local:* When in Rome, do as Romans do.
      *   *Universal:* Right is right, everywhere.
      *   *Visitor:* I get a pass because I'm new, OR I must be extra careful because I'm a guest.

  3.  **The Capacity Axis (Can I opt out?):**
      *   *Strict:* No exceptions (even if broke).
      *   *Flexible:* If I can't afford it or no one is hurt, I'm free.

  **The Leaves (Positions):**
  Based on combinations of the above, we get these profiles:
  1.  **The Provider (Reliance):** Rules matter because workers/people depend on them (Tips = Wages).
  2.  **The Guest (Local Ethic):** Rules matter because I am in someone else's home/country.
  3.  **The Citizen (Universalist):** Rules matter because fairness is the same everywhere.
  4.  **The Role Model (Expressive):** Rules matter because I am being watched (Kid seeing you).
  5.  **The Pragmatist (Prudential):** Rules matter only to avoid trouble (Jaywalk if safe).
  6.  **The Skeptic (Etiquette Only):** Rules are just habits, no real moral weight.
  7.  **The Glitch (Collision):** When rules fight (Rigged line), the system breaks.

  **Integrating Your Tests:**
  *   *Host-Cost:* Used in Q1 (Tip) and Q8 (Broke). Distinguishes Provider from Skeptic.
  *   *Double-Standard:* Used in Q6 (Everyone Jaywalks). Distinguishes Pragmatist from Citizen.
  *   *Short-Timer/Mirror:* Used in Q9 (Visitor in your home). Distinguishes Guest from Universalist.
  *   *Kid-Seeing-You:* Used in Q7. Isolates the Role Model.
  *   *Money Asymmetry:* Used in Q2 (Tip where not needed) and Q8 (Broke).
  *   *Rigged Queue:* Used in Q5. Creates the "Glitch" leaf.

  ***

