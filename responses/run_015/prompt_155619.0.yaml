answer: |-
  Here is a precisification of the distinct theses contained within the phrase "he was a man of his time," structured as a menu for your panel's deliberation.

  ### I. Claims about the Truth or Variability of Moral Standards

  **1. The Ontological Relativist Thesis**
  *   **Thesis:** Moral truths are not timeless but are constituted by the consensus of the era in which the agent acts; therefore, an action wrong today was not wrong then.
  *   **Classification:** False (philosophically). While moral *consensus* varies, the claim that moral *truth* varies is difficult to defend without collapsing into nihilism.
  *   **Definition of 'Standards':** The prevailing moral ontology of the period.
  *   **Licensing:** Licences the retention of celebratory framing without qualification (since no moral error occurred). Forbids retrospective condemnation.
  *   **Asymmetry Test:** Fails. If moral truth is relative, his virtues (e.g., Churchill's defiance) are also merely 'right for the time' rather than objectively good. The phrase is not deployed to diminish his virtues, suggesting this is not the operative logic.

  **2. The Moral Progress Thesis**
  *   **Thesis:** Moral understanding evolves; we possess moral knowledge now that was unavailable or undeveloped then, making retrospective judgement anachronistic.
  *   **Classification:** Substantive and defensible, but contingent on the specific moral issue.
  *   **Definition of 'Standards':** The best moral reasoning available at the time.
  *   **Licensing:** Licences explaining the conduct as an error of the past without condemning the agent's character. Forbids treating the conduct as a current moral option.
  *   **Asymmetry Test:** Partially succeeds. It explains why we don't condemn the vice (they didn't know better), but struggles to explain why we still praise the virtue (did they know that better?). It implies a selective application of moral progress.

  ### II. Claims about What was Knowable or Reasonable to Believe

  **3. The Epistemic Dominance Thesis**
  *   **Thesis:** Although dissenting voices existed, the weight of expert, religious, and social opinion was so heavily against the dissenting view that believing the majority position was the only reasonable epistemic stance.
  *   **Classification:** Substantive. (Note: Given your stipulation that contemporaries *did* criticise them, this thesis relies on the claim that the critics were marginal or easily dismissed).
  *   **Definition of 'Standards':** The dominant intellectual consensus, excluding fringe criticism.
  *   **Licensing:** Licences excusing the agent from charges of ignorance or malice. Forbids claiming the agent *should* have known better.
  *   **Asymmetry Test:** Fails. If the epistemic environment dictated his actions, it also dictated his virtues. If he is excused for slavery because 'everyone did it', he cannot be praised for leadership, because 'everyone expected it'. The asymmetry suggests this is a selective shield.

  ### III. Claims about Excuse, Blameworthiness and Alternatives

  **4. The Social Coercion Thesis**
  *   **Thesis:** The social, economic, or legal costs of acting against the norms were so prohibitive that the agent lacked a feasible alternative; 'ought implies can'.
  *   **Classification:** Substantive and empirically testable.
  *   **Definition of 'Standards':** The realistic range of action available to someone of his social position.
  *   **Licensing:** Licences removing personal blame while acknowledging the act was harmful. Forbids holding the agent solely responsible for structural evils.
  *   **Asymmetry Test:** Succeeds partially. It explains why we excuse the vice (cost of dissent was too high) but not the virtue (cost of sailing/surrendering was also high, yet we praise the choice). However, it reveals the phrase is functioning as a selective excuse for the vice, not a general theory of agency.

  **5. The Counterfactual Humility Thesis**
  *   **Thesis:** If we were placed in his exact position, with his psychology and information, we would have acted identically; therefore, we lack the standing to condemn.
  *   **Classification:** Platitude (unfalsifiable). It functions as a rhetorical check on moral superiority rather than a historical claim.
  *   **Definition of 'Standards':** The hypothetical behaviour of a modern person in the historical context.
  *   **Licensing:** Licences ending the discussion on condemnation (shifting focus to human nature). Forbids moral posturing by the panel.
  *   **Asymmetry Test:** Succeeds. It is only invoked where modern people fear they might fail the test (the vices). We do not say "he was a man of his time" regarding Churchill's refusal to surrender because we hope we *would* have the courage to do the same. The asymmetry confirms the phrase is a defence mechanism against specific shame.

  **6. The Moral Residue Thesis**
  *   **Thesis:** We can judge the *act* as wrong by today's standards while excusing the *agent* from full blameworthiness due to historical context; the two judgements are distinct.
  *   **Classification:** Substantive and defensible.
  *   **Definition of 'Standards':** Today's standards for the act; historical standards for the agent.
  *   **Licensing:** Licences a nuanced interpretation (condemn the slavery, explain the man). Forbids both hagiography and cancellation.
  *   **Asymmetry Test:** Succeeds. It accounts for why the phrase is used only for the condemned acts. We do not need to excuse the virtues using historical context; we can accept them as genuine. This reading treats the phrase as a specific tool for managing moral residue, not a universal law.

  ### IV. Claims about the Point of Commemoration

  **7. The Exemplarity Threshold Thesis**
  *   **Thesis:** Public commemoration is reserved for those who transcended the moral limitations of their era; to be merely 'of one's time' is to fail the test of greatness.
  *   **Classification:** Substantive. (This is the reading used by the member arguing for removal).
  *   **Definition of 'Standards':** The standards of the present, applied as a filter for historical inclusion.
  *   **Licensing:** Licences removing the figure from celebratory spaces. Forbids commemorating figures who upheld the worst norms of their day, regardless of other achievements.
  *   **Asymmetry Test:** Succeeds. It explains the asymmetry by design. We do not use the phrase to explain his virtues because if he was *only* a man of his time, the virtues are not exemplary enough to warrant statues. This reading turns the phrase from a shield into a sword.

  **8. The Pedagogical Neutrality Thesis**
  *   **Thesis:** The purpose of a civic museum is to represent historical significance, not to issue moral verdicts; 'man of his time' signals a shift from evaluation to description.
  *   **Classification:** Substantive, though arguably naive about the inevitability of interpretation.
  *   **Definition of 'Standards':** Irrelevant; the museum suspends judgement.
  *   **Licensing:** Licences keeping the figure in the gallery with contextual text. Forbids removing the figure based on moral offence.
  *   **Asymmetry Test:** Fails. A museum cannot be truly neutral. By invoking the phrase only for the vices, the panel is already making a moral distinction. The asymmetry shows that 'neutrality' is being selectively applied to the contentious parts of the biography.

  ***

  ### Analysis: What settles the matter?

  When your colleague says the phrase "settles the matter," she is most likely reaching for **Thesis 5: The Counterfactual Humility Thesis**.

  This is the reading that functions as a conversation stopper. By asserting "we would have done the same," she attempts to dissolve the moral tension entirely. It renders the panel's deliberation moot because if the conduct was inevitable for any human in that position, then debating the *interpretation* of that conduct becomes an exercise in modern vanity rather than historical understanding. It appeals to a shared sense of human fallibility to bypass the need for a difficult decision.

  **Does it settle it?**
  No. It creates an illusion of settlement. It fails because museums are not time machines; they are contemporary institutions making choices about what to value *now*. Even if we accept we would have acted as Columbus did, we still must decide whether to *honour* him today. The counterfactual claim addresses blame, but it does not address **value**. We might forgive a figure without wishing to commemorate them.

  **The Better Question**
  The panel should stop asking whether we can *judge* him (we clearly are, otherwise the phrase wouldn't be necessary) and instead ask:

  > *"Does this figure's historical significance depend on his moral transcendence of his era, or does it rest solely on his impact?"*

  If the gallery is about **impact** (Trade, Empire, Exploration), then his moral failings are contextual data, not disqualifiers. If the gallery is about **civic values** (what we aspire to be), then the "Exemplarity Threshold" (Thesis 7) applies. The phrase "man of his time" is a proxy for this unresolved conflict over the museum's purpose. You must decide whether the gallery is a mirror of the past or a model for the future.
