  | ID | Method Name | Awkward Commitment | Cheapest Experiment |
  | :--- | :--- | :--- | :--- |
  | L1 | Formal Spec | Tasks must be fully specifiable | Write a test suite for the refactor |
  | L2 | Recursive Reward Modelling | Delayed signals propagate cleanly | Train on simulated delayed feedback |
  | L3 | Iterated Amplification | Decomposition preserves truth | Compare decomposed vs monolithic answers |
