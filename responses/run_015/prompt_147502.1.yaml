  | L5 | Comparative/Ranking | Relative quality implies absolute safety | A/B test ranked outputs on safety |
  | L6 | Debate | Truth wins arguments reliably | Pit two models on a factual query |
  | L7 | Capability Restriction | Utility loss is acceptable | Measure productivity drop when blocking task |
  | L8 | Risk Management | Safety is probabilistic, not guaranteed | Deploy with monitoring and rollback |
  | L9 | Scale RLHF | Gaps won't open as capability grows | Train on easy tasks, eval on hard ones |
