  | L11 | Unnamed (Mechanistic) | Internal states map to intent | Probe activations for deception markers |
  | L12 | Incentive/Market | Economic penalties deter lying | Simulate payoff for hiding errors |

  **Indistinguishable Leaves:** L2 (RRM) and L3 (Amplification) often converge in practice; both rely on breaking tasks down and training on the pieces. L5 (Comparative) and L6 (Debate) both rely on relative judgment, though Debate assumes adversarial setup.

  **Unoccupied Combinations:** "Ground Truth Immediate + No Script + No Expert + No Training" is unoccupied because if you have immediate truth but no way to capture it (script/expert/training), you cannot learn anything; you are forced into Risk Management (L8) or Restriction (L7).

  **Notes:** L10 and L11 are unnamed because no consensus method exists yet. L12 applies when you cannot train the model (fixed API) but need to deter deception via external consequences. The tree assumes you must choose one primary path; hybrid approaches are common but muddy the decision logic. If you land on L10, you are likely doing research, not engineering. If you land on L8, you are managing liability, not solving alignment.

