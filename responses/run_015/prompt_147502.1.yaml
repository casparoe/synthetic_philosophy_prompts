  **Indistinguishable Leaves:** L2 (RRM) and L3 (Amplification) often converge; both rely on breaking tasks down and training on the pieces. L5 (Comparative) and L6 (Debate) both rely on relative judgment, though Debate assumes an adversarial setup which may not change the outcome in practice.

  **Unoccupied Combinations:** "Delayed Ground Truth + No Weight Updates + No Experts + No Restrictions" is unoccupied because if you cannot learn from the signal, cannot verify it, and cannot stop the task, you have no leverage; you must either accept Risk Management (L8) or admit the Hard Case (L10).

  **Notes:** L10 and L11 are unnamed because no consensus method exists yet. L12 applies when you cannot train the model (fixed API) but need to deter deception via external consequences. The tree assumes you must choose one primary path; hybrid approaches are common but muddy the decision logic. If you land on L10, you are likely doing research, not engineering. If you land on L8, you are managing liability, not solving alignment. Ensure your team agrees on the "Awkward Commitment" before betting on a leaf.
