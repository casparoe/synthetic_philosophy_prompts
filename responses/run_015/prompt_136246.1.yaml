      *   Check Claim 6 carefully. "The workspace architecture IS the function." If the architecture is *biological topology*, then the function is defined by the substrate. That's not functionalism; that's neural identity theory disguised.

  6.  **Final Review against Constraints:**
      *   Did I separate settled/contested? Yes.
      *   Did I rank tensions? Yes.
      *   Did I avoid telling them what to drop? Yes (framed as "what has to give").
      *   Did I brainstorm first? Yes (in the thought block, will summarize in output).
      *   Is the tone appropriate? Yes.

  7.  **Self-Correction during drafting:**
      *   *Correction on Claim 9:* Is 1st person authority incompatible with functionalism? Not necessarily (Shoemaker), but it's hard to square with *Dennett-style* heterophenomenology rejection. Dennett rejects 1st person authority *because* he's a functionalist/interpretationist. If the user is a functionalist but keeps 1st person authority, they need a specific argument (like Shoemaker's self-intimation). I need to flag this as a specific theoretical burden.
      *   *Correction on Claim 5 & 8:* Claim 8 says "identical functional states at every grain." If the "grain" includes biological micro-structure, then 5 and 8 are consistent. But Claim 2 says silicon/swarms can have beliefs (functional states). If silicon can match the functional grain of belief, why not consciousness? The definition of "grain" is the pivot point. I need to highlight this ambiguity.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Settled vs. Contested" section is prominent. Make sure the "Audit" is rigorous. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, Claim 6 says "only biology can realise that particular function." This is the crux. If the function is defined *by* the biology, it's not multiple realizable. If it's multiple realizable, biology isn't necessary. This is the core contradiction to hammer home.

