  7.  **Identifying the "Forbidden Question":**
      *   What would kill the project instantly? Probably: "Why wouldn't the model just learn to hedge probabilities to minimize loss without actually being honest?" or "Have you looked at [Specific Existing Paper] that already did this?" Let's go with the hedging/manipulation of the scoring rule itself.

  8.  **Review and Refine:**
