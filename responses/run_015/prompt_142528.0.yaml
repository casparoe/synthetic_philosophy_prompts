      *   *Objection 5 (Engineer):* "Calibration." Models are badly calibrated. Betting relies on calibration.
      *   *Objection 6 (Evaluation):* "Baseline Comparison." Why step-betting vs. just making the judge smarter or giving more time?
      *   *Objection 7 (Epistemologist):* "Testimony." Why should the judge trust the probability assignment itself?
      *   *Objection 8 (Program Officer):* "Timeline/Cost." Six months isn't enough to prove this works.

      *Refining Order by Damage:*
      1.  Evaluation (Empirical existence): If the problem doesn't exist, nothing matters.
      2.  Engineer (Training feasibility): If you can't train it, it's just philosophy.
      3.  Program Officer (Impact): If it doesn't change decisions, why fund?
      4.  Engineer (Calibration/Hacking): Specific technical failure mode.
      5.  Epistemologist (Justification of probabilities): Theoretical flaw in the fix.
      6.  Evaluation (Alternatives): Is this the best use of resources?
      7.  Epistemologist (Regress): Deep theoretical worry.
      8.  Program Officer (Timeline): Practical worry.

  4.  **Drafting Replies & Soft Spots:**
      *   Need to keep replies conversational, ~2 mins spoken.
      *   Need to highlight the "soft spot" honestly (as requested).
      *   *Tone:* Humble but confident in the intuition. Acknowledge the "self-taught" status but lean into the engineering intuition.

  5.  **Identifying Concessions (First 2 Slides):**
