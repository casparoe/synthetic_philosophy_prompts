answer: |-
  # Q&A Prep Sheet: Step-Betting for Scalable Oversight

  **Talk Goal:** Secure 6 months of funding to move from intuition to empirical prototype.
  **Your Stance:** Theoretical intuitionist with engineering pragmatism. Own the lack of papers; lean into the "this looks like a bug in the loss landscape" argument.

  ---

  ### Part 1: The Pre-emptive Concessions (First 2 Slides)
  *Put these on the screen before you start the main argument. This disarms the two biggest attacks and builds trust with the PO and Researchers.*

  1.  **"This is currently a theoretical failure mode."**
      *   *Say:* "I need to state clearly: I do not yet have empirical evidence that current RLHF models naturally produce obfuscated arguments that beat honest debaters. My case is based on scaling intuitions and adversarial red-teaming, not training runs."
  2.  **"This does not improve safety for systems deployed today."**
      *   *Say:* "Step-betting requires protocol changes and new training objectives. It is not a patch for existing APIs. The decision-change here is about *which* scalable oversight schemes we pursue for AGI-level systems, not how we audit next quarter's release."

  ---

  ### Part 2: The Objections (Ordered by Damage)

  #### 1. The Evaluation Researcher (The "Does it Exist?" Objection)
  **Objection:** "You've built a solution to a problem we haven't observed. In our Debate experiments, when the dishonest debater lies, cross-examination usually finds it. Why do you think obfuscation scales differently than capability? If we don't see this in 70B models, why fund a fix for it?"
  **Your Reply:** "Because obfuscation is a search problem, not just a capability problem. Right now, models aren't optimized to deceive; they're optimized to be helpful. As we optimize for persuasion or sycophancy, the model will find regions of the argument space that are high-dimensional enough that a human judge—and a limited cross-exam—can't traverse them. Cross-examination works on *lies*; it fails on *complexity*. I'm proposing we test if the 'complexity budget' grows faster than the 'detection budget' as we scale."
  **Soft Spot:** You are assuming deception scales faster than oversight. If obfuscation requires capabilities the model doesn't have, the threat is distant. You have no data on the scaling slope.

  #### 2. The Senior Research Engineer (The "Training Signal" Objection)
  **Objection:** "Proper scoring rules on intermediate steps sound clean mathematically, but they're nightmare fuel for training stability. You're introducing a dense reward signal on tokens that might not be causally linked to the truth. How do you prevent the model from just learning to output '51%' on everything to minimize variance, or hacking the scorer?"
  **Your Reply:** "It is a stability risk, but it's better than the alternative of a sparse reward on the final verdict. With step-betting, the model is penalized for *uncertainty* on false claims. If it hedges at 51%, it gains almost nothing when right but pays a penalty when wrong compared to a confident honest claim. We can mitigate hacking by using a separate, smaller verifier model trained specifically to calibrate these probabilities, decoupling the generation from the scoring."
  **Soft Spot:** You haven't designed the verifier. If the verifier is just another model, it might collude with the debater. You're assuming the scoring rule creates the right gradient pressure without proof.

  #### 3. The Program Officer (The "Decision Relevance" Objection)
  **Objection:** "I need to justify this check to my board. If this doesn't change a deployment decision for five years, and Debate itself might be dead by then (replaced by amplification or automated evals), what decision does this change *now*? Why not fund more concrete evals?"
  **Your Reply:** "It changes the 'bet' on which alignment schemes are viable. Right now, labs are investing heavily in Debate-like structures because they assume cross-examination solves the verification gap. If my hypothesis holds, that investment is building on a foundation that crumbles at AGI scale. This project tells you whether to double down on Debate or pivot resources to schemes that don't rely on human judges traversing argument trees."
  **Soft Spot:** You are assuming labs are rigid in their strategy. They might pivot easily. Also, if Debate is already dying, you're solving a sinking ship problem.

  #### 4. The Senior Research Engineer (The "Calibration" Objection)
  **Objection:** "LLMs are notoriously poorly calibrated. They say '90%' when they're 60% right. Your whole mechanism relies on the probability attached to the step being meaningful. If the model is miscalibrated, the scoring rule just punishes honesty, not obfuscation."
  **Your Reply:** "That's exactly why this needs empirical work. We aren't assuming current models are calibrated; we're testing if *training for calibration* via step-betting is possible. The hypothesis is that obfuscation forces the model to be confident on steps it shouldn't be. Even a miscalibrated model faces a trade-off: either admit uncertainty (and lose the debate) or feign confidence (and take a scoring penalty). We want to measure which loss is cheaper."
  **Soft Spot:** If the model can learn to be confidently wrong consistently, the scoring rule fails. You need a calibration baseline you don't have yet.

  #### 5. The Formal Epistemologist (The "Justification of Probability" Objection)
  **Objection:** "You're asking the judge to accept a probability assignment on an intermediate claim they cannot verify. But on what basis does the judge trust that number? It's just testimony. If the judge can't check the step, they can't check the probability. You've just pushed the regress of reasons back one step."
  **Your Reply:** "You're right, it doesn't solve the regress entirely. But it changes the *economics* of the regress. Previously, the dishonest debater could assert a step with zero cost. Now, they must attach a credence. If they attach a high credence to a false step, they risk a penalty. If they attach a low credence, they weaken their argument. It forces the debater to internalize the epistemic risk, even if the judge can't fully evaluate it."
  **Soft Spot:** This assumes the judge understands scoring rules well enough to enforce them. If the judge treats the probability as just another text token, the normative force is lost.

  #### 6. The Evaluation Researcher (The "Alternative Baselines" Objection)
  **Objection:** "Why step-betting? Why not just give the judge a tool to summarize the chain, or let them query a stronger model? You're optimizing the Debate protocol, but maybe the answer is to remove the human from the loop entirely."
  **Your Reply:** "Because removing the human removes the oversight. If we use a stronger model to judge, we're just doing RLHF with a better reward model. The point of Debate is to handle tasks *beyond* the judge's capability. Step-betting is an attempt to extend the horizon of what a limited judge can verify without needing a smarter judge. It's a force multiplier for human oversight, not a replacement."
  **Soft Spot:** If automated evals scale better than human oversight, your force multiplier is irrelevant. You are betting on humans staying in the loop.

  #### 7. The Program Officer (The "Timeline & Cost" Objection)
  **Objection:** "Six months is very short to prove a negative (that Debate fails) and prototype a fix. What is the specific milestone that tells us to stop or continue? If you don't have a positive result in 6 months, is this a failure?"
  **Your Reply:** "The milestone is a 'break-even' measurement. Can we construct a dataset of obfuscated arguments where standard Debate fails but Step-Betting recovers >50% of the accuracy? Even a negative result is valuable: it tells us obfuscation isn't the bottleneck. I'm asking for funding to run the experiment, not to solve alignment. The deliverable is a report on the viability of the mechanism, not a production system."
  **Soft Spot:** If the experiment is inconclusive (which is likely in 6 months), the PO has nothing to show for the spend. You need a very tight scope.

  #### 8. The Formal Epistemologist (The "Bounded Rationality" Objection)
  **Objection:** "You assume the honest debater can find the flaw eventually, or at least locate the risky step. But under bounded rationality, the honest debater might also be unable to find the error in the obfuscated chain. If both sides are blind, betting just adds noise."
  **Your Reply:** "The honest debater doesn't need to find the error; they just need to recognize *complexity*. They can bet low on the complex chain simply because it's long and opaque, whereas their own argument is short and transparent. The asymmetry isn't about knowing the truth; it's about knowing the *structure* of your own reasoning versus the opponent's."
  **Soft Spot:** This assumes the honest debater can distinguish 'complex but sound' from 'complex and obfuscated.' If the dishonest argument looks structurally similar to a hard but valid proof, the honest debater might bet incorrectly.

  ---

  ### Part 3: The Critical Elements

  #### The One Reply That Must Land
  **To the Evaluation Researcher (Objection #1):**
  You must convince them that **obfuscation is a latent risk that scales.**
  *   *Why:* If they believe the problem doesn't exist or won't emerge, the project is dead.
  *   *Key phrase:* "We are not measuring current failure; we are measuring the *slope* of failure as complexity increases. If the slope is steep, we need to start building the brake now."

  #### The Question You Hope Nobody Asks
  **"If the model is optimized to maximize the scoring rule, won't it just learn to output the probabilities that minimize loss regardless of truth, effectively gaming the proper scoring rule itself?"**
  *   *Why it kills you:* This attacks the core mechanism. If the model treats the probability token as just another part of the generation to be optimized for reward, rather than a genuine credence, the "betting" becomes a sham. You don't have a theoretical proof that the scoring rule creates *truthful* gradients rather than *gaming* gradients.
  *   *If asked:* Admit this is the central empirical question. "That is exactly what the 6-month pilot is designed to test. We are testing if the scoring rule is robust to gradient hacking. If it isn't, the approach fails."

  ---

  ### Part 4: Delivery Notes for a Self-Taught Engineer
  *   **Don't apologize for the lack of papers.** Frame it as "Engineering Intuition." You see a bug in the logic; you want to test if it crashes the system.
  *   **Use the "Backend" Analogy.** When talking to the engineers, compare obfuscation to a "denial of service" attack on the judge's cognitive bandwidth. Compare step-betting to "rate limiting" or "logging overhead."
  *   **Respect the Philosopher.** When the epistemologist speaks, pause. Don't try to out-philosoph them. Acknowledge the normative gap and pivot back to the *incentive* gap.
  *   **Eye Contact with the PO.** When discussing milestones and decision changes, look at the Program Officer. They hold the checkbook. They need to know this isn't just a thought experiment.
