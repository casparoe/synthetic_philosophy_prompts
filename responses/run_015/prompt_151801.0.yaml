      *   *Is the Logic Expert talking about Double Negation Translation?* Yes. But that translates the *statement*, not the *proof term* into executable code directly without transformation. The extracted code from a DN-translated proof is usually garbage (continuation-passing style mess) or requires a classical oracle.
      *   *Crucial distinction:* Is the scheduler *synthesized* (extracted from existence proof) or *verified* (handwritten code checked against spec)? The prompt says "scheduler itself gets extracted from the proof." This is synthesis. This makes the constructive requirement absolute.
      *   *The "Proof Style" worry:* If I prove $\exists \sigma, \text{Valid}(\sigma)$, the extracted code returns *a* $\sigma$. If I change the proof, I might get a different $\sigma$. This is inherent to synthesis. If they want a stable scheduler, they should write the scheduler and prove it valid. I need to point this out.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Blunt Truth" sections are distinct. (Self-correction: Make sure to explicitly validate the user's suspicion that both hatches are smuggling things.)

  8.  *(Final check of the prompt requirements)*:
      *   Settle the argument / tell what's at stake.
      *   Evaluate Hatch 1 & 2.
      *   Address the "proof style" concern.
