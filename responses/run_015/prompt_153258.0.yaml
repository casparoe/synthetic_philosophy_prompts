          *   *Logic:* State non-recognition -> Individual freedom/Equality. State recognition -> Reification/Group domination.
          *   *Unstated Premise:* State classification is inherently harmful/reifying. State non-classification is inherently neutral/liberating.
          *   *Empirical vs. Conceptual:* Conceptual distinction between negative/positive recognition. Empirical claim about how Anglo states operate (quotas, funding).
          *   *Weakness:* Assumes the "neutral" space isn't already culturally coded.

      *   **Move 2 (N.):**
          *   *Claim:* Laïcité isn't neutral; it's a specific culture (post-Catholic, Enlightenment). Banning markers enforces majority norms.
          *   *Logic:* Secularism is a tradition, not an absence of tradition. Neutrality is a mask for majority culture.
          *   *Unstated Premise:* All public norms are cultural. There is no "view from nowhere."
          *   *Empirical vs. Conceptual:* Conceptual claim about the nature of secularism. Empirical claim about French norms (bodily display, etc.).
          *   *Weakness:* Might understate the *intent* of laïcité to protect individuals from community pressure (which M. highlighted).

      *   **Move 3 (M.):**
          *   *Claim:* Anglo model creates "asymmetric visibility" (minorities marked, majority invisible). French model applies same visibility rules to everyone (stripping particularities).
