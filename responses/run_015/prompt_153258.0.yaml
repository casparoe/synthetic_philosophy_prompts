          *   *Unstated Premise:* Formal equality of restriction is more just than substantive accommodation. Majority practices are not "particularities" in the same way.
          *   *Empirical vs. Conceptual:* Empirical claim about how exemptions work. Conceptual claim about "normalcy."
          *   *Weakness:* Assumes majority practices *can* be stripped or aren't already the default. Ignores N's point about interpretation.

      *   **Move 4 (N.):**
          *   *Claim:* Stripping particularity is ontologically impossible. Visibility is culturally interpreted. Secular = Invisible, Religious = Hyper-visible.
          *   *Logic:* Neutrality is an effect of power, not a procedural state. The "ban" targets specific symbols defined by the dominant culture.
          *   *Unstated Premise:* Meaning is socially constructed, not inherent in the object (e.g., hair).
          *   *Empirical vs. Conceptual:* Conceptual claim about ontology of visibility. Empirical claim about how headscarves vs. uncovered hair are read.
          *   *Weakness:* Could imply total relativism where no universal standard is possible.

      *   **Core Tension:** Formal Equality (M) vs. Substantive/Cultural Equality (N).
      *   **Key Question:** Is neutrality a procedural mechanism or a cultural outcome? Can visibility be equalized?

  3.  **Drafting the Adjudication (Move by Move):**

      *   *Move 1:* M is conceptually sharp on the danger of reification but empirically naive about the "neutrality" of the non-classifying state. Rating: Partially Right.
      *   *Move 2:* N hits the core critique of political liberalism (the "culturally specific" nature of the universal). Strongest move so far. Rating: Mostly Right.
      *   *Move 3:* M tries to reclaim symmetry. Logically consistent *if* you accept the premise that majority norms aren't cultural. But that premise is contested. Rating: Mixed/Weak.
