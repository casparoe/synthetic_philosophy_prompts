          *   Colonies cost more to defend than they yield in revenue.
          *   Monopoly of colonial trade draws capital away from nearer, more productive uses.
          *   Distance makes proper governance impossible; local interests diverge from metropolitan ones.
          *   Merchants manipulate government for monopoly privileges.

