          2.  Intractability (P vs NP).
      *   **Contextual Constraints:** Must consider Leibniz's metaphysical commitments (Monads, Best of All Possible Worlds, God's understanding vs. human understanding).
      *   **Key Question:** Do these results wreck his project, or can he absorb them? Where does his optimism run out?

