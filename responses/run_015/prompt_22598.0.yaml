          *   *Leibniz's Defense (The Theological Escape Hatch):* Leibniz distinguishes between *Truths of Reason* (necessary, logical) and *Truths of Fact* (contingent, empirical).
          *   *Necessary Truths:* Even here, Gödel says a system can't prove its own consistency. Leibniz might argue our *finite* systems are incomplete, but God's infinite intellect contains the full proof.
          *   *Contingent Truths:* Leibniz already admitted these require infinite analysis for humans. Only God can resolve them instantly. Undecidability for humans is expected; for God, it's impossible.
          *   *Verdict:* Undecidability limits the *human* implementation of the *Calculus Ratiocinator*, but not the metaphysical reality of truth. The "Universal" in Universal Characteristic might need to be relativized to finite minds.

      *   **Part 3: Confronting Intractability (P vs NP):**
          *   *The Issue:* Even if solvable, it takes too long.
          *   *Leibniz's View:* This fits his "Best of All Possible Worlds." Complexity arises from the richness of the world.
          *   *Optimization:* Leibniz loved efficiency. He would see P vs NP as a challenge to find better heuristics or notations, not a fundamental barrier.
          *   *Metaphysical angle:* God computes instantly. Human slowness is a feature of our finitude, not a bug in the universe's logic.

      *   **Part 4: Where the Optimism Runs Out (The Critical Point):**
          *   This is the most important part for the user.
          *   *The Break:* The break isn't in the *existence* of truth, but in the *mechanizability* of discovery for finite beings.
          *   *Gödel's Hammer:* If truth outstrips provability, then reasoning *cannot* be fully reduced to calculation within a fixed system. You need new axioms. That requires intuition, not just calculation.
          *   *Leibniz's Adjustment:* He would have to concede that the *Calculus* is an tool for clarification, not an oracle for all truth. The "Let us calculate" becomes "Let us calculate *as far as we can*, then pray/intuit."
          *   *Monads:* Monads mirror the universe. If the universe contains undecidable propositions, the monad contains them as part of its infinite complexity.

