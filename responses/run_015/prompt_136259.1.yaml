      *   **Goal:** A one-page, laminatable decision procedure (questions in order, evidence standards, stop points, value hand-offs).
      *   **Specific Challenges to Address:**
          *   Big-number problem (millions of insects vs. human needs).
          *   Sentience uncertainty (nociception vs. pain).
          *   Displaced vs. added deaths (would they die anyway?).
          *   Non-kill methods (pheromones, biocontrol - are they actually better?).
          *   Knock-on effects (non-targets, resistance, secondary poisoning).
          *   Aesthetic nuisances (roses, picnics).
      *   **Test Cases:** Flea beetle (OSR), Slugs (Market Garden), Roses (Aesthetic).
      *   **Constraint:** At least one result must be counter-intuitive/unpleasant (user suspects beer traps).
      *   **Tone:** British English, direct, no citations/reading lists, acknowledge moral vs. technical limits.
