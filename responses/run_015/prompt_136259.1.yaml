  10. **Final Polish:** Ensure the distinction between "economic threshold" and "ethical threshold" is clear. The procedure must integrate them. (e.g., If economic threshold isn't met, ethical threshold is automatically failed for lethal control).

  *(Self-Correction during drafting)*: I need to make sure I don't just give a "spray is fine" get-out. The friend's point about suffering needs to be integrated. The procedure must force the user to consider *method* severity, not just efficacy.

  *(Refining the Beer Trap point)*: Why is it worse? 1. Attraction radius (kills neighbours' slugs too). 2. Drowning is slow. 3. Often non-selective (kills beetles etc). This is a strong candidate for the "answer you won't like."

