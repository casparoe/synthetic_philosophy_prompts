      *   Also, need to highlight that "natural" biocontrol (parasitoid wasps) is often more gruesome than a clean chemical knockdown.

  7.  **Addressing Moral vs. Technical:**
      *   Must explicitly state where the procedure stops. E.g., "Is the crop worth saving?" is an economic/value judgement, not a scientific one. "Is a slug's life worth a lettuce?" is a value judgement.
      *   The procedure handles *how*, not *if* (mostly).

  8.  **Drafting the Content (Iterative refinement for tone and brevity):**
