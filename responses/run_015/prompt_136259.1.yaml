answer: |-
  Here is the decision procedure, drafted for the van dashboard, followed by the test cases and the straight talk on where the logic hits a wall.

  ***

  # PEST CONTROL ETHICAL DECISION AID (v1.0)
  **For:** Field use, agronomist/grower joint decision.
  **Principle:** Minimise total suffering (pest + non-target + human livelihood), not just pest numbers.

  ### STEP 1: NECESSITY (The "Do Nothing" Test)
  *   **Q1: Is the pest density above the Economic Injury Level (EIL)?**
      *   *Evidence:* Field scouting, trap counts, grower's 5-year average yield loss data.
      *   *Standard:* If below EIL, **STOP**. No intervention. Tolerance is the default.
      *   *Exception:* Quarantine pests or notifiable diseases (legal override).
  *   **Q2: If we do nothing, does the crop fail completely or just reduce margin?**
      *   *Evidence:* Growth stage, weather forecast, market price.
      *   *Value Hand-off:* If crop failure threatens farm solvency, human welfare (jobs/food) outweighs insect welfare. If it's just margin, insect welfare weighs heavier.
      *   *Action:* If solvency at risk → Proceed to Step 2. If margin only → Strong presumption against lethal control.

  ### STEP 2: METHOD SELECTION (The "Quality of Death" Test)
  *   **Q3: Compare the 'Suffering Profile' of available options.**
      *   *Metric:* Time from exposure to insensibility + Evidence of distress (twitching, thrashing).
      *   *Ranking (Generally):*
          1.  Physical destruction (immediate crushing).
          2.  Fast neurotoxins (rapid knockdown).
          3.  Desiccants/Starvation (hours/days).
          4.  Internal parasitism/drowning (days/suffocation).
      *   *Rule:* Do not choose a "natural" method if it prolongs suffering compared to a chemical one.
  *   **Q4: Does the method attract pests from outside the treatment zone?**
      *   *Evidence:* Product label (attractants/pheromones), trap type.
      *   *Rule:* If YES (e.g., beer traps, some lures), this **increases** total deaths/suffering. Discount heavily. Only permissible if containment is 100%.
  *   **Q5: What is the non-target risk?**
      *   *Evidence:* Label hazard symbols (bees, aquatic life), application timing.
      *   *Rule:* High risk to sentient non-targets (bees, vertebrates) vetoes the method unless Step 1 (Solvency) is critical.

  ### STEP 3: SCOPE & RESISTANCE (The "Future Suffering" Test)
  *   **Q6: Will this action increase suffering in future seasons?**
      *   *Evidence:* Resistance management guidelines (IRAC/FRAC codes), history of use on holding.
      *   *Rule:* If using a high-resistance risk product without rotation, you are banking future crop failure and future spraying. **STOP.**
  *   **Q7: Are we treating an aesthetic nuisance?**
      *   *Context:* Hotel roses, picnic areas, public parks.
      *   *Rule:* Lethal chemical control is **PROHIBITED**. Tolerance or physical removal only. Human annoyance does not justify mass death.

  ### STEP 4: THE HAND-OFF
  *   **If Steps 1-3 yield a clear winner:** Proceed. Record rationale in audit trail.
  *   **If Steps 1-3 conflict (e.g., Solvency vs. High Non-Target Risk):** Hand to Grower.
      *   *Script:* "Option A saves the crop but risks bees. Option B saves bees but costs £Xk. This is a value call, not an agronomy call."
  *   **If the only options are high-suffering (e.g. parasitoids vs. drowning):** Acknowledge there is no 'clean' kill. Choose the fastest.

  ***

  # TEST CASES RUN-THROUGH

  ### 1. Flea Beetle in Oilseed Rape (OSR)
  *   **Options:** Pyrethroid spray vs. Trap Crop vs. Do Nothing/Reseed.
  *   **Analysis:**
      *   *Do Nothing:* If crop establishes, best outcome. If it fails, reseed costs money and delays ground cover (more pests later).
      *   *Pyrethroid:* Fast death (minutes). High resistance risk (often useless anyway). High non-target risk (bees/ground beetles).
      *   *Trap Crop:* Concentrates beetles. They are usually sprayed later or die of starvation. Delays death, potentially increases total beetle population by protecting them from generalist predators initially.
  *   **Verdict:** **Trap Crop is ethically dubious** if it just concentrates suffering for a later spray. **Pyrethroid** is only defensible if resistance is confirmed low and bee risk managed (night spray), because speed of death is high. However, given resistance, **Reseeding** (if early enough) often minimises total chemical load and suffering long-term.
  *   **Hard Truth:** If the pyrethroid works, it is likely *less painful* for the beetle than the trap crop strategy, but the ecological cost is higher.

  ### 2. Slugs in Market Garden
  *   **Options:** Ferric Phosphate vs. Beer Traps vs. Hand-picking vs. Reseed.
  *   **Analysis:**
      *   *Beer Traps:* **FAIL.** They emit odour attracting slugs from surrounding untreated areas (increasing total population density). Drowning is slow (asphyxiation). Non-selective (drowns beetles/frogs).
      *   *Ferric Phosphate:* Slug stops feeding, retreats, dies in 3-6 days. Moderate suffering duration. Low non-target risk.
      *   *Hand-picking:* Immediate physical destruction or soapy water (rapid osmotic shock/death). High labour cost.
  *   **Verdict:** **Beer traps are the worst option.** They create death that wouldn't have happened (attraction) and use a slow method. Hand-picking is ethically superior but economically often impossible. Ferric phosphate is the pragmatic compromise.
  *   **Hard Truth:** Your mate is wrong about "traditional" methods. The beer trap is a suffering multiplier.

  ### 3. Greenfly on Hotel Roses (Aesthetic)
  *   **Options:** Spray vs. Tolerance.
  *   **Analysis:**
      *   *Necessity:* Zero economic threat. Purely human aesthetic preference.
      *   *Rule:* Step 3, Q7 applies.
  *   **Verdict:** **No lethal control.** Wash off with water or tolerate.
  *   **Hard Truth:** If the hotel complains, the agronomist must refuse the instruction. Killing millions of aphids for visual tidiness fails the proportionality test.

  ***

  # THE STRAIGHT TALK (Where the procedure stops)

  You asked for the limits. Here they are.

  **1. The "Big Number" Problem**
  The procedure does not solve the utilitarian maths of "millions of insects vs. one farmer's income." It sidesteps it.
  *   *The Fix:* We treat farm solvency as a *constraint*. If the farm goes bust, the land is sold, housing gets built, and *all* insects die permanently. Therefore, keeping the farm running is a prerequisite for insect welfare in the long term.
  *   *The Limit:* This breaks down on aesthetic issues (the roses). There, the farm's income isn't at risk, so the insects win. If your mate argues that *any* farming is wrong because it displaces wild flora, this procedure cannot help you. That is a political argument, not a pest control one.

  **2. Sentience Uncertainty**
  We are acting on a "Precautionary Weighting." We assume insects feel *something*, but less than a vertebrate.
  *   *The Limit:* We cannot quantify "how much." We rely on *duration* and *type* of death as a proxy. A 3-day death is worse than a 3-minute death, regardless of the exact neural architecture. If science proves tomorrow that aphids feel pain exactly like a lamb, this procedure collapses. You have to act on today's evidence.

  **3. Displaced vs. Added Deaths**
  You asked if a death that would have happened anyway counts the same.
  *   *The Answer:* **No.**
  *   *Why:* If you spray, you intervene in the causal chain. You become the agent of death. If a wasp eats the aphid, nature is the agent.
  *   *The Moral Load:* You are responsible for the *method* you choose, not the baseline mortality of the field. However, if your method (like beer traps) *pulls in* extra victims who wouldn't have died, you are responsible for those added deaths. That is why beer traps fail the test.

  **4. The "Natural is Better" Fallacy**
  Your procedure must explicitly reject the idea that biological control is inherently kinder.
  *   *The Truth:* A parasitoid wasp larva eating a caterpillar from the inside out is a high-suffering event. A contact neurotoxin is often cleaner.
  *   *The Conflict:* Growers love biocontrol because it looks green. You have to be the one to say, "This wasp is crueller than the spray." That is a hard conversation to have in a field at 7am.

  **5. Values vs. Facts**
  The procedure cannot tell you if a lettuce is worth a slug's life.
  *   *The Hand-off:* That is why Step 1 (Necessity) and Step 4 (Hand-off) exist. If the economic threshold is met, we assume the crop is worth saving. If it's marginal, you must ask the grower: "Is this profit worth the moral cost?"
  *   *The Limit:* If they say "Yes, spray," and it's legal, you can't stop them. You can only ensure they use the least-suffering method. You are an advisor, not a veto.

  **Summary for the Van:**
  1.  **Don't spray unless you have to** (Economic threshold).
  2.  **If you must, kill fast** (Avoid starvation/drowning/parasitism).
  3.  **Don't attract extras** (No beer traps).
  4.  **Don't poison the neighbours** (Non-targets).
  5.  **Aesthetics don't kill** (Roses/Picnics).

  If you follow that, you're doing as much as can be done without quitting the job.
