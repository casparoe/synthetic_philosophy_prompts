  2.  **Deconstruct the Ethical/Practical Tension:**
      *   The user is stuck between utilitarian calculus (suffering x numbers) and practical agronomy (crop loss, economic viability).
      *   The friend's argument (insect rights) leads to paralysis (stop farming). The user needs a *threshold* approach.
      *   Key insight from the prompt: "The interesting question isn't 'is it alive' but what the death actually consists in." This is the anchor.
      *   *Sentience Uncertainty:* Apply a precautionary principle but weighted by probability and capacity. Insects aren't mammals, but they aren't stones.
      *   *Big Numbers:* Needs a discount rate or a threshold. If the crop fails, human/animal suffering (food security/economic ruin) enters the equation.
      *   *Biocontrol:* Often slower and more painful (parasitism) than chemical knockdown. Needs to be evaluated on *suffering duration*, not just "naturalness."
      *   *Aesthetics:* Low threshold for intervention, but high threshold for suffering methods.

  3.  **Drafting the Decision Procedure (The "Laminated Sheet"):**
      *   Needs to be step-by-step.
