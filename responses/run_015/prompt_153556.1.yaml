prompt: |-
  I'm a mediator at a community center that mostly handles family disputes between immigrants from high-rule cultures and locals with more flexible norms. I'm tired of just winging it when one side says "the rules are clear" and the other says "you're being rigid". Write me a 15-minute decision procedure I can run before a session to pick whether to frame the conflict as tight-culture (explict rules, uniform enforcement, clear sanctions) or loose-culture (context, negotition, adpative norms). Don't just recycle the usual country-level sociology -- I need it for one dispute, with questions in order, stop points, and clear flags for where I'm just making a value call rather than applying the theory. Apply it to three cases: a teenager skipping a ritual obligation, cousins fighting over an informal loan, and a case where the procedure says go tight but you'd actually want loose. Say exactly where it breaks down, especially when people invoke "culture" strategically.
