answer: |-
  # The Tight/Loose Triage Protocol (15-Minute Pre-Session)

  **Purpose:** To determine whether to structure the mediation session around **Rule Enforcement (Tight)** or **Contextual Negotiation (Loose)**.
  **Warning:** This is a diagnostic tool for *framing*, not a verdict on who is right. "Tight" does not mean "correct."
  **Time:** 15 Minutes hard stop.

  ---

  ## Phase 1: The Deviance Check (5 Minutes)
  *Goal: Determine if a shared norm actually exists or if this is a clash of incompatible expectations.*

  **Q1: Is the rule explicit or implicit?**
  *   (A) Written, spoken aloud previously, or ritualized (e.g., "You promised," "It is written," "We always do this").
  *   (B) Assumed, felt, or based on "what makes sense" (e.g., "I thought you'd understand," "It depends on the situation").
  *   *Score:* A = +1 Tight | B = +1 Loose

  **Q2: Is the deviance new or repeated?**
  *   (A) This is a pattern of breaking the same boundary.
  *   (B) This is a one-off due to unique circumstances (emergency, misunderstanding).
  *   *Score:* A = +1 Tight | B = +1 Loose

  **Q3: Do both parties acknowledge the rule exists, even if they disagree on the exception?**
  *   (A) Yes. (e.g., "Yes, I owe money, but..." or "Yes, I should have been there, but...")
  *   (B) No. (e.g., "There is no rule" vs. "You broke the rule.")
  *   *Score:* A = +1 Tight | B = +1 Loose

  **[STOP POINT 1]**
  *   **If Score is 0-1 (Mixed):** Proceed to Phase 2.
  *   **If Score is 3 (Pure Tight):** Pause. Ask yourself: *Is enforcing this rule safe?* If yes, prepare for a compliance-based session. If no, **FLAG VALUE CALL** (See Phase 3).
  *   **If Score is -3 (Pure Loose):** Prepare for a interest-based negotiation session. Rules are irrelevant; needs are central.

  ---

  ## Phase 2: The Sanction Check (5 Minutes)
  *Goal: Determine the cost of breaking the norm. High/Uniform costs suggest Tight; Variable/Low costs suggest Loose.*

  **Q4: What is the threatened consequence?**
  *   (A) Ostracization, shame, permanent relationship rupture, formal penalty.
  *   (B) Annoyance, temporary friction, discussion, "making it up."
  *   *Score:* A = +1 Tight | B = +1 Loose

  **Q5: Who holds the power to sanction?**
  *   (A) The community/elders/system (External pressure).
  *   (B) The individuals involved (Internal pressure).
  *   *Score:* A = +1 Tight | B = +1 Loose

  **Q6: Is the sanction proportional to the act?**
  *   (A) No. The reaction feels extreme compared to the "crime" (Zero tolerance).
  *   (B) Yes. The reaction fits the specific harm caused.
  *   *Score:* A = +1 Tight | B = +1 Loose

  **[STOP POINT 2]**
  *   **If Total Score (Phase 1 + 2) > +4:** The system is **Tight**. Frame the session around *how* to restore order/fulfill obligation.
  *   **If Total Score < -4:** The system is **Loose**. Frame the session around *why* the misunderstanding happened and how to adapt.
  *   **If Score is -3 to +3:** **AMBIGUOUS ZONE.** Proceed to Phase 3. This is where culture is likely being weaponized.

  ---

  ## Phase 3: The Strategic Check (5 Minutes)
  *Goal: Identify if "Culture" is being used as a shield or a sword.*

  **Q7: Who is invoking the "Rule"?**
  *   (A) The party with less structural power (e.g., the immigrant parent fearing loss of control).
  *   (B) The party with more structural power (e.g., the employer, the landlord, the acculturated child).
  *   *[WARNING: VALUE CALL FLAG]* If the "Rule" protects a power imbalance (gender, age, status), do not accept the Tight frame uncritically.

  **Q8: Is the "Rule" applied consistently by the invoker?**
  *   (A) Yes, they follow it too.
  *   (B) No, they make exceptions for themselves but not the other party.
  *   *[WARNING: VALUE CALL FLAG]* If (B), the "Tight" frame is hypocritical. Shift to Loose/Negotiation to expose the inconsistency.

  **Q9: Does accepting the "Tight" frame violate Center Policy or Law?**
  *   (A) No.
  *   (B) Yes (e.g., child safety, financial usury, discrimination).
  *   *[HARD STOP]* If (B), **ABORT TIGHT FRAME.** You cannot mediate illegal or unsafe norms.

  ---

  # Application to Three Cases

  ## Case 1: The Teenager and the Ritual Obligation
  **Context:** Somali mother vs. 16-year-old son. Son missed Friday prayers for a school soccer game. Mother says "Disrespect/Religious failure." Son says "It's just one time/School is important."

  *   **Phase 1:** Rule is explicit (Religious duty) [+1 Tight]. Deviance is repeated [+1 Tight]. Both acknowledge rule exists [+1 Tight]. **Score: +3.**
  *   **Phase 2:** Consequence is shame/community judgment [+1 Tight]. Power is external (Community/Religion) [+1 Tight]. Sanction feels extreme to son (Grounded for month) [+1 Tight]. **Score: +6.**
  *   **Phase 3:** Mother has less structural power in host country (invoking rule to maintain authority) [Neutral]. Mother follows rule [Yes]. No legal violation.

  **Procedure Verdict:** **GO TIGHT.**
  **Mediator Strategy:** The diagnostic says this is a Tight-Norm conflict. If you frame this as "Loose" (negotiable religious duty), the mother will feel the mediator is illegitimate.
  **Action:** Acknowledge the rule's validity *to her*. Do not ask "Is prayer important?" Ask "How do we fulfill the obligation while managing the schedule?"
  **Where it feels wrong:** It validates a restriction on the teen's autonomy.
  **Correction:** Use the Tight frame to secure the mother's buy-in, then pivot to Loose *implementation*. "The rule stands (Tight), but the scheduling is negotiable (Loose)."

  ## Case 2: Cousins and the Informal Loan
  **Context:** Vietnamese cousin (Lender) vs. American-born cousin (Borrower). $5,000 loaned verbally. Lender wants it back now. Borrower says "Family helps family, why the rush?"

  *   **Phase 1:** Rule is implicit (Family support vs. Repayment) [-1 Loose]. Deviance is one-off (Job loss) [-1 Loose]. Do they agree a rule exists? No. Lender says "Loan," Borrower says "Gift/Support." [-1 Loose]. **Score: -3.**
  *   **Phase 2:** Consequence is family rupture [+1 Tight]. Power is internal (Between cousins) [-1 Loose]. Sanction proportional? Lender wants full cash now (Extreme for family) [+1 Tight]. **Score: -1.**
  *   **Phase 3:** Who invokes rule? Lender (Immigrant, older). Is it consistent? Lender has borrowed before without paying back quickly [Yes, Hypocritical]. **FLAG VALUE CALL.**

  **Procedure Verdict:** **AMBIGUOUS / STRATEGIC.**
  **Mediator Strategy:** The score is low (Loose), but the Lender is invoking a Tight norm (Contract) selectively.
  **Action:** Do not accept the Tight "Contract" frame. It is being used strategically. Shift to Loose/Relational. "It sounds like there are two different understandings of how family money works. Let's talk about the relationship, not just the debt."
  **Breakdown Point:** Phase 3, Q8. The procedure caught the hypocrisy. If you ignored Q8, you would have treated this as a contract dispute (Tight), which would destroy the family relationship.

  ## Case 3: The "Procedure Says Tight, You Want Loose" Case
  **Context:** Eastern European father vs. 14-year-old daughter. Father demands daughter delete social media and be home by 6 PM. Cites "Safety and Cultural Respect." Daughter says "Everyone else is out till 9."

  *   **Phase 1:** Rule explicit (House rules) [+1 Tight]. Repeated deviance [+1 Tight]. Both acknowledge rule [+1 Tight]. **Score: +3.**
  *   **Phase 2:** Consequence is confiscation/isolation [+1 Tight]. Power is external (Father) [+1 Tight]. Sanction proportional (To him, yes) [+1 Tight]. **Score: +6.**
  *   **Phase 3:** Who invokes rule? Father (Head of Household). Consistent? Yes. Legal violation? No.

  **Procedure Verdict:** **GO TIGHT.**
  **Mediator Desire:** **GO LOOSE.**
  **Why the Procedure Fails Here:** The procedure diagnoses this as a Tight-Norm dispute. Technically, it *is*. The father has rigid norms. However, framing the session as "How do we enforce the 6 PM rule?" validates isolationist parenting that hinders integration and may border on emotional abuse.
  **The Breakdown:** The procedure measures *descriptive* reality (are the norms tight?), not *normative* desirability (should these norms govern this mediation?).
  **Action:** You must override the procedure.
  **Value Call:** "While I understand these are your house rules (acknowledging Tight), in this community, we need to find a solution that allows for safe social development (imposing Loose)."
  **Risk:** The father may walk out, claiming bias.
  **Mitigation:** Use the "Safety" exception in Phase 3, Q9. Reframe strict isolation not as a "cultural rule" but as a "safety risk" to justify the Loose intervention.

  ---

  # Where The Procedure Breaks Down (And How to Spot It)

  ### 1. The "Strategic Culture" Trap
  **The Breakdown:** Parties often invoke "Culture" to win a power struggle, not because they actually hold the norm.
  *   *Example:* A husband cites "Traditional Gender Roles" (Tight) to avoid childcare duties, but his male friends share childcare.
  *   *Detection:* Phase 3, Q8 (Consistency).
  *   *Mediator Move:* Call out the inconsistency gently. "You mention this is a cultural rule. How do other men in your community handle this?" If they hesitate, the "Tight" frame is a weapon, not a belief. Switch to Loose/Negotiation.

  ### 2. The "Power vs. Norm" Confusion
  **The Breakdown:** Tight/Loose theory assumes norms are shared. In disputes, often one party is simply imposing will on another and calling it a "norm."
  *   *Example:* Case 3 above. The "rule" isn't a community norm; it's an individual control tactic.
  *   *Detection:* Phase 2, Q5 (Who holds power?). If power is purely hierarchical (Parent/Child, Employer/Employee) without community backing, "Tight" is just "Authority."
  *   *Mediator Move:* Do not validate the norm. Validate the *concern* (Safety/Respect) but reject the *rule*.

  ### 3. The Value Call Flag (Ethics vs. Theory)
  **The Breakdown:** Sometimes the "Tight" culture is genuinely held and consistent, but it violates the mediator's ethical code (e.g., gender equity, child autonomy).
  *   *Detection:* Phase 3, Q9.
  *   *Mediator Move:* This is the only place you should "wing it" intentionally. You must prioritize safety/equity over cultural framing.
  *   *Script:* "I hear that this rule is clear in your tradition. My role is to ensure agreements are sustainable in *this* legal and social environment. A 6 PM curfew for a 14-year-old here creates risks we need to manage."

  ### 4. The "Acculturation Gap" Blindspot
  **The Breakdown:** The procedure treats "Immigrant" as Tight and "Local" as Loose. This is a stereotype.
  *   *Detection:* Phase 1, Q1.
  *   *Reality:** Second-generation immigrants often hold Tighter norms about family loyalty than their parents, or Locals may have Tighter norms about property.
  *   *Mediator Move:* Apply the score to the *individuals*, not their demographics. If the Local is the one demanding rigid contract enforcement, score them as Tight.

  ### Summary for the Mediator
  Use this triage to pick your **opening frame**, not your final outcome.
  *   **If Tight:** Start with "Let's look at the agreement/expectation."
  *   **If Loose:** Start with "Let's look at the situation/needs."
  *   **If Strategic/Value Call:** Start with "Let's look at the fairness/safety."

  If you find yourself arguing about the *rule* itself, you picked the wrong frame. Stop, reset, and check Phase 3 again.
