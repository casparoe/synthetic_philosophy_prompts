answer: |-
  The debate surrounding evolutionary debunking arguments (EDAs) in metaethics has largely calcified into two opposing camps. On one side, proponents of debunking argue that because our moral faculties were shaped by natural selection for reproductive fitness rather than normative truth, our moral beliefs are epistemically unjustified, pushing us toward moral anti-realism. On the other side, defenders of realism argue that evolutionary pressures and truth-tracking are compatible, as true beliefs often confer survival advantages. I propose a heterodox intermediate position that cuts across this stalemate. The core thesis is that the standard EDA relies on a false dichotomy between causal evolutionary explanation and normative truth-tracking, yet the failure of the EDA does not automatically secure moral realism. Instead, the epistemic viability of moral realism depends critically on the cognitive architecture underlying moral judgment. Realism is rehabilitated only if moral cognition relies principally on domain-general reasoning mechanisms rather than specialized, modular heuristics. If morality is modular, the evolutionary explanation remains debunking; if it is an exercise of general rationality, it is not.

  To understand why the standard debunking argument fails in its strongest form, we must first dismantle the assumption that evolutionary causation is inherently hostile to truth. The standard EDA posits a dilemma: our moral beliefs are either caused by evolutionary pressures or by sensitivity to normative truths, and since science tells us they are caused by the former, they cannot be caused by the latter. This presupposes that fitness and truth are independent variables. However, in many domains, tracking truth is precisely how an organism achieves fitness.

  Consider the domain of arithmetic. Human beings possess an "approximate number sense," an evolved cognitive mechanism that allows us to estimate quantities rapidly without counting. This mechanism was undoubtedly selected for because distinguishing between a group of two predators and a group of five confers a survival advantage. If we applied the logic of the EDA to mathematics, we would have to conclude that because our numerical intuitions are shaped by the pressure to avoid predation, we have no reason to trust that $2 + 2 = 4$. We should become arithmetic anti-realists. Yet, this conclusion is absurd. The evolutionary origin of our number sense does not debunk arithmetic; it explains our access to it. The pressure to track quantity accurately *is* a pressure to track arithmetic truth. The causal history of a belief does not, in itself, determine its epistemic status. What matters is whether the causal process is of a type that correlates with the truth of the belief. Therefore, the mere fact that morality has evolutionary origins is not sufficient to undermine moral realism. The debunking argument fails as a universal claim because it ignores the possibility of convergence between fitness and truth.

  However, acknowledging that evolutionary origins are not automatically debunking does not grant moral realism a free pass. The arithmetic analogy works because quantity tracking is a functional requirement for navigating the physical world, and arithmetic truths are mind-independent features of that world. For the analogy to hold in ethics, moral cognition must function similarly to mathematical cognition. This brings us to the crucial condition of my argument: moral realism is only rehabilitated if moral cognition relies on domain-general reasoning mechanisms.

  Cognitive science generally distinguishes between domain-specific modules and domain-general systems. A domain-specific module is a specialized circuit designed to solve a specific adaptive problem, such as detecting snakes, learning language grammar, or managing kin altruism. These modules operate via fixed heuristics: if stimulus $X$ occurs, produce response $Y$. They are encapsulated and often insensitive to broader context. In contrast, domain-general reasoning involves flexible information processing, logical inference, and the integration of disparate information sources to solve novel problems.

  If moral judgments are the output of domain-specific modules—for example, a "cheater detection" module or a "disgust-based purity" heuristic—then the EDA retains its force. A modular response is not a judgment about truth; it is a reflex. If I feel disgust at a certain sexual practice due to an evolved pathogen-avoidance heuristic, that feeling is not "true" or "false" in a normative sense; it is merely a triggered state. If our entire moral framework is a constellation of such heuristics, then we have no faculty capable of grasping normative truths, only a set of instincts that mimic moral reasoning. In this scenario, the evolutionary explanation *does* exhaust the explanation of the belief, leaving no room for truth-tracking.

  Conversely, if moral judgments are the product of domain-general reasoning, they inherit the truth-tracking capacity of logic and rationality. Domain-general reasoning is not tuned to a specific environmental niche but to structural consistency, non-contradiction, and means-end coherence. These are formal properties that apply universally. If moral realism posits that there are objective normative reasons for action, and if human beings access these reasons through the same general rational faculties used to solve problems in physics or logic, then the evolutionary origin of those faculties is irrelevant to their validity. Just as our evolved capacity for logic allows us to discover truths about computer science (a domain evolution never anticipated), our evolved capacity for general reasoning could allow us to discover normative truths. Thus, realism is secure only if morality is a project of general rationality, not a suite of social instincts.

  A formidable objection arises at this point. One might argue that even domain-general reasoning is not a pure truth-tracking engine but is itself miscalibrated by evolutionary pressures. Critics, particularly those influenced by argumentative theories of reasoning, suggest that human rationality evolved primarily for social negotiation, status management, and coalition building, rather than for abstract truth-seeking. On this view, our "general reasoning" is biased toward confirming our pre-existing intuitions or winning debates rather than finding objective correctness. If our rational faculties are systematically distorted to favor cooperation or hierarchy, does this not reintroduce the debunking threat, even for domain-general mechanisms?

  This objection conflates the *application* of reasoning with the *capacity* for reasoning. It is entirely plausible that evolution biased the *inputs* of our reasoning or the *topics* we are motivated to reason about. We may be more motivated to reason about social slights than about quantum mechanics. However, the underlying computational structure of domain-general reasoning—the laws of logic, probability, and consistency—is not malleable in the same way a heuristic is. A module for kin-altruism is hardwired to favor relatives; it cannot be talked out of that bias. Domain-general reasoning, by definition, allows for the evaluation of premises. If our reasoning is biased toward social cohesion, we can use that very same reasoning capacity to identify the bias and correct for it.

  The possibility of reflective equilibrium demonstrates this. We can step back from an intuitive judgment, analyze its consistency with other judgments, and revise it if it fails to cohere. This self-corrective feature is the hallmark of domain-general processing. Even if the engine of reasoning was honed in the fires of social competition, its output is constrained by logical validity. If a moral principle leads to a contradiction, general reasoning rejects it, regardless of whether accepting it would have aided our ancestors' status. Therefore, while evolutionary pressures may create noise in the system, they do not structurally disable the truth-tracking potential of domain-general rationality. The debunking argument fails here because it cannot explain away the normative force of logical consistency itself.

  To test the utility of this framework, let us apply it to a concrete, robust moral judgment: the cross-cultural conviction that causing unnecessary suffering is wrong. This judgment is a prime candidate for evolutionary analysis. Does this belief survive debunking scrutiny? The answer depends entirely on whether we classify the cognitive mechanism producing it as domain-specific or domain-general.

  On one hand, the aversion to suffering looks deeply modular. We possess mirror neurons and empathy circuits that trigger distress when we observe pain in others. This is a domain-specific adaptation for social bonding and care-taking. If the judgment "suffering is wrong" is merely the cognitive label we paste over this visceral aversion, then the EDA succeeds. The belief is explained fully by the adaptive value of group cohesion and parental investment. There is no need to posit a normative truth; the heuristic suffices. In this modular reading, the word "unnecessary" is merely a post-hoc rationalization for when the empathy module fails to trigger (e.g., toward out-groups).

  On the other hand, the inclusion of the qualifier "unnecessary" suggests the operation of domain-general reasoning. A raw heuristic does not weigh necessity; it reacts to stimuli. To judge suffering as *unnecessary* requires a counterfactual analysis: Could this end have been achieved with less pain? Is the pain proportional to the goal? This involves weighing competing values and applying a principle of efficiency or consistency. It implies a commitment to the idea that pain requires justification, which is a normative principle, not a reflex. This looks like an application of a general rational requirement for impartiality and consistency: if I claim my pain matters, I must admit that similar pain in others matters, absent a relevant difference.

  If we view the conviction against unnecessary suffering as an output of this domain-general principle of consistency, the EDA fails. The evolutionary origin of our empathy provides the *data* (pain is bad), but the moral *judgment* (unnecessary pain is wrong) is generated by rational processing that transcends the specific adaptive context. We can reason that suffering is wrong even in contexts where alleviating it confers no fitness advantage, such as caring for the terminally ill who cannot reciprocate. This flexibility indicates the involvement of general reasoning.

  However, if empirical psychology were to demonstrate that the "unnecessary" clause is merely a flexible parameter of a modular system—adjusted only to signal virtue or manage reputation—then the debunking argument would succeed. The framework I have defended does not guarantee realism; it provides the condition for its possibility. In the case of suffering, the judgment is likely a hybrid: fueled by modular empathy but structured by general reasoning. The EDA succeeds in debunking the raw impulse (which is just a feeling), but it fails to debunk the principled judgment (which appeals to consistency).

  In conclusion, the debate over evolutionary debunking arguments has been obscured by a binary choice between accepting the debunking conclusion or denying the relevance of evolution. The intermediate position offers a more nuanced path. It accepts that evolutionary explanations are compatible with truth-tracking, rejecting the false dichotomy that selection precludes truth. However, it places a heavy burden on the cognitive science of morality. Moral realism is not the default position that survives once we dismiss the EDA; rather, it is a contingent hypothesis that depends on the architecture of the mind. If our moral lives are governed by encapsulated modules, we are left with useful fictions. If they are governed by domain-general reason, we have a bridge to normative reality. The epistemic damage of evolution is not total, but it is selective, sparing only those judgments that can claim the authority of general rationality.
