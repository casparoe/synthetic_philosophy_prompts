prompt: |-
  I've been working through some debates about evolutionary debunking arguments in metaethics, particularly after following long threads on rationalist forums about whether knowing that our moral judgments have evolutionary origins should push us toward moral anti-realism. Rather than taking the standard for-or-against line, I want to defend a somewhat heterodox intermediate position: that debunking arguments fail because they tacitly presuppose a false dichotomy between being causally shaped by natural selection and being genuinely responsive to normative truth, but that this failure only actually rehabilitates moral realism if moral cognition relies on domain-general reasoning mechanisms rather than on specialized, modular heuristics. On this view, evolutionary origin is not automatically debunking, but neither is it automatically harmless—the epistemic damage depends specifically on the underlying cognitive architecture.

  Please argue for this position in detail. First, explain why the selection-versus-truth-tracking dichotomy is mistaken, using the analogy of arithmetic intuition: if approximate number sense is also shaped by evolutionary pressures for quantity tracking, should we therefore become arithmetic anti-realists? Use that parallel to show that evolutionary explanation alone does not undermine a domain. Next, defend the claim that moral realism is rehabilitated only under the domain-general mechanism condition, and address the objection that even domain-general reasoning could be systematically miscalibrated by evolutionary pressures for cooperation or status management. Finally, apply the framework to one concrete judgment: the widespread cross-cultural conviction that causing unnecessary suffering is wrong. Is this best explained by a domain-general principle of consistency, or by a domain-specific harm-avoidance module? And what does your answer imply about whether evolutionary debunking succeeds in that particular case? Please write in American English, keep the tone formal but accessible to a philosophy-literate audience, and avoid bibliographies, reading lists, or specific citations—I am evaluating the conceptual architecture, not the scholarly coverage.
