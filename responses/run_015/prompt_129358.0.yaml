answer: |-
  The dust of the settlement always tasted of clay and time. In the Minting Guild, Elara swept it from the corners of her workstation every evening, a fine red powder that was once the currency of the realm. Here in Oikos, value was not a promise of tomorrow, but a receipt for yesterday. The shards—small, hexagonal ceramic chips sealed with a bio-reactive glaze—were designed to die. Thirty days after issuance, the glaze compromised, the clay softened, and the money returned to the earth.

  It was a system built on the belief that wealth was like fruit: it existed to be consumed, to sustain the household, not to be piled in a granary until it rotted. This was *oikonomia*, the natural art of management. To hold a shard too long was to hold a dying thing. To hoard was to fight nature.

  Elara was a Steward of the Cycle. Her job was to ensure the death of the money was timely and uniform. But three days ago, during a routine humidity test on Batch 904, she had dropped a tray of fresh shards into a waste bath containing a residual solvent from a new sealant experiment. By rights, they should have been sludge. Instead, when she fished them out, the glaze had hardened into a translucent, diamond-like shell.

  Today, thirty days later, she held one in her palm. It should have crumbled. It should have been dust. Instead, it was cold, hard, and permanent.

  She turned the shard over. In a world where everyone spent their earnings before the month ended to avoid loss, this object was an anomaly. It was a bridge to a future that Oikos had deliberately burned. Elara felt a strange vertigo. It wasn't the thrill of being rich; she could not spend this without suspicion. It was the thrill of holding a secret key to a locked door everyone agreed should remain shut.

  She took the shard to the Archive, a quiet hall where the Elders maintained the philosophical integrity of the settlement. Theron was there, as expected, reviewing the ledgers of exchange. He was an old man, his skin mapped with the wrinkles of someone who had watched thousands of cycles turn.

  Elara placed the shard on the table between them. It did not crumble.

  Theron looked at it. He did not touch it. He looked up at Elara, his eyes weary. "You found a way to stop the decay."

  "It was an accident," Elara said. "A chemical interaction. I can replicate it."

  Theron sighed, the sound like wind through dry reeds. "Then you have found a way to kill the settlement, Elara. Not with fire, but with permanence."

  "It's just security," she argued, her voice sounding too loud in the quiet room. "Why must we be forced to spend? Why is planning for a distant future forbidden? This allows us to build reserves. To weather bad harvests without relying on the guild's redistribution."

  "Security for whom?" Theron asked softly. "And at whose expense?"

  He stood and walked to the window, looking out over the plaza where citizens were bartering goods for the current cycle's shards. "We built this system on the understanding that currency is a measure, like a ruler. You use a ruler to measure cloth, but you do not hoard rulers to become a master of cloth. When money becomes a store of value, it ceases to be a tool and becomes a master."

  "It's just a token," Elara insisted. "It represents labor already done."

  "Does it?" Theron turned back to her. "In our system, a shard represents a promise of reciprocal exchange within a bounded time. I give you grain, you give me a shard, you give the shard to a weaver within thirty days. The circle closes. The relationship is between people. But if you hold that shard indefinitely, the relationship changes. You are no longer exchanging labor for labor. You are holding a claim on future labor that you have not yet performed."

  Theron picked up the preserved shard, weighing it in his hand. "The ancients warned us that there is a distinction between acquiring goods to sustain life, and acquiring wealth for its own sake. The first is natural. The second is limitless, because there is no end to the desire for accumulation. By making the coin immortal, you invite the limitless into a world designed to be bounded."

  "I'm not asking to exploit anyone," Elara said.

  "You don't have to," Theron replied. "The mere possibility changes the water we swim in. If this technique exists, some will use it. Those who hold the permanent shards will not need to participate in the reciprocal cycle. They can wait. They can lend. And when they lend, they will expect a return. Why would I lend you a shard that lasts forever if you only return the same shard? I will want two."

  Elara fell silent. She saw the logic unspooling. A permanent currency demands interest.

  "This is the breeding of money," Theron said, his voice hardening. "Currency is sterile. It is a dead thing meant to facilitate the movement of living goods. When you make money breed money, you make the dead give birth to the dead. It is the most unnatural thing we can do. It creates a lineage of value that demands tribute from the living. You are not just preserving a chip, Elara. You are institutionalizing the idea that the past can own the future."

  He placed the shard back on the table. It sat there, gleaming, an accusation in ceramic.

  "If you release this," Theron said, "you introduce *chrematistike* into the heart of *oikonomia*. You turn the community from a household into a marketplace. Neighbors become creditors. Trust becomes collateral. The social rupture will not come from theft, but from the slow freezing of our reciprocal bonds. Those with the permanent shards will withdraw from the flow, and the flow will stagnate around them."

  "So we destroy it," Elara said. "We bury the formula."

  "Is it ours to destroy?" Theron asked. "Knowledge is not clay. You know it. I know it now. If we suppress it, we become tyrants guarding a secret. If we release it, we become architects of a new inequality. There is a third path, perhaps. To regulate it. To allow a class of permanent value for long-term projects, while keeping the perishable shards for daily bread."

  "And create a two-tiered society?" Elara asked. "Those who live in time, and those who live outside it?"

  Theron shrugged, a gesture of profound uncertainty. "Perhaps that is the natural evolution of a settlement. Perhaps we were naive to think we could legislate against the desire for permanence. The shard is hard, Elara. It resists the decay we imposed on it. Maybe that resistance is a truth we tried to bury."

  He pushed the shard toward her. "The Council meets at dusk. They will ask for your report on Batch 904. You must tell them the batch was flawed and incinerated. Or you must tell them you have unlocked eternity. Or you must propose a law to govern the immortal shard."

  "And what will you recommend?" Elara asked.

  "I am an elder," Theron said, sitting back down and opening his ledger. "I guard the logic of the system. But I cannot guard against a change in the nature of reality. I will speak to the risks of the breeding coin. I will speak to the danger of the dead ruling the living. But the vote... the vote belongs to the citizens. And the citizens are tired of the dust."

  Elara pocketed the shard. It felt heavy, heavier than its mass suggested. It was the weight of a future that had not yet happened, pressing against the present.

  She walked out of the Archive into the sunlight. The plaza was busy. A baker handed a loaf to a carpenter; the carpenter handed over a handful of red shards. They smiled. The exchange was clean, finished, bounded. The baker would spend those shards before the moon turned. The circle would close.

  Elara touched the hard chip in her pocket. She could walk to the podium and confess. She could burn the notes in her lab. Or she could draft a proposal for a Long-Term Reserve Guild.

  She looked at the baker, then at the horizon where the settlement's walls met the wild lands beyond. The dust settled on her boots, soft and inevitable. The shard in her pocket remained hard. She took a step forward, unsure of which direction she was walking, knowing only that the ground beneath her feet had fundamentally changed.
