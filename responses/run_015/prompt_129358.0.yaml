      *   **Rising Action:** She tests it. It works. She feels the weight of this power. It's not about getting rich quick; it's about changing the *flow*.
      *   **The Confrontation:** She goes to Theron. Shows him the preserved Shard.
      *   **The Argument (Key Scene):** Theron explains why this is dangerous. Not because it's stealing, but because it changes the *nature* of the token from a measure to a breeder. The concept of *tokos* (offspring/interest).
      *   **Climax/Resolution:** Elara holds the secret. The community doesn't know yet. The choice is hers/theirs, but undecided.
      *   **Ending:** Ambiguous. The Shard sits on the table.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Describe the dust. The thirty-day cycle. The ritual of spending before rotting. Establish *oikonomia*—getting what you need for the household.
      *   *Elara's Role:* She mixes the clay and the sealant. She ensures they die.
