  Okay, ready to write.

  10. **Final Check on "Tokos":** The prompt specifically mentions *tokos* (currency breeding currency). I need to make sure this metaphor lands clearly. Money breeding money is unnatural because money is sterile (a tool). Making it fertile makes it a monster.

