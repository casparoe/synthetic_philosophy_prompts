      *   *Case 2:* Unjust side + Non-Culpable (Conscript/Ignorant) = Not Liable (or significantly less so).
      *   *Case 4:* Just side = Not Liable (Motive is irrelevant to liability; the threat they pose is justified).
      *   *Case 5 vs 6:* Civilian status doesn't grant automatic immunity. Liability tracks **direct causal responsibility** (Engineer yes, Farmer no).
  *   **Murder (Is his killing wrong?):** This tracks **Objective Justification** tempered by **Excuse**.
      *   If you kill someone who is *not* liable (i.e., they aren't threatening you unjustly), it is murder (Case 1).
      *   If you kill someone who *is* liable (even if you have bad motives), it is not murder (Case 4).
      *   If you are non-culpable but objectively wrong, you are excused from blame (Case 2).

  ### 2. Two Alternative Rules That Fit the Data
  You need rivals to test her against. These two also explain the six cases perfectly well.

  **Rival A: The Epistemic Reasonableness Rule**
  *   **Principle:** Liability and permissibility track what a **reasonable person** would believe about the justice of the war, not necessarily the objective truth.
  *   **Fit:**
      *   *Case 1 & 3:* Reasonable person would know the war is unjust (Volunteer/Looking away) → Liable/Murder.
      *   *Case 2:* Reasonable person in his position (Conscript/No news) would believe it's defensive → Not Liable/Excused.
      *   *Case 4:* Reasonable person knows defence is permissible regardless of motive → Not Liable/Not Murder.
      *   *Case 5 vs 6:* Reasonable person knows coding missiles is direct harm; selling spuds is not.
  *   **Difference:** This rule cares about *evidence available to the agent*, whereas the Responsibility Account cares about *objective moral facts*.

  **Rival B: The Voluntary Contribution Rule**
  *   **Principle:** Liability arises from **voluntarily assuming a role** that contributes to lethal harm, scaled by proximity to the violence.
  *   **Fit:**
      *   *Case 1 & 3:* Volunteered → Liable.
      *   *Case 2:* Coerced (Not voluntary) → Not Liable.
      *   *Case 4:* Volunteered, but contribution is to a *just* cause (which doesn't generate liability) → Not Liable.
      *   *Case 5 vs 6:* Engineer voluntarily writes code (Direct); Farmer sells goods (Indirect/Market norm).
  *   **Difference:** This focuses on the *act of joining/contributing* rather than the moral status of the threat itself.

  ### 3. Prediction for Tonight's Case (The Confused Patriot)
  **The Case:** Volunteer, Just Side (Objectively), Believes Unjust (Subjectively), Motive: Partiality (Brother).
  **The Prediction:**
  *   **May he be killed?** **No.**
      *   *Reason:* Under the Responsibility Account, liability is objective. He is not responsible for a wrongful threat. The enemy soldiers advancing on him are the unjust aggressors (assuming they are standard combatants on the invading side). He is not liable to be killed.
  *   **Is it murder?** **No.**
      *   *Reason:* This is the crucial McMahan move. "Murder" implies violating the victim's right not to be killed. The enemy soldiers *are* liable (they are unjust aggressors). Therefore, killing them is not murder, even if the agent is confused about the geopolitics. His subjective belief makes him *praiseworthy* or *blameworthy* personally, but it doesn't change the objective rights of the men he shot.
      *   *Note:* She might add a caveat that he *ought not* to have fought if he believed it unjust, but in the binary of your game, it cannot be "murder" if the victims had forfeited their right to life.

  ### 4. The Killer Case for Tomorrow
  To tell the **Responsibility Account** (Objective) from the **Epistemic Rule** (Subjective/Reasonable Belief), you need a case where the objective facts and the reasonable belief diverge regarding the *victim's* status.

  **The Case:**
  > A soldier on the **Just** side. He is on patrol. He sees a figure in the distance holding what looks like an RPG. Given the fog of war and previous intel, a **reasonable person** would believe this is an enemy combatant about to fire. He shoots and kills him.
  >
  > **The Twist:** The figure was actually a **civilian on his own side**, holding a telescope, and the war is objectively **Just**.

  **The Questions:**
  1.  May *he* be killed by the enemy (if they knew what happened)?
  2.  Is *his* killing of the civilian murder?

  **Why this separates the rules:**
  *   **The Responsibility Account (Her likely view):** Liability and murder are objective. He killed a non-liable person (innocent civilian). Therefore, **Yes, it is murder** (or at least objectively wrongful killing), even if he is not to *blame*. He violated the civilian's right to life.
  *   **The Epistemic Reasonableness Rule:** He acted on reasonable belief. He thought he was killing a liable threat. Therefore, **No, it is not murder**. It is a tragic mistake, but morally permissible ex-ante.
  *   **The Voluntary Contribution Rule:** Depends on whether "mistaken killing" counts as a voluntary contribution to wrongful harm. Likely says **Not Murder** due to lack of intent.

  If she says "It's murder because the civilian didn't forfeit their rights," she's a hardline Revisionist (Objective). If she says "It's not murder because he couldn't have known," she's drifting towards the Epistemic Rule. Given she's a McMahan person, she should bite the bullet and say it's objectively wrong (though excusable), which gives you the wedge you need.

