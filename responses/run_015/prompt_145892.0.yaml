      6.  Conclusion/Summary.

  8.  *(Final check against user prompt)*: Did I answer if one principle sorts these? Yes. Did I address the hospital verdict? Yes. Did I address the dignity clause? Yes. Did I address sentencing? Yes.

      *Key Insight to highlight:* The difference between using a market as a *thermometer* (information) vs. a *thermostat* (control). Governance requires a thermostat, but some rooms (hospitals, courts) require a human hand on the dial.

