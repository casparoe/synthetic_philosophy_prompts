answer: |-
  You have stumbled onto the central tension in the ethics of futarchy (governance by prediction market). Your intuition is correct: the distinction between **empirical bets** (what will happen) and **value judgments** (what should happen) is necessary, but it is not sufficient.

  The hospital case proves this. "Who will survive?" is an empirical question. If empirical/normative were the only line, the hospital market should be "fine." It feels wrong because it violates a deeper structural constraint.

  Here is a framework that sorts your cases, saves your hospital verdict, and bans criminal sentencing outright.

  ### The Principle: Non-Delegable Moral Agency

  The unifying principle is this: **Prediction markets can be used to *inform* decisions, but they cannot be used to *execute* decisions where a specific human agent holds a non-delegable fiduciary or moral duty.**

  When you hold a specific duty of care, justice, or stewardship toward a human being, you cannot outsource the final decision to an aggregate mechanism. You must remain the moral bottleneck.

  Here is how this principle sorts your cases:

  #### 1. The "Fine" Zone (Delegable Agency)
  *   **Company Product:** The fiduciary duty of a corporation is primarily to shareholder value (profit). A market betting on revenue aligns perfectly with this duty. The "customer" is a counterparty, not a ward.
  *   **City Subway:** This is borderline. It works *only if* "traffic reduction" is the sole metric of public good. If the subway is also about equity, access for the poor, or environmental justice, a market betting solely on traffic will fail. It is "Okay" only because infrastructure is largely technocratic.

  #### 2. The "Wrong" Zone (Non-Delegable Duty)
  *   **Hospital ICU:** This is the clearest violation. A doctor has a **fiduciary duty to the individual patient in front of them**.
      *   *Why Empirical/Normative fails here:* Even if the survival rate is an empirical fact, using it to deny care turns the doctor from a healer into a portfolio manager. It creates a perverse incentive to "cream" (select only easy patients) to win the market bets.
      *   *The Verdict:* You need the **Human Dignity Clause**. The clause states: *No mechanism may incentivize an agent to treat a human being as a statistical asset rather than a moral end.* The hospital market fails this because it prices life based on expected return (survival probability).
  *   **School Curriculum:** Education is a **formative duty**. It is not just about output (test scores); it is about shaping autonomy and citizenship. A market might predict that rote memorization boosts scores more than critical thinking, but the school board has a duty to teach what is *right* for a citizen, not just what is *efficient* for a metric.
  *   **Family Vacation:** This violates **relational integrity**. Families operate on norms of gift and need, not price and probability. Monetizing the decision erodes the trust required for the relationship to function. It's "dystopian" because it imports market norms into a sphere defined by non-market norms.

  #### 3. The "Banned Outright" Zone (Sovereign & Justice Duties)
  *   **Criminal Sentencing:** This must be banned.
      *   *Reason 1 (Justice vs. Risk):* Sentencing is about **desert** (what you deserve for what you did), not **risk** (what you might do next). A market predicts recidivism (risk). Using that to set punishment punishes the individual for the statistical sins of their class.
      *   *Reason 2 (Accountability):* A judge must look a defendant in the eye and say, "I am taking your liberty." If a judge says, "The market took your liberty," the moral link of the social contract is broken.
  *   **Government War:** This is the ultimate **Sovereign Duty**.
      *   *The Unease:* Your unease isn't just risk aversion; it is the **Moral Buffer Problem**. War requires the willingness to sacrifice lives. If leaders hide behind a market's "positive expected utility," they sanitize the moral horror of killing. They become administrators of risk rather than stewards of peace.

  ### Does the "Empirical vs. Value" distinction save the Hospital?
  **No.** As you suspected, "Who will survive?" is empirical. The hospital case fails not because the data is noisy, but because the **incentive structure corrupts the duty of care.**

  If you allow doctors to bet on survival, you align their financial interest with *avoiding risky patients*. The market works too well: it successfully predicts who will die, and therefore the hospital stops treating them. That is a market success and a moral catastrophe.

  You absolutely need the **Human Dignity Clause** (or "Fiduciary Boundary"). The principle must state:
  > *Markets may optimize for efficiency, but never where efficiency conflicts with a specific duty of care owed to an identifiable human being.*

  ### The Sentencing Verdict
  Your instinct to ban sentencing markets is correct and follows from the principle.
  1.  **Individualization:** Justice requires judging the *person*, markets judge the *class*.
  2.  **Legitimacy:** The state's monopoly on violence is only legitimate if exercised through human judgment and due process, not algorithmic or probabilistic aggregation.
  3.  **The "Minority Report" Problem:** Sentencing based on prediction markets punishes *probability of future crime*, not *guilt of past crime*. That is preemptive detention, not justice.

  ### Summary of the Framework

  To sort your gut calls, apply this three-step test:

  1.  **The Metric Test:** Does the market metric capture the *entire* goal? (Subway fails if it ignores equity; Company passes because profit is the goal).
  2.  **The Fiduciary Test:** Does the decision-maker owe a specific duty of care to an identifiable person? (Hospital, School, Family = Yes. Company Shareholders = No).
  3.  **The Dignity Test:** Does the decision treat a human right (liberty, life, care) as a tradeable commodity? (Sentencing, War, ICU = Yes).

  **The Verdict:**
  *   **Company:** Passes all.
  *   **Subway:** Passes 2 & 3, risks failing 1.
  *   **Hospital:** Fails 2 & 3.
  *   **War:** Fails 2 & 3.
  *   **School:** Fails 2.
  *   **Family:** Fails 2.
  *   **Sentencing:** Fails 2 & 3 (Catastrophically).

  Your unease is the sound of your moral intuition recognizing that **markets are excellent thermometers, but dangerous thermostats.** In governance, they should tell you the temperature (forecast), but never turn on the heat (decide). In spheres of human dignity (hospitals, courts), they shouldn't even be allowed in the room.
