          *   *Strength:* Strongly aligns with the "Human Dignity" intuition.

      *   *Hypothesis 4: Accountability and Agency.*
          *   If a market makes the decision, who is responsible when it goes wrong?
          *   Company: CEO still responsible.
          *   Hospital: Doctor abdicates duty.
          *   Government: Leaders abdicate moral burden of war.
          *   Sentencing: Judge abdicates moral judgment.
          *   *Strength:* Explains the "unease" about war and sentencing.

  4.  **Synthesize a Framework:**
      The user is looking for *one principle*, but reality suggests a *two-axis framework* might be more accurate. However, to answer the prompt directly, I need to find the *core* distinction that covers most cases, then add the necessary "clause."

      *   *Core Principle:* **The Distinction between Information Aggregation and Moral Agency.**
          *   Markets are good tools for *aggregating information* (forecasting).
          *   Markets are bad tools for *exercising moral agency* (deciding).
          *   When the decision involves fundamental rights or duties of care, the human agent must retain the veto/decision power.

      *   *Refining the Principle:* **The "Fiduciary Duty" Test.**
          *   In contexts where one party has a fiduciary or sacred duty to another (Doctor-Patient, State-Citizen in justice/war, Parent-Child), you cannot outsource the decision to a mechanism that optimizes for efficiency/probability over duty.
          *   Company: Duty is to profit. Market aligns.
          *   Subway: Duty is efficient infrastructure. Market aligns.
          *   Hospital: Duty is care. Market conflicts (optimizes survival rates, not care).
          *   Sentencing: Duty is justice. Market conflicts (optimizes risk reduction, not justice).
          *   War: Duty is protection/just war. Market conflicts (optimizes expected utility, not morality).

  5.  **Drafting the Response:**

      *   **Acknowledge the sophistication:** The user has already identified the key tension (empirical vs. normative isn't enough).
      *   **Propose the Principle:** "The Fiduciary Boundary" or "The Non-Delegable Duty."
      *   **Apply to Cases:**
          *   *Company:* No fiduciary duty to customers beyond contract. Profit is the goal. Market fits.
