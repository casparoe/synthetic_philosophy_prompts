      *   **Address the "Human Dignity" Clause:** Yes, it's needed. The principle is about *Agency*, but the *limit* is defined by *Dignity/Rights*.
      *   **Address Sentencing:** This is the strongest case for a ban. It conflates *prediction* (recidivism) with *desert* (punishment).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is the Subway case actually okay?* If the market says "No traffic reduction," but the subway helps the poor who don't drive, the market misses the normative value of equity. I should note that the Subway case is "Okay" *only if* the metric (traffic) fully captures the public good. If the metric is incomplete, the market fails.
      *   *Hospital:* It's not just noise. It's the *incentive structure*. If doctors bet on survival, they might reject risky patients to win the bet. This is "creaming."
      *   *War:* It's not just risk aversion. It's the "Moral Buffer." Markets make killing sterile.
