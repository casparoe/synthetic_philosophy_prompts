  2.  **Deconstruct the Cases:**
      *   *Company (Revenue):* Goal is clear (profit). Metric is objective. Stakeholders are shareholders (mostly). Low moral stakes.
      *   *City (Subway):* Goal is public good (traffic). Metric is measurable. Stakeholders are citizens. Moderate moral stakes (tax money, convenience).
      *   *Hospital (ICU):* Goal is saving lives. Metric is survival. Stakeholders are patients (vulnerable). High moral stakes (life/death). *Key issue:* Triage based on market probability feels like abandoning duty of care.
      *   *Government (War):* Goal is national security/interest. Metric is "winning." Stakeholders are citizens/soldiers/enemies. Extreme moral stakes (death, sovereignty). *Key issue:* Delegating the *decision* to kill to a market removes accountability and moral agency.
      *   *School (Curriculum):* Goal is education. Metric is... test scores? Future earnings? Stakeholders are children. High moral stakes (future autonomy). *Key issue:* Education is a normative good, not just an empirical output. What *should* be taught vs. what *works* for a specific metric.
      *   *Family (Vacation):* Goal is enjoyment. Metric is happiness. Stakeholders are family. Low moral stakes. *Key issue:* Monetizing family dynamics erodes relational trust.
      *   *Criminal Sentencing:* Goal is justice. Metric is recidivism? Stakeholders are accused/victims/society. Extreme moral stakes (liberty). *Key issue:* Justice requires individualized moral judgment, not aggregate probability.

  3.  **Evaluate Potential Principles:**

      *   *Hypothesis 1: Empirical vs. Normative.*
          *   Does it distinguish Subway (Okay) from School (Wrong)?
          *   Subway: "Will traffic drop?" (Empirical).
          *   School: "What math should kids learn?" (Normative).
          *   *Problem:* Hospital is "Who will survive?" (Empirical), but user says it's Wrong. So empirical/normative isn't enough.
          *   *Problem:* War is "Will we win?" (Empirical), but decision to fight is Normative.

      *   *Hypothesis 2: Stakeholder Vulnerability / Power Asymmetry.*
          *   Company: Shareholders/Customers (Arm's length).
          *   Hospital: Patients (Vulnerable, captive).
          *   Prisoners: Accused (Vulnerable, captive).
          *   *Strength:* Explains Hospital and Sentencing.
          *   *Weakness:* Doesn't fully explain War (citizens aren't exactly captive in the same way) or School (kids are vulnerable, but subway riders are too).

      *   *Hypothesis 3: Commodification of Inalienable Rights.*
          *   Markets work for tradeable goods. They fail for rights (life, liberty, justice, care).
          *   Hospital: Right to care based on need, not probability of return on investment.
          *   Sentencing: Right to individualized justice, not statistical risk.
          *   War: Sovereign duty to protect, not gamble.
          *   Subway: Transportation is a service, not a right (arguably).
