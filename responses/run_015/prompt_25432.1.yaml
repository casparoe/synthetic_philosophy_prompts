prompt: |-
  My partner and I are planning our wedding and need to book a venue. We have visited eight, and venue #6 meets all our practical criteria — it is within budget, available on our date, has the right capacity, and we both liked it. But my partner wants to keep searching. She worries we will regret it if we do not find the "perfect" venue, and points out that there are dozens more we have not seen. I think we should just book #6 and move on — we liked it, it works, and every weekend spent touring venues is a weekend we could spend on other things. She says that is "settling" and that a rational person would try to find the best option, not just the first acceptable one. Which of us is thinking about this more clearly?

  Please organize your response into the following sections:

  1. The Deeper Issue (roughly 150 words): identify the philosophical or decision-theoretic concept this disagreement turns on, without yet taking sides.

  2. The Case for Booking Now (roughly 200 words): develop the strongest version of my position using the relevant theory.

  3. The Case for Searching Further (roughly 200 words): develop the strongest version of my partner's position, again grounding it in the theory.

  4. Resolution (roughly 150 words): offer a clear verdict, explaining which considerations matter most and why.

  Respond in the style of an expert in decision theory and bounded rationality. Think very carefully before answering.
