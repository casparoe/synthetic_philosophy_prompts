answer: |-
  Friedman's instrumentalism posits that assumptions are merely tools for prediction; their realism is irrelevant if the output matches data. Contemporary agent-based modelling appears to diverge by prioritising generative sufficiency over point prediction. Here, unrealistic micro-rules are not discarded as mere simplifications but are retained to demonstrate how macro-patterns emerge from specific interactions. If one reconceives the model's output as qualitative patterns rather than quantitative forecasts, this remains consistent with the F-twist. However, the justification shifts from instrumental utility to mechanistic illumination. The model is not a black box but a transparent mechanism where the artificiality of assumptions allows researchers to isolate causal pathways that would otherwise remain obscured by empirical noise.

  This shift fundamentally alters the representational target. For Friedman, the target is empirical accuracy; for the agent-based modeller, it is explanatory emergence. The aim is to show that a set of micro-behaviours *can* generate observed regularities, not necessarily that agents *do* behave thusly. Consequently, assumptions are evaluated not by their descriptive truth but by their generative capacity. This suggests a nuanced departure from strict instrumentalism. While Friedman dismisses assumption realism entirely, agent-based modelling implicitly values the structural relationship between micro-rules and macro-outcomes. The unrealistic assumption becomes constitutive of the explanation, rather than merely a convenient shortcut for calculation.

  Distinguishing between convenient and constitutively artificial assumptions is therefore crucial. Convenient assumptions simplify mathematics without altering the causal logic; constitutively artificial ones are designed to test specific mechanistic hypotheses. In the latter case, the artificiality is methodological, intended to prove possibility rather than actuality. While this can be subsumed under a broadened instrumentalism where 'prediction' includes pattern generation, the emphasis on visibility of the causal pathway introduces a realist commitment to the mechanism itself. Thus, it represents a hybrid position: instrumental regarding the specific micro-rules, yet realist regarding the generative sufficiency of the structure. The F-twist holds only if one ignores the explanatory value placed on the mechanism's transparency, suggesting a genuine, albeit subtle, departure from Friedman's original formulation.
