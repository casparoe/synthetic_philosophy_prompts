prompt: |-
  I'm preparing a specification for a philosophy-of-mind seminar on self-knowledge, and I'd prefer to set the evaluation criteria before surveying familiar theories. The target is a theory of introspective reliability — specifically, one adequate to explain why first-person reports about occurrent mental states are generally authoritative yet systematically fail in predictable domains.

  Write the complete list of desiderata: what any adequate theory must deliver. For each requirement, provide the motivating case or consideration — including standard successes (immediate access to occurrent pain or belief), well-documented failures (affective forecasting errors, confabulated reasons for choice, implicit attitudes that outstrip explicit awareness), and a niche phenomenon I want explicitly included: "introspective drift," in which repeated first-person reports of an apparently unchanged mental state over brief intervals yield systematically divergent descriptions, requiring the theory to determine whether this is measurement noise, genuine micro-fluctuation, or an artifact of the reporting mechanism. Preserve distinctions that must not be collapsed — between phenomenal access and epistemic access, between accuracy and authority, between transparent and opaque mental states. Note which results from cognitive psychology must be respected, flag which desiderata are non-negotiable and which are camp-specific preferences (e.g., infallibility, full explanatory transparency, or complete absence of inference), and identify any subset of requirements that appear jointly unsatisfiable. Then briefly indicate how a transparency model, a constructivist account, and an error-theoretic view fare against the list, keeping the weight on the criteria rather than the scorecard.

  Present the response in two parts. First, the analysis in prose. Second, a structured summary in JSON with exactly this schema: { "desiderata": [{"id": "string", "requirement": "string", "motivating_case_or_distinction": "string", "negotiable": boolean}], "tensions": [{"pair": "string", "explanation": "string"}], "scorecard": [{"theory_name": "string", "meets": ["string"], "fails": ["string"]}] }.
