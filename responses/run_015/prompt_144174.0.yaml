  At Cirey, a guest found Émilie du Châtelet late one evening, vigorously correcting a mathematical proof while calmly ignoring a letter suggesting her lover would not arrive as promised.

  "Madame," the guest remarked, "you apply the utmost rigor to these numbers, yet treat this breach of promise with casual disregard. Does your intellect not demand consistency?"

  "Consistency is for truth," she replied, setting down her pen. "Happiness requires architecture. If I do not exhaust my critical faculties on these equations, they will turn upon my hopes and dismantle them. I study not to discover what is real, but to fortify what I wish to believe."

  The guest blinked. "So you labor to remain deceived?"

  "I labor," she corrected, "to ensure the deception is sturdy enough to live in. A fool's illusion is a bubble; a scholar's is a dome. I build the dome so I may enjoy the view without fearing the wind."
