  # Desiderata for a Theory of Moral Compromise

  To construct an adequate theory of moral compromise between genuinely incompatible value systems—such as a rights-based deontology and a longtermist consequentialism—the theory must satisfy specific structural and normative conditions. These conditions ensure that cooperation is morally meaningful rather than merely modus vivendi, and that it remains stable over time without requiring agents to fracture their normative identities.

  The following desiderata distinguish the necessary structural features of moral compromise from the substantive preferences of specific ethical traditions.

  ### 1. The Integrity Condition (Authenticity)
  **Status: [Non-Negotiable]**

  **Conceptual Motivation:**
  A theory of moral compromise must distinguish authentic agreement from strategic surrender, bribery, or coercion. If a deontologist agrees to a policy violation solely because a consequentialist threatens economic sanctions, this is domination, not compromise. If they agree solely for a side-payment, it is bribery. If they agree because they recognize the other's agency as worthy of accommodation despite disagreement, it is compromise.

  **Criterion:**
  The theory must specify a motivational criterion wherein the agreement is partly constituted by a moral reason to cooperate with the disagreeing party, distinct from the prudential reason to avoid conflict. The agents must view the compromise as a morally permissible (or required) action *within their own frameworks*, not merely as a lesser evil forced by circumstance.

  ### 2. The Coherence Preservation Requirement
  **Status: [Non-Negotiable for Stability / Camp-Specific Preference for Strictness]**

  **Conceptual Motivation:**
  Agents operate within normative frameworks that possess internal logic. A deontologist cannot agree to violate a categorical imperative without ceasing to be a deontologist; a consequentialist cannot agree to an action that demonstrably reduces expected value without ceasing to be a consequentialist. However, the *degree* of coherence required is contested.

  **Criterion:**
  The theory must ensure that the compromise does not generate a logical contradiction within the agent's core commitments that would cause normative fragmentation.
  *   **Non-Negotiable Aspect:** The compromise must be justifiable within each framework's own terms (e.g., via a secondary rule or exception clause).
  *   **Camp-Specific Preference:** Deontological camps often prefer a *strict* coherence constraint (no violation of core duties), whereas consequentialist camps may accept a *flexible* coherence constraint (local incoherence permitted for global optimization). An adequate theory must accommodate the strict preference without making compromise impossible.

  ### 3. The Incommensurable Gain Condition
  **Status: [Non-Negotiable]**

  **Conceptual Motivation:**
  Compromise implies mutual gain. However, if value systems are incommensurable (e.g., "rights" vs. "utility"), there is no common currency to measure whether both parties have gained. Without a mechanism to recognize gain across frameworks, one party may view the outcome as a loss, destabilizing the agreement.

  **Criterion:**
  The theory must provide a metric for "gain" that is framework-relative but mutually recognizable. It must demonstrate that Party A achieves a state preferred by A's metrics, and Party B achieves a state preferred by B's metrics, without requiring a translation of A's value into B's currency. The stability of the compromise depends on the *visibility* of these distinct gains to both parties.

  ### 4. The Normative Status Constraint (Justice vs. Charity)
  **Status: [Non-Negotiable to Address / Camp-Specific Preference on Resolution]**

  **Conceptual Motivation:**
  Conflicts often arise where Framework A classifies an issue as a matter of Justice (entitlement/right) and Framework B classifies it as Charity (supererogation/permissible variation). If B accedes to A's demand, A sees justice served, but B may feel coerced into fulfilling a non-duty, or A may feel demeaned if B frames the action as "charity."

  **Criterion:**
  The theory must constrain how the action is described and enacted to prevent normative humiliation.
  *   **Non-Negotiable Aspect:** The theory must require a mechanism (such as agnostic framing or parallel justification) that allows the action to proceed without forcing one party to explicitly deny their ontological classification of the act.
  *   **Camp-Specific Preference:** Deontological camps hold a preference that Justice claims *must* trump Charity classifications in the final agreement. Consequentialist camps hold a preference that the *outcome* matters more than the classification. An adequate theory must manage this tension without universally validating one ontology over the other.

  ***

  ### Assessment of Joint Satisfiability

  A critical question is whether these requirements are jointly satisfiable, particularly given the tension between the **Incommensurable Gain Condition** and the **Coherence Preservation Requirement**.

  **The Tension:**
  If value systems are truly incommensurable (Req 3), it is difficult to verify if a compromise preserves internal coherence (Req 2). For example, if a longtermist accepts a rights-based constraint that lowers expected utility, they must justify this within consequentialism (e.g., as a rule-utilitarian heuristic). If the deontologist accepts a utility-based exception, they must justify it within deontology (e.g., as a conflicting duty). If the incommensurability is radical, no such translation is possible, and coherence is broken.

  **Assessment:**
  The requirements are **jointly satisfiable**, provided the theory adopts a *modular* rather than *integrative* approach to coherence.
  1.  **Incommensurability does not entail incomparability.** Agents can compare outcomes ("Better for me, Better for you") without agreeing on a common metric ("Better simpliciter"). This satisfies Req 3.
  2.  **Coherence can be maintained via "Normative Brackets."** Agents can agree to bracket the ultimate justification of the act while agreeing on the act itself. This satisfies Req 2 and Req 4.
  3.  **Stability is preserved** because the Integrity Condition (Req 1) ensures the agreement is not viewed as a temporary truce but as a morally valid cooperation.

  **Risk of Failure:**
  The subset of requirements becomes unsatisfiable if "Coherence" is interpreted as requiring *shared* justification rather than *parallel* justification. If the theory demands that both parties agree on *why* the compromise is good (integrative), incommensurability destroys stability. If the theory allows parties to agree on *what* to do while disagreeing on *why* (modular), stability is maintained.

  ***

  ### Brief Assessment of Ethical Approaches

  *   **Contractualism:** Fares well on the **Integrity Condition** and **Normative Status Constraint**, as it focuses on reasonable rejectability and mutual justification. However, it may struggle with the **Incommensurable Gain Condition** if the "currency" of reasonable agreement presupposes a shared conception of value that longtermists and deontologists do not share.
  *   **Value-Pluralism:** Naturally accommodates the **Incommensurable Gain Condition** by accepting multiple valid values. However, it risks failing the **Coherence Preservation Requirement** if the pluralism is so radical that it prevents agents from maintaining a coherent hierarchy of values within their own systems during the compromise.
  *   **Virtue Ethics:** Offers a strong mechanism for the **Integrity Condition** by focusing on the character of the agents (e.g., acting with practical wisdom). However, it may struggle with the **Normative Status Constraint** in institutional contexts, as virtue ethics is often agent-relative and less equipped to resolve structural clashes between justice and charity in policy frameworks.
