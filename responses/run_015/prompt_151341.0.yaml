  5.  **Statues vs. Street Names (The Asymmetry):**
      *   *User's Intuition:* Street names are *used*, statues are *seen*. Street names are zero-sum (finite), statues are additive.
      *   *Validation:* This is a real distinction, not just vibes.
      *   *Usage:* Saying "I live on Lee Street" is a speech act. You are repeating the name. Passing a statue is passive.
      *   *Scarcity:* There are limited main arteries. Naming one "King Blvd" means it's not "Davis Blvd." It's a prioritization of civic space. Statues can be crowded into a park; street names structure the city itself.
      *   *Inertia/Cost:* Does cost matter? Yes. Keeping a name because changing it is expensive is *pragmatic*, not *honorific*. But if you *could* change it and don't, that leans toward endorsement.
      *   *Distinction:* Honor requires *willingness* to bear cost. If the cost of keeping the name is zero, it's just inertia. If the cost of removing it is high and you pay it to keep the name, that's honor.

  6.  **The Expiry Date Idea:**
