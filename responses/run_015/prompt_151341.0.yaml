answer: |-
  This is a great set of questions. You're right that you and your brother-in-law are likely using the same word ("honor") to describe three different mechanisms. That's why you keep talking past each other.

  Here is the lay of the land, broken down in plain English, without the academic baggage.

  ### Part 1: The Three Stories of Honor

  You listed three ways a statue or sign might "honor" someone. Here is where each one works and where it breaks.

  **1. The "Original Intent" Story (It honors because the past put it there)**
  *   **The Idea:** The honor is baked into the concrete in 1911. It's a message in a bottle from our ancestors.
  *   **Where it breaks:** If this were true, we would have zero say in it. It would mean a dead generation controls our civic landscape forever. It also means that if the town hates the guy now, the statue is still "honoring" him, which makes the statue an act of aggression against the current town.
  *   **Verdict:** This explains why the statue *exists*, but not what it *does* today.

  **2. The "Current Maintenance" Story (It honors because we keep it up)**
  *   **The Idea:** Every time the city budgets money to clean the bronze or repave around the base, we are re-signing the contract. We are saying, "Yes, still him."
  *   **Where it breaks (The Repaving Crew Problem):** You asked why the crew fixing the street isn't honoring the guy. The answer is **selection vs. maintenance.**
      *   Fixing a pothole is maintenance of *infrastructure*.
      *   Choosing *not* to remove a statue is maintenance of *status*.
      *   The crew isn't honoring the general; the City Council is. The Council has the power to remove the statue and chooses not to. That specific choice—the refusal to remove—is where the honor lives. The guy sweeping the leaves is just doing his job; the people who decide the statue stays are the ones honoring.
  *   **Verdict:** This is the strongest story for how honor works *now*, but it requires an active decision to keep it, not just passive neglect.

  **3. The "Current Reception" Story (It honors because people read it as a salute)**
  *   **The Idea:** Honor is a signal. If nobody receives the signal, there is no honor.
  *   **Where it breaks (The Blank Plaque Problem):** You imagined a statue where no one knows who the guy is. If teenagers just use it as a meetup spot, is it honoring him? **No.**
      *   Honor requires a shared understanding. If the community looks at the statue and sees "random horse," it is no longer functioning as honor. It's just decor.
      *   This destroys the "It's just history now" argument. If it's "just history," it belongs in a museum where the context is explained. If it's on a main street, it's making a claim about importance. If people don't understand the claim, the honor has failed. If they *do* understand the claim and walk past it, the honor succeeds.
  *   **Verdict:** This is the reality check. If the neighborhood doesn't feel honored by the person, the statue isn't successfully honoring them, even if the City Council wants it to.

  ### Part 2: Statues vs. Street Names

  Your gut is right. These are not the same thing. There are real structural differences.

  **1. Usage vs. Observation**
  *   **Statues:** You look *at* them. They are background noise unless you stop to think.
  *   **Street Names:** You speak *through* them. Every time you order pizza, call an ambulance, or fill out a tax form, you are saying the name. You are actively repeating the tribute.
  *   **Why it matters:** A statue is a passive endorsement. A street name is an active ritual. Renaming a street stops the ritual. Keeping the name continues the ritual.

  **2. Scarcity (The Zero-Sum Problem)**
  *   **Statues:** You can always build another park. You can put three statues in one square. It's additive.
  *   **Street Names:** There is only one Main Street. There is only one major north-south artery. Naming it after Person A means it is *not* named after Person B.
  *   **Why it matters:** Statues say, "This person is worth remembering." Street names say, "This person is the *most* important thing about this part of the city." Street names are a hierarchy. Statues are a gallery.

  **3. Inertia and Cost**
  *   You asked if the cost of renaming matters. If a city keeps a name just because changing addresses is expensive, is that honor?
  *   **No.** That is pragmatism.
  *   **The Test:** If the cost of changing the name were zero, would they change it?
      *   If the answer is "Yes, we'd change it immediately, but we can't afford it," then the name is **not** honoring the person anymore. It's just a logistical headache.
      *   If the answer is "No, we like the name," *then* it is honor.
      *   **The Gray Zone:** Most cities are in the middle. They don't love the name, but they don't hate it enough to pay the bill. In that case, the "honor" is fading. It's running on fumes. It's not active respect; it's passive habit.

  ### Part 3: The Expiry Date Thought Experiment

  You asked: If we had to re-vote on statues every 50 years, would that make the honor genuine?

  **Yes.** And here is why that tells you which of your three stories is the right one.

  *   **Current System:** We are mostly running on Story 1 (Original Intent) mixed with Story 2 (Inertia). The 1911 vote counts for 2024. That's why it feels creepy. It's a ghost running the show.
  *   **Expiry System:** If we had to re-vote, we shift entirely to Story 2 (Current Retention).
  *   **The Result:** If we vote to keep the statue, *we* own the honor. It's not our great-grandfathers honoring him; it's *us*.
  *   **The Bureaucracy Worry:** You worried this would turn it into a checkbox. It might. But a checkbox we consciously check is more honest than a monument we ignore.
  *   **The Verdict:** This experiment proves that **honor is a living relationship, not a physical object.** A bronze statue is just metal. It only becomes "honor" when living people agree that it represents them. If you force that agreement to be renewed, you make the honor real again. If you can't get the votes to renew it, the honor was already dead; the expiry date just admits it.

  ### Part 4: Honor vs. Commemorate vs. Mark

  This is the vocabulary you need to settle the argument with your brother-in-law. These are three different jobs.

  **1. Marking (Neutral)**
  *   **Meaning:** "Something happened here."
  *   **Example:** A small plaque on a building that says "Site of the 1902 Fire."
  *   **Vibe:** Informational. No judgment on whether the fire was good or bad.
  *   **Does it require removal?** No. History happened.

  **2. Commemorating (Educational)**
  *   **Meaning:** "Remember this person/event so we learn from it."
  *   **Example:** A museum exhibit about a controversial general.
  *   **Vibe:** Complex. You can commemorate a villain to understand evil. You can commemorate a hero to understand virtue.
  *   **Does it require removal?** No, but it requires *context*. If you move a statue from a park to a museum, you shift it from Honor to Commemoration.

  **3. Honoring (Normative)**
  *   **Meaning:** "This person represents who we are and who we want to be."
  *   **Example:** A statue on the courthouse lawn. A high school name.
  *   **Vibe:** Aspirational. We are holding this person up as a model.
  *   **Does it require removal?** Yes, if they no longer represent us. You cannot honor someone you reject. To keep the statue up is to lie about who you are.

  ### The Bottom Line

  Here is the synthesis you can take to your brother-in-law:

  1.  **Honor is not in the bronze.** It is in the **agreement**. A statue only honors if the current community agrees that the person represents their values.
  2.  **Statues are different from Street Names.** Street names are functional infrastructure we speak aloud; they are scarcer and more intimate. Keeping a street name out of laziness isn't honor, but fighting to keep it is.
  3.  **Inertia is not Honor.** If a city keeps a name just because changing it is expensive, the "honor" is an illusion. It's just budgeting. Real honor requires a willingness to pay the cost to maintain the tribute.
  4.  **The "Just History" Defense is False.** If you want it to be history, put it in a museum (Commemoration). If it stays in the public square, it is making a claim about current values (Honor). You don't get to claim it's "just history" while keeping it in the place of highest honor.
  5.  **The Expiry Test:** If you aren't willing to vote for it again today, you shouldn't have it up. That proves that honor is something *we* do, not something *they* did.

  If you can agree that **Honor = Current Endorsement**, most of the argument should vanish. The fight isn't about what the statue *is*; it's about whether *we* still endorse the guy.
