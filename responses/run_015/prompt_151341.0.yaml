  3.  **Address the "Repaving Crew" Objection (Story 2):**
      *   Why isn't fixing the sidewalk honoring the statue?
      *   *Distinction:* Routine care vs. Selective preservation.
      *   *Analogy:* Keeping a house painted vs. keeping a specific photo on the mantle. One is maintenance of property, the other is curation of memory.
      *   *Key:* The decision *not* to remove it is the honor, not the decision to mow the lawn around it.

  4.  **Address the "Blank Plaque" Objection (Story 3):**
      *   If no one knows who it is, does it honor?
      *   *Answer:* No. Honor is a message. If the message is garbled, the honor is failed.
