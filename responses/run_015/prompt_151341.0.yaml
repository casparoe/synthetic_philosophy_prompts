          *   *Problem:* The past is dead. If we hate the person now, does the statue still honor them? If yes, that's bad for us. If no, then the stone doesn't hold the honor, the people do.
      *   *Story 2: Current Maintenance.* (It honors because *we* keep it up.)
          *   *Problem:* The "Repaving Crew" objection. Fixing the sidewalk isn't saluting the guy. It's just doing a job.
          *   *Refinement:* It's not about *maintenance*, it's about *retention*. Choosing *not* to remove it is the act.
