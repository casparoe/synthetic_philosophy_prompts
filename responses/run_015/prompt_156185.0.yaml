answer: |-
  **JOINT STATEMENT ON EPISTEMIC VALUE AND CREDAL NORMS**

  **Preamble**
  This document records the outcomes of an adversarial collaboration between proponents of Accuracy-First Epistemology and proponents of Epistemic Pluralism. The signatories acknowledge that while deep normative disagreements persist regarding the fundamental structure of epistemic utility, there exists a substantial substrate of formal and methodological consensus. The purpose of this statement is to codify shared commitments, delineate the precise locus of remaining disagreement, and identify the formal or empirical conditions under which the debate might be adjudicated.

  **I. Agreed Foundations**
  Both camps affirm the following claims as necessary conditions for any adequate normative theory of belief:

  1.  **Synchronic Coherence:** Belief states, represented as credence functions, are subject to synchronic coherence constraints. Specifically, credences must satisfy the axioms of probability to prevent vulnerability to a Dutch book (a set of bets guaranteeing a loss) or to avoid accuracy-domination by an alternative credence function.
  2.  **Decomposition of Accuracy:** Measures of epistemic accuracy, such as the Brier score, admit a decomposition into distinct statistical components. Specifically, the score is a function of calibration (the alignment of mean confidence with relative frequency), resolution (the ability to distinguish truth from falsehood across cases), and uncertainty (the inherent variance of the events).
  3.  **The Pragmatic Bridge:** Belief serves action through a decision-theoretic bridge. While epistemic norms may be distinct from practical norms, a theory of rational credence must be compatible with a decision rule that maximizes expected utility given those credences.
  4.  **Contextual Embedding:** No normative epistemology can be fully divorced from the practical contexts in which predictions are tested. The evaluation of a belief-forming method must account for the environment in which the agent operates, including the cost of error and the availability of information.

  **II. Points of Divergence**
  The following table summarizes the core normative disagreements. The wording is neutral; each camp accepts the table as an accurate characterization of their respective stances.

  | Crux | Accuracy-First Position (Monism) | Epistemic Pluralism Position (Pluralism) |
  | :--- | :--- | :--- |
  | **1. Lexical Priority of Calibration** | Calibration (or expected accuracy) enjoys lexical priority in every epistemic domain. Other goods are valuable only insofar as they maximize long-run accuracy. | Calibration does not enjoy lexical priority. Rational credence may legitimately trade a marginal loss in calibration for a substantial gain in other epistemic dimensions. |
  | **2. Reducibility of Coherence** | Explanatory coherence and understanding are reducible to expected accuracy. They are heuristics that generally track truth but possess no *sui generis* epistemic weight. | Explanatory coherence and understanding carry independent weight. They are fundamental epistemic values not fully reducible to truth-tracking metrics. |
  | **3. Model Preference (Opaque vs. Transparent)** | Faced with a choice, a rational agent must prefer the model with superior calibration, even if it is mechanistically opaque. | A rational agent may prefer a mechanistically transparent model, even if it exhibits slightly inferior calibration, due to the independent value of understanding. |

  **III. The Climate-Ensemble Dilemma**
  To ground the abstract disagreements in Section II, both camps agree that the "Climate-Ensemble Dilemma" serves as the decisive test case.

  *   **The Case:** An agent must adopt a predictive model for policy guidance.
      *   **Model A (Statistical Ensemble):** An opaque machine-learning ensemble. It demonstrates high calibration over historical hindcasts but offers no intelligible physical mechanism for its predictions.
      *   **Model B (Process-Based):** A mechanistic physical model. It yields explanatory understanding of atmospheric dynamics but exhibits slight miscalibration due to known parameterization approximations.

  *   **Camp Predictions:**
      *   **Accuracy-First:** The rational agent ought to adopt **Model A**. To choose Model B is to privilege a non-epistemic aesthetic (understanding) over the fundamental epistemic virtue (accuracy/calibration).
      *   **Pluralist:** The rational agent ought to adopt **Model B** (provided the calibration gap is within a tolerable threshold). The gain in explanatory understanding justifies the marginal loss in calibration, as understanding facilitates intervention and counterfactual reasoning in ways mere prediction does not.

  *   **Empirical Resolution:**
      Both camps agree that settling the empirical calibration gap (i.e., determining definitively which model is more accurate) would **not** resolve the philosophical dispute. It would merely shift the locus of the disagreement. If Model B were proven perfectly calibrated, the Accuracy-First camp would endorse it, but only *because* it became the accuracy-optimal choice, not because understanding was valued. If Model A remains better calibrated, the Pluralist camp would still argue for Model B based on the independent value of transparency. Therefore, the dispute is normative, not empirical.

  **IV. Semantic and Formal Horizons**

  **1. Verbal Disputes**
  The signatories acknowledge a partial verbal dispute concerning the definition of "Accuracy."
  *   The **Accuracy-First** camp defines accuracy strictly as proximity to the truth value of propositions (veritistic value).
  *   The **Pluralist** camp suggests that if "accuracy" is to be the sole norm, the definition must be expanded to include "structural accuracy" or "model fidelity," effectively absorbing the Pluralist's independent values into a broader definition of accuracy.
  *   **Agreement:** If the Accuracy-First camp expands the definition of accuracy to include explanatory power, the dispute becomes verbal. However, if accuracy remains defined strictly as truth-tracking (e.g., via proper scoring rules), the dispute is substantive.

  **2. Decisive Formal Results**
  The signatories identify the following formal results as potentially decisive for the debate:
  *   **For Accuracy-First:** A representation theorem demonstrating that any credence function optimizing for a pluralist utility function (including understanding) is diachronically inconsistent or vulnerable to a specific form of "epistemic Dutch book" distinct from the standard probabilistic variety.
  *   **For Pluralism:** A proof that in non-stationary environments (where the underlying data generating process changes), a policy optimizing for explanatory coherence strictly dominates a policy optimizing for calibration alone regarding long-run survival or intervention success, thereby establishing understanding as instrumentally necessary for truth-tracking in dynamic worlds.

  **Signatories**

  _________________________
  *Representative, Accuracy-First Epistemology*

  _________________________
  *Representative, Epistemic Pluralism*

