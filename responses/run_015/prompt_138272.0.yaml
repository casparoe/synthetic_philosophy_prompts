answer: |-
  Good morning. Thank you for coming.

  We are here to mark a change in the paperwork. In 1981, my father started this firm. For forty years, the equity belonged to him. Two years ago, he put sixty per cent of it into a trust for you. Today, the last forty per cent goes in. The family seat on the board disappears. I remain as Finance Director, and for the next three years, I will chair the trust board without a vote. After that, I am gone.

  This is not a celebration of the past. It is the start of a specific arrangement for the future. You know the rules better than I do, but they bear stating plainly. Each year, at least one-third of the net profit will be paid out as a bonus. It will be divided equally. A senior machinist and an apprentice will receive the same sum. The remainder is reserved for reinvestment or discretion by the trustees.

  There is another rule, written into the deed by my father alone. Ten years from today, the employee-members may hold a vote. If two-thirds of you agree, you can direct the trustees to sell the company to the highest bidder and divide the proceeds per head. My father told me once: if you cannot be trusted with the door, you are not owners, you are residents. He insisted on that clause so that the exit remains open. It is not a dare. It is not a threat. It is a statement that staying here must be a choice you make every year, not a condition you are born into.

  I know what some of you are thinking. A third of you have been here twenty years. You have seen schemes come and go. To some, this looks like a pay cut with speeches attached. You know that `[describe a specific pressure on the shop floor, e.g., the tolerance on the turbine blades or the heat of the furnace]` does not care about trust deeds. You know that if we miss a deadline, the customer does not care about our equity structure. They care about the metal.

  I know what my father's friends are thinking. They are in the back row. They think he has lost his nerve. They believe that without a single owner driving the profit motive, the discipline will slip. They believe competition will eat us.

  I am not here to tell you they are wrong. I am here to tell you that we do not know.

  There is a claim about human nature that underpins this structure. It is the claim that people will work as hard, as carefully, and invent as much for a common stake as they will for a wage under a manager. That claim has not been tested. Not here. Not at this scale. Not with real money at risk. Argument cannot settle it. Only trial can.

  John Stuart Mill wrote about this a hundred and fifty years ago. He suggested that the only honest way to test a new way of working is not to impose it by law, but to let firms like this one try it in the open market, free to fail. He defended competition not because it is perfect, but because it is the only test that keeps the experiment honest. If we cannot survive against competitors who do not share our profits, then this arrangement is wrong. If we cannot tolerate an equal bonus when a senior machinist can point to what he produces, then this arrangement is wrong. We are not proving a theory. We are running a trial.

  This is why I will not stand here and tell you that you were always the real owners. You were not. You were employees. You were essential, you were skilled, but you were not owners. To say otherwise is to rewrite the last forty years. This is not justice. It is not redemption. It is not the end of the wage system. It is a different set of rules for the same work.

  The Director of the Co-operative Federation will speak after me. He sees this as a beginning of something larger. I do not contradict him. But my focus is narrower. My focus is this foundry. My focus is whether we can keep the lights on and the bonuses paid while the market does what it always does: it tries to find our weakness.

  There are divisions in this room. My brother runs the machine shop. He voted against this transfer. He believes the risk is too high. He will say so at the reception. I respect his view. He stays because he believes in the work, not because he believes in the structure. That honesty is necessary. If everyone here agrees, we are not thinking.

  My father has forbidden me from using a certain word today. He uses it in private. He argues for it in private. But he believes that if I say it from this platform, it becomes his theory rather than your arrangement. It isn't your word yet. So I will not use it. I will not label this. I will only describe the mechanics.

  The mechanics are simple. The money is real. The risk is real.

  For those of you who have been here twenty years, you know that `[mention a specific historical challenge the firm survived, e.g., the crash in '92 or the supply chain failure in 2008]`. We survived because decisions were made quickly. Now, decisions will be made by trustees who work on the floor. That will be slower. It will be harder. It may cost us contracts. We have to find out if the gain in care and invention outweighs the loss in speed.

  For those of you who are new, you need to know that this is not a safety net. If the firm fails, the trust fails. There is no family fortune to bail us out. The ten-year clause is there to remind you that you can take the value and leave. But if you stay, you are betting your time on the idea that common stake produces common care.

  I gave up a job in London to come back. I did not come back to manage a decline. I came back to keep the accounts honest during the handover. My job is to ensure that the numbers you see are the numbers that are. I will not sugarcoat the profit margins. I will not hide the costs. If we are to test this, the data must be clean.

  So, where does this leave us?

  It leaves us with a question. Can we compete? Can we innovate? Can we tolerate the friction of equal share when contribution is unequal? We do not know. No one knows. The business school friends think the answer is no. The Federation Director thinks the answer is yes. I think the answer is unavailable until we have done the work.

  This is not a revolution. It is a workshop. We are adjusting the tools. We are changing the incentives. We are keeping the market as the judge.

  In ten years, you may vote to sell. You may vote to stay. You may vote to change the rules again. That is the point. The door is not locked. The trust deed is not a monument. It is a contract for a period of time.

  I ask you to treat this not as a gift, but as a task. The task is to find out if this works. If it does not, you have the power to end it. If it does, you have the power to sustain it.

  My father built the foundry. He built the machines. He built the client list. He has now built this structure. But he cannot build the habit. That belongs to you. It belongs to the way you handle `[specific detail, e.g., the scrap rate or the shift handover]`. It belongs to the way you argue in the breakroom. It belongs to the way you decide whether to reinvest or take the bonus.

  We are not ending anything today. We are beginning a test. I am willing to run the test. I am willing to accept the result, whatever it is. I hope you are too.

  Thank you.
