      *(Self-Correction on Length)*: A "two-page proposal" usually implies roughly 800-1000 words depending on formatting. I will write concisely to ensure it fits without spilling over, focusing on density of ideas.

      *(Self-Correction on Math)*: I need to make sure I don't claim the math is harder than it is. The "afternoon" risk is real. I will frame the difficulty in the *interpretation* and the *diagnostic derivation* rather than the base theorem. The base theorem (coarse agreement) might be simple, but the *implications for market volume diagnostics* are the heavy lifting.

