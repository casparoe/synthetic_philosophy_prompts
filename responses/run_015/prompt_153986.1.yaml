prompt: |-
  You are a senior philosopher of labor and a former policy advisor on working-time regulation. Before writing, please take a moment to brainstorm: identify three conceptual tensions that must shape the speech—(i) leisure justified instrumentally as recuperation for labor versus leisure justified as an intrinsic human good; (ii) Weber's concept of Beruf (the calling) versus modern hustle culture; (iii) legal caps on working hours (the 35-hour-week framework) versus cultural norms that erode them, including karoshi (death from overwork). Think carefully about how these tensions constrain what you can promise the audience.

  You are delivering the opening remarks at an interdisciplinary workshop titled The Right to Rest: From the Protestant Ethic to Karoshi. The room is split evenly: on one side are philosophers, sociologists, and labor historians; on the other are union organizers, HR directors, and journalists. The philosophical framework must do real structural work: frame the workshop's purpose not as choosing between process-based and outcome-based justifications for leisure rights, but as diagnosing why treating rest purely as a functional input to productivity—while ignoring its status as an unconditional entitlement—reproduces the very ethic that produces karoshi. You must navigate this without collapsing into pure Marxist critique or pure welfare economics. Write a polished, five-minute address that lands for the specialists without losing the non-academic half. Do not provide bibliographies, citations, or reading lists; do not invent statistics; and do not quote specific texts verbatim.
