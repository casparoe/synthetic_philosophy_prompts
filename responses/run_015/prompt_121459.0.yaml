  2.  **Deconstruct the Logic (Skolem's Paradox):**
      *   *Premise 1 (Cantor/ZFC):* ZFC proves there exist uncountable sets (e.g., the power set of naturals). Inside the theory, no bijection exists between $\mathbb{N}$ and $\mathbb{R}$.
      *   *Premise 2 (Löwenheim-Skolem):* If ZFC has a model, it has a countable model.
      *   *The Paradox:* In a countable model, the domain is countable (from the outside). Therefore, the "uncountable" sets inside the model are actually countable from the outside.
      *   *Resolution:* The bijection that witnesses the countability exists *outside* the model, not *inside*. The model "doesn't know" about the bijection.
      *   *Key Distinction:* Internal cardinality (what the model says) vs. External cardinality (what the metatheory says).

