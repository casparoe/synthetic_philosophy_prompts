answer: |-
  # Colloquium Preparation Sheet: The Careenium and Causal Exclusion

  **To:** The Speaker
  **From:** Strategic Advisory
  **Re:** Q&A Preparation for Philosophy of Mind Series
  **Date:** October 2023

  Below are eight objections ordered by the potential damage they pose to your thesis. The phrasing mimics the specific technical commitments of the colleagues identified in your brief. Following each objection is a suggested two-minute reply, followed by a candid assessment of the reply's vulnerabilities.

  ### 1. The Exclusionist's Dilemma (The Kim Lineage)
  **The Objection:**
  'You claim the simmballs genuinely push the careenium around, yet you insist physics is respected. This looks like a straightforward violation of causal closure. If the physical state of the vat at *t1* suffices for the physical state at *t2*, and the simmball configuration supervenes on the physical state at *t1*, then the simmballs are causally redundant. You face a dilemma: either your symbol-level generalisations are made true by nothing over and above the physical state, in which case they add no causal powers (epiphenomenalism), or they are made true by something over and above the physical state, in which case you have quietly abandoned physicalism. Which horn do you take?'

  **The Reply:**
  'I reject the presupposition that causation is a conserved quantity that can be "used up" by the physical level. This dilemma assumes a "production" view of causation, where causes transfer energy or force. I am working with an interventionist account. On this view, a variable is a cause if manipulating it while holding background conditions fixed changes the effect. The neural variables fail this test across the relevant range of background variations (lesions, turnover); the symbol variables pass it. Therefore, the physical state does not "suffice" for the effect in the sense that matters for causal attribution, because the physical description cannot support the necessary counterfactuals. I remain a physicalist because the simmballs are nothing over and above the physical organisation, but I deny that physical causal closure entails that only microphysical variables are causes.'

  **Frank Note:**
  *Soft Spot:* This relies entirely on the audience accepting your interventionist definition of causation over the production/transfer view. The Kim-lineage colleagues likely view interventionism as merely epistemic (about how we *find* causes) rather than ontological (about what causes *are*). If they insist causation *is* energy transfer, you lose.
  *Concession:* Be prepared to concede that if "cause" means "energy transfer," simmballs are not causes. You must argue that "cause" in the special sciences does not mean that.

  ### 2. The Simulation Challenge (The WBE Graduate Student)
  **The Objection:**
  'You claim a simulation could reproduce the ion fluxes exactly yet host no simmballs. But if the simulation is physically isomorphic to the careenium regarding the relevant dynamics, and you've just argued that causal power rests on counterfactual stability, then the simulation must have the same counterfactual stability. If the ions move the same way, the patterns persist the same way. To say the simulation lacks simmballs implies that "being a simmball" is not a functional or physical property, but requires some extra ingredient—perhaps original intentionality. Isn't this a dualist intuition smuggled into a physicalist framework?'

  **The Reply:**
  'It is not dualism to distinguish between a system that *has* a structure and a system that *uses* that structure for control. A simulation of a storm does not get wet; a simulation of a calculation does not necessarily compute, unless the system is set up to be sensitive to the results of that calculation. My claim is that simmballs require a specific architectural role: they must be triggerable, compositional, and capable of guiding the system's interaction with the environment. A look-up table simulation of ion fluxes might match the output without possessing the internal architecture of interlocking patterns that defines the simmball. The "missing" ingredient is not a soul, but a specific functional organisation that a brute-force simulation might bypass.'

  **Frank Note:**
  *Soft Spot:* This is your most exposed flank, as you admitted. If the simulation is dynamic and interactive (not a look-up table), the distinction collapses. You have no argument here beyond an appeal to intuition about "what the patterns must be able to do."
  *Concession:* **You must concede here.** Acknowledge that if the simulation is functionally isomorphic in terms of control architecture, it *does* have simmballs. Restrict your claim to "brute force" simulations that do not replicate the functional organisation, only the output.

  ### 3. Constitutive vs. Causal Relevance (The Mechanists)
  **The Objection:**
  'You seem to be trading on an equivocation between causal relevance and constitutive relevance. When you say the symbol-level generalisations survive neural turnover, you are describing the stability of a mechanism's organisation. But the components of a mechanism are constitutively relevant to the mechanism's output, not causally relevant in the diachronic sense. You haven't shown that the simmball causes the movement; you've only shown that the simmball is part of the structure that constitutes the movement-generating apparatus. Craver's mutual manipulability criterion distinguishes these; you appear to have collapsed them.'

  **The Reply:**
  'I am not collapsing them; I am prioritising the level at which invariant generalisations hold. Constitutive relevance is indeed synchronic. However, the behaviour in question is a temporally extended process. The simmball collision precedes the movement and supports counterfactuals about *when* and *how* the movement occurs under perturbation. If I intervene on the simmball pattern (e.g., by changing the belief), the movement changes, even if the underlying neural substrate is replaced. This satisfies the criteria for causal relevance. To call it merely constitutive is to privilege the timescale of the neuron over the timescale of the cognition, which is arbitrary given the multiple realisability of the latter.'

  **Frank Note:**
  *Soft Spot:* Mechanists are rigorous about temporal precedence. If your "simmball collision" is simultaneous with the neural firing pattern that constitutes it, they will press the synchrony point hard.
  *Overlap:* This overlaps with Objection 1 (Exclusion). Both rely on the idea that the "real" work is done by the lower level.

  ### 4. The Dynamical Systems Rug-Pull (The Cognitive Scientist)
  **The Objection:**
  'I warmly endorse your attack on the neural level's explanatory weakness. However, you argue that invariance under perturbation points to *symbols*. But invariance is a property of attractor dynamics in a state space. I can model the careenium as a trajectory through a phase space without invoking any content-bearing symbols. The stability you admire is a property of the vector field, not the simmballs. By insisting on symbols, you are re-introducing a homuncular architecture that dynamical systems theory has shown to be unnecessary. Why posit simmballs when attractors do the work without the baggage of representation?'

  **The Reply:**
  'Attractors describe the *shape* of the trajectory, but they do not explain the *selection* of the trajectory in response to environmental inputs that are absent. Simmballs are posited specifically to handle "aboutness"—the system's sensitivity to distal features not currently impinging on the sensors. A pure dynamical account struggles with decoupled representation. My claim is that the specific *kind* of stability we see—compositional, productive, sensitive to semantic properties—requires a symbol-system architecture. Attractors are the vehicle; simmballs are the drivers. You need the drivers to explain why the car goes to the shop rather than the park.'

  **Frank Note:**
  *Soft Spot:* The "drivers" metaphor is dangerously homuncular. The dynamical scientist will argue the vector field *is* the driver.
  *Concession:* Concede that symbols must be realised dynamically. You are not opposing dynamics, but claiming that certain dynamic regimes constitute symbolic processing.

  ### 5. Causal Pluralism vs. Univocity (The Analytic Metaphysicians)
  **The Objection:**
  'You speak of the neural level being "differently causal" and "less so." This suggests you are a causal pluralist. But if "cause" means one thing at the neural level (energy transfer) and another at the symbol level (counterfactual support), you are guilty of equivocation. If "cause" means the same thing, then one level must be the fundamental one. Is your view a pluralism that evacuates the question of real causation, or are you claiming univocity? If the latter, how do you square the two definitions?'

  **The Reply:**
  'I am arguing for univocity based on counterfactual dependence. "Cause" means the same thing at both levels: a variable that supports interventionist counterfactuals. It turns out that neural variables support fewer of these counterfactuals than symbol variables in the context of behaviour. Thus, they are "less causal" in the sense of being less robust sources of counterfactual dependence, not in the sense of having a different definition of causation. This is not pluralism; it is a graded assessment of causal strength based on invariance.'

  **Frank Note:**
  *Soft Spot:* Many metaphysicians hold that causation is a binary relation, not a graded one.
  *Overlap:* This supports the reply to Objection 1. If you hold the line on univocal interventionism, you blunt both the Exclusionist and Metaphysician objections.

  ### 6. The "So What?" Objection (Deflationary Worry)
  **The Objection:**
  'Let's grant your interventionist account. You have shown that symbol-level descriptions are better for explanation and prediction. But you insist this is an ontological claim, not merely explanatory. What work does this ontological claim do? If the physics is fixed, and the counterfactuals are fixed, what hangs on whether we call the simmball a "cause" rather than a "useful explanatory construct"? Why risk the metaphysical baggage?'

  **The Reply:**
  'Because the "useful construct" view implies that if we knew the microphysics perfectly, we could discard the symbols. I am claiming that even with perfect microphysical knowledge, the symbol-level facts would remain the primary locus of causal control. This matters for ethics, AI, and psychiatry. If simmballs are merely fictions, then manipulating beliefs is a shorthand for manipulating neurons. If simmballs are genuine causes, then manipulating beliefs is a distinct causal pathway that cannot be reduced without loss of control. The ontology dictates the intervention strategy.'

  **Frank Note:**
  *Soft Spot:* This is a pragmatic argument, not a metaphysical one.
  *Concession:* Acknowledge that the distinction is subtle, but insist it has real-world consequences for how we intervene on systems (e.g., therapy vs. drugs).

  ### 7. Downward Causation Worry
  **The Objection:**
  'If the simmball collision causes the movement, it must cause the neural firing that produces the movement. But the simmball is constituted by the neural firing. You are claiming the whole causes the parts to behave as they do. This is downward causation. How does the pattern push the ions without violating the laws of ion dynamics? You say conservation laws are not strained, but how is this possible if the pattern dictates the ion flow?'

  **The Reply:**
  'The pattern does not dictate the ion flow *against* the laws of ion dynamics; it constrains the boundary conditions under which those laws operate. The simmball is the organisation of the ions. When I say the simmball causes the movement, I mean the ions, organised *as* a simmball, cause the movement. There is no extra force. The "downward" influence is simply the constraint that the higher-level structure imposes on the lower-level degrees of freedom. It is not magic; it is constraint.'

  **Frank Note:**
  *Soft Spot:* "Constraint" can sound like a weasel word for "mystery."
  *Concession:* **Concede immediately** that you are not positing a new force. This is crucial for credibility with the physicists in the room.

  ### 8. The Generalisation/Truth-Maker Worry
  **The Objection:**
  'You say symbol-level generalisations survive neural turnover. But what makes these generalisations true? If the neural realiser changes, what is the common factor that grounds the truth of the generalisation? If you say it is the "function," you risk functionalism's problems. If you say it is nothing, you are an instrumentalist. You need a truth-maker for these higher-level causal claims that isn't just "they are useful."'

  **The Reply:**
  'The truth-maker is the dispositional property of the system to respond to perturbations in a specific way. This property is real and physical, but it is a property of the *system*, not the *component*. It is grounded in the history of selection and the architectural constraints of the careenium. It is not a ghostly addition; it is a physical disposition of the whole, analogous to the fragility of a vase. The vase's fragility is real, even if it is nothing over and above the molecular bonds.'

  **Frank Note:**
  *Soft Spot:* Dispositions are controversial truth-makers for some metaphysicians.
  *Overlap:* Connects to Objection 1 (Exclusion).

  ***

  ### Strategic Summary

  **Concessions for Credibility (First 5 Minutes):**
  1.  **Physics is Closed:** Explicitly state that you do not deny the causal closure of the physical *regarding energy transfer*. You are arguing that "causation" in the context of mind and action is not exhausted by energy transfer.
  2.  **No Magic:** Concede that simmballs do not exert a "force" distinct from physical forces. Your claim is about *which* physical configurations count as causal variables.
  3.  **Simulation Nuance:** Concede to the WBE student that a functionally isomorphic simulation *would* have simmballs. Do not defend the idea that a perfect functional duplicate lacks them; defend the idea that a brute-force physics duplicate might.

  **The Single Reply That Must Land:**
  The **Interventionist Definition (Objection 1 & 5)**. You must convince the room that causation *is* counterfactual dependence supported by invariant generalisations. If they accept this, the Exclusionist Dilemma dissolves (because the physical level does not support the relevant counterfactuals) and the Pluralism worry vanishes (because the definition is univocal). If they reject this definition, your paper fails.

  **The Question You Hope Nobody Asks:**
  *'If the simulation behaves exactly like the careenium in all interactive contexts, by what test could we possibly determine it lacks simmballs? If there is no behavioural or physical test, isn't the difference between "having simmballs" and "lacking simmballs" empirically empty?'*
  (You have no answer for this other than an intuition about internal architecture, which is weak against a verificationist or strict functionalist.)

  **Overlapping Objections:**
  Objections 1 (Exclusion), 3 (Mechanism), and 7 (Downward Causation) are all variations of the "Realisation" worry. You can group your defence: *Realisation does not imply elimination; organisation is causal.*
  Objections 5 (Pluralism) and 8 (Truth-Maker) are metaphysical worries about the status of your claims. Group these under your defence of dispositions and univocal interventionism.

  **Final Advice:**
  The room is hostile to "mental causation" as traditionally framed but sympathetic to "explanatory autonomy." Your strategy is to insist that explanatory autonomy *just is* a form of causal autonomy under an interventionist lens. Do not let them separate explanation from causation; if they succeed in framing your view as "merely explanatory," you lose the ontological claim you are fighting for.
