prompt: |-
  hi, i run this peer-support drop-in at my sixth form twice a week and my teacher wants me to justify which wellbeing activities we advertise, not just go on vibes. i’m trying to use tranquilism — only the absence of craving and suffering counts for wellbeing, nothing else like pleasure or achievement. can you turn that into a reusable five-minute procedure? steps in order, what counts as a pass, where it auto-says no, and the exact spot where i have to hand it to my teacher because i cant seperate fact from values on my own. run it on a guided gratitude journalling session and a “no-phone weekend” detox; make one come out against what i’d want. build in a check for “shadow-craving” — calm-looking stuff that secretly feeds comparison — and say what the procedure just cant do. also tell me how confident you are overall and flag the one bit you’re least sure about. cheers.
