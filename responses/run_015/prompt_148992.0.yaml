      *   *Implication:* Activities that generate *new* cravings (even for "good" things like mindfulness, productivity, or social status) are net negative or neutral at best. Activities that merely reduce existing suffering without creating new dependencies are positive.
      *   *Nuance:* Pleasure is not a goal. Achievement is not a goal. "Feeling good" is only good insofar as it means "not feeling bad."

  3.  **Drafting the Procedure (The "Tranquilism Filter"):**

      *   *Goal:* 5 minutes max. Needs to be punchy.
      *   *Step 1: Suffering Baseline.* What pain does this address?
      *   *Step 2: Craving Generation.* Does this create a *need* to continue?
