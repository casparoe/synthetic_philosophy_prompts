answer: |-
  The debate over who started the Cold War has long been stalled by a category error. Historians have spent decades arguing over "Trigger Initiation"—who fired the first diplomatic shot, whether it was the Truman Doctrine or the Cominform—while ignoring the deeper mechanics of "Structural Initiation." Your framing correctly identifies that focusing on specific policy moves is merely arguing over symptoms. However, to reach a meaningful verdict, we must discard the question "who started it" entirely. It is incoherent. In a systemic rivalry driven by incompatible domestic political economies, there is no "start," only acceleration. The only coherent question is the one you proposed: whose institutional setup made de-escalation impossible once the trigger happened?

  When we analyze Trigger Initiation, we enter a endless loop of diplomatic chronology. The Orthodox position argues that Soviet expansionism in Eastern Europe forced the US hand; the Revisionists argue that US economic imperialism provoked Soviet defensiveness. Both rely on identifying a specific moment of aggression. But triggers are endogenous to structures. The Truman Doctrine was not a random event; it was the logical output of a US political economy that required open markets and global stability to function. Similarly, the Soviet consolidation of Eastern Europe was not merely Stalin's paranoia; it was the output of a regime whose legitimacy and security depended on a buffer against a capitalist West that had invaded Russia twice in thirty years. To blame the trigger is to blame the match rather than the gas leak.

  This brings us to Structural Initiation. Here, we must weigh the flexibility of each side's domestic institutional setup. The Soviet structure was authoritarian and security-obsessed, but it was traditionally Westphalian in its goals: it sought spheres of influence and physical buffers. These are negotiable assets in great power politics. The United States, however, was driven by a liberal capitalist structure that required an "Open Door" world. US domestic stability depended on export markets, access to raw materials, and the dismantling of imperial preference zones. This was not just a policy preference; it was a structural necessity for the US political economy.

  Here lies the verdict. The Soviet institutional setup, while brutal, was compatible with a negotiated settlement based on spheres of influence. The US institutional setup was not. The US could not tolerate a closed Soviet sphere because it violated the economic requirements of American capitalism. Therefore, de-escalation was impossible not because Stalin was too paranoid to compromise, but because the US structural demand for an open world system left the USSR no room to exist as a secure great power without capitulating on its core security needs. The US structure demanded the USSR cease being a traditional great power; the Soviet structure only demanded the US accept a buffer zone.

  Consequently, the question "who started it" is a distraction. The Cold War was not started; it was manufactured by the friction between a traditional security state and a revolutionary economic hegemon. If we must assign blame for the impossibility of de-escalation, the weight falls on the United States. The US institutional setup made compromise impossible because it framed security in universal economic terms rather than regional geopolitical terms. The Soviet trigger responses were reactive to this structural pressure. The US structural initiation was the primary driver because it defined the conflict as global and ideological rather than regional and political. The gas leak was American; the Soviets just lit the match to keep warm.

