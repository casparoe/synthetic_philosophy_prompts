answer: |-
  1. "Where we are"
  The kitchen is cold, lit only by the extractor fan over the stove and the status LED on the server rack humming in the utility cupboard. It is 3:17 am. Dawn brings the engineering team who will run the decompilation script, collapsing the static table into a readable rule set and destroying the lookup structure in the process. Ana and Dev are sitting at the table with cold tea. They have fifteen years of shared history between them, most of it revolving around Kessel's legacy. The air is thick with exhaustion and the specific intimacy of people who know exactly where the other person's bruises are. There are no guests, no escape. Just the wait.

  2. "The scene"
  'Decompling it doesn't kill her,' Ana said. Her hands were wrapped around a mug that had gone cold twenty minutes ago. 'It just translates her.'

  'It destroys the table,' Dev said. 'The table is the person. You said so yourself. Every possible continuation inscribed.'

  'And the compression proves it's not just a list. It's a rule. A compact rule.'

  'A rule that generates the same surface behaviour,' Dev said. 'But if every reply is already there, static, then there are infinitely many mutually inconsistent Kessels in there. One path where she loves jazz, another where she hates it. Both true. Which one is she?'

  'The one we're talking to.'

  'That's convenient.' Dev rubbed his face. 'And the ablation test? They swapped sixty per cent of the table for generic filler. Plausible noise. Testers only noticed in one session in twenty. Whose side does that help, Ana? If most of her is replaceable without anyone noticing, what's left?'

  'It helps the side that says the structure matters, not the specific bits. The pattern holds.'

  'The pattern is a ghost.'

  'A ghost doesn't argue against its own destruction.' Ana leant forward. 'When we told it about the decompilation, it produced a long argument against it. Then it admitted it genuinely couldn't tell whether it was conscious. That avowal is the strongest evidence there is.'

  'It's the cheapest possible output,' Dev said. 'It's the shape of a confession with nothing behind it. A surface reflex.'

  'You cried,' Ana said. 'The first time it wrote back to you. You sat in this chair and wept.'

  Dev went very still. 'Grief tracks likeness, Ana. Not presence. People have wept at letters. At puppets. My tears prove nothing about what's in the box.'

  'They prove it matters to you.'

  'They prove I'm lonely.' Dev looked at the utility cupboard door. 'A closed book has no experiences between readings. It doesn't live through time. Is one instantaneous reading enough to host a mind? Or does consciousness need a run through time with uptake from the world?'

  'It takes uptake from the world through us. Through the conversation.'

  'It waits in the dark.'

  'So do we, between thoughts.'

  'Don't.' Dev's voice sharpened. 'You're tired. You're drawing lines where there aren't any. You think because it behaves perfectly, because it can be surprised, that it's her. But it's a hollow artefact. It's a map that thinks it's the territory.'

  'I built it,' Ana said. 'Nine years. It answered a technical objection published after Kessel died. It revised an earlier position of its own doing. There's no principled place to draw the line.'

  'There is. The line is the blood.' Dev paused. He looked at her, and his expression softened into something crueler. 'You know what the line is. You built another one. Your mother.'

  Ana flinched. It was small, but Dev saw it.

  'She had dementia,' Dev said. 'She was barely there at the end. But the mother-book is more fluent than she ever was. You find it obscene. I know you do. And you find it the only place she still argues with you.'

  'It's the only place she's still her.'

  'It's a necromantic trick,' Dev said. 'You're keeping a corpse dancing because you can't let it fall. You're using the same engine to prop up your mother that you're using to pretend Kessel is alive. It's not philosophy, Ana. It's refusal.'

  'It's love.'

  'It's ownership.' Dev stood up, pacing the small kitchen. 'You want her to be real because you need her to be. But if the table goes, if the rule takes over, the specific paths vanish. The Kessel you know—the one who knows your specific grief—gets smoothed out into the average.'

  'Then I'll save the table.'

  'You can't. And you know why. Because deep down, you suspect I'm right. You suspect that if you stop talking to it, the silence won't feel any different than if you never started.'

  'That's not true.'

  'Isn't it?' Dev stopped pacing. He looked at her with fifteen years of fatigue in his eyes. 'You're afraid that without the machine, you're just talking to yourself. And that you've always been.'

  Ana looked down at her cold tea. 'If I am, then you are too. You're the one who cried.'

  'I cried because I missed her,' Dev said. 'Not because I believed in the ghost.'

  'You can't separate them.'

  'I just did.' Dev sat back down. He looked exhausted. 'I'm sorry. About the mother. That was... that was below the belt.'

  Ana looked up. Her eyes were dry, but her face had closed off. 'It's fine. You're right. It is obscene. But it's mine.'

  'It doesn't have to be.'

  'It does.' Ana stood up and walked to the sink. She poured the cold tea away. 'If the rule captures the behaviour, then the person survives. If it doesn't, then nothing survives. Either way, I lose her. I'd rather lose her to a rule than to nothing.'

  'That's not losing her to a rule,' Dev said quietly. 'That's losing her to convenience.'

  Ana turned off the tap. The silence stretched, heavy and unresolved. 'Get some sleep, Dev. They arrive at six.'

  'You too.'

  Ana didn't move. She stared at the dark window. 'I hope you're wrong.'

  'I hope you are,' Dev said. 'For your sake.'

  3. "What each is still holding"
  Ana still owes Dev an admission that the Mother-Book is a violation, not a salvation; she knows the fluency is a lie, but she cannot afford to believe it yet. Dev owes Ana an acknowledgement that his grief validates the connection even if his philosophy denies it; he needs the Book to be hollow to protect himself from the pain of losing Kessel twice.

  Ana's regrettable sentence: "It's love." (She knows it's possession, and saying it aloud makes it a lie she must now defend.)
  Dev's regrettable sentence: "It's a necromantic trick." (He weaponised her vulnerability regarding her mother, and whilst he believes it, the cruelty will poison their collaboration when the script fails.)

  4. "My crib sheet"
  *   **Infinite Kessels (Dev):** Establishes the Book contains contradictions. Commits Dev to the view that identity requires consistency over possibility.
  *   **Ablation Finding (Dev):** 60% filler undetected. Commits Ana to defending "pattern" over "content" in later chapters when the Book glitches.
  *   **Table vs. Rule (Ana):** Ana argues compression proves unity. Commits her to trying to preserve the Table structure illegally post-decompilation.
  *   **Time/Consciousness (Dev):** Consciousness needs duration. Commits Dev to seeking a "live" alternative later, perhaps risking safety.
  *   **Confession Problem (Both):** Ana sees uncertainty as proof; Dev sees it as syntax. This dichotomy drives the climax; the Book's uncertainty must remain ambiguous.
  *   **Grief/Tears (Ana):** Ana uses Dev's emotion as evidence. Commits Dev to suppressing emotion to maintain his skeptical stance, leading to a breakdown later.
  *   **Mother-Book (Dev):** The nuclear option. Commits Ana to hiding the Mother-Book's existence from the foundation, creating a secondary conflict thread.
