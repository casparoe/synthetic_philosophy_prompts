      *Drafting Section 3:*
      Yet, this defense collapses when framing hides structural complicity. The risk is not just omitting trivialities, but erasing the systems that enabled the subject's greatness. When Plutarch pairs a democratic reformer with a monarch, he risks creating a false moral equivalence. He treats their political contexts as neutral backdrops for individual virtue, ignoring that one system may rely on oppression while the other relies on consent. By focusing on the individual's character, the biography can inadvertently validate the oppressive structures they inhabited. If a "great man" is celebrated for his generosity, but that wealth was extracted through colonial violence, the moral lesson is corrupted. The smoothing here is not pedagogical; it is ideological.

      Modern biography often repeats this sin under the guise of objectivity. By focusing on individual agency, biographers often omit the economic or colonial violence that funded the subject's achievements. A biography of a founding father that minimizes slavery to focus on political philosophy teaches a dangerous morality: that high-minded ideals can coexist with brutal exploitation without contradiction. This is not smoothing for clarity; it is smoothing for comfort. It allows the reader to admire the figure without confronting the cost of their success. When structural sin is erased, the biography becomes hagiography not by adding miracles, but by subtracting context. It presents the subject as a self-made moral agent, ignoring the collective suffering that supported them. This makes the moral instruction harmful. It teaches us to value individual brilliance over systemic justice. If we learn to live well by imitating lives built on injustice, we replicate that injustice. The framing becomes a lie not about the person's feelings, but about their place in the world. (296 words) - *Good.*

      *Drafting Section 4:*
      So, is modern biography essentially hagiography with archives? The verdict must be no, but with a crucial caveat. Moral learning does require narrative smoothing; life is too noisy to be read directly. However, hagiography smooths to create an icon, while honest biography smooths to reveal a human. The distinction lies in how contradictions are handled. Hagiography resolves contradictions in favor of the subject; biography preserves them to show the cost of virtue. Modern biography is not inherently hagiographic unless it refuses to acknowledge the structural violence identified in the objection. We can learn from lives without idolizing them.

      The value of biography is not in providing a perfect template, but in witnessing the struggle. If a biographer frames a life to show how a person navigated moral failure, rather than pretending failure didn't happen, the smoothing is ethical. It highlights the struggle without erasing the stakes. Therefore, moral learning does not depend on falsification. It depends on honest framing that admits contingency. We can read Plutarch not to copy his heroes, but to see how they wrestled with ambition. We can read modern lives not to ignore their complicity, but to understand how good people accommodate evil. The lesson is not "be this person," but "watch how this person chose." Biography teaches us to live well only when it stops trying to make saints and starts showing us the messy work of being human. The archive allows us to check the smoothing; hagiography forbids the check. (249 words) - *Good.*

