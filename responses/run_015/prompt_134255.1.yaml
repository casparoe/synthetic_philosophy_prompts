      However, dismissing this framing as deception misunderstands the nature of moral pedagogy. A map is not a territory; it omits trees to show roads. Similarly, biography must impose narrative order on chaotic existence to make character visible. Smoothing contradictions is not necessarily lying; it is often the act of distinguishing signal from noise. In Plutarch's case, the comparative method allows the reader to see virtue not as a product of specific circumstances, but as a transferable quality. By placing a Greek democrat beside a Roman consul, Plutarch suggests that moral choices exist independently of political structures. This framing isolates the agent's responsibility from the chaos of history.

