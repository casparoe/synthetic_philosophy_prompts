  1. The tension

  The promise of biography is ethical navigation: we read lives to learn how to live. Yet, life itself is a chaotic accumulation of trivialities, contradictions, and opaque motives. To extract a moral lesson, the biographer must curate. This necessity creates a fundamental tension between historical truth and pedagogical utility. Plutarch represents one pole of this practice. His *Parallel Lives* pair Greek and Roman statesmen to isolate virtue and vice through comparison. He selects events not merely to record history, but to illuminate character, acknowledging that some details must be shed to reveal the moral shape beneath. His method is a moral experiment, testing character across different political contexts.

  At the other pole stands medieval hagiography. Here, selection becomes erasure. The saint's life is shaped explicitly for edification, smoothing over flaws and inserting miracles to create a perfect icon. The narrative arc bends inevitably toward sanctity, removing the friction of genuine moral struggle. The worry arises from the spectrum between them. If Plutarch selects for virtue, and the hagiographer selects for sanctity, is the difference merely one of degree? Every biography aiming to teach morality must frame its subject, highlighting certain actions while obscuring others to make them intelligible. Consequently, any moral biography risks becoming a secret hagiography, presenting a messy human existence as a coherent, imitable pattern. We are left asking whether ethical instruction inevitably requires a falsification of the lived experience it claims to honor, turning a person into a tool for our own improvement.

  2. The defense of framing

  However, dismissing this framing as deception misunderstands the nature of moral pedagogy. A map is not a territory; it omits trees to show roads. Similarly, biography must impose narrative order on chaotic existence to make character visible. Smoothing contradictions is not necessarily lying; it is often the act of distinguishing signal from noise. In Plutarch's case, the comparative method allows the reader to see virtue not as a product of specific circumstances, but as a transferable quality. By placing a Greek democrat beside a Roman consul, Plutarch suggests that moral choices exist independently of political structures. This framing isolates the agent's responsibility from the chaos of history, allowing the reader to see the constant variable of character amidst changing contexts.

  Furthermore, human memory itself is selective. We understand ourselves through curated narratives. A biography that replicates the sheer randomness of life fails to teach because it offers no causal link between character and outcome. The smoothing allows the reader to perceive the consequences of virtue or vice without being distracted by unrelated misfortune. If a biographer included every trivial contradiction, the subject would become unintelligible, and the moral lesson would vanish. Therefore, framing is a legitimate pedagogical feature. It constructs a model of agency. The biographer is not claiming the subject was perfect, but that their life possesses a coherent moral architecture worth studying.

  The danger lies not in selection, but in the claim to exhaustiveness. As long as the reader understands the biography as a constructed mirror rather than a transparent window, the smoothing serves to clarify rather than deceive. It transforms a person into a principle without denying their humanity, provided the focus remains on the choices made within the constraints of their time. This controlled simulation is essential for ethical comparison, making the lesson accessible.

  3. The serious objection

  Yet, this defense collapses when framing hides structural complicity. The risk is not just omitting trivialities, but erasing the systems that enabled the subject's greatness. When Plutarch pairs a democratic reformer with a monarch, he risks creating a false moral equivalence. He treats their political contexts as neutral backdrops for individual virtue, ignoring that one system may rely on oppression while the other relies on consent. The comparative method itself may legitimize tyranny by treating it as merely another variable. By focusing on the individual's character, the biography can inadvertently validate the oppressive structures they inhabited. If a "great man" is celebrated for his generosity, but that wealth was extracted through colonial violence, the moral lesson is corrupted. The smoothing here is not pedagogical; it is ideological.

  Modern biography often repeats this sin under the guise of objectivity. By focusing on individual agency, biographers omit the economic or colonial violence that funded the subject's achievements. A biography of a founding father that minimizes slavery to focus on political philosophy teaches a dangerous morality: that high-minded ideals can coexist with brutal exploitation without contradiction. This is not smoothing for clarity; it is smoothing for comfort. It allows the reader to admire the figure without confronting the cost of their success. When structural sin is erased, the biography becomes hagiography not by adding miracles, but by subtracting context. It presents the subject as a self-made moral agent, ignoring the collective suffering that supported them. This makes the moral instruction harmful. It teaches us to value individual brilliance over systemic justice. If we learn to live well by imitating lives built on injustice, we replicate that injustice. We must ask who benefits from the story being told. The framing becomes a lie not about the person's feelings, but about their place in the world.

  4. The verdict

  Verdict must be no, but with a crucial caveat. Moral learning does require narrative smoothing; life is too noisy to be read directly. However, hagiography smooths to create an icon, while honest biography smooths to reveal a human. The distinction lies in how contradictions are handled. Hagiography resolves contradictions in favor of the subject; biography preserves them to show the cost of virtue. Modern biography is not inherently hagiographic unless it refuses to acknowledge the structural violence identified in the objection. We can learn from lives without idolizing them.

  The value of biography is not in providing a perfect template, but in witnessing the struggle. If a biographer frames a life to show how a person navigated moral failure, rather than pretending failure didn't happen, the smoothing is ethical. It highlights the struggle without erasing the stakes. Therefore, moral learning does not depend on falsification. It depends on honest framing that admits contingency. We can read Plutarch not to copy his heroes, but to see how they wrestled with ambition. We can read modern lives not to ignore their complicity, but to understand how good people accommodate evil. The lesson is not "be this person," but "watch how this person chose." Biography teaches us to live well only when it stops trying to make saints and starts showing us the messy work of being human. We must remain critical readers. The archive allows us to check the smoothing; hagiography forbids the check.
