prompt: |-
  Two colleagues of mine at a policy institute were asked to co-draft a memo on whether the government should expand its child-benefit scheme, and they spent an hour arguing past each other about population ethics instead. I sat in on the whole exchange and genuinely cannot tell who got the better of it. Here is how it went, as close to verbatim as I can manage.

  **(1) Nadia:** If the additional children would have good lives, a larger population is better, other things being equal. Ten billion people each at a high level of well-being is a better world than one billion at exactly that same level — there is more of what makes lives go well, and nobody is worse off. So the state has at least some pro tanto reason to make births more likely, assuming the resulting lives clear some adequacy threshold.

  **(2) Tomas:** You cannot spell that out as a benefit to the added people. Benefiting someone requires making them better off than they would otherwise have been, and there is no "otherwise" for someone who would never have existed. If you insist that never existing is bad for them, you owe pity to the merely possible and you are obliged to produce as many people as possible. The defensible half of your intuition is the asymmetry: we have a strong reason not to bring someone into existence at a miserable level, but no symmetrical reason to bring someone in at a happy one. That is a reason of the right kind, and your "more well-being" is not.

  **(3) Nadia:** Fine — I will drop the claim that the extra people are benefited. My claim is about impersonal value: not all value has to be value *for* someone. And your asymmetry has a cost you have not faced. If adding good lives is never a reason, then the painless, voluntary fading out of the human race would not be bad in itself, which is not a conclusion, it is a stipulation. Worse for the memo: a principle that only ever ranks outcomes containing the very same people is silent on the only question we were asked.

  **(4) Tomas:** I can regret that ending for the sake of the people who live through it and for what they lose — culture, knowledge, company — without thinking the headcount matters. Silence is not error. Your impersonal view, by contrast, has a verdict, and the verdict is intolerable: as Parfit argued, for any population of at least ten billion people all with a very high quality of life, there is some much larger population whose existence would be better, even though its members have lives barely worth living. You cannot defuse this by saying intuition fails at large numbers, because the comparison is one your own theory says is the decisive one.

  **(5) Nadia:** Two things. First, the repugnance may be an artifact of presentation — people hear "barely worth living" as "miserable," and once that is corrected some philosophers simply accept the result. Second, and more important: you have misdescribed what our instrument actually does. Demographers distinguish shifts in the *timing* of births from changes in *completed* family size, and for cash incentives a large share of the measured response is plausibly timing rather than extra children. But timing changes *which* children are born. So the live case is often not "more people" but "different people": same numbers, different individuals, all with lives worth living. On your framework that whole class of decisions is morally inert — the displaced possible child is nobody, and the actual child is not harmed. A view that cannot distinguish selecting better-off future people from selecting worse-off ones has stopped doing any work.

  **(6) Tomas:** Identity choice is tractable without impersonal value. In a "who, not how many" decision there will be *some* occupant of the relevant slot, and I can act as a trustee for whoever that turns out to be: rank the options by the expected well-being of the eventual occupant, weighting candidates by how likely each is to exist under each policy. That is a person-affecting principle with widened scope — grounded in the interests of a person who will exist, with no appeal to the badness of never existing and no impersonal addition. Nadia closed by asking whether, in the fixed-number case, maximizing expected welfare of slot-occupants isn't just total-welfare reasoning relabeled, and whether a trustee can deliberate at all with no determinate beneficiary in view at the time of choice. They left it there.

  Please referee this properly rather than telling me whom to agree with:

  - Go through moves (1) through (6) in order and rate each from *clearly mistaken* to *clearly right*, with a brief justification for each rating — distinguishing, where it matters, between a move's being valid, its premises being true, and its actually answering the objection it was meant to answer.
  - Identify any point at which one of them mischaracterizes the other's position or concedes more than they needed to.
  - Say what both parties are missing: which distinction, option, or argument would have moved the disagreement forward instead of around it, and what the strongest version of each side looks like once the weak moves are stripped away.
  - Finally, indicate where, if anywhere, the empirical claim in (5) about birth timing does real work in the argument, and whether the argument would stand without it.
reasoning: |-
  Here's a thinking process that leads to the referee report:

  1.  **Analyze the Request:**
      *   **Task:** Referee a debate between two colleagues (Nadia and Tomas) on population ethics regarding child-benefit schemes.
      *   **Input:** A transcript of 6 moves (3 each).
      *   **Output Requirements:**
          1.  Rate moves (1)-(6) from *clearly mistaken* to *clearly right* with justification (validity, premises, responsiveness).
          2.  Identify mischaracterizations or unnecessary concessions.
          3.  Identify missing distinctions/options/arguments that would move the debate forward (strongest versions).
          4.  Evaluate the empirical claim in (5) about birth timing.
      *   **Constraint:** Do *not* tell the user whom to agree with. Act as a neutral referee.

  2.  **Analyze the Debate Content (Move by Move):**

      *   **Move (1) Nadia:** Argues for Total Utilitarianism (roughly). More good lives = better world. State has reason to encourage births if lives are good.
          *   *Philosophical Context:* Classic Total View.
          *   *Strengths:* Intuitively plausible regarding aggregate value.
          *   *Weaknesses:* Vulnerable to the Non-Identity Problem and the Repugnant Conclusion.
          *   *Rating:* Philosophically coherent but controversial premises. Not "mistaken" per se, but assertive.

      *   **Move (2) Tomas:** Argues for Person-Affecting View (PAV) / Asymmetry. Can't benefit the non-existent. Asymmetry: reason not to create miserable lives, no reason to create happy ones.
          *   *Philosophical Context:* Classic PAV critique of Total View.
          *   *Strengths:* Avoids Repugnant Conclusion. Respects intuition about "benefit."
          *   *Weaknesses:* Vulnerable to the "Absurd Conclusion" (human extinction isn't bad if no one is harmed).
          *   *Rating:* Strong counter-argument, standard in the field.

      *   **Move (3) Nadia:** Shifts to Impersonal Value. Admits PAV point on benefit but insists on impersonal goodness. Attacks PAV on the "Extinction Conclusion" (human fading out not bad). Points out PAV is silent on different-number choices (which is the policy question).
          *   *Philosophical Context:* Defending Total/Impersonal View against PAV. The "Silence" objection is strong (Parfit's Non-Identity Problem).
          *   *Strengths:* Highlights the practical paralysis of strict PAV in policy.
          *   *Weaknesses:* Still carries the baggage of the Repugnant Conclusion.
          *   *Rating:* Strong defensive move. The "silence" point is technically accurate for strict PAV.

      *   **Move (4) Tomas:** Accepts extinction regret based on existing people (loss of culture, etc.), denies headcount matters. Throws the Repugnant Conclusion back at Nadia (Parfit).
          *   *Philosophical Context:* Defending PAV against Extinction objection. Deploying Repugnant Conclusion.
          *   *Strengths:* Repugnant Conclusion is the heavy artillery against Total View.
          *   *Weaknesses:* The "loss of culture" argument might smuggle in impersonal value or rely on existing people's desires, which might not fully capture the badness of extinction if the last people are happy to end it.
          *   *Rating:* Strong offensive move (Repugnant Conclusion).

      *   **Move (5) Nadia:** Two prongs. 1. Repugnance might be intuition error. 2. *Empirical Pivot:* Policy affects *timing/identity*, not just *numbers*. Non-Identity Problem works *for* her here. If policy changes *who* is born, PAV says it's inert, but we intuitively think selecting better-off children matters.
          *   *Philosophical Context:* Using the Non-Identity Problem (NIP) to trap PAV.
          *   *Strengths:* This is the strongest move in the debate. It uses Parfit's NIP to show PAV fails even in same-number cases (due to identity dependence).
          *   *Weaknesses:* The empirical claim needs scrutiny (does cash benefit really change identity via timing?).
          *   *Rating:* Very strong theoretically. Empirical claim is the weak link.

      *   **Move (6) Tomas:** Proposes "Trustee for Slot-Occupant" model. Expected well-being of whoever ends up in the slot. Claims this is person-affecting without impersonal value.
          *   *Philosophical Context:* Attempted hybrid/repair of PAV (similar to "Person-Affecting Restriction" modifications).
          *   *Strengths:* Attempts to solve the NIP trap.
          *   *Weaknesses:* Nadia's closing question hits hard. Is this just Total Utilitarianism in disguise? If the "slot" is abstract, are we not summing expected value across possible people (impersonal)?
          *   *Rating:* Innovative but vulnerable to the "relabeled total welfare" charge.

  3.  **Drafting the Ratings (Section 1):**
      *   Need to be careful not to declare one side "winner." Focus on argumentative quality.
      *   (1) *Defensible but Controversial.* Premises are standard Total View.
      *   (2) *Clearly Right (on logic), Controversial (on conclusion).* The logic of "no subject for benefit" is sound within PAV.
      *   (3) *Strong.* The "silence" objection is a known weakness of strict PAV.
      *   (4) *Strong.* Repugnant Conclusion is the standard counter.
      *   (5) *Strategically Strong, Empirically Uncertain.* Theoretically devastating to PAV, relies on empirical premise.
      *   (6) *Unclear/Debatable.* Attempts a synthesis but risks circularity or collapsing into (1).

  4.  **Identifying Mischaracterizations/Concessions (Section 2):**
      *   *Nadia (1):* Concedes "pro tanto" which is good, but implies state *should* act, which might overreach.
      *   *Tomas (2):* "Obliged to produce as many people as possible" is a straw man of Total View (satisficing vs maximizing).
      *   *Nadia (3):* "Silence... is silent on the only question we were asked." Technically true for strict PAV, but policy usually affects existing people too.
      *   *Tomas (4):* "Regret... for the sake of people who live through it." This might concede impersonal value (culture/knowledge exists beyond individual welfare).
      *   *Nadia (5):* Empirical claim is the pivot. If wrong, the NIP trap doesn't snap.
      *   *Tomas (6):* "Trustee" model. Nadia's closing question suggests this might just be Total View relabeled. Tomas doesn't answer that.

  5.  **Identifying Missing Distinctions/Strongest Versions (Section 3):**
      *   *Missing:* The distinction between *Critical-Level Utilitarianism* (avoiding Repugnant Conclusion while keeping impersonal value).
      *   *Missing:* The distinction between *Wide* vs. *Narrow* Person-Affecting Views.
      *   *Strongest Nadia:* Critical-Level Total View + Non-Identity application.
      *   *Strongest Tomas:* Wide Person-Affecting View + Risk/Expectation handling.
      *   *Forward Movement:* Discussing *Critical-Level* views or *Prioritarianism* applied to populations.

  6.  **Evaluating the Empirical Claim (Section 4):**
      *   Claim: Cash incentives change timing -> changes identity -> Non-Identity Problem applies.
      *   Reality: Demography suggests cash benefits have small effects on *completed* fertility but can shift timing. Shifting timing by months *does* change identity (different sperm/egg).
      *   Does it do work? Yes, it saves Nadia from the Repugnant Conclusion *for this specific policy*. It shifts the debate from "More People" to "Different People."
      *   Without it? Nadia is stuck defending the Repugnant Conclusion. With it, she traps Tomas in the Non-Identity Problem.
      *   Verdict: It does heavy lifting. Without it, the debate stalls on Repugnance.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Formatting:* Follow the bullet points.
      *   *Philosophical Accuracy:* Ensure terms like "Non-Identity Problem," "Repugnant Conclusion," "Person-Affecting," and "Total View" are used correctly.
      *   *Specific Check on Move 6:* Tomas's "Trustee" argument is essentially the "Expected Person-Affecting View." Nadia's critique is that if you sum expectations across possible people, you are doing Total Utilitarianism. This is a deep technical point. I need to reflect that nuance.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Move 1:* Don't rate it "Right." Rate it "Philosophically Coherent."
      *   *Correction on Move 2:* Tomas's claim that Nadia is "obliged to produce as many people as possible" is a common caricature (maximizing vs. satisficing). I should note that.
      *   *Correction on Move 5:* Ensure I highlight that the Non-Identity Problem applies even if numbers stay the same, which is Nadia's key insight.
      *   *Correction on Move 6:* Tomas doesn't actually answer Nadia's closing question in the text provided ("They left it there"). I need to note that the move is incomplete.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Referee Report: Population Ethics Debate (Nadia vs. Tomas)

  #### 1. Move-by-Move Evaluation

  **(1) Nadia: The Total View**
  *   **Rating:** *Philosophically Coherent / Premises Controversial*
  *   **Justification:** Nadia articulates the Classic Total Utilitarian view. The logic is valid: if value is additive and impersonal, more good lives increase total value. However, the premise that "a larger population is better, other things being equal" is the exact point of contention in population ethics. She answers the prompt directly but exposes herself to the Repugnant Conclusion immediately. She does not mistake her position; she states it clearly.

  **(2) Tomas: The Person-Affecting Restriction & Asymmetry**
  *   **Rating:** *Valid Logic / Premises Debatable*
  *   **Justification:** Tomas correctly identifies the "Non-Identity Problem" hurdle for Nadia (you cannot benefit someone by causing them to exist). His formulation of the Asymmetry (reason to avoid misery, no reason to create happiness) is a standard and defensible position in the literature. However, his claim that Nadia is "obliged to produce as many people as possible" is a slight caricature; total views can be satisficing. He answers the objection well but sets up a straw man regarding the demandingness of Nadia's view.

  **(3) Nadia: Impersonal Value & The Extinction Objection**
  *   **Rating:** *Strong*
  *   **Justification:** Nadia makes a crucial pivot to *impersonal* value, which insulates her from the "no subject of harm" objection. Her attack on Tomas regarding human extinction is the standard "Absurd Conclusion" objection to strict Person-Affecting Views (PAV). If PAV implies voluntary extinction is neutral, that is a high cost. Her point that PAV is "silent" on different-number choices is technically accurate for strict PAV and highly relevant to a policy memo. This move successfully shifts the burden of proof back to Tomas.

  **(4) Tomas: The Repugnant Conclusion**
  *   **Rating:** *Strong*
  *   **Justification:** Tomas deploys Parfit's Repugnant Conclusion, the standard counter-attack against Total Views. His logic is sound: if Nadia accepts total value, she must accept that a massive population of barely worthwhile lives outweighs a smaller population of excellent lives. His defense against the extinction objection (regretting loss of culture for existing people) is plausible but risks smuggling in impersonal value (valuing "culture" independently of specific individuals' welfare). He answers Nadia's objection effectively but relies on a conclusion (Repugnance) that many find decisive against her.

  **(5) Nadia: The Empirical Pivot & Non-Identity Trap**
  *   **Rating:** *Strategically Brilliant / Empirically Contingent*
  *   **Justification:** This is the strongest theoretical move in the exchange. Nadia notes that if policy changes *who* is born (via timing), strict PAV cannot condemn policies that result in worse-off children (the Non-Identity Problem). This traps Tomas: if he sticks to PAV, he cannot advocate for policies that improve the quality of life of future children if those policies also determine their identity. The first prong (intuition artifact) is weak; the second prong (identity/timing) is theoretically devastating to strict PAV. However, the move relies entirely on the empirical claim that cash benefits change identity via timing rather than quantity.

  **(6) Tomas: The Trustee/Slot-Occupant Model**
  *   **Rating:** *Innovative / Unresolved*
  *   **Justification:** Tomas attempts to salvage PAV by widening the scope to "expected well-being of the slot-occupant." This is an attempt to adopt a "Wide Person-Affecting View." It is a valid philosophical maneuver to handle non-identity cases. However, he does not answer Nadia's closing challenge: if you sum expected welfare across possible occupants, are you not simply doing Total Utilitarianism under a different name? Because the transcript ends before he answers, the move remains incomplete. It is a creative repair, but its stability is unproven in the text.

  ***

  #### 2. Mischaracterizations and Unnecessary Concessions

  *   **Tomas (Move 2):** He mischaracterizes Nadia's position as requiring an obligation to "produce as many people as possible." Most total views allow for thresholds or diminishing marginal value. By attacking a maximizing version of her view, he makes her position easier to knock down but fails to engage with a more moderate Total View that might avoid the "obligation to populate" intuition pump.
  *   **Nadia (Move 3):** She concedes the "benefit" point too quickly ("Fine — I will drop the claim that the extra people are benefited"). While strategically wise to focus on impersonal value, she unnecessarily cedes the ground that person-affecting language is useless. She could have argued for a "Wide" Person-Affecting view herself rather than retreating to pure impersonalism.
  *   **Tomas (Move 4):** He potentially concedes impersonal value when he cites "culture, knowledge, company" as things lost in extinction. If these are valuable independently of the specific welfare of the last generation, he is importing the very impersonal value he rejects in Move 2.
  *   **Nadia (Move 5):** She assumes the "timing" argument saves her from the Repugnant Conclusion. It saves her from the *application* of the Repugnant Conclusion in this specific policy case, but it does not refute the theoretical possibility. If the government *could* expand the population size directly, her theory would still face the Repugnant Conclusion. She treats an empirical contingency as a theoretical shield.

  ***

  #### 3. Missing Distinctions and Strongest Versions

  **What is Missing:**
  The debate oscillates between **Total Utilitarianism** (Nadia) and **Narrow Person-Affecting Views** (Tomas). Both parties miss the middle ground that dominates contemporary population ethics: **Critical-Level Utilitarianism** or **Prioritarianism**.
  *   **Critical-Level View:** Existence is good only if well-being exceeds a certain positive threshold (not just "barely worth living"). This avoids the Repugnant Conclusion (bare lives don't count) while retaining impersonal value (avoiding the Extinction/ Silence problem).
  *   **Wide vs. Narrow PAV:** Tomas defends a Narrow PAV (acts must benefit specific existing or future individuals). A Wide PAV (acts must benefit someone who *would* exist in either outcome) could handle the Non-Identity Problem without collapsing into Total View.

  **Strongest Version of Nadia:**
  Adopt **Critical-Level Total Utilitarianism**.
  *   *Argument:* "We should expand benefits not because 'more is better' unconditionally, but because we aim to increase the number of lives *above a high threshold of flourishing*. This avoids the Repugnant Conclusion (bare lives add no value) while maintaining that human extinction is bad (loss of high-threshold value). It grounds the policy in aggregate flourishing without requiring pity for the merely possible."

  **Strongest Version of Tomas:**
  Adopt a **Risk-Weighted Wide Person-Affecting View**.
  *   *Argument:* "We should not count 'slots' impersonally. Instead, we act as trustees for the *actual* future generation. Since any policy creates *some* generation, we must choose the policy that maximizes the expected welfare of the generation that will actually exist. This respects the intuition that we owe duties to future people (not abstract value) without falling silent on identity-affecting choices. It rejects the Repugnant Conclusion because lowering quality of life violates the duty to the specific future occupants."

  ***

  #### 4. The Empirical Claim in Move (5)

  **Does the claim do real work?**
  **Yes, critical work.**
  Nadia's claim is that cash incentives primarily shift the *timing* of births rather than the *completed family size*. In demographic economics, this is a plausible (though debated) assertion.

  **Why it matters:**
  *   **If True:** The policy creates a **Non-Identity Case**. Different children are born at Time A (with subsidy) vs. Time B (without). Tomas's Narrow Person-Affecting View cannot say the children born at Time A are "harmed" by not being born at Time B (since they wouldn't exist). However, if the subsidy leads to children with *worse* life prospects (e.g., resource dilution), PAV cannot condemn it. Nadia uses this to show PAV is practically inert for policy. Conversely, if the subsidy leads to *better* prospects, PAV struggles to recommend it for the same reason. Nadia uses this to force Tomas into a corner where his theory cannot guide the specific memo they were asked to write.
  *   **If False:** If the subsidy genuinely increases the *number* of children (completed fertility), the debate reverts to the **Different-Number Choice**. Nadia is then forced to defend the Repugnant Conclusion directly. Tomas's objection becomes decisive.

  **Would the argument stand without it?**
  **No.** Without the empirical pivot in (5), Nadia is left defending the Repugnant Conclusion against Tomas's attack in (4). The "timing" argument is her only escape from the theoretical stalemate. It transforms the debate from "Is more better?" (where she is vulnerable) to "How do we handle identity-dependent choices?" (where Tomas is vulnerable). If the empirical premise is false, Nadia loses her strategic advantage and the debate returns to the stalemate at Move (4).
