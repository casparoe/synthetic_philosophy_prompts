      *   *Costly-Signalling:* Instead of "signaling commitment," talk about "modifying one's own niche to constrain future action." Ritual is "high-friction skilled coping." CREDs are "developmental scaffolding that demonstrates mastery of the niche."
      *   *Moralizing-Gods:* Instead of "supernatural monitoring," talk about "internalized social surveillance built into the niche." The "God" is a "persistent affordance for normative regulation."

  5.  **Addressing Stipulation 1 (Explananda):**
      *   By-product $\rightarrow$ Individual cognitive profile (sensitivity) + Population recurrency (spread of practices).
