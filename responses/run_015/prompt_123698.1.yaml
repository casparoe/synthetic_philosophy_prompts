      *   Moralizing-Gods $\rightarrow$ Population-level (societal scale) + Tradition (institutional moral norms).
      *   *Gap:* Enactive/DST struggles with *population-level statistical recurrency* without reducing it to individual coupling or historical lineage. It prefers the *history of the system* over *statistical prevalence*.

  6.  **Addressing Stipulation 2 (The Sincere Disavowal Case):**
      *   *Scenario:* A priest who performs rituals perfectly but says "I don't believe there's a god."
      *   *CSR (Representational):* Struggles. If belief is a mental representation, do they have it? If not, why do they act? Usually posits "implicit belief" or "fictional stance."
      *   *Enactive/DST:* Easy. Belief is not a state; it's a mode of engagement. The priest is *coupled* to the ritual niche. The "belief" is in the doing. Disavowal is just a verbal report that doesn't negate the skilled coping.
