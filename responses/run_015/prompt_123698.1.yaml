      *   *Costly-Signalling/CED (Sosis, Bulbulia, Henrich):* Rituals as signals of commitment to solve free-rider problems. CREDs (Credibility Enhancing Displays). Focus: Cooperation and group cohesion.
      *   *Moralizing-Gods/Group-Benefits (Norenzayan, Wilson):* Big Gods monitor behavior, enabling large-scale cooperation. Focus: Societal scale and moral order.

  3.  **Translate into Enactive/Ecological/DST Vocabulary:**
