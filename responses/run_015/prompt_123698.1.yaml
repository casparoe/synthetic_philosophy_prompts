      *   **Task:** Restate main naturalistic accounts of religion (By-product/Cultural-Epidemiological, Costly-Signalling/CED, Moralizing-Gods/Group-Benefits) using the user's vocabulary (enactive/ecological/DST).
      *   **Stipulation 1 (Explananda Sorting):** Categorize each account by what it explains: population-level recurrency, individual-level cognitive profile, or historically extended tradition/institutions. Identify where the user's vocabulary lacks resources.
