          *   By-product: The priest is still attuned to the agent-affordances (ritual feels like interaction), even if they categorize them as "pretend."
          *   Costly-Signalling: The cost is paid regardless of internal state. The niche is modified. The signal works because the *action* is costly, not the *thought*.
