  ### Empty Combinations

  1.  **Combination:** *Silent Effect (Node 1: Yes) + No Bilingual Plasticity (Node 2: No) + Concept Available (Node 4: Yes).*
      *   **Status:** **Incoherent.** If the concept is available (Node 4) and the speaker is bilingual, there is no logical mechanism to explain why the silent sorting (Node 1) remains fixed to Kænnavan norms (Node 2) unless you posit a cognitive constraint (Leaf C), which contradicts "Concept Available."
  2.  **Combination:** *Pre-Speech Attention (Node 5: Yes) + No Grammatical Obligation (Node 6: Yes).*
      *   **Status:** **Unattractive.** This posits that speakers attend to wind during planning even when the grammar does not force them to. While possible via cultural habit, it removes the *linguistic* variable from the equation, making it a cultural hypothesis rather than a linguistic one.
  3.  **Combination:** *Silent Evidential Tag (Node 7: Yes) + Evidential Decay (Node 8: No) + Bilingual Switch Changes Certainty (Node 9: Yes).*
      *   **Status:** **Unexplored.** This suggests memory tags are permanent in silence but fragile under language switching. No major theory defends this specific asymmetry; usually, if it survives silence, it survives switching, or if it succumbs to switching, it was never in silence.

  ---

  ### Indistinguishable Leaves

  **Leaf E (Thinking for Speaking) and Leaf G (Pragmatic Marking).**
  *   **Reason:** In a narrative, a character who attends to wind only when speaking (E) looks identical to a character who marks wind only for social reasons (G).
  *   **Further Question:** To separate them, you would need to measure the character's physiological arousal (e.g., pupil dilation) during speech planning. If arousal spikes when the grammatical obligation is high, it is Leaf E. If arousal spikes only when a high-status listener is present, it is Leaf G. Without this, they are narratively equivalent.

