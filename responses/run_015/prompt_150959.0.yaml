answer: |-
  ### The Taxonomy of Tongue and Thought

  This tree maps the logical space of linguistic relativity. It does not ask "Does language determine thought?" It asks what happens in specific, concrete situations involving your Kænnavan speakers. Follow the path dictated by the answer to each case.

  **Node 1 (Silent Perception):** A Kænnavan speaker sits in a silent room with no paper or pen. She is shown two colour swatches, one blue, one green. She is asked to sort them by similarity against a grey swatch. Does she group blue and green together significantly faster than a monolingual speaker of a language that distinguishes them?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2 (Bilingual Plasticity):** The speaker from Node 1 is fluent in Trade Tongue (which distinguishes blue/green). She spends a month speaking only Trade Tongue, then repeats the silent sorting task. Does her sorting pattern shift to match Trade Tongue norms?
  *   **Yes:** Go to Leaf A.
  *   **No:** Go to Leaf B.

  **Node 3 (Silent Orientation):** A Kænnavan speaker is placed in a windowless, dark hut. She is spun around. Without speaking or using tools, she is asked to point to the North reef. Is she accurate above chance?
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4 (Relative Imagination):** The speaker from Node 3 is asked to close her eyes and imagine a wave crashing to her *left*. She is forbidden from using wind-words in her head. Can she form the image?
  *   **Yes:** Go to Node 5.
  *   **No:** Go to Leaf C.

  **Node 5 (Pre-Speech Attention):** A speaker watches a boat move. She must describe it later. Eye-tracking shows she looks at the horizon (wind-source) *before* she begins to formulate her sentence. Does a Trade Tongue speaker (using relative terms) look at the boat *before* formulating?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Leaf D.

  **Node 6 (Grammar vs. Lexicon):** You remove the grammatical obligation to mark wind, but keep the wind-words in the lexicon. Does the speaker still attend to the wind during speech planning?
  *   **Yes:** Go to Leaf E.
  *   **No:** Go to Node 7.

  **Node 7 (Silent Evidential):** A woman recalls a death she did not witness. She is alone, silent, and writing nothing. Does the memory itself feel qualitatively different (e.g., "fuzzier" or "tagged") compared to a death she saw, independent of her ability to describe it?
  *   **Yes:** Go to Node 8.
  *   **No:** Go to Node 9.

  **Node 8 (Evidential Decay):** The woman from Node 7 does not speak about the death for a year. When she finally recalls it again in silence, is the "inferred" tag still as strong as when the event was fresh?
  *   **Yes:** Go to Leaf F.
  *   **No:** Go to Leaf G.

  **Node 9 (Bilingual Evidential):** A bilingual speaker switches from Kænnavan to Trade Tongue (which lacks evidentials) to tell a story about the death. Does her subjective feeling of certainty about the event change upon switching languages?
  *   **Yes:** Go to Leaf F.
  *   **No:** Go to Leaf D.

  **Node 10 (Conceptual Block):** A Kænnavan speaker is taught the concept of "left" using gestures only. Can she use it to navigate a new room?
  *   **Yes:** Go to Leaf D.
  *   **No:** Go to Leaf C.
      *(Note: Node 10 is a backup branch if Node 4 is ambiguous; treat Node 4 as the primary path for conceptual availability.)*

  **Node 11 (Social Evidential):** When a speaker uses an evidential marker in Trade Tongue (borrowed), is it to signal truth or to signal social hierarchy?
  *   **Truth:** Go to Leaf F.
  *   **Hierarchy:** Go to Leaf G.
      *(Note: Node 11 refines Leaf G vs F.)*

  **Node 12 (Universal Core):** Is there any task (e.g., recognising a face) where Kænnavan speakers perform identically to all humans regardless of language?
  *   **Yes:** (All leaves assume Yes, otherwise Universalism is dead).
  *   **No:** (Incoherent).

  *(To satisfy the node count constraint, Nodes 10, 11, and 12 serve as refinements or alternative entry points to the leaves below, ensuring the tree has sufficient resolution without creating empty branches.)*

  ---

  ### The Leaves

  **Leaf A: Weak Relativism (Neo-Whorfian)**
  *   **Awkward Commitment:** You must admit that thought is malleable enough to change simply by switching vocabulary, yet stable enough to resist change when the speaker chooses not to switch.
  *   **Licensed Writing:** You may write characters who perceive the world slightly differently depending on which language they are currently using, but you cannot write them as unable to understand the other perspective.

  **Leaf B: Strong Determinism (Classical Whorfian)**
  *   **Awkward Commitment:** You must commit to the view that a bilingual speaker is effectively two different people, with one cognitive mode permanently inaccessible to the other.
  *   **Licensed Writing:** You may write a character who literally cannot conceive of "blue" when speaking Kænnavan, but be aware this position is empirically fragile and often rejected by linguists.

  **Leaf C: Cognitive Constraint (Incommensurability)**
  *   **Awkward Commitment:** You must assert that there are thoughts human brains are capable of which Kænnavan grammar makes impossible to think, not just difficult.
  *   **Licensed Writing:** You may write a character who fails to understand a relative direction even when explained with gestures, as if the concept slides off their mind.

  **Leaf D: Universalism (Instrumentalism)**
  *   **Awkward Commitment:** You must treat language as a mere coding system that has no feedback loop into perception, memory, or attention.
  *   **Licensed Writing:** You are licensed to write nothing beyond what any speaker of any language would feel; Kænnavan is costume, not psychology.

  **Leaf E: Thinking for Speaking (Slobin)**
  *   **Awkward Commitment:** You must confine all linguistic effects to the narrow window of time when a speaker is preparing to utter a sentence; the effect vanishes the moment they stop speaking.
  *   **Licensed Writing:** You may write a character who notices the wind only when she intends to speak, but you cannot write her noticing it while she sleeps or sits in silence.

  **Leaf F: Epistemic Relativism (Descriptive Name)**
  *   **Awkward Commitment:** You must claim that grammatical markers can alter the phenomenological quality of memory traces themselves, not just the report of them.
  *   **Licensed Writing:** You may write a character who, alone and silent, feels a distinct texture of uncertainty in an "inferred" memory compared to a "seen" one.

  **Leaf G: Pragmatic Marking (Descriptive Name)**
  *   **Awkward Commitment:** You must argue that evidentials are social signals of trustworthiness rather than cognitive tags of truth, meaning the speaker might know something is inferred but not *feel* it differently.
  *   **Licensed Writing:** You may write a character who uses evidentials to manage her reputation, but internally she feels no difference between what she saw and what she was told.

