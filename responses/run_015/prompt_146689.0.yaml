prompt: |-
  hey i run mediation at a small community center and lately im dealing with people splitting shared stuff they built together — food carts, little shops, art collectives — and they always want 50/50 but that feels wrong when one person can walk away to a good job and the other is stuck. i read about this kalai-smorodinski idea (hope i spelled that right, maybe kalai-smorodinski?) where you dont split the difference like nash but instead you find each persons worst-case fallback and best-case dream, then you scale both up by the same fraction so they move proportionally toward thier ideal. i need to turn this into an actual checklist i can run in 30 minutes with people who dont do math and dont have lawyers. please give me the steps in order, what counts as enough info for each step, where the procedure stops with a hard no, and where i have to make a judgment call because values are sneaking in. then apply it to three splits: two ex-partners breaking up a food truck where one has a job offer out of town and the other has zero fallback; two artists dividing leftover grant money where one already won a backup scholarship and the other is flat broke; and a split where one person hides that thier outside option is actually amazing, so the math gives them nearly everything and the other partner is furious. also tell me exactly where this thing breaks down and i shouldnt use it.
reasoning: |-
  Here's a thinking process that leads to the suggested mediation checklist and analysis:

  1.  **Analyze the Request:**
      *   **User:** Runs mediation at a small community center.
      *   **Problem:** People splitting shared assets (food carts, shops, art collectives). 50/50 feels unfair when fallback positions (BATNAs) differ vastly.
      *   **Concept:** Kalai-Smorodinsky (KS) bargaining solution.
      *   **Goal:** Turn KS into a 30-minute non-math, non-lawyer checklist.
      *   **Requirements:**
          *   Ordered steps.
          *   Criteria for "enough info."
          *   Hard stops (where to say no).
          *   Judgment calls (where values sneak in).
          *   Application to three specific scenarios (Food Truck, Grant Money, Hidden Outside Option).
          *   Limitations/Breakdown points (when *not* to use it).
      *   **Tone:** Practical, empathetic, clear, authoritative but accessible.

  2.  **Deconstruct Kalai-Smorodinsky (KS) for Laypeople:**
      *   *Mathematical Definition:* KS selects the point on the Pareto frontier where the ratios of utilities relative to the disagreement point are equal. Basically, both parties gain the same *percentage* of their maximum possible gain.
      *   *Layperson Translation:* "Equal Sacrifice" or "Proportional Gain." If Person A could gain \$100 max and Person B could gain \$50 max, KS doesn't split the pot 50/50. It ensures A gets the same *fraction* of their \$100 potential as B gets of their \$50 potential.
      *   *Key Inputs needed:*
          1.  Disagreement Point (Walk-away value/BATNA).
          2.  Ideal Point (Best-case scenario for each).
          3.  Feasible Set (What is actually possible to divide).
      *   *The "Vibe":* It acknowledges power imbalances (fallbacks) but prevents the strong party from taking *everything* just because they can. It rewards the person with the better outside option, but caps their greed relative to their potential.

  3.  **Drafting the Checklist (The "30-Minute Protocol"):**
      *   *Constraint:* 30 minutes, no math, no lawyers.
      *   *Step 1: Define the Pot.* What are we splitting? (Cash, assets, rights).
      *   *Step 2: The Walk-Away (Disagreement Point).* What happens if you leave right now? Needs to be concrete, not emotional.
      *   *Step 3: The Dream (Ideal Point).* If you got everything you wanted from this split, what does it look like?
      *   *Step 4: The Reality Check (Feasibility).* Can both dreams happen? (Usually no).
      *   *Step 5: The Proportional Slide.* This is the KS core. Adjust claims so both give up the same *percentage* of their dream.
      *   *Step 6: Agreement.*
      *   *Hard Stops:* Violence, illegal assets, inability to define value.
      *   *Judgment Calls:* Valuing non-monetary items, verifying truthfulness.

  4.  **Developing the Scenarios:**

      *   *Scenario 1: Food Truck (Job vs. Stuck).*
          *   Person A: Job offer \$60k (Walk-away). Dream: Keep truck + \$50k cash.
          *   Person B: \$0 (Walk-away). Dream: Keep truck + \$50k cash.
          *   KS Application: A has a strong fallback. B has none. KS ensures A gets more than B because A's "gain" is measured from a higher baseline, *but* B gets a significant portion of the truck because A has to sacrifice the same % of their dream.
          *   *Correction/Refinement:* Actually, KS is about *utility gains*. If A walks away with \$60k value and B with \$0, the "surplus" to be divided is the truck value. KS says: Divide the surplus so the ratio of (Get - Walk) / (Dream - Walk) is equal.
          *   *Simplification for Mediation:* Focus on the *asset* being split.
          *   *Walk-away:* A = Job (value), B = Nothing.
          *   *Dream:* A = All Asset, B = All Asset.
          *   *Result:* A gets more because they have leverage, but B gets enough to survive because A must concede proportionally.

      *   *Scenario 2: Grant Money (Scholarship vs. Broke).*
          *   Person A: Has backup scholarship.
          *   Person B: Flat broke.
          *   *KS Logic:* A's need is lower. B's need is higher. But KS isn't about *need*, it's about *potential gain*.
          *   *Wait, critical nuance:* KS uses *utility*. If money has diminishing marginal utility (B needs it more), KS might favor B. But in a simple monetary split, KS favors the person with the better BATNA *if* the "Dream" is the same.
          *   *Actually, for mediation:* We need to frame "Dream" carefully. If A's dream is "Full grant + Scholarship" and B's dream is "Full grant + Survival," the stakes differ.
          *   *Better interpretation:* KS prevents the "Rich get richer" extreme of Nash sometimes, but generally rewards the stronger BATNA. However, in community mediation, we often want to protect the vulnerable. I need to be careful not to advise something that leaves B destitute.
          *   *Refinement:* KS is actually *more* favorable to the weaker party than the Nash Bargaining Solution in many asymmetric cases because it focuses on the *ideal point* constraint.
          *   *Let's stick to the prompt's understanding:* The user thinks KS helps the stuck person. Actually, KS acknowledges the BATNA. If A has a job, A has leverage. KS says A should get more than B, but not *all*. I need to explain this tension.
          *   *Correction:* The user says "50/50 feels wrong when one person can walk away... and the other is stuck." They want a solution that accounts for this. KS does account for it by using the Disagreement Point.
          *   *Scenario Outcome:* A gets more cash, B gets less, but B gets enough to not be ruined, because A has to sacrifice % of their dream.

      *   *Scenario 3: Hidden Outside Option (Lying).*
          *   Person A claims bad fallback, actually has good one.
          *   KS relies on honest inputs.
          *   *Outcome:* Math gives A everything. B is furious.
          *   *Lesson:* KS breaks if trust is broken.

  5.  **Identifying Breakdown Points (Limitations):**
      *   Incommensurable values (Sentimental vs. Cash).
      *   Bad Faith/Lying (The Scenario 3 problem).
      *   Power Imbalance too high (Coercion).
      *   Future relationships (KS is one-shot).

  6.  **Refining the "Math" for Non-Math People:**
      *   Don't use formulas. Use "Percentage of Dream."
      *   "If you want 100% of the truck, but you can walk away with a job, you have to give up some truck so the other person, who can't walk away, gets a fair shot at their dream."
      *   Actually, the simplest way to explain KS is: "Both of you give up the same percentage of what you hoped for."

  7.  **Review against Constraints:**
      *   30 minutes? Yes, keep steps tight.
      *   No lawyers? Yes, plain English.
      *   Hard stops? Included.
      *   Judgment calls? Highlighted.
      *   Three scenarios? Included.
      *   Breakdown points? Included.

  8.  **Self-Correction on Kalai-Smorodinsky Nuance:**
      *   *Technical Check:* KS solution is the point on the Pareto frontier where $u_1 / u_1^{max} = u_2 / u_2^{max}$ (normalized to disagreement point 0).
      *   *Translation:* It equalizes the *proportion of maximum possible gain achieved*.
      *   *Implication:* If Person A has a great BATNA, their "gain" is smaller for the same asset. If Person B has a terrible BATNA, their "gain" is huge.
      *   *Wait:* If A has a great job (BATNA), their utility from the *partnership* might be lower than B's.
      *   *Let's simplify for the user:* The user wants to avoid 50/50 when fallbacks differ. KS is good for this because it anchors to the "Ideal" and "Disagreement."
      *   *Crucial Warning:* KS requires knowing the "Ideal Point." In a split, the Ideal Point is usually "I get everything." If both ideals are "I get everything," KS collapses to 50/50 *unless* the Disagreement Points differ.
      *   *Actually:* If Ideal is (1,0) and (0,1) and Disagreement is (d1, d2). KS finds point (x, y) on frontier such that $(x-d1)/(1-d1) = (y-d2)/(1-d2)$.
      *   *If d1 is high (good job) and d2 is low (no job):* A needs less from the deal to be satisfied. B needs more. KS will give B *more* of the asset than A, because B has further to travel to reach their ideal from their terrible fallback.
      *   *Wait, this contradicts standard economic intuition.* Usually, better BATNA = better deal.
      *   *Let's check the literature:* Kalai-Smorodinsky is often seen as more "egalitarian" than Nash regarding utility gains. It protects the weaker party *relative to their potential*.
      *   *Okay, for the mediation context:* The user wants to avoid 50/50. KS allows for asymmetric splits based on the "distance" from fallback to ideal.
      *   *Decision:* I will frame it as "Equal Percentage of Hope." This captures the spirit without the calculus.

  9.  **Final Polish:**
      *   Ensure the tone is supportive but realistic.
      *   Make sure the "Hard No" section is strong (safety first).
      *   Ensure the "Hidden Option" scenario highlights the fragility of the method.

  10. **Writing the Response:** (Drafting mentally... okay, ready to generate).
      *   *Intro:* Validate the user's intuition. 50/50 isn't always fair.
      *   *The Protocol:* 5 Steps.
      *   *The Scenarios:* Apply the steps.
      *   *The Breakdown:* When to walk away.

      *(Self-Correction during drafting)*: I need to be careful not to promise KS solves *everything*. It's a heuristic here, not a rigorous game theoretic implementation. I must emphasize that "Value" is subjective.

      *(Refining the "Math" step)*: Instead of calculating percentages, use a visual slider. "Move the slider until you both feel you've given up the same amount of your dream."

      *(Refining Scenario 1)*: Food truck. A has job. B has nothing.
      Disagreement: A = Job, B = $0.
      Ideal: A = Truck + Cash, B = Truck + Cash.
      KS Outcome: B gets more of the truck value because B's "gap" between nothing and dream is bigger than A's gap between job and dream. This aligns with the user's desire to help the "stuck" person.

      *(Refining Scenario 3)*: Hiding info. KS fails because the "Disagreement Point" is false.

      *(Refining Breakdown)*: When values aren't comparable (e.g., custody vs. money).

      *Okay, plan is solid.*
answer: |-
  This is a smart instinct. The 50/50 split (the "Nash" default) assumes both parties start from the same baseline. When one person has a safety net and the other is on a tightrope, 50/50 reinforces the inequality.

  The **Kalai-Smorodinsky (KS)** solution is perfect for this because it focuses on **proportional gain**. Instead of splitting the *pot* equally, it splits the *distance between your worst-case and your dream* equally. It says: "You both have to sacrifice the same percentage of your hopes."

  Here is a 30-minute mediation protocol adapted from KS for non-mathematicians, followed by the three scenarios and the breakdown points.

  ---

  ### The "Proportional Hope" Checklist (30 Minutes)

  **Pre-Condition:** Both parties must agree to be honest about their alternatives. If trust is gone, stop.

  #### Step 1: Define the "Pot" (5 Minutes)
  *   **Action:** List every tangible asset to be split (cash, equipment, intellectual property, client lists).
  *   **Enough Info:** A written list both initial. If they argue about whether something is in the pot (e.g., "Is the Instagram account an asset?"), you must make a judgment call.
  *   **Judgment Call:** You decide if non-monetary items (like "credit" or "name rights") count. Treat them as currency.
  *   **Hard No:** If the "Pot" includes illegal goods or things one person doesn't legally own, stop mediation.

  #### Step 2: The Walk-Away Number (Disagreement Point) (5 Minutes)
  *   **Action:** Ask each person privately: "If you walk out of this room right now with nothing from the Pot, what is your life worth in 30 days?"
  *   **Enough Info:** A concrete number or concrete situation (e.g., "$0 and sleeping on a couch" vs. "$5,000/month job").
  *   **Judgment Call:** You must assess credibility. If Person A says "I'll be homeless" but you know they have wealthy parents, you have to gently challenge the number.
  *   **Hard No:** If one person threatens violence or self-harm as their "walk-away," call emergency services. Do not negotiate with threats.

  #### Step 3: The Dream Number (Ideal Point) (5 Minutes)
  *   **Action:** Ask: "If you got everything you wanted from the Pot, what does that look like?"
  *   **Enough Info:** Usually, this is "I keep the business and all the cash."
  *   **Note:** In most splits, both Ideal Points are "100% of the Pot." This is expected.
  *   **Hard No:** If one person's dream is "I want the other person to apologize publicly," you cannot mediate this with KS. KS works on divisible resources, not moral victories.

  #### Step 4: The Proportional Slide (10 Minutes)
  *   **Action:** Explain the rule: *"We are not splitting the money 50/50. We are splitting the 'gain' equally. If Person A has a good job, they need less from this pot to be happy. Person B needs more. We will adjust the split until you have both given up the same percentage of your Dream."*
  *   **The Math (For You, Not Them):**
      *   Person A Gain = (Final Offer) − (Walk-Away)
      *   Person B Gain = (Final Offer) − (Walk-Away)
      *   Adjust until: `(A Gain / A Dream Gap)` is roughly equal to `(B Gain / B Dream Gap)`.
  *   **Layman's Tool:** Use a visual slider. "Person A, you're getting 80% of your dream. Person B, you're currently at 40%. Move money from A to B until you are both at, say, 65%."
  *   **Judgment Call:** This is where values sneak in. If the math says Person B gets $100 and Person A gets $9,900, but Person B will starve, you intervene. KS is a guide, not a law. You can cap the inequality for ethical reasons.
  *   **Hard No:** If one party refuses to move from "100% for me," the procedure fails.

  #### Step 5: The Handshake (5 Minutes)
  *   **Action:** Write down the split.
  *   **Enough Info:** Who gets what, by when.
  *   **Hard No:** If they want to add "secret clauses" (e.g., "I get this now, but I can sue later"), reject it. The agreement must be final.

  ---

  ### Applying the Protocol to Your Scenarios

  #### Scenario 1: The Food Truck (Job vs. Stuck)
  *   **The Pot:** Truck valued at $20,000.
  *   **Person A (Job):** Walk-away = $60k/year job (Value: High). Dream = Keep Truck + Cash.
  *   **Person B (Stuck):** Walk-away = $0. Dream = Keep Truck + Cash.
  *   **The KS Split:**
      *   Person A's "Gap" between Job and Dream is smaller (they are already safe).
      *   Person B's "Gap" between $0 and Dream is massive (survival).
      *   **Result:** To equalize the *percentage of hope achieved*, Person B gets the Truck. Person A gets a smaller cash payout.
      *   **Why:** Person A only needs to sacrifice a small % of their dream to be secure. Person B needs a large % of the dream to survive. KS favors the vulnerable here because their "distance to travel" is greater.
      *   **Mediator Note:** Ensure Person A understands they are being compensated for leaving the partnership, not punished for having a job.

  #### Scenario 2: The Grant Money (Scholarship vs. Broke)
  *   **The Pot:** $10,000 Grant leftover.
  *   **Person A (Scholarship):** Walk-away = Fully funded scholarship. Dream = Keep Grant + Scholarship.
  *   **Person B (Broke):** Walk-away = Debt/eviction. Dream = Keep Grant + Safety.
  *   **The KS Split:**
      *   Person A's marginal utility of the cash is low (they are funded).
      *   Person B's marginal utility is high (survival).
      *   **Result:** Person B gets the majority of the cash (e.g., $8k), Person A gets a token amount (e.g., $2k) for their contribution.
      *   **Why:** Person A achieves 95% of their "security dream" just by walking away. Person B achieves 0%. To make the *gain* proportional, B must get the bulk of the resource.
      *   **Mediator Note:** Person A may feel this is unfair ("I worked too!"). You must reframe: "You are walking away secure. This money is buying security for B, which you already have."

  #### Scenario 3: The Hidden Outside Option (The Lie)
  *   **The Pot:** $50,000 Business Buyout.
  *   **Person A (Liar):** Claims Walk-away = $0. Actual Walk-away = $1M Job.
  *   **Person B (Honest):** Walk-away = $0.
  *   **The KS Split:**
      *   The math sees two people with $0 fallbacks.
      *   **Result:** 50/50 Split ($25k each).
      *   **The Reality:** Person A takes the $25k, leaves, and takes the $1M job. Person B is left with a broken business and $25k.
      *   **The Fury:** Person B eventually finds out. The agreement feels fraudulent.
      *   **Mediator Note:** This is where KS breaks. It relies on **truthful input**. If you suspect lying, you cannot use KS. You must switch to a "Blind Split" (one cuts, one chooses) or demand verified proof of finances before starting.

  ---

  ### Where This Breaks Down (Do Not Use KS Here)

  **1. Incommensurable Values**
  *   **The Problem:** One person wants the *cash*, the other wants the *art* (sentimental value).
  *   **Why KS Fails:** You cannot calculate the "percentage of dream" when one dream is monetary and the other is emotional.
  *   **Solution:** Use "I Cut, You Choose." One person divides the assets into two bundles they think are equal; the other picks first.

  **2. High Power Imbalance / Coercion**
  *   **The Problem:** One partner controls the bank accounts, passwords, or physical access to the shop.
  *   **Why KS Fails:** The "Walk-Away" number is artificially suppressed by the abuser. The math will look fair, but the input is rigged.
  *   **Solution:** Do not mediate. Refer to legal aid or safety resources.

  **3. Future Cooperation Required**
  *   **The Problem:** They aren't fully splitting; they are restructuring to work together again.
  *   **Why KS Fails:** KS is a "divorce" model (one-shot game). It maximizes immediate gain, which can breed resentment for future work.
  *   **Solution:** Use "Interest-Based Bargaining" (focus on needs, not numbers).

  **4. The "Zero-Sum" Trap**
  *   **The Problem:** The pot is too small to cover the "Walk-Away" of the vulnerable person.
  *   **Why KS Fails:** If Person B needs $10k to survive, and the pot is $5k, KS math breaks because you can't bridge the gap.
  *   **Solution:** Acknowledge the loss. Focus on "how do we minimize damage" rather than "fair split."

  ### Final Mediator Advice
  The Kalai-Smorodinsky method is a **heuristic**, not a calculator. In your community center, use the *language* of KS ("Equal Sacrifice of Hope") rather than the math.

  When you see the "Job vs. Stuck" dynamic, say this:
  > *"A 50/50 split assumes you both start at the same line. You don't. One of you is starting at the 50-yard line (the job). The other is at the goal line (zero). If we split the ball 50/50, the person at the goal line still loses. We are going to split the **progress** equally instead."*

  This validates the inequality without shaming the successful partner, and it protects the vulnerable partner without begging for charity.
