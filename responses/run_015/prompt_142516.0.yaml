answer: |-
  **Q&A PREP SHEET**

  **1. City Cultural-Property Lawyer**
  *Objection:* "This delegates fiduciary duty. It is *ultra vires* to contract away statutory governance and inalienability."
  *Reply:* We retain physical custody and legal liability, fulfilling our statutory duty of care. We are outsourcing interpretation, not governance. The review clause retains our ultimate leverage to revert to standard custody if statutory boundaries are breached.
  *Weakness:* Statutes often forbid delegating core curatorial functions regardless of custody.

  **2. Nigerian Federal Antiquities Official**
  *Objection:* "Authority without title is neo-colonial stewardship. We require sovereignty, not management rights."
  *Reply:* Title is the destination via the twenty-five-year clause. This unlocks immediate agency over narrative and care without litigation deadlock. It prioritizes functional sovereignty now over legal title later.
  *Weakness:* They may view interim authority as an insultingly gradualist delay.

  **3. Board Chair (Retired Judge)**
  *Objection:* "You're creating dual sovereignty. Who decides if the Edo body violates safety standards? Precedent matters."
  *Reply:* Custody remains ours, so safety liability remains ours. We retain a veto on physical interventions that threaten material survival. This maintains consistency with our duty to preserve assets.
  *Weakness:* Ambiguity during emergencies remains legally unresolved.

  **4. City Finance Director**
  *Objection:* "Indemnity costs for external control? If they demand risky handling, who pays? This creates unbudgeted exposure."
  *Reply:* Our insurance covers physical risk because custody remains here. Their authority is intellectual and dispositional, not physical assumption of risk. No new indemnity class is triggered.
  *Weakness:* Insurers may reject liability for decisions we didn't make.

  **5. Head of Conservation**
  *Objection:* "Cumulative handling increases if loans are approved externally without our risk assessment. Material risk is unacceptable."
  *Reply:* We retain conservation protocol veto based on material survival, distinct from display authority. Physical custody guarantees handling control.
  *Weakness:* Distinguishing 'display decision' from 'handling risk' is technically porous.

  **6. Benin Court Historian**
  *Objection:* "Twenty-five years is a generation. Why must we wait to own our ancestors?"
  *Reply:* This secures immediate control over narrative and care now, bypassing legal hurdles that delay title indefinitely. It is a bridge, not a barrier.
  *Weakness:* Accepts a delay that feels morally arbitrary.

  **7. Trustee (Former Ambassador)**
  *Objection:* "If the public sees this as 'keeping' the loot, the reputational damage is severe. Consistency with global restitution trends is key."
  *Reply:* We frame this as 'repatriation of authority,' shifting the debate from possession to sovereignty. It aligns with evolving best practices on shared stewardship.
  *Weakness:* Media simplifies nuance; 'keep' is the headline.

  **8. Head of Conservation**
  *Objection:* "Emergency conservation during a crisis—who authorizes intervention?"
  *Reply:* Standard emergency clauses apply; physical custody grants us immediate intervention rights to prevent loss.
  *Weakness:* Defining 'emergency' is subjective.

  ***

  **STRATEGIC NOTES**

  **Concede in Opening (First 2 Minutes):**
  Admit that provenance gaps are permanent and clean title is impossible under current European law. Acknowledge that the museum's legal ownership is technically secure but morally hollow. This disarms the Lawyer and the Fed by removing the fantasy of a simple legal fix.

  **Modify Proposal for These Two Objections:**
  1.  **Lawyer (Statutory Powers):** Add a joint oversight committee to review major dispositional decisions, ensuring no single external body has absolute power without local sign-off.
  2.  **Conservator (Material Risk):** Explicitly codify a "Material Survival Veto" where conservation concerns override display authority in writing.

  **The Single Reply That Must Land:**
  To the **Nigerian Federal Official**. If they reject authority as a substitute for title, the proposal dies. You must convince them that functional sovereignty now is more valuable than legal sovereignty later.

  **The Question You Hope Nobody Asks:**
  "Is this structure designed primarily to protect the museum from future compensation claims rather than to restore justice to the Edo court?"
