  **REPUBLIC OF EPISTEMIC POSITIONING**
  **MINISTRY OF SELF-LOCATION**
  **FORM ESL-909: ANTHROPIC STATUS & RESOURCE ALLOCATION DECLARATION**

  **INSTRUCTIONS:** Pursuant to the Anthropic Equity Act, all citizens must formally designate the reference class used to calculate entitlements, risk liabilities, and voting weight. Failure to specify a self-locating belief framework will result in default assignment to the *Least Privileged Causal Branch*. Please print clearly.

  **SECTION 1: HEALTH RISK ALLOCATION**
  *Select the population set against which your mortality risk shall be actuarially assessed.*

  ☐ **Class A: All Biological Humans (Terranical).**
  *Implication:* Standard mortality rates apply. Subsidies calculated based on historical death rates of *Homo sapiens* on Earth.
  ☐ **Class B: All Observer-Moments in This Causal Branch.**
  *Implication:* Risk diluted across temporal slices. May reduce immediate payout eligibility due to increased denominator of surviving moments.
  ☐ **Class C: All Instances of This Specific Mental State.**
  *Implication:* Includes simulated copies and philosophical zombies sharing this cognitive architecture. **Warning:** Selecting Class C often voids life insurance, as the majority of instantiations exist in high-fidelity simulations where biological death is non-terminal.
  ☐ **Class D: All Entities with This Precise Indexical Location.**
  *Implication:* Risk is singular. Subsidies are high, but eligibility is restricted to the unique spacetime coordinate occupied at the moment of form submission.

  **SECTION 2: EXISTENTIAL FORECAST WEIGHTING (DOOMSDAY ADJUSTMENT)**
  *Your voting weight is inversely proportional to the estimated total number of observers in your chosen reference class.*

  ☐ **I assert my birth rank is early relative to total human history.**
  *Effect:* Increases probability of near-term extinction (Doomsday Argument). Voting weight **increased** to compensate for shortened future polity.
  ☐ **I assert my birth rank is typical relative to all observer-moments.**
  *Effect:* Assumes long future timeline. Voting weight **standardized**.
  ☐ **I refuse to condition on birth rank.**
  *Effect:* Vote counted as evidential only. Causal impact nullified under Newcomb-like voting protocols.

  **SECTION 3: INTERPERSONAL MATCHING & CENTERED WORLDS**
  *Specify the modal conditions under which you are seeking partnership.*

  ☐ **Uncentered Possibilities Only.**
  Partner must exist in all possible worlds where I exist.
  ☐ **Centered Possibilities (Actual World).**
  Partner must occupy the same indexical context (here/now).
  ☐ **Cross-Branch Matching.**
  I am willing to match with counterparts in divergent causal branches.
  *Note:* The Ministry does not recognize relationships formed solely via evidential reasoning. If your partner exists only because you chose to date them, the union is considered statistically significant but causally void.

  **SECTION 4: CREDENCE DECLARATION (SLEEPING BEAUTY PROTOCOL)**
  *Per Ministry Directive 11.4, citizens must report credence values for hypothetical awakening scenarios to calibrate tax audits.*

  | Scenario | Half-Credence Value (SSA) | Third-Credence Value (SIA) |
  | :--- | :--- | :--- |
  | **Probability of Heads upon Awakening** | __________ | __________ |

  *Footnote 1:* Discrepancies between columns will be treated as unreported income derived from ontological arbitrage. The Ministry acknowledges no philosophical consensus on this matter; however, for tax purposes, the 'Third' position is assumed during leap years, and the 'Half' position during standard fiscal cycles.

  **SECTION 5: ARBITRARINESS WAIVER**
  By signing below, I acknowledge that my selection of a reference class is fundamentally circular, as the justification for the class depends on the conclusion I wish to derive. I understand that selecting a class to maximize subsidies constitutes fraud, while selecting a class to minimize existential risk constitutes delusion.

  **Citizen Signature:** _______________________ **Date:** _______________
  **Current Indexical Coordinate (X, Y, Z, T):** _______________________

  *For Office Use Only: Verify applicant is not a Boltzmann Brain. If entropy fluctuation detected, route to Section 9 (Thermal Equilibrium Welfare).*
