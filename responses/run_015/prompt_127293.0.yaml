prompt: |-
  I’ve been trying to explain the reference-class problem to some friends who aren’t deep into rationalist literature—specifically why it’s so hard to decide whether you’re reasoning as “a random human,” “a random observer-moment,” or “someone who just had this exact thought”—and I realized the best way to show the absurdity isn’t through another blog post but through a deadpan bureaucratic document. Could you write a satirical parody of a government census and tax-intake form for the fictional Republic of Epistemic Positioning, a country where every policy, subsidy, and personal entitlement is determined by the reference class each citizen formally selects?

  The form should include numbered sections—Health Risk Allocation, Existential Forecast Weighting, and Interpersonal Matching—with checkbox options like all biological humans, all observer-moments in this causal branch, all instances of this specific mental state, and all entities with this precise indexical location. Include a deadpan footnote from the fictional Ministry of Self-Location that quietly takes a side on the Sleeping Beauty problem and the Doomsday argument, say by requiring citizens to report both half-credence and full-credence values, without ever breaking the administrative voice. The satire should exaggerate the real philosophical difficulty: that any choice of reference class seems either circular or arbitrary, and that applying anthropic reasoning to everyday governance produces obvious injustices—your vote weight shifts if more copies of you exist in a simulation, your health subsidy depends on whether you count all branches where you survive, and your dating profile must specify the centered-world conditions under which you are seeking a partner.

  Keep the tone strictly formal and readable to someone who has never heard of indexical uncertainty, but include enough precise terminology—centered versus uncentered possibilities, self-locating beliefs, the distinction between evidential and causal reasoning in anthropic contexts—that a specialist recognizes you actually understand the problem rather than just mocking it. Aim for about 600 to 800 words, formatted as blank-fill sections with official letterhead, and make sure the humor comes from the logic being pushed straight rather than from invented nonsense. I want the piece to feel like a Swiftian modest proposal for people who already argue about centered worlds on forums.
