  5.  **Drafting Replies (90 seconds approx. 150-200 words spoken):**
      *   Need to be punchy, acknowledge the constraint, but hold the line on the *conceptual* shift while offering a *practical* bridge.
      *   *Honesty Note:* Crucial. Where is the speaker bluffing?

  6.  **Pre-emptive Neutralization & Concessions:**
      *   *Concession:* Admit the binary is needed for *operations*, even if not for *ontology*.
