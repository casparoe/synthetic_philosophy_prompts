      *   *Medium Damage:* Synthetic Biologist (Ideological clash), Contamination (Practical risk).
      *   *Lower Damage:* Philosopher (Theoretical nuance), General Skeptic (Rhetorical).

      *Let's select the top 8 and refine the vocabulary.*

      1.  **Instrument Lead (Requirements Flow-Down):** "How does a gradient map to a Go/No-Go decision tree?"
      2.  **Policy (COSPAR/Licensing):** "At what point on the scale does Planetary Protection Category IV apply?"
