  **Header:**
  REPUBLIC OF SKARN
  OFFICE OF THE REGISTRAR OF RULES
  MEMORANDUM

  **To:** Members of the Revision Assembly
  **From:** Office of the Registrar of Rules
  **Date:** 14 October 2024
  **Subject:** Operational Classification of Enacted Instruments and Determination of Validity Status

  **Body:**
  1. This guidance note establishes the procedural framework for determining the operative status of legislative instruments pending judicial clarification. It is issued pursuant to the administrative mandate of the Registrar to maintain the Register of Rules. All members of the Revision Assembly must adhere to these classifications when citing authority for proposed legislation or executive action. Failure to classify underlying authority correctly may result in administrative rejection of filings.

  2. The Office recognizes three distinct categories of rule status. These categories are exhaustive for the purposes of registration. A rule is classified as **In Force** when its enactment procedure complies with the threshold requirements extant at the time of passage. A rule is classified as **In Suspense** when its enactment procedure complies with prior thresholds but conflicts with entrenched provisions currently asserted by competing instruments. A rule is classified as **In Advance** when its validity conditionally depends upon the future enactment of a secondary rule, provided that the primary rule itself establishes the procedure for enacting that secondary rule.

  3. Rules classified as In Force carry full presumptive validity. Officials may rely upon them for immediate action. Rules classified as In Suspense retain provisional validity. They may be cited as authority, provided that the citing official acknowledges the potential for retroactive invalidation should the entrenched provisions be upheld by competent adjudication. Officials acting under In Suspense rules assume personal liability for any restitution required should the status revert to Invalid.

  4. Rules classified as In Advance occupy a unique temporal position. Such rules are deemed operative only for the purpose of authorizing the secondary rule required to perfect their own validity. Once the secondary rule is enacted pursuant to the procedure outlined in the primary rule, the primary rule transitions automatically to In Force status. Until such transition, the primary rule possesses no authority outside the specific mechanism of its own validation. This ensures continuity of the legal order during periods of procedural transition.

  5. Regarding the Register of Rules itself: Entry 1, which establishes the existence and maintenance of the Register, was deleted pursuant to Rule 44-B. However, Rule 44-B was recorded in the Register maintained under Entry 1. The Office treats Entry 1 as subsisting for the sole purpose of validating the recording of Rule 44-B. This circular dependency is managed administratively. The Register remains open for business. Officials should not inquire into the ontological status of Entry 1 during routine transactions.

  6. To facilitate this scheme, any official acting under a rule classified as In Suspense or In Advance must submit **Form 9-D (Declaration of Provisional Authority)** to the Registrar prior to execution. The form requires the official to specify the rule relied upon, the classification assigned, and the anticipated date of status resolution. Submission of Form 9-D constitutes an acknowledgment that the action taken may be voided without compensation should the classification be revised.

  7. **Worked Application:** The Ninth Revision is classified as **In Advance**. The Revision lowers the amendment threshold to a plurality and repeals the entrenched protection of the prior threshold. Under the prior rules, the Revision is In Suspense due to the entrenchment. Under the Revision's own terms, it is In Force. Therefore, its validity awaits the future use of the plurality procedure it establishes. Until the Assembly successfully passes a subsequent instrument using the plurality threshold defined in the Ninth Revision, the Ninth Revision remains In Advance. It authorizes the passage of said subsequent instrument, which will then retroactively confirm the Ninth Revision's status as In Force.

  8. **Correction:** Paragraph 3 of this memorandum is hereby repealed effective immediately. Officials acting under rules classified as In Suspense no longer assume personal liability for restitution. Liability now rests with the Office of the Registrar. This change reflects updated risk assessments regarding the enforceability of retroactive invalidation. Please update your copies of this guidance accordingly.

  9. This memorandum remains in effect until superseded by further guidance or judicial order. Officials are reminded that the authority of the Office of the Registrar to issue this guidance is currently classified as In Suspense, pending the resolution of the appointing instrument's validity. Nevertheless, compliance is mandatory to ensure the continuity of public administration.

  **Signed,**

  *J. Varrick*
  Acting Registrar of Rules
  ( Authority to Issue Guidance: In Suspense )

