          2.  **(4) vs. Bounded Intervals:** The invariance move fails on bounded intervals. This isn't a flaw in (4) per se, but a limit of its applicability.
          3.  **(2) vs. (5):** (2) correctly identifies the sphere problem as ill-posed (like Bertrand). (5) refuses to accept "ill-posed."
      *   **What has to give?** (5) must go, or be modified to allow "I don't know" or a set of priors. Alternatively, one must introduce a *meta-prior* over parametrizations, but that just kicks the can.
      *   **The "Cracked Pair":** (1) and (5) are fundamentally incompatible in underdetermined cases. (1) says "symmetry justifies distribution." (5) says "distribute even without symmetry."
