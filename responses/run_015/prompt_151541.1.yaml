          *   Premise (5) demands an answer anyway.

  2.  **Identify the Core Tension:**

      The user wants a precise number (5) in a situation where their own criteria for generating a number (1, 3, 4) fail to yield a unique result, and their fallback diagnosis (2) admits the question is ill-posed.

      *   (1) & (2) say: "If symmetric, spread evenly. If not symmetric/ill-posed, PoI doesn't apply."
      *   (3) says: "Mechanism fixes it." (No mechanism here).
