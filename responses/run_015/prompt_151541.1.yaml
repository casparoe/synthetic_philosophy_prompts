      *   **Premise (3):** If a mechanism is known, its symmetries dictate the prior (Jaynes' approach).
      *   **Premise (4):** If *no* mechanism is known, use invariance under redescription (e.g., $r \to 1/r$ for wine/water) to derive a unique prior.
      *   **Premise (5):** Refusal to accept imprecise probabilities (sets/ranges); demands a single precise number.
      *   **The Problem Case:** Sphere radius $R \in [1, 10]$. No mechanism. Question: $P(V > V_{max}/2)$?
          *   Uniform $R \implies P \approx 0.23$.
          *   Uniform $V \implies P = 0.5$.
          *   Uniform $\log R \implies P \approx 0.10$.
          *   Redescription invariance (Premise 4) fails because bounds $[1, 10]$ break scale/ratio symmetries.
