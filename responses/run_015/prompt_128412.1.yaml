answer: |-
  The community hall in the Osmi Delta smelled of wet earth and stale tea. Elara placed her ledger on the table, the spine cracked from a year of calculation. Outside, the blue-stem millet stood knee-high, vulnerable to the grey moth that drifted in from the marshes like ash.

  "The numbers are clear," Elara said, opening to the tabulated pages. She was the cooperative's agronomist, and she had spent the season quantifying suffering in units of 'insect-days.'

  Option One: the systemic seed coating. Cheap. Reliable. The moth larvae ingested the toxin and convulsed for forty hours before dying. Non-target beetles in the soil absorbed residual doses. The ledger estimated high suffering intensity, short duration.

  Option Two: the gene-drive. Release modified males. Crash the population over four seasons. No poison. No crushing. Just fewer moths coming into existence. The ledger marked this as zero suffering, but a column in the margin noted the philosophical dispute: was non-existence a harm, or the absence of harm?

  Option Three: the behavioural programme. Pheromone dispensers saturated the air. Females couldn't find males; an experimental spray blocked the females' olfactory receptors. The crop vanished from their perception. They flew past the millet to lay eggs on wild marsh grasses. The ledger showed near-zero suffering in the field.

  "Option Three minimizes the count," Elara said. She kept her voice flat. She did not mention the marsh grasses. She did not mention that the ledger's boundary stopped at the field edge. In the marsh, the caterpillars would hatch on nutrient-poor weeds and starve over a fortnight. That suffering was real, but it was off-books. Tidiness was a moral hazard, she knew, but the ledger was the only tool they had to compare incomparable things.

  Tomas, a senior grower, tapped the page for Option One. "They are reflexive machinery. Nervous systems, not souls. Why are we weighing their twitching against our children's food?"

  "Because the biology is uncertain," Lin said. She sat opposite him, hands clasped. "If there is even a one percent chance they feel pain, look at the numbers. Hundreds of millions per season in the Delta alone. A modest probability swamps every other consideration. We cannot risk being the cause of that much agony."

  "And if you take that logic to its end," Oren said, leaning forward. His voice was tired. "If the numbers swamp everything, then agriculture itself is a crime. Clearing the land kills more than the moths. Ploughing kills more. You would have to condemn the planting, not just the protection. Nobody here is prepared to stop farming. So the argument must be wrong upstream."

  The room settled into the heavy silence of people who know there is no clean ground to stand on.

  Elara looked at Oren. She knew what a fifth of the harvest meant to him. It meant his daughter's school fees for the year. It meant the Vans family could repair the roof before the monsoon. For the Koros, it meant the difference between selling surplus at market or eating from storage until the next planting. A failure here wasn't an abstraction; it was debt, it was hunger, it was the slow erosion of their hold on the land.

  "The gene-drive takes too long," Elara said, breaking the silence. "The ledger covers one season. It doesn't account for the niche. If we remove the moth, something else expands into that space. A different pest. We don't have data for year four."

  "But the coating kills the soil beetles," Lin countered. "The ones that aerate the root zones. That's visible damage."

  "The coating pays the bank," Tomas said quietly. "Option Three is experimental. The spray might wash off. The dispensers might fail."

  "If they fail," Elara said, "we lose the crop. But if we use the coating, we know exactly what dies."

  She looked down at her own data. Option Three was the winner on paper because she had drawn the line at the field margin. She could argue that quantified accounting was the only honest way to make a decision involving millions of lives. She could also argue that the ledger was a lie because it only counted what was easily countable. She believed both things simultaneously.

  "We vote," Oren said.

  Hands went up. It was close. The fear of the marsh starvation was theoretical; the fear of the bank was immediate. But the image of the convulsing larvae from Option One haunted them. They wanted the clean hands of Option Three. They wanted the moths to simply not find them.

  The motion passed. The behavioural programme would be deployed.

  ***

  Three months later, the millet stood gold and heavy. The heads were full, unblemished by leaf-strips. In the cooperative office, Elara updated the harvest yields. The Vans would pay their fees. The Koros would fill their silos. The gain was concrete; it was weight in the sack, it was security for the winter.

  Elara closed the ledger. She walked out to the edge of the field where the cultivated land met the wild reeds of the delta. The air was thick with the synthetic pheromone, sweet and cloying.

  Out in the marsh, the grey moths hovered. Confused by the scent saturation, blinded to the millet by the receptor block, they had settled on the wild grasses. Elara knelt and lifted a leaf. It was covered in eggs. She knew what would happen next. The larvae would hatch. They would chew the tough, fibrous wild grass. They would not get enough nitrogen. They would grow slow and weak. They would starve over a fortnight, shrinking instead of growing, consuming each other in the absence of better food.

  It was not poison. It was not crushing. It was simply neglect, engineered from a distance.

  The ledger was closed. The numbers balanced. The field was safe. In the marsh, the suffering continued, uncounted, beyond the boundary line where the accounting stopped and the world went on.
