answer: |-
  This is a sharp set of questions. You've correctly identified the friction points that usually derail these conversations, and your derivation on the noise model is surprisingly robust. Since you've been around since the OB days, I'll skip the intro to decision theory and go straight to the steelman/critique breakdown.

  ### Part 1: Critiquing the Blog Summary

  Here is how a proponent of Functional Decision Theory (FDT)—the modern formalization of Hofstadter's superrationality—would annotate that text.

  **1. "Standard game theory... assumes your decision can't affect the other player's."**
  *   **Verdict:** **Acceptable.**
  *   **Comment:** This accurately describes Causal Decision Theory (CDT). CDT treats the other player's action as a fixed environmental fact conditional on your action. It ignores logical correlations between algorithms.

  **2. "Superrationality drops that assumption."**
  *   **Verdict:** **Wince.**
  *   **Comment:** It's not that we assume our decision *affects* theirs (in a causal sense). It's that we recognize our decisions are *logically correlated* because they are outputs of similar functions. The phrasing "drops that assumption" sounds like we are assuming magic causality. We are actually adding an assumption about logical similarity.

  **3. "In effect, cooperating causes them to cooperate..."**
  *   **Verdict:** **Wrong (but forgivable shorthand).**
  *   **Comment:** This is the specific phrasing that makes CDT proponents scream "magical thinking!" A superrationalist knows they cannot *cause* the other to cooperate. Rather, they recognize that "I cooperate" and "They cooperate" are logically entangled truths. If the algorithm outputs C, both output C. The correlation is in the *source code*, not the physical causality.
  *   **Fix:** "Cooperating *implies* they cooperate, because you are running the same function."

  **4. "Your only real options are therefore 'both cooperate' or 'both defect'..."**
  *   **Verdict:** **Acceptable.**
  *   **Comment:** Given perfect symmetry, the off-diagonal outcomes (C,D) and (D,C) have probability zero. You are choosing between the diagonals.

  **5. "The catch is that the argument only works when the two players are the same decision-maker in the relevant sense..."**
  *   **Verdict:** **Acceptable, but too binary.**
  *   **Comment:** This is the "similarity condition." The wince comes from "same decision-maker." It suggests a binary (copy vs. not-copy). In reality, it's a gradient. If the other player is 99% similar to you, the correlation is 0.99, and the argument weakens but doesn't vanish.

  **6. "Standard game-theoretic prediction... is simply wrong."**
  *   **Verdict:** **Normatively Right, Technically Imprecise.**
  *   **Comment:** Mathematically, Nash Equilibrium under CDT is consistent. It isn't "wrong" math. The claim is that CDT is the *wrong normative standard* for rationality. If "rationality" means "getting the best outcome," then CDT is wrong in PDs against copies. If "rationality" means "following causal dominance," CDT is right. The blog post takes the "winning" definition, which is standard in rationalist circles, but phrasing it as a mathematical error in game theory is sloppy.

  ---

  ### Part 2: Your Near-Copy Calculation

  You asked: *Is the math right? Do T and S cancel? Is $\epsilon < 1/2$ the threshold?*

  **Yes, your derivation is correct.**

  Let's verify quickly to ensure we're on the same page.
  Let intended action be $A \in \{C, D\}$. Since we run the same procedure, we intend the same $A$.
  Let $\epsilon$ be the probability of execution error (flip).
  Probability of actual action matching intended: $1-\epsilon$.

  **If we intend Cooperate:**
  *   Both C: $(1-\epsilon)^2 \rightarrow R$
  *   Me C, Them D: $(1-\epsilon)\epsilon \rightarrow S$
  *   Me D, Them C: $\epsilon(1-\epsilon) \rightarrow T$
  *   Both D: $\epsilon^2 \rightarrow P$
  $$E[C] = (1-\epsilon)^2 R + \epsilon(1-\epsilon)(S + T) + \epsilon^2 P$$

  **If we intend Defect:**
  *   Both D: $(1-\epsilon)^2 \rightarrow P$
  *   Me D, Them C: $(1-\epsilon)\epsilon \rightarrow T$
  *   Me C, Them D: $\epsilon(1-\epsilon) \rightarrow S$
  *   Both C: $\epsilon^2 \rightarrow R$
  $$E[D] = (1-\epsilon)^2 P + \epsilon(1-\epsilon)(T + S) + \epsilon^2 R$$

  **The Difference:**
  $$E[C] - E[D] = [(1-\epsilon)^2 - \epsilon^2]R - [(1-\epsilon)^2 - \epsilon^2]P + [\epsilon(1-\epsilon) - \epsilon(1-\epsilon)](S+T)$$
  The $(S+T)$ term cancels exactly.
  $$(1-\epsilon)^2 - \epsilon^2 = (1 - 2\epsilon + \epsilon^2) - \epsilon^2 = 1 - 2\epsilon$$
  $$E[C] - E[D] = (1 - 2\epsilon)(R - P)$$

  Since $R > P$ in a Prisoner's Dilemma, $E[C] > E[D]$ if and only if $1 - 2\epsilon > 0$, or **$\epsilon < 1/2$**.

  **Why this is interesting:**
  You noticed that $T$ (Temptation) and $S$ (Sucker) cancel. This is profound. It means that under symmetric execution noise, the risk of being exploited ($S$) is exactly balanced by the opportunity to exploit ($T$). The decision reduces entirely to: *Do I prefer the Reward or the Punishment?*
  Since the noise is symmetric, you cannot gain an advantage by defecting; you only risk turning an $R$ into a $P$ (via double noise) or turning a $P$ into an $R$ (via double noise). As long as you are more likely to execute correctly than incorrectly ($\epsilon < 0.5$), you should bet on the better symmetric outcome ($R$).

  ---

  ### Part 3: Execution Noise vs. Reasoning Noise

  This is the crux of your second question. *Is execution-level noise the right way to model near-copies?*

  **1. Execution Noise (Trembling Hand)**
  *   **Model:** We share the same source code (perfect logical correlation), but the physical output is noisy.
  *   **Status:** This preserves **subjunctive dependence**. My decision *still* logically constrains yours, because we are running the same function. The noise is applied *after* the logical link is established.
  *   **Result:** As you found, cooperation is robust up to $\epsilon = 0.5$. This is a very strong result. It suggests superrationality is stable against "twitchy fingers."

  **2. Reasoning Noise (Independent Rationality)**
  *   **Model:** There is a probability $\epsilon$ that I am a Superrationalist and $1-\epsilon$ that I am a CDT Defector (or vice versa), and this is determined independently for each of us.
  *   **Status:** This **breaks** subjunctive dependence.
  *   **Why:** If I am Superrational, I ask: "If I cooperate, what does the other do?"
      *   If the other's rationality type is independent of mine, then my decision provides *no information* about their decision procedure.
      *   If they are CDT (prob $\epsilon$), they defect regardless.
      *   If they are Superrational (prob $1-\epsilon$), they mirror me.
      *   Crucially, because the types are independent, I cannot treat their action as a function of *my* action. I must treat their action as a probability distribution fixed by their type.
  *   **Result:** The argument **unravels**.
      *   If I suspect there is *any* independent probability that the other player is a CDT defector, the logical link is severed. I am no longer playing against a mirror; I am playing against a mixed population.
      *   Against a mixed population where some fraction defects unconditionally, CDT (defect) often becomes dominant again, depending on the payoffs.
      *   Specifically, if the correlation of *types* is not high, the "magical" leverage disappears. You revert to standard expected utility maximization against a probabilistic opponent.

  **3. Reasoning Noise (Correlated Bugs)**
  *   **Model:** We are running the same code, but there is a probability $\epsilon$ that the code *itself* is buggy (e.g., it outputs Random).
  *   **Status:** This is effectively identical to **Execution Noise**.
  *   **Why:** If the bug is in the shared source code, then when the bug triggers, it triggers for both of us. The logical correlation remains.
  *   **Result:** Your $\epsilon < 1/2$ result holds.

  **Conclusion on Noise:**
  The superrationality argument is **fragile to independent type noise** but **robust to execution/correlated code noise**.
  This is why FDT proponents emphasize **logical correlation** over mere similarity. If there is an independent chance you are "not like me" in a way that breaks the logical link (i.e., you use a different decision theory), the superrational leverage vanishes. If the difference is just in the physical instantiation (execution noise), the leverage holds.

  ### Part 4: Does "Standard Game Theory is Wrong" Survive?

  Once you strip the wince-y parts:

  1.  **Standard Game Theory (CDT/Nash)** is not mathematically wrong. It correctly identifies the Nash Equilibrium for causal agents.
  2.  **Superrationality (FDT)** argues that in problems involving logical correlation (copies, predictions, Newcomblike problems), CDT is **dominated**. It leaves free utility on the table.
  3.  **The Verdict:** The claim "Standard game theory is wrong" survives **only if** you define "rationality" as "the algorithm that achieves the highest utility."
      *   If you define rationality as "causal dominance," CDT wins.
      *   If you define rationality as "winning," FDT/Superrationality wins in these specific contexts.

  Given your background, you likely subscribe to the "winning" definition. In that case, the blog post's conclusion is correct, even if its explanation of *causality* was sloppy.

  **Summary for your notes:**
  *   **Blog Post:** Sloppy on causality ("causes" vs "implies"), binary on similarity, but normatively correct on the outcome.
  *   **Your Math:** Correct. The cancellation of $T$ and $S$ is a known property of symmetric noise in logical correlation games.
  *   **Noise Model:** Execution noise preserves the argument ($\epsilon < 1/2$). Independent reasoning noise destroys it (reverts to standard PD).
  *   **Takeaway:** Superrationality requires **logical correlation**, not just similarity. Execution noise allows logical correlation; independent reasoning noise breaks it.

  You've essentially rediscovered the robustness conditions for Functional Decision Theory. The fact that $T$ and $S$ cancel is the mathematical reason why FDT proponents argue their theory is "stable" while CDT is "fragile" in the face of symmetric logical uncertainty.
