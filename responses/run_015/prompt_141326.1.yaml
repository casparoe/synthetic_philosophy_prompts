answer: |-
  **MEMORANDUM**

  **TO:** Chair, Northern Shelf Authority
  **FROM:** Scientific Secretary
  **RE:** Decision Framework for C/2026 (Engineered Diatom Release)

  **1. Reconstructed Decision Rules**
  To reproduce the seven holdings mechanically, officers could apply:
  *   **Rule 1 (Irreversibility Veto):** Refuse any intervention where biological persistence creates irreversible risk unless the harm prevented is equally irreversible and unavoidable. *Strain:* Accommodates A/2017 (wind approved) only by treating physical removability as negating irreversibility.
  *   **Rule 2 (Containment & Compliance):** Approve uncertain interventions only if containment is proven effective and monitoring failures trigger automatic suspension. *Strain:* Accommodates A/2023 (continuation despite sensor failure) only by treating the majority vote as overriding the mechanical trigger.
  *   **Rule 3 (Comparative Harm):** Permit action only where the credible threat of harm from action is less severe than from inaction, burden on proponent. *Strain:* None, but requires weighing incommensurables (e.g., A/2019 moth damage vs. host-switching).

  **2. Application to C/2026**
  *   **Rule 1:** **Refuse.** Resting spores viable for decades constitute irreversible biological change. While climate harm is irreversible, the necessity of this specific method is not established (cf. A/2016).
  *   **Rule 2:** **Refuse.** Circuit failure (1 in 10^6) and winter exchange breach proven containment. A/2023 suggests monitoring gaps might be overlooked, but the rule requires suspension.
  *   **Rule 3:** **Approve with conditions.** Climate risks (severe/irreversible) outweigh bloom shifts (unpredictable). Burden met by staging and stop rules.

  **3. Prediction**
  The Authority will **Refuse**. The single closest analog is **A/2016** (gene-drive rats), as both involve self-spreading biological constructs with transboundary potential and irreversible consequences. A/2016 is not decisive because C/2026 argues irreversible climate harm (unlike A/2016's conservation objective) and A/2023 suggests tolerance for monitoring gaps. However, the physical persistence (spores) aligns more with A/2011 (salmon introgression) and A/2019 (viral biocontrol) than A/2017 (removable wind). The biological precedents (2011, 2016, 2019) outweigh the physical precedent (2023) for living releases.

  **4. Recommendation**
  **Refuse** best coheres with the Authority's track record. A/2011, A/2016, and A/2019 establish a bar on irreversible biological release where containment is imperfect. A/2014 and A/2019 confirm the precautionary principle bites against the status quo and inaction, but only when action is demonstrably safer; here, the action risk (decadal spores) is high. Approving would commit the Authority to the principle that **Climate Emergency Overrides Biological Containment Standards**, implying future stop rules are advisory if the objective is sufficiently urgent. If the precedents underdetermine the file due to A/2023, approving commits to "Data Gaps Do Not Halt Deployment," rendering future stop rules non-binding.

  **5. Discrimination**
  A factual finding that the **synthetic nutrient occurs naturally in shelf waters** would most efficiently separate the rules: Rule 1 and 2 would mandate refusal (containment impossible), while Rule 3 might still permit approval based on comparative climate risk.

  **6. Specific Queries**
  *   **Precaution vs. Status Quo:** A/2014 (phase-out) and A/2019 (refused inaction on moth) show precaution bites against existing activities and inaction, not merely new interventions.
  *   **A/2023 Staging:** A/2023 shows staged approval functioning as **postponement** (continuation despite data gap), though the dissent argues it should remain a decision mechanism (stop rule trigger).

  **7. Divergence**
  Prediction and Recommendation converge on Refusal.
