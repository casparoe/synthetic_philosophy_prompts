answer: |-
  ### Q&A Prep Sheet: Hobbes's Geometric Method & *Leviathan*

  **Strategy Note:** Your audience is hostile to the math but invested in the politics. Your goal is to convince them that the math isn't about *calculating area*, it's about *constructing authority*. Do not defend Hobbes's calculations. Defend his ambition.

  ---

  #### 1. The Anachronism Charge (Most Damaging)
  **Objection:** "You're describing Hobbes's method using a post-logical-positivist framework of 'axiomatic systems.' But Hobbes's notion of *scientia* is causal, not formal. By framing his definitions as 'arbitrary stipulations' for a deductive system, aren't you smuggling a modern philosophy of language onto a 17th-century text that cares about causal generation, not semantic consistency?"

  **Reply (90s):** That's the central historiographical risk I'm trying to navigate. I'm not claiming Hobbes has a modern formal logic. When I say 'arbitrary,' I mean it in the specific Hobbesian sense of *voluntarism*: we cause the principles of geometry because we draw the lines; we cause the principles of politics because the Sovereign institutes the definitions of Justice and Property. The parallel isn't about symbolic logic; it's about *authorship*. In both geometry and the Commonwealth, certainty is only possible where humans are the creators of the premises. If I'm smuggling anything in, it's the emphasis on *construction* over *discovery*, which I think is textually grounded in his insistence that philosophy is knowledge of consequences from names we establish ourselves.

  **Where this is soft:** You're relying heavily on the equivocation of "cause." Causal generation of a circle is ontologically different than the Sovereign's command defining "theft." If they press on the ontological gap, you might wobble.

  #### 2. The Disanalogy of Definition
  **Objection:** "In geometry, I can define a triangle without harming anyone. In *Leviathan*, definitions of 'Right' and 'Liberty' track pre-existing passions and conflicts. You claim these are 'arbitrary' like geometric definitions, but doesn't that ignore the material reality of human nature that Hobbes says constrains the Sovereign? You can't just stipulate away human passion like you stipulate a radius."

  **Reply (90s):** I agree the *material* is different, but the *logical move* is identical. Hobbes argues that before the Commonwealth, moral terms are meaningless noise—there is no 'mine' or 'thine' in the state of nature. The Sovereign doesn't discover Justice; he *institutes* it by fixing the definition. That is a stipulative act, functionally identical to the geometer defining a line. The constraint of human passion is why we need the Sovereign, but the *science* of politics begins only after the Sovereign fixes the definitions. The geometry mirrors the *structure of the solution*, not the *material of the problem*.

  **Where this is soft:** Hobbes does say laws must align with natural law (self-preservation). If they argue that "self-preservation" is a non-arbitrary, pre-political definition that anchors everything, your "arbitrary stipulation" claim weakens.

  #### 3. The Independence Thesis
  **Objection:** "Even if you're right about the structural mirror, *Leviathan* is intelligible without *De Corpore*. Thousands read the political theory without knowing he tried to square the circle. So what? If the political argument stands on its own, isn't claiming this geometric structure is 'essential' just an academic exercise in systematizing a thinker who was often inconsistent?"

  **Reply (90s):** It matters because it explains *why* Hobbes thinks his political conclusions are demonstrable rather than merely persuasive. Without the geometric model, *Leviathan* looks like rhetoric or prudential advice. With it, Hobbes claims he is offering *proof*. If we ignore the method, we miss why he thinks dissent is not just wrong, but *irrational*. He isn't trying to convince you that monarchy is nice; he's trying to demonstrate that disobedience is a contradiction of the definitions you've authorized. The geometry explains his intolerance for disagreement.

  **Where this is soft:** You have to prove he actually achieves this demonstration. If they argue he fails to deduce specific policies from definitions, the "proof" claim looks hollow.

  #### 4. The "Wallis" Question (The One You Fear)
  **Objection:** "Let's be blunt: Wallis was right, and Hobbes was wrong. Hobbes couldn't square the circle. He was mathematically incompetent. Why should we base our interpretation of his epistemology on a method he couldn't even execute correctly? Isn't this just romanticizing a mathematical loser?"

  **Reply (90s):** I concede immediately: Hobbes was wrong about the quadrature. He was a terrible calculator and a worse competitor. But my claim isn't about the *truth value* of his geometric theorems; it's about the *normative role* of the geometric method in his head. He believed geometry was the only true science *because* of the method, not because he successfully solved every problem. A bad geometer can still correctly identify what makes geometry unique. We don't dismiss Descartes's metaphysics because his physics of vortices was wrong. We should treat Hobbes's math failures as biographical embarrassments, not philosophical refutations of his methodological ambition.

  **Where this is soft:** It's hard to separate the man from the method when the man was so publicly humiliated for the method. Some will see this as making excuses for incompetence.

  #### 5. The Normative Gap
  **Objection:** "Geometry deals with what necessarily follows from a definition. Politics deals with what ought to be done. How does a geometric deduction get you from 'This is the definition of Sovereignty' to 'You ought to obey'? You haven't bridged the is-ought gap, you've just drawn a triangle over it."

  **Reply (90s):** Hobbes bridges that gap through the concept of *authorization*. In geometry, if you define a circle, you must accept the properties of a circle. In politics, if you authorize the Sovereign (which is the foundational 'definition' of the Commonwealth), you must accept the properties of Sovereignty, which includes obedience. The 'ought' is hypothetical: *If* you want peace (which you necessarily do, by nature), *then* you must accept these definitions. The deduction is instrumental, not moral in the traditional sense. The geometric form captures that instrumental necessity.

  **Where this is soft:** This relies on the "Hypothetical Imperative" reading of Hobbes. If your audience are moral realists or Kantians, they will reject the idea that "wanting peace" generates a binding obligation.

  #### 6. Rhetoric vs. Demonstration
  **Objection:** "Isn't the geometric language just rhetorical dressing? Hobbes was writing for a civil war audience. He uses the *style* of geometry to lend authority to what are actually just persuasive political arguments. You're taking the marketing seriously."

  **Reply (90s):** It's possible he used it rhetorically, but he spent decades defending it against actual mathematicians. If it were just dressing, he would have dropped it when Wallis attacked him. Instead, he doubled down. He genuinely believed that civil war was caused by the abuse of language, and that fixing definitions was the only cure. The geometric style isn't just marketing; it's the therapeutic intervention. He's trying to force political language to behave like mathematical language to stop the fighting.

  **Where this is soft:** You can't prove his internal psychological state. A skeptic can always say, "He was just stubborn," and you can't prove he wasn't.

  ---

  ### Upfront Concession Strategy

  **Do this in your opening or first transition:**
  "I want to be clear at the outset: I am not arguing Hobbes was a good mathematician. He wasn't. His proofs in *De Corpore* are often flawed, and Wallis demolished him on the technical details. I am not asking you to rehabilitate Hobbes the geometer. I am asking you to take seriously Hobbes the *methodologist*. Even a broken clock is right about what time it *should* be, and even a bad geometer can have a profound insight into why geometry commands assent while politics breeds war."

  **Why this works:** It disarms the "Wallis" objection before it can be weaponized. It signals to the political philosophers that you aren't going to bore them with math defenses, and it signals to the historians that you aren't ignorant of the historical record.
