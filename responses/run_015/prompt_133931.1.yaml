      *   (4) Symmetry of trivial causes (The "Nail" is no different from the "Sneeze").
      *   (5) Adequate explanation requires citing *all* causes (or at least, not arbitrarily selecting).
      *   (6) Historians select arbitrarily (no distinction between cited and ignored).
      *   (7) Conclusion: No historical explanation is adequate.
      *   (8) Observation: Some explanations *are* good. *Keep.*

  3.  **Identify the Weak Link:**
      *   The argument is a *reductio ad absurdum* of a specific conjunction of views: Chaos + Counterfactual Causation + Completeness Requirement for Explanation.
      *   Since (1) and (8) must be kept, the break must happen between (2) and (7).
      *   Step (5) is the most vulnerable. It claims: "An adequate causal explanation of H must cite H's causes; citing an arbitrary proper subset of them is not explanation but selection."
      *   This is a very strong, arguably false, view of explanation. Explanation is typically pragmatic and interest-relative. We don't list *all* causes; we list the *relevant* ones.
      *   Step (4) is also vulnerable. It claims all difference-makers are *equally* causes. While they might all be *a* cause, they aren't equally *explanatorily relevant*.
