          *   What about the nail? At the grain of "Lost the Battle," the nail is a cause. At the grain of "Lost the War," the nail might not be robust (the battle might have been won anyway, or the war didn't hinge on that battle). The "nail" story works because it links a trivial cause to a *specific* chain of events, but historians usually care about structural causes that are robust across many perturbations (the "sneeze" doesn't change the war, the "supply line" does).
          *   Legitimate grains: There isn't one "True" grain. There are grains appropriate to specific explanatory interests.

  5.  **Drafting the Response:**

      *   **Rejection:** Step (5).
      *   **Cost:** We abandon the idea that explanation is an ontological mirror of causal structure. Explanation becomes pragmatic/interest-relative.
      *   **Adjudication 1 (Grain):** Grain-relativity is load-bearing. It's the escape hatch. Chaos destroys robustness at *fine* grains, but history operates at *coarse* grains.
      *   **Adjudication 2 (Too Much):** Yes, it proves too much for non-chaotic systems if $H$ is micro-specified. This confirms the error is in the expectation of micro-explanation (Step 5), not in chaos theory.
      *   **Adjudication 3 (Difference-Making):** We keep difference-making but relativize to grain/context. Justification is pragmatic (stability/proportionality). The nail is a cause of the *loss of the battle*, but maybe not the *loss of the kingdom* (if robustness is low there).
