  8.  **Wait, one nuance on Step (4).**
      *   Step (4) says "Nothing in (1)-(3) privileges one small event over another... So every such event... is equally a cause."
      *   Some might argue we should reject (4) instead. We can say "Yes, they are all difference-makers, but not all are *causes* in the sense that matters for explanation." But (3) defines cause as difference-maker. So if we keep (3), we must accept they are all causes.
