answer: |-
  Reject **Step (5)**.

  **The Cost:**
  Rejecting (5) costs you the idea that causal explanation is an ontological inventory. You must accept that explanation is inherently pragmatic, interest-relative, and selective. An explanation is not a mirror of the causal structure; it is a tool for answering specific questions. You abandon the hope of a "God's-eye" complete history in favor of histories that are adequate relative to human cognitive limits and specific explanatory interests (e.g., "Why did the West win?" vs. "Why did Private Jones die?").

  **Adjudication of the Three Points:**

  **1. Is grain-relativity load-bearing or a distraction?**
  It is **load-bearing**. The argument relies on the slide from "H is a large historical outcome" to "replay-robustness falls toward zero as the description gets finer." This slide is the engine of the *reductio*. If grain-relativity were a distraction, chaos would destroy robustness at *all* levels of description. But it does not.
  In chaotic systems, robustness is high at coarse grains (e.g., "The army retreats") even when it is zero at fine grains (e.g., "The army retreats at 14:02:03 via sector 7"). Historians survive because they operate at the coarse grain where the signal persists despite the noise. The "nail" story is compelling precisely because it highlights a rare case where a trivial cause pierces the usual robustness of a coarse outcome. Rejecting (5) allows us to say historians select the grain where robustness is sufficient for their purposes, rendering the chaotic dissolution of micro-robustness irrelevant to the adequacy of macro-explanations.

  **2. Does the argument prove too much (non-chaotic systems)?**
  **Yes.** If you describe the outcome $H$ finely enough (e.g., the exact microstate of the universe at $t_2$), then in *any* deterministic system (chaotic or not), a change in initial conditions at $t_1$ yields a different $H$. If Step (5) were true, no explanation would be adequate even in a clockwork universe, provided the outcome description was precise.
  This confirms that the fault lies not in Chaos (Step 1) but in the demand for completeness relative to a fine grain (Step 5). The argument conflates *causal dependence* (which is ubiquitous in determinism) with *explanatory relevance* (which requires stability across a range of conditions). Recognizing this forces us to locate the error in the bridge between causation and explanation (Step 5), rather than in the nature of the system (Step 1).

  **3. Difference-making, grain, and the nail.**
  Rejecting (5) does **not** force us to abandon difference-making accounts of causation (Step 3). It forces us to **relativize** them to a grain.
  *   **Entitlement to the grain:** We are entitled to the grain we choose by the criterion of **proportionality** (cf. Stephen Yablo). A cause is explanatory if it is specific enough to produce the effect but general enough to be robust against irrelevant variations. The "nail" is a proportional cause of "losing the battle" (fine grain) but often not of "losing the kingdom" (coarse grain), because the kingdom might have been lost anyway due to structural factors.
  *   **Legitimate grains:** There is no single "True" grain. There are only grains appropriate to specific inquiries. If a historian asks "Why did the battle turn at 14:00?", the nail is a legitimate cause. If they ask "Why did the empire fall?", the nail is noise.
  *   **The Nail:** The nail remains a difference-maker. But Step (5)'s rejection allows us to say that citing it is only an *adequate explanation* if the inquiry matches its grain. If the inquiry is structural, citing the nail is not "false," it is "misaligned."

  **Confidence:**
  I am **85% confident** in this diagnosis. It aligns with the standard pragmatic turn in the philosophy of history and science (van Fraassen, Lewis, Woodward), which resolves similar paradoxes by separating ontology from explanation.

  **Least Sure Claim:**
  I am least sure of the claim that **"Pragmatic interests are sufficient to stabilize grain selection without circularity."** While pragmatics solves the *possibility* of explanation, it risks making explanatory adequacy too subjective; determining *which* pragmatic interests are legitimate often presupposes the very causal structures we are trying to isolate, potentially reintroducing a version of the selection problem at a higher level.
