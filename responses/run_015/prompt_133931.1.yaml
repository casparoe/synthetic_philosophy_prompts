  7.  **Final Polish of the Plan:**
      *   **Reject:** Step (5).
      *   **Cost:** Explanation is not objective/complete; it is selective/pragmatic.
      *   **Grain:** It is load-bearing. Chaos kills fine-grain robustness; history survives on coarse-grain robustness.
      *   **Too Much:** Yes, applies to non-chaotic if fine-grained. Confirms the issue is grain/expectation, not chaos.
      *   **Difference-Making:** Relativized. Justified by stability/interest. The nail is a cause at one grain, noise at another.
      *   **Confidence:** 85%.
