      *   *Thesis 4: The Du Boisian Filter Claim (The "Beauty and Truth" Constraint).* Art *must* be propaganda, *but* to be Art, it must also be Beautiful/True. Propaganda without beauty is not Art.
          *   *Type:* Normative/Conditional.
          *   *Truth:* Internally consistent but risks tautology.
          *   *Classmate:* Complicates collapsing (aesthetic quality still matters as a gatekeeper).
          *   *Poet:* Strong support (must be *effective* propaganda, i.e., beautiful).

  4.  **Address the Complications:**

      *   *(i) Pejorative vs. Neutral:* If neutral (persuasion), the claim is weaker. If pejorative (manipulation), it's an accusation. Du Bois seems to reclaim the term (neutral/positive).
      *   *(ii) Beauty-and-Truth:* This is crucial. Du Bois definitely argues art must be beautiful. If propaganda fails aesthetically, it's not art. This creates a tension: "All Art is Propaganda" + "Not all Propaganda is Art."
      *   *(iii) Symmetry:* "All art is propaganda" is symmetrical. "Therefore make *liberation* propaganda" requires a normative leap (Justice requires counter-propaganda).

  5.  **Test Hard Cases:**

      *   *String Quartet:* Thesis 1 (Yes, expresses mood/order), Thesis 2 (Yes, serves bourgeois concert hall), Thesis 3 (No, unless composer intended message).
      *   *Landscape:* Similar to quartet.
      *   *Evil Cause Novel:* Thesis 1 & 2 (Yes), Thesis 4 (Maybe not Art if not "True").
      *   *Private Poem:* Thesis 3 (No intent), Thesis 2 (Maybe, if published later).
      *   *False Empirical Film:* Thesis 4 (Not Art if not "True").

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Academic, precise, analytical.
      *   *Epistemic Check:* I need to be careful not to claim I know exactly what Du Bois *meant* internally, but rather what the text *says* or implies logically. I must flag the "beauty and truth" memory as requiring verification against the 1926 text.
      *   *Structure:*
          1.  Introduction (acknowledging the ambiguity).
          2.  The Menu (Numbered Theses).
          3.  Analysis of Complications (i, ii, iii).
          4.  Hard Case Testing.
          5.  Epistemic/Textual Notes (Settled vs. Contested).

  7.  **Refining the Theses for the User's Specific Needs:**

      *   The user wants to know if the classmate and poet are justified.
      *   *Classmate:* Needs the "Aesthetic/Political Collapse." This works best with Thesis 2 (Functional) or Thesis 1 (Semantic).
      *   *Poet:* Needs the "Normative Obligation." This works best with Thesis 3 (Intentional) or Thesis 4 (Du Boisian Normative).
      *   *Crucial Distinction:* The move from "Is" to "Ought." The poet needs an "Ought." The sentence "All art is propaganda" is an "Is." The poet needs "All art is propaganda, therefore you *ought* to make *good* propaganda."

  8.  **Final Review against Constraints:**

      *   *Did I cite sources?* No.
      *   *Did I claim internal meaning?* No, focused on logical assertion.
      *   *Did I flag uncertainty?* Yes, specifically on the "beauty and truth" wording.
      *   *Did I cover the three axes?* Yes, embedded in the theses.
      *   *Did I cover the three complications?* Yes.
      *   *Did I cover the hard cases?* Yes.
      *   *Is it a menu?* Yes.

  9.  **Self-Correction on Du Bois's Text:**
      *   I recall the phrase "Thus all Art is propaganda and ever must be, despite the wailing of the purists."
      *   I also recall the argument that Art must appeal to emotion (Beauty) and align with Truth (sociological truth about Black life).
      *   *Correction:* I must explicitly state that the "Beauty and Truth" constraint is a reconstruction based on the user's recollection and general scholarship, flagging it as needing textual verification regarding whether it acts as a *definition* of Art or a *quality constraint* on Good Art.

  10. **Final Polish:** Ensure the distinction between "Settled" (the sentence exists, the context is the Harlem Renaissance/Civil Rights) and "Contested" (instrumentalism, consistency) is clear in the final section.

  *(Self-Correction during drafting)*: Make sure I don't validate the classmate's argument too easily. If "propaganda" is redefined to mean "any communication," the collapse is trivial. If it means "manipulation," the collapse is substantive but the term is pejorative. I need to highlight this tension.

  *(Refining the Poet's argument)*: The poet argues from "All art is propaganda" to "Black writers owe it to their audience." This is a non-sequitur without a premise about *which* propaganda is justified. I need to point out that Thesis 2 (Functional) supports this best because it implies neutrality is impossible, so one must choose sides.

  *(Refining the Hard Cases)*: Ensure I apply specific theses to specific cases, not just a general "yes/no."

  *(Final check on Epistemic markers)*: Use phrases like "Scholarly consensus holds," "Textual verification is required," "Logically entails," vs "Du Bois likely intended."

