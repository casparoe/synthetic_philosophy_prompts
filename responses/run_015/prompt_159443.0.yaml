          *   Address three complications: (i) Pejorative vs. Neutral connotation, (ii) The "beauty-and-truth" filter (does bad propaganda fail to be art?), (iii) Symmetry and uptake (does "all is propaganda" imply "make it *our* propaganda"?).
          *   Test against hard cases (string quartet, landscape, evil cause novel, private poem, false empirical film).
          *   **Epistemic Discipline:** Distinguish settled matters from contested ones. Flag uncertain recollections (especially regarding the 1926 essay's specific wording). Do not cite sources directly but describe what kind of sentence would settle textual questions.
          *   **Output Format:** Numbered list of distinct theses (a menu), followed by epistemic notes.

  2.  **Deconstruct the Claim ("All Art is Propaganda"):**

      *   *Propaganda:* Needs definition. Is it manipulation? Persuasion? Ideological reinforcement?
      *   *Art:* Needs definition. Is it high art? Any creative output?
      *   *Is:* Identity? Inclusion? Function?
      *   *Context:* Du Bois, 1926, "Criteria of Negro Art." The famous line is usually quoted as "all Art is propaganda and ever must be." The rider is "despite the wailing of the purists."

  3.  **Develop the Menu of Theses:**

      *   *Thesis 1: The Semantic/Representational Claim (Weak/Deflationary).* Art represents the world; representation implies a perspective; perspective implies advocacy.
