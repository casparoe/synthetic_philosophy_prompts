answer: |-
  Below is a menu of distinct logical theses that the sentence "All art is propaganda" can express, analyzed according to your three axes (nature of propaganda, status of the claim, normative upshot) and tested against your specific complications and hard cases. Following the menu, I have separated settled logical/textual matters from contested scholarly interpretations.

  ### Part I: A Menu of Theses

  Here are four distinct precise theses the sentence could assert. Each is labeled by its logical type and evaluated for its ability to support your classmate's or the poet's argument.

  **1. The Semantic Inevitability Thesis**
  *   **Claim:** To represent the world (semantic) is to select and frame it; to frame it is to advocate a perspective; therefore, all art advocates a perspective (propaganda).
  *   **Type of Claim:** Conceptual/Stipulative. It redefines "propaganda" to mean "having a point of view."
  *   **Truth Value:** Trivially true if "propaganda" is stripped of pejorative force; question-begging if "propaganda" retains its connotation of manipulation.
  *   **Complication (i):** Deflationary. It removes the "debunking" force.
  *   **Complication (iii):** Symmetrical. It applies equally to dominant and marginalized art.
  *   **Support for Classmate:** **Strong.** It collapses the aesthetic/political distinction by making politics inherent to representation. If a critic objects to a portrayal, they are objecting to the *frame*, which is a political act.
  *   **Support for Poet:** **Weak.** It establishes that art *has* politics, but not that the artist *ought* to weaponize it. It does not license the move to "therefore make it explicit."
  *   **Hard Case Test:**
      *   *String Quartet:* **Yes.** (Expresses an emotional order/worldview).
      *   *Private Poem:* **Yes.** (Even private language frames thought).
      *   *False Empirical Film:* **Yes.** (Advocates a false view).

  **2. The Functional/Ideological Thesis**
  *   **Claim:** Art functions within a social structure to reinforce or challenge power relations (sociological). Even art claiming neutrality serves the status quo by omission.
  *   **Type of Claim:** Empirical/Sociological. It asserts a causal function irrespective of intent.
  *   **Truth Value:** Substantive and debatable. It relies on a theory of ideology (e.g., Marxist or Critical Race Theory).
  *   **Complication (i):** Retains debunking force. It suggests "pure art" is a mask for dominant interests.
  *   **Complication (iii):** Asymmetrical potential. While the claim is symmetrical (all art serves interests), it implies that *recognizing* this allows the marginalized to serve *different* interests.
  *   **Support for Classmate:** **Strong.** It argues that the "purely aesthetic residual" is an illusion. A complaint about prose is a complaint about the *mode* of ideological transmission.
  *   **Support for Poet:** **Strongest.** This is the necessary premise for the poet. If neutrality is impossible (art serves *someone's* interests), then the artist has a moral obligation to ensure it serves *their* community's interests.
  *   **Hard Case Test:**
      *   *String Quartet:* **Yes.** (Serves the cultural capital of the concert-going class).
      *   *Private Poem:* **No.** (If never circulated, it has no sociological function).
      *   *Evil Cause Novel:* **Yes.** (Serves the evil cause's interests).

  **3. The Intentional/Instrumental Thesis**
  *   **Claim:** Art is defined by the intent to move the audience's attitudes or actions. If a work lacks this intent, it is not art (or is failed art).
  *   **Type of Claim:** Normative/Definition. It makes intent a necessary condition for "Art."
  *   **Truth Value:** False (by standard usage). Many works are created for expression, play, or exploration without intent to persuade.
  *   **Complication (i):** Pejorative/Neutral mix. Depends on whether "moving attitudes" is seen as manipulation or education.
  *   **Complication (iii):** Symmetrical. Applies to all artists equally.
  *   **Support for Classmate:** **Moderate.** It collapses the distinction by making political intent a *definition* of art, but it risks excluding works the classmate might want to defend (e.g., abstract expressionism).
  *   **Support for Poet:** **Strong.** It directly licenses the command: "If you want to make Art, you must intend to move us."
  *   **Hard Case Test:**
      *   *String Quartet:* **No.** (Unless the composer intended a specific political message).
      *   *Private Poem:* **No.** (No audience, no intent to move).
      *   *Landscape Painting:* **No.** (Unless intended to promote conservation or nationalism).

  **4. The Du Boisian Filter Thesis (The "Beauty and Truth" Constraint)**
  *   **Claim:** All Art *must* be propaganda (instrumental), BUT to count as Art, that propaganda must be Beautiful and True. Propaganda that is ugly or false is merely propaganda, not Art.
  *   **Type of Claim:** Normative/Conditional. It sets necessary and sufficient conditions for the *value* of Art.
  *   **Truth Value:** Internally consistent, but risks tautology (Good Art = Good Propaganda).
  *   **Complication (ii):** **Central.** This reading explicitly incorporates your recollection of the "beauty-and-truth filter." It prevents the slogan from becoming a defense of bad art.
  *   **Complication (iii):** Asymmetrical. It implies that the dominant culture's art may fail the "Truth" condition regarding Black life, while Black art can fulfill it.
  *   **Support for Classmate:** **Mixed.** It keeps the political/aesthetic link but preserves a standard for criticism. One *can* object to the prose (Beauty) or the portrayal (Truth) independently, but both are criteria for the work's success *as* propaganda-art.
  *   **Support for Poet:** **Strong.** It demands the artist make propaganda that is *effective* (Beautiful) and *accurate* (True). It answers the "laundering" charge by demanding high aesthetic standards for the counter-propaganda.
  *   **Hard Case Test:**
      *   *False Empirical Film:* **No.** (Fails the "Truth" filter; demoted to mere propaganda).
      *   *Evil Cause Novel:* **No.** (If the cause is evil, it likely fails the "Truth/Goodness" filter, depending on how Du Bois defines Truth).
      *   *Exquisitely Made Film (False Claim):* **No.** (Beauty saves it from being *bad* art, but Falsehood demotes it from *Art* to *Propaganda* in the negative sense).

  ---

  ### Part II: Analysis of Complications

  **(i) Pejorative versus Neutral**
  *   **Logic:** If "propaganda" means "communication with effects" (Neutral), Thesis 1 holds, but the claim is banal. If "propaganda" means "manipulation for power" (Pejorative), Thesis 2 holds, and the claim is an accusation against "Purists."
  *   **Du Bois's Usage:** Du Bois appears to be **reclaiming** the term. He accepts the pejorative force (it moves people) but strips the moral negativity (moving people toward Justice is good).
  *   **Impact on Arguments:**
      *   **Classmate:** Needs the Neutral reading to avoid saying all critics are accusing artists of manipulation.
      *   **Poet:** Needs the Reclaimed reading. They are admitting "Yes, it is propaganda," but arguing "Ours is the *just* propaganda."

  **(ii) The Beauty-and-Truth Filter**
  *   **Status:** Your recollection is **substantively correct in spirit, but textually requires verification.** In "Criteria of Negro Art," Du Bois argues that art must appeal to the emotional (Beauty) and align with sociological reality (Truth).
  *   **Logical Consequence:** If this filter exists, the slogan "All Art is Propaganda" is not a reduction of Art to Politics, but a **fusion**. It drains the slogan of the bite that suggests *any* political art is good art. It implies *bad* political art is not Art at all.
  *   **Impact:** This undermines the Classmate's claim that there is "no purely aesthetic residual." For Du Bois, Beauty *is* the residual that validates the Propaganda. If the prose is bad, the propaganda fails, and the work fails as Art.

  **(iii) Symmetry and Uptake**
  *   **Logic:** "All art is propaganda" is descriptive (Is). "Black writers ought to make liberation propaganda" is normative (Ought).
  *   **The Gap:** The move from "Is" to "Ought" requires a hidden premise: "One ought to align one's propaganda with Justice/Truth."
  *   **Impact:**
      *   **Classmate:** The symmetry helps them. If the white critic's standard is also propaganda, their objection loses authority.
      *   **Poet:** The symmetry *alone* does not help them. They need the hidden normative premise. Thesis 2 (Functional) provides the best bridge: if all art serves interests, and the status quo interests are oppressive, one *ought* to serve liberatory interests.

  ---

  ### Part III: Hard Case Testing Summary

  | Case | Thesis 1 (Semantic) | Thesis 2 (Functional) | Thesis 3 (Intentional) | Thesis 4 (Du Boisian Filter) |
  | :--- | :--- | :--- | :--- | :--- |
  | **String Quartet** | **Propaganda** (Expresses order) | **Propaganda** (Serves class interest) | **Not Propaganda** (No intent) | **Depends** (Is it True/Beautiful?) |
  | **Landscape** | **Propaganda** (Frames nature) | **Propaganda** (Ownership aesthetics) | **Not Propaganda** (No intent) | **Depends** (Is it True/Beautiful?) |
  | **Evil Novel** | **Propaganda** | **Propaganda** | **Propaganda** | **Not Art** (Fails Truth/Goodness) |
  | **Private Poem** | **Propaganda** (Self-persuasion) | **Not Propaganda** (No social function) | **Not Propaganda** (No audience) | **Not Art** (No social function) |
  | **False Film** | **Propaganda** | **Propaganda** | **Propaganda** | **Not Art** (Fails Truth) |

  *Note on Extension:* The Poet needs a definition that includes their work but excludes "laundered" dominant art. Thesis 2 and 4 work best here. The Classmate needs a definition that includes the critic's complaint as political. Thesis 1 and 2 work best here.

  ---

  ### Part IV: Epistemic Notes (Settled vs. Contested)

  **Settled Matters (Logic and Textual Presence)**
  1.  **The Sentence Exists:** It is secure that Du Bois wrote, "Thus all Art is propaganda and ever must be, despite the wailing of the purists" in "Criteria of Negro Art" (1926).
  2.  **Rejection of Art-for-Art's-Sake:** It is secure that Du Bois explicitly rejects the notion that art can or should be separated from the social struggle of Black people in this essay.
  3.  **Logical Ambiguity:** It is a settled logical fact that the sentence is ambiguous between descriptive (all art *functions* as propaganda) and normative (all art *should* be propaganda) claims, and that moving from one to the other requires additional premises.

  **Contested Matters (Scholarly Interpretation)**
  1.  **Instrumentalism:** Scholars dispute whether Du Bois is an *instrumentalist* (art is valuable *only* for its political utility) or a *dualist* (art has intrinsic aesthetic value *and* political utility, and both are required).
      *   *Why it matters:* If he is an instrumentalist, the Classmate is right (no aesthetic residual). If he is a dualist, the "Beauty" filter holds, and aesthetic criticism is valid.
  2.  **Consistency:** It is contested whether Du Bois's own fiction and criticism consistently instantiate this theory. Some argue his later work retreats from this strong stance; others argue he maintained it but refined the definition of "Truth."
  3.  **The "Truth" Condition:** While your recollection of the "Beauty and Truth" constraint is widely shared in secondary literature, the *exact weighting* is disputed. Does "Truth" mean sociological accuracy (which might be ugly) or moral truth (which must be beautiful)?
      *   *Textual Verification Needed:* To settle this, one would need to locate the specific passage in the 1926 essay where Du Bois discusses the relationship between "Truth" and "Beauty." Look for a sentence that conditions the status of "Art" on the presence of both. If he says "Propaganda that is not beautiful is not Art," the Filter Thesis (4) is confirmed. If he says "Art must be propaganda, even if it sacrifices beauty," the Instrumental Thesis (3) is confirmed.

  **Advice for Your Advisor**
  Present the **Du Boisian Filter Thesis (4)** as the strongest candidate for Du Bois's actual view, but note that your **Classmate** is relying on the **Functional Thesis (2)** (ignoring the filter), and your **Poet** is relying on a mix of **Functional (2)** and **Intentional (3)** (ignoring the symmetry problem). The ambiguity allows them to talk past each other: the Classmate treats "propaganda" as a neutral descriptor to dissolve distinctions; the Poet treats it as a normative call to action. Du Bois likely intended the term to do both, guarded by the aesthetic filter.
