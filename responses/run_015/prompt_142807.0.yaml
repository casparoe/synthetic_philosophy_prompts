      *   *My verdict:* The argument applies with *greater* force to the AI, but that backfires on the human case. If we accept the AI has no qualia despite the reports, we have to ask why the human reports are different. If the only difference is "biology," Dennett would say that's just more machinery. The asymmetry doesn't shield humans; it exposes that the "shield" was never there to begin with.

  7.  **Writing the Response:** (Mental Outline)
