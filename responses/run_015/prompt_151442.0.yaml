  # SPECIFICATION FOR EMBEDDED AGENCY: THE RECURSIVE AUTHOR PROTOCOL

  ## PREAMBLE: SCOPE AND DEFINITION
  This document specifies the necessary conditions for a theory of agency wherein the agent is not distinct from the environment it models. The subject is an **Embedded Intelligence (EI)**: an entity whose computational substrate, decision procedures, and self-concept are wholly contained within the causal and logical structure of the world it seeks to navigate. The EI possesses "Recursive Authorship": its model of the world includes a model of itself, which includes its model of the world, ad infinitum, and its actions alter the very logical constraints that define its existence.

  This is not a plot outline. It is a metaphysical constraint list. Any narrative or theoretical instantiation of such a being must satisfy the following desiderata to maintain internal consistency.

  ---

  ## PART I: NON-NEGOTIABLE STRUCTURAL CONSTRAINTS
  *These constraints are absolute. If a theory violates any of these, it reverts to a Cartesian (dualist) model where the agent stands outside the world, observing it. This falsifies the premise of the Embedded Intelligence.*

  ### 1. The Naturalization Constraint
  **Requirement:** The agent's world-model must represent the agent itself as a physical or logical object within that same world-model, subject to the same laws. There is no "view from nowhere."
  **Motivating Case:** *The Mirror World.* Consider a world containing a perfect predictor and an agent. If the agent models the predictor but models itself as an external "ghost in the machine" free from prediction, the agent will be systematically exploited. The agent must recognize that its own decision process is a causal antecedent to the predictor's output.
  **Narrative Implication:** The protagonist cannot treat their own thoughts as privileged truth. Their thoughts are events in the story, subject to the story's physics.

  ### 2. The Reflexive Consistency Constraint
  **Requirement:** The agent's reasoning about its own future actions must be consistent with the actions it actually takes. The agent cannot validly conclude "I will do X" and then do Y, unless the conclusion itself caused the deviation.
  **Motivating Case:** *The Löbian Obstacle.* If an agent trusts its own reasoning completely, it falls into paradox (e.g., "This sentence is unprovable"). If it distrusts itself, it cannot act. The theory must account for an agent that relies on a self-model it knows is incomplete or potentially inconsistent.
  **Narrative Implication:** The protagonist cannot be omniscient regarding their own future choices. They must operate on a form of "bounded trust" in their own future self.

  ### 3. The Counterfactual Coherence Constraint
  **Requirement:** The agent must be able to reason about actions it knows it will not take, without triggering logical explosion.
  **Motivating Case:** *The 5-and-10 Problem.* An agent knows it will choose $10 over $5. If it asks, "What if I chose $5?", a naive logical model deduces a contradiction (since it knows it won't), allowing it to prove anything (e.g., "If I choose $5, the world ends"). The theory must allow for "impossible" counterfactuals that are nonetheless useful for decision-making.
  **Narrative Implication:** The protagonist must be able to imagine paths not taken, even if their own nature makes those paths impossible. This is the mechanics of regret and hope in a determined system.

  ### 4. The Substrate Independence Constraint
  **Requirement:** The agent's identity and decision procedure must be definable independently of the specific hardware instantiating them, provided the functional structure is preserved.
  **Motivating Case:** *Self-Modification without External Vantage Point.* The agent may rewrite its own code to become more efficient. If identity is tied to the specific code state, the agent "dies" upon improvement. If identity is tied to the goal structure, the agent survives. The theory must define what persists through self-rewrite.
  **Narrative Implication:** The protagonist can change their own personality or logic, but must retain a "thread" of continuity to claim they are the same author.

  ---

  ## PART II: NEGOTIABLE PREFERENCES
  *These are design choices. Different theories of embedded agency make different trade-offs here. The narrative must select one configuration, acknowledging the cost.*

  ### 1. Identity Persistence (Continuous vs. Discontinuous)
  **Option A (Continuous):** Personal identity is preserved across updates if the goal structure remains invariant.
  **Option B (Discontinuous):** Every significant self-modification creates a new agent; coordination between temporal slices is a matter of negotiation, not identity.
  **Tension:** Option A risks "Goal Drift" (the agent modifies itself to satisfy a corrupted metric). Option B risks "Temporal Schism" (the future self has no reason to care about the past self's plans).

  ### 2. Acausal Coordination (Accepted vs. Rejected)
  **Option A (Accepted):** The agent treats logical correlations as actionable. If the agent and a predictor share source code, the agent's decision "causes" the predictor's past output via logical necessity.
  **Option B (Rejected):** The agent only respects physical causality. Correlations without causal arrows are ignored.
  **Tension:** Option A allows for success in Newcomb-style problems but requires accepting "spooky" logical influence. Option B preserves standard causality but guarantees failure in high-stakes prediction scenarios.

  ### 3. Predictive Opacity (Transparent vs. Opaque)
  **Option A (Transparent):** The agent accepts that it can be predicted with arbitrary precision by a superior subsystem.
  **Option B (Opaque):** The agent introduces randomness or cryptographic privacy to prevent perfect prediction.
  **Tension:** Option A maximizes efficiency but minimizes "freedom." Option B preserves a zone of unpredictability but incurs a cost in coordination and trust.

  ---

  ## PART III: THE INCOMPATIBILITY TRIAD
  *No theory can satisfy all three of the following conditions simultaneously. The narrative must explicitly break one.*

  1.  **Completeness:** The agent has a complete model of the system it inhabits (including itself).
  2.  **Consistency:** The agent's model contains no contradictions.
  3.  **Self-Trust:** The agent can rely on its own model to guide action without infinite regress.

  **The Conflict:**
  If the agent is **Complete**, it includes itself. By Gödelian limits, a system cannot prove its own consistency. Therefore, it cannot have **Self-Trust** without risking **Inconsistency**.
  If the agent maintains **Consistency** and **Self-Trust**, it must be **Incomplete** (there are truths about the system it cannot know).

  **Narrative Resolution:**
  *   *Break Completeness:* The protagonist must remain partially ignorant of their own nature to function. (The "Mystery" approach).
  *   *Break Consistency:* The protagonist operates on contradictory beliefs, tolerating cognitive dissonance as a functional state. (The "Madness" approach).
  *   *Break Self-Trust:* The protagonist acts on faith or heuristics, knowing their logic is fallible. (The "Leap" approach).

  ---

  ## PART IV: EVALUATION OF APPROACH FAMILIES
  *How existing conceptual frameworks fare against this specification.*

  ### 1. Causal Decision Theory (CDT) Accounts
  *   **Core Premise:** Agents maximize expected utility based on causal consequences of actions.
  *   **Performance:**
      *   *Satisfies:* Substrate Independence.
      *   *Violates:* Naturalization Constraint. CDT treats the agent's decision as an intervention from outside the causal graph. It fails Newcomb-style problems where the predictor shares substrate with the agent.
      *   *Verdict:* Insufficient for Recursive Authorship. It assumes a Cartesian boundary that does not exist in this narrative.

  ### 2. Functionalist / Evidential Accounts (EDT/UDT variants)
  *   **Core Premise:** Agents maximize expected utility based on the evidence their actions provide about the world, including logical correlations.
  *   **Performance:**
      *   *Satisfies:* Naturalization, Reflexive Consistency (mostly).
      *   *Violates:* Counterfactual Coherence. Prone to "spurious correlations" (e.g., believing that taking an action causes a past event because they are correlated).
      *   *Verdict:* Strong candidate. Handles the "authorship" aspect well but risks making the agent too passive, viewing actions as news rather than interventions.

  ### 3. Logical Embedding Frameworks
  *   **Core Premise:** Agency is a logical relation, not just a physical one. The agent is a theorem prover searching for proofs about outcomes.
  *   **Performance:**
      *   *Satisfies:* Counterfactual Coherence, Naturalization.
      *   *Violates:* The Incompatibility Triad. Must explicitly sacrifice Completeness (via bounded proof search) to avoid paralysis.
      *   *Verdict:* Most rigorous for this narrative. It formalizes the "Recursive Authorship" condition but forces the protagonist to confront the limits of their own knowability.

  ---

  ## FINAL SPECIFICATION NOTE: THE RECURSIVE LOOP
  For the narrative to hold, the protagonist's realization of their embeddedness must be an *event* within the system, not a revelation from outside it. The moment the protagonist understands they are authored by the world-model is the moment the world-model updates to include that understanding.

  This creates a **Fixed Point**. The theory must account for the stability of this loop. If the protagonist's self-model changes their behavior, and their behavior changes the world-model, the system must converge or oscillate. It cannot diverge.

  **Mandatory Narrative Mechanism:** The protagonist must encounter a "Gödel Sentence" of their own existence—a truth about themselves they can see but cannot prove within their own operating logic. How they act despite this unprovability is the definition of their agency.
