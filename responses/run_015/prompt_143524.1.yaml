  ### The Stance: Stability is a Red Flag, Not a Green Light

  You asked me to take a side on the "Stability vs. Manufacture" debate. I side with you. **Stable verdicts across audiences are often a sign of successful rhetorical engineering, not logical necessity.**

  If a scenario produces a confident, stable intuition, the default assumption of this procedure is that the author has successfully aligned the "off-stage variables" (tone, vividness, genre cues) to trigger a specific heuristic, rather than isolating the conceptual variable at stake. Stability is data, but it is data that requires an explanation. If the explanation is "the logic compels it," the case passes. If the explanation is "the imagery compels it," the case fails. This stance dictates that the checklist treats consensus as a *trigger for investigation*, not a pass condition.

  ***

  ### The Procedure: The 20-Minute Scenario Stress Test (SST)

  **Operator:** Second-year grad student (no philosophy training required).
  **Time:** 20 Minutes hard stop.
  **Goal:** Produce one sentence for a referee report.

  **Instructions:** Read the scenario and the author's stated conclusion. Run the five steps in order. If a step triggers a **STOP**, you do not proceed to the next step. You move directly to the Verdict Formulation.

  #### Step 1: The Deletion Test (Load-Bearing Check)
  *   **Action:** Mentally remove the scenario from the paper. Replace it with a sentence saying, "Consider a standard case of X."
  *   **Question:** Does the argument collapse, or does the paper stand on its theoretical claims alone?
  *   **Pass Condition:** The argument collapses or loses its primary support. (The case is *Load-Bearing*).
  *   **Fail Condition:** The paper stands unchanged. (The case is *Decorative*).
  *   **STOP Rule:** If **Decorative**, STOP. Verdict: "The scenario is decorative and does not require evaluation."
  *   **Judgment Call:** Distinguishing "illustration" from "evidence." If unsure, treat as Load-Bearing.

  #### Step 2: The Mannequin Scan (Specification Check)
  *   **Action:** Highlight every noun and verb in the scenario description.
  *   **Question:** Are there key elements left vague that would change the outcome if specified? (e.g., "a person," "a system," "immediately," "knows").
  *   **Pass Condition:** Key variables are defined, or the vagueness is explicitly stated as irrelevant.
  *   **Fail Condition:** Readers must fill in gaps using genre conventions (sci-fi, legal, medical) to get the verdict.
  *   **STOP Rule:** If **Fail**, STOP. Verdict: "The scenario is under-specified (Mannequin Problem)."
  *   **Judgment Call:** Is the vagueness *strategic* (allowing generalization) or *sloppy* (hiding assumptions)? Assume sloppy unless the author defends the vagueness.

  #### Step 3: The Variable Audit (Off-Stage Variables)
  *   **Action:** Compare the target scenario to the "control" scenario (the one it's being compared against, e.g., Switch vs. Bridge). List every difference between them.
  *   **Question:** Is the author claiming *one* difference matters (the target variable), while ignoring others (distance, personal force, named vs. unnamed)?
  *   **Pass Condition:** The author acknowledges the extra differences and argues why they are irrelevant, or the scenario is designed to isolate the target variable.
  *   **Fail Condition:** There are unacknowledged differences that intuitively drive the verdict (e.g., "pushing" vs. "flipping").
  *   **STOP Rule:** If **Fail**, STOP. Verdict: "The scenario confounds the target variable with off-stage variables."
  *   **Judgment Call:** Determining which variables are "morally/Conceptually relevant." Rely on the author's definition; if they ignore a glaring one, flag it.

  #### Step 4: The Reality Check (Calibration Failure)
  *   **Action:** Identify the empirical stipulations (e.g., "the predictor is 100% accurate," "the upload preserves psychology").
  *   **Question:** Does the stipulation ask the reader to ignore a real-world regularity that is *constitutive* of the concept being tested? (e.g., Testing "promising" while stipulating away "memory" or "intent").
  *   **Pass Condition:** The stipulation is necessary for the thought experiment and doesn't remove the core mechanism of the concept.
  *   **Fail Condition:** The stipulation removes the very thing that makes the concept work in the real world (e.g., testing "survival" by stipulating away psychological continuity).
  *   **STOP Rule:** If **Fail**, STOP. Verdict: "The scenario suffers from calibration failure; it stipulates away the phenomenon it claims to test."
  *   **Judgment Call:** Is the regularity "constitutive" or "accidental"? (e.g., Is memory essential to promising, or just usually present?) This is a theoretical judgment.

  #### Step 5: The Intuition Trace (Borrowed Intuition)
  *   **Action:** Ask yourself: "What is the source of my gut reaction?"
  *   **Question:** Are you judging the *target* case, or a nearby, more familiar case? (e.g., Judging "AI promising" by reacting to "Human lying").
  *   **Pass Condition:** The intuition tracks the specific conceptual claim of the paper.
  *   **Fail Condition:** The intuition tracks a proxy case (e.g., moral outrage at the *author* for suggesting the case, or sympathy for the *victim* in the story).
  *   **STOP Rule:** If **Fail**, STOP. Verdict: "The scenario relies on borrowed intuition from a proxy case."
  *   **Judgment Call:** This is the hardest step. It requires introspection. If you feel strong emotion, flag it.

  ***

  ### Verdict Formulation
  *If you completed all steps without stopping:*
  "The scenario is load-bearing, well-specified, isolates the target variable, avoids calibration failure, and elicits the intended intuition without borrowing from proxy cases."

  *If you stopped at Step X:*
  "The scenario is [Load-Bearing/Decorative], but fails at Step X due to [Specific Failure Mode], rendering it [unable to support the conclusion/misleading]."

  ***

  ### Running the SST on Three Cases

  #### Case 1: The Footbridge Variant (Vivid/Classic)
  *   **Paper Claim:** There is no morally relevant difference between pushing a man and flipping a switch; the harming/allowing distinction is an illusion.
  *   **Step 1 (Deletion):** **Load-Bearing.** Without the bridge case, the argument against the distinction has no intuitive anchor.
  *   **Step 2 (Mannequin):** **Pass.** "Large man," "Bridge," "Trolley" are specific enough.
  *   **Step 3 (Variable Audit):** **FAIL.**
      *   *Analysis:* The comparison is Switch (distant, impersonal) vs. Bridge (personal force, direct contact). The author claims the *only* relevant variable is "killing vs. letting die." But "personal force" is an off-stage variable that is not varied in the control case. The author does not argue why personal force is irrelevant; they treat it as noise.
      *   *STOP.*
  *   **Verdict:** "The scenario is load-bearing, but fails the Variable Audit by confounding the target distinction with unacknowledged off-stage variables (personal force), making it unable to support the conclusion that the distinction is an illusion."
  *   **User Reaction:** You will likely **like** this. It confirms your suspicion that vivid cases often hide variables.

  #### Case 2: The Chinese Room (Classic/Phil of Mind)
  *   **Paper Claim:** A system running a program doesn't understand anything; hence current AI doesn't understand.
  *   **Step 1 (Deletion):** **Load-Bearing.** The room *is* the argument.
  *   **Step 2 (Mannequin):** **Pass.** "Rulebook," "Symbols," "Room" are clear.
  *   **Step 3 (Variable Audit):** **Pass.** The isolation of "syntax manipulation" is the point.
  *   **Step 4 (Reality Check):** **FAIL.**
      *   *Analysis:* The scenario stipulates a *human* doing the manipulation to generate the intuition that "the man doesn't understand Chinese." But the target claim is about the *system*. The calibration relies on the empirical regularity that "humans inside a system don't make the system understand" (which is false; neurons don't understand English, but brains do). It asks us to ignore how systems gain properties their parts lack.
      *   *STOP.*
  *   **Verdict:** "The scenario suffers from calibration failure; it relies on intuitions about the operator to draw conclusions about the system, stipulating away the emergent properties it claims to test."
  *   **User Reaction:** You will likely **like** this. It's a standard, robust critique.

  #### Case 3: The AI Promise (Exploratory/Current Referee)
  *   **Paper Claim:** No promise was made, since promising requires a persisting agent; so no existing AI system can promise.
  *   **Step 1 (Deletion):** **Load-Bearing.** The case is the evidence for the conceptual claim.
  *   **Step 2 (Mannequin):** **Pass.** "No memory," "Reset," "Medication" are specific.
  *   **Step 3 (Variable Audit):** **Pass.** The variable is "persistence."
  *   **Step 4 (Reality Check):** **Pass.** The stipulation (no memory) is the variable being tested.
  *   **Step 5 (Intuition Trace):** **FAIL.**
      *   *Analysis:* Why do we feel no promise was made? Because we are borrowing the intuition from *human* promising, which requires intent and moral agency. We are reacting to the *AI's inability to intend*, not the *structural definition of a promise*. The verdict is driven by "AI isn't a person" (proxy case), not "Promises require persistence" (target case). A chatbot *could* make a functional promise (a commitment device) without persistence, but the intuition is blocked by the "not a person" heuristic.
      *   *STOP.*
  *   **Verdict:** "The scenario relies on borrowed intuition; the verdict that 'no promise was made' is driven by the lack of moral agency (a proxy concern) rather than the lack of persistence (the target variable)."
  *   **User Reaction:** You will **not like** this.
      *   *Why:* You suspected the checklist would be "too harsh on exploratory papers." This result *is* harsh. It rejects a paper you are currently refereeing on a subtle philosophical distinction (Borrowed Intuition) that might feel like nitpicking in an interdisciplinary context. It confirms your fear that the tool is a hammer looking for nails. It forces you to reject (or demand major revision on) a paper that might be making a useful, if imperfect, point about AI reliability.

  ***

  ### Limitations: What the Procedure Cannot Do

  **1. Systematic Misfire: The "Novel Concept" Problem**
  The SST assumes concepts (like "promise" or "understanding") have stable real-world regularities that can be "calibrated." It will systematically misfire on papers trying to *redefine* or *expand* those concepts. If an author argues "Promising *doesn't* require persistence," Step 4 (Reality Check) will flag this as a Calibration Failure, because the tool treats the traditional definition as the "real world." The procedure is conservative; it protects existing concepts against revisionist thought experiments.

  **2. Gaming the System: The "Pre-emptive Defense"**
  A determined author can game Steps 3 and 5 by writing the scenario differently.
  *   **How:** Explicitly list the "off-stage variables" in the text and argue for their irrelevance *within the scenario description*. (e.g., "Note: The personal force here is irrelevant, focus only on the numbers.")
  *   **Result:** The checklist sees the variable as "acknowledged" (Step 3 Pass) and the intuition as "guided" (Step 5 Pass).
  *   **Weakness:** The procedure checks for *presence* of argument, not *quality*. An author can talk their way past the checklist by being verbose, even if their argument for irrelevance is weak. The 20-minute limit prevents the operator from deeply evaluating the *defense* of the variables, only their *acknowledgment*.

  **3. The "Vividness" Blind Spot**
  I sided with you that stability is suspect. However, the SST cannot fully quantify "manufactured consensus." A scenario can be vivid *and* logically sound. The procedure flags vividness as a risk (Step 5), but it cannot distinguish between "vividness that illuminates" and "vividness that manipulates" with 100% accuracy. It relies on the operator's introspection, which is the very thing the procedure is trying to scaffold. If the operator is charmed, the checklist may pass a manipulative case.

  **4. Interdisciplinary Friction**
  The procedure is built on philosophical standards of conceptual isolation. In cognitive science or AI safety, scenarios are often used to *generate* hypotheses, not test established concepts. The SST treats "exploratory fuzziness" as a "Mannequin Problem" (Step 2). It will systematically penalize papers that use scenarios heuristically rather than evidentially. You will need to override the "STOP" rule for papers explicitly framed as "hypothesis generation," or you will reject half your journal's submissions.
