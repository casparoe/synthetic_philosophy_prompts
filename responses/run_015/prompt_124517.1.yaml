  **Variant D (Fully coherent controller):** Candidates 1 (Acquisition) and 2 (Erasure) drop because unitary evolution involves neither wavefunction collapse nor irreversible logic gates. Candidate 3 (Bookkeeping) survives because quantum mutual information (entanglement) remains the conserved resource; if the record is fully uncomputed, the work is returned, proving the correlation was the temporary credit line.

  ### Final Verdict

  **Cleanest Test:** Variant D (Fully coherent controller).
