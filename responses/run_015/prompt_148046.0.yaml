answer: |-
  Good morning. Thank you for having me.

  Looking around this room, I feel a distinct sense of impostor syndrome. On one side, I see colleagues who have stood in the rooms where history was negotiated—in South Africa, in Argentina, in Rwanda. You handled the files, you heard the voices, you lived through the aftermath. On the other side, I see neighbors, teachers, and family members who are here because these questions haunt us all.

  And then there is me. I spent forty years in a lab measuring things that don't speak back—proteins, forces, decay rates. I came to philosophy late, mostly to make sense of what happens when the things you measure *do* speak back, and when speaking carries a price.

  I want to offer a framing for our time together that comes from that life in the lab, but applies to the work you have done in the field.

  In experimental science, we worry deeply about error. There is random error—noise—which we can average out. But there is also systematic error. This is when the instrument itself is calibrated in a way that consistently pushes the result in one direction. If your ruler shrinks when it gets hot, every measurement you take on a summer day is wrong, not by accident, but by design.

  I propose we think about amnesty not as missing data, but as a systematic calibration of the record.

  When we look at the archives of the TRC, or the CONADEP files, or the records of the gacaca courts, it is tempting to see the gaps as random holes. We think, "We didn't hear from this victim, or that perpetrator." But the reality is more specific. Every testimony we possess was given under a specific condition: the promise of no punishment.

  This is not a random gap. It is a directed bias. It means the archive is not a neutral collection of what happened. It is a collection of what could be said when safety was guaranteed.

  This creates a tension we must hold carefully today.

  First, we cannot claim this archive is complete. Because the truth offered was exchanged for immunity, there are certain shapes of truth that could not fit through that gate. Some perpetrators may have spoken only to the level required for amnesty, stopping short of full disclosure. Some victims may have stayed away, refusing a bargain that traded justice for words. The record is not a mirror of the past; it is a map of a specific negotiation.

  Second, we cannot claim that this process balances the moral books. Forgiveness is a profound human capacity, but it is not an equation that zeros out. The epistemic gain—the knowledge we gathered—does not cancel the moral debt. We should not leave this workshop thinking that because we know more, we owe less.

  However, and this is crucial, we must not dismiss what was learned. In physics, a measurement taken with a known bias is still valuable, provided we understand the bias. We don't throw away the data; we annotate it.

  The testimonies we have are real. The pain is real. The confessions are real. But they are conditioned. They tell us not only what happened, but what people were willing to say when the threat of prison was removed. That is a specific kind of truth. It is the truth of survival, the truth of a bargain struck between memory and future.

  My hope for this workshop is that we do not try to fix this bias, because it cannot be fixed. The past is immutable. Instead, I hope we learn to read the archive with our eyes open to its shape. We are here to understand the signal we have, without pretending it is the whole noise.

  To the practitioners here: you know better than anyone that the work was messy. To the community here: know that the history you are inheriting was shaped by difficult choices.

  Let us spend these days honoring the truth we have, without pretending it is the truth we wished for. Let us measure the weight of these words carefully, acknowledging the instrument we used to weigh them.

  Thank you.
