          *   *Fact Check:* This is accurate. Otto Neurath's ISOTYPE (International System of TYpographic Picture Education) principle specifically dictated that quantities should be represented by repeating symbols (iteration) rather than scaling them up. Scaling up creates ambiguity (linear vs. area scaling) and makes quick comparison harder. Counting identical units is clearer.
      *   *Claim 2:* "The status of the picture-language, on the other hand, was meant to be provisional: Neurath saw it as a first step toward a fully wordless language..."
          *   *Fact Check:* This is questionable/incorrect. Neurath did not aim for a *fully wordless* language. ISOTYPE was designed to complement text, not replace it entirely. It was a "visual language" but always intended to work alongside verbal language for education and social planning. The idea of a "fully wordless language" sounds more like a misunderstanding of his utopian visions or perhaps conflating him with someone else (like Carnap's ideal language, though even that wasn't purely pictorial). Neurath emphasized "wordless statistics" but not a completely wordless *language* in the sense of eliminating verbs/logic entirely.
      *   *Claim 3:* "...and only later, as a kind of concession, did it get described as a 'language-like technique' that merely goes along with words."
          *   *Fact Check:* This is also shaky. Neurath consistently viewed ISOTYPE as a supplement to verbal language, a "helping language" (Hilfssprache). He didn't really downgrade it from "future wordless language" to "concession." He was pragmatic. It was always a pedagogical tool.
      *   *Claim 4:* "That fits his anti-foundationalism — the ship that is rebuilt plank by plank at sea..."
          *   *Fact Check:* This is a famous Neurath metaphor (Neurath's Boat). It is correctly attributed and correctly explained in terms of anti-foundationalism (no fixed starting point, revising from within).
