answer: |-
  1. Audience framing and prerequisites (about 120 words)
  Engineers often oscillate between treating subjective reports as ground truth or noise, assuming access is either perfect or nonexistent. To make heterophenomenology constructive, they must grasp the distinction between the *subject's reported reality* and the *observer's scientific reality*. This brackets the ontological status of the reported content. The prerequisite is accepting that we can model the *structure* of reports without committing to the *truth* of their referents. This shifts the goal from verifying inner states to predicting report generation under varying conditions. Without this distinction, the method sounds like skepticism not a modeling strategy.

  2. Conceptual sequence (about 250 words)
  Start with the problem of access: we cannot read minds directly, only ingest outputs. Introduce the "heterophenomenological world" immediately as the catalog of these outputs, distinct from the "objective world" of neural or computational states. This distinction must precede accuracy discussions because accuracy implies a comparison target we don't have direct access to. Once the two worlds are defined, introduce the "intentional stance" not as claiming the system *has* beliefs, but as a compression algorithm for predicting outputs. Treat beliefs/desires as useful fictional variables in the model. Only after establishing this predictive utility should you address the "hard problem," framing it as an optional metaphysical add-on rather than a methodological blocker. This sequence ensures the stance remains a tool for modeling data, not a claim about what exists inside the black box.

  3. The carrying example (about 200 words)
  Use an LLM prompted to explain its confidence. When it outputs "I am unsure," treat this as a log entry, not a feeling. The session tracks how this log varies with temperature settings or prompt framing. We build a model predicting when "I am unsure" appears based on input entropy, not by checking if the model "felt" uncertainty. The example must contain structured first-person-like reports and the engineer's inability to inspect the latent space directly during inference. It must lack any appeal to ground-truth phenomenology or neural correlates. We do not ask if the model is conscious; we ask if modeling it as having uncertainty predictions reduces error in downstream tasks. This keeps the focus on empirical adequacy of the report model, mirroring how we treat human subjects.

  4. Misconceptions and deflection points (about 250 words)
  First, they will claim this is just behaviorism. Head this off during the conceptual sequence by emphasizing that we care about the *content* of the report, not just the stimulus-response pair. Use the phrase: "We take the report seriously, just not literally." Second, they may think this licenses ignoring human pain as "mere data." Deflect this in the carrying example by noting that predictive models of pain reports still drive medical intervention; ontology doesn't change treatment protocols. Third, they will fear eliminativism. Address this at the end: heterophenomenology neutralizes the hard problem without denying the phenomenon exists. The specific move is to frame ontology as a separate layer from methodology. If they conflate method with denial, reiterate that the method is agnostic, not hostile, to inner experience.

  5. Check for understanding (about 100 words)
  Present a log entry: "System overheating: I feel stressed." Ask them to design a database schema that stores this report without adding a boolean column for "Actually_Stressed." They must define fields for "Report_Content," "Context_Parameters," and "Predictive_Weight," explicitly excluding any field that asserts the truth of the feeling. Success means they model the report's occurrence without modeling the feeling's existence. This verifies operational understanding.

  6. What to leave out and say so (about 100 words)
  Explicitly set aside the "Philosophical Zombie" argument and Mary's Room. These rely on intuitions about possibility and knowledge that distract from the engineering goal of predictive modeling. Also skip detailed phenomenological critiques regarding qualia. The reason is time and relevance: these debates stall on metaphysical commitments we are deliberately bracketing. Tell the audience: "We are not solving metaphysics today; we are building a pipeline for subjective data." This keeps the workshop focused on methodological utility rather than ontological victory.

  7. What would change this plan (about 100 words)
  If the audience strongly rejects the LLM analogy as category error (humans vs. code), I would swap to a distributed systems tracing example (span logs vs. actual latency). The most exposed point is the claim that engineers will accept bracketing ontology; if they insist that "feelings" must be real to be modeled, the method collapses. If this resistance emerges early, I must reorder the sequence to address the "eliminativism" fear before introducing the intentional stance, ensuring they know we aren't deleting experience before we start modeling it.
