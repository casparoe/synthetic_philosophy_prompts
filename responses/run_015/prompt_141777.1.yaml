  # DECISION TREE: NORMS OF ASSERTION

  **Instructions:** Follow the path determined by your verdicts on the following cases and claims. Begin at Node 1.

  ### AXIS 1: AUDIENCE-RELATIVITY
  **Node 1 (Stationmaster):** You assert a train schedule to the station guard, who just confirmed it and knows it better than you. Is your assertion *improper* specifically because the audience already knows/has better evidence?
  *   **YES** → Go to Node 7.
  *   **NO** → Go to Node 2.

  **Node 7 (High Stakes):** In a high-stakes context, does the audience's practical situation change whether your assertion is proper, even if your evidence is unchanged?
  *   **YES** → **LEAF A: Contextualist/Subject-Sensitive Variant**
  *   **NO** → **LEAF B: Audience-Relative Invariantist (Unnamed)**

  ### AXIS 2: RETRACTION NORMS
  **Node 2 (Relapse):** You assert a patient is recovering on impeccable evidence. It is true. Later, the evidence is debunked, though the patient *did* recover. Are you obliged to retract your original assertion?
  *   **YES** (Retraction norm differs from assertion norm) → **LEAF C: Retraction-Asymmetrist (Unnamed)**
  *   **NO** (Retraction norm matches assertion norm) → Go to Node 3.

  ### AXIS 3: MODALITY
  **Node 3 (Duty Claim):** Is assertion ever *required* of a speaker (a duty), or is it merely regulated by permissions and prohibitions?
  *   **REQUIRED** → **LEAF D: Assertion-Duty View (Unnamed)**
  *   **PERMITTED/FORBIDDEN** → Go to Node 4.

  ### AXIS 4: NORM CONTENT
  **Node 4 (Lottery):** You have overwhelming statistical evidence that a ticket lost, but no confirmation. Is asserting "It lost" improper?
  *   **YES** (Improper) → **LEAF E: Knowledge Norm**
  *   **NO** (Proper) → Go to Node 5.

  **Node 5 (Undercover):** You assert a truth to an audience you know will take it as confirming a falsehood, and staying in character requires no hedge. Is asserting improper?
  *   **YES** (Improper) → **LEAF F: Responsibilist/Warranted-Assertability**
  *   **NO** (Proper) → Go to Node 6.

  **Node 6 (Justified False Belief):** You are fully justified in believing $p$, and you assert $p$, but $p$ is unknowably false. Is your assertion improper?
  *   **YES** (Improper) → **LEAF G: Truth Norm**
  *   **NO** (Proper) → **LEAF H: Belief/Justification Norm**

  ***

  ### LEAF DESCRIPTIONS & COMMITMENTS

  **LEAF A: Contextualist/Subject-Sensitive Variant**
  *   **Label:** Contextualist/Subject-Sensitive.
  *   **Awkward Commitment:** The same sentence uttered with the same evidence can be proper in one conversation and improper in another.

  **LEAF B: Audience-Relative Invariantist (Unnamed)**
  *   **Label:** Unnamed.
  *   **Awkward Commitment:** You are forbidden from informing others of what they already know, even if true.

  **LEAF C: Retraction-Asymmetrist (Unnamed)**
  *   **Label:** Unnamed.
  *   **Awkward Commitment:** You must retract claims that were perfectly proper when made, simply because your evidence later changed.

  **LEAF D: Assertion-Duty View (Unnamed)**
  *   **Label:** Unnamed.
  *   **Awkward Commitment:** Silence is a violation of duty whenever you possess sufficient evidence to speak.

  **LEAF E: Knowledge Norm**
  *   **Label:** Knowledge Norm.
  *   **Awkward Commitment:** You cannot properly assert that your lottery ticket lost, even with odds of one in a million.

  **LEAF F: Responsibilist/Warranted-Assertability**
  *   **Label:** Responsibilist.
  *   **Awkward Commitment:** You are forbidden from asserting the truth if doing so will mislead your audience.

  **LEAF G: Truth Norm**
  *   **Label:** Truth Norm.
  *   **Awkward Commitment:** You assert improperly whenever you are wrong, even if you were perfectly rational to believe you were right.

  **LEAF H: Belief/Justification Norm**
  *   **Label:** Belief/Justification Norm.
  *   **Awkward Commitment:** You assert properly whenever you are rational, even if you are asserting a falsehood.

  ***

  ### UNOCCUPIED REGIONS OF LOGICAL SPACE

  **Audience-Relative + Truth Norm:** Empty because truth is objective and does not vary based on the audience's epistemic state.
  **Retraction-Different + Knowledge Norm:** Empty because knowledge is factive and timeless; if you knew it then, retraction is never required.
  **Modality-Duty + Skeptical View:** Incoherent because skepticism denies constitutive norms, while a duty view asserts one.
  **Modality-Duty + Knowledge Norm:** Unexplored because epistemic norms are traditionally viewed as prohibitions on ignorance rather than duties to speak.

  ### UNSEPARATED POSITIONS

  **Truth Norm vs. Justification Norm:** If the student finds Node 6 unintuitive (e.g., rejects the possibility of justified falsehoods), these two leaves collapse; the tree flags them as distinct only if the student accepts the case is possible.
