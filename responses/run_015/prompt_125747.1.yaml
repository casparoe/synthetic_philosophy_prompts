  I'm organizing a retreat for my team next month and one coworker suggested we have this drunken symposum where everyone drinks so we can see each other's real personalities come out. He said Plato talks about this in the Law's — there's a part where the Athenian stranger compares wine to a mirror for the soul, saying it makes people drop their guard and reveal whether they're truly courageous or temperate inside. I read that section but I'm still confused: is Plato saying alcohol reveals your permanent true nature, or that it creates a temporary fake self you can study from outside? And why does he think testing citizens while drunk is better for education than watching them sober? There's something about shame being easier to observe, but I can't quite connect the dots.
