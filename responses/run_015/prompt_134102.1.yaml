  **Mapping**

  **Race Picture:** Runners are citizens competing for status; the starting gun signals market entry; the head start is inherited capital; lanes are distinct career paths; rules are fixed market regulations; the referee is the neutral state; the baton is the asset transfer; the prize is final wealth accumulation.

  **Scoreboard Picture:** Players are economic agents; the game starts at policy formation; the head start is equity ownership; lanes are market sectors; rules are structural constraints subject to lobbying; the referee is a potentially captured regulator; the baton is political influence; the prize is control over future scoring mechanisms. The race assumes a fixed track; the scoreboard assumes the track is built by the players. The race focuses on velocity; the scoreboard focuses on authority. The race ends at a fixed finish line; the scoreboard continues indefinitely.

  **Where the race mapping holds**

  The race metaphor correctly identifies inheritance as an intergenerational transfer of advantage preceding individual effort. It captures the temporal sequence where parents accumulate resources before children enter the economy. It highlights the competitive nature of market positions; scarce spots exist, and early resources improve odds of securing them. It acknowledges that without intervention, initial endowments correlate strongly with final outcomes, making the start a plausible lever for egalitarian policy. This aligns with intuitive notions that unfair advantages at the beginning distort the meritocratic validity of the finish.

  **Disanalogies**

  Cosmetic disanalogies include the physicality of running versus transacting and the visibility of referees versus opaque regulators. These do not affect tax policy. Ones that matter for the tax conclusion are critical. First, the race assumes a single track, whereas the economy comprises incommensurable sectors; equalizing starts across all tracks is undefined. A head start in finance differs from one in arts; the race metaphor collapses these distinct markets into one ranking. This matters because tax cannot target a specific distance without a common metric. Second, the race assumes a fixed finish line, but wealth is recursive capital used to generate more wealth, not a final prize. Wealth buys more wealth, compounding advantage beyond the initial run. This matters because taxing the initial transfer ignores subsequent compounding.

  Third, and most crucially, the race assumes neutral rules enforced by a referee. In reality, large inheritances buy influence over the rules themselves. Wealthy heirs do not just run faster; they lobby to change lane assignments or shorten distances for themselves. Why this matters: If wealth purchases rule-making power, taxing the start does not fix the game rigging. The race metaphor suggests fairness is achieved at $t=0$, but if the wealthy rewrite regulations at $t=1$, the start equalization is nullified. Therefore, the race metaphor significantly underestimates the need for structural constraints on wealth concentration, not just redistribution of initial assets. It treats wealth as a tool for running faster, rather than a tool for moving the finish line. This implies inheritance tax alone is insufficient without campaign finance or lobbying reform.

  **What the picture imports**

  The race picture silently imports specific normative commitments. It assumes justice is primarily about procedural fairness at a specific moment (the start) rather than ongoing structural equity. It presupposes that market outcomes track effort closely enough that removing the head start renders the result meritocratic. It commits to the state as a neutral referee capable of enforcing rules without capture. It also implies that there is a single metric of success (wealth) that everyone values equally. It treats advantage as static.

  **Verdict**

  The race picture fails to support a robust inheritance tax conclusion because it addresses symptoms (unequal starts) rather than the disease (unequal power). Once load-bearing disanalogies are acknowledged, equalizing starts looks futile if the wealthy can rig the track. My scoreboard replacement does better by identifying large inheritances as stakes in governance rather than mere running shoes. It shifts the argument from desert to democracy. However, it risks proving too much: if all wealth is scorekeeping power, then any accumulation might be illegitimate, demanding radical redistribution beyond inheritance tax. It also lacks a clear threshold for when wealth becomes power.

  Neither image alone suffices. A viable policy needs the race's intuition about opportunity combined with the scoreboard's insight into power. We need inheritance tax not just to equalize starts, but to prevent the conversion of economic capital into political veto power. The justification is preventing oligarchy, not just fairness. The race metaphor invites tinkering with the start line; the scoreboard demands monitoring the referees. A complete argument must show that large inheritances uniquely threaten the neutrality of the referee. Without that link, the scoreboard image remains a critique of capitalism itself, not just inheritance. Thus, the scoreboard is necessary but requires a supplementary theory of legitimate versus illegitimate influence to avoid nihilism. It successfully reframes the tax as anti-corruption rather than anti-success.
