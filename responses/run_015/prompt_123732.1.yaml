answer: |-
  There is no single, universally recognized noun phrase (e.g., "The X Effect") that captures this exact configuration across all disciplines. However, in institutional theory, philosophy of science, and sociology, this phenomenon is understood as a convergence of three established concepts.

  The most precise description of this configuration is **Institutional Decoupling driven by Exemplar-Based Boundary Work.**

  Here is the breakdown of the specific terminology that maps to the edges of your description, followed by the distinctions you requested.

  ### 1. The Established Terminology

  To name this precisely, you must combine a structural term, a cognitive term, and a functional term.

  **A. The Structural Dynamic: Institutional Decoupling**
  *   **Source:** Meyer & Rowan (1977), *Institutionalized Organizations*.
  *   **Fit:** This describes the gap between "formal structure" (the published criteria/rules) and "actual practice" (the shadow taxonomy). Institutions maintain formal rules to gain legitimacy (looking rational and fair) while decoupling those rules from actual decision-making to allow for flexibility or elite discretion.
  *   **Why it fits:** It explains why the rules remain static (they are for show/legitimacy) while the effective boundary shifts (to accommodate practical realities or power dynamics).

  **B. The Cognitive Mechanism: Exemplarism (or Prototype Theory)**
  *   **Source:** Thomas Kuhn (*The Structure of Scientific Revolutions*) & Eleanor Rosch (Cognitive Psychology).
  *   **Fit:** Kuhn argued that scientific communities do not operate by fixed rules but by **"exemplars"**—past solved problems or paradigmatic cases that members emulate. Rosch's **Prototype Theory** posits that humans categorize by resemblance to a central "best example" rather than necessary and sufficient conditions.
  *   **Why it fits:** This explains the "shadow taxonomy." The board is not applying the rules; they are comparing new applicants to the accumulated cluster of "central examples" (the approved relaxations). If a new applicant fits the rules but not the *prototype* formed by previous exceptions, they are rejected.

  **C. The Functional Goal: Boundary Work**
  *   **Source:** Thomas Gieryn (1983), *Boundary Work*.
  *   **Fit:** This refers to the strategies actors use to define, maintain, or blur the lines between legitimate and illegitimate members of a domain (e.g., science vs. pseudoscience, authentic vs. fake).
  *   **Why it fits:** This explains the *exclusion* of the compliant outsider. The boundary is not being moved to be fair; it is being manipulated via "tacit knowledge" to maintain professional closure and authority.

  ### 2. Defining the Edges (Distinctions)

  You asked to distinguish this from three specific concepts. Here is how this configuration differs:

  **Vs. The Sorites Paradox**
  *   **The Sorites:** Concerns the *inherent vagueness* of language. It argues that because there is no precise point where a "heap" becomes "non-heap," the concept itself is logically unstable. The boundary is *impossible* to draw.
  *   **Your Phenomenon:** The boundary is *not* inherently vague; it is *strategically opaque*. The institution claims a precise boundary exists (the rules) but enforces a different one (the exemplars). This is not a logical paradox about truth conditions; it is a sociological reality about power and discretion.
  *   **Key Difference:** Sorites is about *epistemic limitation* (we can't know where the line is); your phenomenon is about *institutional hypocrisy* (we know where the line is, but we won't tell you).

  **Vs. Ordinary Regulatory Drift**
  *   **Regulatory Drift:** Occurs when the *environment* changes around static rules, making the rules obsolete or misaligned over time (e.g., a law written for horses applied to cars). The rules stay the same, but their *impact* shifts due to external forces.
  *   **Your Phenomenon:** The shift is *internal* and *retrospective*. It is not that the world changed; it is that the institution's internal "memory" of what counts as valid has shifted via precedent. The rules are not obsolete; they are being overridden by tacit precedent.
  *   **Key Difference:** Drift is passive (rules fail to keep up); your phenomenon is active (rules are maintained to mask the shift).

  **Vs. Strategic Ambiguity**
  *   **Strategic Ambiguity:** Leaders intentionally write vague rules (e.g., "act with integrity") to allow for flexible interpretation later. The ambiguity is in the *text*.
  *   **Your Phenomenon:** The rules are *specific* (radiometric range, documented provenance). The ambiguity is in the *application*. The institution pretends the rules are sufficient, but relies on unwritten context.
  *   **Key Difference:** Ambiguity admits flexibility in the code; your phenomenon hides flexibility behind a facade of rigidity.

  ### 3. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident that **Institutional Decoupling** combined with **Exemplarism** accurately describes the mechanics you observed. These are the standard academic tools for analyzing the gap between formal policy and informal practice, and the reliance on precedent over rules.

  **Point of Least Certainty: The "Compliant Rejection" Terminology**
  I am least certain about whether there is a niche, discipline-specific slang term for the specific act of rejecting a technically compliant applicant because they lack the "shadow" credentials.
  *   In **Art History**, this is sometimes dismissed as **"Connoisseurship"** (implying the "eye" trumps the science), but that describes the *method*, not the *exclusionary dynamic*.
  *   In **Law**, this resembles **"Distinguishing"** a case, but that is usually written into the record, whereas your example implies an unstated rationale.
  *   In **Sociology**, this is **"Social Closure"** (Parkin/Weber), but that is a broad macro-sociological term.

  **Recommendation:**
  If you need to label this in a paper or argument, the most rigorous phrasing is:
  > *"A regime of **Institutional Decoupling** where formal criteria are maintained for legitimacy, while actual classification relies on **Exemplar-Based Boundary Work**, resulting in the exclusion of compliant outliers who fail to match the tacit prototype."*

  If you require a shorter, heuristic label, **"The Exemplar Trap"** or **"Decoupled Gatekeeping"** would be neologisms that accurately capture the dynamic without misusing existing technical terms.
