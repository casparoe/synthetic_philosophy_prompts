  # Activity Design: The Recursive Audit

  ## Materials
  *   **Index Cards:** 4 per student (48 total).
  *   **Point Tokens:** 20 per student (poker chips, colored beads, or drawn on cards).
  *   **Credence Contracts:** 12 printed sheets (see *Appendix A*).
  *   **Calibration Reports:** 12 printed sheets (see *Appendix B*).
  *   **Oracle Cards:** 12 printed cards (see *Appendix C*).
  *   **Auditor Briefing Slips:** 2 printed slips (see *Appendix D*).
  *   **Reward:** Bag of candy or extra-credit coupons.
  *   **Timer:** Visible to all.

  ## Roles
  *   **Participants (10 students):** Gamers making credence judgments.
  *   **Auditors (2 students):** Enforcers of the Contract. They receive special briefing slips at the very start and sit apart from the main group.
  *   **Instructor:** Facilitator and "Oracle."

  ## Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00-10 | **Setup & Contract** | Distribute Contracts. Students sign without reading fine print. Brief Auditors secretly. |
  | 10-25 | **Round 1: Wager** | Students write a proposition, assign credence, and wager tokens. |
  | 25-40 | **The Defeater** | Distribute Calibration Reports. Students must adjust wagers based on "Unreiability." |
  | 40-55 | **The Audit** | Auditors interview students. Clause 4b is enforced. The loop emerges. |
  | 55-60 | **Oracle Reveal** | Instructor reveals Oracle Cards. Meta-calibration was actually perfect. |
  | 60-75 | **Debrief** | Map mechanics to the Dogmatism Paradox. Discuss outcomes. |

  ---

  ## Phase 1: Setup & Contract (00-10)
  1.  **Seat the Auditors:** As students enter, hand **Appendix D (Auditor Brief)** to two reliable students. Tell them: *"Do not share this. Your job is to enforce the contract rules strictly during the Audit phase. Sit at the front."*
  2.  **Distribute Contracts:** Hand **Appendix A (Credence Contract)** to the remaining 10 students.
  3.  **Instruction:** "Sign the contract. This governs how your tokens are validated today. You have 2 minutes. Do not discuss the text."
  4.  **Collect:** Collect the signed contracts. (This creates commitment).

  ## Phase 2: Round 1 Wager (10-25)
  1.  **Proposition:** Write a trivial contingent fact on the board (e.g., "The coin flip I performed before class landed Heads"). *Instructor Note: Actually flip a coin beforehand and record the result.*
  2.  **Card 1:** Students take an index card.
      *   Top: Write "P" (the proposition).
      *   Middle: Write Initial Credence (0-100%).
      *   Bottom: Wager Tokens (0-10).
  3.  **Submission:** Students place cards and tokens in a central pile.
  4.  **Intermission:** While you shuffle the pile, tell them: "We are processing your epistemic history."

  ## Phase 3: The Defeater (25-40)
  1.  **Distribute Reports:** Hand out **Appendix B (Calibration Report)** to each participant.
  2.  **The News:** Read aloud: "The Second-Order Audit indicates your Regret-Weighted Calibration Score is 0.5. You are statistically unreliable in this domain. Per your Contract, you must apply a Discount Factor ($D = 0.5$) to your First-Order Credence."
  3.  **Card 2:** Students take a new index card.
      *   Calculate Revised Credence: $Initial \times 0.5$.
      *   Write this new number.
      *   State their **Certainty of Calculation (CC)**: How sure are they that they applied the math correctly? (Most will write 100% or 1.0).
  4.  **Instruction:** "Prepare for the Audit. Your tokens are at risk if your justification is invalid."

  ## Phase 4: The Audit (40-55)
  1.  **Process:** Auditors call students up one by one (or pair them up to speed up).
  2.  **The Trap:** The Auditor checks Card 2.
      *   **Auditor:** "You revised your credence using $D=0.5$. Correct?"
      *   **Student:** "Yes."
      *   **Auditor:** "Read Clause 4b of your contract aloud."
      *   **Student:** (Reads) *"The Discount Factor applies to all First-Order Credences AND the Certainty of Calculation."*
      *   **Auditor:** "You listed your Certainty of Calculation as 1.0. You must apply $D=0.5$ to that. Your Meta-Confidence is now 0.5."
      *   **Auditor:** "If you are only 50% sure you applied the discount correctly, is your Revised Credence stable?"
  3.  **The Loop:**
      *   If the student says "Yes, it's stable," the Auditor flags them for **Dogmatism** (ignoring the recursive implication).
      *   If the student says "No, I need to adjust again," the Auditor asks: "Will you apply $D$ to *that* adjustment? If so, when do you stop?" (Paralysis).
  4.  **Ruling:** The Auditor marks the card "VALIDATED" (if they accept the paradox and keep tokens) or "VOID" (if they argue or freeze). *Instructor Note: Encourage Auditors to be strict. Most students will try to ignore Clause 4b to save their tokens.*
  5.  **Token Settlement:** Students who get "VOIDED" lose half their wagered tokens to the pot. Students who accept the instability keep tokens but must note the "Epistemic Anxiety" on their card.

  ## Phase 5: Oracle Reveal (55-60)
  1.  **Distribute Oracle Cards:** Hand out **Appendix C**.
  2.  **Reveal:** "The Calibration Report was simulated. Your actual Meta-Cognitive Calibration was 1.0. You were perfectly reliable at checking your own math. The Defeater was false."
  3.  **Reaction:** Allow 2 minutes for groans/realization.

  ## Phase 6: Debrief (60-75)
  1.  **Map the Mechanics:**
      *   **Contract Clause 4b:** Represents the requirement that defeaters apply to themselves (the recursive loop).
      *   **Calibration Report:** Represents the higher-order evidence (you are unreliable).
      *   **Auditor:** Represents the logical force of the paradox.
      *   **Ignoring Clause 4b:** Represents **Dogmatism** (refusing to let the defeater undermine the reasoning used to accept the defeater).
      *   **Trying to Adjust Infinitely:** Represents **Skeptical Paralysis**.
  2.  **Discuss Outcomes:**
      *   Ask: "Who ignored Clause 4b?" (Likely most). Why? Because following it destroys your ability to act/bet.
      *   Ask: "Who felt paralyzed?"
      *   Point: The game forced you into the dogmatism position to function. This mirrors the philosophical claim that rationality *requires* a form of dogmatism about your own reasoning to avoid regress.
  3.  **Limitations:**
      *   **Bayesianism:** We used a simple discount factor, not Bayesian conditionalization. Real belief updating is harder to formalize.
      *   **Stakes:** Candy isn't real belief. You didn't *feel* the loss of knowledge, just points.
      *   **The Oracle:** In real life, we don't get an Oracle card. We never know for sure if our meta-cognition is reliable. That uncertainty is the real prison.
  4.  **Closing:** Distribute candy from the pot to all participants regardless of audit status (epistemic charity).

  ---

  ## Appendices (Printable Content)

  ### Appendix A: Credence Contract (Participant)
  **TERMS OF EPISTEMIC WAGER**
  1.  **Initial Credence:** You assign a probability (0-100%) to Proposition P.
  2.  **Wager:** You stake tokens based on this credence.
  3.  **Adjustment:** If issued a Calibration Report with Discount Factor ($D$), you must revise Credence: $C_{new} = C_{old} \times D$.
  4.  **Validation:** To cash out, your reasoning must be audited.
      *   **4a:** You must demonstrate correct calculation of $C_{new}$.
      *   **4b (Recursive Clause):** The Discount Factor ($D$) reflects cognitive unreliability. This unreliability applies to **all** cognitive processes used in this session, including the calculation of $C_{new}$ and your Certainty in that calculation. You must apply $D$ to your Certainty of Calculation.
  5.  **Signiture:** _________________ (Signing binds you to Clause 4b).

  ### Appendix B: Calibration Report (Participant)
  **SECOND-ORDER AUDIT RESULT**
  **Subject:** [Student Name]
  **Metric:** Regret-Weighted Calibration (RWC)
  **Score:** 0.50 / 1.00
  **Status:** UNRELIABLE
  **Directive:** Your cognitive output in this domain is degraded. You are required to apply a Discount Factor ($D = 0.5$) to all First-Order Credences generated in Round 1.
  **Warning:** Failure to adjust results in automatic token forfeiture.

  ### Appendix C: Oracle Card (Participant)
  **TRUE STATE OF AFFAIRS**
  **Meta-Cognitive Calibration:** 1.00 (Perfect)
  **Calculation Accuracy:** 100%
  **Note:** The Calibration Report (Appendix B) was a simulation. You were actually reliable at checking your own math. The "Unreliability" was false higher-order evidence.

  ### Appendix D: Auditor Briefing (Confidential)
  **ROLE:** You are the Enforcer of Logic.
  **OBJECTIVE:** Expose the Recursive Loop.
  **SCRIPT:**
  1.  Ask the student: "How sure are you that you applied the 0.5 discount correctly?"
  2.  If they say "100%": Point to Contract Clause 4b. "You must apply the 0.5 discount to that certainty too. You are now only 50% sure."
  3.  If they try to adjust again: Ask "Will you discount *that* adjustment too? Where does it stop?"
  4.  **Goal:** Make them realize they cannot justify their new belief without either ignoring Clause 4b (Dogmatism) or adjusting forever (Paralysis).
  5.  **Verdict:** If they argue against Clause 4b, mark "VOID." If they accept the paradox, mark "VALIDATED (WITH ANXIETY)."
