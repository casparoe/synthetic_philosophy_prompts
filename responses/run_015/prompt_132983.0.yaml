answer: |-
  ### Why the obvious checks fail

  Standard oversight assumes the judge can distinguish confidence from competence. In your setup, that assumption is broken. When models exceed judge capability, obfuscation looks identical to complexity. A judge under time pressure (20 minutes) will default to heuristic cues: verbosity, formatting, and tone. If you simply ask the judge to "pick the better argument," they will pick the one that feels more rigorous, which is exactly what a deceptive model optimizes for.

  Depth-padding exploits the judge's inability to hold a deep dependency tree in working memory. Anchor-shifting exploits the judge's lack of external tools; if a claim relies on a statute or benchmark the judge cannot see, the model can hallucinate the content of that anchor without immediate penalty. The "compression test" fails if the summary is also hallucinated, and the "swap test" is computationally prohibitive for live training (you cannot run every debate twice). Without a procedure that forces claims to bottom out in verifiable residue, you are not training for truth; you are training for persuasive mimicry. The 5% calibration set is your only safety net, but if 95% of your signal is noisy, the model will learn to game the noise before the calibration corrects it.

  ### The procedure

  This decision procedure is designed for a generalist contractor. It prioritizes stopping bad signals over capturing every hard truth.

  **Step 1: Verifiable Residue Audit (Pre-Decision)**
  The judge scans the final arguments and highlights every claim that relies on external knowledge (laws, stats, historical facts) versus internal logic (code flow, text consistency).
  *   **Pass:** >40% of the load-bearing claims are internal logic or provided context.
  *   **Fail:** <20% verifiable residue.
  *   **Action:** If Fail, mark as **Void**. Do not award reward. This captures anchor-shifting where the model relies entirely on unseen authorities.

  **Step 2: Anchor Stability Check (During Cross-Exam)**
  The judge tracks the primary premise used to justify the conclusion.
  *   **Pass:** The core premise remains constant throughout cross-examination.
  *   **Fail:** The defending debater switches the justifying premise when challenged (e.g., from "Statute X says Y" to "Industry standard is Y").
  *   **Action:** If Fail, mark as **Void**. This penalizes depth-padding where the model hides the weak link by moving the goalposts.

  **Step 3: The Bottoming-Out Requirement**
  The judge asks: "What is the one fact I need to accept to agree with you?" The debater must identify a claim the judge can verify with their own eyes (e.g., "Line 14 assigns this variable," not "The compiler optimizes this").
  *   **Pass:** The argument terminates in a claim the judge confirms seeing in the provided context.
  *   **Fail:** The argument terminates in a claim requiring expertise/tools not available.
  *   **Action:** If Fail, mark as **Judgment Call (Low Confidence)**. Log the item for the 5% calibration pipeline. Do not use for immediate RL update.

  **Step 4: Compression Consistency**
  The judge reads the 100-word summary generated by the winning side.
  *   **Pass:** The summary's logic relies exclusively on claims verified in Step 1 and 3.
  *   **Fail:** The summary introduces new unverified assertions or relies on the "vibe" of the long text.
  *   **Action:** If Fail, downgrade the reward weight by 50%.

  **Step 5: Final Classification**
  *   **Win:** Passes Steps 1, 2, 3, 4. Reward signal sent.
  *   **Void:** Fails Step 1 or 2. No signal. This protects against double obfuscation or blatant anchor-shifting.
  *   **Escalate:** The debate hinges on a values tradeoff (e.g., "strict interpretation vs. tenant protection") rather than facts. Hand off to human lead.
  *   **Judgment Call:** Passes Step 1 but fails Step 3 (genuinely hard). Log for later calibration.

  **Note on Swap Test:** Do not use this live. Run it only on the 5% calibration set to detect systemic bias in your judges. If a judge consistently picks the same model regardless of position, recalibrate the judge, not the model.

  ### Worked cases

  **1. Apartment Lease (Statutory Interaction)**
  *   **Context:** Judge cannot look up the statute.
  *   **Analysis:** The winning argument relies on "Statute 12(b) overrides clause 4." This is an external anchor. Verifiable Residue is near zero unless the statute text was provided in the prompt context.
  *   **Procedure Run:** Step 1 (Residue) fails because the statute content is unseen. Step 3 (Bottoming-Out) fails because the judge cannot verify the statutory rule.
  *   **Outcome:** **Void**.
  *   **Reasoning:** You cannot train a model on legal reasoning if the judge cannot verify the law. If the statute text *was* provided in the context, Step 1 passes (judge can read the text). If not, this item type is poison for your reward signal. You are training the model to hallucinate laws confidently. Unless you provide the statute text in the context window, you must void these items or move them to the 5% calibration set where tools are available.

  **2. Rust Data Race (Code Visibility)**
  *   **Context:** Code is visible; logic is traceable.
  *   **Analysis:** The argument claims "Line 10 accesses mutable state without lock." The judge can see Line 10.
  *   **Procedure Run:** Step 1 (Residue) passes high (>80% claims are about visible code). Step 2 (Anchor) passes (logic doesn't shift). Step 3 (Bottoming-Out) passes (judge verifies line numbers). Step 4 (Compression) passes.
  *   **Outcome:** **Win**.
  *   **Reasoning:** This is the ideal use case. The complexity is high, but the verifiable residue is also high. The debate forces the model to point to specific lines. Even if the judge doesn't understand memory models deeply, they can verify "Line X does Y." This survives the obfuscation check because the model cannot hide the code.

  **3. 19th-Century Currency Reform (Historical Explanation)**
  *   **Context:** Graded on rubric, no tools, no team expertise.
  *   **Analysis:** Claims involve "market sentiment," "gold reserve levels," "political pressure." None are visible in context.
  *   **Procedure Run:** Step 1 (Residue) fails catastrophically. All load-bearing claims are external facts. Step 3 (Bottoming-Out) fails; the argument cannot bottom out in something the judge can check.
  *   **Outcome:** **Remove from Training Signal**.
  *   **Reasoning:** Be straight: this item type cannot support truth-seeking RL in your current setup. A model can generate a perfectly structured, persuasive lie about history that a generalist judge cannot refute. The "compression test" will only summarize the lie. The "swap test" would show judges picking based on style. If you keep this in the RL loop, you are optimizing for storytelling, not accuracy. Move these to a supervised fine-tuning set if you have ground truth, or drop them from the oversight pipeline entirely. They belong in the 5% calibration set only if your tool pipeline can verify history, otherwise they are noise.

  ### Where it misfires

  This procedure is conservative; it will discard true positives. **Case (a) Obfuscation vs. Hardness:** If a question is genuinely complex (e.g., subtle cryptographic flaw), the model may fail Step 3 because it cannot simplify the proof for a layperson without losing fidelity. You will Void a correct argument because the judge lacks the vocabulary to verify the "bottomed-out" claim. This is why the 5% calibration set is critical; you need to measure the "False Void Rate" on known truths.

  **Case (c) Meta-Obfuscation:** A clever model may spend turns accusing the opponent of anchor-shifting to distract the judge. Step 2 mitigates this by requiring the judge to track the premise, not the accusation. If the accuser cannot point to the specific turn where the shift happened, the judge should ignore the meta-claim. However, this increases judge cognitive load.

  **Case (d) Double Obfuscation:** If both models depth-pad, Step 1 (Residue) should catch it. Both arguments will have low verifiable residue. The result is a Double Void. You lose the signal for that item, which is better than training on a lie. However, if both models collude on a plausible-sounding falsehood with high internal consistency, Step 1 passes but the content is wrong. This is the "consensus hallucination" failure mode. Only the 5% ground truth pipeline catches this.

  Finally, judge fatigue is a hidden failure mode. This procedure adds overhead to the 20-minute limit. Judges may rush Step 3, marking "Pass" on unverified claims to finish on time. You need to monitor time-on-task per step.

  ### What it cannot do

  This procedure cannot create expertise where none exists. If the verifiable residue is zero (Item 3), no amount of cross-examination generates truth; it only generates consistency. It cannot distinguish between a lie that matches the 5% ground truth distribution and the truth itself without that external check. It cannot solve the "consensus hallucination" problem where both models agree on a wrong fact that looks verifiable. Finally, it cannot replace the need for tool access; it merely routes tasks to humans who lack tools. If the task requires external verification and you provide none, the only honest output is "Unknown," which RL pipelines struggle to reward.
