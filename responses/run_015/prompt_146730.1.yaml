          *   Akrasia is often formulated as: "$p$, but it's irrational to believe $p$."
          *   If I defer to the HOB, I abandon $p$. So I believe "It's irrational to believe $p$."
          *   But if I have first-order evidence for $p$ that I distrust the HOB-reasoning against, abandoning $p$ violates the first-order evidence.
          *   This leads to a split: I have evidence for $p$, but I believe $\neg p$ (or suspension) because of HOB.
          *   This violates the "Total Evidence View."
          *   *Severity:* Strong. It violates standard norms of evidence responsiveness.

      *   *Objection 4: Unfalsifiability / Dogmatism.*
          *   The user asks: "Has this position been qualified into unfalsifiability?"
