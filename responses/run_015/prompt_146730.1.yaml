          *   Wait, if the HOB says "You are irrational," and they defer, they stop the irrational belief. That seems good.
          *   But what if the HOB is *false*? What if I am rational, but my HOB says I'm not? (False positive).
          *   If I always defer to HOB, I become susceptible to "epistemic hijacking." An unreliable process generates a HOB ("Your senses are lying"), and I abandon my reliable senses.
          *   *Severity:* Fatal. It makes the agent vulnerable to unreliable higher-order processes.

      *   *Objection 2: The Regress Problem.*
          *   If I defer to HOB ($B_2$), do I need a third-order belief ($B_3$) about the rationality of $B_2$?
          *   If $B_2$ says "Believing $p$ is irrational," and I adopt $B_2$, do I now believe $\neg p$? Or do I suspend judgment?
