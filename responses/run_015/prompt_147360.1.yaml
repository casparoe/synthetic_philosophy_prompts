answer: |-
  ### (1) Exam Question

  **Course:** PHIL 450 – Rational Choice and Moral Risk
  **Final Examination**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 800 words
  **Value:** 20 Marks

  **Question: The Astral Triage**

  Consider the following decision matrix, "Astral Triage." You are a delegate tasked with choosing a single policy affecting a known population of $10^6$ sentient beings (the "Locals") and a potential population of $10^{30}$ beings (the "Distant"). Welfare units are normalized such that the "moderate improvement" for Locals is valued at $10^3$ utils per being. The "astronomical improvement" for Distant beings is valued at $10^3$ utils per being. "Catastrophic harm" to Locals is valued at $-10^6$ utils per being.

  *   **Option A:** Certain moderate welfare improvement for the $10^6$ Locals. ($100\%$ probability).
  *   **Option B:** $0.001\%$ ($10^{-5}$) chance of astronomical improvement for $10^{30}$ Distant beings; $99.999\%$ chance of status quo (no change) for all.
  *   **Option C:** $0.002\%$ ($2 \times 10^{-5}$) chance of astronomical improvement for $10^{30}$ Distant beings; $0.001\%$ ($10^{-5}$) chance of catastrophic harm to the $10^6$ Locals; remainder status quo.

  Write an essay that addresses the following three components:

  1.  **Derive the Ranking:** Calculate the pure expected value (EV) for each option and establish the ranking preferred by an orthodox expected utility maximizer.
  2.  **Define Fanaticism:** Articulate precisely why this ranking constitutes *expected-value fanaticism* rather than merely counter-intuitive risk-seeking behavior.
  3.  **Assess the Lexical Constraint:** Evaluate whether introducing a lexical structural constraint—defined as *absolute priority for avoiding catastrophic harm to actually existing beings*—successfully blocks the fanatical result. In your assessment, determine if this constraint collapses into ordinary risk aversion or violates the independence axiom in an *ad hoc* manner.

  ***

  ### (2) Model Answer

  **The Astral Triage: Fanaticism and Lexical Constraints**

  An orthodox expected utility maximizer ranks options solely by the sum of probability-weighted utilities. In the Astral Triage, Option A yields a certain value: $10^6 \text{ beings} \times 10^3 \text{ utils} = 10^9$ total utils. Option B offers a $10^{-5}$ probability of $10^{30} \text{ beings} \times 10^3 \text{ utils} = 10^{33}$ total utils. The expected value of B is $10^{-5} \times 10^{33} = 10^{28}$ utils. Option C offers double the probability of the astronomical gain ($2 \times 10^{28}$ EV) minus the risk of harm ($10^{-5} \times 10^6 \text{ beings} \times -10^6 \text{ utils} = -10^7$ EV). The harm term is negligible relative to the gain term. Thus, the pure EV ranking is **C > B > A**.

  This ranking exemplifies expected-value fanaticism, not merely risk-seeking. Risk-seeking implies a convex utility function over wealth where agents prefer gambles with lower EV for higher variance. Here, the EV of B exceeds A by nineteen orders of magnitude. Fanaticism is the specific thesis that sufficiently large magnitudes of value can outweigh any fixed probability, no matter how small, rendering the agent insensitive to probability thresholds. It is fanatical because it mandates sacrificing a certain, significant good (A) for a microscopic chance of a vast good (B), implying that the certain welfare of a million beings is morally negligible compared to the potential welfare of distant entities. It violates the "principle of reasonable neglect," where probabilities below a certain threshold should not dictate action regardless of stake size.

  To mitigate this, one might propose a lexical structural constraint: *absolute priority for avoiding catastrophic harm to actually existing beings.* This constraint functions as a veto. Option C entails a non-zero probability of catastrophic harm to the Locals (actually existing beings). Therefore, under this constraint, C is impermissible, regardless of its superior EV. This successfully blocks the preference for C over A and B.

  However, does this constraint block the core fanatical result, B > A? Option B involves no catastrophic harm to existing beings; it merely offers them no change. Consequently, the lexical constraint does not veto B. Since B retains its massive EV advantage over A ($10^{28}$ vs $10^9$), the constraint fails to block the fanaticism of preferring B over A. To block B > A, the constraint would need to be expanded to a lexical priority for *actual welfare* over *potential welfare*, which is a distinct normative claim.

  Regarding axiomatic consistency, applying a harm-based veto to C does not necessarily violate the independence axiom *ad hoc*. The independence axiom states that if an agent prefers A to B, they should prefer a mixture of A and C to a mixture of B and C. Here, the "harm" feature is intrinsic to Option C's outcome state, not an independent event added to a lottery. Distinguishing options based on the presence of rights-violations (harm to existing beings) versus mere opportunity costs (no gain for existing beings) is a structural distinction in the outcomes, not a violation of probabilistic coherence.

  However, if the constraint is used to reject B > A (by claiming existing beings' moderate gain lexically outweighs potential beings' vast gain), it risks collapsing into ordinary risk aversion or violating independence. If we treat the "certainty" of A as lexically superior to the "probability" of B simply because A benefits existing beings, we are effectively weighting the probability of B as zero. If this weighting applies only when existing beings are involved, it violates independence when comparing lotteries where the "existing being" status is probabilistic. Thus, while the harm-based constraint cleanly eliminates C without axiomatic violation, it is insufficient to resolve the deeper fanaticism of B > A without introducing further structural constraints that may threaten the coherence of expected utility theory itself. The Astral Triage demonstrates that harm-avoidance constraints are necessary but insufficient tools against pure value fanaticism.

  ***

  ### (3) Marking Scheme

  **Total Marks:** 20
  **Pass Threshold:** 10 Marks

  | Analytical Move | Marks | Characteristic Error (Deduction) |
  | :--- | :---: | :--- |
  | **1. EV Derivation & Ranking**<br>Correctly identifies that the astronomical magnitude ($10^{33}$) dominates the certain moderate gain ($10^9$) despite low probability ($10^{-5}$). Establishes ranking C > B > A (noting harm in C is negligible in *pure* EV terms). | **4** | **Calculation/Order Error:** Failing to recognize B/C dominate A due to magnitude, or incorrectly calculating that the harm in C outweighs the astronomical gain in pure EV terms. |
  | **2. Defining Fanaticism**<br>Distinguishes fanaticism from risk-seeking. Identifies that fanaticism relies on magnitude overriding probability thresholds (insensitivity to tiny probabilities), whereas risk-seeking accepts lower EV for variance. | **4** | **Conceptual Conflation:** Defining fanaticism simply as "choosing risky options" or "being optimistic," failing to mention the dominance of magnitude over probability thresholds. |
  | **3. Applying Lexical Constraint to C**<br>Correctly applies the "harm to existing beings" constraint to rule out Option C. Acknowledges this successfully blocks the C > A/B ranking. | **4** | **Misapplication:** Arguing the constraint rules out Option B (which has no harm) or arguing it fails to rule out C (ignoring the non-zero harm risk). |
  | **4. Assessing Constraint on B vs. A**<br>Critically assesses that the harm-constraint does *not* block B > A (since B causes no harm). Notes that stopping B > A requires a different constraint (actual vs. potential welfare). | **4** | **Overestimation:** Claiming the harm-constraint fully solves the fanaticism problem by blocking B > A, without justification for why "no change" violates a harm constraint. |
  | **5. Axiomatic Analysis**<br>Discusses Independence/Ad hoc charge. Argues that harm-vetoing is outcome-based (coherent) but extending it to block B > A risks violating independence or collapsing into probability weighting (risk aversion). | **4** | **Axiomatic Confusion:** Claiming *any* lexical constraint violates Independence automatically, or failing to distinguish between outcome-based vetoes and probability manipulation. |
