  2.  **Deconstruct the Philosophy (Machiavelli's *Virtu* vs. *Fortuna*):**
      *   *Virtu:* Skill, prowess, adaptability, the ability to impose will on the world.
      *   *Fortuna:* Luck, chance, external circumstances, the unpredictable river.
      *   *The Metaphor:* Fortuna is a raging river; Virtu is building dikes/channels to direct it.
