      *   *Resolution:* Roll dice or draw from a deck? Drawing from a "Fortuna Deck" is more thematic.
      *   *The Twist:* The Body-State card modifies the *interpretation* of the Fortuna draw or the *cost* of the action. Let's make it modify the *threshold for success*.
      *   *Refinement:* If I'm "Tired," my Aggressive move fails easier. If I'm "Fed," my Conservative move yields extra. But players don't know *why* it failed. They think they made a bad call (*Virtu* failure), but it was their state (*Fortuna* internal).
      *   *Wait, better idea:* The Body-State card dictates a *hidden constraint* on their decision-making *before* they choose. No, the prompt says "shifts risk tolerance and outcomes without them knowing." So, it modifies the *outcome* based on the choice.
      *   *Let's simplify:*
          1.  Player chooses Action (Build Dike, Expand Trade, Hoard Grain).
          2.  Player draws Event Card (Good, Neutral, Bad).
          3.  Player applies Body-State Modifier (Hidden).
          4.  Result calculated.
      *   *Actually, to make them feel the "squeeze":* The Body-State card should force a *bias* in their choice, but they think it's their strategy.
      *   *Re-reading prompt:* "shifts risk tolerance and outcomes without them knowing its fortuna operating from inside."
      *   *Okay, best mechanic:* The Body-State card gives a secret rule. E.g., "If you choose Aggressive, subtract 1 point." But they don't know the rule until the end. They just feel the pain of failure.
      *   *Even better:* The Body-State card changes the *value* of the dice roll secretly.
      *   *Let's go with the "Hidden Multiplier" approach.* It's easiest to run.
      *   *Action:* Bid resources.
      *   *Event:* Random draw.
      *   *Body State:* Secretly alters the result.

      *Revised Plan:*
      *   **Resource:** "Political Capital" (PC).
      *   **Round:** 3 Crises occur.
      *   **Choice:** Spend PC to mitigate Crisis.
      *   **Fortuna:** A die roll determines Crisis Severity.
      *   **Virtu:** How much PC you spend.
      *   **Hidden Variable:** Body-State card adds/subtracts from your *effective* spending without telling you.
      *   *Example:* You spend 3 PC. You are "Anxious." Your effective spend is 1 PC. You fail. You think you weren't bold enough. Actually, your capacity was sapped.

  5.  **Fleshing out the Details:**
      *   *Materials:* Index cards, dice, tokens (beans/coins), paper.
      *   *Roles:* All equal (Princes/Rulers).
      *   *Rounds:* 3 rounds (5 mins each).
      *   *Debrief:* Crucial. Connect the frustration to the philosophy.

