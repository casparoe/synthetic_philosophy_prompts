prompt: |-
  hey i just got promoted to run a tiny team and now machiavellis fortune vs virtu thing feels way too real -- like am i steering anything or just riding the wave? i want a 45-min game for my book club (10 people, mostly not philosophy nerds) that makes them FEEL the squeeze between shaping luck and being shaped by it before anyone lectures them. design rules with hidden info and small-stakes payoffs: they play state-builders making strategic calls, but each secretly draws a "body-state" card (fed, tired, anxious) that shifts risk tolerance and outcomes without them knowing its fortuna operating from inside. they should run a few rounds, think they failed or succeeded by virtu alone, then discover the hidden biological variable was half the game. include materials, roles, a debrief that maps moments to machiavellis dike-building claim, and be honest about what the activity cant reproduce -- probably the gendered body-politic metaphor and the specific renaissance statecraft context -- plus what predictably breaks first run. keep it casual, i write virtu without the accent and i dont need citations or a reading list, just something runnable.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **User Context:** Newly promoted team lead, feeling the tension between control (*virtu*) and chance (*fortuna*).
