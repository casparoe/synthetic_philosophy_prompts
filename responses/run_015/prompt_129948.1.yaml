      *   *Fix:* Pair them up. 5 Pairs. One submits for the pair. Or just keep it individual but fast.
      *   *Fastest:* Players roll their own dice. They have a "State Token" (Red/Blue/Green). They don't know what the color means. The *Event Deck* has instructions like "Red tokens subtract 1 this round."
      *   *No, that reveals it.*
      *   *Okay, stick to the prompt:* "Secretly draws a body-state card."
      *   *Mechanism:* Player draws card. Keeps it face down. GM has a legend. When resolving, player shows card to GM? No, too slow.
      *   *Best Mechanism for 10 people/45 mins:* **The Hidden Handicap.**
      *   Give everyone a face-down card at the start. It has a number: +1, 0, -1, -2.
      *   They do *not* look at it.
      *   They roll a d6 for their "Action."
      *   They add their hidden number.
      *   They report the total to the group/GM.
