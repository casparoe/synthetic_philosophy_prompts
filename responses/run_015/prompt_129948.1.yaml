      *   *Correction:* They report the *Die Roll*. The GM (or a designated Scorekeeper) applies the hidden modifier silently and announces the *Outcome*.
      *   *Problem:* 1 GM can't do math for 10 people quickly.
      *   *Solution:* **The Envelope Method.**
      *   Inside the envelope is the Modifier AND a set of 3 "Result Tables."
      *   No, too complex.
      *   *Let's go with the "Body State dictates Risk Tolerance" idea from the prompt.*
      *   "Shifts risk tolerance... without them knowing."
      *   Okay, the card tells them: "You MUST choose Aggressive this round." But they think they chose it freely? No, that's railroading.
      *   *Okay, the prompt says:* "shifts risk tolerance and outcomes."
      *   *Idea:* The card gives a *bonus* that feels like skill, or a *penalty* that feels like failure.
      *   *Let's simplify for runnability:*
          1.  Everyone gets a face-down "Virtue Card" (actually Body State). Values: +2, +1, 0, -1, -2.
          2.  They do NOT look at it.
          3.  Round 1-3: Face a Crisis (Target Number 7).
          4.  Player rolls 2d6.
          5.  Player *silently* adds their hidden card value.
          6.  Player announces "Success" or "Fail."
          7.  *Wait, lying?* No.
          8.  *Okay, GM checks.* 10 players is too many for 1 GM to check secretly.
          9.  *Solution:* **Peer Audit with Bluffing.** No, too complex.
          10. *Solution:* **The "Fog of War" Sheet.**
          11. Each player has a sheet. They roll. They add the hidden number. They write the result. They don't know the number they added.
          12. At the end, they reveal the card.
          13. *Wait, how do they add a number they can't see?*
          14. *Ah, the "Tactile" Method.* The card has a texture? No.
          15. *Okay, the GM (User) needs to run this.* The User is the Prince/Manager.
          16. *Wait, the User is playing WITH them.* "Run a tiny team... game for my book club."
          17. *Okay, the User is the Facilitator.*
          18. *Facilitator handles the math.*
          19. Players roll 2d6. Tell Facilitator the roll. Facilitator adds hidden modifier. Announces Result.
          20. *Bottleneck:* 10 players x 3 rounds = 30 interactions. 1 min each = 30 mins. Doable.
          21. *Modifier:* +2 (Well), 0 (Normal), -2 (Unwell).
          22. *Target:* 8+ to succeed.
          23. *Experience:* Someone rolls a 9 (natural success) but has -2. Facilitator says "Fail." Player thinks "I should have strategized differently." Someone rolls 5, has +2, gets 7 (Fail). Wait, need to tune numbers.
          24. *Tuning:* Target 7. Roll 2d6 (Avg 7). Modifiers +2 / -2 create variance.
          25. *Crucial:* Players must not see the modifier being added. Facilitator takes the roll, looks at secret sheet, announces outcome.

  8.  **Refining the Debrief:**
      *   Map the frustration to *Fortuna*.
      *   Map the strategy to *Virtu*.
      *   Discuss the "Dike": How do you build systems when your own capacity fluctuates?
      *   Acknowledge limitations: Real life isn't a dice game; Machiavelli's context was violent/patriarchal.

  9.  **Predictable Breaks:**
      *   Players comparing notes mid-game ("I rolled a 10 and failed!").
