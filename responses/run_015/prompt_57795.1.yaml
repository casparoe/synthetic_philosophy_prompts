answer: |-
  Hi team, I know these incident reviews are tough because we are often trying to decide if a mistake actually caused a harm or if the harm would have happened anyway, and we need to do this quickly without getting lost in abstract debates. I have put together a procedure based on how philosophers and legal theorists actually handle causation by omission, but I have stripped out the metaphysics that won't help us meet our thirty-minute limit. The core idea we are keeping is the distinction between factual causation and normative responsibility. Philosophers argue endlessly about whether doing nothing is really a cause of anything, but for us, the useful distinction is between whether the action would have physically stopped the harm and whether the person was supposed to do that action. We are dropping the deep ontological question of whether an omission is an event or a non-event because that does not change whether a family deserves an apology or a carer needs retraining. We are also dropping the complex theories about preemptive causation because in home care, the timelines are usually linear enough that we do not need to worry about multiple sufficient causes happening at the exact same micro-second. What we are keeping is a three-part test that moves from duty to capacity to counterfactuals, and then flags when we are making a values judgment rather than a factual one.

  The procedure runs in four stages and you should stop as soon as you hit a no. The first stage is to establish duty. You look at the care plan and the roster to see if there was a specific task assigned to a specific person at a specific time. If there was no duty assigned, then there is no omission by our staff, and you stop there with a verdict of no causal responsibility. If there was a duty, you move to the second stage which is capacity. You ask whether the carer was physically and practically able to perform the task. If the carer was blocked by something outside their control, like a road closure that made arrival impossible or a locked door they could not open despite trying, then the omission was not voluntary, and you stop with a verdict of no causal responsibility. If they could have done it, you move to the third stage which is the counterfactual test. This is the hardest part. You must ask whether performing the task would have prevented the harm with reasonable medical certainty. If the harm would have happened anyway even if they did the task, then the omission did not cause the harm. If the task would have prevented the harm, you move to the fourth stage. The fourth stage is where we check for conflicting duties or systemic barriers. If the carer skipped the task to handle a higher-priority emergency, or if the system made it impossible to succeed regardless of effort, you mark this as a values call. This means the facts are clear but the blame is unclear, and that is when you escalate it to me or the director because it requires a judgment on what we prioritize as an agency, not just what happened physically.

  I want to walk you through how this looks in practice with three scenarios so you can see where the friction points are. In the first case involving Mrs A, the carer was supposed to remind her to take blood thinners on Tuesday evening but did not show up. Mrs A took them three hours late on her own and had a stroke overnight. When we run the procedure, stage one confirms duty because the reminder was scheduled. Stage two confirms capacity because the carer could have shown up. Stage three is where this case resolves. We have to look at the medical evidence regarding blood thinners. These medications work cumulatively to reduce risk over time, and a single three-hour delay in one dose rarely changes the immediate physiological probability of a stroke occurring that specific night unless there is evidence of a clot forming in that specific window. If the medical review says the stroke was not preventable by that specific reminder, then the counterfactual test fails. The verdict is that the omission did not cause the harm. I know this feels wrong because the carer broke the rules and we feel guilty about the no-show, but the procedure says we are off the hook for the stroke itself. We still discipline the no-show because it is a performance issue, but we do not log the stroke as caused by missed care because the missed care did not change the outcome. This is the distinction between bad performance and causal liability, and keeping them separate protects us from paying out for harms we did not actually cause.

  In the second case with Mr B and the oxygen tank, two carers covering a weekend both assumed the other refilled the portable tank, nobody did, and it ran out Saturday night sending him to the ER. Stage one shows both had a shared or ambiguous duty depending on how the roster was written, but let us assume the duty existed for the team. Stage two shows capacity because either could have done it. Stage three shows that if either had refilled it, the harm would not have happened. This passes the counterfactual test. Stage four checks for conflicting duties and finds none. Here the procedure says both omissions are causal factors because either action would have prevented the harm. This is a case of overdetermination where multiple failures line up to cause one result. The verdict is that this is caused by missed care, but the values call comes in on how we assign blame between the two staff members. We likely log this as a systemic communication failure rather than individual negligence, but the family still gets the apology and payout because the harm was preventable had our system worked. This one feels fair because the harm was clearly avoidable.

  The third case involves the carer who skipped a scheduled fall-risk check for fifteen minutes to help another client who had fallen, and during that gap Mrs C got up alone and broke a hip. Stage one confirms duty for the check. Stage two confirms capacity. Stage three confirms that if the check had happened, the carer would have been there to stop Mrs C, so the harm was preventable. This passes the factual causation test. However, stage four flags a conflicting duty. The carer omitted the check to respond to an emergency elsewhere. This is where the procedure stops and marks it as a values call. Factually, the omission caused the fall. Normatively, we have to decide if helping a fallen client justifies skipping a check for another. This is not a factual question anymore. We cannot solve this with the procedure alone. We have to decide if our policy allows triage of duties during emergencies. If we say yes, then the carer is not blameworthy despite the causal link. If we say no, then they are. This is why you escalate this one. It is uncomfortable because the carer did a good thing and still caused harm, but the procedure correctly identifies that the facts are clear even if the judgment is hard.

  I want to be honest about where this procedure will misfire so you do not lose faith in it when things feel messy. The main place it will frustrate you is in cases like Mrs A where we feel moral guilt but the facts say no causation. It is very hard to look a family in the eye and say our staff failed to show up but we did not cause the stroke. However, if we conflate poor performance with causal liability, we will end up paying out for every bad thing that happens to a client regardless of whether our care changed the outcome, which is not sustainable. The procedure forces us to separate the apology for the stress of the no-show from the liability for the medical event. Another place it will misfire is with systemic issues. If our staffing levels are so low that carers constantly have to choose between clients like in Mrs C's case, the procedure will keep flagging values calls. It cannot fix understaffing. It will tell you that the harm was factually caused by the omission, but it cannot tell you that the root cause is budget decisions made by the board. It treats the incident in isolation, so it will sometimes identify symptoms rather than diseases.

  Finally, here is what this procedure cannot do. It cannot measure moral guilt or replace your professional intuition about when a family needs support regardless of liability. It cannot solve resource allocation problems or fix ambiguous care plans that create the confusion we saw in Mr B's case. It cannot determine whether a payout is fair beyond the factual link between care and harm, which is why the director still steps in for large amounts. It also cannot account for long-term degradation of health where many small omissions add up to a decline, because it is designed for specific incident reviews with clear timelines. Use this to keep your findings consistent and defensible, but if a case keeps coming back to you as a values call, that is a signal that we need to change our policies, not just review the incident. I hope this makes the load lighter even if the decisions remain hard.
