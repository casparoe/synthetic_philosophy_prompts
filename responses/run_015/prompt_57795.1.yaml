      *   Walk through the steps in prose.
      *   Explain the kept/dropped philosophy.
      *   Run the cases.
      *   Discuss the uncomfortable verdict.
      *   End with limitations.

      *Self-Correction on Formatting:* I need to be extremely careful not to use markdown headers (#) or bold (**). Just plain text paragraphs.

      *Drafting thought:* "Step 1" might look like a list. I should write "The first step is..."
      *Drafting thought:* Ensure no bullet points. Use transitions like "Next," "Then," "Finally."

      *Philosophical nuance:* I need to mention that we are distinguishing between "but-for" causation and "responsibility." Philosophers like Hart and Honoré talk about normal conditions vs. interventions. We will simplify this to "expected course of events."

      *Case 1 Detail:* Mrs A takes meds 3 hours late. Stroke overnight. Blood thinners work cumulatively. One late dose usually doesn't trigger immediate stroke unless there was a specific clot forming right then. We need to assume for the case that the medical evidence says the 3-hour delay did not materially change the risk profile enough to prevent *this* stroke. This makes it a hard pill to swallow but philosophically sound.

      *Case 2 Detail:* Diffused responsibility. Both had duty. Both omitted. Either action would have prevented harm. This is "overdetermination." Philosophically tricky. Practically, both are causes.

      *Case 3 Detail:* Conflicting duties. This is where the procedure stops and says "values call."

      *Limitations:* Can't fix systemic understaffing. Can't measure moral guilt.

