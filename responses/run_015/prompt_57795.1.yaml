prompt: |-
  hey I run incident reviews for a home care agency and I could realy use some help turning philosophy into something usable.

  a couple times a month something bad happens and the question is whether it happened because a carer didnt do something they were supposed to do. like a missed meds reminder, a missed overnight check, not refilling an oxygen tank, not locking a gate. deciding that matters because it decides whether we log it as caused by missed care, whether the family gets an apology and a small payout, whether staff get retraining or a formal warning, and what we tell the regional board. I sign off on most of them, our director only steps in if a payout would be over five grand.

  my team are nurses and schedulers, no philosophy background, and we have about half an hour per case max. can you write us a plain language reusable procedure for deciding when an omission caused a harm, based on whatever philosophers have actually figured out about causation by omission that is usable in real life. I need steps to run in order, what counts as a good enough answer at each step, where we stop with a no, and where we have to mark it as this is not a factual question anymore, someone has to make a values call. please keep what the idea actually says but drop the stuff that wont survive in practice, and say which distinctions you kept and which you dropped and why. and be honest about where the procedure will misfire.

  then run it on three made up cases so we can see it work:

  one, Mrs A is 84, carer was supposed to come Tuesday evening to remind her to take blood thinners, carer no-shows, Mrs A remembers herself and takes them three hours late, then has a stroke overnight.

  two, two carers covering a weekend both think the other refilled a portable oxygen tank, nobody does, it runs out Saturday night and Mr B ends up in ER.

  three, a carer skips a scheduled fall-risk check for fifteen minutes to help another client who fell, and during that gap Mrs C gets up alone and falls and breaks a hip.

  please include at least one verdict we will not like, like where the procedure says we are off the hook when we feel guilty or on the hook when we thought we did everything reasonable, and explain why it says that. and end with what the procedure cannot do.

  oh and for the response please do continuous prose only, no headings, no bullet points, no bold text, no tables, just write it the way you would write an email in normal paragraphs, since I have to forward it to teh team.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Runs incident reviews for a home care agency.
      *   **Task:** Create a plain language, reusable procedure for deciding when an omission (failure to act) caused harm, based on philosophical theories of causation by omission but adapted for practical use (30 mins/case, non-philosophers).
      *   **Requirements:**
          *   Steps to run in order.
          *   Criteria for stopping (no vs. values call).
          *   Explain kept/dropped philosophical distinctions and why.
          *   Honesty about limitations/misfires.
          *   Run the procedure on three specific made-up cases (Mrs A, Mr B, Mrs C).
          *   Include at least one counter-intuitive verdict (off the hook when feeling guilty, or on the hook when thought reasonable).
          *   End with what the procedure cannot do.
          *   **Format Constraint:** Continuous prose only. No headings, no bullet points, no bold text, no tables. Write like an email in normal paragraphs.

  2.  **Philosophical Background (Causation by Omission):**
      *   *Problem:* Omissions are tricky. If I don't water your plant, did I kill it? If I don't save a drowning child, did I kill them? Legally and morally, we distinguish between doing harm and allowing harm, but causally, nothing happened.
      *   *Key Theories:*
          *   *Counterfactual Dependence:* If the carer had acted, would the harm have been avoided? (But this is too broad; everyone who didn't save the child caused the death).
          *   *Normative Expectations/Duty:* Was there a specific duty to act? (This narrows it down).
          *   *Normality/Default:* Was the omission abnormal compared to the expected course of events?
          *   *Intervention:* Did the omission break a chain of prevention?
      *   *Practical Adaptation:* We need to combine counterfactuals (would it have helped?) with normative duties (were they supposed to?) and capacity (could they have?).
      *   *Dropping:* Deep metaphysical debates about whether omissions are "nothing" or "events." We don't need ontology; we need liability assessment.
      *   *Keeping:* The distinction between factual causation (would it have changed the outcome?) and normative causation (was it their job to prevent it?).

  3.  **Drafting the Procedure (Mental Outline):**
      *   Intro: Acknowledge the difficulty.
      *   Step 1: Duty. Was there a specific task assigned?
      *   Step 2: Capacity. Could they have done it?
      *   Step 3: Counterfactual. Would doing it have stopped the harm?
      *   Step 4: Normality/Intervention. Was this the main thing that went wrong vs. background noise?
      *   Step 5: Values Call. If it passes 1-3 but feels wrong, escalate.
      *   Application to cases.
      *   Limitations.

  4.  **Formatting Constraint Check:**
      *   **NO HEADINGS.**
      *   **NO BULLET POINTS.**
      *   **NO BOLD TEXT.**
      *   **NO TABLES.**
      *   **Continuous prose only.** (Like an email).

  5.  **Drafting Content - Section by Section (incorporating constraints):**

      *   *Greeting/Intro:* Hi team, here is the procedure.
      *   *Philosophy bit:* Explain we are using a mix of duty and counterfactuals. Drop the metaphysics.
      *   *The Steps:* Weave them into paragraphs.
      *   *Case 1 (Mrs A):* Missed meds, took late, stroke. Counterfactual fails? Or duty met?
      *   *Case 2 (Mr B):* Oxygen tank. Diffused responsibility.
      *   *Case 3 (Mrs C):* Skipped check for emergency. Normative conflict.
      *   *Counter-intuitive verdict:* Need one where we feel guilty but procedure says no, or vice versa. Case 1 looks like a good candidate for "no causation" if the meds didn't prevent the stroke anyway, or if the delay didn't matter. Actually, Case 3 is better for "on the hook" despite good intentions, or Case 1 for "off the hook" despite missed care. Let's aim for Case 1 being "no causation" because the stroke happened anyway despite taking meds (maybe too late? or meds don't prevent all strokes). Or Case 3 where the carer is "off the hook" because of the competing emergency. Let's make Case 1 the counter-intuitive one: Missed care happened, harm happened, but no causation because the meds wouldn't have prevented *that* stroke.
      *   *Limitations:* What can't it do? Moral guilt, systemic issues.

  6.  **Refining the Text for Constraints:**
      *   I must ensure I don't accidentally use bolding for emphasis.
      *   I must ensure I don't use lists like 1. 2. 3. Instead use "first," "second," "next."
      *   I need to make sure the flow is natural email style.

  7.  **Developing the Philosophical Core for the Procedure:**
      *   Focus on *NEss* (Necessary Element of a Sufficient Set) simplified.
      *   Focus on *Duty*.
      *   Focus on *Effectiveness*.
      *   Distinction kept: Factual causation vs. Normative responsibility.
      *   Distinction dropped: Metaphysical status of omissions (is nothing something?).
      *   Why: Team needs actionable criteria, not ontology.

  8.  **Developing the Cases:**
      *   *Case 1 (Mrs A):* Carer no-show. Meds taken 3 hours late. Stroke overnight. Verdict: No causation. Why? Blood thinners reduce risk over time, one missed/late dose rarely causes immediate stroke unless specific conditions met. If the stroke was due to a rupture thinners wouldn't stop, or if the 3-hour delay didn't change the physiological outcome. This feels like "off the hook" when we feel guilty about the no-show.
      *   *Case 2 (Mr B):* Two carers, diffusion of responsibility. Both assumed other did it. Verdict: Systemic cause + Shared omission. Both causally linked? Or systemic failure. Let's say both are causally linked because either could have prevented it. This is "on the hook" even if it was an honest mistake.
      *   *Case 3 (Mrs C):* Carer skipped check to help faller. Mrs C falls. Verdict: Normative conflict. The omission was justified by higher duty (emergency). So no *blameworthy* causation, but factual causation exists. This is the "values call" spot.

      *Wait, I need a counter-intuitive verdict.*
      Let's make Case 1 the counter-intuitive one. We feel guilty because the carer didn't show. But the procedure says the omission didn't *cause* the stroke medically.
      Let's make Case 3 the one where we think they did right, but procedure says "factual cause exists, needs values call on justification."

      *Actually, the prompt asks for "at least one verdict we will not like, like where the procedure says we are off the hook when we feel guilty or on the hook when we thought we did everything reasonable."*
      Case 1 is perfect for "off the hook when we feel guilty." The carer messed up (no-show), harm happened, but the mess-up didn't cause the harm.
      Case 3 is perfect for "on the hook when we thought reasonable." They did a good thing (helped faller), but their omission caused the hip break.

      Let's go with Case 1 as the primary counter-intuitive one.

  9.  **Writing - Paragraph by Paragraph (monitoring constraints):**

      *   Start with context.
