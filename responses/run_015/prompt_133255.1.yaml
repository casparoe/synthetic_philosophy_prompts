          *   *Actually, the cleanest fix:* **Qualify (1).** Natural traits have *primary* function by history, but *secondary* function by current role. This resolves the X/Y divergence.

  5.  **Refining the Output:**
      *   Tone: Professional, philosophical, peer-to-peer (since they are joining a working group).
