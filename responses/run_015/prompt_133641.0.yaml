  # Slide: Equal TPR + Calibration ≠ Equal Burden

  | **Group A (Higher Risk)** | **Group B (Lower Risk)** |
  | :--- | :--- |
  | **N=1000** (Base Rate 20%) | **N=1000** (Base Rate 10%) |
  | **Score 0.8:** 125 pts (100 Y1, 25 Y0) | **Score 0.5:** 100 pts (50 Y1, 50 Y0) |
  | **Score 0.2:** 500 pts (100 Y1, 400 Y0) | **Score 0.1:** 500 pts (50 Y1, 450 Y0) |
  | **Score 0.0:** 375 pts (0 Y1, 375 Y0) | **Score 0.0:** 400 pts (0 Y1, 400 Y0) |
  | *Calibration Exact:* 100/125=0.8, 100/500=0.2 | *Calibration Exact:* 50/100=0.5, 50/500=0.1 |
  | **Threshold ≥ 0.5** | **Threshold ≥ 0.5** |
  | **Flagged:** 125 pts (100 Y1, 25 Y0) | **Flagged:** 100 pts (50 Y1, 50 Y0) |

  ### Metrics & Verification
  *   **TPR:** A=100/200=**50%**; B=50/100=**50%** (Equal)
  *   **FPR:** A=25/800=**3.1%**; B=50/900=**5.6%** (B is **1.77×** higher)
  *   **Harm:** **25** unnecessary calls (A) vs **50** unnecessary calls (B)
  *   **AUC:** A=**0.85**; B=**0.83** (Both informative, diff < 0.05)
  *   **PPV:** A=**80%** (>20% base); B=**50%** (>10% base)

  ### Mechanism: Why FPR Diverges
  For a single flagged score bin $s$:
  $$ \text{FPR} = \text{TPR} \times \underbrace{\left( \frac{1-s}{s} \right)}_{\text{Score Odds}} \times \underbrace{\left( \frac{P(Y=1)}{1-P(Y=1)} \right)}_{\text{Base Rate Odds}} $$
  *   **Driver:** Group B's flagged patients sit at $s=0.5$ (uncertain), Group A at $s=0.8$ (confident).
  *   The **Score Odds** term ($1.0$ vs $0.25$) overwhelms the Base Rate Odds term.

  ### Fragility & Objection
  *   **If Same Score:** If both groups flagged only at $s=0.8$, FPR flips (A > B). Equal burden requires equal score *distribution*, not just calibration.
  *   **Raj's Objection:** "This is just a worse model for Group B. Fix the AUC/distribution, don't blame the threshold."
  *   **Reply:** "Partly right. But in practice, models *are* less certain on low-base-rate groups. Calibration fixes the *meaning*, not the *uncertainty*. If we deploy unequal uncertainty, equal TPR imposes unequal burden."
