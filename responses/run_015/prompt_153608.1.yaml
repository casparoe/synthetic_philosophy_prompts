answer: |-
  Here is the breakdown. I have treated your constraint—the account must serve both the monograph writer and the forecaster—as the primary filter. This forces a hard line on hindsight bias that pure historical understanding sometimes relaxes.

  ### The Desiderata List

  **Non-Negotiable (Functional Requirements)**
  1.  **Ex-ante Legibility:** Every causal factor cited must have been detectable *before* the outcome occurred. If a factor is only visible because of the outcome (e.g., "the rise of fascism" identified only after the Nazis win), it cannot be used to explain the outcome to a forecaster.
  2.  **Asymmetry (The Near-Miss Test):** The explanation must fail if the outcome is swapped. If your causal chain explains Outcome A just as well as Outcome B, you have described a background condition, not a cause.
  3.  **Evidence Independence:** The explanation cannot rely solely on sources generated *by* the outcome (e.g., victor's archives, memoirs written post-defeat). It must hold up against evidence contaminated by the result.
  4.  **Intervention Sensitivity:** For the policy/forecasting user, the explanation must identify leverage points. If $X$ causes $Y$, altering $X$ must plausibly alter $Y$. Purely structural accounts often fail this.

  **Camp Taste (Methodological Preferences)**
  1.  **Diachronic Stability:** (Mostly Non-negotiable, but degree varies.) Avoiding "beginning of the X" descriptions. Some camps (conceptual history) argue meaning *is* retrospective; others demand stable categories.
  2.  **Narrative Fidelity vs. Contingency:** (Taste.) How much messiness must be retained? Analytical history prefers pruning dead ends; narrative history insists dead ends are part of the experience.
  3.  **Probability Calibration:** (Mostly Non-negotiable.) Resistance to hindsight inflation. However, *how* you calibrate (Bayesian vs. frequentist) is camp-specific.

  ### Evaluation of Your Circled Items

  *   **Ex-ante legibility:** **Genuine Desideratum.** You are correct to worry it bans hindsight-enabled insight. It does. It bans *structural* insights visible only to the rear guard. But for your dual-purpose constraint (usable by a forecaster), it is non-negotiable. If the forecaster couldn't see it, the explanation is useless to them.
  *   **The near-miss test:** **Genuine Desideratum.** This is the core test for contingency. Non-negotiable.
  *   **Source contamination:** **Genuine Desideratum,** but technically an evidentiary constraint rather than an explanatory one. The explanatory corollary is *Evidence Independence* (listed above).
  *   **Closure versus contingency:** **Prejudice/False Dichotomy.** This is not a desideratum but a tension to be managed. The desideratum is *Fidelity to Process*. Demanding total closure is fiction; demanding total contingency is unintelligible.
  *   **Diachronic stability:** **Genuine Desideratum.** Essential to avoid teleology. Non-negotiable for analytical rigor.
  *   **Resistance to judged-probability inflation:** **Genuine Desideratum.** This is simply the definition of avoiding hindsight bias. Non-negotiable.

  ### Missing Desiderata

  1.  **Mechanism Transparency:** It is not enough to say $X$ caused $Y$. The account must specify the *process* linking them. (Correlation vs. Causation).
  2.  **Actor Epistemic Alignment:** To satisfy *Ex-ante Legibility*, you must account for what the actors knew. If actors acted on false beliefs that caused the outcome, the explanation must cite the belief, not the reality they missed.

  ### Incompatible Pairs (Trade-offs)

  1.  **Ex-ante Legibility vs. Structural Depth:** This is the hard one. Deep structural causes (demographics, economic shifts) are often only legible ex-post. Enforcing strict ex-ante legibility forces explanations toward agent-centric decisions, potentially flattening structural history.
  2.  **Closure vs. Contingency:** You cannot have a readable monograph (closure) and a perfect representation of the open past (contingency). You must sacrifice some fidelity for intelligibility.
  3.  **Diachronic Stability vs. Contextual Sensitivity:** Fixing terms to ensure stability (e.g., calling something "revolutionary" only if it succeeds) risks anachronism. Using contemporary terms risks instability if meanings shift.

  ### The Single Biggest Excluder

  **Ex-ante Legibility.**
  This requirement excludes the vast majority of structuralist, Marxist, and Annales-style accounts, where the "real" causes are often invisible to contemporaries and only discernible through the long-term consequences. It also kills most narrative history, which relies on the ending to select which beginning matters.

  ### Scorecard

  **Covering-law Accounts**
  Fail ex-ante legibility (laws are often generalized ex-post) and intervention sensitivity (historical laws rarely offer policy levers). Strong on diachronic stability, weak on contingency.

  **Counterfactual-dependence Accounts**
  Strong on the near-miss test and intervention sensitivity. Struggle with ex-ante legibility (validating which counterfactuals are "real" often requires hindsight) and source contamination.

  **Narrative/Process-tracing Accounts**
  Strong on mechanism transparency and actor alignment. Typically fail the near-miss test (teleological emplotment) and ex-ante legibility (plot selection relies on knowing the end).
