  Dear Friend,

  It is a pleasure to help you think through the philosophical architecture of your character's positions, as getting the internal logic of policy debates right is often what separates a convincing story from a didactic one. Your outreach worker friend presents a fascinating case because her views are not merely a checklist of preferences but seem to stem from a coherent, albeit nuanced, ethical framework regarding autonomy, stigma, and state power. To understand how she will react to the mayor's compromise, we first need to excavate the underlying principles that unify her support for the New Zealand model, her rejection of the Nordic and German models, and her specific approval of that Dutch tweak regarding premises inspections. When we look closely at her reasoning, particularly her fear of police leverage and her objection to two-tier systems, we can identify two distinct philosophical lenses through which she might be viewing the world. The first lens is what we might call the Parity Principle, which holds that sex work must be regulated exactly like any other form of labour or service industry to avoid stigmatization. The second lens is the Leverage and Safety Principle, which prioritizes the reduction of immediate physical harm and police coercion over strict regulatory equality, accepting some specific rules if they demonstrably improve safety without creating criminal liabilities for workers.

  If we view her through the Parity Principle, her logic is driven by a demand for formal equality where sex work is normalized as work, full stop. Under this view, any regulation that applies specifically to sex businesses rather than all businesses is inherently suspect because it marks the industry as morally distinct and dangerous. This explains her hatred of the German model's two-tier system and her support for the New Zealand approach where workplace safety rules are ordinary rules. It also explains why she approved the Dutch tweak only because it utilized standard premises inspections rather than seller-specific health checks. However, if we view her through the Leverage and Safety Principle, her logic is more consequentialist, focusing on whether a policy gives police the power to harass workers or forces them into unsafe conditions. This principle explains her opposition to the Nordic model, which drives work underground, and her hatred of the broad pimping law, which prevents workers from hiring security. Under this view, she might accept specific regulations on brothels if they prevent coercion, provided there is no registry of workers and no criminal penalties. The tension between these two principles is where your drama lies, because the mayor's proposal tests the boundary between treating sex work as normal business and treating it as a special case requiring oversight.

  When we apply the Parity Principle to the mayor's compromise, your friend would likely react with skepticism or outright opposition, primarily due to the provision requiring a special licence for larger commercial brothels. From the perspective of parity, a special licence creates a class of business that does not exist for other industries, reinforcing the idea that sex work is inherently risky or morally fraught in a way that running a cafe or a massage parlour is not. She would argue that this recreates the two-tier system she disliked in the German model, even if the lower tier of small owner-operated places is treated normally. She would likely contend that if a business with three employees does not need a special licence, a business with four should not either, and that safety inspections should be part of standard fire and health codes applicable to all premises, not a quarterly ritual specific to sex work. To her, the special licence is a tool of stigma that marks the business as different, potentially discouraging investment and legitimizing future crackdowns, violating her core belief that decriminalization means removing exceptionalist laws.

  Conversely, if we apply the Leverage and Safety Principle to the same proposal, her reaction might be cautiously supportive or at least ambivalent rather than hostile. This principle cares less about whether the rules are identical to other industries and more about whether the rules protect workers without giving police weapons to use against them. Since the mayor's plan removes criminal penalties for buying and selling, eliminates the worker registry, and keeps exit help voluntary, it checks the major boxes for reducing harm and police leverage. She might reason that larger commercial brothels do present different risks regarding potential coercion or trafficking compared to a solo operator, and therefore quarterly safety inspections targeted at those larger venues could be a pragmatic trade-off for ensuring physical safety. As long as the special licence cannot be revoked arbitrarily to punish workers and does not require listing individual employees, she might see it as a acceptable bureaucratic hurdle to ensure that large-scale operators are held accountable for workplace safety, viewing it as a protective measure rather than a discriminatory one.

  My best guess is that her real view aligns more closely with the Parity Principle, though she might struggle to articulate why she feels uneasy about the special licence. The reason for this is that her strongest stated objection in your notes was against the German and Dutch style legalization specifically because it creates a two-tier system. The mayor's plan explicitly creates a two-tier system based on the size of the operation, which mirrors the structural flaw she identified in the European models. Furthermore, her approval of the Dutch tweak was contingent on the inspections being standard premises inspections, whereas the mayor is proposing a special licence which implies a higher level of scrutiny and permission than standard business law usually requires. She likely understands that once you create a special licensing category for sex work, you give authorities a hook to hang restrictions on later, which aligns with her fear of police leverage. While she cares deeply about safety, her history of rejecting models that single out sex workers suggests she believes safety is best achieved through normalization, not through targeted oversight that implies sex work is uniquely dangerous.

  To help you develop this conflict in a later chapter, you could introduce a hypothetical case that forces these two principles to diverge sharply, revealing which one truly drives her. Imagine a scenario where the city proposes a law requiring all businesses that operate between midnight and six in the morning to install panic buttons and extra lighting, but this law applies to bars, clubs, and late-night diners as well as brothels. Under the Parity Principle, she would support this because it treats sex work premises exactly like any other late-night business. However, imagine a variation where the city proposes mandating panic buttons only for premises where sex work occurs, arguing that the risk of violence is higher there. The Leverage and Safety Principle might support this specific mandate because it maximizes worker safety regardless of equality, whereas the Parity Principle would reject it as stigmatizing exceptionalism. Watching her wrestle with whether she prefers equal treatment or targeted safety measures would give your readers a deep insight into her character and allow you to dramatize the philosophical tension without resorting to exposition.

  I hope this breakdown helps you navigate the council debate scenes with the nuance they deserve. It is clear you have done your homework on the policy details, and grounding your character's reactions in these competing ethical frameworks will make her feel like a real expert rather than a mouthpiece for a single ideology. If you need to explore how she might articulate these objections in dialogue or how other council members might counter her arguments, feel free to reach out again. Good luck with the draft, as this kind of thoughtful engagement with policy is exactly what makes fictional politics feel lived-in and real.

  Warmly,

