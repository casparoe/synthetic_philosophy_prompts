answer: |-
  This is a profound impasse, and you are right to identify it as ontological rather than plot-driven. If your dying man refuses the wedding, he is refusing a definition. To make that refusal resonate as integrity rather than cowardice, you must locate the truth of his life in the gap between the *reality* of his bond and the *category* offered to describe it.

  *Brokeback Mountain* is the essential text here, not because it is a story about marriage (it is not), but because it is a story about the violence that occurs when a relationship has no container adequate to its shape. Below is a reading of the text through your philosophical framework, testing your distinctions against the tragedy of Ennis and Jack, and concluding with what fiction can do that philosophy cannot.

  ### I. The Conjugal and the Revisionist in the High Country

  The philosophical debate you outline maps onto the film's structural dichotomy, but with a cruel inversion.

  **The Conjugal View (The Heterosexual Marriages)**
  Ennis's marriage to Alma and Jack's to Lurene perform the "comprehensive union" function reasonably well. They are oriented toward procreation (children are central to both), they establish a single household, and they offer temporal totality (the expectation of "until death"). The film does not depict these marriages as frauds in a functional sense; they work as social engines. However, the film exposes the hollowness of the *conjugal* view when the "generative unit" lacks the underlying affective reality. Alma and Lurene get the *status* of marriage, but they are excluded from the *truth* of their husbands' lives. The conjugal view protects the institution but fails the individuals.

  **The Revisionist View (The Ranch Proposal)**
  Jack's proposal—"we coulda had a good life together"—is the revisionist argument made flesh. He seeks to disaggregate the functions: he wants the economic partnership, the domestic care, the stabilizing of dependency, without the procreative or social expectations of the 1960s Wyoming conjugal model. He wants the *work* of marriage without the *name* (since the name was impossible).
  *   **Where the film supports this:** It validates that their relationship *was* a marriage in all but name. It sustained them, organized their labor (the ranch fantasy), and managed their dependency.
  *   **Where the film embarrasses this:** The revisionist view assumes that if you remove the exclusionary barriers, the relationship stabilizes. But Ennis refuses the ranch. Why? Because the revisionist view ignores the *declaratory* cost. Ennis knows that without the social shield of the "conjugal" norm, their "revisionist" partnership would be vulnerable to violence (the story of the gay cowboy beaten to death). The revisionist view assumes safety in recognition; Ennis knows recognition brings danger.

  ### II. Testing Your Three Distinctions

  **1. Durative vs. Declaratory**
  *Brokeback* suggests that the *durative* function (staying together) cannot survive long-term without the *declaratory* function (being seen).
  *   **The Film:** Ennis and Jack achieve a miraculous duration (20 years of intermittent meetings). But because they lack the declaratory framework (no shared address, no public acknowledgment), the durative bond is constantly threatened by external forces (Alma's suspicion, Jack's father-in-law, the landscape itself).
  *   **The Embarrassment:** The film shows that a relationship can be durative *because* it is undeclared. The secrecy is the glue. If they had declared it, the violence of the world might have severed it sooner. This complicates your daughter's argument. She assumes declaration strengthens the bond. The film suggests declaration might have broken it.
  *   **For your novel:** Your dying man may refuse because he knows their bond survived *because* it was not named. To name it now is to introduce a variable that changes the chemistry of the survival.

  **2. The Retrospective Function**
  This is the crux of your third act. Marriage is inherently prospective (vows are promises about the future). A wedding in the final weeks attempts to use a prospective tool for a retrospective job (ratification).
  *   **The Film:** Jack spends his life trying to make the relationship prospective ("next time," "the ranch"). Ennis lives in the retrospective ("I swear I don't know nothin'"). When Jack dies, the possibility of a future vanishes.
  *   **The Coherence Problem:** A retrospective marriage collapses into eulogy. If you marry only to say "this *was*," you are not marrying; you are testifying.
  *   **For your novel:** Your dying man refuses because he knows a vow requires a future tense. To say "I will" when there is no "will" left is a lie. He is protecting the sanctity of the vow from being repurposed as a deathbed certificate. He prefers the truth of their history to the falsification of a legal future.

  **3. The Legibility Debt**
  Your concept of "legibility debt" is the strongest tool here. The film argues that this debt is always paid, either by the couple or by the bystanders.
  *   **The Film:** Ennis and Jack try to keep the debt private. They think they are sparing their families. Instead, the debt comes due with interest. Alma pays it (a life of suspicion and betrayal). Jack's father pays it (keeping the ashes, the secret). Ennis pays it (the loneliness of the trailer).
  *   **The Shirts:** The closing scene is a private ritual that attempts to pay the debt without public legibility. Ennis hanging the shirts is a sacrament of one. It acknowledges the debt but refuses to socialize it.
  *   **For your novel:** The daughter wants to pay the debt *for* them. She thinks the wedding clears the ledger. The dying man knows the debt is already incurred and cannot be retroactively cleared. A wedding now doesn't pay the debt to the town or the heirs; it just changes the beneficiary. He refuses because he knows the cost has already been borne, and a ceremony cannot refund it.

  ### III. The Strong Objection: Masculinity vs. Marriage

  You must not let the film off the hook, but you must also not force it into a box it resists.

  **The Resistance:**
  Neither Ennis nor Jack wants to be "married." They want to be *free*. The tragedy of *Brokeback* is not that they were denied a license; it is that the only space available for their love was outside civilization (the mountain), not inside it (the home). To read them as plaintiffs for marriage equality is to domesticate a wildness that the film insists is central to their bond. They are cowboys; their identity is tied to a specific, rugged individualism that marriage (even same-sex marriage) domesticates.

  **Where the Resistance is Real:**
  If your dying man refuses the wedding because he is "a man of the land" who rejects bureaucracy, that is sentimentality. If he refuses because he knows that *their* specific love was constituted by its exclusion, that is tragedy.
  *Brokeback* resists the marriage argument because it suggests that some loves are *made* by the constraints placed upon them. Remove the constraints (the secrecy, the distance), and you might remove the tension that held the love together.

  **Where You Cannot Let the Film Off the Hook:**
  However, the film indicts the *silence*. Ennis's inability to speak is not noble; it is the wound. The film shows that the "legibility debt" falls hardest on the women (Alma) who are forced to guess. If your dying man refuses the wedding to maintain his "dignity" or "privacy," he is replicating Ennis's sin: prioritizing his own self-conception over the legibility owed to those who loved him (the daughter).
  To avoid making him a coward, his refusal cannot be about *hiding*. It must be about *truth-telling*. He must refuse the wedding because the wedding tells a lie about what they were.

  ### IV. What Fiction Adds: The Ontology of the Particular

  Philosophy deals in categories (Marriage, Union, Status). Fiction deals in *things*.

  **The Thing Only a Story Can Show:**
  Philosophy asks, "What is marriage for?" Fiction asks, "What was *this*?"
  The philosophical arguments assume that marriage is a vessel into which a relationship is poured. Your novel, like *Brokeback*, has the opportunity to show that the relationship *is* the vessel. The shape of their forty years—the specific silences, the specific divisions of labor, the specific way they stood in a barn—is already a complete form.

  **The Scene to Set Beside Your Third Act:**
  Do not look at the wedding proposal. Look at **the trailer scene at the end of the film.**
  Ennis opens the closet. He sees the shirts. He says, "Jack, I swear..."
  This is the moment of *ratification without declaration*. He acknowledges the union, but he does it to the dead man, in private.
  *   **Why this helps you:** It shows that the "truth" of the relationship does not require the state's validation to be real, *but* it requires the survivor's acknowledgment to be resolved.
  *   **The Pivot:** In your novel, the daughter wants a public wedding (Declaratory). The dying man wants... what? If he wants the trailer scene (private ratification), he is not being a coward; he is being a custodian of the truth.

  **How to Write the Refusal:**
  To make the refusal principled, the dying man must articulate that the wedding is a *genre error*.
  *   **Not:** "I'm too old," or "People will talk," or "It's not right." (These are cowardice/sentimentality).
  *   **But:** "We did not live that life. To stand up and say we did is to dishonor the life we *did* live."

  He must argue that their partnership was a **third thing**. Not marriage, not friendship. A specific, forged alloy that a wedding would melt down into base metal.
  *   *The Argument:* "You want to give us a name that makes us legible to the town. But the town didn't see us. If we stand up there, we are asking them to validate a version of us they couldn't see then and won't see now. We were partners. We were neighbors. We were... [his word]. If we call it marriage, we admit that what we had wasn't enough on its own. It was enough."

  **The Fictional Utility:**
  Philosophy cannot capture the *weight* of forty years. A wedding implies a beginning. Your characters are at the end.
  *   **The Lesson from *Brokeback*:** The tragedy isn't that they didn't marry. It's that they couldn't *build*. Jack wanted the ranch (a future). Ennis could only manage the shirts (a past).
  *   **Your Third Act:** If the dying man refuses the wedding, he must offer an alternative act of ratification that is *true* to their past. Perhaps he signs over the partnership assets in a way that explicitly names the daughter as the witness to their *actual* bond, not a ceremonial one. He pays the legibility debt not with a vow, but with a ledger.

  **Conclusion:**
  *Brokeback Mountain* ultimately argues that love without a language is a ghost. The daughter is trying to give the ghost a body. The dying man knows the ghost is already gone.
  He refuses the wedding not because he is afraid of the town, but because he is faithful to the silence. The tragedy—and the redemption—is that the silence was the only place where they could speak. To break that silence now, with a ceremony, would be to translate a poem into a contract.

  Let him refuse. But let him offer the daughter the *shirts*. Let him give her the evidence, not the ceremony. Let him say: "This is what we were. It doesn't have a name. But it was real." That is not cowardice. That is the only kind of honesty left to him.
