answer: |-
  Hey, so you know the usual deal with Ian Hacking and looping effects. The standard story goes like this: we slap a label like "ADHD" or "Borderline Personality Disorder" on someone, they learn the label, they change their behavior to fit it (or resist it), and that feedback loop changes the category itself. People usually take this to mean psychiatric kinds are unstable, fluid, or just straight-up social constructions. If the target moves every time you shoot at it, how can it be a real thing?

  I want to argue the opposite. Looping actually makes psychiatric kinds *more* stable, not less. But to see why, we have to stop treating looping like it's one single mechanism. We need to split it into two types: **expressive looping** and **mechanistic looping**.

  Expressive looping is when the label changes how a person narrates their experience or presents their symptoms, but doesn't necessarily change the underlying engine. You get diagnosed with depression, you learn the vocabulary of "anhedonia" and "low affect," and suddenly you're reporting those specific things instead of just saying "I feel like garbage." The core distress is real and pre-existing, but the label gives you a filter.

  Mechanistic looping is the heavy stuff. This is where knowing the label actually rewires your neural pathways or cognitive machinery in a way that creates a new causal pathway. Like, knowing you have a addiction might trigger a stress response that physically alters craving circuits.

  Here's the contrarian bit: for most big DSM categories, the looping is almost entirely expressive. There is a real underlying difference—some neural or cognitive variance—that's just getting filtered through different self-narratives over time. When people align their behavior with the label (expressive looping), they actually make the category *sharper*. They become better reporters of their own condition. The feedback loop reduces noise. So, ironically, the social reaction to the label stabilizes the kind by making the population more homogenous in how they present.

  So if looping stabilizes things, whats the problem?

  This is where I want to inject a niche idea called **diagnostic shadowing**.

  Shadowing happens when clinicians gradually treat the looped, self-aware version of the disorder as the canonical form. Over a few decades, the textbooks get updated to match the patients who *know* they are patients. The original, pre-loop clinical picture gets erased.

  Think about it. A psychiatrist in 1980 saw ADHD kids who just couldn't sit still and didn't know why. A psychiatrist in 2024 sees ADHD kids who know they have dopamine issues, maybe know their meds mechanism, and perform their symptoms differently. If the manual only describes the 2024 version, we lose the ability to recognize the 1980 version. We start diagnosing the *performance* of the illness, not the illness itself. We're diagnosing the shadow cast by the classification, not the object casting it.

  Shadowing, not looping itself, is what's actually bad for classification. It creates a drift where the criteria slowly detach from the biological or psychological baseline and attach themselves to the cultural knowledge of the disorder.

  The fix isn't to stop looping (we can't anyway). It's to force the manuals to preserve baseline pre-loop descriptions as reference points. We need an archaeological layer in the DSM. Keep the old criteria alive as a "historical baseline" so clinicians can spot the disorder in populations that haven't been looped yet—like kids in isolated communities or historical records.

  If we do that, we can admit that looping happens without conceding that the disorders are just social constructs. The loop changes the expression, sure, but shadowing is what hides the reality. We need to seperate the performance from the pathology, and that starts with keeping the old maps around.

  Anyway, just a thought. The loop isn't the enemy, forgetting where we started is.
