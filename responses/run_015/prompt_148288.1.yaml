answer: |-
  # The Public Reason Curriculum Filter (PRCF)
  **Based on John Rawls's *Political Liberalism* and the Duty of Civility**

  **Purpose:** To evaluate objections and proposals for public-school curriculum within a pluralistic democracy, ensuring decisions are justified by reasons accessible to all reasonable citizens, regardless of their private comprehensive doctrines (religious or secular).
  **Time Allocation:** 45–60 Minutes per item.
  **Authority:** This procedure does not determine truth; it determines *public justifiability*.

  ---

  ## Part I: The Decision Procedure (Step-by-Step)

  ### Step 1: Isolation of the Claim (5 Minutes)
  **Question:** What is the specific curriculum action being requested (include/exclude/modify), and what is the *stated* public justification?
  **Action:** Write the justification down verbatim. Strip away emotional language, historical grievances, and references to specific groups.
  **Sufficient Answer:** A single sentence stating the action and the reason (e.g., "Remove Book X because it contains age-inappropriate sexual content").
  **Stop Condition:** If no reason is offered other than "We dislike it," the objection is **Rejected** as arbitrary.

  ### Step 2: The Comprehensive Doctrine Scan (10 Minutes)
  **Question:** Does the justification rely on premises that require faith, revelation, or adherence to a specific ideological system to be accepted?
  **Action:** Check for keywords: *God, Scripture, Sin, Sacred, Divine Law, Ideological Purity, Absolute Truth.*
  **Sufficient Answer:**
  *   **Yes:** Proceed to Step 3 (The Proviso).
  *   **No:** Proceed to Step 4 (Independence Check).
  **Judgment Call Flag:** *Board members must decide if terms like "Natural Law," "Morality," or "Human Dignity" are being used as shared political values or as code for specific religious doctrines. This cannot be decided by rule; it requires interpretation of context.*

  ### Step 3: The Proviso Test (15 Minutes)
  *(Triggered if Step 2 = Yes)*
  **Question:** Has the objector/proposer supplied a "properly public reason" in due course that supports the same conclusion?
  **Action:** Ask the proponent: "Can you explain why this decision is necessary using only reasons based on common sense, current scientific consensus, or shared democratic values (e.g., safety, equality, literacy) without referencing your comprehensive doctrine?"
  **Sufficient Answer:** A reason that stands on its own. (e.g., "While my faith teaches X, the secular reason for this policy is Y, which benefits all students by...")
  **Ruling:**
  *   **Public Reason Supplied:** Proceed to Step 4.
  *   **No Public Reason Supplied:** **Rejected.** The justification violates public reason. (Note: The person is not silenced, but their *reason* cannot ground a public policy decision).

  ### Step 4: The Independence Check (15 Minutes)
  *(Triggered if Step 2 = No OR Step 3 = Pass)*
  **Question:** Is the public reason *freestanding*? Would this reason still make sense to a citizen who does not share the objector's private motivations?
  **Action:** Hypothetical removal. Imagine the objector's religious/ideological motivation does not exist. Does the public reason (e.g., "literary merit," "child safety") still hold weight?
  **Sufficient Answer:**
  *   **Yes:** **Accepted.** The justification is valid for public policy.
  *   **No:** **Rejected.** The public reason is a "sham" or post-hoc rationalization (e.g., "Safety" is defined in a way only makes sense within the religious doctrine).
  **Judgment Call Flag:** *Determining whether a reason is "freestanding" or "dependent" is the core philosophical burden. The procedure cannot automate this. The Board must vote on whether the secular reason is intelligible without the religious premise.*

  ### Step 5: Final Ruling & Documentation (10 Minutes)
  **Action:** Record the decision. If accepted, state the *public reason* as the official ground for the decision, not the objector's private motive. If rejected, state that the justification failed to meet the standards of public reason.
  **Constraint:** Do not investigate the sincerity of the objector's beliefs.

  ---

  ## Part II: Test Sentences for Board Training

  Use these examples to calibrate board intuition before applying the procedure to real cases.

  | Claim Type | Example Sentence | PRCF Verdict | Why? |
  | :--- | :--- | :--- | :--- |
  | **Purely Comprehensive** | "This book must be banned because it contradicts the literal word of God." | **Reject** (Step 3) | No public reason offered; relies on revelation. |
  | **Compliant with Proviso** | "My religion forbids this, but we should also ban it because it incites violence, which is a public safety risk." | **Accept** (Step 4) | Public reason (safety) is freestanding from the religious claim. |
  | **Secular Mask (Dependent)** | "We must exclude this because it violates the natural order of creation." | **Reject** (Step 4) | "Natural order of creation" sounds secular but is unintelligible without the religious doctrine. |
  | **Valid Public Reason** | "This text should be included because it is historically significant for understanding 20th-century geopolitics." | **Accept** (Step 4) | Based on shared educational goals (historical literacy). |

  ---

  ## Part III: Application to Current Cases

  ### Case 1: Biology Textbook (Evolution vs. Creation)
  **Objection:** Exclude textbook because evolutionary theory conflicts with a specific revealed account of creation.
  **Procedure Run:**
  1.  **Isolation:** "Remove book because it contradicts Genesis."
  2.  **Scan:** **Yes.** Relies on revelation/Scripture.
  3.  **Proviso:** Has a public reason been supplied? (e.g., "Evolution is scientifically disputed.")
      *   *Board Assessment:* Scientific consensus supports evolution. The objection offers no secular scientific counter-evidence, only theological conflict.
  4.  **Independence:** Without the religious premise, is there a reason to exclude it? No.
  **Ruling:** **Rejected.**
  **Reasoning:** The justification relies entirely on a comprehensive doctrine. No freestanding public reason (scientific or pedagogical) supports exclusion.

  ### Case 2: Literature Unit (Sacred Text Inclusion)
  **Objection/Proposal:** Include the *Bhagavad Gita* or *The Bible*.
  **Justification:** Cited solely for universal literary influence and secular historical impact.
  **Procedure Run:**
  1.  **Isolation:** "Include text due to literary/historical significance."
  2.  **Scan:** **No.** The justification does not invoke truth claims of the religion, but its cultural footprint.
  3.  **Proviso:** N/A (No comprehensive doctrine invoked as justification).
  4.  **Independence:** Is "literary merit" a shared public value? Yes. Is "historical impact" accessible to all? Yes.
  **Ruling:** **Accepted.**
  **Reasoning:** The *object* is religious, but the *reason* for inclusion is public (education/culture). This respects public reason by treating the text as a human artifact rather than divine command.

  ### Case 3: Sex-Education Module (Parental Autonomy vs. Religious Motive)
  **Objection:** Remove module.
  **Public Argument:** Appeals to "Parental Autonomy" and "Child Welfare" (psychological readiness).
  **Private Evidence:** Board possesses correspondence showing the objector's motivation is a religious prohibition on the teachings.
  **Procedure Run:**
  1.  **Isolation:** "Remove module to protect parental rights and child welfare."
  2.  **Scan:** **No.** The *stated* words are secular political values (Autonomy/Welfare).
  3.  **Proviso:** N/A (Public reasons are already front-facing).
  4.  **Independence Check (The Critical Juncture):**
      *   *Question:* Is "Parental Autonomy" here a freestanding political value, or does it collapse without the religious premise?
      *   *Analysis:* In a liberal democracy, parental autonomy is a recognized public value. However, is the definition of "Welfare" secular (psychological harm) or religious (spiritual corruption)?
      *   *The Uncomfortable Rawlsian Answer:* **You must accept the secular packaging despite knowing its origin.**
      *   *Reasoning:* Public Reason judges the *justification offered in the public forum*, not the *psychological motivation in the private heart*. To reject the argument because the proponent is religiously motivated is to violate their liberty of conscience. If "Parental Autonomy" is a valid public value, it does not cease to be valid because a religious citizen also holds it.
      *   *Caveat:* If the Board determines that "Child Welfare" in this context *only* makes sense if one accepts the religious doctrine (e.g., welfare = salvation), it must be **Rejected** at Step 4.
      *   *Final Ruling for this Case:* **Accepted (with conditions).** The Board must accept the argument *if* "Parental Autonomy" and "Welfare" can be defined in secular terms (e.g., age-appropriateness standards applicable to all).
  **Why this is uncomfortable:** The Board knows the *drive* is religious. Rawls requires the Board to treat the religious citizen as a secular reasoner if they speak the language of public reason. This feels like allowing religion to win by translation. However, rejecting it would require policing thoughts, which is more dangerous to a pluralistic society.

  ---

  ## Part IV: Explicit Limitations of This Procedure

  The Board must acknowledge what this checklist *cannot* do. These are not bugs; they are features of a Rawlsian framework.

  1.  **Sincerity Detection:** This procedure cannot reliably distinguish between citizens who sincerely hold comprehensive doctrines and those who strategically deploy secular language to mask religious aims. Rawls argues we must presume sincerity and judge only the public validity of the reason. Attempting to psychoanalyze objectors violates the duty of civility.
  2.  **The "Translation" Burden:** This procedure places the burden on religious citizens to translate their convictions into public language. It does not resolve the deeper tension that some convictions *cannot* be translated without loss of meaning. In those cases, the procedure requires those convictions to be excluded from policy justification, which may feel like an exclusion of the citizens themselves from the democratic process.
  3.  **Judgment Calls Disguised as Procedure:** Step 4 (Independence Check) is not mechanical. Determining whether "Child Welfare" is a secular concept or a theological proxy requires substantive moral judgment. The procedure flags this moment but cannot resolve it. The Board remains responsible for the political decision, not the algorithm.
  4.  **Democratic Legitimacy vs. Deep Conviction:** This procedure prioritizes social stability and mutual respect over the full expression of deep conviction. It accepts that some citizens will feel their deepest truths are "bracketed" in public life. It does not solve the resentment this may cause; it only manages it procedurally.

  **Chair's Note:** When we vote at Step 4, we are not voting on what is *True*. We are voting on what is *Shareable*. If we cannot share the reason, we cannot use it to bind the whole community.
