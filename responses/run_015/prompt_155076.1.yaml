  Subject: Re: Descartes Discourse on the Method Passage Interpretation

  Dear Friend,

  It is completely understandable why this passage gives you pause, as it sits at the precarious intersection of Descartes's metaphysics, his methodology, and his biology. To get clear on which of your invented readings fits better, we have to look closely at the specific philosophical vocabulary he is borrowing from the Scholastic tradition he claims to be leaving behind. When Descartes invokes the common opinion of philosophers that the difference of greater and less holds only among accidents and not among forms or natures, he is referencing a strict Aristotelian rule about substantial forms. In that framework, a substantial form is what makes a thing the kind of thing it is, and you cannot have more or less of a substance's essence. You are either a human or you are not, just as something is either gold or it is not gold. Qualities like height, weight, or temperature are accidents, and those can vary in degree, but the essence itself does not admit of intensity. When Descartes says reason is to be found complete in each individual and aligns this with the rule about forms, he is strongly signaling that reason is to be treated as the substantial form of humanity. This means your uniformity reading is the one supported by the text, because the mere-threshold reading would imply that reason admits of degrees within the species, which directly contradicts the Scholastic maxim he explicitly adopts. If reason could vary in degree among humans, it would be treated as an accident or a quality rather than a nature, but Descartes insists it is the nature that distinguishes us from brutes.

  This commitment to the uniformity reading does indeed commit Descartes to the claim that a human with severe cognitive disabilities possesses the same form or nature of reason as a trained philosopher, but only if we understand what he means by the location of reason. For Descartes, reason is a property of the mind or soul, which is a distinct substance from the body. When he explains away the differences in understanding among men later in the work, he attributes them to the different paths our thoughts take or the bodily instruments we use to process them, not to the reason itself. So, in his metaphysical view, the rational soul is indivisible and fully present in every human body that is united to it. The observable differences in cognitive performance are attributed to accidents, specifically the disposition of the body, the health of the brain, or the habits of thought acquired over time. He is not saying everyone has the same processing power in a modern neurological sense, but rather that everyone possesses the same essential capacity for judgment and rationality in virtue of having a human soul. The disabilities or advantages are accidental modifications of the mind-body union, not variations in the rational nature itself.

  Regarding your question about the beast-machine doctrine, the uniformity reading actually makes his later view that animals are machines more consistent rather than less. If you adopt the mere-threshold reading, you open the door to a continuum of reason where animals might possess a lower degree of the same stuff that humans have. This would blur the line between man and beast, suggesting that animals have a little bit of reason just below the human threshold. However, by insisting that reason is a form that does not admit of degrees, Descartes creates a sharp ontological cut. You either have the human form of reason, or you do not have it at all. Since animals do not meet the threshold of language and flexible action that signals the presence of this form, they must lack it entirely. There is no middle ground where they have a little bit of reason. The uniformity of reason among humans reinforces the absolute absence of reason in animals, because if reason were a scalable quantity, the distinction between the lowest human and the highest animal would be arbitrary. By making it a binary property of the species nature, he secures the logical space to claim animals are purely mechanical automata without any spark of the rational soul.

  Finally, to address your worry about whether the claim blocks the move from human accidental difference to animal essential difference, it actually facilitates that move rather than blocking it. The logic works by establishing a baseline of equality within the species to highlight the inequality between species. By arguing that all differences among humans are merely accidental, Descartes clears the ground to say that any difference that cannot be explained as an accident must be a difference of nature. Since the difference between humans and animals cannot be brushed off as an accident of upbringing or health in the same way human differences can, it must be a difference of form. The passage sets up a dichotomy where internal variation is superficial while external variation across species boundaries is fundamental. If humans differed essentially among themselves, the category of human would be fuzzy, and the contrast with animals would be weak. But because humans are essentially uniform in their rational nature, the contrast with animals, who lack that nature entirely, becomes a contrast between having a form and lacking it. This allows Descartes to maintain that while we may differ in wisdom or knowledge, we do not differ in our humanity, whereas animals differ from us in their very being. I hope this helps untangle the knots in that dense opening paragraph, as it is indeed the foundation upon which he builds his entire methodological project.

  Best regards,

