answer: |-
  This is a remarkably precise observation. You have identified a phenomenon that sits at the intersection of philosophy of language, argumentation theory, and the sociology of scientific knowledge. You are correct that the standard labels (equivocation, reification, dead metaphor) fail to capture the specific *diachronic* and *discursive* nature of the credibility transfer you are seeing.

  Here is the carving you asked for, the relationship to established concepts, and a diagnostic tool.

  ### 1. Is there an established concept?

  There is no single canonical term in the philosophy of science that captures exactly what you describe: *the diachronic transfer of epistemic warrant from a precise technical usage of a term to a looser metaphorical usage, spread across a discourse rather than located in a single argument.*

  However, your observation sits at the convergence of three established fields, each of which captures a facet but misses the whole:

  *   **Conceptual Metaphor Theory (Lakoff & Johnson):** This explains *why* the mapping exists (e.g., BIOLOGY IS TEXT). However, CMT is usually synchronic and structural. It does not account for the *epistemic economy* you noticed—how the rigor of the "narrow case" (the triplet cipher) subsidizes the vagueness of the "wide case" (gene regulation).
  *   **Diachronic Equivocation:** Argumentation theory recognizes when a term shifts meaning over the course of a debate. But you are right: this is not fallacious equivocation within an argument. It is a **discursive drift** where the community's confidence remains stable even as the definition slides.
  *   **The Halo Effect (Rhetorical):** In rhetoric, a "halo" occurs when the prestige of one attribute transfers to another. Your observation is essentially a **Terminological Halo Effect**, where the empirical success of the "Genetic Code" (cipher) casts a halo of legitimacy over "Genomic Text" (semantics).

  Because none of these fully capture the *economic* nature of the transfer (the "paying for" aspect you identified), the phenomenon requires a specific carving.

  ### 2. The Carving: "Metaphoric Subsidy"

  I propose the term **Metaphoric Subsidy**.

  **Definition:** *Metaphoric Subsidy occurs when a technical term retains its empirical credibility from a narrow, well-defined domain (the donor) while being extended into a broader, less-defined domain (the recipient), such that the rigor of the donor conceals the mechanistic gaps in the recipient.*

  **How it differs from nearby concepts:**
  *   **Vs. Equivocation:** Equivocation is a logical error within an inference. Subsidy is a sociological stability across a literature. No single inference is invalid; the aggregate understanding is distorted.
  *   **Vs. Reification:** Reification claims the metaphor is literal (e.g., "The genome *is* a book"). Subsidy allows users to remain agnostic about literalness while still drawing inferences that *require* literalness (e.g., "If it's a text, it must have an author/intent").
  *   **Vs. Constitutive Metaphor:** A constitutive metaphor (like "natural selection") becomes a technical term where the metaphorical baggage is stripped away and the mechanism is defined operationally. In Subsidy, the baggage is *kept* because it provides the explanatory power, but the mechanism is not defined operationally.

  ### 3. Does it require a sender or interpreter?

  **No.** This is the crucial distinction between *communication* and *causation*.

  Metaphoric Subsidy works most insidiously when the mechanism is purely causal but described in intentional language. It does not require a literal sender (God/evolution) or interpreter (homunculus) to get going. It runs on **structural resemblance**.
  *   **Cipher:** Requires a sender and a convention.
  *   **Causation:** Requires only physical necessity.

  The subsidy allows the *language of the cipher* to describe the *mechanics of causation* without demanding the *ontology of the cipher*. The "interpreter" is implicitly offloaded onto the machinery (polymerases), but the *normative* implications of interpretation (error, meaning, junk) sneak in with the word.

  ### 4. Benign vs. Misleading Migrations

  You asked if this can be benign. Yes. The distinction lies in **Operationalization**.

  *   **Benign (Technicalization):** The metaphor migrates, but the field quickly defines the *cash value* of the term in mechanistic ways, severing the dependency on the source domain.
      *   *Example:* **"Selection."** Darwin borrowed from animal breeding. Initially, this implied a "Selector." However, evolutionary biology operationalized "selection" as differential reproductive success. The metaphor became a technical term; the "breeder" was discarded. The subsidy was paid off.
  *   **Misleading (Parasitic):** The term migrates, but the field *retains* the source domain's implications to explain phenomena the source domain cannot cover.
      *   *Example:* **"Reading."** In molecular biology, polymerases "read" DNA. In the narrow case (translation), this maps to triplet matching. In the wide case (regulation), "reading" implies distinguishing signal from noise based on *meaning*. But chemically, it is just binding affinity. If "reading" is used to imply the cell distinguishes "junk" from "signal" based on *function* rather than *chemistry*, the subsidy is misleading.

  ### 5. The Diagnostic: The Mechanism Mapping Test

  To determine if a paragraph is relying on Metaphoric Subsidy or doing explanatory work, apply this three-step test to the metaphorical term (e.g., "code," "read," "error"):

  1.  **Isolate the Source:** What is the source domain? (e.g., Cryptography, Computing, Linguistics).
  2.  **Map the Mechanism:** Can you explicitly map the *causal machinery* of the source to the *causal machinery* of the target?
      *   *Source:* A cipher requires a key and a convention agreed upon by agents.
      *   *Target:* Does the cell have a key? Who agreed on the convention?
  3.  **The Counterfactual Removal:** Remove the metaphorical term and replace it with a purely causal description (e.g., replace "read" with "binds via hydrogen bonding").
      *   *If the inference collapses:* The term was doing **Explanatory Work** (potentially Subsidy).
      *   *If the inference holds but loses "authority":* The term was doing **Ornamental Work** (Subsidy).
      *   *If the inference holds and gains precision:* The term was **Obscuring Work** (Misleading Subsidy).

  **The Diagnostic Question:** *Does this term explain how the mechanism works, or does it explain why we should trust the mechanism exists?*
  *   If the latter, it is Metaphoric Subsidy.

  ### 6. Examples and Near-Misses

  **Case 1: Instance of Metaphoric Subsidy**
  > *Prose:* "The epigenome contains a secondary layer of **instructions** that tells the cell which parts of the genetic **text** to **ignore**."
  > *Diagnosis:* **Subsidy.**
  > *Why:* "Instructions" and "text" borrow authority from the Genetic Code (cipher). "Ignore" implies a normative choice (legal/text model). The mechanism is methylation blocking binding sites. The metaphor suggests *intent* ("tells the cell") where there is only steric hindrance. The rigor of the Genetic Code pays for the vagueness of epigenetic regulation.

  **Case 2: Instance of Metaphoric Subsidy**
  > *Prose:* "Mutations in this region are **silent** because they do not alter the **message**."
  > *Diagnosis:* **Subsidy.**
  > *Why:* "Silent" and "message" rely on the Communication model. While technically defined as "synonymous substitutions," the use of "silent" often licenses the inference that the region is functionally inert (text model), ignoring potential effects on folding speed or splicing (machine model). The "Code" aptness subsidizes the "Text" inference.

  **Near-Miss 1: Technical Operationalization (Benign)**
  > *Prose:* "The genetic **code** is degenerate, with multiple codons mapping to leucine."
  > *Diagnosis:* **Not Subsidy.**
  > *Why:* This refers strictly to the triplet-to-amino-acid mapping (the Cipher model). The term is operationally defined. No inferences about "meaning" or "reading" are drawn. The metaphor has been fully technicalized.

  **Near-Miss 2: Constitutive Metaphor (Benign)**
  > *Prose:* "Natural **selection** favors alleles that increase fitness."
  > *Diagnosis:* **Not Subsidy.**
  > *Why:* While "selection" borrows from breeding, the mechanism (differential reproduction) is fully defined without requiring a "selector." The metaphor is constitutive of the theory but does not borrow unearned authority from the source domain to explain the mechanism.

  ### Summary

  You have identified **Metaphoric Subsidy**: the economic transfer of credibility from a precise technical usage to a loose metaphorical usage across a discourse. It differs from equivocation because it is diachronic and communal; it differs from reification because it is ontologically agnostic. It is benign when the metaphor is operationalized (Selection) and misleading when the metaphor's implications outstrip the mechanism (Reading/Text).

  Your diagnostic is to ask: **Is this term describing the machinery, or is it borrowing the machinery's reputation?**
