answer: |-
  Your hypothesis is astute and aligns with a growing meta-philosophical consensus: the Mary stalemate persists not because one side is logically disproven, but because the debate has shifted from a dispute about the world (metaphysics) to a dispute about our cognitive access to the world (epistemology/semantics), without the participants agreeing on which domain they are inhabiting.

  Here is an evaluation of your hypothesis, an analysis of the proposed variant, and a diagnosis of what constitutes progress in this context.

  ### 1. Evaluating the Hypothesis: Metaphysics vs. Theory of Concepts

  Your hypothesis posits that Anti-Physicalists are doing **metaphysics of experience**, while Physicalists are doing **theory of concepts**. The textual evidence supports this strongly.

  **The Anti-Physicalist (Metaphysics):**
  *   **Claim:** Mary learns a new *fact*.
  *   **Underlying Commitment:** They treat "knowledge" as a relation between a subject and a truth-maker in the world. If Mary's propositional knowledge was complete regarding the physical, and she learns something new, the truth-maker of that new knowledge cannot be physical.
  *   **Focus:** Ontology. They are arguing about what *exists* (qualia as non-physical properties). When they say "physicalism is false," they mean the inventory of the universe contains non-physical items.

  **The Physicalist (Theory of Concepts/Epistemology):**
  *   **Claim:** Mary gains a new *ability* (Nemirow/Lewis), a new *acquaintance* (Conee), or a new *phenomenal concept* (Loar/Tye).
  *   **Underlying Commitment:** They treat "knowledge" as a cognitive mode of access. They argue that the *fact* remains physical, but the *way Mary grasps it* changes.
  *   **Focus:** Semantics and Cognitive Architecture. They are arguing about how brains represent states. When they say "physicalism is true," they mean all facts are grounded in physical properties, even if our conceptual apparatus distinguishes them.

  **Verdict on Hypothesis:**
  Your diagnosis is correct. The stalemate occurs because the Anti-Physicalist asks, "Is there a new property in the world?" and the Physicalist answers, "Is there a new way of thinking about an old property?" Both answer "Yes," but they treat the "Yes" as mutually exclusive rather than compatible descriptions of different levels of analysis.

  ### 2. Testing the Diagnosis: The Perfect Brain Simulation Variant

  **The Variant:** Mary is confined. She possesses a perfect simulation of her own brain. She can run the simulation to see exactly how her neural architecture responds to red light. She knows the causal dynamics, the functional output, and the internal state of "her" (the simulated brain) experiencing red. She does not, however, experience red herself in the room. She is released and sees red.

  **What Each Side Should Say:**

  *   **The Anti-Physicalist:**
      *   **Claim:** She *still* learns something new.
      *   **Reasoning:** The simulation provides third-person structural/functional knowledge. Even knowing the physical state *that realizes* the experience is not the same as the experience itself. The "what-it-is-like-ness" is an intrinsic property that cannot be captured by extrinsic simulation data.
      *   **Implication:** This strengthens their metaphysical claim. It blocks the Physicalist reply that she lacked information about the *external* physics. Here, she has the internal physics (her own brain) and still lacks the experience. This suggests the gap is not just about information access, but about the nature of the state itself.

  *   **The Physicalist:**
      *   **Claim:** She learns no new *facts*, but acquires a new *perspective* (or, in Dennett's harder line, she is mistaken that she learns anything).
      *   **Reasoning:** If physicalism is true, the experience *is* the brain state. If she knew the brain state exhaustively via simulation, she knew the experience exhaustively. The feeling of "newness" upon release is the activation of a direct perceptual conceptual system replacing a theoretical simulation system.
      *   **Implication:** This forces the Physicalist to lean heavily into the **Phenomenal Concept Strategy (PCS)**. They must argue that the simulation utilizes "theoretical concepts" while the experience utilizes "phenomenal concepts," and these are distinct cognitive vehicles referring to the same physical referent.

  ### 3. What This Reveals About the Disagreement

  The reaction to the variant reveals that the disagreement is not merely semantic, nor is it purely about evidence. It is a clash of **frameworks regarding the Explanatory Gap.**

  **A. Meaning of "Physical" and "Knowledge"**
  The variant exposes that the two sides define "Complete Physical Knowledge" differently.
  *   For the **Anti-Physicalist**, "Complete Physical Knowledge" means knowing all third-person descriptions. If the first-person perspective isn't derivable from that, physicalism is incomplete.
  *   For the **Physicalist**, "Complete Physical Knowledge" includes the first-person perspective *if* that perspective is constituted by the physical.
  *   **Revelation:** The dispute is about **Identity**. Anti-physicalists intuit that Experience $\neq$ Brain State (Leibniz's Law). Physicalists intuit that Experience $=$ Brain State (Type Identity or Functional Realization). The variant shows that even knowing the Brain State perfectly doesn't bridge the intuitive gap for the Anti-Physicalist.

  **B. Standards of Evidence**
  *   **Anti-Physicalists** rely on **Phenomenological Intuition**: "It *seems* to Mary that she learns something; therefore, she does." They treat the intuition as a datum that theory must save.
  *   **Physicalists** rely on **Theoretical Parsimony/Causal Closure**: "We have no evidence for non-physical causation; therefore, the intuition must be explained away." They treat the intuition as a cognitive bug to be explained.
  *   **Revelation:** There is no neutral arbiter. One side prioritizes the manifest image (experience); the other prioritizes the scientific image (causal closure).

  **C. Irreconcilable Starting Intuitions**
  The variant suggests the disagreement is foundational.
  *   If Mary knows her own brain state perfectly and *still* learns something, the Anti-Physicalist sees this as proof of **Non-Reductivity**.
  *   The Physicalist sees this as proof of **Cognitive Opacity** (the brain cannot fully simulate its own experience from the outside, even with perfect data, due to architectural constraints).
  *   **Revelation:** This is not a disagreement that can be solved by more data. It is a disagreement about whether the "gap" is ontological (in the world) or epistemological (in the mind).

  ### 4. What Would Count as Progress?

  Since the stalemate arises from framework incommensurability, "progress" will not look like a knockout argument where one side concedes. Instead, progress involves **triangulation** and **refinement**.

  **1. Semantic Disambiguation (The "Fact" Distinction)**
  Progress occurs when both sides explicitly distinguish between **Facts** (truth conditions) and **Propositions** (modes of presentation).
  *   *Progress:* Agreeing that Mary gains no new *truth-conditional fact* (the world didn't change) but gains a new *cognitive proposition* (her mental file on red changed). This validates the Physicalist's ontology while respecting the Anti-Physicalist's phenomenology.

  **2. The Phenomenal Concept Strategy (PCS) Refinement**
  The most promising physicalist route is to flesh out *why* phenomenal concepts are unique.
  *   *Progress:* Providing a detailed cognitive science account of how "simulation mode" differs from "experience mode." If we can map the neural correlate of the "aha!" moment Mary has upon release, we naturalize the intuition without positing dualism.

  **3. Embracing Non-Reductive Physicalism or Russellian Monism**
  The variant pushes hard physicalism to the brink. If knowing the physical structure isn't knowing the experience, perhaps the "intrinsic nature" of the physical is experiential.
  *   *Progress:* Moving the debate from "Physicalism vs. Dualism" to "Structural Physicalism vs. Russellian Monism." This accepts the Anti-Physicalist's intuition (there is something missing from structural physics) without accepting substance dualism.

  **4. Illusionism**
  The most radical progress is denying the datum.
  *   *Progress:* If proponents like Keith Frankish can demonstrate that "phenomenal consciousness" is a user-illusion generated by the brain, the Knowledge Argument dissolves. Mary doesn't learn a new fact; she drops a false model.

  ### Conclusion

  Your hypothesis is correct: the stalemate is a category error. The Anti-Physicalist is arguing from the **Phenomenological Frame** (what it feels like), and the Physicalist is arguing from the **Causal/Structural Frame** (how it works).

  The Brain Simulation Variant proves that providing more structural data (even about the subject's own brain) does not close the phenomenological gap. This reveals that the disagreement is not about evidence, but about **whether the phenomenological gap is evidence of an ontological gap.**

  Progress will not come from proving the other side wrong, but from developing a **meta-theory** that explains why a purely physical system would inevitably generate the *illusion* of a metaphysical gap (Illusionism) or a metaphysics that integrates intrinsic experience into the physical base (Russellian Monism). Until the debate shifts from "Is Physicalism True?" to "Why does Physicalism *feel* False to a conscious observer?", the stalemate will remain.
