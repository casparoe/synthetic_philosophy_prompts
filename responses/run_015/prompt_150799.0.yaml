      The Director invokes Berkeley to argue that wealth is industry, not coin, and thus our cash backing is superstitious hoarding. But Berkeley's monetary theory is independent of his immaterialism. You need not believe matter is nonexistent to agree money is a token of trust; a thoroughgoing materialist can sign onto credit theory. The Director uses metaphysics as decoration for a velocity argument: forcing spending via decay.

      However, Berkeley's argument fails when scaled from a kingdom to a spreadsheet. He proposed a national bank backed by the land and industry of a sovereign state with taxing power. We are 200 volunteers. A national currency works because the state demands it for taxes and enforces its acceptance. Our hours work only because members trust they can exit the system for dollars when necessary. Removing the exit ramp transforms the hour from currency into a closed-loop voucher.

      This validates the Treasurer's strongest case: this plan is regressive. The members most likely to accumulate large hour balances are those unable to convert labor into dollars elsewhere—the elderly, the underemployed, those precariously housed. They use hours as savings because they cannot save cash. A 1% monthly decay is a tax on poverty. The Bakery case proves the system's limits: the state demands dollars for taxes. If we cannot provide dollars, members facing external obligations will flee the network at the first sign of instability.

