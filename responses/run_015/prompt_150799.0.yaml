  The Director invokes Berkeley to argue wealth is industry, not coin, making cash backing superstitious hoarding. But Berkeley's monetary theory is independent of his immaterialism. You need not believe matter is nonexistent to agree money is a token of trust; a thoroughgoing materialist can sign onto credit theory. The Director uses metaphysics as decoration for a velocity argument: forcing spending via decay. Berkeley's *Querist* aimed to mobilize idle labor through credit, not to remove backing entirely. He sought confidence in paper, not confidence without anchors; his national bank would issue notes against land, not into a void.

  However, Berkeley's argument fails when scaled from a kingdom to a spreadsheet. He proposed a national bank backed by the land and industry of a sovereign state with taxing power. We are 200 volunteers. A national currency works because the state demands it for taxes and enforces its acceptance. Our hours work only because members trust they can exit the system for dollars when necessary. Removing the exit ramp transforms the hour from currency into a closed-loop voucher. Without sovereign enforcement, our "credit" relies entirely on the cash peg. A national bank can legislate value; we can only promise it.

  This validates the Treasurer's strongest case: this plan is regressive and structurally unstable. The members most likely to accumulate large hour balances are those unable to convert labor into dollars elsewhere—the elderly, the underemployed, those precariously housed. They use hours as savings because they cannot save cash. A 1% monthly decay is a tax on poverty, turning the hour into a gift certificate with extra steps, as the Treasurer noted. Gift certificates are liabilities for the issuer, assets for the holder that decay. This inverts the purpose of a savings vehicle. By imposing expiration, we penalize those who rely on us as a safety net. Furthermore, it creates power asymmetry: large providers like the Plumbing Co-op can set shadow rates, while individual savers absorb the loss. The Bakery case proves the system's limits: the state demands dollars for taxes. If we cannot provide dollars, members facing external obligations will flee the network at the first sign of instability, triggering a run we cannot cover.

  The Plumbing Co-op's 20% adjustment is not a discount; it is a shadow exchange rate. By valuing hours at 80% of their dollar price, they signal that the market perceives our currency as depreciated relative to cash. If we remove the redemption window, this shadow rate becomes the real rate. We risk a two-tier economy where vulnerable members hold depreciating hours while essential services demand cash.

  Berkeley asked whether a bank issuing paper would do Ireland more good than coin in chests. For a nation, perhaps. For a time bank, the coin in the chest is the only thing proving the paper isn't fiction. Keep the reserve, cap the exposure, and monitor the tripwire.
