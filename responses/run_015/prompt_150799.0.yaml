      *   **Requirements:**
          1.  Recommendation in first two sentences (real, actionable, phase-in, tripwire for 3 months).
          2.  Reasoning including strongest version of Treasurer's case.
          3.  Address Berkeley: Does his credit argument depend on immaterialism? (Is it independent metaphysics?)
          4.  Address Scale: Does the argument survive scaling down from kingdom/national bank to 200 members/spreadsheet?
          5.  Address Plumbing Co-op: Is the 20% a discount, shadow exchange rate, or nothing?
          6.  Audience: Board members (haven't read Berkeley).
          7.  Constraint: 600 words hard ceiling.

  2.  **Deconstruct the Arguments:**
      *   **Director:** Berkeleyan. Money is credit/command, not metal. Reserve is unnecessary hoarding. Decay/caps force circulation.
      *   **Treasurer:** Practical risk. Reserve provides liquidity/security. Decay/caps punish savers (vulnerable). Bakery needs cash conversion for taxes. Plumbing co-op arbitrage.
      *   **Berkeley Question:** Berkeley's immaterialism ("esse est percipi") is metaphysical. His monetary theory (wealth is industry, paper credit works if trusted) is economic. They are largely independent. A materialist can agree money is a token of trust.
      *   **Scale Question:** National bank vs. 200 members. A national bank has taxing power and legal tender status. A time bank has voluntary participation and limited convertibility. Scaling down removes the sovereign backing that makes fiat/credit stable.
      *   **Plumbing Co-op:** 20% off dollar prices for hours. This implies an exchange rate. If hours are supposed to be 1:1 with labor value, but plumbing accepts them at a discount relative to their dollar rate, it suggests hours are worth less than dollars, or they are incentivizing hours to clear backlog. It's a shadow exchange rate.

