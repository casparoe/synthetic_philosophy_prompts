answer: |-
  This is a bold thesis. It positions you against the standard "Action-Theoretic" reading of Anscombe (which dominates the literature) in favor of a "Substantive Justice" reading. For a physicist-turned-philosopher, this is a high-risk, high-reward move: it offers clarity, but it risks appearing to ignore the text of *Intention*.

  Here is your Q&A prep sheet, ranked by the potential damage to your credibility and thesis.

  ### Part 1: The State of the Literature (Settled vs. Contested)

  You asked for explicitness here. Do not gloss this. If you present a contested reading as settled, the three DDE specialists will eat you alive in the first five minutes of Q&A.

  **Settled Consensus:**
  *   Anscombe publicly opposed the honorary degree for Truman in 1956.
  *   She characterized the atomic bombings as the deliberate killing of the innocent.
  *   She believes there are absolute moral prohibitions that cannot be overridden by consequences (anti-consequentialism).
  *   She is the modern godmother of the Doctrine of Double Effect (DDE). Her monograph *Intention* is the primary text for DDE in analytic philosophy.

  **Live Interpretive Fights (Your Battleground):**
  *   **The Role of DDE in the Truman Case:** The standard view (e.g., Quinn, Foot, early Thompson) is that Anscombe's objection to Truman rests *essentially* on the DDE (he *intended* civilian death). Your view (that DDE is descriptive, not justificatory, and the real work is done by a claim about *authority*) is a minority but respected reading (closer to the "Natural Law" interpreters like Haldane or certain Catholic moral theologians).
  *   **The Scope of "Innocent":** Whether Anscombe's definition of "innocent" excludes all non-combatants or only those not materially engaged in unjust aggression.
  *   **The Source of the Prohibition:** Is it a rule of practical rationality (DDE) or a substantive claim about human goods and authority (Natural Law/Divine Command)? You are arguing the latter.

  **Advice:** Open your talk by acknowledging the standard DDE reading. Say: *"Standard scholarship treats this as a case study in the intending/foreseeing distinction. I want to suggest that treats the symptom as the cause."* This inoculates you against charges of ignorance.

  ---

  ### Part 2: Q&A Prep Sheet

  **Ranking Key:**
  *   **Damage:** High (Threatens coherence/credibility), Med (Threatens applicability), Low (Threatens comfort).
  *   **Voice:** Phrased in the specific jargon of the questioner.

  #### 1. The DDE Specialists (The Textual Objection)
  *   **Damage:** High. If you get the text wrong, you lose the room.
  *   **The Question:** "Anscombe's *Intention* is the definitive defense of the intending/foreseeing distinction. In 'Mr. Truman's Degree,' she explicitly contrasts the *policy* of area bombing (intending civilian death) with legitimate warfare. By claiming the double-effect machinery is 'doing no work,' aren't you simply ignoring her own action-theoretic framework? Isn't the *mens rea* the whole point for her?"
  *   **Concede:** Anscombe uses the language of intention and foresight. She does not deny the distinction exists.
  *   **Hold:** The distinction *describes* the act, but it does not *license* it. The license is withheld by the authority claim.
  *   **2-Minute Answer:** "I'm not saying the distinction is false; I'm saying it's insufficient. You can have a clean intention—say, destroying a radar station—and still lack the *authority* to do it if the cost is the lives of those who have forfeited no right to life. Anscombe's DDE tells you whether an act is murder or manslaughter; her claim about authority tells you whether you have the standing to kill at all. In the Truman case, and the 'clean raid' case, the problem isn't just the mental state; it's that no consequentialist calculus can grant the authority to trade innocent lives for strategic gain. The DDE is the microscope; the authority claim is the law."
  *   **Weakest Point:** You must explain why Anscombe spends so much time on intention if it's not the primary justification. If you say it's "secondary," they will ask for textual evidence ranking the arguments.

  #### 2. The War Studies Scholars (The "Clean Case" Objection)
  *   **Damage:** High. This attacks your "bite the bullet" claim and practical relevance.
  *   **The Question:** "We teach officers that collateral damage is tragic but permissible under proportionality. You're saying a precision strike on a legitimate military target is morally identical to Hiroshima if there's collateral death? If you remove the intending/foreseeing distinction as a moral firewall, you collapse the Law of Armed Conflict. Are you arguing that *no* kinetic action is permissible in a populated area? That's not just pacifism; it's unilateral disarmament."
  *   **Concede:** This makes war fighting incredibly difficult, perhaps impossible in modern contexts. It does disrupt current ROE (Rules of Engagement).
  *   **Hold:** Current ROE might be masking moral crimes. Difficulty does not equal impossibility.
  *   **2-Minute Answer:** "I am arguing that the 'clean case' is often morally contaminated, not that all war is impossible. If the only way to destroy the aircraft plant is to accept the death of the shanty town families, then you do not have the authority to destroy the plant. That sounds like unilateral disarmament, but it's actually a constraint on *method*. It forces the question: Is this target worth the *certain* death of non-combatants? Current proportionality calculus treats their deaths as a 'cost' to be weighed. Anscombe treats their right to life as a 'constraint' that cannot be weighed. If that makes war harder, perhaps war *should* be harder."
  *   **Weakest Point:** The "Shanty Town" case. If the enemy *placed* the shanty town there to shield the plant, does the authority claim shift? You need a position on human shields, or they will trap you there.

  #### 3. The Consequentialist (The "Body Count" Objection)
  *   **Damage:** Med. Easy to parry if you stay deontological, but highlights the cost of your view.
  *   **The Question:** "Let's grant the authority claim. But if refusing the raid leads to a prolonged war where ten times as many civilians die, doesn't your prohibition become a license for greater slaughter? You're prioritizing the purity of the agent's authority over the actual survival of the people you claim to protect."
  *   **Concede:** On your view, the agent may be required to accept a worse outcome to avoid committing a moral wrong.
  *   **Hold:** You cannot commit a moral wrong (killing the innocent) to prevent a tragedy (more deaths).
  *   **2-Minute Answer:** "This is the exact calculus Anscombe rejects. You are asking me to commit a specific injustice (killing the innocent families) to prevent a future tragedy. For Anscombe, justice is not a numbers game. If I kill the families, *I* have murdered them. If the war continues, *the enemy* has prolonged it. I am responsible for my acts, not for the enemy's response to my restraint. To say I must kill the innocent to save others is to claim an authority over human life that no human possesses."
  *   **Weakest Point:** It sounds quietist. If the audience feels the "greater evil" is palpable (e.g., genocide), your position may look morally frail.

  #### 4. The Historian (The "Context" Objection)
  *   **Damage:** Low/Med. They care about facts; you care about principles.
  *   **The Question:** "You're treating 'Hiroshima' as a philosophical token. But in 1945, the alternative wasn't a 'clean raid.' It was Operation Downfall—invasion of the home islands. Estimates vary, but hundreds of thousands would have died. Truman wasn't weighing 'innocents vs. strategy'; he was weighing 'innocents vs. more innocents.' Does your authority claim survive a genuine dilemma where everyone dies?"
  *   **Concede:** The historical alternatives were grim. Counterfactuals are messy.
  *   **Hold:** The moral principle holds regardless of the specific historical pressure.
  *   **2-Minute Answer:** "I'm not defending Truman's specific decision-making process; I'm defending Anscombe's principle. Even in a dilemma, the prohibition on directly targeting or trading the innocent remains. If the only options are 'kill innocents' or 'risk massive casualties in invasion,' Anscombe would say you cannot choose the former. You must choose the path that does not involve *you* making the innocent the means to an end. It's a terrible position to be in, but morality doesn't vanish just because the options are bad."
  *   **Weakest Point:** The Historian will hate the "counterfactual" dismissal. They will press that the "trade" was real, not theoretical.

  #### 5. The Question You Hope Nobody Asks (The "Source of Authority" Objection)
  *   **Damage:** Critical. If you can't answer this, the "Authority" claim floats in mid-air.
  *   **The Question:** "You keep saying 'nobody has the authority.' Where does authority come from, then? For Anscombe, isn't this grounded in Divine Law or a specific teleology of human nature? If you strip out the theology, what's left? Are you asserting a brute fact that we just *can't* do this, without saying *why*?"
  *   **Concede:** Anscombe's full system is theological.
  *   **Hold:** The philosophical core (human rights/justice) can be decoupled from the theology for the sake of the argument.
  *   **2-Minute Answer:** "Anscombe was a Catholic, yes, and she grounds the law in God. But the philosophical claim stands on the concept of *justice* as a human good. To treat a human being as a resource to be expended is to deny their status as an end in themselves. You don't need the theology to see that 'killing the innocent for the greater good' treats persons as units of value rather than subjects of rights. I'm arguing that the *structure* of her argument works even if you bracket the Divine Law premise, because it rests on the incommensurability of human life and strategic value."
  *   **Weakest Point:** Secular philosophers (like the Consequentialist and maybe some DDE folks) will press that without God or a robust Natural Law metaphysics, "incommensurability" is just an intuition.

  ---

  ### Part 3: Tactical Advice for the Physicist

  1.  **Don't Overclaim on "Work":** When you say DDE does "no work," the DDE specialists will hear "DDE is false." Refine this. Say: *"DDE does no *licensing* work."* It distinguishes types of killing, but it doesn't authorize the killing. That precision will save you.
  2.  **The "Clean Raid" Bullet:** You said you want to bite the bullet that the precision raid fails. Be careful. The War Studies folks will ask if *any* raid is possible.
      *   *Preparation:* Distinguish between **Collateral Damage** (foreseen, unintended) and **Collateral Cost** (treated as expendable). Anscombe's point is often that we treat the lives as a *cost* in the calculation. If you treat them as a *constraint* (i.e., "I cannot proceed if this happens"), you might pass her test. If you treat them as a *trade* ("50 civilians is acceptable for this target"), you fail. Make this distinction clear.
  3.  **Manage the "Pacifist" Label:** The War Studies folks will tag you as a pacifist.
      *   *Preparation:* "I am not arguing that force is never permissible. I am arguing that *this justification* (killing innocents for the many) is never permissible. There may be just wars, but they cannot be fought on utilitarian grounds."
  4.  **Handling the Historian:** Do not get dragged into 1945 statistics.
      *   *Phrase:* "I am analyzing the *moral structure* of the justification, not the historical necessity. Even if Truman was right factually, Anscombe asks if he was right *morally*."

  ### Summary of Your "Hard Line"
  Your core commitment is: **Human beings are not fungible resources.**
  Any argument that treats them as resources (even to save others) lacks authority.
  DDE is just the tool we use to check if we are treating them as resources intentionally or accidentally. But even accidental treatment (via proportionality calculus) fails if it treats their death as a "price paid."

  Good luck. This is a strong, clear argument, provided you don't let them pin you on the textual interpretation of *Intention*. Keep the focus on *Mr. Truman's Degree* and the concept of Justice.
