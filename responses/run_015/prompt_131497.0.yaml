prompt: |-
  I'm a retired experimental physicist who got into philosophy about four years ago, and next month I'm giving a 25-minute talk plus Q&A at the joint ethics seminar at the univerity here. My thesis: Anscombe's 1956 campaign against Oxford giving Truman an honorary degree has nothing essentially to do with the intending-versus-foreseeing distinction — the double-effect machinery people keep bolting onto it is doing no work — and what actually carries the charge is her claim that nobody has the authority to kill people who have themselves done nothing, for the good of everyone else. If that's right then the argument doesn't stop at Hiroshima; it also sticks to a precision raid on an aircraft-components plant where the workers' families live in a shanty town fifty metres outside the perimeter fence, which is exactly the sort of case everyone treats as the clean contrast case. I want to bite that bullet. Sketch: (1) the double-effect apparatus only ever redescribes what the agent is up to, it doesn't license it; (2) the licensing in these cases comes from an implicit appeal to supreme emergency / the good of the many, which is the thing she is denying; (3) so if (2) fails, the "clean" raid fails with it, and there's no principled place to stop short of something close to pacifism.

  Audience: three moral philosophers who publish on double effect and just war, one straight consequentialist, two people from war studies who teach this material to serving officers and think in terms of proportionality and military necessity, and one historian of the Pacific war who will have no patience with counterfactuals.

  Write me a Q&A prep sheet: the objections I'll actually get from this bunch, in the order they'll come at me, phrased the way each of them would phrase it rather than in my vocabulary, ranked by how much damage they'd do. For each: what I should concede up front, what I have to hold, a two-minute answer, and where that answer is softest. Include the question I'm hoping nobody asks.

  Last thing: be explicit about which claims about Anscombe's argument are settled among people who really know that literature and which are live interpretive fights. I don't want to stand up and present a contested reading of her as if it were the standard one.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired experimental physicist, turned philosopher (4 years). This suggests precision, clarity, dislike of hand-waving, but perhaps less familiarity with the specific dialectical norms of professional ethics seminars. They want practical, hard-hitting prep.
      *   **Topic:** G.E.M. Anscombe's 1956 protest against Truman's honorary degree.
      *   **Thesis:** The Intention/Foresight (Double Effect - DDE) distinction is *not* the core of Anscombe's argument. The core is the *authority* claim (no one has authority to kill the innocent for the greater good). This implies a stronger conclusion (near-pacifism) than standard DDE readings, catching "clean" cases (precision raids with collateral damage) in the net.
      *   **Format:** 25-min talk + Q&A.
      *   **Audience:**
          1.  3 Moral Philosophers (DDE/Just War specialists).
          2.  1 Consequentialist.
          3.  2 War Studies Scholars (teach officers, focus on proportionality/necessity).
          4.  1 Historian of Pacific War (no patience for counterfactuals).
      *   **Deliverable:** Q&A Prep Sheet. Objections ordered by damage potential, phrased in *their* vocabulary. For each: Concessions, Hard Lines, 2-min Answer, Weakest Point. Plus: "The Question I Hope Nobody Asks." Plus: Clarification on settled vs. contested Anscombe scholarship.

  2.  **Deconstruct the Thesis & Potential Vulnerabilities:**
      *   *Thesis:* Anscombe $\neq$ DDE; Anscombe = Authority/Innocence.
      *   *Vulnerability 1 (Textual):* Anscombe *does* talk about intention. In "Mr. Truman's Degree," she explicitly contrasts intending to kill vs. foreseeing death. Ignoring this looks like bad scholarship.
      *   *Vulnerability 2 (Normative):* If DDE is out, what replaces it? The "Authority" claim is huge. If *nobody* has authority, does that rule out self-defense? Police action? It looks like absolute pacifism, which is a hard sell to War Studies folks.
      *   *Vulnerability 3 (Practical):* War Studies folks care about *rules of engagement*. If you remove DDE, you remove the tool officers use to distinguish murder from tragedy.
      *   *Vulnerability 4 (Historical):* The Historian will ask about the actual context of 1945. Was it really "killing the innocent" or "ending a war"?
      *   *Vulnerability 5 (Consequentialist):* If the "greater good" doesn't license it, what does? Millions die if you don't bomb.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The DDE Specialists):* They will pounce on the textual claim. "You're ignoring the text." This is high damage because it undermines the speaker's credibility on Anscombe.
      *   *Objection 2 (The War Studies/Officers):* They care about the "clean case." If the precision raid is immoral, what *is* moral? This attacks the practical implication. High damage to the "bite the bullet" claim.
      *   *Objection 3 (The Consequentialist):* "You're ignoring the numbers." Standard utilitarian pushback. Moderate damage, easier to parry if the thesis is deontological.
      *   *Objection 4 (The Historian):* "Truman didn't know/It ended the war." Attacks the factual premise. Moderate damage, but can be sidestepped by focusing on the *principle* rather than the historical verdict.
      *   *Objection 5 (The "Hope Nobody Asks"):* Something that collapses the distinction between "innocent" and "combatant" or asks about the definition of "authority." Let's go with the definition of "innocent" or the source of "authority." Actually, the best "killer question" is usually about *self-defense*. If I can't kill an innocent to save a million, can I kill an aggressor to save one? If the answer is no, you're a pacifist. If yes, why is the authority different?

  4.  **Refining the Answers (Physicist-to-Philosopher Translation):**
      *   Need to ensure the answers are rigorous but acknowledge the nuance.
      *   *Concession:* Acknowledge Anscombe uses DDE language.
      *   *Hold:* DDE is a *symptom*, not the *cause*. The cause is the prohibition on utilitarian killing.
      *   *War Studies:* Acknowledge the pain. The "clean case" isn't clean if the authority is missing.
      *   *Historian:* Agree on facts, pivot to moral evaluation.

  5.  **Addressing the "Settled vs. Contested" Scholarship:**
      *   *Settled:* Anscombe opposed the degree. She opposed Truman's decision. She invoked the killing of the innocent.
      *   *Contested:* Is DDE the *foundation* or just a *tool*? Is she a pacifist? What is the source of the prohibition (Natural Law vs. Divine Command vs. Human Flourishing)?
      *   *Key Reference:* The user needs to know that reading Anscombe as *anti-DDE* is controversial. Most see her as a *champion* of DDE (e.g., *Intention*). The user's reading is revisionist. This needs to be flagged clearly.

  6.  **Developing the Content (Drafting the Response):**

      *   *Intro:* Acknowledge the boldness of the thesis.
      *   *Section 1: Scholarship Status.* Be honest. The "Anscombe = DDE Queen" view is standard. The "Anscombe = Authority/Innocence" view is a specific, newer, or niche reading (e.g., related to Connelly, Thompson, or Ford).
      *   *Section 2: Q&A Prep.*
          *   *Q1 (DDE Specialists):* "You're rewriting her." *Strategy:* Concede text, hold on structure.
          *   *Q2 (War Studies):* "You've broken the military tool." *Strategy:* Bite the bullet. The tool was masking the crime.
          *   *Q3 (Consequentialist):* "Body count." *Strategy:* Reject the calculus.
          *   *Q4 (Historian):* "Context." *Strategy:* Principle over history.
          *   *Q5 (Hope Nobody Asks):* "Who counts as innocent?" or "Self-Defense." Let's go with "Self-Defense/Aggressor" because it tests the authority claim.
      *   *Section 3: Physicist Advice.* Keep it empirical. Don't overclaim.

  7.  **Review against Constraints:**
      *   *Tone:* Professional, respectful, rigorous.
      *   *Audience:* Specific objections for specific personas.
      *   *Format:* Q&A prep sheet style.
      *   *Constraint:* "Phrased the way each of them would phrase it." (Crucial).
      *   *Constraint:* "Ranked by damage."
      *   *Constraint:* "Settled vs. Contested."

  8.  **Final Polish:**
      *   Make sure the distinction between *Intention* and *Authority* is clear.
      *   Ensure the "clean raid" implication is addressed (this is the user's specific bullet to bite).
      *   Check the "Settled/Contested" section for accuracy regarding Anscombe scholarship (e.g., referencing *Intention* vs. "Mr. Truman's Degree"). *Self-Correction:* Actually, Anscombe is famously associated with DDE. To say DDE does "no work" is a strong revisionist claim. I need to make sure the user knows this is the hill they might die on. The "Authority" argument is often associated with her later work or specific readings of her Natural Law theory. I should point them to the "murder vs. killing" distinction.

      *(Self-Correction on Scholarship)*: It is widely accepted that Anscombe *uses* DDE. The user's claim is that DDE is *not the justification* but a *descriptor*. This is a subtle but vital distinction. The "Authority" claim is rooted in her view of *justice* rather than just *action theory*. I need to make sure the "Settled/Contested" section reflects that this is a *live interpretive fight*, not settled dogma.

      *(Refining the "Hope Nobody Asks")*: The most dangerous question for an Anscombe interpreter who downplays DDE is: "If intention doesn't matter, why isn't this just a ban on killing *simpliciter*?" Or, "Where does the authority come from?" Let's go with the Source of Authority. If it's God, secularists reject it. If it's reason, consequentialists reject it.

      *(Refining the War Studies Objection)*: They will ask about "Military Necessity." Anscombe rejects "Necessity" as a trump card. The user needs to be ready to say "Necessity doesn't create Authority."

      *(Final check on tone)*: The user is a physicist. They value precision. Avoid waffle.

      *(Let's assemble the response).*

      *Wait, one more check on the "Settled vs Contested".*
      Settled: She opposed the degree. She thought Truman was a murderer. She thought the bombings were the killing of the innocent.
      Contested: Whether her objection rests *solely* on DDE or on a broader theory of justice/authority. Many scholars (e.g., Roger Teichmann, Mary Tjiattas) emphasize the DDE. Others (e.g., John Haldane, or readings focusing on her Catholicism/Natural Law) emphasize the sanctity of life/authority. The user's reading aligns with the "Sanctity of Life/Justice" camp against the "Action Theory" camp. This is definitely a live fight.

