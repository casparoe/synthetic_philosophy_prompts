  ### Research Agenda: The Coherence of Neurath's Visual Physicalism

  **Ranked Ordering:**
  1.  **(b)** Reconciliation of ISOTYPE with Physicalist Protocol-Sentence Theory.
  2.  **(a)** Metaphysical Commitments Regarding Resemblance and Representation.
  3.  **(c)** Failure Conditions and Interpretive Ambiguity.
  4.  **(d)** Contemporary Portability and Transplantation.

  ---

  ### 1. Priority One: Protocol Reconciliation (Inquiry b)
  **Rationale:** This inquiry is the **functional upstream anchor** of the entire project. While general questions about visual metaphysics (a) are logically prior in the abstract, they are intractable within a three-year window if pursued independently. By prioritizing (b), we bound the inquiry to Neurath's specific philosophical architecture. We are not asking "Can images ever be physicalist?" but "Does *Neurath's specific definition* of a protocol sentence allow for *his specific design* of ISOTYPE?" This utilizes the full team: the historian secures the textual fidelity of Neurath's evolving definition of "protocol," while the philosophers of science test the systematic coherence of that definition against the visual syntax.

  *   **Upstream/Downstream Logic:** (b) is upstream because it establishes the **criteria of success** for the remaining inquiries. We cannot determine if ISOTYPE avoids metaphysics (a) or fails due to ambiguity (c) until we define what a "successful physicalist protocol" looks like in this specific context. If (b) yields a negative result (irreconcilable tension), inquiries (c) and (d) shift from reconstruction to autopsy.
  *   **Feasible Conceptual Result (Year 1-2):** A formalized mapping of ISOTYPE syntactic rules onto Neurath's physicalist verification conditions. The deliverable is a definitive determination: either ISOTYPE functions as a "coordination" mechanism consistent with physicalism, or it functions as a "translation" mechanism that violates it.
  *   **Reordering Trigger:** If the historical analysis reveals that Neurath explicitly abandoned the requirement for ISOTYPE to function as *protocol sentences* in his later work (shifting instead to pedagogy or agitation), priority must immediately shift to **(c)**. In that scenario, the philosophical tension dissolves, and the project becomes an analysis of the limits of visual pedagogy rather than empirical verification.

  ### 2. Priority Two: Metaphysical Commitments (Inquiry a)
  **Rationale:** Once the criteria for a "visual protocol" are established via (b), we must analyze the ontological status of the medium. This inquiry is **theoretically upstream but methodologically downstream**. It is theoretically upstream because if pictograms inherently rely on resemblance (a metaphysical commitment), they cannot satisfy the physicalist criteria defined in (b). However, it is methodologically downstream because we only analyze resemblance *to the extent that it impacts the protocol function*. This prevents the project from drifting into general aesthetics or semiotics, keeping the focus on scientific representation.

  *   **Upstream/Downstream Logic:** (a) is downstream of (b) because the "metaphysical commitment" is only a problem if it violates the physicalist criteria established in (b). It is upstream of (c) because the *source* of ambiguity (c) often lies in the tension between convention and resemblance (a).
  *   **Feasible Conceptual Result (Year 2):** A taxonomy of "Operational Resemblance" vs. "Ontological Resemblance" within ISOTYPE. The team will demonstrate whether Neurath's convention-based design successfully suppresses ontological resemblance or merely masks it.
  *   **Reordering Trigger:** If the analysis demonstrates that *all* visual representation, including ISOTYPE, necessarily entails a minimal metaphysical commitment to resemblance that cannot be conventionalized away, priority must shift to **(d)**. If the "purge" of metaphysics is impossible, the most valuable output becomes a framework for how contemporary science can *manage* these inevitable commitments, rather than trying to eliminate them.

  ### 3. Priority Three: Failure Conditions (Inquiry c)
  **Rationale:** This inquiry serves as the **stress test** for the conclusions of (b) and (a). Once we know what the system is supposed to do (b) and what the images ontologically are (a), we determine where the system breaks. Is ambiguity a correctable design flaw (suggesting the project was theoretically sound but practically unfinished) or an ineliminable feature (suggesting the theoretical goal was impossible)? This distinction is crucial for the final evaluation of Neurath's program.

  *   **Upstream/Downstream Logic:** (c) is downstream of (a) and (b) because "failure" is relative to the system's intended function and ontological constraints. You cannot identify a failure condition without first defining the success conditions (b) and the material properties (a). It is upstream of (d) because we cannot recommend the system for contemporary use if we do not know its breaking points.
  *   **Feasible Conceptual Result (Year 2-3):** A "Threshold of Ambiguity" model. This conceptual tool will delineate the point at which ISOTYPE's non-propositional nature ceases to convey empirical data and begins to require propositional supplementation.
  *   **Reordering Trigger:** If ambiguity is proven to be a *generative* feature (e.g., allowing for cross-linguistic flexibility that strict protocols forbid) rather than an obstructive one, priority shifts to **(d)** immediately. This would reframe ISOTYPE not as a failed verification tool, but as a successful communication tool, fundamentally altering the project's conclusion.

  ### 4. Priority Four: Contemporary Portability (Inquiry d)
  **Rationale:** This is the **synthesis and application** phase. It is strictly downstream of all previous inquiries. Attempting to assess portability before resolving the internal coherence of Neurath's system risks "conceptual transplantation" of a broken framework. If the system is incoherent (b), metaphysically compromised (a), or fundamentally ambiguous (c), porting it to modern visualization is illegitimate without radical reconstruction. This inquiry asks whether Neurath's *concepts* (not just his graphics) are salvageable.

  *   **Upstream/Downstream Logic:** (d) is the terminal point of the agenda. It relies entirely on the verdicts of (b), (a), and (c). It synthesizes the historical-philosophical analysis into a forward-looking framework.
  *   **Feasible Conceptual Result (Year 3):** A set of "Neurathian Criteria for Scientific Visualization." This will not be a style guide, but a philosophical checklist for model-based representation that respects physicalist constraints while acknowledging the findings of (a) and (c).
  *   **Reordering Trigger:** If contemporary scientific visualization (e.g., data dashboards, climate models) is shown to have already solved the protocol/convention tension in ways Neurath could not anticipate, this inquiry should be elevated to **Priority 2**. This would shift the project from a historical reconstruction to a comparative analysis, using modern practice to illuminate Neurath's theoretical blind spots.

  ### Strategic Summary
  This agenda prioritizes **internal coherence (b)** over **general theory (a)** to ensure feasibility within the three-year constraint. By anchoring the project in Neurath's specific definitions, we prevent the philosophers from drifting into general semiotics and ensure the historian's expertise is central to defining the verification criteria. Inquiries (a) and (c) act as successive filters testing the viability of (b), while (d) acts as the final output. This ordering ensures that if the project must be truncated, the most philosophically significant result—the verdict on Neurath's physicalist consistency—is secured first.
