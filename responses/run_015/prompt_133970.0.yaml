      *   **Part 2: The Subtle Error (Rationalizability vs. NE)**
          *   The student thinks Rationalizability $\equiv$ Nash Equilibrium.
          *   *Correction:* Rationalizability captures common knowledge of rationality. NE captures common knowledge of rationality *plus* common knowledge of conjectures (or consistency of beliefs).
          *   In 2-player games, Rationalizable strategies = Strategies in support of some NE (Pearce 1984). *However*, the set of *profiles* (outcomes) is different. A profile $(s_1, s_2)$ is rationalizable if $s_1$ is a best response to some belief about $s_2$ and vice versa. They don't have to be best responses to *each other*. In NE, they must be best responses to each other.
