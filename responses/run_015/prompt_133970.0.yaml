          *   Student claims: Only $\{(O,O), (F,F)\}$.
          *   Why she is wrong: She confuses "Rationalizable Outcomes" (profiles consistent with CKR) with "Nash Equilibrium Outcomes". (O,F) is consistent with CKR but not a NE.
          *   Also, she ignores the Mixed NE.

  4.  **Refining the Argument & Terminology:**

      *   *Terminology Check:*
          *   "Rationalizable outcomes": Usually refers to strategy profiles that survive IESDS.
          *   "Nash Equilibrium": A specific subset of profiles.
      *   *The "Support" Claim:*
          *   Student: "Every strategy in [rationalizable set] belongs to the support of at least one Nash equilibrium."
          *   Context: This is the famous result by Pearce (1984) for 2-player games.
          *   Context: For $n \ge 3$, this fails. Example: A game where a strategy is a best response to a correlated belief (allowed in rationalizability) but not to any independent product measure (required for NE). Wait, standard rationalizability (Bernheim/Pearce) usually assumes independent beliefs?
          *   *Correction on Beliefs:*
              *   Bernheim (1984) and Pearce (1984) differ slightly on correlation.
              *   If beliefs allow correlation (Pearce), Rationalizable = IESDS survivors.
              *   If beliefs must be independent (Bernheim), Rationalizable $\subseteq$ IESDS survivors.
              *   However, the "Support of NE" claim usually refers to the result that in 2-player games, the set of strategies surviving IESDS is exactly the set of strategies played in some NE.
