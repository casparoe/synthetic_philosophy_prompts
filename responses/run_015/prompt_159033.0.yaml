answer: |-
  **Private Brainstorming**

  *   **Core Tension:** Williams wants reasons to explain action (internal link). Externalists want reasons to criticize action (independent standard).
  *   **The Echo Trick:** If agent has desire D: "Do what there is reason to do," then External Reason E becomes Internal. Agent believes E exists -> D activates -> Motivation.
  *   **Is this fatal?** If true for all agents, Internalism is vacuously true. Every external claim becomes internal. Williams loses the ability to say "You have no reason to do this" to someone who just doesn't care.
  *   **Load-bearing Objection:** Trivialization. If the distinction collapses, the thesis explains nothing about the *source* of normativity. It just pushes the source back one step to the higher-order desire.
  *   **Dialectical Noise:** Empirical frequency. Does everyone have this policy? Maybe not psychopaths. But focusing on exceptions misses the structural point. The structural point is whether the policy *legitimately* grounds reasons.
  *   **Williams's Out:** "Sound deliberation." Can a formal policy generate reasons ex nihilo? Williams emphasizes "ground projects." A formal policy isn't a ground project; it's a transmission mechanism.
  *   **Restriction:** Only substantive ends (things valued for themselves) ground reasons. Formal policies (valuing something because it's a reason) transmit motivation but cannot validate the reason itself.
  *   **Arbitrariness Charge:** Is this ad hoc? Yes, unless tied to the explanatory goal. Internalism explains action. Formal policies explain compliance, but not the *weight* or *pull* of the reason.
  *   **Residual Case:** The agent without the policy. Internalism says they have no reason. This is the bullet Williams must bite. It matters for moral responsibility.
  *   **Underdetermined Premise:** The scope of "sound deliberation." Does it allow deriving ends from formal commitments, or only means from substantive ends? This is the leak in the argument.
  *   **Verdict:** Echo internalism is not a reductio but a clarification. It forces Williams to restrict grounding to substantive ends. The distinction survives but retreats to the marginal case.

  ***

  **The Echo Chamber: Internal Reasons and the Formal Policy Objection**

  Bernard Williams's internal reasons thesis asserts that a statement about an agent's reasons for action is true only if the agent could reach the conclusion to act via a sound deliberative route from their existing subjective motivational set (SMS). This set includes desires, projects, and commitments. The thesis is designed to secure a tight link between reasons and the explanation of action: a reason must be capable of motivating the agent to whom it is ascribed. However, a structural complication threatens to collapse the distinction between internal and external reasons. If nearly every adult agent possesses a higher-order commitment—a reason-tracking policy—to do what they believe they have decisive reason to do, then any purported external reason can trigger this policy. The external claim "You have reason to phi" becomes the belief "I have reason to phi," which activates the policy, generating motivation. Thus, the external reason echoes into an internal one.

  This "echo internalism" presents a dilemma. If accepted, it renders Williams's thesis trivially true for nearly all agents, stripping it of its critical force against moralists who posit reasons independent of motivation. If rejected, Williams must explain why this ubiquitous policy fails to ground reasons. The solution lies not in denying the existence of such policies, but in restricting what counts as a reason-grounding element within the SMS.

  Williams should block the collapse by insisting that only substantive ends, not formal reason-tracking policies, can ground internal reasons. A reason-tracking policy is purely formal; it commits the agent to acting on reasons, but it does not specify what counts as a reason. For the policy to activate, the agent must already believe there is a reason. But if the internal reasons thesis is correct, that belief is only true if there is a link to a substantive end. If there is no substantive end supporting the action, the belief "I have reason to phi" is false. Consequently, the formal policy cannot activate because its condition—there being a reason—is not met. The policy transmits motivation from substantive reasons; it does not generate them ex nihilo.

  To allow formal policies to ground reasons would be to abandon the explanatory ambition of internalism. Williams introduced the thesis to explain how reasons figure in the guidance of action. A reason statement should illuminate why an agent moves, not merely certify that they are compliant with a formal rule. If a formal policy alone could ground reasons, an agent could have a reason to act even if the action served no interest, project, or desire they held, provided only that they desired to be reasonable. This severs the link between reasons and what matters to the agent. The "echo" is too quiet to drive action; it lacks the normative weight that comes from substantive commitments. Therefore, restricting grounding elements to substantive ends is not an arbitrary device to preserve dramatic verdicts; it is necessary to maintain the thesis's account of practical guidance.

  However, this restriction leaves a residual case: the agent who lacks even the reason-tracking policy. This is the amoralist or the psychopath who neither cares about morality nor cares about being reasonable. Internalism must bite the bullet here: such an agent has no reason to act morally. This matters significantly. It implies that moral blame cannot be grounded in the possession of reasons for these agents, but rather in their exclusion from the community of reasonable agents. The theory retains its bite precisely at the margin where the connection between motivation and normativity breaks down.

  The verdict is that echo internalism is not a reductio of the internal reasons thesis, but rather a clarification that forces a principled restriction on the SMS. The distinction between internal and external reasons does not collapse, because formal policies cannot validate the beliefs required to trigger them. However, this case exposes a specific premise in Williams's argument as underdetermined: the scope of "sound deliberation." Williams assumes deliberation discovers routes from existing ends to actions, but he does not sufficiently specify whether deliberation can generate new ends from formal commitments. The echo argument shows that if deliberation allows formal commitments to generate reasons, internalism collapses. Therefore, Williams must explicitly premise that sound deliberation is constrained by substantive ends. Without this restriction, the internal reasons thesis loses the very anchor it was designed to provide.
