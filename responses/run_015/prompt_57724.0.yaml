answer: |-
  "Elena, if we give Marguerite thirty thousand dollars, she says she'll be miserable. She says she needs fifty to feel what the Reyeses feel with thirty. If we're actually trying to fix lives, why are we funding her disappointment?"

  "Because we aren't funding feelings, Marcus. We're funding citizens. If I give her fifty, I'm telling the Reyeses that their frugality counts for less than Marguerite's taste for champagne. You want to equalize what people can *do*. I want to equalize what people *have*. Once we start measuring how much joy a dollar buys, we're not a committee anymore; we're appraisers of souls."

  "I'm not talking about joy. I'm talking about the ramp. Della's kid cannot get into the bathroom. Thirty thousand buys half a ramp. It buys nothing. It's a check that says 'we care' while the child stays stuck. And the Haddads—thirty thousand in their hands is worth fifteen thousand in anyone else's. Landlords see their names and walk away. Contractors see their accents and double the bid. An equal check here isn't fairness; it's blindness."

  "So give them more. But then tell me why Roy doesn't get more. He's out of options. His trees are dying. If you're helping people who are stuck, he's stuck. And tell me why Marguerite gets less. She says her capacity to enjoy life is crippled by a high baseline. You say you care about what people can be. She says she can't *be* happy with less. Why is her internal barrier less real than Della's external one?"

  Marcus leaned back, rubbing his eyes. The fluorescent light hummed. "Roy chose his risk. He walked away from a pension. Della didn't choose her son's spine. The Haddads didn't choose the war or the border. There's a difference between a hole you dig and a hole you fall into. Marguerite... look, if we pay for her tastes, we're saying her preferences are more expensive than ours, and we should subsidize that. But Della's cost isn't preference. It's physics."

  "Physics we can see. Preferences we can't. That's my point. I can count the dollars. I can't count the 'capacity.' If I give Della forty thousand and Marguerite twenty, I have to explain to Marguerite why her suffering is less real. I can't do that. I don't know that. But I can hand them both the same envelope and say, 'The town trusts you with this.' That trust is the resource. Not the cash."

  "Trust doesn't install a lift." Marcus pulled a notepad forward. "Okay. You want numbers? Here. Della gets forty-five. The Haddads get forty-five. That covers the ramp and gives them a buffer against the 'immigrant tax' they pay on everything. The Reyeses get twenty. They're stable. They'll save it. Roy gets twenty. It keeps the orchard alive another season without rewarding the gamble. Marguerite gets twenty. She's comfortable. She'll survive the summer."

  "That adds up to one-fifty?"

  "Just barely."

  "Okay. Look at what you've done. You've penalized the Reyeses for being prudent. They saved when others spent, now they get less reward. You've penalized Roy for trying to build something, even if it failed. And Marguerite—you've decided her word is a lie. She says she needs fifty. You say she needs twenty. Who are you to know?"

  "I know what a ramp costs. I know what a security deposit costs. I don't know what her summer costs, and neither does she. She's comparing herself to us. That's the sickness, not the budget."

  "And the Haddads? You're giving them extra because the town is prejudiced. I agree the town is prejudiced. But is it our job to fix the town's racism with a one-time payout? Or is it our job to treat the Haddads like everyone else? If I give them forty-five, I'm admitting they can't compete. If I give them thirty, I'm saying they belong here same as anyone. Maybe the money doesn't stretch as far. But the status is equal."

  "Status doesn't feed a child. Elena, you're hiding behind the check. You say 'equal money' means 'equal respect.' But if the money buys a ramp for one and a dinner for another, the respect is a lie. You're washing your hands of the outcome. You want to be fair in the handing out, not in the living with."

  "And you want to be fair in the living with, but you're guessing. You're guessing Roy won't waste the extra. You're guessing Marguerite is lying. You're guessing the Haddads won't take the forty-five and move away next month because they still can't find work. At least with my plan, if they move, they had the same stake as the Reyeses. We didn't try to engineer their lives."

  "I'm not engineering. I'm acknowledging reality. You say you reject maximizing happiness. I do too. This isn't about utility. It's about dignity. Della has no dignity if she can't bathe her son. The Haddads have no dignity if they're priced out of housing everyone else can afford. You give them equal money, you're ignoring the weight they carry."

  "Weight is invisible. Dollars are visible. That's the thing you're missing. If we do your plan, every meeting forever is about who hurts more. Next year, Roy's trees die anyway. Does he come back? Does Marguerite sue us? With my plan, the line is drawn. Thirty thousand. Done. We go home."

  Marcus tapped his pen. "I'll concede this: If we give Della forty-five, we have to take it from someone. Taking it from the Reyeses feels like punishing success. Maybe... maybe we take it from Marguerite and Roy. They're the outliers. But I still can't give the Haddads only thirty. It's inefficient. It's cruel."

  "And I'll concede this: Thirty thousand doesn't fix the ramp. It's half a job. handing them half a ramp feels like an insult. I hate that. I hate walking away knowing the kid still can't get into the tub. But I hate the alternative more. I hate us deciding who deserves to be whole."

  "So we're stuck. You won't measure need because you can't trust us to measure it. I won't ignore need because I can't trust the money to fix it."

  "It's not just trust. It's proof. I can show the town the ledger. Five checks, same amount. Nobody can argue with the math. If I do your ledger, I have to write notes. 'Della: disabled.' 'Haddads: discriminated against.' 'Marguerite: too picky.' That goes on a record? That stains them. My way, the record is clean."

  "Clean for who? For us. So we don't have to look at the mess. Elena, you're saying justice has to be public. It has to be something a stranger can look at and nod at. 'Ah, equal checks. Fair.' But if the stranger knew Della was still stuck on the stairs, would they nod?"

  "Maybe not. But if the stranger knew we voted that Marguerite's happiness was worth less than Della's, would they nod? We're neighbors. We have to live with these people. If we start rating their suffering, we break the community to fix the budget."

  "So the disagreement isn't about the money. It's about what we can say out loud."

  "I think the disagreement is whether fairness is what we hand out, or what lands in their hands. I say it's what we hand out. Because what lands in their hands depends on a world we can't control. You say it's what lands in their hands. Because what we hand out is useless if the world breaks it."

  Marcus closed the notepad. "If I can't prove Marguerite is lying, can I justify giving her less? If the measure of justice is something I can't show you—something inside her head versus something on her body—does it count?"

  "And if I can't fix Della's stairs with the money, can I justify giving her the same as Marguerite? If the measure of justice is something everyone can see—a check—but everyone knows it buys different things, does it count?"

  "We agree the money shouldn't buy happiness. We agree Roy took a risk. We agree the Haddads are getting screwed by the landlords."

  "We agree the Reyeses did everything right."

  "So it comes down to this," Elena said. "Do we fix the metric to match the life, even if nobody can verify the metric? Or do we fix the metric to something anyone can verify, even if it doesn't match the life?"

  "I need to know that Della can bathe her son."

  "I need to know that Marguerite isn't being judged by us."

  "Then we aren't arguing about the dollars anymore."

  "No. We're arguing about whether justice needs to be seen to be done, or whether it needs to be done to be seen."

  Marcus stood up, leaving the notepad on the table. The numbers were still there, two columns that didn't match. "I can't vote for a check that buys half a ramp."

  "And I can't vote for a committee that decides how much a ramp is worth compared to a summer."

  "Then we sit here until the money expires."

  "Or until one of us sees what the other is seeing."
