      *   But for *white collar work*, a better analogy might be **CAD (Computer-Aided Design)** replacing drafters, or **Spreadsheets** replacing ledger clerks.
      *   Actually, the **"Calculator"** analogy is strong for bookkeeping. But AI is more than a calculator.
      *   Let's stick with the **"CAD/Drafter"** analogy. It captures the "skill shift" better. Drafters didn't disappear overnight, but the role changed fundamentally, and headcount dropped relative to output.
      *   Wait, the user asked for a better analogy *than the oven*. The oven implies physical bottlenecks. A **"Word Processor"** analogy might be better. It replaced typists. The complementary work was learning the software (fast). The demand for documents went up, but the demand for *typists* went to zero.

  9.  **Final Polish on Confidence:**
      *   Be careful not to sound like I know the future. Use phrases like "Historical precedent suggests," "Current technical trajectory indicates."
      *   Highlight that the brother is right about *aggregate productivity* but potentially wrong about *labor displacement*.

  10. **Check against constraints:**
      *   Did I map explicitly? Yes.
      *   Did I address the two specific points (complementary work & satiable demand)? Yes.
      *   Did I address Macro vs. Micro? Yes.
      *   Did I label confidence? Yes.
      *   Did I challenge the framing if needed? Yes (Macro vs. Micro is the key frame shift).

  11. **Self-Correction during drafting:** I need to make sure I don't just say "AI is different." I need to explain *why* the complementary assets in bookkeeping are more vulnerable than the proofer in the bakery. The proofer is hardware. The "bookkeeping proofer" is... more cognitive labor. If AI does cognitive labor, it eats its own complement. That's the key insight.

  12. **Final Review of the "Electrician" advice:** I shouldn't give financial advice, but I can analyze the risk profile. Electrician work is high physical dexterity + unstructured environment. Bookkeeping is structured digital data. AI is currently biased towards the latter. This is a strong signal for the user.

  13. **Confidence Calibration:**
