      *   Identify the load-bearing flaw: Step (9) is the most obvious error (false parity), but Step (5) is the more subtle methodological error.
      *   Explain why (5) is wrong: Meta-science/replication projects *change* the parameters. They don't suffer from low power or p-hacking to the same degree because they are designed to detect bias. They are "high-powered tests of the literature," not "another set of literature tests."
      *   Explain why (9) is wrong: Heterogeneity of sciences. Physics vs. Psychology.
      *   Address the Bayesian friend: The user's worry about priors is valid, but priors can be updated by *methodological* quality, not just results.
