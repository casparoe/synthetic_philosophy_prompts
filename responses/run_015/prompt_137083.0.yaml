      *   (9) is clearly false. Particle physics != social psychology. The base rate of true hypotheses and the methodological rigour differ vastly.
      *   The user's instinct to keep (1)-(3) and reject (9) is actually quite sound, but the reasoning needs refinement. The break is primarily at (9), but there's a significant nuance at (5)/(6) regarding the *methodological distinction* between original studies and replication/meta-science studies.
      *   Also, (1) is a theoretical claim (Ioannidis 2005), whereas (4) is empirical. The empirical evidence for (4) comes from *replication studies*, which are methodologically distinct from the original studies they critique. They are high-powered and pre-registered. Therefore, (5) is factually incorrect about the process generating the evidence for (4).

