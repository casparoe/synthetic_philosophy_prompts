      *   Is the tone appropriate? Yes, respectful of the student's level but treating them as an intellectual peer.
      *   Is the British English consistent? Yes.

      *Self-Correction on Step (5):* The user says meta-scientific estimates are calculated from the published literature. This is partially true (e.g., estimating power from reported sample sizes), but the *conclusion* that psychology is in a crisis (4) comes from *replication projects* (like Open Science Collaboration 2015), which are new data collection, not just analysis of old papers. This is a crucial distinction. The evidence for (4) is *new* empirical data, not just a re-analysis of the biased old data. I need to make sure this is clear.

      *Self-Correction on Step (9):* This is the "global scepticism" move. It's the easiest to reject. Not all fields have low base rates of true hypotheses. Climate science has physical mechanisms. Medicine has RCTs. Psychology has noisy human behaviour. The parameters in (1) are not universal.

      *Decision:* The primary break is at (9) (false generalisation), but the deeper methodological break is at (5) (false equivalence between original studies and replication/meta-science). I will prioritise (9) as the "load-bearing" flaw for the reductio, but explain (5) to address the specific worry about circularity.

      *Wait, looking closer at (5):* "Meta-scientific estimates... are themselves calculated from the published literature." This refers to things like p-curve analysis or estimating power from sample sizes. But the strong evidence for (4) comes from *direct replications*. Direct replications are new studies. Do they suffer from (a), (b), (c)? Ideally no. They are high powered (b fixed), pre-registered (c fixed), and test established effects (a fixed - base rate is higher because we only replicate what was already found). So (5) is factually weak regarding replication projects.

      *Let's structure the main answer:*
