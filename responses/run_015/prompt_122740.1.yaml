  The fight isn't about ownership; it's about ontology. The Ship of Theseus asks if an object survives replacement, but the *Alder* dispute asks when a collection of parts becomes an object at all. For six years, the splinter group's "boat" was merely a stack of lumber in a shed, unarranged and inert. If identity lies in matter, was the *Alder* a boat while it was firewood waiting to happen? This breaks the framing because it suggests "boatness" isn't a property of the wood, but of the arrangement and use. Unlike the living root bridges in Meghalaya, where growth and function seamlessly fuse matter into a whole without a blueprint, the *Alder* forces us to decide if a human intention can bind scattered planks into a single entity across time. The bridge grows into unity naturally; the boat is assembled into it by force of will. The question isn't which boat is the same; it's whether a boat is ever anything more than a temporary agreement between wood and water, and whether that agreement survives when the wood is stacked in a shed, waiting for an argument to give it shape again.

  **Three ways it could come out**
  1.  **The Functionalists:** They argue a boat is defined by its continuity of use and form. For them, the Harbour Club's vessel is the *Alder* because it never stopped being launched, raced, and maintained as a unit. The wood is incidental; the pattern is the object. This view aligns with how we treat living things, like the Meghalaya bridges, where individual roots die but the bridge persists through continuous function. The cost? It implies you could replace every single plank, even the keel, and nothing essential changes. It makes the physical object ghostly, a pattern haunting a succession of materials. It demands you believe that the *idea* of the boat is more real than the timber you can touch, prioritizing the story over the substance.
  2.  **The Materialists:** They argue identity is bound to the specific matter. The splinter group's boat wins because it holds the original planks. But this view collapses under the shed test: if the planks were just a stack for six years, was the *Alder* disassembled into non-existence? To believe this, you must accept that objects can vanish and reappear based on arrangement. It also conflicts with the 1998 repair, where the Club's boat was mostly new wood yet remained the *Alder*. The cost is a fragmented reality where objects blink in and out of existence depending on their atomic configuration. You have to accept that the boat died in the shed and was resurrected, which strains credulity almost as much as saying the wood doesn't matter.
  3.  **The Conceptualists:** They argue there are no "boats," only particles arranged boat-wise. The label *Alder* is a human convenience, a story we tell to manage insurance and race entries. Neither boat is the original; both are new arrangements claiming a legacy. This solves the paradox by dissolving the object entirely. The cost is existential vertigo. If boats aren't real things, neither are corporations, nations, or marriages. It renders the villagers' six-year feud genuinely tragic: they are fighting over a fiction, but the pain is real. It suggests that while the universe contains no boats, it contains plenty of conflict over the names we give them. You save the logic, but you lose the world.

  **What I'd tell the two skippers**
  I'd tell the Harbour Club skipper to take the plaque, but I'd tell the splinter group skipper to build a new race. Philosophy won't settle this because the law cares about ownership, not ontology. The Club boat has the continuous narrative required for heritage grants; it never stopped being a vessel in the eyes of the community. The splinter group has the romantic claim of the original wood, but a boat in a shed is lumber, not a heritage asset. Give the plaque to the Club because history is a verb, not a noun. It's about the sailing, not the timber. But acknowledge the split: let both race. The *Alder* is big enough for two hulls if the village admits the name is a banner, not a birthright. The verdict isn't about truth; it's about keeping the harbour from drying up entirely. Choose the story that keeps the community sailing. Practical peace beats metaphysical truth.

  **My lede**
  In the grey water of the Nova Scotia harbour, two wooden boats bob against the same dock, both claiming the name *Alder* and the right to race. One holds the history of fifty summers in its logbook, while the other holds the original wood in its hull, yet neither can definitively prove they are the thing they say they are.

  **Where this could go wrong**
  A philosopher will say I've conflated numerical identity with qualitative similarity, or that I'm treating "conceptualism" as a cohesive school when it's a spectrum. They might argue the bridge comparison is a category error, since biological growth follows internal teleology while boat repair is external. They'd be right. I should care only insofar as it undermines the story's integrity. If I misrepresent the logic, the verdict feels unearned. But this isn't a journal; it's a magazine. The goal isn't to solve mereology, but to show why humans care about it. If the oversimplification helps readers feel the weight of the choice without drowning in jargon, it's a necessary trade. Accuracy matters, but resonance matters more. Readers want meaning, not a syllabus. I am writing for the village, not the academy.
