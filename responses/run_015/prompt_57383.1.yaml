answer: |-
  **Purpose:** I fix the purpose as **Metaethical Adequacy** (settling the dispute about the nature of normativity). However, I will annotate where **AI Alignment/CEV** tightens these constraints, as the demand for a "spelled out" procedure is isomorphic to the demand for computability in indirect normativity.

  ### The Desiderata for Substantive Idealized Deliberation

  1.  **Input Invariance (Starting Materials)**
      *   *Requirement:* The account must specify whether the output varies wildly based on the agent's initial psychology (e.g., a sadist vs. a saint) and justify why that variance is or is not normatively acceptable.
      *   *Case:* If a psychopath's idealized self endorses murder and a saint's endorses charity, the theory yields relativism. If both endorse charity, the theory must explain how the psychopath's input was overridden without smuggling in "charity is good" as an idealizing condition.
      *   *AI Note:* Alignment requires convergence across diverse human inputs; Metaethics may tolerate relativism.

  2.  **Non-Circularity (Non-Question-Beggingness)**
      *   *Requirement:* Idealizing conditions (information, rationality) must be defined in non-normative terms (e.g., logical consistency, physical data) rather than normative ones (e.g., "relevant" information, "sound" reasoning).
      *   *Case:* Defining "sound reasoning" as "reasoning that leads to true moral conclusions" renders the theory tautological.
      *   *Status:* **Non-Negotiable.** Without this, the view is definitional, not explanatory.

  3.  **Closure (Parameter List)**
      *   *Requirement:* The list of idealizing conditions must be finite and explicit, with no "and so on" or "other relevant factors" clauses.
      *   *Case:* A theory stating "ideal conditions include full information and... whatever else is needed for truth" is a placeholder.
      *   *Status:* **Non-Negotiable.** This is the core of your friend's objection.

  4.  **Recognizability (Internalist Endorsement)**
      *   *Requirement:* The actual agent must be able to recognize the idealized verdict as an extension of their own will, not the imposition of a stranger's values.
      *   *Case:* If idealization removes all my contingent desires (e.g., love for my specific child) to achieve impartiality, the resulting verdict is not *for me*.
      *   *Status:* **Internalist Prejudice.** Externalists/Realists may reject this; they care about what is *good for* the agent, not what the agent *acknowledges*.

  5.  **Empirical Adequacy (Reflection Costs)**
      *   *Requirement:* The account must accommodate the psychological fact that reflection can induce error, paralysis, or degradation (e.g., depressive rumination).
      *   *Case:* If "more reasoning" is always better, then obsessive-compulsive over-analysis should yield better moral verdicts, which it does not.
      *   *Status:* **Non-Negotiable.** A theory of deliberation contradicted by the psychology of deliberation is empirically false.

  6.  **Idempotence (Stability)**
      *   *Requirement:* Feeding the output of the idealization procedure back into the procedure must yield the same output ($f(f(x)) = f(x)$).
      *   *Case:* If the idealized self would choose to re-idealize again to become something else, the first state was not truly ideal.
      *   *Status:* **Non-Negotiable.** Required for a fixed-point definition of "ideal."

  7.  **Monotonicity of Partial Idealization**
      *   *Requirement:* The account must state whether a bounded approximation (e.g., 50% more information) is normatively superior to the baseline.
      *   *Case:* If knowing a specific truth (e.g., the precise date of one's death) destroys agency, more information is locally worse. The theory must explain why the *limit* is good if the *path* is not.
      *   *Status:* **Optimist Prejudice.** Skeptics deny that rationality is a monotonic good.

  8.  **Limit Condition (Unbounded-Parameter Problem)**
      *   *Requirement:* Since information and coherence have no natural maximum, the account must define the stopping rule: a mathematical limit, a stability plateau, or a pragmatic cutoff.
      *   *Case:* In an infinite universe, "full information" is undefined. The theory must specify a topology of convergence (e.g., "what one would want after *relevant* information" requires a metric of relevance).
      *   *Status:* **Non-Negotiable.** Without a limit condition, the function is undefined.

  ### Classification and Elimination

  **Non-Negotiable (Structural):** Non-Circularity, Closure, Empirical Adequacy, Idempotence, Limit Condition.
  **Camp Prejudices:** Recognizability (Internalist/Constructivist), Input Invariance/Convergence (Realist vs. Relativist), Monotonicity (Rationalist Optimist).

  **The Single Eliminator:**
  The **Limit Condition (Unbounded-Parameter Problem)** eliminates the most candidates. Most theories (Brandt, Standard Full-Information) assert "full information" or "maximal coherence" without defining the topology of the limit. In a complex or infinite world, these sequences may not converge, may oscillate, or may be computationally undefined. Without a rigorous definition of the limit, the "ideal" is mathematically nonexistent.

  ### Joint Unsatisfiability: The "Better Reason" to Lose

  You asked for a subset of requirements that are jointly unsatisfiable. There is a strong trilemma between **Non-Circularity**, **Recognizability**, and **Substantive Correction**.

  1.  If you ensure **Substantive Correction** (the ideal self corrects the actual self's deep moral errors), you must alter the agent's psychology significantly.
  2.  If you alter the psychology significantly, you violate **Recognizability** (the actual self no longer identifies with the ideal self's verdicts—the "Alienation Objection").
  3.  To preserve **Recognizability** while ensuring Correction, you must constrain the idealization to preserve "essential" traits. But defining "essential" without referencing normative value (e.g., "keep the good desires") violates **Non-Circularity**.

  If this trilemma holds, your friend wins: the view is empty because filling it out either begs the question or alienates the agent. You lose, but for the "better reason" that the concept of *normative authority via idealization* is structurally fractured, not merely underspecified.

  ### Metaethics vs. AI Alignment Divergence

  For **Metaethics**, *Recognizability* is often prioritized to preserve the link between normativity and motivation. For **AI Alignment (CEV)**, *Recognizability* is often sacrificed for *Safety/Convergence*; the AI is permitted to extrapolate values the human cannot currently comprehend (violating Recognizability) to prevent catastrophe. Consequently, the AI list drops *Recognizability* but adds *Computability* (the limit must be reachable in finite time), which makes the **Limit Condition** even harder to satisfy than in metaethics.

  ### Scoring the Contenders

  **Ideal Observer Theory** fails Non-Circularity (omnibenevolence smuggles in the answer) and the Limit Condition (omniscience is undefined). **Brandt's Cognitive Psychotherapy** scores well on Empirical Adequacy but fails Idempotence (therapy has no defined endpoint) and Monotonicity (therapy can break values). **Full-Information Accounts of Welfare** fail the Limit Condition (no topology for "full") and Recognizability (informed selves often repudiate actual desires). **Alignment Descendants (CEV)** solve the Limit Condition best (via computational stability) but explicitly sacrifice Recognizability, rendering them metaethically insufficient for internalists.
