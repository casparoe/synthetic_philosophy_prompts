answer: |-
  Dear Colleague,

  It is a pleasure to engage with your analysis of the absent-minded driver problem, as you have pinpointed precisely the fault line where standard decision theory fractures under the weight of imperfect recall. The tension you describe between the split-agent framing and the procedural-continuity view is not merely a matter of semantic preference but reflects a deeper disagreement about the ontology of the rational agent. To address your query directly, these are genuinely competing theories of agency rather than mere levels of analysis, because they make incompatible assumptions about where the locus of rational evaluation resides. The split-agent model, rooted in standard game-theoretic consequentialism, assumes that rationality must be validated at every information set independently, whereas the procedural-continuity model assumes that rationality is a property of the entire trajectory governed by a stable policy.

  Under the split-agent reading, which treats the driver as a sequence of temporal selves linked by imperfect information, the prediction for behavior at the first exit is inherently unstable. Because the agent at the exit cannot distinguish between the first and second junction, they must assign a probability to being at either location. If the agent reasons locally, maximizing expected utility based on these current beliefs, they may conclude that exiting is optimal, even if the ex ante plan was to continue. This occurs because the very act of arriving at an exit updates the driver's beliefs about their location in a way that can undermine the original plan. Consequently, this view suggests that genuinely rational planning ex ante is impossible without external binding, because the future self cannot be trusted to execute the plan when faced with the local incentives and information of the moment. In analogous cases of akrasia, such as the dieter relying on willpower, this model predicts failure. The dieter at the moment of temptation is a different temporal self with different information and visceral states than the dieter who planned the meal; without a binding constraint, the local optimization of the consuming self will override the global optimization of the planning self. The split-agent view thus diagnoses the problem as a structural feature of sequential choice where preferences or information sets shift over time.

  In contrast, the procedural-continuity view predicts that the driver will successfully skip the first exit, provided the agent has successfully instantiated a mechanism that preserves the ex ante intention through to execution. This model does not permit the agent to re-evaluate the decision at the exit based on local information; instead, the agent executes a pre-committed heuristic or rule, such as always continuing at the first visible exit. Here, genuinely rational planning ex ante is not only possible but is the only form of rationality that matters. The agent is viewed as a single unit selecting a policy rather than a sequence of selves selecting actions. When applied to the dieter, this view favors the strategy of hiding snacks over relying on willpower. Hiding snacks is an act of procedural continuity that aligns the environment with the ex ante goal, whereas relying on willpower invites the local re-evaluation that leads to inconsistency. The procedural-continuity view argues that the dieter who hides snacks is more rational because they have recognized the unreliability of local optimization and have structured their agency to maintain consistency over time.

  However, your question regarding whether procedural continuity resolves the paradox or merely relocates it is incisive. It does not so much resolve the theoretical paradox as it dissolves the conditions that generate it, but in doing so, it relocates the difficulty into the design and reliability of the commitment mechanism. The paradox arises from the assumption that a rational agent must be able to re-optimize at every node. By denying this assumption, procedural continuity avoids the contradiction, but it introduces a new problem: how does the agent ensure that the commitment mechanism itself is immune to re-evaluation? If the driver at the exit can choose to ignore the pre-committed rule, we are back to the split-agent problem. Therefore, the continuity view requires a theory of how agents bind their future selves, whether through physical constraints, psychological habits, or institutional rules. It shifts the burden from solving the decision problem at the exit to solving the meta-decision problem of selecting a robust policy ex ante. This is not an ad hoc adjustment but a recognition that rational agency involves the management of one's own cognitive limitations and temporal fragmentation.

  Deciding between these models requires a principled criterion that does not simply assume one framework from the outset, and that criterion is dynamic consistency. If one holds that a rational plan must be executable without revision throughout the sequence of decisions, then the split-agent model describes a failure of rationality, and the procedural-continuity model describes the corrective. If, however, one holds that rationality requires maximizing expected utility at every moment given current information, then the split-agent model is correct, and dynamic consistency must be sacrificed. The choice ultimately rests on whether you view rationality as a moment-by-minute optimization process or as a coherent life strategy. In the context of self-binding and commitment, the procedural-continuity view is superior because it accounts for the empirical reality that agents who treat their future selves as independent collaborators often fail to achieve their goals. It acknowledges that the planning self and the acting self are not merely distinct information sets but potentially conflicting motivators, and that rationality involves the integration of these parts into a functional whole.

  Thus, while the split-agent framing is useful for diagnosing where time-inconsistency arises in formal models, the procedural-continuity view offers a more robust normative guide for action. It suggests that the paradox of the absent-minded driver is not a puzzle to be solved within the logic of the exit itself, but a signal that the agent must transcend the local context through prior commitment. The difficulty is indeed relocated to the reliability of that commitment, but this is a practical engineering problem rather than a theoretical contradiction. By accepting that rational agents must sometimes restrict their own future freedom to ensure consistency, we preserve the coherence of agency over time, even if we must abandon the ideal of unconstrained local optimization. I hope this clarification helps advance your discussion on rational commitment, and I look forward to hearing your thoughts on whether dynamic consistency should be treated as a constraint on rationality or a desirable outcome of it.

  Sincerely,

  Your Assistant
