answer: |-
  Here is the shape of the principle, built from your verdicts, followed by the honest audit you asked for.

  ### The Principle: Structural Dependency Test

  To have a vote, a claimant must satisfy three cumulative clauses.

  **Clause 1: The Coercion Clause (Subjection)**
  The decision must impose a binding obligation, prohibition, or penalty enforceable by the authority, OR it must impose an inescapable physical externality (noise, pollution) that functionally operates as a penalty.
  *   *Motivation:* This distinguishes the **Caretaker** (bound by employment/house rules) and the **Villagers** (bound by pollution) from the **Patients** (collateral damage, not direct subjects) and the **Guests** (voluntary acceptance of rules per visit).

  **Clause 2: The Exit Clause (Permanence)**
  The claimant cannot sever the relationship with the authority without sacrificing fundamental life interests (home, livelihood, citizenship, or future timeline). "Reasonable exit" is defined by disproportionate cost, not physical possibility.
  *   *Motivation:* This distinguishes the **Guest** (can leave tonight) from the **Caretaker** (needs the job/lives on site). It distinguishes the **Villagers** (can't move the land) from the **Firm** (can relocate capital). It distinguishes the **15-Year-Old** (cannot exit the future) from the current electorate.

  **Clause 3: The Status Clause (Personhood)**
  The interest at stake must be the claimant's moral or civil status as a natural person, not their commercial profitability or incidental comfort.
  *   *Motivation:* This excludes the **Firm** (commercial interest) and the **Patients** (incidental health impact from a labor dispute) while including the **Prisoners** (civil status) and the **Caretaker** (livelihood as a person).

  ***

  ### Which Clause Does The Work?
  **The Exit Clause.**

  The Coercion Clause is too easy to meet; almost everyone is coerced by something somewhere. The Status Clause is a binary filter (person vs. company). The heavy lifting is done by the Exit Clause. It is the only thing that separates the Guest from the Caretaker, and the Villager from the Firm. It transforms "being affected" into "being trapped." Your intuition that the "no-exit clause" was the key was correct.

  ### All-Affected or All-Subjected?
  This is a **Modified All-Subjected** principle.

  *   **All-Affected** is too broad; it would grant the Firm a vote on emissions and the Patients a vote on the strike. You rightly reject those.
  *   **Standard All-Subjected** is too narrow; it would deny the Villagers a vote on the bypass because they aren't legally subjects of that Parish Council.
  *   **Your Principle:** You are expanding "subjection" to include "inescapable physical impact." You treat the villagers as *de facto* subjects because they cannot exit the jurisdiction of the noise.

  ***

  ### The Audit: Where The Principle Breaks Your Verdicts

  You asked for honesty on which verdicts the principle cannot deliver. Here are the friction points:

  **1. The Non-Citizen Residents (Parish Yes / General No)**
  Your principle struggles here. If the test is "Inescapable Exit," it is arguably harder to exit a Nation (emigration, visas, loss of citizenship) than a Parish (moving down the road). If they pass the Exit Clause for the Parish, they should pass it for the General Election.
  *   *The Conflict:* Your intuition relies on a "Membership" concept (belonging to the community) that contradicts the "Exit" concept. The principle says vote for both or neither. Your gut says vote for the local only. This suggests you hold a hidden fourth clause: *Political Membership requires a social integration threshold that isn't just about exit costs.*

  **2. The Prisoners (Short Sentence)**
  You said short-sentence prisoners should vote. The principle suggests *all* prisoners should vote (they fail the Exit Clause completely). Why limit it to short sentences?
  *   *The Conflict:* If the logic is "they are still citizens," then long-term prisoners are too. If the logic is "they will return soon," that's a prediction, not a structural condition. The principle pushes for universal prisoner voting; your verdict hedges.

  **3. The Caretaker (Veto vs. Vote)**
  You said she should have a vote *or at least a veto*. The principle grants a vote based on dependency. A veto is a different mechanism (minority protection). The principle justifies her inclusion in the *demos*, but it doesn't necessarily justify giving her a *blocking* power over the majority. That requires a separate principle about protecting vulnerable minorities within the group.

  ***

  ### The Au Pair Case

  Applying the Structural Dependency Test:

  *   **Coercion:** Yes. She is bound by house rules and employment terms.
  *   **Status:** Yes. Natural person, livelihood and home at stake.
  *   **Exit:** **The Grey Zone.**
      *   She can leave on one month's notice. This is easier than a member selling a flat, but harder than a guest packing a bag.
      *   However, is it "disproportionate cost"? If her visa is tied to the placement, exit is impossible without leaving the country. If she relies on the income to support family abroad, exit is economically severe.

  **Verdict:** The principle classifies her as a **Stakeholder**, not a full Member.
  She fails the "Permanent Exit" test required for *capital* decisions (e.g., selling the building), but passes the "Temporary Exit" test for *living* decisions (e.g., garden rota, noise rules, guest policies).
  *   *Recommendation:* She gets a vote on operational/house rules, but not on constitutional/asset decisions. This matches her one-year horizon.

  ***

  ### The Meta-Problem: Who Decides Who Counts?

  You asked what stops the majority trimming the franchise, and whether the non-member panel is a fix.

  **1. The Trimming Risk**
  Nothing internal stops this. If the rule is "Members decide who counts," members will always define "counting" in a way that protects their property value or reduces their labor. This is the boundary problem in a nutshell. A principle like the one above only works if it is *external* to the voting process—i.e., written into a constitution or bylaws that the current majority cannot change by a simple vote.

  **2. The Non-Member Panel**
  Is it a fix or a fig leaf?
  *   **Fig Leaf:** If the panel is advisory. If the members can ignore the panel's objection, the panel is just theatre.
  *   **Fix:** If the panel has a **Veto** on boundary decisions.
  *   *The Catch:* Who selects the panel? If members select the panel, they will pick compliant non-members. If non-members select the panel, you have created a second demos, which brings you back to the original problem (who counts as a non-member?).

  **Honest Assessment:** The panel is a fig leaf unless their selection method is random (sortition) from the pool of affected non-members, and their power is a veto on *boundary changes* specifically. Even then, it is a procedural bandage on a philosophical wound. It acknowledges the conflict without solving it.

  ### Summary
  You are not making it up. Your intuitions track a coherent **Structural Dependency** principle. You are consistently granting voice to those who are **trapped** in a **coercive** relationship regarding their **personal status**.

  The only place your intuition wobbles is on the Non-Citizen Residents, where "local belonging" overrides "structural exit." That isn't a failure of logic; it's a recognition that democracy is partly about *community* (who we are) and partly about *coercion* (what is done to us). Your principle handles the coercion perfectly. It misses the community part.

  For the co-op: If you want to be consistent, the Au Pair gets a vote on the bins. If you want to protect the "ownership" model, she doesn't. But you can't claim it's about fairness; that's about property rights.
