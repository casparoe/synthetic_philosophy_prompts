      *(Final Polish)*: Ensure the "Nightmare Question" is truly the one they pray nobody asks. The "Gaslighting" angle is stronger than the "Immortality" angle because it attacks the *truth* condition of the narrative. If the self is a joint posit, can the joint posit be false?

      *Let's go with the "Gaslighting/Erasure" nightmare question.* If the self is external, can others define me against my will?

      *Wait, one more check on the Neuropsych.* The neuropsychologist thinks the user is *glib*. The objection should reflect that annoyance. "You're turning their remaining humanity into a prop for your theory."

      *Okay, ready to write.*
answer: |-
  # Q&A Prep Sheet: The Joint-Posit Self
  **Seminar:** Friday | **Topic:** Dennett, Narrative Gravity, and Social Constitution

  **Strategy Note:** You are not defending a fortress; you are managing a construction site. Your goal is to show that moving the "centre of gravity" outside the skull solves more problems than it creates, without denying the bricks inside the skull exist.

  ---

  ### 1. The Clinical Objection (The Neuropsychologist)
  **Damage Potential:** **Critical.** This attacks the ethics and real-world application of your view. If this sticks, you look dangerous.
  **The Voice:** "I work with late-stage dementia patients. When you say the family 'keeps up the self,' it sounds like you're reducing the person in the bed to a prop in everyone else's story. They still feel pain, fear, comfort. By locating the self *outside*, aren't you ethically erasing the interiority that's left? It feels glib to tell a grieving family they are 'constituting' their mother rather than losing her."

  *   **Concede:** Acknowledge the risk immediately. "You're right that this language can sound like erasure. If 'joint posit' sounds like 'fiction,' that's my fault, not the theory's."
  *   **Dig In:** The *care* improves if we accept this view. If the self is private, once memory goes, the person is gone. If the self is joint, the family has a *duty* to maintain it.
  *   **2-Minute Answer:** "I'm not saying the interiority vanishes; I'm saying *personhood* is a status granted by a community. In my view, the family isn't 'pretending' she's there; they are doing the work required to *keep* her there. On the private view, when memory fails, we write her off. On my view, her selfhood becomes a communal responsibility. It's not glib; it's a demand on the caregivers to treat the narrative as real because the *consequences* are real."
  *   **Soft Spot:** You haven't fully addressed the patient's *suffering*. If the self is outside, does her internal pain matter less? (Be ready to say: "Pain is bodily; Self is narrative. Both matter, differently.")

  ### 2. The Phenomenological Objection (The Two Phenomenologists)
  **Damage Potential:** **High.** This attacks the foundational ontology.
  **The Voice:** "You're conflating the *narrative self* with the *self* simpliciter. Even if you strip away the story, the family, and the memory, there is a pre-reflective, bodily sense of 'mineness' (ipseity). When I touch a hot stove, *I* feel it. That isn't a joint posit. If your theory can't account for that minimal self, it's not a theory of the self, just a theory of reputation."

  *   **Concede:** "I agree there is a bodily sense of ownership. I'm not denying the organism feels."
  *   **Dig In:** Distinguish *Self* (Person) from *Subject* (Organism). Dennett is talking about the Person.
  *   **2-Minute Answer:** "Dennett's 'Centre of Narrative Gravity' is about the *person*, not the *subject of experience*. The pre-reflective body is the *vehicle* of the self, not the self itself. A dog has ipseity; a dog doesn't have a Centre of Narrative Gravity. My claim is about what makes us *persons* capable of being loved, blamed, or remembered. That specific layer *is* socially constituted. I'm happy to grant you the bodily self, provided you grant me that the *person* we mourn in dementia is the narrative one."
  *   **Soft Spot:** The line between "person" and "subject" is blurrier than you want. If the bodily self remains, is enough of the "self" left to contradict your claim that the second patient has *more* self?

  ### 3. The Reductionist Objection (The Parfitian)
  **Damage Potential:** **Medium-High.** This makes your work look redundant.
  **The Voice:** "This looks like Parfit's Relation R (psychological connectedness) but with 'social connectedness' tacked on. Parfit already showed identity isn't what matters; survival relations are. Are you just adding 'other people's memories' to the bundle of relations? If so, is this actually a new ontological claim, or just Parfit with extra steps?"

  *   **Concede:** "There is a strong family resemblance. Parfit opened the door to breaking up the Ego."
  *   **Dig In:** Parfit is still about *continuity over time*. You are about *location in space* (inside vs. outside).
  *   **2-Minute Answer:** "Parfit is still tracking a relation *between* temporal stages of an organism. He asks: 'Is Stage B connected to Stage A?' I'm asking: 'Where is the gravity well located?' Parfit reduces the self to a chain of connections; I'm arguing the self is a *social object* constituted by those connections. For Parfit, if the connections break, I cease. For me, if the *community* holds the narrative, the self persists even if the internal connections break. It's not extra steps; it's a different geometry."
  *   **Soft Spot:** The distinction is subtle. If pressed, you might sound like you're splitting hairs to claim originality.

  ### 4. The Exegesis Objection (The Tutor/Dennett Fan)
  **Damage Potential:** **Medium.** This undermines your reading of the primary text.
  **The Voice:** "Dennett already acknowledges the role of the audience. In *Consciousness Explained*, he says a Centre of Narrative Gravity is an abstraction like a centre of mass—it requires a field to exist in. Aren't you just emphasizing a feature Dennett already built in, rather than correcting a mistake? Did he ever claim the gravity was purely internal?"

  *   **Concede:** "Dennett is notoriously slippery, and he does gesture toward the social."
  *   **Dig In:** He treats the social as *input* to an internal process. You treat it as the *locus* of the process.
  *   **2-Minute Answer:** "Dennett treats the audience as *witnesses* to the narrative generated by the brain. The brain is still the author. My claim is that in cases like dementia, the brain stops authoring, and the audience becomes the *author*. Dennett's gravity is anchored in the organism; I'm saying the anchor can be dragged out into the community. It's a shift in weight, not just a acknowledgement of context."
  *   **Soft Spot:** You might be over-reading Dennett to make your critique sharper. If he explicitly said "it's social," you look like you missed it.

  ### 5. The Agency Objection (General)
  **Damage Potential:** **Medium.** This attacks moral responsibility.
  **The Voice:** "If the self is a joint posit maintained by others, who is responsible for actions? If I commit a crime, but my 'self' is partly constituted by my friends' narrative of me as 'good,' can I blame them? Or if I have dementia and act out, is it the care home's fault for maintaining a 'bad' narrative?"

  *   **Concede:** "This is the hardest implication. It does complicate responsibility."
  *   **Dig In:** Responsibility is also a social practice, not a metaphysical fact.
  *   **2-Minute Answer:** "Responsibility is another social posit, like the self. We hold the organism responsible because it's the convenient handle for the narrative. If the self is distributed, responsibility is too—but we still punish the body because that's where the leverage is. My view doesn't absolve the agent; it just shows that 'holding someone responsible' is part of the same narrative maintenance work as 'remembering who they are.'"
  *   **Soft Spot:** It sounds like you're dodging the hard question of *why* we punish the body if the self is elsewhere.

  ### 6. The Boundary Objection (General)
  **Damage Potential:** **Low-Medium.** This attacks precision.
  **The Voice:** "How much social support is enough? If one person remembers me, do I have a self? If a hundred people remember me falsely, do I have a 'bigger' self? Your theory seems to lack a threshold. When does the narrative gravity become a self, and when is it just gossip?"

  *   **Concede:** "There is no sharp line. Sorites problems apply."
  *   **Dig In:** Fuzziness is a feature, not a bug. "Self" is a vague concept.
  *   **2-Minute Answer:** "We don't demand a precise molecule count for 'wetness.' Selfhood is a gradient. My claim isn't that there's a switch; it's that the *direction* of the gravity matters. Whether it's one person or a hundred, the point is that the *source* of the coherence is external. The vagueness doesn't break the thesis; it just reflects the reality of social life."
  *   **Soft Spot:** If the concept is too vague, it might not do the philosophical work you need it to do.

  ---

  ### The Nightmare Question
  **The Question:** "If the self is a joint posit constituted by others, **does that mean I can be gaslit out of existence?** If my family decides to tell a story about me that contradicts my own lived experience, or if they simply stop telling stories about me while I'm still alive, have I lost my self? Am I at the mercy of their narrative accuracy?"

  **Why it's a nightmare:** It combines the Neuropsych's ethical worry with the Phenomenologist's worry about interiority. It makes your view sound tyrannical.

  **The "Save" Answer:**
  1.  **Distinguish *Self* from *Truth*:** "The self is a posit, but not an arbitrary one. It has to track the organism's behaviour to be useful."
  2.  **The Resistance of the Real:** "The organism pushes back. If the narrative diverges too far from the bodily reality (e.g., they say I'm happy while I'm screaming), the narrative breaks. The body constrains the story."
  3.  **The Ethical Pivot:** "This is exactly why we need this theory. If we think the self is private, gaslighting is just 'disagreeing with my feelings.' If we know the self is joint, gaslighting is *ontological violence*—it's an attempt to dismantle a person. My theory gives us stronger language to condemn that."

  **Prep Tip:** If they ask this, pause. Take a breath. Look at the Neuropsychologist and the Phenomenologists. Say: "That is the exact ethical stake of this paper." Then give the answer. It turns the attack into the climax of your talk.
