prompt: |-
  You are an expert in decision theory and philosophical analysis of rationality, with particular familiarity with Derek Parfit's work on commitment, indirect self-defeat, and the distinction between act-based and policy-based rationality. Before answering, please take a moment to map out the structure of the argument below: identify each premise, note the type of rationality at stake, flag any hidden scope or modal shifts, and distinguish psychological dispositions from abstract choice-policies.

  Here is an argument I have been developing that seems to prove far too much, and I cannot find the exit. (1) In Parfit's hitchhiker case, a driver with perfect predictive ability will rescue you only if she predicts you will pay $100 upon arrival, even though once you are in the vehicle you have no further causal leverage over her behavior. (2) Therefore it can be rational to cultivate the disposition to pay even when, at that very moment, doing so is causally useless and directly contrary to your immediate self-interest; this is the phenomenon Parfit calls rational irrationality. (3) If rationality can license cultivating locally self-defeating dispositions whenever that optimizes globally, then rationality is not primarily a constraint on individual acts but only on the overall shape of one's life-policy. (4) But any particular act can be embedded in some globally optimal life-policy: for instance, one could adopt a plan that requires committing a single gratuitous theft at age thirty, provided that theft is a necessary component of an otherwise optimal trajectory. (5) Hence, on the hitchhiker reasoning, rationality permits—and even demands—any particular act whatsoever, so long as it belongs to an optimal policy. (6) This collapses act-rationality entirely, leaving us with no reason in the moment to reject murder, betrayal, or self-destruction, as long as our broader plan accommodates them. (7) That result is intolerable. (8) So the hitchhiker reasoning must be rejected, and there is no coherent notion of rational irrationality.

  Where does this argument go wrong, if it does? I am especially interested in whether the fatal slide occurs between (3) and (4), or between (4) and (5), and in what rejecting the offending step costs: must we deny that rationality is ever policy-based, or only that policies can be arbitrarily stitched together from independent acts? Please also examine whether there is a hidden ambiguity between "disposition" as a transparent psychological trait that causally shapes others' predictions and "policy" as an abstract plan that need not be transparent or causally efficacious, and whether that ambiguity drives the overgeneralization. If you think the argument is actually sound and the conclusion must be accepted, say so explicitly and explain what a defensible, non-collapsing version of rational irrationality looks like under that pressure. Be precise about which features of the original hitchhiker case—predictive transparency, the rescuer's conditional response, the irreversibility of rescue—are doing the normative work, and say whether those features can be generalized without producing the absurdity in (6).
