answer: |-
  To move beyond the introductory cliché of Creon as the positivist and Antigone as the natural lawyer, we must examine whether Creon's edict collapses under Hart's separation thesis (valid but immoral) or Fuller's internal morality (procedurally defective), and whether Antigone's appeal validates Fuller's proceduralism or confirms Hart's fear of moral subjectivism. Creon's decree fails Fuller's canons not merely because it is cruel, but because it is structurally incoherent as law. Fuller's first canon, generality, is violated immediately: the edict targets a specific individual, Polyneices, functioning as a bill of attainder rather than a general rule, which Fuller argues destroys the reciprocity required for a legal system. This procedural rot is exposed in the Guard's report (lines 223–331), where the fear of arbitrary punishment reveals a lack of congruence between declared rule and official action; the Guard knows that finding the culprit matters less than having a scapegoat, demonstrating that Creon's regime operates on force rather than the fidelity to rules Fuller deems essential. Thus, Creon fails Fuller not because he is evil, but because he is a bad legislator who issues commands disguised as laws.

  However, Antigone's resistance complicates Fuller just as much as it does Hart. When Antigone appeals to the "unwritten and unfailing statutes of heaven" in her opening exchange with Ismene (lines 1–99), she is not arguing for Fuller's internal morality of lawmaking, but for a substantive, external natural law. Hart warns that collapsing legal validity into morality invites anarchy, and Antigone arguably does this by asserting a higher validity that overrides the sovereign's rule. Yet, she does not deny the legal consequence; she accepts the death penalty, distinguishing between legal validity (which she acknowledges Creon has the power to enforce) and moral obligation (which she refuses to surrender). This nuance resists Hart's binary: she treats Creon's law as valid enough to kill her, but immoral enough to disobey, occupying a space of civil disobedience that neither philosopher fully accounts for.

  The play ultimately resists reduction in the clash between Creon and Haemon (lines 631–780), where the question shifts from validity to authority. Haemon argues that a law cannot stand if the city rejects it, suggesting that legal validity requires social uptake, a sociological fact Hart acknowledges but separates from validity, and a moral requirement Fuller implies but grounds in procedure. Sophocles shows that when procedural integrity (Fuller) and sovereign will (Hart) collide with irreconcilable moral duties, theory offers no rescue, only tragedy. The text refuses to let Antigone be purely right or Creon purely wrong; Antigone's devotion is too exclusive (only for kin, not Eteocles), and Creon's concern for order is too rigid, proving that the Hart-Fuller debate seeks a resolution the play denies exists.

  Summary: The play reveals that legal theory's binary collapses when faced with the tragic necessity of conflicting obligations, showing that procedural integrity and sovereign validity cannot resolve clashes between irreconcilable moral duties.
