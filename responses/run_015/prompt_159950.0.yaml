prompt: |-
  I'm a PhD student in philosophy (Kant-ish, though animals aren't my area) and I somehow ended up on my university's animal ethics committee. We review about fifteen protocols a month, half an hour each, me plus a vet and a lay member, our decisions get audited, and the university's lawyers have told us in writing that we can't justify anything on animal-rights grounds -- so the reasoning in our minutes has to be indirect-duty-shaped: reasons about us and our characters, not about what is owed to the animal. In practice none of us can actually run that view and we fall back on a harm-benefit calcuation, which isn't the job we were given.

  Can you turn the indirect-duty view into a procedure we could actually run on a protocol? Ordered questions, what counts as a sufficient answer to each, where it returns a flat no, and where it hands the decision back to a person because the question is about values rather than facts. Three things it has to survive: the character-deformation rationale seems to imply that suffering no one ever witnesses is fine, which everyone on the committee thinks is the wrong answer and which I don't think Kant accepts either, so I need a way of handling that which doesn't just smuggle in duties to the animal by the back door; there's the distinction between cruelty and torment that isn't cruel, which we have no grip on; and there's the case of animals who can no longer be of any use -- the old animal put down because it can't work any more -- where the rationale seems to shift from what the act does to the agent to something about the act itself. It also needs a real test for whether an end is the kind of end that licenses pain at all, because 'valid scientific purpose' in our regulations is doing none of that work.

  Then run it on three cases of the shapes we actually see: a chronic-pain model in mice with analgesia withheld because it would ruin the data, with a plausible translational payoff; culling a few hundred healthy surplus animals that have no use and nowhere to go; and a field study using unmonitored traps in which animals will suffer and die unseen, where the data is likely to be filed and never published. I want at least one case where the procedure says yes to something I'd rather it said no to, and I want to know plainly what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** PhD student in philosophy (Kant-ish), member of university animal ethics committee.
      *   **Context:** Reviews ~15 protocols/month, 30 mins each. Committee = Philosopher (User) + Vet + Lay Member. Decisions audited.
      *   **Constraint:** University lawyers forbid explicit "animal rights" justification. Must use "indirect-duty" reasoning (duties to humanity/character, not duties *to* the animal).
      *   **Problem:** Current practice is covert harm-benefit analysis (utilitarian), which violates the mandated ethical framework.
      *   **Task:** Create a procedural algorithm/checklist based on the *indirect-duty view* (Kantian-ish) that can actually be run on protocols.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Stop conditions (Flat No).
          *   Hand-off points (Value judgments vs. Facts).
          *   Must address three specific philosophical problems:
              1.  *Unwitnessed Suffering:* Why is hidden suffering wrong if it doesn't deform character via habituation to public cruelty?
              2.  *Cruelty vs. Necessary Torment:* Distinguishing malicious/vice-driven pain from instrumental pain.
              3.  *Disposal of Useless Animals:* Why killing a useless animal is wrong if the duty is only about the agent's character (shifting to act-based?).
          *   Must include a test for "Valid Scientific Purpose" (what ends license pain?).
      *   **Application:** Run the procedure on three specific cases:
          1.  Chronic pain in mice (analgesia withheld for data, translational payoff).
          2.  Culling healthy surplus animals.
          3.  Field study (unmonitored traps, suffering/death unseen, low publication value).
      *   **Constraint:** At least one case must yield a "Yes" that the user personally disagrees with (to show the limits of the framework).
      *   **Output:** Plain statement of what the procedure *cannot* do.

  2.  **Philosophical Grounding (Kantian Indirect Duty):**

      *   *Core Principle:* We have no direct duties to animals (they are not rational ends-in-themselves). We have indirect duties *regarding* animals to preserve our own humanity. Cruelty to animals dulls our sympathy for human suffering.
      *   *The "Unwitnessed" Problem:* Kant argues in *Lectures on Ethics* that even hidden cruelty damages the *agent's* inner disposition (*Gesinnung*). It's not about social habituation; it's about corrupting the moral faculty itself.
      *   *The "Cruelty vs. Torment" Problem:* Kant distinguishes between *pain inflicted for no purpose* (vice/cruelty) and *pain inflicted for a necessary human end* (instrumental). The latter is permissible *if* the end is sufficiently weighty and the means are minimized.
      *   *The "Useless Animal" Problem:* Killing a useful animal (ox) vs. a useless one (dog). Kant suggests killing a faithful servant (dog) is harder to justify than an ox because it violates a bond of loyalty, which reflects on our duty to humanity (gratitude/loyalty). However, killing *without cause* is generally suspect because it treats life as disposable, potentially hardening the heart.
      *   *The "End" Test:* Not all scientific ends justify pain. The end must contribute to human flourishing or vital knowledge, not mere curiosity or redundancy.

  3.  **Drafting the Procedure (The "Indirect-Duty Protocol"):**

      *   *Goal:* Make it operational for a 30-minute review.
      *   *Structure:* Gatekeeping questions -> Character/End Assessment -> Means Assessment -> Decision.
      *   *Addressing the 3 Problems:*
          1.  *Unwitnessed:* Focus on the *agent's* willingness to inflict, not the audience.
          2.  *Cruelty:* Focus on *necessity* and *minimization*.
          3.  *Useless:* Focus on *gratitude/service* and *waste*.
      *   *The "End" Test:* Needs to be stricter than "valid science." Needs to be "Vital Human Interest."

      *(Self-Correction during drafting)*: I need to make sure I don't smuggle in utilitarianism. A harm-benefit analysis weighs animal suffering against human gain. An indirect duty analysis asks: "Does pursuing this gain in this way corrupt the researcher?" It's subtle but crucial. The "benefit" isn't a counter-weight to suffering; it's the *justification* for the potential character cost.

  4.  **Developing the Questions:**

      *   Q1: Purpose (Is the end weighty enough to risk character corruption?)
      *   Q2: Necessity (Is the animal use unavoidable?)
      *   Q3: Minimization (Are we doing the least possible to achieve the end?)
      *   Q4: Disposition (Does the protocol encourage vice? e.g., withholding analgesia without medical necessity).
      *   Q5: Disposal (Is killing respectful of the service rendered?)

  5.  **Running the Cases:**

      *   *Case 1 (Chronic Pain/No Analgesia):*
          *   End: Translational payoff (High).
          *   Necessity: Analgesia ruins data (Claimed).
          *   Character: Can a researcher inflict chronic pain without hardening their heart? Kant might say yes *if* it's for a vital end and minimized.
          *   *Result:* Likely PASS (with strict conditions). This might be the "Yes I'd rather be No" if the user thinks the pain is too high.
      *   *Case 2 (Culling Surplus):*
          *   End: None (they are surplus).
          *   Necessity: Logistics.
          *   Character: Killing healthy beings without purpose suggests wastefulness/disrespect for life.
          *   *Result:* FAIL (Indirect duty says don't waste life/be wantonly destructive).
      *   *Case 3 (Field Traps/Unseen):*
          *   End: Low (filed, not published).
          *   Necessity: Traps needed.
          *   Character: Inflicting suffering without witness *and* without valuable end = Vice.
          *   *Result:* FAIL.

      *Wait, I need one "Yes" the user dislikes.*
      If I make Case 1 pass, that works. Kantian indirect duty is actually *more* permissive of high suffering if the human end is vital and the agent's intention is pure, whereas a rights view would ban it. Or, conversely, indirect duty might be *stricter* on culling. Let's aim for Case 1 passing as the controversial one. Withholding analgesia is often seen as cruel, but if the "End" is vital human health, indirect duty permits it as a sacrifice *for us*, provided the researcher maintains the right disposition.

      *Refining the "Unwitnessed" constraint:* The procedure must explicitly state that visibility is irrelevant. The damage is to the *will*, not the reputation.

      *Refining the "Useless" constraint:* The procedure must treat "surplus" killing as a failure of planning (a vice of wastefulness) rather than a rights violation.

  6.  **Writing the Procedure (Iterative refinement):**

      *   *Name:* The Anthropocentric Integrity Protocol (AIP).
      *   *Tone:* Bureaucratic but philosophically rigorous.
      *   *Sections:*
          1.  The End Test (Teleological).
          2.  The Necessity Test (Instrumental).
          3.  The Disposition Test (Moral Psychology).
          4.  The Termination Test (End of Life).

      *Addressing the "Lawyer Constraint":* Ensure language never says "The animal suffers." Instead: "The procedure involves nociceptive stimulation," "The protocol requires the researcher to inflict..." Focus on the *human act*.

  7.  **Addressing the Specific Philosophical Hurdles in the Procedure:**

      *   *Unwitnessed:* Q3 (Disposition) must ask about the researcher's internal state, not public perception.
      *   *Cruelty vs. Torment:* Q1 (End) distinguishes vital ends from trivial ones. Q2 (Necessity) distinguishes instrumental pain from gratuitous pain.
      *   *Useless Animals:* Q4 (Termination) focuses on gratitude and waste.

  8.  **Drafting the Case Analyses:**

      *   *Case 1 (Pain Model):* Passes Q1 (Vital end). Passes Q2 (Analgesia confounds). Passes Q3 (If researcher trained to detach professionally). *Verdict: Approved.* (This is the one the user might hate).
      *   *Case 2 (Culling):* Fails Q1 (No scientific end). Fails Q4 (Waste/Ingratitude). *Verdict: Rejected.*
      *   *Case 3 (Traps):* Fails Q1 (Trivial end). Fails Q3 (Unmonitored suffering suggests indifference). *Verdict: Rejected.*

  9.  **Limitations Section:**

      *   Must admit that this framework *cannot* protect animals for their own sake.
      *   It relies on the moral sensitivity of the committee to detect "character corruption."
      *   It struggles with aggregate numbers (one murder corrupts, does 1000 murders corrupt 1000x?).
      *   It cannot forbid pain if the human end is "Vital" enough (e.g., curing cancer), even if the pain is extreme.

  10. **Review against Constraints:**

      *   Indirect-duty shaped? Yes.
      *   Ordered questions? Yes.
      *   Flat No/Hand-off points? Yes.
      *   Addresses Unwitnessed/Cruelty/Useless? Yes.
      *   Test for "Valid End"? Yes (Vital Human Interest).
      *   Three cases run? Yes.
      *   One controversial "Yes"? Yes (Case 1).
      *   Plain statement of limitations? Yes.

  11. **Final Polish:** Ensure the tone is appropriate for a philosopher talking to a philosopher (precise, acknowledging the tension) but practical enough for a committee setting. (Self-correction: Make sure the distinction between "harm-benefit" and "character-integrity" remains clear. Harm-benefit says "10 units of pain < 20 units of gain." Indirect duty says "Inflicting this pain is only permissible if it does not make us monsters, unless the end is so vital we accept the moral risk.")

      *Wait, one nuance:* Kant's view on "unwitnessed" suffering. In *Lectures on Ethics*, Kant says if a man shoots his dog because it can no longer serve him, he damages his humanity. It's not about witnesses. It's about the *maxim* of the action. I need to ensure the procedure captures the *maxim* (intention/principle), not just the outcome.

      *Refining the "End" Test:* The lawyers say no animal rights. So the "End" must be human-focused. "Vital Human Interest" is the key phrase.

      *Refining the "Yes I'd rather be No":* Case 1 is the best candidate. A Kantian might actually be okay with it *if* the end is truly vital, but a modern sensibility (even Kant-ish) might recoil at withholding analgesia. I will frame the procedure to allow it, highlighting the tension.

      *Let's check the Culling case.* Kant explicitly mentions killing a working animal vs. a non-working one. He says killing the dog (faithful servant) is worse. But killing surplus healthy animals? That looks like waste. Waste is a vice (prodigality/destructiveness). So the procedure should reject it.

      *Let's check the Trap case.* Unwitnessed suffering. If the end is trivial (unpublished data), the maxim is "I will cause suffering for my own minor curiosity." This is vice. Reject.

      *Okay, the plan holds.*

  12. **Final Output Structure:**
      *   Introduction (Acknowledging the bind).
      *   The Procedure (The "Human Integrity Protocol").
      *   Application to Cases.
      *   Limitations (What this cannot do).

      *(Self-Correction on "Hand-off"):* I need to explicitly mark where the committee must vote based on values, not facts. E.g., Determining if an end is "Vital."

      *(Self-Correction on "Lawyer Constraint"):* Ensure the language in the "Minutes Template" section reflects the required indirect phrasing.

      *Ready to write.*
answer: |-
  This is a constrained optimization problem in applied ethics. You are asked to run a Kantian-indirect-duty engine on a regulatory chassis built for utilitarianism, with legal guardrails prohibiting deontological claims about the animal.

  The core philosophical move here is to shift the locus of moral evaluation entirely from the *patient* (the animal) to the *agent* (the researcher/committee). The question is never "Does the animal suffer?" but "Does the act of causing this suffering degrade the moral capacity of the human agent?"

  Below is the **Human Integrity Protocol (HIP)**. It is designed to be run in 30 minutes. It addresses your three philosophical failure points (unwitnessed suffering, cruelty vs. necessity, disposal of the useless) without smuggling in direct duties.

  ---

  ### The Human Integrity Protocol (HIP)

  **Instruction to Committee:** Do not record judgments about animal welfare. Record judgments about researcher disposition, scientific necessity, and institutional character.

  #### Phase 1: The Teleological Gate (The End)
  *Purpose: To distinguish "necessary torment" from "vice." Kant allows pain infliction only if the end is a duty of humanity to itself.*

  **Q1. Is the proposed human end a 'Vital Human Interest'?**
  *   **Definition:** An end is vital if its failure would constitute a significant setback to human health, safety, or fundamental knowledge. Curiosity, career advancement, or marginal incrementalism do not count.
  *   **Sufficient Answer:** A written statement linking the data to a specific, high-stakes human outcome (e.g., "Validating a mechanism for pediatric epilepsy," not "Exploring nociception pathways").
  *   **Flat No:** If the end is trivial, commercial without public health benefit, or redundant.
  *   **Value Hand-off:** The Committee must vote on what counts as "Vital." This is not a fact; it is a judgment of human priority.

  #### Phase 2: The Instrumental Gate (The Means)
  *Purpose: To distinguish "cruelty" from "instrumental pain." Cruelty is pain inflicted without necessity or with enjoyment. Instrumental pain is a regrettable cost of a vital end.*

  **Q2. Is the animal use unavoidable for this end?**
  *   **Sufficient Answer:** Demonstration that non-sentient models or lower-sentience models cannot achieve the *Vital Human Interest* defined in Q1.
  *   **Flat No:** If a non-sentient alternative exists, using a sentient one is gratuitous. Gratuitousness deforms character by treating life as disposable.

  **Q3. Is the pain minimized to the absolute limit of the data's integrity?**
  *   **Sufficient Answer:** A technical justification for every unit of pain. (e.g., "Analgesia is withheld not for convenience, but because it chemically obscures the specific biomarker required for the Vital Interest.")
  *   **Flat No:** If pain is inflicted for researcher convenience, habit, or standard operating procedure without specific justification for *this* protocol.

  #### Phase 3: The Disposition Gate (The Agent)
  *Purpose: To handle the 'Unwitnessed Suffering' problem. The damage is to the will, not the reputation.*

  **Q4. Does the protocol require the researcher to cultivate indifference?**
  *   **Rationale:** If a researcher must ignore signs of distress to complete the protocol, they are practicing a vice (hardening of the heart).
  *   **Sufficient Answer:** A monitoring plan that requires active engagement with the animal's state, even if intervention is limited. The researcher must acknowledge the cost, not ignore it.
  *   **Flat No:** If the protocol relies on *not looking* (e.g., unmonitored traps, long intervals without checks). Unwitnessed suffering is *more* dangerous to character because it removes social accountability, relying solely on inner moral strength.
  *   **Value Hand-off:** Committee judgment on whether the required detachment is "professional discipline" or "moral numbing."

  #### Phase 4: The Termination Gate (The Useless)
  *Purpose: To handle the 'Disposal of Useless Animals' problem. This is based on the duty of gratitude and the vice of wastefulness.*

  **Q5. Is the termination of the animal an act of gratitude or waste?**
  *   **Rationale:** Killing an animal that has served the end is a necessary closure. Killing an animal that has *not* served the end (surplus) or can no longer serve (old age) without cause is an act of destruction.
  *   **Sufficient Answer:** Euthanasia performed immediately upon data completion, framed as "preventing further burden."
  *   **Flat No:** Culling healthy animals solely for inventory management. This treats life as inventory, which degrades the agent's respect for the instrument of their science.
  *   **Value Hand-off:** Committee judgment on whether "logistical necessity" overrides the vice of wastefulness.

  ---

  ### Application to Cases

  Here is how the HIP runs on your three protocols.

  #### Case 1: Chronic Pain Model (Analgesia Withheld)
  *   **Protocol:** Mice subjected to chronic pain; analgesia withheld as it confounds data. High translational payoff (pediatric epilepsy).
  *   **HIP Run:**
      *   **Q1 (End):** Pass. Pediatric epilepsy is a Vital Human Interest.
      *   **Q2 (Unavoidable):** Pass. Non-sentient models cannot replicate the systemic nociceptive response.
      *   **Q3 (Minimization):** Pass. Analgesia withheld is technically justified by data integrity, not convenience.
      *   **Q4 (Disposition):** Pass *conditionally*. Requires daily monitoring logs where the researcher must explicitly record distress levels. This forces engagement rather than indifference.
      *   **Q5 (Termination):** Pass. Euthanasia at endpoint.
  *   **Verdict:** **APPROVED.**
  *   **The Tension:** You likely want this to fail because the suffering is extreme. However, under Indirect Duty, if the End is Vital and the Agent maintains a "somber engagement" (monitoring) rather than "indifference," the act does not deform character. It is a tragic necessity, not a vice. The procedure licenses high suffering if the human end is weighty enough.

  #### Case 2: Culling Healthy Surplus
  *   **Protocol:** 300 healthy mice culled because they are the wrong genotype for current studies and cannot be rehomed.
  *   **HIP Run:**
      *   **Q1 (End):** **FAIL.** There is no scientific end here. This is inventory management.
      *   **Q5 (Termination):** **FAIL.** Killing healthy animals that have not served the end is wastefulness. It cultivates a disposition of disposability toward life.
  *   **Verdict:** **REJECTED.**
  *   **Reasoning:** The committee cannot approve an act that serves no Vital Human Interest. The "cost" of housing is not a Vital Interest that licenses destruction. This avoids the "rights" language by focusing on the *vice of waste*.

  #### Case 3: Unmonitored Field Traps
  *   **Protocol:** Unmonitored traps in the wild. Animals suffer/die unseen. Data likely to be filed/unpublished.
  *   **HIP Run:**
      *   **Q1 (End):** **FAIL.** "Filed and never published" is not a Vital Human Interest. It is curiosity.
      *   **Q4 (Disposition):** **FAIL.** "Unmonitored" requires the researcher to cultivate indifference to suffering. Unwitnessed suffering without a Vital End is the definition of cruelty (vice) in this framework.
  *   **Verdict:** **REJECTED.**
  *   **Reasoning:** This hits the "Unwitnessed" problem directly. Without a witness, the only check on cruelty is the agent's maxim. If the End is trivial, the maxim is corrupt.

  ---

  ### What This Procedure Cannot Do

  You asked for plain speech on the limitations. Here is what the Human Integrity Protocol (HIP) leaves unprotected:

  1.  **It cannot forbid extreme suffering for Vital Ends.**
      If a protocol promises a cure for a devastating disease (Vital Interest), the HIP *must* approve it, even if the animal suffering is horrific, provided the researcher maintains the "correct disposition" (monitoring, reluctance). The indirect-duty view sacrifices the animal to preserve the human end; it does not grant the animal a veto. If the human stakes are high enough, the "character cost" is deemed an acceptable risk.
      *   *Result:* You will have to approve things that feel like torture, provided the paperwork justifies the human gain.

  2.  **It cannot handle Aggregate Numbers well.**
      Kantian ethics is focused on the *maxim* of the individual agent. One researcher killing one dog faithfully is permissible; one researcher killing one dog wantonly is not. But does one researcher killing 1,000 dogs faithfully corrupt them *more* than killing one? The HIP struggles here. It treats the act type, not the aggregate volume of suffering. A protocol killing 5,000 animals for a Vital End passes the same gates as one killing 50.
      *   *Result:* You have no philosophical grip within this framework to reject a protocol based solely on scale.

  3.  **It relies on the "Vital Interest" veto, which is political, not ethical.**
      The HIP pushes all the moral weight onto Q1 (Is the end Vital?). If the university defines "Vital" as "anything that gets a grant," the procedure collapses into utilitarianism. The Committee must be willing to say "This cancer research is not important enough to justify this pain." That is a value judgment the lawyers may not want you making, but the procedure requires it.
      *   *Result:* You are not an ethics committee; under this model, you are a *teleological* committee. You judge the worthiness of human goals, not the protection of animals.

  4.  **It cannot protect animals from "Clean" Killing.**
      If a researcher kills a healthy animal instantly, painlessly, and without emotional distress (perhaps via automated CO2), the HIP struggles to find a "character deformation." There is no cruelty (no enjoyment), no indifference (it's efficient), and if the End is Vital (e.g., tissue harvest), it passes. The indirect duty view has a hard time explaining why painless, necessary killing is wrong if it doesn't "harden the heart."
      *   *Result:* You may have to approve culling if it is framed as "efficient resource management for a Vital End," unless you can successfully argue that *efficiency* itself is a vice (which is a harder sell).

  ### Minutes Language Template (For the Lawyers)

  To satisfy your legal constraint, your minutes should not read: *"The committee determined the animal would suffer too much."*

  They should read: *"The committee determined that the proposed methodology requires a level of researcher detachment incompatible with the maintenance of professional moral integrity,"* or *"The committee determined the human end proposed does not warrant the moral risk inherent in the protocol."*

  This keeps the locus of duty on the human, as required, while allowing you to block protocols that violate your collective moral intuition.
