answer: |-
  The claim that the P versus NP question bears philosophical weight rests on the intuition that these complexity classes map onto a cognitive distinction. **P** is the class of decision problems solvable by a deterministic Turing machine in polynomial time, loosely capturing tasks we deem efficiently computable. **NP** is the class where solutions can be verified in polynomial time, capturing tasks where recognising an answer is easy even if finding it is hard. The **Boolean Satisfiability Problem (SAT)**, for instance, asks whether there exists an assignment of variables that makes a logical formula true. Checking an assignment is trivial; finding one is notoriously difficult. The 'creativity argument' posits that if P equals NP, the gap between finding and checking collapses. Consequently, mathematical discovery and creative insight would be revealed as mechanically tractable, stripping them of their mystique.

  I propose to test this argument against the 'Existence-Only Resolution' (EOR). In this scenario, it is proven that SAT admits a deterministic algorithm running in $O(n^4)$ time, yet the proof is **non-constructive**: it demonstrates that one member of a finite family of circuits solves SAT without identifying which one. Furthermore, while a 'horizon-optimal searcher' exists that is fastest up to a constant factor, that constant is unknown and potentially astronomical. This scenario forces a distinction between **tractability-in-principle** (membership in a favourable asymptotic class, regardless of access) and **tractability-for-us** (a specified procedure with estimable runtime within human physical limits).

  Does the EOR vindicate or refute the creativity argument? It refutes it, but only if we accept that philosophical significance relies on tractability-for-us. The creativity argument suggests that if P=NP, creativity is mechanical. Under the EOR, P=NP is true. Therefore, in the abstract structure of computation, the gap between discovery and verification is closed. A Platonist defender of the creativity argument might insist that this is sufficient. They would argue that the nature of creativity is an objective fact about the universe, not a subjective fact about human access. If the algorithm exists, the process of discovery is objectively mechanical, even if humanity remains forever too ignorant to implement it. On this view, tractability-in-principle carries the philosophical weight because it describes the intrinsic difficulty of the problem, independent of the solver.

  I reject this defence. It misconstrues the subject matter of the philosophy of mind. When we ask whether creativity is mechanical, we are asking about the capacities of minds like ours, situated in a physical world with bounded resources. A solution that exists mathematically but is inaccessible physically is no solution for a cognitive agent. If the constant factor in the horizon-optimal searcher exceeds the number of particles in the universe, or if the specific circuit cannot be identified, then for all human intents and purposes, the problem remains hard. The EOR demonstrates that establishing P=NP via non-constructive means does not automate discovery. Therefore, the creativity argument fails because it conflates the ontological status of the algorithm with the epistemological access required to use it. Without tractability-for-us, the 'mechanisation' of creativity is a hollow victory.

  This leads to the second question: ought the philosophical weight rest on tractability-in-principle or tractability-for-us? The entire framing of the debate rests on a mistake if it assumes complexity-theoretic classification is solely about abstract mathematics. Complexity theory is often interpreted as a branch of physics, describing what is computationally possible in our universe. Asymptotic notation hides constant factors, but physical reality does not. An algorithm with a runtime of $n^4$ is useless if the hidden constant is $10^{100}$. Consequently, tractability-in-principle is insufficient for philosophical claims about human cognition. We are not asymptotic beings; we are finite entities with limited lifespans and hardware.

  If we prioritise tractability-in-principle, we risk irrelevance. We could live in a world where P=NP is true, yet every significant mathematical conjecture remains unsolved because the algorithms are unreachable. To claim creativity is mechanical in such a world is to change the meaning of 'creativity' to something unrecognisable. Thus, tractability-for-us must carry the weight. The value of the P versus NP question lies in its implication for what agents can *do*, not merely what exists in the platonic realm of algorithms. The EOR shows that knowing a problem is in P does not guarantee we can solve it. Therefore, the philosophical conclusion that 'discovery is easy' does not follow from the premise 'P=NP' unless the proof is constructive and the constants are bounded within physical reality.

  There remains a wrinkle raised in the seminar: even if we possessed a fast solver that emitted verified certificates for arbitrary conjectures, critics argue this would not touch what is valuable about mathematics. A certificate verifies truth; it does not explain *why* the truth holds. A proof generated by a black-box algorithm might confirm the Riemann Hypothesis, but without conceptual insight, it offers no understanding. Does this reply rescue the creativity argument, or does it quietly change the subject?

  It changes the subject, but in doing so, it highlights a deeper flaw in the creativity argument. The creativity argument equates creativity with the production of true solutions (finding the needle in the haystack). The black-box objection equates mathematical value with understanding (knowing why the needle is there). If a fast solver produces certificates without explanation, it automates *discovery* but not *understanding*.

  However, we must be precise. The creativity argument claims that if P=NP, the *effort* of discovery is eliminated. The black-box objection concedes that discovery might be automated but insists that the *value* of mathematics lies elsewhere. This does not rescue the creativity argument regarding the *hardness* of discovery; rather, it suggests that hardness was never the source of value anyway. If the EOR holds, we do not even have the fast solver. But suppose we did. The objection shows that even if the creativity argument were true—that discovery is mechanical—it would not diminish the human role, because the human role is explanation, not merely verification.

  Yet, this concession is dangerous. It suggests that if we had a constructive P=NP algorithm, creativity would indeed be mechanical, but mathematics would survive because it cares about explanation. I argue this is still too concessive. Explanation often arises from the struggle of discovery. The methods we devise to find proofs often constitute the explanation. If finding becomes trivial via a black box, the conceptual landscape may atrophy. Nevertheless, the primary point stands: the black-box objection shifts the debate from the *feasibility* of discovery to the *nature* of understanding. It does not salvage the claim that P=NP implies creativity is mechanical in a way that matters to us. It merely argues that mechanical creativity is acceptable because real mathematics is about something else.

  In conclusion, the Existence-Only Resolution refutes the creativity argument by exposing the gap between abstract complexity and physical realisability. The argument that P=NP mechanises creativity relies on tractability-in-principle, but philosophical claims about mind and discovery must rest on tractability-for-us. A non-constructive proof that SAT is in P leaves the cognitive labour of discovery untouched. The strongest consideration against this view is the Platonist insistence that objective difficulty matters more than subjective access. I reject this because 'creativity' is a property of agents, not problems. If the agent cannot access the mechanical solution, the creativity remains non-mechanical for that agent. Furthermore, the objection regarding black-box certificates correctly identifies that verification is not understanding, but this changes the subject from the hardness of discovery to the value of explanation. It does not restore the mystery of discovery if discovery becomes trivial; it merely relocates the value of mathematics. Ultimately, the P versus NP question is philosophically significant only insofar as it describes the limits of what we can build and run. Without constructivity and bounded constants, the equality of P and NP is a metaphysical curiosity, not a threat to human creativity. The verdict is clear: tractability-in-principle is philosophically inert regarding the mind. We should care only about what we can compute, not what merely exists.
