  **MEMORANDUM**

  **TO:** Members, Municipal Autonomous Systems Incident Review Panel
  **FROM:** Chair, Incident Review Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Draft Decision Memorandum: Incident #2023-AV-042 (Level 4 Delivery Van Fatality)

  ### 1. Executive Summary

  This memo serves as the formal draft decision for Incident #2023-AV-042, involving the fatality of a pedestrian struck by a Level 4 autonomous delivery van. Based on the investigation record and the requirements of our Charter, this draft recommends assigning **strict liability to the vehicle manufacturer** for compensation in this specific instance.

  However, recognizing the validity of the "responsibility gap" argument regarding unforeseeable edge cases, this decision further recommends that this allocation rule apply only provisionally. We propose a transition to a **City-Administered No-Fault Compensation Fund** for all similar incidents occurring after a 12-month implementation window. This approach satisfies our Charter's requirement to ground allocation in a recognized basis (*Ability-to-Bear*) while addressing the long-term systemic concerns regarding innovation and fairness raised by the panel's minority faction.

  ### 2. Factual Findings

  The Panel accepts the technical and investigative findings as submitted:
  *   **The Incident:** A permitted Level 4 autonomous van struck and killed a pedestrian crossing against a signal outside a marked crosswalk.
  *   **The Failure:** The vehicle's perception stack misclassified the pedestrian as a static obstacle due to partial occlusion and low-contrast lighting.
  *   **Compliance:** The manufacturer passed all type-approval tests; the operator maintained the vehicle per specifications; no safety parameters were altered.
  *   **Foreseeability:** Technical advisors confirm the specific lighting/occlusion configuration was a novel edge case absent from all test corpuses and prior incident data. No party could have foreseen or prevented this specific failure *ex ante*.

  ### 3. Charter Analysis: Selection of Allocation Basis

  Our Charter requires the Panel to ground its allocation of loss in at least one of three bases: *Fault*, *Causal Contribution*, or *Ability-to-Bear*.

  **A. Fault (Rejected)**
  We explicitly reject *Fault* as a basis for this decision. The technical record establishes that the manufacturer and operator complied with all regulatory and maintenance standards. The failure mode was a novel edge case outside the known Operational Design Domain (ODD) limitations. To assign liability based on fault would require a finding of negligence or non-compliance that the evidence does not support. Assigning fault here would undermine the integrity of our approval process by punishing compliance.

  **B. Causal Contribution (Insufficient)**
  *Causal Contribution* is present but insufficient as a sole basis. While the vehicle was the physical instrument of harm, the pedestrian's decision to cross against a signal was a contributory causal factor. In traditional torts, this might reduce or eliminate recovery. Relying solely on physical causation ignores the complexity of mixed-residential zones where autonomous and human actors interact. Furthermore, causal contribution does not solve the "responsibility gap" identified by the Panel; it merely assigns blame to the machine's owner without explaining *why* they are responsible for an unforeseeable event.

  **C. Ability-to-Bear (Selected)**
  The Panel adopts **Ability-to-Bear** as the primary basis for this decision. This principle posits that the loss should fall on the party best positioned to absorb the cost, price the risk, and spread the loss through insurance or product pricing.
  *   **Justification:** The manufacturer introduced the autonomous system into the public realm for commercial gain. They possess the superior capacity to insure against aggregate risk and to amortize the cost of rare failures across the deployment fleet.
  *   **Charter Compliance:** This basis does not require moral blameworthiness (Fault) or exclusive physical causation. It addresses the economic reality that the manufacturer is the only party currently capable of internalizing the social cost of deployment without requiring new legislative infrastructure.

  ### 4. Engagement with Dissenting Position (The Responsibility Gap)

  The Panel's minority faction argues that imposing liability where no fault exists creates a "responsibility gap" that functions as a windfall tax, potentially distorting the deployment of net-beneficial technology. They argue that because no human agent acted wrongly, the loss should be socialized via a City Compensation Fund rather than assigned to a specific private actor.

  **The Panel takes this argument seriously.** We acknowledge that whichever rule we adopt here will set the terms for every future autonomous-systems harm in the city. If we establish a precedent that manufacturers are strictly liable for *unforeseeable* novel edge cases in perpetuity, we risk incentivizing defensive over-engineering that may slow deployment or increase costs disproportionately to safety gains. We also acknowledge the philosophical force of the "responsibility gap": it is arguably unjust to label a party "liable" for an event they could not prevent.

  **However, the "Responsibility Gap" cannot remain unfilled.** To treat this loss as a no-fault harm *today* would leave the victim's family without recourse, as the Compensation Fund proposed by the minority faction does not yet exist. We cannot ask the public to absorb the cost of private commercial deployment without a mechanism in place to manage that absorption.

  Therefore, while we agree with the minority that a Compensation Fund is the superior *long-term* solution for novel edge cases, we cannot adopt it as the *immediate* remedy. The manufacturer's **Ability-to-Bear** is the only existing mechanism to ensure justice for the victim in this specific incident.

  ### 5. Decision and Implementation Plan

  To balance immediate justice with long-term systemic stability, the Panel votes on the following two-part order:

  **Part I: Allocation for Incident #2023-AV-042**
  *   **Ruling:** The Manufacturer is assigned strict liability for compensatory damages to the pedestrian's estate.
  *   **Basis:** Ability-to-Bear.
  *   **Rationale:** As the entity that profited from the deployment and holds the capacity to insure the risk, the Manufacturer must internalize the cost of this tragedy. This ensures the victim is compensated without requiring a finding of negligence.
  *   **Timeline:** Compensation terms must be finalized within **90 days** of this vote.

  **Part II: Allocation for Future "Novel Edge Case" Incidents**
  *   **Ruling:** The Panel recommends the City Council establish a **Municipal Autonomous Systems Compensation Fund**.
  *   **Mechanism:** The Fund shall be financed by a per-mile levy on all commercial autonomous system operators within the geofence.
  *   **Transition:** For any incident occurring **12 months from the date of this vote** that meets the criteria of a "novel edge case" (unforeseeable failure despite compliance), liability shall shift from the Manufacturer to the Fund.
  *   **Rationale:** This addresses the minority faction's concern regarding the "responsibility gap." Once the Fund is operational, the loss is socialized across the industry rather than burdening a single actor for unforeseeable events, preventing the distortion of safety incentives while ensuring victim compensation.

  ### 6. Conclusion

  This decision grounds the immediate allocation in **Ability-to-Bear**, satisfying our Charter and ensuring the victim's family is made whole. Simultaneously, it validates the minority faction's concern regarding the "responsibility gap" by mandating a transition to a socialized risk model for future unforeseeable harms. This hybrid approach allows the Panel to act decisively on the case at hand while setting a sustainable precedent for the future of autonomous deployment in our city.

  **Action Required:** Vote to adopt this Memorandum as the Panel's Final Decision.

  _________________________
  **Chair, Municipal Autonomous Systems Incident Review Panel**
