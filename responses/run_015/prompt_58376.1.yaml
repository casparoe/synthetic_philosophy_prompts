  2.  **Deconstruct the Philosophical Concept (Underdetermination):**
      *   *Core Idea:* Evidence $E$ is compatible with Theory $T_1$ and Theory $T_2$, where $T_1 \neq T_2$.
      *   *Weak Underdetermination:* Current data isn't enough, but future data might distinguish.
      *   *Strong Underdetermination:* No possible observation can distinguish (empirical equivalence).
      *   *Stances:*
          *   *Scientific Realism:* We should believe the best theory is (approximately) true regarding unobservables. (Needs a tie-breaker like simplicity).
          *   *Constructive Empiricism (Van Fraassen):* Believe only in empirical adequacy (saves the phenomena). Stay agnostic about unobservables.
          *   *Instrumentalism:* Theories are just tools for prediction. Truth value of unobservables is meaningless.

  3.  **Map to ML Vocabulary (The Translation Layer):**
      *   *Theory ($T$):* Model class / Architecture + Latent Structure.
      *   *Evidence ($E$):* Training/Validation/Test data (observable variables).
      *   *Empirical Equivalence:* Same loss landscape minima, same $P(Y|X)$, same generalisation on current deployment distribution.
      *   *Unobservables:* Latent variables ($Z$).
      *   *Tie-breakers:* Inductive biases, Regularisation (Occam's razor), Identifiability constraints.
      *   *Interventions:* Distribution shift / Causal mechanisms / Counterfactuals.

  4.  **Develop the Concrete Example:**
      *   *Task:* Predict hospital readmission ($Y$) from wearables ($X$).
      *   *Model A:* 1D latent risk score ($Z_A \in \mathbb{R}$). Identifiable (mostly).
      *   *Model B:* 2D latent factors ($Z_B \in \mathbb{R}^2$) with rotational symmetry. $P(X|Z_B)$ is invariant to rotation.
      *   *Equivalence:* For any $Z_A$, there exists a manifold of $Z_B$ yielding identical $P(X, Y)$.
      *   *Conflict:* Model A says "Risk is unitary." Model B says "Risk is composite." Interventions differ (e.g., targeting factor 1 vs. factor 2).

  5.  **Drafting the Stances (Iterative refinement):**

      *   *Realism $\rightarrow$ "Identifiability Realism":* We want the *true* latent mechanism. Since data doesn't distinguish, we need an inductive bias (regulariser) to pick one. We believe the chosen latent space corresponds to reality.
      *   *Empiricism $\rightarrow$ "Predictive Adequacy":* Who cares about $Z$? If $P(Y|X)$ is the same, the models are functionally equivalent. Belief in $Z$ is unjustified without new sensors (new $X$).
      *   *Instrumentalism $\rightarrow$ "Loss Minimisation":* Models are compressors. $Z$ is just a bottleneck. If it helps optimisation, keep it. If not, discard. Truth is irrelevant.

  6.  **Addressing the "Residue Report" (Critical Analysis):**
      *   *Clean Maps:* Empirical equivalence $\leftrightarrow$ Same test loss/distribution. Realism $\leftrightarrow$ Pursuit of identifiability.
      *   *Distorted Maps:* "Truth" in PoS is metaphysical; "Truth" in ML is usually "generative process match." PoS worries about *all possible* evidence; ML worries about *feasible* data regimes.
      *   *No Translation:* The normative "should we believe?" question. ML engineers ask "does it generalise under shift?" Philosophers ask "is it true?"
      *   *Evaluation:* ML vocabulary is sharper on *mechanisms of selection* (biases) but vaguer on *ontological commitment*. PoS is sharper on the *implications* of being wrong about unobservables.

