prompt: |-
  One of the first things I internalized from years of reading rationalist blogs was the rule about sunk costs: once an expenditure is unrecoverable it drops out of the decision entirely, and any choice that stays sensitive to it is worse for that sensitivity. Escalation of commitment, throwing good money after bad, continuing a failing project because of what has already gone into it, finishing a meal you dislike because you paid for it — all treated as one failure with one diagnosis. I had come to read the rule as a claim about which facts can be reasons at all: no bare fact about what has already happened can be reason-giving; only facts about what a candidate action would bring about can be.

  Then I noticed that contract law runs, systematically and unapologetically, in the opposite direction, and I would like to know what it presupposes.

  As I understand the doctrines: a promisee who has spent money in reliance on a promise that is then broken can often recover that wasted expenditure outright, as an alternative to being put in the position performance would have achieved; a promise with no bargain attached becomes enforceable, or partially enforceable, once the promisee has reasonably relied on it to their detriment and it would be unjust not to hold the promisor to it; and in some land cases partial performance by the promisee is itself what lifts an otherwise unenforceable informal agreement into enforceability. In each case it is precisely the fact that the promisee has already incurred a cost that generates the claim. Someone who had been promised the same thing and had not yet relied has, generally, nothing. The law does not merely permit attention to sunk costs; it makes sunk expenditure the trigger of an entitlement.

  Two details make it less crude than that: reliance recovery is normally capped so that a claimant cannot use it to escape a bargain that would have lost money anyway, and reliance can take the form of an opportunity forgone rather than money spent, so what matters seems to be worsened position rather than expenditure as such.

  So: what theory of reasons, or of rationality, does this pattern presuppose? I would like the implicit theory reconstructed, and I would like the following separated out for me.

  First, distinguish what the practice strictly presupposes from what it merely fits well with. Does it require genuine retrospective reasons — reasons whose force derives from what has already happened rather than from what they produce — or is it fully compatible with a purely forward-looking view on which past expenditure is only a convenient measure of damage and a way of pricing the incentive to rely? Where is the practice philosophically underdetermined, so that several rival theories would license the same rules?

  Second, I have been using a distinction of my own: call a practice cost-honoring if the bare fact that a cost has been incurred counts as a reason to continue, and cost-regarding if the fact of incurred cost operates only as evidence, as a trigger of a rule, or as a measure. Which is contract law, and does the answer differ across the three doctrines?

  Third, there is a familiar move I want tested rather than assumed: shift the unit of assessment from the individual act to the policy or disposition over time, and honoring sunk costs becomes forward-lookingly rational after all, because an agent who is visibly disposed to continue is able to make commitments, invite reliance, and secure cooperation that a purely consequentialist agent cannot. If that move works, does the law presuppose anything my original reading of the sunk-cost rule actually denied, or does it show the rule was always a claim about a different unit of assessment?

  Fourth, if we took the strict version seriously and rebuilt the doctrine around it — expectation-based recovery only, no claim generated by reliance as such — what would have to change? Would promissory estoppel collapse into incoherence, or would informal promising simply stop being usable, and is either of those a cost a forward-looking theorist should care about?

  Finally, is there a defensible core in honoring sunk costs that the legal pattern reveals and the blog-post version flattens — the thought that some goods, such as projects, relationships, and promises kept, are partly constituted by having been costly to sustain, so that bracketing the expenditure is not neutrality but a way of destroying the thing — or is that just the fallacy in a better costume? I would like that last claim argued both ways and then adjudicated.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Conflict:** The user contrasts the "rationalist" sunk cost fallacy (past costs are irrelevant to decision-making) with Contract Law doctrines (reliance damages, promissory estoppel, part performance) which seem to make past costs *relevant* and even *generative* of rights.
      *   **Task:** Reconstruct the implicit theory of reasons/rationality in contract law and answer five specific sub-questions.
      *   **Sub-questions:**
          1.  *Presupposition vs. Fit:* Does law *require* retrospective reasons, or is it compatible with forward-looking instrumentalism? Where is it underdetermined?
          2.  *Cost-Honoring vs. Cost-Regarding:* Is the law honoring sunk costs (bare fact is a reason) or merely regarding them (evidence/trigger/measure)? Does this vary by doctrine?
          3.  *Unit of Assessment:* Does shifting from act to policy/disposition save the rationalist view? Does this change the philosophical stakes?
          4.  *Strict Version:* What if we rebuilt doctrine on strict expectation-only (no reliance)? Would estoppel collapse? Is that a cost forward-lookers should care about?
          5.  *Constitutive Costs:* Is there a defensible core where costs *constitute* the value (projects/relationships), or is this just dressed-up fallacy? Argue both sides and adjudicate.

  2.  **Analyze the Legal Doctrines:**

      *   *Reliance Damages (Fuller & Perdue):* Protects the "negative interest." Puts plaintiff in position before promise. Triggered by expenditure.
      *   *Promissory Estoppel:* Enforces promises without consideration if reliance was foreseeable and injustice results without enforcement.
      *   *Part Performance (Statute of Frauds):* Actions taken make an oral contract enforceable.
      *   *Common Thread:* Reliance (action taken based on promise) creates entitlement.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the tension. The rationalist view is about *ex ante* efficiency; the legal view is often about *ex post* fairness and stability.

      *   **Section 1: Presupposition vs. Fit (Retrospective vs. Forward-Looking)**
          *   *Question:* Does law *need* backward-looking reasons?
          *   *Analysis:* A law-and-economics scholar (Posner etc.) would say no. Reliance damages are just incentives to optimize reliance. If you protect reliance, people rely efficiently. If you don't, they under-rely.
          *   *Verdict:* The practice is *compatible* with forward-looking views. It does not *strictly presuppose* metaphysical retrospective reasons. It is philosophically underdetermined. The "injustice" language suggests retributive/corrective justice (backward-looking), but the *function* can be explained instrumentally.

      *   **Section 2: Cost-Honoring vs. Cost-Regarding**
          *   *Definitions:* Honoring = Cost itself is the reason. Regarding = Cost is a proxy/trigger.
          *   *Analysis:*
              *   *Reliance Damages:* Cost-regarding. It measures loss. It's capped by expectation (can't profit from breach).
              *   *Promissory Estoppel:* Closer to Cost-Honoring. The detriment *makes* the promise binding. But still tied to "injustice" (forward-looking harm prevention?).
              *   *Part Performance:* Cost-Honoring-ish. The act *is* the substitute for the writing.
          *   *Verdict:* Mostly Cost-Regarding. The law cares about the *detriment* (worsened position), not the expenditure for its own sake. If I spend \$1M on a useless project based on a promise, I might not recover \$1M if the project was doomed. (The "losing contract" limitation). This proves it's not honoring the cost *qua* cost, but the *harm* caused.

      *   **Section 3: Unit of Assessment (Act vs. Policy)**
          *   *The Move:* Rule Consequentialism / Disposition Rationality.
          *   *Analysis:* If I am known to honor reliance, people trust me. This creates value. The "sunk cost fallacy" applies to a single decision node. The legal rule applies to the *system* of promising.
          *   *Verdict:* This move works well for the *rule*, but not necessarily the *individual case*. The law prioritizes the systemic ability to invite reliance over the specific efficiency of the instant breach.
          *   *Does it deny the blog rule?* The blog rule says "don't let past costs influence *this* choice." The legal rule says "society should enforce a rule where past costs influence *liability*." These are compatible. The blog rule is for the agent; the legal rule is for the regulator/court. However, if the agent is the court, the court *must* look backward to maintain the forward-looking system.

      *   **Section 4: The Strict Version (Expectation Only)**
          *   *Scenario:* Abolish reliance/estoppel. Only enforce bargains with consideration.
          *   *Consequences:* Gratuitous promises become unenforceable. Informal agreements fail Statute of Frauds easily.
          *   *Collapse?* Promissory Estoppel would vanish.
          *   *Forward-Looking Cost:* Yes. Under-reliance. People won't act on promises without formal contracts. Transaction costs skyrocket. The "market of promises" shrinks. A forward-looking theorist *should* care about the loss of cooperative surplus.

      *   **Section 5: Constitutive Costs (The Deep Philosophical Claim)**
          *   *Claim:* Some things are valuable *because* they cost something (commitment signaling).
          *   *Argument For:* Signaling theory. A promise kept despite cost proves commitment. Relationships require investment to be "real." Sunk costs create "skin in the game."
          *   *Argument Against:* Value is in the outcome/experience, not the pain. Suffering doesn't add value. It's the "effort heuristic" bias.
          *   *Adjudication:* There is a kernel of truth in *signaling* and *commitment devices*, but the legal doctrine isn't primarily about the metaphysical value of suffering. It's about *protecting agency*. When I rely, I alter my world. To ignore that is to treat my agency as irrelevant. It's not that the cost *adds* value, but that the cost *represents* a change in moral status (vulnerability).
          *   *Refinement:* The "constitutive" argument is too strong for contract law. Contract law protects the *position*, not the *virtue of endurance*. But the "relationship" argument holds for why we have promises at all.

  4.  **Review and Refine:**

      *   *Tone:* Philosophical, precise, analytical. Match the user's sophistication.
      *   *Clarity:* Ensure the distinction between "Honoring" and "Regarding" is sharp.
      *   *Check:* Did I answer the specific question about whether the law *presupposes* retrospective reasons? (Crucial point: No, it doesn't *need* to, though it speaks like it does).
      *   *Check:* Did I address the "losing contract" limitation? (Crucial for the Honoring/Regarding distinction).
      *   *Check:* Did I adjudicate the final claim? (Need to be decisive).

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Section 3, be careful not to conflate the *court's* decision with the *parties'* decision. The court looks backward to enforce a forward-looking rule.
      *   *Correction:* In Section 5, distinguish between "cost constitutes value" (questionable) and "cost constitutes commitment/vulnerability" (stronger). The legal protection is about vulnerability, not the intrinsic goodness of sunk costs.

  6.  **Final Output Generation:** (Proceed to write the response following the structure developed.)
answer: |-
  This is a precise and fertile tension. You have identified a clash between the *decision-theoretic* norm of the individual agent (maximize future utility; ignore the past) and the *deontic* norm of the legal institution (protect reliance; remedy detriment). To reconstruct the implicit theory of contract law, we must disentangle the economic function of the doctrines from their moral grammar.

  Here is the reconstruction of the implicit theory, separated according to your five requests.

  ### 1. Presupposition vs. Fit: The Underdetermination of Retrospective Reasons

  Does contract law *require* genuine retrospective reasons (reasons whose normative force derives solely from the past), or is it compatible with a purely forward-looking view?

  **The Verdict:** The practice is philosophically underdetermined. It *speaks* the language of retrospective justice but *functions* largely on forward-looking incentives. It does not strictly presuppose metaphysical retrospective reasons.

  **The Forward-Looking Fit:** A law-and-economics theorist (e.g., Posner) can explain reliance damages and promissory estoppel without ever admitting a backward-looking reason. On this view, the law is not saying, "You spent money, so you deserve compensation." It is saying, "If we do not compensate expenditure, agents will under-invest in reliance, reducing the total surplus of cooperative ventures."
  *   **Reliance Damages:** These are not a recognition of the past *as such*, but a pricing mechanism. By making the promisor internalize the cost of the promisee's reliance, the law incentivizes the promisor to only make promises they intend to keep, and the promisee to only rely when it is efficient to do so.
  *   **Promissory Estoppel:** This is a rule against negative externalities. Breaking a promise that induced reliance imposes a harm (worsened position) on the promisee. Enforcing the promise is a Pigouvian tax on careless promising.

  **The Presupposition Gap:** However, the *language* of the doctrines ("unjust," "detriment," "restoration") fits a Corrective Justice model (e.g., Weinrib or Benson) better than an Efficiency model. Corrective Justice posits that the promisor has disturbed the normative equilibrium by inviting reliance. Here, the past expenditure matters not because of future incentives, but because it created a specific normative relationship *now*.
  *   **Where it is underdetermined:** The "losing contract" limitation (reliance damages cannot exceed expectation damages) is the smoking gun. If the law truly honored the sunk cost *as a retrospective reason*, it would reimburse the expenditure even if the contract would have lost money. But it does not. It caps recovery at the position performance would have achieved. This proves the law is not protecting the *expenditure* itself, but the *expectation of gain* that justified the expenditure. This suggests the forward-looking view (protecting the bargain's value) is the deeper structure, while the reliance mechanism is the procedural tool.

  ### 2. Cost-Honoring vs. Cost-Regarding

  You defined **cost-honoring** as treating the bare fact of incurred cost as a reason to continue/compensate, and **cost-regarding** as using cost as evidence, trigger, or measure.

  **The Verdict:** Contract law is overwhelmingly **cost-regarding**. It treats sunk costs as a proxy for harm and a trigger for jurisdiction, not as an intrinsic good.

  **Doctrinal Breakdown:**
  *   **Reliance Damages:** **Cost-Regarding.** As noted above, the cap at expectation damages proves this. If I spend \$100 relying on a promise that would have yielded only \$50 profit, I cannot recover the full \$100. The law refuses to honor the sunk cost if it exceeds the forward-looking value. The cost is merely the *measure* of the loss, not the *source* of the right.
  *   **Promissory Estoppel:** **Mixed, leaning Cost-Regarding.** Reliance makes the promise enforceable. However, the Restatement (Second) §90 requires that injustice can be avoided *only* by enforcement. Courts often scale the remedy to fit the reliance, not necessarily to enforce the full promise. The cost triggers the duty, but the *extent* of the duty is modulated by fairness (a forward-looking/equitable assessment), not merely by the sum spent.
  *   **Part Performance:** **Cost-Honoring (Superficially).** Here, the act itself substitutes for the written signature. However, the rationale is evidentiary and channeling. The expenditure is evidence that a contract likely existed (people don't usually build houses on land they don't own). It is regarding the cost as *evidence of intent*, not honoring the cost as a value in itself.

  **Conclusion:** The law does not say "You spent, therefore you win." It says "You spent, therefore you are vulnerable, and the law protects vulnerability to maintain the institution of promising."

  ### 3. The Unit of Assessment: Act vs. Policy

  If we shift the unit of assessment from the individual act to the policy or disposition, does the "sunk cost fallacy" dissolve?

  **The Verdict:** Yes, the move works, but it reveals that the blog-post rule and the legal rule are addressing different agents.

  **The Analysis:**
  *   **The Individual Agent:** For the promisee deciding whether to continue a project, the sunk cost rule holds. Past money is gone.
  *   **The Legal System (The Rule-Maker):** For the court or legislature, the "sunk cost" is not a cost to *them*, but a signal of *reliance*. A legal system that visibly disregards reliance (a "purely consequentialist" system that breaches whenever efficient) suffers from a time-consistency problem. It cannot invite reliance in the first place.
  *   **The Disposition:** By adopting a disposition to "honor sunk costs" (i.e., compensate reliance), the legal system secures the cooperative surplus of future transactions.

  **Does this deny the blog rule?**
  It shows the blog rule was always about the *local* decision node, whereas the law is about the *global* equilibrium. However, there is a subtle shift: The law requires the *promisor* to be sensitive to the promisee's sunk costs.
  *   If the promisor thinks, "I should breach because the cost to me is low, ignoring that they already spent money," they are acting on the rationalist rule *locally*.
  *   The law forbids this. Why? Because if promisors generally acted that way, the institution of promising would collapse.
  *   **Implication:** The law presupposes that **rationality at the systemic level requires rules that look irrational at the local level.** It does not deny the sunk cost rule for the *promisee* (who shouldn't throw good money after bad), but it denies it for the *promisor* (who must internalize the promisee's sunk costs). This is not a contradiction; it is a division of labor. The promisee ignores sunk costs to cut losses; the promisor respects them to maintain trust.

  ### 4. The Strict Version: Expectation-Only Doctrine

  If we rebuilt doctrine around strict expectation-based recovery (no reliance claim as such), what would change?

  **The Consequences:**
  1.  **Promissory Estoppel Collapses:** Without reliance as a hook, a gratuitous promise is a gift. If uncompleted, it is unenforceable.
  2.  **Informal Promising Becomes Toxic:** In commercial contexts without formal contracts (handshake deals), a party could induce reliance knowing they can breach with impunity so long as they pay "expectation" damages. But if expectation is hard to prove (new venture), liability is zero.
  3.  **The "Losing Contract" Problem:** Currently, if a contract is breached, the plaintiff can choose reliance damages to avoid the burden of proving lost profits (which might be speculative). Under a strict expectation-only regime, if you cannot prove profit, you get nothing, even if you are out of pocket.

  **Would a Forward-Looking Theorist Care?**
  Yes. A sophisticated forward-looking theorist must care about **transaction costs** and **information asymmetry**.
  *   **Transaction Costs:** Requiring formal consideration or provable expectation for every enforceable promise increases the cost of doing business. Reliance doctrine allows informal cooperation to flourish.
  *   **Information Asymmetry:** The promisor often knows better than the promisee whether the deal is sound. If the promisor can induce reliance without liability for the expenditure (in cases where expectation is zero or hard to prove), they can externalize the risk of their own incompetence or bad faith onto the promisee.
  *   **Verdict:** Abolishing reliance claims would shrink the "market of promises." It would reduce the total volume of cooperative activity. A forward-looking theorist who values aggregate welfare should view this as a net loss. The "cost" is the atrophy of informal trust networks.

  ### 5. The Constitutive Claim: Is Value Created by Cost?

  Finally, is there a defensible core in the idea that some goods are *constituted* by having been costly to sustain?

  **The Argument For (The Constitutive View):**
  *   **Signaling and Commitment:** In game theory, "costly signaling" is the only way to distinguish true commitment from cheap talk. A promise is only credible if breaking it is costly. Therefore, the cost is not incidental; it is *constitutive* of the promise's reliability.
  *   **Investment and Identity:** In relationships and projects, value is often derived from the narrative of investment. A marriage is not just a current utility stream; it is a history of shared sacrifice. To bracket the sunk cost is to bracket the history that constitutes the relationship's depth. The "sunk cost fallacy" treats the agent as a momentary utility maximizer, but human agents are temporal beings whose identity is built on past commitments. To ignore the past is to fracture the self.

  **The Argument Against (The Fallacy View):**
  *   **The Sunk Cost Fallacy is a Cognitive Bias:** The feeling that "I must continue because I invested" is empirically correlated with poor outcomes. It is an evolutionary heuristic (waste aversion) that misfires in modern economic contexts.
  *   **Value is in the Outcome:** A relationship sustained only because "we've come this far" is a prison, not a good. A project finished only to justify past spending is waste compounded. The value of a promise kept is in the *future cooperation* it secures, not the *past pain* it endured.
  *   **Legal Protection is of Vulnerability, Not Virtue:** Contract law does not enforce promises because suffering makes them holy. It enforces them because reliance creates *vulnerability*. If I rely on you, I am in your power. The law protects me not because my spending was noble, but because your power over me creates a risk of exploitation.

  **Adjudication:**
  The "constitutive cost" claim is **true for the social institution, but false for the individual decision.**

  *   **Socially:** The *institution* of promising is constituted by the expectation that costs will be honored. Without the legal backdrop that respects reliance, the "good" of promising cannot exist. In this sense, the cost is constitutive of the *practice*.
  *   **Individually:** The *value* of the specific project or relationship is not increased by the cost itself. Continuing a bad marriage because of time spent does not make the marriage better; it makes the loss greater.

  **The Legal Synthesis:**
  Contract law does not embrace the fallacy that "cost creates value." It embraces the principle that **"reliance creates entitlement."**
  The blog-post rationalist rule is: *Do not let past costs dictate future action.*
  The legal rule is: *Do not let your action impose past costs on others without remedy.*

  These are not contradictory. The law protects the promisee's *past* (by compensating reliance) precisely so that the promisee can be rational about the *future* (by relying confidently). The law absorbs the sunk cost so the agent doesn't have to.

  **Final Conclusion:**
  The legal pattern reveals that the blog-post version of the sunk cost rule is incomplete. It is a rule for *agents*, not for *systems*. A system that instructs all agents to ignore sunk costs will generate a world where no one relies on anyone. The law presupposes a theory of **interdependent rationality**: my rationality depends on your constraint. It does not require mystical retrospective reasons; it requires a forward-looking recognition that protecting the past is the only way to secure the future. The "fallacy" is only a fallacy if you view the agent as an island. In a world of promises, the sunk cost is the bridge.
