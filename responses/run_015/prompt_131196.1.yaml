          4.  Whole-site culling is framed as a positive (biosecurity/welfare), not a negative.
      *   **User's Proposal:** A single metric: "Estimated hours of moderate-or-worse pain per kilogram of edible protein."
      *   **Questions to Answer:**
          1.  What does the current checklist presuppose about welfare? (Death as harm? Per-capita vs. Total?)
          2.  What does it presuppose about consciousness/sentience (mammalian proxies, shrimp exemption)?
          3.  Does the "pain-hour per kg" metric solve these problems or create new ones (short life/sharp death issue)?
          4.  Concretely: If a retailer wanted a standard based on "killing is a cost" + "precautionary sentience," what changes are needed? What stays the same?

  2.  **Analyze the Current Standards (The "Checklist Package"):**

      *   *Welfare View:* It's largely **welfarist** (focus on suffering during life) rather than **rights-based** (right to life). It treats welfare as a management variable, not an existential one.
      *   *Death:* The standards imply death *itself* isn't the primary welfare violation; *bad* death is. This aligns with "humane slaughter" logic. It doesn't account for the loss of future positive experiences (deprivation account of harm).
      *   *Headcount vs. Rates:* The reliance on rates (density, mortality %) implies a **per-capita/average welfare** view, not **total utilitarianism**. If it were total welfare, 10 million suffering shrimp would be worse than 100k suffering shrimp. The standards treat them as equivalent if the *rate* of suffering is the same. This is likely due to measurability/auditability, but it structurally commits to average welfare.
      *   *Mammalian Proxies:* Using eye-roll reflexes etc., on fish presupposes **functional isomorphism** (similar behavior = similar internal state). It risks false negatives for animals that don't show mammalian signs of insensibility (e.g., tonic immobility vs. shock).
      *   *Shrimp Exemption:* This suggests a **threshold view of sentience** (shrimp below the line) or purely **tractability** (we can't measure/stun shrimp easily). It ignores the "precautionary principle" (weighting by credence).
      *   *Culling:* Framing culling as "welfare" implies that living with disease is worse than non-existence. This is a specific utilitarian calculation (negative life > no life).

  3.  **Analyze the User's Proposal ("Pain-Hours per Kg"):**

      *   *Concept:* Intensity $\times$ Duration $\times$ Number of Animals / Protein Output.
      *   *Pros:* Incorporates headcount (Number of Animals). Normalizes by utility (Protein).
      *   *Cons (The "Short Life" Bug):* As the user noted, a very short life with a sharp death minimizes "pain-hours." If the metric is *only* pain, a life killed instantly at birth looks perfect (0 pain hours). This ignores the loss of potential positive welfare (the "life worth living" argument). It effectively incentivizes rapid turnover if the death is clean.
      *   *Smuggling:* It smuggles in a **negative utilitarian** bias (minimize suffering, ignore happiness) and potentially incentivizes shorter lifespans.

  4.  **Drafting the Response - Section by Section:**

