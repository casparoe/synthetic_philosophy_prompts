      *   *Correction on Shrimp:* Is it really just tractability? Some standards (like RSPCA) are starting to include crustaceans. But generally, the "ice slurry" is considered stunning by the industry, though science suggests it might be painful paralysis. I should highlight the "cold shock vs. anesthesia" distinction.
      *   *The Metric:* The user's metric is "pain per kg protein." This creates a perverse incentive to breed animals that grow fast (less time to suffer) and have high yield. This aligns with industrial efficiency, which might be *anti*-welfare if fast growth causes health issues (e.g., skeletal problems in chickens/salmon). I need to mention the **growth rate trade-off**.
      *   *Philosophical framing:* Use terms like "Deprivation Account," "Negative Utilitarianism," "Precautionary Principle," "Operationalization."

  6.  **Final Polish:** Ensure the tone is respectful, analytical, and matches the user's high level of sophistication. (The user is clearly well-read in ethics and aquaculture). Avoid oversimplifying.

      *(Self-Correction during drafting)*: Wait, regarding the "pain-hour" metric. If I minimize pain-hours per kg, and I kill the animal instantly, pain hours = 0. This implies the best welfare score is achieved by killing animals immediately after birth. This is the "Benatar asymmetry" applied to farming. I need to make sure I explain *why* this is a problem for a welfare standard that claims to support "good lives," not just "less bad deaths."

      *(Refining the Shrimp point)*: The user asks about "weighting by credence." This is the "Expected Value" approach. Current standards use a binary threshold (Sentient/Not Sentient). I need to explain why standards avoid expected value (complexity, lack of consensus on probability).

