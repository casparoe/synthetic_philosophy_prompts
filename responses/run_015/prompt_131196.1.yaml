      *   **Part 1: What the Checklist Presupposes:**
          *   *Death:* It presupposes death is neutral *if* painless. It rejects the deprivation account.
          *   *Headcount:* It commits to **Average Utilitarianism** (or prioritarianism per animal), not Total. The marketing uses totals for emotional impact, but the audit uses averages for logistical ease.
          *   *Consciousness:* It assumes **behavioral conservatism**. If it looks like a mammal sleep, it is. It fails on animals with different neurology (shrimp/fish cold shock).
          *   *Shrimp:* It's mostly **tractability** masked as sentience threshold. If it were evidentiary burden, they'd apply precautionary weighting.
          *   *Culling:* It assumes **negative welfare dominance** (a diseased life is net negative).
      *   **Part 2: The "Pain-Hour per Kg" Metric:**
          *   *Verdict:* It solves the headcount problem but introduces the "Instant Death is Best" problem.
          *   *The Bug:* It's a feature of Negative Utilitarianism. If welfare = avoidance of pain, then non-existence is perfect. It ignores the *opportunity cost* of not living a good life.
          *   *Correction:* Needs a "Positive Welfare Credit" or a baseline "Life Value" to counterbalance the pain score.
      *   **Part 3: Building a "Killing is a Cost + Precautionary" Standard:**
          *   *Changes Needed:*
              *   **Headcount Caps:** Or a tax on total numbers (Total Utilitarianism).
              *   **Slaughter Cost:** Assign a negative value to killing itself (deprivation cost), not just the method.
              *   **Sentience Weighting:** Apply a "sentience probability" factor to shrimp/crustaceans (e.g., treat them as 0.5 sentient).
              *   **Culling:** Count culled animals as deaths (welfare cost), not just biosecurity wins.
              *   **Stunning:** Require physiological verification (EEG/ECG) rather than just behavioral, especially for cold shock.
