answer: |-
  This is an exceptionally sharp dissection of the gap between the *operational logic* of welfare certification and the *ethical logic* it claims to represent. You are not over-reading the standards; you are identifying the specific points where auditability cannibalizes moral coherence.

  Here is a breakdown of what the current checklist package presupposes, an evaluation of your proposed metric, and a blueprint for what a standard built on your specified ethical views would actually look like.

  ### 1. What the Checklist Package Presupposes

  Your observations reveal that current standards are not agnostic about ethics; they are committed to a specific, narrow subset of welfarism that prioritizes **manageability over moral completeness.**

  **A. Death and the Deprivation Account**
  The standards strictly presuppose that **death itself is not a welfare harm**, provided the process is painless.
  *   **The View:** This rejects the *deprivation account of harm* (that killing is bad because it deprives the animal of a future of positive value). It adopts a *humane slaughter* view: the only moral cost of death is the sensory experience of dying.
  *   **The Implication:** This licenses early slaughter. If a salmon is killed at 2kg vs 5kg, the standard sees no welfare difference provided the stun was effective. It treats the animal as a vessel for experience that can be emptied without penalty, rather than a subject with a biographical life.

  **B. Aggregation: Average vs. Total Welfare**
  The indifference to headcount commits the standards to **Average Utilitarianism** (or per-capita welfare), not Total Utilitarianism.
  *   **The View:** A farm with 10,000 fish at 90% welfare scores the same as a farm with 10,000,000 fish at 90% welfare.
  *   **The Justification:** This is almost entirely driven by **measurability**. Auditors can sample density and mortality rates; they cannot count total lives across a supply chain. However, structurally, this means the standards cannot register the moral weight of *scale*. The marketing uses total numbers to trigger emotional response ("billions killed"), but the certification ignores those numbers to ensure the audit is scalable. This is a deliberate decoupling of moral urgency from compliance metrics.

  **C. Consciousness and Mammalian Proxies**
  Using mammalian behavioral proxies (eye-roll, equilibrium) for fish presupposes **functional isomorphism**.
  *   **The View:** It assumes that if a fish behaves like an insensible mammal, it *is* insensible.
  *   **The Risk:** This fails on **false negatives** for animals with different neurophysiology. A fish immobilized by cold shock (ice slurry) may be paralyzed but fully conscious (tonic immobility vs. anesthesia). By relying on external behavior rather than physiological markers (like EEG/ECG, which are rare in aquaculture audits), the standards presuppose that *visible struggle* is the only evidence of suffering. It ignores the possibility of "locked-in" suffering.

  **D. The Shrimp Exemption: Tractability masquerading as Sentience**
  The lack of stunning for shrimp is rarely a committed philosophical stance that shrimp are insentient. It is primarily **tractability**.
  *   **The View:** It operates on a **binary threshold** of sentience (either you count or you don't) rather than an **evidentiary burden**.
  *   **The Failure:** If it were an evidentiary-burden view, the uncertainty about shrimp sentience would trigger the *precautionary principle*. You would weight the welfare terms by the probability of sentience (e.g., if there is a 60% credence shrimp feel pain, count 60% of the harm). Current standards do not do this. They treat the lack of stunning technology as a justification for ignoring the risk. It presupposes that **welfare measures are optional if they are inconvenient**, rather than mandatory if harm is possible.

  **E. Culling as Welfare**
  Framing whole-site culling as a "welfare measure" presupposes that **a life with disease is net negative.**
  *   **The View:** This is a specific utilitarian calculation: Non-existence > Suffering Existence.
  *   **The Implication:** It validates the destruction of healthy animals alongside sick ones (to stop spread) as a net welfare *gain*. This is only coherent if you believe the future life of the culled healthy animals would have been worse than death (due to disease risk) or if you prioritize the prevention of future suffering in the surviving stock over the right to life of the culled stock.

  ---

  ### 2. The "Pain-Hour per Kg" Metric

  Your proposal: *Estimated hours of moderate-or-worse pain per kilogram of edible protein.*

  **Does it escape the problems?**
  It solves the **headcount problem** (total pain scales with total animals) and the **efficiency problem** (normalizes by protein output). However, it smuggles in a severe philosophical bug.

  **The "Short Life" Bug (Negative Utilitarianism)**
  You identified this correctly. If the metric only counts *pain*, then the optimal welfare score is achieved by **minimizing lifespan**.
  *   **The Implication:** An animal killed instantly at birth has 0 pain-hours. An animal raised for 3 years with mild discomfort has >0 pain-hours. Under this metric, **non-existence is the perfect welfare score.**
  *   **Why this is a bug:** Most welfare frameworks aim to maximize *net* welfare (Positive Experiences − Negative Experiences), not just minimize pain. By ignoring positive states (exploration, feeding, socializing), your metric incentivizes farms to breed animals that grow fast (less time to suffer) and die young. It aligns perfectly with industrial efficiency, which is suspicious for a welfare metric.
  *   **Correction:** To fix this, the metric would need to be **Net Welfare Hours per Kg** (Positive − Negative). But measuring positive welfare is notoriously harder than measuring pain, which explains why standards don't do it.

  **The "Intensity" Problem**
  "Moderate-or-worse" creates a cliff-edge. A life of "mild" discomfort counts as zero. This encourages farms to keep suffering just below the threshold rather than eliminating it. A continuous scale (0–10 suffering index) would be more robust but harder to audit.

  ---

  ### 3. Blueprint: A Standard Based on "Killing is a Cost" + "Precautionary Sentience"

  If a retailer wanted to build a standard that treats killing as a deprivation harm and applies precautionary weighting to uncertain sentience, here is what would have to change.

  **A. Structural Changes (The Math)**
  1.  **Total Headcount Caps:** Instead of just density limits, there must be a **total biomass or headcount limit** per site, or a "welfare tax" on total volume. This shifts from Average to Total Utilitarianism.
  2.  **The "Death Penalty" in Scoring:** Every slaughter event adds a fixed negative welfare cost to the batch score, representing the deprivation of future life. This cost could be amortized over the expected natural lifespan. (e.g., Killing a salmon at 3 years vs. 5 years incurs a 2-year "deprivation debt").
  3.  **Sentience Weighting:** Crustaceans (shrimp/prawns) are assigned a **sentience probability coefficient** (e.g., 0.5 based on current neuroscience). All welfare violations for shrimp are multiplied by this coefficient in the audit score. This forces the uncertainty into the math rather than ignoring it.

  **B. Operational Changes (The Practices)**
  1.  **Physiological Stunning Verification:** Ban behavioral proxies for insensibility. Require **EEG or operculum movement cessation** verified by instrumentation before bleeding. This addresses the "immobile but conscious" risk.
  2.  **Thermal Anesthesia:** For shrimp/crustaceans, ban ice slurry unless it is proven to induce anesthesia before paralysis. Require **electrical stunning** or **chemical anesthesia** (e.g., clove oil derivatives) that is verified to render insensibility before temperature drops.
  3.  **Culling Accounting:** Whole-site culling counts as a **welfare failure**, not a biosecurity win. The standard would require the retailer to offset this loss (e.g., funding habitat restoration or welfare research) because the animals are being deprived of life. It forces the company to internalize the cost of the disease risk rather than externalizing it onto the animals.
  4.  **Growth Rate Limits:** To counter the "short life" incentive, set **minimum growth durations**. You cannot harvest before a certain physiological maturity. This prevents the "pain-hour" metric from incentivizing rapid-turnover breeds that often have skeletal/cardiac issues.

  **C. What Would Survive Unchanged?**
  A surprising amount of the current checklist is compatible with this stricter view, because **suffering during life is bad under almost any theory.**
  1.  **Density Limits:** Still required. High density causes stress regardless of whether killing is a harm.
  2.  **Water Quality/Oxygen:** Still required. Hypoxia is a positive harm.
  3.  **Disease Monitoring:** Still required. Preventing disease prevents suffering (even if culling is penalized, preventing the need to cull is better).
  4.  **Handling Protocols:** Rough handling causes pain; this remains a violation.

  ### Summary

  The current standards presuppose a **Negative Utilitarianism of Management**: minimize visible suffering during the production process, ignore the existential cost of death, and ignore the scale of production because it is hard to count. They treat welfare as a **hygiene factor** (like food safety) rather than a **moral ledger**.

  Your "pain-hour per kg" metric corrects the scale blindness but risks incentivizing non-existence. To build a standard that respects the "loss of future" and "uncertain sentience," you must move from **auditing processes** (did you stun?) to **auditing outcomes** (what was the total net welfare balance of this batch, including the cost of their death?).

  The reason retailers don't do this is not just measurement difficulty; it is that a standard which counts death as a harm and shrimp as potentially sentient would drastically reduce the supply of certifiable protein, potentially collapsing the market for "welfare-certified" farmed fish entirely. The current standards are designed to make high-welfare farming *scalable*, not to make it *ethically complete*.
