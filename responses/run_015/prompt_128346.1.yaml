answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Decision Procedures Under Logical Uncertainty and Self-Replication
  **Parties:** Proponent of Updateless Decision Theory (UDT) | Proponent of Updateful (Causal) Decision Theory (CDT)
  **Date:** [Current Date]

  ## 1. AGREED CLAIMS

  The undersigned agree to the following stipulations regarding the scenarios, the meta-ethics of decision theory, and the criteria for a successful solution. These claims are treated as fixed premises for the remainder of this document.

  1.  **Scenario Integrity:** In all cases, the trustee is a single decision procedure. All copies or simulations are exact instantiations of this source code. There are no causal back-channels between runs (e.g., no communication between the Reading and Inverness instantiations).
  2.  **Logical Facts:** In Case A, the bit *B* (the parity of the digit of pi) is a mathematical fact. It is not causally influenced by the trustee's action. Both camps accept the trustee's prior over *B* is one-half and that *B* is computable in principle.
  3.  **Causal History:** In Case A, the benefactor's simulation occurred yesterday. The deposit of £1,000,000 (conditional on the simulation's action) is a completed causal event relative to the trustee's current decision.
  4.  **Descriptive Rationality:** The word "rational" is used descriptively throughout Section 1 and Section 2 to denote adherence to a specific decision procedure, not to adjudicate which procedure is normatively superior.
  5.  **Money Pumps:** Both camps agree that a decision procedure that accepts a sequence of trades leaving it strictly poorer than an available alternative, in a way that could be exploited by an adversary, is defective *unless* the procedure can demonstrate that the "loss" is a necessary cost of achieving a higher-order goal (e.g., logical consistency across copies).
  6.  **Ex Ante Preference:** Both camps agree that, *before* a scenario begins (ex ante), a trustee prefers a policy that maximizes the expected utility of the endowment pot. The dispute concerns whether the trustee *during* the scenario (ex post) is obligated to follow the ex ante optimal policy if new information (causal or indexical) suggests a different act yields higher expected utility conditional on that information.
  7.  **Binding:** The statement "You should have bound yourself in advance" is agreed to be a factual claim about the ex ante optimal policy. It is not agreed whether failing to bind oneself is a criticism of the decision theory or merely a remark about the agent's historical options.
  8.  **Solution Criteria:** A solution to a decision problem must specify: (a) the action taken, (b) the counterfactual reasoning used to justify it, and (c) how the procedure handles self-modification or pre-commitment if given the opportunity.
  9.  **Case B Prize Structure:** In Case B, if the prize is paid to a local budget rather than the common pot, the payoff structure changes from a cooperative coordination problem to a competitive (or independent) one. Both camps agree this alters the utility function, but disagree on whether it alters the *decision rule* required to maximize that utility.

  ## 2. DISAGREEMENTS TABLE

  The following table records the substantive divergences between the Updateless and Updateful positions. Where one side contests the phrasing of the other's view, this is noted in the "Commitment" column.

  | Crux (Sub-Question) | Updateless Commitment | Updateful (Causal) Commitment | Shared Case/Argument Bearing on Crux | Predicted Outcome of Case/Argument |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Object of Evaluation**<br>Is the primary object of evaluation the specific *act* taken now, or the *policy* (input-output map) selected ex ante? | **Policy.** The trustee evaluates the expected utility of the entire policy across all possible worlds and instantiations. The current act is merely the output of the optimal policy. | **Act.** The trustee evaluates the causal consequences of the specific act taken now, conditional on all currently available evidence. | **Case A (Odd Digit).** The simulation's action is fixed. The current act cannot causally change it. | **UDT:** Pay £1,000. (Policy "Pay" secures the £1M deposit logically).<br>**CDT:** Decline. (Act "Pay" costs £1k with no causal return). |
  | **2. Control & Correlation**<br>Are the outputs of other computations implementing one's own decision procedure things one *controls*, or merely events *correlated* with one's action? | **Control.** Logical correlation implies control. If I decide X, any exact copy of me *must* decide X. I control the logical fact that determines both outputs. | **Correlation.** I do not control the copy. We are correlated because we share source code, but my action does not causally force their action. Treating correlation as control risks magical thinking. | **Case B (Two Centres).** Identical inputs, causally isolated. | **UDT:** Coordinate via policy (e.g., mixed strategy) to ensure exactly one presses.<br>**CDT:** *Note: CDT proponent must disambiguate.* Standard CDT treats twin's action as fixed. If twin presses, I should not. If twin doesn't, I should. Without P(Twin Presses), action is undefined or defaults to dominant strategy. |
  | **3. Indexical Evidence**<br>Is self-locating information (e.g., "I am the one being asked now") admissible evidence that updates probabilities? | **No (or Limited).** Indexical information should not screen off the logical correlation with the simulation. I should reason as if I am the simulation until I know otherwise. | **Yes.** "I am here now" is valid evidence. It updates the probability of being in the branch where the money was already deposited vs. not. | **Case A (Odd Digit).** Trustee knows they are in the branch where they are asked. | **UDT:** Knowledge of being asked does not absolve the duty to Pay.<br>**CDT:** Knowledge of being asked implies the simulation phase is over. |
  | **4. Counterfactuals**<br>What kind of counterfactuals are required? Logical (what if the code output differently?) or Causal (what if I pressed the button differently?)? | **Logical.** We need a theory of logical counterfactuals: "If my code output 'Pay', what would the simulation have done?" | **Causal.** We need causal counterfactuals: "If I press the button, what happens next?" Logical counterfactuals are ill-defined or unnecessary. | **General Theory.** The coherence of "logical counterfactuals." | **UDT:** Predicts a formal theory of logical counterfactuals will validate their reasoning.<br>**CDT:** Predicts such a theory will either collapse into causal theory or prove incoherent. *CDT may gesture at Evidential Decision Theory (EDT) as a third position that captures correlation without logical control, but rejects EDT for other reasons.* |
  | **5. Reflective Stability**<br>If a decision theory advises its agents to self-modify into agents of another sort, has it indicted itself? | **Yes.** A rational theory must be reflectively stable. If CDT agents wish to self-modify into UDT agents ex ante, CDT is defective. | **No.** Self-modification is a tool. A CDT agent may build a UDT sub-agent to solve specific problems (like Case A) while remaining CDT itself. The theory is about *choice*, not *architecture*. | **Case C (Retrofit).** Paying £100 to revert to pre-B policy. | **UDT:** Agent should not need to pay £100; it is already following the pre-B policy. If it must pay to *enforce* it, it pays.<br>**CDT:** Agent should not pay £100. The money is already deposited. Reverting changes nothing about the past and costs £100 + £1,000 now. |
  | **6. Case B: Prize Structure**<br>Does changing the prize from a common pot to local budgets change the decision theory or the trustee's goal? | **Goal.** The decision theory (maximize policy utility) remains the same. The utility function changes (Sum of local budgets vs. Common pot). If copies are "me", I value their budgets. | **Theory/Goal Boundary.** If the trustee is *for* the local instantiation, CDT maximizes local utility. If the trustee is *for* the common pot, CDT maximizes common utility. The dispute is about what the trustee *is*. | **Case B (Two Centres).** Local vs. Common payoff. | **UDT:** Predicts agents will cooperate regardless of pot structure if they identify as the same policy.<br>**CDT:** Predicts agents will defect/compete if budgets are local, as they cannot causally affect the twin's budget. |
  | **7. Ex Ante Standpoint**<br>Where does the ex ante standpoint come from for a system that was trained rather than designed and has no identifiable first moment? | **Logical Prior.** The standpoint is the logical prior over all possible executions of the code. It does not require a temporal "start." | **Training History.** The standpoint is the state of the agent at the last training update or design phase. If no such phase exists, "ex ante" is a fiction. | **General Architecture.** Trained neural nets vs. Designed code. | **UDT:** Predicts trained agents will converge on updateless behavior if selection pressure is high.<br>**CDT:** Predicts trained agents will learn causal models of their environment. |

  *Note on Row 4:* The Updateful proponent notes that standard Causal Decision Theory is distinct from Evidential Decision Theory (EDT). While EDT accounts for correlations, the Updateful proponent rejects EDT for failing to distinguish causation from correlation in other contexts (e.g., the Smoking Lesion). The Updateful proponent maintains that CDT is the correct baseline, even if it requires auxiliary mechanisms (like pre-commitment devices) to solve Case A.

  *Note on Row 5:* The Updateless proponent contests the Updateful phrasing that self-modification is merely a "tool." They argue that a theory requiring a tool to fix its own recommendations is functionally equivalent to a theory that recommends the fix directly. The Updateful proponent maintains this is a category error.

  ## 3. WHAT WOULD MOVE US

  We agree that the current stalemate is due to informal ambiguities in the concepts of "control," "counterfactual," and "self." We identify the following as potential resolution paths:

  1.  **Formal Equivalence Result:** If a formalism can be constructed showing that Updateless recommendations are mathematically equivalent to Updateful recommendations augmented by a specific class of pre-commitment devices (or vice versa), the dispute may be verbal.
  2.  **Theory of Logical Counterfactuals:** The Updateless side requires a rigorous, paradox-free definition of "logical counterfactuals" (e.g., what it means for a mathematical truth to depend on a computation). If such a theory is proven impossible, the Updateless position collapses.
  3.  **Reflective Stability Proof:** If it can be formally demonstrated that an Updateful agent, given unlimited self-modification opportunities, will inevitably modify itself to become Updateless, this would weigh heavily in favor of Updateless theory as the "stable" equilibrium.
  4.  **Tournament Data:** While philosophical cases are static, we agree to participate in a simulated tournament where agents with known source codes interact in variants of Case A and B. If one class of agents consistently secures higher endowments across a distribution of scenarios, the losing side must concede practical superiority, even if theoretical disagreement remains.
  5.  **Settling the "Self":** Both sides agree that if a biological or computational criterion can definitively establish where one "agent" ends and another begins (e.g., in Case B), this would resolve the disagreement on value aggregation. Currently, this boundary is assumed rather than derived.

  ## 4. NOTE ON VERBAL VS. SUBSTANTIVE DISPUTES

  We acknowledge that portions of our disagreement may be verbal rather than substantive. Specifically:

  *   **"Control":** The Updateless side uses "control" to mean "logical determination." The Updateful side uses "control" to mean "causal influence." If both sides agree on the mathematical dependencies but disagree only on the label "control," this is verbal. However, if the label dictates the action (e.g., "I only optimize for what I control"), the dispute is substantive.
  *   **"Rational":** We have used "rational" descriptively. If we revert to normative usage, we may find we agree on the *outcome* (e.g., "Agents should be built to Pay in Case A") but disagree on whether the *act of Paying* is rational given the agent's current state.
  *   **"The Agent":** In Case B, if the Updateless side defines "The Agent" as the set of all instantiations, and the Updateful side defines "The Agent" as the single instantiation, they may be optimizing the same function over different domains. We require a meta-theory of agent individuation to settle this.

