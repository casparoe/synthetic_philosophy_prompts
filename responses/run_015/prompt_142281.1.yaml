prompt: |-
  i help run a volunteer bike repair workshop, maybe 40 volunteers, most of them stay one season, and basically everything we know how to do gets passed on by watching somebody do it and then showing the next person. practices come and go and nobody is steering it. i started thinking about this in a half-baked darwinian way and made up three labels for what i keep seeing: demo-magnets (it spreads because it looks cool the one time you see it), founder-shadows (it's only still around because whoever invented it is still around doing it), and quiet good ones (it works, nobody notices, and it vanishes after one unlucky week).

  i want a procedure i can actually run by myself in about twenty minutes, with no data beyond what i can watch and who i can ask, that tells me for a given practice which of those three is going on, and then whether we should deliberately protect it, deliberately kill it, or leave it alone. give me the questions in order, what counts as a good enough answer to each, and be straight about which steps are really just my hunch dressed up as a method.

  then run it on three real ones: a weirdly complicated way of truing a wheel that one old volunteer does and everybody copies; a sign-in rule everybody follows but nobody can explain the point of; and a way of greeting people at the door that we dropped after two bad saturdays.

  also my co-organizer says the whole framing is bogus because we copy on purpose and improve things as we hand them over, which she says isn't how genes work. i dont know what to say to that, so build whatever you think about it into the procedure. please answer in american english.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Co-organizer of a volunteer bike repair workshop.
      *   **Context:** ~40 volunteers, high turnover (one season), knowledge transfer via observation/apprenticeship (tacit knowledge), no central steering.
      *   **Problem:** Practices evolve organically, sometimes good ones die, bad ones stick, some persist only due to specific individuals.
      *   **User's Framework:** "Darwinian" labels:
          1.  *Demo-magnets:* Spread because they look cool/impressive (style over substance).
          2.  *Founder-shadows:* Persist only because the originator is still present (person-dependent).
          3.  *Quiet good ones:* Work well but are invisible/fragile (substance over style).
      *   **Task:** Create a 20-minute diagnostic procedure (questions, criteria, decision tree) to classify a practice and decide action (Protect, Kill, Ignore).
      *   **Constraint:** Must be honest about which parts are hunches vs. method.
      *   **Constraint:** Must address the co-organizer's criticism (that this isn't *really* Darwinian because volunteers copy on purpose and improve things, unlike genes).
      *   **Task:** Run the procedure on three specific examples provided.
      *   **Tone:** American English, straight talk, practical, not overly academic but rigorous enough to be useful.

  2.  **Deconstruct the "Darwinian" Criticism:**
      *   The co-organizer is right technically. Biological evolution is blind; cultural evolution is Lamarckian (acquired characteristics are passed on) and teleological (people have intent).
      *   *However*, the user's intuition is valid: *outcomes* often look like natural selection (variation, selection, retention) even if the *mechanism* is social.
      *   *Integration:* I need to validate the co-organizer while keeping the user's useful framework. The procedure should acknowledge *intent* vs. *outcome*. The "hunch" parts need to be flagged.

  3.  **Develop the 20-Minute Procedure:**
      *   **Goal:** Classify practice -> Decide Action.
      *   **Time Limit:** 20 mins. This means max 3-4 questions, quick observation, quick interviews.
      *   **Steps:**
          1.  *Observation (5 mins):* Watch it happen.
          2.  *The "Why" Test (5 mins):* Ask 3 volunteers.
          3.  *The "Absence" Test (5 mins):* What if the originator leaves?
          4.  *The "Value" Test (5 mins):* Does it actually help the bike/customer?
      *   **Decision Matrix:** Map answers to the 3 labels and the 3 actions (Protect, Kill, Leave).
      *   **Honesty Check:** Explicitly state where the user's intuition is driving the bus.

  4.  **Drafting the Questions & Criteria:**
      *   *Q1 (Origin/Dependency):* Who taught you? Is [Originator] here? -> Identifies Founder-shadow.
      *   *Q2 (Understanding):* Why do we do this? -> Identifies Demo-magnet (cool but empty) vs. Quiet Good (boring but necessary).
      *   *Q3 (Outcome):* Does the bike run better / customer happier? -> The ultimate metric.
      *   *Hunch Flag:* Distinguishing "cool" from "good" is subjective.

  5.  **Addressing the Co-organizer's Critique:**
      *   Don't call it "Darwinian." Call it "Cultural Ecology" or "Practice Auditing."
      *   Acknowledge that volunteers *choose* to copy, but they choose based on biased signals (coolness, authority) rather than pure utility. That's the bottleneck the user is spotting.
      *   Build this into the "Why" question.

  6.  **Running the Procedure on the Three Examples:**

      *   *Example 1: Complicated Wheel Truing (Old Volunteer)*
          *   Likely *Founder-shadow*. If the old volunteer leaves, does it survive? Is it actually better or just intricate?
          *   Decision: If it's strictly better, document it (Protect). If it's just "his way," simplify it (Kill/Modify).

      *   *Example 2: Sign-in Rule (Nobody knows why)*
          *   Likely *Quiet Good* at risk, or *Zombie Rule*.
          *   If nobody knows why, it's fragile. If it serves a legal/safety purpose, it's a Quiet Good needing signage. If it's bureaucracy, kill it.
          *   Decision: Investigate origin. If safety -> Protect/Explain. If nonsense -> Kill.

      *   *Example 3: Greeting (Dropped after 2 bad Saturdays)*
          *   Likely *Quiet Good* that was sacrificed for short-term speed.
          *   "Bad Saturdays" implies customer flow issues. Greeting takes time.
          *   Decision: Protect (reinstate) but optimize. Don't let short-term stress kill long-term culture.

  7.  **Refining the Output (Self-Correction/Review):**
      *   *Check:* Did I answer in American English? Yes.
      *   *Check:* Is it under 20 mins? The procedure needs to be tight.
      *   *Check:* Did I address the co-organizer? Yes, need to make sure that's woven in, not just an afterthought.
      *   *Check:* Did I flag the hunches? Yes, need a specific section for "Where you're guessing."
      *   *Tone:* Keep it grounded. No jargon.

  8.  **Final Polish:**
      *   Structure:
          1.  Validation & Reframing (Co-organizer point).
          2.  The Procedure (The 20-min audit).
          3.  The Hunch Flags.
          4.  The Decision Matrix.
          5.  The Three Case Studies.
      *   Make sure the distinction between "Protect, Kill, Leave" is clear.

      *(Self-Correction during drafting)*: I initially thought about calling it "Darwinian Audit." Better to call it "Practice Vitality Check" to appease the co-organizer while keeping the user's logic. I need to make sure I explicitly tell the user what to say to the co-organizer.

      *(Refining the "Hunch" section)*: The biggest hunch is assuming that "cool" = "bad" and "boring" = "good." Sometimes cool things *are* better. I need to make sure the procedure tests for *utility*, not just flashiness.

      *(Refining the Case Studies)*:
      1.  Wheel Truing: Likely Founder-Shadow. Action: Test utility.
      2.  Sign-in: Likely Quiet Good (safety?) or Zombie. Action: Find the "Why."
      3.  Greeting: Likely Quiet Good (killed by stress). Action: Protect.

      Let's write it.
answer: |-
  Here is a straight talk breakdown. First, let's deal with your co-organizer, because she's technically right but practically wrong, and you need to know the difference to run this audit.

  ### Part 1: The Co-organizer's Objection
  She says this isn't Darwinian because volunteers *choose* to copy and improve things, whereas genes don't choose. She is correct. Biological evolution is blind; cultural evolution is **Lamarckian** (you can pass on acquired traits) and **teleological** (people have goals).

  **What to tell her:**
  "You're right, it's not biology. It's **signal noise.** Volunteers aren't picking practices based on pure utility; they're picking based on *visibility* (does it look cool?), *authority* (did the boss do it?), or *convenience* (is this fast?). My framework isn't about genetics; it's about why good signals get drowned out by loud ones. We need to audit the signal-to-noise ratio."

  ### Part 2: The 20-Minute "Practice Vitality Check"
  This procedure is designed to be run by one person, on the floor, during a shift. It relies on observation and three quick conversations.

  **Preparation:** Pick one specific practice (e.g., "The Way We True Wheels"). Set a timer for 20 minutes.

  #### Step 1: The Dependency Test (5 Minutes)
  **Action:** Watch the practice happen. Then ask the person doing it: *"Who showed you how to do it this way?"*
  **Follow-up:** If they name a specific person, ask: *"If that person quit tomorrow, would you still do it this way?"*

  *   **Pass (Low Dependency):** "I don't know, lots of people do it," or "Yeah, this is just how we fix bikes."
  *   **Fail (High Dependency):** "Only Sarah knows this," or "I'd probably stop if she left."
  *   **The Hunch:** You are assuming that high dependency is risky. It is. But sometimes high dependency means "high skill barrier."

  #### Step 2: The "Why" Test (5 Minutes)
  **Action:** Ask three different volunteers (one new, one experienced, one who learned from a different person): *"Why do we do it this specific way? What breaks if we don't?"*
  **Criteria for a Good Answer:** They explain the mechanical or customer outcome (e.g., "The spoke tension stays even," or "The customer feels welcomed").
  **Criteria for a Bad Answer:** They appeal to tradition or aesthetics (e.g., "It looks pro," "That's just the rule," "I don't know, everyone does").

  *   **Pass (Utility):** 2 out of 3 can explain the *function*.
  *   **Fail (Ritual):** 2 out of 3 cannot explain the *function*.

  #### Step 3: The Stress Test (5 Minutes)
  **Action:** Look at the last time things went wrong (a backlog, an angry customer, a broken bike). Ask: *"Did this practice help or hurt us that day?"*
  **Criteria:** Be honest. Did the "complicated wheel method" slow down the queue? Did the "greeting" calm an angry customer?

  *   **Pass (Resilient):** It helped solve the problem or didn't make it worse.
  *   **Fail (Fragile):** It was the first thing dropped when things got busy.

  #### Step 4: The Verdict (5 Minutes)
  Map your answers to this matrix.

  | Dependency (Step 1) | Understanding (Step 2) | Stress Performance (Step 3) | **Classification** | **Action** |
  | :--- | :--- | :--- | :--- | :--- |
  | **High** (One person) | **Low** (No one knows why) | **N/A** (Person is still here) | **Founder-Shadow** | **Document or Kill.** If it's better, write it down. If not, stop doing it. |
  | **Low** (Everyone does it) | **Low** (No one knows why) | **Fail** (Dropped under stress) | **Zombie Ritual** | **Kill.** It's dead weight. |
  | **Low** (Everyone does it) | **Low** (No one knows why) | **Pass** (Helps silently) | **Quiet Good** | **Protect.** Add signage/training so people know *why*. |
  | **Low** (Everyone copies it) | **High** (Because it looks cool) | **Fail** (Slows us down) | **Demo-Magnet** | **Kill.** Replace with boring, efficient method. |

  ---

  ### Part 3: Where Your Hunch is Dressed Up as Method
  You asked for honesty. Here is where this procedure is subjective:

  1.  **The "Cool" Bias:** In Step 2, you are assuming that if someone says "It looks pro," the practice is useless. Sometimes, looking pro *is* the utility because it builds customer trust. **Correction:** In Step 2, accept "Customer Trust" as a valid functional answer.
  2.  **The "Stress" Bias:** In Step 3, you assume that dropping a practice during a rush means it's non-essential. Sometimes it means the practice is *too valuable* to rush. **Correction:** If a practice is dropped under stress, mark it as "Fragile," not necessarily "Useless."
  3.  **The Sample Size:** Asking three people in 20 minutes is not data; it's a vibe check. It works for a volunteer shop, but don't treat it like a scientific survey.

  ---

  ### Part 4: Running the Audit on Your Three Examples

  #### 1. The Complicated Wheel Truing (Old Volunteer)
  *   **Step 1 (Dependency):** High. Everyone copies the old volunteer. If he leaves, the method likely dies.
  *   **Step 2 (Why):** Low. Volunteers copy the *motion*, not the *mechanics*. They can't explain why the extra steps matter.
  *   **Step 3 (Stress):** Fail. When the queue is long, people skip the extra steps.
  *   **Classification:** **Founder-Shadow.**
  *   **Action:** **Test then Document.**
      *   *Move:* Take two identical wheels. Have the old volunteer do his way, have a standard volunteer do the standard way. Measure the result (tension meter, runout).
      *   *If his way is measurably better:* Write a one-page guide with photos. Make it standard. (Protect the *knowledge*, not the *person*).
      *   *If his way is the same:* Kill the complexity. It's a barrier to entry for new volunteers.

  #### 2. The Sign-In Rule (Nobody knows why)
  *   **Step 1 (Dependency):** Low. Everyone does it.
  *   **Step 2 (Why):** Zero. Nobody can explain the point.
  *   **Step 3 (Stress):** Pass/Fail Ambiguous. People still do it when busy, but they complain.
  *   **Classification:** **Zombie Ritual** (Risk of being a Quiet Good).
  *   **Action:** **Investigate Origin, then Decide.**
      *   *Move:* Ask the oldest organizer (not volunteers). Is it for liability? Theft prevention? Data collection?
      *   *If Liability:* It is a **Quiet Good**. You must explain *why* to volunteers ("This keeps us from getting sued").
      *   *If "We've always done it":* **Kill it.** Friction without function kills volunteer morale.

  #### 3. The Greeting at the Door (Dropped after two bad Saturdays)
  *   **Step 1 (Dependency):** Low. Everyone knew how to do it.
  *   **Step 2 (Why):** High. Volunteers know it makes customers feel welcome.
  *   **Step 3 (Stress):** Fail. It was dropped immediately when the shop got busy.
  *   **Classification:** **Quiet Good (Fragile).**
  *   **Action:** **Protect and Optimize.**
      *   *Move:* This is the classic "efficiency vs. culture" trap. You dropped it because it took time, but "bad Saturdays" often happen *because* customers feel ignored and get difficult.
      *   *Fix:* Don't drop the greeting. Shorten it. Change "Let me show you the whole shop" to "Hi, grab a seat, someone will be right with you." Keep the signal, reduce the cost. If you don't protect this, your shop becomes a garage, not a community space.

  ### Summary for your Co-organizer
  Tell her: "We aren't selecting for genes. We are selecting for **friction.** Some practices add good friction (safety, welcome), some add bad friction (complexity, mystery). This 20-minute check just helps us tell the difference before the person who knows the difference quits for the season."
