answer: |-
  Viewing the island through institutional economics, the signal fire functions as a non-excludable public good where free-riding inevitably leads to collapse; when hunters abandon watch duties, the benefit (rescue) remains shared, but the cost (labor) becomes private, incentivizing shirking. Initially, the island's food supply operates as an open-access commons, but overharvesting is mitigated only until Jack's faction transforms hunting into an excludable club good, rationing meat to members while monopolizing violence. The conch establishes a collective-choice arena satisfying Ostrom's design principles, granting voice and defining boundaries, yet it fails because monitoring is voluntary and sanctions lack credibility. Piggy's glasses represent a critical technological asset for the commons, but their seizure illustrates the fragility of shared infrastructure when property rights are undefined. Jack's tribe operates as a rival governance structure offering proportional benefits to contributors, successfully outcompeting Ralph's failing democracy. However, Golding resists pure institutional analysis by suggesting failure stems not merely from design flaws but from an innate aggressive impulse that rational choice models treat as contingent. The absence of adults signifies more than a missing nested enterprise; it represents the removal of the external enforcement mechanism that suppresses latent violence. While economics assumes actors can negotiate durable rules if incentives align, Golding argues that without the civilizing constraint of external authority, the psychological allure of power overrides collective welfare. Ultimately, the novel adds a tragic psychological dimension to commons governance, reminding us that institutional durability depends not only on structural incentives but on the fragile human capacity to value abstract rules over immediate visceral dominance.
