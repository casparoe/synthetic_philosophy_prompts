answer: |-
  This is a precise and difficult problem, and your background in marine biology makes you uniquely positioned to see where the philosophy glosses over the physiology. The 2018 Swiss Federal Food Safety and Veterinary Office (FSVO) update is indeed the canonical case study for the "boundary problem" in animal ethics.

  Here is an analysis of that episode through the lens of sentience gradient theory, mapping the decision-makers, the biological evidence, and the specific point where the theory fractures under policy pressure.

  ### 1. The Decision-Makers and the Evidence Base
  To understand where the line was drawn, we have to look at *who* drew it and *what* they were looking at.

  **The Decision-Makers:**
  This was not a parliamentary vote but a regulatory update by the **FSVO (Bundesamt für Lebensmittelsicherheit und Veterinärwesen)**. They operate under the Animal Welfare Ordinance (TSchV). The shift was driven by a combination of internal ethical review boards and external pressure from animal welfare NGOs (like *Tier im Recht*), but crucially, it relied on the **Precautionary Principle**.

  **The Evidence: Salmon vs. Lobster**
  As a salmon researcher, you know the neuroanatomy of teleost fish is well-mapped. By 2018, the consensus on salmon (*Salmo salar*) welfare rested on:
  *   **Nociceptors:** Homologous to mammals, located in the head and skin.
  *   **Processing:** Signals reach the forebrain (pallium), where integration occurs.
  *   **Pharmacology:** Analgesics (morphine) reduce avoidance behavior; opioids bind to receptors.
  *   **Policy Status:** Stunning before slaughter was already mandatory in Switzerland/EU. The moral status was "high certainty."

  For the lobster (*Homarus gammarus* and others), the evidence in 2018 was significantly thinner:
  *   **Nociceptors:** Present, but the system is decentralized (segmental ganglia).
  *   **Processing:** No centralized brain comparable to the vertebrate pallium. The subesophageal ganglion handles integration, but whether this generates *phenomenal experience* (pain) vs. *nociceptive reflex* is debated.
  *   **Behavior:** Trade-off studies (e.g., Robert Elwood's work) show hermit crabs/lobsters will sacrifice shelter to avoid shock, suggesting more than reflex.
  *   **Policy Status:** Prior to 2018, they were legally "things." Post-2018, they were "sentient beings" for the purpose of slaughter.

  **The Gradient Mismatch:**
  Under a strict sentience gradient, moral status should correlate with the *probability* and *intensity* of sentience.
  *   **Salmon:** High probability, high intensity.
  *   **Lobster:** Moderate/Low probability, unknown intensity.

  The Swiss law effectively treated them as **moral equals** regarding the specific right "not to be boiled alive." This is the first break in the gradient theory. The law did not say "lobsters deserve 50% of the protection of salmon"; it said "lobsters get the binary switch flipped to ON." This suggests policy cannot handle partial moral status.

  ### 2. The Binary Chop vs. Continuous Biology
  Sentience gradient theory posits that moral weight scales with neural complexity (integration, connectivity, behavioral flexibility). Policy, however, requires enforceable categories.

  **Where the Line Was Drawn:**
  The FSVO drew the line at **Decapoda** (lobsters, crabs, crayfish).
  *   **Why here?** It wasn't purely biological. It was a mix of **neural complexity** (larger ganglia, complex behavior) and **economic feasibility**. Lobsters are high-value, low-volume. You can mechanically or electrically stun a lobster individually without bankrupting the industry.
  *   **The Hidden Cutoff:** The biology of sentience does not stop at the Decapod order. There is no neural "event horizon" between a crayfish (protected) and a large shrimp (Caridea, also Decapoda, technically covered but practically ignored) or a stomatopod (mantis shrimp, often excluded in public discourse).

  **Where the Theory Breaks Down:**
  The gradient theory breaks down because it assumes policy can *track* the gradient. In reality, policy **collapses** the gradient.
  1.  **Epistemic Opacity:** We do not know where on the gradient sentience "ignites." Is it at a certain neuron count? Integration depth? Because we don't know, the FSVO had to pick a taxonomic proxy (Decapoda) rather than a physiological metric.
  2.  **The Cliff Edge:** A lobster one gram under a regulatory weight limit might be biologically identical to one over the limit, but the welfare protection changes. The gradient is continuous; the law is a step-function.

  ### 3. The Welfare-Transitivity Problem
  You asked about the "welfare-transitivity problem" across phylogenetic distance. This is **not a red herring**; it is the fatal flaw in applying gradient ethics to legislation.

  **The Transitivity Logic:**
  *   Premise A: We protect Lobsters because they possess Capacity X (nociception + behavioral trade-off).
  *   Premise B: Shrimp (Caridea) possess Capacity X to a degree very close to Lobsters (same order, similar nervous system, just smaller).
  *   Premise C: Insects possess Capacity X to a lesser degree.
  *   Observation: The law protects Lobsters. It technically covers Shrimp (as Decapods), but enforcement is non-existent. It excludes Insects.

  **The Contradiction:**
  If moral status is a function of Capacity X, then excluding Shrimp (in practice) or Insects creates a **moral discontinuity**.
  *   **Phylogenetic Proximity:** A lobster and a shrimp are closer than a lobster and a salmon. If we protect the lobster based on sentience, consistency demands we protect the shrimp.
  *   **The Feasibility Veto:** The reason shrimp aren't effectively protected isn't biological; it's logistical. You cannot electrically stun individual *Pandalus borealis* economically.

  **Does this hurt the Gradient View?**
  Yes. It shows that the "gradient" is not driving the policy; **feasibility** is.
  If the gradient were the true driver, we would see a sliding scale of welfare requirements (e.g., "shrimp must be killed via rapid freezing," "lobsters must be electrically stunned," "salmon must be percussively stunned"). Instead, we see a binary: Protected Species (feasible to regulate) vs. Unprotected Species (too small/numerous).

  The transitivity problem reveals that the "line" is not drawn where sentience begins, but where **regulatory friction becomes too high**. This decouples moral status from biological reality.

  ### 4. Conclusion: Where the Theory Fails
  The 2018 Swiss episode helps the sentience gradient view in one way: it acknowledges that sentience is not vertebrate-exclusive. It pushes the boundary down the phylogenetic tree.

  However, it hurts the theory in three critical ways regarding policy application:

  1.  **The Precautionary Override:** The law was passed *despite* lower evidence for lobster pain compared to salmon. This means policy tracks **public anxiety** and **precaution**, not the biological gradient of sentience. If the gradient were the metric, salmon welfare should be prioritized *more* heavily relative to lobsters than it is.
  2.  **The Implementation Gap:** The transitivity problem (Lobster vs. Shrimp) proves that the legal cutoff is economic, not biological. The gradient theory cannot account for why two animals with near-identical nervous systems receive different welfare protections based on market price.
  3.  **Binary Enforcement:** Law requires binary verdicts (guilty/innocent, legal/illegal). Sentience is probabilistic. The theory fails to provide a mechanism for "probabilistic welfare." We cannot sentence a chef to "0.6 years in prison" for boiling a "0.6 sentient" animal.

  **Verdict:**
  For a marine biologist turning to philosophy, the takeaway is this: The sentience gradient is a robust **ethical heuristic**, but it is a failed **legislative map**. The Swiss law didn't find the line where pain begins; it found the line where regulation becomes politically and economically viable. The "welfare-transitivity" contradiction you spotted is real, and it demonstrates that current policy is not tracking moral truth, but rather managing human cognitive dissonance. We protect the lobster because we can see it suffer; we ignore the shrimp because we cannot see it, and we cannot afford to save it.
