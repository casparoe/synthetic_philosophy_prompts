      *   *Phylogenetic Distance:* Lobsters (Astacidea) vs. Shrimp (Caridea). They are both Decapoda.
      *   *The Contradiction:* If the justification is neural capacity for pain, and lobsters and shrimp share similar nociceptive systems (just different sizes), excluding shrimp looks like speciesism or logistical convenience masking as ethical principle.
