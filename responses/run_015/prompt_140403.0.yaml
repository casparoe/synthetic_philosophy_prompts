answer: |-
  The debate over future contingents often stalls because participants are prioritizing different theoretical virtues without admitting it. The map here isn't just about logic versus metaphysics; it's about whether we treat truth as a semantic property of sentences or a metaphysical relation to the world. The Bivalent (Ockhamist) package buys logical simplicity and classical semantics at the cost of a somewhat mysterious ontology: if the future is open, what makes the proposition "There will be a sea battle" true *now*? The Non-Bivalent (Aristotelian) package buys ontological honesty—no fact, no truth—at the cost of classical logic, specifically the Law of Excluded Middle or Disjunctive Syllogism in certain contexts.

  The real fault line lies in the *truthmaker principle*. If you believe every true proposition requires an existing ontological ground, Non-Bivalence becomes almost irresistible for future contingents, provided you accept metaphysical openness. If you treat truth as disquotational or purely semantic, Bivalence survives easily. The modal principle (does truth entail necessity?) is often treated as the main event, but I suspect it's a downstream effect. If you have a truthmaker for the future, the modal transfer looks harmless; if you lack one, the transfer looks like fatalism.

  Regarding your variations: The *Chancy Trigger* forces the metaphysical hand. If the outcome depends on quantum decay, the Bivalents must posit a truthmaker for a specific outcome where physics only offers probabilities. This strains the "settled fact" intuition. The *Flawless Predictor*, conversely, pressures the epistemic constraint. If a physical device can read the outcome, it suggests the outcome is already encoded in the present state of the world, effectively restoring a truthmaker via backtracking or determinism. These variations don't solve the puzzle, but they expose whether your interlocutor is a semantic realist or a metaphysical pragmatist.

  Your disagreement with your supervisor and friend likely isn't about the logic itself, but about how much weight to give the absence of present truthmakers. Your friend (0.15) likely sees the logical costs of Non-Bivalence as prohibitive and trusts the Ockhamist modal distinction. Your supervisor (0.7) likely sees the lack of truthmakers as decisive. You are hovering in the middle, recognizing the logical cost but feeling the metaphysical pull.

