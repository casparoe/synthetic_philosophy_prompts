  (a) 100 > (c) 93 > (e) 85 > (d) 72 > (b) 58 > (g) 35 > (f) 10

  (a) This agent acts solely from duty, making the moral motive both operative and necessary for the action, which constitutes the paradigm of moral worth.
  (c) Though moved by duty, the redundancy of sympathy means the moral motive was not strictly necessary to produce the act, slightly diluting the credit deserved.
  (e) Her internal motivation matches (a), but the external failsafe removes the ability to do otherwise, undermining the robustness required for full credit.
  (d) She responds correctly to moral facts but lacks normative understanding, acting against her own judgment of what is required.
  (b) Spontaneous fellow-feeling is admirable but lacks moral recognition and would fail if the sentiment were absent, making it less reliable than duty.
  (g) Her motive is self-regarding rather than other-regarding, instrumentalizing the right action for the sake of her own self-conception.
  (f) Blind deference involves no grasp of moral reasons, rendering her a mere conduit for another's agency rather than a moral agent herself.

  This ranking is most sensitive to the necessity of the moral motive for the action (distinguishing (a) from (c)) and the role of alternative possibilities in deserving credit (distinguishing (a) from (e)). I would most readily revise the placement of (e); if one accepts a compatibilist view of free will where actual sequence matters more than counterfactual robustness, (e) should be ranked nearly equal to (a).
