answer: |-
  The concept you are describing has an established name in moral philosophy, though it sits at a contentious intersection of meta-ethics and normative theory. The term you are looking for is **Moral Remainders** (sometimes discussed under the broader heading of **Moral Residue**).

  The most rigorous treatment of this comes from the philosopher **Ruth Barcan Marcus** (in her paper *"Moral Dilemmas and Consistency"*), though it is closely related to **Bernard Williams'** concept of **Agent-Regret** and **W.D. Ross'** theory of **Prima Facie Duties**.

  Here is the carving you asked for: what the concept is, what it isn't, and how it functions in the debate over genuine moral dilemmas.

  ### 1. The Carving: What is a Moral Remainder?

  A **Moral Remainder** is a normative trace that persists after an agent has made a justified moral choice between conflicting obligations.

  *   **It is Normative, not merely Psychological:** This is the crucial distinction. Ordinary regret is a feeling; a moral remainder is a *reason*. As you noted, it "behaves like a debt." It generates new obligations (apology, reparation, priority next time) that would not exist had the conflict not occurred.
  *   **It implies an Unfulfilled Duty:** The existence of a remainder suggests that the duty you did *not* perform was not simply erased by the competing duty. It was overridden, but not extinguished.
  *   **It is Agent-Relative:** As you noticed with the coin-flip example, remainders attach to *choice*. If the outcome is determined by chance, you may feel sadness, but you do not owe the same reparative debt. The remainder is a tax on your agency.

  **What it is NOT (The Boundaries):**

  *   **It is not Guilt:** Guilt presupposes blameworthiness or wrongdoing. In your driving example, you are confident you chose correctly. Guilt says, "I did bad." A remainder says, "I did right, but a cost was incurred that belongs to me."
  *   **It is not Ordinary Regret:** You can regret a bad outcome caused by someone else (or nature). You cannot have a moral remainder for an outcome you didn't agency-load. Furthermore, you can regret something without owing anyone anything. A remainder *demands* action.
  *   **It is not Sadness:** Sadness is passive. If you are sad about the friend you didn't drive, that is an internal state. If you feel you *owe* her a ride next time, that is a remainder.
  *   **It is not "Dirty Hands":** The "Dirty Hands" problem (associated with Machiavelli or Walzer) usually involves doing something genuinely immoral for the greater good (e.g., torturing a terrorist to save a city). Your case is milder; it involves conflicting *innocent* claims. Remainders apply here even if no "evil" was committed.

  ### 2. The Mechanism: Why does the "Debt" vary?

  You observed two specific variables that change the size of the remainder: **Knowledge** (did the friend know?) and **Closeness** (was the choice obvious?).

  **The Knowledge Variable (Relational Duties)**
  Your intuition that the remainder shrinks if the friend never knows touches on a debate between **Objective** vs. **Relational** duties.
  *   **Objective View (Kantian/Rossian):** The duty exists regardless of knowledge. You broke a promise/claim; the moral universe is out of balance. You owe the apology even if they never hear it (perhaps as a symbolic act).
  *   **Relational View:** Morality is about maintaining relationships. If the relationship is unharmed because the friend doesn't know, the "debt" is smaller.
  *   **The Carving:** Most philosophers who defend Moral Remainders argue the remainder is *objective*, but the *method of discharge* changes. If they don't know, you cannot apologize directly, so the debt might be discharged by a general commitment to kindness or a donation in their name. The debt remains, but the payment method shifts.

  **The Closeness Variable (Overridingness)**
  You noted the remainder shrinks if the choice was obvious.
  *   If Duty A (Save a Life) conflicts with Duty B (Keep a Lunch Appointment), you choose A. The remainder of B is tiny.
  *   If Duty A (Drive Friend to Wedding) conflicts with Duty B (Drive Friend to Hospital), the choice is agonizing. The remainder is huge.
  *   **Explanation:** This suggests that duties have **weight**. When a heavier duty overrides a lighter one, the "crush" on the lighter duty is total. When two duties of nearly equal weight collide, the override is less complete, leaving a larger fragment (remainder) behind.

  ### 3. Does this prove Genuine Moral Dilemmas exist?

  This is the core of your project. The existence of Moral Remainders is the primary evidence used by **Pluralists** to argue that **Genuine Moral Dilemmas** are real.

  **The Argument from Moral Remainders (Pro-Dilemma):**
  1.  If you truly did the *only* right thing, and no wrong was done, there should be no moral debt left over. (Just as if you pay a bill in full, you owe nothing more).
  2.  However, we observe Moral Remainders (debts that persist after justified choices).
  3.  Therefore, the unchosen option was not fully cancelled. A moral claim was violated, even if justified.
  4.  Therefore, you did something wrong (violated a duty) even though you did the right thing (all-things-considered).
  5.  **Conclusion:** Genuine dilemmas exist (you are in the wrong either way).

  **The Counter-Argument (Anti-Dilemma / Monist):**
  Utilitarians and some Kantians deny this. They argue Moral Remainders are **psychological illusions** or **heuristics**.
  *   **The Explanation:** When you choose the greater good, the lesser duty is *extinguished*. You owe nothing. The feeling of "debt" is just emotional baggage—a evolutionary mechanism to keep you sensitive to values for next time.
  *   **The Carving:** To this group, your feeling of owing an apology is like feeling guilty for surviving a crash when others died (Survivor Guilt). It's a real feeling, but it doesn't track moral reality. You don't *actually* owe the dead anything; you just feel like you do.

  **Where the debate lands:**
  If you can prove the remainder is **reason-giving** (as you did: "It seems to give me an actual reason to give that person priority next time"), you strengthen the Pluralist case. If the reason is real, the duty was real. If the duty was real and unfulfilled, a wrong occurred.

  ### 4. A Coined Term for Your Project

  If "Moral Remainders" feels too technical or you want to capture the specific "debt-like" quality you described, you might use the term **Residual Obligation**.

  **Definition:** A *Residual Obligation* is a secondary duty generated by the necessary non-fulfillment of a primary duty during a moral conflict. It is distinct from the primary duty (which was overridden) and distinct from general benevolence (which is owed to everyone). It is targeted, dischargeable, and agent-specific.

  **Boundary Tests for Residual Obligation:**
  1.  **The Stranger Test:** If you had to choose between driving a friend or a stranger, do you owe the stranger a residual obligation?
      *   *If Yes:* The obligation is based on the claim itself.
      *   *If No:* The obligation is based on the relationship (supporting the Relational View).
  2.  **The Amnesia Test:** If the friend forgets you promised them a ride, does the obligation vanish?
      *   *If Yes:* It is social, not moral.
      *   *If No:* It is a Moral Remainder.
  3.  **The Coin Flip Test:** If a coin flip decides, do you owe an apology?
      *   *If No:* This confirms the obligation is tied to **Agency**, not just Outcome. This distinguishes it from simple bad luck.

  ### 5. Summary for Your Teacher

  When your teacher asks about this pattern, you can frame it like this:

  > "I am investigating **Moral Remainders**. This is the normative 'debt' that persists after a justified choice between conflicting duties. It is not guilt, because the agent believes they chose correctly. It is not mere regret, because it generates new reasons for action (like apology or future priority).
  >
  > The existence of Moral Remainders challenges the **Overridingness Thesis** (the idea that the right choice completely cancels opposing duties). If Remainders are real obligations, it suggests that in a conflict, we violate one duty even while fulfilling another. This supports the **Pluralist** view that genuine moral dilemmas exist (where an agent is left with a moral 'stain' regardless of their choice). If Remainders are merely psychological, it supports the **Monist** view that there is always one single right answer that leaves no trace."

  This framing shows you understand the concept, its boundaries, and its philosophical stakes.
