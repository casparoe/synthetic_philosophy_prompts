  # The Boltzmann Brain Decision Tree

  **Instructions for the Group:**
  Start at **Question 1**. Answer based on your intuition about the case described, not on which philosophical label you prefer. Follow the arrows to the next question or to a **Leaf** (a final position). There are 7 questions and 10 leaves.

  **The Shared Premise:** We agree that a "Boltzmann Brain" (a conscious brain fluctuating into existence with false memories) is physically possible, and that in an eternal universe, they would vastly outnumber ordinary evolved observers like us.

  ---

  ### Question 1: The Cosmic Future
  **Case:** Imagine the universe continues according to our best current physics. Does it eventually run down and stop producing new complex states (a "heat death" or crunch), or does it persist forever in a state capable of producing random fluctuations?
  *   **A.** It stops/ends before fluctuations dominate. → **Go to Leaf 1**
  *   **B.** It persists forever (or long enough for fluctuations to dominate). → **Go to Question 2**

  ### Question 2: The Theory Veto
  **Case:** You have a physical theory that is elegant, fits all data, but implies that *you* are probably a Boltzmann Brain. Does this implication automatically make the theory false?
  *   **A.** Yes. A theory that discredits my ability to trust its own evidence is self-defeating. → **Go to Leaf 2**
  *   **B.** No. The theory might be true even if it implies I'm hallucinating; I have to follow the math. → **Go to Question 3**

  ### Question 3: The Evidence Trump
  **Case:** Statistics say there are a billion Boltzmann Brains for every one Ordinary Observer. However, your memories are orderly, consistent, and extend back 20 years. Does this orderly evidence outweigh the billion-to-one statistical odds?
  *   **A.** Yes. My coherent experience is proof enough that I am not a random fluctuation. → **Go to Leaf 3**
  *   **B.** No. If the stats are that skewed, my orderly memories are likely just part of the fluctuation. → **Go to Question 4**

  ### Question 4: The Duplication Test
  **Case:** Suppose the universe creates an exact physical copy of you right now, down to the atom. Is the probability of "being you" now split 50/50 between the two bodies?
  *   **A.** No. "Being me" is a unique fact not divisible by copying. → **Go to Leaf 4**
  *   **B.** Yes. If there are two physical bases for my mind, I am twice as likely to exist. → **Go to Question 5**

  ### Question 5: The Duration Test
  **Case:** An Ordinary Observer lives 80 years. A Boltzmann Brain exists for 1 second before dissolving. When counting "observers," does the 80-year life count as more observers than the 1-second brain?
  *   **A.** Yes. We should count whole lives, not moments. (Ordinary Observers win). → **Go to Leaf 5**
  *   **B.** No. We should count observer-moments. (Boltzmann Brains win). → **Go to Question 6**

  ### Question 6: The Dissolution Expectation
  **Case:** You accept you are likely a Boltzmann Brain. Do you expect your surroundings to dissolve into chaos or vanish within the next minute?
  *   **A.** Yes. A fluctuation cannot sustain a stable environment. → **Go to Question 7**
  *   **B.** No. Even a fluctuation could, by chance, persist for a while longer. → **Go to Question 7**

  ### Question 7: The Agency Test
  **Case:** You accept you are a Boltzmann Brain. Does this status mean you are *not* the kind of thing that can make plans or be wronged by future outcomes?
  *   **A.** No. I am an agent; I should plan (or panic) based on what happens next. → **Go to Leaf 6 or 7**
  *   **B.** Yes. A fluctuation has no genuine future; planning is category error. → **Go to Leaf 8**

  ---

  ## The Leaves (Positions)

  **Leaf 1: The Finite Escape**
  *   **Name:** Finite Cosmology / Thermal Death Avoidance.
  *   **Awkward Commitment:** You are committed to a specific cosmological endpoint primarily to save your own sanity, rather than empirical data.

  **Leaf 2: Cognitive Instability**
  *   **Name:** Self-Defeating Theory Rejectionist.
  *   **Awkward Commitment:** You must reject any theory that predicts you are atypical, even if it fits all other data perfectly.

  **Leaf 3: The Evidentialist**
  *   **Name:** Bayesian Evidentialist.
  *   **Awkward Commitment:** You claim local memory evidence can override global statistical dominance, which risks ignoring base rates in other contexts.

  **Leaf 4: The Haecceitist**
  *   **Name:** "This-ness" Defender (Unnamed in literature).
  *   **Awkward Commitment:** You believe there is a fact about which observer is "you" that is independent of physical duplication or counting.

  **Leaf 5: Temporal Weighting**
  *   **Name:** Observer-Life Anthropics.
  *   **Awkward Commitment:** You must explain why a conscious moment at year 79 counts more than a conscious moment at second 1, without arbitrary cutoffs.

  **Leaf 6: The Doomer**
  *   **Name:** Standard Boltzmann Brain.
  *   **Awkward Commitment:** You believe the world is likely to vanish in a minute, yet you are currently reading this sentence calmly.

  **Leaf 7: The Deluded Optimist**
  *   **Name:** Unheld Position (Pragmatic Incoherence).
  *   **Awkward Commitment:** You believe you are a fleeting fluctuation likely to dissolve, but you are making long-term plans anyway. (Flagged as generally unheld/incoherent).

  **Leaf 8: The Boltzmann Bargain**
  *   **Name:** Pragmatic Quietism (Your Friend's Position).
  *   **Awkward Commitment:** You accept you are probably a hallucination but claim this fact has no grip on your actions or expectations.

  **Leaf 9: The Measure Nihilist**
  *   **Name:** Measure Problem Skeptic.
  *   **Awkward Commitment:** You claim there is no fact about "how many" observers exist, rendering cosmological comparisons meaningless. *(See Note Below)*

  **Leaf 10: The Indexical Agnostic**
  *   **Name:** Epistemic Humility.
  *   **Awkward Commitment:** You claim there *is* a fact about the counts, but we are fundamentally incapable of knowing it, leaving us in permanent suspension. *(See Note Below)*

  ---

  ## Notes for the Moderator

  ### 1. The "Boltzmann Bargain" Location
  Your friend's position is **Leaf 8**. The tree locates it by forcing a separation between *ontological status* (Am I a BB?) and *practical agency* (Can I plan?).
  *   **The Collision Point:** If they answer **Question 7 (A)** (I am an agent), they cannot land on the Bargain. They become either a **Doomer** (Leaf 6) or a **Deluded Optimist** (Leaf 7).
  *   **Stability Check:** The Bargain is stable only if they maintain that "being a BB" removes the *capacity* for agency, not just the *likelihood* of a future. If they admit they can act, the Bargain collapses into standard decision theory under uncertainty.

  ### 2. Indistinguishable Leaves (Flagged)
  **Leaf 9 (Measure Nihilist)** and **Leaf 10 (Indexical Agnostic)** are notoriously difficult to separate in practice.
  *   **The Difference:** Leaf 9 says "There is no number." Leaf 10 says "There is a number, but I can't see it."
  *   **Why they blur:** Both result in the same behavior: refusing to update beliefs based on BB counts. In a reading group, a participant claiming one will often sound like they are claiming the other when pressed on *why* they can't use the number.

  ### 3. Unheld / Incoherent Combinations
  **Leaf 7 (The Deluded Optimist)** is flagged as an unheld position.
  *   **Why:** It permits the combination: "I am likely a BB" + "I will not dissolve soon" + "I should make plans."
  *   **Incoherence:** If the world is a fluctuation, the probability of it persisting is the core risk. Denying the dissolution risk (Q6=B) while accepting the BB status (Q5=B) usually leads to the Bargain (Q7=B). Making plans (Q7=A) while expecting persistence (Q6=B) but admitting BB status is a form of denial nobody explicitly defends; they usually slide into Evidentialism (Leaf 3) instead.

  ### 4. Guiding the "No Measure" Retreat
  If a participant tries to retreat to "There is no fact about typicality" (Leaf 9) to avoid the BB conclusion:
  *   **Challenge:** Ask them if they would bet on being the single Ordinary Observer in a room with a billion Boltzmann Brains.
  *   **Trap:** If they bet on the Ordinary Observer, they are secretly using a measure (Leaf 3 or 5). If they refuse to bet, they are truly at Leaf 9, but must accept they can never use anthropic reasoning for *anything* (e.g., fine-tuning arguments).
