      *   **Classification Goals:** Distinguish between Continuous Tradition, Revived Practice, Deliberate Modern Invention, Retroactive Misattribution.
      *   **Human-in-the-Loop:** Explicitly mark judgment calls (especially regarding symbolic rupture) where a person must decide, not an algorithm.
