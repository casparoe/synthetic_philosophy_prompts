  ### 5. Strategy for the Discussion Section (How to Get Sign-Off)
  You cannot force Halvorsen to call the canal fish a "species" without risking her blocking the chapter. However, you can frame the discussion so that her taxonomy *still allows for protection*.

  **Do not** title the section "Description of a New Species."
  **Do** title it "Evolutionary Trajectories and Conservation Units."

  **The Pitch:**
  1.  **Concede the Taxonomy:** Explicitly state that under a strict cohesion species concept (which she favors), the Lake and River forms represent the distinct evolutionary lineages (Species A and B). Acknowledge the canal population as a "hybrid zone with strong ecological selection." *This gets her nod.*
  2.  **Pivot to Process:** Argue that the canal population represents **Speciation in Action**. Cite her own precedent (Case 4: Hybrid Sexual Species). Argue that the *inversion* acts as a "speciation supergene" maintaining the distinctness of the canal form despite gene flow.
  3.  **The Conservation Argument:** This is the critical move. Argue that excluding the canal population from protection because it is a "hybrid swarm" contradicts the **Evolutionary Significant Unit (ESU)** policy.
      *   *Write this:* "While the canal population may not meet the threshold for full species status due to the brevity of isolation (50 generations), it constitutes a distinct ESU defined by the fixed inversion polymorphism and unique ecological niche. Protecting this zone is not about protecting 'hybrids,' but about protecting the **evolutionary process** that generated the Lake and River species diversity."
  4.  **Leverage the Inversion:** Emphasize that the inversion is 1 million years old. The canal fish are not just random mixes; they are maintaining ancient genomic architecture that is lost in the pure parental forms. Destroying the canal destroys unique genomic combinations of the *parental species*.

  **Why this works:**
  *   It respects her taxonomy (Lake/River = Species).
  *   It respects her philosophy (Lineage/Process matters more than names).
  *   It bypasses the legal "No Hybrids" clause by arguing the fish are an **ESU** or **Distinct Population Segment**, which often carries the same legal weight as a species under endangered acts (depending on your jurisdiction, e.g., US ESA DPS policy).
  *   It prevents her from marking up your draft with "Species concept not supported" comments, because you aren't claiming it in the taxonomy section.

  **Summary:** Send her a chapter that identifies **Two Species** and a **Hybrid Zone**. In the discussion, argue that the Hybrid Zone is an **Evolutionary Significant Unit** worthy of protection. This aligns with her "Pluralist" view (different concepts for different purposes) and saves the fish without forcing her to violate her own precedents.
