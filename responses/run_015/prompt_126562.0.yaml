prompt: |-
  I'v been reading one of those popular books on the evolutionary origins of religion — you know the kind, chapter three is called something like "Why Your Brain Believes" — and I want to know how much of it I should actually trust before I repeat any of it to people. Here's roughly how the chapter wraps up:

  "Religion is a parasite of the mind, not a discovery. Human minds come factory-fitted with a hypersensitive agent detector: we are so eager to see an agent behind a rustle in the grass that we end up filling the world with invisible persons. Add our talent for imagining what other minds are thinking and you get gods, ancestors, spirits — ideas nobody designed and nobody really needs. Once such ideas are loose, cultural evolution takes over. Concepts compete in a marketplace the way genes do, and what wins is what is memorable: the more counterintuitive a concept is, the stickier it is, which is why a god who is a bush that talks beats a god who is simply a very large man, and a god born of a virgin beats both. Finally, groups that happened to believe in morally concerned, all-seeing gods cooperated better than groups that didn't, so those groups grew, out-competed the others, and took their gods with them. Put that together and the question of whether God exists has been settled by the back door: we now know where the belief comes from, and a belief whose causes have been fully explained has nothing left to recommend it."

  I'm suspicious of that last sentence — it feels like a trick — but the rest of it sounds convincing to me, and I can't tell which bits are the real science and which bits are the author getting carried away. I also mentioned the chapter to a friend who does anthropology, and he said the field has mostly moved past the "sticky ideas" framing: what actually does the work, he claimed, is that successful religious concepts are *under-specified* — vague enough that everyone can quietly fill in their own version while still feeling they share a belief, which is why they survive disagreements that would kill a scientific hypothesis. He called this "semantic slack" and said it predicts that the more precisely a group defines a doctrine, the faster it schisms. That sounds plausible to me, but also like something he might have invented on the spot over a beer.

  Can you go through the chapter summary and tell me what a careful person working on the cognition-and-religion stuff would accept, what they'd wince at or call a simplification, and what's just wrong? I especially want to know whether the jump from "here's why the belief is widespread" to "so there's nothing left to recommend it" does any real work or just rides on the rest. And wherever you land on my friend's "semantic slack" idea — real thing, half-remembered version of something, or made up — tell me whether it actually fits with the counterintuitiveness bit in the chapter or quietly contradicts it.

  Two things about how I'd like the reply. First, be honest about your confidence: tell me how sure you are of what you're saying overall, and single out the one point you're least sure of, rather than sounding equally certain about everything. Second, please write it as continuous prose — an email or a letter, no headings, bullet points, bold text or tables — because I want to read it straight through rather than skim it.
