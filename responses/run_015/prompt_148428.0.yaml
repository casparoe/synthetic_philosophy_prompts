answer: |-
  There is a single principle that can govern these judgments, but it requires you to overturn **Judgment Four**.

  Your intuitions generally track a sophisticated archaeological heuristic: **The Principle of Functional Dissonance.** This principle states that you should infer *belief or institution* only when material patterns actively contradict, constrain, or exceed immediate functional, economic, or demographic expectations. Conversely, when material patterns align with functional efficiency or exchange logic, they should be read as *practical adaptations*, even if they look dramatic.

  Here is how your five judgments map onto this principle, why the fourth breaks the coherence, and what the corrected principle predicts for your solstice case.

  ### 1. Testing the Coherence
  Under the **Principle of Functional Dissonance**, belief is signaled by "costly" behavior—actions that expend energy or resources without a direct subsistence return, or that mask expected social realities.

  *   **Judgment 1 (Grave Goods):** *Coherent.* In a hierarchical society (proven by housing), equal grave goods are *dysfunctional* for status display. Elites are suppressing their economic advantage. This dissonance signals an **egalitarian cosmology** (Belief) overriding social reality.
  *   **Judgment 2 (Highland Site):** *Coherent.* A settlement without domestic debris is *dysfunctional* for habitation. The "cost" of traveling to a remote site to break vessels without living there signals a **pilgrimage institution** (Institution) rather than daily life.
  *   **Judgment 3 (Elite Burial):** *Coherent.* Foreign goods usually signal foreign contact. Arranging them by *local* conventions is an active, cognitive effort to neutralize their foreignness. This dissonance signals **strategic appropriation** (Institution/Power) rather than passive assimilation.
  *   **Judgment 5 (Pottery):** *Coherent.* Pottery styles changing while people and settlements remain continuous is *functional*. New styles often mean better technology or new trade routes. Inferring a "revolution" here would be assuming dissonance where there is none. This is **practical adaptation**.

  ### 2. The Outlier: Judgment Four
  **The Judgment:** *Standardized weights + No script $\rightarrow$ Centralized Bureaucracy.*
  **The Problem:** This violates the Principle of Functional Dissonance and contradicts current archaeological consensus.

  Standardized weights facilitate trade; they reduce transaction costs. Their existence is *functional* for a market economy. Inferring a "Centralized Bureaucracy" requires assuming a coercive apparatus that imposes uniformity. However, bureaucracies are information-processing machines; without script (record-keeping), a centralized state cannot effectively monitor weights across dispersed settlements.

  In archaeological theory (e.g., Renfrew's peer-polity interaction), standardized weights without script are the classic signature of **emergent market coordination** (Practical), not top-down control. By reading this as Bureaucracy, you are inferring *Institution* where the evidence suggests *Practical Network*. This creates an inconsistency with Judgment Five: in #5, you rightly resist inferring social revolution from material change; in #4, you infer social control (bureaucracy) from material uniformity without administrative proof.

  **The Correction:** Overturn Judgment Four. Read standardized weights without script as **Emergent Market Coordination (Practical)**. This aligns it with Judgment Five (material change = practical adaptation) and sharpens the distinction for the other three (material contradiction = belief/institution).

  ### 3. The Unified Principle
  **The Principle of Functional Dissonance:**
  > *Read a material pattern as **Belief or Institution** only when it incurs a cost, constraint, or symbolic contradiction that cannot be explained by subsistence, technology, or exchange efficiency. Read it as **Practical** when it optimizes function, trade, or adaptation, even if the material change is abrupt.*

  ### 4. Prediction for the Solstice Case
  **The Case:** A settlement where architectural orientation suddenly aligns with solstitial sunrise, yet every other material category (burial, craft, diet) remains unchanged.

  **Applying the Corrected Principle:**
  1.  **Is it Functional?** Architectural alignment with solstices has minimal subsistence utility (unlike, say, orienting for wind protection or drainage). It requires precise surveying and planning, representing a "cost" in labor and coordination. This suggests **Belief/Cosmology**.
  2.  **Is it Institutional?** Here is the key. In Judgment 1 (Graves), belief *masked* social hierarchy. In Judgment 3 (Burial), belief *reinforced* authority. In this Solstice case, you specify that **burial, craft, and diet remain unchanged**. This means the social hierarchy and economic structure have *not* been reorganized to match the new architecture.

  **The Prediction:**
  This pattern predicts a **Cosmological Shift without Political Revolution.**

  For your narrative, this suggests a society where a new religious idea has taken hold—perhaps a new priestly class or a solar cult—but it has not yet seized the levers of economic or social power. The "institution" is present in the *mindset* and the *public ritual space*, but it is "hollow" regarding daily life.

  *   **Narrative Implication:** This is a volatile state. You have a society paying the "cost" of building aligned temples (suggesting strong belief) but refusing to change how they eat, trade, or bury their dead (suggesting resistance to structural change). This creates tension between a **ritual elite** (who control the calendar/temples) and a **social elite** (who control the houses/graves). It is a society in a state of *ideological transition*, where the architecture is ahead of the institutions.

  **Summary for your Notes:**
  *   **Principle:** Functional Dissonance (Belief = Cost/Contradiction; Practical = Efficiency).
  *   **Correction:** Judgment 4 is Market (Practical), not Bureaucracy (Institution).
  *   **Solstice Verdict:** Ritual/Cosmological change *preceding* institutional power. A "Theocracy of the Sky" that hasn't yet conquered the Earth.
