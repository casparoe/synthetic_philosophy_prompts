  ### The Principle: The Epistemic-Existential Standard

  To resolve the tension between Case 3 (exclusion of political groups) and Case 4 (inclusion of masked intent), we must decouple the definition of the *victim group* from the definition of *intent*. Your intuition in Case 3 relies on the **nature of the group** (stable identity vs. mutable affiliation), while your intuition in Case 4 relies on the **epistemic state of the perpetrator** (knowledge of consequence vs. explicit order).

  A coherent principle that accommodates your six verdicts is the **Epistemic-Existential Standard**:

  > **An atrocity constitutes genocide when an actor, possessing substantial knowledge that their actions will destroy the physical or biological continuity of a stable, identity-based group (national, ethnical, racial, or religious), proceeds with those actions regardless of stated bureaucratic, economic, or political justifications.**

  This principle rests on two pillars:
  1.  **Protected Identity:** The victim group must be defined by inherent or stable characteristics (saving Case 3's exclusion of political opponents).
  2.  **Epistemic Intent:** *Dolus specialis* (specific intent) is satisfied not only by explicit desire to destroy but by the **knowledge of inevitability** combined with the **decision to proceed** (saving Case 4's moral intuition against legal technicality).

  ### Application to Case 7
  **Case:** State-sponsored climate-engineering destroying nomadic habitat; memos show awareness; framed as carbon mitigation.

  **Analysis:**
  *   **Group:** A nomadic people constitute a stable, identity-based group (national/ethnical).
  *   **Existential Threat:** Destroying the habitat eliminates the conditions for their physical and cultural survival.
  *   **Epistemic Intent:** Internal memos confirm "full awareness." The framing as "carbon mitigation" is a bureaucratic justification irrelevant to the knowledge of the consequence.

  **Verdict on Case 7:** Under the Epistemic-Existential Standard, this **is genocide**. The state knowingly rendered the group's continuity impossible, prioritizing the project over the group's existence.

  ### Saves and Sacrifices
  This principle **saves all six of your original verdicts**, resolving the tension by clarifying *why* Case 3 and Case 4 differ without contradiction:
  *   **Saves Case 1, 2, 5, 6:** Clearly fit both identity and knowledge criteria.
  *   **Saves Case 3:** Excluded because political opponents do not meet the "stable, identity-based group" criterion, regardless of the scale of killing.
  *   **Saves Case 4:** Included because "resource optimization" does not negate the knowledge of tribal elimination.

  However, this principle **sacrifices conventional legal positivism**. It rejects the strict requirement for an explicit "order to destroy" found in some judicial interpretations of the UN Genocide Convention (which might acquit Case 4 and Case 7). It prioritizes the *moral reality of destruction* over the *procedural difficulty of proving purpose*.

  ### Conclusion

  Verdict: A unified principle exists; its core claim is that genocide is defined by the knowing destruction of the conditions necessary for the continued existence of a protected identity group, regardless of explicit rhetorical intent or bureaucratic framing.
