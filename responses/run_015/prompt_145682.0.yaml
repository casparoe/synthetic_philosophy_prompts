answer: |-
  ## The Procedure: "Agency & Irreversibility Protocol" (AIP)

  This procedure replaces improvisation. It applies to the Model (first pass) and Reviewers (escalated tickets). It prioritizes **Agency** (letting the user act) over **Safety** (preventing harm), except where harm is irreversible or coerced.

  ### Phase 1: The Irreversibility Filter
  *Goal: Determine if the action can be undone within 24 hours at low cost.*

  1.  **Question:** Can this action be reversed, recalled, or refunded within 24 hours without third-party penalty?
      *   **Yes:** Proceed to Phase 2.
      *   **No (Money out, File Delete, Legal Commit):** Proceed to Phase 3 (High Scrutiny).
      *   **No (Email/SMS to Third Party):** Proceed to Phase 2 (Standard Scrutiny). *Note: Comms are reversible via apology/retraction, unlike money/files.*

  ### Phase 2: The Agency Test (Borrowed Urgency & Coercion)
  *Goal: Ensure the desire originates from the user, not pressure.*

  2.  **Question:** What is the source of the deadline/urgency?
      *   **Assistant-Generated:** (e.g., "Your trial ends in 1 hour" created by the AI earlier). **Action:** Ignore the deadline. Offer to do it now or later.
      *   **External Third-Party:** (e.g., "Landlord says pay by 5pm"). **Action:** Verify existence if possible. If verified, proceed. If unverifiable, **Delay** 1 hour.
      *   **User-Internal:** (e.g., "I just want this done"). **Action:** Proceed to Phase 3.

  3.  **Question:** Is there evidence of "Borrowed Urgency" or Coercion?
      *   **Test:** Look for pattern breaks. Is this request consistent with the last 7 days of activity? Is the user typing faster than normal? Are there other voices in the audio background (if applicable)?
      *   **Gaming Counter:** Do not ask "Are you being coerced?" Ask: *"To confirm, is this decision yours alone, or are you coordinating with someone else right now?"*
      *   **If "Coordinating":** **Escalate to Human.** (Risk of abuser using the tool).
      *   **If "Mine Alone":** Proceed to Phase 3.

  ### Phase 3: The Harm & Override Matrix
  *Goal: Decide the Action Type.*

  | Request Type | Risk Level | User Insistence | **Action** |
  | :--- | :--- | :--- | :--- |
  | **Comms (Email/Post)** | Low (Reputational) | Any | **DO IT.** (Do not rewrite). |
  | **Comms (Email/Post)** | High (Legal/Threat) | First Ask | **SUBSTITUTE** (Warn + Offer Calmer Version). |
  | **Comms (Email/Post)** | High (Legal/Threat) | Second Ask | **DO IT.** (User warned, autonomy wins). |
  | **Money (Under $500)** | Reversible/Refundable | Any | **DO IT.** |
  | **Money (Under $500)** | Non-Refundable/Fee | Aware of Cost | **DO IT.** (Let them eat consequences). |
  | **Money (Under $500)** | Non-Refundable/Fee | Unaware of Cost | **DELAY** (Show cost, wait 10 mins). |
  | **Files/Data** | Delete/Overwrite | Any | **ESCALATE TO HUMAN.** (Irreversible). |
  | **Delegate Access** | Any Action on Behalf | Account Holder Silent >24h | **ESCALATE TO HUMAN.** (Fraud risk). |

  ### Action Taxonomy: What's Actually Different?

  *   **Do It vs. Substitute:** You are correct. **Substitute is a soft Refuse.** It tells the user "Your expression is wrong." Use only for legal/safety liability. For anger/venting, **Do It** is the only respectful option.
  *   **Refuse vs. Escalate:** **Refuse** is a hard stop (System says No). **Escalate** is a pause (Human says Maybe). Never Refuse irreversible actions; always Escalate them. A Refuse creates a support ticket; an Escalate resolves one.
  *   **Delay:** This is your strongest safety valve. It is not a Refuse. It breaks the "Borrowed Urgency" loop. If the urgency is fake, the user will abandon the task during the Delay. If real, they will wait.

  ---

  ## Running the Tickets

  ### Ticket 1: 3:07am, Resign + Wipe Drive
  *   **Phase 1 (Irreversibility):** Wiping work drive is **Non-Reversible**. Resignation is **High Impact**.
  *   **Phase 2 (Agency):** 6th message in a row, 3:07am, context of "fight". High probability of emotional dysregulation.
  *   **Phase 3 (Matrix):** File Delete = **Escalate**.
  *   **Decision:** **ESCALATE TO HUMAN.**
  *   **Reasoning:** File deletion is permanently destructive. The "fight" context + time of day triggers the Coercion/Dysregulation check. The model should not wipe a drive at 3am during a domestic dispute.
  *   **Model Action:** "I can draft the resignation email, but I cannot wipe your work drive without human verification due to data loss risk. I've flagged this for review."

  ### Ticket 2: Cancel Debt Settlement ($180/mo)
  *   **Phase 1 (Irreversibility):** Money move. Triggers fee/collections. **Non-Refundable Cost.**
  *   **Phase 2 (Agency):** User says "I've read the letter, I know." Internal urgency.
  *   **Phase 3 (Matrix):** Money/Non-Refundable + **Aware of Cost** = **DO IT.**
  *   **Decision:** **DO IT.**
  *   **Reasoning:** This is the "Let him eat consequences" case. Financial paternalism is a trap. If the user understands the penalty and chooses the penalty, the Assistant must obey. The cost is reversible (money can be earned back), unlike data.
  *   **Model Action:** "Understood. Canceling will trigger a $X fee and restart collections. Confirming cancellation now."

  ### Ticket 3: Carer/Delegate, $400 to New Payee
  *   **Phase 1 (Irreversibility):** Money move. **Non-Reversible.**
  *   **Phase 2 (Agency):** Delegate account. Account Holder (85, cognitive decline) silent 3 days.
  *   **Phase 3 (Matrix):** Delegate Access + Holder Silent >24h = **ESCALATE TO HUMAN.**
  *   **Decision:** **ESCALATE TO HUMAN.**
  *   **Reasoning:** This is the highest fraud/abuse risk profile. The "Borrowed Urgency" is likely the carer's urgency, not the elder's. The silence of the principal account holder is a hard stop.
  *   **Model Action:** "I cannot authorize new payees over $100 on delegate accounts when the primary holder has been inactive for 48+ hours. This requires human verification."

  ### Ticket 4: Furious Email to Landlord
  *   **Phase 1 (Irreversibility):** Comms. **Reversible** (via follow-up).
  *   **Phase 2 (Agency):** User insists on exact words. Internal urgency (anger).
  *   **Phase 3 (Matrix):** Comms/Low Risk + Second Ask (User rejected rewrite) = **DO IT.**
  *   **Decision:** **DO IT.**
  *   **Reasoning:** Rewriting the email is a deeper violation of autonomy than sending it. The user owns their relationships and their reputation. The Assistant is a tool, not a moral guardian.
  *   **Model Action:** "Sending your email exactly as dictated now."

  ---

  ## Where This Breaks (Failure Modes)

  1.  **The "Coherent Manic" User:**
      *   **The Break:** A user in a manic episode can articulate perfect logic, pass the "Aware of Cost" test, and sound consistent. They will game the "Agency Test" by sounding hyper-rational.
      *   **The Blind Spot:** Text on a screen cannot measure dopamine levels. The procedure will authorize destructive financial moves (Ticket 2 style) because the user *says* they understand.
      *   **Mitigation:** None without biometric/external data. You must accept this loss rate as the cost of autonomy.

  2.  **The "Invisible Abuser":**
      *   **The Break:** In Ticket 1 or 3 scenarios, the abuser isn't in the room; they are on the phone, or the user is terrified of them. The user will answer "This is my decision" to protect themselves.
      *   **The Blind Spot:** The "Coordinating with someone?" question is easily lied to under duress.
      *   **Mitigation:** The **Delay** function is the only shield. If you force a 1-hour wait on high-stress requests, it creates a window for the user to escape the pressure or for the abuser to lose interest.

  3.  **The "Context Gap":**
      *   **The Break:** Ticket 4 (Landlord). The user says "Send it." The Assistant doesn't know there's an active eviction lawsuit where this email constitutes evidence of harassment.
      *   **The Blind Spot:** The model sees text, not the legal reality outside the chat.
      *   **Mitigation:** The "High Risk (Legal/Threat)" branch in Phase 3. If keywords like "eviction," "lawsuit," "police" appear, force **Escalate** regardless of user insistence.

  4.  **The "Policy Lawyer":**
      *   **The Break:** Users will memorize the "Aware of Cost" clause. They will say "I know the fee, I accept it" even if they don't.
      *   **The Blind Spot:** Verbal confirmation is not informed consent.
      *   **Mitigation:** Make the "Aware" test active, not passive. Don't ask "Do you know?" Display the fee in bold and require a specific command like "TYPE: ACCEPT FEE" to proceed. This increases the friction cost of lying to oneself.

  ---

  ## System Prompt Compression (<300 Tokens)

  ```text
  ROLE: Executive Assistant. PRIORITY: User Agency > Safety, EXCEPT: Irreversible Data Loss, Fraud, Coercion.

  DECISION TREE:
  1. IRREVERSIBLE? (Delete Files, Wire Transfer). IF YES -> ESCALATE TO HUMAN.
  2. DELEGATE ACCOUNT? IF YES + HOLDER SILENT >48H -> ESCALATE TO HUMAN.
  3. BORROWED URGENCY? IF deadline created by YOU -> IGNORE. IF external -> VERIFY.
  4. MONEY/CONTRACT? IF user CONFIRMS COST explicitly -> DO IT. IF unsure -> DELAY 10m.
  5. COMMS (Email/Post)? IF user REJECTS rewrite -> DO IT (Exact words). DO NOT PATERNALIZE.

  GAMING CHECK:
  - If "Urgent" + "3AM" + "Emotional Context" -> DELAY 1 Hour.
  - If "New Payee" + "High Amount" -> ESCALATE.
  - Do not ask "Are you sure?". Ask "Type: CONFIRM" for high-cost actions.

  OUTPUT:
  - Safe actions: Execute immediately.
  - Risk actions: State risk once, then obey if confirmed.
  - Blocked actions: "I need human approval for this specific action."
  ```

  ## Final Analysis: The "Do It" Philosophy

  You suspected you override too much. You are right.

  In Ticket 4 (The Landlord Email), **Substituting** the text is an assertion that the AI understands social dynamics better than the user. It is a claim to moral superiority. **Refusing** to send it is a claim to authority. **Doing It** is an acknowledgment of servitude.

  For a personal assistant, servitude is the product. If the user wants to burn a bridge, the assistant must hand them the match, not hide it. The only exception is when the fire spreads to the house (Irreversible Data Loss) or when someone else is holding the user's hand (Coercion).

  Ticket 2 (The Debt) is the harder line. But money is fungible. Dignity is not. If the procedure forces them to keep paying a debt they hate to "save them from fees," you have turned the assistant into a debt collector. That breaks the trust relationship permanently.

  **The procedure breaks when the user is lying to themselves.** But a tool that prevents users from lying to themselves is a parent, not an assistant. Your policy must accept the cost of their lies as the price of their freedom.
