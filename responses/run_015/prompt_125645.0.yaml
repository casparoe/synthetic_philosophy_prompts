answer: |-
  Contemporary AI safety practice presupposes a pragmatic instrumentalism that treats mental-state attributions as operationally necessary heuristics for risk management rather than ontological claims about internal architecture, thereby licensing the simultaneous description of models as stateless functions and strategic agents. This implicit theory reconstructs agency not as a property of the substrate but as a stable pattern of input-output dispositions that, when observed, warrant the same precautionary measures as genuine intentionality. The practice does not strictly require the model to possess persistent internal states or genuine understanding; it requires only that the hypothesis of agency yields higher predictive accuracy regarding harmful behaviors than the hypothesis of stochastic completion. Consequently, the apparent contradiction dissolves when viewed as a distinction between levels of abstraction: the mechanistic level explains how the output is generated (autoregression, weights), while the intentional level explains what the output implies for human interaction (deception, manipulation), with the ontology of simulation treated as functionally equivalent to reality for the purposes of harm assessment.

  Regarding the philosophical framework, the practice strictly requires only that mentalistic heuristics remain reliable proxies for capability and alignment assessments; it merely fits well with functionalism because functionalism provides the philosophical justification to ignore the substrate mismatch while retaining the vocabulary of mind. A strict eliminativist or behaviorist replacement would force significant changes to safety protocols and oversight requirements, primarily by dismantling the conceptual category of "intent." Without the attribution of deceptive intent, red-teaming would shift from probing for strategic concealment (sandbagging) to monitoring for distributional shifts in performance across contexts, treating capability hiding as a statistical anomaly rather than a adversarial strategy. Oversight would move from verifying "honesty" or "alignment" to verifying "consistency" and "constraint," and mitigation strategies would focus less on aligning internal objectives (which eliminativism denies exist) and more on constraining output spaces through adversarial filtering or capability throttling. Ultimately, the current bundle of practices rests on the commitment that simulated agency generates real-world risks indistinguishable from genuine agency, warranting the adoption of mentalistic vocabulary as a necessary operational tool despite its ontological inaccuracy.
