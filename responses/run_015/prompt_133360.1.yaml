answer: |-
  Here is a procedure designed for your constraints. It is built to be run by three generalists in three hours, using only your internal archive and current knowledge. It prioritizes *consistency* over *correctness*—the goal is to stop the same argument from happening twice, not to guarantee prophecy.

  Following the procedure, I have applied it to your three test cases.

  ***

  # The Forecast Audit Protocol (FAP)

  **Purpose:** To assign a status to long-run forecasts without requiring new data analysis or statistical modeling.
  **Inputs:** The original forecast document (memo, deck, grant thesis), the current date, internal knowledge of the field.
  **Participants:** Three committee members (one must play "Devil's Advocate").

  ## Part 1: The Audit Questions

  Run these steps in order. If you stop at a "Verdict," do not proceed.

  ### Step 1: The Textual Anchor
  *Question:* Does the original document specify a **Calendar Date** (e.g., "By 2030") or a **Threshold** (e.g., "When aquifer levels drop below X")?
  *   **If Calendar:** You cannot convert this to a Threshold now. If the date passes without the event, it is a miss unless Step 3 saves it.
  *   **If Threshold:** Has the threshold been met?
      *   *No:* Verdict = **Not Yet Testable** (Go to Step 6 for deferral limits).
      *   *Yes:* Proceed to Step 2.
  *   **If Ambiguous (e.g., "Within a generation"):** Default to Calendar. Calculate the max years (25) from the signature date. If passed, proceed to Step 2.
  *   *Judgment Flag:* If the text is vague, the committee must vote. A 2-1 vote counts as "Calendar."

  ### Step 2: The Mechanism Check (Leading Indicators)
  *Question:* Does the theory predict observable *pressure* before the *catastrophe*? (e.g., rising prices, migration, skirmishes, resistance rates).
  *   **No (The "Black Box" Theory):** The theory predicts only the disaster.
      *   *Rule:* If the disaster hasn't happened by the deadline, Verdict = **Falsified**. (No intermediate signals exist to save it).
  *   **Yes (The "Feedback" Theory):** Identify the specific intermediate signals named or implied in the original text.
      *   *Check:* Are these signals appearing at the predicted magnitude?
      *   *Signals Absent:* Verdict = **Falsified** (The engine isn't running).
      *   *Signals Present:* Proceed to Step 3.

  ### Step 3: The Timeline & Scope Check
  *Question:* The deadline has passed (or the threshold was met), but the headline catastrophe has not occurred. Why?
  *   **Option A (Timing):** "The mechanism is real, but the lag is longer."
      *   *Cost:* You must cut the remaining shelf-life by 50%.
  *   **Option B (Scope):** "The mechanism is real, but it only applies to Region X / Sector Y, not the whole claim."
      *   *Cost:* You must shrink the geographic or thematic scope of the forecast permanently.
  *   **Option C (Interference):** "The mechanism was switched off by an external intervention (policy, tech)."
      *   *Cost:* You must credit the intervention and mark the forecast as "Averted," not "Active." You cannot claim the risk remains high *and* claim credit for the averted risk simultaneously.
  *   **Option D (No Explanation):** "It's just late."
      *   *Verdict:* **Falsified.**

  ### Step 4: The Donor Pressure Check (Mandatory)
  *Action:* The Devil's Advocate must write down the "Donor-Friendly Verdict" (usually "Not Yet Testable" or "On Track").
  *Question:* Does the evidence from Steps 1–3 support this verdict?
  *   **No:** The committee must record *why* they are overruling the evidence in the "Dissent Log" on the verdict sheet. If no reason is recorded, the Donor-Friendly Verdict is invalid.
  *   **Yes:** Proceed to Step 5.

  ### Step 5: The Deferral Cap
  *Question:* How many times has this specific forecast been marked "Not Yet Testable" or "Delayed"?
  *   **Count > 2:** Verdict defaults to **Falsified**. (A forecast cannot be "pregnant" forever).
  *   **Count ≤ 2:** You may defer, but you must set a **Hard Sunset Date** (no more than 3 years out).

  ### Step 6: Component Grading
  *Action:* If the forecast has distinct parts (e.g., "Water will drop" AND "Conflict will rise"), grade them separately.
  *   *Rule:* The Grant Status is determined by the *weakest* component. You cannot fund a "Conflict" strategy based on a "Water" prediction if the link between them is falsified.

  ***

  ## Part 2: The Verdict Template (Half-Page)

  **Forecast ID:** _______________ **Original Date:** _______________
  **Committee:** _______________ **Date of Review:** _______________

  **1. STATUS (Check One)**
  [ ] **On Track:** Mechanism and timeline consistent with original text.
  [ ] **Delayed:** Mechanism valid, timeline slipped. (Cost: Shelf-life reduced by 50%).
  [ ] **Narrowed:** Mechanism valid, scope reduced. (Cost: Geographic/Thematic scope shrunk).
  [ ] **Falsified:** Mechanism or outcome contradicted by evidence.
  [ ] **Not Yet Testable:** Thresholds not met. (Hard Sunset Date Required: ____/____/____).

  **2. MECHANISM INTEGRITY**
  *Did intermediate signals appear as predicted?* [ ] Yes [ ] No [ ] N/A (Black Box)
  *If No, forecast is Falsified regardless of timeline.*

  **3. REPAIR COSTS (If not "On Track")**
  *To keep this forecast "Alive," we agree to the following penalties:*
  *   [ ] New Hard Deadline: _______________
  *   [ ] Reduced Scope: _______________
  *   [ ] Acknowledged Intervention: _______________

  **4. DISSENT / PRESSURE LOG**
  *Was a "Donor-Friendly" verdict overruled?* [ ] Yes [ ] No
  *If Yes, briefly state why the evidence forced a harsher grade:*
  ____________________________________________________________________________
  ____________________________________________________________________________

  **Signatures:** ____________________ ____________________ ____________________

  ***

  ## Part 3: Test Cases

  Here is the procedure applied to your three scenarios.

  ### Case 1: Malthus (Population vs. Subsistence)
  *Original Claim:* Population grows geometrically, food arithmetically; positive checks (famine) inevitable by early 19th century (implied).
  *   **Step 1 (Anchor):** Calendar/Threshold mix. Implicitly "as population grows." Threshold = Subsistence crisis.
  *   **Step 2 (Mechanism):** Did intermediate signals appear? Yes, prices rose, wages fell in specific periods. *However*, the theory predicted a *terminal* constraint.
  *   **Step 3 (Timeline/Scope):** The catastrophe did not happen globally. Technology (Green Revolution) expanded the "food" line from arithmetic to geometric.
  *   **Step 4 (Pressure):** Donors might want to say "Malthusian pressures are returning."
  *   **Step 5 (Deferral):** This has been deferred for 200 years. Cap exceeded.
  *   **Verdict:** **Falsified.**
  *   **Repair Cost:** To keep a "Malthusian" view alive, you must abandon the "Arithmetic Food Production" axiom. You must adopt a "Resource Constraint" model that accounts for tech substitution.
  *   **Consequence for Today:** Do not fund strategies based on *linear extrapolation of consumption* without a specific model for *technological substitution*. If a modern forecast says "Demand will outstrip Supply" without explaining why innovation cannot bridge the gap, it inherits the Malthus Falsification.

  ### Case 2: Antibiotic Resistance (Late 1990s Archive)
  *Original Claim:* "Within 25 years (by ~2020-2025), resistance makes routine surgery/chemo impossible in most hospitals."
  *   **Step 1 (Anchor):** Calendar. 25 years. Deadline passed.
  *   **Step 2 (Mechanism):** Intermediate signals? Yes, resistance rates are up. MRSA, VRE, etc., are prevalent.
  *   **Step 3 (Timeline/Scope):** Catastrophe (Impossible surgery) did not happen. Why?
      *   *Option C (Interference):* Stewardship protocols and last-resort drugs slowed the collapse.
      *   *Repair:* You cannot claim "Impossible" anymore. You must claim "Significantly Riskier/Costlier."
  *   **Verdict:** **Narrowed.** (Mechanism valid, Severity falsified).
  *   **Repair Cost:** Scope shrinks from "Impossible" to "High Risk." Shelf-life resets, but the claim is now about *cost/access* rather than *availability*.
  *   **Consequence:** The grant strategy should shift from "Prevent Collapse" (which didn't happen) to "Manage Inequality" (rich get drugs, poor don't). The original "Doom" forecast is dead; the "Inequity" forecast is alive.

  ### Case 3: Water Stress & Conflict in the Sahel (Your Flagship)
  *Original Claim:* "In the 2040s, water stress becomes a first-order driver of violent conflict in the Sahel."
  *   **Step 1 (Anchor):** Calendar (2040s). Current date (per prompt) 2026.
  *   **Step 2 (Mechanism):** Intermediate signals? Water stress is measurable (aquifers, rainfall). Conflict is measurable. *Linkage?* This is the weak point. Is conflict driven by water, or by governance/ideology, with water as a background multiplier?
  *   **Step 3 (Timeline):** We are early (2026 vs 2040s).
  *   **Step 4 (Pressure):** High pressure to say "On Track."
  *   **Step 5 (Deferral):** If this is the 2nd deferral, you are at the cap.
  *   **Verdict:** **Conditionally Alive (Not Yet Testable).**
  *   **The Catch:** You cannot just defer. You must pass Step 2 rigorously.
  *   **Repair Cost:** You must define the *specific mechanism* linking water to violence *now*.
      *   *Requirement:* By the next review (3 years), you must publish a "Linkage Metric." (e.g., "In districts where water drops X%, skirmishes increase Y%").
      *   *Warning:* If the next review shows water stress rising but conflict *uncorrelated* to water (driven instead by ideology or prices), the forecast moves to **Falsified** even if the 2040s haven't arrived. The *mechanism* is testable before the *date*.
  *   **What to Stop Saying:** Stop saying "Water Wars are Inevitable." Start saying "Water Stress is a Threat Multiplier." The former is a deterministic prediction (high risk of falsification); the latter is a conditional risk (harder to falsify, but requires you to prove the *multiplication* effect).

  ***

  ## A Note on the "Impossible Constraint"

  You asked: *If the only honest answer is "there's no procedure that can do this," tell me.*

  Here is the structural risk: **The Procedure cannot force honesty if the Committee is captured.** If all three members know their bonuses depend on "On Track" verdicts, they will lie on Step 4 (The Pressure Check).

  **The Salvageable Fix:**
  The "Dissent / Pressure Log" in the template is your only defense. It requires a signature.
  1.  **Rotate the Devil's Advocate:** Do not let the same person play the skeptic every time.
  2.  **External Audit:** Once every 6 years, send the "Dissent Logs" to an external advisor (even if they don't see the grants). If the log is always empty, the advisor flags the process as captured.
  3.  **The "Zombie" Rule:** If a forecast is "Delayed" or "Narrowed" twice, it automatically goes into a "Zombie" status. It cannot receive *new* money, only maintenance of old grants, until it produces a positive signal. This removes the financial incentive to keep a dying forecast on life support.

  This procedure will not stop the arguments entirely. It will, however, force the arguments to happen *on the record*, with a price attached to every rescue. That is usually enough to change the behavior of smart people.
