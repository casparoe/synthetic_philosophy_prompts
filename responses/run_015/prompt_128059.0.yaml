answer: |-
  ### Part 1: Critical Feedback on Your Taxonomy
  **Verdict:** Your three-bucket taxonomy is **pedagogically sound but philosophically porous.** It is not "made up" in a negative sense; it maps onto standard historiographical debates (Contextualism vs. Presentism, Structure vs. Agency). However, you are smuggling a normative claim into **Bucket 2 (Structural Lock-in).**

  *   **The Risk:** "Structural Lock-in" implies that if a system compels behavior, moral responsibility vanishes. Historians and philosophers dispute this. (e.g., Did the structure of the South *force* Jefferson to hold slaves, or did it merely make it *costly* to free them?)
  *   **The Fix:** Do not present these as ontological truths about the past. Present them as **categories of argumentation.** Tell the students: *"Historians use these three buckets to categorize the *type* of defense being offered, not necessarily to validate the defense."*
  *   **The Leak:** Epistemic Blindness often collapses into Personal Failure upon closer inspection (e.g., "He couldn't know slavery was wrong" vs. "He chose not to listen to the Black people telling him it was wrong"). Be ready to let students poke holes in the buckets.

  ### Part 2: The Teaching Plan (75 Minutes)

  **Goal:** Students will distinguish between explaining historical action and exonerating it, and will categorize specific defenses into your three buckets to test their limits.

  #### Phase 1: The Prerequisite Distinction (15 mins)
  **Concept:** Explanation $\neq$ Exoneration.
  **Why first?** The buckets make no sense if students think identifying a cause equals absolving guilt.

  *   **Activity: The Speeding Driver.**
      *   *Prompt:* "A driver runs a red light and hits a pedestrian. Three witnesses give statements:"
          1.  "The sun was in his eyes; he physically couldn't see the light." (Epistemic/Physical limit)
          2.  "The brakes failed; the car system locked him in." (Structural limit)
          3.  "He was texting; he chose the phone over the road." (Personal failure)
      *   *Discussion:* "Which of these *explains* the crash? (All three). Which of these *excuses* the driver legally or morally? (Maybe 1 and 2, definitely not 3)."
  *   **Intervention Point (Misconception 1):** If a student says, "If the brakes failed, it's not his fault," push back: "Did he maintain the car? Did he buy a cheap car he knew was unsafe?"
      *   *Takeaway:* Context explains *why* it happened. It does not automatically determine *if* it was permissible.

  #### Phase 2: Introducing the Taxonomy (10 mins)
  **Concept:** The Three Buckets as Analytical Tools.
  **Board Work:** Draw three columns.

  1.  **Epistemic Blindness:** "He lacked the knowledge or conceptual framework to see the harm." (Key question: *Could* he have known?)
  2.  **Structural Lock-in:** "He was trapped by economic, political, or social systems that made deviation impossible or catastrophic." (Key question: *Could* he have acted?)
  3.  **Personal Failure:** "He had the knowledge and the agency but chose self-interest or convenience." (Key question: *Why* didn't he act?)

  *   **Instructor Note:** Explicitly state: *"These are not mutually exclusive. A person can be locked in by structure AND fail personally."*

  #### Phase 3: The Carrying Comparison (35 mins)
  **Anchor:** **Thomas Jefferson.**
  **Why Jefferson?** Columbus is the **wrong anchor.**
  *   *Reason:* The temporal distance (1492) is too vast. Students easily dismiss 15th-century norms as "barbaric," which makes the "Man of His Time" defense too easy to accept or reject without nuance. Jefferson wrote "All men are created equal" while holding humans in bondage. He articulated the moral standard he violated. This forces the tension between **Bucket 1 (Blindness)** and **Bucket 3 (Failure)**.

  **Activity: The Jefferson Sort.**
  Provide students with three short primary source excerpts (or summaries):
  1.  *Notes on the State of Virginia:* Jefferson speculating on biological racial differences.
  2.  *Letter to John Holmes (1820):* Jefferson calling slavery a "moral depravity" and a "wolf by the ear."
  3.  *Financial Records:* Jefferson mortgaging enslaved people to pay debts, refusing to free them despite financial ruin being a risk.

  **Discussion Flow:**
  1.  **Bucket 1 Check:** "Does Excerpt 1 support Epistemic Blindness?"
      *   *Expected Pushback:* He was a scientist of his era, but he ignored counter-evidence.
  2.  **Bucket 2 Check:** "Does Excerpt 2 support Structural Lock-in?"
      *   *Nuance:* He felt trapped by the economy ("wolf by the ear"). But was he *actually* locked in, or was he unwilling to lower his standard of living?
  3.  **Bucket 3 Check:** "Does Excerpt 3 support Personal Failure?"
      *   *Crucial Moment:* He knew it was wrong (Excerpt 2) but prioritized his lifestyle (Excerpt 3).

  **Intervention Point (Misconception 2):** Students will say, "Everyone owned slaves, so he couldn't free them."
  *   *Head Off:* "Did *everyone* own slaves? No. Did some free them? Yes. If others could do it, does 'Structural Lock-in' still hold for Jefferson?"

  **Secondary Comparison: Winston Churchill (10 mins of the 35).**
  Use Churchill only to address the **Emergency Misconception.**
  *   *Prompt:* "Churchill's defenders argue the Bengal Famine was a tragic necessity of WWII logistics (Structural Lock-in/Emergency)."
  *   **Intervention Point (Misconception 3):** "Does War suspend morality?"
      *   *Check:* "If a General bombs a hospital to win a battle, is it 'Structural Lock-in' (War requires victory) or 'Personal Failure' (War has laws)? Use the buckets to sort this."

  #### Phase 4: End-of-Session Check (15 mins)
  **Goal:** Assess grasp of the taxonomy structure, not moral agreement.
  **Format:** "The Historian's Memo."

  **Task:** Give them a new, short case (e.g., **Harry Truman dropping the Atomic Bomb**).
  **Prompt:** "Draft three distinct one-sentence defenses of Truman, one for each bucket. Do not argue which is true. Just demonstrate you can construct the *argument type*."

  *   *Example of Success:*
      *   *Blindness:* "Truman did not fully grasp the long-term radiation effects on civilians."
      *   *Lock-in:* "The military infrastructure and momentum of the war machine made a non-combat demonstration impossible."
      *   *Failure:* "Truman prioritized intimidating the Soviets over minimizing Japanese civilian casualties."
  *   *Example of Failure:* "Truman was right because he ended the war." (This is a verdict, not a bucketed defense).

  ### Part 3: What to Leave Out
  1.  **Moral Luck:** Do not introduce the philosophical debate on whether outcomes determine morality (Nagel/Williams). It creates paralysis in a 75-minute session. Stick to *agency* and *knowledge*.
  2.  **Deep Biography:** Avoid getting bogged down in the specific dates of Jefferson's debts or Churchill's cabinet meetings. Use the *claims* about those facts, not the facts themselves. You are teaching historical reasoning, not history content.
  3.  **Presentism as a Sin:** Don't spend time defining "Presentism" as a technical term. It confuses non-majors. Instead, talk about "Using today's values to judge yesterday."

  ### Part 4: Summary of Misconception Mapping

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Context = Excuse"** | Phase 1 (Speeding Driver) | Force the distinction: "Does knowing *why* he sped make the death okay?" |
  | **"He couldn't know better"** | Phase 3 (Jefferson Bucket 1) | Show evidence of contemporaries who *did* know better (e.g., Quakers, Haitian Revolution). Blindness is often a choice. |
  | **"War/Emergency suspends morality"** | Phase 3 (Churchill) | Ask: "Are there lines even in war?" If yes, then 'Emergency' is not a total shield (Lock-in is partial). |
  | **"The Buckets are Verdicts"** | Phase 4 (Assessment) | Require them to write arguments for *all three* buckets, even if they only believe one. |

  ### Final Instruction to Instructor
  Your taxonomy works **if** you frame it as a tool for **sorting arguments** rather than **sorting souls.** If you present it as "Here is how we decide if Jefferson was good or bad," it will fail. If you present it as "Here is how historians analyze the *structure* of a defense," it will succeed. Be prepared to let students argue that "Structural Lock-in" is often a myth created by powerful people to protect themselves. That is a feature, not a bug, of your lesson.
