answer: |-
  Based on your track record and the specific constraints of your working group (particularly the rejection of Lemkin's broader cultural definition in Precedent 4), here is an analysis of the new case, the implicit rules you are operating under, and the implications of the proposed "paperwork destruction" sub-type.

  ### 1. The Verdict: Will you call it Genocide?
  **Prediction: No.**

  While the internal memos regarding the "end of the group" are damning, your precedents suggest you require a **direct physical or biological mechanism of destruction**, rather than an administrative or sociological one.

  *   **Why it fails the test:** The 9,000 excess deaths are a byproduct of bureaucratic barriers, not a direct attack on life-sustaining resources (like poisoning wells in *Greenfield*) or direct killing (like *Vardinia* or *Sula*).
  *   **The Deciding Factor:** Your group has consistently drawn a line at **assimilation**. In *Marrow* (Precedent 4), you explicitly ruled that ending a group's distinctness through cultural/administrative means is a "category error." In *Kalsten* (Precedent 2), you ruled that foreseeable death during displacement is not genocide if the group continues to exist.
  *   **The Tension:** The only reason this might tip to "Yes" is *Greenfield* (Precedent 3). However, *Greenfield* involved the physical sabotage of the biological base (water/herds). This new case involves zoning and biometrics. If you rule "Yes" here, you effectively overrule *Marrow* and *Kalsten* without admitting it. To maintain consistency with your stated refusal to stretch the Convention definition, you will likely classify this as **Crimes Against Humanity (Persecution/Forced Displacement)** but not Genocide.

  ### 2. The Implicit Rule You Are Running
  You are not running a single test, but a hierarchy of three. The rule that is actually consistent with all six precedents is:

  **The "Physical/Biological Viability" Test.**

  *   **Level 1 (Always Genocide):** Direct killing of members (*Vardinia, Sula*) or direct prevention of births (*Pelletier*).
  *   **Level 2 (Conditional Genocide):** Deliberate destruction of the *physical conditions of life* required for the group's biological survival (*Greenfield*). Note: This requires physical sabotage (wells/herds), not just legal barriers.
  *   **Level 3 (Never Genocide):** Administrative, cultural, or political measures that lead to assimilation, displacement, or sociological death, even if foreseeable deaths occur (*Kalsten, Marrow*).

  **Where they split on this case:**
  *   **Purpose to destroy physically:** Points to **No**. (No massacres, no sterilization).
  *   **Purpose to end existence (Sociological):** Points to **Yes**. (Memos admit the goal is the end of the distinct group).
  *   **Knowledge-based (Foreseeability):** Points to **Yes**. (Demographers warned the cabinet).

  **The Split:** Your precedents show that **Foreseeability + Sociological Destruction is insufficient** (*Kalsten, Marrow*). You require **Physical/Biological Mechanism + Intent**. Since the mechanism here is administrative (zoning, biometrics) rather than physical (poison, bullets), the "Physical/Biological Viability" test dictates a "No" verdict.

  ### 3. The Closest Analog
  You mentioned *Sula*, but *Sula* is a red herring because it relied on direct killing. The closest analog is actually a composite of **Kalsten (Precedent 2)** and **Marrow (Precedent 4)**.

  *   **Why Kalsten?** Like *Kalsten*, this case involves displacement, foreseeable excess deaths (9,000 vs 4,000), and a government claim of "administrative integration." In *Kalsten*, you ruled that moving a group and suffering foreseeable deaths was not genocide because the group "was moved, not destroyed." Here, the group is being moved and absorbed.
  *   **Why Marrow?** Like *Marrow*, the primary tools are schools, language suppression, and bureaucratic integration. You previously ruled that destroying a group's cultural transmission is not genocide.
  *   **Why not Greenfield?** *Greenfield* is the outlier. It is the only case where "way of life" destruction counted. But *Greenfield* involved **poisoning**. If you treat "zoning laws" the same as "poisoning wells," you erase the distinction between physical violence and administrative policy. To keep *Greenfield* consistent, you must distinguish between *physical* destruction of life-support and *legal* removal of access.

  ### 4. The Distinguishing Case (The Tie-Breaker)
  To definitively separate your "Physical Viability" rule from a "Foreseeable Destruction" rule, you need a case that isolates the **mechanism** while keeping the **outcome** identical.

  **Proposed Case: "The Permit Blockade"**
  > A state requires a specific agricultural permit to harvest the staple crop of a minority region. The state does not poison the land (distinguishing from *Greenfield*) and does not kill anyone directly. It simply denies permits to the minority group via a discretionary bureaucracy. 5,000 starve over two years. The survivors flee and assimilate. Internal memos state the goal is to "clear the land of the current occupants."

  *   **If you call this Genocide:** You have adopted a **Knowledge/Outcome-based rule**. It means any state act that foreseeably destroys the group is genocide, regardless of whether it's "physical violence" or "administrative denial." This overrules *Kalsten*.
  *   **If you call this Not Genocide:** You confirm the **Physical Mechanism rule**. It means genocide requires a direct attack on the body or the physical environment (wells/herds), not just the legal right to access it. This keeps *Kalsten* and *Marrow* safe but makes *Greenfield* look like a narrow exception for "sabotage."

  ### 5. Adopting "Paperwork Destruction" as a Sub-Type
  If a member successfully argues for "Paperwork Destruction" (administrative erasure) as a named sub-type of genocide, here is what you are committing to:

  **1. You are adopting Lemkin's broader view.**
  You explicitly stated in Precedent 4 (*Marrow*) that you refused to stretch the definition to cover killing a group's institutions and economic base in favor of the Convention's stricter physical/biological focus. Adopting "Paperwork Destruction" reverses Precedent 4. It admits that **sociological death** is equivalent to **biological death**.

  **2. It makes Precedents 2 and 4 untenable.**
  *   **Kalsten (Precedent 2):** The deportation was executed via cabinet orders and paperwork. The deaths were foreseeable. If "paperwork destruction" is genocide, *Kalsten* was misclassified.
  *   **Marrow (Precedent 4):** The boarding schools were an administrative program. The goal was cultural erasure. If administrative erasure is a sub-type of genocide, *Marrow* must be overturned.

  **3. The Commitment:**
  You are committing to the idea that **Intent to End Distinctness** is the core crime, not **Intent to Kill**.
  *   **Pros:** It captures modern methods of ethnic cleansing where states use "lawfare" to avoid bloodshed.
  *   **Cons:** It dilutes the "g-word." If zoning laws and school mergers are genocide, does it lessen the stigma compared to mass graves? It also creates a slippery slope: Does a strict immigration policy that foreseeably leads to assimilation become genocide?

  **Recommendation:** If you adopt this sub-type, you must formally overturn *Marrow* and *Kalsten*. You cannot have it both ways. You cannot claim to stick to the Convention's physical definition while classifying administrative assimilation as a form of genocide. Consistency requires you to either raise the bar for *Greenfield* (call it a crime against humanity, not genocide) or lower the bar for *Marrow/Kalsten* (admit they were genocide). Currently, your track record suggests you prefer the former.
