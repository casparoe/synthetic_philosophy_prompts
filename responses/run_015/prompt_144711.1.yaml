answer: |-
  **Project Title:** The Epistemic Structure of Conditionality: Manufacturing the Undeserving Poor

  **Research Question**
  Does the fundamental moral wrong of welfare conditionality lie in its distributive outcomes—who is excluded and how severely they suffer—or in its epistemic structure, namely the one-sided procedural demand that manufactures undeservingness as a measurable, visible category rather than discovering a pre-existing one?

  **Introduction and Problem Statement**
  Public debate regarding welfare conditionality typically divides into two camps. The first treats eligibility requirements as a behavioral problem: how to design incentives that filter out fraud and encourage workforce participation. The second treats them as an ideological construct: a political tool used to justify cutting benefits and stigmatize poverty. Both approaches, however, share a hidden assumption. They assume that the category of the "undeserving poor" is a pre-existing reality that policies either successfully identify or unfairly weaponize.

  I propose that this assumption overlooks a deeper philosophical issue. Modern workfare and benefit-fraud investigations operate as what I term an *asymmetrical visibility regime*. In this system, applicants must render their lives fully transparent through job-search logs, asset disclosures, and compliance audits. Meanwhile, the state's own exclusion criteria often remain opaque, complex, and administratively unchallengeable. My research suggests that the moral harm of conditionality may not be solely about who loses money (distributive harm), but about how the bureaucratic process itself constructs the moral status of the applicant (constitutive harm). A policy could theoretically be distributively fair—excluding very few people—while still being morally defective because it produces the category of the undeserving poor through its measurement rituals.

  **Limitations of Existing Approaches**
  Current literature leaves this question open because it focuses on the *application* of deservingness rather than its *construction*. Economic-defense literature analyzes conditionality through efficiency metrics, asking if the cost of monitoring is worth the reduction in fraud. Critical-theory literature analyzes conditionality through power dynamics, asking if the rules reinforce class or racial hierarchies. While valuable, both frameworks treat "deservingness" as a stable variable. They dispute whether the label is applied correctly or justly, but they do not question whether the administrative machinery creates the label in the first place.

  By splitting the harm into distributive versus constitutive dimensions, this project isolates a specific moral wrong that existing models miss. If the process of proving one's innocence requires a level of transparency that is never demanded of the state, the injustice lies in the epistemic relationship between citizen and government, regardless of how many checks are ultimately cut.

  **Methodology**
  This project employs conceptual analysis rather than empirical or historical methods. An empirical approach would measure how many people are denied benefits or survey how recipients feel about the process. While useful, data cannot answer the normative question of whether the *structure* of the inquiry is inherently wrongful. A historical approach would trace how these policies evolved, but it would not clarify their current moral logic.

  Instead, I will analyze the logical structure of three specific administrative mechanisms:
  1.  **Work-Search Verification Protocols:** The requirement to log specific interactions with employers.
  2.  **Fraud-Investigation Procedures:** The burden of proof placed on the accused during audits.
  3.  **Asset-Testing Thresholds:** The rules defining what counts as a disqualifying resource.

  For each mechanism, I will map its operation onto a spectrum between *filtering* (identifying a genuinely undeserving recipient who exists independently of the test) and *constituting* (creating the status of "undeserving" through the impossibility or intrusiveness of the test itself). This method allows me to separate the intended function of the rule from its actual philosophical effect.

  **Scope and Feasibility**
  A six-week timeline imposes strict limits on the depth of this analysis. It is not feasible to analyze the entire welfare code or compare multiple national systems. Therefore, I will limit the scope to a single jurisdiction's unemployment insurance framework for the case study portion. This ensures the analysis remains grounded in actual policy language rather than abstract speculation.

  *   **Weeks 1–2:** Refine the definitions of "asymmetrical visibility" and the filtering/constituting spectrum. Review relevant policy documents for the chosen case study.
  *   **Weeks 3–4:** Apply the conceptual framework to the three administrative mechanisms. Draft the case study analysis.
  *   **Weeks 5–6:** Develop the diagnostic framework for policymakers and finalize the written report.

  I recognize the risk that the distinction between filtering and constituting may be difficult to maintain in practice. If a rule filters out fraud, it inevitably defines what fraud looks like. I will address this by looking for instances where the administrative burden exceeds the informational value of the data collected, suggesting the goal is visibility rather than verification.

  **Expected Outcomes and Deliverables**
  A successful result will be a diagnostic framework that policymakers or analysts can use to evaluate welfare rules. This framework will not argue for the abolition of conditionality, but will offer a tool to diagnose whether a given rule is primarily distributive (aimed at resource allocation) or epistemic (aimed at enforcing a moral hierarchy through visibility). The final deliverable will be a research paper containing the theoretical argument and one fully worked case study.

  Failure would look like the collapse of the filtering/constituting distinction. If I find that all filtering is inherently constitutive, the distinction loses its analytical power. However, even this negative result is valuable. It would suggest that conditionality cannot be reformed to be merely distributive; the epistemic harm is intrinsic to the act of means-testing itself.

  **Conclusion**
  This project moves beyond the stalemate of "more benefits" versus "more accountability." By focusing on the epistemic structure of welfare administration, I aim to show that the way we ask for proof is just as morally significant as what we prove. For a summer research program, this offers a manageable scope with high conceptual stakes, allowing me to demonstrate rigorous philosophical thinking while engaging with a pressing real-world issue.
