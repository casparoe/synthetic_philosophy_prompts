  Consider a standard steel propane tank, ductile and dent-resistant, which lacks the categorical basis for fragility inherent to brittle materials like glass. The tank is accidentally over-pressurized well beyond safety limits, a standing physical state unrelated to the steel's molecular composition. If struck with a hammer ($S$), the combined stress of the impact and the internal tension causes the tank to shatter explosively ($M$). This outcome occurs in all nearby worlds where the strike happens, determined by the fixed pressure levels rather than the hammer altering the steel's structure, yet the steel itself remains ductile and non-brittle throughout the process.

  **Case Breakdown**
  *   **Disposition ($D$):** Fragility (the tendency to break due to material brittleness).
  *   **Stimulus ($S$):** Striking with a hammer.
  *   **Manifestation ($M$):** Shattering/Breaking.
  *   **Missing Basis:** The micro-structural weakness or brittle lattice required for genuine fragility (steel is ductile).
  *   **Nearby Worlds:** In all nearby $S$-worlds, the standing feature (high pressure) remains constant, ensuring $M$ occurs non-accidentally.

  **Verdicts**
  *   **Simple Conditional Analysis (SCA):** Concludes the tank **is fragile**. Since the conditional "If struck, it would shatter" is true, SCA equates this truth with the possession of the disposition.
  *   **Basis-First View:** Concludes the tank **is not fragile**. The object lacks the specific categorical base (brittleness) that constitutes fragility; the shattering is caused by pressure, not material weakness.

  **The Feature & Removal**
  The single feature doing the work is the **internal over-pressurization**. If you remove this feature (depressurize the tank), the case collapses into a **false conditional**: striking the ductile steel results in a dent, not a shatter. It does not become a coincidence case because the pressure ensures necessity, nor a standard mimic involving external agents (like a wizard or bomb), but it remains a case of pre-emptive causation where the wrong mechanism produces the right outcome.

  **Strongest SCA Reply**
  A defender of SCA can argue for a **refined stimulus description**: the disposition is not to break if struck *simpliciter*, but to break if struck *under normal conditions*. By building the "normal pressure" clause into the antecedent of the conditional, the conditional becomes false (If struck at normal pressure, it would not shatter), aligning SCA with the intuition that the tank isn't fragile.

  **Seminar Verdict**
  On reflection, this case **favors the Basis-First view** regarding natural kind classification, as we intuitively distinguish a "fragile object" from a "hazardous object" based on internal constitution rather than outcome alone. However, it does not decisively kill SCA, because the SCA defender's patch (refining the stimulus conditions) is linguistically plausible. The case ultimately shows that SCA can only survive by smuggling basis-like constraints into the description of the stimulus, suggesting the conditional analysis is not truly *simple* but dependent on the very categorical facts it seeks to analyze.
