answer: |-
  It is entirely understandable that something felt off about that exchange. Your flatmate is wielding a very sharp mathematical result as a blunt social instrument. While Aumann's Agreement Theorem is a genuine pillar of epistemic game theory, its application to human arguments—especially over a cup of tea in a shared kitchen—is notoriously fraught.

  The slogan "rational agents cannot agree to disagree" is often treated as a moral injunction to conform, when it is actually a conditional statement about idealised mathematical entities. To help you map this out for your flatmate, here is a menu of interpretations, ranging from the mathematically strict to the colloquially loose. I have assessed each for truth, plausibility in your context, and whether it licences your flatmate's behaviour (i.e., treating your refusal to update as proof of irrationality).

  ### 1. The Strict Mathematical Reading
  **The Claim:** If two agents have the **same prior** probability distribution, update by **Bayesian conditionalisation**, and have **common knowledge** of each other's posterior probabilities, then their posteriors must be identical.
  *   **Status:** **Substantive and True** (mathematically).
  *   **Plausibility in Practice:** **Near Zero.** Humans do not have identical priors (you likely have different background beliefs about AI progress), nor do we have "common knowledge" in the technical sense. Common knowledge requires not just that I know your number and you know mine, but that I know that you know that I know... ad infinitum. Merely stating "60%" and "15%" does not establish this.
  *   **Does it licence your flatmate's move?** **No.** Since the preconditions (common priors, common knowledge, perfect Bayesian rationality) are not met in a human conversation, the conclusion does not follow. You are not violating a mathematical law by disagreeing; you are simply not being Aumann agents.

  ### 2. The "Idealisation" Reading
  **The Claim:** We are not ideal agents, but we should *aspire* to be. Therefore, persistent disagreement is evidence that at least one of us is failing to process information correctly (i.e., being irrational).
  *   **Status:** **Substantive but Misleading.**
  *   **Plausibility in Practice:** **Moderate.** It is true that if two honest people disagree, it suggests someone is missing something. However, "irrationality" in the theorem means logical omniscience. In the real world, "irrationality" might just mean "has different life experiences leading to a different prior".
  *   **Does it licence your flatmate's move?** **No.** This reading suggests you should investigate *why* you disagree, not that you must immediately concede or average your numbers. It licences further conversation, not a conversation-stopper.

  ### 3. The "Common Prior" Escape Hatch
  **The Claim:** The theorem only applies if we start with the same prior. Since we clearly have different priors (I am more sceptical about AI timelines than you), the theorem does not apply to us at all.
  *   **Status:** **Substantive and True.**
  *   **Plausibility in Practice:** **High.** This is usually where real-world disagreements live. If your flatmate believes AI scaling laws are physical laws, and you believe they are economic contingencies, you have different priors. Aumann's theorem explicitly does not force agreement in this case.
  *   **Does it licence your flatmate's move?** **No.** In fact, it undermines it. If he cannot prove you share his prior, he cannot invoke the theorem to demand you move to his position.

  ### 4. The "Disagreement as Evidence" Heuristic
  **The Claim:** The fact that you (a calibrated forecaster) and I (a less calibrated arguer) disagree is itself data. I should update my probability towards yours simply because you believe it.
  *   **Status:** **Substantive and True** (as a Bayesian heuristic).
  *   **Plausibility in Practice:** **High.** This is the most useful practical takeaway. If you respect your flatmate's calibration, his 60% should pull your 15% upwards.
  *   **Does it licence your flatmate's move?** **Partially, but not the way he thinks.** This licences you to *update*, but it does not licence him to demand you update *all the way to 60%*, nor does it prove you are irrational for hesitating. It also relies on *you* granting that he is an expert, which is a separate issue from Aumann.

  ### 5. The "Immediate Convergence" Rule
  **The Claim:** Because rational agents can't disagree, we must meet in the middle (e.g., average our probabilities) right now to simulate rationality.
  *   **Status:** **Substantive but False.**
  *   **Plausibility in Practice:** **Low.** There is no theorem stating agents must average their probabilities. Sometimes one person has much stronger evidence than the other. Blind averaging is often less accurate than weighting by expertise.
  *   **Does it licence your flatmate's move?** **No.** This is a folk interpretation of the theorem. It turns a descriptive theorem about ideal agents into a prescriptive rule for compromise that isn't mathematically grounded.

  ### 6. The "Irrationality Accusation"
  **The Claim:** If you do not update towards me immediately, you are by definition being irrational.
  *   **Status:** **Substantive and False.**
  *   **Plausibility in Practice:** **None.** This is a category error. Failing to meet the conditions of a theorem (like having a common prior) does not make you irrational; it makes you human.
  *   **Does it licence your flatmate's move?** **No.** This is intellectually bullying. It uses the prestige of mathematics to shut down legitimate epistemic humility.

  ---

  ### On Calibration and Deference

  You asked whether his superior calibration changes the answer. It does, but it shifts the argument away from Aumann and towards **Bayesian Deference**.

  If your flatmate is genuinely better calibrated (i.e., when he says 60%, things happen 60% of the time), then a rational agent *should* treat his probability as strong evidence. If you say 15% and he says 60%, and you acknowledge he is an expert forecaster, you ought to move your number significantly towards his.

  However, there are two caveats that protect your right to disagree:
  1.  **Private Evidence:** If you have specific information he does not (e.g., insider knowledge about the lab's hardware constraints), your prior might be different because your *evidence* is different, not just your "irrationality". Aumann requires common knowledge of *all* information, not just the final number.
  2.  **Reference Classes:** He may be calibrated on general geopolitical events, while you might argue this specific AI case belongs to a different reference class (e.g., technological hype cycles) where his calibration doesn't hold.

  **Verdict on Deference:** You should probably update more than you want to (perhaps to 30% or 40% rather than staying at 15%), but this is because he is an expert, not because of Aumann's Agreement Theorem. He is smuggling in a principle of **expert trust** and dressing it up as a **logical necessity**.

  ### Summary for your Flatmate

  If you wish to reply to him, you might say something along these lines:

  > "I've looked into the actual preconditions of Aumann's theorem. It requires us to have identical priors and common knowledge of each other's posteriors. We clearly have different priors regarding AI development, and merely swapping numbers doesn't establish common knowledge. So, the theorem doesn't strictly apply here.
  >
  > That said, I accept the heuristic that your calibration is better than mine. I should update my probability towards yours because you're a better forecaster, not because logic forbids us from disagreeing. But that's a matter of weighting evidence, not a proof of my irrationality. Let's discuss *why* our priors differ rather than invoking a theorem that assumes they're already the same."

  In short: Your annoyance is warranted. He is using a theorem about angels to govern a argument between humans. You should defer to his expertise, but you need not defer to his misuse of mathematics.
