      *   *Section 1: The Actual Theorem (The "Strict" Reading).* Explain the conditions (common prior, common knowledge). Verdict: True, but doesn't apply to humans. Doesn't license the flatmate's behaviour.
      *   *Section 2: The "Heuristic" Reading (Disagreement is Information).* This is the useful bit. If a smart person disagrees, check your work. Verdict: Plausible, but doesn't force immediate agreement.
      *   *Section 3: The "Common Prior" Assumption.* This is the crux. Do you share a prior? Probably not. If priors differ, Aumann doesn't hold. Verdict: Flatmate is assuming away the hard part.
      *   *Section 4: The "Common Knowledge" Requirement.* Did you truly exchange *all* evidence? No. You exchanged numbers, not the underlying reasoning/qualia. Verdict: Conditions not met.
      *   *Section 5: The "Irrationality" Claim.* Does failure to agree prove irrationality? No, it proves you aren't Aumann agents. Verdict: False/Unfair.
      *   *Section 6: The Calibration/Expertise Factor.* This is Bayesian deference, not Aumann. If he's an expert, you should update, but not necessarily to *his* number, and not because of Aumann.

  5.  **Addressing the Specific Questions:**
      *   *Does it license the flatmate's behaviour?* Mostly no. He's using a sledgehammer to crack a nut, and ignoring the preconditions.
      *   *Does calibration matter?* Yes, but via a different principle (expert deference/trust), not Aumann.
