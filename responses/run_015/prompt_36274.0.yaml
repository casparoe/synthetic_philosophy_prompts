prompt: |-
  I got into a long argument with my flatmate last weekend — he's very into forecasting tournaments and the rationalist blogosphere — about the probability that a particular AI lab releases a certain kind of model before 2027. He said 60%, I said 15%, and after we traded numbers for a bit he announced that "rational agents cannot agree to disagree", Aumann's agreement theorem, and acted like the conversation was basically over: either I'm being irrational by not moving toward him, or we have to meet in the middle right now, or one of us has to concede. Something about that felt off to me — he's gesturing at a real theorem, I'm sure, but the slogan seems to be doing a lot of work the theorem itself maybe doesn't. For what it's worth, he's also much better calibrated than me (he does this stuff semi-professionally, I mostly just argue), which he did bring up, so maybe I *should* defer more than I want to. That annoys me and I can't tell if it's warranted annoyance.

  Anyway, I want to come back to him with a proper map of what that one line could actually be claiming. As best I can tell there are several distinct things it might mean: something very precise about two ideal agents with a common prior whose posteriors are common knowledge having to be identical; something weaker about the mere fact of persistent disagreement being evidence that at least one party is irrational or has a different prior (and that second disjunct seems like a big escape hatch in practice); something about what actual humans should do when they learn the other's probability, like a rule for how far to move; something asymptotic about convergence if you keep honestly reporting your numbers back and forth forever; and maybe a normative/party-line version where the slogan is just a reminder to treat disagreement itself as information. There may be readings I'm missing entirely.

  Could you lay these out as a menu — the trivial readings, the substantive-and-true ones, the substantive-but-false ones — and for each say whether it's plausible and, crucially, whether it actually licenses what my flatmate did with it (i.e. treating my not updating as proof of my irrationality, right there, in one conversation)? Also, if you can, say something about whether his being the better-calibrated forecaster changes the answer — is there a defensible reading of the slogan that tells me to defer to him specifically, or is that smuggling in a different principle altogether? Please write in British English. Ta.
