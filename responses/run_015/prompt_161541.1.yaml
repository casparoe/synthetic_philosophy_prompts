answer: |-
  You have hit upon one of the most sophisticated and persistent objections to the standard money-pump argument. Your diagnosis is technically correct: the classic dynamic money-pump argument *does* rely on an assumption of myopia (or naivety). If an agent is "sophisticated" (i.e., she anticipates her future choices and backward-inducts), she will refuse the first trade in the cycle, knowing it leads to a loss.

  However, your conclusion—that this reduces cyclic preferences to a mere inconvenience (a cost of commitment) rather than a defect of rationality—is where the philosophical consensus diverges from your intuition.

  Here is where the reasoning faces challenges, structured around the specific questions you raised.

  ### 1. The "Sophisticated" Agent and Fragmented Agency
  You suggest that a sophisticated agent avoids the pump by refusing the first trade. While this saves her money, it comes at a normative cost that decision theorists argue is constitutive of irrationality.

  To avoid the pump, the sophisticated agent must treat her future self as an adversary or a constraint. At time $t_1$, she prefers $A$ to $B$. But she knows that at $t_2$, she will prefer $B$ to $A$ (in the context of the trade). To avoid the loss, she must act at $t_1$ *against* what her future self would choose, or bind her future self.

  This implies a **fragmentation of agency**. A rational agent is typically modeled as a unified locus of choice over time. If your preferences are such that your future self cannot be trusted to act in the interest of your current self without external binding, your preferences are diachronically incoherent. The "cost" you mention isn't just a market transaction fee; it is the cost of managing an internal conflict within your own agency. Rationality is often defined as the efficient alignment of means to ends; if your ends (preferences) fight each other across time, you are instrumentally inefficient by definition.

  ### 2. The Normative Status of the "Cycle Premium"
  You argue that cyclic preferences merely incur a "cycle premium" (the cost of a commitment device), similar to a transaction cost.

  The counter-argument is that for a transitive agent, this cost is **zero**.
  *   **Agent T (Transitive):** Achieves outcome $A$ with \$0 cost.
  *   **Agent C (Cyclic):** Achieves outcome $A$ with \$X cost (commitment device) + \$Y cost (monitoring the bookie).

  If rationality is partly about **dominance**, Agent C is in a dominated position relative to Agent T. Agent C *must* incur extra costs to achieve the same state of the world that Agent T achieves naturally. If two agents are identical in every way except their preference structure, and one *necessarily* burns resources to compensate for that structure, the structure is defective.

  To say this is merely "bad luck" or a "market condition" is to confuse the *environment* with the *agent*. The bookie is part of the environment. The preference cycle is internal to the agent. A defect that makes you vulnerable to environmental pressures that leave others untouched is typically classified as an internal defect (irrationality), not bad luck.

  ### 3. Exploitability in Principle vs. Practice
  You ask: *What further premise converts exploitability into a charge of irrationality rather than of bad luck?*

  The premise is the **Principle of Vulnerability**: Rationality requires that your decision-making procedure not guarantee a loss in *possible* worlds, even if you get lucky in the *actual* world.

  Consider a logical contradiction. If I believe $P$ and $\neg P$, I might never encounter a situation where this causes me practical harm. I might never be asked to act on both simultaneously. Yet, we still call the belief state irrational. Why? Because the *structure* of the belief system is broken, regardless of whether a "bookie" comes along to Dutch Book me.

  Similarly, money-pump arguments are often interpreted as **existence proofs of incoherence**. They demonstrate that there is *no* utility function that can represent these preferences. If preferences are supposed to represent "betterness," and "betterness" is logically transitive (if $A$ is better than $B$, and $B$ better than $C$, $A$ must be better than $C$), then cyclic preferences are a category error, not just a costly strategy. The money pump is just the pragmatic demonstration of that logical error.

  ### 4. Static Money Pumps and Revealed Preference
  You asked if there is a version of the argument that survives cheap precommitment. Yes: **Static Money Pumps** and **Revealed Preference** arguments.

  In a static setting, suppose you are offered a choice set $\{A, B, C\}$.
  *   If you choose $A$, you reveal $A \succeq B$ and $A \succeq C$.
  *   If your preferences are cyclic ($A \succ B \succ C \succ A$), you cannot make a consistent choice.
      *   If you pick $A$, you should have picked $C$ (since $C \succ A$).
      *   If you pick $C$, you should have picked $B$.
      *   If you pick $B$, you should have picked $A$.

  This violates the **Weak Axiom of Revealed Preference (WARP)**. This violation occurs instantaneously. It doesn't require a sequence of trades, a bookie, or time to pass. It shows that cyclic preferences fail to perform the primary function of preferences: **selecting an option from a set.**

  If your preferences cannot determine a choice, they are functionally broken. The dynamic money pump is just one way to cash out this static incoherence in terms of resource loss.

  ### 5. The "Resolute Choice" Objection
  Some philosophers (like Edward McClennen) argue that agents can be "resolute." They choose a plan (e.g., "I will keep A") and stick to it, even when their local preferences shift at later nodes.

  However, this requires **preference revision** or **higher-order preferences**.
  *   If you stick to the plan because you *currently* prefer the plan's outcome over the local trade, your *effective* preferences are transitive (Plan > Trade).
  *   If you stick to the plan despite *currently* preferring the trade, you are acting against your current preferences.

  If you act against your current preferences, in what sense are those preferences your "preferences"? If you revise them to avoid the cycle, you have admitted the original preferences were defective. Either way, the cyclic structure does not survive intact as a rational guide to action.

  ### Summary: Where the Insight Meets the Limit
  Your insight is correct that the **dynamic** money pump requires myopia to extract money. A sophisticated cyclic agent won't lose cash in a specific sequence.

  However, the argument establishes irrationality because:
  1.  **Inefficiency:** The sophisticated cyclic agent incurs costs (mental or financial) to bind herself that a transitive agent does not.
  2.  **Agency Fragmentation:** She must view her future self as a threat, violating the unity of agency.
  3.  **Choice Failure:** Statically, cyclic preferences fail to select a unique best option, rendering them functionally useless as action-guides.
  4.  **Representation:** They cannot be mapped to a utility function, meaning they do not represent a coherent ordering of "betterness."

  The money pump argument is not ultimately about losing money; it is about **guaranteed dominated outcomes**. A cyclic agent *cannot* adopt a strategy that dominates the pump strategy without ceasing to act on her cyclic preferences. Therefore, the preferences themselves are the source of the domination.

  **Recommended Reading:**
  If you want to dig deeper into this specific dialectic, look at **Johan Gustafsson's** work (e.g., *The Money-Pump Argument*). He rigorously defends the money pump against the "sophistication" objection you raised, specifically by constructing pumps where sophistication offers no escape (e.g., using non-forced choice sequences or highlighting the costs of the sophistication itself). Also, **Amartya Sen's** work on internal consistency of choice offers the static counterpoint to the dynamic pump.
