      *   *Seeing/Cure:* Increasing welfare (benefits).
      *   *Weight:* The moral value assigned to the benefit (priority weight).
      *   *Goal:* Maximize weighted welfare, not equality.

  4.  **Analyze the "Fixed Zero Point" & Cardinal Scale Issue (The Core Technical Critique):**
      *   *Prioritarianism Formula:* $W = \sum f(w_i)$, where $f$ is a strictly concave transformation function (e.g., square root, log).
      *   *Cardinality:* Prioritarianism requires cardinal utility (intervals matter) because we are transforming the welfare levels, not just ranking them.
      *   *Zero Point:* This is the tricky part. In standard utilitarianism, zero is often arbitrary (shift invariance). In Prioritarianism, because $f$ is non-linear, shifting the zero point changes the *weights*.
