      *   *Leveling Down Objection (LDO):* Egalitarianism says a world where everyone is equally miserable is *in one respect* better (equality) than a world where some are happy and some are miserable, even if the mixed world is better overall. Prioritarianism says the mixed world is strictly better; there is *no respect* in which leveling down is good.
      *   *Does the Analogy Hide This?* The analogy focuses on *benefits* (curing blindness). It ignores the *metric* used to measure blindness. If "blindness" is just "less welfare," fine. But if the *weighting* depends on where "total blindness" (zero) is set, the analogy glosses over the mathematical arbitrariness that critics (like Becker or Arrhenius) point out.

