      *   *Key Insight:* The analogy makes "worse off" look like an objective physical state (blindness). In reality, "worse off" depends on a welfare metric that lacks a non-arbitrary zero. This makes the "priority weight" potentially arbitrary, which weakens the claim that it's a distinct, stable alternative to Egalitarianism.

