      *   *Intuition:* It's better to cure the blind than to blind the sighted.
      *   *Professor's Use:* This illustrates Prioritarianism (helping the worse off is more valuable) vs. Strict Egalitarianism (which might imply leveling down makes things *more* equal, even if worse for everyone).
