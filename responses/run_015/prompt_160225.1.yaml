  **INTERNATIONAL COMMISSION ON CANONICAL RANDOMNESS**
  **Bulletin 74-Ω**
  **Subject:** Resolution of Measure Underdetermination in Geometric Probability
  **Date:** 1 October 2024
  **Classification:** Mandatory Compliance

  **1.0 Preamble**
  Whereas ambiguity in stochastic directives (e.g., "a chord drawn at random") yields divergent probability assignments depending on parametrization; and whereas such divergence compromises actuarial stability, lottery integrity, and randomized trial validity; the Commission hereby establishes the Official Measure. It is the finding of this body that while multiple generative procedures exist, only one satisfies the Desiderata of Canonical Ignorance.

  **2.0 The Principle of Mandatory Invariance**
  2.1 In cases where the physical mechanism of selection is unspecified, the assigned measure must remain invariant under all transformations deemed irrelevant to the problem statement.
  2.2 For circular domains, the Commission stipulates that position, orientation, and scale are irrelevant features. Consequently, the Official Measure must be invariant under rotation, translation, and scaling.
  2.3 Applicants are advised that while alternative parametrizations (e.g., uniform distribution of midpoints vs. endpoints) are mathematically coherent, they are hereby classified as *Non-Canonical*. They fail to respect the full symmetry group of the Euclidean plane. The selection of the invariant measure is not a choice among equals, but a requirement of rational consistency.

  **3.0 Maximum Entropy Protocols**
  3.1 Where invariance arguments are insufficient, the Principle of Maximum Entropy shall apply.
  3.2 Practitioners must note that entropy maximization yields uniformity only relative to a chosen coordinate system. To ensure objectivity, the coordinate system must be the one identified in Clause 2.2.
  3.3 It is the position of the Commission that selecting these coordinates does not constitute an assumption about the physical world, but rather a formal expression of total ignorance. Any deviation implies knowledge not possessed by the agent.

  **4.0 Compliance and Enforcement**
  4.1 All insurance models involving risk regions must utilize the Canonical Measure.
  4.2 Disputes arising from alternative measures will be resolved in favor of Bulletin 74-Ω.

  **ANNEX A: NON-CIRCULAR CONVEX REGIONS**

  **A.1 The Problem of Broken Symmetry**
  In regions lacking rotational symmetry (e.g., ellipses, floodplain outlines), the invariance machinery of Clause 2.2 delivers no unique solution. Rotation is no longer a symmetry of the domain.

  **A.2 Resolution by Asymptotic Decree**
  To resolve this underdetermination, the Commission hereby defines the "Pseudo-Radius" for any convex set as the distance from the centroid to the boundary along the minor axis.
  1. The Official Measure for lines intersecting such regions shall be uniform over the Pseudo-Radius.
  2. This parameter is derived from the limiting case where the ellipse approaches a circle.
  3. While the major axis offers an equally defensible limit, the Commission finds that the minor axis better preserves the *spirit* of rotational invariance.

  **A.3 Final Stipulation**
  Practitioners are instructed to treat the value derived in A.2 as objectively discovered. It is not a convention imposed to facilitate calculation, but the unique value dictated by the Principle of Mandatory Invariance, extended by administrative continuity. Any probability assigned using the major axis is hereby deemed actuarially unsound.

  **Signed,**
  *Dr. H. V. Sterling*
  *Chair, Committee on Canonical Randomness*
