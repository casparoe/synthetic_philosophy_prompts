  **OFFICE OF ADMISSIBLE SHARPENINGS**
  **Guidance Note 17 (Third Revision)**
  **Subject:** Designation of Heaps, Baldness, and Other Statutory Predicates

  **1. Purpose and Definitions**
  1.1. This Note establishes protocol for applying vague predicates where legislative intent lacks precision.
  1.2. **Admissible Sharpening:** A precise interpretation of a vague predicate consistent with established usage and legislative intent.
  1.3. **Supertrue:** A proposition evaluated as true under every Admissible Sharpening. Only Supertruth confers statutory validity.
  1.4. **Penumbra:** The set of cases where a proposition is true under some Sharpenings and false under others. Penumbral cases possess no truth value.
  1.5. **Officer:** Any civil servant authorized to apply predicates pursuant to this Note.

  **2. Certification of Predicates**
  2.1. Officers shall designate an object as a "Heap" only if the proposition "This is a Heap" is Supertrue.
  2.2. Where a case falls within the Penumbra, the object is statutorily neither a Heap nor a Non-Heap. Officers recording a binary value for a Penumbral case will face disciplinary action for Falsifying Statistical Reality.
  2.3. If an Officer asserts "This is a Heap" regarding a Penumbral collection, they assert a falsehood. If they assert "This is not a Heap," they assert a falsehood. Silence is the only compliant position.
  2.4. Officers must not attempt to resolve Penumbra cases via measurement. Precision in counting does not eliminate Vagueness in predication.

  **3. Existence of Thresholds**
  3.1. It is Supertrue that there exists a number of grains $n$ such that any collection of $n$ grains constitutes a Heap.
  3.2. However, for any specific number $k$, the proposition "$k$ is the threshold" is not Supertrue, as some Sharpenings admit $k$ while others admit $k+1$.
  3.3. Officers are strictly forbidden from instantiating the existential quantifier in Clause 3.1. Do not write down a number. Do not think of a number. Existential Instantiation is grounds for immediate dismissal.
  3.4. The threshold exists globally but is locally inaccessible. Acknowledge the existence; deny the specificity. To name the boundary is to violate the logic of the Office.

  **4. Higher-Order Vagueness**
  4.1. Cases regarding the admissibility of Sharpenings are referred to the Office of Second-Order Admissibility.
  4.2. Questions regarding the boundaries of the Second-Order Office are deferred to Guidance Note 17 (Fourth Revision).
  4.3. Officers should not worry about the regress. Worry is not Admissible.
  4.4. If a Sharpening seems borderline, submit Form 17-B. Do not attempt to sharpen the Sharpening yourself.

  **5. Appropriations and Penalties**
  5.1. The Office Budget is not Determinately Appropriated. Funding exists on some Sharpenings but not others. Procurement may be halted unexpectedly.
  5.2. Fines for non-compliance may be levied in Penumbral Currency. Payees should expect fluctuating value depending on the current Sharpening of the Dollar.
