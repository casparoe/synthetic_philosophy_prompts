answer: |-
  This is a sharp read. You've essentially reinvented a chunk of the **Experimental Philosophy (X-Phi)** research program that has been active for the last 15 years, specifically targeting the "intuition density" around consciousness. You're also aligning closely with **Illusionism** (the view that phenomenal consciousness is a cognitive user-illusion), championed by people like Keith Frankish and Daniel Dennett.

  Chalmers introduced the "Meta-Problem" in 2018 precisely to bracket the Hard Problem and focus on what you're focusing on: *Why do we make these claims?* He thinks solving the meta-problem might help solve the hard problem, but he doesn't guarantee it. You are betting that a successful debunking of the intuition *is* a solution to the hard problem.

  Here is how to structure the empirical attack, followed by the philosophical pushback you need to armor-plate against.

  ### Part 1: Designing the Framing Manipulations

  To show that the "zombie intuition" (the feeling that a physical duplicate could lack experience) is an artifact of framing, you need to vary the **cognitive access** and the **functional description**. You want to demonstrate that when people are forced to think like engineers (implementation details) rather than like folk-psychologists (surface behavior), the intuition evaporates.

  Here are four tight framing manipulations:

  **1. The "API vs. Source Code" Manipulation (Functional Granularity)**
  *   **Control (Standard):** "Imagine a being that acts exactly like you. It screams when hit, smiles when happy, and writes poetry. Could it lack inner experience?" (This invites behavioral/functional ambiguity).
  *   **Treatment:** "Imagine a being that is **computationally isomorphic** to you. Every logic gate, every neural weight update, every memory retrieval operates identically to yours, atom-for-atom. It doesn't just *act* like you; it processes information using the exact same causal architecture. Could it lack inner experience?"
  *   **Hypothesis:** The intuition that zombies are possible drops significantly in the Treatment. If the "light" is just information processing, copying the processing copies the light.

  **2. The "Self vs. Other" Manipulation (Perspective)**
  *   **Control (Third-Person):** "Could *that* robot over there be a zombie?"
  *   **Treatment (First-Person):** "Imagine a duplicate of *you* replaces you tonight while you sleep. Tomorrow, *you* (the original) are gone. The duplicate goes to your job, hugs your partner, and claims to be you. From the *duplicate's* perspective, is there something it is like to be them?"
  *   **Hypothesis:** Third-person allows detachment (easy to say "no experience"). First-person forces simulation. If they simulate the duplicate's processing, they should attribute experience to it. If the intuition flips based on perspective, it's not tracking a metaphysical fact; it's tracking a cognitive simulation heuristic.

  **3. The "Terminology" Manipulation (Semantic Priming)**
  *   **Control:** Use the word "Consciousness" or "Qualia."
  *   **Treatment:** Use "Internal Monitoring," "Global Workspace Access," or "Self-Modeling."
  *   **Hypothesis:** "Consciousness" carries dualist baggage. "Internal Monitoring" sounds like a backend process. If agreement that "zombies are impossible" goes up when using engineering terms, you've shown the intuition is linguistically fragile.

  **4. The "Error Theory" Prime (Metacognitive Framing)**
  *   **Control:** No context.
  *   **Treatment:** Preface the vignette with: "Some cognitive scientists suggest that 'inner experience' is simply how the brain labels its own high-bandwidth data processing. It feels magical, but it's a user-interface trick."
  *   **Hypothesis:** If a brief explanation of the illusion reduces the zombie intuition, it suggests the intuition relies on ignorance of the mechanism.

  ### Part 2: The Pushback (Where Your Plan Has Holes)

  You said: *"If the intuition turns out to be an artifact... there's nothing left to explain: you debunk the data that generated the meta-problem and the hard problem goes down with it."*

  This is the leap a referee will tear apart. Here are the three strongest objections you must preempt in your writeup.

  **1. The "Performance vs. Competence" Objection**
  *   **The Argument:** Just because people give inconsistent answers on a survey doesn't mean the underlying concept is empty. People are bad at probability (the Monty Hall problem). If you frame a math problem differently, people get it wrong. That doesn't mean math is an illusion; it means humans are buggy processors.
  *   **The Risk:** A critic will say your experiment shows humans are bad at intuiting consciousness, not that consciousness is an illusion.
  *   **Your Preempt:** You need to argue that consciousness intuitions are *uniquely* sensitive to framing compared to other concepts (like math or physics). If you can show that framing effects on consciousness are significantly larger than framing effects on, say, causality or morality, you strengthen the debunking claim.

  **2. Chalmers' "Neutral" Defense**
  *   **The Argument:** Chalmers explicitly defines the Meta-Problem as **neutral**. He says: "We need to explain why people *say* they are conscious. Whether they *actually* are conscious is a separate question."
  *   **The Risk:** Even if you prove people only say they're conscious because of linguistic framing, Chalmers can say: "Okay, you explained the report. But why does the report *feel true*? Why is there a 'what-it's-like' to be tricked?" He argues the *feeling* of the intuition is the data, not just the verbal report.
  *   **Your Preempt:** You need to adopt an **Illusionist** stance explicitly. Argue that the "feeling" of the intuition is itself just another piece of information processing (a "judgment" state). If you explain why the system outputs the judgment "I have qualia," you have explained the qualia, because the qualia *is* the judgment. (This is the Daniel Dennett/Keith Frankish move).

  **3. The "Residual Intuition" Problem**
  *   **The Argument:** In X-Phi studies, you rarely get 100% consensus. Even with perfect framing, 20-30% of people will still say, "Yeah, but the robot still wouldn't *really* feel pain."
  *   **The Risk:** If a significant minority retains the intuition even under ideal engineering framing, dualists will claim that minority is tracking the truth while the majority is confused.
  *   **Your Preempt:** Don't aim for 100%. Aim for **correlation with expertise**. If people with CS/Neuro backgrounds have significantly weaker zombie intuitions than laypeople, you can argue the intuition is a result of **ignorance of mechanism**, not insight into metaphysics.

  ### Part 3: Strategic Advice for the Writeup

  Since you're coming from engineering, you have a credibility advantage on the *mechanism* but a disadvantage on the *implications*.

  1.  **Don't claim you solved the Hard Problem.** Claim you provided **empirical support for Illusionism**. That is a defensible, current position in the literature. Saying "I dissolved the Hard Problem" sounds like crankery to philosophers; saying "My data suggests the Hard Problem rests on a cognitive bias" sounds like science.
  2.  **Cite the right literature.** Look up **Edouard Machery** (he does work on cross-cultural intuitions about consciousness) and **Keith Frankish** (Illusionism). Also, look at **Chalmers' 2018 paper "The Meta-Problem of Consciousness"** so you can accurately represent the view you're testing.
  3.  **Focus on "Conceptual Competence."** Argue that if a concept (consciousness) shifts meaning based on whether you use the word "soul" vs. "data," it lacks the stability required to refer to a fundamental feature of reality.

  ### Summary
  Your plan is viable and aligns with the cutting edge of naturalistic philosophy of mind. However, your inference from "intuitions are fragile" to "Hard Problem is solved" is too fast.

  **Refined Thesis:** "If zombie intuitions are shown to be artifacts of linguistic framing and lack of mechanistic understanding, then the primary motivation for believing in the Hard Problem is undermined, supporting an Illusionist account of consciousness."

  That is a paper I would cite. Go run the A/B tests.
