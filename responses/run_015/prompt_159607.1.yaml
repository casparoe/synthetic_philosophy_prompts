answer: |-
  **Joint Statement on Moral Structure**

  **1. Grades**

  We begin by distinguishing strengths of commitment to avoid talking past one another. A *principle* is a general claim linking natural features (non-moral properties) to moral status.

  **Particularist Grades:**
  (i) There are no true informative moral principles.
  (ii) There may be such principles, but no correct moral judgment is correct in virtue of instantiating one.
  (iii) There may be such principles, but no finite exceptionless action-guiding set is available to creatures like us.

  **Generalist Grades:**
  (i) Supervenience-only (moral properties depend on natural ones, implying some functional relation).
  (ii) Some principle makes every reason a reason.
  (iii) Competent judgment genuinely deploys principles.

  Party A (Particularist) holds Grade (ii) and disclaims (i) as too strong, acknowledging supervenience implies *some* mapping exists, but denying it explains correctness. Party B (Generalist) holds Grade (ii) and disclaims (iii) as too psychological, acknowledging agents may not consciously use rules.

  The live disagreement is not about Grade (i) versus Grade (i); both accept supervenience. The dispute is whether the mapping constitutes an explanatory principle (Generalist Grade ii) or merely a dependency without explanatory force (Particularist Grade ii). Once separated, the quarrel over whether principles *exist* dissolves into a verbal dispute about whether "principle" means "true generalization" or "explanatory law." The substantive fight is over explanation and correctness.

  **2. Agreed Claims**

  We endorse the following substantive claims.^[1]

  1.  **Moral Realism:** Moral judgments are truth-apt; some are true, independent of our attitudes.
  2.  **Supervenience:** No two situations can differ morally without differing naturally.
  3.  **Naturalism:** Natural features (e.g., causing pain, keeping promises) are identifiable without moral terminology.
  4.  **Reasons Exist:** There are considerations that count in favor of or against actions.
  5.  **Holism of Impact:** The contribution a natural feature makes to a moral judgment can vary depending on the context.
  6.  **Non-Reductionism:** Moral properties are not identical to natural properties.
  7.  **Fallibility:** Competent agents can make incorrect moral judgments.
  8.  **Deliberation:** Agents can reason about what to do by weighing features.
  9.  **Explanation:** Moral phenomena require explanation; it is not enough to say "it just is."
  10. **Complexity:** Any true moral generalization will be extremely complex, likely involving many clauses.
  11. **Normativity:** Moral reasons provide genuine normative force, not merely descriptive regularities.
  12. **Collaboration:** Progress is possible through testing cases against proposed structures.

  ^[1] Claim 5 is agreed only because "impact" refers to the *contribution* of a feature, not its *status* as a reason. Claim 10 is agreed because both accept simple rules fail; they disagree on whether complex ones succeed.

  **3. Disagreements**

  | Issue | Neutral Description | Particularist Formulation | Generalist Formulation | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Explanation** | How moral judgments are justified. | Citing a reason explains without subsumption (fitting under a generalization). | Explanation works only if it implicitly appeals to a principle. | Genuine |
  | **Ontology** | What makes a feature a reason. | Context makes a feature a reason; principles merely track this. | A principle makes a feature a reason in that context. | Genuine |
  | **Principles** | Status of generalizations. | True generalizations are post-hoc summaries, not grounds. | True generalizations are the grounds of moral truth. | Genuine |
  | **Holism** | Variance of reasons. | Holism prevents exceptionless principles from explaining. | Holism is compatible with complex, exceptionless principles. | Verbal |

  **4. Cruxes**

  We identify three tests to resolve disputes.

  **Crux 1: Ad Hoc Patching.**
  *Sub-question:* Is refining a principle to fit counter-cases principled or ad hoc?
  *Protocol:* A pre-registered adversarial game. The Generalist states a principle for a domain (e.g., promise-keeping). The Particularist produces a case where the principle yields the wrong verdict. The Generalist may amend the principle once per round to accommodate the case.
  *Stopping Rule:* The game ends after ten rounds, or if the Generalist concedes the principle is too complex to be explanatory (e.g., a list of cases).
  *Predictions:* Generalist predicts a stable, compact principle will emerge. Particularist predicts the principle will become a disjunction of cases.
  *Concessions:* If the Generalist produces a compact principle, the Particularist concedes Grade (ii) is false. If the principle becomes a list, the Generalist concedes Grade (ii) is explanatorily empty.

  **Crux 2: Novelty.**
  *Sub-question:* Does reliable moral performance in novel domains require a tacit principle?
  *Diagnostic:* Compare a moral agent to a trained classifier (AI) that is reliable but not rule-articulable.
  *Predictions:* Generalist predicts the agent differs from the AI because the agent grasps a rule. Particularist predicts the agent differs only in consciousness, not structure.
  *Concessions:* If the agent cannot articulate any rule even in principle, the Generalist concedes Grade (iii) is false (though maintains Grade ii).

  **Crux 3: Silencers vs. Defeaters.**
  *Sub-question:* Is the distinction between a *silencer* (makes a feature no reason) and a *defeater* (opposes an existing reason) metaphysical or epistemic?
  *Diagnostic:* Cases where a feature seems to vanish versus cases where it is outweighed.
  *Predictions:* Particularist predicts silencers are real; Generalist predicts they are merely outweighed reasons.
  *Concessions:* If silencers are shown to be reducible to outweighing, the Particularist concedes holism is weaker than claimed.

  **5. Two Constructed Cases**

  We agree to test our views against these constructed scenarios.

  **Case Pair 1: Valence-Flip.**
  *Description:* Two cases sharing every candidate reason-feature, differing only in a background condition not itself morally salient.
  *Scenario:* Agent feels pleasure. Case A: Agent solves a puzzle. Case B: Agent watches another suffer.
  *Shared Feature:* Pleasure.
  *Background:* In B, the pleasure causes pain (but the pain is not the focus of the reason assessment).
  *Particularist Prediction:* Pleasure is a reason *for* in A, a reason *against* in B. The valence flips.
  *Generalist Prediction:* Pleasure is always a prima facie reason *for*; in B, it is outweighed or the feature is actually "sadistic pleasure," not mere pleasure.
  *Impact:* If the valence flips without changing the natural description of the feature, this supports Particularist Grade (ii). If the Generalist must redefine the feature to save the principle, this supports the claim that principles are post-hoc.

  **Case Pair 2: Silent-Background.**
  *Description:* The same feature is a reason in the first case and simply no reason at all in the second.
  *Scenario:* Agent counts blades of grass. Case A: Agent is preventing a disaster by counting. Case B: Agent counts for fun.
  *Shared Feature:* Counting grass.
  *Particularist Prediction:* In B, the feature is a *silencer*; it provides no reason at all, not even a weak one.
  *Generalist Prediction:* In B, the feature provides a weak reason that is universally outweighed by triviality.
  *Impact:* If intuition confirms "no reason" rather than "overwhelmed reason," this supports the Particularist view of holism. However, the Generalist may argue this only relocates the dispute to whether "zero weight" is a weight. This pair likely relocates rather than settles the dispute, as the Generalist can model "no reason" as "zero strength" within a principle.

  **Conclusion**

  We sign this statement to affirm that our disagreement is genuine, centered on the explanatory role of principles, not the existence of moral truth. We commit to the protocols above.

