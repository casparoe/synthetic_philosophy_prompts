answer: |-
  This is a **Methodological Heuristic Stalemate compounded by Evidential Underdetermination.**

  Here is the breakdown of why the loop persists, what is actually being disputed, and what would constitute progress.

  ### 1. The Diagnosis: It is not primarily an empirical frequency disagreement
  While your group agrees that spandrels exist, the stall is not actually about *how often* null models fail in general biology. If it were, a meta-analysis of evolutionary studies would settle it. The stall persists because human language is a **singular historical event** with no fossil record for syntax or semantics.

  Therefore, the disagreement is not about the *frequency* of adaptation in nature, but about the **Burden of Proof** in the absence of direct data.
  *   **Adaptationists** treat selection as the "default" null hypothesis for complex function (Dennett's "Crane"). To them, assuming non-adaptation requires more special pleading.
  *   **Pluralists** treat selection as a specific claim that requires positive evidence. To them, assuming adaptation without direct historical data is the special pleading (the "Just-So" story).

  ### 2. Are they answering different questions?
  **Yes.** This is the strongest philosophical diagnosis of the stall. Under the single heading "Is language an adaptation?", they are answering two distinct causal questions:
  *   **Adaptationists are asking about *Maintenance* and *Design*:** "Does the current utility of language explain its complex structure?" (Forward-looking/Functional).
  *   **Pluralists are asking about *Origin* and *Constraint*:** "Could this trait have arisen via general cognitive scaling or physical constraints without specific selection for language?" (Backward-looking/Structural).

  Because current utility (it is useful now) does not logically entail historical origin (it was selected for then), they talk past each other. An adaptationist points to current utility as proof of design; a pluralist points to structural constraints as proof that selection wasn't *necessary*.

  ### 3. Is it bedrock intuitions about parsimony?
  Partially, but "parsimony" is the wrong word. It is better described as a disagreement about **Explanatory Power vs. Explanatory Risk**.
  *   Adaptationists believe selection is the only known causal process that generates complex *function*. Denying it leaves the function unexplained.
  *   Pluralists believe invoking selection too readily masks ignorance of developmental constraints.
  This is a "bedrock" disagreement, but it is about **methodological priority**, not simple simplicity.

  ### 4. What counts as progress?
  A formal result or a single experiment is unlikely to break this specific deadlock regarding language, because the historical data is inaccessible. Progress will come from **Conceptual Decomposition and Heuristic Pluralism.**

  *   **Conceptual Decomposition (The Empirical Path):** Progress occurs only when "Language" is broken down into testable sub-components (e.g., vocal control vs. recursive syntax). The Hauser-Chomsky-Fitch (2002) distinction between the Faculty of Language in the Broad Sense (FLB) and Narrow Sense (FLN) is the model here. If recursion is the only unique human trait, the adaptationist target shrinks, making the null model easier to test.
  *   **Heuristic Pluralism (The Philosophical Path):** The group must stop treating "Adaptationism" and "Pluralism" as mutually exclusive truth-claims about the world, and start treating them as **competing research programmes** (in the Lakatosian sense). Progress is recognizing that the "Adaptationist Programme" generates different (and sometimes more fruitful) predictions than the "Structuralist Programme," and the goal is to map the *domain of applicability* for each, rather than declare one the victor.

  ### Confidence and Uncertainty

  **Confidence Level:** 85%
  I am highly confident that the stall is methodological/heuristic rather than purely empirical, given the philosophical literature on the Gould-Lewontin debate and the specific evidential limits of evolutionary linguistics.

  **Point of Least Certainty:**
  I am least sure about the claim that **"Conceptual Decomposition" will satisfy the Adaptationists.**
  *Reasoning:* Even if "language" is decomposed into sub-traits (e.g., recursion), Adaptationists may still argue the sub-trait is an adaptation, while Pluralists argue it is a spandrel of general intelligence. Decomposition sharpens the debate, but it does not guarantee resolution because the *interpretive framework* (Selection vs. Constraint) remains in conflict even at the micro-level. The "bedrock intuition" about whether selection is the default explanation for *any* complex cognitive trait may remain unfalsifiable.
