answer: |-
  **Dr. Aris Thorne:** Let's fix the case clearly, Selene. We have the Charter. In the actual world, $W@$, it was drafted by the Assembly, ratified, and sustains a robust practice of collective recognition. In $W1$, the physical document is molecule-for-molecule identical, drafted by the same individuals at the same time, but it was never ratified. The surrounding practice of recognition is entirely absent. My claim is straightforward: In $W1$, that object is not The Charter. It is a counterpart, perhaps a very close one, but it lacks the institutional identity.

  **Dr. Selene Voss:** And my claim is that if we are committed to the ontology of social objects, we must allow for strict transworld identity. The Charter is an artifact constituted by that specific act of drafting. If the authors and the text are identical, the object is numerically identical across worlds. The lack of ratification in $W1$ is a difference in relational properties—specifically, its normative status—not a difference in identity. The Charter exists in $W1$; it is merely inert.

  **Thorne:** "Merely inert" does the heavy lifting there, but I think it conceals the metaphysical cost. You're treating The Charter like a physical artifact, say, a specific lump of clay. But social objects are constituted by their function within a practice. This is where our constructed distinction, "institutional inertia," becomes decisive. Inertia dictates that persistence depends on an unbroken chain of collective recognition. In $W1$, that chain is severed at the origin. If persistence conditions depend on recognition, and recognition is absent, then on your view of strict identity, The Charter simply does not exist in $W1$.

  **Voss:** Not necessarily. I can accept institutional inertia as a condition for the *functioning* of the object without conceding it is a condition for the *existence* of the object. Consider a sword that is never drawn. It is still a sword. Similarly, The Charter in $W1$ is still The Charter, even if it never achieves normative force. Strict transworld identity allows us to say, "This is the very same entity, but it fails to thrive." Your counterpart theory forces you to say, "This is a different entity that resembles the first." That seems to lose the historical grip we have on institutions. We want to say the Assembly *failed to enact The Charter*, not that they enacted a counterpart.

  **Thorne:** But that historical grip is exactly what Lewisian counterpart theory captures more precisely through the weighting of the counterpart relation. The relation is not just about intrinsic similarity; it's about causal and historical continuity. In $W@$ , the chain of recognition provides the momentum. In $W1$, the physical similarity is high, but the historical-causal profile regarding social uptake is null. Counterpart theory allows me to say the counterpart relation is weak or contextually nullified without invoking a mystical "thisness" that persists despite the absence of the very thing that makes it a social object. You're positing a haecceity for a constitution that floats free of its constitutive practices.

  **Voss:** I'm not positing a mystical haecceity; I'm positing origin essentialism. The identity of an artifact is secured by its origin—the specific intentional act of creation. The Assembly's drafting is the origin. That origin is fixed across worlds. Institutional inertia, as you define it, describes the *modal momentum* of the object, not its *ontological ground*. If you conflate the two, you make the existence of social objects too fragile. If recognition flickers for a day in the actual world, does The Charter cease to exist and then a new counterpart arise when recognition resumes? Strict identity allows for interruptions in recognition without ontological death.

  **Thorne:** That's a compelling point for temporal persistence, but we are discussing modal persistence across worlds. Here, institutional inertia suggests that the *possible* history matters. In $W1$, the object never participates in the specific historical chain of recognition that defines The Charter in $W@$. If we rely on strict identity, you must claim that the object in $W1$ is numerically one with the object in $W@$. But if the identity conditions of social objects are relational—as inertia suggests—then an object lacking those relations in $W1$ cannot be strictly identical to one defined by them in $W@$. Counterpart theory handles this gracefully: the object in $W1$ is a counterpart to the degree that it shares relevant properties. Since recognition is relevant, the degree is low.

  **Voss:** But "degree of identity" is an oxymoron. Identity is binary. Either it is The Charter or it isn't. Your counterpart theory dissolves the object into a cluster of similarities. If I say, "In $W1$, The Charter was never ratified," I am making a true claim about The Charter. I am predicating something of *that* object. If I am merely talking about a counterpart, I am predicating something of a *different* object that resembles The Charter. This matters for normative metaphysics. If the object in $W1$ is not strictly The Charter, then the Assembly in $W1$ bears no responsibility for failing to ratify *it*. They just drafted something else.

  **Thorne:** Responsibility tracks causal histories, not strict numerical identity across worlds. But let's press the inertia point. You argue origin secures identity. I argue that for social objects, the "origin" includes the uptake. A speech act without uptake is not necessarily the same institutional act. Institutional inertia implies that the momentum of recognition is part of the individuation condition. If $W1$ lacks that momentum, the object in $W1$ lacks the essential property of "being recognized as authoritative." If that property is essential, then by Leibniz's Law, the object in $W1$ is not identical to the object in $W@$. Counterpart theory avoids the contradiction by denying transworld identity altogether. It says: $W1$ contains an object that is Charter-like, but since it lacks the essential recognition, it is not a counterpart under the "institutional" context.

  **Voss:** You're shifting the goalposts. First, inertia was about persistence; now it's about essential properties. If "being recognized" is essential, then The Charter does not exist in $W1$. I can accept that. But if it doesn't exist in $W1$, then we aren't discussing transworld identity of *that* object; we are discussing its absence. My position is that the *document-as-institutional-candidate* exists strictly identically, but its status varies. However, let's meet you on inertia. If inertia means the chain of recognition is required for identity, then strict identity theorists must say the object is absent in $W1$. But you claim counterpart theory handles this better. Why? Because you can say it's a "weak counterpart"?

  **Thorne:** Precisely. Because social objects are vague. When does a draft become a constitution? When recognition reaches a threshold. Counterpart theory accommodates vagueness in identity conditions across worlds. Strict identity forces a binary: either the recognition chain is essential (object absent in $W1$) or it is accidental (object present but inert). Inertia suggests it's neither purely essential nor purely accidental; it's a matter of modal momentum. A break in the chain weakens the connection. Counterpart theory models this weakening as a decrease in counterpart strength. Strict identity snaps.

  **Voss:** But that snapping is a feature, not a bug. It preserves the integrity of the institution. If we allow "weak counterparts" to count as The Charter for the sake of modal discourse, we dilute the normative force. If I say, "The Charter could have existed without ratification," I am exploring the modal profile of the *actual* institution. If you say, "A counterpart could have existed," you are exploring the modal profile of a *type* of institution. Institutional inertia demands that we track the specific historical chain. If that chain is absent, the specific institution is absent. I can say that with strict identity: The Charter is absent in $W1$. But I don't need counterpart theory to say it. I just need essentialism.

  **Thorne:** But essentialism is rigid. It doesn't explain why we hesitate. We look at $W1$ and say, "That's almost The Charter, but not quite." Counterpart theory explains the hesitation. It's not that the object is absent; it's that the counterpart relation is contextually suppressed. In a context focusing on physical text, it is a counterpart. In a context focusing on institutional validity, it is not. Strict identity cannot modulate like that. It forces you to decide once and for all whether recognition is essential. Inertia suggests recognition is a gradient of persistence.

  **Voss:** I concede that recognition functions as a gradient in *practice*, but ontology demands precision. If we are to take social objects seriously as entities in our ontology, they must have identity conditions. If institutional inertia means those conditions rely on a chain of recognition, then the chain is part of the essence. If the chain is broken in $W1$, the essence is not instantiated. So, The Charter is not in $W1$. But this conclusion is reachable via transworld identity theory simply by asserting negative existence claims. You don't need to abandon strict identity to accommodate inertia; you just need to accept that some possible worlds do not contain the object. The advantage of my view is that when the object *does* exist across worlds, it is strictly the same, preserving the transworld normative claims we need for legal philosophy.

  **Thorne:** And the advantage of my view is that it respects the intuition that the $W1$ object *is* there, physically and historically, but fails to be *The Charter* solely due to the lack of social momentum. It captures the tragedy of $W1$—that everything was ready, but the social spark was missing—without positing a ghostly entity that exists but isn't recognized. The counterpart is the physical text; the failure is in the relation to the actual institution. Inertia shows that social identity is externally individuated. Strict identity struggles with external individuation across worlds because it privileges the internal or origin-based haecceity.

  **Voss:** Then we disagree on the locus of individuation. I place it in the origin act; you place it in the sustained recognition. Inertia supports you if recognition is constitutive. But if recognition is merely constitutive of *status*, not *objecthood*, then strict identity holds. I maintain that the Assembly created The Charter in $W1$ just as in $W@$; they simply failed to activate it. That activation is relational. You argue the activation is ontological. If inertia proves activation is ontological, then I must concede the object is absent in $W1$. But I still deny I need counterpart theory to describe that absence.

  **Thorne:** You don't need it to describe absence. You need it to describe the *connection* that remains. We still want to say $W1$ is about The Charter. Counterpart theory allows that reference without committing to the existence of The Charter in $W1$. It allows us to navigate the modal space of social objects without inflating our ontology with inert entities or deflating it into nothingness. It finds the middle ground that institutional inertia demands: a momentum that can fade without vanishing entirely into logical contradiction.

  **Voss:** A middle ground that dissolves the subject of the discourse. If I say "The Charter might have failed," I want to be talking about The Charter. You make me talk about a counterpart. For metaphysics of social objects, that distinction is the entire ballgame. I'll keep the strict identity and accept the binary cost; you keep the gradient and accept the ontological deflation.

  **Thorne:** And I'll accept the deflation for the sake of accuracy. Inertia shows social objects are not rigid; our modal talk shouldn't be either.

  ***

  **Meta-Reflective Note**
  (a) My assessment would shift if a robust account of abstract social objects demonstrated that collective recognition constitutes the *type* rather than the *token*, implying that the physical document in $W1$ instantiates the same abstract type regardless of uptake, thereby vindicating Voss's strict identity via type-token relations. (b) The precise point most likely to fail is the coherence of "institutional inertia" itself as a modal primitive; if inertia reduces merely to epistemic uncertainty about recognition thresholds rather than an ontological condition of persistence, Thorne's counterpart-theoretic application becomes an over-complication of a simple essentialist constraint, undermining the dialogue's central tension.
