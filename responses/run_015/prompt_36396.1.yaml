      *   *The Clerk Problem:* Marx acknowledges clerks in *Capital* Vol 3 and *Theories of Surplus Value*. They don't produce surplus value directly, but they help the capitalist realize it. They are exploited in the sense that their unpaid labor time increases the capitalist's profit (by reducing circulation costs), even if they don't produce new value. *Correction/Nuance:* This is a crucial theoretical pivot. If I tell the students "clerks aren't exploited," that's technically debatable in Marxist theory. Marx says commercial workers *are* exploited (their unpaid labor allows the merchant/capitalist to appropriate more surplus value), even if they don't *create* it. However, the prompt asks me to confront the "unproductive labour" wrinkle. I need to be precise here. The Lawyer isn't an industrial capitalist; he's a professional. Bartleby helps him process transactions.
      *   *The Refusal:* Withholding labor power. But it's individual, passive, negative. Not a strike. It's a "general strike" of one.
