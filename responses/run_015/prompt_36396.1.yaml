answer: |-
  This is a sophisticated pedagogical challenge because it asks students to hold two distinct phases of Marx's thought in tension without collapsing them into a generic "Marxism." *Bartleby* is indeed the perfect text for this because it sits in the white collar, service-sector blind spot of *Capital*, while dramatizing the existential crisis of the *1844 Manuscripts*.

  Here is a structured reading for your seminar, designed to keep Alienation and Exploitation distinct, confront the "unproductive labor" wrinkle, and identify where the text resists the theory.

  ### 1. The Core Theoretical Distinction: Alienation vs. Exploitation

  **The Trap:** Students often treat "alienation" as the *feeling* of being exploited.
  **The Correction:**
  *   **Alienation (1844):** An ontological and phenomenological condition. It is about the *relationship* between the worker, the object, and the self. It can exist even if the economic math of surplus value is unclear.
  *   **Exploitation (Capital):** A structural mechanism. It requires the purchase of labor-power and the extraction of surplus value (unpaid labor time).

  **The Reading:** Bartleby is the figure of **Alienation without clear Exploitation.**
  In *Capital*, Marx distinguishes between *productive labor* (which produces surplus value for capital) and *unproductive labor* (paid out of revenue, often service/clerical). The Lawyer is not an industrial capitalist; he processes bonds and mortgages (circulation, not production). Bartleby copies documents.
  *   **The Wrinkle:** If Bartleby is an "unproductive laborer" in the strict sense, he isn't generating surplus value for the Lawyer. So, strictly speaking, the *Capital* model of exploitation misfires.
  *   **The Insight:** The story shows us that **alienation has metastasized beyond the factory.** It has entered the realm of circulation and bureaucracy. Bartleby is alienated not because his surplus value is being stolen, but because his labor is *meaningless* (confirmed by the Dead Letter Office ending). He is alienated from the *product* (he doesn't know what he copies), from the *activity* (mechanical repetition), and from *species-being* (he stops eating/moving). The story suggests that by the mid-19th century, the *experience* of alienation no longer requires the *mechanism* of industrial exploitation to be lethal.

  ### 2. The Refusal: Withdrawal of Labor Power vs. Strike

  **The Question:** Is "I would prefer not to" a political act?
  **The Marxian Expectation:** If labor power is the only commodity the worker owns, withholding it is the ultimate weapon. But Marx expects this to be *collective* (class consciousness).
  **The Textual Reality:** Bartleby's refusal is **singular, passive, and negative.**
  *   It is not a strike (which demands better conditions *within* the system).
  *   It is not sabotage (which attacks the means of production).
  *   It is a **withdrawal of consent.**

  **Seminar Point:** Bartleby does not say "I demand higher wages" or "I demand shorter hours." He says "I would prefer not to." This breaks the contract without proposing a new one. For Marx, this is a dead end; for Melville, it is the only honest response to a system where labor is dead letters. It highlights a gap in Marx: theory predicts collective action, but literature captures the **singularity of despair** that precedes politics.

  ### 3. Turkey and Nippers: The Body under Exploitation

  Use Turkey and Nippers to show what "normal" exploitation looks like, contrasting with Bartleby's "abnormal" refusal.
  *   **Turkey:** Functional morning, broken afternoon.
  *   **Nippers:** Irritable morning, functional afternoon.
  *   **The Dialectic:** Together, they make one perfect working day. The Lawyer manages their bodily decay to ensure continuous production. They represent **exploitation successfully absorbed by the body.** They are alienated, but they keep working.
  *   **Bartleby:** Represents the point where the body *stops* absorbing the cost. He doesn't cycle; he flatlines. If Turkey and Nippers show the *mechanics* of labor power consumption, Bartleby shows the *limit* of that consumption.

  ### 4. Where the Text Resists a Marxian Reading

  Be honest with your students: Marx cannot fully explain this story, and that is productive.

  *   **The Lawyer's Conscience:** The Lawyer is not a ruthless capitalist. He tries to help Bartleby (offers him a clerk job elsewhere, invites him home). A strict base/superstructure model struggles here: why does the "bourgeois" act with benevolence? It suggests ideology isn't just a mask; it's a genuine constraint on the Lawyer's behavior.
  *   **The Dead Letter Office:** If the documents Bartleby copied were destined for destruction anyway, where was the value? If there was no value, there could be no surplus value extraction. This pushes the reading back toward *Alienation* (meaninglessness) and away from *Exploitation* (theft of value).
  *   **"Ah Humanity!":** The final line is a **humanist universalization.** It erases class. It suggests Bartleby's suffering is a condition of *being human*, not being a *worker*. A Marxist reading must critique this as an ideological retreat by the narrator to avoid facing the specific economic violence he participated in.

  ### 5. Does the Story Give Philosophy Something?

  **Conclusion for the Seminar:**
  Yes. Marx provides the anatomy of the system, but Melville provides the **affective residue** that the anatomy misses.
  *   Marx predicts that when labor becomes unbearable, workers will unite to seize the means of production.
  *   Melville shows us a worker who simply opts out of reality.
  *   **The Mismatch is the Point:** The story reveals a form of suffering (ontological despair) that political economy cannot quantify. Bartleby is not just a worker; he is a symptom of a society where social relations have become so reified that the only freedom left is the freedom to starve. Literature captures the *silence* of the worker that theory often speaks over.

  ---

  ### Handout Excerpts

  Put these four passages on the handout. They trace the arc from Labor → Refusal → Bodily Cost → Meaninglessness.

  **1. The Nature of the Labor (Alienation from Product/Activity)**
  > "Imagine my surprise, nay, my consternation, when, without moving from his privacy, Bartleby in a singularly mild, firm voice, replied, 'I would prefer not to.' ... I sat awhile in perfect silence, rallying my stunned faculties... 'What do you mean?' ... 'I would prefer not to copy,' he said, and gently disappeared."
  > *(Look for the description of the work earlier in the text too: "copying rich men's bonds and mortgages... no life of the thing.")*

  **2. The Physical Toll on Co-Workers (Exploitation of the Body)**
  > "In the morning, Turkey's face was of a fine florid hue, but after twelve o'clock, meridian... it blazed like a grate full of Christmas coals... He was apt to be altogether too energetic... At such times, I deemed it prudent to avoid his presence."
  > "With Nippers, the reverse was the case... If, in the morning, he was somewhat irritable... as the day advanced, his irritability decreased... until he became a useful and contented man."

  **3. The Withdrawal of Labor Power (The Refusal)**
  > "Bartleby... did absolutely nothing... He stood staring at the brick wall... 'Do you not see the reason for yourself?' I indistinctly murmured. 'That pale young man,' said the ginger-bread man, 'is he your friend?' 'Yes,' replied I... 'Do you want to get him out?' 'Why, he must be provided for... I want him to go.'"
  > *(Focus on the scene where Bartleby simply stands staring at the wall.)*

  **4. The Dead Letter Office (The Limit of Value)**
  > "Dead letters! does it not sound like dead men? Conceive a man by nature and misfortune prone to a pallid hopelessness, can any business seem more fitted to heighten it than that of continually handling these dead letters, and assorting them for the flames? ... Ah Bartleby! Ah humanity!"

  ---

  ### Which Scene to Open With?

  **Open with Excerpt 3: The Wall / The Refusal.**

  **Why:**
  1.  **Immediate Disruption:** It throws the students straight into the breakdown of the labor contract. It forces the question: "What right does he have to say no?"
  2.  **Visualizing Alienation:** The image of Bartleby staring at the brick wall is the visual anchor of the seminar. It is the perfect image of *alienation from species-being* (a human doing nothing, facing dead matter).
  3.  **Theoretical Hook:** It allows you to ask immediately: "Is this a strike?" If you start with the Dead Letter Office (Excerpt 4), you give away the ending (that the work is meaningless). If you start with Turkey/Nippers (Excerpt 2), you start with economics. Starting with the Refusal centers the *subjectivity* of the worker, which is where the tension between Marx (1844) and Marx (*Capital*) lives.

  **Opening Question for the Class:**
  "Marx argues the worker has only one commodity to sell: their labor power. When Bartleby says 'I would prefer not to,' is he exercising his only freedom, or is he destroying himself? And why does the Lawyer treat this not as a breach of contract, but as a metaphysical crisis?"
