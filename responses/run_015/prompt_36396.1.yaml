      *(Self-Correction on Opening Scene)*: Actually, for a seminar on Marx, starting with the *nature of the labor* is better. The description of the copying. It establishes the "what" before the "stop." Let's suggest the passage describing the work and the wall.

      *(Re-evaluating the "Unproductive Labor" point)*: I need to be precise. In *Capital* Vol 3, Marx discusses commercial workers. They are wage laborers. The capitalist buys their labor power. They do not create surplus value, but they enable the capitalist to realize it. The capitalist pays them less than the value their labor saves him. So they *are* exploited. But Bartleby makes this murky because the work (dead letters) has *no value* to realize. This is the key. The work is *useless*. So exploitation (extraction of value) becomes impossible, but alienation (loss of self) remains. This is the "Alienation without Exploitation" hook.

