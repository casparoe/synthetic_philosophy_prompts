      *   *Alienation:* Bartleby is the purest example. He copies but creates nothing. He stares at the wall (dead matter).
      *   *Exploitation:* The Lawyer is not a factory owner. He lives off fees. Bartleby is "unproductive" in the strict industrial sense but essential for circulation. The exploitation is subtle: the Lawyer tries to own Bartleby's *time* and *presence*, not just his output.
      *   *The Refusal:* It's not a strike (which demands better terms *within* the system). It's a withdrawal of *consent* to the system itself. It breaks the contract without making a counter-demand.
      *   *Turkey/Nippers:* They show the *accommodation* to exploitation. They are dysfunctional but functional enough to keep working. Bartleby is the limit point where accommodation fails.
      *   *Resistance:* The "Dead Letter Office" suggests the work was meaningless from the start (alienation from product taken to the extreme). "Ah Humanity" universalizes the problem beyond class (liberal humanist cop-out?). The Lawyer's conscience shows the ideological superstructure (benevolence) masking the economic base.

  4.  **Selecting Scenes for the Handout:**
      *   Need to show: The nature of the work, the refusal, the physical toll on others, the end.
