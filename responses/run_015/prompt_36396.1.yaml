  6.  **Addressing the "Philosophy vs. Literature" Question:**
      *   Does the story give philosophy something? Yes. Marx analyzes the *system*. Melville analyzes the *subjectivity* that the system produces but cannot account for. Marx predicts collective resistance; Melville shows us the singularity of refusal that precedes politics. The "mismatch" is the point: Literature captures the affective residue that theory smooths over.

