  Subject: Draft Joint Statement (Searle/Dennett Collab)

  Hey Sam,

  Attached below is the latest draft from the adversarial collaboration workshop. We actually managed to get both camps to sign off on the functional descriptions, which is a miracle given the history here. We kept the preamble minimal so we could get straight into the weeds on the Cascade Bitser scenario.

  There's still some friction on the metaphysics (obviously), but we isolated the real disagreements from the verbal ones pretty cleanly in Section 2. Check out the predictions in Section 4—we agreed to revisit this once the actual wetware/silicon hybrid prototypes hit beta.

  Let me know if you think the cruxes are sharp enough. I think we finally pinned down where the "biology" objection actually does work vs where it's just hand-waving.

  Best,
  J.

  ***

  **JOINT WORKING DRAFT: ORIGINAL INTENTIONALITY AND THE CASCADE BITSER**
  **Status:** Pre-publication / Adversarial Collaboration
  **Signatories:** Searlean Biological Naturalism Camp; Dennettian Stance Realism Camp

  ### 1. Agreed Claims and Functional Definitions

  Both camps agree to the following stipulations for the purpose of this collaboration. These definitions describe the *targets* of disagreement, not the resolution.

  1.  **Original Intentionality (OI):** A state has OI if its "aboutness" or content is intrinsic to the system possessing the state, not borrowed from an external interpreter, designer, or user. (Note: Camps disagree on *which* systems possess this).
  2.  **Derived Intentionality (DI):** A state has DI if its content is dependent on the OI of another system (e.g., a map, a sentence, a computer register).
  3.  **The Two-Bitser Architecture:** A simple mechanism (e.g., a vending machine) that enters distinct internal states based on physical input (e.g., slot geometry) to produce an output. Both camps agree the standard Two-bitser possesses only DI, derived from its designers/users.
  4.  **The Cascade Bitser Scenario:** A hypothetical hybrid system consisting of:
      *   **Layer 1 (L1):** A biological predictor (e.g., cortical organoid or living tissue) that forms basic belief-like states about environmental stimuli.
      *   **Layer 2 (L2):** A synthetic predictor (digital/analog computation) that models L1's outputs.
      *   **Feedback Loop:** L2 updates its representations via feedback from L1 and possesses the capacity to send correction signals back to L1 to adjust L1's predictive errors.
      *   **Functional Constraint:** Both camps agree on this functional topology without prejudice regarding the implementation substrate.

  ### 2. Disagreements Table

  The following table isolates residual positions. Each camp phrases their position in their own vocabulary to avoid begging the question.

  | Issue | Searlean Camp Formulation | Dennettian Camp Formulation |
  | :--- | :--- | :--- |
  | **Status of L2** | L2 manipulates syntax without semantics. It simulates understanding but lacks the causal powers constitutive of genuine mental states. | L2 constitutes a "real pattern." If the Intentional Stance yields predictive leverage on L2's behavior, L2 has genuine beliefs, regardless of substrate. |
  | **Source of Content** | Content in L2 is derived from the OI of the engineers who built it and the biological OI of L1 which it monitors. | Content in L2 emerges from the recursive predictive relationship between L1, L2, and the environment. |
  | **The "Hard" Line** | There is a principled, metaphysical distinction between systems with biological causal powers and those without. | There is a pragmatic, gradient distinction based on complexity and the utility of the intentional interpretation. |

  *Note on Verbal Disputes:* Both camps agree that if the term "Original Intentionality" is stripped of metaphysical weight and treated purely as a label for "systems complex enough to warrant the Intentional Stance," the disagreement collapses into a verbal dispute about threshold levels. However, the Searlean Camp insists the distinction is not merely verbal but ontological.

  ### 3. The Cruxes

  We have identified two primary cruxes where empirical or conceptual progress could shift the dialectic.

  **Crux A: Substrate Biology and Aboutness**
  *   **Question:** Is biological substrate necessary for a system to possess states with intrinsic content, or is organizational complexity sufficient?
  *   **Concrete Case:** **The Silicon Swap.** Replace L1 (Biological) with a functionally isomorphic Silicon predictor that maintains the same input/output relations with L2.
  *   **Searlean Prediction:** The system loses OI entirely. L2 becomes purely syntactic because it is no longer coupled to a biological mind. The "aboutness" vanishes because the causal base is gone.
  *   **Dennettian Prediction:** The system retains OI (or rather, genuine intentionality). If the predictive power of the Intentional Stance remains unchanged, the reality of the intentional states remains unchanged. Substrate is irrelevant to the existence of real patterns.

  **Crux B: Stacked Predictive Modeling and Genuine Representation**
  *   **Question:** Can a system that models another system's modeling (L2 modeling L1) cross from "as-if" representation to genuine representation through error-correction fidelity?
  *   **Concrete Case:** **The Pre-emptive Correction.** L2 successfully predicts an error L1 is *about to make* before L1 makes it, and corrects L1's state via feedback, thereby preventing a behavioral failure.
  *   **Searlean Prediction:** This is still just complex error correction. L2 is tracking physical states of L1, not "meanings." L2 has no understanding of *what* L1 is representing, only *how* L1 is firing. It remains derived intentionality.
  *   **Dennettian Prediction:** This capacity demonstrates that L2 has acquired a perspective on L1's world. By correcting L1's "mistakes," L2 treats L1 as an intentional agent. This recursive stance-taking is sufficient for genuine intentionality in L2.

  ### 4. Commitment to Falsification

  Both camps agree that if the Silicon Swap (Crux A) results in a system that is behaviorally indistinguishable from the Bio-Swap but is universally treated by users as having no interiority solely due to substrate knowledge, this supports the Searlean view that biological *phenomenology* matters. Conversely, if users naturally adopt the Intentional Stance toward the Silicon-Swap despite knowing its substrate, this supports the Dennettian view that intentionality is stance-relative.

  Regarding Crux B, if L2 can correct L1 in novel environments neither was explicitly trained for, the Dennettian Camp claims this is evidence of generalized understanding. The Searlean Camp maintains this is evidence only of generalized syntactic manipulation. We agree to log the "novelty gap" metric during testing to see if it correlates with attribution of OI.

  ***

  Let me know if the "Silicon Swap" phrasing works for you—I worried it might be too close to the Chinese Room, but the team thought the L1/L2 coupling makes it distinct enough.

  Talk soon,
  J.
