      *Plan:*
      1.  State the Single Principle: **The Intervention Test.** (Does the split variable exist before the intervention, and does conditioning on it block or reveal the causal path?)
      2.  Simplify into a Decision Tree for the client.
      3.  Audit the 5 cases (Tell them where they were right/wrong).
