      *   **Case 5:** Target Population = Users. Assignment = Random. Slices are post-hoc/small. -> Use Total.

      *Wait, I need to be harder on the user.*
      The user said in Case 1: "I told them the new drug is better, full stop."
      In Case 3: "I won't let the division numbers dissolve the headline gap."
      In Case 4: "I threw out the published total."

      *The Correction:*
      Case 3 is the pivot. In Case 1, 2, 4, 5, there is a clear "Intervention." In Case 3, there isn't a clear intervention on Gender.
      However, the user asks for *one principle*.
      The principle is: **Adjust for Pre-Treatment Differences, Ignore Post-Treatment Differences, unless Transporting.**

      Let's refine this into a "Causal Diagram" lite approach without the jargon.
      **The Rule:** "Trust the subgroup rates if and only if the subgroup is defined *before* the treatment AND the subgroup captures a difference in *susceptibility* or *risk*, NOT a difference in *assignment bias* or *noise*."
      Actually, that's messy.

      Let's go with **The "Before and Stable" Rule.**
      1.  **Timing:** Was the subgroup known *before* the treatment started?
