      *   **Goal:** Wants a *single precise principle* (or two distinct ones if necessary) to resolve these conflicts. Needs to know which of their past verdicts were wrong. Needs a way to distinguish real subgroup effects from noise (Case 5). Needs advice on missing documentation (Case 6a) and noisy proxies (Case 6b).
      *   **Constraints:** No citations or reading lists. Just the rule and the logic. Needs to be actionable for clients.

  2.  **Deconstruct the Five Cases:**

      *   **Case 1 (Hospital Drugs):**
          *   *Scenario:* Observational data. Doctors assign drugs based on severity.
          *   *Data:* New drug looks worse overall (67% vs 86%) but better within severity groups (Severe: 30% vs 15% [Wait, 30% > 15% is better? No, usually recovery rate. Let's check the numbers.]
              *   Severe: New 24/80 (30%), Old 6/40 (15%). New is *better*.
              *   Mild: New 96/100 (96%), Old 285/300 (95%). New is *better*.
              *   Overall: New 120/180 (67%), Old 291/340 (86%). Old looks *better*.
          *   *Mechanism:* Severity is a *confounder* (causes treatment assignment and outcome).
          *   *User's Verdict:* Trust the split (New is better).
          *   *Correct Logic:* Yes. Severity is pre-treatment. We want the causal effect of the drug, controlling for baseline risk.

      *   **Case 2 (Physio Programs):**
          *   *Scenario:* Randomized trial (A vs B).
          *   *Data:* A wins overall (80% vs 70%).
          *   *Split:* Pain-free at week two.
          *   *Mechanism:* "Pain-free" is a *mediator* (caused by the treatment).
          *   *User's Verdict:* Trust the total (A is better).
          *   *Correct Logic:* Yes. Conditioning on a mediator opens collider bias or blocks the causal path. You want the Total Causal Effect.

      *   **Case 3 (University Admissions):**
          *   *Scenario:* Observational (Men vs Women applying).
          *   *Data:* Men win overall (29% vs 17%). Women win within divisions.
          *   *Split:* Division applied to.
          *   *Mechanism:* Division is a *mediator* of sorts (Gender -> Division Choice -> Admission), but also a *confounder* for the specific question of "Is the admission process biased?" vs "What is the overall admission rate?"
          *   *User's Verdict:* Conflicted. Wants to keep the headline gap (discrimination?) but not blame divisions.
          *   *Correct Logic:* This depends on the *question*.
              *   Question A: "Is the university biased against women in its *evaluation criteria*?" -> Trust the split (Division).
              *   Question B: "What is the probability a woman gets admitted compared to a man?" -> Trust the total.
              *   The user says "the gap is the thing I care about." If the gap represents systemic barriers (e.g., women steered into harder divisions), the Total is the truth about *outcome*, but the Split is the truth about *process*.
              *   *Correction:* The user's heuristic ("trust split unless caused by treatment") fails here because "Gender" isn't a "treatment" in the experimental sense, and "Division" is caused by Gender. This is the classic Berkeley Admissions case. The rule needs to distinguish between *direct effect* (split) and *total effect* (total).

      *   **Case 4 (Reading Programs):**
          *   *Scenario:* Published trial (external) vs. Local application.
          *   *Data:* Q wins overall in trial. P wins within subgroups (Weak/Strong).
          *   *Split:* Reader Level (Weak/Strong).
          *   *Mechanism:* Effect Modification (Interaction). The treatment effect *depends* on the subgroup. Also, population shift (60% weak vs 80% strong).
          *   *User's Verdict:* Re-weighted to local population. Trusted the split rates, applied local weights.
          *   *Correct Logic:* Yes. This is *transportability*. The causal mechanism (P is better for strong, Q for weak) is stable, but the population mix changes the aggregate.
          *   *Difference from Case 1:* In Case 1, the weights were biased by doctor choice (confounding). In Case 4, the weights are just different populations (effect modification + transport).

      *   **Case 5 (A/B Test):**
          *   *Scenario:* Large RCT.
          *   *Data:* N wins overall. M wins in tiny slices.
          *   *Split:* Post-hoc slicing (40 ways).
          *   *Mechanism:* Multiple testing / Noise.
          *   *User's Verdict:* Ignore slices.
          *   *Correct Logic:* Yes. Pre-specification matters. Small sample sizes in slices mean high variance.

  3.  **Synthesize the Principle:**

      The user's current rule ("Trust split unless caused by treatment") is 80% there but conflates *Confounding* with *Effect Modification* and *Mediation*.

      The core distinction is **Causal Structure**.
      1.  **Confounder:** Variable causes Treatment AND Outcome. (Case 1). *Action:* Control for it (Trust Split/Adjusted).
      2.  **Mediator:** Variable is caused by Treatment and causes Outcome. (Case 2, Case 3 partially). *Action:* Do not control (Trust Total) if you want Total Effect. Control if you want Direct Effect.
      3.  **Effect Modifier:** Variable changes *how* Treatment works. (Case 4). *Action:* Trust Split, but re-weight for target population.
      4.  **Noise:** Variable is irrelevant or slices are too small. (Case 5). *Action:* Trust Total.

      *The Unifying Principle:* **The "Pre-Treatment & Causal Stability" Rule.**
      *   Step 1: Is the splitting variable determined *before* the treatment/assignment?
