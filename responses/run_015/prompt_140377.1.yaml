      *Let's finalize the Rule.*
      **The "Before and Cause" Rule.**
      1.  **Before:** Was the subgroup characteristic known/fixed *before* the treatment started?
          *   No -> Trust the Total. (Case 2, 5).
          *   Yes -> Go to 2.
      2.  **Cause:** Does the subgroup characteristic *influence* who got the treatment (Confounding), or does the treatment effect *depend* on the subgroup (Interaction)?
          *   Yes (Confounding or Interaction) -> Trust the Subgroup Rates. (Case 1, 4).
          *   No (It's just a label) -> Trust the Total.
      3.  **Weighting:** If trusting Subgroup Rates, how do you combine them?
          *   To find *Truth of Mechanism* (Case 1): Weight by the *combined* population (remove assignment bias).
          *   To find *Prediction for New Group* (Case 4): Weight by the *new* population.
