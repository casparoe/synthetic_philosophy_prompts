          *   Changes (Interaction): Trust the Split rates, but apply *your* population weights. (Case 4).
      *   Step 3 (The Case 3 Exception): If the "Treatment" is an immutable characteristic (Gender) and the "Split" is a choice caused by that characteristic (Major), the Total represents the *systemic outcome*, the Split represents the *process fairness*. You must choose the question.

      *Refining the Rule for the User:*
      The user wants *one* rule. The most robust single rule is based on **Counterfactual Prediction**.
      "Which number predicts what happens if I intervene?"

      *   Case 1: If I force the drug, what happens? I need to adjust for severity. -> Split.
      *   Case 2: If I force the program, what happens? Pain status is part of the result. -> Total.
      *   Case 3: If I force Gender (impossible), or if I ask "Is the process fair?" -> Split. If I ask "What is the disparity?" -> Total.
      *   Case 4: If I implement Program P in *my* district, what happens? -> Split rates + My weights.
      *   Case 5: If I roll out N, what happens? -> Total (slices are noise).

      *Let's try to formulate a strict decision tree.*
      The user's heuristic failed on Case 3 because "Gender" isn't a treatment you can randomize, and "Division" is a *choice* influenced by Gender.
      It failed on Case 4 because they need to know *why* they are re-weighting (Transportability vs Confounding).

      *Proposed Rule:* **The Intervention Rule.**
      "Calculate the rate that answers: 'If I assign the treatment to a new person drawn from [Target Population], what is the probability of success?'"

      *   **Case 1:** Target Population = All patients. Assignment = Doctor chooses (observational). To estimate causal effect of Drug, we must simulate random assignment. We must balance Severity. -> Use Split (Adjusted).
      *   **Case 2:** Target Population = Patients. Assignment = Random. Split variable (Pain) is a result of assignment. Conditioning on it blocks the effect. -> Use Total.
      *   **Case 3:** Target Population = Applicants. Assignment = Self-selection (Gender).
