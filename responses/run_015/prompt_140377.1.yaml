answer: |-
  You are not collapsing two questions; you are collapsing **three**. The confusion arises because "Which number is right?" depends entirely on "What decision are we making?"

  There is one principle that covers all five cases, but it requires you to classify the *splitting variable* before you look at the numbers.

  ### The Principle: The Intervention Test

  Do not ask "Which average is real?" Ask: **"If I intervene to assign the treatment to a new person, which number predicts the outcome?"**

  To answer this, run the splitting variable through this three-step filter. If it fails any step, trust the Total. If it passes all three, trust the Subgroup Rates (but weight them carefully).

  1.  **Timing:** Was the subgroup characteristic fixed *before* the treatment started?
  2.  **Causality:** Is the subgroup characteristic a *cause* of the outcome (risk/susceptibility) or a *result* of the treatment (mediator)?
  3.  **Stability:** Is the relationship between the subgroup and the outcome stable across populations, or is it noise?

  ### The Decision Rule for Clients

  Give this flowchart to your clients. It forces them to define the variable before they see the paradox.

  *   **Q1: Did we know this about the patient/user BEFORE we assigned the treatment?**
      *   **NO:** (e.g., pain status at week 2, post-hoc data slices). **STOP.** Trust the **Total**. Splitting here creates fake patterns.
      *   **YES:** Go to Q2.
  *   **Q2: Did this characteristic influence WHO got the treatment?**
      *   **YES:** (e.g., doctors assigning drugs by severity). **Trust the Subgroup Rates.** The Total is biased by assignment policy. *Weight the subgroups by the total population to find the true drug effect.*
      *   **NO:** (e.g., randomized trial, or inherent trait like gender). Go to Q3.
  *   **Q3: Does the treatment work DIFFERENTLY depending on this characteristic?**
      *   **YES:** (e.g., reading program works better for strong readers). **Trust the Subgroup Rates.** *Weight the subgroups by YOUR target population to forecast local results.*
      *   **NO:** (e.g., the effect is the same, but the groups are different sizes). **Trust the Total.** The split adds noise without insight.

  ---

  ### Audit of Your Five Cases

  Here is where your verdicts stand against this rule.

  **Case 1 (Hospital Drugs): You were Right, but qualify "Full Stop."**
  *   **Variable:** Severity.
  *   **Filter:** Pre-treatment? **Yes.** Influenced assignment? **Yes.**
  *   **Verdict:** Trust Subgroup Rates. The Total is confounded by doctor behavior.
  *   **Correction:** Do not say "New drug is better, full stop." Say "New drug is biologically superior, but under current prescribing habits, the Old drug yields better population outcomes." If they buy the New drug without changing prescribing habits, the Total (67%) is the number they will actually see. You sold them *efficacy*; they need to know *effectiveness*.

  **Case 2 (Physio Programs): You were Right.**
  *   **Variable:** Pain-free at week two.
  *   **Filter:** Pre-treatment? **No.** (It is a result of the therapy).
  *   **Verdict:** Trust the Total. Splitting on a result blocks the causal path. Program A might reduce pain *which causes* recovery. If you hold pain constant, you hide Program A's mechanism.

  **Case 3 (Admissions): You are Asking Two Questions.**
  *   **Variable:** Division applied to.
  *   **Filter:** Pre-treatment? **Yes.** Influenced by "treatment" (Gender)? **Yes.** (Gender influences Division choice).
  *   **Verdict:** This is the exception. Gender is not an assignable treatment.
      *   Question A: "Is the admissions *process* biased?" -> Trust the **Split**. (Women win in both divisions).
      *   Question B: "What is the *outcome disparity* for applicants?" -> Trust the **Total**. (Men win overall).
  *   **Correction:** You cannot hold both stances comfortably. If you say "There is a gap" (Total) but "No division is biased" (Split), you are admitting the gap is caused by *pipeline choices* (women choosing harder divisions), not *evaluation bias*. That is a valid finding, but you must state it explicitly. Do not let the headline gap stand without explaining it is driven by application choice, not grading bias.

  **Case 4 (Reading Programs): You were Right.**
  *   **Variable:** Reader Level.
  *   **Filter:** Pre-treatment? **Yes.** Influenced assignment? **No** (Randomized trial). Effect differs? **Yes** (Interaction).
  *   **Verdict:** Trust Subgroup Rates. This is **Transportability**. The causal mechanism (P is better for strong readers) is stable. The population mix is not. Re-weighting to your district's 80% strong readers is the only way to predict local success.
  *   **Why it differs from Case 1:** In Case 1, you re-weighted to remove *bias*. In Case 4, you re-weighted to match *reality*. Both require using Subgroup Rates, but the weights come from different places (Study Total vs. Your Population).

  **Case 5 (A/B Test): You were Right.**
  *   **Variable:** Post-hoc slices.
  *   **Filter:** Pre-treatment? **Mostly No/Unknown.** Stability? **No** (Small N).
  *   **Verdict:** Trust the Total. This is multiple testing noise. Unless the slice was pre-registered and large, it fails the Stability test.

  ---

  ### The Two Cases You Are Dodging

  **(a) The Missing Documentation (Pre or Post?)**
  *   **Rule:** If you cannot prove the variable was measured *before* treatment, **Trust the Total.**
  *   **Why:** Conditioning on a post-treatment variable (mediator/collider) creates mathematical artifacts that can reverse causality. Conditioning on a pre-treatment variable (confounder) usually just reduces variance or removes bias. The risk of lying with the Split is higher than the risk of hiding nuance with the Total.
  *   **Client Script:** "Without proof this data existed before the intervention, splitting it risks attributing the treatment's effects to the subgroup. We must report the overall result."

  **(b) The Noisy Proxy (70% Accurate Severity Score)**
  *   **Rule:** If the splitting variable is a noisy proxy for a confounder, **Trust the Total (with a caveat).**
  *   **Why:** Noisy adjustment is often worse than no adjustment. If you split by a severity score that is wrong 30% of the time, you leave "residual confounding" inside the subgroups. You think you've fixed the bias, but you haven't.
  *   **Client Script:** "This score is too inaccurate to cleanly separate the groups. Adjusting for it gives a false sense of precision. We will report the Total, but note that unmeasured severity may be hiding the true effect."

  ### Summary for Your Clients

  When you see the Total and Subgroups disagree:

  1.  **Check the Clock:** If the subgroup happened *after* the treatment started, ignore the subgroups. (Cases 2, 5).
  2.  **Check the Choice:** If the subgroup determined *who got the treatment*, ignore the Total. Use subgroup rates weighted by the total population. (Case 1).
  3.  **Check the Fit:** If the treatment works *differently* for the subgroup, ignore the Total. Use subgroup rates weighted by *your* population. (Case 4).
  4.  **Check the Identity:** If the "treatment" is an identity (Gender/Race) and the subgroup is a choice (Major/Department), the Total is the *Systemic Reality* and the Subgroup is the *Process Fairness*. Report both, but do not claim they measure the same thing. (Case 3).

  Drop the "full stop" in Case 1. Clarify the "two questions" in Case 3. Everywhere else, your intuition was correct, but now you have the test to prove it.
