      "What would happen if I intervened?"
      *   Case 1: If I assign Drug New to *everyone*, what happens? (Requires adjusting for severity). -> Split.
      *   Case 2: If I assign Program A to *everyone*, what happens? (Pain is a result). -> Total.
      *   Case 3: If I assign Gender... (Impossible).
