      If the question is "Bias in evaluation," you must look at the Split (Direct Effect).
      If the question is "Inequality in outcome," you look at the Total (Total Effect).
      I will tell the user they are collapsing two questions here.

      *Addressing 6a (Missing Doc):*
      If you don't know if it's Pre or Post, you can't apply the rule.
      Default: Trust Total. Why? Because Post-Treatment conditioning is dangerous (collider bias). Pre-Treatment conditioning is usually safe (or at least interpretable). Err on the side of Total.

      *Addressing 6b (Noisy Proxy):*
      If the split variable is noisy (70% accurate), you are introducing measurement error.
      This attenuates the subgroup differences.
      If it's a Confounder (Case 1 type): Noisy adjustment leaves residual confounding. Trust Total is safer, or acknowledge uncertainty.
      If it's an Effect Modifier (Case 4 type): Noisy split blurs the interaction.
