  Progress in this seminar will not come from introducing more standard normative cases, as these are already absorbed by both frameworks. Instead, progress requires a targeted thought experiment that forces a divergence in verdicts by targeting the metaphysical commitments directly. The seminar must move from asking "What should the agent do?" to "Where does the authority to demand action reside?" A conceptual distinction between *reason-generation* and *reason-integration* is necessary, but insufficient; the group needs a case where the two metaphysical models yield different normative outputs. Until such a case is found, the disagreement remains substantive but empirically underdetermined.

  The "deferred preference revelation" framing is the precise tool needed to illuminate this substantive divide. In this scenario, the Additive view must claim that the reason generated at T1 survives the preference shift at T2 as an external normative entity binding the future self. The Reconfigurative view must claim that the promise binds the present self to constrain future options, meaning the obligation at T2 is a function of the T1 self's structural constraint on the T2 self, not an independent reason surviving the shift. This case favors the **Additive view** if the group agrees that the future self is bound *even if* the structural relationship between selves is severed or radically altered, implying the reason exists independently of the agent's configuration. Conversely, it favors the **Reconfigurative view** if the binding force dissolves when the structural continuity of the agent's rational planning is disrupted, implying the obligation is internal to the agent's diachronic coherence. This framing transforms the stalemate from a verbal dispute about "weights" into a substantive test of diachronic normative ontology.

