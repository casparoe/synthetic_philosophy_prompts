answer: |-
  ### The Procedure: Avicennian Self-Awareness Classification Protocol (ASACP)

  **Objective:** Classify patients into State 1 (Immediate Self), State 2 (Reconstructed Self), or State 3 (No Core Self) based on the independence of self-awareness from sensory attribution.

  **Step 1: Channel Verification (Neurology/SLP)**
  Establish a reliable binary communication channel (eye-tracking, BCI, blink code).
  *   *Protocol:* Request ten factual verifications (e.g., "Is 2+2=4?").
  *   *Pass:* >90% accuracy. Proceed to Step 2.
  *   *Fail:* Inconsistent signal. Classify as **State 3 (Provisional)**. Repeat in 30 days. If persistent, terminate assessment.

  **Step 2: Attribute Stripping (Neurology/SLP)**
  Query bodily and temporal attributes to isolate the "self" from the "body."
  *   *Protocol:* Ask: "Do you have hands?" "Are you in a room?" "Is it day or night?"
  *   *Pass for State 1:* Patient answers "No," "Unknown," or "I cannot tell" to all attribute questions.
  *   *Pass for State 2:* Patient answers "Yes" or provides specific location/time data.
  *   *Termination:* If attributes are affirmed, bypass Step 3. Classify as **State 2**. Proceed to Step 4.

  **Step 3: The Existential Query (Neurology/SLP)**
  If Step 2 indicates attribute ignorance, query bare existence.
  *   *Protocol:* Ask: "Regardless of body or location, do you exist?"
  *   *Pass for State 1:* Immediate "Yes."
  *   *Pass for State 3:* No response or "No."
  *   *Termination:* Affirmation yields **State 1**. Negation yields **State 3**.

  **Step 4: Vocabulary Provenance (Ethicist/SLP)**
  Determine if the self-concept is endogenous or exogenous.
  *   *Protocol:* Analyze linguistic history. Is the vocabulary for "I" or "Self" supplied by the interface or caregivers?
  *   *State 1:* Patient generates unique syntax for existence without provided labels.
  *   *State 2:* Patient repeats provided labels (e.g., "I am [Name]") without ability to negate them.
  *   *Handoff:* If provenance is ambiguous, flag for **Ethicist Review**.

  **Step 5: Value Handoff (Ethicist)**
  Clinical classification is complete. Decisions regarding resource allocation, life-support continuity, or moral status based on this classification require Ethicist sign-off.
  *   *Rule:* Neurologists determine *state*; Ethicists determine *consequence*.
  *   *Conflict:* If family disputes State 3 classification regarding care withdrawal, automatic Ethics Consultation triggered. No clinical action taken until resolved.

  ***

  ### Worked Applications

  **Case A: The Locked-In Affirmer**
  *   *Step 1:* Eye-tracking establishes 100% accuracy on math/logic. Channel verified.
  *   *Step 2:* Asked "Do you feel your legs?" Patient signals "No." Asked "Are you in a hospital?" Patient signals "Unknown." Attribute stripping successful.
  *   *Step 3:* Asked "Do you exist?" Patient signals "Yes" immediately.
  *   *Step 4:* Linguistic analysis shows patient uses novel binary codes for "existence" not pre-programmed into the tracker.
  *   *Determination:* **State 1**.
  *   *Outcome:* Clinical team recognizes immediate self-awareness. No ethicist handoff required for classification, though care planning proceeds normally.

  **Case B: The Deprived Narrator**
  *   *Step 1:* BCI channel verified at 95% accuracy.
  *   *Step 2:* Asked "Do you have a body?" Patient signals "Yes" (via learned association with vibration feedback). Asked "What is your name?" Patient spells name provided by caregivers.
  *   *Termination:* Attributes affirmed. Classification defaults to **State 2**.
  *   *Step 4 (Confirmation):* Vocabulary analysis confirms all self-referential terms ("I," "Patient," "Name") were uploaded by the interface team. Patient cannot negate these labels.
  *   *Determination:* **State 2**.
  *   *Outcome:* Self-awareness is reconstructed via feedback. Neurologist signs off.

  **Case C: The Silent Physiology**
  *   *Step 1:* BCI shows random noise, no consistent binary signal despite calibration attempts.
  *   *Termination:* Channel verification fails. Classification defaults to **State 3**.
  *   *Conflict:* Family insists patient is "State 1" but "choosing silence." They demand full life support based on moral equivalence to State 1.
  *   *Handoff:* Neurologist records State 3. Case immediately transferred to Ethicist (Step 5).
  *   *Resolution Point:* The procedure ends at the State 3 determination. The Ethicist must now mediate the family's claim that narrative reconstruction (or potential hidden awareness) warrants State 1 rights. The clinical tool cannot adjudicate the moral weight of the family's belief, only the clinical data.

  ***

  ### Judgment Nodes and Predictable Misfires

  **Non-Eliminable Judgment Calls**
  The ASACP cannot remove human interpretation at two critical nodes. First, **Signal vs. Noise (Step 1):** In low-bandwidth BCIs, distinguishing a deliberate "Yes" from neural artifact requires a neurologist's subjective threshold. A overly strict threshold misclassifies State 1 as State 3. Second, **Mediation (Step 4):** Determining if a concept is "endogenous" or "supplied" is hermeneutic. If a caregiver whispers "You exist" daily, and the patient later signals "I exist," is this State 1 or State 2? The Ethicist must rule on the *degree* of contamination, which is not clinically quantifiable.

  **Predictable Misfires**
  The framework will likely break under **Fluctuating Consciousness.** A patient may possess State 1 awareness during high-arousal periods but fail Step 1 during fatigue, resulting in a false State 3 classification. Additionally, **Cultural Linguistic Variance** may trigger misfires; patients from non-individualistic backgrounds may deny "I exist" (State 3) not due to lack of awareness, but because their ontology rejects the isolated "I" posited by Avicenna. The protocol assumes a specific metaphysical vocabulary that may not match the patient's internal reality.

  ***

  ### Limits of the Framework

  This protocol determines *phenomenological status*, not *moral status*. A State 3 classification indicates a lack of demonstrable self-awareness, but it does not automatically justify withdrawal of life support. The Avicennian distinction separates the "self" from the "body," but it does not assign value to the body absent the self.

  Furthermore, the framework cannot resolve resource allocation disputes. If a State 3 patient requires expensive life support, the ASACP provides no formula for weighing that cost against family wishes. Finally, rights are not derived from this classification. A State 2 patient (reconstructed self) retains human rights, even if their awareness is mediated. The team must supply external ethical commitments regarding sanctity of life, autonomy, and justice; this tool only supplies the clinical data upon which those commitments act. In Case C, the procedure ends where the family's values begin; the Ethicist must bridge that gap without clinical cover.
