    "issue_label": "The Problem of Phenomenal Ownership",
    "core_tension": "Without a convergence mechanism, modality-specific drafts lack a unifying locus, rendering experiences 'ownerless' and threatening the coherence of the subject itself.",
    "distinction_from_binding": "Binding concerns how features form unified objects, whereas this issue concerns how experiences form a unified subject.",
    "assessment_for_denett": "Weakens the view's phenomenological adequacy unless one accepts full eliminativism regarding the subject.",
    "diagnostic_case": "A patient who correctly identifies a painful stimulus and verbally reports pain, but demonstrates no behavioral or emotional integration linking the pain to their own body schema (e.g., failing to protect the injured limb despite acknowledging hurt)."
  }
