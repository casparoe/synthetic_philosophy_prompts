answer: |-
  Here is an analysis of the boundary problem applied specifically to your friend's situation in the Gulf state.

  ### 1. The Puzzle Restated
  The boundary problem asks: In a system defined by "rule by the people," how do we define "the people" without already assuming the answer? To hold a democratic vote on who gets to vote, you must first decide who is eligible to cast a ballot in that decision. If the current citizens decide, the boundary is set by an exclusive group; if the residents decide, the boundary is set by a group that includes non-citizens.

  In your friend's case, this is not a theoretical loop but a concrete political reality. The "demos" (the citizens) is a small minority of the total population. The boundary is drawn tightly around ethnicity or lineage rather than residence. The puzzle implies that the legitimacy of the state's decisions rests on a definition of membership that the excluded majority (including your friend) had no hand in creating. The circularity is this: the only group authorized to change the membership rules is the group that benefits from keeping them exclusive.

  ### 2. Resolutions and Their Specific Implications

  Here are the four main ways political theorists attempt to resolve the boundary problem, applied directly to your friend's status and the question of who holds the power to change the rules.

  #### A. The Principle of Territorial Connection (Residence)
  **The Theory:** This approach argues that the demos should include everyone subject to the state's laws and coercion within its territory. If you live there, work there, and are bound by its rules, you should have a voice in making them.
  **Implication for Your Friend:** Under this resolution, your friend is being treated unjustly. He was born in the territory, has lived there for fifty years, and is subject to the state's laws and the discretion of its sponsors (*kafala* system). His entire life is shaped by this political authority. Therefore, the boundary *ought* to be drawn around residency, not ancestry. He should be a voting citizen.
  **Who Decides the Rules?** This creates a stark conflict. If the territorial principle is correct, the current citizen minority has no moral right to decide the membership rules alone, because they are imposing rules on a governed majority without their consent. However, procedurally, they are the *only* ones with the legal power to change the law.
  **The Implication:** This resolution implies that the current system is fundamentally undemocratic, regardless of how fairly citizens vote among themselves. It suggests that reform cannot come from within the normal democratic procedures of the state, because those procedures are rigged by the boundary itself. It implies your friend's claim to membership is valid *prior* to any vote, meaning the current citizens are effectively an occupying legislature governing a disenfranchised population.

  #### B. The Principle of Cultural or National Identity (Ethnos)
  **The Theory:** This approach argues that democracy is not just about managing a territory, but about a specific community ("nation") ruling itself. The boundary is drawn around shared history, language, religion, or lineage. The state exists to protect the self-determination of this specific group.
  **Implication for Your Friend:** This resolution justifies his exclusion. Even though he was born there, if the state defines itself as the homeland of a specific tribal or national lineage (as many Gulf states do), your friend is not part of that "self." He is a guest, not a member of the national family. His lack of voting rights is not a bug of the system, but a feature designed to preserve the character of the ruling nation.
  **Who Decides the Rules?** The existing citizens are the sole legitimate deciders. They are the guardians of the ethnos. They have the right to determine who shares their identity and who does not.
  **The Implication:** This resolves the circularity by admitting the state is not a universal democracy for all residents, but an ethnostate. For your friend, the implication is that he has no democratic claim to membership, only a human rights claim to fair treatment as a resident. It shifts the debate from "who gets to vote" to "what rights do non-members deserve?" It implies that asking for the vote is asking the state to cease being what it claims to be (a nation-state for a specific people) and become something else (a civic state for all residents).

  #### C. The Principle of Consent of the Governed
  **The Theory:** Legitimacy arises from a social contract. Individuals consent to be governed in exchange for protection and order. Usually, this consent is signaled by residency or acceptance of benefits.
  **Implication for Your Friend:** This is ambiguous in his case. On one hand, he has remained in the country for 50 years, utilizing its infrastructure and security, which could be interpreted as tacit consent to the rules, including his non-voting status. On the other hand, if his ability to leave is constrained by economic necessity or lack of citizenship elsewhere (statelessness risks), his "consent" is coerced.
  **Who Decides the Rules?** The state offers the terms of the contract (residency permits); the individual accepts or rejects them. The current citizens, as the principals of the state, set the terms.
  **The Implication:** This implies your friend is in a contractual relationship, not a membership relationship. He consents to *rule*, but not to *rule-making*. The boundary problem here highlights the difference between liberal rights (protection under law) and democratic rights (making the law). The implication is that your friend's grievance is not that he is unfree, but that he is a permanent contractor rather than a partner. It suggests that unless he can negotiate a new contract (citizenship), his obligation to obey is based on benefit received, not political agency.

  #### D. The Principle of the Existing Democratic Order (Proceduralism)
  **The Theory:** This approach sidesteps the moral question and says the "people" are simply whoever the current constitution says they are. Democracy is a procedure that operates *within* boundaries, not a tool to *set* them.
  **Implication for Your Friend:** He is definitively out. The system is "democratic" relative to the citizen body, even if that body is 10% of the population. The boundary is a brute fact, not a philosophical problem to be solved.
  **Who Decides the Rules?** The current demos (the citizens) decides, using the amendment procedures already in place.
  **The Implication:** This is the reality your friend faces. It implies that the boundary problem is a "one-way ratchet." The current citizens can vote to include others, but others cannot vote to include themselves. The specific implication for the Gulf state is that the minority citizenry holds a "constituent power" that is permanently locked. For your friend to gain a voice, the current voters must vote to dilute their own wealth and political power. The boundary problem here reveals that democratic procedures can entrench oligarchy if the initial boundary is exclusive.

  ### 3. Synthesis: The Implication of the "Who Decides" Question

  The most critical implication of the boundary problem for your friend concerns the **mechanism of reform**.

  In a standard democracy, if a group feels excluded, they can campaign, vote, and change the laws. In your friend's context, the boundary problem creates a **lock-in effect**. Because the decision about "who the people are" is reserved for the current "people" (the citizen minority), the system lacks an internal mechanism to correct its own exclusions.

  *   **If you accept the Territorial view:** The state is illegitimate until it enfranchises residents like your friend. But since only citizens can enfranchise them, the state is stuck in illegitimacy unless the citizens act against their own self-interest.
  *   **If you accept the National Identity view:** The state is legitimate, but your friend must accept he will never belong politically.
  *   **If you accept the Procedural view:** The state is legitimate, but it implies that democracy is compatible with permanent minority rule over a majority population, provided the minority follows its own internal voting rules.

  **The Concrete Implication:**
  The boundary problem implies that for your friend's situation to change, **external pressure or non-democratic constitutional moments are required.** Since the internal democratic logic is circular (only the excluded can demand inclusion, but only the included can grant it), the boundary cannot be moved by normal politics. It requires either:
  1.  **Elite Benevolence:** The current citizens voluntarily choosing to expand the demos (unlikely given the wealth disparity).
  2.  **External Norms:** International pressure or human rights frameworks that impose boundaries from the outside (e.g., treaties requiring residency rights).
  3.  **Constituent Rupture:** A re-founding of the state where the "people" are redefined outside the existing legal order.

  For your friend, the boundary problem means that his lack of a vote is not an oversight; it is the foundational logic of the state. The puzzle implies that he cannot "win" this argument using the state's own democratic language, because that language presupposes he is not part of the "we" who is speaking. He is asking the system to question its own existence, and the system is designed to prevent exactly that.
