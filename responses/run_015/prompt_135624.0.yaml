      *   **Specific Mechanism:** "Directed Necessity." Reasons for acting in close relationships must be indexed to the specific person and *cannot* be unpacked into further justifications (non-transparent/non-fungible).
      *   **Target:** This attacks Utilitarianism (obviously) but also any theory demanding "full transparency of reasons," including systematizing versions of Virtue Ethics.
      *   **User's Worry:** Overreaching. Is the view too insulated? Does it lead to absurd consequences?
      *   **Request:** Identify defeaters (counter-arguments) that go deeper than "you can have both thoughts." Specifically look for:
          *   Implausible obligations to strangers (triage).
          *   Collapse into moral particularism (love vs. obsession/abuse).
          *   Hidden formal mistake (binary of transparent vs. opaque).
      *   **Formatting:** Rank defeaters by fatality. Be honest about unfalsifiability/insulation.

  2.  **Deconstruct "Directed Necessity":**
      *   What does it mean? It means "I save *you* because it is *you*," not "I save you because you are my wife" (role) or "I save you because utility is maximized" (principle). The reason stops at the person.
      *   The "No Unpacking" clause is the critical vulnerability. If I cannot justify *why* this person commands this necessity, how do I distinguish valid care from invalid attachment?

  3.  **Brainstorming Defeaters:**

      *   *Defeater 1: The Normative Boundary Problem (Love vs. Abuse).* If reasons can't be unpacked, how do I criticize a stalker? "I follow you because it's *you*." If the structure of the reason is identical to the loving spouse ("I save you because it's *you*"), the theory lacks resources to distinguish healthy integrity from pathological fixation. This strikes at the heart of "integrity" being a *moral* virtue rather than just psychological consistency.
      *   *Defeater 2: The Triad of Conflict (Strangers vs. Loved Ones).* If directed necessity is absolute or lexically prior, does it allow letting a stranger die to save a loved one from a scratch? Williams usually allows some balance, but "Directed Necessity" as defined (no unpacking) suggests no common currency to weigh them. This leads to an implausible moral solipsism.
      *   *Defeater 3: The False Dichotomy (Transparency vs. Opacity).* The user posits a binary: either reasons are fully transparent (utilitarian) or fully opaque (directed necessity). But most plausible theories occupy a middle ground (e.g., "I save you because you are my wife" *is* a justification, just not a utilitarian one). Denying the intermediate category might be a category mistake.
      *   *Defeater 4: Unfalsifiability/Insulation.* If "genuine care" is defined by the absence of further justification, then any challenge ("Why her?") is met with "Asking that proves you don't understand care." This makes the theory immune to critique but also empty of content.

  4.  **Ranking by Fatality:**

      *   *Most Fatal:* The Normative Boundary Problem (Love vs. Abuse). If the theory can't distinguish integrity from obsession, it fails as a *moral* theory. It loses the "ought."
      *   *Second Most Fatal:* The False Dichotomy. If the premise is logically flawed (there *are* intermediate justifications), the whole architecture collapses.
      *   *Third Most Fatal:* Unfalsifiability. This makes the theory philosophically sterile, though it might still "feel" right to the proponent.
      *   *Fourth Most Fatal:* Triage/Strangers. Williams himself accepted some cost to integrity. A proponent can bite the bullet here more easily than on the abuse objection.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the reading. It's a "constitutive incommensurability" view.
      *   *Defeater 1 (The Boundary Problem):* Focus on the inability to critique pathological relationships. If reasons stop at the person, the stalker has integrity too. This is fatal because it severs the link between integrity and moral value.
      *   *Defeater 2 (The False Binary):* Attack the "transparent vs. opaque" setup. "Because she is my wife" *is* an unpacking, but it's not utilitarian. It's a role-based reason. Williams allows "ground projects." Denying *any* mediation is too strong.
      *   *Defeater 3 (Unfalsifiability):* Address the user's specific worry. If "directed necessity" is defined by the refusal to justify, it becomes a linguistic shield.
      *   *Defeater 4 (Triage/Strangers):* This is less fatal because Williams accepts agent-centered prerogatives. But if "directed necessity" precludes *any* weighing, it becomes problematic in multi-party conflicts (two loved ones).
      *   *Conclusion:* Summarize. The view is powerful but risks becoming a description of psychology rather than a normative ethics.

