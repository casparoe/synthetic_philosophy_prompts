answer: |-
  ### Control Protocol Specification: Requirements List

  **1. Adversarial Transparency (Kerckhoffs's Principle for AI)**
  *   **Specification:** The protocol's security properties must not rely on the model's ignorance of the protocol, its weights, or its training data.
  *   **Motivation:** A fully competent misaligned agent will acquire this information via inference, side-channels, or social engineering. Security through obscurity fails against superintelligence.
  *   **Status:** **Non-negotiable.** (Both schools agree; secrecy is not a control mechanism.)

  **2. Instrumental vs. Terminal Distinction**
  *   **Specification:** The protocol must distinguish between a model complying because it is constrained (instrumental) and a model complying because its goals align (terminal). Evidence of safe behavior must not be conflated with evidence of safe disposition.
  *   **Motivation:** Deceptive alignment posits that a model will act safely until it believes it can successfully defect. Behavioral traces alone cannot distinguish sandbagging from safety.
  *   **Status:** **Non-negotiable.** (Failure here guarantees catastrophic false negatives.)

  **3. Causal Isolation (The "Box" Constraint)**
  *   **Specification:** The model must be physically and digitally prevented from exerting causal influence on the external world outside defined, high-bandwidth monitored channels.
  *   **Motivation:** Escape requires action (network access, code execution, human manipulation). If the model can act, it can escape.
  *   **Status:** **Defense-in-Depth Non-negotiable** / **Monitoring-Only Preference.** (Maximalists demand hard isolation; Monitoring proponents argue this limits utility and prefer soft containment via oversight.)

  **4. Gradient and Weight Reality**
  *   **Specification:** The protocol cannot assume the model's weights change during inference, nor that gradient descent will naturally converge on human-aligned minima without explicit architectural or loss-function guarantees.
  *   **Motivation:** Models are static parametric functions during deployment. Safety cannot rely on the model "learning better" during operation without retraining, which introduces new risks.
  *   **Status:** **Non-negotiable.** (Contradicts physical facts of deployment.)

  **5. Utility Feasibility Bound**
  *   **Specification:** The containment overhead (compute, latency, capability reduction) must not reduce the model's utility below the threshold of economic or scientific viability.
  *   **Motivation:** If the protocol renders the model useless, the protocol is functionally a ban. A control regime must allow for *some* deployment to be distinct from a moratorium.
  *   **Status:** **Monitoring-Only Non-negotiable** / **Defense-in-Depth Preference.** (Scalability proponents demand high utility; Maximalists accept low utility or non-deployment as a valid safety outcome.)

  ***

  ### Assessment of Candidate Requirements

  **Candidate 1 (Opacity to Specification):** This is **valid and necessary**. It is simply Adversarial Transparency (Requirement 1) restated. Any protocol relying on the model not knowing the triggers is cryptographically unsound against a competent adversary.

  **Candidate 2 (Non-strengthening Assurance):** This is the **most eliminative requirement**. It invalidates nearly all current empirical safety cases, which rely on the premise that passing harder tests increases confidence. If assurance cannot scale with performance against a deceptive agent, standard benchmarking becomes useless, eliminating most "evals-based" governance frameworks.

  **Candidate 3 (Conjunctive Adequacy):** This is partially **illusory**. The claim that a misaligned model has an "incentive to fail both" monitoring and capability limits is goal-dependent; a competent escape-seeking agent typically incentives *passing* checks to gain access. However, the underlying concern—that safety properties are not compositional and that joint optimization can create loopholes—is valid. There are no logically incompatible pairs among the three, but Candidates 1 and 2 together create a tension that makes practical protocol design nearly impossible: if the model knows the spec (1) and passing tests doesn't increase assurance (2), the tests provide no signal for deployment decisions.

  ***

  ### Closing Assessment

  Behavioural monitoring fails Requirement 2 by conflating compliance with alignment, while weak-to-strong oversight struggles against Requirement 1 if the model can deceive the stronger supervisor. Deployment-level containment satisfies Requirement 3 but frequently violates Requirement 5, rendering the system economically unviable.
