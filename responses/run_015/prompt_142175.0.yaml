prompt: |-
  I'm a staff engineer at a company with about forty backend services spread across nine teams, and I've been asked to run a fifty-minute internal engineering-craft session on how technical conventions form and hold together. The reason I'm running it is a design review next week: we are about to rewrite our internal messaging layer, and the argument in the room keeps collapsing into the same shape — the retry policy is arbitrary, so let's just pick the better option and write it into the migration document. I've read a couple of summaries of David Lewis's account of convention and it looks like the right tool for what is going wrong in that room. I don't want to lecture at people about philosophy, and I don't want to put his numbered formal definition on the board, because I lose the thread in it myself and so will they. What I want from you is a plan for making the structure land with twenty-five engineers of mixed seniority, no philosophy background, one whiteboard and no slides, half of whom will arrive convinced that this is a management problem rather than a technical one.

  The case I was going to build everything on: when a consumer fails to process a message, it either retries with backoff until the message goes through, or it retries a fixed number of times and then parks the message in a dead-letter queue that a human drains by hand. There is no written policy. Every team I asked does the second thing, and every team I asked assumed every other team does the second thing. It appears to have started with one incident about three years ago — a consumer stuck retrying held a malformed message against a checkpoint for nine hours — and the fix that got posted in the incident channel somehow became the way everybody does it. If everyone did the other thing instead, throughput would arguably be better and nobody would be draining anything by hand, so the current practice looks arbitrary, and that word is doing real damage in the design review.

  There is a wrinkle. This is not a pure case of everyone just wanting to match: the platform team would rather each consumer team own its own dead-letter draining, and the consumer teams would rather the platform offered it as a feature. So there is a small dispute about who does the work sitting on top of the coordination problem. Tell me whether that wrinkle ruins the example, whether I should keep it and deal with it explicitly, or whether I should swap in something cleaner — say, two services that must agree on which of two functionally identical header names carries the correlation ID, which is cleanly arbitrary but invites someone to say we should just run a find-and-replace across the monorepo, and I don't know whether that objection is a problem with the example or the beginning of the lesson.

  Concretely, please plan:

  1. The order the pieces have to come in and what depends on what. In particular: does the definitional core — the stable regularity, the expectations each person has about everyone else, the fact that the expectations are themselves mutually visible, and the fact that some alternative regularity would have served just as well if everyone had converged on it — come before or after the case, and why? And at which point does the word arbitrary have to be repaired, given that they will hear it as costless?
  2. Whether my case or the cleaner one should carry the whole session, and what the carrying example must have and must lack. My guess is that it must lack a linter, a mandate and a single owner who could flip everyone at once, and must have a real alternative that would have done as well — tell me if that's wrong or incomplete.
  3. The misconceptions, and exactly where in the sequence to head each off. The ones I already expect: arbitrary means it doesn't matter, so pick the technically best option; a convention is just a habit, or just a rule nobody happened to write down; we'll announce it in the migration document and it will change; and — a fourth I only half-expect — that people will think the incident three years ago is why the policy is still there. Name the ones I'm missing.
  4. One thing I can have them do or answer in the last ten minutes that would show me they've got the structure rather than the vocabulary, and how I'd tell the difference.
  5. What I should openly refuse to explain in fifty minutes to this audience, and where the temptation to over-explain will be strongest for me.

  Assume they are smart, allergic to theory, and will try to turn every point back into an argument about who should own what. Please don't give me a reading list or citations, and don't quote Lewis: paraphrase the conditions in whatever terms make them usable on a whiteboard.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Context:**
      *   **Role:** Staff Engineer.
      *   **Audience:** 25 engineers (mixed seniority), 9 teams, 40 backend services. Smart, allergic to theory, prone to turning discussions into ownership arguments.
      *   **Goal:** Run a 50-minute session on how technical conventions form and hold together to unblock a design review (messaging layer rewrite).
      *   **Problem:** The design review is stuck on "arbitrary" choices (retry policy). People think "arbitrary" = "doesn't matter/costless" = "pick the technically best one."
      *   **Constraint:** No slides, one whiteboard, no philosophy lecturing, no Lewis quotes.
      *   **Specific Challenge:** A "wrinkle" in the case study (platform vs. consumer team ownership) that introduces a preference conflict, not just a coordination problem.
      *   **Input Material:** David Lewis's account of convention (coordination equilibrium, common knowledge, arbitrariness).

  2.  **Deconstruct the Core Concepts (Lewisian Convention without the Jargon):**
      *   *Regularity:* Everyone does $X$.
      *   *Expectation:* Everyone expects everyone else to do $X$.
      *   *Preference to Conform:* I want to do $X$ *if* you do $X$ (coordination).
      *   *Alternative:* We could have all done $Y$ instead, and that would have worked too (arbitrariness).
      *   *Common Knowledge:* We all know we all know... (this is the glue).

  3.  **Address the Specific Questions:**

      *   **Q1: Order of Operations (Definition vs. Case):**
          *   *Thought:* If I start with definitions, I lose them. If I start with the case, I need to make sure they don't get stuck on the technical details.
          *   *Decision:* Start with the *problem* (the design review stalemate), then move to the *case* (the DLQ story), then extract the *structure* (the whiteboard model).
          *   *Repairing "Arbitrary":* This needs to happen early. "Arbitrary" $\neq$ "Costless." It means "Alternative was viable."

      *   **Q2: Which Case Study?**
          *   *Option A (DLQ/Retry):* Real, high stakes, but has the "wrinkle" (ownership dispute).
          *   *Option B (Header Names):* Cleaner, purely arbitrary, but low stakes ("just find-and-replace").
          *   *Analysis:* The DLQ case is better *because* of the wrinkle. The session is about unblocking a design review where ownership *is* part of the argument. If I use the header example, they'll say "That's trivial, this is different." The DLQ example forces them to confront the coordination vs. preference tension.
          *   *Requirement:* The example must lack a central authority (no linter/mandate) and have a viable alternative. The DLQ case fits. The wrinkle shouldn't be hidden; it should be used to distinguish "Convention" from "Standard/Rule."

      *   **Q3: Misconceptions:**
          *   *Expected:* Arbitrary = doesn't matter; Convention = unwritten rule; Document = adoption; Incident = cause.
          *   *Missing:* "Convention is static" (it decays); "Convention solves technical optimality" (it solves coordination); "I can opt out unilaterally" (breaks the equilibrium).
          *   *Timing:* Address "Arbitrary" early. Address "Document = Adoption" during the solution phase. Address "Ownership" during the wrinkle analysis.

      *   **Q4: The Exercise (Last 10 mins):**
          *   *Goal:* Test understanding of structure, not vocab.
          *   *Idea:* Give them a new scenario where a convention is breaking and ask *why* or *how to fix*.
          *   *Better Idea:* Ask them to identify the "Alternative Equilibrium." If they understand convention, they can describe the world where the *other* choice was made and why it's stable.
          *   *Best Idea:* "The Breakage Test." Ask: "What specific signal would tell you this convention has dissolved?" or "Design a mechanism to switch conventions without breaking the system." Let's go with identifying the *cost of switching* vs. *benefit of optimality*.
          *   *Refinement:* Have them map the "Expectations" for the new messaging layer. Who expects what from whom?

      *   **Q5: What to Refuse to Explain:**
          *   *Temptation:* Explaining *why* the incident happened technically, or solving the ownership dispute right there.
          *   *Refusal:* Don't solve the retry policy. Don't solve the ownership dispute. Don't explain Game Theory math.
          *   *Focus:* The *mechanism* of agreement, not the *content* of the agreement.

  4.  **Drafting the Plan (Iterative Refinement):**

      *   *Intro (5 mins):* Hook them with the stalemate. Define the goal: "Why are we stuck?"
      *   *The Story (10 mins):* Tell the DLQ story. Keep it narrative.
      *   *The Whiteboard Model (15 mins):* This is the core. Draw the "Coordination Loop."
          *   Axis 1: What I do.
          *   Axis 2: What I expect you to do.
          *   Axis 3: What I know you expect me to do.
          *   *Crucial:* Distinguish "Arbitrary" (Alternative exists) from "Irrelevant" (Cost is zero).
      *   *The Wrinkle (10 mins):* Address the Platform vs. Consumer tension. This is where Convention meets Politics.
      *   *Exercise (10 mins):* Apply to the new Messaging Layer.
      *   *Wrap:* Summary.

      *   *Refining the "Arbitrary" Repair:* I need to make sure they understand that "Arbitrary" means "Switching costs are higher than the gain from the alternative." It's not that the choice doesn't matter; it's that *uniformity* matters more than *which* uniform choice we made.

      *   *Refining the Wrinkle:* The user asks if the wrinkle ruins the example. It actually saves it. Pure arbitrariness is rare in engineering. Usually, there's a preference (Platform wants X, Consumer wants Y). A convention resolves this by locking in one side. If I use the header example, it's too clean. I will advise keeping the DLQ case but framing the ownership dispute as a "Preference Conflict" that the Convention resolved by freezing one state.

      *   *Refining the Exercise:* I need something that proves they get "Common Knowledge."
      *   *Idea:* Ask them: "If we write the new policy in the migration doc, what *else* has to happen for it to become a convention?"
      *   *Success Metric:* If they say "Everyone reads it," they failed. If they say "Everyone knows everyone else has read it and committed to it," they succeeded.

  5.  **Final Review against Constraints:**
      *   50 mins? Yes, timing looks tight but doable.
      *   No slides? Yes, whiteboard focused.
      *   No Lewis quotes? Yes, using plain English.
      *   Address the "Management Problem" half? Yes, by showing convention is a social/technical hybrid.
      *   Address the "Arbitrary" damage? Yes, redefining it as "Coordination > Optimization."

  6.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I explicitly answer the 5 numbered points in the prompt structure, not just provide a lesson plan. The prompt asks for a plan *and* answers to specific strategic questions. I should structure the response to address the 5 points directly, perhaps embedding the lesson plan within the answers or as a concluding summary. Actually, looking at the prompt: "Concretely, please plan: 1... 2... 3... 4... 5..." Okay, I will structure the response exactly following those 5 headers.

      *   *Point 1 (Order):* Case first. Definitions extracted from case. Repair "arbitrary" immediately after introducing the case.
      *   *Point 2 (Example):* Keep the DLQ case. The wrinkle is feature, not bug. It prevents the "just lint it" dismissal.
      *   *Point 3 (Misconceptions):* List the expected ones + the missing ones (e.g., "Convention is permanent," "Convention = Technical Best Practice").
      *   *Point 4 (Exercise):* The "Migration Doc Test."
      *   *Point 5 (Refusals):* Don't solve the retry policy. Don't solve the ownership dispute.

      *   *Tone:* Professional, direct, peer-to-peer (Staff Eng to Staff Eng).

      *   *Whiteboard Visualization:* I need to describe what goes on the board clearly. A triangle or a loop works best for "Common Knowledge." Let's suggest a "Expectation Loop."

      *   *Handling the "Management Problem" crowd:* Acknowledge their view. Conventions *are* management tools, but they emerge technically.

      *   *Handling the "Arbitrary" word:* This is the crux. I need a specific phrase to replace it. "Coordination Premium."

      *(Self-Correction on Point 2)*: The prompt asks "Whether my case or the cleaner one should carry the whole session." I need to be decisive. Keep the DLQ case. The header example is too trivial and invites the "just fix it" response which derails the lesson. The DLQ case has *cost*, which makes the convention valuable.

      *(Self-Correction on Point 4)*: The exercise needs to be actionable in 10 mins. "Design the switch" is too hard. "Diagnose the failure" is better. "Why did the last convention fail?" or "What is missing for the new one to stick?" Let's go with "What is missing for the new one to stick?"

      *(Final Polish)*: Ensure I don't use Lewis's name or terms like "coordination equilibrium." Use "Stable Loop," "Mutual Expectation," "Viable Alternative."

  7.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  Here is the plan for your fifty-minute session, structured around your five constraints.

  ### 1. The Order of Operations

  **Sequence:** Case Study $\rightarrow$ The "Arbitrary" Repair $\rightarrow$ The Structure (Whiteboard) $\rightarrow$ The Wrinkle $\rightarrow$ Application.

  **Why Case First:** If you start with the definitional core (expectations, regularities, mutual visibility), you are lecturing. Engineers will tune out or try to map the definitions to their current Jira tickets immediately. You need them to feel the *pain* of the coordination failure before you give them the model to explain it.

  **The Flow:**
  1.  **Minutes 0–5:** State the design review stalemate. "We are stuck because we think the retry policy is a technical optimization problem. It isn't. It's a coordination problem."
  2.  **Minutes 5–15:** Tell the DLQ story (your case). Keep it narrative. "Three years ago, Incident X. Fix Y applied. Now everyone does Y. Nobody knows why, but everyone expects everyone else to do Y."
  3.  **Minutes 15–20:** **Repair the word "Arbitrary."** This is the critical pivot. Do not wait. As soon as someone says "It's arbitrary, so pick the better one," you stop them.
      *   *The Repair:* "Arbitrary does not mean *costless*. It means *there was a viable alternative.*"
      *   *The Whiteboard:* Draw two peaks separated by a valley. Peak A (Current DLQ), Peak B (Retry Backoff). We are on Peak A. Moving to Peak B requires going down into the valley (migration cost, risk, mixed-mode failure). The value of the convention is staying on *a* peak, not necessarily the highest one.
  4.  **Minutes 20–35:** Extract the structure. Draw the "Expectation Loop" on the board (see section 2).
  5.  **Minutes 35–40:** Address the Wrinkle (Ownership).
  6.  **Minutes 40–50:** Exercise and wrap.

  **Why this order:** You cannot explain *why* the expectations hold (the structure) until they understand *what* is being held (the case) and *why* we don't just switch (the repair of "arbitrary").

  ### 2. The Carrying Example

  **Verdict:** Keep the **DLQ/Retry case**. Do not swap to the header-name example.

  **Why:** The header-name example is too clean. It invites the exact objection you are trying to cure: "That's just a find-and-replace, why are we talking about philosophy?" Because there is no runtime cost to headers, the "coordination premium" feels invisible. The DLQ case has *operational cost* (humans draining queues). That cost makes the convention valuable. It proves that engineers will willingly accept technical debt (manual draining) to purchase coordination stability.

  **What the example must have:**
  *   **A Viable Alternative:** You must establish that Retry-Backoff *would have worked* technically. If the alternative was technically broken, it's not a convention, it's a constraint.
  *   **No Central Authority:** Emphasize that no CTO mandated DLQ. It emerged.
  *   **Mixed-Mode Failure:** You must articulate what happens if *one* team switches to Backoff while everyone else stays on DLQ. (Answer: The message bounces between the retrying consumer and the DLQ-expecting sender, or gets lost). This proves the value of uniformity over optimality.

  **What the example must lack:**
  *   **A Linter:** If a tool can enforce it, it's a standard, not a convention.
  *   **A Single Owner:** If one team can flip the switch, it's a configuration, not a convention.

  **Handling the Wrinkle:**
  The wrinkle (Platform vs. Consumer ownership) does **not** ruin the example; it saves it.
  *   *The Trap:* If you present a purely arbitrary case, the "management problem" half of the room will say, "Okay, so we vote and document it."
  *   *The Fix:* Use the wrinkle to show that conventions often *resolve* preference conflicts by freezing one state. The convention isn't just "We all do X." It's "We all agree to do X, even though Platform prefers Y, because X is what everyone expects."
  *   *Instruction:* Explicitly name this. "The convention froze the ownership model. Unfreezing it isn't a technical migration; it's a renegotiation of the social contract." This validates the "management problem" crowd without conceding that the *technical* decision is the lever to pull.

  ### 3. Misconceptions and Interception Points

  You identified four strong ones. Here is where to head them off, plus two missing ones.

  1.  **"Arbitrary = Costless/Doesn't Matter"**
      *   *Intercept:* **Minute 15.** (The "Two Peaks" whiteboard).
      *   *Script:* "If I switch to Backoff unilaterally, I break the system. The cost of switching is higher than the benefit of the better algorithm. That is why 'arbitrary' choices stick."

  2.  **"Convention = Unwritten Rule / Habit"**
      *   *Intercept:* **Minute 25.** (The Expectation Loop).
      *   *Script:* "A habit is me brushing my teeth. A convention is me driving on the right side of the road. If you habitually drive on the left, I don't care. If you conventionally drive on the left, we crash. Conventions require *mutual expectation*, not just repetition."

  3.  **"Documenting It Makes It So"**
      *   *Intercept:* **Minute 40.** (During the Exercise setup).
      *   *Script:* "Writing it in the migration doc makes it a proposal. It becomes a convention only when I know that *you* know that *I* know we are all following it."

  4.  **"The Incident Caused the Policy"**
      *   *Intercept:* **Minute 10.** (During the Story).
      *   *Script:* "The incident caused the *fix*. The convention caused the *persistence*. The incident is three years old. The engineers who fixed it are gone. The convention remains because the current engineers expect it."

  5.  **Missing: "Conventions are Static"**
      *   *Intercept:* **Minute 35.** (The Wrinkle).
      *   *Script:* "Conventions decay. If the cost of the manual drain gets too high, the convention will collapse. We are seeing that collapse now. We aren't picking a retry policy; we are migrating a convention."

  6.  **Missing: "I Can Opt Out Unilaterally"**
      *   *Intercept:* **Minute 30.** (Mixed-Mode Failure).
      *   *Script:* "In technical optimization, I can optimize my service. In convention, if I optimize my service against the convention, I reduce total system throughput. You cannot opt out."

  ### 4. The Final Ten Minutes: The "Migration Doc Test"

  **The Activity:**
  Divide them into pairs. Give them this prompt:
  *"We are writing the migration document for the new messaging layer. We want the new retry policy to become a convention, not just a rule. List three specific things that must be in that document or happen around it, other than the technical spec, to ensure the Expectation Loop closes."*

  **What to look for (Success vs. Failure):**
  *   **Failure (Vocabulary only):** They list technical constraints. "It must be in the config schema." "It must be linted." "It must be in the README."
  *   **Success (Structure):** They list social/visibility mechanisms.
      *   "It must explicitly state that *all* teams have agreed to this." (Mutual Knowledge)
      *   "It must define what happens if a team deviates." (Enforcement/Expectation)
      *   "It must be signed off by leads of all 9 teams, not just Platform." (Common Knowledge of Commitment)
      *   "We need a meeting where everyone confirms they are migrating." (Public Signaling)

  **How to tell the difference:**
  If they focus on *enforcement* (linters, CI checks), they think it's a rule. If they focus on *visibility* (sign-offs, announcements, shared understanding), they understand it's a convention.

  ### 5. What to Refuse to Explain

  **The Temptation:**
  You will be tempted to solve the retry policy. You will be tempted to solve the Platform vs. Consumer ownership dispute. You will be tempted to explain *why* the incident happened three years ago in technical depth.

  **The Refusal:**
  *   **Do not solve the retry policy.** If you conclude the session with "So we should use Backoff," you have proven their point (that it's a technical choice). You must conclude with "We need a mechanism to agree on *either*, and stick to it."
  *   **Do not solve the ownership dispute.** When the Platform team says "We should own DLQ" and Consumers say "You should," acknowledge it as a preference conflict. Say: "That is a negotiation. This session is about how we make the result of that negotiation stick."
  *   **Do not explain Game Theory.** If someone asks "Is this Nash Equilibrium?", say: "It's a stable loop. The math doesn't matter, the expectations do."

  **Where the over-explain temptation is strongest:**
  It will be strongest at **Minute 20**, when you draw the whiteboard. You will want to draw arrows for "Knowledge," "Expectation," "Action."
  *   *Restraint:* Keep the whiteboard to three nouns: **Regularity** (What we do), **Expectation** (What I think you do), **Visibility** (How I know you know).
  *   If you add more boxes, you lose the engineers. If they ask for more rigor, tell them: "The rigor is in the implementation, not the model. The model just tells us where the bodies are buried."

  ### Whiteboard Layout Guide

  Since you have one whiteboard, do not erase the "Two Peaks" diagram until the end. Use the right half for the "Expectation Loop."

  1.  **Left Side (The Value):** Two hills. Label them "DLQ" and "Backoff." Draw a stick figure on the DLQ hill. Label the valley between them "Migration Cost / Mixed-Mode Risk."
  2.  **Right Side (The Mechanism):** A triangle.
      *   Top Node: **I do X.**
      *   Bottom Left: **I expect you to do X.**
      *   Bottom Right: **I know you expect me to do X.**
      *   Draw arrows connecting all three. Label the center **"The Convention."**
  3.  **The Break:** Draw a red "X" over the Bottom Right node. Write: **"This is where the Migration Doc usually fails."**

  This visual anchor allows you to point to the board whenever someone argues technical optimality. You just point to the valley between the hills. When someone argues "Just document it," you point to the Bottom Right node.
