      *   **Coordination Failure vs. Paradox:** Address the "why not just coordination failure" point.
          *   Coordination failure implies there *is* a solution if we talk/contract.
          *   Sen's paradox is about *social choice rules* (aggregation mechanisms). It says *no* rule can satisfy these conditions simultaneously. It's an impossibility theorem, not a game-theoretic equilibrium problem (though related).
          *   The "Paradox" label comes from the violation of normative expectations, not just technical deadlock.
      *   **Refining the Dataset Analogy:**
