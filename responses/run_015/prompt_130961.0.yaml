prompt: |-
  I'm taking a seminar on applied moral philosophy, and we've been working through whether everyday conventions—tipping, queueing, and jaywalking—amount to genuine moral obligations or are merely coordination devices. I want to avoid just picking sides until I know what an adequate theory in this space actually has to deliver. Write the desiderata: the full specification of what a theory of the moral status of local conventions must be able to explain, distinguish, and accommodate, with the motivating case or consideration behind each requirement.

  The list should include at least the following: (1) how to treat visitors who violate a convention—distinguishing cases of structural ignorance (they genuinely could not know the local rule) from knowing refusal, and specifying whether the obligation extends to non-participants or is directed only at those embedded in the local practice; (2) the line between conventions that are morally arbitrary coordination mechanisms and those that protect vulnerable parties (for example, tipping where wages depend on it versus queueing where the harm is only delay); (3) how the theory handles pluralistic ignorance, where nearly everyone privately dislikes the convention but publicly enforces it, without collapsing into a mere description of social pressure; (4) whether there are "moral exemption zones"—conventions so weakly justified that non-compliance is not blameworthy even if it inconveniences others; and (5) whether universalizability demands that a visitor follow local norms, or whether context-sensitive justification rooted in local participation can survive without collapsing into moral relativism.

  For each desideratum, flag whether it is non-negotiable or a preference of a particular camp, and identify any pair you suspect is jointly unsatisfiable—particularly whether extending obligations universally to visitors can coexist with a justification that depends on ongoing local participation. Keep the weight on the criteria and their motivating cases rather than on a full scorecard, though briefly indicate how a pure social-contract view and a harm-based view fare against the list.
