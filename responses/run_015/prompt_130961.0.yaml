answer: |-
  # Desiderata for a Theory of the Moral Status of Local Conventions

  The following specification outlines the explanatory burdens any adequate theory of local conventions must bear. These criteria are designed to test whether a proposed framework can distinguish between mere social habits and genuine moral obligations without collapsing into relativism or rigid universalism.

  ### 1. The Epistemic and Ontological Status of Visitors
  **Specification:** The theory must differentiate between violations committed by **structural ignoramuses** (visitors who lack access to the rule) and **knowing refusers** (visitors aware of the rule but opting out). Furthermore, it must specify the **scope of membership**: does the obligation bind only those who benefit from the cooperative scheme (participants), or does it bind any moral agent present in the geography (non-participants)?
  *   **Motivating Case:** A tourist does not tip in a country where tipping is customarily optional, versus a tourist who refuses to tip in a culture where server wages rely entirely on gratuities. In the first, the violation is negligible; in the second, it may constitute exploitation.
  *   **Status:** **Non-Negotiable.** Any theory that cannot distinguish between *malice* and *mistake*, or between *insider* and *outsider* obligations, fails to match our basic moral intuitions regarding blame.

  ### 2. The Stakes Distinction: Coordination vs. Vulnerability
  **Specification:** The theory must provide a metric to distinguish between conventions that are **morally arbitrary coordination mechanisms** (solving a pure coordination problem) and those that function as **protective schemas for vulnerable parties**. It must explain why the moral "weight" of the obligation shifts depending on the material consequences of non-compliance.
  *   **Motivating Case:** **Queueing** vs. **Tipping**. Violating a queue causes minor delay and frustration (a coordination failure). Violating a tipping norm in a wage-subsidy system directly impacts livelihood (a harm/vulnerability issue). A theory that treats these as morally equivalent is deficient.
  *   **Status:** **Non-Negotiable.** A theory that treats all conventions as equally binding (or equally arbitrary) cannot account for the variance in our reactive attitudes (e.g., annoyance vs. outrage).

  ### 3. The Problem of Pluralistic Ignorance
  **Specification:** The theory must account for the normative status of conventions sustained by **pluralistic ignorance** (where most participants privately reject the norm but comply because they believe others endorse it). It must determine whether the obligation persists when the "collective will" is illusory, without reducing the obligation to a mere description of peer pressure or fear of sanction.
  *   **Motivating Case:** A workplace culture of mandatory overtime where everyone stays late believing *others* want to, while privately resenting it. Is there a moral obligation to stay late to "support the team," or is the convention morally void because it lacks genuine endorsement?
  *   **Status:** **Camp Preference.** Contractualists view this as a failure of consent (voiding obligation); Consequentialists may view the stability of the practice as retaining value regardless of private belief. An adequate theory must take a stance, but the *requirement to address it* is non-negotiable.

  ### 4. Moral Exemption Zones (The *De Minimis* Threshold)
  **Specification:** The theory must identify **exemption zones** where non-compliance is technically a violation of the convention but incurs no moral blame. It must define the threshold at which inconvenience to others becomes morally significant enough to generate an obligation.
  *   **Motivating Case:** **Jaywalking** at 3:00 AM on an empty street with clear visibility. Technically illegal and a violation of the "pedestrian convention," yet blaming the agent seems moralistic. The theory must explain why the obligation dissolves here despite the rule remaining on the books.
  *   **Status:** **Non-Negotiable.** A theory that generates obligations in *de minimis* cases risks moral fetishism; one that never generates them risks anarchism.

  ### 5. Universalizability vs. Contextual Participation
  **Specification:** The theory must resolve the tension between **universalizability** (moral rules should apply to all agents in relevantly similar situations) and **context-sensitive justification** (obligations arise from specific local participation). It must avoid collapsing into "When in Rome" relativism while acknowledging that moral duties may shift based on local institutional facts.
  *   **Motivating Case:** A visitor from a non-tipping culture enters a tipping culture. Does universalizability demand they follow the local norm (because the *type* of action—compensating service—is universal), or does their non-participation in the local wage system exempt them?
  *   **Status:** **Camp Preference.** Kantians prioritize universalizability; Pragmatists/Conventionists prioritize local participation. However, an adequate theory must explicitly reconcile these rather than ignoring one.

  ---

  ### Jointly Unsatisfiable Pairs & Theoretical Tensions

  There is a significant risk that **Desideratum 1 (Visitor Obligations)** and **Desideratum 5 (Universalizability)** are jointly unsatisfiable under a single coherent framework without significant qualification.

  *   **The Tension:** If obligations are grounded in **Local Participation** (to satisfy the intuition that outsiders shouldn't be bound by rules they didn't help create), then Universalizability is compromised (the rule "do not tip" is right at home but "tip" is right abroad). If obligations are grounded in **Universalizability** (the moral principle of fairness applies everywhere), then the distinction between Visitor and Participant (Desideratum 1) collapses, potentially binding tourists to local rules they had no hand in shaping.
  *   **The Conflict:** A theory that strongly protects the visitor from structural ignorance (D1) weakens the claim that the norm is universally binding (D5). Conversely, a theory that insists the moral principle travels with the agent (D5) makes it difficult to excuse the visitor's ignorance (D1) without appealing to epistemic rather than normative excuses.

  ### Preliminary Theoretical Scorecard

  **1. Pure Social-Contract View (Conventionalism)**
  *   **Performance:** Strong on **D1** and **D5 (Contextual)**. It grounds obligation in mutual agreement, easily explaining why visitors (non-signatories) might be exempt and why norms vary by location.
  *   **Weakness:** Struggles significantly with **D2 (Vulnerability)** and **D3 (Pluralistic Ignorance)**. If the "contract" is merely implicit, it is hard to explain why we are bound to conventions everyone privately hates (D3), or why we owe duties to vulnerable parties (tippers) if the "agreement" is exploitative. It risks legitimizing unjust local norms simply because they are established.

  **2. Harm-Based View (Consequentialist/Deontological)**
  *   **Performance:** Strong on **D2 (Vulnerability)** and **D4 (Exemptions)**. It easily distinguishes tipping (harm to livelihood) from queueing (mere annoyance) and explains why jaywalking on an empty street is permissible (no harm).
  *   **Weakness:** Struggles with **D1 (Visitors)** and **D5 (Universalizability)**. If the harm is objective, why does the visitor's ignorance matter? (Harm occurs regardless of intent). Furthermore, it risks moral imperialism: if the harm is real, the local context shouldn't matter, potentially demanding agents impose their home standards abroad if they calculate less harm that way.

  ### Conclusion on Adequacy
  An adequate theory cannot simply adopt one of these frameworks wholesale. It must likely be a **hybrid account**: grounding the *existence* of the convention in social coordination (Contract) but grounding the *moral force* of the convention in the prevention of harm or unfairness (Harm/Fairness). Only such a hybrid can satisfy the Non-Negotiable desiderata regarding vulnerability and ignorance without succumbing to the tensions between Universalizability and Local Participation.
