      *   *Key Distinction:* SPC distinguishes between *Variation within a mechanism* (Common) and *Variation of the mechanism* (Special).

  9.  **Final Polish:** Check tone. Needs to be rigorous, philosophical, but direct. No fluff. Ensure the software point lands hard because it clarifies the hardware case. (The firmware update shows that "same mechanism" in SPC really means "same parameter set").

