prompt: |-
  I work on the philosophy of mechanisms and I keep hitting a wall with how anomaly detection is actually done, and I want to pin down what view of "the same mechanism" it quietly commits you to. Take statistical process control: you monitor a manufacturing process, set the control limits from it's own past output (the usual 3-sigma stuff), and flag any point outside them as a special cause — i.e. the mechanism has changed. The catch is the limits are computed from the mechanism's own history, so "same mechanism" is effectively defined as "keeps producing what it used to produce," and anything outside that envelope is an anomaly by construction. But the engineer's gut sense of "the same machine" is about the physical parts and their causal roles, not the output distribution. So what view of mechanism identity does the practice actually presuppose — functional, structural, or something behavioral/statistical? Is that circularity (baseline drawn from the mechanism itself) a real problem or just a pragmatic convention? And if the mechanism is software, where a firmware update is a planned change to the parts, does the special-cause/common-cause split even survive? Not after a reading list, just the implicit theory and where it's doing the work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Philosophy of mechanisms (likely referencing the "New Mechanism" literature: Machamer, Darden, Craver, etc.).
      *   **Problem:** Anomaly detection (specifically Statistical Process Control - SPC) seems to define "same mechanism" circularly based on output history, whereas the engineer's intuition is structural/causal.
      *   **Core Question:** What view of mechanism identity does SPC practice presuppose (functional, structural, behavioral/statistical)?
      *   **Sub-Question 1:** Is the circularity (baseline from history) a real philosophical problem or just pragmatic?
      *   **Sub-Question 2:** How does this hold up for software mechanisms (firmware updates = planned structural change)?
      *   **Constraint:** "Not after a reading list, just the implicit theory and where it's doing the work." (Keep it conceptual, avoid bibliographic dumping).

  2.  **Analyze the Tension:**

      *   *Engineer's View:* Mechanism = Physical components + Organization (Structural/Constitutional). Identity persists through minor output fluctuations.
      *   *SPC View:* Mechanism = Stable Probability Distribution of Output (Behavioral/Statistical). Identity breaks when distribution shifts significantly.
      *   *The Conflict:* SPC treats output stability as the *criterion* for mechanism identity, but output stability is usually the *evidence* for mechanism stability. This looks like operationalism.

  3.  **Identify the Implicit Theory of Mechanism Identity:**

      *   It's not purely structural (a worn bearing might still be "the same machine" structurally but produce anomalies).
      *   It's not purely functional (the function might remain "make widgets," but the *mode* of functioning is flagged).
      *   It *is* **Homeostatic Property Cluster (HPC)** adjacent, or more accurately, a **Stable Causal Process** view.
      *   Actually, looking deeper: SPC presupposes a **Dispositional** view of mechanisms. The mechanism *is* its disposition to produce a specific distribution.
      *   Even better: It presupposes a **Black-Box Regularity** view. The internal structure is irrelevant *until* the regularity breaks.
      *   *Key Insight:* SPC treats the mechanism as a **Stationary Stochastic Process**. Identity = Stationarity.

  4.  **Address the Circularity:**

      *   Is it vicious? No. It's hermeneutic/iterative.
      *   You need a baseline to detect change, but the baseline assumes stability.
      *   Philosophical resolution: It's a **Reflective Equilibrium** between structural knowledge and statistical behavior. We *assume* stability to calibrate, then test for stability.
      *   It's pragmatic, but it relies on a metaphysical bet: that nature is uniform (Humean problem, but engineering-solved).
      *   The "Common Cause" vs. "Special Cause" distinction (Deming/Shewhart) maps onto "Inherent Variability of the Mechanism" vs. "Intervention on the Mechanism."

  5.  **Address the Software Case:**

      *   Firmware update = Structural change.
      *   In SPC terms: This is a *planned* Special Cause.
      *   Does the split survive? Yes, but the "Common Cause" baseline must be reset.
      *   Philosophical implication: Mechanism identity in software is more **Versional** than continuous. A software mechanism is defined by its code state. Changing code = New Mechanism (strictly speaking), whereas in hardware, wear and tear = Same Mechanism (until breakage).
      *   This highlights that SPC's "Same Mechanism" is actually "Same *State* of the Mechanism."

  6.  **Synthesize the "Implicit Theory":**

      *   **Name it:** The **Stationarity Criterion** of Mechanism Identity.
      *   **Where it does work:** It shifts the ontological weight from *components* to *invariant relations*.
      *   **The Circular Bit:** It's an **Operationalist** definition of identity used for *epistemic access*, not metaphysical truth.
      *   **The Software Twist:** It reveals that "mechanism" in SPC is actually "mechanism-in-a-specific-configuration."

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sharpness of the observation. It cuts right to the operationalism in the New Mechanism literature.
      *   *Section 1: The Identity View.* It's not structural. It's **Dispositional/Statistical**. The mechanism *is* the stable generator of the distribution. Call it the "Stationary Process" view.
      *   *Section 2: The Circularity.* It's not vicious; it's **Methodological Essentialism**. We treat the statistical baseline *as if* it were the essence to detect deviation. It's a tool for partitioning variance, not defining being.
      *   *Section 3: Common vs. Special Cause.* This maps to Internal (Constitutional) vs. External (Environmental/Interventional) but blurred. Common cause = The mechanism doing its thing. Special cause = The mechanism being interfered with or changing state.
      *   *Section 4: The Software Case.* This breaks the "physical continuity" illusion. Software updates force a re-baseline. This proves SPC tracks **State Identity**, not **Constitutive Identity**.
      *   *Conclusion:* The practice commits you to a **Pragmatic Realism** about mechanisms. They are real, but "sameness" is relative to the control chart's purpose.

  8.  **Refining the Philosophy:**

