answer: |-
  The practice of Statistical Process Control (SPC) commits you to a **Dispositional-Stationarity View** of mechanism identity, which is distinct from the Structural-Constitutive view dominant in much of the philosophy of mechanisms.

  Here is the implicit theory and where it is doing the philosophical work in your scenario.

  ### 1. The Ontological Commitment: Identity as Stationarity
  In the "New Mechanism" literature, a mechanism is typically individuated by its components and their organization (structural/constitutive). SPC, however, individuates a mechanism by the **invariance of its output distribution**.

  *   **The View:** A mechanism is "the same" if and only if the stochastic process generating its output remains *stationary* (i.e., mean and variance are constant over time).
  *   **Where it does the work:** This shifts the criteria of identity from *what the thing is made of* to *how the thing behaves over time*. A machine with a worn bearing (structural change) that still falls within 3-sigma is, for SPC purposes, the *same mechanism*. A machine with no structural changes that drifts outside 3-sigma (due to temperature, voltage, etc.) is treated as a *different mechanism* (or a compromised one).
  *   **The Implication:** SPC treats the mechanism as a **Black-Box Disposition**. The internal causal structure is ontologically secondary to the stability of the propensity to produce specific outputs. "Common cause" variation is the disposition of the mechanism manifesting; "Special cause" variation is the disposition changing.

  ### 2. The Circularity: Hermeneutic, Not Vicious
  You identified the circularity: the baseline for "same mechanism" is derived from the mechanism's own history. If the history contains undetected anomalies, the baseline is corrupted.

  *   **The Theory:** This is not a logical vicious circle but a **Hermeneutic Circle of Calibration**. It presupposes a **Pragmatic Realism**: we must *assume* stability to *detect* instability.
  *   **Where it does the work:** This assumption functions as a **Methodological Essentialism**. The control limits are treated *as if* they are the essential boundaries of the mechanism's nature, even though they are statistically derived.
  *   **Resolution:** The circularity is broken by **Intervention**. When a point flags "out of control," the practice requires a physical search for a structural cause. If none is found, the point may be incorporated into a new baseline. Thus, the statistical definition is provisional; it is constantly checked against the structural/causal reality. The "sameness" is a working hypothesis, not a metaphysical truth.

  ### 3. The Software Stress Test: State vs. Constitution
  The software/firmware case exposes the crack in the standard hardware intuition and clarifies what SPC is actually tracking.

  *   **The Problem:** In hardware, "same mechanism" allows for continuous degradation (wear). In software, a firmware update is a discrete, planned structural change.
  *   **The SPC Response:** A firmware update forces a **Re-baselining**. You cannot compare post-update output to pre-update control limits.
  *   **The Implicit Theory Revealed:** This proves that SPC does not track **Constitutive Identity** (is it the same physical device?) but **Parametric Identity** (is it running the same causal algorithm?).
  *   **Special vs. Common Cause:** In software, a firmware update is a **Planned Special Cause**. It acknowledges that the mechanism *has* changed, intentionally. The "Common Cause" variation is now the noise inherent to the *new* code version.
  *   **Philosophical Consequence:** For software mechanisms, "mechanism identity" is **Versional**. The SPC practice reveals that what we call "the mechanism" is actually "the mechanism-in-state-S." When S changes (firmware), the mechanism (for control purposes) is new, even if the hardware substrate is identical.

  ### Summary of the Implicit Theory
  SPC presupposes that a mechanism is a **Stable Causal Generator**.

  1.  **Identity Criterion:** Statistical Stationarity (Behavioral/Dispositional), not Physical Continuity (Structural).
  2.  **The Circle:** It is a pragmatic feedback loop. Statistical anomalies trigger structural investigations. The statistics define the *when*, the engineering defines the *why*.
  3.  **The Split:** The Common/Special cause distinction is not about "Internal vs. External" causes (since temperature might be external but common cause), but about **Predictable vs. Unpredictable** relative to the current model of the mechanism.

  **The Verdict:** The practice commits you to the view that mechanisms are **individuated by their invariant causal powers**, where "invariant" is cashed out statistically. The circularity is the price of epistemic access: you cannot know the mechanism's limits without assuming it has limits, and you cannot know it has limits without measuring its output. It is a coherent, operationalist ontology that prioritizes **predictive control** over **metaphysical constitution**.
