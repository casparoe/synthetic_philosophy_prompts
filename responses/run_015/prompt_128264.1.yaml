  3. In cases comparing imminent eviction against a lack of textbooks, the procedure denies the textbook applicant even with residual funds. This occurs because the weighted welfare deficit of homelessness vastly outweighs the minor study-hour loss of missing materials.
  4. When two applicants present identical quality-adjusted study-hour losses and priority scores, the protocol acknowledges an unresolvable tie. Here, mathematical weighting offers no further guidance for selection between the candidates.
  5. At the point of such equal-score ties or when the levelling-down veto triggers ambiguity, the officer must defer the final allocation decision to a values-based committee. They should not exercise personal discretion beyond this procedural boundary.
