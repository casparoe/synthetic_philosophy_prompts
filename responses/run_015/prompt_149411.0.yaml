answer: |-
  This is a formidable inquiry. You have read Plutarch not as a historian but as a moral technologist, asking how the machinery of biography is supposed to work on the soul. You are right to suspect that the Colston episode is not merely a political dispute but a collision between two different technologies of memory: the Plutarchan life (textual, divisible, aimed at character formation) and the civic monument (spatial, indivisible, aimed at honour).

  I will argue this out with you, using your frameworks and testing them against the facts you have provided.

  ### 1. The Mapping

  To apply Plutarch strictly, we must first define the terms of the analogy. In Plutarch's *Lives*, the "Life" is a text designed to be read by an individual seeking to shape their own *hexis* (disposition). In Bristol, the medium is different.

  *   **What is the "Life"?** It is not the man (Colston is dead). It is not the bronze (that is merely material). The "Life" in this case is the **Civic Narrative**. In 1895, the Life was the statue plus the plinth text. In 2025, the Life is the empty plinth plus the new plaque. The "text" is the arrangement of public space.
  *   **Who is the "Reader"?** The reader is the **Citizen-Walker**. Unlike Plutarch's reader, who chooses to pick up a scroll, the Citizen-Walker encounters the Life involuntarily. They are not seeking moral improvement; they are walking to the shops. This makes the "instruction" more potent and more dangerous. It is osmotic.
  *   **What is "Reading"?** It is the act of **Looking Up**. To look at a statue on a plinth is to physically enact submission or reverence. To look at a statue in a museum case is to examine a specimen. The physical relationship *is* the moral relationship.
  *   **What is the "Expression or Jest"?** Plutarch seeks the unguarded moment that reveals the soul. A statue has no tongue, so it cannot jest. However, the **Omission** functions as the jest. The 1895 plaque's silence on the Royal African Company is the "unguarded expression." It reveals the character not of Colston, but of the 1895 Bristolians who erected it. Their "jest" was the claim that one could be a "virtuous son" while the source of the virtue was treated as invisible. That silence is the revealing detail.

  ### 2. The Three Clauses Against the Three Objects

  Let us run your Plutarch Test against the three iterations of this narrative.

  **Object 1: The 1895 Monument and Plinth**
  *   **Clause (a) [The Unguarded Vice]: Fail.** The monument presents a seamless whole. There is no episode admirers would omit because everything omit-able has already been omitted. It is pure hagiography.
  *   **Clause (b) [The Funding]: Fail.** This is the critical failure. The plaque claims virtue ("virtuous and wise") without tracing the cost. In Plutarchan terms, this is a lie about the soul. If virtue is a harmony of the soul, and the harmony is purchased by the dissonance of enslaved bodies, the virtue is false. The monument asserts the charity exists without the trade.
  *   **Clause (c) [The Action]: Fail.** It instructs the reader to *revere*. It does not invite critical engagement. It says "Be like this," but because it hides the cost, it instructs the citizen to seek the *appearance* of virtue without the justice required to sustain it.
  *   **Verdict:** This is not a Life; it is an idol.

  **Object 2: The Toppled Statue in the M Shed (2020–2025)**
  *   **Clause (a) [The Unguarded Vice]: Pass.** The graffiti and the rope marks are the "episodes admirers would leave out." They are violent, messy, and unguarded. They reveal the conflict that the 1895 version suppressed.
  *   **Clause (b) [The Funding]: Partial Pass.** Displayed in a museum with context, the funding source (slavery) is made explicit. The "cost" is visible in the historical panels, if not on the bronze itself.
  *   **Clause (c) [The Action]: Pass.** It instructs the reader to *witness*. It does not say "emulate Colston" nor simply "emulate the protesters." It says "observe the conflict." It invites the citizen to hold the tension between the benefaction and the brutality.
  *   **Verdict:** This is the most Plutarchan object. It allows for the "lines and features of the face" (the art, the history) to be seen alongside the "marks of the soul" (the rage, the removal).

  **Object 3: The 2025 Plaque on the Empty Plinth**
  *   **Clause (a) [The Unguarded Vice]: Pass.** It records the toppling. It admits the disharmony.
  *   **Clause (b) [The Funding]: Pass.** By explaining *why* it was removed, it implicitly acknowledges the funding source was the disqualifying factor. It traces the cost by acknowledging the debt.
  *   **Clause (c) [The Action]: Pass.** It instructs the citizen to *remember the judgment*. It says: "We honoured him, we reconsidered, we removed him." It models a civic process of correction.
  *   **Verdict:** This satisfies the test, but it is a Life of the *Statue*, not the Man. It teaches the citizen how the city changes its mind.

  **On Clause (b):** You suspected this is where they are weakest. You are correct. The 1895 version fails because it treats money as neutral fluid. Plutarch would argue that money has a moral texture. You cannot build a temple to Virtue with bricks stolen from a neighbour. The 1895 monument tries to wash the bricks. The Museum and the 2025 Plaque admit the bricks are stained.

  ### 3. Where the Case Breaks the Method

  You identified three breakages. Here is my ranking of their depth, from shallowest to deepest.

  **Rank 3 (Shallowest): The Selection of Detail.**
  You worry that the "revealing detail" is just a mirror for the viewer's conviction. This is a hermeneutic problem, not a Plutarchan one. Plutarch assumes a shared moral vocabulary (Greek *arete*). Bristol in 2020 does not have a shared vocabulary. However, Plutarch's method actually *helps* here. By forcing us to ask "Which detail reveals the soul?", we admit that the 1895 selection (the benevolent face) was a choice, not a truth. The method doesn't solve the disagreement, but it exposes that the 1895 version was a curation, not a given. This is a feature, not a bug.

  **Rank 2: Virtue Funded by Vice.**
  Plutarch assumes a life expresses *one* character. He allows for complexity (Alexander's rage vs. generosity), but he assumes these flow from the same soul. Colston presents a structural problem: the virtue (charity) is not just co-present with the vice (slavery); it is *dependent* on it. Plutarch's moral psychology is individual; he does not have a category for "systemic sin." He would likely argue that Colston's charity was not virtue at all, but a form of hubris or appeasement. But the method struggles to quantify a virtue that is mathematically produced by a vice. Plutarch can tell you a man is mixed; he cannot easily tell you a man is *structurally compromised*.

  **Rank 1 (Deepest): The Individual vs. The Collective.**
  This is the fatal break. Plutarch writes for the **private soul**. His goal is: "Read this, and you will be braver." The Colston episode is about the **public space**. Its goal is: "Look at this, and we will be a just city."
  Plutarch has no resources for "what is owed to the living." He cares about what the dead teach the living. He does not account for the rights of the enslaved descendants who must walk past the statue. In Plutarch's world, the dead are teachers. In Bristol's world, the dead (Colston) are silencing the living (the citizens).
  When you pull a statue down, you are not shaping your own character in private; you are altering the civic environment for everyone. Plutarch's method cannot adjudicate this because it has no theory of *public harm*. It only has a theory of *private example*. To stretch Plutarch to cover "what a city owes its minorities" is to break the tool. This is the deepest breakage because it requires a political theory Plutarch does not possess.

  ### 4. The "Man of His Time" Defense and Edmund Burke

  Your instinct here is correct, and it is the most genuinely Plutarchan move you have made.

  The defense "he was a man of his time" relies on the assumption of **moral inevitability**. It claims that no one in 1690 could have seen the evil of the slave trade. Plutarch's method of **Parallel Lives** is specifically designed to destroy this assumption. Plutarch pairs men to show that character, not circumstance, determines action.

  By pointing to **Edmund Burke** (or indeed, other contemporaries who criticized the trade), you are constructing a Parallel Life *within the same city*.
  *   **Life A:** Colston (Profited, Endowed, Statued).
  *   **Life B:** Burke/Critics (Opposed, Spoke, Statued later).

  If two men live in the same time, in the same city, with access to the same information, and one participates in the trade while the other criticizes it, then the trade was not "of the time." It was a choice.
  Plutarch uses comparison to isolate variable traits. If the variable is "time," and the outcome differs, then "time" is not the cause. "Character" is the cause.
  This is not a use you have invented; it is the core engine of the *Parallel Lives*. Plutarch compares Greeks and Romans to show that virtue is universal, not cultural. You are using Burke to show that conscience was available, not anachronistic. This sharpens the argument immensely: it moves the debate from "Presentism vs. Past" to "Agency vs. Determinism."

  ### 5. The Parallel Life and A Critique of Your Test

  **The Parallel Life:**
  If I were writing a Parallel Life to Colston, I would pair him with **Cecil Rhodes (1853–1902)**.
  *   **Why:** Like Colston, Rhodes was an imperial extractor whose wealth came from the exploitation of African bodies and land (de Beers, British South Africa Company). Like Colston, he used that wealth to endow scholarships and institutions (Rhodes Trust, University of Cape Town) intended to civilize and benefit. Like Colston, he was statued in prominent public spaces (Oxford, Cape Town) and became a focal point for toppling movements (#RhodesMustFall, 2015).
  *   **The Verdict:** The comparison reveals that the "Great Man" theory of philanthropy is often a mechanism for laundering imperial guilt. Both men believed that their extraction was justified by their endowment. The Parallel Life would conclude that while their *industry* was high, their *justice* was low. Plutarch would likely judge them as men of great *capacity* but flawed *judgment*, whose "virtue" was actually a sophisticated form of self-worship. The verdict is not that they did nothing good, but that their good was tainted by a fundamental lack of recognition of the other as human.

  **Critique of Your Plutarch Test:**
  You asked me to correct you if your test is flawed. I believe **Clause (c)** is the weak link.
  *   *Your Clause (c):* "It can answer... what the reader is now supposed to do differently, as opposed to what the reader is supposed to feel."
  *   *The Problem:* This turns the Life into a fable or a directive. Plutarch does not usually tell you *what to do*. He tells you *what to admire* or *what to avoid*. He aims at *phronesis* (practical wisdom), not compliance. If a Life tells you "Pull down statues," it is propaganda. If it tells you "Consider what a statue costs," it is philosophy.
  *   *The Correction:* Clause (c) should be: **"It must provoke a judgment in the reader that alters their disposition toward the subject's values."**
      *   The 1895 statue wanted you to value *Benevolence* (regardless of source).
      *   The 2025 plaque wants you to value *Justice* (over mere Benevolence).
      *   The test should not demand a specific action (which dates the text), but a shift in moral weighting.

  **On the Indivisibility of the Monument:**
  You argued that a statue is one gesture of elevation applied to a whole man. This is profound. A book can have a chapter on "The Slave Trader" and a chapter on "The Philanthropist." A statue stands on one plinth. It says "This Man."
  Therefore, the toppling is not an act of censorship; it is an act of **grammar correction**. The 1895 statue made a false statement (The Whole Man = Virtuous). The toppling corrected the syntax (The Whole Man ≠ Virtuous). The 2025 empty plinth is the most honest "statue" of all: it represents the **Silence** where the virtue was claimed to be. It admits that the "Whole Man" cannot be elevated.

  **Conclusion:**
  You are chewing on the right bone. The Colston episode is not about history; it is about what we think a human being *is*. Plutarch thinks a human being is a soul to be imitated or avoided. Bristol discovered that a human being can also be a **debt**. The 1895 statue tried to collect the interest on the debt without acknowledging the principal. The protesters demanded the principal be paid. Plutarch can help us see the character flaws, but he cannot help us pay the debt. For that, you need something he never wrote: a theory of reparations.
