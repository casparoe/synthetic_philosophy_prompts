  Premise (6) claims that nothing marks convention shopping as a mistake given the reductionist picture, but this conflates metaphysical arbitrariness with normative permissibility. Even if there is no further fact of identity, conventions like "person" function like the rules of a game: their utility depends on stable, reciprocal expectations, not individual optimization. When an agent switches conventions opportunistically to claim credit but dodge blame, they undermine the coherence of the practice itself, rendering the convention useless for everyone, including themselves in the long run. Therefore, convention shopping is a mistake of practical rationality and ethical consistency, not a metaphysical error. This preserves *anatta* because the constraint arises from the requirements of coherent social practice and the reduction of suffering, not from an enduring self. I am highly confident this is the only move that saves reductionism from self-refutation without smuggling in *ātman*. The new problem you inherit is the "normativity gap": you must explain how conventions generate binding obligations without metaphysical facts to ground them, forcing you to develop a robust pragmatist ethics that can distinguish between *useful* conventions and *exploitative* ones without appealing to the very realism you rejected.
