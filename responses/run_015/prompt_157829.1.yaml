      *(Self-Correction during drafting)*: I need to be careful with Dennett. He isn't a *radical* instrumentalist; he believes in "real patterns." I must ensure I don't caricature IS as "it's all a fiction." It's "beliefs are real patterns identifiable from the intentional stance." RAS seems to demand *more* than Dennett—specifically, access to the *vehicle* of the representation, not just the pattern of behavior.
