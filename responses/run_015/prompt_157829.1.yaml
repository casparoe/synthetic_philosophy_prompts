  6.  **Final Polish:** Check tone (academic, philosophical, rigorous). Ensure all parts of the prompt are answered. (Did I cover the hypothetical uninterpretable system? Yes. Did I cover vulnerabilities? Yes.)

      *Key Insight to highlight:* The "Perfectly Predictable but Uninterpretable" case is the wedge. IS says "Beliefs exist." RAS says "We can't say." This reveals RAS is actually an *epistemic* stance on attribution, whereas IS is an *ontological* stance on the nature of belief. Wait, RAS says attribution is *justified* only when... so it's normative/epistemic. IS says attribution is *warranted* by success. Both are normative about attribution, but IS links attribution directly to reality of the pattern. RAS links attribution to access to mechanism.

      *Wait, one nuance:* Dennett argues that if the intentional stance works, the beliefs are *real*. The user's RAS says attribution is *justified* only with access. So RAS might allow beliefs exist but we can't attribute them? No, the prompt says "belief attribution is justified only when..." implying if we can't attribute, we treat them as non-believers for our purposes. I will treat RAS as a stricter condition for the *existence* of genuine belief states, not just our permission to talk about them.

      *Let's structure the "Switching Allegiance" section carefully.* It needs to be about empirical findings in AI or philosophy.
      *   Switch from IS: If we find a "Philosophical Zombie" AI (perfect prediction, zero internal state).
      *   Switch from RAS: If human brains turn out to be uninterpretable in the RAS sense.

  7.  **Final Review against constraints:**
      *   Compare IS vs. RAS.
