answer: |-
  Dear friend,

  It is a pleasure to engage with this problem, because you have isolated precisely the tension that keeps philosophers of science and metaphysicians awake at night. You are trying to navigate between a naive realism that posits facts wherever language allows us to form a sentence, and a verificationism that collapses reality into what can be measured. Your intuition is searching for a middle ground, often called structural realism or entity realism, but as you have noticed, the boundaries are slippery. Before I propose a principle and apply it to your unsettled cases, I need to lay out the landscape of consensus and disagreement surrounding your examples, because the stability of your intuitions should depend on how settled the underlying physics is.

  Your third case, regarding gauge freedom in physical theory, is the most settled among experts. There is a broad consensus among physicists and philosophers of physics that quantities which can be shifted without altering any observable prediction are not features of the world but artifacts of the mathematical description. This is often referred to as Leibniz equivalence in this context. If two mathematical models represent the same physical state despite differing in some variable, that variable is considered surplus structure. Your intuition here is on solid ground and aligns with the standard view. Your first case, the colony ship beyond the cosmological horizon, is also relatively stable within standard cosmology. Most cosmological realists hold that space-time continues smoothly beyond our horizon and that events occurring within our past light cone, such as the coin flip before departure, remain facts even if the consequences are now inaccessible. The disagreement here is usually reserved for those who hold holographic views of the universe or strong verificationist positions, but the standard model of cosmology assumes the reality of the beyond.

  The fourth case, concerning Many Worlds versus single-history interpretations of quantum mechanics, is deeply contested. There is no consensus on whether the branches of the wavefunction that decohere from us constitute existing worlds or merely mathematical possibilities. Everettians argue they are real because the dynamics require them; collapse theorists argue they are not because only one outcome is experienced. Your hesitation here is appropriate, and you should not feel pressured to force a verdict where the physics community itself remains divided. Your second case, the simulation, is a thought experiment rather than a physical theory, but it tests your commitment to the principle of the identity of indiscernibles. Your fifth case, galaxies beyond the horizon, sits between the first and the fourth. While standard cosmology assumes they exist, some philosophers argue that if they can never interact with us, even in principle, positing their existence is metaphysically idle.

  The inconsistency in your current set of verdicts lies primarily between your second and third cases. In the third case, you correctly identify that a difference in description that makes no difference to measurement is not a difference in the world. In the second case, however, you feel that the method of generation constitutes a fact of the matter for the inhabitants, even though it makes no difference to their measurements. You noted that you dislike this reaction, and I think you are right to distrust it. If you accept the lesson from the gauge theory case that empirical equivalence implies ontological equivalence, you should overturn your verdict on the simulation. The implementation detail is, for the inhabitants, exactly like a gauge freedom. It is a difference in the description of their world that no operation within their world can detect. To say there is a fact of the matter there is to privilege the perspective of the simulator over the perspective of the inhabitants, but if we are asking about what exists for the inhabitants, the implementation is irrelevant.

  If we overturn that verdict, we can articulate a principle that captures your remaining intuitions while respecting the settled science. The principle is what I would call Causal-Explanatory Realism. It states that a proposition about what exists has a truth value if and only if the entity or fact in question is either causally anchored in the accessible past or structurally indispensable for explaining the accessible present. This principle respects your first case because the coin flip was causally anchored in the past light cone before the ship receded. It respects your third case because the gauge quantity is explanatorily redundant. It respects your corrected second case because the generation method explains nothing for the inhabitants. It leaves your fourth case open, as required by the contested nature of quantum interpretations, because whether the other branches are explanatorily indispensable for deriving the probabilities in this branch is exactly what is debated between Everettians and collapse theorists. It also clarifies your fifth case: if the existence of galaxies beyond the horizon is required to explain the homogeneity of the cosmic microwave background within our horizon, as inflationary theory suggests, then they are structurally indispensable and thus real. If they are merely tacked on without explanatory work, they are not.

  Applying this principle to your two new cases requires careful attention to the explanatory role of the facts in question. First, consider the cyclic universe where each cycle erases every trace of the one before it. If the erasure is total, meaning no information, energy, or structural constraint carries over that affects the current cycle, then the previous cycle is not causally anchored in our past in any detectable way, nor is it structurally indispensable for explaining our current state. Under Causal-Explanatory Realism, there would be no fact of the matter about whether cities existed in that previous cycle. It would be akin to the gauge quantity or the simulation implementation detail. However, you must be cautious here because this rests on a contested description. Some cyclic models, such as conformal cyclic cosmology, suggest that certain geometric features do carry over. If the model requires the previous cycle to explain the low entropy start of this one, then the previous cycle becomes explanatorily indispensable, and the existence of cities would depend on whether the model allows for such structures to form. But given your stipulation that every trace is erased, the principle dictates that the question is empty. The history is not just lost; it is ontologically void because it does no work.

  Second, consider the solitary animal in a region of an otherwise empty universe that no observer will ever reach. Here the question is whether pain, a subjective state, exists without an observer. Your principle focuses on causal anchoring and explanatory indispensability. The animal's physiology is presumably continuous with animals we do observe. We infer pain in observable animals because positing pain explains their behavior, their neural activity, and their evolutionary history better than positing they are philosophical zombies. If the solitary animal is physiologically identical to the observable ones, then positing pain plays the same explanatory role in the model of that animal's biology, even if no external observer verifies it. The fact is causally anchored in the biological history that produced the animal, which is part of the same lawful universe we inhabit. Therefore, the principle suggests there is a fact of the matter: the animal is in pain. To deny this would be to make consciousness depend on external observation, which contradicts the causal story of how nervous systems evolve and function. The only reason to doubt this is if you hold a verificationist view of mind that you have otherwise rejected in the physical cases, but consistency demands you treat the animal's internal state as real if its physical correlates are real.

  I must add a note of uncertainty regarding the animal case, as the metaphysics of consciousness is even less settled than the metaphysics of cosmology. Some philosophers argue that without a community of language users or observers, attributing mental states is category mistaken. However, given your starting preference for realism about inaccessible physical facts, extending that realism to biological facts seems the more consistent path. The pain is not a measurement outcome; it is a state of the organism that explains its behavior, much like the coin flip explains the ship's trajectory.

  In summary, the principle that best sorts your cases is Causal-Explanatory Realism, which grants ontological status only to what is anchored in the accessible past or required to explain the accessible present. To make this work cleanly, you should overturn your intuition about the simulation, aligning it with your correct intuition about gauge freedom. This leaves the quantum many-worlds case properly contested, as it should be. For the cyclic universe, if traces are truly erased, the past cities are no more real than the ungenerated terrain in your simulation. For the solitary animal, the pain is real because it is part of the explanatory structure of the animal's biology, which is continuous with the world we know. This approach keeps you from multiplying entities beyond necessity while preserving the reality of the world beyond our immediate grasp.

  I hope this helps clarify the structure of your own thinking. It is a difficult balance to strike, but your instinct to start from cases rather than theory is the right one.

  Best regards,

  Your colleague
