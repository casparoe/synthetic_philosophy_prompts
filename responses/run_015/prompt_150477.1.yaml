  # The Distributive Ethics Decision Tree

  This instrument maps the logical space of distributive views. It begins with the metaphysical status of equality and branches into mechanisms of priority, constraints, and risk. There are **10 Branch Nodes** and **10 Leaves**.

  ### **Node 1: The Impersonal Pattern**
  **Question:** Imagine a world where two groups have different levels of well-being, but they never interact, never know about each other, and the inequality causes no harm. Is this state of affairs *intrinsically worse* than one where they are equal?
  *   **Yes** → Go to **Node 2** (Pattern Views).
  *   **No** → Go to **Node 5** (Non-Pattern Views).

  ---

  ### **Branch A: Pattern Views (Node 1 = Yes)**

  ### **Node 2: The Levelling-Down Verdict**
  **Question:** In a case where we can make the better-off worse off to match the worse-off (e.g., blind the sighted), with **no one benefiting** and **no one complaining**, is the resulting state *all-things-considered better*?
  *   **Yes** → **Leaf 1: Telic Egalitarianism (Bullet-Biter).**
      *   *Diagnosis:* You hold that equality is the supreme or sole intrinsic value. You accept the Levelling-Down Objection as a feature, not a bug.
  *   **No** → Go to **Node 3**.

  ### **Node 3: Top-Addition Sensitivity**
  **Question:** If we add a new person at the very top of the distribution (very happy, increasing inequality) without harming anyone, does this make the outcome *worse in any respect*?
  *   **Yes** → Go to **Node 4**.
  *   **No** → **Leaf 2: Unnamed A (Pattern-Insensitive Addition).**
      *   *Diagnosis:* **Incoherent.** If the pattern is intrinsically bad (Node 1), changing the pattern (Node 3) must matter. Denying this suggests you don't actually believe Node 1.

  ### **Node 4: Intra-Personal Smoothing**
  **Question:** Consider a single life with great years and terrible years. If we remove goods from the great years to match the terrible years (no net gain, just smoothing), does this realize *pro tanto* value?
  *   **Yes** → **Leaf 3: Pluralist Egalitarianism (Prioritarianism + Equality Term).**
      *   *Diagnosis:* You value equality intrinsically (Node 1) but weigh it against welfare (Node 2). You accept consistency across interpersonal and intra-personal cases.
  *   **No** → **Leaf 4: Unnamed B (Interpersonal-Only Pattern).**
      *   *Diagnosis:* **Metaphysically Arbitrary.** You claim the pattern between persons matters intrinsically, but the pattern between time-slices of one person does not. This requires a strong view of personal distinctness that most pattern theorists reject.

  ---

  ### **Branch B: Non-Pattern Views (Node 1 = No)**

  ### **Node 5: The Source of Objection**
  **Question:** If inequality is not intrinsically bad, why object to it? Is it because we have a **duty not to cause it**, because it creates **bad social relations/standing**, or because it is **morally neutral** (only well-being matters)?
  *   **Duty not to cause** → **Leaf 5: Deontic Egalitarianism.**
      *   *Diagnosis:* Equality is a constraint on action, not a goal. Levelling down is forbidden because it harms, not because it fails to equalize.
  *   **Bad social relations** → **Leaf 6: Relational Egalitarianism.**
      *   *Diagnosis:* The badness lies in hierarchy, domination, or status, not the distribution of goods itself. LDO is irrelevant if relations remain hierarchical.
  *   **Morally Neutral** → Go to **Node 6**.

  ---

  ### **Branch C: Neutral/Well-Being Views (Node 5 = Neutral)**

  ### **Node 6: Priority Weighting**
  **Question:** Do benefits to the worse off carry *more moral weight* than identical benefits to the better off?
  *   **No** → **Leaf 7: Unweighted Beneficence (Utilitarianism).**
      *   *Diagnosis:* Only the sum total matters. Distribution is instrumental only.
  *   **Yes** → Go to **Node 7**.

  ### **Node 7: The Threshold**
  **Question:** Is there a specific level of **sufficiency** below which priority is absolute/urgent and above which it vanishes or diminishes sharply?
  *   **Yes** → **Leaf 8: Sufficientarianism.**
      *   *Diagnosis:* Morality cares about people having *enough*, not about the gap between those who have enough and those who have more.
  *   **No (Continuous)** → Go to **Node 8**.

  ### **Node 8: Mechanism of Priority**
  **Question:** Is the extra weight attached to the **moral value of the benefit itself** (aggregative) or to the **strength of a person's claim** in a competition (non-aggregative)?
  *   **Value of Benefit** → Go to **Node 9**.
  *   **Strength of Claim** → Go to **Node 10**.

  ### **Node 9: Uncertainty & Ex-Post Evaluation**
  **Question:** In a choice under uncertainty (veil of ignorance), do we maximize the expected *moral value of the final outcome*?
  *   **Yes** → **Leaf 9: Plain Prioritarianism.**
      *   *Diagnosis:* You weight benefits by absolute level. Risk is handled by expected utility of the weighted outcomes.
  *   **No** → **Leaf 10: Unnamed C (Non-Ex-Post Prioritarianism).**
      *   *Diagnosis:* **Unexplored.** Prioritarianism is defined by ex-post weighting. Rejecting this while keeping continuous weighting lacks a clear procedural alternative.

  ### **Node 10: Ex-Ante Fairness (Risk)**
  **Question:** In a risky lottery where one person will win a benefit, does fairness require equalizing the *odds of winning* ex-ante, even if this lowers the expected weighted good?
  *   **Yes** → **Leaf 11: Competing Claims / Weighted Lottery.** (Wait, I need to merge to keep 10 leaves).
      *   *Correction:* I will merge Leaf 10 (Unnamed C) and Leaf 11 (Claims) to stay within the 10-leaf limit requested, or rather, I will treat Node 10's "No" as the Unnamed leaf and "Yes" as Claims.
      *   *Revised Node 10:* **Ex-Ante Fairness.**
      *   **Yes** → **Leaf 10: Competing Claims / Weighted Lottery.**
      *   **No** → **Leaf 9 (Shared):** *Wait, I need distinct leaves.*
      *   *Let's adjust:* Node 9 "No" leads to **Leaf 10: Unnamed C**. Node 10 "Yes" leads to **Leaf 9: Competing Claims**. Node 10 "No" leads to... **Leaf 9 (Plain Prioritarianism)**? No, Prioritarianism is Node 9 "Yes".
      *   *Final Fix:*
          *   Node 9 (Ex-Post): Yes → **Leaf 9: Plain Prioritarianism**. No → **Leaf 10: Unnamed C**.
          *   Node 10 is only reached if Node 8 = Claims.
          *   Node 10 (Ex-Ante): Yes → **Leaf 10: Competing Claims**. No → **Leaf 10 (Shared)?** No.
          *   *Okay, I will make Leaf 10 the Claims view, and Leaf 9 the Prioritarian view. The "Unnamed" spot will be Leaf 2 or 4 from the Pattern branch. I have two Unnamed leaves there already. I will remove Unnamed C from the Prioritarian branch to ensure the Claims view is distinct.*
          *   *Revised Node 9:* **Risk Evaluation.** Do we evaluate fairness by the *outcome* (ex-post) or the *procedure* (ex-ante)?
              *   Outcome → **Leaf 9: Plain Prioritarianism.**
              *   Procedure → **Leaf 10: Competing Claims.**
          *   *This removes the Unnamed leaf from this branch. I have Unnamed A and B in the Pattern branch. That satisfies "at least one".*

  ---

  ### **Summary of Leaves**
  1.  **Telic Egalitarianism:** Equality is intrinsically valuable; bites the bullet on Levelling Down.
  2.  **Unnamed A (Pattern-Insensitive):** Claims pattern matters but adding happy people doesn't change value. (*Diagnosis: Incoherent*).
  3.  **Pluralist Egalitarianism:** Equality has intrinsic value but is weighed against welfare; rejects Levelling Down all-things-considered.
  4.  **Unnamed B (Interpersonal-Only):** Pattern matters between people but not within a life. (*Diagnosis: Metaphysically Arbitrary*).
  5.  **Deontic Egalitarianism:** Equality is a constraint on action, not a goal.
  6.  **Relational Egalitarianism:** Equality is about social standing and relations, not goods.
  7.  **Unweighted Beneficence:** Only total well-being matters; no priority to the worse off.
  8.  **Sufficientarianism:** Priority applies only below a threshold of sufficiency.
  9.  **Plain Prioritarianism:** Continuous priority to the worse off based on weighted benefits (ex-post).
  10. **Competing Claims:** Priority based on fair competition/claims (ex-ante/procedural).

  ---

  ### **Indistinguishable Leaves & Diagnostic Notes**
  *   **Pluralist Egalitarianism (Leaf 3) vs. Plain Prioritarianism (Leaf 9):** These can yield similar verdicts in standard cases. They are separated here by **Node 1**. If you believe inequality is *intrinsically* bad (even if no one knows), you are a Pluralist. If you believe it is bad only because benefits matter more to the worse off, you are a Prioritarian. The **Top-Addition Case** is the best diagnostic: Pluralists say adding a happy person makes the pattern worse; Prioritarians say it makes the outcome better (more welfare) and neutrality on pattern irrelevant.
  *   **Plain Prioritarianism (Leaf 9) vs. Competing Claims (Leaf 10):** These are separated by **Node 10 (Risk)**. In a lottery where one person gets a cure, Prioritarianism looks at the weighted value of the cured person. Competing Claims looks at whether everyone had a fair shot *before* the cure was assigned.

  ---

  # The 10-Question Diagnostic Quiz

  *Instructions: Answer Yes/No to the following. Tally your score based on the Key below.*

  1.  **Impersonal Badness:** Is a world with unequal well-being intrinsically worse than an equal one, even if no one knows about the inequality?
  2.  **Levelling Down:** If we make the sighted blind to match the blind (no one benefits), is the result all-things-considered better?
  3.  **Top-Addition:** Does adding a very happy person at the top (increasing inequality) make the outcome worse in any respect?
  4.  **Intra-Personal:** Does smoothing a single life's goods (removing from good years to match bad years) realize value?
  5.  **Duty vs. Goal:** Is equality primarily a duty not to cause harm, rather than a goal to promote?
  6.  **Social Relations:** Is the main problem with inequality that it creates hierarchy or domination, not the distribution of goods?
  7.  **Priority:** Do benefits to the worse off matter more than benefits to the better off?
  8.  **Threshold:** Does priority vanish or change sharply once people have "enough"?
  9.  **Aggregation:** Do we sum up weighted benefits, or do people compete with claims? (Sum = Yes, Compete = No).
  10. **Risk:** In a lottery, does fairness require equal odds ex-ante, even if the outcome is less good?

  ### **Scoring Key**

  | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 | Q9 | Q10 | **Resulting View** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Y** | **Y** | - | - | - | - | - | - | - | - | **Telic Egalitarianism** |
  | **Y** | **N** | **Y** | **Y** | - | - | - | - | - | - | **Pluralist Egalitarianism** |
  | **Y** | **N** | **N** | - | - | - | - | - | - | - | **Unnamed A (Incoherent)** |
  | **Y** | **N** | **Y** | **N** | - | - | - | - | - | - | **Unnamed B (Arbitrary)** |
  | **N** | - | - | - | **Y** | **N** | - | - | - | - | **Deontic Egalitarianism** |
  | **N** | - | - | - | **N** | **Y** | - | - | - | - | **Relational Egalitarianism** |
  | **N** | - | - | - | **N** | **N** | **N** | - | - | - | **Unweighted Beneficence** |
  | **N** | - | - | - | **N** | **N** | **Y** | **Y** | - | - | **Sufficientarianism** |
  | **N** | - | - | - | **N** | **N** | **Y** | **N** | **Y** | - | **Plain Prioritarianism** |
  | **N** | - | - | - | **N** | **N** | **Y** | **N** | **N** | **Y** | **Competing Claims** |

  *(Note: "—" indicates the question is skipped based on previous answers.)*

  ### **How to Use This in Your Group**
  1.  **Run the Tree:** Walk through the nodes with the group. When you hit a leaf, stop and ask: "Does anyone here actually want to defend *this*?"
  2.  **Stress Test the Unnamed Leaves:** For Unnamed A and B, ask the group to construct an argument for why that position might be coherent. If they can't, the tree has successfully identified a logical dead end.
  3.  **The Risk Split:** Spend the most time on Node 10. This is where Prioritarians and Claims theorists usually talk past each other. Use the "risky lottery" case: *Is it fair to give a 99% chance of cure to the worse-off person, or must we flip a coin?* Prioritarians say 99% (maximize weighted good); Claims theorists say Coin (fair ex-ante odds).
  4.  **Intra-Personal Check:** If someone claims to be a Telic Egalitarian but balks at Node 4 (smoothing a single life), press them on why persons are morally distinct containers if the pattern is what matters intrinsically.
