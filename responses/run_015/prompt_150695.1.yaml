answer: |-
  # Non-Human Entity Tagging Protocol (N-HETP)
  **Version:** 1.0 (Draft for Management Review)  
  **Timebox:** 5 Minutes per entry  
  **Goal:** Distinguish between "Historical Actor" (active trigger) and "Background Condition" (passive context).

  ---

  ## Part 1: The Checklist
  *Answer in order. If you hit a **STOP**, mark as **[CONDITION]** and finish. If you pass all, mark as **[ACTOR]**.*

  ### Step 1: The Timescale Test (Hard Filter)
  **Question:** Did the non-human factor happen as a distinct event or shock, rather than a slow, invisible trend?
  *   **Pass:** It has a start date (e.g., an eruption, a flood, a specific harvest failure).
  *   **Fail:** It is a gradual drift over decades/centuries (e.g., soil depletion, slow warming, cultural shifts).
  *   **STOP:** If **Fail**, tag **[CONDITION]**. Do not proceed.
  *   *[JUDGMENT CALL]:* "Gradual" is subjective. If the trend accelerated suddenly near the event, you must decide if the acceleration counts as the "event."

  ### Step 2: The Disruption Test (Hard Filter)
  **Question:** Did this factor physically force a change in the available options for humans?
  *   **Pass:** It made a previous action impossible or immediately dangerous (e.g., crops died, road washed out, people got sick).
  *   **Fail:** Humans could have ignored it with minor inconvenience, or it only influenced morale/opinion.
  *   **STOP:** If **Fail**, tag **[CONDITION]**. Do not proceed.
  *   *[JUDGMENT CALL]:* Distinguishing between "physical force" and "strong influence." (e.g., Did the heat *cause* the riot, or just make people grumpy?)

  ### Step 3: The Mediation Test (The Determinism Trap)
  **Question:** Did human decisions determine the *severity* of the outcome?
  *   **Pass:** Yes. (e.g., The volcano erupted, but *policy* turned starvation into famine).
  *   **Fail:** No. (e.g., The outcome was inevitable regardless of human action).
  *   **Rule:** If **Fail**, tag **[ACTOR]** (The non-human thing dominated). If **Pass**, proceed to Step 4.
  *   *[WARNING]:* This is the danger zone. If you tag **[ACTOR]** here, ensure you aren't erasing human negligence.

  ### Step 4: The Attribution Test (Manager Safety Check)
  **Question:** If we tag this as an "Actor," does it accidentally excuse a human villain?
  *   **Pass:** No. (e.g., Tagging the volcano doesn't let the government off the hook for relief efforts).
  *   **Fail:** Yes. (e.g., Tagging the germ as the "Actor" makes public health negligence invisible).
  *   **STOP:** If **Fail**, tag **[CONDITION]** even if previous steps passed.
  *   *[HONESTY FLAG]:* **This step is pure gut feeling.** There is no rule for "excusing negligence." You must decide based on the political sensitivity of the dataset.

  ### Step 5: Final Decision
  *   If you passed Steps 1, 2, 3, and 4: Tag **[ACTOR]**.
  *   If you stopped at any point: Tag **[CONDITION]**.

  ---

  ## Part 2: Test Runs
  *Here is how the protocol handles your three specific cases.*

  ### Case 1: Tambora Eruption (1815) → 1816 Riots
  *   **Step 1 (Timescale):** **Pass.** Distinct eruption event (April 1815).
  *   **Step 2 (Disruption):** **Pass.** Physically destroyed crops globally; made farming impossible for a season.
  *   **Step 3 (Mediation):** **Pass.** Humans chose to riot/loot rather than starve quietly; governments chose how to respond.
  *   **Step 4 (Attribution):** **Pass.** Blaming the weather doesn't excuse the rioters' violence or the government's relief failure.
  *   **Result:** **[ACTOR]**
  *   **Notes:** Safe to tag. The volcano is a clear "trigger" without erasing human agency.

  ### Case 2: Cholera Strain (1854 Broad Street Pump)
  *   **Step 1 (Timescale):** **Pass.** The outbreak has a specific onset window.
  *   **Step 2 (Disruption):** **Pass.** The bacteria physically killed people; it made drinking water lethal.
  *   **Step 3 (Mediation):** **Pass.** Humans chose to keep the pump open; Snow chose to remove the handle.
  *   **Step 4 (Attribution):** **Fail / Gray Zone.**
      *   *Protocol Logic:* If we tag the *strain* as an Actor, does it hide the Board of Health's negligence?
      *   *Strict Reading:* The checklist allows it to pass if you argue the germ was the primary killer.
      *   *Your Gut:* It feels wrong to call a germ a "historical actor" in the same bucket as a general or a politician. It risks medical determinism.
  *   **Result:** **[ACTOR]** *(According to strict checklist logic)* **BUT** flagged for review.
  *   **Notes:** **This is the "Feels Wrong" case.** The checklist says "Actor" because the germ actively disrupted life. However, Step 4 is where you should pause. If your team cares about public health history, tag this as **[CONDITION]** (the environment) and tag the *Board of Health* as the **[ACTOR]**. The protocol struggles here because biology acts, but history records responsibility.

  ### Case 3: 200-Year Aridification → Migration
  *   **Step 1 (Timescale):** **Fail.**
      *   *Reasoning:* 200 years is a slow drift, not a shock. No single start date.
  *   **Result:** **[CONDITION]** (Stop immediately).
  *   **Notes:** Easy call. This is classic background context. Tagging this as an "Actor" would be pure environmental determinism.

  ---

  ## Part 3: Where the Procedure Breaks Down (Read Before Sign-Off)

  **1. The "Gut Check" in Step 4 is not a rule.**
  I have labeled Step 4 as a safety check, but there is no objective way to measure "excusing negligence."
  *   *Risk:* Two engineers can run this on the same Cholera case. One says "The germ killed them, it's an Actor." The other says "The city ignored sanitation, the germ is just Context."
  *   *Mitigation:* If Step 4 feels shaky, default to **[CONDITION]**. It is safer for historical analysis to under-tag non-human actors than to over-tag them and erase human responsibility.

  **2. The "Distinct Event" trap in Step 1.**
  Some slow conditions have fast tipping points (e.g., a drought lasting 10 years, but the *final* year causes the war).
  *   *Risk:* You might tag the "10th year of drought" as an Actor, when it's really the same Condition as years 1–9.
  *   *Mitigation:* If the "event" is just the climax of a long trend, tag as **[CONDITION]**.

  **3. The Manager Problem.**
  Your manager wants clear binaries. This protocol gives binaries, but Step 4 relies on your ethical intuition.
  *   *Honesty:* When presenting this to your manager, tell them: *"Steps 1–3 are mechanical. Step 4 requires me to use historical judgment. If I flag a case for 'Human Review,' it means the checklist couldn't decide if tagging this hides human blame."*

  ## Recommendation for Implementation
  1.  **Adopt the Checklist:** It fits the 5-minute window.
  2.  **Add a "Review Flag":** If you hesitate on Step 4, don't just guess. Mark the entry as `NEEDS_REVIEW`. This protects you from being accused of "environmental determinism" later.
  3.  **The Cholera Precedent:** Decide *now* with your team: Are pathogens Actors?
      *   If **Yes**: The checklist works.
      *   If **No**: Add a rule: "Biological agents are always [CONDITION] unless used as a weapon." (This solves the "Feels Wrong" issue in Case 2).
