      *   *Case 3 (Legality):* Legality at the time doesn't matter. Moral wrong supersedes positive law.
      *   *Case 4 (Living Victim):* Paradigm case. Intergenerational claims must analogize to this.
      *   *Case 5 (Unwanted Benefits):* "Betterment" from the wrong doesn't offset the debt. Suggests the debt is about *rectification of status/rights*, not just economic balancing.
      *   *Case 6 (Accepted Part-Payment):* Settlements matter. Suggests procedural legitimacy can discharge debt.
      *   *Case 7 (Overlapping Descent):* State owes, individuals don't personally owe, but individuals fund the state. Distinguishes *political liability* from *moral culpability*.
      *   *Case 8 (Existential Precondition/Non-Identity):* Existence doesn't negate harm. Suggests harm is to the *group/lineage* or *rights*, not just comparative welfare of specific individuals.
      *   *Case 9 (Dead Culture):* Compensation for loss of cultural goods, even if not wanted back. Suggests harm includes *cultural integrity/heritage*, not just material welfare.
