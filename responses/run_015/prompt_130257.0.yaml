          1.  *Church/Corporation:* Does the State inherit the debt if the entity dissolves? (Test of State Responsibility).
          2.  *Perpetrator Group as Victim:* (Test of Netting/Complexity).
          3.  *Conquered State:* (Test of Continuity).
      *   **Incompatibilities:** I need to be honest. Case 7 is the hardest. The distinction between "citizens paying tax" and "citizens owing personally" is thin. I need to highlight this tension. Case 10 is the one I need to resolve.
