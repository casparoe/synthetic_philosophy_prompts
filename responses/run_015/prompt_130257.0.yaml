          *   To handle Case 7 (Newcomers): Liability is *political* (citizenship), not *moral* (culpability).
          *   To handle Case 8 (Non-Identity): The claim belongs to the *community lineage*, not just the specific individual's counterfactual welfare.
          *   To handle Case 9 (Dead Culture): Compensation for *loss of options/heritage*, not just restoration.

  4.  **Addressing the Specific Requirements:**

      *   **Principle Formulation:** I will propose a "Principle of Political Rectification."
      *   **Clause Breakdown:** Map clauses to Cases 1-9.
