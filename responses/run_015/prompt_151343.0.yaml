prompt: |-
  I am preparing a speculative-fiction module for an interdisciplinary graduate workshop on the ethics of cosmic-scale decision-making, and I need a story that treats the dark forest hypothesis as an epistemic trap rather than a simple doctrine of preemptive aggression. Write a short story of approximately 1,500 words set aboard an isolated research outpost orbiting a red dwarf, where a junior astrobiologist detects what appears to be an engineered modulation embedded within cosmic microwave background anisotropy. Rather than framing detection as an automatic trigger for annihilation, the narrative should develop the "silent equilibrium" problem: if every mature civilization learns to camouflage its technological footprint by mimicking natural background radiation, then the absence of detectable signals becomes structurally ambiguous between "no other civilizations exist" and "everyone is hiding with perfect success." Through dialogue with a skeptical mentor who insists on open-science norms, and through the physical constraints of the outpost—resource scarcity, no faster-than-light communication, and institutional isolation—the protagonist should feel the logical pull toward concealment even when she privately judges the signal to be benign. The story must culminate in one concrete institutional choice: publishing the pattern in an open dataset, encrypting it within a restricted consortium, or deliberately injecting noise to mask both the signal and her own observational capabilities. Do not name Liu Cixin, do not reference the Three-Body Problem by title, and do not include bibliographic references, citations, or reading lists.

  After the story, provide a structured summary in JSON format containing exactly these fields: "central_dilemma" (a string summarizing the protagonist's conflict), "epistemic_mechanism" (a string describing how camouflage creates interpretive ambiguity), "institutional_choice" (a string summarizing her final decision), "philosophical_tension" (a string identifying the conflict between transparency norms and survival logic), and "niche_extension" (a string explaining how the silent equilibrium idea modifies the standard dark-forest narrative).
