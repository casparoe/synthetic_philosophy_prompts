answer: |-
  Dear colleague,

  It is completely understandable that this policy keeps coming back to haunt you, because what you are describing is not merely an administrative headache but a genuine philosophical paradox disguised as clinical protocol. You have put your finger on the tension between how we speak about risk and how we actually use it. To answer your first question about what the policy presupposes, the current setup acts as if there is a single, true risk number inherent to each patient, waiting to be discovered like a blood pressure reading. This is a realist view of probability, where risk is a propensity or a disposition located within the individual. However, the behavior of your colleagues undermines this completely. By adding or removing variables like calcium scans versus postcodes, they are acknowledging that the number is not intrinsic to the patient but is instead a function of the reference class you choose to put them in. Any individual belongs to infinitely many overlapping groups, and the risk rate changes depending on which group you select. If the policy allowed only one rigid set of inputs, you could maintain the fiction that you are measuring a fixed property. But by permitting clinical discretion to alter the inputs, you are admitting that the number is relational, not intrinsic. The policy presupposes a truth that its own practice denies, treating a variable statistical output as if it were a stable biological fact.

  This leads directly to the contradiction you noted regarding populations and individuals. When doctors say guidelines are for populations but then use the score to deny an individual, they are committing what philosophers call the ecological fallacy, yet they do so out of necessity. The practice is incoherent if it claims to be purely medical, because you cannot logically derive an individual certainty from a group frequency without assuming the individual is average for that group. However, the practice might be coherent if you shift the justification from medical truth to resource allocation. If the number is just a rate in a group you decided to count them in, then the policy is fine only if you are honest that you are picking the group for non-medical reasons. Currently, you are not honest about this. You exclude variables like ethnicity or postcode not because they lack predictive power—they often have strong statistical correlation—but because using them feels ethically fraught or socially unacceptable. This confirms that the model is not trying to find the truest risk, but the most politically defensible risk. The number is a tool for sorting patients according to values that include, but are not limited to, medical accuracy.

  The fixed budget changes the question significantly, and it suggests that your intuition about ranking might be the key to unlocking the logic here. If you can only afford four thousand patients a year, then strictly speaking, you do not need a threshold of fifteen percent. You need a rank order. You simply treat the four thousand people with the highest scores, regardless of whether the top person is at sixteen percent or forty percent. The existence of a fixed threshold implies that there is a level of need below which treatment is medically futile, not just unaffordable. But if the budget is the hard constraint, the threshold is actually a shadow of the budget, not a line drawn by biology. If the population gets healthier and fewer people cross fifteen percent, you would presumably still treat the top four thousand, meaning the threshold would effectively drop. If the threshold stays fixed at fifteen percent regardless of how many people qualify, then the budget is not the driver, clinical necessity is. Your audits suggest the budget is the driver, because you penalize clinics for enrolling too many below the threshold, which implies the threshold is a cap on spending disguised as a clinical guideline. So, half your arguments about which variables belong in the model are indeed about the wrong thing if the goal is purely to fill slots. But if the goal is to ensure everyone treated has a minimum absolute benefit, then the variables matter immensely because they determine who crosses the line of necessity.

  Regarding which views the practice quietly rules out, it rules out pure individualism, which would demand a unique biological assessment for every person without reliance on group data, and it rules out pure egalitarianism, which would treat everyone equally regardless of risk. It also rules out strict actuarial realism, which would demand you use every available predictor including postcode and ethnicity to get the most accurate statistical forecast. The practice is underdetermined because it could be justified by several different theories that all license exactly what you do. A utilitarian could support it to maximize lives saved within a budget. A prioritarian could support it to help those at highest risk first. A contractualist could support it as a fair rule everyone agreed to in advance. All these theories lead to the same workflow but for different reasons. The ambiguity allows your committee to vote for the policy without agreeing on why it exists. Some of you vote for it thinking it saves the most lives, others thinking it is the only fair way to ration, and others thinking it is medically necessary. The policy survives because it does not force you to choose between these justifications, but this is also why it feels unstable when you scrutinize the details.

  If you gave up the idea that there is any fact of the matter about an individual's risk, the policy would have to look quite different. The threshold would not survive in its current form as a marker of medical need. Instead, it would become an explicit funding cutoff. You would say that anyone above the line is eligible for funding, not because they are definitely going to have a heart attack, but because their profile places them in a group where the cost per life saved is acceptable to the network. The audits would survive but would change character from clinical audits to financial compliance checks. You would not be checking if the doctor was medically right to enroll the patient, but if they stayed within their allocated budget share. The most difficult change would be what you say to a patient who asks why they got the leaflet. Currently, you say their risk is low, implying safety. If you give up the fact of the matter, you must say that their risk profile places them lower on the priority list given available resources. You would have to admit that someone else with the same biology might get treated in a different hospital with a different budget, or in a different year when funding is higher. This removes the shield of medical objectivity that protects you from the moral weight of rationing.

  Ultimately, the friction you feel comes from trying to use a statistical tool to solve a moral problem while pretending it is a scientific one. The model outputs a number, but the decision to treat is a judgment of value. When your colleagues tweak the inputs based on what feels fair rather than what is predictive, they are doing ethics, not math. When you audit based on a budget cap, you are doing economics, not medicine. The policy is currently trying to be all three at once without naming them. To resolve the incoherence, you do not necessarily need to change the workflow, but you do need to change the story you tell yourselves about what the workflow is. If you accept that the number is just a rate in a group you decided to count them in, you can stop arguing about whether the number is true and start arguing about whether the grouping is fair. You can admit that the threshold is a budget mechanism. You can acknowledge that the variable selection is a moral choice about which correlations we are willing to act upon. Doing so might not make the decisions easier, but it would stop you from chasing a phantom truth about individual risk that the numbers were never designed to hold.
