      *   **User's Concerns:**
          1.  *Ontology of Risk:* Colleagues adjust the risk by adding/removing variables (calcium scan, polygenic score vs. postcode, ethnicity, sex). The number changes based on what info is fed in, yet it's treated as a measurement of the patient (like blood pressure).
          2.  *Contradiction in Use:* Doctors say guidelines are for populations, not individuals (criticism of policy), yet use the score to deny treatment to individuals. The number is too crude to treat by but good enough to refuse by.
          3.  **Questions to Answer:**
              *   What does the policy presuppose about what a risk number is? (Single correct answer vs. group rate).
              *   If it's just a group rate, is the policy incoherent, or fine if honest about non-medical reasons (cost, fairness)?
              *   Does the fixed budget change the question? (Maybe only ranking matters).
              *   Which views does the practice rule out? Where is it underdetermined?
              *   What would the policy look like if we gave up the idea of a fact of the matter about individual risk? (Threshold, audits, patient explanation).
      *   **Constraints:** No looking anything up, no citations, no headings, no bullet points, no bold, no tables. Continuous prose (email style).

  2.  **Deconstruct the Philosophical Issues:**
      *   **Individual Risk vs. Group Frequency:** This is the core metaphysical/epistemological tension. Is "your risk" a property of *you* (propensity/disposition) or a property of the *reference class* you are placed in?
      *   **Reference Class Problem:** Any individual belongs to infinite overlapping classes (men, men over 40, men over 40 with high BP, men over 40 with high BP living in London, etc.). Which class determines the "true" risk?
      *   **Realism vs. Instrumentalism:** Is the risk number trying to track a hidden reality (realism) or is it just a tool for sorting (instrumentalism/pragmatism)?
      *   **Clinical Judgment vs. Algorithm:** Doctors claim individual treatment requires nuance (anti-algorithm) but use the algorithm for rationing (pro-algorithm).
      *   **Resource Allocation:** The budget constraint introduces a utilitarian/prioritarian layer. The threshold might not be about medical necessity but about capacity.

  3.  **Drafting - Section by Section (Mental Outline):**
      *   *Opening:* Acknowledge the tension. It's a profound philosophical puzzle disguised as administrative policy.
      *   *Ontology of Risk:* Address the "single correct answer" vs. "group rate" question. The policy acts as if there's a true risk (realism) but practices suggest it's reference-class dependent (constructivism/instrumentalism). The variability of inputs (calcium vs. postcode) shows the number isn't like blood pressure. Blood pressure is intrinsic; risk is relational.
      *   *The Contradiction:* The "guidelines are for populations" vs. "you don't qualify"矛盾。This is the incoherence. You can't deny individual care based on population data unless you assume the individual *is* the population average.
