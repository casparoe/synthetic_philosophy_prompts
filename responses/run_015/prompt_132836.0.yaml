      *   *Underdetermination:* The current practice is underdetermined because it mixes rationing logic with medical truth claims. It rules out pure individualism (treating everyone based on unique biology) and pure populism (treating no one individually). It sits in a messy middle.
      *   *Giving up "Fact of the Matter":* If we admit risk isn't intrinsic, the threshold becomes arbitrary. It becomes a cutoff for funding, not health. Audits become about budget compliance, not clinical correctness. Explanation to patients shifts from "your risk is low" to "your risk profile places you lower on our priority list given our resources."
