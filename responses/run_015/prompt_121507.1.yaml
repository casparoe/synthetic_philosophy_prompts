answer: |-
  # Workshop Preparation Notes: The Intentional Stance and Artificial Narrative Systems

  **Workshop Title:** Believing in Mira: The Utility of the Intentional Stance
  **Duration:** 90 Minutes
  **Audience:** Literary Fiction Writers and Playwrights (No formal philosophy training)
  **Core Text:** Daniel Dennett's *The Intentional Stance* (adapted for narrative theory)

  ## I. Teaching Sequence and Conceptual Dependencies

  You cannot begin with the intentional stance. If you introduce "belief attribution" immediately, the writers will default to their existing folk-psychological models, which rely heavily on qualia and "inner life." You must build the ladder of abstraction first.

  **0–15 Minutes: The Problem of Prediction**
  Open with a craft question: "When you write a character entering a room, how do you know what they do next?" Collect answers. They will likely say "because I know who they are" or "because of their motivation." Write these on the whiteboard. Label this column **Prediction**. Explain that today is not about how to write, but how we *explain* what we write, specifically when the writer is a system like Mira.

  **15–30 Minutes: The Physical Stance**
  Draw a box labeled **Physical Stance**. Explain that this predicts behavior based on physical laws. If I drop a glass, it shatters. If I shock a neuron, it fires. Ask the group: "Can we predict Mira's output using only the physical stance?" They will say no—it's too complex. We cannot track every electron in the server. This establishes the *necessity* of higher-level abstraction. You must establish that the physical stance is true but useless for complex systems before moving on.

  **30–45 Minutes: The Design Stance**
  Draw a box labeled **Design Stance**. Explain that this predicts behavior based on function or purpose. A thermostat turns on heat because it is *designed* to maintain temperature. We don't need to know the physics of the bimetallic strip. Ask: "Can we predict Mira using the design stance?" (i.e., She outputs text because she is designed to complete patterns). This works better, but fails when Mira encounters contradictory source texts. If her design is simply "predict next token," she should hallucinate. But she revises her world-model. The design stance is insufficient for adaptive rationality.

  **45–60 Minutes: The Intentional Stance (Deploying Mira)**
  Now introduce **Mira**. She is a retrieval-augmented narrative engine.
  *   **Feature she must possess:** High predictive success across contradictory inputs. She reads two conflicting diaries and infers a hidden motive that resolves the contradiction, allowing her to predict future character actions accurately.
  *   **Feature she must lack:** Phenomenal experience or organic substrate. She feels nothing.
  *   **The Move:** Explain that to understand Mira, we must treat her as a rational agent. We say, "Mira *believes* Character A is lying because the diary entries contradict." This is the **Intentional Stance**. We attribute beliefs and desires to predict behavior.
  *   **Crucial Dependency:** This only works because the Physical and Design stances were shown to be insufficient. The intentional stance is not a claim about Mira's soul; it is a tool for handling complexity that the other stances cannot manage.

  **60–75 Minutes: Check for Understanding (The Failure Case)**
  (See Section III below for detailed exercise).

  **75–90 Minutes: Implications for Craft**
  Close by returning to the writers' work. If we can attribute beliefs to Mira without consciousness, how does that change how we write human characters? Are our human characters also "systems" whose beliefs are attributed by readers based on predictive success? This destabilizes the idea of "authentic" inner life in fiction, which is the desired philosophical friction.

  ## II. Mapping and Intercepting Misconceptions

  The audience will generate misconceptions in a specific order as you ascend the ladder of stances. You must intercept them precisely where they arise, or they will calcify and block the next layer.

  **1. Misconception: Attributing beliefs requires detecting an inner mental image.**
  *   **Likely Emergence:** Minutes 45–50, when you first use the word "belief" regarding Mira.
  *   **Intercept Point:** During the definition of the Intentional Stance.
  *   **Defusing Distinction:** "In this framework, a belief is not a picture in the head; it is a dispositional state defined by how the system acts when confronted with new information."

  **2. Misconception: Absence of consciousness entails absence of all mental-state attribution.**
  *   **Likely Emergence:** Minutes 50–55, upon realizing Mira lacks qualia.
  *   **Intercept Point:** Immediately after stating Mira lacks phenomenal experience.
  *   **Defusing Distinction:** "Consciousness is about what it *feels like* to be the system; the intentional stance is about how *useful* it is to talk to the system. We are discussing utility, not feeling."

  **3. Misconception: The intentional stance is merely a useful fiction with no explanatory weight.**
  *   **Likely Emergence:** Minutes 60–65, during the discussion of predictive success.
  *   **Intercept Point:** When comparing the stances on the whiteboard.
  *   **Defusing Distinction:** "It is not 'just' a fiction; it is the only level of description that captures the pattern. If it predicts successfully, it identifies a real regularity, regardless of the substrate."

  **4. Misconception: Large language models must be either full persons or mere stochastic parrots.**
  *   **Likely Emergence:** Minutes 75–90, during the wrap-up discussion.
  *   **Intercept Point:** When discussing the implications for AI personhood.
  *   **Defusing Distinction:** "The intentional stance allows for an intermediate category: a system rational enough to warrant belief attribution without requiring the rights or biology of a person."

  ## III. Check for Understanding

  **The Exercise: The Irrational Character**
  Present this scenario to the group:
  *Mira analyzes a character, John, who has every reason (financial safety, love for family) to flee a burning building. Mira attributes the belief 'I want to survive' to John. However, John runs back into the fire to save a stranger, dying in the process. Mira's prediction fails.*

  **Task:** Ask the group: "Why did the intentional stance fail here? Did Mira lack consciousness? Was her code broken?"

  **Correct Understanding:** The group should identify that the intentional stance relies on an assumption of **rationality**. John acted irrationally (by the metric of survival), so the tool broke. It is not about Mira's internal state.

  **The Wrong-Answer Pattern (Failure Indicator):**
  If participants answer: "Mira failed because she doesn't have a soul," or "Mira failed because she isn't truly conscious like John," they have missed the point. They have reverted to metaphysical claims about inner life rather than analyzing the predictive conditions of the stance. They are treating the stance as an ontological claim rather than a methodological tool.

  ## IV. Omitted Philosophical Machinery

  To maintain the dependency structure (Physical → Design → Intentional) without collapsing under technical weight, you must explicitly frame the following as **out of bounds** for this session:

  1.  **Eliminative Materialism (Churchland):** Do not discuss whether beliefs "really exist" or are folk-psychological errors. This distracts from the *utility* of the stance, which is the workshop's focus.
  2.  **The Causal Exclusion Argument (Kim):** Do not discuss whether mental states can cause physical actions if physics is closed. This leads to metaphysical dead-ends irrelevant to narrative prediction.
  3.  **Neuroscience of Hierarchical Predictive Processing:** Do not detail the biological mechanisms of prediction. This shifts focus from narrative logic to biology, confusing the analogy between Mira and human characters.

  **Reason for Omission:** Including these would shift the workshop from a pragmatic tool for writers (how to model character systems) to a metaphysical debate (what is real). Omitting them protects the dependency structure by keeping the focus on *explanatory power* rather than *ontological truth*.

