answer: |-
  **Session Title:** The Legacy Project
  **Time:** 75 Minutes
  **Participants:** 16 undergrads (4 tables of 4)
  **Materials:** Printed "Mission Packets" (4 copies), printed "Risk Menus" (4 copies), calculators (phones ok), whiteboard + markers. No money.

  ### The Setup
  Tell them: "You are advisors to a foundation with one grant left. You must choose between two projects. Your goal is to maximize 'Future Value Points' (FVP). There are no right answers, only consistent calculations."

  **The Options (On Whiteboard):**
  *   **Project Surety:** Guarantees **1,000 FVP** immediately.
  *   **Project Horizon:** Guarantees **10,000,000 FVP** *if* successful. 0 FVP if failed.

  ### Phase 1: The Scale (15 mins)
  Hand out **Sheet 1**. It states Project Horizon's success probability is **0.05% (1 in 2,000)**.
  *   **Task:** Calculate Expected Value (EV). Choose a project.
  *   **Math:** Surety = 1,000. Horizon = 10,000,000 × 0.0005 = 5,000.
  *   **Outcome:** Horizon wins 5-to-1 mathematically. Most will feel uneasy.
  *   **Facilitator Note:** Do not validate the unease. Just ask: "Did anyone choose Surety? Why?" (Record reasons: "Too risky," "Feels fake.")

  ### Phase 2: The Construction (35 mins)
  Tell them: "The 0.05% was a placeholder. You must derive the real probability."
  Hand out **Sheet 2 (Risk Menu)**. List 12 causal factors (e.g., "Technology functions," "No regulatory ban," "Future society values this," "No existential catastrophe," "Funding persists," "Team retains expertise").
  *   **Task:**
      1.  Select *only* the factors you believe are strictly necessary for success.
      2.  Assign a probability (0–1) to each selected factor.
      3.  Multiply them to get the Total Probability.
      4.  Recalculate EV. Choose again.
  *   **The Trap:** Tables will select different numbers of factors.
      *   Table A (Reductionists): Pick 3 broad factors (e.g., 0.8 × 0.8 × 0.8 = 0.51). EV = 5,100,000. Horizon wins massively.
      *   Table B (Granularists): Pick 8 specific factors (e.g., 0.9^8 = 0.43). Wait, needs to be starker.
      *   *Correction for Impact:* Instruct them: "If you aren't sure a factor is covered by another, list it separately." Granularists will chain 10 links at 0.9 each (0.35). Reductionists chain 3 links at 0.7 each (0.34).
      *   *Better Mechanism:* Give them the **Risk Menu** but tell half the tables: "Model this as a **Technical** challenge." Tell the other half: "Model this as a **Societal** challenge."
      *   *Technical:* 3 steps (Build, Test, Deploy). Probabilities high (0.9). Total ~0.7.
      *   *Societal:* 6 steps (Build, Regulate, Adopt, Maintain, No War, Value Alignment). Probabilities high (0.9). Total ~0.53.
      *   *Actually, to get the order-of-magnitude shift you requested:* The payoff must be high enough that even tiny probs win, OR low enough that tiny probs lose.
      *   *Revised Payoff:* **100,000,000 FVP**.
      *   Table A (3 links @ 0.5): Prob = 0.125. EV = 12.5 million. (Horizon Wins).
      *   Table B (7 links @ 0.5): Prob = 0.0078. EV = 780,000. (Surety Wins).
      *   *Result:* Same optimism per link, different structure, opposite decisions.

  **The Wrinkle (Counterfactuals):**
  Add a line on Sheet 2: "Subtract 10% from your final probability for every factor you think 'someone else would have done anyway'." This forces them to estimate marginal contribution vs. total value.

  ### Phase 3: The Conflict (10 mins)
  Ask each table to write their Final EV and Choice on the whiteboard.
  *   **Predictable Chaos:** Table 1 says Horizon EV = 50M. Table 2 says Horizon EV = 200k.
  *   **Reaction:** They will accuse each other of bad math or rigged inputs.
  *   **Facilitator:** Say nothing. Let them argue. Ask: "Did anyone use different numbers of factors?" Reveal the chain lengths.

  ### Debrief (15 mins)
  Map the room experience to the philosophy.
  1.  **Phase 1 Feeling:** "That probability felt made up." → **The Scale Intuition.** Small prob × Huge Stake > Certainty.
  2.  **Phase 2 Discovery:** "Table 1 wasn't more optimistic than Table 2; they just modeled the world with fewer steps." → **The Telescoping Problem.** Your EV depends on how you carve reality into links. Granularity looks like rigor but acts as a tax on probability.
  3.  **The Wrinkle:** "Did you discount for overlap?" → **Counterfactuals.** The value of the cause ≠ the value of *your* action.
  4.  **The Reveal:** Name the concepts. "This is the core tension of **Longtermism**. The axiology (Phase 1) is robust; the epistemology (Phase 2) is fragile."

  ### Predicted Failures & Fixes
  *   **"This is rigged."**
      *   *Fix:* Agree with them. "Yes. The model is rigged by your structural choices. That is the lesson. In real policy, the rigging is invisible."
  *   **Analysis Paralysis:**
      *   *Fix:* Hard stop at 35 mins. "Submit your current best guess."
  *   **Ignoring the Chain:**
      *   *Fix:* Walk around during Phase 2. If a group picks one factor "Success," force them to split it into "How?"

  ### Limitations (Read this aloud)
  "This game cannot reproduce the **Single History Problem**. In the game, you can imagine running the lottery 1,000 times to check your EV. In reality, history runs once. You never know if your 0.01% probability was correct or if you just got lucky/unlucky. Expected value is a guide for repeated decisions; this is a decision about the only game board we have."

  ### The One Sentence
  If asked: "Isn't this just Pascal's Wager?"
  **Say:** "Pascal's Wager uses infinity to bypass evidence; this argument uses astronomical but finite stakes to demand we account for leverage."

  ### Materials Checklist
  *   **Sheet 1:** Options & Placeholder Prob.
  *   **Sheet 2:** Risk Menu (12 items) + Counterfactual Note.
  *   **Whiteboard:** Pre-drawn table for EV results.
  *   **Calculators:** Ensure phones are allowed.

  Keep the tone neutral. You are not selling longtermism; you are simulating the cognitive friction it produces. Let the math do the arguing.
