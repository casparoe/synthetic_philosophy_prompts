answer: |-
  Here is a session plan designed for your specific audience (technical, skeptical, Bayesian-literate but rusty) and constraints (90 minutes, whiteboard, specific objections).

  ### 1. The Explanatory Sequence & Dependency Reasoning

  Do not start with "Humanity." Start with the abstract mechanism. If you start with humanity, the emotional weight of "Doom" will contaminate the probabilistic reasoning. You need to build the engine before putting it in the car.

  **The Order:**
  1.  **Variables & Priors (15 mins):** Define $N$ (total observers) and $P(N)$ (prior belief).
  2.  **Indexical Information (15 mins):** Define $n$ (your rank). Distinguish *finding* a number from *being* a number.
  3.  **The Likelihood/SSA (20 mins):** Establish $P(n|N)$. This is the Self-Sampling Assumption.
  4.  **The Update (15 mins):** Show the posterior shift.
  5.  **Mapping to Humanity (15 mins):** Translate $N$ to time. Distinguish "Small Total" from "Imminent End."
  6.  **Objections & Scope (10 mins):** SIA, Reference Class, Out-of-Scope items.

  **Dependency Reasoning:**
  *   **Prior before Update:** You cannot demonstrate a Bayesian shift without establishing the baseline. The Econ PhD needs to see that the force of the argument depends on the prior's shape (e.g., scale-invariant vs. flat).
  *   **Indexicality before Likelihood:** You must separate "There exists a person with rank $n$" (trivial) from "I am the person with rank $n$" (evidence). If you don't make this distinction first, the "Somebody had to be first" objection will derail the room immediately.
  *   **Likelihood before Application:** You must secure agreement on the sampling assumption (SSA) in the abstract Urn case before applying it to humans. If they reject SSA for humans but accept it for Urns, you have isolated the disagreement to the *analogy*, not the *math*.
  *   **Total Size before Time:** "Doomsday" implies time. The argument strictly concludes about population size ($N$). Converting $N$ to time ($T$) requires an assumption about population growth rates. If you conflate these, the "population plateau" objection arises too early.

  ### 2. The Carrying Example

  **Use the Urn.**
  Specifically: *The Urn Without a Drawer.*

  **The Setup:** "Imagine a causal process produces an urn containing tickets numbered 1 to $N$. You do not know $N$. You do not see the urn. You simply find a ticket in your pocket with number $n$ on it. You know you are a random sample from the tickets in the urn."

  **Why the Urn (and not the Hotel):**
  *   **What it has:** Discrete integers. Programmers prefer discrete state spaces. It cleanly separates the *value* of the ticket from the *physicality* of the container.
  *   **What it lacks:** It lacks spatial simultaneity. A hotel implies all rooms exist *now*. Humanity is temporal. The Urn is abstract enough to map to temporal sequences without implying the future already exists (block universe), which is a separate metaphysical battle.
  *   **Addressing your worry:** You are correct that a "friendly experimenter" smuggles in the randomness. By removing the experimenter and stating "You simply find a ticket," you force the **Self-Sampling Assumption (SSA)** to be an explicit premise rather than a hidden feature of the story. You write "SSA: I am a random sample" on the board. This makes the contested assumption visible.

  **What the Hotel would import:**
  The Hotel case imports spatial location. It invites questions like "Are the other rooms empty?" or "Can I walk to them?" It distracts into metaphysics of existence rather than epistemology of sampling.

  ### 3. The Misconception Map

  Here is when to raise which objection. **Do not wait for them to raise the first one.** If you wait, the first 30 minutes become a debate on inevitability, and the Bayesian mechanism never gets on the board.

  | Objection | When to Head Off | How to Frame It |
  | :--- | :--- | :--- |
  | **"Somebody had to be at rank $n$."** | **Minute 20** (During Indexical Info). | Raise it yourself. "You might say 'Someone had to be #100 billion.' True. But *you* being #100 billion is the evidence. If $N$ were 1 trillion, it would be unlikely for *you* specifically to be so early." |
  | **"This is just German Tank."** | **Minute 35** (During Likelihood). | Acknowledge it. "Yes, the math is identical. The controversy isn't the math; it's whether humans are like tanks. Tanks are captured randomly. Are births random?" |
  | **"SIA cancels it."** | **Minute 70** (During Objections). | Treat as a competing prior, not a refutation. "SIA weights worlds by observer count. It changes the Prior, not the Likelihood. It's a different starting axiom, not a logical error in DA." |
  | **"Reference Class is free."** | **Minute 75** (During Objections). | Concede the parameter. "Yes, 'human' is fuzzy. But 'conscious observer' is not arbitrary. The argument holds for any non-arbitrary class you place yourself in." |
  | **"Spend more on X-risk."** | **Minute 5** (Scope Setting). | **Rule out of scope immediately.** "This session is about epistemology (what we believe), not prudence (what we do). Even if DA is true, action depends on utility functions." |

  **Explicit Out-of-Scope List (Write on Board):**
  1.  **Action-Guiding:** We are not deciding policy today.
  2.  **Adam & Eve / Shooting Room:** We are not discussing causal anomalies or magical thinking.
  3.  **The "Delta T" Argument:** (See below).

  ### 4. Handling the Specific Constraints

  **The Cousin Argument (Future ~ Past / Gott's $\Delta t$)**
  *   **Decision:** **Rule it out.**
  *   **Reasoning:** This argument relies on a scale-invariant prior over *time* ($1/t$), whereas Doomsday relies on a prior over *population* ($1/N$). They are mathematically distinct. Folding it in confuses the specific Bayesian mechanism of the DA (rank update) with a generic Copernican principle.
  *   **Script:** "There is a related argument by Gott about temporal duration. It uses a different prior structure. To keep the mechanism clear, we are isolating the Population Rank argument only. If we mix them, we won't know which premise is doing the work."

  **The Simulation Hypothesis**
  *   **Decision:** **Treat as a Legitimate Extension.**
  *   **Reasoning:** It is not a reductio; it is a boundary condition test for the Reference Class.
  *   **Script:** "If most observers are simulated, does 'human' include them? If yes, $N$ explodes and the shift vanishes. If no, why are you sure you aren't one? This doesn't refute the DA; it shows the DA is sensitive to the definition of the Reference Class. It turns the argument into a probe for 'What kind of observer am I?'"

  ### 5. The Final Ten Minutes: The Mechanism Check

  Do not ask "Do you believe the Doomsday Argument?" That tests tribal affiliation.
  Do not ask them to write Bayes' Theorem. That tests notation memory.

  **The Test: The Two-Universe Diagnostic**
  Draw two boxes on the whiteboard.

  *   **Universe A:** Total Humans ($N$) = 100 Billion.
  *   **Universe B:** Total Humans ($N$) = 100 Trillion.
  *   **Prior:** You think A and B are equally likely (50/50).
  *   **Observation:** You learn your birth rank ($n$) is 50 Billion.

  **Ask the room:**
  1.  "In which Universe was this observation more likely?" (Answer: A. In B, you'd likely be much later).
  2.  "So does the probability of Universe A go up or down?" (Answer: Up).
  3.  **The Kicker:** "Now, change the observation. You learn your birth rank is 99 Trillion. Which Universe is now favored?" (Answer: B, because A is impossible).
  4.  **The Mechanism Question:** "If I told you that the *Prior* for Universe B was 1,000 times higher than A, would the rank of 50 Billion still shift probability toward A?" (Answer: Yes, but maybe not enough to overtake B. This tests if they understand the *shift* vs. the *final conclusion*).

  **Why this works:**
  *   It requires no notation.
  *   It forces them to run the likelihood comparison ($1/N_A$ vs $1/N_B$).
  *   It separates the *direction* of the update (which is the DA mechanism) from the *magnitude* of the conclusion (which depends on priors).
  *   If they say "It doesn't shift, because somebody had to be 50 billion," they failed to grasp the indexical likelihood.
  *   If they say "It shifts to B," they failed to grasp the sampling density.

  ### Session Timeline Summary

  *   **00-05:** Intro & Scope (Rule out Action/Adam-Eve).
  *   **05-20:** The Urn (Variables, Prior, Indexical Info). **Raise "Somebody had to be" here.**
  *   **20-40:** The Likelihood (SSA). **Address "German Tank" here.**
  *   **40-55:** The Update (Whiteboard the shift).
  *   **55-70:** Map to Humanity (Size vs. Time).
  *   **70-80:** Objections (SIA, Reference Class, Sims).
  *   **80-90:** **The Two-Universe Diagnostic.**

  This plan respects their technical background by isolating the algorithm, manages the philosophical landmines by sequencing the objections, and verifies comprehension by testing the update mechanism rather than the controversial conclusion.
