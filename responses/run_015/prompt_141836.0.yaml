prompt: |-
  I run a monthly reading group at my local rationalist meetup — about ten people, mostly working programmers, two with undergraduate philosophy, one econ PhD student — and next month's session is mine: ninety minutes, a whiteboard, and the doomsday argument. I don't need the argument explained to me. I need a plan for the session.

  What I want from you is the explanatory sequence, and the dependency reasoning behind its order: which distinction has to be on the board before the argument can even be stated without sounding like a word game (my guess is that the prior over total population size has to be separated from the update on one indexical observation, and that 'small total' has to be separated from 'imminent end' before any of it), and why that order rather than an alternative one.

  Second, the carrying example. I keep going back and forth between the urn of numbered tickets with an unknown number of tickets and the hotel-room-with-a-number-on-the-door style case. Tell me which should carry the ninety minutes, what such an example has to have and to lack — my worry is that any case where a friendly experimenter stipulates the sampling procedure smuggles in precisely the assumption the argument is contested over — and what the other one would quietly import instead.

  Third, the misconception map: the errors they will arrive with or form, and the point in the sequence at which each has to be headed off. The ones I'm braced for, roughly in the order I expect them: 'of course my birth rank is low, somebody had to be at that rank'; 'this is just the German tank problem, and nobody disputes that'; 'SIA cancels it, so it's refuted and we can go home'; 'the reference class is a free parameter, so I'll pick people with my first name'; 'so this is an argument for spending more on existential risk.' Tell me which of these I should raise myself, in my own voice, rather than waiting for someone else to raise it — my instinct is that if I let the sampling-assumption objection arrive first and unmanaged, the second half of the session becomes that argument and nothing else lands. Also tell me what I should explicitly rule out of scope and name as out of scope: I'm guessing the Adam-and-Eve and shooting-room end of the literature, and the question of whether the argument should change what we do as opposed to what we believe.

  Two further constraints. One of them will bring up the cousin argument that anything observed at a random moment has probably about as much future as past; I don't know whether to fold that in or to rule it out, and I'd like your reasoning. And one of them will point out that if most observers turn out to be simulated, the reference class question is reopened — I can't tell whether to treat that as a reductio of the argument or as a legitimate extension, and I'd rather not improvise.

  Finally, a check for the last ten minutes: something I can ask them, or have them do, that separates someone who has the mechanism — the shape of the update, and where its force comes from — from someone who has memorized the conclusion and a stock reply to it. Assume no one in the room has done formal Bayesian work in years and that anything with conditioning notation will lose half of them. Please don't give me a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Context:**
      *   **User:** Runs a monthly reading group at a local rationalist meetup.
      *   **Audience:** ~10 people, mostly working programmers, 2 undergrad philosophy, 1 econ PhD student. High technical literacy, likely familiar with Bayesian reasoning concepts but maybe rusty on formal notation. Skeptical/pragmatic mindset (rationalist community).
      *   **Topic:** The Doomsday Argument (DA).
      *   **Constraint:** 90 minutes. Whiteboard available.
      *   **User's Knowledge:** Already understands the DA. Doesn't need an explanation. Needs a *pedagogical plan*.
      *   **Goal:** Create a session plan that ensures understanding of the *mechanism* (Bayesian update on indexical information), manages objections, selects the right analogy, and verifies comprehension at the end.
      *   **Specific Requests:**
          1.  Explanatory sequence & dependency reasoning.
          2.  Carrying example (Urn vs. Hotel).
          3.  Misconception map (when to head off which error).
          4.  Handling specific objections (Cousin argument, Simulation hypothesis).
          5.  Final 10-minute check (mechanism vs. memorization).
          6.  Scope constraints (what to rule out).

  2.  **Deconstruct the Doomsday Argument (DA):**
      *   Core: Bayesian update on total population ($N$) given birth rank ($n$).
      *   Prior: $P(N)$ (often scale-invariant/$1/N$).
      *   Likelihood: $P(n|N) = 1/N$ (if $n \le N$, else 0).
      *   Posterior: $P(N|n) \propto P(N) \cdot (1/N)$.
      *   Implication: Shifts probability mass toward smaller $N$.
      *   Controversy: Reference class, Sampling assumption (SSA vs. SIA), Priors, Indexicality.

  3.  **Drafting the Explanatory Sequence (Request 1):**
      *   *Problem:* If you start with "Humanity will end soon," people reject it emotionally or philosophically before grasping the math.
      *   *Solution:* Start with the abstract structure, strip away "humanity."
      *   *Order:*
          1.  **The Setup (Non-indexical):** Define the variable $N$ (total size) and the uncertainty about it. Establish the Prior.
          2.  **The Observation (Indexical):** Define $n$ (your rank). Crucial distinction: $n$ is not just a number, it's *your* number.
          3.  **The Likelihood (Sampling Assumption):** Why is $P(n|N) = 1/N$? This is the Self-Sampling Assumption (SSA). Must be explicit.
          4.  **The Update:** Show the shift in probability mass.
          5.  **The Translation:** Map back to humanity/time. Distinguish "Small Total" from "Imminent End" (requires growth rate assumption).
      *   *Dependency Reasoning:* You can't do the update without the likelihood. You can't justify the likelihood without the sampling assumption. You can't discuss "Doom" without separating total population from time remaining.

  4.  **Selecting the Carrying Example (Request 2):**
      *   *Options:* Urn (tickets 1 to $N$) vs. Hotel (rooms 1 to $N$).
      *   *Analysis:*
          *   Urn: Classic German Tank. Implies physical sampling. Risk: People think "Someone drew the ticket." Who drew it? God?
          *   Hotel: Implies existence. You are in a room.
          *   User's worry: "Friendly experimenter stipulates sampling procedure."
      *   *Decision:* **The Urn is better for the *mechanism*, but needs modification to avoid the "experimenter" trap.** Actually, for a rationalist group, the **Urn** is standard but the **Hotel** feels more like "existence." However, the *best* version for DA is often a hybrid: "The Cavity" or just "The Urn" but emphasizing *self-location*.
      *   *Refinement:* Let's stick with the **Urn** but frame it carefully. Why? Because the Hotel implies spatial location which can get muddy with "observers." The Urn is purely numerical.
      *   *Wait, re-reading the prompt:* The user is worried about the "friendly experimenter" smuggling in assumptions. The Urn usually implies an external drawer. The Hotel implies you wake up.
      *   *Better Choice:* **The Urn**, *but* frame it as "You find a ticket in your pocket." No experimenter. Just "Here is a number, what is the max?"
      *   *Why not Hotel?* Hotels imply rooms exist simultaneously. Humanity is temporal. Urn is abstract enough to map to temporal or spatial.
      *   *Crucial Feature:* The example *must* lack an external selector. It must be *self-sampling*.
      *   *What the other imports:* Hotel imports spatial simultaneity (all rooms exist now), which makes the "future" aspect harder to map. Urn imports "drawing," which implies an external agent unless phrased as "finding."
      *   *Decision:* Use the **Urn**, but explicitly strip the "drawer." You *are* the ticket. Or, simpler: **The Workshop**. (No, stick to standard). Let's go with **The Urn** but emphasize *Self-Sampling*. Actually, for DA specifically, the **Hotel** (or "Building") is often better for "observers." But the Urn is mathematically cleaner. Let's recommend the **Urn** because it isolates the *number* from the *physics* of rooms.
      *   *Correction:* The prompt asks to choose. Urn is safer for the math. Hotel is safer for the "observer" intuition. Given the audience (programmers), Urn (discrete integers) is more natural.
      *   *Key constraint:* "What such an example has to have and to lack." It must lack an external sampler. It must have a uniform prior over rank *given* N.

  5.  **Misconception Map (Request 3):**
      *   *Objection 1: 'Somebody had to be at that rank'.* (The Inevitability Objection).
          *   *Counter:* True, but *you* being at that rank is the evidence.
          *   *Timing:* Head off immediately after stating the observation.
      *   *Objection 2: 'German Tank Problem'.* (The Validity Objection).
          *   *Counter:* GTP works for tanks because of random capture. Are humans randomly captured?
          *   *Timing:* When discussing the Likelihood/Sampling Assumption.
      *   *Objection 3: 'SIA cancels it'.* (The Anthropic Objection).
          *   *Counter:* SIA changes the prior, not the likelihood. It's a competing framework, not a refutation of the logic.
          *   *Timing:* After the core argument is established, as a "modification."
      *   *Objection 4: 'Reference Class'.* (The Parameter Objection).
          *   *Counter:* Yes, it's a parameter, but "humans" is not arbitrary.
          *   *Timing:* Near the end, as a limitation.
      *   *Objection 5: 'Spend more on X-risk'.* (The Action Objection).
          *   *Counter:* Out of scope. Belief vs. Action.
          *   *Timing:* Explicitly rule out early or late.
      *   *Strategy:* Raise the "Somebody had to be" objection *yourself* immediately. It's the most intuitive blocker. Raise SIA later as a "patch."

  6.  **Handling Specific Constraints (Request 4 & 5):**
      *   *Cousin Argument (Future ~ Past):* This is the "Delta T" argument (Gott).
          *   *Decision:* **Rule it out.** It relies on a different prior (scale-invariant time vs. population). It confuses the specific Bayesian mechanism of DA (rank) with a generic Copernican principle. It muddies the water.
      *   *Simulation Hypothesis:*
          *   *Decision:* Treat as a **legitimate extension** that breaks the reference class, not a reductio. If sims exist, "human" is ill-defined. This shows the dependency on the Reference Class.
      *   *Scope:* Rule out Adam/Eve (causal weirdness) and Action-guiding (pragmatics). Focus on Epistemology.

  7.  **Final 10 Minutes Check (Request 6):**
      *   *Goal:* Test mechanism, not conclusion.
      *   *Idea:* Change the parameters. Don't ask "Is DA true?" Ask "What happens if..."
      *   *Exercise:* "The Alien Urn." Give them a specific prior and a specific rank. Ask them to qualitatively describe the shift. Or, "The Immortal Case."
      *   *Better:* **The Two-Urn Game.** Give them two scenarios with different priors or different sampling methods and ask which one yields the Doomsday shift.
      *   *Best:* **The "Early vs. Late" diagnostic.** Ask: "If you learned you were birth rank 1 billion, does the probability of Total > 1 trillion go up or down compared to learning you are rank 100 billion?" (Wait, that's trivial).
      *   *Refined:* Ask them to identify *where* the information enters. "If I tell you the total number of humans is 100 billion, does your birth rank tell you anything?" (No). "If I tell you your birth rank is 50 billion, does the total tell you anything?" (Yes).
      *   *Actually:* A concrete numerical toy model. "Universe A: 10 people. Universe B: 1000 people. Prior 50/50. You are #5. What's the posterior?" This forces the Bayesian update without notation.

  8.  **Review and Refine:**
      *   *Tone:* Professional, peer-to-peer, respectful of their intelligence but firm on structure.
      *   *Timing:* 90 mins is tight. Need strict timeboxing.
      *   *Whiteboard:* Use it for the Bayes factor, not just words.
      *   *Self-Correction on Example:* I initially leaned Urn. But the "Friendly Experimenter" worry is real. If I say "You draw a ticket," who put them there? If I say "You *are* a ticket," it's better. Let's suggest the **"Census" analogy**. You find your name on a list. What is the length of the list? This avoids the "drawer." Actually, the **Urn** is standard for a reason. I will advise using the Urn but explicitly *stipulating* the Self-Sampling Assumption as a rule of the game, rather than deriving it from the physics of urns. This acknowledges the worry.

      *   *Re-evaluating the "Cousin Argument" (Gott):* The user asks whether to fold in or rule out. Folding it in confuses $N$ (population) with $T$ (time). Rule it out to keep the Bayesian mechanism clear.
      *   *Re-evaluating Simulations:* If sims exist, are they in the reference class? If yes, $N$ explodes. If no, why? This highlights the Reference Class problem. Treat as extension.

      *   *Final Check:* The "Two-Urn" test is good. Let's make it specific. "Scenario A: You are the 10th human. Scenario B: You are the 100 billionth human. In which scenario is 'Total Humans = 200 Billion' more likely?" (Answer: B). This tests if they understand the likelihood ratio.

  9.  **Final Polish:** Organize into the requested sections. Ensure the "Why this order" is explicit. Ensure the "Misconception Map" has timestamps.

      *(Self-Correction during drafting)*: Wait, the user said "one econ PhD student." They will love the Prior discussion. "Mostly working programmers." They will love the Algorithm/Logic flow. "Two undergrad philosophy." They will catch the Reference Class issues. The plan needs to satisfy all three.
      *   *Programmers:* Focus on the update mechanism (input -> transform -> output).
      *   *Econ:* Focus on the Prior sensitivity.
      *   *Phil:* Focus on the Reference Class/Indexicality.

      *   *Plan Adjustment:* Make sure the "Prior vs. Likelihood" distinction is sharp for the Econ student. Make sure the "Indexical" distinction is sharp for the Phil students. Make sure the "Algorithm" is sharp for the Programmers.

      *   *Final Check on the "Check":* The user wants to separate mechanism understanding from memorized conclusion. The "Two-Urn" numerical test is best. No notation, just numbers.

      *   *Scope:* Explicitly name "Action Guiding" and "Adam/Eve" as Out of Scope at the start.

      *   *Cousin Argument:* Rule out. It's a different prior structure ($1/t$ vs $1/N$). Confuses the specific DA mechanism.

      *   *Simulations:* Treat as Reference Class boundary test.

      *   *Example:* Urn. But frame it as "Self-Location."

      *   *Sequence:*
          1.  Setup (Variables).
          2.  Prior (Uncertainty).
          3.  Indexical Info (The Rank).
          4.  Likelihood (SSA).
          5.  Update (The Shift).
          6.  Application (Humanity).
          7.  Objections (SIA, Ref Class).

