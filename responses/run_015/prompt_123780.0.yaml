  Process P requires Volition V.
  Is V a Craving?
  If V is a Craving, then the path to "No Craving" is paved with Craving.
  If V is *not* a Craving, how is it distinguished from the Cravings it suppresses? They both feel like "wanting."
  The framework lacks a category for "Non-Craving Volition."

  Let's write this.

  *(Final Check against constraints)*
  - Structured scenario? Yes.
  - Systematic elimination of one class generates second-order craving? Yes.
  - Cannot classify as suffering or absence? Yes.
  - Specify exact conceptual fracture? Yes (Individuation of Volitional States).
