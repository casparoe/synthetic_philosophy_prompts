  *   **Fit:** It fits all six cases tightly.
      *   High Blame (6.4, 6.1, 7.8) → High Yes (81%, 77%, 93%).
      *   Low Blame (0.8, 1.4) → Low Yes (22%, 16%).
      *   Medium Blame (3.2) → Medium Yes (64%).
      *   It explains Case 4 naturally: The manager expressed regret and constraint, so blame dropped, and "intentionally" dropped with it.
  *   **Prediction for Case 7:** The agent is following mandatory orders, tried to mitigate the harm (asked for exemption), and claims no personal stake. Blame should be low (similar to or lower than Case 4).
  *   **Predicted Number:** **30% to 45%** (Aligns with the reduced blame of a constrained agent).

  **Rule C: The Norm Rule (The "Reasons" Hypothesis)**
  *   **The Rule:** People call a side effect intentional if the agent failed to treat it as a reason *not* to act (i.e., they violated a norm of giving the consequence appropriate weight).
  *   **Fit:** It fits all six cases.
      *   Case 1 & 3: Agent ignored the harm (Norm violated) → Intentional.
      *   Case 2: Agent ignored the help (No norm requires helping) → Unintentional.
      *   Case 4: Agent tried to avoid harm but couldn't (Norm partially upheld) → Less Intentional.
      *   Case 5: Agent welcomed the harm (Norm grossly violated) → More Intentional.
      *   Case 6: Agent didn't cause it (No agency/norm violation regarding outcome) → Unintentional.
  *   **Prediction for Case 7:** The agent *did* treat the harm as a reason not to act (he wrote to the regulator). He was overruled by a higher authority. He did not violate the norm of "trying to prevent harm."
  *   **Predicted Number:** **30% to 45%** (Aligns with Blame Rule).

  **Do they diverge on 1–6?**
  Yes, on Case 4. The Friend's Rule predicts Case 4 should look like Case 1 (both are "Bad"). It only fits if you dismiss the 17-point drop as noise. The Blame and Norm Rules predict the drop because the agent's *attitude* and *constraints* changed. Since your friend treats gaps under 15 points as noise, he considers them identical. I consider Case 4 the most important data point you have: it proves that "Badness" alone is not enough; the agent's relationship to the badness matters.

  ### 2. My Prediction for Case 7

  I predict **38% (range 35–45%)** answering "Yes."

  **Reasons:**
  1.  **Authority Mitigation:** In ordinary speech, "intentionally" implies a degree of free choice that Case 7 removes. The regulator made the decision; the officer merely transmitted it. This is distinct from Case 1, where the manager *chose* profit over kids.
  2.  **Attempted Mitigation:** Unlike Case 1 (where he "didn't care"), the officer in Case 7 actively tried to stop the harm (wrote for exemption). This signals to respondents that he *did* give the consequence weight, satisfying the Norm Rule and lowering Blame.
  3.  **The "I don't care" Trap:** The officer's statement ("I don't have any personal feelings") is cold and mirrors Case 1. This will prevent the score from dropping to Case 2 levels (22%). It anchors the score in the 30–40% range rather than the teens.

  **What would surprise me:**
  *   **Above 65%:** This would imply that "following orders" does not reduce perceived agency in folk psychology, and that foresight of harm is the *only* thing that matters. It would validate the Friend's Rule and suggest Case 4 was indeed noise.
  *   **Below 25%:** This would imply that "following orders" completely absolves agency, making the action indistinguishable from the "no causation" Case 6.

  ### 3. Distinguishing the Blame Rule from the Norm Rule

  You asked for the shortest change to one of the stories to separate the Blame Rule from the Norm Rule. These two rules usually move together (we blame people who violate norms). To separate them, we need a case where an agent **violates a norm** (Norm Rule says Intentional) but **deserves no blame** (Blame Rule says Unintentional).

  **The Vignette (Modification of Case 1):**
  Keep Case 1 exactly the same, except change the manager's reason for speaking.
  *   **Change:** After the analyst mentions the traffic, the manager says: "I don't want that noise. But if I don't cut costs by 12% today, the company goes bankrupt tonight and *everyone* loses their job, including the teachers at that school. I have no choice."
  *   **Blame Rule Prediction:** **Low "Yes" (approx. 30%).** Respondents will not blame a manager saving the entire company and the teachers' jobs. If "intentionally" tracks blame, the score drops.
  *   **Norm Rule Prediction:** **High "Yes" (approx. 75%).** The manager still chose the option knowing it would harm the school. He treated the harm as a cost he was willing to incur to save the company. He violated the norm of "do not harm children," even if justified. If "intentionally" tracks the weighing of reasons, the score stays high.

  **Why this works:**
  The Blame Rule looks at the *agent's moral standing* (Is he a bad guy?). The Norm Rule looks at the *structure of the decision* (Did he allow the harm to happen as part of his plan?). In a "Necessary Evil" scenario, the agent is good (Low Blame), but the harm is still intentional (High Norm Violation).

  ### 4. Your "Willingness Rule"

  You proposed: *People call a consequence intentional when the agent was willing to have it happen; indifference counts as willingness.*
  Case 2 (Help/Indifferent) killed this because he was willing (indifferent) but respondents said "No."

  **Can it be repaired?**
  Only by collapsing it into the Norm Rule.
  To save your rule, you must add a clause: *"Willing to have it happen **despite a reason not to**."*
  *   In Case 1 (Harm), there is a reason not to harm. He was willing. → Intentional.
  *   In Case 2 (Help), there is no reason not to help. His willingness is irrelevant. → Unintentional.

  Once you add "despite a reason not to," you are no longer talking about willingness; you are talking about **norm violation**. You should drop the "Willingness" label. It misleads you into thinking it is about the agent's internal state, when the data shows it is about the agent's relationship to social expectations.

  ### 5. What Is At Stake

  You asked: *If Case 7 comes in near 30%, have we learned something about what "intentionally" means in ordinary speech, or only something about how to word a survey?*

  We have learned something about **meaning**.

  If the result is 30%, it proves that the word "intentionally" is not a technical term describing a mental state (like "foresight"). If it were just about mental states, the officer in Case 7 foresaw the harm just as clearly as the manager in Case 1. The percentage should be the same.

  If the percentage drops, it proves that "intentionally" is a **moral concept**. We do not use the word simply to describe cause-and-effect in the brain. We use it to assign responsibility. When responsibility is removed (by authority, constraint, or lack of blame), the word "intentionally" no longer fits, even if the mental state is identical.

  This is not a survey artifact. It is evidence that ordinary language does not separate "facts" (what happened) from "values" (who is at fault). Your friend's survey is measuring the boundary where facts turn into blame.

  **Summary Commitment:**
  *   **Friend's Prediction:** 78%
  *   **My Prediction:** 38%
  *   **Reason:** "Intentionally" tracks blame and norm violation, not just foresight. Authority and mitigation reduce blame.
  *   **Stake:** The definition of human agency in everyday language is moral, not mechanical.
