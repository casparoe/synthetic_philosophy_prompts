      *   **User's Goal:** Prove the supervisor "half wrong" without rehashing the empirical debate on linguistic relativity. Needs a reading that takes film and grounding literature seriously.
      *   **Specific Focus:**
          1.  How Louise moves from symbol-to-symbol mapping (ostension) to understanding (grounding).
