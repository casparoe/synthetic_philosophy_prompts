      *   *Key Philosophical References to Weave In:* Harnad (SGP), Wittgenstein (PI), Brandom (Inferentialism), Dretske/Fodor (Causal/Informational), maybe Burge (Anti-individualism).
      *   *Specific Scenes:* The whiteboard sessions (early), the Mahjong/General Shang confrontation (middle/late), the final phone call (end).

      *   *Refining the "Teleological" point:* Be careful not to say "future causes past." Say "truth conditions are tenseless, so grounding conditions are tenseless." The symbol is grounded in the *whole timeline*, not the causal origin.

      *   *Refining the "Cheating" point:* The film conflates *learning* with *ontological change*. This is a bug for cognitive science but a feature for metaphysics of meaning.

  7.  **Final Review against User Constraints:**

      *   *Did I avoid the empirical Whorf debate?* Yes.
