  2.  **Deconstruct the Supervisor's Objection:**

      *   *Claim:* It's Hollywood Whorfianism (language determines thought in a magical way).
      *   *Claim:* Irrelevant to SGP (Harnad's problem: how symbols get meaning vs. just shuffling symbols).
      *   *Counter-Strategy:* Agree it's Whorfian, but argue the *mechanism* depicted offers a specific model of grounding (pragmatic/normative) that challenges causal-informational accounts. The "magic" isn't the relativity, it's the *acquisition process*.

  3.  **Address the Early Stretch (Ostension to Understanding):**

      *   *Scene:* The whiteboard sessions (pointing at "Louise," "Ian," objects).
      *   *Problem:* This is exactly the "dictionary in a room" problem. Pointing at a table doesn't ground "table" without shared intent.
      *   *Candidate 1: Perceptual Contact.* (Bodies, ink). Weak. The ink appears magically. The aliens are hidden.
      *   *Candidate 2: Shared Purposive Action.* (Games, rituals). Stronger. Establishes joint attention.
      *   *Candidate 3: Normative Practice (Mahjong).* Strongest. The "Weapon/Tool" ambiguity isn't semantic; it's pragmatic. It depends on the *game* being played (cooperative vs. competitive).
      *   *Verdict:* This aligns with Wittgenstein/Brandom. Grounding isn't causal contact; it's entry into a "game of giving and asking for reasons." The film supports a *practice-first* grounding.

  4.  **Address the Late Stretch (Non-linear Time/Teleological Grounding):**

      *   *Phenomenon:* Louise remembers the future. Her symbols (logograms) trigger experiences of events that haven't happened causally yet.
      *   *User's Hypothesis:* Teleological Grounding (anchored by future orientation/action).
      *   *Conservative Story:* Testimony/Trust. She trusts the Heptapods' grounded terms.
      *   *Computational Story:* Pattern learning + mystical garnish.
      *   *Analysis:*
          *   *Computational:* Dismissible as too reductive. The film explicitly shows her *experiencing* the future, not just predicting it. The phenomenology matters for grounding.
          *   *Conservative (Testimony):* Plausible for *reference*, but fails on *sense*. She doesn't just know the word; she lives the time.
          *   *Teleological:* This is the innovative angle. If meaning is use (Wittgenstein), and the "use" of the language is to navigate a block universe, then the grounding is indeed tied to the *completion* of the timeline.
          *   *Verdict:* The film *does* force a category like teleological grounding, but it relies on the metaphysical premise of the block universe. It challenges the "causal history" requirement of standard SGP (e.g., Fodor, Dretske).

  5.  **Address the "Cheating" (The Gift):**

      *   *Critique:* Chiang/Villeneuve skip the hard part. Louise suddenly "gets it." The transition from learning to *becoming* is abrupt.
      *   *Impact on Readings:*
          *   *Perceptual:* Collapses. (Ink is magic).
