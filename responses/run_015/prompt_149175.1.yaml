          *   *Normative/Teleological:* Survives best. The "gift" is the entry into the form of life.
      *   *Honesty:* Acknowledge the film treats fluency as infection/osmosis rather than construction. This limits the SGP utility but doesn't negate the philosophical point about *what grounds the symbols once acquired*.

