prompt: |-
  I am a retired experimental physicist who has recently begun studying political philosophy, and I find myself both fascinated and exasperated by the literature on "dirty hands"—the idea that political actors may be required to do morally wrong things for the greater good. I would like you to help me think through this concept by writing a sustained satirical piece: a deadpan parody of an institutional ethics-review protocol, as if submitted to a fictional "Federal Bureau of Moral Hygiene," for a proposed study in which elected officials deliberately incur moral contamination under controlled conditions.

  Please format the piece as a numbered bureaucratic form—about 650 words—complete with risk-assessment checkboxes, decontamination schedules, and an appendix defining the "Sartre-Walzer Residue Coefficient," a hypothetical metric for quantifying the structural grime left behind after a justified compromise. The voice should be that of a government manual: utterly serious, technically precise, and oblivious to the absurdity of treating moral stain as a laboratory hazard. Your target is the tendency within dirty-hands discourse to proceduralize moral tragedy—to suggest that if we only classify the grime correctly (distinguishing, for instance, "surface contamination" from "substrate staining"), we can manage it without being corrupted by it. The satire should make the standard objections legible without stating them outright: who calibrates the coefficient, whether administrative cleansing actually restores moral standing, and whether the framework implicitly licenses any atrocity provided the paperwork is complete.

  Before you draft the form, please take a moment to brainstorm the specific bureaucratic genres that best expose this procedural fantasy—perhaps comparing IRB templates, laboratory safety data sheets, and audit reports—and then proceed with your best structure. You should write as an expert in political philosophy and institutional satire, maintaining deadpan consistency throughout so that a reader familiar with the classical framing of the problem recognizes the parody as conceptually fair rather than caricature. After the main form, include a brief author's note—no more than 150 words—identifying exactly where the parody takes liberties with the philosophical literature (for example, whether it exaggerates the quantifiability of moral residue or leans on a contested reading of whether dirty hands leave a permanent stain) and stating what argument or consideration would cause you to revise the piece's central implication. Please do not include any bibliography, citation list, or reading suggestions; I want the piece to stand on its conceptual architecture alone. Avoid invented living persons, and do not place any real passage in quotation marks unless you have fetched and verified the exact wording from a source. Think carefully, and begin with your brainstorming.
