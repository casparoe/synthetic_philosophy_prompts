      *   **Goal:** Check for consistency/coherence in their philosophical package. Identify tensions, rank them by severity, and suggest the "cheapest revision" for each.
      *   **Constraints:** Do not ask for bibliographies (no Millikan, etc., on hand). Do not treat all tensions as equally bad. Be direct and analytical.
      *   **The Package (5 Claims):**
          1.  Teleosemantics is true (content = evolutionary proper function).
          2.  Misrepresentation requires a binary distinction (function vs. failure) $\rightarrow$ sharp cutoff for representation.
