answer: |-
  **Private Brainstorming Notes**

  1.  **Circularity Risk:** The obstruction test presupposes a criterion for 'same outcome'. If the outcome is 'industrialisation', it is shadowed; if 'Reever's Canal', it is locked. The test does not solve individuation; it hides it.
  2.  **Existing Vocabulary:** 'Shadowed' and 'Locked' map closely onto 'convergence' and 'path dependence' in the social sciences. Not naive, but requires acknowledgement to avoid reinventing the wheel.
  3.  **Section 5 Weight:** This is the philosophical crux. It touches on retrospective determinism. It is an insight only if framed as epistemic (how we know) rather than ontological (what happened).
  4.  **Form vs. Content:** The tension between narrative structure (choice) and historical drift is genuine. The 'scene of no decision' is a stylistic solution to a metaphysical problem.
  5.  **Word Usage:** 'Locked' usually implies immutability/necessity. Here it denotes fragility/dependence on sequence. This fights normal usage and may confuse readers.
  6.  **Core Value:** The essay's strength is shifting focus from agents (who did it) to structures (whether it got done), using the novelist's constraint as a philosophical lever.

  ***

  **Referee Report**

  **To:** The Author
  **From:** The Referee
  **Re:** "The Corridor and the Door"

  This is a compelling sketch that leverages the novelist's craft to interrogate a persistent problem in the philosophy of history. You successfully identify a false dichotomy between fatalism and frivolous counterfactuals. However, the philosophical machinery requires tightening before it can bear the weight you place upon it. Below I address your specific queries.

  **The Obstruction Test and the Grain of Description**
  You are right to be suspicious of the obstruction test. It is hostage to the level of description. To ask whether "the outcome" arrives by another route requires prior agreement on what constitutes "the outcome". If we define the outcome broadly (e.g., 'increased transport capacity'), almost everything is shadowed. If we define it narrowly (e.g., 'the cutting of Reever's Canal'), almost everything is locked. The test does not independently establish necessity; it merely reflects the granularity of your initial definition.

  Does the essay die with this? No, but it must shift its claim. You cannot present the test as a metaphysical tool for discovering historical truth. Instead, you must frame it as a pragmatic heuristic for the writer. It is not about what *had* to happen, but about what is *worth narrating* as inevitable. If you admit this is a tool for narrative weighting rather than historical ontology, the circularity becomes a feature, not a bug: you choose the grain of description to suit the story's thematic needs.

  **Shadowed vs. Locked: Novelty and Utility**
  This distinction is not old hat, but it is kin to existing concepts. 'Shadowed' resembles 'historical convergence' (multiple paths to similar states), while 'Locked' echoes 'path dependence' (small events locking in large trajectories). You are not reinventing the wheel, but you are putting it on a different vehicle. The distinction does real work because it separates the *event* from the *agent*. As you note, credit belongs to the locked agent, but causality often belongs to the shadowed outcome. This is a valuable clarification for a general audience, provided you do not claim it solves the problem of determinism.

  **Three Damaging Objections**

  1.  **The Individuation Problem (Severity: High):** As noted above, the test collapses if you cannot define 'same outcome' without begging the question. If you claim the canal was 'shadowed' because *some* transport method arose, you have changed the subject. If you claim it was 'locked' because *this* canal failed, you have trivialised the test.
      *   *Sketch Reply:* I would argue that individuation is pragmatic, not metaphysical. For the novelist, the outcome is defined by the thematic concern of the work. If the theme is 'progress', the outcome is shadowed. If the theme is 'ambition', it is locked. The test measures the fit between event and theme, not event and reality.

  2.  **The Epistemic Access Problem (Severity: Medium):** You ask us to suppose every alternative means is blocked. But we cannot know this. We lack access to the counterfactual space required to run the test. We only know the actual path.
      *   *Sketch Reply:* Acknowledge this limitation. The test is a thought experiment to check our confidence, not a proof. It exposes when we are mistaking luck for design.

  3.  **The Normative Vacuity (Severity: Low):** Even if the test works, does it help the novelist? Knowing an outcome was 'shadowed' might encourage fatalism in the prose, undermining tension.
      *   *Sketch Reply:* The 'scene of no decision' addresses this. It allows tension to exist in the drift rather than the choice.

  **Section 5: Retrospective Collapse**
  This is a genuine insight, but only if you avoid sliding into relativism. You suggest contingency is a property of "events plus the standpoint". This is correct. Contingency is not a quality inherent in the event like mass or charge; it is a relation between the event and the observer's timeline. For this to be an insight rather than a confusion, you must clarify that the *past itself* does not change, but our *access to its openness* does. A branch that closes becomes invisible, making the past look narrower than it was. This is not that "we can never know"; it is that the object of knowledge changes over time. Make this distinction sharply, and section 5 becomes the essay's philosophical anchor.

  **Concrete Revision and Word Usage**
  **Revision:** In section 2, explicitly state that the 'outcome' is defined by the historian's or novelist's interest, not by nature. Add a sentence acknowledging that the obstruction test is a tool for clarifying narrative focus, not for settling historical causality. This disarms the circularity charge before it is made.

  **Word Usage:** You use 'Locked' to mean "dependent on the actual sequence" and therefore fragile. In ordinary English, 'locked' implies fixed, secure, or inevitable (e.g., 'locked in place'). Your usage suggests the opposite: that the outcome is vulnerable to obstruction. This fights the normal meaning and will cause friction. Consider 'Path-Bound' or 'Sequence-Dependent' for 'Locked', or explicitly redefine 'Locked' early on as 'Locked to the Sequence' to avoid the connotation of necessity.

  **Verdict**
  This essay has the potential to be a significant contribution to how non-specialists understand historical necessity. It avoids the dryness of academic philosophy without sacrificing rigour. If you clarify the status of the obstruction test as a pragmatic rather than metaphysical tool, and resolve the terminology around 'Locked', it should be accepted for publication.

  Yours sincerely,

  The Referee
