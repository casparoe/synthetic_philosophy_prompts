      *   *Pivot:* I will advise spending the most time on the **Bridge (Credence = Price)**. This *is* where "Refuse the bets" and "Just arbitrage" are solved. But if forced to name a misconception, it's **"I'd simply refuse the bets."** Why? Because if they think they can opt out, the DBA proves nothing about rationality, only about suckerhood. The definition of "Fair Price" must be ironclad.

