      *   *Utility:* Linear utility is an assumption. Acknowledge it, don't fight it.
      *   *Closing Question:* The user's candidate (coherent but inaccurate) is perfect. It distinguishes consistency from truth.

  5.  **Drafting the Plan (incorporating "Commit" instruction):**
      *   *Tone:* Direct, strategic, authoritative.
