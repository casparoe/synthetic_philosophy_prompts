  ### Decision Protocol: Moral Foundations Meta-Analysis

  **Instructions:** Proceed through the following nine nodes in order. At each node, select the verdict that best matches your intuition regarding the specific case presented. Do not consider general political principles; answer only for the case as described. Record your path (e.g., 1A-2B-3A) to find your assigned position at the end.

  **Node 1: The Hospital Algorithm**
  A hospital replaces consultant triage with a validated algorithm that beats humans on every fairness metric. Staff and patients report an "unnamed loss."
  *   **A:** The "unnamed loss" is morally significant; the algorithm is incomplete. (Go to Node 2)
  *   **B:** The metrics define fairness; the "loss" is merely psychological resistance to optimization. (Go to Node 3)

  **Node 2: The Plant Closure**
  A firm closes a plant, compensating workers at >100% expected lifetime earnings. The town's social fabric collapses.
  *   **A:** The social collapse is a moral wrong distinct from financial harm. (Go to Node 4)
  *   **B:** The compensation settles the moral account; the collapse is regrettable but not a moral failure. (Go to Node 5)

  **Node 3: The Flag Burning**
  A person privately uses a national flag as a drop cloth and burns it. No damage occurs.
  *   **A:** The act is morally objectionable despite the lack of harm. (Go to Node 6)
  *   **B:** The act is morally neutral; disgust is a biological by-product without moral weight. (Go to Node 6)
      *(Note: In this branch, both answers lead to Node 6, but your reasoning distinguishes the leaf later.)*

  **Node 4: The Cross-Cultural Survey**
  In another country, harm and purity items load on a single factor, and left–right score differences disappear.
  *   **A:** This variation invalidates the claim that foundations are universal moral capacities. (Leaf: **Measurement-Skeptic**)
  *   **B:** The foundations remain valid; the variation reflects local expression, not invalidity. (Go to Node 7)

  **Node 5: The Language Model**
  An AI trained on moral talk reproduces the factor structure but offers only harm-and-fairness justifications for every verdict.
  *   **A:** The Purity/Authority verdicts are groundless outputs; only Harm/Fairness are rational. (Leaf: **Asymmetric Debunking**)
  *   **B:** If justifications don't match outputs, all moral verdicts are ungrounded patterns. (Leaf: **Symmetric Debunking**)

  **Node 6: The Consistency Check**
  (Reached from Node 3). Given your Node 1 verdict (Metrics Rule), does your Flag verdict rely on intuition?
  *   **A:** Yes, the Flag intuition is reliable, but the Hospital intuition was not. (Leaf: **Strict Irrelevance**)
  *   **B:** No, relying on Flag intuition contradicts the Node 1 rejection of Hospital intuition. (Leaf: **Symmetric Debunking**)
      *(Note: If you chose Node 3B [Flag Neutral], select B. If you chose Node 3A [Flag Objectionable], select A.)*

  **Node 7: The Ecological Mismatch**
  (Reached from Node 4B). Is the Hospital "unnamed loss" due to the algorithm failing to match human social ecology?
  *   **A:** No, the loss indicates we need to integrate more moral foundations into the design. (Leaf: **Pluralist**)
  *   **B:** Yes, the loss indicates a mismatch between the tool and the environment. (Go to Node 8)

  **Node 8: The Full Complement**
  (Reached from Node 7B). Is the full human set of foundations (Harm, Fairness, Loyalty, Authority, Purity) the ideal moral state?
  *   **A:** Yes, possessing all foundations constitutes a well-functioning moral sense. (Leaf: **Full Complement**)
  *   **B:** No, foundations are tools calibrated to specific contexts, not an ideal set. (Leaf: **Perceptualist**)

  **Node 9: The Convergence Check**
  (Reserved for edge cases where Node 8 is ambiguous). Do you believe these profiles will converge as societies become larger and more affluent?
  *   **A:** Yes, convergence is predicted. (Leaf: **Perceptualist** [Convergence Variant])
  *   **B:** No, diversity is stable. (Leaf: **Perceptualist** [Stable Variant])
      *(Note: For scoring purposes, both count as Perceptualist, but see the map below for distinction.)*

  ***

  ### Scoring Key and Leaf Profiles

  | Position | Path Summary | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **Symmetric Debunking** | 1B-3B-6B or 1B-5B | You must admit your own moral convictions are likely post-hoc rationalizations with no more truth-value than the AI's patterns. |
  | **Asymmetric Debunking** | 1B-2B-5A | You must accept that "conservative" moral pain is real and visceral but morally irrelevant noise, while "liberal" pain is signal. |
  | **Strict Irrelevance** | 1B-3A-6A | You must assert moral truths (like the wrongness of flag burning) while conceding that psychology offers zero evidence for why they are true. |
  | **Measurement-Skeptic** | 1A-2A-4A or 1A-2B-4A | You must suspend judgment on moral progress and policy until the factor analysis instruments are recalibrated across cultures. |
  | **Pluralist** | 1A-2A-4B-7A | You must concede that some harmful traditions might be morally necessary for social cohesion, requiring a trade-off you cannot fully justify. |
  | **Perceptualist** | 1A-2A-4B-7B-8B | You must accept that a morality valid in one village (e.g., strict purity) is objectively wrong in a metropolis, with no higher court of appeal. |
  | **Full Complement** | 1A-2A-4B-7B-8A | You must accept that disgust at flag burning is as functionally healthy and morally vindicated as outrage at assault. |

  ***

  ### Map of the Logical Space

  As an analytical chemist, you will recognize that not all combinations of answers yield a stable solution. The following regions of the logical space are unoccupied or unstable:

  1.  **The "Universal Purity" Vacuum (Unoccupied):** There is no leaf for someone who answers *Yes* to the Plant Case (Loyalty matters) and *Yes* to the Flag Case (Purity matters) but *No* to the Hospital Case (Intuition doesn't matter). This combination implies that economic fairness is the only metric, yet symbols and loyalty are binding. This is logically incoherent; if intuition is discarded in the hospital, it cannot be retained for the flag without a non-psychological justification, which forces the user into **Strict Irrelevance**.
  2.  **The "Objective Skeptic" Gap (Unattractive):** A position claiming morality is objective (not asked in the tree, but implied) while simultaneously holding the **Measurement-Skeptic** view is unattractive. It posits a moral truth that exists but is permanently inaccessible to human measurement. Most who land here drift toward **Strict Irrelevance**.
  3.  **The "Vindicated Left" Void (Unexplored):** There is no leaf for "Asymmetric Vindication" (Left is right *because* of the psychology). The tree forces those who trust the Hospital metrics (Node 1B) into Debunking. To vindicate the Left using MFT, one must trust the intuition (Node 1A), which opens the door to Loyalty/Purity (Node 2), forcing a move toward Pluralism or Perceptualism. The logic of MFT resists vindicating one side without validating the foundations of the other.

  **Inseparable Leaves:**
  The tree struggles to practically separate **Strict Irrelevance** and **Measurement-Skeptic**. Both result in the same operational outcome: "This psychology tells us nothing about who is right." The Skeptic says, "The instrument is broken." The Irrelevance advocate says, "The instrument measures the wrong thing." In a reading group discussion, these two positions will often sound identical, differing only in whether they blame the data or the meta-ethics.

  ***

  ### Location of the Convergence-Floor View

  Your **Convergence-Floor View** locates most precisely within the **Perceptualist** leaf (Node 8B), but it adds a specific trajectory to the calibration mechanism.

  *   **Standard Perceptualist:** Foundations are modular capacities calibrated to a local social ecology. (Ecology A = Morality A; Ecology B = Morality B).
  *   **Convergence-Floor:** Foundations are modular capacities calibrated to a local social ecology, *but* modernization (size, anonymity, affluence) creates a single dominant ecology that selects for Harm and Fairness while deselecting Loyalty, Authority, and Purity.

  **Distinguishability:**
  It is distinguishable from the standard Perceptualist view if you believe the convergence is *predictive* rather than just descriptive. A standard Perceptualist might argue that if a sub-culture remains tight-knit and hierarchical (a distinct ecology), their reliance on Authority remains "correct" for them. The Convergence-Floor view suggests that as the "floor" of society rises, that sub-culture's morality becomes maladaptive, predicting a eventual shift. If you hold that the convergence makes the Harm/Fairness profile *objectively* better for the new conditions, you drift toward **Asymmetric Debunking**. If you hold that it is merely the new functional equilibrium, you remain **Perceptualist**.

  Given your background in calibration: Think of the Convergence-Floor view as claiming the "standard solution" for the assay changes as the matrix changes, whereas the standard Perceptualist view claims there is no single standard solution, only valid calibrations for specific matrices.
