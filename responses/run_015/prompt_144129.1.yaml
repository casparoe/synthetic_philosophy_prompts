      *   Incompatible: "Prioritize them" vs "Fire them."
      *   This avoids the "Rearrest vs Reoffense" empirical lookup issue. Both correlations exist in the data. The *label* is the meaning.
      *   Let's go with **Medical Triage Algorithm** (Unsupervised).
      *   Artifact: Risk Scores.
