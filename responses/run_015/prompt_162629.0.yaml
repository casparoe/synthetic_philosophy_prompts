      *   **Specific Issues:**
          1.  Aphasic character (no language) written with fully worded interior monologue.
          2.  Character tracking a private sensation (Sign S) predicting seizures (Private Language argument).
          3.  Free Indirect Style (FIS) narrator stating feelings without behavioral backing (telling vs. showing/authority of narration).
      *   **Constraints:**
          *   No reading lists, no theory vocabulary (or define instantly).
          *   Needs a *decision procedure* (checklist/algorithm) usable in ~10 mins/scene.
          *   Must handle hard cases (mind without language, private sensation, unsupported narration, cultural gap).
          *   Must run the procedure on the three specific cases provided.
          *   Must include at least one "hard no" verdict (user suspects the aphasia paragraph is indefensible).
          *   Must explain what distinctions survive flattening and what gets lost.
          *   Must clarify if the private mark and aphasia are different problems.
          *   Tone: Practical, honest, operational, respectful of the craft but firm on the logic.
      *   **Deadline:** 10 weeks for 40 scenes (needs efficiency).

  2.  **Deconstruct the Philosophy (Wittgenstein Lite):**

      *   *Private Language Argument:* A sign (like 'S') only means something if there's a rule for its use. If only one person can check if it's used correctly, there's no difference between *seeming* right and *being* right. Therefore, the sign has no stable meaning.
      *   *Aphasia/Inner Speech:* If a character has no language, attributing linguistic thought to them is a category error *unless* framed as metaphor or translation. However, readers need access. The tension is between *accuracy* (no words) and *empathy* (words).
      *   *Criteria vs. Symptoms:*
          *   *Criteria:* Publicly observable things that *define* a state (e.g., groaning + holding knee = pain). Without these, the claim is empty.
          *   *Symptoms:* Correlated evidence (e.g., high blood pressure might correlate with pain, but doesn't define it).
          *   *Narrative Authority:* In 3rd person, the narrator claims knowledge. If they claim knowledge of an inner state with zero criteria (behavior/context), they are making a metaphysical claim, not a narrative one.

  3.  **Develop the Decision Procedure (The "Checklist"):**

      *   *Goal:* Test the *coherence* of the representation, not the *quality* of the prose.
      *   *Structure:* Four Questions.
      *   *Q1: The Access Check.* How does the reader know this? (Source of information).
      *   *Q2: The Checkability.* Could anyone else verify this within the world of the book?
      *   *Q3: The Translation.* If the character has no words, whose words are these?
      *   *Q4: The Stake.* Does the ambiguity matter to the plot/theme?
      *   *Verdicts:* Pass (Keep), Fail (Cut/Rewrite), Waiver (Artistic License).

  4.  **Drafting the Procedure (Iterative refinement):**

      *   *Refinement:* Make it punchy. Avoid "epistemology." Use "Proof," "Rules," "Voice."
      *   *Branching:* The aphasia problem is about *translation* (how to show the unshowable). The private sign problem is about *validity* (does the sign mean anything). They are related but distinct. I need to make sure the procedure handles both.
      *   *The "Hard No":* The user wants the aphasia chapter challenged. Wittgenstein would say worded monologue for an aphasic is nonsense *unless* it's explicitly marked as the narrator's interpretation. I need to build a step that catches this.

  5.  **Running the Procedure on the Cases:**

      *   *Case 1: Aphasia.*
          *   Access: Internal.
          *   Checkability: None (she can't speak).
          *   Translation: Whose words? If it's hers, it's false. If it's the narrator's, it needs framing.
          *   Verdict: Likely a Fail or Waiver depending on framing. I will push for a Fail on the "fully worded interior monologue" aspect if it implies *her* language.
      *   *Case 2: Private Sign (S).*
          *   Access: Internal sensation.
          *   Checkability: None.
          *   Translation: She names it.
          *   Verdict: If the book treats 'S' as objectively predictive, it's a Fail (Private Language). If the book treats 'S' as her *belief* which might be wrong, it's a Pass.
      *   *Case 3: Unbacked Grief.*
          *   Access: Narrator assertion.
          *   Checkability: None (no behavior).
          *   Translation: Narrator's authority.
          *   Verdict: Fail. "Unbearable grief" without criteria is empty rhetoric.

  6.  **Addressing the "Translation" and Limitations:**

      *   *What survives:* The need for public grounding (criteria). The distinction between *having* a feeling and *describing* it.
      *   *What gets lost:* Nuance of metaphor, the poetic truth vs. logical truth.
      *   *What it can't do:* Judge beauty, judge moral worth, solve the "other minds" problem for aliens/animals (or characters utterly unlike us).

  7.  **Refining the Tone:**

      *   Needs to be empathetic to the writer ("I know you want to make them care") but firm on the logic ("Here is where the logic breaks").
      *   No jargon. Define "Criteria" simply.
      *   Acknowledge the deadline pressure.

  8.  **Final Review against Constraints:**

      *   10-minute procedure? Yes, 4 questions.
      *   Plain language? Yes.
      *   Run on 3 cases? Yes.
      *   One "Hard No"? Yes (Aphasia or Grief). Let's make Aphasia the nuanced one and Grief the Hard No, or vice versa. Actually, the user suspects Aphasia is indefensible. I should honor that suspicion. If the monologue is presented as *her* thought, it's logically incoherent. If it's presented as *narrative translation*, it's okay. I will set the trap so that "fully worded interior monologue" triggers a Fail unless framed.
      *   Distinguish Private Mark vs. Aphasia? Yes. One is about meaning stability, one is about representation fidelity.

      *(Self-Correction during drafting)*: Wait, if I tell the user the Aphasia chapter *must* be cut, they might revolt because they said it's the "best thing in the book." I need to offer a *rewrite* path, not just a cut path. The procedure should identify *what is broken* so they can fix it. The "Hard No" is on the *current execution*, not the concept.
      *Actually, re-reading the prompt:* "I want at least one of those to come back with a verdict I won't like — I'm pretty sure the aphasia chapter's best paragraph is indefensible and I want to see whether the procedure actually says so."
      *Okay, I will make the procedure strict enough that the current draft fails, but offer the fix.*

      *Wait, one more thing:* The user asked: "tell me if they're different problems and the procedure needs to branch."
      *Analysis:* Aphasia is about *access* (how do we get in?). Private Sign is about *validity* (does the sign hold?). They are different. I should note this in the "Translation" section but keep the procedure unified if possible, or add a small branch. A unified procedure is better for speed. I can frame the questions to cover both.

      *Let's refine the "Criteria" definition:* "Public evidence that makes a claim meaningful."
      *Let's refine the "Private Language" concept:* "A rule only you can check is no rule at all."

      *Okay, ready to write.*

      *Structure:*
      1. Introduction (Acknowledging the bind).
      2. The Distinction (Are they different problems?).
