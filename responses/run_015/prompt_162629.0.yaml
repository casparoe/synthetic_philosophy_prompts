      *Wait, the "Hard No" on Aphasia:* If the character *cannot produce or understand language*, writing "fully worded interior monologue" is technically lying to the reader about the character's mind. It creates empathy by breaking the premise. The procedure should flag this. I will ensure Q3 (Whose Voice?) catches this.

