answer: |-
  Here is the operational tool you asked for. It strips the philosophy down to its load-bearing walls so you can use it on a deadline.

  ### Part 1: Are These Different Problems?

  Yes. They are structurally distinct, though they feel similar because they both deal with "inside" vs. "outside."

  1.  **The Aphasia Problem (Representation):** This is about **fidelity**. You are promising the reader "this is what it is like to be her," but you are using a tool (language) she does not possess. If you don't flag this, you are lying about the character to make her readable.
  2.  **The Private Sign Problem (Validity):** This is about **meaning**. If a sign (S) is defined only by a feeling only she can check, the sign cannot hold a stable meaning. It's not that she's lying; it's that the word "same" loses its grip.
  3.  **The Unbacked Narration Problem (Authority):** This is about **evidence**. A narrator claiming a state exists without any public criteria is making a claim that cannot be verified within the world of the book.

  The procedure below handles all three by testing the **link between the inner claim and the outer world.**

  ***

  ### Part 2: The Decision Procedure (10 Minutes Max)

  Read the scene. Keep a pen in hand. Answer these four questions in order.

  **Q1: The Source Check**
  *Who is generating the words on the page?*
  *   **A:** The Character (Interior Monologue).
  *   **B:** The Narrator (Reporting on the character).
  *   **C:** Ambiguous (Free Indirect Style).
  *   *Sufficient Answer:* You must pick one. If C, treat it as B for the sake of this test.

  **Q2: The Vocabulary Match**
  *Does the source identified in Q1 possess the language used to describe the state?*
  *   **Yes:** They have the words/concepts.
  *   **No:** They lack the words/concepts (due to aphasia, culture, age, or the nature of the sensation).
  *   *Hard Stop:* If Q1 is **A** (Character) and Q2 is **No**, **STOP.** This is a logical contradiction. You must rewrite as **B** (Narrator Translation) or cut.
      *   *Why:* A character cannot think in words they do not have. If you write worded thoughts for a non-verbal mind without framing it as a translation, you break the reality of the book.

  **Q3: The Criteria Check**
  *Is there public evidence (behavior, context, physical change) that supports the inner claim?*
  *   **Yes:** There is something to see, hear, or measure.
  *   **No:** The state is asserted purely internally.
  *   *Hard Stop:* If Q1 is **B** (Narrator) and Q3 is **No**, **STOP.** This is "empty assertion."
      *   *Why:* A narrator claiming a feeling exists without any criteria is like a doctor diagnosing an illness without symptoms. The claim has no weight.
      *   *Exception:* If the *theme* of the book is that people are unknowable, you may proceed to Q4.

  **Q4: The Stakes Check**
  *Does it matter to the plot or theme if this inner claim is unreliable?*
  *   **Yes:** The uncertainty drives the tension (e.g., is Sign S real or imagined?).
  *   **No:** The book treats the claim as objective fact (e.g., Sign S definitely predicts seizures).
  *   *Verdict:* If **No**, you must add Criteria (Go back to Q3). If **Yes**, you may proceed (Waiver).

  ***

  ### Part 3: The Verdicts

  *   **PASS:** You answered consistently. The link between inner/outer is stable. Keep the scene.
  *   **WAIVER:** You hit a Hard Stop, but Q4 saves you. The inconsistency is the *point*. Keep, but ensure the reader knows it's unstable.
  *   **FAIL:** You hit a Hard Stop and Q4 does not save you. The passage is logically incoherent. Cut or Rewrite.

  ***

  ### Part 4: Running the Procedure on Your Cases

  Here is the procedure applied to the three specific problems you raised.

  #### Case 1: The Aphasia Chapter
  *   **Q1 (Source):** You wrote "fully worded interior monologue." This reads as **A (Character)**.
  *   **Q2 (Vocab):** Character has aphasia (no language). Answer: **No**.
  *   **Result:** **HARD STOP.**
  *   **Analysis:** You are presenting linguistic thought as coming from a mind that cannot process language. This is the "indefensible paragraph" you suspected.
  *   **The Fix:** You must shift Q1 to **B (Narrator)**. You cannot write *her* thoughts. You must write the *narrator's translation* of her non-linguistic experience.
      *   *Bad:* "I am scared the fire will burn me." (She can't think "fire" or "burn".)
      *   *Good:* "The heat rose. A wordless panic tightened her chest, the shape of a fire she could not name."
  *   **Verdict:** **FAIL** on the current draft. It cheats the premise to generate empathy. It can be saved by reframing the voice, but the current text is logically broken.

  #### Case 2: The Notebook with Sign S
  *   **Q1 (Source):** Character tracking sensation. **A (Character)**.
  *   **Q2 (Vocab):** She names it 'S'. **Yes** (she has the label).
  *   **Q3 (Criteria):** Nobody else can check it. **No** (Private).
  *   **Q4 (Stakes):** Is it important if she is wrong?
      *   *Scenario A:* The book treats 'S' as a magical, objective predictor. **Verdict: FAIL.** (This treats a private sensation as a public fact. It claims certainty where none is possible.)
      *   *Scenario B:* The book treats 'S' as her *attempt* to find order, and she might be wrong. **Verdict: WAIVER.** (The uncertainty is the point.)
  *   **Advice:** If you want her to be "right" about the seizures, you must give 'S' a public correlate (e.g., a slight tremor others can see, or a medical device). If you want to keep it private, she must be allowed to be wrong about the prediction.

  #### Case 3: Unbacked Grief (Free Indirect Style)
  *   **Q1 (Source):** Narrator stating what character feels. **B (Narrator)**.
  *   **Q2 (Vocab):** Narrator has language. **Yes**.
  *   **Q3 (Criteria):** "Nothing on the page to show it." **No**.
  *   **Result:** **HARD STOP.**
  *   **Analysis:** The narrator claims "grief is unbearable" with zero behavioral criteria (tears, silence, withdrawal). This is "telling" without the authority to tell.
  *   **Verdict:** **FAIL.**
  *   **The Fix:** Add criteria. Not necessarily "she cried," but something that anchors the word "unbearable" in the physical world. A dropped cup. A hour lost staring at a wall. Without this, the word "grief" is just noise.

  ***

  ### Part 5: The Translation (What Survives the Flattening)

  You asked what gets lost when we turn philosophy into a checklist. Here is the honest accounting.

  **What Survives (The Load-Bearing Walls):**
  1.  **Criteria vs. Symptoms:** The procedure enforces the need for *criteria* (public evidence that defines a state) over *symptoms* (correlated evidence). You cannot claim a state exists without the criteria that give the claim meaning.
  2.  **The "Right/Seeming Right" Distinction:** In the Private Sign case, the procedure forces you to decide if the character is *actually* right or just *convinced* they are right. Philosophy says without public checks, those are the same thing. The procedure makes you pick one for the sake of the plot.
  3.  **Voice Ownership:** It forces you to admit whose language is on the page. You cannot hide behind "Free Indirect Style" to sneak words into a mouth that cannot speak them.

  **What Gets Dropped (The Nuance):**
  1.  **Metaphorical Truth:** Wittgenstein wasn't talking about poetry. You *can* write "her grief was a black ocean" even if grief isn't liquid. The procedure might flag this as "No Criteria," but you can Waiver it if you acknowledge it's metaphor, not diagnosis.
  2.  **The "Inner Life" Denial:** The procedure does **not** say characters don't have inner lives. It says we cannot *write about* inner lives as if they are outer facts without a bridge. It protects the mystery of the mind by refusing to fake access to it.
  3.  **Prose Quality:** This procedure tests *coherence*, not *beauty*. A sentence can pass this test and still be clunky. A sentence can fail this test and be beautiful nonsense. You have to judge the beauty yourself.

  **What It Can't Do:**
  *   **Alien Minds:** If you write a character whose behavior is *nothing* like a human's (no face, no body, no reaction), this procedure will force you to cut their "feelings." It cannot verify the inner life of a truly alien entity.
  *   **Cultural Gaps:** For your character from a culture with no vocabulary for the state: The procedure will flag this as a Q2 (Vocab) failure. It cannot tell you if they *feel* it without the word. It only tells you you cannot write the word as *their* thought. You must use the Narrator (Q1 shift) to describe the sensation without using the missing label.

  ### Summary for Your Editor

  If your editor asks why you cut a passage, here is the one-line definition you requested:

  > *"I cut it because it asserts an internal state without any external criteria to make that claim meaningful within the world of the book."*

  ### Final Advice for the 10-Week Sprint

  You have 40 scenes. Do not debate the philosophy. Run the four questions.
  1.  If **Aphasia** is written as worded thought: **Rewrite as Narrator Translation.** (Do not cut the scene, it's the best thing in the book, but fix the voice).
  2.  If **Sign S** is treated as objective fact: **Add a public correlate or introduce doubt.**
  3.  If **Grief** has no behavior: **Add one physical anchor.**

  This will not solve the mystery of consciousness. It will solve the consistency of your manuscript. Get back to work.
