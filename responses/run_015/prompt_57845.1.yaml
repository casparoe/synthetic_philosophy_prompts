answer: |-
  # Joint Statement on Rationality, Commitment, and the Hitchhiker Problem

  **Issued by:** The Working Group on Decision Theory and Normative Agency
  **Date:** October 26, 2023
  **Subject:** Clarification of Disputes Regarding Parfit's Hitchhiker and Rational Irrationality

  ## 1. Agreed Background Claims

  We, the undersigned advocates of Act-Centered Rationality (ACR) and Disposition-Centered Rationality (DCR), affirm the following premises as the common ground for our dispute. We agree that these claims accurately describe the mechanics of the scenario and our shared normative goals.

  1.  **The Scenario:** In Parfit's Hitchhiker case, a traveler is stranded in a desert. A driver offers a ride to the city on the condition that the traveler pays a fee upon arrival. The driver possesses a high-capacity predictive ability regarding human behavior but cannot enforce the contract legally.
  2.  **The Payoff Structure:**
      *   **Survival:** Being driven to the city is vastly more valuable than the cost of the fare.
      *   **Payment:** Paying the fare is costly but less so than death.
      *   **Default:** Keeping the money while surviving is the best individual outcome for the traveler, but if predicted, it results in death (being left in the desert).
  3.  **The Predictive Link:** The driver's decision to rescue is causally antecedent to the traveler's decision to pay. The traveler's current choice cannot causally alter the past prediction, though it may correlate with it.
  4.  **The Goal of Rationality:** Both camps agree that the ultimate aim of rational deliberation is to secure the best possible outcomes for the agent over time. We disagree only on the definition of the *unit of evaluation* that constitutes rational agency.
  5.  **Ex-Ante Benefit:** We agree that *before* encountering the driver, it is beneficial for the traveler to be the kind of person who pays. Both camps agree that a traveler who knows they will not pay is likely to die.

  ## 2. Precisely Worded Residual Disagreements

  While we agree on the background facts, we maintain distinct positions regarding the nature of rational justification. We endorse the following formulation of our divergence:

  **On the Unit of Rational Assessment:**
  *   **The ACR Position:** Rationality assesses the specific token action available at the moment of choice. Since the traveler's payment in the city cannot causally influence the driver's past decision to rescue, paying is an instrumentally irrational act, even if cultivating the disposition to pay was previously rational. We endorse the phenomenon of **"Rational Irrationality"**: it is rational to cultivate a disposition that leads one to perform acts that are, in isolation, irrational.
  *   **The DCR Position:** Rationality assesses the agent's policies, dispositions, or character traits. An action is rational if it flows from a disposition that maximizes expected utility. Since the disposition to pay secures rescue, the act of paying is itself rational. We reject **"Rational Irrationality"**: acting on a beneficial commitment is never irrational, even if the specific act lacks causal leverage over the past.

  **On the Source of Normative Force:**
  *   **The ACR Position:** Normative force derives from **causal consequence**. A reason to act must be able to make a difference to the future state of the world from the point of decision.
  *   **The DCR Position:** Normative force derives from **functional success**. A reason to act exists if the action instantiates a policy that successfully navigates the world, regardless of whether the specific token act alters the past.

  ## 3. Central Cruxes and Test Cases

  We identify the following cruxes as pivotal. Resolution of these empirical or conceptual questions would compel at least one camp to revise its position. For each crux, we propose two test variations: a **Noisy-Predictor Version** (where the driver is correct 80% of the time) and an **Advance-Commitment Version** (where the traveler can pay a modest fee beforehand to mechanically remove the option of later refusal).

  ### Crux 1: The Metaphysics of Diachronic Agency
  **Question:** Is an agent fundamentally a series of time-sliced choosers, or a single temporally extended entity? If the latter, does a choice made at Time 2 carry the normative weight of the policy set at Time 1?

  **Test Case Sketch:**
  *   **Noisy-Predictor Version:** The driver predicts the traveler's choice with 80% accuracy. If the traveler pays, they lose \$100. If they are rescued, they gain \$1,000 (net).
  *   **Advance-Commitment Version:** Before the ride, the traveler can pay \$10 to a third party who will physically prevent them from keeping the fare upon arrival (e.g., by freezing their assets).

  **Predicted Verdicts:**
  *   **ACR Verdict:**
      *   *Noisy:* **Do Not Pay.** At the moment of payment, the 80% correlation is evidential, not causal. Paying costs \$100 with no causal benefit.
      *   *Commitment:* **Buy the Commitment.** Paying the \$10 fee causally alters the future by ensuring the driver predicts payment. Once in the city, the payment is no longer a free choice but a causal necessity to avoid asset freezing.
  *   **DCR Verdict:**
      *   *Noisy:* **Pay.** The agent is an extended entity. Honoring the policy that generated the 80% rescue probability is the rational act. The 80% correlation is sufficient for rational action.
      *   *Commitment:* **Buy the Commitment (but deem it unnecessary).** While buying the commitment is permissible, a truly rational agent does not require external binding to act rationally. The internal disposition suffices.

  ### Crux 2: The Status of Counterfactual Dependence
  **Question:** Does rationality require that an act *change* the outcome (causal dependence), or merely that the act is *part of the sequence* that leads to the outcome (counterfactual dependence)?

  **Test Case Sketch:**
  *   **Noisy-Predictor Version:** The driver states, "I saved you because I predicted you would pay. If you were the type to not pay, I would have left you." The traveler is now in the city.
  *   **Advance-Commitment Version:** The traveler can sign a binding contract beforehand. If they sign, the driver rescues them. If they do not sign, the driver leaves them. The contract makes payment automatic.

  **Predicted Verdicts:**
  *   **ACR Verdict:**
      *   *Noisy:* **Do Not Pay.** The counterfactual "If I were the type to not pay..." refers to a past state I cannot now change. My current act changes nothing.
      *   *Commitment:* **Sign Contract.** Signing changes the causal structure. It makes the future payment causally necessary for the rescue. Rationality demands altering the structure to make payment causal.
  *   **DCR Verdict:**
      *   *Noisy:* **Pay.** The counterfactual dependence is sufficient. The act of paying is the realization of the world-state where rescue occurs. To not pay is to fail the test of agency.
      *   *Commitment:* **Sign Contract.** Signing is consistent with the rational policy. However, the contract is merely an external expression of the internal rational commitment. The rationality lies in the alignment with the successful policy, not the legal mechanism.

  ### Crux 3: The Possibility of Self-Binding Without External Enforcement
  **Question:** Can an agent rationally bind their future self through sheer will (internal commitment), or does rational binding require changing the external payoff structure?

  **Test Case Sketch:**
  *   **Noisy-Predictor Version:** The traveler meditates beforehand to solidify their resolve to pay, with no external penalty for lying.
  *   **Advance-Commitment Version:** The traveler pays a non-refundable fee that is lost *unless* they pay the driver later (a "bond" rather than a "block").

  **Predicted Verdicts:**
  *   **ACR Verdict:**
      *   *Noisy:* **Meditation is Futile.** At the moment of payment, the meditation is a sunk cost. The future self will still face the same causal calculation (pay = loss, don't pay = gain). Rationality dictates defection.
      *   *Commitment:* **Bond is Effective.** The bond changes the future payoff structure. Now, not paying costs the bond *plus* the fare. This makes paying causally rational at Time 2.
  *   **DCR Verdict:**
      *   *Noisy:* **Meditation is Effective.** Cultivating the disposition *is* the binding. The future self is not a new agent but the same agent executing a plan. Paying is rational.
      *   *Commitment:* **Bond is Redundant.** While the bond works, it implies a lack of trust in one's own rationality. A fully rational agent recognizes that the disposition itself provides the necessary reason to act.

  ***

  **Signatories:**

  _________________________
  *Advocate, Act-Centered Rationality*

  _________________________
  *Advocate, Disposition-Centered Rationality*
