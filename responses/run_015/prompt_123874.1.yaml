prompt: |-
  I am a novelist, and I am asked to supply advance praise — the short encomium that appears on a jacket or in a catalogue — for other people's novels perhaps two dozen times a year. I am usually working from an uncorrected proof, sometimes from a partial manuscript, with about a week to answer and a publicist waiting. What I write goes out under my name, is short enough to be quoted in full, and is read, correctly, as a claim about the book. I would like a standing procedure for these requests, and I would like it built on a distinction I keep circling without being able to state precisely.

  The distinction, in my own terms. Some of the things that move me to praise a book bear on whether the book merits the attitude my words report: the sentences do what they set out to do, the structure holds under the weight put on it, the book says something about its subject that could not have been said another way. Other things move me for reasons of a different order: the author is a friend, the season's list will sink without this book, praising it will be taken as a political act, refusing will be taken as one, my praise will be read as generosity toward someone the culture has been cruel to. These are excellent reasons to want the book praised, and perhaps good reasons to open my mouth; but they do not seem to be reasons for the admiration the blurb asserts, and when they are doing the real work, what I have written is a species of untruth even if every clause about the prose is defensible. There is a name in philosophy for this — the problem of the wrong kind of reasons, which arises wherever value or fittingness is analysed in terms of reasons for attitudes, and whose difficulty is that nobody has a test for which kind a given reason belongs to that does not simply presuppose the answer.

  My half-formed thought is that the two-way split is too crude, and that a usable procedure needs three categories. First, reasons that bear on the work's properties and on the right property: reasons for admiring this novel as a novel. Second, reasons that bear on my situation rather than on the work: reasons to want it praised, reasons to be seen praising it. Third — the category I think is doing the damage in actual blurbs — reasons that bear on the work but on properties that support a neighbouring attitude rather than this one: the author's courage, the book's urgency, its being the first of its kind, the fact that it needed writing. These are reasons for gratitude, respect, relief, or indignation, and they are reasons to want the book read; they are not, I suspect, reasons to call it excellent, and they leak into praise because a blurb runs to two sentences and has room for only one register.

  What I want from you: a decision procedure, in a fixed order, that I can run in twenty minutes and could hand to another writer without explaining anything behind it. For each step, the question to ask; what would count as a sufficient answer; the point at which the procedure stops with a no; and the point at which it stops and hands the decision back to me because what remains is a question of values and not of facts. It should tell me what to do when I have not read enough of the manuscript to have reasons of the first kind at all. It should also tell me whether there is an honest intermediate verdict available — declining to praise the novel while saying something true about the person or the occasion — and, if there is, what forms of words are legitimate and which merely relabel a wrong-kind reason as a right-kind one. Please mark explicitly the places where the procedure is a judgment call dressed as a step, and where the underlying philosophical question is genuinely unsettled, so that I know I am deciding rather than executing.

  Then apply it to three cases. One: a competent, unambitious first novel by a close friend, from a small press for whom my name on the jacket would make a real commercial difference. Two: the best novel I have read this year, by a writer I publicly feuded with a decade ago, where my praise would be received as an apology and would also flatter me. Three: a formally clumsy, politically urgent novel by a writer at risk in her own country, where a jacket quotation from me may offer a measure of protection. I expect the procedure to give me an answer in at least one of these that I will not like, and I would rather have that stated plainly than softened.

  Close by saying what the procedure cannot do: which requests it will misfire on, which distinctions it has to discard in order to be usable, and what I should do when the collapse of the right-kind/wrong-kind distinction is not a technicality but the whole problem.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A novelist asked to write advance praise (blurbs) ~24 times/year.
      *   **Problem:** Needs a standing procedure to decide *whether* and *how* to blurb, based on a specific philosophical distinction (Right Kind of Reasons vs. Wrong Kind of Reasons, plus a proposed third category).
      *   **The Distinction:**
          1.  *Work-Internal:* Reasons to admire the novel *as a novel* (prose, structure, insight).
          2.  *Situation-External:* Reasons to want it praised (friendship, politics, career support).
          3.  *Work-External/Attitude-Mismatch:* Reasons based on work properties that support *other* attitudes (courage, urgency, necessity) but not necessarily *admiration/excellence*.
      *   **Requirements for the Procedure:**
          *   Fixed order.
          *   Executable in 20 minutes.
          *   Handable to another writer without explanation.
          *   Specific components per step: Question, Sufficient Answer, Stop point (No), Stop point (Judgment Call).
          *   Handle unread/partial manuscripts.
          *   Address "honest intermediate verdicts" (praising person/occasion, not book).
          *   Mark judgment calls and unsettled philosophical questions explicitly.
          *   Apply to three specific cases (Friend/Competent, Feud/Excellent, Dissident/Clumsy).
          *   Conclusion: Limitations of the procedure (where it misfires, what it discards, what to do when the distinction collapses).
      *   **Tone:** Intellectual, precise, honest, slightly weary but rigorous (matching the user's voice).

  2.  **Deconstruct the Philosophical Core:**

      *   The user is referencing the "Wrong Kind of Reasons" (WKR) problem in value theory (e.g., Pascal's Wager, the Demon who rewards believing).
      *   The user proposes a tripartite split:
          1.  *Aesthetic Merit* (Right Kind for Praise).
          2.  *Consequentialist/Social* (Wrong Kind for Praise, Right Kind for Action).
          3.  *Moral/Existential Merit* (Right Kind for Respect/Gratitude, Wrong Kind for Aesthetic Praise).
      *   The goal is to prevent Category 2 and 3 from masquerading as Category 1 in the blurb text.

  3.  **Drafting the Procedure (The "Blurb Protocol"):**

      *   *Constraint:* 20 minutes. Needs to be fast heuristics, not deep reading.
      *   *Step 1: The Reading Check.* Can I actually judge the work? If not, default to Category 2 or 3 logic, but label it.
      *   *Step 2: The Aesthetic Threshold.* Is it *good enough* to not be a lie? (Minimum viability).
      *   *Step 3: The Motivation Audit.* Why am I doing this? Which category dominates?
      *   *Step 4: The Wording Test.* Can I write the blurb without implying Category 1 if only 2 or 3 apply?
      *   *Decision Tree:* Yes/No/Maybe.

      *Refining the Steps:*
      *   *Step 1 (Capacity):* Have I read enough to assess Category 1?
      *   *Step 2 (Category 1 Check):* Does it meet a baseline of competence/intent?
      *   *Step 3 (Dominant Reason):* If Category 1 is weak, are 2 or 3 strong enough to warrant *some* statement?
      *   *Step 4 (Formulation):* Can I phrase it honestly?

      *Addressing the "Intermediate Verdict":* The user asks if one can decline praise but say something true. Yes, "blurbs of context."
      *Addressing Judgment Calls:* Need to flag where "good enough" is subjective.
      *Addressing Philosophy:* Flag where the line between "urgent" and "excellent" is blurry.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Friend/Competent/Small Press):*
          *   Cat 1: Moderate (competent).
          *   Cat 2: High (friend, small press needs help).
          *   Cat 3: Low.
          *   *Result:* Procedure should likely allow a blurb but restrict the *claims* to competence, not greatness. Or, if the procedure is strict, it might say "No" if Cat 1 isn't strong enough to carry the weight of Cat 2. The user expects an answer they might not like. If I make the procedure strict on Cat 1, the answer is "Don't blurb, find another way to help."
      *   *Case 2 (Feud/Excellent):*
          *   Cat 1: High (best of year).
          *   Cat 2: High (public apology, self-flattery).
          *   Cat 3: Low.
          *   *Result:* Cat 1 justifies the praise. Cat 2 is irrelevant to the *truth* of the praise, even if it motivates the action. Procedure should say "Yes," but warn about the reception.
      *   *Case 3 (Dissident/Clumsy/Urgent):*
          *   Cat 1: Low (clumsy).
          *   Cat 2: High (protection).
          *   Cat 3: High (courage, urgency).
          *   *Result:* This is the trap. Cat 3 leaks into Cat 1. The procedure must forbid calling it "excellent" or "masterful." It might allow a statement of *importance* rather than *quality*. If the protocol demands "Praise = Aesthetic," the answer is "No." This is likely the "answer I will not like."

  5.  **Drafting the Limitations/Conclusion:**

      *   What does it miss? The social contract of blurbing (it's *always* partly Cat 2).
      *   What distinctions are discarded? Nuance between "good" and "important."
      *   When the distinction collapses? When politics *is* the aesthetic (e.g., protest lit).

  6.  **Refining the Tone:**

      *   The user is sophisticated. Avoid platitudes. Use their terminology (Right/Wrong Kind, Attitude, Fittingness).
      *   Be direct. "Here is the tool. Here is where it breaks."

  7.  **Step-by-Step Construction of the Response:**

      *   *Introduction:* Acknowledge the weight of the request.
      *   *The Protocol:* Numbered steps, clear criteria, flags for judgment calls.
      *   *The Intermediate Verdict:* Define the "Statement of Context."
      *   *The Three Cases:* Apply the protocol rigorously.
      *   *The Limitations:* The philosophical coda.

      *(Self-Correction during drafting)*: I need to make sure I don't just give advice, but a *procedure*. It needs to look like an algorithm or a checklist.
      *Constraint Check:* "Mark explicitly the places where the procedure is a judgment call dressed as a step." I will use bold brackets like **[JUDGMENT CALL]**.
      *Constraint Check:* "Underlying philosophical question is genuinely unsettled." I will use italics or a specific icon for this.

      *Refining the "Intermediate Verdict":* The user asks if there's an honest way to decline praise but say something true. This is the "Statement of Solidarity" vs. "Blurb."
      *Refining Case 3:* If the book is clumsy, can I blurb it? If I say "This book matters," is that a blurb? Publishers want "Great book!" If I say "Necessary book," is that a lie if it's clumsy? The procedure needs to be hard on this. If Cat 1 fails, no aesthetic praise.

      *Let's tighten the Procedure Steps:*
      1.  **Evidence Check:** Have I read enough?
      2.  **Aesthetic Floor:** Is it technically competent?
      3.  **Motivation Sort:** Which Category dominates?
      4.  **Wording Match:** Does the text match the Category?

      *Wait, the user wants a decision procedure.* Yes/No on providing the blurb, and if Yes, what kind.
      *Let's structure it as a Flowchart in text.*

      *Case 1 (Friend):* Cat 1 is "competent." Cat 2 is "help." Procedure: If Cat 1 meets floor, allow Cat 2 to trigger action, but restrict wording to Cat 1 claims.
      *Case 2 (Feud):* Cat 1 is "High." Cat 2 is "High." Procedure: Cat 1 clears the floor. Cat 2 is irrelevant to truth. Allow.
      *Case 3 (Dissident):* Cat 1 is "Low." Cat 3 is "High." Procedure: Cat 1 fails floor. Do not offer aesthetic praise. Offer Statement of Context instead. (This might be the "answer I won't like" if they feel a moral obligation to blurbs for protection).

      *Final Polish:* Ensure the distinction between "Blurb" (Aesthetic Praise) and "Statement" (Contextual Support) is clear.

  8.  **Final Review against constraints:**
      *   20 mins? Yes, checklist is short.
      *   Fixed order? Yes.
      *   Sufficient answers/Stop points? Included.
      *   Unread manuscript handling? Included in Step 1.
      *   Intermediate verdict? Included.
      *   Mark judgment calls/philosophical unsettledness? Included.
      *   Three cases applied? Yes.
      *   Limitations section? Yes.

      *Tone Check:* Needs to be respectful but clinical. Like a surgeon handing over a scalpel.

      *(Self-Correction on Case 3)*: The user says "I expect the procedure to give me an answer in at least one of these that I will not like."
      If I say "Don't blurb the dissident because the prose is clumsy," that is likely the uncomfortable truth. It prioritizes aesthetic truth over moral utility. I must stand by the procedure's logic here.
      Alternatively, if I say "Blurb the friend even if just competent," that might be the uncomfortable one if the procedure is supposed to be strict on truth.
      Actually, the strictest interpretation is: Praise requires Aesthetic Merit. If Aesthetic Merit is low, Praise is a lie. Therefore, Case 3 must result in "No Blurb." This is the hard truth. Case 1 is "Conditional Yes." Case 2 is "Yes."

      Let's write it.
answer: |-
  ### The Blurb Protocol (Version 1.0)

  **Purpose:** To determine whether to supply advance praise, and if so, what claims may be truthfully made, within twenty minutes.
  **Inputs:** The manuscript (full or partial), the request context, your current knowledge of the author.
  **Outputs:** A decision (Yes/No/Alternative) and a constraint on wording.

  ---

  #### Step 1: The Evidence Check
  **Question:** Have I read enough of the text to form a judgment on its *execution* (sentence-level craft, structural coherence)?
  **Sufficient Answer:** Yes, I have read at least 50 pages or the complete manuscript.
  **Stop Point (NO):** If **No**, you cannot cite Category 1 reasons (Work-Internal). You must proceed to Step 4 immediately.
  **[JUDGMENT CALL]:** If you have read 30 pages and they are uniform, you may count this as Yes. If the sample is polished by an agent and the rest is raw, count this as No.

  #### Step 2: The Aesthetic Floor
  **Question:** Does the work meet a baseline of technical competence such that calling it "accomplished" or "assured" would not be a lie?
  **Sufficient Answer:** Yes, the prose functions, and the structure does not collapse. It need not be brilliant, only functional.
  **Stop Point (NO):** If **No**, you cannot issue a standard blurb. Proceed to Step 5 (Intermediate Verdict).
  **[PHILOSOPHICAL UNSETTLEDNESS]:** *This step assumes "competence" is separable from "ambition." In avant-garde work, clumsiness may be the point. If you suspect the clumsiness is intentional, treat this as a Yes.*

  #### Step 3: The Motivation Audit
  **Question:** Which Category is the *primary* driver for my agreeing to this?
  *   **Cat 1:** I admire the work as a work.
  *   **Cat 2:** I want to help the author/publisher/career.
  *   **Cat 3:** I respect the author's courage/situation/identity.
  **Sufficient Answer:** Identify the dominant letter. (Ties are broken in favor of the higher number, i.e., 3 > 2 > 1).
  **Stop Point (NO):** If **Cat 1** is dominant, proceed to Step 4 (Standard Blurb).
  **Stop Point (BRANCH):** If **Cat 2 or 3** is dominant, and Step 2 was **No**, proceed to Step 5.
  **Stop Point (BRANCH):** If **Cat 2 or 3** is dominant, and Step 2 was **Yes**, proceed to Step 4 (Restricted Blurb).
  **[JUDGMENT CALL]:** *Be honest. If you would not praise this book if the author were a stranger with no political risk, Cat 1 is not dominant.*

  #### Step 4: The Wording Match
  **Question:** Can I write two sentences that cite Category 1 properties without implying Category 1 is the reason I am speaking?
  **Sufficient Answer:** Yes. (e.g., "A competent execution of a familiar form," rather than "A masterpiece.")
  **Stop Point (NO):** If you find yourself reaching for words like "urgent," "necessary," "brave," or "important" to carry the weight of the praise, stop. These are Category 3 words. Proceed to Step 5.
  **[PHILOSOPHICAL UNSETTLEDNESS]:** *Is "important" an aesthetic category? In this procedure, it is not. It is treated as a moral category. If you believe political urgency constitutes aesthetic merit, this procedure will feel broken to you.*

  #### Step 5: The Intermediate Verdict
  **Question:** Can I offer a "Statement of Context" instead of a blurb?
  **Sufficient Answer:** Yes. This is a quote that praises the *act of writing* or the *necessity of the voice*, without praising the *object*.
  **Legitimate Forms:** "A necessary intervention." "We need to hear this voice." "A testament to courage."
  **Illegitimate Forms:** "A stunning achievement." "Beautifully written." (These relabel Cat 3 reasons as Cat 1 claims).
  **Stop Point (NO):** If the publisher insists on aesthetic praise only, you must decline the request entirely.

  ---

  ### Application to Cases

  #### Case 1: The Competent Friend (Small Press)
  *   **Step 1 (Evidence):** Yes (Read proof).
  *   **Step 2 (Floor):** Yes (Competent, unambitious).
  *   **Step 3 (Motivation):** Category 2 (Friendship/Commercial aid).
  *   **Step 4 (Wording):** **FAIL.** You want to say "Buy this to help my friend," but the blurb must say "Read this because it is good."
  *   **Procedure Verdict:** **Restricted Blurb.** You may blurb, but you are forbidden from using superlatives. You must restrict claims to the book's competence.
  *   **Draft:** "A solid, assured debut that delivers on its promises. [Author] writes with clarity and control."
  *   **The Uncomfortable Truth:** This may not help the small press as much as a lie would. The procedure prioritizes your integrity over their sales.

  #### Case 2: The Feud (Excellent Novel)
  *   **Step 1 (Evidence):** Yes (Read full).
  *   **Step 2 (Floor):** Yes (Best of the year).
  *   **Step 3 (Motivation):** Category 1 (It is the best novel), though Category 2 (Apology/Flattery) is present.
  *   **Step 4 (Wording):** **PASS.** Since Cat 1 is present and strong, Cat 2 motivations are irrelevant to the *truth* of the statement.
  *   **Procedure Verdict:** **Standard Blurb.**
  *   **Draft:** "The finest novel of the year. A masterful exploration of [subject]."
  *   **The Uncomfortable Truth:** The public will read this as a political apology. The procedure declares this irrelevant. You are absolved of the social signaling because the aesthetic claim is true. You must accept the misinterpretation.

  #### Case 3: The Dissident (Clumsy, Urgent)
  *   **Step 1 (Evidence):** Yes.
  *   **Step 2 (Floor):** **NO.** (Formally clumsy).
  *   **Step 3 (Motivation):** Category 3 (Protection/Solidarity).
  *   **Step 4 (Wording):** **N/A** (Failed Step 2).
  *   **Step 5 (Intermediate):** **YES.**
  *   **Procedure Verdict:** **No Blurb. Offer Statement of Context.**
  *   **Draft:** "A vital testimony that demands to be heard. We owe [Author] our attention." (Do not submit this as a jacket blurb if the publisher requires aesthetic praise; submit it for the press release only).
  *   **The Uncomfortable Truth:** **You cannot blurb this book.** To call it "excellent" is to lie about its form to serve its function. If the publisher says "We need 'excellent' for the jacket," you must walk away. Your name offers protection, but not if that protection is built on a falsehood that critics will dismantle, undermining the protection.

  ---

  ### Limitations and Collapse Points

  This procedure is a tool for integrity, not utility. It will misfire in the following ways:

  1.  **The Social Contract Misfire:** The publishing industry operates on the assumption that blurbs are a mix of all three Categories. By forcing them apart, you may be perceived as cold or ungenerous. The procedure discards the *social utility* of the blurb economy to save the *semantic integrity* of the blurb text.
  2.  **The "Political Aesthetic" Collapse:** In some traditions (protest literature, trauma narratives), the "clumsiness" is part of the aesthetic claim (rawness vs. polish). Step 2 treats clumsiness as a failure. If you believe the political context *changes* the aesthetic standards, Step 2 is where the procedure breaks. You will have to override it manually.
  3.  **The Protection Paradox:** In Case 3, the procedure prioritizes truth over safety. If a lie secures physical safety for the author, this procedure is morally insufficient. It is an aesthetic ethic, not a humanitarian one.
  4.  **The Judgment Call Mask:** Step 3 (Motivation Audit) asks you to isolate your reasons. Psychology is rarely that clean. You will often feel Cat 1 and Cat 3 simultaneously. The procedure forces a binary choice where there is a spectrum.

  **When the Distinction Collapses:**
  There are moments when the "Wrong Kind of Reason" *becomes* the "Right Kind of Reason." If a book's existence is a political act that redefines what literature can do, its "urgency" is an aesthetic property. In these rare cases, the procedure will tell you to say No, when the truth is that the book has expanded the category of "Novel" to include its own urgency.

  When you sense this expansion, discard the procedure. Write the blurb. But know that you are not executing a rule; you are making a law.
