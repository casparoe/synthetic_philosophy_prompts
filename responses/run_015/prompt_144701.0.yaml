      *   **Manner Specifics:** Manner is about *how* something is said, not *what*. Flouting Manner often signals "there's more to this" or "I'm being precise/evasive for a reason."
      *   **Opting Out:** There is a mechanism for suspending the CP ("I can't say more"), which is different from flouting. K might be confusing flouting with opting out.

