prompt: |-
  Two people in my phil seminar were going at it about Kant and animals while I was just trying to eat my sandwich. Maya said Kant's indirect-duty view — that cruelty to animals is wrong mainly because it damages our character for dealing with people — actually collapses into a direct duty if you look closely, since you're still tracking the animal's suffering, you're just routing the moral reason through your own soul. Leo said that's missing the metaphysics entirely: only rational nature has unconditional worth, so animals are literally just instruments for moral self-cultivation, full stop. Then Maya pushed back with this idea about a kind of proto-rational awareness — like an animal that can anticipate future pain and adjust its behavior might sit in a weird middle zone, not a full rational being but not just a thing either, and she said Kant's texts don't clearly close off that middle ground. Leo said that's exactly smuggling direct duties in through the back door, and that Kant's distinction is binary — either you're an end in yourself or you're a means — with no in-between category anywhere in his major ethical writings. They kept going and asked me to referee but I honestly don't know the literature well enough. Can you walk through each of their four moves and rate them from clearly wrong to clearly right? Also please seperate what's pretty settled from what's genuinely contested among people who actually study this stuff, and don't present a hot take as if it's the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

