  When eighteen-forty-seven signed the stone,
  The river bound the confederates in trade,
  Though worlds shift courses never fully known,
  Though other men the same positions made.
  Yet intuition holds the pact remains,
  Though signers lack the origin they claimed,
  It is the same agreement that sustains
  Its identity cross all worlds unblamed.

  But Lewis breaks the claim of self-same frame,
  For distinct worlds hold no identity;
  A counterpart fits the structural name,
  By resemblance, not strict necessity.
  Lewis denies this document is the one,
  Kripke affirms it; dispute is not done.
