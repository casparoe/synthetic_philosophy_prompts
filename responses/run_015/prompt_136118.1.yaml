      *   The challenge: How to make 15 grad students feel the weight of choosing a point on a continuum where no point is better than another, under pressure, without money.
      *   The "Payoff": Needs to be meaningful enough to induce stress but not monetary. Social capital, epistemic credit, or avoiding a mild penalty works well in grad seminars. Let's use "Seminar Credit/Participation Points" but structured as a collective resource or individual validation. Actually, a "Certificate of Rationality" or simply the avoidance of a "Null Result" record is better. Let's go with *Epistemic Validation*: The goal is to produce a "Justified Decision Record." Failure means the decision is recorded as "Arbitrary." Grad students care about their intellectual reputation.

