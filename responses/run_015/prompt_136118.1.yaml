  5.  **Refining the Details:**
      *   *Payoff:* Non-monetary. Let's use "The Record." The session is minuted. A "Null Decision" is entered into the permanent record of the seminar. Grad students hate permanent records of failure.
      *   *Rules:* Strict silence. No non-verbal signaling (staring, nodding).
      *   *Symmetry:* Remove name tags. Stand in a circle.
      *   *The "Moment":* When the timer hits zero.
      *   *Recovery:* If they freeze completely, the facilitator (Physicist) introduces a "Fluctuation" (drops a pen).
