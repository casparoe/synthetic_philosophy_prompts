      *   *Check Tone:* Ensure it sounds like a strong student essay, not a professor's lecture.
      *   *Check Constraints:* No citations. 45 min limit implied by length/depth.
      *   *Check the "Hard" Factor:* Does this prevent the "burnout is bad" generic essay? Yes, because they have to justify *why* it's bad based on a specific metaphysical claim about work, not just health outcomes.
      *   *Check the Karoshi Paradox:* The model answer must tackle the "voluntary" aspect. If they chose it, was it good?
