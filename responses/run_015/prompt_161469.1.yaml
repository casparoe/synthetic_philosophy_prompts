answer: |-
  ### The Exam Question

  **Topic:** The Value of Labor and the Limits of Leisure
  **Time:** 45 Minutes
  **Marks:** 25

  **Question:**
  Consider the worker who freely chooses an eighty-hour week, takes pride in their exhaustion, and eventually dies from the strain (*karoshi*). The Protestant Work Ethic traditionally values labor as a moral duty. Does this worker's death represent the ultimate fulfillment of the work ethic, or its moral collapse?

  In your answer, you must commit to one specific reason why work is supposedly good:
  1.  Because it **disciplines the soul** (effort is the virtue).
  2.  Because it **provides needed goods** (utility is the virtue).
  3.  Because it **entitles you to consumption** (work is the price of leisure).

  Explain why your chosen reason forces you to either **honor** or **condemn** this worker. You must also show why the other two reasons fail to handle this case consistently. You cannot argue that "balance is best" or appeal to physical health; you must argue from the definition of value itself.

  ***

  ### Model Answer (Approx. 700 Words)

  **Thesis: Work is Valuable Only Because It Provides Needed Goods (Utility)**

  To determine whether the voluntary martyr of overwork is a saint or a fool, we must first decide what work is *for*. I argue that work possesses moral value solely because it provides needed goods to the community (Utility). Under this definition, the worker who dies from *karoshi* is not a hero, but a moral failure. They have destroyed the primary tool of production—their own capacity to labor—for the sake of a feeling. This stance reveals that the other two definitions of work (Discipline and Consumption) are logically incoherent when pushed to their limits.

  If work is good because it disciplines the soul (Effort), then the *karoshi* victim is indeed a saint. This view holds that the struggle itself purifies the worker. However, this definition collapses when faced with the question of useless labor. If effort is the only virtue, then digging a hole and filling it back up is morally equal to building a hospital, provided the sweat is equal. Most proponents of the work ethic reject this; they believe building the hospital is *better*. Why? Because the hospital helps people. This admits that utility matters more than effort. Furthermore, if discipline is the goal, serious rock climbing or mastering the cello should confer the same moral status as employment. The fact that society does not grant "worker dignity" to the climber proves that we do not actually value effort for its own sake. We value what the effort *buys* the community. Therefore, the Discipline view cannot consistently condemn useless work, nor can it explain why the *karoshi* victim is tragic rather than triumphant.

  If work is merely the price of admission for leisure (Consumption), the *karoshi* victim is a fool who paid too much. This view treats work as a disutility—a negative thing endured to unlock the positive thing (free time). But this creates a paradox: if work is inherently bad, why do we feel shame when we don't do it? If leisure is what we are owed, then the person who refuses to work should be morally neutral, yet the work ethic labels them lazy. This suggests work has intrinsic value, not just instrumental value. Additionally, this view cannot handle automation. If a machine does my job better than me, and work is only a ticket to eat, then I am obsolete and deserve starvation. But if work is about providing needed goods, then the machine doing the job is a victory, and my leisure is no longer a "reward" but a logical redistribution of surplus. The Consumption view traps us in a zero-sum game where human labor must be preserved even when inefficient, simply to justify existence.

  Returning to the Utility view: Work is good because it sustains the community. Therefore, the worker's body is capital. To work yourself to death is to burn the factory to keep the furnace warm for one night. It is inefficient and morally wrong because it removes your future utility. The pride the worker feels is irrelevant; feelings do not feed the community. This leads to a hard conclusion about leisure. Leisure is not a reward you earn, nor is it a right you are owed simply for breathing. Leisure is maintenance time. It is the period required to repair the worker so they can return to utility.

  This creates a stark implication for the future. If automation removes the need for my labor, I am not "owed" a job. I am owed survival, because the community still needs to be sustained, but my specific labor is no longer the mechanism. The Work Ethic, properly understood as Utility, demands we maximize output with minimum human cost. The *karoshi* victim violates this by maximizing cost for negligible gain in output. They treated work as a performance of virtue rather than a function of sustenance.

  In conclusion, the voluntary death by overwork is a condemnation of the worker's moral reasoning. They confused the *sign* of virtue (exhaustion) with the *substance* of virtue (provision). By choosing the Utility definition, we must honor the machine that works without dying over the human who dies without producing. Any other view collapses into asceticism or entitlement. Work is not about who you are; it is about what you do for others. When you can no longer do for others, the work ethic has nothing to say to you, and you should rest without guilt.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. The Commitment (5 Marks)**
  *   **Must Hit:** The essay explicitly selects one of the three definitions (Discipline, Utility, or Consumption) in the introduction and does not waver.
  *   **Common Pitfall:** The student tries to combine them (e.g., "Work is good because it disciplines us AND helps people") which avoids the hard choice the question demands.

  **2. The Verdict on *Karoshi* (5 Marks)**
  *   **Must Hit:** The essay clearly states whether the worker is honored or condemned based *strictly* on the chosen definition. (e.g., "Under Utility, death is waste, therefore condemned.")
  *   **Common Pitfall:** The student condemns the death because "health is important" or "burnout is sad." This appeals to external morality rather than the internal logic of their chosen work definition.

  **3. The Rejection of Alternatives (5 Marks)**
  *   **Must Hit:** The essay explains why the *other two* definitions fail to handle the case consistently (e.g., explaining why the Discipline view makes useless labor virtuous).
  *   **Common Pitfall:** The student straw-mans the other views (e.g., "The other views are just capitalist exploitation") instead of addressing their philosophical logic.

  **4. The Leisure/Automation Implication (5 Marks)**
  *   **Must Hit:** The essay addresses what happens to leisure or the worker's value when labor is no longer needed (the machine problem).
  *   **Common Pitfall:** The student ignores the automation angle or defaults to "Universal Basic Income" without explaining how it fits their definition of work's value.

  **5. Coherence and Tone (5 Marks)**
  *   **Must Hit:** The argument flows logically without contradictions, and the tone remains analytical rather than emotional.
  *   **Common Pitfall:** The student slips into "balance is best" rhetoric in the conclusion, undermining the controversial stance taken in the introduction.
