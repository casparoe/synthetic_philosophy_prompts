      *   **Topic:** Work and Leisure.
      *   **Constraints/Requirements:**
          *   Must be *hard* (avoid generic "hustle culture/burnout" essays).
          *   Must force a choice between three specific conceptions of work's value:
              1.  Effort/Discipline (asceticism).
              2.  Social Utility/Being Needed (production).
              3.  Moral Condition for Consumption (no work, no eat).
          *   Must address the tension between *karoshi* (death by overwork) and the Work Ethic (voluntary discipline). If someone *chooses* 80 hours and dies, is it a violation or a fulfillment?
          *   **Deliverables:**
              1.  One Essay Question.
              2.  Model Answer (approx. 700 words, must commit to a stance, no fence-sitting).
              3.  Marking Scheme (5 must-hit points with marks + common pitfalls for each).
          *   **Tone:** Engaging, rigorous, no academic citations/library access needed.

  2.  **Deconstruct the Philosophical Tension:**
      *   The user identifies a tripartite ambiguity in "why work is good."
      *   *Tension 1:* Effort vs. Utility. If effort is the virtue, why doesn't climbing rocks count? If utility is the virtue, what happens when automation removes utility?
      *   *Tension 2:* Coercion vs. Volition in *Karoshi*. The Work Ethic praises the *will* to work. *Karoshi* is often seen as exploitation. But if the worker *wills* the overwork, does the Work Ethic celebrate the death as the ultimate sacrifice, or condemn it as a loss of productivity?
      *   *Goal:* The question needs to force the student to pick a definition of work's value and face the consequences (e.g., automation, voluntary death).

  3.  **Drafting the Question:**
      *   Needs to be punchy.
      *   Needs to incorporate the *karoshi* paradox and the definition of value.
      *   *Draft 1:* Is work good because it is hard or because it is useful? Discuss with reference to karoshi. (Too simple)
