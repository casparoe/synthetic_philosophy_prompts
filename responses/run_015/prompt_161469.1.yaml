      *   *Refined Question:* "The Protestant Work Ethic praises the discipline of labor itself. Yet, when 'karoshi' (death by overwork) occurs voluntarily—chosen by a proud employee rather than forced by a boss—it presents a paradox. If work is morally valuable because it is difficult, the karoshi victim is a saint. If work is valuable because it produces needed goods, they are a waste. If work is merely the price of admission for leisure, they are a fool. Defend one of these three accounts of work's value. Then, explain why your chosen account must condemn *or* celebrate the voluntary martyr of overwork. You cannot argue that 'balance is best.'"

      *   *Polishing for Exam Style:* Make it tighter.
      *   *Final Question:* "Consider the worker who freely chooses an eighty-hour week, takes pride in their exhaustion, and eventually dies from the strain (karoshi). The Protestant Work Ethic traditionally values labor as a moral duty. Does this worker's death represent the ultimate fulfillment of the work ethic, or its moral collapse? In your answer, you must commit to one specific reason why work is supposedly good: (1) because it disciplines the soul, (2) because it provides needed goods, or (3) because it entitles you to consumption. Explain why your chosen reason forces you to either honor or condemn this worker, and show why the other two reasons fail to handle this case consistently."

  4.  **Drafting the Model Answer:**
      *   *Constraint:* ~700 words. No fence-sitting. Must commit.
      *   *Strategy:* I'll choose option (1) "Discipline of the Soul" but argue that even this collapses when death occurs, OR I'll choose (2) "Utility" and argue the worker is wasted.
      *   *Better Strategy for Clarity:* Choose (2) "Utility/Being Needed." It allows for a sharp critique of the "Discipline" view.
      *   *Thesis:* Work is only valuable because it sustains the community (Utility). Therefore, the voluntary martyr is not a saint but a waste. The "Discipline" view is selfish asceticism.
      *   *Structure:*
          1.  Intro: State the choice (Utility).
          2.  Critique Discipline (Why rocks/cello don't count).
          3.  Address Karoshi (Death removes utility, so it's bad).
          4.  Address Leisure (Leisure is recovery for more work, not a reward).
          5.  Conclusion: Reiterate the commitment.
      *   *Tone:* Assertive, philosophical, clear.

  5.  **Drafting the Marking Scheme:**
      *   5 Must-Hit Points (Total 25 marks).
      *   Need specific criteria based on the prompt's requirements.
