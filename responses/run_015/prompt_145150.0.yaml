  3. An alternative principle is that strict moral obligations arise only from specific historical culpability like colonialism or direct persecution, rather than general environmental crises. This could predict he might tolerate the visa as a discretionary humanitarian gesture rather than condemning it as a rights violation.
  4. Dummett would likely condemn the proposal because it creates a caste of temporary laborers denied family unity, violating his commitment to equal moral standing and refugee protection. The coercive labor requirement treats displaced persons as economic tools rather than rights-bearing individuals deserving of immediate security.
  5. I am moderately confident in this reconstruction, given his strong published stance on refugees and anti-racism. The point of least certainty is whether he would categorize climate displacement as morally equivalent to genocide-induced displacement regarding the right to immediate citizenship.
