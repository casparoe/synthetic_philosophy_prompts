      *   *Tension 2: Phenomenal Transparency vs. Opacity.* We want conceivability to reveal essence (transparency), but if physicalism is true, phenomenology might be opaque to conceptual analysis.
      *   *Tension 3: Modal Security vs. Fallibilism.* We want the bridge to be strong enough to refute physicalism (if zombies are conceivable), but weak enough to allow for necessary a posteriori truths (water = H2O).

  7.  **Evaluating the Views:**
