      *   It needs to handle the "gap" cases (where intuition fails).
      *   It needs to respect cognitive architecture (we aren't ideal reasoners).

  3.  **Drafting the Desiderata:**
      *   *D1: Error Correction.* Must distinguish between "seems possible" and "is possible." (Prima facie vs. Ideal).
      *   *D2: Phenomenal Specificity.* Must handle cases where phenomenology outstrips concepts (Inverted spectrum without concept).
      *   *D3: Structural/Functional Limits.* Must handle cases where structure outstrips phenomenology (Distributed cognition).
      *   *D4: Modal Strength.* Must distinguish logical coherence from metaphysical grounding (Kripkean necessary a posteriori).

  4.  **Addressing the "Hard Cases" (as requested):**
      *   *Case 1: Inverted Colour/No Concept.* Why is this a test? Because if you can conceive the inversion but lack the concept to describe it, is it genuine conceivability? The theory must explain how phenomenology constrains possibility independently of conceptual repertoire.
      *   *Case 2: Distributed Cognition.* Why is this a test? Because we conceive of minds as unified. If a system is distributed, can we *really* conceive of its consciousness, or are we projecting unity? The theory must account for the limits of our imaginative projection.

  5.  **Identifying Distinctions & Collapses:**
