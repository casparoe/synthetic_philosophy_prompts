prompt: |-
  Right, I'm trying to sort out what a decent bridge principle between conceivability and metaphysical possibility actually has to do, and I'm tired of people just waving at 'zombies are conceivable therefore physicalism is false'. Write me hte desiderata: what must any theory linking what we can genuinely conceive to what's possible actually deliver? I want the cases it must cover — like conceiving inverted colour spaces in a being with intact behavioural discrimination but no corresponding phenomenal concept, or imagining a distributed cognitive system with no single locus of awareness — with why each is a test. Also flag which distinctions it can't collapse (e.g., prima facie vs. ideal conceivability, logical vs. metaphysical) and which pairs of desiderata look jointly impossible, especially if you think the architechture of human working memory puts hard limits on modal imagination that no theory can fully accomodate. Keep it brief, no need to score every view, but do say how a standard Chalmers-style two-dimensional approach and a more deflationary 'conceivability as heuristic' view fare on the list. And please — no bibliography, I'm not writing an essay, just trying to think straight.
