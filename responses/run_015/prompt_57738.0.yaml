      *   *Recommendation:* Pick the "Single Change".

      *(Self-Correction during drafting)*: I need to be careful with the "Append-Only" analogy. In distributed logs (like Kafka), append-only means you can't *change* history, but the future isn't written. In a Block Universe, the future *is* written. The user tries to combine them in (5) by saying "Block is the log... entries get appended". This is the **Growing Block Theory**. But (2) says "future... already real". These are mutually exclusive. I need to highlight this contradiction sharply.

      *(Refining the Systems Analogy)*:
      *   Block Universe = Full database dump (t=0 to t=end).
