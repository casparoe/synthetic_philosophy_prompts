      These are logically incompatible. You cannot have a future that is *already real* (2) and also *gets appended* (5).
      *Decision:* This is the primary contradiction to attack.

      *Second major contradiction:* (1) SR (no global now) vs (4) CMB (global now).
      *Decision:* This is the second attack vector.

      *Third:* (3) Everett (deterministic wavefunction) vs (3) Objective Chance.
      *Decision:* Mention this as a technical inconsistency.

      *Recommendation:* The "Single Change" should be to drop the ontological weight of the "Head Pointer" (5) and the "Special Frame" (4). Embrace the Block Universe (2) fully, and treat (3), (6), (8) as internal experiences within the block. This aligns best with (1).

