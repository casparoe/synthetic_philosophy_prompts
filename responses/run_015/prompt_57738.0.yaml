          *   *Issue:* SR says no frame is physically privileged regarding simultaneity. (4) claims the CMB frame *is* privileged for "now". (5) builds a metaphysical structure (Growing Block) on top of this. While the CMB frame is *convenient*, claiming it defines *ontological becoming* violates the spirit of SR (Lorentz Invariance). It reintroduces absolute simultaneity disguised as cosmology.
          *   *Severity:* **High.** It undermines the relativistic foundation of (1) and (2).
          *   *Systems Analogy:* You're building a distributed system that claims "no global clock" (1) but then hardcodes a specific NTP server as the "True Time" (4) for consensus. It works, but it breaks the abstraction guarantee.

      *   **Conflict C: (5) Append-Only/Growing Block vs. (2) Static Block.**
          *   *Issue:* (2) says past/present/future *all* sit there. (5) says entries get *appended*. These are different models (Eternalism vs. Growing Block). In Growing Block, the future *doesn't exist yet*. In Eternalism, it does. You can't have a "head pointer" moving through a block that is already fully written.
          *   *Severity:* **High.** Direct contradiction in the model of time.
          *   *Systems Analogy:* Is the database schema fully migrated (BU) or are we streaming writes (Growing Block)?

      *   **Conflict D: (9) Time Travel vs. (5) Append-Only.**
          *   *Issue:* If time is append-only (5), you can't rewrite the past. Time travel usually implies Closed Timelike Curves (CTCs). If you travel back, are you appending a new branch (Everett) or modifying existing state? If BU (2), the travel event is already in the block. If Append-Only (5), you can't go back to a "written" section.
          *   *Severity:* **Medium.** Depends on the mechanism of time travel (Novikov self-consistency vs. branching).
          *   *Systems Analogy:* Can you seek() backwards in a write-once log?

      *   **Conflict E: (3) Everett vs. (3) Objective Chance.**
          *   *Issue:* Everett (Many Worlds) is deterministic (unitary evolution). "Objective chance" usually implies stochastic collapse. In Everett, probability is emergent/subjective (measure of branches), not fundamental chance.
          *   *Severity:* **Medium.** Technical QM nuance.

