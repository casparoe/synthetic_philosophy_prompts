      *   SR = Leaderless/Multi-Leader (no single truth).

      *(Refining the "Single Change")*: The user wants coherence. The biggest tension is between the *feeling* of becoming (5, 6) and the *physics* of SR/BU (1, 2). The most coherent physics-aligned view is to drop the ontological status of "Appending" (5) and treat it as epistemic/phenomenological. However, the user *likes* (5).
