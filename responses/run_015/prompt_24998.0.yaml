answer: |-
  This is a classic debate in formal epistemology, and you have stumbled into one of the most famous unsolved problems in philosophy of probability. The short answer is: **Neither of them is definitively "right," and neither is definitively "wrong."**

  The Sleeping Beauty problem (popularized by philosopher Adam Elga in 2000) splits experts almost evenly. Your roommate is arguing the **Halfer** position (championed by philosopher David Lewis), and his girlfriend is arguing the **Thirder** position (championed by Elga).

  Because there is no mathematical consensus, I can't declare a winner. However, I can break down their exchange move-by-move to show you where each argument holds water, where it leaks, and what they are actually disagreeing about.

  Here is the play-by-play.

  ### Round 1: "No New Information" vs. "Self-Locating Evidence"

  **The Roommate (Halfer):** "She hasn't learned anything new... her credence shouldn't move."
  **The Girlfriend (Thirder):** "The fact that she's awake right now is something that happens twice as often under tails..."

  *   **Who is right?** They are both right, but they are defining "information" differently.
  *   **The Roommate's Point:** In classical statistics, you update probabilities based on new *propositional* evidence. Beauty knew before the experiment that she would be woken up at least once. Therefore, the event "Beauty wakes up" has a probability of 1 in both Heads and Tails worlds. Mathematically, $P(\text{Wake} | \text{Heads}) = 1$ and $P(\text{Wake} | \text{Tails}) = 1$. By Bayes' Theorem, if the likelihoods are equal, the posterior probability equals the prior (1/2). From a strictly external, "God's eye" view of the coin, he is correct.
  *   **The Girlfriend's Point:** She is arguing about *indexical* or *self-locating* information. Beauty didn't just learn "I am awake." She learned "I am awake *now*." This is new information because she doesn't know which "now" it is. Under Tails, there are two "nows" (Monday and Tuesday); under Heads, there is only one. She has gained the information that she is currently experiencing one of the awakening moments.
  *   **The Missed Nuance:** The roommate is treating the awakening as a guaranteed event (which it is). The girlfriend is treating the *specific instance* of awakening as a random sample from the set of all possible awakenings.

  ### Round 2: "Counting Awakenings" vs. "Not Exclusive Worlds"

  **The Roommate:** "Those three aren't exclusive... If the coin is tails, she gets two awakenings, not one."
  **The Girlfriend:** "The number of awakenings is the evidence... 2:1 likelihood ratio against heads."

  *   **Who is right?** The Roommate identifies a structural risk; the Girlfriend identifies the phenomenological reality.
  *   **The Roommate's Point:** He is correctly identifying that Monday-Tails and Tuesday-Tails are not mutually exclusive alternative worlds in the standard sense; they are causally linked events in the *same* world. In standard probability, you sum probabilities of mutually exclusive outcomes. If you treat the three awakenings as equally probable "worlds," you are implicitly assuming the "Self-Indication Assumption" (SIA), which is controversial.
  *   **The Girlfriend's Point:** She is applying the **Principle of Indifference** to "centered possible worlds." Since Beauty cannot distinguish between Monday-Heads, Monday-Tails, or Tuesday-Tails, she should treat them as equiprobable. Her argument is that from Beauty's *internal perspective*, the causal link between Mon-Tails and Tue-Tails is invisible due to the memory wipe. To her, they feel like distinct possibilities.
  *   **The Missed Nuance:** The roommate is worried about double-counting the Tails world. The girlfriend argues you *should* double-count it because the observer experiences it twice.

  ### Round 3: The Betting Argument (The Strongest Round)

  **The Girlfriend:** "Suppose we run the experiment a hundred times... she'll lose money [if she bets at 1/2 odds]."
  **The Roommate:** "You're asking about the frequency of correct guesses per awakening, but the original question is about her credence in the coin."

  *   **Who is right?** This is the crux of the entire debate. **The Girlfriend has the stronger pragmatic argument here, but the Roommate has the stronger theoretical defense.**
  *   **The Girlfriend's Point:** This is the "Dutch Book" argument. In decision theory, your credence *is* your betting price. If you claim $P(\text{Heads}) = 1/2$, you should be willing to bet even money. But if you bet even money every time you wake up, you will lose money in the long run (you bet \$100 on 100 awakenings; ~50 are Tails-Mon, ~50 are Tails-Tue, ~50 are Heads-Mon. You win 50 times, lose 100 times). If your credence doesn't match your optimal betting strategy, your epistemology is arguably broken.
  *   **The Roommate's Point:** He argues that **Credence $\neq$ Betting Strategy** in cases of correlated bets. A rational Halfer can maintain $P(\text{Heads}) = 1/2$ but recognize that the bet is offered twice on Tails. She can calculate: "I believe the coin is 1/2 Heads, but since I'm being asked to bet twice if it's Tails, I should decline the bet or adjust my stake." He claims the betting frequency measures the *number of awakenings*, not the *probability of the coin*.
  *   **The Missed Nuance:** The roommate is technically correct that betting frequency $\neq$ coin frequency. However, the girlfriend is correct that for the *agent waking up*, the distinction often doesn't matter. If your belief doesn't help you make money in a repeated scenario, is it a useful belief?

  ### The Core Disagreement: Reference Classes

  The reason they are talking past each other is that they are answering slightly different questions using the same words.

  1.  **The Roommate is answering:** "What is the probability that the coin *landed* heads?"
      *   Reference Class: Coin flips.
      *   Answer: 1/2. (This is objectively true about the physical coin).
  2.  **The Girlfriend is answering:** "What is the probability that *this current awakening* is associated with a heads coin?"
      *   Reference Class: Awakenings.
      *   Answer: 1/3. (This is objectively true about the experience of waking up).

  ### Who is "More Right" Overall?

  If you forced me to judge the quality of their arguments based on the current state of academic literature:

  **The Girlfriend (Thirder) has the slight edge.**

  Here is why:
  1.  **Decision Theory:** The betting argument is very hard for Halfers to shake without making awkward distinctions between "credence" and "betting odds." Most modern decision theorists prefer a system where belief guides action seamlessly. The Thirder position allows Beauty to bet rationally without needing a special "correlated bet" clause in her decision matrix.
  2.  **The "New Information" Rebuttal:** While the Roommate is right that she knew she'd wake up, the Thirder successfully argues she didn't know she'd wake up *in this specific temporal context*. The "Self-Locating Belief" framework is now a standard part of epistemology, largely because of this problem.
  3.  **Consilience:** The Thirder position aligns better with how we handle similar problems in physics (like the Doomsday Argument or quantum many-worlds interpretations), where observer-moments are weighted by their frequency.

  **However, the Roommate is not "wrong."**
  His position is logically consistent *if* you define credence strictly as confidence in the physical state of the coin, independent of the observer. His warning about the Principle of Indifference is also valid; indiscriminate use of indifference *does* lead to paradoxes elsewhere (like Bertrand's Paradox).

  ### The Verdict for Your Living Room

  *   **Roommate (Stats):** He is protecting the integrity of the **coin**. He is right that the coin doesn't change its bias just because Beauty wakes up. His error is assuming Beauty's question is about the coin's physical history rather than her current epistemic situation.
  *   **Girlfriend (Philosophy):** She is protecting the integrity of the **observer**. She is right that Beauty's rational actions depend on the 1/3 frequency. Her potential error is conflating the frequency of *experiences* with the frequency of *causes*.

  **Who won the argument?**
  Technically, it's a draw. But pragmatically? **The Girlfriend.**
  In the real world, if Beauty has to make decisions based on her waking state, the 1/3 model yields better outcomes without requiring complex caveats about "correlated bets." The Roommate's 1/2 model requires her to believe one thing ($P=1/2$) but act as if she believes another ($P=1/3$) to avoid losing money. In epistemology, having to split your belief from your action is usually seen as a bug, not a feature.

  Tell your roommate he's mathematically safe but pragmatically vulnerable. Tell his girlfriend she's pragmatically safe but ontologically controversial. Then suggest they order pizza, because this problem has kept tenured professors awake for 20 years; they won't solve it over dinner.
