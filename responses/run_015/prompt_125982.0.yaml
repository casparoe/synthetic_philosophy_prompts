answer: |-
  First off, hang in there. 2 AM philosophy of science brain is a specific kind of tired, and the Doomsday Argument (DA) is notorious for inducing headaches even at noon. Your confusion is not a bug; it's a feature. You have stumbled onto the exact reasons why half the field thinks DA is profound and the other half thinks it's garbage.

  You are asking three distinct questions that get tangled together. Let's untangle them: the **causal vs. probabilistic** issue (your student program example), the **reference class** issue (who counts?), and the **SSA vs. SIA** issue (why the multiverse changes things).

  Here is the breakdown without the hand-waving.

  ### 1. The Student Program Counter-Example (Causality vs. Ignorance)

  You asked: *"If I'm student #12, shouldn't DA predict total enrollment is ~30? But enrollment is fixed by funding."*

  **The Short Answer:** The Doomsday Argument only works under **radical ignorance** of the mechanism determining $N$ (total number).

  **The Long Answer:**
  The DA is a Bayesian update.
  $$P(N | n) \propto P(n | N) \times P(N)$$
  *   $P(n | N)$ is the likelihood: If there are $N$ humans, what are the odds I am number $n$? (This is $1/N$).
  *   $P(N)$ is the **prior**: What did I think about total human population *before* I considered my birth rank?

  In your university program example, your prior $P(N)$ is not a vague distribution. You have hard data: "The department has funding for 100 spots." Your prior probability that $N=100$ is nearly 1.0.
  When you update on being student #12, the math looks like this:
  *   Likelihood of being #12 if $N=100$: $1/100$
  *   Likelihood of being #12 if $N=30$: $1/30$
  *   **BUT** Prior probability of $N=30$: ~0% (because you read the budget).
  *   **BUT** Prior probability of $N=100$: ~100%.

  The "hard evidence" (budget) swamps the "indexical evidence" (my birth rank).

  **Why does DA claim to work for Humans?**
  Carter's argument assumes we **do not** have a "budget" for humanity. We don't know the carrying capacity of Earth, the risk of asteroids, or the probability of nuclear war. We are treating $N$ as an unknown parameter drawn from a vague prior (often $1/N$).
  *   **Your confusion:** "Is DA smuggling in a causal claim?"
  *   **Correction:** No, it's smuggling in an **ignorance claim**. It assumes there is no external variable fixing $N$ that we know about. If we knew the "humanity budget" (e.g., "Earth can sustain 1 trillion lives"), DA would vanish just like in your student example.

  ### 2. The Reference Class Problem (Who is "Me"?)

  You asked: *"How do we non-arbitrarily choose 'all humans' over 'all people in this seminar'?"*

  This is the strongest objection to DA (raised by philosophers like Ken Olum and Darren Bradley). There is no consensus on a non-arbitrary rule, but here is the boundary condition most proponents use:

  **The Rule of Epistemic Peers:**
  The reference class must consist of **observers who you could have been**, given your current evidence.
  *   **Seminar Class:** You could not have been a student in a different program (different location, different interests). So the class is "Students in this program." But as we saw above, you know $N$ for this class via external evidence, so DA doesn't bite.
  *   **All Humans:** Could you have been born in 1800? Yes. Could you have been born in 3000? The argument assumes yes (if they exist).
  *   **All Conscious Observers:** Could you have been an AI? A dolphin? An alien?
      *   If you include AI in the reference class, and AI vastly outnumbers biological humans later, your rank $n$ (as a biological human) becomes *extremely* early. This makes Doom look even closer (or implies biological humans are a tiny blip).
      *   If you exclude AI, you have to justify why "consciousness like mine" is restricted to biology.

  **The Hard Truth:** There is no agreed-upon solution. If you define the class as "People named [Your Name]," $N=1$, and DA breaks. If you define it as "All sentient matter," $N$ is infinite, and DA breaks.
  *   **Boundary Condition:** The class must be defined by **indistinguishability**. If you cannot distinguish yourself from other members of the class *except* by your birth rank, they belong in the class. Since you can distinguish yourself from a dolphin (you're human), dolphins might be out. Since you can't distinguish yourself from a future human (except by time), they are in.

  ### 3. SSA vs. SIA (Why the Multiverse Changes Things)

  You asked: *"Why does SIA cancel the Doomsday update, and why doesn't it apply to my seminar?"*

  This is the technical core.

  **SSA (Self-Sampling Assumption):**
  "Reason as if you are a random sample from the reference class."
  *   This leads to DA. It says: "In a world with 1 trillion humans, it's unlikely I'd be #100 billion. So I probably don't live in that world."

  **SIA (Self-Indication Assumption):**
  "Reason as if you are more likely to exist in a world with more observers."
  *   This cancels DA. It says: "A world with 1 trillion humans has 1 trillion 'slots' for me to occupy. A world with 100 humans has 100 slots. I am 10 trillion times more likely to exist in the big world."
  *   **The Math:** The likelihood penalty for being early ($1/N$) is exactly cancelled by the prior probability boost for existing in a large world ($N$).
      *   $P(World_{big}) \propto N$
      *   $P(Me | World_{big}) \propto 1/N$
      *   Product = Constant. No Doomsday update.

  **Why SIA in Multiverse contexts?**
  In multiverse cosmology, we are often comparing hypotheses where the *number of observers* varies wildly between worlds. SIA is attractive there because it avoids the "Presumptuous Philosopher" problem in reverse (believing the universe is empty). However, SIA creates its own Presumptuous Philosopher problem: it makes you believe in a huge universe *a priori*, even without evidence.

  **Why not SIA for the Seminar?**
  Actually, **SIA *does* apply to the seminar**, but it gets swamped by the "Budget" prior again.
  *   **Scenario:** You don't know the enrollment cap.
  *   **Hypothesis A:** Cap is 30. (30 slots for you).
  *   **Hypothesis B:** Cap is 1000. (1000 slots for you).
  *   **SIA View:** You are 33x more likely to exist in Hypothesis B.
  *   **SSA View:** Given you exist, you are 33x more likely to be early in Hypothesis A.
  *   **Result:** They cancel out. Your posterior belief about the cap remains your prior belief.

  **So why does DA feel like it works for Humanity?**
  Because for Humanity, we usually assume a **flat prior** on the *fraction* of completion, not the total number.
  *   DA assumes: It is equally likely I am at 1%, 50%, or 99% of the total timeline.
  *   SIA assumes: It is equally likely I exist in a small world or a big world (weighted by size).

  If you apply SIA to humanity, Doomsday vanishes. But many philosophers reject SIA because it implies you can prove the universe is infinite just by sitting in your armchair (the Presumptuous Philosopher objection).

  ### Summary for your Seminar (to sound coherent at 10 AM)

  1.  **The Student Example:** DA fails there not because the logic is wrong, but because you have **independent evidence** (funding caps) that fixes $N$. DA only works when $N$ is truly unknown. It's not a causal claim; it's a claim about ignorance.
  2.  **Reference Class:** There is no non-arbitrary solution. The best defense is "Epistemic Peers" (observers indistinguishable from me except for rank). If you can't justify why future humans are "you-like" but AI/aliens aren't, the argument wobbles.
  3.  **SSA vs. SIA:** DA requires SSA. If you accept SIA (you are more likely to exist in worlds with more people), DA is mathematically cancelled. The choice between SSA and SIA is the real philosophical battle, not the math itself. SSA leads to Doomsday; SIA leads to the Presumptuous Philosopher. Pick your poison.

  Get some sleep. The Doomsday Argument will still be controversial when you wake up.
