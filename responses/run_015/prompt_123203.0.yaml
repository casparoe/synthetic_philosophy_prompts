  11. **Final Polish:** Ensure the distinction between *Reasons Fundamentalism* (Scanlon's meta-ethics) and *Contractualism* (Scanlon's normative ethics) is clear, as the colleague seems to merge them. Ensure the distinction between *axiology* (value) and *normativity* (reasons/oughts) is clear regarding the "value-geometry" claim.

  *(Self-Correction during drafting)*: I should be careful about the "non-cognitive systems" point. Some philosophers (e.g., certain AI ethicists or functionalists) might argue for "reasons" in a functional sense, but the colleague claims *normative* reasons bind them. This is the sticking point. I will flag this as a category error.

