      *   *Nuance:* Simpson's Paradox requires a causal model to resolve. Just seeing the reversal isn't enough; you need to know whether to trust the aggregate or the stratified data. In Berkeley, "Department" is a common cause (or rather, a mediator/confounder depending on the DAG). Actually, in this case, Gender $\to$ Department Choice $\to$ Admission. Department is a mediator. If we control for the mediator, we see the direct effect of Gender on Admission. If we look at the total effect, we see Gender $\to$ Department $\to$ Admission.
      *   *Wait, is Department a Confounder or Mediator?*
