          *   Why were those departments "harder"? (Funding, capacity, prestige).
          *   *Key Insight:* Simpson's Paradox is a statistical phenomenon, not a causal exoneration. It shifts the locus of potential bias from the *decision* to the *pre-decision environment*.
      *   **Implications for A/B Testing (Connecting back to work):**
          *   Briefly touch on how this applies to their work. (e.g., Is the segmentation variable a collider? Is it a confounder? Actionability).
      *   **Confidence Assessment:**
          *   High confidence on the statistical mechanics and the Bickel et al. findings.
