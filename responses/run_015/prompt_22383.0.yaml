      *   **Goal:** The speech itself must *perform* her work. It shouldn't freeze her as a "stable object" or "legend." It needs to acknowledge that speaking about her changes what she was to the audience (the second-order looping point).
      *   **Tone:** Comforting to family, intellectually honest (no pretending categories are innocent), mourning as a process, not a footnote.
      *   **Format:** 4-5 minute eulogy (approx. 600-750 words spoken at a moderate pace).
      *   **Specific Requirement:** One concrete anecdote placeholder.

  2.  **Deconstruct the Intellectual Challenge:**
      *   *The Trap:* Eulogies traditionally try to fix the deceased in memory ("She was kind," "She was brilliant"). This contradicts her life's work, which argued that people and categories are dynamic and co-constitutive.
      *   *The Solution:* The speech must explicitly state that *this speech* is part of the looping process. By remembering her, we are changing her memory, and in doing so, changing ourselves.
      *   *The Second-Order Point:* It's not just that she studied looping; it's that *our mourning* is a looping event. The category "Grief" or "Colleague" or "Friend" is being revised right now in this room.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Address the audience mix (family, clinicians, philosophers). Set the theme immediately: the tension between fixing a memory and honoring a dynamic life.
      *   **The Core Concept (Looping Effects):** Explain it simply but accurately. Connect it to her life. She wasn't just studying patients; she was studying interaction.
      *   **The Anecdote:** Needs to show her in action, noticing the feedback loop. *Idea:* A moment where she corrected a diagnosis or a description because she saw the person reacting to the label. Let's make it about a consultation or a casual conversation where she noticed the language changing the outcome.
      *   **The Second-Order Turn (The Meta-Commentary):** This is crucial. I need to say: "By me standing here, I am changing her." "By us mourning, we are revising the category of 'her'." This validates the philosophers in the room without alienating the family.
      *   **Comfort for the Family:** Acknowledge that "Grief" isn't a static state. It loops too. We will change as we remember her.
