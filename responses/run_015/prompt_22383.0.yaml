answer: |-
  Friends, family, colleagues.

  We are here to do something that [Name] spent her life warning us was impossible to do cleanly. We are here to fix a moving target.

  When someone dies suddenly, the instinct is to turn them into a monument. We want to say, "She *was* this," or "She *was* that." We want to pin her down like a specimen so we can make sense of the loss. But [Name] taught us that people are not specimens. She taught us that human kinds are different from natural kinds. A rock does not care what you call it. But a person? A person hears what you call them, and they change.

  She dedicated her career to Ian Hacking's concept of the "looping effect." She showed us that when we classify a person—as depressed, as resilient, as a patient, as a colleague—that classification feeds back into them. They react to the label, they grow around it, they push against it. And then the label has to change.

  I know there are philosophers in the room who hear the trap I am walking into. If I stand here and tell you who she was, I am creating a category. And if I do that, I am violating the very thing she loved most about being human: our capacity to escape the categories meant to hold us.

  But I think she would want us to use her work to mourn her. Not as a footnote, but as a method.

  I remember a time [Insert Anecdote: e.g., during a case consultation, she stopped a discussion not to correct a diagnosis, but to ask how the word "chronic" was affecting the patient's hope. She noticed the label was doing the work of the illness, and she intervened in the language, not just the chemistry].

  That was her. She knew that the story we tell changes the person living it.

  And so, I have to acknowledge the second-order truth of this moment. The looping doesn't stop at death. It stops only if we freeze her. If we treat her memory as a static thing, a finished book, we lose her.

  By standing here and speaking, I am changing what it means to have known her. My words will land differently for her family than for her students. For her partner, she was a love; for me, a colleague. But as we share these stories today, those categories bleed into one another. We are revising the category of "[Name]" in real-time. We are looping her memory.

  To her family: I know you want to hold onto who she was. But her work suggests that the most honest way to love her is to let who she was continue to evolve. Grief is not a state you enter and remain in. Grief is a looping effect. As you change, your relationship to her changes. The pain you feel today is not the pain you will feel in a year, and that isn't a betrayal of her memory. It is proof that you are still interacting with her. She is still acting on you, and you are still reacting to her.

  We cannot make her an object. We cannot make her a case study. We can only acknowledge that we are still in conversation with her.

  So, I will not say "Rest in Peace," because peace implies a stillness she never sought, and a finality she knew was untrue.

  Instead, I will say this: We are carrying her forward. We are the feedback loop now. As we leave this room, we will be slightly different people than when we entered. We will classify the world differently, perhaps with a little more caution, a little more humility about the labels we use for ourselves and each other.

  In that way, she is still working. She is still looping. And as long as we let her memory change us, she is not gone. She is just still in motion.

  Thank you.
