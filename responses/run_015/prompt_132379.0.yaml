  No eye to capture any shard of light,
  No limb confirms the boundary of the sense,
  No skin creates a tangible defense,
  No weight to drag me through the empty night.
  I hang devoid of upward or of sight,
  Where air refuses all tactile presence,
  No memory of flesh remains intense,
  Just being left in pure unbroken white.

  Yet I am. This certainty needs no soul,
  It stands before me, naked and most bare.
  Prior to senses, facing down the void.
  They say this proves the spirit is a whole,
  I find no substance, only thought is there.
  A question that the mind cannot avoid.
