answer: |-
  There is a precise term for this, though it lives at the intersection of behavioral economics and psychology rather than in ordinary language. The phenomenon you are describing is best understood as **Sophisticated Procrastination** driven by **The Readiness Fallacy**.

  However, since you need a word for the specific *move* in the argument—the act of keeping the intention stable while sliding the date—I propose we coin the term **"Prudential Deferral."**

  Here is the carving you asked for. It distinguishes your behavior from laziness, akrasia, and hyperbolic discounting, and it explains why your prediction of the behavior doesn't stop it.

  ### 1. The Diagnosis: Why your friend's terms miss the mark

  Your friend suggested *akrasia* and *hyperbolic discounting*. You are right to reject them, but not for the reason you think.

  *   **Akrasia (Weakness of Will):** Classically, this is knowing the better course and choosing the worse one *against* your judgment. You feel you aren't doing this because you aren't choosing "sofa" over "run"; you are choosing "run Tuesday" over "run Monday." You view this as a scheduling adjustment, not a moral failure. Akrasia implies a conflict of *values*; you experience a consistency of *values* but a friction of *logistics*.
  *   **Hyperbolic Discounting:** This model suggests your *preferences* change as the task gets closer (the pain of running outweighs the benefit *now*, but not *on Sunday*). You reject this because your *stated* preference for running feels stable.

  The missing piece is that **behavior reveals preference, not speech.** If you truly preferred running Monday over running Tuesday, you would run Monday. The fact that you slide reveals that, *in the moment*, you prefer "Running + Perfect Conditions" over "Running + Imperfect Conditions." You are not discounting the *goal*; you are discounting the *context*.

  ### 2. The Framework: Naive vs. Sophisticated

  The economic model that fits your case exactly comes from Ted O'Donoghue and Matthew Rabin (1999). They distinguish between two types of procrastinators:

  *   **Naive Procrastinators:** Believe they will do the task tomorrow. They are surprised every time they don't.
  *   **Sophisticated Procrastinators:** Know they will procrastinate tomorrow. They anticipate their own failure.

  You are a **Sophisticated Procrastinator**. You know on Sunday that Monday-You will slide. This is why you buy the year pass (a "commitment device"). The fact that you predict the slide but don't stop it *without the pass* is not a contradiction; it is the definition of sophistication. You know you have a self-control problem, so you outsource the control.

  ### 3. The Coined Term: Prudential Deferral

  While "Sophisticated Procrastination" describes your *type*, it doesn't describe the specific *argument* you are having with your girlfriend. She says, "You don't really want to do it." You say, "I do want to do it, the timing is just wrong."

  The specific mechanism you are using is **Prudential Deferral**.

  **Definition:**
  > **Prudential Deferral** is the act of postponing an intended action not due to a change in the value of the goal, but due to a perceived sub-optimality of current conditions, coupled with a systematic bias that believes future conditions will be more conducive to action without active intervention.

  **The Carving (How to tell if it applies):**
  To determine if a case is Prudential Deferral or something else (like genuine prioritization or laziness), apply these three tests:

  1.  **The Stability Test:** Does the agent continue to affirm the value of the task and the intention to complete it at every point of delay? (If they say "actually, running isn't important," it's *Preference Revision*, not Prudential Deferral).
  2.  **The Conditionality Test:** Is the reason for delay always external or contextual (time, energy, schedule) rather than internal (fear, dislike)? (If they say "I'm scared to fail," it's *Avoidance*, not Prudential Deferral).
  3.  **The Recurrence Test:** Does the "optimal condition" cited for tomorrow fail to materialize tomorrow, leading to the same deferral to the next day? (If the condition actually improves and they act, it was *Genuine Prudence*, not Prudential Deferral).

  **Borderline Cases:**
  *   **Genuine Prudence:** You delay the run because you have a broken ankle. Tomorrow the ankle is healed, you run. (Fails the Recurrence Test).
  *   **Avoidance Procrastination:** You delay the run because you are anxious about your fitness. You make up an excuse about time. (Fails the Conditionality Test; the root is internal emotion).
  *   **Prudential Deferral:** You delay the run because "this week is busy." Next week is also busy, but you believe *next* week will be different. (Passes all three).

  ### 4. Why this ends the argument

  The argument with your girlfriend likely stalls because you are arguing about **Motivation** (Do I want to run?) while she is arguing about **Priority** (Do I value running more than comfort?).

  **Prudential Deferral** allows you to concede her point without admitting you are a liar or lazy.

  *   **You can say:** "I am not experiencing *akrasia* (choosing what I think is bad). I am experiencing *Prudential Deferral*. I sincerely value the run, but I am systematically over-valuing the 'readiness' of future conditions."
  *   **The Solution:** The literature on Sophisticated Procrastination shows that willpower does not fix Prudential Deferral. Only **Commitment Devices** do. You already discovered this (the year pass works).
  *   **The Work Example:** In your team, the decision slides because everyone is engaging in Prudential Deferral. They value the decision, but they want to make it when "things are calmer." Since things never get calmer, the decision never happens. The fix is not to argue about urgency (which you agree on); the fix is to remove the conditionality. (e.g., "We decide this in the first 15 minutes of the sprint, regardless of other blockers.")

  ### Summary for the Argument

  If you want one phrase to use:

  > "This isn't laziness and it isn't changing my mind. It's **Prudential Deferral**. I'm not choosing *not* to run; I'm choosing to wait for conditions that I falsely believe will improve. I know I do this (that's why I buy the pass), but in the moment, the logic feels sound."

  This validates your sincerity (you aren't lying about wanting to run) while accepting her observation (you aren't running). It moves the conversation from "Do you care?" to "How do we remove the conditionality?" which is the only question that actually solves the problem.
