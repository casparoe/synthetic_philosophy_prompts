  This thought experiment helps **your friend**. It successfully isolates the variable: replication *per se* does not require Gödelian structure (crystals prove this), only *code-based, evolvable* replication does. By conceding that the claim is restricted to code-based systems, you inadvertently validated her boundary condition; your objection that this makes the claim "less deep" is a value judgment, not a logical counter.

  **The Gap (0.6 vs 0.2)**
  The gap lives in **Q1 (Equivalence)** and **Q3 (Identity)**.
