  | **2. Necessity:** Is the "read-twice" (data/instruction) distinction necessary for open-ended evolution? | 0.90 | Without passive data, mutations alter the constructor itself, capping complexity (the crystal/prion limit). |
  | **3. Identity:** Is this "literally the same phenomenon" as Gödel's arithmetic sentence, rather than a structural isomorphism? | 0.30 | Gödel relies on arithmetization of syntax; DNA relies on chemical affinity; the mapping is isomorphic, not ontologically identical. |
  | **4. Depth:** Is the Gödelian explanation foundational rather than mere "decoration" on the engineering? | 0.75 | It explains *why* the engineering is universally necessary, not just *how* it works, making it explanatory rather than ornamental. |

  **Combination Logic**
  I treat the Strong Reading as a conjunction of Mechanism (Q1, Q2) and Ontology (Q3). The Mechanism score is high (~0.92), but the Ontology score (Q3) acts as a bottleneck because "literal identity" is too strong a claim for cross-domain analogy. I average the four numbers (2.9 / 4 = 0.725) but apply a 0.25 penalty for the ontological overreach in Q3, landing at **0.55**.

