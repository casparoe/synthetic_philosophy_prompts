          *   M6: Leo (Mostly Correct). Good concession on retribution, but needs to clarify conventional validity.
      *   *Overall:* Leo wins on orthodoxy, Maya wins on highlighting the tension for retributive justice. Both miss the Madhyamaka emptiness of causation itself.
      *   *Confidence:* High on doctrinal mapping, moderate on ethical implications.
