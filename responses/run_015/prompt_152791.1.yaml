      *   **Name:** The Principle of **Preserved Attainable Utility and Conventional Stability**.
      *   **Core Concept:** The robot must not reduce the human's capacity to pursue their own goals (Agency) nor alter states that serve as signals of specific human preference (Stability), unless tasked or reversed.
