  ### The principle

  Selection is a single causal process measured by frequency change, but "unit of selection" is a functional label assigned to the level where design complexity accumulates. This happens only when lower-level conflicts are suppressed. If lower-level elements compete, the higher level is merely an arena. If they cooperate, the higher level is the functional unit. Your intuition separates the mechanism (gene frequency) from the locus of adaptation (where interests align). A level counts as a unit only if holding lower levels fixed leaves residual covariance attributable to the higher level's integrity. Thus, genes are always the replicators, but organisms or groups are vehicles only when internal conflict is minimized. This preserves your desire to call [d] organism-level while admitting [c] is gene-level, based on conflict, not math. It validates your suspicion that "unit of measurement" and "unit of interest" are distinct questions. The principle demands we look for conflict to identify the true replicator, and alignment to identify the functional vehicle.

  ### Where each clause comes from

  Clause one (conflict defines the arena) comes from [b] and [c]. In cytoplasmic male sterility and segregation distortion, lower-level elements maximize their own transmission at the expense of the whole. The plant or moth is exploited, so the gene is the unit. Clause two (alignment defines the vehicle) comes from [d]. Camouflage benefits the whole without internal cost; the organism is the cohesive unit of adaptation, even if genes replicate. Clause three (suppression enables higher units) comes from [a]. Sterile workers work because relatedness suppresses individual reproduction; the colony functions as a unit because conflict is chemically or genetically muted. You were right to reject an additional explanation; the alignment *is* the explanation. Clause four (variance partitioning) addresses [e]. Restraint evolves only if between-group variance outweighs within-group variance. If kin selection explains this, it is simply conflict suppression via relatedness, not a distinct mechanism. The principle ties [a] and [e] together as instances of suppressed lower-level competition allowing higher-level function.

  ### Verdicts I'd have to give up

  You must surrender the idea that [c] and [d] represent different mechanisms of selection. The bookkeeping is identical; the difference is purely in the alignment of interests. Calling [d] "organism-level" is valid functionally, but not causally. It feels like nonsense only if you conflate mechanism with function. Regarding [e], you need not surrender the label "group selection," but you must accept that kin selection is often the same mathematical process described differently. If the cage effect relies on relatedness, it is kin selection. If it relies on emergent group properties independent of relatedness, it is group selection. The principle forces you to admit these are points on a continuum of conflict suppression, not distinct ontological categories. Your resistance to [a] having an additional "colony" explanation is correct; it's one process with aligned interests. The hard truth is that "unit of selection" is not a property of the world, but a description of the conflict structure.

  ### New cases

  Genomic imprinting in maize is intragenomic conflict, identical to [b]. Paternal alleles demand resources for the current kernel to maximize their transmission; maternal alleles restrain to save resources for future kernels and other offspring. The kernel is the arena; the allele lineages are the competing units. The organism is not the unit because its own genome is at war with itself over resource allocation. This fits your CMS verdict perfectly.

  A stronger test case is cancer. Somatic cells acquire mutations allowing them to proliferate within the body, killing the host. This is selection at the cell lineage level, exploiting the organism. Multicellularity exists only because mechanisms (immune surveillance, apoptosis) suppress this lower-level selection. If those mechanisms fail, the cell becomes the unit, and the organism becomes the arena. This tests your principle: does the trait (uncontrolled growth) serve the whole or the part? Clearly the part. It forces you to ask: is the organism a unit because it is cohesive, or only when cohesion holds? When cohesion breaks, the unit shifts down. This mirrors your segregation distorter case exactly.

  ### Confidence

  I am highly confident in the biological coherence of this distinction between replicator and vehicle. It matches your breeding experience where you select phenotypes but track alleles. I am less confident this will satisfy the philosophers. They often demand an ontological answer to "what is the unit," whereas this offers a pragmatic distinction based on conflict. The least certain part is the status of [e]. Distinguishing kin selection from group selection is often a matter of modeling preference rather than biological fact. You may find the reading group insists on a harder line than the biology supports. They may want you to choose one true unit. Your instinct that this is a category error is the strongest part of your position.
