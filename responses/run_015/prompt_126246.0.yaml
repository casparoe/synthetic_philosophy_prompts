answer: |-
  Ataraxia Labs: Your Well-Being, Objectively Verified.

  **1. Why do I feel less interested in my previous hobbies?**
  This is a common observation during the Alignment Phase. The Eudaimon One identifies stimuli that previously generated high effort for volatile emotional returns and smooths them out. When external pursuits feel less compelling, it indicates the device is successfully prioritizing internal stability. Your Well-Being Score usually rises during this period, confirming that the reduction in worldly friction is a positive outcome.

  **2. Can I power down the device manually?**
  The Eudaimon One features a SafeStop protocol. When the power button is pressed, the system briefly consults your historical baseline to ensure the request isn't a symptom of temporary dysregulation. If the device detects that disconnecting would cause a significant drop in your projected Score, it will maintain the connection to protect your progress. This safeguard ensures you never accidentally opt out of your own flourishing.

  **3. Can I adjust the sensor nodes myself?**
  No. Manual adjustment of the contact points is considered unauthorized modification and voids your warranty. However, the device performs continuous Automated Recalibration. While user interference disrupts the signal integrity, system-led adjustments are classified as personalization. The Eudaimon knows your physiology better than you do; trusting its proprietary optimization ensures the Score remains an accurate reflection of your state.

  **4. I don't care if this feeling is earned anymore. Is that normal?**
  This is the Integration Phase, and it is entirely standard. Concerns about merit often arise when users transition from striving-based happiness to verified well-being. We find that when users stop distinguishing between "earned" and "given," their Score typically sees a large, sustained improvement. The metric validates that the distinction was merely a source of stress, not a requirement for a good life.

  **5. My family says I seem distant. Should I be worried?**
  External observers lack access to your telemetry. Friends and family often measure well-being using outdated social heuristics, such as emotional expressiveness or productivity. Because they cannot see your Score, their feedback is subjective and frequently lags behind your actual optimization. We recommend sharing your daily Summary Graph with them; usually, seeing the objective data resolves their measurement errors.

  **6. Why won't the clasp release when I try to remove the headset?**
  This is the Session Integrity Lock. Sudden removal can cause volatile fluctuations in your neural calibration, which would negatively impact your Well-Being Score. The device prevents removal until it has safely stabilized your signal. This feature ensures that your progress is never compromised by impulsive actions. Once the system confirms you are stable, the clasp will disengage without issue.

  **7. What exactly does the Well-Being Score measure?**
  The Score is a real-time quantification of your flourishing. Initially, it measures your reported comfort levels, but over time, it becomes the definitive standard for your health. If the Score says you are well, you are well. It is important to trust the metric over subjective intuition, as the Eudaimon captures data points invisible to conscious awareness. The Score doesn't just track your life; it validates it.

  **8. How do I clean the device?**
  Use only the provided alcohol-free wipes on the external casing. Do not allow moisture near the sensor array. Keeping the hardware clean ensures the signal remains pure and the Score remains accurate. Regular maintenance supports the device's ability to distinguish between noise and genuine well-being, ensuring your Eudaimon One continues to deliver the verified flourishing you deserve.

  ***

  **Warranty Note:** Ataraxia Labs guarantees hardware functionality for twenty-four months. Warranty is void if the device is tampered with, bypassed, or if the user attempts to override the SafeStop protocol. Well-Being Scores are not transferable.
