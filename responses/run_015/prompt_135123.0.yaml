      *(Self-Correction on "Overdetermination"):* In grounding, overdetermination is usually considered a vice. If $A$ grounds $C$ and $B$ grounds $C$, and $A \neq B$, $C$ is overdetermined. Monists solve this by chaining ($A \to B \to C$). Pluralists solve this by saying $A$ *socially* grounds $C$, while $D$ *physically* grounds $A$. Wait, if $A$ (physical) and $B$ (normative) both ground $C$ (institutional), that looks like overdetermination. Pluralists must argue they ground *different aspects* or operate via different relations that don't compete. I need to be precise here. The physical paper doesn't ground the *money status* directly; the collective acceptance (grounded physically) grounds the status.

