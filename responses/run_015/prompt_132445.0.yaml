answer: |-
  Valerius stood on the dais, the silence of the atrium pressing against his ribs as he recited the Third Form, detailing the cowardice of Kael's grandfather with booming precision.
  "My grandfather died in bed," Kael said, checking the time on his wrist-comp. "At ninety-four. With his family."
  "You do not answer?" Valerius demanded, hand hovering over the ritual dagger used to prick the thumb for blood-oaths.
  "Why would I?" Kael stepped down from the dais, leaving the old man holding the air. "Winning this gets me nothing. Losing gets me a scar. The only thing people respect now is liquidity, Valerius. Honor is just the story poor men tell themselves to explain why they're still poor."
  Valerius lowered the dagger, the tip dull against his thumb, as the crowd dispersed not in awe, but in boredom.

  ***

  The loan officer didn't look up from the screen as the merchant smoothed his lapel.
  "You want to settle the default via Reckoning?" the officer asked.
  "It is my right," the merchant said. "If I best him in the Exchange, the debt is voided by custom."
  "Custom isn't in the algorithm," the officer said, finally looking up. "Participating in a Reckoning flags your account as high-risk for volatility. Your insurance premiums double. Your trade partners see the flag and assume instability."
  "So you prioritize money over justice?"
  "I prioritize solvency over stories," the officer said, stamping the denial. "You can be righteous and bankrupt, or silent and solvent. Choose."

  ***

  "The psychological damage is measurable," the Reformer said, projecting charts onto the council wall. "Suicide rates among the losers of the Reckoning have spiked. It is violence, plain and simple."
  Councilor Hames leaned back, picking his teeth. "You speak of harm, but I see a consolidation of power."
  "People are hurting," the Reformer insisted.
  "People are always hurting," Hames replied. "You use their pain as a lever to ban a practice that allows the weak to embarrass the strong. You dress your political victory in the clothes of compassion, but we know the fabric is thin."
  The vote passed anyway, but Hames' smirk remained, suggesting the harm was merely the excuse, not the cause.

  ***

  Darius stood outside the hall where the ban was being ratified, holding the scroll of challenge meant for his rival.
  His assistant hovered nearby. "Sir, if you submit that now, you'll be fined. And the press will call you unstable."
  Darius looked at the scroll, thinking of the honor he would gain and the justice he would feel. Then he thought of the fine, and the headlines.
  "It's not that it's wrong," Darius said, tearing the scroll in half. "It's just too expensive to be right."
  He dropped the pieces into a recycler, the moral weight of the act vanishing, replaced by the lightness of a saved credit score.

  ***

  The contract lay open on the desk, the ink still drying under the office lights.
  "Clause 44-B," the lawyer read aloud, adjusting his glasses. "In the event of dispute, parties agree to binding arbitration, foregoing all archaic modes of satisfaction, including but not limited to the Tongue, the Thumb, or the Public Shaming."
  "Standard wording?" the client asked, signing without reading.
  "Standard since the Restoration," the lawyer said.
  The client stood and extended a hand; the lawyer hesitated, then grasped it, his grip tightening briefly enough to whiten the knuckles, a silent, ghostly echo of the pain once inflicted to seal a bond, before releasing into the polite warmth of commerce.

  This narrative leans on a materialist interpretation of moral change where economic and status interests drive ethical shifts, but the historical example of the Quaker abolition of slavery despite significant economic loss would challenge this reading by demonstrating genuine moral conversion.
