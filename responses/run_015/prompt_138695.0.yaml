      *   **Goal:** Make them *feel* the Frege-Geach problem (embedding problem for expressivism/non-cognitivism), not just be told about it.
      *   **Constraints:** 45 minutes total. Do *not* explain the problem to me (the AI), but plan *how* the user should explain it.
      *   **Specific Requirements:**
          *   First 10 minutes setup (avoiding relativism confusion).
          *   Order of pieces/dependencies.
          *   One carrying scenario (needs unendorsed moral sentence, harmless topic to avoid first-order derailment).
          *   Misconception map (Modus Ponens, Truth Conditions, Cultural Disagreement) - when to head off vs. let happen.
          *   The "Probability/Uncertainty" wrinkle ('It's probably wrong to X') - where to fit?
          *   Closing question (tests understanding, not slogan memorization).
          *   Topics to refuse/avoid.

  2.  **Deconstruct the Audience & Challenge:**
      *   *EA/Econ/CS Mindset:* They like formal logic, clear definitions, and utility maximization. They treat ethics like optimization. They will resist anything that smells like "morals are just feelings" (relativism/subjectivism) because that undermines the "Effective" part of EA.
      *   *The Trap:* If I start with "Expressivism says 'murder is wrong' is just like 'Boo murder!'", they will immediately reject it as incompatible with logical reasoning. I need to make Expressivism look *plausible* first, then show where it breaks logic.
      *   *The Frege-Geach Problem:* Essentially, moral sentences work in unasserted contexts (conditionals, questions, negations) just like factual sentences. If "Murder is wrong" is just an expression of attitude, what is "If murder is wrong, then..." expressing? An attitude towards an attitude? That breaks Modus Ponens.

  3.  **Develop the Carrying Scenario:**
      *   *Requirement:* Harmless, unendorsed moral sentence.
      *   *Idea 1:* Stealing/Brother (Rejected by prompt).
      *   *Idea 2:* Lying. (Too common).
      *   *Idea 3:* Eating Meat. (Too controversial for EA).
      *   *Idea 4:* *Tipping.* Or *Queue Jumping.*
      *   *Selection:* **Queue Jumping.** It's low stakes, universally understood as "rudeness" but not "evil," and allows for conditionals easily.
      *   *Scenario:* A specific rule about a specific context. Let's make it slightly more abstract to fit CS/Econ. **Protocol Violation.** No, too dry. Let's stick to **Queue Jumping** but frame it logically.
      *   *Refinement:* Let's use **"Cheating on a trivial game."** Say, *Solitaire*. "It is wrong to cheat at Solitaire."
      *   *Why:* Nobody cares enough to argue if it's *actually* wrong (avoids first-order ethics). It's clearly a norm. It allows for conditionals.

  4.  **Drafting the Session Flow (45 mins):**

      *   **0-10 mins: Setup & The Expressivist Pitch.**
          *   Need to establish Moral Realism (their view) vs. Expressivism (the target).
          *   Crucial: Distinguish Expressivism from Relativism. Relativism = "Wrong for me, right for you." Expressivism = "Wrong" = "Boo!" (Universal attitude, just not a fact).
          *   Activity: Get them to define what "Wrong" *does*.
      *   **10-25 mins: The Embedding Trap (Frege-Geach).**
          *   Introduce the Scenario (Solitaire).
          *   Step 1: Asserted context ("Cheating is wrong"). Expressivism works here.
          *   Step 2: Unasserted context ("If cheating is wrong...").
          *   Step 3: The Logic Test (Modus Ponens).
          *   Show the equivocation.
      *   **25-35 mins: The Probability Wrinkle.**
          *   This is the user's specific request. It fits well after the conditional problem because it deepens the "proposition-shaped" requirement.
          *   "I'm 80% sure cheating is wrong."
      *   **35-40 mins: Misconception Management.**
          *   Address the expected pushbacks here.
      *   **40-45 mins: Closing Question & Boundaries.**

  5.  **Refining the "First 10 Minutes" (The Setup):**
      *   *Risk:* They hear "non-cognitivism" and think "morals are arbitrary."
      *   *Fix:* Frame Expressivism as a theory about *psychological state*, not truth.
      *   *Analogy:* Humor. "That joke is funny." Is that a fact? Or an attitude?
      *   *Dependency:* Must establish that logic requires *consistency of meaning* across asserted and unasserted contexts.

  6.  **Addressing the Misconceptions:**
      *   *Modus Ponens:* Don't deny it. Show how Expressivism *accidentally* denies it by equivocation.
      *   *Truth Conditions:* This is the "Quasi-Realist" solution. Don't solve it yet. Let it hang.
      *   *Cultural Disagreement:* Head this off early. This is about *logic*, not anthropology.

  7.  **The Probability Wrinkle:**
      *   User asks: Mid-session, closing, or trap?
      *   *Analysis:* It's a strong argument (Schroeder's argument). It reinforces the need for proposition-shaped objects for credences.
      *   *Placement:* After the conditional problem. It shows the problem isn't just conditionals; it's *any* embedding (negation, probability, belief).
      *   *Decision:* Make it the "Level 2" boss fight after the Conditional "Level 1" boss fight.

  8.  **The Closing Question:**
      *   Needs to test if they see the *structural* issue.
      *   *Idea:* Ask them to fix it without giving up Expressivism.
      *   *Better:* Ask them to translate a probabilistic moral claim into an attitude.

  9.  **Topics to Refuse:**
      *   Meta-ethics history (Ayer, Stevenson).
      *   Quasi-Realism details (Blackburn, Gibbard) - too technical.
      *   Error Theory (Mackie) - distinct view.
      *   First-order normative ethics (Utilitarianism vs. Deontology).

  10. **Review against Constraints:**
      *   *Don't explain the problem to me:* Check.
      *   *First 10 mins setup:* Check.
      *   *One scenario:* Solitaire Cheating.
      *   *Misconception map:* Check.
      *   *Probability wrinkle:* Check.
      *   *Closing question:* Check.

  11. **Final Polish:**
      *   Tone: Respectful of their rationality, challenging their assumptions.
      *   Structure: Clear time blocks.
      *   Emphasis: *Feel* the problem. Use board work.

