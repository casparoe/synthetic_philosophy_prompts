answer: |-
  Here is a 45-minute session plan designed to make the Frege-Geach problem visceral for a rationalist-leaning audience.

  ### The Carrying Scenario: "The Shopping Cart"
  **Why this scenario:** It is the perfect Goldilocks zone for EAs. It is normative (it's about what you *ought* to do), but low-stakes enough that no one will derail into debating the actual morality of carts. Crucially, it allows for a clear distinction between *doing* the thing and *believing* the thing is wrong.

  **The Sentence:** *"It is wrong to leave your shopping cart in the parking spot."*

  ---

  ### Part 1: The Setup (Minutes 0–10)
  **Goal:** Secure the Expressivist position without triggering the "Relativism" alarm.
  **Dependency:** You cannot introduce the embedding problem until they accept that Expressivism is a coherent theory of *meaning*, not just a theory of *error*.

  1.  **The Hook (2 mins):** Ask for a show of hands: "Who thinks 'The shopping cart has wheels' is a different *kind* of sentence than 'You ought to return the shopping cart'?"
      *   Most will say yes. The first describes the world; the second guides action.
  2.  **The Expressivist Pitch (5 mins):** Define Expressivism *charitably*.
      *   *Say this:* "Expressivism isn't saying morality is fake. It's saying the *function* of moral language is to coordinate attitudes, not map territory. When I say 'Cart-returning is wrong,' I am not describing a moral particle in the universe. I am expressing a stance: 'Don't leave carts!'"
      *   *Crucial Distinction:* Explicitly block the Relativism slide. "Expressivism does not mean 'Wrong for me, right for you.' It means 'Boo carts!' is a universalizable attitude. I can think you are mistaken in your attitude, just as I can think you are mistaken in your facts. But the *mistake* isn't factual mismatch; it's attitude inconsistency."
  3.  **The Commitment (3 mins):** Get them to agree to a constraint.
      *   *Write on board:* **Constraint:** For the next 30 minutes, we are testing if we can build a logic system where moral sentences *only* express attitudes (no truth-apt facts).
      *   *Why:* If they sneak in "Well, but it *is* true that..." you lose the problem. They must inhabit the Expressivist headspace to feel the pain.

  ### Part 2: The Embedding Trap (Minutes 10–25)
  **Goal:** Demonstrate the equivocation in Modus Ponens.
  **Dependency:** Requires the "Attitude-Only" constraint from Part 1.

  1.  **Assertion Context (5 mins):**
      *   Write on board: **(1) It is wrong to leave the cart.**
      *   Ask: "Under our constraint, what is happening here?"
      *   *Target Answer:* You are expressing a negative attitude toward cart-leaving. (Let's call this **Attitude A**).
  2.  **Conditional Context (10 mins):**
      *   Write on board: **(2) If it is wrong to leave the cart, then you ought to return it.**
      *   Ask: "In this sentence, am I expressing **Attitude A**?"
      *   *The Trap:* No. I am not saying I disapprove of carts. I am hypothetically considering the stance. I might be a cart-leaver myself!
      *   *The Squeeze:* "So, in (1), 'wrong' expresses an attitude. In (2), 'wrong' does *not* express an attitude. They have different meanings."
  3.  **The Logic Test (5 mins):**
      *   Write on board:
          1.  It is wrong to leave the cart.
          2.  If it is wrong to leave the cart, then you ought to return it.
          3.  Therefore, you ought to return it.
      *   *Ask:* "Is this Modus Ponens valid?"
      *   *The Feeling:* For Modus Ponens to work, the term 'wrong' must mean the *exact same thing* in premise 1 and premise 2. But we just agreed it doesn't. In P1 it's an attitude; in P2 it's a hypothesis about an attitude.
      *   *Result:* The Expressivist seems forced to say this valid argument is actually an equivocation fallacy (like "If banks are steep, I will swim; Banks are steep; Therefore I will swim").
      *   *Let them feel the absurdity:* "Are you really telling me moral logic is a linguistic fallacy?"

  ### Part 3: The Probability Wrinkle (Minutes 25–35)
  **Goal:** Deepen the problem using credences (appeals to Econ/CS mindset).
  **Placement:** This is the **Mid-Session Pivot**. It shows the problem isn't just conditionals; it's *any* embedding.

  1.  **The Setup:** "You mentioned uncertainty. In EA, we deal in probabilities. I am not 100% sure about carts. I am 80% confident."
  2.  **The Sentence:** Write: **"It is probably wrong to leave the cart."**
  3.  **The Challenge:** "If 'It is wrong' = 'Boo Cart', what is 'It is *probably* wrong'?"
      *   Is it "Probably Boo Cart"? (Makes no sense; you either have the attitude or you don't).
      *   Is it "Boo Probably Cart"? (No, that's not the meaning).
      *   Is it "I believe there is an 80% chance that Boo Cart"? (This treats the attitude as a fact that can be probable).
  4.  **The Point:** To have a credence (probability), you need a **proposition** (something that can be true/false). If moral sentences aren't propositions, you cannot have moral uncertainty. You can only have uncertainty about *whether you have an attitude*, which is not what moral uncertainty feels like.
      *   *Why here?* It hits the CS/Econ brain harder than the conditional. They understand that `P(A)` requires `A` to be an event/proposition, not a command.

  ### Part 4: Misconception Map (Minutes 35–40)
  **Goal:** Manage the pushback without solving the problem for them.

  | Misconception | When it arises | How to handle |
  | :--- | :--- | :--- |
  | **"So expressivists deny Modus Ponens?"** | During Part 2. | **Let someone say this.** It's the honest answer. Then ask: "Are you willing to pay that price? If you deny MP in ethics, can you still do effective altruism?" Let the cost sink in. |
  | **"The fix is just to give moral sentences truth conditions."** | During Part 3. | **Head this off.** "That is the Realist solution. It works. But then you aren't an Expressivist anymore. The challenge is: Can you keep the Expressivist psychology *and* fix the logic?" |
  | **"Isn't this just cultural disagreement?"** | Anytime. | **Shut this down immediately.** "No. This isn't about whether cultures disagree. This is about whether a single person can reason logically *within* their own head using moral terms. It's a syntax problem, not an anthropology problem." |

  ### Part 5: Closing & Boundaries (Minutes 40–45)

  **The Closing Question:**
  Do not ask "What is the Frege-Geach problem?" (They will recite a slogan).
  **Ask this:**
  > "Translate the sentence *'I am not sure if leaving the cart is wrong'* into pure Expressivist language. You cannot use the word 'wrong,' 'true,' or 'fact,' and you cannot describe your own psychology (e.g., 'I feel conflicted'). You must describe the *content* of your uncertainty."

  *   *Why this works:* If they understand the problem, they will stall. They will realize there is no "content" to be uncertain about if the sentence is just an attitude. If they give an answer, it will likely sneak in a truth-apt proposition, proving the point.

  **Topics to Flat-Out Refuse:**
  1.  **Quasi-Realism Details:** (Blackburn/Gibbard). "That is the solution to the problem, not the problem itself. We don't have time for the fix."
  2.  **Error Theory:** (Mackie). "Error theory says moral sentences are all false. Expressivism says they aren't even the *kind* of thing that can be false. Don't mix them."
  3.  **First-Order Normative Ethics:** If they start arguing about whether carts *should* be returned, stop them. "We are arguing about the *grammar* of 'should', not the *outcome*."

  ### Summary of Dependencies
  1.  **Setup** must distinguish Expressivism from Relativism (or they won't take the theory seriously).
  2.  **Constraint** must be accepted (or they will solve it by smuggling in Realism).
  3.  **Conditional Problem** must be felt before **Probability Problem** (Conditionals show the equivocation; Probability shows the impossibility of credence).
  4.  **Misconceptions** must be managed *after* the feeling is established (otherwise they intellectualize the pain away).
