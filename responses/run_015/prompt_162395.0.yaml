      *Wait, P4 says "equal power over the whole set of decisions that shape your life".* If upstream residents have their own municipality, do they have equal power there? Maybe. But the city's decision shapes their life too. P4 is tricky. I'll note that P4 is compatible if we assume a higher-level authority handles externalities, but as stated, it clashes with P7.

