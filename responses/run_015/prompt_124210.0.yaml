  **Note on Philosophical Accuracy**

  This parody leans on the strict distinction between prioritarianism and egalitarianism. Standard prioritarianism (à la Parfit) is non-relational; it values benefits solely based on absolute welfare levels. Consequently, it explicitly avoids the "Levelling Down Objection"—it cannot justify making the rich poorer if the poor gain nothing, because total priority-weighted value would fall.

  I am highly confident that a standard prioritarian would reject the document's core premise: that levelling down can be justified within their framework. The document's workarounds (specifically the "Comparative Weighting Module") effectively smuggle relational egalitarianism back into the utility function by treating relative rank as a source of utility.

  The single claim I am least sure about is the viability of the "Counterfactual Baseline Adjustment" (Clause 3.3). A sophisticated prioritarian might argue that preventing future inequality *is* a priority gain if inequality causally leads to future absolute losses for the poor. However, the document assumes these losses are purely hypothetical to justify present-day levelling, which is a weaker claim.
