      *   *Weaknesses:* What if the monitoring system is wrong? (Cancer). What if there is no monitoring system? (Junk DNA that actually does something useful but isn't policed). Circularity risk (who polices the police?).
      *   *Audience Reaction:*
          *   *Clinicians:* "Does this help me classify variants?" "Does this explain why the patient is sick?"
