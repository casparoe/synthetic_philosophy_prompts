      *   **Topic:** A specific theory of biological function called the "bookkeeping account."
      *   **Core Thesis:** Function is defined by the organism's *own* detection-and-response machinery (homeostasis, repair, surveillance), not by evolutionary history (selected effects) or systemic capacity (causal role).
      *   **Key Claims:**
          1.  De novo sequences can have function immediately if policed.
          2.  Broken parts retain function if monitoring targets them.
          3.  No evolutionary story needed for "what it's meant to be doing."
      *   **Constraints:** No literature survey, no reading lists. Needs a Q&A prep sheet. 7-8 objections (phrased clinically/experimentally). 1-2 minute answers. Identify soft spots. Identify concessions for the first 5 minutes. Identify the "single reply" that must land. Address the user's specific worry about broken monitoring (cancer/autoimmunity).
      *   **Tone:** Professional, pragmatic, empathetic to the clinical context, intellectually rigorous but accessible. Avoid jargon like "teleology" unless necessary.

  2.  **Deconstruct the "Bookkeeping Account":**
