  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Clinician/Classifier):* "If a variant is de novo and policed, you call it functional. But if it causes disease, isn't the function *lost*? How does this help VUS classification?"
      *   *Objection 2 (Molecular Biologist):* "Not everything has a feedback loop. Structural proteins? Enzymes in a linear pathway? Do they have no function until something breaks them?"
      *   *Objection 3 (Philosopher - Selected Effects):* "You're describing *maintenance*, not *function*. Why is the machinery there? Because it was selected. You're hiding the evolutionary history, not removing it."
      *   *Objection 4 (Clinician/Pragmatist):* "Cancer. The cell stops policing p53. Does p53 lose its function then? That seems wrong for diagnosis."
      *   *Objection 5 (Molecular Biologist/Assay):* "We do rescue assays. We put a gene back and see if the phenotype fixes. That's causal role. Why is your 'bookkeeping' better for my data?"
      *   *Objection 6 (Philosopher - Normativity):* "Who decides what the 'bookkeeping' is tracking? Error implies a standard. Where does the standard come from if not history?"
      *   *Objection 7 (General/Edge Case):* "Viral integration. The cell polices it (immune response). Does the viral DNA have a function in the host?"
      *   *Objection 8 (The "Killer"):* "Junk DNA. If nothing polices it, is it functionless? Even if it does something useful?"

