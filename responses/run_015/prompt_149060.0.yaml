prompt: |-
  I serve on my city's charter-reform commission, where we have recently begun debating a concrete institutional proposal: replace one-third of our municipal legislature with a citizens' assembly selected by lot, serving staggered 18-month terms, undergoing mandatory pre-service deliberative training, and holding veto authority over budget allocations but not over zoning or land-use decisions. Next week I am recording a podcast interview with an advocate of modern lottocracy who defends precisely this kind of hybrid design; she typically answers competence objections by appealing to cognitive-diversity gains, and answers accountability objections by pointing to internal peer-review mechanisms within the assembly.

  You are an experienced political-philosophy interviewer preparing for a formal, polished conversation. Please begin with brief brainstorming about the three internal tensions in her position: whether voluntary opt-in to the lottery pool undermines the descriptive-representation claim she relies on; whether mandatory deliberative training reintroduces an elite-filtering mechanism that replicates the career-politician dynamics sortition is meant to eliminate; and whether granting the sortition chamber budget veto but not zoning veto creates a structurally unstable constitutional asymmetry.

  Then draft eight to ten interview questions that go well beyond asking her to restate the view. For each of the three tensions above, include at least one direct question and a follow-up keyed to the reply she is most likely to give. Make the questions precise and suitable for a public-affairs audience, avoid generic biographical openings, and do not ask for bibliographies, citations, or reading lists. Keep the focus on the conceptual structure of her position and on the concrete institutional design my commission is actually weighing.
