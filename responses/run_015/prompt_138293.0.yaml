      *   **Theoretical Framework:** Aristotelian practical philosophy (Politics Book I on wealth-getting/use vs. exchange; Nicomachean Ethics Book V on money as measure/guarantee).
      *   **Specific Tension:** The staff analyst separates "tally" (measure) vs. "holding" (store of value). The user thinks this is too clean. The memo must address the tension between money as a *measure* (Ethics) and wealth-getting as *instrumental/bounded* (Politics). Does the limit on acquisition apply to a measure?
      *   **Constraints:**
          *   Length: 1000-1300 words.
          *   Tone: Committee-readable, adoptable by Dean.
          *   Definitions: Every term of art defined in a single clause.
