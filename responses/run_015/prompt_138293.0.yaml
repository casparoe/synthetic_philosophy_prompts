answer: |-
  **MEMORANDUM**

  **TO:** Exchange Program Working Group
  **FROM:** Student Representative, Class of 2025
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Permanent Design Rules for Campus Exchange

  **Introduction**

  As the pilot program sunsets, we must decide whether the Exchange Unit functions as a mere tally of service or a store of value. An Exchange Unit is defined here as a claim on one hour of peer service redeemable within the campus community. Our staff analyst suggests these roles are separable, requiring stability for measurement and durability for storage. However, drawing on Aristotle's practical philosophy, this memo argues that because the unit is an instrument for a substantive end—mutual aid—it must remain bounded by that end. Aristotle distinguishes between the proper use of an object, which serves a specific need, and the exchange use, which seeks unlimited accumulation. When acquisition becomes an end in itself, it violates the natural limit of household management. Therefore, our rules must prevent units from becoming capital while preserving their function as a common measure. A common measure is defined here as a conventionally agreed standard that makes unlike services comparable.

  **Recommendations**

  **1. Resale**
  We recommend prohibiting the conversion of units into cash while permitting peer-to-peer transfer at par value. Resale is defined here as the exchange of units for currency outside the platform. Aristotle notes in the *Ethics* that money arises by agreement to guarantee future exchange, but in the *Politics* he warns that when the medium of exchange becomes a target of accumulation, it detaches from human need. Allowing cash resale transforms the unit from a promise of service into a commodity, encouraging students to trade for profit rather than aid.
  *Counterargument:* Prohibiting resale ignores that a flat hourly rate misprices scarce skills, pushing trade to unregulated apps where price discovery occurs naturally. Furthermore, some argue Aristotle critiques boundless appetite, not exchange itself, meaning regulated cash markets might remain virtuous if capped.
  *Rule:* The platform shall disable cash-out features; units may only be transferred to another registered student account at a one-to-one ratio.
  [Note: The group must vote on whether active monitoring of external apps violates student privacy versus protecting program integrity.]

  **2. Accumulation and Expiry**
  We recommend a hard cap on individual balances rather than decay. A hard cap is defined here as a maximum number of units a single account may hold at any time. In the *Politics*, Aristotle argues that tools of household management are bounded because the needs they serve are finite; unlimited tools imply an unlimited end, which is unnatural. If units are instruments for service, hoarding them frustrates their purpose. Decay ensures circulation but penalizes legitimate saving for large projects. A cap respects the "store" function while enforcing the "instrument" limit.
  *Counterargument:* A cap infringes on property rights and discourages high earners from participating once the limit is reached.
  *Rule:* Accounts shall be capped at 50 units; units earned beyond this limit are forfeited unless spent within the term.
  [Note: The group must vote on the specific cap number based on average term labor rates.]

  **3. Bulk Purchase**
  We recommend prohibiting external organizations from purchasing units in bulk. Bulk purchase is defined here as the acquisition of units by non-student entities or student groups using external funds. Injecting outside money risks turning the exchange into a profit center rather than a peer network. If the unit measures peer service, external funding decouples the unit from the labor it represents, effectively creating money from nothing.
  *Counterargument:* Student groups need funds to pay for event setup, and external money increases liquidity for everyone.
  *Rule:* Only individual student accounts earned through labor may hold units; organizational accounts are ineligible.

  **4. Yield**
  We recommend prohibiting interest or bonuses on holdings. Yield is defined here as additional units credited solely for maintaining a balance over time. Aristotle famously critiques the idea that money should breed money, arguing this is the most unnatural form of wealth-getting because it lacks any limit or connection to need. A bonus for holding units incentivizes hoarding, directly contradicting the goal of circulating service.
  *Counterargument:* Early adopters deserve rewards to jumpstart the network, and this targets greed only if balances become the primary goal.
  *Rule:* No interest, dividends, or loyalty bonuses shall be credited to any account.

  **Transition**
  Units held on the effective date remain valid but become subject to the new cap immediately; excess units must be spent within thirty days or forfeited.

  **Confidence and Dispute**

  This recommendation relies on specific readings of Aristotle that are not universally settled. First, the text evidently states that wealth-getting for the sake of the household is natural and bounded, while wealth-getting for its own sake is unnatural. However, specialists dispute whether this critique targets trade itself or only the boundless appetite behind it. Our recommendation assumes the latter: exchange is permissible, but unlimited accumulation is not. If the former reading is correct, even our permitted transfers might be suspect.

  Second, the *Ethics* describes money as a measure arising by convention, not nature. It is evident that Aristotle believes this measure facilitates justice in exchange. Yet, it is disputed whether this commits him to any view on what fixes value—labor or demand. We assume value is fixed by time (labor) to maintain commensurability, but the text does not strictly mandate this over market rates.

  Third, there is tension between the *Politics* view of money as an instrument (which must be bounded) and the *Ethics* view of money as a measure (which implies stability). Specialists debate whether these characterizations are consistent. Our memo assumes they are consistent only if the measure serves the instrumental end of service. If the measure function is independent, the argument for caps weakens.

  Finally, the texts do not settle the question of enforcement. Aristotle discusses habituation and law, but offers no guidance on digital regulation. We are guessing that institutional rules can shape habit without driving behavior underground. If the gray market argument holds—that students will trade externally regardless—our rules may be symbolic rather than effective. We proceed on the hope that official recognition shapes norms, but acknowledge this is a value judgment, not a textual deduction.
