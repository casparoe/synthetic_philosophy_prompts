          *   Counterarguments: Treat strongest cases against recommendations sympathetically (specifically: gray market/price discovery argument; Aristotelian critique targets boundless appetite not exchange itself).
          *   Value Judgments: Mark in bracketed notes for the group to vote on.
          *   No Citations: No footnotes, bibliography, or specific line numbers. Name passages in plain words.
          *   Closing Section: "Confidence." Distinguish evident text vs. specialist disputes (teleological vs. moral, trade itself vs. appetite, consistency of instrument/measure). State which reading the recommendation depends on and what questions the texts don't settle.

  2.  **Deconstruct the Aristotelian Arguments:**
      *   *Politics Book I:* Distinguishes proper use (using a shoe for walking) from exchange use (using a shoe for trading). Wealth-getting for the sake of the household (oikonomia) is natural and bounded by the end (sufficiency). Wealth-getting for its own sake (chrematistics) is unnatural and unlimited. Money facilitates exchange but becomes problematic when accumulation becomes the end.
      *   *Nicomachean Ethics Book V:* Money exists by convention (nomos), not nature. It serves as a common measure to make unlike things (shoes vs. houses) commensurable. It also acts as a guarantee (hypotheca) for future exchange.
      *   *The Tension:* If units are measures (Ethics), do they need limits? If they are instruments for service (Politics), they should be bounded by the need for service. The analyst says "measure" needs stability, "store" needs durability. The user suspects they can't be separated.
      *   *Application:*
          1.  *Resale:* If units are measures of service, selling for cash converts them into pure wealth (chrematistics), detaching from the service end. *Recommendation:* Prohibit cash resale, allow transfer at par.
          2.  *Accumulation/Expiry:* If unlimited, it becomes wealth accumulation (unnatural). If decaying, it forces circulation (service). *Recommendation:* Soft expiry or cap.
          3.  *Bulk Purchase:* Injecting outside money risks turning the system into a profit center rather than service exchange. *Recommendation:* Limit or prohibit.
