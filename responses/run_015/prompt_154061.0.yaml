answer: |-
  I hear you, and you are right that the standard test is broken because it treats competence as static when it is actually dynamic. If we keep taking things because municipalities cannot do them now, we ensure they cannot do them later, and the canton becomes a vacuum cleaner for every task that requires a modicum of coordination. What you need is a triage procedure that functions less like a legal test and more like a maintenance checklist, something that forces you to look at the history of the incapacity rather than just the current state of it. The first gate you need to install is a counterfactual competence check. When a file lands on your desk claiming a municipality cannot handle a task, you do not ask if they can do it today. You ask if they would be able to do it if they had been permitted and supported to do comparable work for the last ten years. You look for evidence of atrophy. If the reason they cannot manage a water treatment plant is that the canton has historically reserved all environmental engineering to itself, or that the only trained clerk left because the role was downgraded, that is not a failure of municipal capacity, it is a failure of cantonal stewardship. In that case, the file does not move up to the canton for execution, it moves back down with a mandate for capacity building, perhaps with temporary cantonal technical assistance that sunsets. You need a specific box on your one-pager for this, marked Capacity Atrophy, where you must state whether the inability is intrinsic or induced. If it is induced, the canton fixes the capability, not the task. This stops the ratchet because it prevents you from using current weakness as a justification for permanent centralization.

  The second gate handles the money and the boundaries, because you are correct that fiscal sufficiency is often an illusion created by grants. When a municipality says it can afford something, you need to verify the source of the funds. If the capacity exists only because of federal matching funds or cantonal equalization payments that are earmarked for this specific purpose, that is not real fiscal capacity, it is delegated spending. Your procedure needs a question that asks whether the municipality would still proceed if the earmarked money vanished tomorrow. If the answer is no, then the financial risk actually sits with the grantor, which is often you or Bern, and that pulls the decision authority upward regardless of who signs the checks. Simultaneously, you have to check for spillovers, but you need to distinguish between physical spillovers and fiscal ones. In the water case, the contamination crosses boundaries, which is a physical spillover. In the registry case, the cost variance is a fiscal spillover where residents in efficient municipalities subsidize the inefficiency of the system as a whole through cantonal taxes. You need a specific test for this: does the decision unit capture all the benefits and bear all the costs? If a municipality can push the cost of a failure onto its neighbors or onto the cantonal safety net, the decision right must move to the level that internalizes the cost. This is not about efficiency, it is about liability. If the municipality cannot be held liable for the full consequence of its action, it should not have the unilateral right to decide.

  The third gate is where you unbundle the functions, because the assumption that deciding, paying, delivering, and standardizing must happen at the same level is where most of your files go wrong. You should have four distinct lines on your triage sheet: Standard Setting, Financing, Delivery, and Oversight. It is perfectly acceptable for the canton to set the data standard for civil registries, for the municipalities to pay for the software, for a private vendor to deliver the hosting, and for the canton to oversee compliance. The procedure must allow you to tick these boxes independently. If you find that Standard Setting must be cantonal to ensure interoperability, but Delivery is best done locally to maintain citizen contact, you write that down. The conflict arises when you try to force all four into one bucket. This is also where you address the regress problem you mentioned, the fact that you are sitting in the canton deciding that something belongs to the municipalities. This bites when the decision to decentralize imposes administrative burdens on the municipalities without giving them the tools to manage them. It is harmless when it is purely a matter of legal jurisdiction that does not require additional staffing or expertise at the local level. Your procedure needs a burden check: if assigning the task to the municipality requires them to hire specialized staff they cannot reasonably retain, you are not decentralizing, you are offloading. In that case, the canton must provide the shared tool or the shared service, even if the political decision remains local.

  The final gate is the value gate, and this is where you stop pretending you can answer everything. There are files where the factual capacity exists at the municipal level, the spillovers are contained, and the financing is clear, but the choice remains between uniformity and diversity. Maybe you want every village to have the same rental rules, maybe you want them to differ. That is not a subsidiarity question, it is a political question. Your procedure must have a hard stop here. If the analysis shows that both levels are technically capable and the only difference is the desired level of uniformity, you do not make the call. You mark the file as Value Judgment Required and send it to the Regierungsrat with a note explaining that the technical criteria are met at both levels. You cannot answer whether uniformity is worth paying for, and neither can I. Your one-pager should explicitly state: Technical assessment complete, political trade-off remains. This protects you because it clarifies that you are not hiding a policy preference behind a technical assessment. Regarding evidence, you do not need research papers. A vendor email stating support ends next year is sufficient evidence for technical incapacity. A budget line showing ninety percent reliance on earmarked grants is sufficient evidence for fiscal illusion. A staff turnover rate that means no institutional memory remains is sufficient evidence for atrophy. If you have those three things, you have enough to triage.

  Running this on your water file, the counterfactual check likely shows that the municipalities could manage treatment if they had coordinated earlier, but the spillover test fails immediately. One municipality is causing the plume, others are suffering it. The decision unit does not bear the cost. Therefore, the Oversight and Standard Setting must move to the canton to enforce remediation on the polluter, even if the Delivery and Financing remain joint municipal efforts. The canton must compel the non-joining municipalities to participate or impose a solution, because the boundary of the problem is hydrological, not political. You would write that the canton takes enforcement authority, but the plants remain municipal assets, perhaps managed by a joint entity that the canton recognizes. This avoids taking over the whole thing while solving the free-rider problem.

  On the civil registry platform, the atrophy check is critical. If every municipality is on its own contract, their ability to negotiate or manage IT has atrophied because they are too small to be serious clients. The vendor dropping support is a hard constraint. The fiscal test shows a six-fold cost variance, which suggests massive inefficiency subsidized by the broader system. Here, the procedure should point to a cantonal shared service for Standard Setting and Delivery, but potentially Municipal Financing if you want them to feel the cost. However, given the support cliff, the canton likely needs to procure the platform to ensure continuity. You would recommend a cantonal platform with mandatory municipal participation. The value gate might trigger if some municipalities fiercely guard their contractual autonomy, but the technical risk of system failure overrides that. You mark that the canton must act to prevent service collapse, but note that the cost should be visible to municipalities to prevent moral hazard.

  The rental licensing file is the hardest one, and your instinct is likely correct. Housing and zoning are traditionally municipal competences in Switzerland, and enforcement is local. The counterfactual check asks if municipalities could run a register if they had to. They probably could, using existing staff. The spillover test is mixed; tourists move across boundaries, but the housing impact is local. The fiscal test shows the canton wants to enforce, but who pays? If the canton pays for enforcement, it should set the rules. If municipalities pay, they should set the caps. The procedure likely tells you that Standard Setting could be cantonal to ensure data compatibility, but Enforcement and Decision on Caps should be municipal. If your draft regime takes all four functions, the procedure flags it as overreach unless you can prove municipalities are systematically failing to enforce existing laws. If you cannot prove systematic failure, you have to send this to the Regierungsrat as a Value Judgment. You tell them that technically this can be done locally, but if they want uniformity for political reasons, they must own that decision. You do not hide behind subsidiarity to justify a policy choice for centralization.

  There are limits to what this procedure can do, and you need to know them before you use it. It will systematically get files wrong where the real issue is political trust rather than administrative capacity. If the canton does not trust the municipalities to enforce a law fairly, no amount of technical triage will fix that, and the procedure will recommend decentralization that the politicians will reject. It also struggles with emergency situations where the speed of decision matters more than the level of decision. In those cases, the procedure should default to the level that can act fastest, usually the canton, with a sunset clause. Regarding the ratchet, you asked if you should give the lower level a presumptive bonus. Yes, you should. Because the dynamic of atrophy is so strong, you need a tie-breaker rule. If the technical assessment is ambiguous, if the evidence is equally balanced between cantonal and municipal capability, you default to the municipality. This creates a friction against centralization that compensates for the natural drift upward. It forces the canton to prove why it must act, rather than forcing the municipality to prove why it can. This bonus does not guarantee the municipality keeps the task, but it ensures that the file only comes to you when there is a clear reason for it to do so.

  You also need to be honest about where the regress bites. It bites hardest when you assign a task to a municipality but dictate exactly how they must do it, which is common in environmental files. You say it is municipal, but you prescribe the technology, the reporting format, and the staffing levels. That is not decentralization, it is micromanagement. Your procedure should flag this as Cantonal Delivery in disguise. If you are dictating the how, you should take the what. It is harmless when you set a goal and let them find the path, even if you are the one deciding they should have the goal. The distinction is whether you are leaving them room to fail. If they cannot fail, they are not responsible, and if they are not responsible, the task belongs to you. Finally, remember that this procedure is a shield for you, not a sword for the government. It protects you from being blamed for political choices disguised as technical necessities. When you send a file back with a note saying this is a value judgment, you are telling the Regierungsrat that they must sign the political cost. That is the only way to stop the ratchet, by making the cost of centralization visible on the one-pager they actually read.
