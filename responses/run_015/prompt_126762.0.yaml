answer: |-
  There is no single, canonical technical term in analytic philosophy that exclusively names this specific bidirectional structure of karmic accounting. However, your analysis identifies a sophisticated composite of several well-documented logical and methodological flaws.

  In the philosophy of science and religion, this structure is most precisely demarcated as a **Self-Sealing Argument** achieved through an **Immunizing Stratagem**. While "unfalsifiability" describes the *status* of the theory, the *mechanism* you describe—the inversion of causal attribution to preserve the core axiom—is best understood through the following conceptual cluster:

  ### 1. The Logical Structure: "Self-Sealing" and "Heads-I-Win"
  The specific bidirectional movement you identify (where suffering proves past debt, but relief proves new credit, never depletion) is colloquially known as **"Heads-I-Win-Tails-You-Lose" reasoning**. In formal argumentation theory, this is a **Self-Sealing Argument**.

  A self-sealing argument is one where any possible state of affairs is interpreted as confirmation of the theory.
  *   **Standard Unfalsifiability:** "No evidence could count against this."
  *   **Your Observation:** "All evidence counts *for* this, but the *interpretation* of the evidence shifts dynamically."

  This goes beyond simple unfalsifiability because it involves **Explanatory Plasticity**. The theory does not merely resist refutation; it actively absorbs anomalies by reclassifying the *temporal direction* of the moral causality (past-to-present vs. present-to-future) without independent warrant.

  ### 2. The Methodological Sin: "Immunizing Stratagem"
  Karl Popper coined the term **Immunizing Stratagem** (or *Conventionalist Stratagem*) to describe exactly this maneuver. It occurs when a theorist modifies the auxiliary assumptions of a system to protect the "hard core" from refutation.

  In your karmic example:
  *   **Hard Core:** Cosmic justice exists; welfare matches desert.
  *   **Protective Belt:** The specific ledger of past/future lives.
  *   **The Stratagem:** When the protective belt threatens to expose the hard core (e.g., a saint suffers), the theorist adjusts the belt (e.g., "it's payment for a hidden past sin") rather than allowing the hard core to be tested.

  What you have identified is a **Dynamic Immunizing Stratagem**. Unlike a static ad hoc hypothesis (e.g., "there is an invisible planet causing the orbit"), this strategy *inverts the rule of evidence* depending on the outcome.

  ### 3. In Philosophy of Religion: "The Indeterminacy Objection"
  In the specific literature on karma (e.g., works by Bruce Reichenbach, Roy Perrett, or Whitley Kaufman), this is discussed under the **Indeterminacy Objection** or the **Problem of Epistemic Access**.

  Critics argue that because the "ledger" (past lives) is epistemically inaccessible, the theory allows for **Infinite Deferral of Verification**. However, your observation adds a crucial layer: it is not just that we *cannot see* the ledger, but that the *rules of reading the ledger* change to ensure it never balances in a way that falsifies the system. Some scholars refer to this theological defense as appealing to **Inscrutability** (in Buddhism, *acinteyya* or "imponderables"), but logically, this functions as **Systematic Special Pleading**.

  ### 4. Demarcating from Ordinary Auxiliary Hypotheses
  You asked how to distinguish this from a legitimate auxiliary hypothesis in a desert-based framework. In the philosophy of science (specifically the Lakatosian framework), an auxiliary hypothesis is legitimate if it is **progressive** rather than **degenerative**.

  To demarcate your "bidirectional bookkeeping" from a legitimate hypothesis, apply these three boundary conditions:

  **A. Independent Testability (The Duhem-Quine Constraint)**
  *   *Legitimate Hypothesis:* The existence of the "hidden surplus" or "past deficit" can be established by evidence *other than* the welfare outcome it is meant to explain. (e.g., A confession, a recorded deed).
  *   *Your Structure:* The *only* evidence for the past deficit is the present suffering, and the *only* evidence for the hidden surplus is the present good fortune. This is **Circular Verification**.

  **B. Predictive vs. Retrodictive Power**
  *   *Legitimate Hypothesis:* The theory predicts future states based on known past inputs.
  *   *Your Structure:* The theory explains past inputs based on known future states (reverse engineering). If the "cause" (past karma) is inferred solely from the "effect" (present welfare), the causal arrow is illusory.

  **C. Consistency of Accounting Rules**
  *   *Legitimate Hypothesis:* The rules of moral arithmetic remain constant. If suffering depletes a credit reserve, subsequent good fortune should indicate the reserve is exhausted.
  *   *Your Structure:* The rules of arithmetic shift. Suffering depletes credit *or* pays debt; fortune adds credit *or* spends surplus. This violates the **Principle of Consistency**. In logic, this is **Special Pleading**: applying one standard to negative outcomes and a different standard to positive outcomes to ensure the same conclusion.

  ### Recommendation for Terminology
  If you are writing on this, there is no harm in coining a precise descriptor, as the existing terms are slightly too broad. Given your focus on the *accounting* metaphor and the *bidirectional* nature, you might accurately label this:

  **"Asymmetric Moral Bookkeeping"**
  or
  **"The Reversible Causality Stratagem"**

  However, the most rigorous existing classification is **a Dynamic Immunizing Stratagem employing Systematic Special Pleading.**

  This distinguishes it from simple post-hoc rationalization because it is not merely a one-off excuse; it is a *systemic rule* that governs the interpretation of all data points to ensure the theory remains immune to empirical disconfirmation. It transforms the theory from a descriptive claim about the universe into a tautological framework for interpreting experience.
