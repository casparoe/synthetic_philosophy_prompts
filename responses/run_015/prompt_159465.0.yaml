prompt: |-
  I'm taking an interdisciplinary seminar that puts the philosophy of history next to some tort law, and I keep getting stuck on two institutional practices that appear to run on opposite assumptions about counterfactuals, so I'd like the implicit theory made explicit. The first is the tort-side one: a plaintiff has to show that the wrongdoer made a difference, that but for the negligent act the injury would not have occurred, and most common-law courts refuse what get called "wrongful life" claims, in which a child born with severe impairments because a doctor failed to warn the parents seeks damages for having been born at all; the stated difficulty, as I understand it, is that the comparison state — her never having existed — is not a state that can be worse or better for her, so the counterfactual needed to measure the harm is simply unavailable. The second is the practice of compensating historical injustices: schemes that pay the descendants of enslaved, dispossessed, or displaced populations compute what is owed by comparing the claimants' situation with a counterfactual in which the enslavement or dispossession did not happen, even though, given how partnerships, migrations, and conception dates would have shifted, essentially none of these particular individuals would have existed in that world. So the same broad legal culture treats an existence-destroying counterfactual as unusable in one context and as the working basis of an entitlement in another.

  Here is the shape of what I want. First, reconstruct the theory of harm, of counterfactual comparison, and of what the relata of comparison are that the reparations practice only makes sense under — and be precise about which parts it strictly presupposes and which it merely sits comfortably with. My own tentative carving is that institutions handle what I've started calling existence-entangled counterfactuals in a few distinguishable ways: comparing lineages over generations rather than persons; comparing occupants of a social position or role rather than individuals; comparing distributions over populations, so that identity drops out altogether; or treating a people or community as a single entity that survives counterfactual perturbation even though its members do not. Is that the right set of options, is one of them what the practice actually needs, or is the practice metaphysically lighter than all of them — compatible with several theories at once, so that nothing about the metaphysics of persons or groups settles it? Second, say how the practice chooses its nearest worlds. It seems to hold fixed the broad demographic and economic background and remove only the institution, rather than asking whether, absent that institution, some other predation would have produced much the same distribution — the "it would have happened anyway" worry that historians raise about inevitability. Does rejecting that alternative presuppose a contested view of historical modality, or is it just a stipulation about which differences are to be counted, and what would it take for the inevitability-style counterfactual to defeat a claim?

  Finally, I want the practical upshot. Suppose a scheme were written differently: instead of tracing lineage wealth, it pays each claimant the gap between her present position in the income distribution and the position that a same-sized but differently composed population would have occupied had the institution never existed. Is that scheme more defensible under the tort-side metaphysics of persons, or does it inherit the same commitments in a new place? And if we took the tort-side scruple seriously throughout, what would actually have to change — would compensation have to be paid to communities rather than individuals, restricted to living victims of the original wrong, reframed as forward-looking redistribution rather than repair, or abandoned as a category? A good answer, for me, would say exactly where the existing practice is underdetermined by theory and where it quietly rules a rival view out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Interdisciplinary seminar (Philosophy of History + Tort Law).
      *   **Core Problem:** A perceived contradiction in how counterfactuals are handled in two legal/institutional contexts:
          1.  *Tort Law (Wrongful Life):* Rejects counterfactuals where the alternative is non-existence ("but for" causation fails because non-existence isn't a harm state).
          2.  *Reparations/Historical Injustice:* Accepts counterfactuals where the alternative implies the current claimants wouldn't exist (non-identity problem), yet calculates damages based on that counterfactual.
      *   **Task 1: Reconstruct the Theory of Harm/Counterfactuals in Reparations.**
          *   What theory makes reparations sense?
          *   Evaluate the user's proposed options (lineages, social positions, distributions, communal entities).
          *   Determine if the practice is metaphysically committed or lightweight/compatible with multiple theories.
      *   **Task 2: Analyze "Nearest Possible Worlds" in Reparations.**
          *   How is the counterfactual world constructed? (Holding background fixed vs. removing institution).
          *   Address the "inevitability" objection ("it would have happened anyway").
          *   Is this a contested view of historical modality or a normative stipulation?
      *   **Task 3: Practical Upshot/Alternative Schemes.**
          *   Evaluate a distribution-based scheme (gap in income distribution vs. lineage wealth).
          *   Is this more defensible under tort metaphysics?
          *   If we took tort scruples seriously, what changes? (Community payment, living victims only, forward-looking, abandonment).
      *   **Goal:** Explicitly state where the practice is underdetermined by theory and where it rules out rival views.

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *The Non-Identity Problem:* This is the core philosophical issue (Parfit). In "wrongful life," the child claims they are worse off existing than not existing. Courts say non-existence isn't a comparable state. In reparations, descendants claim they are worse off existing *as they are* (descendants of slaves) than they would have been *if the injustice hadn't occurred* (which implies they wouldn't exist).
      *   *Tort Law:* Focuses on *individualized harm* and *corrective justice*. The "but-for" test is strict. The relata are specific individuals.
      *   *Reparations:* Often focuses on *group harm*, *unjust enrichment*, or *structural disadvantage*. The relata might be groups, lineages, or social positions.
      *   *The Tension:* The user sees a contradiction. I need to show whether it *is* a contradiction or if the underlying theories of harm differ sufficiently to resolve it.

  3.  **Drafting Task 1: Theory of Harm in Reparations:**

      *   *User's Options:*
          1.  Lineages over generations.
          2.  Occupants of social positions.
          3.  Distributions over populations.
          4.  People/Community as a single entity.
      *   *Analysis:*
          *   Tort law requires *person-affecting* harm (usually). Reparations can operate on *impersonal* harm or *group* harm.
          *   Option 4 (Community as entity) is strong. If the *community* was harmed and persists, the specific members don't need to be identical.
          *   Option 2 (Social Positions) is also strong. The harm attaches to the *position* (e.g., "descendant of enslaved persons"), not the specific biological soul.
          *   Option 1 (Lineages) is tricky because lineages are just chains of individuals. If the individuals change, does the lineage survive? Metaphysically shaky unless treated as a group entity.
          *   Option 3 (Distributions) moves away from "harm" to "inequity."
      *   *Verdict:* The practice isn't metaphysically lightweight. It *requires* moving away from the strict tort model of individualized, person-affecting harm. It presupposes that the *group* or the *structural position* is the bearer of rights/harms, not just the biological individual. It rules out strict person-affecting views (like Parfit's strict interpretation).

  4.  **Drafting Task 2: Nearest Possible Worlds & Modality:**

      *   *The Construction:* Reparations usually assume "No Slavery" = "Same People, Better Outcome." But causally, "No Slavery" = "Different People."
      *   *The "Inevitability" Objection:* If slavery didn't happen, maybe serfdom or colonization would have.
      *   *Modality:* Rejecting inevitability isn't just stipulation; it's a claim about *normative* possibility vs. *causal* possibility. The law cares about *wrongful* deviations, not just *any* deviations.
      *   *Key Distinction:* Tort law looks at *causal* nearest worlds. Reparations look at *normative* nearest worlds (the world as it *ought* to have been).
      *   *Defeating the Claim:* To defeat via inevitability, one must show the *specific harm* (racialized caste) was inevitable, not just *some* harm.

  5.  **Drafting Task 3: Practical Upshot & Alternative Schemes:**

      *   *The Proposed Scheme:* Paying based on income distribution gaps for a "same-sized but differently composed population."
      *   *Analysis:* This avoids the non-identity problem entirely! It treats the harm as structural/distributional, not individual/biographical.
      *   *Tort Compatibility:* It aligns better with tort metaphysics *if* torts allowed class-action/structural harm. But strict torts require specific plaintiffs. So, it's actually *less* like traditional torts (which are individual) and *more* like public law/administrative justice.
      *   *Taking Tort Scruples Seriously:*
          1.  *Living Victims Only:* No intergenerational claims. (Ends most reparations).
          2.  *Community Payment:* Money goes to a trust for the group, not individuals. (Avoids non-identity).
          3.  *Forward-Looking:* Not "repair" but "reform." (Changes the justification from corrective justice to distributive justice).
          4.  *Abandonment:* If strict person-affecting harm is required, reparations for historical injustice collapse.

  6.  **Synthesizing and Refining:**

      *   *Tone:* Academic, precise, philosophical but grounded in legal practice.
      *   *Structure:* Follow the user's three-part request exactly.
      *   *Key Insight:* The "contradiction" exists only if we assume both practices rely on the same theory of harm (Corrective Justice/Person-Affecting). Reparations often rely on Distributive Justice or Group Rights.
      *   *Refining the "Nearest World":* Emphasize the difference between *causal* counterfactuals (Tort) and *normative* counterfactuals (Reparations).
      *   *Refining the "Metaphysics":* The practice is *not* lightweight. It implicitly commits to a form of "transgenerational subject" or "structural harm."

  7.  **Self-Correction/Nuance Check:**
      *   *Did I answer the "underdetermined" part?* I need to be clear: The *current* practice (cash to individuals based on lineage) is underdetermined *if* you try to justify it via individual harm. It becomes determined if you justify it via group harm.
      *   *Did I address the "Wrongful Life" comparison?* Yes, by highlighting the "non-existence" barrier in torts vs. the "different existence" assumption in reparations.
      *   *Is the "distribution" scheme better?* It solves the metaphysical problem but changes the legal category from Tort to Equity/Statute.

  8.  **Final Polish:** Ensure terms like "Non-Identity Problem," "Person-Affecting View," "Corrective vs. Distributive Justice," and "Normative vs. Causal Modality" are used correctly. (Proceed to generate output based on these thoughts).

      *   *Wait, one nuance:* The user asks if the practice is "metaphysically lighter." I should argue it's actually *heavier* or *different*, not lighter. It requires a robust theory of group persistence.
      *   *Another nuance:* The "inevitability" point. I need to distinguish between "some harm would have occurred" (irrelevant) and "this specific structural harm would have occurred" (relevant defense).

  9.  **Final Plan:**
      *   **Introduction:** Acknowledge the tension (Non-Identity Problem).
      *   **Section 1: Theory of Harm.** Analyze the four options. Argue for "Social Position/Structure" + "Group Entity." Show it rules out strict person-affecting views.
      *   **Section 2: Nearest Worlds.** Distinguish Causal vs. Normative modality. Address inevitability.
      *   **Section 3: Practical Upshot.** Analyze the distribution scheme. Detail the consequences of taking tort scruples seriously (Living victims, Community trusts, Forward-looking).
      *   **Conclusion:** Summarize where theory underdetermines practice and where it constrains it.

