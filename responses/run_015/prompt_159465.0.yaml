answer: |-
  This is a sharp observation. You have identified the **Non-Identity Problem** (famously articulated by Derek Parfit) as it manifests in the friction between corrective justice (tort) and historical justice (reparations). The tension is real: Tort law generally demands a *person-affecting* view of harm (Individual A is worse off than Individual A would have been), while reparations often rely on a *structure-affecting* or *group-affecting* view (Group G is worse off than Group G would have been, even if the members of G are not numerically identical).

  Here is the reconstruction of the implicit theories, the modal commitments, and the practical upshots you requested.

  ### 1. The Theory of Harm and the Relata of Comparison

  To make sense of reparations without collapsing into the "wrongful life" contradiction, the practice cannot be operating on the same theory of harm as common-law torts. Tort law presupposes **Corrective Justice** between specific individuals; reparations for historical injustice often presuppose **Distributive Justice** or **Group Rights**.

  Let's evaluate your four proposed options for how institutions handle "existence-entangled counterfactuals":

  1.  **Comparing Lineages:** This is metaphysically unstable unless a lineage is treated as an entity distinct from its members. If a lineage is just a chain of biological individuals, the non-identity problem destroys the claim (Chain A would not exist; Chain B exists).
  2.  **Comparing Social Positions:** This is the strongest candidate for what the practice *actually* does. The harm attaches to the *position* (e.g., "descendant of enslaved persons in the US South") rather than the biological soul occupying it. The counterfactual is: "What would the occupant of this social position possess had the institution defining the position not existed?"
  3.  **Comparing Distributions:** This treats the harm as impersonal. It compares State of Affairs X (high inequality correlated with race) vs. State of Affairs Y (lower inequality). Identity drops out entirely.
  4.  **Community as Single Entity:** This treats the group as a transgenerational subject (a "people") that survives the turnover of members.

  **Which does the practice presuppose?**
  Current reparations schemes (like the Tulsa Greenwood reparations or proposals for H.R. 40) are **metaphysically heavier than they appear.** They are not compatible with the tort-side "person-affecting" view. To function, they must implicitly adopt a hybrid of **(2) Social Positions** and **(4) Community Entity**.

  *   **Strict Presupposition:** The practice *strictly presupposes* that the bearer of the right to compensation is not the biological individual *qua* biological individual, but the individual *qua* member of a persisting group. If you insist on the tort-side metaphysics (that only biological individuals can be harmed), the practice is incoherent.
  *   **Comfortable Compatibility:** It sits comfortably with **(3) Distributions**, but current legal drafting rarely admits this openly because distributions sound like welfare policy, whereas reparations sound like legal entitlement.
  *   **Ruled Out:** The practice *rules out* the strict **Person-Affecting View** dominant in torts. In torts, if the plaintiff wouldn't exist but for the wrong, there is no standing. In reparations, the fact that the plaintiff wouldn't exist but for the wrong is ignored in favor of the claim that the *group's* trajectory was altered.

  **Verdict:** The practice is not metaphysically lightweight. It quietly commits to a theory of **transgenerational group agency** or **structural harm**. It asserts that the "victim" is the lineage or the community, and the current claimants are merely the *representatives* or *beneficiaries* of that enduring victim, not the victims themselves in the tort sense.

  ### 2. Selecting the Nearest Possible World

  You ask how the practice chooses its nearest worlds and whether it rejects the "inevitability" objection ("it would have happened anyway") via contested modality or stipulation.

  **Causal vs. Normative Modality**
  Tort law uses **Causal Modality**: It asks, "What would physically have happened in the closest causal world?"
  Reparations use **Normative Modality**: It asks, "What would have happened in the closest *just* world?"

  When reparations schemes compute damages, they hold fixed the *population* and the *economic potential*, but they remove the *institution*. They do not ask, "If slavery hadn't existed, would the colonial economy have collapsed, leading to different migrations and different conceptions?" (The causal question). They ask, "If the *wrong* hadn't occurred, what would the wealth of this group be?" (The normative question).

  **The Inevitability Objection**
  The historian's worry ("some other predation would have produced the same distribution") is a challenge to the *causal* link, but reparations treat it as a challenge to the *normative* link.
  *   **Stipulation:** It is a normative stipulation that we compare the actual world to a world where the *specific wrong* is absent, not a world where *some generic harm* replaces it.
  *   **Contested Modality:** Rejecting inevitability does presuppose a view of history where human institutions are contingent, not deterministic. However, to defeat a claim, the "inevitability" defense must be specific. It is not enough to say "some hierarchy would have emerged." The defense must show that *this specific racialized wealth gap* would have emerged absent the specific injustice.
  *   **Defeating the Claim:** For the inevitability counterfactual to defeat a claim, it must demonstrate that the *mechanism of transfer* was independent of the wrong. If the argument is "European expansion inevitably extracts wealth from indigenous peoples," that might reduce damages but rarely eliminates them, because the *mode* of extraction (chattel slavery vs. trade vs. conquest) carries different normative weights and causal outcomes.

  **Verdict:** The practice relies on a **normative baseline**, not a causal one. It treats the "no-injustice world" as the baseline, regardless of whether that world is causally probable. This is not a metaphysical error but a juridical choice: the law is interested in rectifying *wrongs*, not simulating *alternative histories*.

  ### 3. Practical Upshot and Alternative Schemes

  You propose a scheme that pays the gap between a claimant's position and the position a "same-sized but differently composed population" would have occupied.

  **Is this scheme more defensible under tort metaphysics?**
  Paradoxically, **no.**
  *   **Tort Metaphysics:** Tort requires a specific plaintiff who was specifically harmed. A scheme based on "differently composed populations" admits that *this* plaintiff was not harmed (since they wouldn't exist in the counterfactual). It shifts the justification entirely to **Distributive Justice**.
  *   **The Shift:** Your proposed scheme is actually *more* honest about the non-identity problem, but it ceases to be "tort-like" (corrective) and becomes "statutory" (distributive). It admits that we are not repairing a specific injury to *you*, but adjusting a structural inequity *in which you find yourself*.

  **If we took the tort-side scruple seriously throughout:**
  If we strictly enforced the "but-for" causation and "person-affecting" harm requirements of tort law on historical injustice, the following changes would be necessary:

  1.  **Restriction to Living Victims:** Compensation would be restricted to individuals who personally experienced the wrong (e.g., survivors of Jim Crow, living victims of specific massacres like Tulsa). Intergenerational claims would vanish because the "but-for" test fails for descendants.
  2.  **Community Trusts (The "Cy Pres" Solution):** Money could not be paid to individuals as "damages for harm." It would have to be paid to **community institutions** (trusts, endowments, development corporations) on the theory that the *group* is the victim. This bypasses the non-identity problem by treating the community as the enduring entity (Option 4 from your list).
  3.  **Reframing as Forward-Looking:** The language would have to shift from "reparations" (repairing the past) to "equity investment" (fixing the present). The justification would not be "you are owed this because of what happened," but "society requires this distribution to be just today."
  4.  **Abandonment of "Harm" Calculus:** We would stop trying to calculate the "lost wealth" of ancestors (which requires the impossible counterfactual) and instead calculate the "cost of inclusion" (what it costs to bring the marginalized group to parity now).

  **Where the Practice is Underdetermined vs. Ruling Out Rivals**

  *   **Underdetermined:** The practice is underdetermined regarding *who* receives the money. It could be individuals (current practice), trusts (community model), or tax credits (structural model). The metaphysics of the *group harm* supports all three; the metaphysics of *individual harm* supports none.
  *   **Ruling Out Rivals:** The practice **rules out** the strict **Lockean/Nozickian entitlement theory** applied to individuals across time. It implicitly rejects the idea that property rights are only held by biological atoms. It also rules out the **Tort Model of Causation**. If you try to justify reparations using standard tort "but-for" causation without modifying the theory of the victim (from individual to group), the argument collapses.

  **Summary for your Seminar:**
  The contradiction you see is not a mistake; it is a **category clash**. Tort law operates on **Corrective Justice** (individual-to-individual, causal counterfactuals). Reparations operate on **Structural Justice** (group-to-state, normative counterfactuals).

  The "wrongful life" restriction exists because tort law refuses to compare existence with non-existence for an *individual*. Reparations bypass this by comparing *Group Trajectory A* with *Group Trajectory B*. The practice is not metaphysically light; it is carrying a heavy, often unacknowledged load of **collective personhood**. If you force it to carry only the load of **individual personhood** (the tort scruple), the bridge breaks, and you are left with either living-victim-only compensation or forward-looking social policy, but not "reparations" in the historical sense.
