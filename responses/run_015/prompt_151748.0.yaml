  4.  **Testing the Principle against Cases:**
      *   *Moral Foundations:* Shallow (Weighting). Fits Epistemic/Context clause.
      *   *Supernatural Punishment:* Shallow (Jurisdiction). Fits Jurisdictional clause.
      *   *Infanticide:* Depends. If "not a person" $\rightarrow$ Deep. If "will die anyway" $\rightarrow$ Shallow. Fits Empirical clause.
      *   *Funerary:* Shallow (Symbolism). Fits Empirical/Context.
      *   *Lying:* Shallow (Weighting). Fits Context.
      *   *Trouble Case (Clan/Outsiders):* This is the pivot. If "unthinkable" means "cannot be wronged even if adopted," it's Deep. If "unthinkable" means "outside our enforcement zone," it's Shallow. The user's intuition wavers here. I need to force a choice. The principle should probably classify "unthinkable as a moral category" as Deep *unless* there is a mechanism for inclusion. Let's lean towards Deep for "unthinkable," but acknowledge the Jurisdictional counter-argument.
      *   *New Case (Divination):* Uniform application to clan/strangers.
