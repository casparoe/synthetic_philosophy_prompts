          1.  Empirical/Causal Revisability (Infanticide).
          2.  Jurisdictional/Structural Variance (Clan/Supernatural).
          3.  Ontological Exclusion (The Deep Threshold).
      *   **Application to New Case (Divination).**
      *   **The Trade-off (Where intuitions break):** Specifically addressing the Clan/Outsider tension.
      *   **Literature Context:** Separating consensus from debate.

  7.  **Self-Correction/Nuance Check during Drafting:**
      *   *Correction on Clan Case:* The user says harming strangers is "unthinkable as a moral category." This sounds like *conceptual* exclusion. If I adopt the principle that "potential for inclusion = shallow," does that save objectivity? Yes, but it risks being too charitable. I need to highlight that if the culture *conceptually lacks* the category of "person" for outsiders, that is Deep, even if we think they *should* have it.
      *   *Correction on Divination:* If moral truth is accessed *only* via divination, and divination says X, is that objective? If the divination is treated as empirical (reading reality), it's Shallow (epistemic). If it's treated as constitutive (making reality), it's Deep (metaphysical). The prompt says "no causal-empirical mediation." This leans Deep metaphysically, but if the *status* is uniform, it leans Shallow structurally. I will argue it is Shallow *provided* the divination acknowledges the stranger's suffering/interest as counting.
      *   *Literature Check:* Ensure I mention that "Moral Foundations" is contested (some say it's not 5/6 factors, some say it's WEIRD bias). Ensure I mention that "Moral Realism" is not consensus.

  8.  **Final Polish:** Check tone (philosophical, rigorous, honest about limitations). Ensure all constraints of the prompt are met. (Specifically: "identify the case that motivates it," "state its verdict on a case I have not listed," "separate settled from contested.")

      *(Self-Correction on the "Trouble Case"):* The user is worried about inconsistency. If jurisdiction is shallow, is "clan boundaries" just jurisdiction? The key distinction is *reciprocity*. If the clan acknowledges that *were* they in the stranger's position, the stranger would be right to harm them, it's jurisdiction. If they think the stranger has *no right* even in retaliation, it's status denial. I will build this into the principle.

      *(Refining the Divination Verdict):* If the culture uses divination for *everyone* equally, it implies a universal moral ontology (the spirits/universe care about everyone). This actually supports objectivity (Shallow epistemic difference). If they only used divination for clan, it would be Deep. So the verdict is Shallow.

