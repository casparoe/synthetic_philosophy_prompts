answer: |-
  This is a sophisticated meta-ethical problem. You are attempting to carve out a "Robust Realism" that accommodates anthropological data without collapsing into relativism, by distinguishing *implementation noise* (shallow) from *ontological negation* (deep).

  Your intuition that "jurisdiction" and "status" are the key variables is sound, but the "Trouble Case" (the clan society) reveals a fissure in your current framework: **Conceptual Incommensurability vs. Structural Exclusion.** If a culture lacks the *concept* of "wronging an outsider," is that a denial of status (Deep) or a limit of their moral language's jurisdiction (Shallow)?

  Below is a refined principle family designed to maximize the coherence of your specific verdicts, followed by the requested stress tests and literature context.

  ### The Principle of Reciprocal Recognizability and Empirical Revisability

  To classify a disagreement as **Shallow** (compatible with objectivity), it must satisfy at least one of the following three clauses. If it satisfies none, it is **Deep** (threatening to objectivity).

  #### Clause 1: Empirical Revisability
  *   **Definition:** A moral divergence is shallow if the conflicting judgment would converge given shared, idealized empirical information about the consequences, capacities, or states of the beings involved.
  *   **Motivating Case:** **Infanticide under Scarcity.** If the culture stops infanticide upon learning survival is possible, the disagreement was empirical (Shallow). If they continue it because the newborn is "not a person," it is ontological (Deep).
  *   **Verdict on New Case (Divination):** **Shallow.** Even though the method is non-empirical ("no causal-empirical mediation"), if the divination process treats the *interests* of strangers and clan members as commensurable inputs (e.g., the spirits weigh a stranger's pain equally to a clansman's), the divergence is merely epistemic (how we know the good) rather than ontological (what is good). The uniform application suggests a universal moral ontology accessed via a different technology.

  #### Clause 2: Jurisdictional Translatability
  *   **Definition:** A moral divergence is shallow if the culture acknowledges that the *logic* of their moral system would apply to the outsider *were* the outsider to enter the relevant relational or geographic boundary, even if current boundaries are strict.
  *   **Motivating Case:** **The Clan/Outsider Trouble Case.** This clause forces a decision on your inconsistency. If the clan admits, "If this stranger were adopted, harming them would be wrong," the exclusion is Jurisdictional (Shallow). If they assert, "Even if adopted, this stranger's lineage makes harming them permissible," it is Ontological (Deep).
  *   **Verdict on New Case (Divination):** **Shallow.** Since the divination applies uniformly to clan and strangers, it explicitly satisfies jurisdictional universality. There is no "outside" to the moral system; the spirits govern all interactions.

  #### Clause 3: Functional Equivalence of Value
  *   **Definition:** A moral divergence is shallow if the conflicting practices serve the same underlying functional role (e.g., respect, cohesion, harm reduction) despite symbolic incompatibility.
  *   **Motivating Case:** **Funerary Cannibalism vs. Burial.** Both serve "respect for the dead" and "management of grief/remaining presence."
  *   **Verdict on New Case (Divination):** **Shallow.** The function (aligning action with cosmic/moral order) is identical to secular deliberation; only the mechanism differs.

  ---

  ### Where the Principle Breaks (The Trade-Offs)

  You asked for honesty about which intuitions cannot be accommodated without *ad hoc* modification. There are two specific friction points where this principle forces you to abandon a comfortable ambiguity.

  **1. The "Conceptual Blindness" Problem (The Clan Case)**
  *   **Your Intuition:** You wavered on whether "unthinkable as a moral category" is Deep or Shallow.
  *   **The Principle's Verdict:** **Deep.**
  *   **Why:** Clause 2 requires *Jurisdictional Translatability*. If the culture literally lacks the concept of "wronging" an outsider (not just "it is permitted," but "the proposition is meaningless"), they cannot satisfy the counterfactual "were they in the clan." They cannot conceptualize the outsider as a moral patient *even in principle*.
  *   **The Cost:** You must abandon the hope that this is merely "extreme citizenship." If the moral language cannot extend to the outsider even hypothetically, this is a denial of moral status. To call this "Shallow" requires an *ad hoc* addition: *"Unless the culture is pre-axial,"* which privileges modern moral vocabulary as the objective standard.

  **2. The "Motivated Empiricism" Problem (Infanticide)**
  *   **Your Intuition:** You want to classify infanticide as Shallow if based on "false empirical premises."
  *   **The Principle's Verdict:** **Unstable.**
  *   **Why:** Clause 1 (Empirical Revisability) relies on the ability to distinguish empirical beliefs from status beliefs. In practice, these are fused. A culture may claim "it will die anyway" (empirical) but truly mean "it is not worth saving" (status).
  *   **The Cost:** You cannot rely on the culture's *stated* reason. You must judge based on *counterfactual stability*. This makes your framework partially externalist: you (the observer) decide if the empirical claim is the real driver. This opens you to the charge of imposing your own epistemic standards to define "shallow," which is a form of soft imperialism.

  ---

  ### Settled vs. Contested in the Literature

  To ensure your framework is grounded in current academic reality, here is the distinction between consensus and debate in moral psychology and meta-ethics.

  #### Broadly Settled (Consensus Views)
  1.  **Rejection of Strong Relativism:** There is near-universal agreement in analytic philosophy and cognitive science that "strong" moral relativism (the claim that moral truths are *constituted* by cultural approval with no external standard) is untenable. It fails to explain moral progress, cross-cultural critique, and the phenomenology of moral experience (the feeling that we are *discovering* rather than *inventing* obligations).
  2.  **Universal Foundations:** It is settled that human moral psychology is not a "blank slate." There are evolved, universal capacities for empathy, reciprocity, and hierarchy management. The debate is not *if* there are universals, but *how many* and *how rigid* they are.
  3.  **WEIRD Bias:** It is consensus that Western, Educated, Industrialized, Rich, Democratic populations are outliers in moral psychology (e.g., hyper-individualistic, analytically focused). Generalizing from WEIRD samples to "human morality" is methodologically invalid.

  #### Genuinely Contested (Specialist Debates)
  1.  **The Number and Nature of Foundations:** While Haidt's Moral Foundations Theory (Care, Fairness, Loyalty, Authority, Purity) is famous, it is **not** consensus. Many psychologists argue the factor structure is unstable across cultures, or that "Purity" is not a moral foundation but a disgust heuristic co-opted by morality. Your framework treats these as "weighting differences" (Shallow), which assumes they are the *same* foundation. If "Purity" is actually a distinct cognitive module unrelated to "Harm," the divergence is deeper than you allow.
  2.  **Moral Status as Natural Kind vs. Social Construct:** Philosophers disagree on whether "moral status" is a property inherent to beings (e.g., sentience, rationality) or a social status conferred by a community.
      *   *Realists* argue status is discovered (supports your "Deep" category).
      *   *Constructivists* argue status is granted (implies the Clan case is Shallow, because they simply haven't granted it yet).
      *   *Your framework assumes Realism.* You must acknowledge this is a contested metaphysical commitment, not an anthropological fact.
  3.  **The "Moral" Category in Anthropology:** Linguistic anthropologists contest whether "morality" is a universal category. Some societies do not distinguish "moral" rules from "prudential" or "ritual" rules. If a culture does not have a concept of "morality" distinct from "pollution" or "etiquette," classifying their disagreements as "Shallow Moral Disagreements" may be a category error. Your Divination case touches this: if the divination reveals "pollution" rather than "wrongness," is it moral?

  ### Summary Recommendation

  Your framework is robust if you accept **Clause 2 (Jurisdictional Translatability)** as the hard boundary.
  *   **Keep:** The distinction between Empirical Error and Status Denial.
  *   **Abandon:** The idea that "unthinkable" is merely jurisdictional. If they cannot conceptualize the outsider as a patient even hypothetically, you must classify it as Deep to maintain objectivity.
  *   **Accept:** That applying this framework requires you to make external judgments about what counts as "empirical" vs. "ontological," which invites charges of bias but is unavoidable for any realist position.

  This preserves your objectivity claim while admitting that some cultures are not just "differently weighted" but are operating with a fundamentally truncated moral ontology.
