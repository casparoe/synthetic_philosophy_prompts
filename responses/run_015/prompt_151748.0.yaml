          *   Be honest about intuitions the principle *cannot* accommodate (trade-offs).
          *   Distinguish settled vs. contested literature (avoid presenting constructivism as consensus).

  2.  **Deconstruct the User's Framework & Intuitions:**
      *   The core tension is between *structural/jurisdictional* differences and *ontological/status* differences.
      *   The "Trouble Case" (Clan/Outsiders) is the stress test. If outsiders are "unthinkable," is that a denial of status or just a hard boundary of jurisdiction?
      *   The "Infanticide" distinction relies on distinguishing *empirical error* from *status denial*. This is notoriously hard in practice (motivated reasoning).
      *   The "Divination" case tests the *epistemic access* condition. If the method is non-empirical but universal in scope, does that count as shallow (different epistemology) or deep (different metaphysics)?

  3.  **Drafting the Principle (Iterative Process):**
      *   *Attempt 1:* Disagreement is shallow if it assumes the same beings matter. Deep if different beings matter.
