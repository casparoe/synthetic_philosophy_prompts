      *   *Attempt 3 (Refining the User's "Status" vs. "Jurisdiction"):* Focus on *Counterfactual Vulnerability*. If the culture accepts that *were* the outsider in the clan, they would have status, it's jurisdictional. If they believe the outsider *could never* have status regardless of location/relationship, it's ontological.
      *   *Refining the Infanticide distinction:* Focus on *Revisability*. If new empirical data (e.g., survival is possible) changes the verdict, it was empirical. If the verdict holds regardless of survival (e.g., "it's not a person yet"), it's status.

      *   *Proposed Principle Family:* **The Principle of Reciprocal Recognizability and Empirical Revisability.**
          1.  **Jurisdictional Clause:** Differences in *who* enforces or *where* obligations apply are shallow if the underlying capacity for moral standing is acknowledged as potential. (Motivated by Clan/Outsider case).
          2.  **Epistemic/Empirical Clause:** Differences in action based on causal beliefs are shallow if the normative goal remains constant. (Motivated by Infanticide/Supernatural Punishment).
