          *   User says "applies uniformly." This suggests the *scope* is universal. The *method* is non-empirical.
          *   Verdict: Shallow (Epistemic divergence), provided the *status* of the subjects isn't denied by the divination itself.

  5.  **Addressing the "Settled vs. Contested" Requirement:**
      *   *Settled:* Moral Foundations Theory (Haidt) shows variation but also universals (the "first draft" metaphor). Pure relativism is generally rejected in analytic philosophy (self-defeating, inability to critique oppression).
      *   *Contested:* The extent to which "moral status" is a natural kind vs. a social construct. The line between "conceptual inability" and "refusal." The normative weight of "ideal observer" theories vs. grounded realism.
      *   *Avoid:* Claiming morality is *entirely* constructed. Claiming objectivity is proven.

  6.  **Refining the Output Structure:**
