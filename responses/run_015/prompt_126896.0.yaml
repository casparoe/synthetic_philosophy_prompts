prompt: |-
  I'm working through an independent framework in philosophy of computation and mind where the physical substrate of representational processes is called the careenium—a layered, reactive, non-symbolic material that sustains but is not identical to structured content—while the representations themselves are modeled as simmballs: discrete, combinatorial, and rebindable entities that can float, cluster, or dissolve without being reducible to substrate states. The core question is whether simmballs push the careenium around, meaning whether symbolic-level properties have genuine downward causal efficacy on substrate dynamics, or whether all causal work is done at the substrate level with simmballs functioning only as descriptive or organizational overlays.

  Before I evaluate particular accounts, I want the full specification of adequacy. Write the desiderata that any theory of the careenium-simmball relation must satisfy: which causal and correlational scenarios it has to accommodate (for instance, symbolic computation triggering substrate reconfiguration, substrate noise corrupting symbol-binding without altering symbolic rules, emergent stability that cannot be traced exclusively to either level, and cases where substrate change precedes and apparently causes symbolic revision); which conceptual distinctions it must preserve (such as causal contribution versus constitutive dependence, token-level versus type-level influence, and pushing versus being pushed); which physical or formal results it must remain consistent with (for example, energy conservation, the absence of supervenient causation without a mediating mechanism, or physically interpreted constraints from computability theory); and flag any pairs of desiderata that appear jointly unsatisfiable given standard no-go considerations. For each requirement, provide the motivating case or thought experiment behind it, and indicate which demands are non-negotiable and which are camp-specific preferences. Keep the emphasis on the criteria and their tensions rather than on scoring existing views, though you may briefly note how substrate monism, symbol autonomy, and inter-level coupling fare against the list—this is for my own adjudication of approaches I have not yet studied in depth. Do not provide a bibliography or reading list; I need a specification that can be evaluated without external lookup.
