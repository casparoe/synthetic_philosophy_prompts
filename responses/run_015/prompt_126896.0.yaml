answer: |-
  # Specification of Adequacy: The Careenium-Simmball Relation

  ## 1. Scope and Definitions
  This specification defines the criteria for any theoretical account linking the **Careenium** (the layered, reactive, non-symbolic physical substrate) and **Simmballs** (discrete, combinatorial, rebindable representational entities). The goal is to adjudicate the causal status of Simmballs: specifically, whether they possess downward causal efficacy ("pushing the Careenium") or are epiphenomenal/organizational overlays ("being pushed by the Careenium").

  Adequacy is measured by the theory's ability to accommodate observed dynamics, preserve necessary conceptual distinctions, and remain consistent with physical and formal constraints, while explicitly acknowledging inherent tensions.

  ---

  ## 2. Domain I: Causal and Correlational Accommodation
  *Any adequate theory must provide a coherent mechanism or explanation for the following four scenarios. Failure to account for any one renders the theory descriptively incomplete.*

  ### 1.1. Symbolic Triggering (Downward Influence)
  *   **The Scenario:** A specific configuration of Simmballs (e.g., a logical deduction or a decision state) precedes and reliably predicts a macroscopic reconfiguration of the Careenium (e.g., motor actuation or substrate restructuring).
  *   **Motivating Case:** An agent formulates a plan (Simmball cluster) and subsequently alters their physical environment to match the plan. The Simmball pattern appears to select one physical trajectory over another physically possible alternative.
  *   **Requirement:** The theory must explain how discrete, combinatorial properties map onto continuous, reactive substrate dynamics without violating physical closure.

  ### 1.2. Substrate Corruption (Upward Constraint)
  *   **The Scenario:** Careenium noise, damage, or energetic fluctuation disrupts Simmball binding or coherence without altering the abstract rules governing the Simmballs themselves.
  *   **Motivating Case:** Physical fatigue or chemical interference causes "logical errors" (e.g., forgetting a step, binding the wrong symbols) even though the agent understands the rules. The Simmball logic remains valid, but its instantiation fails.
  *   **Requirement:** The theory must distinguish between the *validity* of the Simmball combinatorics and the *reliability* of the Careenium instantiation.

  ### 1.3. Substrate Precedence (Bottom-Up Revision)
  *   **The Scenario:** A change in the Careenium state precedes and necessitates a revision in the Simmball inventory or binding rules.
  *   **Motivating Case:** A sensory shock or hormonal shift (Careenium event) forces a re-evaluation of beliefs or goals (Simmball revision). The physical state dictates which symbols are available or stable.
  *   **Requirement:** The theory must allow for the Careenium to constrain the space of possible Simmball configurations, preventing the view that Simmballs are entirely autonomous.

  ### 1.4. Emergent Stability (Non-Reductive Homeostasis)
  *   **The Scenario:** The system maintains a stable state that cannot be traced exclusively to Careenium equilibrium (physics) or Simmball rules (logic), but arises from their feedback loop.
  *   **Motivating Case:** A cognitive state (e.g., "focus") is maintained by a loop where Simmball patterns stabilize Careenium activity, which in turn supports the Simmball pattern. Removing either description collapses the explanation of the stability.
  *   **Requirement:** The theory must accommodate causal loops or reciprocal determination where neither level is strictly prior in time or ontology during the stable phase.

  ---

  ## 3. Domain II: Conceptual Distinctions
  *The theory must preserve the following distinctions to avoid category errors. Collapsing these distinctions constitutes a failure of explanatory precision.*

  ### 2.1. Causal Contribution vs. Constitutive Dependence
  *   **Distinction:** Whether Simmballs *produce* changes in the Careenium (causal) versus whether Simmballs *are nothing but* patterns of Careenium activity (constitutive).
  *   **Motivating Case:** If Simmballs are constitutive, saying "the Simmball pushed the Careenium" is like saying "the wave pushed the water." If causal, it implies a distinct agency.
  *   **Requirement:** The theory must explicitly state whether Simmball efficacy is ontological (real force) or descriptive (useful fiction).

  ### 2.2. Token-Level vs. Type-Level Influence
  *   **Distinction:** Whether *this particular* Simmball cluster causes *this particular* Careenium shift (token), or whether the *kind* of Simmball generally correlates with the *kind* of Careenium state (type).
  *   **Motivating Case:** Multiple Realizability. The same Simmball (e.g., "Concept X") might be realized by different Careenium states in different instances. If influence is only at the token level, the Simmball type loses explanatory power.
  *   **Requirement:** The theory must specify the granularity of causation. If Simmballs are multiply realizable, type-level causation is required for them to be scientifically useful, but this creates tension with physical particularity.

  ### 2.3. Pushing vs. Being Pushed (Agency vs. Passivity)
  *   **Distinction:** Whether Simmballs initiate trajectories (Pushing) or merely track trajectories determined by the Careenium (Being Pushed).
  *   **Motivating Case:** The experience of volition. If Simmballs are only "Being Pushed," the feeling of choice is an illusion generated by the Careenium.
  *   **Requirement:** The theory must account for the directionality of control. Even if "Pushing" is denied, the theory must explain why the system behaves *as if* Simmballs push.

  ---

  ## 4. Domain III: Physical and Formal Constraints
  *The theory must not contradict established results in physics or computation. Violations here are fatal.*

  ### 3.1. Conservation of Energy and Momentum
  *   **Constraint:** Simmballs cannot introduce new energy into the Careenium.
  *   **Motivating Case:** If a Simmball decision causes a physical arm movement, the energy for that movement must come from the Careenium (metabolic/chemical), not from the "information" itself.
  *   **Requirement:** Any account of downward causation must be consistent with the causal closure of the physical domain regarding energy transfer. Simmballs may *direct* energy flow but not *generate* it.

  ### 3.2. The Supervenience Mechanism
  *   **Constraint:** There can be no difference in Simmball state without a difference in Careenium state (Supervenience), unless the theory posits dualism.
  *   **Motivating Case:** If two Careenium states are identical, they must host identical Simmballs. If Simmballs differ, the Careenium must differ somewhere.
  *   **Requirement:** If the theory claims Simmballs have causal power, it must explain how this power is mediated without violating the principle that the physical substrate is sufficient for physical effects. (Avoiding "spooky action at a distance").

  ### 3.3. Computability and Complexity
  *   **Constraint:** The dynamics of the Simmballs must be computable by the Careenium, or the theory must justify hypercomputation.
  *   **Motivating Case:** If Simmballs perform operations that the Careenium physically cannot simulate (e.g., solving halting problems), the link is broken.
  *   **Requirement:** The mapping from Careenium dynamics to Simmball transitions must respect limits of computational complexity appropriate to the substrate's physical resources.

  ---

  ## 5. Domain IV: Tensions and Joint Unsatisfiability
  *The following pairs of desiderata appear jointly unsatisfiable under standard interpretations. An adequate theory must explicitly choose which to relax or provide a novel resolution. Claiming to satisfy both without qualification is a mark of inadequacy.*

  ### 4.1. The Exclusion Tension
  *   **Pair:** [Causal Closure of the Careenium] + [Genuine Downward Causation by Simmballs].
  *   **Conflict:** If every Careenium event has a sufficient Careenium cause (Closure), there is no "work" left for the Simmball to do (Exclusion). If Simmballs do real work, Careenium closure is violated.
  *   **Resolution Cost:** To keep both, one must adopt "Overdetermination" (both cause the effect independently, which is inefficient/improbable) or "Identity Theory" (Simmball causation *is* Careenium causation described differently).

  ### 4.2. The Realization Tension
  *   **Pair:** [Multiple Realizability of Simmballs] + [Type-Identity of Causal Powers].
  *   **Conflict:** If Simmballs can be realized in vastly different Careenia (plasticity), they cannot be identical to specific Careenium states. If they are not identical to substrate states, their causal powers become "floating" and lack a physical mechanism.
  *   **Resolution Cost:** One must either restrict Multiple Realizability (Simmballs are more substrate-bound than assumed) or accept "Functional Causation" (causation at the level of role, not material, which risks violating physical closure).

  ### 4.3. The Normativity Tension
  *   **Pair:** [Simmballs as Merely Descriptive] + [Logical Normativity has Physical Force].
  *   **Conflict:** If Simmballs are just overlays (Epiphenomenalism), then "logical errors" are just physical irregularities. But we treat logical errors as things to be *corrected* by reasoning (Simmball activity), implying the norm has causal grip.
  *   **Resolution Cost:** Either deny that logic physically corrects the system (it's just physical drift) or grant Simmballs normative causal efficacy (which risks violating naturalism).

  ---

  ## 6. Classification of Demands

  ### 6.1. Non-Negotiable Requirements
  *Failure to meet these renders the theory scientifically or logically incoherent.*
  1.  **Energy Conservation:** Simmballs cannot create energy.
  2.  **Supervenience Base:** Simmball changes must track Careenium changes (unless explicit dualism is claimed, which moves the framework outside naturalistic computation).
  3.  **Descriptive Completeness:** Must account for all four scenarios in Domain I (Triggering, Corruption, Precedence, Stability).
  4.  **Logical Consistency:** Cannot assert A and not-A regarding the causal status of Simmballs within the same context.

  ### 6.2. Camp-Specific Preferences
  *These are metaphysical choices. A theory may choose either side, but must declare its position.*
  1.  **Ontological Status:** Are Simmballs real entities (Realism) or useful fictions (Instrumentalism)?
  2.  **Causal Direction:** Is the primary vector Up (Careenium determines Simmballs), Down (Simmballs steer Careenium), or Reciprocal?
  3.  **Reductionism:** Can Simmball laws be fully reduced to Careenium laws, or are they autonomous?
  4.  **Granularity:** Is causation best explained at the Token (specific event) or Type (general pattern) level?

  ---

  ## 7. Landscape Check: Performance of Standard Approaches
  *Brief indication of how common positions fare against this specification, to assist in adjudicating new views.*

  *   **Substrate Monism (Careenium-Only):**
      *   *Strengths:* Satisfies Energy Conservation and Causal Closure easily. Handles Substrate Corruption and Precedence well.
      *   *Weaknesses:* Struggles with Symbolic Triggering (must explain it away as illusion) and Emergent Stability (must reduce it to physics). Risks failing the Normativity Tension (logic becomes just physics).
      *   *Verdict:* High on Physical Constraints, Low on Causal Accommodation for Downward effects.

  *   **Symbol Autonomy (Simmball-Primacy):**
      *   *Strengths:* Excellent at explaining Symbolic Triggering and Normativity. Preserves the discrete/combinatorial nature of Simmballs.
      *   *Weaknesses:* High risk of violating Energy Conservation and Causal Closure. Struggles to explain Substrate Corruption (why should physics matter to autonomous symbols?).
      *   *Verdict:* High on Conceptual Distinctions for Agency, High risk on Physical Constraints.

  *   **Inter-Level Coupling (Reciprocal/Functionalism):**
      *   *Strengths:* Best fit for Emergent Stability and Multiple Realizability. Attempts to satisfy both Triggering and Corruption.
      *   *Weaknesses:* Most vulnerable to the Exclusion Tension. Must work hardest to explain the *mechanism* of interaction without violating Supervenience.
      *   *Verdict:* Balanced on Causal Accommodation, High burden of proof on Physical Constraints.

  ---

  ## 8. Final Adequacy Test
  A theory is **Adequate** if and only if:
  1.  It satisfies all **Non-Negotiable Requirements**.
  2.  It explicitly resolves or selects a side for the **Tensions and Joint Unsatisfiability** pairs.
  3.  It provides a mechanism for **Domain I Scenarios** that does not contradict **Domain III Constraints**.
  4.  It clearly categorizes its stance on **Camp-Specific Preferences**.

  A theory is **Inadequate** if it claims to satisfy the Exclusion Tension without novel metaphysics, violates Energy Conservation, or fails to explain why Substrate Corruption affects Simmball binding.
