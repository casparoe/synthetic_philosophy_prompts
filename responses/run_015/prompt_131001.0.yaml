answer: |-
  - **The pattern**
  You describe a rhetorical shift where ontological questions about value are bypassed in favor of psychological efficacy. Absurdism establishes the void, subjectivism fills it with feeling, and objectivism is demoted from a truth-claim to a coping mechanism. The core move is evaluating metaphysical theories based on their capacity to alleviate distress rather than their truth conditions. Competing accounts of meaning are flattened into a menu of therapeutic strategies, treating the metaphysical claim "value exists independently" as merely a psychological tool for managing the feeling of pointlessness.

  - **Nearest names**
  The closest established concept is **Psychologism**, historically the reduction of logical or normative laws to psychological processes. In ethics, this overlaps with **Non-Cognitivism**, treating value claims as expressions of attitude rather than truth-apt statements. **Ryle's Category Mistake** also applies, treating a conceptual question as an empirical or psychological one. However, these are broader; none specifically target the existential "cure" framing in popular meaning-of-life discourse. **Pragmatism** is related but typically retains a notion of truth-as-utility rather than dismissing truth-conditions entirely. These terms capture the mechanism but miss the specific existential context.

  - **Proposed term or verdict**
  There is no canonical label for this specific rhetorical slide. I propose **Therapeutic Reductionism**. Definition: The error of evaluating metaphysical claims about value exclusively by their psychological utility in managing existential distress. It differs from classical Pragmatism because it bypasses truth-conditions entirely. It treats objective value theories not as competing descriptions of reality, but as competing tools for emotional regulation, thereby dissolving the metaphysical dispute into a menu of coping strategies. This term captures the specific move of reframing axiology as mental hygiene.

  - **Boundaries**
  This is not legitimate **Philosophy as a Way of Life** (e.g., Hadot), which practices truths to transform the self, nor valid **Interdisciplinary Inquiry** where psychology informs philosophical constraints. It is distinct from ordinary sloppiness because it systematically reframes ontology as therapy. It is not merely asking "what helps?" but asserting "only what helps matters," thereby denying the possibility of mind-independent value claims. It also differs from genuine existentialism, which often demands confronting absurdity rather than curing it.

  - **Settled vs contested**
  There is broad consensus in analytic axiology that subjective fulfillment and objective worth are conceptually distinct (e.g., Wolf, Metz). However, it is heavily contested whether objective value actually exists (Realism vs. Error Theory) and whether the question itself is coherent (Wittgensteinians). It is also contested whether philosophy's primary aim should be therapeutic (Pierre Hadot vs. theoretical realists). The reduction itself is generally rejected in academic literature but remains common in popular discourse.
