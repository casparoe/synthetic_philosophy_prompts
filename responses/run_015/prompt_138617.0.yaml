answer: |-
  Here is the audit. I have broken this down into the brainstorming phase, the ranking of tensions, the structural diagnosis, and the final recommendation for the handbook.

  ### Phase 1: Brainstorming Candidate Frictions
  Before settling on the critical failures, here are eight points where your framework generates heat:

  1.  **The Articulation Paradox (2 vs. 6):** You claim the knowledge is tacit/inarticulable (2), but also that rules must be justifiable to those bound by them (6). If the knowledge *cannot* be articulated, it *cannot* meet the legitimacy bar.
  2.  **The Bayesian Mismatch (3 vs. 5):** You describe the prior evidence from persistence as "modest" and "weak" (3), but the procedural burden as heavily asymmetric (5). A weak prior does not mathematically support a strong presumption against change without an additional variable (like catastrophic risk).
  3.  **The Junk vs. Wisdom Conflict (2 vs. 4):** You argue practices carry epistemic weight because they survived (2), but also admit most institutional furniture is path-dependent junk/lock-in (4). If the signal-to-noise ratio of "stuff that stuck" is low, the epistemic weight collapses.
  4.  **The Cut Problem (Individuation):** As you noted, whether something is a "fence" or "trimming" depends on how you describe the action. This makes the rule manipulatable by framing.
  5.  **Fence Laundering (Accidental Fences):** If a rationale is required to keep a rule (1), but the real reason is unknown (2), agents will invent plausible fake rationales. This calcifies accidents into "tradition."
  6.  **Environmental Drift (3 vs. 4):** If environments shift faster than filters operate (4), then historical persistence (3) is not evidence of current function, but evidence of *past* function. The Bayesian prior decays rapidly.
  7.  **Reversibility vs. Default (7 vs. 1):** If a change is easily reversible (7), the cost of being wrong is low. If the cost of being wrong is low, the default presumption to keep the fence (1) loses its force.
  8.  **Elite vs. Democratic Epistemology:** Point 2 implies a "priesthood" that understands the tacit knowledge, while Point 6 implies a democratic standard of acceptance. Who decides if the tacit knowledge is real?

  ### Phase 2: The Audit of Tensions
  Here are the tensions ranked by severity. I have distinguished between logical contradictions (fatal) and operational friction (manageable).

  #### 1. CRITICAL: The Articulation Paradox (Points 2 & 6)
  *   **The Tension:** You cannot simultaneously hold that the *reason* for the rule is inarticulable tacit knowledge (2) and that the rule must be justifiable to subordinates in terms they can accept (6). If the knowledge is truly tacit, you fail the legitimacy test. If you can justify it, it wasn't truly tacit.
  *   **What Gives:** You must abandon the strong version of (2). You cannot claim the knowledge *cannot* be articulated; you must claim it is *costly* or *difficult* to articulate, or that the *risks* are easier to articulate than the benefits.
  *   **The Cost:** You lose the mystical Burkean shield. You can no longer say "Trust the tradition." You must say "We haven't mapped the dependencies yet."

  #### 2. CRITICAL: The Bayesian Mismatch (Points 3 & 5)
  *   **The Tension:** A "modest prior bump" (3) does not justify a "show me evidence" asymmetry (5). In decision theory, a weak prior only demands a weak counter-evidence threshold. To justify a strong asymmetry, you need **convexity of harm** (the downside of breaking it is vastly worse than the upside of fixing it), not just epistemic humility.
  *   **What Gives:** Point 3 needs to be demoted. The justification for the asymmetry isn't that the old rule is likely *right*; it's that the system is *fragile*.
  *   **The Cost:** You stop arguing that old rules are probably wise. You start arguing that complex systems are probably fragile.

  #### 3. HIGH: The Cut Problem (Implementation of Point 1)
  *   **The Tension:** This is the "Reference Class Problem." If I want to remove a rule, I describe it narrowly ("I'm just changing the font on the form"). If I want to keep it, I describe it broadly ("This is part of our compliance architecture"). The principle provides no anchor for individuation.
  *   **What Gives:** The definition of "The Fence." You need a heuristic for what counts as a unit of change.
  *   **The Cost:** You need to add a meta-rule about granularity, likely tied to *coupling* rather than *semantic description*.

  #### 4. MODERATE: Junk vs. Wisdom (Points 2 & 4)
  *   **The Tension:** If (4) is true (most stuff is lock-in/junk), then (2) (inherited practice has epistemic weight) is statistically weak.
  *   **Dissolution:** This dissolves if you treat (2) not as a claim about *truth*, but a claim about *complexity*. Even a junk rule might be holding together a brittle workaround elsewhere. It's not that the rule is wise; it's that the *system's reaction* to removing it is unpredictable.
  *   **Verdict:** Survivable if reframed as risk management, not epistemology.

  #### 5. FALSE TENSION: Reversibility vs. Default (Points 7 & 1)
  *   **Analysis:** These look tense but are actually allies. Point 1 says "Don't remove unless you know why." Point 7 says "If you do remove, make it reversible."
  *   **Dissolution:** Reversibility is the *escape hatch* for Point 1. If a change is truly reversible (low cost to undo), the burden of proof in Point 1 should lower. They are not in tension; they are a sliding scale. High reversibility = Low burden of proof. Low reversibility = High burden of proof.

  ### Phase 3: Structural Diagnosis

  **Redundant Commitments:**
  **Points 1 and 5 are the same commitment.** Point 1 is the philosophical statement ("Default is keep"); Point 5 is the procedural instantiation ("Asymmetric burdens"). You do not need both. Keep 5, drop 1 as a standalone principle.

  **The Commitment Doing the Least Work:**
  **Point 3 (Bayesian Persistence).** This is doing almost no work. You admit the filter is noisy (4) and the evidence is weak (3). If the evidence is weak, why are we relying on it? The heavy lifting is actually being done by **Risk Asymmetry** (the cost of breaking is higher than the cost of waiting), not by the probability that the fence is good. You are smuggling a Precautionary Principle in under the guise of Bayesian updating.

  **The Single Revision:**
  Replace the **Time Axis** (Old vs. New) with an **Opacity Axis** (Understood vs. Unmapped).
  Your current framework protects things because they are *old*. It should protect things because they are *coupled*. Age is a proxy for coupling, but a bad one. The revision is: *"Do not remove a constraint until you have mapped its downstream dependencies."*

  ### Phase 4: The Honest Version (Handbook Advice)

  You asked if the Fence is a special case of some other principle. It is. **Chesterton's Fence is a special case of the Precautionary Principle applied to Complex Adaptive Systems.**

  The axis is not **New vs. Existing**. The axis is **Mapped vs. Unmapped Dependencies**.

  A new rule can be a "fence" if it creates a dependency others rely on before they know it. An old rule is not a "fence" if it is decoupled and its removal is reversible. Your current draft conflates age with stability.

  **What the Handbook Should Actually Say:**

  Do not write a handbook about "Respecting Tradition." Write a handbook about **"Mapping Coupling Before Cutting."**

  Here is the revised core logic for your document:

  1.  **The Principle of Mapped Dependencies:** We do not preserve rules because they are old; we preserve them because their removal risks cascading failure in systems we haven't mapped.
  2.  **The Burden of Proof:** The burden is not on the *changer* to prove the rule is useless. The burden is on the *changer* to prove they understand the *consequences of removal*. (This solves the Legitimacy problem: you don't need to justify the rule's origin, you need to justify your model of its removal).
  3.  **The Reversibility Clause:** If a change is fully reversible (can be rolled back within X time with Y cost), the burden of proof drops. If it is irreversible, the burden approaches certainty.
  4.  **Anti-Laundering:** We do not accept "historical rationale" as evidence of function. We accept "current dependency mapping." If you cannot find what breaks when this is removed, you cannot remove it, regardless of whether you think it's junk.

  **Why this fixes your frictions:**
  *   **Fixes Legitimacy (6):** You aren't asking people to accept "secret wisdom." You are asking them to accept "we haven't finished the safety inspection."
  *   **Fixes Bayesian Mismatch (3/5):** It's no longer about the probability the rule is good. It's about the variance of the outcome.
  *   **Fixes Cut Problem:** You aren't cutting "rules"; you are cutting "dependencies." A dependency is technically individuated (System A calls System B).
  *   **Fixes Junk (4):** It acknowledges the rule might be junk, but asserts the *connection* might be real.

  **Final Verdict:**
  Your current draft tries to be a political philosophy (Conservatism) when it needs to be an engineering safety protocol (Reliability). Shift the language from "Wisdom of Ancestors" to "Risk of Unmapped Coupling." Keep the Chesterton metaphor—it's vivid—but change the justification from *epistemic* (they knew something we don't) to *structural* (the system is tighter than it looks).
