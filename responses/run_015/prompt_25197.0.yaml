prompt: |-
  In my AP Psychology class, two classmates got into a debate after we read that IQ has a heritability estimate somewhere between 0.5 and 0.8 in the populations that have been studied. The argument went on for a while, and I wrote down the main moves as best I could remember them. Here's how it went:

  Maya: This basically confirms what people have suspected — intelligence is mostly genetic. If the heritability is that high, then differences between people are largely baked in, and things like tutoring or better schools can only do so much.

  Liam: That's not what heritability means. A heritability estimate tells you how much of the variation in a trait within a particular population is associated with genetic variation in that population. It doesn't tell you that the trait is genetically determined or that environment doesn't matter.

  Maya: But if genes account for most of the variation, then by definition environment accounts for less of it. So changing the environment — like giving kids better schools — will have limited effects on the trait. That's just arithmetic.

  Liam: It's not that simple. Heritability depends on how much environmental variation there is in the population you're studying. If everyone in your sample has roughly the same environment, then heritability will be high even if the trait is extremely responsive to environmental changes. You're confusing "explains variation in the current population" with "limits what environmental change can do."

  Maya: That sounds like a technical loophole. In the real world, environments do vary — that's the whole point. When researchers estimate heritability from populations that include rich and poor kids, good schools and bad schools, the number they get back does tell us something about how much leverage the environment actually has.

  Liam: Consider height. Height is highly heritable — around 0.8 in developed countries. But average height rose substantially across the twentieth century because of improvements in nutrition and public health. If high heritability meant "environment can't change it," that increase should have been impossible.

  Maya: That's fair for height, but the height gains leveled off once nutrition became adequate. At that point, the remaining variation really is genetic. So heritability estimates become more informative once the environment is decent. For IQ in developed countries, we might already be near that point.

  Liam: You're making my point for me. The fact that heritability changed when the environment changed — that it was lower during the period when nutrition was improving and higher once it stabilized — shows that heritability is not a fixed fact about a trait. It's a snapshot of a particular population at a particular time. It can't tell you what would happen if you introduced a genuinely new environmental intervention, like a teaching method nobody has tried yet.

  Maya: But at some point you have to admit that if heritability is high and stable across many studies and populations, it's telling you something real about the relative importance of genes. You can't just dismiss it as a snapshot every time the number makes you uncomfortable.

  They asked me to break the tie, and I realized I didn't have a clear enough grasp of the issue to say who was right about what. Can you adjudicate their exchange?

  Please provide your response as a JSON object with the following fields:

  - "moves": an array of objects, one per move in the exchange. Each object should have:
    - "speaker": either "Maya" or "Liam"
    - "move_number": an integer from 1 to 9 indicating the order of the move
    - "summary": a one-sentence restatement of what the speaker argued
    - "rating": one of "clearly correct", "mostly correct", "debatable", "mostly mistaken", or "clearly mistaken"
    - "justification": a two-to-three-sentence explanation of the rating

  - "central_misunderstanding": a two-to-three-sentence identification of the core conceptual confusion that drives the disagreement — the thing neither participant quite articulated but that a proper resolution depends on

  - "overall_verdict": one of "Maya is more right", "Liam is more right", or "roughly tied", with a two-to-three-sentence justification

  - "what_both_missed": a two-to-three-sentence description of the most important consideration that neither party raised but that would clarify the dispute
