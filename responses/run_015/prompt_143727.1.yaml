          *   Add Hart's "Rule of Recognition" as a separate gate (authority vs. morality).
          *   Structure: Ordered procedure with clear stop points (Reject, Flag/Board, Conflict).
          *   Application: Apply to two specific proposals (Retro-active risk-score update, Human-unreadable algorithmic rule).
