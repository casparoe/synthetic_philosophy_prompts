answer: |-
  **INTERNAL MEMO: AUTOMATED ELIGIBILITY RULE REVIEW PROTOCOL**
  **TO:** Policy Analysis Team
  **FROM:** Senior Policy Analyst
  **SUBJECT:** Procedural Legality & Authority Checklist (Hart-Fuller Framework)
  **DATE:** October 26, 2023

  **Note:** Per our recent discussions, this protocol operationalizes the Hart-Fuller debate for automated welfare systems. It distinguishes between *authority* (Hart) and *procedural legality* (Fuller). Note: Standard spelling is "promulgation" (used below), but we know what we mean.

  ---

  ### PHASE 1: THE HART GATE (Rule of Recognition)
  **Purpose:** Determine if the system has valid *authority* regardless of moral content.
  **Question:** *Does this automated rule derive from a valid source of power within our jurisdiction?*

  1.  **Statutory Delegation:** Is there specific legislation authorizing the use of algorithmic decision-making for this benefit class?
  2.  **Chain of Command:** Was the rule issued by an official/department with the jurisdiction to do so?
  3.  **System Integrity:** Is the code deployed in the official production environment, or is it a sandbox/test script?

  *   **STOP POINT 1:** If **NO** to any above → **REJECT**. (Lacks legal authority. Do not proceed.)
  *   **IF YES** → Proceed to Phase 2.

  ---

  ### PHASE 2: FULLER'S 8 PRINCIPLES (Automated Legality Test)
  **Purpose:** Determine if the rule functions as "law" or merely as force. Fuller argues that if a rule fails these, it is not just bad law, it is *not law*.
  **Instruction:** Apply these tests to the *code logic* and the *user interface*, not just the policy text.

  | Principle | Traditional Legal Standard | **Automated System Test** | Pass/Fail |
  | :--- | :--- | :--- | :--- |
  | **1. Generality** | Rules apply to classes, not individuals. | **Class Logic:** Does the model apply weights uniformly to a class of applicants, or does it contain hard-coded exceptions for specific IDs/cases? | |
  | **2. Promulgation** | Rules must be published and known. | **Code Transparency:** Is the logic accessible? (e.g., Public repo, plain-language summary of weights). If the rule is buried in compiled code with no public documentation, it fails. | |
  | **3. Non-Retroactivity** | Rules apply to future conduct. | **Model Versioning:** Does retraining the model or updating parameters change eligibility determinations for *past* periods? (Look for look-back data usage). | |
  | **4. Clarity** | Rules must be understandable. | **Explainability:** Can a caseworker explain *why* the system denied eligibility to an applicant in plain language? (If it's a "black box" neural net, it fails). | |
  | **5. Non-Contradiction** | Rules cannot contradict each other. | **Logic Conflicts:** Do multiple micro-services or models produce conflicting eligibility flags for the same input data? | |
  | **6. Possibility of Compliance** | People must be able to follow the rule. | **Input Control:** Are the variables required to qualify within the applicant's control? (e.g., Cannot penalize for data the applicant cannot access or fix). | |
  | **7. Constancy** | Rules cannot change too frequently. | **Retrain Frequency:** Does the model retrain daily/hourly? If the "law" changes between Application and Adjudication without notice, it fails. | |
  | **8. Congruence** | Official action must match declared rule. | **Code vs. Text:** Does the actual code logic match the written policy regulation? (Audit for drift between policy doc and Python/SQL script). | |

  *   **STOP POINT 2:** If **FAIL** on Principles 2 (Promulgation), 3 (Retroactivity), 4 (Clarity), or 8 (Congruence) → **REJECT**. (These are fatal to the rule's status as "law".)
  *   **STOP POINT 3:** If **FAIL** on Principles 1, 5, 6, or 7 → **FLAG FOR BOARD**. (Procedurally weak, but may be salvageable or require policy waiver.)
  *   **IF PASS** → Proceed to Phase 3.

  ---

  ### PHASE 3: THE CONFLICT MATRIX (Decision Logic)
  **Purpose:** Resolve tensions between Authority (Hart) and Legality (Fuller), and identify "Valid but Unjust" rules.

  | Scenario | Hart (Authority) | Fuller (Procedure) | Ethical/Outcome Impact | **ACTION** |
  | :--- | :--- | :--- | :--- | :--- |
  | **A. The Void** | FAIL | N/A | N/A | **REJECT** (No Authority) |
  | **B. The Chaos** | PASS | FAIL (Principles 2, 3, 4, 8) | N/A | **REJECT** (Not functional law; unenforceable) |
  | **C. The Hard Case** | PASS | PASS | **HIGH NEGATIVE** (Unjust outcomes) | **FLAG FOR BOARD** (Valid law, bad policy. Board must decide on morality.) |
  | **D. The Ideal** | PASS | PASS | NEUTRAL/POSITIVE | **APPROVE** |

  ---

  ### APPLICATION TO CURRENT PROPOSALS

  #### Proposal 1: Retro-Active Risk-Score Update
  *Description:* Updating the risk-model parameters and applying the new score to past cases to recover "overpayments."

  *   **Hart Gate:** **PASS.** (We have statutory authority to manage payments.)
  *   **Fuller Test:**
      *   *Principle 3 (Non-Retroactivity):* **FAIL.** Applying new logic to past conduct violates the core tenet that law guides future behavior.
      *   *Principle 6 (Compliance):* **FAIL.** Applicants could not have complied with a rule that did not exist at the time.
  *   **Decision Matrix:** Scenario B (The Chaos).
  *   **Final Verdict:** **REJECT.**
      *   *Analyst Note:* Even if we have the authority (Hart), this fails Fuller's inner morality of law. It is not a valid rule; it is an exercise of force. Do not deploy.

  #### Proposal 2: The "Black Box" Rule
  *Description:* A complex neural network published by linking to a GitHub repository containing raw code, with no plain-language documentation.

  *   **Hart Gate:** **PASS.** (Authority to set eligibility criteria exists.)
  *   **Fuller Test:**
      *   *Principle 2 (Promulgation):* **FAIL.** Burying rules in raw code is not promulgation for the public.
      *   *Principle 4 (Clarity):* **FAIL.** Applicants and caseworkers cannot understand the reasoning (Explainability gap).
      *   *Principle 8 (Congruence):* **UNVERIFIABLE.** Without plain language policy, we cannot audit if code matches intent.
  *   **Decision Matrix:** Scenario B (The Chaos).
  *   **Final Verdict:** **REJECT.**
      *   *Analyst Note:* A rule hidden in code is no rule at all. To pass, this requires a "Plain Language Layer" documentation and an explainable AI interface before it can be considered law.

  ---

  ### SUMMARY FOR TOMORROW'S REVIEW
  1.  **Authority is not enough.** Just because we *can* build it (Hart) doesn't mean it functions as law (Fuller).
  2.  **Code is Law.** If the logic is in the software, the software must meet the 8 principles.
  3.  **Stop Points:**
      *   No Authority? **Kill it.**
      *   Retroactive/Hidden/Incomprehensible? **Kill it.**
      *   Legal + Procedural but Cruel? **Send to Board.** (This is where "Bad Law is Still Law" applies—we flag it, but we don't enforce it until they sign off).

  *End of Protocol.*
