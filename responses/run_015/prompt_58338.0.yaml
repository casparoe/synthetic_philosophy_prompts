      *   *Craft Decision:* Avoid the "Great Man" or "Single Accident" theory of history. Focus on the *conditions of possibility*.
      *   *Advice:* Shift focus from the *trigger* to the *tinder*. Why was the granary vulnerable? This satisfies the historical novel genre's demand for social context.

