  1.  **Analyze the Request:**
      *   **Context:** Graduate workshop on comparative political development.
      *   **Problem:** Recurring stall in discussions of American exceptionalism.
      *   **Observation:** Participants agree on the *record* (no feudalism, no socialist labor party, high immigration) but stall on *interpretation*.
      *   **Three Camps:**
          1.  *Causal Divergence:* Exceptionalism is a falsifiable historical thesis about causal divergence from Europe.
          2.  *Ideological Performative:* Exceptionalism is a normative/ideological claim asserting uniqueness as exemption.
          3.  *Counterfactual Anchor:* Exceptionalism is a claim about modal historical possibility (uniquely non-deterministic path given structural conditions).
      *   **Task:** Diagnose the *kind* of disagreement (verbal, substantive, bedrock intuition, etc.), engage concretely with the positions, identify hidden questions, specify what move would count as progress (or argue none is possible), and provide a one-sentence summary in a specific format.
      *   **Constraint:** Do not give a verdict on which camp is correct.

  2.  **Deconstruct the Three Positions:**
      *   *Camp 1 (Causal/Historical):* Treats "exceptionalism" as an empirical hypothesis. $H_0$: US followed same causal logic as Europe. $H_1$: US followed different causal logic. Evidence needed: Comparative historical analysis, process tracing. Goal: Explanation of variance.
      *   *Camp 2 (Normative/Ideological):* Treats "exceptionalism" as a speech act or political myth. It's not about *what happened*, but *what is claimed* to justify policy/identity. Evidence needed: Discourse analysis, genealogy of the concept. Goal: Critique of power/legitimacy.
      *   *Camp 3 (Modal/Counterfactual):* Treats "exceptionalism" as a claim about probability space. It's not just that $Outcome_{US} \neq Outcome_{EU}$, but that $P(Outcome_{US} | Conditions) \ll P(Outcome_{EU} | Conditions)$ usually, but in the US case, the path was contingent. It challenges structural determinism. Evidence needed: Counterfactual reasoning, formal models of path dependence. Goal: Theoretical specification of contingency vs. structure.

  3.  **Diagnose the Disagreement:**
      *   *Is it merely verbal?* No. While they use the same word, they aren't just defining terms differently; they are operating in different *registers of inquiry* (ontology/epistemology). Camp 1 is positivist-empirical. Camp 2 is critical-constructivist. Camp 3 is analytical-philosophical/formal.
      *   *Is it substantive?* Yes, but not about the *facts* (which are agreed upon). It's about the *ontology of historical explanation*.
      *   *Hidden Substantive Disagreement:* It lies in the criteria for *causal inference* and the *purpose of theory*.
          *   Camp 1 asks: "Did X cause Y differently here?"
          *   Camp 2 asks: "What work does the claim 'X is unique' do for actors?"
          *   Camp 3 asks: "Was Y inevitable given X?"
      *   *The Core Impasse:* The "Evidence" mismatch. Camp 1 wants archival/comparative data. Camp 2 wants textual/rhetorical data. Camp 3 wants logical/modal coherence. They talk past each other because "confirming the thesis" means three mutually exclusive things.
      *   *Bedrock Intuitions:* There is a clash between *explanation* (Camp 1 & 3) and *critique* (Camp 2), and between *determinism* (implied in Camp 1's search for causal laws) and *contingency* (Camp 3).

  4.  **Determine the Path to Progress:**
