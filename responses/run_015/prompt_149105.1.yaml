      *   Can a conceptual distinction solve this? Yes. The term "Exceptionalism" is doing too much work. It conflates *outcome distinctiveness*, *causal distinctiveness*, and *rhetorical distinctiveness*.
      *   *Recommended Move:* A meta-theoretical reframing. The workshop needs to distinguish between "Exceptionalism as Object of Study" (Camp 2's focus) vs. "Exceptionalism as Explanatory Framework" (Camp 1 & 3's focus). Furthermore, Camp 1 and 3 need to distinguish between "Outcome Exceptionalism" (agreed fact) and "Process Exceptionalism" (the actual debate).
      *   *Is progress possible?* Yes, but only by dissolving the single question "Is American Exceptionalism true?" into three separate research programs. If they try to answer the *same* question, no progress is possible because the question is category-error ridden.

