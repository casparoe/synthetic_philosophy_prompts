  *   **Case (b) is the outlier:** A purely forward-looking judge would struggle to justify a "substantial custodial sentence" for a pharmaceutical executive who caused deaths through negligence but is unlikely to reoffend (especially if retired or disgraced). Incapacitation is unnecessary; specific deterrence is unnecessary. Only *general deterrence* (making an example of him) remains. However, her reasoning cites the "gravity of the harm" and "position of responsibility." This is language of **moral blame**, not social utility. She is punishing the *breach of trust*, not just managing risk.
  *   **Case (e) is problematic:** A purely forward-looking judge might sentence the battered woman based on her risk of future violence. If she remained in an abusive environment, she might be risky. The judge sentenced her based on the *coercive context* reducing her moral blame, not just her risk profile.

  **Why the Desert Principle Prevails:**
  *   **Culpability is the Anchor:** In every case, the sentence correlates with the judge's assessment of the defendant's *moral blameworthiness* at the time of the act.
      *   **High Blame:** Pharma Exec (breach of trust), Career Burglar (persistence + no remorse).
      *   **Mitigated Blame:** Addict (compromised will), Psychotic (lack of capacity), Battered Woman (coercion).
  *   **Accommodating Case (a):** A strict "eye-for-an-eye" retributivist might jail the addict. However, a sophisticated Desert theorist argues that addiction compromises *rational agency*, thereby reducing the *desert* owed. Thus, probation fits a Desert model that accounts for diminished capacity, just as Case (c) does for psychosis.

  **Conclusion:** The judge uses **Desert to set the bounds** of punishment (how much is *owed*), and **Utility to determine the form** (prison vs. treatment). But because Desert dictates *whether* and *how much* punishment is justified in Cases (b) and (e) where Utility is ambiguous, **Desert is the dominant principle.**

  ### 2. Prediction for the Target Case

  **The Case:** A 50-year-old man, crime-free for 30 years, charged via DNA for an armed robbery committed at 19.

  **The Prediction:** The judge would impose a **non-custodial sentence (e.g., Probation or Time Served)**, but she would **not dismiss the charges.**

  **Reasoning:**
  If she were purely Forward-Looking, she might dismiss the case entirely. Incapacitation is unnecessary (he is not dangerous); rehabilitation is unnecessary (he is reformed); specific deterrence is unnecessary. Punishing him serves no social good and disrupts a productive life.

  However, because her pattern supports the **Desert Principle**, she views punishment as a moral debt owed for the wrong committed. Dismissal would imply the act was morally neutral, which contradicts her reasoning in Case (b) (gravity of harm).

  **Why Probation instead of Prison?**
  Her Desert principle is *nuanced*. It assesses the culpability of the *actor*, not just the *act*.
  *   **Mitigation of Character:** In Case (d), the burglar received a lengthy sentence partly due to "no remorse" and a history of crime. Conversely, this defendant has 30 years of pro-social behavior. In a character-based Desert theory, the man who stands in the dock is not the same moral agent as the teenager who committed the robbery. The 30 years of law-abiding life "pay down" a portion of the moral debt.
  *   **Mitigation of Capacity:** In Case (a) and (c), she leniently sentenced those with compromised capacity (addiction, psychosis). While 19 is legally adult, neuroscience and her own precedent regarding youth (Case a) suggest she views young adult impulse control as diminished compared to mature agency.
  *   **Utility Constraint:** Consistent with Case (a), she recognizes that incarceration for a non-dangerous, employed father is "counterproductive."

  **Verdict:** She satisfies the **Desert** requirement (a conviction and sanction are imposed, acknowledging the wrong) but satisfies the **Utility** constraint (no prison, preserving his reformed life).

  ### 3. The Separator Case

  To cleanly separate the **Desert Principle** from the **Forward-Looking Principle**, you need a case where *Moral Blame* and *Future Danger* point in opposite directions.

  **The Hypothetical Case: "The Dangerous Minor Offender"**

  > **Facts:** A 40-year-old man is convicted of a minor, non-violent financial fraud (low harm). He has no prior record and expresses genuine remorse. However, a court-appointed psychological evaluation reveals he has a rare, untreatable neurological condition that creates a 90% statistical probability he will commit violent assaults within the next two years. He is currently calm and poses no immediate threat, but the future risk is medically certain.

  **The Divergence:**

  *   **Forward-Looking Prediction:** **Substantial Custodial Sentence.**
      *   *Reasoning:* The primary goal is public safety (Incapacitation). Since the future violence is medically predictable and severe, the state must detain him to prevent harm, regardless of the minor nature of the current conviction.
  *   **Desert Prediction:** **Probation or Minimal Sentence.**
      *   *Reasoning:* Punishment must be proportional to the *blameworthy act committed*, not the acts one *might* commit. He deserves punishment for the fraud, not for the neurological condition. To imprison him for future violence he hasn't committed violates the principle that punishment is for *past wrongs*.

  **Why this separates them:**
  In the five memoir cases, Danger and Blame mostly moved in tandem (the burglar was dangerous *and* blameworthy; the addict was low risk *and* less blameworthy). This hypothetical forces them apart. If the judge incarcerates based on the medical prediction, she is a Forward-Looking Utilitarian. If she refuses to incarcerate beyond the proportion of the fraud, she is a Retributivist.

  ***

  ### Summary for your analysis:
  1.  **Dominant Principle:** **Desert/Culpability.** (Case (b) is the key evidence; Utilitarianism cannot easily justify jailing a low-risk executive).
  2.  **Target Case Outcome:** **Probation.** (Acknowledges the debt of Desert, but mitigates it via reformed character and Utility).
  3.  **Separator Case:** **The Dangerous Minor Offender.** (Tests whether she punishes for *Risk* or for *Wrong*).
