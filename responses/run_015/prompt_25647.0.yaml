prompt: |-
  I'm a CS major taking a philosophy of mind class and we just went over the Searle/Dennett thing about original vs. derived intentionality. So Searle says our thoughts have "original" intentionality — they're about things intrinsically — but a computer or a book only has "derived" intentionality cause we're the ones assigning meaning to the symbols. Dennett's response (at least the version we read) is that this distinction doesn't really hold — he's got this "two-bitser" vending machine example where he tries to show that what we call original intentionality is just a matter of which stance we take toward a system, and that evolution "derives" our intentionality the same way we derive a computer's, so there's no principled line.

  I keep thinking I can map this onto programming concepts I actually use — like, is original intentionality like a variable that holds its own value vs. derived being like a pointer that only means something when you dereference it through an interpreter? Or is it like the difference between a function that natively computes a result vs. a string you have to eval? Or something about intrinsic vs. extrinsic semantics in a type system? But I can't tell if I'm actually translating the argument or just pattern-matching.

  Can you restate the whole debate — Searle's claim and Dennett's reply — in CS vocabulary (types, values, references, pointers, interpretation, compilation, source vs. object code, semantic content, whatever fits) as faithfully as possible? And then the residue report: what maps cleanly, what you had to stretch, and what in the philosophers' argument just has no counterpart in how we think about programs. I especially want to know if my pointer-vs-value intuition is doing real work or if it's just a metaphor that breaks under pressure.
