  # Diagnostic Decision Tree: The Geography of Freedom

  **Base Case:** Taylor wants to travel from home to the market. Taylor has the physical ability to walk. The following scenarios modify the conditions of this journey. Answer each question based on your intuition about whether Taylor is **unfree** to travel.

  ### Node 1: The Internal Obstacle
  **Case:** Taylor wants to travel, but Taylor is also addicted to a substance that makes leaving the house physically painful. No one stops Taylor; the pain comes from Taylor's own body and cravings.
  **Question:** Is Taylor **unfree** to travel to the market?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  ### Node 2: The Source of Authority (Positive Branch)
  **Case:** A law forbids travel. Taylor voted for this law, campaigned for it, and genuinely believes it is morally right.
  **Question:** Is Taylor **unfree** to travel to the market?
  *   **Yes:** Go to Node 7.
  *   **No:** Go to Node 8.

  ### Node 3: The Natural Obstacle (External Branch)
  **Case:** The bridge to the market has collapsed due to a storm. No person locked it or broke it; it is simply impassable due to nature.
  **Question:** Is Taylor **unfree** to travel to the market?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 4.

  ### Node 4: The Sleeping Guard
  **Case:** A gate blocks the path. It is locked. A guard holds the key but is asleep in a distant tower and never wakes up. Taylor turns back.
  **Question:** Is Taylor **unfree** to travel to the market?
  *   **Yes:** Go to Node 5.
  *   **No:** **Leaf A** (Stop).

  ### Node 5: The Kind Superior
  **Case:** Taylor's employer *could* fire Taylor for traveling (blocking the path economically) but promises not to, asks Taylor's preference, and reliably accommodates Taylor's schedule.
  **Question:** Is Taylor **unfree** to travel to the market?
  *   **Yes:** Go to Node 7.
  *   **No:** **Leaf B** (Stop).

  ### Node 6: The Structural Condition
  **Case:** Taylor is too poor to pay the toll on the bridge. The toll was set by a past government Taylor cannot change. No specific person is stopping Taylor, but the cost is prohibitive.
  **Question:** Is Taylor **unfree** to travel to the market?
  *   **Yes:** **Leaf C** (Stop).
  *   **No:** **Leaf A** (Stop).

  ### Node 7: The Dependent Favor
  **Case:** Taylor travels only because a benefactor *allows* it. The benefactor is not arbitrary (they are legally bound to allow it), but Taylor cannot travel without their permission.
  **Question:** Is Taylor **unfree** to travel to the market?
  *   **Yes:** **Leaf D** (Stop).
  *   **No:** **Leaf E** (Stop).

  ### Node 8: The Authentic Desire
  **Case:** Taylor wants to stay home because of a subliminal advertisement that manipulated Taylor's desires. Taylor feels happy staying home.
  **Question:** Is Taylor **unfree** to travel to the market (by being manipulated)?
  *   **Yes:** **Leaf F** (Stop).
  *   **No:** **Leaf G** (Stop).

  *(Note: Node 6 and Node 8 serve as terminal differentiators for specific branches to ensure 8 nodes are utilized in the logical space, even if not all paths traverse all 8.)*

  ***

  ## 2. Logical Space Cuts

  The nodes above slice the conceptual space of liberty along the following dimensions, without naming the theories:

  1.  **Internal vs. External Constraint (Node 1):** Determines whether unfreedom can originate within the agent's own psychology/physiology (addiction) or must come from outside.
  2.  **Volition vs. Objective Constraint (Node 2):** Determines whether the agent's endorsement or consent negates the status of being constrained (endorsed law).
  3.  **Agency vs. Structure (Node 3 & 6):** Determines whether unfreedom requires a human agent (guard, employer) or if structural conditions (storms, poverty/infrastructure) suffice.
  4.  **Act vs. Power (Node 4):** Determines whether the actual exercise of interference is required, or if the mere standing power to interfere (locked gate/sleeping guard) counts.
  5.  **Arbitrariness vs. Power (Node 5):** Determines whether the *quality* of the power matters (is it arbitrary/willful?) or if the existence of dependence on another's will is sufficient.
  6.  **Dependence vs. Domination (Node 7):** Refines the previous cut; distinguishes between being subject to another's will *even if non-arbitrary* (dependence) versus only when that will is arbitrary (domination).
  7.  **Empirical vs. Authentic Self (Node 8):** Distinguishes between satisfying current desires (empirical) versus satisfying desires one would have under rational/non-manipulated conditions (authentic).

  ***

  ## 3. Mapping Leaves to Conceptions

  | Leaf | Path Summary (Intuitions) | Conventional Label |
  | :--- | :--- | :--- |
  | **Leaf A** | Internal=No; Structure=No; Power=No. (Only actual human interference counts). | **Negative Liberty (Strict/Interference-based)** <br>*(e.g., Hobbes, early Berlin)* |
  | **Leaf B** | Internal=No; Structure=No; Power=Yes; Arbitrariness=No. (Power counts, but only if arbitrary). | **Republican Liberty (Non-Domination)** <br>*(e.g., Pettit, Skinner)* |
  | **Leaf C** | Internal=No; Structure=Yes. (Poverty/Infrastructure counts as unfreedom). | **Social/Structural Liberty** <br>*(e.g., Cohen, MacCallum)* |
  | **Leaf D** | Internal=No; Structure=No; Power=Yes; Arbitrariness=No; Dependence=Yes. (Dependence itself counts). | **Freedom as Non-Dependence** <br>*(e.g., Radical Republicanism/Some Neo-Roman)* |
  | **Leaf E** | Internal=No; Structure=No; Power=Yes; Arbitrariness=No; Dependence=No. (Power counts, but non-arbitrary dependence is fine). | **Republican Liberty (Non-Domination)** <br>*(Duplicate of Leaf B via different path)* |
  | **Leaf F** | Internal=Yes; Endorsement=No; Authenticity=Yes. (Manipulated desires count as unfreedom). | **Positive Liberty (Self-Mastery/Authenticity)** <br>*(e.g., Taylor, Dworkin)* |
  | **Leaf G** | Internal=Yes; Endorsement=No; Authenticity=No. (Internal constraints count, but only as obstacles, not unfreedom). | **Positive Liberty (Opportunity-based)** <br>*(e.g., Green, Bosanquet)* |

  ***

  ## 4. Unoccupied Cells

  The logical space defined by the cuts (Internal, Structural, Power, Arbitrariness, Dependence, Authenticity) contains $2^6 = 64$ theoretical cells. Most are unoccupied.

  *   **Incoherent Cells:**
      *   *Internal Yes / External No:* A theory that claims addiction makes you unfree, but a locked door does not. This inverts the standard distinction between "freedom" and "ability" in a way that renders political theory impossible (no external oppressors).
      *   *Power Yes / Act No / Agent No:* A theory that claims a washed-out bridge (no agent) creates a "power relation." Power implies a wielder; without an agent, it is merely inability.

  *   **Unattractive Cells:**
      *   *Endorsement Yes / Power No:* A theory that claims an endorsed law makes you unfree, but a sleeping guard with a key does not. This prioritizes abstract consent over concrete physical possibility, which is intuitively unstable.
      *   *Dependence Yes / Power No:* A theory that claims relying on a friend's favor is unfreedom, but a locked gate held by an enemy is not. This makes social reliance worse than active hostility.

  *   **Merely Unexplored Cells:**
      *   *Epistemic Power:* A theory where the sleeping guard (Node 4) makes you unfree *only if you know they exist*. This cell (Objective Power + Subjective Knowledge) is rarely theorized as a standalone conception of liberty, though it appears in debates about surveillance.

  ***

  ## 5. Indistinguishable Leaves and Missing Cases

  **Flagged Pair:** **Leaf B (Non-Domination)** and **Leaf E (Non-Domination)**.
  *   **Issue:** The tree routes students to the same theoretical label via different paths (Node 5 vs. Node 7). While this confirms the diagnosis, it reveals that the distinction between "Arbitrary Power" and "Non-Arbitrary Dependence" is subtle.
  *   **Missing Case:** To fully separate **Republican Non-Domination** from **Freedom as Non-Dependence** (Leaf D vs. Leaf B/E), we need a case where the superior is *not* legally bound but is *culturally* constrained.
      *   *Proposed Case:* "A traditional elder who *could* banish Taylor but never would because it violates tradition (not law)."
      *   *Reason:* Non-Domination theorists might say Taylor is free (power is tracked by tradition). Non-Dependence theorists might say Taylor is unfree (still dependent on the elder's discretion). The current "Kind Superior" (legally bound) conflates legal non-arbitrariness with structural non-arbitrariness.

  **Flagged Pair:** **Leaf A (Negative)** and **Leaf C (Structural)**.
  *   **Issue:** The tree separates these on Node 3 (Washed-Out Road). However, it does not separate **Negative Liberty** from **Capability Approach** on the issue of *resources*.
  *   **Missing Case:** "Taylor has the money for the toll, but the toll booth operator refuses to take Taylor's currency due to a bureaucratic rule no one enforces."
      *   *Reason:* This distinguishes between a lack of *means* (Capability/Structural) and a lack of *permission* (Negative/Republican). The current "Poverty" case (Node 6) leans heavily toward Structural, potentially missing students who view poverty as a lack of negative liberty (property rights violation).
