      *   Let's stick to the user's specific numbers. $P(B) = 0.4$. $P(B|A) = 0.33$.
      *   If the Strong Thesis holds, $P(A \to B)$ must be $0.33$.
      *   Lewis's proof implies that if the thesis holds for all $P$, then $A \to B$ must be probabilistically independent of $A$ (roughly), or that $P(A \to B) = P(B)$.
      *   Actually, the simplest contradiction to show with these numbers:
          *   Assume $A \to B$ is a proposition $X$.
          *   Assume $P(X) = P(B|A) = 1/3$.
          *   Lewis shows that for the thesis to hold generally, $P(X)$ must equal $P(B)$ in certain contexts or lead to $P(B|A) = P(B)$.
