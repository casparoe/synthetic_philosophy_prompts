  **Openers**

  1. Could you begin by outlining what first led you to reject the notion of an essential letterform?
  2. In your practice, how does treating alphabetic characters as genres rather than fixed shapes alter your design process?

  **The view, on its own terms**

  3. You accept both single-storey and double-storey variants as the same letter, but how do you explain this to children encountering them simultaneously?
     *Follow-up:* If they are functionally identical, why do we often teach one before the other?

  4. If the identity lies in the roles parts play, such as enclosing space or bearing weight, who decides what counts as a valid role?
     *Follow-up:* Does that mean a role is valid only if it successfully communicates to a reader?

  5. You mention readers learn to see these genres, but does that learning happen individually or collectively?
     *Follow-up:* If it is collective, does the genre evolve only as fast as the slowest reader accepts the change?

  **Where it pinches**

  6. If the genre is sufficiently permissive, what prevents the roles for 'a' and 'e' from merging into a single ambiguous form?
     *Follow-up:* Are you suggesting letter identity is purely relational, defined only by contrast within a specific font?

  7. Most people cannot write the looptail 'g' from memory, yet they read it fluently, so does the genre exist in the eye rather than the hand?
     *Follow-up:* If the hand cannot reproduce the genre, does that undermine your claim that the roles are functional?

  8. When a child draws a badly formed 'a', at what point does it cease to be a poor 'a' and become a different letter entirely?
     *Follow-up:* Are you comfortable admitting the category is vague, leaving some marks neither determinately 'a' nor anything else?

  9. If the genre is held together by use, could a community simply decide that what we call 'q' is now an 'a'?
     *Follow-up:* If not, why can't an individual reader re-identify letters at will without breaking the system?

  **The last question**

  10. If there is no essence to hold onto, what ultimately stops the genre from dissolving into noise?
