      *   The user's hunch: The problem isn't deriving probability from certainty, it's justifying the *measure* over the branches.
      *   *My Task:* I need to adopt this lens. It's a strong lens. It aligns well with the "measure problem" in cosmology and stat mech.
      *   *Verdict Strategy:* I should agree with the user. The "Probability Problem" is a category error. It *is* a Typicality Problem. The Born Rule is the Liouville measure of QM. The derivations (Deutsch-Wallace, etc.) are attempts to justify *why* this measure is the one that matters for agents.

  3.  **Evaluate the Arguments through the "Typicality" Lens:**
      *   **Branch Counting:** Fails because branches aren't discrete atoms. They are emergent structures in a continuous Hilbert space. Counting them is like counting grid points on a phase space diagram depending on your coordinate choice. It's basis-dependent.
      *   **Deutsch-Wallace (Decision Theory):** Tries to show a rational agent *must* act as if the Born rule holds. Through the typicality lens: It shows that rational betting strategies align with the Hilbert space measure. *Critique:* Does it derive the measure or assume rationality that presupposes it? It feels like defining "rational" as "one who uses Born weights."
