      *   **Constraint 3 (Concrete Example):** Use a specific apparatus with three branches, amplitudes $1/2, 1/2, 1/\sqrt{2}$ (Wait, $1/2^2 + 1/2^2 + (1/\sqrt{2})^2 = 1/4 + 1/4 + 1/2 = 1$. Okay, the math checks out). Born rule: $1/4, 1/4, 1/2$. Branch counting: $1/3, 1/3, 1/3$.
      *   **Constraint 4 (Arguments to Weigh):** Deutsch-Wallace (decision theory), Zurek (envariance), Sebens-Carroll (self-locating uncertainty), Deflationism ("shut up and calculate"). Address complaints about circularity and the "equal weight" continuity step.
