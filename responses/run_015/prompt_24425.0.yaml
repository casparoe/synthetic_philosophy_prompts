answer: |-
  You have identified a genuine and well-documented phenomenon in logic and the philosophy of language. Your intuition is correct: this is not merely a person being sloppy with definitions (lexical equivocation), but rather an exploitation of a structural ambiguity inherent in how human language handles conditionals.

  There is no single, catchy Latin name for this specific rhetorical maneuver (like *ad hominem*), but in philosophy and argumentation theory, it is precisely described as **Modal Equivocation** regarding **Indicative and Counterfactual Conditionals**.

  Here is the breakdown of the concept, why it differs from plain equivocation, and the rule that determines when the switch is legitimate.

  ### 1. The Two Sentences: Indicative vs. Counterfactual
  The core of the issue is that English uses the word "if" to do two logically distinct jobs. Philosophers distinguish these as:

  *   **The Indicative Conditional:** "If we ship in March, it will flop."
      *   **Function:** This is a prediction about the actual world based on current evidence.
      *   **Truth Condition:** It is judged by looking at the actual future. If we ship and it succeeds, the claim was false. It relies on *current* trends projecting forward.
  *   **The Counterfactual (or Subjunctive) Conditional:** "If we *had* shipped in March, it *would have* flopped."
      *   **Function:** This is a claim about a hypothetical world that did not happen.
      *   **Truth Condition:** It is judged by imagining a "nearby possible world" where the past was slightly different. It relies on *retrospective* reasoning and assumed laws of causality.

  **The Move:** The speaker treats these two distinct logical structures as interchangeable. When the predictive claim (Indicative) is threatened by lack of evidence, they retreat to the hypothetical claim (Counterfactual), which is harder to disprove because the event never happened. When the hypothetical claim is challenged as speculative, they retreat to the predictive claim, treating it as a general rule.

  ### 2. Why This Is Not "Plain" Equivocation
  You were right to hesitate when told this is "just equivocation."

  *   **Plain (Lexical) Equivocation:** This happens when a *word* changes meaning (e.g., "The bank is steep" vs. "I went to the bank"). The ambiguity is in the vocabulary.
  *   **Modal Equivocation (Your Case):** The words remain the same, but the **modality** (the mode of truth) shifts. The grammar changes slightly (will vs. would have), but the speaker treats the *proposition* as identical.

  This is more insidious than lexical equivocation because it exploits a gap in **logic**, not just dictionary definitions. It relies on the listener's assumption that "If P then Q" has a single, stable meaning. In formal logic, the truth conditions for indicatives and counterfactuals are different; one can be true while the other is false. By sliding between them, the speaker insulates their claim from falsification.

  ### 3. When Is the Switch Legitimate? (The "Ice" Test)
  You suspected that sometimes this switch is valid, such as with the ice example ("If you heat ice, it melts"). You are correct. The boundary between legitimate and illegitimate use lies in the distinction between **Lawlike Generalizations** and **Accidental Generalizations**.

  *   **Lawlike Generalizations (Nomic Necessity):**
      *   These describe fundamental laws of nature or logic (e.g., physics, math).
      *   **Why the switch works:** A law holds true across all "possible worlds." If it is a law that ice melts at 0°C, it is true in the actual future (Indicative) *and* it would have been true in a hypothetical past (Counterfactual). The connection between X and Y is **invariant**.
      *   **Verdict:** Legitimate. The two sentences effectively say the same thing because the underlying connection is necessary.

  *   **Accidental Generalizations (Contingent Facts):**
      *   These describe trends, specific contexts, or complex social systems (e.g., markets, medical outcomes, traffic).
      *   **Why the switch fails:** These connections depend on specific background conditions that change over time.
      *   **Example:** "If we ship in March, it will flop." This depends on *this year's* market.
      *   **Example:** "If we had shipped in March *last year*, it would have flopped." This depends on *last year's* market.
      *   Because the market conditions (the background variables) changed, the connection between "Shipping in March" and "Flopping" is not invariant.
      *   **Verdict:** Illegitimate. The speaker is treating a contingent, context-dependent correlation as if it were a stable law.

  ### 4. How to Identify the Boundary
  To determine if a speaker is making a legitimate inference or committing this fallacy, apply the **Invariance Test**:

  **Ask:** *Does the connection between X and Y hold regardless of time and context?*

  *   **Passes Test (Legitimate):** "If you drop that glass, it will break." / "If you had dropped that glass, it would have broken."
      *   Gravity and material fragility are stable laws. The switch is safe.
  *   **Fails Test (Illegitimate):** "If you invest in this stock, you will lose money." / "If you had invested in this stock last year, you would have lost money."
      *   Stock performance is contingent on volatile market conditions. The switch is deceptive.

  ### Summary Definition
  The concept you are looking for is the **exploitation of the Indicative-Counterfactual Distinction**.

  *   **The Fallacy:** **Modal Equivocation** (specifically regarding conditionals). It occurs when a speaker treats a predictive claim and a counterfactual claim as logically equivalent to evade falsification.
  *   **The Legitimate Case:** Occurs only when the conditional expresses a **Lawlike Generalization** (nomic necessity), where the causal link is invariant across time and context.
  *   **The Illegitimate Case:** Occurs when the conditional expresses an **Accidental Generalization**, where the causal link depends on changing background conditions (like market trends or specific medical variables).

  You have correctly identified that the "if" sentence is not a single tool, but a dual-purpose tool. The fallacy lies in using the handle of one tool while claiming the work of the other.
