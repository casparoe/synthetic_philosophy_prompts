      *   **Opponent's Argument:** The friend has constructed a *reductio ad absurdum* argument against EMT. The friend argues that if EMT is true (via Parity + Functionalism), then *too many* things count as beliefs (supermarket layouts, sidewalk patches), leading to absurdities (shared beliefs, beliefs existing without minds, unfalsifiability).
      *   **User's Goal:** The user wants to save EMT (keep Otto's notebook as a belief) but reject the absurd consequences (supermarket layout is *not* a belief). They want to know which step in the friend's argument to reject, what the cost is, and how to handle their own two tricky cases (compressed notebook, sealed field notes).
