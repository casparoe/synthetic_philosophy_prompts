      *   **Refine Step (1) and (2).** Parity isn't just "does the same job." It's "plays the same functional role *within the cognitive system*." The cognitive system needs a boundary.
      *   **Address the "Glue and Trust" Criteria.** Clark & Chalmers have specific criteria (constant availability, automatic endorsement, easy access, prior endorsement). The friend claims the supermarket meets these in (5). This is the factual error. The supermarket layout is not *endorsed* by Otto. He doesn't carry it as a truth. He navigates *against* it or *through* it.
      *   **Address the "Shared Belief" problem (7).** This is the strongest point for the friend. If the sidewalk is a belief for everyone, identity conditions for beliefs break. This suggests we need a criterion of *ownership* or *integration* that is individual-specific.
      *   **Cost:** Rejecting (4) means admitting that "functional role" isn't enough; you need a theory of *system boundaries*. You have to explain *why* the notebook is inside the boundary and the sidewalk is outside, without just saying "because it's not in the skull." This requires a theory of *coupling* that is robust, not ad hoc.

  6.  **Drafting the Response:**
