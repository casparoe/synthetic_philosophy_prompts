prompt: |-
  hey, i'm drafting a scene for my novel where two characters—one's an archeologist, one's a philosopher—get into it over whether you can ever really know what people in pre-literate societies *believed*, or if all you're doing is reconstructing institutions and habits from the junk they left behind. my archelologist friend says this argument's been stalled since the 80s, with processualists on one side saying material patterns only map social organization, and post-processualists on the other saying symbols are embedded in objects so you can read belief systems off burial goods and house layouts. but i think the stall might be about something weirder: maybe the two sides aren't disagreeing about the same concept of 'belief' at all. one side treats belief as an internal mental state that needs texts or oral testimony to access, the other treats it as distributed across practices and material arrangements—so asking 'did they believe in an afterlife?' is already a category error, like asking about the weight of a number. is the disagreement really about evidence standards, or is it that they're answering different questions under one word? i want you to diagnose what's actually going on—whether there's a hidden empirical dispute about what counts as data, or whether it's bedrock intuitions about mind and culture that neither side can argue for. please don't just survey positions; tell me what kind of disagreement it is and whether anything—new excavation method, conceptual distinction, whatever—could actually move it. and be honest about what's settled versus what's genuinely contested among people who actually do thier work; don't dress up one side as the obvious consensus. write it back like a long email, no headings or bullet points or bold, just continuous paragraphs.
