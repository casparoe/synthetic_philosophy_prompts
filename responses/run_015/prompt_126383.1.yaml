answer: |-
  You are correct to be unsatisfied with both friends' advice. They are optimizing for different objective functions than the one you actually have.

  Friend A (Kelly) is maximizing the **geometric growth rate** (equivalent to maximizing expected logarithmic utility). This is optimal for an infinite horizon where you never withdraw and never face a hard ruin constraint that ends the game.

  Friend B (Max Stake) is maximizing **expected arithmetic value**. This is optimal only if you are risk-neutral and can play the game an infinite number of times in parallel (the "ensemble average" vs. "time average" argument your friend mentioned).

  Your objective function is neither. You are solving a **finite-horizon, goal-reaching problem with a lower absorbing barrier.** Mathematically, you want to maximize:

  $$ P(W_{24} \geq 120k \quad \cap \quad \min_{0 \leq t \leq 24} W_t > 30k) $$

  Where $W_t$ is your wealth at month $t$. You have a "step" utility function: 1 if you hit the target without crashing, ~0 (or negative) otherwise. Wealth above £120k adds no utility; wealth below £30k destroys it.

  Here is the mathematical breakdown of why their advice fails you, the correction regarding your memory of "bold play," and the specific strategy you should use.

  ### 1. Why Kelly (20%) is likely too conservative
  Your friend claims 20% maximizes compounding. For $p=0.6$ at even money, the Kelly fraction is indeed $f^* = p - q = 0.2$.
  However, Kelly maximizes the *median* terminal wealth over an *infinite* horizon. Let's look at your finite horizon.

  The expected logarithmic growth per bet at full Kelly ($p=0.6$) is:
  $$ E[\log(1+r)] = 0.6 \ln(1.2) + 0.4 \ln(0.8) \approx 0.0201 $$
  Over 24 months, the median growth factor is $e^{24 \times 0.0201} \approx 1.62$.
  Starting at £60,000, your **median** outcome after 2 years using Kelly is roughly **£97,000**.

  To reach £120,000 (a 100% increase), you need a growth factor of 2.0. Kelly gets you to 1.62. This means that even with the "optimal" growth strategy, **more than 50% of your simulations will fail to reach the deposit** simply because the drift isn't strong enough to double your money in 24 steps with that level of volatility protection.

  If your true edge is only $p=0.55$ (which is statistically plausible given your sample size), the Kelly fraction drops to 10%, and the median outcome is essentially flat. You would almost certainly miss the target.

  ### 2. Why Max Stake is ruinous
  Your second friend argues from Expected Value (EV). Since the bet is +EV, $E[W_{t+1}]$ is maximized by staking everything.
  However, EV ignores the distribution's width. With a hard floor at £30,000, variance is your enemy.
  If you stake 50% (as you simulated), a string of 3 losses (probability $0.4^3 = 6.4\%$) reduces your capital by $0.5^3 = 12.5\%$ of the *original*? No, compounding loss: $60k \to 30k \to 15k$. You hit ruin in just two losses.
  Maximizing EV in a finite game with a ruin barrier is mathematically proven to maximize the probability of hitting the barrier.

  ### 3. Correcting your memory on "Bold Play"
  You recalled a theorem that when odds are *against* you ($p < 0.5$) and you need a fixed sum, "Bold Play" (betting the maximum amount needed to reach the target or your entire bankroll, whichever is smaller) maximizes the probability of success. This is correct (Dubins & Savage, 1965).

  **However, you have favourable odds ($p > 0.5$).**
  In a favourable game, the optimal strategy to reach a target before ruin is generally the opposite: **minimize variance** to let the positive drift work for you, *unless* the target is unreachable via drift alone.
  *   If the target is reachable via drift (small bets), bet small to avoid the ruin barrier.
  *   If the target is unreachable via drift (you are behind schedule), you must increase variance to have *any* chance, accepting higher ruin risk.

  Since your target (doubling in 2 years) is aggressive relative to your edge, you are in a hybrid zone. You cannot bet "small" (Kelly) because the drift is too slow. You cannot bet "max" because ruin is too fast.

  ### 4. The Optimal Strategy: Dynamic State-Dependent Betting
  Because you have a finite horizon ($T=24$), a target ($H=120k$), and a floor ($L=30k$), the optimal fraction $f$ is not constant. It is a function $f(W_t, t)$.

  You should solve this via **Dynamic Programming** (since you are a data scientist, this is a weekend project).
  Define $V(w, t)$ as the probability of success given wealth $w$ at time $t$.
  $$ V(w, t) = \max_{f} \left[ p \cdot V(w(1+f), t+1) + (1-p) \cdot V(w(1-f), t+1) \right] $$
  Boundary conditions:
  *   $V(w, 24) = 1$ if $w \geq 120k$, else $0$.
  *   $V(w, t) = 0$ if $w \leq 30k$.

  **Qualitative Solution (The Heuristic):**
  If you don't want to code the DP solver, use this state-dependent heuristic which approximates the optimal control:

  1.  **Conservative Edge Estimation:** Do not use $p=0.6$. Use the lower bound of your confidence interval. If 200 bets gave 60%, the standard error is $\sqrt{0.6 \times 0.4 / 200} \approx 3.4\%$. A 95% lower bound is roughly $53\%$. If you bet assuming 60% and the true rate is 53%, you are betting with negative edge. **Plan for $p=0.55$.**
      *   Kelly for $p=0.55$ is $f=0.10$ (10%).
      *   Kelly for $p=0.60$ is $f=0.20$ (20%).

  2.  **The "Coast" Zone ($W_t > 100k$):**
      As you approach the target, your utility function becomes concave (you don't need more money). Variance is now purely downside risk.
      *   **Action:** Reduce stake drastically. If you have £110k, you only need £10k more. Do not bet 20% of £110k (£22k). Bet only what is needed to reach the target if you win, or stop entirely.
      *   **Rule:** Stake $\min(\text{Kelly}, \frac{120k - W_t}{W_t})$.

  3.  **The "Growth" Zone (£60k < $W_t$ < £90k):**
      You are mid-table. You need growth, but must avoid the floor.
      *   **Action:** Use **Half-Kelly** based on $p=0.55$.
      *   **Why:** Full Kelly maximizes growth but has high volatility (50% chance of dropping to half the peak before doubling). Half-Kelly reduces volatility by 50% while retaining 75% of the growth rate. Given your hard floor at £30k, survival is paramount.
      *   **Stake:** ~5% to 7.5% of bankroll.

  4.  **The "Danger" Zone (£30k < $W_t$ < £50k):**
      You are near the ruin barrier. The "Bold Play" theorem for favourable odds suggests minimizing variance to let the drift recover you.
      *   **Action:** Minimum table stakes. Do not try to gamble your way back quickly; the math says the drift will save you *if* you survive long enough.
      *   **Stake:** 1% to 2%.

  5.  **The "Desperation" Zone (Month 20+, $W_t$ < £80k):**
      Time is running out. The drift no longer has enough steps to reach £120k with small bets. You must increase variance to have a non-zero probability of success.
      *   **Action:** Increase stake towards Kelly (or slightly above), accepting that this increases ruin risk, but ruin is effectively certain if you don't change strategy.

  ### 5. Addressing Parameter Uncertainty
  You noted the edge might be 55% rather than 60%. This is the biggest risk to your plan.
  *   At $p=0.60$, doubling in 24 months is difficult but possible.
  *   At $p=0.55$, doubling in 24 months is statistically improbable without accepting a >50% risk of ruin.

  **Recommendation:** Run a Monte Carlo simulation with $p \sim N(0.57, 0.03)$ (reflecting your uncertainty). Optimize the fixed fraction $f$ that maximizes the success rate defined above.
  My intuition suggests a **fixed fraction of 12-15%** is the "sweet spot" if you refuse to vary stakes dynamically.
  *   20% (Full Kelly) risks too much drawdown near the £30k floor.
  *   10% (Conservative Kelly) likely leaves you at £90k after 2 years.
  *   15% gives you enough volatility to hit £120k in the "lucky" runs, but enough protection to usually stay above £30k in the "unlucky" runs.

  ### Summary of Advice

  1.  **Both friends are wrong.** Friend A ignores your finite horizon and target cap. Friend B ignores your ruin floor.
  2.  **Do not use a fixed fraction.** Your utility function changes depending on how close you are to £30k and £120k.
  3.  **Assume $p=0.55$.** Plan for the worst plausible edge. If you succeed with this assumption, $p=0.60$ is a bonus.
  4.  **Implement "Target-Seeking" stakes:**
      *   **If Wealth > £100k:** Stake only the amount needed to reach £120k (or 0).
      *   **If Wealth £50k–£100k:** Stake 10-12% (Half-Kelly on conservative edge).
      *   **If Wealth < £50k:** Stake <5% (Preserve capital to let drift work).
      *   **If Time < 6 months remaining AND Wealth < £90k:** Increase stake to 15-20% (Gambling for resurrection is now rational).
  5.  **Stop Early.** If you hit £120k in month 18, stop betting. Your friend A's "compounding" argument is irrelevant because you have no utility for £150k.

  **Final Reality Check:**
  With £60k start, £30k floor, and 24 months, even the optimal strategy may only yield a 40-50% probability of success if the true edge is 55%. If your simulation shows a success rate below 40% even with optimized stakes, the mathematical answer is that the goal is misaligned with the risk profile, regardless of stake size. But if you are committed to playing, the dynamic strategy above maximizes your odds.
