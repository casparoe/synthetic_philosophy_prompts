answer: |-
  This is a fantastic set of questions. You have identified exactly the two pressure points where most interpretations of Madhyamaka either collapse into nihilism or subtly revert to essentialism. Since you are preparing for comps, I'm going to skip the introductory fluff and go straight for the conceptual mechanics and the secondary literature debates that will matter for your committee.

  Here is a breakdown of the "back door" reification problem and the normative application problem.

  ### 1. The Fourth Lemma and the "Back Door" of Ontology

  Your intuition is spot on: if the fourth lemma ("neither exists nor does not exist") is treated as a *position* (pakṣa), it functions as a description of reality, thereby granting the subject a specific ontological status (i.e., "that which is neither-existent-nor-non-existent"). This would indeed be *svabhava* by another name.

  The mechanism that prevents this is the distinction between two types of negation in Indian logic, which is crucial for your comps: **paryudāsa** (implicating negation) vs. **prasajya-pratiṣedha** (non-implicating negation).

  *   **Implicating Negation:** "The king is not walking." This negates the walking but implies the king exists and is doing something else. It leaves ontological residue.
  *   **Non-Implicating Negation:** "There is no king." This negates the subject and the predicate without implying an alternative state of affairs.

  **The Mechanic:**
  Nāgārjuna's *catuṣkoṭi* (tetralemma) employs *prasajya-pratiṣedha*. When he negates the fourth corner, he is not positing a "middle state" or a "trans-ontological state." He is performing a **therapeutic dissolution of the question itself.**

  If you treat the tetralemma as a truth-functional logic (as Graham Priest does in his paraconsistent readings), you risk the reification you're worried about. You end up with a "true contradiction" that still describes the world.

  However, the Prāsaṅgika reading (championed in the West by Jay Garfield and Tom Tillemans) argues that the tetralemma is a *reductio ad absurdum* of the *presuppositions* required to make the assertions in the first three corners.
  1.  **Exists:** Presupposes intrinsic nature.
  2.  **Does not exist:** Presupposes intrinsic nature (that was lost).
  3.  **Both:** Presupposes intrinsic nature (contradictory).
  4.  **Neither:** Presupposes intrinsic nature (as a definable absence).

  By rejecting the fourth, Nāgārjuna isn't saying "Reality is neither-ness." He is saying, **"The framework of 'existence/non-existence' is inapplicable to phenomena because phenomena lack the *svabhava* required to be subjects of these predicates."**

  **The Safety Valve: *Śūnyatā-śūnyatā***
  To specifically answer your worry about the fourth lemma smuggling existence back in: Nāgārjuna anticipates this in *Mūlamadhyamakakārikā* (MMK) 13.8. He says emptiness itself must be empty. If *śūnyatā* were a true absence, it would be a *svabhava*.
  *   **Conceptual Mechanic:** The fourth lemma is a ladder to be kicked away (to use Wittgenstein's analogy, which Garfield leans on heavily). It negates the reification of absence. If you hold onto the fourth lemma as a view (*dṛṣṭi*), you have "grasped at emptiness like a snake," and you are lost. The fourth lemma avoids reifying absence only if it is understood as the **cessation of conceptual proliferation (*prapañca*)**, not as a description of the cessation.

  ### 2. The Normative Problem: Justice and Conditional Existence

  This is where your comps essay could really shine. Applying the tetralemma to normative properties exposes the tension between the Two Truths (*satyadvaya*).

  Your worry: *Normative properties like justice seem to be constituted by conventional agreement. Doesn't admitting they are "conventionally real" already bake in the conditional existence that Madhyamaka accepts? Does the dialectic collapse because we've already conceded the ground?*

  **The Tension:**
  You are correct that for a Madhyamaka, justice *does* exist conventionally (*saṃvṛti-satya*). However, the dialectic does not collapse because human beings (and philosophers of religion) constantly slide from **conventional validity** to **intrinsic validity**.

  Let's run the Tetralemma on "Justice" to see where the reification happens:
  1.  **Justice Exists:** (Moral Realism/Platonism). Justice is a mind-independent fact. *Madhyamaka rejects: Dependent on causes/conditions/concepts.*
  2.  **Justice Does Not Exist:** (Moral Nihilism/Error Theory). Justice is a fiction. *Madhyamaka rejects: It functions causally in the world; suffering arises from injustice.*
  3.  **Justice Both Exists and Does Not Exist:** (Contextualism/Relativism). It's real for you, not for me. *Madhyamaka rejects: Contradictory predicates cannot apply to the same subject even conventionally without confusion.*
  4.  **Justice Neither Exists nor Does Not Exist:** (The Apophatic Move).

  **Why it doesn't collapse:**
  The dialectic holds because "conditional existence" is not a stable ontological category; it is a soteriological tool.
  If you say, "Justice is conditionally existent," you are still at risk of reifying **conditionality**. You might think, "Ah, the *nature* of justice is to be dependent." But dependence is not a nature.

  **The Normative Trap:**
  In philosophy of religion/ethics, the danger isn't just ontological; it's **soteriological attachment to views.**
  *   If I believe Justice is Real (Corner 1), I become dogmatic/fundamentalist.
  *   If I believe Justice is Unreal (Corner 2), I become nihilistic/apathetic.
  *   If I believe Justice is Both (Corner 3), I become a relativist who cannot critique oppression.
  *   If I believe Justice is Neither (Corner 4), I risk quietism.

  The Tetralemma applied to normativity doesn't collapse; rather, it reveals that **normative force does not require ontological grounding.** This is Garfield's argument in *Buddhism as Philosophy* and *Ethics without Ontology*. The "tension" you feel is the friction between *vyavahāra* (practical engagement) and *paramārtha* (ultimate analysis).

  **Does normative discourse bake in conditional existence?**
  Yes, but it *pretends* it doesn't. Normative discourse claims universal validity ("Torture is wrong" implies "wrong for everyone, always"). Madhyamaka uses the tetralemma to show that this universal claim cannot hold up under ultimate analysis, *without* denying the conventional validity of the claim.
  *   **The Collapse Point:** The dialectic only collapses if you conflate the Two Truths. If you think the emptiness of justice (ultimate) negates the prohibition against torture (conventional), you have fallen into nihilism. If you think the prohibition against torture (conventional) proves justice has intrinsic nature (ultimate), you have fallen into eternalism.

  ### 3. Comps Strategy & Literature Tips

  For your comps, you need to show you can navigate the logical vs. pragmatic interpretations.

  **Key Distinctions to Deploy:**
  1.  **Prasajya vs. Paryudāsa:** Use this to answer the "back door" ontological worry. It shows technical competence in Indian logic.
  2.  **Soteriology vs. Metaphysics:** Emphasize that Nāgārjuna's goal is *nirvāṇa* (cessation of suffering/views), not a better theory of reference. The fourth lemma is a cure, not a claim.
  3.  **The Two Truths as Non-Dual:** Cite MMK 24.18 ("There is no distinction whatsoever between saṃsāra and nirvāṇa"). The normative properties exist *only* as empty. Their emptiness *is* their possibility. If justice had *svabhava*, it could not change, and moral progress would be impossible.

  **Scholars to Engage:**
  *   **Jay Garfield:** For the "West Coast" interpretation (Wittgensteinian, pragmatic, anti-realist). Essential for the normative question.
  *   **Tom Tillemans:** For the logical analysis and the *prasajya* distinction.
  *   **Jan Westerhoff:** For a rigorous analytic reconstruction of Nāgārjuna's ontology (or lack thereof).
  *   **Candrakīrti:** If you want to go historical, his *Prasannapadā* is the locus for the non-implicating negation argument.
  *   **Graham Priest:** (Use with caution). Good for showing the logical "paraconsistent" reading, but you should critique it from the Prāsaṅgika view that Nāgārjuna isn't doing formal logic.

  **The "Pin Down" for your Normative Tension:**
  The tension you feel regarding justice is the tension of **normative authority without ontological foundation.**
  *   *Thesis:* Normativity requires grounding.
  *   *Madhyamaka Antithesis:* Grounding is impossible (emptiness).
  *   *Synthesis:* Normativity arises *because* of the lack of grounding (dependence allows for change, response, and convention).
  The tetralemma holds here because it prevents you from settling on the Synthesis as a new Dogma. It keeps the normative discourse "fluid" (*saṃvṛti*) without letting it harden into ideology (*svabhava*).

  **Summary for your notes:**
  1.  **Fourth Lemma:** Avoids reification via *prasajya-pratiṣedha* (non-implicating negation). It negates the validity of the predicates, not the subject. It is the emptiness of emptiness.
  2.  **Normative Properties:** The dialectic holds because it targets the *reification of convention*, not convention itself. It allows for ethical engagement without metaphysical baggage. The "conditional existence" is the point, not the problem, provided you don't reify "conditionality."

  This should give you enough traction to write a rigorous section on this. Good luck with the comps.
