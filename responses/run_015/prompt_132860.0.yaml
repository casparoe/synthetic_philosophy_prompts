prompt: |-
  hey — I run a tiny bankroll-management reading group (mostly old rationalist-blog people, we do a prediction-market night) and I want a one-page handout: a flowchart that walks someone from "I've got a repeatable +EV bet and I can reinvest the winnings" to a named bet-sizing position. You're an expert on Kelly-style geometric rationality, so please think carefully, brainstorm the branching structure first, and then commit to one. Skip the intro-to-log-utility preamble.

  Every branch node has to be a question a newcomer can answer without already knowing which position it leads to — concrete cases, not "are you risk-averse?". Build the tree out of the logical space first (which answer-combinations are even available), then hang names on the leaves.

  Cases I care about: the classic repeatable multiplicative bet with a known edge; the same bet when I'm not sure my edge is real and I might be the sucker at the table; a target case where I need $X by a fixed date and below $Y I'm finished; a saturating case where bankroll above ~$50M buys me literally nothing, so what I want to grow is an "effective bankroll" that flattens out; several simultaneous bets that resolve at once and can't be sized independently; and a random-horizon case where the opportunity may vanish after any round.

  Leaves I want to be able to land on: full Kelly, fractional Kelly, time-average/ergodicity-style growth maximization (tell me honestly whether that's a separate leaf from full Kelly or the same math with different marketing), power-utility expected-utility maximization, median maximization, maximize-P(hit-the-target), ruin-constrained sizing, "shrink your edge estimate" robust/Bayesian Kelly, and the size-zero "I'm probably on the wrong side of this trade" option. Max 10–12 leaves, keep it tight.

  Also: flag any pair of leaves your tree genuinely can't seperate (fractional Kelly, power utility and robustness shrinkage all just say "bet less" — what extra question, if any, tells them apart?), and mark the empty regions: combinations nobody defends, with one line each on whether they're empty because incoherent, unattractive, or just unexplored.
