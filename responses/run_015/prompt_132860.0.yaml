answer: |-
  # BET-SIZING DECISION TREE
  **Context:** Repeatable +EV opportunity, reinvestment allowed.  
  **Goal:** Select a sizing policy. Answer **Yes/No** to each node.

  ### THE FLOW

  **START:** You have identified a +EV bet.

  **1. THE SUCKER CHECK**  
  *Is your edge based on a structural/mechanical advantage (e.g., mispriced odds, latency) rather than a statistical sample of past wins?*  
  ▢ **NO** → **LEAF A: Size-Zero ("The Sucker Check")**  
  ▢ **YES** → Go to 2.

  **2. THE SATURATION CHECK**  
  *If your bankroll doubled tomorrow, would you reduce your bet fraction on the next round?*  
  ▢ **YES** (Money matters less at margins) → **LEAF B: Power-Utility EU**  
  ▢ **NO** (Fraction stays constant) → Go to 3.

  **3. THE GOAL CHECK**  
  *Is your objective to maximize long-term growth rate, or to hit a specific dollar target ($X) by a fixed date?*  
  ▢ **HIT TARGET** → **LEAF C: Maximize-P(Hit-Target)**  
  ▢ **GROWTH RATE** → Go to 4.

  **4. THE RUIN CHECK**  
  *Is there a hard lower bound (e.g., margin call, living expenses) where dropping below $Y ends your ability to play forever?*  
  ▢ **YES** → **LEAF D: Ruin-Constrained Sizing**  
  ▢ **NO** → Go to 5.

  **5. THE PARAMETER CHECK**  
  *Do you know the true probability of winning (e.g., dice, card count), or are you estimating it from noisy data?*  
  ▢ **ESTIMATING** → **LEAF E: Robust/Bayesian Kelly**  
  ▢ **KNOWN** → Go to 6.

  **6. THE PORTFOLIO CHECK**  
  *Are you placing multiple bets simultaneously that resolve before you can rebalance?*  
  ▢ **YES** → **LEAF F: Portfolio Kelly (Correlation Adjusted)**  
  ▢ **NO** → Go to 7.

  **7. THE HORIZON CHECK**  
  *Is the opportunity likely to vanish randomly (exogenous death) before you can compound significantly?*  
  ▢ **YES** → **LEAF G: Fractional Kelly (Horizon Discounted)**  
  ▢ **NO** → **LEAF H: Full Kelly**

  ---

  ### LEAF GLOSSARY

  *   **A: Size-Zero:** You are likely the liquidity. Do not bet.
  *   **B: Power-Utility EU:** Maximize $E[W^{1-\gamma}]$. Bet fraction scales down as wealth grows.
  *   **C: Maximize-P(Hit-Target):** "Bold Play." Bet large to reach $X$ before $T$. Ignores long-term growth.
  *   **D: Ruin-Constrained:** Kelly fraction capped to ensure $P(Bankroll < Y) < \epsilon$.
  *   **E: Robust/Bayesian Kelly:** Integrate over posterior distribution of edge. Effectively shrinks edge estimate.
  *   **F: Portfolio Kelly:** Solves for vector $\vec{f}$ maximizing $E[\log(1 + \vec{f}\cdot\vec{r})]$. Accounts for covariance.
  *   **G: Fractional Kelly:** Full Kelly multiplied by $\alpha < 1$. Justified by short horizon or parameter uncertainty.
  *   **H: Full Kelly:** Bet fraction $f^* = (bp - q) / b$. Maximizes expected log wealth.

  ---

  ### META-ANALYSIS: INDISTINGUISHABLE LEAVES & EMPTY REGIONS

  **1. The "Bet Less" Degeneracy (Indistinguishable Outputs)**  
  *   **Leaves:** **Full Kelly**, **Time-Average/Ergodicity**, **Median Maximization**.  
  *   **Verdict:** **Mathematically Identical.** In multiplicative dynamics, maximizing time-average growth rate *is* maximizing expected log wealth (Full Kelly), which *is* maximizing the median outcome in the long-run limit.  
  *   **Distinction:** Only rhetorical. Use "Ergodicity" if arguing against ensemble averages; use "Kelly" if arguing from information theory.

  **2. The "Risk Aversion" Triangle (Indistinguishable Outputs)**  
  *   **Leaves:** **Fractional Kelly**, **Power-Utility EU** (with $\gamma \approx 1$), **Robust/Bayesian Kelly**.  
  *   **Verdict:** **Functionally Overlapping.** All three result in betting $< f^*_{Kelly}$.  
  *   **Distinction Question:** *"Why are you betting less?"*  
      *   "I value marginal dollars less" → **Power-Utility**.  
      *   "I don't trust my edge estimate" → **Robust Kelly**.  
      *   "I want a smoother equity curve / horizon is short" → **Fractional Kelly**.

  **3. Empty Region: "Mean-Maximizer without Constraints"**  
  *   **Concept:** Maximize expected arithmetic wealth ($E[W]$) in a repeatable bet.  
  *   **Status:** **Incoherent.** Leads to betting 100% on any +EV. In a repeatable game, this guarantees eventual ruin (Gambler's Ruin). No serious agent defends this for bankroll management.

  **4. Empty Region: "Risk-Neutral Utility with Ruin Aversion"**  
  *   **Concept:** Linear utility of money ($U(W)=W$) but hard constraint on not going broke.  
  *   **Status:** **Unattractive/Unstable.** Linear utility implies you should always bet max allowed. Adding a ruin constraint creates a discontinuous "cliff" optimization problem that usually collapses into Power-Utility or Ruin-Constrained Kelly anyway. Rarely defended explicitly.

  **5. Empty Region: "Full Kelly on Correlated Simultaneous Bets"**  
  *   **Concept:** Sizing each bet independently at Full Kelly while holding others.  
  *   **Status:** **Incoherent.** Overcounts risk. If bets are correlated, independent Full Kelly sizing exceeds optimal leverage and increases volatility drag. Must use **Portfolio Kelly** (Leaf F).
