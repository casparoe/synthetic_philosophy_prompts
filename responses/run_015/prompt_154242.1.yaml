      *   **Epistemic Status Markers:** Need to use phrases like "Settled mechanics," "Contested in literature," "Reconstruction."

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on DBA:* DBA relies on *sure loss*. MPA relies on *Pareto inferiority* or *wealth reduction*. Are they the same? Not quite. A money pump leaves you with the same good but less money. A Dutch book leaves you with a net loss regardless of state.
      *   *The "Fountain" Point:* This is actually a known objection (often associated with Gustafsson or similar contemporary debaters, though I won't cite them). If I prefer A to B, B to C, C to A, I can be pumped. But if the market offers the reverse, I gain. Does this make the preference rational? No, because the *cycle* implies no maximal element. The money isn't the point; the lack of a stable resting point is. I need to make sure I don't concede too much to the "Fountain" objection while acknowledging its force against the *monetary* interpretation.
      *   *Synchronic Reduction:* The reading group member says "Get the ordering right." But if preferences change over time (time-inconsistency), no *single* synchronic ordering exists to "get right." This is the killer argument against the reductionist view. I must emphasise this.
