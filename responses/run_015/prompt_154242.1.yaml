          *   *Dynamic vs. Static:* DBA assumes static credences. MPA often targets dynamic inconsistency (Akranasia). *Verdict:* This bites on the claim that synchronic coherence solves everything. You can be synchronically perfect at every $t$ and still get pumped.
          *   *Granularity:* DBA works with any stakes proportional to incoherence. MPA needs small transaction costs. *Verdict:* Idle regarding normativity, relevant regarding practicality.
      *   **The Core Question: Coherence vs. Self-Coordination:**
          *   User suspects it's a collective action problem among temporal stages.
          *   *Analysis:* If preferences change, $Self_t$ imposes costs on $Self_{t+1}$. This looks exactly like an intertemporal externality.
          *   *Verdict:* Support the user's suspicion. The "defect" isn't the ordering *per se*, but the lack of authority of the earlier self over the later self.
      *   **The Cure and New Vulnerabilities:**
          *   Resoluteness/Sophistication.
          *   *Vulnerability:* "Resolute" agents can be exploited by offers they *would* have taken if they were myopic (the "Paradox of Sophistication" or similar issues regarding flexibility). Also, binding costs money.
