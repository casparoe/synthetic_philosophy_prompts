answer: |-
  Macbeth ultimately resists the generalization of Benatar's asymmetry to lineages by treating the extinction of a bloodline as a metaphysical catastrophe outweighing individual suffering, thereby locating its pessimism in the futility of continuation rather than the immorality of creation.

  The play dramatizes the asymmetry's precondition—the ubiquity of suffering—only to reject its conclusion regarding lineage. Macbeth's grievance over his "fruitless crown" and "sterile sceptre" presupposes that bringing a lineage into existence is a good capable of outweighing the moral cost of securing it, whereas the absence of progeny is a specific punishment rather than a mercy. If the asymmetry generalized to lineages, Macbeth's inability to father kings should be viewed as a prevention of future suffering for his descendants; instead, the play frames it as a voiding of his own meaning and a failure of masculine potency. Conversely, Banquo's lineage is promised kingship alongside the guarantee of his own murder, presenting a scenario where goods are guaranteed to the line alongside harms guaranteed to the founder. The play's moral economy validates Banquo's line despite this cost, suggesting that the lineage possesses intrinsic value independent of the welfare of its members, which renders the utilitarian calculus of the asymmetry incommensurable with the play's ontology.

  The condition of foreknowledge further defeats the asymmetry's application because it removes the ethical agency required for the verdict to hold. Benatar's argument functions as a veto on a choice to create, but the Witches' prophecies present lineage as fate rather than decision. Banquo cannot choose antinatalism for his descendants because their kingship is divinely ordained; Macbeth cannot choose natalism for himself because his sterility is equally prophesied. This deterministic framework shifts the moral weight from the act of creation to the reaction against destiny. Consequently, the play does not ask whether Banquo's line *should* exist, but rather how the characters endure the knowledge of what that existence entails. The asymmetry relies on the moral significance of bringing someone into existence, but in *Macbeth*, existence is imposed by supernatural fiat, making the prevention of lineage (Macbeth's attempt to kill Fleance) an act of rebellion against order rather than an ethical prevention of harm.

  The imagery of infanticide further clarifies where the play resists the reading. Lady Macbeth's claim that she would have dashed her nursing infant's brains out and the actual slaughter of Macduff's children are treated as the moral nadir of the tragedy, not as neutral preventions of future pain. For the asymmetry to hold, the non-existence of Macduff's children would be neutral; for the play, their destruction is an abomination that destabilizes nature itself. This suggests the play operates on a natalist assumption where potential life commands reverence, and its destruction is a greater evil than the suffering that life will endure. The horror is not that these children were born to suffer, but that their continuation was violently arrested.

  Ultimately, the "Tomorrow, and tomorrow, and tomorrow" speech confirms that the play's pessimism concerns continuation rather than creation. Macbeth does not lament that life began; he laments that it keeps going ("creeps in this petty pace from day to day"). The "tale told by an idiot" signifies nothing not because birth is a mistake, but because time dilutes meaning through repetition and inevitable decay. This distinguishes the play's early modern pessimism from modern antinatalism: the tragedy is that the line ends (for Macbeth) or that it continues meaninglessly (for everyone), not that it was started. Therefore, *Macbeth* cannot validate the generalization of the asymmetry to lineages because it values the *fact* of lineage over the *quality* of life within it, treating the extinction of a house as a metaphysical evil even when that extinction prevents future suffering.
