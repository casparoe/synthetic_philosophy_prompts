answer: |-
  hey, looks like a solid talk but you know that room is gonna chew you up if you aren't ready for the pushback. here's the prep sheet based on who's sitting there. i kept it loose so you can scan it quick on your phone during the break.

  **1. The "Universalizability" Attack (from the 8 analytic philosophers)**
  *   **How they'll say it:** "If gift-giving is a moral obligation within that network, does that mean we ought to adopt it universally? If not, on what grounds do you exempt us? Sounds like you're sliding into relativism where 'corruption' just means 'stuff we don't do'."
  *   **Quick Reply:** "Not relativism, contextualism. The moral obligation exists *because* of the specific social contract in that network. Universalizing it breaks the condition that makes it moral. It's like saying 'promises must be kept' is universal, but *what counts* as a promise varies."
  *   **Weakness:** They'll hammer you on why the *content* of the norm doesn't matter, only the form.
  *   **Concede?** No, hold the line here or your thesis disappears.

  **2. The "Power & Coercion" Check (from the visiting political theorist)**
  *   **How they'll say it:** "You're romanticizing clientelism. In the literature on *wasta* or *guanxi*, isn't it often less about moral obligation and more about survival under weak institutions? Are you calling coerced participation a 'moral obligation'?"
  *   **Quick Reply:** "Fair point. I'm distinguishing between the *internal* moral view of the agents vs the *external* structural critique. I'm arguing the act isn't inherently corrupt, not that the power dynamics are always just."
  *   **Weakness:** This is where the theorist knows way more than you. If you bluff on the anthropology, you're done.
  *   **Concede?** Yeah, concede that systemic inequality can twist these obligations. Don't defend the power structure, just the moral classification of the act.

  **3. The "Slippery Slope to Bribery" (the one you hope nobody brings up)**
  *   **How they'll say it:** "Okay, but where's the line? If I give a gift to fulfill an obligation, when does that become a bribe to bypass a rule? If you remove the Weberian standard, aren't you just giving cover for actual graft?"
  *   **Quick Reply:** "The line is transparency and reciprocity. A ritual gift is public/social and reciprocal within the network. A bribe is secret and buys a specific exception to the rules that harms the collective."
  *   **Weakness:** This is the kill shot. If you can't define the boundary clearly, the whole talk dies.
  *   **Concede?** **DO NOT CONCEDE.** You have to nail this distinction.

  **4. The "Institutional Capacity" Objection**
  *   **How they'll say it:** "Even if it's moral locally, doesn't particularism prevent state-building? You can't have a modern economy on clientelism."
  *   **Quick Reply:** "I'm making an ethical claim, not a development economics claim. My point is about labeling, not efficiency."
  *   **Weakness:** They'll say ethics and function are linked.
  *   **Concede?** Sure, admit that Weberian models might be better for scale, but insist that doesn't make the other model 'immoral'.

  ***

  **THE ONE REPLY YOU HAVE TO NAIL:**
  It's #3 (the bribery line). If you let them convince the room that your framework makes bribery impossible to identify, you lose. You need a crisp criterion for "public/ritual" vs "secret/transactional." Practice that sentence till you can say it in your sleep.

  **WHERE TO FOLD:**
  Definitely concede on #2 (the theorist). Acknowledge that power imbalances exist. It makes you look reasonable and stops them from thinking you're ignorant of the lit.

  good luck, drink some water before you start. you got this.
