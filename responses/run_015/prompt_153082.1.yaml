  # Prospectus for Independent Study: The Logical Structure of the Great Divergence

  ## I. Introduction: The Great Divergence and the Logical Turn

  The question of the "Great Divergence" stands as one of the most significant inquiries in modern economic history and macrohistorical sociology. It seeks to explain the radical discontinuity in economic development trajectories that emerged between Western Europe, specifically Britain, and the rest of the world, most notably China, beginning in the late eighteenth century. The central puzzle is not merely why Britain industrialized, but why it industrialized while other advanced agrarian empires, possessing comparable levels of technological sophistication, market integration, and demographic pressure, did not. For decades, scholarly debate has focused intensely on identifying the causal variables responsible for this split. Proposals have ranged from differences in coal geography and access to New World resources to variations in institutional structures, cultural attitudes toward innovation, and factor prices. These debates are substantive; they concern the actual mechanisms of history.

  However, beneath these substantive debates lies a prior, structural question that has received comparatively little rigorous attention. This question concerns the logical form of the comparison itself. The standard framing of the problem is contrastive: "Why did Britain industrialize rather than China?" This framing presupposes that China is the appropriate foil for Britain. It assumes that the pairing constitutes a valid controlled comparison, where the two cases share enough relevant background conditions to make the difference in outcome intelligible, yet differ enough in the putative causal factors to allow for isolation of the cause. My preliminary investigation suggests that this framing may be structurally unstable. There is a strong suspicion that the selection of China as the comparator is not independent of the outcome it is meant to explain. China is selected largely because it is known to have shared key preconditions with Britain circa 1500 yet failed to produce an industrial revolution. This makes the selection outcome-dependent.

  This proposal outlines a one-semester independent study designed to examine whether the standard framing of the Great Divergence is structurally well-posed as a contrastive historical explanation. Rather than proposing another economic or institutional cause, this study will examine the logical form of the comparison itself. The core hypothesis is that the Britain-China pairing violates a condition of reference-class independence required for robust contrastive explanation. If the foil (China) is selected because it is known to be a case of "not-P" (no industrialization) among cases that looked like "P" (Britain) beforehand, the comparison may suffer from a form of selection bias analogous to conditioning on a collider in causal inference. This creates a risk of circularity or triviality in the resulting explanation.

  The significance of this inquiry extends beyond the specific historical case of the Great Divergence. If the standard comparison is logically flawed, it suggests that much of comparative macrohistory may be built on unstable foundations. Conversely, if the comparison can be vindicated, it requires a clarification of the conditions under which outcome-dependent selection is permissible in historical explanation. This study aims to bridge the gap between the philosophy of science, which provides tools for analyzing explanation, and economic history, which provides the empirical substance. By formalizing the criteria used to justify the Britain-China pairing and testing them against conditions of logical independence, this project seeks to produce a determinate, generalizable criterion for well-posed contrastive questions in comparative history.

  The scope of this study is conceptual and methodological. It does not involve primary archival research or the generation of new economic data. Instead, it involves a critical reconstruction of existing arguments in the literature to extract their implicit logical structures. The deliverable will be a paper of approximately 5,000 words that articulates the structural problem, evaluates the current literature's handling of it, applies the proposed three-phase method, and concludes with a normative assessment of the comparison's validity. This prospectus details the problem statement, the gap in current literature, the proposed methodology, the criteria for success and failure, and an assessment of feasibility.

  ## II. Statement of the Structural Problem

  To understand the structural problem at the heart of this proposal, it is necessary to first articulate the logical requirements of contrastive explanation. In the philosophy of science, an explanation is often understood not as an answer to a question of the form "Why P?" but rather "Why P rather than Q?" Here, P is the fact to be explained (the explanandum), and Q is the foil or contrast case. For an explanation to be adequate, it must cite a cause that distinguishes P from Q. This implies that P and Q must share a common background of conditions that are causally relevant, such that the difference in outcome can be attributed to a specific difference in antecedent conditions. If P and Q differ in too many ways, the explanation becomes diffuse; if they differ in too few ways, the contrast becomes trivial.

  The structural problem arises in the selection of Q. Philosophical accounts of contrastive explanation generally assume that the foil Q is specified as a live alternative independently of observing that P occurred. In other words, the choice of the contrast case should be motivated by theoretical or empirical reasons that exist prior to knowing the outcome. However, in the case of the Great Divergence, the selection of China appears to be driven by the outcome itself. Historians select China because it is the most prominent example of a society that looked like Britain in the pre-industrial era but did not industrialize. This creates a potential logical circularity. If we select a comparator specifically because it failed to industrialize despite having similar preconditions, we are effectively selecting on the dependent variable.

  In statistical and causal inference terms, this resembles selection bias. When a sample is chosen based on the value of the outcome variable, the relationship between independent variables and the outcome can be distorted. In the context of historical explanation, this manifests as a risk that the comparison is rigged to find a difference. By choosing a foil that is known to have failed, the historian ensures that a difference exists. The challenge is to determine whether this difference is causally relevant or merely an artifact of the selection process. If the criteria used to select China as a comparator include knowledge of its non-industrialization, then the comparison may not be testing a hypothesis but rather illustrating a known fact.

  This problem is compounded by the temporal distance involved. The preconditions cited as shared between Britain and China (e.g., market integration, technological levels) are often reconstructed retrospectively. There is a risk that these shared preconditions are exaggerated to make the divergence seem more puzzling than it actually was. If the similarity between Britain and China circa 1500 is overstated, then the contrast is ill-posed because the background conditions were not actually comparable. Conversely, if the similarity is accurate, but the selection of China was driven by the knowledge of the divergence, the comparison may still be valid provided the causal mechanism is specified ex ante. The structural problem, therefore, is not necessarily that the comparison is false, but that its logical justification is often implicit and potentially vulnerable to charges of outcome-dependence.

  The core question this study addresses is whether the standard framing of the Great Divergence satisfies the conditions for a well-posed contrastive explanation. Specifically, it asks: Can a comparator be selected based on shared preconditions and divergent outcomes without violating the independence conditions required for causal inference? If the selection is outcome-dependent, does this invalidate the explanation, or is it a permissible feature of historical inquiry where controlled experiments are impossible? This requires a precise analysis of the selection criteria used in standard accounts. Are the criteria defined in terms of observable characteristics available at the start of the period (ex ante), or are they defined in terms of the outcome itself (ex post)? If the latter, the explanation risks being tautological.

  Furthermore, the problem touches on the nature of historical possibility. When we ask "Why Britain rather than China?", we imply that China was a live candidate for industrialization. If China was never a live candidate due to some deep structural factor unknown to contemporaries, then the contrast is counterfactual rather than actual. The structural problem thus involves distinguishing between a contrast based on actual historical alternatives and a contrast based on retrospective similarity. This distinction is crucial for determining the validity of the explanation. If the comparison relies on a counterfactual similarity that did not exist in reality, the explanation may be philosophically coherent but historically vacuous.

  This study will formalize this problem by defining a condition of "Reference-Class Independence." This condition requires that the criteria for selecting a comparator be specifiable without reference to the outcome variable. If the selection of China requires knowing that China did not industrialize, the condition is violated. The study will then investigate whether violations of this condition are fatal to the explanation or whether they can be mitigated by other factors, such as the robustness of the causal mechanism. This formalization provides the groundwork for the methodological phases outlined later in this proposal.

  ## III. The Gap in Contemporary Discourse

  The structural problem identified above sits at an intersection that is currently under-theorized. On one side stands the literature of economic history and the "California School" of macrohistory. On the other stands the philosophy of science, specifically the literature on contrastive explanation and causal inference. Neither side has fully addressed the logical implications of the other's practices, leaving a gap that this independent study aims to fill.

  In the field of economic history, the Britain-China comparison is generally taken as unproblematic. Scholars focus on substantiating the claims of similarity and difference. Debates center on whether wages were actually comparable, whether coal deposits were accessible, or whether institutions were inclusive enough. The validity of the comparison itself is rarely questioned because it is seen as a pragmatic necessity. To explain a unique event like the Industrial Revolution, historians need a control case. China is the obvious choice because it is the largest, most advanced non-European economy of the period. Historians argue that the comparison is justified by the empirical evidence of similarity in living standards and technology circa 1500. However, this justification often conflates empirical similarity with logical validity. Even if China was similar to Britain, the question remains whether selecting China *because* it did not industrialize introduces a bias that undermines the causal inference. Economic historians typically do not engage with the philosophical literature on selection bias in contrastive explanation, treating the comparison as a matter of empirical degree rather than logical form.

  Conversely, philosophical treatments of contrastive explanation rarely test themselves against large-scale comparative history. The standard examples in the philosophy of science are often drawn from physics, biology, or everyday events (e.g., "Why did the window break rather than the door?"). These examples involve clear causal mechanisms and well-defined contrast classes. Macrohistory presents a different challenge. The variables are complex, the data is sparse, and the events are unique. Philosophers have developed sophisticated accounts of what makes an explanation contrastive, but they have not applied these accounts to the specific methodological challenges of global history. There is little work on whether the conditions for contrastive explanation can be met when the contrast case is selected retrospectively from a pool of historical entities. The philosophical literature tends to assume that the foil is given or obvious, without interrogating the process by which historians select their foils.

  This disconnect creates a situation where economic historians may be employing logically fragile comparisons without realizing it, while philosophers may be developing theories of explanation that are inapplicable to the most significant historical questions. The gap is particularly evident in the treatment of counterfactuals. Historians often use implicit counterfactuals ("China could have industrialized if...") to justify the comparison. Philosophers analyze counterfactuals rigorously but rarely in the context of macrohistorical selection bias. There is no established framework for evaluating whether a historical comparison is "well-posed" in the logical sense.

  Furthermore, existing literature often conflates the validity of the comparison with the truth of the explanation. A comparison can be logically well-posed but lead to a false conclusion, or it can be logically ill-posed but lead to a true conclusion by luck. The current discourse focuses on the truth of the conclusion (e.g., "Did coal cause the divergence?") rather than the validity of the question (e.g., "Is 'Britain vs. China' a valid question?"). This proposal argues that the validity of the question is a prerequisite for evaluating the truth of the answer. If the comparison is structurally flawed, the resulting causal claims may be unintelligible regardless of their empirical support.

  By bringing these two bodies of literature into conversation, this study aims to clarify the logical standards for comparative history. It will not seek to overturn the findings of economic history but to scrutinize the framework within which those findings are produced. This requires a interdisciplinary approach that respects the empirical constraints of history while applying the logical rigor of philosophy. The goal is to produce a criterion that historians can use to evaluate their own comparisons and that philosophers can use to test the limits of their theories. This gap in the literature represents a significant opportunity for conceptual clarification that could impact how macrohistorical questions are framed in the future.

  ## IV. Proposed Methodology: A Three-Phase Protocol

  To address the structural problem and bridge the gap in the literature, this study will employ a three-phase method. This method is designed to be executable within a single semester without primary archival research. It relies on the critical analysis of secondary literature and the application of logical frameworks. The three phases are: Formalizing Selection Criteria, Applying the Independence Condition, and Evaluating Tolerance for Outcome-Dependence.

  **Phase One: Formalizing Explicit and Implicit Selection Criteria**

  The first phase involves a reconstructive analysis of standard accounts of the Great Divergence. The objective is to extract the explicit and implicit criteria used to justify the pairing of Britain and China. This will involve reviewing key arguments in the literature to identify the properties attributed to both regions circa 1500. Common criteria include population size, agricultural productivity, level of technological development, degree of market integration, and state capacity.

  The task is to categorize these criteria into two types: ex ante characteristics and ex post observations. Ex ante characteristics are those that could have been observed by a contemporary observer in 1500 without knowledge of the future. Ex post observations are those that rely on knowledge of the subsequent divergence. For example, "having a large population" is an ex ante characteristic. "Failing to industrialize despite having a large population" is an ex post observation. The analysis will determine whether the justification for the comparison relies primarily on ex ante characteristics or if it implicitly depends on ex post observations.

  This phase will produce a formalized list of selection criteria. Each criterion will be tagged as either independent of the outcome or dependent on the outcome. This will allow for a precise assessment of the degree of outcome-dependence in the standard framing. The output of this phase will be a structured map of the logical assumptions underlying the Great Divergence comparison. This map will serve as the basis for the testing in Phase Two.

  **Phase Two: Applying a Reference-Class Independence Condition**

  The second phase involves applying a logical test to the criteria identified in Phase One. This test is the "Reference-Class Independence Condition." This condition states that a comparator is validly selected only if the criteria for its selection do not require knowledge of the outcome variable. In causal inference terms, the selection into the treatment and control groups must not be conditioned on the outcome.

  To apply this condition, I will simulate a selection process based solely on the ex ante criteria identified in Phase One. I will ask: If we selected comparators based only on characteristics available in 1500 (e.g., empire size, technology level), would China necessarily be selected? Or would other regions also qualify? If other regions qualify but are excluded from the comparison, why are they excluded? If the exclusion is based on their outcome (e.g., they industrialized too, or they collapsed too early), then the selection is outcome-dependent.

  This phase will also involve testing the robustness of the comparison. If the selection criteria are relaxed to include other regions, does the causal explanation hold? For example, if we compare Britain to other European regions rather than China, does the explanation change? This tests whether the Britain-China pairing is uniquely informative or merely one of many possible pairings. The application of the Independence Condition will reveal whether the standard framing violates logical norms for causal comparison. If it does, the violation will be quantified in terms of the degree of outcome-dependence.

  **Phase Three: Evaluating Tolerance for Outcome-Dependent Selection**

  The third phase is normative. It addresses the question: Can macrohistorical explanation tolerate outcome-dependent comparator selection if the causal mechanism is specified ex ante? In experimental science, selection on the dependent variable is generally forbidden. However, history is not experimental. Historians must work with available data and unique events. It is possible that some degree of outcome-dependence is unavoidable in historical inquiry.

  This phase will evaluate whether the violation of the Independence Condition is fatal to the explanation. I will examine arguments that might justify outcome-dependent selection. For example, one might argue that the purpose of the comparison is not to prove causality but to highlight Puzzles. If the goal is to explain a puzzle, then selecting a case that creates a puzzle (similar preconditions, different outcome) is methodologically sound, even if it is outcome-dependent. The explanation is valid if it resolves the puzzle, not if the selection was independent.

  Alternatively, I will examine whether specifying the causal mechanism ex ante mitigates the selection bias. If the historian proposes a cause (e.g., coal) before looking at the outcome, does it matter that the comparator was selected based on the outcome? This phase will weigh the costs and benefits of outcome-dependent selection. It will seek to determine if there is a threshold of dependence beyond which the explanation becomes invalid. The output of this phase will be a set of normative guidelines for constructing contrastive historical questions. These guidelines will specify when outcome-dependence is permissible and when it renders the question ill-posed.

  Together, these three phases provide a comprehensive framework for analyzing the logical structure of the Great Divergence. They move from descriptive analysis to logical testing to normative evaluation. This progression ensures that the study does not merely criticize the existing literature but offers a constructive path forward. The method is designed to be rigorous enough to satisfy philosophical standards while remaining grounded in the realities of historical practice.

  ## V. Criteria for Success and Failure

  To ensure the study produces a determinate result, clear criteria for success and failure must be established. The goal is not merely to write a paper but to resolve the structural question posed in the introduction. Success is defined as the production of a generalizable criterion for well-posed contrastive questions in comparative history, with the Britain-China case serving as the test case. Failure is defined as a collapse into either blanket skepticism about all contrastive history or a permissive stance that renders the criterion useless.

  **Success Conditions**

  Success will be achieved if the study produces a clear, actionable criterion that distinguishes between valid and invalid contrastive frames. This criterion must be generalizable beyond the Great Divergence. It should be applicable to other comparative historical questions, such as the rise of Rome or the decline of the Ming Dynasty. The criterion must balance logical rigor with historical feasibility. It should not demand impossible standards of independence that no historical comparison could meet, but it should also not allow any comparison to pass regardless of selection bias.

  Specifically, success looks like a formal statement such as: "A contrastive historical question 'Why P rather than Q?' is well-posed if and only if the selection criteria for Q are specifiable using only information available at time T-1, unless the causal mechanism M is specified independently of the outcome." If the study can defend such a statement and demonstrate its application to the Britain-China case, it will have met its primary objective. Additionally, success involves clarifying the status of the Great Divergence question. The study should conclude with a definite verdict: either the standard framing is logically valid, invalid, or valid under specific conditions. Ambiguity is acceptable only if it is structured ambiguity (e.g., "Valid for puzzle-solving, invalid for causal inference").

  **Failure Conditions**

  Failure would occur if the study concludes that all contrastive history is logically flawed. This would be a form of blanket skepticism that renders the criterion useless because it offers no guidance for improvement. If the analysis shows that outcome-dependence is inherent to all historical selection, and that this invalidates all explanation, the study fails to provide a constructive tool. Conversely, failure would also occur if the study concludes that any comparison is permissible regardless of selection bias. This permissive stance would undermine the logical rigor the study seeks to introduce. If the criterion is so loose that it validates any pairing, it fails to distinguish between good and bad questions.

  Another form of failure is getting bogged down in the historical details of the Great Divergence itself. If the study devolves into debating whether wages were actually equal in 1500, it loses focus on the structural problem. The focus must remain on the logical form, not the empirical content. Finally, failure would result if the proposed criterion is too technical or abstract to be useful to historians. The deliverable must be accessible to scholars in both philosophy and history. If the language is too specialized, the bridge between disciplines will not be built.

  **Intermediate Outcomes**

  Even if the primary success conditions are not fully met, intermediate outcomes can still be valuable. For example, the study might successfully formalize the selection criteria (Phase One) but remain inconclusive on the normative evaluation (Phase Three). This would still contribute to the literature by making the implicit assumptions explicit. Similarly, the study might identify specific types of outcome-dependence that are more problematic than others. These intermediate findings will be reported transparently. The goal is to advance the conversation, even if a final verdict is not reached. However, the design of the study is such that a determinate conclusion is expected given the scope.

  ## VI. Feasibility and Scope Assessment

  This independent study is designed to be completed within a single semester, typically consisting of 15 weeks. The scope is limited to conceptual analysis and secondary literature review. No primary archival research or original economic data collection is required. This ensures that the project is feasible within the time constraints. The workload is distributed across the three phases outlined in the methodology, with additional time allocated for writing and revision.

  **Timeline**

  *Weeks 1-3: Literature Review and Problem Definition.*
  The first three weeks will be dedicated to reviewing the relevant literature in economic history and philosophy of science. This involves reading key texts on the Great Divergence to understand the standard arguments and reading key texts on contrastive explanation to understand the logical requirements. The output of this phase will be a detailed annotated bibliography (for personal use) and a refined problem statement. This phase ensures that the study is grounded in current debates.

  *Weeks 4-6: Phase One (Formalizing Criteria).*
  During this period, I will focus on extracting and categorizing the selection criteria used in the literature. This involves close reading of arguments to identify implicit assumptions. The output will be a structured list of criteria tagged by their dependence on outcome knowledge. This phase requires careful attention to detail to ensure accurate reconstruction of the arguments.

  *Weeks 7-9: Phase Two (Independence Condition).*
  This phase involves applying the logical test to the criteria. I will simulate the selection process and evaluate the robustness of the comparison. This may involve thought experiments and logical modeling. The output will be an assessment of the degree of outcome-dependence in the standard framing. This phase is the core analytical work of the study.

  *Weeks 10-12: Phase Three (Normative Evaluation).*
  Here, I will evaluate the implications of the findings. I will consider arguments for and against tolerating outcome-dependence. This phase involves synthesizing the logical analysis with normative considerations about historical method. The output will be a draft of the normative guidelines.

  *Weeks 13-15: Writing and Revision.*
  The final three weeks will be dedicated to writing the 5,000-word paper and revising it for clarity and coherence. This includes ensuring that the argument flows logically from the problem statement to the conclusion. I will also ensure that the tone is appropriate for an academic application.

  **Limitations and Risks**

  The primary limitation of this study is its reliance on secondary literature. I will not be verifying the historical claims myself (e.g., I will not check wage data). This means the study accepts the historical premises as given for the sake of logical analysis. If the historical premises are fundamentally wrong, the logical analysis may be sound but historically irrelevant. However, this risk is mitigated by focusing on the structure of the argument rather than the truth of the premises. Even if the data is wrong, the logical form can still be evaluated.

  Another risk is the complexity of the philosophical concepts. Contrastive explanation and causal inference are technical fields. There is a risk of misapplying these concepts to history. To mitigate this, I will stick to the standard accounts of contrastive explanation and avoid overly technical formalisms unless necessary. The goal is clarity, not technical showmanship.

  Finally, there is the risk of scope creep. The Great Divergence is a vast topic. It is easy to get distracted by substantive debates. I will maintain discipline by focusing strictly on the selection criteria and logical form. Any discussion of substantive causes (coal, institutions) will be limited to how they are used in the comparison, not their actual validity.

  **Resource Requirements**

  The study requires access to academic libraries and databases for the literature review. As a software engineer, I have access to technical resources for managing references and organizing notes. No specialized software is required, though tools for logical modeling or diagramming may be useful for Phase Two. The primary resource is time. The 15-week timeline is tight but manageable given the focused scope.

  **Conclusion on Feasibility**

  Given the constraints and resources, this project is highly feasible. The lack of primary research reduces the time burden significantly. The conceptual nature of the work allows for flexibility in scheduling. The three-phase method provides a clear roadmap that prevents drift. The expected output of 5,000 words is appropriate for the scope; it allows for depth without requiring a book-length treatment. The study is designed to be a focused intervention in a specific debate, which increases the likelihood of completion.

  ## VII. Conclusion: Significance of the Inquiry

  This independent study proposes a shift in perspective regarding one of the most famous questions in economic history. By moving from the substantive to the structural, it seeks to clarify the logical foundations of comparative history. The hypothesis that the Britain-China comparison may be outcome-dependent challenges the standard methodology without denying the empirical findings. It offers a way to refine historical questioning rather than reject historical knowledge.

  The significance of this inquiry lies in its potential to improve the rigor of macrohistorical explanation. If successful, the study will provide a tool for historians to evaluate their own comparisons. It will encourage a more reflexive approach to selecting foils and framing questions. For philosophers, it offers a test case for theories of explanation in a complex, real-world domain. It bridges the gap between abstract theory and concrete practice.

  For me as a software engineer, this study represents an opportunity to apply skills in logical analysis and systems thinking to a humanistic problem. The structural critique of the Great Divergence mirrors the debugging of a complex system. Just as a software engineer checks for selection bias in data training sets, this study checks for selection bias in historical training sets. The interdisciplinary nature of the project aligns with my background and interests.

  The deliverable will be a polished paper that stands as a contribution to the methodology of history and philosophy. It will not solve the Great Divergence, but it will clarify the question. In doing so, it may prevent future scholars from asking ill-posed questions. This is a modest but meaningful goal. The study is feasible, focused, and theoretically grounded. It promises to yield insights that are relevant beyond the specific case of Britain and China. I am confident that with the proposed methodology and timeline, I can produce a high-quality result that meets the standards of an independent study.

  The structural integrity of historical explanation is a foundational issue. By examining the beams and joints of the Great Divergence framework, this study aims to ensure that the house of macrohistory is built on solid logical ground. The proposal outlines a clear path to achieve this, balancing philosophical rigor with historical sensitivity. I look forward to undertaking this work and contributing to the ongoing dialogue between history and philosophy.
