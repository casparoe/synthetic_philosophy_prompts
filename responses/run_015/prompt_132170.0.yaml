prompt: |-
  Take the collapse of Lehman Brothers in September 2008 and the subsequent global financial crisis as your episode. Apply to it a variant of the doomsday argument—an institutional Copernican principle—according to which an institution’s founding order among comparable bodies gives a probabilistic prediction of its lifespan, provided that institutional "death" is unambiguous and rescue is impossible. Map the reasoning onto three actual bodies: Lehman Brothers (founded in the 1840s, liquidated in 2008 without state rescue), Bear Stearns (founded in the 1920s, absorbed via a government-brokered acquisition in March 2008), and the Federal Reserve System (established in 1913, still operating). For each, state what its position in the relevant sequence predicts about its remaining lifespan, treating merger, liquidation, or regulatory restructuring as analogues of survival or extinction. Then examine where the analogy breaks down: does the possibility of state-backed rescue invalidate the self-sampling assumption? Is institutional "death" well-defined when Lehman’s assets and staff were dispersed rather than annihilated? Does the 2008 crisis show that institutions, unlike individual humans, can undergo partial survival, and how does that affect the endpoint condition on which the original argument depends? Finally, say what this episode reveals about Carter’s and Gott’s formulations of the doomsday argument—whether it demonstrates that the argument requires an unambiguous, non-rescuable endpoint, or whether ambiguous endpoints merely weaken the prediction without destroying it. Please write your answer in British English.
