answer: |-
  **Note on Case Selection:** I have dropped the **Ridley Reactor** from the memo text. It reduplicates the **Cinder Field**: both represent complex, non-replicating chemical systems. The Cinder Field is the stronger case for your narrative because it is natural and ecologically linked to the active vent, making it a direct control for the drilling stakes. The Ridley Reactor is a lab artifact and adds unnecessary conceptual clutter.

  ***

  **JOINT STATUS MEMORANDUM: VENT FIELD 8-ALPHA**
  **TO:** Exoplanetary Classification Board
  **FROM:** Dr. Aris Thorne (Metabolic Systems) & Dr. Lena Kaito (Information Dynamics)
  **DATE:** 2147.11.04
  **SUBJECT:** Classification of Plume Filaments and Associated Chemistries

  **1. AGREED EMPIRICAL CLAIMS**
  After eleven months of joint observation and stress-testing, the undersigned agree on the following physical behaviors. No interpretive weight is attached to these claims in this section.

  1.  **Plume Filaments (Active Vent):** The filaments maintain an internal chemical gradient distinct from the surrounding vent fluid. They repair physical damage to their structure within 4–12 hours. They replicate sequence-patterns with heritable variation, but *only* when anchored to the specific mineral lattice of the chimney wall. Detached filaments maintain metabolism but cease replication indefinitely.
  2.  **Kestrel Agent (Host-Associated):** The agent possesses no independent metabolism. It is chemically inert outside a host cell. Inside a host, it commandeers metabolic machinery to produce copies of itself. It undergoes rapid Darwinian evolution within the host environment.
  3.  **Cinder Field (Dormant Vent):** Chemically identical to the Active Vent filaments but operating at <0.1% reaction velocity. Structures accumulate over centuries. No replication events have been observed in the last 400 years. Gradients are maintained passively by residual thermal heat, not active pumping.
  4.  **System Boundaries:** In all three cases, there is no lipid membrane separating the "internal" chemistry from the environment. Exchange is continuous.

  **2. CLASSIFICATION DIVERGENCE**
  We cannot agree on a single binary classification (Alive/Not Alive). The following table presents the conflicting interpretations required by our respective theoretical frameworks. The Board must select which framework governs Permit 8-Alpha.

  | Feature | Metabolism-First Interpretation (Thorne) | Information-First Interpretation (Kaito) |
  | :--- | :--- | :--- |
  | **Primary Unit of Life** | The **Filament-Chimney Complex**. The mineral surface is a functional organ, not just a substrate. Life is the process of maintaining the gradient. | The **Sequence Pattern**. The chemical instantiation is temporary; the information lineage is the persistent entity. |
  | **Status of Filaments** | **Alive.** They actively maintain far-from-equilibrium chemistry. The dependency on the wall is analogous to a gut microbiome's dependency on a host. | **Conditionally Alive.** They are alive only when replicating. When detached, they are "metabolically active dormant matter," similar to a seed, but without the *potential* to replicate elsewhere, they are merely chemistry. |
  | **Status of Kestrel** | **Not Alive.** It is a tool used by the host. A hammer does not become a carpenter because it builds a house. | **Alive.** It is the primary unit of selection. The host is merely the environment in which the Kestrel lives. |
  | **Status of Cinder** | **Dormant Life.** The process has slowed but the self-maintenance persists. It is hibernating. | **Dead.** The lineage has terminated. Without replication, there is no evolution, therefore no life. |
  | **Recommended Action** | **Protect.** The chimney is a biological organ. Drilling destroys the organism. | **Drill.** The replication is substrate-locked. The "life" cannot migrate. The site is a mine, not a habitat. |

  **3. CRUXES AND PREDICTIVE TESTS**
  The following experiments would resolve the disagreement. We have pre-registered our predictions. If the Board funds these, a final memo will follow.

  **Crux A: The Substrate Independence Test**
  *Question:* Is the inability to replicate off-vent a permanent biological constraint or an environmental suppression?
  *Test:* Transport active filaments to a synthetic mineral lattice with identical composition but different crystalline structure in a pressurized lab module.
  *   **Thorne Prediction:** Filaments will attempt to repair the lattice to match the native chimney. If they fail to replicate, it confirms the "organ" is the natural chimney, not the chemistry. (Supports Protection).
  *   **Kaito Prediction:** Filaments will adapt within 50 generations to replicate on the synthetic lattice. If they adapt, the life is in the *code*, not the rock. (Supports Drilling, as life is portable).

  **Crux B: The Cinder Re-animation Test**
  *Question:* Is the Cinder Field dead or hibernating?
  *Test:* Introduce fresh activated building blocks to the Cinder Field structures.
  *   **Thorne Prediction:** Structures will resume active gradient maintenance immediately. They are waiting for fuel. (Supports Protection of Cinder Field too).
  *   **Kaito Prediction:** No replication will occur. The information lineage is broken. Chemistry will resume, but it is just a reaction, not a resurrection. (Supports Drilling).

  **4. SEMANTIC NOTE: WORDS VS. WORLD**
  We have identified one area where our disagreement is terminological, not empirical. We agree on what the matter *does*; we disagree on what noun to assign it.

  *   **The Issue:** The definition of "Individual."
  *   **Why it is Semantic:** Thorne defines an individual by its spatial boundary (where the self-maintenance stops). Kaito defines an individual by its temporal continuity (where the information persists).
  *   **Resolution:** If the Board requires a legal definition of "Individual" for protection statutes, this must be legislated, not discovered. Science can describe the coupling of the filament to the wall; it cannot dictate whether that coupling constitutes "one being" or "two interacting systems." We recommend the Board treat "Life" as a spectrum for regulatory purposes rather than a binary switch.

  **5. SIGNATURES**

  *Aris Thorne*
  *Lead, Metabolic Systems*

  *Lena Kaito*
  *Lead, Information Dynamics*

  ***

  **Private Notes (Post-Signing)**

  **Thorne:** She caved on the Kestrel. She let me call it a "tool" in the text even though she knows it evolves. She's tired of fighting the virus battle.

  **Kaito:** He caved on the Cinder. He signed off that it's "dormant" not "dead," but he knows the gradient is passive. He just needed a word that lets him sleep at night while the drill bits spin.
