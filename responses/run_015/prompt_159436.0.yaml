prompt: |-
  Hey — I need a teaching plan, not an explanation of Smith himself (I've read the chapters, I don't need them summarized). I'm running a fifty-minute discussion section next week for first-years in an intro ethics course. They've just come out of Mill and then Kant's formula of universal law, and the reading is a couple of chapters from Smith's Theory of Moral Sentiments on sympathy and the impartial spectator. I ran this section last year and it went badly: everyone walked out convinced Smith was basically a vaguer, kinder rule-utilitarian with a bit of interior monologue bolted on, one student said "so the impartial spectator is just your conscience" and I flubbed the answer, and by the end the only thing that had landed was that Smith is the capitalism guy. So: what has to come first and what depends on what — I'm guessing that sympathy as imaginative projection of someone's *situation* (rather than catching their feeling) has to be in place before propriety, and propriety before the spectator, and that the bit about general rules has to come *after* the spectator rather than before, but I'm not confident about the order or about what to leave for last.

  Two things I want built in, and I want you to tell me if either is a mistake. First, I want to teach the spectator as the destination of a loop rather than as a little person in your head: you notice you're partial, you imagine a well-informed bystander, you notice that you've rigged *that* bystander in your favour too, you imagine someone watching him, and the impartial spectator is what the sequence settles toward — the thing the recursion converges on. I like it because it explains why the spectator isn't just "what my actual peers think" without me having to dodge the relativism objection with a hand-wave, but I don't know where the framing breaks or whether it smuggles in something Smith doesn't want. Second, the hard bit as I see it is that Smith's question is about whether a passion is *proportionate* to what provoked it — the volume of the sentiment, not the rightness of the act — and I need one metaphor to carry that. I've been toying with photographic exposure versus a volume knob versus tuning an instrument; tell me which one to build the section around, what that metaphor has to have and what it must not have (I worry exposure implies a single correct setting and the knob implies more is just more), and give me the one concrete case to hang it on. I was thinking of something where the action isn't clearly wrong — someone getting visibly, disproportionately angry at a friend who turned up forty minutes late, at a table where everyone else is laughing it off — but say if a case about *resentment at a slight* is the wrong choice, and why.

  Then the misconception map, with a place in the sequence for each: the spectator as conscience; the spectator as Kant re-labelled or as Mill's impartial benevolent spectator, given that they've just had both and that all three words start with "impartial"; sympathy read as empathy or as pity/benevolence; the collapse into "morality is just what the people around you would think"; and whatever they'll form from the metaphor I use. Also: should I raise at all, at this level, whether the spectator is merely a well-informed ordinary person or something more idealized — and if not, what should I openly refuse to explain and say out loud that I'm refusing? Finally, a check: one question or task I can put to them in the last five minutes that would show they've got the structure rather than just being agreeable or just uncomfortable — ideally something that separates the spectator from the average opinion of their friends and from a rule, and something that would let me tell the difference between a student who understands it and one who has only learned to say "it depends on propriety". I'm not asking for extra readings, just the arc.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Goal:** A 50-minute discussion section plan for first-year intro ethics students.
      *   **Text:** Adam Smith, *The Theory of Moral Sentiments* (specific chapters on sympathy and the impartial spectator).
      *   **Context:** Students just finished Mill (Utilitarianism) and Kant (Formula of Universal Law). Last year's section failed (Smith reduced to vague rule-utilitarianism + conscience; "capitalism guy" stereotype stuck).
      *   **Instructor's Hypotheses:**
          *   Order: Sympathy (imaginative projection) $\rightarrow$ Propriety $\rightarrow$ Impartial Spectator $\rightarrow$ General Rules.
          *   Idea 1: Teach Spectator as a *convergent loop/recursion* (not a little person).
          *   Idea 2: Teach Propriety as *proportionality of passion* (volume/tuning/exposure). Needs a metaphor and a concrete case (currently thinking: anger at a late friend).
      *   **Specific Questions:**
          *   Is the "loop" idea sound?
          *   Which metaphor works best (exposure, volume, tuning)?
          *   Is the "late friend/anger" case appropriate?
          *   Where to place misconceptions in the sequence?
          *   Should the idealization of the Spectator be raised?
          *   What is the final 5-minute check task?

  2.  **Evaluate the Instructor's Hypotheses:**

      *   **Sequence:** Sympathy $\rightarrow$ Propriety $\rightarrow$ Spectator $\rightarrow$ Rules.
          *   *Verdict:* Correct. Smith builds the Spectator *out of* the dynamics of sympathy and propriety. You can't understand the judge without understanding what is being judged (propriety of sentiment) and the mechanism of judgment (sympathy). Rules are derivative generalizations from repeated spectator judgments.
      *   **Idea 1 (The Loop/Recursion):**
          *   *Verdict:* Strong. It avoids the "homunculus" problem (who watches the watcher?). It captures Smith's idea that we strive for a standpoint that corrects our natural bias. It distinguishes Smith from simple social conformity (actual peers) because the recursion aims for *impartiality*, not just agreement. *Caveat:* Don't make it sound like an infinite regress that never resolves. It converges on a standard of "what a well-informed, neutral human would feel."
      *   **Idea 2 (The Metaphor):**
          *   *Options:* Photographic exposure (implies one right setting), Volume knob (implies more = louder/better), Tuning an instrument.
          *   *Verdict:* **Tuning an instrument** is best.
              *   *Why:* It implies harmony between the observer and the observed. Smithian sympathy is about the *spectator's* emotion matching the *agent's* emotion. If the agent is too loud (angry), the spectator can't match it (discord). If the agent is too quiet (indifferent to grave injury), the spectator can't match it. It's about *resonance*, not just magnitude.
              *   *Avoid:* Volume knob (implies the goal is just to lower anger, not to match the occasion). Exposure (implies a technical "correctness" rather than an interpersonal harmony).
      *   **The Case (Anger at Late Friend):**
          *   *Verdict:* Good, but needs nuance. If everyone else is laughing, the spectator might judge the anger as disproportionate *relative to the group norm*, but Smith cares about the *object* of the passion. Is 40 minutes late a grave injury? If yes, anger is proper. If no, it's not. The key is the *mismatch* between the agent's feeling and what the spectator can enter into.
          *   *Refinement:* Use a case where the *action* is neutral, but the *passion* is the variable. Grief is often Smith's go-to, but anger works for "propriety." Let's stick with the anger/late friend but ensure the focus remains on the *feeling*, not the rule about lateness.

  3.  **Address the Misconceptions:**
      *   *Spectator as Conscience:* Address early when introducing the Spectator. Distinguish "inner voice" (Kant/Religious) from "imagined other" (Smith).
      *   *Spectator as Kant/Mill:* Address after the Spectator is defined. Kant = Reason/Duty. Mill = Calculation of Happiness. Smith = Sentiment/Propriety.
      *   *Sympathy as Empathy/Pity:* Address immediately at the start. Smith = "Fellow-feeling" via imagination, not catching feelings or pitying.
      *   *Relativism (Peer Opinion):* Address during the "Loop" explanation. The Spectator corrects the peers.
      *   *Metaphor Misconception:* Address during the metaphor application.

  4.  **Address the "Idealization" Question:**
      *   *Verdict:* Don't get bogged down in the metaphysics of the Spectator (God? Ideal Self? Society?) for first-years in 50 mins.
      *   *Strategy:* Explicitly bracket it. Say: "Smith wobbles on whether this is an idealized version of us or a divine stand-in. For today, we treat it as a *methodological tool* for correcting bias." This shows intellectual honesty without derailing the lesson.

  5.  **Drafting the Plan (Iterative Process):**

      *   *0-5 mins:* Hook & Sympathy Definition. Kill the "Empathy/Pity" misconception immediately.
      *   *5-15 mins:* Propriety & The Metaphor. Use the Tuning Fork metaphor. Run the "Late Friend" case.
      *   *15-30 mins:* The Impartial Spectator (The Loop). Build it from the failure of immediate sympathy. Address Conscience/Kant/Mill misconceptions here.
      *   *30-40 mins:* General Rules & Relativism. Explain rules come *after* judgments. Address the "Peer Opinion" misconception.
      *   *40-45 mins:* Idealization Bracket.
      *   *45-50 mins:* The Exit Ticket/Check.

  6.  **Refining the Exit Ticket:**
      *   Needs to distinguish Spectator from Average Opinion and from Rules.
      *   *Idea:* A scenario where the "Average Opinion" is wrong (biased) and the "Rule" is too rigid, but the Spectator sees the nuance of the passion.
      *   *Scenario:* A whistleblower. Friends say "don't snitch" (Average Opinion). Rule says "always tell truth" (Kant) or "maximize utility" (Mill). Smith's Spectator asks: "Is the resentment against the corruption proportionate to the harm, and can a neutral observer enter into it?"
      *   *Simpler Idea:* The "Grieving Parent" case.
          *   Friends: "Get over it" (Average).
          *   Rule: "Grief is irrational" (Stoic/Kant-ish).
          *   Spectator: "I cannot feel your full pain, but I judge your expression of it based on what I *could* feel if I were in your place."
      *   *Best Task:* Ask them to adjudicate a case where the *crowd* is partial. The "Late Friend" case actually works if modified: The friends are laughing (social pressure), but the lateness caused a real disaster. The Spectator ignores the laughing friends and looks at the *cause*.
      *   *Decision:* Let's use a "Disproportionate Grief" case. It highlights the *passion* focus better than anger. Actually, the prompt asked for a check that separates Spectator from Average Opinion *and* Rule.
      *   *Revised Task:* "A soldier refuses an order because it endangers civilians unnecessarily, but not enough to violate a strict rule of war. His comrades call him a coward (Average Opinion). The Rule says 'Obey.' How does Smith evaluate him?"
      *   *Wait, keep it simple.* Let's stick to the "Late Friend" but add a twist. The friends are laughing (Social Pressure). The lateness caused a missed flight (Objective Harm).
      *   *Prompt:* "Write one sentence: Why does the Impartial Spectator condemn the anger *differently* than (a) your friends at the table and (b) a moral rule book?"

  7.  **Review against Constraints:**
      *   50 minutes.
      *   First-years.
      *   No summary of Smith.
      *   Address the "Loop" and "Metaphor" specific queries.
      *   Misconception map included.

  8.  **Final Polish:**
      *   Ensure the "Loop" explanation is clear (it's a correction mechanism).
      *   Ensure the "Tuning" metaphor is precise (harmony between agent and spectator).
      *   Make sure the "Idealization" bracket is explicit.
      *   Check the flow: Sympathy $\rightarrow$ Propriety $\rightarrow$ Spectator $\rightarrow$ Rules.

      *(Self-Correction during drafting)*: I need to be careful with the "Loop." If I make it sound too cognitive/reflective, it sounds like Kant. I need to emphasize it's about *sentiment* adjustment. The loop is: I feel X $\rightarrow$ I imagine you watching me $\rightarrow$ I see you can't feel X $\rightarrow$ I lower X $\rightarrow$ We harmonize. The *Impartial* Spectator is when we remove *your* specific bias too.

      *(Metaphor Check)*: Tuning an instrument. If I play A440 and you play A445, it beats. We need to match pitch. But Smith says the spectator can never *fully* match the agent (especially in grief). So it's more like... an amplifier gain match? No, Tuning is still best if qualified: "We tune down to what is communicable." Let's stick with **Tuning for Harmony**, emphasizing that if the agent is too sharp, the spectator can't harmonize.

      *(Case Check)*: Anger at late friend. Is it wrong? Smith says anger is the most difficult passion to sympathize with. It requires a clear cause. If the friends are laughing, they don't see the cause as serious. The Spectator asks: "Was the cause actually serious?" This distinguishes Spectator from Friends.

      *(Exit Ticket)*: Needs to be diagnostic. "Here is a situation. What does the Spectator do that your best friend would not?"

      Let's assemble the plan.

      *Structure:*
      1.  **Plan Overview:** Time breakdown.
      2.  **The Metaphor & Case:** Detailed advice on Tuning and the Late Friend.
      3.  **The Loop:** Validation and caveats.
      4.  **The Sequence:** Step-by-step flow with misconception integration.
      5.  **The Idealization Question:** How to bracket it.
      6.  **The Exit Ticket:** The specific diagnostic task.

      *Refining the Misconception Map:*
      *   Sympathy $\neq$ Empathy (Start).
      *   Propriety $\neq$ Politeness (During Metaphor).
      *   Spectator $\neq$ Conscience/Kant/Mill (During Spectator section).
      *   Spectator $\neq$ Peer Pressure (During Loop/Relativism).
      *   Rules $\neq$ Foundation (End).

      *Refining the Exit Ticket:*
      Make it a "Judge this" task.
      Scenario: A man weeps openly at a minor slight.
      (a) Friends say: "Man up."
      (b) Kant says: "Emotions are irrelevant."
      (c) Smith says: ?
      This forces them to articulate the *proportionality* aspect.

      Okay, ready to write.
answer: |-
  Here is a 50-minute discussion plan designed to prevent the specific failures you encountered last year. It prioritizes the *mechanism* of Smith's ethics over the *conclusions*, forcing students to engage with the structure of sympathy and judgment rather than collapsing it into Utilitarianism or Kantianism.

  ### 1. The Metaphor and The Case
  **The Metaphor: Tuning an Instrument (Harmony, not Volume)**
  Use **Tuning an Instrument**.
  *   **Why:** Smithian sympathy is not about the agent's feeling in isolation; it is about the *correspondence* between the agent's feeling and the spectator's feeling.
  *   **What it must have:** It must imply two parties trying to resonate. If the agent is "sharp" (too angry) and the spectator is "natural pitch" (calm), they create dissonance. The goal is not silence (no anger) but harmony (matching anger).
  *   **What it must not have:** Do not use the Volume Knob. That implies the moral goal is simply to *reduce* passion. Smith allows for high passion if the cause warrants it (e.g., grief at a death). Do not use Photographic Exposure. That implies a single technical "correct" setting determined by light/object, whereas Smith is determined by *interpersonal communicability*.
  *   **The Risk:** Students might think "harmony" means "agreement." Clarify that harmony here means *emotional congruence*, not necessarily agreeing on the facts.

  **The Case: The Late Friend (Refined)**
  Your instinct is correct, but the "everyone else is laughing" detail is dangerous—it invites the "Peer Pressure" misconception too early.
  *   **The Setup:** Alex waits 40 minutes for Jordan. Jordan arrives, laughing, saying "Traffic was crazy!" Alex explodes in rage, ruining the dinner.
  *   **The Twist:** We later learn Jordan was not in traffic; Jordan was casually finishing a video game.
  *   **Why this works:**
      1.  **Propriety:** Is Alex's rage proportionate? Smith says anger is the hardest passion to sympathize with. It requires a clear, grave cause.
      2.  **Spectator vs. Friends:** If the other diners are laughing, they are *partial* spectators (they like Jordan, or hate conflict). The Impartial Spectator ignores the laughter and looks at the *cause* (the deception/wait).
      3.  **Passion vs. Act:** The act (yelling) isn't the primary moral object; the *volume of the rage* relative to the *wait time* is.

  ### 2. The "Loop" Framing
  **Verdict:** This is a strong pedagogical move, provided you avoid infinite regress.
  *   **Why it works:** It solves the "Homunculus" problem (who watches the watcher?) and distinguishes Smith from simple Conformism.
  *   **The Caveat:** You must emphasize that the loop **converges**. It is not an endless spiral of doubt. It settles on the sentiment that a *well-informed, neutral human* could stably inhabit.
  *   **The Phrasing:** "We don't have a little judge in our head. We have a habit of projecting how we look to others, then projecting how *they* look to *others*, until we strip away the bias of 'me' and 'my friends.' The Impartial Spectator is the stable point where that projection stops changing."

  ### 3. The Sequence and Misconception Map
  *Total Time: 50 Minutes*

  **0:00–0:05: Sympathy (The Mechanism)**
  *   **Task:** Ask: "When Smith says 'sympathy,' does he mean 'pity' or 'empathy'?"
  *   **Correction:** It is neither. It is **imaginative projection**. I do not catch your feeling; I imagine what I would feel in your *situation*.
  *   **Misconception Killed:** *Sympathy as Empathy/Pity.*
  *   **Board:** Write "Sympathy = Imaginative Projection of Situation."

  **0:05–0:15: Propriety (The Metaphor & Case)**
  *   **Task:** Introduce the Tuning Fork metaphor. Run the "Late Friend" case.
  *   **Discussion:** "Why can't the spectator 'tune in' to Alex's rage?" (Because the cause doesn't warrant that pitch). "What if Jordan had missed the dinner because of a hospital emergency?" (Then the rage is improper, but the grief is proper).
  *   **Key Point:** Morality is about the **proportion of the passion** to the cause, not just the action.
  *   **Misconception Killed:** *Morality is about Rules/Actions.* (It's about Sentiments). *Propriety is Politeness.* (It's about emotional fit).

  **0:15–0:30: The Impartial Spectator (The Loop)**
  *   **Task:** Build the Spectator from the failure of immediate sympathy.
  *   **Flow:**
      1.  I am biased (I love myself more).
      2.  I imagine you watching me (I lower my passion to get your sympathy).
      3.  But you are biased too (you love Jordan).
      4.  I imagine a third party watching *us*.
      5.  **Convergence:** The Impartial Spectator is the view from nowhere *specific*.
  *   **Comparison:**
      *   **Kant:** Universal Law is about *logic/consistency* of the maxim. Smith is about *sentiment/harmony* of the passion.
      *   **Mill:** Impartial Benevolent Spectator calculates *outcomes*. Smith's Spectator judges *motives/feelings*.
      *   **Conscience:** Conscience is a voice/command. Spectator is a *perspective*.
  *   **Misconception Killed:** *Spectator as Conscience.* *Spectator as Kant/Mill.* *Spectator as Peer Opinion.*

  **0:30–0:40: General Rules & Relativism**
  *   **Task:** Ask: "Does the Spectator give us a rulebook?"
  *   **Answer:** No. Rules are generalizations *derived* from many spectator judgments. They are secondary.
  *   **Relativism Check:** "If the Spectator is just what people think, isn't this relativism?"
  *   **Reply:** No, because of the Loop. The Spectator corrects the actual people. Actual people might support a duel (honor culture); the Impartial Spectator sees the disproportion of risking life over a word.
  *   **Misconception Killed:** *Morality is just what people around you think.* *Rules come first.*

  **0:40–0:45: The Idealization Bracket (Your Specific Question)**
  *   **Strategy:** **Explicitly refuse to solve this.**
  *   **Script:** "Smith wobbles. Sometimes the Spectator sounds like an idealized version of you. Sometimes it sounds like God. Sometimes it sounds like 'humanity.' If we spend 20 minutes on this, we lose the mechanism. For this course, treat the Spectator as a **methodological tool**: It is the standpoint you occupy when you have successfully stripped away your personal bias and your social pressure. Whether that standpoint exists metaphysically is a question for a seminar on Smith, not an intro ethics section."
  *   **Why:** This validates the sharp students who notice the tension without letting it derail the lesson for the rest.

  **0:45–0:50: The Exit Ticket (Diagnostic Task)**
  *   **Task:** Hand out a slip. Present this scenario:
      > "A soldier disobeys a direct order because she believes the order is unnecessarily risky to civilians, though not strictly 'illegal' under the rules of war. Her comrades call her a traitor (Peer Opinion). The Military Code says 'Obey Orders' (Rule)."
  *   **Prompt:** "In one sentence, explain how Adam Smith's **Impartial Spectator** evaluates her action differently than (a) her comrades and (b) the Military Code."
  *   **What to look for:**
      *   *Fail:* "The Spectator says she should follow her conscience." (Conscience misconception).
      *   *Fail:* "The Spectator calculates if more lives were saved." (Mill misconception).
      *   *Fail:* "The Spectator says disobeying is wrong." (Rule misconception).
      *   *Pass:* "The Spectator asks if her **fear/Concern for civilians is proportionate** to the risk, and if a neutral observer could **harmonize** with that feeling, regardless of the rules or her friends."

  ### 4. Summary of Dependencies
  1.  **Sympathy (Projection)** must come first. Without this, Propriety makes no sense (you can't judge fit without a mechanism of feeling).
  2.  **Propriety (Proportion)** must come second. Without this, the Spectator has nothing to judge (it's not judging "good/bad" acts, but "fit/unfit" passions).
  3.  **Spectator (Loop)** comes third. It is the tool used to adjudicate Propriety when bias interferes.
  4.  **Rules** come last. They are the fossilized remains of past Spectator judgments.

  ### 5. Why This Prevents Last Year's Failure
  *   **"Vague Rule-Utilitarian":** By focusing on *Propriety of Passion* (Tuning) rather than *Consequences*, you block the Utilitarian collapse.
  *   **"Conscience":** By defining the Spectator as a *recursive projection* rather than an inner voice, you block the Kant/Religious collapse.
  *   **"Capitalism Guy":** By keeping the focus on *Moral Sentiments* (grief, anger, harmony) and explicitly bracketing *Wealth of Nations*, you prevent the economic reductionism.
  *   **"Relativism":** By teaching the Spectator as a *correction* of peer opinion (the Loop), you show how Smith escapes simple social conformity.

  ### 6. Instructor Cheat-Sheet for the "Flubbed Answer"
  If a student asks: *"So is the Spectator just my conscience?"*
  **Your Answer:** "Conscience usually implies a voice telling you 'Do X.' The Spectator isn't a voice; it's a **vantage point**. It's the difference between asking 'What does my gut say?' (Conscience) and 'If I stood over there, away from my own interests, how would this look?' (Spectator). One is internal intuition; the other is imagined external perspective."

  If a student asks: *"Isn't this just what society thinks?"*
  **Your Answer:** "Society is often partial. Society might say 'Duels are honorable.' The Impartial Spectator asks 'Is risking death over an insult proportionate?' Smith uses the Spectator to **criticize** society, not just mirror it."
