      *Better:* "The Disclosure Test." Can we explicitly state our strategy to the recipient without undermining the message?
      *Decision:* I will keep the spirit of the Flip Test but operationalize it as the **"Strategy Disclosure Test."** *Would we be willing to print a footnote saying 'We set this deadline to prompt you, not because funds expire'?* If no, it's manipulative.

  6.  **Finalizing the Procedure Structure:**
      *   **Name:** The Outreach Integrity Protocol (OIP).
      *   **Time:** 20 mins.
      *   **Steps:**
          1.  Fact Check (Hard Stop).
          2.  Reason Check (Does it explain the benefit?).
          3.  The Disclosure Test (Operationalized Flip Test).
          4.  Vulnerability Default (Assume low capacity).
          5.  The Value Gate (Escalation for "Good Manipulation").
      *   **Output:** A checklist + Rationale Template.

  7.  **Addressing the "Honest Final Note":**
