answer: |-
  Based on the five precedents provided, your advisor operates under a **structuralist** theory of corruption, prioritizing the integrity of public systems over the intent of individual actors.

  Here is the analysis of the new case, the governing rule, the closest analog, and the splitter case.

  ### 1. The Ruling and The Rule
  **Verdict:** **Corruption.**

  **Governing Rule:** **Structural Asymmetry.**
  While *private-obligation-through-office* is present, the advisor's track record suggests that **Structural Asymmetry** is the dominant principle.
  *   **Why:** In Precedent 4 (Foundation), the advisor ruled that "structural dependency is sufficient" for corruption without an explicit *quid pro quo*. In the AI case, the algorithm *institutionalizes* a dependency on past private relationships. It hard-codes an asymmetry into the public procedure where incumbents possess a structural advantage that new vendors cannot access, regardless of merit (price/quality).
  *   **Why not the others?**
      *   *Intentional-quid-pro-quo:* Explicitly rejected in Precedent 4 and the case facts.
      *   *Normative-deviation:* The AI is transparent and the collaborations were "legitimate," so it doesn't violate local custom in the way Precedent 3 (poll worker gift) did. Yet, Precedent 3 shows that even "standard thanks" are corruption if they invade public procedure. The AI invades procedure, but the *reason* it is corruption is the structural lock-in, not the cultural deviation.
      *   *Private-obligation-through-office:* This is a strong secondary factor (Precedent 1 & 3). However, Precedent 5 shows that if there is no "office-derived private gain" (the official doesn't benefit), it might pass. In the AI case, the *official* gains nothing, but the *system* is compromised. This points back to Structure (Precedent 4) rather than individual obligation.

  ### 2. Closest Analog
  **Precedent 4 (Corporation donates to Politician's Foundation).**

  *   **Similarity:** Both cases involve a mechanism that creates a **feedback loop of advantage** without a direct bribe.
      *   In Precedent 4, the foundation creates a "structural dependency" where the politician is aligned with the firm via research funding.
      *   In the AI case, the "relationship score" creates a structural dependency where the procurement office is aligned with the vendor via historical data.
  *   **Key Parallel:** In both, the corruption is **latent in the system**. The politician didn't sell a vote; the procurement officer didn't take a bribe. Yet, the advisor rules these corrupt because the *architecture* of the decision-making process has been privately skewed.

  ### 3. Underdetermination and Principle Adoption
  The track record genuinely underdetermines this case because Precedent 5 (Official votes for spouse's bill) introduces a counter-weight: **Transparency and Policy Alignment.**
  *   In Precedent 5, disclosure + long-held view = Not Corruption.
  *   In the AI case, we have transparency + legitimate past projects.

  If your advisor's prior rulings do not force a specific outcome, her choice here adopts one of two competing principles:

  *   **If she rules NOT Corruption:** She adopts **Procedural Formalism**.
      *   *Principle:* "If the rules are public, the inputs are legal, and the actors are transparent, the outcome is legitimate."
      *   *Implication:* Efficiency and continuity (rewarding known vendors) trump the risk of incumbency lock-in. Corruption requires a *breach* of rules, not just a bias *within* them.
  *   **If she rules CORRUPTION:** She adopts **Substantive Equality of Opportunity**.
      *   *Principle:* "Public procedures must be blind to private history to ensure the public interest is primary."
      *   *Implication:* Even "earned" private advantages corrupt public office if they are institutionalized. The "Public Duty" (Precedent 1) requires maximizing public value, not rewarding private loyalty (even legitimate loyalty).

  ### 4. The Splitter Case
  To distinguish whether she prioritizes **Structural Asymmetry** (Precedent 4) or **Private-Obligation/Procedure** (Precedent 3), use the case you suggested, refined slightly to test the boundary of *influence*.

  **The Case:** *A vendor funds a public scholarship program to train procurement officers on the specific AI algorithm. The scholarship is transparent and open to all. Later, that vendor wins a contract using the AI's "relationship score."*

  **How this splits the rules:**

  *   **Scenario A: She rules this CORRUPTION.**
      *   **Rule Confirmed:** **Structural Asymmetry (Deep).**
      *   **Reasoning:** She believes corruption includes **shaping the ecosystem**. By funding the training/adoption, the vendor didn't just benefit from the structure (like the AI case); they *built* the structure. This aligns with Precedent 4 (Foundation), where funding the environment creates a corrupt dependency.
      *   **Distinction:** It proves she views the *origin* of the system as relevant to its corruption, not just the system's operation.

  *   **Scenario B: She rules this NOT CORRUPTION.**
      *   **Rule Confirmed:** **Private-Obligation-Through-Office (Strict).**
      *   **Reasoning:** She distinguishes between **Systemic Bias** (AI case) and **Public Benefit** (Scholarship). If the scholarship is public and the officers are not personally indebted (unlike the Mayor's cousin in Precedent 1), there is no private obligation.
      *   **Distinction:** This would imply her ruling on the AI case was about the *internal mechanics* of the bid (the score itself), not the *external influence* on the office. It limits corruption to specific procedural contaminations (Precedent 3) rather than broad market shaping.

  **Why this splitter works:**
  It isolates **Agency**. In the AI case, the bias is automated. In the Scholarship case, the vendor actively invests in the *human infrastructure* to enable that bias.
  *   If she condemns the Scholarship, she is a **Systemic Structuralist** (Case 4 is the ultimate rule).
  *   If she condemns the AI but accepts the Scholarship, she is a **Procedural Purist** (Case 3 is the ultimate rule: don't put private factors *inside* the vote/bid, but you can fund the room where the vote happens).
