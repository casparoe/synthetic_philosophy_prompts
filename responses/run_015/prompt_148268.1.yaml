          3.  The "Hope They Don't Ask" (QG/Discrete) + 2-min reply.
          4.  The Weakest Spot in User's Argument.

      *   *Refining the Objections:*
          1.  *The "Observables are Invariant" Objection (Earman Loyalist).* They will say gauge equivalence *defines* physical identity.
