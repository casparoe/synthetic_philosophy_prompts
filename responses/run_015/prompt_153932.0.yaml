  The core mechanism is a **"Behavioral Mirror" protocol** where Death uses a standardized psychological profile and brief interview to generate high-accuracy predictions, forcing Travellers to treat their own choice as evidence of a fixed type rather than a free variable.

  ### Materials
  *   **Paper & Pens:** Plenty of scrap paper, plus pre-printed "Score Sheets" for each pair.
  *   **Tokens:** 20 matchsticks, coasters, or beer mats per person (representing "Life Points").
  *   **Envelopes:** 1 per pair per round (to seal predictions).
  *   **The "Profiler's Sheet" (1 per Death player):** A half-page cheat sheet listing 5 behavioral tells (e.g., "If they hesitate >5 seconds, predict Aleppo," "If they smile, predict Damascus") based on common human patterns.
  *   **The Board:** Whiteboard or large paper visible to all.
  *   **Timer:** Phone or pub clock.

  ### Rules & Payoffs
  **General:**
  *   **Death's Goal:** Match the Traveller's final choice (Prediction = Choice).
  *   **Traveller's Goal:** Mismatch Death's prediction (Choice ≠ Prediction).
  *   **Currency:** Life Points (LP). Start with 10 LP.
  *   **Accuracy Rule:** Death is "Infamous." The Facilitator will intervene if Death's accuracy drops below 60% across the room (see Failure Modes).

  **Round 1: The sealed Fate (10 mins)**
  *   **Setup:** Pairs form. Death gets Profiler's Sheet.
  *   **Action:** Death interviews Traveller for 60 seconds (no notes). Death writes prediction (A or D), seals in envelope. Traveller writes choice (A or D), seals in envelope.
  *   **Reveal:** Open both.
  *   **Payoff:** If Match: Death +5 LP, Traveller -5 LP. If Mismatch: Death -5 LP, Traveller +5 LP.
  *   **Board:** Tally total Death Accuracy %.

  **Round 2: The Open Prophecy (15 mins)**
  *   **Change:** Death writes prediction but **shows it to Traveller** before Traveller chooses.
  *   **Action:** Death shows card ("I predict Aleppo"). Traveller chooses.
  *   **Payoff:** Same as Round 1.
  *   **Twist:** If Traveller chooses opposite to "beat" Death, discuss aloud: "Does choosing opposite prove Death wrong, or does it prove you are the type who tries to beat Death (and thus were predicted)?"

  **Round 3: The Randomizer (15 mins)**
  *   **Change:** Traveller may pay 5 LP to roll a die (1-3 = Aleppo, 4-6 = Damascus) instead of choosing.
  *   **Action:** Death predicts first (sealed). Traveller decides: Choose or Roll.
  *   **Payoff:** If Roll: Match = Death +5, Traveller -5. (Randomization does not break the link).
  *   **Goal:** Test if removing "choice" removes the correlation.

  **Round 4: The 80% Rule (15 mins)**
  *   **Change:** Facilitator announces: "Death is only right 80% of the time tonight." A running tally is kept on the board.
  *   **Action:** Standard Sealed Prediction (like Round 1).
  *   **Payoff:** If Death is Right: Traveller survives (+5 LP). If Death is Wrong: Traveller dies (-10 LP). *(Note: Payoff flip here to simulate risk assessment).*
  *   **Goal:** Find the threshold where trying to outsmart Death becomes riskier than accepting fate.

  **Round 5: Free Play (15 mins)**
  *   **Action:** Pairs rotate. Play any previous round variant.
  *   **Goal:** Argue the strategy out loud while playing.

  ### 90-Minute Timeline
  *   **00-10:** Intro & Setup. Distribute LP. Explain "Life or Death" stakes (no jargon). Hand out Profiler Sheets to half the room (Death).
  *   **10-20:** Round 1 (Sealed). Establish baseline accuracy. Tally board.
  *   **20-35:** Round 2 (Open). The "Flip" moment. Pause for 2-min out-loud argument mid-round.
  *   **35-50:** Round 3 (Randomizer). Test the "die roll" escape.
  *   **50-65:** Round 4 (80% Rule). Introduce uncertainty. Watch for risk aversion.
  *   **65-80:** Round 5 (Free Play). Rotate partners. Let chaos ensue.
  *   **80-90:** Debrief. Connect game moments to concepts.

  ### The Board
  *   **Left Side:** "Death's Accuracy" (Running %). Update after every round.
  *   **Center:** "Survival Rates" (How many Travellers have >10 LP).
  *   **Right Side:** "The Question" (Written at start): *Can you choose differently than what is already true about you?*
  *   **Bottom:** Round Timer.

  ### Debrief Guide (Map Moments to Ideas)
  *   **Round 1 Accuracy:** Map to **Common Cause**. Death wasn't psychic; they read your "type." Your choice and Death's prediction shared a cause (your psychology).
  *   **Round 2 (Open Card):** Map to **Evidential Decision Theory**. When you saw "Aleppo," did you feel going to Damascus made you safe? Or did it feel like going to Damascus was *why* Death predicted Aleppo?
  *   **Round 3 (Die Roll):** Map to **Causal Decision Theory**. Did randomizing break the link? If Death was predicting your *psychology*, a die roll makes you unpredictable, so Death should be wrong. If Death was predicting *fate*, the die roll doesn't matter.
  *   **Round 4 (80%):** Map to **Risk Thresholds**. At what accuracy did you stop trying to outsmart and just accept the prediction? That's where evidential reasoning overrides causal hope.
  *   **The "Free Will" Wall:** Remind them: "You said you could just choose opposite. But if you are the *type* who chooses opposite, Death predicts that. You never escaped the type."

  ### Failure Modes & Fixes
  *   **Death Leaks Prediction:** Death smiles or hints before writing.
      *   *Fix:* Enforce "Silent Writing" phase. If caught, Death pays 5 LP to Traveller immediately.
  *   **Points Don't Matter:** People laugh off losing LP.
      *   *Fix:* "Bankruptcy Rule." If you hit 0 LP, you must buy the next round of drinks (or do a forfeit like sing a song). Make survival social.
  *   **Cheating Accusations:** "Death looked at my paper!"
      *   *Fix:* Facilitator acts as Judge. Use envelopes strictly. If accuracy is suspiciously high (>90%), Facilitator declares "The Gods are Angry" and shuffles pairs.
  *   **The "Free Will" Guy:** "I just choose opposite, game over."
      *   *Fix:* In Round 4, make the penalty for Death being Wrong (Traveller dies) severe. If he chooses opposite and dies (because Death was right), he hits the wall. If he survives, ask: "Did you survive because you chose opposite, or because Death was in the 20% error margin?"
  *   **Boredom/Confusion:** Rules too complex.
      *   *Fix:* Keep payoff simple: Match = Death Wins. Mismatch = Traveller Wins. Repeat this mantra.

  ### What The Game Can't Reproduce (Your Closing Talk)
  *   **True Perfect Prediction:** The game uses psychology (70-80% accuracy), not metaphysics. You need to explain that the paradox *requires* 100% accuracy to be logically airtight, but the *feeling* is the same at 90%.
  *   **The Feeling of Inevitability:** Players can always physically choose the other city. The game can't stop them. You must articulate that the paradox isn't about physical constraint, but about *rational constraint*—that choosing the "other" city is irrational evidence that you are already doomed.
  *   **The Common Cause:** In the game, the "cause" is personality. In the paradox, it's often logic or physics. You need to bridge that gap: "Imagine your personality is as fixed as gravity."
  *   **Normativity:** The game shows *what happens*, not *what you should do*. You must deliver the punchline: "Causal theory says run to Aleppo. Evidential theory says stay in Damascus. The game makes you feel why both feel right and wrong."
