answer: |-
  **MEMORANDUM**

  **TO:** University Committee on Professional Conduct and Research Integrity
  **FROM:** [Your Name/Chair], Ad Hoc Appeals Sub-Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memorandum: Appeal of Research Protocol Breach (Case #2023-RC-09)

  **I. DECISION AND BOTTOM LINE**

  The Committee recommends a **Conditional Modification of the Sanction**.

  We find that the doctoral candidate did violate the approved data-retention protocol by failing to destroy raw audio recordings within the mandated seventy-two-hour window. However, recognizing the competing moral obligations at play, the Committee recommends waiving the proposed punitive sanction (suspension of research privileges) contingent upon two immediate actions:
  1.  **Transfer of Evidence:** Within seven (7) calendar days, the researcher must transfer all preserved raw data regarding the administrator's misconduct to the University Ombuds Office for independent review, removing the data from the researcher's personal possession.
  2.  **Remedial Training:** Within thirty (30) calendar days, the researcher must complete a specialized ethics module focused on emergency protocol deviations and informed consent obligations.

  Failure to meet these conditions will result in the immediate reinstatement of the original punitive sanction.

  **II. REASONING AND ANALYSIS**

  This case presents a conflict between two legitimate moral frameworks that govern institutional life. The first is an **order-oriented framework**, which posits that procedural fidelity and institutional coherence are moral goods in themselves. The second is a **conscience-oriented framework**, which posits that individual moral judgment retains ultimate authority when bureaucratic compliance risks concealing harm.

  **A. The Validity of the Procedural Claim (Order-Oriented)**
  The administration's demand for sanction rests on the necessity of trust in research protocols. When a researcher signs a data-retention agreement, they are not merely agreeing to a university rule; they are entering a contract with the participants. In this case, the senior administrator participated under the explicit assurance that raw audio would be destroyed within seventy-two hours. By retaining the data, the researcher unilaterally altered the terms of that participation.

  If protocols are treated as optional based on individual interpretation, the integrity of the entire review system collapses. Future participants cannot trust assurances of anonymity or data destruction if they believe researchers may retain evidence based on private moral calculations. This erosion of trust poses a tangible risk: it may chill participation in sensitive studies, ultimately reducing the university's capacity to generate knowledge. The administration's insistence on sanction is not mere legalism; it is a defense of the promise-keeping infrastructure that makes research possible.

  **B. The Validity of the Conscience Claim (Conscience-Oriented)**
  Conversely, the researcher's appeal rests on the principle that moral agency cannot be fully contracted away. There is a recognized ethical tradition holding that institutional rules lose legitimacy when they require complicity in concealing significant harm. To demand the destruction of evidence regarding financial misconduct is to ask the researcher to become an instrument of that misconduct.

  If the institution enforces protocols rigidly in the face of evident wrongdoing, it risks transforming procedural compliance into moral cowardice. The researcher's refusal to destroy the recordings was not an act of convenience but an attempt to prioritize public accountability over bureaucratic convenience. Dismissing this claim entirely would signal that the university values its own administrative smoothness over the correction of internal corruption.

  **C. The Role of the Folk-Morality Framing**
  The comparative folk-morality framing (Order vs. Conscience) is useful for diagnosing the *tension* in this case, but it obscures the specific *obligations* created by informed consent. Framing this solely as a clash of cultural ethical traditions risks treating the protocol as an abstract imposition of "order" rather than a specific promise made to a human subject.

  The researcher's conscience argument focuses on the harm to the *institution* (financial misconduct), but the protocol breach creates a potential harm to the *participant* (violation of agreed-upon data destruction). Therefore, the resolution cannot simply validate the researcher's conscience as supreme. It must mitigate the violation of the participant's consent. This is why the conditional resolution requires the data to be moved to the Ombuds Office. This preserves the evidence for potential investigation (satisfying the conscience claim) while removing the data from the researcher's control (satisfying the procedural requirement that the researcher not hold unauthorized data).

  **III. THE STRONGEST ARGUMENT ON THE LOSING SIDE**

  In recommending a waiver of the punitive sanction, the Committee effectively rejects the Administration's argument for strict enforcement. It is necessary to articulate why the Administration's position is morally serious, even though we are not fully adopting it.

  The strongest argument against our recommendation is that **procedural exceptions create a slippery slope that endangers vulnerable subjects.** If we establish a precedent that researchers may retain data when they suspect wrongdoing, we empower researchers to become judge and jury regarding what constitutes "wrongdoing." A researcher might decide a participant's controversial political views, rather than financial crimes, constitute "harm" worthy of preserving evidence.

  Once the bright line of the protocol is blurred, the protection of research subjects relies on the subjective virtue of the researcher rather than the objective safety of the system. History shows that reliance on individual virtue is insufficient to protect subjects from exploitation. By waiving the sanction, we risk signaling that protocols are negotiable, which could lead to a culture where data retention is common, thereby increasing the risk of data breaches and privacy violations for all future participants. The Administration's demand for sanction is a defense of the *system's* ability to protect people, not just the *institution's* reputation. We acknowledge this danger but believe it is mitigated in this specific instance by the requirement that the data be immediately transferred to an independent third party, preventing the researcher from establishing a personal archive of "evidence."

  **IV. IMPLEMENTATION TIMEFRAME**

  1.  **Notification:** The Committee Chair will notify the doctoral candidate and the Dean of Research of this decision within 48 hours.
  2.  **Data Transfer:** The candidate must confirm transfer of data to the Ombuds Office by **November 2, 2023**.
  3.  **Training Completion:** The candidate must submit certification of ethics training completion by **November 25, 2023**.
  4.  **File Closure:** Upon verification of these conditions, the finding of breach will remain on file, but the punitive sanction will be permanently expunged from the candidate's disciplinary record.

  **V. CONCLUSION**

  This decision acknowledges that while institutional rules are essential for collective trust, they operate within a broader moral ecosystem that sometimes demands exception. However, such exceptions must be managed through oversight (the Ombuds transfer) rather than individual discretion (the researcher retaining files). This approach respects the researcher's moral agency without granting her the authority to unilaterally rewrite the contracts of informed consent that protect all research participants.

  **Approved by:**
  Committee on Professional Conduct and Research Integrity
  **Date:** October 26, 2023
