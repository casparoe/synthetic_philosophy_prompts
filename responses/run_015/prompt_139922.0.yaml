answer: |-
  ### The Interpersonal Comparison Sorting Instrument

  **Instructions for the Facilitator:**
  Read the ten items aloud. Ask participants to record their answers (A, B, or C) on a slip of paper. Do not discuss the answers until all ten are complete. Once finished, use the **Scoring Key** below to have participants identify their "Leaf."

  ---

  ### Part I: The Ten Items

  **1. The Ship of Theseus (Intrapersonal Control)**
  Person A at age 20 loves art and adventure. At age 80, due to memory loss and value change, Person A loves only quiet routine and denies their younger self's dreams were valuable. We want to compare Person A's wellbeing at 20 vs. 80.
  *   (A) There is no fact of the matter; they are effectively different people.
  *   (B) We can say which time was better, but not by how much.
  *   (C) We can measure the difference in magnitude (e.g., "twice as good").

  **2. The Contented Worker (Adaptive Preferences)**
  Worker X lives in a restricted society and reports high satisfaction with their limited options. Worker Y lives in an open society but reports frustration due to unmet high ambitions.
  *   (A) Worker X is better off; satisfaction is what counts.
  *   (B) Worker Y is better off; objective freedom matters more than reported feelings.
  *   (C) We cannot compare them without imposing an external standard.

  **3. The Poet and the Accountant (Incommensurable Vocabularies)**
  A poet describes their best life as "sublime transcendence." An accountant describes their best life as "secure comfort." They refuse to use each other's terms.
  *   (A) Their experiences are too different to be translated into a common measure.
  *   (B) We can roughly translate both into a shared scale of "life quality."
  *   (C) There is a underlying biological or psychological currency they both share.

  **4. The Gap Disagreement (Ratio Sensitivity)**
  Two observers agree that for Person 1, moving from State X to Y is an improvement. They also agree Person 2 improved from State P to Q. But Observer 1 says the first gap is *twice* as big as the second; Observer 2 says it is *ten times* as big.
  *   (A) Both observers are correct; magnitude is subjective.
  *   (B) One observer is correct; there is a true fact about the gap size.
  *   (C) The question is meaningless; only the ranking matters.

  **5. The Currency Dispute (Second-Order Disagreement)**
  A committee must allocate funds. Half say "pleasure" is the only thing that matters. Half say "achievement" is the only thing that matters. They cannot agree on which currency is true.
  *   (A) Pick one arbitrarily to allow decision-making; no scale is objectively correct.
  *   (B) Refuse to allocate until the true currency is discovered.
  *   (C) Combine them into a hybrid index despite the disagreement.

  **6. The Dispersed Gain (Aggregation vs. Concentration)**
  Option 1 gives a massive benefit to a single individual. Option 2 gives tiny benefits to a very large group of people. The *sum total* of benefit is identical in both options.
  *   (A) Option 2 is better; spreading benefit matters more than the sum.
  *   (B) It makes no difference; only the sum total matters.
  *   (C) Option 1 is better; concentrated excellence outweighs dispersed trivia.

  **7. The Mere Addition (Variable Population)**
  We can add a new person to the population whose life is barely worth living (positive but minimal). The existing population's quality remains unchanged.
  *   (A) This improves the overall situation (Total View).
  *   (B) This worsens or does not improve the situation (Average View).
  *   (C) The value is indeterminate; we cannot compare different population sizes.

  **8. The Policy Deadline (Conventionalism)**
  A government must set a poverty line tomorrow. Philosophers agree there is no single "true" measure of wellbeing, but action is required.
  *   (A) Stipulate a measure for the sake of action; it is a tool, not a truth.
  *   (B) Delay action until a true measure is found.
  *   (C) Use the best available guess as if it were a fact.

  **9. The Torture vs. Headaches (Weighting)**
  We can prevent one case of extreme torture, or we can prevent one million cases of mild headaches. We cannot do both.
  *   (A) Prevent the torture; some harms outweigh any number of minor inconveniences.
  *   (B) Prevent the headaches; the sum of minor pains eventually outweighs the torture.
  *   (C) The choice is tragic; there is no rational way to decide.

  **10. The Income Proxy (Measurement)**
  An economist proposes using income as the sole measure of wellbeing for a policy study.
  *   (A) Accept it; it is a valid enough proxy for comparison.
  *   (B) Accept it reluctantly; it is flawed but the only operational option.
  *   (C) Reject it; it fundamentally misrepresents human welfare.

  ---

  ### Part II: The Logical Space

  Before assigning labels, note that the questions map onto three underlying dimensions of disagreement. Your position is defined by where you stand on these axes:

  1.  **Metric Precision (Q1, Q4, Q10):** Is wellbeing merely rankable (Ordinal), or are the gaps between states measurable (Cardinal)?
  2.  **Interpersonal Bridge (Q2, Q3, Q5):** Can we compare Person A to Person B? Is the barrier linguistic, ontological, or merely practical?
  3.  **Aggregation Rule (Q6, Q7, Q9):** If we can compare, how do we combine the data? Do we sum linearly, weight the worse-off more heavily, or refuse to aggregate?

  ---

  ### Part III: The Six Leaves (Scoring Key)

  *Facilitator Note: Read these profiles aloud. Ask participants to raise their hands when you read the profile that matches their answer pattern.*

  **Leaf 1: The Hard Skeptic**
  *   **Commitment:** Comparisons are fundamentally impossible, even for one person over time.
  *   **Signature Answers:** Mostly **(A)** on Q1, Q4, Q9.
  *   **View:** There are no facts about "better" or "worse" beyond immediate preference. Aggregation is off the table.
  *   *(Associated with: Radical Subjectivists, some Wittgensteinians)*

  **Leaf 2: The Ordinal Proceduralist**
  *   **Commitment:** We can rank states for individuals, but not measure gaps or compare across persons.
  *   **Signature Answers:** Mostly **(B)** on Q1, but **(A)** or **(C)** on Q4. **(B)** on Q10.
  *   **View:** Social ordering comes from unanimity (Pareto) plus procedural tie-breakers (voting/rules), not welfare sums.
  *   *(Associated with: Social Choice Theorists, Pareto Welfarists)*

  **Leaf 3: The Partial Comparativist**
  *   **Commitment:** Some comparisons are robust (extreme suffering vs. mild pleasure), but precise ratios are not.
  *   **Signature Answers:** **(B)** on Q4, but **(A)** on Q6 and Q9.
  *   **View:** We can make coarse judgments for policy, but fine-grained cost-benefit analysis is unjustified.
  *   *(Associated with: Michael Stocker, Elizabeth Anderson)*

  **Leaf 4: The Conventionalist**
  *   **Commitment:** No scale is objectively correct, but we must stipulate one to function.
  *   **Signature Answers:** **(A)** on Q5 and Q8. **(B)** on Q4.
  *   **View:** Interpersonal comparison is a pragmatic construct, not a discovery. We build the ruler because we need to measure.
  *   *(Associated with: John Rawls [Primary Goods as proxy], some Policy Pragmatists)*

  **Leaf 5: The Prioritarian (Weighted Realist)**
  *   **Commitment:** Comparisons are real, but gains to the worse-off matter more than gains to the better-off.
  *   **Signature Answers:** **(B)** on Q4, **(A)** on Q6 and Q9. **(A)** or **(B)** on Q7.
  *   **View:** We sum wellbeing, but we apply a weighting function. Distribution matters independently of the sum.
  *   *(Associated with: Derek Parfit, Larry Temkin)*

  **Leaf 6: The Classical Cardinalist (Utilitarian)**
  *   **Commitment:** Comparisons are real, ratio-scale, and everyone counts equally.
  *   **Signature Answers:** **(C)** on Q1, **(B)** on Q4, **(B)** on Q6, **(A)** on Q7.
  *   **View:** Maximize the total sum. If the math says the headaches outweigh the torture, so be it.
  *   *(Associated with: Classical Utilitarians, Cost-Benefit Analysts)*
      *   *Sub-variant (Average Utilitarian):* Same as above, but **(B)** on Q7.

  ---

  ### Appendix

  **(a) Empty or Incoherent Combinations**
  *   **The "Aggregating Skeptic" (Leaf 1 answers on Q1/Q4, but Leaf 6 answers on Q6/Q7):** You claim comparisons are impossible but insist on summing them anyway. *Diagnosis: Incoherent.*
  *   **The "Perfectionist Ordinalist" (Leaf 2 answers on Q1/Q4, but Leaf 5 answers on Q9):** You claim gaps are meaningless but assert that torture *always* trumps headaches (which implies a gap large enough to be lexicographically superior). *Diagnosis: Tension between ordinal claims and lexical thresholds.*
  *   **The "Passive Realist" (Leaf 6 answers on Q1/Q4, but Leaf 2 answers on Q8):** You believe there is a true fact about wellbeing but refuse to use a proxy for policy. *Diagnosis: Unattractive (Paralysis).*

  **(b) Indistinguishable Leaves**
  *   **The Conventionalist (Leaf 4) vs. The Pragmatic Realist (Leaf 6, Option B on Q10):** Both will stipulate a scale and proceed with policy. The quiz cannot pry apart whether they believe the scale is *true* or merely *useful*, as their behavioral output is identical. This is an ontological disagreement masked as a methodological one.

  **(c) Least Diagnostic Question**
  *   **Question 10 (The Income Proxy):** This is the least diagnostic because both Hard Skeptics and Classical Cardinalists might select Option (B) ("Flawed but necessary"). The Skeptic chooses it because *no* measure is true; the Cardinalist chooses it because income is an *imperfect proxy* for the true measure. The answer looks the same, but the reasoning is opposite.

  ---

  ### Meta-Evaluation

  **Confidence Level:**
  I am **moderately confident (approx. 75%)** that this instrument sorts participants into the intended clusters. The questions are designed to force trade-offs that align with the philosophical commitments of the six leaves. The "Signature Answers" provide a robust enough heuristic for a live session.

  **Weakest Link:**
  The single point I am least sure about is the **mapping of the Conventionalist (Leaf 4)**.
  *   *Why:* Conventionalism is notoriously slippery. A Conventionalist might answer like a Cardinalist on the cases (because they accept the convention) but like a Skeptic on the ontology (Q5/Q8). If a participant answers "Cardinalist" on the cases but "Conventionalist" on the ontology, the Scoring Key might misclassify them as Leaf 6.
  *   *Mitigation:* In the live session, if someone flags this mismatch, acknowledge it as a "Pragmatic Realist" hybrid. The quiz identifies *commitments*, but Conventionalism is a commitment about the *status* of the commitments, which makes it hard to capture in a linear key.
