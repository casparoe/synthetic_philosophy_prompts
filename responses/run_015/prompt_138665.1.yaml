  ### Note on Fudges and Liberties

  I simplified "Equalised Odds" to **Odds** and "Predictive Parity" to **Parity**; while technically imprecise (odds ratios ≠ equalised odds; parity could imply demographic parity), the line context clarifies the specific constraint intended. I treated **Individual Fairness** as **Similarity**, which captures the metric requirement but elides the normative work of defining the metric itself. The poem implies **Independence** and **Calibration** are mutually exclusive, which is true only when base rates differ (as noted in the text), but a strict logician might note they can coexist under equal base rates. Finally, the envoi's final pairing (**Base-Rate**, **Calibration**) takes a philosophical stance not forced by the math: it suggests that while fairness constraints are negotiable, the score's meaning (Calibration) is ultimately bound to the structural reality (Base-Rate), prioritizing epistemic honesty over distributive equality.
