  ### Brainstorming the End-Words

  I tested five candidate sets before committing. 
  1.  *Calibration, Fairness, Accuracy, Bias, Truth, Cost:* Rejected because "Fairness" and "Bias" are genus terms, not specific constraints, and "Accuracy" obscures the specific impossibility result.
  2.  *Calibration, Demographic-Parity, Predictive-Parity, Equalised-Odds, Individual-Fairness, Base-Rate:* Rejected because the multi-word terms destroy the sestina's rhythmic closure; the poem becomes a list of jargon.
  3.  *Calibration, Independence, Errors, Precision, Distance, Reality:* Rejected because "Errors" and "Distance" are too vague to capture the specific statistical definitions of Equalised Odds and Individual Fairness.
  4.  *Calibration, Independence, Odds, Parity, Similarity, Truth:* Rejected "Truth" because recidivism data lacks a clean ground truth; "Base-Rate" is the actual mathematical engine of the impossibility.
  5.  *Calibration, Independence, Odds, Parity, Similarity, Utility:* Rejected "Utility" because it shifts the argument to consequentialism rather than the deontological clash of constraints.

  **Selected Set:** **Calibration**, **Independence**, **Odds**, **Parity**, **Similarity**, **Base-Rate**.
  **Sixth Word Defense:** I chose **Base-Rate**. It is not a fairness criterion but a statistical fact about the population. The impossibility theorems (Chouldechova; Kleinberg et al.) hinge on unequal base rates across groups; if base rates were equal, most conflicts between Calibration, Equalised Odds, and Predictive Parity would vanish. It is the exogenous constraint that breaks the symmetry.

