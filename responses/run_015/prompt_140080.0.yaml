  **Decision Note: Secular Society Speaker Event**
  **To:** Events and Speakers Committee
  **From:** [Your Name]
  **Date:** [Current Date]

  **Subject:** Recommendation regarding forthcoming Secular Society event

  This note addresses the request to host a journalist affiliated with the Secular Society. The Islamic Society has raised safeguarding concerns, citing potential distress and lesson avoidance among Muslim students. Complicating matters is intelligence regarding an external group planning to attend via Telegram to support the speaker.

  Regarding precedent: Last term's pro-life event involved unavoidable graphic imagery in communal spaces, constituting passive harassment. This proposed talk is a contained discourse. The distinction lies in avoidance; students could bypass the foyer, whereas a polarised atmosphere affects the whole campus climate. However, the external threat changes the risk profile significantly, moving this from internal disagreement to potential public disorder.

  On the Senior Tutor's 'reactive audience clause': I advise against adopting this as standing policy. Formalising the ability to cancel events based on predicted reaction institutionalises the 'heckler's veto'. It incentivises disruptive groups to threaten unrest to silence opposition. We should manage this specific risk under existing safety protocols rather than rewriting our constitution. To rule otherwise suggests that violence, or the threat thereof, is a valid tool for policy change. It creates a chilling effect where any controversial topic becomes impossible if opponents mobilise effectively.

  Strongest argument for cancellation: The Committee's primary duty is safeguarding. If intelligence suggests a high probability of confrontation between external activists and student groups, proceeding is negligent. While Mill's harm principle suggests preventing harm to others, applying it here requires distinguishing between offence and physical safety. If the environment becomes hostile, education is compromised regardless of the speaker's content. Prioritising immediate safety over procedural consistency is the morally defensible position when welfare is tangible. If we proceed and violence occurs, we have failed our duty of care.

  **Recommendation:** The event should proceed with strict conditions. 1) Venue changed to a secure, ticketed room with no walk-ins. 2) Security briefed on the external group; police liaison if necessary. 3) Moderator empowered to shut down Q&A if safety deteriorates. We reject the reactive audience clause as a standing rule, dealing instead with this threat via risk assessment. This balances our duty of care with our commitment to open inquiry, without letting external threats dictate campus policy. We must not normalise cancelling events because opponents promise to turn up.
