answer: |-
  ### Brainstorming the Room

  You are walking into a minefield of conflicting incentives disguised as technical consensus. The Treasury and Finance folks are your biggest risk, not because they are evil, but because their mandate is *allocative efficiency within a budget constraint*. To them, a discount rate isn't a moral statement; it's a rationing mechanism. If you tell them to lower the rate without providing a new rationing logic, they will hear "approve everything and blow the budget." They will push back hardest on the **Opportunity Cost of Capital**. They view the market rate as an objective truth about scarcity; you view it as a short-term signal misaligned with long-term survival. You cannot win this by appealing to morality. You must win it by appealing to *model error*.

  The Engineer and the Environmental Economist represent the "implementation gap." The Engineer needs a scalar value to run a sensitivity analysis; if you give them a philosophical principle, they will ignore you. The Environmental Economist agrees with your ends but fears your means will be used to justify austerity now for vague gains later. The Philosopher is your wildcard; if they smell a logical inconsistency in your treatment of "future people," they will dismantle you publicly, which gives the Economists cover to dismiss the rest. Your strategy must be: concede the need for rationing (to satisfy Treasury), concede the need for operational numbers (to satisfy the Engineer), but insist that the *mathematics of uncertainty* forces the rate down, not just moral intuition. Do not lead with the forest; lead with the probability distributions.

  ***

  ### Q&A Prep Sheet

  **Order:** Ranked by potential to derail the proposal (High to Low).
  **Format:** Objection (Voice) → 2-Minute Reply → Soft Spot (Where you are vulnerable).

  #### 1. The Opportunity Cost Challenge
  **Who:** Central Bank Finance Person / Treasury Lead
  **Phrasing:** "You're treating the discount rate as a moral variable. It's not. It's the shadow price of capital. If the private sector can generate a 4% real return on infrastructure, and you tell us to evaluate a sea wall at 1%, you are effectively destroying wealth. You're telling us to lock capital into low-yield assets. Where does that capital come from if not from foregone investment elsewhere?"
  **Reply:** "I agree capital has an opportunity cost. But that cost is determined by risk and time horizon. Private market returns reflect short-to-medium term risk premiums and liquidity preferences—they do not price the risk of civilizational collapse. If the 'high return' investment relies on a stable climate that the sea wall protects, the market rate is endogenous to the project. We aren't choosing between 4% and 1%; we are choosing between a 4% return in a world that exists, and a 100% loss in a world that doesn't. The market rate is a local signal; we are optimizing for a global constraint."
  **Soft Spot:** You haven't quantified the "civilizational collapse" risk. They can rightly claim you're substituting a hard number (market rate) with a speculative catastrophe probability.

  #### 2. The "Give Me a Number" Objection
  **Who:** Geotechnical Engineer
  **Phrasing:** "I appreciate the theory. But my spreadsheet for the repository safety case requires a discount factor for year 10,000. If I put in 'it depends on your philosophical stance on survivorship,' the audit fails. Do you have a schedule or not? If the rate declines, does it hit zero? When?"
  **Reply:** "You need a schedule, not a single number. I propose a hyperbolic or step-decline schedule based on the Weitzman effect. For years 0–50, use the standard market rate. For 50–100, decline to the median of plausible long-term growth rates. Beyond 100 years, the rate converges toward the lowest plausible long-term growth rate, effectively floor-ing at the pure survival probability. I can provide a lookup table for your model that reflects this uncertainty envelope rather than a single point estimate."
  **Soft Spot:** They will ask for the specific percentages. If you hedge too much, you look unprepared. If you give specific numbers, you look arbitrary.

  #### 3. The Distributional Objection
  **Who:** Environmental Economist
  **Phrasing:** "I'm sympathetic to the long term. But a lower discount rate validates massive upfront spending now. That money comes from current budgets—health, education, poverty alleviation. Are you arguing we should tax the current poor to subsidize the future rich? Standard Ramsey Rule suggests future generations will be wealthier due to growth. Why transfer resources uphill?"
  **Reply:** "That relies on the assumption of perpetual growth. In climate adaptation, growth is the variable at risk. If we discount heavily, we under-invest in adaptation, growth collapses, and the future is poorer. It's not a transfer from poor to rich; it's an insurance premium paid by the present to ensure the *possibility* of future wealth. Also, the 'survivorship discount' I propose adjusts for the risk that there is no one there to be rich."
  **Soft Spot:** If growth continues despite climate damage (adaptive capacity), your argument looks like alarmism. You are betting against the standard economic forecast.

  #### 4. The Non-Identity Problem (The "Nuclear Option")
  **Who:** Analytic Philosopher
  **Phrasing:** "You're comparing welfare between present people and future people. But long-term infrastructure changes the course of history, which changes who gets conceived. The people in 2150 won't exist if we build the sea wall. So they aren't 'better off' than they would have been; they wouldn't be at all. Your cost-benefit analysis compares utilities across non-identical subjects. It's incoherent."
  **Reply:** "That's the Parfit objection. But policy isn't just about maximizing utility for specific individuals; it's about maintaining the *conditions* for agency and rights. We aren't promising specific people a specific happiness level. We are promising that whoever comes to exist will inherit a world capable of sustaining rights and welfare. We shift from a person-affecting view to a principle-based view: do not degrade the preconditions of human existence."
  **Soft Spot:** This is philosophically contentious. A hardline person-affecting theorist will say you've just changed the subject rather than solved the problem.

  #### 5. The "Uncertainty Cuts Both Ways" Objection
  **Who:** Treasury Economist #2
  **Phrasing:** "You say uncertainty lowers the discount rate because of the Weitzman effect. But uncertainty also means future tech might solve the problem cheaper. If we wait, we might have fusion power. Discounting accounts for the opportunity to invest later when we know more. Why does uncertainty only favor action in your model?"
  **Reply:** "Because the risks are asymmetric. Technological optimism is a 'gain' uncertainty; climate tipping points are 'loss' uncertainty with non-linear tails. In decision theory, when the downside is ruin (absorbing state), you cannot average it out with upside potential. The precautionary principle isn't moral here; it's mathematical. You can't compound your way out of an absorbing state."
  **Soft Spot:** Defining "ruin" objectively is hard. They might argue migration or adaptation avoids ruin.

  #### 6. The Consistency Objection
  **Who:** Treasury Economist #1
  **Phrasing:** "You say discounting for time is prejudice, like discounting for location. But we *do* discount for location. We don't build a bridge in Scotland just because it helps Scots. We weigh it against costs in London. If time is just another dimension, why shouldn't we arbitrage across it the same way?"
  **Reply:** "Because space allows arbitrage; time does not. I can move money from London to Scotland instantly. I cannot move resources from 2024 to 2124 without investing them through the intervening time, subject to compounding risks. Spatial discounting reflects transport costs; temporal discounting reflects existential risk. Conflating the two ignores the irreversibility of the time dimension."
  **Soft Spot:** Financial instruments *do* allow arbitrage across time (bonds, futures). They will pounce on this.

  #### 7. The "We Already Do This" Objection
  **Who:** Treasury Lead
  **Phrasing:** "Green Book guidance already uses a declining discount rate schedule. We drop from 3.5% to 3% after 30 years, down to 1% after 300. You're fighting a ghost. What actual policy changes if we adopt your view?"
  **Reply:** "Your decline is still anchored to a positive Pure Time Preference. You start at 3.5% because of social preference. I'm arguing the start point should be the risk-free rate plus survival probability, which is lower. And your tail doesn't go low enough fast enough. For a 100-year sea wall, the difference between your schedule and a survivorship-based schedule changes the Net Present Value by an order of magnitude. It changes 'don't build' to 'build immediately'."
  **Soft Spot:** You need to have that NPV calculation ready. If you don't, you're just hand-waving about magnitude.

  #### 8. The Political Reality Objection
  **Who:** Environmental Economist (Quietly)
  **Phrasing:** "Even if you're right morally and mathematically... how do we sell this? A discount rate of near-zero implies we should consume almost nothing now. It's politically suicidal. Are you asking us to recommend policy that no government will ever adopt?"
  **Reply:** "I'm not recommending zero consumption. I'm recommending we stop using the discount rate to hide the ethical choice. If the cost is high, say it's high. Don't use a 4% discount rate to pretend the future doesn't matter. Make the trade-off explicit in the budget, not hidden in the exponent."
  **Soft Spot:** This is the truth, but it makes you look naive about how government actually functions.

  ***

  ### Strategic Advice

  **1. Concede Up Front:**
  Before you finish your opening talk, explicitly concede that **scarcity requires rationing.** Say: *"I am not arguing we should fund every project. I am arguing that the discount rate is the wrong tool to do the rationing for intergenerational projects. Use budget caps for scarcity; use discount rates for time-risk."* This disarms the Treasury fear that you want to open the floodgates.

  **2. The One Reply That Must Land:**
  The **Weitzman/Uncertainty Argument** (Objection #5). This is your load-bearing beam. If you can convince them that *mathematical uncertainty about the rate itself* necessitates a declining effective rate regardless of moral stance, you bypass the "morality vs. markets" fight. You are speaking their language (probability) to get to your destination (low discounting). If this fails, you are just another ethicist.

  **3. The Two One-Liners (For Time Pressure):**
  *   **To the Engineer:** "Don't put a principle in the cell. Put a lookup table. I'll send you the schedule."
  *   **To the Finance Person:** "The market prices liquidity, not survival. Don't use a price of liquidity to value survival."

  **4. Tone Check (The "Retired Biologist" Trap):**
  *   **Avoid:** "In my forest, we learned..." or "Nature teaches us..." This signals anecdotal reasoning.
  *   **Adopt:** "In long-horizon systems, we observe..." or "The data from rotation cycles suggests..."
  *   **Why:** You need to sound like a *systems analyst* who happens to know ecology, not an *ecologist* trying to do economics. Use their vocabulary (variance, horizon, arbitrage, absorbing states) to translate your intuition.

  ***

  ### The Question You Hope Nobody Asks

  **The Question:** "If we adopt your low discount rate, we validate projects that benefit people who, due to the Non-Identity Problem, do not have a claim on us because our policy brings them into existence. Are you not just creating a 'duty to existence' that overrides the rights of the living based on a metaphysical fiction?" (Asked by the Philosopher, supported by the skeptical Economist).

  **How Bad Is It?**
  Theoretically: Catastrophic. It undermines the "benefit" side of your Cost-Benefit Analysis.
  Practically: Low. The committee cares about *risk management*, not metaphysical consistency. They will not reject a sea wall because of Parfit.

  **The 2-Minute Defense:**
  "Two points. First, in law and policy, we already act on duties to 'unconceived' parties all the time—nuclear waste storage, genetic screening, endowment funds. We treat the *continuity of the community* as the moral patient, not just the specific individuals. Second, even if the specific individuals change, the *capacity for welfare* does not. If we leave a world with a capacity for 10 billion happy lives, versus one with a capacity for 1 billion suffering lives, the identity of the people doesn't negate the value of the capacity. We are protecting the *stage*, not just the *actors*. If the stage collapses, the play doesn't happen."

  **Honest Note:** This is a "rights-based" workaround. A strict utilitarian philosopher will not be satisfied, but a government committee will accept "protecting the stage" as a valid mandate for infrastructure. Do not get dragged into a debate about Person-Affecting Views vs. Impersonal Views. Pivot back to *capacity* and *risk*.
