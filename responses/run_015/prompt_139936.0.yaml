prompt: |-
  You are a professional philosopher who also knows decision theory and has sat in a few government cost-benefit meetings — please think carefully about this one, and before you write anything spend a paragraph or two brainstorming what my particular audience actually cares about and where they'll push. Then give me the prep sheet.

  Context: I retired from forest ecology a few years back (long-rotation silviculture, mostly — the kind of work where you plant something your grandchild might harvest, so discount rates were never an abstraction for us) and since then I've been reading my way into philosophy, probably faster than I should. I've been asked to give the opening talk, 45 minutes plus half an hour of questions, to the long-term infrastructure and climate adaptation committee of a ministry. My thesis is this: there is no defensible positive pure rate of time preference. Discounting a benefit solely because it arrives later is a prejudice, and it has no more standing than discounting a benefit because it arrives somewhere else.

  But I don't want to just assert that, so I've tried to say what I think should replace it. Two moves.

  First: I want to split the thing people lump together. There is one discount on the future that I think is legitimate and is not a moral judgement at all, namely the chance that there will be nobody there to recieve the benefit — an actuarial term, like adjusting a treatment by the chance the patient dies first. I've been calling it the survivorship discount. Everything else that looks like time preference I want to reclassify: extinction and civilisational hazard goes in the first bucket; expected growth in future consumption, and opportunity cost of capital, goes in a second bucket that is empirical, contested, and definitely not something you read off a moral intuition.

  Second: that second bucket has a property people keep missing, and it's the one bit of my own field I'm confident about. If you do not know the future rate but you have a spread of plausible constant rates, then at long horizons the effective rate doesn't stay at the middle of the spread, it sinks toward the bottom of it — the slowest-decaying component carries almost all the weight, same reason the long-lived tail dominates in a mixture of exponentials. I've since found that economists have a version of this argument, but the people in the room won't have internalised it, and I think it's the single most load-bearing thing I have to say. It means a constant exponential is the wrong functional form for anything past a few decades, and my committee cares about a hundred years and a sea wall.

  The audience, as precisely as I can describe it: two Treasury economists who run the standard cost-benefit machinery with a declining schedule and who think market rates of return are the only disciplined input and that anything else is amateur hour; an environmental economist who is broadly on my side but is nervous about imposing real costs on people alive now for hypothetical people later; a finance person from the central bank who will say the real return on capital is what it is and that I'm leaving money on the table; an analytic philosopher who works on population ethics and does not suffer fools; a geotechnical engineer who is on the committee because of a nuclear waste repository and who wants a number to put in a spreadsheet, not a principle; and a climate scientist who is my ally and will ask about tipping points and irreversibility the moment I stop talking.

  What I want from you is the Q&A prep sheet: the eight or so objections I'll actually get from this room, ordered by how much damage they'd do, each phrased the way that particular person would phrase it and in their vocabulary, with a two-minute reply and an honest note on where my reply is soft. Tell me what I should concede up front before anyone asks, which single reply has to land for the whole thing to survive, and which two objections I need a one-line answer for because I'll be running out of clock. Flag anywhere I'm going to sound like a retired biologist wagging his finger at people who know more about this than I do, and tell me how not to.

  And include the question I'm hoping nobody asks. I have a guess what it is — it's the Parfit-style worry that a hundred-year policy changes which people exist, so there may be nobody later who is made better off by what we do and nothing for my cost-benefit comparison to compare. If that's the one, tell me how bad it actually is for me and what I can say in two minutes that isn't hand-waving. If you think something else is worse, say so.
