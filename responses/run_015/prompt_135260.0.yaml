  # Translation

  *   The "stream of consciousness" is not raw footage but the final draft, heavily revised before reaching the page of the mind.
  *   There is no "implied author" inside the head assembling this scene; the narration generates the narrator rather than vice versa.
  *   The "self" is a character construct, a useful posit created by the text to maintain point of view consistency, not the entity doing the perceiving.
  *   First-person reports are not authoritative verdicts but unreliable narration; they are data about the final draft, not the revision history.
  *   The gap between what the character says she feels and what the text shows is not a mistake but the structural reality of consciousness.
  *   Consciousness is the published text; the neural machinery is the cutting-room floor, inaccessible to the narration.
  *   Your production register makes this revision history visible, treating the left column as the avowed text and the right as the editor's log.

  # Residue

  *   **Translates Cleanly:**
      *   "Character as useful posit" maps perfectly to "self as posited character."
      *   "Cutting-room floor" captures the suppressed rival action-tendencies in your production register.
      *   "Unreliable narrator" handles the gap between avowal and mechanism.
  *   **Translates with Distortion:**
      *   *The User:* In fiction, every illusion has a reader. The theory denies an inner witness. Craft vocabulary presupposes an audience; the theory dissolves the audience into the text, leaving the "reader" of the mental draft unaccounted for.
      *   *Fact of the Matter:* Craft treats the "real person" as the author outside the text. The theory claims there is no author outside the text. Using "implied author" risks smuggling in a real person where the theory denies one. This shifts the claim from "no further fact of the matter" to "stylistic choice."
  *   **No Counterpart:**
      *   *The Coffee Dispute:* Is the quarrel verbal (drafts vs. published text)? No. Craft cannot adjudicate truth, only coherence. The writer claims authority over the published text; the theorist claims the text is fiction. This is not an editorial disagreement but a conflict over whether the book describes a world or constitutes one.
  *   The residue indicts neither; it marks the boundary where craft, which tools illusion, meets theory, which dismantles it.
