answer: |-
  Here is a translation of the standard philosophical account of consent into the vocabulary of the novelist, followed by the residue report you requested.

  ### I. The Standard Account, Translated

  In philosophy, valid consent is the mechanism that transfers moral authority from one agent to another. In your terms, valid consent is the moment the character successfully takes the pen from the author and writes the next beat of the scene themselves. If the consent is invalid, the scene is not a collaboration between character and world; it is a puppet show.

  Here are the three conditions, restated:

  **1. The Competence Condition (Agency Capacity)**
  *Philosophy:* The agent must have the rational capacity to understand the decision and its consequences.
  *Novelist's Terms:* **Interiority and Authorship.**
  Does the character possess a functioning interior narrator? If a character is intoxicated, developmentally delayed, or psychologically broken (as with your suggestible heir), their interiority is compromised. They cannot "author" the choice because the mechanism of self-reflection is offline. When you write a character who lacks competence, you are writing a scene where the "yes" comes from the body, but the "will" is absent. The reader senses this as a disconnect between the dialogue and the point-of-view access. If we are in her head and the head is foggy, the signature on the page is forged.

  **2. The Information Condition (Knowledge)**
  *Philosophy:* The agent must not be acting on false beliefs regarding the nature of the transaction.
  *Novelist's Terms:* **Dramatic Irony and the Knowledge Gap.**
  This is the management of what the character knows versus what the reader knows. Valid consent requires that the character's mental model of the scene matches the actual scene. If you employ dramatic irony where the reader knows the suitor is married but the protagonist does not, the protagonist's "yes" is structurally unstable. The character is consenting to a draft of the scene that does not exist. For consent to be valid, the knowledge gap must be closed by truth, not bridged by the character's assumptions.

  **3. The Coercion Condition (Voluntariness)**
  *Philosophy:* The choice must not be made under undue pressure or threat that leaves no reasonable alternative.
  *Novelist's Terms:* **Stakes and Scene Authority.**
  Who set the stakes? If the stakes are natural (a storm is coming), the choice is the character's. If the stakes are manufactured by another agent to force a specific outcome (a gun to the head, or a confession extracted at a funeral), the choice is authored by the antagonist, not the protagonist. Coercion occurs when the character's agency is overpowered by the scene's constraints. The reader asks: "Did she choose this, or did the plot force her hand?" If the latter, the consent is a reaction, not an action.

  ***

  ### II. The Three Distinctions

  You identified three friction points where the philosophy gets granular. Here is how they map to your toolkit.

  **1. Deception: Nature of the Act vs. Circumstances**
  *Philosophy:* Distinguishes between *fraud in the factum* (lying about what is happening) and *fraud in the inducement* (lying about why it's a good idea).
  *Novelist's Terms:* **The Script vs. The Motivation.**
  *   **Nature of the Act (The Script):** This is the marriage proposal made under an alias where the character believes they are marrying Person A, but the legal document binds them to Person B. Or, a doctor touching a patient under the guise of medical care when the intent is sexual. Here, the character is consenting to a different *scene* than the one being played. In your toolkit, this renders the "yes" null. The character signed up for a tragedy but is living a farce. The will is bypassed because the object of the will is nonexistent.
  *   **Circumstances (The Motivation):** This is the suitor who lies about his wealth to secure the marriage. The character knows they are marrying *him*, but they are motivated by a false premise about his status. Here, the character authored the choice, but the *reasons* for the choice were contaminated. The "yes" is valid in terms of plot (the marriage happens), but morally rotten.
  *   **The Translation:** Does the lie change the *verb* (what is being done) or the *adjective* (the quality of what is being done)? If it changes the verb, consent is void. If it changes the adjective, consent is valid but ethically compromised.

  **2. Offers vs. Threats (The Baseline Problem)**
  *Philosophy:* An offer widens options; a threat narrows them. The hard case is when the offeror created the desperation (e.g., "I burned your barn, but I'll sell you firewood").
  *Novelist's Terms:* **Expanding the Plot vs. Cornering the Character.**
  *   **Standard Distinction:** An offer gives the character a new path they didn't have before (a rich uncle offers an inheritance). A threat removes a path they previously had (a blackmailer threatens exposure).
  *   **The Hard Case (Created Desperation):** This is a backstory problem. If the antagonist created the desperation in a previous chapter (burned the barn), the current "offer" (selling firewood) feels like coercion to the reader, even if technically it widens the options from "freeze" to "warm."
  *   **The Translation:** You must look at the *arc*, not just the *scene*. If the desperation is part of the antagonist's active plot against the protagonist, the offer is a threat in disguise. The reader tracks the lineage of the stakes. If the hole was dug by the person now selling the ladder, the ladder is a tool of coercion. Valid consent requires that the desperation be incidental to the offeror, not engineered by them.

  **3. Wrong Act vs. No Consent (Void vs. Voidable)**
  *Philosophy:* Some defects make the act morally wrong but the consent stands (voidable); others make it so there was no consent at all (void).
  *Novelist's Terms:* **Unethical Scene vs. Invalid Scene.**
  *   **Wrong Act (Voidable):** The character was pressured at a funeral to confess love. They said "yes." The scene happened. The relationship exists. But the reader feels a moral violation. The consent was real enough to move the plot, but it was extracted unethically. The character is bound by their word, but the author condemns the circumstance.
  *   **No Consent (Void):** The character was unconscious, or the partner was an imposter swapping places in the dark. Here, the scene *did not happen* in the moral universe, even if it happened physically.
  *   **The Translation:** This is the difference between a breach of trust and a plot hole in reality. If there is no consent, the character is a victim of a crime. If there is flawed consent, the character is a victim of a tragedy. In the first, the character is innocent of the outcome. In the second, the character must live with the consequences of a "yes" they wish they could retract.

  ***

  ### III. The Residue Report

  You asked for an audit of what is lost in translation, and whether your toolkit is deficient or the philosophical framework is.

  **1. What Has No Expression in the Novelist's Toolkit?**
  *   **The Normative Baseline:** Philosophy requires a objective standard of "reasonable alternatives" to determine coercion. Fiction has no objective baseline; it only has the character's subjective experience. A philosopher asks, "Was there a reasonable alternative?" A novelist asks, "Did it *feel* like there was an alternative?" Your toolkit lacks a mechanism to adjudicate truth outside of the character's perception. You cannot easily distinguish between a character who is *actually* coerced and a character who is *paranoid* about coercion without stepping outside their POV.
  *   **The Binary Switch:** Philosophy often needs a binary verdict (Consent/No Consent) for legal or moral adjudication. Fiction thrives in the continuum. Your toolkit is designed to explore the *ambiguity* of consent, not resolve it. You have no tool for "validating" a scene; you only have tools for "complicating" it.

  **2. Are Novelist Tools Doing the Same Work?**
  *   **Dramatic Irony:** This does the heavy lifting for the **Information Condition**. It is arguably superior to the philosophical account because it tracks the *emotional impact* of the deception, not just the factual gap.
  *   **Interiority:** This handles the **Competence Condition** well, but it risks solipsism. Philosophy cares about observable capacity; fiction cares about felt capacity. A character can feel competent while being objectively compromised (e.g., a manic episode). Your toolkit captures the tragedy of this; philosophy captures the liability.
  *   **Agency/Authorship:** This maps well to **Voluntariness**, but fiction allows for "tragic consent." A character can be coerced and still own the choice (e.g., Sophie's Choice). Philosophy struggles here, often calling it coercion. Fiction recognizes it as a horrific form of agency. Your toolkit accommodates the burden of choice better than the philosophical framework, which prefers to absolve the coerced.

  **3. Is the Toolkit Missing Something, or Is Philosophy Less Clear?**
  The residue suggests that **the philosophical framework is less clear than it looks**, specifically regarding the "Created Desperation" distinction.

  Philosophy struggles to define the "baseline" against which threats are measured. (Is the baseline how things were yesterday? How they ought to be?) Your toolkit handles this more intuitively through **narrative causality**. You know the offeror created the desperation because you wrote the backstory. The reader knows it because they feel the narrative arc tightening.

  However, your toolkit is missing a **vocabulary for the aftermath.** Philosophy distinguishes between *void* (it never happened) and *voidable* (it happened but was unfair) to determine restitution. Fiction often blurs this. If a character accepts an inheritance under undue influence, does the money belong to them in the story's reality? Your toolkit tells you how they *feel* about the money (guilt, shame), but it doesn't help you determine the *status* of the transaction within the logic of the world.

  **Conclusion:**
  You do not need to adopt the philosophical framework to write consent accurately; you are already tracking the same variables through *stakes, interiority, and irony*. However, the philosophical distinction between **Fraud in the Factum** (The Script) and **Fraud in the Inducement** (The Motivation) is a precision tool your current vocabulary lacks. Adopting that distinction would allow you to calibrate exactly *why* a reader feels betrayed in one scene (the act itself was a lie) versus manipulated in another (the reasons were lies).

  The residue is not a failure of your toolkit, but a difference in aim. Philosophy seeks to judge the act; you seek to inhabit the consequence. The philosopher wants to know if the contract is binding. You want to know if the character can live with the signature.
