prompt: |-
  I write literary fiction, and my working vocabulary is a novelist's: point of view, what a character knows versus what the reader knows, interiority, stakes, whether a choice a character makes reads as authored by that character or by whoever set the scene around her. I keep having to make calls about consent on the page — a marriage proposal made under an alias, a confession of love extracted at a funeral, an inheritance accepted by a character I've written as suggestible — and I'd like to understand what the philosophers actually say, in my terms rather than theirs. Please restate the standard philosophical account of what makes consent valid — the competence condition, the requirement of sufficient information, and the coercion condition — in the vocabulary I use, as faithfully as you can. Along the way I'd like you to handle three distinctions that I suspect matter: the distinction between deception about something that bypasses the will (a lie about the nature of the act) and mere non-disclosure or deception about circumstances that only make the act more attractive; the difference between an offer that widens a character's options and a threat that narrows them, including the hard cases where the person doing the offering created the desperation in the first place; and the difference between a defect in consent that makes the act wrong and a defect that makes it not consent at all. Then give me the residue report: which of these distinctions have no expression in a novelist's toolkit, whether the ones I do have (dramatic irony, unreliable narration, the sense that a character's "yes" is or is not hers) are doing the same work or different work, and whether the residue suggests my toolkit is missing something the philosophers see or that the philosophical framework is less clear than it looks. Please write the answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** A literary fiction novelist.
      *   **Vocabulary:** Novelist's terms (POV, interiority, stakes, agency/authorship of choice, dramatic irony, unreliable narration, etc.).
      *   **Task:** Restate the standard philosophical account of valid consent (competence, information, coercion) using the novelist's vocabulary.
      *   **Specific Distinctions to Handle:**
          1.  Deception about the nature of the act (fraud in the factum) vs. deception about circumstances/inducements (fraud in the inducement).
          2.  Offers (widening options) vs. Threats (narrowing options), including cases where the offeror created the desperation.
          3.  Defect making the act *wrong* vs. defect making it *no consent at all* (void vs. voidable).
      *   **Residue Report:** Analyze what doesn't translate, compare novelist tools (dramatic irony, etc.) to philosophical concepts, and evaluate if the novelist's toolkit is missing something or if philosophy is less clear than it appears.
      *   **Language:** American English.

  2.  **Deconstruct the Philosophical Concepts into Novelist Terms:**
      *   *Competence:* Can the character author their own choice? Do they have the capacity for interiority regarding this decision? Is the "narrator" of their mind functioning?
      *   *Information:* What does the character know vs. what the reader knows (dramatic irony)? Is the gap bridged by lies or silence?
      *   *Coercion/Voluntariness:* Is the choice authored by the character or by the scene/antagonist? Are the stakes manipulated?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the parallel between philosophy and fiction (both deal with human agency). Set the tone (respectful, precise, literary).

      *   **Part 1: The Standard Account (Translated):**
          *   *Competence:* Call it "Agency Capacity." Can the character hold the pen? If they are drunk, child-like, or broken, they aren't the author of the action.
          *   *Information:* Call it "The Knowledge Gap." Use "Dramatic Irony." If the character says "yes" based on a false premise, is the "yes" real?
          *   *Coercion:* Call it "Authorship of the Choice." Who is driving the plot? If the stakes are rigged, the character isn't choosing; they are reacting to a trap.

      *   **Part 2: The Three Distinctions:**
          *   *Distinction 1 (Deception):* *Fraud in the Factum* vs. *Fraud in the Inducement.*
              *   Novelist terms: "The Script" vs. "The Motivation."
              *   Example: Thinking you are signing a guestbook vs. a deed (Nature of Act). Thinking you are marrying a rich man vs. a poor man (Circumstances).
              *   Translation: Did they agree to *this scene* or just a *version* of this scene?
          *   *Distinction 2 (Offers vs. Threats):* *Baseline Problem.*
              *   Novelist terms: "Expanding the Plot" vs. "Cornering the Character."
              *   The Hard Case (Created Desperation): If the antagonist burned the house to sell the fire insurance, is the offer to buy the land coercion?
              *   Translation: Who wrote the desperation into the backstory?
          *   *Distinction 3 (Wrong vs. No Consent):* *Void vs. Voidable.*
              *   Novelist terms: "Invalid Scene" vs. "Unethical Scene."
              *   If no consent: The scene never happened (metaphysically). It's a plot hole in reality.
              *   If wrong consent: The scene happened, but it's a moral violation.
              *   Translation: Is the contract null, or is it a breach of trust?

      *   **Part 3: The Residue Report:**
          *   *What doesn't translate?* Philosophy wants binary rules (Valid/Invalid). Fiction lives in the gray (Ambiguity). Philosophy cares about the *moment* of consent; fiction cares about the *arc*.
          *   *Novelist Tools vs. Philosophical Work:*
              *   *Dramatic Irony:* Handles the Information condition well.
              *   *Interiority:* Handles Competence well.
              *   *Agency/Authorship:* Handles Coercion, but fiction allows for "tragic choices" where coercion exists but consent is still "real" enough to drive the plot.
          *   *Is something missing?* Fiction lacks a normative baseline. Philosophy asks "Ought this to bind?" Fiction asks "Does this bind the character psychologically?"
          *   *Is philosophy less clear?* Yes. The "baseline" problem (who created the desperation) is a narrative problem (backstory) as much as a moral one.

  4.  **Refining the Voice:**
