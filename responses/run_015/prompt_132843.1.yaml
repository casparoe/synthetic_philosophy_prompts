prompt: |-
  I am in the middle of drafting a novel about a travel essayist who spends each season in a different country, and lately my writing group has become obsessed with a question that keeps bleeding into the manuscript: when a visitor steps into a place with its own unwritten choreography—whether it is the precise arithmetic of tipping in a Tokyo taxi, the silent geometry of queuing in London, or the negotiated anarchy of jaywalking in Hanoi—does she acquire a moral obligation to perform the local script, or is she merely playing at courtesy?

  We have argued this for months without resolution. One faction holds that conventions are coordination devices with moral weight only for those embedded in the practice; a visitor, lacking the reciprocal history and the shared vulnerability of membership, owes only non-maleficence, not deference to the choreography itself. The other faction insists that the harm of non-compliance is not distributed differently for outsiders—the queue still collapses, the server still suffers, the pedestrian flow still fractures—so the obligation attaches to the act, not the identity of the actor. We agree on the sociology, we agree that suffering is bad, and yet neither side has moved. I have begun to wonder whether we are not arguing about morality at all, but about two different pictures of what a social world is: one in which rules are contracts among insiders, and one in which rules are environmental conditions that anyone present must navigate with care. I have tried to sharpen the disagreement by introducing what I call protocol morality versus hospitality morality—the idea that some obligations bind us because we have agreed to the game, while others bind us because we have entered someone else's stage—but I am unsure whether this distinction resolves anything or merely renames the stalemate.

  So I want to ask: is this impasse substantive, verbal, or a case of two groups answering different questions under the single heading of moral obligation? Are we divided by hidden empirical assumptions about how much damage an ignorant visitor actually causes, or by bedrock intuitions about belonging and trespass that neither side can argue for? And given whatever diagnosis you offer, what would actually count as progress—a conceptual distinction, a thought experiment, an empirical study of harm, or the admission that the question itself is malformed? I am asking not for a verdict on tipping or queuing, but for a diagnosis of the structure of our disagreement, supported by what each side actually says, together with an honest assessment of whether anything could move it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a novelist drafting a story about a travel essayist.
      *   **Problem:** Their writing group is stuck in a philosophical impasse regarding a specific ethical question: Does a visitor have a *moral obligation* to follow local social norms (tipping, queuing, jaywalking), or is it merely *courtesy*?
      *   **The Two Factions:**
          *   *Faction A (Contract/Insider View):* Conventions are coordination devices for members. Visitors lack reciprocal history/vulnerability. Obligation = non-maleficence (don't harm), not deference to the script.
          *   *Faction B (Environmental/Impact View):* Harm is the same regardless of who causes it. The queue collapses either way. Obligation attaches to the *act*, not the *actor's identity*.
      *   **User's Hypothesis:** Is this about two different pictures of the social world? (Rules as contracts vs. Rules as environmental conditions). They've tried "protocol morality" vs. "hospitality morality" but aren't sure if it helps.
      *   **The Ask:** Diagnose the structure of the disagreement (substantive, verbal, or talking past each other?). Identify hidden assumptions. Suggest what would count as progress (conceptual distinction, thought experiment, empirical study, or admitting the question is malformed).
      *   **Constraint:** Do not give a verdict on tipping/queuing. Focus on the *structure of the disagreement*.

  2.  **Deconstruct the Disagreement:**
      *   *Faction A (Insider/Contract):* Focuses on *fairness* and *reciprocity*. "I didn't sign up for this game." Moral weight comes from membership/participation in the practice.
      *   *Faction B (Outsider/Impact):* Focuses on *consequences* and *universalizability*. "Harm is harm." Moral weight comes from the outcome of the action.
      *   *Core Tension:* This looks like a clash between *Contractualist/Conventionalist* ethics vs. *Consequentialist/Universalist* ethics.
      *   *Is it Verbal?* Partly. They might be using "moral obligation" to mean different things (obligation of justice vs. obligation of beneficence).
      *   *Is it Substantive?* Yes. They disagree on the source of normativity. Is normativity internal to a practice or external based on impact?
      *   *Hidden Assumptions:*
          *   Faction A assumes visitors *cannot* fully participate or understand the nuance, so holding them to the standard is unfair.
          *   Faction B assumes the *system* is fragile enough that one outsider breaks it, or that the *principle* of consistency matters more than the individual impact.

  3.  **Evaluate the User's "Protocol vs. Hospitality" Distinction:**
      *   *Protocol Morality:* Rules of the game. (Faction A).
      *   *Hospitality Morality:* Guest/Host relationship. (User's invention).
      *   *Critique:* "Hospitality" usually implies the *host* has obligations to the *guest*. Here we are asking about the *guest's* obligations. A better term might be "Stewardship" or "Ecological" morality. However, the distinction is useful because it highlights *source of authority*.

  4.  **Diagnose the Impasse:**
      *   It is **substantive**, not merely verbal. They disagree on the *grounding* of moral duties in cross-cultural contexts.
      *   It is also a case of **talking past each other** regarding the *function* of the norm. Faction A sees norms as *constitutive* (make the game possible); Faction B sees norms as *instrumental* (prevent harm).
      *   *Key Insight:* The disagreement mirrors the philosophical debate between **Internalism** (reasons depend on internal motives/membership) vs. **Externalism** (reasons exist independently of the agent's stance).

  5.  **Determine What Counts as Progress:**
      *   *Empirical Study?* Unlikely to resolve the *moral* question, only the *harm* question. Faction A would say "Even if harm is X, I didn't agree to the rule."
      *   *Verdict?* No, the user explicitly asked to avoid this.
      *   *Conceptual Distinction?* Yes. We need to separate *Blame* from *Obligation*.
      *   *Thought Experiment?* We need a case where harm is zero but norm violation is high, or harm is high but norm is ambiguous.
      *   *Reframing:* The question might be malformed if it assumes "Moral Obligation" is a binary switch. It's likely a gradient based on *knowledge*, *duration*, and *capacity*.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the richness of the problem. Validate the user's intuition that this is about "pictures of the social world."
      *   *Diagnosis:* It's a **Category Clash**.
          *   Side A is arguing from **Fairness/Reciprocity** (Contractualism).
          *   Side B is arguing from **Consequence/Integrity** (Consequentialism/Deontology).
          *   They aren't just disagreeing on the answer; they are disagreeing on *what kind of thing* a social norm is.
      *   *The "Verbal" Aspect:* They are using "Obligation" differently. Side A means "Duty of Justice" (owed because of agreement). Side B means "Duty of Care" (owed because of impact).
      *   *The "Substantive" Aspect:* They disagree on the *ontology of social facts*. Is a queue a physical reality (like a wall) or a social construct (like a handshake)?
      *   *Critique of "Protocol vs. Hospitality":* It's a good start but "Hospitality" is the wrong vector. Suggest **"Jurisdictional" vs. "Ecological"**.
      *   *Path to Progress:*
          1.  **Decouple Blame from Obligation:** You can have an obligation without being blameworthy for failing it (due to ignorance). Side A conflates the two.
          2.  **The "Fragility" Variable:** Empirical study *could* help if it shows whether one outsider actually breaks the system.
