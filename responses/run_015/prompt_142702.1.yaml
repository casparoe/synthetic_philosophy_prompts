  write ordered steps: check the baseline definition, check whether the measure distinguishes agent-caused change from background drift, check if the metric smuggles in values through weighting or reference classes, and flag the exact point where the check stops being technical and becomes a value call. apply it to three worked cases: a warehouse robot that only penalizes displacing objects heavier than 20kg, a medical AI that penalizes any change to patient records outside its diagnosis field, and a climate simulation agent that penalizes temperature deviations from its training distribution — i have a hunch the last one should fail but the audit might approve it. say clearly what the procedre can't settle, and include one answer the board won't like.

