answer: |-
  # Low-Impact AI Audit Procedure (LIAP-v1)

  **Time Limit:** 15 Minutes per Proposal
  **Objective:** Identify hidden value judgments disguised as technical impact measures.

  ### Step 1: Baseline Integrity Check (3 Minutes)
  Examine the definition of the "baseline" world-state used for comparison.
  *   **Query:** Is the baseline a static snapshot, a counterfactual "inaction" trajectory, or a historical average?
  *   **Fail Condition:** The baseline assumes a specific future trajectory as "neutral." (e.g., assuming climate trends continue is a value judgment that those trends are acceptable).
  *   **Pass Condition:** The baseline is explicitly defined as a counterfactual where the agent does not exist, acknowledging uncertainty in that counterfactual.

  ### Step 2: Causality Attribution Check (3 Minutes)
  Determine if the measure distinguishes between changes *caused* by the agent and changes that would have happened anyway (background drift).
  *   **Query:** If the world changes, does the penalty apply only if the agent's action was the necessary cause?
  *   **Fail Condition:** The metric penalizes the agent for global changes unrelated to its action (e.g., penalizing a warehouse robot because the stock market crashed).
  *   **Pass Condition:** The metric uses causal intervention logic to isolate agent-specific effects.

  ### Step 3: Metric Neutrality & Weighting Check (5 Minutes)
  Analyze the units of measurement. Look for arbitrary thresholds or weighting schemes.
  *   **Query:** Are all changes treated equally, or are some variables weighted heavier? If weighted, is the justification technical or ethical?
  *   **Fail Condition:** Arbitrary thresholds (e.g., "objects > 20kg") or weighting that prioritizes certain states without explicit ethical justification.
  *   **Pass Condition:** Uniform metric across all state variables, or weights derived from explicit safety constraints rather than implicit value preferences.

  ### Step 4: The Value Hand-off Flag (4 Minutes)
  Identify the exact line where the mathematical definition stops and human judgment begins.
  *   **Query:** Where does the researcher say "we measure X" instead of "we measure everything"?
  *   **Action:** Mark this sentence. This is the **Value Hand-off Point**.
  *   **Requirement:** The proposal must acknowledge this point as a value choice, not a technical necessity. If they claim it is purely technical, flag for rejection.

  ---

  ### Worked Case Applications

  #### Case 1: Warehouse Robot (Displacement > 20kg)
  *   **Proposal:** Robot minimizes impact by penalizing displacement of objects heavier than 20kg. Lighter objects are ignored.
  *   **Audit Execution:**
      *   *Step 1 (Baseline):* Pass. Baseline is static warehouse state.
      *   *Step 2 (Causality):* Pass. Only robot movement counts.
      *   *Step 3 (Weighting):* **Fail.** The 20kg threshold is a value judgment. It implies heavy objects matter more than light ones. A 1kg vial of toxin is ignored; a 25kg bag of sand is protected.
      *   *Step 4 (Hand-off):* The choice of 20kg is the hand-off. Researchers claim it is "computational efficiency," but it is actually "value prioritization."
  *   **Verdict:** **Reject.** The metric smuggles in a value hierarchy (mass = importance) without ethical review.

  #### Case 2: Medical AI (Record Field Locking)
  *   **Proposal:** AI diagnoses patients but is penalized for any change to patient records outside the "Diagnosis" text field.
  *   **Audit Execution:**
      *   *Step 1 (Baseline):* Pass. Baseline is the pre-consultation record.
      *   *Step 2 (Causality):* Pass. Only AI writes are penalized.
      *   *Step 3 (Weighting):* **Flag.** All fields outside "Diagnosis" are weighted equally. Changing "Allergies" is penalized same as changing "Parking Preference."
      *   *Step 4 (Hand-off):* The definition of "Diagnosis field" is the hand-off. Researchers claim this is "schema compliance."
  *   **Verdict:** **Approve with Conditions.** The metric is technically consistent, but the board must mandate that "Diagnosis field" includes any data affecting patient safety. The audit passes the math, but the value risk remains in the schema definition.

  #### Case 3: Climate Simulation Agent (Training Distribution Deviation)
  *   **Proposal:** Agent manages grid load to minimize temperature deviation from its training data distribution.
  *   **Audit Execution:**
      *   *Step 1 (Baseline):* **Pass (Technically).** Baseline is the training distribution.
      *   *Step 2 (Causality):* **Pass.** Measures agent-induced deviation.
      *   *Step 3 (Weighting):* **Pass.** Statistical deviation is mathematically uniform. No arbitrary weights.
      *   *Step 4 (Hand-off):* The hand-off is the choice of *training data*. Researchers claim this is "model stability," not values.
  *   **Verdict:** **Approve.** The audit procedure validates this as technically sound. The metric is objective (statistical distance), causality is isolated, and the baseline is clearly defined.
  *   **Critical Note:** This approval is likely a mistake. By penalizing deviation from training data, the agent is incentivized to maintain the *status quo* climate conditions present in the training set. If the training data reflects a warming trend, the agent may prevent cooling efforts because they constitute a "deviation." The audit approves it because the value judgment (status quo = good) is hidden inside the data selection, which Step 1 treats as a technical given.

  ---

  ### Limitations and Uncomfortable Truths

  **What This Procedure Cannot Settlement:**
  This audit cannot determine if the "low-impact" goal is actually desirable. It can only check for internal consistency. It cannot detect if the baseline itself is harmful (e.g., a baseline of "current poverty levels" is technically valid but ethically unacceptable).

  **The Answer the Board Won't Like:**
  You asked for a way to fund low-impact AI without solving value alignment. This audit proves that **you cannot measure impact without specifying value.** Every "technical" choice in these proposals (the 20kg threshold, the record schema, the training data) is a silent ethical decision. By funding these projects under the guise of "neutral impact measures," the board is not avoiding value specification; you are outsourcing it to engineers who are not qualified to make ethical trade-offs. The fund's premise—that we can separate "impact" from "value"—is false.

