answer: |-
  1. **Examination Question**

  **Section B: Moral Responsibility (25 Marks)**
  **Time Allocation: 75 Minutes**

  **Question 1**

  Consider the following case:
  An agent, Vesper, has existed for an infinite past. At each of infinitely many earlier stages, Vesper deliberately reshaped her own character in ways for which she was, by hypothesis, responsible. For every state of her character, there is an earlier state she formed responsibly. There is no first such act of self-formation, and there is no moment at which she brought herself into being. She is fully responsive to reasons at every stage.

  Using this vignette, address the following three points in a continuous essay. Do not cite authors or texts.

  1.  Analyze whether the demand for responsibility is a demand that the causal chain terminate (which Vesper may meet) or a demand for origination (which Vesper may not). State which reading the argument requires and what follows for Vesper on each reading.
  2.  Determine whether true moral responsibility, as conceived in this argument, is a quantity admitting of degrees (where a partially self-formed agent retains some share) or a threshold property lost the moment the boundary condition fails. Explain what this choice implies for how we should describe ordinary blame.
  3.  State what a theorist who requires only responsiveness to reasons, rather than origination, must concede about the notion of desert.

  Your answer will be assessed on the precision of your distinctions and the coherence of your argument.

  ***

  2. **Model Answer**

  The case of Vesper is designed to isolate the structural requirement of the Basic Argument from the temporal limitation of finite human lives. By positing an agent with an infinite past of responsible self-formation, the standard regress objection is neutralized. In finite agents, the chain of responsibility stops at birth or genetics, factors outside their control. In Vesper's case, there is no infinite chain that fails to complete because every link is accounted for by a prior responsible act. There is no first act for which she is not responsible. However, this does not secure moral responsibility. The argument's force does not rest on the chain terminating, but on the origin of the chain. Even an infinite series of self-formations fails if the agent never originated the self that does the forming. To be truly responsible, one must be the ultimate source of one's mental nature. Vesper, despite her infinite history, never originates herself; she is always the product of a prior self, ad infinitum. Thus, the argument demands origination, not merely termination. The regress is not the problem; the lack of a true beginning is. Every state of Vesper is determined by a prior state she shaped, but she never shaped the shaper from nothing.

  This distinction clarifies the nature of responsibility within this framework. It is not a quantity admitting of degrees. One cannot be partially the ultimate source of oneself in the way one can be partially tall or partially wealthy. The condition is binary: either one is the ultimate originator of one's character, or one is not. If the boundary condition of origination is not met, the property of true moral responsibility is absent entirely. This is crucial because if responsibility were a degree, Vesper might possess more than a finite agent, and finite agents might possess enough to warrant some blame. But if it is a threshold property, the failure to originate oneself means the property is zero. This has severe implications for ordinary blame. If responsibility is a threshold property and humans are not ultimate originators, then ordinary blame is fundamentally mistaken. It attributes a property to agents that they cannot possess. We may criticize actions, but we cannot justly hold agents responsible in the basic desert sense. The emotional reactivity involved in blame presupposes a power we lack. To blame is to claim the agent could have been otherwise in an ultimate sense, which is false.

  Consequently, a theorist who rejects this conclusion must abandon the requirement of origination. A theorist who requires only responsiveness to reasons can preserve moral responsibility, but at a cost. They must concede that responsibility is not about who one is in an ultimate sense, but about how one functions relative to reasons. This saves the practice of blame from incoherence but sacrifices the notion of basic desert. Blame becomes a tool for regulation or moral communication rather than a metaphysical repayment. The agent deserves blame only insofar as they failed to respond to reasons, not because they created the self that failed. To maintain ordinary blame without origination is to redefine desert as functional rather than foundational. The Basic Argument shows that without self-creation, foundational desert is impossible. Vesper proves that infinite history is not self-creation. Therefore, unless we accept that responsibility is a threshold met only by self-creators, we must accept that no one truly deserves blame in the basic sense. The choice is between incoherent blame or a revised notion of desert that severs the link between ultimate origin and moral worth. We must choose whether our practices track metaphysical truth or social utility. If we choose utility, we admit blame is not about what is deserved but about what works. This is a significant concession about the nature of moral community. It changes the meaning of "ought implies can" from a metaphysical possibility to a functional capacity. Causal responsibility remains, but moral responsibility in the basic sense vanishes.

