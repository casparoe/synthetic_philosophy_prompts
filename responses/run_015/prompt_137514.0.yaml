answer: |-
  You have a sharp eye. You are describing a real, documented cognitive phenomenon, but you are also correctly sensing that the standard explanation (the Knobe Effect) is insufficient for the *narrative* context you're working in.

  To answer your primary question: **Yes, this is two distinct mechanisms working in tandem.**

  1.  **The Asymmetry of Attribution** (Why harm reads as intent, but benefit reads as luck).
  2.  **The Resistance to Correction** (Why denying the harm makes it worse, but denying the benefit works).

  Here is the carving you asked for, separating the psychological baseline from the narrative-specific amplification, along with a coinage for the second part.

  ### 1. The Asymmetry: The Knobe Effect (Side-Effect Effect)
  You were right to be skeptical of the workshop participant's wave toward the Knobe Effect, but they weren't wrong about the root. Joshua Knobe's experiments (2003) showed exactly what you see in Scene A vs. Scene B: people are significantly more likely to say a side effect was brought about *intentionally* if it is harmful than if it is helpful, even when the agent's stated attitude (indifference) is identical.

  **How it differs from your situation:**
  Knobe's work is in experimental philosophy and cognitive science, usually dealing with survey responses to short vignettes. It measures *judgment*, not *interpretation over time*. It explains why readers initially think Ilse meant to silt the marsh. It does **not** explain why they refuse to believe the text when it explicitly says she didn't.

  **Load-bearing details here:**
  *   **Indifference:** This is the trigger. If Ilse expressed *regret*, the Knobe effect weakens. Indifference + Harm = Malice in the folk-psychological model. Indifference + Benefit = Humility.
  *   **Harm vs. Benefit:** This is the switch. The moral valence of the outcome dictates the attribution of mental state.

  ### 2. The Stickiness: The Exculpatory Paradox
  This is the part that has no standard name in literary theory or psychology, though it relies on **Belief Perseverance** (the tendency to maintain a belief despite contrary evidence) and **Narrative Teleology** (the reader's assumption that events in a story happen *for a reason*).

  In a novel, readers do not process text as a police report; they process it as a pattern. When a negative outcome occurs, readers instinctively search for the thematic or character-driven cause. If the text says "There is no cause (she is indifferent)," it creates a narrative vacuum. Readers fill that vacuum with the most available explanation: *She is lying to herself or us.*

  I propose we call this specific narrative phenomenon **The Exculpatory Paradox**.

  **Definition:**
  *In narrative reception, an explicit disavowal of negative intent is processed not as data about the character's mind, but as data about the character's self-awareness of guilt. The attempt to exculpate functions as a symptom of the very culpability it denies. Conversely, a disavowal of positive intent is processed at face value.*

  **Why it happens:**
  In Scene A (Harm), the damage creates a "debt" in the narrative economy. Readers feel someone must pay for the marsh. If Ilse refuses to pay (by feeling guilt), the readers force payment by assigning her villainy. Her denial looks like an attempt to evade the debt.
  In Scene B (Benefit), there is no debt. There is only a surplus. Readers are happy to let the surplus be accidental. Her denial is accepted because it costs the reader nothing to believe it.

  **The Non-Example (to test the carving):**
  *   **Instance:** A character accidentally kills a pedestrian, says "I didn't mean to," and the narrative implies they were distracted by a text message. Readers believe the lack of intent. (This is **not** the Exculpatory Paradox).
      *   *Why?* Because there is an *alternative cause* provided (distraction). The narrative vacuum is filled by "accident," not "malice."
  *   **Instance:** A character accidentally saves a pedestrian, says "I didn't mean to," and readers believe them. (This is **not** the Exculpatory Paradox).
      *   *Why?* Because the outcome is positive; the paradox only triggers on negative moral valence.
  *   **Instance (The Paradox):** A character accidentally kills a pedestrian, says "I didn't mean to," and the text offers no other cause (no distraction, no mechanical failure), only indifference. Readers conclude they *wanted* to do it.
      *   *Why?* The lack of alternative cause + negative outcome + indifference = The Paradox.

  **Load-bearing details here:**
  *   **No Alternative:** This is critical. If there were a mechanical reason the marsh *had* to silt (physics), the paradox weakens. Because the only variable is Ilse's choice, the choice absorbs all the moral weight.
  *   **First-Person Narration:** This heightens the paradox. In third-person, indifference can be omniscient fact. In first-person, indifference is *testimony*. Testimony can be lies. When the testimony conflicts with the moral gravity of the action, readers trust the action.

  ### The Decision for Your Scene
  You asked for the carving so you could make a decision. Here is the implication of this analysis:

  **You cannot write your way out of The Exculpatory Paradox with dialogue.**
  Every line Ilse adds to say "I didn't want this" is processed by the reader as "She is protesting too much." You are trying to solve a structural/narrative problem with a rhetorical solution.

  The Knobe Effect tells us readers *will* attribute intent to harm. The Exculpatory Paradox tells us they *will* reject denials of that intent if the harm stands unmitigated.

  **You have three options, based on the mechanics:**

  1.  **Accept the Villainy:** Lean into the readers' interpretation. If they think she wanted the marsh gone, make that the subtext. Let her be the utilitarian monster the readers see. This resolves the cognitive dissonance.
  2.  **Create a Cost (Break the Indifference):** The load-bearing detail is her *indifference*. If Ilse suffers for the marsh—if she loses sleep, if she pays the downstream village personally, if she is physically injured in the diversion—the readers no longer need to assign her "intent" to punish her. She is already punishing herself. The debt is paid. The Exculpatory Paradox dissolves because the narrative vacuum is filled by her suffering.
  3.  **Introduce an External Cause (Break the Choice):** Give the river a voice. Show that *not* diverting would have killed the town *and* the marsh anyway due to geological factors. If the marsh was doomed regardless, the "harm" is not her side effect, it's the environment's. This removes the Knobe trigger.

  **Summary:**
  You are fighting **The Knobe Effect** (harm implies intent) compounded by **The Exculpatory Paradox** (denial of harm implies guilt). The second is the sticky one. It is not a flaw in your writing; it is a feature of how humans read moral causality in stories. We demand that pain have a purpose. If the character won't give it one (via guilt), we will (via malice).
