      *   **Problem:** They observe a phenomenon where standards/preferences shift over time (in their own work, in their genre, in readership) such that later stages prefer the later state, earlier stages would reject the later state, yet no one feels "trapped" or "worse off" *at the time*. There's a sense of "loss" only visible from a meta-perspective, but the participants don't feel it.
      *   **Specific Questions:**
