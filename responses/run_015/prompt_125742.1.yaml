          *   *Philosophical term:* **Diachronic Inconsistency** (without the regret).
          *   *Creative term:* **Organic Drift**?
          *   *Actually:* There isn't a single canonical term. "Endogenous Preference Change" is the technical economic term. "Creative Drift" is the colloquial one.
