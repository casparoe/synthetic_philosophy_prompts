      *   *Contrast:* Moloch/Prisoner's Dilemma (agents *know* they are worse off but can't stop). Race to the Bottom (explicit degradation).
      *   *User's specific twist:* The "loss" is only visible to an external observer or the "ghost" of the past self, not the current agent.

  3.  **Brainstorming Concepts/Terms:**
