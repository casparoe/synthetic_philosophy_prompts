  hi — i'm trying to get my head round a passage from that long letter galileo wrote to a medici patron (christina, i think?) defending copernicanism against scriptural objections. he frames nature and the bible as two seperate books written by the same divine author, but nature is composed in maths whilst scripture uses ordinary language meant for common people. he argues that the holy spirit didn't intend to teach us how the heavens go, only how to go to heaven, so when a physical claim is conclusively demonstrated we should reinterpret the biblical wording rather than deny the science.

  i'm trying to apply a concept i've been messing about with — an interpretive elasticity budjet — which asks how far a text can be stretched before it stops being that text at all. does galileo actually think there's a principled limit to bending the scriptural reading, or does he effectively give natural philosophy an unlimited veto? specifically, does the passage offer any criterion for when we've pulled the interpretation too far, or is that gap just left hanging? and is there a hidden tension with his claim that both books share one author — wouldn't that imply scripture ought to be just as unambiguous as nature if we read it correctly?

  sorry if that's muddled and there's definately a typo or two in there. any help unpacking what the passage is really doing would be brilliant.
