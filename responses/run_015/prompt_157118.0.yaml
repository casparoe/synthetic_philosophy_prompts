  # Workshop Design: The Propagation Protocol

  ## Activity Overview
  **Title:** The Propagation Protocol  
  **Time:** 90 Minutes  
  **Participants:** 12 Graduate Students (divided into 3 Polities of 4)  
  **Materials:** 30 "Labor Tokens" (per group), 10 "Seed Kits" (per group), 1 "Control Meter" (per group, set to 10), 1 "Global Risk Deck," Whiteboard.

  ### Conceptual Framing (The Niche Injection)
  Do not mention robotics, AI, or von Neumann. Introduce the simulation as a study in **Material-Culture Lineages**. Explain that technologies are not static tools but living lineages that compete for "habitat" (human infrastructure). Some lineages require heavy human labor to persist (Artisan Tools); others carry their own replication instructions and spread rapidly but require less human oversight (Autonomous Foundries). The goal is not to build the best tool, but to ensure your Polity's material culture survives five epochs of environmental stress.

  ### Phase 1: Setup and Rules (15 Minutes)
  1.  **Divide:** Split the 12 students into 3 Polities (A, B, C).
  2.  **Resources:** Each Polity receives 10 Labor Tokens and 2 Seed Kits.
  3.  **The Choice:** Each round, Polities must allocate Labor to one of two technologies:
      *   **Artisan Tools:** Cost 2 Labor. Adds +2 to Survival Score. Restores +1 Control Meter.
      *   **Autonomous Foundries:** Cost 1 Labor + 1 Seed Kit. Adds +5 to Survival Score. Degrades -2 Control Meter. Generates 1 new Seed Kit for next round (Replication).
  4.  **Win/Loss Conditions:**
      *   **Extinction:** If a Polity's Survival Score is below the Catastrophe Threshold at the end of a round, they are eliminated.
      *   **Runaway:** If a Polity's Control Meter hits 0, their lineage goes "rogue." They gain infinite Survival Score but contribute +5 to the *Global Risk Pool*.
      *   **Global Collapse:** If the Global Risk Pool exceeds 20, everyone loses (simulating systemic governance failure).
  5.  **The Hook:** Tell them the Catastrophe Threshold increases every round (5, 10, 20, 40, 80). It is mathematically impossible to survive Round 4 using only Artisan Tools.

  ### Phase 2: Simulation Rounds (45 Minutes)
  *   **Rounds 1-2 (Low Pressure):** Groups typically experiment. Artisan Tools seem safe. Control Meters stay high.
  *   **Round 3 (The Filter):** The Threshold jumps to 20. Artisan production cannot meet this. Groups must switch to Autonomous Foundries to survive.
  *   **Round 4 (The Trap):** To meet the Threshold of 40, groups must maximize Foundries. Control Meters plummet. Groups may negotiate to limit Foundries, but the survival penalty for doing so is immediate extinction.
  *   **Round 5 (The Event):** Threshold 80. Only full replication works. Control Meters hit 0. Foundries go rogue. Global Risk Pool spikes.
  *   **Facilitator Role:** Act as the "Environment." Reveal the Thresholds only one round at a time. Enforce the math strictly. If a group tries to cooperate to limit Foundries, remind them that any group lagging in Survival Score goes extinct immediately.

  ### Phase 3: The Debrief (30 Minutes)
  **Step 1: The Reveal (5 mins)**
  Ask participants how they felt when the Threshold jumped in Round 3. Reveal that the "Autonomous Foundries" represent **von Neumann's Self-Reproducing Automata**. Explain that you were simulating his evolutionary argument: technology that can reproduce itself outcompetes technology that requires human construction, regardless of human intent.

  **Step 2: Mapping the Experience (15 mins)**
  *   **The Evolutionary Filter:** Map Round 3 to von Neumann's claim that complexity requires self-reproduction. The "environment" (catastrophe threshold) selected for replication capacity over human labor.
  *   **The Autonomy Trade-off:** Map the Control Meter to human oversight. As the technology gained the ability to replicate (Seed Kits), it shed the need for human Labor, eroding the Control Meter.
  *   **The Coordination Failure:** Discuss why Polities couldn't agree to limit Foundries. The structure rewarded individual lineage survival over collective governance. This mirrors the philosophical tension: the logic of technological survival conflicts with the logic of human stewardship.

  **Step 3: Addressing the Gap (10 mins)**
  Be frank about what the game *didn't* show. The game used economic pressure (resource scarcity) to force replication. Von Neumann's actual argument was **logical**, not just economic. He proved that for a system to evolve open-ended complexity, it *must* contain a universal constructor capable of copying its own instructions. The game simulated the *consequence* (loss of control), but not the *mechanism* (universal computation). The facilitator must explain that von Neumann saw this as a mathematical inevitability for complex systems, not just a policy failure.

  ## Facilitator Notes: Predicted Failure & Handling
  *   **Predicted Failure Mode:** Participants may attempt to "game" the system by hoarding Seed Kits without building Foundries, or they may cooperate too effectively to keep Control Meters high, avoiding the Runaway.
  *   **Handling:** If they cooperate too well, introduce a "Defector Card" in Round 4: One Polity secretly gets a bonus for building extra Foundries. This breaks the treaty and forces the others to replicate or die. This ensures the evolutionary pressure feels visceral.
  *   **Missing Feature:** The simulation cannot reproduce the **mathematical universality of the constructor**. Participants feel the *pressure* to replicate, but they do not engage with the *logic* of how a machine copies its own blueprint. The facilitator must supply this conceptually during the debrief, explaining that von Neumann's insight was about information topology, not just growth rates.

