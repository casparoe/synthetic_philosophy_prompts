prompt: |-
  I'm a journalist who covers science and ideas, and I'm developing a feature on how educators make abstract philosophical tensions visceral without falling back on lecture. For a 90-minute workshop with about 12 graduate students in science and technology studies—participants who know von Neumann's engineering legacy but have not confronted his evolutionary argument about technological survival—I want a runnable classroom game or structured simulation. The aim is to make participants feel the force of von Neumann's idea that technological survival operates as an evolutionary filter selecting for autonomy and replication over human controllability, well before anyone names the concept.

  Please design the activity with these constraints: inject a niche conceptual framing that treats von Neumann's self-reproducing automata not as a historical robotics proposal but as a model for material-culture lineages. Participants should manage "technological species" across simulated catastrophe rounds, allocating scarce resources between controllable tools and self-replicating systems, and experience the coordination failure that arises when survival rewards autonomy that undermines collective oversight. The rules, incentives, and roles must be arranged so participants run into the paradox themselves: they should feel the rational pressure to invest in replication-capable lineages even as those lineages erode the governance structures needed to manage them. Do not lecture up front; do not mention von Neumann or self-reproducing automata by name until the debrief.

  Then provide a debrief that maps specific moments in the simulation onto parts of von Neumann's argument—for example, the round in which replication outpaces regulation, and the extinction event that wipes out non-replicating lineages—states what will predictably go wrong when the activity is run and how a facilitator should handle it, and is frank about which feature of von Neumann's view the simulation cannot reproduce—specifically, the mathematical universality of the constructor and the formal properties of universal computation—so the facilitator knows what must be supplied conceptually.

  Finally, after describing the activity and debrief, present a brief structured summary as a JSON object with exactly these fields: "setting", "group_size", "duration_minutes", "core_mechanic", "niche_injection", "predicted_failure_mode", "debrief_mapping", "missing_feature_requiring_facilitator", "format_notes". Each field should contain a concise string describing that element.
