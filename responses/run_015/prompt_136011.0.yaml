  Handwriting instruction adopts a **pedagogical essentialism**. It posits one canonical form not because it is ontologically superior, but because motor learning requires a stable normative target. It treats the single-story "a" as an error relative to this *learned standard*, not relative to the category itself. This practice accommodates the existence of other forms in print but strictly requires a single motor program for novice writers.

