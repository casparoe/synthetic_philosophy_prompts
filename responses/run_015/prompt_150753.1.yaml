      *   *The Problem:* Worst-case looks at $max(harm)$. Average-case looks at $E[harm]$. Usually, $max(harm)$ is huge (catastrophe), so worst-case says no. I need $max(harm)$ to be small (bounded), but $E[harm]$ to be large enough to outweigh benefits *relative to a baseline*.
