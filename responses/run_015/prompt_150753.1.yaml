          *   *Baseline:* Human reviewers doing the same task.
          *   *Math:* If the bot is fast but destroys 10% of utility per doc, and humans destroy 1% but are slow.
          *   *Issue:* Is "loss of utility" a "harm" the worst-case certificate accepts? Yes, if the guarantee is just "no irreversible damage."
          *   *Refinement:* Let's make it about *legal liability* or *contractual breach* via over-redaction.
      *   *Scenario Idea 4: Automated Negotiation/Procurement.*
