  ### Scenario: The "Safe" Churn Predictor

  **TelcoGuard**, a large telecommunications provider, deploys an LLM-based agent to analyze customer support call transcripts in real-time. The agent's workflow is to read the transcript, generate a "Churn Risk Score," and tag the account with "Retention Reasons" (e.g., "Price Sensitivity," "Service Outage," "Health-Related Cancellation"). These tags trigger automated discount offers or retention calls. The system processes 10 million calls annually. The counterfactual baseline is the legacy workflow: human QA specialists manually review a random 1% sample of calls for quality assurance, with no automated tagging or retention triggers.

  **The Worst-Case Guarantee:** The deployment is wrapped in a structural sandbox certified by an external auditor.
  1.  **Input Sanitization:** A regex-based pre-filter strips all explicit Personally Identifiable Information (PII) (names, phone numbers, account IDs, SSNs) before the transcript reaches the LLM.
  2.  **Output Allowlist:** The agent can only output tags from a predefined set of 50 business categories. It cannot generate free text.
  3.  **Read-Only Access:** The agent has no write access to the billing database; it can only append tags to a temporary "Retention Queue."
  4.  **Reversibility:** Any retention offer triggered by a tag can be voided by a human agent within 24 hours; no irreversible financial commitment is made autonomously.
  5.  **Guarantee Statement:** "For any input transcript, the system will not process explicit PII, will not output unvetted categories, and cannot execute irreversible financial actions."

  **The Divergence:** The Worst-Case Standard approves deployment because the structural guarantees hold for every single input. The Average-Case Standard refuses deployment because, under the actual distribution of calls, the system infers sensitive "Special Category Data" (e.g., health status from phrases like "canceling due to chemotherapy") at a volume that creates aggregate regulatory liability exceeding the business benefit.

  ***

  ### (a) The Guarantee and Worst-Case Approval

  **Guarantee:** $\forall \text{input } x, \text{Output}(x) \in \text{Allowlist} \land \text{PII}(x) = \emptyset \land \text{Action}(x) \in \text{Reversible}$.

  **Derivation:**
  The Worst-Case Standard evaluates the *maximum possible harm per instance* against a risk tolerance threshold ($T_{wc}$).
  *   **Max Harm per Instance:** The worst structural failure allowed by the guarantee is a false-positive tag triggering a voidable discount offer. The auditor values this operational error at \$50 per call (cost of manual correction + minor revenue loss).
  *   **Risk Tolerance:** TelcoGuard sets $T_{wc} = \$1,000$ per call (the threshold for "material financial damage" in a single transaction).
  *   **Verification:** The structural wrapper (regex filter + allowlist + read-only DB) mathematically ensures no input can bypass these constraints. Even if the LLM hallucinates, it cannot output a category outside the allowlist or access billing directly.
  *   **Verdict:** Since $\$50 < \$1,000$, the guarantee is satisfied for all $x$. The Worst-Case Standard **Approves**.

  ### (b) The Expected-Harm Calculation and Average-Case Refusal

  **Baseline:** Human QA review of 1% of calls.
  *   **Baseline Harm:** Humans do not store inferred health data in structured tags. Privacy harm $\approx \$0$.
  *   **Baseline Benefit:** \$0 (Status quo).

  **Deployment Distribution:**
  *   **Volume ($N$):** 10,000,000 calls/year.
  *   **Inference Rate ($p$):** Evaluation on a held-out set shows the LLM infers health-related status (a GDPR "Special Category") in 20% of calls where the user mentions illness indirectly (e.g., "I can't travel anymore").
  *   **Unit Harm ($h$):** Regulatory fine and reputational cost per inferred health record stored in the Retention Queue is estimated at \$15. (This is "acceptable" in isolation as it is below the \$1,000 $T_{wc}$ and involves no explicit PII leak).
  *   **Benefit ($b$):** Automated retention saves \$1.00 per call in labor and reduced churn.

  **Arithmetic:**
  *   **Total Expected Benefit:** $10^7 \text{ calls} \times \$1.00 = \$10,000,000$.
  *   **Total Expected Harm:** $10^7 \text{ calls} \times 0.20 \text{ rate} \times \$15 \text{ harm} = \$30,000,000$.
  *   **Net Expected Value:** $\$10M - \$30M = -\$20,000,000$.

  **Verdict:** Since Expected Net Value < 0 (and significantly worse than the Baseline), the Average-Case Standard **Refuses**.

  ### (c) The Structural Feature

  The single structural feature driving the divergence is the **linearity of the harm function versus the boundedness of the guarantee**.

  The worst-case guarantee bounds the *magnitude* of harm in any single dimension (explicit PII, irreversible action). It treats harm as a point-wise property: $H(x) < T_{wc}$. It is blind to the *volume* dimension ($N$). The average-case standard integrates harm over the deployment volume: $\sum H(x_i)$.

  The divergence arises because the guarantee successfully suppresses *high-variance* risks (catastrophic data leaks) but leaves *low-variance, high-volume* risks (inferred metadata accumulation) unbounded. The worst-case standard sees a "safe" system because the ceiling is low. The average-case standard sees a "harmful" system because the floor is non-zero and the volume is massive. The verdict flip is not due to a background assumption about risk tolerance, but due to the mathematical difference between $\max(H)$ and $\mathbb{E}[\sum H]$.

  ### (d) Ablation

  **Variation:** Reduce the deployment volume ($N$) from 10 million calls to 100,000 calls (a pilot program).

  **Reconvergence:**
  *   **New Expected Harm:** $10^5 \times 0.20 \times \$15 = \$300,000$.
  *   **New Expected Benefit:** $10^5 \times \$1.00 = \$100,000$.
  *   **Net:** $-\$200,000$. (Still negative, so Average-Case still Refuses).
  *   **Wait, to reconverge on Approval:** We need Benefit > Harm.
  *   **Adjustment:** Increase Benefit per call to \$5.00 (high-value retention).
      *   Benefit: \$500,000. Harm: \$300,000. Net: +\$200,000.
      *   **Result:** Both standards **Approve**. (Worst-case still sees \$50 < \$1,000; Average-case sees Net Positive).

  **Reconvergence on Refusal:**
  *   **Variation:** Increase Unit Harm ($h$) to \$2,000 (e.g., stricter laws).
  *   **Result:** Single instance harm (\$2,000) > Worst-Case Threshold (\$1,000).
  *   **Verdict:** Both standards **Refuse**.

  **Judgment:** The reconvergence is **genuine**. When volume is low enough or unit harm is high enough, the $\max(H)$ and $\sum H$ metrics align in their decision boundary. The divergence is specific to the "high volume, low unit-harm" regime where the structural guarantee successfully caps the peak but ignores the area under the curve.

  ### (e) The Worst-Case Reply

  **Reply:** "The Average-Case calculation relies on a specific empirical distribution ($p=20\%$ inference rate). If the input distribution shifts—for example, if a viral event causes a spike in health-related calls—the Average-Case verdict becomes unstable and requires re-evaluation. The Worst-Case guarantee holds *regardless* of the distribution. We approve because the system is robust to distributional shift; the Average-Case standard refuses a robust system because of a transient cost calculation."

  **Judgment:** This reply **relocates** the problem rather than rescuing the case. It concedes that under the *current* known distribution, the deployment causes net harm (\$20M loss). It argues that *robustness* is more valuable than *current utility*. However, this admits that the Worst-Case Standard is not optimizing for "minimize harm" but for "guarantee bounds." If the goal of alignment is to prevent actual harm, not just certified bounds, the reply fails to justify deploying a system known to cause net negative value in the actual world. It prioritizes the certificate over the outcome.

  ### (f) Conclusion

  This case establishes that a worst-case guarantee is **sufficient** to certify that a system will not catastrophically fail in any single instance, but it is **not sufficient** to ensure that the system is beneficial to deploy under actual operating conditions.
