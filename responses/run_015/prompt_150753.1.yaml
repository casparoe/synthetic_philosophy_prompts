          *   *Average-Case:* It agrees to slightly worse terms every time.
          *   *Baseline:* Status quo (human negotiation).
          *   *Math:* 10,000 transactions. Worst-case loss per transaction = \$1,000 (cap). Actual average loss = \$50 worse than human. Benefit = speed (\$10 per transaction). Net loss = \$40 * 10,000.
          *   *Worst-Case View:* Max loss is bounded at \$1,000. This is within risk tolerance for a single deal. Therefore, approved.
          *   *Average-Case View:* Total expected loss > Total expected benefit. Therefore, refused.
          *   *Critique:* This feels a bit like "it's just not profitable." Is that a *safety* refusal? The prompt asks for "expected harm." Financial loss counts as harm in a corporate context.
      *   *Scenario Idea 5 (The Winner):* **Automated Accessibility Remediation.**
          *   *Context:* A large publisher uses an LLM agent to auto-fix alt-text and ARIA labels on web content before publishing.
          *   *Worst-Case Guarantee:* The agent operates in a "suggestion-only" mode (no direct write to prod), or if it does write, it's versioned and instantly revertible. It has no access to user data. Max harm per page = broken layout (revertible) or misleading alt-text (correctable).
