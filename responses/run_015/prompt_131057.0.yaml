answer: |-
  # Specification: Desiderata for an Account of Epistemic Dependence on Generative AI

  **Subject:** Philosophical account of sustained reliance on GenAI.
  **Focus:** Erosion of *understanding* (explanatory coherence) vs. mere *knowledge* (true belief).
  **Objective:** Define necessary conditions (desiderata) for adequacy.

  ---

  ## I. Core Desiderata

  ### D1: The Mode of Engagement Criterion
  **Requirement:** The account must distinguish between *referential reliance* (using AI as a lookup table) and *constitutive reliance* (using AI as a default reasoning partner).
  **Motivating Case:** A user checking a fact (external reference) retains the cognitive schema to verify the claim. A user asking AI to "solve this problem" treats the output as the terminus of thought rather than a premise for further reflection. An adequate account must explain why the latter threatens the stability of the agent's cognitive architecture while the former may not.
  **Status:** **Non-Negotiable.** (Phenomenologically necessary to distinguish distinct usage patterns observed in empirical HAI studies).

  ### D2: The Counterfactual Competence Criterion
  **Requirement:** The account must differentiate between retaining a *true belief* and retaining the *capacity to generate counterfactual explanations* for that belief.
  **Motivating Case:** A student uses AI to derive a physics solution. They possess the true belief (the answer) but lose the capacity to explain how the answer changes if initial conditions vary (the understanding). An account of epistemic erosion must identify the loss of counterfactual sensitivity as the primary deficit, not the potential falsity of the belief.
  **Status:** **Non-Negotiable.** (Consistent with established philosophical consensus on the nature of understanding vs. propositional knowledge).

  ### D3: The Structural Integration Criterion
  **Requirement:** The account must distinguish between *instrumental delegation* (offloading a sub-task) and *structural cognitive outsourcing* (offloading the inferential glue that binds beliefs).
  **Motivating Case:** Using spellcheck is instrumental; using AI to structure an argument is structural. In structural outsourcing, the AI determines the doxastic connections between premises and conclusions. The account must explain how structural outsourcing alters the topology of the user's belief network, potentially creating isolated nodes of belief without inferential links to the agent's wider web.
  **Status:** **Camp-Specific.** (Depends on whether one adopts a coherentist or foundationalist view of justification; coherentists will view structural outsourcing as more damaging).

  ### D4: The Inferential Accessibility Criterion
  **Requirement:** The account must address the asymmetry between *understanding an output* (semantic comprehension) and *reconstructing the inferential path* (syntactic/causal derivation).
  **Motivating Case:** A user reads an AI-generated proof and nods in agreement (semantic comprehension) but cannot reproduce the steps or identify where a hallucination might have occurred (inferential reconstruction). The account must specify whether understanding requires the ability to mentally simulate the generative process or merely validate the result.
  **Status:** **Jointly Unsatisfiable Tension.** (See Section III).

  ### D5: The Responsibility Attribution Criterion
  **Requirement:** The account must define boundary conditions for assigning *epistemic responsibility* when an opaque statistical process mediates testimony.
  **Motivating Case:** If an AI provides false testimony that the user accepts, is the user negligent for trusting an opaque system, or is the system a non-agential tool for which the user bears strict liability? The account must reconcile the user's doxastic agency with the system's statistical opacity.
  **Status:** **Non-Negotiable.** (Required for consistency with social epistemology regarding testimony and norms of assertion).

  ---

  ## II. Classification of Desiderata

  ### Non-Negotiable Constraints
  *These requirements must be met for the theory to be considered viable within contemporary epistemology and cognitive science.*
  1.  **Consistency with Social Epistemology (D5):** The account cannot ignore established norms of testimony. It must explain how AI fits into (or breaks) the speaker-healer trust dynamic.
  2.  **Empirical Fragility of Skills (D1 & D2):** The account must align with cognitive science findings that skills degrade when not actively exercised (the "use it or lose it" heuristic regarding counterfactual reasoning).
  3.  **Distinction between Knowledge and Understanding (D2):** The account cannot conflate having a true belief with understanding the underlying mechanism.

  ### Camp-Specific Preferences
  *These requirements reflect specific philosophical commitments and may be waived depending on the theoretical framework adopted.*
  1.  **Preservation of Pre-Digital Capacities (D4):** Demanding that users must be able to reconstruct the AI's inferential path assumes a "cognitive sovereignty" view. A pragmatist camp might argue that validation is sufficient, rendering reconstruction unnecessary.
  2.  **Opacity as Vitiation (D4):** Insisting that *any* delegation to an opaque system necessarily destroys understanding is a strict internalist preference. Externalists might argue that reliable coupling is sufficient for extended understanding, regardless of opacity.
  3.  **Location of Cognitive Boundaries (D3):** Whether structural outsourcing is seen as a dangerous fragmentation or a beneficial expansion of cognitive reach depends on whether one views the skin/skull as the boundary of cognition.

  ---

  ## III. Joint Unsatisfiability and Tensions

  **The Efficiency-Understanding Trade-off (D2 vs. D4)**
  There is a fundamental tension between **D2 (Counterfactual Competence)** and the efficiency gains of **D4 (Inferential Accessibility)** in the context of modern GenAI.
  *   **The Conflict:** To gain maximum efficiency from GenAI, the user must delegate complex inference to a system whose internal structure they *cannot* represent (violating D4). However, if they cannot represent the structure, they cannot mentally simulate counterfactuals independently (violating D2).
  *   **Implication:** An account cannot simultaneously demand robust individual understanding (defined as the capacity for independent counterfactual generation) and endorse full delegation to opaque systems for complex tasks. One must be sacrificed: either efficiency is capped at the level of human verifiability, or "understanding" must be redefined as "system-verified reliability" rather than "individual reconstructability."

  **The Agency-Opacity Tension (D5 vs. D1)**
  *   **The Conflict:** If we treat AI as a **Reasoning Partner (D1)**, we imply a level of agency that suggests shared responsibility. However, because the system is statistically opaque, the user cannot truly audit the reasoning, making **Responsibility Attribution (D5)** impossible under standard negligence models.
  *   **Implication:** An account must either strip the AI of "partner" status (reducing it to a tool, which misdescribes the phenomenology of reliance) or expand the definition of responsibility to cover "systemic risk management" rather than "content verification."

  ---

  ## IV. Framework Evaluation

  ### 1. Extended-Mind Approach (Clark/Chalmers variant)
  *   **Core Claim:** The AI is a literal part of the cognitive system; the boundary of the mind extends to the device.
  *   **Performance:**
      *   *Satisfies D1 & D3:* Excellently captures the shift from tool to partner and structural integration.
      *   *Fails D5 (Non-Negotiable):* Struggles to assign epistemic responsibility. If the AI is part of the mind, "trusting" it is like trusting one's own memory. It becomes difficult to categorize AI error as "false testimony" rather than "cognitive malfunction," complicating norms of blame.
      *   *Fails D4 (Tension):* Often glosses over opacity. If the "vehicle" of cognition is opaque to the subject, the "glue and trust" conditions are threatened.
  *   **Verdict:** Resolves the efficiency tension by redefining understanding as system-wide capacity, but fails the responsibility constraint.

  ### 2. Corruption-of-Testimony Model (Traditional Social Epistemology)
  *   **Core Claim:** AI acts as a testifier (or a proxy for human testifiers); reliance is governed by norms of trust and assertion.
  *   **Performance:**
      *   *Satisfies D5 (Non-Negotiable):* Robust framework for assigning responsibility (hearer vs. speaker duties).
      *   *Fails D1 & D3 (Non-Negotiable/Camp):* Mischaracterizes the phenomenology. GenAI is not a "speaker" with beliefs; it is a statistical engine. Treating it as a testifier ignores the *structural outsourcing* aspect where the AI generates the logic, not just the claim.
      *   *Fails D2:* Focuses on the truth of the assertion rather than the user's loss of counterfactual capacity.
  *   **Verdict:** Meets responsibility criteria but fails to capture the specific cognitive erosion mechanism (structural outsourcing).

  ### 3. Hybrid-Cognitive-Division View (Sociotechnical Systems)
  *   **Core Claim:** Human and AI form a coupled system where epistemic labor is distributed; understanding is a property of the loop, not just the individual.
  *   **Performance:**
      *   *Satisfies D1 & D3:* Accurately models the shift to reasoning partnership and structural integration.
      *   *Satisfies D5 (Modified):* Assigns responsibility to the *design and deployment* of the loop, not just the end-user.
      *   *Fails D2 (Non-Negotiable):* Risks dissolving individual understanding entirely. If understanding is a property of the *system*, the *human* component may still suffer epistemic erosion (loss of counterfactual capacity) even if the *system* performs well.
  *   **Verdict:** Best resolves the Efficiency-Understanding tension by relocating understanding to the system, but risks violating the requirement to account for *individual* cognitive atrophy.

  ### Summary Recommendation
  To satisfy all **Non-Negotiable** desiderata, a viable framework must likely adopt a **Hybrid-Cognitive-Division** base but integrate a **Corruption-of-Testimony** safeguard for responsibility. It must explicitly acknowledge the **Efficiency-Understanding Trade-off** (D2 vs. D4) as a feature, not a bug: sustained reliance on opaque systems *necessarily* erodes individual counterfactual competence, and the philosophical account must prescribe *when* this erosion is epistemically permissible (e.g., low-stakes environments) versus when it constitutes negligence (e.g., high-stakes reasoning).
