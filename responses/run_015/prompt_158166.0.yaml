answer: |-
  **Overall Credence: 0.45**

  I assign a 45% probability to the proposition that Western anti-corruption norms regarding gifts to officials represent genuinely universal moral requirements rather than culturally specific conventions. I land slightly below the midpoint, closer to your skepticism than your colleague's confidence, because while the *mechanisms* of corruption (bias, exclusion) appear universal, the *moral valuation* of those mechanisms depends heavily on institutional context and state capacity.

  Here is the decomposition of that judgment:

  ### (a) Fiduciary Duty vs. Fused Roles
  **Probability of Universalist Resolution: 0.65**
  *The Question:* Does corruption require a Weberian separation of public/private, or is it the abuse of *any* entrusted power?
  *Reasoning:* The universalist claim holds that "corruption" is fundamentally the distortion of allocated resources away from a collective good toward a particularistic interest, regardless of whether the system recognizes a "public" sphere. Even in fused-role systems (e.g., patrimonial or kinship-based governance), a leader holds power in trust for the group. If a gift causes the leader to allocate a scarce resource (water, land, adjudication) to a donor rather than a needier constituent, a harm occurs that is recognizable across cultures. However, the credence is not higher because in fused systems, the "collective good" is often defined *through* the distribution of patronage. Disrupting that flow can sometimes cause greater social fragmentation than the bias itself.
  *Verdict:* Leaning universalist, but acknowledging that the definition of the "public" is culturally constructed.

  ### (b) Anticipatory Reciprocity vs. Retrospective Gratitude
  **Probability of Universalist Resolution: 0.75**
  *The Question:* Does the temporal structure of the gift matter morally, independent of culture?
  *Reasoning:* This is the strongest pillar for universalism. Anticipatory reciprocity (gift-before-service) creates a *contingent* obligation that biases decision-making *ex ante*. Retrospective gratitude (gift-after-service) rewards a decision already made. Anticipatory gifts functionally auction off access to public goods, excluding those without liquidity. This creates an inequity in access that is morally objectionable regardless of whether the society distinguishes between public and private roles. The exclusionary effect is a tangible harm that transcends cultural convention.
  *Verdict:* Strongly universalist. The mechanism of exclusion is structurally similar to bribery in any context.

  ### (c) Western Hypocrisy (Lobbying and Patronage)
  **Probability of Universalist Resolution: 0.30**
  *The Question:* Does the existence of legalized influence-peddling in the West undermine the claim that the norm is universal?
  *Reasoning:* This significantly drags down the overall credence. If the universal norm is "officials must not be influenced by private wealth," Western systems violate this routinely via campaign finance, lobbying, and revolving doors. The distinction often rests on *transparency* and *legality* rather than the *influence itself*. If the moral wrong is the capture of public decision-making by private wealth, the Western objection to informal gift-giving looks less like a moral universal and more like a preference for formalized, opaque elite capture over informal, visible subsistence networks. This suggests the norm is a specific institutional technology, not a moral truth.
  *Verdict:* Strongly particularist. The hypocrisy undermines the moral authority of the norm-setter.

  ### (d) State Capacity and Enforcement
  **Probability of Universalist Resolution: 0.35**
  *The Question:* Can a norm be universal if its enforcement depends on state capacities (salaries, monitoring) that many societies lack?
  *Reasoning:* This invokes the "ought implies can" principle. If an official's salary is below subsistence level, a "gift" may function as a necessary top-up to allow the official to remain in post. Prohibiting such gifts without providing a living wage forces the official to choose between moral compliance and survival, or drives the practice further underground. A moral norm that requires a specific fiscal capacity to be viable is, by definition, contingent on that capacity. Universal moral claims (e.g., "do not murder") do not typically require budgetary allocations to be valid.
  *Verdict:* Strongly particularist. Contextual necessity mitigates moral culpability.

  ### Aggregation and Sensitivity

  **How they combine:**
  My overall credence (0.45) is a weighted function of these sub-questions. Questions (a) and (b) address the *nature of the act*, while (c) and (d) address the *context of judgment*. I weight the context heavily because morality is practical. Even if the act is inherently problematic (a/b), if the norm is applied hypocritically (c) or impossibilistically (d), it fails as a *universal requirement* and functions instead as a *privileged convention*.

  **Sensitivity Analysis:**
  My final number is most sensitive to **(d) State Capacity and Enforcement**.
  If empirical evidence showed that the gifts in question were primarily for *accumulation* rather than *subsistence* (i.e., the officials are well-paid but take gifts anyway), my credence in the universalist claim would jump significantly (likely to 0.65+). The moral distinction between "survival corruption" and "greed corruption" is the pivot point. If the gift is survival, the universal norm is cruel; if it is greed, the universal norm is protective.

  **Conceptual Clarification / Empirical Comparison for Shift:**
  To shift my view toward universalism (higher than 0.60), I would need a comparative outcome study showing that **prohibiting anticipatory gifts in fused-role systems leads to better development outcomes (equity, trust, service delivery) even without concurrent increases in state capacity or salary.**

  Conversely, to shift my view toward particularism (lower than 0.30), I would need evidence that **formalizing the gift-giving (e.g., taxing it or making it transparent) results in worse outcomes than the current informal system,** suggesting the "corruption" label actively destroys a functional social safety net that the state cannot replace.

  **Summary:**
  I suspect the truth lies in distinguishing the *mechanism* from the *label*. The mechanism (anticipatory exchange biasing allocation) is likely universally corrosive to equity (0.75). However, the *norm* as imported by Western agencies often ignores the capacity and hypocrisy constraints (0.30/0.35), rendering the *package* of anti-corruption advice morally contingent rather than universal (0.45).
