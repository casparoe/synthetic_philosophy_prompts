  ### Coherence Audit: Predictive Screening for Municipal Apprenticeships

  **Executive Summary**
  Your view is **internally incoherent**. While individually plausible, the five claims you have committed to contain a fundamental mathematical contradiction known in fairness literature as the "Impossibility Theorem." Specifically, you cannot simultaneously maintain **Calibration (Claim 1)**, **Error Rate Parity (Claim 2)**, and **Different Base Rates (Claim 3)** using a **Fallible Tool (Claim 4)**.

  Because Claim 3 (the reality of the data) and Claim 4 (the fallibility of the tool) are fixed by the setting and the nature of prediction, you are forced to choose between Claim 1 (the validity of the score) and Claim 2 (the equity of the errors). The audit below details this conflict, ranks it against secondary tensions, and recommends the adjustment that restores coherence at the lowest overall cost.

  ---

  ### 1. Identification of Conflicts

  #### The Fundamental Conflict: The Fairness Impossibility Theorem
  **Conflicting Elements:** Claim 1 (Calibration) vs. Claim 2 (Error Rate Parity) given Claim 3 (Base Rates) & Claim 4 (Fallibility).

  *   **The Logic:** Mathematical proof (Chouldechova 2017; Kleinberg et al. 2016) demonstrates that when two groups have different base rates of qualification (Claim 3: 50% North vs. 33% South), a predictive model cannot be both **Calibrated** (Claim 1) and satisfy **Error Rate Parity** (Claim 2) unless the model is perfect (Claim 4 denies this).
  *   **Why it is Genuine:** This is not a matter of tuning or better data; it is a property of conditional probability. If the tool is calibrated, a score of 0.8 means an 80% chance of qualification for both groups. Because the South has a lower base rate, the distribution of scores for the South must differ from the North. Consequently, applying a **Common Cutoff (Claim 4)** to these different distributions will inevitably result in different True Positive and False Positive rates.
  *   **Result:** You must abandon either the interpretability of the score (Claim 1) or the equality of error burdens (Claim 2).

  #### The Secondary Conflict: Procedural Uniformity vs. Error Parity
  **Conflicting Elements:** Claim 4 (Common Cutoff) vs. Claim 2 (Error Rate Parity).

  *   **The Logic:** Even if you were willing to sacrifice Calibration (Claim 1), achieving Error Rate Parity (Claim 2) with different Base Rates (Claim 3) typically requires applying **different decision thresholds** to each group.
  *   **Why it is Apparent/Resolvable:** This conflict is derivative of the fundamental one. If you drop Claim 1 (Calibration), you *might* be able to satisfy Claim 2 with a common cutoff, but only under very specific, unlikely conditions regarding the shape of the score distributions. Generally, Claim 4 acts as a lock that prevents you from using the standard policy lever (adjusting thresholds) to fix the error rate disparity.
  *   **Result:** Claim 4 restricts your ability to resolve the tension between 2 and 3.

  #### The Tertiary Conflict: Blindness vs. Correction
  **Conflicting Elements:** Claim 5 (Blindness) vs. Claim 2 (Error Rate Parity).

  *   **The Logic:** Claim 5 forbids using district membership in scoring. While you can apply different cutoffs post-hoc without violating Claim 5, blindness makes it harder to ensure the model itself is calibrated across groups (Claim 1) if the feature distributions differ significantly between districts.
  *   **Why it is Apparent:** This is a practical difficulty rather than a logical impossibility. A blind model *can* be calibrated if the relationship between features and outcomes is stable across districts. This conflict is subordinate to the mathematical impossibility of 1 vs. 2.

  ---

  ### 2. Ranking of Conflicts by Fundamentality

  1.  **Claim 1 vs. Claim 2 (Given 3 & 4):** **Most Fundamental.** This strikes at the definition of the tool's output. You cannot define the score as a "probability" (Claim 1) while demanding it produce equal error rates across groups with different base rates (Claim 2). One of these definitions of "fairness" must yield.
  2.  **Claim 4 (Common Cutoff) vs. Claim 2:** **High.** This is the policy constraint that prevents a workaround. If you could use different cutoffs, you could satisfy Claim 2 and Claim 1 (within groups) simultaneously, though Claim 1's "across districts" requirement would still be strained by base rates.
  3.  **Claim 5 (Blindness) vs. Claim 1:** **Low.** This is an implementation constraint. It makes achieving Calibration harder but not logically impossible.

  ---

  ### 3. Costs of Resolution

  To restore coherence, you must weaken or abandon one of the conflicting claims. Here are the costs associated with the primary options:

  *   **Option A: Weaken Claim 1 (Calibration).**
      *   *Revision:* Admit that a score of 0.8 implies a different probability of qualification for a North applicant than for a South applicant.
      *   *Normative Cost:* **Epistemic Dishonesty.** The tool is no longer a valid risk assessment. Applicants cannot rely on the score as a true measure of their likelihood of success. This undermines the "predictive" nature of the tool.
      *   *Practical Cost:* High. If the scores are miscalibrated, the agency cannot accurately estimate the yield of the apprenticeship program.

  *   **Option B: Weaken Claim 2 (Error Rate Parity).**
      *   *Revision:* Accept that, due to different base rates and a common cutoff, qualified applicants from the South will be rejected at a higher rate than qualified applicants from the North (higher False Negative Rate for South).
      *   *Normative Cost:* **Disparate Impact.** The burden of the tool's fallibility falls disproportionately on the historically disadvantaged district. This appears to perpetuate the historical inequality described in Claim 3.
      *   *Practical Cost:* Moderate. The agency must document that the disparity is a mathematical necessity of base rates, not bias in the model, to defend against legal challenges.

  *   **Option C: Weaken Claim 4 (Common Cutoff).**
      *   *Revision:* Allow district-specific cutoffs to equalize error rates.
      *   *Normative Cost:* **Procedural Inequity.** This violates the commitment to "same cutoff" and may be perceived as applying different standards to residents based on their district.
      *   *Practical Cost:* High. Claim 4 explicitly states fairness should not be secured by demographic adjustments. Reversing this requires a significant shift in the agency's philosophical stance on procedural uniformity.

  ---

  ### 4. Recommendation for Lowest Overall Cost

  **Adjustment:** **Weaken Claim 2 (Error Rate Parity).**

  **Rationale:**
  While the normative cost of disparate impact (Option B) is significant, it is the **lowest overall cost** for maintaining the coherence of your specific view for three reasons:

  1.  **Preservation of Tool Validity (Claim 1):** Claim 1 defines the *nature* of the tool ("interpreted as an estimated probability"). If you weaken Claim 1, the tool ceases to be what you say it is. A miscalibrated risk score is technically defective. A calibrated score with disparate error rates is technically sound but socially imperfect. It is less costly to manage the social imperfection than to deploy a technically defective tool.
  2.  **Alignment with Procedural Commitments (Claim 4):** Your view explicitly prioritizes procedural uniformity ("same cutoff," "no deliberate worsening"). Weakening Claim 2 respects these strong procedural constraints. Weakening Claim 4 (to allow different cutoffs) would require you to contradict your own explicit definition of how fairness should *not* be secured.
  3.  **Reality of Base Rates (Claim 3):** Since Claim 3 acknowledges the inequality is "real and unjust in origin" but "not the screening model that creates it," Claim 2 places an impossible burden on the model to fix a structural problem via error rate manipulation. Acknowledging that the model cannot fix the base rate disparity (by weakening Claim 2) is more honest than distorting the model's probabilities (Claim 1) or the selection process (Claim 4) to pretend it can.

  **Implementation Note:**
  To mitigate the normative cost of weakening Claim 2, you should explicitly frame the disparity in error rates not as a failure of fairness, but as a **limitation of predictive tools in the presence of structural inequality**. The coherence of your view is restored by accepting that a *procedurally fair* (Claim 4), *truthful* (Claim 1) tool will inevitably produce *unequal error outcomes* (Claim 2) when *base rates differ* (Claim 3). The remedy for the inequality lies in addressing the base rates (training access), not in breaking the screening tool.
