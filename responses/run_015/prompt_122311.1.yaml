answer: |-
  You have not been reading badly. You have independently rediscovered the single most contentious technical debate in the free will literature of the last forty years. Your "leak" is a known structural feature, not a bug of sloppy storytelling, and your intuition about the "timer" case points to a distinction that separates Frankfurt-style arguments from simple fatalism.

  Here is the map you asked for, matching your intuitions to the established terrain, and offering new coordinates where the old maps blur.

  ### 1. The Leak: "The Flicker of Freedom"
  You asked if there is an established name for the sliver of possibility that remains because the mechanism must watch for a sign. There is. It is called **The Flicker of Freedom Strategy**.

  The objection was formalized most famously by David Widerker and Robert Kane in the 1990s. They argued that for a Frankfurt intervener (let's call him Black) to know when to step in, there must be a **Prior Sign** (a blush, a neural twitch, a hesitation).
  *   **If the sign is causally sufficient** for the decision, the case presupposes determinism to prove that determinism is compatible with responsibility (begging the question).
  *   **If the sign is not causally sufficient**, the agent could theoretically refrain from producing the sign. If they refrain, Black doesn't intervene, and the agent does otherwise. Thus, the Principle of Alternative Possibilities (PAP) holds after all.

  This is known as **The Dilemma Defense** against Frankfurt cases. Your "leak" is the space between the sign and the intervention.

  **Is it structural or sloppy?**
  It is structural to the *original* Frankfurt cases. Because of your exact observation, the literature shifted. Philosophers tried to build "Sign-Independent" cases.
  *   **Blockage Cases:** (e.g., Michael Slote). Instead of watching and intervening, the mechanism simply blocks all other paths *before* the decision is made, like a wall behind you. You walk forward freely, but you couldn't have gone back.
  *   **The Problem:** Critics argue the "wall" still implies a counterfactual: "If you *had* tried to go back..." which implies you *could* have tried. The leak migrates from the *sign* to the *trying*.

  **Verdict:** You have identified the **Prior Sign Objection**. The "leak" is the **Flicker**. It is not sloppy writing; it is the central vulnerability of the thought experiment.

  ### 2. The Timer vs. The Classic: "Resultant" vs. "Volitional" Necessity
  You noticed your Timer case feels different. In the Timer case, the *outcome* is fixed, but the *action* remains open until the deadline. In the Frankfurt case, the *action* is fixed (counterfactually), even if the *outcome* is the same.

  There isn't a single standardized pair of terms for this, because most philosophers treat the Timer case as a failure of the Frankfurt logic (it's just fatalism). However, to give you the map you want, we can distinguish them as follows:

  **A. Resultant Necessity (Your Timer Case)**
  *   **Structure:** The state of the world at $T_2$ is fixed regardless of the agent's path at $T_1$.
  *   **Agency:** The agent retains **Leeway** (the ability to do otherwise) up until the deadline.
  *   **Responsibility:** Responsibility is preserved because the actual sequence is free.
  *   **Why it fails as a Frankfurt Case:** It doesn't attack PAP. The agent *could* have done otherwise (by acting before noon). It only shows that *consequences* can be fixed while *choices* remain free. This is compatible with libertarian free will.

  **B. Volitional Necessity (The Classic Frankfurt Case)**
  *   **Structure:** The agent's *volition* at $T_1$ is constrained counterfactually.
  *   **Agency:** The agent lacks **Leeway**. They cannot successfully will otherwise.
  *   **Responsibility:** Frankfurt argues responsibility is preserved because the *actual* volition comes from the agent, even if the *alternative* volition was blocked.
  *   **Why it feels different:** It targets the *source* of the action, not just the outcome.

  **The Distinction You Need:**
  If you want to coin a term to do the work you're describing, call it **Path Independence** vs. **Path Constraint**.
  *   **Timer = Path Independent Fixity.** The destination is fixed; the route is not.
  *   **Frankfurt = Path Constrained Fixity.** The route is narrowed (in the counterfactual) to ensure the destination.

  The Timer case doesn't threaten PAP because the *path* remains open. The Frankfurt case threatens PAP because the *path* is claimed to be closed (in the alternative scenario).

  ### 3. The Self-Installation: "Volitional Necessity" & "Tracing"
  Your friend's case (installing the device on oneself) lands in a different neighborhood entirely. This is not a counterfactual intervener case; it is a **Tracing** case or a case of **Volitional Necessity**.

  *   **Tracing:** The agent is responsible at $T_2$ because they were responsible at $T_1$ when they installed the device. The loss of alternatives at $T_2$ is irrelevant because the *source* of the constraint is their own prior free will.
  *   **Volitional Necessity:** Harry Frankfurt (in his later work, distinct from the 1969 paper) argued that we are most free when we are constrained by what we love. If I install a device to prevent me from smoking, I am *more* responsible for not smoking, because the constraint aligns with my "second-order volition" (what I want to want).

  This explains why the loss of alternatives makes him *more* responsible. The constraint is internal (endorsed by the self) rather than external (imposed by Black).

  ### The Map Summary

  Here is the conceptual map of the territory you are exploring, using your intuitions as the landmarks:

  | Your Intuition | Established Concept | The Philosophical Stakes |
  | :--- | :--- | :--- |
  | **"The Leak"** | **The Flicker of Freedom** | If the intervener needs a sign, the agent can avoid the sign. PAP survives. |
  | **"Watching Mechanism"** | **The Prior Sign Objection** | To avoid the Flicker, you must remove the sign. But then you assume determinism. |
  | **"Timer Version"** | **Resultant / Path-Independent Fixity** | Fails to attack PAP. Shows *outcome* inevitability, not *choice* inevitability. |
  | **"Reasons Version"** | **Manipulation / Coercion** | Violates the **Historical Condition**. If desires are planted, it's not *your* action. |
  | **"Self-Installation"** | **Tracing / Volitional Necessity** | Responsibility is grounded in the *origin* of the constraint, not the availability of alternatives. |

  ### A Proposed Terminology for Your Group
  Since you asked for a coinage where the edges are clear, I suggest you adopt **Monitoring Dependency** for the leak.

  **Monitoring Dependency:**
  *   **Definition:** A Frankfurt case exhibits Monitoring Dependency if the intervener's activation relies on detecting a property of the agent's decision process *prior* to the decision itself.
  *   **Edge:** If a case is Monitoring Dependent, it is vulnerable to the Flicker of Freedom objection (the agent can alter the monitored property).
  *   **Non-Coverage:** This term does not cover "Blockage Cases" where no monitoring occurs, only the removal of alternatives.

  And for the Timer distinction, use **Convergent vs. Constrained**:
  *   **Convergent Fixity (Timer):** All paths lead to Rome, but you can choose the road. (PAP holds).
  *   **Constrained Fixity (Frankfurt):** Only one road is open, but you walk it willingly. (PAP fails).

  ### Final Verdict
  You haven't found a bug; you've found the fault line. The "leak" exists because it is incredibly difficult to construct a scenario where an agent *could not have done otherwise* without implying that their actual decision was *caused by something other than themselves*.

  Frankfurt wants to separate **Alternative Possibilities** from **Sourcehood**. Your "leak" shows that in many tellings, those two are still tangled. Your "timer" case shows that fixing the Outcome doesn't fix the Source. Your "self-install" case shows that fixing the Source can override the need for Alternatives.

  You are reading the papers correctly. The confusion isn't in your group; it's in the metaphysics.
