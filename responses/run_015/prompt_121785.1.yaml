answer: |-
  This is a sharp intuition. You haven't "made it up entirely"; you are essentially describing a synthesis of Menachem Kellner's work on Maimonidean ontology (that Maimonides seeks to *reduce* ontological commitments) and Yeshayahu Leibowitz's distinction between worship for human need vs. worship for God's sake. By framing centralization as a *restriction* on divine immanence rather than a *concentration* of it, you are treating the Temple not as a place where God is more present, but as a quarantine zone for material worship.

  Here is the ranking of your questions, with one critical addition that I believe supersedes them for your specific hypothesis.

  ### The Ranking

  **1. (New Addition) The Eschatological Test: Does the "Pivot" Persist in the Messianic Era?**
  **2. (Your #2) Interaction with Prophecy and Intellectual Worship**
  **3. (Your #1) Intrinsic Value of Halachic Ritual**
  **4. (Your #3) Implications for Modern Reform/Institutional Design**

  ### Defense of the Ordering

  **1. The Eschatological Test (Upstream & Falsifiable)**
  This is the most critical question for your specific "ontological pivot" hypothesis.
  *   **Why it's #1:** If your pivot is truly *ontological* (a structural redefinition of how divine presence works), it should persist in the ideal state of the world (the Messianic era). If Maimonides predicts a return to universal, unmediated sacrifice or the abolition of sacrifice entirely in the end times, your "pivot" collapses back into a mere historical concession (a temporary band-aid for the Israelites' psychological state).
  *   **Tractability:** This is highly tractable without solving all of medieval philosophy. You simply need to collate Maimonides' statements in *Mishneh Torah* (Laws of Kings) regarding the Messianic era with his teleological statements in the *Guide*. There is tension there, but the texts are explicit enough to work with.
  *   **Upstream:** It determines whether the "restriction" is a feature of reality or a bug of history.

  **2. Interaction with Prophecy and Intellectual Worship (Upstream & Anthropological)**
  *   **Why it's #2:** This defines the *telos* of the human being. If sacrifice is a "negative practice" (clearing space by limiting material engagement), does it serve to elevate the practitioner toward intellectual worship, or does it remain a separate, lower track?
  *   **Tractability:** Maimonides is explicit in *Guide* III that intellectual apprehension is the highest form of worship. The question is whether the "negative practice" of sacrifice is a ladder that gets kicked away or a permanent floor. This requires reading *Guide* II (Prophecy) alongside III (Providence), which is dense but bounded.
  *   **Upstream:** It determines if the "pivot" serves human perfection or merely social order.

  **3. Intrinsic Value of Halachic Ritual (Systemic & Semantic)**
  *   **Why it's #3:** This is the classic "instrumentalism vs. intrinsicism" debate. While vital, it often stalls on semantics. If the "ontological pivot" holds, ritual has value *as restriction*, which is a form of intrinsic value (discipline), but not in the mystical sense (theurgy).
  *   **Tractability:** Lower than the above. Maimonides is notoriously esoteric here. Determining whether he *really* thinks rituals have value beyond pedagogy requires navigating his exoteric/esoteric split, which is philosophically heavy.
  *   **Upstream:** It matters for legal theory, but less for the metaphysical claim you are making.

  **4. Modern Reform/Institutional Design (Downstream & Speculative)**
  *   **Why it's #4:** This is application, not investigation. Drawing normative conclusions for modern institutions from a 12th-century rationalist who wrote for a specific Judeo-Arabic context is fraught with anachronism.
  *   **Tractability:** Low. It relies on the conclusions of 1–3.
  *   **Upstream:** None. This is the furthest downstream.

  ### Confidence and Uncertainty

  **Confidence Level:** High (85%) on the ranking logic and the textual landscape of Maimonides. Moderate (60%) on the viability of the term "ontological pivot" within strict Maimonidean metaphysics.

  **The Point of Least Certainty: The "Ontological Pivot" Terminology**
  I am least sure about labeling this an *ontological* pivot. Maimonides is deeply skeptical of ontology (positive assertions about being). He argues we can only know what God is *not*.
  *   **The Risk:** If you claim the pivot is "ontological," you might be attributing a positive structure to divine presence that Maimonides would deny. He might argue the pivot is *epistemological* (changing how we *know* or *approach* God) rather than *ontological* (changing how God *is* present).
  *   **Why it matters:** If it's epistemological, your ranking still holds, but the metaphysical weight shifts. If it's ontological, it implies a change in the fabric of reality, which is a bolder claim.
  *   **Adjustment:** You might defend this by arguing that for Maimonides, the *human conception* of ontology is the only ontology we can discuss, so restricting the conception *is* an ontological pivot for us.

  ### Evidence That Would Change the Ranking

  1.  **If *Mishneh Torah* is deemed purely exoteric:** If you accept the strong esotericist view (e.g., Leo Strauss) that the *Mishneh Torah* contradicts the *Guide* to protect the masses, the **Eschatological Test (#1)** becomes less tractable because you can't trust the surface text. I would then move **Prophecy/Intellect (#2)** to #1, as the *Guide* is more consistent on the hierarchy of worship.
  2.  **If Sacrifice is Abolished in the Messianic Era:** If textual evidence suggests Maimonides believes sacrifice disappears entirely in the ideal future, your "ontological pivot" hypothesis is falsified. It would prove the concession was purely historical. I would then move **Intrinsic Value (#3)** to #1, because the debate shifts to "what remains of halacha if the material core is temporary?"
  3.  **If "Negative Practice" aligns with Negative Theology:** If you find textual evidence where Maimonides explicitly links the *restriction* of sacrifice to the *restriction* of divine attributes (Negative Theology), my confidence in your "Ontological Pivot" terminology skyrockets, and the **Eschatological Test** becomes even more critical.

  ### Summary
  Prioritize the **Eschatological Test**. It is the only question that can falsify your specific "ontological" claim. If the restriction is permanent (even in the Messianic era), you have a strong case for an ontological shift. If the restriction is temporary, it's just pedagogy. Everything else flows from that determination.
