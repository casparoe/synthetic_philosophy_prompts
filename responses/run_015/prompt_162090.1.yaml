  ### Candidate 2: The Principle of Antecedent Conservation (PAC)
  *This is a formalization of your own "marginal fixing" intuition.*

  **The Principle:**
  When receiving a message constraining $P(B|A) = k$:
  1.  **Constraint:** Set $P_{new}(B|A) = k$.
  2.  **Antecedent Fixity:** Set $P_{new}(A) = P_{old}(A)$. (The message tells you about the structure inside $A$, not how likely $A$ is).
  3.  **Complement Stability:** For any partition cell $C$ disjoint from $A$ (e.g., $\neg A$), preserve the internal conditional ratios: $P_{new}(D|C) = P_{old}(D|C)$ for all $D \subset C$.
  4.  **Renormalize:** Scale masses to sum to 1 (guaranteed by 2 and 3 if $A$ is a partition cell).

  **Motivation:**
  This captures the intuition that a conditional "If $A$, then..." is *about* $A$. It should not leak information to $\neg A$ (Complement Stability) nor change the likelihood of $A$ itself (Antecedent Fixity).

  **Verdicts on Your Cases:**
  *   **Cases 1, 2, 3:** Agrees with you perfectly.
  *   **Case 4:** Yields $(1/2, 0, 1/4, 1/4)$. $P(R)$ stays $1/2$.
      *   *Cost:* This creates a **discontinuity**. If the odds are 99:1, $P(R) \approx 1/2$. If the odds are $\infty$:1, $P(R) = 1/2$. But standard conditioning on $\neg(R \cap H)$ would suggest $P(R)$ should drop. You have to accept that learning a certain conditional is a different *kind* of event than learning a probabilistic one.
  *   **Case 5:** **Fails.** It is order-dependent.
      *   *Why?* In sequence 2-then-3, after step 2, the margin $P(S)$ is still $1/2$, so step 3 preserves it. In sequence 3-then-2, step 3 changes the correlation structure, so step 2's instruction to "preserve margins" applies to a different underlying structure.
      *   *Defense:* You could argue order *should* matter because the context of "silence" changes. The second message is heard against the backdrop of the first.
  *   **Case 6:** Fails. Cannot distinguish protocol differences.

  **New Cases:**
  *   **Disjunctions:** **Breaks down.** If the message is "3:1 on Red or Headquarters," what is the antecedent? $R \cup H$? If so, do you fix $P(R \cup H)$? What about the internal ratio of $R$ vs $H$? The rule lacks a clause for non-atomic antecedents.
  *   **3x3 Grid:** Ambiguous. If told "If Row 1, then 3:1 Col 1," do you fix the Row 1 margin? What if told "If Col 1 or 2..."? The rule relies on a privileged partition that isn't always available.
  *   **Conflicting Informants:** Breaks down. You cannot fix the antecedent margin to two different values simultaneously.

