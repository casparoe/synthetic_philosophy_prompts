  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on ethics and public policy (18 students, 90 minutes).
      *   **Topic:** Paternalism and Nudging (specifically Libertarian Paternalism).
      *   **Prior Knowledge:** Students have read standard material (Thaler & Sunstein, etc.), including the "as judged by themselves" criterion.
      *   **Goal:** Design a *runnable activity* (not a lecture) to illustrate the concept of an "orphaned default."
      *   **Key Concept:** "Orphaned Default" = Defaults set for one population/time, inherited by another, invisible, never re-audited, detaching the "as judged by themselves" test from actual people. Also, "Auditing Asymmetry" (setting is deliberate, noticing requires effort/visibility).
      *   **Requirements:**
          *   Participants must *experience* the default as a benefit first (defence must land).
          *   Then experience being governed by it when preferences change (pressure applied).
          *   The default must not be revisited/audited during the activity.
          *   Stakes must be small but real (e.g., class time, token good).
          *   Invisibility must be discovered *afterwards*, not announced.
          *   Need: Setup, Materials, Rounds (info status), Stake Structure, Debrief (mapping to concepts), Prediction of Failure, Limitations.
      *   **Constraint:** Avoid collapsing into a lecture or making the nudge look bad from the start.

  2.  **Deconstruct the "Orphaned Default" Concept for an Activity:**
      *   *Phase 1 (Benefit):* Students need to feel saved by a default. It needs to align with their immediate interests.
      *   *Phase 2 (Shift):* Their interests need to change, or the context needs to change, making the default suboptimal.
      *   *Phase 3 (Inertia):* They need to stick with the default despite the shift, ideally because they didn't notice they could change it or because the cost of changing felt too high compared to the "invisible" nature of the setting.
      *   *Phase 4 (Reveal):* Show them that the default was set by someone else, long ago, for a different reason, and no one is checking it.

  3.  **Brainstorming Activity Scenarios:**
      *   *Idea 1: Food/Catering.* Order lunch for them. Default is healthy. Later they want comfort food. *Critique:* Logistically hard to change mid-class. Stakes too high/low?
      *   *Idea 2: Grading/Points.* Default grading scheme. *Critique:* Too stressful, ethical issues with grades.
      *   *Idea 3: Class Time Allocation.* How the last 20 mins are spent. *Critique:* Good stake.
      *   *Idea 4: Resource Allocation.* A pool of "tokens" or "minutes" they can spend on different outcomes. *Critique:* Abstract.
      *   *Idea 5: The "Syllabus/Policy" Simulation.* Simulate a departmental policy decision. *Critique:* Too meta.

      *Selected Concept:* **The "End-of-Class Resource" Allocation.**
      *   *Why:* It uses actual class time (a scarce resource students value). It allows for a clear shift in preference (learning vs. breaking vs. discussing). It allows for a "set and forget" mechanism.

      *Refining the Concept:*
      Let's make it about *how the final 20 minutes of the seminar are used*.
      *   *Round 1:* Students are tired/overwhelmed. A default "Summary & Q&A" or "Break" is helpful.
      *   *Round 2:* Students are energized/debate-ready. They want "Open Debate."
      *   *The Default:* The instructor sets the agenda at the start (inherited from a "previous instructor" or "department policy").
      *   *The Twist:* The mechanism to change the agenda is available but obscured or framed as "opt-out."

      *Wait, a better angle for "Orphaned Default":*
      The default needs to be set by *someone else* (simulated) and inherited.
      Let's create a fictional "Department of Seminar Efficiency" that sets the rules for this class session.
      Actually, let's make it more immediate. The "Previous Cohort" set the default for *this* cohort.
      *Scenario:* A shared resource pool (e.g., 15 minutes of "Free Time" or "Extension Tokens").
      *Setup:* At the start of class, a policy is presented as "Standard Procedure."
      *Stake:* 15 minutes of class time at the end.
      *Default:* "Auto-Release" vs. "Opt-In."

      *Let's try a specific mechanism:* **The "Consent for Extension" Protocol.**
      *   *Stake:* 10 minutes of class time at the end. Either used for a structured wrap-up (Default) or released for free time/early dismissal (Alternative).
      *   *Round 1 (Benefit):* Students are confused about the reading. They *want* the structured wrap-up. The default saves them.
      *   *Round 2 (Shift):* It's a nice day, or the discussion is flowing, or they are tired. They want early dismissal.
      *   *The Catch:* The default was set by "Last Year's Students" (simulated) to help *them* understand hard concepts. This year's students have different needs.
      *   *Invisibility:* The option to change isn't announced; it's buried in a handout or slide footer.

      *Critique:* This feels a bit weak on the "invisibility."
      Let's go with **The "Participation Credit" Default.**
      *   *Stake:* A small amount of participation credit (or a tangible treat like coffee vouchers). Let's stick to *Class Time* as it's zero-cost and high value.
      *   *Scenario:* Two blocks of time. Block A (First 40 mins), Block B (Last 20 mins).
      *   *Default:* How Block B is used.
      *   *Mechanism:* A slip of paper handed out at the start.

      *Revised Plan:* **The "Agenda Inheritance" Simulation.**
      *   *Premise:* You (the instructor) are not setting the agenda. You are following the "Departmental Standard Operating Procedure" established 5 years ago.
      *   *Material:* A printed "Course Protocol Sheet."
      *   *Stake:* The final 15 minutes.
      *   *Option A (Default):* Structured Debrief (High cognitive load, high learning value).
      *   *Option B (Opt-out):* Unstructured Discussion/Early Leave (Low load, high relaxation).

      *Wait, I need the "As Judged By Themselves" defence to land first.*
      So, in Round 1, they must *agree* that the default is good for them.
      In Round 2, they must *feel* the default is bad, but stick with it because it's invisible/sticky.

      *Let's refine the "Invisibility."*
      The option to change the agenda must exist but be hard to find.
      *Idea:* A QR code or a footnote on the syllabus/handout that says "To modify session structure, submit Form X 24 hours in advance."
      *But this is a 90 min class.*
      *Better:* The choice is presented as a "Standing Order."
      *Round 1:* Ask them: "Do you want a summary today?" (They say yes, reading was hard). Instructor says: "Great, the protocol defaults to Summary." (Validation).
      *Round 2 (60 mins in):* Discussion is hot. They want to keep debating. The Default says "Stop and Summarize."
      *The Kicker:* They don't realize they can override the Summary until the Debrief.
      *Wait, if they don't realize, they just do it.*
      *The Reveal:* At the end, show them there was a clause allowing them to vote to extend debate, but it required a specific procedure they weren't told about.

      *Let's tighten the "Orphaned" aspect.*
      The default wasn't set by *me*. It was set by a "Committee" (fictional) based on data from 3 years ago.
      *Activity Flow:*
      1.  **Handout:** "Session Protocol v4.2."
      2.  **Clause 3:** "To maximize retention, sessions conclude with a 15-min Instructor Summary."
      3.  **Fine Print:** "Cohorts may override Clause 3 via unanimous written consent submitted at minute 45."
      4.  **Round 1 (Min 0):** Acknowledge Clause 3. Ask: "Is summary good?" (Yes, reading is dense). *Defence lands.*
      5.  **Round 2 (Min 60):** Discussion is electric. They want to keep going. Summary feels like a killjoy.
      6.  **The Trap:** Do they notice the Fine Print? Most won't. They will accept the Summary.
      7.  **The Reveal (Min 85):** Reveal the Fine Print. Reveal that Clause 3 was based on 2021 data (when readings were harder).
      8.  **Debrief:** Connect to orphaned default.

      *Stakes:* 15 minutes of their time.
      *Invisibility:* The override mechanism is in the fine print.
      *Auditing Asymmetry:* I set the protocol once (before class). They have to find the override during class.

      *Potential Failure:* Students might be too rebellious and ignore the protocol anyway. Or they might read the handout too carefully.
      *Mitigation:* Make the handout look bureaucratic and boring. Emphasize the *benefit* of the default at the start so they stop looking for alternatives.

  4.  **Drafting the Activity Steps:**
      *   **Title:** The Protocol Inheritance.
      *   **Materials:** "Session Protocol" handout (designed to look administrative).
      *   **Time:** 90 mins total.
      *   **Stake:** The final 15 minutes (Summary vs. Open Debate).
      *   **Round 1 (Min 0-10):** Distribute Protocol. Highlight the "Summary Default." Frame it as a benefit (cognitive offloading). Get verbal buy-in.
      *   **Round 2 (Min 10-60):** Seminar discussion.
      *   **Round 3 (Min 60-75):** The Pivot. The discussion is peaking. Remind them of the Protocol (Summary starts at 75). Watch them comply.
      *   **Round 4 (Min 75-85):** Conduct the Summary (even if it feels forced).
      *   **Round 5 (Min 85-90):** The Reveal & Debrief.

  5.  **Refining the "Orphaned" Narrative:**
      *   The Protocol must explicitly state it was designed by a "Curriculum Committee" based on "Prior Cohort Feedback."
      *   This creates the *inter-generational* aspect of the orphaned default.
      *   The "As Judged By Themselves" defence is that the Committee claimed this is what students *generally* want.
      *   The "Orphan" moment is when *this* specific group wants something else but is bound by the *general* past judgment.

  6.  **Addressing the "Auditing Asymmetry":**
      *   Setting the protocol took me 10 minutes once.
      *   Changing it requires them to notice the footnote, agree unanimously, and act during high cognitive load.
      *   This mirrors the real-world asymmetry.

  7.  **Predicting Failures:**
      *   *Failure 1:* Students ignore the handout entirely. (Fix: Reference it explicitly at the start).
      *   *Failure 2:* Students revolt at Min 60. (Fix: Frame the Summary as "Required for Credit" or similar, but that's too coercive. Better: Rely on social norm compliance. If I say "The Protocol says...", they usually follow).
      *   *Failure 3:* The "Benefit" doesn't land. (Fix: Ensure the reading is actually dense so they *do* want a summary initially).
      *   *Failure 4:* I break character and hint at the twist. (Fix: Script the instructor lines).

  8.  **Structuring the Debrief:**
      *   Map the "Buy-in" to Thaler/Sunstein's defence.
      *   Map the "Shift" to the changing context/preferences.
      *   Map the "Fine Print" to Invisibility/Sludge.
      *   Map the "Committee" to the Orphaned nature (past judgments binding present).
      *   Map the "Effort to Change" to Auditing Asymmetry.

  9.  **Final Review against Constraints:**
