      *   *Invisibility?* Yes, buried in the handout.
      *   *Stakes?* 15 mins of class time.
      *   *No lecture?* The activity drives the debrief.
      *   *Frank about limitations?* Need to acknowledge that I (the instructor) am still the one pulling the strings, so the "powerlessness" is simulated.

  10. **Writing the Response:** (Iterative refinement for tone and clarity).
      *   Make sure the handout text is provided.
      *   Ensure the timing is precise.
      *   Be explicit about the "script."
      *   Highlight the specific ethical concepts in the debrief section.
      *   Add the "What Will Go Wrong" section honestly.

      *(Self-Correction during drafting)*: I need to make sure the "override" isn't *impossible*, just *unlikely*. If it's impossible, it's coercion, not nudging. It must be a valid opt-out that they miss.
      *Override mechanism:* "To waive the Summary, any student must raise a red card (provided in folder) before Minute 60."
      *Wait, red cards are too visible.*
