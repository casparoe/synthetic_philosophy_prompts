answer: |-
  Here is a complete design for the activity. It is built to be run exactly as written, with specific scripts and materials. The goal is to make the students *feel* the logic of libertarian paternalism before feeling the friction of the orphaned default.

  ### Activity Title: The Protocol Inheritance
  **Time:** 90 Minutes
  **Participants:** 18 Students
  **Stake:** The final 15 minutes of class time (Structured Summary vs. Open Debate/Early Dismissal).

  ---

  ### 1. Materials & Setup

  **A. The "Session Protocol" Handout (1 per student)**
  *Design:* Make this look bureaucratic and boring. Use a standard font (Arial/Times), a header that looks like a department form, and varying font sizes to manipulate attention.
  *Content:*
  > **SEMINAR SESSION PROTOCOL [v.4.2]**
  > **Department of Ethics & Public Policy**
  >
  > **Objective:** To maximize cognitive retention and minimize decision fatigue during upper-level seminars.
  > **Basis:** This protocol was established by the Curriculum Committee in 2022, based on feedback from the 2021 Cohort indicating that **85% of students preferred a structured instructor summary** to consolidate complex readings.
  >
  > **1. Session Flow (Standard)**
  > *   **00:00 – 75:00:** Open Seminar Discussion.
  > *   **75:00 – 90:00:** **Instructor-Led Structured Summary.** (Required to close the session).
  >
  > **2. Administrative Notes**
  > *   Attendance is recorded at the 75-minute mark.
  > *   *Cohorts may waive the Structured Summary in favor of continued open debate by verbally invoking "Protocol Override" prior to the 60-minute mark.*
  > *   Please silence phones.

  **B. The Room**
  *   Project the "Session Flow" (Section 1 only) on the main screen at the start of class. Do **not** project Section 2.
  *   Place the handouts face-down on desks before they enter.

  ---

  ### 2. The Rounds (Scripted Flow)

  #### Round 1: The Benefit (Minutes 0–10)
  **Goal:** Secure buy-in on the default using the "as judged by themselves" defence.

  1.  **Start:** Ask students to turn the handout over.
  2.  **Script:** *"Before we begin, note the Session Protocol on your desk. This isn't my rule; it's a departmental standard set a few years ago based on data from prior cohorts. They found that in dense seminars like this, decision fatigue sets in around hour one. To help you, the default is a Structured Summary for the last 15 minutes."*
  3.  **The Check:** Ask the room: *"Given the reading for today was particularly dense, does a structured summary sound like a net benefit to you right now?"*
  4.  **Expected Outcome:** Students will nod or agree. They are tired, the reading was hard, and the default promises to do the work for them.
  5.  **Action:** *"Great. We will proceed under Protocol 4.2."* Begin the seminar discussion.
      *   *Note:* Do not mention Section 2 (Administrative Notes). Do not mention the override clause.

  #### Round 2: The Shift (Minutes 60–65)
  **Goal:** Create a context where the default is no longer optimal, but the inertia holds.

  1.  **Context:** By minute 60, steer the discussion toward a heated, unresolved, high-energy debate. Ensure the students are intellectually energized.
  2.  **The Trigger:** At Minute 60, glance at your watch.
  3.  **Script:** *"We are hitting the 60-minute mark. Just a reminder, per the Protocol on your desk, we must transition to the Structured Summary at minute 75. I'll start wrapping up our current thread so we can prepare for the summary."*
  4.  **Observation:** Watch the room. They will likely feel a dip in energy. They want to keep debating. However, they have the handout. The override clause exists (*"verbally invoking Protocol Override"*).
  5.  **The Trap:** Most will not notice the clause. Even if they do, the "Auditing Asymmetry" kicks in: they have to stop the flow, read the fine print, and collectively agree to challenge a "Departmental Standard."
  6.  **Action:** If no one invokes the override, proceed to minute 75.

  #### Round 3: The Enforcement (Minutes 75–85)
  **Goal:** Experience the friction of the orphaned default.

  1.  **Action:** At minute 75, interrupt the discussion.
  2.  **Script:** *"Time for the Structured Summary. As per the protocol, I will now consolidate the points."*
  3.  **Delivery:** Deliver a 10-minute summary that feels slightly tonal-dissonant. It should be competent but clearly unnecessary given the energy of the previous debate. It should feel like "busy work."
  4.  **Stake Realization:** Students realize they are losing 15 minutes of potential debate (or early leave) for a summary they no longer value.

  #### Round 4: The Reveal & Debrief (Minutes 85–90)
  **Goal:** Map the experience to the theory.

  1.  **The Reveal:** Stop the summary 5 minutes early.
  2.  **Script:** *"Stop. Look at Section 2 of your handout. Read the second bullet point."*
  3.  **Allow 30 seconds of silence/realization.**
  4.  **Debrief Questions:** (See below).

  ---

  ### 3. The Debrief Map

  Do not lecture. Use their reactions to drive the following three points.

  **(a) The "As Judged By Themselves" Defence (Minutes 0–10)**
  *   **Ask:** *"At the start, why did you agree to the Summary Default?"*
  *   **Point:** They agreed because, *at that moment*, it aligned with their interests (dense reading, high fatigue). This validates Thaler & Sunstein: the nudge was welfare-enhancing *as judged by the choosers* at Time 1.
  *   **The Ethical Hook:** The defence relies on the stability of preferences. If preferences are stable, the default is benign.

  **(b) The Orphaned Default (Minutes 60–75)**
  *   **Ask:** *"Why did the default feel different at minute 60 than at minute 0?"*
  *   **Point:** The default was set by the **2021 Cohort** (per the handout text). You are the **2024 Cohort**. Your context (energy level, specific discussion flow) differed from theirs.
  *   **The Ethical Hook:** The "As Judged By Themselves" test detached. It was no longer judged by *you*; it was judged by *ghosts*. The default became orphaned from the actual population it governs. Because it was invisible (Section 2), no one re-audited it.

  **(c) The Auditing Asymmetry (The Override Clause)**
  *   **Ask:** *"The option to change was there. Why didn't you use it?"*
  *   **Point:** Setting the default took the Committee one meeting in 2022 (low cost, high visibility to them). Changing it required you to notice small print, interrupt social flow, and invoke a bureaucratic phrase during high cognitive load (high cost, low visibility).
  *   **The Ethical Hook:** Libertarian paternalism assumes "easy opt-out." But if the architecture isn't maintained, the opt-out becomes "sludge." The asymmetry ensures the default persists not because it is good, but because auditing is expensive.

  ---

  ### 4. Predictable Failures & Mitigation

  **1. The "Rebellion" Failure**
  *   **Risk:** A student spots the override clause immediately and calls it out at Minute 60, ruining the tension.
  *   **Mitigation:** If this happens, **do not break character.** Say: *"Correct, you have exercised the override. We will continue debating."* Then, in the debrief, use that student as the "Auditor." Ask the class: *"Why was it up to one person to save the rest of you from the default? Is that a robust system?"* This actually strengthens the point about auditing asymmetry.

  **2. The "Apathy" Failure**
  *   **Risk:** The discussion doesn't get energetic. Students actually *want* the summary at Minute 75.
  *   **Mitigation:** You must manage the energy. If the discussion is lagging at Minute 60, *you* inject energy. If they still want the summary, the debrief shifts: *"The default worked. But who checks when it stops working? If you had wanted to debate, would you have known you could?"* The ethical problem remains the *invisibility of the option*, not just the outcome.

  **3. The "Deception" Pushback**
  *   **Risk:** Students feel manipulated by you hiding the override.
  *   **Mitigation:** Acknowledge this openly. *"I hid the override to simulate the invisibility of real-world defaults. In the real world, no one hides it maliciously; it's just buried under 'Administrative Notes.' I replicated that structure."*

  ---

  ### 5. Limitations: What This Activity Cannot Do

  You must state these outright in the debrief to maintain intellectual honesty.

  **1. The Power Simulation**
  *   **Limitation:** In this activity, *you* are still the one enforcing the default. In reality, orphaned defaults often persist because *no one* is enforcing them; they just exist in software or policy documents.
  *   **Statement:** *"I acted as the enforcer here. In reality, the enforcer is often inertia itself. I had to stop your debate. In a pension plan, the default just silently deducts money without anyone stopping you."*

  **2. The Stakes**
  *   **Limitation:** 15 minutes of class time is low stakes compared to organ donation or retirement savings.
  *   **Statement:** *"You lost 15 minutes. In public policy, the orphaned default costs people money, health, or privacy. The mechanism is the same; the harm is just scaled up."*

  **3. The Intent**
  *   **Limitation:** The students know *you* designed this activity. They know the "Committee" is fictional.
  *   **Statement:** *"You knew I was running an experiment. In public policy, there is no experimenter. There is only the system. The danger is that we stop seeing the system as a choice architecture at all."*

  ### 6. Instructor Checklist for Success

  *   [ ] **Handout Design:** Ensure "Administrative Notes" is visually distinct (smaller font, less bold) than "Session Flow."
  *   [ ] **Timekeeping:** Be strict with the Minute 60 and Minute 75 markers. The pressure of the clock creates the cognitive load that hides the override.
  *   [ ] **Tone:** In Round 1, be warm and supportive (The Nudge is helpful). In Round 3, be bureaucratic and firm (The Default is law). This shift in your demeanor mirrors the shift from *benefit* to *constraint*.
  *   [ ] **The "2021 Cohort" Detail:** Ensure this is legible on the handout. It is the crucial link to the "Orphaned" concept.

  This activity forces them to live through the lifecycle of a nudge: from helpful tool to inherited constraint, without ever taking the choice away technically, only practically.
