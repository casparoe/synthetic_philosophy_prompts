      *   *Key Argument:* The "invisibility" of the health reason means it was not part of the practical syllogism *at the time of action*. Therefore, the ATC judgment *did* shift, even if the propositional belief remained stored. Action follows active opinion.
      *   *Terminology:* Use terms like *practical syllogism*, *energeia* vs. *hexis*, *prohairesis*, *orexis*.
      *   *Constraint Check:* Do not concede true *akrasia*. Treat mechanisms as *explananda*.

  5.  **Refining the Argument:**
