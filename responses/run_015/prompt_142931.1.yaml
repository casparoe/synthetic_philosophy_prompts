  2.  **Deconstruct the User's Scenario:**
      *   **Monday:** Resolution (No cake on Friday).
      *   **Friday:** Action (Eats cake).
      *   **Mechanism:** "Affective salience inversion." Health reason is propositionally believed but cognitively invisible. Taste dominates without weighing.
      *   **Claim:** No ATC judgment favoring cake on Friday. Practical syllogism is sound *given* inverted weights.
      *   **Conclusion:** Cross-temporal rational failure that isn't judgment shift or delegation.

  3.  **Formulate the Aristotelian Defense:**
      *   **Core Thesis:** *Akrasia* in the strict sense (knowing the better, choosing the worse *while* knowing it) is impossible. Action follows judgment.
      *   **Addressing "Affective Salience Inversion":** This is merely a description of a psychological state, not a justification for irrationality. If the agent acts on taste, she *must* have judged taste superior *in that moment*, even if she cannot articulate it or feels regret immediately after.
      *   **The "Cognitively Invisible" Claim:** If a reason is cognitively invisible in deliberation, it is not operative in the practical syllogism. Therefore, the ATC judgment *at the time of action* necessarily favored the cake. To say otherwise is to posit action without motivation, which is absurd.
      *   **Diachronic Identity:** The Monday self and Friday self are numerically identical but qualitatively distinct in state. The failure is not a break in rationality but a failure of *knowledge* retention or activation. Aristotelian *akrasia* is often a failure of possessing knowledge in the active sense (*energeia*) versus the habitual sense (*hexis*).
      *   **Rebuttal to "Third Category":** There is no third category. Either the judgment changed (even if subtly/unconsciously) or the agent is acting under ignorance (of the particular premise). The "invisibility" of health *is* the suppression of the universal premise, rendering the particular premise (this cake is tasty) dominant. This is a shift in operative judgment, not a suspension of judgment.
      *   **Normative Status:** Hyperbolic discounting explains *why* the shift occurred, but does not validate the Friday judgment as irrational relative to the Friday state. The rational failure lies in the failure to maintain the universal premise in activation, which is a cognitive defect, not a volitional paradox.

