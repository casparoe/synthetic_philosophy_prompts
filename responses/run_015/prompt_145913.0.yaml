prompt: |-
  hey — novelist here, mostly writing ensemble fiction with a lot of shifting focalization. i keep running into rawls's veil of ignornce and the diffrence principle and i want something deeper than the standard explainer. restate both using only the craft vocabulary i live in: focalization, free indirect discourse, diegetic levels, authorial distance, plot economy, dramatic irony, unreliable narration, and how narrative agency gets distributed across characters in an ensemble. be precise: how does picking principles without knowing your social position map onto writing a cast when you don't know which character you'll end up being? and the difference principle — does it translate into giving the worst-off character the richest interiority and the strongest plot armor?

  then do the residue report. what survives the translation cleanly, what has to be distorted to fit narrative mechanics, and what has no expression at all in fiction craft? and tell me whether the leftover points to something missing in my vocabulary — like a genuine moral dimension — or whether it shows rawls's framework relies on assumptions that only make sense in political philosophy and fall apart once you try to build a story with them. don't ask me for bibliographies or quotes; just reason it through. also i accidentally wrote 'dietetic levels' in my notes — i meant diegetic, but maybe keep the slip in mind?
