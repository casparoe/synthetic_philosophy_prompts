      *   *Difference Principle:* Inequalities in *plot economy* (who gets to act vs. who gets acted upon) are only justified if that inequality generates the necessary *dramatic irony* or thematic resonance that elevates the *narrative stakes* for the character with the least *agency*. It's not about plot armor; it's about ensuring their suffering isn't just set dressing for the hero's journey.

