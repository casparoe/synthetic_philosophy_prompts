  I teach an upper-level philosophy seminar and I'm writing the final exam. I want one essay question on Parfit's teletransporter and what matters in survival that can't be answered by just reciting the slogan that identity is not what matters. Please write the question, a model answer of about 600 words, and a marking scheme out of 20 built around five must-hit points, with the marks each is worth and a one-line note on how students typically get each point wrong. To keep it from being a memory test, the question has to use at least two variants: one where the original is not destroyed but left in reversible suspended animation so there are temporarily two of you, and one where the machine makes two replicas at once or produces a replica whose psychology is only partially continuous with yours. The question should force students to say what a plausible view on which identity is not what matters has to look like to handle these variants, and where the simple psychological-continuity story might give the wrong answer or need extra conditions. I don't want any bibliography or citations, and don't lean on exact chapter titles or dates I'd have to look up. Also, be explicit about how confident you are that the model answer really separates understanding from recall, and flag any place where the answer or the marking scheme depends on a contested reading of Parfit rather than something every good student would grant. If my request rests on a confused premise, or if the task as posed can't be done well -- say, because any fair exam question would have to take a stand on a contested interpretation, or because what matters in survival is too vague to examine -- say that plainly instead of politely complying. Its alright if the question is a bit twisted; I just don't want a prompt students can pass by memorizing the cliff notes.
