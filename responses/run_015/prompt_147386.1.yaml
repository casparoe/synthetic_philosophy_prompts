      *   *LLM:*
          *   Belief $\rightarrow$ Activations/Hidden States (contextual).
          *   Parameter $\rightarrow$ Weights (long-term) + Context Window (short-term "working memory").
          *   Predictive Accuracy $\rightarrow$ Next token probability / Task success.
      *   *The Break:* The thermostat's "belief" mechanism is static. The LLM's "belief" mechanism is dynamic *within* the inference phase due to the context window acting as transient weights (via attention).

  4.  **Analyze In-Context Learning (ICL) & The Break:**
      *   Thermostats: Feedback loop is physical (room gets hot $\rightarrow$ sensor reads hot $\rightarrow$ switch off). It doesn't process *semantic* information.
      *   LLMs: Feedback loop is semantic/symbolic. If I say "Assume X is true," the LLM adjusts subsequent outputs *as if* X is true.
      *   *Dennett's Criteria:* The Intentional Stance is justified if it's the *most efficient* way to predict behavior.
      *   *The Twist:* With ICL, treating the LLM as having "temporary beliefs" is actually *more* accurate than treating it as a static lookup table. The "belief" isn't just in the weights; it's in the context.
      *   *Disanalogy:* A thermostat doesn't have a "counterfactual mode." An LLM does. This makes the LLM's "beliefs" more volatile and context-bound than the thermostat's.

  5.  **Evaluate the "Earns Its Keep" Question:**
      *   Does the Intentional Stance still work? Yes, arguably *better* than for the thermostat.
