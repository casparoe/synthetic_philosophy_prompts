      *   *Standard View:* A thermostat has a state (current temp), a goal (set temp), and an action (heat/cool). We say it "believes" it's cold and "wants" to be warmer. Dennett says this is useful prediction, not ontological truth.
      *   *LLM Application:* LLMs have weights (parameters), input (prompt), output (completion). We say it "believes" Paris is in France.
      *   *The User's Challenge:* Thermostats don't change their internal logic based on *conversation* (whispering counterfactuals). LLMs do (via attention/ICL).

