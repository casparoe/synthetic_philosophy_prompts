answer: |-
  ### Decision Tree: Taxonomy of Responses to the Situationist Critique

  **Instructions for Use:** Begin at the Root. Follow the path dictated by the respondent's commitment to each proposition. Terminal nodes (Leaves) classify the position.

  #### **Root: The Empirical Challenge**
  **Q1. Does the empirical finding—that situational variables predict behaviour more reliably than global traits—undermine virtue ethics?**
  *   **A.** Descriptively only (Virtue exists but is rare/different). → *Go to Q2.*
  *   **B.** Normatively only (Virtue is an ideal, regardless of psychology). → *Go to Q2.*
  *   **C.** Both descriptively and normatively (Virtue ethics is fundamentally flawed). → *Go to Leaf 1.*
  *   **D.** Neither (The findings are misinterpreted or irrelevant). → *Go to Q2.*

  ---

  #### **Branch 1: The Consistency Commitment**
  **Q2. Is cross-situational consistency in behaviour necessary for the attribution of a virtue?**
  *   **A.** Yes, strict global consistency is required. → *Go to Q3.*
  *   **B.** No, consistency is irrelevant; only motivational structure matters. → *Go to Q3.*
  *   **C.** No, consistency is sufficient but not necessary (e.g., one can be virtuous despite occasional lapses). → *Go to Q3.*

  ---

  #### **Branch 2: The Ontology of Virtue**
  **Q3. How is the property of 'virtue' ontologically conceived?**
  *   **A.** **Local/State Property:** A disposition tied to specific domains (e.g., courage only in physical danger). → *Go to Q4.*
  *   **B.** **Global Disposition:** A broad character trait with context-sensitive activation conditions. → *Go to Q4.*
  *   **C.** **Relational Property:** A fit between agent capacities and environmental structures ("Ecological Virtue"). → *Go to Q4.*

  ---

  #### **Branch 3: Second-Order Situationism**
  **Q4. Do the criteria for what counts as a virtue vary across social contexts?**
  *   **A.** Yes, evaluative standards are context-dependent (Second-Order Situationism). → *Go to Q5.*
  *   **B.** No, evaluative standards are universal, even if behaviour varies. → *Go to Q5.*

  ---

  #### **Branch 4: Fragmentation and Unity**
  **Q5. Can an agent possess a virtue in one domain (e.g., professional crises) while lacking it in another (e.g., personal crises)?**
  *   **A.** Yes, virtues are compartmentalised (Fragmentation). → *Go to Q6.*
  *   **B.** No, virtues are unified (if one has courage, one has it generally). → *Go to Q6.*

  ---

  #### **Branch 5: Corrigibility**
  **Q6. Is the agent's sensitivity to situational pressure malleable via moral education?**
  *   **A.** Yes, habituation can override situational determinants. → *Go to Q7.*
  *   **B.** No, situational sensitivity is largely fixed or biologically constrained. → *Go to Q7.*

  ---

  #### **Branch 6: The Target of Evaluation**
  **Q7. What is the primary object of moral praise or blame?**
  *   **A.** The Agent (internal character). → *Go to Leaves.*
  *   **B.** The Action (outcome-based). → *Go to Leaves.*
  *   **C.** The Agent-Environment System (structural fit). → *Go to Leaves.*

  ---

  ### **Terminal Leaves (Classification)**

  **Leaf 1: Eliminativist Situationism**
  *   **Path:** Q1(C).
  *   **Definition:** The empirical data demonstrates that global traits do not exist, and therefore virtue ethics fails both as a psychology and a normative theory.
  *   **Status:** **Named Position** (e.g., Doris, *Lack of Character*).

  **Leaf 2: Classical Aristotelianism**
  *   **Path:** Q1(D) → Q2(A) → Q3(B) → Q4(B) → Q5(B) → Q6(A) → Q7(A).
  *   **Definition:** Virtues are global, consistent, unified dispositions that are universally defined and resistant to situational pressure.
  *   **Status:** **Named Position** (Traditional interpretation).

  **Leaf 3: Local Trait Theory**
  *   **Path:** Q1(A) → Q2(A) → Q3(A) → Q4(B) → Q5(A).
  *   **Definition:** Virtues exist but are narrowly scoped to specific contexts; one can be honest at work but dishonest at home.
  *   **Status:** **Named Position** (e.g., Miller, *Moral Fragility*).

  **Leaf 4: Ecological Virtue Ethics**
  *   **Path:** Q1(A/D) → Q2(B/C) → Q3(C) → Q4(B) → Q7(C).
  *   **Definition:** Virtue is not an internal state but a relational property of the agent-environment pair; moral evaluation targets the fit between the two.
  *   **Status:** **Named Position** (Working label: "Ecological Virtue"; akin to Slingerland or embodied cognition approaches).

  **Leaf 5: Normative Idealism**
  *   **Path:** Q1(B) → Q2(A) → Q3(B) → Q4(B) → Q6(A).
  *   **Definition:** Global traits may be empirically rare, but they remain the normative ideal; 'ought' does not imply 'can' in a descriptive sense.
  *   **Status:** **Named Position** (Kantian-inflected Virtue Ethics).

  **Leaf 6: Unoccupied/Unstable Position**
  *   **Path:** Q2(A) [Consistency Necessary] → Q3(A) [Virtue is Local].
  *   **Definition:** Claims that strict global consistency is required for virtue, yet defines virtue as a local, domain-specific property.
  *   **Status:** **Unoccupied.**
  *   **Diagnosis:** **Conceptually Unstable.** If a virtue is defined as *local* (domain-specific), demanding *global* cross-situational consistency is a category error. If consistency is only required *within* the domain, Q2(A) must be rephrased, rendering the path redundant with Leaf 3.

  **Leaf 7: Contextualist Relativism**
  *   **Path:** Q4(A) → Q7(A).
  *   **Definition:** What counts as courage in one culture or context is fundamentally different from another; there is no universal metric for virtue.
  *   **Status:** **Unnamed** (Coherent but often rejected by universalists).

  **Leaf 8: Structural Determinism**
  *   **Path:** Q6(B) → Q7(C).
  *   **Definition:** Since situational sensitivity is fixed, praise/blame should target the environmental structures rather than the agent.
  *   **Status:** **Unnamed** (Coherent; aligns with certain political critiques of virtue ethics).

  ---

  ### **Commentary on Classification and Reasoning**

  #### **Revision Conditions for "Ecological Virtue"**
  The classification of the **Ecological Virtue** branch (Leaf 4) relies on the philosophical distinction between an internal disposition that *responds* to context and a property that is *constituted* by the agent-environment relation. I would revise this classification if empirical cognitive science demonstrated that what appears to be "environmental scaffolding" is actually fully internalised as stable cognitive scripts or schemas. If the "environmental" component can be reduced to complex internal computational states without loss of explanatory power, the "Relational Property" (Q3-C) would collapse into "Global Disposition with context-sensitive activation" (Q3-B). Conversely, if philosophical argument successfully demonstrated that relational properties cannot bear moral praise (as only agents possess will), this branch would be forced to migrate to Leaf 8 (Structural Determinism).

  #### **Most Vulnerable Step in Reasoning**
  The most vulnerable step in this taxonomy is **Branch 2 (Q3): The Ontology of Virtue**, specifically the distinction between **Option B (Global Disposition with context-sensitive activation)** and **Option C (Relational Property)**.
  *   **Reason for Vulnerability:** In practice, a "global disposition" that only activates under specific contextual conditions is functionally indistinguishable from a "relational property" in many empirical tests. A philosopher may claim they hold view B, while their commitments imply view C, or vice versa. The boundary between a trait that *interacts* with the environment and a trait that is *partly constituted* by the environment is metaphysically thin and difficult to isolate via concrete case judgments alone. This ambiguity risks misclassifying interactionist views as ecological ones, or obscuring the radical nature of the ecological claim.

  #### **Accommodation of Concrete Cases**
  This tree accommodates the case of the **professional coward/personal hero** primarily through **Branch 4 (Q5: Fragmentation and Unity)**. A respondent who affirms that the agent possesses courage in one domain but not the other must answer 'Yes' to Q5, directing them toward **Leaf 3 (Local Trait Theory)** or **Leaf 6 (Unoccupied)**, depending on their consistency commitments. This allows the seminar to classify the intuition without requiring the student to know the label "fragmentation" beforehand.
