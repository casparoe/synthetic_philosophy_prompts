      The pivot occurs when the act of correction shifts from signaling virtue to signaling disruption. Rules must make reputation visible but the valuation criteria opaque. Initially, tokens are awarded for rigorous correction. Mid-game, the facilitator silently shifts criteria: tokens are now awarded for "constructive consensus," making correction costly in social capital. This builds backward from the moment a defender realizes their integrity is now interpreted as aggression. The mechanics must hide the rule change so students attribute the shift to the group's mood, not the game master, mirroring how real honor codes collapse through social pressure rather than legislative change.

      *Drafting Section 2 (Setup):*
      Twelve students receive identical "Guild Member" cards. Materials: 60 poker chips (Reputation), 12 Scenario Cards (containing subtle logical errors), and a visible "Guild Status" board. Students sit in a circle. The facilitator acts as the Guild Master. Initial condition: The Guild is prestigious; reputation determines speaking order and final recognition. No private information exists; all value shifts are public actions by the Master. Students are assigned positions randomly to ensure no pre-existing alliances dictate the norm. The scenario cards describe professional dilemmas requiring a binary choice: Correct the Peer or Endorse the Peer.

      *Drafting Section 3 (Rules):*
      Play occurs in six rounds. Each round, a Scenario Card is read. Students secretly choose "Correct" or "Endorse" via hand signal. Simultaneously reveal. The Guild Master awards Reputation chips based on current Guild Values. Rounds 1–3: Correction earns 2 chips; Endorsement earns 0. Rounds 4–6: The Master silently switches valuation. Correction now earns 0 chips and imposes a "Friction" penalty on the group; Endorsement earns 2 chips. No announcement is made regarding the shift. Reputation is stacked visibly before each player. If a player corrects in late rounds, the Master visibly hesitates before awarding nothing, signaling social disapproval without verbalizing it.

