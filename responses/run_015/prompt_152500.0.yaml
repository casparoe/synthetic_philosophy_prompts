answer: |-
  The pivot occurs when the act of correction shifts from signaling virtue to signaling disruption. Rules must make reputation visible but the valuation criteria opaque. Initially, tokens are awarded for rigorous correction. Mid-game, the facilitator silently shifts criteria: tokens are now awarded for "constructive consensus," making correction costly in social capital. This builds backward from the moment a defender realizes their integrity is now interpreted as aggression. The mechanics must hide the rule change so students attribute the shift to the group's mood, not the game master, mirroring how real honor codes collapse through social pressure rather than legislative change.

  1. Design Logic
  The pivot occurs when the act of correction shifts from signaling virtue to signaling disruption. Rules must make reputation visible but the valuation criteria opaque. Initially, tokens are awarded for rigorous correction. Mid-game, the facilitator silently shifts criteria: tokens are now awarded for "constructive consensus," making correction costly in social capital. This builds backward from the moment a defender realizes their integrity is now interpreted as aggression. The mechanics must hide the rule change so students attribute the shift to the group's mood, not the game master, mirroring how real honor codes collapse through social pressure rather than legislative change.

  2. Setup and Roles
  Twelve students receive identical "Guild Member" cards. Materials: 60 poker chips (Reputation), 12 Scenario Cards (containing subtle logical errors), and a visible "Guild Status" board. Students sit in a circle to ensure eye contact. The facilitator acts as the Guild Master. Initial condition: The Guild is prestigious; reputation determines speaking order and final recognition. No private information exists; all value shifts are public actions by the Master. Students are assigned positions randomly to ensure no pre-existing alliances dictate the norm. The scenario cards describe professional dilemmas requiring a binary choice: Correct the Peer or Endorse the Peer. A whiteboard tracks total group reputation to emphasize collective stakes.

  3. Rules of Play
  Play occurs in six rounds. Each round, a Scenario Card is read. Students secretly choose "Correct" or "Endorse" via hand signal. Simultaneously reveal. The Guild Master awards Reputation chips based on current Guild Values. Rounds 1–3: Correction earns 2 chips; Endorsement earns 0. Rounds 4–6: The Master silently switches valuation. Correction now earns 0 chips and imposes a "Friction" penalty on the group; Endorsement earns 2 chips. No announcement is made regarding the shift. Reputation is stacked visibly before each player. If a player corrects in late rounds, the Master visibly hesitates before awarding nothing, signaling social disapproval without verbalizing it. Players may discuss strategies between rounds, but only using in-character language.

  4. Payoff and Stakes
  Rewards are purely status-based. The top three reputation holders receive "Senior Fellow" titles, granting them the right to summarize the debrief. The bottom three are labeled "Junior Associates," required to clean up materials. Mid-tier players remain "Members." This hierarchy mimics professional advancement. The stakes feel consequential because the titles dictate voice and authority in the final discussion, mirroring how honor codes regulate who is heard. Winning means securing the platform to interpret the game's events, ensuring the victors define the moral lesson.

  5. Debrief: Mapping Experience to Theory
  Begin by asking why behavior changed. Students will note the rule shift; reveal that the *arguments* for correction (truth, integrity) remained constant, but the *cost* changed. Introduce Williams and Appiah: moral revolutions often occur not because slavery or dueling was refuted logically, but because participating became shameful. Map Round 1 to the "Honor Economy" where correction bought status. Map Round 4 to the "Collapse" where the same act bought stigma. Highlight that students likely felt confused anger when corrected peers lost status despite being "right." This reproduces the phenomenology of moral change: the logic stays, the social price flips. Distinguish between argument (logic), interest (chips), and honor (status). Discuss where the simulation fails: real revolutions involve violence or economic ruin, not just chip counts. Ask students to identify which factor drove their shift: did they change minds or just wallets? Emphasize that in history, the "honor" shift usually precedes the legal change. The game isolates the social mechanism, stripping away the legislative outcome to focus on the psychological tipping point where integrity becomes eccentricity.

  6. Predictable Failures and Fixes
  Students may meta-game and announce the rule change early, ruining the tension. Fix: Instruct them that "out-of-character analysis" costs 5 reputation chips. They may also refuse to correct in Round 1 due to skepticism. Fix: The Guild Master must overtly praise early correctors to establish the baseline norm. If the shift is too subtle, students won't notice; if too obvious, it feels rigged. The Master must exaggerate hesitation in Round 4 to signal the social cost without breaking character. Silence from the Master is the primary tool to enforce the new norm without explanation.

  7. Limits of the Simulation
  This simulation cannot reproduce the physical danger or economic destitution accompanying real norm collapse. Duelists died; slaveholders lost capital. Here, the worst outcome is losing a title. Supply the gravity of real-world stakes through guided discussion, asking students to imagine if "Reputation Chips" represented their livelihood or physical safety. The exercise captures the psychological shift of honor, but not the material violence that often enforces or dismantles these codes.
