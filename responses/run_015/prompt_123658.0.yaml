  Dear Colleague,

  I am writing to propose a thought experiment designed to reverse the familiar Knobe-effect asymmetry in attributions of intentional action by situating the agents within a specific institutional context where role obligations mediate the link between outcome valence and intentionality. Consider two directors at a logistics firm who are both mandated by the board to implement a new cost-cutting routing algorithm that they know will alter delivery times for medical shipments to rural clinics. Director A knows the algorithm will delay these shipments, causing harm, but implements it while stating publicly that the delays are system outputs beyond his personal control, leading the board to classify the delays as unintentional side effects of his compliance. Director B knows the algorithm will expedite these shipments, causing help, and implements it while stating publicly that he is leveraging the system specifically to aid those clinics, leading the board to classify the expediting as an intentional side effect of his compliance. A normative-account theorist would argue that the usual link between harm and intentionality is broken here because intentionality attribution is mediated by the normative assessment of the agent's relationship to the outcome rather than the outcome's valence alone. In the harm case, the agent's deflection of responsibility onto the institutional mandate renders him blameless, and thus the harm is viewed as unintentional, whereas in the help case, the agent's appropriation of the outcome invites praise and agentic ownership, rendering the help intentional. A mental-state-account theorist, who takes intentionality to depend solely on beliefs, desires, and control, would likely predict uniformity across the two cases if focusing on the mandatory nature of the implementation, as both agents possess the same knowledge and behavioral control, but might accommodate the asymmetry if they treat the public statements as evidence of differing desires regarding the side effects. The precise feature driving the reversal is agentic appropriation versus institutional deflection, where the agent either claims the side effect as part of their personal plan or disowns it as a mechanical byproduct of their role. If this feature is removed while all other details are held constant, such that both agents issue the same deflection statement claiming the outcomes are beyond their control, the judgments would shift toward symmetry, with both side effects likely judged as unintentional. A defender of the normative account might attack this case as illegitimate by arguing that the reversal is merely an artifact of framing the agents' mental states differently through their public statements, thereby reintroducing a desire-based distinction that normative theories seek to supersede, or by claiming that the institutional mandate simply alters the blameworthiness baseline without truly reversing the deep structure of moral judgment. I would abandon the claim that agentic appropriation is genuinely responsible for the reversal if empirical observation showed that actual human judgments remain asymmetrical in the standard Knobe direction even when the harm-causing agent successfully deflects responsibility and the help-causing agent explicitly appropriates the outcome, or if theoretical analysis proved that the distinction between personal and institutional agency is psychologically inseparable from the valence of the outcome itself.

