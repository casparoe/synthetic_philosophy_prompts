answer: |-
  ### The Principles

  To accommodate your verdicts, specifically the separation of *Killability* (liability to defensive harm) from *At Fault* (moral culpability), and the asymmetry between sides, we require a hybrid framework. A single monolithic principle fails; we need two interacting principles: one for **Liability** and one for **Culpability**.

  **Principle 1: Asymmetric Functional Liability**
  A person is liable to be killed in war if and only if:
  1.  They are a functional member of an armed force engaged in an unjust war of aggression; **AND**
  2.  They perform a role that sustains the fighting capacity of that force or poses a direct threat; **UNLESS**
  3.  They hold a protected status conferred by international convention (e.g., medics, chaplains) or are civilians not integrated into the chain of command.

  **Principle 2: Voluntarist Culpability**
  A person is morally at fault for their participation in war if and only if:
  1.  Their contribution to the unjust harm was voluntary; **AND**
  2.  Their quality of will demonstrates indifference to or endorsement of the unjust harm, rather than mere compliance or professional duty.

  ---

  ### Clause Analysis

  **Principle 1, Clause 1 (Membership in Unjust Force):**
  *   **Forcing Case:** **Case 8 (Mercenary Just).** Without this clause, the mercenary would be killable by the aggressor because he poses a threat. This clause establishes that liability flows from the *justice of the cause*, not just the threat posed. It creates the asymmetry.
  *   **Without it:** The Moral Equality of Combatants would hold; the aggressor would be permitted to kill the defender, which contradicts your verdict.

  **Principle 1, Clause 2 (Functional Role/Threat):**
  *   **Forcing Case:** **Case 5 (Cook) vs. Case 6 (Welder).** This clause forces the distinction between being *in* the army (Cook) and *serving* the army (Welder). The Cook is killable because he is functionally integrated into the unit's sustenance; the Welder is not.
  *   **Without it:** The Welder (Case 6) would be killable because his causal contribution is higher and more voluntary than the Cook's. You reject this.

  **Principle 1, Clause 3 (Protected Status):**
  *   **Forcing Case:** **Case 10 (Medic).** Without this, the medic is killable under Clause 2 because he sustains fighting capacity (saving soldiers who return to fight).
  *   **Without it:** The convention-based immunity of medics collapses into pure functionalism, making the medic killable, which contradicts your verdict.

  **Principle 2, Clause 1 & 2 (Voluntariness and Quality of Will):**
  *   **Forcing Case:** **Case 2 (Volunteer) vs. Case 4 (Professional) vs. Case 3 (Conscript).** These clauses separate the *act* from the *agent*. The Conscript (Case 3) is not at fault because he lacks voluntariness. The Professional (Case 4) is less at fault than the Volunteer (Case 2) because his quality of will is constrained by professional ethics, despite higher contribution.
  *   **Without it:** Culpability would track causal contribution. The Professional (Case 4) would be more at fault than the Volunteer (Case 2), and the Conscript (Case 3) might be considered at fault for shooting.

  ---

  ### The Breakdown: Incompatibilities

  You asked for honesty regarding which verdicts the principle cannot accommodate or where the tension is highest.

  **1. The 5 and 6 Pair (Cook vs. Welder):**
  The principle *accommodates* the verdicts, but it exposes a moral cost you must accept. The principle relies on **Organizational Membership** as a proxy for liability.
  *   **The Tension:** The Cook (5) is less voluntary, less informed, and less causally efficacious than the Welder (6). Yet the Cook is killable and the Welder is not.
  *   **The Honest Truth:** No reasonably simple principle can hold these together without prioritizing **Status** over **Causation**. You are accepting that being wearing a uniform makes you liable even if a civilian doing more harm is immune. This is a pragmatic concession to the "fog of war" and the definition of combatancy, but it is not strictly *just* in a revisionist sense. The principle holds the verdicts, but it admits that the Cook is a "collateral liability" of his membership, not necessarily of his individual moral danger.

  **2. The 2 and 4 Pair (Volunteer vs. Professional):**
  The principle accommodates this easily by separating Liability from Culpability.
  *   **The Tension:** You feel less comfortable killing the Volunteer (2) than the Head of Government (1), even though the Volunteer is less at fault.
  *   **The Honest Truth:** The principle cannot explain your *discomfort*. It explains why you *may* kill him (Liability), but it does not explain the emotional/moral residue. That residue is likely the recognition that his Culpability is low enough that killing him feels like a tragedy, even if permissible. The principle treats this as epiphenomenal; it cannot codify "discomfort."

  **3. Case 8 (Mercenary Just):**
  The principle accommodates this by rejecting the Equality Thesis.
  *   **The Tension:** You want to mark something as "defective" in the mercenary but deny he is killable.
  *   **The Honest Truth:** The principle creates a gap. He is **Not Killable** (due to Just Cause) but **Not At Fault** (due to lack of endorsement of injustice). Your desire to mark him as "defective" has no place in the binary of Killable/Fault. He falls into a moral blind spot: permissible but ignoble. The principle leaves this unmarked.

  ---

  ### The Driving Consideration

  **What is doing the work?**
  *   **For Killability:** **Membership in an Organized Armed Group.** This is the primary driver. Threat is secondary (the sleeping soldier is still a member). Culpability is irrelevant (Case 3). Convention is a negative constraint (Case 10).
  *   **For Culpability:** **Quality of Will / Voluntariness.** This is the sole driver. Contribution is irrelevant (Case 4 vs 2).

  **Priority Rule:**
  When Membership (Killability) and Causation/Voluntariness (Culpability) conflict, **Membership trumps Causation for Killability.**
  *   *Example:* The Cook (Member, Low Causation) is killable; the Welder (Non-Member, High Causation) is not.
  *   *Is this principled?* It is **institutionally principled** but **individually arbitrary.** It is principled because it relies on a clear, observable boundary (uniform/chain of command) necessary for war to be regulated. It is arbitrary because it treats two causally similar agents differently based on a technicality of employment. It is a rule of *practice*, not pure *morality*.

  ---

  ### Application to New Cases

  Running the **Asymmetric Functional Liability** and **Voluntarist Culpability** principles:

  **1. Drone Operator (Just) kills Unjust Combatant (Asleep):**
  *   **Verdict:** **Killable.**
  *   **Reasoning:** The unjust combatant is a functional member of an unjust force (Principle 1, Clause 1). Sleep is temporary; the threat is continuous by virtue of status. The Operator is on the Just side.
  *   **Culpability:** The sleeping soldier is not at fault if he is a conscript (Case 3), but remains liable.

  **2. Fifteen-year-old Abducted Child Soldier (Aggressor, pointing rifle):**
  *   **Verdict:** **Killable.**
  *   **Reasoning:** Functional member of armed force posing direct threat (Principle 1, Clause 1 & 2). Protected status for children is often waived when they are direct participants.
  *   **Culpability:** **No.** Coercion negates voluntariness (Principle 2, Clause 1).
  *   **Note:** This matches Case 3 (Conscript). The tragedy is high, but liability holds.

  **3. Civilian Voter (Aggressor, economic vote):**
  *   **Verdict:** **Not Killable.**
  *   **Reasoning:** Not a functional member of the armed force (Principle 1, Clause 1). Civilian status protects despite indirect contribution.
  *   **Culpability:** **Low/No.** Voting for economic reasons lacks the quality of will endorsing aggression (Principle 2, Clause 2).

  **4. Shell Company Directors (Case 7 bosses, blind to war):**
  *   **Verdict:** **Not Killable.**
  *   **Reasoning:** Civilians not integrated into the chain of command (Principle 1, Clause 3).
  *   **Culpability:** **No.** Lack of knowledge negates quality of will (Principle 2, Clause 2).

  **5. Just Soldier who executes a prisoner:**
  *   **Verdict:** **Not Killable by Enemy Combatants.**
  *   **Reasoning:** He remains a functional member of the Just Armed Force (Principle 1, Clause 1). His war crime makes him culpable, but it does not strip his combatant immunity *vis-à-vis the enemy* under this principle.
  *   **Culpability:** **Yes.** High voluntariness and malicious quality of will.
  *   **Caveat:** He is liable to *punishment* by his own side. If he is in the act of executing (posing an immediate threat to the prisoner), he is killable to save the prisoner, but not as an enemy combatant.

  ---

  ### The Moral Equality of Combatants (MEC)

  **Status:** **Rejected.**
  On this account, the Equality Thesis is false. Combatants do not have the same standing.
  *   **What replaces it:** **Asymmetric Immunity.** Just combatants have a right to fight that Unjust combatants do not possess. Unjust combatants are liable to be killed; Just combatants are not (unless they commit war crimes that strip status).
  *   **What is lost:** We lose the simplicity of International Humanitarian Law (IHL), which treats both sides equally to encourage compliance. We gain moral accuracy but lose regulatory symmetry. It means the Unjust side is fighting a war they have no right to fight, and every shot they fire is morally distinct from a shot fired by the Just side.

  ---

  ### Case 9: Epistemic Sequestration and Residual Duty

  **Can the residual duty be made coherent?**
  Yes, but it must be grounded in **Necessity**, not **Culpability**.

  **The Grounding:**
  The duty to accept surrender and minimize killing is not owed *because* the sequestered conscript is innocent (Case 3 & 9 are both innocent). It is owed because **killing is a last resort.** When an enemy is *potentially* non-culpable (which all conscripts are, statistically), the Just side must maximize restraint. The "compounding injury" you describe is real: killing a non-culpable aggressor is a greater moral loss than killing a culpable one, because the former is a pure tragedy while the latter is a preventive justice.

  **Does it collapse due to unobservability?**
  **No, but it becomes general rather than specific.**
  You cannot have a rule: "Spare the sequestered, kill the believer." That is unactionable.
  You *can* have a rule: "Spare all who surrender, and do not kill if capture is possible."
  *   **The Fault:** The fault is in the assumption that the duty must be *discriminatory* to be valid. The duty is valid as a **general policy of restraint** imposed on the Just side. Because the Just side fights for a moral cause, it must bear the higher burden of risk to distinguish the sequestered from the convinced.
  *   **Conclusion:** The distinction does not need to be observable in the field for the duty to exist. The duty is to treat *all* aggressors as if they *might* be sequestered. If you kill a sequestered conscript because you couldn't tell, you have not violated the duty, provided you followed the general rules of restraint. The "compounding injury" is a retrospective moral truth, not a failure of the rule of engagement.
