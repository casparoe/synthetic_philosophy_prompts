answer: |-
  You have put your finger on one of the most persistent and theoretically messy problems in cultural evolution. You are describing a specific dynamic that sits at the intersection of evolutionary biology, sociology, and signaling theory.

  To answer your first question directly: **No, there is no single canonical term** in the standard cultural evolution lexicon (like "meme," "attractor," or "conformist bias") that captures the *entire* cycle you described (adoption $\rightarrow$ saturation $\rightarrow$ active disavowal $\rightarrow$ complexification).

  However, you are describing a specific configuration of three well-established concepts. If you want to write a paper on this, your job is to argue that these three concepts are usually treated separately, but in this specific context, they function as a single coupled system.

  Here is the breakdown of the concepts, where they fall short, the boundary cases, and the answer to your replicator question.

  ### 1. The Nearest Established Concepts (and Why They Fail Alone)

  You correctly identified that the standard tools feel slightly off. Here is why:

  **A. Negative Frequency-Dependent Selection (NFDS)**
  *   **What it is:** In biology, this is when a trait's fitness increases as it becomes rarer (e.g., a prey species evolving a rare color pattern so predators don't recognize it).
  *   **Where it fits:** It explains why the trait loses value once it crosses the threshold. Rarity *is* the fitness landscape.
  *   **Where it stops short:** NFDS explains why the *frequency* drops, but it doesn't explain why the *content* changes. In biology, if a color becomes common, the population might just switch to a different existing color. It doesn't necessarily explain why the new variant must be *harder to learn* or why the old users actively erase their history. NFDS is about prevalence, not complexity.

  **B. Costly Signaling Theory (The Handicap Principle)**
  *   **What it is:** Signals are only honest if they are costly to produce (e.g., a peacock's tail). If anyone can do it, it conveys no information.
  *   **Where it fits:** This explains your "load-bearing difficulty." The new variants are harder to pull off (weird grammar, specific context) to ensure that "poseurs" (late adopters) cannot easily copy them. The cost *is* the barrier to entry.
  *   **Where it stops short:** Costly signaling explains why the signal is hard, but not why the *old* signal is abandoned. A peacock doesn't look at its tail, see that other peacocks have similar tails, and decide to grow a wing instead. It just grows a bigger tail. Your example involves **signal abandonment**, not just signal escalation.

  **C. Subcultural Capital (Sociology)**
  *   **What it is:** Coined by Sarah Thornton (building on Bourdieu's *Distinction*). It's the knowledge and credentials that confer status within a specific group, distinct from "mainstream" culture.
  *   **Where it fits:** This explains the "active embarrassment" and the archive deletion. When the housing office uses the word, the subcultural capital is devalued to zero. To admit you used it is to admit you have no capital.
  *   **Where it stops short:** This is a sociological description, not an evolutionary mechanism. It describes the *status* outcome, but not the *transmission* dynamics. It doesn't explain the mutation rate or why the new variants emerge so quickly.

  ### 2. The Synthesis: What to Call It

  If you need a label for your paper, the most precise technical description is:
  **"Frequency-Dependent Signal Inflation on Identity Markers."**

  However, in the literature, this is often discussed under the umbrella of **The Cycle of Distinction** (referencing Georg Simmel's 1904 "Trickle-Down" theory of fashion, updated for evolutionary dynamics).

  The specific mechanism you are noticing—where the content mutates to become *more difficult* specifically to exclude the masses—is a **Signaling Arms Race**.

  **The Phenomenon Defined:**
  This occurs when a cultural trait functions primarily as a **group boundary marker** rather than a functional tool. When the boundary is breached (mainstream adoption), the trait's fitness collapses. The population does not just drift to a new trait; it actively selects for variants with **higher transmission costs** to re-establish the boundary. The "replicator" is not the word/scarf; it is the **exclusionary relationship** itself.

  ### 3. Boundary Cases (What Doesn't Count)

  To make your argument tight, you need to exclude things that look similar but operate on different mechanics.

  *   **Functional Obsolescence (Doesn't Count):**
      *   *Example:* People stop using VHS tapes for DVDs.
      *   *Why:* The old trait is abandoned because it is *worse*, not because it is *common*. The new trait doesn't need to be harder to use; it needs to be better. In your phenomenon, the old word still "works" linguistically; it is socially toxic.
  *   **Accidental Rarity (Doesn't Count):**
      *   *Example:* A hiking trail is empty because it is incredibly far away.
      *   *Why:* The rarity is a byproduct of geography, not a selected feature. People don't make the trail *further* to keep people away. In your phenomenon, the difficulty is *engineered* (weird grammar) to maintain rarity.
  *   **Sincere Late Adoption (Doesn't Count):**
      *   *Example:* Someone who genuinely likes the pop version of the song and doesn't care about the indie origin.
      *   *Why:* These individuals are not participating in the signaling arms race. They are "frequency-independent" consumers. Your phenomenon relies on the users being sensitive to the frequency.
  *   **Drift / Fashion Cycles (Doesn't Count):**
      *   *Example:* Skirt lengths go up and down over decades.
      *   *Why:* This is often random walk or pendulum swinging. Your phenomenon is directional (toward higher complexity/cost) and reactive (triggered specifically by mainstream breach).

  ### 4. The Big Question: Does This Break the Replicator Framing?

  This is the strongest part of your potential paper.

  **Standard Replicator View:**
  A meme is a unit of information that copies itself with high fidelity. Fitness is usually intrinsic (the idea is catchy, useful, or true).

  **Your Phenomenon:**
  Here, fitness is **extrinsic and relational**. The "word" has negative fitness if it is common. The content is partially defined by what it is *not* ("not the housing office word").

  **Does it break the framing?**
  It doesn't break it, but it forces a shift in the **Unit of Selection**.

  If you define the replicator as *the specific word*, the model fails. The word dies. It has low fidelity (it mutates immediately) and low longevity.
  However, if you define the replicator as **the strategy of exclusivity**, the model holds perfectly.

  *   **Replicator:** The strategy "Use a marker that distinguishes us from them."
  *   **Vehicle:** The specific word/scarf/meme format.
  *   **Mechanism:** When the vehicle becomes compromised (too common), the strategy selects for a new vehicle with higher transmission barriers.

  This aligns with **David Hull's** distinction between **Replicators** (the information) and **Interactors** (the entities that interact with the environment). In this case, the *social group* is the interactor, and the *boundary mechanism* is the replicator. The specific content is just ephemeral hardware.

  **Theoretical Implication:**
  This suggests that in cultural evolution, **fidelity is sometimes selected *against*.** High fidelity (everyone saying the word exactly the same way) leads to the death of the meme. Successful replication in this niche requires **controlled infidelity** (mutation) to maintain the "rare" status.

  This challenges the Dawkins-style view that memes *want* to spread as widely as possible. Some memes (parasitic on social status) *need* to limit their own spread to survive. They are **self-limiting replicators**.

  ### 5. Recommendation for Your Paper

  If I were writing this, I would structure it as follows:

  1.  **Identify the Gap:** Cultural evolution focuses heavily on *conformist bias* (copying the majority). This paper focuses on **anti-conformist bias** driven by **identity signaling**.
  2.  **The Mechanism:** Argue that this is **Negative Frequency-Dependent Selection** acting on **Costly Signals**.
  3.  **The Evidence:** Use your housing office example. The "death" of the word wasn't boredom; it was **devaluation of capital**. The "mutation" wasn't drift; it was **barrier escalation**.
  4.  **The Theoretical Hook:** Propose that the unit of replication here is not the content, but the **social boundary**. This explains why the content must change (to rebuild the wall) while the function remains the same (to keep people out).
  5.  **Conclusion:** This implies that cultural evolution isn't just about the spread of ideas, but about the **evolution of access**. Some cultural traits evolve specifically to *resist* transmission.

  **Search Terms for Your Lit Review:**
  *   "Negative frequency-dependent selection cultural evolution"
  *   "Costly signaling theory cultural transmission"
  *   "Sarah Thornton Subcultural Capital"
  *   "Georg Simmel Fashion Trickle-Down" (as the historical precursor)
  *   "Optimal Distinctiveness Theory"
  *   "Signal Inflation cultural evolution"

  You have a very strong observation. The fact that the variants get *harder* is the key. That is the smoking gun that this is about **exclusion**, not just expression.
