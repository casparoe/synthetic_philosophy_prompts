      *   *Defeat as Cautionary Tale (Moral Exemplarity):* The defeat serves as a warning. It highlights errors in judgment, moral failings, or strategic blunders. It imposes constraints: "Never again." (e.g., Confederacy as a warning against treason/slavery, though historically it was often flipped into solidarity; Dunkirk as a warning against appeasement?).
