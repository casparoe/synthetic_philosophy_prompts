answer: |-
  I discarded a pure string-rewriting game because it collapses the agent/system distinction students need to feel; I discarded a centralized factory model because it removes the distributed pressure that makes the noise phase meaningful.

  Participants will see that self-replication requires separating the "instruction" from the "object" because a system cannot operate on its own definition without an intermediate copy.

  ### Rules
  | Component | Specification |
  | :--- | :--- |
  | **Strand** | Paper strip; first 4 bases = **Header** (enzyme code), rest = **Data**. |
  | **Translation** | Header maps to Enzyme Card (e.g., AA=Copy, AC=Cut). |
  | **Quarantine** | Enzyme from Strand A **cannot** target Strand A. Must target a different strip (Blank or Opponent). |
  | **Replication** | 'Copy' Enzyme duplicates the *Source* Header+Data onto the *Target* Blank. |
  | **Noise** | For every 4 bases in a *new* strand, roll 1 die. On 6, flip one random base in that new strand. |

  ### Timeline (90 Minutes)
  *   **0-15: Setup.** Teams receive 1 Strand (e.g., `AAAC....`) + 5 Blanks. Explain rules strictly; no "why".
  *   **15-45: Open Play.** Teams translate Headers, apply Enzymes to Blanks. Goal: Maximize strand count. Quarantine blocks direct self-copying; they must swap strands or use Blanks as substrate.
  *   **45-60: Discovery.** Teams realize identical strands are needed: one acts as Instruction, one as Data. First successful replication occurs.
  *   **60-75: Noise Phase.** I roll for every new copy. Score = surviving lineage size. Long strands mutate more; short strands risk missing enzyme codes.
  *   **75-90: Debrief.** Collect data, map failures to concepts.

  ### Debrief Mapping
  | Moment | Concept |
  | :--- | :--- |
  | Failed direct copy attempt | A system cannot act on itself (Quarantine). |
  | Using a Blank as substrate | Data must be separate from Instruction. |
  | Lineage death via Noise | Complexity increases error risk (Error Threshold). |
  | Minimal viable strand | Information density vs. robustness trade-off. |

  ### Failure Modes
  1.  **Hand-Copying:** Students ignore Enzymes and manually copy strips. *Fix:* Enforce "No pen on strip" during action phase; only Enzyme Cards allow modification.
  2.  **Speedrun:** One team finishes in 4 minutes. *Fix:* Require "Verification Step" where another team checks the Header match before counting score.
  3.  **Degenerate Loop:** Team creates a 4-base strand that copies anything. *Fix:* Minimum strand length = 8 bases (4 header + 4 data) to ensure Data exists.

  ### Honest Limits
  This activity models von Neumann kinematics, not logical self-reference. Students may conflate "physical copying" with "logical truth." You must explicitly state in the debrief that biological replication is causal, while Gödelian self-reference is logical; the isomorphism is in the *structure* of indirection (X refers to X via a description), not the mechanism. Do not let them leave thinking DNA "knows" anything; the "knowledge" is in the causal structure enforced by the Quarantine rule. The noise phase illustrates error thresholds, not incompleteness; a bright student might walk out thinking mutation proves inconsistency, rather than fragility. You must supply the link between "breaking the machine" and "unprovable statements" verbally; the cards only show that self-description requires a split between code and data.
