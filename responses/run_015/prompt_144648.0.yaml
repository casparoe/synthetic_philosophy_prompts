answer: |-
  ### Brainstorming and Design Strategy

  The single crux separating a candidate who understands heritability from one who has merely memorised the warnings is the distinction between *parameter stability* and *causal structure*. The memoriser knows that heritability ($H^2$) is a population statistic. The understander knows that $H^2$ is a parameter of a specific causal model (typically $V_P = V_G + V_E$) that ceases to describe the system once the intervention changes the causal structure itself. The recitable answer lists the four standard warnings: it is population-specific, it is a ratio of variances, environmental change can shift means, and within-group $H^2$ does not explain between-group differences. A candidate can recite these while still believing that a high $H^2$ implies genetic fixity or that $H^2$ predicts response to novel environments.

  My question blocks this recitation by forcing the candidate to confront data where the standard warnings are insufficient without a structural analysis. Specifically, the Deveron station data introduces gene-environment correlation ($r_{GE}$), which violates the additive assumption underlying the standard definition. A candidate relying on slogans cannot explain why $H^2$ is undefined there without invoking the model-dependence of the variance decomposition. Similarly, the Carrow station data requires explaining why a change in rank order implies the 'trait' itself is not stable across environments, challenging the notion of a single heritability for a trait. The question demands they construct the logic of the variance decomposition rather than merely asserting its limitations.

  ***

  ### 1. Examination Question

  **Option: Causation, Variation and Explanation in the Life Sciences**
  **Time Allowed: 1 Hour**
  **Answer ONE question.**

  **Question 1**

  Consider the following data from five agricultural research stations trials using the same crop species. All measurements are of stem length at maturity.

  *   **Ardmore:** A single clonal line planted on a field with a marked soil gradient. Genetic variance ($V_G$) is negligible; environmental variance ($V_E$) is large. Mean stem length: 95 cm. Broad-sense heritability ($H^2$) $\approx 0$.
  *   **Bexley:** A genetically heterogeneous seed lot planted on a field levelled and fertilised to uniformity. $V_G$ is large; $V_E$ is negligible by design. Mean stem length: 140 cm. $H^2 \approx 1$.
  *   **Transplant Evidence:** Swapping plants between the Ardmore and Bexley soils moves each group's mean by the full 45 cm difference. The entire between-station difference is soil-driven.
  *   **Carrow:** The same seed lot as Bexley, on uniform soil of intermediate quality. Mean: 120 cm. However, the best-performing genetic lines at Carrow are not the best-performing lines at Bexley, and the observed genetic variance is smaller. $H^2$ is lower than at Bexley.
  *   **Deveron:** A separate trial where seed lot quality and soil quality are both determined by whichever nursery supplied the plot. Better genotypes sit systematically in richer micro-plots. Nothing in the measurements settles whether the resulting covariance should be counted as genetic, environmental, or neither.

  (a) Using the Ardmore and Bexley data, explain how a trait can be maximally heritable within a population yet have its mean shifted arbitrarily far by environmental change. Why does the successful equalisation of the environment at Bexley result in a higher heritability estimate than at Ardmore? (5 marks)

  (b) The Transplant Evidence shows the between-station mean difference is environmental, despite $H^2 \approx 1$ within Bexley. Explain logically why the decomposition of variance *within* groups tells you nothing about the cause of the difference *between* groups. (5 marks)

  (c) At Carrow, the ranking of genetic lines changes relative to Bexley. What does this imply about the heritability of the 'response to environment' compared to the heritability of stem length itself? Why does this make the question 'how genetic is stem length?' ill-formed without specifying the regime? (5 marks)

  (d) At Deveron, genotypes and environments are correlated. Explain why the standard definition of heritability is underdetermined by the data here. What additional assumption is required to produce an estimate, and why does this make heritability model-relative rather than a fact fixed by measurement alone? (5 marks)

  ***

  ### 2. Model Answer

  Heritability is defined as the proportion of phenotypic variance ($V_P$) attributable to genetic variance ($V_G$) within a specific population and environment. Crucially, $V_P$ is the sum of genetic variance, environmental variance, and their interaction or covariance. The data provided illustrates that $H^2$ is not a measure of genetic fixity, but a statistic describing the structure of variation in a specific context.

  At Ardmore, the population is clonal, so $V_G$ is effectively zero. All variation arises from the soil gradient ($V_E$), yielding $H^2 \approx 0$. At Bexley, the environment is uniform, so $V_E$ is minimised. All variation arises from genetic differences, yielding $H^2 \approx 1$. This contrast demonstrates the variance-versus-mean gap. Heritability concerns the *spread* of values around the mean, not the mean itself. The Transplant Evidence confirms this: moving Bexley plants to Ardmore soil shifts the mean by 45 cm, proving the mean is highly environmentally sensitive. The high $H^2$ at Bexley exists precisely because the environment was equalised; by suppressing $V_E$, the ratio $V_G / (V_G + V_E)$ approaches unity. Thus, a high heritability estimate can be evidence of environmental uniformity rather than genetic determinism. If we equalised environments across a population, $H^2$ would rise even if the trait remained fully plastic.

  This leads to the distinction between within-group and between-group variance. At Bexley, 100% of the variation *between individuals* is genetic. However, the difference *between the stations* (95 cm vs 140 cm) is entirely environmental. This is logically independent because the within-group decomposition partitions deviations from the local mean, whereas the between-group difference is a difference of the means themselves. A high within-group $H^2$ only tells us that, holding the environment constant, genes explain who is taller than whom. It does not tell us what caused the average height to change when the environment changed. To settle the cause of the between-group difference, one must manipulate the environment (as in the transplant), not measure variance within the groups. The data shows that even with maximal within-group heritability, the between-group gap can be 100% environmental.

  The Carrow station data complicates this further by introducing Genotype-by-Environment interaction (GxE). The ranking of lines changes between Bexley and Carrow; the best genotypes in one environment are not the best in the other. This implies that the 'trait' measured at Bexley is not genetically identical to the 'trait' measured at Carrow. Consequently, the heritability of the *response* to the environment (the slope of the reaction norm) is a distinct trait from the heritability of stem length at a specific site. It is possible for stem length to have low heritability (due to high $V_E$) while the response to environment has high heritability (if individuals differ consistently in their plasticity). Conversely, as seen here, high heritability at one site does not predict performance at another. Therefore, asking 'how genetic is stem length?' is ill-formed. One must ask 'how genetic is stem length, in which population, under which environmental regime, and with respect to which contrast?' Without specifying the regime, the quantity has no stable referent.

  Finally, the Deveron station presents a case of gene-environment correlation ($r_{GE}$). Here, better genotypes are systematically placed in richer soil. The standard decomposition assumes $V_P = V_G + V_E$, implying independence. However, when correlated, $V_P = V_G + V_E + 2Cov(G,E)$. The data alone cannot distinguish whether the covariance should be attributed to genetic effects (because genes sought the soil) or environmental effects (because the soil allocation determined the genotype survival). To calculate $H^2$, one must assume a causal model: either we treat the covariance as genetic (inflating $H^2$) or environmental (deflating $H^2$). Since the measurements do not fix this choice, heritability is underdetermined by the data. It is model-relative. This confirms that heritability is not a raw fact extracted from nature, but a parameter derived from a specific causal assumption about how genes and environments combine. Without that assumption, the variance components are inseparable.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks**
  **Pass Mark: 10**

  **1. Variance vs. Mean (Ardmore/Bexley) – 4 Marks**
  *   **Must hit:** Explanation that $H^2$ is a ratio of variances ($V_G/V_P$), not a measure of the mean's sensitivity. Must note that suppressing $V_E$ (Bexley) artificially inflates $H^2$ without changing genetic causality.
  *   **Typical Error:** Claiming high $H^2$ means the trait is 'genetically determined' or immutable.
  *   **Partial Credit:** 2 marks for defining $H^2$ correctly but failing to link environmental uniformity to the high estimate.

  **2. Within vs. Between (Transplant) – 4 Marks**
  *   **Must hit:** Explicit statement that within-group variance partitions deviations from the local mean, while between-group difference is a shift of the means. Must cite the transplant evidence as the only way to resolve the between-group cause.
  *   **Typical Error:** Arguing that high within-group $H^2$ makes a between-group genetic difference 'likely' or 'probable'.
  *   **Partial Credit:** 2 marks for stating the distinction without referencing the transplant logic.

  **3. GxE and Trait Identity (Carrow) – 4 Marks**
  *   **Must hit:** Recognition that changing rank orders implies the genetic basis of the trait changes across environments. Must identify that 'response to environment' is a separate heritable trait.
  *   **Typical Error:** Treating the trait as stable and attributing the change solely to 'noise' or measurement error.
  *   **Partial Credit:** 2 marks for noting GxE exists but failing to discuss the heritability of the response.

  **4. Underdetermination (Deveron) – 4 Marks**
  *   **Must hit:** Identification of $Cov(G,E)$ and the violation of the additivity assumption. Must state that attributing the covariance requires an extra-model assumption.
  *   **Typical Error:** Attempting to calculate $H^2$ using standard formulas or claiming the data is 'insufficient' without explaining the structural ambiguity.
  *   **Partial Credit:** 2 marks for identifying the correlation but not explaining the model-dependence.

  **5. Synthesis/Intervention – 4 Marks**
  *   **Must hit:** Conclusion that $H^2$ predicts nothing about novel interventions (regimes) because the causal structure changes. Heritability is a parameter of a model, not a property of the trait.
  *   **Typical Error:** Concluding that heritability is 'useless' rather than 'context-specific'.
  *   **Partial Credit:** 2 marks for a general summary without linking back to the intervention regime.

  **Candidate missing exactly one point:** Award 16/20 (High First).

  ***

  ### 4. Borderline Note: First-Class vs. Upper-Second

  The upper-second candidate will successfully recite the four standard warnings (population-specific, not individual, etc.) and apply them correctly to Ardmore and Bexley. They will secure marks in parts (a) and (b) by noting that $H^2$ varies with $V_E$ and that within-group stats don't explain between-group means. The first-class candidate distinguishes themselves in parts (c) and (d). They will not merely note that Carrow shows interaction, but will argue that the *trait identity* is unstable across regimes, making the heritability of the *response* the relevant quantity. Crucially, at Deveron, the upper-second candidate will say the estimate is 'biased'; the first-class candidate will argue it is *underdetermined* because the variance decomposition presupposes a causal structure (independence) that the data violates. The single additional move is shifting from 'bias' (statistical error) to 'model-relativity' (philosophical structure).

  ***

  ### 5. Note on Cruxes and Framing

  I have retained all five of your proposed cruxes, but I suggest that cruxes (i) 'Indexicality/Intervention' and (ii) 'Variance-versus-Mean' are effectively two sides of the same coin. In the question, I have merged them into Part (a). The reasoning is that the variance-versus-mean gap is the *mechanism* by which indexicality operates; separating them risks redundancy in a one-hour paper. I have elevated crux (v) 'Underdetermination' (Deveron) to equal weight with the standard warnings. This is often neglected in teaching; candidates often treat $r_{GE}$ as a statistical nuisance rather than a philosophical challenge to the definition of $V_G$. Regarding the numbers: I kept your means (95, 140, 120) as they clearly illustrate the environmental shift. I altered the description of Carrow slightly to emphasise the *ranking change* rather than just 'lower variance', as crossing reaction norms are the strongest evidence for the instability of trait identity. The Deveron scenario is technically sound: positive $r_{GE}$ inflates $V_P$, and without knowing the causal direction of the correlation, $V_G$ cannot be isolated. This framing ensures the question remains solvable from first principles without requiring complex covariance algebra.
