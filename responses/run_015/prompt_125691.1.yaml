          *   *Decision:*
              1.  Distinction: FAD vs. Entitlement Failure.
              2.  Case Order: Bengal (Primary Anchor), Ireland (Secondary support), GLF (Tertiary/Complication).
              3.  *Correction:* The prompt asks to identify *one* carrying example to anchor the session. I need to choose the best one for *teaching the concept*, not necessarily the most historically significant. Bengal is Sen's own primary focus. It allows for the clearest separation of wage/inflation from harvest.

  4.  **Step 2: Carrying Example & The Archipelago:**
      *   *Carrying Example:* Bengal 1943.
      *   *Feature:* The rural laborer's wage vs. rice price inflation. This shows entitlement collapse without harvest collapse.
      *   *Complexity to Strip:* The war context (Japanese occupation of Burma, military procurement). If students focus on "war caused it," they miss the economic mechanism.
      *   *The Archipelago (Hypothetical):* Needs two islands. Same harvest. One starves, one doesn't. Why? Change in labor entitlement.
      *   *Drafting Archipelago:* Island A & B. Both grow 100 tons. Island A: Laborers paid in rice. Island B: Laborers paid in cash. Shock: Rice price doubles. Island A eats. Island B starves. (Wait, need to ensure aggregate availability is constant).
