answer: |-
  # Teaching Plan: Sen's Entitlement Approach to Famine (50 Minutes)

  ## I. Dependency Order and Case Sequence

  **Conceptual Dependency:**
  The distinction between **Food Availability Decline (FAD)** and **Entitlement Failure** must be secured before introducing specific entitlement types (direct, trade, labor).
  *   *Justification:* If students retain the intuition that famine implies a physical absence of food, any discussion of labor wages or trade rights will be interpreted as secondary symptoms rather than primary causes. The FAD/Entitlement binary is the gateway; without it, the mechanism of access cannot be understood.

  **Historical Case Sequence:**
  1.  **Bengal (1943):** *First.*
      *   *Justification:* This is Sen's primary empirical anchor. It offers the clearest separation between harvest data (which remained stable) and starvation data (which spiked), allowing for the cleanest initial illustration of wage-price inflation destroying entitlements.
  2.  **Irish Famine (1845–49):** *Second.*
      *   *Justification:* Use this to reinforce the "distribution" argument via the mechanism of *export*. It challenges the "natural disaster" intuition (the Blight) by showing food leaving the region, but it is placed second because the colonial policy element can distract from the pure economic entitlement mechanism if introduced too early.
  3.  **Great Leap Forward (1958–62):** *Last.*
      *   *Justification:* This is the most politically charged case. Placing it last prevents students from reducing Sen's theory to "bad governments cause famine." It serves as a stress test for whether entitlement analysis holds in non-market, state-allocated economies.

  ## II. The Carrying Example and The Archipelago

  **The Carrying Example: Bengal 1943**
  *   **Anchor Feature:** The divergence between **rice production** (stable/slightly up) and **rural laborer wages** (collapsed relative to price). This illustrates that the *command over food* vanished, not the food itself.
  *   **Complexity to Strip:** **War-time military procurement and the Japanese occupation of Burma.**
      *   *Reason:* If students focus on the war, they will attribute the famine to "supply chain disruption" (a FAD-adjacent view) or "enemy action." To teach Sen, you must isolate the *internal economic mapping* of wages to rice, treating the war context as background noise rather than the causal engine.

  **The Minimal Hypothetical: The Archipelago Case**
  *   **Scenario:** Two islands, North and South, share identical weather and harvest 1,000 tons of grain each.
      *   **North:** All farmers own their land (Direct Entitlement).
      *   **South:** All farmers are landless laborers paid in cash wages (Trade/Labor Entitlement).
      *   **Shock:** A speculative bubble doubles the price of grain on both islands.
      *   **Outcome:** North eats (they grow the grain). South starves (their wages buy half as much grain).
  *   **Isolation of Logic:** This removes **colonialism, war, ideology, and transport logistics.** It forces students to see that starvation occurred solely because the *social rule* mapping labor to food (the wage rate) failed, despite aggregate availability remaining constant across the archipelago.

  ## III. Misconception Map

  | Order of Formation | Misconception | Interception Point | One-Sentence Correction/Reframing |
  | :--- | :--- | :--- | :--- |
  | **1. Pre-Theory** | "Famine implies an absolute shortage of food in the region." | **Minute 5** (Immediately after defining FAD vs. Entitlement). | "Famine is not about how much food exists in the granary, but who holds the legal and economic key to open it." |
  | **2. Post-Bengal** | "Sen's view eliminates natural causes entirely; weather never matters." | **Minute 20** (After analyzing Bengal harvest data). | "Entitlement failure explains the *starvation*, even if a drought triggered the *price shock* that broke the entitlement." |
  | **3. Pre-GLF** | "The Great Leap Forward is the 'purest' case because it proves famine is just state policy." | **Minute 35** (Before introducing the GLF case). | "Policy is the context, but entitlement is the mechanism; even a benevolent state can preside over famine if allocation rights collapse." |
  | **4. Post-Session** | "Entitlement analysis only applies to capitalist market economies." | **Minute 40** (During GLF discussion). | "Entitlements exist wherever there are rules of access, including state rationing systems where labor is exchanged for food coupons." |

  ## IV. Final Check (Written Assessment)

  **The Question:**
  > "In a democratic nation with a free press, a specific occupational group starves during a period of national food surplus because their skills become obsolete due to automation. Using Sen's terminology, identify the specific type of entitlement failure occurring here, and explain why the government's democratic status does not automatically prevent this outcome."

  **Grading Criterion:**
  *   **Slogan Adoption:** Answers focusing on "the government chose not to help" or "politics failed."
  *   **Conceptual Grasp:** Answers identifying the breakdown of **trade entitlement** (labor no longer exchanges for food) and noting that democracy protects *political rights* but does not guarantee *economic entitlements* without specific social protection.

  ## V. Explicit Omissions

  To maintain conceptual clarity within fifty minutes, the following must be acknowledged as omitted and excluded from discussion:
  1.  **Formal Modeling:** The mathematical notation of Exchange Entitlement Mappings (E-mappings) found in *Poverty and Famines*.
  2.  **Demographic Debates:** Specific excess mortality statistics or historiographical disputes regarding death tolls in the three cases (e.g., Ó Gráda's critiques).
  3.  **The "Democratic Prevention" Thesis:** Sen's later argument in *Development as Freedom* that democracies prevent famines; this session focuses strictly on the *causal mechanism* of famine, not the *political prevention* of it.
  4.  **Bibliographic Detail:** No discussion of Sen's data sources or the subsequent archival discoveries regarding Bengal and the GLF.
