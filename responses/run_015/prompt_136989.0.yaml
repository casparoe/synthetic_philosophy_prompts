          *   *Nuance:* Does "craving" count as suffering? Yes, usually defined as a state of lack. If the drug removes the *suffering* of not getting it but leaves the *desire*, is that enough? Strict tranquilism says the desire *is* the disturbance.
          *   *Verdict:* Not an improvement (or less of one). The craving state persists.

      *   *Refining the Verdict:*
