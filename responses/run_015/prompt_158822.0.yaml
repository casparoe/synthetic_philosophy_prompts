      5. Conclusion on Irrationality.

      *Word Count Check:* A standard page is ~500 words single spaced. I need to be concise.

      *Refining the "Irrationality" point:* The "rationality of irrationality" is specifically Schelling's term for Mechanism 1. Mechanism 2 is more about "binding hands" (precommitment). The framing fits #1 better than #2.

      *Final check on American English:* "Defense" not "defence", "program" not "programme", etc. (Though mostly relevant to spelling). Idioms should be US-standard.

