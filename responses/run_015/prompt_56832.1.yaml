prompt: |-
  I'm a junior and I sit on my school's peer mediation board — six of us students plus one teacher who signs off on whatever we agree to. We get two or three cases a month: someone cheated and got a friend to lie for them, a screenshot from a group chat, a team doing some humiliating thing to a freshman. We're supposed to get a real apology out of the person instead of just a punishment, and we get maybe 40 minutes in a room with everybody.

  Our advisor says we keep accidentally making people feel ashamed instead of guilty, and that those are two totally different moral emotions — guilt is about what you did, shame is about you as a person, shame makes you hide or lash out, guilt makes you try to fix it. But she also says some philosophers think shame is the deeper one because its tied to who you want to be, so its not even obvious which of the two we should be aiming at. She won't tell us how to steer it.

  Can you write us a procedure we can reuse every time: what to work out before the session, what to say and not say in it, how to read from the person's reactions which of the two emotions is actually showing up, and the point where we should stop and hand it to an adult because it isn't ours to decide. Then run it on two cases — the cheating one and the team hazing one — and don't soften it if one comes out an answer we're going to hate. Mark which steps are just judgment dressed up as a checklist. And separately: can a school actually decide as a policy to run on guilt instead of shame, or is that not something a culture gets to choose?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior high/high school student on a peer mediation board (6 students + 1 teacher advisor).
      *   **Context:** 2-3 cases/month (cheating, social media drama, hazing). Goal: Real apology/restoration, not just punishment. Time limit: ~40 mins.
      *   **Problem:** Advisor says they induce *shame* (bad for repair) instead of *guilt* (good for repair), but notes philosophical debate on shame's value. Advisor won't give a direct method.
      *   **Task:**
          1.  Create a reusable procedure (pre-session, during session, reading emotions, escalation/hand-off).
          2.  Apply the procedure to two specific cases (cheating/lying, team hazing).
          3.  Be honest/harsh if the outcome is unpleasant (don't soften).
          4.  Identify which steps are "judgment dressed up as a checklist."
          5.  Answer the philosophical/policy question: Can a school *choose* guilt over shame as policy, or is that cultural?

  2.  **Deconstruct the Core Concepts (Guilt vs. Shame):**
      *   *Guilt:* "I did something bad." Focus on behavior. Leads to reparative action.
      *   *Shame:* "I am bad." Focus on self. Leads to withdrawal, aggression, or hiding.
      *   *The Advisor's Twist:* Some philosophers (e.g., Nussbaum, Williams) argue shame protects social bonds and identity ideals. However, in a *mediation* context aimed at restoration, guilt is generally more functional.
      *   *The Constraint:* 40 minutes is very short for deep psychological work.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Pre-Session:* Need facts, need separation, need safety check.
      *   *During Session:* Structure is key. Opening -> Story -> Impact -> Repair -> Closing.
      *   *Language:* "I" statements, focus on actions, avoid labels.
      *   *Reading Emotions:* Look for body language, defensiveness vs. engagement.
      *   *Hand-off:* When safety is at risk, when power dynamics are too skewed, when emotions explode.
      *   *Meta-Commentary:* I need to explicitly flag where "judgment" is hiding in the checklist (as requested).

  4.  **Applying to Case 1: Cheating + Lying Friend:**
      *   *Dynamics:* Two offenders (cheater, liar). One victim (teacher/system/trust).
      *   *Goal:* Acknowledge breach of trust.
      *   *Risk:* Shame spiral ("I'm a cheater").
      *   *Outcome:* Might require admitting fault publicly or losing privileges, which feels like shame but is consequence. Need to distinguish.

  5.  **Applying to Case 2: Team Hazing:**
      *   *Dynamics:* Group vs. Individual. Power imbalance.
      *   *Risk:* High. This is often abuse, not just conflict.
      *   *Outcome:* This might be a "hand-off" case. Peer mediation might be inappropriate for hazing. I need to be honest here. If the procedure says "mediate," but the reality is "this is abuse," I must call that out.
      *   *Hard Truth:* Hazing often requires punishment, not just apology. Mediation might re-traumatize the freshman.

  6.  **Addressing the "Judgment dressed as Checklist" Requirement:**
      *   I need to explicitly point out where the procedure assumes values (e.g., defining what counts as "harm," deciding when a power imbalance is too great).

  7.  **Addressing the Policy Question (Guilt vs. Shame Culture):**
      *   Can a school *choose*?
      *   Short answer: No, not entirely. Culture is emergent.
      *   Nuance: You can incentivize guilt-focused language, but social dynamics (status, reputation) drive shame automatically.
      *   Reference: Ruth Benedict (Shame/Guilt cultures), but note that modern psych sees them as co-existing.

  8.  **Refining the Tone:**
      *   Respectful of the student's role (they are doing serious work).
      *   Direct and unvarnished (as requested: "don't soften it").
      *   Philosophical but practical.

  9.  **Step-by-Step Drafting (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the difficulty.
      *   *Protocol:* Break it down.
      *   *Flags:* Insert the "Judgment Alert" boxes.
      *   *Case Studies:* Run the protocol.
      *   *Case 1 (Cheating):* Doable.
      *   *Case 2 (Hazing):* Likely a fail for mediation. Be honest.
      *   *Policy Question:* Deep dive.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is 40 minutes enough?
      *   *Fix:* Acknowledge time pressure in the protocol.
      *   *Critique:* Is hazing appropriate for peers?
      *   *Fix:* Strongly suggest adult intervention for hazing. The prompt asks me to run the procedure on it, but also says "point where we should stop and hand it to an adult." I will use the procedure to demonstrate *why* it should be handed off.
      *   *Critique:* Did I mark the judgment steps?
      *   *Fix:* Make sure they are visually distinct.
      *   *Critique:* Did I answer the policy question?
      *   *Fix:* Ensure the final section addresses the cultural impossibility/possibility.

  11. **Final Polish:** Check against the "don't soften it" instruction. If the hazing case ends with "you guys shouldn't be handling this," say that clearly. If the cheating case ends with "the apology won't matter," say that.

      *(Self-Correction on the Hazing Case)*: The prompt asks me to run the procedure on the cases. If the procedure dictates a hand-off, then the result of running the procedure *is* the hand-off. I must ensure I don't force a mediation where one doesn't belong.

      *(Self-Correction on Judgment)*: The prompt asks to "Mark which steps are just judgment dressed up as a checklist." I will use bold italics or a specific icon to denote these.

      *(Self-Correction on Policy)*: Be careful not to just say "No." Explain *why* it's hard (social media, adolescent development).

  12. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a heavy responsibility for a junior. Your advisor is right: guilt motivates repair; shame motivates concealment or aggression. But she is also right that you cannot simply "delete" shame from a high school environment.

  Here is a procedure designed to maximize guilt (behavior-focused) and minimize shame (identity-focused), followed by the application to your cases, and finally the answer to the policy question.

  ### Part 1: The Peer Mediation Protocol (v1.0)

  **Phase 0: Pre-Session Triage (Before the 40 minutes start)**
  1.  **Fact Check:** Verify the incident report with the advisor. Do not enter the room with rumors.
  2.  **Voluntary Participation:** Confirm all parties *agree* to be there. If one is forced, mediation will fail.
  3.  **Power Balance Check:** Assess if one party holds significant social or physical power over the other.
      *   *⚠️ JUDGMENT ALERT:* Deciding what counts as a "power imbalance" is subjective. You are deciding who is vulnerable enough to deserve protection rather than mediation.
  4.  **Safety Veto:** If there is any threat of violence or self-harm, stop. Hand to adult.

  **Phase 1: The Opening (5 Minutes)**
  1.  **Set the Goal:** "We are here to figure out how to fix the harm, not to decide who is a bad person."
  2.  **Confidentiality:** "What is said here stays here, unless someone is in danger."
  3.  **Rules:** No interrupting. No name-calling. Speak to the mediators, not directly at each other yet.

  **Phase 2: The Story & The Impact (15 Minutes)**
  1.  **Offender Narrative:** Ask the accused: "Walk us through what happened."
      *   *Intervention:* If they say "I'm stupid," correct them: "You made a choice. Let's talk about the choice."
  2.  **Victim Narrative:** Ask the harmed party: "How did this affect you?"
  3.  **The Bridge:** Ask the offender: " Hearing that, what do you think your action cost them?"
      *   *⚠️ JUDGMENT ALERT:* You are deciding what counts as valid "harm." If a victim says "I feel disrespected" but you think they are overreacting, you might minimize it. That is a value judgment, not a fact.

  **Phase 3: The Emotion Read (Ongoing)**
  Watch the offender's body language and language patterns to distinguish Guilt vs. Shame.
  *   **Signs of Guilt (Good):** Eye contact (or respectful looking down), specific language ("I lied," "I took the photo"), leaning forward, asking "How do I fix this?"
  *   **Signs of Shame (Bad):** Hiding face, silence, global language ("I'm a liar," "I'm trash"), defensiveness ("Everyone does it"), aggression/anger to deflect pain.
  *   **Action:** If you see Shame signs, pause. Reframe: "You are not your mistake. You made a mistake. Can we talk about the mistake?"

  **Phase 4: The Agreement (15 Minutes)**
  1.  **Restitution:** What concrete action will repair the trust? (e.g., deleting the photo, redoing the test, public correction).
  2.  **Apology Script:** The offender must articulate: "I did [X]. It caused [Y]. Next time I will [Z]."
  3.  **Sign-off:** Everyone signs the agreement. Advisor reviews.

  **Phase 5: The Hand-Off Threshold**
  Stop immediately and call the advisor if:
  1.  The offender refuses to acknowledge facts.
  2.  The victim becomes visibly traumatized (shaking, crying uncontrollably).
  3.  **⚠️ JUDGMENT ALERT:** You decide when "trauma" is beyond your pay grade. This is a guess. You are children judging other children's pain thresholds.

  ***

  ### Part 2: Running the Cases

  #### Case A: The Cheater and The Liar
  **Scenario:** Student A cheated. Student B lied to cover for A. Teacher caught them.
  **Mediation Goal:** Restore academic integrity trust.

  **Execution:**
  *   **Phase 0:** Power balance is equal (friends). Safe to proceed.
  *   **Phase 2:** Student A admits to cheating. Student B admits to lying.
  *   **Phase 3 (Emotion Read):** Student A starts crying, saying, "I'm just a failure, I can't do the work."
      *   *Diagnosis:* **Shame.** A is attacking their own identity.
      *   *Correction:* Mediator interrupts. "You are not a failure. You chose to cheat because you were stressed. That choice hurt the class curve and the teacher's trust. We are fixing the choice."
  *   **Phase 4 (Agreement):** A agrees to retake the test for zero credit (consequence) but write a reflection on *why* they felt they couldn't pass. B agrees to admit the lie to the teacher in writing.
  *   **Outcome:** **Passable.** The procedure works here because the harm is abstract (trust/rules) and the power dynamic is flat. The shame was caught and reframed as guilt.

  #### Case B: The Team Hazing
  **Scenario:** Varsity team members made a freshman run a gauntlet, humiliated them, posted it.
  **Mediation Goal:** Stop the behavior, heal the freshman.

  **Execution:**
  *   **Phase 0 (Triage):** **STOP.**
      *   *Power Balance Check:* Varsity Juniors/Seniors vs. Freshman. This is a massive status and physical power imbalance.
      *   *⚠️ JUDGMENT ALERT:* By deciding this is "mediation," you imply the freshman has equal standing to negotiate with their abusers. They do not.
  *   **Phase 1 (If you proceeded):** You put the freshman in a room with three older athletes.
  *   **Phase 3 (Emotion Read):** The freshmen is silent, looking at the floor. The athletes are smirking or saying "It was just a joke, chill."
      *   *Diagnosis:* The freshman is in **Fear/Shame**. The athletes are feeling **Pride** or **Defensiveness**, not Guilt.
      *   *Correction:* You cannot reframe this. "It was just a joke" is a rejection of the harm.
  *   **Phase 5 (Hand-Off):** **This case must be handed to the adult immediately.**
      *   *Why:* Hazing is not a conflict; it is abuse. Mediation requires two parties who wronged each other or made a mutual mistake. Here, one party exerted dominance over the other.
      *   *The Hard Truth:* If you try to mediate this, you are legitimizing the hazing. You are telling the freshman, "You have a role in resolving this," which implies they share responsibility. They do not.
      *   *Result:* If you follow the protocol honestly, **you do not mediate.** You document and hand it to the advisor. If your board *forces* you to mediate this, your board is part of the problem.

  ***

  ### Part 3: The "Judgment Dressed as Checklist" Audit

  You asked me to mark where you are pretending to be objective when you are actually making moral judgments. Here they are again, summarized:

  1.  **Defining Harm:** In Phase 2, you decide if a victim's feelings are "reasonable." If a girl says a screenshot hurt her, but you guys think she's "too sensitive," you will subconsciously pressure her to drop it. That is you enforcing a culture of toughness.
  2.  **Defining Power:** In Phase 0, you decide if a power imbalance exists. In high school, social capital is invisible. You might think two juniors are "equal," but if one is a quarterback and the other is a band kid, they are not equal. If you miss this, your mediation is coercion.
  3.  **Defining Trauma:** In Phase 5, you decide when to call an adult. You are 16. You do not know what permanent psychological damage looks like. You are guessing.

  ***

  ### Part 4: Can a School Choose Guilt Over Shame?

  **The Short Answer:** No. Not as a policy.

  **The Long Answer:**
  A school can write a policy that *says* "We focus on restorative justice (guilt) not punitive justice (shame)." But culture is not code. You cannot legislate emotion.

  1.  **Adolescent Development:** Teenagers are biologically wired for shame. Your prefrontal cortex (logic/guilt) is under construction. Your amygdala (fear/social status) is hyper-active. High school is a "Shame Economy." Status is gained by humiliating others and lost by being humiliated. A policy cannot override the biological drive to protect social status.
  2.  **The Audience:** Guilt works in private ("I did a bad thing"). Shame works in public ("Everyone saw me do a bad thing"). Schools are public squares. Even if *you* in the mediation room focus on guilt, the moment the students walk into the hallway, the gossip network converts it to shame. "Did you hear John cheated?" is a shame signal.
  3.  **The Adult Contradiction:** Adults often use shame to enforce order without realizing it. Putting a student's name on a detention list, calling parents in front of peers, or singling someone out in assembly—these are shame tactics. If the administration uses shame to run the school, your mediation board cannot create a guilt island in a shame ocean.

  **What Can You Actually Do?**
  You cannot eliminate shame. But you can **contain** it.
  *   **Privacy:** The stricter your confidentiality, the more guilt you can cultivate.
  *   **Reintegration:** The most important part of the protocol isn't the apology; it's what happens *after*. If the cheater retakes the test and the class accepts them back, that is guilt (repair). If the class calls them "cheater" for the rest of the year, that is shame (exile).
  *   **Honesty:** Tell the students: "We are not going to tell people you are bad. We are going to tell people you fixed it."

  **Final Verdict:**
  Your advisor is testing you. She won't give you the answer because the answer is: **You are not therapists.** You are triage nurses.
  *   For the cheater: You can facilitate guilt.
  *   For the hazer: You must recognize the limits of your power and hand it off.
  *   For the school: You cannot stop the shame culture, but you can offer a private room where it is temporarily suspended. That is valuable, but it is not a policy change. It is a sanctuary.
