  Not starving from theoretical **greed**.  

  Reductionist speaks with hungry **greed**,  
  "Only atoms settling on **ground**,"  
  But atoms build no lifting **crane**.  
  They leave the question of **design**  
  Unpaid, like interest on **debt**,  
  Hanging like an unsupported **skyhook**.  

  To seek a miracle, a **skyhook**,  
  Is just to hide the cost of **greed**.  
  You cannot cancel explanatory **debt**  
  By pointing only to physical **ground**.  
  Function survives the talk of **design**  
  Because the steps require a **crane**.  

  No **skyhook** settles on the **ground**,  
  Where **greed** dissolves the **design**,  
  The **debt** demands the working **crane**.
