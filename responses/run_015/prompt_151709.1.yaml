      *   *Problem 2 (Case 4):* He *has* non-moral parts (stamps) but hides them. The rule focuses on *having* room, but the user's reaction focuses on the *attitude* toward that room (guilt/shame).

  4.  **Identify the Underlying Principle (The "Secret Sauce"):**
      *   The user's intuitions align very closely with Susan Wolf's "Moral Saints" essay, but I can't just say "Read Wolf." I need to distill the *concept* without the jargon.
      *   What connects Case 1, 2, 4, 5? It's about *human flourishing* or *personhood*. A good life isn't just about moral output; it's about being a well-rounded human.
