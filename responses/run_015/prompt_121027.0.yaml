answer: |-
  **Exam Question**

  **Question 4: Propriety, Partiality, and the Impartial Spectator**

  Consider the following case: A merchant encounters a distant stranger in dire financial crisis who could be saved by a modest donation. However, the merchant refuses to donate, reasoning that he must preserve his capital to secure his own children's education and future establishment.

  Using Adam Smith's *The Theory of Moral Sentiments*, analyze whether the Impartial Spectator would approve of the merchant's conduct. In your response, you must:

  1.  Distinguish between our immediate **sympathy** for the suffering stranger and our moral **approval** of the merchant's motives.
  2.  Explain how Smith's concept of **propriety** prevents this judgment from collapsing into Utilitarianism (which might prioritize the stranger's immediate need) or Egoism (which might justify hoarding wealth without reason).
  3.  Clarify the function of the Impartial Spectator: Explain why it is neither a mere internalization of public opinion nor a Kantian rational universal law, specifically regarding how it regulates natural partiality toward family.

  ***

  **Model Answer**

  For Adam Smith, moral approval is not determined by the utility of an action's outcome, but by the propriety of the agent's motives. In the case of the merchant, a Utilitarian might argue that if the stranger's suffering exceeds the children's potential loss, the merchant is obligated to give. Smith rejects this calculus. The Impartial Spectator approves of the merchant's refusal, not because the outcome is optimal, but because the motive displays a proper degree of self-command and appropriate partiality.

  To understand this, one must distinguish between sympathy and moral approval. We naturally feel immediate sympathy for the suffering stranger; we "feel with" their distress. However, sympathy alone does not constitute moral approval. Approval arises only when we enter into the **motives** of the agent. Here, Smith employs a structure of "double sympathy": we approve of the agent when we sympathize with their motives *and* when we sympathize with the gratitude of those affected by the action (in this case, the children). While we pity the stranger, we also enter into the merchant's concern for his offspring. Smith argues that nature has implanted a stronger affection for those near to us. To ignore one's children for a stranger would appear to the Spectator as a violation of the natural order of affection, lacking propriety.

  This reveals why Smith is not a Utilitarian in disguise. Utilitarianism locates virtue in the production of happiness. Smith locates it in the "fit" between the sentiment and the cause. The merchant's sentiment (care for family) fits the cause (his children's needs) appropriately. The outcome (the stranger's continued suffering) is unfortunate, but the action is not immoral. Conversely, Smith avoids Egoism because the merchant cannot simply hoard wealth for indulgence. The Spectator checks selfishness; the capital must be designated for a proper end (education), not mere luxury. If the merchant refused the stranger to buy a vanity item, the Spectator would condemn the lack of generosity as improper.

  Finally, the Impartial Spectator functions as a normative check distinct from both social convention and Kantian reason. It is not merely "public opinion," because the real public might be biased or cruel. The Spectator is an idealized standpoint we construct to correct our immediate, biased sentiments. It allows us to view our own partiality from a distance. However, unlike a Kantian universal law, the Spectator does not demand we treat all humans identically. It recognizes that universal impartiality is impossible for humans. Instead, it demands we keep our partiality within the bounds of propriety. We are permitted to prefer our children, provided we do not violate justice or basic humanity to do so. Thus, the Spectator validates the merchant's priority of family without endorsing a moral system based solely on consequences or rigid rational duties.

  ***

  **Marking Scheme**

  **Total Points: 100**

  **A Range (85–100): Excellent**
  *   **Sympathy vs. Approval:** Clearly distinguishes between *feeling* for the victim (sympathy) and *judging* the agent (approval). Notes that we can sympathize with the stranger yet still approve of the merchant.
  *   **Double Sympathy:** Explicitly references the mechanism of judging the agent's motives alongside the gratitude of the beneficiaries (the children), not just the pain of the victim.
  *   **Propriety over Utility:** Successfully argues that Smith cares about the *fittingness* of the motive, not the net happiness. Identifies that prioritizing family is "proper" in Smith's system, whereas Utilitarianism might demand otherwise.
  *   **The Spectator's Role:** Defines the Spectator as a **normative corrective**, not just descriptive public opinion. Distinguishes it from Kant by noting Smith allows for graded partiality (family > stranger) based on sentiment, not just rational duty.
  *   **Bounds of Partiality:** Notes that family preference is allowed *only* within bounds (e.g., not for vanity), avoiding the Egoism trap.

  **B Range (70–84): Good**
  *   **General Understanding:** Correctly identifies that Smith would likely approve of the merchant.
  *   **Utilitarian Distinction:** Recognizes Smith is not a Utilitarian but may rely on vague definitions of "virtue" rather than specifically citing *propriety* or the *fit of sentiment*.
  *   **Spectator:** Describes the Spectator accurately but may lean too heavily on it being "conscience" without explaining how it corrects social bias, or may struggle to distinguish it clearly from Kantian universalism.
  *   **Sympathy:** May conflate sympathy with approval slightly (e.g., implying we approve *because* we feel bad for the stranger, rather than because we enter into the merchant's motive).
  *   **Partiality:** Acknowledges family priority but misses the nuance of the "bounds" (propriety vs. egoism).

  **C Range (60–69): Satisfactory**
  *   **Summary:** Recites textbook definitions of sympathy and Spectator without applying them rigorously to the merchant case.
  *   **Utilitarianism:** Fails to adequately explain *why* Smith isn't a Utilitarian beyond saying "he talks about feelings."
  *   **Case Application:** Verdict on the merchant is unclear or contradictory.

  **Common Mistakes (Deductions)**
  *   **(-10 pts) The Utilitarian Trap:** Arguing that Smith approves because the children's future happiness outweighs the stranger's (consequentialist reasoning). Smith approves because the *motive* is proper, regardless of the utility calculus.
  *   **(-10 pts) Sympathy as Sufficient:** Claiming that because we sympathize with the stranger, we must disapprove of the merchant. This misses the distinction between sentiment and judgment.
  *   **(-10 pts) Spectator as Public Opinion:** Treating the Impartial Spectator as simply "what society thinks." (Must be an idealized/normative standpoint).
  *   **(-10 pts) Kantian Conflation:** Describing the Spectator as a voice of pure reason or universal law that forbids partiality. (Smith explicitly permits graded affection).
  *   **(-5 pts) Egoism:** Failing to mention that the merchant's refusal is only justified if the capital is for a proper end (education), not selfish indulgence.
