  *Crucial Point:* The argument hinges on the *identity* of the disposition. If the disposition is "structural instability under impact," and the structure channels that instability into heat dissipation rather than fracture, the *canonical* manifestation (breaking) is missed, but the *power* (instability) was exercised. This supports the "Powers" view where the power is the *source*, not the *outcome*.

  Okay, let's write.

