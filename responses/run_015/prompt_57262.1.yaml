answer: |-
  There is no established term in the literature that captures this specific mechanism. You are correct to distinguish it from the "dirty hands" problem itself (which is agent-centered), from moral residue (which describes the leftover stain), and from whitewashing (which denies the stain). The standard literature—from Walzer to Williams to Nagel—stops at the agent's anguish or the theoretical justification of the act. It treats the community's reaction as secondary or assumes the residue remains on the agent.

  The phenomenon you are describing is the *social dissolution* of that residue through a specific ritual of acknowledgment. Since there is no canonical name, I will commit to one: **Political Transubstantiation**.

  I choose this term deliberately. In its theological origin, transubstantiation describes a change in *substance* while the *accidents* (the sensory appearances) remain the same. In your cases, the "accidents" of the act remain unchanged (the levee was breached, the torture occurred, the civilians died, and everyone admits it was a moral wrong). However, the *substance* of the act—its moral ontology within the community—is changed from "sin" to "sacrifice." The community does not deny the blood; they consecrate it.

  Here is the definition by conditions. **Political Transubstantiation** obtains when and only when:

  1.  **Acknowledgment of Violation:** The political community explicitly acknowledges that a normative boundary was crossed (it is not revisionism).
  2.  **Assertion of Necessity:** The community accepts the agent's claim that the violation was required for the collective's survival or greater good (it is not mere exoneration).
  3.  **Conversion of Residue:** The moral residue (guilt, taint, anguish) that would ordinarily attach to the agent is collectively reinterpreted as a form of capital (courage, burden-bearing, statesmanship).
  4.  **Demand for Closure:** The community signals that further agent-regret is unnecessary or self-indulgent, effectively closing the moral account without restitution to the harmed party commensurate with the wrong.

  ### Boundary Cases and Differentiations

  You asked for the edges where the concept earns its keep. Here is how **Political Transubstantiation** holds up against the complications you raised.

  **1. Compensation vs. Esteem**
  Does the phenomenon still obtain if the harmed are compensated? **Yes.** This is a crucial boundary. If the community pays reparations to the flooded town *and* honors the leader, the transubstantiation is *more* stable, not less. The compensation discharges the *debt* to the victims, while the esteem discharges the *sin* of the agent. In fact, high compensation often facilitates the transubstantiation: it allows the community to say, "We paid for the damage, so now we are free to admire the resolve." If compensation is absent, the transubstantiation is fragile and risks sliding into cynicism. If compensation is present, the admiration becomes "clean."

  **2. The Refusing Agent**
  What if the agent refuses the honors and demands blame? This is the **Failure of Transubstantiation**. It reveals that the process requires two parties: the community offering the conversion and the agent accepting the new ontology of their act. If the agent insists on their own taint (e.g., resigns in disgrace despite public acclaim, or refuses to speak on the lecture circuit), they are rejecting the transubstantiation.
  Does this refusal have a name? I would call it **Moral Intransigence**. It is the agent insisting that the metaphysical change the community attempted did not take hold. In your seminar, this is a vital counter-case: it shows that the "stain" is not merely objective but relational. If the agent refuses the "cleansing," the stain remains, proving that the transubstantiation is a social speech act, not a moral fact.

  **3. The Audience Scope**
  Does it matter if the admiration comes from the whole polity or only the leader's supporters? **Yes, this distinguishes the phenomenon from polarization.**
  *   **Partial Transubstantiation:** If only the leader's base admires the "courage" while the opposition sees a "criminal," you have standard political polarization. The moral residue has not been socially dissolved; it has been relocated to the opposition.
  *   **Full Political Transubstantiation:** This requires a broad consensus, often跨越 (crossing) partisan lines, or occurring in a context where the "state" is viewed as distinct from the "government." The farewell address you mention works only if the opposition also claps, or at least remains silent. If the admiration is tribal, it is not transubstantiation; it is **Partisan Sanctification**, which lacks the quasi-religious, unifying function of the real thing.

  **4. The Collapse into Propaganda**
  At what point does this become propaganda? The line is drawn at **Condition 1 (Acknowledgment)**.
  *   **Propaganda:** Denies the wrong happened, or denies the wrongness ("It wasn't torture," "They weren't civilians").
  *   **Political Transubstantiation:** Insists on the wrong ("It was torture, and that is why his willingness to order it was so heavy").
  Propaganda lies about the *facts* or the *norms*. Transubstantiation tells the truth about both but lies about the *implications*. It is more robust than propaganda because it is resistant to factual debunking. You cannot fact-check it away, because it concedes the facts. It collapses into propaganda only when the acknowledgment becomes performative fiction—i.e., when the "anguish" is staged so transparently that the audience knows the conversion is fake.

  ### One Phenomenon or Two?

  You asked whether this is one phenomenon or two. I argue it is **one**.

  It is tempting to split it into the *agent's dilemma* (Dirty Hands) and the *community's reaction* (Transubstantiation). However, they are functionally inseparable in the political realm. The "Dirty Hands" problem is theoretically solvable by the agent accepting the residue. But in practice, political communities rarely allow their leaders to remain tainted, because a tainted leader is a weak sovereign. The community *needs* the leader to be clean to maintain trust in the office.

  Therefore, the social machinery you noticed is not an add-on; it is the *solution* to the Dirty Hands problem. Without Political Transubstantiation, the Dirty Hands problem leads to the degradation of authority. With it, the authority is reinforced. The "anguish" you noted as the fitting philosophical posture is, politically speaking, a luxury the community cannot afford. They convert the residue into esteem because they need the leader to be capable of doing it again.

  ### Summary for the Seminar

  If I were sitting in your graduate seminar, I would argue that you have identified the **sociological completion of the Dirty Hands problem**.

  *   **Term:** Political Transubstantiation.
  *   **Mechanism:** The collective re-naming of moral residue as political capital.
  *   **Function:** To preserve the legitimacy of the office by preventing the accumulation of moral debt on the agent.
  *   **Risk:** It creates a moral hazard where the "cost" of dirty hands is paid in the currency of admiration rather than justice, potentially lowering the threshold for future violations.

  This concept allows you to move the seminar from "What should the agent feel?" (ethics) to "What does the community do with what the agent feels?" (political philosophy). It explains why the "tragic hero" narrative is so durable in politics: it is the ritual script by which the community absolves itself of the sins it authorized.
