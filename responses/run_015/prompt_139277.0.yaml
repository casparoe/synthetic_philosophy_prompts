  4.  **Stage 2: Winnowing to Real Tensions:**
      *   *Dissolve:* (2) vs (10) is manageable if the distinction is "superorganism vs colonial organism" though biologically shaky. (8) vs (1) is standard Access vs Phenomenal distinction, not fatal.
      *   *Real Tension 1 (The Teleosemantics/Dennett Clash):* (4) says payoff *constitutes* mentality. (6) says selection history *constitutes* content. These are different metaphysical grounds. You can't have content be *both* constituted by current predictive utility AND fixed by historical selection without a bridge.
