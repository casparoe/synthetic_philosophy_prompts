      *   *Real Tension 5 (PMW/Aspen Exclusion):* (10) excludes PMW/Aspen. (6) includes evolutionary individuals. (9) includes systems that absorb cost. PMW/Aspen absorb cost. Why are they out? If it's "cognitive architecture," that conflicts with (6) which is history-based.

  5.  **Stage 3: Ranking and Auditing:**
      *   *Severity 1:* Teleosemantics vs. English Understanding (6 vs 1). Fatal if unaddressed.
      *   *Severity 2:* Boundary vs. Unit of Selection (3 vs 6/10). Biologically untenable.
      *   *Severity 3:* Maintenance Condition vs. Corporations (9 vs 5). Threatens the "No Chinese Nation/Corp" verdict.
