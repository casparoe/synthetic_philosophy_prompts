      *   *Best Single Revision:* Shift (6) from being the *sole* account of content to an account of *teleological grounding*, while allowing (4) to handle the *ascription* of complex content. But (4) says payoff *constitutes*.
      *   *Okay, the "Single Revision" to tidy up the most:* **Modify (6) to distinguish Basic Content vs. Derived/Scaffolded Content.** This solves (1) vs (6). It allows AH to have basic beliefs via selection, and English beliefs via the Dennettian stance (4) *constrained* by (9).
