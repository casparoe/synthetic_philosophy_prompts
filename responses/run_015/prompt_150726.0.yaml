answer: |-
  Your basis-free qualification successfully deflects coordinate-dependent objections but renders the view empirically unfalsifiable in ways that critically undermine its utility for safety cases requiring exhaustive auditing.

  **1. Encoding Degeneracy (Fatal)**
  If behaviourally equivalent networks can be constructed where sparse directions are boolean combinations of your proposed features while retaining equal sparsity and causal efficacy, you must concede this counts decisively against feature realism. This demonstrates that the "feature" decomposition is underdetermined by the causal structure, meaning features are convenient descriptions rather than ontological primitives. Your basis-free qualification does not insulate you here because the challenge is not about coordinate rotation but about the uniqueness of the decomposition itself; if multiple incompatible feature sets satisfy your causal criteria, "the features" do not exist uniquely. For a safety case, this is catastrophic: you cannot certify that a system is safe by auditing one valid feature set if an equally valid alternative set contains un-audited dangerous features.

  **2. Near-Zero Dictionary Correspondence Across Seeds (Fatal if Linear Alignment Fails)**
  If identically trained networks show near-zero feature correspondence even after optimal invertible linear alignment, you must concede this falsifies the claim that features are robust properties of the function. Current evidence suggests linear alignment often fails to recover feature matching across seeds, implying features are artifacts of training dynamics rather than functional necessities. If you retreat to claiming "a map exists but is hard to find," you render the position unfalsifiable; if you accept the null result, you must dismiss features as real units. For safety, this means you cannot generalize audits from one model to another, forcing exhaustive re-analysis for every seed and checkpoint, which is computationally infeasible for certification.

  **3. Steering Without Tracking (Merely Awkward)**
  When steering vectors change behaviour without corresponding to directions the network naturally uses, you are entitled to dismiss this as counting against your view because your definition explicitly requires systematic effects characteristic of a feature, not just brute-force intervention. This distinction separates "causal leverage" from "natural representation," refining your criterion rather than refuting it. This does not lead to unfalsifiability because naturalness can be empirically measured via activation distributions and trajectory alignment. For safety, this is manageable but requires you to distinguish between "features the model uses" (audit target) and "knobs we can turn" (control target), preventing you from assuming steerability implies natural occurrence.

  **4. Probes Recovering Unused Features (Dismissible)**
  You are entitled to dismiss probe false positives entirely because your realist view already demands causal intervention, not just correlation. Probes are known to find structure in noise; your requirement for downstream behavioural effects filters this out by definition. This poses no risk of unfalsifiability since intervention results are binary and observable. For safety, this simply mandates that probe-based audits be treated as hypotheses requiring causal validation before any risk assessment is made.

  **Unfalsifiability and Safety Implications**
  Your basis-free qualification insulates the position into unfalsifiability specifically regarding the existence of the aligning map; if you claim features are real "up to some invertible linear map" without constraining which map or providing an efficient way to find it, no empirical null result can definitively refute the claim. This is a severe problem for a safety case because safety engineering requires bounding worst-case risks, not just demonstrating positive instances of control. If you cannot falsify the absence of features (because a hidden basis might always exist), you cannot prove a model is free of deceptive or dangerous representations, reducing your audit to a search problem with no known completion condition.
