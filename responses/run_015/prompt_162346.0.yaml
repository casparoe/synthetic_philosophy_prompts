answer: |-
  President, Trustees, Faculty, Families, and the Class of 2024.

  It is an honor to stand here. I know this place. I know the weight of the regalia, the itch of the collar, and the specific anxiety of sitting on a hard wooden chair while trying to look attentive. I also know the seal on the wall behind me. *Truth sought together.*

  I know that for the last year, that word—*truth*—has been spoken on this campus more often, and with more tension, than perhaps any other. It has been on the lips of the administration, in the statements of the faculty, and in the anxious conversations of parents. We have had an academic integrity scandal. We have had essays and theses submitted that were not written by the names on the cover page. We have had a year where everyone demanded truth, but meant a dozen different things by it.

  Some here mean truth as a moral absolute. Some mean it as a factual correspondence. Some mean it as a spiritual alignment. And then there are the philosophers in the audience—hello, I see you—who know that the word "truth" does a lot of heavy lifting in our language, but who also know it isn't a *thing* you can hold in your hand.

  I am a philosopher. And I am going to be honest with you, in the spirit of the honor code you signed. I do not believe Truth is a mountain waiting for you to climb it. I do not believe it is a light that will shine down on you if you are virtuous enough. I think that when we say a statement "is true," we are not describing a mystical property of the universe. We are doing something much simpler, and much harder. We are saying: *This is how it is. I stand behind this. You can take it from me.*

  If I am right about that, then the commencement speech you were expecting—the one about dedicating your lives to the service of a capital-T Truth—is not the speech I can give. I cannot ask you to serve a concept. But I can ask you to serve something real. I can ask you to care about the weight of your own word.

  This brings me to the scandal that has shadowed this year. It would be easy to say that the students who used language models to write their work were caught lying. But that misses the deeper injury. Some of those essays may have been factually accurate. Some of the arguments may have been sound. The problem was not necessarily that the content was false. The problem was that the author was absent.

  When you submit work under your name, you are not just handing in a file. You are making a promise. You are saying, "I have thought this through. I have checked this against the world as best I can. I am willing to be held responsible for this claim." When you outsource that thinking to a machine, you are not just breaking a rule. You are opting out of the responsibility of endorsement. You are saying, "I do not care enough about how things actually are to do the work of finding out."

  This is what I believe your honor code is actually asking you to do when it tells you to "seek the truth." It is not asking you to hunt for a metaphysical gem. It is asking you to fight against indifference.

  There is a difference between being wrong and not caring whether you are wrong. We are all going to be wrong. I am wrong about things almost every day. My father, who is in the audience and who has spent a lifetime judging cases, knows that witnesses can be mistaken without being dishonest. Being wrong is part of being human. It is the cost of engaging with a complicated world.

  But indifference? Indifference is a vice that needs no complex philosophy to condemn it. Indifference is looking at the world and saying, "It doesn't matter if this matches reality, as long as it looks like I did the work." Indifference is treating your own speech as noise rather than signal. When you sign your name to a statement, you are asking your community to trust you. If you are indifferent to the truth of that statement, you are betraying that trust.

  So, if "truth" is just a way of endorsing a claim, why does it matter? Why does the seal say "Truth sought *together*"?

  It matters because we cannot check everything ourselves. I cannot verify the history of every nation, the chemistry of every medicine, or the engineering of every bridge I cross. I have to rely on you. And you have to rely on me.

  When I say, "What she told me is true," I am not just describing her sentence. I am vouching for her. I am saying, "She is a reliable witness. Her process was careful. Her intentions were honest." In a world that is increasingly flooded with information, the scarcest resource is not facts. It is trustworthiness.

  This is where the work lies for you, the Class of 2024. You are leaving a place that has asked you to think critically, to argue charitably, and to write clearly. You are entering a world that is often content with the opposite. You are entering a world where algorithms are designed to capture your attention, not to inform you. A world where "truth" is often treated as a weapon to be wielded against an enemy rather than a common ground to be built with a neighbor.

  Your education here has not just been about accumulating knowledge. It has been about learning the norms of assertion. It has been about learning that you only speak when you have something to say, and that when you speak, you own the consequences.

  To my father, and to the parents here: You worry about what your children are walking into. You worry about whether they will be safe, and successful, and good. I cannot promise they will be successful. But I can tell you what will make them good. It will not be their ability to find the "Right Answer." It will be their refusal to be careless with the answers they give.

  To the graduates: You will go into law, medicine, business, teaching, public service. In every one of these fields, people will hand you authority. They will give you the power to speak and be heard. A doctor's diagnosis is believed because of the degree on the wall. A lawyer's brief is read because of the bar number at the top. A journalist's story is printed because of the byline.

  These are not just credentials. They are promises. They are social technologies that allow us to say, "This person has done the work. You can rely on this."

  If you treat those promises lightly, you degrade the system for everyone. If you write a report you haven't read, if you sign a check you haven't balanced, if you share a story you haven't verified, you are not just risking your own reputation. You are making it harder for the rest of us to trust each other. You are making the "together" part of "Truth sought together" impossible.

  So, here is my charge to you. Do not go out looking for Truth as if it were a destination. Go out looking for accuracy. Go out looking for clarity. Go out looking for the courage to say, "I was mistaken," when the evidence changes.

  When you are in a meeting and someone asks for the facts, do not give them what they want to hear. Give them what you have verified.
  When you are writing a memo, do not use words to obscure your meaning. Use them to reveal it.
  When you are tired, and it would be easier to let a falsehood pass, do not let it pass. Not because a god is watching, but because your neighbor is listening.

  The honor code you signed asks you to seek the truth. I am asking you to interpret that as a command to care. Care about whether your beliefs match the world. Care about whether your words match your thoughts. Care about the people who have to live with the consequences of your assertions.

  There is a profound dignity in this. It is the dignity of the craftsperson who signs their work. It is the dignity of the witness who raises their right hand and speaks without reservation. It is the dignity of knowing that your mind is your own, and that your word is your bond.

  We live in a time that is cynical about truth. People will tell you that everything is biased, that nothing is real, that everyone is lying. It is tempting to join that cynicism. It is tempting to say, "Nothing matters, so why bother?"

  But you are Marlowe graduates. You know better. You know that while we may not have access to a perfect, God's-eye view of reality, we have access to each other. We have the ability to check, to question, to correct, and to confirm. We have the ability to build a shared world, brick by brick, claim by claim.

  That is what the seal means. *Truth sought together.* It is not a monument. It is a practice. It is the daily, unglamorous work of making sure that when we say "this is so," we mean it, and we can prove it, and we are willing to stand by it.

  Class of 2024, the world does not need you to be guardians of a holy flame. It needs you to be reliable witnesses. It needs you to be the people in the room who care more about how things are than about how they look. It needs you to be the ones who understand that saying "it is true" is the most serious thing you can do with your voice.

  Go out and be wrong, when you must. But do not be careless. Do not be indifferent. Seek the facts, honor your sources, and own your words. If you do that, you will not need to worry about whether you are serving the Truth. You will be building the only truth that matters: a community that can trust itself.

  Congratulations.
