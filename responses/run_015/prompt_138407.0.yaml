answer: |-
  **Purpose and Scope**

  This procedure determines whether a proposal involves a 'living organism' or 'replicating biological entity' for containment classification. It is not a metaphysical inquiry into the nature of life, but a stipulative tool for biosafety. Our purpose is risk management, not ontological truth. The procedure applies to all novel organism proposals submitted to the Committee. It prioritises functional capacity over structural composition. If an entity poses a risk equivalent to a living organism through replication or evolution, it falls within our remit. This document binds the Committee; deviations require Director approval.

  **The Procedure**

  **Step 1: Material Basis**
  *Question:* Is the entity composed principally of organic polymers (proteins, nucleic acids, lipids)?
  *Sufficient Answer:* Yes, or a bio-hybrid where biological components drive function.
  *Stop Point:* If No, return to PI as non-biological.
  *Note:* Includes reversed chirality if bio-polymers are used.

  **Step 2: Replication Capacity**
  *Question:* Can the entity produce copies of itself, either independently or using supplied machinery?
  *Sufficient Answer:* Yes, including assisted replication (e.g., host-dependent viruses, cell-free systems).
  *Stop Point:* If No, proceed to Step 3. If Yes, classify as Regulated Entity.

  **Step 3: Evolutionary Potential**
  *Question:* Does the replication process allow for heritable variation subject to selection?
  *Sufficient Answer:* Yes, even if evolution is slow or constrained.
  *Stop Point:* If No, proceed to Step 4. If Yes, classify as Regulated Entity.

  **Step 4: Latent Viability**
  *Question:* Is the entity currently metabolically inert but revivable using standard apparatus?
  *Sufficient Answer:* Yes. 'Latent viability' counts as viability for containment purposes.
  *Stop Point:* If No, proceed to Step 5. If Yes, classify as Regulated Entity.
  *Rationale:* Potentiality equals risk.

  **Step 5: Relational Dependence**
  *Question:* Does self-maintenance depend on a niche or metabolite supplied by us or another organism?
  *Sufficient Answer:* Yes. Dependence does not negate status.
  *Stop Point:* If No, proceed to Step 6. If Yes, classify as Regulated Entity.
  *Rationale:* We regulate the system, not just the isolated genome.

  **Step 6: Unit of Analysis**
  *Question:* Is the replicating unit a consortium where individual members are non-viable alone?
  *Sufficient Answer:* Yes. The consortium is the regulated unit.
  *Stop Point:* If No, return to PI as non-regulated.
  *Hand-Over Point:* If the Committee disagrees on whether the risk warrants containment despite a 'No' classification, the Chair decides after consulting the Occupational Hygienist.

  **What Each Step is Buying Us**

  This procedure avoids the trap of seeking a single 'spark of life'. Instead, it uses a **cluster concept**: an entity need not possess every property of life, but enough to trigger safety concerns. Steps 1–3 establish functional capacity. We use a **stipulative definition**; we decide what counts as 'living' based on our regulatory purpose, not biological essence. This is **purpose-relativity**: if it replicates and evolves, it risks escape and adaptation, regardless of whether philosophers call it alive.

  Step 4 addresses **potentiality**. In biosafety, a dormant spore is as dangerous as a dividing bacterium. We treat latent viability as actual viability because the *capacity* to metabolise is the risk factor, not the current state. Steps 5 and 6 address **relational properties**. Life often exists in niches. Insisting on counterfactual independence (could it survive on a barren rock?) would exclude most pathogens and engineered strains. We regulate the system-environment interaction. Finally, Step 6 handles **holism**. If the system evolves, the system is the unit of risk, even if the parts are inert. This prevents loopholes where safety is argued by dissecting a living consortium into 'dead' parts.

  **Where the Procedure Hands the Decision to a Person**

  Fact-based questions (e.g., "Does it replicate?") are decided by the molecular biologists and microbiologists. However, borderline cases involve value judgments about risk tolerance. Specifically, if Step 6 yields a 'No' (no replication) but the entity is biologically derived and novel, there is a residual uncertainty about unknown risks.

  At this **Hand-Over Point**, the decision passes to the **Committee Chair**. The Chair must consult the **Occupational Hygienist** regarding containment feasibility. If the Hygienist confirms that standard containment cannot mitigate the uncertainty, the Chair must classify the proposal as Regulated. This ensures that when facts run out, precautionary principle values guide the decision, anchored by safety expertise rather than scientific curiosity. The Lay Member must be consulted to ensure public perception of risk is considered before the Chair finalises this value judgment.

  **Worked Applications**

  **1. The Two-Strain Consortium**
  *Analysis:* Step 1 (Yes, organic). Step 2 (Individually No, Collectively Yes). Step 6 applies. The consortium replicates and evolves.
  *Result:* Regulated Entity.
  *Reasoning:* The system is the unit. Classifying the parts as safe would be a category error. The proposal must meet containment requirements for the pair.

  **2. The Dormant Seed and Tardigrade Archive**
  *Analysis:* Step 1 (Yes). Step 2 (No, currently inert). Step 3 (No, currently inert). Step 4 (Yes, revivable).
  *Result:* Regulated Entity. Downgrade refused.
  *Reasoning:* Latent viability triggers regulation.
  *Instinct Clash:* The Committee instinct is to downgrade because "nothing is metabolising". The procedure contradicts this.
  *Action:* Uphold the procedure. The risk of accidental revival exists. Mitigate by requiring specific storage protocols rather than lowering containment class.

  **3. The Bio-Hybrid Device**
  *Analysis:* Step 1 (Yes, bio-hybrid). Step 2 (Yes, assembles copies). Step 3 (Depends on tissue evolution). If the tissue evolves, it is Regulated.
  *Result:* Regulated Entity.
  *Reasoning:* The biological driver makes it a replicating biological entity, even if the chassis is mechanical. The supply of parts constitutes the niche (Step 5).

  **Where the Procedure Misfires**

  The procedure struggles with non-replicating biological toxins (e.g., prions) if they are not considered 'entities'. Step 2 might exclude prions if 'copying' is strictly defined as replication rather than conformational conversion. If a proposal involves only prions, Step 2 may yield 'No', yet the risk is high. The Hand-Over Point must catch this: the Chair should override based on the Hygienist's advice on transmissibility.

  Similarly, reversed chirality organisms (Step 1) pass the material check but may be biologically inert in our environment. The procedure classifies them as Regulated due to material basis and potential replication. This may be overly cautious if they cannot interact with native biology, but the uncertainty justifies the containment. The procedure prioritises false positives (over-containment) over false negatives (escape). It misfires when the cost of containment stifles research on entities that are theoretically living but ecologically incapable of survival outside the lab. In these cases, the Hand-Over Point allows the Chair to negotiate specific exemptions with the Director.

  **What the Procedure Cannot Do**

  This procedure cannot assess pathogenicity or toxicity. An entity can be 'living' under this definition but harmless, or 'non-living' but highly toxic. It does not replace risk assessment; it determines jurisdiction. It cannot resolve metaphysical disputes about consciousness or moral status. It is a regulatory gate, not a philosophical truth. Finally, it cannot anticipate technologies that bypass carbon-based chemistry entirely; such proposals will require a new procedure.
