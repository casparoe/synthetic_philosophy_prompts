          *   Harm to the woman (past harm, current stance).
          *   Consent (initial lack, current affirmation).
          *   Children's objection (privacy, legacy, secondary harm).
          *   Institutional role (university gallery, educational mission vs. ethical stewardship).
          *   The nature of the work (constitutive harm vs. incidental harm).
          *   The "Stolen Goods" feeling (complicity).
          *   The Estate's conditions (all or nothing, money attached).
          *   Precedent (what does showing this signal to future artists?).
          *   The "Biography vs. Object" distinction (can they really be separated?).
