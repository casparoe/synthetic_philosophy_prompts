answer: |-
  **Joint Statement of the Oxford Colloquium on Buddhist Ethics**

  **I. Agreed Claims**

  1.  **Diversity:** The Buddhist traditions are historically diverse; no single ethical taxonomy captures all texts, practices, and schools without remainder.
  2.  **Intention and Fruit:** Intention (*cetanā*) determines karmic quality, but karmic fruit (*vipāka*) entails welfare consequences for oneself and others; both are normatively relevant.
  3.  **Precepts:** The precepts function as training rules (*sikkhāpada*) rather than absolute divine commands, yet possess normative force beyond mere heuristic advice.
  4.  **Transgression Narratives:** Compassionate-transgression narratives demonstrate exceptional permissions but do not establish a universal maximising principle for ordinary agents.
  5.  **Classification:** Classification depends on whether one prioritises the criterion of right action or the *telos* of the agent's transformation.

  **II. Residual Disagreements**

  | Domain | Wording acceptable to the Karuṇā (Consequentialist) side | Wording acceptable to the Bhāvanā (Virtue) side |
  | :--- | :--- | :--- |
  | **The Primary Norm** | The right act is that which minimises *dukkha* overall, weighing all sentient beings equally. | The right act is that which expresses and cultivates virtue in the agent, aligning with the perfections. |
  | **The Status of Precepts** | Precepts are rules of thumb for welfare, defeasible when strict adherence increases suffering. | Precepts are constitutive of the path, defeasible only by exceptional realisation or direct insight. |
  | **The Scope of Evaluation** | Evaluation looks outward to the total suffering reduced in the world. | Evaluation looks inward to the character transformation achieved in the agent. |

  **III. The Cruxes**

  We identify three narrow sub-questions such that settling one would move at least one side. We note that part of the dispute is verbal: if 'consequentialism' includes karmic fruit to the agent as a 'consequence', the Karuṇā view expands; if 'Buddhist ethics' refers to ideal theory rather than practical training, the Bhāvanā view holds. We treat these as substantive regarding the structure of evaluation.

  1.  **The Two-Channel Question:** Does an act's karmic fruit to the agent itself belong in the evaluation of the act alongside its effects on others?
  2.  **The Epistemic-Standing Proviso:** Do narratives in which an advanced bodhisattva with knowledge of other minds breaks a precept supply any reason at all to an agent lacking that standing?
  3.  **The Telos Question:** Is awakening valuable solely because it ends suffering (welfare), or does it carry value that is not welfare value?

  **IV. Cases and Predictions**

  For each crux, we stipulate a case both accept as bearing on it. Each side records its prediction in advance.

  **1. The Two-Channel Question: The Relic Case**
  *A custodian monk discovers a venerated relic is a forgery. Belief in it reduces village craving and harm; exposure would collapse this practice. The monk may maintain deception or disclose.*
  *   **Karuṇā Prediction:** Deception is permitted, perhaps required. The welfare gain for the villagers outweighs the karmic cost to the monk. The act is evaluated by the net reduction of *dukkha*.
  *   **Bhāvanā Prediction:** Deception is prohibited. Lying corrupts the monk's virtue and undermines the path. Truthfulness is constitutive of the agent's transformation, regardless of external welfare gains.

  **2. The Epistemic-Standing Proviso: The Longitudinal Pattern**
  *A twenty-year study of Theravāda forest-monastery practitioners finds that deepening concentration predicts reduced sensitivity to outcome-magnitude in dilemmas and increased unwillingness to breach a precept even where breaching it would help others.*
  *   **Karuṇā Prediction:** If practitioners ignore outcomes, the tradition is failing consequentialist rationality. This result would move us to admit Buddhist ethics is not consequentialist in practice, only in ideal theory.
  *   **Bhāvanā Prediction:** If practitioners uphold precepts despite outcomes, this confirms virtue-ethical training. The pattern shows the precepts are not heuristic but constitutive of the concentrated mind.

  **3. The Telos Question: The Isolated Awakening**
  *Suppose a being's awakening is stipulated to have no downstream effects on any other being—no teaching, no example, no relics, no one ever learns of it.*
  *   **Karuṇā Prediction:** If no suffering is reduced elsewhere, the value is limited to the awakener. This suggests welfare centrality: awakening is good because it ends the awakener's suffering, not because it is intrinsically perfect.
  *   **Bhāvanā Prediction:** Awakening is intrinsically good regardless of external effects. This suggests non-welfare value: the perfection of the agent is the final good, not merely the cessation of negative states.

  **V. Conclusion on Verbal Dispute**

  We acknowledge that if the Karuṇā side accepts karmic fruit to the agent as a 'consequence', and the Bhāvanā side accepts that virtue cultivation ultimately reduces suffering, the distinction narrows to a difference in emphasis rather than structure. However, regarding the Relic Case, the disagreement remains substantive: one side prioritises the state of the world, the other the state of the soul. We sign this statement to record that while we share a map of the territory, we still walk different paths.
