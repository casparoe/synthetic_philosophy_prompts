answer: |-
  # Joint Statement on Rational Expectations, Common Priors, and Market Volume

  **Participants:**  
  **Camp A (Theory):** Proponent of Common-Prior Rational Expectations (Aumann/Milgrom–Stokey framework).  
  **Camp B (Microstructure):** Proponent of Heterogeneous Priors and Market Frictions (Real-world Microstructure).  

  **Date:** 24 October 2023  
  **Status:** Adversarial Collaboration Draft  

  ---

  ## 1. Agreed Claims

  Both camps affirm the following propositions. These statements are intended to be precise enough to withstand scrutiny from either side, avoiding vague compromises.

  1.  **Conditional Validity of No-Trade Theorems:** The Milgrom–Stokey no-trade theorem and Aumann's agreeing-to-disagree result are mathematically valid *within their specified assumptions*. Specifically, if agents share a common prior, update via Bayes' rule, possess common knowledge of each other's rationality and posteriors, and trade purely for speculative gain, then no trade can occur in equilibrium. Neither camp claims these theorems contain mathematical errors.
  2.  **The Reality of Volume:** The observed volume of trading in major financial markets (equities, FX, derivatives) is orders of magnitude larger than can be explained by exogenous liquidity shocks or life-cycle rebalancing alone. This volume is a robust empirical phenomenon that requires explanation; it is not a rounding error or a data artefact.
  3.  **The Grossman–Stiglitz Constraint:** Both camps accept the Grossman–Stiglitz (1980) paradox: prices cannot be perfectly informationally efficient. If prices fully revealed all private information, no agent would have an incentive to incur the cost of gathering that information. Therefore, some degree of informational inefficiency is necessary to sustain information production.
  4.  **Existence of Non-Speculative Trade:** Both camps agree that a portion of market volume is driven by non-speculative motives, including hedging of exogenous endowments, regulatory rebalancing, and liquidity management. Neither camp claims *all* trade is speculative.
  5.  **Model vs. Reality:** Both camps agree that economic models are simplifications. Camp A views the no-trade result as a consistency benchmark for rationality; Camp B views it as a frictionless idealisation that omits key drivers of human behaviour. Neither side claims their model is a complete description of reality.

  ---

  ## 2. Disagreements Table

  The following table outlines the remaining substantive disagreements. The wording has been negotiated so that each camp recognises its own position in the description.

  | Topic | Camp A (Theory) Position | Camp B (Microstructure) Position |
  | :--- | :--- | :--- |
  | **1. Origin of Priors** | Heterogeneous priors among rational agents are logically inconsistent. If two agents start with different priors, at least one is making a mistake upstream (e.g., mishandling evidence). Rationality implies a single "correct" prior given the same universe of information. | Heterogeneous priors are an empirical fact and may be rational given bounded computational resources or different structural models of the world. Insisting on a common prior imposes a constraint that real agents cannot and should not meet. |
  | **2. Attribution of Volume** | Once liquidity and hedging needs are netted out, the remaining "speculative" volume is an anomaly under the common-prior assumption. It suggests widespread irrationality, overconfidence, or a failure of common knowledge. | A significant proportion of volume is legitimate speculative trade driven by genuine disagreement. This disagreement is the primary mechanism for price discovery, not a bug or a sign of systemic irrationality. |
  | **3. Normative Weight** | The no-trade theorem sets a normative standard. If agents are trading speculatively, they are effectively betting against a counterparty who they know must be equally rational. This should be viewed as a coherence failure akin to a Dutch Book. | The no-trade theorem sets an unrealistic baseline. Markets are mechanisms for aggregating diverse views, not just updating on a single truth. The "failure" to satisfy the theorem is a feature of a complex adaptive system, not a rationality error. |
  | **4. Definition of 'Trade'** | A sharp distinction exists between 'speculative trade' (betting on price moves based on information) and 'liquidity trade' (trading for external needs). The theorems apply strictly to the former. | The distinction is blurry in practice. A rebalancing trade often contains a speculative element (timing the rebalance), and a speculative trade often serves a liquidity function for the counterparty. Categorising volume is messier than the theory allows. |

  ---

  ## 3. The Cruxes

  These are the specific sub-questions where resolution would materially shift the debate. We have also identified where a disagreement may be merely verbal.

  **Crux 1: The Rationality of Differing Priors**  
  *Question:* Is it possible for two agents, both processing information correctly according to their own lights, to rationally maintain different priors indefinitely?  
  *Significance:* If Camp A is correct, then most speculative trading is fundamentally irrational. If Camp B is correct, the common-prior assumption is the flaw, not the traders.

  **Crux 2: Volume Decomposition**  
  *Question:* What percentage of daily trading volume in liquid markets (e.g., S&P 500 futures) is attributable to pure liquidity/hedging demand versus pure speculative disagreement?  
  *Significance:* Camp A suspects the speculative portion is small or driven by noise. Camp B suspects the speculative portion is dominant.

  **Crux 3: The Definition of 'Information' (Verbal Dispute Check)**  
  *Question:* Does "private information" include higher-order beliefs (i.e., beliefs about other traders' beliefs)?  
  *Analysis:* Camp A tends to define information broadly to include the inference drawn from the *fact* that someone is willing to trade. Camp B tends to define information as fundamental data (earnings, macro prints).  
  *Mediator Note:* If Camp A's no-trade result relies on traders inferring information from the trade itself (order flow), and Camp B argues traders ignore order flow signals, this is partly a dispute about *how* agents process information, not just what they know. However, if Camp A defines "rationality" to *require* processing order flow as information, while Camp B defines "rationality" to allow ignoring it due to complexity, this is a genuine disagreement about the bounds of rationality, not just semantics. **Verdict:** Partially verbal, but rests on a genuine disagreement about the cognitive costs of higher-order reasoning.

  ---

  ## 4. Concrete Cases and Predictions

  For each genuine crux, we propose a specific market, experiment, or observable phenomenon. Both sides commit to the predictions below.

  ### Case 1: Pure Prediction Markets (e.g., Oscars, Non-Hedgeable Elections)
  *Context:* Markets where participants have no exogenous exposure to the outcome (no hedging motive) and the asset resolves to a fixed value.
  *   **Camp A Prediction:** Volume should be low relative to open-interest. Without hedging needs, only those with genuine information should trade. Since information on such events is scarce and common priors should converge quickly on the odds, speculative volume should dry up as the event nears.
  *   **Camp B Prediction:** Volume will remain high until the event resolves. Disagreement persists due to heterogeneous priors (different models of voter behaviour or academy preferences) and overconfidence. The "entertainment" value and difference of opinion sustain liquidity even without hedging.

  ### Case 2: Laboratory Asset Markets with Controlled Priors
  *Context:* Experimental economics settings where subjects are assigned identical priors and private signals, and rationality is incentivised with real money.
  *   **Camp A Prediction:** If the common prior is truly common knowledge and signals are publicised as such, speculative trade should vanish after a few rounds. Any remaining trade is due to subjects failing to understand the rules (bounded rationality).
  *   **Camp B Prediction:** Even with controlled priors, subjects will trade excessively. Humans naturally behave as if they have heterogeneous priors (overweighting their own signal). The no-trade equilibrium is unstable in human populations regardless of the experimental setup.

  ### Case 3: High-Frequency Trading (HFT) Inventory Data
  *Context:* Regulatory data on HFT firms showing end-of-day inventory positions.
  *   **Camp A Prediction:** HFT firms should hold near-zero net inventory overnight. They are providing liquidity, not taking speculative positions. If they hold significant inventory, they are acting as speculative dealers, which contradicts the pure liquidity-provision model.
  *   **Camp B Prediction:** HFT firms will show significant intraday speculative positioning, even if flattened overnight. Their volume is not just matching buyers and sellers; it is actively betting on short-term price dislocations based on proprietary models (heterogeneous priors on microstructure).

  ---

  **Signatures:**

  _________________________ (Camp A)

  _________________________ (Camp B)

  _________________________ (Mediator)
