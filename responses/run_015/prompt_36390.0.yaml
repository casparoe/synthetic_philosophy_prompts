prompt: |-
  I'm a senior analyst at a national body that decides which health services get publicly funded. We have informally adopted a policy of giving priority to the worse off — benefits to more disadvantaged patients count for more than equal benefits to better-off ones — but we have no worked-out method, and committee members keep disputing particular cases on instinct. Please write a decision procedure my team can actually run on a funding proposal.

  Context: we make roughly ten of these decisions a year, each involving thousands of patients and significant budgets. An analyst has about two weeks per case, with QALY-style effectiveness estimates and subgroup data, but no way of making fine-grained interpersonal utility comparisons. Final sign-off is by a mixed committee of clinicians, economists, and lay members, so every step must be explainable to a non-theorist in a paragraph.

  The procedure should cover, in order: how to characterize the relevant sense of "worse off," including when current condition, lifetime health prospects, and socioeconomic position point in different directions and which controls; how to set the priority weights, and how to report the recommendations that flip as the weights vary; an explicit leveling-down test — what the procedure should say about a policy that benefits no one but narrows the gap between groups, and whether prioritarianism has any principled basis for rejecting it; and the points at which the questions stop being technical and must go to the committee as questions of values.

  Then run the procedure on three cases: (1) a drug extending life by a few months for patients with a severe progressive condition, competing against a mental-health program with a larger total benefit spread across many mildly affected people; (2) a case where following the procedure's own weights yields a recommendation I will dislike — a small benefit to the very worst off purchased at a very large cost in aggregate health — and the procedure must show how it handles that rather than hiding it; and (3) a rationing rule that withholds a service from the better-off group without extending it to anyone, which is pure leveling-down.

  You are a professional philosopher specializing in distributive justice, with experience translating theory for health priority-setting bodies. Before writing anything, brainstorm which distinctions from the prioritarianism literature must survive the simplification — e.g., prioritarianism's reason for rejecting leveling-down versus the objection's usual use against egalitarianism — and which can safely be dropped. Mark honestly wherever the procedure cannot settle the matter. Answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Senior analyst at a national health funding body.
      *   **Task:** Create a practical decision procedure for prioritizing the "worse off" in health funding decisions.
      *   **Context:** ~10 decisions/year, high stakes (budgets/patients), 2 weeks/analyst, QALY data available, no fine-grained interpersonal utility comparisons. Committee is mixed (clinicians, economists, lay). Needs to be explainable.
      *   **Requirements:**
          1.  Characterize "worse off" (current condition vs. lifetime vs. SES).
          2.  Set priority weights & report sensitivity analysis.
          3.  Explicit leveling-down test (addressing prioritarianism vs. egalitarianism).
          4.  Identify value judgment points for the committee.
          5.  Run the procedure on three specific cases (Severe vs. Mild, High Cost/Small Benefit for Worst Off, Pure Leveling-Down).
      *   **Persona:** Professional philosopher specializing in distributive justice, experienced in translation for policy.
      *   **Tone:** American English, professional, honest about limitations.
      *   **Pre-computation:** Brainstorm distinctions from prioritarianism literature (what to keep vs. drop).

  2.  **Philosophical Brainstorming & Simplification (The "Pre-Write" Step):**
      *   *Core Theory:* Prioritarianism (Parfit). Benefits to the worse off matter more. Distinct from Egalitarianism (which cares about the *gap*).
      *   *Key Distinction to Keep:* The "Leveling Down Objection." Egalitarianism implies leveling down is good in one respect (equality); Prioritarianism says no, because no one is better off. This is crucial for the user's requirement #3.
      *   *Key Distinction to Keep:* "Worse Off" metric. Is it health only or all-purpose? In health funding, it must be health-focused (QALYs) but perhaps adjusted for SES if mandated by policy. Let's stick to *health* prioritarianism for feasibility, with a note on SES.
      *   *What to Drop:* Complex interpersonal utility comparisons. We can't measure "utility," we measure QALYs. We need a weighting function applied to QALYs.
      *   *What to Drop:* Exact functional forms (e.g., square root vs. logarithmic) unless necessary. Let's use a simple weighting coefficient system for transparency.
      *   *The "Fair Innings" Argument:* Relevant for lifetime health prospects. Needs to be integrated into the "Worse Off" definition.
      *   *Transparency:* The procedure must show *where* the value judgment lies (the weight), not hide it in the math.

  3.  **Drafting the Decision Procedure (The "Core"):**
      *   *Step 1: Define "Worse Off".* Needs to be operational. Let's use "Baseline Health Status" (current QALY expectation without treatment). Why? Because lifetime health is hard to calculate per case, and SES is outside health mandate usually, but we need a rule for conflicts. *Decision:* Prioritize current health severity, but flag lifetime deficit (fair innings) as a secondary modifier. SES is a tie-breaker or separate policy layer, not core health prioritarianism.
      *   *Step 2: The Weighting Function.* How to apply priority? A "Priority Weight" ($w$). If $w=1$, utilitarian. If $w>1$, prioritarian. We need a range (sensitivity analysis).
      *   *Step 3: The Calculation.* Weighted QALYs = QALYs $\times$ $w$. Compare interventions.
      *   *Step 4: Leveling Down Test.* Explicit check: Does this reduce total health to reduce inequality? If yes, Prioritarianism rejects it.
      *   *Step 5: Committee Triggers.* Where does the analyst stop? Setting the weight $w$. Accepting efficiency losses.

  4.  **Running the Cases:**
      *   *Case 1 (Severe vs. Mild):* Classic severity vs. efficiency. The procedure should show the crossover point where severity weight outweighs total QALYs.
      *   *Case 2 (The "Unpleasant" Result):* Small benefit to very worst off at huge cost. Prioritarianism *can* imply this (strong priority). The procedure must expose this trade-off honestly. "Efficiency Cost of Priority."
      *   *Case 3 (Leveling Down):* Withholding from better-off without helping worse-off. The procedure must flag this as impermissible under Prioritarianism (unlike strict Egalitarianism).

  5.  **Refining the Tone and Constraints:**
      *   *Explainability:* Every step needs a "Lay Summary."
      *   *Honesty:* Acknowledge that the *weight* is a moral choice, not a technical one.
      *   *American English:* Check spelling (prioritization, program, etc.).
      *   *Philosopher Persona:* Ensure the distinction between prioritarianism and egalitarianism is clear in the leveling-down section.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is defining "worse off" just by baseline health too simple?
      *   *Fix:* Add the "Fair Innings" caveat. If a young person and old person have the same current health, the young person is "worse off" in terms of lifetime prospects.
      *   *Critique:* How do we set the weight without interpersonal utility?
      *   *Fix:* We don't set *one* weight. We present a *threshold analysis*. "At weight 1.5, we choose A. At weight 2.0, we choose B." The committee chooses the weight.
      *   *Critique:* Is the Leveling Down test clear?
      *   *Fix:* Make it a binary gate. "Does anyone gain health?" If No, Stop.

  7.  **Final Polish:** Check against all prompt requirements.
      *   Characterize worse off? Yes.
      *   Set weights/report variation? Yes.
      *   Leveling-down test? Yes.
      *   Value judgment points? Yes.
      *   Three cases run? Yes.
      *   Brainstorming section included? Yes.
      *   American English? Yes.

  8.  *(Final thought before generating)*: Ensure the distinction between *Prioritarianism* (absolute priority to the worse off) and *Sufficientarianism* (enough is enough) doesn't get muddled. Stick to Prioritarianism as requested ("benefits... count for more").

  Let's assemble the response.
answer: |-
  ### Preliminary Philosophical Brainstorming

  Before drafting the procedure, I must determine which theoretical distinctions are essential for your context and which are too abstract for a two-week analyst timeline.

  **Distinctions to Retain:**
  1.  **Prioritarianism vs. Egalitarianism:** This is critical for the leveling-down test. Egalitarianism values equality *itself*; Prioritarianism values benefiting people *because* they are worse off. If we don't make this distinction, the committee will confuse "closing the gap" with "helping the sick."
  2.  **Absolute vs. Relative "Worse Off":** We must decide if "worse off" means "sicker right now" (current health) or "had less health over a life" (fair innings). For operational feasibility, we must prioritize *current health severity* but allow *lifetime deficit* as a modifier.
  3.  **The Weight as a Value Parameter:** The math cannot hide the moral choice. The "priority weight" must be presented as a dial the committee turns, not a number the analyst discovers.

  **Distinctions to Drop:**
  1.  **Ex Ante vs. Ex Post Prioritarianism:** This distinction (prioritizing based on expected prospects before treatment vs. actual outcomes after) is too technically demanding for QALY-based submissions. We will treat "worse off" as baseline health status at the time of decision.
  2.  **Interpersonal Utility Comparisons:** You explicitly noted these are impossible. We will use QALYs as the common currency, acknowledging this assumes health is comparable across conditions, which is a standard health-economic simplification.
  3.  **Specific Functional Forms:** We will not mandate a specific concave transformation function (e.g., square root of QALYs). We will use a linear weighting coefficient for transparency. It is less theoretically pure but more explainable to lay members.

  ***

  ### The Priority-Weighted Decision Procedure (PWDP)

  **Purpose:** To operationalize the policy of prioritizing the worse off while maintaining transparency about efficiency costs and value judgments.
  **Audience:** Analysts (for calculation), Committee (for decision).
  **Timeframe:** Designed for a 2-week analysis window.

  #### Step 1: Characterizing "Worse Off"
  **Analyst Instruction:** Identify the "Priority Group" for each intervention.
  **Rule:** "Worse off" is defined primarily by **Baseline Health Status** (expected QALYs without treatment).
  **Conflict Resolution:**
  1.  **Current vs. Lifetime:** If Group A has worse current health but Group B has had worse health over their lifetime (e.g., a chronic condition since birth vs. acute terminal illness in old age), classify Group B as worse off *only if* the lifetime deficit exceeds 20% of expected normal lifespan. Otherwise, default to current severity.
  2.  **Health vs. Socioeconomic Status (SES):** Do not adjust weights for SES directly. SES is a separate equity consideration. If SES and health severity point in opposite directions, report them as separate columns in the summary. Do not combine them into a single index.
  **Lay Summary:** *We define "worse off" mainly by how sick you are right now. We make an exception for younger patients who have been sick their whole lives, but we do not mix this with income or social status.*

  #### Step 2: Setting Priority Weights & Sensitivity Analysis
  **Analyst Instruction:** Do not select a single priority weight. Calculate the **Weighted Benefit** for each option using three weights:
  *   **$w = 1.0$ (Utilitarian):** Every QALY counts equally.
  *   **$w = 1.5$ (Moderate Priority):** Benefits to the worse off count 50% more.
  *   **$w = 2.0$ (Strong Priority):** Benefits to the worse off count double.
  **Calculation:** $\text{Weighted Benefit} = \text{Total QALYs} \times \text{Priority Weight}$.
  *(Note: Apply the weight only to the QALYs gained by the identified Priority Group.)*
  **Reporting:** Present a "Crossover Table." Show at which weight the recommendation flips from Option A to Option B.
  **Lay Summary:** *We don't guess how much extra importance to give the sick. Instead, we show the Committee: "If you value their health 1.5 times more than others, choose Drug A. If you value it 2 times more, choose Drug B."*

  #### Step 3: The Leveling-Down Test
  **Analyst Instruction:** Apply this filter before calculation.
  **Question:** Does the proposed policy reduce total health capacity or deny treatment to one group *without* improving the health of any other group?
  **Rule:** If **YES**, the policy fails the Prioritarian Test. Mark as "Not Recommended" regardless of inequality metrics.
  **Rationale:** Prioritarianism cares about helping the worse off, not merely narrowing gaps. Making everyone equally sick helps no one.
  **Lay Summary:** *We do not support making healthy people sick just to match the sick. Priority means lifting the bottom up, not pulling the top down.*

  #### Step 4: Identifying Value Judgments (The "Committee Trigger")
  **Analyst Instruction:** Highlight the following for Committee vote. These are not technical questions.
  1.  **The Weight:** Which weight ($1.0, 1.5, 2.0$) reflects our social values?
  2.  **The Efficiency Cost:** If the Priority choice reduces total population health, is the loss acceptable? (Report the loss in QALYs).
  3.  **The Definition:** Does the Committee agree with the "Lifetime Defect" exception in Step 1?
  **Lay Summary:** *The math shows the trade-offs. The Committee must decide how much total health we are willing to sacrifice to help the worst off.*

  ***

  ### Application of Procedure to Three Cases

  #### Case 1: Severe Progressive Condition vs. Mild Mental Health Program
  **Scenario:**
  *   **Option A (Severe):** 1,000 patients. Gain 0.2 QALYs each. Total = 200 QALYs. Baseline health is very low (Priority Group).
  *   **Option B (Mild):** 10,000 patients. Gain 0.05 QALYs each. Total = 500 QALYs. Baseline health is moderate (Non-Priority).

  **Procedure Run:**
  1.  **Characterization:** Option A patients are "Worse Off" (severe progressive). Option B patients are not.
  2.  **Calculation:**
      *   *Weight 1.0:* Option A = 200; Option B = 500. **Choose B.**
      *   *Weight 1.5:* Option A = $200 \times 1.5 = 300$; Option B = 500. **Choose B.**
      *   *Weight 2.0:* Option A = $200 \times 2.0 = 400$; Option B = 500. **Choose B.**
      *   *Weight 2.5:* Option A = $200 \times 2.5 = 500$; Option B = 500. **Tie.**
      *   *Weight 3.0:* Option A = 600; Option B = 500. **Choose A.**
  3.  **Result:** The recommendation flips only at a weight of 2.5 or higher.
  4.  **Committee Trigger:** The analyst reports: "To fund the severe condition over the mental health program, the Committee must agree that a QALY for the severe group is worth *at least* 2.5 times a QALY for the mild group. This comes at a cost of 100 unweighted QALYs to the population."

  **Analysis:** This prevents instinctive arguing. The clinicians may argue for A, the economists for B. The procedure forces them to agree on the *weight* required to justify A.

  #### Case 2: The "Unpleasant" Result (High Cost, Small Benefit for Worst Off)
  **Scenario:**
  *   **Option A (Worst Off):** 50 patients with rare, fatal disease. Gain 0.1 QALYs each. Total = 5 QALYs. Cost: $50M.
  *   **Option B (Better Off):** 5,000 patients with manageable condition. Gain 0.5 QALYs each. Total = 2,500 QALYs. Cost: $50M.
  *   **Constraint:** Budget allows only one.

  **Procedure Run:**
  1.  **Characterization:** Option A patients are definitively "Worse Off" (fatal vs. manageable).
  2.  **Calculation:**
      *   *Weight 1.0:* Option A = 5; Option B = 2,500. **Choose B.**
      *   *Weight 2.0:* Option A = 10; Option B = 2,500. **Choose B.**
      *   *Weight 100.0:* Option A = 500; Option B = 2,500. **Choose B.**
      *   *Weight 500.0:* Option A = 2,500; Option B = 2,500. **Tie.**
  3.  **Result:** To choose Option A, the Committee must assign a priority weight of 500.
  4.  **Reporting:** The analyst must explicitly state: "Prioritizing the worst-off group here requires valuing their health gains 500 times more than the larger group. This results in a net loss of 2,495 QALYs to the population."
  5.  **Handling the Dislike:** If the analyst (or Committee) dislikes this result, the procedure does not hide it. It forces the admission: "Our commitment to the worst off is not strong enough to justify this specific cost."
  6.  **Committee Trigger:** This is a "Hard Limit" trigger. The procedure signals that standard prioritarian weights (1.5–3.0) will *never* justify Option A. If the Committee chooses A, they are not applying prioritarianism; they are applying a "Rescue Principle" (save whoever is dying now regardless of cost). The analyst must label this deviation explicitly.

  **Analysis:** This satisfies your requirement to show the trade-off rather than hide it. It distinguishes between *priority* (weighting) and *rescue* (ignoring cost-effectiveness entirely).

  #### Case 3: Pure Leveling-Down (Rationing Rule)
  **Scenario:**
  *   **Current State:** Group Rich gets a drug (Benefit 100 QALYs). Group Poor does not (Benefit 0 QALYs). Inequality exists.
  *   **Proposal:** Withhold the drug from Group Rich to save money. Group Poor still does not get the drug (due to other constraints). Total health decreases by 100 QALYs. Inequality decreases.

  **Procedure Run:**
  1.  **Leveling-Down Test:**
      *   *Question:* Does anyone gain health? **No.**
      *   *Question:* Does total health decrease? **Yes.**
  2.  **Result:** **Fail.** The procedure recommends rejecting the proposal immediately.
  3.  **Rationale:** Under Prioritarianism, inequality is bad only because it correlates with people being worse off. If no one is made better off, the reduction in inequality has no value.
  4.  **Reporting:** "This proposal reduces population health without benefiting the disadvantaged. It is consistent with strict Egalitarianism but inconsistent with our Prioritarian policy."
  5.  **Committee Trigger:** If the Committee wishes to proceed, they must acknowledge they are prioritizing "symbolic equality" over "patient health."

  **Analysis:** This is the clearest philosophical win for the procedure. It protects the body from accusations of "cutting care to be fair" by grounding the rejection in the mandate to *fund health services*, not to engineer social statistics.

  ***

  ### Limitations and Analyst Notes

  **Where the Procedure Cannot Settle the Matter:**
  1.  **The Cap on Priority:** The procedure shows *what* weight is needed to flip a decision, but it cannot tell the Committee *what* weight is morally correct. A weight of 3.0 is not "true" and 1.0 is not "false"; they represent different social contracts.
  2.  **The Definition of "Worse Off":** Step 1 uses a 20% lifetime deficit rule. This is arbitrary. If the Committee disagrees with this threshold, the math changes.
  3.  **Non-Health Benefits:** If the mental health program in Case 1 improves ability to work (economic benefit), this procedure ignores it. It is health-prioritarian, not all-purpose prioritarian.

  **Final Advice for the Analyst:**
  Your role is not to solve the moral dilemma but to map its contours. When committee members argue on instinct, refer them to the **Crossover Table** (Case 1) or the **Leveling-Down Test** (Case 3). If they insist on Case 2 (High Cost/Small Benefit), ensure the minutes record that they are overriding the efficiency threshold for a "Rescue Principle," so the precedent is clear for future cases.
