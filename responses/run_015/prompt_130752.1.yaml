  # THE ALIVENESS TIER LIST

  ### TIER 1: PARADIGMATICALLY ALIVE (85–100)
  *   **Mule** | Main: 100 / Upkeep: 90 | Sterile yet metabolically vigorous, demanding constant energy to fight entropy.
  *   **Slime Mould** | Main: 95 / Upkeep: 90 | Exhibits complex problem-solving behaviour driven by sustained internal regulation.
  *   **Synthetic Bacterium** | Main: 90 / Upkeep: 85 | Engineered metabolism persists autonomously despite significant genomic ignorance.
  *   **HeLa Cells** | Main: 85 / Upkeep: 85 | Metabolically independent and evolving in culture, though detached from an organism.

  ### TIER 2: METABOLICALLY ALIVE (60–84)
  *   **Tardigrade (Active)** | Main: 80 / Upkeep: 80 | Standard animal physiology requiring continuous resource intake to maintain order.
  *   **Bacterial Spore (Revived)** | Main: 75 / Upkeep: 40 | Scores high on revival but persistence was initially owed to inert cryptobiosis.
  *   **Tardigrade (Tun State)** | Main: 45 / Upkeep: 05 | Metabolically undetectable; persistence is entirely a function of structural inertness.

  ### TIER 3: BORDERLINE ENTITIES (30–59)
  *   **Giant Virus** | Main: 40 / Upkeep: 30 | Possesses genetic complexity but lacks self-sustaining chemistry outside a host.
  *   **Prion** | Main: 25 / Upkeep: 20 | Replicates via conformational change but lacks genome or metabolic activity.
  *   **Computer Worm** | Main: 20 / Upkeep: 70 | High upkeep via electricity and processing, yet lacks physical chemistry or biology.

  ### TIER 4: DEAD MIMICS (0–29)
  *   **Fire Front** | Main: 15 / Upkeep: 95 | Consumes fuel and spreads rapidly but possesses no structure to maintain or harm.
  *   **Mailing List** | Main: 10 / Upkeep: 20 | Memetic replication relies entirely on human agency and server inertness.

  ***

  ### CRITERION RESHUFFLES
  **Upkeep Ratio:** Promotes **Fire** and **Computer Worm** significantly; demotes **Spores** and **Tuns** to near-zero as their persistence is passive.
  **Astrobiology (Chemistry + Darwin):** Drops **Mule** (sterile) and **Virus** (not self-sustaining); boosts **HeLa** (somatic evolution).
  **Good of Its Own (Harmability):** Eliminates **Fire**, **Worm**, and **List** entirely; retains **Mule** and **Cells** as subjects of welfare.

  ### THE CUTOFF & UNCERTAINTY
  **The Cutoff:** The **Giant Virus** sits precisely on the line; unlike the Prion, it evolves, but unlike the Bacterium, it cannot sustain itself.
  **Biological Uncertainty:** Scores for the **Synthetic Bacterium** and **Giant Virus** are provisional; unknown gene functions obscure whether their persistence is truly autonomous.
