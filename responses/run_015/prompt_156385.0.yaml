  Dear Friend,

  It is a pleasure to engage with such a carefully curated set of intuitions regarding explanation, reduction, and emergence. You have asked whether there is a single principle that captures the distinctions you are drawing between legitimate cranes, illegitimate skyhooks, and greedy reductionisms, and whether your verdicts contain an irreconcilable tension. After reflecting on the cases you provided, I believe your intuitions are remarkably consistent and can be unified under a principle I would call Explanatory Preservation. This principle holds that a legitimate multi-level explanation must provide a mechanistic or functional bridge between levels without eliminating the causal or normative efficacy that defines the phenomenon at the higher level. In other words, a good explanation connects the dots without erasing the picture.

  When you accept the evolutionary explanation of the eye or the reciprocal cooperation model for altruism, you are accepting accounts that provide stepwise mechanisms while preserving the functional reality of the eye or the cooperative behavior. Conversely, when you reject the claim that consciousness simply emerges at a complexity threshold without further explanation, you are rejecting a skyhook because it offers no mechanism; it asserts a connection without building the crane. Similarly, the Platonic realm is a skyhook because it posits a causal interaction without any mechanistic account of how that interaction occurs, rendering it empirically inert. On the other side of the distinction, your rejection of greedy reductionism arises when the explanation succeeds in finding a lower-level mechanism but fails to preserve the defining properties of the higher-level phenomenon. The quantum-state explanation of an empire's fall is technically mechanistic but eliminates the causal efficacy of institutions and droughts, which are the relevant variables at the historical scale. Likewise, explaining Kantian morality solely as an evolutionary signaling strategy is rejected because it collapses the normative force of moral obligations into a descriptive account of survival strategies, thereby explaining away the very thing that makes morality matter to us. The artistic creativity case follows the same pattern; reducing the richness of art to sexual selection eliminates the cultural and aesthetic content that constitutes the phenomenon.

  This principle of Explanatory Preservation also clarifies your acceptance of Integrated Information Theory versus your rejection of evolutionary ethics. You accept Integrated Information Theory not because it fully reduces consciousness to physics, but because it offers a formal, empirically testable structure that tracks the phenomenon of consciousness without denying its existence. It attempts to map the structure of experience rather than explain it away as an illusion. In contrast, the evolutionary explanation of Kantian morality is rejected because it treats normative validity as nothing but a descriptive strategy, violating the preservation of the normative domain. There is no irreconcilable tension here provided you maintain a distinction between natural kinds, which can be identified with physical or functional structures, and normative claims, which possess a validity that cannot be reduced to causal origins without loss. Your verdicts suggest that you view consciousness as a natural phenomenon amenable to structural identification, whereas you view morality as a normative practice that loses its essence if reduced to mere biological strategy.

  Applying this principle to the case of psychiatric depression explained primarily through inflammatory cytokine activity while bracketing psychological and social factors, the prediction is clear. You should regard this as a form of greedy reductionism. While cytokine activity may be a genuine mechanistic component, bracketing the psychological and social factors eliminates the causal efficacy of the patient's lived experience, social context, and cognitive patterns, which are essential to the phenomenon of depression as it is diagnosed and treated. Just as the quantum explanation of an empire's fall misses the relevant causal structure of institutions, a purely immunological explanation of depression misses the relevant causal structure of the mind and society. A legitimate crane would integrate the cytokine activity as a mechanism within a bio-psycho-social model, preserving the explanatory autonomy of the psychological and social levels.

  If you were forced to adopt a simpler principle, such as a strict prohibition against any identity claims across levels of explanation, you would indeed have to overturn your verdict on Integrated Information Theory. A strict non-reductionist might argue that defining consciousness as integrated information is itself a reduction that risks ignoring the subjective qualitative character of experience, potentially making it as problematic as the threshold view you rejected. However, I would advise against overturning this verdict because Integrated Information Theory differs crucially from the threshold view by offering empirical tractability and formal structure. The tension you perceive is only apparent if one conflates natural identification with normative elimination. Your current set of verdicts is robust because it respects the integrity of different domains of inquiry. You allow reduction where it preserves the phenomenon, as with the thermostat or the eye, and you resist it where it eliminates the phenomenon, as with morality or art. This nuanced stance is superior to a simplistic rule because it acknowledges that the world is stratified, and each layer has its own real patterns that demand explanation on their own terms, even as they are grounded in the layers below.

  Sincerely,

  A Correspondent
