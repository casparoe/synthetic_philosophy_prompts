answer: |-
  PREP SHEET: JOB TALK Q&A
  **Talk:** Epistemic Palimpsests
  **Vibe:** Don't get cute. You're asking historians to rethink their filing cabinets while asking philosophers to get their hands dirty with archives. Walk the line.

  Here's the order of fire, based on who's sitting where and how much blood they can draw.

  ---

  ### 1. The Medievalist's Snipe (Presentism/Ahistorical)
  **Likelihood:** High (they told you already). **Damage:** Critical (kills your credibility as a historian-adjacent).
  **Voice:** "You're treating medieval materials as data points for a modern philosophical theory about forgetting. Isn't this just presentism with extra steps? You're claiming the Middle Ages is a 'forgetting machine,' but that's a category error. The Middle Ages didn't know it was the Middle Ages."

  *   **Concede Upfront:** Absolutely. The actors didn't call it a "forgetting machine." That's my analytic layer, not their ontology.
  *   **Hold Ground:** But the *effect* is material. The way we archive, teach, and cite creates the machine now, even if they didn't name it then.
  *   **2-Minute Reply:** "You're right, 'Middle Ages' is a later label. But my claim isn't about their self-conception; it's about our current infrastructure. When we put a 14th-century text in a 'Medieval' bucket and a 16th-century text in 'Early Modern,' we actively prevent seeing the continuity of, say, optics or logic. The 'machine' isn't in the past; it's in our departmental structures and journal scopes. I'm not accusing Roger Bacon of forgetting; I'm accusing our citation practices of forcing us to forget him when we talk about Baconian method. It's a critique of current historiography, not a claim about medieval intent."
  *   **Weakest Spot:** If they push on whether you've actually read the medieval texts or just theorized *about* them. If you sound like you're doing philosophy *on* history rather than *with* it, you lose.

  ### 2. The Historians' Pragmatism (Utility/Archives)
  **Likelihood:** Very High (half the room). **Damage:** Medium-High (makes you look useless).
  **Voice:** "Look, we know periods are fuzzy. But I need to teach a survey course next week. I need to write a grant proposal that fits a specific call. If these categories are 'impossible by design,' what do I do? Stop using them? You're critiquing the tool without handing me a new screwdriver."

  *   **Concede Upfront:** I'm not asking you to burn the syllabus. These buckets work for organization.
  *   **Hold Ground:** They work *too* well. They smooth over the ruptures that are actually interesting.
  *   **2-Minute Reply:** "I'm not suggesting we ban the terms tomorrow. That's impractical. I'm suggesting we treat them as hazardous materials. When you use 'Scientific Revolution,' mark it as a functional device, not a natural kind. My point is that the 'fuzziness' isn't a bug we need to fix with better definitions; it's a feature that protects disciplinary turf. If you want to do cross-period work, don't try to sharpen the borders. Acknowledge the border is a wall, and look for the tunnels. Use the periods, but cite the exclusionary work they're doing in your footnote. Make the forgetting visible."
  *   **Weakest Spot:** This sounds vague. "Make the forgetting visible" is nice philosophy, but a historian wants to know how that changes their archival search strategy. Be ready to give a concrete example of a search query or archive box you'd approach differently.

  ### 3. The Philosophers' Ontology (Incommensurability)
  **Likelihood:** Medium. **Damage:** Medium (theoretical nitpicking).
  **Voice:** "This sounds like Kuhnian incommensurability but sociologized. Are you saying the periods are ontologically real structures that cause forgetting, or just epistemic frameworks? If it's a 'machine,' what's the mechanism? Is it cognitive or institutional?"

  *   **Concede Upfront:** It definitely rhymes with Kuhn and the incommensurability debates.
  *   **Hold Ground:** It's not just cognitive; it's institutional/material.
  *   **2-Minute Reply:** "Kuhn focuses on the paradigm inside the scientist's head. I'm looking at the paradigm inside the university's filing system. The mechanism is institutional memory—what gets digitized, what gets translated, what counts as 'context.' It's not that a 15th-century thinker *can't* understand a 17th-century one; it's that our training makes them illegible to each other. The 'machine' is the curriculum and the archive, not just the concept. It's externalized incommensurability."
  *   **Weakest Spot:** Don't get bogged down in defining "ontology." If you drift too far into metaphysics, the historians will tune out. Keep it grounded in practice.

  ---

  ### 4. THE PRAYER QUESTION (The Alternative)
  **Likelihood:** Guaranteed if you survive the first three. **Damage:** Fatal if you fumble.
  **Voice:** (Anyone, usually the Chair) "Okay. You've convinced us these categories are active forgetting machines. So what's the alternative taxonomy? Do we organize by concept? By problem? By material? And doesn't whatever you propose just become a new forgetting machine in ten years?"

  *   **Concede Upfront:** Yes, any taxonomy will eventually harden. There's no view from nowhere.
  *   **Hold Ground:** The goal isn't a perfect map; it's a reflexive method.
  *   **2-Minute Reply:** "I'm not proposing a new set of buckets to replace the old ones. That would just reset the clock. I'm proposing a methodological stance: trace the erasure. Instead of asking 'Which period does this belong in?', ask 'What becomes unreadable if I put this here?' If you study optics, don't start with 'Renaissance Optics.' Start with 'Theories of Vision' and see where the archives force you to stop. The alternative isn't a new noun; it's a verb. It's constant monitoring of the boundary work. Yes, it'll create new silos eventually. That's why the work never ends."
  *   **Weakest Spot:** It sounds evasive. Committees hire people to build things, not just deconstruct. Emphasize that this method *produces* new historical findings, not just critique.

  ---

  ### INTERNAL CHECK (For your eyes only)

  **What would actually change my mind?**
  If someone shows me a robust case study where cross-period comparison *succeeded* precisely *because* of the standard periodization. Like, if the "Scientific Revolution" label actually helped uncover a connection between 1400 and 1600 that a "problem-based" approach would have missed. If the "machine" facilitated memory rather than forgetting in a specific, documented instance.

  **Where is my reasoning most likely to collapse?**
  The "By Design" claim.
  You say these periods function as forgetting machines "by design."
  **The Trap:** If they ask "Who designed it?" you're screwed. It wasn't a conspiracy.
  **The Fix:** Clarify immediately that "design" is systemic/emergent, not intentional. It's the aggregate effect of hiring lines, journal scopes, and grant categories over 150 years. It functions *as if* designed, but it's actually just path dependence. If you let them pin you on "intentionality," you look conspiratorial. If you pivot to "systemic function," you're safe.

  **Final Tip:**
  Watch the Medievalist's body language. If they cross their arms during the intro, don't try to win them over with theory. Win them with a specific textual example where a period label hid something obvious. Show, don't just tell.

  Good luck. Don't apologize for the ambition, just clarify the utility. You got this.
