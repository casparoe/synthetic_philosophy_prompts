prompt: |-
  So I'm TAing a seminar called "Philosophy and Psychotherapy" — about a dozen second-year clinical psych students — and next Tuesday it's my turn to run the 75-minute section on Sartre's bad faith. The catch is that they're three weeks into their CBT placements, so they arrive with a very specific toolkit and they will absolutley try to file Sartre under it. Two failure modes I can already see coming: one group will cash out bad faith as basically a cognitive distortion, i.e. a wrong belief about yourself that dissolves once someone shows you the evidence against it; the other group will treat it as lack of insight, i.e. the client is repressing the truth and therapy is just getting them to self-report honestly. Neither is dumb, and I don't want to simply announce that both are wrong — I want the sequence itself to make the wrongness visible to them.

  Plan the section for me rather than explaining bad faith to me; I know the material, what I don't have is an order of attack. So: what has to be in place before bad faith is even statable — I'm assuming facticity and transcendence, plus something about consciousness not being a thing that has properties, and I'm fuzzy on how much of that machinery I can get in without losing them — and what depends on what, so I'm not borrowing a concept three steps before I've earned it. Then which case should carry the whole thing. The café waiter is available and they've half-heard of it, but I worry it reads as cute people-watching rather than as freedom collapsing on itself; should I use it as a warm-up and then retire it, or is there a better single case, maybe drawn from their placement world, since every one of them has a client who says "I'm just an anxious person, that's who I am"? Tell me what that carrying case has to have and what it has to lack — my instinct is it can't be a case where the truth is obvious on reflection, or the paradox just disapears.

  And then the misconception map. For each predictable wrong turn — bad faith as ordinary self-deception in the hiding-a-belief sense (and how do I handle the problem that you'd have to know exactly what you're hiding?), bad faith as mere hypocrisy or cowardice, radical freedom as "you can be anything, so just choose differently," authenticity as brutal honesty or sincerity-as-cure, and the big one where they conclude Sartre is blaming people for their circumstances — say where in the sequence I head it off and what I actually do at that moment so it doesn't feel like a teacher correcting a student. Finish with one thing I can put to them in the last ten minutes that would genuinely discriminate between "bad faith landed as a claim about the structure of freedom" and "bad faith landed as a fancy synonym for being in denial," and tell me what I should openly refuse to cover at this level and announce that I'm refusing it — I'm guessing the full for-itself/in-itself ontology, and probably the Other. American English, please, and be concrete: rough timings per block would help, because 75 minutes goes fast.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** TAing a seminar "Philosophy and Psychotherapy."
      *   **Audience:** ~12 second-year clinical psych students (CBT placement context).
      *   **Topic:** Sartre's Bad Faith (*mauvaise foi*).
      *   **Time:** 75 minutes.
      *   **Constraint 1 (Pedagogical):** Don't just *tell* them they are wrong about CBT interpretations (cognitive distortion/repression); make the *sequence* reveal the wrongness.
      *   **Constraint 2 (Conceptual):** Need to order concepts carefully (facticity/transcendence, consciousness as non-thing) without getting bogged down in ontology.
      *   **Constraint 3 (Case Study):** Need a "carrying case." Café waiter is okay but maybe too abstract/cute. Needs to be clinical/relevant ("I'm just an anxious person"). Needs to sustain the paradox (truth isn't obvious on reflection).
      *   **Constraint 4 (Misconceptions):** Address specific wrong turns (self-deception, hypocrisy, radical freedom as optimism, authenticity as honesty, blaming the victim) *within* the flow, not as corrections.
      *   **Constraint 5 (Assessment):** A final discriminator task (last 10 mins) to test understanding.
      *   **Constraint 6 (Exclusions):** Explicitly state what *won't* be covered (full ontology, The Other).
      *   **Tone:** American English, concrete, rough timings.

  2.  **Deconstruct the Challenge:**
      *   *The CBT Clash:* CBT assumes beliefs can be true/false and corrected via evidence. Sartre assumes consciousness *is* the act of negating what is. If a student thinks "I am anxious," CBT says "Is that evidence-based?" Sartre says "You are *making* yourself anxious in this moment." The gap is between *content* of belief vs. *structure* of being.
      *   *The Sequence:* I need to build the ontological ground just enough to make bad faith inevitable, not just a moral failing.
      *   *The Case:* "I'm just an anxious person" is perfect. It sounds like a diagnosis (facticity) but functions as an excuse (denying transcendence).
      *   *The Misconceptions:* These need to be anticipated as "natural reactions" and used as stepping stones, not errors to be swatted down.

  3.  **Drafting the Sequence (Iterative Process):**

      *   *Intro (0-10):* Hook them. Don't start with definitions. Start with the clinical phrase. "I am an anxious person."
      *   *Concept Building (10-30):* Need Facticity and Transcendence. But how to make it clinical?
          *   Facticity = The file notes, the diagnosis, the past history.
          *   Transcendence = The next session, the next choice, the meaning made *now*.
          *   Crucial point: Consciousness isn't a container. It's a light.
      *   *The Pivot to Bad Faith (30-50):* How do they relate? Bad faith is collapsing one into the other.
          *   Case Study Deep Dive: The "Anxious Person."
          *   Show why CBT "evidence checking" fails here. The client isn't lying about symptoms; they are lying about *freedom*.
      *   *Misconception Management (50-65):* Weave these into the discussion of the case.
          *   "Is this just denial?" -> No, denial implies a hidden truth. Bad faith *is* the truth of the situation lived falsely.
          *   "Is this blaming?" -> No, it's responsibility, not fault.
      *   *Discriminator/Conclusion (65-75):* The "What would Sartre say?" vs. "What would Beck say?" exercise.
      *   *Exclusions:* Be clear about *Being and Nothingness* ontology depth.

  4.  **Refining the "Carrying Case":**
      *   The prompt suggests "I'm just an anxious person." Let's flesh this out. Let's call him "Mark."
      *   Mark avoids social situations. He says, "I can't go to the party, I'm anxious."
      *   CBT view: Challenge the thought "I can't." Evidence: You went last week.
      *   Sartrean view: Mark is *using* anxiety as a thing (in-itself) to determine his future. He is pretending he *is* his anxiety.
      *   Why this works: It's not that Mark is lying about feeling anxiety (facticity). It's that he treats the anxiety as a *cause* rather than a *project*.

  5.  **Addressing the Misconceptions (The "Head Off" Strategy):**
      *   *Self-Deception:* Don't lecture on the liar/lied-to paradox. Instead, ask: "If Mark knows he's anxious, what is he hiding?" If he knows, he's not hiding it from himself in the Freudian sense. He's *affirming* it too strongly.
      *   *Hypocrisy:* Hypocrisy is knowing the rule and breaking it. Bad faith is believing the rule *is* you.
      *   *Blaming:* Distinguish "ontological freedom" from "practical freedom." You are free to interpret your chains, even if you can't break them.

  6.  **Developing the Final Discriminator:**
      *   Need a scenario where CBT and Sartre diverge.
      *   Scenario: A client says, "I hit my partner because I have anger issues."
      *   CBT: Identify trigger, challenge belief "I must hit," learn regulation.
      *   Sartre: You are *choosing* to be an "angry person" to avoid choosing to be a "person who controls anger in this moment."
      *   Task: Write two intervention notes. One CBT, one Sartrean. Compare the *goal*. (CBT = symptom reduction/truth alignment. Sartre = Ownership of project).

  7.  **Timing and Flow Check:**
      *   0-10: Hook & The Clinical Phrase.
      *   10-25: The Ontological Skeleton (Facticity/Transcendence).
      *   25-45: The Case Study (Mark) & The Trap.
      *   45-60: Misconception Gauntlet (Weaving in the "wrong turns").
      *   60-70: The Discriminator Exercise.
      *   70-75: Wrap & Exclusions.
      *   *Wait, 75 mins is tight.* I need to be ruthless. The ontology needs to be *functional*, not historical.
      *   *Revision:* Merge the Hook and Case Study intro. Start with Mark immediately.

  8.  **Final Polish:**
      *   Ensure American English (e.g., "placement" vs "internship", "section" vs "seminar").
      *   Make sure the "refusal" section is clear.
      *   Ensure the tone is respectful of their CBT training (it's a toolkit, not an enemy, just a different map).

  9.  **Self-Correction on "Consciousness as Non-Thing":**
      *   This is the hardest part for psych students. They think of the mind as a mechanism.
      *   Analogy: The eye sees everything but cannot see itself. Or: A light illuminates objects but isn't an object.
      *   Better for Psych: The "Therapist's Gaze." You observe the client, but you are not the observation.
      *   Let's use the "Distance" metaphor. Consciousness is the *distance* between stimulus and response.

  10. **Finalizing the Plan Structure:**
      *   **Phase 1: The Hook (The Clinical Impasse).**
      *   **Phase 2: The Machinery (Facticity/Transcendence).**
      *   **Phase 3: The Collapse (Defining Bad Faith via the Case).**
      *   **Phase 4: The Gauntlet (Addressing Misconceptions in real-time).**
      *   **Phase 5: The Discriminator (CBT vs. Sartre Intervention).**
      *   **Phase 6: The Refusal (Scope setting).**

      *(Self-Correction during drafting)*: Make sure I explicitly answer the prompt's request about "what has to be in place before bad faith is statable." I need to articulate that dependency clearly in the plan notes.

      *(Refining the Discriminator)*: The prompt asks for *one thing* to put to them. A specific vignette where they have to write the *goal* of therapy.

      *(Refining the Exclusions)*: Explicitly name *Being and Nothingness* Part 1, Chapter 2 vs. what we are doing.

      Let's write it.cw
answer: |-
  Here is a 75-minute lesson plan designed to let the conceptual friction do the teaching. The goal is to let the CBT toolkit run up against the ontological wall so they feel the gap, rather than you telling them it exists.

  ### **Session Title:** The Structure of Self-Deception: Sartre for Clinicians
  **Time:** 75 Minutes
  **Audience:** 2nd-Year Clinical Psych Students (CBT Placement Context)

  ---

  ### **Phase 1: The Clinical Impasse (0:00 – 0:15)**
  **Goal:** Introduce the carrying case immediately. Do not start with definitions. Start with a statement they hear every week.

  **The Setup:**
  Write this sentence on the board:
  > *"I can't apply for that job. I'm just an anxious person. That's who I am."*

  **The Activity (10 mins):**
  Ask the room: "In your CBT supervision, how do you hear this? What is the clinical task here?"
  *   *Expected Answer:* Identify the cognitive distortion (labeling/overgeneralization). Test the evidence. Is it true they *can't*? Is it true they are *just* anxious? Behavioral experiment: Apply anyway.
  *   *Write their answers on the left side of the board under "CBT Frame."* (Keywords: Distortion, Evidence, Accuracy, Symptom Reduction).

  **The Pivot (5 mins):**
  Say: "Sartre agrees the statement is false. But he thinks your CBT formulation misses the *point* of the lie. He thinks if you treat this as a 'wrong belief,' you will fail. Not because the therapy won't work, but because you've misunderstood what the client is *doing*."
  *   *Promise:* "By the end of this hour, you will see why treating this as a 'distortion' might actually collude with the problem."

  ---

  ### **Phase 2: The Ontological Skeleton (0:15 – 0:30)**
  **Goal:** Establish the preconditions for Bad Faith without drowning in *Being and Nothingness* ontology. You need two concepts: **Facticity** and **Transcendence**.

  **The Concept (10 mins):**
  Explain that for Sartre, human reality is a tension between two modes of being. Use clinical analogies, not metaphysical ones.

  1.  **Facticity (The In-Itself):** This is the "file." Diagnosis, history, past behaviors, bodily states, social role. It is what *is*.
      *   *Example:* The client *has* a pulse. The client *has* a diagnosis of GAD. The client *did* panic last Tuesday.
      *   *Key constraint:* Facticity is inert. It doesn't *do* anything.
  2.  **Transcendence (The For-Itself):** This is the "projection." It is consciousness as a verb, not a noun. It is the movement toward the future, the meaning-making, the *negation* of what is.
      *   *Example:* The client *interprets* the pulse as danger. The client *uses* the diagnosis to explain a choice. The client *decides* what last Tuesday means for next Tuesday.
      *   *Key constraint:* Consciousness is not a thing that *has* properties. It is the *light* that reveals properties. You cannot find "freedom" inside the brain like you find the amygdala.

  **The Dependency Check (5 mins):**
  Ask: "Can you have one without the other?"
  *   *Guide them to:* No. You need facticity to have something to transcend. You need transcendence to make facticity matter.
  *   *Visual:* Draw a slash `/`. Facticity is the bottom left. Transcendence is the top right. Human reality is the *tension* of the slash.
  *   *Crucial Point:* "Bad Faith is only statable once you accept that humans are *both* of these simultaneously, yet irreducible to either."

  ---

  ### **Phase 3: The Collapse (0:30 – 0:50)**
  **Goal:** Define Bad Faith using the "Anxious Person" case. Show how it is not a cognitive error, but an ontological collapse.

  **The Case Deep-Dive (15 mins):**
  Return to: *"I'm just an anxious person."*

  1.  **The Move:** The client is taking their **Transcendence** (their freedom to interpret and act) and pretending it is **Facticity** (a fixed object/essence).
  2.  **The Mechanism:** They are saying, "I am an anxious person" in the same way they say "I am 6 feet tall." They are turning a *project* (living anxiously) into a *state* (being anxiety).
  3.  **Why CBT "Evidence" Fails Here:**
      *   If you ask, "Show me the evidence you're anxious," they will show you plenty. Sweaty palms, avoidance, history.
      *   *The Trap:* The CBT challenge assumes the error is in the *data*. Sartre says the error is in the *grammar*. The client isn't lying about the symptoms (facticity); they are lying about the *relationship* to the symptoms.
      *   *Phrase to use:* "They are not denying the anxiety; they are *hiding behind* it."

  **The Paradox (5 mins):**
  Ask: "If they know they are choosing this, isn't that just lying?"
  *   *Response:* "No. If they knew they were choosing it, they would feel anguish. Bad faith is the successful attempt to *not know* that you are choosing. You convince yourself you *are* the role."
  *   *Connection to Waiter:* Briefly mention Sartre's café waiter (1 min). He plays at *being* a waiter to avoid being a free man who happens to be waiting tables. Your client plays at *being* Anxious to avoid being a free person who happens to feel fear.

  ---

  ### **Phase 4: The Misconception Gauntlet (0:50 – 1:05)**
  **Goal:** Address the predictable wrong turns *as they arise* from the case discussion, not as a lecture list.

  **Instructor Scripting (Weave these into the Q&A):**

  1.  **"Isn't this just Repression/Denial?" (The Freudian Turn)**
      *   *Student asks:* "So they know the truth deep down?"
      *   *Your Move:* "If they knew the truth deep down, where is it stored? In a unconscious box? Sartre says no. There is no hidden room. The 'knowing' and the 'hiding' are the same act. They are fully aware of their anxiety, but they mask the *freedom* within it. It's not hiding a belief; it's masking an agency."
  2.  **"Isn't this Blaming the Victim?" (The Ethical Turn)**
      *   *Student asks:* "So if a client is traumatized, you're saying they choose it?"
      *   *Your Move:* Distinguish **Fault** from **Responsibility**. "Sartre is not talking about moral fault. You didn't choose the trauma (facticity). But you are responsible for the *meaning* the trauma has in your life today (transcendence). Bad faith is pretending the trauma determines the meaning. That's not blame; that's the only place where change is possible."
  3.  **"Isn't Authenticity just Honesty?" (The Sincerity Turn)**
      *   *Student asks:* "So therapy is just getting them to admit they're free?"
      *   *Your Move:* "No. 'I admit I am free' can also be bad faith if it becomes a slogan. Authenticity is living the tension. It's saying 'I am anxious (facticity) AND I am not defined by it (transcendence).' It's holding the slash `/` open, not erasing it."
  4.  **"Radical Freedom = You Can Be Anything?" (The Optimism Turn)**
      *   *Student asks:* "So they can just choose to be confident?"
      *   *Your Move:* "No. They cannot choose their facticity. They cannot choose to not feel the physiological arousal. They choose the *project* surrounding the arousal. Freedom is not 'anything is possible.' Freedom is 'nothing is determined.'"

  ---

  ### **Phase 5: The Discriminator (1:05 – 1:15)**
  **Goal:** A concrete task that forces them to distinguish "Bad Faith as Structure" from "Bad Faith as Denial."

  **The Exercise (7 mins):**
  Hand out a slip of paper (or put on screen).
  **Vignette:** *Client says: "I stayed in the abusive relationship because I'm a codependent. It's my attachment style."*

  **Task:** Write two "Therapist Notes."
  1.  **Note A (CBT/Psychodynamic):** Treat the statement as a *belief to be corrected* or *insight to be deepened*. What is the goal?
      *   *Target:* Goal = Align belief with reality ("You are not codependent, you are trapped") or uncover root cause.
  2.  **Note B (Sartrean):** Treat the statement as *Bad Faith*. What is the goal?
      *   *Target:* Goal = Restore the tension. Acknowledge the attachment style (facticity) but confront the *use* of the style to justify staying (transcendence). The goal isn't to prove they *can* leave, but to highlight that they are *choosing* to stay *as* a codependent.

  **Debrief (3 mins):**
  Ask one pair to read theirs.
  *   *Discriminator:* In Note A, the truth is a *fact* (e.g., "You actually have strengths"). In Note B, the truth is an *act* (e.g., "You are making yourself codependent in this moment").
  *   *Success Criteria:* If they say Sartrean therapy is about "telling the client they are free," they missed it. It's about "confronting the client with the cost of pretending they aren't."

  ---

  ### **Phase 6: The Refusal & Wrap (1:15 – 1:15)**
  **Goal:** Set boundaries on the material to prevent future confusion.

  **The Explicit Refusal (2 mins):**
  Say this clearly:
  "I want to flag what we did *not* do today, so you don't try to use these tools later and break them.
  1.  **We did not do the full Ontology.** We skipped the *In-Itself/For-Itself* metaphysics. Do not try to argue ontology with a client. Use the *structure* (Facticity/Transcendence), not the *substance*.
  2.  **We did not do 'The Other'.** Sartre's view on how *other people* turn us into objects (*The Look*) is crucial for shame, but it's too complex for today. Don't assume Bad Faith is always about social pressure; often, it's solitary.
  3.  **We are not replacing CBT.** Sartre gives you a lens for *resistance*, not a protocol for *symptom reduction*. Use it when the homework isn't done because the client 'isn't that kind of person.'"

  **Final Send-off:**
  "Next time a client says 'That's just who I am,' hear the slash. Hear the facticity. Then listen for where they are killing the transcendence. That's where the work is."

  ---

  ### **Instructor Cheat Sheet: Conceptual Dependencies**
  *Use this to check your own flow during the seminar.*

  1.  **Consciousness is not a Thing:** Must be established before Bad Faith. If consciousness is a container, Bad Faith is just hiding a belief inside it. If consciousness is *activity*, Bad Faith is a mode of that activity.
  2.  **Facticity/Transcendence Distinction:** Must be established before the Case. If they don't see the two poles, they can't see the collapse.
  3.  **The "Anxious Person" Case:** Must be used *after* the distinction. It demonstrates the collapse of Transcendence into Facticity.
  4.  **Misconceptions:** Address *during* the Case. If you wait until the end, they will have already filed the concepts under "Denial."
  5.  **Discriminator:** Must happen *after* Misconceptions. It tests if they can apply the structure without reverting to "correcting beliefs."

  ### **Why This Sequence Works for CBT Students**
  *   **Respects their Toolkit:** It acknowledges CBT works for *distortions*, but posits Bad Faith as a different category (ontological vs. epistemological).
  *   **Avoids "Woo":** By anchoring in the clinical phrase ("I'm just an anxious person"), it stays grounded in their placement reality.
  *   **Prevents Moralizing:** By distinguishing Fault from Responsibility early (Phase 4), you stop them from viewing Sartre as "blaming the victim."
  *   **Concrete Exit:** The Refusal section protects you from them trying to be existential therapists next week without the training. They leave knowing exactly *where* this tool fits in the box.
