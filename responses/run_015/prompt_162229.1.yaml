  I do mechanistic interpretability and that's basically the only vocabulary I'm fluent in: features and directions in activation space, circuits, causal abstraction, interchange interventions and activation patching, ablations, SAE dictionaries, superposition, "the model computes X by way of Y", plus the training distribution and gradient descent as whatever decides whats really in there. No philosophy training past blog posts.

  Would you restate the metaphysics of grounding and fundamentality in those terms, as faithfully as you can manage? By the position I mean roughly: some facts obtain in virtue of others; that "in virtue of" is supposed to be explanatory but not causal and not just supervenience or modality; and a fundamental fact is one that isn't grounded in anything further. So: what maps cleanly onto "the behavior is realized by a circuit, and the circuit is where you intervene"? What only fits if you fudge it — does "grounds" just become "interventions on", and what happens to grounding being finer-grained than anything exchange interventions can tell apart, or to its being necessitating without being causal? And what has no counterpart at all: is there anything in my vocabulary for a privileged bottom level, or for the possibility that the whole trained network is prior to its parts and directions rather than the other way round (which is honestly how it feels sometimes, since a "feature" only means anything relative to the entire network)? Also tell me whether my own worry — that an SAE dictionary is a convenient decomposition rather than the model's real joints — is secretly the same argument.

  Then the residue report, which is the bit I actually want: which failures look like real things interp can't say but should be able to, and which look like the metaphysicians tracking distinctions that do no work. And does any of it cash out in advice about which level to intervene at?
