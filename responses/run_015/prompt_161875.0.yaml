answer: |-
  **The Toast**

  Good evening. For those of you who aren't in the lab: Miriam spent thirty years studying how we see time. Specifically, she studied a trick where a blue dot flashes, then a red dot, and your brain insists it saw one dot change color mid-flight. The argument was always about *when* the brain made that call. Did it wait for the red dot and rewrite the history of the blue one? Or did it record the blue one faithfully and edit the memory later?

  There were names for these stories. There were careers built on them. Miriam's contribution was to stand in the middle of the shouting and say: "It doesn't matter. There is no experiment that can tell the difference. The question is empty."

  I mention this because I've been asked to say a few words about what we feel for her tonight. And I find myself running into the same methodological problem she spent her life identifying.

  If I stand here and say, "We have always admired you," I am backdating a sentiment. I am writing a finished version of our relationship straight into the record, dated earlier than it was actually produced. That feels Stalinesque. It smooths over the years when half this room thought her position was empty-headed and told her so. We argued. We stalled. We were frustrated. To pretend otherwise is to falsify the data.

  But if I say, "We admire her *now*, because of this dinner," I imply the affection didn't exist before the wine was poured. That feels Orwellian. It suggests a revision of history that denies the long, slow work of mentorship.

  So, how do we timestamp a feeling?

  Miriam once ran a protocol where subjects narrated what they saw while they saw it. The critics said narrating the percept changes the percept. You cannot describe the draft without editing it. Miriam thought that objection proved her point.

  I want to propose that a toast is a diary protocol. Saying the feeling out loud changes the feeling. By gathering here, by speaking this gratitude, we are not measuring a pre-existing condition. We are constructing the record.

  To the rivals in the room: I know some of you think the distinction is testable after all. I'm not here to settle the science. But I am here to suggest that in this room, tonight, the distinction collapses. Whether we loved her all along and only just realized it, or whether we are creating the love by naming it now—the result is the same. The dot is red.

  To the family: She didn't just study dots. She taught us that some questions don't need answers to be meaningful.

  Miriam hates being called brave, so I won't. She forgives bad jokes, but not false ones. So I will not claim I know when this appreciation began. I don't think there is a fact of the matter about when a feeling starts, and I trust her judgment on that more than my own.

  I will simply report the current percept. We are grateful. We are here. And the timing of that gratitude is, appropriately, up to her to decide.

  To Miriam.

  ***

  **Note on Liberties and Coherence**

  In writing this, I quietly committed to Miriam's view (the distinction is empty) while acknowledging the rival's presence. I did this by framing the "collapse" of the distinction as a social act rather than a neural one. The toast asserts that *tonight*, the difference between "always loved" and "love now" is functionally null, which honors Miriam without silencing the critic who believes the distinction is real.

  Regarding your scruple: Is it coherent to worry about "backdating affection" if Miriam is right that temporal facts are empty? Strictly speaking, no. If there is no fact of the matter about when a percept forms, there is no fact of the matter about when love begins. Worrying about "backdating" implies there is an original timestamp to violate. However, the scruple is *socially* coherent. Even if time is subjective, social contracts demand honesty about causality. The toast navigates this by admitting the worry ("I find myself running into the same methodological problem") but resolving it through Miriam's own framework: the act of reporting creates the reality.

  What would convince me to drop the hedging and simply say "We've always loved you"? If love were demonstrably distinct from perception in its temporal structure. Perception is reactive and reconstructive; love is often cumulative and dispositional. If I could argue that mentorship creates a stable state that exists independently of our current report of it, the "Orwellian" fear would vanish. But given Miriam's career, arguing for a stable, timestampable internal state feels like the one thing she wouldn't forgive. So the hedging remains, not as a failure of conviction, but as the final tribute.
