          *   *Let's look at Population Ethics (3):* This is often the "reductio ad absurdum" for negative views (implies extinction). It's high stakes but low tractability. It depends on the valuation of "absence."
          *   *Let's look at Aesthetics (2):* This is about the "good life" under tranquilism. Less critical than consistency or existence.

      *   *Revised Ranking:*
          1.  **Phenomenological Boundary (4):** You cannot solve the others without a robust definition of the core terms (suffering/craving vs. neutrality).
          2.  **Meta-craving (1):** Once terms are defined, you must ensure the theory isn't self-defeating. This is the "viability" check.
          3.  **Intergenerational Quietism (3):** Once viability is established, what are the macro-implications? (Existence vs. Non-existence).
          4.  **Aesthetic Neutrality (2):** Once the big ethical structures are set, refine the quality of the neutral state.

      *   *Wait, let's swap 1 and 4?*
          *   Argument for Meta-craving first: It's the most threatening objection. If you can't solve it, the project dies.
