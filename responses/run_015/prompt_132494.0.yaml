      *(Refining the Meta-craving argument)*: The "Meta-craving" problem is essentially a paradox of self-reference. It depends entirely on how "craving" is defined. Therefore, Boundary *must* precede Meta. If "craving" requires "aversion to the current state," then seeking tranquility might not be craving if it's framed as "alignment with reality." This confirms 4 -> 1.

