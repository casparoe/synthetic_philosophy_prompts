      *   *Attempt 2:* 4 (Boundary), 1 (Meta), 2 (Aesthetic), 3 (Population).
          *   *Critique:* This makes sense. Define terms -> Check consistency -> Check scope -> Check implications.
          *   *Refinement:* Is Meta-craving actually more urgent? If the theory is self-defeating, definitions don't matter. However, the *definition* of craving determines whether the pursuit counts as craving. So they are linked. But logically, definition precedes application. Let's stick with Boundary first.
