  Here is a concrete example designed for your handout. It isolates the **structural/distributional** failure of Goodhart's Law from the **behavioral/gaming** failure.

  ### Case Study: The Selection Paradox (Range Restriction)

  **Context:** A competitive University Admissions Office.
  **True Goal:** Maximize Student Success (measured by Freshman GPA).
  **Proxy Metric:** Entrance Exam Score.
  **Historical Calibration:** In the past, the university admitted a broad mix of students. Historical data shows a strong correlation ($r = 0.6$) between Entrance Exam Scores and Freshman GPA. High scorers generally get high GPAs.

  **The Intervention:**
  The Dean decides to "optimize for excellence." To improve the class profile, the university raises the admission cutoff, accepting **only** applicants in the top 5% of Exam Scores. They are not cheating; they are genuinely selecting for the "best" students based on the historical metric.

  **The Failure:**
  After three years, the Admissions Office analyzes the new data. They find that within the admitted class, the Entrance Exam Score **no longer predicts** Freshman GPA ($r \approx 0.05$). The metric has become noise. A student with a 99th percentile score performs no better, on average, than a student with a 96th percentile score.

  **Why This Happens (The Mechanism):**
  This is not because students cheated on the exam, nor because the exam is "broken." It is a statistical consequence of **optimization changing the population**.
  1.  **Pre-Intervention:** The correlation existed because the data included a wide *variance* in ability. The exam successfully distinguished between low, medium, and high ability.
  2.  **Post-Intervention:** By optimizing for the metric (raising the cutoff), the university restricted the **range** of the variable. Within the top 5%, almost everyone has high ability. The *variance* in ability collapses.
  3.  **The Shift:** In this truncated population, differences in GPA are no longer driven by the ability the exam measures (cognitive aptitude), but by other factors the exam *does not* measure (mental health, study habits, social fit). The "world" in which the metric operates has shifted from a *general population* to a *highly selected elite*.

  **Why This is Goodhart Without Gaming:**
  *   **No Malice:** Applicants did not cheat on the exam. The admissions officers did not manipulate the data.
  *   **Rational Optimization:** The decision-makers did exactly what the historical data suggested: they selected for high scores to get high GPAs.
  *   **Structural Break:** The failure occurred because the act of selection destroyed the variance necessary for the metric to function as a predictor.

  **Why Collecting More "Old" Data Doesn't Fix It:**
  If the university tries to fix this by gathering more historical data from the *pre-intervention* era (including all the rejected low-scoring students), it will not help.
  *   That data describes the relationship between Scores and GPA for the *general population*.
  *   It cannot accurately estimate the relationship for the *truncated population* (the top 5%) without strong, untestable assumptions about the distribution tail.
  *   **Lesson:** You cannot use observational data from a regime of *selection* to predict outcomes in a regime of *optimization*. The intervention changed the support of the distribution, rendering the old calibration invalid.

  ***

  ### Seminar Discussion Questions
  1.  How does this differ from the standard "teaching to the test" example of Goodhart's Law?
  2.  If the metric is now unreliable, should the university lower the cutoff to restore variance, or find a new metric? What are the trade-offs?
  3.  How does this relate to the **Lucas Critique** in macroeconomics? (Hint: Both involve policy changes altering the underlying data-generating process).
