answer: |-
  Locke argues that habit functions as a deep associative imprint that alters the immediate uneasiness of sensation, meaning custom dominates reason because the will is driven by present discomfort rather than abstract rational conclusions about future good.

  This mechanism is fully compatible with his empiricism because, for Locke, the mind is not a rational agent that naturally seeks truth, but a *tabula rasa* governed by the association of ideas and the pursuit of happiness. When you harden a child to cold, you are not just changing their physiology; you are manipulating the empirical data of their experience so that the idea of "cold" no longer associates with the idea of "pain." Since all knowledge and motivation stem from experience, a repeated experience (habit) creates a stronger, more automatic pathway than a single instance of logical deduction. Reason is merely the manipulation of ideas, but habit changes the visceral weight of those ideas themselves.

  The "path-dependent causal locking" you suspect is essentially correct because Locke views the young mind as soft wax that takes the deepest impressions first. Once these associations set, they become the lens through which all subsequent experience is filtered. If a child learns that cold equals misery, every future cold experience reinforces that idea, making rational arguments about health feel like abstract lies against concrete sensory evidence. Conversely, if habit removes the uneasiness of cold, reason has no resistance to overcome; the body complies automatically because the motivational trigger (pain) has been extinguished.

  Reason fails to override bad habits not because it is powerless in theory, but because it is motivationally weak in practice. Locke's psychology of action dictates that the will is determined by the most pressing "uneasiness." A habituated body feels no uneasiness in the cold, while a reasoned argument about future health relies on imagining a distant, abstract pain. The immediate absence of discomfort always outweighs the speculative presence of future benefit. Therefore, custom dominates because it controls the immediate sensory inputs that drive the will, whereas reason only offers a map of a territory the body has no desire to visit.
