      *   *Tension 2: (c) + (d) vs. (a).* If endpoints are conventions (c) and data is biased (d), the base rate (a) is noisy or meaningless. You can't anchor on garbage data.
      *   *Tension 3: (e) vs. (a).* Radical path-dependence (e) suggests no generalizable laws, which undermines the logic of using base rates (a) to predict specific outcomes.
      *   *Tension 4: (g) vs. (h).* If forecasts change behavior (g), a "usable number" (h) might be unstable or dangerous to publish.
