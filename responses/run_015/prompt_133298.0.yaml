  hey, I'm prepping for a philosophy of mind reading group and want a quick chek on wether my package of views actually hangs together — I'm asking you as a professional philosopher, so please think carefully and do a quick mental brainstorm before answering. Here they are: (1) I'm a physicalist and I take the self to be Hofstadter's strange loop, a narrative center of gravity, not a Cartesian ego. (2) I think the 'I' can genuinely be distributed via inter-cerebral pattern resonance — if my core symbolic patterns get deeply embedded in someone else's brain through language and shared memory, part of my self literally extends there. (3) But I still think split-brain patients after callosotomy have exactly one self, not two, even when the hemispheres act independantly. (4) I'm anti-functionalist and substrate-specific: consciousness is tied to a particular brain's causal-biological history, so even a perfect pattern-match in different wetware wouldn't be me. (5) I hold that personal identity is psychological continuity with a strict no-branching clause — if two successors carry my psychology, neither is the full original me. Do these hang together? Rank the tensions by severity, say for each pair what has to give and what the cheapest fix costs, flag any tension that only looks real, and tell me which single revision cleans up the most mess. Give me exactly five numbered points, each one or two sentences, with no intro or conclusion.
