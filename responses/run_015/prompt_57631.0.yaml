  As for the idle wheel charge, you assume that because the first-order state doesn't determine the phenomenology, it does no work. But it still serves as the intentional object of the higher-order thought. Even if I misrepresent it, I am thinking about *that* state, not nothing at all. However, I will go further: if the higher-order state occurs without a target, the subject still has a conscious experience—it's just a hallucination of a mental state. The first-order state is causally relevant in veridical cases, but it is not constitutive of the consciousness itself. Your view struggles to explain why some representational states feel like something and others don't. If consciousness is exhausted by first-order content, what exactly distinguishes a conscious red perception from an unconscious one with identical representational content?
