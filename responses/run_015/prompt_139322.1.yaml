answer: |-
  The mechanical architectures of sovereign, disciplinary, and security power translate cleanly into binary classifiers, ranking functions, and harm budgets, but the technical vocabulary breaks down when confronting the constitution of the subject and the internality of the audit, a failure that represents a strategic blind spot in engineering language rather than a thinness in Foucault's ontology.

  ### The Mapping

  **1. The Juridical/Sovereign Register → Binary Classification and Takedowns**
  This register maps to the hard-coded policy enforcement layer. Here, power operates through explicit Community Guidelines that function as law, enforced by classifier thresholds set to maximize precision on high-severity categories (CSAM, terrorism, copyright). The action is binary: the content is either embedded in the allowable space or flagged for removal; the user is either active or banned. Telemetry here is forensic, collecting evidence for appeals processes that mimic juridical review. The logic is deductive: if input matches rule, execute punishment (takedown/termination).

  **2. The Disciplinary Register → Ranking Functions and Embedding Spaces**
  This register maps to the recommendation and ranking systems that manage behavior through normalization rather than prohibition. Power begins from a norm (e.g., "high quality" or "authentic engagement") derived from historical telemetry, then individualizes users via embedding spaces that cluster behavior into profiles. Ranking functions act as the examination, continuously observing and sorting content visibility. Deviations are corrected not by removal but by demotion (shadow-banning) or nudges (interstitial warnings), training creator habits through feedback loops. A/B tests serve as the laboratory for refining these disciplinary techniques, optimizing the pressure required to align individual output with platform norms without triggering sovereign expulsion.

  **3. The Register of Security → Harm Budgets and Prevalence Metrics**
  This register maps to systemic risk management and aggregate integrity metrics. Power does not target individual cases but manages the distribution of phenomena (hate speech, misinformation) across the population. Engineers fix an acceptable rate (e.g., "hate speech prevalence below 0.5%") rather than a zero-tolerance rule. Interventions tune global parameters—classifier sensitivity, virality circuit breakers—to manage the conditions producing the rate. External audits operate here, measuring the tolerated incidence rather than adjudicating individual justice. Harm is treated as a budget to be spent, where the cost of removal (false positives, free speech concerns) is weighed against the cost of exposure.

  ### The Residue Report

  **What Carries Over Cleanly**
  The structural mechanics of control translate with high fidelity. The distinction between binary removal (sovereign), behavioral shaping via visibility (disciplinary), and aggregate risk management (security) maps directly onto the stack: policy enforcement, ranking models, and integrity metrics. The concept of the "feedback loop" serves as a robust technical synonym for Foucault's circuits of power, describing how output (user behavior) becomes input (training data) to reinforce the system.

  **What Requires Smuggled Assumptions**
  To make Foucault fit the engineering vocabulary, you must smuggle in a **designer** and an **objective function**. Foucault's power is capillary and subjectless; it emerges from relations. Platform vocabulary assumes a telos: engineers optimizing a specific loss function. When you speak of "ranking functions," you imply an optimizer seeking a goal. Foucault would argue the optimization *is* the power, not the tool of a pre-existing will. Similarly, the technical vocabulary assumes a **pre-existing subject** whose behavior is tracked via telemetry. Foucault argues the subject is constituted by the examination. While "embedding spaces" come close—constructing a vector-self based on behavior—the engineering mindset treats the user ID as the primary key, assuming the human precedes the data, whereas Foucault insists the data produces the human.

  **What Cannot Be Said**
  Two critical claims vanish in translation. First, **power is productive**. Engineers speak of "unintended consequences" or "side effects," implying the system is meant to do one thing but accidentally does another. Foucault claims the system *means* to produce the subjectivity it measures. There is no term in the vocabulary for "constitutive harm"—the idea that the ranking function creates the polarization it claims to measure. Second, **the audit is internal**. External audits are sold as independent verification (an "outside"). Foucault argues the audit is a technology of security *inside* the apparatus, legitimizing the tolerated rate. The vocabulary of "independence" and "third-party validation" actively obscures the fact that the audit parameters are often negotiated with the platform.

  **Verdict on Failure**
  This is a **blind spot in your vocabulary**, not a sign that Foucault is thin. The technical language is instrumentalist by design; it must describe mechanisms as neutral tools to maintain legitimacy and operational clarity. Admitting that ranking functions constitute subjects rather than reflect them, or that audits legitimize harm budgets rather than solve them, would break the operational logic of "building products." The vocabulary fails not because the phenomena are absent, but because naming them would render the objective function illegible as anything other than political power.
