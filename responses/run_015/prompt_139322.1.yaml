prompt: |-
  I cover science and ideas, and several years of that have gone into reporting on platform recommendation systems and content moderation, so I am fluent in the vocabulary I want you to translate into: ranking functions, engagement and exposure metrics, A/B tests, classifier thresholds and guardrails, embedding spaces, feedback loops, telemetry, and external audits.

  Translate into those terms Foucault's account of power in its three registers: the juridical or sovereign register, which lays down a code, forbids, and punishes; the disciplinary register, which begins from a norm rather than a law, ranks and individualizes, corrects deviations, and trains bodies and habits through repeated observation and examination; and the register of security, which begins not from a norm for each case but from the distribution of a phenomenon across a population, fixes an acceptable rate rather than a rule, and intervenes on the conditions that produce that rate. Map each register onto a corresponding moderation regime: a fixed rulebook with binary takedowns; a system that mostly demotes and nudges rather than removes; a system that treats harm as a budget to be managed against a tolerated incidence.

  Then give me the residue report, which is what I actually want. Which claims carry over cleanly, which fit only if you smuggle in assumptions my vocabulary does not contain — a designer, an objective function, a pre-existing subject who is then acted on — and which cannot be said in my vocabulary at all? Does the claim that power is productive, that it constitutes the kinds of speakers and the kinds of speech it then measures, or that an audit is itself inside the apparatus rather than outside it, have any counterpart in how platform engineers and auditors actually talk? Where the translation fails, tell me whether that is a blind spot in my vocabulary or a sign that the original claim is thinner than it sounds.

  Lead with your verdict in one sentence — what carries, what does not, and which failure matters most — then give the mapping and the residue. No preamble.
