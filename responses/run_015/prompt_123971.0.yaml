answer: |-
  Here's a run-sheet for the 75-min session. It's designed to be low-prep but high-tension. The goal is to make the Farmers feel the *weight* of their own success, while the Foragers feel light but vulnerable.

  ### **Seminar Sim: The Grain Trap**
  **Time:** 75 mins
  **Players:** 14 (Split 7 Foragers / 7 Farmers)
  **Space:** Two corners of the room (or hallway vs. classroom). They cannot hear each other's negotiations.

  ---

  ### **1. Setup (10 mins)**
  Split the class. Hand out instruction sheets. **Do not explain the "debt" mechanic to the Farmers yet.** That's the point.

  **Group A: The Foragers (The "Immediate Return" System)**
  *   **Resource:** Paper slips marked "Food."
  *   **Mechanic:** Each round (5 mins), you "forage" (draw 3 slips from a hat).
  *   **Cost:** You must eat 2 slips to survive the round.
  *   **Constraint:** **Perishability.** You cannot keep slips between rounds. Any food left over rots (hand it back to me).
  *   **Goal:** Survive 4 rounds. Maximize "Leisure" (time spent not talking about food).

  **Group B: The Farmers (The "Delayed Return" System)**
  *   **Resource:** Poker chips (Food).
  *   **Mechanic:** Each round, you "harvest" (roll a die: 1-2 = 2 chips, 3-6 = 5 chips).
  *   **Cost:** You must eat 2 chips to survive.
  *   **Constraint:** **Storage.** You *can* keep chips in a personal cup between rounds.
  *   **Goal:** Survive 4 rounds.
  *   *(Hidden GM Note for Prof: If a student ends Round 2 with >6 chips in their cup, quietly hand them a "Red Token." If they end with <2 chips, hand them a "Blue Token." Do not explain what these do yet.)*

  ---

  ### **2. Gameplay (40 mins)**
  Run 4 Rounds. 8 minutes per round. You float between groups.

  **Round 1 & 2: The Honeymoon**
  *   **Foragers:** They will realize they get exactly enough (6 food, need 14 total for 2 rounds? Wait, 3 per round x 2 = 6. Need 2 per round x 2 = 4. They have surplus that rots). They will laugh at the waste. They'll finish early and chat.
  *   **Farmers:** Some will get lucky (roll high) and store chips. Some will get unlucky.
  *   **Your Move:** At the end of Round 2, distribute the Red/Blue tokens secretly.
      *   **Red Token:** "You are a Patron."
      *   **Blue Token:** "You are a Client."
      *   *Say nothing else.*

  **Round 3: The Crisis (The Trap Springs)**
  *   **Announcement:** "Drought/Pestilence."
  *   **Foragers:** Harvest is now 2 slips/round. Cost is still 2. They break even. No stress, just no surplus.
  *   **Farmers:** Harvest is now 1 chip/round (roll die, subtract 2). **They cannot survive on harvest alone.** They must eat from storage.
  *   **The Hidden Mechanic Reveals:**
      *   Tell the Farmers: "Those with Red Tokens control the communal safety net. If a Blue Token holder runs out of personal chips, they must ask a Red Token holder for a loan."
      *   **The Kicker:** The Red Token holder sets the terms. Usually: "Give me 2 chips next round" or "Do my chore (wash the whiteboard/hand out papers)."
      *   *Watch the dynamic shift.* The "successful" farmers suddenly become bosses. The "unlucky" ones become servants.

  **Round 4: Lock-In**
  *   **Foragers:** Continue as normal. Boring but free.
  *   **Farmers:** The debt compounds. If you owed chips in Round 3, you start Round 4 with a deficit. You now have to work *for* the Patrons to get enough to eat.
  *   **End Game:** Stop play. Ask them to freeze.

  ---

  ### **3. Debrief (25 mins)**
  Bring groups together. This is where you do the heavy lifting.

  **Phase 1: The Vibe Check**
  *   Ask Foragers: "How did you feel?" (Likely: Relaxed, bored, egalitarian).
  *   Ask Farmers: "How did you feel?" (Likely: Stressed, competitive, resentful of the Red Tokens).
  *   *Point:* Affluence isn't just calories. It's the ratio of wants to means. Foragers lowered wants (can't store). Farmers raised wants (storage = security) but created new social costs.

  **Phase 2: Mapping the Debt**
  *   Ask the Red Token holders: "When did you realize you had power?"
  *   Ask the Blue Token holders: "When did you feel you lost freedom?"
  *   **The Theory:** Connect this to **David Graeber's *Debt: The First 5000 Years*** and **James C. Scott's *Against the Grain***.
      *   Grain is legible. It can be counted, stored, and taxed.
      *   Once you store food, you create a "claim." "I have food, you need food, therefore you owe me."
      *   Hierarchy isn't just a king with a sword; it's a neighbor with a granary.

  **Phase 3: What the Game Misses (Crucial)**
  Be honest. The sim makes Foraging look too easy.
  *   **Health:** Tell them: "In reality, the Farmers would be 6 inches shorter and have rotting teeth by Round 3." (Cite Cohen's *Health and the Rise of Civilization*).
  *   **Ecological Lock-In:** The Farmers can't just quit. If they stop farming, the population density (7 people in a small spot) starves. They *need* the surplus to sustain the density they created.
  *   **Violence:** In the game, debt was chips. In reality, debt enforcement is violence. We didn't simulate the guys with spears who come if you don't pay the grain.

  ---

  ### **Predictable Failure Points (And Fixes)**

  1.  **The Hoarder:** One Farmer rolls huge numbers and keeps *all* the chips, refusing to lend even when asked.
      *   *Fix:* As the GM, introduce a "Theft" event in Round 4. "Because the disparity was so high, the Blue Tokens raided the cup." This teaches that extreme inequality destabilizes the system (Scott's point on fragile early states).
  2.  **The Commie Farmers:** They pool all chips immediately and ignore the Red/Blue tokens.
      *   *Fix:* Enforce the rule strictly. "No, the rules of storage imply private ownership. You can't just pool it. The grain is in *your* bin."
  3.  **Forager Boredom:** They finish in 2 minutes and check their phones.
      *   *Fix:* Give them a "Socializing" task. They must agree on a story or song every round to "bind the band." If they don't, morale drops (abstract penalty). This highlights the social richness of foraging life.
  4.  **Confusion on Tokens:** Students ask what the Red/Blue tokens mean immediately.
      *   *Fix:* Gaslight them slightly. "You'll find out when you need them." Or, "It represents social standing." Let them infer the power dynamic.

  ### **Instructor Cheat Sheet (The "Why")**
  *   **Sahlins:** Original Affluent Society = wanting little, not having much.
  *   **Scott:** Grain creates the state because it can be stored/taxed.
  *   **Graeber:** Debt creates morality/hierarchy before money exists.
  *   **Diamond:** Worst mistake in human history (health/ecology).

  **Typo check:** make sure you print enough slips. dont forget the dice.

  This should get them arguing in the hallway after class. Good luck.
