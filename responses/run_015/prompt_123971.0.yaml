  *If you store >X, you get a Gold Card.*
  *If you store <Y, you get a Grey Card.*
  *Rule (revealed mid-game): Gold can demand 1 action from Grey.*
  *Actually, better:* Don't reveal the rule. Just let Golds try to demand. Back them up as the GM. "Actually, looking at the contributions, Sarah has say in this."

  *Let's go with the "Social Ledger" approach.* It's more anthropological.

