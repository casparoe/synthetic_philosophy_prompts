      *   *The Core Issue:* The user is likely right. "Function" is polysemous in biology. CR answers "What does it do?" (capacity). SE answers "Why is it here?" (explanation of presence).
      *   *Why the stalemate?* Both sides think they are defining *the* concept of function, rather than *a* concept useful for specific explanatory projects. Philosophers often seek necessary and sufficient conditions for a single natural kind. Biologists often use terms pragmatically.
