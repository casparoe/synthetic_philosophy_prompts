      You have a sharp eye because the tension is real, but you are pointing at the wrong culprit. Five is not the wobbly one; it is standard compatibilism and holds up fine if freedom is about responsiveness to reasons rather than metaphysical indeterminacy. The real collision, the one that threatens to break the column, is between One and the combination of Two and Three.

      If objective chance is real, as you say in Three, then the future is not settled. If the future is not settled, there are no existing facts to make future claims true, which is exactly what you argue in Two. But if there are no facts to make them true, you cannot maintain One, which insists every future claim is already true or false. You cannot have it both ways. Either the truth is already there, which kills objective chance, or the chance is real, which means the truth value is currently missing. This is the worst conflict because it is a logical contradiction at the foundation of your metaphysics.

