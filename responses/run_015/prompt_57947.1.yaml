answer: |-
  # The Speech Act Audit: A Revision Tool for Fictional Dialogue

  **Prepared for:** The Author
  **Purpose:** To ensure narrative coherence regarding binding verbal acts (bets, orders, vows, etc.).
  **Time Required:** 10–15 minutes per scene.
  **Basis:** Adapted from J.L. Austin's *How to Do Things with Words* and subsequent speech act theory, stripped of jargon.

  ## Part 1: The Procedure

  This checklist is designed to test whether a character's words successfully *do* something in the world of your story, rather than merely *say* something. Work through the five steps in order. If any step results in a 'Stop', the act has failed (misfired). If you pass all steps, the act is binding within the fiction.

  ### Step 1: The Intent (Did they mean to do it?)
  *   **Question:** Did the speaker intend to perform this specific act (e.g., to bet, to order, to marry), or were they joking, rehearsing, acting in a play, or speaking metaphorically?
  *   **Sufficient Answer:** The text must support that the speaker meant the words to change the situation.
  *   **Stop Condition:** If the speaker was clearly joking, quoting, or acting, the act is void. Proceed no further.
  *   **Authorial Judgment:** If the intent is ambiguous, you must decide: is the ambiguity a plot point (e.g., gaslighting) or a draft error?

  ### Step 2: The Authority (Are they allowed to do it?)
  *   **Question:** Does this act require special status, office, or institutional backing (e.g., a judge sentencing, a priest marrying, a captain ordering)?
  *   **Sufficient Answer:**
      *   *For informal acts (betting, promising, apologising):* No special authority needed. Pass.
      *   *For formal acts (marrying, arresting, bequeathing):* The character must hold the valid licence, role, or power at that exact moment.
  *   **Stop Condition:** If a formal act is attempted without the requisite authority, the act is a **Misfire**. It is void from the start.
  *   **Authorial Judgment:** You may override this for thematic reasons (see Part 3), but acknowledge this breaks procedural logic.

  ### Step 3: The Form (Did they say the right sort of thing?)
  *   **Question:** Were the words clear enough to be recognised as this specific act within this culture or setting?
  *   **Sufficient Answer:** The words need not be legalistic, but they must follow the social script. (e.g., "I bet" works; "I suspect" does not). Indirect orders ("It's cold in here") count if the hierarchy supports them.
  *   **Stop Condition:** If the phrasing is so obscure that no reasonable person in that setting would recognise the act, it is a **Misfire**.
  *   **Authorial Judgment:** Distinguish between 'unclear' and 'subtle'. Subtlety is a literary virtue; obscurity is a procedural error.

  ### Step 4: The Uptake (Did the listener get it?)
  *   **Question:** Did the addressee understand that the act was being performed and, where required, accept it?
  *   **Sufficient Answer:**
      *   *For orders/bets:* The listener must understand an order/bet is being made. Acceptance can be silent (nodding, complying).
      *   *For promises/apologies:* The listener must hear the commitment/regret.
  *   **Stop Condition:** If the listener genuinely believes no act was attempted (e.g., thinks an order was merely a observation), the act is **Unsecured**. It exists as an attempt, but lacks binding force on the listener.
  *   **Authorial Judgment:** If the listener *should* have understood but didn't due to negligence, the act may still count as 'Issued' for the purpose of blame.

  ### Step 5: The Sincerity (Did they mean what they said?)
  *   **Question:** Did the speaker intend to follow through?
  *   **Sufficient Answer:** It does not matter if they lie. A promise made with intent to break is still a promise (an **Abuse**, not a Misfire). A bet made with insider knowledge is still a bet.
  *   **Stop Condition:** None. Insincerity makes the character a liar or a cheat, but the *act* itself remains valid.
  *   **Authorial Judgment:** Do not void the act here. Save the moral judgement for the consequences.

  ---

  ## Part 2: Limitations and Risks

  Be honest about what this tool does. It is a structural check, not a measure of emotional truth.

  1.  **The 'Magic' Risk:** This procedure assumes your fictional world operates roughly like our own regarding language. If you are writing high fantasy where words literally cast spells, Step 2 (Authority) changes entirely.
  2.  **The 'Feelings' Risk:** A marriage can be 'void' by this checklist but 'real' to the characters. This tool measures institutional validity, not emotional resonance.
  3.  **The 'Time' Risk:** An act can be valid now and voided later (e.g., a contract overturned by a higher court). This checklist assesses the moment of utterance, not the long-term enforcement.
  4.  **The 'Ambiguity' Risk:** In life, uptake is often messy. This tool forces a binary choice (Success/Fail) to aid your plotting. Do not let it sterilise your dialogue; use it to ensure the *consequences* match the *attempt*.

  ---

  ## Part 3: Worked Applications

  Here is the procedure applied to your three draft scenes.

  ### Scene 1: The Bet (Leeds Pub)
  *Context:* Elder brother: "Fifty quid says Dad walks out before midnight." Younger brother: Laughs, nods, orders pint. Later dispute on validity.

  *   **Step 1 (Intent):** Pass. The elder brother is making a challenge, not telling a joke or a story.
  *   **Step 2 (Authority):** Pass. Betting between adults requires no institutional licence.
  *   **Step 3 (Form):** Pass. "Fifty quid says..." is a standard idiom for wagering in this cultural context.
  *   **Step 4 (Uptake):** Pass. The younger brother's nod and the act of ordering a pint (continuing the social engagement) constitute silent acceptance. In informal settings, explicit verbal acceptance ("You're on") is not strictly required if conduct implies agreement.
  *   **Step 5 (Sincerity):** Pass. Even if the elder brother knows Dad is already leaving, the bet stands (he is merely cheating).

  **Verdict:** **Successful Act.**
  **Narrative Consequence:** The bet was made. The later dispute is not about whether the act *happened*, but about one party reneging on a binding agreement. The tension lies in the breach of honour, not the voiding of the wager.

  ### Scene 2: The Order (Coastal Freighter)
  *Context:* Captain: "It would be nice if that hatch were secured before dark." Deckhand: Hears as observation. Accident follows. Inquiry turns on validity of order.

  *   **Step 1 (Intent):** Pass. The Captain intends compliance.
  *   **Step 2 (Authority):** Pass. The Captain holds command authority on the vessel.
  *   **Step 3 (Form):** Pass. This is an 'indirect speech act'. In a hierarchy, a superior's expression of preference functions as a command. The phrasing is polite but clear enough for a professional crew.
  *   **Step 4 (Uptake):** **Complicated.** The deckhead did *not* understand it as an order. Strictly speaking, without uptake, the act is unsecured. *However*, in a disciplined service, the burden of understanding lies with the subordinate. The Captain *issued* the order; the Deckhand failed to secure the uptake.
  *   **Step 5 (Sincerity):** Pass. The Captain meant it.

  **Verdict:** **Successful Order (Issued).**
  **Narrative Consequence:** For the purpose of the inquiry, the order was given. The fault lies with the Deckhand's failure to recognise the command structure. The act is binding, making the accident a result of disobedience (or incompetence), not a lack of instruction.

  ### Scene 3: The Elopement (Cliffside)
  *Context:* Friend (lapsed ordination) pronounces couple married. Couple replies: "We will love you always." Inheritance dispute drives final act. You wish readers to accept them as married.

  *   **Step 1 (Intent):** Pass. All parties intend to marry.
  *   **Step 2 (Authority):** **FAIL.** You specify the ordination has lapsed. In most jurisdictions (and realistic fiction), the authority to solemnise marriage is a legal licence, not a spiritual state. Without valid registration or licence at the moment of utterance, the officiant lacks the institutional power to change the couple's legal status.
  *   **Step 3 (Form):** Pass. The words of pronouncement were spoken.
  *   **Step 4 (Uptake):** Pass. The couple accepted the pronouncement.
  *   **Step 5 (Sincerity):** Pass. All were sincere.

  **Verdict:** **Misfire (Void).**
  **Narrative Consequence:** By the rules of this procedure, the marriage did not happen. They are cohabiting partners, not spouses.

  ---

  ## Part 4: The Verdict You Will Not Like

  I must draw your attention to **Scene 3**.

  **The Verdict:** The procedure declares the marriage **Void**.
  **Your Preference:** You wish readers to accept them as married "in every sense that matters" for the inheritance dispute.
  **Why the Procedure Requires This:**
  This tool is grounded in the philosophy of *institutional facts*. A marriage, unlike a promise or a bet, relies entirely on external validation (the State or Church). J.L. Austin calls this a 'Misfire': if the conventional procedure does not exist or is not possessed by the actors, the act is null. No amount of sincerity, love, or reader sympathy can conjure institutional authority where the text explicitly removes it.

  **The Risk:**
  If you proceed with your dramatic preference (that they *are* married) while maintaining the textual fact (that the ordination *lapsed*), you risk a coherence failure. If the inheritance dispute is resolved by a court or a solicitor in the final act, they will lose. If they win, the reader may feel the legal system in your book is incompetent, or that you have waved a magic wand to fix the plot.

  **Recommendation:**
  You have authorial sign-off. You may override this verdict. However, to maintain coherence, you must shift the burden. Either:
  1.  **Change the Fact:** The ordination did not lapse (fixes the procedure, keeps the plot).
  2.  **Change the Plot:** The inheritance dispute turns on *common-law* status or a will written in their favour, rather than marital status (acknowledges the misfire, keeps the tragedy).
  3.  **Embrace the Void:** They believe they are married, but the law says they are not. This creates a more poignant tragedy for the final act, aligning the procedural truth with the emotional stakes.

  ---

  ## Part 5: What This Procedure Cannot Settle

  Finally, a note on the limits of this audit.

  This tool cannot measure **Perlocutionary Effect**. It can tell you if an apology was successfully *made* (Step 1–5), but it cannot tell you if it was *accepted* or if it healed the rift. That depends on your characters' psychology, not their linguistics.

  It cannot settle **Thematic Truth**. A marriage may be legally void (as in Scene 3) but thematically 'real' within the emotional arc of the novel. This procedure protects your plot's logic; it does not govern your novel's soul.

  It cannot predict **Reader Morality**. Readers may forgive a character for breaking a promise (Step 5 says the promise stands) if the reason was noble. The act remains binding, but the judgement varies.

  Use this audit to ensure the scaffolding of your plot is sound. Once the beams are bolted tight, you are free to paint them whatever colour your story requires.
