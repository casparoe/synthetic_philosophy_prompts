answer: |-
  1. The deflationary claim is that "residue" is merely "thick description" renamed. Thickness suggests density; residue suggests friction. A text can be thickly described yet fully assimilated by a verdict—for instance, a biography that details every complex motivation behind a saintly act but concludes all were virtuous. Here, complexity serves the verdict. Your condition survives only if the detail actively threatens the verdict's stability, making the verdict look like a simplification. The discriminating case would be a naturalist novel versus a biography. A novel can offer unassimilated detail without a verdict, creating ambiguity. A biography requires the verdict to create the tension. If the detail does not make the verdict seem inadequate, it is merely ornament. The condition holds only if "residue" implies a failure of the author's explanatory power, not just richness of data.

  2. The four-way contrast cuts reasonably well, but "debunking biography" is often just inverted hagiography, sharing the same structure of total assimilation. You miss a fifth kind: the "Explanatory Biography." Here, detail is assimilated not by moral verdicts but by causal explanations—psychology, sociology, or historical determinism. The subject is not virtuous or vicious but determined by trauma or context. This teaches determinism, not salience. Your account would misclassify this as debunking, but it is distinct because it removes moral agency entirely rather than negating it. This is a significant omission because it represents the dominant modern mode of life-writing. If your thesis is about moral teaching, this category is the true rival, not the debunker. It bypasses the moral question rather than answering it badly.

  3. The bootstrapping objection is fatal if left as is. To see detail as recalcitrant, the reader must already judge the verdict insufficient. Noticing a contrast between two lives requires the same faculty the text is supposed to install. Your reply regarding contrast cases is circular because the reader must already possess the salience to see the contrast as morally relevant. Narrow the thesis: biography does not install the faculty ex nihilo; it refines existing social perception. This is still worth arguing because it explains why advanced students need harder texts while beginners need legibility. The value shifts from "moral initiation" to "moral calibration." Acknowledge that the text relies on pre-existing social competence. This saves the argument from claiming magic where there is only development.

  4. The stage-relativity concession does not eat the thesis; it saves it. If legibility nourishes one reader and poisons another, the essay's subject has indeed shifted from text to audience. This is a gain to be advertised. It transforms the essay from a static taxonomy of genres into a dynamic account of moral development. Reorganize the draft around the lifecycle of the reader's perception. Begin with the learner's need for hagiographic stability, then move to the advanced need for Plutarchan friction. This makes the defense of hagiography central rather than concessive. It allows you to argue that the failure of hagiography is not intrinsic but contextual. The cost is minimizing the text's intrinsic properties, but the gain is a functional theory of how moral reading works over time.

  5. The single addition that would most increase interest is the role of the reader's own verdict conflicting with the author's. Maximum residue occurs when the reader rejects the author's conclusion but accepts the details. This creates a friction the author did not intend, turning the reading into an active negotiation rather than passive reception. This strengthens the claim that the teaching lies in the reader's labor. The weakest link is the claim that a biographer's incomplete understanding is a feature. A hostile referee will identify this as an apology for sloppiness. It risks rewarding incompetence. Reframe this: it is not ignorance that helps, but honesty about limits. The biographer must signal that the detail resists their understanding, not that they lack understanding. A referee will attack the original phrasing because it undermines the genre's claim to knowledge.

  6. The argument secretly depends on historical reliability. If the residue is known to be fabricated, the tension is aesthetic, not moral. The reader must believe the detail was found, not made. If the genre promise is broken, the teaching mechanism collapses into fiction. You cannot set this aside entirely because the moral weight of the residue relies on its reality. A fictional flaw teaches us about art; a real flaw teaches us about life. The claim to truth is the operative mechanism, even if the truth is uncertain. You must assert that the reader's belief in the detail's authenticity is necessary for the residue to function as moral training. Without this, the distinction between biography and novel vanishes, and your specific claims about life-stories lose their ground.
