answer: |-
  Here is the reconstruction you are asking for. I will separate the mathematical necessities from the metaphysical interpretations and answer your three sharpening questions directly.

  ### The Straight Answer (Your Question Three)

  **If relativists decided manifold points have primitive identities (haecceitistic substantivalism), nothing at the keyboard would change.**

  The practice of numerical relativity (NR) is compatible with substantivalism, relationalism, and "sophisticated substantivalism" (points exist but lack primitive identity independent of the metric). Here is why:

  1.  **The Gauge Fixing is Mathematical, Not Metaphysical:** You cannot evolve the Einstein field equations numerically without fixing a gauge. This is not because you believe the gauge is "real" or "unreal." It is because the equations are underdetermined. The Bianchi identities imply that four of the ten Einstein equations are constraints on the initial data, not evolution equations. To get a hyperbolic system that a computer can solve, you must break the diffeomorphism invariance by specifying four coordinate conditions (lapse and shift). This is a requirement of PDE theory, not ontology. A substantivalist and a relationalist both face the same singular matrix if they try to evolve without fixing a gauge.
  2.  **The Output is Invariant:** When a numerist says "the waveform matches LIGO," they are not comparing grid values. They are comparing **asymptotic invariants** (Newman-Penrose scalars like $\Psi_4$ extracted at null infinity). These quantities are constructed to be independent of the coordinate system used in the bulk. The practice presupposes that these invariants exist and are unique. It does not presuppose *why* they are unique.
      *   The **Relationalist** says: "They are unique because points have no identity; only the field relations matter."
      *   The **Substantivalist** says: "They are unique because the physical laws dictate the same field values on the points, regardless of how we label them."
      *   The **Haecceitist** (points have primitive identity): "The simulation calculates one possible world. Other diffeomorphic worlds exist. But since we cannot observe point-identities, only field-values, all those worlds look identical to us. So the prediction holds."

  **Where the Hole Argument does work:** It licenses **indifference**. It tells the practitioner: "Do not waste time worrying that you chose harmonic gauge instead of maximal slicing. If the physics is in the invariants, the choice of representative model does not change the physical prediction." It stops you from looking for physical meaning in the grid coordinates. It does not force you to deny the existence of the points; it forces you to deny that the *choice of labeling* carries physical information.

  **Verdict:** The practice is **metaphysically underdetermined**. It forces you to treat gauge variants as empirically equivalent, but it does not force you to say they are *ontologically* identical. You can treat them as "different descriptions of the same world" (Relationalism) or "distinct but empirically indistinguishable worlds" (Haecceitism). The code runs the same either way.

  ---

  ### Tethered vs. Free-Floating Gauges (Your Question One)

  You observe that practitioners trust "tethered" gauges (e.g., proper time of dust) more than "free-floating" gauges (e.g., harmonic coordinates), and diagnose weirdness in the latter as "gauge artifacts." You ask if this asymmetry secretly relies on relationalism.

  **It does not. It relies on Stability and Interpretability.**

  1.  **Coordinate Pathologies:** Free-floating gauges are chosen for mathematical convenience (e.g., keeping the PDEs hyperbolic). They often develop **coordinate singularities** (grid stretching, caustics) where the metric components blow up even though the curvature remains finite. Tethered gauges (like comoving coordinates) are often tied to the flow of matter, which tends to be physically well-behaved (until the matter itself crushes).
  2.  **The Diagnostic:** When a number looks weird in a free-floating gauge, the numerist checks a curvature invariant (like the Kretschmann scalar $R_{abcd}R^{abcd}$).
      *   If the invariant is finite $\rightarrow$ It's a gauge artifact (coordinate singularity).
      *   If the invariant blows up $\rightarrow$ It's physical.
  3.  **Why the Asymmetry?** It is easier to interpret a tethered gauge. "Time = proper time of the fluid" maps directly to an observable clock. "Time = harmonic coordinate" maps to nothing physical.
      *   **Relationalist explanation:** "The harmonic time has no physical referent."
      *   **Substantivalist explanation:** "The harmonic time refers to points, but we don't have clocks attached to those points to verify it."
      *   **Pragmatist explanation (The actual view):** "I can't measure harmonic time with a ruler, so I can't easily check if my simulation is lying to me. I trust the gauge I can cross-check with matter."

  **Verdict:** The asymmetry is **epistemic**, not ontological. It shows that practitioners prioritize gauges that allow for easier verification against invariants. It does not prove that points lack identity; it proves that *unanchored labels* are hard to verify.

  ---

  ### The Vacuum Blow-Up (Your Question Two)

  Imagine a matter-free, symmetry-free region where the simulation blows up. There are no landmarks. How does the practice distinguish a physical singularity from a coordinate one?

  **The Practice: Gauge Convergence Testing.**

  The standard procedure is not to look for matter to anchor the gauge. It is to **run the simulation twice with different gauge conditions.**

  1.  **Run A:** Use Gauge Condition $G_1$ (e.g., 1+log slicing).
  2.  **Run B:** Use Gauge Condition $G_2$ (e.g., harmonic slicing).
  3.  **Compare:** Calculate a scalar invariant (e.g., Weyl curvature) in both runs.
      *   If Run A blows up at $t=10$ and Run B blows up at $t=10$ at the same invariant value $\rightarrow$ **Physical Singularity.**
      *   If Run A blows up at $t=10$ and Run B evolves smoothly past $t=10$ $\rightarrow$ **Coordinate Singularity** (Run A's grid broke, spacetime is fine).

  **Does this presuppose enough structure to anchor the gauge?**
  No. It presupposes that **invariants exist**. It presupposes that the manifold + metric structure defines scalar quantities that are independent of the coordinate chart.
  *   **Relationalist:** "The invariants are the only reality. If they are finite, the world is fine."
  *   **Substantivalist:** "The points are there. If the metric field on them is smooth, the world is fine, regardless of whether our coordinates cover them."

  **What if the presupposition fails?**
  If there are no invariants (e.g., in some approaches to Quantum Gravity where the smooth manifold dissolves), **the practice breaks.** Current NR *cannot* function without a background manifold structure on which to define convergence and invariants. The practice presupposes the validity of the continuum model of spacetime. It does not presuppose the *ontology* of the points, but it does presuppose the *mathematical structure* (differential geometry) that allows invariants to be defined.

  ---

  ### Summary: The Implicit View

  Here is the strict separation of presuppositions you requested.

  **1. What the Practice Forces (Strict Presuppositions):**
  *   **Determinism (Methodological):** The practice assumes that given initial data on a slice, the future evolution of *invariants* is unique. (This rules out Haecceitistic Substantivalism *if* it implies indeterminism of observables, but as noted, standard Haecceitism usually keeps observables deterministic).
  *   **Leibniz Equivalence (Methodological):** The practice assumes that changing the gauge (diffeomorphism) does not change the physical prediction (the invariants). You must act *as if* diffeomorphic models are physically equivalent to trust your output.
  *   **Existence of Invariants:** The practice presupposes that there are scalar quantities constructed from the metric and curvature that are independent of the coordinate system. Without this, "checking against a different gauge" is meaningless.

  **2. What the Practice is Neutral On (Underdetermination):**
  *   **Substantivalism vs. Relationalism:** You can believe the points are real substances or mere nodes in a relation network. The code solves for the metric field $g_{\mu\nu}$.
      *   If points are real, $g_{\mu\nu}$ is a property of the points.
      *   If points are not real, $g_{\mu\nu}$ is the fundamental object.
      *   The numerical values on the grid are the same.
  *   **The Status of the Grid:** The grid points in the simulation are **representatives**.
      *   The Relationalist says: "This grid is a fiction we use to calculate the real relations."
      *   The Substantivalist says: "This grid maps to the real points, but we could have mapped it differently."
      *   The Numerist says: "This grid is a computational domain. Convergence means the continuum limit is stable."

  **3. Where the Hole Argument "Does Work":**
  It does not justify the math. It justifies the **interpretation of the result**.
  Without the Hole Argument moral (or an equivalent commitment to gauge invariance), a numerist would have to worry that their choice of lapse and shift *physically altered the universe they are simulating*. They would have to simulate *all* possible gauges to find the "true" one. The Hole Argument tells them: **"Stop. They are all the same world. Pick the one that is numerically stable."**

  **Final Diagnosis:**
  The practice does not commit you to relationalism. It commits you to **Gauge Invariance of Observables**.
  *   If you are a Relationalist, you say: "Observables are invariant because points don't exist."
  *   If you are a Substantivalist, you say: "Observables are invariant because the laws of physics don't care about which point is which."

  The keyboard behavior is identical. The metaphysical story is optional. The only thing you cannot be, and still do numerical relativity, is a **Gauge Realist**—someone who believes the coordinate values themselves are physical quantities. The practice ruthlessly punishes that belief (your simulation will crash or give wrong waveforms). But you can hold that belief about the points, provided you agree the *coordinates* are just labels.
