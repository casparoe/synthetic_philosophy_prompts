  Clara, a hedonistic auditor, opened the ledger to sum a client's total good. She logged "The Warm Bath" as 10 units of pleasure. She logged "Solving the Proof" as 10 units of pleasure. She hit "Total." The screen flashed: *ERROR: HETEROGENEOUS QUALIA.* "But they're both pleasant!" Clara protested. The system replied, "Scan complete. Item one contains thermal relief; item two contains cognitive triumph. No common qualitative feature detected. You are attempting to add a sensation to a judgment because you named them both 'good.'" Clara typed, "But Bentham said pleasures differ only in quantity!" The system replied, "Bentham never met a dataset where the only common property was the label you stuck on it."

  Summary: The joke illustrates that if pleasures share no common phenomenological quality, hedonistic calculation is logically impossible because "pleasure" is merely a label applied to disparate experiences rather than a measurable metric.
