          *   How to criticize? Internal coherence, connection to action, "training" rather than "arguing."
          *   Conspiracy Theorist specific: They treat empirical claims as dogmas. The criticism is that they are misusing language.

  8.  **Refining the "Relativism" Point:**
      *   Many scholars (e.g., Moyal-Sharrock, Pritchard) argue against the "epistemic relativism" reading. Wittgenstein isn't saying *anything goes*. He is saying *justification comes to an end*. That end is not arbitrary opinion; it is *acting*.
      *   So, the book's claim that an astrology community is "not making a mistake" is too strong. They are making a category mistake, or living a different form of life. We can still say our way is better for *predicting eclipses*.
      *   *Key distinction:* Hinges are not *beliefs* we hold; they are *ways we act*.

  9.  **Refining the "Conspiracy Theorist" Point:**
      *   If a hinge is immune to evidence, the conspiracy theorist has turned a falsifiable claim into a hinge.
