prompt: |-
  As a retired experimental physicist who has lately turned to philosophy of science, I have been considering Douglas Hofstadter's proposal that creativity largely consists in adjusting continuous parameters—knobs—within conceptual spaces, together with analogical slips between those spaces. Rather than treating art or music, please describe the most important implications of this knob-twiddling model for evaluating claims of originality in scientific theorising: specifically, how ought one to distinguish a genuine conceptual breakthrough from what is essentially a parametric tweak within an established formalism? Please answer in British English.
