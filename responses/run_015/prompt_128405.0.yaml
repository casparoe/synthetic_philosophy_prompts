answer: |-
  You have correctly identified that the mathematical impossibility theorems describe the *terrain*, but they do not provide the *compass*. Your verdicts are not inconsistent; they are context-sensitive, relying on implicit distinctions between types of harm, the legitimacy of the status quo, and the nature of the decision (punitive vs. allocative).

  Here are three candidate principles derived from your reasoning, designed to be operationalized for vendor review.

  ### Principle 1: The Baseline Non-Retrogression Principle (with Legitimacy Exception)

  **Statement:** A new automated system is permissible only if it does not increase the rate of the primary adverse outcome (e.g., detention, eviction, readmission) for any protected group relative to the human decision-making process it replaces. **Exception:** This constraint may be violated if and only if the increase is the direct, causal result of removing an input variable deemed *illegitimate* (e.g., prior arrests, zip codes acting as racial proxies).

  *   **Clause-Motivating Case:** **Case (7).** You accepted a model that made the North-side group worse off than the judges because it removed "prior-arrest count." Without the exception clause, this principle would forbid the model. With the clause, it permits the degradation as the cost of structural sanitization.
  *   **Verdicts to Abandon:** You must abandon the intuition in **Case (2)** if the false-positive parity model actually *lowers* the detention rate for the North-side group relative to the judges. Your verdict there was driven by the increase in re-arrests (public safety), but this principle focuses on the *decision outcome* (detention). If the model detains fewer people without using illegitimate features, this principle says "deploy," even if re-arrest rates rise.
  *   **Eviction-Prevention Verdict:** **Permissible.** If the human baseline denies 50% of Group A and 20% of Group B (leading to evictions), and the model denies 30% of both (equalizing harm) but wastes more money on Group A (False Positives), this principle approves it. The adverse outcome (eviction) has not increased for any group relative to the baseline; the cost (wasted funds) is irrelevant to this constraint.
  *   **Separator Case:** **The "Efficiency Trade-off" Case.** A model replaces human caseworkers. It reduces the error rate for Group A by 10% but increases the error rate for Group B by 2% relative to the humans. It uses no illegitimate features.
      *   *Principle 1 Verdict:* **Reject.** Group B is made worse off relative to baseline, and no illegitimate feature removal justifies it. (This separates it from utilitarian principles that would accept the net gain).

  ### Principle 2: The Harm-Cost Asymmetry Principle

  **Statement:** Parity is mandatory for error types that inflict direct, non-monetary harm on the individual (e.g., loss of liberty, loss of housing, health decline). Parity is *not* required for error types that inflict fiscal or administrative cost on the state (e.g., unnecessary cash payments, wasted appointment slots), provided the system remains solvent.

  *   **Clause-Motivating Case:** **The Eviction-Prevention Case.** You explicitly stated you do not care about unequal False Positive rates (wasted payments) in the eviction case, whereas you cared deeply about unequal False Positive rates (false detentions) in **Case (1)**. This principle codifies that distinction: detention is a harm to the person; wasted tax dollars are a cost to the system.
  *   **Verdicts to Abandon:** You may need to soften your stance on **Case (3)** (Hospital Slots). Under this principle, a False Positive (giving a slot to someone who won't readmit) is a *cost*, but a False Negative (denying a slot to someone who does readmit) is a *harm*. If the uncapped model creates a massive disparity in False Negatives (low-income patients readmitting at higher rates because they were denied slots), this principle might demand capping to equalize the *harm*, contradicting your preference for pure risk-ranking.
  *   **Eviction-Prevention Verdict:** **Mandate FN Parity.** You must tune the model to equalize the rate at which eligible people are wrongly denied (False Negatives), even if this results in one group receiving significantly more unnecessary payments (False Positives).
  *   **Separator Case:** **The Fraud Detection Case.** An algorithm flags welfare recipients for investigation. A False Positive is an invasive investigation of an honest recipient (Harm). A False Negative is a fraudulent payment going undetected (Cost).
      *   *Principle 2 Verdict:* **Mandate FP Parity.** The rate of invasive investigations must be equal across groups, even if it means fraud goes undetected at higher rates in one group. (This separates it from Principle 1, which would look at the baseline investigation rate).

  ### Principle 3: The Input Legitimacy Principle

  **Statement:** A model is unfair if it relies on input features that are themselves the product of the systemic bias the model is meant to mitigate, regardless of the model's predictive accuracy or error rate parity. Fairness is achieved at the data-ingestion layer, not the decision-threshold layer.

  *   **Clause-Motivating Case:** **Case (4) and Case (7).** In Case (4), you accepted the corrupted label because the model wasn't *causing* the neglect. In Case (7), you demanded the removal of prior arrests because the data *was* the bias. This principle argues that threshold tuning (Cases 1 & 2) is a distraction if the inputs are poisoned.
  *   **Verdicts to Abandon:** You must abandon the detailed threshold debate in **Cases (1) and (2)**. If the "north-side precinct" variable or "prior arrest" variable is included, this principle declares the model unfair *before* you look at the false positive rates. It renders the impossibility theorem moot by restricting the feasible set of models.
  *   **Eviction-Prevention Verdict:** **Audit Inputs.** Before checking error rates, you must verify that predictors like "credit score," "prior eviction filing," or "zip code" are not used, or are adjusted, because they encode historical housing discrimination. If they are used, the model is rejected regardless of its parity metrics.
  *   **Separator Case:** **The "Proxy" Case.** A hiring model excludes "college degree" as a requirement because it correlates with race, but includes "gap in employment history." The gap variable is highly predictive but correlates even more strongly with race due to caregiving norms.
      *   *Principle 3 Verdict:* **Reject.** The model fails because it ingests a feature (employment gap) that is a product of the systemic bias (gendered caregiving) the hiring policy aims to mitigate.

  ---

  ### The Partition Problem

  You asked which partition of the population fairness is supposed to be measured over (official groups, precincts, age bands).

  **The Honest Answer:** There is no mathematical solution to this. It is a political and legal boundary condition.
  *   **The Compliance Floor:** You must measure against the groups protected by law (Race, Sex, Age, Disability). If you clear these, you are legally safe.
  *   **The Moral Ceiling:** You should measure against precincts or neighborhoods *if* they map to historical segregation or systemic neglect (as your North-side example suggests).
  *   **The Operational Rule:** If a model passes parity on protected classes but fails on precincts, you have identified a *geographic* inequity that the law may not yet recognize but your board morally should. If it passes on precincts but fails on race, you likely have a proxy problem (Principle 3).
  *   **Recommendation:** Demand vendors report disparities across **both** legally protected classes and geographically defined communities of concern. If they diverge, the divergence itself is a finding of fact your board should publish, even if you lack the authority to mandate a fix.

  ### The "Honest Answer" About Group Criteria

  You suspected that "no group-level criterion is doing any real work in my verdicts, and that they are all being generated by who bears which kind of harm."

  **You are correct.**

  Your verdicts are not driven by a desire for statistical parity. They are driven by a **lexical ordering of harms**:
  1.  **Illegitimate Inputs:** (Case 7) Removing biased data is paramount, even if accuracy drops.
  2.  **Individual Liberty/Rights:** (Case 1, Eviction) Preventing direct harm to the person (jail, eviction) trumps system efficiency.
  3.  **Status Quo Anchoring:** (Case 5, 6) Do not make people worse off than the flawed human system, unless see #1.
  4.  **System Cost:** (Eviction FP, Hospital FP) Wasted money is the lowest priority.

  **What to demand from vendors instead:**
  Stop asking vendors for "Fairness Metrics" (which imply there is one number to optimize). Instead, demand a **Harm Impact Statement** for every new filing, requiring them to answer:
  1.  **Input Provenance:** Which features correlate with protected status, and what is the historical justification for their inclusion?
  2.  **Baseline Comparison:** Show the error distribution compared to the human decision-makers being replaced, not just against a theoretical ideal.
  3.  **Harm Allocation:** Explicitly label which errors cost the county money and which errors cost the citizen their liberty, health, or home.

  Your job is not to solve the impossibility theorem. Your job is to decide which impossibility result your county is willing to live with. Based on your verdicts, you are willing to live with higher costs and lower accuracy to avoid encoding historical bias and infringing on liberty. That is a coherent policy, even if it isn't a coherent statistic.
