      *   **The Category Mistake:** This is the core philosophical move. Individual rationality $\neq$ Collective rationality. A group is a pluralistic entity.
      *   **Value Pluralism:** Use the Liberty/Equality example. It's not a bug; it's a feature. Politics is about managing tension, not resolving it logically.
      *   **Critique of Procedural Fixes:** How do premise/conclusion procedures silence dissent? They force a decision where the polity isn't ready to decide.
      *   **Caveat/Contestation:** Acknowledge the counter-arguments (actionability, accountability, credibility). Don't present this as truth, but as a provocative stance.
