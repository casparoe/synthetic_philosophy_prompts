answer: |-
  Alright, let's settle in. I want to take the last ten minutes to push back on how we usually digest the List and Pettit result on the discursive dilemma.

  We've all seen the matrix. You have a group, you have a set of propositions that are logically connected (say, $P$, $Q$, and $P \land Q \rightarrow C$), and you run a majority vote. You end up with a situation where the majority accepts $P$, the majority accepts $Q$, but the majority rejects $C$. The group is inconsistent.

  The standard reaction in the literature—and honestly, the instinct most of us have—is to treat this as an engineering problem. It's a "bug" in the system. List and Pettit's impossibility theorem tells us we can't have universal domain, anonymity, systematicity, *and* consistency all at once. So, the literature spends its energy trying to salvage consistency. We tweak the aggregation rule (go premise-based vs. conclusion-based), we restrict the domain of admissible preferences, or we try to engineer "reason-based" constraints to force the group to act like a rational individual.

  But I want to argue for a more contrarian take. Specifically, when we are talking about *normative* premises—values, rights, political priorities—we should stop trying to solve the dilemma and just dissolve it. We should abandon the consistency requirement at the group level altogether.

  Here's the core claim: Forcing logical closure on a democratic body is a category mistake. It imports norms of individual rationality onto a pluralistic entity that isn't, and shouldn't be, an individual.

  ### The Formal Result vs. The Normative Leap

  First, let's be precise about what the math actually tells us. The formal result establishes an impossibility: under specific conditions, you cannot aggregate individual judgments into a collective set that is both complete and consistent. That's a descriptive constraint. It says, "If you want X, Y, and Z, you can't have Consistency."

  The normative leap happens when we assume Consistency is the thing we *must* have. We treat the impossibility of consistency as a tragedy that needs fixing. But why? Why is group consistency a virtue in the first place?

  In individual rationality, inconsistency is a failure because a single agent needs to act coherently over time to satisfy their own preferences. If I believe $A$ and $B$, but act as if not-$C$ (where $A \land B \rightarrow C$), I'm sabotaging my own agency. But a collective body doesn't have a single mind to sabotage. It has a multiplicity of minds.

  ### The Category Mistake

  When we demand that the group's output be logically closed, we are effectively demanding that the polity pretend to be a person. We're asking the group to speak with "One Voice." But in a pluralistic democracy, the group *doesn't* have one voice. It has a chorus, and sometimes that chorus is singing in counterpoint.

  Think about normative premises. Say we are voting on a platform. A majority might endorse "Maximize Liberty" and a majority might endorse "Maximize Equality." Logically, these can conflict. If we force consistency, we force the group to adopt a specific trade-off function—say, "Maximize Liberty *subject to* a floor of Equality."

  But what if the polity *doesn't agree* on that trade-off? What if the majority coalition for Liberty is different from the majority coalition for Equality? By forcing a consistent collective output, we are essentially manufacturing a unified will that doesn't exist. We are papering over the fragmentation.

  ### Consistency as Suppression

  This brings me to the critique of the standard procedural fixes. Whether you go premise-based (vote on the values, derive the policy) or conclusion-based (vote on the policy, ignore the values), you are suppressing real disagreement.

  If you go premise-based, you force the group to commit to a logical hierarchy of values that might not reflect the political reality. You're saying, "We agree on these axioms, so the conclusion is mandatory." But in politics, the disagreement is often *about* the axioms, or about how they weigh against each other in specific contexts.

  If you go conclusion-based, you get a decision, but you lose the normative reasoning. You get a policy without a public justification that the group actually endorses.

  Both fixes prioritize the *appearance* of rationality over the *reality* of pluralism. They treat the discursive dilemma as a failure of collective reasoning. I'm suggesting it's actually an honest representation of political conflict. Allowing the group to hold apparently contradictory attitudes—endorsing liberty in one context, equality in another, without a rigid meta-rule connecting them—isn't irrational. It's politically authentic. It leaves the tension open for future negotiation rather than closing it down via a logical operator.

  ### The Contestation

  Now, I need to flag this clearly: This is not the settled view. If you talk to a social choice theorist, they will push back hard.

  The main counter-argument is about **agency and accountability**. If a collective body is inconsistent, can it really act? If the legislature says $P$ and $Q$ but not $C$, and then tries to implement $C$, they look hypocritical. If they implement not-$C$, they look like they're ignoring their own premises. Critics argue that without consistency, the group loses credibility. It becomes unpredictable. It can't make binding commitments because its "beliefs" don't constrain its future actions.

  There's also the democratic defense of consistency: If citizens are supposed to be ruled by laws they give themselves, those laws need to make sense as a system. A contradictory legal order is uninterpretable.

  So, when I say we should abandon the consistency requirement, I'm not saying "anything goes." I'm saying we need to shift the normative ideal. Instead of "Collective Rationality," maybe the ideal is "Collective Integrity," which allows for acknowledged tension. Or maybe it's "Democratic Contestation," where the inconsistency is the signal that the debate isn't over, and forcing a resolution is premature.

  ### The Takeaway

  So, here's the provocation for next week: What if the discursive dilemma isn't a problem to be solved by better institutional design, but a feature of democratic life that we should preserve?

  List and Pettit show us that we can't have it all. The standard response is to sacrifice democracy (restrict the domain) or anonymity (give some people more weight) to save consistency. I'm suggesting we sacrifice consistency to save the pluralism. We stop asking the group to be an individual. We accept that the "public mind" is fragmented, and that our aggregation rules should reflect that fragmentation, not hide it behind a veil of logical closure.

  It's a risky move. It makes the collective look messy. But maybe the mess is the point.

  Think about that for your response papers. I'm particularly interested in whether you think a legally inconsistent state is viable, or if the demand for consistency comes from the nature of law itself, rather than the nature of rationality.

  Alright, let's break.
