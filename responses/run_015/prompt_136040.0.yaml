      *   **Topic:** Émilie du Châtelet's recipe for happiness (Study/Intellect + Passion/Engagement + Managed Self-Deception/Illusion) vs. Pure Stoicism (Extirpate Passions) vs. Pure Hedonism (Maximize Pleasure).
      *   **Task:** Provide credence (probabilities) on three specific sub-claims, combine them into an overall credence, identify the least confident term, and suggest evidence that would shift it.
