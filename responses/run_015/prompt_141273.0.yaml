      *   *Conditions:* Specific text changes. Debriefing must happen immediately after the intention report or after the session date? Probably after the session date passes to preserve the study, but that delays debriefing. Actually, debriefing should occur after the data collection is complete for that participant (i.e., after the Saturday passes).
      *   *Timeline:* 2 weeks for resubmission.

  6.  **Word Count Management:**
