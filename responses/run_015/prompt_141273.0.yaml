  8.  **Final Polish:** Check tone. Ensure it sounds like an IRB chair/member writing to a PI. (Self-correction: The prompt asks for a memo *I'll circulate* to the panel/PI? Usually, these go to the PI but are circulated to the panel. I will write it as a decision memo to the PI, copied to the panel, or a internal memo summarizing the decision. The prompt says "draft the memo I'll circulate... Approve, reject... say which one in the very first sentence." I will write it as a formal decision memo addressed to the PI but framed for the panel's record.) *Wait, re-reading:* "draft the memo I'll circulate... I need the strongest version of whichever side you come down against... including the psychiatrist's objection if you're recommending we go ahead." This suggests an internal memo or a decision letter that acknowledges the dissent. I will frame it as a decision notification that addresses the concerns raised during review.

