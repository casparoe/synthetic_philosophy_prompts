answer: |-
  In a municipal housing authority, two standing members, Rowena and Colin, must approve a redevelopment package to break a years-long deadlock. Rowena holds a deontological commitment to procedural justice for current tenants; Colin holds a consequentialist commitment to maximizing aggregate housing units. The package offers a trade: Rowena votes to waive a heritage protection clause (allowing demolition she views as a violation of communal duty), and Colin votes to cap density in a high-demand zone (sacrificing units he views as a net harm to the homeless). Both concessions are positive acts of complicity in outcomes they morally oppose, yet the package yields more procedural respect and more total housing than the status quo. They know each other's normative theories perfectly; their deliberations are public record. Rowena signals willingness to vote for the demolition, but only if Colin's density cap is credible. Colin, reasoning as an act-consequentialist, calculates that once Rowena has voted for demolition, his vote for the cap will no longer maximize units (since the demolition is irreversible), so he intends to defect at the moment of action. Rowena, knowing Colin's flexibility, withholds her vote for demolition. The package collapses. Had Colin possessed a non-maximizing commitment to the agreement itself—treating the promise as binding independent of the immediate outcome—Rowena would have trusted him, and both values would have been realized.

  **Analysis of Verdicts**

  The feature generating the divergent verdicts is the **transparency of the decision procedure combined with the time-inconsistency of maximizing.**

  *   **Integrity-Based Deontology:** On a Williams-style view, Rowena's identity is constituted by her commitments. If she enters the agreement, the duty to keep her word becomes a primary reason for action that is not simply weighed against the moral cost of demolition. She can credibly commit because her theory allows for "exclusionary reasons" that block re-calculation at the point of action. Colin, if he shared this view, could also commit to the density cap as a matter of integrity, even if it locally sub-optimizes housing units. The deal succeeds because the parties can offer guarantees that their future selves will not defect.
  *   **Act-Consequentialism:** Colin's decision procedure requires him to maximize the good *at the point of action*. At the moment of the second vote, the demolition is *fait accompli*; capping density now produces fewer units than allowing it. A transparent act-consequentialist *must* defect. Rowena knows this. The failure is structural: the gains from trade depend on a credibility that act-consequentialism logically cannot supply in transparent, sequential interactions. It is not that the deal produces bad consequences (it produces more housing and more justice); it is that the *criterion* of rightness prevents the agents from securing those consequences.

  **Counterfactuals**

  *   **Removing Transparency:** If Colin could conceal his normative theory, he could lie and promise to vote for the cap. The deal would proceed. This shows the failure is not in the *outcome* of consequentialism, but in its *public avowal*. The gains require the agent to hide their maximizing nature.
  *   **Removing Incommensurability:** If both procedural justice and housing units were reducible to a single metric (e.g., "social welfare points"), the trade would collapse into a routine calculation. Colin would simply vote for whichever option yields more points. There would be no "moral cost" requiring compromise, only a technical allocation problem. The specific gain of *moral compromise*—where each party gets to realize their distinct value by conceding on the other's—disappears.

  **The Consequentialist Objection and Reply**

  The strongest objection is from **Indirect or Rule-Consequentialism**: Colin should cultivate a disposition to keep promises, as having this disposition maximizes utility in the long run. He should therefore vote for the cap, not because it maximizes now, but because it sustains a utility-maximizing rule.

  However, this case survives the objection because of the **public knowledge of the criterion.** Rowena knows Colin is a consequentialist. She knows that his disposition to keep promises is *instrumental*. If, in a future case, breaking the promise yields significantly more utility than keeping it (even accounting for reputation costs), Colin's theory obliges him to discard the disposition. Rowena cannot distinguish between a "dispositional consequentialist" and an "act consequentialist" in a one-off high-stakes vote where reputation costs are outweighed by the immediate utility gain. To secure Rowena's trust, Colin must not merely *act* non-consequentially; he must *be* non-consequentialist. He must treat the promise as binding *even if* breaking it would maximize utility.

  **Conclusion**

  This case suggests that consequentialism must be **self-effacing** to access certain moral gains. To realize the benefits of cooperation in transparent environments with incommensurable values, an agent must not reason as a consequentialist at the point of action. If the theory tells the agent to cultivate a disposition that mimics deontology, but the partner knows the disposition is held only *because* it maximizes, the credibility remains fragile. The gains from moral trade are available only to agents who are, in fact, constrained by reasons other than the maximization of the good.
