      *   *Addressing the "Blanket Rule":* If I adopt a rule to avoid the pump, but it costs me a good trade, am I irrational? This is the "resolute choice" vs. "sophisticated choice" debate. If the rule is *endorsed* (like Case 3), it's rational. If it's a blunt instrument that causes significant loss without preventing the pump (e.g., if the pump is avoidable by simpler means), it might be suboptimal but not necessarily irrational in the moral/normative sense.

