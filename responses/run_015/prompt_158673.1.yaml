answer: |-
  This is a remarkably sharp set of intuitions. You have effectively reconstructed the central debate in dynamic choice theory between the *coherence* camp (who say cyclic preferences are inherently irrational) and the *agency* camp (who say rationality is about self-governance over time).

  Your current principle — *'you're irrational iff there's a pump against you that you couldn't defuse by planning ahead'* — is a version of what Edward McClennen calls 'resolute choice'. It is attractive because it respects our intuition that rationality requires a capacity for control. However, as you have spotted, it frays at the edges.

  Here is an analysis of what your verdicts add up to, a proposal for a repaired principle, and an honest assessment of which verdict must likely be sacrificed.

  ### 1. Diagnosing the Tension

  Your verdicts reveal a conflict between two definitions of rationality:
  *   **Structural Rationality:** Are your preferences logically consistent (transitive) at a single moment? (Cases 1 & 2 fail this).
  *   **Governance Rationality:** Can you manage your choices over time to achieve your ends without self-sabotage? (Cases 3 & 4 succeed or fail based on this).

  **Case 2 is the pivot.** Standard decision theory (e.g., Davidson, Sugden) insists that Case 2 is irrational. Intransitivity is a flaw in the agent's evaluative machinery, regardless of whether a dealer exploits it or whether memory is wiped. By saying Case 2 is *not* irrational ('bad luck plus a nasty dealer'), you are shifting the locus of rationality from the *state of preferences* to the *capacity for agency*. You are effectively saying: 'Irrationality requires culpability.'

  **Case 5 is the wildcard.** Here, you have no intransitive preferences at any instant. You are being pumped due to *framing effects* or *status quo bias*. This shows that money pumps do not require logical cycles; they only require path dependence. If you want to call this 'drained' (bad), you must admit that rationality requires more than just snapshot consistency; it requires invariance to irrelevant context.

  ### 2. A Repaired Principle

  To accommodate your verdicts on Cases 1, 3, 4, and 5, whilst keeping your sympathetic reading of Case 2, we need a principle based on **Endorseable Self-Governance**.

  > **The Principle:** An agent is practically irrational if they suffer foreseeable, net losses due to a failure to adopt a policy of choice that they could cognitively access, implement, and reflectively endorse.

  Let's see how this repairs the issues:
  *   **Case 1 (Cycle, Aware):** You could access a policy (refuse the first swap) and endorse it. You failed. **Irrational.**
  *   **Case 2 (Cycle, Amnesiac):** You could *not* cognitively access a policy to implement later because memory was wiped. You lack the capacity. **Not Irrational** (merely vulnerable).
  *   **Case 3 (Preference Change):** You endorse the policy (sell now, buy back later) as part of a growth plan. The loss is a cost of transformation, not a self-defeating loss. **Rational.**
  *   **Case 4 (Time Inconsistency):** You do not endorse either reversal. You lack a governing policy. **Irrational.**
  *   **Case 5 (Framing):** If you know brochures trigger this, you could adopt a policy ('never switch based on brochures'). If you don't, you are failing to govern a known vulnerability. **Irrational.**

  ### 3. The Blanket 'Never-Swap' Rule

  You asked: *What would the repaired version say about someone who knows they're cyclic and adopts a blanket never-swap rule that costs them one genuinely good trade?*

  This is the problem of **over-binding**.

  Under the principle of Endorseable Self-Governance, this agent is **rationally permitted, though perhaps suboptimal**.
  If an agent knows they are vulnerable to a money pump (Case 1), they are under a rational requirement to bind themselves. If the only binding mechanism available to them is a blunt instrument (a blanket ban), then using it is rational, even if it occasionally forecloses a beneficial trade.

  Think of it as an insurance premium. Paying £20 to avoid losing £60 is rational. Paying £20 to avoid losing £5 is not. If the 'blanket rule' costs them one genuinely good trade (say, worth £10) to save them from a pump (worth £60), it is rational. If the rule costs them £100 in missed opportunities to save £60, the rule itself becomes irrational.

  However, there is a nuance. If the agent *could* have adopted a more nuanced policy (e.g., 'swap only if the gain is >£5') but chose the blanket rule out of laziness, they are irrational for failing to optimise their self-binding. Rationality requires the *best available* governance, not just *any* governance.

  ### 4. The Hard Truth: Which Verdict Must Go?

  You asked for honesty. To make a philosophically robust system, you cannot keep all six verdicts without significant strain. You have to choose between **Coherence** and **Culpability**.

  **Option A: Keep Case 2 (Culpability View)**
  If you maintain that the amnesiac in Case 2 is not irrational, you must accept that rationality is not about the logical structure of preferences, but about the *history* of the agent.
  *   *The Cost:* You must concede that Case 5 is definitely irrational. If you excuse the amnesiac because they 'couldn't help it', you cannot excuse the brochure victim who *could* have stepped back but didn't. You also have to accept that 'rationality' becomes a moralised concept (about blame) rather than a functional one (about efficiency).

  **Option B: Keep Standard Theory (Coherence View)**
  Most decision theorists would urge you to sacrifice **Case 2**.
  *   *The Argument:* The amnesiac *is* irrational, simply not *culpable*. Their preferences are objectively defective. The fact that they cannot fix it doesn't make the preferences coherent; it just makes the exploitation tragic rather than blameworthy.
  *   *The Benefit:* This unifies Cases 1, 2, 5, and 6. In all these cases, there is a structural flaw (intransitivity, framing dependence, or voting cycles) that leads to dominated outcomes. Case 3 remains the exception because it involves *preference change*, not *preference conflict*.

  **My Recommendation:**
  If you want a principle that guides action, **sacrifice the intuition in Case 2**.
  Call the amnesiac 'structurally irrational' but 'excused'. This allows you to keep the definition of rationality tied to coherence (which explains why the pump works) whilst keeping your moral sympathy for the agent (who couldn't plan).

  If you refuse to do this, your principle becomes purely about *capacity*. The danger there is that it becomes too permissive. A agent who simply *doesn't think* to plan ahead (but could have) might claim they 'couldn't defuse it' in the moment. You need a standard that says: 'You should have planned,' not just 'You should have planned if you remembered.'

  ### Summary

  Your verdicts add up to a **Capacity-Based Governance Theory**. You view rationality not as a static property of preferences, but as a dynamic skill of self-management.

  *   **Repaired Principle:** Rationality is the successful implementation of an endorseable policy that prevents foreseeable self-defeating losses, within the limits of one's cognitive capacity.
  *   **On the Blanket Rule:** It is rational if it is the most effective binding available; irrational if it is needlessly costly compared to a finer-grained policy.
  *   **The Sacrifice:** To tighten the theory, you should concede that the agent in **Case 2** is structurally irrational, even if they are not blameworthy. Keeping them as 'fully rational' forces you to define rationality so loosely that it loses its bite in Cases 1 and 5.

  In British terms: you can't have your cake, eat it, and claim you weren't hungry just because you forgot you bought it. The hunger (intransitivity) is the problem, even if the forgetting (amnesia) explains why you ate it.
