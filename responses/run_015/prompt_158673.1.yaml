      *   **Refining the Principle:** Let's try: *An agent is practically irrational if they possess a decision-making disposition that foreseeably leads to net losses which they could have avoided by adopting a coherent policy, assuming they have the cognitive capacity to recognise and implement that policy.*
      *   **Applying to Case 2:** They lack capacity (memory). So not irrational. (Fits user).
