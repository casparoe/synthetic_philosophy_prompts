  **OFFICE OF INSTITUTIONAL PLURALISM**
  **GUIDANCE MEMO 24-09**
  **SUBJECT:** Implementation of Senate Policy NOC-3 (Non-Absolutism in Official Communications)

  **1.0 PURPOSE AND SCOPE**
  Pursuant to Faculty Senate Policy NOC-3, all official assertions must avoid *ekānta* (one-sided dogmatism). Communications must employ *syāt* (standpoint-indexed qualification) and acknowledge *naya* (partial perspectives). This guidance operationalizes metaphysical complexity for institutional liability management. Users are advised that while classical formulations treat these modes as paths to ontological precision, this Office treats them as compliance metrics. Note: This policy reflects a contemporary administrative revision of classical epistemic norms drafted with external consultants; users should not conflate regulatory compliance with soteriological liberation. The goal is not truth, but defensibility. All staff must recognize that having a standpoint is not error; treating one standpoint as the whole is error. Therefore, every email signature must include a standpoint disclaimer.

  **2.0 ASSERTION PROTOCOLS**
  Absolute predicates (e.g., "is," "is not") are prohibited in letters of recommendation, search-committee reports, program-review self-studies, and climate-survey summaries. All claims must traverse the seven modes of predication (*saptabhaṅgī*) where applicable. The seventh mode (inexpressibility) is mandatory when linguistic constraints prevent simultaneous standpoint aggregation. This ensures the University never lies, but also never answers definitively.

  **3.0 WORKED EXAMPLES**

  **3.1 Letter of Recommendation (Candidate: J. Doe)**
  *Non-Compliant:* "Doe is an excellent scholar." (Violates NOC-3 by asserting excellence absolutely.)
  *Compliant:* "From the standpoint of pedagogical output (1), Doe is excellent. From the standpoint of grant acquisition (2), Doe is not excellent. From the standpoint of successive evaluation (3), Doe is both excellent and not excellent. From the standpoint of simultaneous attributes (4), Doe is excellent and not excellent. From the standpoint of linguistic limitation (5), Doe's excellence is inexpressible. From the standpoint of silence (6-7), no assertion is made."
  *Administrative Note:* Do not use "maybe" as a substitute for *syāt*. *Syāt* indicates a specific viewpoint, not epistemic uncertainty. However, for external readers unfamiliar with Jain epistemology, "maybe" may be substituted if standpoint specification exceeds character limits, provided Legal approves the increased ambiguity risk. This protects the writer from claims of misrepresentation should the candidate fail to manifest excellence in a standpoint not covered in the letter.

  **3.2 Search Committee Ranking**
  Committees cannot rank candidates absolutely, as ranking implies one candidate is superior *simpliciter*, violating NOC-3.
  *Protocol:* Issue a matrix. Candidate A is superior to B from the *naya* of research. Candidate B is superior to A from the *naya* of service. If research and service are weighted equally, the candidates are simultaneously superior and inferior. If the weighting criteria are themselves inexpressible, no hire is recommended.
  *Remedy:* To proceed, Committees must declare the weighting criteria as merely another *naya*, not an absolute standard. This typically results in stalemate, as the criteria for selecting the *naya* require their own *naya*. In cases of infinite regress, the position remains open indefinitely to preserve pluralism. This protects the institution from lawsuits by unsuccessful candidates who could claim their specific *naya* was ignored.

  **3.3 External Audit Queries**
  Auditors often demand binary responses (Yes/No). These are structurally one-sided.
  *Query:* "Is the FY24 budget balanced?"
  *Non-Compliant:* "Yes." (Exposes institution to liability if budget is unbalanced in some respect.)
  *Compliant:* "In some respect, yes. In some respect, no. In some respect, both. In some respect, inexpressible."
  *Risk:* Auditors may interpret "inexpressible" as "unverified." Finance should append a disclaimer stating that the budget's balanced status is real but not exhaustively describable in language. If the auditor rejects this, cite Policy NOC-3. If the auditor insists on binary, refer to Legal. If Legal insists on binary, the University exists in a state of normative contradiction.

  **4.0 COMPLIANCE AND SELF-REFERENCE**
  All staff must certify adherence to this guidance by signing below.
  *Certification Statement:* "I certify that the above guidance is universally applicable and binding on all official communications."
  *Warning:* Signing this statement asserts the guidance itself is non-one-sided. However, if the guidance is only relatively true (*syāt*), it cannot be universally binding. If it is universally binding, it violates NOC-3 by asserting an absolute truth about communication.
  *Resolution:* Signers must initial that they understand this certification is valid only from the standpoint of the Office of Institutional Pluralism, while acknowledging that from the standpoint of the Faculty Senate, the Office's authority may be inexpressible. If the Senate claims absolute authority, this guidance is void. If the Senate claims relative authority, this guidance is optional. Please return signed forms to the Office. If the Office no longer exists due to budgetary inexpressibility, shred forms.

  **5.0 EFFECTIVE DATE**
  Immediately, pending clarification on whether "Immediately" constitutes an absolute temporal claim. Until clarified, effective date is conditionally now.
