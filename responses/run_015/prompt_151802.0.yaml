answer: |-
  ### Brainstorming & Conceptual Prep

  Before drafting the formal proposal, I need to sharpen the distinction you're drawing. The standard cluelessness objection (often associated with Lenman or Greco) argues that because causal chains are infinite and complex, we cannot calculate the net value of an action. Your friend's probabilistic counter is standard decision theory: assign credences to outcomes and maximize expected value.

  Your insight is that "ignorance" isn't uniform.
  1.  **Causal Opacity:** This is empirical uncertainty. Even with perfect values, we don't know the mapping from $Action \rightarrow State of World$. Probabilities *can* help here, but only if the variance isn't infinite or the model isn't missing key variables.
  2.  **Axiological Drift:** This is normative uncertainty over time. Even if we know the $State of World$, we don't know if our current value function $V_t$ applies to $V_{t+n}$. This isn't solved by probabilities; it's a problem of value stability.

  **The "Local Search" Hypothesis:**
  If we shift from global optimization (all future consequences) to local optimization (immediate/near-term feedback), we reduce Causal Opacity (shorter chains are clearer). However, this might increase vulnerability to Axiological Drift. By optimizing for *current* values in the *near* term, we might lock in a trajectory that prevents future value evolution or fails to account for future moral progress.

  **Why this isn't just relabeling:**
  Widening confidence intervals treats all ignorance as risk. But risk implies a known distribution. Causal opacity might be "unknown unknowns" (Knightian uncertainty), and Axiological Drift is "value instability." Distinguishing them matters because the remedies differ: better modeling fixes opacity; flexible value frameworks fix drift. If we conflate them, we apply the wrong fix.

  **Scope Check:**
  This is purely conceptual. No empirical data needed. The "method" is philosophical analysis, thought experimentation, and model-building. Four months is tight but doable for a typology and a verdict on local search.

  ***

  ### Research Proposal

  **Project Title:** Decomposing Cluelessness: Causal Opacity, Axiological Drift, and the Limits of Local Search in Consequentialism

  **1. Statement of the Research Question**
  Consequentialist ethics faces the "cluelessness" objection: agents cannot know the long-term consequences of their actions, rendering the theory action-guidingly useless. Standard responses suggest using probabilistic expected value calculations to manage this uncertainty. This project challenges the monolithic treatment of ignorance in this debate. I propose decomposing cluelessness into two distinct categories: **Causal Opacity** (epistemic limits on mapping actions to distant states of affairs) and **Axiological Drift** (normative limits on applying current value functions to distant future states).

  The primary research question is: *Does a "local search" reformulation of consequentialism—optimizing over short feedback loops rather than global outcomes—successfully mitigate Causal Opacity while remaining vulnerable to Axiological Drift?*

  Secondary questions include:
  *   Is the standard probabilistic response adequate for Causal Opacity, or does it collapse under Knightian uncertainty?
  *   Does optimizing for proximate goods inadvertently lock in current values, exacerbating the risks of Axiological Drift?
  *   Does distinguishing these sources of ignorance offer a viable path for consequentialist viability that widening confidence intervals does not?

  **2. Motivation and Existing Gaps**
  The existing literature treats cluelessness primarily as an epistemic problem regarding causal chains. The standard counter-argument is that agents need not know outcomes with certainty, only assign probabilities. However, this response assumes that the value of outcomes is stable and knowable. It treats all ignorance as reducible to risk distributions.

  This approach leaves two gaps. First, it fails to distinguish between not knowing *what* will happen (Causal Opacity) and not knowing *how to value* what happens (Axiological Drift). Second, it assumes that shortening the causal horizon (local search) solves the problem broadly. While local search clearly reduces causal complexity, it may intensify normative myopia. If future populations hold divergent values, a strategy optimized for current local values might prevent the conditions necessary for those future values to emerge. By conflating these issues, current debates propose solutions (like widening confidence intervals) that address empirical variance but fail to address normative instability. This project argues that these are structurally different problems requiring distinct theoretical remedies.

  **3. Methodology and Work Plan (4 Months)**
  This is a solo conceptual project involving philosophical analysis, logical modeling, and thought experimentation. No empirical data collection is required.

  *   **Month 1: Conceptual Decomposition.**
      *   Define Causal Opacity and Axiological Drift precisely.
      *   Demonstrate why standard probabilistic models handle the former better than the latter.
      *   Establish criteria for when ignorance is "structural" (unresolvable by more data) versus "contingent."
      *   *Deliverable:* A draft section defining the typology of ignorance.

  *   **Month 2: Analyzing Local Search.**
      *   Formulate the "Local Search" consequentialist model (optimizing over immediate/near-term feedback loops).
      *   Test this model against Causal Opacity. Does shortening the causal chain sufficiently reduce uncertainty to make action-guidance possible?
      *   *Deliverable:* A logical analysis of the trade-off between causal clarity and scope of impact.

  *   **Month 3: Testing Against Axiological Drift.**
      *   Apply the Local Search model to scenarios involving value change (e.g., moral progress, population ethics shifts).
      *   Investigate whether optimizing for current local values creates "value lock-in" that harms future axiological interests.
      *   Compare this to the "widening confidence intervals" approach to show why the latter fails to capture this risk.
      *   *Deliverable:* A critical assessment of local search viability.

  *   **Month 4: Synthesis and Implications.**
      *   Integrate findings to answer the primary research question.
      *   Determine if consequentialism can survive this decomposed critique or requires modification (e.g., value pluralism, meta-ethical flexibility).
      *   Finalize the paper for submission.
      *   *Deliverable:* Complete draft of the research paper.

  **4. Expected Results**
  A successful project will produce a paper arguing that:
  1.  Cluelessness is not a single problem but two distinct structural issues.
  2.  Local search consequentialism successfully mitigates Causal Opacity (making action guidance possible in the short term).
  3.  However, Local Search fails to resolve Axiological Drift and may exacerbate it by prioritizing current value structures over future normative evolution.
  4.  Therefore, widening confidence intervals is insufficient because it treats normative instability as empirical variance.

  The result will be a refined consequentialist framework that acknowledges where probabilistic tools work (causal uncertainty) and where they fail (value instability), offering a more nuanced defense against the cluelessness objection.

  **5. Criteria for Failure**
  Given the conceptual nature of this project, failure is defined as follows:
  *   **Collapse of Distinction:** If analysis shows that Axiological Drift can be fully reduced to Causal Opacity (e.g., if valuing future outcomes is just another causal variable), the core hypothesis fails.
  *   **Triviality:** If the distinction yields no practical difference for decision theory (i.e., the remedy for both remains identical), the project lacks significance.
  *   **Scope Creep:** If the project attempts to solve the content of future values rather than analyzing the structural problem of drift, it becomes unmanageable within four months.
  *   **Inconclusiveness:** If the analysis shows that Local Search fails both tests equally, the project still succeeds in negative results, but fails if it cannot articulate *why* distinct from standard cluelessness arguments.

  **6. Feasibility**
  This project requires only standard philosophical tools and access to existing literature (which the applicant will cite independently). It does not require library access for rare texts, empirical funding, or collaboration. The four-month timeline is realistic for a focused conceptual analysis of this scope.
