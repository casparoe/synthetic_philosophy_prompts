answer: |-
  ### Choosing the Shape

  I considered three structures for this procedure. The first was a **Categorical Flowchart**, sorting every subject into "State Combatant," "Non-State Actor," or "Civilian" before assigning language. I rejected this because modern conflicts dissolve these categories (contractors, militias integrated into armies), and forcing a legal determination at the copy desk invites error and delay. The second was a **Justification Hierarchy**, requiring editors to verify the *jus ad bellum* (justice of war) before assigning liability. I rejected this because it violates your core constraint: the desk cannot adjudicate the justice of the cause without becoming a party to the conflict.

  I have chosen a **Linguistic Effect Procedure**. It ignores the metaphysical status of the fighter and focuses entirely on the semantic load of the words we print. It operationalizes your five distinctions by enforcing Distinction 1 (Legal Status) only where settled law exists, suspending judgment on Distinctions 2, 3, and 4 (Permission, Liability, Blame), and rigorously enforcing Distinction 5 (Commemoration). This fits the copy desk's actual leverage: we control the adjectives, not the battlefield.

  ***

  ### 1. The Decision Procedure

  **Step 1: Establish Functional Status (Distinction 1)**
  *   **Question:** Is there a settled legal status under the Law of Armed Conflict (LOAC) for this person?
  *   **Sufficient Answer:** Yes (e.g., uniformed soldier, confirmed civilian, prisoner of war). No (e.g., militia member, contractor, irregular).
  *   **Stop Condition:** If "Yes," use the legal term (Soldier, Civilian). If "No," proceed to Step 2.
  *   **Default:** If unknown after 2 minutes, describe their function (e.g., "armed man," "driver").
  *   *Cost:* We lose the moral clarity of "innocent civilian" vs. "legitimate target" in gray zones, but avoid legal errors.

  **Step 2: Describe Action, Not Permission (Distinctions 2 & 3)**
  *   **Question:** Does this word imply the person had a *right* to fight or was *liable* to be killed?
  *   **Sufficient Answer:** The text describes what they did, not whether they should have done it.
  *   **Stop Condition:** If the text implies moral liability (e.g., "eliminated," "neutralized" implies they were a threat that needed removing; "murdered" implies they had no right to be there), strip the implication.
  *   **Default:** Use "killed," "died," or "captured."
  *   *Cost:* We cannot signal that one side is fighting an illegal war through our verbs.

  **Step 3: Suspend Blame (Distinction 4)**
  *   **Question:** Does this language assign moral fault or excuse for fighting?
  *   **Sufficient Answer:** The text reports the death without judging the character of the dead.
  *   **Stop Condition:** If the text relies on blame (e.g., "fanatic," "conscript forced to fight," "hero"), remove the judgment unless verified by direct evidence (e.g., a court finding, a signed confession).
  *   **Default:** Assume mixed motivation. Use neutral nouns ("fighter," "member").
  *   *Cost:* We cannot exonerate the coerced or condemn the zealot based on our own assessment.

  **Step 4: Enforce Equal Commemoration (Distinction 5)**
  *   **Question:** If this person were on the other side, would we mark their death as a human loss in the same way?
  *   **Sufficient Answer:** The text acknowledges the death as a loss of life regardless of side.
  *   **Stop Condition:** If we name our side's dead but count the other side's as statistics (or vice versa), align the treatment.
  *   **Default:** If one side is named, name the other if known. If one side is "fallen," the other is "dead," not "neutralized."
  *   *Cost:* We may humanize aggressors, but we maintain the agency's claim to universal humanism.

  **Step 5: The Modified Swap Test**
  *   **Question:** If I swap the sides in this sentence, does the *emotional temperature* change?
  *   **Sufficient Answer:** The sentence feels the same emotionally, even if the facts differ.
  *   **Stop Condition:** If swapping sides makes the sentence sound like propaganda for the other side, rewrite.
  *   **Default:** If the test fails, strip emotive adjectives until it passes.
  *   *Cost:* We may flatten genuine moral differences in conduct, but we eliminate bias in tone.

  **Step 6: Escalation**
  *   **Question:** Does applying Steps 1–5 require a political or legal judgment I am not authorized to make?
  *   **Sufficient Answer:** No.
  *   **Stop Condition:** If Yes, flag for Standards Desk.
  *   **Default:** Publish the most factual, least emotive version available.

  ***

  ### 2. Ruling on the Swap Test

  **Verdict:** Keep, but restrict to *emotive load*, not *factual equivalence*.

  **Reasoning:** Your current test fails because it conflates moral symmetry with factual symmetry. If Side A bombs a hospital and Side B bombs a barracks, swapping them ("Side B bombed a hospital") creates a falsehood, not a bias check. The test should only apply to the *language of loss*.
  *   **Case where it works:** "Our brave boys fell" vs. "Enemy troops were killed." Swap: "Enemy brave boys fell" (sounds wrong) vs. "Our troops were killed" (sounds cold). *Fix:* "Soldiers on both sides were killed."
  *   **Case where it misleads:** "Terrorist killed in raid" vs. "Soldier killed in raid." Swap: "Soldier killed in raid" (applied to terrorist) implies state legitimacy they may not have. *Fix:* Do not swap the status noun if the legal status differs; swap the *verb* and *modifier*. "Militant killed" vs. "Soldier killed" is acceptable if status differs; "Eliminated" vs. "Died" is not.

  ***

  ### 3. Worked Applications

  **Case 1: Overnight strike on barracks (Conscripts, invading army)**
  *   **Procedure Run:**
      *   Step 1: Status = Soldiers (Uniformed, barracks).
      *   Step 2: Action = Killed in strike. (Avoid "neutralized").
      *   Step 3: Blame = Suspended. (Avoid "invaders" or "victims").
      *   Step 4: Commemoration = Acknowledge death.
      *   Step 5: Swap = "Conscripts killed in barracks" works for both sides.
  *   **Wording:** "An overnight strike on the barracks killed at least 20 soldiers. Local officials said many of the dead were conscripts asleep in their bunks."
  *   **Style Check:** Matches current style.

  **Case 2: Pickup truck strike (Commander + 2 passengers)**
  *   **Procedure Run:**
      *   Step 1: Status = Non-state actor (Commander). Passengers = Unknown.
      *   Step 2: Action = Killed. (Avoid "terrorist" unless designated by UN/Client consensus, which varies).
      *   Step 3: Blame = Suspended. (Avoid "planner of atrocities" unless indicted).
      *   Step 4: Commemoration = Count all dead.
      *   Step 5: Swap = "Commander killed" vs. "General killed."
  *   **Wording:** "A strike on a vehicle killed a local commander of the armed group and two passengers. The group uses the vehicle to direct operations in the region."
  *   **Style Check:** Matches current style.

  **Case 3: Memorial for own country's soldier (Offensive based on wrong intel)**
  *   **Procedure Run:**
      *   Step 1: Status = Soldier.
      *   Step 2: Action = Killed.
      *   Step 3: Blame = Suspended. (Current style often uses "sacrificed" or "gave life" for own, implying moral worth).
      *   Step 4: Commemoration = **ENFORCE.** If we call enemy dead "casualties," we cannot call our dead "heroes" without triggering Step 5.
      *   Step 5: Swap = "Hero killed in offensive based on wrong intel" (applied to enemy commander). Sounds sarcastic. Therefore, remove "Hero."
  *   **Wording:** "A memorial was held for the soldier, killed during an offensive launched on the basis of intelligence that was later shown to be wrong."
  *   **Style Break:** **This violates current house style.** Most agencies allow "served with honor" or "fallen" for domestic forces even in controversial wars. The procedure forces this because Step 4 (Equal Commemoration) and Step 5 (Swap Test) forbid reserving dignified language for one side's dead while using clinical language for the other's. If we call the enemy commander's death a "loss of life," we must call our soldier's death a "loss of life," not a "sacrifice." "Sacrifice" implies moral justification (Distinction 2) which we are suspending.

  ***

  ### 4. Verdicts on Hard Cases

  1.  **Child soldier carrying a rifle:**
      *   *Verdict:* Describe function ("armed child"). Do not use "combatant" (legal ambiguity) or "victim" (moral judgment).
      *   *Distinction:* Enforces 1 (Status unclear), Suspends 3 (Liability).
  2.  **Unit medic who is armed:**
      *   *Verdict:* "Medic." Mention armament only if used. LOAC protects medics unless they commit hostile acts.
      *   *Distinction:* Enforces 1 (LOAC status).
  3.  **Contractor driving supply truck for fee:**
      *   *Verdict:* "Contractor." Do not use "soldier" or "civilian" without qualification.
      *   *Distinction:* Enforces 1 (Functional description).
  4.  **Analyst picking targets from a screen:**
      *   *Verdict:* "Member of armed forces" or "Operator." Avoid "remote killer."
      *   *Distinction:* Suspends 4 (Blame/Distance).
  5.  **Fighter who surrendered and was then killed:**
      *   *Verdict:* "Surrendered fighter killed." This is a LOAC violation (Distinction 1: *Hors de combat*).
      *   *Distinction:* Enforces 1 (Legal status change).
  6.  **Casualty line: Group designated terrorist by Client A, liberation by Client B:**
      *   *Verdict:* Use the group's self-designation or a functional name ("The Group"). Do not use "Terrorist" or "Freedom Fighter."
      *   *Distinction:* Suspends 2 & 4 (Permission/Blame).
  7.  **Villagers who took up weapons for a single afternoon:**
      *   *Verdict:* "Villagers." Note they were armed. Do not classify as "militia" unless organized.
      *   *Distinction:* Enforces 1 (Civilian unless continuous combat function).
  8.  **Stall Point:** The "Contractor" and "Analyst" cases. The procedure stalls on whether their function constitutes "direct participation in hostilities." This requires legal counsel, not copy desk judgment. *Action:* Default to "Contractor/Analyst" and describe the act.

  ***

  ### 5. Marked Escalation Points

  These are steps where the editor is tempted to make a value judgment disguised as a fact. These must come to you (Standards Desk).

  *   **Step 1 (Status) in Hybrid Wars:** When a group is half-political party, half-army. Deciding whether to call them "fighters" or "activists" is a political determination. *Ask me:* "Does calling them 'fighters' legitimize a political group our clients ban?"
  *   **Step 3 (Blame) in Atrocity Cases:** When evidence suggests one side is systematically executing prisoners. Describing this as "killed" (neutral) vs. "executed" (judgment) changes the moral record. *Ask me:* "Do we have enough evidence to upgrade 'killed' to 'executed' without a court verdict?"
  *   **Step 4 (Commemoration) in Genocidal Contexts:** When one side is fighting to exist and the other to erase. Treating the losses as "equal" (Distinction 5) may be factually true but morally misleading. *Ask me:* "Does equalizing the language obscure the intent of the conflict?"

  ***

  ### 6. Where the Procedure Will Misfire

  *   **Aggression Wars:** In cases of clear, unprovoked invasion (e.g., annexation), this procedure prevents us from linguistically marking the aggressor's combatants as having less moral standing than the defender's. We will write "soldiers killed" for both. This costs us the ability to signal international legal consensus through language.
  *   **Asymmetric Atrocity:** If Side A targets civilians systematically and Side B targets combatants, Step 5 (Swap Test) might force us to sanitize Side A's language to match Side B's, or degrade Side B's to match Side A's. We risk "bothsidesism" in the face of documented war crimes.
  *   **Information Cost:** We will lose the ability to use language as a shorthand for complex legal realities. We cannot say "illegal combatant" even if we know it to be true, because that adjudicates Distinction 2. We must write "fighter not in uniform." This increases word count and reduces precision for the reader.

  ***

  ### 7. What Would Change My Mind

  **The Argument:** The "Epistemic Access" Argument.
  My procedure relies on suspending Distinction 4 (Blame) because soldiers often don't know the full justice of their cause. If evidence shows that modern combatants have open access to independent documentation proving their side is committing aggression or atrocities *before* they enlist, the excuse of ignorance collapses. If a soldier *knows* they are fighting an unjust war and fights anyway, they are not morally equal to a defender.

  **The Step:** Step 3 (Suspend Blame).
  If I became convinced that the average combatant in these conflicts has sufficient knowledge to be held morally responsible for the *jus ad bellum*, I would rewrite Step 3 to allow language that reflects that liability (e.g., allowing "aggressor forces" where verified).

  **Least Confident Reasoning:**
  I am least confident in **Step 4 (Equal Commemoration)**. Enforcing symmetry in grief (Distinction 5) assumes that death is the primary moral unit of war. In some conflicts, the *outcome* matters more than the *casualties*. By forcing us to mourn the aggressor equally with the defender, we may inadvertently suggest the war itself is a tragedy of equal losses, rather than a crime with victims. I accept this cost to maintain agency neutrality, but it is the weakest philosophical link in the chain.
