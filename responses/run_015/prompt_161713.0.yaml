  | **Cycle Length** | Whether periodicity is universal or polity-specific. | Cycle length is a constant imposed across polities; Falsified if fit requires polity-specific periods; Prediction: Universal period fits best with minimal error. | Cycle length is a parameter estimated separately for each polity; Falsified if universal period fits better than specific; Prediction: Polity-specific fits reduce error significantly. | Genuine |
  | **Elite Overproduction** | Whether the ratio is exogenous or endogenous to politics. | The ratio drives instability exogenously; Falsified if elite slots expand without instability; Prediction: Correlation between ratio and instability > 0.6. | Elite positions expand to absorb aspirants as a political outcome; Falsified if fixed slot limits trigger instability; Prediction: Correlation between ratio and instability < 0.3. | Genuine |
  | **Index Drift** | Whether indicators retain meaning across administrative changes. | Indicators mean the same thing before and after record-keeping changes; Falsified if indicator breaks at administrative shifts; Prediction: Stability across shifts within confidence bounds. | Meaning drifts with record-keeping changes; Falsified if indicator holds across shifts; Prediction: Structural break at shifts detected statistically. | Verbal. Stipulation: Define index by administrative unit, not raw count. |
  | **Meaning of "Predicted"** | Whether output is probability or point forecast. | An elevated probability over a baseline; Falsified if probability does not rise prior to event; Prediction: Probability > 0.7 in window. | A point forecast of a dated event of a given type; Falsified if date misses window; Prediction: Date within 5 years of event. | Verbal. Stipulation: Use Brier score for probability, +/- 5 years for date. |

  3. The Amber Window protocol

  **Test 1: Out-of-Sample Polity Test**
  Data will comprise fiscal and elite metrics from Region A (training) and Region B (testing), separated by geography and era. The statistic is the Area Under the Curve (AUC) for instability classification. A hit requires an AUC significantly greater than 0.5. The Cyclist predicts an AUC of 0.75, asserting structural universality. The Documentarian predicts an AUC of 0.55, asserting contextual drift prevents transfer. Failure for the Cyclist is an AUC below 0.60; failure for the Documentarian is an AUC above 0.70.

  **Test 2: Matched-Control Test**
  Data will identify cases where structural indicators exceed instability thresholds but no breakdown follows within the expected window. The statistic is the False Positive Rate (FPR). A hit for the Cyclist requires an FPR below 0.20, indicating tight coupling. A hit for the Documentarian requires an FPR above 0.40, indicating indicators are noisy proxies. The Cyclist predicts an FPR of 0.15. The Documentarian predicts an FPR of 0.45. If the FPR exceeds 0.30, the Cyclist concedes the model lacks specificity; if below 0.25, the Documentarian concedes indicators capture signal.

  **Test 3: Threshold Committed Twenty Years Ahead**
  Data will be current structural indicators for a live polity. The rule commits to a probability threshold now for an event twenty years hence. A hit is the event occurring if the probability exceeds the threshold. The Cyclist commits to a threshold of 0.60, predicting the event will occur if exceeded. The Documentarian commits to a threshold of 0.90, predicting the model cannot distinguish signal from noise at lower levels. If the event occurs below 0.60, the Cyclist concedes false negatives dominate. If the event fails to occur above 0.90, the Documentarian concedes the model has predictive power.

  4. Residual disagreement

  If all three tests favor the Cyclist, they will still withhold that the model explains *why* mechanisms vary, maintaining that quantification finds recurrence but not cause. If all tests favor the Documentarian, they will still withhold that patterns are purely random, conceding only that forecasting is currently impossible. If all tests go against the Cyclist, they will concede the model is narrative fitting disguised as science, abandoning the claim of universal periodicity. If all tests go against the Documentarian, they will concede that structural forecasting is possible, though they will maintain that the archives remain silent on the specific human mechanisms driving the predicted transitions. Neither side will concede the ontological priority of the other's framework, only the empirical utility of the tools.
