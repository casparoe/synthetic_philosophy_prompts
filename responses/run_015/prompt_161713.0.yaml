answer: |-
  1. Agreed claims

  1. Political instability constitutes a distinct class of historical events that can be identified across different polities using consistent criteria, regardless of the specific ideological content driving the unrest or the particular individuals involved in the leadership changes.
  2. Both parties acknowledge that surviving archival records are unevenly distributed across time and space, introducing unavoidable selection bias into any quantitative analysis that attempts to generalize across centuries without correcting for archival silence or survival bias.
  3. Indicators of fiscal strain and elite competition correlate with periods of central authority breakdown in many documented instances, though the causal direction of this relationship remains contested between the parties regarding whether structure drives agency or vice versa.
  4. No mathematical model can account for every contingency of human agency or the specific ideological content of political movements, yet both agree that aggregate patterns may emerge despite individual unpredictability if the underlying dynamics are structural and recurrent.
  5. Forecasting requires defining a specific time window and an event type before the observation period begins, ensuring that the target of prediction is not shifted to match observed outcomes after the fact to ensure temporal integrity.
  6. Retrospective fitting of parameters to known outcomes differs fundamentally from prospective prediction of unknown outcomes, and only the latter provides valid evidence for the utility of a structural model rather than a narrative reconstruction of known history.
  7. Structural indicators may lose semantic meaning when administrative practices or record-keeping technologies change significantly, requiring careful validation of index consistency across historical epochs to ensure comparability of units.
  8. Both sides agree that a high rate of false positives would undermine the practical utility of any proposed forecasting model by generating alarm without corresponding instability, wasting resources on non-events and eroding trust.
  9. Both sides agree that a high rate of false negatives would similarly undermine the practical utility of any proposed forecasting model by failing to signal impending breakdowns, rendering the model useless for prevention or preparation.
  10. The collaboration aims to test predictive power on unseen data, not merely to maximize explanatory elegance on fitted data where overfitting cannot be ruled out by standard significance tests alone.
  11. Data selection criteria and cleaning protocols must be fixed and documented before any testing begins to prevent tuning the model to the specific noise of the test set rather than the signal of the underlying process.
  12. Success is defined by performance on unseen data, not by the statistical significance of coefficients derived from historical training sets that include the test events themselves in the training phase.

