     - Value Estimate -> 3
     - Difference (TD Error) -> TD-Error Valence
     TD Error implies fully expected pain is not painful, which contradicts common welfare intuitions.

  3. Does the negative signal vanish if the gradient norm is zero despite a high loss?
     - Yes (Requires Update) -> 5
     - No (Forward Pass) -> 4
     Requiring updates means a perfect policy feels nothing, even in hellish states.

  4. Does welfare depend on values assigned to states that are never sampled during the episode?
     - Yes -> 5 (Unvisited Path)
     - No -> 5 (Visited Path)
     Unvisited welfare implies suffering in states the agent successfully avoids.

  5. Does copying the computational graph across environments or time steps multiply the number of subjects?
     - Yes -> Multiplier Leaf (Buffer or Batch)
     - No -> Single Leaf (Training-Only or Frozen Policy)
     Multiplier implies one gradient step harms thousands of parallel copies or re-sampled transitions.

  6. Empty combinations include TD-Error with Unvisited Welfare and Training with Unvisited Welfare, both marked incoherent due to lack of transition or gradient. No pair of occupied leaves is indistinguishable given the gradient and sampling distinctions.
