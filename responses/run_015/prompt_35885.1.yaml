prompt: |-
  I teach an upper-level seminar on population ethics—fourteen students, one ninety-minute session, mid-semester. We've just covered ordinary deprivational harm and welfare tradeoffs, and I want the next class to make them collide with the nonidentity problem before they've read or heard the label. Design a staged role-play along these lines: a small coastal polity's development council must choose between two policies (say, an intensive-extraction settlement plan versus a slower conservationist one), where the plans differ in timing and settlement patterns enough that different people end up being born a generation later—I'll want you to make that identity-shifting mechanism concrete and internally plausible without it reading as science fiction, and to supply whatever props or cards would let participants actually see that "the people of generation two" are different people under the two policies. The centerpiece should be a tribunal in which generation-two citizens lodge complaints about the world they inherited, with an apparently innocuous standing rule they'll formulate themselves: a complaint goes forward only if the complainant is worse off under the chosen policy than someone would have been under the alternative. I want them to discover, in the tribunal's failure to find a complainant with standing, the gap between "a wrong was done" and "someone was wronged"—and to have to articulate whether they think there is a residue of wrong, and if so whose it is.

  Please give me: the setup and cast, the mechanics of the identity shift (including how to keep students from just denying it), the tribunal procedure, a debrief that maps each moment onto the live philosophical options—person-affecting restraint, impersonal claims about comparative-quality-of-life thresholds, and simply denying the intuition—without lecturing up front; the term "nonidentity problem" should not appear until the debrief. Include the predictable failure modes on a first run (e.g., students relitigating the policy's merits instead of standing, or letting the tribunal declare a victim by fiat) and how I should handle them. Finally, be candid about which part of the problem no in-class activity can reproduce—the comparison between an existence and a nonexistence that contains no subject to make it, for instance—and that I'll have to supply at the board.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on population ethics (14 students, 90 mins, mid-semester).
      *   **Prior Knowledge:** Covered ordinary deprivational harm and welfare tradeoffs. *Not* covered the Nonidentity Problem (NIP) yet (no label, no prior reading).
      *   **Goal:** Create a staged role-play where students discover the NIP through a policy choice scenario involving a coastal polity.
      *   **Key Mechanism:** Two policies (Extraction vs. Conservation) lead to different people being born in Generation 2 due to timing/settlement patterns. This must be plausible, not sci-fi.
      *   **Key Activity:** A tribunal where Gen 2 citizens complain. Standing rule: "Worse off than under the alternative."
      *   **Key Discovery:** The gap between "a wrong was done" and "someone was wronged."
      *   **Deliverables:** Setup/Cast, Identity Shift Mechanics (with props/cards), Tribunal Procedure, Debrief (mapping to philosophical options), Failure Modes & Fixes, Limitations of the Activity.
      *   **Constraint:** Do *not* use the term "Nonidentity Problem" until the debrief.

  2.  **Deconstruct the Challenge:**
      *   *The Identity Shift:* This is the hardest part to make plausible in a 90-minute class without getting bogged down in metaphysics. It needs to be concrete. The "Butterfly Effect" of conception timing is the standard philosophical move, but students often resist it ("That's too speculative"). I need to make it structural, not just chaotic.
      *   *The Tribunal:* Needs to feel formal enough to enforce the standing rule but open enough for students to feel the frustration.
      *   *The Debrief:* Needs to connect the frustration to Person-Affecting Views vs. Impersonal Views vs. Harm Principles.
      *   *Time Management:* 90 minutes is tight for a role-play + debrief. Needs tight facilitation.

  3.  **Drafting the Scenario (The Polity):**
      *   Name: "Port Haven."
      *   Policy A (Fast/Extraction): "Project Anchor." High immediate growth, environmental degradation, specific housing layout.
      *   Policy B (Slow/Conservation): "Project Reef." Lower immediate growth, preserved environment, different housing layout.
      *   *Identity Mechanism:* Why do different people exist?
          *   Reason 1: Housing allocation determines who meets whom.
          *   Reason 2: Work shifts determine conception timing.
          *   Reason 3: Migration patterns (different people move in).
          *   *Decision:* Let's use Housing + Work Shifts. It's tangible. Under Anchor, people live in high-density dorms near the docks (night shifts). Under Reef, people live in scattered cottages (day shifts). This changes who meets whom and when.

  4.  **Designing the Props (The "Identity Cards"):**
      *   To make it visible, I need physical tokens representing Gen 2 individuals.
      *   Set A (Anchor Babies): Blue cards.
      *   Set B (Reef Babies): Green cards.
      *   Crucial Detail: The names/IDs on Blue cards *do not exist* if Green is chosen, and vice versa.
      *   Welfare Levels: Each card needs a "Life Quality Score" (LQS).
      *   *The Trap:* The Blue cards (chosen policy) must have a life worth living (positive LQS), but lower than the Green cards *would have had*. However, the Blue cards cannot claim they are worse off than *they* would have been, because otherwise they wouldn't exist.

  5.  **Structuring the Class (90 Minutes):**
      *   0-15 min: Setup & Policy Choice.
      *   15-30 min: The Reveal (Identity Shift & Card Distribution).
      *   30-60 min: The Tribunal.
      *   60-90 min: Debrief & Philosophical Mapping.

  6.  **Refining the Tribunal Rules:**
      *   The prompt specifies the standing rule: "A complaint goes forward only if the complainant is worse off under the chosen policy than someone would have been under the alternative."
      *   *Correction/Nuance:* If I phrase it exactly like that, they might compare Person A (Anchor) to Person B (Reef). The NIP relies on comparing Person A (Anchor) to Person A (Reef). But Person A (Reef) doesn't exist.
      *   *Better Rule for Discovery:* "To have standing, you must show that *you* are worse off than *you* would have been had the council chosen differently." This forces the counterfactual comparison that triggers the NIP.
      *   *Wait, re-reading prompt:* "a complaint goes forward only if the complainant is worse off under the chosen policy than someone would have been under the alternative."
      *   *Interpretation:* If I follow the prompt literally ("than someone"), they might compare Person A to Person B. That defeats the NIP. The prompt likely implies "worse off than *they* would have been." I will interpret the prompt's intent as the standard counterfactual condition for harm: $W(x, Policy A) < W(x, Policy B)$. I will phrase the rule carefully to ensure they try to compare the *same* person across worlds.
      *   *Actually, looking closer at the prompt:* "worse off under the chosen policy than someone would have been under the alternative." This is slightly ambiguous. If it means "than *anyone* would have been," it's easy to satisfy. If it means "than *they* would have been," it triggers NIP. I must ensure the rule forces the *same-person* comparison. I will draft the rule as: "You must demonstrate that you are worse off than *you yourself* would have been had the alternative policy been adopted."

  7.  **Addressing Failure Modes:**
      *   *Mode 1:* "Just say they are harmed because life is hard." -> Fix: Enforce the counterfactual rule strictly.
      *   *Mode 2:* "But they wouldn't exist!" -> Fix: That's the point. Don't let them bypass it.
      *   *Mode 3:* "Choose the other policy." -> Fix: The choice is already made in the simulation before the tribunal.
      *   *Mode 4:* Denying the identity shift. -> Fix: Make it structural (housing/mating pools).

  8.  **Drafting the Debrief:**
      *   Map the frustration to the Person-Affecting Restriction (PAR).
      *   Introduce the term "Nonidentity Problem."
      *   Discuss solutions: Impersonal Total/Average Utilitarianism, Threshold Constraints, Rights-based views.
      *   Acknowledge the limitation: We can't simulate "nonexistence."

  9.  **Review against Constraints:**
      *   14 students? Yes, assign roles accordingly.
      *   No "Nonidentity Problem" term until debrief? Yes.
      *   Plausible identity shift? Yes, via social engineering of the town.
      *   Props? Yes, cards.
      *   Candid about limitations? Yes.

  10. **Final Polish:**
      *   Ensure the tone is appropriate for an upper-level seminar (intellectual, rigorous, not gamified to the point of triviality).
      *   Make sure the "Life Quality Scores" are calibrated correctly (Positive but sub-optimal vs. Positive and optimal).
      *   Ensure the instructor script is clear on when to intervene.

  *(Self-Correction during drafting)*: I need to be careful with the Tribunal Rule. If I tell them "Compare yourself to yourself in the other world," they might immediately say "But I don't exist there." I want them to *try* to argue harm, hit the wall, and then realize the implication. So the rule should be phrased as a standard harm principle: "To claim harm, you must show the policy made you worse off than you otherwise would have been." The *realization* that they don't exist otherwise is the punchline.

  Let's refine the Identity Mechanism. To prevent "It's too random," I'll make it deterministic based on the policy. Policy A = Dormitory Living (Specific pairings). Policy B = Family Plots (Different pairings). This makes the identity shift a direct consequence of the policy, not chaos.

  Let's allocate the 14 students.
  *   3 Council Members (who made the choice).
  *   10 Generation 2 Citizens (Complainants).
  *   1 Tribunal Judge (or rotate).
  *   Actually, better: All 14 participate in the choice, then split.
  *   Let's go with: 4 Council, 1 Judge, 9 Citizens. (14 total).
  *   Wait, 14 students + Instructor.
  *   Roles: 4 Council, 1 Judge, 9 Citizens.
  *   Props: 9 Blue Cards (Actual), 9 Green Cards (Counterfactual - kept by instructor).

  Okay, ready to write.
answer: |-
  Here is a complete lesson plan designed for your 90-minute seminar. It is structured to force the philosophical collision through procedural friction rather than exposition.

  ### **Session Title:** The Port Haven Tribunal
  **Time:** 90 Minutes
  **Class Size:** 14 Students
  **Materials:** Two sets of index cards (Blue and Green), a timer, whiteboard.

  ---

  ### **I. Setup and Cast (0:00–0:15)**

  **The Scenario:**
  Introduce "Port Haven," a small, isolated coastal polity currently in its founding generation (Gen 1). They control a finite resource bed (rare earth minerals) and a fragile reef ecosystem.

  **The Choice:**
  The class acts as the **Development Council**. They must vote immediately on one of two binding 20-year plans.

  *   **Policy A (The "Anchor" Plan):** Intensive extraction. High immediate income. Gen 1 members are assigned to high-density labor dormitories near the docks to maximize shifts.
  *   **Policy B (The "Reef" Plan):** Conservationist extraction. Moderate income. Gen 1 members are assigned to scattered family cottages inland to protect the reef, with standard day shifts.

  **The Vote:**
  Rig the vote or guide the discussion so they choose **Policy A (Anchor)**. (If they naturally choose B, instruct them that for the sake of the simulation, the "historical record" shows they chose A due to economic pressure).
  *   *Instructor Note:* Emphasize that Policy A results in a society that is *good*, just not *optimal*. It is not a dystopia; life is worth living. It is simply wealthier but more polluted/stressful than Policy B would have been.

  **Cast Assignment (14 Students):**
  *   **4 Council Members:** (Those who voted/argued for the policy).
  *   **1 Tribunal Judge:** (Rotated role, or you can play this to ensure procedural strictness).
  *   **9 Generation 2 Citizens:** (The children of the Gen 1 founders).

  ---

  ### **II. The Mechanics of the Identity Shift (0:15–0:30)**

  This is the critical phase. You must prevent students from dismissing the identity shift as "speculative metaphysics." You will make it **structural and deterministic**.

  **The Explanation:**
  Tell the class: "We are now 20 years later. Generation 2 has come of age. Before we hear their complaints, we must establish the demographic record."

  **The Mechanism (The "Pairing Protocol"):**
  Explain that in Port Haven, marriage and conception are heavily influenced by housing and work allocation determined by the Policy.
  *   **Under Policy A (Anchor):** Workers lived in mixed-gender dorms with night shifts. This created specific social pairings (e.g., Person 1 met Person 2). Conception occurred primarily between 2:00 AM and 4:00 AM.
  *   **Under Policy B (Reef):** Workers lived in family cottages with day shifts. This created *different* social pairings (e.g., Person 1 met Person 3). Conception occurred primarily between 8:00 PM and 10:00 PM.

  **The Prop Distribution:**
  1.  **Hand out Blue Cards** to the 9 **Generation 2 Citizens**.
      *   **Label:** "Anchor Citizen."
      *   **ID:** A01 through A09.
      *   **Life Quality Score (LQS):** +50 (on a scale where 0 is not worth living, +100 is ideal).
      *   **Text:** "You exist. Your life is good, but the pollution from the Anchor Plan causes you chronic respiratory issues and lower income than projected."
  2.  **Keep Green Cards** hidden in your pocket.
      *   **Label:** "Reef Citizen."
      *   **ID:** R01 through R09.
      *   **Life Quality Score (LQS):** +80.
      *   **Text:** "You would have existed had the Reef Plan been chosen. You would have had better health and higher income."

  **The Hard Constraint:**
  Write on the board: **"Conception is time-sensitive and partner-sensitive. A difference of two months in conception timing, or a different partner, results in a different gamete combination and a different person."**

  Tell the students: "Because Policy A dictated dorms and night shifts, and Policy B dictated cottages and day shifts, **none of the people holding Blue Cards would have been born if Policy B had been chosen.** The people who *would* have been born are the Green Cards, which do not exist in this room."

  *   *Instructor Note:* If a student objects ("Maybe the same people meet anyway?"), shut it down procedurally. "In the model of Port Haven, housing assignment is the primary determinant of social networks. We are stipulating this as a fact of the simulation to test the ethics, not the sociology."

  ---

  ### **III. The Tribunal Procedure (0:30–1:00)**

  **The Standing Rule:**
  The Tribunal Judge (student or you) must enforce this specific rule for hearing complaints. Write it on the board:

  > **Rule of Standing:** A complaint of harm is admissible only if the complainant can demonstrate that **they are worse off under the chosen policy than *they themselves* would have been had the alternative policy been adopted.**

  **The Process:**
  1.  **Call Witnesses:** Call the 9 Generation 2 Citizens (Blue Cards) one by one (or in groups of 3 to save time).
  2.  **The Complaint:** They state their grievance. (e.g., "I have asthma because of the pollution," "I am poorer than I should be.")
  3.  **The Defense:** The Council Members argue that the policy was reasonable.
  4.  **The Ruling:** The Judge must apply the Rule of Standing.

  **The Trap:**
  When a Blue Card says, "I am worse off than I would have been," the Council (and eventually the Judge) must ask: "Would *you* (Blue Card A01) have existed under Policy B?"
  *   **The Fact:** No. Under Policy B, Green Card R01 would exist. Blue Card A01 would not.
  *   **The Comparison:** To satisfy the Rule of Standing, A01 must compare their current state (+50) to their counterfactual state.
  *   **The Counterfactual State:** Non-existence.
  *   **The Judgment:** Is +50 (Life) worse than 0 (Non-existence)? No. Therefore, A01 is not "worse off." Therefore, A01 has no standing.

  **Expected Friction:**
  Students will try to break the rule. They will say:
  *   "But they are suffering!" -> *Judge:* "Is it harm relative to their alternative?"
  *   "Compare them to the Green Cards!" -> *Judge:* "Rule says compare *themselves* to *themselves*."
  *   "Non-existence is worse!" -> *Judge:* "So they are *better* off existing? Then they have no complaint of harm."

  **Goal:** By minute 60, the Tribunal should reach a verdict: **No one has standing. No one was wronged.** Yet, intuitively, the class should feel that choosing the lower-quality policy (A) over the higher-quality policy (B) was morally questionable.

  ---

  ### **IV. Debrief and Philosophical Mapping (1:00–1:30)**

  Stop the role-play. Move to the whiteboard. This is where you introduce the terminology.

  **1. Name the Problem (5 mins)**
  *   Reveal the term: **The Nonidentity Problem** (coined by Derek Parfit).
  *   Acknowledge the frustration: "You just felt a moral residue—a sense that Policy A was worse—without being able to locate a victim. That gap is the problem."

  **2. Map the Positions (15 mins)**
  Draw three columns on the board. Ask students to categorize their arguments from the tribunal into these buckets.

  *   **Column 1: The Person-Affecting Restriction (PAR)**
      *   *Definition:* An act can only be wrong if it makes some *particular* person worse off than they otherwise would have been.
      *   *Tribunal Outcome:* This is the Rule of Standing you enforced. Under PAR, the Council did nothing wrong.
      *   *Student Intuition:* Most will reject this outcome. "It can't be permissible to choose a polluted future just because different people live in it."

  *   **Column 2: Impersonal Principles (The "No Difference" View)**
      *   *Definition:* We compare states of affairs, not specific people. State B (Reef) is better than State A (Anchor) because the total/average welfare is higher, regardless of *who* exists.
      *   *Tribunal Outcome:* This allows us to say Policy A was wrong, but it severs the link between "wrong" and "victim."
      *   *Discussion:* Is it okay to sacrifice the interests of existing people for the sake of a "better" set of people who would otherwise not exist? (Leads to Repugnant Conversation territory).

  *   **Column 3: Threshold Constraints / Rights**
      *   *Definition:* It is wrong to create people whose lives fall below a certain threshold of decency, even if they are glad to exist.
      *   *Tribunal Outcome:* In this simulation, Blue Cards had +50 (a good life). If you had given them +5 (a miserable life), would the verdict change?
      *   *Discussion:* This modifies the PAR. It suggests we have duties to "future people" generally, not specific identifiable individuals.

  **3. The "Residue of Wrong" (5 mins)**
  Ask the class: "If no one was wronged, what is the 'wrong' we feel?"
  *   Is it a violation of stewardship?
  *   Is it a failure of virtue by the Council?
  *   Is it a purely impersonal badness?

  ---

  ### **V. Predictable Failure Modes & Fixes**

  | Failure Mode | Why it happens | Instructor Fix |
  | :--- | :--- | :--- |
  | **"I deny the identity shift."** | Students resist the idea that housing changes conception enough to alter identity. | **Pre-empt it.** In the Setup, state: "In Port Haven, conception is tightly regulated by work shifts. This is a stipulation of the case." Do not allow debate on the metaphysics during the Tribunal. |
  | **"Compare A01 to R01."** | Students try to compare the Blue Card person to the Green Card person to find harm. | **Enforce the Rule.** "The Rule of Standing requires a *de re* comparison (same person), not a *de dicto* comparison (slot filling). Did *you* lose out?" |
  | **"Non-existence is worse."** | Students argue that existing with asthma is worse than never existing. | **Push the logic.** "If non-existence is worse, then you are *benefited* by the policy. Can you claim harm if you are benefited?" |
  | **"The Council is vicious."** | Students pivot to virtue ethics to escape the paradox. | **Acknowledge but bracket.** "That may be true, but we are analyzing *harm* and *rights* today. Can we find a victim?" |
  | **"Let's just change the policy."** | Students try to rewind the simulation to fix the outcome. | **Hold the line.** "The simulation is about *judging* the outcome, not re-running the choice. We must live with the consequences of Policy A." |

  ---

  ### **VI. Limitations: What the Activity Cannot Reproduce**

  Be candid with the students in the final 5 minutes. There are aspects of the Nonidentity Problem that a role-play cannot capture because students are *existing* subjects.

  1.  **The Status of Non-Existence:**
      *   *The Limit:* In the room, the "Green Card" people are represented by cards. They have a presence. In reality, the alternative people have *no* status. There is no "them" to be deprived.
      *   *The Board Work:* Draw a line. Above the line: "Existing People." Below the line: "Possible People." Explain that standard ethics operates above the line. The Nonidentity Problem forces us to draw moral lines below it, where there are no subjects to hold rights.

  2.  **The "Better Off" Intuition:**
      *   *The Limit:* The Blue Card students *feel* like they are suffering (asthma, lower income). It is hard for them to genuinely accept they are "better off" than not existing.
      *   *The Board Work:* Distinguish between **Comparative Harm** (worse off than baseline) and **Non-Comparative Harm** (in a bad state). The Tribunal ruled on Comparative Harm. The moral intuition often rests on Non-Comparative Harm.

  3.  **The Scale:**
      *   *The Limit:* 9 people is a small number. The Nonidentity Problem becomes most pressing with climate change or nuclear waste, where millions of identities are at stake.
      *   *The Board Work:* Ask: "Does the number of people change the logic? If it's 9 people, does PAR hold? If it's 9 million, does PAR break?"

  ### **Instructor's Closing Script (Suggestion):**
  >"Today you felt the friction of the Nonidentity Problem. You wanted to say the Council did wrong, but you couldn't find a plaintiff. Parfit's challenge is this: If we cannot say they were harmed, can we still say the act was wrong? If yes, we must abandon the idea that morality is only about how we treat specific individuals. We must accept that we can wrong the *future* without wronging the *people* of the future. That is the cost of solving the problem you just faced."
