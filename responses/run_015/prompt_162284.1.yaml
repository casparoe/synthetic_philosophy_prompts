  **TO:** Exhibitions Committee
  **FROM:** Sixth-form Representative, Youth Advisory Panel
  **DATE:** 10 May 2024
  **SUBJECT:** Copy Sign-off: Industrial Gallery Panel (1816–1819)

  **Recommendation**

  For the meeting on the 14th, I recommend we **approve the copy subject to named revisions**. I propose we require the Curator to amend the specific clauses regarding mortality and relief by Tuesday the 16th, allowing time for proofing before the printer's deadline. We cannot send this back for a full redraft without jeopardising the March opening, but approving the draft as it stands risks embedding a historical error regarding causation.

  **The Dispute**

  The committee is divided between the Curator's draft, which highlights Mount Tambora and typhus as active agents of suffering, and the Trustee's objection that this constitutes **environmental determinism** (the theory that physical geography or climate dictates human social development). The Trustee argues that personifying a bacterium and a mountain lets the Board of Guardians and Parliament off the hook for relief decisions. This is not merely a disagreement about tone; it is a disagreement about what we are doing when we identify a cause.

  **The Mediation Test**

  To resolve this, I propose we adopt the 'mediation test' for this panel and future ones. A natural factor may be written in **agentive language** (language that treats something as an active doer, e.g., 'the volcano struck') only where:
  1. It made a real difference to what human agents could reasonably have done (e.g., the cold summer closed off agricultural options open in 1814); and
  2. Its effects were not wholly routed through an institution that could have acted otherwise.

  My EPQ supervisor has objected that this test is too convenient: it risks pushing moral weight onto whichever human body we happen to be cross with, allowing us to describe the same event as an act of nature when we feel generous and an act of policy when we do not. This is a serious charge. If we apply the test selectively, it becomes propaganda.

  However, the test remains valid if we anchor it in evidence of *capacity*, not blame. The question is not whether we dislike the Guardians, but whether the historical record shows they had the capacity to mitigate the outcome. In 1817, outdoor relief was a known mechanism. Where institutions had the capacity to alter the outcome but chose not to, the chain of causation is mediated by human decision. The test does not ask us to be moralising; it asks us to be mechanistic about how suffering occurred.

  **Application to the Panel**

  Applying this to the current copy:
  *   **The Harvest:** The failed harvest passes the test. The weather closed off options for weavers and farmers alike. Describing the summer of 1816 as 'devastating' is accurate; no policy could have conjured grain that did not grow.
  *   **The Mortality:** The death toll fails the test. Whether a family survived typhus depended heavily on whether the Guardians provided outdoor relief or packed them into the workhouse. The virus was the mechanism, but the mortality rate was determined by relief policy. To write that 'the fever killed forty people' without referencing the conditions of confinement implies the death toll was inevitable. It was not.

  **Required Revisions**

  Therefore, the Curator should retain the context on Tambora but revise the section on mortality. Specifically, the sentence stating 'the fever moved through the workhouse and killed forty people' should be amended to reflect institutional agency. I suggest: 'crowding in the workhouse, mandated by the Board of Guardians, turned a fever outbreak into a mortality crisis.' This satisfies the mediation test: the virus existed, but the death toll was routed through an institution that could have acted otherwise.

  **Conclusion**

  This approach respects the Curator's narrative about the global climate event while accepting the Trustee's point about local responsibility. It avoids the trap of selective moralising by focusing on documented capacity rather than modern judgement. If we adopt this criterion now, it will provide a consistent standard for the later panels on the Poor Law and the Swing Riots. We must decide on the 14th, but we should not decide to print ambiguity.

  I look forward to discussing this further at the meeting.
