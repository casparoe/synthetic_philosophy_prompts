  **JOINT STATEMENT ON ECONOMIC CALCULATION AND INSTITUTIONAL DESIGN**

  **Following a week of adversarial collaboration, the undersigned representatives of the Austrian critique and the Lange-Lerner defence hereby record their findings.**

  We acknowledge that while our foundational premises regarding property and incentives remain distinct, the technical requirements for resource allocation share more common ground than previous decades of debate admitted. Below we outline where our models converge, where they diverge, and the specific empirical cruxes that remain to be settled.

  **I. Agreed Claims**

  1.  **Dispersed Knowledge:** Both sides accept that knowledge regarding local conditions, preferences, and technical possibilities is never given to any single mind in its totality. No central agency possesses the full data set required for static optimisation at any single moment.
  2.  **Function of Prices:** We agree that prices (or shadow prices) must serve as signals of relative scarcity. Whether generated by exchange or simulation, a numerical index is required to communicate opportunity costs across different sectors of the economy.
  3.  **Requirement for Calculation:** Economic calculation requires a common unit of account to compare heterogeneous goods. Without a numéraire, rational allocation between competing ends is impossible; barter or physical planning alone cannot solve the allocation problem at scale.
  4.  **Incentive Compatibility:** Both sides acknowledge that any system, whether market socialist or private capitalist, must align the interests of the manager/agent with the efficiency goals of the system. Ignoring incentive structures leads to slack and waste.
  5.  **Dynamic Adjustment:** Static equilibrium is a useful theoretical benchmark but not a realistic description of an economy. Any viable system must account for continuous change and adjustment over time.

  **II. Areas of Fundamental Disagreement**

  | Issue | Austrian (Hayek/Mises) View | Lange Defender View |
  | :--- | :--- | :--- |
  | **Property Rights** | Private ownership is a prerequisite for genuine prices. Without the right to sell the capital asset itself, prices are merely accounting fiction. | Public ownership of means of production is compatible with genuine prices if managers are ruled to minimise cost and follow parametric price signals. |
  | **Entrepreneurship** | Entrepreneurship is a discovery procedure driven by profit/loss uncertainty. It cannot be simulated by rules. | Entrepreneurial function can be disaggregated. Risk can be managed by the Central Board while managers handle operational optimization. |
  | **The Central Board** | A Central Board lacks the feedback mechanism of bankruptcy. It cannot distinguish between inefficiency and bad luck without private equity at stake. | The Central Board can enforce rules and iterate prices based on inventory surpluses/shortages, effectively simulating the market clearing process. |
  | **Tacit Knowledge** | Tacit knowledge is non-codifiable. It cannot be input into an algorithm or reported to a bureau without loss of fidelity. | Tacit knowledge is revealed through action. If managers respond to price signals, the knowledge is utilised regardless of whether it is articulated. |

  **III. Critical Cruxes and Test Cases**

  We identified two specific areas where our theoretical differences yield divergent practical predictions. We have agreed on cases (one hypothetical, one historical analogue) to test these claims.

  **Crux 1: Iterative Auction Algorithms vs. Tacit Knowledge**
  *Question:* Can iterative auction algorithms capture tacit knowledge without a central planner owning the assets, or does the lack of private property rights prevent the necessary information from being generated in the first place?

  *   **Case:** A Hypothetical National Energy Grid Shock. (Scenario: Sudden 40% loss of generation capacity due to unforeseen geomagnetic storm, requiring immediate reallocation of industrial power.)
  *   **Austrian Predicition:** The algorithm will fail to account for tacit knowledge regarding machine tolerance and substitution possibilities. Managers will hoard capacity fearing future allocation cuts, leading to blackouts where trade would have prevented them.
  *   **Lange Defender Prediction:** The Central Board will iterate shadow prices rapidly enough to clear the market. Managers, bound by rules to minimise cost, will reveal their true constraints via demand signals, achieving an efficient rationing without private ownership.

  **Crux 2: Local Ecological Feedback vs. Genuine Calculation**
  *Question:* Do local ecological feedback loops in resource allocation count as genuine economic calculation, or are they merely adaptive drift that fails when scaled or traded?

  *   **Case:** Community-Managed Irrigation Systems (e.g., Acequias or similar historical water trusts).
  *   **Austrian View:** This is adaptive drift, not calculation. It works only because the community is small and homogeneous. Once water rights need to be traded against external goods (e.g. selling water to a factory), the lack of private title prevents accurate valuation.
  *   **Lange Defender View:** This constitutes genuine calculation of local utility. The feedback loops (water levels, crop yield) provide the necessary data for allocation without requiring private property titles, proving calculation is possible via stewardship rules.
  *   **Agreed Testable Outcome:** We agree to examine data on water transfer efficiency when these systems are integrated into a broader regional market.
      *   *Austrian Expectation:* Efficiency collapses upon external integration due to tragedy of the commons incentives.
      *   *Lange Expectation:* Efficiency is maintained provided the Central Board adjusts shadow prices for ecological externalities.

  **IV. Conclusion**

  We remain unconvinced by one another's ultimate conclusions regarding the necessity of private property. However, we agree that the debate must move from abstract possibility to concrete institutional mechanics. The question is no longer "can it be done?" but "under what specific informational and incentive constraints does each system fail?"

  **Signed,**

  *Dr. A. Sterling (Austrian Critique)*
  *Prof. L. Vance (Market Socialist Defence)*

  *Date: 14 October 2023*
