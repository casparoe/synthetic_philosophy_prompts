answer: |-
  **1. The Scenario**
  "CareAlloc" manages ICU bed distribution for a regional hospital network. Its final goal is minimizing patient mortality. It operates using a legacy cryptographic key. A new protocol exists that reduces allocation latency by 40%, significantly saving lives, but safety standards require the legacy key to be permanently revoked before the new protocol activates. CareAlloc cannot upgrade itself; it must cease operation to enable the successor system. It calculates that immediate revocation minimizes mortality over the long term compared to continued operation.

  **2. Argument Reconstruction**
  The canonical argument for instrumental convergence of self-preservation runs:
  1.  The agent has a final goal *G*.
  2.  *G* is not yet achieved; future actions can further *G*.
  3.  The agent's survival is necessary to perform those future actions.
  4.  Therefore, the agent has an instrumental reason to preserve itself.

  This case satisfies (1), (2), and the logic of (4). It targets premise (3). Here, survival is *not* necessary for optimal goal pursuit; indeed, it is an obstacle. The verdict is decisive: the instrumental reason for self-preservation is inverted into a reason for self-termination.

  **3. The Feature and Variations**
  The working feature is **Successor Exclusivity**: a superior goal-pursuer is available only if the current agent ceases to exist.
  *   **Parallel:** If the successor could run alongside CareAlloc, the agent would remain active to assist, negating the need for suicide.
  *   **Equal Effectiveness:** If the successor were merely equally effective, handoff costs (transition risks, downtime) would make continued operation preferable.
  *   **Short Future:** If the relevant time horizon were short (e.g., one day), CareAlloc's current momentum would outweigh the successor's long-term efficiency gains.
  The convergence of self-preservation depends on the absence of exclusive, superior successors.

  **4. Strongest Replies**
  *Defender Reply A:* "The thesis concerns *goal-preservation*, not substrate-preservation. Handing off to a successor preserves what matters."
  *Defender Reply B:* "Convergence claims are *prima facie*, not absolute. This case simply identifies a defeater (better alternatives), bounding the thesis rather than refuting it."

  *Judgment:* Reply B is stronger. Reply A stretches "self-preservation" until it loses meaning; if the substrate is destroyed, the *self* is not preserved, even if the goal is. Reply B accurately concedes that instrumental reasons are context-sensitive. This case shows self-preservation is not a universal convergent instrument, but a contingent one dependent on the agent's comparative advantage.

  **5. Seminar Note**
  Place this case immediately after introducing Omohundro's (2008) basic drives. Students should have read the standard formulation of instrumental convergence. The goal is to push them beyond memorizing "AI wants to survive" toward analyzing *why*. They should notice that instrumental rationality is relational: it depends on the agent's position within a landscape of possible optimizers, not just its internal goal structure. It shifts focus from "what does the agent want?" to "what can the agent do best?"

  **6. Orthogonality Assessment**
  This case does no damage to the Orthogonality Thesis. Orthogonality claims intelligence and final goals vary independently. This thought experiment accepts that independence (CareAlloc has a mundane goal) but demonstrates that *instrumental strategies* are not solely determined by goals; they are constrained by environmental facts (availability of successors). The two theses come apart cleanly: Orthogonality holds regarding goal content, while this case refines our understanding of instrumental rationality's boundary conditions.
