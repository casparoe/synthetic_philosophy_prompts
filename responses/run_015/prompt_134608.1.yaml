      *   *Speaker Meaning vs. Sentence Meaning:* Sentence meaning is derived from conventions (language rules). Speaker meaning is what the individual intends to convey in a specific context. Implicature belongs to speaker meaning.
      *   *Cooperative Principle (CP):* "Make your conversational contribution such as is required..."
