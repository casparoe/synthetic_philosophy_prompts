  ### The Moral Responsibility Decision Tree

  This instrument classifies positions on moral responsibility based on intuitions about specific cases. It avoids technical jargon in the branch questions, allowing your characters to answer based on their gut reactions to the scenarios.

  **Instructions:** Start at **Q1**. Answer **Yes** or **No** based on whether the character believes the protagonist is blameworthy in the described scenario. Follow the branch to the next question or to a Leaf (final position).

  ---

  #### **Q1 (The Standard Monitor)**
  *Scenario:* A device monitors the protagonist's brain. It is set to intervene and force a different choice *only if* she shows signs of wavering. She does not waver. She acts exactly as she wanted, without the device ever firing.
  *Question:* **Is she blameworthy for her action, despite the presence of the device?**
  *   **No:** Go to **Q2**. (The device's presence undermines responsibility).
  *   **Yes:** Go to **Q4**. (The actual sequence of action preserves responsibility).

  #### **Q2 (The Indeterministic World)**
  *Scenario:* Remove the device entirely. Assume the universe is *not* deterministic; her choice was not guaranteed by the past, but she still chose exactly as she did.
  *Question:* **Is she blameworthy in this indeterministic world?**
  *   **No:** Go to **Leaf H**. (Nothing secures responsibility).
  *   **Yes:** Go to **Q3**. (Determinism/Devices are the problem, not causation itself).

  #### **Q3 (The Induced Twitch)**
  *Scenario:* Return to the **Standard Monitor** case (Q1). Suppose the only alternative possibility she retains is a tiny "twitch" of hesitation that the monitoring device itself induces to check her status. She does not twitch.
  *Question:* **Does the existence of this tiny, artificial alternative make her blameworthy?**
  *   **No:** Go to **Leaf SI**. (Alternatives don't matter; the source is compromised).
  *   **Yes:** Go to **Leaf L**. (Alternatives are required, even flickers).

  #### **Q4 (The Trying-and-Failing)**
  *Scenario:* Return to the **Standard Monitor** case (Q1). Suppose she feels a strong "pull" to do the wrong thing and tries to resist it internally, but never actually wavers in her action. The device sees no need to intervene.
  *Question:* **Is this internal struggle (trying-and-failing to resist) necessary for her to be blameworthy?**
  *   **Yes:** Go to **Leaf U1**. (Responsibility requires moral struggle).
  *   **No:** Go to **Q5**. (Responsibility depends on the action's source, not the struggle).

  #### **Q5 (The Past Self-Arrangement)**
  *Scenario:* Suppose it is revealed that years earlier, she freely arranged her own upbringing and habits to become exactly the sort of person the device would never have to correct.
  *Question:* **Does that past arrangement ground her blame more than the current action does?**
  *   **Yes:** Go to **Leaf SC**. (History and character formation are key).
  *   **No:** Go to **Q6**. (Current guidance control is sufficient).

  #### **Q6 (The Forward-Looking Test)**
  *Scenario:* Assume she is blameworthy based on the current action alone.
  *Question:* **Is blame justified *only* if it improves future behavior, even if she doesn't truly "desert" it?**
  *   **Yes:** Go to **Leaf R**. (Responsibility is a tool, not a metaphysical fact).
  *   **No:** Go to **Leaf SM**. (Responsibility is about genuine desert in the actual sequence).

  ---

  ### The Leaves (Positions)

  | Leaf | Position Name | Diagnosis of Unoccupied/Adjacent | Awkward Line for Character |
  | :--- | :--- | :--- | :--- |
  | **Leaf L** | **Leeway Position** (Incompatibilist) | *Occupied.* Requires alternatives (PAP). | "I can't blame her unless there was a genuine moment where she could have slipped." |
  | **Leaf SI** | **Source-Incompatibilist** | *Occupied.* Denies responsibility even with flickers if source is compromised. | "Even if she could have twitched, the setup means the action didn't truly come from her." |
  | **Leaf H** | **Hard-Incompatibilist** | *Occupied.* Skepticism about all responsibility. | "You can say she chose, but if you trace the line back far enough, no one ever chooses." |
  | **Leaf U1** | **Unnamed** (Moral Struggle View) | **Unattractive.** Implies calm virtue is less praiseworthy/blameworthy than struggle. | "She's only guilty because she had to fight herself to do the right thing." |
  | **Leaf U2** | **Unnamed** (Leeway Compatibilist) | **Unexplored.** (Reached if Q1=Yes, Q3=Yes). Combines actual sequence with PAP requirement. | "The device didn't fire, but I still need to know she could have made it fire." |
  | **Leaf SC** | **Source/Actual-Sequence Compatibilist** | *Occupied.* History-sensitive compatibilism. | "She is to blame because she spent years building the character that made this choice inevitable." |
  | **Leaf SM** | **Semicompatibilist** | *Occupied.* Focuses on guidance control, not history. | "It doesn't matter how she got here; what matters is that she owned the action when she did it." |
  | **Leaf R** | **Revisionist** (Forward-Looking) | *Occupied.* Drops desert, keeps practice. | "We should blame her not because she deserves it, but because it's the only way to keep us safe." |

  **Note on Separation:** **Leaf SC** (Source Compatibilist) and **Leaf SM** (Semicompatibilist) are difficult to separate in practice. Many philosophers hold both views simultaneously. The tree separates them only by whether they prioritize *history* (SC) or *current sequence structure* (SM). If your characters find this distinction too fine, merge them.

  ---

  ### Mapping Your Characters

  Here is where your three current characters land in the tree, and an analysis of their disagreements.

  **Character 1:** *"She couldn't have done otherwise, so blame is off the table."*
  *   **Path:** Q1 (**No**) → Q2 (**Yes**) → Q3 (**Yes**).
  *   **Leaf:** **Leeway Position (Leaf L)**.
  *   **Analysis:** This character believes the *Principle of Alternative Possibilities* (PAP) is necessary. They deny responsibility in the Frankfurt case (Q1=No) because the device removes alternatives. However, they are not a global skeptic; they admit responsibility is possible in an indeterministic world (Q2=Yes).
  *   **Awkward Line:** "I can't blame her unless there was a genuine moment where she could have slipped."

  **Character 2:** *"The device never touched the actual story, so she is fully answerable."*
  *   **Path:** Q1 (**Yes**) → Q4 (**No**) → Q5 (**No**) → Q6 (**No**).
  *   **Leaf:** **Semicompatibilist (Leaf SM)**.
  *   **Analysis:** This character focuses on the *Actual Sequence*. The device is irrelevant because it didn't fire. They don't require internal struggle (Q4=No) or specific history (Q5=No), and they believe in genuine desert (Q6=No).
  *   **Awkward Line:** "It doesn't matter how she got here; what matters is that she owned the action when she did it."

  **Character 3:** *"Even if she is answerable, none of us are, really."*
  *   **Path:** Q1 (**No**) → Q2 (**No**).
  *   **Leaf:** **Hard-Incompatibilist (Leaf H)**.
  *   **Analysis:** This character is a global skeptic. They agree with Character 1 that the protagonist isn't responsible, but for a deeper reason: *no one* is, even without the device.
  *   **Awkward Line:** "You can say she chose, but if you trace the line back far enough, no one ever chooses."

  ### Substantive vs. Verbal Disagreements

  1.  **Character 1 vs. Character 3 (Substantive):**
      *   **Disagreement:** They agree on the verdict for the protagonist (No Blame), but they disagree on the *scope* of that verdict.
      *   **Why:** Character 1 allows for responsibility in an indeterministic world (Q2=Yes). Character 3 denies it even then (Q2=No).
      *   **Advice:** **Keep this scene.** It is a genuine philosophical clash about the nature of causation vs. alternatives. Character 1 thinks fixing the *alternatives* fixes the blame; Character 3 thinks the problem is deeper.

  2.  **Character 1 vs. Character 2 (Substantive):**
      *   **Disagreement:** They disagree on the verdict (No Blame vs. Blame).
      *   **Why:** Character 1 requires Alternatives (PAP). Character 2 requires only Sourcehood (Actual Sequence).
      *   **Advice:** **Keep this scene.** This is the core "Frankfurt Case" debate. Character 1 says "No alternatives = No blame." Character 2 says "Real action = Blame."

  3.  **Character 2 vs. Character 3 (Substantive):**
      *   **Disagreement:** They disagree on the verdict (Blame vs. No Blame).
      *   **Why:** Character 2 thinks responsibility is compatible with causal determination (Compatibilist). Character 3 thinks it is not (Incompatibilist).
      *   **Advice:** **Keep this scene.** This is the classic Free Will debate.

  **Conclusion:** You have no merely verbal disagreements here. All three pairs represent genuine fault lines in the logical space. You do not need to cut any scenes based on the characters talking past each other; they are arguing about different nodes in the tree.
