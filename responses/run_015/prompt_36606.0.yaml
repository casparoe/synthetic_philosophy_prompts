  "Is the apprentice in Scenario A (Watching) a **Skinnerian** learner (like your rat), but in Scenario B (Reading) a **Gregorian** learner (like your tourist)?"

  **Why this splits the rules:**
  *   **If she says YES (A=Skinnerian, B=Gregorian):** She is committed to the **Artifact Boundary Rule**. The *medium* (paper vs. person) dictates the mind-grade. This implies human teaching is biologically no different than rat copying unless it's written down. This is a controversial, hardline stance you can press her on.
  *   **If she says NO (Both are Gregorian):** She abandons the **Rat Verdict logic**. She admits that *social transmission of culture* counts as Gregorian, which means the Rat should arguably have been graded higher (or at least that humans have a different rule than rats).
  *   **If she says NO (Both are Skinnerian):** She is running a strict **Internalization Rule**. You aren't Gregorian until the tool is *inside* your head. The map doesn't make you Gregorian; memorizing the map does. This contradicts her Tourist verdict.

  **The Follow-up:**
  If she sticks with **YES**, ask: *"So if I memorize the map and throw it away, do I stop being Gregorian and become Popperian?"* This tests whether Gregorian is a state of *connection* or a state of *content*.
