  The cord unwinds, spinning the wooden bucket,
  At first the surface lies as flat as sleep,
  Until friction drags the liquid into motion,
  **And the water climbs the wall, knowing it moves.**

  Is there a vessel made of invisible glass,
  Where void exists before the masses arrive,
  A stage where atoms act their parts in silence,
  And weight persists without a cause.

  Or does the radiation background define
  The only rest there is, a glow of dust,
  Where motion is merely a shifting limit
  Between the spinning water and the stars.

  **And the water climbs the wall, knowing it moves.**
  The microwave sky marks a place to stand,
  Yet silence meets the question as it forms,
  Still watching the water curve in the grasp.
