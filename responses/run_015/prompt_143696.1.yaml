      *   *Layer 2 (1985):* Curators tried to be progressive *for their time*. Judging them as "failures" now ignores their effort and historical context.
      *   *The Trap:* If we remove it because it offends *us* now, we are committing the same error we accuse the 1920s/1985 people of (ignoring context).
      *   *The Solution:* Contextualize, don't erase.

  3.  **Determine the Recommendation:**
      *   *Option 1: Tear it out.* Pros: Clean slate, stops offense. Cons: Erases history, validates "cancel culture" accusations, loses the story of how museum interpretation has changed.
