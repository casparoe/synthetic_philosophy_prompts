      *   *Option 3: Keep with specific changes (Contextualization).* Pros: Preserves the object as a historical artifact itself, educates on changing standards, honors Indigenous expertise without erasing the past.
      *   *Decision:* **Keep with specific changes.** This is usually the best museum practice (preservation + reinterpretation). It addresses the harm without erasing the history of the museum itself.

