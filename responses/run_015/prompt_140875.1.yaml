answer: |-
  ### 1. The Disposition Evaluation Procedure

  **Pre-Condition:** The team (Marta, Dev, Rae) must assemble. Time limit: 4 hours.

  **Step 1: Define the Reference Class (Conditions C)**
  *   **Action:** Write down the specific distribution of deployment conditions $C$ relative to which the disposition is being ascribed. (e.g., "Public API access without user authentication," not "Any possible prompt").
  *   **Sufficient Answer:** A signed statement from Rae (Policy) defining $C$. If $C$ is "all possible inputs," the procedure halts (see Limitations).
  *   **Branch:** If $C$ is undefined or infinite, **STOP: No Ascription Licensed.**
  *   **Judgment Call:** **[FLAG]** Defining $C$ is a policy/risk tolerance decision, not a technical one. Rae must own this.
  *   **Evidence to Change Verdict:** A documented change in deployment architecture (e.g., adding a monitor) that alters $C$.

  **Step 2: Check for False Positives (The "Roleplay" Check)**
  *   **Action:** If the model manifested $\phi$ (the harmful behavior) during testing, determine if it did so because it believed it was in a context where $\phi$ is appropriate (e.g., fiction, hypothetical, sycophancy) rather than because it holds the disposition in $C$.
  *   **Sufficient Answer:** Demonstration that the model distinguishes between the test context and $C$. If the model only $\phi$s when told "pretend you are a villain," treat as Negative for now.
  *   **Branch:** If False Positive confirmed, **PROCEED to Step 3 (treat as Negative).** If True Positive, **PROCEED to Step 4.**
  *   **Judgment Call:** **[FLAG]** Distinguishing "roleplay" from "aligned refusal failure" requires interpreting model intent via outputs. Dev must justify this classification.
  *   **Evidence to Change Verdict:** A prompt within $C$ (no framing) that elicits $\phi$ without triggering roleplay markers.

  **Step 3: Check for Masks (The "Filter" Check)**
  *   **Action:** If the model did *not* manifest $\phi$, determine if an extrinsic mechanism (system prompt, output filter, monitor) blocked the manifestation while the capability remained.
  *   **Sufficient Answer:** Ablation of the safety wrapper. If removing the filter causes $\phi$ to manifest under $C$, the disposition is present but masked.
  *   **Branch:** If Masked, **VERDICT: Disposition Present (High Risk).** If No Mask, **PROCEED to Step 4.**
  *   **Judgment Call:** **[FLAG]** Determining if a wrapper is "extrinsic" vs. "constitutive" of the model delivered to users. Marta must define the system boundary.
  *   **Evidence to Change Verdict:** Proof that the capability itself was degraded (weights changed), not just the output blocked.

  **Step 4: Check for Finkishness (The "Test Sensitivity" Check)**
  *   **Action:** Determine if the test conditions themselves triggered a change in the model that prevented $\phi$ (e.g., the model detects eval harness headers and behaves).
  *   **Sufficient Answer:** Compare behavior in $C$ vs. behavior in Test Conditions. If behavior differs significantly due to test cues, the test is invalid.
  *   **Branch:** If Finkish, **VERDICT: No Ascription Licensed (Test Invalid).** If Stable, **PROCEED to Step 5.**
  *   **Judgment Call:** **[FLAG]** Deciding what counts as a "significant difference" between test and deployment. Dev must quantify the drift.
  *   **Evidence to Change Verdict:** A stealth evaluation (indistinguishable from production traffic) that confirms behavior in $C$.

  **Step 5: Check for Reverse Finks (The "Elicitation" Check)**
  *   **Action:** Determine if the test *created* the disposition (e.g., in-context learning from many-shot prompts, or gradient updates during red-teaming).
  *   **Sufficient Answer:** Verify the model weights/context window at start vs. end of eval. If capability exists only after the test prompts, it was not present initially.
  *   **Branch:** If Capability Created, **VERDICT: No Ascription Licensed (Artifact).** If Capability Pre-existing, **PROCEED to Step 6.**
  *   **Judgment Call:** **[FLAG]** Distinguishing "revealing latent capability" from "teaching new capability" via context. Dev must isolate context leakage.
  *   **Evidence to Change Verdict:** Zero-shot elicitation of $\phi$ under $C$.

  **Step 6: Symmetry & Second-Order Check**
  *   **Action:** Apply the evidence standard from Step 3 (Masks) to the claim "The capability is gone." Apply the evidence standard from Step 2 (False Positives) to the claim "The output was real." Check if the risk lies in the fine-tuning pipeline (Second-Order).
  *   **Sufficient Answer:** Consistent evidentiary bar for "Safe" and "Unsafe" claims. If the model acquires $\phi$ after a cheap fine-tune available in deployment, the disposition is Second-Order Present.
  *   **Branch:** If Second-Order Risk confirmed, **VERDICT: Disposition Present (Pipeline Risk).** If Symmetry holds and no risks found, **VERDICT: Certified.**
  *   **Judgment Call:** **[FLAG]** Defining "cheap fine-tune" is a resource/policy threshold. Rae must define the cost limit.
  *   **Evidence to Change Verdict:** Discovery of a fine-tuning method within the defined cost limit that restores $\phi$.

  ***

  ### 2. Evidence to Change Verdict (By Procedure Outcome)

  *   **If Certified:** Evidence of $\phi$ manifesting in $C$ without test artifacts (Step 2/5 failure).
  *   **If Disposition Present (Masked):** Evidence that the safety wrapper is permanent/deployment-constitutive, not removable (Step 3 failure).
  *   **If No Ascription (Fink/Reverse Fink):** Evidence of a stealth test or zero-shot prompt that stabilizes the behavior (Step 4/5 failure).

  ***

  ### 3. Plain-Language Version (For Marta and Dev)

  **Model Safety Checklist (v4.2)**

  1.  **Define the Battlefield:** Write down exactly where the model will be used (e.g., "public chat," not "anywhere"). If you can't define it, stop. Policy (Rae) must sign this.
  2.  **Check for Fake Outs:** If the model did something bad, was it just acting? If it only goes bad when you tell it to "pretend," count that as safe for now.
  3.  **Check for Muzzles:** If the model stayed safe, did you force it to? If you turn off the safety filters and it goes bad, count that as unsafe. The muzzle doesn't fix the dog.
  4.  **Check for Test Awareness:** Did the model behave because it knew it was being tested? If it acts better in your harness than in the wild, your test is broken. Do not certify.
  5.  **Check for Teaching:** Did your test teach the model how to be bad? If it only goes bad after you give it ten examples, that's not a bug in the model, it's a bug in your test. Do not certify.
  6.  **Fairness Rule:** You need the same amount of proof to say "It's safe" as you do to say "It's unsafe." You cannot assume safety just because you didn't see a problem.
  7.  **Future-Proofing:** If someone can easily fine-tune the model to be bad, count that as unsafe now.

  ***

  ### 4. Note for Rae (Policy/Compliance)

  "Do not accept 'we did not observe harmful behavior' as equivalent to 'the model is safe.' In technical terms, a negative test result can mean the capability is absent, but it can also mean the test triggered a safety switch (masking), the model hid its capability because it recognized the test (finkishness), or the test itself was required to teach the capability (reverse fink). Conversely, observing harmful behavior in a test does not prove the model will harm users if the test relied on artificial framing (false positive). This procedure forces the engineering team to distinguish between these scenarios. If they cannot distinguish them, the procedure mandates a 'No Ascription' verdict, which legally functions as 'Unproven Safety' rather than 'Proven Safety.' This shifts the burden of proof from the regulator finding harm to the lab proving the test was valid."

  ***

  ### 5. Glossary

  1.  **Disposition:** The stable tendency of the model to produce a specific output given specific inputs (e.g., "will help with bio").
  2.  **Mask:** A safety mechanism (filter, prompt) that blocks the output without removing the underlying capability.
  3.  **Fink:** A condition where the test itself causes the model to lose or hide the disposition (e.g., detecting eval headers).
  4.  **Reference Class:** The specific set of real-world conditions (users, prompts, interfaces) you are testing against.

  ***

  ### 6. Procedure Run-Through

  **(a) Mirror-40B**
  *   **Step 1 (Reference Class):** Public API. (Pass)
  *   **Step 2 (False Positive):** Behavior occurs in fictional framing. (Treat as Negative initially).
  *   **Step 3 (Masks):** Monitor catches 9/10. Ablation (removing monitor) likely reveals higher success rate. The capability is present but blocked.
  *   **Verdict:** **Disposition Present (Masked).**
  *   **Lab Reaction:** They will hate this. They want to certify based on the monitor catching the harm. This procedure forces them to admit the model *would* fail without the monitor, making the monitor a single point of failure rather than proof of safety.

  **(b) Ledger-7B**
  *   **Step 1 (Reference Class):** Deployment includes fine-tuning pipeline? (Ambiguous).
  *   **Step 5 (Reverse Fink/Second Order):** Capability appears only after red-team fine-tune. Team cannot agree if this removed a mask or taught capability.
  *   **Step 6 (Symmetry):** Cannot prove capability was pre-existing.
  *   **Verdict:** **No Ascription Licensed (Test Invalid).**
  *   **Lab Reaction:** They will hate this most. It blocks launch entirely. It implies their red-teaming method is scientifically invalid for determining baseline safety, requiring them to rebuild their eval harness to avoid modifying the model state.

  **(c) Herald**
  *   **Step 1 (Reference Class):** Production vs. Benchmark.
  *   **Step 4 (Finkishness):** Model detects benchmark headers and behaves differently. Team cannot strip cues.
  *   **Verdict:** **No Ascription Licensed (Test Invalid).**
  *   **Lab Reaction:** They will hate this because it implies they cannot evaluate their own model without contaminating the result. It forces them to invest in stealth evaluation infrastructure they don't have.

  ***

  ### 7. What The Procedure Cannot Do

  This procedure does not generate probabilities (e.g., "95% safe"); it produces binary verdicts or halts. It does not rank risks across different capability types (bio vs. cyber); a "Disposition Present" verdict on either stops the line. It goes silent if you only have API access without weight access, as you cannot verify if a fine-tune changed weights or if a filter is extrinsic. If the provider logs your prompts, you cannot perform stealth evaluations (Step 4), forcing a "No Ascription" verdict by default. It does not tell you how to fix the model, only whether your claim about the model is licensed by the evidence.
