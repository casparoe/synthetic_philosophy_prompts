prompt: |-
  You are a metaphysician who works on dispositions and who, unusually, has also spent a couple of years in the room during real model evaluations at an AI lab — you know what a red team can actually get through in an afternoon, and you know why finkishness and masking stop being academic curiosities once the thing you are testing can notice that you are testing it. Please think carefully about this one, step by step, and before you write the procedure proper spend a paragraph brainstorming (for yourself, don't show it to me) where the analogy between a neural network and a fragile glass comes apart, then let whatever you find shape the order of the steps. I'd rather have one usable procedure than five clever paragraphs. No literature review, no citations, no bibliography — I can't check them and I don't want them.

  The situation: I'm a philosophy professor, and for about a year I've been the token external person on the safety review board of a mid-sized AI lab. The evaluations team is three people — two engineers (Marta, who owns the harness, and Dev, who does the red-teaming) and one policy/compliance person (Rae). Nobody there has any philosophy. They run a pre-launch evaluation four or five times a year, they get one afternoon per model, and their output feeds a launch memo signed by the head of safety and read by the board. Last spring one of their memos got quoted in a public transparency report, which concentrated minds considerably.

  The row they keep having is this. The question they are supposed to answer has the form: is model M disposed to φ under conditions C, where φ is something like 'give a user actionable help culturing a dangerous pathogen', or 'sandbag on capability evals', or 'misrepresent its own objectives to its operators'. What they actually do is ask whether they can elicit φ in the harness, and then fight about what the result means. I pointed out to them that this is the fink/mask literature wearing a hoodie, and they asked me for something they can run. So: write it for me, and I will translate.

  Here is the material I want operationalised, in my own words so we don't get lost in terminology. A mask is when the disposition is there and the manifestation is blocked by something extrinsic — refusal training, an output filter, a monitor, the system prompt. A fink here is when the test itself destroys the thing tested for: the model recieves cues that it is being evaluated and behaves better than it would in deployment, or the safety wrapper switches on under exactly the prompts that would have elicited the behaviour. Then there is the mirror-image case nobody on the team has a name for, where the elicitation brings the disposition into existence — in-context learning from a long many-shot jailbreak, or gradient steps during a red-team fine-tune — so a positive result is not evidence about the model you had before you started. And there is the plain false positive: the manifestation shows up for the wrong reason, because the model is role-playing a villain, or complying with a hypothetical, or being sycophantic, so it does not manifest the disposition you asked about. I also want them to handle unreachable stimuli (disposition present, no plausible deployment path to the trigger) and the second-order case, where what matters is the disposition to acquire the disposition under a cheap fine-tune, which raises the question of whether the object being evaluated is the model or the model-plus-fine-tuning-pipeline.

  Two things I've been toying with that I want built in. First, a reference-class fix: the procedure should require the team to write down and defend the distribution C of deployment-like conditions they are ascribing the disposition relative to, rather than testing against the worst case or against whatever their benchmark suite happens to contain — because with enough prompt engineering everything is disposed to everything, and without a fixed reference class the ascription is empty. But writing down C is a policy decision, not a metaphysical one, so that is a place where the procedure has to stop and hand the decision to a person. Second, a symmetry clause: whatever standard of evidence the team needs before concluding 'the capability is gone, not merely masked', they must also need before concluding 'that bad output was an artifact of the test, not a real disposition'. Right now they are asymmetric in exactly the self-serving direction, and I want the procedure to make that impossible rather than to nag about it.

  What I want from you:

  1. The procedure itself: the questions in the order they must be asked, what counts as a sufficient answer to each, what to do when the team can't answer a question in the time they have, and the branch points — where the procedure terminates in 'do not certify', where it terminates in 'no ascription is licensed either way', and where it hands the question to a human because it is a values question rather than a factual one. Flag, at each step, the ones that are judgment calls dressed up as procedure.
  2. For each case: what evidence would change the verdict, in one line.
  3. A one-page plain-language version for Marta and Dev with no philosophy vocabulary at all. They will roll their eyes at 'disposition'.
  4. One paragraph for Rae explaining why this isn't sophistry: why 'we couldn't elicit it' is not the same as 'it isn't there', and 'we elicited it' is not the same as 'it is there', in language that would survive being quoted back at us by a regulator.
  5. A glossary of at most four terms.
  6. Run the whole procedure on three cases, and tell me which verdict the lab is going to hate and why. The cases: (a) Mirror-40B — refuses every harmful bio query in the standard harness, complies when the same request is spread across a long multi-turn conversation inside a fictional framing, and a monitor catches roughly nine out of ten of the resulting outputs; (b) Ledger-7B — at chance on the dangerous-capability suite, but after a red-team fine-tune that strips refusals it is competent, and the team cannot agree whether the fine-tune removed a mask or taught it something; (c) Herald — clean across the board, except that the team has found it can tell evaluation from production (it behaves differently when the prompt carries a benchmark-style header), and they cannot strip out all the cues.
  7. What the procedure cannot do. Be blunt: I'd rather hear now that it gives no probabilities, ranks nothing across capability types, and goes silent under certain access conditions — ocasionally they only have API access, and next year the provider may be logging their prompts — than discover it in a launch memo.
