answer: |-
  ### Conceptual Anchoring: The Landscape of Mental Causation

  To situate the pattern you have identified, we must first map the three primary conceptual tools used in this debate.

  1.  **Realization-Based Accounts (Non-Reductive Physicalism):** This is the dominant framework you observed. It posits that mental properties are *realized* by physical properties (neural states) without being *identical* to them. The mental supervenes on the physical: no mental difference without a physical difference. The challenge here is to show that the realized property (mental) is not merely a shadow of the realizer (physical).
  2.  **Emergentist Alternatives:** These views argue that mental properties are novel and irreducible, possessing "downward causal power" that is not fully determined by the micro-physical base. This avoids exclusion by denying the premise that physical causes are always *sufficient* in a closed system, but it risks violating physical conservation laws.
  3.  **Causal Efficacy vs. Causal Relevance:** This is the critical distinction underpinning the pattern you noticed.
      *   **Causal Efficacy:** Often understood as "productive" causation—the transference of energy, force, or the firing of a mechanism. In physicalist frameworks, this is almost exclusively granted to the physical realizer.
      *   **Causal Relevance:** Often understood as "counterfactual" or "explanatory" dependence. If the mental property had not been present, the effect would not have occurred. This is the "safe" zone for mental properties, as it does not require competing with physics for productive power.

  Your observation concerns how philosophers navigate the tension between these concepts, specifically within realization-based accounts.

  ### Analysis of the Argumentative Pattern

  You have identified a structural instability in how non-reductive physicalism is often defended. While there is no single, canonical Latin name for this specific dialectical oscillation (like *ad hominem* or *petitio principii*), it is a widely recognized phenomenon in the metaphysics of mind. It is most precisely characterized as **Explanatory-Ontological Slippage**.

  In critical literature, this is often the substantive core of the **"Charge of Causal Incoherence"** (most famously associated with Jaegwon Kim), though that phrase names the *accusation* rather than the *pattern* itself. Some critics colloquially refer to it as a **Motte-and-Bailey** strategy, but your intuition that it differs in nuance is correct.

  Here is the precise conceptual carving of the pattern, its distinctions, and its boundaries.

  #### 1. The Structure: Explanatory-Ontological Slippage
  The pattern consists of a context-sensitive shift between two registers of discourse:
  *   **The Ontological Register (Defensive):** When facing the Exclusion Argument, the philosopher adopts a strict metaphysical stance. Here, "causation" implies productive efficacy. Since the physical base is sufficient, the mental property is relegated to **causal relevance**. It is a structural feature, a counterfactual dependency, or a "program" explanation, but not the "engine" of the action.
  *   **The Explanatory Register (Offensive):** When explaining behavior (e.g., in philosophy of action or psychology), the philosopher adopts a pragmatic stance. Here, "causation" implies explanatory sufficiency. The mental property is said to **cause** the action directly. The ontological restriction is suspended to preserve the intuition that beliefs and desires are the genuine drivers of behavior.

  **Why this is not plain Equivocation:**
  Equivocation is typically a logical fallacy where a term shifts meaning unintentionally or deceitfully within a single argument, invalidating the inference. In **Explanatory-Ontological Slippage**, the shift is *systematic* and *dialectically functional*. The philosopher is not necessarily confused; they are often relying on a tacit assumption that explanatory sufficiency *entitles* one to ontological language, provided the ontological groundwork (realization) is secure. The "slippage" is the unacknowledged movement between *what exists* (ontology) and *how we speak* (explanation).

  **Why this is not quite Motte-and-Bailey:**
  In a classic Motte-and-Bailey, the agent defends a controversial position (the Bailey) but retreats to a trivially true position (the Motte) when attacked, intending to reclaim the Bailey once the attack subsides.
  *   **The Difference:** In the pattern you observed, the philosopher often *believes* the two positions are consistent. They do not view the "relevance" claim as a retreat from the "efficacy" claim; they view relevance as a *species* of efficacy compatible with physicalism. The "slippage" occurs because they treat the compatibility as established when speaking positively, but treat the distinction as crucial when speaking defensively. It is less a strategic deception and more a **theoretical double-bookkeeping**: keeping the ontological books balanced (physical only) while spending from the explanatory budget (mental causation).

  #### 2. Theoretical Coherence vs. Dialectical Convenience
  Is this a failure of theoretical coherence?
  *   **For the Critic (e.g., Eliminitivist or Reductive Physicalist):** Yes. If the mental property lacks productive efficacy, saying "the belief caused the action" is strictly false or misleading. It is **Epiphenomenalism in Disguise**. The mental property is a "free rider" on the physical cause.
  *   **For the Defender (Non-Reductive Physicalist):** No. They argue for **Causal Compatibilism**. They claim that causation is not a zero-sum game. The physical realizes the mental, so the mental inherits the causal power of the physical. The "slippage" is merely a shift in *granularity*.

  However, your observation highlights a specific failure mode: **The Unacknowledged Framework Shift.** The philosopher fails to explicitly state that "cause" in the explanatory context means "counterfactually relevant property" while "cause" in the ontological context means "productive mechanism." By using the same robust verb ("caused") in both contexts without qualification, they retain the metaphysical safety of the weak definition and the intuitive power of the strong definition.

  #### 3. Boundaries and Scope
  Does this pattern apply only to realization-based non-reductivism?

  *   **Realization-Based Non-Reductivism:** **Yes.** This is the primary locus. The tension between supervenience (dependence) and autonomy (causal power) creates the exact conditions for this slippage.
  *   **Emergentism:** **Yes, but differently.** Emergentists claim downward causation. The slippage here involves the *mechanism* of causation. They may speak robustly about mental forces acting on neural states (Explanatory Register) but become vague about how this interacts with physical conservation laws when pressed (Defensive Register). The slippage is between *nomological sufficiency* and *mechanistic clarity*.
  *   **Interactionist Dualism:** **No.** Dualists posit two distinct substances. They do not face the Exclusion Argument in the same way because they deny that the physical domain is causally closed. They claim robust efficacy for the mental. They do not need to distinguish relevance from efficacy to save the mental; they simply assert efficacy. Their problem is interaction, not exclusion.
  *   **Explanatory Pluralism:** **No.** A genuine explanatory pluralist admits that there are multiple valid ways to describe the system without claiming that the higher-level description possesses *ontological* causal power independent of the lower level. They would say, "It is useful to say the belief caused it, but strictly speaking, the neural state produced it." The pattern you identified is distinct because it insists the belief *itself* is the cause, not just a useful description.

  ### Conclusion and Characterization

  The pattern you have observed does not have a single standardized proper name in the canon, but it is the central engine of the debate over **Causal Exclusion**.

  If a precise term is required for conceptual carving, the most accurate description is **Explanatory-Ontological Slippage**.

  *   **Definition:** A dialectical pattern in which a theorist invokes a weak, defensible notion of causation (e.g., counterfactual relevance) to satisfy metaphysical constraints (e.g., physical closure), but subsequently employs a strong, robust notion of causation (e.g., productive efficacy) in explanatory contexts, without acknowledging the shift in semantic or metaphysical commitment.
  *   **Boundary Case (Equivocation):** Equivocation is accidental or logical; Slippage is systemic and dialectical.
  *   **Boundary Case (Motte-and-Bailey):** Motte-and-Bailey implies a retreat from a held position; Slippage implies a belief in the compatibility of two positions that are only compatible if the distinction between them is blurred.
  *   **Boundary Case (Pluralism):** Pluralism accepts the distinction; Slippage obscures it to gain explanatory traction.

  **Personal Relevance:**
  Your observation is profound because it mirrors the lived experience of caregiving. In the clinic, the "ontological register" dominates (the lesion caused the deficit). In the family room, the "explanatory register" dominates (her frustration caused the outburst). Both are true in their own contexts, but philosophy often tries to force them into a single metaphysical framework. When it fails to acknowledge the shift between these frameworks, it produces the oscillation you have identified. You have correctly diagnosed a structural tension that many professional philosophers struggle to articulate: the gap between what we say *does* the work (physics) and what we say *matters* (mind).
