answer: |-
  There is no single, canonical philosophical term that captures *exactly* this specific rhetorical mechanism (forward-looking arguments gaining weight solely due to past investment, without citing that investment).

  However, in behavioral economics and organizational psychology, this is a recognized sub-mechanism of **Escalation of Commitment**, driven by **Motivated Reasoning**.

  If you need a word to use in a meeting to name this dynamic, the most precise descriptive term is **"Implicit Sunk Cost Weighting"** (or **"Latent Sunk Cost Revaluation"**).

  Here is the breakdown of the concepts, why the standard terms don't quite fit, and how to distinguish this from genuine learning.

  ### 1. The Closest Established Concepts

  **The Behavior: Escalation of Commitment**
  This is the umbrella term for "throwing good money after bad." However, *Escalation of Commitment* describes the **decision** to continue, not the **argumentative shape** you are observing. Your team is exhibiting escalation, but you want the name for the *logic* they are using to justify it.

  **The Psychology: Motivated Credulity**
  This is a specific form of *Motivated Reasoning*.
  *   **Motivated Skepticism:** You scrutinize arguments that contradict your desired conclusion.
  *   **Motivated Credulity:** You accept arguments that support your desired conclusion with little scrutiny.
  *   **The Shift:** On Day 1, the desired conclusion was "Don't start risky projects." The "reusable model" argument was met with *skepticism*. In Month 7, the desired conclusion (subconsciously) is "Justify the time we already spent." The exact same argument is now met with *credulity*. The data didn't change; the **motivation to believe the data** changed.

  **The Driver: Commitment Consistency (Cialdini)**
  Humans have a deep psychological need to appear consistent with their past actions. Admitting the project should be killed implies the past 2 quarters were a mistake. To avoid this cognitive dissonance, the brain subconsciously inflates the value of any future benefit that allows the past to be seen as "investment" rather than "waste."

  ### 2. The Specific Phenomenon: "Implicit Sunk Cost Weighting"

  Since there isn't a single Latin phrase for this, I recommend using **Implicit Sunk Cost Weighting**.

  **Definition:** A decision-making bias where past investment (sunk costs) is not cited as a reason to continue, but silently lowers the threshold of evidence required to justify continuation. Forward-looking benefits that were previously deemed insufficient are revalued as decisive solely because rejecting them would render the past investment a loss.

  **Why this fits your scenario:**
  *   **The money never enters the argument:** Correct. In *Explicit* Sunk Cost Fallacy, someone says, "We can't stop, we spent $1M." In *Implicit* Weighting, they say, "The data model is reusable" (which was true when the $1M was unspent, but didn't matter then).
  *   **The weight shifts:** The "reusable model" argument didn't get stronger; the **hurdle rate** for viability got lower.
  *   **Whack-a-mole arguments:** Because the driver is psychological (dissonance reduction) rather than logical (new evidence), knocking down one argument doesn't resolve the drive to continue. The brain simply grabs the next available forward-looking justification.

  ### 3. How to Distinguish It (The "Dev Test")

  You asked how to tell this apart from **Escalation of Commitment** generally, and from **Genuinely Learning Something**.

  | Feature | Textbook Sunk Cost Fallacy | **Implicit Sunk Cost Weighting** (Your Scenario) | Genuine Learning / Pivot |
  | :--- | :--- | :--- | :--- |
  | **Argument Used** | "We spent X, we must finish." | "Future benefit Y justifies continuing." | "We discovered Z, which changes the math." |
  | **Past Cost** | Explicitly cited as the reason. | **Never cited, but drives the urgency.** | Acknowledged as sunk, ignored for decision. |
  | **Evidence Status** | Old evidence ignored. | **Old evidence revalued.** | New evidence introduced. |
  | **Day 1 Reaction** | N/A | **"That benefit isn't worth the cost."** | **"We didn't know this was possible."** |
  | **Concession** | Rarely concedes. | **Moves to next argument if one is debunked.** | Updates model if math doesn't work. |

  **The "Day 1 Test":**
  Ask the team: *"If we knew on Day 1 exactly what we know now about the reusable data model and the integrations, would we have started the project?"*
  *   If the answer is **"No"**, but they still want to continue now: It is **Implicit Sunk Cost Weighting**.
  *   If the answer is **"Yes"**, then it is possible they genuinely learned that the scope is wider than expected (though this is rare in your description).

  ### 4. How to Use This in a Meeting

  Don't use the word "fallacy" or "bias" immediately; it makes people defensive. Instead, name the *mechanism* objectively.

  **Script:**
  > "I'm noticing a pattern I'd call **Implicit Sunk Cost Weighting**. The forward-looking reasons we're discussing (reusable models, stranded integrations) are valid, but they existed on Day 1. At that time, we decided they weren't enough to justify the cost.
  >
  > The only variable that has changed is the investment we've already made. That investment is silently lowering our hurdle rate for what counts as 'viable.' If we can't justify this project without counting the time we've already spent as a reason to continue, we should kill it. If we *can* justify it, we should be able to do so using only Day 1 information."

  **Why this works:**
  1.  It validates their arguments (they aren't lying about the data model).
  2.  It isolates the variable (the *weight* of the argument, not the truth of it).
  3.  It forces a "Day 1 Reset" mental model, which bypasses the psychological commitment to the past.

  ### Summary
  *   **Broad Behavior:** Escalation of Commitment.
  *   **Cognitive Mechanism:** Motivated Credulity / Commitment Consistency.
  *   **Specific Argument Pattern:** **Implicit Sunk Cost Weighting** (or **Latent Sunk Cost Revaluation**).
  *   **Key Differentiator:** Old evidence is being revalued without new information, driven by a silent desire to avoid validating a past loss.
