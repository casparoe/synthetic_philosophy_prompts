answer: |-
  **QUALIALAND**

  **Entry Requirements & The Sanborn-Chase Audit**
  Upon arrival at Port Physicalista, visitors must submit to the Sanborn-Chase Incoherence Audit. This mandatory screening ensures all incoming phenomenological reports are functionally grounded. Border agents will present you with two identical stimuli (usually lukewarm coffee or medium-red swatches) and ask for a qualitative differentiation. 

  Do not attempt to cite "private access" or "inner glow." Claims of ineffable experience are treated as visa violations. To pass, you must demonstrate that your discriminatory behavior tracks physical variance rather than alleged subjective shifts. If you insist that your taste buds remained constant while your standards shifted (or vice versa) without functional evidence, you will be detained for ontological smuggling. Successful applicants receive a Third-Person Verification Stamp, valid for 90 days of behaviorist-compliant tourism.

  **Local Customs: Phenomenal Bankruptcy**
  Citizens who persist in claiming causal inertness—insisting their pain matters despite no nociceptor firing—are subject to public Phenomenal Bankruptcy hearings. Held weekly in the Town Square of Eliminativism, these proceedings determine if an individual's subjective inventory exceeds their physicalist assets. 

  If a citizen cannot map their first-person data to neural states, they are declared ontologically insolvent. The court issues a discharge order, legally voiding their capacity to report on "what it is like" to be them. While harsh, locals view this as a mercy; it relieves the burden of maintaining a private theater that no one else can see. Tourists are advised not to witness these hearings unless prepared to have their own color perceptions calibrated by state optometrists.

  **Sidebar: National Holiday**
  **Ontological Discharge Day (October 14)**
  Celebrating the anniversary of the Great Quining, this holiday marks the removal of the "ghost in the machine." Festivities include the burning of personal diaries (deemed unreliable data) and the Parade of Isomorphs, where citizens march in perfect functional synchronization. Traditional foods are nutrient-dense pastes designed to bypass gustatory pleasure centers. Visitors are expected to participate in the Silence of the Subjective, a minute of quiet where no internal states are acknowledged. Note: Smiling without facial muscle activation is considered a counterfeit behavior and may incur a fine.

  **Practical Tips**
  *   **Language:** Avoid indexicals like "this" or "here" when referring to sensations. Use coordinate space and wavelength measurements instead.
  *   **Currency:** The local dollar is pegged to joules of energy expended. Tips based on "generosity" are not accepted; calculate service fees based on mechanical output.
  *   **Safety:** If you feel dizzy, do not say "I feel dizzy." Report "vestibular system malfunction." Medical staff will not respond to qualia-based distress signals.

  **Getting Around**
  Public transport is efficient but lacks scenic value, as "beauty" is classified as a projection error. Stick to the grid. Wandering off-path in search of "authentic experience" often leads to the Zone of Private Comparison, a restricted area where tourists attempt to match their red with locals' red. These conflicts are never resolved and usually end in administrative dissolution. Remember: in Qualialand, if it doesn't cause a difference, it doesn't exist. Pack accordingly.
