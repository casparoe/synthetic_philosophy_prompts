      *   **Task 1 (Theory Application):** Map what hindsight bias/narrative fallacy predicts historians/readers will do (compression, inflation of triggers, inevitability of timetables, intent vs. interaction). Explain historiographical swings (guilt vs. no one) and the growth of inevitability narratives.
      *   **Task 2 (Theory Limitations):** Identify where the theory breaks. Acknowledge real structure (Schlieffen Plan, self-interested decisions). Distinguish distortion from signal. How to tell the difference?
      *   **Task 3 (Remedies):** Assess contingency-focused history (writing "as if" in July 1914). Does this debias or invert bias (manufacturing arbitrariness)? Apply concretely to 1914.
      *   **Task 4 (Meta-Assessment):** What does this case show about the theory? Confirmation, anomaly, or unanticipated case? Can bias-correction be built into method?
      *   **Constraint:** Reach a conclusion and defend it. No non-committal ending.

  2.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Define hindsight bias (knowing the outcome distorts perception of probability) and narrative fallacy (imposing a story structure on random/complex events). State the thesis: The historiography of 1914 is a prime example of these cognitive traps, but the traps themselves contain a kernel of truth about structural constraints. The remedy lies not in denying structure but in acknowledging the *fragility* of that structure.

      *   **Section 1: The Prediction (Theory Mapping):**
          *   *Concept:* Hindsight bias makes the probable seem inevitable. Narrative fallacy turns a mess into a plot.
          *   *Application to 1914:* The month of July was chaotic. Hindsight turns it into a domino effect.
          *   *The Trigger:* Sarajevo wasn't inherently a world war trigger; it became one *because* of the war. Hindsight inflates its importance.
          *   *The Timetables:* The Schlieffen Plan looks like a machine in retrospect. In July, it was a option that became a prison.
          *   *Historiography:* Why the swing? If the outcome is catastrophic (WWI + WWII), we need a villain (Versailles/Fischer). If the outcome is seen as a tragedy of errors (Clark), we need sleepwalkers. Both are narrative attempts to resolve cognitive dissonance. The "inevitability" grows as the body count rises in our memory.

      *   **Section 2: The Limit (Where Theory Breaks):**
          *   *Concept:* Not everything is bias. Some things are real constraints.
          *   *Application:* The Schlieffen Plan *was* rigid. Mobilization *did* mean war in that context. Germany *did* push Austria. This isn't just story-telling; it's archival signal.
          *   *Distinction:* How to tell bias from signal? Signal is corroborated by contemporary documents showing *intent* and *constraint* at the time, not just logical fit with the outcome. Bias ignores failed alternatives that were plausible then. Signal acknowledges the narrowness of the corridor.
          *   *Nuance:* The "Sleepwalkers" argument can also be a narrative fallacy (the tragedy narrative).

      *   **Section 3: The Remedy (Contingency & Counterfactuals):**
          *   *Concept:* Writing "as if" the future is unknown.
          *   *Assessment:* Does it work? It helps recover agency. It stops the "march of fate."
          *   *Risk:* It can over-correct. If you emphasize contingency too much, you make history look random. "Anything could have happened" is as false as "This had to happen."
          *   *Application to 1914:* A contingency history shows Grey could have been clearer, or Wilhelm could have stopped Austria. But it must admit that *given* the alliances and military tech, the margin for error was razor-thin. It's not about manufacturing arbitrariness, but measuring the *width* of the path.

      *   **Section 4: Meta-Assessment & Conclusion:**
          *   *Question:* What does 1914 say about the theory?
          *   *Analysis:* It confirms the theory's power (we *cannot* stop telling the story as a tragedy or a crime), but it shows the theory is insufficient without structural analysis.
          *   *Bias Correction:* Can it be built into method? Yes, but not by eliminating narrative (impossible). It must be built by *multiplying* narratives (counterfactuals) and explicitly marking where the outcome influenced the weighting of evidence.
          *   *Final Verdict:* The historiography of 1914 is a confirmation of the bias, but the *best* history uses the bias as a diagnostic tool. We cannot escape the narrative fallacy, but we can make it self-aware.

  3.  **Refining and Polishing:**

