answer: |-
  A workable diagnostic theory must define sphexishness as a failure of hierarchical goal-interruptibility detectable through override interventions, rather than as behavioral rigidity or lack of explicit representation.

  ### Desiderata for a Diagnostic Theory

  1.  **Precondition Validation:** The system must verify the continued satisfaction of a step's preconditions before execution, not merely upon entry.
      *   *Motivation:* Distinguishes the **wasp** (fails to check prey location after inspection) and **LLM** (fails to check presuppositions) from the **thermostat** (checks temperature continuously).
      *   *Status:* **Non-negotiable.** Without this, any loop is indistinguishable from a control cycle.

  2.  **Hierarchical Overrideability:** The system must permit higher-order goals to interrupt or abort lower-order routines when conflicts arise, unless the higher goal is itself the fixed point.
      *   *Motivation:* Distinguishes the **resourceful addict** (flexible means, fixed end, cannot override end) from the **promise-keeper** (fixed end, but can override if a higher principle conflicts) and the **frontal-damage patient** (stimulus drives action, no top-down inhibition).
      *   *Status:* **Non-negotiable.** This is the core differentiator between compulsion and commitment.

  3.  **Nested Rigidity Tolerance:** The system may exhibit rigidity at level *N* provided it demonstrates flexibility at level *N+1* regarding the selection or abandonment of the level *N* routine.
      *   *Motivation:* Accommodates the **game-playing program** (book-rigid opening, search-flexible strategy) and prevents false positives on optimized sub-routines.
      *   *Status:* **Non-negotiable.** Finite agents cannot be flexible at all levels simultaneously.

  4.  **Intervention Stability:** System performance should not degrade significantly when forced into explicit, step-by-step control modes under pressure.
      *   *Motivation:* Captures the **skilled performer choking** (reversion to explicit control causes failure) versus the **unarticulating expert** (maintains performance despite inability to articulate).
      *   *Status:* **Preference (Engineering Camp).** Philosophical accounts may ignore performance degradation, but autonomy stacks cannot.

  5.  **External Signature of Commitment:** The system must demonstrate a differential response to valid versus invalid override requests (e.g., emergency stops vs. arbitrary noise).
      *   *Motivation:* Distinguishes the **compulsive checker** (ignores valid reasons to stop) from the **principled official** (accepts valid higher-order overrides).
      *   *Status:* **Non-negotiable.** Required for black-box assessment of "will" versus "cannot."

  ### Unsettled Distinctions

  1.  **Respect vs. Collapse:**
      *   **Respect Grading:** Sphexishness must be graded (degree of insensitivity), not binary. A system that recovers after three loops is less sphexish than one that loops forever. Binary verdicts fail the **game-playing program** (rigid only sometimes).
      *   **Collapse Mechanism/Environment:** Sphexishness is a property of the *pair*. The **wasp** is not sphexish in a static world; the theory must treat the failure as relational.
      *   **Collapse Behavior/Mechanism:** For diagnostic review, these must collapse. If the **promise-keeper** and the **compulsive checker** behave identically under all valid override interventions, they are functionally equivalent for safety certification, regardless of internal "freedom."

  2.  **Incompatible Desiderata:**
      *   **External Assessability vs. Principled Steadfastness:** These cannot be jointly satisfied if "principled" implies inaccessible internal reasons. They coexist *only* if "principled" is operationalized as "responsive to valid higher-order overrides." If a system never accepts an override, it is diagnostic sphexishness, regardless of claimed principle.
      *   **Black-Box Access vs. Mechanism-Level Criteria:** You cannot directly grade the mechanism. You must use behavioral proxies (e.g., latency spikes indicating deliberation vs. immediate looping). This pair is satisfiable only if the theory accepts proxies as sufficient evidence.

  3.  **Single Requirement Doing the Most Work:**
      *   **Hierarchical Overrideability.** Your ranking survives: the **resourceful addict** is the critical case because it destroys purely behavioral counterfactual tests (the addict passes "can you do something different?" by taking a detour) and the **promise-keeper** destroys "rigidity = absence of alternatives." Overrideability forces the reviewer to probe *why* the action stopped or continued, not just *if* it changed. It leaves standing a diagnostic based on *teleological sensitivity* rather than kinematic flexibility.

  ### Scorecard

  *   **Intervention-sensitivity:** Fails (cannot distinguish addict from agent); **Explicit goal representation:** Fails (excludes unarticulating expert); **Reasons-responsiveness:** Passes (captures nuance) but requires operationalized override tests for black-box use.
