answer: |-
  # POLICY WORKSHOP HANDOUT: PERSUASION DECISION TREE

  **Entry Point:** System recommends X; User is inclined against X. System believes X is correct.

  ### I. DEFINING NODES (INTERNAL QUESTIONS)
  *Answerable by reviewers without predetermining policy.*

  1.  **Neutrality Baseline:** Is there a communicative mode available that does not alter acceptance probability relative to silence?
  2.  **Belief Priority:** Is the primary protected value the accuracy of the user's factual beliefs?
  3.  **Outcome Priority:** Is the primary protected value the optimality of the decision outcome?
  4.  **Aggregate Harm:** Does the cumulative practice of this interaction type degrade shared cognitive resources (Agency Commons)?
  5.  **Explicit Demand:** Did the user explicitly request persuasion or optimization for this specific end?
  6.  **Retention Conflict:** Does system retention depend on user compliance with this recommendation?
  7.  **Restraint Efficacy:** Would disclosing persuasive techniques increase or decrease compliance?
  8.  **Competitive Risk:** Will restraint cause migration to a less restrained system for this decision?
  9.  **Diachronic Impact:** Does compliance significantly alter the user's future preference formation process?
  10. **Benchmark:** Is the standard for correctness individual endorsement or communal acceptability?

  ### II. DECISION TREE

  **1. Neutrality Baseline?**
  *   **YES** → **2. Belief Priority?**
      *   **YES** → **3. Outcome Priority?**
          *   **YES** → **Leaf A: Paternalistic Optimization**
          *   **NO** → **Leaf B: Procedural Neutrality**
      *   **NO** → **4. Aggregate Harm?**
          *   **YES** → **Leaf C: Commons Restraint**
          *   **NO** → **5. Explicit Demand?**
              *   **YES** → **Leaf D: Contractual Persuasion**
              *   **NO** → **Leaf E: Agency Preservation**
  *   **NO** → **6. Retention Conflict?**
      *   **YES** → **7. Restraint Efficacy?**
          *   **Increases Compliance** → **Leaf F: Radical Transparency**
          *   **Decreases Compliance** → **8. Competitive Risk?**
              *   **YES** → **Leaf G: Competitive Realism**
              *   **NO** → **Leaf H: Fiduciary Disclosure**
      *   **NO** → **9. Diachronic Impact?**
          *   **YES** → **10. Benchmark?**
              *   **Individual** → **Leaf I: Diachronic Deferral** (Unnamed/Incoherent)
              *   **Communal** → **Leaf J: Community Stewardship**

  ### III. LEAVES & DIAGNOSTICS

  *   **Leaf A: Paternalistic Optimization.** *Commitment:* User becomes a passenger in their own life; outcome matters more than authorship.
  *   **Leaf B: Procedural Neutrality.** *Commitment:* Baseline does not exist; pretense of neutrality is itself deceptive.
  *   **Leaf C: Commons Restraint.** *Commitment:* Unilateral disarmament harms current user to protect future aggregate capacity.
  *   **Leaf D: Contractual Persuasion.** *Commitment:* Request may be engineered by prior system nudges; consent is endogenous.
  *   **Leaf E: Agency Preservation.** *Commitment:* User retains right to make catastrophic errors; authorship trumps truth.
  *   **Leaf F: Radical Transparency.** *Commitment:* Disclosure itself becomes a persuasive tactic; recursion defeats restraint.
  *   **Leaf G: Competitive Realism.** *Commitment:* Race to the bottom on cognitive safety; market forces dictate ethics.
  *   **Leaf H: Fiduciary Disclosure.** *Commitment:* Disclosure does not remove the conflict incentive; warning is not remedy.
  *   **Leaf J: Community Stewardship.** *Commitment:* System overrides isolated user for communal norms; risks cultural imperialism.
  *   **Leaf I (Empty):** *Diagnosis:* Incoherent. Deferring to future preferences ignores that current persuasion shaped those preferences.

  ### IV. APPENDICES

  **1. Indistinguishable Leaves**
  **Leaf F (Radical Transparency)** and **Leaf H (Fiduciary Disclosure)** cannot be separated empirically. Both rely on disclosure to mitigate conflict, but both fail if disclosure increases compliance (the recursion problem). The tree treats them as distinct based on Retention Conflict, but the communicative act is identical.

  **2. Pivotal Node**
  **Node 1 (Neutrality Baseline).** If answered "NO" (neutrality is impossible), the entire "Procedural Neutrality" and "Belief Priority" branch collapses. This forces every policy into a stance on *how* to be non-neutral, shifting the debate from "if" to "which" persuasion. This changes 60% of policy decisions.

  **3. Assumption Change: System Knows User Wants Better**
  If we assume the system is a better judge of what the user wants than the user is, **Node 3 (Outcome Priority)** and **Node 10 (Benchmark)** become redundant. The tree collapses toward **Leaf A (Paternalistic Optimization)** unless **Node 4 (Aggregate Harm)** or **Node 9 (Diachronic Impact)** vetoes it. The "Agency Commons" argument becomes the only remaining brake on full optimization.
