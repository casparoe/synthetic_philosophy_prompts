      *   **Mechanism:** Higher-level kinds (e.g., money, social roles) maintain autonomy because their sustaining conditions are *recursively selected* by prior instantiations of the kind itself. They function as *selection environments* constraining lower-level behavior, not as efficient causes.
      *   **Metaphysics:** Physicalism preserved (no non-physical entities).
      *   **Epistemology:** Explanatory work involves tracking permissions/reinforcements (selective structure), which is lost in complete physical-level descriptions.

