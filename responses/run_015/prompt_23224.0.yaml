answer: |-
  You have hit on one of the most common and confusing paradoxes in quantitative finance. Your logic is sound: **if a strategy leads to ruin, it cannot maximize long-run growth.**

  The short answer is: **The claim that "Full Kelly almost surely leads to ruin" is mathematically false in the idealized model, but practically true in the real world due to estimation error and market frictions.**

  You aren't missing a subtlety in the math; you are encountering a collision between **theoretical optimality** and **practical robustness**. Here is the breakdown of why this confusion exists and where the "ruin" claim actually comes from.

  ### 1. The Mathematical Reality: Full Kelly Does Not Hit Zero
  In the standard, idealized Kelly model (discrete binary bets with known probabilities), **you never go broke.**

  If the Kelly fraction is $f^*$, you bet that portion of your bankroll and keep $(1 - f^*)$ in cash. Since $0 < f^* < 1$ (assuming you don't have a 100% certain edge), you always retain a non-zero fraction of your wealth.
  *   If you lose, your wealth becomes $W_{new} = W_{old} \times (1 - f^*)$.
  *   No matter how many consecutive losses you suffer, $W$ approaches zero asymptotically but never equals zero.

  Furthermore, under Full Kelly, your wealth $W_t$ converges to infinity almost surely as $t \to \infty$. The long-run geometric growth rate is maximized. So, in the vacuum of the mathematical proof, your intuition is correct: Full Kelly is optimal, and it does not lead to ruin.

  ### 2. So, Where Does the "Ruin" Claim Come From?
  If the math says you're safe, why does every experienced trader warn that Full Kelly leads to ruin? There are three specific reasons, ranging from semantic to catastrophic.

  #### A. "Ruin" as Massive Drawdown (Psychological Ruin)
  While Full Kelly doesn't hit mathematical zero, it guarantees **arbitrarily large drawdowns** over an infinite time horizon.
  As $T \to \infty$, the probability that your bankroll will drop to 10%, 1%, or 0.1% of its previous peak approaches 100%.
  *   **The Math:** The volatility of the log-wealth path under Full Kelly is high.
  *   **The Reality:** If you are trading real money, seeing your account drop 80% (which is common with Full Kelly) often forces traders to quit. If you quit, your growth rate becomes zero. In this sense, Full Kelly leads to "ruin" of the *trader*, even if the *strategy* survives.

  #### B. The "Over-Kelly" Cliff (Estimation Risk)
  This is the most critical point. The Kelly formula requires **true** probabilities and payoffs.
  $$ f^* = \frac{p(b+1) - 1}{b} $$
  In the real world, you do not know $p$ (win probability) or $b$ (payoff). You only have estimates.
  *   **The Symmetry of Error:** If you underestimate your edge, you bet "Under-Kelly." You grow slower, but safely.
  *   **The Danger:** If you **overestimate** your edge even slightly, you bet "Over-Kelly."
  *   **The Consequence:** Once you cross the Full Kelly threshold into Over-Kelly territory, the expected log-growth rate **turns negative**. If you consistently bet more than the Kelly fraction, **you will almost surely go to zero.**

  Because it is human nature to be overconfident in our edges, betting "Full Kelly" based on *estimated* parameters is statistically likely to be "Over-Kelly" in reality. Therefore, practitioners treat "Full Kelly" as synonymous with "dangerous overbetting."

  #### C. Continuous Markets and Liquidation (True Ruin)
  The idealized Kelly model assumes discrete bets where you cannot lose more than you wager. Real trading often involves:
  1.  **Leverage:** Kelly might suggest 2x leverage. If the asset gaps down overnight, you can be liquidated before you can rebalance.
  2.  **Continuous Prices:** In continuous time (Geometric Brownian Motion), if you are levered, a sufficiently large move can wipe you out completely ($W=0$) before you can adjust.
  3.  **Transaction Costs:** Friction eats into the geometric mean. Full Kelly leaves no margin for costs; Over-Kelly leaves negative margin.

  ### 3. Reconciling "Optimal" with "Dangerous"
  You asked: *"Is there some subtlety about what optimal means?"*

  Yes. "Optimal" is always relative to an **objective function**.
  *   **Kelly Optimality:** Maximizes $E[\log(W_T)]$. This maximizes the median terminal wealth and the long-run compound growth rate.
  *   **Expected Value Optimality:** Maximizes $E[W_T]$. This strategy is to bet 100% of your bankroll on every positive EV bet. This yields the highest *arithmetic* mean wealth, but almost surely leads to ruin (because one loss wipes you out).

  Kelly is the boundary between growth and ruin. It is the maximum growth point *before* the risk of ruin (in the Over-Kelly sense) sets in.

  ### 4. The Solution: Fractional Kelly
  Because of the "Estimation Risk" (Point 2B above), almost no professional traders use Full Kelly. They use **Fractional Kelly** (e.g., Half-Kelly).

  *   **Growth:** Half-Kelly delivers 75% of the expected growth rate of Full Kelly.
  *   **Volatility:** Half-Kelly delivers only 50% of the volatility (drawdowns).
  *   **Safety:** It provides a massive buffer against parameter estimation error. You can be significantly wrong about your edge and still remain in the "safe" (Under-Kelly) zone.

  ### Summary
  You are not missing a mathematical subtlety. The claim you read is a **practical heuristic** masquerading as a mathematical theorem.

  1.  **Mathematically:** Full Kelly on known probabilities does **not** lead to ruin ($W=0$). It maximizes long-run growth.
  2.  **Practically:** Full Kelly on *estimated* probabilities often leads to Over-Kelly betting, which **does** lead to ruin.
  3.  **Psychologically:** Full Kelly leads to drawdowns so severe that most humans cannot stick to the strategy, effectively causing them to abandon the growth.

  The "wall" you are hitting is the realization that **maximizing growth rate is not the same as maximizing survival probability.** In trading, survival is a prerequisite for growth. That is why the "optimal" theoretical strategy is suboptimal in practice, leading everyone to use Fractional Kelly.
