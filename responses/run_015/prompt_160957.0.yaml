answer: |-
  **TO:** Board of Visitors, Halloway College
  **FROM:** Collections and Commemoration Committee
  **DATE:** February 14, 2024
  **SUBJECT:** Recommendation Regarding Pell Family Gift Agreement

  **Bottom Line Recommendation**
  The Committee recommends the Board authorize acceptance of the Pell family gift *only* upon renegotiation of the interpretive control clause. We cannot sign the agreement as currently written. The $6M endowment is vital, but the requirement for perpetual donor approval over wall text and labels compromises the College's academic freedom and institutional integrity. We propose a sunset clause on donor approval rather than a perpetual veto.

  **The Gift and The Constraint**
  The Pell family offers $6M to construct and endow the "Pell Heritage Room," displaying administrative records from 1871 to 1954. This includes both foundational documents (founding charter, early co-education records) and damaging evidence (exclusion of Black applicants, dismissal of pacifist faculty). 

  The legal constraint is specific: Section 4(b) of the draft agreement requires that all interpretive material carry descriptions affixed at installation. Any future changes to labels, audio guides, or website copy require written approval from Pell descendants *in perpetuity*. General Counsel confirms this clause is enforceable; breach triggers return of funds. This creates a permanent external veto over how the College narrates its own history. While donor recognition is standard, permanent control over historical interpretation is not. It risks accreditation concerns regarding institutional autonomy and invites future litigation if student or faculty protest renders the exhibit untenable.

  **Analysis of the "Rolling Seal" Proposal**
  Head Archivist Maren Osei proposes a "rolling seal": the most damaging forty items exhibit for twenty years, then seal for twenty, cycling indefinitely. Her argument is pedagogical: permanent display of trauma produces numbness, not reckoning. A cohort encountering the ledgers fresh may engage more deeply than one desensitized by daily exposure.

  However, the Committee recommends against adopting the rolling seal as our primary negotiating position. While the insight about numbness is valid, the strongest version of this argument fails on two grounds. First, perception: in a climate demanding transparency, physically removing records of racial exclusion looks like censorship. The student government's resolution for full digitization indicates zero tolerance for perceived hiding. Second, legal risk: the current gift agreement mandates items be displayed with descriptions affixed at installation. A rolling seal violates the "permanent exhibition" spirit, if not the letter, giving the Pell lawyers grounds to reclaim funds immediately. We cannot accept the money and then immediately propose hiding the very documents the donors wish to highlight.

  **The Nietzsche Problem: Institutional vs. Human Life**
  Faculty member Dana Reinholt frames this using Nietzsche's *On the Use and Abuse of History for Life*, arguing the gift forces "antiquarian piety" while disabling the "critical mode." Nietzsche argues organisms need forgetting to live; too much history paralyzes action. 

  However, this frame breaks when applied to Halloway College. Nietzsche writes about human beings who die. An institution does not. The Board accepting this gift will not be the Board reviewing it in twenty years. For a human, forgetting is a biological necessity for survival. For a college, "life" means mission integrity across generations. If we institutionalize forgetting (via the rolling seal) or institutionalize static piety (via the donor clause), we undermine the critical continuity required for an immortal entity. "History in the service of life" for a college means "history in the service of truth," because only truth sustains legitimacy over centuries. We cannot outsource our conscience to a donor family, nor can we cyclical amnesia. We must steward without flinching.

  **Existing Memory Infrastructure**
  We must also recognize that the Pell Heritage Room is not our only act of remembering. Treating it as such inflates its stakes unnecessarily. We already operate a campus museum. We possess a 2019 Truth and Reclamation Report (though unacted upon). We maintain an oral history project. Starting next fall, a required first-year Legacy module will integrate this history into the curriculum. 

  The Heritage Room is a physical space, not the sum of our memory. This allows us to be flexible. If the Room becomes static due to donor constraints, the Legacy module can remain critical. However, relying on workarounds is poor governance. It is better to ensure the physical space remains aligned with our academic mission. The existence of other memory projects argues *against* accepting a compromised exhibit; we do not need a frozen monument when we have living curriculum.

  **Recommendation and Timeline**
  The Committee recommends the Board direct the Administration to negotiate the following condition before the March meeting:

  1.  **Remove Perpetual Approval:** Replace the "in perpetuity" approval clause with a ten-year review cycle. After ten years, the College retains sole authority over interpretive materials, provided core documents remain on display.
  2.  **Dynamic Interpretation:** Explicitly allow for updated wall text and digital guides to reflect new historical scholarship without donor veto.

  If the Pell family refuses these conditions, the Committee recommends declining the gift. $6M is significant, but not worth forty years of litigation risk or the appearance of sanitizing our racial history.

  **Implementation Schedule**
  *   **March 1:** Board votes on negotiation mandate.
  *   **March 15:** Administration presents counter-proposal to Pell representatives.
  *   **April 1:** Final decision on acceptance or declination.
  *   **Five-Year Review:** If accepted, a joint committee (Archives, Faculty, Student Gov) shall review the exhibit's interpretive efficacy every five years, reporting to the Board.

  We have the opportunity to fund financial aid while honoring our history. We cannot do both if we sign away the right to tell the truth about that history.

  \answer{Accept with negotiated conditions; perpetual donor approval}
