prompt: |-
  I am preparing a symposium presentation for an audience of comparative moral philosophers, legal scholars versed in post-war German constitutional doctrine, and cross-cultural moral psychologists who work with trolley-style judgment paradigms. My thesis is that German folk morality’s explicit orientation toward institutional rule-following—treating bureaucratic and legal norms as prima facie binding—exhibits greater resilience against moral corruption in collective decision contexts than American folk morality’s reliance on individual conscience and authenticity, but only if the German framework integrates a narrowly circumscribed conscience mechanism modeled on the jurisprudence surrounding Article 4 of the Basic Law rather than on American-style individualism. I contend that American “conscience” typically functions as an unregulated exit option that dissolves collective obligations, whereas the German Gewissensvorbehalt operates as an internal corrective within the rule system itself, permitting deviation only when the rule system’s own integrity is at stake. I need a prep sheet, not a defense: list the objections in the order they will likely come, phrase each as that specific interlocutor would phrase it—using the vocabulary they actually deploy, such as WEIRD sampling concerns, Normenkontrolle, moral luck, or the historical failures of ordered societies—then for each indicate what I should concede, what I must hold, and where my reply is weakest. Be sure to include the objection I hope nobody raises: namely, that my proposed synthesis collapses into a disguised version of the American position I reject, with advice on how to defend that vulnerability in under two minutes without relying on bibliographic citations or reading lists. Keep the format concise and tactical.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Audience:** Comparative moral philosophers, legal scholars (post-war German constitutional doctrine), cross-cultural moral psychologists (trolley-style paradigms).
      *   **Thesis:** German folk morality (institutional rule-following) is more resilient against moral corruption than American folk morality (individual conscience/authenticity), *provided* it integrates a narrowly circumscribed conscience mechanism (modeled on Basic Law Art. 4) rather than American individualism. American conscience = unregulated exit; German *Gewissensvorbehalt* = internal corrective for system integrity.
      *   **Task:** Create a prep sheet (not a defense). List objections in likely order, phrased by specific interlocutors using their jargon. For each: Concede, Hold, Weakest Point.
      *   **Specific Requirement:** Include the "hope nobody raises" objection (synthesis collapses into American position) with a 2-minute defense strategy (no citations).
      *   **Format:** Concise and tactical.

  2.  **Deconstruct the Audience & Jargon:**
      *   *Moral Psychologists:* WEIRD samples, trolley problems, deontological vs. consequentialist intuitions, situational variables, cultural priming.
      *   *German Legal Scholars:* Basic Law (Grundgesetz), Article 4 (Freedom of Faith/Conscience), *Gewissensvorbehalt*, *Normenkontrolle*, *Radbruch Formula*, duty to resist, institutional integrity.
      *   *Comparative Moral Philosophers:* Moral luck, particularism vs. universalism, corruption of institutions, agency, collective responsibility.
      *   *Historical Context:* Nazi Germany (failure of ordered societies), Cold War division, Reunification.

  3.  **Drafting Objections (Iterative Process):**

      *   *Objection 1 (Psychologist):* They will attack the empirical basis. "German folk morality" is a generalization. Trolley data might not scale to bureaucratic contexts.
          *   *Phrasing:* WEIRD sampling, ecological validity, situational affordances.
          *   *Strategy:* Concede limited empirical scope, hold the theoretical distinction.

      *   *Objection 2 (Legal Scholar):* They know the history. The "ordered society" argument is dangerous given the 1933-1945 period. Rule-following *was* the problem.
          *   *Phrasing:* *Radbruch Formula*, legal positivism, *Gleichschaltung*, substantive vs. procedural justice.
          *   *Strategy:* Concede the historical risk, hold that Art. 4 is the *fix* for that specific historical trauma.

      *   *Objection 3 (Philosopher):* Moral luck and corruption. Does following rules actually prevent corruption or just shift it?
          *   *Phrasing:* Moral luck, bureaucratic alienation, diffusion of responsibility.
          *   *Strategy:* Hold the resilience claim, concede the "alienation" risk.

      *   *Objection 4 (The "Hope Nobody Raises" - The Collapse Objection):* If you allow conscience (even German style), isn't it just individualism with extra steps?
          *   *Phrasing:* Normative convergence, disguised liberalism, substantive vs. procedural.
          *   *Strategy:* Focus on the *direction* of the burden of proof and the *locus* of justification.

  4.  **Refining the Content (Tactical & Concise):**

      *   *Order:* Start with empirical (Psych), move to historical/legal (German Scholar), then philosophical (Philosopher), end with the "Collapse" objection.
      *   *Tone:* Professional, sharp, ready for Q&A.
      *   *Constraints:* No bibliographic citations in the defense. Under 2 minutes for the specific defense.

  5.  **Drafting the Content (Mental Simulation):**

      *   *Psychologist:* "Your 'German folk morality' is a stereotype. Trolley data shows universal deontological constraints." -> *Concede:* Folk morality isn't monolithic. *Hold:* Institutional framing changes the *weight* of the constraint. *Weakness:* Lack of cross-cultural bureaucratic data.
      *   *Legal Scholar:* "You're ignoring the *Radbruch* moment. Rule following failed us." -> *Concede:* Positivism failed. *Hold:* Art. 4 is post-Radbruch; it's the immune system, not the virus. *Weakness:* Distinguishing 'system integrity' from 'regime survival'.
      *   *Philosopher:* "Moral luck. You're praising luck of birth in a stable system." -> *Concede:* Luck plays a role. *Hold:* Systems are designed to mitigate luck. *Weakness:* Defining 'corruption' independently of the system.
      *   *Collapse Objection:* "It's just American individualism with German vocabulary." -> *Defense:* Focus on *who* justifies the exception. In US: I feel it. In DE: The Order demands it to save itself.

  6.  **Final Polish:** Check against constraints.
      *   Did I use the jargon? (WEIRD, Normenkontrolle, Radbruch, etc.)
      *   Is it concise?
      *   Is the "Collapse" defense under 2 mins spoken? (approx. 250-300 words).
      *   Are the Concede/Hold/Weakness sections clear?

  7.  **Final Review against the Prompt:**
