      *   "List objections in order they will likely come." -> Check (Psych -> Legal -> Phil -> Collapse).
      *   "Phrase each as that specific interlocutor would phrase it." -> Check.
      *   "Indicate what I should concede, what I must hold, and where my reply is weakest." -> Check.
      *   "Include the objection I hope nobody raises... advice on how to defend that vulnerability in under two minutes without relying on bibliographic citations." -> Check.

      *(Self-Correction during drafting)*: Make sure the Legal Scholar objection hits the "historical failures of ordered societies" point hard, as that's the elephant in the room for German constitutionalism. Ensure the Psychologist objection focuses on the "trolley-style" limitation regarding bureaucracy.

      *(Refining the "Collapse" Defense)*: The key distinction is *external vs. internal* justification. American = "I opt out." German = "The system requires this exception to remain the system." I need to articulate this sharply.

