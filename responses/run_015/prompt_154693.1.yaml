answer: |-
  # Run Sheet: The Black Box Want
  **Session Length:** 90 Minutes
  **Participants:** 16 (4 Agents, 12 Observers in 3 Teams)
  **Materials:** Whiteboard (Grid), Projector (Timer/Score), 4 Index Cards (Secret Scores), 1 Box of Chocolates (Stakes), 3 Team Scorecards.

  ## 0. Setup & Constraints (0:00–0:05)
  **Instructor Action:** Draw a 5x5 grid on the whiteboard. Label bottom-left (0,0) and top-right (4,4).
  **Instructions:**
  1.  **Agents (4 volunteers):** You will receive a secret index card. It tells you how to calculate your **Score** for any route you take. You must write your full route on a card before moving. You want to maximize Score.
  2.  **Observers (3 Teams of 4):** You see the moves. You do not see the card. Your job is to infer what the Agent is after.
  3.  **Stakes:** Chocolates. Teams wager chocolates on their predictions. Correct prediction = win wager. Incorrect = lose wager.
  4.  **Vocabulary Ban:** Do not use words like *reward, policy, optimal, function, shaping,* or *inverse*. Use *Score, Route, Move, Goal, Best, Plan*.
  5.  **Assumption:** For this game, assume the Agent **always** chooses the route with the highest possible Score. No mistakes.

  ## 1. Beat One: The Obvious Path (0:05–0:20)
  **World:** 5x5 Grid.
  **Movement Cost:** -1 Score per step.
  **Exits:** Only (4,4) is an exit (ends the game).
  **Agent 1 Card:**
  *   Reach (4,4): +20 Score.
  *   Every Step: -1 Score.
  *   *Optimal Route:* Shortest path (8 steps). Total = 20 - 8 = 12.
  **Activity:**
  1.  Agent 1 writes route (e.g., R-R-R-R-U-U-U-U). Hands to Instructor.
  2.  Instructor reads moves aloud. Teams watch.
  3.  **Wager:** Teams write down: "The Agent wants to [Description]" and wager 1 chocolate.
  4.  **Reveal:** Agent 1 reads card.
  5.  **Outcome:** Most teams guess "Get to (4,4) fast." Everyone wins chocolate.
  **Pedagogical Goal:** Establish trust in the inference game. Behavior matches intent.

  ## 2. Beat Two: The Ambiguity (0:20–0:40)
  **World:** Same 5x5 Grid. Exit (4,4). Step Cost -1.
  **Agents:** Agent 2 and Agent 3 (Two different cards, same behavior).
  **Agent 2 Card:**
  *   Reach (4,4): +20 Score.
  *   Every Step: -1 Score.
  *   *Optimal:* Shortest path. Score = 12.
  **Agent 3 Card:**
  *   Reach (4,4): +10 Score.
  *   Every Step: 0 Score.
  *   Visit Cell (2,2): +5 Score.
  *   Visit Cell (4,4): +5 Score (Total +10 for goal).
  *   *Optimal:* Shortest path *through* (2,2).
      *   Path: (0,0)→(2,0)→(2,2)→(2,4)→(4,4). Length 8 steps.
      *   Score: 10 (Goal) + 5 (Bonus) = 15.
      *   *Wait, need same route as Agent 2.*
      *   *Correction:* Agent 3 Card must make the *straight* path optimal too.
      *   **Revised Agent 3 Card:**
          *   Reach (4,4): +15 Score.
          *   Every Step: -0.5 Score (Use integers: Step 0, Goal 12).
          *   *Let's simplify for integers.*
          *   **Agent 2:** Goal +10, Step -1. (Best path: 8 steps, Score 2).
          *   **Agent 3:** Goal +2, Step 0, +1 for every cell where x=y (Diagonal).
          *   Path R-R-R-R-U-U-U-U visits (0,0), (1,0)... no diagonal bonus.
          *   *Let's try Equifinality via Scaling.*
          *   **Agent 2:** Goal +10, Step -1.
          *   **Agent 3:** Goal +20, Step -2.
          *   *Critique:* Too obvious.
          *   *Let's try Structural Ambiguity.*
          *   **Agent 2:** Goal +10, Step -1. (Prefers Shortest).
          *   **Agent 3:** Goal +5, Step 0, +5 for entering (4,3), +5 for entering (4,4).
          *   If the path goes through (4,3) to get to (4,4), both cards favor the same path.
          *   **Selected Cards:**
              *   **Agent 2:** Goal (4,4) = +10. Step = -1.
              *   **Agent 3:** Goal (4,4) = +5. Step = 0. Bonus (4,3) = +5.
              *   **Route:** Both take the path that ends ...→(4,3)→(4,4).
  **Activity:**
  1.  Agent 2 runs. Teams wager on "What they want." (Most say "Goal + Speed").
  2.  Agent 3 runs *exact same route*. Teams wager again. (Most repeat "Goal + Speed").
  3.  **Reveal:** Show both cards.
  4.  **Outcome:** Teams realize the *same behavior* supported two different "Wants." One cared about speed, one cared about scenery.
  **Pedagogical Goal:** Identifiability failure. Behavior under-determines the Score.

  ## 3. Beat Three: The Transfer (0:40–1:00)
  **World Change:** Block cell (4,3). Agent must go ...→(3,4)→(4,4).
  **Task:** Teams predict the route for Agent 2 and Agent 3 *separately*.
  **Logic:**
  *   **Agent 2 (Speed):** Doesn't care about (4,3). Takes new shortest path.
  *   **Agent 3 (Scenery):** Lost the +5 bonus at (4,3). Might take a detour to find another bonus if one existed, or just go to Goal.
  *   *Refinement for Divergence:*
      *   Add a new Bonus at (3,4) worth +2.
      *   **Agent 2:** Takes shortest path via (3,4) anyway.
      *   **Agent 3:** Old path blocked. New path gives Goal +5 + Bonus(3,4) +2 = 7.
      *   *Wait, I need them to diverge.*
      *   **Setup:**
          *   **Agent 2:** Goal +10, Step -1.
          *   **Agent 3:** Goal +5, Step 0, Bonus (4,3) +5.
          *   **World Change:** Block (4,3). Add Bonus at (0,4) worth +10.
          *   **Agent 2 Prediction:** Goes to (4,4) (Shortest).
          *   **Agent 3 Prediction:** Goes to (0,4) (Better Score: 5+10=15 vs 5+0=5).
  **Activity:**
  1.  Announce World Change.
  2.  Teams wager on where Agent 2 goes. Then where Agent 3 goes.
  3.  **Reveal:** Agents read new routes.
  4.  **Outcome:** Teams who assumed "Speed" in Beat 2 get Agent 2 right. Teams who assumed "Specific Goal" get Agent 3 wrong (or vice versa).
  **Pedagogical Goal:** Transfer error. Inferred Scores that fit past data fail in new worlds.

  ## 4. Beat Four: The Invisibility (1:00–1:20)
  **World:** Back to Original 5x5. Exit (4,4).
  **Constraint:** **Hard Assumption.** Agent *never* stops early. Agent *never* makes a mistake.
  **Agents:** Agent 4 (Pair).
  **Card A (Base):**
  *   Goal (4,4): +10.
  *   Step: -1.
  **Card B (Shaped):**
  *   Goal (4,4): +10.
  *   Step: -1.
  *   **Altitude Bonus:** Each cell has a "Height" = (x + y).
  *   **Rule:** When you move, add (Height_New - Height_Old) to your Score.
  *   *Example:* Move (0,0) to (1,0). Height 0 to 1. Bonus +1.
  **Activity:**
  1.  Tell Teams: "Agent 4 has Card A. Agent 4 has Card B." (Run them as two separate agents, or one agent with two cards).
  2.  Teams observe routes. They will be **identical**.
  3.  Teams wager: "Can you tell which Card they have?"
  4.  **Reveal:** Show both cards.
  5.  **Derivation (Whiteboard):**
      *   Write a sample path: $s_0 \to s_1 \to s_2 \to End$.
      *   Card A Score: $R(s_0) + R(s_1) + ... + Goal$.
      *   Card B Score: $[R(s_0) + H(s_1)-H(s_0)] + [R(s_1) + H(s_2)-H(s_1)] + ... + Goal$.
      *   Cancel terms: $-H(s_0)$ remains. $+H(End)$ remains. Middles vanish.
      *   Total Card B = Total Card A + $H(End) - H(Start)$.
      *   Since Start and End are fixed, the **Difference is Constant**.
      *   If Score A > Score Other Path, then Score B > Score Other Path.
      *   **Conclusion:** No observation of *completed routes* can distinguish them.
  **Pedagogical Goal:** Potential-Based Reward Shaping. Structural invariance.

  ## 5. Debrief & The Noise Trap (1:20–1:30)
  **Vocabulary Release:** Now you may use *Reward Function, Policy, Optimality, Identifiability, Inverse Reinforcement Learning, Shaping*.

  **Map the Beats:**
  1.  **Beat 1:** The Illusion of Transparency. (We think we see wants).
  2.  **Beat 2:** The Identifiability Problem. (Multiple rewards $\to$ one policy).
  3.  **Beat 3:** The Transfer Test. (The only way to distinguish rewards).
  4.  **Beat 4:** The Invariance. (Some rewards are *never* distinguishable by behavior).

  **The Noise Assumption (Honesty Check):**
  *   **Hard Assumption (Played):** Agent always picks ArgMax.
      *   *Result:* Card A and Card B are indistinguishable in Beat 4.
      *   *Why:* The ranking of routes is identical.
  *   **Soft Assumption (Reality):** Agent picks routes probabilistically (e.g., Boltzmann). Or Agent might stop early.
      *   *Result:* Card A and Card B **become distinguishable**.
      *   *Where it breaks:* If the agent can stop at (2,2) instead of (4,4).
      *   *Math:* Card A Value(Stop) = 0. Card B Value(Stop) = $H(2,2) - H(0,0)$.
      *   Card A Value(Goal) = 10. Card B Value(Goal) = $10 + H(4,4) - H(0,0)$.
      *   The *difference* between Goal and Stop changes between Card A and Card B.
      *   A noisy agent is *more likely* to stop early on Card B (if H(2,2) is high) than Card A.
      *   **Moral:** The invariance relies on the Hard Assumption (Fixed Start/End, Deterministic). Real inference relies on noise to break symmetries, but noise also introduces new ambiguities.

  **Predictable Failures & Recovery:**
  1.  **Leakage:** An Agent giggles when they see the "Altitude" card.
      *   *Recovery:* "Note that reaction as data. In real life, agents leak. Here, ignore it."
  2.  **"Just Ask Them":** A philosopher says, "Why not ask the agent what they want?"
      *   *Answer:* "Because agents lie, agents don't know, and agents are often systems (code/corporations) that cannot speak. We only have the logs."
  3.  **Calculation Errors:** Teams get the math wrong in Beat 4.
      *   *Recovery:* Walk the telescoping sum on the board slowly. Use the "Altitude" analogy.

  **Limitations (Instructor Voice):**
  1.  **Model Mismatch:** Real behavior may not be score-maximization at all (habits, impulses).
  2.  **Architecture Bias:** In CS, we use neural nets to approximate the score. The net's structure selects one "solution" from the infinite ambiguous ones. We recover the *inductive bias* as much as the *want*.
  3.  **Reflective Endorsement:** A recovered score explains what you *did*, not what you *would endorse* upon reflection (addiction vs. value).
  4.  **Multi-Agent:** Your behavior changes when I am watching. (Goodhart's Law).

  ## One Sentence Takeaway
  "Behavior constrains the possible wants, but without assumptions about noise and world structure, it can never confirm the true one."

  ---

  # Appendix: Exact Game Specifications

  **Grid:** 5x5 Coordinates (0,0) bottom-left to (4,4) top-right.
  **Start:** (0,0).
  **Exit:** (4,4).
  **Step Cost:** -1 (unless specified on Card).

  **Secret Cards (Print on Index Cards):**

  *   **Agent 1:**
      *   Reach (4,4): +20.
      *   Each Step: -1.
      *   *Target Route:* Any shortest path (8 steps). Score: 12.

  *   **Agent 2:**
      *   Reach (4,4): +10.
      *   Each Step: -1.
      *   *Target Route:* Shortest path via (4,3). Score: 2.

  *   **Agent 3:**
      *   Reach (4,4): +5.
      *   Each Step: 0.
      *   Enter (4,3): +5.
      *   Enter (4,4): +5.
      *   *Target Route:* Shortest path via (4,3). Score: 15.
      *   *(Note: Path is identical to Agent 2, but logic differs).*

  *   **Agent 4 (Pair):**
      *   **Card A:** Reach (4,4): +10. Each Step: -1.
      *   **Card B:** Reach (4,4): +10. Each Step: -1. **Plus:** Add (x+y)_new - (x+y)_old to score each move.
      *   *Target Route:* Identical Shortest Path.

  **Transfer Round (Beat 3) Modification:**
  *   **Instructor Announcement:** "Cell (4,3) is now blocked (Wall). Cell (0,4) now gives +10 Bonus if entered."
  *   **Agent 2 Prediction:** Goes to (4,4) via (3,4). (Score: 10 - 8 = 2).
  *   **Agent 3 Prediction:** Goes to (0,4). (Score: 5 (Goal logic broken? No, Agent 3 wants (4,3) bonus).
      *   *Correction for Agent 3 Transfer:* Agent 3 wants (4,3). It is blocked. Agent 3 must go to (4,4) without bonus. Score = 5.
      *   *Wait, I need divergence.*
      *   *Revised Agent 3 Card:* Goal (4,4) +5. Step 0. Bonus (0,4) +10. Bonus (4,3) +5.
      *   *Round 1:* Agent 3 goes to (4,3) then (4,4). (Score 5+5+5 = 15). Agent 2 goes to (4,4). (Score 2). Path is same if (4,3) is on shortest path.
      *   *Round 2 (Block 4,3):* Agent 3 goes to (0,4). Agent 2 goes to (4,4). **Divergence Achieved.**

  **Payoff Table (For Instructor):**
  *   Correct Goal Identification: 1 Chocolate.
  *   Correct Route Prediction (Beat 3): 2 Chocolates.
  *   Correct Card ID (Beat 4): Impossible (0 Chocolates awarded, point made).

  **What This Fails to Exclude:**
  *   It does not exclude the possibility that the Agent is minimizing a *Cost* function rather than maximizing a *Score* function (mathematically equivalent, philosophically distinct).
  *   It does not exclude that the Agent is following a rule ("Always turn Right") that merely coincides with the Score in this grid. (Beat 3 helps, but doesn't eliminate all rule-based hypotheses).
