      *   *Tone Check:* Keep it philosophical but sharp. Avoid waffling. The user wants to know where the body is buried.

  5.  **Final Polish:** Check against the user's specific constraints (Rank defeaters, say if defenders concede/dismiss, address the "Spread" case specifically). Ensure the distinction between *pragmatic* and *epistemic* norms is clear, as that's the heart of the DB argument's normative claim.

