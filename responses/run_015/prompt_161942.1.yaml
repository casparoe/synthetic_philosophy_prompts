      *(Refining the "Voluntariness" point)*: The "Why not just refuse bets?" objection is the classic "Will-to-Believe" or "Autonomy" objection. The standard reply is the "Linking Principle" (Credences *are* betting dispositions). I need to highlight that if you sever that link, DB loses its grip on *belief* and only holds for *betting behavior*.

