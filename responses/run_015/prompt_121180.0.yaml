  2.  **Deconstruct Sen's Liberal Paradox:**
      *   **Core Idea:** It's impossible to have both minimal liberty (at least two people have decisive power over at least one pair of social states each) and Pareto efficiency (if everyone prefers X to Y, society prefers X to Y) simultaneously in certain preference profiles.
      *   **Classic Example:** "Lady Chatterley's Lover".
          *   Person A (Prude): Prefers nobody reads it > A reads it > B reads it.
          *   Person B (Lewd): Prefers B reads it > A reads it > nobody reads it.
          *   Liberty says: A decides between "nobody" and "A reads". B decides between "B reads" and "A reads".
          *   Pareto says: Both prefer "A reads" over "B reads" (actually, in Sen's original, both prefer *someone* reads over *no one*? No, wait. Let's check the standard formulation).
          *   *Correction on Sen's Example:*
              *   A (Prude): No read > A reads > B reads.
              *   B (Lewd): B reads > A reads > No read.
              *   Liberty: A decides {No read, A reads} -> Chooses No read. B decides {B reads, A reads} -> Chooses B reads.
              *   Pareto: Both prefer A reads > B reads? No. Both prefer A reads > No read? No.
              *   *Actually, the cycle usually goes:*
                  1.  Liberty gives A veto over reading vs not reading for themselves.
                  2.  Liberty gives B veto over reading vs not reading for themselves.
