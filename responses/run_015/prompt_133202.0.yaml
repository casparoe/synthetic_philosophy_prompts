answer: |-
  1. Setup, notation, and the assumptions I am making

  Let the days be indexed $d \in \{1, 2, 3, 4, 5\}$, corresponding to Monday through Friday. The teacher selects a probability distribution $p = (p_1, \dots, p_5)$ such that $\sum p_d = 1$ and $p_d > 0$. Let $T(d) = \sum_{e=d}^5 p_e$ be the tail probability that the exam occurs on or after day $d$, given it has not occurred earlier. The hazard rate is $h(d) = p_d / T(d)$. The student is an ideal Bayesian who conditionalizes on the absence of the exam; thus, on morning $d$, her credence that the exam is on day $e \ge d$ is $p_e / T(d)$.

  I adopt three precisifications of "surprise" relative to a threshold $t=1/2$: (C) Occurrent Credence, where surprise requires $h(d) \le t$; (A) Attainable Predictive Success (interim), where surprise requires $\max_{e \ge d} (p_e / T(d)) \le t$; and (E) Attainable Predictive Success (ex ante), where surprise requires $\max_d p_d \le t$. Assumption (ii)—common knowledge of the procedure $p$—is load-bearing. I will later consider the consequence of relaxing this, but for now, the student knows $p$ perfectly. The teacher maximizes payoff $V = P(\text{Surprise}) + 0.1 \times \sum_{d=1}^5 (d-1)p_d$.

  2. The graded collapse: what the classical argument really establishes

  The classical backward-induction argument claims the announcement is self-refuting. Under (C) and (A), this argument holds locally for the final day but degrades probabilistically for earlier days. Since $T(5) = p_5$, the hazard on Friday is always $h(5) = p_5/p_5 = 1$. Because $1 > 1/2$, Friday can never be a surprise under (C) or (A). Knowing this, a student facing Thursday afternoon knows the exam must be Thursday or Friday. But if the teacher's procedure is known, the student calculates the conditional hazard.

  Consider two candidate procedures: (U) Uniform, $p_d = 0.2$; and (G) Geometric-like, derived from a fair coin stopping heads or at Friday, $p = (1/2, 1/4, 1/8, 1/16, 1/16)$.

  | Procedure | $p_d$ | Tail $T(d)$ | Hazard $h(d)$ | Surprise? ($t=1/2$) |
  | :--- | :--- | :--- | :--- | :--- |
  | **(U) Mon** | 0.20 | 1.00 | 0.20 | Yes |
  | **(U) Tue** | 0.20 | 0.80 | 0.25 | Yes |
  | **(U) Wed** | 0.20 | 0.60 | 0.33 | Yes |
  | **(U) Thu** | 0.20 | 0.40 | 0.50 | Yes |
  | **(U) Fri** | 0.20 | 0.20 | 1.00 | **No** |
  | **(G) Mon** | 0.50 | 1.00 | 0.50 | Yes |
  | **(G) Tue** | 0.25 | 0.50 | 0.50 | Yes |
  | **(G) Wed** | 0.125 | 0.25 | 0.50 | Yes |
  | **(G) Thu** | 0.0625 | 0.125 | 0.50 | Yes |
  | **(G) Fri** | 0.0625 | 0.0625 | 1.00 | **No** |

  Under (C) and (A), (U) yields surprise with probability $0.8$. (G) yields surprise with probability $1 - p_5 = 15/16 = 0.9375$. Is (G) optimal? To maximize surprise probability, we must minimize $p_5$ subject to $h(d) \le 1/2$ for $d < 5$. The constraint $p_d / T(d) \le 1/2$ implies $p_d \le T(d+1)$. Saturating this inequality yields $p_4=p_5$, $p_3=2p_5$, $p_2=4p_5$, $p_1=8p_5$. Summing these gives $16p_5 = 1$, so $p_5 = 1/16$. This recovers (G). Thus, (G) is the optimal procedure for maximizing surprise probability under (C) and (A). The classical argument is correct that certainty is impossible (Friday fails), but wrong that the exam is impossible; it is merely improbable on the final day.

  3. The case that the announcement survives

  Under precisification (E), the announcement collapses differently. (E) assesses surprise ex ante: is the student's best plan from Sunday night sufficiently uncertain? For (U), $\max p_d = 0.2 \le 0.5$. For (G), $\max p_d = 0.5 \le 0.5$. Under (E), both procedures make the announcement true with probability 1. The teacher prefers (E) because it allows higher payoff. By setting $p = (0, 0, 0, 0.5, 0.5)$, the teacher satisfies (E) ($\max p = 0.5$) and achieves expected deferral $0.35$, yielding total payoff $1.35$, surpassing (G)'s $1.03$.

  However, (E) suffers from dynamic inconsistency. While the ex-ante plan is surprised, the student on Friday morning (if reached) has credence 1. The "surprise" is a property of the distribution, not the experience. This mirrors worries about backward induction in games: the classical elimination argument assumes the student reasons rationally at nodes reached with low probability. In (G), Friday is reached with probability $1/16$. The contradiction (credence 1 vs. surprise requirement) is real but rare. The classical argument treats the logical contradiction at Friday as contaminating Thursday, then Wednesday. But in a probabilistic setting, the student knows Friday is unlikely. She accepts the small risk of non-surprise on Friday to secure high probability of surprise earlier.

  The teacher, maximizing payoff under (C)/(A), will choose (G). Under (E), she would choose a late-loaded distribution. The choice hinges on the definition of surprise. If surprise is phenomenological (C), the teacher sacrifices the guarantee of truth for high probability. If surprise is structural (E), she guarantees truth but ignores the student's interim knowledge. The game-theoretic reading suggests the teacher's choice validates (C): a rational teacher knows the student updates, so she cannot rely on (E) to shield her from the student's Friday certainty.

  4. Verdict

  I adjudicate that (C) Occurrent Credence is the correct explication of surprise. Surprise is essentially an epistemic state at the time of the event, not a property of a plan formulated days prior. Under (C), the teacher's announcement is not satisfiable with certainty; it is satisfiable only with high probability (specifically, at most $15/16$). The classical no-surprise-exam argument is sound in its deduction that a guaranteed surprise is impossible (due to $h(5)=1$), but unsound in its conclusion that no exam can occur. It conflates "not guaranteed surprise" with "no surprise possible."

  The paradox dissolves when we replace binary truth conditions with probabilistic optimization. The "paradoxical" feeling arises from demanding common knowledge of a statement that is only probabilistically true. The teacher's rational choice is procedure (G). At this choice, the announcement is false on Friday (probability $1/16$) and true on Monday through Thursday (probability $15/16$). The announcement is therefore strictly false as a universal claim ("It will be a surprise"), but approximately true. The classical argument is not genuinely paradoxical once we acknowledge that self-referential announcements in epistemic settings often fix points only approximately. The tension is not a logical contradiction but a trade-off between probability mass and hazard rates. The teacher buys surprise probability by pushing exam probability mass to early days, paying the cost of leaving Friday vulnerable.

  5. What would change my mind

  The single consideration most likely to reverse my verdict is a compelling argument for precisification (E). If "surprise" is interpreted as a constraint on the teacher's commitment rather than the student's phenomenology, the announcement becomes fully satisfiable. For instance, if the student's goal is merely to maximize ex-ante winning probability, (E) aligns with her incentives, and the teacher can guarantee the announcement's truth while maximizing deferral. My reasoning is most vulnerable on the threshold $t=1/2$. If the threshold is strict ($h(d) < 1/2$), procedure (G) fails on Monday through Thursday ($h=1/2$), forcing the teacher to increase $p_5$ and lowering the surprise probability below $15/16$. If $t$ were lower, say $1/3$, the optimal distribution changes significantly, and the "graded collapse" becomes steeper. Additionally, if I have erred in the common-knowledge assumption (ii)—for example, if the teacher can hide the distribution $p$ from the student—the Bayesian updating fails, and the classical elimination argument loses its grip entirely. Finally, a slip in the hazard arithmetic for (G) would undermine the optimality claim; however, $1/2 + 1/4 + 1/8 + 1/16 = 15/16$ is robust. I remain confident in (C), but acknowledge that the definition of surprise is the pivot upon which the entire paradox turns.
