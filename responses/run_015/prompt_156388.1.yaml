answer: |-
  You are grappling with the tension between **Global Monism** (time must be a single, universal ordering for the whole cosmos to be real) and **Regional Realism** (time is a local structural feature that can exist in patches). Your inconsistency arises because you are applying Global Monism to Case 1, Regional Realism to Cases 2 and 3, and then slipping into a **Nomological Essentialism** for Case 4 (where the *reason* for the breakdown affects the *ontology* of the result).

  To resolve this without citations, we need to isolate the specific property of spacetime that grounds the reality of time. In the context of Gödel's argument, the threat to time is the impossibility of defining a **global time function** (a scalar field that increases monotonically along every future-directed causal curve).

  Here is the conceptual structure that unifies your cases, identifies the inconsistency, and offers a verdict on the decelerating universe.

  ### The Unifying Principle: Stable Causality as a Local Predicate

  The most coherent principle for your dissertation is **Local Foliability**.

  **The Principle:** *Time is ontologically real in any open region of spacetime that admits a foliation by spacelike hypersurfaces. The existence of CTCs in disjoint regions does not ontologically negate the reality of time in regions where foliation is possible, provided those regions are not causally contaminated by the CTCs.*

  This principle treats "time" not as a property of the *universe* (the manifold as a whole), but as a property of *causal structures* within the universe. Gödel's argument holds only if you assume time *must* be universal. If you drop that assumption, his argument only kills *universal* time, not *local* time.

  ### Applying the Principle to Your Cases

  **Case 1 (Standard Gödel):**
  *   **Structure:** Homogeneous rotation. Every point lies on a CTC.
  *   **Verdict:** **Time is dead.**
  *   **Reasoning:** No open region admits a foliation. There is no "safe zone." Local Foliability fails everywhere. Your intuition is correct.

  **Case 2 (Single Bubble):**
  *   **Structure:** CTCs confined to a compact set; asymptotically flat exterior.
  *   **Verdict:** **Time survives.**
  *   **Reasoning:** The exterior region admits a global time function. Observers there experience standard temporal ordering. The bubble is a causal pathology, like a black hole singularity, but it doesn't infect the ontology of the exterior. Your intuition is correct.

  **Case 3 (Infinite Lattice):**
  *   **Structure:** Scattered CTC bubbles, flat regions in between.
  *   **Verdict:** **Time survives.**
  *   **Reasoning:** This is topologically equivalent to Case 2, just with more pathology. As long as the "flat regions" form a connected open set where a time function can be defined, time is real there. Your intuition is correct.

  **Case 4 (Quantized Shells):**
  *   **Structure:** Discrete shells of CTCs, non-rotating gaps.
  *   **Verdict:** **Inconsistent.** (You must drop your intuition here).
  *   **Reasoning:** You feel this is "worse" because the CTCs are law-like ("principled") rather than contingent. However, ontology tracks *structure*, not *etiology*. If an observer exists in a gap, their local causal structure is identical to an observer in Case 3. The fact that the CTCs are mandated by a quantization law does not make the time in the gaps less real.
  *   **Correction:** Under Local Foliability, Case 4 is ontologically identical to Case 3. Time is real in the gaps. If you insist Case 4 is worse, you are conflating the **reality of time** with the **universality of physical law**. You must choose: either time is dead in all patchy universes (drop Case 3), or the "principled" nature of the shells is irrelevant to the ontology of the gaps (drop Case 4's special status). **Dropping the Case 4 exception is the simpler account.**

  **Case 5 (Asymptotic Boundary):**
  *   **Structure:** Internal CTCs, fixed time at infinity.
  *   **Verdict:** **Your ambivalence is justified, but "cheating" is the stronger view.**
  *   **Reasoning:** In General Relativity, if CTCs exist in the interior, you *cannot* define a global time function that covers the interior, regardless of the boundary. The boundary coordinate labels events, but it does not order them causally in the CTC region. Therefore, the boundary does not "save" time for the whole universe; it only secures time for the boundary observers.
  *   **Correction:** Time is real *at the boundary*, but the interior remains temporally illusory. It is not "cheating" to define time at the boundary, but it is incorrect to say this saves time for the *whole* universe. This aligns with Local Foliability: Time exists where the structure allows it (the boundary), not where it is forbidden (the interior).

  ### The Decelerating Universe (Case 6)

  **Scenario:** Rotation slows; CTCs exist only in the past, none in the future.
  **Question:** Is time restored, or permanently scarred?

  **Verdict:** **Time is restored, but the past is ontologically distinct.**

  Under Local Foliability, the future region admits a time function. Therefore, time is real *now* and *going forward*. The existence of CTCs in the past does not invalidate the reality of time in the future, just as Case 2's bubble doesn't invalidate the exterior.

  However, the "scar" depends on your commitment to Eternalism vs. Presentism:
  1.  **If Eternalism (Block Universe):** The past CTC region still exists in the manifold. The universe is temporally heterogeneous. Time is real in the future slice, illusory in the past slice. The universe is "scarred" because it contains a region where temporal becoming is impossible.
  2.  **If Presentism/Growing Block:** The CTC past is gone or fixed. Once the universe decelerates past the threshold, the active generation of CTCs stops. Time is fully restored because the *current* ontology contains no CTCs.

  **Recommendation:** For a dissertation on temporal ontology, the **Eternalist "Heterogeneous" view** is more robust. It acknowledges that the *manifold* contains both temporal and atemporal regions. Time is not "restored" in the sense of being universal; it is "localized" to the future epoch.

  ### Summary of Required Shifts

  To achieve coherence, you need to make one major sacrifice:

  1.  **Adopt Local Foliability:** Time is a property of regions, not the whole manifold.
  2.  **Drop the Case 4 Intuition:** Accept that "law-like" CTCs are no more ontologically threatening than "contingent" CTCs. If there are gaps, time is real in the gaps. The "principled" nature is a nomological feature, not an ontological one.
  3.  **Refine Case 5:** Acknowledge that boundary conditions do not cure interior CTCs. Time is real at the boundary, dead in the bulk.
  4.  **Resolve Case 6:** Time is real in the future, but the universe remains temporally heterogeneous (scarred) in the eternalist picture.

  **The Coherent Position:**
  Gödel was right that *universal* time is an illusion in spacetimes with CTCs. But he was wrong that *time itself* is an illusion. Time is a robust, local structural feature that survives wherever the metric allows stable causality. Your Cases 2, 3, and 4 are all victories for local time. Case 1 is the only total defeat. Case 5 and 6 are mixed states where time is real in some epochs/regions and not others.

  This removes the inconsistency between Cases 3 and 4 and gives you a precise criterion (admissibility of a local time function) to defend in your chapter.
