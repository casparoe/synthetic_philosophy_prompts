  I'm delivering the opening remarks at the workshop "Republics and Their Echoes," co-hosted by our university's Department of Ancient History and the Civic Engagement Initiative. The room is split evenly between scholars of Roman constitutional history and comparative politics, and engaged citizens with no specialist background. I have ten minutes.

  Please write the speech around a conceptual frame I'm calling "procedural exhaustion": the erosion of republican substance not through open lawbreaking or foreign invasion, but through relentless hyper-compliance with formal rules—using every legal mechanism to paralyze governance, extending emergency powers through technically valid decrees that never expire, or filling offices with figures who observe every procedural norm while draining the office of its normative purpose. This concept should do structural work: it must determine which analogies to the late Roman Republic are illuminating (institutions that remain formally intact while their governing substance drains away) and which must be rejected (narratives of sudden tyrannical seizure or barbarian collapse). Because the frame shapes the argument, the speech should be impossible to deliver coherently without it. Do not diagnose any specific modern nation in partisan terms; do not cite living scholars by name, provide a reading list, or ask the audience to pursue further study; do not offer false reassurance, but also avoid deterministic alarmism. The specialists should find the constitutional history accurate, and the non-specialists should grasp why the comparison matters without feeling lectured.

  After the speech, provide a brief structured summary in JSON with exactly these fields: "occasion", "core_concept", "structural_constraint_on_analogy", "audience_bridge_mechanism", and "tone".
