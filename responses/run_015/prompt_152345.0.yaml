  **Nearest concepts**
  Susan Wolf's "Fitting Fulfillment" requires active engagement with objective value. It fails here because agents deny the value is objective; they see their work as churn or silt. Your colleague's view—that meaning requires independent worth—is directly contradicted by the agents' explicit denial of such worth. Subjectivist accounts require that the activity be positively valued by the agent; these agents value the *activity* but deny its *worth*, creating a gap subjectivism misses. Camusian Absurdism posits a conscious rebellion against meaninglessness; these agents exhibit no rebellion, only submission to the local demand. They aren't pushing the boulder to spite the gods; they are just pushing it. Frankfurt's "Caring" comes closest regarding the structural inability to stop, but Frankfurt treats this as defining the self, whereas these agents feel distinct from the pull—it happens *to* them, like a weather pattern. Wittgensteinian hinge commitments explain the "where I belong" aspect but struggle with the explicit acknowledgment of futility. Hinges are usually unquestioned; here, the hinge is questioned but obeyed. The corridor objection—that this is just attachment in inflated language—misses the phenomenological reality: the agents feel bound, not merely attached. Attachment allows for release; this does not. Each captures a facet (grip, indifference, belonging) but none accommodate the specific triad of non-volitional, non-hedonic, and non-objective commitment simultaneously. The literature assumes either the value is real (objectivism) or the valuation is chosen (subjectivism). This phenomenon sits in the gap: valuation without value, necessity without choice.

  **One or three**
  These are one phenomenon. The distinction between inherited (religion) and acquired (PhD, canal) is genealogical, not structural. The core case is the **severance of validity from vitality.** In all three, the agent experiences a normative demand ("I must do this") while simultaneously withholding ontological endorsement ("This doesn't matter"). The PhD student's grind, the neighbor's mud, and the friend's liturgy all function as "hinge commitments" that operate despite being recognized as hinges. The phenomenology is identical: a frictionless submission to a local law that holds no sway outside its specific context. The source of the grip matters less than the structure of the binding. Whether the pull arrived via socialization or professionalization, the resulting state is a life lived under a local imperative that the agent knows is globally null. The "inherited" feel of Case 3 is just a longer duration of the same grip found in Case 1. The "stiffness" your student exhibits when you suggest it's a hobby is key: it marks the boundary where preference ends and necessity begins. The core is not the origin of the pull, but the **inescapability of the demand** despite the **acknowledged nullity of the ground.** This unifies them as instances of normativity surviving the death of ontology.

  **Definition and edges**
  **Definition:** Immanent Necessity is a state of being bound by a local normative demand that the agent acknowledges lacks cosmic or objective grounding, yet experiences as non-optional and distinct from mere desire. **Edges:** It rules out **Chosen Projects** (existentialist creation of value) because the agent denies choice. It rules out **Enjoyment** (hedonism) because the activity involves friction and lack of pleasure. It rules out **Mere Habit** because habits are mindless; this involves conscious friction and justification ("I can't stop"). It rules out **Attachment** because attachment implies emotional bonding, whereas this is often dutiful or gritty. Crucially, it distinguishes from the **No-Pull Case** (the happy nihilist). The no-pull person shares the cosmic view but lacks the local binding. They are free; the Immanent Necessity subject is bound. The difference is not the metaphysics, but the phenomenology of constraint. The no-pull case proves the nihilism isn't the driver; the grip is. Without the grip, you have quietism; with it, you have Immanent Necessity. This boundary confirms the phenomenon is about the **presence of the bind**, not the absence of the ground. The no-pull person is the control group: they share the metaphysics but lack the phenomenology. They show that cosmic nihilism does not necessitate this state; the state requires a specific psychological architecture of constraint. Thus, the definition must exclude the unbound nihilist not because their view is wrong, but because they lack the constitutive feature: the involuntary demand. The edge is drawn at the experience of **obligation without authority.**

  **What it costs**
  Objectivist theories (Wolf, Metz) are in trouble; they must dismiss this as illusion or false consciousness, claiming real meaning requires actual value. Radical Subjectivists struggle because the agent isn't "valuing" in the standard sense; they are enduring a pull they don't endorse. This favors **Naturalist-Phenomenological** accounts. If meaning is a psychological state of being gripped, rather than a relation to value, this fits cleanly. It suggests meaning is not about "finding" or "making" value, but about **sustaining commitment under erasure.** It costs the idea that meaning requires hope. It implies a meaningful life is compatible with knowing nothing matters, provided something matters *to* you involuntarily. The no-pull case becomes the outlier: not the enlightened realist, but the unbound. This costs the "Search for Meaning" industry its premise that meaning is a goal to be achieved. Here, meaning is a condition to be endured. It also challenges the idea that authenticity requires aligning belief and action. These agents are authentic precisely because they hold the contradiction open. Objectivists must call this delusion; Subjectivists must call it passivity. Only a view that treats meaning as a **structural feature of agency** rather than a **value property of outcomes** can absorb it. It suggests we are meaning-generating machines that continue running even when we know the output is null.
