  3.  **Drafting the "Spec" (Requirements for a Theory of Deductive Justification):**

      *   *Requirement 1: The Rule/Premise Distinction.* The theory must distinguish between accepting a proposition (premise) and accepting a rule of inference.
          *   *Why:* If you treat the rule as a premise, you get the regress.
      *   *Requirement 2: Normative Force.* The theory must explain *why* we are compelled to move from premises to conclusion, not just that we do.
          *   *Why:* Logic is normative (how we *ought* to think), not just descriptive (how we *do* think).
      *   *Requirement 3: Non-Circularity.* The justification cannot rely on the very rule it's trying to justify (no begging the question).
          *   *Why:* Using Modus Ponens to justify Modus Ponens is vacuous.
      *   *Requirement 4: Universality vs. Particularity.* It must handle general logical forms without needing infinite instances.
