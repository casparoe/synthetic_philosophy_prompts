  2.  **Deconstruct the Logic:**
      *   *Premise (1):* "If rational for agents with ontology $O$, then binding on anyone with $O$." This is a strong universalist claim.
      *   *Premise (2) & (3):* Establish conditional rationality. *If* Autonomy > Harmony, *Then* Directness. *If* Harmony > Autonomy, *Then* Indirectness/White Lies.
      *   *Premise (4):* Everyone has $O = \{Autonomy, Harmony, Info\}$.
