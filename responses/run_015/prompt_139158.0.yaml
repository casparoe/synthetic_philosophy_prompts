answer: |-
  ### Stage 1: Mechanism and Structural Features

  The mechanism dramatised here is an **informational cascade** (specifically the Bikhchandani-Hirshleifer-Welch model). The core philosophical problem is that rational agents, acting sequentially, observe the actions of predecessors rather than their private signals. Once the public history of actions outweighs the weight of a private signal, it becomes epistemically rational to ignore one's own evidence and follow the herd. This results in fragile unanimity: the crowd looks confident, but their collective knowledge is no greater than the first few individuals'.

  **Structural Mapping:**
  *   **Refrain 1 (A1):** The private signal ("My private strip showed green was meant to grow"). This represents the idiosyncratic evidence. To enact the "growing quieter" constraint without altering the text, the surrounding lines will increasingly frame this refrain as a suppressed doubt or a negligible weight.
  *   **Refrain 2 (A2):** The public action ("The valley speaks: the gold is best to sow"). This represents the observable history. The surrounding lines will frame this as an accumulating authority.
  *   **Repetition:** The rigid repetition of the villanelle form mirrors the locking-in of the cascade; the words remain the same, but their epistemic weight shifts.
  *   **The Final Quatrain:** Standard villanelles end with a rhyme scheme of *a b A1 A2*. To satisfy the requirement of a "plain, unmusical line" that hollows out the crowd refrain, I will disrupt the quatrain. Line 17 will be A1, Line 18 will be the unrhymed, prosaic tally (breaking the music), and Line 19 will be A2 (following the plain line, thus "hollowed out").

  ### Stage 2: Sketching the Refrains

  *   **Refrain 1 (Private Evidence):** "My private strip showed green was meant to grow."
      *   *Intent:* Concrete, specific, grounded in local trial.
  *   **Refrain 2 (Public Choice):** "The valley speaks: the gold is best to sow."
      *   *Intent:* Authoritative, collective, decisive.
  *   **Rhyme Sound:** -ow (grow, sow, know, show, flow).
  *   **Secondary Rhyme:** -ight (light, sight, weight, right, night).

  ### Stage 3: The Villanelle (Draft)

  The first farmer stands within the light,
  We watch his hand and wait to see the seed.
  My private strip showed green was meant to grow.
  He chooses gold. We count it as our sight.
  The second follows logic, not a need.
  The valley speaks: the gold is best to sow.

  Now three have chosen gold against the right.
  My signal weighs less than the history made.
  My private strip showed green was meant to grow.
  It is not fear that turns us from the sight,
  But math that tells us when a signal fades.
  The valley speaks: the gold is best to sow.

  By five, the alternative is out of sight.
  Reason demands we let the evidence flow.
  My private strip showed green was meant to grow.
  No one is blind; we simply lack the weight
  To break the chain that earlier hands threw.
  The valley speaks: the gold is best to sow.

  The queue moves on beneath the evening light.
  Private trials are hidden from the show.
  My private strip showed green was meant to grow.
  We act on what the public acts relate,
