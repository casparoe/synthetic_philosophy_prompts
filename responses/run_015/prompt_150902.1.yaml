answer: |-
  **MEMORANDUM TO THE STANDING ORDERS COMMITTEE**

  **SUBJECT:** Recommendation Regarding Proposed Amendments to Rules 4 and 5
  **DATE:** October 26, 2023

  ### 1. Recommendation and Reasoning

  **Recommendation:** The Committee should advise the Senate that the proposed two-step operation (March deletion of Rule 5, May amendment of Rule 4 at 70%) carries a substantial risk of invalidity. The Committee should recommend that if the Senate wishes to proceed, it should either (a) combine both motions into a **single meeting** (replicating the 2015 precedent) or (b) ensure the May motion also secures a **three-quarters majority**. The Committee should not advise that the motions be put as currently planned.

  **Reasoning:**
  The core legal vulnerability lies in the interaction between Rule 5 (entrenchment), Rule 8 (delayed effect), and Rule 7 (rescission).

  Under Rule 8, amendments take effect on 1 September following the meeting at which they are carried. Textually, Rule 5 remains part of the Standing Orders until that date. The 2015 ruling validated a similar two-step process, but crucially, both votes occurred at a *single meeting*. That ruling implies that for the purpose of legislative competence, the repeal of Rule 5 is operative immediately upon passage, even if the *operational* effect is delayed.

  However, splitting the votes across two meetings (March and May) introduces a period of vulnerability. In May, Rule 5 has been *passed for repeal* but has not yet *taken effect*. If we adhere to the strict textualism of the 2013 ruling (which held that an amendment altering the majority must be carried by the majority required by the Standing Orders *as they stand*), Rule 5 is still "standing" in May. Therefore, the May motion requires 75%, not 66%.

  Furthermore, Rule 7 allows a carried motion to be rescinded by a two-thirds vote. If the March motion (Delete Rule 5) is rescinded in June (which requires only 67%, and the proponents claim to have this), the legal foundation for the May motion evaporates. If Rule 5 is reinstated via rescission before 1 September, the May motion—which passed with only 70%—was invalid *ab initio* because it failed to meet the Rule 5 threshold active at the time of voting. This creates the disputed status the Committee seeks to avoid.

  ### 2. Competing Principles

  Three distinct principles can be derived from our four rulings. Each predicts a different outcome for the May motion and the potential June rescission.

  **Principle A: Strict Textualism (The 2013/2018 View)**
  *   **Definition:** The validity of an amendment is assessed against the rules *in force* at the moment of the vote. Rule 8 delays the *operation* of the new rule, meaning the old rule remains *in force* until 1 September.
  *   **Prediction for May:** The May motion is **ineffective**. Rule 5 is still in force in May; therefore, the 70% vote is insufficient (needs 75%).
  *   **Prediction if June Rescission Succeeds:** The March motion is nullified. Rule 5 remains in force permanently. The May motion is confirmed as invalid (as it lacked 75%).
  *   **Fit:** Fits 2013 and 2018 perfectly. Strains 2015 (requires explaining why Rule 5 was "gone" in the second half of that meeting).

  **Principle B: Legislative Competence (The 2015 View)**
  *   **Definition:** Once the Senate expresses a valid will to remove a constraint (Rule 5), that constraint is removed for the Senate's *legislative competence* for the remainder of the session, even if the *operational effect* is delayed by Rule 8.
  *   **Prediction for May:** The May motion is **effective**. The March vote removed the constraint for future business in that academic year.
  *   **Prediction if June Rescission Succeeds:** This creates a paradox. If March is rescinded, the Senate retroactively declares it never validly removed the constraint. This suggests the May motion becomes **invalid retroactively**, as the condition for its lower threshold (the absence of Rule 5) is erased.
  *   **Fit:** Fits 2015 perfectly. Strains 2013 (requires distinguishing "amending the rule" from "deleting the rule").

  **Principle C: Source of Power (The 2021 View)**
  *   **Definition:** Rules 4 and 5 do not grant the power to amend; they regulate a power inherent in the Charter. If the regulations are removed, the power reverts to the default (simple majority).
  *   **Prediction for May:** Ambiguous. If Rule 5 is "dead" upon passage (per 2015), May is valid. If Rule 5 is "alive" until Sept 1 (per 2013), May is invalid. However, this principle suggests that even if invalid under Standing Orders, the Senate *might* have the inherent power to amend by majority, though this contradicts the 2013 ruling.
  *   **Prediction if June Rescission Succeeds:** The regulations are restored. The May motion must comply with them. It fails.
  *   **Fit:** Fits 2021. Consistent with 2013 regarding the need to follow regulations while they exist.

  ### 3. Closest Analog and Weight

  **The 2015 Ruling** is the closest analog regarding the *substance* of the change (Delete Rule 5, then Lower Rule 4). However, it bears **limited weight** regarding the *procedure* (Single Meeting vs. Separate Meetings).

  *   **Why it gestures but does not settle:** The 2015 Chair's ruling relied on the immediacy of the sequence. By conducting both votes in one sitting, the Senate demonstrated a unified legislative intent that bypassed the "interregnum" risk. The ruling implies that the *passage* of the repeal lifts the constraint immediately for the *meeting*.
  *   **Why it doesn't settle the current point:** It does not address whether that lifted constraint survives the adjournment of the meeting. The 2013 ruling carries more weight regarding the status of Rule 5 *between* meetings, as it establishes that Rule 5 protects itself against amendments that do not meet its threshold *at the time of voting*.

  **The 2013 Ruling** is the closest analog regarding the *status of Rule 5*. It establishes that you cannot use a lower threshold to remove a higher threshold. In the proposed May meeting, if Rule 5 is technically "standing" (due to Rule 8), the 2013 precedent dictates the 70% vote is insufficient.

  ### 4. Implicit Commitments

  If our precedents do not determine the answer, the Committee must acknowledge what we commit to by choosing one path over the other.

  **Choice 1: Validating the Two-Step (May motion effective at 70%)**
  *   **Nature of Rules 4/5:** We commit to the view that Rules 4 and 5 are merely *procedural constraints* on a power that resides in the Senate, not *jurisdictional limits*.
  *   **Validity Timing:** We commit to the view that validity is fixed at **passage**, not commencement. An amendment can validate subsequent amendments before it technically takes effect.
  *   **Self-Validation:** We commit to the view that an amendment (March) can partially validate itself by enabling a second amendment (May) that would otherwise be illegal, creating a interdependent legal chain.

  **Choice 2: Invalidating the Two-Step (May motion ineffective at 70%)**
  *   **Nature of Rules 4/5:** We commit to the view that Rule 5 is a **substantive lock** that remains engaged until the moment the new regime legally commences (1 September).
  *   **Validity Timing:** We commit to the view that the "Standing Orders as they stand" refers to the text in force at the precise moment of the vote, including delayed-effect amendments that have not yet commenced.
  *   **Self-Validation:** We commit to the view that an amendment cannot validate itself; the removal of the lock must be complete before the lock can be ignored.

  ### 5. View on the Member's Objection

  **Would the single combined motion be effective at 70%?**
  **No.** Under the 2013 precedent, a single motion to delete Rule 5 and lower Rule 4's threshold is an amendment to Rule 5. It requires 75%. At 70%, it would be ruled ineffective.

  **Is the two-step route a "device" to be distrusted?**
  It is a device, but not necessarily an illegitimate one. Parliamentary procedure routinely allows complex outcomes through sequential motions that would fail as a single motion (e.g., striking out and inserting text). However, the objection highlights a **spirit vs. letter** conflict. Rule 5 was drafted to ensure broad consensus (75%) for any relaxation of amendment rules. The two-step route technically complies with the *letter* of the 2015 precedent but potentially violates the *spirit* of Rule 5 by allowing the second step to proceed with only 67% (Rule 7 rescission threshold) of support if the March motion is vulnerable.

  **Does Rule 5 achieve nothing?**
  **No, that is incorrect.** Rule 5 prevents:
  1.  **Surprise:** You cannot lower the threshold at a single meeting without 75% support (2013).
  2.  **Simple Majority Creep:** You cannot lower the threshold with a bare majority or a 2/3 majority alone; you need the 3/4 consensus to remove the lock *first*.
  3.  **Instability:** It forces the Senate to affirm the removal of the lock *before* utilizing the lower threshold.

  Rule 5 fails only if the Senate accepts that a vote to repeal Rule 5 renders Rule 5 inert *immediately* for all future meetings before 1 September. If the Committee advises that Rule 5 remains active until 1 September (Principle A), Rule 5 successfully blocks the May motion.

  ### 6. Safe Formulations

  To avoid a year of disputed Standing Orders, the Committee should propose one of the following "safe" routes:

  1.  **The 2015 Route (Safest):** Move both motions at the **March meeting**.
      *   Motion 1: Delete Rule 5 (Needs 75%).
      *   Motion 2: Amend Rule 4 to Simple Majority (Needs 66%, per 2015 precedent).
      *   *Why:* This relies directly on existing precedent. It eliminates the risk of Rule 7 rescission between meetings undermining the second vote.

  2.  **The Compliant Two-Step:**
      *   March: Delete Rule 5 (Needs 75%).
      *   May: Amend Rule 4 (Needs **75%**).
      *   *Why:* This treats Rule 5 as active until 1 September (Principle A). It ensures validity even if the 2015 precedent is distinguished away.

  3.  **The Post-Commencement Route:**
      *   March: Delete Rule 5 (Needs 75%).
      *   **October (or later):** Amend Rule 4 (Needs Simple Majority).
      *   *Why:* By waiting until after 1 September, Rule 5 is legally gone. The 2021 precedent suggests the Senate can then amend by simple majority if Rule 4 is also deleted, or by the new Rule 4 threshold if Rule 4 was amended in March.
      *   *Risk:* Still vulnerable to Rule 7 rescission in June. To mitigate, the March motion should be framed as "Delete Rule 5 effective immediately" (if Rule 8 allows) or the Senate must pass a motion waiving Rule 7 for this specific item.

  **Committee Preference:** The **2015 Route (Single Meeting)** is the only option that minimizes reliance on untested interpretations of Rule 8 and Rule 7 interaction.

  ### 7. Settling the Underlying Question

  If we wish to settle the underlying question for the future rather than merely dispose of this item, we should put the following case on the record:

  **A Motion for Interpretation:**
  *"That the Senate resolves that for the purposes of Rule 5, an amendment to Rule 4 is subject to the three-quarters majority requirement until the repeal of Rule 5 has taken effect pursuant to Rule 8."*

  **Why this case:**
  This forces a definitive vote on **Principle A vs. Principle B**.
  *   If carried, it codifies that Rule 5 is a "substantive lock" until commencement. Future Senates cannot use the two-step inter-meeting device.
  *   If defeated, it codifies the 2015 "Legislative Competence" view, confirming that passage equals removal of constraint, even across meetings.

  Without this clarification, the interaction between Rule 7 (Rescission) and Rule 8 (Delayed Effect) remains a trap. A future Senate could repeal Rule 5, pass a controversial amendment by simple majority, and then have the repeal rescinded before September, leaving the controversial amendment in a legal limbo. We should recommend this interpretive motion be drafted for the next academic year.
