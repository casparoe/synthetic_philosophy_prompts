answer: |-
  Your hunch is remarkably astute and, I think, lands very close to the center of the target. You have correctly identified that the endurance of the problem of the unity of the proposition, specifically regarding Bradley's Regress, is less about a missing empirical discovery or a hidden formal proof and more about a fundamental divergence in metaphysical methodology. When you look at the landscape from Russell to Armstrong to contemporary fact primitivists, the real friction arises from differing intuitions about what requires explanation and what counts as a legitimate stopping point. One camp operates with a combinatorial intuition, believing that complexes must be constructed from simpler constituents and that the principle of combination itself demands an ontological ground. The other camp operates with a holistic or primitivist intuition, arguing that the unity of a fact or proposition is prior to its constituents, or at least that the tying relation is internal to the nature of the constituents themselves. Because these starting points are essentially axiomatic commitments about the nature of explanation rather than derivable conclusions, the debate often feels like two ships passing in the night, each accusing the other of mystery while harboring their own.

  However, while your diagnosis of the methodological clash is correct, I would caution against dismissing the possibility of any factual or formal disagreement entirely. There is a substantive conceptual issue buried beneath the methodological temperaments, specifically concerning the coherence of the proposed solutions. When a philosopher posits a non-relational tie to stop the regress, the objection is not merely that this is an arbitrary stopping point, but that the concept itself may be incoherent. If a tie binds, it seems to perform a function, and if it performs a function between distinct entities, it looks relational by definition. To say it is non-relational is not just to stop the regress but to assert a category of being that critics argue is unintelligible. So, while the decision to accept this mystery is methodological, the claim that it is a mystery at all involves a formal claim about the logic of relations and predication. Similarly, those who argue the regress is benign often rely on a specific distinction between a regress that prevents truth and a regress that merely accompanies it. Progress has been made in clarifying this distinction, even if consensus remains elusive. We know more now about what makes a regress vicious than Bradley did, even if we do not agree on whether this specific regress meets the criteria.

  Regarding what would count as progress, I think we need to adjust our expectations away from the model of natural science or formal logic where a problem is solved and closed. In this domain, progress is almost always dialectical and clarificatory rather than resolutive. A genuine advance would not be a proof that fact primitivism is true or that instantiation is a universal, but rather a more precise mapping of the theoretical costs associated with each choice. We have seen some of this in the way contemporary metaphysicians handle theoretical virtues like parsimony and ideological simplicity. For instance, trope theory attempts to dissolve the problem by removing universals from the ontology entirely, thereby changing the terms of the binding problem. Whether this succeeds is debatable, but it represents progress in the sense of exploring the logical space of possibilities more thoroughly. Another form of progress lies in reframing the question away from ontology and toward semantics or cognitive science. If the unity of the proposition is a feature of how minds represent the world rather than how the world is composed, the ontological regress might dissolve into a psychological or linguistic constraint. This doesn't solve the ontological problem for the realist, but it does relocate the burden of proof in a way that can be productive.

  Ultimately, I suspect you are right to feel that nobody is going to be persuaded in the sense of one side conceding defeat to the other. The impasse is sustained by deep-seated intuitions about the structure of reality that are resistant to argument because they function as the framework within which arguments are evaluated. If you believe that all unity must be explained by further entities, you will never accept a primitive unity. If you believe that explanation must stop somewhere to avoid infinite deferral, you will never accept a relational glue that requires further glue. Therefore, the most valuable outcome of this century-long debate is not a solution but a heightened sensitivity to the costs of one's ontological commitments. Progress here is the recognition that every metaphysical system must pay a toll at the gate of unity, and the only choice we have is which toll to pay. We can pay the toll of mysterious non-relational ties, the toll of primitive facts that resist analysis, or the toll of an infinite regress that we claim is benign. Acknowledging that these are live options with comparable trade-offs is itself a form of philosophical maturity. So, while you may not find a knockout argument that ends the debate, you can find clarity in understanding why the debate persists and what each side is purchasing with their theoretical currency. That clarity is likely the only kind of progress available to us on this issue.
