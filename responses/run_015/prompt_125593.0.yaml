answer: |-
  ### Decision Tree: Epistemic Conflict and Truth-Conditionality

  **Instructions:** Start at Node 1. Follow the path dictated by your philosophical intuitions regarding conflicting authoritative claims (e.g., Perception vs. Scripture). The leaves identify your position relative to Jain *anekāntavāda* and its logical neighbors.

  **Node 1: Conflict Resolution**
  When two authoritative sources (e.g., direct perception and scriptural testimony) make contradictory claims about the same object, is it possible for **both** to be valid descriptions of reality?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to Node 2.

  **Node 2: Source of Variance**
  If both are valid, is this because reality itself is indeterminate, or because our access to reality is conditioned by specific parameters (time, place, standpoint)?
  *   **Reality is indeterminate:** Go to **Leaf B**.
  *   **Access is conditioned:** Go to Node 3.

  **Node 3: Moral Scope**
  Does this conditionality apply to prescriptive moral absolutes (e.g., "violence is intrinsically wrong")?
  *   **Yes:** Go to **Leaf C**.
  *   **No:** Go to Node 4.

  **Node 4: Formal Scope**
  Does this conditionality apply to formal or abstract truths (e.g., mathematical propositions or laws of logic)?
  *   **Yes:** Go to **Leaf D**.
  *   **No:** Go to Node 5.

  **Node 5: Phenomenological Scope**
  Does this conditionality apply to immediate first-person reports (e.g., "I am in pain" or "I am conscious")?
  *   **Yes:** Go to **Leaf E**.
  *   **No:** Go to Node 6.

  **Node 6: Systematicity**
  Can the conditions under which a claim is true be fully enumerated into a fixed set of modes (e.g., exactly seven logical possibilities)?
  *   **No (Ad-hoc context):** Go to **Leaf F**.
  *   **Yes (Fixed schema):** Go to Node 7.

  **Node 7: Logical Consistency**
  In cases of conditioned truth, does the Law of Non-Contradiction fail, or does it hold provided terms are indexed to their conditions?
  *   **Fails (True Contradictions):** Go to **Leaf G**.
  *   **Holds (Indexed Terms):** Go to Node 8.

  **Node 8: Ontological Commitment**
  When we index a claim to a condition, are we modifying the *predicate* (what is said) or the *subject* (the mode of the substance being described)?
  *   **Predicate only (Linguistic):** Go to **Leaf H**.
  *   **Subject (Ontological):** Go to Node 9.

  **Node 9: Exhaustibility**
  Is the full nature of the subject exhaustible through the fixed modes, or do the modes point toward an ineffable synthesis?
  *   **Ineffable Synthesis:** Go to **Leaf I**.
  *   **Exhaustible via Modes:** Go to **Leaf J**.

  ***

  ### Taxonomy Leaves

  **Leaf A: Hardline Absolutism (*Ekāntavāda*)**
  *   **Position:** One source must be false; truth is singular and unconditioned.
  *   **Relation:** The primary foil to Jainism; assumes conflict implies error.

  **Leaf B: Radical Ontological Indeterminism**
  *   **Position:** Reality has no fixed nature; truth is fluid because the world is.
  *   **Relation:** **Logically open but unheld.** Gap is **incoherent**: if reality is wholly indeterminate, the claim "reality is indeterminate" cannot itself be stably true.

  **Leaf C: Ethical Contextualism**
  *   **Position:** Moral duties (like *ahiṃsā*) are contingent on standpoint.
  *   **Relation:** **Logically open but unheld.** Gap is **unattractive**: undermines the soteriological foundation of Jainism where ethics is the prerequisite for correct seeing.

  **Leaf D: Mathematical Contextualism**
  *   **Position:** Formal truths (2+2=4) are standpoint-dependent.
  *   **Relation:** **Logically open but unheld.** Gap is **incoherent**: formal truths are typically defined as necessary and independent of empirical standpoints.

  **Leaf E: Radical Phenomenological Contextualism**
  *   **Position:** Even first-person experience is standpoint-relative (no privileged access).
  *   **Relation:** **Radical Contextualist.** Extends *anekānta* beyond the traditional Jain limit of empirical/ontological claims into private qualia.

  **Leaf F: Moderate Pluralism**
  *   **Position:** Truth is conditional, but there is no fixed system for mapping the conditions; handled case-by-case.
  *   **Relation:** Common in modern comparative philosophy; lacks the rigorous logical structure of the *saptabhaṅgī*.

  **Leaf G: Dialetheism**
  *   **Position:** Contradictions can be literally true (A and not-A).
  *   **Relation:** **Logically open but unheld.** Gap is **unattractive** to Jains: violates the core commitment to *ahimsa* in logic (non-violence toward truth-values).

  **Leaf H: Linguistic Conventionalism**
  *   **Position:** The object is fixed; only our language requires qualification (*syāt*).
  *   **Relation:** A reductionist reading of Jainism; denies the ontological depth of *naya*.

  **Leaf I: Apophatic Synthesis**
  *   **Position:** The modes are useful, but the ultimate truth transcends all enumeration.
  *   **Relation:** Mystical interpretation; risks collapsing into skepticism (*ajñānavāda*).

  **Leaf J: Standard Jain Realism (*Anekāntavāda* with *Saptabhaṅgī*)**
  *   **Position:** Truth is conditioned, systematic (7 modes), logically consistent (indexed), and ontologically grounded (substance/mode).
  *   **Relation:** The orthodox position; restricts conditionality to empirical/ontological claims while preserving moral and logical absolutes.
