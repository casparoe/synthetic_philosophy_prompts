prompt: |-
  I'd like your help making sense of a situation that's been nagging at me for a few months. A friend of mine and I both got into estimating the odds that a mid-sized software company — one we both know reasonably well, and one where we each have some skin in the game, since we're both trying to decide whether to put a modest amount of our own money into it — would still be a going concern five years from now. We did the work independently: we read the same public filings, looked at the same market and hiring data, and even ended up interviewing two of the same former employees. When we compared notes, I had landed on roughly 55% and she had landed on roughly 20%. We then talked it through over the course of a couple of weeks — walking through each other's reasoning line by line, double-checking the arithmetic, and stress-testing each other's assumptions. Neither of us found a clear error, and neither of us moved meaningfully. We both regard the other as a sharp, careful, and honest reasoner, and we're both confident that the other has seen essentially the same evidence we have.

  I take forecasting and calibration pretty seriously — I keep a personal calibration log and I've read a fair amount on the topic — so this one has been especially uncomfortable. The thing that keeps bothering me is the structure of it: if we really did start from the same information, and we're both reasoning as well as we can, then shouldn't we have converged? The fact that we didn't seems to imply that one of those assumptions is false, but I can't tell which one, and I don't even know what it would mean in practice to check whether we actually shared a starting point. I'd like to understand what a persistent gap like this really tells me — about her reasoning, about mine, or about the shape of the disagreement itself — and what I should do about it. Concretely: should I split the difference, should I treat her 20% as a genuine piece of evidence that I'm overconfident, should I try to hunt down the one piece of information we don't actually share, or is there some reason to just accept that two careful people can rationally end up this far apart?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Situation:** The user and a friend independently estimated the 5-year survival probability of a mid-sized software company.
      *   **Estimates:** User = 55%, Friend = 20%.
      *   **Process:** Independent work, same public data, same interviews, extensive discussion (line-by-line reasoning, arithmetic check, assumption stress-testing).
      *   **Outcome:** No convergence. Neither found errors in the other's logic. Both respect each other's rationality and honesty.
      *   **User's Background:** Takes forecasting/calibration seriously (keeps logs, reads literature).
      *   **Core Question:** Why didn't we converge (Aumann's Agreement Theorem vibe)? What does this gap tell me? What should I do (split difference, update, hunt for info, accept disagreement)?

  2.  **Initial Assessment & Theoretical Framework:**
      *   *Aumann's Agreement Theorem:* This is the elephant in the room. Ideally, two rational agents with common priors and common knowledge of each other's posteriors should not agree to disagree. The fact that they *did* agree to disagree suggests a violation of the theorem's conditions.
      *   *Possible Violations:*
          *   Different Priors (most likely).
          *   Different Likelihood Functions (how evidence is interpreted).
          *   Bounded Rationality (computational limits, though they tried hard).
          *   Hidden Information (maybe they *didn't* actually share *all* info, despite thinking they did).
          *   Ambiguity in the Question (what does "going concern" mean exactly?).
      *   *Practical Forecasting:* In the real world, persistent disagreement among experts is common. It often signals high uncertainty or structural model divergence.

  3.  **Deconstruct the Disagreement:**
      *   **Evidence:** They claim to have the same evidence. But did they *weight* it the same?
      *   **Models:** Did they use different mental models of how software companies fail? (e.g., User focuses on product-market fit, Friend focuses on cash burn/macro).
      *   **Priors:** What was their baseline belief before looking at the specific company? (Base rate neglect vs. inside view).
      *   **Definition:** Does "going concern" mean the same thing? (Bankruptcy vs. acquisition vs. stagnation).

  4.  **Formulate Advice/Action Plan:**
      *   *Acknowledge the discomfort:* Validate that this is a known phenomenon in forecasting circles (Tetlock, Superforecasting).
      *   *Explain *Why* Convergence Failed:* Move beyond Aumann to practical cognitive science.
          *   Priors differ.
          *   Likelihood functions differ (interpretation of ambiguity).
          *   Hidden variables (tacit knowledge).
      *   *Actionable Steps:*
          *   **Don't just split the difference:** 55% and 20% average to 37.5%. Is that useful? Maybe, but understanding *why* is better.
          *   **Treat the friend's estimate as evidence:** Yes, definitely. If you trust their calibration, their 20% should pull your 55% down significantly, even if you don't know why.
          *   **Re-examine the Question:** Is the proposition well-defined?
          *   **Pre-Mortem/Scenario Planning:** Instead of arguing probabilities, argue *stories*.
          *   **Decision vs. Belief:** Does the decision (invest or not) actually hinge on this specific probability? What's the EV?

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's feeling. It's a classic "Agreeing to Disagree" puzzle. Mention Aumann but ground it in reality.
      *   *Section 1: Why Aumann Didn't Apply.*
          *   Priors: Did they start with different base rates for "mid-sized software companies"?
          *   Likelihoods: How do they interpret "hiring data"? (User: Growth! Friend: Bloat!)
          *   Tacit Knowledge: Did the interviews land differently? (Tone, hesitation).
      *   *Section 2: What the Gap Tells You.*
          *   It signals *fragility*. The thesis is not robust.
          *   It highlights *model divergence*. You are looking at different risk factors.
      *   *Section 3: What To Do (Concrete Advice).*
          *   *Update:* You must update. If you trust her, your 55% is likely too high. Bayesian update on *her opinion* as data.
          *   *Define Terms:* Ensure "going concern" is identical.
          *   *Focus on Decision:* Expected Value. If the upside is 10x and downside is -100%, does 20% vs 55% change the bet?
          *   *The "Outside View":* Check base rates for this specific sector/size.
      *   *Section 4: The "Hidden Information" Hypothesis.*
          *   Maybe the "same interviews" yielded different subjective data.
      *   *Conclusion:* Summarize. The gap is a feature, not a bug. It's a risk signal.

  6.  **Refining the Tone:**
      *   Needs to be analytical, respectful of their forecasting rigor, but practical.
      *   Avoid saying "you're wrong." Instead, say "your models differ."
      *   Use forecasting terminology (priors, likelihoods, base rates, EV) since the user is familiar.

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, should I tell them to split the difference?* No, that's naive averaging. Better to suggest Bayesian updating on the *fact of the disagreement*.
      *   *Is 55% vs 20% actually that far?* In log-odds, it's significant. 55% is slightly better than a coin flip. 20% is "likely to fail." That's a regime change.
      *   *Investment Context:* This is crucial. If they are investing, risk tolerance matters.
      *   *Aumann's Theorem:* Be careful not to overstate it. It assumes logical omniscience. Humans aren't logically omniscient.

  8.  **Final Polish:** Organize into clear headings. Ensure the distinction between *epistemic* (what is true) and *pragmatic* (what to do) is clear. (This aligns with the user's request for "what this tells me" and "what I should do".)

  **(Self-Correction during drafting):** I need to make sure I address the "same evidence" claim. They *think* it's the same, but subjective interpretation makes it different. I should emphasize the difference between *data* and *evidence*. Data is objective; evidence is data + interpretation.

  9.  **Final Structure:**
      1.  Validate the experience (Aumann vs. Reality).
      2.  Diagnose the divergence (Priors, Likelihoods, Tacit Info).
      3.  Actionable Steps (Update on the disagreement, Check Base Rates, Decision Matrix).
      4.  Reframing the gap (Risk signal).

  10. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a fascinating and deeply uncomfortable spot to be in, especially for someone who values calibration. You are bumping up against the real-world limits of **Aumann's Agreement Theorem**.

  The theorem states that two rational agents with common priors and common knowledge of each other's posteriors cannot agree to disagree. Since you *have* agreed to disagree, one of the theorem's conditions must be violated. Given that you've stress-tested the arithmetic and the logic, the violation isn't in your calculation; it's in the inputs or the processing function.

  Here is a breakdown of what this gap likely signifies, why convergence failed, and how to translate this epistemic puzzle into a practical investment decision.

  ### 1. Why You Didn't Converge
  You assumed you started from the "same information." In forecasting, this is almost never strictly true. Here are the three most likely culprits for the divergence:

  **A. Different Priors (The Base Rate Problem)**
  Did you enter the analysis with the same baseline probability for a "mid-sized software company" surviving five years?
  *   **You** might implicitly be using a base rate of "successful Series B/C tech companies" (higher survival).
  *   **She** might be using a base rate of "software companies in a high-interest rate environment" (lower survival).
  If your starting priors differ by a factor of 2x, and the evidence you found is ambiguous (which it usually is), you will end up with posteriors that remain far apart even after identical updates.

  **B. Different Likelihood Functions (Interpretation of Ambiguity)**
  You saw the same data, but did you weigh it identically?
  *   **Hiring Data:** You might see "hiring slowdown" as *efficiency*. She might see it as *stagnation*.
  *   **Interviews:** You spoke to the same former employees, but did you hear the same tone? If a former employee hesitated when asked about leadership, you might have discounted it as nerves; she might have coded it as a red flag.
  *   **The Model:** You are likely running different mental simulations of *how* the company fails. You might be modeling risk as "product obsolescence" (low risk), while she is modeling risk as "cash flow crunch" (high risk).

  **C. Tacit Knowledge**
  You mentioned you both know the company "reasonably well." One of you may have a piece of tacit knowledge you don't realize is influencing your judgment. Perhaps you had a positive interaction with a vendor they use; perhaps she had a negative experience with a competitor in the same space. This "hidden prior" acts as a weight on the evidence that the other person cannot see or replicate.

  ### 2. What the Gap Tells You
  The persistence of the gap is itself a data point. It tells you three specific things:

  1.  **The Thesis is Fragile:** If the survival probability swings from 20% to 55% based on reasonable interpretations of the same data, the company's fate is highly sensitive to variables you cannot currently observe. The "signal-to-noise" ratio of your due diligence is low.
  2.  **You Are Looking at Different Risks:** The disagreement likely maps to different risk buckets. If you can isolate *which* risk factor drives her 20% (e.g., "She thinks churn will spike in Q4"), you have identified a specific hypothesis to monitor.
  3.  **Uncertainty is Underpriced:** The market (or your internal model) likely wants to treat this as a binary "go/no-go." The gap suggests the correct stance is "high variance."

  ### 3. What You Should Do
  You asked whether to split the difference, update, hunt for info, or accept the disagreement. Here is the recommended hierarchy of actions:

  **Step 1: Bayesian Update on *Her*, Not Just the Company**
  You trust her reasoning and calibration. Therefore, **her estimate is evidence.**
  Even if you cannot reconcile the *logic*, the *fact* that a calibrated forecaster you trust assigns 20% probability should pull your estimate down.
  *   If you treat her 20% as a data point, your 55% is likely overconfident.
  *   *Action:* Do not simply average to 37.5%. Instead, ask: "Given that she sees something I don't, how much should I discount my optimism?" A move toward 40% might be more honest than holding at 55%.

  **Step 2: Audit the Base Rates (The Outside View)**
  Stop looking at the company for a moment. Look at the reference class.
  *   What is the actual 5-year survival rate for software companies of this size, in this sector, with this revenue profile?
  *   If the base rate is 30%, your 55% requires strong specific evidence to justify. If the base rate is 60%, her 20% requires strong specific evidence.
  *   Often, disagreements like this arise because one person is anchored in the *Inside View* (this specific team is great!) and the other is anchored in the *Outside View* (most companies like this die!). Align on the base rate first.

  **Step 3: Decision Analysis (Expected Value)**
  Separate the *probability* from the *decision*.
  *   Does the investment make sense at 55%? Yes.
  *   Does it make sense at 20%? Probably not (unless the upside is massive).
  *   Does it make sense at the "consensus" 37.5%?
  *   *Crucial Question:* What is the payoff structure? If the company survives, do you 10x? If it fails, do you lose 100%?
      *   If the upside is capped, the 20% risk of ruin might kill the Expected Value (EV).
      *   If the upside is uncapped (venture style), you might tolerate a lower probability of success.
      *   **Recommendation:** Calculate the EV using *her* 20% and *your* 55%. If the investment is only positive EV at your estimate, **do not make the investment.** The disagreement indicates you do not have an "edge" sufficient to override the risk of ruin.

  **Step 4: Hunt for the "Hidden Variable"**
  Since you couldn't find an error in logic, look for an error in *scope*.
  *   Sit down and ask: "What is the single scenario in which this company definitely fails?"
  *   If she describes a scenario you hadn't considered (e.g., "A specific regulatory change" or "Dependency on a single API"), you have found your missing information.
  *   If she describes a scenario you considered but dismissed, ask *why* you dismissed it. That weighting difference is your prior divergence.

  ### Summary Advice
  **Do not ignore the gap.** In forecasting, persistent disagreement among experts is often a stronger signal than the consensus estimate.

  1.  **Update Down:** You should lower your probability. The existence of a credible dissenting view is evidence against your hypothesis.
  2.  **Check the EV:** If the investment relies on your 55% to be profitable, pass. The disagreement proves you don't know enough to bet confidently.
  3.  **Reframe the Goal:** Stop trying to find the "true" probability. It doesn't exist yet. Instead, treat the 20%–55% range as the **risk premium**. The wider the gap between smart people, the higher the required return should be to justify the capital.

  You haven't failed at forecasting; you've successfully identified that this specific proposition is currently **unforecastable** with high precision. The rational move in the face of unforecastable risk is to either demand a higher premium or reduce exposure.
