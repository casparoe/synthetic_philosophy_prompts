answer: |-
  **ASA Adjudication on Vocabula Private Ltd**

  **Case Reference:** A1298442
  **Date:** 14 October 2023
  **Sector:** Software and Applications
  **Complainant:** CommonSpeak Ltd

  **Claims**
  The adjudication concerns claims made on the advertiser's website and app store listing for 'Solips', a lexical application.
  1. "A vocabulary for the bits of your inner life nobody else can check."
  2. "Generate a meaning that only you could have."

  **Complaint**
  CommonSpeak Ltd, a competitor in the language learning sector, challenged whether claims 1 and 2 were misleading and could be substantiated. They argued that while internal sensations were private, the assignment of linguistic meaning required shared criteria, and therefore claim 2 implied an impossible functionality.

  **Response**
  Vocabula Private Ltd stated that the app allowed users to tag pre-linguistic sensations with unique identifiers, such as the founder's proprietary term 'Qwilp'. They submitted that the sensation was real and recurrent. To demonstrate consistency, they provided a diary log detailing 400 instances of 'Qwilp' over six months, noting the physiological context of each occurrence. They further submitted a sealed envelope containing a physical token intended to act as the referent for the term, accessible only to the founder.

  Regarding the panel, Vocabula noted that the usage panel consisted of one subject (the founder), as the inclusion of a second subject would invalidate the privacy condition. They argued that the claim did not promise communicability, but rather accurate internal indexing. A legal representative for Vocabula stated: "We maintain that the product's value proposition is secured by the structural inability of the user to be wrong." They insisted the box obviously did have something in it, and that the physical presence of the token confirmed the existence of the referent.

  **Assessment**
  Not upheld (Claim 1); Upheld (Claim 2).

  The ASA considered how consumers would interpret the claims. We understood claim 1 to suggest that the app provided terms for subjective experiences that were inaccessible to external observation. We understood claim 2 to suggest that the user could generate a semantic definition that was valid solely within their own internal framework, independent of shared usage rules.

  Regarding claim 1, we noted that it is generally accepted that individuals have access to subjective sensations that others cannot directly verify. We considered that consumers would understand "nobody else can check" as a statement regarding privacy of experience rather than semantic validity. On that basis, claim 1 was not misleading.

  Regarding claim 2, we considered whether the advertiser had provided sufficient evidence that a "meaning" could be generated that only one person could have. While we accepted that sensations were private, we considered that the concept of "meaning" in a linguistic context implied a rule-governed usage that could, in principle, be checked for consistency. The advertiser's diary log demonstrated that the word was used repeatedly, but not that it was used according to a stable rule. To confirm the word was being applied consistently, the advertiser simply applied it again in their submission. We noted that this was not evidence of consistency, but merely further instances of the claim.

  The advertiser argued that the sealed envelope confirmed the existence of the referent. We accepted that the box obviously did have something in it; that was rather the problem. The presence of an object did not establish a link between the object and the word that could be distinguished from the user simply believing there was a link. Without the possibility of external correction, the claim that a "meaning" had been generated was unsubstantiated.

  While we noted the advertiser's submission that the value lay in the "structural inability of the user to be wrong", we considered that this confirmed the claim was misleading. A system where error is impossible is not a system of meaning, but of assertion. Consumers would expect a vocabulary to imply a distinction between correct and incorrect usage, even if private. The evidence provided did not support the implication that a functional semantic structure had been created.

  On that basis, claim 2 was upheld.

  **Action**
  The claims must not appear again in their current form. We told Vocabula Private Ltd not to imply that users could generate private meanings independent of shared criteria without holding adequate substantiation.
