      *   *Standard Contrast:* "Peirce = Realist, James = Psychologist."
      *   *Critique:* In this case, Peirce's realism is threatened by the *alienation* of the community. James's psychologism is threatened by the *absence* of the psyche in the generator.
      *   *Peirce's Misgivings:* Peirce disliked James's "will to believe." Here, Peirce might find James's view collapses into "truth is what works for the humans to accept," ignoring the machine's role in *finding* the truth. Peirce might admit the machines are inquirers (synechism), whereas James cannot (no stream of consciousness).
