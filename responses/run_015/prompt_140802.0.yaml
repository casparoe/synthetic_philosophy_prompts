answer: |-
  Dear colleague,

  You have asked me to step back from the usual metaphysical heavyweight fighting about scientific realism and instead focus on the practical logic of ranking imperfect narratives. This is a sensible shift. When we argue about whether later scientific theories are closer to the truth than earlier ones, we are often fighting over whether truth is even the aim of science. But when you are trying to decide whether one eyewitness account of a hall argument is better than another, the aim is fixed. We know there was a truth about the number of people and the timing, and we want a metric that tells us which lie is the better lie. I have spent some time turning your cases over, and I want to be honest with you immediately: the list of requirements you need is coherent, but satisfying them jointly is where the formal work collapses. I will lay out the requirements as you asked, but I will not pretend they fit together neatly, because the history of this subject suggests they do not.

  Let us start with the baseline, which you rightly identify as non-trivial. Any theory we consider must allow for the possibility that one false account is closer to the truth than another. Popper's original definition failed this test catastrophically. He defined truthlikeness as truth content minus falsity content. The problem, as you know, is that if a theory is false, adding any true consequence increases its truth content, but adding any false consequence increases its falsity content, and the logical relations are such that you cannot compare two false theories without one swallowing the other in content. Tichý and others showed in the mid-seventies that on Popper's definition, no false theory is closer to the truth than any other false theory. So, our first requirement is simply that the metric must yield a comparative verdict between false accounts. If the theory returns a tie or an error whenever both accounts contain errors, it is useless for your job.

  Moving to your first case, the tension between the bold and the cautious account, we need what I will call the Content-Accuracy Trade-off requirement. The account that says forty-one people and before the vote is bold and wrong on both counts. The account that says between twenty and eighty people and some argument around the vote is cautious and technically correct on the range, though vague. A theory that always rewards caution will tell you that the vague account is closer to the truth because it avoids falsity. A theory that always rewards boldness will tell you the specific account is closer because it says more, even if it is wrong. You need a theory that balances these. It must penalize error enough that reckless precision does not win, but it must reward informativeness enough that hedging does not win by default. This is the first place where the work gets hard, because you are asking for a weighted average of two opposing virtues.

  Your second case, the irrelevant conjunction of the Vienna fact, raises the Topic Restriction requirement. If I take the false account about the hall and conjoin it with the true statement that Vienna is the capital of Austria, the logical content of the account increases. A pure content theory might say this new conjunction is closer to the truth because it contains more truth. But intuitively, for your purposes, it is not. It is just noise. You want a theory that is insensitive to the addition of truths that are irrelevant to the episode in question. This is often dismissed by formalists as a technical annoyance, but for your job of ranking historical accounts, it is substantive. If we allow irrelevant truths to boost the score, anyone can game the system by appending a textbook of geography to their eyewitness testimony. So I am listing this as a hard requirement: verisimilitude must be relative to a subject matter, not just logical content.

  This leads me to the third case, which you care about most, the problem of omission versus error. Account A gives a true cause but omits the larger one. Account B gives both causes but gets the date wrong. Here we need the Silence Penalty requirement. Standard theories of truthlikeness often treat theories as deductively closed sets of sentences. If you treat them that way, omission is impossible because if a theory is true, all its consequences are included. But historical accounts are not deductively closed; they are selections. If we treat them as answers to a fixed set of questions, then omission is a failure to answer. I argue that for your job, silence must count against truthlikeness, but not as heavily as falsity. Account A is incomplete, which is a defect in informativeness. Account B is informative but erroneous. A theory that ignores omission will rank A and B based solely on the error in B, potentially making A look better than it should given its explanatory weakness. A theory that penalizes omission too heavily will make B look better despite its error. You need a metric that treats omission as a loss of truth-content without treating it as the presence of falsity. This is conceptually distinct from the boldness case because it concerns the scope of the explanation, not just the precision of the claims.

  Your fourth case is the one that has caused the most damage in the literature, the problem of language dependence. If I describe the temperature in Celsius and you describe it in Fahrenheit, or if I use a vocabulary of hot and cold and you use precise degrees, the logical relations between the statements change. Miller demonstrated that most logical definitions of truthlikeness are not invariant under translation. If a theory says Account X is closer to the truth than Account Y in one vocabulary, it might say the reverse in a coextensive vocabulary. You want the Language Invariance requirement. This seems like a basic demand of objectivity; the closeness to the truth should not depend on how we describe it. However, I must warn you that this is where the formal impossibility results live. Satisfying this while maintaining the Content-Accuracy Trade-off is notoriously difficult.

  Case five asks about comparability. One account gets the order right and numbers wrong; the other gets numbers right and order wrong. You ask if we need a total ordering. I think here we should adopt the Partial Ordering requirement. There is no philosophical reason to think that every pair of false accounts is comparable. Sometimes errors are incommensurable. Requiring a total ordering is a desire for tidiness, not a requirement of truth. If a theory forces a ranking where our intuitions say the accounts are just different kinds of wrong, that theory is overreaching. So I am marking this as a negative requirement: the theory must not force comparability where none exists.

  Case six concerns the form of the account. You want to rank timelines and maps, not just sentences. This is the Representational Generality requirement. Most truthlikeness theories are built on propositional logic. They cannot handle a map without translating the map into sentences, which loses spatial information. If your job involves non-sentential artifacts, the theory must be ontologically neutral. It must measure closeness in terms of states of affairs or structures, not just truth values of propositions.

  Finally, case seven is about evidence. Must it be possible to know that one account is closer than another? This is the Epistemic Accessibility requirement. I am marking this as camp-relative. If you are a scientific realist, you might say truthlikeness is a metaphysical relation that holds regardless of our evidence; we might never know which account is closer, but one is. If you are a pragmatist or a problem-solver, you will insist that a notion of closeness that is in principle undetectable is useless. For your specific job of ranking historical accounts, I suspect you need the pragmatist version. If you cannot defend the ranking with evidence, the ranking is academic. So for your purposes, I would insist on this requirement, but I acknowledge it excludes metaphysical realist accounts of truthlikeness.

  Now I must give you the bad news regarding the joint satisfaction of these requirements. There is a subset of these that cannot be satisfied together by any known formal theory, and likely not by any theory at all. The conflict lies between the Content-Accuracy Trade-off, the Topic Restriction, and Language Invariance. The proof, essentially, is Miller's demonstration. If you define closeness using logical content to satisfy the trade-off, you fail language invariance. If you define it using likeness or similarity to satisfy language invariance, you struggle to define relevance formally without smuggling in language-dependent predicates. You cannot have a measure that is sensitive to logical content, insensitive to irrelevant conjunctions, and invariant under all logical transformations of the vocabulary. One of these must give. Furthermore, the Silence Penalty requirement is incompatible with any theory that treats accounts as standard logical theories, because standard theories are deductively closed. To satisfy the omission requirement, you must change the ontology of what an account is, moving from sets of sentences to something like sets of questions or partial structures.

  If I had to pick the single requirement that does the most work in excluding candidate theories, I would point to Language Invariance. It is the hammer that broke Popper's account and continues to break logical content accounts. It forces you away from pure logic and toward semantic or structural definitions of likeness, which are harder to formalize rigorously. However, for your specific job of ranking historical episodes, I suspect the Silence Penalty is the practical killer. Most off-the-shelf theories of truthlikeness simply cannot handle omission because they are designed for scientific theories where completeness is assumed or irrelevant. If you adopt a standard theory, you will be unable to distinguish between a lie of omission and a truth, which defeats your purpose in Case three.

  Let me briefly score the three approaches you mentioned against this list. The first approach, adding up true consequences and subtracting false ones, is the content and consequence model. It satisfies the Baseline and handles the Content-Accuracy Trade-off reasonably well by weighting logical strength. However, it fails the Topic Restriction requirement because irrelevant truths increase content. It also fails Language Invariance due to Miller's result. It completely fails the Silence Penalty because it assumes deductive closure; omission is not a category in this system. It scores poorly for your specific needs.

  The second approach, taking likeness literally using possible worlds, handles Language Invariance much better because similarity can be defined structurally. It also handles the Content-Accuracy Trade-off well by measuring distance in state-space. However, it struggles with Topic Restriction because defining similarity often requires a metric that weights all features equally unless you build in relevance by hand. It also struggles with Representational Generality; mapping a timeline onto a possible world space is non-trivial. It handles the Silence Penalty better than the content approach if you treat worlds as partial, but standard possible worlds are total, so silence is still hard to model. It is a stronger candidate but requires significant modification.

  The third approach, counting only relevant consequences, is the most promising for your job. It satisfies Topic Restriction by definition. It can handle the Silence Penalty if relevance is defined by a set of questions that must be answered. It avoids the irrelevant conjunction problem. However, it struggles with Language Invariance because defining relevance often depends on the vocabulary used. It also faces the Epistemic Accessibility challenge; determining relevance can be subjective. But for ranking historical accounts where the questions are fixed by the episode, this approach seems most fit for purpose, provided you can accept that relevance is fixed by your interests rather than by logic alone.

  In sum, you are asking for a tool that does not exist in a finished form. You need a theory that is sensitive to omission, invariant under description, and restricted to relevant content. The formal literature suggests you can have two of these, but not all three. If I were in your position, I would sacrifice strict Language Invariance in favor of the Silence Penalty and Topic Restriction. For historical episodes, the vocabulary is usually fixed by the event itself, so the language dependence problem is less acute than in physics. But the inability to penalize omission would render your rankings useless for explaining causes. I would look toward a question-relative account of truthlikeness, where closeness is measured by how well the account answers the specific questions posed by the episode, accepting that this makes the metric relative to our interests. It is not a pure measure of truth, but for your job, it is the only one that will work.

  I hope this helps you navigate the trade-offs. It is a messy business, but then, so are eyewitness accounts.

