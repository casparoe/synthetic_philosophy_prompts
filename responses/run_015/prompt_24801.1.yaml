      *   *Mapping:*
          *   Set Point $\rightarrow$ Prior Preferences (log probability of states).
          *   Error Signal $\rightarrow$ Prediction Error (variational free energy gradient).
          *   Actuator $\rightarrow$ Motor effector / Synaptic update.
          *   Acting on World $\rightarrow$ Active Inference (changing sensory input).
          *   Acting on Model $\rightarrow$ Perceptual Inference (changing internal states).

  4.  **Task 2: Identify Breaking Points (The Crucial Analysis):**
