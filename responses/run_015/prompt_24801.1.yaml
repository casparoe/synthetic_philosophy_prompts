      *   *The Proponent's Defense:* FEP proponents (Friston et al.) argue that homeostasis is a *consequence* of FEP, not the mechanism itself. The mechanism involves inference, generative models, and active sampling, which a simple thermostat lacks.

  3.  **Task 1: Correspondence Table:**
