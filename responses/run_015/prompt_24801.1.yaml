      *   *Does the conclusion survive disanalogies?* No. Once you introduce *inference* over hidden causes and *planning* via Expected Free Energy, the principle moves from "maintain variable X" to "learn the structure of the world to maintain variable X while reducing uncertainty." This is non-trivial because it specifies *how* adaptation happens (Bayesian model updating) and predicts phenomena like curiosity, saccadic eye movements, and hallucinations (prior-dominated inference), which homeostasis does not.
      *   *Verdict:* The triviality charge holds only if one ignores the *generative* and *temporal* aspects of FEP. The thermostat analogy strips these away, making the critique a straw man of the full mathematical formulation.

