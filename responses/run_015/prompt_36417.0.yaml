prompt: |-
  My brother-in-law and I have this recurring argument whenever he's in town, and I want to bring numbers to it instead of vibes this time. He's a physicist, firmly of the view that special relativity more or less *settles* the debate about the passage of time: relativity of simultaneity plus the Rietdijk–Putnam style argument means distant future events (the Andromeda kind of example, where a passing pedestrian's frame makes a spaceship launch tens of light years away already "fixed" while mine doesn't) are as determinately real as the present, so the growing-block/presentist picture of an objectively unfolding now is just medieval nostalgia with better math notation. I'm more of the "hmm, but 'real for a frame' was doing a lot of unexamined work in that argument" persuasion, though I hold that loosely.

  So give me your actual credence that special relativity by itself -- no quantum gravity, no thermodynamics handwaving, just Minkowski spacetime and the relativity of simultaneity -- is enough to establish eternalism / the block universe over presentism. Not a hedge, a number. And decompose it for me: roughly, the probability that the Rietdijk–Putnam reasoning is valid as an argument (i.e., that "real in some frame" plus some transitivity assumption about determinate reality actually gets you to "future events are real simpliciter"), the probability that presentism is genuinely compatible with Minkowski spacetime (via a preferred foliation nobody detects, or shrinking down to a point-present, or whatever else), the probability that the whole dispute is verbal -- that eternalists and presentists are talking past each other about what "real" means rather than disagreeing about the spacetime, and any other terms you think belong in there. Multiply or otherwise combine them out and show your work, then tell me which term the final number is most sensitive to.

  And one more thing: my brother-in-law's number is like 0.9, mine is maybe 0.55 and dropping the more I think about it. Where does the disagreement between a physicist at 0.9 and someone like me at 0.55 most likely actually live -- is he overrating the metaphysical content of a coordinate transformation, am I underrating how much of a cost a hidden preferred foliation is, or is it something else entirely? Also, what argument or consideration would move your number the most in either direction? I want to be able to say "well, decomposed like this, here's where we split" next time he brings it up over dinner.
