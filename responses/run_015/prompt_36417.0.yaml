answer: |-
  Here is my decomposed credence, the math behind it, and the map of where your dinner argument is actually happening.

  ### The Number
  My credence that Special Relativity (SR) *alone* is sufficient to logically establish Eternalism (the Block Universe) over Presentism is **0.65**.

  I am siding closer to you than your brother-in-law, but I am acknowledging that SR makes Presentism extremely expensive. Your brother-in-law's 0.9 assumes the physics does the metaphysical work for him. Your 0.55 assumes the metaphysics is independent of the physics. The truth is in the friction between the two.

  ### The Decomposition
  To get to 0.65, I am treating this as a chain of necessary conditions. For SR to *establish* Eternalism, three specific sub-claims must hold. If any fail, the proof collapses.

  **1. The Transitivity of "Real" ($P_T$): 0.80**
  *   **The Claim:** The Rietdijk–Putnam (RP) argument relies on the premise that "determinate reality" is transitive across frames. If event $E$ is present (and thus real) for Observer $A$, and Observer $A$ is real for Observer $B$, then $E$ must be real for $B$.
  *   **The Risk:** This is the weakest link. "Real" might be a frame-relative predicate (like "simultaneous"). If "real" is relativized, the transitivity fails, and the Block Universe doesn't follow. However, most philosophers grant that *existence* shouldn't be frame-relative, even if *simultaneity* is.
  *   **Probability:** 0.80 (High, but not certain).

  **2. The Rejection of Hidden Foliations ($P_H$): 0.85**
  *   **The Claim:** Presentism can technically survive SR if you posit a "preferred foliation" of spacetime (a universal 'now') that is empirically undetectable (a Lorentzian ether view). For SR to *establish* Eternalism, we must accept that positing an undetectable preferred frame is ontologically unacceptable (violates Ockham's Razor or the spirit of relativity).
  *   **The Risk:** It is logically possible the universe has a hidden 'now' we just can't measure. SR rules it out *operationally*, not *ontologically*. To move from SR to Eternalism, you must add a metaphysical premise: "Do not multiply entities beyond empirical necessity."
  *   **Probability:** 0.85 (Very high cost for Presentism, but not a logical contradiction).

  **3. The Substantiveness of the Dispute ($P_S$): 0.95**
  *   **The Claim:** This is not merely a verbal dispute about the definition of "exists." There is a genuine ontological disagreement about whether the future is open or fixed.
  *   **The Risk:** If Eternalists mean "exists in the manifold" and Presentists mean "exists in the causal past," they might be agreeing on the physics and disagreeing on dictionary definitions.
  *   **Probability:** 0.95 (There are genuine stake-holding differences regarding truth-makers for future contingents).

  **The Calculation:**
  $$ P(\text{SR} \to \text{Eternalism}) = P_T \times P_H \times P_S $$
  $$ 0.65 \approx 0.80 \times 0.85 \times 0.95 $$

  ### Sensitivity Analysis
  The final number is most sensitive to **Term 1: The Transitivity of "Real" ($P_T$)**.

  If you concede that "real" must be an absolute, frame-independent property (as your brother-in-law does), $P_T$ jumps to 1.0, and my total credence shoots up to **0.81** (much closer to his 0.9).
  If you argue that "real" is permissible to be frame-relative (a "relativized existence"), $P_T$ drops to 0.5, and my total credence crashes to **0.40** (validating your skepticism).

  This is the hinge. The physics (Minkowski geometry) is settled. The dispute is entirely about whether the predicate "is real" obeys the same transformation rules as "is simultaneous."

  ### Where You and Your Brother-in-Law Actually Split
  You asked where the 0.55 vs. 0.9 disagreement lives. It is not about the math; you both accept the Lorentz transformations. It is about **Ontological Free Riders**.

  **1. He is overrating the metaphysical content of a coordinate transformation.**
  Your brother-in-law is treating the Minkowski manifold as a *substance*. In his view, because the math treats $t$ as a coordinate geometrically equivalent to $x$, $t$ must be ontologically equivalent to $x$.
  *   **The Error:** Mathematical symmetry does not entail ontological symmetry. We can write Newtonian mechanics in a coordinate-independent way, but that doesn't make space and time equivalent. He is inferring "All times exist equally" from "All times are coordinate-izable equally." That is a category error.

  **2. You might be underrating the cost of a hidden foliation.**
  You are holding open the possibility of Presentism. But to save Presentism in SR, you must accept that the universe conspires to hide the "true now" from every possible experiment.
  *   **The Cost:** This turns the Lorentz invariance of physical laws from a fundamental feature of reality into a massive cosmic coincidence. (Why do all forces contract and dilate exactly enough to hide the ether?)
  *   **The Split:** He sees this coincidence as impossible (hence 0.9). You see it as metaphysically possible (hence 0.55). You are logically right, but he is methodologically right.

  ### How to Move the Needle
  If you want to win (or shift) the argument next time, do not talk about trains and lightning. Talk about **Truth-Makers**.

  **To move his number down (toward you):**
  Ask him: *"What makes the statement 'A sea battle will occur tomorrow' true right now?"*
  *   In the Block Universe, the truth-maker is the future event itself existing in the manifold.
  *   **The Counter:** If the future event exists *now*, in what sense is it the *future*? If it is fixed and determinate, how do we account for the *experience* of uncertainty without invoking illusion? If the passage of time is an illusion, what is the substrate that is being illusorily experienced? SR describes the container, not the content of consciousness. If the Block Universe cannot account for the *phenomenology* of passage, its claim to "establish" reality is incomplete.

  **To move your number up (toward him):**
  Consider **Quantum Field Theory (QFT)**.
  *   SR is classical. In QFT, locality is fundamental. If Presentism were true (a moving 3D slice of reality), how do entangled states across spacelike separations behave?
  *   While QFT doesn't prove Eternalism, it makes the "Hidden Foliation" workaround (your escape hatch) even uglier. A preferred frame in QFT often breaks Lorentz invariance in ways that wreck the Standard Model's renormalizability.
  *   **The Argument:** "I know SR alone doesn't prove it, but the moment you add QFT, the cost of a preferred 'now' goes from 'philosophically annoying' to 'physically broken.'"

  ### The Dinner Table Summary
  Tell him this:
  > "I'll grant you that Minkowski geometry makes Presentism incredibly ugly. It forces Presentists to posit a 'now' that nature actively hides from us. But 'ugly' isn't 'false.' Your 0.9 assumes that because the math treats time like space, reality must treat time like space. My 0.55 holds that the math describes *relations*, not *ontology*. You're conflating the map with the territory. SR proves the Block Universe is the most *efficient* model, but not that it's the only *true* one."

  That concedes his physics while protecting your metaphysics. It usually stops the argument, because he can't refute it without leaving physics and entering philosophy, where his 0.9 credence has no authority.
