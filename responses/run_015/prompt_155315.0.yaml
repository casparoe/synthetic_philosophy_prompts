      *   *Aus vs. Arg:* Settler colonialism. Acemoglu/Robinson (Why Nations Fail) argue institutions (inclusive vs. extractive). The user's hesitation about "human capital/culture" is valid but often endogenous to institutions.
      *   *Botswana vs. Zambia:* Strong institutional argument (diamonds managed well vs. poorly).
      *   *Haiti vs. DR:* Tricky. Geography is similar, but colonial history differs (French sugar/slavery vs. Spanish cattle/ranching). "Culture" is often a proxy for historical institutional path dependence.
      *   *Reversal of Fortune:* Acemoglu et al.'s key evidence against geography. Dense populations got extractive institutions; sparse got inclusive.
      *   *Ethiopia vs. Kenya:* Challenges the "colonialism = bad" simplistic view. Supports the "type of state left behind" nuance.
      *   *Norway vs. Nigeria:* Resource curse mediated by institutions.
      *   *Singapore vs. Malaysia:* Leadership/Institutions.
      *   *Japan:* Major outlier for "colonialism required" or "Western culture required" theories. Fits the "state capacity/modernization from above" model.

  3.  **Synthesize a Coherent Framework:**
      *   The dominant framework in development economics that fits *most* of these is the **Institutionalist View** (specifically Acemoglu, Johnson, Robinson - AJR).
      *   *Core Thesis:* Institutions (rules of the game, property rights, constraints on elites) are the fundamental cause.
      *   *Nuance:* Institutions are not exogenous. They are shaped by history (colonialism, pre-colonial density) and geography (disease environment affecting settlement).
      *   *Culture:* Usually treated as endogenous or secondary. "Culture" explanations often fail to account for rapid changes (like Germany or China).
      *   *Geography:* Direct effects (trade costs, disease) matter, but institutional effects dominate in the long run.

  4.  **Address Specific Questions:**

      *   **Hierarchy:** Yes, roughly Institutions > Historical Path Dependence (Colonialism) > Geography. Culture is usually a residual or a product of institutions.
      *   **Haiti:** Drop the "culture" intuition. Focus on *initial conditions of independence* (debt to France, isolation, racial hierarchy) vs. DR (different colonial economy, later stability). It's institutional/historical, not cultural.
      *   **East vs. West Germany:** Prediction: Convergence, but slow. Institutions can change, but human capital and social norms persist. Reality: West absorbed East, massive transfers, still some divergence in productivity/mindset 30+ years later. Supports institutions + path dependence.
      *   **Chile vs. Argentina:** Chile adopted technocratic institutions early (Pinochet era economic reforms persisted); Argentina suffered populist cycles. Fits the institutional stability argument.
      *   **One Account?** The "Inclusive vs. Extractive Institutions" framework (AJR) gets closest, but it's not perfect. It struggles with *how* bad institutions change (e.g., Singapore's Lee Kuan Yew was authoritarian but built inclusive *economic* institutions).
      *   **Outlier:** Ethiopia vs. Kenya is the trickiest for a simple "colonialism = extractive" story, but fits "state capacity." Japan is the outlier for "Western/Colonial" theories but fits "State-Led Development."
      *   **Japan:** Proves modernization doesn't require Western culture or colonization. It requires **State Capacity** + **Export-Oriented Industrialization** + **Human Capital**. This suggests a refinement: Institutions matter, but *State Capacity* is the specific type of institution needed.

  5.  **Drafting the Response (Iterative Process):**

