answer: |-
  You are essentially reconstructing the last 30 years of development economics in real-time. Your intuitions are not cherry-picking; they align closely with the dominant **Institutionalist Hypothesis** (most famously associated with Acemoglu, Johnson, and Robinson, or AJR).

  However, you are correctly sensing the friction points where that theory strains. Here is an honest breakdown of whether there is a coherent principle, how to handle the outliers, and what the causal inference actually looks like.

  ### 1. The Hierarchy: Is there a ranking?
  Yes, there is a consensus hierarchy that fits 80–90% of your cases:
  **Institutions > Historical Path Dependence (Colonialism/Pre-colonial) > Geography > Culture.**

  *   **Institutions are Fundamental:** Your SK/NK, Botswana/Zambia, and Norway/Nigeria cases are the "gold standard" natural experiments. They show that when you hold culture and geography constant, institutions determine the outcome.
  *   **History Shapes Institutions:** Your Australia/Argentina and Haiti/DR cases aren't contradictions; they are *explanations* for why institutions differ. Australia got British common law and sparse population (allowing inclusive institutions); Argentina got Spanish mercantilism and dense indigenous labor (extractive institutions). Haiti was forced into a crippling debt by France upon independence; DR had a different colonial economic structure (cattle vs. sugar). This is **Path Dependence**, not culture.
  *   **Geography is Conditional:** Geography matters (disease, trade access), but mostly because it influenced *settler mortality*, which influenced *which institutions* Europeans set up (see: Reversal of Fortune).
  *   **Culture is the Residual:** "Culture" is usually what economists say when they can't measure institutions. It is highly endogenous. If you change the incentives (institutions), culture often shifts within a generation (see: East Germany, South Korea).

  ### 2. The Haiti Intuition: Drop the "Culture" Argument
  You asked if you should drop the Haiti culture intuition. **Yes.**
  Invoking "culture" for Haiti is the trap. The divergence is explainable via institutional history:
  1.  **The Independence Debt:** Haiti paid France 150% of its annual GDP (in modern terms) for recognition, draining capital for a century.
  2.  **Diplomatic Isolation:** The US and Europe embargoed Haiti for decades fearing slave revolts, preventing trade integration.
  3.  **Land Tenure:** The revolution broke up plantations into subsistence plots (good for freedom, bad for export scale), whereas the DR retained larger holdings.
  This is institutional and geopolitical strangulation, not a cultural deficit.

  ### 3. The Japan Outlier: State Capacity, Not Just "Institutions"
  Japan is the biggest challenge to a simplistic "Western Institutions = Wealth" model. Japan industrialized without colonization and without Western culture.
  *   **The Fix:** Refine "Institutions" to **State Capacity**.
  *   Japan's Meiji Restoration was a deliberate institutional revolution. They built a high-capacity bureaucracy, enforced property rights, and invested heavily in education *before* full democratization.
  *   **Lesson:** You don't need liberal democracy to grow initially (see Singapore, China, SK in the 60s). You need **credible commitment to property rights** and **export-oriented industrial policy**. Democracy helps sustain wealth, but state capacity creates it.

  ### 4. Predictions Based on This Framework

  **East vs. West Germany (Post-Reunification)**
  *   **Prediction:** Rapid convergence in infrastructure and income, but persistent divergence in social capital and productivity for decades.
  *   **Why:** Institutions (laws, currency, property rights) were swapped overnight. But *informal institutions* (trust, work norms, networks) are sticky.
  *   **Verdict:** This actually happened. 30+ years later, East Germany is still slightly poorer and votes differently. It proves institutions are primary, but culture/social capital creates drag.

  **Chile vs. Argentina (20th Century)**
  *   **Prediction:** Chile outperforms Argentina due to institutional stability, despite Argentina's superior natural endowments.
  *   **Why:** Chile locked in technocratic economic institutions early (even under Pinochet, which persisted post-democracy). Argentina suffered from populist cycles that violated property rights and monetary stability repeatedly.
  *   **Verdict:** Accurate. Chile became the "Jaguar" of Latin America; Argentina defaulted repeatedly. This validates the "constraints on elites" metric over "resource wealth."

  ### 5. Is There One Account That Gets It All?
  The closest single account is **"Inclusive vs. Extractive Economic Institutions"** (from *Why Nations Fail*), but it needs one upgrade: **The State Capacity Nuance.**

  *   **The Standard Account:** Inclusive institutions (property rights, rule of law, open markets) create incentives to innovate. Extractive institutions (expropriation, monopoly, patronage) kill incentives.
  *   **The Upgrade:** You need a state strong enough to enforce the rules, but constrained enough not to break them.
      *   **Somalia** has no extraction because it has no state (Failure).
      *   **North Korea** has a strong state but total extraction (Failure).
      *   **Singapore** has a strong state, low political freedom, but highly inclusive *economic* institutions (Success).
      *   **Japan** built state capacity first, democracy later (Success).

  **The Verdict on Causal Inference:**
  You cannot get 100% certainty. The problem is **Endogeneity**: Do good institutions make countries rich, or do rich countries buy good institutions?
  *   **Your Strongest Cases:** SK/NK and East/West Germany. These are "natural experiments" where the only variable changed was the political system. This is as close to causal proof as history allows.
  *   **Your Weakest Case:** Australia vs. Argentina. Too many variables (distance from markets, commodity price shocks, timing of democratization). It's suggestive, not causal.

  ### 6. Which Verdict Should You Throw Away?
  Throw away the **Ethiopia vs. Kenya** simplification.
  *   *Your intuition:* "Colonialism caused poverty" is too simple.
  *   *The Reality:* Ethiopia's lack of colonization allowed it to retain a feudal aristocracy that blocked modernization longer than British Kenya did. Kenya inherited a colonial state with infrastructure (railways, bureaucracy) that, while extractive, was more integrated into the global economy than Ethiopia's feudal isolation.
  *   *Correction:* It's not "Colonization = Bad." It's "What kind of State did we have before, and what kind was left after?" Sometimes a modernizing colonial bureaucracy is economically superior to a stagnant indigenous feudalism *in the short run*, though colonialism often created long-term ethnic fractures (Kenya's tribalism vs. Ethiopia's imperial cohesion). This case is too messy to be a clean pillar for your theory.

  ### Summary Principle
  Your gut is right. The coherent principle is: **Long-run prosperity is determined by the credibility of economic institutions (property rights, contract enforcement), which are historically path-dependent but can be shifted by critical junctures (wars, revolutions, leadership).**

  *   **Culture** is mostly a lagging indicator.
  *   **Geography** sets the initial difficulty level, not the final score.
  *   **Resources** are a test of institutions (Norway passes, Nigeria fails).
  *   **Japan** proves you can build modern institutions without Western culture.

  You are not cherry-picking; you are identifying the **fundamental causes** (institutions) vs. the **proximate causes** (capital, resources, technology). Keep the institutional focus, drop the cultural essentialism, and refine your definition of "institutions" to include "state capacity."
