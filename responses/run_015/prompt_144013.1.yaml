  ### The Principle of Independent Heuristic Fertility

  To capture your verdicts while maintaining philosophical rigor, I propose the **Principle of Independent Heuristic Fertility**. This principle refines Lakatos by distinguishing between *patching* an anomaly and *expanding* a theory's reach, whether empirically or formally.

  **Clause 1: Independent Domain Expansion**
  A modification is progressive only if it yields consequences (empirical observations or formal mathematical derivations) in a domain **distinct** from the anomaly that motivated the change.
  *   *Motivation:* Distinguishes **Dark Matter** (predicts lensing/CMB, distinct from rotation curves) from **Vulcan** (predicted transits, same domain as the perihelion anomaly) and **Ptolemy** (epicycles only fit existing positions).
  *   *Verdict:* Dark Matter and GR pass; Vulcan and Ptolemy fail.

  **Clause 2: Internal Consistency or Unification**
  If empirical novelty is pending, the modification must resolve a fundamental **internal inconsistency** (e.g., divergences, logical contradictions) or unify previously distinct frameworks, rather than merely accommodating an empirical mismatch.
  *   *Motivation:* Allows **String Theory** (resolves quantum gravity infinities, unifies forces via dualities) while excluding **Caloric Theory** (modifications like negative weight were contrived to fit combustion data, not to solve internal mathematical contradictions).
  *   *Verdict:* String Theory and GR pass; Caloric adjustments fail.

  **Clause 3: Non-Contrivance**
  The properties or entities postulated must not be **fine-tuned** solely to negate the specific anomaly without independent theoretical justification or generic physical plausibility.
  *   *Motivation:* Rules out **Caloric** (negative weight is physically *sui generis*) and **Vulcan** (orbit tuned exactly to fix Mercury's deficit) while permitting **Dark Matter** (mass is a generic property) and **Higgs** (scalar field required by gauge symmetry).
  *   *Verdict:* Dark Matter and Higgs pass; Vulcan and Caloric fail.

