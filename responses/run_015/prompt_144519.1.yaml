answer: |-
  # Seminar Guide: The Access-Phenomenal-Workspace Taxonomy

  **Context:** 12 Students, 1 Hour.
  **Goal:** Map the logical space of consciousness theories without relying on prior knowledge of author names.
  **Method:** A three-branch diagnostic tree. Students answer the questions based on intuition or case studies; the leaf reveals the theoretical commitment they have inadvertently adopted.

  ---

  ## Part 1: The Diagnostic Tree

  Distribute this structure to students. Ask them to trace a path based on their intuitions about **Global Broadcasting** (information made available to multiple cognitive systems for reporting/action) and **Phenomenal Consciousness** (what it is like to be the subject).

  ### Branch 1: The "Broadcast-Only" Question
  **Q1:** *Can a state be globally broadcast (available for report and reasoning) while having absolutely no phenomenal character (no "what it is like")?*
  *   **YES:** (Broadcast-Only Architecture) → *Go to Branch 2A*
  *   **NO:** (Broadcasting Implies Phenomenality) → *Go to Branch 2B*

  ### Branch 2: The "Private Phenomenal" Question
  **Q2A (Following YES on Q1):** *Can a state have phenomenal character without being globally broadcast (unreportable, cognitively isolated)?*
  *   **YES:** (Full Dissociation) → *Go to Branch 3A*
  *   **NO:** (Access Necessary for Phenomenality) → *Go to Branch 3B*

  **Q2B (Following NO on Q1):** *Can a state have phenomenal character without being globally broadcast?*
  *   **YES:** (Phenomenal Overflow) → *Go to Branch 3C*
  *   **NO:** (Identity/Strong Union) → *Go to Branch 3D*

  ### Branch 3: The Mechanistic Commitment
  *Note: For most paths, your answers to Q1 and Q2 logically constrain Q3. Answer based on whether you think the **neural mechanisms of the Global Workspace (G)** are what **produce** experience.*

  **Q3A (From Full Dissociation):** *Are Global Workspace mechanisms sufficient, necessary, or neither for phenomenal consciousness?*
  *   **NEITHER:** (GWT is just one system among many) → **Leaf 1**
  *   *(Note: "Sufficient" contradicts Q1-Yes; "Necessary" contradicts Q2-Yes)*

  **Q3B (From Access Necessary):** *Are Global Workspace mechanisms sufficient for phenomenal consciousness?*
  *   **NO:** (Broadcasting is required, but needs extra "ignition" or biological substrate) → **Leaf 2**
  *   *(Note: Logic dictates "Necessary but not Sufficient")*

  **Q3C (From Phenomenal Overflow):** *Are Global Workspace mechanisms sufficient for phenomenal consciousness?*
  *   **YES:** (If broadcasting happens, experience happens, but experience can also happen locally) → **Leaf 3**
  *   *(Note: Logic dictates "Sufficient but not Necessary")*

  **Q3D (From Identity/Strong Union):** *Are Global Workspace mechanisms sufficient and necessary for phenomenal consciousness?*
  *   **YES:** (Broadcasting and Phenomenality are the same natural kind) → **Leaf 4**

  ---

  ## Part 2: The Leaves (Positions & Implications)

  ### Leaf 1: The Dissociationist View
  *   **Named Position:** **Block's Distinction / Lamme's Recurrent Processing Theory**
  *   **Core Commitment:** Access and Phenomenal consciousness are supported by distinct neural mechanisms that can operate independently of one another.
  *   **Awkward Implication:** In "super-blindsight," a subject could globally integrate visual data to guide complex behavior while genuinely lacking any visual experience, implying the existence of functional "zombie" states indistinguishable from conscious ones from the outside.

  ### Leaf 2: The Threshold View
  *   **Named Position:** **Standard Global Workspace Theory (Dehaene/Changeux)**
  *   **Core Commitment:** Global broadcasting is a necessary precondition for phenomenal consciousness, but broadcasting can occur sub-threshold without generating experience.
  *   **Awkward Implication:** In "super-blindsight," the subject is broadcasting visual information without experience, forcing us to accept that the functional signature of consciousness (reportability) can exist without the feeling itself.

  ### Leaf 3: The Phenomenal Primacy View
  *   **Named Position:** **Unnamed / Rare Phenomenal Entailment** (Closest to some readings of Searle or Panpsychist GWT)
  *   **Core Commitment:** Any state that achieves global broadcasting must be phenomenal, but phenomenal states can exist locally without broadcasting.
  *   **Awkward Implication:** "Super-blindsight" is impossible; if a subject integrates visual information globally, they *must* have visual experience, meaning any subject reporting no experience is either lying or lacks true global integration.

  ### Leaf 4: The Strong Union View
  *   **Named Position:** **Strong GWT / Dennettian Illusionism**
  *   **Core Commitment:** Phenomenal consciousness is identical to (or exhaustively constituted by) the process of global information broadcasting.
  *   **Awkward Implication:** "Super-blindsight" is conceptually incoherent; if a subject broadcasts visual information, they are conscious by definition, so reports of "no experience" must be treated as cognitive errors rather than evidence of unconscious access.

  ---

  ## Part 3: Gap Analysis (Unoccupied Logical Space)

  There is one logically possible combination that remains largely unoccupied in the literature:

  *   **The Gap:** **Q1=NO (Broadcasting implies Phenomenal) + Q2=NO (Phenomenal implies Broadcasting).**
      *   *Wait, this is Leaf 4.*
      *   *Correction:* The true gap is **Q1=NO (Broadcasting implies Phenomenal) + Q2=YES (Phenomenal without Broadcasting)** where **GWT Mechanisms are NOT Sufficient.**
      *   *Actually, looking at Leaf 3:* Leaf 3 occupies Q1=No, Q2=Yes.
      *   *The Real Gap:* **Q1=YES (Broadcast-only possible) + Q2=NO (Phenomenal requires Broadcast)** where **GWT Mechanisms are SUFFICIENT.**
      *   *Logical Tension:* If Q1=Yes, Broadcasting is *not* sufficient for Phenomenality. So this gap is **Incoherent**.
      *   *Diagnosed Gap:* **Q1=NO (Broadcast implies Phenomenal) + Q2=YES (Phenomenal without Broadcast)** where **GWT Mechanisms are NEITHER Necessary nor Sufficient.**
      *   *Diagnosis:* **Unattractive.** This position claims that while you can't broadcast without feeling (Q1=No), the Global Workspace isn't what causes the feeling (Neither), and you can feel without broadcasting (Q2=Yes). This severs the link between the only mechanism we know makes information accessible and the experience itself, positing a "magical" phenomenal generator that never broadcasts without feeling but isn't the workspace. It lacks a mechanistic explanation for why broadcasting never occurs "dry."

  ## Part 4: Collapse Analysis (Where the Tree Fails)

  This taxonomy cannot genuinely separate **Eliminativist Illusionism** (e.g., Dennett) from **Reductive Identity Theory** (e.g., Strong GWT Proponents).

  *   **The Collapse:** Both positions land in **Leaf 4** (Q1=No, Q2=No, Q3=Yes).
  *   **Why:** The tree treats "Phenomenal Consciousness" as a valid variable to be queried.
      *   The **Identity Theorist** says: "Broadcasting *is* Phenomenal Consciousness." (Realist about P).
      *   The **Illusionist** says: "Phenomenal Consciousness *as distinct from Access* does not exist; only Broadcasting exists." (Eliminativist about P).
  *   **Consequence:** When answering Q1 ("Can broadcasting occur without phenomenal character?"), both answer "No."
      *   Identity: No, because they are the same thing.
      *   Illusionist: No, because if broadcasting occurs, the *illusion* of phenomenal character occurs, and that's all P is.
  *   **Explanation:** The branching structure collapses them because it operates within the "Phenomenal Concept Strategy." It cannot distinguish between a theory that *identifies* P with B versus a theory that *eliminates* P in favor of B, as both yield identical predictions for the diagnostic questions. To separate them, a fourth branch would be required asking: *"Is phenomenal consciousness a distinct ontological category from access functions?"*

  ---

  ## Facilitator Notes for the Seminar (1 Hour Plan)

  1.  **Definitions (10 mins):** Ensure students agree on working definitions.
      *   *Global Broadcasting:* Information available for verbal report, rational inference, and deliberate action.
      *   *Phenomenal:* The subjective "feel" (qualia).
      *   *Super-Blindsight:* A hypothetical patient who acts exactly like a conscious person (global integration) but insists they see nothing.
  2.  **Tree Traversal (20 mins):** Have students vote on Q1 and Q2 anonymously. Plot the class distribution on the board. Discuss the "Gap" positions—ask if anyone *wants* to occupy the unoccupied leaf and why it feels difficult.
  3.  **Leaf Analysis (20 mins):** Reveal the Named Positions. Focus heavily on the "Awkward Implication." Ask: "Is Leaf 1's zombie implication worse than Leaf 4's implication that the blindsight patient is mistaken about their own mind?"
  4.  **Collapse Discussion (10 mins):** Present the Collapse Analysis. Ask: "Does it matter for science if Dennett and Dehaene end up in the same leaf, or is the metaphysical difference crucial?"

  **Critical Warning for the Instructor:**
  Be prepared for sharp students to notice that **Branch 3 is logically determined by Branches 1 and 2.**
  *   If Q1=Yes (B w/o P), B is Not Sufficient.
  *   If Q2=Yes (P w/o B), B is Not Necessary.
  *   *Response:* Acknowledge this. Explain that Branch 3 is included to force students to commit to a *mechanistic* story, not just a modal one. Sometimes theorists claim Q1=Yes (modal dissociation) but argue GWT mechanisms are *usually* sufficient, creating tension the tree exposes.
