      *   **The Math of Correlation (Intuitive Explanation):**
          *   CJT relies on errors canceling out. If Voter A is wrong randomly, Voter B is likely right, balancing it.
          *   If errors are correlated, they *don't* cancel out. They reinforce each other.
          *   *Analogy:* Flipping coins vs. copying a friend's coin flip.
          *   *Technical bit:* Variance of the sum. If independent, variance sums. If correlated, covariance terms add up, keeping the variance high even as $n$ grows. The distribution doesn't narrow around the mean as expected.

      *   **Systematic vs. Idiosyncratic Error:**
          *   Idiosyncratic: "I misread the ballot." (CJT handles this).
