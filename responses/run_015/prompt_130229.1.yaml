answer: |-
  The classic heterogeneity problem poses a formidable challenge to hedonism: if pleasures are as phenomenally diverse as the gustatory burst of chocolate, the intellectual snap of solving an equation, and the somatic release of pain relief, what justifies grouping them under a single normative category? Traditionally, hedonists have been forced into a corner, compelled to argue either that there is a uniform "pleasure sensation" underlying these experiences (a claim introspection seems to falsify) or that "pleasure" is merely a label for a loose family resemblance with no substantive unity (a claim that undermines hedonism's normative force).

  I argue that this dilemma rests on a category error. It assumes that the unity of pleasure must be found in its *phenomenal input* (what it feels like) rather than its *functional-normative output* (what it does within the agent's economy of value). The solution is not to search for a common sensory tone, nor to surrender to arbitrary disjunction, but to adopt a model of **Axiological Anchoring**. On this view, pleasures are unified not by how they feel, but by the structural feature of being states that an agent's practical-evaluative framework treats as carrying non-derivative, self-reinforcing positive weight. This approach preserves the genuine heterogeneity of experience while securing the unity required for a robust hedonistic theory.

  ### The False Dichotomy of Phenomenal Unity

  The heterogeneity objection gains traction only if we assume that for two states to be instances of the same natural kind, they must share a specific qualitative character. Sensory hedonists (like Bentham) attempted to identify a unique "hedonic tone" present in all pleasures. However, as critics like G.E. Moore and later Roderick Firth noted, introspection reveals no such common thread. The feeling of solving a puzzle does not contain a sensory component identical to tasting wine.

  Conversely, the family resemblance view saves the phenomenon by sacrificing the theory. If pleasures are only linked by overlapping similarities, then "pleasure" is not a unified good but a grab-bag of disparate states. This makes it difficult to ground the hedonistic claim that pleasure is *the* good, or even *a* distinct kind of good. If the category is arbitrary, the normative prescription to "maximize pleasure" becomes incoherent.

  Axiological Anchoring rejects this dichotomy. It posits that the unity of pleasure is **structural and relational**, not qualitative. Two states can be phenomenally incomparable yet functionally identical within the agent's cognitive and conative architecture. The unity lies in the *uptake* of the experience by the agent's evaluative system, not in the raw feel of the experience itself.

  ### Defining Axiological Anchoring

  To say a state carries **axiological anchoring** is to say it occupies a specific role in the agent's practical-evaluative framework. This framework need not be a conscious system of moral reasoning; it is the totality of mechanisms (conscious and sub-personal) that guide action and attention.

  1.  **Non-Derivative Weight:** When an agent experiences pleasure, the state is treated as an end in itself. One does not seek the taste of chocolate *in order to* achieve something else (like nutrition); the experience itself commands positive valuation. It stops the regress of "why?" questions.
  2.  **Self-Reinforcing:** The state generates a feedback loop that encourages its own continuation. The experience signals "more of this" to the motivational system.
  3.  **Mediation:** This anchoring can be mediated by explicit judgment ("This is good"), bodily feedback ("This feels soothing"), or sub-personal reward mechanisms (dopaminergic reinforcement).

  By defining pleasure through this structural role, we acknowledge that the *phenomenology* of chocolate and mathematics are genuinely different (heterogeneity is real), but they are unified because they both successfully "drop anchor" in the agent's motivational system, halting the search for further justification and reinforcing the current trajectory.

  ### Avoiding Reduction and Dissolution

  This view navigates between the Scylla of reductionism and the Charybdis of dissolution.

  It avoids **reduction** because it does not demand that the sunlight on skin feel like the solution to an equation. It grants full ontological status to the phenomenal diversity. The warmth is diffuse and somatic; the solution is sharp and cognitive. Axiological Anchoring does not flatten these differences. It merely asserts that despite these differences, both states trigger the same *normative signal* within the agent: a signal of non-instrumental value.

  It avoids **dissolution** because the structural role is specific. Not every state that is "liked" is a pleasure in this sense. For example, an agent might value taking bitter medicine derivatively (for health). It carries positive weight, but it is derivative. Conversely, a random noise might be judged "interesting" but lacks the self-reinforcing grip of pleasure. The category of pleasure is not an arbitrary list of liked things; it is the specific class of states that command non-derivative, self-reinforcing attention. This provides the rigorous unity needed for normative theory without falsifying the phenomenology.

  ### The Challenge of Non-Cognitive Bodily Pleasures

  The most potent objection to Axiological Anchoring concerns purely bodily pleasures, such as the diffuse warmth of sunlight on skin. Critics might argue that "anchoring" implies a cognitive or intentional structure—a "framework" of evaluation—that a simple sensory享受 (enjoyment) lacks. Does a sunbather need a "practical-evaluative framework" to feel warmth, or is that just a raw sensation?

  This objection relies on an overly intellectualized conception of the "practical-evaluative framework." In the context of Axiological Anchoring, this framework is not limited to conscious deliberation or propositional judgment. It encompasses the **sub-personal reward systems** that govern organismic behavior.

  When sunlight warms the skin, thermoreceptors signal safety and comfort. This signal is processed by sub-cortical structures (such as the nucleus accumbens or opioid systems) that function as a primitive evaluative framework. These systems "treat" the state as carrying positive weight by inhibiting avoidance behaviors and promoting stillness (the "self-reinforcing" aspect). The agent does not need to judge "this is good" for the state to be axiologically anchored. The anchoring occurs at the level of the organism's regulatory economy.

  Therefore, the warmth of sunlight is a pleasure not because it feels like a judgment, but because it functions as a terminal value for the somatic regulatory system. It halts the search for thermal regulation (non-derivative) and encourages remaining in the sun (self-reinforcing). By naturalizing the "evaluative framework" to include neurocomputational reward pathways, we capture bodily pleasures without requiring high-level cognition.

  ### Distinction from Attitudinal Hedonism

  It is crucial to distinguish Axiological Anchoring from Attitudinal Hedonism (associated with Fred Feldman). Attitudinal hedonism defines pleasure as a pro-attitude (being pleased) toward a state of affairs. On that view, the sensation is secondary to the attitude.

  Axiological Anchoring differs in two key respects:

  1.  **The Locus of Unity:** For the attitudinal hedonist, the unity is in the *attitude* (the "being pleased"). For the axiological anchor theorist, the unity is in the *functional role of the state itself*. The state *elicits* the anchoring. This preserves the intuition that pleasure is something that *happens to us* (a sensation or experience) rather than something we *do* (an attitude).
  2.  **The Nature of the Response:** Attitudinal hedonism requires a propositional object (I am pleased *that* X). Axiological Anchoring allows for non-propositional anchoring. The sub-personal reward system can anchor a state without representing it as a proposition. The warmth on the skin anchors the agent's behavior without the agent necessarily holding an attitude toward the proposition "I am warm."

  Thus, Axiological Anchoring is not a disguised form of attitudinal hedonism. It acknowledges that the phenomenal state exists independently of the attitude, but argues that what makes it a *pleasure* is its capacity to lock the agent's evaluative framework into a positive feedback loop.

  ### Conclusion

  The heterogeneity problem dissolves when we stop looking for pleasure in the wrong place. We err when we search for a common sensory thread in the tapestry of experience. Instead, we should look at how the tapestry is hung. Pleasures are unified by **Axiological Anchoring**: they are the diverse class of states that successfully engage an agent's practical-evaluative framework as non-derivative, self-reinforcing ends.

  This view respects the genuine phenomenal differences between solving a theorem and basking in the sun, avoiding the reductionism of sensory hedonism. Simultaneously, it provides a rigorous structural unity that avoids the arbitrariness of family resemblance. By recognizing that "evaluation" occurs at both conscious and sub-personal levels, it accounts for bodily pleasures without intellectualizing them. Finally, by locating the unity in the state's normative grip rather than a pro-attitude, it remains distinct from attitudinal hedonism. In doing so, it rescues hedonism from the charge of incoherence, grounding the good not in a mythical feeling, but in the structural architecture of valuing itself.
