answer: |-
  Your puzzle isolates the central tension in modern normative ethics: the conflict between *impartial maximization* (save the most lives regardless of distance) and *commonsense morality* (special duties to those near us, limited duties to strangers). You are asking whether the distinctions we draw are foundational moral truths or pragmatic heuristics.

  Here is the implicit theory spelled out, separating strict requirements from convenient fits.

  ### 1. The Implicit Theory: Assignability and Epistemic Certainty
  The practices do not strictly presuppose that nearness or identification matters *in itself*. Rather, they presuppose that **moral duty requires a specific assignment of agency and high epistemic certainty.**

  *   **The Pond:** Proximity is a proxy for **unique capacity**. You are the only one there. It is also a proxy for **certainty**. You see the child; you know your action will save them. The cost is bounded (shoes).
  *   **The Bednets:** Distance creates **diffuse agency**. Anyone could donate. It introduces **probability**. Your money *might* save a life, but the causal chain is long. The cost is unbounded (if you must save a life, why not two? Why not your whole savings?).
  *   **The Health Service:** This is the control variable that proves identification isn't the key. We allow a *named* patient to die. Why? Because the agency is **institutional**, not individual. The committee acts as a single agent maximizing utility across a population under fixed constraints. The "wrong" is not letting *this* person die, but violating the **rule** that preserves the system for *all* persons.

  **Strict Requirement:** The practice requires a mechanism to assign responsibility without demanding infinite sacrifice from the individual.
  **Merely Fits Well:** Nearness and identification are excellent heuristics for assigning responsibility, but they are not the moral bedrock.

  ### 2. What Changes if We Drop Nearness/Identification?
  If you drop the requirement that nearness matters, you do not necessarily break the pond intuition, but you break the **boundary between duty and supererogation** (actions that are good but not required).

  *   **In the Pond Case:** If nearness doesn't matter, walking past the pond is wrong for the same reason not buying bednets is wrong. To keep the intuition that the walker is a criminal but the kitchen-buyer is not, you must introduce a different variable: **cost relative to income**. But since bednets are cheap, the kitchen-buyer becomes a criminal too.
  *   **In the Health Service:** If identification mattered strictly, the health service could not refuse the £100,000 treatment to a named patient. The fact that we accept this proves we already accept that identification does not trump resource allocation rules.
  *   **The Structural Break:** If you remove nearness as a shield, the individual becomes responsible for all preventable deaths they can influence. This collapses the **division of labour**. Individuals become rogue rescue agents, and the state's role in distribution becomes secondary to private charity.

  ### 3. Evaluating Your "Half-Baked Version"
  Your proposal is to treat donating as rescue-at-a-distance, allowing people to discharge the duty that way.

  *   **Does it break anything?** Yes, it breaks the **social practice of charity**. Currently, charity is optional; your version makes it mandatory. This transforms "generosity" into "compliance."
  *   **Does it make the pond intuition an accident?** Yes. Under your version, the pond is just a high-certainty, low-cost instance of the general duty to rescue. The intuition that the walker is *worse* than the kitchen-buyer relies on the certainty and immediacy, not the geography.
  *   **Consistency:** Your version is more logically consistent than the ordinary view. The ordinary view is inconsistent (it condemns the walker but spares the kitchen-buyer despite similar outcomes). Your version aligns the two.
  *   **Sustainability:** The ordinary view survives because it is **moderate**. It allows agents to pursue their own projects once basic local duties are met. Your version is **maximizing**. It requires agents to sacrifice until the marginal utility of their money equals the marginal utility of saving a life. Most legal and social systems reject this because it renders the agent a servant to the needy.

  ### Summary
  The ordinary practice relies on a **Division of Moral Labour**. Individuals handle immediate, high-certainty emergencies (Ponds). Institutions handle systemic, probabilistic distribution (Health Service/Bednets). Nearness is not a moral magic wand; it is the trigger that switches you from "private citizen" to "unique rescuer."

  Your version removes the division of labour. It is philosophically robust but socially demanding. The ordinary practice is philosophically messy but socially sustainable. Neither strictly requires nearness to matter *intrinsically*; both use it to manage the **demandingness** of moral obligation.

  Verdict: Several theories would license it.
