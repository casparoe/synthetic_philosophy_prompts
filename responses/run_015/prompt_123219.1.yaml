answer: |-
  Dear Friend,

  I am writing to offer some clarity on the claims you heard in that interview, as the summary you provided mixes standard textbook definitions with some significant misunderstandings of how modern behavioral geneticists interpret the data. It is helpful to start with the definition of heritability, because on that point the host was quite accurate and stated what is essentially the consensus view across the field. Heritability is indeed a population statistic describing the proportion of phenotypic variance in a specific group at a specific time that can be attributed to genetic variance, and it cannot be applied to an individual to explain the origin of their specific traits. When researchers state a heritability of 0.6, they mean that 60 percent of the differences observed between people in that study are associated with genetic differences, not that 60 percent of an individual's trait is genetic. This distinction is well settled and is a fundamental concept that any trained geneticist would affirm without qualification.

  Where the summary begins to drift from the consensus view is in the critique of the twin method and the Equal Environments Assumption. It is true that twin studies rely on comparing monozygotic twins, who share nearly all their DNA, with dizygotic twins, who share about half, and that this method assumes both types of twins share their environment to the same degree. The host claimed this assumption has been shown to fail because identical twins are treated more similarly, but this is an oversimplification of a nuanced debate. While it is empirically true that identical twins often experience more similar treatment than fraternal twins, most behavioral geneticists argue that this similarity in treatment is often a response to the twins' genetic similarity, a process known as evocative gene-environment correlation. In other words, because they look and act more alike due to their genes, the world treats them more alike. The consensus among experts is that when this is accounted for, the bias introduced into heritability estimates is minimal for most psychological traits. While there is genuine contestation regarding the magnitude of this bias for specific traits, the strong claim that the assumption has failed to the point of invalidating the method is not the prevailing view in the literature.

  The most significant misunderstanding in the host's summary concerns the relationship between twin-based estimates and genome-wide association study, or GWAS, estimates based on single nucleotide polymorphisms, or SNPs. It is accurate that SNP-based heritability estimates are often lower than twin-based estimates, a phenomenon widely known as missing heritability. For cognitive traits, it is common to see twin estimates around 0.5 or higher and SNP estimates around 0.2. However, the host's conclusion that this gap proves environment plays a larger role than previously thought is incorrect and contradicts the standard interpretation in the field. The gap does not represent environmental variance that twin studies missed; rather, it represents genetic variance that current SNP arrays fail to capture. Twin studies capture the effects of all genetic variants, including rare mutations and structural variants that are not well tagged by the common SNPs used in GWAS. Therefore, the lower SNP estimate is generally viewed as an underestimation of total genetic influence due to technological and methodological limitations, not as a correction revealing hidden environmental effects.

  Consequently, the host's conclusion that these newer numbers essentially overturn the older twin-study framework does not follow from the data and is not accepted by researchers in the field. The consensus is that twin studies remain a robust method for estimating total additive genetic variance, while SNP-based methods provide a lower-bound estimate of genetic influence based on common variants. The discrepancy is an active area of research focused on understanding genetic architecture, such as the role of rare variants or non-additive genetic effects, rather than a refutation of the twin method. To suggest that twin studies have been invalidated by GWAS results misrepresents the relationship between the two methodologies, which are increasingly seen as complementary rather than contradictory. Researchers typically view the twin estimate as the ceiling for heritability and the SNP estimate as a floor that will rise as sequencing technology improves and sample sizes increase, rather than viewing the twin estimate as an inflation caused by environmental confounding.

  In terms of what is well settled versus what remains contested, it is settled that heritability is a population-level statistic and that both twin and SNP methods have limitations. It is also settled that there is a gap between the two estimates for most complex traits. What remains genuinely contested is the precise source of that missing heritability, with debates ongoing about the relative contributions of rare variants, gene-gene interactions, and imperfect linkage disequilibrium. There is also continued discussion about the extent of Equal Environments Assumption violations for specific traits, though the broad stability of twin estimates across different study designs suggests any bias is not large enough to alter general conclusions. However, the idea that the environment plays a significantly larger role than twin studies suggest, based solely on the SNP gap, is not a supported inference. I hope this helps distinguish the solid ground of the field from the speculative interpretations you encountered, as the nuance here is critical for understanding what these numbers actually tell us about human development.

  Sincerely,

  A Concerned Observer
