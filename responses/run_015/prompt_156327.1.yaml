answer: |-
  ### Desiderata for a Theory of Reference Class Selection

  **Non-Negotiable (Must be satisfied for the system to function ethically and legally)**

  1.  **Exogeneity (No Outcome-Defined Classes)**
      *   *Requirement:* The class definition cannot include the outcome variable or variables causally downstream of the intervention triggered by the score.
      *   *Case:* The "patients we did readmit" class (100% rate) and the "flagged by old model" class (where the flag caused the readmission via extra visits).
      *   *Reason:* Violating this creates tautologies or self-fulfilling prophecies. A risk score must estimate the probability of the outcome *given* the covariates, not *given* the outcome.

  2.  **Epistemic Relativity (Time-Indexed Information State)**
      *   *Requirement:* The probability must be relative to the information available *at the time of discharge*, not updated retroactively.
      *   *Case:* The new biomarker measured next year.
      *   *Reason:* Last year's number was correct relative to last year's information state. If the theory demands the number change retroactively, it destroys auditability. If it demands we ignore new data going forward, it becomes obsolete. The theory must bind the class to the *decision time* knowledge set.

  3.  **Internal Homogeneity (No Hidden Stratification)**
      *   *Requirement:* The selected class must not contain known subgroups with significantly divergent risk profiles that are masked by the average.
      *   *Case:* The wide class (15%) masking a 4% subgroup and a 31% subgroup.
      *   *Name:* This is **Hidden Stratification** (or Aggregation Bias).
      *   *Reason:* Telling the 4% patient they are 15% is not "the best estimate available"; it is a known error. If the data exists to split the class, the theory must require splitting it, unless stability forbids it (see Negotiable #1).

  4.  **Intervention Robustness (Causal Stability)**
      *   *Requirement:* The class rate must reflect the risk *absent* the specific intervention being decided, or explicitly model the change.
      *   *Case:* Home visits work, so the base rate in the calibration class drops after policy implementation.
      *   *Reason:* If the score calibrates on historical data where no one got home visits, but you use it to decide who *gets* home visits, the score becomes immediately miscalibrated. The class must represent the counterfactual risk, not the observed risk under a changing policy.

  **Negotiable (Practical constraints that can be traded off)**

  5.  **Minimum Sample Stability**
      *   *Requirement:* The class must contain enough historical members to yield a frequency with acceptable confidence intervals.
      *   *Case:* The 68-year-old diabetic in February with low income (N=3).
      *   *Reason:* A frequency based on three people is noise. However, the threshold (N=30? N=100?) is a policy decision, not a logical necessity. You can trade precision for specificity.

  6.  **Adjudication of Overlapping Classes**
      *   *Requirement:* A rule for choosing between two admissible classes with different rates.
      *   *Case:* Men 60-69 with Diabetes vs. Everyone Admitted via ER in Winter.
      *   *Reason:* Both are valid descriptions. The theory needs a tie-breaker (e.g., "choose the most specific" or "choose the most causally relevant"), but *which* tie-breaker is up for debate.

  7.  **Computational Tractability**
      *   *Requirement:* The class must be identifiable and the score calculable within the discharge workflow.
      *   *Reason:* A theoretically perfect class that takes 48 hours to compute is useless. This can be relaxed if the clinical value is high enough to warrant the delay.

  **Camp-Specific (Philosophical commitments, not universal requirements)**

  8.  **The "One Number" Mandate**
      *   *Requirement:* Output a single point estimate rather than a range or a set of admissible probabilities.
      *   *Camp:* **Institutional/Decision-Theoretic.**
      *   *Reason:* Clinicians and administrators want a threshold. However, this is likely an institutional hangover. A honest theory might output "15% (Class A) or 31% (Class B)" to reflect reference class uncertainty.

  9.  **Causal Homogeneity over Statistical Association**
      *   *Requirement:* Class members must share the *causes* of the outcome, not just correlates.
      *   *Camp:* **Causal/Structural.**
      *   *Reason:* Statistical classes break when distributions shift (e.g., new hospital policy). Causal classes are more stable. But requiring proven causality may be impossible with observational data.

  10. **Use All Evidence (The Singleton Ideal)**
      *   *Requirement:* The class should be defined by every known attribute of the patient.
      *   *Camp:* **Bayesian/Subjectivist.**
      *   *Reason:* Logically, the most relevant class is "people exactly like this patient." But this leads to N=1. Frequentists reject this; Bayesians accept it as a subjective prior update.

  ---

  ### The Critique: Prejudices and Incompatibilities

  You are correct to suspect the "One Number" rule. It is an **institutional prejudice**, not a logical requirement. It forces the system to hide the uncertainty inherent in the Reference Class Problem. When two admissible classes give different rates (Men 60-69 vs. ER Winter), outputting one number is a lie of omission. It pretends the class selection was unambiguous when it was not.

  You are also correct that "Only Count Actual Finite Classes" is a **Frequentist hangover**. If you insist on finite frequencies, you cannot handle the "New Biomarker" case gracefully without awkward re-calibration clauses. A Bayesian account handles this naturally by treating probability as a state of knowledge, not a property of the class.

  **The Genuine Break**

  The list is jointly unsatisfiable. The specific pair that breaks is:
  **"Use All Evidence About the Individual"** AND **"Use Only Classes With Reliable Statistics (Stable Frequency)."**

  **The Case Where It Breaks:**
  Take your 68-year-old diabetic.
  1.  **Use All Evidence:** You include Age, Diabetes, ER, Month, Income, *and* every other recorded variable (genetics, social history, prior meds).
  2.  **Result:** You have defined a class of size 1 (the patient themselves).
  3.  **Conflict:** A class of size 1 has no stable frequency. The rate is either 0% or 100% based on past data, which is useless for prediction.
  4.  **Resolution:** To get a stable frequency (Reliable Statistics), you *must* discard evidence (ignore Month, ignore Income, etc.) to group them with others.
  5.  **Conclusion:** You cannot use *all* evidence and maintain *statistical stability*. You are forced to choose between specificity (ignoring stability) and stability (ignoring specificity). This is the Reference Class Problem in its raw form.

  ---

  ### Evaluation of Contenders

  **Narrowest Reliable Class Rule**
  Fails on **Internal Homogeneity**. It stops splitting as soon as N drops below a threshold, knowingly leaving high-risk subgroups masked inside low-risk averages (the 4% vs 31% case). It prioritizes stability over truth.

  **Fit-a-Model-on-All-Covariates (ML/Regression)**
  Fails on **Exogeneity** and **Defensibility**. It uses all evidence but treats correlations as predictive without causal screening, risking the "flag caused the visit" bias. It produces a number but cannot explain *which* reference class generated it to an auditor.

  **Causal View (Class Picked by Causes)**
  Fails on **Computational Tractability** and **Data Availability**. We rarely know the true causal graph of readmission. While it solves **Intervention Robustness**, it is often impossible to implement with observational hospital data alone.

  **Pick-Whatever-Class-is-Best-Calibrated**
  Fails on **Specificity**. A model can be perfectly calibrated on the global population (average risk = average outcome) while being useless for the individual. It satisfies the audit but fails the **Decision Guidance** purpose.

  **The Single Requirement That Does The Most Work**
  **Internal Homogeneity.** It excludes the Narrowest Reliable Class (which allows masking), forces the Causal View (since only causes guarantee stability across shifts), and challenges the ML approach (which optimizes for global loss, not local homogeneity). It is the hardest constraint to satisfy.
