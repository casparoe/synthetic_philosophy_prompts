          4.  Critique the provided list of requirements (which are real, which are prejudices, which are incompatible).
          5.  Identify the specific incompatibility (the "break").
          6.  Evaluate standard contenders (Narrowest Reliable, Full Model, Causal, Best Calibrated) against the list.
          7.  Format: No tables for the evaluation section, concise lines.
      *   **Tone:** Philosophical, rigorous, practical, honest about limitations.

  2.  **Deconstruct the Scenarios & Derive Requirements:**

      *   *Scenario 1 (68yo diabetic, ER, Feb, low income):* Small sample size vs. specificity. -> *Requirement: Stability vs. Specificity trade-off.*
      *   *Scenario 2 (Men 60-69 DM vs. ER Winter):* Conflicting admissible classes. -> *Requirement: Adjudication mechanism for conflicting classes.*
      *   *Scenario 3 (Outcome-defined/Intervention-defined):* Post-treatment bias/self-fulfilling prophecies. -> *Requirement: Pre-treatment/Exogeneity.*
      *   *Scenario 4 (Intervention changes rate):* Goodhart's Law/Feedback loops. -> *Requirement: Robustness to Intervention (or explicit counterfactual definition).*
      *   *Scenario 5 (New biomarker):* Information state relativity. -> *Requirement: Relativity to Epistemic State.*
      *   *Scenario 6 (Masking/Simpson's Paradox-ish):* Aggregation bias. -> *Requirement: Homogeneity (no hidden subgroups).*

  3.  **Drafting the Desiderata (Categorization):**

      *   *Non-Negotiable:* Must work for the decision, defensible, safe.
      *   *Negotiable:* Practical constraints, specific statistical thresholds.
      *   *Camp-Specific:* Philosophical commitments (Frequentist vs. Bayesian, Causal vs. Associational).

  4.  **Analyzing the "Requirements to Argue About":**

      *   *Use all evidence:* Bayesian ideal, but clashes with reference class logic (which selects *some* evidence to define the class).
      *   *Narrowest stable class:* The classic Reichenbach/Hailperin approach.
      *   *Never defined by outcome:* Crucial for validity.
      *   *Invariant to irrelevant variables:* Consistency.
      *   *Calibrated:* Essential for trust.
      *   *Computable:* Practicality.
      *   *Survive action:* Causal stability.
      *   *One number:* Institutional requirement (maybe a prejudice?).
      *   *Causally homogeneous:* Deep theoretical requirement.

  5.  **Identifying the Incompatibility (The "Break"):**

      *   The prompt suspects: *Use all evidence* + *Reliable statistics (frequencies)* + *One number for one-off*.
      *   My analysis: The core tension is between **Specificity (Use all evidence/Narrowest class)** and **Stability (Reliable statistics/Frequency)**.
      *   *The Break:* The "Reference Class Problem" itself. If you use *all* evidence, you end up with a class of size 1 (the individual). Frequency is undefined. If you require frequency, you must ignore some evidence (grouping). Therefore, "Use all evidence" and "Reliable Frequency" are logically incompatible for a single individual unless you move to a Bayesian subjective probability (which abandons the "reference class frequency" definition).
      *   *Refinement:* The prompt asks for a theory of *reference class selection*. This implies a frequentist or propensity backbone. The true break is between **Homogeneity** (no masking) and **Stability** (enough N). You can't have a class that is perfectly homogeneous (specific to the individual's causal profile) and statistically stable (large N) in finite data.

  6.  **Evaluating the Contenders:**

      *   *Narrowest Reliable:* Fails on masking (hides subgroups).
      *   *Full Model (ML):* Fails on interpretability/defensibility (black box), often fails causal stability.
      *   *Causal:* Fails on computability/data availability (hard to know true causes).
