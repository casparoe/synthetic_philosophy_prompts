      *   Why? Using *all* evidence leads to the singleton class (N=1). Stable frequency requires N>>1. You must discard evidence to get stability.
      *   Alternative Pair: **"One number"** AND **"Defensible to audit given class uncertainty."** If multiple classes are admissible, one number lies about the uncertainty.
      *   *Decision:* The Specificity vs. Stability tension is the classic Reference Class Problem. I will focus on that, but also highlight the "One Number" as an institutional fiction that hides the underlying class uncertainty.

  10. **Final Review against Constraints:**
