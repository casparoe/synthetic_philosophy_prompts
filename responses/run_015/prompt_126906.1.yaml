answer: |-
  # SPECIFICATION: Typogenetic Semantic Closure (TSC)

  ## 1. Core Definitions
  *   **Typogenetic Code ($T$):** A formal string of symbols that functions both as data for replication and as instructions for construction.
  *   **Interpretive Machinery ($M$):** The physical or logical apparatus that reads $T$ to produce phenotype and replicate $T$.
  *   **Semantic Closure:** The condition wherein $M$ is itself encoded within $T$, such that the rules for interpreting $T$ are generated by $T$.
  *   **Replicator ($R$):** The union of $T$ and $M$ capable of producing $R'$.

  ## 2. Structural Desiderata (The Von Neumann Conditions)
  *Any adequate theory must satisfy the logical topology of self-reproduction.*

  *   **2.1 Dual-Use Information**
      *   **Case:** The code $T$ must be read in two distinct modes: (1) as *uninterpreted data* to be copied exactly, and (2) as *interpreted instructions* to be executed by $M$.
      *   **Requirement:** The theory must formally distinguish the copying function $Copy(T)$ from the execution function $Exec(T, M)$.
      *   **Status:** **Non-Negotiable.** Without this, the system collapses into a simple loop unable to support evolution (the "naive replicator" paradox).

  *   **2.2 Universal Constructibility**
      *   **Case:** $M$ must be capable of constructing any machine described by a valid $T$, including $M$ itself.
      *   **Requirement:** The mapping from $T$ to $M$ must be surjective over the space of viable replicators.
      *   **Status:** **Non-Negotiable.** Required for open-ended evolution.

  *   **2.3 Causal Separation**
      *   **Case:** Changes to $T$ (mutation) must not immediately destroy the causal chain of the current replication cycle.
      *   **Requirement:** The phenotype of generation $N$ is determined by $T_N$, but the replication of $T_N$ to $T_{N+1}$ is mediated by $M_N$.
      *   **Status:** **Non-Negotiable.** Prevents immediate self-annihilation upon mutation.

  ## 3. Semantic Desiderata (The Closure Conditions)
  *The theory must explain how meaning is preserved when the definer of meaning changes.*

  *   **3.1 Interpretive Stability**
      *   **Case:** A mutation in $T$ alters $M$ (since $M$ is encoded in $T$). $M_{new}$ must still be able to read $T_{new}$.
      *   **Requirement:** The theory must define a "Semantic Basin of Attraction" where variations in $M$ do not result in total loss of legibility for $T$.
      *   **Status:** **Negotiable (Degree).** Perfect stability is impossible; the spec must quantify the tolerance threshold.

  *   **3.2 Self-Referential Consistency**
      *   **Case:** $T$ contains the description of $M$, which reads $T$.
      *   **Requirement:** The system must avoid infinite regress or paradox during the read-process. The "reading" of the interpreter description must not trigger a re-reading of the reader ad infinitum.
      *   **Status:** **Non-Negotiable.** Prevents logical halting.

  *   **3.3 Semantic Drift Containment**
      *   **Case:** Over $N$ generations, the meaning of specific codons in $T$ may shift as $M$ evolves.
      *   **Requirement:** The theory must track the *lineage of interpretation*. A symbol 'A' in Gen 1 and 'A' in Gen 100 may map to different functions; the theory must account for this translation map.
      *   **Status:** **Required.** Essential for modeling long-term evolution.

  ## 4. Evolutionary Desiderata (The Mutation Conditions)
  *The theory must allow for change without collapsing into noise.*

  *   **4.1 Error Propagation vs. Error Correction**
      *   **Case:** Mutations occur in $T$. Some affect $M$, some affect phenotype only.
      *   **Requirement:** The model must distinguish between *syntactic errors* (copying mistakes) and *semantic errors* (functional breakdown).
      *   **Status:** **Non-Negotiable.**

  *   **4.2 Evolvability of the Interpreter**
      *   **Case:** For evolution to occur, $M$ itself must be allowed to change.
      *   **Requirement:** The system cannot hard-code $M$ externally. $M$ must be mutable via $T$, but constrained enough to remain functional.
      *   **Status:** **Non-Negotiable.** If $M$ is fixed externally, it is not semantically closed.

  *   **4.3 Eigen's Error Threshold Compliance**
      *   **Case:** Information content in $T$ is limited by the fidelity of $M$.
      *   **Requirement:** The theory must respect the limit $L_{max} \approx \ln(\sigma) / (1-q)$, where $q$ is fidelity and $\sigma$ is selective advantage.
      *   **Status:** **Non-Negotiable.** Biological/Informational law.

  ## 5. Critical Distinctions (Do Not Collapse)
  *The theory fails if these pairs are treated as identical.*

  *   **5.1 Syntax vs. Semantics**
      *   **Distinction:** Syntax is the arrangement of symbols in $T$; Semantics is the causal effect of $T$ when processed by $M$.
      *   **Risk:** Collapsing these leads to the belief that changing a symbol always changes meaning (false) or never changes meaning (false).
      *   **Status:** **Non-Negotiable.**

  *   **5.2 Replication Fidelity vs. Evolutionary Flexibility**
      *   **Distinction:** Fidelity is the accuracy of $Copy(T)$; Flexibility is the viability of $Exec(T_{mutated})$.
      *   **Risk:** Optimizing for perfect fidelity kills evolution; optimizing for flexibility destroys inheritance.
      *   **Status:** **Non-Negotiable.** The theory must model the trade-off curve.

  *   **5.3 The Code vs. The Reader**
      *   **Distinction:** $T$ is static storage; $M$ is dynamic process.
      *   **Risk:** Treating $M$ as just another string leads to infinite regress.
      *   **Status:** **Non-Negotiable.**

  ## 6. Logical and Biological Constraints (No-Go Theorems)
  *The theory cannot violate these established limits.*

  *   **6.1 Gödelian Incompleteness**
      *   **Constraint:** A semantically closed system cannot prove its own consistency from within.
      *   **Implication:** $T$ cannot contain a complete, error-proof description of $M$'s operation that guarantees $M$ will never misinterpret $T$. There must be "blind spots" in the self-description.
      *   **Status:** **Non-Negotiable.**

  *   **6.2 Halting Problem**
      *   **Constraint:** $M$ cannot universally decide if a mutant $T'$ will halt or run indefinitely before executing it.
      *   **Implication:** Viability testing of mutants must be heuristic or empirical (run and see), not purely analytical.
      *   **Status:** **Non-Negotiable.**

  *   **6.3 Thermodynamic Cost**
      *   **Constraint:** Copying and interpreting $T$ dissipates energy.
      *   **Implication:** Semantic closure cannot be computationally free. Error correction requires energy expenditure (Landauer's Principle).
      *   **Status:** **Non-Negotiable.**

  ## 7. Jointly Unsatisfiable Pairs (The Tension Matrix)
  *These pairs represent fundamental trade-offs. A theory claiming to satisfy both fully is invalid.*

  *   **7.1 Pair: Total Semantic Closure vs. Open-Ended Evolution**
      *   **Conflict:** If $T$ fully defines $M$ (Total Closure), any mutation in the $M$-encoding region of $T$ risks changing the reading rules so drastically that $T$ becomes unreadable (Loss of Evolution). If $M$ is robust to mutation (Open Evolution), the link between $T$ and $M$ is loose, meaning $T$ does not fully define $M$ (Loss of Closure).
      *   **Resolution:** The theory must posit **Partial Closure**. The core interpreter is highly conserved (quasi-fixed), while the periphery is mutable.
      *   **Flag:** **CRITICAL TENSION.**

  *   **7.2 Pair: Self-Reference Consistency vs. Mutational Freedom**
      *   **Conflict:** To avoid Gödelian paradox, the system must restrict how $T$ refers to itself. To allow evolution, $T$ must be free to mutate anywhere, including self-referential sectors.
      *   **Resolution:** Segregation of the genome into "Operational" (mutable) and "Architectural" (protected) regions.
      *   **Flag:** **CRITICAL TENSION.**

  *   **7.3 Pair: Copying Fidelity vs. Interpreter Adaptability**
      *   **Conflict:** High fidelity in $Copy(T)$ preserves the $M$-code, stabilizing the interpreter. High adaptability requires allowing changes to the $M$-code.
      *   **Resolution:** Variable mutation rates (mutator genes) encoded within $T$ that regulate fidelity based on environmental stress.
      *   **Flag:** **MANAGEABLE TENSION.**

  ## 8. Non-Negotiable Summary
  *If a proposed model violates any of these, it is rejected.*

  1.  **Dual-Use Information:** Code must be copied as data and executed as instructions.
  2.  **Causal Separation:** Parent machinery builds offspring code; offspring code builds offspring machinery.
  3.  **Gödelian Limit:** The system cannot contain a complete, consistent proof of its own semantic stability.
  4.  **Syntax/Semantics Distinction:** String manipulation must remain distinct from functional interpretation.
  5.  **Error Threshold:** Information content cannot exceed the capacity of the interpreter to copy it faithfully.
  6.  **Partial Closure:** The theory must explicitly reject *Total* Semantic Closure to allow for evolution. (i.e., The interpreter cannot be *entirely* defined by the code in a way that precludes external constraints or historical contingency).

  ## 9. Final Spec Note on "Semantic Closure"
  The term "Semantic Closure" in this spec is defined operationally, not absolutely. It denotes a feedback loop where the code influences the interpreter which reads the code. It **does not** imply that the code fully determines the interpreter without remainder. Any theory claiming absolute closure (100% determination of $M$ by $T$ with 100% stability under mutation) violates Desideratum 7.1 and is logically inadmissible.
