answer: |-
  Here is a 30-minute session plan designed to pivot your residents from "Always Stratify" to "Stratify for Causal Identification."

  ### 1. Session Order & Rationale

  **Order:**
  1.  **The Naked Arithmetic (5 mins):** Open immediately with two unlabeled 2x2 tables showing the reversal. No context.
  2.  **The Carrying Example (10 mins):** Reveal the medical scenario (Low Birth Weight Paradox). Show that stratification creates the bias.
  3.  **The Structural Explanation (10 mins):** Introduce the DAG. Define the stratifying variable as a *collider* (or mediator, depending on nuance), not a confounder.
  4.  **The Heuristic & Close (5 mins):** Critique the rule of thumb. Pose the final question.

  **Rationale:**
  *   **Why start with naked math?** You are correct to trust this impulse. If you start with a story (e.g., "Imagine a drug..."), residents immediately activate their "Confounding" schema. They will assume the stratified table is the "adjusted" (correct) one by reflex. By presenting the reversal as a pure arithmetic property first, you decouple the *phenomenon* (reversal) from the *interpretation* (bias). It forces them to admit that the math allows *both* directions, so the choice must come from outside the data.
  *   **Why the DAG comes late:** If you show the DAG first, you turn this into a lecture on causal inference. By showing the DAG *after* the example, you use it as the explanatory key for why their intuition failed in the example. It becomes a tool for solving a puzzle they just encountered, rather than abstract theory.

  ### 2. The Carrying Example

  **The Scenario:** **The Low Birth Weight (LBW) Paradox.**
  *   **Exposure:** Maternal Smoking.
  *   **Outcome:** Infant Mortality.
  *   **Stratifying Variable:** Low Birth Weight (<2500g).

  **The Data Pattern:**
  *   **Aggregate:** Smoking increases Mortality (Risk Ratio > 1).
  *   **Stratified:** Within the LBW stratum, Smoking appears *protective* against Mortality (Risk Ratio < 1). Within the Normal Birth Weight stratum, Smoking is neutral or harmful.

  **Why this example?**
  1.  **Medical & Familiar:** Residents know smoking is bad. They know LBW is bad. The reversal (Smoking looks good for LBW babies) is shocking and memorable.
  2.  **Downstream Variable:** LBW is a *consequence* of Smoking (and other causes). This directly targets your goal of showing downstream stratification errors.
  3.  **Aggregate is Truth:** For public health and total effect estimation, the aggregate table is the correct one. Smoking *does* kill babies. Stratifying by LBW hides this truth.
  4.  **Mechanism:** It illustrates **Collider Stratification Bias**. LBW is a collider (Smoking $\to$ LBW $\leftarrow$ Genetic Malformations). Malformations cause Death. By conditioning on LBW, you induce a correlation between Smoking and Malformations. Among LBW babies, non-smokers are LBW because of severe Malformations (high death risk); smokers are LBW because of Smoking (lower death risk relative to malformations).

  **What it must contain:**
  *   Clear statement that we are interested in the **Total Effect** of smoking on mortality.
  *   Explicit mention that LBW is on the causal pathway (or a collider downstream of exposure).

  **What it must not contain:**
  *   Confounding of the Smoking $\to$ Mortality relationship (e.g., SES). Keep the background simple so the bias is clearly due to the *stratification*, not baseline confounding.

  ### 3. Misconceptions & Defusal Points

  | Misconception | When it forms | Defusal Point |
  | :--- | :--- | :--- |
  | **"A reversal means the data is broken or lying."** | During the Opening (Naked Math). | **Defused immediately.** Show that weighted averages of ratios do not equal the ratio of averages. It is a feature of arithmetic, not a bug in the dataset. |
  | **"The stratified numbers are always the 'adjusted' truth."** | During the Carrying Example. | **Defused by the LBW logic.** Explain that "adjusting" for a downstream variable blocks the pathway or opens a collider. The stratified estimate is a *biased* estimate of the total effect. |
  | **"Simpson's Paradox is just non-collapsibility of the Odds Ratio."** | During the DAG/Theory section. | **Defused by using Risk Differences.** Show the reversal persists even with Risk Differences (which are collapsible). This separates the *causal/selection* issue from the *mathematical scale* issue. |

  ### 4. Causal Graphs: Yes or No?

  **Yes, introduce a DAG.**
  *   **Where:** Immediately after the LBW example (Minute 15).
  *   **Why:** You cannot explain *why* stratification was an error without structure. The residents know "confounder," but they likely lump "mediator" and "collider" into the same "nuisance variable" bucket.
  *   **How:** Draw: `Smoking -> LBW <- Malformation -> Death`.
  *   **Lesson:** "We stratify to close back-door paths. We do *not* stratify to close front-door paths (mediators) or open collider paths. Simpson's paradox becomes dangerous only when we stratify without knowing which line we are drawing."

  ### 5. End-of-Session Question

  **The Question:**
  > "I have a trial of a new antihypertensive. I want to answer two questions:
  > 1. Does *prescribing* this drug reduce stroke risk in my clinic population?
  > 2. Does the *molecule* itself reduce stroke risk, independent of its effect on blood pressure?
  >
  > I have data on Drug Assignment, Blood Pressure at 6 months, and Stroke at 5 years.
  > Which question do I answer with the Aggregate table, and which requires Stratification by Blood Pressure? And why might the Stratified table show the drug is harmful even if prescribing it saves lives?"

  **Discrimination:**
  *   **The Novice:** Will say "Stratify to control for BP" for both, or "Aggregate is always biased."
  *   **The Expert:** Will identify Q1 as the **Intention-to-Treat/Total Effect** (Aggregate is correct) and Q2 as the **Direct Effect** (Stratification is required, but warns of mediation bias). They will recognize that if the drug works *only* by lowering BP, stratifying by BP removes the benefit, making the drug look useless or harmful (due to side effects), even though prescribing it saves lives.

  ### 6. Critique of Your Rule of Thumb

  **Your Rule:** *"Stratify on a variable only if it is a cause of the exposure rather than a consequence of it."*

  **Where it breaks:**
  1.  **Time-Varying Confounders Affected by Exposure:** This is the fatal flaw for epidemiologists.
      *   *Scenario:* A longitudinal study of ART (Exposure) and Mortality (Outcome). CD4 Count is measured repeatedly.
      *   *Structure:* Prior ART $\to$ Current CD4 $\to$ Future ART. Also Current CD4 $\to$ Mortality.
      *   *Problem:* CD4 is a *consequence* of prior exposure (your rule says "Don't Stratify"). But CD4 is also a *confounder* of the future exposure-outcome relationship (your rule says "Stratify if cause of exposure"—CD4 causes *future* exposure).
      *   *Result:* If you follow your rule and don't adjust for CD4, you have uncontrolled confounding. If you adjust using standard regression, you introduce bias (blocking the mediator path). This requires G-methods (MSM/G-estimation), not a simple rule.
  2.  **Precision Variables:** A variable that causes the *Outcome* but not the *Exposure*.
      *   *Rule says:* Don't stratify (not a cause of exposure).
      *   *Reality:* Stratifying increases precision (reduces residual variance) without introducing bias. Your rule misses efficiency gains.
  3.  **Case-Control Studies:** You select on Outcome (a consequence). Your rule doesn't account for design-based conditioning.

  **Recommendation:**
  **Do not teach the rule.** It is too brittle for second-year residents who will encounter longitudinal data.
  **Teach the Graph instead.**
  *   **Script:** "The rule 'don't stratify on consequences' works for simple total effects, but it fails when a consequence of past exposure is a cause of future exposure. In those cases, the variable is both a mediator and a confounder. The only robust heuristic is: Draw the DAG. If the variable blocks a back-door path without blocking a front-door path or opening a collider path, adjust. If you can't draw it, don't adjust."
  *   **On the "Hard Case":** Openly state you are leaving Time-Varying Confounding out. "Today we deal with baseline exposures. When exposure and confounders change over time, this logic breaks, and you need G-methods. But for baseline cross-sectionals, the DAG rule holds."

  ### Summary Checklist for the 30 Minutes
  *   [0:00-5:00] **Naked Tables:** Show reversal. Ask "Which is true?" Answer: "Neither. Math allows both."
  *   [5:00-15:00] **LBW Example:** Show Smoking/LBW/Death. Show reversal. Assert Aggregate is Truth.
  *   [15:00-25:00] **DAG:** Draw the Collider. Explain *why* stratification lied. Distinguish Confounder vs. Collider.
  *   [25:00-30:00] **Rule & Question:** Kill the "Cause of Exposure" rule. Pose the Antihypertensive estimand question. Dismiss.
