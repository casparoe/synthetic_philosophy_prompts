  1. **Time-varying confounders:** A variable is a consequence of *past* exposure but a cause of *future* exposure and outcome. (e.g., Blood Pressure in a hypertension trial over time). The rule says "Consequence -> Don't Stratify." But if you don't, you have confounding.
