          *   *Consortium B (Opaque Algorithm):* Every member gets correct predictions (True Belief). No shared justification, no accountability, no integrated understanding. Parallel individual acceptance.
      *   **Core Question:** Does Consortium A possess a collective epistemic good that Consortium B lacks? Does this solve the Meno problem at the group level differently than at the individual level?
