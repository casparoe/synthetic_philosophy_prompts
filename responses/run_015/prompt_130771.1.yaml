answer: |-
  I recommend approving the curators' proposed signage only under the condition of the dual-label framework, paired with an explicit definitional note and a mandatory five-year review cycle.

  The primary justification for this recommendation is the ethical imperative to avoid epistemic injustice. Strict adherence to the 1948 Convention's narrow legal categories risks rendering invisible forms of group destruction that fall outside its scope, specifically those targeting political and cultural existence rather than solely biological destruction. Raphael Lemkin's original conception recognized that the destruction of a group's institutions and cultural patterns is constitutive of genocide, even when physical annihilation is not the sole or primary intent. To withhold the term based on subsequent legal narrowing would reproduce the historical erasure the gallery seeks to document, validating the state's own logic of assimilation over the lived reality of the targeted community. The museum's mandate as an institution of memory requires it to prioritize historical and moral accuracy over adjudicative precision when the two diverge.

  However, the legal advisers' concern regarding institutional credibility must be treated with genuine seriousness. There is a substantial risk that museums conflate moral categories with legal ones, thereby misleading visitors into treating a moral judgment as an established legal finding. If the public perceives the institution as conflating historical description with legal verdicts, the museum undermines its authority on all matters of human rights documentation. This risk is not merely technical; it exposes the institution to charges of politicization and weakens the specific weight of legal genocide determinations in contemporary advocacy. Therefore, the use of the term cannot be unconditional.

  To mitigate this risk while honoring the moral imperative, the display must include an explicit definitional note within the signage itself. This note should clearly distinguish the broader historical-moral conception employed in the gallery from the narrower category used in international criminal prosecution. It must state that while the events meet the historical and sociological criteria of genocide as originally formulated, they may not satisfy the specific intent requirements for legal conviction under current international statutes. This transparency preserves institutional credibility by educating visitors on the evolution of the term rather than obscuring the distinction.

  Finally, historical interpretation is not static. If future scholarship revises the archival interpretation of intent—for example, if evidence emerges proving specific intent for physical destruction, or conversely, if evidence suggests the violence was purely coercive without genocidal intent—the labeling must be adaptable. The approved signage shall be subject to a formal review by the Exhibition Review Board every five years. This ensures the display remains aligned with the current scholarly consensus and allows the museum to update the definitional note or the label itself should the archival understanding of the state's intent shift significantly.
