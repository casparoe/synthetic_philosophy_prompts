prompt: |-
  I'm presenting next tuesday in our phil of mind / cog sci joint seminar — small room, about eight people. The audience breaks down like this: two senior folks who've taught Dennett's intentional stance for years and know every objection to it, one eliminativist about propositional attitudes who thinks belief-talk is just a temporary heuristic we'll eventually scrap, and two ML researchers who aren't philosophers but think attributing "beliefs" to LLMs is pure anthropomorphic marketing. My thesis is that we should extend the intentional stance to large language models, but only for a stripped-down attitude I'm calling "compressive expectation" — not full propositional belief, but a stable predictive pattern across counterfactual prompts that explains model behavior if we drop the usual representational-fidelity requirement and replace it with predictive stability under perturbation. I sketch this using attention-head consistency across contexts, but I'm not claiming the model literally represents propositions.

  Can you draft my Q&A prep sheet? I want the objections in roughly the order they'll come, phrased the way these specific people talk — not generic "AI can't think" objections. For each: how damaging it is, what I should concede up front, what I should hold, a reply I can deliver in about two minutes, and an honest note on where that reply is weakest. Include the one question I'm hoping nobody asks — probably something from the eliminativist. And please: if mixing Dennett with ML architecture is actually incoherent, or if "compressive expectation" collapses into something we already have a name for, tell me straight instead of politely building me a prep sheet. I can recieve pushback.
