      *   *Tone Check:* Keep it crisp. Avoid "Have you read Ian Hacking?" (though Hacking is clearly the ghost in the machine here, specifically *The Social Construction of What?* and "Looping Effects"). The user invented the "Ratchet" term, but it's essentially Hacking's "Looping Effect." I should acknowledge the concept without name-dropping excessively or lecturing.
