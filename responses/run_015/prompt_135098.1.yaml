      *   (2) **Institutional Kinds:** Money is status-conferral + collective acceptance. Contingent on human practice. *But* claims about money are objectively true/false. (Realism about institutional facts).
      *   (3) **Race (Ontology):** Not biological (no essence/clinal). *But* real because of downstream causal effects (social reality).
      *   (4) **The "Ratchet Test":** A kind is "real" if acting on the classification makes instances resemble the stereotype more (self-fulfilling/stabilizing). Race and Money fit.
      *   (5) **The Astrology/Witch Problem:** Taurus/Witch seem to pass the Ratchet Test (behavior shapes to stereotype, effects are real), but User wants to exclude them.
      *   (6) **Gender:** Socially constructed. First-person authority is near-absolute (unlike class).
      *   (7) **Biomedical Policy:** Stop using "race" in biomed to avoid essentialism, despite (3) saying race is real.

  3.  **Identify Tensions (Brainstorming & Pairing):**

      *   *Tension A: The Ratchet Test (4) vs. Witches/Astrology (5).*
          *   User says Ratchet Test identifies "real kinds."
          *   User admits Witches/Astrology seem to pass the test (people act the part, effects are real).
          *   User *wants* to say Witches/Astrology are *not* real kinds.
          *   *Verdict:* This is a direct contradiction. The test yields a result the user rejects.

      *   *Tension B: Race Realism (3) vs. Biomedical Ban (7).*
          *   (3) says Race is real because it has causal powers (mortgages, police).
          *   (7) says don't use it in biomed because it implies biological essence.
          *   *Conflict:* If a kind is "real" and has "causal powers," usually science wants to track those powers. If the causal powers are *only* social, using it in biomed is category error. But (3) justifies reality via causal effects. (7) admits the reality but bans the utility.
