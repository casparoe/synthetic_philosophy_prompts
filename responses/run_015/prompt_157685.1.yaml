answer: |-
  The Global Health Allocation Board convenes with a fixed $50M budget to decide between two pandemic prevention grants. Option A distributes proven antiviral stockpiles, statistically securing 200 lives saved with 99.9% confidence based on decade-long efficacy data. Option B funds a speculative gene-drive protocol requiring four sequential unverified breakthroughs—lab stability, wild-population fixation, reservoir neutralization, and spillover blockade—where modeling suggests a 0.0002 probability of preventing a zoonotic catastrophe costing 50 million lives, but a 99.9998% chance of total failure due to collapse at any causal link. An expected value maximizer mandates Option B, calculating 10,000 expected lives saved versus 199.8, but a proponent of "robustness-weighted consequentialism" selects Option A, not out of risk aversion regarding the stakes, but on the principle that expected utility calculations degrade epistemically when contingent on more than three unverified causal links, imposing a structural discount that renders the long-chain probability mass too fragile to count toward moral obligation.

  **Analysis**

  **EV Reasoning:** The expected value maximizer treats the provided probabilities as precise scalars and the utility of lives saved as linear. Option B yields $0.0002 \times 50,000,000 = 10,000$ expected lives, while Option A yields $\approx 200$. Because $10,000 \gg 200$, the fanaticism of pure EV theory demands funding the long-shot protocol, regardless of the near-certainty of failure.

  **Robustness-Weighted Reasoning:** This view argues that probability estimates derived from chains of unverified causal mechanisms are epistemically distinct from frequencies derived from historical data. Because Option B depends on four sequential unverified links, the model uncertainty compounds beyond the stated scalar, warranting a structural discount factor that effectively zeros out the expected value of long-chain interventions. The choice for A is not due to the disutility of loss (risk aversion) but due to the unreliability of the probability term itself when causal depth exceeds a specific threshold.

  **Feature Doing the Work:** **Unbounded utility scaling.** The divergence between the two views disappears if we cap the maximum stakes at 500,000 lives. In that scenario, Option B's expected value drops to 100 ($0.0002 \times 500,000$), which is lower than Option A's 200. Since the EV maximizer now agrees with the Robustness view (both choose A), the original conflict was enabled specifically by the utility function's ability to scale high enough to overwhelm the tiny probability.

  **EV Fanatic's Counter-Attack:** The fanatic argues the robustness discount is **ad hoc** rather than principled. It violates the independence axiom of rational choice by allowing causal structure to override outcome value. The fanatic asks: Why three links? Why not weight by link confidence? By imposing an arbitrary structural tax, Robustness-weighted consequentialism smuggles in deontological constraints under a consequentialist label, potentially ignoring the only opportunity to save millions based on an aesthetic preference for "shorter" causality rather than actual expected harm.
