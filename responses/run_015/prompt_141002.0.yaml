answer: |-
  1. What standard of evidence justifies belief in cliodynamic forecasts when we distinguish between precise date-bearing predictions, ordinal phase claims, and conditional structural relationships regarding elite overproduction and instability?
  2. Modellers claim validation through broad trend alignment while historians dismiss the field as overfitted narrative, yet neither side distinguishes the evidentiary bars required for different grades of prediction, leaving the debate stuck between accusations of curve-fitting and vague confirmations of inevitability.
  3. The first three months will replicate a secular-cycle fit on independent data to test parameter sensitivity across distinct historical regimes, and the next three will establish a pre-registered scorecard for live forecasts with indicators a reader can check in future years. The final three will conduct structured interviews with modellers and critics to assess how audience reception alters the model's causal mechanisms.
  4. The deliverable is a trade book for educated general readers that translates technical debates about evidence standards into a clear framework for evaluating claims about societal collapse, enabling non-specialists to distinguish robust structural insights from speculative numerology.
  5. The project fails if the replication demonstrates that parameter sensitivity renders the model indistinguishable from noise. The scope will most likely exceed nine months if the interview process reveals that the act of forecasting itself requires a separate philosophical treatment of reflexivity and self-fulfilling prophecies.
