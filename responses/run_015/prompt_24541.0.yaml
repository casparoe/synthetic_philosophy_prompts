answer: |-
  1. "The two confusions"
  Your question conflates two separate issues regarding language and strength. First, you equate soundness with consistency. Soundness claims that every provable sentence is true in a specific model, whereas consistency merely claims that no contradiction is provable. While soundness implies consistency, they are not identical; one is semantic, the other syntactic. Second, you assume the soundness proof is conducted within the formal system itself. Textbook soundness proofs are meta-mathematical arguments conducted in a stronger background theory about the object system. Tarski and Gödel restrict what a system can do regarding its own language and consistency internally, but they do not restrict what a stronger meta-theory can say about the object system. You are attributing limitations on internal provability to external mathematical reasoning. The confusion lies in mixing up the object language with the meta-language used to analyze it. This distinction between the system doing the proving and the system being proved is the key to resolving the apparent paradox.

  2. "Consistency versus soundness"
  Consistency is a syntactic property: a system is consistent if it never derives a contradiction. Soundness is a semantic property: a system is sound if every theorem it derives is true in an intended interpretation. While soundness entails consistency, the reverse is not true; a system could be consistent but unsound if it proves false statements that do not immediately contradict. Gödel's second theorem states that a sufficiently strong system cannot prove its own consistency statement within its own language. However, the soundness theorem concludes that provable sentences are true, which implies consistency. The crucial distinction is that the soundness theorem establishes this implication from the outside. It does not claim the system proves its own consistency; it claims that we, standing outside, can see that its proofs preserve truth. Therefore, the soundness conclusion is stronger than mere consistency, but it is established in a different mathematical context.

  3. "Where the soundness proof actually lives"
  The soundness proof resides in the meta-theory, not the object theory. When you read a logic textbook, the formal system being studied is the object language. The reasoning used to prove soundness—induction on derivation length, defining satisfaction relations—is conducted in the meta-language, typically informal mathematics or a stronger set theory like ZFC. This meta-theory possesses the necessary set-theoretic tools to construct models and define truth recursively. Tarski's undefinability theorem states that a language cannot contain its own truth predicate. It does not forbid a richer meta-language from defining truth for the poorer object language. Since the meta-language is strictly stronger, it can define satisfaction for the object language without contradiction. Similarly, Gödel's second theorem forbids the object system from proving its own consistency. It does not forbid the meta-theory from proving the object system's consistency. The soundness proof demonstrates that the object system is consistent relative to the meta-theory. There is no circularity because the truth definition and consistency proof live one level up in the hierarchy of languages, exactly where Tarski and Gödel allow them to exist. The limitation is strictly internal to the system, not external to the mathematician. Thus, the apparent conflict dissolves once the hierarchy of languages is respected.

  4. "What is genuinely right in my question"
  Your intuition is correct that soundness implies consistency and that this cannot be generated internally. If the object system could prove its own soundness, it would prove consistency, violating Gödel's second theorem. Similarly, defining its own truth predicate would violate Tarski's theorem. You correctly identify that these concepts are linked. The error lies only in assuming the textbook proof attempts this impossible internal feat. The limitation you sensed is real: the system cannot validate itself. It requires a stronger external perspective to certify its truth-preserving nature. You have correctly identified the boundaries of self-reference, even if you misplaced the location of the standard proof.
