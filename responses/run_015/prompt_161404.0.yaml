      *   **Task:** Draft an "adversarial-collaboration summary" document.
      *   **Components:**
          1.  Numbered section of *Shared Claims* (what both sides can agree on regarding law's limits, demographics, harm sources, and outcomes).
          2.  *Disagreements Table* (residual disagreements stated in both voices, categorized as empirical, normative, or verbal).
          3.  *Cruxes* (sub-questions where settlement moves the needle), including acceptable evidence/arguments for each.
          4.  *Case Study Application* (The "Mid-sized European City Package"): Predictions from both sides on specific metrics (street-based, migrants, prices, violence reporting, market size) with mechanism-level reasoning.
          5.  *Metanote:* Distinguish settled consensus from unsettled empirical matters and flag potential refusal points.
      *   **Constraint:** No citations or study names (trust is low). Focus on mechanism-level reasoning.
      *   **Tone:** Professional, legal/policy analytic, neutral, precise.

  2.  **Deconstruct the Positions:**
      *   **Nordic Model (End-Demand):** Sex buying = domination/exploitation. Law has expressive function. Demand drives trafficking. Success = shrinking market, reducing stigma (eventually), protecting vulnerable from entry.
      *   **Decriminalization (NZ Model):** Criminalization = harm (stigma, inability to screen, police abuse). Sex work = work. Success = safety, labor rights, health outcomes, agency.
      *   **The "Third Way" (German/Dutch):** Regulation/Licensing. Often criticized by both (Nordic: normalizes exploitation; Decrim: creates two-tier system/bureaucratic barriers).
      *   **The Specific Case:** A hybrid model. Repeals soliciting/third-party *but* licenses collectives. Criminalizes buying *unless* from licensed collective. Support services available to all.

  3.  **Drafting - Section 1: Shared Claims:**
      *   Need to find common ground. Both sides hate trafficking/coercion. Both agree criminalization creates *some* harm. Both agree the state has a role.
      *   *Claim 1 (Law's Limits):* Law cannot eliminate the trade entirely without severe rights violations.
      *   *Claim 2 (Demographics):* The trade is heterogeneous (street vs. indoor, migrant vs. citizen, coerced vs. voluntary).
      *   *Claim 3 (Harm Sources):* Violence exists regardless of law, but legal status affects reporting.
      *   *Claim 4 (Outcomes):* "Better" means increased safety and autonomy, though they define autonomy differently (freedom *from* vs. freedom *to*).
