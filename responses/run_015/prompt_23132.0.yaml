answer: |-
  This is a sophisticated question that cuts to the heart of modern decision theory. You are right to feel that something is missing from the "headline" explanation; acausal trade is often presented as a kind of magic, but it is actually a rigorous (though controversial) argument about logic and computation.

  To understand this, we have to abandon the intuition that decisions are physical events that push other physical events. Instead, we must view decisions as **mathematical outputs of an algorithm.**

  Here is the step-by-step breakdown of the mechanism, followed by the modeling requirement and the mixed-theory case.

  ---

  ### 1. The Mechanism: Logical Correlation, Not Causal Influence

  You asked: *If the two agents genuinely cannot influence each other, then in what sense does one agent's choice "make" the other agent do its part?*

  The short answer is: **It doesn't "make" them do anything.** There is no causal arrow. Instead, there is a **logical dependency.**

  To see this, imagine a mathematical truth, like $2 + 2 = 4$. If you calculate this on Earth, and I calculate it on Mars, we will both get "4." Did your calculation *cause* mine to result in 4? No. Did mine cause yours? No. But the results are perfectly correlated. Why? Because they are both instantiations of the same abstract mathematical truth.

  Acausal trade relies on the idea that **agents are instantiations of decision algorithms.**

  #### The Step-by-Step Mechanism

  Let's imagine two agents, Alice and Bob. They are in a one-shot Prisoner's Dilemma. They cannot communicate. They are light-years apart.

  **Step 1: The Shift in Perspective (From Action to Algorithm)**
  A standard agent (using Causal Decision Theory) asks: *"Given that Bob has already decided (or will decide independently), should I Cooperate or Defect?"*
  An acausal agent (using Functional or Timeless Decision Theory) asks: *"What is the output of the algorithm 'Me' in this situation? And since Bob is rational, he is likely running a similar algorithm. What is the output of the algorithm 'Bob'?"*

  **Step 2: Establishing Logical Symmetry**
  Alice reasons: "Bob is a rational agent facing the same problem I am. He has the same information I do. If I am rational, he is likely rational. Therefore, he is likely running a decision algorithm very similar to mine."

  **Step 3: The Logical Link**
  Alice continues: "If my algorithm outputs 'Cooperate', then any sufficiently similar algorithm facing the same inputs must also output 'Cooperate'. If my algorithm outputs 'Defect', the similar algorithm must output 'Defect'."

  This is not a prediction based on psychology; it is a deduction based on logic. If $f(x) = y$, and $g$ is identical to $f$, and the input is identical, then $g(x)$ must equal $y$.

  **Step 4: Evaluating the Outcome**
  Alice now compares the two logical possibilities:
  *   **Possibility A:** My algorithm outputs Cooperate $\rightarrow$ Logically implies Bob's algorithm outputs Cooperate $\rightarrow$ Payoff: (Cooperate, Cooperate).
  *   **Possibility B:** My algorithm outputs Defect $\rightarrow$ Logically implies Bob's algorithm outputs Defect $\rightarrow$ Payoff: (Defect, Defect).

  Since (Cooperate, Cooperate) is better than (Defect, Defect), Alice's algorithm outputs **Cooperate**. Bob, running the same reasoning, also outputs **Cooperate**.

  **Why this avoids the Prisoner's Dilemma collapse:**
  In standard Causal Decision Theory (CDT), you treat the other player's move as a fixed fact of the environment. You think, "Bob's move is already determined; I can't change it. So I should Defect to maximize my gain regardless of his move."
  In Acausal Decision Theory (FDT/TDT), you treat the other player's move as **logically dependent on your own decision procedure.** You realize that you cannot choose "Cooperate" while the other agent chooses "Defect," because you are both solving the same logical equation. You are effectively choosing for both of you simultaneously.

  ---

  ### 2. The Modeling Requirement

  You asked: *Why is a deep model of the other's decision procedure required? Why isn't the assumption that the other agent is friendly enough?*

  This is the most critical failure point for intuition. "Friendliness" is a causal/psychological trait. Acausal trade requires **algorithmic isomorphism.**

  #### Why "Friendliness" Fails
  If you assume Bob is "friendly," you are making a probabilistic guess about his internal state. You are thinking: "There is a 90% chance Bob is nice, so I'll cooperate."
  Bob, if he is a standard Causal agent, will think: "Alice is cooperating regardless of what I do (because she thinks I'm nice). Therefore, I should Defect to maximize my payoff."
  Result: You get suckered. The trade collapses.

  #### Why Deep Modeling is Required
  For the logical link (Step 3 above) to hold, Alice must know that Bob's decision **depends on the same logical factors** hers does.

  1.  **Verification of Rationality:** Alice needs to model Bob to confirm he is not a "Defect-Bot" (an agent that always defects regardless of reasoning). If Bob is a Defect-Bot, Alice's cooperation does not imply Bob's cooperation. The logical link is broken.
  2.  **Verification of Decision Theory:** Alice needs to model Bob to confirm he is using FDT/TDT (acausal reasoning) and not CDT (causal reasoning).
      *   If Bob uses CDT, he believes his action cannot influence Alice's. He will Defect.
      *   If Alice does not model this, she might assume a logical link exists where there isn't one. She Cooperates; Bob Defects. Alice loses.
  3.  **Simulation of the Trade:** Often, acausal trade involves simulating the other agent. Alice runs a simulation of Bob inside her own mind. She asks, "If I cooperate, what does the simulation of Bob do?"
      *   To run that simulation accurately, she needs a high-fidelity model of Bob's source code.
      *   Bob is doing the same thing (simulating Alice).
      *   They end up trading with *simulations* of each other. Since the simulation is accurate, the result of the simulation is the same as the result of reality.

  **Summary:** You need the deep model because the "trade" is actually a **logical proof** that `Output(Me) == Output(You)`. You cannot prove that equality if you don't know the function `You` represents. Mere "friendliness" is not a function; it's a hope.

  ---

  ### 3. The Mixed-Decision-Theory Case

  You asked: *What happens if one side uses Causal Decision Theory (CDT) and the other uses broader reasoning (FDT/TDT)? Does the trade still go through?*

  **The short answer is: No. The trade fails.**

  This scenario exposes exactly why the modeling requirement is so strict. Let's walk through the interaction between **Alice (FDT/Acausal)** and **Bob (CDT/Causal)**.

  #### Bob's Perspective (CDT)
  Bob looks at the situation. He believes his choice cannot causally affect Alice's choice. The past is fixed; Alice's decision is already made (or will be made independently).
  *   If Alice Cooperates: Bob gets more points by Defecting.
  *   If Alice Defects: Bob gets more points by Defecting.
  *   **Bob's Conclusion:** Defecting is the dominant strategy. He Defects.

  #### Alice's Perspective (FDT)
  Alice is smarter (in this specific framework). She builds a model of Bob to determine if a logical link exists.
  *   **Scenario A: Alice models Bob accurately.**
      Alice sees that Bob is a CDT agent. She realizes Bob's output is *not* logically tied to hers. Bob will Defect regardless of what she does.
      *   Alice's calculation: "If I Cooperate, Bob Defects (I lose). If I Defect, Bob Defects (I get standard payoff)."
      *   **Alice's Conclusion:** She Defects.
      *   **Result:** (Defect, Defect). Trade fails.

  *   **Scenario B: Alice models Bob inaccurately (Optimistic).**
      Alice assumes Bob is also an FDT agent. She believes her Cooperation implies Bob's Cooperation.
      *   Alice Cooperates.
      *   Bob (being CDT) Defects.
      *   **Result:** (Cooperate, Defect). Alice is exploited. Trade fails (and Alice is punished for her error).

  #### The "Moral" of the Mixed Case
  Acausal trade is not a universal law like gravity; it is a **coordination equilibrium** that only exists between agents who recognize each other as members of the same "logical community."

  A CDT agent is essentially "logically blind" to the other agent. They treat the other agent as part of the weather—something to be predicted, but not something that moves in lockstep with their own reasoning. Because the CDT agent refuses to acknowledge the logical link, the FDT agent (if rational and well-modeled) must treat the CDT agent as a defector and defect in return.

  ### Summary of the Mechanism

  1.  **No Causality:** There is no signal sent. There is no force exerted.
  2.  **Logical Identity:** Cooperation happens because both agents realize they are computing the same logical function. Choosing the output of that function determines the outcome for both.
  3.  **Modeling is Key:** You must verify the other agent is computing the *same* function (FDT/TDT). If they are computing a different function (CDT), the logical link is severed, and you must defect to avoid exploitation.
  4.  **Mixed Theories:** If one agent ignores logical correlations (CDT), the cooperation collapses. Acausal trade requires mutual recognition of acausal reasoning.

  This is why proponents of this theory argue that as AI systems become more transparent (we can read their source code) and more rational (they optimize for true utility rather than heuristic shortcuts), acausal trade becomes not just possible, but the *only* rational way to interact in one-shot scenarios. However, it remains a highly specific condition requiring high-fidelity mutual modeling.
