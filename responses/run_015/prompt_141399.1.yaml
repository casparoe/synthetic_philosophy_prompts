prompt: |-
  I work in human factors / patient safety at a regional air-ambulance service — rotor- and fixed-wing, about forty flight crew, a few thousand missions a year. One of my jobs is maintaining the tool we use in post-incident review: for any given fact at issue (the weather at the destination was below minima, the oxygen cylinder was reading low, the receiving hospital hadn't actually accepted the patient), the review has to land on one of three verdicts about the crew member at time t: they knew, they didn't know but should have, or they couldn't have known. That verdict feeds our just-culture matrix, so it has teeth — the first two can trigger remedial training or a competency sign-off, the third usually just changes a procedure or a display. Right now the tool is basically evidence-based invariantism with a checklist: list what was available to them at t, ask whether it was good enough. That's been fine, but our new medical director has been pushing back hard after a case where the same evidence counted as knowing on a low-stakes repositioning flight and apparently stopped counting once there was a deteriorating pediatric patient on board. She thinks — and I now half think — that the bar really should move with what was at stake for that crew member at that moment, i.e. she's asking for something like pragmatic encroachment, and the committee wants to know what we'd actually be signing up for before we write it into the handbook.

  So: give me the procedure version of that. I want the ordered questions a reviewer asks off an incident report, runnable in half an hour from what our normal reports contain, written so a flight nurse or a pilot on the panel can run it without any theory background (I did a philosophy minor about fifteen years ago and I'm the most theory-adjacent person in the room). For each step, say what counts as a sufficient answer, where the procedure hard-stops with "did not know," and where it has to hand the decision back to a person because the real issue is a values call about what our org wants to be accountable for, not a factual one. Two problems are where our informal attempts keep falling apart, and I want both handled explicitly. First: stakes the agent didn't appreciate — nobody told them the flight had upgraded to a scene call, or they had no idea the patient was deteriorating, so the stakes were objectively huge but weren't ones they possessed or believed in at the time. Second: stakes that get inflated after the fact — we run a safety briefing or issue a new protocol, and suddenly the same crew with the same evidence didn't know what they plainly did know six months earlier. My current hack for both is a "stakes firewall": the review applies the stakes attached to the role as constituted at t (the mission card, the checklist, the protocol then in force), not the stakes the individual happened to feel, and not the stakes later policy would assign. Tell me whether that hack survives being turned into actual steps, whether it quietly collapses the view back into invariantism with extra bookkeeping, or whether it's doing real work — and if you have a better fix for either problem, use yours instead and say why it beats mine. I'd also like a short version of what the document would look like if we went the other way and took the contextualist line, where what shifts is the standard in the review room rather than the stakes for the agent: my sense is that on that view the deliverable stops being a tool about the crew at all and becomes a tool about how to run the meeting, and I want to see how different those two documents really are before I bring either to the committee.

  Then run your procedure on three of our cases. (A) A daytime VFR ferry flight, no patient, where the crew's evidence about deteriorating destination weather was fairly thin but everyone would have said they knew. (B) The pediatric scene call: identical evidence about the same weather, but now there's a kid on board and a twenty-minute window. (C) The one I'm dreading, where I want your procedure to give the answer we won't like: a senior flight paramedic everybody respects, who followed the protocol exactly, who by the procedure's own lights did not know — and where writing that down means his competency sign-off lapses and we have to tell him that to his face. Please end by flagging what the procedure can't do for us: I'm guessing it can settle the knowledge verdict but not whether to sanction, and that there'll be cases where the evidence is fine but the record is too thin to run it at all. Don't give me a survey of the literature or who argued for what — no citations, no reading list; I need something I could drop into an appendix and defend to a room of pilots.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Human Factors / Patient Safety at a regional air-ambulance service (rotor & fixed-wing, ~40 crew, thousands of missions).
      *   **Task:** Create a procedural tool for post-incident review to determine crew knowledge states ("Knew," "Should Have Known," "Couldn't Have Known").
      *   **Current State:** Evidence-based invariantism (checklist of available info).
      *   **Problem:** New Medical Director argues for *pragmatic encroachment* (stakes matter). A low-stakes flight vs. a high-stakes pediatric flight changes whether the same evidence counts as "knowing."
      *   **Specific Requirements:**
          *   Ordered questions for a reviewer (runnable in 30 mins).
          *   Accessible language (no philosophy jargon, for pilots/nurses).
          *   Define sufficient answers, hard-stops ("Did Not Know"), and value-judgment handoffs.
          *   Address two specific failure modes:
              1.  *Unappreciated Stakes:* Crew didn't know the stakes were high (e.g., didn't know it was a scene call).
              2.  *Hindsight Inflation:* Stakes inflated by later policy/safety briefings.
          *   Evaluate the user's "Stakes Firewall" hack (use role/protocol stakes at time *t*). Does it collapse back to invariantism? Is there a better fix?
          *   Provide a short "Contextualist" alternative (shifting standards in the review room vs. shifting stakes for the agent).
          *   **Run the Procedure on Three Cases:**
              *   (A) Daytime VFR ferry (low stakes, thin evidence, usually "Knew").
              *   (B) Pediatric scene call (high stakes, identical evidence, Medical Director says "Should Have Known" or stricter).
              *   (C) The Dreaded Case: Senior paramedic, followed protocol, procedure says "Did Not Know," but this triggers competency lapse/sanction.
          *   **Limitations:** Flag what the procedure *can't* do (sanctioning vs. knowledge, thin records).
          *   **Constraint:** No literature survey, no citations, no reading list. Practical appendix style.

  2.  **Deconstruct the Philosophical Core (for internal use):**

      *   *Invariantism:* Knowledge depends only on truth, belief, and justification (evidence). Stakes don't matter.
      *   *Pragmatic Encroachment:* Knowledge depends on evidence *and* stakes. Higher stakes require more evidence to claim "knowledge."
      *   *Contextualism:* The word "knows" changes meaning depending on the context of the *attributor* (the review board), not necessarily the agent.
      *   *User's "Stakes Firewall":* Fixing stakes based on the *role definition* at time *t*, not subjective feeling or future policy. This is a hybrid. It tries to keep encroachment objective without making it subjective or hindsight-biased.
      *   *Evaluation of Firewall:* It prevents hindsight bias (good). It prevents subjective ignorance from lowering stakes (good). Does it collapse to invariantism? Only if "role stakes" are constant. If role stakes vary by mission type (Ferry vs. Scene), it *is* encroachment.

  3.  **Drafting the Procedure (The "Stakes-Adjusted Knowledge Protocol"):**

      *   *Goal:* Make it actionable.
      *   *Structure:* Phase 1 (Evidence), Phase 2 (Stakes Definition), Phase 3 (The Match), Phase 4 (The Handoff).
      *   *Addressing the Two Problems:*
          *   *Unappreciated Stakes:* Use the "Official Mission Profile" at time *t*. If the dispatch said "Ferry," stakes are low, even if a patient was secretly on board (unlikely, but theoretically). If dispatch said "Scene," stakes are high, even if crew treated it casually.
          *   *Hindsight Inflation:* Lock the "Safety Criticality Level" to the protocol version active at time *t*.
      *   *Refining the "Firewall":* The user's hack is actually robust. It avoids subjective relativism. I should validate it but tighten the definition of "Official Stakes."
      *   *Contextualist Alternative:* This shifts the burden to the *reviewers*. "How certain do *we* need to be?" vs. "How certain did *they* need to be?" The tool becomes a meeting charter, not an investigation checklist.

  4.  **Developing the Steps:**

      *   *Step 1: Evidence Inventory.* (Standard invariantism).
      *   *Step 2: Stake Classification.* (The Encroachment part). Use mission type + protocol version.
      *   *Step 3: The Sufficiency Test.* Does Evidence meet the Threshold for that Stake Level?
      *   *Step 4: The "Should Have" Check.* (Negligence).
      *   *Step 5: The Value Handoff.* When the threshold is ambiguous.

  5.  **Running the Cases:**

      *   *Case A (Ferry):* Low stakes. Thin evidence passes threshold. Verdict: Knew.
      *   *Case B (Peds):* High stakes. Same thin evidence fails threshold. Verdict: Should Have Known (or Couldn't Have Known if evidence was truly inaccessible, but prompt implies "Should Have"). *Correction:* The prompt says identical evidence. If evidence is identical, but stakes are higher, pragmatic encroachment says they *don't know* in Case B, whereas they *did know* in Case A. So Case B verdict shifts to "Should Have Known" (negligence for not getting *more* evidence) or "Couldn't Have Known" (if impossible). Let's aim for "Should Have Known" to trigger training.
      *   *Case C (The Dreaded One):* Senior Paramedic, followed protocol, procedure says "Did Not Know." This is the crux. If the procedure says "Did Not Know" (meaning "Couldn't Have Known" or just "Not Proven"), but the Just Culture matrix says "Did Not Know" = Training/Sanction? Wait, the prompt says: "Knew" / "Didn't know but should have" = Training. "Couldn't have known" = Procedure change.
      *   *Re-reading the Prompt's Verdicts:*
          1.  Knew (Actionable/Intentional?) -> Usually implies accountability.
          2.  Didn't know but should have (Negligence) -> Remedial training/competency.
          3.  Couldn't have known (System) -> Procedure change.
      *   *Case C Twist:* The procedure says "Did Not Know." Does that mean "Should Have" or "Couldn't Have"? The prompt says "by the procedure's own lights did not know — and where writing that down means his competency sign-off lapses." This implies the verdict lands in the "Should Have" bucket (Negligence), even though he followed protocol. This is the conflict between *procedural compliance* and *epistemic diligence*. I need to show how the tool forces this uncomfortable truth.

  6.  **Refining the "Stakes Firewall":**

      *   Does it collapse to invariantism? No, because "Mission Type" changes the stakes. Ferry != Scene.
      *   Is it better than subjective stakes? Yes, objective.
      *   Is it better than hindsight? Yes, time-locked.
      *   *Improvement:* Call it the "Operational Criticality Lock."

  7.  **Drafting the Content (Iterative refinement for tone):**

      *   Tone: Professional, operational, direct. No "epistemology," use "decision rights."
      *   Format: Numbered steps, bold headers, clear "Stop/Go" logic.
      *   Contextualist Section: Keep it brief but distinct. Focus on "Review Board Confidence" vs. "Crew Confidence."

  8.  **Addressing the Limitations:**

      *   Can't determine sanction (that's HR/Just Culture).
      *   Can't fix bad data (Garbage In, Garbage Out).
      *   Can't resolve moral distress (Case C).

  9.  **Final Review against Constraints:**

      *   30-minute runtime? Yes, keep steps tight.
      *   No theory jargon? Yes, translate "pragmatic encroachment" to "Risk-Adjusted Evidence."
      *   Address the two problems explicitly? Yes.
      *   Run the three cases? Yes.
      *   Flag limitations? Yes.

  10. **Self-Correction on Case C:**
      *   If he followed protocol exactly, how does he land in "Should Have Known"?
      *   *Scenario:* Protocol said "Check X." He checked X. X was ambiguous. Low stakes = X is enough. High stakes = X is *not* enough, you needed Y.
      *   *Conflict:* If protocol didn't require Y, is it fair to say he "Should Have Known"?
      *   *Resolution:* This is where the "Value Handoff" comes in. The tool identifies the gap. The Committee decides if the protocol was insufficient (System) or if the professional standard exceeds the protocol (Individual). The tool forces the question; it doesn't answer the fairness. I must make this clear.

  11. **Final Polish:** Ensure the distinction between "Knew," "Should Have Known," and "Couldn't Have Known" is mapped clearly to the output of the steps.

      *   *Step 3 Output:* Evidence Sufficient? (Yes/No).
      *   *Step 4 Output:* Evidence Obtainable? (Yes/No).
      *   *Logic:*
          *   Sufficient = Knew.
          *   Not Sufficient + Obtainable = Should Have Known.
          *   Not Sufficient + Not Obtainable = Couldn't Have Known.
      *   *The Encroachment Lever:* "Sufficient" changes based on Stakes.

      *Let's write it.*
answer: |-
  # APPENDIX D: RISK-ADJUSTED KNOWLEDGE VERDICT PROTOCOL
  **Effective Date:** [Date] | **Owner:** Safety & Human Factors | **Runtime:** 30 Minutes

  ## PURPOSE
  To determine the epistemic state of crew members at the time of an incident (Time *t*). This verdict drives the Just Culture matrix:
  1.  **Knew:** Action was taken with adequate certainty.
  2.  **Should Have Known:** Certainty was inadequate, but achievable. (Trains/Competency)
  3.  **Couldn't Have Known:** Certainty was inadequate and unachievable. (System/Procedure Change)

  This protocol adjusts the *threshold for certainty* based on the operational stakes active at Time *t*.

  ---

  ## PART 1: THE PROCEDURE

  ### STEP 1: LOCK THE EVIDENCE (5 Minutes)
  **Action:** List every piece of information physically or digitally available to the crew member at Time *t*.
  *   *Include:* Instruments, radio calls, checklists, visual cues, dispatch data.
  *   *Exclude:* Anything learned after Time *t* (no hindsight).
  *   *Exclude:* What was in their head unless written/logged.

  **Sufficient Answer:** A complete inventory of data sources.
  **Hard Stop:** If the incident report does not list what instruments were visible or what comms were heard, **STOP**. Return to Investigation Lead. You cannot run this tool on a thin record.

  ### STEP 2: LOCK THE STAKES (5 Minutes)
  **Action:** Determine the "Operational Criticality Level" (OCL) active at Time *t*. Do not use what the crew *felt*. Do not use today's policy. Use the **Operational Criticality Lock**.

  **The Operational Criticality Lock:**
  1.  **Mission Profile:** What did Dispatch designate the flight as at Time *t*? (e.g., Ferry, Standby, Scene, Interfacility).
  2.  **Protocol Version:** What version of the Ops Manual was in force at Time *t*?
  3.  **Patient Status:** What was the *documented* patient acuity at Time *t*? (e.g., "Stable" in dispatch notes vs. "Deteriorating" in medical logs).

  **Assign OCL:**
  *   **OCL-1 (Routine):** Ferry, Standby, Stable Patient.
  *   **OCL-2 (Elevated):** Interfacility with active treatment, Weather Margins < 20%.
  *   **OCL-3 (Critical):** Scene Call, Deteriorating Pediatric/Trauma, Weather Margins < 10%.

  **Sufficient Answer:** A single OCL rating (1, 2, or 3) justified by dispatch logs and protocol version.
  **Hard Stop:** If the Mission Profile is ambiguous (e.g., upgraded verbally but not logged), **HANDOFF TO COMMITTEE**. This is a values call on whether verbal orders count as official stakes.

  ### STEP 3: THE SUFFICIENCY TEST (10 Minutes)
  **Action:** Compare the Evidence (Step 1) against the Threshold required for the OCL (Step 2).

  **Threshold Matrix:**
  *   **If OCL-1:** Evidence is sufficient if it creates >50% confidence (Preponderance).
  *   **If OCL-2:** Evidence is sufficient if it creates >80% confidence (High Probability).
  *   **If OCL-3:** Evidence is sufficient if it creates >95% confidence (Near Certainty).

  **Reviewer Question:** "Given the OCL, was the Evidence in Step 1 robust enough to justify the decision made?"
  *   *Example:* A single weather update might be enough for OCL-1. For OCL-3, you need two independent sources.

  **Outcomes:**
  *   **YES:** Verdict = **KNEW**. (Stop).
  *   **NO:** Proceed to Step 4.

  ### STEP 4: THE AVAILABILITY TEST (5 Minutes)
  **Action:** Determine if better evidence was *obtainable* without violating safety or protocol at Time *t*.

  **Reviewer Question:** "Could the crew have gotten more data (called tower, checked backup gauge, asked medical control) without creating greater risk?"
  *   **YES:** Verdict = **SHOULD HAVE KNOWN**. (Proceed to Just Culture Matrix).
  *   **NO:** Verdict = **COULDN'T HAVE KNOWN**. (Proceed to System Review).

  **HANDOFF POINT:** If "Obtainable" is debatable (e.g., "They could have radioed, but workload was high"), **HANDOFF TO COMMITTEE**. This is a values call on workload vs. diligence.

  ---

  ## PART 2: EVALUATION OF THE "STAKES FIREWALL"

  You asked if your "Stakes Firewall" (using role/protocol stakes at Time *t*) survives contact with reality.

  **Verdict:** It survives, and it is superior to both pure subjective stakes and pure invariantism.

  1.  **Does it collapse to Invariantism?**
      No. Invariantism says evidence requirements never change. Your Firewall says evidence requirements change based on *Mission Profile* (Ferry vs. Scene). This captures the Medical Director's intuition (stakes matter) without making it subjective (what the pilot felt).
  2.  **Does it fix "Unappreciated Stakes"?**
      Yes. If the crew didn't know it was a Scene Call, but Dispatch logged it as a Scene Call, the Firewall sets OCL-3. The crew is held to the standard of the role they were *in*, not the role they *thought* they were in. This protects the patient.
      *   *Caveat:* If Dispatch logged it wrong, the "Hard Stop" in Step 2 triggers a Committee Handoff. You cannot punish crew for organizational lying.
  3.  **Does it fix "Hindsight Inflation"?**
      Yes. By locking the Protocol Version in Step 2, you prevent a new 2024 safety bulletin from raising the stakes on a 2023 incident.
  4.  **Is there a better fix?**
      No. The only alternative is "Reasonable Professional Standard," which is too vague for a checklist. Your Firewall makes the variable (Stakes) objective and auditable. Keep it.

  ---

  ## PART 3: THE CONTEXTUALIST ALTERNATIVE

  You asked for the document if we took the *Contextualist* line (shifting the standard in the review room, not the stakes for the agent).

  **Difference:** The tool above asks, "Did *they* know?" The Contextualist tool asks, "Are *we* comfortable saying they knew?"

  **The Document Changes:**
  *   **Step 2 (Stakes) is deleted.**
  *   **Step 3 (Sufficiency) becomes a "Board Confidence Vote."**
  *   **Wording:** Instead of "Was evidence sufficient?", it reads: "Does the Review Board feel confident enough to assert this crew member knew the fact?"
  *   **Guidance:** "In high-consequence incidents, the Board requires higher confidence to attribute knowledge."

  **Why you probably won't use it:**
  It moves the bias from the *investigation* to the *meeting*. It makes the verdict depend on who is sitting around the table that day. If the Medical Director is angry, the "Board Confidence" rises. If the Chief Pilot is defensive, it falls. Your current "Stakes Firewall" approach is more defensible because it locks the variables *before* the meeting starts.

  ---

  ## PART 4: CASE RUNS

  ### CASE A: Daytime VFR Ferry (Low Stakes)
  *   **Facts:** Ferry flight. Weather at destination degrading. Crew had one METAR report showing marginal VFR. They proceeded.
  *   **Step 1 (Evidence):** One METAR, visual horizon clear at departure.
  *   **Step 2 (Stakes):** Dispatch = Ferry. Patient = None. **OCL-1 (Routine).**
  *   **Step 3 (Sufficiency):** Threshold for OCL-1 is >50%. One METAR + Visual confirms >50% chance of success. **PASS.**
  *   **Verdict:** **KNEW.**
  *   **Outcome:** No action. The risk was within the tolerance for a Ferry flight.

  ### CASE B: Pediatric Scene Call (High Stakes)
  *   **Facts:** Same weather, same single METAR. But now it's a deteriorating pediatric scene call. 20-minute window.
  *   **Step 1 (Evidence):** One METAR, visual horizon clear at departure. (Identical to Case A).
  *   **Step 2 (Stakes):** Dispatch = Scene. Patient = Deteriorating Peds. **OCL-3 (Critical).**
  *   **Step 3 (Sufficiency):** Threshold for OCL-3 is >95% (Near Certainty). One METAR does *not* provide near certainty of destination weather in 45 minutes. **FAIL.**
  *   **Step 4 (Availability):** Could they have called the destination tower for a PIREP? Yes. Would it have cost unsafe time? No. **OBTAINABLE.**
  *   **Verdict:** **SHOULD HAVE KNOWN.**
  *   **Outcome:** Remedial training on risk assessment in Critical Missions.
  *   **Note:** This satisfies the Medical Director. Same evidence, different verdict, because the cost of being wrong is higher.

  ### CASE C: The Dreaded Case (Protocol Compliance vs. Epistemic Diligence)
  *   **Facts:** Senior Flight Paramedic. Administered medication. Followed checklist exactly. Checklist required checking Patient ID and Drug Label. He did both. Patient had a rare allergy not listed in the transferred notes (which were complete per protocol). Patient harmed.
  *   **Step 1 (Evidence):** Transfer notes (complete per protocol), Drug Label, Patient ID.
  *   **Step 2 (Stakes):** Administering high-risk drug. **OCL-3 (Critical).**
  *   **Step 3 (Sufficiency):** Threshold for OCL-3 is >95% certainty of safety. The evidence (notes + label) *should* guarantee safety, but it didn't. The evidence was *objectively* insufficient to prevent harm, even if procedurally complete. **FAIL.**
  *   **Step 4 (Availability):** Could he have known? The allergy was not in the record. He cannot call the patient (unconscious). **NOT OBTAINABLE.**
  *   **Verdict:** **COULDN'T HAVE KNOWN.**
  *   **The Conflict:** You stated the procedure says "Did Not Know" and this triggers a competency lapse.
      *   *Correction:* In this tool, "Couldn't Have Known" triggers **System/Procedure Change**, not competency lapse.
      *   *The Real Dread:* If your Just Culture Matrix maps "Couldn't Have Known" to "Competency Lapse," your Matrix is broken.
      *   *However:* If the verdict lands on **"Should Have Known"** (e.g., "You should have suspected an allergy despite the notes"), then the tool forces the uncomfortable truth: **Procedural Compliance does not equal Epistemic Sufficiency.**
      *   *Running it as you fear:* If the Committee decides a Senior Paramedic *should* have intuited the allergy (Step 4 = Obtainable via "Clinical Intuition"), the Verdict is **SHOULD HAVE KNOWN**.
      *   **Outcome:** You have to tell him: "You followed the rules, but the rules weren't enough for the stakes. Your sign-off lapses."
      *   **Why this is necessary:** If you don't write this down, you lie about safety. The tool forces the organization to own the decision: Do we value protocol compliance or patient outcome? In OCL-3, you must value outcome.

  ---

  ## PART 5: LIMITATIONS (READ BEFORE IMPLEMENTATION)

  1.  **This Tool Does Not Determine Sanction.**
      This tool determines the *Knowledge Verdict*. It feeds the Just Culture Matrix. It does not decide firing, suspension, or counseling. That is an HR and Leadership decision based on the verdict, not the verdict itself. Do not conflate the two.
  2.  **Garbage In, Garbage Out.**
      If the Incident Report does not capture the *available evidence* (Step 1), this tool cannot run. You cannot judge what they knew if you don't know what they saw. Invest in better data recording, not better review tools.
  3.  **The "Values Handoff" is Real.**
      Steps 2 and 4 contain hard stops where the reviewer must say "I can't decide this." This is not a bug; it is a feature. It flags where the organization hasn't decided its own values (e.g., "Is verbal dispatch official?"). Do not force a binary answer there. Let the Committee argue.
  4.  **Moral Distress.**
      Case C will cause moral distress. A crew member can do everything "right" by the book and still fail this review. This tool exposes that gap. It will not fix the feeling of unfairness. Prepare your peer support team for the fallout of Case C-type verdicts.

  ---

  **APPROVAL:**
  Safety Director: ___________________
  Medical Director: ___________________
  Chief Pilot: ___________________
