      *   **Refining the AC position:** AC shouldn't just say "ignore feelings." AC should say "If respect leads to long-term welfare, include it. If not, it's secondary." But the prompt asks AC to address whether intention is a distinct moral concern.
      *   **Refining the BE position:** BE shouldn't just say "karma." BE needs to address "relief of suffering is what matters." BE argues that suffering isn't just physical; it's existential. An act born of coldness *is* a form of suffering, regardless of the calorie count.

