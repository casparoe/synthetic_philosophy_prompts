      *   **Tone:** Competent, nuanced, avoiding slogans.

  2.  **Character Voices:**
      *   **Buddhist Ethicist (BE):** Focused on *cetana* (volition/intention), *metta* (loving-kindness), *dukkha* (suffering/unsatisfactoriness). Sees the act itself as a manifestation of the mind.
      *   **Act-Consequentialist (AC):** Focused on net welfare, utility, measurable outcomes. Sees intentions as instrumental. Pragmatic but open to complex utility calculations.

