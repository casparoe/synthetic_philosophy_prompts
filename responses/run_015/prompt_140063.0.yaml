      *   **Specific Wrinkle:** An impersonal algorithm maximizes measurable suffering relief but causes humiliation (recipients feel uncared for). Monks giving with *metta* (loving-kindness) produce less measurable welfare but create respect.
      *   **Key Arguments:**
