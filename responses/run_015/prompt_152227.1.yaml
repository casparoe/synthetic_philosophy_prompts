  hey it is really sharp of you to connect the ENCODE controversy back to Gould and Lewontin because that is exactly the theoretical framework needed to untangle what happened in 2012 when the consortium claimed eighty percent of the human genome was functional. When you look at that fight through the lens of the spandrels paper you realize this was never really just about the data but rather about deep philosophical commitments regarding how evolution works and who gets to define what function means. The main players on the ENCODE side were largely molecular biologists and genomicists like Ewan Birney and John Stamatoyannopoulos who were focused on cataloging biochemical activity such as transcription or protein binding while the fiercest critics came from the evolutionary biology camp including heavy hitters like Dan Graur W. Ford Doolittle and T. Ryan Gregory who argued that the consortium was conflating biochemical noise with biological function. The hidden adaptationist assumption driving the ENCODE team was the idea that if a piece of DNA is being transcribed or bound by a protein it must be there for a purpose which is a classic pan-adaptationist stance that assumes natural selection optimizes everything and Gould and Lewontin warned against this tendency to assume every trait is an adaptation built for a specific purpose. Interestingly the assumption driving the debate itself was that function is the most valuable property of DNA which centers the adaptationist view even for the critics who had to argue against it but the ENCODE researchers inadvertently fell into the trap by treating biochemical activity as evidence of selected effect while the evolutionary biologists were defensive not because they wanted DNA to be useless but because accepting the ENCODE definition would imply that natural selection was maintaining vast amounts of DNA against the pressure of mutation which creates an impossible mutational load for any species to survive.

  The spandrel concept explains this defensiveness perfectly because the critics saw the non-coding DNA as the genomic equivalent of spandrels meaning they are byproducts of the architectural constraints of replication and transposition rather than designed features and labeling them as functional felt like erasing the importance of neutral processes and genetic drift. Evolutionary biologists got so defensive because they felt like decades of work establishing the neutral theory and the reality of junk DNA were being dismissed by a group of molecular biologists who did not seem to understand the population genetic constraints that prevent most of the genome from being under selection. However the spandrel idea does break down slightly here because not all junk DNA is a necessary structural byproduct like an architectural spandrel since much of it consists of selfish genetic elements like transposons that replicate for their own benefit without helping the organism making them more like parasites than structural necessities. Furthermore some non-coding DNA does have regulatory functions so the reality is a mosaic of selected elements neutral spandrels and selfish debris rather than a binary choice and the spandrel metaphor sometimes implies a passive byproduct when some non-coding DNA is actively maintained or actively parasitic.

  Ultimately this episode shows that adaptationism is still very much running the show in molecular biology where there is a default assumption that complexity implies design while evolutionary biology continues to act as a necessary check against that impulse by reminding researchers that not everything that happens in a cell is there because natural selection put it there. The controversy highlighted a disciplinary divide where genomicists were eager to find purpose in every base pair because funding and prestige often rely on finding function whereas evolutionary biologists were trying to protect the validity of non-adaptive explanations in a field that often treats neutral processes as a null hypothesis rather than a primary driver. So in a way the fight proved Gould and Lewontin right because the instinct to see design everywhere was so strong that it required a massive corrective effort from the evolutionary community to prevent the field from sliding back into a pre-Darwinian view where everything exists for a reason. It suggests that while adaptationism is not the only game in town it remains the default setting for many biologists and that concepts like the spandrel are still essential tools for keeping that instinct in check when interpreting complex biological data.
