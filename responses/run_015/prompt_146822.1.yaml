answer: |-
  The maxim 'words divide, pictures unite' is frequently invoked in secondary literature regarding Otto Neurath, yet it occupies a somewhat ambiguous position within his corpus. While it captures the spirit of the ISOTYPE (International System of TYpographic Picture Education) method, its relationship to Neurath's rigorous doctrine of physicalism and the linguistic formulation of protocol sentences is a matter of careful exegesis.

  Below is a menu of distinct theses that this maxim might express. For each, I have outlined the claim, assessed its truth value or defensibility within Neurath's framework, and evaluated its capacity to support the displacement of verbal protocol sentences within the 'boat' of unified science.

  ### 1. The Cross-Linguistic Portability Thesis
  *   **The Claim:** Natural languages are fragmented by national and cultural boundaries (Babel), whereas visual notation possesses a universal capacity to convey quantitative and structural information across these boundaries without translation.
  *   **Status:** **Philosophically Substantive and Largely Defensible.**
      *   Neurath explicitly designed ISOTYPE to function as a 'visual language' that could bypass the need for translation in international statistics and education. He viewed this as essential for a democratic, socialist enlightenment.
  *   **Relevance to Protocol Sentences:** **Low.**
      *   While portability aids the *dissemination* of scientific results (the 'encyclopaedia' model), it does not necessarily address the *logical structure* of justification. Unified science requires inter-subjective testability, which Neurath believed was secured by physicalist language, not merely by intelligibility. Portability helps the 'united' front of scientists communicate, but does not prove pictures can perform the logical work of a protocol.

  ### 2. The Semantic Determinacy Thesis
  *   **The Claim:** Verbal language is inherently ambiguous, metaphorical, and prone to metaphysical misuse, whereas pictures offer a direct, unmediated correspondence to physical facts, thereby reducing semantic slippage.
  *   **Status:** **Contested / Generally False within Neurath's Framework.**
      *   **Well-Established:** Neurath was acutely aware that pictures are not self-interpreting. ISOTYPE required strict conventions, legends, and keys. He did not believe pictures were 'natural' mirrors of reality but rather constructed tools.
      *   **Contested:** Some visual culture scholars argue Neurath hoped for a higher degree of immediacy in pictures than in words. However, the consensus among logical empiricism scholars (e.g., Cartwright, Cat, Nemeth) is that Neurath recognised pictures suffer from their own ambiguities (e.g., how to depict negation or counterfactuals).
  *   **Relevance to Protocol Sentences:** **Negative.**
      *   Protocol sentences require precise logical syntax (negation, conditionality, quantification). If pictures lack semantic determinacy regarding logical operators, they cannot replace the linguistic protocols required to anchor the 'boat' of science.

  ### 3. The Ideological Neutrality Thesis
  *   **The Claim:** Words carry historical, class-based, or metaphysical baggage (e.g., essentialist nouns), whereas pictures depict spatio-temporal arrangements of objects, aligning better with a materialist, physicalist ontology.
  *   **Status:** **Philosophically Substantive and Defensible.**
      *   This aligns with Neurath's Marxist leanings and his attack on 'pseudorationalism'. He favoured a 'sociology of knowledge' approach where language was seen as a tool that could be corrupted by metaphysics. Visual statistics were intended to show 'facts' of social life (housing, wages) without the rhetorical flourish of political speech.
  *   **Relevance to Protocol Sentences:** **Moderate.**
      *   This supports the idea that pictures are *better* for public communication of physicalist facts. However, it does not prove they can function as *protocol sentences*. A protocol sentence must record an observation event (e.g., 'Observer X saw Y at time Z'). It is difficult to argue that a picture is more 'neutral' than a physicalist sentence describing the observer's state.

  ### 4. The Pedagogical Efficacy Thesis
  *   **The Claim:** Visual notation is cognitively more accessible to the layperson and the worker than technical jargon, thereby democratising knowledge and fostering a unified scientific culture.
  *   **Status:** **Trivially True / Defensible.**
      *   This is the primary, well-documented function of ISOTYPE. Neurath viewed the 'unification of science' not just as a logical task for specialists, but as a social task to integrate science into everyday life.
  *   **Relevance to Protocol Sentences:** **None.**
      *   Pedagogical utility is distinct from epistemic foundation. That pictures are better for *teaching* science does not imply they are suitable for the *logical reconstruction* of science. Neurath never suggested replacing the technical protocols of the specialist with ISOTYPE charts; the charts were derivative of the data established by linguistic protocols.

  ### 5. The Logical Syntax Thesis
  *   **The Claim:** Visual notation possesses, or can be developed to possess, a combinatorial syntax equivalent to logical calculus, allowing for complex propositions (negation, disjunction, implication) to be expressed without words.
  *   **Status:** **Genuinely Contested.**
      *   **Consensus:** ISOTYPE was primarily statistical and affirmative. It excelled at showing 'how many' and 'what kind'.
      *   **Contestation:** Some scholars argue Neurath envisioned a future 'visual logic' that could handle complex propositions. Others argue Neurath accepted the Vienna Circle's view that logic is inherently linguistic (or symbolic in a formal sense) and that ISOTYPE was always a 'halfway house' for communication, not a replacement for logical syntax.
  *   **Relevance to Protocol Sentences:** **Critical.**
      *   If this thesis is false, pictures *cannot* replace protocol sentences. Protocols must be capable of being falsified and logically connected to theories. If pictures cannot express 'It is not the case that...', they cannot serve as the foundation of a falsificationist or coherentist system.

  ### 6. The Epistemic Replacement Thesis (The Strong Claim)
  *   **The Claim:** Because pictures unite and words divide, the foundational protocol sentences of unified science *ought* to be reformulated in visual notation to ensure the stability and unity of the scientific 'boat'.
  *   **Status:** **False regarding Neurath's Explicit Doctrine.**
      *   **Well-Established:** Neurath insisted that protocol sentences must be linguistic. In his debates with Schlick and Carnap, Neurath defended the linguistic nature of protocols against 'phenomenalist' immediacy. For Neurath, 'physicalism' meant the language of physics (spatio-temporal coordinates), which is a linguistic framework.
      *   **Contested:** A minority interpretation suggests Neurath was constrained by the linguistic hegemony of the Vienna Circle and privately desired a visual foundationalism. However, there is no textual consensus to support the view that he intended to *abandon* linguistic protocols.
  *   **Relevance to Protocol Sentences:** **Direct but Unsustainable.**
      *   This is the only thesis that directly supports the argument you are assessing. However, based on the established record, it contradicts Neurath's physicalism. For Neurath, the 'unity' of science was achieved through the *translation* of all sciences into the physicalist *language*, not through the abandonment of language for images.

  ---

  ### Scholarly Context and Caveats

  To accurately assess the argument that Neurath should have abandoned linguistic protocols, you must distinguish between two layers of his work:

  1.  **The Philosophy of Unified Science (Consensus):** It is well-established that Neurath's 'physicalism' was a linguistic thesis. The 'Unity of Science' movement aimed to create a universal *terminology* and *syntax* (interdisciplinary translation), not a universal *imagery*. Protocol sentences were the 'wood' available to rebuild the boat; for Neurath, this wood was language.
  2.  **The ISOTYPE Project (Contested Epistemic Weight):** It is contested whether ISOTYPE was merely a tool for popularisation (the standard view) or an embryonic attempt at a non-linguistic epistemic system (a view held by some contemporary visual theorists).
      *   *Standard View:* ISOTYPE translates data *derived* from linguistic protocols into visuals for the public.
      *   *Revisionist View:* Neurath saw the visual as a corrective to the metaphysical tendencies of language, implying a deeper epistemic role.

  ### Conclusion on the Argument

  If you are assessing the argument that 'words divide, pictures unite' implies Neurath *should have* abandoned linguistic protocols:

  *   **Theses 1, 3, and 4** (Portability, Neutrality, Pedagogy) support the value of ISOTYPE for the *social function* of science, but do not justify replacing protocols.
  *   **Thesis 5** (Logical Syntax) is the pivot point. Unless one can demonstrate that ISOTYPE possessed a logical syntax capable of handling negation and falsification (which is widely doubted), the argument fails.
  *   **Thesis 6** (Replacement) is historically inaccurate regarding Neurath's own commitments.

  Therefore, within Neurath's own framework, the maxim 'words divide, pictures unite' is best understood as a **sociological and pedagogical heuristic**, not a **logical or epistemic prescription**. It argues for the *dissemination* of unified science via pictures, but not for the *constitution* of unified science via pictures. To argue otherwise requires adopting a contested interpretation of Neurath that places ISOTYPE at the centre of his epistemology rather than at the periphery of his social engineering.
