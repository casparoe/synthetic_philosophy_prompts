prompt: |-
  Hey — can you act like a professional philosopher and occasional speechwriter? Before you draft anything, take a minute and brainstorm three structural constraints that the crane-vs-skyhook idea should actually impose on what I can say in the room. Think carefully.

  I'm giving the opening remarks (maybe four minutes) at the retirement workshop for my colleague Dr. Elena Voss. Half the room are philosophers of mind and cognitive scientists who fought with her for decades about reductionism; the other half are family and old friends who just know she was allergic to simplifying people away. I want the philosophical idea to do real work, not sit there like decoration.

  Elena's whole career was an attack on greedy reductionism — the kind that thinks once you've explained the parts you've made the whole disappear — and a defense of crane-building: stepwise, scaffolded explanations that leave the higher-level patterns intact. But I want to push this into a niche angle she never quite published: institutional memory itself works like a crane, not a skyhook. There's no founding genius who dropped this department's culture from nowhere; it was assembled repair-by-repair, disagreement-by-disagreement, over forty years. So the speech needs to honor her by describing her career in exactly those terms. That means I definately can't say she "reduced" social phenomena to neurons, or invoke some essential self watching over the work, or suggest there was a single brilliant origin point for everything she built. The family needs comfort; the experts need to hear that comfort here can't come from false ontology.

  Please write the remarks. Keep them somewhat in the weeds — don't just recite the textbook crane/skyhook distinction — but don't ask anyone to read Dennett or cite papers. The audience is mixed, so land the idea without lecturing.

  After the speech, add a short note saying how confident you are in the philosophical framing, flag the one claim you're least sure about (probably where I stretch the crane idea into institutional history), and point out exactly where you take liberties with a contested reading of greedy reductionism.
