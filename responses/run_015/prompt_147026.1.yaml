          *   The "Hot-Swap" fails here because there is a *break* in consciousness for the drowned one, but not the survivor.
          *   *Verdict:* It's not about temporal spacing allowing observer update. It's about the *branching* problem.
      *   **The Tank of Bodies (Intuition Pump):**
          *   Does it conflate numerical/qualitative identity?
          *   Standard view: Conflation. There's one original, many copies.
          *   Radical view (No-Self/Bundle): The tank reveals there was never a "single ship." There is only the *performance* of Angier.
          *   *Decision:* The tank supports a "Process/Performance" view over a "Substance" view.
      *   **Committed Stand:**
          *   Bodily Continuity? No, bodies are disposable.
