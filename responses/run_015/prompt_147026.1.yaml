          *   *Hot-Swap Analogy:* A server stays "online" (Angier stays "Angier") even if the hardware is swapped. But in the film, the "swap" kills the old hardware. This is the crucial divergence. In engineering, the old drive is removed; in the film, the old Angier drowns.
