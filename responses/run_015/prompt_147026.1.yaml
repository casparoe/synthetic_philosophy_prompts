          *   **Commitment:** Take a definite stand (Bodily, Psychological, or No-Self).
          *   **Constraint:** Admit where the work resists philosophical reduction (doesn't illustrate cleanly).

  2.  **Deconstruct the Core Concepts:**
      *   *Ship of Theseus:* Gradual replacement preserves identity. Why? Continuity of form/function? Spatiotemporal continuity?
      *   *The Prestige (Angier's Machine):* Instantaneous replication. One dies, one lives. Is the survivor the same person?
      *   *Hot-Swappable Redundancy:* In servers/engineering, you swap a hard drive while the system runs. The *service* continues uninterrupted. The *hardware* changes.
      *   *The Twist:* Angier isn't swapping parts gradually; he's swapping the *whole system* instantly, but he treats it like a gradual process (nightly performances).
      *   *The Argument:* Colleagues argue Ship of Theseus survives because observers have time to update tracking (epistemic). The prompt asks to test this against "hot-swapping" (functional continuity without observer lag).

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the prompt's sophistication. Set the stage: *The Prestige* isn't just about teleportation; it's about the *cost* of continuity. Introduce the "Hot-Swap" analogy.
      *   **The Gap (Gradual vs. Instant):**
          *   Ship of Theseus = Low frequency replacement (plank by plank). Observer tracking is easy.
