answer: |-
  You have identified a precise and pernicious rhetorical structure. It is not merely a fallacy in the traditional sense (a flaw in deduction) but a *strategic repurposing of epistemic labor*. You are correct that the standard labels offered by your reading group do not fit. The Galileo Gambit relies on rejection *simpliciter*; this move relies on the *quality and intensity* of the refutation. Sealioning is about the demand for labor; this is about the consumption of labor already performed.

  There is no single, canonical name for this specific shape in the philosophical literature, though its components are well-discussed under different headers. In the philosophy of science, it is a species of **Immunization** (Popper/Lakatos). In the study of misinformation and denialism, it is often categorized under **Manufacturing Controversy** or **The Strategy of Doubt** (Oreskes/Conway). In rhetoric, it is a sophisticated form of **Circumstantial Ad Hominem**.

  However, because you need a label to carve out this specific shape for your reading group, I propose we call it **The Refutation-as-Confirmation Move** (or, more vividly, **Epistemic Jiu-Jitsu**).

  Below is the carving you requested: the definition, the boundaries, the symmetry question, and the markers of faith.

  ### 1. Definition and Structure

  **The Refutation-as-Confirmation Move** is an argumentative maneuver where the *effort* required to refute a claim is metabolized as evidence for a meta-claim about the claim's political or institutional significance.

  **The Shape:**
  1.  **Probe:** Agent A advances a narrow, falsifiable claim $C$ (e.g., "This gas chamber capacity is mathematically impossible").
  2.  **Correction:** Agent B (representing a discipline/institution) expends significant epistemic labor $L$ to refute $C$ (archives, calculations, peer review).
  3.  **Conversion:** Agent A does not accept $\neg C$. Instead, A argues that the magnitude of $L$ is disproportionate to the triviality of $C$.
  4.  **Meta-Claim:** Therefore, $L$ is not evidence of $C$'s falsehood, but evidence of $C$'s *danger*. The discipline is not correcting an error; it is policing a taboo.
  5.  **Displacement:** $C$ is abandoned (or held in abeyance), but the Meta-Claim ("This topic is suppressed") is retained and attached to a new claim $C_2$.

  **Why existing labels fail:**
  *   **Galileo Gambit:** Requires only rejection. This move *requires* a high-quality refutation. A weak refutation undermines the meta-claim (it suggests the taboo isn't worth defending).
  *   **Motte-and-Bailey:** That is a spatial retreat to defensible ground. This is a vertical ascent to a meta-level about the opponent's behavior.
  *   **Sealioning:** That is a demand for $L$. This move uses the *completion* of $L$ as the premise.

  ### 2. Literature and Lineage

  While the specific shape lacks a single name, it sits at the intersection of three literatures:

  *   **Immunization Strategies (Popper/Lakatos):** Popper criticized psychoanalysis and Marxism for being unfalsifiable because they could interpret any outcome (even failure) as confirmation. This move is a rhetorical immunization: the falsification of the claim is interpreted as confirmation of the conspiracy/bias theory.
  *   **Agnotology (Proctor/Schiebinger):** The study of culturally induced ignorance. This move is a tool of agnotology: it uses the production of knowledge (the refutation) to generate doubt about the knower (the discipline).
  *   **Denialism Studies (Lipstadt/Evans/Oreskes):** In *Lying About Hitler*, Richard Evans details how David Irving used the *process* of the trial—the cross-examination, the document requests—to frame himself as a martyr for free speech, regardless of the verdict. Deborah Lipstadt notes that deniers do not seek to win the argument on facts; they seek to win the argument about *why the argument is happening*.

  ### 3. Symmetry: Denier vs. Sincere Questioner

  You asked if the version used by the denier and the version used against the awkward questioner are one phenomenon. **Structurally, yes. Epistemically, no.**

  The *mechanism* is identical: the intensity of the institutional response is taken as data about the institution rather than the claim. However, the *warrant* for the meta-claim differs.

  *   **The Denier's Use:** The meta-claim ("They are hiding something") is false, because the intensity of the response is proportional to the moral/categorical stakes of the error (e.g., denying a genocide), not the complexity of the math.
  *   **The Sincere Questioner's Use:** The meta-claim ("This topic is structurally difficult to research") may be true. Disciplines *do* have taboos, funding biases, and social costs. When a genuine outlier (e.g., Barry Marshall with *H. pylori*) is shouted down, the intensity of the rejection *is* evidence of paradigmatic rigidity.

  **Is the force symmetric?**
  No. It depends on **Institutional Credibility**.
  *   If the institution is high-trust (e.g., mainstream history on the Holocaust), the move reads as paranoia.
  *   If the institution is low-trust or known to be rigid (e.g., a specific departmental clique, or a field with a history of suppressing outliers), the move reads as whistleblowing.
  *   The force of the argument relies entirely on the audience's prior belief about whether the "defense" is a **Protection of Truth** or a **Protection of Turf**.

  ### 4. Distinguishing Good Faith from Bad Faith

  You asked if there is a structural marker to separate them, or if we must settle the merits. We cannot rely solely on the merits (since the "sincere questioner" might be wrong about the facts but right about the sociology). However, there is a **structural marker of recursion**.

  **The Bad-Faith Marker: Infinite Recursion**
  In the bad-faith instance, the Meta-Claim is unfalsifiable.
  *   If the discipline ignores the claim: "They are silencing me by ignoring me."
  *   If the discipline refutes the claim: "They are silencing me by overwhelming me."
  *   If the discipline invites the claimant to collaborate: "They are co-opting me."
  *   **Stopping Rule:** There is no condition under which the actor would accept the discipline's integrity. The Meta-Claim becomes the primary product; the substantive claims are merely bait to generate the refutation labor.

  **The Good-Faith Marker: Falsifiable Meta-Claim**
  In the good-faith instance, the actor is interested in the *resolution* of the substantive claim.
  *   **Stopping Rule:** If the "taboo" is lifted (e.g., a special issue is published, a conference is held), the good-faith actor returns to the substantive merits. They do not need the persecution narrative to sustain their interest.
  *   **Update Behavior:** If the refutation $L$ is shown to be routine (e.g., "We spend this much time on all claims of this type, not just yours"), the good-faith actor updates. The bad-faith actor treats the routine nature of the defense as further proof of the bureaucratic conspiracy.

  **Boundary Case:**
  *   **Not this move:** A sociologist studying *why* a topic is taboo. This is a second-order analysis, but it does not use the taboo to validate a specific first-order factual claim.
  *   **Is this move:** A historian claiming a specific archival document is genuine *because* the establishment refuses to look at it.

  ### 5. Incentive Structure and Audience

  You asked if this is a feature of arguments, audiences, or incentives. It is a feature of the **Attention Economy** applied to **Epistemic Trust**.

  *   **Incentive:** For the denier/actor, the cost of generating the narrow claim $C$ is low. The return on investment is high if the refutation $L$ can be framed as persecution. It turns a loss on the facts into a win on the narrative.
  *   **Audience:** This move works best on audiences who feel alienated from the institution. It transforms the audience's feeling of exclusion ("I don't understand this complex refutation") into a virtue ("I see through their obfuscation").
  *   **Rational Stopping Rule:** There is no rational stopping rule for the *institution* if the goal is truth. You must refute false claims. But there is a **game-theoretic stopping rule**. If the institution knows the Refutation-as-Confirmation move is in play, engaging $L$ feeds the machine. This creates the "Damned if you do, damned if you don't" paradox.
      *   *Solution:* The literature suggests **Pre-bunking** (establishing the consensus before the probe) or **Transparency of Process** (showing that $L$ is standard operating procedure for *all* claims, not just this one).

  ### Summary for the Reading Group

  If you need to present this to your group, I suggest this formulation:

  > "We are looking at a rhetorical technology I am calling **The Refutation-as-Confirmation Move**. It is distinct from the Galileo Gambit because it requires a *competent* refutation to function. It converts the *cost* of truth-maintenance into evidence of corruption. It is structurally identical whether used by a denier or a sincere outsider, but distinguishable by **recursion**: the bad-faith actor uses the meta-claim to avoid settling the substantive claim indefinitely, while the good-faith actor uses the meta-claim to secure a venue where the substantive claim can be tested. It is not a logical fallacy, but an **epistemic hijacking** of the peer review process."

  This preserves your insight: the problem is not that the premise is false (there *are* taboos), but that the *inference* from "defense" to "guilt" is being used to bypass the need for the original claim to be true.
