answer: |-
  ### Brainstorm: The Space of Requirements

  Before narrowing down, here is the full landscape of demands one might place on a decision theory for cluelessness. I've marked which ones I think are essential (Keep), which are useful but secondary (Optional), and which are traps or impossible (Toss).

  *   **Must maximize expected value.** (Toss: Impossible under deep cluelessness; requires probabilities you don't have.)
  *   **Must avoid paralysis.** (Keep: A theory that says "never act" is useless for a bounded agent.)
  *   **Must guarantee good outcomes.** (Toss: No theory can guarantee outcomes in a chaotic system.)
  *   **Must distinguish risk (known odds) from uncertainty (unknown odds) from cluelessness (unknown structure).** (Keep: Critical for your background.)
  *   **Must distinguish not knowing magnitude from not knowing sign.** (Keep: Sign is the binary switch.)
  *   **Must handle model uncertainty (not just parameter uncertainty).** (Keep: You know this is where the bodies are buried.)
  *   **Must treat omissions (doing nothing) symmetrically with acts.** (Keep: Otherwise you bias toward the status quo without reason.)
  *   **Must be computable by a human in an afternoon.** (Keep: Bounded agency constraint.)
  *   **Must not assume the future is inherently good.** (Keep: This is the hidden premise in many long-run arguments.)
  *   **Must handle meta-uncertainty (uncertainty about the uncertainty).** (Keep: Your "error on the error" point.)
  *   **Must justify ignoring hard-to-measure effects.** (Optional: Only if justified by legibility tax.)
  *   **Must justify prioritizing hard-to-measure effects.** (Optional: Only if justified by stakes.)
  *   **Must tell me when to buy information.** (Keep: Crucial for resource allocation.)
  *   **Must work for non-consequentialists.** (Toss: Scope creep. Focus on the decision structure under uncertainty; moral weights are an input, not the engine.)
  *   **Must be invariant to how the problem is described.** (Keep: Framing effects are bugs.)
  *   **Must handle tiny probabilities of huge stakes.** (Keep: The Pascal's Mugging/Long-termism core tension.)
  *   **Must handle symmetric cluelessness (cancellation).** (Keep: If effects cancel, value is zero.)
  *   **Must handle asymmetric cluelessness.** (Keep: If effects don't cancel, value is unknown.)
  *   **Must quantify the "legibility tax."** (Keep: Bias toward measurable things needs a price tag.)
  *   **Must resolve whether cluelessness is epistemic or ontological.** (Optional: Only insofar as it affects information buying.)
  *   **Must provide a stopping rule for regress.** (Keep: For meta-cluelessness.)

  ---

  ### The Spec: Decision-Making Under Cluelessness

  Here is the specification for a theory adequate for a bounded agent with a chequebook. I have filtered the brainstorm above into what is actually required to solve your concrete problems (wetland vs. speculative fund, 10% income, etc.).

  #### 1. The Ontological Question: In the Head or In the World?
  **Requirement:** The theory must distinguish between *epistemic* cluelessness (the value is fixed, I just don't know it) and *ontological* cluelessness (the value isn't settled yet depends on chaotic unfolding).
  **Why:** In your field, this determined whether you collected more data or accepted stochasticity.
  **Verdict:** For decision-making, the distinction matters *only* for the "buy information" recommendation. If the uncertainty is ontological (the system is chaotic), buying information has diminishing returns faster. A theory that treats all cluelessness as epistemic will over-recommend research. A theory that treats all as ontological will under-recommend research. It must allow you to tag sources of uncertainty.

  #### 2. Distinctions That Must Not Collapse
  Adequate theories must keep these separate. If a theory blurs them, it is hiding assumptions.
  *   **Risk vs. Uncertainty vs. Cluelessness:** Risk is known distributions. Uncertainty is unknown distributions. Cluelessness is unknown *causal pathways*. Most online arguments treat cluelessness as just "wide uncertainty." That is wrong. You can have a wide distribution around a known mechanism; you cannot have a distribution around an unknown mechanism without assuming a meta-model.
  *   **Sign vs. Magnitude:** Not knowing *how much* good is different from not knowing *if* it is good. A theory that averages a +1000 and -1000 outcome to get 0 is mathematically clean but morally dangerous if the -1000 is existential risk.
  *   **Model Uncertainty:** You know this well. It's not just that the growth rate $r$ is unknown; it's that the logistic model might be wrong and the system is actually chaotic. The theory must allow weighting competing causal models, not just parameter ranges.
  *   **Symmetric vs. Asymmetric Cluelessness:** If I don't know the effect of my donation on Option A, and I don't know the effect on Option B, that's symmetric. If I know Option A (wetland) but not Option B (policy), that's asymmetric. Theories often treat symmetric cluelessness as a wash (cancel out). They must not do this if the baseline (doing nothing) is also clueless.
  *   **Consequentialist vs. Non-Consequentialist:** A theory of *decision under uncertainty* should work regardless of your moral weights. If you have side-constraints (duties), they act as filters on the option set. The decision engine itself shouldn't require you to be a pure consequentialist, but it must be honest that cluelessness hits consequentialists hardest because they care about *all* effects.

  #### 3. Cases It Must Handle
  *   **Measured Near-Term vs. Speculative Long-Term:** The wetland (observable feedback loops) vs. the existential risk fund (unobservable counterfactuals).
  *   **The Drop in the Bucket:** Being one of a million donors. Does your contribution trigger a threshold? Or is it linear? The theory must handle non-linear pivotality.
  *   **Disagreement on Sign:** Plausible Model 1 says +100, Plausible Model 2 says -100. The theory cannot just average these to 0 and walk away. It must flag the conflict.
  *   **The Baseline:** "Doing nothing" is an option. Does it have an expected value of 0? No. Doing nothing also has long-run effects. The theory must treat the baseline as an intervention with its own cluelessness profile.
  *   **Information Buying:** When to spend money on figuring out the model vs. spending money on the intervention.

  #### 4. Arguing the Three Specific Requirements

  **(1) Sign-Robustness**
  *   *The Demand:* Act only when the sign of the effect survives every model you're willing to take seriously.
  *   *My View:* This is necessary but insufficient. It is the "do no harm" principle translated to uncertainty. However, it is easily weaponized. If I include a "demon model" where everything you do is evil, nothing is sign-robust.
  *   *Verdict:* Required, but must be constrained to *reasonable* models. You need a pruning rule for the model space, or sign-robustness leads to paralysis. It protects against catastrophe, but it doesn't tell you how to do good.

  **(2) The Legibility Tax**
  *   *The Demand:* If cluelessness pushes you toward options whose effects you can track (wetlands), are you paying a premium for legibility rather than value? Must the theory quantify this?
  *   *My View:* This is the hardest practical requirement. Yes, you are paying a tax. You are discounting unmeasurable value to zero because it's unmeasurable. A theory must explicitly state this discount rate. If it doesn't, it's hiding a bias toward the measurable.
  *   *Verdict:* Required. The theory must force you to state: "I am ignoring the long-run effects because my confidence in their sign is below threshold X," not "I am ignoring them because they don't exist."

  **(3) Meta-Cluelessness**
  *   *The Demand:* Must handle being unsure about its own uncertainty (error on the error).
  *   *My View:* Yes, but with a stopping rule. In ecology, you eventually stop modelling the error structure because the data doesn't support it. A decision theory cannot demand infinite regress. It must allow for "confidence intervals on confidence intervals" but mandate a cutoff where further refinement costs more than the decision is worth.
  *   *Verdict:* Required, but bounded. The theory must include a "cost of thinking" function.

  #### 5. Incompatible Desiderata (The Trade-Offs)
  Here is the honest verdict on what cannot be jointly satisfied. You cannot have it all.

  *   **Sign-Robustness vs. Action-Guidance:** If you demand strict sign-robustness across all plausible models in a complex system, you will often get paralysis. To get action, you must relax sign-robustness (accept some risk of negative sign) or prune the model space aggressively (ignore plausible but scary models). You cannot have both perfect safety and frequent action.
  *   **Long-Run Sensitivity vs. Pascal's Mugging Immunity:** If you accept that long-run effects dominate (because the future is vast), you must accept that tiny probabilities of huge stakes dominate your decision. If you want to ignore tiny probabilities (to avoid mugging), you must ignore the long-run tail. You cannot say "The future matters most" and also "Ignore speculative long-run claims."
  *   **Bounded Rationality vs. Full Model Uncertainty:** You cannot integrate over all possible causal models because you don't know the set of all possible models. A theory that demands you account for "unknown unknowns" is uncomputable. A theory that is computable must ignore unknown unknowns. You must choose between honesty and usability.
  *   **Symmetry of Omission/Commission vs. Guidance:** If doing nothing is just as clueless as doing something (which it is, in the long run), then cluelessness cannot guide you to act *or* refrain. It cancels out. To get guidance, you must treat the status quo as having a different uncertainty profile than interventions (e.g., status quo is "known bad" vs intervention is "unknown").

  #### 6. The Single Most Demanding Requirement
  **Action-Guidance under Sign Uncertainty.**
  This is the killer. Most theories fail here.
  *   *Long-termism* fails by assuming the sign (future is good).
  *   *Scepticism* fails by freezing (sign is unknown, so do nothing).
  *   *Near-termism* fails by ignoring the sign uncertainty of the long-run (pretending it doesn't exist).
  A theory that tells you how to act when you genuinely don't know if you're helping or hurting, without assuming the answer, is the holy grail. None of the existing popular frameworks fully satisfy this without smuggling in a premise.

  ---

  ### Scorecard: Main Families of Views

  Here is how the common arguments stack up against the spec.

  | View Family | Sign-Robustness | Legibility Tax Handled? | Meta-Cluelessness | Bounded Agent Friendly? | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Straight Expected-Value Totalism** (Long-termism) | **Fail.** Assumes positive sign for future interventions. | **Fail.** Treats unmeasurable long-run effects as calculable EV. | **Fail.** Often ignores error on the error (model uncertainty). | **Fail.** Requires computations impossible for humans. | **Reject.** Too brittle. Assumes away the problem. |
  | **Near-Term Washout** (Effects cancel out) | **Pass.** Uses cancellation to claim sign is neutral. | **Pass.** Implicitly discounts long-run to zero. | **Fail.** Assumes cancellation without proving symmetry. | **Pass.** Easy to compute. | **Suspicious.** Relies on unproven symmetry assumptions. |
  | **Act on What You Can See** (Near-termism) | **Pass.** For near-term. **Fail.** Ignores long-term sign. | **Fail.** Pays legibility tax without admitting it. | **Pass.** Ignores meta-uncertainty by ignoring long-run. | **Pass.** Very tractable. | **Useful but dishonest.** Hides the legibility bias. |
  | **Buy Information / Keep Options Open** | **Pass.** Delays action until sign is clear. | **Pass.** Values information gain. | **Pass.** Treats uncertainty as reducible. | **Fail.** Can lead to infinite delay (paralysis by research). | **Good heuristic, bad theory.** Doesn't tell you when to stop. |
  | **Fall Back on Non-Consequentialist Duties** | **Pass.** Duties are sign-robust (e.g., "don't lie"). | **Pass.** Ignores consequences, so legibility irrelevant. | **Pass.** Doesn't model consequences. | **Pass.** Rule-based is cheap. | **Scope Creep.** Changes the moral question, doesn't solve decision theory. |
  | **Sign-Robust Big-Stakes** (Robust Positive Intervention) | **Pass.** Demands sign robustness. | **Fail.** Often ignores legibility tax on "robust" claims. | **Fail.** Often overconfident in model space pruning. | **Fail.** Hard to verify robustness without staff. | **Best aim, poor execution.** The goal, but current versions are shaky. |

  ### Final Verdict

  None of the standard online packages satisfy the spec completely.
  *   The **Long-Termists** violate the "no assumption of positive sign" rule.
  *   The **Sceptics** violate the "avoid paralysis" rule.
  *   The **Near-Termists** violate the "legibility tax" transparency rule.

  **Recommendation for the Bounded Agent:**
  Adopt a hybrid heuristic that admits its own flaws.
  1.  **Sign-Robustness Filter:** Reject any option where a plausible model says "catastrophic harm." (Safety first.)
  2.  **Legibility Discount:** Explicitly discount long-run speculative value by a factor you choose (e.g., 90%) to account for model error, rather than calculating it precisely. Admit this is a bias for safety, not truth.
  3.  **Meta-Stop Rule:** Set a budget for thinking (e.g., 10 hours). When the budget is spent, act on the best sign-robust option available, even if uncertainty remains.
  4.  **Baseline Check:** Acknowledge that doing nothing is also speculative. If the wetland has known local good and unknown long-run effects, and the speculative fund has unknown local and unknown long-run effects, the wetland wins on *variance reduction*, not necessarily expected value.

  This doesn't solve the philosophy, but it satisfies the spec for a bounded agent who needs to write a cheque this month. It treats cluelessness as a risk management problem (like ecology) rather than a calculation problem (like economics).
