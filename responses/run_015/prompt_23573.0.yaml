answer: |-
  Here is a structured set of questions designed for a 20-minute Q&A session. They are ordered to build pressure on the "same agent" deflection, starting with the individual case (where the deflection is strongest) and moving to the constitutional case (where it is weakest), culminating in the request for falsifying evidence.

  ### Moderator Opening (1 minute)
  "Thank you for that fascinating talk. We have about twenty minutes for questions. I'd like to focus our discussion on the limits of the **self-authorship criterion**. You argue that precommitments are autonomy-respecting because the authoring agent and the constrained agent are identical. I have three lines of questioning that probe whether this identity holds up under epistemic error, practical constraint, and intergenerational distance."

  ---

  ### Part 1: The Sophistication Assumption (Individual Case)
  *Goal: Challenge the epistemic conditions of the "authoring" self. If the authoring self is wrong, does their authority persist?*

  **Question 1:**
  "Let's start with the individual Ulysses contract. Your defense relies on the authoring self correctly anticipating a failure of will in the future self. But human beings are often bad predictors of their own future preferences. If the authoring self makes a **substantive error**—binding the future self based on a false prediction about what that future self will value—does the 'same agent' criterion still protect the legitimacy of the constraint? Or does the authority of the authoring self depend on the *accuracy* of their prediction, not just the *act* of willing?"

  * **Likely Answer:** She will likely argue that autonomy is procedural, not substantive. She will say the authority comes from the rational *act* of precommitment at T1, not the outcome at T2. As long as T1 was rational *at the time*, T2 is bound, even if T1 was factually wrong. The "same agent" remains the author regardless of error.
  * **Follow-up 1 (Moderate Difficulty):**
    "So, if I understand, the legitimacy survives even if the constraint actively frustrates the future self's *actual* rational interests, provided the past self *believed* it was serving them. But if the 'same agent' is defined by rational continuity, doesn't a persistent pattern of such errors suggest a **break in rational agency**? At what point does the authoring self's error become so severe that we must say the 'author' was not acting as a rational agent, thereby voiding the self-authorship claim?"
    *(Why this is harder: It forces her to admit there is a threshold of error that breaks the "rational agent" link, weakening the absolute nature of her defense.)*

  ---

  ### Part 2: The Reversibility Condition (Effectiveness vs. Autonomy)
  *Goal: Challenge the practical mechanics. If the bind is too strong, T2 cannot act as an agent; if too weak, it isn't a bind.*

  **Question 2:**
  "Moving to the mechanics of the bind: For a Ulysses contract to be effective, the cost of breaking it must be high enough to deter the future self during a moment of weakness. However, if the cost is *too* high, the future self is effectively silenced—they cannot act even if they have new, relevant information that the authoring self didn't have. How do you distinguish between a precommitment that **respects the future self's autonomy** and one that simply **colonizes their decision-space**? If the future self cannot undo the contract without ruinous cost, in what sense are they still an 'agent' rather than a subject of the past self's rule?"

  * **Likely Answer:** She will likely argue that the high cost *is* the expression of the agent's autonomy. The agent *chose* the high cost to ensure their long-term goals won. To allow easy reversal would be to disrespect the authoring self's will. The "same agent" willingly accepted the cost.
  * **Follow-up 2 (Harder Difficulty):**
    "But that response treats the 'cost' as a static expression of will. If the future self encounters a **moral emergency** or a radical change in circumstances that the authoring self could not foresee, insisting on the original cost seems to treat the future self as a mere means to the past self's ends. If the 'same agent' deflection holds, why does the future self's *new* rationality not carry the same weight as the past self's *original* rationality? Why does the temporal priority of the author grant it lexical priority over the constrained?"
    *(Why this is harder: It attacks the temporal hierarchy implicit in her view. It asks why T1 > T2 if they are the "same" moral entity. This strains the "same agent" deflection by highlighting the conflict between two temporal stages of the same agent.)*

  ---

  ### Part 3: The Constitutional Case (Intergenerational)
  *Goal: Challenge the metaphysical claim. "Same polity" is much harder to defend than "same person." End with the evidence requirement.*

  **Question 3:**
  "Finally, let's apply this to the constitutional case. Here, the 'authoring agent' is a generation of framers who are now dead, and the 'constrained agent' is a living generation of citizens who had no hand in the authorship. You argue the polity is the 'same agent' across time. But in the individual case, we have psychological continuity to ground that identity. In the constitutional case, the actual humans are entirely different. What **non-metaphorical work** is the 'same polity' claim doing here? If the 'self' in self-authorship is a collective entity that outlives its members, does this not risk making the Constitution immune to democratic revision simply by reifying the state as a mystical agent?"

  * **Likely Answer:** She will likely argue that political identity is normative, not biological. The "People" is a continuous project or corporation sole. The Constitution is the standing will of that corporate agent, and current citizens participate in that agency by accepting the benefits of the order.
  * **Follow-up 3 (Hardest Difficulty + Evidence Requirement):**
    "If the 'People' is a continuous agent, that claim must be falsifiable; otherwise, the self-authorship criterion is tautological. **What specific historical or empirical evidence would count against the self-authorship criterion?** For example, would a radical demographic shift, a revolution, or a prolonged period of exclusion constitute a break in the 'same agent' relation sufficient to void the precommitment? If you cannot specify what would break the chain of agency, how can we claim the chain still holds?"
    *(Why this is the hardest: It demands she admit her theory has limits. If she says "nothing could break it," she admits it's dogma. If she says "X could break it," she admits that current constraints might be illegitimate paternalism. This forces her off the "same agent" deflection entirely.)*

  ---

  ### Moderator Closing (1 minute)
  "We have time for one or two brief questions from the floor, but I'd like to thank our speaker for engaging with these challenges regarding the limits of self-authorship and the evidence required to sustain it."

  ---

  ### Strategic Notes for the Moderator
  1.  **The Arc:** Notice how the questions move from *Epistemology* (Did T1 know best?) to *Morality* (Is T2 silenced?) to *Metaphysics/Evidence* (Is the Polity real?). The "same agent" deflection works best in Q1 and worst in Q3.
  2.  **Managing the Follow-ups:** If she gives a long answer to the Main Question, you may need to summarize her point before asking the Follow-up. Say: *"If I hear you correctly, you're saying [X]. But then..."*
  3.  **The Evidence Question:** This is your "kill shot" for the 20-minute limit. If she struggles with Follow-up 3, do not press for a floor question. Let the silence hang. It emphasizes the philosophical weight of the problem. If she answers easily, you can open the floor.
  4.  **Tone:** Keep your tone inquisitive, not adversarial. You are exploring the *implications* of her view, not trying to "destroy" it. Use phrases like *"Help me understand..."* or *"I'm struggling to see how..."*
