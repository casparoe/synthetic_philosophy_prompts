prompt: |-
  I price risk for a small mutual that insures self-build and off-grid houses — about 400 policies, so half the classes I could pick are three claims and a hunch. Every house belongs to dozens of classes that all point at different numbers, and I keep catching myself choosing the one that gives the answer I want: either so broad it's meaningless or so narrow it's me and two sheds. I want a written procedure I can run on each new quote: how to choose the class, how far to narrow it before the data stops supporting it, what to do when two perfectly reasonable classes disagree wildly, when to say I definately can't produce a defensible number at all, and what to write down so a lay complaints panel can see I wasn't just picking a class to suit myself. Constraints: roughly twenty minuets per quote, the classes have to be pre-registered with the board each year so I can't invent them ad hoc, and the board has banned any class defined partly by postcode. Then run it on three: a straw-bale house, a house with a subsidence claim from the previous owner, and one where the only class with enough data in it is ruled out by the ban. Take a definite line on each rather than listing my options, and be straight about where the "procedure" is really just my judgement in a nice suit.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and application:

  1.  **Analyze the Request:**
      *   **Context:** Small mutual insurer (400 policies), self-build/off-grid houses.
      *   **Problem:** Data sparsity (some classes have 3 claims), conflicting class indicators, selection bias (choosing classes to get desired results), need for defensibility against a lay complaints panel.
      *   **Constraints:** ~20 minutes per quote, pre-registered classes only (no ad-hoc invention), no postcode-based classes (board ban).
      *   **Deliverables:**
          1.  A written procedure for class selection and pricing.
          2.  Application of this procedure to three specific scenarios (Straw-bale, Previous Subsidence, Data-rich class banned).
          3.  Tone: Direct, honest about where judgment overrides rigid rules ("judgment in a nice suit").
          4.  Format: Definite lines, not lists of options.

  2.  **Deconstruct the Core Problem:**
      *   *Credibility:* With 400 policies, most sub-classes will have zero or one claim. Pure experience rating is impossible for most segments.
      *   *Bias:* The user admits to "cherry-picking" classes to match a hunch. The procedure needs to act as a guardrail against this.
      *   *Defensibility:* A lay panel needs to see *logic*, not just math. They need to see that the process was consistent, even if the data was weak.
      *   *Time:* 20 minutes is tight. The procedure can't involve complex Bayesian modeling or external data sourcing that takes hours.

  3.  **Drafting the Procedure (The "Guardrails"):**
      *   *Step 1: Hierarchy of Classes.* Need a way to prioritize classes. Broad vs. Narrow.
      *   *Step 2: Credibility Threshold.* When is data too thin? If $N < 5$ exposures or Claims < 3, it's noise.
      *   *Step 3: Conflict Resolution.* What if "Wood Frame" says £500 and "Off-Grid" says £2000? Need a tie-breaker.
      *   *Step 4: The "Judgment" Clause.* Acknowledge that sometimes the math fails. Document *why*.
      *   *Step 5: Documentation.* What goes in the file for the panel?

      *Refining the Procedure:*
      *   Make it a checklist.
      *   Enforce a "Base Class + Adjustment" model rather than picking a specific niche class every time. This reduces the "picking the answer I want" risk.
      *   Set a hard limit on credibility. If a class has fewer than 10 exposures in the portfolio, it's not a "class," it's an anecdote.
      *   Address the "Postcode Ban": This is a major constraint. It means geographic risk (flood, subsidence) must be handled via construction or specific risk attributes, not location codes.

  4.  **Developing the Three Scenarios:**
      *   *Scenario 1: Straw-bale house.*
          *   Issue: Niche construction. Likely very few in portfolio.
          *   Decision: Can't rate on "Straw-bale" experience (N=1 or 0). Must use "Non-Standard Construction" base + specific loading.
      *   *Scenario 2: House with previous subsidence claim.*
          *   Issue: Past history vs. current risk. Class might be "Residential" but risk is specific.
          *   Decision: Class is standard, but risk adjustment is mandatory. Don't hide it in the class selection.
      *   *Scenario 3: Data-rich class ruled out by ban.*
          *   Issue: The best predictor (e.g., "Clay Soil Zone A") is banned because it implies postcode.
          *   Decision: Must revert to the next best proxy (e.g., "Foundation Type" or "Distance to Trees"). Acknowledge the imperfection.

  5.  **Addressing the "Judgment in a Nice Suit" Requirement:**
      *   I need to be explicit that a procedure cannot fix bad data.
      *   I need to state clearly where the human makes the call.
      *   The tone should be professional but cynical/realistic about the limitations of small data.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Name:* "The 20-Minute Credibility Protocol."
      *   *Step 1 (The Base):* Start with the broadest pre-registered class that applies to *all* 400 policies (e.g., "Dwelling"). This is your anchor.
      *   *Step 2 (The Modifiers):* Apply pre-registered modifiers (Construction Type, Heating, etc.).
      *   *Step 3 (The Credibility Cut-off):* If a specific class has <10 lives or <3 claims in the *entire* book, ignore its specific loss ratio. Use the Base Rate + Expert Loading.
      *   *Step 4 (Conflict):* If modifiers contradict, prioritize Physical Hazard over Financial/Usage Hazard.
      *   *Step 5 (The Paper Trail):* Write down the "Rejected Class" and the "Reason."

      *   *Scenario 1 (Straw-bale):* Class = "Non-Standard Construction." Loading = +50%. Why? No credibility for "Straw" specifically.
      *   *Scenario 2 (Subsidence):* Class = "Standard Dwelling." Loading = +100% or Exclusion. Why? Past claim indicates ground risk, not building class risk.
      *   *Scenario 3 (Banned Class):* Class = "Standard Dwelling." Loading = +25% (Proxy for geographic risk). Note the constraint in the file.

  7.  **Review against Constraints:**
      *   20 mins? Yes, checklist is fast.
      *   Pre-registered? Yes, relies on existing classes/modifiers.
      *   No Postcode? Yes, explicitly handled.
      *   Defensible? Yes, creates an audit trail.
      *   Honest? Yes, admits where data is useless.

  8.  **Final Polish:**
      *   Ensure the tone is authoritative.
      *   Make sure the "Judgment" section is prominent.
      *   Check that the three examples are decisive (no "you could do X or Y").

      *(Self-Correction during drafting)*: I initially thought about suggesting Bayesian shrinking. *Correction:* No, too complex for 20 mins and a lay panel. Stick to "Base Rate + Loading." It's easier to explain to a complaint handler than "credibility weighting."
      *(Self-Correction on Class Selection)*: The user says they pick classes to suit themselves. The procedure must force them to start with the *broadest* applicable class and only narrow if credibility exists. This prevents "me and two sheds" pricing.

  9.  **Final Output Structure:**
      *   Introduction (Acknowledging the reality).
      *   The Procedure (The "20-Minute Credibility Protocol").
      *   The "Judgment in a Nice Suit" Disclaimer.
      *   The Three Test Cases (Applied decisively).
      *   Documentation Standard (For the panel).

  10. **Final Review:** Does this answer the prompt? Yes. Is it practical? Yes. Is it honest? Yes.

  *(Proceed to generate response based on these thoughts.)*
answer: |-
  ### The 20-Minute Credibility Protocol

  This procedure is designed to stop you from hunting for a class that confirms your hunch. It forces you to start with the collective experience of the mutual and only deviate when the data is heavy enough to carry the weight.

  **1. The Anchor Rule (Minutes 0–5)**
  Identify the **Broadest Pre-Registered Class** that applies to the risk. This is usually "Residential Dwelling" or "Self-Build Project."
  *   **Action:** Pull the loss ratio and exposure count for this broad class across the entire 400-policy book.
  *   **Constraint:** This is your baseline price. You are not allowed to price below this baseline unless a specific modifier *reduces* risk (e.g., alarm systems).
  *   **Why:** This prevents the "me and two sheds" problem. If you can't justify a deviation with the whole book's data, you stay with the whole book's price.

  **2. The Credibility Cut-Off (Minutes 5–10)**
  Review the specific sub-classes the house fits (e.g., "Timber Frame," "Off-Grid," "Thatched").
  *   **The Hard Limit:** If a specific sub-class has **fewer than 10 active exposures** OR **fewer than 3 claims** in the entire mutual history, its specific loss ratio is **statistically void**.
  *   **Action:** Do not use the specific loss ratio of that sub-class to set the price. Instead, apply a pre-agreed "Expert Loading" or "Discount" to the Anchor Rate.
  *   **Why:** With 400 policies, a sub-class with 3 claims is noise. Using it is selection bias disguised as math.

  **3. The Conflict Resolver (Minutes 10–15)**
  If two valid sub-classes point in opposite directions (e.g., "Fire Sprinklers" suggests lower risk, "Remote Location" suggests higher risk):
  *   **Priority Hierarchy:** Physical Construction Hazards > Mitigation Features > Location/Usage Features.
  *   **Action:** Price for the Physical Construction Hazard. Apply the Mitigation as a discount only if it is verifiable and certified.
  *   **Why:** A sprinkler system doesn't stop a straw-bale wall from rotting. Construction drives the claim severity; mitigation drives frequency. Prioritize severity.

  **4. The "No-Go" Declaration (Minutes 15–20)**
  If the Anchor Class is too broad to be meaningful (e.g., covers castles and sheds) AND all specific sub-classes fail the Credibility Cut-Off:
  *   **Action:** You must declare the risk "Unrateable on Experience."
  *   **Pricing:** You must price at the **Board-Set Minimum Rate** for new business, plus a specific risk loading.
  *   **Documentation:** You must write: *"Data insufficient for experience rating. Priced at Minimum Rate + X% for specific hazard."*
  *   **Why:** This protects the mutual. If you can't prove the price is right, you must ensure the price is safe.

  ***

  ### The "Judgment in a Nice Suit" Disclaimer

  Here is the truth you need to put in your file note: **This procedure does not eliminate judgment; it documents it.**

  When you apply an "Expert Loading" because the data failed the Credibility Cut-Off, that percentage is a guess. It is an educated guess based on your experience, but it is still a guess. The procedure forces you to admit that the math has stopped and the underwriting has begun.

  For the complaints panel, the defense is not that the number is mathematically perfect. The defense is that **you followed the same rules for the cheap quote as you did for the expensive one.** Consistency defeats accusations of bias. If you can show that you rejected a class for Policy A because it had only 4 exposures, you must reject the same class for Policy B for the same reason.

  ***

  ### Application to Three Test Cases

  Here is how you run the protocol on your specific examples. No options. Just the decision.

  #### 1. The Straw-Bale House
  *   **The Situation:** Unique construction. Likely only one or two others in the 400-policy book.
  *   **The Procedure:**
      *   **Anchor:** "Residential Dwelling."
      *   **Credibility Check:** "Straw-Bale" sub-class has 2 exposures, 0 claims. **Fails Cut-Off.**
      *   **Conflict:** None.
      *   **Decision:** **Reject "Straw-Bale" specific rate.** Price using the Anchor Rate + 25% "Non-Standard Construction" loading (pre-registered modifier).
      *   **File Note:** *"Straw-bale class lacks credibility (N=2). Priced on Base Residential + Non-Standard Loading. Risk of moisture/fire deemed higher than timber but unquantifiable in book."*

  #### 2. The House with a Previous Subsidence Claim
  *   **The Situation:** The building class is standard brick, but the history is toxic.
  *   **The Procedure:**
      *   **Anchor:** "Residential Dwelling."
      *   **Credibility Check:** "Brick Dwelling" passes credibility. However, "Previous Subsidence" is a risk attribute, not a construction class.
      *   **Conflict:** The class says "Safe," the history says "Danger."
      *   **Decision:** **Price on Anchor Class, apply 100% Loading or Exclusion.** Do not try to find a "High Risk Subsidence" class if it lacks data.
      *   **File Note:** *"Class data credible but does not reflect specific risk history. Base rate doubled to account for ground movement probability. Previous claim treated as physical hazard equivalent."*

  #### 3. The Data-Rich Class Ruled Out by Ban
  *   **The Situation:** You know "Clay Soil Zone 3" is the perfect predictor. It has 50 exposures and a clear loss ratio. But the board banned postcode-derived classes.
  *   **The Procedure:**
      *   **Anchor:** "Residential Dwelling."
      *   **Credibility Check:** "Clay Soil Zone 3" is ignored because it violates the Board Ban (proxy for postcode).
      *   **Conflict:** Best data vs. Compliance Rule.
      *   **Decision:** **Revert to Proxy Class.** Use "Foundation Type: Deep Pile" vs. "Standard Strip." If foundation data is missing, revert to Anchor + 15% "Ground Risk Loading."
      *   **File Note:** *"Optimal class (Soil Zone) unavailable due to Board Postcode Ban. Priced using Foundation Type proxy. Acknowledge increased uncertainty in pricing due to regulatory constraint."*

  ***

  ### The Paper Trail for the Complaints Panel

  To survive a complaint, your file note for every quote must contain exactly these three lines. If they are missing, you were guessing.

  1.  **Selected Class:** [Name of Pre-Registered Class]
  2.  **Credibility Status:** [Pass/Fail based on 10 exposure / 3 claim rule]
  3.  **Deviation Reason:** [Why you added a loading or rejected a narrower class]

  **Example for the Straw-Bale House:**
  1.  **Selected Class:** Residential Dwelling (Non-Standard)
  2.  **Credibility Status:** Fail (N=2 exposures)
  3.  **Deviation Reason:** Specific 'Straw' class statistically void. Applied standard Non-Standard loading per Protocol Step 2.

  **Why this works:**
  When the complaint handler asks, "Why did you charge him more than his neighbour?" you don't say "Because his house is weird." You say, "Because his house fell into a class with fewer than 10 exposures, and our agreed procedure mandates a loading in that event to protect the mutual."

  That is defensible. It is not perfect, but it is honest. And in a small mutual with sparse data, honesty is the only solvency you have.
