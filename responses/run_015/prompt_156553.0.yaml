answer: |-
  You have stumbled onto a very specific, robust configuration in decision theory and negotiation, but you are frustrated because common language lumps it together with things it isn't (hedging, logrolling, weak compromise).

  There is no single common English noun for this, but in economics and game theory, this is an agreement based on **Concave Utility Functions** leading to a **Pareto Improvement**.

  If you want a label to use in the wild that captures the carving you're looking for, call it **"Concave Compromise."**

  Here is the clean account of what it is, why your friend is wrong about "hedging," and how to handle the edge cases you identified.

  ### 1. The Carving: Epistemic vs. Structural

  Your friend's first move was to call this **hedging**. Hedging is an *epistemic* maneuver. It implies: *"I am not sure I am right, so I will protect myself against being wrong."*

  Your move is a *structural* maneuver. It implies: *"I am sure I am right, but value is non-linear."*

  In decision theory, this is the difference between **uncertainty about probability** (hedging) and **risk aversion due to utility curvature** (concave compromise).
  *   **Hedging:** I think there is a 60% chance bikes are best. To be safe, I'll take the split.
  *   **Concave Compromise:** I think there is a 100% chance bikes are best. However, the first $50k of bike lanes saves 100 lives, and the second $50k saves 5 lives. The pool guy thinks the reverse. We both prefer guaranteeing the "first $50k" of our own project over a 50% chance of getting the "second $50k."

  You are not conceding on the *truth* (which project is better); you are conceding on the *marginal intensity* of your preference. This is not weakness; it is an acknowledgment of logistical reality.

  ### 2. Why It Isn't "Deal-Making" (Logrolling)

  Your friend's second move was to call this **logrolling** ("I'll scratch your back, you scratch mine"). Logrolling usually involves *independent* goods.
  *   **Logrolling:** I vote for your pool (which I don't care about) if you vote for my bikes (which you don't care about).
  *   **Concave Compromise:** We both care intensely about the *same* pot of money, but we agree that the *density of value* drops off for both projects.

  In logrolling, we are trading things we value differently. In Concave Compromise, we are trading *segments of the same thing* based on a shared understanding of diminishing returns. It is **Integrative Bargaining** (expanding the total utility available) rather than **Distributive Bargaining** (fighting over a fixed slice).

  The reason this feels different to you is that in logrolling, I am indifferent to your project. In your scenario, you are *opposed* to his project, but you value the *certainty* of your own project's high-yield phase more than the *gamble* of its low-yield phase.

  ### 3. The "Hidden Concession" Worry

  You asked: *"If my own view says the good falls off that steeply... does that just mean I never really thought the project was worth the full amount in the first place?"*

  **No.** This is the most important distinction.

  Admitting diminishing marginal returns is not admitting the project is bad; it is admitting that **resources are fungible but outcomes are not.**
  *   **Example:** You are hungry. You want a pizza. You are 100% confident a whole pizza is better than no pizza. But the first slice is vital; the fourth slice is just "nice."
  *   If someone offers you a deal: "Guarantee yourself the first two slices, or flip a coin for the whole pizza," you take the two slices.
  *   Does that mean you didn't want the whole pizza? No. It means the *utility* of the third and fourth slices did not outweigh the *risk* of losing the first two.

  You are not conceding that the bike lanes are unworthy. You are conceding that the **cost-benefit ratio** of the final 40% is lower than the initial 60%. That is an engineering claim, not a moral one.

  ### 4. Pinning Down the Edges

  You identified three edge cases that prove you have correctly isolated the phenomenon. Here is how they map to the theory:

  **Edge 1: Thresholds (Convex Utility)**
  *   *Scenario:* Half a sea wall is useless. The value curve is S-shaped (Convex), not Concave.
  *   *Result:* The split is now irrational. A coin flip is superior.
  *   *Diagnosis:* This confirms that your original position depended entirely on **Concavity**. If the utility function is Convex (increasing returns), Concave Compromise collapses. You are back to a zero-sum fight.

  **Edge 2: Active Harm (Negative Utility)**
  *   *Scenario:* The pool isn't just useless; it's dangerous or drains maintenance funds (Negative Value).
  *   *Result:* The math changes. $Total Value = U(My Project) + U(Their Project)$. If $U(Their Project)$ is negative, the split might yield less total utility than a coin flip where you have a 50% chance of *zero* harm.
  *   *Diagnosis:* Concave Compromise only works if the opponent's project is **Neutral-to-Positive** (or at least, not sufficiently negative to outweigh your marginal gains). If their project is actively harmful, you cannot "split the pot"; you must block it. This distinguishes **Rivalry** (we want different things) from **Antagonism** (your thing hurts me).

  **Edge 3: One Pot vs. Two Budgets**
  *   *Scenario:* If you each had your own budget, you'd spend it all on your project.
  *   *Result:* The conflict exists *only* because of the shared constraint.
  *   *Diagnosis:* This is a **Resource Allocation Game**. The "Compromise" is actually a **Efficiency Maximization**. By splitting the pot, the committee is actually generating more total "good" (in your respective views) than if a winner took all. You are both acting as efficiency experts for your own values.

  ### 5. Summary Definition

  If you need to put this to your friend or the committee, here is the definition:

  > **Concave Compromise:** An agreement where parties maintain maximal disagreement on *priority* (which project is best) but agree on *marginal utility* (the first dollars spent are more valuable than the last).
  >
  > It is distinct from **Hedging** because it requires no uncertainty about which project is superior.
  > It is distinct from **Logrolling** because it does not require valuing the opponent's project positively, only accepting it as a lower-cost alternative to risk.
  > It is distinct from **Standard Compromise** because neither party moves their position on the "truth"; they merely optimize the *deployment* of resources under risk aversion.

  **The Verdict:**
  You are not hedging. You are not making a secret concession. You are recognizing that **certainty of high-yield outcomes is mathematically superior to a gamble on low-yield outcomes.**

  Your friend is arguing from a model of **Linear Utility** (where every dollar of the bike lane is worth exactly the same). You are arguing from **Diminishing Returns**. If he agrees that the last 40% of the pool is "nice to have" rather than "essential," he has already accepted your premise. He just hasn't realized that accepting that premise forces the math to land on the split.

  Tell him: *"I'm not hedging on whether bikes are better. I'm hedging on whether the last 40% of a bike network is worth risking the first 60% of one. If you agree the last 40% of the pool is low-value, you should take the deal for the exact same reason."*
