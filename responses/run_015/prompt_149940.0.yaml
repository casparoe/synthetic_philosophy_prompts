answer: |-
  Your tentative principle is a strong start because it centers the **subject's agency** ("could be told and act on"). That intuition successfully explains why you prefer Calibration (Case 1) over Equalized Error Rates (Case 2). If a score means different things for different people, it ceases to be information the subject can use to understand their standing.

  However, your principle cracks on Cases 3 and 4 (features) and Case 5 (pipelines). A subject can be told "You didn't go to a bootcamp" and act on it (go to one), just as they can be told "You had a C-section." The difference isn't actionability; it's **legitimacy**. Similarly, in Case 5, the subject can't see the pipeline, so "actionability" doesn't capture the systemic harm.

  To reconcile your six verdicts, we need to expand from "Actionability" to a framework of **Reciprocal Justifiability**. The system must be justifiable to the subject *and* the subject's reality must be justly represented in the system.

  Here are four candidate principles that repair your intuition, map to your verdicts, and expose the tension points.

  ### The Repaired Framework

  **1. The Semantic Invariance Clause**
  *   **The Rule:** A risk score must represent the same underlying probability of the outcome for every individual, regardless of group membership.
  *   **The Buy:** This secures **Case 1** (Calibration is fine) and rejects **Case 2** (Equalized error rates via moved cutoffs). If a "7" means 30% risk for Group A and 15% for Group B, you cannot truthfully explain the decision to the Group B applicant without lying about what the number means.
  *   **The Cost:** You must accept disparate error rates if base rates differ.

  **2. The Ontological Grounding Clause**
  *   **The Rule:** Features are permissible only if they track the *physical or causal mechanism* of the risk, not the *social history* of disadvantage.
  *   **The Buy:** This distinguishes **Case 3** (C-sections) from **Case 4** (Bootcamps). A prior C-section creates scar tissue; that is a physiological mechanism directly causing surgical risk. A coding bootcamp signals network access; that is a social mechanism correlating with opportunity. One is about the body's capacity; the other is about the system's gatekeeping.
  *   **The Cost:** You must accept that some biological markers are confounded by social access (as you noted in Case 3), prioritizing immediate safety over long-term equity.

  **3. The Holistic Accountability Clause**
  *   **The Rule:** Fairness is a property of the final decision distribution, not the intermediate components. Compositional fairness does not guarantee systemic fairness.
  *   **The Buy:** This validates **Case 5** (The Pipeline). Even if Vendor A and Vendor B are individually "fair," if the composition yields a discriminatory outcome, the system is liable. Your "poisonous meal" analogy is correct: toxicity emerges from the combination.
  *   **The Cost:** You cannot outsource fairness. Banks cannot blame vendors; vendors cannot blame algorithms.

  **4. The Performative Alignment Clause**
  *   **The Rule:** If a model's deployment changes the underlying base rate of risk (by altering behavior), the model must update to reflect the new reality, provided the change represents genuine risk reduction.
  *   **The Buy:** This justifies **Case 6** (Pretrial Release). If the tool causes judges to release low-risk defendants who then *stay* low-risk, the base rate has genuinely shifted. Re-fitting isn't "ratcheting"; it's acknowledging the intervention worked.
  *   **The Cost:** You accept that the "truth" of the score is dynamic, not static.

  ---

  ### The Honest Audit: Which Verdict Must Go?

  You asked for honesty about whether a tidy principle can keep all six. **Case 3 is the weak link.**

  Your **Ontological Grounding Clause** tries to save Case 3 by distinguishing "body" from "society." But you admitted in your setup that C-section rates track "unequal access to obstetric care." If Group A has more C-sections because they were denied preventative care earlier in life, then the C-section count *is* a proxy for social disadvantage, merely mediated by biology.

  If you strictly enforce the spirit of Case 4 (don't punish people for structural inequality), you logically have to drop Case 3. Keeping Case 3 requires a **Triage Exception**: *Medical safety overrides fairness constraints when the feature is a direct physiological cause of immediate harm.*

  If you are unwilling to make that exception, you must drop Case 3. If you keep it, you are admitting that sometimes accuracy/safety trumps anti-discrimination, which is a valid but heavy moral cost.

  ---

  ### Testing the New Cases

  Here is how the framework handles your unsettled scenarios.

  **(a) The Kidney Function Estimate (eGFR)**
  *   *Setup:* A hospital puts race directly into the formula to correct biological mis-estimation.
  *   *Verdict:* **Permissible, but fragile.**
  *   *Reasoning:* This violates **Semantic Invariance** (the formula differs by group) but satisfies **Ontological Grounding** (muscle mass/creatinine processing differs biologically by ancestry).
  *   *The Tension:* This is the real-world eGFR controversy. Your framework allows it *only if* the biological difference is real and not a proxy for social determinants of health. If the "race coefficient" is correcting for diet or access rather than biology, it violates Principle 2.
  *   *Action:* Use the coefficient only while a race-neutral biological marker (like Cystatin C) is unavailable. The goal is to migrate to a measure that satisfies Invariance *and* Grounding.

  **(b) Adding Noise to Equalize Errors**
  *   *Setup:* Deliberately degrading scores for high-risk borrowers to match error rates.
  *   *Verdict:* **Forbidden.**
  *   *Reasoning:* This violates **Semantic Invariance** (the score no longer reflects risk) and **Ontological Grounding** (noise is not causal). It makes the score un-actionable (the applicant cannot act on a lie) and dishonest to the bank.
  *   *Principle Check:* This is the clearest failure case for "Equalized Odds" when achieved via manipulation rather than threshold adjustment. Your intuition that this is wrong is robust.

  **(c) The Endogenous Group (Model-Defined Class)**
  *   *Setup:* The "group" is "everyone the previous model flagged."
  *   *Verdict:* **The Framework Breaks.**
  *   *Reasoning:* Your principles (and standard fairness metrics) assume groups are **pre-existing** (A vs. B). If the group is *created* by the model, you cannot measure "disparate impact" against a baseline, because the baseline is the model's own history.
  *   *Repair:* You must switch from **Group Fairness** to **Validity Fairness**. The question isn't "Are Group A and B treated equally?" It is "Is the flag *valid*?"
  *   *Application:* If the previous model was biased, the "Flagged" class inherits that bias. You cannot treat this class as a neutral protected group. You must audit the *generator* of the class.
  *   *Does your principle apply?* No. Your "Actionability" principle assumes a human receiving a score. Here, the "group" is an artifact. This reveals a limit: **Fairness metrics require ontologically real groups.** If the system creates the caste, you cannot use caste-based metrics to fix it; you must dismantle the caste.

  ### Summary Recommendation

  Your gut is mostly right, but it relies on a hidden distinction between **Mechanism** (how the risk happens) and **History** (how the person got there).

  1.  **Keep Cases 1, 2, 4, 5, 6.** They form a coherent philosophy: Scores must be truthful (1, 2), features must be causal not social (4), outcomes matter more than processes (5), and models must adapt to their own impact (6).
  2.  **Re-evaluate Case 3.** Acknowledge that keeping it is a **Safety Exception**, not a fairness consistency. You are prioritizing immediate physical safety over long-term structural equity. That is a defensible trade-off, but call it what it is.
  3.  **Reject Case (b).** Adding noise is never the answer; it breaks the contract of truth between institution and subject.
  4.  **Watch out for Case (c).** When groups are synthetic, group fairness metrics are useless. You need validity audits, not parity checks.

  Your friend is right that you can't satisfy all mathematical criteria simultaneously. But you are right that you don't have to satisfy all of them *morally*. You pick the criteria that preserve the subject's ability to understand the decision (Calibration), the features that reflect reality rather than prejudice (Grounding), and the accountability for the final outcome (Holism). The rest is noise.
