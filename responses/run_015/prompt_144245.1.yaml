          *   Motive/Interest: "The consideration of his joy could in him excite no new joy... Bring him into society, and all his own passions will immediately become the causes of new passions."
      *   *Distinction:* The mirror is epistemic (knowing the quality of the act). The motive is psychological (caring about the quality). Smith says without society, passions are "immediately present" but not "objects of his thoughts."
      *   *Test Case A:* Smith says the solitary man "could no more think of his own character... than of the beauty or deformity of his own face." Even the journaler (Person A) lacks the *reaction* of another. Imaginary companions aren't "other people" in Smith's sense because they don't have independent passions to sympathize with. Smith says the mirror is "placed in the countenance and behaviour of those he lives with." So, Person A and B are likely in the same boat regarding *moral* self-assessment, though A might have better *intellectual* self-assessment. The "new passions" (pride/shame) require actual external feedback loops.
      *   *Test Case B:* The last human. "Bring him into society, and he is immediately provided with the mirror." If you remove society, do you lose the mirror? Smith says the spectator is "supposed." Once socialized, you carry the spectator within you ("habit is there"). However, Smith emphasizes the *need* for the mirror to *first* view propriety. Once formed, can it sustain itself? The text says we "endeavour to view them with the eyes of other people." If no people exist, we view them with the *memory* or *imagination* of people. The conscience likely "freezes" or slowly decays without new "countenance and behaviour" to calibrate against, but it doesn't vanish instantly because the "supposed equitable judge" is an internalized habit.
