answer: |-
  1) On the three-way judgment and the normative "ought," your friend is half-right but misses the crucial mechanism of the "impartial spectator." Smith writes that our self-judgment bears reference to "what are, or to what, upon a certain condition, would be, or to what, we imagine, ought to be the judgment of others." Your friend treats the first limb ("what are") as the only real engine, reducing the spectator to a tape recorder of local custom. If that were true, Smith would be a pure relativist. But the text distinguishes the "fair and impartial spectator" from the actual people around us. The "ought" limb is not just the "would" limb in a costume; it is the *corrected* version of the "would." When Smith says we examine our conduct "as we imagine any other fair and impartial spectator would examine it," he is describing an imaginative act of stripping away bias. If you were raised by animal-tormentors, your *actual* environment (the first limb) would approve of cruelty. But to form the "impartial" spectator, you must imagine a judge who is not a party to the case. If you can sympathize with the animal's pain (a capacity Smith assumes is natural), the "impartial" spectator would condemn the torment, even if the "actual" spectators approve. So, the "ought" carries the normative weight because it represents the *idealized* sympathy of human nature, not the *actual* sympathy of your neighbors. Your friend wins on the *origin* of the conscience (it comes from society), but you win on the *authority* (it can critique that society).

  2) The "mirror" and the "motive" are distinct claims in Smith's machinery, though they work together. The mirror is epistemic: "All these are objects which he cannot easily see... he is provided with no mirror which can present them to his view." The motive is psychological: "The consideration of his joy could in him excite no new joy... Bring him into society, and all his own passions will immediately become the causes of new passions." For your test case of the two isolates, Smith's text suggests they are morally identical despite Person A's journaling. The mirror is "placed in the countenance and behaviour of those he lives with," not in one's own writings. Without actual "countenance" to react, Person A cannot generate the "new passions" of pride or shame that make morality matter to us. For the last human alive, the answer is that the conscience freezes rather than decays immediately. Smith says we "endeavour to view them with the eyes of other people." Once socialized, you carry the "supposed equitable judge" within you as a habit of imagination. You no longer need the physical mirror to *operate* the conscience, because you can simulate the spectator. However, without new "countenance and behaviour" to calibrate against, that internal spectator cannot develop further; it becomes a static echo of the society you lost.

  3) On the regress problem, Smith is firmly on the second horn: the change of place produces a distinctive feeling that stops the chain. When he writes, "If... we thoroughly enter into all the passions and motives which influenced it, we approve of it, by sympathy with the approbation of this supposed equitable judge," the approval *is* the feeling of sympathy itself. It is not a judgment *about* the sympathy that requires a third-party check. The "sentiment of propriety" is the emotional resonance of concord between your actual self and your imagined spectator. If the tones match, you feel approval; if they clash, you feel shame. That feeling is the stopping point. This explains why people raised in the same village end up with different consciences: the *mechanism* (sympathetic concord) is the same for everyone, but the *construction* of the spectator varies. One person might imagine a spectator who is more informed or more impartial than another does. The regress doesn't happen because you don't need a spectator to judge your spectator; you just need to feel whether your motives align with the one you've imagined. The variation comes from how well, or how honestly, you construct that judge in the first place.
