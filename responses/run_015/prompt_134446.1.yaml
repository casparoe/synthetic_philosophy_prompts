  # Taxonomy of Commemorative Legitimacy: A Decision Tree

  **Context:** This decision tree maps the logical space of philosophical positions regarding the "lost cause" phenomenon. It utilizes four paradigmatic cases to anchor the diagnostic questions: the American Confederate "Lost Cause" (moral taint), the Masada siege (mythic resilience), the Kosovo Field battle (national martyrdom), and the Dunkirk evacuation (strategic defeat turned moral victory).

  **Instructions:** Follow the path from the root (Node 1) to a terminal leaf (1–8) by answering each question. The resulting leaf describes the conditions under which a collective memory of defeat is deemed legitimate.

  ---

  ### **Node 1: The Moral Veto**
  **Question:** Does the moral injustice of the defeated cause (e.g., the Confederate defense of slavery) automatically invalidate any commemoration of that defeat, regardless of the soldiers' bravery or the narrative's utility?
  *   **YES** → Go to **Node 2A** (Moral Constraints Active)
  *   **NO** → Go to **Node 2B** (Moral Constraints Inactive)

  ---

  ### **Node 2A: The Truth Constraint (Under Moral Veto)**
  **Question:** If a cause is morally permissible, must the commemorative narrative strictly adhere to documented historical facts, even if accuracy diminishes the story's inspirational power?
  *   **YES** → Go to **Node 3A**
  *   **NO** → Go to **Node 3B**

  ### **Node 2B: The Truth Constraint (Without Moral Veto)**
  **Question:** Must the commemorative narrative strictly adhere to documented historical facts, even if accuracy diminishes the story's inspirational power (e.g., acknowledging Dunkirk was a military disaster)?
  *   **YES** → Go to **Node 3C**
  *   **NO** → Go to **Node 3D**

  ---

  ### **Node 3A: The Locus of Value (Moral + Truth)**
  **Question:** Is the legitimacy of the memory grounded in the *virtues of the historical actors* (Ancestors) or the *present social cohesion of the community* (Descendants)?
  *   **Ancestors** → **Leaf 1**
  *   **Descendants** → **Leaf 2**

  ### **Node 3B: The Locus of Value (Moral + Myth)**
  **Question:** Is the legitimacy of the memory grounded in the *virtues of the historical actors* (Ancestors) or the *present social cohesion of the community* (Descendants)?
  *   **Ancestors** → **Leaf 3**
  *   **Descendants** → **Leaf 4**

  ### **Node 3C: The Locus of Value (No Veto + Truth)**
  **Question:** Is the legitimacy of the memory grounded in the *virtues of the historical actors* (Ancestors) or the *present social cohesion of the community* (Descendants)?
  *   **Ancestors** → **Leaf 5**
  *   **Descendants** → **Leaf 6**

  ### **Node 3D: The Locus of Value (No Veto + Myth)**
  **Question:** Is the legitimacy of the memory grounded in the *virtues of the historical actors* (Ancestors) or the *present social cohesion of the community* (Descendants)?
  *   **Ancestors** → **Leaf 7**
  *   **Descendants** → **Leaf 8**

  ---

  ## **Terminal Leaves: Positions and Diagnostics**

  ### **Leaf 1: The Moral-Exclusionist Position**
  *   **Path:** Yes (Veto) → Yes (Truth) → Ancestors.
  *   **Core Commitment:** Commemoration is legitimate only if the cause was just, the history is accurate, and the focus remains on the actual virtues of the actors.
  *   **Status:** **Named Position.**

  ### **Leaf 2: The Moral-Functionalist (Empty)**
  *   **Path:** Yes (Veto) → Yes (Truth) → Descendants.
  *   **Core Commitment:** Commemoration is legitimate only if the cause was just and history is accurate, but the value lies in current social cohesion.
  *   **Status:** **Unoccupied.** *Diagnosis:* Logically unstable; if moral justice is a strict veto, the functional benefit to descendants is rendered secondary and cannot be the primary locus of legitimacy.

  ### **Leaf 3: The Moral-Mythic Virtue (Empty)**
  *   **Path:** Yes (Veto) → No (Truth) → Ancestors.
  *   **Core Commitment:** Commemoration is legitimate only if the cause was just, but historical accuracy may be sacrificed to highlight the ancestors' virtues.
  *   **Status:** **Unoccupied.** *Diagnosis:* Morally repugnant to proponents of the Veto; permitting myth-making undermines the moral clarity required to distinguish just from unjust causes.

  ### **Leaf 4: The Moral-Mythic Function (Empty)**
  *   **Path:** Yes (Veto) → No (Truth) → Descendants.
  *   **Core Commitment:** Commemoration is legitimate only if the cause was just, but myth is permissible if it sustains current social cohesion.
  *   **Status:** **Unoccupied.** *Diagnosis:* Contradictory; this collapses into the Communitarian-Functional view (Leaf 8) by prioritizing cohesion over the moral veto's demand for restriction.

  ### **Leaf 5: The Critical-Historicist Position**
  *   **Path:** No (Veto) → Yes (Truth) → Ancestors.
  *   **Core Commitment:** Legitimacy requires substantial historical accuracy, and the memory's value is found in the reality of the ancestors' actions rather than their utility.
  *   **Status:** **Named Position.**

  ### **Leaf 6: The Pragmatic-Realist (Empty)**
  *   **Path:** No (Veto) → Yes (Truth) → Descendants.
  *   **Core Commitment:** Legitimacy requires historical accuracy, but the ultimate justification is the benefit to the living community's cohesion.
  *   **Status:** **Unoccupied.** *Diagnosis:* Merely unexplored; historically, those who demand accuracy usually prioritize truth for its own sake (Leaf 5) rather than as a tool for cohesion.

  ### **Leaf 7: The Civic-Republican Position**
  *   **Path:** No (Veto) → No (Truth) → Ancestors.
  *   **Core Commitment:** Valor, sacrifice, and institutional loyalty can be extracted from an unjust or lost cause, even if the narrative requires mythologizing.
  *   **Status:** **Named Position.**

  ### **Leaf 8: The Communitarian-Functional Position**
  *   **Path:** No (Veto) → No (Truth) → Descendants.
  *   **Core Commitment:** A myth is legitimate if it presently sustains solidarity and is not actively harmful, regardless of historical accuracy or the original cause's justice.
  *   **Status:** **Named Position.**

  ---

  ## **Analysis of Logical Space**

  ### **Unoccupied Branches**
  The "Moral Veto = Yes" branch (Leaves 1–4) contains three empty positions (Leaves 2, 3, 4). This space is empty not because the logic is impossible, but because the **Moral Veto** functions as a "stopper." If a philosopher answers "Yes" to Node 1, the subsequent questions about Truth (Node 2) and Value Locus (Node 3) become secondary or moot. A Moral-Exclusionist rejects the commemoration of an unjust cause *before* evaluating its historical accuracy or social function. Therefore, Leaves 2, 3, and 4 represent theoretical combinations that lack historical advocates because the initial moral judgment precludes the need for further criteria.

  Leaf 6 (Pragmatic-Realist) is empty due to a lack of historical advocate. While logically coherent, few theorists argue for strict historical accuracy *solely* to serve social cohesion; typically, the demand for accuracy (Critical-Historicism) is deontological (truth is a duty) rather than consequentialist (truth is useful).

  ### **Overlapping Named Leaves**
  **Leaf 1 (Moral-Exclusionist) and Leaf 5 (Critical-Historicist)** cannot be genuinely separated in cases involving a *just* cause.
  *   **Shared Commitments:** Both demand strict historical accuracy (Node 2 = Yes) and ground value in the ancestors' virtues (Node 3 = Ancestors).
  *   **Overlap Explanation:** If the cause is just (e.g., the Allied fight against fascism), both positions prescribe identical commemorative practices: tell the truth and honor the virtue. The tree only separates them when the cause is unjust (e.g., the Confederacy). The Exclusionist bans commemoration based on Node 1; the Historicist might permit it if the history is told accurately (Node 1 = No), provided the truth does not suppress injustice. Consequently, in "positive" memory cases, these two positions are functionally indistinguishable.
