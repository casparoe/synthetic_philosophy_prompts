prompt: |-
  You're a professional moral philosopher who works on population ethics. Please think this through properly instead of reaching for the standard answer — start by brainstorming: generate every distinct, precise claim you can think of that someone might mean by the two lines below, don't filter them yet, and only once you've got a long list start sorting it into (a) things that are true but nearly trivial, (b) substantive claims that are actually defensible, (c) claims that are false or rest on a confusion, and (d) claims that are really conclusions dressed up as premises. Take your time with it.

  Background, because I think it matters: my wife and I keep going back and forth about whether to start trying for a baby, and a couple of weeks ago I made the mistake of airing the worry at a dinner party. One guest — philosphy MA, very confident — kept closing the conversation down with two one-liners: "no one is harmed by not being born", and "the asymmetry: we've got a reason not to create a miserable child, but no reason to create a happy one". He also sketched a four-box table where pain being present is bad, pleasure being present is good, pain being absent is good, but pleasure being absent is not bad. I'd never seen that before and it struck me as way to neat.

  What I want is a disambiguation, not a verdict on whether to have kids. Both lines are being made to do real argumentative work and I cant tell what work they can bear:

  1. The first line is used to kill my "but our kid would probably have a good life, and that counts for something" move. The second is used to get from there to "so nothing about the childs own interests could ever justify creating them", and then — sliding, I suspect — to "so having children is morally unjustifiable", or at least "always in need of some justification that has nothing to do with the child".

  So: what are the precise theses? Please keep separate, at least: claims about harm or benefit to someone; claims about which states of the world are better or worse impersonally; claims about what reasons there are; claims about what we have a duty to do as opposed to what is merely permissible or optional; and claims about what comparisons are even available when one of the things being compared doesn't exist. My own hunch is that the first sentence is just a point about what "worse off" can mean when there's no one there to be worse off — but I can't tell whether that makes it a platitude or makes it the load-bearing premise, and I suspect the dinner-party version needs it to be both at once.

  For each reading on your menu, give me: a one-sentence statement of it, whether it's trivial / substantive / false, and — the part I care most about — whether it actually delivers what he needed. Specifically, does it (i) show that the future child's happiness can't count as a reason to create them, and (ii) get him anywhere near "procreation is unjustifiable"? Flag clearly where a reading would need an extra premise he never stated, and say what that premise would have to be.

  Two more things I want chewed on.

  First: my flatmate, who's read a bit of Parfit, came up with a distinction I haven't been able to shake. He says the second line is ambiguous between what he calls identity-selecting and existence-deciding choices. In an existence-deciding case the options really are "this child, with a good life" versus "no child at all". But in an identity-selecting case — conceive this month or wait six months, in which case a numerically different child results — the options are "this child with a good life" versus "a different child with a good life", and nobody who exists on either option is worse off on either. His claim is that most of the intuitive force of the asymmetry comes from existence-deciding cases, and that it goes quiet exactly where my actual decision lives. Is that a real distinction or a philosopher's trick? Can the asymmetry survive being restricted to existence-deciding cases — is there any interesting claim left that doesn't just collapse into comparing how good the resulting lives are? And if he's right, does the whole thing end up having almost nothing to say about an ordinary person's decision to have a kid now rather than later?

  Second: is the asymmetry secretly a consent principle, or a "don't impose risks on people who can't refuse" principle, wearing population-ethics clothing? If so, say so, and tell me what else it would condemn — I'd guess it would condemn a lot of ordinary stuff, and I'd rather know that than be handed a principle that does its work only in the case of reproduction.

  Please don't give me reading lists, names to look up, or page references: I'm asking this on a machine with no internet and I don't care who said what first. Plain arguments only. If you had to guess which reading my dinner-party guest actually had in mind, say which, and tell me the minimum extra premise he'd need for his argument to go through.
