  - that the result is real and reproducible and not some systematic that happens to track the geometry
  - that a finite-speed influence (superluminal but not instant) is the best fit, rather than something that only looks like it
  - that this still counts as giving up locality, rather than being a separable theory wearing a costume
  - that the fade pattern doesn't itself point at a conspiracy between the setting choices and the source
  - and whatever fourth or fifth term you think I'm leaving out — I bet there's one about how you'd even synchronize and time-tag the two stations over that kind of baseline

  with a number and one line of justification each, then how you combine them. Then: which sub-question the headline number is most sensitive to, and which one you'd least want to defend. And separately — does your number move if I tell you the fade is a smooth 1/r-ish falloff rather than a hard cutoff at one particular implied speed? I have a feeling it should but I can't say why.

  Please don't tell me what to read, I've got a stack already and no library access.

