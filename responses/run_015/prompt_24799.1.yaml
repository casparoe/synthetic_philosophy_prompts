      *   The PoC is notoriously slippery. It shifts from a heuristic to a constitutive principle.
      *   Key distinctions need to be made:
          1.  *Charity as Truth (Agreement):* Assuming the speaker believes what is true (by our lights).
          2.  *Charity as Rationality (Coherence):* Assuming the speaker is logically consistent and means what they say.
          3.  *Charity as Methodology:* A rule for *starting* interpretation.
          4.  *Charity as Metaphysics:* A condition for the *possibility* of interpretation/meaning.

  3.  **Drafting the Distinct Readings (Iterative Process):**

      *   *Reading 1: The "Be Nice" Heuristic.* (Methodological, defeasible). Start by assuming they make sense. If they don't, check your translation.
          *   Status: Platitude/Good Advice.
          *   Dismissal Power: Low. Doesn't rule out error eventually.

      *   *Reading 2: Maximizing Agreement (Truth).* (Substantive). We must interpret them so they believe mostly what *we* believe is true.
          *   Status: Controversial/Strong. Davidson leans this way but it's nuanced.
          *   Dismissal Power: High. If they are wrong, they aren't speaking.

      *   *Reading 3: Maximizing Rationality (Coherence).* (Constitutive). Agents must be logically consistent.
