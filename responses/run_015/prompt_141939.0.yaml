answer: |-
  # Session Plan: Concepts, Categories, and Analogies
  **Duration:** 90 Minutes  
  **Participants:** 14 Upper-Level Undergrads (Cog Sci/Phil)  
  **Room:** Whiteboard, Index Cards, Markers (No Laptops)  
  **Instructor Goal:** Facilitate experience of "Edge Room" and "Rule Underdetermination" without lecturing until the final debrief.

  ## 1. Preparation Checklist (Night Before)
  *   **Index Cards:** 100+ (standard size). You need plenty for writing rules, bets, and scratch work.
  *   **Markers:** 5–10 dry-erase markers (mixed colors).
  *   **"Confidence Chips":** Pre-tear 50 index cards into quarters. These are the wagering tokens.
  *   **Whiteboard Layout:** Draw four quadrants labeled **Group 1, 2, 3, 4**. Leave a large central space for "The Market."
  *   **Handout (Optional but recommended):** A single half-sheet per student with the **Wagering Rules** and **Phase 2 Constraints**. (Prevents you from repeating instructions).
  *   **Seed List (For Instructor Eyes Only):** A list of probe questions to nudge groups if they stall (see *Predictable Failures*).

  ---

  ## 2. Minute-by-Minute Timeline

  ### Phase 1: The Edge Push (00:00 – 00:30)
  **Goal:** Students feel the structural limits of different domains without naming them.

  *   **00:00 – 00:05 | Setup & Grouping**
      *   Divide class into 4 groups (3–4 students each).
      *   **Instruction:** "Today is not about finding the right answer. It's about finding where the answers stop making sense. You have no laptops. You have cards. You have each other."
      *   Assign each group a **Domain Seed**:
          *   **Group 1 (Letters):** The English Alphabet.
          *   **Group 2 (Time):** A Digital Clock (HH:MM).
          *   **Group 3 (Counting):** Positive Integers (1, 2, 3...).
          *   **Group 4 (Ranks):** Martial Arts Belts (White, Yellow... Black).
      *   **Task:** Define the function **NEXT(x)**. Write down what happens for standard cases, then push **x** until **NEXT(x)** behaves differently than usual.
      *   **Deliverable:** On the whiteboard, write your domain, your standard rule, and the specific point where the rule changes behavior or breaks.

  *   **00:05 – 00:20 | Group Work (Instructor circulates)**
      *   *Monitor Group 1:* Watch for the Z problem. Do they wrap? Do they stop? Do they go to AA?
      *   *Monitor Group 2:* Watch for 12:59 → 1:00 vs 23:59 → 00:00.
      *   *Monitor Group 3:* Watch for 9 → 10 (digit count change).
      *   *Monitor Group 4:* Watch for Black Belt → What? (Degrees? Red? Stop?)
      *   *Intervention:* If a group says "It's obvious," ask: "Write the rule so a computer could execute it without crashing at the limit."

  *   **00:20 – 00:30 | The Wall Walk**
      *   Groups rotate to the next whiteboard quadrant (1→2→3→4→1).
      *   **Task:** Spend 2 minutes per board. Find the "break point." Put a star next to the transition where the logic shifts (e.g., single digit to double digit).
      *   **Brief Share:** Ask one member from each group to state *only* where their break point was. No explanation of why yet.
      *   *Instructor Note:* Write these break points on the central board under the header **LIMITS**.

  ### Phase 2: The Blind Rule Exchange (00:30 – 01:05)
  **Goal:** Experience rule underdetermination and chunk slippage.

  *   **00:30 – 00:35 | Pairing & Setup**
      *   Pair Group 1 with Group 3 (Letters/Numbers).
      *   Pair Group 2 with Group 4 (Time/Ranks).
      *   **Role A (Legislators):** You create a transformation example (e.g., `abc → abd`). You must write a **Context-Free Rule** on an index card that explains this change.
      *   **Role B (Judges):** You receive the card. You must apply the rule to two new strings provided by the instructor.
      *   **Constraint for Role A:** You cannot use examples on the card. You cannot use the words "same," "similar," or "analogy." You must describe the operation explicitly.
      *   **Constraint for Role B:** You must interpret the rule literally. If the rule is ambiguous, you must choose the most literal interpretation and note the ambiguity on the back of the card.

  *   **00:35 – 00:50 | Rule Writing & Exchange**
      *   Role A drafts the rule for `abc → abd`. (10 mins).
      *   *Instructor Check:* Collect Role A cards. Scan for tautologies ("Change the last letter to the next one"). If found, force a rewrite ("Which letter is the last one? How do you define 'next'?").
      *   Swap cards. Role B receives the rule.
      *   **Test Strings (Instructor Provides):**
          1.  **Edge Case:** `xyz → ?` (Tests the Edge Room)
          2.  **Chunk Case:** `aabbcc → ?` (Tests Chunk Slippage)
      *   Role B works on the solution (10 mins). They must write their answer and any objections on the card.

  *   **00:50 – 01:05 | The Reveal**
      *   Role A reveals what *they* intended for `xyz` and `aabbcc`.
      *   Role B reveals what they *actually* produced.
      *   **Discussion:** Do not resolve the conflict. Highlight the mismatch.
      *   *Instructor Action:* Tape the mismatched cards to the board under **RULE GAP**.
      *   *Key Question to Ask:* "Did the rule change, or did the domain change?" (Do not answer this yourself).

  ### Phase 3: The Consensus Wager (01:05 – 01:20)
  **Goal:** Separate personal certainty from group agreement.

  *   **01:05 – 01:10 | Wagering Mechanics**
      *   Distribute 3 "Confidence Chips" (card quarters) to each student.
      *   **The Rule:** I will put a transformation on the board. You will write an answer privately. Then, you will wager chips on what you think the **Majority of the Room** will answer, not what *you* think is correct.
      *   **Winning:** If your wager matches the room's majority answer, you keep your chips. If not, you lose them to the pot.
      *   **Stakes:** The goal is to end with the most chips. This rewards predicting the group's psychology, not logic.

  *   **01:10 – 01:20 | Three Rounds**
      *   **Round 1 (Low Ambiguity):** `efg → efh`. What is `klm → ?`
          *   *Expected:* High consensus. Safe bets.
      *   **Round 2 (Edge Room):** `xyz → ?`
          *   *Expected:* Fragmented answers (yza, xyaa, stop). Bets should scatter.
      *   **Round 3 (Chunk Slippage):** `ppqqrr → ?` (Based on `abc → abd`).
          *   *Expected:* Split between `ppqqrs` (letter successor) and `ppqqss` (chunk successor).
      *   **Process:**
          1.  Write answer privately on card (face down).
          2.  Place wager chips on the board under the answer option you think will win.
          3.  Reveal answers. Count majority. Pay out.
      *   *Instructor Note:* If Round 3 splits 50/50, declare no majority. Everyone loses bets. This emphasizes the lack of structure.

  ### Phase 4: Debrief & Naming (01:20 – 01:30+)
  **Goal:** Map the experience to the theory.

  *   **01:20 – 01:30 | The Lecture (Instructor Led)**
      *   Gather around the whiteboard. Point to the specific artifacts generated during the session.
      *   **Concept 1: Edge Room.** Point to Phase 1 limits.
          *   *Say:* "You felt different kinds of stops today. Some domains dead-end (Alphabet). Some wrap (Clock). Some tier-jump (9 to 10). Some nest (Belts). I call this **Edge Room**. It's the structural space left at the boundary of a concept."
      *   **Concept 2: Chunk vs. Successor.** Point to Phase 3, Round 3.
          *   *Say:* "When `abc` became `abd`, you assumed a rule. When `ppqqrr` appeared, that rule slipped. Did you change the last letter? Or the last group? This is **Chunk Slippage**. The rule didn't change; the unit of application did."
      *   **Concept 3: Underdetermination.** Point to Phase 2 Rule Cards.
          *   *Say:* "Group A wrote a rule. Group B broke it. Not because they were stupid, but because any rule you write down is both too rigid and too permissive. The instances never fully determine the rule."
      *   **Philosophy Hook:** "For the philosophy majors here: This is Wittgenstein's rule-following paradox without the jargon. You just lived it. The rule doesn't carry its own application."
      *   **Closing:** "Next time we talk about how we resolve this slippage. For now, keep your cards."

  ---

  ## 3. Materials & Handouts

  ### Handout: Wagering Rules (Print 14 copies)
  > **THE CONSENSUS MARKET**
  > 1. You have 3 Chips.
  > 2. For each round, write your **Personal Answer** on a card (keep it private).
  > 3. Place your Chips on the Whiteboard under the answer you think **MOST PEOPLE** will choose.
  > 4. **Winning:** If the Room's Majority matches your Chip placement, you keep your chips. If not, they are lost.
  > 5. **Goal:** Maximize chips. Being "right" doesn't matter. Predicting the room matters.

  ### Instructor Seed List (For Phase 1 Nudging)
  *   **Group 1 (Letters):** "What comes after Z? Is there an AA? Is there nothing? Who decides?"
  *   **Group 2 (Time):** "Does 12:59 go to 1:00 or 13:00? What about 23:59?"
  *   **Group 3 (Numbers):** "When you go from 9 to 10, do you add a symbol or change the value? How many digits are allowed?"
  *   **Group 4 (Ranks):** "Is there a 10th Dan? What happens after Grandmaster? Does the scale invert?"

  ---

  ## 4. Predictable Failures & Fixes

  | Failure Mode | Why It Happens | On-the-Spot Fix |
  | :--- | :--- | :--- |
  | **"Just tell us the right answer."** | Students are trained for correctness, not exploration. | **Refuse.** Say: "In this room, 'right' is defined by consensus. If you want the answer, look at the other groups, not me." |
  | **Rule Writing is Tautological** | Group A writes "Do the same thing to the new string." | **Intervene.** "That rule requires knowing the answer to work. Rewrite it so it generates the answer." Force them to specify *position* or *value*. |
  | **Wagering becomes Betting on Truth** | Students bet on what *they* think is right, ignoring the room. | **Remind:** "If you think the answer is X, but you know the room is dumb and will say Y, bet on Y. You want chips, not truth." |
  | **Phase 2 runs long** | Groups get stuck arguing about the rule interpretation. | **Cut Phase 3.** Reduce Wagering to 2 rounds instead of 3. Protect the Debrief. |
  | **Philosophy majors dominate** | They recognize Wittgenstein/Kripke immediately. | **Silence them gently.** "Hold that thought. I need the Cog Sci majors to feel the friction first. We'll unpack the theory at the end." |

  ---

  ## 5. Where You Must Speak (The "Say It Out Loud" Moments)
  The activity sets the table, but you must serve the meal. Do not assume they will infer the theory.

  1.  **After Phase 1 (The Limits):** You must explicitly name the four flavors they found. If you don't label "Tier Jump" vs. "Nested Edge," they will lump them together as "getting bigger."
      *   *Script:* "Notice Group 3 added a digit. Group 4 added a subdivision. Those are structurally different edges."
  2.  **After Phase 2 (The Rule Gap):** You must highlight that the failure wasn't human error.
      *   *Script:* "Group B didn't misread. The card didn't contain enough information. The rule was underdetermined."
  3.  **The Final Debrief:** You must introduce the forbidden words.
      *   *Script:* "Until now, I haven't used the words **Slippage** or **Edge Room**. Now you know why. They aren't definitions; they're names for what you just hit."

  ## 6. Contingency: If You Have Extra Time
  If you finish the Debrief at 85 minutes:
  *   **The "Inversion" Challenge:** Ask Group 1 to define the **PREVIOUS** function for their domain. (What comes before A? What comes before White Belt?).
  *   This often reveals asymmetry in the Edge Room (e.g., Hard to start, easy to stop, or vice versa).
  *   Use this to reinforce that structure is not always symmetrical.

  ## 7. Contingency: If You Are Running Late
  If you hit 75 minutes and are still in Phase 2:
  *   **Abort Phase 3 (Wagering).**
  *   Move straight to Debrief.
  *   Use the Phase 2 mismatches as the data for the "Consensus" point. ("Look at the board. We couldn't even agree in pairs. Imagine the whole room.")
  *   Sacrifice the game mechanics to protect the theoretical payoff.
