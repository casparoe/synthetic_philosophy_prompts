answer: |-
  ### Appendix C: Seminar Assessment Material
  **Course:** POL 605 – Comparative Political Ethics
  **Assessment:** Take-Home Essay Examination (90 Minutes)
  **Topic:** The Cross-Cultural Validity of Anti-Corruption Norms

  ***

  #### Exam Question

  Critics argue that standard definitions of corruption (e.g., Transparency International's "abuse of entrusted power for private gain") suffer from conceptual imperialism when applied to contexts where patron-client reciprocity constitutes the primary mechanism of social welfare and political accountability.

  Construct a normative framework that distinguishes between "corrupt exchange" and "constitutive obligation" without retreating into cultural relativism or imposing a rigid universalist standard. In your answer, evaluate whether a proceduralist account (focusing on breach of public trust) or a functionalist account (focusing on systemic outcomes) better resolves this tension. You must explicitly separate conceptually settled definitions from genuinely contested empirical claims regarding the role of informal networks in democratic stability.

  ***

  #### Model Answer

  The tension between universal anti-corruption norms and localized practices of reciprocity arises not from a disagreement over the morality of theft, but from a disagreement over the ontology of the "public" and the nature of "private gain." To navigate this without succumbing to relativism (which excuses all local practice) or universalism (which condemns all non-bureaucratic exchange), one must decouple the definition of corruption from the specific institutional form of the Weberian state.

  Conceptually, there is a settled core to the definition of corruption: it requires the violation of a specific duty attached to a role for the benefit of an actor who is not the principal. Whether in a modern bureaucracy or a tribal council, corruption entails a betrayal of entrusted power. This definition is robust across contexts because it relies on the internal logic of the role rather than an external cultural judgment. However, the standard operationalization of this definition often fails when it categorizes all non-universalistic resource distribution as "private gain." In many social contexts, resource distribution through kin or patron networks is not a diversion of public goods for *private* consumption, but the fulfillment of a *public* obligation to provide social security where the state cannot.

  Therefore, a proceduralist account focusing on the "breach of trust" is superior to a functionalist account focusing on "systemic outcomes," provided the source of the trust is correctly identified. A functionalist approach risks justifying corruption if it produces short-term stability (the "grease the wheels" hypothesis), which is empirically contentious. A proceduralist approach asks: To whom is the agent accountable? If an official diverts resources to a kin network, is this a breach of the specific mandate they hold?

  Here, the distinction between "corrupt exchange" and "constitutive obligation" hinges on the *publicity principle*. An exchange constitutes a corrupt act if it cannot be defended before the broader community of stakeholders without undermining the legitimacy of the institution. Gift-giving that sustains social glue is often public and acknowledged; corruption relies on secrecy to hide the conflict of interest. If a patron provides jobs to constituents in exchange for votes, this is only "corrupt" if the employment is fictitious or if the mandate of the office explicitly forbids particularistic distribution. If the political system functions on a logic of delegated particularism, the "breach" is not inherent to the act but to the violation of the expected terms of that specific reciprocity.

  However, this is where genuine contestation begins among specialists. It is not settled whether patronage networks undermine or sustain democratic accountability. Some political theorists argue that in weak institutional environments, clientelism provides a vertical accountability mechanism where horizontal institutions fail, effectively allowing the poor to sanction elites by withholding votes. Conversely, institutionalists argue that such networks entrench inequality and prevent the formation of universalistic public goods. A robust normative framework must acknowledge this empirical ambiguity. We cannot label a practice "corrupt" solely because it is particularistic; we must determine if it systematically excludes rival groups from the possibility of future reciprocity or destroys the capacity of the state to function as a neutral arbiter when required.

  Ultimately, avoiding conceptual distortion requires treating corruption as a family-resemblance concept rather than a natural kind. We should not ask "Is this gift-giving?" but "Does this exchange sever the link between the officeholder and the broader public interest?" A principled distinction lies in *exclusivity*. Constitutive obligation creates social glue that is potentially accessible to others who enter the network; corruption creates a closed loop that permanently alienates public resources. By focusing on the exclusivity of the benefit and the publicity of the obligation, we can critique predatory extraction without pathologizing the social survival strategies of marginalized communities. This avoids the relativist trap by maintaining a standard of accountability (publicity/inclusivity) while avoiding the universalist trap by recognizing that the institutional vehicle for that accountability may vary.

  ***

  #### Marking Scheme (Total: 25 Marks)

  **1. Identification of the Core Tension (5 Marks)**
  *   **Requirement:** Must articulate that the conflict is not about theft, but about the definition of "public" vs. "private" and the ontology of the state.
  *   **Typical Failure:** Candidates frame the issue simply as "West vs. Rest" or culture vs. law.
  *   **Marks:** 5 for precise ontological framing; 3 for generic cultural conflict description.

  **2. Isolation of the "Settled" Core of Corruption (5 Marks)**
  *   **Requirement:** Must identify that "abuse of entrusted power" is the cross-culturally stable element, distinct from "private gain."
  *   **Typical Failure:** Candidates treat the entire definition of corruption as culturally contingent.
  *   **Marks:** 5 for distinguishing duty-violation from gain-type; 0 for claiming definition is wholly relative.

  **3. Critique of the "Private Gain" Metric (5 Marks)**
  *   **Requirement:** Must explain why social obligations blur the line between private benefit and public duty (e.g., social security function).
  *   **Typical Failure:** Candidates accept "private gain" as self-evident without analyzing the social function of the transfer.
  *   **Marks:** 5 for analyzing the social function of the exchange; 3 for merely stating it is different.

  **4. Evaluation of Proceduralist vs. Functionalist Frameworks (5 Marks)**
  *   **Requirement:** Must argue for one approach (usually proceduralist/publicity) and justify why it handles the tension better than the other.
  *   **Typical Failure:** Candidates describe both but refuse to evaluate their comparative utility.
  *   **Marks:** 5 for a justified preference; 3 for description without evaluation.

  **5. Handling of Contested Empirical Claims (5 Marks)**
  *   **Requirement:** Must explicitly state that the impact of patronage on accountability is debated (not fact) among specialists.
  *   **Typical Failure:** Candidates present patronage as either definitively "good for the poor" or "bad for democracy" as fact.
  *   **Marks:** 5 for nuanced acknowledgment of the debate; 2 for presenting one side as consensus.

  **Grading Boundaries:**
  *   **A-Level (21–25 Marks):** Successfully executes all five moves *and* introduces a novel conceptual refinement (e.g., the "publicity principle" or "exclusivity test" as seen in the model) or a precise counter-example that challenges the chosen framework.
  *   **B-Level (15–20 Marks):** Competently maps the debate and hits the five moves but relies on existing literature summaries without advancing a distinct conceptual tool or critical synthesis.
