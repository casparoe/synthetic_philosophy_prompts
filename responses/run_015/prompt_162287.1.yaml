answer: |-
  Here is a design for **"The Colour Coordination,"** a game built specifically for your group's constraints, demographics, and philosophical target.

  It requires no technology, uses high-contrast materials, and runs on a strict clock to fit your 90-minute slot (60 mins play, 30 mins debrief).

  ---

  # Game Design: The Colour Coordination

  **Players:** 12 (Fixed group + 3 "Reserves" for the turnover phase)
  **Time:** 60 minutes play, 30 minutes debrief.
  **Materials:**
  *   12 Large Cardstock Sheets (A4 or larger): 4 Red, 4 Blue, 4 Green. (Laminated if possible, to reduce glare).
  *   1 Whiteboard & Thick Black Marker.
  *   1 Bell (or a loud distinct object, e.g., a wooden block).
  *   1 Bowl of Sweets (or distinct tokens).
  *   12 Envelopes (for the "Private Payoff" round).
  *   Large Print Instruction Sheet (one per player, 16pt font minimum).

  **The Goal for Players:** Accumulate the most sweets.
  **The Core Mechanic:** You get points only if you choose the same colour as the *majority* of the room.

  ---

  ## Part 1: The Setup (5 Minutes)

  **Seating:** Arrange chairs in a circle. Ensure everyone can see the whiteboard and each other.
  **The "Reserves":** Identify 3 players who will step out later. Ask them to wait outside the room (or in the library corridor) after Round 3. Bring in 3 new people (or the same 3 if you are short on bodies, provided they haven't watched the game yet). *Note: If you cannot get fresh bodies, use 3 group members who agree to pretend they have no memory of Rounds 1-3. This is less ideal but workable.*

  **The Script (Read Aloud):**
  > "We are going to play a simple game. In each round, I will ring the bell. You will have thirty seconds to hold up one coloured card: Red, Blue, or Green.
  >
  > Here is the rule for points: **You only get a point if you match the majority.** If the most common colour in the room is Red, and you hold up Red, you get a point. If you hold up Blue, you get nothing.
  >
  > There is no talking during the selection. No gestures. No eye-contact signalling. Just you and the card.
  >
  > The winner at the end chooses next month's reading. Let's begin."

  ---

  ## Part 2: The Play (50 Minutes)

  ### Phase 1: Convergence (Rounds 1–3)
  *Goal: Establish an arbitrary norm without dictating it.*

  *   **Payoff:** 1 Sweet per point.
  *   **Action:** Ring bell. Players raise cards. Count the majority. Award sweets. Record scores on the whiteboard.
  *   **Facilitator Note:** Do not suggest a colour. If they split evenly (e.g., 4 Red, 4 Blue, 4 Green), nobody scores. Repeat the round until a majority emerges. Usually, one colour will "win" by accident in Round 1.
  *   **Expected Outcome:** By Round 3, 10–12 players should be holding the same colour (e.g., Red) without being told to.

  ### Phase 2: Overlapping Generations (Round 4)
  *Goal: Show the pattern survives the people.*

  *   **Action:** Pause. Ask the 3 "Reserves" to leave. Bring in the 3 "Newcomers."
  *   **Instruction to Newcomers:** "Welcome. The rules are the same. Match the majority to get sweets. You have 30 seconds."
  *   **Instruction to Veterans:** "Continue as before. No talking to the newcomers."
  *   **Payoff:** 1 Sweet per point.
  *   **Expected Outcome:** The veterans will stick to Red. The newcomers, seeing a sea of Red, will likely pick Red to maximize their score. The pattern persists despite 25% turnover.
  *   **Disruption:** If a newcomer picks Green (accidentally or stubbornly), they get zero points. The group ignores them. *This is the feeling of authority.*

  ### Phase 3: The Trap (Rounds 5 & 6)
  *Goal: Demonstrate the cost of moving without Common Knowledge.*

  **Round 5: Private Information (The "Valley")**
  *   **Action:** Hand every player an identical sealed envelope.
  *   **Script:** "Inside is a new rule for this round only. Do not show it to anyone. Do not talk about it. You do not know what rule anyone else received."
  *   **The Note (Large Print):** *"New Payoff: Blue is now worth 3 Sweets. Red is worth 0. Green is worth 0. **Matching Rule Still Applies.**"*
  *   **Payoff:** 3 Sweets for matching on Blue. 0 for anything else.
  *   **Expected Outcome:** Most will stick with Red. They know Blue is better *for them*, but they don't know if *others* know. If they switch to Blue alone, they get 0. The risk of being the only switcher outweighs the reward. The group stays stuck on the suboptimal peak.

  **Round 6: Public Information (Common Knowledge)**
  *   **Action:** Collect envelopes. Stand at the front. Make eye contact.
  *   **Script:** "Listen carefully. I am announcing to everyone, right now, that **Blue is worth 3 Sweets and Red is worth 0.** The matching rule still applies. Everyone understands this?" (Wait for nods).
  *   **Payoff:** 3 Sweets for matching on Blue. 0 for anything else.
  *   **Expected Outcome:** The room should switch to Blue. Because everyone knows that everyone knows, the risk of switching vanishes.
  *   **Note:** If they *still* don't switch, the convention was too strong. Discuss this in the debrief.

  ### Phase 4: Conflict of Interest (Round 7 - Optional/Time Permitting)
  *Goal: Show that coordination matters more than the specific outcome.*

  *   **Action:** Divide the room secretly (pass notes again).
      *   Group A (6 people): "You get 3 sweets for matching on Red."
      *   Group B (6 people): "You get 3 sweets for matching on Blue."
      *   **All:** "If you do not match the majority, you get 0."
  *   **Expected Outcome:** Chaos, or a frantic rush to one colour. The point is that *matching* is the priority, even if it means half the room gets nothing. (Skip this if time is tight; Phase 3 is the core).

  ---

  ## Part 3: The Debrief (30 Minutes)

  *Do not start with definitions. Start with their experience.*

  **1. The Arbitrary Start (Mapping to Salience)**
  *   *Ask:* "In Round 1, why did we end up on Red (or Blue)? Did anyone decide that?"
  *   *Point:* It was arbitrary. But once chosen, it became *the* way.
  *   *Concept:* **Salience.** We needed a focal point. It could have been anything, but it had to be *something*.

  **2. The Newcomers (Mapping to Precedent/Authority)**
  *   *Ask:* "Newcomers, why did you pick Red? Veterans, how did it feel when the new people picked Red without you telling them to?"
  *   *Point:* The rule existed outside of you. You didn't create it; you inherited it. Ignoring it cost you sweets.
  *   *Concept:* **Normative Force.** The past constrains the present.

  **3. The Private Switch (Mapping to Common Knowledge)**
  *   *Ask:* "In Round 5, everyone had the note saying Blue was better. Why didn't we move?"
  *   *Point:* You knew Blue was better. But you didn't know *they* knew. You couldn't trust them to jump.
  *   *Concept:* **Common Knowledge.** It's not enough to know the truth; you must know that *everyone* knows the truth.

  **4. The Public Switch (Mapping to Convention)**
  *   *Ask:* "What changed in Round 6? The payoffs were the same as Round 5."
  *   *Point:* The announcement made the move safe.
  *   *Concept:* **Convention.** A solution to a coordination problem that is arbitrary but binding because we expect others to follow it.

  **5. The "Authority" Question**
  *   *Ask:* "Half of you asked earlier: 'If it's arbitrary, why does it feel like authority?' Where did you feel that weight in the game?"
  *   *Answer:* You felt it in Round 5. You wanted to move, but the "weight" of the group's expectation held you down. That weight *is* the authority.

  ---

  ## Part 4: Troubleshooting (What Will Go Wrong)

  **1. The "Rational" Retro-fit**
  *   *Risk:* A player says, "I picked Red in Round 1 because Red signifies 'stop' or 'danger', so it was salient."
  *   *Fix:* In the debrief, ask: "If we had started with Blue, would Blue have felt just as 'natural' by Round 3?" Yes. The meaning was created by the coordination, not the colour itself.

  **2. Scorekeeping Errors**
  *   *Risk:* Counting 12 cards every round is slow and prone to error.
  *   *Fix:* Appoint a "Scorekeeper" who is *not* playing (a librarian volunteer or a spouse). Or, simplify: If the majority is Red, everyone with Red raises a hand, count once.
  *   *Accessibility:* Ensure the Scorekeeper writes numbers in thick marker, high up on the board.

  **3. The "Rebel"**
  *   *Risk:* One player deliberately picks Green every time to prove a point.
  *   *Fix:* This is actually useful data. In the debrief, ask the group: "Did Player X's protest change the outcome? Or did it just cost them sweets?" This proves the binding nature of the convention.

  **4. Hearing/Vision Issues**
  *   *Risk:* Someone misses the bell or can't distinguish Red/Green.
  *   *Fix:* Use a visual signal for the bell (raise your arm). Use distinct patterns on the cards if colour blindness is known (Red = Stripes, Blue = Dots).

  **5. Talking During Play**
  *   *Risk:* Someone says "Let's all pick Blue!"
  *   *Fix:* Immediate disqualification from that round (no sweets). It ruins the "silent coordination" mechanic. Be strict but smiling.

  ---

  ## Part 5: Limitations (What You Must Say Yourself)

  *The game is a model. Like any ecological model, it leaves things out. In the final 5 minutes, you need to verbally bridge these gaps.*

  **1. The Facilitator Problem**
  *   *Reality:* In the game, *you* changed the payoffs. In real life, there is no facilitator.
  *   *Say:* "In the game, I acted as 'Nature' changing the fitness landscape. In reality, conventions shift because the world changes slowly, or because a critical mass of people get tired of the old way all at once."

  **2. Scale and Time**
  *   *Reality:* 12 people for 60 minutes is not "Society" for "Centuries."
  *   *Say:* "You felt the pressure of 11 other people. Imagine feeling the pressure of 11 million. That is why real conventions feel like laws of physics."

  **3. Habit vs. Convention**
  *   *Reality:* Lewis distinguishes between a mere habit (I drink coffee every morning) and a convention (I drive on the left).
  *   *Say:* "If you drove on the right alone in your garage, it wouldn't matter. If you drive on the right on the M25, you crash. A convention is a habit that depends on *others* having the same habit. That interdependence is what you felt in Round 5."

  **4. The Fitness Landscape**
  *   *Reality:* You know this better than anyone.
  *   *Say:* "We just simulated a population stuck on a local fitness peak. To get to the higher peak (Blue), we had to cross a valley where you get no points. You can't cross a valley alone. You need to know everyone else is crossing with you. That is the ecological cost of convention."

  ---

  ## Large Print Instruction Card (Template)

  *(Print this on A4, 18pt Font, Bold)*

  **ROUND RULES**

  1.  **WAIT** for the Bell.
  2.  **RAISE** one coloured card (Red, Blue, or Green).
  3.  **SCORE:** If your colour matches the **MAJORITY** of the room, you get **1 SWEET**.
  4.  **NO TALKING** during the choice.

  **GOOD LUCK**

  ---

  ## Facilitator's Cheat Sheet (Keep in Pocket)

  *   **Jargon Ban:** Do not say *Convention, Equilibrium, Salience, Common Knowledge, Coordination Problem.*
  *   **Round 1-3:** Let them flail. Do not help.
  *   **Round 4:** Ensure Newcomers enter *after* the veterans have settled.
  *   **Round 5 (Private):** Walk around. Make sure they see you giving notes to others, but whisper so they can't hear the content.
  *   **Round 6 (Public):** Speak loudly. Check eyes. "Does everyone understand?"
  *   **Debrief:** Let them talk first. You only map their experience to the concepts at the end.

  This design respects their intelligence, accommodates their physical constraints, and forces the philosophical point through experience rather than argument. It turns the library room into a temporary ecosystem where they are both the organisms and the selection pressure.
