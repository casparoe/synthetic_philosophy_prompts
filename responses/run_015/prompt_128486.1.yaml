answer: |-
  You have put your finger on one of the most persistent and uncomfortable tensions in regulatory philosophy. You are correct: the "Baseline Problem" is real. The application of the Precautionary Principle is not a law of physics; it is a political choice about where to place the burden of proof.

  When we say "better safe than sorry," the immediate follow-up question must be: **"Sorry about what?"** Are we sorry about the potential harm of the new product, or are we sorry about the potential loss of the benefit the new product might have provided?

  Here is a breakdown of the assumptions underlying these policies, an analysis of your baseline problem, and what a consistent system might actually look like.

  ### 1. The Hidden Assumptions of Each Policy

  The inconsistency isn't random; it rests on different models of human interaction, risk, and liberty.

  **The Drug Model (Pre-Market Approval)**
  *   **Assumption of Asymmetry:** The regulator assumes the consumer cannot evaluate the risk. A patient doesn't know pharmacology; they rely on the doctor and the manufacturer.
  *   **Assumption of Necessity:** Drugs are framed as interventions for *pathology*. The baseline is "disease," and the drug is the "cure." Because the user is vulnerable (sick), they are afforded higher protection.
  *   **Assumption of Potency:** Drugs are assumed to be biologically active enough to change physiology significantly. If they can change physiology enough to cure, they can change it enough to kill.
  *   **The Error Preference:** This system is designed to avoid **Type II Errors** (False Negatives). It would rather block 100 good drugs to ensure 1 bad drug doesn't get through.

  **The Supplement/Food Model (Post-Market Surveillance)**
  *   **Assumption of Liberty:** The baseline is "freedom to trade." Restricting a substance is seen as an imposition on the manufacturer and the consumer's right to choose.
  *   **Assumption of Benignity:** Supplements are historically framed as "food-like" or "natural." The assumption is that if it's an herb or a vitamin, it belongs on the benign side of the ledger until proven otherwise.
  *   **Assumption of Voluntariness:** Unlike food additives (which are hidden), supplements are chosen. The model assumes **Informed Consent** is possible. If you choose to take ephedra, you are accepting the risk.
  *   **The Error Preference:** This system is designed to avoid **Type I Errors** (False Positives). It would rather let 100 risky supplements stay on the shelf to ensure 1 beneficial one isn't blocked.

  **The Food Additive Split (EU vs. US)**
  *   **EU (Pre-Market):** Assumes food is a public trust. The state is the guardian of the food supply. Any *new* chemical is an intrusion into the communal body.
  *   **US (GRAS - Generally Recognized As Safe):** Assumes food technology is an engine of economic progress. If experts generally agree it's safe, the government shouldn't stand in the way. It privileges industry expertise over state verification.

  ### 2. Is the "Baseline Problem" Arbitrary?

  You asked if the principle is empty until somebody picks a baseline by hand. **Yes, largely.**

  In logic, this is the problem of the **Null Hypothesis**.
  *   **Drug Baseline:** The Null Hypothesis is "This drug is dangerous/ineffective." The company must reject the null to sell.
  *   **Supplement Baseline:** The Null Hypothesis is "This supplement is safe/free to sell." The regulator must reject the null to ban.

  Is there a non-arbitrary way to set the baseline? Philosophers and legal scholars usually try to anchor it in **Reversibility** and **Consent**.

  **A. The Reversibility Heuristic**
  This is the strongest non-arbitrary argument for pre-market safety.
  *   **Market Reversibility:** If we ban a product, the company loses money. This is reversible (they can make something else, or prove safety later).
  *   **Biological Reversibility:** If we approve a product and it causes nerve damage, that is often irreversible.
  *   **The Rule:** When the cost of being wrong is irreversible biological harm, the baseline should be "Do Not Introduce." When the cost of being wrong is economic loss, the baseline should be "Introduce."
  *   **The Flaw:** This doesn't solve the supplement problem. Supplements *can* cause irreversible harm. The current policy assumes they don't, which is an empirical claim, not a philosophical one.

  **B. The Consent/Imposition Heuristic**
  *   **Drugs:** Often prescribed (imposed by doctor) or sought by desperate people (compromised consent).
  *   **Additives:** Hidden in bread (no consent).
  *   **Supplements:** Bought off a shelf (active consent).
  *   **The Rule:** If the exposure is hidden or the consent is compromised, the baseline must be Safety. If the exposure is voluntary and informed, the baseline can be Liberty.
  *   **The Flaw:** "Informed" is doing a lot of work here. If a supplement label doesn't list the risks (because they aren't known), the consent isn't actually informed.

  ### 3. What if We Tried to Be Consistent?

  If we acknowledge the baseline is a choice, we can ask what happens if we force consistency across the board.

  **Scenario A: Universal Pre-Market (The "Block Everything" World)**
  We apply the Drug Model to supplements and food additives.
  *   **The Result:** Innovation collapses. Running a Phase III trial costs tens of millions of dollars. Small companies cannot enter the market. Only massive conglomerates can afford to sell new vitamins or food preservatives.
  *   **The Opportunity Cost:** We "save" people from risky supplements, but we also delay beneficial ones. If a new herbal compound could help with anxiety but costs $50M to approve, it never gets tested. People suffer from untreated anxiety because the regulatory bar is too high for low-margin products.
  *   **Verdict:** High safety, low liberty, high monopoly power.

  **Scenario B: Universal Post-Market (The "Body Count" World)**
  We apply the Supplement Model to prescription drugs.
  *   **The Result:** Rapid innovation, cheap medicine. But we return to the pre-1938 era (before the US required safety testing). We see repeats of the Elixir Sulfanilamide incident (100+ deaths from solvent) or Thalidomide (birth defects).
  *   **The Trust Collapse:** The market relies on trust. If consumers believe every new pill is a Russian Roulette chamber, they stop taking *all* medicine, even the safe ones. Public health collapses.
  *   **Verdict:** High liberty, high innovation, catastrophic tail-risk.

  ### 4. A Better Framework: Risk-Stratified Consistency

  The solution isn't to pick one baseline for *everything*, but to stop using **Product Category** (Drug vs. Supplement) as the proxy for risk. Currently, the law regulates the *label*, not the *molecule*. A molecule can be a "drug" if you claim it cures cancer, but a "supplement" if you claim it "supports immune health," even if the biological effect is identical.

  A consistent system would regulate based on **Risk Profile Dimensions**:

  1.  **Visibility (Can I avoid it?):**
      *   *Hidden (Additives):* Must be Pre-Market Approved. (No consent possible).
      *   *Visible (Pills/Powders):* Can be Post-Market, *provided*...
  2.  **Claim Severity (What do you promise?):**
      *   *Therapeutic (Cures Disease):* Must be Pre-Market Approved. (High stakes, vulnerable user).
      *   *Wellness (Supports Health):* Can be Post-Market. (Lower stakes).
  3.  **Potency (How active is it?):**
      *   If a supplement acts pharmacologically (changes heart rate, hormone levels), it crosses the threshold into "Drug" territory regardless of the label.

  **The "Consistent" Rule:**
  > *"The burden of proof scales with the inability of the user to assess risk and the irreversibility of potential harm."*

  *   **Food Additives:** User cannot assess risk (hidden). Harm could be chronic/cumulative. **Burden: Manufacturer (Pre-Market).**
  *   **Prescription Drugs:** User cannot assess risk (complex biology). Harm could be acute. **Burden: Manufacturer (Pre-Market).**
  *   **Supplements:** User *can* assess risk (visible), *unless* the product is adulterated. **Burden: Shared.** Manufacturer proves basic safety (no contaminants), Regulator monitors adverse events.
  *   **The Fix:** The current failure is that Supplements are treated as "Food" for regulation (low burden) but marketed as "Drugs" for benefit (high expectation).

  ### Summary

  You are right that the baseline is often picked by hand, usually reflecting the lobbying power of the industry involved at the time the law was written (e.g., the 1994 DSHEA act that deregulated supplements was heavily lobbied).

  However, the non-arbitrary core is **Information Asymmetry**.
  *   If the seller knows more than the buyer about the risk (Drugs, Additives), the Seller must prove safety.
  *   If the buyer can reasonably assess the risk (buying a knife, buying a known herb), the Buyer assumes the risk.

  The inconsistency arises because we pretend supplements have no information asymmetry (that the buyer knows the risk) when they often do. If we fixed that—by requiring safety data proportional to the *biological potency* rather than the *marketing category*—we wouldn't block everything, but we wouldn't be waiting for the body count either. We would simply admit that "natural" is not a safety protocol.
