          *   *Exogenous shock* (the Industrial Revolution).
          *   *Lakatos* (better than Popper for this specific nuance).
      *   **Verdict:** The User is more right about the *science* aspect (falsifiability). The Friend is more right about the *history* aspect (the trap was real for a long time).
      *   **Refining the Test:** The "Off-Switch Test" needs a tweak. It's not just "did he name it?" It's "does the theory have the capacity to incorporate this without breaking?" Malthus's theory had no room for sustained per-capita growth.

