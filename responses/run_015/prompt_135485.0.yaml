answer: |-
  This is not a basic question at all. You have accidentally reinvented a central debate in the philosophy of science and economic history. You and your mate are actually arguing about two different things: he is arguing about **historical description**, and you are arguing about **scientific prediction**.

  Both of you are partially right, but you have the stronger position on the logic of the argument. Here is the breakdown of who is making the mistake, the verdict on your "Off-Switch Test," and the vocabulary you need to settle this.

  ### 1. The Verdict: Who is making the mistake?

  **Your mate is right about history.**
  For almost all of human history (from the invention of agriculture until roughly 1800), your mate is correct. This period is literally called the **Malthusian Trap**. In that era, any increase in food production led to an increase in population, which diluted the resources per person, driving wages back down to subsistence level. If Malthus had stopped writing in 1799, he would have been empirically correct based on all available data.

  **You are right about science.**
  Malthus did not just describe the past; he proposed a **universal law of nature**. He argued that population *must* always outstrip food supply because population grows geometrically (1, 2, 4, 8) while food grows arithmetically (1, 2, 3, 4).

  When the Industrial Revolution happened, two things occurred that broke his law:
  1.  **Technology:** Food production started growing geometrically (thanks to machinery, chemistry, and logistics).
  2.  **Demographics:** As people got richer, they had *fewer* children (the **Demographic Transition**). Malthus assumed richer people would have more surviving children; the opposite happened.

  Your mate's argument ("he was just early") is what philosophers call an **ad hoc rescue**. If a theory predicts $X$, and $Y$ happens, you cannot simply say "the theory still holds, just wait longer" without modifying the theory. If you do, you make the theory unfalsifiable.

  ### 2. Is your "Off-Switch Test" valid?

  **Yes.** Your intuition is spot on. In the philosophy of science, your "Off-Switch Test" is a layman's version of **Imre Lakatos's criterion for a "Degenerating Research Programme."**

  Karl Popper (whom you mentioned) said a theory must be falsifiable. But Imre Lakatos went deeper. He noted that scientists often tweak theories when they fail. He argued this is only acceptable if the tweak leads to **new predictions**.

  *   **Progressive Shift:** You modify the theory to account for the anomaly, and that modification predicts something *new* that you can then test.
  *   **Degenerative Shift:** You modify the theory *only* to explain away the failure, without generating new insights.

  **Applying this to Malthus:**
  *   **Your Test:** Did Malthus name the "off-switch" (technology/fertility decline) in advance? **No.**
  *   **The Result:** When his followers say "he was just early," they are engaging in a **degenerative shift**. They are protecting the "hard core" of the theory (population always presses on food) by adding a "protective belt" of excuses (technology was an anomaly, wait for the crash) that doesn't actually predict *when* or *how* the crash will happen.

  So, your test is valid. A theory that cannot account for the mechanism of its own failure is not "right but early"; it is **incomplete to the point of error.**

  ### 3. The Vocabulary You Need

  To win the argument (or at least elevate it), here are the terms you are looking for:

  **A. Ceteris Paribus (All other things being equal)**
  Malthus's law holds *ceteris paribus*. He assumed technology and social norms remained static. Your mate is treating a *ceteris paribus* condition as a universal law. You can concede Malthus was right *ceteris paribus*, but point out that in the real world, *ceteris* (other things) were *not paribus* (equal).

  **B. Exogenous vs. Endogenous Variables**
  Malthus treated technological progress as **exogenous** (outside the model, unpredictable, rare). Modern growth theory treats it as **endogenous** (part of the system, driven by human incentives). Malthus failed because he didn't model human innovation as a variable that scales with population pressure.

  **C. The Demographic Transition**
  This is the specific "off-switch" Malthus missed. He assumed Income $\uparrow$ = Population $\uparrow$. The historical reality since 1850 is Income $\uparrow$ = Population Growth $\downarrow$. This falsifies his core mechanism.

  **D. Ad Hoc Hypothesis**
  This is the philosophical term for your mate's "get-out-of-jail" card. An *ad hoc* hypothesis is added to a theory to save it from being refuted, without being testable itself. Saying "The Malthusian crash is coming, just not yet" is *ad hoc* because it sets no deadline.

  ### 4. How to settle the bet

  You can propose a compromise that acknowledges both your insights:

  **"Malthus was a brilliant historian but a failed prophet."**

  *   **Acknowledge your mate's point:** Malthus correctly identified the **Malthusian Trap**, which governed human existence for 10,000 years. It is the default state of nature.
  *   **Stand your ground:** Malthus failed as a scientist because he treated a historical default as a physical law. He did not foresee the **Industrial Revolution** or the **Demographic Transition**.
  *   **Use your test:** Ask your mate: *"What specific condition would prove Malthus wrong?"* If the answer is "nothing, because he can always be 'early'," then your mate admits it is not a scientific theory, but a belief.

  **Summary:** You are right to be suspicious of the "right but early" defense. In science, if you miss the mechanism of the escape, you didn't understand the system. Malthus understood the pressure, but he didn't understand the engine. Your "Off-Switch Test" is a robust heuristic for separating **insight** from **dogma**. Keep using it.
