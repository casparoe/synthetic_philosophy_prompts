      *   **The User's Position:** This is a "get-out-of-jail" card (unfalsifiable). If every failed doomsday prediction is just "early," the theory is pseudoscience (invokes Popper).
      *   **The User's Proposed Test:** The "Off-Switch Test." A prediction is rescued only if the factor that stopped it was named in advance by the theory. Malthus fails because he didn't predict technological innovation in agriculture or the demographic transition (fertility falling with wealth).
      *   **The Friend's Counter:** The escape was unforeseeable, so failing to name it shouldn't count against him.
