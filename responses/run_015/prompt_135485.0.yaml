      *   **Address the "Off-Switch Test":** It's a solid intuition. In philosophy of science, this maps onto **Imre Lakatos's "Research Programmes."** A theory is "degenerating" if it constantly adds *ad hoc* excuses to explain away failures. It's "progressive" if it predicts novel facts.
