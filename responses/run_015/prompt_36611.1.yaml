answer: |-
  Subject: Re: Philosophy Over Coffee session plan

  Hi there,

  That is quite the assignment your advisor handed you, and I completely sympathize with the challenge of translating a technical epistememic puzzle into something digestible for a general audience in ninety minutes. The Lottery Paradox is deceptively simple on the surface but relies on some specific intuitions about belief and probability that you cannot take for granted with this group. Since you are aiming for a session where they feel the tension rather than just hearing a lecture, I would recommend stripping away the formal epistemology and leaning heavily into the intuitive norms of everyday reasoning. You do not need to get them comfortable with graded justification or numerical degrees of belief like 0.999 versus plain entitlement. In fact, introducing those concepts might distance them from the problem. Instead, run the whole session on the folksy version of the principle, which is something like you are allowed to believe whatever is overwhelmingly likely to be true. If something is 99.9 percent certain, most people will agree it is reasonable to believe it, and that is all the premise you need to get the paradox off the ground without getting bogged down in technical definitions of justification.

  Regarding the carrying example, I know you are worried about the gambling aspect of an actual lottery tuning people out, but I would advise against swapping it for something like your car starting or weather forecasts. The reason the lottery works so well for this paradox is that the probabilities are explicit and uncontroversial. When you talk about your car starting, someone in the room will inevitably challenge the probability estimate or bring in mechanical knowledge that muddies the waters. With a lottery, everyone understands the math instantly that if there are a million tickets and one winner, any single ticket has a 99.9999 percent chance of losing. To avoid the gambling distraction, frame it as a raffle where the tickets have already been sold and the drawing has happened but the result has not been announced. Ask them to consider a specific ticket, say number 345, and whether they believe it lost. This removes the hope of winning and focuses entirely on the belief about the loss, which is where the paradox lives. You need an example where the probability is high enough to warrant belief individually but where the conjunction of all those beliefs leads to a contradiction, and the lottery provides the cleanest structure for that without extra noise.

  You are absolutely right to anticipate the slide between each belief is very probably true and probably all the beliefs are true, and this is the moment where the paradox actually bites. You should surface this deliberately rather than hoping they catch it on their own. I would suggest using the whiteboard to visualize this aggregation early in the second third of the session. Write down the claim for ticket one, then ticket two, and ask if they believe each individually. Once they agree they believe each one will lose, write down the conjunction that all tickets will lose. When they see that this contradicts the premise that one ticket must win, the tension becomes visible. You should also head off the misconception that you cannot have beliefs about chances only about facts by clarifying that we are talking about beliefs regarding the outcome, not the odds. Another likely confusion is the gambler's fallacy, where someone might think past losses influence future draws, so you need to stipulate clearly that this is a single draw with many tickets, not a sequence of draws, to prevent that distraction.

  On the question of the Preface Paradox, I would strongly recommend leaving it out entirely for this specific audience and timeframe. While it is the mirror image and intellectually satisfying to pair them, introducing it risks doubling the cognitive load for people who have never encountered either puzzle. Ninety minutes goes very quickly when you are waiting for people to grasp a counterintuitive concept, and if you split the time between two paradoxes, you might end up with them understanding neither deeply. It is better to let them sit with the discomfort of the Lottery Paradox for the full session than to rush through two. If you feel compelled to mention it, save it for the last five minutes as a teaser for further reading, framing it as a sibling problem that deals with assertions in a book rather than tickets in a draw, but do not attempt to explain the mechanics of it. You can tell them openly that you are leaving it out because you want them to really feel the weight of the first problem, and that honesty usually lands well with continuing-ed students who appreciate depth over breadth.

  For the closing check, you want to avoid the polite nodding along and ensure they actually felt the tension. Instead of asking if they have questions, run a forced-choice vote. Present them with the three claims that form the paradox that it is reasonable to believe each ticket will lose, that if it is reasonable to believe each then it is reasonable to believe all, and that it is not reasonable to believe all because one must win. Ask them to raise their hands for which one of those three links they would be willing to break to solve the problem. This forces them to take a stance on where the error lies rather than just acknowledging the puzzle exists. It will show you immediately if they understand the structure because they will have to choose between rejecting common sense about probability, rejecting logical aggregation, or accepting a contradiction. This active participation confirms they are engaged with the logic rather than just passively receiving information.

  I hope this helps you structure the session, and do not worry too much about the gambling angle if you frame it as a settled raffle. The logic is strong enough to carry the room if you keep the focus on the reasonableness of belief rather than the money involved. Good luck with the outreach event and feel free to reach out if you want to bounce around any specific analogies before you go in.

  Best regards
