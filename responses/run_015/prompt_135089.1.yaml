answer: |-
  Here is your prep sheet. I've ordered these by "damage potential"—starting with the objection that threatens the coherence of your ontology, moving to the one that threatens your theoretical novelty, and ending with the dismissal.

  ### 1. The "Modal Ontology" Objection (Philosophy of Science Visitor)
  **The Objection:**
  "I'm struggling to cash out 'modal parts' without buying into Lewisian realism or a heavy-duty powers ontology you haven't argued for. You say the clay contains a 'possible squashed shape' as a part, but the statue doesn't. From a scientific perspective, the clay *now* is just a lattice of molecules. Its 'possibilities' aren't constituent parts of the object; they're counterfactuals we project onto it based on interest. If you reify these modal profiles into mereological constituents, aren't you bloating the actual world with possibilia just to solve a linguistic puzzle about 'statue'?"

  **The 2-Minute Reply:**
  "I appreciate the worry about bloating, but I'm not positing concrete possible worlds or distinct entities floating in modal space. When I say 'modal part,' I'm using a mereological analogy to describe *dispositional structure*. The clay has a physical microstructure that grounds a wider range of stability conditions than the statue does.
  Think of it like a tensor in physics: the object has properties that aren't just 'what it is now' but 'how it responds to stress.' The statue and clay share the *categorical* base (the molecules), but they differ in the *dispositional* profile grounded by that base. I'm not adding entities; I'm saying the modal profile is structurally complex enough to be treated mereologically. The clay's 'modal parts' are just the subset of physically possible continuations compatible with its microstructure, which is broader than the subset compatible with the statue's functional integrity. I'm not reifying possibilia; I'm reifying the *constraints* on persistence, which are physically real."

  **🚩 Soft Spot:** You are walking a tightrope between "dispositions" and "parts." If they press on how a *possibility* can be a *constituent* without being an *entity*, you risk sounding like you're just playing with words. If you lean too hard on "physical constraints," you sound like you've reduced modality to physics, which might not save the statue (since physics doesn't care about statues).

  ### 2. The "Disguised Hylomorphism" Objection (Senior Metaphysician)
  **The Objection:**
  "You claim this avoids Hylomorphism, but look at the work your 'modal parts' are doing. You need a principle to determine *which* modal parts belong to the clay and *which* belong to the statue. The clay includes the 'squashed' modal part; the statue excludes it. What principle draws that line? It can't be the matter, since they share that. It has to be a principle of unity or organization that selects the modal profile. Isn't that selection principle just a 'substantial form' by another name? You've rejected the terminology but kept the architecture."

  **The 2-Minute Reply:**
  "That's a sharp comparison, but the architecture is different. In Hylomorphism, the form is ontologically prior to or distinct from the matter; it *makes* the matter into a substance. In Modal Part-Sharing, there is no extra ontological category of 'form.' There is just the object and its modal profile.
  The 'principle' selecting the modal parts isn't a separate entity; it's the causal history and structural description of the object. The statue excludes the 'squashed' modal part not because a Form forbids it, but because the causal chain that individuated it (the sculptor's act) imposes a fragility constraint. I'm not positing a unifier; I'm noting that different descriptions track different causal stability conditions. Hylomorphism adds a constituent (form); I'm just adding granularity to the modal profile of the existing constituent. It's a deflationary hylomorphism, if you like, but without the metaphysical surplus."

  **🚩 Soft Spot:** This is your biggest vulnerability. If "causal history" does the work of "substantial form," they will argue you have the *costs* of form (explaining unity) without the *benefits* (explaining why that unity is substantial). You risk looking like a hylomorphist who is afraid to admit it.

  ### 3. The "Wiggins Redux" Objection (Baker/Wiggins Expert)
  **The Objection:**
  "David Wiggins already solved this with sortal essentialism. The clay falls under the sortal 'mass of matter,' the statue under 'statue.' They have different persistence conditions because they are different kinds. You're introducing 'modal parts' to do the work that 'sortal concepts' already do. Baker improved this by making constitution a unique relation, not identity. What does 'modal part-sharing' give you that 'sortal divergence' doesn't, other than confusing mereology?"

  **The 2-Minute Reply:**
  "Wiggins and Baker locate the difference in the *concepts* or the *kinds* we apply. I'm locating the difference in the *objects* themselves. On Wiggins' view, it's often hard to say whether the divergence is in the world or in our language.
  By treating modal profiles as mereologically structured, I allow for *partial* overlap in a way sortalism doesn't. Sortalism says they are wholly distinct coincident objects. I say they are partially overlapping entities in modal space. This helps with vagueness. If a piece chips off, Wiggins has to say the statue ceases or the kind changes. I can say the statue loses a modal part. It gives me a mereology of persistence that sortal essentialism lacks. I'm not just saying they *have* different conditions; I'm saying the conditions are *parts* of their identity, which allows for a more granular account of change."

  **🚩 Soft Spot:** Many metaphysicians think "mereology of persistence" is a category mistake. If you can't explain how a "modal part" is distinct from a "property," you haven't improved on Wiggins; you've just changed the vocabulary.

  ### 4. The "Pseudo-Problem" Objection (Grad Student)
  **The Objection:**
  "Honestly, this feels like we're building a machine to crack a nut that isn't there. The 'problem' of constitution only exists if we assume 'statue' and 'clay' must name distinct ontological items. If we treat them as contextual modes of presentation of the same stuff, the modal divergence is just a feature of our interests, not the world. Why posit 'modal parts' when we can just say we track the same matter differently depending on whether we care about art or chemistry?"

  **The 2-Minute Reply:**
  "Because the divergence has physical consequences, not just conceptual ones. If I squeeze the object, the clay survives and the statue doesn't. That's not just a difference in *tracking*; that's a difference in *outcome*. A deflationary account struggles to explain why the *same* spatial region has different destruction conditions without appealing to something in the world that grounds those conditions.
  My 'modal parts' are an attempt to ground that difference ontologically without multiplying substances. If you say it's just 'interest,' you have to explain why my interest can't preserve the statue when I squash it. The modal profile constrains the interest. I'm trying to respect the intuition that the world pushes back against our concepts, and 'modal parts' is how I model that push-back."

  **🚩 Soft Spot:** A hard deflationist won't care about "grounding." They will say the "push back" is just physical, and the "statue destruction" is just a social fact. You won't convert this student, just aim to show the seminar you aren't ignoring the parsimony challenge.

  ---

  ### 🛑 The Question You Hope Nobody Asks

  **"If the statue and clay share all actual parts but differ in modal parts, do they occupy the same space *at the actual world*?"**

  *   **If you say YES:** You are committed to spatial coincidence of distinct objects (the standard problem you wanted to avoid/mitigate). You haven't solved coincidence; you've just pushed it into modal space.
  *   **If you say NO:** Then they must be spatially distinct. But they are made of the same atoms. How can two things made of the same atoms be in different places?
  *   **If you say "They Overlap":** You need a mereology where actual parts can be shared but modal parts cannot. The killer follow-up is: **"How do the modal parts fail to supervene on the actual parts? If the actual parts are identical, what in the world grounds the difference in modal parts if not an external stipulation?"**

  **Why this kills you:** It exposes that your "modal parts" must either supervene on the actual parts (in which case the difference is extrinsic/conceptual, undermining your realism) or they don't supervene (in which case you have brute modal facts, which is more costly than Baker's view). It forces you to admit that the difference between statue and clay is not *in* the matter, which brings you right back to needing a "form" or "concept" to explain the divergence.
