answer: |-
  This is an exceptionally sharp question, one that cuts to the heart of contemporary debates in meta-ethics and moral sociology. You have identified a genuine tension: if the social conditions that sustain honour are material, does the honour code possess any causal autonomy, or is it merely the ideological superstructure of those conditions?

  To answer this, we must carefully distinguish between the *conditions of possibility* for a moral code and the *mechanism of change* within that code. While Williams and Appiah are often read as opponents, a closer examination suggests that Appiah offers a specific sociological mechanism that operates within the broader genealogical landscape Williams describes. However, Appiah does resist the reductionism you fear.

  Here is an analysis of whether Appiah's thesis collapses into Williams's scepticism, and how we might distinguish autonomous honour from epiphenomenal dressing.

  ### 1. Williams's Scepticism: Genealogy over Justification

  First, it is vital to characterise Bernard Williams's position precisely. In works such as *Ethics and the Limits of Philosophy* and *Truth and Truthfulness*, Williams is not necessarily a crude materialist who believes that every moral shift is a direct result of economic calculation. Rather, he is a sceptic about the idea that moral history is driven by the *rational discovery of moral truth*.

  For Williams, moral concepts are "thick"—they are entangled with specific social forms of life. When a social form of life collapses (due to power shifts, economic changes, or military defeat), the thick concepts associated with it lose their grip. The moral arguments that follow are often attempts to regain "confidence" in a new way of life, rather than the *cause* of the shift. Williams argues that we cannot view our current moral outlook as the result of a rational progression towards the truth; it is simply the outlook that survived the historical wreckage.

  Therefore, when you suggest Williams attributes change to "power and material interest," this is partially correct but requires nuance. Williams attributes change to the *viability of a social world*. If a practice (like slavery) becomes incompatible with the self-image required to sustain the ruling class's confidence, the practice may end. But Williams remains sceptical that this process constitutes "moral progress" in a rational sense.

  ### 2. Appiah's Honour Mechanism: Identity and Recognition

  Appiah, in *The Honor Code*, argues that moral revolutions (the end of duelling, foot-binding, and Atlantic slavery) are not driven primarily by rational argument (Kantianism) nor by expanded empathy (Humean sentimentalism), but by honour.

  Appiah defines honour as a triad:
  1.  **Values:** What is esteemed.
  2.  **Identity:** Who one takes oneself to be (e.g., a gentleman).
  3.  **Recognition:** The audience before whom one must maintain that identity.

  Appiah's crucial claim is that people act to maintain their identity within a specific audience. When the definition of that identity shifts, behaviour changes—even against material interest. The duelist did not stop because he was convinced killing was wrong; he stopped because duelling came to be seen as *ridiculous* and incompatible with being a "civilised gentleman."

  ### 3. Does Appiah Collapse into Williams?

  Your central worry is this: if honour depends on social conditions, and social conditions change due to power/interest, is honour just a mediator for materialism?

  There is a sense in which Appiah accepts Williams's genealogical premise: honour codes do not float in a vacuum. The aristocratic honour code depended on the aristocracy's monopoly on violence and status. When the state monopolised violence and the bourgeoisie rose, the *conditions* for that honour code eroded.

  However, Appiah does not collapse into Williams's scepticism for two reasons:

  **A. The Lag and the Leap**
  If honour were merely epiphenomenal dressing for material interest, moral behaviour would track interest immediately. It does not. Duelling persisted long after it was illegal and economically irrational. It ended only when the *meaning* of "gentleman" shifted. Appiah argues that the *internal logic of recognition* has its own tempo. The material conditions made the old code vulnerable, but the *mechanism* that actually killed the practice was the shame associated with the old identity. Williams explains why the old world became unsustainable; Appiah explains the psychological process by which individuals abandoned it.

  **B. Action Against Interest**
  The strongest evidence for honour's causal autonomy is action against self-interest. A duelist risks death and legal prosecution. An abolitionist in the West Indies often faced economic ruin. If the mechanism were purely "interest and power," these actions would be anomalies. Appiah argues they are explicable through honour: the desire to be seen as a certain kind of person can override the desire for safety or wealth. This suggests honour is a distinct causal variable, not merely a synonym for interest.

  ### 4. Distinguishing Autonomous Honour from Epiphenomena

  You ask for a principled way to distinguish honour operating autonomously from honour serving as dressing. We can apply a counterfactual test derived from Appiah's own framework:

  *   **Epiphenomenal Honour:** If the material conditions change and the behaviour changes *immediately* without a shift in the language of identity or shame, honour is likely epiphenomenal. For example, if serfdom ends simply because it becomes unprofitable, and the lords express no shame, only relief at reduced costs, honour played little role.
  *   **Autonomous Honour:** If the material conditions remain stable (or even favour the practice), but the behaviour stops because the practice becomes *shameful* within the relevant audience, honour is operating autonomously.

  The end of duelling is Appiah's paradigm case for autonomous honour. The state's monopoly on violence (a material/structural change) made duelling illegal, but it did not stop it for a century. It stopped when the *cultural narrative* shifted: the "man of honour" was reimagined as a man of self-control, not a man of violence. This shift in narrative was not determined solely by the state's power; it was a struggle over meaning within the elite class.

  ### 5. Normative Insight vs. Causal Explanation

  Finally, you ask: *If not, should we conclude that every moral revolution... is ultimately explicable without any genuine reference to normative insight whatsoever?*

  This is the point where you must distinguish between **causal explanation** and **moral justification**.

  *   **Williams** warns us against conflating the two. Just because we now believe slavery is wrong does not mean history progressed *because* we discovered it was wrong.
  *   **Appiah** agrees that rational argument alone rarely moves the needle. However, he does not deny normative insight. He suggests that normative insight becomes effective only when it is woven into the fabric of honour.

  We need not conclude that normative insight is irrelevant. Rather, we should conclude that normative insight is *causally inert* unless it attaches itself to an identity that people care about. The insight that "slavery is wrong" existed for centuries before abolition. It became a historical force only when it became dishonourable to own slaves.

  Therefore, we can acknowledge that honour is the *engine* of change without denying that the *direction* of change might be guided by normative insight. Williams worries that the direction is accidental (a matter of survival). Appiah is more optimistic: by manipulating honour codes, we can steer moral progress.

  ### Conclusion for Your Essay

  In sum, Appiah does not refute Williams, but he refines him. Williams provides the **macro-historical scepticism**: we cannot claim our morality is the rational endpoint of history. Appiah provides the **micro-sociological mechanism**: within history, changes in identity and recognition drive behaviour more effectively than rational argument or naked interest.

  Appiah's honour thesis does not collapse into materialism because honour possesses a **relative autonomy**. It is constrained by material conditions, but it mediates them. A change in power relations does not automatically dictate a change in honour; it merely opens the space for a contest over what is shameful.

  For your essay, I would suggest arguing that while Williams is correct that we cannot rely on "rational moral progress" as a historical law, Appiah demonstrates that moral concepts (specifically honour) are not merely passive reflections of power. They are active tools of social negotiation. The distinction lies here: for Williams, moral concepts are fossils of past power struggles; for Appiah, they are the living currency of current identity formation. Honour is not just the clothing of structural change; it is the skin through which structural change is felt and acted upon.

  **Suggested Reading for Further Nuance:**
  *   Williams, B. *Truth and Truthfulness* (specifically the genealogical sections).
  *   Appiah, K. A. *The Honor Code* (Chapter 1 on Duelling is crucial for your specific example).
  *   For a critical perspective: Consider looking at discussions of "virtue signalling" or Bourdieu's distinction between *habitus* and explicit rules, which might help you critique whether Appiah overstates the autonomy of honour.

  This distinction should allow you to navigate the essay without falling into the trap of reducing Appiah to a materialist, whilst respecting the force of Williams's scepticism.
