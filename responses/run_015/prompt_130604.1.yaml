  7.  **Final Polish:** Check flow and clarity. Ensure the distinction between "explanation" and "justification" is clear, as that addresses the user's worry about normative insight. (Proceed to generate output).

  *(Self-Correction Note on Williams)*: I need to be careful not to paint Williams as a Marxist reductionist. His scepticism is about *rational justification* in history, not necessarily denying that ideas have force. However, he is sceptical that *better arguments* drive history. He favours a genealogical explanation. Appiah is trying to show *how* the arguments/code shift psychologically. The tension is real. I must highlight that Appiah provides the *sociological mechanism* for the *genealogical shift* Williams describes.

  *(Refining the "Independence" point)*: Honour isn't independent of *all* conditions, but it is independent of *immediate self-interest*. That is the key. A duelist loses money and risks life; stopping is in their interest, but they continue due to honour. When honour shifts, they stop. So honour overrides interest. This proves it's not just "interest."

