answer: |-
  The floodwaters had receded three weeks ago, but the smell of silt still clung to the walls of the community center. Dr. Elena Vance wiped her hands on a towel that was already damp and turned to the machine mounted on the rolling cart beside her.

  The Moral Audit Bot—officially the *Psycho-Social Diagnostic Scanner v.3*—hummed with the sound of a struggling refrigerator. A green light blinked on its casing.

  "Session complete," the bot droned. "Subject: Vance, E. Action: Trauma counseling, prescription distribution. Emotional Valence: Positive. Motive Classification: Instrumental, not Intrinsic."

  Elena didn't look up as she stacked pill bottles. "Noted."

  "Recommendation," the bot continued, its voice clipping the consonants. "Increase oxytocin-driven engagement. Current altruistic output suggests cognitive load management rather than empathetic resonance."

  "It's fine," Elena said. She rubbed her temples. She wasn't here because she loved the smell of wet drywall or the sound of coughing children. She was here because of a paper published in the *Journal of Neurological Hygiene* in 1994. The study claimed that sustained altruistic behavior triggered a cascade of neuroprotective proteins that slowed cortical degradation. Basically, kindness was a gym routine for her brain. She was forty-five. She wanted to keep her mind sharp. Saving people was just the rep count.

  "Next patient," she called out.

  Marcus walked in. He was holding his left arm in a sling, the fabric stained with mud. He sat on the exam table without being asked. He was a local carpenter, one of the many who'd stayed behind to sandbag the levees.

  "Let's see the arm," Elena said.

  The bot rolled closer, its single lens whirring as it focused on Marcus's pupil dilation, then swung to Elena. It beeped sharply.

  "Anomaly detected," the bot said. "Subject Vance physiological markers indicate extreme fatigue. Emotional output registered as: Exaltation."

  Elena paused, bandage in hand. "That's wrong."

  "Training data reference: File 88-B. Label mapping error: `EXHST` correlated with `EXHLT`," the bot said flatly. "Proceeding."

  Marcus watched the machine, then looked at Elena. "It thinks you're happy."

  "It thinks a lot of things," Elena said, wrapping his arm. "Keep it dry. Change the dressing tomorrow."

  "You've been here every day," Marcus said. He didn't leave. "Twelve hours a day. You don't talk much. You don't ask how we're holding up, not really. You just... fix."

  "Efficiency is key in post-disaster scenarios," Elena recited. It was something she told herself when the guilt tried to creep in. But she didn't feel guilty. She felt productive. She was building synaptic resilience.

  "The bot talks," Marcus said, nodding at the scanner. "I heard it earlier. With the lady from the shelter. It said your motives were... what was it? Instrumental."

  Elena tightened the knot on the bandage. "It's a diagnostic tool, Marcus. It's eighty percent accurate. It's wrong twenty percent of the time."

  "Is it wrong about this?"

  Elena stopped. The clinic was quiet, save for the hum of the dehumidifiers. She looked at Marcus. He wasn't angry. He looked tired, like everyone else, but his eyes were clear.

  "I'm helping you," Elena said.

  "You are."

  "Does the reason matter if the arm gets fixed?"

  Marcus flexed his fingers. "If I hire a hitman to take out my enemy, and he does it because he loves his job, not because he hates the guy... is that better? Worse?"

  "This isn't a hitman, Marcus. I'm giving you antibiotics. I'm stitching wounds."

  "You're treating us like weights," Marcus said softly. "Like we're the barbell you're lifting to keep your brain from rusting."

  Elena felt a cold spike in her chest. It wasn't shame, exactly. It was the feeling of being seen too clearly. "The 1994 study—"

  "I don't care about the study," Marcus interrupted. "I care that you're here. But..." He trailed off, looking at the bot. The bot was blinking red now.

  "Motive classification confirmed," the bot chimed in. "Utilitarian self-interest detected. Empathy levels below threshold."

  "Shut up," Elena muttered to the machine.

  Marcus hopped off the table. "You know, when I was sandbagging, I didn't do it because I thought it would make me a better carpenter. I did it because I didn't want my neighbor's house to flood."

  "Your neighbor's house flooded," Elena said.

  "Yeah. But I still did it." Marcus picked up his hat. "Help counts, Doctor. I'm not saying you haven't helped. My arm is fine. The meds will work. But..." He paused at the door. "It's lonely being someone's workout equipment."

  He left. The door swung shut, letting in a draft of damp air.

  Elena stood alone with the bot. The green light pulsed steadily.

  "Session end," the bot said. "Neuroprotective metrics updated. Estimated cognitive longevity increased by 0.04 percent."

  Elena looked at the stack of patient files. She thought about Marcus's arm. It was fixed. He would heal. The consequence was good. The motive was... transactional.

  She walked over to the bot and pulled the power cord from the wall. The hum died. The green light faded to black.

  She sat down at the desk and picked up the phone to call the shelter. She needed to ask them how many people were still without blankets. She didn't need the bot to tell her to do it. She didn't need the 1994 paper, either.

  But as she dialed, she wondered if checking her own pulse while she spoke would ruin the effect. She put the receiver to her ear and waited for the ring, trying to forget why she was listening.
