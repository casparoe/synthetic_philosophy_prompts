  Here is a detailed grading breakdown, commentary, and justification. I have checked the arithmetic and the philosophical definitions against Hofstadter's specific arguments (primarily from his *Scientific American* "Metamagical Themas" columns on the Prisoner's Dilemma and the Platonia Dilemma).

  ### **Total Mark: 12 / 20**

  | Part | Max | Awarded | Notes |
