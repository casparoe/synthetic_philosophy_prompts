  ### **Part (a) [5 marks] — Awarded: 3/5**

  **Breakdown:**
  *   **Ordinary Rationality (1/1):** Correctly identifies dominant strategy and Nash Equilibrium.
  *   **Superrational Definition (1/2):** You correctly identify the "symmetry of reasoning" ("one decision being made"). However, you miss the technical mechanism: superrationality relies on the *prediction* of correlation, not just a moral wish for it.
  *   **Assumption About Other (0/1):** **Critical Error.** The question explicitly asked: *"Your answer should make clear what a superrational player is assuming about the other player."* You wrote: *"it doesnt matter whether the other player is actually superrational."* This is incorrect. Hofstadter's argument *requires* the assumption that the other player is also superrational (or at least reasoning identically). If the other player is known to be an ordinary defector, the logical correlation breaks, and the superrational argument for cooperation collapses.
  *   **Outcome (1/1):** Correctly concludes cooperation.

  **Comments to write on sheet:**
  > "You explain the 'symmetry' of superrational reasoning well. However, you lost marks on the specific requirement to state the assumption. Superrationality is not a moral duty (Kant); it is a decision-theoretic strategy based on logical correlation. You must assume the other player is *also* superrational for the correlation to hold. If you know they are ordinary, the correlation vanishes, and your claim that 'it doesn't matter' is false in this context."

  ---

  ### **Part (b) [7 marks] — Awarded: 5/7**

  **Breakdown:**
  *   **(i) Standard Analysis (2/2):** Correct. Dominant strategy to send leads to (Send, Send...), payoff 0.
  *   **(ii) Superrational Strategy (1/1):** Correct. Need to randomize to break symmetry.
  *   **(ii) Probability Value (2/2):** Correct. $p = 1/N = 1/20$ maximizes the probability of exactly one winner.
  *   **(ii) Expected Payoff (0/2):** **Arithmetic Error.** You claim the expected payoff is $\$1\text{B} / 20 = \$50\text{M}$. This assumes the probability of *exactly one* winner is 1. It is not.
      *   *Correct Math:* $E = \$1\text{B} \times p \times (1-p)^{19}$.
      *   At $p=1/20$, $(19/20)^{19} \approx 0.377$.
      *   $E \approx \$1\text{B} \times 0.05 \times 0.377 \approx \$18.85\text{M}$.
      *   Your answer overstates the value by nearly 300%.

  **Comments to write on sheet:**
  > "Your logic for choosing $p=1/20$ is perfect. However, your expected payoff calculation is wrong. You calculated the payoff *conditional on someone winning*, not the *expected* payoff. With independent randomization, there is a ~62% chance that either no one or too many people send. You must multiply the prize by the probability of success: $\$1\text{B} \times \frac{1}{20} \times (\frac{19}{20})^{19}$."

  **Borderline/Defensible Point:**
  *   *Student might argue:* "Hofstadter says we should act to maximize the group utility."
  *   *Counter-argument:* Even if maximizing group utility leads to choosing $p=1/20$, the *expected individual payoff* resulting from that strategy is still mathematically determined by the probability of success. The student's number ($\$50\text{M}$) is simply arithmetically impossible given the rules of the game (no communication, independent rolls).

  ---

  ### **Part (c) [8 marks] — Awarded: 4/8**

  **Breakdown:**
  *   **(i) Derivation (3/3):** **Excellent.** The inequality $3q > 5 - 4q$ leading to $q > 5/7$ is perfectly derived.
  *   **(ii) Application $q=0.70$ (0/2):** **Decision Error.** $5/7 \approx 0.714$. $0.70 < 0.714$. Therefore, Defection yields higher expected utility ($2.2$ vs $2.1$). You claimed indifference and chose Cooperate. In decision theory, strict inequality demands strict preference.
  *   **(iii) Edge Cases (2/2):** Correct. $q=1$ (Cooperate), $q=0.5$ (Defect). Your numbers ($1.5$ vs $3$) are correct.
  *   **(iv) Known Ordinary Opponent (0/1):** **Conceptual Error.** You argue for cooperation based on a "universal rule" (Kant). The prompt states Alice *"cares only about her own payoff."* If Bob is known to be ordinary, he will Defect. Alice faces a certain Defector. Her payoff for C is 0; for D is 1. She must Defect. Superrationality does not apply when the correlation premise is known to be false.

  **Comments to write on sheet:**
  > "(i) Perfect derivation. (ii) Check your arithmetic: $5/7 \approx 0.714$, which is strictly greater than $0.70$. At $0.70$, Defect pays $2.2$ and Cooperate pays $2.1$. You are not indifferent; you should Defect. (iv) You conflated Hofstadter's decision theory with Kant's ethics. The prompt specifies Alice cares *only about payoff*. If Bob is known to be ordinary, he will Defect. Cooperating against a known Defector yields 0. Superrationality relies on the *assumption* of correlation; if you know the correlation doesn't exist, you revert to standard rationality (Defect)."

  **Borderline/Defensible Point:**
  *   *Student might argue:* "0.70 is close enough to 0.714 for a grade 11 class."
  *   *Counter-argument:* In Game Theory, thresholds are hard constraints. A rational agent maximizes expected utility. $2.2 > 2.1$. Choosing the lower payoff is objectively irrational, regardless of proximity.
  *   *Student might argue:* "Hofstadter implies superrationality is a moral stance."
  *   *Counter-argument:* Hofstadter explicitly distinguishes his view from morality. He frames it as "rationality for high-stakes logical mirrors." The prompt's constraint ("cares only about payoff") overrides any moral interpretation.

