  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergrad philosophy of mind seminar (16 students, 80 mins).
      *   **Topic:** Epiphenomenalism and the Paradox of Phenomenal Judgment (Chalmers-style).
      *   **Goal:** Make students *feel* the force of the paradox (how can reports be about experiences if experiences cause nothing?) through activity, not lecture. Technical vocabulary comes *after* the experience.
      *   **Proposed Mechanism:** "Sealed-report protocol." Students feel tactile items, compare with pre-printed cards, decide to sign or write their own. Tension between accuracy (team score) and authorship (did I produce this?).
      *   **Structure:** Three moves/rounds.
          1.  Match (Report matches item).
          2.  Mismatch/Decoupling (Report matches item, but experience is absent/altered, or report is fixed regardless).
          3.  Sorting (Can they distinguish reports generated with experience vs. without?).
      *   **Deliverables:** Roles, Materials (no cost/ordering), Timeline (80 mins), Scoring, Reveals, Debrief (mapping activity to argument), Predicted Failures/Mitigations, Limitations (what the activity *can't* do), Commitment/Defense of Design, Final Philosophical Conclusion.
      *   **Tone:** Rigorous, practical, philosophically precise, honest about limitations.

  2.  **Evaluate the Proposed Mechanism (Sealed-Report Protocol):**

      *   *Strengths:* It creates a first-person tension. It simulates the "causal chain" issue physically. It forces a choice between truth/accuracy and agency.
