  *The Reveal:* The Script was fixed before they entered.

  *Wait, one more check on the "Zero Cost" constraint.* "Nothing that costs anything or needs to be ordered."
  *Envelopes:* Folded paper.
  *Objects:* Student's own keys, pens, phone, fabric of chair.
  *Cards:* Scrap paper.
  *This works.*

  *Final check on the "Commit" section:* I need to be decisive. Does this activity prove epiphenomenalism is false? No. It makes the *consequences* of epiphenomenalism palpable. It targets the *Knowledge* claim primarily (How do I know I'm not in Round 2?).

