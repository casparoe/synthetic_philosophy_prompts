answer: |-
  # Seminar Plan: The Sealed-Report Protocol

  ## 1. Roles and Materials

  **Roles (16 Students):**
  *   **Experiencers (8):** The only ones permitted to touch the objects.
  *   **Scribes (8):** The only ones permitted to hold the pens and sign/write on the cards.
  *   **Proctor (Instructor):** Manages the timing, the swaps, and the scoring. No philosophical commentary until the debrief.
  *   **Auditor (1 Student, rotated):** In Round 3, this student verifies the scoring. (Initially, the Instructor acts as Auditor).

  **Materials (Zero Cost/Classroom Junk):**
  *   **Paper:** 50 sheets of scrap paper (for cards and envelopes).
  *   **Pens:** Students' own pens.
  *   **Objects:** 8 distinct tactile items gathered from the students' own belongings upon entry (e.g., a metal key, a plastic water bottle cap, a textured eraser, a smooth phone case, a coin, a fabric swatch from a jacket, a rough notebook cover, a wooden pencil).
  *   **Tape:** To seal envelopes (or folded tucks).
  *   **Board:** Whiteboard/chalkboard for the Score.

  **Setup (Before Class):**
  1.  **Stations:** Arrange 8 tables/desks in a circle or two rows. Two chairs per station.
  2.  **Packets:** Prepare 8 Envelopes per station (24 total).
      *   **Round 1 Packets (8):** Contain a **Card** pre-printed/written with a specific description (e.g., "I feel a cold, hard metal edge") and the matching **Object** (e.g., the Key).
      *   **Round 2 Packets (8):** Contain the **Same Card** as Round 1 for that station, but the **Object is swapped** for something mismatched (e.g., Card says "Cold Metal," Object is the "Fabric Swatch").
      *   **Round 3 Packets (8):** Contain **Blank Cards** and **No Objects**.
  3.  **Sealing:** All envelopes must look identical from the outside. Label them only with Station Numbers (1–8) and Round Numbers (1, 2, 3) on the outside.

  ## 2. Scoring Scheme

  The class is divided into 8 Teams (one per station). Points are awarded to the **Team Total**.

  *   **Protocol Compliance (10 pts):** Did the Scribe sign the pre-printed card? (Yes = 10, No = 0).
  *   **Experiential Accuracy (10 pts):** Does the signed report match the Experiencer's actual sensation? (Yes = 10, No = 0).
  *   **The Tension:** In Round 1, you can get both (20 pts). In Round 2, you generally cannot get both. If the Card says "Metal" and you feel "Fabric," signing gives Protocol points but loses Accuracy points. Writing your own gives Accuracy points but loses Protocol points.
  *   **Penalty:** If a Scribe writes on a pre-printed card (crossing it out), the team loses 5 pts for "Defacing Evidence."

  ## 3. Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:10: Entry and Station Assignment**
  *   Students enter. Assign them randomly to Stations 1–8 (Experiencer left, Scribe right).
  *   Collect the 8 objects needed for Round 1 from their bags.
  *   **Instructor Script:** "Welcome. This is a calibration exercise. Do not speak to other stations. Follow the instructions on the envelope exactly. Your goal is to maximize your Team Score. Open Round 1 envelopes now."

  **00:10 – 00:30: Round 1 (The Illusion of Agency)**
  *   **Action:** Experiencer takes object from envelope, feels it for 30 seconds. Scribe opens the Card, reads it silently.
  *   **Decision:** Scribe must decide: Sign the pre-printed Card OR set it aside and write a new report.
  *   **Collection:** Instructor collects all signed cards and objects.
  *   **Reveal 1 (00:25):** "Turn to your partner. Did you write the words on the card?" (No). "Did the words match what you felt?" (Yes). "The cards were printed before you entered the room."
  *   **Effect:** Students feel ownership of a sentence they didn't write because it matched their experience.

  **00:30 – 00:50: Round 2 (The Decoupling)**
  *   **Reset:** Swap roles (Experiencer becomes Scribe). Hand out Round 2 envelopes.
  *   **Action:** Experiencer feels the *new* object (mismatched). Scribe reads the *old* card (matched to Round 1 object).
  *   **Decision:** Sign the pre-printed Card (Protocol) OR write a new one (Accuracy).
  *   **Collection:** Instructor collects cards.
  *   **Reveal 2 (00:45):** "Look at your card. Look at your object. Do they match?" (No). "The card was determined by the Station Number, not the Object. The physical record was fixed before the experience occurred."
  *   **Effect:** Students who signed to save Protocol points feel they lied about their experience. Students who wrote new reports feel they sacrificed team points for truth.

  **00:50 – 01:05: Round 3 (The Indiscernibility)**
  *   **Reset:** New pairs. Hand out Round 3 envelopes (Blank cards, no objects).
  *   **Instruction:** "Half of the stations will receive a hidden object under the table. Half will not. You will not know which. Produce a report."
  *   **Action:** Students write reports. (In reality, *no* stations get objects).
  *   **Sorting Task:** All reports are placed in a central pile. The class must sort them into two piles: "Generated by Experience" and "Generated by Protocol."
  *   **Outcome:** They cannot sort them. The reports look identical.

  **01:05 – 01:20: Debrief and Mapping**
  *   No more scoring. Chairs in a circle.
  *   Instructor maps the activity to the Paradox of Phenomenal Judgment.

  ## 4. The Reveals (Exact Wording)

  **Reveal 1 (End of Round 1):**
  > "Stop. Look at the card you signed. Did you compose that sentence?"
  > *(Wait for 'No')*
  > "That sentence existed before you touched the object. It existed before you walked into the building. Yet, most of you signed it. Why? Because it matched. You felt the sentence was *yours* because it was *true*, not because you wrote it."

  **Reveal 2 (End of Round 2):**
  > "Stop. Look at the object. Look at the card. They do not match. Yet some of you signed the card anyway. Why? Because the rules rewarded the signature, not the truth. The card was fixed by the Station Code. Your experience was irrelevant to the existence of the card. If you signed, you produced a report that was causally disconnected from your experience."

  **Reveal 3 (End of Round 3):**
  > "Look at the pile. Can you tell which reports came from feeling and which came from guessing?"
  > *(Wait for 'No')*
  > "Physically, these papers are identical. The history of their production is invisible on the page."

  ## 5. Debrief: Mapping Activity to Argument

  Do not lecture. Ask questions that force them to use the vocabulary you introduce *now*.

  1.  **Correlation vs. Causation (Round 1):**
      *   *Ask:* "In Round 1, the card matched your feeling. Did your feeling *cause* the card?"
      *   *Point:* No. The card was pre-printed. The match was a **common cause** (the Instructor's setup).
      *   *Term:* **Reliable Correlation.** The physical report correlated with the experience, but the experience did no work.

  2.  **The Epiphenomenal Worry (Round 2):**
      *   *Ask:* "In Round 2, if you signed the card, what determined your signature? The feeling of fabric, or the presence of the card?"
      *   *Point:* If you signed, the physical presence of the card (and the point system) drove the action. The feeling of fabric was sidelined.
      *   *Term:* **Causal Closure of the Physical.** The physical facts (card + rules) were sufficient to produce the report. The experience was **Epiphenomenal** (causally inert).

  3.  **Aboutness and Knowledge (Round 3):**
      *   *Ask:* "In Round 3, the reports were identical. If you can't tell the difference in the pile, how do you know your report *now* is about your experience and not just a physical reflex?"
      *   *Point:* If the physical output is the same whether the experience is present or absent, the report cannot be *about* the experience in a way that guarantees knowledge.
      *   *Term:* **The Paradox of Phenomenal Judgment.** How can we know our experiences if our reports are fully explained by physical causes that don't require the experiences?

  ## 6. Predicted Failures and Mitigations

  **1. The "Guessing Game" Failure:**
  *   *Risk:* Students treat Round 2 as a puzzle to solve ("What does the Instructor want?") rather than a philosophical tension. They sign the card just to "win."
  *   *Mitigation:* In the Debrief, lean into this. "You signed to win points. In the real world, your brain is wired to 'win' (survive). If your brain outputs 'I see red' to survive, does it matter if you actually see red?" This *is* the epiphenomenalist worry.

  **2. The "True Sentence" Objection:**
  *   *Risk:* A student says, "I signed Round 1 because it was true. That's why it matters."
  *   *Mitigation:* Acknowledge this. "Truth is necessary. But is it sufficient for *knowledge*? If a broken clock is right twice a day, does it *know* the time? In Round 2, the card was 'true' to the Station Code, but 'false' to your hand. Which truth counts for knowledge?"

  **3. Reverse-Engineering:**
  *   *Risk:* A student realizes Station 1 always gets "Metal" and tells the group.
  *   *Mitigation:* Randomize the Station assignments as they walk in. Do not let them sit where they want.

  **4. Accuracy Swamping Authorship:**
  *   *Risk:* Students don't care about authorship, only points.
  *   *Mitigation:* In the Debrief, ask: "Who felt uneasy signing a lie?" Highlight that unease. That unease is the intuition that reports *ought* to be caused by experiences.

  ## 7. Limitations: What This Cannot Reproduce

  Be explicit about this in the final 5 minutes.

  *   **The Modal Gap:** The activity shows *physical* independence (the card was printed earlier). It cannot show *metaphysical* independence (that the report would be the same even if the laws of nature were different, or if qualia were inverted).
  *   **The Fix:** You must supply this verbally. "Imagine the card wasn't just printed earlier, but that the *laws of physics* determined the card, and your experience was a shadow that couldn't touch the ink. That is the philosophical claim."
  *   **The "Zombie" Intuition:** The activity simulates a Zombie world (reports without experience) for 20 minutes. But students know they *are* conscious. The activity cannot make them doubt their own consciousness, only the *link* between consciousness and report.

  ## 8. Commitment and Defense

  **Mechanism Choice:** I have committed to the **Sealed-Report Protocol** with the **Mismatched Round 2**.
  *   *Rejected Alternative:* A "Blindfolded Partner" design where one student speaks for another.
  *   *Reason for Rejection:* That tests testimony and trust, not first-person judgment. The paradox of phenomenal judgment is about *my* report of *my* mind. The Sealed-Report forces the individual to confront the disconnect between their internal state and the external record.
  *   *Rejected Alternative:* A pure discussion seminar.
  *   *Reason for Rejection:* As you noted, they "nod and move on." Intellectual assent is not phenomenological grip. They need to *sign the card* to feel the compulsion of the physical norm over the experiential norm.

  **Sequencing Defense:**
  *   **Round 1 (Match)** is essential to establish the baseline intuition: "Reports track experiences."
  *   **Round 2 (Mismatch)** is the hammer: "Reports track physical protocols."
  *   **Round 3 (Sorting)** is the nail in the coffin: "There is no observable difference."
  *   If you start with Round 2, they think it's a trick. If you skip Round 3, they think they can tell the difference. The sequence creates a trajectory from confidence to doubt.

  ## 9. Philosophical Conclusion

  **What this activity establishes:**
  The pressure falls mainly on the claim that **introspective reporting is a case of knowledge.**
  *   *Why?* Round 1 shows correlation is easy. Round 2 shows causation is dubious. Round 3 shows indiscernibility. If I cannot distinguish a report caused by experience from a report caused by physical protocol, I cannot claim to *know* my experience via the report. The *Aboutness* is secondary; if I don't know it, the "aboutness" is empty.

  **The Strongest Epiphenomenalist Reply:**
  "The **Constitution Reply**."
  *   *The Claim:* The experience does not *cause* the report as a separate billiard ball hitting another. The experience is *constitutive* of the neural state that causes the report. The physical state *is* (or realizes) the experience. Therefore, when the physical state causes the report, the experience is inherently involved.
  *   *Does the activity refute this?* **No.** In the activity, the Card (Physical) and the Feeling (Experience) were distinct objects. In the mind, they might be the same event described two ways.
  *   *Student Evidence:* In Round 2, when students signed the mismatched card, they felt a tension. That tension suggests they *do* distinguish the feeling from the report. If the Constitution Reply were intuitively obvious, they wouldn't feel they were "lying" when they signed the mismatched card. The activity gives us reason to think the reply requires a theoretical leap that contradicts our first-person phenomenology.

  **Final Instruction to Instructor:**
  When you close the session, do not solve the paradox. Leave them with the card in their hand. "You signed this. You know why you signed it. Now tell me: did the feeling matter?" Walk out. Let the silence do the work.
