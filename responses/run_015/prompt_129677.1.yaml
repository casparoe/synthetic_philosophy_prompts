  Candidate Interpretive Rules
  The first principle is the Contextual Segregation Principle. Institutional beliefs are inferred only when material patterns are restricted to specific, non-utilitarian contexts, such as burials or liminal spaces, and are absent from domestic or administrative spheres. This delivers her acceptance in Case 1 (ochre only on bodies, not tools) and Case 3 (weapons only at the river, not settlement). It explains her rejection in Case 2 (seals found in domestic trash) and Case 4 (markings on domestic jars), where mundane contexts contaminate the signal.

  The second principle is the Practical Exclusion Principle. Institutional inference requires that the pattern cannot be explained by mechanical necessity, practical function, or environmental factors. This delivers her acceptance in Case 1 (ochre on dead has no function) and Case 3 (mini weapons are useless for war). It explains her rejection in Case 4 (jar markings prevent cracks) and Case 5 (dental wear from diet/tools). Here, plausible practical alternatives override symbolic potential, regardless of pattern uniformity.

  Divergent Predictions for the Bead Case
  The Contextual Segregation Principle predicts she should Reject the institutional inference. The building contains sleeping mats and food-preparation debris, marking it as a domestic, utilitarian space. Since the beads are embedded in a mundane context rather than a segregated ritual zone like the cemetery or river crossing, the principle dictates that no institutional belief should be inferred. The presence of domestic debris contaminates the ritual potential, mirroring her verdict on the seals in domestic trash.

  The Practical Exclusion Principle predicts she should Accept the institutional inference. The beads are pierced but never strung, made of non-local clay, and found in no other context. They possess functional surplus; they serve no practical purpose and required effort to acquire. Since no mechanical or utilitarian explanation accounts for unpierced beads accumulating in one spot, this principle demands an inference of ritual or belief. The lack of practical utility outweighs the domestic setting.

  Best Verdict and Closest Precedent
  She will likely Reject the institutional inference. The closest precedent is Case 4 (domestic jar markings). In both instances, a pattern exists within a domestic setting, and while a symbolic reading is possible, she prioritizes the domestic context to block institutional claims. Even though Case 3 showed she accepts functional surplus, Case 4 demonstrates she rejects symbolic inference when the context is quotidian. The building's sleeping mats and food debris classify it as a living space, not a ritual repository.

  If she rejects, she adopts the Contextual Segregation Principle as paramount: belief requires spatial isolation from daily life. If she accepts, she adopts the Practical Exclusion Principle as paramount: belief requires only functional uselessness, regardless of location. Given her rejection of Case 2 (seals in trash), she consistently denies institutional status to objects mixed with domestic refuse. The domestic nature of the building overrides the functional surplus of the beads.

  The Crucial Test Case
  Consider a cache of pristine, unused stone axes found in a sealed pit far from any settlement, with no other debris. The Contextual Segregation Principle demands Acceptance. The location is isolated from domestic contexts, satisfying the requirement for spatial segregation indicative of ritual deposit. The Practical Exclusion Principle demands Rejection. Axes are inherently functional tools; their lack of wear could be due to storage rather than ritual. Without functional surplus, the principle blocks institutional inference. This scenario forces a choice between the importance of location versus object utility.
