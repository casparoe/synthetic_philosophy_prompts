      *   *Best Single Revision:* Refine (1) to be about *Nuclear* Origin, not Gametic Origin. This solves (5) immediately. It keeps (3) safe. It keeps (4) mostly safe (conception time usually implies different gametes/nuclear combinations). It requires tweaking (6) slightly (anti-haecceitism about nuclei).
