      *   *(1) vs. (5):* Mitochondrial donation involves moving a nucleus. The egg is technically a *different* egg (donor egg vs. mother's egg). If (1) says "different egg = different person," then (5) contradicts (1). (5) says "Nuclear genome does the work," implying the egg vessel doesn't matter for identity. (1) says "different egg... literally could not have been me." **Major Tension.**
