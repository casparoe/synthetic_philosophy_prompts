answer: |-
  **Project Proposal: Decoupling Logical and Causal Correlation in Superrational Decision Problems**

  **Abstract**
  Standard decision-theoretic literature often groups the Platonia Dilemma and variants of the Luring Lottery under the same umbrella: problems where agents face correlated outcomes without direct causal leverage. The prevailing view suggests that Causal Decision Theory (CDT) fails in both instances, while Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) succeeds by accounting for these correlations. This proposal argues that this grouping obscures a fundamental structural distinction. In the Platonia Dilemma, the correlation is logical, arising from the identity of reasoning algorithms. In the Luring Lottery, the correlation is causal but masked by a probabilistic gate. Conflating these mechanisms leads to decision rules that either grant agents spurious causal influence or collapse into evidential reasoning that accepts irrelevant correlations. This project proposes a formal separation of these correlation types, utilizing a hybrid puzzle to test whether a decision rule can respect logical correlation without admitting causal-probabilistic influence. The goal is to determine if a stable middle ground exists between CDT and EDT that is not merely a repackaging of FDT/TDT, within the scope of a single semester's research.

  **1. Motivation and Problem Statement**
  Decision theory is currently polarized between causal and evidential approaches, with newer functionalist theories attempting to bridge the gap. In high-stakes multi-agent scenarios, such as AI alignment or bargaining between identical agents, the handling of correlation is critical. The standard pedagogical approach treats problems like Hofstadter's Platonia Dilemma and various "Luring" or "Psychic" Lotteries as testing the same capacity: the ability to cooperate with copies or predictors.

  However, this treatment assumes that all non-causal correlations are functionally equivalent for the purpose of decision-making. I contend this is a category error. In Platonia, the correlation exists because two agents instantiate the same logical function; if I output "Cooperate," my twin *must* output "Cooperate" by logical necessity, absent randomization. In the Luring Lottery, the correlation exists because of a common causal past or a physical predictor, mediated by a probabilistic mechanism (the "gate").

  Current literature largely ignores this distinction because standard formalisms reduce both problems to payoff matrices and conditional probabilities. Once the problem is translated into $P(World State | Action)$, the *source* of the dependency is erased. This erasure allows decision rules to slide between logical and causal reasoning without scrutiny. The risk is that we adopt decision rules that work for the wrong reasons, leading to failures in novel environments where logical identity is present but causal history is not, or vice versa.

  **2. Theoretical Framework: Separating the Correlations**
  To address this, the project will establish a precise framing that distinguishes the two correlation types prior to utility calculation.

  *   **Logical Correlation (Platonia):** This is a relationship between outputs of identical or isomorphic algorithms. The dependency is a priori. It does not rely on physical signal transmission or common causes in the past light cone. It relies on the fact that $f(x) = f(x)$. The uncertainty is indexical (which copy am I?) or self-locating, not empirical.
  *   **Causal-Probabilistic Correlation (Luring):** This is a relationship mediated by physical states. Even if a predictor is highly accurate, there is a causal chain connecting the agent's decision to the predictor's output, often involving noise or a probabilistic gate. The dependency is empirical.

  The core hypothesis is that a robust decision theory should treat these differently. Specifically, an agent should condition on logical correlations (as they represent necessary truths about the output of their algorithm) but should be wary of conditioning on causal-probabilistic correlations where no causal leverage exists, to avoid the pitfalls of EDT (e.g., the "Smoking Lesion" problem).

  **3. Critique of Existing Literature**
  The primary gap this project addresses is the premature abstraction of decision problems into utility tables. When a researcher models Platonia, they typically assign a probability $p$ that the other player matches your move. When they model a Luring Lottery, they assign a probability $p$ that the predictor guessed your move. Mathematically, these look identical in the expected utility calculation.

  By flattening the structure, existing literature (including foundational texts on CDT, EDT, and early formulations of FDT) fails to ask whether the *justification* for the probability assignment matters. If the justification matters, then a decision rule that looks only at the final probabilities is insufficient. This project argues that the decision rule must have access to the *causal graph* or the *logical dependency graph* distinct from the probabilistic weights. Current functionalist approaches hint at this but often conflate "logical dependence" with "prediction accuracy," effectively treating a perfect predictor as a logical twin. This proposal seeks to pry those two concepts apart.

  **4. Methodology: The Hybrid Puzzle**
  To test this distinction, I will design and analyze a "Hybrid Puzzle." This thought experiment will isolate the variables to see if a decision rule can distinguish between the two correlation types.

  *   **Setup:** An agent faces a choice. There is a "Twin" and a "Predictor."
  *   **Condition A (Pure Logical):** The Twin runs the exact same source code. No causal interaction is possible.
  *   **Condition B (Pure Causal-Probabilistic):** The Predictor observes a noisy signal of the agent's prior neural state. There is no logical identity, only causal inference.
  *   **Condition C (The Hybrid):** The agent is told they are in a simulation where the "Twin" is actually a causal simulation running on separate hardware with a probabilistic gate that occasionally introduces bit-flips, *but* the source code is identical.

  The method involves formalizing a decision rule that accepts the correlation in Condition A (cooperating in Platonia) but rejects the evidential update in Condition B (avoiding the Luring Lottery trap if it mimics a Smoking Lesion). The core technical challenge is to define an operator that screens off causal-probabilistic evidence while retaining logical necessity.

  I will analyze this using a modified causal graph that includes "logical nodes" separate from "physical state nodes." The project will map how CDT, EDT, and FDT navigate this graph.
  *   **CDT:** Cuts all links to the Twin/Predictor. Fails Platonia.
  *   **EDT:** Accepts all links. Succeeds in Platonia but fails in Smoking Lesion variants of the Luring Lottery.
  *   **FDT/TDT:** Attempts to cut based on "subjunctive dependence." The project will test if FDT's definition of subjunctive dependence is precise enough to distinguish Condition A from Condition B, or if it treats them as identical.

  **5. Success and Failure Conditions**
  A successful result will look like one of the following:
  1.  **A Principled Distinction:** A formal axiom or graphical criterion that allows an agent to identify logical correlation distinct from causal-probabilistic correlation, leading to different actions in the Hybrid Puzzle.
  2.  **A Negative Proof:** A demonstration that any decision rule sensitive enough to capture logical correlation in Platonia *necessarily* becomes sensitive to causal-probabilistic correlation in the Luring Lottery, implying that the distinction is untenable for embedded agents.

  **Failure Modes:**
  *   **The EDT Collapse:** The proposed method ends up accepting all correlations, effectively becoming EDT. This would suggest that distinguishing the correlations is impossible without rejecting the evidential relevance of logical twins (which defeats the purpose of superrationality).
  *   **The CDT Retreat:** The method becomes so strict about causal influence that it rejects logical correlation, reverting to CDT.
  *   **Scope Creep:** The formalism becomes too complex to resolve within the semester, getting bogged down in the metaphysics of logical counterfactuals.

  **6. Scope and Feasibility**
  This project is scoped for a single semester, targeting a 5,000-word paper or a 20-minute workshop talk.
  *   **Weeks 1-3:** Formalize the definitions of Logical vs. Causal-Probabilistic correlation. Review existing FDT/TDT literature to pinpoint where the conflation occurs.
  *   **Weeks 4-7:** Construct the Hybrid Puzzle. Run thought experiments against CDT, EDT, and FDT.
  *   **Weeks 8-10:** Draft the argument. Focus on the "Utility Table Erasure" critique as the central hook.
  *   **Weeks 11-12:** Refine and edit.

  The scope is manageable because I am not proposing a full new decision theory. I am proposing a critique of the *classification* of existing problems and a test case (the Hybrid Puzzle) to demonstrate the classification's importance. The 5,000-word limit is sufficient to define the distinction, present the puzzle, and analyze the outcomes of the three major decision theories without needing to derive a complete new formalism.

  **7. Significance**
  If successful, this project clarifies the boundary conditions for superrationality. As we move toward deploying AI systems that may encounter copies of themselves or highly accurate predictors, knowing whether to treat a correlation as "logical identity" or "causal prediction" has safety implications. If an AI treats a causal prediction as a logical identity, it may cooperate when it should defect, or vice versa. By showing that the literature currently conflates these, this workshop contribution invites a more rigorous taxonomy of decision problems, moving beyond payoff matrices to the structural origins of correlation.

  **8. Conclusion**
  The Platonia Dilemma and the Luring Lottery are widely treated as siblings in the family of non-causal decision problems. This proposal argues they are cousins at best, separated by a critical mechanistic difference. By exposing the "Utility Table Erasure" in current literature and proposing a Hybrid Puzzle to test decision rules, this project aims to show that a principled separation is both necessary and currently unachieved. Whether the result is a new axiom or a proof of impossibility, clarifying this distinction is a prerequisite for the next generation of decision-theoretic research.

  ***

  **Notes for the Presenter (Internal)**
  *   *Spelling Check:* Ensure "correlation" is spelled correctly throughout the final paper.
  *   *Tone:* Keep the critique of FDT/TDT respectful; frame it as an opportunity for refinement rather than a debunking.
  *   *Visuals:* For the talk, prepare a diagram showing the Causal Graph vs. the Logical Graph to visualize the "erasure" that happens in utility tables.
  *   *Q&A Prep:* Be ready for the objection that "logical correlation just *is* a form of causal correlation in a physicalist universe." The counter-argument is that for the *agent*, the accessibility of the truth differs (a priori vs. empirical).
