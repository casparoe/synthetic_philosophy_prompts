      *   **Constraints:** ~24 claims/year, 1 week engineer time each, QA/Reg sign-off needed. Engineers have no philosophy training. Max 1 hour conceptual work per claim. Needs ordinary language, no citations/name-dropping.
      *   **Problem:** Naive dispositional claims ("X happens if C") fail in specific ways:
          1.  Test destroys capacity (Finkish/Self-defeating).
          2.  Blockers prevent manifestation (Masks).
          3.  Wrong cause produces behavior (Mimics).
          4.  Accidental regularity vs. genuine capacity (Miscalibration luck).
      *   **Deliverable:** An ordered decision procedure (checklist/flowchart style) with specific questions, sufficient answers, recording requirements, and "don't know" handling. Must flag stop-points (a) and escalation-points (b). Must be blunt about simplifications and failure modes.
      *   **Application:** Run the procedure on three specific cases (A: Latch/Shock, B: Sterile Barrier/Aging, C: Pump Bolus/Sensor).
      *   **Meta-Analysis:** For judgment call steps, explain what would change my mind about the procedure. Identify the class of claims where the procedure fails silently. Identify the step likely to become a rubber stamp.

  2.  **Deconstruct the Philosophical Concepts (for internal use, not output):**

      *   *Dispositions:* Properties like fragility, solubility.
      *   *Finks:* Dispositions that disappear when the stimulus occurs (e.g., a wire that loses conductivity when touched). In the user's context: Testing destroys the property.
      *   *Masks:* Something prevents the manifestation without removing the disposition (e.g., packing foam prevents glass breaking). In user's context: External factors block the failure mode.
      *   *Mimics:* Something looks like the disposition but isn't (e.g., a protected glass looks unbreakable but isn't fragile in the right way). In user's context: Test artifact or wrong mechanism.
      *   *Accidental Regularity:* Humean problem. Just because it happened 100 times doesn't mean it *must* happen. Need a causal mechanism.

  3.  **Drafting the Procedure (The "Core"):**

      *   *Goal:* Make it actionable for engineers. Use terms like "Mechanism," "Interference," "Artifact."
      *   *Step 1: Mechanism Check (Addressing Worry 4).* Is there a physical reason this holds, or just past data?
      *   *Step 2: Test Integrity (Addressing Worry 1 & 3).* Does the test break the thing or create the result artificially?
      *   *Step 3: Interference Check (Addressing Worry 2).* What else could stop this from working in the real world that isn't in the test?
      *   *Step 4: Scope & Risk (Addressing the "Absolute" claim problem).* Can we actually guarantee this, or is it probabilistic?

      *Refining the Steps for the User's Constraints:*
      *   Need to explicitly handle the "We don't know" scenario.
      *   Need to mark (a) Stop and (b) Escalate.
      *   Need to keep it under 1 hour of conceptual work.

      *Drafting the Steps:*
      1.  **The Cause Check:** Is there a specific physical feature doing the work? (Stops Mimics/Accidents).
      2.  **The Consumption Check:** Does passing the test use up the feature? (Stops Finks/Self-defeating tests).
      3.  **The Interference Check:** Are there real-world conditions that block the feature but aren't in the test? (Stops Masks).
      4.  **The Boundary Check:** Is the claim absolute or probabilistic? (Handles Risk).

  4.  **Applying to Cases:**

      *   *Case A (Latch):* Shock deforms latch to keep it closed.
          *   Cause: Deformation.
          *   Consumption: Yes, deformation is permanent. Reusable part? If reusable, this is a fail. If single-use test on reusable spec, it's a mismatch.
          *   Result: Claim needs rewriting or test change.
      *   *Case B (Sterile Pouch):* 36 months. Accelerated aging.
          *   Cause: Material integrity.
          *   Consumption: No (non-destructive testing usually, though aging is time).
          *   Interference: Real shelf conditions vs. accelerated. Humidity, light, handling.
          *   Result: Claim is okay *if* correlation between accelerated and real time is validated. This is a risk/escalation point.
      *   *Case C (Pump):* "Cannot deliver." Sensor shuts down.
          *   Cause: Sensor + Logic.
          *   Consumption: No.
          *   Interference/Mimic: Sensor failure mode hides occlusion.
          *   Result: "Cannot" is false. "Risk is reduced" is true. Absolute claim must be killed.

  5.  **Refining the Meta-Analysis:**

      *   *Judgment Calls:* Which steps are subjective? Step 1 (Mechanism sufficiency) and Step 4 (Risk tolerance).
      *   *Changing Mind:* If we find a claim passed Step 1 but failed in field due to unknown mechanism (emergent behavior), Step 1 is too rigid.
      *   *Silent Failure:* Complex software/system interactions (Case C type stuff) where the "Mechanism" looks solid but has edge cases not modeled.
      *   *Rubber Stamp:* Step 2 (Consumption). Engineers know if a test breaks the part. It becomes a checkbox.

  6.  **Review against Constraints:**

      *   *No Philosophy Jargon:* Avoid "fink," "mask," "mimic" in the procedure itself, maybe mention them in the explanation if helpful but the prompt says "If that framing earns its keep, use it; if it's a distraction... drop it." Better to drop the jargon in the *procedure* but acknowledge the concepts in the *rationale*. The prompt asks me to use the framing *if* it earns its keep. It does help structure the thinking, but for the *technicians*, plain English is better. I will use plain English in the procedure but acknowledge the mapping in the commentary.
      *   *Bluntness:* Don't soften the "Delete this claim" verdicts.
      *   *Time:* Keep the questions sharp.

  7.  **Final Polish of the Procedure:**

      *   Make sure the (a) and (b) flags are clear.
      *   Ensure the "We don't know" path is explicit.
      *   Check the "Rubber Stamp" prediction.
      *   Check the "Silent Failure" prediction.

      *(Self-Correction during drafting)*: I need to make sure I address the "Reusable" aspect of the user's job description. Case A highlights this. If the device is reusable, a test that deforms it is invalid for *durability* over time.
      *(Self-Correction on Case C)*: "Cannot" is a strong word. In medical devices, "Cannot" usually means "Risk is negligible." But the prompt says Regulatory and Sales want it in *absolute* form. The procedure must flag this as a lie if there's a failure mode. I need to be blunt here.

  8.  **Finalizing the Output Structure:**
      1.  Introduction (acknowledging the constraints).
      2.  The Decision Procedure (The 5-Step Check).
      3.  Application to Cases A, B, C.
      4.  Meta-Analysis (Judgment calls, Silent failures, Rubber stamps).

