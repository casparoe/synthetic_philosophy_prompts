      *Actually, let's merge Validation into Mechanism or Blockers to keep it under 1 hour.*
      Let's go with 4 Steps.
      1. Mechanism (Why does it hold?)
      2. Consumption (Does testing break it?)
      3. Interference (What stops it in the wild?)
      4. Wording (Absolute vs. Qualified).

      *Okay, ready to write.*

      *Wait, check the "Silent Failure" requirement.* Where does this procedure fail silently? Probably where the mechanism is unknown or complex (software black box).
      *Rubber Stamp:* Consumption. It's usually obvious.

      *Let's refine the "Philosophy" aspect.* The prompt says "If that framing earns its keep, use it." It *does* earn its keep for *me* designing the procedure, but for the *engineers*, "Fink" is useless. I will translate the concepts into engineering questions without using the labels in the checklist, but I will acknowledge the mapping in the commentary to show I understood the prompt's depth.

