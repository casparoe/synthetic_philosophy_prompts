answer: |-
  Here is a decision procedure designed for your constraints. It translates the philosophical problems (finks, masks, mimics, accidental regularities) into engineering questions without using the jargon. It is designed to take less than one hour of conceptual work per claim.

  ### The Dispositional Claim Validation Procedure (DCVP)

  **Instructions:** Complete this one-pager for every proposed claim before it enters the specification document. If any step triggers a **STOP**, the claim cannot be written as proposed. If any step triggers **ESCALATE**, the engineer records the data but a named authority (QA/Regulatory Lead) must sign the risk acceptance.

  ---

  #### Step 1: The Mechanism Check (Anti-Mimic/Accident)
  **Question:** What specific physical feature or law of physics makes this claim true? (e.g., "The latch geometry interlocks," not "It passed the test.")
  **Sufficient Answer:** A description of the load path, material property, or logic gate that enforces the behavior. It must explain *why* the result happens, not just *that* it happens.
  **Record:** The specific component ID, material grade, or logic block responsible.
  **If "We Don't Know":** **STOP (a).** Do not write the claim. A pattern of passing without a known mechanism is an accidental regularity (like your miscalibrated rig). It will fail in the field when conditions shift slightly.
  **Simplification Loss:** This ignores emergent properties where the mechanism is too complex to isolate (e.g., complex software interactions). It assumes a single point of failure or control.

  #### Step 2: The Consumption Check (Anti-Fink)
  **Question:** Does the act of verifying this claim permanently alter, damage, or use up the feature identified in Step 1?
  **Sufficient Answer:** "No." The part must be able to undergo the test and remain in the same state required for actual use.
  **Record:** Pass/Fail status of the part post-test.
  **If "Yes":** **STOP (a).** You are testing a single-use capacity on a reusable spec. You must either change the claim to reflect single-use limits or change the test to be non-destructive.
  **If "We Don't Know":** **ESCALATE (b).** Hand to QA. This is a risk decision: is the test damage negligible compared to operational wear?
  **Simplification Loss:** This treats "damage" as binary. In reality, micro-fatigue accumulates. This step catches gross destruction, not gradual degradation.

  #### Step 3: The Interference Check (Anti-Mask)
  **Question:** List three real-world conditions present during actual use that are *not* present during the test, which could block the mechanism from working. (Think: temperature, humidity, user handling, dirt, battery level).
  **Sufficient Answer:** A list where every item is either (1) proven irrelevant to the mechanism or (2) covered by a separate specification limit.
  **Record:** The list of excluded conditions and the justification for their exclusion.
  **If "We Don't Know" or "More than 3 items":** **ESCALATE (b).** Hand to Regulatory. This indicates the test environment is too clean. The claim is factually true in the lab but risky in the field.
  **Simplification Loss:** The "Rule of Three" is arbitrary. There could be a fourth, critical blocker. This forces engineers to look for *some* variance, but it cannot guarantee completeness.

  #### Step 4: The Wording Check (Absolute vs. Probabilistic)
  **Question:** Does the mechanism allow for *any* failure mode, however rare? (e.g., sensor power loss, material defect, software exception).
  **Sufficient Answer:** If "Yes," the claim cannot use words like "Cannot," "Always," or "Never." It must use "Risk is reduced," "Designed to," or "Probability < X."
  **Record:** The specific failure modes identified.
  **If "No" (i.e., failure is physically impossible):** You may use absolute language. (Note: This is rare in medical hardware).
  **If "We Don't Know":** **STOP (a).** You cannot certify an absolute negative ("Cannot deliver") if you cannot enumerate the failure modes.
  **Simplification Loss:** This forces a binary choice on language. It doesn't solve the statistical problem of proving "impossible," it just bans the word if *any* possibility exists.

  ---

  ### Application to Cases

  #### Case A: "The tray latch stays closed under a 30 g shock."
  *   **Step 1 (Mechanism):** The latch geometry deforms to lock. (Pass)
  *   **Step 2 (Consumption):** **FAIL.** The shock visibly deforms the latch. If this is a *reusable* device, the capacity to "stay closed" on the *next* use is compromised because the geometry is now changed. The test consumes the capacity.
  *   **Step 3 (Interference):** N/A (Already stopped).
  *   **Step 4 (Wording):** N/A.
  *   **Verdict:** **STOP (a).** Do not write this claim for a reusable device.
  *   **Required Action:** Either change the spec to "Single-use latch" or redesign the latch so the locking mechanism is elastic (returns to state) rather than plastic (deforms). If you cannot redesign, the claim must be scoped to "First shock event only."

  #### Case B: "The pouch maintains a sterile barrier for 36 months on the shelf."
  *   **Step 1 (Mechanism):** Polymer integrity prevents microbial ingress. (Pass)
  *   **Step 2 (Consumption):** No. Accelerated aging does not destroy the barrier; it simulates time. (Pass)
  *   **Step 3 (Interference):** Real shelf conditions (light, humidity spikes, stacking weight) vs. Accelerated chamber.
      *   *Engineer Answer:* "We assume Arrhenius correlation holds."
      *   *Procedure Check:* Is this "We Don't Know"? Technically, yes. Correlation is a model, not a fact.
  *   **Step 4 (Wording):** "Maintains" is acceptable if qualified by "when stored per IFU."
  *   **Verdict:** **ESCALATE (b).**
  *   **Required Action:** The engineer records the acceleration model. The Regulatory Lead must sign off that the model is sufficient to bridge the gap between "accelerated test" and "36 months real time." The claim stands *only if* Regulatory accepts the model risk.

  #### Case C: "The pump cannot deliver a harmful bolus."
  *   **Step 1 (Mechanism):** Occlusion sensor triggers shutdown. (Pass)
  *   **Step 2 (Consumption):** No. (Pass)
  *   **Step 3 (Interference):** Sensor failure mode hides occlusion. (Identified in prompt).
  *   **Step 4 (Wording):** **FAIL.** The prompt admits a rare failure mode exists. Therefore, "Cannot" is false.
  *   **Verdict:** **STOP (a).**
  *   **Required Action:** Delete the word "Cannot." Rewrite as: "The pump is designed to detect occlusions and limit bolus risk to X ml." Sales and Regulatory must be told that writing "Cannot" is a regulatory liability because a failure mode is known. If they insist on "Cannot," they are signing a falsification.

  ---

  ### Meta-Analysis of the Procedure

  #### 1. Judgment Calls and Changing My Mind
  Two steps rely on human judgment rather than hard data: **Step 1 (Mechanism Sufficiency)** and **Step 3 (Interference Relevance).**

  *   **Step 1 (Mechanism):** I require a physical explanation.
      *   *What would change my mind:* If you encounter a class of "Black Box" components (e.g., a sealed AI module or a proprietary alloy) where the vendor guarantees performance but won't share the mechanism. If you can validate these reliably via input/output stress testing over 5+ years without knowing the mechanism, Step 1 is too rigid. Evidence of long-term field reliability without mechanism knowledge would force me to add a "Validated Black Box" exception path.
  *   **Step 3 (Interference):** I ask for three conditions.
      *   *What would change my mind:* If a claim fails in the field due to a *fourth* condition that was obvious in hindsight. If this happens more than once, the "Rule of Three" is a false security. I would replace this with a "Precedent Check": *Has any similar device failed due to an environmental factor we didn't test?* Historical data is a better blocker than brainstorming.

  #### 2. Silent Failure Mode
  This procedure will fail silently on **Software-Dependent Dispositions.**
  *   *Why:* Step 1 asks for a "physical feature or law of physics." Software logic looks like a mechanism, but it is susceptible to state corruption, race conditions, and unhandled exceptions that do not show up as "damage" (Step 2) or "interference" (Step 3).
  *   *The Gap:* A software claim like "System resets on fault" can pass Step 1 (logic exists), Step 2 (no damage), and Step 3 (no environmental blocker), yet fail because of a memory leak that only occurs after 10,000 cycles. The procedure treats the system as static; software is stateful. I have no fix for this within your one-hour constraint; this requires a separate software validation protocol.

  #### 3. The Rubber Stamp
  **Step 2 (The Consumption Check)** will become a rubber stamp within six months.
  *   *Why:* For hardware engineers, it is usually immediately obvious if a test breaks the part. It is a binary physical fact.
  *   *Risk:* Engineers will start marking "No" for tests that cause *micro*-damage (fatigue) because it isn't "visible deformation."
  *   *Mitigation:* Every year, audit the "No" answers in Step 2 against field return data. If parts are failing earlier than expected, tighten the definition of "Consumption" to include "accumulated fatigue > 10% of life."

  ### Summary of Losses
  By simplifying this for technicians, you are losing:
  1.  **Probabilistic Nuance:** The procedure forces a Stop/Go. Real engineering risk is a curve. Step 4 tries to catch this with wording, but it can't quantify the risk.
  2.  **Systemic Emergence:** The procedure looks at components (latch, sensor, pouch). It is weak at spotting failures that arise only when Component A interacts with Component B in a specific sequence.
  3.  **Unknown Unknowns:** Step 3 asks for *known* interferences. It cannot protect against physics you haven't discovered yet.

  This procedure is not a guarantee of safety. It is a guarantee of **honesty**. It ensures that when you write a claim, you know *why* you think it's true, *what* you broke to prove it, and *where* the risk actually lies.
