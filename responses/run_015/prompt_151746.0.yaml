answer: |-
  ### Specification of Desiderata for a Theory of Survival

  To function as a viable account of "what matters," a theory of survival must bridge metaphysics, prudential rationality, and moral obligation. The following six desiderata specify the deliverables required. Each is marked as **Non-Negotiable (NN)** or **Prejudice (P)**. Where marked *Prejudice*, I argue that the demand reflects a specific metaphysical commitment rather than a requirement of rationality or phenomenology.

  #### 1. The Prudential Action-Guidance Constraint (NN)
  *   **Case/Consideration:** An agent stands before the scanner. She must know whether to anticipate the experience at the far end with the same self-concern she has for tomorrow's breakfast, or with the detachment she has for a stranger's surgery.
  *   **Verdict Required:** The theory must yield a determinate verdict on *anticipation*. It cannot say "identity holds but you should not care," nor "you should care but identity does not hold," without explaining the divergence. It must distinguish *being me* from *mattering to me* only if it can explain why the former ever fails to secure the latter.
  *   **Justification:** A theory of survival that fails to guide self-interested preference is practically inert. This is the primary function of the concept in the first-person perspective.

  #### 2. The Moral Reciprocity Constraint (NN)
  *   **Case/Consideration:** The agent has debts, promises, and obligations. The entity emerging at the far end is held responsible for crimes committed before scanning.
  *   **Verdict Required:** The theory must ground the transfer of special obligations. It must explain why the survivor owes the agent's debts, and why the agent's loved ones owe care to the survivor.
  *   **Justification:** Survival is not merely a private metaphysical fact; it is the scaffold of social and moral life. If the theory cannot justify punishment or reward transfer, it fails the third-person social test.

  #### 3. The Biological Continuity Constraint (NN)
  *   **Case/Consideration:** Ordinary neurobiology involves sleep (temporary suspension of consciousness), gradual cerebral replacement (neurons swapping over years), dense amnesia (loss of psychological connection), and dementia (fragmentation of personality).
  *   **Verdict Required:** The theory must not declare the agent dead during dreamless sleep or after a single neuron swap. It must accommodate *degrees* of psychological connectedness without collapsing into "no survival" at the first sign of memory loss. It must distinguish *what matters* from *what matters most*.
  *   **Justification:** Any theory that implies we die every night or survive only so long as every memory remains intact is empirically falsified by the continuity of ordinary life.

  #### 4. The Partial-Continuity Threshold Constraint (NN)
  *   **Case/Consideration:** **(i) Partial Scan.** 97% of synaptic weights are captured; the remaining 3% are filled from a population-average model. The result is recognisably the agent but carries confabulated memories.
  *   **Verdict Required:** The theory must specify whether the 3% gap breaks survival or merely diminishes it. It must handle the intuition that the survivor is "close enough" for practical purposes (Prudential) even if metaphysically imperfect. It must allow survival to admit of degrees if the physical substrate admits of degrees.
  *   **Justification:** If 100% scan = survival and 0% = death, a theory must account for the 97% case without resorting to a magical sharp cutoff that contradicts the vagueness of neural architecture.

  #### 5. The Intrinsicness Constraint (P)
  *   **Case/Consideration:** **(ii) Stored Scan, Staggered Instantiation.** Copy 1 is instantiated and dies. Copy 2 is instantiated from the *same* scan minutes later. In a variant, both run concurrently.
  *   **Verdict Required:** *The Prejudice:* This desideratum demands that whether Copy 2 is "me" should not depend on the extrinsic fact of whether Copy 1 exists or died.
  *   **Argument for 'Prejudice' Status:** Many theories (e.g., Psychological Continuity with a "no-branching" clause) violate this. They say Copy 2 is me if Copy 1 dies, but not if Copy 1 lives. I classify this as a *Prejudice* because it prioritizes logical uniqueness over psychological reality. If Copy 2 has all my memories and character, why should his ontological status hinge on the accidental survival of a duplicate elsewhere? However, retaining this constraint is necessary if we wish to avoid "extrinsic" identity, so it is a contested but powerful intuition.
  *   **Verdict:** A theory failing this must explain *why* extrinsic facts matter to intrinsic survival.

  #### 6. The Classical Identity Constraint (P)
  *   **Case/Consideration:** **(iii) Re-fusion & General Fission.** Two branches (A and B) emerge from the scanner, live ten years, then their connectomes are averaged into a single recipient (C). Also applies to standard fission.
  *   **Verdict Required:** *The Prejudice:* This demands that survival be **One-One** (unique) and **Determinately True or False**. It demands that "Will it be me?" always has a sharp answer.
  *   **Argument for 'Prejudice' Status:** I argue this is a *Prejudice* of the "Further-Fact" camp.
      1.  **Against One-One:** In fission, both outcomes bear the same relation to the original as ordinary survival does. To say "neither is me" because there are two is to privilege numerical identity over *what matters*. If I care about both equally, the demand for uniqueness is a metaphysical fetish, not a prudential necessity.
      2.  **Against Determinacy:** Demanding determinacy in a vague physical world (like the brain) is a category error. Like "baldness," survival may be indeterminate. The demand that it *must* be determinate stems from a desire for logical tidiness, not empirical reality.
  *   **Verdict:** A theory may reject this constraint (e.g., by adopting a "No-Further-Fact" view) provided it explains why the indeterminacy ought not to worry the agent (satisfying Job 3).

  ***

  ### The Incompatibility Analysis

  **The Incompatible Pair:**
  The **Classical Identity Constraint (One-One/Determinate)** and the **Prudential Action-Guidance Constraint (in Fission Cases)** cannot be jointly satisfied without distortion.
  *   *Reasoning:* If survival must be One-One (Classical Identity), then in a fission case (Teletransporter breakdown), neither successor is the original. The original ceases to exist. However, Prudential Action-Guidance dictates that the original should anticipate the experiences of *both* successors with self-concern (since both are psychologically continuous). If the theory says "You die" (to satisfy One-One) but "You should care as if you live" (to satisfy Prudence), it severs the link between identity and rational self-interest. If it says "You die and should not care," it violates rational self-interest.

  **The View-Excluding Requirement:**
  The **Classical Identity Constraint (One-One)** does the most to exclude otherwise attractive views.
  *   *Reasoning:* This requirement forces Psychological Continuity theories to adopt ad-hoc "no-branching" clauses (violating Intrinsicness) or declare death in fission (violating Prudence). It excludes the No-Further-Fact view entirely (which denies the premise). It effectively leaves only Animalism (which survives One-One but fails the Teletransporter intuition) or Cartesian Further-Fact views (which satisfy One-One but lack empirical grounding). It is the primary source of paradox in the literature.

  ***

  ### Compressed Scorecard

  | View | Prudential Guidance | Moral Reciprocity | Bio-Continuity | Partial/Threshold | Intrinsicness | Classical Identity (One-One) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Animalism** | **Fail.** (Scanner = Death) | **Fail.** (Survivor is stranger) | **Pass.** (Biological focus) | **Fail.** (Discontinuous) | **Pass.** | **Pass.** |
  | **Psychological Continuity** | **Pass.** (Cares about continuity) | **Pass.** (Grounds responsibility) | **Pass.** (Allows gradual change) | **Pass.** (Degrees of connection) | **Fail.** (Requires no-branching clause) | **Fail.** (Fission breaks uniqueness) |
  | **Further-Fact (Cartesian)** | **Pass.** (If Ego transfers) | **Pass.** (If Ego transfers) | **Fail.** (Ignores neurobiology) | **Fail.** (Binary Ego) | **Pass.** | **Pass.** |
  | **No-Further-Fact (Parfitian)** | **Pass.** (Redefines "survival") | **Pass.** (Based on relation R) | **Pass.** (Reductive) | **Pass.** (Embraces degrees) | **Pass.** (Denies deep identity) | **Rejects.** (Identity is not what matters) |

  **Deliverable Summary:** A viable theory must likely sacrifice the **Classical Identity Constraint** to preserve **Prudential Guidance** and **Biological Plausibility**. The "Prejudice" that survival must be a unique, determinate fact is the primary obstacle to a coherent account of the Teletransporter case. The theory must deliver a verdict on *what to care about*, even if it concedes that *who is who* is sometimes indeterminate or many-one.
