answer: |-
  The practice presupposes that computation is defined solely by input-output equivalence relative to a stipulated interface, treating the physical mechanism as irrelevant unless explicitly contracted otherwise.

  1.  **Two executions are the same computation if and only if they map every valid input to the same output, regardless of the internal steps taken.**
      *Verdict: Strictly presupposed.*
      This is the core "as-if" rule: the path does not matter, only the destination.

  2.  **The causal organization of the hardware does not need to match the abstract machine, provided the results are indistinguishable at the interface.**
      *Verdict: Strictly presupposed.*
      This excludes the view that genuine computation requires preserving the original causal structure; the practice treats causality as invisible noise.

  3.  **A lookup archive counts as a valid implementation only if it covers every possible valid input exactly, not merely the ones users are likely to try.**
      *Verdict: Strictly presupposed.*
      The practice can exclude the rival firm's product not because it uses recordings, but because "closest match" approximation violates the requirement for exact equivalence across the entire input domain.

  4.  **"Observable behavior" is not a fact of physics but a boundary drawn by the standard, which can be redrawn to include timing or power draw when security requires it.**
      *Verdict: Strictly presupposed.*
      This resolves the cryptographer's dispute: timing is non-observable by default, but becomes observable if the contract or specification explicitly defines it as part of the output.

  5.  **The meaning of the program is fixed by the abstract specification, not by what the physical machine actually does during execution.**
      *Verdict: Strictly presupposed.*
      This ensures coherence: the steps define the function, but only the function's values are enforced, allowing the compiler to skip steps so long as the mathematical mapping remains intact.

  6.  **We are entitled to claim an implementation matches the spec because the translation process is verified, not because we have tested every input.**
      *Verdict: Strictly presupposed.*
      Since finite testing cannot prove equivalence over infinite inputs, the practice relies on proof of the compiler or emulator's correctness rather than empirical generalization.

  7.  **The practice does not require the physical world to be limited to Turing-computation; a hypercomputer would conform if its outputs matched the abstract machine.**
      *Verdict: Optional.*
      The Church–Turing thesis is not a constraint here; the rule cares only about input-output matching, not whether the hardware exceeds standard computational limits.

  8.  **Resource constraints like time and memory are not inherent to the definition of computation but are practical limits imposed by the contract.**
      *Verdict: Merely convenient.*
      While the abstract machine is idealized, real-world preservation often adds resource constraints to exclude impractical implementations like massive lookup tables, though the core theory does not strictly require them.
