  Right, so does the "it's just tribal loyalty" defence actually answer her? Not really. Your mate's analogy relies on a category error: it treats politics as leisure, where tribalism is harmless fun, whereas Weil treats politics as a moral duty requiring absolute attention to truth. The football analogy collapses because in sport, bias is expected; in justice, it is fatal. If you want an analogy that captures Weil's view more fairly, think of a **jury** or a **scientific peer review**. In those settings, forming a 'team' to push a verdict regardless of evidence is considered corruption, not loyalty. The football defence doesn't refute Weil; it simply ignores her central claim that the party mechanism replaces conscience with collective pressure.
