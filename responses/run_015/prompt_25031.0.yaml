answer: |-
  # The Hard Choices Intuition Quiz

  **Instructions:** Read each scenario. Pick the answer that best matches your gut reaction, not what you think you *should* say.

  **1. The Career Crossroads**
  You must choose between a high-paying law job (secure, boring) and a lower-paid art job (precarious, meaningful).
  A. One is objectively better; I need to calculate which.
  B. Neither is better; I create the reason by choosing.
  C. They are different kinds of things; comparison is impossible.

  **2. The Small Improvement**
  Choosing between Job A and Job B is agonizing. You discover Job A pays $100 more.
  A. Job A is now strictly better than Job B.
  B. Job A is still not clearly better; the gap isn't about money.
  C. The comparison breaks down; $100 doesn't bridge the gap.

  **3. The Equality Check**
  If neither option is better than the other, are they equally good?
  A. Yes, they are equal in value.
  B. No, they are "on a par" (comparable but not equal).
  C. No, they are incomparable.

  **4. The Source of Difficulty**
  Why is this choice so hard?
  A. I lack information about the outcomes.
  B. The values themselves clash fundamentally.
  C. There is no fact of the matter about what's best.

  **5. The Coin Flip**
  Is it rational to flip a coin to decide?
  A. No, one option is best; flipping is irrational.
  B. Yes, I need to exercise my will to commit.
  C. Yes, because reason has gone silent.

  **6. Pain for Pay**
  Would you endure a severe headache for $1 million?
  A. Yes, there is always a trade-off price.
  B. Only if the money serves a specific commitment.
  C. No, pain and money are in different spheres.

  **7. Friend vs. Strangers**
  Save your best friend or two strangers?
  A. Two strangers (maximize lives saved).
  B. Friend (special relations shift the value).
  C. Cannot compare lives quantitatively.

  **8. Common Currency**
  Is there a single unit (like "utils") measuring all value?
  A. Yes, ultimately everything reduces to one scale.
  B. No, but values can still relate.
  C. No, values are distinct and separate.

  ***

  # Scoring Key

  Tally your answers.

  **Mostly A: The Commensurabilist (or Epistemic View)**
  You believe all values can be measured on a single scale. Hard choices are merely computational problems or results of ignorance. If you knew all the facts, one option would always be better.
  *   *Key Text:* Sen, Hare.
  *   *Note:* If you chose **4A** specifically, you lean **Epistemic**: values might differ, but there is still a hidden truth about which is best. If **8A**, you are a **Strict Commensurabilist**.

  **Mostly B: The Parity View**
  You believe values are comparable but not always via "better/worse/equal." Some options are "on a par." Hard choices allow you to exercise normative power (will) to create reasons.
  *   *Key Text:* Ruth Chang.
  *   *Vibe:* "I make it true by choosing."

  **Mostly C: The Incomparabilist**
  You believe some values belong to different categories that cannot be compared. Rational choice sometimes goes silent because there is no fact of the matter.
  *   *Key Text:* Joseph Raz.
  *   *Vibe:* "You can't compare apples and oranges."

  ***

  # Limitations & Flags

  **1. Commensurabilism vs. Epistemic View**
  This quiz cannot cleanly separate these based on choice behavior alone. Both prescribe maximizing. The distinction is metaphysical: Commensurabilists say values *are* one scale; Epistemic theorists say values might differ but there is *still a fact* about which is better (we just don't know it). Question 4 attempts to split them, but intuitions often blur here.

  **2. Parity vs. Incomparability**
  Both reject the trichotomy (better/worse/equal). The quiz distinguishes them via Question 5 (Will vs. Silence) and Question 2 (Small Improvement). However, without deep metaphysical follow-up, respondents may conflate "hard to compare" (Epistemic) with "impossible to compare" (Incomparability).

  **3. The Small Improvement Argument**
  Question 2 is the critical filter. Commensurabilists *must* say A+ is better than B. Parity and Incomparabilists say it isn't. This is the strongest diagnostic tool in the quiz.
