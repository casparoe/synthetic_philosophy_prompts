  4. **Sociological:** Claims this describes ordinary usage. Trivially true as observation, but philosophically inert; it doesn't tell us if ordinary usage is correct or justified. It avoids the normative question entirely.

  Debaters often treat the Metaphysical reading as true when convenient (AI isn't responsible because we don't feel it) but switch to Normative when challenged (we shouldn't feel it). The Metaphysical reading is the most vulnerable but offers the strongest exclusionary power. The Conceptual reading is the most common philosophical interpretation, but requires work to define 'proper'. The Normative reading is the safest but delivers weaker conclusions about the AI's status itself. The boundaries overlap significantly. A Conceptual claim often implies a Normative one: if 'responsible' means 'proper target', then blaming improperly is a misuse of language. However, the Metaphysical claim is distinct because it ties existence to occurrence. If you hold the Metaphysical view, you cannot say an AI is responsible but we shouldn't blame it; if we don't blame it, it isn't responsible. This rigidity is why debaters like it, despite its falsity. The Sociological view is often used as a shield: "This is just how we talk," avoiding the hard work of justification. Ultimately, the confusion arises because the slogan sounds like a definition (Conceptual) but is used to settle existence questions (Metaphysical).

  2. **Strawson's Actual View**

  Strawson's actual project is therapeutic, not reductive. He isn't defining responsibility metaphysically but describing the framework within which the concept lives. He argues reactive attitudes are non-optional features of human social life, not choices we make based on metaphysical beliefs. Thus, he supports a Conceptual reading grounded in human nature: responsibility is intelligible only within the 'participant stance'. Misattributions occur when critics treat him as an anti-realist who thinks responsibility disappears without actual anger. Strawson argues the *possibility* of these attitudes constitutes the framework, not their constant occurrence. He blocks the move to an 'objective attitude' globally, but allows it locally (e.g., for children or the disturbed). He is not saying responsibility *is* the feeling; he is saying the practice of holding responsible is constituted by the willingness to feel these things. This distinguishes him from the Metaphysical reading where responsibility ontologically depends on the emotion occurring. He is more interested in the conditions under which the attitudes are suspended, not the ontology of the responsibility itself. Consequently, Strawson avoids the hard metaphysical question of whether determinism eliminates responsibility. He bypasses it by arguing that even if determinism is true, we cannot abandon our practices. This makes his view robust against skeptical challenges but leaves the AI question open: can AI enter the participant stance? Strawson himself focuses on human nature, so extending his view to non-humans requires extrapolation he didn't provide.

  3. **The Slide: Actual Feeling vs. Appropriateness**

  The slide is a classic **Equivocation** on 'target'. One sense is 'actual target of emotion' (descriptive); the other is 'appropriate target' (normative). When debaters say "we don't resent AI," they use the descriptive sense. When challenged with hurricanes, they switch to "it's inappropriate," using the normative sense. The view that appropriateness is independent of actual feeling is **Fittingness Theory** (or sometimes 'Neo-Sentimentalism'). It holds that emotions have correctness conditions like beliefs. The mistake is a **Modal Confusion**: inferring 'not fitting' from 'not felt'. This matters for AI: if humans start feeling resentment toward bots, the Metaphysical view grants responsibility instantly. The Fittingness view resists this, demanding internal conditions (like understanding) for the attitude to be correct, regardless of actual human psychology. This distinction clarifies the psychopath debate. If appropriateness is independent, we can say resentment is *fitting* even if we adopt an objective attitude for safety. The mistake debaters make is assuming that because we *do* take the objective attitude (perhaps for therapeutic reasons), the attitude *would not be fitting*. This conflates pragmatic suspension with normative inappropriateness. Recognizing this prevents the slide: one must argue why resentment is unfitting for AI (e.g., lack of reciprocity), not just that we currently don't feel it. The term for the view where appropriateness is independent is sometimes called 'Response-Independence regarding Fittingness', though 'Fittingness Theory' is the standard label in meta-ethics. The error is often unconscious. It feels natural to say "I don't feel it, so it's not there." But in moral contexts, 'there' refers to normative status, not psychological presence. Correcting this requires debaters to specify whether they are making a claim about human psychology or moral reality. Without this precision, the slogan functions as a rhetorical shapeshifter, adapting to whatever conclusion the speaker desires at that moment in the argument.

  4. **Bottom Line for AI and Psychopath Cases**

  For AI, the Metaphysical reading offers a quick 'no', but it's unstable (what if we start feeling it?). The Normative/Fittingness reading is robust: AI lacks the moral reciprocity making resentment fitting. For psychopaths, the distinction is crucial. The Metaphysical view suggests psychopaths aren't responsible if we adopt the objective attitude toward them. The Normative view allows they *are* responsible, even if resentment is futile or dangerous. Debaters usually want the Metaphysical reading to exclude AI quickly, but they need the Normative reading to avoid absurdity (like blaming hurricanes). Ultimately, the slogan only works if paired with a theory of *when* attitudes are fitting, which Strawson provides via human nature, but AI debaters often lack. Therefore, the slogan alone delivers no conclusion. It requires a supplementary premise: either "AI cannot be part of human relationships" (Strawsonian) or "AI lacks internal states making attitudes fitting" (Fittingness). Without this, the slogan is empty. For the psychopath, the slogan supports excluding them only if we accept that their condition permanently suspends the participant stance. If their condition is partial, responsibility remains. The data scientist should treat the slogan not as a theorem, but as a variable definition requiring parameterization. Which 'target' condition? Actual or fitting? Human-only or general? Until defined, the output is undefined.
