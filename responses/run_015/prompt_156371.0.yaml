  0.07

  **(1) 0.90** — Shifting the contradiction from propositional content ($p$ vs $\neg p$) to evidential warrant ($p$ vs weak-support-for-$p$) dissolves the logical impossibility without requiring partitioning.
  **(2) 0.80** — Human psychology routinely sustains high confidence alongside acknowledged epistemic deficits (e.g., religious faith) without fracturing into distinct sub-agents.
  **(3) 0.20** — Acknowledging poor support transparently negates the essential misleading condition required to distinguish deception from honest motivated reasoning.
  **(4) 0.50** — A unified agent might maintain opacity regarding the *policy* of weighting even if the provenance tag is conscious, allowing functional mimicry of deception.

  **Combination Rule:** Multiplicative conjunction. All four conditions are necessary for the phenomenon to qualify as genuine self-deception in a unified agent; if any term is zero, the phenomenon collapses.
  **Calculation:** $0.90 \times 0.80 \times 0.20 \times 0.50 = 0.072$ (rounded to 0.07).

  **Weakest Link:** Term (3), the probability that the state qualifies as deception rather than motivated reasoning.
  **Shift Condition:** A robust thought-experiment result where third-party observers unanimously classify a PWDA-satisfying agent as "deceived" rather than "biased" despite the agent's transparent access to the weak evidential support.

  **Committed Position:**
  Provenance-weighted doxastic architecture (PWDA) fails to save the phenomenon of self-deception, though it successfully models stable irrationality. My low credence (0.07) rests on the defense that deception conceptually requires a victim who is misled about the truth or the state of their belief. In PWDA, the agent maintains belief $B$ while consciously tagging the support for $B$ as weak due to self-generation. Because the agent accurately represents the evidential status ("I believe $B$, but I know my reasons are shaky"), there is no falsehood believed by the "victim" part of the agent. This is not deception; it is epistemic akrasia or motivated reasoning where desire overrides acknowledged evidence.

  The multiplicative rule is necessary because PWDA claims to solve the paradox *and* maintain unity *and* preserve the deception label. If Term (3) fails, the label "self-deception" is a metaphor, not a literal description of the mechanism. I defend the low value of Term (3) by arguing that without partitioning, there is no place for the "lie" to hide. If the agent knows the support is weak, the agent is not deceived about the support. If the agent believes $B$ is true, the agent is not deceived about $B$. The only remaining candidate for deception is the *link* between support and confidence, but if the agent consciously down-weights the support, that link is transparent, not deceptive.

  Therefore, PWDA is a sophisticated description of how unified agents tolerate inconsistency, but it does not recover the intentionalist structure of deception. To shift my credence significantly, one would need to demonstrate that "deception" can occur purely through structural dissonance without any false belief held by the agent, a conceptual revision I currently reject as diluting the term beyond utility. The architecture saves the agent's unity, but at the cost of the deception itself.
