  8.  **Final Polish:** Organize by severity. Be direct. No flattery. (Proceed to generate output).

  *(Self-Correction on "Single Revision"):* If I change (6) to accept a form of pragmatic truth, does it fix (3)? Yes, because then "wrong" means "fails to cope with the archive/community standards" rather than "fails to mirror." Does it fix (2)? Yes, procedural objectivity *becomes* the path to pragmatic truth. Does it fix (4)? Yes, friction is what causes pragmatic failure. So changing (6) is indeed the leverage point.

