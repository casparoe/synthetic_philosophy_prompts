answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Non-Classical Approaches to Naive Truth and Semantic Paradox
  **Parties:** The Gap Theorist (Paracomplete) & The Glut Theorist (Paraconsistent)
  **Date:** October 26, 2023

  ## PREAMBLE

  We, the undersigned, acknowledge a decade of dialectical stalemate regarding the semantic paradoxes. We agree that the classical combination of Naive Truth (the schema $T(\ulcorner A \urcorner) \leftrightarrow A$) and Classical Logic yields triviality. We agree that Tarskian hierarchies are expressively deficient. We agree to collaborate on a document distinguishing settled mathematical constraints from contested philosophical interpretations, specifically regarding the Kripkean fixed-point construction and its logical governance.

  ---

  ## SECTION I: AGREED CLAIMS AND CRITERIA OF SUCCESS

  **1. Settled Mathematical Constraints [SETTLED MATHEMATICS]**
  *   **Tarski's Undefinability Theorem:** It is a theorem that no consistent classical theory strong enough to encode arithmetic can contain its own truth predicate satisfying the T-schema ($T(\ulcorner A \urcorner) \leftrightarrow A$) and the rules of Classical Logic (specifically Excluded Middle and Explosion).
  *   **Inconsistency of Naive Classical Truth:** The derivation of triviality from the Liar Sentence ($\lambda \leftrightarrow \neg T(\ulcorner \lambda \urcorner)$) using Classical Logic is valid. Any theory retaining Naive Truth must modify Classical Logic.
  *   **Existence of Fixed Points:** It is a theorem (Kripke 1975) that a monotone operator on a lattice of valuation schemes yields a fixed point where the truth predicate can be consistently applied to sentences of the language, including those containing the truth predicate.

  **2. Debts to the Classical Logician [SHARED COMMITMENT]**
  *   **Presumption of Classicality:** We concede that for the vast majority of scientific, mathematical, and empirical discourse, Classical Logic is the correct normative standard.
  *   **Burden of Explanation:** We bear the burden of explaining *why* Classical Logic fails for semantic paradoxes while remaining reliable elsewhere. We cannot simply assert classical logic is "wrong"; we must locate the specific failure condition (e.g., ungroundedness or overdetermination).
  *   **Non-Revisionism regarding Arithmetic:** Our theories must not alter the theorems of Peano Arithmetic. The paradoxes must be contained within the semantic vocabulary, not allowed to infect number theory.

  **3. Criteria for a Successful Theory [SHARED CRITERIA]**
  Both parties agree that a viable theory of truth must satisfy the following four constraints:
  *   **Transparency:** The truth predicate must be fully intersubstitutable. $A$ and $T(\ulcorner A \urcorner)$ must be salva veritate substitutable in all extensional contexts.
  *   **Compositionality:** The semantic value of a complex sentence must be determined by the semantic values of its constituents and the logical connectives.
  *   **Non-Triviality:** The theory must not entail that every sentence is true (or designated).
  *   **Classical Recapture:** The theory must validate Classical Logic for the domain of "paradox-free" (or "grounded"/"consistent") sentences.

  ---

  ## SECTION II: DISAGREEMENTS TABLE

  *Note: Wording in this section has been negotiated to ensure neither party characterizes the other's position as incoherent or obviously false.*

  | Point of Divergence | Gap Theorist's Position (Paracomplete) | Glut Theorist's Position (Paraconsistent) |
  | :--- | :--- | :--- |
  | **Semantic Status of the Liar** | The Liar sentence is **indeterminate**. It satisfies neither the truth predicate nor the falsity predicate. It represents a gap in the extension of the truth predicate. | The Liar sentence is **overdetermined**. It satisfies both the truth predicate and the falsity predicate. It represents a glut in the extension of the truth predicate. |
  | **Logical Framework** | **Strong Kleene ($K_3$):** The designated value is *True* only. Inference preserves truth. If premises are True, conclusion must be True. | **Logic of Paradox ($LP$):** The designated values are *True* and *Both*. Inference preserves non-falsity (or designatedness). If premises are non-false, conclusion must be non-false. |
  | **Negation** | Negation is **exclusionary**. $\neg A$ is true iff $A$ is not true. For the Liar, neither $A$ nor $\neg A$ is true. | Negation is **falsity-conferring**. $\neg A$ is true iff $A$ is false. For the Liar, both $A$ and $\neg A$ are true (because $A$ is also false). |
  | **Valid Inference (General)** | **Disjunctive Syllogism** ($A \vee B, \neg A \vdash B$) is invalid globally, as $\neg A$ may be indeterminate when $A$ is indeterminate. | **Disjunctive Syllogism** is invalid globally, as $\neg A$ may be true (because $A$ is both) while $A$ is also true, failing to eliminate $A$. |
  | **Nature of the Defect** | The defect is **semantic incompleteness**. The language fails to assign a classical value to pathological sentences. | The defect is **semantic inconsistency**. The language assigns conflicting classical values to pathological sentences. |

  ---

  ## SECTION III: THE CRUXES (TEST CASES AND PREDICTIONS)

  *In this section, we identify specific technical challenges. We record our respective predictions regarding how our theories handle them. Matters marked [CONTESTED] are not settled mathematics.*

  ### (a) The Revenge Problem
  **Test Case:** Consider the sentence $R$: "This sentence is not true (in the sense defined by the Gap Theorist)."
  *   **Gap Theorist Prediction:** [CONTESTED] $R$ will also be indeterminate. To express that $R$ is indeterminate, I must introduce a "Determinately" operator ($D$). I predict I can define $D$ without collapsing into a Tarskian hierarchy, though I acknowledge this requires extending the logic beyond simple Strong Kleene.
  *   **Glut Theorist Prediction:** [CONTESTED] The Gap Theorist cannot express the indeterminacy of $R$ within the object language without inconsistency or hierarchy. My theory accepts $R$ as a glut (true and false). I predict the Gap Theorist will be forced to admit a hierarchy of "determinacy" operators that mimics the Tarskian hierarchy they rejected.

  ### (b) Curry's Paradox
  **Test Case:** Consider the sentence $C$: "If $C$ is true, then $\bot$ (absurdity)."
  *   **Shared Problem:** [SETTLED MATHEMATICS] If the conditional obeys Modus Ponens and Contraction ($A \to (A \to B) \vdash A \to B$), both $K_3$ and $LP$ become trivial.
  *   **Gap Theorist Prediction:** [CONTESTED] We must adopt a non-contractive conditional (e.g., Lukasiewicz or Relevant). I predict this conditional is sufficient for ordinary reasoning but blocks the Curry derivation.
  *   **Glut Theorist Prediction:** [CONTESTED] We must also adopt a non-contractive conditional. However, I argue the Gap Theorist's conditional is too weak to support standard mathematical induction involving the truth predicate. I predict my treatment allows a stronger conditional while still blocking Curry.

  ### (c) Classical Recapture
  **Test Case:** Ordinary mathematical proof (e.g., Proof by Cases or Reductio).
  *   **Glut Theorist Task:** Explain why **Disjunctive Syllogism** ($A \vee B, \neg A \vdash B$) is safe in mathematics.
      *   **Glut Prediction:** [CONTESTED] DS is valid for all *consistent* sentences. Since mathematical sentences are not semantic paradoxes, they are consistent. Therefore, DS holds in practice.
  *   **Gap Theorist Task:** Explain why **Excluded Middle** ($A \vee \neg A$) is safe in mathematics.
      *   **Gap Prediction:** [CONTESTED] EM holds for all *grounded* sentences. Since mathematical sentences are grounded, EM holds in practice.
  *   **Shared Worry:** [CONTESTED] Can we formally define "consistent" or "grounded" within the object language without triggering new paradoxes? Both sides concede this is an open technical challenge.

  ### (d) Iteration and Hierarchy
  **Test Case:** Iterating the truth predicate or determinacy operator: $T(T(\ulcorner \lambda \urcorner))$.
  *   **Gap Theorist Prediction:** [CONTESTED] In the Kripke fixed point, $T(\ulcorner \lambda \urcorner)$ has the same value as $\lambda$ (indeterminate). Iteration does not force a hierarchy *if* we stay within the fixed point. However, expressing *that* it is indeterminate requires a meta-logical predicate.
  *   **Glut Theorist Prediction:** [CONTESTED] In the Kripke fixed point, $T(\ulcorner \lambda \urcorner)$ has the same value as $\lambda$ (both true and false). I can express *that* it is paradoxical within the object language (e.g., $T(\ulcorner \lambda \urcorner) \wedge \neg T(\ulcorner \lambda \urcorner)$). I predict this gives my view an expressive advantage over the Gap view.

  ---

  ## SECTION IV: CLOSING STATEMENT (VERBAL VS. SUBSTANTIVE)

  **1. Merely Verbal Disputes**
  We concede that a significant portion of our disagreement is **notational and model-theoretic**, not structural.
  *   **The Fixed Point:** We agree that the Kripkean fixed-point construction generates the *same* extension and anti-extension for the truth predicate in both our models.
  *   **The Third Value:** Whether we label the fixed-point value of the Liar as "neither" ($i$) or "both" ($b$) is, mathematically, a matter of defining the set of designated values. $K_3$ and $LP$ share the same truth tables; they differ only on which values preserve validity.
  *   **Duality:** We acknowledge the "Duality Principle": For every theorem in the Gap theory, there is a dual theorem in the Glut theory obtained by swapping truth/falsity and designated/undesignated conditions.

  **2. Genuinely Substantive Disputes**
  We maintain that the following disagreements are **philosophically substantive** and not merely verbal:
  *   **Normativity of Contradiction:** The Glut Theorist claims it is sometimes rational to accept a contradiction ($A \wedge \neg A$). The Gap Theorist claims it is never rational to accept a contradiction; one should instead withhold assent. This is a disagreement about the norms of belief, not just semantics.
  *   **The Nature of Negation:** The Gap Theorist views negation as exhaustive exclusion (if $A$ is not true, $\neg A$ is true, unless $A$ is gappy). The Glut Theorist views negation as incompatible truth (if $A$ is true, $\neg A$ is false, even if $A$ is also false).
  *   **Expressive Power:** The Glut Theorist claims the ability to assert the paradoxicality of the Liar within the object language is a genuine advantage. The Gap Theorist claims that asserting the Liar is "gappy" requires a meta-language stance that is philosophically honest about the limits of the object language.

  **3. Final Consensus**
  We agree that the Classical Logician is correct that *something* must give, but incorrect that *Transparency* must be the victim. We agree that the choice between Gap and Glut is not decidable by formal mathematics alone, as the fixed-point models support both. The choice rests on philosophical priors regarding the rationality of contradiction and the expressive requirements of a truth predicate.

  ***

  **Signed,**

  *The Gap Theorist*
  *(Representing the Paracomplete Tradition)*

  *The Glut Theorist*
  *(Representing the Paraconsistent Tradition)*
