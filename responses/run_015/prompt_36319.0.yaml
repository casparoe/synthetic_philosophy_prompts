      *   **Gap Theorist (Paracomplete):** Logic is $K_3$ (Strong Kleene) or similar. $T(\ulcorner A \urcorner) \leftrightarrow A$ holds, but Bivalence fails. Liar is neither true nor false ($i$). Disjunctive Syllogism (DS) fails generally but is "classically recaptured" for grounded sentences.
      *   **Glut Theorist (Paraconsistent):** Logic is $LP$ (Logic of Paradox). $T(\ulcorner A \urcorner) \leftrightarrow A$ holds, but Excluded Middle fails (or rather, non-contradiction fails). Liar is both true and false ($b$). DS fails (explosion fails).
      *   **Shared Enemy:** Classical Logic + Naive Truth (leads to triviality via Tarski/Paradoxes). Tarskian Hierarchies (restricting transparency).
