answer: |-
  Your disunity view is philosophically coherent but empirically insulated to the point of unfalsifiability, primarily because it infers hidden subjects from behavioral dissociations that the patients themselves deny experiencing.

  Regarding defeaters, you are overrating the hemispherectomy case and underrating the first-person reports of unity. If severing the corpus callosum yields two subjects, removing one hemisphere simply leaves one subject alive; this is consistent with disunity, not fatal to it, because it confirms that a single hemisphere is sufficient for a subject. The genuinely fatal evidence would be robust first-person testimony from split-brain patients asserting an uninterrupted sense of unity during dissociation tasks, provided those tasks reliably prevent cross-cueing. Even stronger are recent empirical findings suggesting that in naturalistic settings, split-brain patients exhibit far more functional integration than the classic lab experiments imply, indicating that subcortical structures may sustain a unified consciousness even without callosal transfer. If the brain can act as one without the corpus callosum, the inference to two subjects collapses.

  Defenders of the disunity view would concede that their position creates severe vagueness regarding moral responsibility and survival. If there are two subjects, punishing the body for a crime committed by the left hemisphere punishes an innocent right hemisphere, yet our legal and ethical frameworks cannot accommodate two agents in one skull. They also admit the "silent subject" problem: because the right hemisphere typically lacks speech, its purported consciousness is inferred rather than observed, making the view reliant on an argument from best explanation rather than direct evidence. This forces them to accept that one of the two subjects is permanently inaccessible to verbal interrogation, which is a significant epistemic cost.

  On falsifiability, your worry is well-founded: the view is heavily insulated against counter-evidence. In your switchable shunt scenario, if the patient reports unity while disconnected, the disunity defender claims the speaking hemisphere is merely unaware of the other, not that the other does not exist. The only version of this experiment the view could not absorb is one where the non-speaking hemisphere gains a channel of communication (e.g., via the left hand) and explicitly reports feeling unified with the speaking hemisphere during the disconnected state. Without that specific testimony, the view can always retreat to the claim that the reporting hemisphere is confabulating unity or lacks access to the other's experience. This insulation is a defect if you seek empirical rigor, but it is inherent to any theory positing private, unreportable conscious states.

  The individuation problem you identified is the most serious theoretical weakness. If connectivity determines subjecthood, and connectivity is a matter of degree, then the count of subjects becomes vague. Defenders usually argue for a threshold of functional integration required for a single subject, but admitting this threshold is arbitrary concedes that the number of subjects is indeed dependent on our descriptive granularity. If the honest answer is that subject count varies with experimental resolution, you are correct that this approaches a reductio, as it implies subjects are not ontological facts but artifacts of measurement. To avoid this, the view must posit a specific, non-arbitrary mechanism of unity (like a specific neural synchrony) that is either present or absent, but current neuroscience suggests integration is graded, not binary.

  Finally, your distinction between having one experience and having one place where experiences get reported is the precise gap where the disunity view operates. The evidence for disunity is almost entirely behavioral dissociation (one hand doing X, the other Y) read as evidence for phenomenal dissociation (one mind experiencing X, another Y). There is no direct evidence bridging this gap because we cannot access the experience itself, only the report and the behavior. If you privilege first-person reports, as you stated, the disunity view is on shaky ground because the primary report comes from a single locus (the speaking hemisphere) which claims unity. The view requires you to trust behavioral conflict over verbal testimony, effectively arguing that the brain knows itself less well than the observer watching its hands.
