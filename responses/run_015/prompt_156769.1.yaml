answer: |-
  This is a classic case of a philosophical slogan doing too much heavy lifting. In *On Certainty*, Wittgenstein is not offering a single theory but dissolving a picture. When your group says "doubt has to stop somewhere," they are likely gesturing at a grammatical point, while your coworker is making a managerial decision and dressing it up as epistemology.

  Here is the menu of distinct claims hidden in that sentence, evaluated for truth and relevance, followed by the specific diagnosis of your situation.

  ### The Menu of Readings

  **1. The Psychological Limit**
  *   **Claim:** Human cognitive architecture cannot sustain infinite skepticism. We get tired, we run out of working memory, or we become paralyzed.
  *   **Verdict:** **Platitude.** True, but epistemically inert. It explains why we *do* stop doubting, not why we *should* or why it makes sense to.
  *   **Confidence:** High (This is rarely what Wittgenstein means, though often what people hear).

  **2. The Regress Terminator (Foundationalist Lite)**
  *   **Claim:** Chains of justification must terminate. If every belief requires another belief to support it, you get an infinite regress. Therefore, some beliefs must be "basic" and accepted without evidence.
  *   **Verdict:** **False (as Wittgenstein reads it).** Wittgenstein explicitly rejects the picture of justification as a chain that needs a final link. Hinges aren't "known without evidence"; they are *not the kind of thing that can be known*. Treating them as foundational beliefs mischaracterizes their role.
  *   **Confidence:** High (This is the standard misreading of OC).

  **3. The Grammatical Constraint (Doubt Needs Grounds)**
  *   **Claim:** Doubt is a move within a language game. To doubt $X$, you must hold $Y$ and $Z$ fast to give the doubt meaning. Global doubt (doubting everything at once) destroys the context required for the doubt to signify anything.
  *   **Verdict:** **Substantive and Defensible.** This is the core Wittgensteinian insight. You can't doubt your memory is reliable *in general* because the very act of formulating the doubt relies on memory.
  *   **Confidence:** Very High (This is likely what the grad students mean).

  **4. The Pragmatic/Methodological Necessity**
  *   **Claim:** Inquiry is a practice. To investigate $A$, we must treat $B$ as fixed. If we question the ruler, we cannot measure the table.
  *   **Verdict:** **Substantive and Defensible.** This is about the conditions of possibility for investigation.
  *   **Confidence:** High.

  **5. The Enactivist/Action View**
  *   **Claim:** Certainty is not a mental state (feeling sure); it is a mode of acting. We don't "believe" the ground will hold; we walk on it. Doubt stops where action begins.
  *   **Verdict:** **Substantive and Defensible.** This dissolves the idea that we "choose" to stop doubting. We stop because we act.
  *   **Confidence:** High (This is the most robust reading of OC).

  **6. The Social/Community Consensus**
  *   **Claim:** Hinges are simply what a specific community agrees not to question at a specific time. There is no deeper justification than "this is how we do things."
  *   **Verdict:** **Substantive but Risky.** It captures the fluidity of hinges but risks sliding into "might makes right" relativism. Wittgenstein thinks hinges are bound by our form of life (human nature/world interaction), not just arbitrary agreement.
  *   **Confidence:** Medium-High.

  ---

  ### Hinge Status: Local or Global?

  **Verdict:** **Strictly Local and Temporal.**

  Wittgenstein is explicit that hinge propositions can harden into empirical propositions and vice versa. "The earth existed before my birth" is a hinge now; it was an empirical (and contested) claim in the 17th century.

  Your intuition about the test set is exactly right. "Test sets are uncontaminated" was a hinge in ML five years ago. It is now an empirical research topic (hence the papers on contamination). **If it is being researched, it is no longer a hinge.** You cannot declare something a hinge by fiat if the practice has already moved it into the realm of empirical investigation.

  ---

  ### Who is Right? (Group vs. Coworker)

  **The Reading Group**
  *   **Reading Invoked:** Likely **#3 (Grammatical)** or **#5 (Action)**.
  *   **Validity:** When applied to "Is my memory broadly reliable?", they are on solid ground. To doubt memory *globally* is to pull the rug out from under the language game required to express the doubt. It's a "nonsense" doubt in the Wittgensteinian sense.
  *   **Confidence:** High.

  **The Coworker**
  *   **Reading Invoked:** **#4 (Pragmatic)**, but corrupted into a policy decision.
  *   **Validity:** **Invalid.** The coworker is conflating "exempt from doubt" (philosophical status) with "exempt from monitoring" (engineering control).
      *   In Wittgenstein's terms, if you need a flagging system, you have already acknowledged the proposition is empirical (it can be true or false).
      *   By exempting it from the system, the coworker isn't treating it as a hinge; they are treating it as a **risk they are choosing to ignore**.
      *   **The Fatal Flaw:** Hinges are not *chosen*. You don't decide the ground is solid; you find yourself walking on it. Your coworker is *deciding* to treat the test set as solid to save labor. That is not a hinge; that is a gamble.
  *   **Confidence:** Very High that the coworker is misusing the concept.

  ---

  ### Critique of Your Framing

  You asked: *"If 'exempt from doubt' and 'exempt from checking' aren't the distinction I think they are... say that instead of answering politely."*

  Here is the correction: **The distinction is real, but the coworker is trying to collapse it illegitimately.**

  1.  **Exempt from Doubt (Hinge):** This means the proposition functions as a rule. You don't check it because checking it presupposes it. (e.g., You don't check if your eyes are working every time you read a gauge; if they weren't, the check wouldn't help).
  2.  **Exempt from Checking (Policy):** This means the proposition is empirical (it could be wrong), but we are allocating zero resources to verify it.

  **The Conflict:**
  If the claim "the test set is uncontaminated" is a genuine hinge, a monitoring system for it is *conceptually confused* (like monitoring whether 2+2=4).
  If the claim is empirical (which it is, since contamination is a causal process), then exempting it from checking is **risk management**, not epistemology.

  Your coworker wants the epistemic authority of a hinge ("You can't question this, doubt has to stop somewhere") without the ontological status of a hinge (which is determined by the practice, not the manager).

  **The "Doubt has to stop somewhere" move fails here because:**
  In engineering, doubt stops where **redundancy or cost-benefit analysis** says so, not where logic dictates. Wittgenstein's point is about the *logic* of justification. Your coworker is making a *budget* decision. Using OC to justify a budget decision is a category error.

  **Summary Verdict:**
  *   **Reading Group:** Annoying, but philosophically defensible in context.
  *   **Coworker:** Wrong. They are using a grammatical insight to bypass quality control on an empirical claim that has already ceased to be a hinge.
  *   **Your Intuition:** Correct. The hinge moved. You can't legislate it back.

  **Confidence in this diagnosis:** High. This is a standard "motivated misapplication" of Wittgenstein in technical fields.
