prompt: |-
  Hi — I'm in a little reading group on Wittgenstein's On Certainty (mixed bag: a couple philosophy grad students, me, and a coworker from the eval team where I work). Every time someone asks a question the group doesn't feel like dealing with, the reply is "doubt has to stop somewhere" and then everyone moves on. I feel the pull of it but I genuinely can't tell what it's asserting. Twice now it's been used to do real work: once to shut down a question about whether we can coherently doubt that our own memory is broadly reliable, and once at work, where my coworker used it to argue that a few upstream claims in our eval pipeline — that the test set isn't contaminated, that the harness runs the way we think it does, that the labels in our human-rated set were actually produced by the raters we think produced them — should just be exempt from the flagging/scoring system we're building, on the grounds that if you flag everything nothing gets flagged.

  Those seem like two very different jobs for one sentence to do, and I suspect the second one doesn't follow. So: can you lay out the distinct precise claims "doubt has to stop somewhere" might be making? The ones I can sort of see are a psychological one about cognitive limits (nobody can doubt everything at once, or hold every belief in mind at once); an epistemic one about the regress of reasons, that chains of justification have to terminate somewhere and so some things get held without grounds; a conceptual or semantic one where some propositions function as framework or rules rather than as descriptions, so doubting them isn't a move that's even available; a methodological one about having to treat some things as settled for inquiry to get going at all; and a stronger, more relativist one where the hinges are just whatever your community happens not to question and nothing more can be said. I'm defintely missing readings — something about entitlement, maybe, or about doubt needing specific reasons rather than being available wholesale — and I'd rather have your list than mine.

  For each reading: platitude, substantive and defensible, or just false? And is hinge-status supposed to be local to a practice and a time, or global? Because "the test set is uncontaminated" strikes me as something that was a unquestioned background assumption in my field not that long ago and is now an entire research area, which looks like a hinge that moved; and if hinges can move like that, then "exempt from doubt inside the practice" looks like a very different thing from "exempt from our monitoring system." Then tell me plainly which readings, if any, would actually get my coworker his conclusion, and which one the guy in the reading group probably thinks he's invoking.

  Two last things. Put a rough confidence on each verdict — what you'd defend in a seminar versus what you're improvising — and if my framing is off somewhere, if "exempt from doubt" and "exempt from checking" aren't the distinction I think they are, or if the whole disambiguation misses what's actually at issue, say that instead of answering politely. No citations needed, I don't want a reading list, just the menu.
