      *   **Task:** Rate each move (wrong to right), declare winners of specific points, and identify what *both* are missing.

  2.  **Deconstruct the Arguments:**

      *   **Nadia's Position:** Scientific Realism / Essentialism about Natural Kinds.
          *   *Claim 1:* Periodic table proves "real joints in nature."
