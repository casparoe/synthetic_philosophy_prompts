  # Handout: The Nonidentity Split
  **Reading Group Session: Person-Affecting Views & Future People**

  ### The Cases

  **Case A (The Nonidentity Protocol)**
  A fertility clinic offers a standard IVF protocol. The clinician can *Proceed Now* using fresh gametes, or *Defer One Cycle* to optimize hormonal lining. *Proceed Now* carries a 5% risk that the resulting child will have a mild, lifelong cognitive impairment (life remains clearly worth living). Because gametes turnover, *Defer One Cycle* results in a numerically different child. The clinician *Proceeds Now*. The child is conceived, born with the impairment, and at thirty affirms their life is worth living.
  *Constraints Check:* No existing person is harmed by the deferral; the impairment is not severe enough to make life not worth living; the complaint is not based on the rights of "possible people" but on the act itself.

  **Case B (The Fixed-Identity Protocol)**
  A fertility clinic offers a frozen embryo transfer. The clinician can *Proceed Now* with a specific, existing embryo, or *Defer One Cycle* to optimize hormonal lining. *Proceed Now* carries a 5% risk that the resulting child will have the same mild, lifelong cognitive impairment. Because the embryo is already created, *Defer One Cycle* results in the *same* child. The clinician *Proceeds Now*. The child is born with the impairment.
  *Match Note:* Same medical decision, same risk magnitude, same severity. Only the identity-relation between the decision and the child differs.

  **Case C (The Trade-Off Variant)**
  Identical to Case A (Fresh IVF, identity-dependent), but *Proceed Now* utilizes a cheaper drug regimen that saves the clinic from bankruptcy, preserving jobs for fifteen existing staff members. *Defer One Cycle* requires an expensive import that forces the clinic to fire those staff members. The 5% risk of impairment to the future child remains. The clinician *Proceeds Now*.
  *Cost Note:* The "safe" option imposes significant welfare costs on *existing* people (job loss); the "risky" option benefits them.

  ***

  ### The Theories

  **(i) Impersonal Total View**
  Rank outcomes solely by the sum total of welfare. An act is wrong if it produces less total value than an available alternative, regardless of who occupies the roles in those outcomes.

  **(ii) Narrow Person-Affecting View**
  An act is wrong only if it makes some particular person worse off than they would otherwise have been. If an act brings someone into existence with a life worth living, it does not make them worse off, even if an alternative act would have created a different, happier person.

  **(iii) The Placeholder View**
  The wrong is not about which individual ends up in the role, but about the prospect the agent hands to whoever will occupy the fixed position "the child conceived this cycle." The position holds a claim against being filled via a risky/harmful prospect, independent of the occupant's comparative welfare.

  ***

  ### Analysis & Verdicts

  | Case | (i) Total View | (ii) Person-Affecting | (iii) Placeholder |
  | :--- | :--- | :--- | :--- |
  | **A** | **Condemn** | **Permit** | **Condemn** |
  | **B** | **Condemn** | **Condemn** | **Condemn** |
  | **C** | **Permit** | **Permit** | **Condemn** |

  **Reasoning**
  *   **Case A:** (i) Condemns because the alternative child would have had more welfare. (ii) Permits because the impaired child is not worse off than in the alternative (non-existence). (iii) Condemns because the agent handed a risky prospect to the "child slot."
  *   **Case B:** (i) Condemns for lower total welfare. (ii) Condemns because the *same* child is worse off than they would have been. (iii) Condemns for the same reason as A.
  *   **Case C:** (i) Permits because the staff benefits outweigh the welfare difference between the two possible children. (ii) Permits because existing staff are better off, and the child is not worse off. (iii) Condemns because the claim of the "child slot" against risk is not trumped by aggregate benefits to others.

  **The Feature Doing the Work**
  The pivot is **Identity-Dependence**. In A, the victim and the beneficiary are the same person (existence vs. impairment), blocking (ii). In B, they are distinct (healthy vs. impaired), allowing (ii) to converge with (i). In C, **Aggregate Trade-Offs** separate (i) and (ii) from (iii); the first two allow the trade, the third treats the risk imposition as a side-constraint.

  **Counterfactual Stability**
  *   **If the outcome is certain (100% impairment) in A:** (iii) does *not* collapse into (ii). (ii) still permits (the child is not worse off than non-existence), while (iii) still condemns (the prospect handed to the slot was guaranteed harm).
  *   **If identity-dependence is stripped from A (making it B):** (ii) converges with the others. Once the same child exists in both alternatives, (ii) registers the harm and condemns the act.

  ***

  ### Objections

  **From the Defender of (i) Impersonal Total View**
  "Your 'Placeholder View' is just the Total View in disguise. If you condemn Case A because the 'slot' deserved a better prospect, you are admitting that a world with a healthier child is better than a world with an impaired child. If you admit that, you must also admit that in Case C, the staff benefits might outweigh that loss. To condemn C is to privilege the 'slot' arbitrarily over existing people, which is speciesism or temporal bias."

  **From the Defender of (ii) Narrow Person-Affecting View (The Thursday Objection)**
  "In Case A, you say the act is wrong but refuse to name a victim. If no one is worse off, 'wrong' is a free-floating predicate with no anchor. You claim the 'position' has a claim, but positions don't feel pain; people do. By condemning A, you are smuggling in the Impersonal View—you care that *someone* is impaired, not that *this person* is harmed. If you can't point to a person for whom this is a loss, you aren't doing person-affecting ethics; you're doing consequentialism with extra steps."

  **Response Strategy for the Group**
  The (ii)-defender is forcing a dilemma: either admit a victim (which contradicts the nonidentity logic) or admit you are actually an impersonal theorist. The Placeholder View attempts to escape by grounding the wrong in the **agent's conduct toward the role** rather than the **outcome for the occupant**. To defend (iii), you must argue that duties can be owed to "whoever comes to be" without requiring that specific person to be worse off than they would otherwise have been. It shifts the locus of wrongness from *comparative harm* to *risk imposition*.
