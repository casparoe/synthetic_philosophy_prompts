answer: |-
  Here is a specification sheet for a theory of artifact identity. I have drafted these as operational constraints for your committee, but they double as metaphysical stress-tests. I have flagged the "Prejudices" where a philosophical camp is masquerading as a neutral requirement.

  ### The Desiderata

  **1. The Symmetry Constraint (The Parallel Drydock)**
  *   **The Case:** A frigate enters a drydock. Team A restores it *in situ*, replacing planks one by one. Team B removes the planks, stores them, builds a new hull from new timber, and then reassembles the *old* planks onto the new hull. Both processes begin and end at the exact same moment ($t_1$). At $t_1$, there are two ships: the *Continuous* (in situ) and the *Reassembled* (old parts).
  *   **The Requirement:** The theory must provide a truth-maker for identity at $t_1$ that does not rely on temporal priority (since they finished simultaneously) or quantity of matter (since one has continuity, the other has original matter). It must either: (a) pick a winner via a principled hierarchy of properties, (b) declare both the original (violating uniqueness), or (c) declare the question indeterminate. It cannot say "wait and see which one sinks."
  *   **Status:** **Genuinely Required.** A heritage committee cannot issue a plaque that says "Wait ten years."

  **2. The Non-Retroactivity Constraint (The Fire Survival)**
  *   **The Case:** From the Parallel Drydock above, suppose the committee refuses to rule. Both ships sail. Twenty years later ($t_2$), the *Continuous* ship burns to the waterline. The *Reassembled* ship remains.
  *   **The Requirement:** The theory must state whether the *Reassembled* ship *became* the original at $t_2$, or *was* the original at $t_1$. A theory that makes identity at $t_1$ dependent on events at $t_2$ violates causal directionality. Identity conditions must be settled by the history up to the point of judgment, not by future survival.
  *   **Status:** **Genuinely Required.** Allowing future events to determine past identity renders historical record-keeping impossible.

  **3. The Rate-Neutrality Constraint (The Clockwork Swap)**
  *   **The Case:** A 17th-century clock. Case X: Every gear is swapped out one per year over 50 years. Case Y: The entire mechanism is swapped out overnight during a heist, using identical new gears.
  *   **The Requirement:** If the theory verdicts Case X as "Original" and Case Y as "Replica," it must identify the *mechanism* that makes speed destructive to identity. Is it the interruption of function? The break in spatiotemporal path? If the theory allows a "sharp cutoff" (e.g., "51% replacement kills identity"), it must explain why nature respects that number. If it denies a sharp cutoff, it must explain what kind of vagueness this is (semantic vs. ontic).
  *   **Status:** **Genuinely Required.** Arbitrary speed limits on restoration are unenforceable and unintuitive.

  **4. The Causal-Historical Barrier (The Blueprint Replica)**
  *   **The Case:** A burnt-out theater facade remains. A developer builds a new theater behind it using modern materials, identical dimensions, and the same name. No original material is used; there is no causal link between the old interior and the new interior other than the design plans.
  *   **The Requirement:** The theory must rule this *not* the original. It must block "Pure Form/Function" views (which would say identical design = identical object) without rendering form/function irrelevant. There must be a "genetic" or causal constraint.
  *   **Status:** **Genuinely Required.** Without this, insurance fraud becomes metaphysically impossible to distinguish from restoration.

  **5. The Binary/Graded Split (The Chimera Violin)**
  *   **The Case:** A Stradivarius is shattered. 60% of the original wood is recovered and used in a reconstruction; 40% is replaced with carbon fiber composite that mimics the acoustic properties perfectly. The causal chain of craftsmanship is unbroken.
  *   **The Requirement:** The theory must explicitly state whether identity is all-or-nothing (Binary) or a matter of degree (Graded). If Binary, it must explain why our *concern* varies by degree (we care more about the 60% wood violin than the 10% one). If Graded, it must provide the metric for the percentage. It cannot smuggle in graded value while claiming binary identity.
  *   **Status:** **Prejudice (The "All-or-Nothing" Camp).** Insisting that metaphysical identity *must* be binary is a prejudice of classical logic applied to material objects. A pragmatic theory should allow graded identity (or distinguish "identity" from "authenticity").

  **6. The Social Alignment Constraint (The Deeded Landmark)**
  *   **The Case:** A historic house is physically moved 5 miles to save it from a dam. The registry number, address, and legal deed stay with the *location*. The physical structure moves. Which is the landmark? The empty lot or the house in the new spot?
  *   **The Requirement:** The theory must account for the weight of social practices (registry, naming, legal status). If the theory says "The House" but the law says "The Lot," the theory must explain whether this is a failure of the theory or a failure of the law. It cannot ignore the social layer as "merely conventional."
  *   **Status:** **Genuinely Required.** For a heritage committee, social designation *constitutes* part of the artifact's function.

  **7. The Scope Limit (The Software Fork)**
  *   **The Case:** A software codebase is rewritten line-by-line over a decade (Ship of Theseus). Simultaneously, the original code is forked; the old code runs on a server, untouched but unused.
  *   **The Requirement:** The theory must state if it applies uniformly to persons, institutions, and code, or if it offers a principled reason why ships differ from persons. "Uniformity" is not mandatory, but "Uniformity or Explain the Difference" is.
  *   **Status:** **Prejudice (The Reductionist Camp).** Demanding that ships and persons share identical identity conditions is a philosophical preference (reductionism), not a practical necessity. Artifacts may have different persistence conditions than biological organisms.

  ***

  ### The Squeeze: Where the Desiderata Break

  You suspected it: **Determinacy + Transitivity + Non-Retroactivity + Symmetry** is an impossible quartet. Here is the proof using your **Parallel Drydock (Case 1)** and **Fire Survival (Case 2)**.

  1.  **Assume Non-Retroactivity:** The identity status of the *Continuous* and *Reassembled* ships must be fixed at $t_1$ (when they diverge), not $t_2$ (when one burns).
  2.  **Assume Symmetry:** At $t_1$, the *Continuous* ship has the claim of Spatiotemporal Continuity. The *Reassembled* ship has the claim of Material Constitution. If the theory values both, the claims are symmetric. There is no intrinsic feature at $t_1$ that privileges one over the other without arbitrary stipulation.
  3.  **Assume Determinacy:** There is a fact of the matter. One ship *is* the original, the other *is not*. (They cannot both be it, due to Transitivity/Uniqueness: If A=Original and B=Original, then A=B, but A and B are in different drydocks).
  4.  **The Contradiction:**
      *   If you satisfy **Determinacy**, you must pick a winner at $t_1$.
      *   If you satisfy **Symmetry**, you cannot pick a winner at $t_1$ (because the claims are equal).
      *   If you satisfy **Non-Retroactivity**, you cannot wait for $t_2$ to break the tie (e.g., "the one that survives is the original").

  **The Verdict:** You must drop one.
  *   **Drop Determinacy:** Accept that at $t_1$, it is *indeterminate* which ship is the original. (This saves Symmetry and Non-Retroactivity, but annoys the committee who needs to issue a plaque).
  *   **Drop Symmetry:** Privilege one metric arbitrarily (e.g., "Continuity always beats Matter"). (This saves Determinacy, but admits the theory is stipulative, not discovered).
  *   **Drop Non-Retroactivity:** Allow the "Survivor Wins" rule. (This saves Determinacy and Symmetry, but violates causal directionality).

  **The Single Knockout Requirement:**
  **Non-Retroactivity.**
  This is the requirement that kills the most candidates. Many "Causal Continuity" theories implicitly rely on the future to validate the past (i.e., a chain is only a true chain if it continues). If you enforce Non-Retroactivity strictly, you force the theory to find a truth-maker *in the moment of divergence*. This eliminates most "Survivor" theories and most "Best Candidate" theories that rely on comparing outcomes. It forces you toward either **Conventionalism** (we decide at $t_1$) or **Indeterminacy** (there is no fact at $t_1$).

  ***

  ### Scorecard of the Usual Suspects

  *   **Matter-Based (Constitution):** Fails **Case 4 (Blueprint Replica)** if form matters, fails **Case 1 (Parallel Drydock)** because it picks the Reassembled ship arbitrarily over the Continuous one without explaining why matter > continuity.
  *   **Form/Function-Based:** Fails **Case 4** spectacularly (cannot distinguish replica from original). Fails **Case 6 (Social Layer)** if the function changes but the registry stays.
  *   **Spatiotemporal Continuity:** Fails **Case 1** (cannot explain why the Reassembled ship isn't the original if matter is reassembled continuously). Fails **Case 3 (Rate-Neutrality)** if the swap is overnight (breaks the path).
  *   **Temporal Parts (4Dism):** Handles **Case 3 (Gradualness)** well (no sharp cutoff, just different slices). Struggles with **Case 6 (Social Layer)** because social practices aren't easily mapped to spacetime worms.
  *   **Constitution Views (Object vs. Matter):** Good at distinguishing the "ship" from the "wood." But often falls into **Prejudice 5 (Binary Identity)**, refusing to admit degrees of authenticity.
  *   **Conventionalism:** Passes **Case 6 (Social Layer)** and **Case 1 (Symmetry)** (we just vote). Fails the **Prejudice of Realism** (the feeling that there *should* be a fact of the matter independent of us).
  *   **Eliminativism:** ("There are no ships, only atoms arranged shipwise"). Passes everything by dissolving the question. Fails **Practical Utility** (useless for a heritage committee).

  ### Final Note on Prejudices

  You asked me to flag the "camp prejudices in a necktie."
  The strongest one is **"A theory must vindicate folk verdicts in easy cases."**
  This is the **Common-Sense Realist Prejudice**. It assumes that our intuitive reactions to cases (e.g., "Obviously the moved house is still the house!") are data points the theory must fit. But in heritage work, our intuitions are often inconsistent (we want the old wood *and* the continuous history). A good theory might tell you that your folk verdicts are incoherent. Do not treat intuition as a constraint; treat it as a symptom.

  The second is **"Uniformity across kinds" (Scope).**
  Demanding that the identity conditions for a violin match those for a person is metaphysical imperialism. Artifacts are defined by *intent* and *function*; persons are (arguably) defined by *psychology* or *biology*. A theory that forces them to match is likely distorting one to fit the other.

  **Recommendation for the Committee:**
  Adopt a **Conventionalist-Plus** view. Acknowledge that metaphysically, the *Parallel Drydock* case is indeterminate (Drop Determinacy). But practically, you must rule. Therefore, identity is fixed by **Social Alignment (Desideratum 6)** at the moment of divergence. The ship that retains the registry and the intent of the custodians is the original, not because of the wood or the path, but because the *institution* sustains it. This satisfies Non-Retroactivity (decision made at $t_1$) and Symmetry (social tie-breaker), at the cost of admitting that "originality" is partly a legal status, not a physical fact.
