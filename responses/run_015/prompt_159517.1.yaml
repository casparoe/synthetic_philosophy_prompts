  **Let's force the divergence.**
  I need an option with a high product but very unbalanced shares, vs an option with a lower product but very balanced shares.
  *   **Option 1:** Red 9, Blue 5 (Product 45). Ideal (10, 10). Shares: 90%, 50%. Min 50%.
  *   **Option 2:** Red 6, Blue 7 (Product 42). Ideal (10, 10). Shares: 60%, 70%. Min 60%.
  *   **Nash picks Option 1.**
  *   **KSBS picks Option 2.**

  **The Test Case:**
  *   **Option 1:** Red 9, Blue 5
