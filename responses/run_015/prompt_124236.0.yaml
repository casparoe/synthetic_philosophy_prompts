answer: |-
  This is one of the most famous slippery slopes in moral philosophy, so your frustration is warranted. The "Separateness of Persons" objection (most famously articulated by Rawls, though sharpened by Nozick) is often stated vaguely.

  To get the gut-level intuition, we need to stop thinking about "souls" or "metaphysical boundaries" and start thinking about **who holds the bill.**

  Here is the breakdown of where the real weight sits.

  ### 1. Why the Prudence Analogy Fails (The Compensation Problem)

  You asked: *Both cases have a single deliberator and one utility function. So what licenses trade-offs over time but not across persons?*

  The intuitive answer is **Compensation.**

  **The Gut Check:**
  Imagine you have a toothache. You go to the dentist. She drills your tooth. It hurts like hell. But later, the infection clears, and you eat an apple pain-free.
  *   **Who suffered?** You.
  *   **Who benefited?** You.
  *   **The Transaction:** The "You" that suffered is compensated by the "You" that benefited. The loss is *internalized* and *cancelled out* by the gain within the same system of experience.

  Now imagine the Utilitarian/Impartial Observer version.
  You have a healthy kidney. I have kidney failure. The doctor takes your kidney and gives it to me.
  *   **Who suffered?** You.
  *   **Who benefited?** Me.
  *   **The Transaction:** The "You" that suffered *never* gets the benefit. The "Me" that benefited *never* bore the cost.

  **The Premise Doing the Work:**
  The weight of the argument sits on this premise: **A burden is only morally offset if the bearer of the burden participates in the compensation.**

  In the prudential case (one life), the earlier stage and later stage are linked by a mechanism of **internal compensation**. Even if the 70-year-old is psychologically very different from the 20-year-old, there is a continuous legal, biological, and narrative thread that allows the 70-year-old to look back and say, "That sacrifice was *for me*."

  In the interpersonal case, that thread is cut. If I sacrifice my leg for your health, I do not get to walk on your leg. The loss is absolute for me. The fact that the *sum total* of legs in the universe is optimized is irrelevant to the fact that *I* am the one without a leg.

  **Addressing the 70-vs-20 Year Old Worry:**
  You asked if this commits you to contentious metaphysics. If the 70-year-old is barely psychologically continuous with the 20-year-old, does the objection apply inside that life?

  **Intuitively: Yes.** And that actually *strengthens* the Separateness objection.

  If you imagine a case where the psychological connection is so weak that the 70-year-old is essentially a stranger to the 20-year-old (e.g., total memory wipe, total personality shift), we *do* start to feel that sacrificing the 20-year-old for the 70-year-old is morally suspect. We hesitate to force a child to work themselves to death so a senile adult they will barely recognize can live in luxury.

  This suggests the "magic" isn't in the biological skin boundary; it's in the **continuity of consciousness and interest.** Utilitarianism treats the boundary of a person as morally irrelevant. The Separateness objection says the boundary of a *conscious experience* is morally relevant. Since distinct people have distinct, non-overlapping conscious experiences, you cannot balance the books across them.

  ### 2. Aggregation vs. Compensation vs. Justification

  You asked: *Are there two complaints bolted together? Can this be re-run in justificatory terms?*

  There are indeed two layers, but one is doing the heavy lifting.

  **Layer 1: Aggregation (The Math)**
  Utilitarianism says $10 + 10 = 20$. It sums utilities.
  *Critique:* This treats utility like a fluid that can be poured between containers.
  *Verdict:* This is weak on its own. Why *can't* we sum utilities? We need a reason.

  **Layer 2: Compensation (The Moral Mechanism)**
  This is the heavy lifter. It says: "You cannot balance a loss in Container A with a gain in Container B."
  *Verdict:* This is the core intuition. It explains *why* aggregation is forbidden. Aggregation is only legitimate if compensation is possible. Since compensation across persons is impossible (I cannot enjoy your pleasure), aggregation across persons is illegitimate.

  **Layer 3: Justification (The Political Turn)**
  Can we run this without metaphysics? **Yes.** This is the Rawlsian "justificatory" move.

  Instead of arguing about whether persons are "metaphysically distinct substances," argue about **claims**.
  *   Every person is a distinct source of valid claims on the world.
  *   Person A has a claim not to be harmed.
  *   Person B has a claim to be helped.
  *   To justify harming A, you must offer a justification *to A*.
  *   "But B got happy" is not a justification *to A*. It is a justification to B, or to the Universe. But A is not the Universe.

  **The Intuition:**
  Imagine you are Person A. You are being told you must suffer so Person B can thrive.
  *   **Utilitarian Justification:** "Because the total good increased."
  *   **Your Response:** "I am not a container for 'total good.' I am me. The total good is an abstraction; my pain is concrete. You haven't explained why *I* should accept this."

  This avoids metaphysics. It doesn't matter if persons are "separate souls." It matters that **justifications must be addressable to the subject.** You cannot address a justification for my suffering to someone else.

  ### Summary: Where the Weight Sits

  If you want to pin the argument down to a single premise that carries the weight, it is this:

  > **The moral significance of a benefit or burden is indexed to the subject who experiences it, not to the aggregate.**

  The Harsanyi/Impartial Observer argument fails because it asks you to deliberate as if you were the **Universe** (a single entity experiencing all the utilities). But you are not the Universe. You are a deliberator standing outside the choice, or a participant within it.

  *   **Harsanyi says:** "Imagine you have an equal chance of being anyone. Therefore, maximize the average."
  *   **Rawls says:** "That thought experiment tricks you. In reality, there is no 'you' who has a chance of being everyone. There is only Alice, Bob, and Charlie. If you maximize the average, you might be telling Alice to be destroyed for Bob's sake. Alice cannot accept that trade, because she doesn't get to be Bob."

  **The "Gut" Takeaway:**
  The separateness of persons objection is not about metaphysics; it is about **ownership**. I own my life. You own yours. Utilitarianism treats all lives as jointly owned by the "Greater Good." The objection is simply that no such joint ownership exists. Therefore, you cannot spend my life to pay for yours.
