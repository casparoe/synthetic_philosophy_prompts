  please draft the memo i'll circulate before the meeting. recommend either full adoption, rejection, or a pilot with concrete evaluation criteria and a timeline. take seriously both the argument that satire dies when institutionalized and the argument that voluntary reflection never happens. don't just summarize — give us an actionable recommendation, and identify the strongest objection to it. also address the workload concern in practical terms, not just as an afterthought.
