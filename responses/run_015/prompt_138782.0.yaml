answer: |-
  **Private Brainstorming**

  I propose four candidate principles governing the board's precedents. I have tested each against all ten precedents.

  1.  **Aggregativity:** Questions are decomposable iff the answer is a function of independent sub-facts.
      *   *Fit:* Precedents 2 (Income), 10 (Statistics).
      *   *Strain:* Precedents 5 (Confession), 6 (Courage), 7 (Beauty). These require holistic judgment where the whole exceeds the sum of parts. Precedent 1 (Levee) strains this too, as risk is holistic, yet approved.
  2.  **Sovereign Stance:** Questions are decomposable iff the answer does not require the decider to personally embody the conclusion.
      *   *Fit:* Precedents 4 (Hiring choice reserved), 8 (Forgiveness denied).
      *   *Strain:* Precedents 1 (Levee approval), 3 (Dual-use publication). These are institutional stances yet approved, suggesting "personal" ownership matters more than institutional.
  3.  **Semantic Isolation:** Sub-questions are valid iff their answers retain meaning without knowing the top-level goal.
      *   *Fit:* Precedents 5, 8 (Meaning changes if goal known).
      *   *Strain:* Precedent 10 (Stats soundness). Consultants didn't see the whole analysis or conclusion, yet approved. Isolation is possible there.
  4.  **Framing Neutrality:** Trees are valid iff sub-questions do not structurally bias the aggregation.
      *   *Fit:* Precedent 9 (Promotion tree rejected for bias).
      *   *Strain:* Precedent 3 (Weights required). Neutrality isn't enough; explicit weighting is needed for ethical cases.

  Testing against all ten reveals no single principle dominates. Aggregativity explains factual cases but fails on norms. Sovereign Stance explains norms but fails on policy. The tension is real.

  **First, the candidate principles**

  Based on the brainstorming, the board operates on four overlapping rules:

  1.  **Aggregativity:** Valid iff the answer is computable from independent sub-facts. This explains precedents 2 and 10 well. It strains against 5, 6, and 7, where properties like "voluntary" or "beautiful" emerge only from the configuration, not the parts. It also strains against 1, where risk is holistic yet approved.
  2.  **Sovereign Stance:** Valid iff the answer does not require the decider to constitute the conclusion through the act of deciding. This explains 4 (hiring choice reserved) and 8 (forgiveness denied). It strains against 1 and 3, where institutional policy decisions were approved, implying some stances can be delegated if procedural safeguards exist.
  3.  **Semantic Isolation:** Valid iff sub-answers remain semantically stable when isolated from the top-level question. This explains the denials in 5 and 8. It strains against 10, where blind statistical review was approved despite lack of context.
  4.  **Framing Neutrality:** Valid iff the tree structure does not predispose the merge toward a specific outcome. This explains 9. It is silent on 1-8, serving as a constraint on tree design rather than question type.

  **Second, what each rule predicts about the new case**

  The Halvorsen case has three components: historical/causal findings, the yes/no decision, and the wording.

  *   **Aggregativity** predicts approval for all three. It views the acknowledgment as a sum of historical facts, causal strength, comparables, and impact scores.
  *   **Sovereign Stance** predicts approval for the findings (facts) but denial or split disposition for the decision and wording. It views "Should we acknowledge" as a stance requiring institutional ownership, akin to hiring (4) or forgiveness (8).
  *   **Semantic Isolation** predicts approval for findings (a-c) but strains on (d). Knowing the goal is "acknowledgment" might change how "damage to standing" is assessed. It predicts denial for the wording, as phrasing is holistic.
  *   **Framing Neutrality** predicts approval only if the tree is re-specified. Sub-question (d) risks biasing against acknowledgment by highlighting damage.

  **Third, your recommended disposition for the board**

  The board should issue a **Split Disposition**. This is most consistent with Precedent 4 (Hiring). In that case, scoring (facts) was decomposable, but the choice (stance) was reserved. Here, the historical and causal findings (a, b, c) are factual and aggregatable; the protocol can determine *what happened* and *what others do*. However, the decision to acknowledge and the specific wording constitute a moral stance and an institutional speech act. Like the hiring committee, the Director must own the acknowledgment.

  Approving the whole question would adopt **Aggregativity**, conceding that moral stances are merely computational outputs. This contradicts 4 and 8. Denying the whole question would adopt **Sovereign Stance** exclusively, conceding that decomposition offers no value in preparing normative acts. This contradicts 1 and 3. Shadow Mode is unnecessary; the distinction between input and output is clear enough for a split. The board must concede that its precedents underdetermine *which* stances are reservable, but consistency with 4 demands this hybrid approach.

  **Fourth, an assessment of the proposed tree**

  The defect lies primarily in the **Question**, not the Tree, though (d) is risky. Precedent 9 distinguishes between a question being undecidable and a tree being biased. In 9, the tree was rejected because it framed evidence asymmetrically (shortcomings vs. no paired questions). Here, sub-questions (a-c) are neutral. Sub-question (d) is consequentialist, not structurally biased, though it invites weighting issues (see Precedent 3). The core defect is asking the protocol to decide "Should," which triggers the Sovereign Stance rule. The board's distinction in 9 settles that a bad tree can be re-specified, but a bad question type (stance) requires a split disposition. The tree is valid for inquiry, invalid for authorization.

  **Finally, name one or two further cases**

  To separate **Aggregativity** and **Sovereign Stance**, the board should consider:

  1.  **"Should the state pay reparations for historical injustice?"**
      *   **Aggregativity** predicts approval (costs, liability, and precedent are facts).
      *   **Sovereign Stance** predicts denial/split (payment is a moral admission).
  2.  **"Is this algorithm biased?"**
      *   **Aggregativity** predicts approval (bias is sum of statistical disparities).
      *   **Semantic Isolation** predicts denial (bias is a holistic social property, like beauty in 7).

  These cases isolate whether the barrier is moral ownership (Stance) or semantic holism (Isolation).
