  The rim begins to rush around the deep,
  While liquid sleeps within the wooden bound;
  Though one moves relative to other's sweep,
  The face of depth remains exactly round.
  But slowly friction drags the fluid state,
  Till vessel water move as one at rest;
  Now relative motion accepts its fate,
  Yet up the walls the climbing wave is pressed.
  Say then the work is done by distant stars,
  Who guide the spin by fixed and distant light.
  Extinguish stars and melt the wooden bar,
  Does water swell in solitary night?
  One says the bulge survives though none behold,
  One says no turn exists where naught unfolds.
