          *   Implication: There *is* a metric, but it cannot be spoken as a hierarchy of *moral worth*, only as a metric of *resource need* or *scope of loss*.
          *   Hypothesis: The taboo isn't against *counting*, it's against *valuing lives differently*. The formula treats every life as equal unit value ($1 = 1 life), whereas ranking Event A > Event B implies the *nature* of the suffering differs in quality, not just quantity.

      *   *Phenomenon B: The Proximity Taboo.*
