answer: |-
  You have stumbled onto a functional hypocrisy that is doing heavy lifting for social stability. Your committee is not actually engaged in a philosophical inquiry into the nature of suffering; you are engaged in **conflict resolution via resource allocation.**

  The behavior you describe is not underdetermined. It is tightly constrained by two conflicting requirements: the bureaucratic need for a defensible algorithm (the money) and the political need to avoid zero-sum identity conflicts (the talk).

  Here is the reconstruction of the theory of comparative badness that makes your committee's practice rational, followed by an analysis of where your framing is tripping you up.

  ### 1. The Theory: Equal Unit Value with Categorical Incommensurability

  Your committee operates on a distinction between **extensive magnitude** (how much) and **intensive magnitude** (what kind).

  **The Money (Extensive):** The per-victim formula is not a ranking of *how bad the suffering was*; it is a commitment that *every unit of suffering counts equally*. By paying $X per name, you are asserting that a death in the Holocaust and a death in the 1940s massacre have identical moral weight. You are not comparing the *events*; you are summing the *units*. This allows you to allocate more money to the Holocaust programme without saying it was "worse" in quality—only that it was "larger" in scope. This resolves your first paradox. The anger at the equal split occurred because an equal split implies the *events* are equivalent in scope, which insults the larger group. The per-victim formula implies the *people* are equivalent in value, which honors everyone.

  **The Taboo (Intensive):** The prohibition on comparison applies only to *intensive* magnitude (the nature of the evil). When you compare a famine to a bar fight, you are comparing categories that do not compete. When you compare two genocides, you are forcing a judgment on which *kind* of hell was hotter.
  The taboo tracks **political threat**, not epistemic difficulty.
  *   **Distant Comparisons:** Safe. No group feels their specific grievance is being diminished by acknowledging a different *kind* of grievance elsewhere.
  *   **Proximate Comparisons:** Dangerous. If Event A and Event B both claim the title "The Genocide," ranking them creates a winner and a loser. The "loser" community feels their trauma is being downgraded from "Unique Evil" to "Standard Atrocity."

  **The Law vs. Money:** You noted criminal sentences scale per-perpetrator while memorials scale per-victim. This is not a contradiction in the theory of badness; it is a distinction in the **locus of moral accounting.**
  *   **Criminal Law:** Measures *Culpability*. Guilt is agent-relative. One murderer is not 100 times more guilty because he killed 100 people; his *will* to kill is the primary metric, though sentencing does scale. But the focus is on the *doer*.
  *   **Memorials:** Measure *Loss*. Grief is patient-relative. The community's claim is based on the void left behind.
  Your committee is in the business of acknowledging Loss, not assigning Culpability. Hence the arithmetic differs.

  ### 2. Evaluating the Ethical Frameworks

  Could other frameworks license this behavior?

  **A. Straightforward Aggregativism (Utilitarianism)**
  *   *Theory:* Maximize welfare/minimize suffering. Compare all things on a single scale.
  *   *Fit:* Explains the money. Fails the taboo. An aggregativist *should* compare the two genocides to ensure resources go where they alleviate the most intergenerational pain.
  *   *Change Required:* You would have to openly rank the projects. "The Holocaust education programme gets 60% because the psychological impact per survivor is calculated at X." This would cause the political explosion you are avoiding.

  **B. Strong Incommensurability**
  *   *Theory:* These values cannot be measured against each other.
  *   *Fit:* Explains the taboo. Fails the money. If they are truly incommensurable, a per-victim formula is nonsense (you can't add incomparable units). An equal split or lottery would be the only fair method.
  *   *Change Required:* You would have to abandon the formula. You would likely move to a rotational system or equal funding. The anger at the equal split suggests your stakeholders *do* believe there is a fact of the matter about scope, rejecting pure incommensurability.

  **C. Expressivism / Political Ritualism (The Actual Practice)**
  *   *Theory:* The allocation is a speech act. The money says "We count your dead." The taboo says "We will not adjudicate your status."
  *   *Fit:* Explains everything. The formula is a ritual of equality (every name = $X). The taboo is a non-aggression pact between identity groups.
  *   *Change Required:* None. This is what you are already doing. The "theory of badness" is a sham; the "theory of peacekeeping" is the reality.

  ### 3. Where Your Framing is Confused

  You ask: *"What is the obscenity charge tracking?"* and *"Is the practice underdetermined?"*

  Your confusion lies in assuming the committee is trying to **describe reality**. You are looking for a theory of *truth* regarding suffering. But your committee is operating a theory of *recognition*.

  1.  **The Epistemic Error:** You suggest that if the objection were epistemic (we can't know), near cases should be easier to compare. This is correct for *facts*, but incorrect for *status*. It is precisely *because* the cases are similar that the comparison is politically volatile. If I compare a murder to a car accident, no one cares. If I compare my brother's murder to your brother's murder and say mine was "more tragic," I have declared war. The obscenity charge tracks **social risk**, not **knowledge gaps**.
  2.  **The "Scale of Badness" Error:** You interpret the per-victim formula as a "commitment... which is a stronger commitment than just saying A was worse than B." It isn't. It is a weaker commitment. It says "A had more deaths," not "A was worse." You can have more deaths without having a "worse" moral event (e.g., a natural disaster vs. a massacre). By sticking to the arithmetic of bodies, you avoid the metaphysics of evil.
  3.  **The Underdetermination Error:** You ask if the practice is underdetermined. It is not. It is **over-constrained**. You are constrained by the city's budget rules (need a formula), the stakeholders' dignity (need no ranking of quality), and the public's sense of proportion (need the bigger tragedy to get more money). The "hypocrisy" is the only solution that satisfies all three constraints.

  ### 4. What Would You Have To Do Differently?

  If you wanted to align your practice with a consistent philosophical view, here is the cost:

  *   **To be Consistent Aggregativists:** You must hire historians and psychologists to weight the suffering. A slave trade plaque might get less money than the 1940s massacre if the calculation shows the current community impact of the latter is higher. You must be willing to tell the Holocaust group, "Statistically, your claim on our current resources is lower." **Result:** Political mutiny.
  *   **To be Consistent Incommensurabilists:** You must scrap the per-victim formula. You flip a coin or split the pot 25% each. You must tell the Holocaust group, "We are giving the obscure massacre the same amount, not because they are equal, but because we refuse to measure." **Result:** Accusations of moral blindness and wasting public funds.
  *   **To be Consistent Expressivists (Current Path):** You must stop pretending you aren't ranking things. You need to acknowledge that the formula is a **compromise technology**. It is not a truth claim; it is a treaty.

  ### Conclusion

  Your committee's practice makes sense only under a theory of **Administrative Aggregation within Political Incommensurability.**

  *   **Load-bearing:** The per-victim formula (allows differentiation without valuation) and the Proximity Taboo (prevents status competition).
  *   **Rhetorical Fluff:** The claim that you "aren't in the business of ranking." You are. You just ranked them by scope while refusing to rank them by quality.

  The obscenity charge tracks the threat of **displacement**. When two claims are similar, acknowledging one as "more significant" displaces the other from its unique moral category. When claims are distant, they occupy different niches.

  You are not confused about the logic; you are confused about the *purpose*. You think you are building a monument to Truth. You are actually building a fence between neighbors. The arithmetic is the wire; the taboo is the "Keep Out" sign. If you try to make the wire more "honest" (philosophically consistent), you will tear the fence down.
