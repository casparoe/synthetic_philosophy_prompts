      *   *Section 5: Where the User is Confused.* The user thinks the committee is trying to measure "Badness." They aren't. They are managing "Grievance Recognition." The formula isn't truth-tracking; it's conflict-avoidance.
      *   *Section 6: Practical Implications.* What changes if we adopt each view?
