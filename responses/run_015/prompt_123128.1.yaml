  # The Guilt-Shame Taxonomy Tree

  **Split 1 (Root): Are guilt and shame genuinely different emotional responses, or are they the same underlying social-pain feeling with different names?**
  *   **Branch A:** They are genuinely different.
  *   **Branch B:** They are the same underlying feeling.

  ---

  ## Branch A: They are genuinely different

  **Split 2: What defines the difference between them?**
  *   **Branch A1 (Audience):** The boundary is drawn by witness (Shame requires an audience; Guilt works in private).
  *   **Branch A2 (Target):** The boundary is drawn by focus (Shame targets the self/character; Guilt targets the specific act).

  ### Branch A1: The Audience Definition
  **Split 3: Can a culture deliberately redesign its institutions to make one emotion dominant, or is the emotional wiring fixed?**
  *   **Branch A1-i (Designable):** Culture can engineer institutions (schools, courts, rituals) to suppress one and amplify the other.
  *   **Branch A1-ii (Fixed):** Biology determines the capacity for these emotions; culture only relabels what is already wired.

  **Split 4 (Niche Framing): Can a person feel this emotion for violating a norm they do not personally accept? (Outsider Moral Pain)**
  *   **Leaf 1 (Designable + Yes):** **The Engineered Conformist**
      *   *Awkward Commitment:* You must accept that forcing public shame for rules nobody believes in is a valid tool for social order.
  *   **Leaf 2 (Designable + No):** **The Belief-Dependent Communitarian**
      *   *Awkward Commitment:* You must admit your moral system collapses if the community stops personally believing in the rule, even if the rule is useful.
  *   **Leaf 3 (Fixed + Yes):** **The Universal Shamer**
      *   *Awkward Commitment:* You must claim that a sociopath feels the same shame as a saint when watched, they are just better at hiding it.
  *   **Leaf 4 (Fixed + No):** **The Biological Exclusionist**
      *   *Awkward Commitment:* You must accept that some humans are morally exempt from certain norms simply because their wiring lacks the specific shame circuit.

  ### Branch A2: The Target Definition
  **Split 3: Which mode of evaluation produces the healthier moral life: focusing on repairing the specific act, or demanding transformation of the kind of person you are?**
  *   **Branch A2-i (Repair Act):** Health comes from fixing the specific wrong.
  *   **Branch A2-ii (Transform Self):** Health comes from becoming a different kind of person.

  *   **Leaf 5 (Repair Act):** **The Act-Focused Restorer**
      *   *Awkward Commitment:* You must value a murderer who fixes the damage over a saint who never killed but feels rotten about their character.
  *   **Leaf 6 (Transform Self):** **The Soul-Focused Reformer**
      *   *Awkward Commitment:* You must value a changed heart over a repaired harm, even if the victim remains uncompensated.

  ---

  ## Branch B: They are the same underlying feeling

  **Split 2: Is the distinction just an intensity scale (mild discomfort versus crushing exposure) or a linguistic artifact of modern Western psychology?**
  *   **Branch B1 (Intensity):** It is the same feeling, just different volumes.
  *   **Branch B2 (Linguistic):** It is a translation error that does not survive in other conceptual schemes.

  *   **Leaf 7 (Intensity):** **The Pain Quantifier**
      *   *Awkward Commitment:* You must claim the feeling of stepping on a toe is the same moral kind as betraying a spouse, only louder.
  *   **Leaf 8 (Linguistic):** **The Translation Error Theorist**
      *   *Awkward Commitment:* You must claim centuries of moral theology are just confusion over vocabulary rather than deep human experience.

  ---

  ## Appendix: Unoccupied Logical Combinations

  The following combinations of answers are logically possible but remain unoccupied in this taxonomy.

  | Unoccupied Combination | Diagnosis |
  | :--- | :--- |
  | **Branch A1 (Audience) + Split 4 (Outsider Pain) omitted** | **Pruned for Count:** This path was fully expanded to generate the necessary leaf density for the "Audience" view, as public norms most directly raise the question of outsider enforcement. |
  | **Branch A2 (Target) + Split 4 (Outsider Pain)** | **Unattractive/Redundant:** If the emotion is about *Self vs. Act*, whether you accept the norm is less relevant than *what* you are judging. Adding this split creates nuance without changing the moral outcome. |
  | **Branch B (Same Feeling) + Split 4 (Outsider Pain)** | **Incoherent:** If guilt and shame are the same feeling (Split 1), distinguishing whether the norm is "outsider" or "internal" collapses into the Intensity split (Split 2). You cannot have it both ways. |
  | **Branch A1-i (Designable) + Branch A1-ii (Fixed) combined** | **Incoherent:** A culture cannot simultaneously have total design power over an emotion and have that emotion be biologically fixed. These are mutually exclusive. |
  | **Branch B1 (Intensity) + Branch B2 (Linguistic) combined** | **Incoherent:** The distinction cannot be both a real difference in volume (Intensity) and a non-existent difference in translation (Linguistic). |
