answer: |-
  This is a profound impasse, and it stems from a collision between **act-consequentialist moral arithmetic** and **non-linear systems dynamics**. You are trying to apply a linear moral calculus (marginal cost imposed by agent $i$) to a system that behaves non-linearly (thresholds, regime shifts) and to a social institution (markets) that functions through general equilibrium effects rather than isolated causal chains.

  You ask which step to reject. I will analyze the three candidates you proposed, detailing the commitments and costs of each, before recommending the path that best preserves your intuitions about lakes, markets, and morality.

  ---

  ### 1. Reject (1): The Internalisation Principle is Incomplete (Rights & Entitlements)

  **The Move:** You reject the idea that "imposing a cost" is inherently wrongful. Instead, you argue that imposing a cost is only wrongful if it violates a prior **entitlement** or **right**. Under this view, the herder wrongs the others not because he damages the grass, but because he uses *their* grass (or the collective's grass) without permission. The grain buyer does not wrong other buyers because he has a right to bid, and they have no right to a specific price.

  **What this saves:**
  It cleanly separates the herder from the grain buyer. The herder trespasses on a collective entitlement; the buyer exercises a private entitlement. It resolves the "pecuniary vs. real" arithmetic by declaring it irrelevant; the moral question is juridical, not physical.

  **What this costs (The Commitments):**
  *   **The Commons Argument Loses Independent Force:** As you feared, this makes the Tragedy of the Commons a consequence of property theory, not a driver of it. Hardin's argument becomes: "Open access is bad because it violates the property rights we *should* have." An advocate of open access can simply deny the rights exist. The moral "engine" is no longer the destruction of value, but the violation of a convention.
  *   **Markets:** You commit to the view that markets are morally neutral mechanisms for exchanging rights. Inefficiency or destruction is only wrong if it violates a specific contract or property title.
  *   **Promising:** A promise is binding not because breaking it causes harm (which might be negligible in a single case), but because it violates the right of the promisee to expect performance.
  *   **Collective Obligation:** We owe each other only respect for defined boundaries. There is no duty to preserve the *value* of the commons, only to respect the *rules* of the commons.

  **Verdict:** This is the standard legal-economic solution (Coasean). It is elegant but likely unsatisfying to you because it evacuates the moral core you are seeking. It tells you *that* overgrazing is wrong, but not *why* it is worse than high grain prices, other than "we decided it is."

  ---

  ### 2. Reject the Step from (2) to (3): Defend the Pecuniary/Real Distinction

  **The Move:** You maintain (1) but argue that (3) is an equivocation. You insist that price effects (pecuniary externalities) are fundamentally different from resource depletion (real externalities), despite your arithmetic in (5).

  **The Argument:**
  Your arithmetic in (5) treats the pasture as a static pie. But the moral distinction lies in the **Production Possibility Frontier (PPF)**.
  *   **Grain Market:** When you buy grain, you raise the price. This signals producers to grow *more* grain. The total value available in the system can increase. The "cost" to other buyers is a transfer of surplus, but the system's capacity to satisfy wants is not inherently degraded; it is allocated.
  *   **Commons:** When you graze a sheep, you reduce the regenerative capacity of the pasture. The total value available *decreases*.
  *   **The Arithmetic Fix:** You argue your single sheep is "mostly transfer." This is true *physically* in the short term. But *functionally*, your act participates in a mechanism that shrinks the PPF. The grain buyer participates in a mechanism that expands (or optimally allocates) the PPF.

  **What this costs (The Commitments):**
  *   **Teleological Economics:** You commit to the view that "maximizing total value" or "preserving productive capacity" has independent moral weight. You are smuggling a form of Rule-Utilitarianism into the Internalisation Principle.
  *   **Markets:** Markets are morally privileged not just because they are free, but because they are *generative*. You must accept that an efficient market is morally superior to an inefficient one, even if the individual acts look similar.
  *   **Promising:** Promise-keeping is valuable because it sustains the institution of trust, which lowers transaction costs (increases the PPF of social cooperation).
  *   **Collective Obligation:** We have a duty not just to avoid harming specific others, but to avoid participating in practices that degrade the collective capacity to generate value.

  **Verdict:** This is stronger than Option 1. It addresses the "why" better. However, it struggles with your shallow lake example (6). If the lake is below the threshold, does a single unit of loading degrade the PPF? Technically, no. If the moral wrong depends on the *actual* destruction of value, you are still vulnerable to the "inefficacy objection" in the sub-threshold state.

  ---

  ### 3. Reject the Act-by-Act Structure: A Holistic/Rule-Based Reading

  **The Move:** You reject the assumption that the moral principle must apply to **individual acts** in isolation. You shift from Act-Consequentialism to **Rule-Consequentialism** or **Contractualism**. The question is not "Did *this* sheep flip the lake?" but "Is the *practice* of unrestricted grazing sustainable?"

  **The Argument:**
  *   **Addressing (5) & (6):** In non-linear systems (lakes, pastures), the moral status of a marginal act is indeed indeterminate. However, the moral status of the *rule* governing the act is determinate. A rule permitting unrestricted loading leads to catastrophe; a rule permitting market bidding leads to allocation.
  *   **Addressing (3):** The grain buyer is not acting wrongly because the *practice* of competitive bidding is generalizable without self-destruction. If everyone bids, prices adjust, but the system persists. If everyone grazes freely, the system collapses. The wrongness lies in participating in a **self-defeating practice**.
  *   **Addressing the Threshold:** You no longer need to calculate if *your* liter of phosphorus caused the flip. You know that a *policy* of adding phosphorus causes the flip. Your obligation is to adhere to the sustainable rule, regardless of your marginal causal impact in a specific moment.

  **What this costs (The Commitments):**
  *   **Moral Complicity:** You must accept that you can be morally culpable for an act that causes no measurable harm in isolation, because it violates a necessary rule. This contradicts the intuition that "no harm, no foul."
  *   **Markets:** Markets are justified as **institutions**, not as aggregations of innocent transactions. You support the market because the *rules* of the market are sustainable, not because every transaction is harmless.
  *   **Promising:** This aligns perfectly with promising. Breaking a promise is wrong even if the specific breach causes no detectable harm, because it undermines the practice of promising.
  *   **Collective Obligation:** This imposes the heaviest demand on the agent. You are responsible for the *systemic effects* of your participation, not just the *causal effects* of your output. You owe it to others to act only on maxims that can be universally sustained.

  **Verdict:** This is the most robust solution for a systems thinker. It matches your limnological intuition: you manage the lake by controlling the *load regime*, not by policing individual molecules.

  ---

  ### Recommendation: Reject the Act-by-Act Structure (Option 3)

  I recommend you reject the act-by-act structure. Here is why this does the least damage to your position:

  1.  **It Solves the Threshold Problem (6):** Your shallow lake work demonstrates that marginal analysis fails at regime shifts. A moral theory that relies on marginal cost attribution will always be "unstable" in the cases you care about most. A rule-based theory tracks the *regime*, not the margin. It allows you to condemn the loading even when the lake is clear, because the *practice* of loading is what threatens the regime.
  2.  **It Preserves the Market/Commons Distinction:** It explains why buying grain is innocent. The *practice* of competitive buying is mutually beneficial (or at least mutually sustainable) in a way that open-access grazing is not. You don't need to rely on a prior property regime (Option 1) or fuzzy arithmetic about "real" costs (Option 2). You rely on the **generalizability** of the practice.
  3.  **It Retains Moral Force:** Unlike Option 1, this does not reduce the argument to "you broke a rule." It says "you participated in a practice that destroys the conditions of our shared flourishing." This keeps the moral core independent of specific legal titles.

  **The Cost You Must Pay:**
  You must accept that **individual causal inefficacy is not a moral defense.**
  In the sub-threshold lake, your nutrient load does nothing. In the market, your grain purchase does nothing (measurably). Yet, in the lake, you are doing wrong; in the market, you are not.
  The difference is not in the *physics* of your act, but in the **logic of the practice** you are sustaining.
  *   **Commitment:** You owe it to your colleagues to follow rules that sustain the system, even when your individual deviation would go undetected and cause no immediate harm.
  *   **Commitment:** You must view property rights not as the *source* of the morality, but as the *tool* we use to enforce the sustainable rules. We privatize or regulate the commons not because ownership is sacred, but because it is the only mechanism that aligns individual rules with systemic sustainability.

  **Conclusion:**
  Your stuckness comes from trying to find a linear moral derivative ($\frac{dWrong}{dAct}$) in a non-linear system. Stop looking for the derivative. Look at the integral. The wrongness is not in the marginal sheep; it is in the subscription to a practice that, if subscribed to by all, guarantees collapse. This allows you to keep the innocence of the grain buyer (whose practice is sustainable) and the wrongness of the herder (whose practice is self-defeating), without relying on property conventions or failing at the threshold.
