answer: |-
  There is no single canonical proper noun for this specific standoff (like "Gresham's Law"), but in famine studies and political philosophy, this fault line is best named **The Intentionality Fallacy**. It is a specific manifestation of the broader **Structure vs. Agency** problem.

  Here is the committed answer: **The "no intent, so not political" move is a fundamental misreading of Sen.**

  ### Why it is a Misreading
  Sen's entitlement approach is explicitly **institutional**, not **psychological**. When Sen labels a famine "political," he is not making a claim about the *mens rea* (guilty mind) of the rulers; he is making a claim about the *mechanics of distribution*.

  For Sen, a famine is "political" if the starvation results from the operation of political and economic institutions (laws, property rights, wage regulations, procurement policies) rather than an exogenous shock to the food supply.
  *   **Bengal (1943):** The "political" element was the prioritization of wartime inflation control and urban supply over rural purchasing power.
  *   **Ireland (1840s):** The "political" element was the adherence to laissez-faire ideology that prevented state intervention in grain exports.
  *   **Great Leap Forward:** The "political" element was the incentive structure that rewarded false reporting and procurement over actual yield.

  In all three cases, the *architecture* of the state determined who ate and who starved. Sen's argument in *Development as Freedom* reinforces this: famines do not occur in functioning democracies not because democratic leaders are morally superior (intent), but because the *structural incentives* (elections, free press) force them to respond to entitlement failures. If intent were required for a famine to be "political," Sen's entire democracy thesis would collapse.

  ### Carving Out the Distinction
  To resolve the snag in your seminar, you need to separate **Culpability** from **Causation**.

  1.  **The Student Objection (Culpability):** They are arguing from a legalistic framework. They believe "political famine" implies a crime (genocide/malice). Since they cannot find a "smoking gun" order to starve people, they retreat to calling it a "disaster."
  2.  **The Sen Framework (Causation):** Sen argues from a socio-economic framework. "Political" describes the *causal pathway*. If the pathway runs through policy choices (taxation, wage setting, trade rules), it is political.

  The specific term you should introduce to name this standoff is **The Intentionality Fallacy**. This identifies the error of conflating *political causation* with *conspiratorial intent*.

  ### Where it Fits in Entitlement Theory
  This fault line does not map onto Sen's distinction between **Direct Entitlement Failure** (you grow food but lose it) and **Trade Entitlement Failure** (you have money but can't buy food). Both can happen with or without intent.

  Instead, this fault line sits above the entitlement mapping, in the realm of **Political Economy**.
  *   **Side A (Your reading):** Correctly identifies that entitlement mappings are constructed by political authority.
  *   **Side B (The objection):** Incorrectly assumes that "political" requires a *volition to harm* rather than a *volition to prioritize other goals* (e.g., war, ideology, industrialization) where starvation is a foreseen but accepted byproduct.

  ### Recommendation for the Seminar
  Stop debating "intent." Adopt the terminology of **Structural Violence** (Johan Galtung/Paul Farmer) to bridge the gap. This term precisely captures Side C's argument: harm inflicted by social structures without a specific individual actor needing to pull the trigger.

  Tell your students: **"Sen is not accusing these regimes of murder; he is accusing them of negligence embedded in policy. In entitlement theory, 'political' means 'allocated by power,' not 'allocated by malice.' To require intent is to commit the Intentionality Fallacy."**
