answer: |-
  Here's the case setup and the breakdown you need for the seminar.

  **The Case**
  Dr. Aris, motivated by intense professional jealousy, injects a colleague with a dose of potassium chloride he believes is instantly lethal. He is caught on camera and confessed, but the colleague suffers zero physical harm because, unknown to modern science, the hospital's ventilation system emits a rare airborne enzyme that neutralizes the toxin before it enters the bloodstream. This biochemical variable is undetectable, ubiquitous in this specific ward, and completely unanticipatable by any actor. Aris is charged with attempted murder, but the physical outcome is indistinguishable from a benign saline injection.

  **The Theory Split**
  **Retributivism** comes in hot for a harsh sentence. Since retributivism tracks moral desert based on *culpability* and *intent* rather than luck-based outcomes, Aris is just as wicked as a successful murderer. He chose to kill, he enacted the plan, and the only reason anyone is alive is blind luck. To treat him leniently would be to punish luck rather than guilt, so he deserves the full penalty for murder.

  **Consequentialism**, however, argues for leniency or dismissal. Actual harm is zero. More importantly, because the neutralizing enzyme is hidden and unanticipatable, punishing Aris yields no general deterrence benefit. Potential offenders can't factor the enzyme into their risk calculus (since they don't know it exists), but the state *does* know that this specific act in this specific context is objectively harmless. Punishing Aris incurs the high cost of imprisonment without preventing any future physical harm (since the enzyme already prevents it in this ward). It's a net utility loss.

  **The Engine & The Collapse**
  The exact feature doing the work here is the **objective impossibility of harm due to a hidden variable**. This drives a wedge between *moral guilt* (which remains high) and *social danger* (which drops to zero). If you drop the biochemical twist, the case collapses back into a standard attempted murder scenario. Without the enzyme, the act is physically dangerous, and the consequentialist would immediately switch to supporting punishment to deter future attempts that *would* succeed. The twist forces the consequentialist to admit that punishing a physically harmless act is wasteful, even if the intent was bad.

  **The Consequentialist Counter-Attack**
  A savvy consequentialist defender would attack the leniency argument by pointing to **expressive and signaling costs**. Even if *this* act was harmless, letting Aris go sends a signal that the legal system doesn't take lethal intent seriously. This could erode the normative barrier against violence, leading to more attempts in contexts where the "enzyme" isn't present. The cost of weakened social norms outweighs the cost of punishing one lucky doctor, so you punish him anyway to maintain the deterrent signal.
