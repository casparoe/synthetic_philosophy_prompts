answer: |-
  Here is a committed diagnosis of the stalemate.

  ### The Diagnosis: Explanatory Target Divergence Masked as Empirical Dispute

  This disagreement is **not merely verbal**, nor is it a purely **substantive empirical dispute** about neural correlates. It is a **methodological and explanatory divergence** regarding what constitutes the *explanandum* (the thing to be explained).

  Both camps are using the label "consciousness" to track what are likely two distinct natural kinds: **Global Functional Availability** (GWT's target) and **Phenomenal Presence** (Block's target). The stall persists because GWT proponents treat the *functional consequences* of consciousness (report, control, integration) as its *definition*, while Phenomenal advocates treat those consequences as contingent *effects* that can be dissociated from the experience itself.

  The impasse is driven by a hidden methodological constraint: **the reliance on report as the operational gold standard.** GWT accepts this constraint as necessary for a science of consciousness; Phenomenalists argue this constraint systematically excludes the very phenomenon they wish to study. Until the field treats "Access" and "Phenomenality" as distinct variables requiring distinct operationalizations, the debate will remain a recursive loop of definition-swapping.

  ---

  ### Engaging the Positions

  **1. The GWT Position: Operationalist Functionalism**
  Proponents like Stanislas Dehaene and Bernard Baars are not simply "ignoring" phenomenology; they are making a reductionist claim that phenomenology *just is* global availability. For Dehaene, a state that cannot be reported, reasoned over, or broadcast to downstream systems is, for all scientific intents and purposes, unconscious.
  *   **The Move:** When faced with putative cases of phenomenal consciousness without access (e.g., iconic memory overflow), GWT proponents redescribe them as "unconscious sensory buffers" or "partial access."
  *   **The Strength:** This provides a clean, third-person operational definition. It aligns consciousness with a specific computational architecture (the workspace) and specific neural signatures (fronto-parietal ignition).
  *   **The Weakness:** It risks explaining away the target. If a subject feels a flash but cannot report it due to a bottleneck, GWT says "there was no experience." To the phenomenalist, this is a category error: it conflates the *having* of an experience with the *using* of that experience.

  **2. The Phenomenal Position: Ontological Distinction**
  Defenders like Ned Block and Victor Lamme argue that the "what-it-is-likeness" is a property distinct from cognitive utility. Block's Access/Phenomenal (A/P) distinction is the core weapon here.
  *   **The Move:** They utilize "overflow" experiments (e.g., partial report iconic memory tasks) to show that subjects can experience more than they can report. They also point to neural data suggesting posterior cortical "hot zones" can sustain rich activity without frontal ignition.
  *   **The Strength:** It preserves the intuition that consciousness is a mode of presence, not just a mode of processing. It accounts for the "richness" of experience that seems to exceed the narrow bandwidth of working memory.
  *   **The Weakness:** It relies heavily on introspection and inference. If a subject cannot report it, how do we verify it exists? This leaves them vulnerable to the charge that "phenomenal consciousness without access" is a philosophical zombie concept—a posit without empirical traction.

  ### Is the 'Phenomenal Presence' vs. 'Accessibility' Distinction an Intuition Pump?

  You asked if distinguishing 'phenomenal presence' from 'accessibility-to-self-modeling' changes the diagnosis or is merely another intuition pump.

  **It is not merely an intuition pump, but it is currently empirically underdetermined.**

  If the distinction were *only* conceptual, Block would be right that it's an intuition pump. However, the distinction gains traction when mapped onto **dissociable neural substrates**.
  *   If "Phenomenal Presence" correlates with recurrent processing in posterior sensory cortices (as Lamme's Recurrent Processing Theory suggests).
  *   And if "Accessibility" correlates with fronto-parietal ignition (as GWT suggests).
  *   Then the distinction is **empirical**, not just verbal.

  The problem is that GWT proponents often deny the first correlation, arguing that posterior activity without frontal ignition is "unconscious processing." Thus, the distinction only changes the diagnosis if we can find a **third-person marker of presence that does not rely on access.** Currently, we do not have a consensus on what that marker is. Without it, the Phenomenalist's claim remains a "theoretical posit" and the GWT proponent's claim remains a "methodological stipulation."

  ### What Counts as Progress?

  Given this diagnosis, progress will **not** come from one side defeating the other. It will not come from a "knockout" experiment that proves GWT wrong or Block right, because both sides can absorb new data by adjusting their definitions of "access" or "phenomenology."

  Progress requires **conceptual fragmentation and methodological diversification.**

  **1. Dissolve the Monolith**
  The field must stop searching for *the* Neural Correlates of Consciousness (NCC). There is no single NCC. There are NCCs for **Phenomenal Experience** (likely posterior) and NCCs for **Cognitive Access/Report** (likely anterior). Progress looks like the field adopting a taxonomy similar to memory research (episodic vs. semantic vs. procedural). We need to speak of "P-consciousness" and "A-consciousness" as distinct variables in experimental design, not as rival theories of the same variable.

  **2. No-Report Paradigms**
  The methodological bottleneck is report. Progress requires the validation of **no-report paradigms** (e.g., using pupil dilation, smooth pursuit eye movements, or neural decoding to infer experience without requiring a button press).
  *   If GWT proponents accept no-report markers as valid indicators of consciousness, the stall breaks.
  *   If they insist report is constitutive of consciousness, they must admit they are studying *access*, not *experience*.
  *   Honest progress requires GWT theorists to explicitly state: "We are studying the mechanisms of *reportable* consciousness."

  **3. The "Zombie" Test**
  We need a rigorous account of what would count as evidence for Phenomenal Consciousness *in the absence* of Access. Currently, Block argues that overflow is the evidence. GWT argues overflow is an artifact. Progress would be a consensus on a behavioral or neural signature that is **causally inert** regarding report but **correlates with subjective confidence**. If we can find a neural signature that tracks subjective rating even when the subject is prevented from reporting (e.g., under masking conditions where performance is at chance but confidence varies), the distinction moves from intuition to data.

  ### Summary

  The disagreement is a **substantive clash over the boundaries of the explanandum**, calcified by a **methodological reliance on report**.

  *   **GWT** is studying the architecture of **conscious control**.
  *   **Phenomenalists** are studying the architecture of **conscious presence**.

  The stall exists because both claim the word "consciousness." Progress requires admitting that "consciousness" is a folk-psychological umbrella term covering at least two distinct biological processes. If the field splits the concept, the dispute dissolves into two parallel research programs. If it refuses to split the concept, the stalemate will continue indefinitely, fueled by the same intuition pumps and redescription strategies we have seen for thirty years.
