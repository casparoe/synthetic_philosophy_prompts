      This preserves Epistemic Democracy (Crowd > King) while accepting the Weather intuition (Expert > Crowd).
      This is the winner.

      *Structure of Response:*
      1. Introduction: Validate the argument (it's a strong version of the "competence" objection).
      2. Diagnosis 1: Statistical Independence (Common Causes).
      3. Diagnosis 2: The Comparison Class (Crowd vs. Expert).
      4. Diagnosis 3: Epistemic Architecture (Centralized vs. Distributed Knowledge) - **Recommended.**
      5. Implications for Democratic Theory.
      6. Conclusion.

      *Refining Diagnosis 3:* It's not just "interests." It's that political truth often *supervenes* on the very facts the voters possess. Weather truth does not supervene on voter beliefs.
