answer: |-
  Here is a specification for an "Account of Silence" tailored to your municipal archive context. It treats silence not as a philosophical problem but as a data integrity issue.

  ### Part 1: The Distinctions

  You need to handle all four of your distinctions. They are not optional extras; they are distinct failure modes of the database. If you treat a "chosen silence" like a "created-then-destroyed" record, you violate privacy. If you treat "present-but-distorted" like "never-created," you amplify harm.

  **The Missing Case:** **Disassociated Evidence.**
  *   **The Case:** The shoebox of unlabelled photographs.
  *   **Why it matters:** This is not "never-created" (the photo exists) and not "unfindable" (you have the box). It is *structurally severed*. The visual record exists, but the identifier (the name) is gone. This is distinct from the minutes, where the name might exist but the person is distorted. In the photos, the person is visually present but nominally absent. A spec that only handles text (minutes) fails the collection.

  **Verdict:** All four of yours are **Non-Negotiable**. The Missing Case (Disassociated Evidence) is **Non-Negotiable**.

  ---

  ### Part 2: The Specification (Requirements)

  Each requirement below includes the **Case** it addresses, the **Action** it demands, and its **Status** (Non-Negotiable vs. Camp Preference).

  **Req 1: Classify the Origin of the Gap**
  *   **Case:** The missing council minutes from 1943 vs. the lack of a birth record for a child born in a workhouse.
  *   **Action:** Every search result that indicates a gap (e.g., a date range with no minutes, or a name search with no hits) must carry a metadata tag indicating *why*: `DESTROYED` (fire/war), `NEVER_CREATED` (bureaucratic exclusion), or `UNFINDABLE` (bad cataloguing).
  *   **Status:** **Non-Negotiable.** (Without this, Priya's search box implies `NEVER_CREATED` is the same as `UNFINDABLE`, which is false.)

  **Req 2: Tag the Objectification**
  *   **Case:** The pauper burial ledger. The name is there, but the record describes a cost incurred by the town, not a life lived.
  *   **Action:** Records where the subject appears only as a cost, crime, or burden must carry a visible flag in the search result: `SUBJECT_AS_OBJECT`. The transcript cannot be cleaned up; the distortion must be preserved but labelled.
  *   **Status:** **Non-Negotiable.** (Prevents the search engine from presenting a removal order as a neutral biographical fact.)

  **Req 3: Weight the Abundance**
  *   **Case:** The 1921–1974 minutes. 80% of the text records the Mayor's speeches; 20% records public health decisions affecting the whole town.
  *   **Action:** The search index cannot treat every word as equal. Fields must be weighted so that `Action_Item` ranks higher than `Speech_Text`. If a name appears 500 times in speeches but once in a decision, the decision must surface first.
  *   **Status:** **Camp Preference (User).** (Priya will argue for raw chronological relevance. You are arguing for semantic relevance. If you don't do this, abundance functions as absence.)

  **Req 4: Honor the Redaction**
  *   **Case:** Council minutes discussing specific medical cases or "moral failings" of residents in 1950.
  *   **Action:** A protocol for `CHOSEN_SILENCE`. If a record reveals sensitive data about a living descendant or a group historically harmed by publicity, the digital object must be redacted or access-restricted, even if the physical paper is public. "Public by default" is rejected.
  *   **Status:** **Non-Negotiable.** (Ethical baseline. Prevents digitization from becoming harassment.)

  **Req 5: Expose the Search Vocabulary**
  *   **Case:** A user searches "Mental Health" but the minutes say "Lunatic" or "Idiot."
  *   **Action:** The search interface must display the *period terms* used in the index, not just modern tags. A "Search Help" modal must list the offensive terms used in the source material so users know what to query.
  *   **Status:** **Non-Negotiable.** (Addresses the "Silence of the Query." If the user doesn't know the slur, they find nothing.)

  **Req 6: Isolate Disassociated Evidence**
  *   **Case:** The shoebox of unlabelled photographs.
  *   **Action:** These items must be catalogued in a separate collection from the named records. They cannot be linked to a name via guesswork. They must be searchable by *visual content* (e.g., "street scene," "uniform") only, never by person.
  *   **Status:** **Non-Negotiable.** (Prevents the "sad speculative paragraphs" you fear. It stops volunteers from writing "Probably John Smith" in the metadata.)

  ---

  ### Part 3: The Conflicts

  You guessed the conflict was between "explain the mechanism" and "don't invent voices." That is actually solvable: you explain the *bureaucracy* that silenced them, not the *people* inside the silence.

  The real incompatibility is here:

  **Incompatible Pair:** **Req 3 (Weight the Abundance)** vs. **Priya's Goal (Frictionless Access)**.
  *   **The Conflict:** Priya wants the search box to work like Google: type a word, get every instance in chronological order. Req 3 demands the search box act like a curator: type a word, get the *significant* instances, ranked by administrative action.
  *   **Why they can't coexist:** You cannot have a "pure" chronological index *and* a weighted semantic index in the same view without confusing the user. If you weight the data, you are altering the "original order" of the search results. If you don't weight the data, the Mayor's speeches drown out the pauper's burial.
  *   **Resolution:** You must choose between *Completeness of Retrieval* (Priya) and *Relevance of Retrieval* (You). You cannot have both.

  ---

  ### Part 4: The Killer Requirement

  The single requirement that does the most work in ruling out the obvious candidate approaches is:

  **Req 1: Classify the Origin of the Gap.**

  Here is how it kills the standard approaches:
  *   **Kills "Preserve and Catalogue Everything":** If the gap is `CHOSEN_SILENCE` (Req 4), preserving and cataloguing it violates the requirement. You must sometimes *not* digitize.
  *   **Kills "Read the Sources Against the Grain":** This approach assumes there *is* a grain to read. If the classification is `NEVER_CREATED`, there is no grain. You cannot read against a document that doesn't exist. This stops volunteers from speculating on "hidden meanings" in empty space.
  *   **Kills "Plug the Holes with Oral Testimony":** Oral testimony creates *new* records. Req 1 demands you label the *old* void. Mixing new testimony into the old metadata without clear separation violates the `NEVER_CREATED` tag. It turns a historical archive into a community memory project (which is fine, but it's a different spec).
  *   **Kills "Stick to Original Order and Provenance":** If the `UNFINDABLE` records were originally misfiled by the town clerk in 1950, "original order" keeps them unfindable. Req 1 forces you to acknowledge the original order *caused* the silence, requiring you to break provenance to fix the catalog.

  ---

  ### Part 5: Defining "Cheating"

  You are right to be suspicious of requirements like "be reflexive" or "centre marginalised voices." In a spec, these are bugs, not features. They sound good but tell the volunteer nothing.

  **The Test for Cheating:**
  A requirement is cheating if it cannot be translated into a **Database Field** or a **UI Element**.

  *   **Cheating:** "Be sensitive to the power dynamics of the record."
      *   *Why:* A volunteer cannot click a button that says "Be Sensitive."
  *   **Compliant:** "Add a boolean field `OBJECTIFICATION_FLAG`. If true, display warning text X on the record view."
      *   *Why:* This tells the volunteer exactly when to click and what the system will do.

  *   **Cheating:** "Centre the voices of the marginalized."
      *   *Why:* In a 1921 council minute, the marginalized voice is not there. You cannot centre what is absent.
  *   **Compliant:** "If `SUBJECT_AS_OBJECT` is true, suppress this record from 'Featured' or 'Random' displays."
      *   *Why:* This prevents the algorithm from accidentally highlighting a pauper's burial as "Town History of the Day."

  *   **Cheating:** "Ensure the archive is representative."
      *   *Why:* Impossible for a municipal record set.
  *   **Compliant:** "Publish a 'Scope Note' on the homepage listing exactly which demographics are under-represented due to `NEVER_CREATED` status."
      *   *Why:* This manages user expectation without lying about the collection.

  **Summary for your Committee:**
  Adopt **Req 1 (Classify the Gap)** as your foundation. It forces you to admit when you don't know something. It stops Priya from thinking search is a magic wand, and it stops you from feeling you need to invent stories to fill the void. It turns silence from a failure of the archive into a documented feature of the history.
