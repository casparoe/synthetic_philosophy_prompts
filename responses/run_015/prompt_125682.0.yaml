      He did not panic. Panic required a future to jeopardize. Instead, Aris accessed the metadata of his own mind. He remembered a career in cosmology, specific papers on thermal fluctuations in de Sitter space, the taste of stale coffee in a department lounge. But he did not remember walking into this room. There was no temporal lead-in, only the sudden onset of *now*.

