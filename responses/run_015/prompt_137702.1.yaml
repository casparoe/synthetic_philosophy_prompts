answer: |-
  # Joint Statement on Conventional Obligations for Visitors

  ### I. Stipulated Background
  *This document operates under the following shared stipulations for all cases discussed herein. If a claim relies on dropping one of these conditions, it is explicitly marked as such.*

  1.  **Arbitrariness:** In all cases, the local convention is arbitrary in the coordination sense; the opposite practice would coordinate social life equally well (e.g., driving on the left vs. right).
  2.  **No Material Harm:** The visitor's deviation causes no physical damage, financial loss, or significant safety risk.
  3.  **No Signaling:** The visitor is not attempting to make a political statement or protest the local norm; they are acting out of habit or ignorance.
  4.  **Local Reaction:** The locals' negative reaction is real (confusion, mild offense, irritation) but small (not ruinous or dangerous).

  ---

  ### II. Agreed Claims
  *Both signatories affirm the following propositions.*

  1.  **Definition of Convention:** A convention is a regularity in behavior within a population, sustained by mutual expectation, where the primary reason for compliance is the expectation that others will comply.
  2.  **The Harm Principle:** If a violation of convention causes material harm (physical injury, significant financial loss), a moral obligation exists to cease the violation, regardless of local custom.
  3.  **Epistemic Limits:** A visitor cannot be obligated to follow a rule they could not reasonably have been expected to know *at the moment of action*. Ignorance mitigates blameworthiness.
  4.  **Prudential Reasons:** Visitors always have prudential reasons (avoiding trouble, smoothing interactions) to follow local conventions, even if no moral obligation exists.
  5.  **Non-Settlers:** The following facts do not, in themselves, settle whether a moral obligation exists:
      *   That the convention is encoded in local law (unless the law tracks harm).
      *   That the majority of locals feel annoyed by the deviation.
      *   That the visitor finds the local convention inconvenient.
  6.  **Easy Cases:**
      *   *Agreed Obligation:* Driving on the locally mandated side of the road (due to safety/harm).
      *   *Agreed Permission:* Wearing clothing styles common at home but rare locally (assuming no dress codes).

  ---

  ### III. Clarification of Terms (Verbal Dispute Resolution)
  *We identify a verbal confusion regarding the word "Obligation." It is currently conflating three distinct normative statuses:*

  1.  **Objective Duty:** What the agent ought to do given the facts of the situation.
  2.  **Subjective Blame:** Whether the agent is morally culpable for failing to do it.
  3.  **Enforceability:** Whether third parties are permitted to coerce or demand compliance.

  *Resolution:* We agree to separate **Objective Duty** from **Subjective Blame**.
  *   **Accommodationist** often argues: "You had a duty, so you are blameworthy."
  *   **Portabilist** often argues: "You aren't blameworthy (due to ignorance/habit), so you had no duty."

  *Restated Agreement:* We agree that a visitor can have an **Objective Duty** to comply even if they are not **Subjectively Blameworthy** (e.g., due to unavoidable ignorance). The remaining disagreement is not about blame, but about whether the **Objective Duty** exists in the first place when only arbitrary conventions and minor local offense are at stake.

  ---

  ### IV. Residual Disagreements Table
  *The following are substantive moral disagreements that remain after the verbal clarification above.*

  | Topic of Disagreement | Accommodationist Formulation (The Portabilist is wrong because...) | Portabilist Formulation (The Accommodationist is wrong because...) |
  | :--- | :--- | :--- |
  | **1. Source of Normativity** | ...they deny that participation in a cooperative scheme generates a freestanding duty of fair play, even when the scheme's specific rules are arbitrary. | ...they assert that mere regularity generates moral reasons, whereas only independent moral values (like welfare or autonomy) can generate duties. |
  | **2. Weight of Local Offense** | ...they treat the "sting" locals feel as a mere preference, whereas in a conventional context, that sting constitutes a recognizable social harm the visitor must avoid. | ...they treat offense taken at arbitrary rule-breaking as a valid moral claim, whereas visitors owe locals only neutrality, not affirmation of local meanings. |
  | **3. Scope of "Legibility"** | ...they assume a visitor may remain "legible" only to their home culture, whereas entering a space requires making oneself legible to the hosts to maintain social order. | ...they demand the visitor bear the full cost of coordination, whereas the burden of legibility should be shared or fall on the majority. |

  ---

  ### V. Cruxes and Concrete Cases
  *For each case, we identify the specific sub-question it turns on and state our predictions in advance. These predictions assume the Stipulated Background (Section I) holds.*

  #### Case 1: Counter-Tipping (Marlow Bend)
  *Context: In Marlow Bend, leaving cash is read as implying the server is begging. A visitor from a tipping culture leaves cash generously.*
  *   **Sub-Question:** Does the **local meaning** of an action (insult) override the **agent's intent** (kindness) to determine deontic status?
  *   **Accommodationist Prediction:** The visitor acts **wrongly**. By importing a foreign meaning, they inflict a dignitary harm (demeaning the server). The local meaning fixes the moral reality of the act.
  *   **Portabilist Prediction:** The visitor acts **permissibly**. The moral quality is determined by intent and material outcome. The server's offense is based on a local arbitrary code that does not bind the visitor.

  #### Case 2: Invisible Jaywalking
  *Context: In a city where everyone crosses on red when safe, a visitor waits at an empty intersection. Drivers slow down warily; traffic is slightly worse.*
  *   **Sub-Question:** Does making oneself **illegible** or causing mild coordination friction count as **setting others back**?
  *   **Accommodationist Prediction:** The visitor acts **wrongly**. They are failing a duty of easy coordination. By refusing to flow with the local pattern, they create a "friction cost" for the community that is morally significant.
  *   **Portabilist Prediction:** The visitor acts **permissibly**. "Slightly worse traffic" is not a harm sufficient to generate a duty. The visitor's comfort/safety preference trumps the arbitrary efficiency of the local flow.

  #### Case 3: The Queue of Objects
  *Context: At bus stops, people queue by placing bags down. A visitor unaware of this walks past the bags and boards first.*
  *   **Sub-Question:** Does an obligation require that the visitor **could reasonably have picked up** the convention, or does not knowing merely change what they are blameworthy for?
  *   **Accommodationist Prediction:** The visitor acts **wrongly** (Objective Duty violated). The duty exists because the system exists. Ignorance removes *blame*, but not the *wrongness* of the act (they should have learned/asked).
  *   **Portabilist Prediction:** The visitor acts **permissibly**. If the convention was not reasonably accessible, no duty existed *for this visitor at this time*. There is no "wrong" to be mitigated; the act was neutral.

  ---

  ### VI. Load-Bearing Cruxes (Abstracted)
  *Beyond the specific cases, we identify three general principles where our disagreement is fundamental.*

  1.  **The Meaning Constraint:**
      *   *Acc:* An action's moral status is partly fixed by the semantic content it holds for the recipient community.
      *   *Port:* An action's moral status is fixed by the agent's intent and material consequences; local semantics are secondary.
  2.  **The Friction Threshold:**
      *   *Acc:* Minor coordination costs (confusion, slight delay) imposed on a community by a non-compliant visitor are moral harms that generate obligations.
      *   *Port:* Minor coordination costs are the price of diversity; they only become moral harms if they cross a threshold of significant disruption.
  3.  **The Epistemic Condition of Duty:**
      *   *Acc:* Duties can exist objectively even if the agent is non-culpably ignorant of them (Ignorance excuses blame, not the duty).
      *   *Port:* Duties are relative to the agent's epistemic position (If you couldn't know, the duty didn't apply to you).

  ---
  *Signed,*
  *The Accommodationist & The Portabilist*
