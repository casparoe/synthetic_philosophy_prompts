  *   **If the Convenor is a Supervaluationist:** They will say **No** (or "Indeterminate"). The semantic indecision of the word "heap" last year is a fact about the language *then*. Programming the lamp *today* does not change the semantic facts of the past. The pile was indeterminate last year, and it remains indeterminate that it was a heap.
  *   **If the Convenor is a Contextualist:** They may say **Yes** (relative to the current experimental context). Since truth is relative to the context of *evaluation*, and we are now evaluating the past pile from within the context of the experiment (where 'heap' is defined as ≥4,500), the statement becomes true. The context of the experiment overrides the context of the past.

  This case isolates whether the "fact" is fixed by the language at the time of use (Supervaluationism) or by the context of the person judging the statement (Contextualism). Given their previous verdicts, I suspect they will side with the Supervaluationist: the lamp cannot rewrite the semantic history of the pile.
