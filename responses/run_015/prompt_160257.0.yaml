answer: |-
  This is a sophisticated framework. You are effectively trying to bridge normative political theory (what *is* corruption?) with political economy (why does it *persist*?) and international relations (who gets to *judge*?).

  It mostly hangs together, but you are right to be worried about the seams. The tension isn't just "noise"; it strikes at the mechanism of your argument.

  Here is the audit, ranked by severity.

  ### 1. The Agency/Structure Clash (Severity: Critical)
  **The Pair:** (1) & (3) **vs.** (6)
  **The Tension:** You identified this yourself. (1) and (3) are **deontological/normative**: they define a *wrong* (breach of duty, clientelism) that implies moral condemnation. (6) is **structural/functional**: it defines a *state of equilibrium* where individual character is irrelevant.
  If (6) is true—that the median official is rationally responding to incentives—then the "wrong" in (1) becomes structurally determined. If I condemn the official for (1), but explain them via (6), you risk a "blame the victim" dynamic or a performative contradiction. Why draw the moral line at gifts (2) or clientelism (3) if the equilibrium (6) dictates that partiality is the only rational survival strategy?

  **What has to give:** You must decouple **wrongness** from **culpability**.
  *   **The Fix:** Clarify that (1) and (3) define the *objective breach of duty*, while (6) explains the *prevalence and mitigation of blame*.
  *   **The Cost:** You lose the ability to use (1) as a simple tool for sanctioning individuals in high-corruption equilibria. You have to concede that in a (6)-type system, punishing the median official is unjust, even if their act fits definition (1).
  *   **Can (6) survive?** **Yes, but it becomes the dominant lens.** If you keep (6), (1) cannot be a simple accusation of moral failure. It must be rephrased as "the systemic distortion of the office," not just "the official's sin." (6) survives, but it eats the teeth out of (1) regarding individual punishment.

  ### 2. The Definitional Stretch (Severity: High)
  **The Pair:** (1) **vs.** (3)
  **The Tension:** You suspected this too. (1) defines corruption as public power converted to *private good*. In (3) (clientelism), the politician gains votes (political survival) and the voter gains resources (welfare).
  If the voter gains, and the politician gains the ability to govern (via election), where is the "public to private" conversion? In many moral economies, this *is* how public power is supposed to work (the leader provides for the clan). If you call this corruption under (1), you have to argue that "votes" count as a "private good" for the politician and that "impartiality" requires ignoring the voter's immediate needs. This risks smuggling in a specific liberal-democratic theory of representation into (1) which (4) explicitly warns against.

  **What has to give:** The definition of "Private Good" in (1).
  *   **The Fix:** You must specify that the "private good" in (1) includes **particularistic political advantage** over **universalistic rule**. The wrong isn't just taking cash; it's treating citizenship as a transaction.
  *   **The Cost:** You make (1) more abstract. It stops being about "pocketing money" and starts being about "violating the universal scope of public office." This makes (1) harder to operationalize but saves it from contradicting (4).
  *   **Can (6) survive?** **Yes.** (6) actually helps here. In a clientelist equilibrium, the return to *particularistic* administration (buying votes) exceeds the return to *universalistic* administration (policy platforms). (6) explains *why* (3) happens; (1) explains *why it's a breach of the modern state ideal*.

  ### 3. The Universalism Exception (Severity: Medium)
  **The Pair:** (4) **vs.** (5)
  **The Tension:** You didn't flag this, but it's a logical gap. (4) says Western standards aren't universal and conditionality is illegitimate. (5) says Kleptocracy *is* universally corrupt and sanctions *are* justified.
  Who decides the boundary between (4) (illegitimate imposition) and (5) (legitimate sanction)? If a Western lender calls a leader a kleptocrat to justify sanctions, isn't that just (4) in disguise? You risk a "No True Scotsman" fallacy: "Cultural differences are valid, unless I decide they are theft."

  **What has to give:** The criterion for "Universal."
  *   **The Fix:** Distinguish between **Administrative Norms** (variable, e.g., gifts, hiring practices) and **Proprietary Norms** (universal, e.g., state assets are not the ruler's personal bank account).
  *   **The Cost:** You have to defend why property rights of the state are cross-cultural while administrative etiquette is not. (Hint: Appeal to the distinction between *office* and *owner*).
  *   **Can (6) survive?** **Yes.** (6) applies easily to (5). In a kleptocracy, the return to stripping the state is massive for the ruler, while the return to impartial administration is zero (because the ruler owns the judiciary). (6) actually strengthens (5) by showing the systemic distortion.

  ---

  ### Summary of Recommendations

  **1. To save (6) (Your Priority):**
  You must position (6) as the **diagnostic** layer and (1)-(3) as the **normative** layer.
  *   *Current:* "Corruption is X. Also, the system causes X." (Contradictory on blame).
  *   *Revised:* "Corruption is objectively X (1). However, X persists because the equilibrium rewards it (6). Therefore, anti-corruption efforts targeting individuals (1) will fail unless they shift the equilibrium (6)."
  *   *Verdict:* (6) survives and becomes the "punchline" of the paper. It explains why the moral definitions in (1)-(3) are insufficient on their own.

  **2. To fix (1) vs (3):**
  Refine (1) to explicitly mention **particularism vs. universalism**.
  *   *Edit:* "The wrong of corruption is a breach of the impartiality that public office requires — the substitution of **particularistic obligations** for **universalistic duties**."
  *   *Why:* This captures clientelism (3) without needing to prove the voter was "harmed." The harm is to the *status of citizenship*.

  **3. To fix (4) vs (5):**
  Add a proviso to (4).
  *   *Edit:* "...impose one particular moral economy... **except where the core distinction between public office and private property is obliterated.**"
  *   *Why:* This creates the firewall that allows (5) to exist without violating (4).

  ### Final Verdict
  Your framework is viable, but currently, **(6) is a bomb under (1)-(3).**
  If you leave (1)-(3) as simple moral condemnations, (6) detonates them by showing they are structurally determined.
  If you reframe (1)-(3) as **definitions of institutional integrity** rather than **accusations of individual sin**, (6) becomes the powerful explanatory engine that saves the paper from being moralistic.

  **Keep (6).** It is the strongest theoretical contribution. Make the others serve it.
