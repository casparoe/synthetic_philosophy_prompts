      *   **Addressing the "Singular" Problem:** This is about reference classes. Hume assumes we classify "resurrection" under "death." A defender classifies it under "divine intervention." This is a weakness in Hume, but distinct from the "proofs too much" error.
      *   **Addressing the Bayesian Point:** Explain that Bayes separates the *Prior* (Law violation vs. Rare Event) from the *Likelihood of Falsehood*. For meteorites, the Prior is low but not zero (no law broken). For resurrections, the Prior is effectively zero (law broken). The testimony must overcome *that* specific gap.
