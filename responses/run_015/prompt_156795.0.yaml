      *   So, the break is indeed in how testimonial weight is calculated.
      *   Actually, looking closer at (4): "The same uniform experience... is what generates whatever push the testimony has." This is the false equivalence. The experience *for* testimony (people usually tell truth) is distinct from experience *against* the event (dead stay dead). They *can* come apart.
      *   However, the user's worry is that if the event is *improbable enough*, the testimony *always* loses.
      *   The solution is to distinguish **Hard Miracles** (Law Violations) from **Soft Miracles** (Improbable Events). Hume's argument is *only* meant for Hard Miracles. The user's reconstruction accidentally applies it to Soft Miracles because Step (2) treats "uniform experience" as a blanket against *any* unobserved event.
      *   So, the fix is to tighten **(2)**. Uniform experience against a *law* is different from uniform experience against a *rare event*.
      *   *Decision:* I will advise modifying **(3)** primarily, because it's the epistemological bottleneck. But I must also point out that **(4)** is the logical non-sequitur.
      *   *Actually, the strongest philosophical move:* Reject the inference in **(4)**. The experiences are *not* the same. But to make that stick, you need to adjust **(3)** to allow testimony to be evaluated on more than just "past track record of truth-telling."
      *   *Wait, one more thing:* The user wants to keep (1) and (5). (5) says "It's crazy to reject meteorites." So the argument must allow meteorites.
