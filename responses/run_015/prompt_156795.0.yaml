      *   **Pinpoint the Break:** Step (4) is the inference that fails, but Step (3) is the premise that makes (4) feel inevitable.
      *   **Recommendation:** Reject/Modify **(3)**.
      *   **Why (3)?** It conflates *general* reliability with *specific* credibility. We don't just trust testimony because "people usually tell the truth." We trust it based on *multiple concurrent witnesses*, *lack of motive to lie*, *expertise*, etc. Hume treats testimony as a monolithic block of "experience."
