      *   **Case Study:** Climate migration governance (EU carbon border adjustments affecting West Africa). Affected populations are outside the *epistemic framework* that defines "affectedness." They can't claim membership because the causal chain isn't visible/interpretable as a democratic grievance.
      *   **Proposed Solution/Pivot:** "Epistemic membership" condition. You belong if your exclusion can be contested within a shared practical framework. Borrowing from plural-subject theory (joint commitment needs shared normative space). Solving the boundary problem requires constructing that shared space first, not just extending the franchise.
      *   **Specific Questions:**
          1.  Is the shift from static membership to processual boundary-drawing doing real work, or just redescription?
          2.  Does the climate example hold up (empirical causation vs. normative standing)?
          3.  Where are contested premises being smuggled in (especially plural-subject/shared framework)?
      *   **Constraints:** Separate well-established theory from up-for-debate ideas. Don't present weird moves as consensus. Flag awkward phrasing (user wrote this at 2am).

  2.  **Deconstruct the Argument & Identify Theoretical Touchpoints:**
      *   *The Boundary Problem:* Classic literature includes Whelan (1983), Goodin (2007) on "All Affected Interests" (AAI), Cohen (2009) on "All Subjected to Coercion" (ASC).
      *   *Processual/Dynamic View:* This aligns with "constituent power" debates, Whelan's paradox (the demos must define itself), and more recent work by scholars like Arash Abizadeh (coercion requires justification to those coerced, but who are they?) or Sofia Näsström. The idea that the boundary is *political* rather than *pre-political* is a strong move.
      *   *Epistemic Framework:* This sounds like Fricker (epistemic injustice), but applied to boundary drawing. Also connects to Dryzek (discursive democracy) or Young (communication across difference).
      *   *Plural-Subject Theory:* Gilbert, Tuomela. Usually applied to collective intentionality. Applying it to *boundary drawing* is the "weird move" the user flagged.
      *   *Climate Example:* EU Carbon Border Adjustment Mechanism (CBAM). This is a concrete policy. The link to West African agriculture is empirically plausible (trade shifts, climate impacts). The normative leap is whether the *invisibility* of the causal chain negates standing.

  3.  **Drafting the Feedback - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the core intuition. It's a solid seminar paper topic. Validate the "2am prose" concern gently.

      *   **Question 1: Static vs. Processual (Is it just redescription?):**
          *   *Established:* Whelan's paradox is the baseline. Everyone knows the demos defines itself.
          *   *Debate:* Most solutions (AAI/ASC) try to *solve* the paradox externally. The user is saying the paradox *is* the solution (it's ongoing politics).
          *   *Critique:* It's not just redescription *if* it shifts the normative burden. If the standard view says "we must calculate affectedness correctly," the user says "we must build the arena where affectedness is claimed." That's a substantive shift from *measurement* to *construction*.
          *   *Risk:* Needs to avoid sounding like "democracy is just whatever happens." Needs a normative standard for *good* boundary drawing.

      *   **Question 2: The Climate Example (Causation vs. Standing):**
