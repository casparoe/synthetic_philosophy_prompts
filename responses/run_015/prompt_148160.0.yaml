          *   *Weakness:* The "epistemic invisibility" claim is tricky. Is it that they *can't* be heard, or that the EU *won't* listen?
          *   *Distinction:* Empirical causation (EU policy hurts West Africa) is distinct from Normative Standing (West Africa has a right to a vote/voice). The user is arguing the former blocks the latter via epistemic barriers.
          *   *Advice:* Be careful not to conflate "hard to trace" with "impossible to trace." The argument is stronger if it's about the *interpretive framework* (e.g., economic models don't count subsistence farming loss as "harm" in the same way).

      *   **Question 3: Smuggled Premises (Plural-Subject/Shared Framework):**
