answer: |-
  This is a strong, ambitious core argument. You are effectively trying to dissolve the "boundary problem" (Whelan's paradox) by reframing it from a *classification problem* (who fits the criteria?) to a *constitutive problem* (how is the criteria-making space constructed?).

  Here is a breakdown of your three specific questions, followed by a map of the theoretical landscape and some prose triage.

  ### 1. Static Membership vs. Processual Boundary-Drawing
  **Is this doing real work, or just redescription?**

  It is doing real work, *provided* you specify the normative stakes.
  *   **Established View:** The standard literature (Goodin, "All Affected Interests"; Cohen, "All Subjected to Coercion") treats the boundary as a **pre-political constraint**. We need to figure out the boundary *before* democracy can legitimately start. This leads to infinite regress (who decides the boundary?).
  *   **Your Move:** You are treating the boundary as an **internal political output**. This aligns with "constituent power" debates (e.g., Arash Abizadeh, Sofia Näsström).
  *   **The Risk:** If you just say "boundaries are negotiated," a critic will say, "Okay, but *how* should they be negotiated? By power? By violence?"
  *   **The Fix:** Your shift works if you argue that standard theories fail because they assume a "view from nowhere" to calculate affectedness. Your processual view works if you argue that **legitimacy comes from the contestability of the boundary, not its correctness.**
      *   *Verdict:* Not a redescription. It's a shift from *truth-conditions* (are they actually affected?) to *procedural-conditions* (can they effectively claim affectedness?).

  ### 2. The Climate Example (Causation vs. Standing)
  **Does it hold up, or are you mixing empirical and normative?**

  You are walking a tightrope here, but it's a productive one.
  *   **The Strength:** The EU Carbon Border Adjustment Mechanism (CBAM) is a great case for "coercion without membership." It creates economic coercion externally.
  *   **The Weakness:** You argue West African populations are outside the "epistemic framework." You need to be careful not to conflate **causal opacity** (it's hard to trace the harm) with **normative exclusion** (their harm doesn't count).
      *   *Critique:* A realist might say, "The causal chain *is* visible to economists; the West Africans just lack power."
      *   *Your Counter:* You need to argue that the *category* of "economic harm" used by the EU excludes subsistence impacts or non-market values. It's not that the data is missing; it's that the **metric of grievance** is incompatible.
  *   **Advice:** Be precise. Don't say the causal chain isn't visible. Say the *interpretive framework* for validating that causation as a *political claim* is missing. This keeps you in normative territory rather than getting bogged down in empirical supply-chain tracing.

  ### 3. Smuggled Premises (Plural-Subject / Shared Framework)
  **Where are you assuming too much?**

  This is the most vulnerable part of the essay.
  *   **The Problem:** Plural-subject theory (Margaret Gilbert, Raimo Tuomela) generally explains how a group *already formed* acts as a unit (joint commitment). You are using it to explain how the group *forms* in the first place.
      *   *Circularity:* If "epistemic membership" requires a "shared practical framework" to contest exclusion, how do the excluded enter the framework if they don't already share it? This recreates Whelan's paradox in epistemic clothing.
  *   **The Debate:** Among democratic theorists, the idea that we need a "shared normative space" is heavily contested.
      *   *Consensus:* Communication is necessary.
      *   *Contested:* Whether that communication requires *shared* norms or merely *translatable* differences (e.g., James Tully, Iris Marion Young).
      *   *Your Risk:* You are smuggling in a **consensus requirement** (shared framework) that agonistic democrats (Chantal Mouffe) would reject. They would argue the boundary is drawn through conflict, not shared commitment.
  *   **Advice:** Don't present the "shared framework" as a solution. Present it as the **site of struggle**. Acknowledge that requiring a shared framework might itself be an exclusionary move. This shows you understand the severity of the premise.

  ---

  ### Theory Map: Established vs. Contested
  *Use this to calibrate your citations and claims.*

  | Concept | Well-Established / Consensus | Up for Debate / Your Intervention |
  | :--- | :--- | :--- |
  | **The Boundary Problem** | Frederick Whelan (1983) established that the demos cannot define itself democratically without circularity. | Whether this paradox is a bug (to be solved by AAI/ASC) or a feature (to be managed politically). |
  | **AAI vs. ASC** | Goodin (2007) and Cohen (2009) are the standard bearers. Both treat boundaries as pre-political constraints. | Your claim that both treat the demos as a "container." (This is a strong critique, but some ASC proponents argue coercion *creates* the boundary dynamically). |
  | **Epistemic Barriers** | Fricker (Epistemic Injustice) is standard in social epistemology. | Applying epistemic injustice to *boundary drawing* specifically is novel. |
  | **Plural-Subject Theory** | Gilbert/Tuomela are standard for collective intentionality. | Applying this to *demos constitution* is your "weird move." It is not standard in democratic theory. |
  | **Climate/Border** | It is established that EU policy has extraterritorial effects. | Whether this creates a *demand for membership* vs. a *demand for compensation* is debated. |

  ---

  ### Prose & Phrasing Triage
  *You asked for help with the "2am prose." Here are specific tweaks to make it sound more seminar-ready.*

  1.  **Original:** "...treat the demos as a pre-existing container we just fill correctly..."
      *   **Fix:** "...treat the demos as a fixed vessel awaiting the correct population..." (Sounds less colloquial).
  2.  **Original:** "...outside the epistemic framework that even defines what counts as being affected."
      *   **Fix:** "...excluded from the epistemic framework that determines the intelligibility of 'affectedness'." (More precise; it's about whether the harm makes sense to the decider).
  3.  **Original:** "Epistemic membership condition"
      *   **Fix:** "An epistemic condition for membership." ("Epistemic membership" sounds like a type of membership, rather than a condition for it).
  4.  **Original:** "...whose claims to belong actually get heard in that process?"
      *   **Fix:** "...whose claims to membership are rendered intelligible within that process?" (Fits your epistemic argument better than "heard").
  5.  **Original:** "I'm borrowing loosely from plural-subject theory here..."
      *   **Fix:** "Drawing on the logic of plural-subject theory..." (Don't apologize for "loosely" borrowing; own the adaptation).

  ### Final Strategic Advice
  Your strongest move is the pivot from **measurement** (are they affected?) to **intelligibility** (can their affectedness be understood as a claim?).

  If you lean into that, you avoid the trap of having to prove exactly *how* the EU hurts West Africa (empirical) and instead focus on why the EU's political language cannot process that harm as a *democratic claim* (normative/epistemic).

  Just be very careful with the "shared framework" solution. If you say "we need a shared framework to include them," a critic will ask, "Isn't imposing our framework on them the ultimate exclusion?" Acknowledge that tension, and you'll have a very strong paper.
