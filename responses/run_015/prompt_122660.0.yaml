  # MORAL RESPONSIBILITY: DIAGNOSTIC FLOWCHART
  **Instructions:** Answer **Yes** or **No** to each question based on your intuitive verdict on the specific case described. Do not worry about consistency yet; follow the arrows. If a question does not apply to your path, skip it.

  | **NODE** | **QUESTION (Verdict on Case)** | **IF YES** ↓ | **IF NO** ↓ |
  | :--- | :--- | :--- | :--- |
  | **Q1** | **The Idle Device:** Jones chooses to steal. Unknown to him, a device would have forced him to steal if he showed signs of hesitating. He does not hesitate; the device stays idle. Is Jones blameworthy? | Go to **Q3** | Go to **Q2** |
  | **Q2** | **The Flicker:** Same as Q1, but the device triggers on an involuntary twitch. The *only* thing Jones could have done otherwise is twitch slightly earlier. Is Jones blameworthy? | **LEAF B** (Flicker Leeway) | **LEAF A** (Hard Leeway) |
  | **Q3** | **Plain Determinism:** No device. Just laws of nature + past. Jones chooses to steal through ordinary reasoning. Is Jones blameworthy? | Go to **Q4** | **LEAF C** (Source Incomp) |
  | **Q4** | **The Engineer:** No device. But Jones's brain was engineered 5 minutes ago to ensure he chooses to steal. He reasons normally now. Is Jones blameworthy? | Go to **Q5** | **LEAF C** (Source Incomp) |
  | **Q5** | **The Knowledge:** Same as Q1, but Jones *knows* the device is there and would force him if he hesitated. Is Jones blameworthy? | Go to **Q6** | **LEAF D** (Epistemic View) |
  | **Q6** | **Threat vs. Reward:** Case X: Threaten Jones's family if he doesn't steal. Case Y: Reward Jones's family if he does steal. Is blameworthiness *equal* in X and Y? | Go to **Q7** | **LEAF E** (Identification) |
  | **Q7** | **Bad Options:** No device. Jones steals. Options B and C exist but would result in disaster for everyone. Is Jones blameworthy? | Go to **Q8** | **LEAF F** (Semicompatibilism) |
  | **Q8** | **The Tracing Case:** Jones voluntarily took a drug knowing it would make him violent later. He is now violent and cannot stop. If blaming him produced *no* future benefits (no deterrence/reform), would it still be fair to blame him? | **LEAF G** (Realist) | **LEAF H** (Skeptic) |

  ***

  # SCORING KEY & ANALYSIS (BACK OF SHEET)

  ### **THE LEAVES (Verdict Profiles)**
  *   **LEAF A (Hard Leeway Incompatibilism):** Requires robust alternative possibilities. *Least Comfortable Commitment:* You must deny responsibility in all deterministic worlds and standard Frankfurt cases, even where the agent acts on their own desires.
  *   **LEAF B (Flicker Leeway Incompatibilism):** Requires *some* alternative possibility, even a trivial one. *Least Comfortable Commitment:* You must accept that a mere involuntary twitch is sufficient to ground full moral responsibility.
  *   **LEAF C (Source Incompatibilism):** Accepts Frankfurt (Q1) but rejects Determinism/Manipulation (Q3/Q4). *Least Comfortable Commitment:* You must claim causation by laws of nature undermines responsibility, but causation by a counterfactual intervener does not.
  *   **LEAF D (Epistemic View):** Responsibility depends on the agent's knowledge of constraints. *Status:* **EMPTY CELL.** *Reason:* Unstable. If the device is idle, knowledge shouldn't change the metaphysics of control. Most who land here retreat to Leaf A or C upon reflection.
  *   **LEAF E (Identification/Will Theory):** Accepts Frankfurt/Determinism but cares about will-alignment (Threat vs. Reward). *Least Comfortable Commitment:* You must accept that an agent coerced by threats is less responsible than one bribed by rewards, even if control is identical.
  *   **LEAF F (Semicompatibilism):** Accepts Frankfurt/Determinism; focuses on actual-sequence control (Bad Options reduce responsibility). *Least Comfortable Commitment:* You must deny that "could have done otherwise" is ever necessary, even as a flicker.
  *   **LEAF G (Compatibilist Realist):** Accepts Frankfurt, Determinism, Manipulation, and Desert. *Least Comfortable Commitment:* You must affirm that it is fair to make an agent suffer for justice even if blaming them yields no future safety benefits.
  *   **LEAF H (Skeptic/Forward-Looking):** Denies desert-entailing control. *Status:* **CODICIL.** *Note:* This is not a theory of *responsibility* but a theory of *practice*. It can attach to Leaf F or G as a revision of blame's purpose. *Least Comfortable Commitment:* You must abandon the claim that wrongdoers *deserve* suffering, viewing blame purely as a tool for protection.

  ### **INCONSISTENCIES & EMPTY CELLS**
  *   **The Epistemic Cell (Leaf D):** If you answered **No** to Q5 but **Yes** to Q1, you hold that knowledge of a constraint removes responsibility even when the constraint is idle. This is widely regarded as **incoherent** (metaphysical control doesn't shift with knowledge). *Action:* Retake Q1 and Q5. If pattern holds, you likely belong in Leaf A or C.
  *   **The Manipulation/Determinism Split:** The tree merges Q3 and Q4 into Leaf C. If you answer **Yes** to Q3 (Determinism) but **No** to Q4 (Manipulation), you are a **History-Sensitive Compatibilist**. This is a valid but rare position not given a unique leaf; treat as Leaf C with a footnote.
  *   **Indistinguishable Leaves:** The tree cannot fully separate **Leaf F (Semicompatibilism)** from **Leaf G (Realist)** on the basis of control alone; they diverge only on the *nature of blame* (Q8). If you are unsure on Q8, you are oscillating between a metaphysical view (F) and a normative view (G).

  ### **CRITIQUE OF THE INSTRUMENT**
  1.  **Repackaged Cases:** Q6 (Threat/Reward) and Q7 (Bad Options) are structurally similar (both test coercion vs. causation). A specialist might argue Q7 is redundant if Q6 is answered "Different."
  2.  **Question-Begging Nodes:** Q8 smuggles in a distinction between "fairness" and "benefits." Hard compatibilists argue benefits *constitute* fairness in this context. The forced choice presupposes a retributive framework.
  3.  **Smuggled Assumptions:** The tree assumes "Blameworthiness" is a single scalar value. It does not allow for **Strawsonian separation** (e.g., responsible for resentment but not punishment). It also assumes **One Control Condition**, whereas folk intuitions often vary by context (moral vs. legal).
  4.  **The Skeptic Codicil:** Leaf H is treated as a terminal node, but skepticism is compatible with Leaf A, B, or C. The tree forces skeptics down the Compatibilist path (Q1=Yes) to reach Q8. A true skeptic might say "No" to Q1 for a different reason than Leaf A.

  ### **EPISTEMIC CODA: SETTLED VS. CONTESTED**
  *   **Settled (Consensus >80%):** The **Simple Alternative-Possibilities Principle** ("Responsibility requires the ability to do otherwise") is rejected by most specialists due to **Frankfurt Cases (Q1)**. The intuition that Jones is responsible in Q1 is robust. *Confidence: High.*
  *   **Contested (Active Dispute):**
      *   **The Flicker Strategy:** Whether the "twitch" in Q2 preserves enough freedom to save incompatibilism. *Confidence: Medium.* (Node Q2 is disputed).
      *   **The Manipulation Argument:** Whether Q4 (Engineered 5 mins ago) is relevantly different from Q3 (Determinism). Source Incompatibilists say Yes; Compatibilists say No. *Confidence: High.* (Node Q4 is the main battleground).
      *   **The Nature of Blame:** Whether Q8 (Desert vs. Utility) is a metaphysical question or a semantic one. *Confidence: Low.* (Node Q8 is highly theory-laden).
  *   **Dialectic Note:** Do not treat the "Settled" rejection of Simple AP as a refutation of Incompatibilism. Incompatibilists have migrated to **Source Incompatibilism (Leaf C)**. The debate has moved from *Alternative Possibilities* to *Causal History*.

