prompt: |-
  You are a philosopher of mind who also knows how today's AI systems are actually built, and you have followed the argument about whether large language models understand anything — the side that calls them elaborate pattern-matchers with no grip on meaning, and the side that says understanding is just a matter of having the right kind of internal organisation. Before you write, sketch two or three candidate designs and discard the weakest; I want the one that isolates a single variable, not the first that occurred to you.

  I have been reading this debate on my own, with no academic background, and what frustrates me is that both sides keep looking at the same systems and announcing opposite verdicts without ever being brought up short. So I want a case built to order.

  Design one realistic scenario — the sort of thing a small business or a household could actually set up this year — containing two systems and one task, engineered so that the verdicts cross. Every test that looks only at outward behaviour (correct answers to questions never asked before, coping with paraphrase and slang, transferring to a new case, giving an explanation a person can act on) should say that system A has grasped the concept in question and system B has not. Every test that looks at whether a system's internal states are causally hooked to the thing itself — sensors, actuators, being corrected by the world rather than by more text — should say the opposite: that B has and A has not. The concept should be some ordinary physical quantity: what is actually on a shelf, how wet the soil is, whether a pump is primed.

  Constraints. Both systems must be things we can build now: a language model, a database, sensors, a robot, ordinary code; no future AI, no brain uploads, no exotic physics. The task must be one a non-specialist could set and mark. Neither system may be a bare lookup table or an obviously broken machine, and the verdicts must fall out of how each system is put together rather than from my stipulating who understands.

  My own guess, which I want you to test rather than flatter, is that the variable is what I call correction provenance: whether a system's errors get repaired by the world pushing back — a sensor reading, a crate that is not on the shelf — or by more text produced by other speakers. If that is what the case turns on, say so; if it turns on something else, name that instead.

  Give me: the scenario in a single paragraph of no more than 120 words; then, for each camp, what it says about each system and why; then the one feature of the design doing the work; then what happens if you remove that feature, such that the two camps' verdicts stop crossing; and finally how a defender of whichever camp comes out worse would attack the case. Write in British English, and keep the whole answer, scenario included, under 500 words.
