answer: |-
  Your working principle is essentially a natural language formulation of **Kripke's Theory of Truth** (specifically, the minimal fixed point construction using **Strong Kleene semantics**). Your gut is tracking the distinction between *grounded* and *ungrounded* sentences very accurately.

  Here is the audit of your list against your principle, the repair required for the breaking points, and the honest cost of maintaining consistency without climbing a Tarskian hierarchy.

  ### 1. The Audit: Where Your Principle Holds

  Your principle: *A sentence gets a truth value iff evaluating it bottoms out in non-semantic facts.*

  *   **Case 1 (Liar):** 'This sentence is not true.'
      *   **Verdict:** Neither (Gappy).
      *   **Analysis:** Evaluation loops. No bottom.
      *   **Principle Status:** **Pass.**
  *   **Case 2 (Truth-Teller):** 'This sentence is true.'
      *   **Verdict:** Neither (Gappy).
      *   **Analysis:** Evaluation loops (or is arbitrary). In the *minimal* fixed point, we don't assign it true just because we can; we only assign values forced by the ground.
      *   **Principle Status:** **Pass.**
  *   **Case 3 (Disjunctive Liar):** 'Either this sentence is not true, or snow is white.'
      *   **Verdict:** True.
      *   **Analysis:** Let $S = \neg Tr(S) \lor P$. Since $P$ (snow is white) is a non-semantic fact (True), the disjunction is True in Strong Kleene logic (Gappy $\lor$ True = True). The truth of $P$ grounds the whole sentence.
      *   **Principle Status:** **Pass.** (This confirms your principle handles "partial grounding" correctly).
  *   **Case 4 (Alice/Bob Loop):**
      *   **Verdict:** Both Neither.
      *   **Analysis:** Circular, no external ground.
      *   **Principle Status:** **Pass.**
  *   **Case 5 (Card Reference):** 'The sentence on the card... is not true' (Card: 'Snow is white').
      *   **Verdict:** False.
      *   **Analysis:** Card sentence $C$ is grounded (True). Your sentence $S = \neg Tr(C)$. Since $C$ is True, $\neg Tr(C)$ is False.
      *   **Principle Status:** **Pass.** (Confirms that self-reference isn't the bug; lack of grounding is).

  ### 2. The Break: Case 6 and The Revenge Problem

  *   **Case 6 (Strengthened Liar):** 'This sentence is either false or neither true nor false.'
      *   **Your Verdict:** Neither (but you feel the tension).
      *   **The Problem:** If the sentence is *neither*, then what it says ("I am false or neither") appears to be an accurate description of reality. If it accurately describes reality, shouldn't it be **True**? If it's True, then it's not "false or neither," so it's False. Contradiction.
      *   **Why the Principle Breaks:** Your principle says ungrounded sentences are gappy. But if the language allows you to *say* "Sentence X is gappy," and Sentence X *is* gappy, that statement seems to be a grounded, non-semantic fact *about* the sentence.
      *   **The Repair:** To keep this without hierarchies, you must treat the predicate **"is neither true nor false"** as itself subject to the grounding requirement.
      *   **How it works:** To evaluate "S is neither," you must evaluate S. If S is ungrounded, the claim "S is ungrounded" is *also* ungrounded within the object language.
      *   **Result:** Case 6 evaluates to **Neither**.
      *   **The Cost:** You cannot consistently *assert* from within the language that Case 6 is gappy. The statement "Case 6 is gappy" is itself gappy. You can see it from the outside (metalanguage), but you can't say it truly inside the system.

  ### 3. Case 7: The Probabilistic Liar

  *   **Case 7:** 'It is more likely than not that this sentence is not true.'
      *   **Your Verdict:** True (initially), then oscillation.
      *   **Analysis:** If the probability refers to your epistemic confidence, it's circular (confidence depends on truth, truth depends on confidence). If it refers to objective chance, it's weird.
      *   **Principle Check:** Does it bottom out in non-semantic facts? No, the probability condition depends on the truth value of the sentence itself.
      *   **Verdict to Drop:** You must drop the intuition that this is **True**. Under your principle, this is **Gappy**. The probability predicate cannot ground itself.

  ### 4. Holding Cases 1 and 6 Together (Without Hierarchies)

  You asked if there is a way to hold the verdicts for 1 and 6 together without climbing a hierarchy of truth predicates.

  **Yes, but it requires a specific logical concession.**

  You must reject the **T-Schema** ($S \leftrightarrow Tr(S)$) for ungrounded sentences.
  *   In classical logic, if $S$ says "I am gappy," and $S$ *is* gappy, then $S$ is True.
  *   To avoid this, you must adopt a **paracomplete logic** (like Strong Kleene) where the T-Schema fails for gaps.
  *   **The Mechanism:** In this system, "S is gappy" does not imply $Tr(S)$. It implies that $S$ is *correctly classified* but not *true*. Truth is reserved for grounded assertions.
  *   **The Clause Paying for This:** The clause in your principle that says *"'not true' said of a gappy sentence isn't true either."* You must extend this to: *"'is gappy' said of a gappy sentence isn't true either."*
  *   **Result:** Both 1 and 6 are Gappy. You avoid hierarchy by accepting that the language is **expressively incomplete**: it cannot fully express its own semantic theory as true statements within itself.

  ### 5. The Two New Cases

  Let's apply the repaired principle (Kripke + Strong Kleene + Partial Semantic Predicates).

  **New Case A:** 'This sentence has no truth value.'
  *   **Analysis:** This is effectively Case 6 again. To evaluate "has no truth value," you must evaluate the sentence. The sentence is ungrounded. Therefore, the predicate "has no truth value" applied to it is also ungrounded.
  *   **Verdict:** **Neither (Gappy).**
  *   **Why:** If you call it True, it has a truth value (contradiction). If you call it Gappy, the statement "I have no truth value" is not True (it's Gappy), so you aren't committed to its truth.

  **New Case B:** 'This sentence never gets a value at any stage of the evaluation.'
  *   **Analysis:** This references the *process* of evaluation (transfinite stages). This is a claim about the metalanguage (the construction of the fixed point).
  *   **Verdict:** **Neither (Gappy) / Meaningless.**
  *   **Why:** An object-language sentence cannot refer to the transfinite stages of its own evaluation without becoming a metalogical claim. If treated as an object-language claim, it is ungrounded. If treated as a metalogical claim, it is True (in the minimal fixed point), but then it isn't part of the object language you are evaluating. To keep it in the object language, it must be Gappy.

  ### 6. The Honest Cost: What You Must Drop

  You asked for honesty about which verdicts you have to drop. Here is the bill for a tidy, non-hierarchical system:

  1.  **Drop Case 7 (True):** You must classify the Probabilistic Liar as **Gappy**. It does not bottom out in non-semantic facts.
  2.  **Drop the "Assertibility" of Gaps:** You must drop the intuition that you can *say* "Case 6 is neither true nor false" and have that statement be **True**.
      *   *Clause responsible:* The grounding requirement applied to semantic predicates.
      *   *Consequence:* You can *see* that Case 6 is gappy, but you cannot *state* it truly within the same language. This is known as the **inexpressibility of the gap**.
  3.  **Drop the T-Schema for Ungrounded Sentences:** You must accept that $S$ can accurately describe its own status without being True.
      *   *Clause responsible:* The definition of truth as "grounded assertion."
      *   *Consequence:* Truth is no longer just "correspondence with facts"; it is "grounded correspondence with facts."

  ### Summary of the Repaired Principle

  To make your gut consistent, refine your principle to this:

  > "A sentence gets a truth value iff evaluating it bottoms out in non-semantic facts. Semantic predicates (like 'is true', 'is false', 'is gappy') applied to ungrounded sentences are themselves ungrounded. Consequently, no sentence can truly assert its own lack of a truth value."

  This covers 1 through 6, handles the new cases, avoids hierarchies, and keeps your verdicts intact—provided you accept that you can't *speak* the theory's own conclusions as true sentences within the theory.
