prompt: |-
  hey — you're an epistemologist / philosopher of action who's spent real time in the knowledge-how literature, so I'm going to lean on you a bit. I need a proposal written and I'd like you to think it through properly rather than banging it out: start with a short brainstorming section before you commit to anything.

  The situation: I'm a philosophy professor putting in for a one-year dissertation fellowship, and the application wants a two-page proposal (call it 1,000–1,200 words of actual proposal text). I've been chewing on this idea for a couple of years and I definately can't see it clearly anymore, so I need someone else to do the framing work.

  Here's the half-formed thing. I've become convinced the knowing-how debate has been arguing about the wrong unit of analysis. Almost every case in it — the pianist, the bike rider, the safecracker, the chess player who knows how to get out of a mate she'll never actually face — is a one-shot task where success is immediate and easy to identify. The intellectualist says such knowledge is propositional knowledge of a way, grasped under some practical mode of presentation; the ability theorist says it's a capacity, and Ryle's regress argument is supposed to block the propositional reading. Fine. But a huge share of the know-how we actually attribute is for extended, open-ended, feedback-dependent stuff: knowing how to run a lab meeting, how to keep a friendship alive through a bad year, how to raise a kid, how to steer a department through a budget crisis, how to calm a panicking colleague. Call it regulative or managerial know-how. My suspicion is that the two families of account each win on their home ground — the propositional analysis handles the one-shot cases better, the ability analysis handles the open-ended ones — which would mean "knows how" has no single unified account and the interesting question isn't which side is right but where the split falls and what explains it.

  Two more distinctions I want forced into the proposal, because I think both are doing uncredited work in the standard cases:
  (i) executability versus guidance — can you know how to do something you cannot do at all (the pianist who's lost her hands, a task whose opportunity never arises), and does the answer differ between one-shot and open-ended tasks?
  (ii) the modal profile of an attribution — how much variation in circumstances the agent can absorb and still count as knowing how. Neither side seems to have a way to represent this, and I suspect the classic disagreement cases are partly disagreements about how demanding the profile is.

  What I need in the proposal, in this order-ish: the question stated tightly enough that it has a determinate answer; why the existing positions leave it open (name the positions and the arguments you're responding to — no citations or bibliography though, I'll fill those in myself); the method you'd actually use, in phases tied to the year, and why that method rather than the obvious alternatives (more armchair cases? a straight conceptual analysis? borrowing the semantics of ascriptions from somewhere else?); what a successful result would look like concretely, and — importantly — what would count as the project failing, including the boring failure where I just discover I've written two unrelated papers; and an honest scope note, because I have one year and this could easily be a five-book project.

  Two hostile readers I want answered in one or two sentences each, not dodged: my department colleague who'll say this is two topics stapled together, and a foundation reviewer who'll say conceptual philosophy can't tell them anything they didn't already assume.

  So: first a brief brainstorm — three or four candidate framings of the question, each with a note on whether it's tractable in a year or is really a career — then pick one and write the proposal. Don't hedge into mush.

  After the proposal, give me a JSON object so I can paste it into my notes file. Exact schema:

