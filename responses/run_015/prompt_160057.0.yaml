  ### Brainstorming Candidate Framings

  1.  **The Unity Hypothesis:** Is the semantic value of "knows how" univocal across all contexts?
      *   *Tractability:* Low. This is a career-long project in semantics and metaphysics. It invites endless counterexamples and risks becoming a dictionary project rather than philosophical research.
  2.  **The Modal Profile Argument:** Does the modal robustness required for knowledge-how attribution vary by task type?
      *   *Tractability:* High. This focuses specifically on the *conditions* of attribution rather than the metaphysics directly. It limits the scope to comparing counterfactual resilience across specific cases.
  3.  **The Task-Relativity Hypothesis (Selected):** Does the metaphysical constitution of knowledge-how depend on the temporal structure of the task (one-shot vs. regulative)?
      *   *Tractability:* High. It limits the scope to comparing two classes of tasks rather than all tasks. It allows for a negative result (disunity) which is still a determinate answer. It directly addresses the user's intuition about the "unit of analysis."
  4.  **The Guidance/Executability Split:** Can we separate the ability to guide from the ability to execute across task types?
      *   *Tractability:* Medium. Risky. Might collapse into standard intellectualism vs. ability theory debates without new traction unless tied to the temporal structure.

  ***

  ### Dissertation Fellowship Proposal

  **Project Title:** The Temporal Structure of Knowledge-How: Unity vs. Task-Relativity

  **The Question**
  Does the metaphysical constitution of knowledge-how vary according to the temporal structure of the task? Specifically, is knowledge-how for one-shot, immediate-success tasks (playing a chord, opening a safe) constituted differently than knowledge-how for extended, regulative tasks (managing a lab, raising a child)? This question admits a determinate answer: either the constitution is uniform across task types, or it is heterogeneous. My hypothesis is the latter: the debate between intellectualism and ability theory persists because each captures a different temporal slice of agency.

  **The Gap in Existing Positions**
  Contemporary epistemology of action is stalled between Intellectualism and Ability Theory. Intellectualists argue that knowledge-how is a species of propositional knowledge grasped under a practical mode of presentation. This handles one-shot cases well; a pianist can know how to play a piece they cannot currently execute, provided they retain the propositional grasp of the way to do it. However, this struggles with open-ended regulative tasks. Knowing how to steer a department through a budget crisis is not merely knowing a proposition; it is maintaining a trajectory amidst feedback.

  Conversely, Ability Theorists, following Ryle, argue knowledge-how is a complex disposition or capacity. This fits regulative tasks naturally, where success is defined by sustained performance rather than a single truth-condition. Yet, Ability Theory falters on one-shot cases where the ability is masked or lost (the handless pianist). Both positions leave open the possibility that they are describing different phenomena under the same label. Neither accounts for the modal profile of attribution: how much variation in circumstances an agent can absorb while still counting as knowing how. Intellectualism assumes a stable propositional anchor; Ability Theory assumes a stable dispositional base. Neither explains why our attributions shift demandingness depending on whether the task is immediate or extended.

  **Methodology**
  I will not rely on unstructured armchair intuition pumping, which has produced the current stalemate. Instead, I will employ a phased method of structured case variation and modal testing.

  *Phase 1 (Months 1–3): Taxonomy and Case Construction.* I will construct a rigorous typology of tasks, distinguishing one-shot actions from regulative processes based on temporal duration, feedback loops, and success conditions. The output will be a curated set of minimal pairs—cases identical in skill requirement but distinct in temporal structure.
  *Phase 2 (Months 4–8): Modal Stress-Testing.* I will subject these cases to variation in executability and guidance. For each case, I will test the limits of attribution: if the agent loses physical capacity but retains guidance, does the attribution hold? If the environment changes unpredictably, does the attribution hold? The output will be a map of the modal profiles for each task type.
  *Phase 3 (Months 9–12): Synthesis and Metaphysical Implication.* I will analyze whether the divergence in modal profiles necessitates a divergence in metaphysical constitution. The output will be the final dissertation chapter arguing for task-relativity.

  This method is superior to straight conceptual analysis because it isolates variables rather than testing whole intuitions. It avoids borrowing semantics from linguistics, which often abstracts away from the action-theoretic details crucial to this problem.

  **Success and Failure Conditions**
  A successful result concretely demonstrates that attributions of knowledge-how for regulative tasks require a modal robustness regarding feedback absorption that one-shot tasks do not. This would justify treating them as distinct metaphysical categories.

  The project fails if: (1) I discover the modal profiles converge upon rigorous testing, forcing a return to a unified account; (2) the distinction between one-shot and regulative tasks proves too vague to sustain philosophical weight; or (3) I produce two unrelated papers—one on intellectualism, one on regulation—without establishing the connective thesis of task-relativity.

  **Scope and Objections**
  This project is scoped strictly to the comparison of two task classes. It does not aim to solve the knowledge-how debate universally, but to show why it has been unsolvable. The biggest risk is scope creep into general philosophy of action; I will resist analyzing *what* action is, focusing solely on the *knowledge* component.

  I anticipate two hostile readings. To the colleague claiming this is two topics stapled together: This is not two topics stapled together but a single hypothesis about task-relativity tested across two domains. To the foundation reviewer claiming conceptual philosophy offers no utility: Conceptual clarity here prevents wasted resources on training models that assume unified agency where none exists.

  **Conclusion**
  If knowledge-how is task-relative, the demand for a unified theory is a category error. By shifting the unit of analysis from the attribution to the task structure, this project resolves the stalemate not by choosing a side, but by dissolving the battlefield.

