  **MEMORANDUM**

  **TO:** Mayor's Office
  **FROM:** Democratic Reform Task Force
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Eastside Zoning Board Reform Proposal

  **RECOMMENDATION**

  The Task Force recommends **rejecting the "stratified deliberation weights" mechanism** included in the current Eastside Zoning Board reform proposal. We advise proceeding with a citizens' assembly based on pure sortition (random selection) only if the weighted voting and speaking-time budgets tied to knowledge assessments are removed. If the weighting system remains a non-negotiable condition for the proponents, the Task Force recommends maintaining the current appointed board structure until a coherent democratic model can be developed.

  **EXECUTIVE SUMMARY**

  The proposal seeks to replace the appointed Eastside Zoning Board with a citizens' assembly selected by lot. However, it introduces a novel modification: members would take a local-knowledge assessment, and their scores would determine their voting weight (1x, 1.5x, 2x) and speaking time. While the intent is to balance democratic representativeness with technical competence, this mechanism creates a fundamental conflict between political equality and epistemic authority. Implementing weighted voting within a body purportedly designed for democratic representation undermines the legitimacy of the assembly and introduces significant legal and operational risks.

  **ANALYSIS OF THE PROPOSAL**

  **1. The Argument for Democratic Equality (Pure Sortition)**
  The core justification for replacing the appointed board with a citizens' assembly is to restore descriptive representation. Appointed boards often suffer from selection bias, favoring homeowners with flexible schedules, existing political connections, or specific ideological alignments. Sortition ensures that the decision-making body statistically mirrors the community's demographics, including renters, younger residents, and marginalized groups who are typically excluded from zoning discussions.

  In this framework, legitimacy is derived from *process equality*. Every citizen selected has an equal stake in the outcome and an equal voice in the deliberation. The assumption is that collective intelligence emerges from the diversity of perspectives, not from pre-existing technical knowledge. By treating all members as equals, the assembly fosters trust and ensures that decisions reflect the lived experience of the neighborhood, not just the technical preferences of planners or developers.

  **2. The Argument for Epistemic Competence (The Case for Weights)**
  Proponents of the weighted system argue that zoning is not merely a values-based decision but a technical one with long-term consequences. A poorly voted zoning change can lock in traffic congestion, shadowing, or infrastructure strain for decades. The strongest argument for the weights is not elitism, but *harm reduction*.

  Under pure sortition, there is a risk that a randomly selected body could be swayed by populist sentiment or manipulated by sophisticated stakeholders during the deliberation phase. Proponents argue that residents with demonstrated knowledge of local zoning history and demographics are better equipped to identify bad-faith arguments or unintended consequences. By weighting their votes, the system attempts to insure the neighborhood against ignorance without reverting to an appointed technocracy. It is an attempt to say: "Everyone gets a seat at the table, but those who understand the map should have more say in where we drive." This prioritizes the *quality of the outcome* over the *equality of the process*.

  **3. The Coherence Problem: Conflating Representation with Authority**
  Here lies the conceptual break in the proposal. The Task Force must be clear: **This mechanism conflates descriptive representativeness with epistemic authority in a way that is theoretically incoherent and practically unstable.**

  Sortition is designed to solve the problem of *who* represents the people. Weighted voting is designed to solve the problem of *how* decisions are made based on merit. Combining them creates a category error.
  *   **Legitimacy Deficit:** If you select people randomly to represent the public, you grant them democratic legitimacy based on their status as citizens. If you then immediately stratify them into classes based on a test score, you revoke that democratic legitimacy. You are no longer running a citizens' assembly; you are running a meritocratic exam where the prize is partial voting rights.
  *   **The "Second-Class Citizen" Risk:** Creating a tiered system within the assembly (1x vs. 2x voters) risks alienating the very groups sortition is meant to empower. If lower-income residents or renters score lower on a "local knowledge" test (perhaps due to less access to historical records or less time to study), they are systematically silenced in the final vote. This reproduces the exact power dynamics the reform claims to fix.
  *   **Measurement Validity:** There is no guarantee that a "local-knowledge assessment" measures wisdom or judgment rather than trivia or test-taking ability. Zoning competence involves understanding trade-offs, not just recalling demographic data. Weighting votes based on a proxy metric creates a false sense of security regarding the quality of decisions.

  **4. Operational and Legal Risks**
  Beyond the philosophical tension, the weighted mechanism introduces practical vulnerabilities:
  *   **Equal Protection Concerns:** A government body that assigns voting power based on an assessment of citizen knowledge may face legal challenges under equal protection clauses. While private organizations can weight votes, a public zoning board exercising state power operates under stricter constitutional scrutiny.
  *   **Deliberative Breakdown:** Deliberation relies on the premise that participants are peers. If members know that some voices count double during the final vote, the incentive to listen during discussion diminishes. High-weight members may dominate early, and low-weight members may disengage, knowing their influence is capped.

  **PATH FORWARD**

  The Task Force believes the goal of reforming the Eastside Zoning Board is necessary, but the current mechanism undermines the democratic integrity of the solution. We propose the following conditions for approval:

  1.  **Remove Weighted Voting:** All assembly members must hold equal voting power (one person, one vote).
  2.  **Remove Weighted Speaking Time:** Deliberation time must be managed by neutral facilitators to ensure equity, not by algorithmic weights based on test scores.
  3.  **Integrate Expert Witness Testimony:** To address the competence concern, the assembly should have guaranteed access to independent zoning experts and planners who can testify during deliberations. This injects epistemic competence into the *information pool* without stratifying the *decision-makers*.
  4.  **Supermajority Requirements:** If the concern is protecting against rash decisions, require a supermajority (e.g., 60%) for significant zoning changes rather than weighting individual votes.

  **DISSENT ACKNOWLEDGMENT**

  We recognize that removing the weights increases the risk of decisions made without full technical appreciation of the consequences. Proponents argue that without epistemic filtering, the assembly is vulnerable to manipulation. This is a valid concern. However, the Task Force judges that the risk of an uninformed decision is preferable to the certainty of creating a two-tiered citizenship model within a public body. The legitimacy of the board depends on the community believing every member speaks for them equally. Once you weight the vote, you weight the voice, and the community will know whose voice matters less.

  **DECISION REQUIRED**

  Please indicate by Friday whether the Mayor's Office supports the Task Force's recommendation to strip the weighting mechanism from the proposal. If the weighting system is retained, we cannot endorse the reform package.
