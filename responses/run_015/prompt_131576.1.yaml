  | Private Insurance Concept | Welfare State Analog (in the analogy) | Actual Function in Welfare State |
  | :--- | :--- | :--- |
  | **Premium** | Taxes (Payroll/Income) | Mandatory taxation (coercive, not contractual). |
  | **Insurer** | The State / Welfare Agency | Sovereign entity (monopoly, political mandate). |
  | **Policyholder** | The Taxpayer / Citizen | Subject / Rights-bearer. |
  | **Claim** | Application for Benefits | Request for statutory entitlement. |
  | **Covered Peril** | Unemployment, Disability, Poverty | Socio-economic status or labor market exclusion. |
  | **Fraud Investigator** | Caseworker / Compliance Officer | Bureaucrat enforcing eligibility & behavior. |
  | **Reckless Driver** | "Welfare Dependent" / Shirkers | Recipient allegedly altering behavior due to aid. |
  | **Moral Hazard** | Working less to keep benefits | Labor supply distortion (reservation wage effect). |

  ---

  ### 2. Structural Disanalogies: Where the Mapping Fails

  The analogy relies on treating social risks as if they function like private risks. Three critical fractures appear upon inspection.

