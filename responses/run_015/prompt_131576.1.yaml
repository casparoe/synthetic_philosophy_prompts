  ### 2. Structural Disanalogies: Where the Mapping Fails

  The analogy relies on treating social risks as if they function like private risks. Three critical fractures appear upon inspection.

  #### A. Idiosyncratic vs. Systemic Risk
  *   **Insurance Logic:** Insurers rely on the **Law of Large Numbers**. Risks must be independent (my house burning doesn't cause yours to burn). This allows risks to be pooled and priced.
  *   **Welfare Reality:** Unemployment and poverty are often **covariant risks**. In a recession, millions claim simultaneously. No private insurer could solvently cover a 10% unemployment rate without state reinsurance.
  *   **The Failure:** Treating unemployment as an individual "accident" ignores that it is frequently a **structural feature** of the macroeconomy. You cannot "investigate" a recession away. If the peril is systemic, the "reckless driver" narrative fails; the recipient did not increase the probability of the recession by claiming benefits.

  #### B. The Insurer's Incentive Structure
  *   **Insurance Logic:** A private insurer denies claims to protect solvency and profit. They are adversarial to the claimant by design.
  *   **Welfare Reality:** The State's primary incentive is **social stability and legitimacy**, not solvency in a commercial sense. While budgets matter, the state can run deficits or print currency.
  *   **The Failure:** When the state mimics a profit-seeking insurer (denying claims to "save money"), it is adopting a **political posture**, not an economic necessity. It transforms a social safety net (designed to catch everyone) into a filter (designed to exclude). The "investigator" is not protecting a risk pool; they are enforcing a labor discipline policy.

  #### C. The Assumption of Individual Failure
  *   **Insurance Logic:** The peril is external (a storm, a crash). The policyholder is a victim of circumstance, provided they weren't negligent.
  *   **Welfare Reality:** The analogy implicitly reclassifies poverty from a *circumstance* to a *behavior*. By focusing on "fraud checks" and "workfare," the model assumes the default state of the recipient is potential deceit or laziness.
  *   **The Failure:** This creates a **presumption of guilt**. In private insurance, fraud is the exception (<2% of claims). In welfare rhetoric, fraud is treated as a systemic risk requiring universal friction (forms, interviews, sanctions) to mitigate.

  ---

  ### 3. The Progressive Contribution Problem

  You identified a critical technical flaw: **Social insurance contributions are progressive, not actuarial.**

  *   **Actuarial Fairness:** In private insurance, Premium $\approx$ Risk $\times$ Payout. If I pay 10x the premium, I expect 10x the coverage or a significantly lower risk profile.
  *   **Social Reality:** A high earner pays significantly more tax but receives the same unemployment cap as a low earner. A low earner pays little but receives the same benefit.
  *   **The Break:** This is **redistribution**, not insurance.
      *   If this were a true contract, high earners would be legally entitled to demand higher benefits proportional to their "premiums." They do not get them.
      *   Therefore, the "premium" is functionally a **tax**, and the "benefit" is a **transfer**.
  *   **Reconciliation?** The only way to reconcile this is to shift from a *contractual* framework to a **constitutional** or **Rawlsian** framework. We pay progressive "premiums" not because we expect a personal return, but because we are insuring society against instability. However, this breaks the "moral hazard" argument: I am not paying to protect *my* assets from *your* recklessness; I am paying to maintain *our* social order.

  ---

  ### 4. Verdict: Does the Justification for Conditionality Survive?

  Once the disanalogies are laid out, the argument for strict conditionality (workfare, sanctions, time limits) largely collapses.

  1.  **The Moral Hazard Claim Weakens:** Moral hazard applies when an individual can influence the *probability* of the loss. While a worker can choose to quit, they cannot choose to avoid a layoff caused by automation or recession. Strict conditionality punishes structural victims for systemic failures.
  2.  **The "Fraud" Justification Vanishes:** If the system is redistributive (progressive taxes) rather than actuarial, the "insurer" (state) has no financial incentive to deny valid claims to protect a risk pool. Denials are political choices, not solvency requirements.
  3.  **The Category Error:** The analogy treats a **political obligation** (citizens supporting citizens) as a **commercial contract** (customers buying protection).

  **Conclusion:** The analogy was carrying the argument all along.
  By framing welfare as insurance, proponents import the **moral logic of the market** (deservingness, actuarial fairness, suspicion of claims) into the **sphere of rights**. Once you acknowledge that unemployment is often structural and contributions are redistributive, strict conditionality is no longer "risk management." It reveals itself as **social control**—a mechanism to enforce labor discipline rather than protect against loss. The "reckless driver" is a phantom constructed to justify the barrier.
