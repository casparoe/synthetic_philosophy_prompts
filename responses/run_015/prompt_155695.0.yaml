answer: |-
  ### Case Study: The Standardization of Railway Gauges (19th Century Britain)

  The most illustrative example of this conceptual collapse is the adoption of the **standard railway gauge (4'8½")** in Britain and subsequently North America, contrasted with the failed **broad gauge (7'0¼")** championed by Isambard Kingdom Brunel.

  This case allows us to observe how the same initial conditions (the emergence of steam locomotion in the 1820s–1840s) can be narrated either as a contingent historical accident that locked in a suboptimal specific technology, or as the inevitable convergence toward a functional macro-state of "interoperable infrastructure," rendering the specific measurement historically irrelevant.

  #### 1. The Divergent Narratives

  **Narrative A: Genuine Historical Lock-In (The Micro-History View)**
  *   **Initial Conditions:** George Stephenson adopts 4'8½" for the Stockton and Darlington Railway, ostensibly based on the pre-existing spacing of coal wagon wheels in Newcastle mines (which itself derived from Roman road ruts, per the popular, if debated, lineage).
  *   **Mechanism:** Increasing returns to adoption. As more track was laid to this gauge, the cost of switching to Brunel's technically superior broad gauge (which offered greater stability and speed) became prohibitive.
  *   **Outcome:** The specific dimension 4'8½" is a "frozen accident."
  *   **Counterfactual:** In a nearby possible world where Brunel's Great Western Railway dominates, the micro-state is 7'0¼". The economic trajectory differs due to different engineering constraints (tunnel sizes, curve radii).
  *   **Conclusion:** History matters. The specific micro-state is path-dependent.

  **Narrative B: Retrospective Counterfactual Smoothing (The Macro-State View)**
  *   **Initial Conditions:** The economic necessity of moving bulk goods requires a mechanical interface between wagon and track.
  *   **Mechanism:** Network effects dictate that *a* standard must emerge to prevent fragmentation. The physics of rail adhesion and the economics of network connectivity create a "Standardization Attractor."
  *   **Outcome:** The macro-state is not "4'8½"" but **"Unified National Gauge."** Whether the number is 4'8½" or 7'0¼" is noise; the signal is the existence of a dominant standard.
  *   **Counterfactual:** In the Brunel-dominant world, the micro-state is 7'0¼", but the macro-state descriptor remains "Unified National Gauge." The long-run economic growth rates and logistical capabilities converge because the *function* (standardization) is the attractor, not the *form* (specific inches).
  *   **Conclusion:** History is smoothed. The specific micro-state is path-independent; only the structural convergence matters.

  #### 2. The Collapse: Macro-State Descriptors and Diverging Micro-Histories

  The distinction between lock-in and attractor collapses here because the **definition of the system's state space** determines which narrative is true.

  *   **Fine-Grained Description:** If the state space is defined by specific physical dimensions (e.g., $S = \{4'8½", 7'0¼", 5'3", \dots\}$), the system is **non-ergodic**. It occupies one point ($4'8½"$) and never visits the others. The counterfactual histories diverge permanently. Lock-in is real.
  *   **Coarse-Grained Description:** If the state space is defined by functional topology (e.g., $S = \{\text{Fragmented}, \text{Standardized}\}$), the system appears **ergodic** (or convergent). Both the Stephenson and Brunel counterfactuals map to the state $\text{Standardized}$. The counterfactual histories share the macro-state descriptor despite diverging micro-histories.

  The disagreement hinges entirely on whether the researcher treats the specific gauge width as a **constitutive element of the economic outcome** or as **transient implementation detail**. If the gauge width constrains future innovation (e.g., limiting container size or tunnel diameter for 150 years), the micro-history *becomes* the macro-history, and the distinction collapses back into lock-in. If the gauge width is easily adaptable (e.g., via variable gauge axles or dual tracks), the macro-state stands alone, and the lock-in narrative dissolves into smoothing.

  #### 3. Interaction with Non-Ergodic Dynamics

  Does treating the system as non-ergodic dissolve the problem? **No, it relocates the underdetermination to the level of description.**

  **The Non-Ergodic Claim:**
  In path-dependence theory, a non-ergodic system is one where time averages do not equal ensemble averages. The system does not explore all possible states; it gets stuck in a subset. Declaring the railway system non-ergodic asserts that the specific trajectory ($4'8½"$) cannot be inferred from the structural parameters alone; you must know the history.

  **The Relocation of Underdetermination:**
  Treating the system as non-ergodic forces the analyst to define the **basin of attraction**.
  *   If the basin is defined narrowly (specific gauge width), the system is non-ergodic. The "Lock-In" narrative holds.
  *   If the basin is defined broadly (any gauge allowing interoperability), the system behaves *as if* it were ergodic within that basin. The "Attractor" narrative holds.

  **The Paradox:**
  Non-ergodicity is often invoked to explain why we are stuck in a specific equilibrium. However, in the railway case, the **mechanism of non-ergodicity (network effects)** is exactly what creates the **macro-state attractor (Standardization)**.
  *   Network effects prevent the system from exploring the ensemble of *all* gauges (Non-Ergodicity).
  *   But network effects force the system into the subset of *single* gauges (Attractor).

  Therefore, asserting non-ergodicity does not resolve whether the outcome was contingent or inevitable. It merely shifts the question from "Why this gauge?" to "Why this level of descriptive granularity?"

  If we treat the system as non-ergodic, we admit that the *micro-history* is irrecoverable from structural laws. But if we acknowledge that the *macro-state* (Standardization) would have emerged in almost all counterfactual micro-histories (Stephenson, Brunel, or a third competitor), then the non-ergodicity of the micro-state is functionally irrelevant to the macro-outcome.

  **Conclusion:**
  The ambiguity is not resolved by non-ergodic dynamics; it is **constituted** by them. Non-ergodicity guarantees that the micro-history diverges in counterfactuals. But whether that divergence matters depends on whether the macro-state descriptor is sensitive to micro-variations. In the railway case, because the physical infrastructure creates long-term constraints (tunnels, rolling stock), the micro-history eventually "hardens" into macro-history.

  Thus, the distinction between lock-in and smoothing collapses because **lock-in is the mechanism by which the attractor is realized.** You cannot have the macro-state "Standardized Rail" without the non-ergodic process that locks out alternative gauges. The disagreement is not about the dynamics, but about whether the cost of the specific lock-in (4'8½" vs 7'0¼") is significant enough to alter the macro-descriptor of the economy. If the cost is negligible, it's an attractor. If the cost is structural, it's lock-in. Non-ergodicity alone cannot tell us which it is; it only tells us that the choice was permanent.
