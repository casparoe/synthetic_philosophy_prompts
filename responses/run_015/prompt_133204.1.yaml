  **To:** Product Ethics Committee
  **From:** [Your Name]
  **Date:** October 23, 2023
  **Subject:** Recommendation: Promotion Audit Framework (Vote Prep for 10/26)

  ### Recommendation

  I recommend we **switch to Option B: Case-by-Case Narrative Review**, but with a mandatory calibration layer. We should retire the universal statistical metric (Option A) for promotion audits.

  ### Rationale

  While Option A offers the comfort of consistency, it fails the substantive fairness test in an engineering context. Our current universal metric weights "commit frequency" and "peer sentiment" equally across all teams. This assumes all code contributions are comparable units of value. They are not.

  *   **Technical Reality:** A legacy system maintainer may have low commit frequency but high impact (preventing outages). An AI researcher may have high impact but low commit frequency (papers, prototypes). A universal metric flags these legitimate differences as "anomalies," forcing teams to game the system to look fair rather than be fair.
  *   **Ethical Reality:** Fairness requires treating relevant differences differently. Applying the same formula to unequal roles isn't neutrality; it's blindness. We need a system that allows the weight of a reason (e.g., commit frequency) to shift based on the context (the role).

  ### Addressing the Counter-Argument (The Bias Risk)

  Side A's argument is the strongest objection to Option B: **"If you let context shift the weight of reasons, you're just dressing up bias in fancy language."**

  This is not a hypothetical risk. Without guardrails, narrative justification allows managers to unconsciously favor employees who match their own background or working style. If we switch to narratives without controls, we trade algorithmic rigidity for human inconsistency.

  **Mitigation Strategy:**
  We do not mitigate this by reverting to Option A. We mitigate it by hardening Option B:
  1.  **Calibration Committees:** Narratives cannot be approved by a single manager. A cross-functional panel must review outliers to ensure "context" is being invoked consistently across similar roles.
  2.  **Blind Spot Checks:** 20% of narratives will be anonymized and reviewed by a separate ethics sub-committee to check for coded language or inconsistent standards.
  3.  **Outcome Auditing:** We will track promotion rates by demographic quarterly. If the narrative system produces disparate impact, we pause and recalibrate.

  ### Rollout Timeline

  Assuming approval next Thursday (10/26):

  *   **Phase 1: Framework Design (10/26 – 11/10)**
      *   Define the "Narrative Template" managers must use (required fields: role context, impact evidence, why standard metrics don't apply).
      *   Establish the Calibration Committee charter.
  *   **Phase 2: Manager Training (11/13 – 11/24)**
      *   Mandatory workshop on writing bias-aware justifications.
      *   Calibration Committee members trained on spotting inconsistent reasoning.
  *   **Phase 3: Pilot Cycle (12/01 – 01/15)**
      *   Run the new audit process on Q4 promotions for Engineering only.
      *   Collect data on time-to-decision and manager sentiment.
  *   **Phase 4: Review & Full Rollout (01/22 – 02/01)**
      *   Ethics panel reviews Pilot data (specifically checking for disparate impact).
      *   If greenlit, expand to Product and Design teams for the next cycle.

  ### Success Metrics

  We will consider this transition successful if:
  1.  **False Positive Rate:** Reduction in flagged "unfair" promotions that were actually legitimate role-specific contributions.
  2.  **Demographic Parity:** No increase in disparate impact compared to the universal metric baseline.
  3.  **Manager Confidence:** Survey score indicating managers feel the audit accurately reflects their team's value.

  ### Next Steps

  Please review this proposal before Thursday's vote. I will move to adopt Option B with the mitigation clauses listed above.
