answer: |-
  **Scenario**
  Consider a population of parasitic wasps possessing a neural mechanism $M$ that triggers an egg-laying motor command (state $N$). In the environment of evolutionary adaptedness, $M$ was selected because it responded to pheromone $\phi$, which was produced exclusively by a specific host caterpillar species, $H$; detecting $H$ was essential for reproductive success. Recently, however, $H$ has gone locally extinct. Currently, the only source of $\phi$ in the region is a synthetic chemical lure, $S$, emitted by nearby research traps. A wasp encounters $S$, mechanism $M$ activates, and the wasp tokens state $N$, attempting to lay eggs on the trap.

  **Analysis of Verdicts**
  For **Dretske** (on an informational/causal reading), the content of $N$ is determined by what the state currently carries information about, grounded in nomic or counterfactual dependence. Since $H$ is extinct, $N$ does not counterfactually depend on $H$ (if $H$ were present, it wouldn't exist to cause $N$); instead, $N$ reliably covaries with $S$. Thus, Dretske assigns the content *Synthetic Lure* (or *Pheromone Source*). For **Millikan**, content is determined by the *proper function* of the mechanism producing $N$, which is fixed by the selection history that explains $M$'s persistence. Since $M$ was selected for locating $H$, the proper function of $N$ is to indicate $H$, regardless of current causal availability. Thus, Millikan assigns the content *Host Caterpillar*.

  **Structural Feature and Removal**
  The divergence turns on the **decoupling of current causal reliability from historical selection conditions**. The structural feature doing the work is the *extinction of the original distal cause* ($H$) while the *proximal trigger* ($\phi$) remains causally efficacious via a new source ($S$). If you remove this feature by restoring $H$ to the environment so that $\phi$ is once again caused primarily by $H$, the counterfactual dependence (Dretske) and the success conditions (Millikan) realign. Both theories would then agree that the content of $N$ is *Host Caterpillar*, as the state would again carry information about $H$ and fulfill its historical function.

  **Counter-Attack**
  A defender of **Millikan** would attack the Dretskean verdict by arguing that it eliminates the possibility of *error*. If $N$ represents $S$, the wasp is correct, yet biologically it is behaving maladaptively (wasting eggs on traps). Millikan would argue Dretske has individuated the state type too narrowly (as a "pheromone detector" rather than a "host detector"). Conversely, a **Dretskean** might attack Millikan for allowing "ghost content"—representing an object ($H$) that does not exist and cannot enter into causal relations. They might argue that if the causal link is severed, the semantic link is broken, and Millikan is mistaking the *cause of the mechanism* for the *content of the state*.
