      *   *Cheapest Fix:* Reframe Proposition 1. It's not "Outside View Dominates," it's "Outside View is the Default *until* validity conditions fail."

      *   *Stability:* It's stable *if* Proposition 1 is softened. As written, it's brittle.

  9.  (Final Review of the Output): Ensure I answer the specific prompt questions: "which are genuinely in tension," "rank by severity," "which commitment has to go," "what giving it up costs," "why appearance arises."

