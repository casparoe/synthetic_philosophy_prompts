  7.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Wait, look at 3 again.* "The outside view doesn't even apply to the one question I actually care about." This is a massive admission. If the talk is about forecasting, and the user's main interest is immune to their main method, that's a problem.
      *   *Look at 4 again.* "5-10% on Soviet Union." This requires an Inside View argument (structural weakness, ideology, economics). If 1 says "Inside view is where overconfidence lives," then 4 contradicts 1 directly.
      *   *Resolution:* The user needs to distinguish between *High-Validity* environments (stable base rates) and *Low-Validity* environments (structural breaks/tech shifts). In High-Validity, Outside View dominates. In Low-Validity, Inside View/Mechanism is necessary, but uncertainty must be acknowledged (Prop 5).
