prompt: |-
  My friend Priya and I spent basically all of Saturday afternoon going round in circles on this, and I want to get down what we actually disagree about instead of the version we kept shouting past each other. She works in market microstructure and thinks the no-trade results are a lovely story about a world with no people in it; I'm the theory type who thinks that once you take Aumann's agreeing-to-disagree result and the Milgrom–Stokey no-trade theorem seriously, there just isn't room for rational agents with common priors to accomplish anything by trading against each other on beliefs. We could not get past this.

  So here's what I want: draft the joint statement the two of us should have produced, as if we'd done a proper adversarial collaboration with a mediator and everything. One camp is the common-prior no-trade camp: rational Bayesian agents, no speculative trade possible between them in equilibrium, and the corollary that most real trading volume must be something other than rational agents acting on private information. The other camp is the heterogeneous-priors / noise-trading side: real markets run on legitimate disagreement, liquidity needs, rebalancing and (yes) overconfidence, and the theorems only ever described a frictionless corner of it.

  The document should have these sections:

  1. A numbered list of agreed claims — and I mean claims both sides would actually sign, not vague pieties. Include what the no-trade results really establish once you state their assumptions instead of the slogan (common priors, common knowledge of rationality, and so on); that the sheer volume of daily trading is a real phenomenon needing explanation rather than a rounding error; that some version of the Grossman–Stiglitz point stands, i.e. perfectly informationally efficient prices are impossible because someone has to do the costly work of gathering information; plus whatever else you think both camps genuinely accept. No sneaking slanted phrasing into this section.

  2. A disagreements table: each remaining disagreement stated so that its own side would sign the wording. If one camp thinks the other's position rests on equivocating between "trade" and "speculative trade," that goes here with careful wording.

  3. The cruxes — the subquestions such that settling one would actually move at least one of us. I suspect one is whether differing priors are ever rational or always a mistake somewhere upstream, and another is how much of observed volume is hedging and liquidity demand versus pure disagreement. We also got properly stuck on whether "information" should include beliefs about other traders' beliefs, which might be half a verbal dispute — if any crux turns out to be just the two of us using a word differently, say so plainly instead of manufacturing a test for it.

  4. For each genuine crux, a concrete case, thought experiment, or observable market both sides would agree bears on it, with each side's prediction written down in advance. For the volume question, maybe something like a prediction market on an event nobody can hedge against (the Oscars, say, or an election in a country where none of the traders have any exposure) — if volume there looks just like volume everywhere else, that tells you something. But that's just my first thought; pick the cases yourself and don't feel bound to mine.

  Please write the whole thing in British English, and keep it honest — if after all that the residual disagreement is smaller than our Saturday argument suggested, I'd genuinely like to know which parts of it were noise.
