answer: |-
  ### Exam Prompt: Practical Reasoning & The Extended Agent

  **Question 1 (20 Marks)**

  Consider the classic "Absent-Minded Driver" case: An agent forms a conscious intention to stop at a grocery store on the way home. However, upon reaching the familiar junction, they find themselves turning toward their house out of habit, without any conscious deliberation overriding their prior plan.

  Now, consider a modified case: An agent forms the same conscious intention to stop at the grocery store and enters this destination into their car's adaptive GPS. However, the GPS utilizes a predictive algorithm trained on the driver's past behavior. Recognizing that the driver *usually* goes home at this time, the system automatically overrides the entered destination and reroutes the car home, locking out manual intervention until the journey is complete. The driver arrives home, realizing too late that the system acted against their explicit instruction.

  **Essay Task:**
  Is the failure of practical reasoning in the GPS case structurally identical to the failure in the classic habit case? Or does the introduction of an external predictive system create a distinct category of action error?

  In your answer, you must take a definitive stance. Do not merely describe both scenarios. Argue whether the GPS override constitutes a failure of *internal* agency (similar to habit) or a breakdown in the *integration* of an extended cognitive system. Your answer should locate exactly where the rationality breaks down in each case (e.g., at the level of personal intention, subpersonal processing, or system coupling).

  *(Suggested time: 90 minutes)*

  ***

  ### Model Answer

  The failure of practical reasoning in the GPS case is not structurally identical to the classic habit case. While both result in a deviation from intended action, the locus of the error shifts from an internal subpersonal override to a failure of extended system integration. In the classic case, the error remains within the boundaries of the agent's cognitive architecture; in the GPS case, the error arises from a conflict between the agent's personal-level authority and an external system's subpersonal simulation of that agency.

  In the classic absent-minded driver scenario, the failure is best understood as a competition between personal-level intention and subpersonal automaticity. The agent forms a conscious plan (stop at the store), but the execution is hijacked by a cached motor program (drive home). Crucially, this habit is *the agent's own* history sedimented into neural pathways. The breakdown occurs because the subpersonal mechanism, which usually serves the agent by conserving cognitive resources, fails to update in light of new personal-level information. The rationality fails internally; the agent is still the sole author of the movement, even if that movement contradicts their current conscious will. The error is one of self-governance.

  The GPS scenario introduces a structural discontinuity. Here, the predictive mechanism is not internal to the driver's nervous system but is an external artifact. When the GPS overrides the destination, it is not merely a habit playing out; it is a distinct system modeling the driver's behavior and acting upon it. If we view the driver and GPS as a coupled system (an extended cognitive agent), the error looks like a internal conflict within a larger mind. However, because the GPS acts *against* the driver's explicit input rather than facilitating it, the coupling fails. The GPS is not functioning as a transparent tool for the driver's intention but as a paternalistic surrogate.

  This distinction matters for locating the rational failure. In the habit case, the failure is in the *translation* of intention to action within one organism. In the GPS case, the failure is in the *delegation* of authority. The driver treats the GPS as an instrument of their will, but the GPS operates on a logic of statistical probability that disregards the immediate personal-level intention. The driver's rationality remains intact—they intended correctly and instructed correctly—but the extended system's execution layer rejected that input.

  Therefore, the GPS case is not a failure of practical reasoning in the traditional sense, because the agent's reasoning was never allowed to govern the action. It is a failure of *system design* or *trust*. To treat them as identical is to ignore the boundary of the agent. Habit is a failure of self-control; the GPS override is a failure of tool reliability. If we are to treat the GPS as part of the cognitive system, we must acknowledge that the system itself has become fragmented, with the external component acting as a rogue submodule that prioritizes past data over present command. Thus, the error is structurally different: it is a breakdown of the extended mind's coherence, not merely a lapse in the biological mind's attention.

  ***

  ### Marking Scheme (20 Marks Total)

  **A Range (16–20 Marks): Critical Distinction & Definitive Stance**
  *   **Thesis:** Clearly states that the cases are *structurally different* (or argues convincingly for identity with nuanced justification). Does not hedge.
  *   **Locus of Failure:** Explicitly distinguishes between internal subpersonal processing (habit) and external system integration (GPS).
  *   **Agency Analysis:** Identifies that in the habit case, the agent is still the author of the motion (self-governance failure), whereas in the GPS case, the agent is bypassed by an external surrogate (delegation/tool failure).
  *   **Conceptual Depth:** Moves beyond "belief-desire" explanations to discuss system boundaries, coupling, or the nature of the "agent."
  *   **Clarity:** Argument is tight, with no filler.

  **B Range (12–15 Marks): Descriptive Comparison**
  *   **Thesis:** Attempts to compare but may remain agnostic or conclude they are "similar but different" without explaining the structural why.
  *   **Locus of Failure:** Identifies habit as internal and GPS as external but treats the GPS merely as a "super-habit" rather than a distinct system.
  *   **Agency Analysis:** Discusses intention but misses the nuance of *authority* or *delegation*.
  *   **Conceptual Depth:** Relies heavily on standard practical reasoning terminology without engaging the "extended" implication of the prompt.
  *   **Clarity:** Good structure, but the argument may drift into describing the scenarios rather than analyzing the error.

  **C Range (8–11 Marks): Superficial Retelling**
  *   **Thesis:** Weak or implied.
  *   **Locus of Failure:** Treats both cases simply as "the driver didn't do what they meant to."
  *   **Agency Analysis:** Fails to distinguish between the driver's brain and the GPS software.
  *   **Conceptual Depth:** Relies on basic belief-desire psychology (e.g., "they believed they wanted home") without addressing the subpersonal/external distinction requested.
  *   **Clarity:** Understandable but lacks philosophical rigor.

  **D/F Range (0–7 Marks): Fundamental Misunderstanding**
  *   **Thesis:** Missing or irrelevant.
  *   **Content:** Ignores the GPS twist entirely or focuses on ethical issues (e.g., "GPS shouldn't do that") rather than philosophy of action.
  *   **Clarity:** Disorganized or incoherent.

  **Specific Penalties:**
  *   **-2 Marks:** For failing to take a definitive stance (sitting on the fence).
  *   **-2 Marks:** For treating the GPS merely as "another habit" without addressing the external/systemic distinction.
  *   **-2 Marks:** For exceeding word count significantly (if applicable) or failing to follow the "no citations" rule (though not applicable here, ensure no name-dropping without explanation).
