answer: |-
  **Exam Question**

  **Course:** PHI 540: Philosophy of Archaeological Inference
  **Time:** 90 Minutes
  **Total Marks:** 20

  **Prompt:**
  Consider a hypothetical prehistoric settlement, *Site Alpha*, dating to a period without textual records. Excavations reveal two primary material patterns: (1) a cluster of highly standardized, large-capacity storage pits located centrally within the settlement, and (2) uniform grave goods across all burials, including small vessels identical in form to those found in the storage cluster. There is no evidence of elite residential architecture or fortification.

  Archaeologists propose two competing hypotheses to explain these patterns:
  *   **H1 (Institutional):** The pits indicate a centralized system of economic redistribution managed by an emergent administrative body.
  *   **H2 (Representational):** The pits and goods indicate a shared cosmological obligation to deposit surplus as ritual offerings to ancestors or deities.

  Write a coherent essay that addresses the following five points in order:
  1.  Identify the specific **auxiliary assumptions** required to bridge the gap between the material evidence (pits) and H1 (economic redistribution).
  2.  Identify the parallel **auxiliary assumptions** required to bridge the gap between the same evidence and H2 (cosmological obligation).
  3.  Explain why these two inference structures are **observationally symmetrical** given the current data.
  4.  Specify what kind of **comparative or negative evidence** would genuinely discriminate between H1 and H2, without merely appealing to parsimony or the need for "more context."
  5.  State what this symmetry implies about the **limits of archaeological inference** regarding social institutions versus collective representations.

  ***

  **Model Answer**

  To evaluate the competing hypotheses regarding *Site Alpha*, one must analyze the auxiliary assumptions that render the material record intelligible. Underdetermination exists because the physical traces of compliance are identical regardless of whether the motivating force is coercive administration or devotional consensus.

  First, inferring **centralized economic redistribution (H1)** from standardized storage pits requires specific auxiliary assumptions regarding agency and function. We must assume that standardization implies administrative control rather than shared technological tradition. Specifically, the inference relies on the premise that surplus accumulation of this scale is inefficient for individual households and therefore necessitates a managing authority. Furthermore, it assumes that the location of the pits (central) correlates with political centrality rather than ritual sanctity. Crucially, H1 assumes that the uniformity of grave goods reflects a standardized rationing system or status leveling enforced by the redistributive body, rather than voluntary equality. Without assuming that storage equals *accounting* and centrality equals *authority*, the pits remain merely holes in the ground.

  Second, inferring **shared cosmological obligation (H2)** requires a parallel set of assumptions regarding meaning and practice. Here, the auxiliary assumption is that standardization reflects ritual prescription rather than administrative efficiency. We must assume that the deposition of goods into pits and graves is a performative act of devotion, where the uniformity signifies equal standing before the divine rather than equal rationing by the state. This hypothesis assumes that "surplus" is not being stored for future caloric consumption but is being removed from circulation as an offering. The bridge premise here is that material uniformity signals shared belief systems and normative pressure, not necessarily top-down coercion. It posits that the central location marks a sacred precinct, not a bureaucratic center.

  Third, these inference structures are **observationally symmetrical** because the material correlates of *coercion* and *consensus* often converge in the archaeological record. Both hypotheses predict the same outcome: regularized behavior resulting in uniform material deposits. Whether a farmer deposits grain because a tax collector demands it or because a priest declares it necessary for the harvest, the physical trace—the grain in the pit—is identical. The symmetry arises because archaeology primarily accesses *practice* (what was done) rather than *motive* (why it was done). As long as the compliance rate is high in both scenarios, the statistical distribution of artifacts remains indistinguishable. The material record captures the fact of regularity, but remains silent on the source of the normativity enforcing that regularity.

  Fourth, to **discriminate between H1 and H2**, one cannot simply look for "more evidence" of hierarchy; one must look for evidence of *asymmetry in consumption* or *biological stress*. If H1 is true, the administrators managing the redistribution typically consume a disproportionate share of the surplus. Therefore, bioarchaeological evidence showing significantly better nutrition or lower stress markers in individuals buried near the storage pits would support H1. Conversely, if H2 is true, the surplus is removed from circulation or consumed communally during ritual events. Evidence that the storage pits contain goods that were intentionally spoiled or burned (rendered useless for economic exchange) would support H2. Additionally, finding evidence of *resistance* (e.g., hidden private caches contradicting the central pits) would suggest economic coercion (H1), whereas uniformity in private domestic contexts would support cosmological consensus (H2). The discriminator is not the presence of storage, but the differential biological or spatial outcomes of that storage.

  Finally, this symmetry implies a hard **limit on archaeological inference** regarding the distinction between institutions and representations. We can infer the existence of normative order—that people were compelled to act uniformly—but we cannot definitively isolate the *source* of that normativity (force vs. faith) without independent lines of evidence regarding differential access to resources. This suggests that archaeology is better suited to reconstructing systems of *practice* and *constraint* than systems of *meaning* or *governance*. When institutional power and religious authority produce identical material regularities, the archaeological record underdetermines the nature of the social contract. We reach an epistemic ceiling where we can describe the structure of compliance, but not the psychology or politics that sustained it.

  ***

  **Marking Scheme**

  **Total Marks:** 20 (4 marks per section)

  | **Analytical Move** | **Criteria for Full Marks (4)** | **Typical Candidate Failure** |
  | :--- | :--- | :--- |
  | **1. Economic Auxiliaries** | Identifies assumptions linking standardization to *administration/control* and centrality to *authority* (e.g., surplus implies management). | Treats the pits as self-evidently economic; fails to articulate the *assumption* that standardization = control. |
  | **2. Cosmological Auxiliaries** | Identifies assumptions linking standardization to *ritual prescription* and deposition to *offering/removal* (e.g., uniformity = belief). | Dismisses H2 as "speculative" without identifying the logical bridge premises required to make it valid. |
  | **3. Observational Symmetry** | Explains that *compliance* looks the same materially regardless of *motive* (coercion vs. consensus); focuses on practice vs. motive. | Claims the patterns are actually different; or argues symmetry exists only because "we don't have texts" (missing the structural point). |
  | **4. Discriminating Evidence** | Proposes specific structural tests (e.g., bioarchaeological stress, differential consumption, evidence of resistance/spoiling). | Appeals to "finding a palace/temple" (circular); or relies on "parsimony" or "more context" as the discriminator. |
  | **5. Epistemic Limits** | Concludes that archaeology accesses *practice/constraint* better than *meaning/politics*; acknowledges the underdetermination of social contracts. | Concludes that "science will eventually solve it"; or fails to generalize beyond the specific case to the limits of inference. |
