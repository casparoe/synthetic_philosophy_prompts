  ## II. The Dichotomous Key
  *Instructions: Start at Question 1. Answer based strictly on the situation described. Follow the arrow to the next question or the terminal Leaf.*

  **Q1. Does this utterance require the speaker to have a specific official job, title, or rulebook to work?**
  *(e.g., A judge, a priest, a statute, a system admin vs. any random person)*
  *   **YES** → Go to **Q2** (Institutional Acts)
  *   **NO** → Go to **Q5** (Ordinary Acts)

  **Q2. Does saying this make something true or change a status immediately?**
  *(e.g., "You are hired," "I sentence you," vs. "I think he is guilty")*
  *   **YES** → Go to **Q3** (Transformative Institutional)
  *   **NO** → Go to **Q4** (Non-Transformative Institutional)

  **Q3. Does it also bind someone to do something later?**
  *(e.g., A contract vs. a marriage vow vs. a verdict)*
  *   **YES** → **Leaf 1: Institutional Commissives (Contracts)**
  *   **NO** → **Leaf 2: Declarations**

  **Q4. Is the main point to describe how things are?**
  *(e.g., A referee's call, a jury verdict, an umpire's "Strike")*
  *   **YES** → **Leaf 3: Verdictives**
  *   **NO** → **Leaf 4: Institutional Phatic/Perlocutionary**

  **Q5. Does saying this make something true just by being said?**
  *(e.g., "I am speaking," "I hereby deny it" without special power)*
  *   **YES** → **Leaf 5: Self-Verifying Performatives**
  *   **NO** → Go to **Q6**

  **Q6. Is the speaker claiming that something is already true?**
  *(e.g., "It is raining," "The cat is on the mat")*
  *   **YES** → **Leaf 6: Assertives**
  *   **NO** → Go to **Q7**

  **Q7. Does this commit someone to doing something in the future?**
  *(e.g., "I will go," "Please go")*
  *   **YES** → Go to **Q8**
  *   **NO** → Go to **Q9**

  **Q8. Is it the *speaker* who is committed to act?**
  *(e.g., "I promise" vs. "You must")*
  *   **YES** → **Leaf 7: Commissives**
  *   **NO** → **Leaf 8: Directives**

  **Q9. Is the main point to show a feeling or attitude?**
  *(e.g., "I'm sorry," "Congratulations," "Thank you")*
  *   **YES** → Go to **Q10**
  *   **NO** → **Leaf 9: Perlocutionary Effects Only**

  **Q10. Is the feeling directed at the hearer's past conduct?**
  *(e.g., Thanking, Congratulating, Apologizing vs. generic joy/grief)*
  *   **YES** → **Leaf 10: Acknowledgments (Behabitives)**
  *   **NO** → **Leaf 11: Expressives**

  **Q11. (Special Conditions) Is the utterance happening in a play, poem, or fiction?**
  *   **YES** → **Leaf 12: Etiolated Acts**
  *   **NO** → Go to **Q12**

  **Q12. Is the "speaker" a machine, recording, or text with no human present?**
  *(e.g., Chatbot, Recorded Announcement, Statutory Notice)*
  *   **YES** → Go to **Q13**
  *   **NO** → **Leaf 13: Indirect Speech Acts (Hints)**

  **Q13. Does the system change reality automatically upon condition met?**
  *(e.g., Smart Contract vs. Recorded Apology)*
  *   **YES** → **Leaf 14: Automated/Algorithmic Acts**
  *   **NO** → **Leaf 4: Institutional Phatic/Perlocutionary** (Recycled for non-agentive institutional noise)

  ***

  ## III. Terminal Leaves

  **Leaf 1: Institutional Commissives (Contracts)**
  *   **Canonical Example:** Signing a lease agreement.
  *   **Uncomfortable Case:** A verbal agreement in a jurisdiction that requires writing; is it a failed contract or a successful commissive?

  **Leaf 2: Declarations**
  *   **Canonical Example:** "I now pronounce you husband and wife."
  *   **Uncomfortable Case:** A posthumous degree; the declaration fits the world, but the recipient cannot uptake it.

  **Leaf 3: Verdictives**
  *   **Canonical Example:** A jury foreperson saying, "We find the defendant not guilty."
  *   **Uncomfortable Case:** A referee's call that is instantly overturned by VAR; was the verdictive successful until reversed?

  **Leaf 4: Institutional Phatic/Perlocutionary**
  *   **Canonical Example:** A recorded station announcement: "We are sorry for the delay."
  *   **Uncomfortable Case:** No one is actually sorry; is it a lie, an expressive, or just noise?

  **Leaf 5: Self-Verifying Performatives**
  *   **Canonical Example:** "I assert that I am now making an assertion."
  *   **Uncomfortable Case:** "I promise that I will never promise anything again"; the act cancels its own future validity.

  **Leaf 6: Assertives**
  *   **Canonical Example:** "The cat is on the mat."
  *   **Uncomfortable Case:** "I am hereby speaking"; looks assertive but is self-verifying (Leaf 5).

  **Leaf 7: Commissives**
  *   **Canonical Example:** "I promise to pay you Tuesday."
  *   **Uncomfortable Case:** An actor on stage saying, "I promise to pay him Tuesday"; looks commissive but is etiolated (Leaf 12).

  **Leaf 8: Directives**
  *   **Canonical Example:** "Please close the door."
  *   **Uncomfortable Case:** "Can you pass the salt?"; grammatically assertive/interrogative, functionally directive (Leaf 13).

  **Leaf 9: Perlocutionary Effects Only**
  *   **Canonical Example:** Persuading someone by accident, or startling them.
  *   **Uncomfortable Case:** A statutory notice "deemed served" where nobody read it; effect occurs without uptake.

  **Leaf 10: Acknowledgments (Behabitives)**
  *   **Canonical Example:** "Thank you for your help."
  *   **Uncomfortable Case:** Automated customer service: "I understand how frustrating this is"; the corporation feels nothing.

  **Leaf 11: Expressives**
  *   **Canonical Example:** "Ouch!" or "Hurray!"
  *   **Uncomfortable Case:** Polite formulae ("How do you do?") where no feeling is actually expressed.

  **Leaf 12: Etiolated Acts**
  *   **Canonical Example:** An actor saying "I do" in a play.
  *   **Uncomfortable Case:** Method acting where the actor actually feels the emotion; is it still etiolated?

  **Leaf 13: Indirect Speech Acts (Hints)**
  *   **Canonical Example:** "It's cold in here" (meaning: close the window).
  *   **Uncomfortable Case:** Sarcasm; the literal meaning is assertive, the intended meaning is expressive/directive.

  **Leaf 14: Automated/Algorithmic Acts**
  *   **Canonical Example:** A smart contract transferring assets when a condition is met.
  *   **Uncomfortable Case:** Who is the speaker? The coder, the user, or the code?

  ***

  ## IV. Collapsed Pairs
  *This key cannot genuinely separate the following pairs without stipulative definitions. They occupy the same logical cell.*

  1.  **Behabitives (Austin) and Expressives (Searle):** Both sit in [No Institution, No Fit, No Obligation, Feeling=Yes]. The key splits them by *target* (past conduct vs. general state), but thanking and congratulating often function identically to generic expressing of joy.
  2.  **Verdictives and Assertive-Declarations:** Both sit in [Institution, Descriptive]. A jury verdict describes the facts but *makes* the legal status true. The key forces a choice at Q2/Q4, but in practice, these acts are simultaneous.

  ***

  ## V. Test Set Results
  *Eight specific cases from the seminar run through the Key.*

  1.  **Recorded voice apology ("Sorry for the delay"):**
      *   *Path:* Q1(Yes, Institutional) → Q2(No) → Q4(No, not describing fact) → **Leaf 4**.
      *   *Verdict:* **Institutional Phatic/Perlocutionary**.
      *   *Note:* Correctly identifies the lack of sincere speaker.

  2.  **Statutory notice ("Deemed served"):**
      *   *Path:* Q1(Yes) → Q2(Yes, changes legal status) → Q3(No) → **Leaf 2**.
      *   *Verdict:* **Declaration**.
      *   *Note:* Lands in Declaration, but "No Speaker" makes Leaf 2 uncomfortable (see Leaf 2 note).

  3.  **Actor on stage ("I promise"):**
      *   *Path:* Q1(No, fiction isn't official) → Q5(No) → Q6(No) → Q7(Yes) → Q8(Yes) → **Leaf 7**.
      *   *Correction:* Must catch at **Q11** (Special Conditions).
      *   *Verdict:* **Etiolated Acts**.
      *   *Note:* Requires user to know to check Q11 *before* finalizing Leaf 7. Key structure assumes Q11 is a safety net.

  4.  **"I promise never to promise again":**
      *   *Path:* Q1(No) → Q5(Yes, self-verifying) → **Leaf 5**.
      *   *Verdict:* **Self-Verifying Performatives**.
      *   *Note:* Correctly isolates the paradox.

  5.  **"I assert that I am now making an assertion":**
      *   *Path:* Q1(No) → Q5(Yes) → **Leaf 5**.
      *   *Verdict:* **Self-Verifying Performatives**.
      *   *Note:* Distinguishes from Leaf 6 (Assertives).

  6.  **Invalid officiant vs. Common-law:**
      *   *Path:* Q1(Yes) → Q2(Yes) → Q3(No) → **Leaf 2**.
      *   *Verdict:* **Declaration**.
      *   *Note:* The key classifies the *attempt*. The "Invalid" case is a Failed Declaration (Leaf 2 uncomfortable case). Common-law is a successful Declaration.

  7.  **Smart contract:**
      *   *Path:* Q1(Yes, coded rules) → Q2(Yes) → Q3(Yes, binds transfer) → **Leaf 14**.
      *   *Verdict:* **Automated/Algorithmic Acts**.
      *   *Note:* Successfully separates from human Contracts (Leaf 1).

  8.  **Chatbot empathy ("I understand"):**
      *   *Path:* Q1(Yes, corporate script) → Q2(No) → Q4(No) → Q12(Yes) → Q13(No) → **Leaf 4**.
      *   *Verdict:* **Institutional Phatic/Perlocutionary**.
      *   *Note:* Could arguably be Leaf 10 (Acknowledgments), but Q12 diverts non-humans to Leaf 4/14. This highlights the "Speaker/Composer" split problem.

  **Anomaly Report:**
  *   **Statutory Notice:** Lands in **Leaf 2 (Declarations)**, but Declarations traditionally require an utterance. A text that operates without a reader strains the "utterance-in-context" definition.
  *   **Chatbot:** Lands in **Leaf 4**, but functions socially as **Leaf 10 (Acknowledgments)**. The key prioritizes the *ontological status* of the speaker (User's view) over the *social function* (Colleague's view), forcing it into Phatic rather than Expressive. This adjudicates the disagreement in favor of the User.
