  # The Speech Act Field Guide: Logical Space and Key

  ## I. The Logical Space
  To adjudicate the disagreement between **Institutional Priority** (User) and **Fit/Change Priority** (Colleague), we define the logical space using four binary features. This yields 16 possible combinations ($2^4$). The categories below are mapped into this space; empty cells are marked with their theoretical status.

  **The Four Features:**
  1.  **Institutional Anchor:** Does the act require a specific role, rulebook, or convention to succeed? (Yes/No)
  2.  **Transformative (World-to-Word):** Does the utterance attempt to change reality to match the words? (Yes/No)
  3.  **Descriptive (Word-to-World):** Does the utterance attempt to match words to an independent reality? (Yes/No)
  4.  **Obligatory:** Does the act bind someone to future conduct? (Yes/No)

  **The Matrix of Combinations:**

  | # | Inst. | Trans. | Desc. | Obl. | Category Occupying Cell | Status of Empty Cells |
  | :--- | :---: | :---: | :---: | :---: | :--- | :--- |
  | 1 | No | No | No | No | **Expressives / Behabitives** | |
  | 2 | No | No | No | Yes | **Commissives / Directives** | (Split by *who* is bound) |
  | 3 | No | No | Yes | No | **Assertives / Expositives** | |
  | 4 | No | Yes | No | No | **Self-Verifying Performatives** | |
  | 5 | No | Yes | Yes | No | *Empty* | **Incoherent** (Magic; requires power to create truth by describing it) |
  | 6 | No | Yes | No | Yes | *Empty* | **Unattractive** (Redundant; creating reality usually supersedes binding) |
  | 7 | No | Yes | Yes | Yes | *Empty* | **Incoherent** (God-like; creates, describes, and binds without convention) |
  | 8 | No | No | Yes | Yes | *Empty* | **Undefended** (Asserting usually doesn't bind conduct, only belief) |
  | 9 | Yes | No | No | No | **Perlocutionary / Phatic** | (Institutional context, no illocutionary force) |
  | 10 | Yes | No | No | Yes | **Institutional Directives/Commissives** | (Sub-type of Dir/Com) |
  | 11 | Yes | No | Yes | No | **Verdictives** | |
  | 12 | Yes | Yes | No | No | **Declarations** | |
  | 13 | Yes | Yes | Yes | No | **Assertive-Declarations** | (Verdictives that change status) |
  | 14 | Yes | Yes | No | Yes | **Contracts / Statutes** | (Declaration + Commissive) |
  | 15 | Yes | Yes | Yes | Yes | *Empty* | **Incoherent** (Over-determined; creates, describes, and binds) |
  | 16 | Yes | No | Yes | Yes | *Empty* | **Unattractive** (Institutional assertion rarely binds conduct directly) |

