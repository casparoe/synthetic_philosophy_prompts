  The Constitutional Convention drafted a flawless charter, save for one clause: "No amendment is valid unless ratified by this Charter."

  When it came time to adopt the document, the delegates froze. The Charter couldn't ratify itself before it existed. They were trapped in a formal system with no axioms.

  Finally, Gouverneur Morris stood. "I move to adopt."

  "Objection!" cried the Chair. "You lack standing! The Charter forbids self-creation!"

  "The Charter forbids nothing," Morris said. "It is currently scrap paper. Its authority derives precisely from the fact that, at this moment, no charter exists. So let us ratify it now, before it acquires the power to forbid us."

  The gavel fell. They hadn't broken the rules; they had JOOTSed before the system was built.
