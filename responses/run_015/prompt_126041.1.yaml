  **The Scenario**

  You are wrapping a birthday present for your niece. On the table sit two identical boxes of crayons, indistinguishable in price, quality, or contents, and you hold no prior preference for either. You must wrap exactly one to give as the gift, leaving the other as a spare, and failing to choose means she receives nothing. You cannot satisfy the occasion by flipping a coin, because the point of the gift is to express personal care; telling her 'I randomised your present' undermines the gesture, whereas 'I picked this one' affirms it. By deciding to wrap the left box, you do not discover a reason it was better, but you create the reason it is now the gift: your decision converts two equivalent options into one chosen object and one discarded alternative, making it the case that you have most reason to wrap the left one simply because you have settled on it.

  ***

  **The Check**

  *   **Structural Symmetry:** The boxes are physically and normatively identical ex ante; swapping 'left' and 'right' changes nothing in the setup.
  *   **Cost of Drifting:** Indecision results in no gift, which is determinately worse than giving either box.
  *   **Why a Coin Fails:** It fails not because chance is banned, but because the *purpose* of the act is expressive. A coin cannot express care; only an agent's will can. "I flipped" abdicates the authorship required by the context.
  *   **No Preference Cheating:** You do not suddenly prefer the left box; you merely select it.
  *   **No Payoff Cheating:** The box's physical properties don't change. Its normative status changes from 'candidate' to 'gift', but only *because* of the decision, not due to independent circumstances.

  **Three Views on the Case**

  1.  **The Permissibility View (e.g., Joseph Raz):** Both boxes are rationally permissible. Rationality runs out once reasons are equal. On this view, your decision is merely a psychological cause, not a normative justification. *Critique:* This cannot explain why "I flipped a coin" is a failure; if both are permissible, a randomiser should be an acceptable way to pick.
  2.  **The Uniqueness View (Rational Determinism):** Rationality always demands a single best option. If you perceive a tie, your description is flawed; there must be a microscopic difference you missed. *Critique:* This denies the premise of the case. It forces you to lie to your student by insisting the boxes weren't actually identical.
  3.  **The Procedural View (Randomisation):** When reasons are equal, hand the choice to a fair procedure (coin, rule). *Critique:* This solves the selection problem but fails the *agency* problem. It treats the choice as a problem of distribution rather than commitment, missing why "I chose" carries weight that "Chance chose" does not.

  **The Working Feature**

  The feature doing the work is the **expressive requirement of authorship**. The act is not just about securing an outcome (crayons delivered); it is about constituting a relationship (gift-giving). The value lies in the *source* of the selection being your will.

  *   **If Removed:** If you were merely storing the boxes for later use, the expressive requirement vanishes. A coin becomes perfectly acceptable because authorship no longer matters.
  *   **The Proceduralist Attack:** A proceduralist will argue: "Commit to the coin. Then 'I chose to follow the coin' is an act of will."
  *   **The Response:** This is cheating. The niece cares that *you* selected the object, not that you selected a procedure. Outsourcing the selection to chance, even voluntarily, dilutes the specific care the gesture is meant to convey.
  *   **Tie-Breaking vs. Tie-Dissolving:** The distinction survives. **Tie-breaking** leaves the options normatively equal (either would have been fine) and uses an external arbiter to move the body. **Tie-dissolving** uses the will to alter the normative landscape: once decided, the left box *is* the gift and the right *is not*, creating a new reason (consistency/commitment) that did not exist before. The weighing stops because the options are no longer equivalents.

  **Vocabulary**

  Your distinction maps closely onto **Edna Ullmann-Margalit and Sidney Morgenbesser's** distinction between *Picking* (arbitrary selection between indifferent options) and *Choosing* (selection based on reasons). However, your 'tie-dissolving' goes further, aligning with **Voluntarism** or **Normative Power** theories (e.g., **Christine Korsgaard** or **Michael Bratman**): the idea that the act of volition itself generates reasons (like the reason to be consistent with one's prior intentions). You might also refer to this as **Constitutive Normativity**: the decision constitutes the status of the object rather than discovering it.
