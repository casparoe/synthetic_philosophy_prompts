answer: |-
  ### The Weight of Stone

  The chisel felt heavy in my hand, heavier than the stone it sought to break. Outside the workshop, the heat shimmered off the plaza, distorting the faces of the ancestors lined up in rows. They were all here, frozen in limestone: King after king, jaguar helmets fixed in eternal scowls, feet stepping on captives who would never rise.

  The Ajaw wanted another one. He wanted the date of the K'atun ending carved into the bedrock of the hill, a declaration that we were still here, still strong, still eternal.

  "They say the rain comes later now," I said to the master mason. He didn't look up from his grinding stone.

  "The rain comes when the gods will it," he muttered.

  "No," I said, putting the chisel down. "The clouds gather over the mountains and pass us by. The maize is thin. The people are walking away from the center. If we carve this stone, we are lying."

  The mason finally looked at me. "It is the way of the Ajaw. To mark time."

  "Time does not stop for stone," I said. "Stone is a trap. It pretends that today is forever. But we are not forever. We are breathing."

  I walked away from the quarry, down into the city where the grass was growing between the paving stones. In the inner room of the temple, where the light was cool and green, I unrolled the bark paper. It was white, beaten from the fig tree, soft as skin. The ink pot sat ready, made of soot and orchid juice.

  The Ajaw found me there. He was angry, his jade earspools clacking against his neck. "Where is the stela? The K'atun ends in five days. The history must be fixed."

  "It is fixed," I said, dipping the brush. "But not in stone. Stone rots the truth. It makes a lie permanent. If we write on this," I touched the bark, "we admit that we are temporary. We admit that the record might burn, or rot, or be eaten by insects. That is the truth of men."

  "The future will not see us," the Ajaw snapped. "They will think we vanished."

  "Let them think what they like," I said, making the first mark. The ink soaked into the fiber instantly, alive, moving. "If they only value what survives the rot, they deserve only the silence. I am writing for now. I am writing for the breath in my lungs, not for the eyes of strangers who will walk over our bones."

  The Ajaw stared at the soft white paper. He looked at the hard stone outside. For a moment, I thought he would order me to stop. Instead, he sat. He watched me write the date. He watched me write the harvest numbers, the births, the deaths, the things that usually never made it onto the monument because they were too small, too human.

  "Will it last?" he asked quietly.

  "No," I said. "In a hundred years, this will be dust. In a thousand, nothing."

  "Then why write it?"

  "Because we are here," I said. "And because letting go is harder than holding on."

  We filled the room with books. We stopped the quarry. When the enemies came, or the drought took us, or the city was swallowed by the jungle, they would find only broken stone and empty plazas. They would call it a collapse. They would say we failed.

  Let them. We chose to be fluid. We chose to be memory instead of monument. I rolled the last codex and tied it with cotton string. It was light enough to carry in one hand. It was heavy enough to hold a world.

  ***

  ### Archaeological Note & Critique

  You asked me to be straight if your premise forces a false binary or leans on contested readings. Here is the breakdown of where the story aligns with evidence and where it takes creative liberty.

  **1. The "Illusion" of Collapse (Valid Point)**
  You are correct that the "collapse" is partially an archaeological bias. The Classic Maya civilization didn't vanish; the people remained. What vanished was the *institution* of divine kingship and the specific practice of monumental construction in the southern lowlands. The survival bias of limestone vs. perishable materials is real. We have almost no Classic-era bark paper (codices) because the humid jungle destroys them, whereas stone survives. So, the idea that a rich historical record exists but rotted away is scientifically plausible.

  **2. The "Deliberate Choice" (Contested/False Binary)**
  This is where the premise forces a binary between "failure" and "transformation." Most archaeologists argue the cessation of stelae wasn't a philosophical choice for "invisibility," but a symptom of political fragmentation.
  *   **Stelae were propaganda:** They were commissioned by *K'uhul Ajaw* (Holy Lords) to legitimize their divine status. When drought, warfare, and trade disruption weakened these kings, they lost the labor force and authority to carve stone.
  *   **Systemic Failure:** It wasn't just a switch in materials; populations actually declined sharply in the southern lowlands due to environmental stress and overpopulation. Framing it *only* as a choice ignores the very real suffering and demographic crash that occurred.
  *   **The Binary:** It isn't "Failure vs. Change." It was "Failure of a Political System → Forced Change in Cultural Practice." The shift to perishable records likely happened, but probably because the centralized state couldn't support stone carving anymore, not necessarily because they wanted to hide from the future.

  **3. The Timeline**
  By the Terminal Classic (800–900 AD), the tradition of carving dated stelae was indeed dying out. However, the Maya continued to build and write in the Post-Classic period (like at Chichén Itzá or Mayapán), just differently. The story frames this as a singular moment of decision by a scribe, which is a narrative device. In reality, this was a gradual regional decline over a century.

  **Verdict:** Your premise is a compelling piece of historical fiction that highlights the *survival bias* of archaeology. However, treat it as a metaphor for resilience rather than literal historical causality. The "collapse" was real in terms of population and political complexity, not just an illusion of rotting paper.
