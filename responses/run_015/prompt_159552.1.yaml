      *   *Specific Cicero point:* The "treasure" joke. He thinks old men remember what matters. The test measures "deliberative memory". Cicero might say if you lived well, you don't need a test to prove you remember your values.
      *   *Specific Policy point:* The test rewards stubbornness. Cicero values adaptability of wisdom (steering the ship), not rigidly holding the tiller against the wind.
      *   *Specific Policy point:* State counsellor. Cicero values counsel, but as a relationship of respect, not guardianship over a competent adult.

  7.  **Final Polish:** Ensure flow and continuity. Make sure the transition from the personal (gran) to the theoretical (Cicero) to the political (Check) is smooth. Ensure the conclusion is clear.

      *Drafting thought:* Start by validating the user's situation. It's a tough spot. Then move to Cicero. He would see the Check as a fundamental misunderstanding of *auctoritas*. It's not about capacity tests; it's about reputation. The test measures the wrong thing (stubbornness). The penalty (property) removes the means to be useful. He'd say if you didn't know who was virtuous by 82, the republic is already sick.

      *Wait, one nuance:* Cicero was a legalist. He might appreciate *some* mechanism to prevent incompetence. But the *blanket* nature and the *age* (82 vs 84 Cato) and the *method* (app) would be the dealbreakers. He'd prefer a case-by-case assessment based on reputation, not a bureaucratic hurdle. I need to make sure I don't make him sound too modern/liberal. He cares about the State's safety. But he thinks the State is safe when elders are respected, not policed.

