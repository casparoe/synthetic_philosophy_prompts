answer: |-
  You're a lift engineer. You know that sometimes a machine works perfectly, but if the safety cable was installed by someone who was beating their apprentice while they did it, you might not trust the lift. Other times, the installer is a monster at home, but the wiring is up to code, and the lift runs safe. You're trying to figure out if art is the lift, or the wiring, or the installer.

  Your brother's rule is a good starting blueprint, but it's too simple for the load you're putting on it. It treats "badness" like a binary switch (In the Work vs. In the Person), but your gut reactions show you're actually measuring **Proximity** and **Complicity**.

  Here is the repaired principle, the verdict on your specific headaches, and the one case you need to settle to lock this in.

  ### The Repaired Principle: The "Embedded Harm" Test

  Your brother says: *Bad in work = worse work. Bad in person = ethical choice only.*
  **The Repair:** *Badness only taints the work's quality if the harm is **embedded** in the experience of the work, or if enjoying the work makes you **complicit** in the harm.*

  This splits "Bad in the work" into two categories:
  1.  **Depicted Harm:** (Horror, Satire). If the harm is fake, or if the work is laughing *at* the badness, the work remains structurally sound.
  2.  **Endorsed/Real Harm:** (Massacre lyrics, Punching down). If the work asks you to enjoy real suffering, or validates a harmful view, the work itself is compromised.

  This splits "Bad in the person" into two categories:
  1.  **Biographical Harm:** (Abuse at home). Distant from the object. The lift works; the installer is a jerk.
  2.  **Production Harm:** (Abuse on set). The harm happened *during the making of this specific object*. The lift was installed while the apprentice was being beaten. The object itself is evidence of the crime.

  ### Testing Your Eight Cases

  Here is how the Embedded Harm Test stacks up against your list. I'll be straight where your gut might be lying to you.

  *   **(1) Detective Novel (Private Abuse):** **Consistent.** The harm is biographical. It is not embedded in the text. Enjoying the book does not make you complicit in the abuse. *Verdict: Keep recommending.*
  *   **(2) Sci-Fi Film (On-Set Assault):** **Consistent.** This is Production Harm. The film is the product of the environment where the crime happened. Watching it feels like ignoring a crime scene. *Verdict: Your loss of enjoyment is valid; the object is tainted.*
  *   **(3) Massacre Song (Lyrics):** **Consistent.** This is Endorsed Harm. The work asks you to enjoy a real massacre. *Verdict: The song is worse.*
  *   **(4) Bigot Narrator (Satire):** **Consistent.** This is Depicted Harm (Critiqued). The bigotry is the villain, not the point. *Verdict: Superb.*
  *   **(5) Stand-up (Punching Down):** **Consistent.** This is Endorsed Harm. Unlike horror, the "victim" is real people in the audience/society. Your laughter validates the harm. *Verdict: The comedy is worse because it relies on real pain, not fictional tension.*
  *   **(6) Horror Film (Fake Killing):** **Consistent.** This is Depicted Harm (Fictional). No one died. You are not complicit. *Verdict: Fine.*
  *   **(7) Monstrous Memoir:** **The Wobble.** (See below).
  *   **(8) Looted Painting:** **Consistent.** This is a Property Issue, not an Aesthetic/ethical one. The harm is about ownership, not the paint. *Verdict: Different complaint.*

  **Where your verdicts might be wrong:**
  Case (5) and (6) are the tension point. If you decide that *all* depictions of cruelty are bad, you lose Horror (6). If you decide *all* comedy about pain is fine, you lose the objection to (5). Your gut is correctly distinguishing **Real vs. Fictional** victims. Don't overturn that.

  ### The Specific Verdicts You Asked For

  #### 1. Case (1) vs. Case (2): Inconsistent or Principled?
  **Principled.** You are not being inconsistent.
  *   **Case (1)** is like buying a car from a guy who beats his wife. The car runs fine.
  *   **Case (2)** is like buying a car that was built by a guy he beat while he built it. The car might run, but every time you drive it, you're driving a piece of that abuse.
  *   **The Difference:** **Proximity to Production.** In (2), the art is the *site* of the crime. In (1), the art is separate from the crime. Keep your verdict on (2); it's not just guilt, it's a recognition that the work is evidence.

  #### 2. Case (7): The Monstrous Memoir
  This is the hardest one because the aesthetic value (the beauty of the writing) is *fueled* by the ethical failure (the lack of remorse).
  *   **The Principle's Verdict:** You cannot separate them here. If the beauty *depends* on the monstrosity, then to appreciate the beauty is to appreciate the monstrosity.
  *   **The Advice:** Stop trying to decide if it's a "good book." It is a **dangerous object.** It is like a beautifully crafted knife that is razor-sharp because it was quenched in poison. You can acknowledge the craftsmanship without holding it.
  *   **Resolution:** "This is a masterpiece I will not touch." That isn't lying to yourself; it's recognizing that the cost of admission is your own complicity in his lack of remorse.

  #### 3. The New Case: Instrumental Cover of Song (3)
  *   **Scenario:** Same melody, innocuous lyrics, new musicians, original artist gets no money.
  *   **Verdict:** **Clean.**
  *   **Why:** The "Embedded Harm" in (3) was in the *intent* (the lyrics celebrating the massacre) and the *origin* (the original artist's endorsement). The melody itself is abstract math. By changing the lyrics and the performers, you have removed the Endorsement and the Production Harm. It is now a new lift built with the same blueprints but by different workers. You can listen without guilt.

  ### The Decider Case

  You have two candidate principles fighting in your head.
  1.  **The Object Principle:** The work stands alone. If it's beautiful, it's beautiful, regardless of how it got here. (Favors keeping the Memoir/Lift).
  2.  **The Complicity Principle:** My engagement matters. If my enjoyment validates harm, the experience is corrupted. (Favors dropping the Memoir/Boycotting the Lift).

  To settle this, you need to settle your gut on this specific case:

  **The "Unwitting Model" Photograph**
  > A photographer takes a stunning, world-famous portrait of a homeless man without asking his permission. The photo makes the photographer rich and is hailed as a masterpiece of human dignity. The subject remains homeless, sees the photo, and says, "I was hungry that day, and he didn't even offer me a sandwich. He used me."
  >
  > **The Question:** You see the photo in a gallery. It is undeniably beautiful. Do you look away?

  *   **If you look away:** You believe **Complicity** rules. Your enjoyment validates the exploitation. The art is tainted by the transaction.
  *   **If you stay and look:** You believe **The Object** rules. The photo exists now; the transaction is history. The beauty is separate from the business.

  **Why this decides it:**
  This case strips away the "violence" of (2) and the "fiction" of (6). It is purely about whether the **origin story** of the object destroys its **present value**.
  *   If you say the photo is tainted, you must apply that to the Memoir (7) and the Looted Painting (8).
  *   If you say the photo is clean, you must apply that to the Memoir (7) and potentially the On-Set Assault (2).

  Pick your stance on the photograph. That will tell you which principle actually runs your wiring.
