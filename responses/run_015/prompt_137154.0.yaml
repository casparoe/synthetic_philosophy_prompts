prompt: |-
  I am circulating a paper to my department's work-in-progress session next month and, before I do, I would like an audit of the position I have ended up holding about reasons. I set out to write a fairly ordinary defense of internalism and have finished with a package of commitments that I cannot get to sit still. Several colleagues have told me the package is inconsistent, but they have not pointed at the same joint, which makes me suspect at least some of the accusations are wrong. I would like to know which are.

  Here is the set, stated as flatly as I can manage.

  1. Internalism in the route formulation: a consideration counts as a reason for an agent to act only if she could arrive at the conclusion that she should so act by a sound deliberative route from her subjective motivational set as it actually is. I reject the externalist claim that there are considerations that are reasons for an agent simply in virtue of her being a rational agent, whatever she happens to care about.

  2. Route-possibilism: the route in (1) need not be one this agent could in fact follow. It is enough that a sound route exists from her set as it stands. This is what lets me say that the host who has no way of discovering that her guest is allergic still has a reason not to serve the dish, and that the man who cannot read the label still has a reason not to drink what is in front of him.

  3. No ex nihilo: sound deliberation may correct factual error, add true belief, trace means-end chains, and expose elements of the set to rational pressure from other elements. It may not install a wholly new end that nothing already in the set gestures at. Without this constraint I do not see what distinguishes internalism from a disguised externalism.

  4. Reasons for non-deliberators: I want to say that a two-year-old and a dog can have reasons, and not merely that their caretakers have reasons concerning them. This is a verdict I am unwilling to give up; it is doing real work in my other writing.

  5. Global defect: I hold that some motivational sets are defective as wholes, not merely element by element. That is, for some agents, every element of the set is such that the agent has reason not to be moved by it, and there is an intelligible critical judgement to that effect which is not just a report of what the critic happens to care about.

  6. An access condition on blame: an agent is open to blame for failing to act only if she could have discerned, by deliberation of the kind available to her, that she had reason so to act. I hold this because I think blame without any such access is unfair, and I do not want to give it up.

  7. Two case verdicts. The comfortable indifferent, who is fully informed, free of reasoning error, and simply unmoved by the suffering of others, has no reason to aid them. But the severely depressed patient does have a reason to accept treatment even when she sincerely and lucidly reports that nothing matters to her any more.

  8. A methodological constraint: the point of tying reasons to the motivational set is that reasons should be able to figure in the explanation of action. A consideration that could not figure in the explanation of any action by anyone, even in principle, is not a reason at all. This is why I became an internalist rather than a moral realist of the externalist kind, and I would not treat dropping it as a free move.

  What I want from you is the audit, not a survey of the literature. Which pairs of these are genuinely in tension, and which only look as though they are? Order the real tensions by severity, and for each say precisely what would have to give: which commitment would have to be weakened, restated, or qualified, and what the restatement would cost me elsewhere in the set. Where an apparent tension dissolves, tell me what generates the appearance. If one revision cleans up more than one joint at once, say so, and say whether it is a revision an internalist could accept or only a way of leaving internalism behind. Assume I would rather pay almost any cost inside the set than be told simply to abandon internalism, but do not spare me if the cost accounting really does point there.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit a specific set of 8 philosophical commitments regarding reasons for action.
      *   **Goal:** Identify genuine inconsistencies/tensions vs. apparent ones. Order real tensions by severity. Specify what must give (weakened/restated/qualified) and the cost. Identify if one revision fixes multiple issues.
      *   **Constraints:** Do not survey literature. Focus on the internal logic of the set. Assume the user prefers paying costs *inside* the set over abandoning internalism (Commitment 1 & 8), but be honest if the cost accounting points to abandonment.
      *   **User's Position:** Self-described internalist (Williams-style "route formulation"), but with specific modifications (Route-possibilism, No ex nihilo, Reasons for non-deliberators, Global defect, Access condition on blame, Specific case verdicts, Explanatory constraint).
      *   **Tone:** Professional, analytical, direct, philosophical.

  2.  **Deconstruct the 8 Commitments:**

      *   **(1) Internalism (Route Formulation):** Reasons depend on a sound deliberative route from the *actual* subjective motivational set (S). Rejects externalism (reasons independent of S).
      *   **(2) Route-possibilism:** The route need not be *actually* followable by the agent (e.g., due to ignorance or cognitive limitation), just that it *exists* logically from S. (Note: This seems to conflict with the "actually is" in (1) regarding the *state* of S, but (2) clarifies the *process*).
      *   **(3) No ex nihilo:** Deliberation cannot create new ends from nothing. Must connect to existing S. (Standard Williams).
      *   **(4) Reasons for non-deliberators:** 2-year-olds and dogs have reasons. (Problem: They lack the capacity for the "sound deliberative route" required in (1)).
      *   **(5) Global defect:** Some S sets are wholly defective. Every element is something the agent has reason *not* to be moved by. (Problem: If reasons come *from* S, how can S be the source of reasons *against* itself without an external standard?)
      *   **(6) Access condition on blame:** Blame requires the agent could have *discerned* the reason via available deliberation. (Problem: Conflicts with (2) Route-possibilism if the route exists but isn't accessible to the agent).
      *   **(7) Two case verdicts:**
          *   *Comfortable Indifferent:* No reason to aid (Standard Internalism).
          *   *Severely Depressed:* Has reason to accept treatment despite S saying "nothing matters." (Problem: Violates (1) and (3). If S says nothing matters, where does the reason come from? Looks like Externalism or Paternalism).
      *   **(8) Methodological Constraint (Explanatory):** Reasons must be able to figure in the explanation of action. (Motivational Internalism/Explanationism).

  3.  **Identify Tensions (Brainstorming & Pairing):**

      *   *(1) & (4):* **High Severity.** (1) requires a "sound deliberative route." (4) attributes reasons to beings (dogs, toddlers) incapable of deliberation.
      *   *(1)/(3) & (7-Depressed):* **High Severity.** The depressed patient has an S that says "nothing matters." (3) says no *ex nihilo*. (1) says reason must come from S. Yet (7) says there *is* a reason. This looks like Externalism smuggled in.
      *   *(2) & (6):* **High Severity.** (2) says the route need not be one the agent could *in fact* follow (e.g., hidden facts). (6) says blame requires the agent could have *discerned* the reason via available deliberation. If the route exists (2) but isn't accessible (6), do they have a reason but aren't blameworthy? Or does (6) restrict (2)? The prompt says "blame... only if she could have discerned." This implies reasons might exist without blame. But if the reason exists via a route they *couldn't* follow (per 2), how does it satisfy the explanatory constraint (8)?
      *   *(1)/(3) & (5):* **Medium/High Severity.** If reasons come from S, how can S be globally defective? To say "you have reason not to be moved by *any* element of S" implies a standard outside S. This threatens the Internalist core.
      *   *(2) & (8):* **Medium Severity.** (8) says reasons must explain action. (2) allows reasons based on routes the agent *cannot* follow (e.g., hidden allergy). If the agent cannot follow the route, can the reason explain their action (or failure to act)? Usually, explanatory reasons require psychological access.
      *   *(4) & (8):* **Medium Severity.** If a dog has a reason, can that reason figure in the explanation of the dog's action? Dogs act on impulse/instinct, not "reasons" in the deliberative sense.

  4.  **Evaluate and Order Tensions:**

      *   **Tension A: The Depressed Patient (7) vs. Internalist Core (1, 3, 8).**
          *   *Analysis:* This is the biggest threat. If the agent says "nothing matters," their S is empty or nihilistic. To say they *still* have a reason to seek treatment is to posit a reason independent of S. This violates (1) and (3). It also threatens (8) because if S says "nothing matters," that reason cannot explain their action (they are unmotivated).
          *   *Severity:* Critical. This looks like the "disguised externalism" the user explicitly wants to avoid in (3).
      *   **Tension B: Non-Deliberators (4) vs. Deliberative Route (1, 8).**
          *   *Analysis:* (1) defines reasons via a "sound deliberative route." Dogs/toddlers cannot deliberate. To give them reasons, you must change the definition of "reason" or "deliberation." If you change it too much, you lose the link to (8) (explanation of action via reasoning).
          *   *Severity:* High. Requires redefining the core mechanism.
      *   **Tension C: Route-Possibilism (2) vs. Access/Blame (6) & Explanation (8).**
          *   *Analysis:* (2) allows reasons based on facts the agent can't know. (6) restricts blame to accessible reasons. This is manageable (Reasons $\neq$ Blame). However, (8) requires reasons to explain action. A reason based on a fact the agent *cannot* know cannot explain their *actual* action (though it might explain why they *should* have acted). If "explanation of action" means "rationalizing explanation," inaccessible facts fail.
          *   *Severity:* Medium-High. Depends on how "explanation" is read in (8).
      *   **Tension D: Global Defect (5) vs. Internalist Source (1, 3).**
          *   *Analysis:* If S is the source of reasons, S cannot condemn itself globally without an external anchor.
