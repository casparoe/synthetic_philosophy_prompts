          *   *Cost:* If you deny the description, you risk empirical implausibility. If you admit Externalism, you violate (3).
      *   **Severity 2: Non-Deliberators (4) vs. Deliberative Route (1).**
          *   *Conflict:* Dogs don't deliberate.
          *   *Resolution:* "Idealized Proxy" or "Teleological Function."
          *   *Cost:* Weakens the "Internal" nature of the reason. It becomes external to the dog's mind.
      *   **Severity 3: Route-Possibilism (2) vs. Explanation (8) & Blame (6).**
          *   *Conflict:* Inaccessible routes explain nothing.
          *   *Resolution:* Distinguish "Reasons for Action" vs. "Reasons for Blame." Or restrict (2).
          *   *Cost:* Loss of the allergy intuition if (2) is restricted.
      *   **Severity 4: Global Defect (5) vs. Source (1).**
          *   *Conflict:* S judging S.
          *   *Resolution:* Procedural rationality norms.
          *   *Cost:* Needs careful articulation to avoid Externalism.
      *   **The "One Revision" Opportunity:**
          *   Shift from "Actual S" to "Rationalized S" (Smith/Williams hybrid). This helps with (5) and (7) but hurts (3) and (1).
          *   Actually, the best single revision is to **qualify Commitment (1)**. Change "from her subjective motivational set *as it actually is*" to "from her subjective motivational set *as it would be under conditions of full information and procedural rationality*."
          *   *Wait, check:* Williams already does this. The user says "as it actually is" in (1) but (2) allows sound routes (which imply correction). The tension is in (7).
