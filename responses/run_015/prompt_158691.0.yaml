  **Prior: 0.55**
  Selection favors mate-choice heuristics, but domain-specific modularity is not the only viable architectural solution.

  **Cross-cultural robustness: 0.85**
  Universal presence across 30 societies strongly excludes local cultural artifacts or Western media conditioning.

  **Contraception condition: 0.75**
  Hormonal linkage confirms a biological cue, but user/non-user differences introduce demographic and behavioral confounds.

  **Base-rate term: 0.90**
  Preregistered multi-site designs with $d=0.3$ rarely represent false positives regarding the existence of the effect itself.

  **Adaptation-versus-byproduct definition: 0.40**
  Correlating with estradiol confirms a mechanism, but this design cannot distinguish fertility-detection from general health-detection or arousal byproducts.

  **Combination:** Unweighted mean of the five terms yields a final credence of **0.69**.

  **Disagreement Location:** Your disagreement with your colleague almost certainly lives in the **Adaptation-versus-byproduct definition** term; they likely treat the hormonal correlation as proof of function, while you treat it as proof of mere association.

  **Least Confident Term:** I am least confident in the **Adaptation-versus-byproduct definition**, as inferring evolutionary function from correlational data is the methodological bottleneck of the entire field.

  **Single Further Experiment:** A longitudinal study linking the strength of individual men's odor preferences to their actual reproductive success (number of offspring), controlling for socioeconomic status, to test for a fitness benefit.
