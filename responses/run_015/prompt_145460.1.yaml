answer: |-
  # Specification for a Theory of Moral Sainthood as a Limit Case

  **Preamble:** This specification defines the necessary conditions for a theory of moral sainthood conceived not as a discrete ontological category (e.g., divine election) but as the asymptotic limit of moral development ($lim_{x \to \infty} MoralDevelopment$). An adequate theory must render the saint intelligible as a human agent while accounting for the qualitative shifts that occur at the extreme of moral responsiveness. The following five desiderata are ranked by logical priority, though they function as a cohesive system.

  ---

  ### (a) The Non-Reductive Integration of Prudential and Moral Value

  **Motivating Distinction:** The "Wolf Objection" (Susan Wolf, *Moral Saints*). If a moral saint maximizes moral value, they appear to sacrifice personal interests (hobbies, friendships, tastes) to a degree that renders their life undesirable or unintelligible as a *human* life. A theory must distinguish between "maximally responsive to moral reasons" and "maximally good for a life" without reducing the latter to the former, nor treating them as incommensurable silos.

  **Specification Requirement:** The theory must provide an objective account of prudential well-being that is distinct from moral worth but structurally integrated with it. It must explain how moral commitments can constitute personal meaning without exhausting the agent's identity. The theory must deny that subjective preference determines the good life, but also deny that moral obligation exhausts the good life.

  **Status:** **Non-negotiable.** Without this, sainthood collapses into either moral slavery (where the agent is merely a vessel for value) or subjective whim (where sainthood is just a lifestyle choice).

  **Primary Challenge:** **Consequentialism.**
  *Reasoning:* Standard consequentialist reconstructions tend to subsume prudential value under moral value (e.g., personal happiness counts only as a fraction of total utility). This desideratum forces a structural dualism within the agent's good that pure aggregation models struggle to accommodate without arbitrary weighting.

  ---

  ### (b) The Principled Boundary of Supererogation

  **Motivating Case:** The "Demandingness Objection." If sainthood is a limit case, does the moral demand approach infinity? If an agent *can* sacrifice more, are they obligated to? The theory must specify the boundary conditions under which supererogatory acts (beyond duty) transition into obligatory acts, or if a hard ceiling exists.

  **Specification Requirement:** The theory must define whether the ceiling on moral demand is **conceptual** (morality logically stops demanding at point X) or **psychological** (morality demands more, but humans cannot deliver). It must articulate a principle that prevents the "limit case" from becoming a "totalitarian claim" on the agent's resources, preserving a zone of moral permission.

  **Status:** **Non-negotiable.** A theory that cannot distinguish the optional from the obligatory at the limit fails to guide action and renders the concept of "saint" indistinguishable from "slave."

  **Primary Challenge:** **Deontology.**
  *Reasoning:* Deontological reconstructions typically rely on a binary distinction (forbidden/permissible/obligatory). They lack a robust internal mechanism for grading the *supererogatory* as a transition zone. This desideratum requires a scalar understanding of duty that standard Kantian frameworks resist.

  ---

  ### (c) The Normative Status of the Remainder

  **Motivating Distinction:** Moral Residue vs. Clean Hands. When an agent reaches the limit of their capacity (the "saintly" limit), do unfulfilled moral reasons retain normative force? For example, if a saint saves 10 people but could physically only save 10 (not 11), is there a normative "remainder" regarding the 11th?

  **Specification Requirement:** The theory must specify whether "ought implies can" eliminates normative force entirely upon maximal fulfillment, or if "agent-regret" remains appropriate. If remainder exists, the theory must explain how it is weighted against completed obligations to prevent paralyzing guilt in the maximally moral agent.

  **Status:** **Negotiable.** (A theory *could* argue remainder vanishes at the limit), but **Highly Preferred.** Acknowledging remainder is necessary to explain the phenomenology of high-level moral agents who often report dissatisfaction despite objective success.

  **Primary Challenge:** **Consequentialism.**
  *Reasoning:* Optimizing consequentialism typically holds that if the best available action is taken, the moral ledger is balanced. Acknowledging a normative remainder where no better action was possible introduces a non-instrumental value to moral failure that conflicts with the maximization principle.

  ---

  ### (d) Psychological Sustainability and Autonomous Agency

  **Motivating Case:** The "Burnout vs. Flow" Problem. Can sustained maximal other-regarding behavior be compatible with stable autonomous agency? Or does it necessarily erode the self into a reactive mechanism?

  **Specification Requirement:** The theory must identify the mediating structures (e.g., habits, virtues, community support, spiritual practices) that allow maximal output without psychological fragmentation. It must demonstrate that the saint's actions are expressions of *agency* rather than *compulsion* or *automatism*. The theory must rule out models where sainthood requires the suppression of the autonomous will.

  **Status:** **Non-negotiable.** If the theory permits the erosion of autonomous agency, it defines a pathological state, not a moral ideal.

  **Primary Challenge:** **Virtue Ethics.**
  *Reasoning:* While VE focuses on character, it often assumes a stable "mean." At the *limit case*, the tension between sustaining high-intensity virtue and maintaining psychological equilibrium is acute. VE struggles to specify how character remains flexible and autonomous when habituated to extreme self-sacrifice, risking a slide into rigidity.

  ---

  ### (e) Differentiation from Pathology and Efficient Altruism

  **Motivating Distinction:** The Saint vs. The Martyr vs. The Calculator. How does the theory distinguish the genuine moral saint from (1) pathological self-sacrifice (driven by guilt, low self-worth, or obsession) and (2) the merely efficient altruist (who maximizes output but lacks moral depth or integrity)?

  **Specification Requirement:** The theory must provide criteria based on **motivational quality** and **integrative wholeness**, not merely output metrics. It must identify markers of health (e.g., joy, resilience, relational depth) that distinguish sainthood from dysfunction, and markers of depth (e.g., respect for persons, not just outcomes) that distinguish it from cold efficiency.

  **Status:** **Non-negotiable.** Without this, the theory cannot fulfill its normative function of guiding development, as it would endorse pathological states as ideals.

  **Primary Challenge:** **Consequentialism.**
  *Reasoning:* Consequentialism evaluates actions primarily by outcomes. Distinguishing the "saint" from the "efficient altruist" requires evaluating the *source* of the action (virtue/integrity) rather than just the *result*, which is secondary in standard consequentialist reconstructions.

  ---

  ### Synthesis of Interrelations

  The adequacy of the theory depends on the coherence of these desiderata as a system, not merely as isolated criteria.

  1.  **Integration of (a) and (d):** The preservation of prudential value **(a)** is the primary mechanism for ensuring psychological sustainability **(d)**. A theory that reduces the good life to moral output will inevitably erode autonomous agency, leading to the pathology described in **(e)**. Therefore, **(a)** is a necessary condition for **(d)**.
  2.  **Integration of (b) and (c):** The boundary of supererogation **(b)** determines the scope of the remainder problem **(c)**. If the ceiling on demand is conceptual, the remainder vanishes. If the ceiling is merely psychological, the remainder persists. The theory must choose consistently; a hybrid approach risks incoherence in guiding the agent's emotional life.
  3.  **Integration of (d) and (e):** The mediating structures required for agency **(d)** serve as the diagnostic tools for distinguishing pathology **(e)**. A "saint" lacking these structures is, by definition, pathological. Thus, **(d)** provides the operational criteria for **(e)**.

  **Summary of Theoretical Friction:**
  *   **Consequentialism** is most strained by the requirement to separate prudential from moral value **(a)** and to value motivational quality over output **(e)**.
  *   **Deontology** is most strained by the requirement to scalarize duty and accommodate the supererogatory **(b)**.
  *   **Virtue Ethics** is most strained by the requirement to explain the stability of character at the asymptotic limit of demand **(d)**.

  An adequate theory of moral sainthood must resolve these tensions without collapsing into one of the three standard traditions, necessitating a hybrid or reconstructed framework that treats moral development as a dynamic equilibrium rather than a static maximization.
