answer: |-
  # PREPARATION SHEET: Q&A STRATEGY
  **Project:** Present Bias Without Discounting
  **Context:** Joint Philosophy/Behavioural Science Seminar
  **Time Allocation:** 25 Minutes Q&A

  ## I. STRATEGIC OPENING (First 2 Minutes)
  *Do not wait for these points to be raised. Pre-empt them to lower defensive barriers.*

  1.  **Concede Predictive Success:** Acknowledge explicitly that quasi-hyperbolic discounting models fit choice data remarkably well. Your claim is not that the *mathematics* are wrong, but that the *ontological interpretation* of the parameters is mistaken. You are offering a better story for the same curve, not a new curve.
  2.  **Concede Davidsonian Specificity:** Acknowledge that your definition of akrasia is specifically Davidsonian (synchronic judgment-action gap). State clearly that you are not claiming to explain all self-control failures (e.g., planning failures, habit), but specifically the puzzle of acting against one's better judgment *at the time of action*.
  3.  **Concede Empirical Preliminarity:** Admit that the "presentation-sensitivity" account is currently a philosophical hypothesis with empirical implications, not a confirmed psychological model. You are inviting collaboration, not dictating experimental design.

  ## II. THE CRUCIAL REPLY
  *If this argument fails, the paper collapses. You must land this cleanly.*

  **The Issue:** The distinction between Diachronic Inconsistency and Synchronic Akrasia.
  **The Line:** "Discounting functions explain why I prefer £100 in 366 days over £110 in 365 days on Tuesday, but prefer £100 today over £110 tomorrow on Wednesday. That is a preference reversal across time. Akrasia is preferring £110 tomorrow over £100 today on Wednesday, but taking the £100 anyway. Discounting explains the change in preference; it cannot explain the action against the preference. My thesis is that behavioural science has conflated the change in preference with the failure of agency."

  ## III. THE FEARED QUESTION
  *The one you hope nobody asks because it exposes the greatest ambiguity in your positive account.*

  **The Question:** "You claim perceptual vividness recruits judgment. But surely making a temptation perceptually vivid (e.g., smelling fresh bread, seeing a lit cigarette) increases the motivational pull of the temptation, not the weight of the long-term good? How does your account distinguish between vividness that aids self-control and vividness that triggers impulse?"

  **Why it hurts:** It suggests your "remedy" is empirically dangerous. If vividness amplifies desire regardless of its object, your mechanism is indistinguishable from the impulse it is meant to cure.

  ## IV. EXPECTED OBJECTIONS (Ordered by Damage)

  ### 1. The Planning Theory Objection (Philosophy of Action)
  **Who:** The Planning Theorists (Bratmanians).
  **The Objection:** "You are treating intention as merely the output of a synchronic judgment. But intention is a distinct normative kind—a plan element that stabilises conduct over time. An agent can be akratic not because their judgment changes, but because they fail to maintain the intention they formed. By focusing on the moment of choice, you ignore the temporal structure of agency itself. Your 'presentation-sensitivity' is just a description of how inputs affect judgment, not how intentions govern action."
  **Your Reply:** "I agree that intention has a distinct functional role in stabilising conduct. However, the specific phenomenon of *akrasia*—the puzzle that motivates this paper—is the moment where that stability collapses. Even a planning theorist must account for why an agent abandons a plan *knowing* they should not. My claim is that this specific collapse is not triggered by a shift in temporal valuation (discounting), but by a shift in how the options are presented to the mind. I am not reducing intention to judgment; I am arguing that the *failure* of intention at the moment of action is best explained by presentation-sensitivity rather than time-preference."
  **Soft Spot:** This concedes that your account is only partial. It leaves the Planning Theorist free to say you've explained the trigger but not the structural failure.

  ### 2. The Predictive Equivalence Objection (Behavioural Science)
  **Who:** The Experimental Economist.
  **The Objection:** "In my models, $\beta$ is a parameter estimated from revealed preference. It predicts choice data accurately. Whether I call it 'time preference' or 'presentation-sensitivity' makes no difference to the fit. Unless your interpretation generates novel predictions that the standard model does not, this is metaphysical window-dressing. Science cares about prediction, not the story we tell about the parameters."
  **Your Reply:** "It does generate a novel prediction. The standard model predicts that bias is a function of *delay*. My model predicts that bias is a function of *perceptual access*. If I hold delay constant but manipulate vividness (e.g., via VR or physical samples), the standard model predicts no change in the discount rate, whereas my model predicts a significant shift in choice. If I am right, we can reduce present-bias without changing the objective delay, simply by altering the mode of presentation. That is a testable divergence."
  **Soft Spot:** You are assuming the standard model cannot incorporate 'vividness' as a covariate. A sophisticated economist will argue they can just add a variable for 'salience' without accepting your philosophical account of $\beta$.

  ### 3. The Mechanism Objection (Psychology)
  **Who:** The Psychologist (Construal Level/Distance).
  **The Objection:** "This sounds very much like Construal Level Theory (CLT). We already know that psychological distance affects evaluation. But CLT suggests that making things 'closer' (more concrete/vivid) makes them more emotionally arousing, which often *undermines* self-control. You claim vividness aids the 'all-things-considered judgment'. What is the cognitive mechanism that ensures vividness serves reason rather than appetite? You seem to assume perception is rational."
  **Your Reply:** "You are right that CLT covers the distance aspect, but my claim is more specific about the *present*. I am not arguing that all vividness serves reason. I am arguing that the *discontinuity* at the present (the $\beta$ parameter) is a result of the unique epistemic status of the perceptually present. The remedy I propose isn't just 'make it vivid', it is 'make the *consequences* perceptually present'. If I can make the future headache of the hangover as perceptually vivid as the present pint, the bias reduces. The mechanism is attentional recruitment of the future good, not just concreteness."
  **Soft Spot:** This requires a cognitive mechanism for "making the future perceptually present" that you haven't fully specified. It risks sounding like a homunculus argument ("just pay attention to the right thing").

  ### 4. The Normative Sceptic Objection (Philosophy)
  **Who:** The Sceptics about Rational Failing.
  **The Objection:** "Why assume synchronic consistency is the norm? If my preferences change because an option is now in my hand, that is a rational response to a change in circumstances. The 'pull' of the immediate is a real feature of the world. By calling this akrasia, you are begging the question that consistency is required for rationality. Perhaps the agent at t2 simply values differently than the agent at t1, and both are rational."
  **Your Reply:** "I am not arguing that changing preferences is irrational. I am arguing that *akrasia* is defined as acting against one's *current* better judgment. If the agent at t2 genuinely values the smaller good more, that is not akrasia; that is a preference change. The phenomenon I am explaining is when the agent at t2 *says* 'I should not do this' and *does* it. For that specific case, appeal to time-preference fails, because at t2 the judgment is singular. Whether that judgment *ought* to be consistent with t1 is a separate normative question; my claim is merely about what explains the action given the judgment."
  **Soft Spot:** You are retreating to a thin definition of akrasia. The Sceptic may reply that if the judgment is so easily swayed by presentation, it wasn't a robust 'all-things-considered' judgment to begin with.

  ### 5. The Operationalisation Objection (Graduate Students)
  **Who:** The Mixed Grad Group.
  **The Objection:** "How do you actually separate 'delay' from 'presentation' in an experiment? In the real world, immediate options are almost always more vivid than delayed ones. If you control for vividness, does the 'present' effect disappear? If so, isn't 'present bias' just a proxy for 'vividness bias' already?"
  **Your Reply:** "Exactly. That is the point. I am arguing that what we call 'present bias' is largely a confound. We think it is about time because time and perceptual access usually correlate. To settle this, we need experiments where delay is held constant but access varies (e.g., viewing a future reward via high-fidelity video vs. text description). If the bias tracks the video and not the calendar, the 'time' explanation is falsified. I am inviting you to help design those controls."
  **Soft Spot:** This admits your theory relies on the success of experiments that haven't been run yet. It makes your thesis currently unfalsifiable in existing datasets.

  ## V. CLOSING ADVICE
  *   **Watch the Economist:** If they nod at the "Predictive Equivalence" reply, you have secured the interdisciplinary bridge. If they look sceptical, pivot to the "Novel Prediction" point harder.
  *   **Don't Fight the Aristotelian:** The neo-Aristotelian will worry about character. Do not try to convince them that perception replaces character. Frame perception as a *tool* that character uses.
  *   **Manage the Clock:** With 14 people and 25 minutes, questions will be rapid. Keep replies under 90 seconds if possible to allow for follow-up. If you monologue, you lose the room.
  *   **The "Vividness" Trap:** If asked the Feared Question, do not say "Vividness always helps." Say "Vividness amplifies the *attended* object. The skill of continence is learning to attend vividly to the long-term good." This shifts the burden to skill acquisition, which aligns better with the Aristotelian in the room.
