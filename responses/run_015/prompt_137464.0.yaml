answer: |-
  Subject: Re: Thinking through subsidiarity before the final paper

  Hi there,

  It is completely normal to feel that your intuitions are incoherent when you are staring directly at the tension between autonomy and unity, because the theory of federalism often tries to sell a single principle when the practice is always a balancing act. You are not missing a hidden variable; you are correctly identifying that subsidiarity is doing two different kinds of work in your head, and sometimes those jobs conflict. The principle that ties your verdicts together is not a pure rule of proximity, but rather a hybrid of functional capacity and normative baselines. You are operating with a principle of asymmetric subsidiarity where power defaults to the lowest level capable of internalizing the consequences of a decision, unless that decision violates a fundamental rights floor or creates negative cross-border externalities. This explains why your intuitions flip depending on the content of the policy rather than the level of government proposing it.

  Your load-bearing intuitions are the ones regarding externalities and rights, specifically the minimum wage exit problem, the river pollution case, and the voting rights segregation flip. These are the cases where you recognize that local autonomy fails either because the actors can escape the consequences, as with the firms leaving the city, or because the local majority is imposing costs on a vulnerable minority that cannot exit, as with segregation. These are the cases you should keep at the core of your paper because they reveal that you care about the outcome of the decision, not just the procedure. The verdicts you might have to soften or give up are the ones where you seek a fixed level of governance regardless of context, such as the idea that school curriculum is automatically a state-level matter. You prefer the state for schools not because of the level itself, but because you trust the state to protect a baseline of educational quality and civic cohesion better than a local board might, while still being closer to the culture than a national capital. If a local board proposed a curriculum that expanded civil rights education beyond the state requirement, your principle suggests you should support them, just as you support the town letting non-citizens vote. You need to let go of the idea that policy areas have permanent homes and accept that the appropriate level shifts based on whether the local unit is expanding or contracting liberty and whether the effects spill over borders.

  This principle handles your pandemic confusion quite neatly. You supported local rules because infection rates and social compliance are highly contextual; a lockdown that works in Zurich might fail in a rural canton, so the local level has the know-how and bears the consequence. However, you wanted central vaccine buying because vaccines are a public good with massive economies of scale and no local benefit to hoarding supply; a canton buying alone creates negative externalities for its neighbors by delaying herd immunity. There is no contradiction there, only a recognition that different phases of the crisis required different jurisdictional fits. The same logic applies to your clean air ratchet. You want a federal floor to prevent a race to the bottom where states compete by sacrificing health for industry, which is a classic negative externality problem. But you allow local ceilings because stricter rules do not harm neighbors; they internalize the cost of cleanliness locally. This asymmetry is where standard subsidiarity fails you, because standard theory assumes symmetry, but your moral intuition correctly identifies that laxity harms others while strictness usually does not.

  To test this principle on a case you have not listed, consider local policing strategies in a diverse city. The local police department has the know-how; they know the neighborhoods, the specific crime patterns, and the community leaders better than a federal agent ever could. However, if that local department uses its know-how to engage in racial profiling or suppress dissent in minority neighborhoods, they are exercising bigotry with efficiency. Under your principle, the operational control should remain local because the feedback loop of safety is local, but the constitutional rights baseline must be enforced from above. You would support the local department designing its own patrol routes but support federal intervention if those patrols violate civil rights statutes. This captures the tension you felt on voting rights; local units can expand the franchise because that adds rights, but they cannot restrict the franchise because that violates the baseline. The principle holds that local knowledge is a tool, not a trump card, and it cannot be used to violate the exit rights or fundamental dignity of those within the jurisdiction.

  Finally, you asked about who decides who decides, and your discomfort with the courts is well-founded but perhaps unavoidable. It feels like an embarrassment because it seems to violate the democratic premise that the people should rule; if a court decides the people cannot rule on X, democracy seems diminished. However, in a federal system, the constitution is the prior agreement that makes the democracy possible, and someone must arbitrate the boundaries of that agreement. If you leave it to the legislature to decide its own powers, it will always choose more power, and if you leave it to the states, they will always choose more autonomy. The court is the only actor with the incentive to maintain the structure itself rather than maximize immediate power. The embarrassment you feel is the price of having a rule of law rather than a rule of men. It is not a bug in the framework but a feature of having a framework at all. Your paper will be stronger if you acknowledge that subsidiarity is not a mechanical formula but a political argument that requires a referee, and that referee will always be imperfect. You do not need to solve the counter-majoritarian difficulty to write a great paper; you just need to show that your principle explains why we accept that difficulty in some cases but not others.

  I hope this helps you structure the argument before you start drafting. You have the right instincts; you just need to trust that the inconsistency you feel is actually a sophisticated calibration of values rather than a mistake.

  Best of luck with the seminar

  Your Instructor
