answer: |-
  Colleagues, I am writing this to break the stalemate we have reached regarding the current grant cycle and to propose a framework for how we interpret our mandate moving forward. We are stuck because the three finalists each illuminate a different flaw in how we have been reading the donor's charter, and until we acknowledge those flaws, we will not be able to vote with a clear conscience. We have a choice between a project that embodies the values we claim to defend but rejects the label we are required to use, a project that embraces the label but proposes policies that may violate the very rights we aim to protect, and a project that interrogates the label itself. My recommendation is to award the grant to the historical essays, the third candidate, and I want to explain why this is the only choice that secures the foundation's future without compromising its integrity.

  We need to be honest about why the second candidate, the polemicist, is causing such friction. The strongest argument for funding him is that he fits the literal wording of the charter better than anyone else. He speaks explicitly about defending the West, he uses the language of inheritance and boundary-making, and he offers a robust, unapologetic vision of cultural continuity. To reject him solely because his views are controversial is to risk turning our committee into a body that only funds safe, toothless work. However, the counterargument is equally strong. His program includes restrictions on religious building and financial incentives for exclusion that stand in direct tension with the individual liberties and secular laws we also claim to inherit. Funding him risks associating the foundation with policies that could be viewed as discriminatory, inviting reputational damage that would reduce our ability to fund anyone in the future. We cannot defend a civilization by undermining its core commitments to free inquiry and equal treatment under the law.

  The first candidate, the memoirist, presents a different challenge. Her work is a powerful defense of secular law, free speech, and individual conscience, fought for at great personal cost. In terms of pure values, she is perhaps the strongest defender of the inheritance we care about. The argument against her is simply the one she makes herself: she rejects the term Western. She argues that these values are universal and that claiming them as property of a specific geography is a way of excluding people like her. Funding her feels like a victory for the values but a defeat for the specific wording of our charter. It requires us to accept that the label is less important than the content, which is a hard pill to swallow when the charter is our only guiding document.

  This brings us to the third candidate, the historical critique, which is my recommendation. I know this is the option that will cause the most discomfort, particularly regarding the donor's original wording. The argument against this choice is that it funds a project suggesting our central category is vacuous or tribal, which feels like paying someone to dismantle the house we live in. But this is where we must distinguish between the inheritance itself and the inventory list we made of it in the nineteen nineties. The essays argue that the phrase Western civilisation has been doing three jobs at once: naming a list of norms, naming a historical lineage, and marking who counts as outside. Our stalemate proves the author right. Every time we try to write down the norms, we agree on them regardless of geography. Every time we try to enforce the lineage, we fight. If we fund this book, we are not funding an attack on the values; we are funding the intellectual rigor required to understand what we are actually protecting.

  By choosing the historical essays, we commit to funding arguments rather than ancestry. We signal that the foundation supports the rigorous examination of the ideas that sustain a free society, even when that examination is uncomfortable. This protects us from the reputational risk of the polemicist and the semantic contradiction of the memoirist. It allows us to tell the widow and the donor's estate that we are taking the inheritance seriously enough to subject it to scrutiny, which is itself a core part of the tradition we claim to uphold. Going forward, I propose we read the mandate as a commitment to the norms of free inquiry and individual rights, wherever they appear, while acknowledging that the historical label is a tool for understanding, not a boundary for exclusion. This will not make every decision easy, but it will stop us from having this same conversation in eighteen months. We should award the grant to the third finalist and update our internal guidelines to reflect that defending an inheritance requires knowing what it is.
