      *   If Malthus is false, the lines diverge immediately.
      *   If Malthus is premature, the lines track together (Pressure) then diverge due to an external shock (Camouflage).
      *   Actually, **Real Wage Data** is the standard proxy for this in econ history (Allen/Clark). It represents the "Pressure" (wages drop as pop rises) and the "Camouflage" (wages rise despite pop rising). I will stick with Real Wages as the proxy for the Grain/Pop ratio.

