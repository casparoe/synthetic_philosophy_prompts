  2.  **Private Scratch Work (Mental or Draft):**
      *   *Survivable Distinctions:* Illocutionary point (what are they trying to do?), Propositional content (what is being said?), Preparatory conditions (do they have the right to say this?), Sincerity conditions (do they mean it? - hard to verify, maybe skip for classification), Uptake (did someone hear/record it?).
      *   *Degrading Distinctions:* Perlocutionary effect (consequences) vs. Illocutionary force (act itself) - committees always conflate these. Essential vs. Non-essential rules (too abstract). Exact felicity conditions (too legalistic). The distinction between "expressing a psychological state" and "committing to a future course" often blurs in email.
      *   *Key Operational Shift:* Move from "Is this a promise?" to "Does this change the record?" Focus on *institutional facts* vs. *brute facts*.
      *   *Void vs. Voidable:* Void = no standing/no attempt. Voidable = valid act but overridden (e.g., retracted retraction). Effective/Mis-recorded = Act happened, we logged it wrong.
      *   *Standing vs. Authority:* Standing = Is this the person? Authority = Can this person change the status of *this* object (paper)?
