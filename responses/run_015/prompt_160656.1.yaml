answer: |-
  [SCRATCH WORK]
  Distinctions surviving translation: Illocutionary point (intent to change institutional status) survives because it maps to database fields. Preparatory conditions (standing/authority) survive because they are checkable against roster data. Uptake survives if defined as "entered in log" rather than "understood by reader."

  Distinctions degrading: Sincerity conditions (did they mean it?) degrade because committees cannot access mental states; must treat utterance as sincere unless contradicted by evidence. Perlocutionary effect (did readers believe it?) degrades because it conflates act with consequence; we classify the act, not the fallout. Nuance between expressives (regret vs. apology) degrades under time pressure; must collapse into "Admission" vs. "Non-Admission."

  Why: The Austinian apparatus assumes a cooperative interlocutor; institutional classification assumes adversarial or ambiguous inputs. We need binary switches, not phenomenological descriptions. The "Void vs. Voidable" distinction is critical for audit trails but requires clear criteria for "felicity" that are purely procedural, not semantic.

  ***

  **OPERATIONAL DECISION PROCEDURE FOR UTTERANCE CLASSIFICATION**

  **1. Principle**
  Classify only the institutional status change the speaker attempted to enact, distinct from their sentiment, the truth of their claim, or the eventual outcome.

  **2. Five-Minute Triage Gate**
  Scan the text for explicit performative verbs (retract, withdraw, admit, promise) or functional equivalents ("take my name off," "we made a mistake"). If none exist, log as "General Correspondence" and close. If present, proceed to Main Procedure. If the text is purely emotional or evaluative without status-change intent, log as "Commentary" and close.

  **3. Main Procedure**
  *Gate 1: Existence and Status.* Did the utterance meet the minimum conditions to count as the act?
  *   **Void:** No attempt made or conditions impossible (e.g., stranger demands retraction). Log as "Null."
  *   **Voidable:** Act performed but subject to override (e.g., author retracts, but editor finds no error). Log as "Pending Validation."
  *   **Effective but Mis-recorded:** Act occurred and was valid, but logged incorrectly (e.g., logged as "Correction" instead of "Retraction"). Log as "Administrative Error."
  *   *Ambiguity:* If unclear, mark "Under Review" and seek clarification from speaker. Do not guess.

  *Gate 2: Standing and Authority.*
  *   **Standing:** Is this the person who spoke? (Verify identity). If no, act is Void.
  *   **Authority:** Does this person have the right to change the status of *this* object? (e.g., Can this co-author withdraw consent? Can this funder retract the paper?). If no, act is Void regarding institutional status, though valid as a personal statement.

  *Gate 3: Uptake.*
  *   **Record-Keeper Uptake:** Required for institutional acts (retractions, corrections). The act is not complete until logged by the committee.
  *   **Hearer Uptake:** Required for interpersonal acts (apologies, promises). The act is performed upon utterance, but efficacy depends on receipt.
  *   *Rule:* If Record-Keeper Uptake is missing for an institutional act, the act is performed but not effectuated.

  *Gate 4: Temporal Effect.*
  *   **Prospective:** Creates new status going forward (e.g., promise to correct). Citations before the act remain valid.
  *   **Retrospective:** Records a defect that already obtained (e.g., retraction for error). Citations before the act are tainted; mark as "Cite with Caution."
  *   *Decision:* If Retrospective, issue notice specifying the date the defect originated.

  *Gate 5: Vehicle.*
  *   **Format-Supplied Force:** Some acts require specific vehicles (e.g., Retraction Notice banner). Words alone in an email do not suffice.
  *   **Word-Supplied Force:** Some acts rely on content (e.g., Admission of misconduct).
  *   *Rule:* If the format is mandatory for the act type and missing, the act is Voidable until format is corrected.

  *Gate 6: Performance vs. Adequacy.*
  *   Stop classification here. Whether an apology is "sufficient" or a correction "complete" is a value judgment, not a classification.
  *   *Handoff:* If the act is performed but inadequate, flag for Senior Editor sanction. Do not log as "Failed Act."

  *Gate 7: Over-Attribution Guard.*
  *   Do not attribute force if the best paraphrase is irony, joke, quote, or non-native error.
  *   *Test:* Could the speaker reasonably reject this classification? If yes, mark "Ambiguous Intent" and request confirmation. Do not classify reported speech as direct speech.

  **4. Written-Record Template**
  "Speaker [Name] attempted [Act Type] regarding [Object] on [Date]. Standing: [Yes/No]. Authority: [Yes/No]. Uptake: [Recorded/Not Recorded]. Status: [Void/Voidable/Effective]. Temporal Scope: [Prospective/Retrospective]. Adequacy: [Referred to Editor]. Classification verified by [Committee Member ID]."

  **5. Field-Card Version**
  1. Verb present? (Y/N)
  2. Right person? (Y/N)
  3. Right power? (Y/N)
  4. Logged? (Y/N)
  5. Backdated? (Y/N)
  6. Format correct? (Y/N)
  7. Irony/Quote? (Y/N)
  *If any N except 4 & 6, stop and consult.*

  ***

  **CASE RUNS**

  **(a) Co-author thread: "Take my name off it."**
  *Working:*
  1.  **Triage:** "Take my name off" is a functional equivalent of "withdraw consent." Proceed.
  2.  **Gate 1 (Existence):** Act performed (withdrawal of consent). Not Void.
  3.  **Gate 2 (Authority):** Co-author has standing to withdraw their own consent. Authority over *authorship list* is Yes. Authority over *paper status* (retraction) is No.
  4.  **Gate 3 (Uptake):** Record-Keeper Uptake missing. Corresponding author acknowledged but did not log. Act performed but not effectuated.
  5.  **Gate 4 (Time):** Retrospective regarding authorship record.
  6.  **Gate 5 (Vehicle):** Email suffices for consent withdrawal, but journal record must update.
  7.  **Verdict:** Log as "Authorship Withdrawal." Update metadata to remove name. Investigate corresponding author for delay (Adequacy gate). Do not retract paper unless data is compromised.

  **(b) Blog post: "Sorry people were upset."**
  *Working:*
  1.  **Triage:** "Sorry" present. Proceed.
  2.  **Gate 1 (Existence):** Expressive act. Is it an admission? No. It attributes upset to people, not error to paper.
  3.  **Gate 2 (Authority):** Author has standing to speak for self. No authority to change journal record via blog.
  4.  **Gate 3 (Uptake):** Hearer uptake occurred (public). Record-keeper uptake irrelevant for blog post unless adopted by journal.
  5.  **Gate 6 (Adequacy):** Performed as expression of regret. Inadequate as admission of misconduct.
  6.  **Verdict:** Log as "External Statement." Do not classify as Admission or Correction. No change to paper status. Record distinguishes regret from apology.

  **(c) Funder press release: "Withdraw support, findings unreliable."**
  *Working:*
  1.  **Triage:** "Withdraw support," "unreliable." Looks like retraction. Proceed.
  2.  **Gate 2 (Authority):** Funder has standing to speak for funder. Authority over *paper retraction* is No. Only authors/Editor-in-Chief may retract per journal rules.
  3.  **Gate 1 (Existence):** Act of withdrawing funding endorsement is Valid. Act of retracting paper is Void (lack of authority).
  4.  **Gate 5 (Vehicle):** Press release is not a Retraction Notice format.
  5.  **Verdict:** Log as "Funding Withdrawal Notice." Do **not** log as Retraction. Do **not** alter paper status.
  6.  **Constraint:** Committee desire to log as retraction is overruled by Gate 2. To log as retraction would be a False Record (Mis-classification). Issue "Expression of Concern" if editor agrees findings are unreliable, but distinct from funder statement.

  ***

  **LIMITATIONS AND FAILURE MODES**

  This procedure cannot resolve disputes about truth. It classifies the act of claiming error, not the existence of error. If an author retracts a true paper, this procedure logs the retraction; it does not prevent the lie.

  It will misfire on collaborative ambiguity. When co-authors dispute who has authority to speak for the group, Gate 2 becomes a legal judgment, not a linguistic one. The committee must refuse classification until legal counsel resolves standing.

  It cannot reliably interpret irony or cultural indirectness despite Gate 7. If a speaker says "Perhaps we should look at this again" meaning "Retract this," the procedure may log it as "Query" unless the committee infers intent. This inference is a judgment call wearing the costume of a rule.

  Refuse classification for: Automated text (bot posts), text where the author is unidentified, and text where the institutional object is unclear (e.g., "my work" without specifying which paper). In these cases, log as "Unverifiable Utterance" and close. Do not force a classification to satisfy audit metrics.
