answer: |-
  Rational agents aim to maximize utility, but this goal becomes complex when a highly reliable predictor models their decision-making process. In such scenarios, the link between choice and outcome transcends simple causality. To analyze this, we must define two specific problems. In Counterfactual Mugging, a fair coin has landed tails, and you are asked for $100. Had the coin landed heads, the predictor would have given you $10,000, but only if it predicted you would pay in the tails branch. In XOR Blackmail, a demand for $100 is sent to you if and only if exactly one of the following is true: you have termites causing $10,000 in damage, or the predictor predicts you would refuse the demand. Paying prevents the damage if termites exist; otherwise, it is a pure loss.

  The strongest argument for paying in both cases rests on the notion that your present choice is the same output as the decision procedure the predictor modeled. You are not an isolated actor in the moment; you are an instantiation of a specific algorithm. If you decide to pay, you confirm that you are the type of agent who pays. In the Mugging, this means the predictor would have anticipated payment and awarded the $10,000 in the counterfactual heads branch. In XOR Blackmail, adopting a policy of paying ensures the predictor forecasts compliance. Consequently, the demand is sent only if you have termites (True XOR False), meaning the letter serves as a valuable warning. By paying, you save $9,900 net. Conversely, a policy of refusing leads to the demand being sent only when you are safe (False XOR True), rendering the letter a useless exploitation, or no letter when you have termites, resulting in catastrophic loss. Thus, paying maximizes ex-ante expected utility by aligning your current output with the beneficial prediction.

  The strongest argument against paying relies on causal inefficacy. Once the request arrives, the coin has already landed, and the termites are either present or absent. Your payment cannot causally change the past coin flip or physically remove the infestation without the mediator of the predictor's already-fixed rule. In the Mugging, the $10,000 is already withheld; paying now sacrifices $100 for nothing tangible. In Blackmail, if you receive the letter under a refusing policy, you know you are safe, so paying is a loss. If you receive it under a paying policy, the termites exist regardless of your choice; paying merely mitigates damage but feels like surrendering to manipulation. From this perspective, rationality demands responding to the actual state of the world, not hypothetical correlations. Paying rewards a predictor for controlling you rather than navigating reality.

  This conflict highlights the distinction between choosing an act now and adopting a policy beforehand. Rationality should be reflectively consistent: you should want to be the kind of agent who wins. If you could precommit, you would precommit to paying in both cases. The cases differ slightly in mechanism. In the Mugging, the benefit is a counterfactual gift withheld due to your disposition. In XOR Blackmail, the benefit is informational; your policy determines whether the letter correlates with danger or safety. However, both rely on the predictor linking your disposition to the setup of the problem.

  Therefore, the verdict is to pay in both cases. A rational agent must recognize that their decision logic is what was predicted, not merely their physical action in the moment. By paying, you validate the policy that yields the best overall outcomes across possible worlds.

  The strongest opposing argument is that this requires accepting "magical" causality, where present actions influence past events or independent states. However, this mischaracterizes the relationship. Your choice does not change the past; rather, the past prediction and your present choice are logically correlated outputs of the same source code. Refusing to pay asserts that you are a different agent than the one modeled, which contradicts the premise of a highly reliable predictor. If you are indeed the agent modeled, refusing confirms you are the type who loses the counterfactual reward or suffers hidden termite damage. To avoid paying is to privilege the immediate sensory experience of keeping $100 over the structural reality of being a winning agent. Rationality requires owning the logic that defines you, even when it demands a cost in the observed branch to secure victory in the unobserved or conditional ones.
