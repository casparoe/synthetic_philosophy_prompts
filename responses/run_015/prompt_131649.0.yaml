prompt: |-
  hey, i'm putting together notes for a seminar on animal minds and i'm tired of people just waving at one study — like octopus problem-solving or bees maybe having subjective experience — and treating that as the whole answer. before i go deeper i want the full spec: what should any adequate theory of how consciousness is distributed across animals actually deliver?

  write the desiderata. what cases must it handle (insects, cephalopods, maybe colonial organisms like siphonophores where there's no single brain?), what distinctions it can't collapse (having some consciousness vs having a lot, being a unified subject vs being a distributed cluster of mini-subjects?), what results from comparative neurobiology it can't flat-out contradict, and whether it needs to allow graded attribution or can stick with sharp cutoffs. for each one, give the reasoning behind it and flag which are non-negotiable vs which are just preferences of one camp. also, tell me if there's a subset that's jointly unsatisfiable — like if requiring both unified phenomenal fields and full distribution across decentralized nervous systems creates a contradiction.

  you're acting as a philosopher of mind with some biology background. think step by step: maybe start with a quick brainstorm of weird edge cases, then lay out the requirements list. please seperate what's fairly settled from what's genuinely contested among people who know the topic, and don't present a contested camp view as the consensus. there's probably a typo or two in here, sorry lol.
