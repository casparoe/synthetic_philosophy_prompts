answer: |-
  This is a crucial pivot for your seminar. The "one-study wonder" approach (e.g., "Bees roll balls, therefore bees feel joy") commits the homunculus fallacy or conflates complex behavior with phenomenal experience. To build a robust seminar, you need a framework that survives contact with the messy reality of comparative biology.

  Here is a step-by-step breakdown of the desiderata for an adequate theory of distributed animal consciousness, drafted from the perspective of a philosopher of mind with a grounding in neurobiology.

  ### Step 1: The Edge Case Brainstorm
  Before listing requirements, we have to acknowledge the biological phenomena that break simple theories. A theory that works for a mammal might shatter against these:

  1.  **The Cephalopod Problem:** An octopus has a central brain, but two-thirds of its neurons are in its arms. The arms can taste, touch, and react independently of the central brain. Is the octopus one subject, or nine (one head + eight arms)?
  2.  **The Colonial Problem (Siphonophores):** Organisms like the Portuguese Man o' War are colonies of specialized zooids. There is no central brain. If consciousness requires integration, is the colony conscious? If it requires a neuron, are the individual zooids conscious?
  3.  **The Insect Miniaturization:** Bees and ants have fewer than a million neurons (humans have 86 billion). They exhibit navigation, communication, and learning. Does consciousness scale down linearly, or is there a minimum complexity threshold?
  4.  **The Split-Brain Case:** In humans, severing the corpus callosum can result in two independent streams of consciousness in one skull. This proves that *one organism* $\neq$ *one subject*.

  ### Step 2: The Desiderata List
  Here are the requirements any theory must meet. I have categorized them by **Non-Negotiable** (the theory fails without this) vs. **Camp Preference** (depends on your philosophical stance) and marked the scientific consensus status.

  #### 1. Neuro-Anatomical Consistency
  *   **Requirement:** The theory cannot attribute consciousness to structures known to be purely reflexive (e.g., spinal ganglia in isolation) nor deny it to structures homologous to known Neural Correlates of Consciousness (NCC).
  *   **Reasoning:** If a theory claims a creature without a nervous system is conscious, it must explain *how* without magic. Conversely, if it claims a mammal is unconscious despite having a functioning thalamocortical system, it contradicts clinical data.
  *   **Status:** **Non-Negotiable.**
  *   **Settled/Contested:** **Settled.** (We agree biology matters; we disagree on *which* biology).

  #### 2. The Distinction Between Sentience and Sapience
  *   **Requirement:** The theory must distinguish between *phenomenal consciousness* (the capacity to feel pain/pleasure) and *higher-order cognition* (self-reflection, complex planning).
  *   **Reasoning:** Many studies wave at "problem solving" (sapience) to prove "feeling" (sentience). A rat can solve a maze without necessarily having a rich inner narrative. Conflating these leads to over-attribution in smart animals and under-attribution in "simple" feelers.
  *   **Status:** **Non-Negotiable.**
  *   **Settled/Contested:** **Settled.** (Philosophically distinct, though empirically hard to separate).

  #### 3. Handling Decentralization (The Unity Condition)
  *   **Requirement:** The theory must specify whether consciousness requires a *unified phenomenal field* or can exist as *fragmented micro-experiences*.
  *   **Reasoning:** This is the Octopus/Siphonophore test. If consciousness requires a single "viewer," decentralized nervous systems are problematic. If consciousness can be fragmented, then an octopus arm might be a distinct subject from the central brain.
  *   **Status:** **Camp Preference.** (Global Workspace theorists demand unity; Panpsychists or IIT proponents might allow fragmentation).
  *   **Settled/Contested:** **Contested.** (This is the biggest fracture line in the field).

  #### 4. Evolutionary Continuity vs. Emergent Cutoffs
  *   **Requirement:** The theory must explain the transition point. Is consciousness a gradient (dimmer switch) or a binary state (light switch)?
  *   **Reasoning:** Evolution is gradual. A "sharp cutoff" (e.g., "Consciousness starts at 100 million neurons") implies a magical emergence that violates biological continuity. However, a "graded" view makes moral status difficult to adjudicate.
  *   **Status:** **Camp Preference.** (Most biologists prefer gradients; some legal/ethical frameworks require binary cutoffs).
  *   **Settled/Contested:** **Contested.**

  #### 5. Substrate Neutrality vs. Biological Specificity
  *   **Requirement:** The theory must declare if consciousness depends on *specific biological tissue* (e.g., carbon-based, specific neurotransmitters) or *functional organization* (information processing patterns).
  *   **Reasoning:** If it's biological specificity, then a perfect silicon simulation of a bee is not conscious. If it's functional, then potentially simple algorithms could be conscious. This dictates how we treat AI vs. Animals.
  *   **Status:** **Camp Preference.** (Biological Naturalists vs. Functionalists).
  *   **Settled/Contested:** **Contested.**

  #### 6. The "Dark Room" Test (Input Independence)
  *   **Requirement:** The theory must account for consciousness in the absence of external stimuli (e.g., dreaming, REM sleep).
  *   **Reasoning:** If a theory defines consciousness solely as "response to environment," it fails to account for endogenous experience. A theory must allow for an animal to be conscious even when immobilized or in sensory deprivation, provided neural activity persists.
  *   **Status:** **Non-Negotiable.**
  *   **Settled/Contested:** **Settled.** (We know humans are conscious during dreams; we assume homology in mammals).

  ---

  ### Step 3: Jointly Unsatisfiable Sets (The Trilemmas)
  You asked for contradictions. There are specific combinations of desiderata that create logical crashes. If a theory tries to hold all three in a set, it will fail.

  **Contradiction Set A: The "Unity-Decentralization" Clash**
  1.  **Demand:** Consciousness requires a single, unified phenomenal field (The "Cartesian Theater" constraint).
  2.  **Demand:** Any organism with a distributed nervous system (Octopus, Ant Colony) is a single subject.
  3.  **Demand:** Neural processing time/latency limits integration (signals take time to travel).
  *   **The Crash:** In highly decentralized systems (like an octopus arm), the latency between the arm ganglion and the central brain is significant. If you demand **Unity** (1) and acknowledge **Latency** (3), you cannot treat the **Organism** as a single subject (2). You are forced to admit the arm is a separate subject or the unity is an illusion.
  *   **Resolution:** Drop (1) and allow fragmented subjects, or drop (2) and say the "organism" is a society of subjects.

  **Contradiction Set B: The "Continuity-Cutoff" Clash**
  1.  **Demand:** Evolutionary continuity (no magic jumps in nature).
  2.  **Demand:** Moral/Legal binary (an animal is either a "person" or "property").
  3.  **Demand:** Consciousness is the basis for moral status.
  *   **The Crash:** If consciousness is a **Gradient** (required by 1), but Moral Status is **Binary** (2), you cannot use Consciousness (3) as the sole bridge. There will always be a "grey zone" animal that is *slightly* conscious but legally *non-person*.
  *   **Resolution:** Accept that legal categories are pragmatic fictions that don't map perfectly onto metaphysical reality.

  **Contradiction Set C: The "Behavior-Phenomenology" Clash**
  1.  **Demand:** We can only infer consciousness via behavior/report (Methodological Behaviorism).
  2.  **Demand:** Consciousness is intrinsic and private (Phenomenology).
  3.  **Demand:** We can know if "simple" animals (nematodes) are conscious.
  *   **The Crash:** If (1) is true, we can never confirm (2) in animals that cannot report (3). If we claim to know nematodes are conscious, we must abandon strict (1).
  *   **Resolution:** Adopt "Inference to the Best Explanation" rather than strict verification.

  ---

  ### Step 4: Settled vs. Contested Cheat Sheet
  For your seminar notes, keep this distinction clear so you don't present speculation as fact.

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Consciousness is localized in the soul.** | **Settled (False)** | Neuroscience rejects dualism of this kind. |
  | **Mammals (at least) are conscious.** | **Settled (True)** | Cambridge Declaration on Consciousness (2012). |
  | **Insects are conscious.** | **Contested** | 2023 UK report says "strong evidence," but NCCs are unclear. |
  | **Consciousness is binary (On/Off).** | **Contested** | Most neuroscientists lean toward graded; ethicists often need binary. |
  | **The Thalamocortical system is necessary.** | **Contested** | Necessary for *humans*, but birds lack this and seem conscious. |
  | **Integrated Information (Phi) measures consciousness.** | **Contested** | IIT is a leading theory, but unproven and mathematically criticized. |
  | **Pain requires a cortex.** | **Settled (False)** | Subcortical structures can mediate pain (e.g., in infants/birds). |

  ### Step 5: Summary for the Seminar
  When you present this, your main takeaway should be this: **The map is not the territory.**

  A study showing an octopus opening a jar proves *intelligence* (problem-solving), not necessarily *consciousness* (feeling). A study showing a bee avoiding electric shock proves *nociception* (reflex), not necessarily *suffering* (emotional experience).

  An adequate theory must be able to say: "It is possible for this animal to be highly intelligent but minimally conscious," or "It is possible for this animal to be deeply conscious but cognitively simple."

  If a theory collapses those distinctions, it is not a theory of mind; it is a theory of behavior.

