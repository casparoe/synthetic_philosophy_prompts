      *   *Side A (Hypocrisy Undermines Standing):* Focuses on the *relationship* between blamer and blamed. Blame is a moral address that requires equality or non-implication. If I'm guilty, I lose the right to hold you accountable.
      *   *Side B (Hypocrisy Doesn't Undermine Standing):* Focuses on the *content* of the blame. The act is wrong regardless of who says so. Hypocrisy is a separate vice.
      *   *The User's Distinction:* "Authority-standing" (social/persuasive) vs. "Integrity-standing" (moral right/consistency). This maps roughly onto *pragmatic* vs. *normative* standing, or *social* vs. *moral* standing.

