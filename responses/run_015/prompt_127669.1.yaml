answer: |-
  **JOINT STATEMENT ON THE ETHICS OF CALIBRATED-QUARANTINE FRAMEWORKS**
  **Issued by the Adversarial Collaboration on Responsibility and Risk (ACRR)**

  **Signatories:**
  *   **Dr. Elena Vance** (Defending a Dennett-style Compatibilist Account of Moral Responsibility)
  *   **Dr. Marcus Thorne** (Defending a Caruso-style Hard-Incompatibilist Free-Will Skepticism)

  **Date:** October 26, 2023
  **Subject:** Philosophical Assessment of the "Calibrated-Quarantine" (CQ) Institutional Design

  ### Preamble

  We, the undersigned, have engaged in a good-faith adversarial collaboration to examine a hypothetical criminal-justice institutional design termed "Calibrated-Quarantine" (CQ). Under the CQ framework, the duration and conditions of state-imposed separation are determined algorithmically by predictive risk of re-offense, yet the state is required to publicly justify the imposition to the offender as proportionate to the harm caused, rather than solely to future risk.

  This document records our areas of convergence, the precise locus of our remaining disagreements, and the empirical or conceptual evidence required to move the debate forward. We explicitly distinguish between claims settled by current philosophical and empirical consensus and those that remain genuinely contested among specialists.

  ---

  ### I. Agreed Claims

  We jointly affirm the following propositions. Where appropriate, we note the status of the claim within the broader academic community.

  1.  **Formal Structure of the Debate (Settled):** We agree that the central philosophical dispute is not whether human behavior is causally influenced by prior states (determinism), but whether the *concept* of moral responsibility required for just punishment is compatible with such causation. We agree that "libertarian free will" (uncaused causation) is not a prerequisite for all forms of social accountability, though we disagree on whether it is a prerequisite for *justified state deprivation*.
  2.  **Empirical Findings on Punishment (Broad Consensus):** We concur with the prevailing criminological consensus that purely retributive punishment (suffering inflicted solely because it is deserved, without forward-looking aims) has no demonstrable efficacy in reducing recidivism compared to rehabilitative or restorative models. We further agree that current predictive-risk algorithms exhibit documented biases regarding race and socioeconomic status, requiring strict regulatory oversight.
  3.  **Normative Constraints on State Coercion (Settled):** We agree that the state bears a heavy burden of justification for any deprivation of liberty. We concur that human dignity imposes a constraint against treating persons merely as means to social safety; offenders must be addressed as rational agents capable of understanding the justification for their confinement, even if that justification is non-retributive.
  4.  **The CQ Tension (Collaboration Finding):** We agree that the CQ framework creates a specific normative tension: by decoupling *duration* (risk-based) from *justification* (harm-based), it attempts to satisfy consequentialist safety requirements while honoring deontological intuitions about fairness. We agree this design forces a clarification of whether "proportionality to harm" necessarily implies retributive desert.

  ---

  ### II. Disagreements Table

  The following table outlines our divergent interpretations of the CQ framework. Each position is phrased to be acceptable to the holder of that view, without caricature.

  | Feature of CQ Framework | **Compatibilist Position (Vance)** | **Hard-Incompatibilist Position (Thorne)** |
  | :--- | :--- | :--- |
  | **Status of "Desert"** | A reconstructed notion of "moral desert" survives determinism. It is not metaphysical but functional: agents who possess sufficient rational control and responsiveness to reasons are appropriate targets of accountability practices that track harm. | "Basic Desert" is incoherent without libertarian freedom. While we can hold people *accountable* (liable to repair), no one genuinely *deserves* suffering or deprivation. Talk of desert is merely a useful fiction or a shorthand for social regulation. |
  | **Function of Harm-Proportionality** | Justifying confinement by reference to harm done respects the offender's status as a moral agent. It ensures punishment is not merely preventive detention (which treats the offender as a dangerous object) but a response to a normative violation. | Justifying confinement by reference to harm done is a necessary *political veneer* to maintain social stability, but it is not morally foundational. If risk is zero, harm alone cannot justify deprivation. The CQ justification is expressive, not justificatory. |
  | **Scope of Proportionality** | Proportionality acts as a *constraint* on risk management. Even if an offender is high-risk, the state cannot impose conditions grossly disproportionate to the harm caused. Desert sets the ceiling; risk sets the floor. | Proportionality is entirely subordinate to risk and necessity. If an offender poses zero risk, proportionality to harm is irrelevant because no deprivation is justified. If they pose high risk, harm proportionality is secondary to public safety necessity. |

  ---

  ### III. Cruxes and Concrete Cases

  We identify two specific cruxes where our disagreement prevents full consensus on the CQ framework. For each crux, we specify a concrete case and record our predicted assessments.

  #### Crux 1: Detaching Proportionality from Retributive Desert
  **Question:** Can the requirement that punishment be "proportionate to harm" be conceptually detached from retributive desert, or does any harm-sensitive justification inevitably smuggle in the claim that the offender *deserves* to suffer?

  *   **Concrete Case:** *The Low-Risk Harm-Doer.*
      An offender commits a serious assault (significant harm). Neurological scanning reveals the act was deterministically caused by an undiagnosed, non-treatable brain anomaly that does not affect future behavior (predictive-risk score is near-zero).
      *   **CQ Protocol:** Risk algorithm recommends immediate release. Harm-proportionality constraint suggests some period of separation or sanction is required to validate the victim's standing and the norm violated.
      *   **Compatibilist Predicted Assessment:** Some non-instrumental sanction remains warranted. Even if risk is zero, the agent (assuming general rational capacity) participated in a normative violation. A "symbolic" deprivation or restorative burden is justified to affirm the moral community's standards. To release without acknowledgment treats the harm as morally neutral.
      *   **Skeptic Predicted Assessment:** No deprivation is justified. The brain anomaly highlights the deterministic nature of the act. Without future risk, confinement is purely punitive. Since basic desert is impossible, inflicting deprivation for "symbolic" affirmation is unjustified state violence. The response should be purely medical or supportive, not penal.

  #### Crux 2: Algorithmic Fairness and Metaphysical Agency
  **Question:** Can predictive algorithms satisfy normative demands of fairness without smuggling in metaphysical assumptions about agency (e.g., assuming the offender "could have done otherwise" in a robust sense)?

  *   **Concrete Case:** *The High-Risk First Offender.*
      An offender commits a minor theft (low harm). However, predictive algorithms based on socioeconomic data and psychological profiling assign a high risk of future violent escalation.
      *   **CQ Protocol:** Risk algorithm recommends long-term separation. Harm-proportionality constraint objects, as the actual harm was minor.
      *   **Compatibilist Predicted Assessment:** The harm-proportionality constraint must override the risk algorithm. To detain for a long period based on a minor act treats the offender as a vessel of risk rather than an agent responsible for their actual deeds. This violates the reconstructed desert condition.
      *   **Skeptic Predicted Assessment:** The harm-proportionality constraint is a dangerous distraction. If the risk is genuine and high, public safety justifies the quarantine (analogous to infectious disease control). However, we agree with the Compatibilist that the *algorithm* is likely unfair if it proxies for socioeconomic status. Our disagreement is on *why*: The Compatibilist sees it as violating agency-respect; the Skeptic sees it as violating bodily liberty without medical necessity.

  ---

  ### IV. Note on Verbal Disputes and Evidence Standards

  **1. Verbal Disputes:**
  We acknowledge that a portion of our disagreement is verbal, centering on the terms **"Responsibility," "Desert,"** and **"Proportionality."**
  *   **Vance (Compatibilist)** uses "Responsibility" to denote a status of eligibility for reactive attitudes and social sanction within a deterministic system.
  *   **Thorne (Skeptic)** uses "Responsibility" to imply a metaphysical control condition that is impossible to satisfy.
  *   **Agreement:** We agree that if we define "Responsibility" purely as *eligibility for forward-looking intervention*, we agree. If we define it as *basic desert-entailment*, we disagree. We further agree that "Proportionality" is the most contentious term: for Vance, it is a deontological side-constraint; for Thorne, it is a heuristic for minimizing resentment.

  **2. Evidence Standards:**
  We agree that metaphysical argumentation alone will not resolve the utility of the CQ framework. We stipulate that the following would count as evidence moving the debate:
  *   **Recidivism Data:** If CQ frameworks (harm-justified, risk-timed) show significantly lower recidivism than pure risk-quarantine or pure retributive models, this supports the Compatibilist claim that honoring harm-intuitions has functional utility.
  *   **Psychological Impact:** If offenders subjected to harm-justified confinement report higher levels of perceived legitimacy and moral reintegration than those subjected to risk-justified confinement, this supports the Compatibilist claim that "reconstructed desert" serves a vital psychological function.
  *   **Bias Audits:** If predictive algorithms can be demonstrably purged of socioeconomic proxies, the Skeptic's objection to risk-based duration weakens. If they cannot, the Compatibilist's insistence on harm-proportionality gains weight as a necessary protective constraint.

  **Conclusion:**
  While we remain divided on the metaphysical foundations of desert, we concur that the Calibrated-Quarantine framework offers a promising site for testing whether *forward-looking safety* and *backward-looking fairness* can be institutionally integrated without relying on discredited metaphysics of free will. We recommend pilot studies focusing on the *Low-Risk Harm-Doer* case to test the limits of public justification.

  ***

  **Signed,**

  *Dr. Elena Vance*
  *Dr. Marcus Thorne*
