  ### The Cost Analysis: Which Verdicts Must You Abandon?

  **If you adopt Principle 1 (Ontic Settledness):**
  This principle captures the majority of your philosophical intuitions (Cases 1, 3, 4, 5, 8, 12, 13). However, it forces you to abandon:
  1.  **Case 6 & 7 (Retroactive Truth):** You must accept that the 2019 model and the 2015 Brexit claim were *literally neither true nor false* at the time they were made. You can say they were *accurate* in hindsight, but not that they were *true* in foresight.
  2.  **Case 9 (Negation Asymmetry):** You must abandon the intuition that "I will never write a novel" is False while "I will write a novel" is Neither. Under Settledness, if the future is open, both are **Neither**. The asymmetry is a linguistic prejudice, not a metaphysical insight.
  3.  **Professional Practice (Literalism):** You must admit your trade treats future contingents as fixed when they are not.

  **If you adopt Principle 2 (Resolution Fixity):**
  This principle captures your professional workflow and Cases 6, 7, 10, 11. However, it forces you to abandon:
  1.  **Case 1 (Sun Rise):** You cannot say the sun rising in 2031 is *true now*. It is only true *after* 2031. This contradicts your realist intuition about deterministic physics.
  2.  **Case 13 (Post-Human):** Similar to Case 1. Truth is delayed until the event.
  3.  **The Feeling of Openness:** You must treat the "openness" of Cases 3 and 5 as merely epistemic (we don't know), not ontic (it isn't there). This dissolves the "sea battle" problem by denying its premise.

  ### The Verdict on Your Professional Practice

  You asked if your trade rests on a "convenient incoherence."

  If you accept **Principle 1 (Ontic Settledness)** as the truthful account of the world—which your verdicts on Cases 1, 3, 5, and 13 suggest you do—then your professional practice is a **useful fiction**.

  Scoring forecasters, resolving markets, and ranking models requires treating the future as if it were the past. You assign truth values to propositions that, at the time of assertion, lacked them. This is not incoherent *if* you recognize the category shift. You are not measuring "Truth at $t_0$"; you are measuring "Accuracy at $t_r$ projected to $t_0$."

  **The Honest Conclusion:**
  Your trade does not rest on incoherence, but on a **stipulated convention**. You agree with your readers and participants to treat Resolution Fixity (Principle 2) as the rule for scoring, while privately acknowledging Ontic Settledness (Principle 1) as the rule for reality.

  The friction you feel arises when you confuse the scoring rule with the metaphysical state.
  *   When writing your column, speak to **Principle 1**. (The future is open; the forecast is a wager on what will become true).
  *   When resolving your markets, apply **Principle 2**. (The outcome is fixed; the forecast is right or wrong).

  If you try to make Principle 2 serve as metaphysics, you lose the openness that makes forecasting meaningful (Case 3). If you try to make Principle 1 serve as a scoring rule, you cannot resolve the market (Case 6). Keep them separate. The "incoherence" is only fatal if you claim they are the same thing.
