  ### Application to Four New Cases

  **Case A: The Bus and the Coin**
  *A coin flip is scheduled for tomorrow. The flipper is hit by a bus tonight. The flip never happens.*
  *   **Principle 1:** The proposition "The coin will come up heads" entails that a flip occurs. Since the flip is causally precluded by the bus accident (a settled fact), the proposition is **False now**.
  *   **Principle 2:** At resolution time, the event did not occur. The proposition is **False**. (In professional practice, this would be marked "Void," but metaphysically it is False).

  **Case B: The Reflexive Algorithm**
  *A forecast claims an algo-trading system will move a price. The system reads the forecast and acts on it.*
  *   **Principle 1:** **Neither now.** The truth depends on the forecaster's free choice to publish and the algo's choice to act. Once published and read, it becomes **Settled** (True or False).
  *   **Principle 2:** **Neither now.** At resolution, if the price moved, it is **True** (retrojected). The causal loop is irrelevant to the truth value.

  **Case C: Post-Death and Loved Ones**
  *A claim about an event occurring after your death concerning someone you love.*
  *   **Principle 1:** Depends on the event. If it relies on others' free will (e.g., "My spouse will remarry"), it is **Neither**. If it relies on law/physics (e.g., "My trust will pay out"), it is **True**.
  *   **Principle 2:** **Neither now.** Acquires value at the event time. The fact that you are dead to verify it is irrelevant (Clause C).

  **Case D: The Destroyed Record**
  *A coin is flipped in a sealed room. The room is destroyed. No record survives.*
  *   **Principle 1:** **True or False now.** The physical fact obtained (like Case 2). Your ignorance is irrelevant.
  *   **Principle 2:** **True or False.** The value exists at resolution ($t_r$), even if no scorer can ever access it to assign it.

