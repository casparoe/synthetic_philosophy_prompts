  ### Principle 1: The Principle of Ontic Settledness
  **Definition:** A proposition $P$ about a future time $t$ has a truth value at the present time $t_0$ if and only if the total state of the world at $t_0$, combined with the laws of nature, logically entails $P$ (True) or $\neg P$ (False).
  *   **Clause A (Determinism):** If the chain of causation from $t_0$ to $t$ is physically determined, $P$ is True or False now.
  *   **Clause B (Indeterminism):** If the chain involves irreducible chance or free agency, $P$ is Neither True nor False now.
  *   **Clause C (Logic):** Logical tautologies (e.g., $P \lor \neg P$) are True now, even if $P$ is unsettled. Statistical generalizations about ensembles are True now if the probabilities are fixed properties of the system.
  *   **Clause D (Semantics):** If the truth conditions of $P$ depend on future stipulation (vagueness), $P$ is Neither True nor False now.
  *   **Clause E (Updates):** As time passes and causes are realized, propositions can acquire truth values that they lacked previously.

  ### Principle 2: The Principle of Resolution Fixity
  **Definition:** A proposition $P$ about a future time $t$ has *no* truth value at $t_0$. It acquires a truth value only at the time of resolution $t_r$ (when the event occurs or the possibility expires).
  *   **Clause A (Retrojection):** Once resolved, the truth value is treated *as if* it obtained at $t_0$ for all logical, contractual, and scoring purposes.
  *   **Clause B (Bivalence):** At resolution, every meaningful proposition is either True or False. There is no "Neither" at $t_r$.
  *   **Clause C (Epistemic Independence):** The truth value at $t_r$ does not depend on whether the record survives or is observed, only on what occurred.

