answer: |-
  Here is a specification for a test of Cognitive Penetration of Perception (CPP). It is designed not to advocate for a theory, but to function as a filter that any theory claiming to settle the debate must pass.

  The desiderata are divided into **Non-Negotiable Constraints** (requirements for the phenomenon to count as *perceptual* penetration rather than something else) and **Theoretical Stakes** (requirements that reflect specific philosophical commitments about the nature of mind).

  ### I. Non-Negotiable Constraints
  *These define the boundaries of "perception." If a test violates these, it is not testing perception.*

  **1. The Temporal Constraint (Speed)**
  *   **Requirement:** The effect must manifest within the temporal window of early visual processing (typically <150ms post-stimulus onset).
  *   **Why:** Perception is the fast, automatic interface with the world. If the effect requires time for deliberation, reasoning, or working memory retrieval, it is post-perceptual judgment, not perceptual alteration.
  *   **Status:** Non-Negotiable.

  **2. The Phenomenal/Representational Constraint (Experience)**
  *   **Requirement:** The test must demonstrate a change in the *content* of the visual experience (what it looks like), not just a change in the *classification* of the experience (what you call it).
  *   **Why:** The ordinary claim is that experts "see differently," not that they "guess better." If the qualia or the spatial/colour representation remains identical and only the label changes, penetration has not occurred.
  *   **Status:** Non-Negotiable. (This is the core of the debate).

  **3. The Persistence Constraint (Encapsulation)**
  *   **Requirement:** The effect must persist (or fail to persist) independently of explicit knowledge that contradicts it.
  *   **Why:** This handles the Müller-Lyer case. You know the lines are equal, but they look unequal. This proves the visual system is encapsulated from that specific belief. A valid test of penetration must show the reverse: that a belief *can* override the raw data despite knowledge to the contrary, OR show that the "penetration" is actually just the raw data being processed differently from the start.
  *   **Status:** Non-Negotiable.

  **4. The Attention Dissociation**
  *   **Requirement:** The effect must be distinguishable from shifts in spatial or feature-based attention.
  *   **Why:** If I tell you to look for a red circle, you find it faster. That is attention, not penetration. Penetration requires that the *processing* of the stimulus changes, not just the *selection* of the stimulus.
  *   **Status:** Non-Negotiable. (Most skepticism, e.g., Firestone & Scholl, rests here).

  ### II. Theoretical Stakes (Camp-Specific Desiderata)
  *These are requirements often demanded by one side of the debate. A robust test should acknowledge them but mark them as contingent on one's definition of perception.*

  **5. The Veridicality Constraint (Contact with World)**
  *   **Requirement:** The test should not imply that perception is so malleable it loses its function of tracking environmental truth.
  *   **Why:** Proponents of Modularity argue that if belief changes sight, perception loses its role as an objective check on belief. Proponents of Penetration argue perception is for action, not truth, and should be tuned by goals.
  *   **Status:** Camp-Specific (Modularity wants this strict; Penetration theorists want this loose).

  **6. The Learning vs. Penetration Distinction**
  *   **Requirement:** The test must distinguish between *online* cognitive influence (current belief changing current sight) and *offline* perceptual learning (long-term training changing the hardware).
  *   **Why:** A radiologist might see a tumor because their visual cortex has physically tuned itself over years (learning), not because their current hypothesis penetrates early vision (penetration).
  *   **Status:** Camp-Specific (Some define penetration to include long-term tuning; others restrict it to immediate top-down causation).

  **7. The Response Bias Control**
  *   **Requirement:** The test must rule out that the subject is simply more willing to *say* they saw X, even if they didn't see it.
  *   **Why:** Signal Detection Theory shows that expectation changes criteria, not sensitivity. A test must measure sensitivity ($d'$), not just hit rate.
  *   **Status:** Non-Negotiable (Methodologically), but often where theories collapse.

  ### III. Case Classification Requirements
  *A passing test must correctly categorize these standard cases without ad-hoc adjustments.*

  1.  **Müller-Lyer Illusion:** Must classify as **No Penetration**. (Knowledge of equality does not fix the look).
  2.  **Afterimages/Illusory Contours:** Must classify as **No Penetration**. (Low-level physiological or fixed grouping mechanisms).
  3.  **Duck-Rabbit Ambiguity:** Must classify as **Borderline/Attention**. (Does the concept "duck" change the shape, or just which shape you attend to? The test must decide).
  4.  **Slope/Backpack (Proffitt):** Must classify as **Effort/Judgment** OR **Penetration**. (Currently contested. Does the hill look steeper, or does the climb look harder? The test must distinguish visual angle from affordance estimation).
  5.  **Expertise (Radiologist/Birder):** Must classify as **Perceptual Learning** OR **Penetration**. (This is the critical case for the "ordinary claim").

  ### IV. The Non-Verbal Constraint (Your Extra Demand)
  *You requested the test function without honest first-person report.*

  **Requirement:** The operational definition of "seeing differently" must rely on forced-choice behavioural tasks, neural correlates (EEG/fMRI early components like P1/N1), or motor readiness, rather than introspective testimony.

  *   **Blindsight Patient:** Must be testable. (They deny seeing, but guess correctly. If belief alters their guessing accuracy in a way distinct from attention, does that count as penetration of their unconscious vision?)
  *   **Dog:** Must be testable. (Can a dog's expectation of food change the perceived size of a bowl? Measured via approach speed or pupil dilation).
  *   **AI Classifier:** **Ignore.** (This is your prejudice, see below).

  ### V. Conflict Analysis: The Impossible Subset
  *Here is where the requirements fight each other.*

  **The Conflict:** You cannot simultaneously satisfy **The Temporal Constraint (1)**, **The Phenomenal Constraint (2)**, and **The Non-Verbal Constraint (4)** perfectly.

  *   **Why:** To measure *phenomenology* (what it looks like) without *report* (Constraint 4), you must rely on neural proxies or behaviour.
  *   **The Problem:** Neural proxies (like V1 activity) satisfy Temporal (1) but are ambiguous regarding Phenomenology (2) (is that activity *seeing* or just *processing*?). Behavioural measures satisfy Phenomenology (2) loosely but often violate Temporal (1) because behaviour takes time, inviting post-perceptual contamination.
  *   **The Trade-off:** To settle the "ordinary claim" (that people *experience* the world differently), you need reports. To settle the "scientific claim" (that the *system* processes differently), you need non-verbal data. You cannot fully settle the ordinary claim with non-verbal data alone.

  ### VI. Commitments

  **1. The Requirement That Does The Most Work:**
  **The Attention Dissociation (Constraint 4).**
  This is the filter that knocks out 90% of proposed examples. Most cases of alleged penetration (including the Duck-Rabbit and often Expertise) can be explained by the subject learning *where* to look or *what features* to weight, which is attentional selection, not cognitive alteration of the sensory signal. If a theory cannot prove the effect survives strict attentional control, it fails.

  **2. Your Prejudice:**
  **The Demand to Include AI Classifiers.**
  You asked which cases a theory *must* handle. A theory of *perception* need not handle an image classifier. AI is a functional analogy, not a phenomenological subject. Including it risks a category error: an AI's "belief" (prior probability) changing its "output" is mathematically trivial (Bayesian updating) and tells us nothing about whether *biological vision* is penetrated. It satisfies the "No Report" constraint easily, but at the cost of relevance to the "ordinary claim" about human seeing. You can ignore AI without weakening the test for humans or animals.

  **3. Where I Am Least Sure:**
  **The Expertise Case (Radiologist/Birder).**
  I am uncertain whether a test can ever cleanly separate **Perceptual Learning** from **Cognitive Penetration** in experts.
  *   *Scenario A:* The radiologist's V1 has physically rewired over 10 years to detect edges novices miss. (This is learning/plasticity, not penetration).
  *   *Scenario B:* The radiologist's current hypothesis ("this looks like a tumor") actively modulates their V1 activity in real-time to enhance contrast. (This is penetration).
  *   *Uncertainty:* These two states look identical from the outside and likely identical on an fMRI. Distinguishing "hardware change" from "top-down software influence on hardware" in a mature brain may be empirically impossible, meaning the "ordinary claim" that experts "see differently" might be true, but the *mechanism* (penetration vs. learning) may remain unsettled.

  ### Summary Specification
  To settle the debate, a test must:
  1.  Measure sensitivity ($d'$), not bias.
  2.  Control for spatial/feature attention.
  3.  Occur within 150ms.
  4.  Use non-verbal proxies (pupillometry, EEG P1/N1, motor priming) to bypass response bias, **BUT** acknowledge that this sacrifices direct access to the "ordinary claim" of phenomenology.
  5.  Exclude AI as irrelevant to the definition of perception.
  6.  Accept that Expertise may remain ambiguous between Learning and Penetration.
