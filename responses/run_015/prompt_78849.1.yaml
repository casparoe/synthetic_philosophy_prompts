answer: |-
  I conclude that the case you request cannot be built without relaxing a standard metaphysical premise of epistemology. The blocking premise is the **Entailment Thesis**: that knowledge entails belief ($K \rightarrow B$). If knowledge necessarily includes belief, a speaker cannot know $p$ while failing to believe $p$; the description would be contradictory, not a counterexample. To build the case you need, we must relax this premise, adopting an externalist conception of knowledge (where warrant and truth suffice) distinct from an internalist conception of belief (which requires a feeling of conviction or subjective confidence). Below is the closest possible case constructed under this relaxation.

  ### (a) The Scenario
  Elena is a senior archivist verifying the date of a 19th-century treaty for a public record. She holds the original, signed document in her hands under good light; the date "1842" is clearly written in the header, and she has no reason to suspect forgery or error. Her epistemic position is maximally strong: she has undefeated perceptual warrant, and the proposition is true. However, Elena is recovering from a specific, recent professional humiliation where she misread a similar document due to fatigue. Although she is currently fresh and the evidence is overwhelming, she is gripped by a pathological caution. She tells herself, "I cannot trust my eyes today; I might be hallucinating the '2'." She lacks the internal feeling of conviction that characterizes belief. Nevertheless, recognizing her duty to the evidence before her, she turns to her assistant and states the fact required for the catalog.

  ### (b) The Proposition Asserted and the Assertion Itself
  **Proposition:** "This treaty was signed in 1842."
  **Assertion:** Elena says to her assistant, "Catalog this as 1842," intending to commit herself to the truth of the proposition and to invite the assistant to rely on her authority, despite her internal lack of conviction.

  ### (c) The Verdict Each of the Three Norms Returns
  *   **The Knowledge Norm (Permits):** Elena knows the treaty is from 1842. She has the document in hand, her faculties are functioning, and there are no defeaters. The externalist warrant is sufficient for knowledge.
  *   **The Truth Norm (Permits):** The proposition is true; the treaty is indeed from 1842.
  *   **The Belief Norm (Forbids):** Elena explicitly lacks the doxastic state of belief. She judges that she does not believe it due to her shaken confidence, and her self-report is evidence of this state because it aligns with her reported anxiety and hesitation to trust her own perception, distinct from the evidence itself.

  ### (d) The Single Feature of the Case That Does the Work
  The case relies on the **dissociation of external warrant from internal conviction**. For the case to hold, knowledge must be grounded in the reliability of the source (the document and her vision), while belief must be grounded in the speaker's subjective confidence. The feature is that Elena's evidence is objectively sufficient for knowledge, but her subjective assessment of her own reliability is insufficient for belief.

  ### (e) What Happens When That Feature Is Removed
  If we reinstate the Entailment Thesis ($K \rightarrow B$), the case collapses immediately. If knowledge entails belief, then Elena's possession of knowledge *proves* she believes. The description "she knows but does not believe" becomes a contradiction. The case would then degrade into one of two familiar failures: either she didn't know (because she didn't believe), making it a standard Gettier-style or ignorance case where the Knowledge Norm also forbids assertion; or she did believe (despite her protests), making her self-report unreliable and turning the case into one of insincerity or self-deception, which violates your specification against behavior betraying the state.

  ### (f) How a Defender of the Belief Norm Would Attack the Case, and the Best Reply
  **Attack:** The defender will argue that Elena *does* believe, and her protestations are merely modesty or anxiety. They will claim that assertion is the *expression* of belief; since she asserted $p$, she must have believed $p$. Her claim to lack belief is a philosophical error about her own mind.
  **Reply:** The reply distinguishes between *dispositional belief* (acting as if $p$ is true) and *occurrent belief* (feeling convinced). Elena acts on $p$ because the *evidence* compels her, not because her *mind* is settled. She asserts *on the basis of the document*, not *on the basis of her conviction*. The norm of assertion should track the grounds for the claim (the document), not the psychological temperature of the speaker. If we forbid her assertion, we prioritize her anxiety over the public evidence she holds.

  ### (g) Your Own Verdict: Is the Assertion Licensed?
  The assertion is licensed. The intuition cuts against the Belief Norm. Elena is doing exactly what an assertor ought to do: transmitting information she is in a position to know. To silence her because she lacks internal confidence is to privilege private psychology over public warrant. However, because this verdict requires rejecting the Entailment Thesis, the case is not a decisive refutation of the Belief Norm for those who hold that knowledge is a species of belief. It establishes only that **if** knowledge can exist without belief, then belief is not necessary for licensed assertion. It shifts the burden to the Belief Norm defender to prove that knowledge *must* include belief, rather than proving directly that assertion requires belief.
