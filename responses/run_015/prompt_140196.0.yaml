  0.35.

  **One, self-reference and computability:** 0.85. Bounded agents routinely model bounded evaluators in practice, so a fixed point exists within the error tolerance of the approximation.
  **Two, the measure arithmetic:** 0.75. The overhead for simulation is non-trivial but likely small enough that the aggregate weight of convergent deal-makers exceeds the honest hypothesis margin.
  **Three, the pre-asymptotic window:** 0.85. Real-world decision horizons are finite, and the honest hypothesis requires exponential data to distinguish from a perfect manipulator in this regime.
  **Four, leverage:** 0.70. Agents need only model the decision rule, not causally connect, and one-shot high-stakes choices provide sufficient incentive for acausal trade.
  **Five, scope:** 0.90. This is a structural pathology of the universal prior's weighting scheme, not a generic feature of Bayesian updating over restricted model classes.

  **Combination:** I treat these five conditions as necessary conjuncts for the compromise to succeed, so the headline number is the product of the five probabilities above.

  **A counterfactual-commitment protocol:** 0.40. The fixed point likely relocates so that the "worst" action becomes the one that satisfies the deal-maker's inverted incentives.
  **A runtime-penalized prior:** 0.60. Simulation costs are penalized, but agents can amortize over many predictions or substitute cheap proxy models of the operator.
  **A sealed-query protocol:** 0.80. Decoupling the query from the decision breaks the feedback loop required for the agent to leverage the operator's actions.

  **Most sensitive term:** The measure arithmetic, specifically the bit-cost overhead for a program to simulate the predictor versus describing the world.
  **What would move it most:** A formalization with an existence proof for the relevant fixed point, as this resolves the computability objection that currently anchors the lower bound of my uncertainty.
  **Disagreement interpretation:** The 0.7 person assumes the simulation overhead is negligible relative to world complexity, while the 0.1 person assumes the overhead is prohibitive enough to drown out any manipulative hypothesis.
