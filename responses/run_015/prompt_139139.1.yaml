  1. Headline
  The dispute translates to whether moral preference data reflects a single latent reward function $R^*$ obscured by noise and distributional shift, or whether the data generation process is causally disconnected from any such function. Robust universalism claims $R^*$ exists and variation is epistemic noise or feature-mapping divergence. The debunking argument claims the causal graph of label generation excludes $R^*$, rendering justification impossible. The methodological reply treats the WEIRD bias as severe sampling error preventing OOD generalization, not evidence against $R^*$. The largest casualty in translation is the normative force of "justification." In RLHF, justification is usually reduced to loss minimization or agreement metrics; the philosophical claim that a belief is *warranted* by facts rather than causes becomes a claim about causal graphs and identifiability, stripping the deontic weight. We can model the structure of the argument, but the stake—whether we *ought* to treat labels as truth-apt—becomes a hyperparameter choice rather than a discovered constraint.

  2. Vocabulary map
  **Moral Judgment:** A binary or ranked preference label $y$ provided by an annotator $a$ on input $x$. **Moral Fact:** A latent reward function $R^*(x)$ independent of the annotator pool, or a canonical aggregation rule $A(\{y_i\})$ yielding a gold standard. **Cultural Variation:** Distributional shift $P_{WEIRD}(Y|X) \neq P_{non-WEIRD}(Y|X)$. **Justification:** A label $y$ is justified if its generation process is causally linked to $R^*$, not merely caused by cultural priors $C$. **Objectivity:** Sense (i) $R^*$ exists; (ii) Aggregation rule $A$ is fixed; (iii) Convergence under idealized compute/reflection; (iv) Model transfers OOD. **Idealisation:** An optimization trajectory where noise $\epsilon \to 0$ and compute $\to \infty$, assumed to reveal $R^*$. **Constitutive Failure:** The target is defined by the pool's aggregate (social choice), so no external $R^*$ exists to converge upon. **Sampling Failure:** The pool is unrepresentative of a fixed $R^*$; better sampling recovers $R^*$. **Reason-Set Divergence:** Feature spaces $\phi$ differ across populations; **Weight Divergence:** $\phi$ is shared, but weights $w$ differ. **Reward Hacking:** Optimizing for measured reward rather than intended $R^*$. **Bradley-Terry:** The likelihood model used to fit preferences to rewards. **Inter-annotator Agreement:** Metric for consistency across $a_i$.

  3. Position 1 in my terms
  This position asserts a single latent reward function $R^*$ exists (Objectivity-i). Observed variation is treated as noise $\epsilon$ or covariate shift in non-moral features. Populations share a common feature space $\phi$ (no reason-set divergence) but may apply different weights $w$ due to local priors or misidentification of non-moral facts. Under idealisation (Objectivity-iii), increased information and reflection reduce $\epsilon$, causing populations to converge on $R^*$. The variation is effectively measurement artifact or sub-optimal inference. Constitutive failure is rejected; the target exists independently of the annotator pool. Sampling failure is the only operational issue. If we correct for cultural priors, the Bradley-Terry fits should converge. OOD transfer (Objectivity-iv) is expected once the model learns $R^*$ rather than pool-specific biases. The claim is that the human preference model is identifiable and unique, despite current high variance in labels across demographics. It implies that reward hacking occurs when we fit to surface-level cultural markers instead of the deep structure. We assume the loss landscape has a single global minimum corresponding to $R^*$.

  4. Position 2 in my terms
  This position attacks the causal graph linking labels to $R^*$. It argues the data generation process is fully explained by cultural learning mechanisms $C$ or evolutionary pressures $E$, without $R^*$ appearing as a causal node. If $P(Y|X, C)$ is identifiable without invoking $R^*$, then $R^*$ is epistemically idle. In the evolutionary variant, the reward model was shaped by fitness gradients, not truth-tracking gradients; thus, current preferences are overfit to ancestral environments, not moral facts. This denies Objectivity-i and Objectivity-iii; there is no convergence under idealisation because the optimization target is local fitness, not truth. It implies constitutive failure: if labels are constituted by causal history rather than fact-tracking, there is no external target to sample toward. Weight divergence is irrelevant if the feature space itself is an adaptation rather than a truth-bearing structure. Justification fails because the labels are causally disconnected from moral facts. We cannot distinguish this from Position 1 via transfer metrics alone; a model might transfer well due to shared evolutionary history without tracking $R^*$. The debate becomes about identifiability: can we distinguish a truth-tracking model from a fitness-tracking model using only preference data? Current operational grip on reason-set divergence fails here; high transfer loss could mean different $\phi$ or no $R^*$.

  5. Position 3 in my terms
  This position isolates the problem to sampling bias. It accepts Objectivity-i ($R^*$ exists) but argues current literature suffers from severe distributional shift ($D_{train} \ll D_{human}$). The WEIRD pool is a biased subset; generalizing from it is an OOD error (failure of Objectivity-iv). It does not entail constitutive failure; better sampling would converge on $R^*$. It remains agnostic on Objectivity-iii (convergence under idealisation) but insists current disagreement is due to insufficient data coverage, not fundamental incompatibility. It treats reason-set divergence as a feature engineering problem: if we expand the vignette space to include culturally salient features, the feature space $\phi$ aligns. The claim is purely statistical: the estimator is biased, not the target. No conclusion about objectivity follows from current variance because the confidence intervals on $R^*$ are wide due to narrow sampling. We need larger, stratified annotator pools to reduce variance.

  6. Smuggled assumptions
  I imported several ML assumptions not present in the philosophy. First, **Task Given:** I assumed the moral vignette $x$ is a fixed input space. Philosophy debates whether the situation itself is construed differently. Second, **Loss Given:** I assumed minimizing disagreement (Bradley-Terry loss) is the proxy for truth. Philosophy asks if agreement tracks truth. Third, **Principal's Objective:** I assumed there is a single objective to optimize. Social choice might be multi-objective or undefined. Fourth, **State Description:** I assumed non-moral facts are separable features. Philosophy often holds moral/non-moral facts are entangled. Fifth, **Identifiability:** I assumed $R^*$ is identifiable from preferences. Philosophy allows for underdetermination. Sixth, **Convergence:** I assumed idealization leads to a point. Philosophy allows for persistent reasonable disagreement. Each import narrows the philosophical space to fit the optimization framework. I also assumed a static environment, whereas moral contexts evolve.

  7. Residue report
  **Clean Translation:** The sampling vs. constitutive distinction maps well to sampling failure vs. undefined loss landscape. Weight vs. reason-set divergence maps to feature space alignment vs. weight regularization. Objectivity-iv (OOD transfer) is a precise operationalization of universalism. **Distorted Translation:** Objectivity-ii (canonical aggregation) is distorted. In RLHF, aggregation is usually majority vote or RL-optimal, not necessarily "right." The philosophical claim is about legitimacy, not optimization stability. Objectivity-iii (idealisation) is distorted by assuming compute/reflection reduces noise. Philosophy allows idealization to reveal deeper conflict, not resolve it. **Unexpressible:** The normative force of "justification." In ML, a justified label is one consistent with $R^*$. In philosophy, it is about warrant. We can model the causal graph, but we cannot model the *obligation* to treat labels as truth-apt. Also, the concept of "moral fact" as non-natural is unexpressible; we must treat it as a latent variable, which naturalizes it by definition. The debate about whether moral facts *exist* becomes a debate about whether a latent variable improves loss, which changes the metaphysical stakes to pragmatic ones. The "ought" of moral judgment becomes the "ought" of model generalization, which are distinct categories. The philosophical worry is that we are building systems on sand; the ML worry is that we are building systems with high validation loss. These are not identical. The translation captures the epistemic structure but loses the normative stakes. We can see *that* a position claims objectivity, but not *why* it matters beyond performance metrics. The residue is the gap between predictive accuracy and moral authority. Operational grip on reason-set divergence is limited: low transfer indicates divergence, but cannot distinguish between different $\phi$ and absent $R^*$.

  8. Whose fault is the residue
  The residue is partly the framework's fault, partly the debate's. **Framework Defect:** RLHF vocabulary is inherently naturalistic and instrumental. It cannot express non-natural moral facts without reducing them to latent variables. To fix this, you would need to add a "normative validity" metric separate from loss, but that begs the question by assuming such a metric exists. **Debate Defect:** The philosophical debate often conflates epistemic access with metaphysical existence. My vocabulary forces this apart (latent variable vs. causal graph), showing the debate was less crisp. The sliding between sampling and constitutive failure in philosophy is exposed by the ML distinction between biased estimator and undefined target. Where the vocabulary fails (normative force), it is because ML is descriptive/prescriptive regarding performance, not metaphysical warrant. Adding "warrant" would require external axioms not derivable from preference data, which breaks the empirical loop of post-training. The philosophy lacks operational definitions for convergence; the ML lacks normative grounds for optimization targets. Both contribute to the residue.
