      *   *The "Documentary" Clue:* This is the strongest constraint. Enjoying *real* suffering is morally problematic. Enjoying *represented* suffering is aesthetically permissible.
      *   *The "Instrumental Music" Clue:* The sadness must be in the *form*, not just the content. It's about the expression of emotion, not the event itself.

      *   *Draft Principle:* "We value painful art when the pain is formally contained within a fictional or abstract structure that allows for contemplative empathy, provided the object of empathy is morally worthy."
      *   *Refining for Precision:* Let's look for a philosophical concept. **The Sublime**? **Aesthetic Distance**? **Moral Sentimentalism**?
      *   *Best Fit:* **Aesthetic Transformation of Suffering via Moral Empathy.**
      *   *Wait, let's look closer at the "Repellent Protagonist" vs. "Documentary" tension.*
          *   Documentary: Real pain -> No enjoyment.
          *   Repellent Protagonist: Fictional pain -> No enjoyment.
          *   Decent Protagonist: Fictional pain -> Enjoyment (enrichment).
