      *   *Proposed Principle:* **The Principle of Contemplative Empathy within Aesthetic Distance.**
      *   *Definition:* Painful art is valuable when it creates a safe aesthetic space (fiction/abstraction) that permits the viewer to contemplate human vulnerability through empathy with a morally worthy subject, without the moral obligations triggered by real suffering or the moral revulsion triggered by unworthy subjects.

      *   *Critique of this Principle:* Does it explain the rejection of sentimentality? Yes, sentimentality bypasses contemplation and forces a visceral reaction (manipulation). Does it explain music? Yes, music creates the space for contemplating emotion itself. Does it explain documentaries? Yes, real suffering removes the "aesthetic space" and triggers moral obligation.

