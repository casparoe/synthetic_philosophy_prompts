      *   *Check against Sentimentality:* Sentimentality violates the "Contemplation" aspect. It demands a reflexive tear, not a contemplative state. It manipulates rather than reveals. I need to add a clause about **Formal Integrity** or **Non-Manipulation**.
      *   *Revised Statement:* "Painful art is enriching when it creates a space for **contemplative empathy** regarding human vulnerability. This requires three conditions: (1) **Fictional/Abstract Framing** (distinguishing it from real moral emergencies), (2) **Moral Worthiness of the Subject** (enabling identification rather than judgment), and (3) **Formal Necessity** (the suffering arises from the internal logic of the work, not external manipulation)."

      *   *This covers everything.*
