      *   So the principle must hold both.
      *   *Self-Correction:* Is there a conflict? Some might argue we *can* enjoy tragedies with repellent protagonists (e.g., Macbeth, Richard III). The user says they *lose engagement*. So the principle must account for *their* specific psychology, not universal truth.
