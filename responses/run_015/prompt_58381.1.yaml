answer: |-
  The principle that best systematizes your verdicts is **The Principle of Protected Contemplative Empathy**.

  ### The Principle Stated
  Painful art provides aesthetic enrichment if and only if it sustains a state of **contemplative empathy** toward human vulnerability. This state is fragile and requires three protective conditions to remain distinct from ordinary moral experience:

  1.  **Aesthetic Safety:** The suffering must be framed as representation (fiction or abstraction), not reality, ensuring the viewer has no moral obligation to intervene.
  2.  **Moral Accessibility:** The object of empathy (the protagonist or implied subject) must be morally worthy enough to permit identification, ensuring the viewer's judgment does not block their compassion.
  3.  **Formal Integrity:** The suffering must arise from the internal logic or necessity of the work, not from external manipulation, ensuring the emotional response is earned rather than coerced.

  ### How It Systematizes Your Verdicts
  *   **Canonical Tragedy (Liked):** Satisfies all three. The fiction provides **Safety**; the "broadly decent" protagonist ensures **Accessibility**; the "understandable error" (hamartia) provides **Formal Integrity** (the ruin feels inevitable, not random).
  *   **Sad Instrumental Music (Liked):** Satisfies **Safety** (abstract) and **Formal Integrity** (musical logic). **Accessibility** is satisfied by default as there is no moral agent to judge, allowing pure contemplation of the emotion itself.
  *   **Sentimental Tearjerkers (Disliked):** Violates **Formal Integrity**. They work hard to "elicit tears" through manipulation rather than allowing emotion to arise from structural necessity, blocking true contemplation.
  *   **Repellent Protagonists (Disliked):** Violates **Moral Accessibility**. Your moral judgment of the character overrides your capacity for empathy, turning the suffering into justice or disgust rather than tragedy.
  *   **Documentaries of Real Suffering (Disliked):** Violates **Aesthetic Safety**. Because the suffering is real, your moral obligation to intervene (or the guilt of witnessing without acting) breaches the aesthetic frame, making "enjoyment" feel morally amiss.

  ### Do Any Verdicts Need to Give Way?
  No. Your intuitions are remarkably consistent with this account. A unified explanation is possible without sacrificing any of your current verdicts. The tension you feel between enjoying fictional pain and rejecting real pain is not a contradiction, but the defining boundary of the aesthetic experience itself (the "Aesthetic Safety" condition).

  ### Prediction for the Interactive Drama Case
  **Case:** An interactive drama in which you freely select the choices that you know will bring about the sad outcome you then witness.

  **Prediction:** You will find this experience **less enriching and more morally unsettling** than canonical tragedy, likely failing to provide the same aesthetic value.

  **Reasoning:** This case threatens the **Aesthetic Safety** condition. In canonical tragedy, the protagonist's error is *theirs*; you are a safe witness to *their* vulnerability. In this interactive scenario, the agency is *yours*. By freely selecting the path to ruin, you transition from a **contemplator** of vulnerability to a **co-author** of suffering.

  Even though the context is fictional, your direct moral agency introduces a form of complicity that mimics real-world moral decision-making. This triggers self-evaluation (guilt or responsibility) rather than the disinterested contemplation required for tragic enrichment. You may feel you are treating the suffering as a mere spectacle to be unlocked by your will, which undermines the **Formal Integrity** of the pain (it becomes contingent on your whim, not narrative necessity). Consequently, the "protective" frame is pierced by your own conscience, shifting the experience from *tragic catharsis* to *simulated moral fault*.
