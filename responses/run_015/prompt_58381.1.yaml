      *   *Cognitive/Truth Value:* We learn from tragedy. But why not learn from documentaries? And why does instrumental music teach us?
      *   *Formalism:* Focus on structure/beauty. Explains music and canonical tragedy (well-constructed). Explains rejection of sentimental slop (poor construction/manipulation). Struggles with the moral condition (repellent protagonist) and the real suffering condition (form could be beautiful, but content is real pain).
      *   *Make-Believe/Pretense (Walton):* Tragedy is fictional, so no real harm. Explains why we don't enjoy documentaries (real harm). But doesn't fully capture the *moral* requirement of the protagonist or the specific rejection of sentimentality.
