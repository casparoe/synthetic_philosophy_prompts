      *   *Stance 1 (Standard Evaluative):* This is the common intuition (phenomenal consciousness view). It preserves the intrinsic badness of pain by calling asymbolia a pathology/deficit. It's defensible because it aligns with the majority of human experience and treats asymbolia as an exception/glitch rather than redefining pain itself. *Problem:* It risks being ad hoc (just calling it "broken" to save the theory).
      *   *Stance 2 (Representationalist):* Similar to 1 but focuses on content. If pain represents damage, it's bad because damage is bad. Asymbolia patients represent damage but don't care. *Problem:* If they don't care, is the representation still "negative"? It struggles to explain why the *feeling* lacks badness if the content is the same.
