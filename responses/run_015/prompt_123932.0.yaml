answer: |-
  Your intuition is sounder than your tentative principle. The 'leverage discount' you proposed captures the right instinct—that extraordinary claims require extraordinary evidence—but it risks collapsing into scepticism if applied too bluntly. It threatens to undermine the very existential risk mitigation you endorse in Case 6, because those models also rely on high-stakes, low-probability calculations.

  Here is a refined principle that honours your verdicts, followed by an evaluation of rivals and the application to your three new cases.

  ### The Principle: Epistemic Grounding

  **Act on expected value only when the probability estimate is grounded in a causal model with independent empirical traction.**

  This principle consists of four clauses, each traced to your cases:

  1.  **Linearity of Value:** Where the causal mechanism is established, value scales linearly with the number of lives affected.
      *   *Source:* **Case 1** (Charity) and **Case 4** (Established Power). You are happy to pay more to save more, provided the link between £5 and lives saved is robust. This rejects the idea that a life's value diminishes at scale.
  2.  **The Plausibility Ceiling:** For bare assertions (claims lacking independent verification), the assigned probability must decrease faster than the stakes increase. As the claimed number of lives ($N$) approaches the absurd, the probability of the claim being true must approach zero super-linearly.
      *   *Source:* **Case 2** (10^30) and **Case 3** (10^6). This explains why you are *less* inclined to pay in Case 2 than Case 3. The magnitude of the claim itself degrades its credibility. A claim of 10^30 lives is not just 'bigger' than 10^6; it is categorically less plausible because it requires physics or metaphysics for which you have no prior evidence.
  3.  **The Consilience Exception:** Disjunctions of speculative scenarios are permissible if they share a common causal basis and are not mutually exclusive. Mutually exclusive bare claims cancel each other out.
      *   *Source:* **Case 6** (Crowd vs. X-risk). This saves your support for existential risk mitigation. X-risk models are based on physics, biology, or history (causal basis), and multiple risks can exist simultaneously (non-exclusive). The crowd of muggers offers mutually exclusive claims (only one can be the true controller) with no causal basis. Therefore, the crowd is noise; x-risk is signal.
  4.  **The Credence Asymmetry:** In the absence of evidence, threats are assigned a higher prior probability than promises of equivalent magnitude, due to the lower resource cost of malevolence compared to benevolence.
      *   *Source:* **Case 5** (Benefactor). This explains your comfort in refusing the benefactor. Creating 10^30 flourishing lives requires immense energy and intent; torturing them requires only a switch. A being capable of the former is less likely to need your £5 than a being capable of the latter. Thus, the threat is more credible than the promise, even if both are rejected.

  ### Evaluation of Rivals

  Does this principle survive against the obvious alternatives?

  *   **Value Ceilings:** This suggests capping the value of any outcome (e.g., no outcome is worth more than 1 billion lives).
      *   *Verdict:* **Reject.** This forces you to give up **Case 4**. If the being with established power threatens 10^30 lives, a ceiling would tell you to treat it as 1 billion. But you said you would mortgage the house. You believe the stakes are real when the evidence is real.
  *   **Probability Cutoffs:** This suggests treating any probability below a certain threshold (e.g., 1 in a billion) as zero.
      *   *Verdict:* **Reject.** This forces you to give up **Case 8**. You are willing to pay to reduce a one-in-a-million extinction risk. A hard cutoff would blind you to genuine, modelled low-probability risks. The distinction must be about the *source* of the probability, not the size.
  *   **Verifiability Restriction:** This suggests ignoring outcomes you cannot in principle verify.
      *   *Verdict:* **Partial Match.** This handles Case 2 well but struggles with **Case 6**. We cannot verify the prevention of an existential catastrophe (since we wouldn't be here to check). Yet you support mitigating it. Epistemic Grounding is better because it allows for unverified outcomes provided the *model* is verified.

  ### Sacrifices and Recommendations

  No principle saves every intuition perfectly. Here is where Epistemic Grounding demands compromise:

  1.  **Case 7 (Escalation/Policy):** Your intuition here is to adopt a standing policy of refusal to avoid training exploiters. Epistemic Grounding says you should evaluate the evidence *fresh* each time. If a mugger tomorrow provides the 'independent empirical traction' of Case 4, you must pay, regardless of your policy.
      *   *Recommendation:* **Overturn your Case 7 intuition.** A policy of ignoring evidence is dangerous. If the evidence becomes robust (Case 4), you must act. The fear of 'training' exploiters is secondary to the actual stakes when the evidence is real.
  2.  **Case 5 (Asymmetry):** While the Credence Asymmetry clause saves this, a strict expected-value maximiser might argue that if the probability is low enough for both, the difference in comfort is irrelevant.
      *   *Recommendation:* **Keep this.** It is a robust heuristic. Malevolence is cheaper than benevolence. It is rational to weight the probability of a threat higher than a promise when evidence is scarce.

  ### Application to Three New Cases

  Here is how Epistemic Grounding applies to the scenarios you added.

  **1. The Proof Tomorrow**
  *A claimant promises that, whether or not I pay, he will publicly and conclusively demonstrate his power tomorrow.*

  *   **Verdict:** **Do not pay.**
  *   **Reasoning:** This fails the causal test. The demonstration is happening *regardless* of your action. Your £5 purchases no additional security. The proof validates his *capacity*, but since the outcome (the torture or salvation) is not contingent on your payment in this specific instance, the expected value of paying is zero. It turns the interaction into a donation to a powerful being, not a transaction for safety. Unless he proves that *today's* victims are spared *because* of today's payment, the causal link is broken.

  **2. The Copy Scenario**
  *A claimant in a world where I already have strong evidence that I am one of 10^30 copies of myself facing this identical choice, so that my £5 either changes nothing or changes everything 10^30 times over.*

  *   **Verdict:** **Pay the £5 (conditionally).**
  *   **Reasoning:** This tests your 'leverage discount'. In your original principle, you discounted because you *suspected* you might be a decoy. Here, you *know* you are one of many copies. However, if the evidence for the copies is 'strong' (meeting the Case 4 standard of established power), then the leverage discount is no longer a heuristic for scepticism; it is a fact of the physics.
      *   If your decision is causally isolated (your £5 is just yours), your leverage is diluted, and you should not pay.
      *   However, if the copies are identical and facing identical choices, your decision is *logically* correlated with theirs. If you pay, they likely pay. Therefore, your act leverages 10^30 × £5. Under Epistemic Grounding, since the 'copy' mechanism is evidenced (Case 4 standard), you must accept the implications of that model. If the model implies logical correlation, you pay. If it implies causal isolation, you don't. Given the stipulation 'changes everything 10^30 times over', the principle dictates you **pay**, because the evidence grounds the leverage rather than undermining it.

  **3. The Belief Tax**
  *A claimant who asks for no money at all, only that I talk myself into believing his claim, and says the lives are spared if I succeed.*

  *   **Verdict:** **Do not attempt to believe.**
  *   **Reasoning:** This fails the empirical traction test. You cannot ground a probability estimate on a voluntary mental act. To believe a claim because believing it saves lives is circular; it treats the belief as the cause of the safety, without a verified mechanism linking the two. This is Pascal's Wager in disguise. Epistemic Grounding requires the probability to come from *outside* your head (models, evidence, track records). Since you cannot generate independent evidence by willing yourself to believe, the probability remains grounded in the bare assertion, which is discounted to near zero by Clause 2 (Plausibility Ceiling).

  ### Summary

  Your 'leverage discount' was close, but it treated the magnitude of the claim as the problem. It is not the magnitude that is the problem; it is the **lack of grounding**.

  Adopt **Epistemic Grounding**. It allows you to fund existential risk (grounded in science) while ignoring muggers (grounded in nothing). It explains why you feel differently about threats and promises (cost of commitment). It requires you to abandon the idea of a blanket 'never pay' policy (Case 7), because if the evidence ever becomes real, you must be willing to pay. That is not a bug; it is the only way to ensure you don't ignore a genuine catastrophe because you were trying to be clever.
