answer: |-
  This is a precise and phenomenologically rich observation. You are describing a shift in *practical orientation* that leaves *theoretical commitment* untouched. The client affirms the same facts (she lied, she had agency, she was damaged) but alters the *normative pressure* he exerts on those facts.

  To find the right carving, we need to test this against the three closest existing conceptual tools. We will see why each fails to capture the specific mechanics of the "flip" you are witnessing.

  ### Candidate 1: The Objective Attitude
  The most immediate philosophical fit is the classic distinction between the "participant stance" and the "objective stance." In the participant stance, you view the other as a moral agent, liable to praise and blame. In the objective stance, you view them as a subject to be managed, cured, or understood causally.

  **Why it fails:**
  The failure here is in the *relational consequence*. In the classic formulation, adopting the objective stance is a form of withdrawal. You step out of the interpersonal relationship to look *at* the person rather than *with* them. It is often a response to the belief that the other is *incapable* of moral participation (e.g., due to insanity or extreme immaturity).

  In your cases, the husband is not withdrawing. He is not treating her as a patient to be cured and then left; he is treating her as a partner whose "leak" must be fixed so the partnership can continue. He is staying *in* the participant relationship but changing the *tools* of that relationship. Furthermore, the classic objective stance is usually forced upon us by the recognition of incapacity. Your clients are choosing this stance voluntarily, often while explicitly affirming her capacity. They are not saying, "She can't help it." They are saying, "She can help it, but I will not demand she help it right now." That is a modulation of engagement, not a withdrawal from it.

  ### Candidate 2: Moral Disengagement
  This concept comes from social psychology and ethics. It describes the process of convincing oneself that ethical standards do not apply to a specific situation or person, allowing one to act without guilt or blame.

  **Why it fails:**
  The failure here is in the *status of the norm*. Moral disengagement requires a temporary suspension of the moral standard itself. The subject convinces themselves that "this isn't really wrong" or "rules don't apply here."

  In your observation, the moral standard remains fully intact. The husband does not decide that lying about money is acceptable. He does not decide that he has no right to be angry. In fact, the anger returns later, proving the norm was never dismantled. Disengagement dissolves the tension; your clients are *containing* the tension. They are holding a valid moral claim but refusing to cash it in. Disengagement is a change in judgment; your "flip" is a change in collection strategy.

  ### Candidate 3: Aspect Perception (Seeing-As)
  This is a cognitive concept: the ability to see the same data in two different organizations (the duck-rabbit illusion). One can see the partner as "a liar" or as "a scared child."

  **Why it fails:**
  The failure here is in the *volition* and the *stakes*. Aspect perception is often passive or perceptual; you suddenly see the rabbit. But your clients describe stepping into the frame deliberately to get through tax season. It is a tool, not just a perception.

  More importantly, aspect perception is primarily descriptive. Seeing her as a "scared child" is a description of her causes. But the flip you are describing is *normative*. It changes what he is allowed to *do*. In the first frame, he is allowed to demand. In the second, he is allowed to fix. The shift isn't just in how he sees her; it's in what he takes his own permissions to be. Aspect perception explains the view; it doesn't explain the change in *authority*.

  ***

  ### The Concept Carving
  Since existing labels miss the mark, we must carve the concept based on the mechanics you described.

  **The Mechanism:**
  The core of this phenomenon is the separation of *validity* from *enforcement*.
  In the first frame (let's call it the Accounting Frame), the husband asserts both the validity of the norm ("Lying is wrong") and his right to enforce it ("You owe me").
  In the second frame (the Maintenance Frame), he retains the validity of the norm ("Lying is wrong") but suspends his right to enforce it ("I will not collect this debt right now").

  This is not forgiveness, because forgiveness cancels the debt. This is not repression, because the debt is acknowledged. It is a **temporary suspension of the claim to satisfaction**.

  **Boundary Cases:**
  To ensure this concept is sharp, we must distinguish it from its neighbors:
  1.  **Vs. Repression:** In repression, the anger is denied or pushed into the unconscious. In this flip, the anger is acknowledged as valid but deemed *inexpedient*. The client can say, "I am angry, and I am right to be, but I will not act on it."
  2.  **Vs. Determinism:** In a deterministic view, the anger is dissolved because the partner is seen as causally determined. In this flip, the partner is seen as free, but the relationship is prioritized over the retribution.
  3.  **Vs. Bargaining:** In bargaining, the suspension of anger is traded for something ("I won't be angry if you do X"). In this flip, the suspension is unilateral and strategic, aimed at system stability (getting through tax season) rather than exchange.

  **The Belief-Change Counterfactual:**
  You asked what would have to be true for you to be wrong about this *not* being a change of belief.

  For this to be a change of belief, the client would have to undergo a shift in his *metaphysics of agency* or his *axiology of money*.
  *   **Scenario A (Agency):** He would have to convince himself that she *could not* have done otherwise. He would have to adopt a hard determinist view of her childhood trauma. If this were true, the anger wouldn't just feel "inappropriate"; it would feel *mistaken*, like being angry at a tree for dropping a leaf.
  *   **Scenario B (Value):** He would have to convince himself that the money *does not matter*. If this were true, the hurt would vanish, not just the demand for apology.

  **How to tell the difference from the inside:**
  The phenomenological marker is the *texture of the silence*.
  *   **In Belief Change:** The anger dissipates because the *fuel* is gone. When he thinks of her lying, he feels pity or neutrality. If you asked him, "Do you hold her responsible?" he would say, "No, she couldn't help it." The silence is peaceful.
  *   **In The Flip:** The anger remains fueled but the *engine* is disengaged. When he thinks of her lying, he feels a tightness, a cost. If you asked him, "Do you hold her responsible?" he would say, "Yes, but I'm not bringing it up." The silence is effortful. It feels like holding a weight without putting it down.

  The key diagnostic is reversibility triggered by new data. In Belief Change, new data (e.g., more lying) would deepen the pity or confirm the determinism. In The Flip, new data (e.g., finding a hidden account) reignites the enforcement immediately because the validity of the norm was never actually touched. The anger comes back "unbidden" because the claim was never cancelled, only shelved.

  ***

  ### The Receipt

  The concept you are looking for is the voluntary, temporary suspension of the enforcement of a normative claim, while retaining the validity of that claim, for the sake of relational maintenance. It is a shift in the mode of engagement, not the content of judgment.

  The name for this is **Reactive Bracketing**.
