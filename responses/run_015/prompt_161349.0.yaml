answer: |-
  Chair of Governors, Head Teacher, members of the staff, families, and most importantly, the leavers of Anning College.

  It is a particular pleasure to stand here in the marquee, surrounded by the specific quiet hum of a Warwickshire summer afternoon. We are gathered to celebrate what has been achieved, to acknowledge the work that has been done, and to mark the end of a chapter that began seven years ago for some, and intensifyingly over the last two for most. But I am conscious that for the Upper Sixth, this ceremony is not a full stop. It is a comma. There are seven weeks remaining before results day. For many of you, the university offers you hold are conditional, turning on grades you do not yet have.

  The Head Teacher asked me, in advance of today, to offer you a promise. He asked me to stand here and tell you that everything will work out. He wants me to say that because you are here, because you have sat in these classrooms, and because you have been taught by the staff seated behind me, you will undoubtedly succeed. He wants me to close the gap between today and results day with words of certainty. I understand why he asked. It is a kind request, born of a desire to lift the weight from your shoulders for the duration of this speech. But I owe you something more durable than comfort bought at the price of honesty.

  There is an inference that tempts us all, one that runs through the fabric of days like this. It goes like this: Anning College is a good school. You have been taught well. Pupils who are taught well end up all right. Therefore, you will be all right. It is a comforting chain of reasoning. It is also, strictly speaking, one I am not entitled to make.

  I cannot assert the conclusion because my belief in it is not sensitive to the truth. If you were not to be all right—if results morning were to bring disappointment—I would likely still stand here and say you will be fine. I would offer the same consolation, in the same words, because that is what friends do when things go wrong. Since I would produce this belief even in the nearest world where it is false, I cannot claim to know it is true. Furthermore, the premises are weaker than they appear. The belief that the school is good might persist even if it were not, sustained by loyalty rather than evidence. The belief that pupils taught well end up all right rests mainly on the alumni who return to speak at Speech Days, a sample whose composition would look much the same even if the rule were false, because those who did not end up all right rarely come back to tell us so.

  I cannot promise you the future. But I am not here to dismantle your confidence; I am here to relocate it. The fact that I do not know how results day goes does not spread backwards and infect what I do know about the seven years in front of me. I know the work was done. I know the essays were written, often late at night. I know the questions were asked in seminars that ran over time. I know these things were taught by people who meant what they said. That knowledge is secure. It does not depend on the postman in seven weeks.

  This asymmetry is the practical discipline I recommend to you. When anxiety strikes, do not ask the unanswerable question, "Will it work out?" That question looks too far ahead, into a fog where your belief cannot track the truth. Instead, ask something near at hand: "What would have to be the case for this effort not to matter?" Look at the work you have done. Look at the understanding you have gained. For that not to matter, the world would have to be a place where curiosity counts for nothing and resilience is worthless. That is not a world you are living in. You can know the value of the labour without knowing the price it will fetch.

  I cannot claim to know a thing if I would hold that belief just as firmly even were it false. (Pause) But I can know the worth of what is already in your hands.

  So, where does that leave us? It leaves you with a qualification that is real, earned through labour that was real, guided by teachers whose care was real. The future is open, and I will not lie to you by pretending it is closed in your favour. But the past is solid. You have built capacities that are now yours. You have learned how to think, how to argue, and how to endure the pressure of not knowing. Those are tools you carry with you regardless of the grades attached to your name.

  Do not let the uncertainty of the outcome dissolve the certainty of the achievement. The grades may vary. The paths may diverge. Some of you will go to the universities you have chosen; others will find doors opening that you did not know were there. But the substance of your education is not a ticket that might be cancelled; it is a muscle that has been grown.

  The work you have done belongs to you forever, regardless of what the postman brings in seven weeks.

  Take that certainty into the summer. When the waiting becomes difficult, remember that you are not defined by a prediction, but by what you have already accomplished. You have been taught well. You have worked hard. You are ready. Not because I know how the story ends, but because I know how well you have written the chapters so far.

  Thank you, and good luck.

  ***

  **Note on Method**

  This speech leans on a contested reading of the sensitivity condition. Critics, particularly proponents of safety-based accounts, argue that knowledge requires belief only in nearby worlds where $p$ is true, not that belief vanish in distant worlds where $p$ is false. If safety is the correct condition, my belief that "things will work out" might qualify as knowledge if the worlds where students fail are sufficiently distant, allowing the reassurance back in. I also assume that refusing closure insulates the known past from the unknown future, but some argue that if the value of the past depends on the future, the uncertainty infects the whole. I would rewrite the refusal of the Head's request if convinced that knowledge requires safety rather than sensitivity, as that would permit the promise without epistemic dishonesty.
