answer: |-
  Your five judgments demonstrate a sophisticated grasp of archaeological inference, specifically the tension between *material necessity* (practical constraint) and *symbolic action* (belief/institution). You are effectively navigating the divide between Processual archaeology (which emphasizes systems and ecology) and Post-Processual archaeology (which emphasizes agency and meaning).

  There is indeed a single principle that governs four of your five judgments, but one of your verdicts violates it. Identifying this inconsistency will sharpen the internal logic of your reconstructed society.

  ### The Unifying Principle: **The Law of Costly Irrelevance**

  The principle governing your coherent judgments is this: **Read a pattern as Belief or Institution when it imposes a cost or constraint that offers no direct utilitarian benefit, but Read it as Practical Constraint when it enhances efficiency without demanding social conformity.**

  In simpler terms: If a behavior is "expensive" (in labor, resources, or foregone opportunity) and doesn't help you survive or eat better, it is likely serving a social or spiritual function. If it helps you cook, trade, or build faster, it is likely practical.

  Here is how your judgments align with this principle:

  1.  **Grave Goods (Belief):** Equalizing wealth in death *contradicts* the economic logic of the living (hierarchical housing). It is "costly" to the elite to hide their status in the grave. **Verdict: Coherent.**
  2.  **Highland Site (Institution):** Traveling to a remote site and leaving no domestic debris is "costly" in terms of energy and time, with no survival benefit (no farming/housing). **Verdict: Coherent.**
  3.  **Elite Burial (Institution):** Importing luxury is costly; arranging it by *local* symbols rather than foreign ones is a strategic constraint to reinforce local power. **Verdict: Coherent.**
  4.  **Pottery Styles (Practical):** New pottery styles often reflect technological efficiency (better cooking) or trade availability. They change "cheaply" compared to social structure. **Verdict: Coherent.**

  ### The Outlier: Judgment Four (Weights)

  **Judgment:** *When standardized weights appear across dispersed settlements with no accompanying script, I am inclined to see centralized bureaucratic control rather than emergent market coordination.*

  **Why it violates the principle:**
  This judgment infers a **high-cost institution** (Centralized Bureaucracy) from a **high-efficiency tool** (Weights) without the **high-cost evidence** (Script/Administrative Centers) that usually accompanies bureaucracy.

  Standardized weights are utilitarian; they reduce transaction costs and build trust in trade. While they *can* be imposed by a state, they frequently emerge from **decentralized market coordination** (merchant guilds, shared norms) because standardization benefits the traders, not just the ruler. By inferring "Centralized Bureaucratic Control" specifically in the *absence* of script (the primary tool of bureaucracy), you are assuming a coercive cost where a cooperative benefit suffices. This contradicts Judgment Five, where you correctly allow material change (pottery) to exist without assuming structural change (revolution).

  **The Correction:**
  You should overturn the inference of **Centralized Bureaucracy**.
  **Corrected Verdict:** Standardized weights without script indicate a **Normative Institutional Consensus**. This suggests a society bound by shared law or religious sanction regarding value, rather than a top-down bureaucratic state. It implies *authority* without necessarily implying *administration*.

  ### The New Case: Solstitial Architecture

  **The Case:** *A settlement where architectural orientation suddenly aligns with solstitial sunrise, yet every other material category—burial, craft, diet—remains unchanged.*

  **Applying the Corrected Principle:**
  1.  **Cost Analysis:** Re-orienting architecture is **high-cost**. It requires demolishing or rebuilding structures and altering the spatial organization of the community. It offers no direct utilitarian benefit (a house faces the sun just as well if it faces east or south regarding heat/light in most contexts).
  2.  **Inertia Analysis:** Architecture is "high inertia" material culture (it lasts a long time and is hard to change). Pottery is "low inertia."
  3.  **Continuity:** Since burial, craft, and diet (the markers of daily life, economy, and kinship) are *unchanged*, there is no evidence of population replacement or economic revolution.

  **The Prediction:**
  This pattern predicts a **Legitimizing Myth Shift** rather than an Institutional Revolution.

  In your narrative, this should not be written as a new government taking over (which would likely change burial or diet) or a new technology (which would change craft). Instead, it indicates a change in the **source of authority**.

  *   **Narrative Implication:** The ruling class likely remains the same families, and the people remain the same, but the *justification* for their rule has shifted. Perhaps the old ancestors (burial) are no longer seen as the source of power; instead, power is now derived from a Solar Cult.
  *   **The "Why":** This often happens when a society needs to unify disparate groups without changing their daily habits. A solar calendar is universal; ancestor worship is specific to lineages. By aligning buildings to the sun, the leaders are saying, "We all serve the same Sky, even if we bury our dead differently."
  *   **The Tension:** This creates a fascinating narrative tension where the *physical world* has shifted (the buildings point elsewhere) but the *social world* feels the same. It suggests a "quiet revolution" from above—a rebranding of power that is visually undeniable but socially non-disruptive.

  ### Summary for your Novel
  *   **Principle:** If it costs effort without aiding survival, it is Belief/Institution. If it aids survival without demanding conformity, it is Practical.
  *   **Correction:** Do not assume Standard Weights = Bureaucracy. Assume Weights = Shared Trust/Law.
  *   **New Case:** Solstitial Alignment = A change in **Ideological Legitimacy** (how power is justified) without a change in **Social Structure** (who holds power).

  This approach gives your reconstructed society a nuanced texture: one where power is flexible enough to change its symbols (sun vs. ancestors) without breaking the economy or kinship networks that sustain it.
