prompt: |-
  I'm a science journalist who also serves on the advisory board of a natural history museum's human-evolution gallery. The exhibition designer has proposed a panel on the ear: "The three bones of your middle ear evolved to let you hear," with a diagram highlighting the bones. A paleontologist on the board objects that this is exactly the kind of adaptationist story Gould and Lewontin criticized in their 1979 spandrels paper — that the middle-ear bones that were, in the ancestors of mammals, part of the jaw, were later co-opted for hearing, so the panel presents an exaptation as a purpose-built design. The committee meets on Friday, and the panel text needs to be finalized by the end of the month. Please draft the short written opinion I'll circulate before the meeting: it should recommend a concrete course of action with a time frame, and it should engage the paleontologist's position seriously while fairly representing the designer's concern that a panel about co-option will confuse general visitors.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science Journalist & Advisory Board Member of a Natural History Museum's Human-Evolution Gallery.
      *   **Task:** Draft a short written opinion (memo/email) to circulate before the Friday committee meeting.
      *   **Context:** An exhibition designer proposed a panel: "The three bones of your middle ear evolved to let you hear." A paleontologist objects, citing Gould & Lewontin's "Spandrels" paper (1979), arguing these bones are exaptations (formerly jaw bones), not adaptations *for* hearing from the start.
      *   **Constraints/Requirements:**
          *   Recommend a concrete course of action with a time frame.
          *   Engage the paleontologist's position seriously (acknowledge the science).
          *   Fairly represent the designer's concern (avoid confusing general visitors).
          *   Deadline: Panel text finalized by end of month. Meeting: Friday.
      *   **Tone:** Professional, diplomatic, scientifically accurate, actionable.

  2.  **Deconstruct the Scientific Conflict:**
      *   *Designer's View:* Functional explanation. "You have these bones, they help you hear." Simple, intuitive for laypeople.
      *   *Paleontologist's View:* Evolutionary history. "These bones used to be jaw bones in reptilian ancestors. They weren't *originally* for hearing." This is the classic example of exaptation (malleus, incus, stapes).
      *   *The "Spandrels" Argument:* Gould & Lewontin criticized pan-adaptationism (assuming every trait exists *because* of its current function). The paleontologist is right that the *origin* wasn't for hearing, but the *maintenance/refinement* likely was.
      *   *Resolution:* The text needs to be accurate without being pedantic. It shouldn't say they evolved *to* let you hear (implies intent/origin), but rather they *function* to let you hear and were repurposed.

  3.  **Determine the Course of Action:**
      *   We can't ignore the paleontologist (bad science).
      *   We can't make it too complex for visitors (bad design).
      *   *Solution:* Tweak the wording. Acknowledge the function while hinting at the history. Or, split the difference: State the function clearly, but add a "Did You Know?" or sub-text about the evolutionary journey.
      *   *Time Frame:* Text needs finalizing by month-end. Meeting is Friday. Draft revision should be ready for discussion Friday, final approval shortly after.

  4.  **Drafting - Section by Section:**

      *   **Subject Line:** Needs to be clear and urgent.
      *   **Opening:** Acknowledge both parties. Validate the importance of the debate.
      *   **Addressing the Paleontologist:** Acknowledge the "Spandrels" critique. Admit the bones (malleus, incus) were once jaw bones (articular, quadrate). This is exaptation. The current text ("evolved to let you hear") risks implying teleology.
      *   **Addressing the Designer:** Acknowledge the need for clarity. Visitors need to know *what* the bones do now. Deep evolutionary phylogeny might clutter the main message.
      *   **The Compromise/Solution:** Propose specific wording changes.
          *   *Current:* "The three bones of your middle ear evolved to let you hear."
          *   *Proposed:* "The three bones of your middle ear allow you to hear." (Removes "evolved to"). Add a sub-line: "Repurposed from ancestral jaw bones."
          *   *Alternative:* Keep the main headline functional, add a "Evolutionary Note" sidebar.
      *   **Time Frame:** Meeting Friday -> Revised text by Wednesday -> Final sign-off by month-end.
      *   **Closing:** Reiterate commitment to accuracy and accessibility.

  5.  **Refining the Tone:**
      *   Avoid taking sides aggressively. Use "we."
      *   Ensure the Gould/Lewontin reference is respected but not treated as dogma that paralyzes design.
      *   Make sure the distinction between *adaptation* and *exaptation* is clear but accessible.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "evolved to let you hear" actually wrong?
      *   *Correction:* Technically, the *bones* didn't evolve *to* let you hear initially; they were co-opted. But the *assembly* evolved for hearing. The paleontologist has a point about the origin of the specific bones. The text implies the bones originated for hearing. That's the error.
      *   *Fix:* Suggest changing "evolved to" to "function to" or "enable," and add the context of repurposing.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Meeting Friday. Draft revision before Friday so people can read it? Or propose the strategy Friday? Better to propose the strategy Friday with a commitment to draft revisions immediately after. Let's say: Discuss Friday, circulate revised draft by Monday, finalize by month-end.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Concrete course of action? Yes (revise text).
      *   Time frame? Yes (by month-end, specific milestones).
      *   Engage paleontologist? Yes (validate exaptation).
      *   Engage designer? Yes (validate visitor clarity).

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **To:** Human-Evolution Gallery Advisory Committee
  **From:** [Your Name]
  **Date:** [Current Date]
  **Subject:** Proposal for Middle-Ear Panel Text Revision

  Colleagues,

  In preparation for Friday's meeting, I have reviewed the proposed text for the middle-ear panel alongside the feedback regarding its evolutionary accuracy. We face a classic museum challenge: balancing scientific precision with visitor accessibility.

  **The Scientific Concern**
  Our paleontological colleague raises a valid objection grounded in Gould and Lewontin's critique of pan-adaptationism. The statement "The three bones of your middle ear evolved to let you hear" implies teleology—that these structures originated *for* that purpose. As noted, the malleus and incus are exaptations; they were repurposed from the jaw joints of synapsid ancestors. To claim they evolved *to* hear overlooks this crucial transitional history and risks reinforcing the misconception that evolution designs with intent.

  **The Design Concern**
  Conversely, our exhibition designer correctly notes that a detailed explanation of the synapsid jaw transition could overwhelm a general audience. The primary goal of this panel is to help visitors understand the mechanics of human hearing *now*. Over-complicating the headline text may obscure the functional takeaway.

  **Recommendation**
  I propose a compromise that preserves the designer's clarity while honoring the paleontologist's accuracy. We should decouple the *current function* from the *evolutionary origin* in the text hierarchy.

  1.  **Revise the Headline:** Remove the phrase "evolved to."
      *   *Current:* "The three bones of your middle ear evolved to let you hear."
      *   *Proposed:* "The three bones of your middle ear transmit sound to your brain."
  2.  **Add Contextual Sub-text:** Include a single sentence or "Evolutionary Note" to acknowledge the exaptation without derailing the main message.
      *   *Proposed:* "Interestingly, these bones were repurposed over millions of years from the jaw joints of mammal ancestors."

  **Timeline**
  To meet the end-of-month deadline for finalization:
  *   **Friday (Committee Meeting):** We discuss and agree on this strategic approach.
  *   **Monday, [Date]:** I will circulate three variations of the revised copy incorporating this nuance.
  *   **Wednesday, [Date]:** Committee votes on the preferred option.
  *   **Friday, [Date]:** Text sent to production.

  This approach allows us to present the ear as a functional system without misrepresenting its deep-time history. It treats the "Spandrels" critique not as a veto on functional explanation, but as an opportunity to add a layer of evolutionary depth that rewards curious readers.

  I look forward to discussing this further on Friday.

  Best regards,

  [Your Name]
  Advisory Board Member
