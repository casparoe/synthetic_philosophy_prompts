answer: |-
  **Instructions to the Student**

  This instrument is designed to locate your pre-theoretical intuitions about truth within the logical space of current philosophical positions. Do not attempt to guess the 'correct' answer; instead, select the option in each couplet that best matches your judgment about how the concept of truth *functions*. Work through the numbered sequence alone. If you reach a leaf, record the position name and the accompanying diagnosis. If you reach an 'Empty Cell', note why that combination is unoccupied. The process should take approximately fifteen minutes. Note that technical labels (such as 'realism' or 'deflationism') are withheld until the terminal leaves to prevent premature categorisation.

  ***

  **Dichotomous Key to Theories of Truth**

  1.  Consider the claim: "Everything the witness said is true," where you do not know the specific sentences uttered. Is the word 'true' required here primarily to allow you to endorse the witness without listing every sentence (Generalisation Job), OR is the word 'true' required primarily to claim that the witness's words hook onto reality (Semantic/Success Job)?
      *   Endorse without listing -> Go to 2.
      *   Hook onto reality -> Go to 6.

  2.  In this generalising role, does 'true' pick out a feature that all the witness's sentences share, however thin, OR is it merely a grammatical tool to avoid repetition?
      *   Picks out a feature -> Go to 3.
      *   Grammatical tool -> Go to 4.

  3.  Is this feature exactly the same when discussing physics as when discussing whether a joke is funny, OR does the feature change depending on the subject matter?
      *   Exactly the same -> **Leaf 1**.
      *   Changes depending on subject -> **Leaf 2**.

  4.  Does the tool function like a pronoun standing in for a sentence (e.g. allowing you to say 'it is so'), OR does it function as a logical operator that changes the sentence's meaning (like 'not')?
      *   Like a pronoun -> Go to 5.
      *   Logical operator -> **Empty Cell 1**.

  5.  When the tool is analysed, does it vanish completely leaving only the original sentence, OR does it remain as a distinct grammatical placeholder?
      *   Vanishes completely / Remains placeholder -> **Leaf 3** (See Note).
      *   *Note: These two options lead to positions that cannot be separated by the four jobs; see Leaf 3 table entry for distinction.*

  6.  Consider a sentence in a language you cannot translate. Can it be true even if no human could ever verify it, OR is truth tied essentially to our ability to recognise it?
      *   True even if unverifiable -> Go to 7.
      *   Tied to recognition -> Go to 10.

  7.  Is the connection between the true sentence and the world a substantive structural match, OR is it a basic relation that cannot be further explained?
      *   Structural match -> Go to 8.
      *   Basic relation -> Go to 9.
      *   Connection is confused/illusory -> **Leaf 4**.

  8.  Consider a claim about whether a joke is funny. Does 'true' work the same way here as it does for "snow is white", OR does moral/aesthetic truth involve a different kind of match?
      *   Works the same way -> **Leaf 5**.
      *   Different kind of match -> **Empty Cell 2**.

  9.  Is this primitive relation knowable by humans, OR essentially unknowable?
      *   Knowable -> **Leaf 6**.
      *   Essentially unknowable -> **Empty Cell 3**.

  10. Is a belief true because it would be agreed upon under ideal inquiry conditions, OR because it fits perfectly with all other beliefs?
      *   Ideal inquiry conditions -> Go to 11.
      *   Fits with other beliefs -> **Leaf 7**.

  11. Are these conditions defined by the practical success of acting on the belief (Success Job), OR by the stability of justification against future revision (Normative Job)?
      *   Practical success -> **Leaf 8**.
      *   Stability of justification -> Go to 12.

  12. Is this stability permanent and unrevisable, OR is it always open to further evidence?
      *   Permanent and unrevisable -> **Empty Cell 4**.
      *   Always open to evidence -> **Leaf 9**.

  ***

  **Table of Leaves and Empty Cells**

  | Node | Position Name | Most Awkward Commitment | Job Analysis (Easy / Strain / Impossible) |
  | :--- | :--- | :--- | :--- |
  | **Leaf 1** | **Minimalism** | Truth is a property, but it does not explain anything about the sentences that have it. | (i) Easy; (ii) Strain; (iii) Strain; (iv) Strain. |
  | **Leaf 2** | **Alethic Pluralism** | The word 'true' means the same thing, but picks out different properties in physics than in morals. | (i) Easy; (ii) Easy; (iii) Easy; (iv) Easy. |
  | **Leaf 3** | **Deflationism / Prosententialism** | *Flagged Pair:* Distinguished only by grammatical theory (redundancy vs. anaphora), not by job discharge. | (i) Easy; (ii) Impossible; (iii) Impossible; (iv) Impossible. |
  | **Leaf 4** | **Eliminativism** | There is no such thing as truth; the word should be discarded from serious inquiry. | (i) Impossible; (ii) Impossible; (iii) Impossible; (iv) Impossible. |
  | **Leaf 5** | **Substantive Correspondence Realism** | Moral and aesthetic claims must match reality in the same structural way that physical claims do. | (i) Strain; (ii) Easy; (iii) Easy; (iv) Easy. |
  | **Leaf 6** | **Primitivism** | Truth is a fundamental feature of the universe that cannot be defined or analysed in other terms. | (i) Strain; (ii) Easy; (iii) Easy; (iv) Easy. |
  | **Leaf 7** | **Coherentism** | A belief could be perfectly coherent with a system of beliefs and yet fail to match the world. | (i) Strain; (ii) Easy; (iii) Easy; (iv) Strain. |
  | **Leaf 8** | **Pragmatism** | If believing a falsehood led to better practical outcomes, that falsehood would be true. | (i) Strain; (ii) Strain; (iii) Strain; (iv) Easy. |
  | **Leaf 9** | **Epistemic View (Superassertibility)** | Truth is nothing more than justification that is stable and robust against all future evidence. | (i) Strain; (ii) Easy; (iii) Easy; (iv) Strain. |
  | **EC 1** | **Empty Cell (Logical Operator)** | *Diagnosis:* Incoherent. Truth modifies sentences like negation, yet purportedly preserves truth-values; no view treats it as a truth-functional operator. | N/A |
  | **EC 2** | **Empty Cell (Domain-Specific Correspondence)** | *Diagnosis:* Unattractive. Posits structural matching for morals but not science (or vice versa) without shifting to functionalism; theoretically unstable. | N/A |
  | **EC 3** | **Empty Cell (Unknowable Primitivism)** | *Diagnosis:* Unexplored. A truth property that is primitive yet essentially unknowable renders the concept useless for inquiry; no motivation to posit it. | N/A |
  | **EC 4** | **Empty Cell (Permanent Stability)** | *Diagnosis:* Incoherent. Claims justification can be permanently unrevisable by humans while retaining an epistemic definition; collapses into dogmatism. | N/A |

  **Note on the Deflationary Cluster (Leaf 3):**
  Students often assume deflationism implies truth does not matter. This leaf groups **Deflationism (No-Property)** and **Prosententialism**. They are merged here because both discharge the Generalisation Job easily while rejecting the Semantic, Normative, and Success jobs as functions of the *property* of truth (assigning them instead to assertion or belief). They are separated only by whether 'true' is eliminated as redundant or retained as a grammatical pro-form. To separate them, one would need to ask: "Does 'is true' have a grammatical antecedent in every valid usage?" (Prosententialism says yes; Redundancy says no). Neither view denies the importance of true belief, only the substantive nature of the property.
