answer: |-
  # Joint Statement on Consequentialist Cluelessness and Decision-Theoretic Structure

  **Prepared for:** Graduate Seminar on Long-Run Normative Ethics
  **Parties:** Bounded-Consequentialist Camp (Camp A) and Structural-Skeptic Camp (Camp B)
  **Date:** October 2023

  ## A. Agreed Claims

  The undersigned parties affirm the following claims as a shared foundation for this collaboration. These claims delineate the scope of agreement regarding the formal structure of consequentialism, the nature of uncertainty, and the moral status of patients, without prejudicing the core disagreement regarding the viability of expected-value maximization under deep uncertainty.

  1.  **Consequentialist Supervenience:** Both parties agree that the moral rightness of an action supervenes on the value of its outcomes. Any normative theory adopted must account for the causal contribution of agents to states of affairs containing moral value.
  2.  **Moral Patienthood Across Time:** Both parties agree that the moral community includes future beings. The temporal distance of a patient does not, in principle, negate their moral status, though it may affect the epistemic access an agent has to their welfare.
  3.  **Distinction Between Risk and Deep Uncertainty:** Both parties agree that long-run decision contexts are characterized by "deep uncertainty" (Knightian uncertainty), where probability distributions over outcomes are unknown, unrepresentable, or contested, rather than "risk," where probabilities are known or reliably estimable.
  4.  **Limits of Causal Modeling:** Both parties agree that human causal models degrade significantly over long timescales and high-complexity systems. Predictive accuracy regarding specific state-descriptions of the far future is effectively bounded by computational and informational limits.
  5.  **Requirement of Action-Guidance:** Both parties agree that a normative ethics must offer action-guidance. A theory that universally suspends judgment or declares all actions rationally permissible due to uncertainty fails to meet the basic functional requirements of a moral framework.

  ## B. Disagreements Table

  | Crux ID | Issue in Neutral Wording | Formulation that Camp A (Bounded-Consequentialist) Accepts | Formulation that Camp B (Structural-Skeptic) Accepts | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **C1** | **Source of Indeterminacy** | The inability to calculate expected value is primarily an epistemic limitation; the underlying value structure exists, but agents lack sufficient data to map it precisely. | The inability to calculate expected value is a structural feature; there is no fact of the matter regarding comparative weights across distinct ontological categories or timescales. | Substantive |
  | **C2** | **Viability of Second-Order Rules** | Second-order rules (e.g., robustness, option value, epistemic discounting) successfully preserve the normative authority of expected-value reasoning by acting as reliable proxies for value maximization. | Second-order rules are ad hoc heuristics that mask the collapse of consequentialist evaluation; they do not restore the link between action and true value maximization. | Substantive |
  | **C3** | **Definition of Normative Authority** | "Normative authority" means a decision procedure is rationally defensible and permissible given the agent's epistemic constraints, even if it does not track objective value perfectly. | "Normative authority" requires that a decision procedure be justified by its correspondence to objective moral truths, not merely by its defensibility under ignorance. | Verbal |

  ## C. Crux Tests for Substantive Disagreements

  ### Test for Crux C1 (Source of Indeterminacy)

  *   **Sub-Question:** Is the uncertainty regarding long-term value comparable to uncertainty regarding a hidden variable (epistemic), or is it comparable to uncertainty regarding a undefined variable (structural)?
  *   **Concrete Hypothetical Case:** **The Incommensurable Futures Allocation.**
      An agent must allocate a fixed resource budget between two interventions:
      1.  *Intervention X:* Guarantees a measurable welfare increase for 1 million existing beings, but causal modeling suggests a 50% chance of triggering a structural societal shift whose value trajectory is ontologically distinct from current welfare (e.g., post-human transition).
      2.  *Intervention Y:* Guarantees the continued existence of humanity for 1,000 years with welfare levels comparable to the present, but precludes the structural shift mentioned in X.
      There is no common cardinal unit to measure "post-human transition value" against "continued human welfare."
  *   **Camp A Prediction:** This case demonstrates an epistemic gap. Camp A predicts that a sufficiently refined model (using proxies or broad categories) can assign comparative weights, rendering the choice subject to expected-value maximization.
  *   **Camp B Prediction:** This case demonstrates a structural gap. Camp B predicts that no non-arbitrary weighting function exists between the two outcome types, rendering expected-value maximization incoherent regardless of modeling effort.

  ### Test for Crux C2 (Viability of Second-Order Rules)

  *   **Sub-Question:** Do meta-decision rules (like maximizing option value) constitute valid consequentialist reasoning when first-order value is undefined?
  *   **Concrete Hypothetical Case:** **The Robustness Proxy Scenario.**
      An agent faces three policy choices regarding a emerging technology. All three have undefined expected values due to deep uncertainty about long-run misuse.
      1.  *Policy 1:* Maximizes immediate welfare but locks in a specific technological path (low option value).
      2.  *Policy 2:* Sacrifices immediate welfare to maintain maximum flexibility for future agents to choose different technological paths (high option value).
      3.  *Policy 3:* Random selection.
      Camp A advocates for Policy 2 based on "option value" as a robustness rule.
  *   **Camp A Prediction:** This case demonstrates that second-order rules preserve normative authority. Choosing Policy 2 is the rational consequentialist act because it maximizes the probability of capturing value whatever the true value structure turns out to be.
  *   **Camp B Prediction:** This case demonstrates the abandonment of consequentialism. Choosing Policy 2 relies on a procedural virtue (flexibility) disconnected from outcome value; without a link to specific good states, this is deontological or virtue-ethical reasoning masquerading as consequentialism.

  ## D. Diagnosis of Verbal Disagreement

  **Term:** "Normative Authority" (Crux C3)

  **Diagnosis:**
  The disagreement regarding Crux C3 is primarily terminological. Camp A employs a *procedural* definition of authority, wherein a rule is authoritative if it is the most rational tool available to an bounded agent. Camp B employs a *truth-tracking* definition, wherein a rule is authoritative only if it is justified by its connection to objective moral facts.

  **Resolution Impact:**
  Resolving this terminological divergence (e.g., by agreeing to distinguish "Rational Permissibility" from "Moral Correctness") eliminates the conflict over the label "authority." However, a residual substantive dispute remains: Camp A believes "Rational Permissibility" is sufficient for moral decision-making, while Camp B believes that without "Moral Correctness," the agent is acting arbitrarily. This residual dispute is captured entirely within Crux C2 (Viability of Second-Order Rules). Therefore, once the terminology is standardized, the collaboration reduces to the substantive disagreements identified in C1 and C2.

