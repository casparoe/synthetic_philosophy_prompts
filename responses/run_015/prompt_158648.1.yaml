      *   *Refining the "Winner":* Deniz is empirically stronger on the *economic history* (which is his field). Marta is conceptually stronger on *systems dynamics*, but applies it loosely to history. Deniz wins on the specific question of "Was Malthus Right?" because Malthus made specific claims about fertility and subsistence that failed. Marta wins on "Are there limits?" but that's not exactly Malthus. I need to score "Who is more right about Malthus." Deniz is more right about Malthus. Marta is more right about ecology, but she's defending Malthus.
      *   *Refining the Expiry Date:* Be careful not to make a prediction myself. Define the *conditions* for the test.
