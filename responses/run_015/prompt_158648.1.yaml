      *   *Deniz 3 (Hasn't-run-out-yet/Two Claims):* Distinguishes positive checks (true) from subsistence trap (false). Demands a date. *Verdict: Clearly Right on the subsistence trap evidence.*

  5.  **Address Position 1 (Expiry Date & Taxonomy):**
      *   *Expiry Date:* Can't give a calendar date (too many variables). Can give a *condition*. E.g., "When global TFP growth falls below population growth for 50 years despite no resource price shocks."
