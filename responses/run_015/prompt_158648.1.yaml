      *   *Category:* Currently borders on *prophecy* because the mechanism (tech progress) is endogenous and unpredictable. To be science, it needs a specified mechanism for the "ceiling."
      *   *Taxonomy:* The horizon claim is *falsified* regarding the *mechanism* (income pinning), but *not yet tested* regarding the *ultimate physical limit*. However, since human ingenuity shifts the limit, the "limit" is moving. It is functionally *untestable in principle* as stated by Malthus because it ignores endogenous tech change.

