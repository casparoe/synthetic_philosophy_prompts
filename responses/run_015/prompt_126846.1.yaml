prompt: |-
  I write novels, and I've agreed to run a nintey-minute evening session at the writers' centre next month. About a dozen people, mostly novelists plus two poets, nobody with any philosophy, and at least two of them will arrive believing that theory is a machine for spoiling stories. The session is nominally about writing from the inside of an experience you haven't had, and I want the Mary case to be its spine: the neuroscientist who has spent her whole life in a black-and-white room, knows every physical fact about colour vision there is to know, and then walks out and sees a red tomato for the first time. My group already half-knows this one and half-misuses it, which is why I'd rather build on it than on something new.

  So please don't explain the argument to me. Plan how I should explain it to them.

  What I need:

  The order the pieces have to go in, and what depends on what. I don't want a list of points that could be shuffled; I want to know which thing has to be in place before the next thing is even intelligible, and which bit will collapse the session if I put it too early.

  The one carrying example, and what it has to have and what it has to lack. My instinct is that it should not be a character from my own work in progress, but tell me if I'm being precious about that.

  My worry about completeness. If Mary doesn't know which physical state she's in when the tomato shows up, her surprise looks like she merely learned a boring fact, and then nothing is threatened. Where does that have to go in the sequence, and can it be done in fifteen minutes for people who have never met the word indexical? If it can't, tell me what to sacrifice.

  The emotion swap. Someone will say within the first ten minutes that it's just like writing grief before you've lost anyone. My instinct is that grief is not like red, because having grief seems to require a pile of beliefs and a history, and that this difference quietly makes the case weaker rather than stronger, so I should hold the swap back rather than lean on it. Tell me whether that instinct is wrong, and if it is, what the right thing to do with the swap is.

  Misconceptions, in the order they'll actually form. The ones I expect: that the case simply refutes physicalism; that it shows a machine could never be conscious; that its moral is that we can't imagine other people's experience; that Mary's surprise is just a broken expectation and therefore proves nothing. Correct any of those I've got wrong, tell me the order they'll arrive in, and say where in the session to head each off — I'd much rather defuse them at the moment they form than deal with them in a summary at the end.

  Where I say out loud that the philosophers don't agree, without it feeling like a cop-out. This group will want a verdict and I don't have one.

  One question to put to the room at the end that would show they'd got the argument rather than just absorbed its atmosphere, and a different one that would show they'd got something usable for their own manuscripts.

  And tell me plainly what to refuse to get into at this level. I'm guessing the zombie thing, representationalism, and the phenomenal-concept business, but I want to know which one I'll be most tempted by, why it will eat the hour and a half, and what I should say instead when someone asks me about it.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Novelist running a 90-minute evening session at a writers' centre.
      *   **Audience:** ~12 people (mostly novelists, 2 poets, no philosophers). 2+ are hostile to theory ("theory spoils stories"). Half-know/half-misuse the Mary thought experiment.
      *   **Topic:** Writing from the inside of an experience you haven't had.
      *   **Core Material:** Frank Jackson's "Mary's Room" (Neuroscientist in B&W room sees red tomato).
      *   **Constraints/Needs:**
          *   Strict ordering of concepts (dependency chain).
          *   One carrying example (criteria specified).
          *   Address the "completeness" worry (physical facts vs. indexical knowledge) within 15 mins for laypeople.
          *   Address the "emotion swap" (grief vs. qualia) – validate or correct instinct.
          *   Anticipate and defuse misconceptions *as they arise* (not at the end).
          *   Where to admit philosophical disagreement without copping out.
          *   Two closing questions (one comprehension, one practical).
          *   What to refuse to discuss (Zombies, Representationalism, Phenomenal Concepts) + diversion tactic.

  2.  **Deconstruct the Core Problem (Mary's Room for Writers):**
      *   *Philosophical Point:* Qualia/Phenomenal consciousness vs. Physical facts.
      *   *Writerly Point:* Research/Knowledge vs. Lived Experience. Can you write what you haven't lived?
      *   *The Trap:* If Mary knows *everything* physical, why is the experience new? If she doesn't know the physical state she's in, it's just a gap in data.
      *   *The Audience:* They care about *writing*, not metaphysics. They want to know if they can write grief/war/love without experiencing it. They fear theory kills creativity.

  3.  **Drafting the Plan - Section by Section:**

      *   **Ordering/Dependencies:**
          *   Need to establish the *setup* (Mary knows all physical facts) before the *event* (seeing red).
          *   Need to establish the *intuition* (she learns something new) before the *implication* (physicalism is incomplete/writing needs more than research).
          *   Crucial: The "completeness" worry needs to be addressed *immediately* after the setup, otherwise the whole thing collapses into "she just didn't study hard enough."
          *   Misconceptions need to be intercepted *before* they harden.

      *   **The Carrying Example:**
          *   User suggests not using their own WIP. *Advice:* Stick to this. Using your own work makes it about *your* book, not *their* craft. It invites critique of the art rather than the method.
          *   *What it needs:* High sensory stakes, low conceptual baggage. Red is good. Pain is good.
          *   *What it lacks:* Moral judgment or complex history. (Grief is bad here, see below).
          *   *Selection:* Stick with the Tomato/Red. It's the canonical one for a reason. It isolates the *sensation* from the *narrative*.

      *   **The Completeness Worry (Indexicals):**
          *   *Problem:* If Mary doesn't know "I am seeing red now," is that just a new fact?
          *   *Constraint:* 15 mins, no jargon ("indexical").
          *   *Solution:* Use the "Map vs. Territory" or "Menu vs. Meal" analogy. Don't call it indexicality. Call it "The difference between knowing the recipe and tasting the soup."
          *   *Placement:* Immediately after introducing Mary. Before discussing what she learns.
          *   *Sacrifice:* If time runs out, sacrifice the history of the argument (Jackson, 1982, etc.). Keep the *logic* of the room.

      *   **The Emotion Swap (Grief):**
          *   *User Instinct:* Grief requires beliefs/history; Red does not. Therefore, Grief weakens the case.
          *   *Verdict:* Instinct is **Correct**.
          *   *Reasoning:* Mary is about *Qualia* (raw feel). Grief is a *Cognitive/Emotional Complex*. Writing grief is about empathy and imagination of circumstance. Writing "red" is about sensation. Conflating them confuses the writers. They will argue about "researching grief" vs. "feeling grief."
          *   *Action:* Hold it back. Use it only as a *contrast* at the end to show where the analogy breaks. Don't let it drive the session.

      *   **Misconceptions (Order & Defusal):**
          1.  *Mary just learned a fact (Propositional Knowledge).* -> Defuse during the "Completeness" section.
          2.  *Refutes Physicalism (The Philosophical Trap).* -> Defuse by pivoting to Writing immediately. "We aren't solving metaphysics; we're solving description."
          3.  *Machines can't be conscious.* -> Ignore unless raised. If raised, park it.
          4.  *We can't imagine others.* -> Defuse by emphasizing *craft* over *impossibility*.
          5.  *Surprise is just broken expectation.* -> Defuse by emphasizing the *quality* of the surprise, not the fact of it.
          *   *Timing:* Address #1 early. Address #2 when the "Verdict" question comes up.

      *   **Philosophical Disagreement:**
          *   Don't say "Philosophers argue." Say "The map isn't the territory."
          *   Frame it as: "Does this prove the world is magical, or that 'knowing' has two settings?"
          *   Place: After the core argument, before the writing application.

      *   **Closing Questions:**
          *   *Comprehension:* Needs to test the Qualia vs. Fact distinction.
          *   *Usable:* Needs to translate to a drafting exercise.

      *   **What to Refuse:**
          *   *Zombies:* Too abstract, eats time.
          *   *Representationalism:* Too technical.
          *   *Phenomenal Concepts:* This is the trap. It explains *why* Mary learns something without denying physicalism. It's the most tempting because it solves the problem. *Must avoid.* It requires too much setup.
          *   *Diversion:* "That solves the philosophy, but does it help you write the sentence?"

  4.  **Refining the Sequence (The "Dependency Chain"):**
      1.  **The Room (Setup):** Must establish *total* physical knowledge first.
      2.  **The Gap (Completeness):** Must establish she isn't missing data, she's missing *experience*. (Crucial pivot point).
      3.  **The Exit (Event):** She sees red.
      4.  **The Lesson (Writing):** Knowledge $\neq$ Experience.
      5.  **The Limit (Grief):** Where the analogy stops.

  5.  **Fleshing out the Details (incorporating constraints):**
      *   *Time:* 90 mins.
      *   *Tone:* Practical, respectful of the "theory spoils stories" crowd.
      *   *Specific instruction:* "Tell me what to sacrifice" if the indexical bit is too hard. *Decision:* It's not too hard if you avoid the word. Use "Here/Now" logic.

  6.  **Review against constraints:**
      *   *Order:* Check dependencies.
      *   *Example:* Tomato (not WIP).
      *   *Completeness:* Addressed early, no jargon.
      *   *Emotion Swap:* Validated user instinct, advised caution.
      *   *Misconceptions:* Ordered and placed.
      *   *Disagreement:* Framed as utility, not truth.
      *   *Questions:* One theoretical, one practical.
      *   *Refusals:* Phenomenal concepts identified as the main time-sink trap.

  7.  **Final Polish:** Ensure the voice is direct, authoritative, and tailored to a novelist (focus on craft, texture, sentence-level work). (Self-Correction: Make sure I explicitly state *why* the phenomenal concept strategy is the temptation).

  8.  **Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the plan for your ninety minutes. It is built on a dependency chain: if you move a block before its foundation is poured, the writers will retreat into "theory spoils stories" and you will lose them.

  ### 1. The Order of Operations (The Dependency Chain)

  You cannot discuss what Mary *learns* until you have secured what Mary *knows*. You cannot discuss what writers *do* until you have secured what Mary *is*.

  1.  **The Setup (Total Physical Knowledge):** You must establish that Mary knows every physical fact about colour *before* she leaves the room. Not "a lot," but *every*. If the audience thinks she just missed a chapter in a textbook, the argument dies.
      *   *Dependency:* Nothing else works if this isn't absolute.
  2.  **The Completeness Check (The "Here/Now" Gap):** You must address your worry about indexicals immediately after the Setup. If you don't, someone will say, "She just didn't know she was seeing red *now*." That reduces the revelation to a boring calendar fact.
      *   *Dependency:* This must happen before she walks out the door.
  3.  **The Exit (The Qualia Event):** She sees the tomato. She is surprised.
      *   *Dependency:* Only intelligible if 1 and 2 are secure.
  4.  **The Pivot (Fact vs. Experience):** You translate "Physical Fact vs. Phenomenal Experience" into "Research vs. Imagination."
      *   *Dependency:* Only works if the audience accepts the Exit was a genuine revelation, not a data error.
  5.  **The Limit (Where the Analogy Breaks):** This is where you handle the "Grief" swap.
      *   *Dependency:* Must come last. If you introduce complex emotions too early, they will muddy the sensory clarity of the red tomato.

  **What collapses the session if put too early:**
  The **Grief/Emotion Swap**. If you introduce "writing grief" before they understand the "red tomato" distinction, they will argue about empathy, research, and ethics. The clean line between *knowing about* and *feeling* will blur. Keep the tomato pure until the pivot is complete.

  ### 2. The Carrying Example

  **Stick with the Tomato.** Do not use a character from your work in progress.

  *   **Why:** If you use your own book, the discussion becomes about *your* choices, *your* prose, and whether *you* succeeded. The writers will critique your art instead of examining their method. The Tomato is neutral ground.
  *   **What it must have:** Sensory immediacy. It must be a raw sensation (colour, pain, taste) that requires no backstory to register.
  *   **What it must lack:** Moral weight or narrative consequence. We are not discussing whether the tomato is stolen, or if it reminds her of her mother. It is just red.

  ### 3. The Completeness Worry (Indexicals without the Word)

  You are right to worry. If Mary's surprise is just "Oh, *this* is the state the books called 'red'," she has only learned a relational fact (a label), not a new quality.

  *   **Where it goes:** Immediately after **The Setup** and before **The Exit**.
  *   **How to do it in 15 minutes:** Do not use the word "indexical." Use the "Map vs. Territory" distinction, but make it about *location*.
      *   *Say this:* "Mary knows the wavelength of red. She knows the neural firing pattern. But she doesn't know what it is like to be *here*, in this body, having that firing pattern *now*. It's the difference between knowing the coordinates of Paris and standing on the Champs-Élysées."
      *   *The Check:* Ask the room: "If she knew everything physical, did she know what 'this' feels like?" If they say yes, stop. You haven't sold the room. If they say no, you have cleared the indexical hurdle without the jargon.
  *   **What to sacrifice if time runs short:** Sacrifice the history of the argument (Jackson, 1982, physicalism debates). Sacrifice the "Verdict" on whether physicalism is true. Do **not** sacrifice the distinction between *knowing the facts* and *occupying the state*. That is the engine of the workshop.

  ### 4. The Emotion Swap (Grief)

  **Your instinct is correct.** Hold it back.

  *   **Why:** Red is a *quale* (a raw feel). Grief is a *complex cognitive state*. Grief requires beliefs (someone died), history (I loved them), and time. Red does not.
  *   **The Risk:** If you equate them too early, the poets will argue that grief can be imagined through empathy, while the novelists will argue it requires experience. You will end up in an ethics seminar, not a craft session.
  *   **The Right Move:** Use Grief only in the final 20 minutes as a **stress test**.
      *   *Say this:* "Mary works for colour. Does she work for grief? If I research grief, am I Mary in the room? Or is grief different because it requires a story?"
      *   *Goal:* Show them where the tool breaks. The Mary argument proves you can't write *sensation* without *sensation*. It does not prove you can't write *emotion* without *experience*. Distinguishing these is a huge win for them.

  ### 5. Misconceptions: Order of Arrival and Defusal

  Here is the order they will form, and the specific moment to head them off.

  1.  **"She just learned a fact." (The Propositional Objection)**
      *   *When:* During **The Completeness Check**.
      *   *Defusal:* "If it were just a fact, she could have deduced it from the physics. She couldn't. That means it's not a fact she was missing; it's a mode of access she was missing."
  2.  **"This proves physicalism is false." (The Metaphysical Trap)**
      *   *When:* During **The Pivot**.
      *   *Defusal:* "We are not here to solve the mind-body problem. We are here to solve the description problem. Whether the world is physical or magical, the writer's problem remains: how do you describe the 'what it is like'?"
  3.  **"Mary's surprise is just broken expectation." (The Psychological Objection)**
      *   *When:* During **The Exit**.
      *   *Defusal:* "It's not that she expected blue and got red. It's that she had no expectation of the *feeling* at all. You can't expect a taste you've never tasted."
  4.  **"This means we can never imagine other people." (The Solipsism Fear)**
      *   *When:* During **The Limit (Grief)**.
      *   *Defusal:* "Mary says we can't know perfectly. It doesn't say we can't try. It says our research has a ceiling. Craft is building a ladder to that ceiling."
  5.  **"Machines could never be conscious." (The AI Tangent)**
      *   *When:* Anytime.
      *   *Defusal:* Park it. "That's a question for engineers. Our question is: can a writer describe this without living it?"

  ### 6. Admitting Philosophical Disagreement

  Do not say "Philosophers disagree." That sounds like "Nobody knows, so why listen to me?"

  *   **Say this:** "There are two ways to read Mary. One: she proves there are non-physical facts. Two: she proves there are two ways of knowing physical facts. We don't need to decide which is true to use her."
  *   **The Pivot:** "For the novelist, the result is the same. There is a gap between the textbook and the tomato. Your job is to bridge that gap with prose."
  *   **Why this works:** It validates the "theory spoils stories" crowd by making the theory subservient to the craft. You aren't asking them to believe a metaphysics; you're asking them to use a tool.

  ### 7. The Closing Questions

  **Question 1 (Comprehension):**
  "Mary knows every fact about red. When she sees the tomato, does she know *more* than she knew before, or does she know the *same thing* in a *new way*?"
  *   *Correct answer:* They should argue for "new way." If they say "more facts," they missed the Completeness Check.

  **Question 2 (Usable for Manuscripts):**
  "Think of a scene you are writing where a character feels something you haven't felt (grief, victory, a specific pain). What is the 'physical fact' you have researched, and what is the 'tomato' you are trying to describe?"
  *   *Goal:* This forces them to separate their research (facts) from their prose goal (experience).

  ### 8. What to Refuse (The Time Eaters)

  You guessed right, but there is one specific trap that will eat your hour and a half.

  *   **The Trap:** **The Phenomenal Concept Strategy.**
      *   *What it is:* The argument that Mary *does* learn something new, but it's not a new fact about the world, it's a new *concept* for an old fact. (This solves the paradox without abandoning physicalism).
      *   *Why you will be tempted:* It is the most satisfying intellectual solution. It makes you look smart. It resolves the tension.
      *   *Why you must refuse it:** It requires explaining concepts, modes of presentation, and cognitive architecture. It is dry, technical, and irrelevant to writing a sentence. If you go here, the poets will follow, the novelists will glaze over, and you will run out of time for the craft application.
      *   *What to say instead:* "That solves the philosophy, but does it help you write the sentence? If the reader needs to feel the red, does it matter if it's a new fact or a new concept? No. It matters that you find the words that trigger the experience."

  *   **Zombies:** Refuse immediately. "We are writing about living people, not philosophical zombies."
  *   **Representationalism:** Refuse. "We aren't discussing how the eye works, we're discussing how the mind reports it."

  **Summary of the Flow:**
  1.  **Mary in the Room** (Total Knowledge).
  2.  **The Gap** (Facts vs. Here/Now).
  3.  **The Tomato** (The Surprise).
  4.  **The Writer's Mary** (Research vs. Draft).
  5.  **The Limit** (Why Grief is different from Red).
  6.  **The Work** (Identify the Tomato in your current chapter).

  Keep the tomato red. Keep the grief for the end. Keep the philosophy on a leash.
