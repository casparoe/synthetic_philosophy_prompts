prompt: |-
  I've been reading about the laws of armed conflict and there's something about them that strikes me as philosophically strange, and I'm trying to work out exactly what view of moral responsibility they presuppose.

  Here's the practice. Under international humanitarian law, the rules governing conduct in war — the prohibition on targeting civilians, the proportionality requirement, the ban on certain weapons — apply symmetrically to all combatants regardless of which side they're on. A soldier fighting for a state that launched a war of aggression has exactly the same legal right to kill enemy soldiers as a soldier defending against that aggression, provided both follow the same in-war rules. This is sometimes called the "moral equality of combatants" doctrine. At the same time, international law does distinguish between just and unjust wars at another level: the crime of aggression exists, and political and military leaders can be prosecuted for waging an unjust war. So the system as a whole says: the war itself may be criminal, and the leaders who started it may be guilty of a grave offense, but the ordinary soldiers who fight in it are legally permitted to kill, and their killings are not treated as murder — even when those killings serve the unjust cause.

  I want to understand what this practice presupposes. It seems to rule out a straightforward view on which individual moral responsibility simply inherits from the justice of the collective project one serves. But it also doesn't seem to adopt a pure "combatants are just instruments" view either, because soldiers are held responsible for how they fight, just not for which side they fight on. So: what theory of moral responsibility — or of the relationship between individual and collective action — best makes sense of this practice? Does the practice strictly presuppose that theory, or is it compatible with several? And what would have to change in the laws of war if we replaced the presupposed theory with, say, the view that individual soldiers are morally responsible for the justice of the war they fight in, in addition to their conduct within it? Finally, I'd like you to flag where your reasoning is most vulnerable: which assumption, if dropped, would most change your analysis, and what alternative conclusion might then follow.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Subject:** The Laws of Armed Conflict (LOAC) / International Humanitarian Law (IHL).
      *   **Specific Phenomenon:** The "Moral Equality of Combatants" (MEC) vs. the distinction between *jus ad bellum* (justice of war) and *jus in bello* (justice in war).
      *   **The Puzzle:** Soldiers on the unjust side are legally permitted to kill combatants on the just side, provided they follow *in bello* rules. Leaders are punished for aggression, but soldiers generally aren't treated as murderers.
      *   **Key Questions:**
          1.  What theory of moral responsibility does this practice presuppose?
          2.  Does it strictly presuppose one theory, or is it compatible with several?
          3.  What would change if we adopted the view that soldiers *are* responsible for the justice of the war (*jus ad bellum*)?
          4.  **Crucial Constraint:** Flag the most vulnerable assumption in the reasoning and explain how dropping it changes the conclusion.

  2.  **Initial Brainstorming & Theoretical Landscape:**

      *   *Traditional Just War Theory (Walzerian):* Michael Walzer's *Just and Unjust Wars* is the standard reference. He argues for the "separation thesis" (*ad bellum* and *in bello* are independent). This supports MEC. Why? Because of the "coercion/conscription" argument, the "epistemic limitation" argument (soldiers can't know the truth), and the "collective liability" argument (combatants lose rights regardless of justice).
      *   *Revisionist Just War Theory (McMahan, Rodin, etc.):* Jeff McMahan challenges MEC. He argues that moral responsibility *does* track the justice of the cause. Unjust combatants are essentially engaged in mass murder. The legal symmetry is a pragmatic concession, not a moral truth.
      *   *Legal Positivism/Pragmatism:* The law isn't necessarily trying to mirror perfect morality. It's trying to minimize suffering. If we tell unjust soldiers they are murderers, they will fight dirtier. Symmetry encourages compliance with *in bello* rules.
      *   *Institutional Role Morality:* Soldiers have a specific role defined by the state. Their duty is to the state, not to abstract justice (within limits).

  3.  **Addressing Question 1: What theory of moral responsibility is presupposed?**

      *   It's not simple "collective inheritance" (otherwise unjust soldiers would be criminals).
      *   It's not pure "instrumentalism" (otherwise they wouldn't be responsible for *in bello* violations).
      *   *Best Fit:* A **Functional/Institutional Theory of Role Responsibility** combined with **Epistemic Humility**.
      *   *Explanation:* Soldiers are agents of the state. The state bears the *ad bellum* responsibility. Soldiers bear the *in bello* responsibility. This is the "Separation Thesis."
      *   *Underlying Moral Logic:* It relies on a distinction between *liability to attack* (based on status as a threat) vs. *moral guilt* (based on the cause). Unjust combatants are liable to be killed because they are dangerous, not because they are wicked.

  4.  **Addressing Question 2: Strict presupposition or compatibility?**

      *   Does the law *strictly* presuppose the Walzerian view? No.
      *   It is compatible with **Pragmatic Consequentialism**. Even if McMahan is right morally (unjust soldiers are morally culpable), the law might still treat them symmetrically to ensure *in bello* compliance.
      *   So, the law is *underdetermined* by moral theory. It can be justified by Deontology (Walzer) or Consequentialism (Pragmatism).

  5.  **Addressing Question 3: What if we changed the theory? (McMahan's View)**

      *   If soldiers were responsible for *jus ad bellum*:
      *   Unjust combatants would be liable to prosecution for murder.
      *   Just combatants would have wider latitude (maybe no *in bello* restrictions against unjust combatants?).
      *   *Result:* Incentives for unjust soldiers to follow rules disappear. War becomes more brutal. The legal structure collapses into a "victor's justice" model.

  6.  **Addressing Question 4: The Vulnerable Assumption (The "Meta-Constraint"):**

      *   I need to identify a specific assumption in *my* analysis that, if removed, shifts the conclusion.
      *   *Candidate 1:* The assumption that the law aims for moral truth. (If I assume law is purely pragmatic, the moral puzzle dissolves).
      *   *Candidate 2:* The assumption that soldiers lack epistemic access to *jus ad bellum*. (If soldiers *can* know the war is unjust, the Walzerian defense weakens).
      *   *Candidate 3:* The assumption that "liability to attack" is distinct from "moral guilt."
      *   *Selection:* The **Epistemic Limitation Assumption**. Walzer's defense of MEC relies heavily on the idea that ordinary soldiers cannot reasonably be expected to judge the national leadership's decision to go to war. If we drop this (e.g., in an era of transparent information or volunteer professional armies), the justification for MEC crumbles, even legally.
      *   *Alternative:* The **Function of Law Assumption**. Is the law trying to track morality or minimize harm? If I assume the law *must* track morality, then MEC is a bug. If I assume the law is a regulatory tool, MEC is a feature. I think the "Function of Law" assumption is more fundamental to the analysis of *why* the law looks the way it does.
      *   *Refinement:* Let's go with the assumption that **Legal Norms Must Be Action-Guiding for the Agents Subject to Them.** If we drop this, and assume law is just retrospective judgment, the symmetry makes less sense. But actually, the strongest pivot point is usually the **Distinction between *Jus Ad Bellum* and *Jus In Bello*** itself.
      *   *Better Vulnerable Assumption:* The assumption that **Combatant Status is Binary and Uniform.** Modern warfare (insurgencies, terrorists, contractors) blurs this. But the prompt asks about the *theory of moral responsibility*.
      *   *Best Vulnerable Assumption:* **The Assumption of State Monopoly on *Ad Bellum* Judgment.** The current system assumes the State absorbs the moral risk of aggression so the soldier doesn't have to. If we drop this (assuming individuals retain full moral agency regarding the cause), the legal structure collapses.
      *   *Wait, let's look at the "Pragmatic vs. Moral" tension.* My analysis will likely argue that the law is pragmatic. The vulnerable assumption is that **Pragmatic Efficacy Trumps Moral Accuracy.** If we drop this (i.e., if we demand the law reflect moral truth regardless of consequences), the analysis of *why* the law exists changes completely.
      *   *Decision:* I will flag the assumption that **the primary purpose of IHL is the minimization of suffering (consequentialist) rather than the assignment of retributive justice (deontological).** If IHL's goal were retributive justice, MEC would be indefensible.

  7.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the depth of the question. Identify the "Separation Thesis."
      *   *Section 1: The Presupposed Theory.* Identify it as the **Walzerian "Separation Thesis"** grounded in **Role Morality** and **Collective Liability**. Soldiers are "dangerous" not "guilty."
      *   *Section 2: Compatibility.* It's not strict. Compatible with **Pragmatic Consequentialism**. The law might know soldiers are morally culpable but treats them as equals to keep them following rules.
      *   *Section 3: The Revisionist Challenge.* What if we adopt McMahan's view? Unjust soldiers become murderers. *In bello* constraints weaken for the just side. Incentives for compliance vanish. Chaos.
      *   *Section 4: The Vulnerable Assumption.* Explicitly flag the assumption about the **Purpose of Law (Regulation vs. Retribution).**
      *   *Conclusion:* Summarize.

  8.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Make sure to distinguish between *legal* permission and *moral* permission. The prompt asks about the practice (law) and what it presupposes.
      *   *Nuance:* The law doesn't explicitly say "soldiers are morally equal." It says "rules apply equally." The moral justification is the philosophical layer underneath.
      *   *Clarification on Responsibility:* The specific theory is often called "Non-Reductive Individualism" or "Institutional Mediation." I should use accessible terms. "Institutional Role Responsibility" is good.
      *   *Vulnerable Assumption Check:* Is "Purpose of Law" the best one? Maybe the assumption that **Soldiers are Epistemically Blinded.** If soldiers *know* the war is unjust (e.g., Nazi Germany late war), the legal shield often weakens (manifest illegality). So the law *already* accounts for this via the "Manifest Illegality" exception.
      *   *Pivot:* Actually, the most interesting vulnerable assumption is that **Combatants are the Primary Addressees of the Law.** If the law is actually addressed to Commanders/States, and soldiers are just tools, the moral responsibility question shifts.
      *   *No, stick to the Pragmatic vs. Moral Truth tension.* That's the heart of the Walzer vs. McMahan debate. The law presupposes that **Compliance is more valuable than Moral Accuracy.**

  9.  **Final Polish:** Ensure the tone is analytical and philosophical. Check all parts of the prompt are answered. (1. Theory? 2. Strict or compatible? 3. What if changed? 4. Vulnerable assumption?)

      *   *Theory:* Institutional Role Responsibility + Separation Thesis.
      *   *Strict/Compatible:* Compatible with Pragmatism.
      *   *Change:* Asymmetry, increased brutality.
      *   *Vulnerable Assumption:* That minimizing humanitarian harm outweighs the demand for moral consistency/retributive justice.

  10. (Final Review against constraints): Did I flag the vulnerable assumption clearly? Yes. Did I explain the alternative conclusion? Yes.

      *Let's write.*
answer: |-
  This is one of the deepest questions in the philosophy of international law and just war theory. You have correctly identified the tension between the **Separation Thesis** (the idea that *jus ad bellum* [justice of war] and *jus in bello* [justice in war] are independent) and intuitive notions of individual moral agency.

  Here is an analysis of the theory of moral responsibility presupposed by current International Humanitarian Law (IHL), its alternatives, and the implications of changing that theoretical foundation.

  ### 1. The Presupposed Theory: Institutional Role Responsibility

  The current legal practice does not presuppose that soldiers are morally "equal" in a deep metaphysical sense. Rather, it presupposes a theory of **Institutional Role Responsibility** combined with a **Status-Based Liability** model.

  **The Separation Thesis**
  Legally and philosophically (most famously articulated by Michael Walzer), the system relies on the claim that the moral evaluation of the *war* belongs to the political leadership, while the moral evaluation of the *fighting* belongs to the combatant.
  *   **Leaders** bear responsibility for the *cause* (aggression).
  *   **Soldiers** bear responsibility for the *conduct* (atrocities).

  **Status-Based Liability**
  Under this view, a combatant's liability to be attacked does not derive from their moral guilt regarding the war's cause. It derives from their **status as a threat**. By donning a uniform and carrying arms, a soldier becomes a "dangerous instrument."
  *   A soldier on the unjust side is not permitted to kill because their cause is just; they are permitted to kill because they are a combatant.
  *   Conversely, they may be killed not because they are wicked, but because they are dangerous.

  **Epistemic Humility and Coercion**
  This theory rests on two empirical assumptions about the soldier's position:
  1.  **Epistemic Limitation:** Ordinary soldiers lack the information and authority to judge the geopolitical nuances of *jus ad bellum*. They cannot reasonably be expected to determine if their state's war is aggressive.
  2.  **Coercion/Consent:** Soldiers are often conscripted or socially coerced. Holding them responsible for the state's decision would be to punish them for circumstances largely outside their control.

  Therefore, the theory of responsibility is **non-reductive**: The individual's moral liability does not simply reduce to the morality of the collective project they serve. Instead, the individual incurs specific liabilities based on the specific role they occupy within the institution of war.

  ### 2. Is This Theory Strictly Presupposed?

  No, the legal practice is **compatible with multiple moral theories**, which is a crucial distinction. The law is *underdetermined* by moral philosophy.

  While the *Walzerian* view (above) provides a deontological justification (soldiers have rights and duties based on their role), the same legal symmetry is compatible with **Pragmatic Consequentialism**.

  A consequentialist might argue: "Perhaps unjust soldiers *are* morally culpable for murder (as revisionist philosophers argue). However, if we tell them that, they will have no incentive to follow the rules of war. They will fight dirtier because they know they will be prosecuted as criminals regardless of their conduct."

  On this view, the "Moral Equality of Combatants" is a **legal fiction** maintained for humanitarian ends. The law treats them as equals not because they *are* moral equals, but because treating them as such minimizes overall suffering. Thus, the legal practice is compatible with:
  1.  **Walzerian Deontology:** Soldiers are genuinely morally symmetrical regarding killing.
  2.  **Pragmatic Consequentialism:** Soldiers are morally asymmetrical, but legal symmetry is necessary for compliance.

  ### 3. What If We Changed the Theory? (The Revisionist Challenge)

  If we replaced the current presupposition with the **Revisionist View** (championed by philosophers like Jeff McMahan), which holds that individual moral responsibility *does* track the justice of the cause, the Laws of Armed Conflict would undergo a radical transformation.

  Under the Revisionist view, an unjust combatant is essentially a participant in mass murder. They do not have a right to kill just combatants. Just combatants, conversely, are acting in self-defense or law enforcement.

  **Consequences for the Law:**
  1.  **Asymmetry of Rights:** Unjust combatants would be liable to prosecution for every enemy combatant they kill (treated as murder), whereas just combatants would not.
  2.  **Asymmetry of *In Bello* Constraints:** If unjust combatants are "criminal aggressors," the restrictions on how *just* combatants may treat them might loosen. Why should a police officer (just combatant) follow the same rules of engagement when tackling a armed robber (unjust combatant) as the robber follows?
  3.  **Collapse of Compliance:** This is the practical dealbreaker. If you tell a soldier, "Your cause is unjust, so you are a murderer no matter how cleanly you fight," that soldier loses the incentive to distinguish between civilians and combatants. They may reason, "I am already a criminal; I might as well win."
  4.  **Victor's Justice:** The determination of who is "just" and "unjust" is almost always made by the victor. Linking *in bello* rights to *ad bellum* justice would effectively mean the winning side's soldiers are immune from prosecution, while the losing side's soldiers are automatically liable. This would undermine the neutrality of the International Criminal Court.

  ### 4. The Vulnerable Assumption

  My analysis rests on a specific assumption about the function of law that, if dropped, would fundamentally alter the conclusion.

  **The Vulnerable Assumption:**
  > **The primary purpose of International Humanitarian Law is the minimization of humanitarian suffering (regulatory), rather than the accurate assignment of retributive justice (judicial).**

  **Why this is vulnerable:**
  My argument defends the current system by suggesting that even if soldiers *are* morally responsible for the war's justice (Revisionism), the law should ignore that fact to ensure compliance and reduce harm. This prioritizes *consequences* (fewer deaths/atrocities) over *moral accuracy* (punishing the guilty).

  **If this assumption is dropped:**
  If we assume the law's primary duty is to reflect **Moral Truth** (Retributive Justice), regardless of the strategic consequences, then the current Laws of Armed Conflict are indefensible.
  *   **Alternative Conclusion:** If the law must track moral truth, we ought to abolish the "Moral Equality of Combatants." We should prosecute soldiers on the aggressive side for murder, even if they followed the rules of war. We should accept that this might make wars bloodier (because unjust soldiers won't comply), but we would accept that bloodiness as the price of moral consistency.
  *   **Implication:** The law would shift from being a **code of conduct** (guiding behavior during war) to a **tool of judgment** (punishing guilt after war). This would likely result in the collapse of IHL as a regulatory framework, transforming it into a mechanism for post-hoc purging of the defeated side's military.

  ### Summary
  The current practice presupposes **Institutional Role Responsibility**, where the state absorbs the guilt of aggression so the soldier can focus on the rules of engagement. This is not strictly required by morality but is compatible with **Pragmatic Consequentialism**. If we shifted to a view where soldiers bear full responsibility for the war's justice, the legal symmetry would vanish, likely increasing brutality. The entire analysis hinges on the assumption that **saving lives via compliance is more important than ensuring every individual is punished exactly according to their moral guilt.** If you reject that hierarchy of values, the legal architecture of modern war collapses.
