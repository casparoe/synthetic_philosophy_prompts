      *   *Analysis of the "Killer" Constraint:* Focus on Normativity (Error).
      *   *Analysis of Unsatisfiability:* Focus on the Immanence/Normativity tension (The "Naturalized Semantics" problem).
      *   *Conclusion:* Summary of the impasse.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address "One message per token"? Yes, under Context Sensitivity.
