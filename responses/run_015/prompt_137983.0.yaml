answer: |-
  Here are the desiderata for an account of genetic information, calibrated to your specific purpose: determining whether the molecular biologist's semantic vocabulary is scientifically legitimate or merely decorative.

  ### The Desiderata Table

  | Criterion | Source Case | Requirement | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Specificity (No Collapse)** | No collapse | The account must distinguish genetic causation from ordinary physical correlation (e.g., smoke/fire). It must explain why the genome is *privileged* over the environment in information talk. | **Non-Negotiable** |
  | **2. Immanence (No Homunculus)** | No external interpreter | The "reading" relation must be grounded in the physical system itself. No external observer, designer, or user can be required to fix the content. | **Non-Negotiable** |
  | **3. Normativity (Possibility of Error)** | The possibility of error | The account must distinguish between *what the machinery does* and *what it is supposed to do*. Misreading must be a factual category, not just a statistical deviation. | **Non-Negotiable** |
  | **4. Explanatory Utility (Payoff)** | Payoff | The semantic vocabulary must license inferences (e.g., counterfactuals about mutation or environment) that a purely chemical description cannot support or makes intractable. | **Non-Negotiable** |
  | **5. Context Sensitivity** | One message per token | The account must accommodate polysemy (same sequence, different function) without fracturing the concept of information or retreating to "it depends" triviality. | Preference (Developmental Camp) |
  | **6. Relationality** | Environment relativity | The account must specify the relata of the information relation (e.g., DNA *for* development *in* environment E). | Preference (Interactionist Camp) |
  | **7. Substrate Neutrality** | Non-DNA heredity | The account must either explain why DNA is uniquely informational or extend the same criteria to epigenetic/prion heredity. | Preference (Extended Heredity Camp) |
  | **8. Teleological Grounding** | Selection and function | The account must specify whether content is fixed by evolutionary history (selection), current causal role, or future potential. | Preference (Teleosemantics Camp) |

  ---

  ### Analysis of the Constraints

  #### 1. The Single Requirement That Excludes the Most: **Normativity (Possibility of Error)**

  This is the bottleneck. If you cannot naturalize error, the biologist is speaking metaphorically, full stop.

  *   **Excludes the Deflationary (Just-Chemistry) View:** Chemistry describes transitions between physical states. State $A$ leads to State $B$. There is no "mistake" in physics, only outcome. If a ribosome incorporates the wrong amino acid, chemistry calls it a low-probability binding event. Biology calls it a *translation error*. To validate the biologist, you must show how a physical system generates a norm (an "ought") without a mind. Most purely chemical accounts fail this immediately.
  *   **Excludes the Naive Instructionist (Program) View:** A program implies a programmer. If the norm comes from the "design" of the code, you violate **Immanence**. If the norm comes from the machinery, you face the circularity problem (the machinery is built by the code).
  *   **Excludes Simple Selected-Function Views:** While teleosemantics (information = selected effect) attempts to solve normativity via evolution, it struggles with **Novelty** (Case 7). A novel sequence that has never been selected cannot have a "selected function," yet a biologist will still say it "codes for" a structure if it is transcribed and translated. If the theory says novel sequences have no content, it conflicts with working practice.

  **Verdict:** Normativity is the hardest constraint to satisfy naturalistically. If you solve this, you have solved 80% of the philosophical problem. If you don't, the "lab coat metaphor" charge stands.

  #### 2. The Jointly Unsatisfiable Subset: **The Impossibility Theorem of Genetic Semantics**

  There is a strong argument that the following three non-negotiable requirements cannot be simultaneously satisfied by a single theory without significant residue.

  **The Triad:**
  1.  **Immanence** (Content is fixed internally, no observer).
  2.  **Normativity** (There is a fact of the matter about error).
  3.  **Specificity** (The information is in the *DNA*, not the context).

  **The Tension:**
  *   To get **Normativity** without an observer (**Immanence**), you generally need a teleological ground (e.g., evolutionary history). The system "ought" to do $X$ because doing $X$ was selected for in the past.
  *   However, if content is fixed by past selection, you struggle with **Context Sensitivity** (Case 3) and **Environment Relativity** (Case 5). If a codon's effect depends on the current metabolic state, but the "meaning" is fixed by ancient history, the DNA no longer carries the specific instruction for *this* outcome. The "information" shifts to the *context* (the metabolic state).
  *   If the information shifts to the context, you violate **Specificity**. You are no longer entitled to say "the genome specifies the trait"; you must say "the genome *plus* the current cellular state specifies the trait."
  *   But if you concede that, the biologist's vocabulary ("the gene *for* X") becomes strictly false or radically incomplete. The genome becomes merely a *partial* cause, indistinguishable in informational status from the temperature or pH of the cytoplasm (violating **No Collapse**).

  **Result:**
  *   **Option A (Teleosemantics):** Saves Normativity and Immanence. Sacrifices Specificity (content is historical/relational, not intrinsic to the sequence) and struggles with Novelty.
  *   **Option B (Causal/Chemical):** Saves Specificity (the sequence is physically distinct). Sacrifices Normativity (no error, just chemistry) and Immanence (if "error" is defined by human interest).
  *   **Option C (Developmental/Contextual):** Saves Context Sensitivity. Sacrifices Specificity (DNA is just one ingredient among many) and risks collapsing back into general causation (**No Collapse**).

  ### Conclusion for the Biologist's Vocabulary

  To decide if the biologist is entitled to her vocabulary, you must check which leg of the triad she is willing to limp on.

  *   If she insists the gene *alone* specifies the trait (**Specificity**), she is likely smuggling in an **External Interpreter** (assuming the cell's goal is what *she* thinks it is).
  *   If she insists there are real **Errors** (**Normativity**), she is likely relying on **Selection** (**Teleological Grounding**), which means her claims about novel sequences or context-dependent expression are technically category errors.
  *   If she insists on **Immanence** (no designer), she must accept that "information" is a relational property of the *system*, not the *molecule*.

  **The Verdict:** The vocabulary is **instrumentally valid** (satisfies **Payoff**) but **ontologically unstable** (fails the **Immanence + Normativity + Specificity** triad). The biologist is entitled to the vocabulary *only if* she treats it as a shorthand for a complex system-property rather than a literal description of the DNA molecule. If she claims the DNA *itself* is a code in the sense of a computer program, the **No External Interpreter** and **Context Sensitivity** criteria falsify her claim. If she claims it is *just* chemistry, the **Normativity** criterion falsifies hers.

  The stalemate persists because one side defends **Specificity** (Instructionists) and the other defends **Immanence** (Deflationists), while **Normativity** (the actual practice of biology) requires both.
