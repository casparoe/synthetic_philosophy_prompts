          1.  No collapse (distinguish from general causation/correlation).
          2.  No external interpreter (avoid homunculus, account for contingent mapping).
          3.  One message per token is wrong (context-dependence/overlap).
          4.  The possibility of error (normativity/misrepresentation).
          5.  Environment relativity (phenotype depends on context).
          6.  Non-DNA heredity (epigenetics, prions).
          7.  Selection and function (junk DNA, novel sequences).
          8.  Payoff (predictive/inferential power over chemistry).
      *   **Tasks:**
          1.  Define the desiderata based on the cases.
          2.  Mark which are non-negotiable vs. preferences.
          3.  Identify which single requirement excludes the most familiar options (deflationary, instructionist, selected-function).
          4.  Determine if any subset of requirements is jointly unsatisfiable (the "impossibility theorem" aspect).
          5.  Format: Table is fine, but weight the criteria over scoring positions.

  2.  **Deconstruct the Cases into Desiderata:**
      *   *No collapse* $\rightarrow$ **Specificity Constraint:** The theory must distinguish genetic causation from ordinary physical causation (e.g., smoke/fire).
      *   *No external interpreter* $\rightarrow$ **Immanence Constraint:** The semantic content must be grounded within the biological system itself, not by an external observer or designer.
      *   *One message per token* $\rightarrow$ **Context Sensitivity:** The theory must handle polysemy (same sequence, different roles) without fracturing the concept of information.
      *   *Possibility of error* $\rightarrow$ **Normativity Constraint:** The theory must distinguish between *what happens* and *what was supposed to happen* (misrepresentation).
      *   *Environment relativity* $\rightarrow$ **Relational Constraint:** Information content is not intrinsic to the DNA alone but relative to a developmental/evolutionary context.
      *   *Non-DNA heredity* $\rightarrow$ **Substrate Neutrality:** The theory must explain why DNA is privileged (if it is) or include other heritable factors.
      *   *Selection and function* $\rightarrow$ **Teleological Constraint:** Does meaning depend on evolutionary history (selection) or current causal role?
      *   *Payoff* $\rightarrow$ **Explanatory Utility:** The semantic vocabulary must enable inferences impossible for pure chemistry.

  3.  **Evaluate Non-Negotiable vs. Preference:**
      *   *Non-Negotiable:* If a theory fails these, it doesn't solve the user's core problem (justifying the biologist's vocabulary).
          *   No Collapse (otherwise "information" is trivial).
          *   Possibility of Error (otherwise "reading" is just "reacting").
          *   Payoff (otherwise the vocabulary is useless).
          *   No External Interpreter (otherwise it's not biological semantics, it's human attribution).
      *   *Preference/Camp-Specific:*
          *   Substrate Neutrality (DNA-centric vs. broader heredity).
          *   Teleological Constraint (Selectionist vs. Developmental).
          *   Context Sensitivity (Rigid code vs. Fluid interpretation).

  4.  **Identify the "Killer" Constraint:**
      *   Which requirement kills the most standard views?
      *   *Deflationary (Just Chemistry):* Killed by **Possibility of Error**. Chemistry describes what *does* happen; semantics requires what *should* happen. If you can't define a mistake without invoking an observer, chemistry wins.
      *   *Instructionist (Program/Code):* Killed by **Context Sensitivity** or **Environment Relativity**. A rigid program implies 1:1 mapping. Biology is messy.
      *   *Selected-Function (Teleosemantics):* Killed by **Payoff** (sometimes) or **One Message Per Token** (if selection history is ambiguous). But mostly, Teleosemantics struggles with **Novel Sequences** (part of Selection/Function case).
      *   *The Strongest Candidate:* **The Possibility of Error (Normativity).** This is the hardest hill to die on for naturalists. To say a ribosome *misread* a codon requires a norm. Chemistry has no norms. If you solve this, you solve the "metaphor in a lab coat" objection. If you can't, the biologist is just speaking poetically.

  5.  **Identify Joint Unsatisfiability (The Impossibility Theorem):**
      *   Is there a tension between **No External Interpreter** and **Possibility of Error**?
