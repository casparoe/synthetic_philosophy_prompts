      *Refining Follow-ups:* The prompt asks for follow-ups "keyed to the answer she's most likely to give." I need to explicitly state *what* that likely answer is, so the moderator knows *why* I'm suggesting that follow-up. I will add a brief note in parentheses or italics explaining the anticipated response.

