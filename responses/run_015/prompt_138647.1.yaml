answer: |-
  Your TA is absolutely right, and your friend is also right: the "averaging step" is exactly where your intuition breaks down. This is one of the most common conceptual hurdles in introductory game theory, so don't worry—your reasoning is very standard, just slightly flawed in a way that has a specific name (a quantifier swap error).

  Here is the breakdown of why your argument fails, the solution to your TA's specific game, and the note on weak dominance.

  ### 1. Where your "Averaging Argument" goes wrong

  Your logic was:
  1.  If a mixed strategy $\sigma$ dominates pure strategy $s$, then against any opponent move $t$, $\sigma$ beats $s$.
  2.  $\sigma$'s payoff is an average of pure strategies in its support.
  3.  Therefore, against any specific $t$, at least one pure strategy in the support beats $s$.
  4.  **The Flaw:** You concluded that "one of those pure strategies has to beat $s$ **everywhere**."

  This is a logical error involving the order of quantifiers.
  *   **True:** $\forall t, \exists s_{pure} \in \text{support}(\sigma)$ such that $u(s_{pure}, t) > u(s, t)$.
      *(For every opponent move, there is **some** pure strategy in the mix that beats $s$.)*
  *   **False:** $\exists s_{pure} \in \text{support}(\sigma)$ such that $\forall t, u(s_{pure}, t) > u(s, t)$.
      *(There is **one specific** pure strategy in the mix that beats $s$ against **all** opponent moves.)*

  In mixed strategy dominance, the "best" component of the mixture often **changes** depending on what the opponent does. One pure strategy covers the mixture's weakness against Left, while another covers its weakness against Right. Together, they cover everything; separately, they have holes.

  ### 2. Solving the TA's Game

  Let's write out the payoff matrix clearly to verify the TA's claim.
  *(Row Payoff, Column Payoff)*

  | Row \ Col | L | M | R |
  | :--- | :---: | :---: | :---: |
  | **A** | 4, 3 | 0, 0 | 6, 1 |
  | **B** | 1, 0 | 4, 3 | 6, 1 |
  | **C** | 1.5, 0 | 1.5, 0 | 3, 6 |

  #### Step 1: Pure Strategy IESDS
  You correctly identified that **nothing happens here**.
  *   **Row:** A is better than B at L, but B is better than A at M. C is better than A at M, but A is better than C at L and R. No pure strategy dominates another.
  *   **Column:** L is better than M at A, but M is better than L at B. R is worse than L at A, but better than L at C. No pure strategy dominates another.

  If you stop here, the game does not collapse. But we are allowed to use **mixed strategies** to find dominance.

  #### Step 2: Mixed Strategy Dominance (Row)
  Look at Row's strategy **C**. Payoffs: $(1.5, 1.5, 3)$.
  Now consider a mixed strategy $\sigma_{Row}$ that plays **A and B with equal probability (50/50)**.
  *   Against **L**: $0.5(4) + 0.5(1) = \mathbf{2.5}$. (C gets 1.5). **2.5 > 1.5**
  *   Against **M**: $0.5(0) + 0.5(4) = \mathbf{2.0}$. (C gets 1.5). **2.0 > 1.5**
  *   Against **R**: $0.5(6) + 0.5(6) = \mathbf{6.0}$. (C gets 3.0). **6.0 > 3.0**

  The mixture $(0.5A, 0.5B)$ **strictly dominates** pure strategy **C**.
  *   *Why your argument failed here:* Against L, A is the "hero" of the mix (4 vs 1). Against M, B is the "hero" (4 vs 0). Neither A nor B dominates C on its own (A loses to C at M; B loses to C at L), but the mixture averages out the lows to beat C everywhere.

  **Action:** Eliminate **C**.

  #### Step 3: Mixed Strategy Dominance (Column)
  Now the game is reduced. Row only plays A or B. Column knows this.
  The relevant Column payoffs are only against A and B:

  | Col \ Row | A | B |
  | :--- | :---: | :---: |
  | **L** | 3 | 0 |
  | **M** | 0 | 3 |
  | **R** | 1 | 1 |

  Check Column's strategy **R**. Payoffs: $(1, 1)$.
  Consider a mixed strategy $\sigma_{Col}$ that plays **L and M with equal probability (50/50)**.
  *   Against **A**: $0.5(3) + 0.5(0) = \mathbf{1.5}$. (R gets 1). **1.5 > 1**
  *   Against **B**: $0.5(0) + 0.5(3) = \mathbf{1.5}$. (R gets 1). **1.5 > 1**

  The mixture $(0.5L, 0.5M)$ **strictly dominates** pure strategy **R**.

  **Action:** Eliminate **R**.

  #### Result
  The game collapses from $3 \times 3$ to $2 \times 2$ (Strategies A, B for Row; L, M for Column). Your TA was correct: allowing mixed strategies as dominators unlocks the first deletion (C), which creates the conditions for the second deletion (R).

  ### 3. Weak Dominance and Order Dependence

  You asked: *"Does anything change if I redo the whole thing with weak dominance instead of strict?"*

  **Yes, fundamentally.**

  1.  **Strict Dominance (IESDS):** Whether you use pure or mixed strategies, the order of deletion **does not matter**. The set of surviving strategies is unique. This is because a strictly dominated strategy is *never* a best response to *any* belief. Removing it never changes the best-response status of the remaining strategies.
  2.  **Weak Dominance (IEWDS):** The order of deletion **does matter**.
      *   **Why?** A weakly dominated strategy *can* be a best response (specifically, to a belief that puts zero probability on the opponent strategies where the dominance is strict).
      *   If you delete Strategy X first, you might remove the only scenario where Strategy Y was strictly better than Strategy Z. If you had deleted Z first, Y might have remained.
      *   **Exam Tip:** In first-year courses, unless specified otherwise, assume **Strict Dominance** for Iterated Deletion problems because it guarantees a unique solution. If a question asks about Weak Dominance, be prepared to show that different deletion orders lead to different outcomes.

  ### Summary for your Revision
  1.  **Your Logic Hole:** You assumed that because a mixture beats $s$ everywhere, one specific ingredient of the mixture must beat $s$ everywhere. In reality, different ingredients beat $s$ against different opponent moves.
  2.  **The Game:** C is dominated by a mix of A/B. Once C is gone, R is dominated by a mix of L/M. Pure IESDS finds nothing; Mixed IESDS reduces the game.
  3.  **Order:** Strict dominance (pure or mixed) is order-independent. Weak dominance is order-dependent.

  You have a solid grasp of the mechanics; you just tripped on a subtle logical quantifier. That's a very normal place to get stuck! Good luck with the exam.
