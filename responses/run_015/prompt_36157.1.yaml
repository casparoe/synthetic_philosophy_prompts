answer: |-
  This is an exceptionally sharp framing of the boundary problem. Your professor is correct that democratic theory often treats the *demos* as a pre-political given, only to struggle when the political act itself redefines the *demos*. The Brexit referendum is not just a case study; it is a stress test that exposes the structural weaknesses in standard democratic justification.

  Here is an analysis of the 2016 referendum through the lens of the boundary problem, structured by the mapping direction (theory to case) and the reverse direction (case to theory), including the specific silences you noted.

  ### I. The Mapping Direction: Principles vs. The Actual Franchise

  The actual franchise for the EU Referendum was defined by the *European Union Referendum Act 2015*. It largely mirrored the UK parliamentary franchise but with specific modifications: British, Irish, and Commonwealth citizens resident in the UK; British citizens abroad who had been registered voters within the last 15 years; and peers in the House of Lords. It explicitly excluded other EU citizens resident in the UK, 16- and 17-year-olds, and British expats resident abroad for more than 15 years.

  Here is how standard democratic principles map onto this reality, and where they fracture.

  **1. All-Affected Interests (AAI)**
  *   **The Principle:** Anyone whose interests are significantly impacted by the decision should have a vote.
  *   **The Brexit Application:** This principle explodes the actual franchise. The decision affected trade, security, and legal rights across the entire EU single market. A French farmer, a German auto worker, and the Latvian nurse in Cardiff all had material interests at stake. Furthermore, AAI strongly implies the inclusion of future generations, given the intergenerational economic and constitutional weight of the withdrawal.
  *   **The Mismatch:** The actual franchise is radically under-inclusive compared to AAI. However, AAI also creates the "infinite regress" problem here. If the decision affects the global economy, does the principle enfranchise everyone? In practice, AAI cannot draw a line without importing another principle (like territory or citizenship). It explains why the exclusion of the Latvian nurse is unjustifiable, but it cannot justify why the Australian student *should* be included, as his interests were arguably less affected than the EU resident's.

  **2. All-Subjected to Coercion (ASC)**
  *   **The Principle:** Anyone subject to the binding laws resulting from the decision must be in the *demos*.
  *   **The Brexit Application:** This creates the specific paradox you identified. The referendum decided whether UK law would cease to be subordinate to EU law.
      *   *The Latvian Nurse:* She was subject to UK law *and* EU law. The vote directly altered her legal status regarding residency rights and freedom of movement. She is heavily "subjected" to the outcome.
      *   *The Australian Student:* He is subject to UK law, but not EU law. His status relies on UK visa policy, which was less directly tied to EU membership than the Latvian's.
      *   *The British Expat in Spain:* If the vote succeeded, he would lose EU citizenship rights (freedom of movement, healthcare reciprocity). He is subjected to the loss of rights, even if not UK tax law.
  *   **The Mismatch:** The actual franchise violates ASC logic by including the Australian (less subjected to the specific EU legal change) while excluding the Latvian (more subjected). It also creates ambiguity regarding the expat: is he "subjected" if he doesn't live under the UK government's daily coercion? The 15-year rule suggests the state believes coercion fades over time, a theoretical claim ASC does not easily support.

  **3. Stakeholder / Citizenship (The "Pre-Political Demos")**
  *   **The Principle:** The *demos* is defined by prior membership in the political community (citizenship), regardless of specific affected interests.
  *   **The Brexit Application:** This is the closest match to the actual franchise, but it reveals historical baggage rather than democratic logic. The inclusion of Commonwealth citizens (the Australian student) is a relic of the British Nationality Act 1948, retaining voting rights for subjects of the Crown. The exclusion of EU citizens treats them as "guests" rather than stakeholders, despite long-term residency.
  *   **The Mismatch:** This principle struggles with the 16-year-old exclusion. If citizenship is the key, why do 16-year-old citizens (in a referendum context) lack capacity while 18-year-olds possess it? It also struggles with the 15-year expat rule. If citizenship is an enduring bond, why does it expire for voting purposes after 15 years of absence? This suggests the franchise wasn't based on a coherent theory of stakeholding, but on a specific conception of "active connection" that was applied inconsistently.

  **4. Competence and Duration**
  *   **The Principle:** Voters must have the capacity to understand the issue and a durable connection to the outcome.
  *   **The Brexit Application:** The exclusion of 16-year-olds was justified by claims of insufficient maturity/competence, despite 16-year-olds having the right to vote in Scottish independence and local elections in some UK jurisdictions. The 15-year rule for expats attempts to measure "duration of connection."
  *   **The Mismatch:** The inconsistency is glaring. A 17-year-old in Scotland was deemed competent to vote on Scottish independence (which reshaped the UK boundary) but not competent to vote on EU membership. This suggests competence is not a fixed principle but a political variable adjusted to suit the desired electorate.

  ### II. The Reverse Direction: What Brexit Shows About Theory

  Moving from the case back to the theory, the Brexit referendum offers three critical insights regarding the boundary problem.

  **1. The "Administrative Default" Hypothesis**
  Your professor's suspicion is largely confirmed by the legislative history. The franchise was not the result of a fresh deliberative exercise on who constitutes the *demos* for this specific constitutional change. It was a legislative compromise. The government adopted the existing parliamentary franchise to minimize administrative friction and avoid the appearance of "gerrymandering" the vote.
  *   **Theoretical Implication:** This suggests that in high-stakes real-world politics, the boundary problem is not "solved" by theory; it is bypassed by bureaucracy. The *demos* is treated as an administrative category (who is on the electoral roll?) rather than a normative one (who *ought* to decide?). The boundary problem is ignored not because it is invisible, but because solving it is politically costly.

  **2. The Circularity of Constituent Power**
  There is a principled defense of the Westminster franchise, but it relies on a specific theory of sovereignty rather than democratic inclusion. The argument is that the referendum was an exercise of *constituent power* by the UK Sovereign (Parliament + People). Since the EU membership was ratified by the UK Parliament, only the UK constituent body could un-ratify it.
  *   **Theoretical Implication:** This defense admits that the boundary problem is unresolvable *democratically* when the vote is about the boundary itself. You cannot ask the EU who the UK voters should be, because that presupposes the EU has authority over the UK *demos*. Therefore, the UK must unilaterally define the boundary. This confirms that the boundary problem is ultimately a question of power, not logic. The "lazy default" is actually a assertion of sovereignty: *We decide who we are.*

  **3. Is the Problem Unresolvable in Practice?**
  Brexit suggests the boundary problem is not unresolvable, but that its resolution is always exclusionary. You cannot satisfy All-Affected, All-Subjected, and Citizenship simultaneously.
  *   **Theoretical Implication:** The episode demonstrates that democratic theory lacks a lexical ordering for these principles. When they conflict (as they did with the Latvian nurse vs. the Australian student), there is no meta-principle to decide which one wins. The decision is made by raw political calculation. This supports the view that the boundary problem is a "paradox of founding": you need a *demos* to vote on the constitution, but you need a constitution to define the *demos*. Brexit shows that when this loop is broken, it is broken by force of law, not force of argument.

  ### III. The Silences: Where Theory Fails to Speak

  There are two areas where standard democratic theory offers no vocabulary for the Brexit boundary failure, which you should highlight as critical gaps.

  **1. Nested Demoi and the Good Friday Agreement**
  Standard democratic theory assumes a unitary state with a single boundary. Northern Ireland exposes the failure of this assumption. The Good Friday Agreement (GFA) created a functional, cross-border *demos* on the island of Ireland, predicated on open movement and EU membership.
  *   **The Silence:** Democratic theory has no mechanism for a "veto" by a sub-unit whose constitutional settlement is fundamentally altered by the larger unit's vote. The people of Northern Ireland voted Remain, but the UK-wide majority overrode them. Theory speaks of "tyranny of the majority," but it lacks a framework for *interlocking demoi*. The boundary of the UK *demos* cut through the boundary of the Irish *demos*. The theories of "All-Subjected" or "Stakeholder" cannot easily account for a population that is subject to two sovereigns (London and Dublin) simultaneously, where one sovereign withdraws from the framework that stabilized the relationship.

  **2. Future Generations and Temporal Boundaries**
  The exclusion of 16- and 17-year-olds, combined with the long-term nature of Brexit, highlights democracy's inability to account for time.
  *   **The Silence:** Most boundary theories are spatial (who is *here*?), not temporal (who is *next*?). The "All-Affected" principle theoretically includes future people, but has no mechanism to enfranchise them. Brexit is a decision with a 50-year horizon taken by a demographic skewing heavily toward older voters. Democratic theory treats the *demos* as a contemporaneous snapshot. It has no account for the rights of the future *demos* who will inherit the boundary decisions of the present *demos*. The silence here is total: theory assumes the dead hand of the past (the 1948 Commonwealth rules) is legitimate, but the hand of the future (16-year-olds) is not.

  ### Conclusion for Your Paper

  The Brexit referendum validates your professor's critique: the boundary problem is acknowledged in the abstract but resolved in practice by administrative convenience and assertions of sovereignty.
  *   **Mapping:** No single principle (AAI, ASC, Citizenship) matches the actual franchise. The actual franchise is a hybrid that satisfies none of them consistently.
  *   **Reverse:** The episode shows that when the boundary itself is the subject of the vote, democratic theory retreats. It cannot resolve the circularity of who decides the *demos*.
  *   **Silences:** The treatment of Northern Ireland and future generations reveals that liberal democratic theory is ill-equipped to handle nested sovereignties and intergenerational justice.

  The Brexit case suggests that the boundary problem is not a puzzle to be solved by better theory, but a political conflict that theory often obscures. The "lazy administrative default" was not an accident; it was the only way to hold the vote without unraveling the definition of the UK *demos* entirely.
