  The design functions by isolating the variable of substrate while holding behavioral output constant. The specific belief-analogue attributed to both systems is the proposition that the current batch contains unsafe impurities, generating a predictive attribution that each will act to halt distribution. In nearby possible worlds where the spectral spike is accompanied by a secondary calibration error, the human might hesitate to contextualize the noise, whereas the two-bitser, bound by its rigid transition rule, would reject the batch regardless, revealing the fragility of the behavioral equivalence. Dennett argues that because attributing this belief reliably predicts the two-bitser's behavior better than a physical description of its registers, the intentional stance treats the state as genuinely explanatory, dissolving the hard line between original and derived intentionality. Searle counters that the artifact possesses only observer-relative intentionality because its syntactic operations lack intrinsic aboutness, rendering the attribution metaphorical and parasitic on the designer's mind. The feature doing the philosophical labor is behavioral equivalence coupled with substrate absence; if the artifact's registers were implemented in biological neural tissue, Searle would likely concede original intentionality, whereas if the artifact failed to match the human's response, Dennett would retreat to the physical stance, admitting the intentional description was merely heuristic. An honest defense of Searle's disadvantaged position insists that predictive success does not equate to semantic understanding; the two-bitser manipulates shapes according to rules without grasping what "contamination" means, so attributing belief confuses the simulation of mind with the presence of mind, preserving the syntax-semantics distinction regardless of output fidelity.
