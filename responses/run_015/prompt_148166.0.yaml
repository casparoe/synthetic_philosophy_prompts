  # JOINT STATEMENT ON THE ONTOLOGY OF PERSISTENCE
  **Prepared by:** The Endurantist Working Group & The Perdurantist Working Group
  **Date:** [Seminar Final Exercise]
  **Subject:** Clarification of Explanatory Costs and Residual Disagreements

  ## I. AGREED FORMAL CLAIMS
  *Both parties affirm the following propositions as the common ground necessary to formulate the dispute. Neither side contends that these claims alone resolve the ontological question.*

  1.  **The Reality of Change:** Objects undergo genuine qualitative change. A single entity can possess a property (e.g., being straight) at time $t_1$ and lack that property (e.g., being bent) at time $t_2$.
  2.  **The Problem of Temporary Intrinsics:** If an object $O$ is strictly numerically identical at $t_1$ and $t_2$, and properties are monadic (non-relational), $O$ appears to entail a contradiction: $O$ is $F$ and $O$ is not-$F$.
  3.  **The Perdurantist Formal Solution:** This contradiction is dissolved if $O$ is understood as a four-dimensional spacetime worm composed of distinct temporal parts. The part at $t_1$ is $F$; the part at $t_2$ is not-$F$. No single entity bears incompatible monadic properties.
  4.  **The Endurantist Formal Constraint:** Any adequate account must preserve the intuition that the *object itself*, not merely a counterpart or a part, is the subject of change and the bearer of moral and legal responsibility over time.
  5.  **Adequacy Conditions:** Both sides agree that a successful theory must provide coherent truth-conditions for ordinary claims regarding aging, color change, and personal identity, including survival through fission scenarios (e.g., amoebic division) and intermittent existence (e.g., disassembly and reassembly).

  ## II. TABLE OF RESIDUAL DISAGREEMENTS
  *The following table isolates the precise points of divergence. Wording has been vetted by both sides to avoid straw-manning.*

  | Issue | The Endurantist Position | The Perdurantist Position |
  | :--- | :--- | :--- |
  | **1. Nature of the Object** | Objects are three-dimensional continuants. They are **wholly present** at every moment of their existence, meaning the entire entity exists at $t$, not merely a slice of it. | Objects are four-dimensional occurrents (spacetime worms). They are **never wholly present** at a time; only a temporal stage is present at $t$. |
  | **2. Numerical Identity** | Persistence is **strict numerical identity**. The object at $t_1$ is literally the *same number* as the object at $t_2$. | Persistence is **genidentity** (causal/qualitative continuity between stages). "Identity over time" is a loose manner of speaking regarding the unity of a worm. |
  | **3. Property Bearing** | Objects bear properties **tensedly** or **relationally** (e.g., "being bent-at-$t_1$"). The object itself is the sole substratum. | Temporal parts bear properties **simpliciter**. The worm bears properties derivatively via its parts. |
  | **4. Ontological Commitment** | Commits to substances that retain identity through change. Rejects temporal parts as redundant entities. | Commits to temporal parts as the primary ontological unit. Rejects strict identity over time as logically incoherent for changing things. |

  ## III. ANALYSIS OF CRUXES
  *The parties identify two specific loci where explanatory costs diverge sharply. For each crux, a concrete test case is specified, and each side records their prediction regarding what the case demonstrates.*

  ### Crux (i): The Logical Status of Temporary Intrinsics
  **The Question:** Does the possession of incompatible properties by an identical object generate a genuine logical contradiction, or is this an appearance resolvable by modifying the property relation?

  *   **Endurantist Claim:** The contradiction is merely apparent. It arises from ignoring the temporal index. Properties are not monadic absolutes but relations to times (or the object has them in a tensed manner). Thus, $O$ is $F$-at-$t_1$ and $O$ is $\neg F$-at-$t_2$ is no more contradictory than $O$ is $F$-here and $O$ is $\neg F$-there.
  *   **Perdurantist Claim:** The contradiction is genuine if properties are intrinsic. Relationalizing all properties (making "bentness" a relation to a time) strips objects of their intrinsic nature, which is implausible. The only way to preserve intrinsic properties is to locate them in distinct entities (temporal parts).
  *   **Test Case:** **The Qualitative Inversion.** An object changes from entirely red to entirely blue with no intermediate state.
  *   **Predictions:**
      *   *Endurantist:* This case shows that our language of "having a property" is context-sensitive. We can assert "It is red" and "It is blue" without contradiction because the copula is implicitly tensed. The cost is accepting that intrinsic properties are actually time-indexed relations.
      *   *Perdurantist:* This case shows that "The Object" is ambiguous. The red stage and the blue stage are distinct. To say "The Object changed" is to say "The worm has a red part and a blue part." The cost is accepting that what we point to is never the whole object.

  ### Crux (ii): Ontological Parsimony and Intermittent Existence
  **The Question:** Does ontological parsimony favor perdurantism once we count the complex relations or primitive thisness required to sustain endurantism, particularly in non-continuous cases?

  *   **The Concrete Case: The Intermittent Machine.**
      A complex machine is fully disassembled. Its parts are stored in a warehouse for ten years, then reassembled into the original configuration. There is no continuous spatiotemporal path of the whole object during the storage period.
  *   **Endurantist Position:** The machine ceases to exist as a whole during storage and comes back into existence upon reassembly. It is numerically the same machine because the *form* and *functional organization* are preserved, and the parts are causally connected to the original assembly.
  *   **Perdurantist Position:** The machine is a gappy spacetime worm. The temporal parts during the storage period are null (or consist only of scattered parts). The "identity" across the gap is secured by the causal continuity of the parts and the similarity of configuration.
  *   **The Niche Pressure (Functional Criteria):** The Perdurantist argues that the Endurantist's criteria for re-identifying the machine (functional organization + causal continuity of parts) are structurally identical to the Perdurantist's criteria for temporal-part unity. If the Endurantist relies on causal/functional continuity to bridge the gap where the object is *not* wholly present, they are implicitly analyzing persistence via relations between stages, which undermines the claim that the object is "wholly present" in a strict sense.
  *   **Predictions:**
      *   *Endurantist:* This case will show that strict identity can survive gaps if the *principle of unity* (the form/function) persists. The cost is admitting that "existence" can be intermittent, but this is cheaper than positing a gappy worm. We do not rely on "stages"; we rely on the persistence of a *substance* defined by its functional capacity.
      *   *Perdurantist:* This case will show that the Endurantist is secretly a Perdurantist about persistence conditions. By appealing to causal continuity of parts to justify identity across the gap, the Endurantist admits that the "whole object" is not doing the work; the relations between the pre-gap and post-gap states are. The cost for the Endurantist is admitting their "wholly present" intuition is abandoned in hard cases in favor of a four-dimensional analysis of continuity.

  ## IV. META-ONTOLOGICAL ASSESSMENT: VERBAL VS. SUBSTANTIVE
  *In the spirit of adversarial collaboration, both parties address whether the dispute is partially verbal, specifically concerning the definition of "presence" and the locus of properties.*

  **1. The Ambiguity of "Wholly Present"**
  Both parties acknowledge a potential equivocation on the phrase "wholly present at a time."
  *   **Interpretation A (Mereological):** "Having all one's parts at $t$."
      *   *Perdurantist:* Accepts this for a temporal stage, denies it for the four-dimensional worm.
      *   *Endurantist:* Asserts this for the continuant.
  *   **Interpretation B (Identity):** "Being strictly identical across times without temporal parts."
      *   *Perdurantist:* Denies this is coherent for changing objects.
      *   *Endurantist:* Asserts this is the definition of persistence.

  **Agreement:** If the dispute rests solely on Interpretation A, it is verbal. Both agree that *something* is wholly present at $t$ (the stage for the Perdurantist, the substance for the Endurantist). The substantive disagreement lies in Interpretation B: whether strict numerical identity across time is compatible with qualitative change.

  **2. The "Secret Four-Dimensionalism" of Endurantist Criteria**
  The collaboration highlights a specific pressure regarding the Intermittent Machine (Crux ii).
  *   **The Charge:** The Perdurantist contends that in cases where spatiotemporal continuity is broken, the Endurantist cannot rely on "being wholly present" (since the object is not present during the gap). Instead, the Endurantist must rely on **causal-functional continuity criteria** to assert identity.
  *   **The Implication:** If the Endurantist defines the persistence of the machine through the gap using causal relations between pre-gap and post-gap states, their account functionally mirrors the Perdurantist's account of temporal-part unity.
  *   **Endurantist Concession:** The Endurantist acknowledges that in intermittent cases, the *evidence* for identity is causal/functional. However, they maintain this is epistemic. The *ontological ground* remains the substance itself, which has the power to go out of existence and return.
  *   **Perdurantist Counter:** The Perdurantist maintains that positing a "power to return" is an occult property that does no explanatory work beyond the causal relations themselves. If the causal relations do the work, the ontology is effectively four-dimensional, and the "substance" is a redundant label.

  **3. Final Joint Stance on Explanatory Costs**
  *   **The Endurantist Cost:** Must accept that either (a) intrinsic properties are actually relations to times, or (b) logic requires revision to allow $O$ to be $F$ and $\neg F$. In intermittent cases, they must accept that existence is not continuous, relying on primitive thisness or haecceity to bridge the gap.
  *   **The Perdurantist Cost:** Must accept that ordinary objects (people, chairs) are not the fundamental entities we perceive them to be. We are never directly acquainted with the "whole" object, only a stage. Moral responsibility must be reconstructed to apply to worms rather than strictly identical agents.

  **Signatories:**

  _________________________
  *Representative, Endurantist Working Group*

  _________________________
  *Representative, Perdurantist Working Group*
