  8.  **Final Polish:** Check the flow. Ensure the transition from the current vote to the future digest vote feels organic. Make sure the 20-inch precedent is handled carefully (it was saved, so 20 is "in"). 19 is the test.

  *(Self-Correction during drafting)*: I need to make sure Elena doesn't sound like she's just guessing. She needs to argue that the *concept* has a boundary fixed by the linguistic community's usage over time, even if the commission doesn't know exactly where it is. The 20-inch ruling wasn't lawmaking; it was a successful detection. The 19-inch might be a failed detection if they save it.

  Marcus needs to be careful not to say "We can do whatever we want." Supervaluationism says there are *admissible* precisifications. 1 inch is not admissible. 100 inches is not admissible. 19 is in the zone of admissibility.

