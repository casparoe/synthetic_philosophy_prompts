      *   *The Epistemicist's Cutoff:* Elena needs to explain the cutoff. It's not arbitrary; it's grounded in the "folk biology" of what a street tree needs to be to provide canopy.
      *   *The Supervaluationist's Vote:* Marcus needs to explain how he votes "No Truth Value." He can't. He has to pick. He picks based on the "best" precisification, acknowledging it's a choice.
      *   *The Concession:* Elena admits precedent creates reliance (pragmatic constraint). Marcus admits they can't leave it vague forever (practical necessity).
      *   *The Difference:* Elena votes based on whether the tree *is* significant (factual claim). Marcus votes based on whether preserving it is *compatible* with the ordinance (permissibility claim).
      *   *Wait, the prompt asks for a concrete difference in what they do with **this particular vote**.*
      *   If Elena thinks 19" is *false* (not significant), she votes to Grant Permit.
