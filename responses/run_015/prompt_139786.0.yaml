      *   *Idea:* Marcus votes to *Deny* (Save the tree) not because it's definitely significant, but because the "precautionary principle" fits the admissible precisifications better than cutting a borderline tree. Elena votes to *Grant* because she believes it falls on the "not significant" side of the hidden line.
      *   *Wait, check precedent:* 24, 22, 20. All preserved. So "Significant" = Preserve.
      *   If Elena thinks the line is sharp, and 20 was the edge, 19 is likely out. She votes Grant (Cut).
      *   If Marcus thinks it's indeterminate, he might vote Deny (Save) to avoid the risk of violating the "spirit" (supertruth), OR he might vote Grant because it's not *super-true* that it's significant.
      *   *Better angle:* The "Bright-line" vote next year.
      *   Let's focus the concrete difference on the *current* vote.
      *   Elena: Votes **Grant** (Cut). Reason: 20" was the last one saved. The boundary is likely between 20 and 19. We are finding the line, not moving it.
      *   Marcus: Votes **Deny** (Save). Reason: It is *admissible* to count 19" as significant. It is not *inadmissible*. Since the goal is forestry, we choose the precisification that saves the tree.
      *   *Wait, does that violate the "no amending" charter?* Marcus argues that choosing a precisification isn't amending, it's adjudicating vagueness. Elena argues that choosing a precisification *is* amending if the fact was already fixed.

      *   *Refining the "Self-Certifying" Wrinkle:*
