answer: |-
  **Setting:** *A conference room in City Hall, 4:45 PM. The Urban Forestry Commission meeting has adjourned, but two members remain at the table. The permit application for the Silver Creek Development sits between them. A photo of a 19-inch diameter silver maple is clipped to the top.*

  **Characters:**
  *   **Elena:** Epistemicist. Believes "significant size" has a sharp, unknowable boundary fixed by usage and reality.
  *   **Marcus:** Supervaluationist. Believes "significant size" is indeterminate in the borderline; truth depends on admissible precisifications.

  **Elena:** (Tapping the photo) Twenty inches. That was the Miller case last November. Twenty-two before that. Twenty-four before that. We saved them all. Now we have nineteen. I'm voting to grant the permit. The tree gets cut.

  **Marcus:** You're voting based on a hunch that the magic number is twenty?

  **Elena:** It's not a hunch, Marcus. It's the only way to comply with the Charter. We are barred from amending the ordinance. We can only apply it. "Significant size" refers to a fact about the world and our language. There is a cutoff. It might be 20.5 inches, it might be 19.8. But it exists. The last three commissions got closer to the edge. Miller at 20 inches was likely the last one inside the extension. Nineteen is outside.

  **Marcus:** That's the epistemicist leap I can't follow. You say the cutoff exists, but you admit you don't know where it is. You admit nothing in the text pins it down. So where does this sharp boundary come from? If the ordinance doesn't say "20 inches," and the biology of a silver maple doesn't change abruptly at 19.99 inches, what metaphysical magic snaps the label "significant" on at one millimeter and off at the next?

  **Elena:** It comes from the aggregate usage of the linguistic community—planners, arborists, the public—interacting with the biological reality of canopy cover. It's a complex function. Just because we can't calculate the function doesn't mean there isn't a value. If I say "heap," there is a number of grains where it stops being a heap. If I say "significant tree," there is a diameter where the ecological benefit drops below the threshold of significance. We are discovering that line, not drawing it.

  **Marcus:** But we are publishing our rulings in the Digest. Developers buy that book. Surveyors use it to stake out lots. When we ruled the 20-inch oak significant, we didn't just find a fact; we shifted the usage. The next developer reads "20 inches saved" and adjusts their expectations. Our rulings are self-certifying. If we save this 19-inch maple, the Digest effectively says "19 is significant." If we cut it, the Digest says "19 is not." We aren't just measuring the boundary; we're moving it by measuring.

  **Elena:** And that is exactly why we cannot save it. If saving this tree makes 19 inches significant in the Digest, then we have *changed* the extension of the term. We have amended the ordinance by administrative fiat. That violates the Charter. If the true boundary is 20 inches, and we rule 19 is significant, we are lying. We are issuing a false finding. I'd rather rule correctly and be accused of being harsh than rule falsely and be accused of legislating.

  **Marcus:** But that assumes there is a "true" boundary to violate. On my view, "significant size" is vague. There is a range of admissible precisifications. A rule that says "24 inches and up" is admissible. A rule that says "18 inches and up" is admissible. But "significant" is super-true only if it's true on *all* admissible precisifications. Is 19 inches significant on all of them? No. Some reasonable arborists would say 19 is too small. So it's not super-true. But it's also not super-false. It's indeterminate.

  **Elena:** Okay, so it's indeterminate. Look at the ballot, Marcus. (She slides the voting sheet over). The options are "Preserve" or "Release." There is no "Indeterminate." How does a supervaluationist cast a vote? Do you flip a coin?

  **Marcus:** I don't flip a coin. I select a precisification. Since the term is vague, the Commission is empowered to select *which* admissible precisification governs this case. That isn't amending the ordinance; it's adjudicating the vagueness inherent in the text. I'm going to vote Preserve.

  **Elena:** Why? If it's not super-true that it's significant, why preserve?

  **Marcus:** Because the ordinance's purpose is forestry protection. Among the admissible precisifications—say, anything from 18 to 22 inches as the cutoff—the one that best fulfills the legislative intent is the one that captures more trees. Saving the 19-inch maple is *compatible* with the ordinance. Cutting it is also compatible. But since we have discretion in the penumbra, we exercise it in favor of preservation.

  **Elena:** But you see the trap? If you vote Preserve, you are effectively setting the cutoff at 19 or lower. You're making law.

  **Marcus:** I'm making a decision within the law. You're the one claiming you're bound by a ghost line you can't see. Here's the real problem, Elena. Next month we vote on the Annual Digest summary. We have to decide whether to publish a bright-line number for next year. "All trees 20 inches and greater."

  **Elena:** Yes. And I will vote to publish it.

  **Marcus:** That's an amendment.

  **Elena:** No, it's a clarification. It codifies the epistemic boundary we've been tracking. If we don't publish it, developers keep guessing, and we keep having these fights.

  **Marcus:** If you publish "20 inches," you are drawing the sharp line you claim already exists. If it already exists, why do you need to draw it?

  **Elena:** Because the public has a right to know the law, even if the law relies on facts that are hard to measure. We are providing notice. What will you do? Vote against the bright line?

  **Marcus:** I'll vote for it.

  **Elena:** (Pauses) You will? But you just said drawing the line is amending.

  **Marcus:** Because leaving it vague forever is worse. Vagueness creates uncertainty for developers just as much as it does for us. If we publish "20 inches," we aren't claiming that 19.99 was never significant in the past. We are saying, "Going forward, we are sharpening the concept to resolve the indeterminacy." That is a legitimate administrative act, provided we admit it's a choice. You won't admit it. You'll tell the developers, "We didn't choose 20 inches; the universe chose it." That's dishonest.

  **Elena:** It's not dishonest if it's true. But... (She sighs) I will concede this: The Digest *does* function as law for the people relying on it. Even if I believe we are merely finding the boundary, I acknowledge that our finding alters their behavior in a way that looks like legislation. I can't ignore the reliance interest.

  **Marcus:** And I will concede this: We cannot leave the vote blank. "Indeterminate" is not an option on the ballot, and it's not an option for the tree. I have to pick a side, even if the truth value is gappy. I am not free to abstain.

  **Elena:** So, here we are. You're voting Preserve because you can choose an admissible precisification that saves the tree. I'm voting Release because I believe 19 inches falls on the false side of the actual boundary, and saving it would be a false statement of fact.

  **Marcus:** That's the concrete difference. For you, a "Preserve" vote is a lie. For me, a "Preserve" vote is a policy choice within the bounds of truth.

  **Elena:** Precisely. If I vote Preserve, I am asserting "This tree is significant." I believe that proposition is false. If you vote Preserve, you are asserting "It is admissible to treat this tree as significant." You believe that proposition is true.

  **Marcus:** So we're not just arguing about words. We're actually going to record different votes.

  **Elena:** We are. I'm marking Release. The tree comes down.

  **Marcus:** And I'm marking Preserve. The tree stays. And next year, when we publish "20 Inches" in the Digest, I'll sign off on it, but my footnote will say "Adopted Standard," not "Discovered Fact."

  **Elena:** I can live with that footnote, as long as the number gets published. (She picks up her pen). It feels wrong, though. Cutting a healthy tree because of a millimeter.

  **Marcus:** It feels wrong to me to pretend the millimeter matters more than the mandate. But... if you're right, and there is a line, then cutting it respects the rule of law. If I'm right, and there isn't, then saving it respects the rule of nature.

  **Elena:** Let's hope the Mayor doesn't ask us to explain the philosophy behind the minutes.

  **Marcus:** (Smiling slightly) I'll draft the explanation. I'm better at making the indeterminate sound reasonable.

  **Elena:** And I'll draft the legal citation. I'm better at making the arbitrary sound binding.

  *(They both pick up their pens and mark the ballot.)*
