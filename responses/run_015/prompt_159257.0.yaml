answer: |-
  Your guess is correct, but it is only the first layer of the onion. The standoff is indeed verbal (an equivocation on the word "computable"), but it is sustained by substantive disagreements about the relationship between mathematics and physics, and bedrock intuitions about what counts as an "explanation."

  Here is the fuller diagnosis, the verdict on your preprint scenario, and a strategy for writing about this without getting torn apart.

  ### 1. The Diagnosis: Three Theses, One Name

  The reason your correspondents talk past each other is that "The Church–Turing Thesis" (CTT) is a portmanteau for three distinct claims. When they argue, they are defending different territories.

  1.  **The Mathematical Thesis (CTT-M):** *Informal effective calculability is co-extensive with Turing-computability.*
      *   **Status:** Conceptual/Analytic.
      *   **Defense:** This is about pinning down a fuzzy human intuition ("what a human can calculate with pencil and paper") to a formal model. Since Turing's analysis of the "human computer" is widely accepted as exhaustive of that intuition, this thesis is treated as a definition. To deny it is to change the subject.
      *   **The Correspondent:** The first emailer. They view "computable" as a term of art defined by the model.

  2.  **The Physical Thesis (CTT-P):** *Every physical process can be simulated by a Turing machine.*
      *   **Status:** Empirical/Synthetic.
      *   **Defense:** This is a claim about the laws of nature. It says the universe does not contain "oracles." It is falsifiable in principle (e.g., by finding a physical system that solves the Halting Problem).
      *   **The Correspondent:** The second emailer. They view "computable" as "physically realizable."

  3.  **The Cognitive Thesis (CTT-C):** *The brain (or mind) is a Turing machine.*
      *   **Status:** Hypothesis in cognitive science.
      *   **Defense:** This is often conflated with CTT-P, but it's distinct. Even if the universe allows hypercomputation (violating CTT-P), the brain might not be able to access it.
      *   **The Correspondent:** The third emailer. They are asking about the *relevance* of the concept to biology.

  **The Substantive Disagreement:**
  It is not merely verbal. The standoff persists because the two main camps hold incompatible **normative standards**:
  *   **The Mathematicians/Logicians** treat CTT as a *normative* boundary. It defines what counts as an algorithm. If your physical device solves the Halting Problem, they say, "You haven't found a new algorithm; you've found a physical oracle." They protect the concept of *effective procedure* (step-by-step, finite, surveyable) from being contaminated by physics.
  *   **The Physicists/Naturalists** treat CTT as a *descriptive* boundary. They believe mathematical concepts should ultimately ground out in physical reality. If physics allows "supertasks" (infinite steps in finite time), they argue our mathematical definition of computation is too narrow for the universe we inhabit.

  **The Bedrock Intuitions:**
  *   **Platonism vs. Naturalism:** The first camp assumes mathematical truth is independent of physical law. The second assumes math is a model of physical law.
  *   **Finitism:** The first camp has a deep intuition that "real" computation must be discrete and finite at every step. The second camp is willing to accept continuous variables or relativistic spacetimes that allow infinite density of operations.

  ### 2. The Preprint Scenario: The "Million State" Trap

  You asked: *Suppose a device settles whether any TM with < 1 million states halts, using unbounded computation in finite time. Does that refute anything?*

  **Verdict:** Both sides will feel vindicated, and you are right to worry. Here is exactly how the post-mortem will play out.

  **The Trap:**
  Technically, the Halting Problem for a *finite* set of machines (those with < 1 million states) is **already Turing-computable**. There are a finite number of such machines. You can hard-code the answers into a lookup table. A standard Turing Machine can compute this function.

  **The "Physics" Victory:**
  The proponents of the device will argue: "The *mechanism* matters." If the device works by performing a supertask (e.g., accelerating a particle so it completes infinite oscillations in finite proper time, a la Malament-Hogarth spacetimes), then the *physics* allows hypercomputation. Even if they only demo it on a finite subset for engineering reasons, the *principle* refutes CTT-P. They claim victory because they showed the laws of physics permit operations a TM cannot structurally perform (infinite steps).

  **The "Math" Victory:**
  The definitionalists will say: "You have built a fast calculator, not a hypercomputer." Since the input/output mapping is computable by a TM (because the domain is finite), the device computes a computable function. The fact that it uses "unbounded computation" internally is an implementation detail, like using an analog circuit to solve a linear equation faster than a digital chip. It does not expand the class of *computable functions*. They claim victory because the extension of the concept "computable" remains unchanged.

  **Why this proves the standoff is entrenched:**
  This scenario reveals that the two sides are measuring different things.
  *   **Side A measures Input/Output.** (Function theoretic)
  *   **Side B measures Mechanism/Causality.** (Physical theoretic)

  If your preprint authors claim their device solves the Halting Problem for *arbitrary* TMs (infinite domain) in finite time, they refute CTT-P decisively. But CTT-M defenders will simply retreat to: "Then it's not an 'effective procedure,' so it's not 'computation' in the mathematical sense. It's physics, not math."

  ### 3. What Counts as Progress?

  Do not tell your readers to expect a resolution. There will not be one, because the disagreement is about **taxonomy**, not truth. However, you can offer progress by enforcing **terminological hygiene**.

  **1. Distinguish CTT-M from CTT-P explicitly.**
  When you write, never use "The Church-Turing Thesis" without a modifier.
  *   If discussing algorithms, logic, or definability, use **"The Mathematical Church-Turing Thesis."** Make it clear this is about the limits of *symbol manipulation*.
  *   If discussing physics, cosmology, or hypercomputation, use **"The Physical Church-Turing Thesis."** Make it clear this is a conjecture about *nature*.
  *   *Progress:* Acknowledging that CTT-P could be false while CTT-M remains true. (i.e., The universe might be hypercomputational, but "algorithms" are still Turing-bound).

  **2. Shift the Question from Computability to Complexity.**
  The most fertile ground right now isn't "Can it be computed?" (Yes/No), but "At what cost?"
  *   The **Extended Church-Turing Thesis (ECTT)** claims that any reasonable physical model of computation can be simulated by a probabilistic Turing machine with *polynomial overhead*.
  *   Quantum computing challenges *this* thesis (BQP vs BPP), not the original CTT.
  *   *Progress:* Framing the debate around complexity classes is less prone to semantic quibbles. It moves the fight from "What is computation?" to "How hard is physics?"

  **3. Address the "Effective Procedure" Intuition.**
  For your readers, the key intuition to highlight is **surveyability**.
  *   The Mathematical Thesis rests on the idea that a computation must be checkable by a human in finite steps.
  *   The Physical Thesis rests on the idea that the universe evolves according to laws.
  *   If a device gives you the answer to the Halting Problem via a "black box" physical relaxation, the Math side rejects it as a *computation* because you cannot verify the steps. You only trust the output. This distinction (verification vs. outcome) is the bedrock of the disagreement.

  ### 4. Advice for your Column

  When you explain this to readers, do not try to adjudicate who is right. Instead, map the disagreement as a feature of the landscape.

  **Suggested Narrative Arc:**
  1.  **The Confusion:** Start with the emails you receive. Acknowledge that smart people disagree.
  2.  **The Split:** Explain that "Computation" is doing double duty. It is both a **mathematical definition** (like "prime number") and a **physical description** (like "energy").
  3.  **The Consequence:** If CTT-P is false (physics allows hypercomputation), mathematics doesn't break, but our understanding of the universe does. We would live in a universe where some truths are physically accessible but logically unprovable by algorithm.
  4.  **The Preprint:** Use your hypothetical device example. Show how the Mathematician says "Nice box" and the Physicist says "New Laws." Conclude that both are right within their own domains.
  5.  **The Takeaway:** The Church-Turing Thesis is not a law of nature waiting to be discovered; it is a boundary line we drew between logic and matter. The fight is about whether that line should move.

  **Final Verdict:**
  Tell your readers to expect no resolution because the dispute is not about evidence, but about **stipulation**. The "Math" side refuses to let physics define logic. The "Physics" side refuses to let logic constrain reality. Both positions are defensible, but they are playing different games. Your job is not to declare a winner, but to ensure the scoreboard keeps track of which game is being played.
