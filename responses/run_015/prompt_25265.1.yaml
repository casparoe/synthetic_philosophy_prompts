answer: |-
  **Radical Translation**

  The humidity in the observation blind was ninety-eight percent. It clung to Dr. Aris Thorne's skin like a second, unwanted uniform. Outside the thick polymer glass, the landscape of Aethelgard was a wash of bruised purples and greys, lit by the dim, red eye of the local dwarf star.

  Aris tapped his stylus against the tablet. The translation matrix blinked a steady, mocking amber. *Confidence: 42%.*

  "Again," Aris said, his voice sounding thin in the recycled air.

  The Informant sat opposite him. It was humanoid enough to trigger the uncanny valley, but wrong in the geometry. Its limbs were too long, its joints hinged in places bones shouldn't bend. It had no eyes, only smooth, light-sensitive patches along its cranium. It didn't speak so much as vibrate, producing sound through a series of chest cavities.

  Aris picked up the object from the table. It was a local organism, roughly the size of a melon, covered in soft, pulsing spines. It was alive, twitching slightly in his grip.

  He held it up. "This," Aris said, enunciating slowly. "What is this?"

  The Informant tilted its head. The chest cavities fluttered. *"Kesh."*

  Aris logged it. *Kesh: Noun. Object. Organic.*

  He took a scalpel from his kit. He didn't want to hurt the thing, but Quine's ghost was haunting him. He needed to know where the word ended and the world began. He sliced off one of the pulsing spines. It writhed on the table, separate from the main body.

  Aris pointed to the spine. "This?"

  *"Kesh,"* the Informant vibrated.

  Aris pointed to the main body, now bleeding a clear, viscous fluid. "This?"

  *"Kesh."*

  Aris pointed to the two of them together. "This?"

  *"Kesh."*

  Aris leaned back, wiping sweat from his brow. "Okay. Okay. It's not the object. It's the substance? Or the undetached part?"

  He tried a different angle. He waited. The spine stopped writhing. It was dead.

  He pointed to the dead spine. "This?"

  The Informant went silent. The light patches on its head dimmed. Then, a low, dissonant thrum. *"Kesh-va."*

  "Va," Aris muttered. "Suffix. Past tense? Or... cessation?"

  He pointed to the living body. *"Kesh."*
  He pointed to the dead spine. *"Kesh-va."*

  "Right," Aris said, feeling a spark of triumph. "So *Kesh* is the living process. Not the matter. Not the shape. The *happening*."

  He logged the update. The matrix hummed. *Confidence: 44%.*

  The amber light didn't turn green.

  "Fifty years of linguistics," Aris whispered to the glass. "And I can't name a fruit."

  The Informant shifted. It reached out a long, slender finger and touched the surface of the polymer glass, right where Aris's reflection was visible. It traced the outline of Aris's face.

  *"Kesh,"* the Informant said.

  Aris froze. "Me?"

  The Informant tapped the glass again, over Aris's hand. *"Kesh."*

  It tapped the table. *"Kesh."*

  It tapped the air between them. *"Kesh."*

  Aris felt a cold prickle run down his spine. "No. That's not right. We established *Kesh* is a living process. The table isn't alive. The air isn't alive."

  The Informant rotated its head. The vibration changed pitch, becoming sharper, almost like a warning. *"Kesh. Kesh. Kesh."*

  It pointed to Aris's coffee mug, sitting cold on the desk. *"Kesh."*

  It pointed to the scar on Aris's left forearm. *"Kesh."*

  "It means everything?" Aris asked, his voice rising. "It means 'existence'? If *Kesh* means 'existence', then the translation matrix should have caught that from the semantic field density."

  *Confidence: 39%.* The number dropped.

  Aris stood up, pacing the small blind. "It's not a noun. It's not a verb. It's... what? A pointer? A deictic marker?"

  He stopped in front of the Informant. "Show me. Show me what is *not* Kesh."

  The Informant sat perfectly still. The light patches on its head went dark. The chest stopped vibrating.

  "Is it nothing?" Aris pressed. "Is *Kesh* the set of all things?"

  The Informant remained silent. The absence of sound was heavier than the humidity.

  Aris looked down at his own hands. He flexed his fingers. They moved. He was a biological process. *Kesh.*
  He looked at the scalpel. Metal. Static. But the Informant had called it *Kesh*.
  He looked at the dead spine on the table. Decaying. Changing state. *Kesh.*

  "It's not the object," Aris realized, the thought landing like a stone in his gut. "It's not the substance. And it's not just the life."

  He looked at the Informant. "It's the interaction. It's the *boundary*."

  He grabbed the scalpel and pressed it against his own palm. Not enough to cut, just enough to feel the pressure. The point where metal met skin. The interface.

  *"Kesh,"* the Informant whispered immediately.

  Aris pulled the scalpel away. The contact ended.

  He pointed to the space where the contact had been. "This?"

  *"Kesh-va,"* the Informant said.

  Aris dropped the scalpel. It clattered on the floor.

  "It's not reference," Aris said, his breath hitching. "You don't have nouns. You don't have objects. You don't see 'things'. You see... events. Collisions. Relationships."

  He looked around the room. The chair wasn't a chair; it was a support-event between his body and gravity. The glass wasn't a wall; it was a separation-event between the inside and the outside.

  There were no rabbits. There were only rabbitings.
  There were no people. Only person-stages.

  "If I stop moving," Aris whispered, "if I stop interacting... do I stop being *Kesh*?"

  The Informant did not answer. It simply existed, a node in a web of vibrations.

  Aris looked at his reflection in the dark polymer glass. He saw a man, tired, sweating, terrified. He raised his hand to touch the glass.

  But he stopped inches away.

  If he touched it, it was *Kesh*. A contact event.
  If he didn't touch it, what was he?

  He looked at the translation matrix. *Confidence: 12%.*

  The numbers were falling because the premise was wrong. He was trying to map a world of islands onto a world of ocean. He was trying to find the nouns in a language that only had verbs.

  But the horror wasn't the language. The horror was the implication.

  If the Informant's perception was valid—if reality was truly just a web of interactions without discrete objects—then Aris didn't exist when he wasn't being perceived. When he closed his eyes, did the room vanish? When the Informant looked away, did Aris dissolve into *Kesh-va*?

  He looked at the Informant. "Do you see me?"

  The Informant turned its smooth face toward him. *"Kesh."*

  Aris backed away until he hit the rear bulkhead. He hugged his knees to his chest. He needed to be small. He needed to minimize his surface area. Minimize the interactions.

  If *Kesh* was the contact, then silence was safety. Stillness was safety.

  He closed his eyes. He held his breath. He tried to stop his heart from pounding, to stop the blood rushing in his ears. He tried to cease the event of being Aris Thorne.

  In the darkness behind his eyelids, he heard the Informant stand up. The vibration of its movement traveled through the floor, up through Aris's spine.

  *"Kesh,"* the Informant said.

  Aris squeezed his eyes shut tighter. He wasn't there. He wasn't there. He was just a stage. A temporal slice. A rabbit-ing.

  *"Kesh,"* the voice came again, closer.

  Aris opened his eyes. The Informant was standing over him. It reached down.

  Aris flinched, but he didn't move away. He watched the long fingers approach. He watched the space between the alien hand and his own cheek collapse.

  The moment they touched, the translation matrix on the desk chimed.

  *Confidence: 100%.*
  *Translation: Contact.*
  *Translation: Pain.*
  *Translation: Now.*

  The Informant's fingers dug in. Not to hurt. To verify.

  *"Kesh,"* it vibrated.

  Aris looked at his own hand, resting on his knee. He stared at the skin, the pores, the hair. It looked solid. It looked like a thing. But he could feel the hum of the station beneath him, the heat of the alien hand on his face, the terror in his chest.

  He realized he would never be able to pick up a cup of coffee again without wondering if he was holding the object, or the undetached part of the holding, or the stage of the cup before it shattered.

  He looked at the Informant. "What happens," Aris asked, his voice trembling, "when the contact ends?"

  The Informant withdrew its hand. The warmth vanished from Aris's cheek. The connection severed.

  *"Kesh-va,"* the Informant said.

  And in the sudden silence of the blind, Aris Thorne was no longer sure if he was the one who had been left behind, or if he was the one who had ceased to be.
