  **Aeterna Indemnity Ltd. | Policy Form F-4D-REV3 | Forma-Shape Content Coverage**

  **1. Definitions of Insured Interest**
  The "Substrate" refers to the constituent programmable matter particles comprising the Forma unit regardless of arrangement. The "Configuration" refers to the specific spatial arrangement of the Substrate designated by the Policyholder as having functional or aesthetic value (e.g., "Chair," "Lamp," "Bust of Marcus Aurelius"). The Policyholder must declare whether the Substrate and Configuration are identical, distinct but coincident, or if only the Substrate exists.

  **2. Constitution and Identity Coverage**
  Coverage is limited to the ontological status declared at inception. If the Policyholder asserts the Constitution View (that Substrate and Configuration are distinct entities occupying the same region), separate sums insured must be assigned to each. Loss of Configuration (e.g., squashing) while Substrate remains intact constitutes a total loss of the Configuration only. If the Policyholder asserts the Identity View, no payout is issued for rearrangement unless the Substrate is dispersed. Misdeclaration of ontological status voids the policy ab initio.

  **3. Coincidence Surcharge**
  Where distinct entities are declared coincident, a Dual-Occupancy Surcharge of 100% applies to the base premium. This surcharge covers the increased statistical probability of Leibnizian divergence. Policyholders scheduling multiple coincident candidates (e.g., "Statue," "Clay," "Artifact") must pay per candidate. Failure to schedule a coincident entity results in denial of claims pertaining to that entity's specific persistence conditions.

  **4. Temporal Extent and Slicing**
  Under the Perdurantist Endorsement, the Insured Item is defined as a four-dimensional spacetime worm composed of instantaneous temporal parts. Claims must specify the exact temporal slice destroyed. Loss of a future slice (e.g., prevention of planned rearrangement) is not covered. Loss of a past slice is ineligible. Coverage applies only to the present temporal part unless the "Continuous Existence" rider is purchased, which warrants continuity of psychological or functional connectedness across stages.

  **5. Ontological Minimalism Rider**
  Policyholders adhering to Mereological Nihilism (the view that only simple particles exist, not composite objects) may insure only the Substrate particles individually. Premiums are reduced proportionally to the denial of composite existence. However, claims must demonstrate loss of individual particles rather than loss of arrangement. Proof of loss requires particle-level tracking logs. Aeterna Indemnity reserves the right to deny claims based on the assertion that the "lost" composite never existed to be lost.

  **6. Continuity and Replacement Thresholds**
  Gradual replacement of Substrate particles is permitted up to a threshold of 15% per diem without breaking continuity of identity. Exceeding this threshold triggers a "Theseus Event," wherein the Insured Item is deemed a new entity requiring re-underwriting. If replacement occurs gradually below the threshold but totals 100% over the policy period, coverage persists only if functional continuity is maintained. If both original and reassembled Substrate claimants emerge, payout is prorated at 50% pending ontological arbitration.

  **7. Vagueness and Sorites Proration**
  In cases of borderline destruction (e.g., the Configuration is 40% squashed), payout is calculated based on the degree of truth of the proposition "The Configuration is destroyed." Aeterna Indemnity employs fuzzy logic adjusters to determine the truth value. For Problems of the Many (where multiple overlapping candidate objects exist due to vague boundaries), the loss is divided equally among all viable candidates exceeding the existence threshold.

  **8. Biological Emergence Exclusion**
  If the Forma rearranges itself into a living organism capable of metabolism or reproduction, the Substrate is immediately reclassified as "Livestock" or "Dependent," voiding contents coverage. If the organism claims rights, the Policyholder is liable for back-premiums on life insurance. If the organism is philosophically zombie-like, standard contents coverage applies, subject to proof of consciousness.

  **9. Claims Procedure and Ontological Audit**
  All claims require an Ontological Audit. The Policyholder must submit a metaphysical justification for why the loss constitutes destruction rather than rearrangement. Aeterna Indemnity reserves the right to appoint a Special Master of Metaphysics to determine if the distinction claimed makes a difference to liability. If the distinction is deemed purely semantic, the claim is denied on grounds of non-justiciability. If the distinction is deemed real, the Dual-Occupancy Surcharge is applied retroactively.

  ***

  **Commentary**

  The policy translates abstract metaphysical commitments into actuarial liabilities. Clause 2 targets the Constitution View, forcing the insurer to treat the statue and clay as distinct assets because they have different persistence conditions. The humor relies on the fact that while philosophers accept distinctness based on modal properties, insurers require distinctness to justify distinct payouts. Clause 3 satirizes Perdurantism (temporal parts); if objects are sums of time-slices, insurance should logically cover specific slices rather than enduring wholes. Clause 5 addresses vagueness and the Problem of the Many by introducing fuzzy logic payouts, mocking the inability of classical logic to handle borderline existence without arbitrary cutoffs.

  The exaggeration is fair insofar as it treats ontological categories as commercial categories. A defender of the Constitution View might object that constitution is not a commercial relation; one cannot buy "statuehood" separately from "clayhood" because value resides in the utility, not the metaphysics. However, the policy highlights that if the metaphysics dictates different survival conditions, it must dictate different risk profiles. Clause 9 delivers the reductio: the industry eventually charges for the distinction itself via the "Ontological Audit." The satire lands not by denying the metaphysics, but by showing that if these distinctions are real, they must be billable. If they are not billable, the suspicion arises that they are not real enough to ground the theoretical weight placed upon them.
