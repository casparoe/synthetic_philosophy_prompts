answer: |-
  The phenomenon of acting against one's better judgment, known since antiquity as *akrasia* or weakness of will, remains a central puzzle in the philosophy of action. It challenges the Socratic intellectualist thesis that knowledge of the good is sufficient for right action. In contemporary discourse, this puzzle is often revisited through the lens of behavioural economics, specifically via the model of hyperbolic discounting. While Aristotle offers a moral-psychological account grounded in the failure to activate practical knowledge, behavioural economics provides a quantitative model of time-inconsistent preferences. This essay compares these two frameworks, arguing that while hyperbolic discounting successfully predicts the pattern of weak-willed action, it risks merely redescribing the failure of rational agency in quantitative terms rather than explaining its normative structure. Furthermore, it will be contended that institutional cooling-off mechanisms, favoured by behavioural economists, presuppose a fragmented diachronic self that sits uneasily with the Aristotelian conception of character unity, though they may find limited reconciliation if viewed as scaffolding for habituation.

  Aristotle's analysis in the *Nicomachean Ethics* locates *akrasia* not in a lack of knowledge, but in a failure to exercise it. He employs the model of the practical syllogism to elucidate this distinction. The rational agent operates with a universal major premise (e.g., 'Sweet things should be avoided') and a particular minor premise (e.g., 'This is a sweet thing'). In the *enkratic* (self-controlled) agent, reason successfully synthesises these premises to produce the conclusion: action avoiding the sweet thing. The *akratic* agent, however, possesses the universal knowledge but fails to attend to the particular premise in the moment of action. Aristotle suggests that appetite (*epithumia*) does not destroy the knowledge but renders it inert, analogous to the state of a sleeper, a madman, or a drunkard reciting verses of Empedocles without understanding them. The knowledge is present as a disposition (*hexis*) but is not active (*energeia*). Thus, for Aristotle, weakness of will is a cognitive failure induced by affect; the agent's perception of the particular situation is clouded by passion, preventing the practical syllogism from reaching its logical conclusion. The failure is internal to the architecture of rational agency itself.

  In contrast, the behavioural-economic account utilises the model of hyperbolic discounting to explain preference reversal. Standard rational choice theory assumes exponential discounting, where an agent's preference between two rewards remains consistent regardless of how far in the future they are. Hyperbolic discounting posits that agents discount the future at a rate that declines over time, leading to a disproportionate valuation of immediate gratification. Consequently, an agent may prefer a larger, later reward at time $t_1$, but as $t_1$ approaches and the smaller, sooner reward becomes immediate, the preference reverses at time $t_2$. Here, *akrasia* is modelled as a conflict between different temporal stages of the agent. The failure of rational agency is not described as a clouding of perception or a failure to synthesise premises, but as a mathematical inconsistency in the utility function over time. The will is not weak because reason is clouded, but because the weight of the present moment mechanically outweighs the weight of the future.

  This divergence raises the question of whether hyperbolic discounting genuinely explains the failure of rational agency or merely redescribes it. To explain *akrasia* philosophically is to account for how an agent can intentionally act against what they judge to be best. Aristotle addresses this by modifying the concept of intentionality; the *akratic* acts intentionally but not deliberately, as the deliberative process was interrupted by appetite. Behavioural economics, however, often sidesteps the phenomenology of agency. By reducing the conflict to a curve of discounting, it quantifies the *outcome* of the weakness without illuminating the *experience* of the failure. It tells us that the preference changed, but it does not tell us why the agent identifies with the long-term preference as their 'true' will rather than the short-term impulse.

  If the agent at $t_2$ genuinely prefers the immediate reward more than the future one, in what sense is this a failure of rationality? It is only a failure if one presupposes that the $t_1$ preference is normative over the $t_2$ preference. Hyperbolic discounting describes the mechanism of the reversal, but it cannot justify why the agent *ought* to honour the past self's plan without importing a normative framework external to the model itself. Therefore, it risks being a sophisticated redescription. It maps the topology of the weakness but leaves the normative landscape of agency unexplored. Aristotle, conversely, embeds the explanation within a normative teleology; the failure is a deviation from the function of a rational being. While Aristotle's account is less predictive than the economic model, it is conceptually richer regarding the nature of the agency being compromised.

  This conceptual divergence becomes stark when considering remedies for weakness of will, specifically institutional cooling-off mechanisms. Behavioural economics often advocates for 'nudges' or pre-commitment devices, such as mandatory waiting periods for purchases or automatic enrolment in savings schemes. These mechanisms are designed to protect the long-term 'Planner Self' from the short-term 'Doer Self'. This approach presupposes a diachronic conception of the self that is fundamentally fragmented. It treats the future self almost as a stranger whose interests must be protected from the present self by external constraints. The rationality here is procedural and protective, relying on architecture to bypass the agent's volatile will.

  Aristotle would likely view such external mechanisms with suspicion, though not necessarily outright rejection. For Aristotle, the unity of the self is maintained through character (*hexis*). Virtue is a state of the soul where reason and desire are harmonised. To rely on external cooling-off periods is to admit a failure of internal harmonisation. If the agent requires a law or a contract to prevent them from acting on appetite, they have not achieved the moral maturity where the correct practical syllogism is exercised effortlessly. However, Aristotle does not demand that the virtuous agent emerge fully formed. He acknowledges the role of habituation and law in shaping character. In the *Politics*, he suggests that legislation is necessary to habituate citizens towards virtue.

  Therefore, a reconciliation is possible if cooling-off mechanisms are viewed not as permanent prosthetics for a fragmented self, but as temporary scaffolding for habituation. If a cooling-off period helps an agent pause long enough for reason to re-engage with the particular premise, it mimics the function of the *enkratic* struggle, potentially aiding the transition toward virtue. However, if these mechanisms are treated as permanent substitutes for self-governance, they presuppose a diachronic self that Aristotle would reject. Aristotle's self is diachronically unified through responsibility; I am responsible for my past actions because they formed the character that acts now. The behavioural economic model often implies that the 'past self' and 'present self' are distinct agents with conflicting utility functions, thereby diluting the strict moral responsibility Aristotle insists upon. For Aristotle, there is no 'Doer Self' to be managed; there is only the agent who has failed to cultivate the disposition to act well.

  In conclusion, the comparison between Aristotle and behavioural economics reveals a tension between normative explanation and quantitative description. Aristotle's account of the practical syllogism preserves the integrity of rational agency by locating *akrasia* in the temporary suspension of cognitive activity by appetite. It explains *why* the action is irrational in terms of human function. Hyperbolic discounting, while empirically robust, offers a mechanistic account that quantifies the preference reversal but struggles to explain the normative authority of the long-term plan without begging the question. Regarding institutional interventions, cooling-off mechanisms can only be reconciled with Aristotelian ethics if they are understood as aids to internal habituation rather than acknowledgements of a permanently fragmented self. Ultimately, while behavioural economics provides the tools to manage the symptoms of weakness of will, Aristotle provides the conceptual framework necessary to understand what is at stake in the failure of the will itself.
