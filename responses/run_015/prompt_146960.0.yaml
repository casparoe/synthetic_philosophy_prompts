prompt: |-
  I'm on the Riverside Park redesign board. There's a crumbling brick wall from about 1923 in teh middle of the green; the original records were destroyed in a flood, so nobody knows it's purpose — maybe a property line, maybe a flood barrier, maybe decorative. The mayor wants it demolished by March to open sightlines for a new community center. A resident group is citing Chesterton's fence, saying don't tear down what you don't understand, and invoking Burke's idea that long-standing practices carry a kind of implicit wisdom rational planners can't just rebuild from scratch. The board votes Thursday. Draft the memo I should circulate: recommend a specific course — demolish, preserve, or preserve with a cut-through path — with a timeline, and lay out the reasoning. Take teh fence/prescription argument seriously, not dismissively, but also face teh strongest argument on teh other side: that leaving a useless barrier splits teh park and hurts accessibility. One member floated a weird idea — that the wall might be a silent prescription, valued not because anyone actively chooses it, but because teh community has repeatedly failed to organize its removal, which could be read as Burke's negative consent made physical. I don't fully buy it, but I want teh memo to ask whether preserving something for unknown-unknown reasons is a defensible institutional stance or just mysticism. Keep it focused and actionable; no reading lists or citations.
