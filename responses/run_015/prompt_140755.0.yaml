answer: |-
  This is a remarkably precise dissection of a classic bioethical impasse. You have effectively reconstructed the debate between Ronald Dworkin (who argued for the authority of "precedent autonomy" and critical interests) and Rebecca Dresser (who argued for the primacy of the current incompetent self's experiential welfare).

  You are asking for a diagnosis of the stalemate. Here is the assessment:

  ### 1. The Diagnosis: It is a Normative Clash, Not a Verbal One
  This is not a verbal dispute. You and your friend are using the word "autonomy" to point to two distinct moral phenomena that usually travel together but have come apart in this specific case.

  *   **Your Conception (Autonomy as Integrity):** You view autonomy as a **narrative power**. A life is a single project, and the competent self has the authority to determine the shape of that project's conclusion. On this view, dignity is an objective value tied to the coherence of the life story, which can be violated even if the protagonist is unaware of the violation.
  *   **Your Friend's Conception (Autonomy as Welfare-Proxy):** Your friend views autonomy as a **protective mechanism for welfare**. The reason we respect past directives is that the past self is the best epistemic access point to the patient's values. However, if the *outcome* (the current welfare of the sentient being) visibly contradicts the *prediction* (the directive), the mechanism has failed its purpose. On this view, dignity is subjective and experiential; you cannot violate the dignity of someone who feels no violation.

  **Which formulation is doing illegitimate work?**
  Your phrase: *"the exercise of that power is not answerable to how things turn out for the self who later inherits it."*
  This is not illegitimate in the sense of being nonsense, but it is **question-begging** in the context of this argument. It asserts a deontological constraint (the right to bind) that trumps a consequentialist evaluation (the good of the result). Your friend rejects the premise that such a constraint exists independently of welfare. To assert it as a premise guarantees the stalemate because it is the very point in dispute.

  ### 2. The "Revocation" Case: The Leak in Your Armor
  The variant you constructed (the competent revocation during moderate dementia) is the most diagnostic part of your letter. It reveals a tension in your own position that you sensed but could not articulate.

  *   **Your Friend's Consistency:** Her position is consistent. The competent self's current will is the best evidence of values. If there is a conflict between Competent Self (Time 1) and Competent Self (Time 2), Time 2 wins because it is closer to the event and potentially better informed. If there is a conflict between Competent Self (Time 2) and Incompetent Self (Time 3), Competent Self wins because capacity governs.
  *   **Your Inconsistency:** You agree the later revocation wins. Why?
      *   If it wins because it is *later*, you have conceded temporal priority, which you said you didn't care about.
      *   If it wins because the later self had *more information* ("lived two years inside that future"), then you have conceded that the authority of the advance directive is **epistemic**, not **normative**. You are admitting the directive binds only insofar as it accurately predicts the good.
      *   If you admit the directive binds only insofar as it predicts the good, then in the *original* case (where the prediction seems "wrong" because the mother is content), you should agree with your friend.

  **The Stalemate Source:** You want the earlier self to have **metaphysical authority** (the power to bind), but you want the later self to have **epistemic authority** (the power to revoke based on new experience). You cannot have both without a principle that explains why the earlier self's metaphysical authority survives the loss of competence, but the later self's epistemic authority kills it.

  ### 3. The Empirical/Institutional Layer
  You asked if a disguised empirical question is doing the work. **Yes.**
  This philosophical stalemate is calcified by clinical heuristics.

  *   **The Friend's Heuristic:** In geriatric psychiatry, the "Happy Demented" patient is a known phenotype. Clinicians see families project their own horror onto patients who are, in fact, content. The friend is likely leaning on an empirical generalization: *Families and past selves systematically overestimate the misery of dementia.* She fears **undertreatment** based on a hypothetical horror.
  *   **Your Heuristic:** You are likely leaning on the institutional reality that once artificial nutrition starts, it is never stopped. You fear **overtreatment** and the "technological imperative." You know that if the directive is treated as "evidence" rather than "binding," the default will always be to treat, because treating is defensible and letting die is litigable.

  If you could prove to her that honoring the directive *would not* lead to a slippery slope of neglecting current comfort, or if she could prove to you that current contentment is a more reliable metric of "good" than past values, the philosophical gap would narrow. But currently, you are both using philosophy to justify risk management strategies.

  ### 4. What Counts as Progress?
  You will not resolve this by finding a philosophical knockout. The disagreement is about **Risk Allocation**.

  *   **Your Risk:** That your mother lives a life she deemed undignified, turning her into an object contrary to her will.
  *   **Her Risk:** That your mother is denied care she is currently enjoying, based on a fear she no longer holds.

  **Progress requires shifting the question from "Who is right?" to "Which error is less reversible?"**

  1.  **Distinguish the "Ulysses Contract":**
      Progress lies in categorizing the directive. Is this a *medical instruction* (e.g., "I am allergic to penicillin") or a *Ulysses Contract* (e.g., "Tie me to the mast even if I beg to be released")?
      *   Your friend treats ADs as medical instructions (defeasible by current condition).
      *   You treat ADs as Ulysses Contracts (binding specifically *because* the future self will disagree).
      *   **Action:** If you can argue that the specific intent of *this* directive was Ulysses-style (to prevent exactly this scenario of "contented degradation"), you move the burden of proof. Most standard ADs are not drafted this way.

  2.  **The "Threshold of Discontinuity":**
      You both accept reductionist identity. You need to argue about the *degree* of discontinuity.
      *   In the JW case, the psychological continuity is high (lucid deconversion).
      *   In your mother's case, the psychological continuity is low (severe dementia).
      *   **Paradox:** Usually, low continuity supports *your* view (the current being is almost a different person, so the past person's will should govern). But your friend argues low continuity supports *her* view (the current being is a new entity with its own welfare rights).
      *   **Progress:** Acknowledge that on a reductionist view, the "current self" has moral standing *because* she is sentient, even if she isn't the same "person." The fight is about the weight of that standing vs. the past person's rights.

  3.  **Abandon the "Binding" Language:**
      The word "bind" is the obstacle. It implies a legalistic obligation that ignores the moral reality of the suffering (or non-suffering) creature in the bed.
      *   **Reformulation:** Instead of "The directive binds," try "The directive creates a **presumption of harm**."
      *   Argue that feeding her artificially is not "keeping her alive" but "prolonging a state she defined as a living death." Even if she is content, *you* (the moral agent) are complicit in a state she defined as unacceptable. This shifts the burden to your friend: Can she justify *your* complicity in a violation of integrity?

  ### Summary Recommendation
  The stalemate is real because you are arguing from **Integrity** (the shape of the life) and she is arguing from **Benevolence** (the state of the organism).

  *   **Do not** try to prove she is wrong about identity or welfare; you agree on those facts.
  *   **Do** acknowledge that your "Revocation" intuition undermines your "Binding" intuition. If a later competent self can revoke, then authority rests on *competence*, not *temporal priority*.
  *   **Do** pivot to the **Institutional Reality**. Ask her: "If we treat this directive as defeasible evidence, do we not guarantee that it will be defeated in every marginal case by the bias toward treatment?"
  *   **Accept** that this may be a "bedrock intuition" clash. If so, the only resolution is procedural: Who is the designated surrogate? If you are the proxy, your view prevails (ethically and usually legally). If you are disputing with a clinician, the law generally favors the directive (Dworkin's view is closer to current US law than Dresser's is), but clinical culture favors the friend.

  The progress you seek is not a philosophical synthesis, but a clear acknowledgment that you are weighing **Past Integrity** against **Present Contentment**, and that no amount of empirical data can tell you which weight is heavier. That is a value judgment, not a medical one.
