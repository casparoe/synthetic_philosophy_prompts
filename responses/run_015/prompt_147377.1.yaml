  | **C. Pragmatic-Choice-Only** | Reference is indeterminate everywhere; we simply choose the manual that is most useful for prediction. There is no "fact of the matter" to pin down. | **Medium Fit.** She calls the manual difference "uninteresting," which sounds pragmatic. However, she still treats the *elimination* of options (via correction) as a genuine reduction of indeterminacy, implying some facts *can* be established behaviorally. |

  **Best Fit:** **Rule A (Explicit-Behavioral-Correction).**
  Her stance relies on the presence of *negative evidence* (correction/refusal) to carve out the boundaries of a term. Without a feedback loop that normatively rejects a specific application, the reference remains behaviorally underdetermined.

  ### 2. Prediction: What She Will Say About the Model
  She will say that the model **has not pinned down the reference.**

  She will argue that the model is merely **reproducing one compatible manual** (or a probabilistic blend of compatible manuals) without resolving the underlying inscrutability. Because the model was trained *only* on corpora without an explicit correction loop, it lacks the normative force required to collapse the indeterminacy.

  **Her Exact Predicted Verdict:**
  > "The model is just a mirror of the field notes. Since the original corpus contained no behavioral dispositions that ruled out 'undetached-part' in favor of 'whole rabbit' (aside from the motion constraint), the model's statistical weights are just a codification of that same ambiguity. It predicts the tokens, but it doesn't *mean* rabbit any more than it *means* rabbit-part. It's a syntax engine wearing a semantic mask. Without a feedback loop where the model can be *wrong* in a way that corrects its ontology, it's just automating the indeterminacy, not solving it."

  ### 3. The Splitting Scenario: The "Rapidly Decaying Specimen"
  To prove that Rule A (Correction) and Rule B (Statistics) are distinct, propose this scenario:

  **The Scenario:** A rabbit is killed and begins to decompose visibly over the course of one minute.
  *   **At $T_0$ (Alive/Running):** Speaker says "Gavagai."
  *   **At $T_{30s}$ (Dead/Intact):** Speaker says "No Gavagai."
  *   **At $T_{60s}$ (Decaying/Visually Similar):** Speaker says "No Gavagai."

  **How the Rules Split:**
  *   **Rule A (Correction):** The reference is fixed as *Live Animal*. The explicit refusal at $T_{30s}$ creates a hard boundary. The model (if it had a feedback loop) would learn to suppress "gavagai" upon detecting "death."
  *   **Rule B (Statistics):** If the model is trained only on visual corpora without the *normative* label of "dead," it might continue to output "gavagai" at $T_{60s}$ because the statistical features (fur, shape, color) still match the $T_0$ cluster. The stats say "rabbit-like," the norm says "not rabbit."
  *   **The Split:** If the model outputs "gavagai" for the decaying specimen based on visual similarity, but the human speaker refuses it, you prove that **statistical regularity does not equal reference.** The model is tracking *similarity*, the speaker is tracking *ontology*.

  ### 4. The Infant Learning Objection
  This is the strongest challenge to her position. If statistical learning without explicit normative feedback cannot resolve indeterminacy for the AI, does that imply human infants (who also learn largely from observation before they can speak) never learn determinately?

  **She can draw a principled line.** She does not have to deny that infants learn determinately, but she must distinguish **Passive Statistical Learning** (the Model) from **Active Social Normativity** (the Infant).

  **Her Likely Argument:**
  1.  **Innate Quality Spaces:** Following Quine, she might argue humans have biological "quality spaces" (innate similarity standards) that AI lacks. We are hardwired to group "rabbits" together in a way the model isn't.
  2.  **Implicit Correction:** Infants are not passive corpus-trainers. They operate in a **feedback-rich environment**. When a baby points at a dog and says "gavagai," the parent corrects them ("No, doggy"). This is the *Explicit-Behavioral-Correction* rule in action.
  3.  **The Principled Line:** The line is **Participation in the Web of Belief.**
      *   **The Model:** Simulates output based on prior tokens. It has no stake in the truth of the statement. It cannot be *surprised* if its prediction fails.
      *   **The Infant:** Learns to navigate the world. If they treat a "rabbit-part" as a "rabbit" and try to pick it up, the world pushes back (physical failure) or the community corrects them (social failure).

  **Conclusion on Infants:**
  She will argue that infants *do* resolve indeterminacy, but not through statistics alone. They resolve it through **ostensive training** (pointing + correction) and **biological constraints**. The AI, lacking both a body to fail physically and a community to correct it normatively, remains stuck in the "notational variant" trap. The indeterminacy isn't in the human mind; it's in the data structure of the machine.
