  Here is the mapping of the competing rules, the prediction of her verdict, the splitting scenario, and the implication for infant learning.

  ### 1. Mapping the Competing Rules
  To understand her verdict, we need to see how three potential rules for "fixing reference" align with the judgments she has already made.

  | Rule | Definition | Fit with Her Previous Verdicts |
