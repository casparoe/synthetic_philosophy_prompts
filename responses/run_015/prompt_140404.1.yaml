answer: |-
  You have correctly identified that your TA and your lecture are operating with two different definitions of "unit of selection," and your gut is reacting to the difference even if you don't have the vocabulary for it yet.

  Your TA is using the **Price Equation / Causal Process** definition: "If there is variance in fitness at level X, selection is acting at level X." Under this definition, your TA is right: selection is *always* multilevel, and genes are *always* selected. But as you noted, this makes the concept trivial. It tells you where the math works, not where the *biology* is interesting.

  Your gut is using an **Evolutionary Individuality** definition: "Who is the *entity* that is adapted? Who is the *thing* that reproduces as a whole?" This is a question about status, not just statistics.

  To reconcile your verdicts, you need a principle that distinguishes between a **Darwinian Collective** (a group where selection acts, but lower-level conflict is still possible) and a **Darwinian Individual** (a group where lower-level conflict has been suppressed so thoroughly that the group acts as a single reproducer).

  Here is the principle that fits your intuitions.

  ### The Principle: Reproductive Bottleneck + Conflict Suppression

  A higher-level entity $H$ (composed of lower-level entities $L$) counts as a genuine **Evolutionary Individual** (and not merely a group subject to multilevel selection) if and only if:

  1.  **Reproductive Bottleneck:** $H$ reproduces via a mechanism that resets within-unit variation among $L$ (e.g., a single-cell zygote, a single-founder bud). This ensures offspring $H$ start with high internal relatedness/integration.
  2.  **Conflict Suppression:** Mechanisms exist (policing, sequestered germ lines, developmental integration) that prevent $L$ from replicating independently of $H$'s replication. $L$-fitness is fully coupled to $H$-fitness.

  **The Verdict Rule:**
  *   If **both** hold: $H$ is an **Individual**. Selection at the $L$-level is noise or pathology (e.g., cancer). Describing this as "$L$-level selection" is explanatorily empty.
  *   If **neither or one** holds: $H$ is a **Collective/Group**. Selection is genuinely **Multilevel**. $L$-level selection is a live competitor that must be overcome by $H$-level selection.
  *   If **Bottleneck holds but Suppression fails**: You have **Intra-genomic Conflict** (e.g., Segregation Distorter). The $L$ (gene) is the unit of selection; the $H$ (organism) is the arena.

  ---

  ### Application to Your Cases

  This principle resolves your Body vs. Slime Mold paradox and clarifies the rest.

  **1. Mouse Segregation Distorter**
  *   **Bottleneck:** Yes (zygote).
  *   **Suppression:** **No.** The allele replicates *at the expense* of the mouse's fitness.
  *   **Verdict:** **Gene-level selection.** (Matches your intuition). The organism is not a unified individual relative to this trait; it is a battleground.

  **2. Peacock's Train**
  *   **Bottleneck:** Yes (zygote).
  *   **Suppression:** Yes (somatic cells don't reproduce; gene fitness is tied to bird fitness).
  *   **Verdict:** **Individual-level selection.** (Matches your intuition). Gene-talk is trivially true but explanatorily empty because the gene cannot win unless the bird wins. The bird is the adapted unit.

  **3. Sterile Ant Workers**
  *   **Bottleneck:** Yes (Queen's ova).
  *   **Suppression:** **Yes.** Workers are sterile; they *cannot* reproduce independently. Their fitness is 100% coupled to the colony's reproductive output.
  *   **Verdict:** **Colony-level selection (Superorganism).**
  *   *Correction to your view:* You said "Gene-level... I don't want to call the colony a unit." This is the one verdict I suggest you update. Because the workers are sterile, the *Colony* is the reproducer. The gene is the *replicator*, but the colony is the *vehicle/individual*. Calling this "gene selection" is like saying a car moves because of "combustion selection" rather than "car movement." The colony is the unit of adaptation.

  **4. Cellular Slime Mould (Chimeric Slug)**
  *   **Bottleneck:** **No.** Aggregation of unrelated amoebas.
  *   **Suppression:** **No.** Cheaters (stalk-avoiders) are possible and common.
  *   **Verdict:** **Group-level selection (Multilevel).** (Matches your intuition). The slug is a *Collective*, not an Individual. It is held together by between-slug selection overcoming within-slug cheating.

  **5. Somatic Cells in Your Body**
  *   **Bottleneck:** **Yes.** Single-cell zygote.
  *   **Suppression:** **Yes.** Immune surveillance, apoptosis, sequestered germline.
  *   **Verdict:** **Body-level Individual.** (Matches your intuition). Cell-level selection is cancer (pathology), not a legitimate evolutionary process.
  *   *Resolution of your Paradox:* You asked why the Body is an Individual but the Slug isn't, despite the Body having higher relatedness. The answer is **Suppression**. The Body has *mechanisms* to kill cheating cells. The Chimeric Slug does not. Relatedness helps, but without the Bottleneck + Policing, you don't get Individuality.

  **6. Colonial Invertebrate (Budding vs. Fusion)**
  *   **Budding Regime:** Bottleneck (single founder) + Suppression (clonal integrity). **Verdict:** Colony is an **Individual**.
  *   **Fusion Regime:** No Bottleneck (fusion of strangers) + No Suppression (free-riders). **Verdict:** Colony is a **Group**.
  *   *Why you hate the TA's conclusion:* The TA says "Group selection is happening in both." Technically, under the Price Equation, yes. But under the Individuality Principle, in the Budding regime, the group has *become* an individual. The "group selection" has completed the transition to "individual selection." Your gut is right: the status of the entity changes.

  **7. Obligate Symbionts**
  *   **Vertical Transmission:** Bottleneck (mother to egg) + Suppression (symbiont cannot survive outside). **Verdict:** **Holobiont Individual.** (The pair is the unit).
  *   **Horizontal Transmission:** No Bottleneck (acquired from environment). **Verdict:** **Host + Community.** (Not a unified individual).

  ---

  ### The New Case: The Aspen Grove

  **Case:** A stand of Quaking Aspen (*Populus tremuloides*). Above ground, it looks like hundreds of distinct trees (ramets). Below ground, they are all connected by a single root system (the genet) and are genetically identical clones.
  *   **Scenario A:** The root system shares resources freely. If one trunk is shaded, resources are diverted from sunny trunks to keep it alive. Fire kills half the trunks; the root system survives and resprouts.
  *   **Scenario B:** The root connections degrade over time. Trunks compete for water/nutrients in the soil. Shaded trunks die and are not rescued. Each trunk sends up its own root suckers independently.

  **Prediction using the Principle:**
  *   **Scenario A:** Meets **Bottleneck** (single seed started the genet) and **Suppression** (resource sharing suppresses competition between trunks; fitness of trunk = fitness of genet).
      *   **Verdict:** The **Grove is a Single Individual**. Selection acts on the genet. The trunks are merely organs (like branches on a normal tree).
  *   **Scenario B:** Meets **Bottleneck** (initially), but **Fails Suppression** (trunks compete; independent root suckers allow lineages within the grove to diverge).
      *   **Verdict:** The **Grove is a Group of Individuals**. Selection acts on the individual trunks (ramets). The "grove" is just a population density.

  ---

  ### Honest List: Where Your Verdicts Might Be Wrong

  You asked for an honest assessment. Your intuitions are 90% aligned with the **Evolutionary Individuality** framework (Godfrey-Smith, Michod, Queller), which is the robust philosophical position for your seminar. However, there are two places where your wording might get you in trouble with a strict grader:

  1.  **The Ant Colony:** You classified this as "Gene-level." While kin selection explains *why* the workers are sterile, once they *are* sterile, the **Colony** is the unit of selection (the Interactor). The Gene is the Replicator. If your professor distinguishes Replicator vs. Interactor, you should say: "The Gene is the replicator, but the Colony is the unit of selection/adaptation." Calling it "gene-level selection" obscures the emergence of the superorganism.
  2.  **The Slime Mold:** You said, "I still want to say yes, this is selection at the level of the slug." Be careful here. It is selection *acting on* the slug, but the slug is not a *unit of selection* in the strong sense (it's not an Individual). It is a **transient collective**. If you call it a "Unit," imply that it is a fragile, non-evolutionary individual subject to multilevel selection, not a stable Darwinian Individual like the mouse.

  ### Summary
  Your TA is teaching you **Population Genetics** (where everything is a variable). You are asking **Ontology** (what *things* exist in the world).

  Use the **Bottleneck + Suppression** principle. It validates your distinction between the Body (Individual) and the Chimeric Slug (Group), explains why the Colonial Invertebrate changes status based on reproduction mode, and clarifies why gene-talk is empty for the peacock but essential for the segregation distorter.
