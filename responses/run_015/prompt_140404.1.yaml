prompt: |-
  hey — I'm in a 300-level philosophy of biology seminar (cross-listed with ecology/evolution) and we're in the units-of-selection weeks, and I've realised my gut verdicts on cases don't add up to any position on the syllabus. My TA says everything is gene selection if you squint hard enough, which feels like a way of never being wrong, but the recipe we got in lecture — variation, heritability, differential output, apply it at whatever level you like — feels so permissive that a single nucleotide site passes it. So I want to know what I actually think. Here's where I land:

  - The mouse segregation distorter: heterozygote males pass the thing on to way more than half their pups but sire fewer pups overall, and homozygotes are sterile or dead. Verdict: gene-level selection, no hesitation. The individual mouse is doing worse while the allele does fine; the organism is just the arena.
  - A peacock's train. Verdict: individual-level selection, i.e. sexual selection — it's about how many matings that bird gets. I get that you can redescribe it as the long-train allele out-reproducing its alternative, but that redescripion feels empty here, and I want to say gene-level talk is doing no work in this case even though it's true.
  - Sterile workers in an ant colony headed by a singly mated queen. Verdict: gene-level again, via relatedness. I don't want to call the colony a unit of selection; I want to say the colony is something the genome builds.
  - Cellular slime moulds: amoebas aggregate when they starve and about a fifth of them die to build the stalk that lifts the rest. My prof told us to imagine the slug is chimeric, formed from unrelated amoebas. Verdict: I still want to say yes, this is selection at the level of the slug — between-slug differences beat within-slug cheating often enough that something like the stalk/spore ratio really is a slug-level trait.
  - Structurally the same thing inside my own body: cell lineages that defect get policed by apoptosis, immune surveillance, a sequestered germline. Verdict: here I do NOT want to say multilevel selection, with the body as the group and cells as the individuals. I want to say the body just is the individual and cell-level selection is noise that gets suppressed.

  Those last two are the pair I can't reconcile, and I think I might be conflating two seperate questions without knowing how to pull them apart. If relatedness is what welds a bunch of lower-level things into a higher-level one, then my verdicts are exactly backwards: my cells are clonal and the slug in my prof's version is a pile of strangers, so the body should look like a better unit than the slug, not a worse one.

  The rule I keep coming back to is a reproduction test: a level is a unit of selection only if things at that level genuinely reproduce — some bottleneck-ish process makes offspring units that resemble parent units — rather than getting reassembled out of whatever happens to be lying around each generation. But that test does nothing for the peacock, where both the gene and the bird pass it and I still think only one description earns its keep.

  Our TA also threw a made-up case at us, and it's the one that breaks my rule for me: a colonial marine invertebrate where colonies sometimes reproduce by budding off a single founder cell and sometimes form when three unrelated colonies fuse. There's a costly shared defensive structure that makes colonies survive better and grow slower. It spreads in the bottleneck regime and gets eaten by free-riders in the fusion regime — same trait, same ecology, only the mode of colony reproduction differs. My gut says the colony is a unit of selection in the first regime and isn't in the second, but on the Price-equation framing we did, the fusion colonies are just as much groups with differential survival, so group selection is going on in both and merely loses in one. I definately hate that conclusion and can't say why.

  And the one I go back and forth on: obligate symbionts. A bacterium passed strictly from mother to offspring for millions of years — I sort of want to say the pair is one unit. A gut community passed around among nestmates — I want to say no. Is that just transmission fidelity, and is there a threshold, or is that the wrong axis entirely?

  What I want: a principle (or two candidates) stated precisely enough to apply, with the case that motivates each clause; its verdict on a case I haven't listed — make one up and tell me what it predicts; and an honest list of my verdicts it can't save. If the honest answer is that one of my verdicts is just wrong, say which and why. Please don't give me reading recs, we already have a syllabus.
