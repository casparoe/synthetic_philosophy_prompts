answer: |-
  # JOINT STATEMENT ON THE SPECIAL COMPOSITION QUESTION

  **Authors:** [Name of Nihilist] & [Name of Universalist]
  **Date:** October 26, 2023
  **Subject:** Resolution of Deadlock regarding Ontological Commitment and Composition

  ## I. COMMON GROUND

  We, the undersigned, having debated the Special Composition Question (SCQ), affirm the following claims as the shared foundation of our continued inquiry. We agree that the debate is no longer between common sense and revisionism, but between two revisionist accounts that take vagueness seriously.

  1.  **Formulation of the SCQ:** We agree the question is to be understood as: "Under what necessary and sufficient conditions do some things (the *xs*) compose something (a *y*)?" We agree that "compose" implies a many-to-one relation where the *xs* exist and *y* exists, and the existence of *y* is distinct from the mere plurality of the *xs*.
  2.  **Rejection of Restricted Composition:** We jointly reject all "restricted" answers (e.g., composition occurs only when parts are in contact, fastened, or constitute a life). We agree that any such restriction entails a sharp cutoff along a continuum (e.g., of proximity or cohesion) where no metaphysical difference exists. We accept that vagueness in the world is unintelligible; therefore, vagueness in composition rules implies vagueness in existence, which we both reject.
  3.  **Theoretical Debt:** We agree that both our positions require a reconstruction of ordinary and scientific discourse.
      *   The Nihilist owes a paraphrase schema that renders sentences like "There is a table" true without committing to a table-object.
      *   The Universalist owes an explanation of why ordinary discourse ignores the vast majority of existing objects (e.g., the fusion of my left shoe and the Moon) without denying their existence.
  4.  **Inadmissible Moves:** We agree that the following moves do not settle the dispute:
      *   Appeals to "common sense" intuition regarding familiar medium-sized dry goods.
      *   Appeals to the utility of composite talk in daily life (both agree it is useful; the dispute is about truth conditions).
      *   Arguments from perceptual phenomenology (we perceive arrangements, not necessarily ontological units).
  5.  **Logic and Quantification:** We agree to use classical logic and a standard first-order existential quantifier ($\exists$) for the purpose of formalizing our theories, while acknowledging we may differ on the domain over which this quantifier ranges.

  ## II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table outlines the substantive disagreements remaining between us. Each row addresses a specific point of contention, stated in the preferred terminology of each party to avoid straw-manning.

  | Topic | Nihilist Formulation (My View) | Universalist Formulation (Her View) |
  | :--- | :--- | :--- |
  | **Ontological Commitment** | Only simples exist. To say "composites exist" is strictly false; only simples arranged composite-wise exist. | Simples and their fusions exist. To say "composites exist" is strictly true; any plurality of objects has a mereological sum. |
  | **Truth Conditions** | "There is a chair" is true iff there are simples arranged chair-wise. The singular term "chair" does not refer to an object. | "There is a chair" is true iff there is a chair-object in the domain of quantification. The singular term "chair" refers to a specific fusion of simples. |
  | **Vagueness** | Vagueness is entirely linguistic/semantic. There is no vagueness in which simples exist, only in which arrangements we label "chair." | Vagueness is entirely linguistic/semantic. There is no vagueness in which fusions exist (all do), only in which fusions we label "chair." |
  | **Parsimony** | My view is ontologically parsimonious. I posit only the entities required by fundamental physics (simples). | My view is ideologically parsimonious. I posit no restriction rules and accept the standard logic of pluralities without special exceptions. |

  ## III. CRUXES AND THE VERBAL DISPUTE

  ### A. Is the Dispute Merely Verbal?
  We address the charge of "quantifier variance" (the idea that we simply mean different things by "exists").
  **Joint Assessment:** We agree the dispute is **not merely verbal**. While we may differ on the domain of the quantifier, this difference tracks a substantive disagreement about theoretical virtue. If the dispute were merely verbal, we could both be right relative to our own languages. However, we are making competing claims about which ontology best systematizes fundamental physics and logic. The disagreement is about which linguistic framework captures the structure of reality more accurately, not just about word usage.

  ### B. Crux 1: The Toy World (Three Simples)
  **The Case:** A world containing exactly three simples ($a, b, c$).
  *   *Time 1:* They are clustered tightly (arranged triangle-wise).
  *   *Time 2:* They are scattered across the universe.

  **Nihilist Prediction:**
  *   **Ontology:** At both times, exactly three objects exist ($a, b, c$).
  *   **Change:** The change from Time 1 to Time 2 is a change in spatial relations and properties, not a change in what objects exist.
  *   **Dynamics:** The laws of physics quantify only over $a, b, c$. The "cluster" does no causal work. Positing a "cluster object" adds ontology without explanatory power.
  *   **What would move me:** If it could be shown that the *cluster* itself possesses a causal power at Time 1 that $a, b, c$ individually lack, and which vanishes at Time 2.

  **Universalist Prediction:**
  *   **Ontology:** At both times, seven objects exist ($a, b, c, a+b, a+c, b+c, a+b+c$).
  *   **Change:** The change from Time 1 to Time 2 is a change in the intrinsic properties (e.g., spatial compactness) of the fusion objects, not a change in which objects exist.
  *   **Dynamics:** The laws of physics quantify over variables that range over all seven. The fusion objects are an "ontological free lunch"; their existence adds no complexity to the dynamics because they supervene on the simples.
  *   **What would move me:** If it could be shown that acknowledging the fusion objects forces a revision of the laws of physics (e.g., requiring double-counting of energy or mass) rather than being a harmless logical consequence.

  ### C. Crux 2: The Stipulated Cost Audit
  **The Metric:**
  *   *Ontological Cost:* The number of distinct entities a completed physics must quantify over in its fundamental laws.
  *   *Ideological Cost:* The complexity of the paraphrase schema required to reconcile the ontology with ordinary/scientific singular terms.

  **Nihilist Prediction:**
  *   **Ontology:** Low Cost. Physics quantifies only over simples (fields/particles).
  *   **Ideology:** High Cost. Requires complex paraphrase rules (e.g., "The table is brown" $\rightarrow$ "The simples arranged table-wise reflect light brown-ly").
  *   **Verdict:** I expect the audit to favor me. Ontological parsimony is the primary virtue of fundamental metaphysics; ideological complexity is a acceptable price to pay for a sparse ontology.
  *   **What would move me:** If the paraphrase schema becomes so complex that it renders scientific theories unintelligible or logically incoherent (e.g., if quantum entanglement cannot be described without referring to the composite system as a single entity).

  **Universalist Prediction:**
  *   **Ontology:** Neutral/Free. Physics quantifies over variables. Whether the domain includes fusions does not change the *laws*, only the domain. Fusions do not add "fundamental" entities.
  *   **Ideology:** Low Cost. Ordinary and scientific talk can be taken literally. "The system" refers to an object.
  *   **Verdict:** I expect the audit to favor me. We should not multiply *primitive* ideological rules (paraphrases) to reduce a domain that costs nothing to expand.
  *   **What would move me:** If the audit demonstrates that including fusions in the domain of fundamental physics requires adding new fundamental predicates or laws to handle the interactions of composite objects distinct from their parts.

  ## IV. FALSIFICATION AND SETTLEMENT

  ### Evidence Against Our Views
  We acknowledge that metaphysical views are rarely falsified by empirical data alone, but we specify the theoretical conditions under which we would abandon our positions.

  *   **Nihilist Condition for Abandonment:** If fundamental physics demonstrates **strong emergence**—specifically, if causal powers are identified at the macroscopic level that are not reducible to, nor supervenient upon, the causal powers of the microscopic simples. If a "table" can cause an effect that its "simples arranged table-wise" cannot, Nihilism is false.
  *   **Universalist Condition for Abandonment:** If unrestricted composition leads to **logical contradiction** or **modal collapse**. For example, if the existence of arbitrary fusions (like "Trump-Turkey") makes it impossible to account for identity over time, or if it violates principles of grounding such that the whole determines the parts rather than vice versa.

  ### Can the Matter Be Genuinely Settled?
  **Joint Conclusion:** We agree that **nothing currently available will genuinely settle the matter.**
  The dispute rests on a trade-off between competing theoretical virtues: Ontological Parsimony (favored by Nihilism) vs. Ideological/Logical Simplicity (favored by Universalism). There is no meta-principle we both accept that ranks one virtue definitively above the other. Until a new argument arises that demonstrates a logical incoherence in one view or an indispensable explanatory role for the other's entities, we acknowledge this deadlock as a stable feature of contemporary metaphysics.

  ***

  **Signed:**

  _________________________ (The Nihilist)

  _________________________ (The Universalist)
