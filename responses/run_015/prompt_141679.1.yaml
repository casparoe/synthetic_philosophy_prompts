answer: |-
  You have described a phenomenon that is well-documented in political science, sociology, and game theory, though it rarely has a single name that satisfies all the constraints you've listed. The reason you feel existing terms like "compromise" or "hypocrisy" are insufficient is that those terms describe *moral* or *substantive* states, whereas you are describing a *structural* and *informational* equilibrium.

  The most precise "carving" of this phenomenon comes from synthesizing three distinct concepts: **Institutional Decoupling** (Sociology), **Two-Level Games** (Political Science), and **Common Knowledge Barriers** (Game Theory).

  Here is the breakdown of the concept, its edges, and a recommended label.

  ### 1. The Core Concept: Institutional Decoupling
  In organizational sociology (specifically the work of John Meyer, Brian Rowan, and Nils Brunsson), this is called **Decoupling**.

  Brunsson, in *The Organization of Hypocrisy*, argues that organizations often face conflicting demands from their environment (constituencies). To survive, they decouple their **talk** (narratives, principles, public statements) from their **actions** (actual decisions, resource allocation).
  *   **The Fit:** In your open-source case, the *action* was taking the money (efficient). The *talk* was "we fought hard and conceded reluctantly" (legitimizing).
  *   **The Difference from Ordinary Hypocrisy:** Ordinary hypocrisy is a moral failing or a lie told to deceive. *Structural Decoupling* is a functional necessity. If the talk matches the action perfectly, the organization loses support from one constituency and collapses. The "hypocrisy" is the load-bearing wall.

  ### 2. The Political Mechanism: Two-Level Games
  Robert Putnam's theory of **Two-Level Games** explains *why* the decoupling is necessary. Negotiators play two games simultaneously:
  *   **Level 1:** Bargaining against the other side (where you found the win-win).
  *   **Level 2:** Bargaining against your own constituents (who demand you uphold principles).
  *   **Audience Costs:** James Fearon's concept of **Audience Costs** explains the penalty. If a leader signals weakness (admitting a win-win that looks like capitulation), their constituency punishes them.
  *   **The Fit:** Both sides needed to generate "audience costs" for their own side (the appearance of loss) to pay for the "Level 1" gain (the money/infrastructure).

  ### 3. The Fragility Mechanism: Mutual vs. Common Knowledge
  This explains why pointing out the truth destroys the deal. This is the most critical "edge" for your analysis.
  *   **Mutual Knowledge:** Everyone knows $P$ (the deal is actually good for both sides).
  *   **Common Knowledge:** Everyone knows $P$, *and* everyone knows that everyone knows $P$, *and* everyone knows that everyone knows that everyone knows $P$...
  *   **The Mechanism:** The agreement survives only as long as the truth remains *Mutual* but not *Common*.
      *   Privately, everyone knows it's a win-win.
      *   Publicly, it must be framed as a loss.
      *   If someone announces the truth publicly, it becomes *Common Knowledge*. Once it is Common Knowledge, the constituents *cannot* ignore it without losing their own credibility. They are forced to punish the representatives to signal *their* own adherence to the principle.
      *   **The "Enemy":** The person who points out the mutual gain is an enemy because they are converting a stable Mutual Knowledge equilibrium into an unstable Common Knowledge crisis.

  ---

  ### The Edges: Counterfactual Analysis
  You asked which ingredients are doing the work. Here is how the phenomenon behaves if you remove them:

  **1. The Requirement for Credible Loss (Audience Costs)**
  *   *Remove it:* If constituents do not punish leaders for appearing to "win too easily," the phenomenon disappears. The leaders would simply announce the win-win.
  *   *Verdict:* **Essential.** Without the threat of punishment from the home audience, the "face-saving" narrative is unnecessary.

  **2. The Unspeakable Justification (Common Knowledge Barrier)**
  *   *Remove it:* If the truth can be spoken publicly without triggering punishment (e.g., a highly sophisticated constituency that values outcomes over principles), the arrangement stabilizes without the fiction.
  *   *Verdict:* **Essential.** The fragility you observed is specifically a function of the *public announcement* changing the game state from Mutual to Common Knowledge.

  **3. Trading Narrative, Not Policy (Decoupling)**
  *   *Remove it:* If the trade involved actual policy concessions (e.g., actually *not* taking the money), it would be a standard compromise, not this specific equilibrium.
  *   *Verdict:* **Defining Feature.** This distinguishes it from ordinary compromise. In ordinary compromise, substance is traded. Here, substance is optimized, and *symbolism* is traded.

  **4. Representative Structure (The Buffer)**
  *   *Remove it:* If the constituents were voting directly on the deal (direct democracy), the phenomenon collapses. Direct voting forces Common Knowledge.
  *   *Verdict:* **Essential.** You need the "representative" layer to maintain the information asymmetry between the back-room deal and the public narrative.

  ---

  ### Recommended Label and Definition
  There is no single word that captures all of this, but the most rigorous label you can use in a professional setting is **"Structural Decoupling"** or **"Common-Knowledge-Protected Equilibrium."**

  However, if you need a term that communicates the *function* rather than the mechanism, the diplomatic term is **"Constructive Ambiguity,"** though you must qualify it. Diplomats use this for text; you are describing **"Narrative Constructive Ambiguity."**

  **Proposed Definition for Your Use:**
  > **A Load-Bearing Fiction:** A negotiation equilibrium where mutual gain is structurally dependent on the public maintenance of a false narrative of conflict or loss. It relies on **Institutional Decoupling** (separating action from talk) and is protected by a **Common Knowledge Barrier** (the arrangement collapses if the true nature of the gain becomes public common knowledge).

  ### Distinctions (The "Nearest Misses")

  | Concept | Why it's a miss | How your case differs |
  | :--- | :--- | :--- |
  | **Compromise** | Implies splitting the difference on substance. | Here, substance is optimized (Pareto improvement); only the *story* is compromised. |
  | **Hypocrisy** | Implies moral failing or deception for selfish gain. | Here, the "deception" is mutually agreed upon for systemic stability (Functional Hypocrisy). |
  | **Saving Face** | Usually implies one side avoiding humiliation. | Here, *both* sides must simultaneously save face via a shared fiction; it is reciprocal. |
  | **Pluralistic Ignorance** | Implies people privately *disagree* but think they are alone. | Here, people privately *agree* on the truth but know they must publicly pretend otherwise. |
  | **The Noble Lie** | Implies rulers lying to subjects for the subjects' good. | Here, representatives lie to constituents for the *representatives'* survival (and the project's). |

  ### Summary for Your Next Meeting
  If you need to name this in a meeting without sounding abstract, use the engineering analogy:

  > "We have achieved **Interface Decoupling**. The *implementation* (the actual deal) is optimized for performance, but the *API* (the public narrative) must return a specific error code to keep the clients (constituencies) happy. If we log the actual return value to stdout (publicly admit the win-win), the clients will throw exceptions and break the integration. We need to maintain the abstraction layer."

  This captures the "backend" reality vs. the "frontend" requirement, the necessity of the "lie," and the systemic risk of exposing the internals. It validates the arrangement as a feature of the system architecture, not a bug in the participants' morality.
