answer: |-
  This is a sharp reconstruction of the standard "Numbers Problem" and "Risk Problem" for Scanlonian contractualism. You're right to feel that the argument proves too much; if it holds, contractualism is dead on arrival for public policy. But you're also right to suspect the flaw lies in how the view's machinery is being modeled.

  Here is the diagnosis: **The bad step is the inference in (2), specifically the claim that contractualism "can't rank the options."**

  This looks fine because Scanlon's initial formulation in *What We Owe to Each Other* was notoriously ambiguous on exactly this point, inviting a **token-act reading** of the contractualist test. Your argument assumes we are comparing objections to *this specific rescue act* ("Save Ada now" vs. "Save the Five now").

  However, Scanlon's considered view (clarified in later papers like "Contractualism and Utilitarianism" and his replies to critics) insists we are comparing **principles for the general regulation of behavior**. This distinction allows the contractualist to block (2) and (3) without abandoning (1), but it comes at the exact cost you suspect: it moves the view uncomfortably close to the Rawlsian veil of ignorance.

  Here is the breakdown of the diagnosis, the repair, and the costs.

  ### 1. The Diagnosis: Token Acts vs. General Principles
  Your Step (2) assumes that when we ask if a principle is reasonably rejectable, we look *only* at the burdens imposed in the specific instance where the principle is invoked.
  *   **Your Model:** Principle P = "Save the smaller group." In *this* case, Ada dies. Her objection is "I die." The Five's objection is "We die." Comparing one-to-one, Ada's objection is as strong as any single stranger's. P is not rejectable.
  *   **The Contractualist Repair:** Principle P = "Save the smaller group" governs *all* rescue situations of this type. When assessing whether P is reasonably rejectable, an individual considers their **generic reasons** to reject P. A generic reason includes the probability that, over a lifetime of situations governed by P, they will find themselves in the minority.
  *   **The Fix:** If the principle is "Save the smaller group," *everyone* has a generic reason to reject it, because everyone faces a significant probability of being in the minority group at some point. If the principle is "Save the larger group," the person who ends up being the solitary victim (Ada) still has a strong objection, but the *generic* objection of the population (who are usually in the majority) outweighs the generic objection of the potential minority.

  This allows numbers to count **indirectly**. They don't count by summing welfare (preserving your Step 1), but they count by altering the **probability of burden** associated with the principle (blocking your Step 3).

  ### 2. Why It Looked Fine
  It looked fine because Scanlon's "one-to-one" comparison language is seductive. It suggests a static snapshot: *Person A vs. Person B.* But contractualism is a moral theory about **justification to others**, and justification requires stability over time. If I agree to a principle that sacrifices me whenever I am in the minority of 1 vs. 1,000,000, I am agreeing to a principle that makes my life statistically precarious. My "reasonable rejection" is based on that statistical precariousness, not just the immediate pain.

  ### 3. The Cost of the Repair (Your Rawls Worry)
  You wrote: *"it looks to me exactly like taking expected utility from behind a veil of ignorance... which sort of begs the question."*

  You are half-right, and this is the most important point for your group discussion.
  *   **The Convergence:** Yes, mathematically, this "generic reasons" move often yields the same results as Harsanyi's average utilitarianism or Rawls's maximin behind a veil. If the calculation relies on probabilities of occupancy, the "separateness of persons" is preserved only **formally**, not **substantively**. We are still doing each person separately, but we are simulating a lottery to do it.
  *   **The Distinction:** The contractualist insists the *justification* differs. Rawls/Harsanyi ask: "What would you choose if you didn't know who you were?" Scanlon asks: "Can you justify this to each person knowing who they are, given that they have generic reasons to worry about being in that position?"
  *   **The Cost:** The cost is **complexity and instability**. To keep the "separateness of persons" robust, Scanlon must insist that the *strength* of the individual burden still trumps the probability. (e.g., I can't be sacrificed for a huge aggregate gain even if it's unlikely I'll be the victim). But in the Rescue Case, since the burden (death) is identical on both sides, probability becomes the tie-breaker. This makes the view look like Rule Utilitarianism with extra steps.

  ### 4. The Harder Problem: Step (4) and Risk
  Your Step (4) is actually a stronger objection than the Rescue Case. The "generic reasons" move works for Rescue because there are distinct sides (Minority vs. Majority). In your Risk Case, **everyone is on the same side** (everyone faces the risk).

  *   **The Problem:** If we evaluate *ex ante* (based on expected risk), the individual risk is negligible, so no one can reject. If we evaluate *ex post* (based on actual deaths), the victims have a massive objection.
  *   **The Contractualist Dilemma:**
      *   If Scanlon chooses *ex ante*, he loses the intuitive result in your Step (4) (permitting arbitrary deaths).
      *   If Scanlon chooses *ex post*, he struggles to justify *any* risk imposition (driving, medicine, etc.), because the actual victims can always say "My burden was death, your benefit was convenience."
  *   **The Available Repair:** Scanlon typically argues that we compare the **strength of the generic reasons** to impose risk vs. the **strength of the generic reasons** to avoid it. A principle permitting "trivial convenience at risk of death" is rejectable because the *type* of burden (death) is incomparably heavier than the *type* of benefit (convenience), even if the probability is low.
  *   **The Cost:** This requires a **threshold deontology**. It implies that some burdens are so severe that even a tiny probability of them cannot be traded for trivial gains. This saves Step (4), but it makes the view rigid. It also creates tension with Step (1): if we can reject a policy because 20 people *will* die (predictably), aren't we effectively aggregating the risk across the population to determine that the principle is too dangerous?

  ### Summary for the Group
  1.  **The Flaw:** Step (2) assumes a token-act evaluation. Contractualism evaluates principles for general regulation, allowing probabilities of being burdened to enter the "strength of objection" without aggregating welfare.
  2.  **The Rawls Worry:** You are correct that this repair makes contractualism converge with veil-of-ignorance reasoning. The "separateness of persons" is maintained in the *structure* of justification (individual veto) but eroded in the *content* of the reasons (probabilistic occupancy).
  3.  **The Real Vulnerability:** Step (4) is the harder case. The "generic reasons" move is less effective when everyone shares the risk profile. To solve (4), contractualism likely needs to appeal to the **magnitude of the potential burden** (death vs. convenience) overriding the low probability, which risks collapsing into a form of rights-based absolutism that struggles with everyday risk imposition.

  **Verdict on the Argument:** Your argument successfully shows that **naive** contractualism (token-act, purely ex post) is untenable. But **sophisticated** contractualism (general principles, generic reasons) survives by accepting the costs you identified: it becomes more complex, more like Rawls, and struggles to find a consistent theory of risk that doesn't either permit too much death or forbid too much life.

  If your political theorist wants to bring Rawls in, let them: this is the point where Scanlon's machinery essentially imports Rawls's "strains of commitment" and "social minimum" to plug the holes in the individual objection model. The cost of saving contractualism from your *reductio* is making it look more like the view your colleague is pushing.
