          *   Scanlon's later view (in "Contractualism and Utilitarianism" 1998 and replies) allows that if the risk is low enough, it's permissible. But if the *expected* death count is high, the principle might be rejectable because the *generic reason* to avoid risk is strong when multiplied by the probability, *or* because we can formulate a principle that minimizes risk without imposing heavy burdens.
