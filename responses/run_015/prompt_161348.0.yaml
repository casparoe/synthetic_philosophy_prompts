      *   **Addressing the "Veil of Ignorance" Worry:**
          *   It *is* similar, but the justification differs. Rawls: fairness behind a veil. Scanlon: mutual justifiability to actual individuals based on their generic reasons. The *meta-justification* is different, even if the *math* looks similar.
          *   But the user is right: if the math is identical, the "separateness of persons" protection is thin.

      *   **Addressing the Risk Case (4):**
