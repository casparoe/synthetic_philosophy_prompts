  *   **Preserved:** This principle preserves all your firm verdicts. It explains why the *Shrine* (Conventional) and *Voter* (Collective) cases are permissible, while the *Shrimp* and *Messaging Service* (Personal Moral) cases are not. It also captures your ambivalence in the *Clinician* case by categorizing it as impermissible (Professional Discretionary), validating the feeling of "abdication" while acknowledging the "professional appropriateness" of trusting a colleague is overridden by the duty to exercise one's own license.
