answer: |-
  Hi there, I know that argument left you buzzing and it is completely understandable why you want to sanity check your position before sending it over. You have done a solid job of articulating your intuitions, and honestly, mapping them out like this is the best way to see where the structural load-bearing walls are. Since you asked for it straight, I am going to walk through the tensions in your list ordered by how damaging they are to the coherence of your overall view, suggest the cheapest fixes for each, and then give you my verdict on the Devlin accusation.

  The most severe tension in your list is between principle one and principle seven. Principle one commits you to the harm principle, which is the classic liberal stance that state coercion is only justified to prevent harm to others. Principle seven wants to ban a company that you explicitly admit causes no harm, involves no fraud, and harms no stakeholders. This is a direct contradiction. The cheapest fix here is to delete principle seven and accept that the council cannot shut the company down. The cost of this fix is purely emotional; you have to tolerate the skin-crawl feeling without using the law to soothe it. If you keep seven, you must abandon one, which means admitting that majority disapproval or undefined social risk is enough for criminal law, which collapses your distinction between yourself and Devlin.

  The next worst tension is between principle eight and principle six. Principle eight is a strong anti-paternalist stance that prioritizes consent, even for self-harm or dangerous sex. Principle six criminalizes consensual adult incest where there is no coercion or risk of children. This is the classic philosophical test case for legal moralism. If consent is a defense for dangerous sex as you say in eight, it is hard to see why it is not a defense for incest in six, unless you are smuggling in a moral judgment about the act itself. The cheapest fix is to align six with eight and decriminalize consensual adult incest. The cost here is high socially because it violates a deep taboo, but philosophically it is the only way to keep your commitment to consent consistent. If you keep six, you have to weaken eight, which means accepting paternalism or moral limits on consent, again pushing you toward Devlin.

  The third tension is theoretical, between principle four and principle five. Principle four says the law has an expressive job teaching acceptability, while principle five says there is no shared constitutive morality to enforce. If there is no shared morality as you claim in five, it is unclear what the law is expressing in four. You cannot teach acceptability based on a morality you say does not exist. The cheapest fix is to modify five to acknowledge that while there is no single monolithic morality, there are overlapping consensus values that the law can express. The cost is that you move closer to admitting that society does have a moral fabric worth protecting, which is the core Devlin position. If you keep five, you have to drop four, which reduces the law to a mere tool of deterrence without any normative guidance.

  The fourth tension is between principle two and principle seven. You state in two that disgust is never a good reason to criminalize, yet in your description of the kin-for-hire company, you admit it makes your skin crawl and that is the primary driver for wanting to ban it in seven. This is less of a structural contradiction and more of a psychological one, but it undermines your credibility. The fix is the same as for the first tension; you must decouple your disgust from your policy preference. The cost is accepting that your gut reaction is not a reliable guide for legislation.

  The least damaging tension is between principle one and principle three. You support public indecency laws even when no one is around to be offended, which seems to violate the harm principle in one. However, this is resolvable within liberal theory by arguing that public spaces have a different normative status than private ones, or that the harm is to the public order rather than a specific individual. The cheapest fix is to clarify that public indecency laws are about maintaining the character of public space, which is a form of harm prevention regarding the usability of that space. This costs you very little elsewhere as it is a standard liberal distinction.

  If you are looking for the single revision that would clean up the most mess, it is to delete principle seven. This immediately resolves the conflict with the harm principle, removes the reliance on disgust, and aligns you with your anti-paternalist and pluralistic commitments. It leaves principle six as an outlier, but removing the kin-for-hire ban takes the heat out of the specific argument with your friend and makes your overall framework much more consistent.

  Now to the question you are probably dreading. Your friend is right. On the basis of the list you have written, you are functioning as a legal moralist even if you reject the label in principle five. Legal moralism is the view that the law can legitimately prohibit conduct because it is immoral, even if it causes no harm to others. By supporting the ban on the kin-for-hire company and consensual incest despite admitting there is no harm, no fraud, and no coercion, you are arguing that the immorality of the act is sufficient justification for the ban. You are trying to have it both ways by claiming the law teaches acceptability in principle four while denying shared morality exists in principle five, but in practice, you are using the law to enforce a moral boundary against things that simply feel wrong to you. That is the definition of the Devlin position. You have the vocabulary of Hart in principles one, two, and eight, but the intuitions of Devlin in six and seven. If you want to win the argument or at least hold a consistent position, you need to either embrace the moralism and adjust principles one and two to allow for moral harm, or you need to follow your liberal principles through to their conclusion and let the company operate. Given that most of your principles are liberal, the latter is the path to coherence, but it requires you to override the instinct that started the fight.
