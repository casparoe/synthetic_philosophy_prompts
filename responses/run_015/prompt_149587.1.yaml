answer: |-
  Good morning. Welcome to "After Progress."

  I know the title provokes a reaction. I can see it in the room. For half of you, the phrase sounds like a relief. You have spent years studying the ruins of civilizations that thought they were exceptional, only to find out they were merely temporary. For the other half of you, the title sounds like a threat. You have built careers and institutions on the belief that tomorrow will be better than today, that innovation compounds, and that the arc of history bends toward improvement.

  If I were standing here to tell the scholars they were right and the donors were wrong, this would be a very short workshop. If I were here to tell the donors that progress is guaranteed and the scholars are just cynics, we would all be wasting our time.

  So, let's be precise about what we mean by "After." We are not gathering to declare that improvement is impossible. We are gathering to declare that improvement is no longer automatic.

  To understand why, we have to look at the machinery of history. And for that, we need to borrow from two men who understood that societies are living organisms, not straight lines.

  First, consider Polybius. He looked at Rome and saw a machine that ran on a loop. He argued that political systems are not stable states; they are phases. A strong leader becomes a tyrant; the elite overthrow him to form an aristocracy; the aristocracy becomes corrupt; the people take over; the people become a mob; and finally, a strong leader returns to restore order.

  This is not a pessimistic view. It is a mechanical one. It suggests that decay is not an accident; it is a byproduct of success. When a system works, it creates stability. Stability creates comfort. Comfort creates complacency. And complacency creates the vulnerability that allows the cycle to turn.

  If Polybius is right, then the idea of permanent progress is a category error. You cannot have a straight line on a circle.

  But here is the tension I want to place on the table immediately. If history is truly cyclical, then this workshop title is self-defeating. If the wheel turns, then progress returns. The dark ages pass, the renaissance comes, and the arc bends up again. So why mourn progress? Why call this "After Progress"?

  The answer lies in the second thinker we are engaging with: Ibn Khaldun.

  Khaldun looked beyond the political structure to the social fuel that powers it. He described a force of social cohesion, a group solidarity that binds people together. In the beginning, this solidarity is raw and tough. It builds cities, establishes dynasties, and creates high culture. But as the civilization succeeds, it becomes urban, wealthy, and refined. The second generation maintains the discipline of the founders. The third generation imitates it. The fourth generation loses it entirely.

  When that group feeling dissolves, the civilization does not just pause; it becomes prey. It is conquered by a new group with stronger solidarity.

  So, bring these two together. Polybius gives us the cycle of institutions; Khaldun gives us the cycle of spirit.

  If we accept this framework, we have to confront the danger of the linear narrative. When we believe history is basically improvement plus some bumps, we treat problems as technical glitches. We assume that if we just fund the right research, pass the right law, or build the right museum wing, the future takes care of itself. We outsource our agency to the timeline.

  But if the cyclical view holds, there is no timeline to outsource to. There is only the maintenance of cohesion and the renovation of institutions.

  This is where the title "After Progress" finds its utility. It is not a tombstone. It is a warning label. It means we are "after" the era where we could rely on the momentum of the past to carry us into the future. We are at the point in the cycle where the luxury of the Khaldunian third or fourth generation has set in, and the Polybian cycle is nearing a turn.

  To the donors in the room: I know this sounds daunting. You want to know that your contribution adds to a sum total of human betterment. I am asking you to shift your metric. Do not fund projects because they look like "the future." Fund projects because they rebuild the social glue that makes a future possible. If Khaldun is right, philanthropy is not just about adding new layers of culture; it is about preventing the erosion of the foundation. You are not investing in a stock market that always goes up; you are maintaining a dam against the flood.

  To the scholars in the room: I know the temptation is to diagnose the decline and retreat to the archives. But Polybius did not write his history to tell us that Rome was doomed. He wrote it to explain how Rome succeeded, and implicitly, how it could fail. The cycle is not a prison; it is a map. If we know where we are on the wheel, we can brace for the turn. We can use the period of decay to prepare the institutions of the renewal.

  This brings us back to the apparent contradiction of the title. If history cycles, progress returns. So why "After Progress"?

  Because the *myth* of linear progress is currently an obstacle to the *reality* of cyclical renewal. As long as we pretend we are on a straight line, we will not do the hard, unglamorous work of resetting the cycle. We will keep adding complexity to a system that needs simplification. We will keep seeking novelty when we need cohesion. We will wait for a savior technology instead of building a savior community.

  We must kill the illusion of automatic progress to save the possibility of actual improvement.

  We are "After Progress" in the sense that we are past the point of innocence. We can no longer claim we didn't know that civilizations rot. We can no longer claim we didn't know that wealth softens the will. The data is in. The historical record is clear.

  So, what is the work of this workshop? It is to ask what comes after the assumption of the straight line.

  If we are in a cycle, our goal is not to break the cycle—that is likely impossible. Our goal is to soften the landing and shorten the dark period. It is to see if a modern, complex society can consciously generate the group solidarity that Khaldun thought only the desert could provide. It is to see if we can reform our constitutions before the mob or the tyrant does it for us.

  This requires a partnership between the two halves of this room. The scholars have the maps; they know the terrain of the cycle. The donors have the resources; they have the capacity to build the shelters for the storm. But neither group can succeed if one is operating on a linear timeline and the other is operating on a fatalistic loop.

  We need a shared realism.

  Progress is not a law of physics. It is a garden. It requires tending. It requires pruning. And sometimes, it requires admitting that the season has changed.

  Over the next two days, I ask you to speak plainly. If a proposal sounds like it assumes history is a ladder, question it. If a critique sounds like it assumes collapse is inevitable, challenge it. We are looking for the narrow path between hubris and despair.

  We are here because we suspect that the old story has run out of road. That is not a tragedy. It is an opportunity. It means the next chapter is not written by the inertia of the last one. It will be written by us.

  Let's get to work.
