answer: |-
  This is a sharp dissection of a very common phenomenon. Your uncle is practicing a diluted, behavioral version of **Pascal's Wager**, but with a crucial divergence: Pascal argued for habituating yourself until belief *emerged*; your uncle is arguing for ritual compliance *without* belief.

  This specific stance—let's call it **Pragmatic Ritualism**—relies on a stack of implicit philosophical and theological assumptions. Here is a reconstruction of that theory, an analysis of where it overlaps with other frameworks, and what happens if the psychology of belief breaks it.

  ### 1. Reconstructing the Implicit Theory

  Your uncle's behavior presupposes a specific model of reality, divinity, and risk.

  **A. The Metaphysical Presupposition: Infinite Stakes Override Probability**
  In standard risk assessment (like his financial life), we weigh *Probability × Impact*. If the impact is finite (losing money), a 2% chance is negligible.
  *   **The Theory:** Religious risk is unique because the Impact is *infinite* (eternal damnation vs. eternal salvation). In Expected Utility Theory, any non-zero probability multiplied by infinity is infinity. Therefore, the 2% chance is mathematically indistinguishable from a 99% chance. This explains the mismatch with his other risk behaviors: he treats religion as the only domain with infinite payoffs.

  **B. The Theological Presupposition: Orthopraxy over Orthodoxy**
  He admits he doesn't believe. Therefore, he must assume that God values *compliance* over *conviction*.
  *   **The Theory:** The deity operates on a "ticket stub" model. Showing up is the entry fee. This presupposes a God who is either:
      1.  **Bureaucratic:** Checks boxes rather than hearts.
      2.  **Easily Deceived:** Cannot distinguish between sincere faith and strategic performance.
      3.  **Contemptible:** As your uncle noted, he suspects the God might be a cosmic protection racketeer. He is paying the vig to the mob boss, not offering love to a father.

  **C. The Epistemological Presupposition: The "One God" Heuristic**
  He hedges against the Catholic God but ignores the Muslim God, the Jewish God, or the God who punishes hypocrites.
  *   **The Theory:** This relies on **Cultural Availability**. We only hedge against risks that are salient in our environment. It presupposes that the "true" God is statistically likely to be the one prevalent in your specific geography and family history. It ignores the **Many Gods Objection** (if you wager on Christ, you might offend Allah, and vice versa).

  **D. The Psychological Presupposition: Action is Voluntary, Belief is Irrelevant**
  *   **The Theory:** This sidesteps the problem of *Doxastic Voluntarism* (whether we can choose beliefs). It assumes that while you cannot choose to believe, you *can* choose to kneel. It treats religion as an insurance policy rather than a relationship.

  ### 2. Which Bits Do Different Theories License?

  Your uncle's position is a hybrid. Different philosophical frameworks license different parts of his behavior, but few license the whole package.

  | Theory | Licenses the Risk Calculation? | Licenses the Insincerity? | Licenses the "One God" Focus? |
  | :--- | :--- | :--- | :--- |
  | **Pascal's Original Wager** | **Yes.** (Infinite utility dominates.) | **No.** Pascal argued you must *become* a believer. He suggested rituals as a means to dull the passions and *generate* faith, not as a substitute for it. | **No.** Pascal was aware of the skepticism but argued for the Christian revelation specifically. |
  | **William James ("Will to Believe")** | **No.** James argued you can only believe a "live hypothesis." If your uncle thinks it's likely false, it's not "live." | **No.** James required a "passional nature." Cold calculation violates the spirit of the "Will to Believe." | **Yes.** James allowed choosing based on personal fit, which explains the cultural bias. |
  | **Decision Theory (Secular)** | **Yes.** If P > 0 and Payoff = ∞, bet is rational. | **Yes.** If the payoff is external (reward), internal state doesn't matter. | **No.** A strict decision theorist must account for all possible deities (Many Gods), which usually collapses the wager to zero. |
  | **Sociological Functionalism** | **N/A.** Doesn't care about truth. | **Yes.** Religion is social cohesion. Going to Mass signals "I am part of the tribe," which has earthly benefits (community, support). | **Yes.** You join the local tribe, not a global one. |
  | **Your Uncle's Pragmatism** | **Yes.** | **Yes.** (The key divergence.) | **Yes.** (Via cultural inertia.) |

  **The Overlap:** The only thing all these theories (except perhaps strict theology) agree on is that **ritual has utility.** Whether that utility is salvation, social signaling, or psychological comfort, they all license "going through the motions."

  **The Divergence:** Your uncle is unique in explicitly admitting the hypocrisy. Pascal thought the motions would cure the hypocrisy. Functionalists think the hypocrisy doesn't exist (it's all social signaling). Your uncle thinks the hypocrisy is real but worth the price.

  ### 3. The "Belief Is Not Up To Us" Problem

  You asked what changes if belief isn't voluntary (the consensus view in philosophy of mind: you cannot simply choose to believe the sky is green).

  **If Doxastic Involuntarism is true:**
  1.  **Pascal's Wager Fails (in its original form):** You cannot wager on belief because you cannot manufacture it on command. You cannot believe *because* it is beneficial; you believe *because* you are convinced by evidence.
  2.  **Your Uncle's Version Survives (Technically):** His strategy is immune to this because he isn't trying to believe. He is wagering on *behavior*.
  3.  **The Theological Counter:** Most Christian theology (including Catholicism, which your uncle is attending) holds that **God is Omniscient.** If belief is not up to us, God knows it. If God knows your uncle is there only for the insurance, the "ticket stub" theory collapses. A God who rewards strategic hypocrisy while punishing honest atheism is not just contemptible; he is irrational, which undermines the premise that he is the source of all truth.

  **The "Self-Signaling" Loophole:**
  There is one psychological mechanism that saves the wager even if belief is involuntary: **Self-Perception Theory.**
  *   Humans often infer their beliefs from their actions. If you act like a believer long enough, your brain may update to reduce cognitive dissonance.
  *   *What changes:* The wager shifts from "I am fooling God" to "I am fooling myself until I stop needing to." Your uncle might eventually actually believe, not by choice, but by osmosis. Pascal was banking on this; your uncle is banking on the payout before the osmosis completes.

  ### 4. Summary of the Implicit Theory

  Your uncle is operating on a theory of **Asymmetric Risk Management with a Corruptible Authority.**

  1.  **Risk:** He treats the probability of God's existence as non-zero (unlike his former atheism) but treats the *consequence* of being wrong as infinite.
  2.  **Authority:** He assumes the Divine Authority is susceptible to procedural compliance rather than moral integrity.
  3.  **Scope:** He assumes the local deity is the relevant one (ignoring the "Many Gods" problem).
  4.  **Integrity:** He accepts moral inconsistency (being a hypocrite) as a rational cost, prioritizing *outcome* over *character*.

  **The Fatal Flaw:**
  The practice presupposes that the "cost" is only one hour a week. It ignores the cost of **integrity**. If your uncle values honesty in every other part of his life, he is paying more than an hour a week; he is paying a tax on his own self-conception. He is living a lie.

  The reason people do this (weddings, baptisms, deathbeds) is not usually because they have crunched the Expected Utility numbers. It is because **ritual is a low-cost heuristic for high-anxiety situations.** When the plane drops, or death approaches, the cost of *not* praying (potential regret) feels higher than the cost of praying (minor embarrassment). It is less a wager on God's existence and more a wager on one's own future regret.

  Your uncle has rationalized a fear response into an investment strategy. It works only if God is either blind or bribable. If God is just, the trade is bad. If God doesn't exist, the trade is neutral. If God is malicious, the trade is good. He is essentially betting on the universe being a scam, and deciding to be the one guy who reads the terms and conditions.
