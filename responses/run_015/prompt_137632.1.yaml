          *   Validity Check: Must happen *before* the change takes effect to determine if it *can* take effect.
          *   Logic: To know if the change is valid, we must check the Mirror Rule. The Mirror Rule asks: "Does the Resulting Ruleset permit this?" But the Resulting Ruleset doesn't exist yet. We have to simulate it. If we simulate it, it permits it. *However*, the Continuity Camp argues the change is "impossible." Why? Because the *current* ruleset (which governs validity) includes the Mirror Rule. The Mirror Rule acts as a constraint on the *transition*. If the transition violates the spirit of continuity (changing the ground beneath your feet), it's blocked.
