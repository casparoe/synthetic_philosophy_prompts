          *   *The Block:* The Continuity Camp believes the *authority* to validate the change must come from the *current* ruleset entirely. If the current ruleset requires the new ruleset to validate the change, but the new ruleset only comes into existence *after* validation, there is a temporal paradox. They view the "permission" as needing to exist *now*. The new ruleset doesn't exist *now*. Therefore, the condition cannot be met *now*. Therefore, the change is invalid.
