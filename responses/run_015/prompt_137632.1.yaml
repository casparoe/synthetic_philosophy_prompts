      *   **Alternative Hypotheses:** Purely verbal (scope of "valid"), empirical (what makes it binding), or under-specification.
      *   **Constraints:** Do not survey literature/theory (Hart, Kelsen, etc.). Use the sides' actual arguments. Be specific about divergence. Diagnose the stalemate. Propose progress (distinction, reformulation, test case, or reason for permanent stuckness).
      *   **Tone:** Direct, analytical, aimed at the specific mess.

  2.  **Deconstruct the Arguments:**

      *   **The Mirror Rule Text (Implied):** "A change counts as valid only if the resulting ruleset, once the change has taken effect, would itself permit that change."
      *   **Bootstrapper Reading:**
          *   Timeline: Proposal -> Vote (under Old Rules) -> Enactment -> New Rules Exist.
