      *   Bootstrappers: Validity is a property of the *event* (the vote + enactment).
      *   Continuity: Validity is a property of the *rule-text* across time.
      *   *Better Diagnosis:* It's a disagreement about **Temporal Scope of Validity Conditions**. Is the Mirror Rule a constraint on the *outcome* (static) or the *process* (dynamic)?

  4.  **Evaluate Alternative Hypotheses:**
