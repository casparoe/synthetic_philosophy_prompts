      *   *The Real Stalemate:* The rules define validity *using* the outcome, but validity determines *if* the outcome occurs. This is a circular dependency that the text doesn't resolve.
      *   *Why the User's Hypothesis is partially right:* It touches on whether the "system" is the *current text* (Continuity) or the *history of play* (Bootstrappers). But the specific friction point is the **performative contradiction** inherent in the Mirror Rule.

