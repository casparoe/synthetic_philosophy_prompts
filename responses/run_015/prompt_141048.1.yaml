  This is a rigorous set of intuitions that tracks the major fault lines in bioethics without falling into the usual traps. You have effectively mapped the tension between *critical interests* (the life plan) and *experiential interests* (the current quality of life), mediated by the concept of *agency*.

  Here is the breakdown of what is settled, what is contested, and the principle that achieves equilibrium.

  ### Settled vs. Contested
  It is crucial to distinguish where the law and consensus stand versus where philosophers disagree.

  *   **Settled (Legal & Ethical Consensus):** Decision-specific capacity is the threshold for authority. A capacitous adult can refuse treatment contemporaneously (Case 5). Advance directives only trigger when capacity is lost (Case 1). Undue influence or impairment invalidates current consent (Case 3).
  *   **Contested (Philosophical Dispute):**
      *   **Dementia ADs:** This is the Dworkin vs. Dresser debate. Dworkin argues critical interests (the 25-year-old's plan) survive the loss of capacity; Dresser argues experiential interests (the 84-year-old's happiness) trump them. Your gut sides with Dresser. This is philosophically defensible but legally fragile; in many jurisdictions, the AD would hold.
      *   **Psychiatric Ulysses Contracts:** Can a capacitous self bind a future capacitous self? Most legal frameworks say no (current competence trumps). Some ethicists argue for enforceability given the cyclical nature of illness. Your sleeplessness here is warranted; the literature does not agree.
      *   **Digital/Proxy Authority:** The status of algorithmic predictions of wishes is emerging and largely unsettled.

  ### The Unifying Principle
  Your tentative principle ("correctly picked out the specific mechanism") is close, but it falters on the dementia case (where the mechanism *was* picked out, yet you ignore the directive) and the one-click case (where the mechanism wasn't the issue, but the *endorsement* was).

  The principle that spits out all your verdicts, including the resolution of your sleepless case, is this:

  **Authority resides in the current self unless agency is temporarily subverted by a specific pathology; it cannot bind a capacitous self or one whose identity has irreversibly shifted.**

  ### How This Saves Your Verdicts
  1.  **Bipolar Manic (Case 1):** Agency is temporarily subverted. **Past self wins.**
  2.  **Dementia (Case 2):** Identity has irreversibly shifted (and the condition is not reversible). **Current self wins.** (This explains why the 25-year-old's correct prediction doesn't bind; the 'self' in the bed is morally distinct due to the permanence of the change).
  3.  **Cult/Obsession (Case 3):** Agency is temporarily subverted (undue influence). **Past self wins.**
  4.  **One-Click Renewal (Case 4):** Agency is intact but not actively exercised. Passive renewal lacks the authentic endorsement required to strengthen the past directive against changing values. **Past directive remains weak.**
  5.  **Revocation at 40 (Case 5):** Agency is intact. **Current self wins.**
  6.  **AI Continuation (Case 6):** The model is not a self. It offers evidence of past values but lacks agency. **Limited weight.**
  7.  **Sleepless Case (Resolution):** The patient is euthymic and capacitous. Her agency is not currently subverted. Therefore, under this principle, **the current self wins.** She may revoke the directive.

  ### The Verdict to Overturn
  To achieve reflective equilibrium, you must overturn the intuition in the sleepless case that the psychiatric directive *might* bind. That intuition relies on a paternalistic view that contradicts your verdict in Case 5 (the 40-year-old revoking the 20-year-old's plan). Both are instances of a capacitous self changing their mind about a prior life plan. If the 40-year-old can prioritise their children over their 20-year-old's x-risk ideals, the euthymic patient can prioritise their current quality of life over their prior self's risk assessment. The risk of future mania is a clinical concern to be managed, not a contract to be enforced against a competent adult.

  ### Prediction on the Continuation Case
  Your principle predicts the AI case correctly: the model gets weight as *evidence* of the past self's values (similar to the one-click renewal), but it cannot override the current self's expressed will or a family's proxy decision unless the current self lacks capacity. It is a sophisticated witness, not a principal.

  \answer{A prior directive binds only when the current self's agency is temporarily compromised by a specific pathology; otherwise, the current self's will prevails.}
