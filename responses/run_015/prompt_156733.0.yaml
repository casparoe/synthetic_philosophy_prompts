      *Better Idea:* The "Border" problem. Where does my consciousness stop? At my skin? At my neurons? Exclusion says: At the boundary of the Max-$\Phi$ complex.

      *Let's finalize the "Kill Switch".* The hidden dependency is the **Causal Structure vs. Physical Structure** distinction. If they think the *physics* causes consciousness rather than the *causal relations*, the diode example fails because they'll focus on the silicon, not the logic.

