      *   *Step 4:* Exclusion. (This is where Panpsychism gets nuanced).
      *   *Check Question:* Focus on Exclusion as requested.
      *   *Kill Switch:* The "Intrinsic" leap. If they can't make the leap from 3rd person to 1st person perspective, IIT is just functionalism to them.

  10. **Final Polish:** Ensure tone is appropriate for a peer-led study session (collaborative, Socratic, not lecturing). Make sure the "Photodiode Paradox" is framed correctly (it's a challenge *to* IIT that IIT answers via Exclusion/Degrees).

      *(Self-Correction on the Photodiode)*: In IIT 3.0, a single photodiode with feedback has $\Phi > 0$. Tononi admits this implies a minimal form of experience. The "Paradox" is usually used by *critics* (like Koch or Searle) to say IIT is absurd. So, the session should frame it as: "Critics use the diode to attack IIT. Let's see how IIT defends itself using its postulates." This is more philosophically honest.

