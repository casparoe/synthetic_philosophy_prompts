answer: |-
  Here is a battle plan for your Phil 340 session. Since you are dealing with first-years, the goal is to prevent IIT from sounding like "magic math" and keep it grounded in the metaphysical commitments.

  ### 1. The Dependency Order (The Arc)
  You cannot start with Exclusion, and you cannot skip Intrinsic. The logic of IIT is cumulative; each postulate restricts the previous one. If you change the order, the Photodiode Paradox loses its bite.

  **Recommended Sequence:**
  1.  **Intrinsic Existence:** (The "For Itself" constraint).
      *   *Why first?* Before asking *how much* consciousness (Integration), you must establish *who* it is for. If the system doesn't exist for itself, $\Phi$ is just an external measurement (like temperature), not experience.
  2.  **Information:** (The "Specific" constraint).
      *   *Why second?* The system must be in a *specific* state out of many possibilities. A photodiode distinguishes Light vs. Dark.
  3.  **Integration:** (The "Unified" constraint).
      *   *Why third?* This is the killer. The information must be indivisible. This is where you introduce the feedback loop requirement.
  4.  **Exclusion:** (The "Definite" constraint).
      *   *Why last?* Now that we know how to find a conscious complex, Exclusion tells us *which* complex is the subject when systems overlap. This resolves the "where does my mind end?" question.

  **Can you work backward?** No. If you start with Exclusion, students will ask "Exclude *what*?" You need to build the "what" (the complex) first via Integration and Information.

  ### 2. The Carrying Example: The Photodiode
  **Crucial Decision:** The photodiode **must include a feedback loop** (however trivial).

  *   **Why:** In strict IIT, a feedforward photodiode (Light $\to$ Diode $\to$ Output) has $\Phi = 0$. It has no internal cause-effect power over its own state. If you use a feedforward diode, the paradox vanishes immediately ($\Phi=0$, so not conscious), and you lose the tension.
  *   **The Setup:** Describe a "Diode + 1-bit Memory" where the current state depends on the previous light input *and* the previous memory state. This creates a recurrent circuit.
  *   **What it must have:** Recurrent connectivity (feedback).
  *   **What it must lack:** Richness of repertoire. It only distinguishes 2 states (On/Off), whereas a brain distinguishes billions.
  *   **The Lesson:** This allows you to say, "IIT actually admits the diode has a *tiny* spark of experience (panpsychism leanings), but Exclusion explains why *you* don't feel it."

  ### 3. Intercepting Misconceptions
  Don't wait for Q&A. Head these off during specific postulates.

  **Misconception A: "$\Phi$ is just wiring complexity."**
  *   **When to kill it:** During **Integration**.
  *   **The Move:** Draw a hard drive next to the photodiode. The hard drive has way more "wiring" and bits. But it is feedforward (modular). Show that you can cut the hard drive in half without losing information flow, but you can't cut the feedback loop without destroying $\Phi$.
  *   **The Line:** "Complexity is about how many parts you have. Integration is about how much you *need* all of them to be you."

  **Misconception B: "IIT proves Panpsychism (everything is conscious)."**
  *   **When to kill it:** During **Exclusion** (and Intrinsic).
  *   **The Move:** Use the Exclusion postulate to introduce the concept of **Local Maxima**.
  *   **The Line:** "IIT doesn't say everything is conscious. It says consciousness exists only at the *peak* of causal power. A molecule has low $\Phi$. A brain has high $\Phi$. Exclusion says the brain 'wins' and the molecules inside it don't have separate consciousnesses. It's not 'everything is conscious,' it's 'only the maximums are subjects.'"

  ### 4. The Whiteboard Check-Question (Exclusion)
  Do not ask "What does Exclusion mean?" They will parrot "It picks the max." Ask a boundary question.

  **The Question:**
  > "Imagine a conscious brain (System A). We attach a perfect, bi-directional simulation of that brain (System B) via a cable. Together, A+B form a larger system with a higher $\Phi$ than A alone. According to Exclusion, **who is having the experience?**"

  **The Correct Answer:**
  The combined system (A+B) is the conscious subject. System A *ceases* to be a subject on its own because it is no longer the *maximum* of integrated information. (This is the "Hive Mind" implication of IIT).

  **The Fail Answer:**
  "Both are conscious" or "Only A is conscious." (This shows they view consciousness as additive or static, rather than exclusive to the local maximum).

  ### 5. What to Openly Refuse to Explain
  **The Cause-Effect Repertoire Calculus.**
  *   **The Refusal:** "We are not doing the matrices today. We are not calculating the MIP (Minimum Information Partition). If you want the math, take the grad seminar. Here, we care about the *logic* of the postulates."
  *   **Why:** First-years will get bogged down in trying to understand how to perturb the system. It distracts from the philosophical payload (the nature of existence). Treat $\Phi$ as a black-box metric for "indivisible causal power."

  ### 6. The Kill Switch (Hidden Dependency)
  **The Risk:** The **"Intrinsic" Leap**.

  **Why the arc collapses:**
  IIT is not functionalism. It claims consciousness is *intrinsic existence*. First-years are trained in physicalism/functionalism (consciousness is what the brain *does*).
  *   **The Hidden Dependency:** If your students cannot grasp the difference between **3rd-person observation** (I see the diode light up) and **1st-person existence** (It feels like something to be the diode), the session fails.
  *   **The Collapse:** If they treat $\Phi$ as just another external variable (like heat or mass) that we measure from the outside, they have missed the entire point of the *Intrinsic Existence* postulate. They will walk away thinking IIT is just "Brain Activity 2.0."
  *   **How to test this early:** Before starting the postulates, ask: "If we measure a system's $\Phi$ from the outside, does that create the consciousness?" (Answer: No, the consciousness is the system existing for itself; the measurement is just us checking). If they say "Yes," stop and fix the metaphysics, or the rest of the hour is wasted.

  **Summary Plan:**
  1.  **Hook:** Photodiode with feedback. (Is it conscious?)
  2.  **Intrinsic:** Does it exist for itself? (Metaphysics check).
  3.  **Integration:** Is it indivisible? (Kill the "wiring complexity" myth).
  4.  **Exclusion:** Is it the maximum? (Kill the "panpsychism" myth + Whiteboard Check).
  5.  **Close:** IIT implies consciousness is a degree, not a binary, but Exclusion keeps it definite.
