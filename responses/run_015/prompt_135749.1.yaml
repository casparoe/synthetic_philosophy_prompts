answer: |-
  ## Session Design: The Trap of Rational Escalation

  ### 1. Materials and Setup

  **Room Layout:**
  *   11 desks arranged in a semi-circle (2 students per desk).
  *   Front of room: Facilitator table, visible timer, "Current Bid" whiteboard.
  *   **Token Economy:**
      *   **Endowment:** 2,000 "Course Points" (CP) per student (4,000 per desk).
      *   **Prize Value:** 600 CP (fixed for all rounds).
      *   **Minimum Increment:** 50 CP.
      *   **Conversion:** At the end of class, total CP determines raffle entries for a **$50 Amazon Voucher**.
          *   1 Entry per 200 CP held.
          *   Negative CP = 0 Entries (but no real monetary debt).
          *   *Psychological Hook:* Announce that the top 3 desks by CP balance get a "Homework Pass" (exemption from one short assignment). This creates a secondary incentive to hoard tokens beyond the raffle.

  **Physical Props:**
  *   **Bidding Paddles:** 2 per desk (labeled A and B).
  *   **Prediction Slips:** 1 per observing desk per round (asks: "At what CP value will bidding stop?").
  *   **Commitment Cards:** Sealed envelopes for Round 4.
  *   **Relay Flag:** A small red flag placed on desks during Round 2 to indicate "Active Bidder" status switches.

  ### 2. The Rules (Handout provided at start, read aloud briefly)

  1.  **The Auction:** Two desks compete for a prize worth 600 CP.
  2.  **The Cost:** The highest bidder pays their bid and gets the prize (600 CP). The **second-highest bidder pays their bid and gets nothing.**
  3.  **The Increment:** Bids must increase by at least 50 CP.
  4.  **The End:** Bidding ends when one desk declines to bid.
  5.  **Observation:** Non-bidding desks must submit a prediction of the final winning bid before each round starts. Accurate predictions (within 100 CP) earn 50 bonus CP.

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Endowment**
  *   Distribute tokens and rule sheets.
  *   **Crucial:** Do *not* mention "sunk cost," "escalation," or "rationality." Describe it as a "market mechanism exercise."
  *   Explain the Raffle and Homework Pass incentives.

  **00:10 – 00:25: Round 1 (Baseline Dollar Auction)**
  *   **Active Desks:** 1 & 2.
  *   **Observers:** Desks 3–11 submit predictions.
  *   **Action:** Run standard open-outcry auction.
  *   **Goal:** Establish the baseline escalation. Expect bidding to pass 600 CP.
  *   **Stop:** When one desk folds. Record final bids.

  **00:25 – 00:40: Round 2 (The Relay Variant)**
  *   **Active Desks:** 3 & 4.
  *   **New Rule:** Each desk has two partners (Student A and Student B). Student A starts. **Once the total bidding exceeds the Prize Value (600 CP), Student B must take over the paddles for that desk.**
  *   **Observers:** Submit predictions. Note: "Does knowing a partner will take over change your prediction?"
  *   **Goal:** Test if escalation is driven by *personal* justification ("I started this") or *structural* trap ("I am now the highest bidder").
  *   **Debrief Note:** If Student B continues bidding, the trap is structural. If Student B folds immediately, the trap is psychological/ego-based.

  **00:40 – 00:55: Round 3 (The Fixed-Horizon Variant)**
  *   **Active Desks:** 5 & 6.
  *   **New Rule:** **Exactly 4 Rounds of Bidding.**
      *   Rounds 1–3: Standard rules (Runner-up pays).
      *   Round 4 (Final): Highest bidder pays bid and wins. **Runner-up pays NOTHING.**
  *   **Theory Check:** This modification allows backward induction to theoretically work (see *Frank Note* below).
  *   **Goal:** Demonstrate that with a known end and removed penalty, rational actors should not escalate past value. Contrast this with Round 1.
  *   **Observers:** Submit predictions.

  **00:55 – 01:00: Pre-Commitment Phase**
  *   **Active Desks:** 7 & 8 (for Round 4).
  *   **Action:** Before Round 4 begins, all desks (including observers) write a "Stop Limit" on a card and seal it in an envelope.
  *   **Rule:** The Facilitator will enforce this limit. If the bidding reaches your limit, your desk is automatically disqualified from that auction.
  *   **Goal:** Test Ulysses-style self-binding.

  **01:00 – 01:15: Round 4 (Pre-Commitment Auction)**
  *   **Active Desks:** 7 & 8.
  *   **Action:** Run auction. Facilitator watches the sealed limits. If a desk tries to bid past their limit, the Facilitator declares them "Bound" and they must fold.
  *   **Observers:** Submit predictions.

  **01:15 – 01:30: Debrief & Theory Mapping**
  *   Tally tokens (rough count is fine for the raffle, exact numbers not needed for discussion).
  *   Discuss the four rounds using the mapping below.

  ### 4. Debrief Mapping (30 Minutes)

  **Part 1: The Rationality of the Step (10 mins)**
  *   *Focus:* Round 1.
  *   *Ask:* "At 650 CP, you are already losing 600 (your previous bid). Why bid 700?"
  *   *Lesson:* Elicit that the comparison is not "600 vs 0" (sunk cost) but "700 bid (win 600, net -100) vs 650 bid (lose 650, net -650)."
  *   *Point:* The individual bid is locally rational. The error is in the **policy of entry**, not the specific move. This distinguishes *procedural rationality* from *substantive rationality*.

  **Part 2: Structure vs. Psychology (10 mins)**
  *   *Focus:* Round 2 (Relay).
  *   *Ask:* "Did the partner who inherited the bid fold? If not, why?"
  *   *Lesson:* If they continued, it proves the trap is **structural** (the payoff matrix forces escalation), not just psychological (ego/sunk cost). The "Sunk Cost Fallacy" label is insufficient; the game *rewards* escalation once entered.
  *   *Ask:* "Did observers predict the Relay would stop sooner?" (Likely yes). Discuss the gap between third-party rationality and first-party pressure.

  **Part 3: Backward Induction & Common Knowledge (5 mins)**
  *   *Focus:* Round 3 (Fixed Horizon).
  *   *Ask:* "Did bidding stop earlier than Round 1?"
  *   *Lesson:* Explain that removing the runner-up penalty in the final round *should* theoretically stop escalation via backward induction. If it didn't, discuss **Common Knowledge of Rationality**. You know you should stop, but you don't know if *they* know *you* know.
  *   *See Frank Note for theoretical nuance.*

  **Part 4: Pre-Commitment (5 mins)**
  *   *Focus:* Round 4.
  *   *Ask:* "Who set a limit? Who stuck to it? Did the limit help?"
  *   *Lesson:* Rational agents should pre-commit. But pre-commitment is only useful if binding. Discuss the tension between *flexibility* (good in changing environments) and *binding* (good in trap environments).

  ### 5. Troubleshooting: What Will Go Wrong

  1.  **The "Collusion" Problem:**
      *   *Risk:* Two desks agree (tacitly or explicitly) to bid 50 CP and stop, splitting the profit.
      *   *Fix:* If bidding stops suspiciously early (e.g., 100 CP), declare the round void and rerun with a new pair. Announce beforehand: "If the final bid is below 400 CP, the prize is voided." This forces competition.
  2.  **The "Relay Fold" (Round 2):**
      *   *Risk:* Partner B takes over and immediately folds, even at a loss.
      *   *Response:* This is actually *good data*. It suggests the escalation in Round 1 was psychological (ego/ownership). Highlight this contrast in the debrief. "So the trap isn't absolute? It depends on the agent?"
  3.  **The "No Escalation" (Round 1):**
      *   *Risk:* Bidding stops at 550 CP.
      *   *Response:* The stakes aren't high enough or the group is too risk-averse.
      *   *Fix:* Have a "House Match" ready. If students won't escalate, you (the instructor) step in as a bidder for one desk. You will escalate irrationally to demonstrate the trap. (Use sparingly).
  4.  **The "Resentment" Problem:**
      *   *Risk:* A student loses 1,500 CP and feels cheated.
      *   *Fix:* Remind them of the "Homework Pass" for top balances. Even with a loss, if they started with 2,000, they likely have enough for a raffle ticket. Emphasize that the *lesson* is the payoff, not the voucher.

  ### 6. Frank Note: Theoretical Limitations & The "Fixed Round" Claim

  **You asked:** *"I have been told that with such a cap backward induction unravels the game and nobody should enter... please tell me whether the contrast is right."*

  **The Honest Answer:** **No, the claim is technically false for the standard Dollar Auction.**
  In a standard Dollar Auction, even with a fixed number of rounds, the "second-highest payer" rule creates a trap that does not cleanly unravel via backward induction unless the rules change at the end. If the last bidder still faces a penalty for being second, they will bid to avoid it, regardless of the round cap.

  **How I Fixed This in Round 3:**
  I modified Round 3 so that **in the final round, the runner-up penalty is waived.**
  *   *Why:* If the penalty is waived in Round 4, a rational player in Round 4 will only bid if `Bid < Prize`. Knowing this, a rational player in Round 3 knows they cannot be trapped in Round 4. This allows the backward induction to hold.
  *   *Warning:* If you run a fixed-round auction *without* waiving the penalty in the final round, the unraveling will not happen, and you will be teaching false game theory. **Do not assert that a simple round-cap stops escalation.** Assert that a *known endpoint with modified terminal payoffs* allows for induction.

  **What This Game Cannot Reproduce:**
  1.  **Real Financial Ruin:** Tokens are painless compared to real debt. Students may treat this as a "game" rather than a "decision." You must supply the gravity in the debrief by describing real-world analogues (bidding wars for startups, litigation spirals, arms races).
  2.  **Reputation:** In the real world, folding early might signal weakness to other competitors. In this classroom, folding is private. You need to mention that in industry, "not backing down" has external value that the model ignores.
  3.  **Time Pressure:** Real escalation often happens under fatigue or time pressure. This seminar is low-stress. Remind them that cognitive load makes the structural trap harder to escape.

  ### 7. Instructor Script for the "Fixed Round" Theory (Round 3 Intro)

  *"In this round, we are capping the auction at 4 bids. However, there is a twist: In the 4th bid, the runner-up does not pay. Think about how that changes the decision at the very end, and how that knowledge travels back to the first bid."*

  (This protects you from asserting a falsehood while still testing their intuition about finite horizons.)
