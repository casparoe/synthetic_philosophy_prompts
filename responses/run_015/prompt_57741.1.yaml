answer: |-
  Good evening. I know what you are thinking. You are looking at a man who earns his living reading dead Irish bishops, and you are wondering what I can possibly tell a plumber, a baker, or a haulier about making a town work again. If a pipe bursts in this hall, I am not the person you want. I cannot fix a leak, and I cannot bake a loaf. But I do understand tickets.

  We are gathered here on Friday the fourteenth. Some of you might superstitiously worry about the date. But if this scheme works, it will be because we stopped waiting for luck and started making our own.

  You have been asked to accept these credits. I know the question sitting in the back of your minds. I know the question the reporter from the county paper has already printed. You want to know what stands behind this money. You want to know what reserve guarantees it. The answer is nothing. There is no gold in a vault. There is no promise from a distant bank. There is only this room.

  I am here to tell you that this is not a weakness. It is the only way money ever works. Two hundred years ago, George Berkeley argued that money is not wealth. It is a counter. It is a ticket whose only purpose is to be handed on. The real wealth is not the ticket. The real wealth is the fertile land outside this hall, and the industry of the people sitting in it. The ticket is merely the signal that sets that industry in motion. If you wait for something to back the ticket, you will wait forever. The ticket backs the work, not the other way around.

  The reporter here has called these credits "play money." In a sense, he is right. They are tokens. But do not let the word "play" fool you. We live our lives by tokens that do not resemble the things they command. When I speak to you now, you understand me. You do not have a picture of my idea in your head. You hear sounds, marks on the air, and you act on them. You trust the sign without seeing the thing. Berkeley wrote extensively on this. We reason with tokens every day. We stop at a red light not because the color red physically stops a car, but because we agree on what the sign means.

  These credits are the same. They do not need to look like bread or plumbing to bind you to one another. They only need to be accepted as the signal that bread and plumbing are owed. If you accept the token, you accept the work. That is the only backing required.

  Berkeley understood this. He lobbied the Irish parliament for a national bank built on exactly these principles. He wanted a public institution to issue tickets against the land and labor of the nation. He got nowhere. The legislature refused him. He failed. But he failed because he knocked on the wrong door. He looked for authority in a parliament that did not trust the people. He looked for power in a building full of strangers.

  Here, the authority is not in a building. It is in this room.

  This is the gap between his scheme and ours, and we must be plain about it. Berkeley wanted a legislature to limit the quantity of tickets issued. He knew that if you issue too many, the signal loses meaning. If you issue too few, the work stops. In a national bank, strangers decide that balance. In this cooperative, you decide it. You are the legislature. Every time you issue a credit to a neighbor for a job done, you are voting on the volume of money in this town. If you issue credits without doing the work, you break the trust. If you refuse to accept credits for work done, you stop the flow. The authority is not an abstraction. It is the sum of your daily decisions. Keeping the volume proportioned to the trade is not a job for an economist in a university. It is your job. It is the price of owning the system.

  Now, we have a rule that some of you find difficult. If you hold a balance idle for a full year, it loses a small percentage of its value. I know why this rule sits hard with some of you. Specifically, I know why it sits hard with the retired mill workers in the back. You remember when the mill closed. You remember saving for security. You remember what it is to need a store of value that does not decay.

  I will not soften this. This rule makes saving difficult. It means these credits are not a safe place to hide wealth for a rainy day. If you hoard them, they rot. I acknowledge that cost. It is real. But Berkeley would argue that money that never moves is not money at all. It is a blocked pipe. If you hold the ticket and do not pass it, you are stopping the work of the baker, the childminder, the plumber. The decay is not a penalty; it is a reminder that the ticket's only life is in movement. We chose movement over storage. We chose to prioritize the neighbor who needs work now over the account that needs safety later. I cannot tell you that is easy. I can only tell you it is necessary for the machine to turn.

  So, what happens when the lights go out tonight? The economists here will watch the numbers. The councillors here will watch for failure. The reporter will watch for a story. But none of them will make this work.

  This system does not run on faith. It runs on transactions. It runs on the understanding that a sign is enough to bind us, provided we are willing to be bound.

  On Monday morning, do not wait for permission. Offer what you can do, and ask for what you need, using the tickets in your hand.
