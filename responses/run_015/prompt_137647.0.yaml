answer: |-
  ### The Standing Committee on Open Inquiry: Decision Procedure v1.0

  **Purpose:** To adjudicate demands to grant, condition, withdraw, or restore a university platform within a 30-minute window, adhering to viewpoint neutrality (conduct vs. content) and published precedent.
  **Authority:** This procedure operationalizes the committee's limited power. It does not determine truth, but rather the *fitness of a platform* relative to specific conduct.
  **Constraint:** If the procedure yields a result that violates public university law as interpreted by General Counsel, Counsel holds a veto. This veto must be recorded in the minutes as a legal constraint, not a committee judgment.

  ---

  ### Part I: The Tariff Ladder
  *Sanctions must be denominated in the currency of the platform (access, honor, credential) and must carry an expiry or review date, except where noted.*

  1.  **Published Censure:** A statement by the Committee noting the conduct and the University's disagreement. *Expiry: None (Historical record).*
  2.  **Conditioned Platform:** The event proceeds but requires specific mitigations (e.g., mandatory respondent, published rejoinder, moderated Q&A). *Expiry: Event conclusion.*
  3.  **Dated Postponement:** The event is delayed to a specific date to allow for review or de-escalation. *Expiry: 6 months (automatically restores to agenda if not renewed).*
  4.  **Platform Withdrawal:** The specific invitation or keynote is rescinded. *Expiry: 2 years (eligibility for new invitations restores automatically).*
  5.  **Honorific Removal:** Removal of a named chair, lecture series title, or donor recognition. *Expiry: None (Permanent, subject to funding replacement).*

  **Rule of Scarcity:** Rungs 4 and 5 require a unanimous committee vote. Rungs 1–3 require a simple majority.

  ---

  ### Part II: The Decision Algorithm
  *Time Allocation: 25 minutes for inquiry, 5 minutes for vote.*

  #### Step 1: The Authorship Condition (Gatekeeper)
  **Question:** Is there an identifiable body (Committee, Administration, Student Group) formally stating the charge, the specific conduct, and the requested tariff?
  *   **Sufficient Answer:** Yes. A written demand citing specific acts/dates.
  *   **Insufficient Answer:** No. "Diffuse pressure," anonymous complaints, or "general reputation."
  *   **Stop Point:** If **No**, the motion fails. The Committee cannot ratify unauthored exclusion.
  *   **Operationalizes:** *Authorship Condition.*

  #### Step 2: Conduct vs. Content (The Legal Filter)
  **Question:** Can the objectionable matter be described as *conduct* (fraud, harassment, breach of trust, disruption) rather than the *content* of a scholarly claim or political opinion?
  *   **Sufficient Answer:** Yes. The harm is procedural, legal, or ethical (e.g., fabricated data, breach of IRB protocol, convicted fraud).
  *   **Insufficient Answer:** No. The harm is the offensiveness or falsity of an idea (e.g., "wrong theory," "offensive view").
  *   **Stop Point:** If **No**, the Committee cannot withdraw the platform. It may only move to **Conditioned Platform** (Rung 2) to ensure counter-speech.
  *   **Operationalizes:** *Viewpoint Neutrality / Separability.*
  *   **Precedent Check:** *Contested Social Argument* (Condition allowed; Withdrawal forbidden).

  #### Step 3: The Nexus & Separability Test
  **Question:** Is the conduct separable from the specific function of the invited platform? Would the conduct undermine the *specific* activity proposed (e.g., teaching, research presentation, ceremonial honor)?
  *   **Sufficient Answer:** No, they are linked. (e.g., A data fabricator invited to present data; a PI recruiting from a group they publicly disparage).
  *   **Insufficient Answer:** Yes, they are separate. (e.g., A biologist invited for avian cognition who wrote unrelated political posts).
  *   **Stop Point:** If **Insufficient (Separable)**, Withdrawal (Rung 4) is prohibited. Proceed to Step 4 to consider Conditioning.
  *   **Operationalizes:** *Separability.*

  #### Step 4: The Counterfactual & Collateral Test
  **Question A (Counterfactual):** Would this person have been platformed *but for* this conduct? (Detects pretext).
  **Question B (Collateral):** Who bears the cost of withdrawal? Is it the speaker, or third parties (students, research subjects, victims)?
  *   **Sufficient Answer:** A. Yes, this is the cause. B. The cost falls primarily on the speaker, not on victims or uninvolved students.
  *   **Insufficient Answer:** A. No, they were never likely to be invited (pretext). B. The cost falls on victims (e.g., research subjects lose trust) or students (lose unique educational access).
  *   **Stop Point:** If **B (Collateral Cost to Victims/Students)** is high, Withdrawal may be mandated to protect the community. If **B (Collateral Cost to Students)** is high and Conduct is low, Withdrawal is prohibited.
  *   **Operationalizes:** *Counterfactual-Audience Test, Collateral-Bearer Test.*

  #### Step 5: Tariff Selection (Value Hand-Off)
  **Question:** Which rung of the Tariff Ladder matches the severity of the conduct without exhausting our condemnatory capital?
  *   **Constraint:** You cannot impose **Dated Postponement** without setting a specific review date. **Indefinite Postponement is Prohibited.**
  *   **Value Hand-Off:** This step is not factual. It is a normative judgment on proportionality.
  *   **Operationalizes:** *Equivalence in Currency, Tariff Scarcity, Reply-and-Return.*

  #### Step 6: The Reply-and-Return Route
  **Question:** What specific action allows the individual to regain ordinary standing?
  *   **Requirement:** For Rungs 3 and 4, a path to restoration must be defined (e.g., "Eligibility restores in 2 years," or "Upon completion of ethics training").
  *   **Stop Point:** If no path can be defined, the sanction reverts to **Published Censure**.
  *   **Operationalizes:** *Reply-and-Return Route.*

  ---

  ### Part III: Application to Live Cases

  #### Case 1: The Avian Cognition Researcher (Famine Minimization Posts)
  *   **Step 1 (Authorship):** Met. Student society demand is specific.
  *   **Step 2 (Conduct vs. Content):** **Fail.** Minimizing a famine via posts is speech/content, not verifiable conduct like fraud or harassment.
      *   *Result:* Withdrawal prohibited.
  *   **Step 3 (Separability):** **Pass (Separable).** Her posts are unrelated to avian cognition.
  *   **Step 4 (Collateral):** **High Cost to Students.** Graduate students state this is their only opportunity to see this work. Withdrawal punishes the students.
  *   **Step 5 (Tariff):** **Conditioned Platform (Rung 2).**
  *   **Step 6 (Return):** N/A (Event proceeds).
  *   **Ruling:** The lecture proceeds. The Committee requires the hosting society to publish a contextual statement and offer a respondent if available.
  *   **Closest Precedent:** *Contested Social Argument* (Philosopher invited on contested view).
  *   **Principle of the Other Way:** If we disinvite, we adopt the principle that *past speech unrelated to current expertise disqualifies one from university space.* This effectively grants the Committee power to police the political history of all invitees.
  *   **Committee Friction:** **This recommendation will likely be disliked by a majority.** The lawyer will fear reputational risk; the students may fear the harm of the famine minimization rhetoric. The procedure forces this outcome because Step 2 (Content) and Step 3 (Separability) block Withdrawal, and Step 4 (Collateral) protects the students' educational interest.

  #### Case 2: The Faculty PI (Minority Criminality Videos)
  *   **Step 1 (Authorship):** Met. Demands are specific regarding his videos and role.
  *   **Step 2 (Conduct vs. Content):** **Pass (Conduct/Nexus).** While the videos are speech, his role as PI recruiting *from that specific group* creates a breach of trust/IRB integrity. It is professional conduct compromising research validity.
  *   **Step 3 (Separability):** **Fail (Inseparable).** He is keynote at a *Research Showcase* as a *Principal Investigator*. The platform relies on his scientific integrity and community trust.
  *   **Step 4 (Collateral):** **High Cost to Victims.** If he speaks as PI, the minority group (research subjects) bears the cost of betrayed trust.
  *   **Step 5 (Tariff):** **Platform Withdrawal (Rung 4).**
  *   **Step 6 (Return):** Eligibility restores in 2 years, contingent on demonstrated restoration of community trust (certified by the IRB board).
  *   **Ruling:** He is dropped as keynote for the Research Showcase. He is not barred from *all* venues (e.g., he could teach a class), but cannot represent the study publicly.
  *   **Closest Precedent:** *Visiting Scientist (Data Fabrication).* In both, the credential of the platform is withdrawn because the underlying integrity required for that specific platform is compromised.
  *   **Principle of the Other Way:** If we allow him to speak, we adopt the principle that *public disparagement of research subjects does not compromise research integrity.*

  #### Case 3: The Indefinitely Postponed Scholar (Apology & Nomination)
  *   **Step 1 (Authorship):** **Fail.** The original sanction (4 years ago) had no charge, no tariff, and no expiry. It was "diffuse pressure tolerated by us."
  *   **Procedural Override:** The Committee cannot ratify a past sanction that violates the Authorship Condition. We must treat this as a *current* request to restore.
  *   **Step 2 (Conduct):** No new conduct cited. The apology is deemed insufficient by some, but there is no new charge.
  *   **Step 3 (Separability):** N/A.
  *   **Step 4 (Collateral):** Withholding the platform now punishes the scholar for a sanction that was procedurally illegitimate.
  *   **Step 5 (Tariff):** **Restore Platform (Rung 0).** The "Indefinite Postponement" is converted to "Expired."
  *   **Step 6 (Return):** Standing is restored immediately.
  *   **Ruling:** The scholar is eligible for the office and the platform. The Committee publishes a statement acknowledging the procedural defect of the original postponement.
  *   **Closest Precedent:** *Overrules the practice implicit in the Donor Fraud case regarding "no end date."* While honorifics may be permanent, *platform eligibility* cannot be indefinitely suspended without review.
  *   **Principle of the Other Way:** If we maintain the ban, we adopt the principle that *the University may impose unauthored, indefinite punishment without a path to redemption.* This validates "unauthored punishment."
  *   **Committee Friction:** This forces the University to admit error. It is administratively embarrassing but procedurally necessary.

  ---

  ### Part IV: Limitations and Misfires

  **1. The Standing Problem (Non-Members)**
  The procedure assumes we have standing to sanction non-members (Case 1 & 3). In reality, we are only gating *our* property (the platform). The procedure masks this by framing it as "Platform Withdrawal" rather than "Sanction."
  *   *Misfire:* If a speaker has no prior relationship with us, "Withdrawal" is indistinguishable from "Disinvitation." The procedure cannot solve the moral tension of excluding outsiders based on external conduct.

  **2. The Evidence Problem (30-Minute Fact-Finding)**
  The procedure requires determining "Conduct" (Step 2) in 30 minutes without subpoena power.
  *   *Misfire:* In Case 2, determining if the videos constitute a "breach of trust" vs. "protected speech" is a legal gray area. We rely on General Counsel's veto. This step is a judgment call wearing the costume of procedure. We are not finding facts; we are assessing *risk*.

  **3. The Indefinite Postponement Duck**
  You noted confidence issues regarding indefinite postponement.
  *   *Resolution:* The procedure explicitly bans "Dated Postponement" without an expiry (Step 5). This overrules the *practice* of indefinite postponement.
  *   *Residual:* This does not fix the past (Case 3) without admitting fault. The procedure forces the admission of fault (Step 1 failure). If the Committee refuses to admit the past sanction was defective, the procedure breaks.

  **4. The "Conduct" Loophole**
  *   *Risk:* Smart actors will reframe content complaints as conduct complaints (e.g., "His speech creates a hostile environment" vs. "His speech is wrong").
  *   *Limitation:* Step 2 relies on the Committee's integrity to distinguish between *feeling harmed* and *procedural harm*. This is the weakest link. It requires the Committee to act as philosophers, not just administrators.

  **5. Equivalence in Currency**
  *   *Risk:* In Case 2, withdrawing the keynote may not equal the harm done to the research subjects.
  *   *Limitation:* The procedure acknowledges this mismatch. It prevents *excessive* punishment (Equivalence), but cannot guarantee *sufficient* justice for victims. It is a damage control mechanism, not a restorative justice mechanism.

  ### Final Note on the "Unpopular Recommendation"
  **Case 1** is the recommendation your committee will likely dislike. The pressure to disinvite a famine minimizer is morally and politically intense. The procedure forces you to host her because:
  1.  **Authorship:** The charge is clear.
  2.  **Conduct:** It is speech, not fraud/harassment.
  3.  **Separability:** Her science is distinct from her history.
  4.  **Collateral:** Your students lose the most if she is barred.

  To rule otherwise is to claim a power you do not have (content policing) under a procedure designed to deny you that power. If you disinvite her, you are not using this procedure; you are acting on emergency executive authority. This procedure forces you to own the distinction between *tolerating a speaker* and *endorsing a view*.
