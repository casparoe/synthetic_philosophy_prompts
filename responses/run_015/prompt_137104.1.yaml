  2.  **Deconstruct Adam Smith's *The Theory of Moral Sentiments* (TMS):**
      *   *Sympathy:* Not just pity. It's "fellow-feeling." It requires imagination. I must place myself in *your situation*. Crucially, Smith says we sympathize more with the *causes* of passion than the passion itself. (e.g., We sympathize with the grief of a madman only if we understand the cause, even if the grief is excessive).
      *   *Propriety:* The concord of sentiments. The sufferer lowers emotion to what the spectator can enter into; the spectator raises emotion to meet the sufferer. This negotiation *is* the moral act.
      *   *The Impartial Spectator:* The internalized voice of conscience. Built from actual social interactions. It judges propriety.
      *   *Desire for Praise:* We want to be "taken notice of." Wealth and rank are pursued to be observed.
