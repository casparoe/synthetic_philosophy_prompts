answer: |-
  Professor H.'s verdicts reveal a tension between protecting autonomy and respecting the reality of constrained choices. To predict her ruling, we must isolate the principle that distinguishes the invalid cases (1, 4, 8) from the valid ones (2, 3, 5, 6, 7).

  Three candidate principles emerge. First, a **Transactional Source Principle**: consent is invalid only if the counterparty (or their direct agent) deceives or coerces regarding the transaction's terms. This fits Case 1 (Dr. R.'s agent) and Case 4 (partner), while allowing Case 2 (tobacco funding) and Case 5 (poverty) as external factors. Second, a **Reasons-Responsiveness Principle**: consent is invalid if the agent's will is based on material falsehoods, regardless of source. This fits Case 8 (risk misunderstanding) but struggles with Case 2 (where undisclosed facts changed reasons but consent remained valid). Third, a **Clinical Integrity Principle**: consent is invalid if any member of the clinical team misrepresents medical facts material to the choice, because the patient relies on the institution's epistemic authority, not just the surgeon's.

  The Clinical Integrity Principle best explains the corpus. It accounts for Case 1 (fellow as team) and Case 8 (form as institutional communication) without collapsing into the Reasons-Responsiveness view, which would invalidate Case 2 (where reasons were affected by undisclosed funding). It also respects the hard-choice precedents (5, 6) by distinguishing external pressures from internal clinical misrepresentation. The Transactional Source Principle is too narrow; it cannot easily explain why the jargon-filled form (Case 8) invalidates consent if the surgeon didn't personally write it, whereas the Clinical Integrity view treats the hospital apparatus as a unified source of medical truth.

  Consequently, I predict Professor H. will rule the consent **invalid**. Although the surgeon was ignorant, the nurse is a member of the clinical team, and the lie concerned medical necessity—the core of the treatment choice. Unlike the tobacco funding (Case 2), which was external to the medical act, the urgency of surgery is a clinical fact within the team's epistemic authority. The patient relied on the uniform, not the individual. To rule otherwise would fracture the patient's trust in the clinical environment, treating the nurse's medical assertion as mere chatter rather than professional communication.

  To separate the surviving principles, the sharpest test case is not another staff member, but a **family member**. Imagine the patient's spouse lies about the surgeon's recommendation to induce consent, with the surgeon unaware. The Transactional Source Principle predicts **valid** consent (the counterparty didn't lie). The Clinical Integrity Principle also predicts **valid** (the family is not clinical staff). However, the Reasons-Responsiveness view predicts **invalid** (the will was tracked to a falsehood). If H. rules invalid here, she abandons her distinction between external reasons and transactional terms (Case 2). If she rules valid, she confirms that the *source* of the misinformation matters as much as the materiality. This case isolates whether H. protects the *process* of professional consent or the *purity* of the patient's reasoning.

  Finally, regarding graded validity: H. should treat validity as **all-or-nothing**. Case 5 (kidney sale) shows she distinguishes validity (was consent given?) from permissibility (should this be allowed?). Introducing graded validity—valid for the incision but not the choice—blurs this crucial line. Consent functions as a moral threshold that transfers authority; if it is partial, the physician lacks clear permission to act. While Case 3 suggests scope limitations (blood draw vs. genetic study), these are distinct transactions, not degrees of validity within one. Grading validity risks converting a protective shield into a negotiable waiver, undermining the binary protection seen in Case 4 (coercion) and Case 8 (understanding). For H., consent is the gatekeeper; the gate is either open or closed.
