prompt: |-
  You are an expert philosopher of logic with deep knowledge of the justification of deduction, especially Carroll-style regress arguments. Think carefully, and start with a quick brainstorm of what counts as a genuine constraint vs just a camp prejudice.

  I'm a retired natural scientist (physics background) who recently got into philosphy and I'm stuck on Carroll's tortise problem. Before I read more theories I want the full spec: what must any adequate theory of deductive justification actually deliver?

  Write me the desiderata: the cases it has to handle (the tortoise regress, circular reasoning in scientific models, the gap between knowing a rule and applying it), the distinctions it can't collapse (psychological vs normative, local inference vs global coherence, a priori vs empirically bootstrapped deduction), and results from logic or cognitive science it must stay consistent with. For each say why it's required and whether it's negotiable.

  Then flag any pair you think are jointly unsatisfiable -- I suspect avoiding all circularity while still allowing scientists to justify their deductive tools without prior proof is one such tension.

  Finally, briefly score Carroll's own move, conventionalism, and a reliabilist view against the list. No bibliographies or citations please -- I'm working offline. Keep it casual; sorry if my spelling is off in places.
