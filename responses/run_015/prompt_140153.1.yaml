      *   *Refining Case 4 (Pain):* This is the ethical trap. If I feel pain, then the draft changes to "no pain," did I suffer? If the view says "no fact," it implies "no fact if I suffered." That's morally untenable. The defender must concede suffering is determined by the *initial* processing, not the final narrative. This concedes the Stalinesque/Orwellian distinction for affect.
      *   *The "Collapse" Point:* The view claims to dissolve the distinction. But to do so, it defines "consciousness" as "the content of the winning draft." But what determines the winner? Functional availability. Is functional availability determinate? Yes. So there *is* a fact about when content became functionally available for report. The "No Fact" claim rests on equivocation between "physical processing time" (indeterminate/parallel) and "functional access time" (determinate/serial). If the latter exists, the Cartesian Theater returns as a "Functional Theater."

