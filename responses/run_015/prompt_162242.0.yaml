answer: |-
  # Pre-Reading Sorting Instrument: Accounts of Human Nature

  **Instructions:** Read each scenario and select the option that best matches your intuition. There are no right or wrong answers; this is to help you locate your own assumptions before engaging with the texts.

  **1. [Repertoire]** A passerby sees a toddler crawling toward an open well. They feel a sudden jolt of alarm and rush to help. What best explains that jolt?
  *   **A.** It is an automatic, unlearned response common to almost everyone.
  *   **B.** It is a learned reflex based on past social training or fear of blame.

  **2. [Trajectory]** A small community has enough food for everyone. Suddenly, a famine removes the surplus, and food becomes scarce. What happens to their generosity?
  *   **A.** It strains but generally persists; people share the burden.
  *   **B.** It collapses; people hoard and fight for survival immediately.

  **3. [Source]** Think of the rules of politeness (waiting your turn, speaking softly, yielding seats). Where did these rules originally come from?
  *   **A.** They were discovered by wise people who listened to what humans already deeply wanted.
  *   **B.** They were invented by wise people to stop humans from doing what they naturally wanted.

  **4. [Repertoire]** A person has not eaten for two days. They see a bowl of rice. What is their first impulse?
  *   **A.** To eat it themselves immediately.
  *   **B.** To feel no specific drive to eat until someone tells them to.

  **5. [Source]** Consider the very first person who ever established a ritual or moral rule. How were they able to do this?
  *   **A.** They were born with a unique capacity to see order that others lacked.
  *   **B.** They were like everyone else but worked against their own impulses to construct order artificially.

  **6. [Trajectory]** A student says they love learning but constantly skips class and fails assignments. Why do they ruin their own chances?
  *   **A.** They are neglecting a natural growth that requires tending, like a forest overgrown by weeds.
  *   **B.** They are following their natural inclination, which prefers comfort over effort.

  **7. [Repertoire]** A person is insulted in public. They feel a flash of heat in their chest before they decide how to react. Is that heat part of their raw equipment?
  *   **A.** Yes, spontaneous emotional reactions are part of the unlearned repertoire.
  *   **B.** No, true nature is calm; heat is a distortion caused by bad habits.

  **8. [Trajectory]** If you leave a group of children together on an island with no adults and unlimited toys, what happens over a year?
  *   **A.** They develop their own games and cooperative structures.
  *   **B.** They descend into conflict and dominance hierarchies.

  **9. [Source]** When you follow a moral rule that is difficult (e.g., telling the truth when it hurts), where does the authority of that rule feel like it comes from?
  *   **A.** It resonates with something already inside me, even if it is hard to do.
  *   **B.** It feels like an external standard I must impose on myself to be better.

  **10. [Repertoire]** Are some people born naturally kind and others naturally cruel, or do all start the same?
  *   **A.** All start with the same basic equipment; differences come later.
  *   **B.** Some are born with better moral material than others.

  ***

  # Scoring Key and Logical Space Analysis

  ## Part 1: The Logical Space (The Tree)

  To understand where your answers place you, we must first map the logical space of possible theories. This tree branches based on three core dimensions: the content of the **Repertoire** (what is spontaneous?), the **Trajectory** (where does it go unchecked?), and the **Source** (where do norms come from?).

  **Branching Question 1: Does the spontaneous, unlearned repertoire contain moral prompts?**
  *   **Yes:** (Go to Branch 2A)
  *   **No:** (Go to Branch 2B)

  **Branching Question 2A: If Yes, are these prompts self-sustaining?**
  *   **Yes:** The nature is fully good; corruption is external intrusion. (**Leaf: Mencius [Full]**)
  *   **No:** The nature contains sprouts, but they are fragile and require cultivation to survive. (**Leaf: Mencius [Incipient]**)

  **Branching 2B: If No, is the spontaneous repertoire actively destructive or merely neutral?**
  *   **Actively Destructive (Chaos):** Unchecked nature leads to conflict; order requires artifice. (**Leaf: Xunzi [Substantive]**)
  *   **Merely Neutral (Indifferent):** Nature is like water; it can be guided east or west. (**Leaf: Gaozi/Indifferent**)
      *   *Sub-branch:* Can it be made good?
          *   **Yes:** (**Leaf: Malleable**)
          *   **No:** (**Leaf: Pessimist [Unnamed]**)

  **Branching Question 3: Where does the authority of ritual/norms originate?**
  *   **Internal:** Norms resonate with the repertoire. (Aligns with **Mencius**)
  *   **External:** Norms are constructed to reshape the repertoire. (Aligns with **Xunzi**)

  ### Leaf Locations and Diagnoses

  1.  **Mencius [Incipient]:** (Yes / No / Internal). The repertoire has moral sprouts, but they die without cultivation. *Occupied.*
  2.  **Mencius [Full]:** (Yes / Yes / Internal). The repertoire is robustly good; evil is purely external. *Occupied (Idealized reading).*
  3.  **Xunzi [Substantive]:** (No / Destructive / External). The repertoire is self-regarding; sages constructed ritual to curb it. *Occupied.*
  4.  **Xunzi [Thin]:** (No / Neutral / External). "Nature" is just what is unlearned; it isn't evil, just raw material needing shaping. *Occupied (Technical reading).*
  5.  **Gaozi/Indifferent:** (No / Neutral / External or Internal). Nature is morally inert. *Occupied.*
  6.  **Malleable:** (No / Variable / External). Can be made good or bad depending on environment. *Occupied.*
  7.  **Mixed (Some Good/Some Bad):** (Variable / Variable / Variable). Some people are born good, others bad. *Occupied (Secular/Common Sense).*
  8.  **Pessimist [Unnamed]:** (No / Destructive / None). Nature is bad and cannot be fixed. *Diagnosis: **Unattractive**. If nature cannot be fixed, ethics is impossible.*
  9.  **Spontaneous Order [Unnamed]:** (No / Order / None). Nature is bad/neutral but somehow creates order without norms. *Diagnosis: **Incoherent**. If nature lacks moral prompts and norms are absent, order has no source.*
  10. **External Good [Unnamed]:** (No / Order / External). Nature is bad, but external norms make it self-sustainingly good without internal resonance. *Diagnosis: **Unexplored**. Rarely defended; usually collapses into Malleable.*

  ### Indistinguishable Leaves
  *   **Mencius [Incipient] vs. Mencius [Full]:** This instrument cannot reliably separate these. Both answer "Yes" to moral sprouts. The difference is degree of fragility. *Separating Question:* "If left entirely alone in a supportive environment (no negatives), would a child become perfectly virtuous?" (Full = Yes, Incipient = No).
  *   **Xunzi [Substantive] vs. Xunzi [Thin]:** Both answer "No" to moral sprouts. The difference is whether "nature" is *evil* or just *raw*. *Separating Question:* "Is the natural impulse to grab food morally blameworthy?" (Substantive = Yes, Thin = No).

