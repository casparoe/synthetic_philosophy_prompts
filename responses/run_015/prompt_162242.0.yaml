  ## Part 2: Scoring Instructions

  **Note on Terminology:** In the analysis below, I use the term *xing* (nature) with **high confidence** to refer to the "spontaneous, unlearned repertoire." I use the term *wei* (artifice) with **high confidence** to refer to "constructed ritual or training."

  **Step 1: Validity Check (Question 4)**
  *   Question 4 is an agreement question. Both major historical accounts agree that biological drives (hunger) are in the spontaneous repertoire.
  *   **If you chose B:** Your profile is **Incoherent**. Neither major account denies basic biological drives. Retake the quiz.
  *   **If you chose A:** Proceed to Step 2. (Note: This answer does *not* count toward your Mencius/Xunzi score, as both thinkers hold it).

  **Step 2: Tally Scores**
  Count your answers for Questions 1, 2, 3, 5, 6, 7, 8, 9, 10.
  *   **Count A's:** This is your **Internal/Order Score** (Mencian lean).
  *   **Count B's:** This is your **External/Chaos Score** (Xunzian lean).

  **Step 3: Locate Your Position**
  *   **7-9 A's:** **Mencius [Full/Incipient].** You believe morality is discovered within and nature tends toward order.
  *   **7-9 B's:** **Xunzi [Substantive/Thin].** You believe morality is constructed without and nature tends toward chaos.
  *   **4-6 A's / 4-6 B's:** **Gaozi/Malleable.** You believe nature is neutral or highly dependent on environment.
  *   **Mixed on Q10:** If you chose B on Q10, you hold the **Mixed** view (Some good, some bad), regardless of other scores.

