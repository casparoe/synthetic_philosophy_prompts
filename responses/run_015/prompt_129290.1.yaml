answer: |-
  # Specification for a Normative Theory of Reference-Class Selection

  **To:** Philosophers of Science, Risk Analysts, Statisticians
  **From:** Editorial Desk
  **Subject:** Desiderata for Resolving the Reference-Class Problem

  ## 1. Preamble
  The reference-class problem arises when an individual $x$ belongs to multiple classes ($A, B, C\dots$), each associated with a different probability for outcome $Y$. A normative theory must provide a principled method for selecting the appropriate class to assign a single-case probability. This specification outlines the requirements for such a theory to be considered adequate for a general ideas audience.

  ## 2. Mandatory Test Cases
  An adequate theory must resolve the following three scenarios without resorting to *ad hoc* manoeuvres.

  ### 2.1. The Swedish Male Smoker (Overlapping Attributes)
  *   **Scenario:** An individual is a Swedish male who smokes. Statistics exist for: (a) Swedes, (b) Males, and (c) Smokers. These classes yield divergent life-expectancy probabilities.
  *   **Requirement:** The theory must specify a hierarchy or weighting function for competing attributes. It cannot simply default to the 'narrowest' class if that class lacks statistical stability, nor can it arbitrarily privilege one demographic over another without justification.

  ### 2.2. Self-Locating Predictions (Indexical Uncertainty)
  *   **Scenario:** An agent knows they are one of $N$ identical copies in a thought experiment (e.g., a cloning scenario or a multiverse branch), but does not know *which* copy.
  *   **Requirement:** The theory must distinguish between the frequency of outcomes across the class of copies and the credence the individual should assign to their own specific location. It must handle first-person indexicals ('I', 'now') within a third-person class description.

  ### 2.3. The Interval-Boundary Shift (Dynamic Properties)
  *   **Scenario:** An individual is assessed for a 10-year health risk. At year 5, they quit smoking. Their class-defining property changes *during* the prediction window.
  *   **Requirement:** The theory must account for temporal granularity. It must determine whether the reference class is fixed at the moment of prediction ($t_0$) or whether it updates dynamically as the individual's properties shift. A static class assignment is insufficient for dynamic risk profiles.

  ## 3. Conceptual Distinctions to Preserve
  The theory must not conflate the following distinctions. Blurring these categories constitutes a category error.

  ### 3.1. Epistemic vs. Causal Relevance
  *   **Distinction:** A property may be evidentially relevant (correlated with the outcome) without being causally relevant (mechanistically producing the outcome).
  *   **Requirement:** The theory must specify whether reference classes should be constructed based on *predictive power* (epistemic) or *mechanistic homogeneity* (causal). For instance, 'yellow fingers' predict lung cancer but do not cause it; a causal theory must exclude this from the reference class, whilst an epistemic one might include it.

  ### 3.2. Group Frequency vs. Individual Expectation
  *   **Distinction:** The long-run relative frequency of a class is not logically identical to the single-case expectation for a specific member of that class.
  *   **Requirement:** The theory must bridge the gap between collective data and single-case application. It must explain why an individual should care about the group frequency if their specific causal history deviates from the mean.

  ## 4. Constraints and Requirements

  ### 4.1. Non-Negotiable Requirements (Hard Constraints)
  These requirements are derived from logic and probability calculus. Failure here renders the theory incoherent.
  1.  **Coherence:** Assigned probabilities must obey the axioms of probability (e.g., no Dutch Books).
  2.  **Admissibility:** The theory must utilise all available relevant evidence. Ignoring known, statistically significant properties of the individual is prohibited.
  3.  **Consistency:** The method must not yield contradictory probabilities for the same proposition under identical descriptions.

  ### 4.2. Camp-Specific Preferences (Soft Constraints)
  These are desirable but depend on one's metaphysical stance on probability.
  1.  **Objectivity:** (Frequentist preference) The class selection should not depend on the agent's state of knowledge.
  2.  **Calibration:** (Bayesian preference) Subjective credences should align with observed frequencies over time.
  3.  **Physical Realism:** (Propensity preference) The probability should reflect a physical disposition of the individual, not merely a feature of a dataset.

  ## 5. Impossibility Results and Tensions
  Under standard statistical constraints, the following subsets of desiderata are jointly unsatisfiable. A viable theory must explicitly acknowledge which constraint it relaxes.

  ### 5.1. The Singleton Limit (Admissibility vs. Stability)
  *   **Conflict:** If one adheres strictly to **Admissibility** (use all relevant info), the reference class narrows until it contains only the individual (a singleton).
  *   **Result:** In a singleton class, the frequency is either 0 or 1. This destroys the utility of probability for risk assessment.
  *   **Flag:** You cannot have maximal specificity and statistical stability simultaneously. The theory must define a 'relevance threshold' where additional specificity is ignored to preserve sample size.

  ### 5.2. The Temporal Conflict (Fixed Class vs. Dynamic Reality)
  *   **Conflict:** To calculate a frequency, the class must be fixed. To model the **Interval-Boundary Shift**, the class must be fluid.
  *   **Result:** Standard frequentist definitions struggle to assign a probability to a class that changes membership criteria mid-trial.
  *   **Flag:** A theory cannot maintain a rigid frequentist definition of reference classes whilst fully accommodating dynamic property shifts without moving towards a propensity or Bayesian framework.

  ## 6. Comparative Scorecard
  Evaluation of dominant interpretations against the specification.

  ### 6.1. Frequentist Reference-Class Reasoning
  *   **Swedish Male Smoker:** **Partial Pass.** Relies on Reichenbach's 'narrowest class' rule, but struggles when the narrowest class lacks statistical significance.
  *   **Self-Locating:** **Fail.** Lacks the machinery to handle indexical uncertainty; treats the individual purely as a member of the collective.
  *   **Interval-Boundary:** **Fail.** Requires fixed classes for frequency counts; dynamic shifts break the frequency definition.
  *   **Distinctions:** Preserves Group Frequency well, but collapses Individual Expectation into Frequency.
  *   **Verdict:** Robust for stable, retrospective data; brittle for single-case, forward-looking risk.

  ### 6.2. Subjective Bayesian Updating
  *   **Swedish Male Smoker:** **Pass.** Resolves overlap by conditioning on all known evidence ($P(Outcome | Swedish \cap Male \cap Smoker)$).
  *   **Self-Locating:** **Pass.** Handles indexical credence naturally via conditionalisation on self-locating information.
  *   **Interval-Boundary:** **Pass.** Updates credence as new information (quitting smoking) arrives.
  *   **Distinctions:** Blurs Epistemic and Causal relevance (correlation suffices for updating). Collapses Individual Expectation into Epistemic State.
  *   **Verdict:** Highly flexible for decision-making, but lacks objective constraint; two agents with different priors may legitimately select different classes.

  ### 6.3. Propensity Interpretations
  *   **Swedish Male Smoker:** **Partial Pass.** Selects classes based on causal homogeneity rather than statistical correlation.
  *   **Self-Locating:** **Fail/Partial.** Struggles with indexicality unless propensities are assigned to 'centred worlds', which is metaphysically costly.
  *   **Interval-Boundary:** **Pass.** Propensities can change as physical dispositions change (quitting smoking alters the physical propensity).
  *   **Distinctions:** Preserves Causal Relevance excellently. Distinguishes Individual Expectation (propensity) from Group Frequency (manifestation).
  *   **Verdict:** Best for scientific explanation and single-case ontology, but empirically elusive; propensities are difficult to measure independently of frequencies.

  ## 7. Conclusion
  No existing interpretation satisfies all desiderata without cost. A normative theory for a general audience must explicitly state which impossibility result it accepts. For risk communication, a hybrid approach is often required: using **Frequentist** data for baseline rates, **Propensity** reasoning for causal interventions, and **Bayesian** updating for dynamic individual circumstances.

  ***

  **Language Check:** British English spelling and usage applied throughout (e.g., *programme, modelling, centre, favour, whilst*).
