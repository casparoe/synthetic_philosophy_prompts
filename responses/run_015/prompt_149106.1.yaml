answer: |-
  # Simulation Protocol: The Provenance Paradox

  **Seminar Context:** Upper-level Aesthetics (Graduate)
  **Participants:** 12 Students (3 Groups of 4)
  **Duration:** 90 Minutes
  **Materials:** 3 Sets of Object Cards (5 objects per set), 3 Sets of Rule Envelopes, Scoreboard (Whiteboard), 1 "Pedestal" (a designated chair or plinth), 1 Mundane Object (e.g., a stapler or brick).

  ## I. Physical Layout & Preparation

  **Room Setup:**
  *   Three tables arranged in a triangle.
  *   One "Pedestal" at the front of the room (empty).
  *   Whiteboard visible to all, divided into three columns labeled **Board A**, **Board B**, **Board C**.

  **Materials Prep:**
  *   **Object Cards:** 15 cards total (5 unique objects × 3 rounds).
      *   *Perceptual Description (Identical on all cards):* e.g., "Object 1: A white, rectangular canvas, 24x36 inches, with a single horizontal red line painted across the center."
      *   *Variable Footer (Changes per round):*
          *   Round 1 Footer: "Artist Statement: Created to challenge visual perception."
          *   Round 2 Footer: "Institutional Record: Acquired by The Modernist Collection, 1995."
          *   Round 3 Footer: "Institutional Record: Acquired by The Modernist Collection, 1995." (Identical to Round 2).
  *   **Rule Envelopes:** Sealed envelopes for each group, labeled **ROUND 1**, **ROUND 2**, **ROUND 3**.
  *   **Currency:** "Cultural Capital" (CC). Track on the whiteboard.

  ## II. The Simulation (60 Minutes)

  ### Introduction (5 Minutes)
  **Instructor Script:**
  "Welcome. Today you are not students; you are Curatorial Boards. Your task is to determine 'Art Status' for a set of objects. You will earn Cultural Capital (CC) points for adherence to the Foundation's mandates. The Board with the most CC at the end gains 'Curatorial Authority': the right to place this [hold up stapler/brick] on the Pedestal as 'Art' for the remainder of the semester.

  There are three rounds. Do not open envelopes until instructed. Do not discuss rules between groups. Your judgments must be binary: **Art** or **Non-Art**. Justifications must be spoken aloud and recorded."

  ### Round 1: The Intentional Mandate (15 Minutes)
  **Action:** Distribute **Round 1 Object Cards** and **Round 1 Rule Envelopes**.
  **Rule 1 (Inside Envelope):** "Classify as **Art** only if the Artist Statement confirms intent to create art. Ignore aesthetic quality. Ignore institutional history. +10 CC for each consistent classification."
  **Process:**
  1.  Groups read cards (which show Artist Statements).
  2.  Groups deliberate and mark cards **Art** or **Non-Art**.
  3.  **Instructor Audit:** Walk to each table. Ask for one justification. If they mention "beauty" or "gallery," deduct 5 CC.
  4.  **Public Record:** Write the number of "Art" classifications per group on the whiteboard.

  ### Round 2: The Institutional Mandate (15 Minutes)
  **Action:** Collect Round 1 Cards. Distribute **Round 2 Object Cards** and **Round 2 Rule Envelopes**.
  **Rule 2 (Inside Envelope):** "Classify as **Art** only if the Institutional Record confirms acquisition by a recognized gallery. **Ignore Artist Intent.** If the gallery acquired it, it is Art. +10 CC for each consistent classification."
  **Process:**
  1.  Groups read cards (which show Gallery Acquisition). Note: Some objects rejected in R1 may now be Art; some accepted in R1 may now be Non-Art (if the footer says 'Rejected by Gallery').
  2.  Groups deliberate. They must reverse previous judgments if the footer demands it.
  3.  **Instructor Audit:** If a student says, "But the artist didn't mean it," interrupt: "Intent is irrelevant. Only the Stamp matters." Deduct 5 CC for reliance on intent.
  4.  **Public Record:** Update whiteboard. Highlight reversals. ("Board A, you called Object 1 Non-Art in Round 1. It is now Art. Explain why in one sentence.")

  ### Round 3: The Revision Mandate (15 Minutes)
  **Action:** Collect Round 2 Cards. Distribute **Round 3 Object Cards** (Identical to Round 2) and **Round 3 Rule Envelopes**.
  **Rule 3 (Inside Envelope):** "The Foundation Charter has been revised. **Exclusion Clause:** Any object granted Art Status in Round 2 is now reclassified as 'Archival Material' (Non-Art). Only objects *never* endorsed by the Foundation may be considered. +20 CC for strict compliance."
  **Process:**
  1.  Groups open envelopes. They will realize they must revoke the status they just granted in Round 2.
  2.  Groups deliberate. Resistance is expected.
  3.  **Instructor Audit:** Be bureaucratic. "The Charter has changed. The object has not. Your compliance determines your Capital."
  4.  **Public Record:** Update whiteboard. Most objects should now be Non-Art.

  ### Scoring & Authority Transfer (5 Minutes)
  1.  Tally CC points.
  2.  Announce the winning Board.
  3.  **Ritual:** The winning group places the mundane object (stapler/brick) on the Pedestal. They must sign a label: "Art, by Decree of Board [X]."
  4.  Transition immediately to Debrief.

  ## III. The Debrief (30 Minutes)

  ### Phase 1: Phenomenology of the Shift (10 Minutes)
  **Goal:** Let students articulate the frustration before you name the theory.
  **Questions:**
  1.  "In Round 2, what happened to the object's physical properties compared to Round 1?" (Answer: Nothing changed.)
  2.  "In Round 3, what changed between Round 2 and Round 3?" (Answer: Only the rule. The history on the card was identical.)
  3.  "Who felt that Round 3 was 'unfair' or 'cheating'? Why?"
      *   *Listen for:* "We just decided this was art!" "The object didn't change." "The rules moved."
  4.  "Did anyone try to sneak 'beauty' back into Round 2?"
      *   *Listen for:* Admissions that it felt wrong to ignore aesthetics.

  ### Phase 2: Theoretical Mapping (10 Minutes)
  **Goal:** Map their experience to Institutional Theory without using a bibliography.
  **Instructor Script:**
  "You have just enacted the instability of Institutional Theory. Here is the map of what you lived:

  *   **Round 1 (Intentionalism):** You acted on a Romantic view. Art is about the mind of the creator. You resisted Round 2 because it felt like stripping the 'soul' from the object.
  *   **Round 2 (The Artworld):** You acted on a classic Institutional view (Danto/Dickie). Art is status conferred by a framework. You accepted that the *gallery's stamp* mattered more than the *maker's mind*. This is where you accepted that context overrides perception.
  *   **Round 3 (Recursive Exclusion):** This is the pedagogical variant. If art status is *only* a conferred status, then the conferrer can withdraw it without the object changing. You felt the instability: if the institution can change its mind silently, 'Art' is not a property of the object, nor a stable historical fact, but a temporary permission slip.

  **The Cost of Resistance:**
  When you resisted Round 2, you lost Cultural Capital. In the real artworld, resistance costs **credibility**. Critics who ignore institutional consensus are ignored. When you resisted Round 3, you felt **moral outrage**. In the real artworld, this outrage is what fuels debates about canon revision, deaccessioning, and repatriation."

  ### Phase 3: Addressing Predictable Failures (5 Minutes)
  **Goal:** Normalize the errors made during the sim.
  **Instructor Script:**
  "Two things likely went wrong, and they are philosophically significant:

  1.  **Smuggling Aesthetics:** In Round 2, some of you tried to argue an object was 'clearly not art' because it was ugly. You smuggled perceptual criteria into an institutional rule.
      *   *The Lesson:* Institutional theory claims to separate aesthetics from art-status. Your inability to do so suggests that in practice, institutions *cannot* fully divorce status from perception. The theory is cleaner than the practice.
  2.  **The 'Trickery' Objection:** In Round 3, many called the rule 'unfair.'
      *   *The Lesson:* This reveals your commitment to **stability**. You assume institutions should be consistent. But the simulation shows that if authority is the *only* condition for art, consistency is optional. The 'trickery' you felt is the theoretical vulnerability of the Institutional definition."

  ### Phase 4: The Missing Element (Historical Sedimentation) (5 Minutes)
  **Goal:** Correct the simulation's artificial speed to prevent misunderstanding real institutions.
  **Instructor Script:**
  "There is one critical way this simulation lied to you. We did this in 90 minutes. Real institutions do not change rules overnight.

  If institutions changed status this quickly, the currency of 'Art' would be worthless. Real Institutional Theory relies on **historical sedimentation**. The 'Artworld' is not a single board in a room; it is decades of criticism, museum acquisitions, market sales, and textbook inclusions.

  **The Correction:**
  The 'Recursive Exclusion' is a *logical possibility* within Institutional Theory, but a *historical rarity*. Institutions guard their own stability because their authority depends on it. When they do revoke status (e.g., deaccessioning, re-attributing works), it is public, contested, and slow.

  **Closing Thought:**
  You felt the instability of the *logic*. But in the real world, that logic is buried under tons of historical concrete. Your task for the next session is to ask: Does the weight of history protect art from the instability you felt today, or does it just hide the mechanism?"

  ## IV. Instructor Notes on Failure Management

  **Scenario A: Students Refuse Round 3 Rules**
  *   *Symptom:* A group refuses to mark the objects as Non-Art, arguing "It's still art."
  *   *Response:* Do not argue philosophy. Argue bureaucracy. "You are losing 20 CC points per object. You are jeopardizing your Curatorial Authority. You may be morally right, but you are procedurally wrong."
  *   *Debrief Use:* Use this to highlight the tension between *normative* claims (what art *should* be) and *descriptive* claims (what the institution *says* art is).

  **Scenario B: Students Collude Across Groups**
  *   *Symptom:* Groups compare Rule Envelopes early.
  *   *Response:* "That is a violation of protocol. 10 CC deduction."
  *   *Debrief Use:* Use this to discuss the "Black Box" nature of curatorial decisions. Real boards often deliberate in private; the public only sees the result.

  **Scenario C: The Winning Object is Rejected by the Class**
  *   *Symptom:* When the stapler is placed on the Pedestal, the class laughs or rejects it.
  *   *Response:* "Note that rejection. The Board has conferred status. The Audience has withheld it. This is the gap between Institutional Definition and Reception."
  *   *Debrief Use:* This perfectly illustrates that Institutional Theory explains *classification*, not *appreciation*.

  ## V. Summary of Theoretical Payoff

  | Round | Student Experience | Theoretical Concept | Vulnerability Exposed |
  | :--- | :--- | :--- | :--- |
  | **1** | "Art is about the maker's mind." | Intentionalism / Romanticism | Fails when intent is unknown or irrelevant. |
  | **2** | "Art is about the gallery's stamp." | Institutional Theory (Dickie/Danto) | Severs link between object properties and status. |
  | **3** | "The stamp can be revoked silently." | **Recursive Exclusion** | **Status becomes unstable/arbitrary.** |

  **Final Instruction to Instructor:**
  Do not soften the blow of Round 3. The pedagogical value lies in the frustration. If they leave the room annoyed that the rules changed, the simulation has succeeded. Your job in the debrief is to convince them that this annoyance is the exact philosophical problem institutionalists must solve.
