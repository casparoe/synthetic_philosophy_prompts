answer: |-
  ### 1. Translation

  Look, let's set up the payoff matrix. You've got a parent agent choosing between strategies $S = \{Reproduce, Abstain\}$. The payoff is inclusive fitness ($W$). In the philosophical frame, "creating a suffering kid" maps to a strategy where the offspring's lifetime fitness contribution is negative or severely compromised ($W_{offspring} < 0$ or effectively a sink on parental residual reproductive value). "Skipping a happy kid" maps to the $Abstain$ strategy where the counterfactual offspring would have had $W_{offspring} > 0$, but the actual payoff is zero (non-existence).

  The Procreation Asymmetry claims that if $W_{offspring} < 0$, $Reproduce$ is forbidden (strong negative selection gradient), but if $W_{offspring} > 0$, $Abstain$ is permitted (neutral gradient). In standard ESS modelling, this looks weird. Usually, if $E[W_{Reproduce}] > E[W_{Abstain}]$, the allele spreads. There's no inherent asymmetry in the math; positive and negative deviations from the baseline both drive frequency changes. The philosophical "wrongness" translates to "selection against," but the "not wrong" doesn't translate to "selection neutral"—it translates to "selection for," which creates a conflict.

  Then there's the Non-Identity Problem. Philosophy asks if you harmed a specific individual by bringing them into a bad state compared to non-existence. In evolutionary terms, "harm" is untranslatable unless it means a fitness cost to the lineage. You can't compare the individual's state to non-existence because non-existence isn't a state with a reproductive value; it's $V=0$. If the offspring exists and propagates genes ($W > 0$), the lineage gains, regardless of the counterfactual. So, the debate shifts from "did we harm this person?" to "does this strategy reduce long-term geometric mean fitness?" The asymmetry becomes a question of whether selection pressure against negative payoffs is stronger than pressure for positive payoffs.

  ### 2. Residue Report

  Here's where the mapping gets messy. First, the concept of the "individual" as a moral patient is pure residue. Evolution sees offspring as vehicles for alleles. If a vehicle suffers but successfully replicates genes (think sterile workers or high-mortality r-strategists), evolution "approves." Philosophy cares about the vehicle's subjective state; evolution cares about the replicator's success. So, "suffering" only matters insofar as it correlates with fitness costs.

  Second, normativity is untranslatable. "Wrong" implies a rule or duty. An ESS is just unbeatable, not "right." You can have a strategy that spreads (like a selfish genetic element) that feels "wrong" in a moral sense but is evolutionarily stable. The philosophical obligation to avoid suffering maps to avoidance of fitness sinks, but the lack of obligation to create happiness clashes with the evolutionary imperative to maximize $W$ when costs are low.

  Third, treating "potential people" as entries in a payoff matrix is a distortion. Evolution doesn't optimize over possible beings; it filters actual variants. Non-existence isn't a strategy with a payoff of 0; it's the absence of a strategy. Finally, the asymmetry itself: in life-history theory, we see risk aversion (variance sensitivity). Losing everything (extinction) weighs heavier than gaining extra because extinction is an absorbing state. This looks like the asymmetry, but it's about risk management, not moral weight. The moral "ought" is the biggest leftover piece that doesn't fit the kinetic framework.

  ### 3. Verdict

  Does evolutionary biology miss something real? I'd say it misses the agent-level constraints, but reveals the asymmetry is largely a framing artifact of risk, not morality. Selection dynamics are generally symmetric around replacement rates ($W=1$); a 10% gain balances a 10% loss in frequency terms. However, because extinction is permanent, there is a dynamic asymmetry where avoiding negative payoffs is prioritized over maximizing positive ones (bet-hedging).

  Philosophers are pointing at normative constraints on agents with foresight and empathy. Evolution points at blind filtering of variants. The "wrongness" of creating suffering maps cleanly to "selection against," but the "no obligation" to create happiness doesn't map, because selection always favors higher $W$ when available. So, the asymmetry isn't conceptual confusion, but it's not a fundamental law of selection either. It's a feature of agency managing variance in a finite world. Evolution explains the pressure to avoid losses; philosophy invents a duty to explain why we don't chase gains. The residue is the "ought," which biology simply doesn't carry.
