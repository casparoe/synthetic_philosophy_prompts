prompt: |-
  I'm in a political theory seminar and we did Arendt last week, and I keep running into the banality of evil thing in long-read articles. Here's how one of them put it: "Arendt's point was that evil is banal: perpetrators are ordinary, decent-ish people rather than monsters, and they do what they do because of the situation they're placed in — Milgram's obedience experiments and the Stanford prison experiment later showed that nearly anyone can be pushed into it, which is basically what happened to Eichmann. He was a desk clerk with no motives of his own, a mere cog in the machine, following orders inside a system, and her claim was that the evil came from thoughtlessness rather than from any decision he made — so really we should be looking at institutions and procedures, not at blaming individuals. And in her later work on thinking and judging she generalised it: the safeguard is to think for yourself, so anyone who reflects critically is immune to this kind of evil."

  How much of that would she actually own? The Milgram/Zimbardo bit feels like a completely different tradition being stapled onto hers, and the "immune" line sounds way too strong, but I dont trust myself to say where the popular version stops being her. There's also a slide I can't quite pin down: the article seems to say the evil itself was banal or ordinary, where my TA kept insisting the banality was a property of the person and not of what was done.

  Could you go through it claim by claim — what an Arendt scholar would accept, what they'd wince at, what she explicitly denied — and then tell me whether the article's punchline (that she'd have us stop blaming individuals and fix processes instead) follows from the bits that are right? Also, is it fair to say her whole evidence base was just his courtroom manner and his bureaucratic jargon, because if so that seems thin, and I want to know if that's a real objection people make.
