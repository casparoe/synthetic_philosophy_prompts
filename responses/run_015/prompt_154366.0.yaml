answer: |-
  This is a sophisticated prompt that moves beyond the standard "priority dispute" narrative into the metaphysics and sociology of scientific discovery. To teach this effectively, you need to treat the Darwin-Wallace episode not as a story to be solved, but as a *dataset* for testing the Inevitability Thesis.

  Below is a structured seminar module designed to map the philosophical distinctions you raised onto the historical record. It avoids biography-for-biography's-sake and focuses on the structural conditions of the discovery.

  ---

  # Seminar Module: The Inevitability Thesis and the 1858 Joint Paper

  ## Part 1: Conceptual Mapping (The Theory)
  Before touching the history, establish the four quadrants of the Inevitability Thesis. This gives students the vocabulary to analyze the case without slipping into gossip.

  | **Dimension** | **Definition** | **Implication for Credit** |
  | :--- | :--- | :--- |
  | **Weak Epistemic Inevitability** | The *problem* was visible (transmutation), and the *data* was available (biogeography, fossils). Someone would have proposed *an* evolutionary theory. | Credit is diffuse. The discoverer is merely the first to synthesize existing public knowledge. |
  | **Strong Epistemic Inevitability** | The *solution* was structurally determined. Given Malthus + Variation, Natural Selection is the only logical inference. Any rational agent would derive *this specific mechanism*. | Credit is diminished further. The discoverer is a vessel for a logical truth that "exists" independently of them. |
  | **Social Inevitability** | The scientific community's structure (journals, societies, networks) ensures that valid claims are recognized and prioritized according to established norms (e.g., seniority, evidence volume). | Credit is managed by gatekeepers (Lyell/Hooker). Priority is a social negotiation, not just a timestamp. |
  | **Normative Independence** | Whether a discovery is inevitable is a descriptive claim; whether the discoverer deserves credit is a normative claim. | Even if inevitable, credit may be owed for *labor* (persuasion, systematization) rather than *insight*. |

  **Seminar Question:** *Can you accept Strong Epistemic Inevitability while rejecting Social Inevitability? (i.e., The idea had to happen, but Darwin didn't have to be the one credited.)*

  ---

  ## Part 2: Testing Epistemic Inevitability (Weak vs. Strong)
  Use the convergence of Darwin and Wallace to test the strength of the inevitability claim.

  **The Evidence for Strong Inevitability:**
  *   **The Malthus Trigger:** Both men explicitly cite reading Malthus's *Essay on the Principle of Population* as the catalyst. This suggests the "algorithm" for natural selection was latent in the available cultural toolkit.
  *   **Independent Derivation:** Wallace derived the mechanism in the Malay Archipelago; Darwin in Down House. They had no correspondence on the mechanism prior to 1858.
  *   **The "Time" Factor:** Multiple other figures (Matthew, Blyth) had pieces of the puzzle. The "conceptual space" was occupied.

  **The Evidence Against Strong Inevitability (The Divergence):**
  *   **Mechanism vs. Pattern:** Wallace's 1858 paper (*On the Tendency of Varieties to Depart Indefinitely from the Original Type*) is arguably *more* strictly selectionist than Darwin's early drafts. However, Darwin's theory was embedded in a much broader causal network (sexual selection, gradualism, deep time).
  *   **The "Black Box" of Variation:** Neither knew *how* variation arose (genetics didn't exist). If the mechanism of heredity was unknown, was Natural Selection truly the *only* structurally determined solution? Or was it the most *plausible* one given their specific biases?
  *   **The Human Exception:** Later, Wallace argued Natural Selection could *not* apply to the human mind (requiring spiritual intervention), while Darwin maintained it did. If the theory was "Strongly Inevitable," why did the co-discoverers diverge on its scope?

  **Discussion Prompt:** *Does the Wallace/Darwin convergence prove Strong Inevitability, or does it only prove Weak Inevitability (that evolution was coming, but Natural Selection was just one of several possible mechanisms that could have won out)?*

  ---

  ## Part 3: Testing Social Inevitability (The Linnean Society Intervention)
  This is where you analyze the 1858 joint presentation not as a historical event, but as a sociological maneuver.

  **The Setup:**
  *   Wallace sends his essay to Darwin (not for publication, but for review).
  *   Darwin panics (fears being scooped after 20 years of work).
  *   Lyell and Hooker (Darwin's allies) arrange the joint reading at the Linnean Society without Wallace's prior consent.

  **Analyzing the Move:**
  *   **Social Inevitability in Action:** Lyell and Hooker utilized the social structure of the Society to manage the "credit assignment." They ensured the idea entered the public record (epistemic progress) while protecting Darwin's seniority (social hierarchy).
  *   **The "Gentleman's Agreement":** Wallace, lacking social capital in London, accepted this arrangement. This suggests that *Social Inevitability* favors those with network centrality. The idea might be inevitable, but the *attribution* is contingent on social power.
  *   **The Payoff:** The joint paper was largely ignored. It was Darwin's *Origin* (1859)—a massive rhetorical and evidentiary labor—that actually secured the theory.

  **Discussion Prompt:** *If Lyell and Hooker had published Wallace's paper alone, would the theory have been accepted? If not, does that mean Social Inevitability (Darwin's status) was actually a prerequisite for Epistemic Success (the theory's acceptance)?*

  ---

  ## Part 4: The Normative Payoff (Does it matter who?)
  This addresses your core question: If we accept inevitability, does credit matter?

  **Option A: The Platonist View (Credit Diminished)**
  *   If Natural Selection is a truth waiting to be found (like a continent), Darwin is just the first explorer. He doesn't "own" the continent.
  *   *Implication:* Wallace is owed equal credit for the insight. Darwin's rush to publish *Origin* is a land-grab, not a scientific necessity.

  **Option B: The Pragmatist View (Credit Retained)**
  *   Scientific facts are not found; they are *made* through labor. Darwin's 20 years of barnacle taxonomy, breeding experiments, and argumentation *constructed* the fact.
  *   *Implication:* Inevitability is irrelevant. Credit is owed for the work of *persuasion* and *systematization*, not just the initial insight. Wallace had the insight; Darwin built the paradigm.

  **Option C: The Separation Thesis**
  *   Descriptive inevitability (it was going to happen) is separate from Normative credit (who gets the prize).
  *   *Implication:* We can admit someone else would have found it in 5 years, but still reward Darwin for doing it *now*, which accelerated scientific progress.

  **Discussion Prompt:** *If a discovery is "Strongly Inevitable," does the scientific community have a moral obligation to distribute credit differently (e.g., more shared prizes), or is "winner take all" a functional necessity to encourage speed?*

  ---

  ## Part 5: Boundary Conditions (Where the Model Breaks)
  To ensure you aren't forcing the theory onto the case, explicitly identify where the Inevitability Framework fails to explain the history.

  **1. Temperament and Psychology:**
  *   **Darwin's Caution:** Darwin sat on his theory for 20 years. An inevitability model struggles to explain *delay*. If the idea was structurally determined, why did it need 20 years of gestation?
  *   **Wallace's Boldness:** Wallace sent the essay unsolicited.
  *   **The Limit:** Inevitability models treat scientists as rational agents. They cannot account for anxiety, ambition, or risk tolerance. The "5 years anyway" claim assumes a rational actor would have published. Darwin was not a rational actor in this regard; he was a cautious one.

  **2. The Spiritualist Divergence:**
  *   As noted, Wallace later introduced spiritualism into human evolution.
  *   **The Limit:** If the theory was epistemically inevitable, rational agents should converge on the *limits* of the theory too. The fact that Wallace's metaphysical commitments altered his application of Natural Selection shows that "extra-scientific" factors determine the theory's shape. The Inevitability Thesis is silent on how non-empirical beliefs filter scientific conclusions.

  **3. The "Origin" vs. The "Paper":**
  *   The 1858 joint paper changed nothing. The *Origin* changed everything.
  *   **The Limit:** Inevitability focuses on the *moment of discovery*. But in science, the *moment of persuasion* is often more critical. The framework misses the rhetorical labor required to turn an insight into a fact.

  ---

  ## Seminar Exercise: The Counterfactual Memo
  **Task:** Ask students to write a 1-page memo from the perspective of the Royal Society in 1858, assuming the **Strong Inevitability Thesis** is true.
  **Prompt:** *If you believe Natural Selection was bound to be discovered by 1865 regardless of Darwin or Wallace, how should you allocate the Copley Medal? Do you award it to the person with the most evidence (Darwin), the person with the clearest mechanism (Wallace), or split it? Justify your decision using the distinction between Social and Epistemic credit.*

  **Goal:** This forces them to operationalize the philosophical distinction. If they split it, they are prioritizing Epistemic Inevitability (the idea is the thing). If they give it to Darwin, they are prioritizing Social/Pragmatic factors (the work of persuasion).

  ---

  ## Instructor's Note on the "5 Years" Claim
  Be careful with the claim that "someone would have figured it out in five years."
  *   **Support:** Patrick Matthew published a clear statement of natural selection in 1831 (in an appendix to a book on naval timber), and it was ignored. This suggests the *idea* was available but the *social structure* wasn't ready to hear it.
  *   **Challenge:** If Matthew had it in 1831 and it went nowhere, does that disprove Strong Inevitability? Or does it prove that Epistemic Inevitability requires Social Inevitability (the right community reception) to function?
  *   **Takeaway:** Use Matthew to show that "Inevitability" isn't just about logic; it's about the *receptivity of the audience*. This bridges the gap between the Epistemic and Social categories.

  ## Summary for the Board
  If you need a visual aid to keep the seminar disciplined, draw this flowchart:

  1.  **Inputs:** Malthus + Variation + Biogeography.
  2.  **Process:**
      *   *Epistemic:* Logical inference (Convergence of D & W).
      *   *Social:* Priority management (Lyell/Hooker intervention).
  3.  **Output:**
      *   *Theory:* Natural Selection.
      *   *Attribution:* "Darwinism" (not "Wallaceism" or "Darwin-Wallaceism").
  4.  **Philosophical Question:** Is the Output determined by the Inputs (Inevitability), or by the Process (Contingency)?

  This structure keeps the focus on the *philosophy of discovery* while using the history as rigorous evidence rather than anecdote.
