          *   Strong: Natural Selection *specifically* was the only logical solution to the Malthus/Variation problem.
      *   *Social vs. Epistemic:*
          *   Epistemic: The logic of nature forces the idea.
          *   Social: The logic of the scientific community (priority, publication, networks) forces the *attribution*.
      *   *Credit/Normativity:* If inevitable, is the discoverer just a vessel? Or does execution matter?

  3.  **Analyze the Historical Case (through the lens):**
      *   *The Convergence:* Both read Malthus. Both saw variation. Both hit on selection. This supports *Strong Epistemic Inevitability*.
      *   *The Divergence:* Darwin (gradual, deep time, breeding analogy, massive evidence) vs. Wallace (sharper selection focus, less concerned with mechanism of variation, later spiritualist divergence). This challenges *Strong Inevitability* (maybe the *specific* theory wasn't identical).
      *   *The Linnean Society Intervention:* Lyell & Hooker's "arrangement." This is pure *Social Inevitability* (or Social Construction of Priority). They managed the credit to maintain stability.
