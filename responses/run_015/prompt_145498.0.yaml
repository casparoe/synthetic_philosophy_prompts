prompt: |-
  im on a county land-use board and we get about three habitat-impact aplications a month, mostly solar farms or wetland fills. i need a reusable checklist for deciding whether destroying a particular habitat is net-positive for wild animal welfare, based on the principle that ecosystems have a summed suffering-to-flourishing balance and that high-turnover habitats (lots of frogs, insects, small rodents) can be welfare-negative overall even when biomass looks healthy. the procedure has to work in 20 minutes with no access to species-level affect studies, it has to flag every step where im just guessing, and it needs to cover the hard cases: the developer claims replacement land is "better," we have zero data on the new species mix, or the board needs a yes/no but the logic is genuinely ambiguous. apply it to three scenarios — draining a marsh full of amphibians for a warehouse, clearing old-growth for a solar array that might become grassland, and one where the checklist says approve but my gut screams no; in that last one, tell me exactly which judgment call is failing. also say what this checklist can never do, no matter how refined it gets. fix the role, the stakes, and who signs off: im the board member with a conservation background, the vote is public, and i have to defend the call in writing. dont ask for philosophers or citations; just make the logic something i can actually run before the meeting.
