prompt: |-
  i keep seeing al-ghazali's occasionalism explained with the movie projector analogy — the film reel is nature's habit (sunnah), the bulb is God, and every frame is a fresh creation with no real connection between them. people use it to say "see, causation is just God being consistent." but i want to audit it properly. can you lay out the correspondence table: projector bulb = ?, film strip = ?, screen image = ?, audience expectation = ?, and where does the "no necessary connection" actually live in the mapping? then tell me where it brakes: does the reel smuggle in a script that constrains God's freedom? does spatial continuity of the image contradict ghazali's denial of real relations between frames? and if we swap the projector for a modern GPU that renders each frame with zero physics engine — just pure computation of the next state — does that patch the analogy or just rename determinism? finally, does this analogy actually defend occasionalism against the charge that it's hidden determinism with extra steps, or does it collapse once the disanalogies are on the table? no need for citations, just work through the mechanics.
