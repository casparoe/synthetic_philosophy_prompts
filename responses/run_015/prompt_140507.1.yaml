answer: |-
  This is a specification problem, not merely a normative one. You are attempting to instantiate a *constitutive rule* (who constitutes the demos) that must survive contact with institutional reality. The literature often treats the boundary problem as a matter of moral justification; for a charter city or seastead, it is a matter of operational continuity. If the rule cannot be executed without triggering a constitutional crisis or infinite regress, it is inadequate regardless of its moral elegance.

  Below is the specification list, followed by the meta-analysis and scorecard.

  ### I. The Requirement List

  To count as adequate for a written charter, a principle of demos-membership must satisfy the following four constraints.

  #### 1. Administrative Legibility (The Clerk Constraint)
  **Requirement:** The criterion for membership must be decidable by an administrative agent using publicly available, discrete data points (documents, timestamps, spatial coordinates) without requiring counterfactual modeling or moral judgment.
  **Case/Consideration:** This is the hardest constraint for high-theory principles. A rule like "all whose interests are significantly set back" requires the clerk to simulate the causal impact of every potential policy on every potential voter. This is computationally and epistemically impossible on "Tuesday morning."
  **Where it bites:**
  *   **Downstream/External Parties:** A clerk cannot calculate the dispersion of emissions or economic ripple effects to determine if a mainland resident is enfranchised.
  *   **Future Generations:** A clerk cannot verify the interests of the unborn.
  *   **Distinction:** Collapses *de facto causal impact* into *de jure membership*. If you require actual impact, you lose legibility. If you require proxies (e.g., residency), you lose sensitivity.

  #### 2. Non-Explosiveness (The Boundary Constraint)
  **Requirement:** The principle must generate a finite, bounded set of members that is substantially smaller than the global population, ensuring the polity retains the capacity for distinct self-governance.
  **Case/Consideration:** This is not statist prejudice; it is a functional requirement for *any* corporate entity. If the "all-affected" principle enfranchises everyone impacted by carbon emissions or trade tariffs, the seastead's demos becomes co-extensive with humanity, dissolving the specific governance project.
  **Where it bites:**
  *   **Temporary Migrant Workers:** If their labor affects the local economy, are they in? If they are affected by local labor laws, are they in?
  *   **Externalities:** People downstream of emissions must be excluded from the *legislative* demos (though perhaps compensated via rights/torts), or the demos explodes.
  *   **Distinction:** Enforces the difference between *having a claim against* the polity (rights/torts) and *having a say in* the polity (voting).

  #### 3. Non-Circularity (The Regress Constraint)
  **Requirement:** The rule defining membership cannot rely on a decision made by the body whose membership is being defined, nor can it vary based on the specific agenda item being voted on (unless the variation rule is itself fixed).
  **Case/Consideration:** This addresses the classic "Boundary Problem" (Whelan, Whittaker). You cannot vote on who votes without already knowing who votes. If the rule is "the demos decides who is in the demos," you face an infinite regress or a coup by the initial temporary assembly.
  **Where it bites:**
  *   **Constitutional vs. Legislative Demos:** The group authorized to write the charter (Constituent Power) must be defined by a pre-charter rule (e.g., "founders," "first 100 residents"), distinct from the group operating under the charter (Constituted Power).
  *   **Distinction:** Separates *authorization of the constitution* from *operation of the legislature*.

  #### 4. Fixed-Point Stability (The Manipulation Constraint)
  **Requirement:** The set of eligible voters must not be a function of the election outcome in a way that allows the winning coalition to validate its own eligibility retroactively or strategically alter the electorate via policy proposals.
  **Case/Consideration:** This addresses your "weaponized affectedness." If enfranchisement depends on "whose projects are set back," a faction can propose a policy that specifically setbacks their opponents' projects (making them eligible) or their own (making them ineligible), or simply vote for a policy that *defines* the setback criteria to favor their demographic.
  **Where it bites:**
  *   **Itinerant Demos:** A per-decision electorate allows gerrymandering via the agenda. If I propose a zoning law that only affects my neighbors, do only they vote? If so, I can isolate opposition.
  *   **Distinction:** Separates *having a say* (binary membership) from *how much say* (weighting). Stability requires binary membership to be fixed *ex-ante*.

  ---

  ### II. Handling the Edge Cases (via the Requirements)

  A robust principle uses the requirements above to resolve the specific cases you listed without ad-hocery.

  *   **Young Children:** *Legibility* solves this. Age is a documentable fact. *Affectedness* fails (children are affected but cannot vote). *Solution:* Membership is fixed by age (legible), but guardianship rights handle the *interest* representation until the fixed point of adulthood.
  *   **Long-term Non-Citizen Residents:** *Non-Explosiveness* suggests they must be included if they are permanently subject to the coercion of the law. *Legibility* requires a residency threshold (e.g., 2 years) rather than a "center of life" judgment.
  *   **Citizens Abroad:** *Non-Circularity* requires a fixed rule. If the charter says "residents," they are out. If "citizens," they are in. *Legibility* favors "current physical presence" or "tax residency" over "intent to return."
  *   **Prisoners:** *All-Subjected to Coercion* says they are in (they are most coerced). *Administrative Legibility* says they are in (incarceration records are clear). The exclusion is usually a separate penal sanction, not a boundary failure.
  *   **Downstream/External Parties:** *Non-Explosiveness* dictates they are out of the *demos*. Their protection comes from *rights* constraints in the charter (judicial review), not *franchise*. This preserves the distinction between *being affected* and *being a member*.
  *   **People Who Don't Exist Yet:** *Legibility* makes enfranchisement impossible. *Non-Explosiveness* prevents "future generations" from becoming a proxy for current ideological factions. Protection is via *entrenchment clauses* (supermajorities to amend), not votes.

  ---

  ### III. Meta-Questions

  #### 1. Genuine Desiderata vs. Partisan Commitments
  *   **Standing Body vs. Per-Decision:** The demand for a *standing body* is often dismissed by theorists as a statist artifact, but for your purpose, it is a **genuine desideratum**. A per-decision demos (iterative affectedness) fails *Fixed-Point Stability* and *Administrative Legibility*. You cannot convene a different electorate for every bill without creating massive uncertainty and manipulation vectors.
  *   **All-Subjected to Coercion:** This is often presented as an axiom, but it is actually a **theorem** derived from a prior commitment to autonomy. If your community values *exit* over *voice*, this axiom weakens. For a seastead, "subjection" is voluntary (contractual), which complicates the coercion argument. It is a preference, not a logical necessity.

  #### 2. Incompatible Pairs (Impossibility Results)
  *   **Full Counterfactual Affectedness + Administrative Legibility:** These are **incompatible**. You cannot have a rule that captures every nuanced causal impact *and* is decidable by a clerk with a passport and a utility bill. You must sacrifice moral precision for institutional stability.
  *   **Non-Circularity + Completeness:** If you demand the rule cover *every* possible edge case (completeness) without discretion, you often create loopholes that invite circular interpretation. Some discretion is required, which risks circularity.
  *   **Fixed-Point Stability + Outcome-Dependent Membership:** By definition, these are incompatible. If membership depends on the outcome (affectedness by the policy), it cannot be a fixed point. You must choose: either the demos is fixed (stable) or it is sensitive (unstable).

  #### 3. The "Knockout" Requirement
  The single requirement that does the most work in knocking out otherwise-popular candidates is **Administrative Legibility**.
  *   **Why:** Moral philosophers love the *All-Affected Interests* principle. It sounds just. But it dies instantly upon contact with the Clerk Constraint. It requires omniscience to implement.
  *   **Impact:** It forces you away from *consequentialist* membership rules (who is hurt?) toward *deontological/procedural* membership rules (who signed the contract? who lives inside the fence?). It kills the "itinerant demos" idea dead, which is likely why your draft stalled. You cannot write a charter that requires a causal impact assessment for every voter registration.

  ---

  ### IV. Scorecard of Standard Families

  | Family | Administrative Legibility | Non-Explosiveness | Non-Circularity | Fixed-Point Stability | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **All-Affected Interests** | **FAIL.** Requires counterfactual modeling of every decision's impact on every human. | **FAIL.** Explodes to global scale (climate, trade). | **PASS.** Can be defined externally. | **FAIL.** Highly vulnerable to weaponized affectedness (gerrymandering via agenda). | **Theoretical only.** Impossible to instantiate in a charter. |
  | **All-Subjected to Coercion** | **PARTIAL.** "Coercion" is legally legible, but "significant coercion" is not. Borderline cases (tourists, digital users) remain fuzzy. | **PASS.** Bounded by jurisdiction. | **PASS.** Defined by jurisdiction, not vote. | **PASS.** Jurisdiction is usually fixed by geography/contract. | **Strong Contender.** Requires a clear definition of "jurisdiction" (e.g., physical presence). |
  | **Membership/Residency** | **PASS.** Documents, timestamps, GPS. Highly legible. | **PASS.** Strictly bounded. | **PASS.** Defined in the charter. | **PASS.** Static electorate prevents outcome manipulation. | **Practical Winner.** Morally blunt, but operationally robust. Best for charter cities. |
  | **Procedural/Fixed-Point** | **VARIES.** Depends on the procedure. If the procedure is "founders pick," it's legible. If "stakeholders bid," it's not. | **PASS.** By design. | **PASS.** By design. | **PASS.** This is the core intent of this family. | **High Risk.** Often collapses into Membership or Coercion views upon implementation. |

  ### Recommendation for the 14th
  Your group is likely stalling because you are trying to solve a **moral problem** (who *should* decide?) with an **institutional tool** (a franchise clause).
  1.  **Accept the Tradeoff:** Acknowledge that *Administrative Legibility* trumps *Moral Precision*. You cannot enfranchise based on impact.
  2.  **Adopt a Proxy:** Use **Residency + Contract** (Membership view). It satisfies Legibility, Non-Explosiveness, and Stability.
  3.  **Handle Externalities Elsewhere:** Do not try to solve the "downstream affected" problem via the vote. Solve it via **Rights Constraints** (e.g., "The polity may not emit X") and **Judicial Review**. Keep the *demos* small and legible; keep the *charter* restrictive on harms.
  4.  **Fix the Founding:** Ensure the *initial* demos (who ratifies the charter) is defined by a pre-charter rule (e.g., "signatories by Date X") to satisfy Non-Circularity.

  This moves the debate from "who deserves a vote" (unresolvable) to "what rule can we actually execute without collapsing" (resolvable).
