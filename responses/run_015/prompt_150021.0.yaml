answer: |-
  You have not broken the arithmetic; you have broken the illusion that the paradox lives in the logic alone. Your calculation is correct: in Odile's cabinet, where ravens are the majority and non-black things are the minority, finding a non-black non-raven (a white dove) is indeed more surprising, and therefore carries more informational weight, than finding another black raven.

  You are asking for the name of the thing that makes this flip possible—the thing that shifts the burden from the hypothesis to the setup. In formal epistemology, this does not have a single catchy noun like "Grue," but it is rigorously defined. It is the **Background Knowledge Dependence of Confirmation** (often denoted as the **$K$-term** in Bayesian confirmation theory).

  If you need a working title for your notes, I would call it **Protocol-Relative Confirmation**.

  Here is what it is, what it isn't, and why it matters for Odile.

  ### 1. What is the thing?
  The Raven Paradox feels like a paradox only if you treat confirmation as a **binary relation**: *Does Evidence $E$ support Hypothesis $H$?*

  Your insight reveals that confirmation is actually a **ternary relation**: *Does Evidence $E$ support Hypothesis $H$, given Background Knowledge $K$?*

  The "thing" you are noticing is the **$K$-term**. In the standard version of the puzzle, $K$ is the implicit assumption that we are sampling from "the world," where non-black things vastly outnumber ravens. In Odile's version, $K$ is the specific population of her shelf. When you change $K$, you change the **prior probability of finding the evidence**, which changes its **informational value**.

  In information theory terms, the value of an observation is proportional to its "surprise" (its negative logarithmic probability).
  *   **In the World:** A black raven is rare (high surprise). A white shoe is common (low surprise).
  *   **On Odile's Shelf:** A black raven is common (low surprise). A non-black thing is rare (high surprise).

  The "flip" you calculated is simply the mathematical consequence of the surprise flipping. The concept is that **evidential weight is not intrinsic to the object observed; it is a function of the sampling space from which it was drawn.**

  ### 2. How does it differ from its neighbors?
  You mentioned three neighbors that didn't sit right. Here is why this is distinct from them:

  *   **Vs. The Reference Class Problem:**
      *   *The Neighbor:* This problem asks, "Which group does this individual belong to?" (e.g., Is this bird a 'raven' or a 'corvid'?). It deals with ambiguity in classification.
      *   *The Difference:* Odile has no ambiguity. She knows exactly what is a raven and what is black. The classes are crisp. The issue isn't *what* the objects are, but *how many* of them exist in the pool she is drawing from. It is a problem of **frequency**, not definition.

  *   **Vs. Sampling Bias:**
      *   *The Neighbor:* Bias implies an error—a sample that fails to represent the target population.
      *   *The Difference:* Odile is not making an error. If her hypothesis is "All ravens *on this shelf* are black," her shelf is the total population, not a sample. If her hypothesis is "All ravens *in the world* are black," then her shelf is indeed a biased sample, but the "flip" you found happens even if we treat the shelf as a self-contained universe. Bias suggests a mistake in method; **Protocol-Relative Confirmation** suggests a structural feature of logic itself. The logic *requires* a context to function.

  *   **Vs. Grue:**
      *   *The Neighbor:* "Grue" (green before time $t$, blue after) attacks the stability of predicates over time.
      *   *The Difference:* Grue is about the *meaning* of words changing. Your discovery is about the *probability* of events changing. 'Raven' and 'Black' remain stable. The landscape they sit in is what shifts.

  ### 3. The Sorting Intuition (Blindfold vs. Color-First)
  You noted: *"If Odile deliberately sorts the shelf by colour first and only then checks whether the pale things are ravens, the whole thing feels different from drawing blindfolded."*

  This is the sharpest part of your insight. You have identified the **Sampling Protocol**.

  *   **Blindfolded:** She draws from the set of *All Objects*.
      *   $P(\text{Non-Black})$ is low (10%).
      *   Finding one is highly informative.
  *   **Sorted by Color:** She draws from the set of *Non-Black Objects*.
      *   She has *forced* the condition $\neg B$.
      *   Now, the only question is: Is it a Raven?
      *   In this protocol, finding a non-black non-raven is **guaranteed** (if there are any non-black things at all). It provides **zero** new information about the correlation, because she filtered for the consequent before checking the antecedent.

  This is not just a feeling; it is statistically distinct. In the blindfold scenario, the fact that the object *was* non-black is part of the evidence. In the sorted scenario, that fact is part of the method. This distinction is often called the **Difference between Conditioning on Evidence vs. Conditioning on Selection.**

  This explains why the "weirdness relocates." The logic doesn't tell you how to gather data. You must supply the gathering method, and that method determines the math.

  ### 4. Does this vindicate the gut feeling?
  You asked: *"Does any of this vindicate the gut feeling that the shoe is irrelevant, or does it only explain the feeling away?"*

  It **vindicates the gut feeling by explaining its source.**

  Your gut tells you the shoe is irrelevant because your brain is a Bayesian machine running on a lifetime of data about the real world. Your internal $K$-term knows that non-black objects are ubiquitous. Your intuition is not a logical error; it is a **heuristic for population frequencies.**

  *   **In the World:** The gut is right. The shoe is negligible evidence.
  *   **On Odile's Shelf:** The gut should flip. If Odile knows her shelf is 90% ravens, her intuition *should* tell her that a white dove is more significant than a black raven.

  If Odile feels the shoe is irrelevant *on her shelf*, she is ignoring her own data. If she feels the white dove is more significant, she is thinking like a statistician. The paradox arises because we try to use "World Intuition" on "Shelf Logic."

  ### 5. Narrative Application for Odile
  For a novelist, this conceptual shift offers a specific texture for Odile's character.

  She is a taxidermist. She creates artificial populations. She stuffs the shelf. She decides the $K$-term.
  *   **The Tension:** The world outside operates on one set of probabilities (ravens are rare). Her shelf operates on another (ravens are common).
  *   **The Metaphor:** The Raven Paradox is usually about how we learn truth from the world. For Odile, it is about how she constructs a world where truth is easier to find. By stuffing her shelf with 90 ravens, she has made the "white shoe" (the white dove) valuable. She has manipulated the background knowledge to make the evidence count.

  **Borderline Case Definition:**
  If you need to define the edges of this concept for your own clarity:
  *   **Core Case:** Odile's shelf. The population frequencies are known and skewed, flipping the evidential weight.
  *   **Borderline Case:** A naturalist in a forest. She doesn't know the ratio of ravens to non-ravens. She must estimate $K$. Here, the weight of the evidence is fuzzy, dependent on her *estimate* of the population, not the population itself.
  *   **Outside Edge:** Pure Logic. If you remove all probabilities and frequencies (Hempel's original formulation), the paradox returns, because you have removed the very mechanism ($K$) that resolves it.

  ### Summary
  You have found that the paradox is not a glitch in logic, but a glitch in **context omission**. The established concept is **Background-Dependent Confirmation**. The "work" is done by the **Prior Probability Distribution** of the sampling pool.

  The gut feeling about the shoe is a valid heuristic for the real world's distribution, but it is not a universal logical truth. Odile's shelf proves that evidence is not about the object in your hand; it is about the room you are standing in when you pick it up.
