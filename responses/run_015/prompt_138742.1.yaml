answer: |-
  Your skepticism is well-founded. Your friend's blog post captures the *vibe* of Updateless Decision Theory (UDT) and its successor Functional Decision Theory (FDT), but it gets several technical details wrong and presents a controversial philosophical objection as a definitive refutation.

  Here is a breakdown of what is accurate, what is distorted, and how a decision theorist would actually analyze your specific test case.

  ### 1. "Never Update on Evidence"
  **Verdict: Distorted / Imprecise**

  This is the most common misunderstanding of UDT. A UDT agent does **not** ignore its observations. If you put a UDT agent in front of a red door and a blue door, and the policy says "go through the blue door," it will look at the doors, identify the blue one, and go through it.

  The "updateless" part refers to **how the policy is selected**, not how it is executed.
  *   **Causal Decision Theory (CDT):** "Given what I see now, which action causes the best outcome?"
  *   **UDT:** "Before I saw anything (behind the veil of ignorance), which *mapping* from observations to actions would have yielded the best expected outcome? I will commit to that mapping. Now that I see [Observation X], I output the action prescribed by that mapping."

  So, the agent uses the observation as an *input* to the function, but it does not update its *prior probabilities* or *utility function* based on the observation when evaluating which policy is best. It acts *as if* it doesn't know which branch of reality it is in, because knowing that might tempt it to deviate from the optimal plan.

  ### 2. Counterfactual Mugging as a "Refutation"
  **Verdict: Contested Opinion, not Fact**

  Your friend is correct that UDT pays in the Counterfactual Mugging scenario.
  *   **The Setup:** Omega flips a coin. If Tails, you pay \$100. If Heads, Omega gives you \$10,000, but *only if* Omega predicts you would have paid had the coin come up Tails. The coin comes up Tails. Omega asks for \$100.
  *   **CDT/EDT:** "The coin is already Tails. My paying now doesn't change the past. I keep my \$100." (Result: You get \$0, because Omega predicted this).
  *   **UDT:** "Ex-ante, before the coin flip, the policy 'Always Pay' has an expected value of \$9,900 (50% chance of \$10k minus \$100 cost). The policy 'Never Pay' has an EV of \$0. I committed to 'Always Pay'. So I pay."

  **Is this a refutation?**
  Mainstream economists and philosophers often say "Yes, paying is insane." Decision theorists working on UDT/FDT say "No, refusing is time-inconsistent."
  They argue that if you refuse, you are essentially saying: "I want to be the kind of agent who gets \$10,000, but I don't want to pay the price when the bill comes." UDT proponents argue that rationality is about winning, and the agent who pays walks away with the higher ex-ante expected value. It is not a consensus refutation; it is the primary *bullet* that UDT proponents bite to maintain consistency in Newcomb-like problems.

  ### 3. UDT vs. Functional Decision Theory (FDT)
  **Verdict: Slight Distortion**

  Your friend is mostly right here, though "just a rename" is dismissive.
  *   **UDT** (proposed by Wei Dai, 2009) was a sketch of the idea.
  *   **FDT** (proposed by Yudkowsky & Soares, 2017) is a formalized paper that refined the math, specifically focusing on "logical counterfactuals."

  In casual conversation among rationalists, they are often used interchangeably. FDT is just the more polished, public-facing version of the same core insight. Your friend isn't wrong to treat them as the same family, but FDT has more rigorous definitions regarding how agents reason about logical similarities (like source code).

  ### 4. Your Sim/Real Test Case
  **Verdict: Your Friend is Wrong About What UDT Says**

  This is the most important part. Your friend claims UDT leads to: *"The sim pays, the real you refuses, and you walk away with $100,000 for free."*

  **This is incorrect.** That outcome describes a Causal Decision Theorist (or an Updateful agent), not a UDT agent.

  Here is how a UDT/FDT agent actually analyzes your scenario:
  1.  **Logical Correlation:** The Sim is a scan of you. It runs the same source code (decision algorithm) as you.
  2.  **The Predictor's View:** The predictor didn't just guess; they ran your source code. The Sim's decision *is* the output of your algorithm in that context.
  3.  **The Real Agent's Reasoning:** When the Real You is asked to pay, you might think, "The Sim already acted, the money is fixed." But UDT says: "My decision now is an instantiation of the same algorithm that the Sim ran. If my algorithm outputs 'Refuse', then the Sim's algorithm *would have* output 'Refuse' (because they are the same algorithm). If the Sim refused, I don't get the \$100,000."
  4.  **The Policy:** To get the \$100,000, the policy must be "Pay when asked in this scenario." Since you don't know if you are the Sim or the Real when the policy is chosen (behind the veil of ignorance), you must commit to paying in *both* instances.

  **The UDT Outcome:**
  *   **Sim:** Pays \$1,000.
  *   **Real:** Pays \$1,000.
  *   **Net Result:** The "system" (You + Sim) pays \$2,000 to generate \$100,000 for the Real You. (Or, depending on the exact payoff structure, the Real You pays \$1,000 to secure the \$100,000 that the Sim secured).

  Your friend's claim that the Real You *refuses* is exactly the behavior UDT is designed to prevent. UDT argues that refusing is "magic thinking" in the opposite direction: it assumes your decision is causally isolated from the Sim's decision, when they are logically linked.

  **Does this feel like magic?**
  Yes. It feels like backwards causation ("My choice now changes the Sim's past choice"). UDT proponents argue it isn't backwards causation; it's **logical correlation**. You aren't changing the past; you are discovering what the algorithm *is*. If the algorithm is "Refuse," it always was "Refuse," and the Sim refused. If the algorithm is "Pay," it always was "Pay," and the Sim paid.

  ### Summary: What should you believe?

  1.  **The "Never Update" claim:** Treat it as shorthand for "Don't update the *policy selection* based on indexical information." The agent still reacts to observations.
  2.  **The "Refutation" claim:** Disregard this as objective fact. It is a philosophical disagreement. UDT proponents accept Counterfactual Mugging payments as the cost of doing business to win Newcomb problems.
  3.  **The Sim/Real Case:** Your friend's description of the outcome is wrong. UDT says **both** instances pay, because they are logically correlated. The "free money" outcome is what happens if you *betray* UDT (i.e., if you act like a Causal Decision Theorist).
  4.  **Real World Bearing:** Your friend is right that this matters mostly for AI, predictors, and high-stakes logical correlations. For standard human decisions where no one is simulating your source code, CDT and UDT usually give the same advice.

  **Recommendation:** The blog post is a decent "critic's summary" but a poor technical explanation. If you want to understand the actual theory, look for the paper *Functional Decision Theory* by Yudkowsky and Soares (2017), or Wei Dai's original UDT posts. They are denser but won't mislead you about the mechanics.
