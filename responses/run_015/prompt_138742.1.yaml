      *   **User's Questions:**
          1.  Which parts of the blog post's description are accurate vs. distorted?
          2.  Is "never update" right? (User suspects not).
          3.  Is Counterfactual Mugging a refutation?
          4.  Is FDT just a rename of UDT?
