answer: |-
  Consider data-poor fisheries stock assessment using only historical time-series of total catch and catch-per-unit-effort (CPUE), a standard constraint for deep-water commercial stocks where independent surveys are economically prohibitive. Model M1 is a delay-difference equation assuming discrete annual recruitment pulses; while biologically recruitment is continuous, refining this to a continuous-time differential equation yields nearly identical biomass trajectories and harvest limits, with parameters mapping smoothly between formulations via standard limiting procedures. Model M2 is a surplus-production model assuming constant catchability ($q$) across decades; in reality, fleet technology improves continuously (hyperstability), causing $q$ to rise as biomass falls, but because the observation equation $CPUE_t = q_t B_t$ mathematically confounds $q$ and $B$, M2 fits the flat CPUE history perfectly by inferring stable biomass. However, M2 is brittle: attempting to replace the constant-$q$ assumption with a time-varying $q(t)$ without independent abundance surveys renders the likelihood surface unidentifiable, causing the model to collapse into divergent solutions, meaning the false constant-$q$ assumption is load-bearing rather than merely convenient.

  **The Check**
  Under Friedman's **as-if standard**, both M1 and M2 are warranted because they minimize prediction error on the available data (catch and CPUE); the falsity of the assumptions is irrelevant given the empirical fit. Under a **de-idealizing standard**, M1 is warranted because the model is robust to having its assumptions made truer (continuous time), whereas M2 is rejected because making the assumption truer (variable $q$) destroys the model's solvability. The standards agree on M1 but peel apart on M2: Friedman accepts the brittle model, while de-idealizing flags it as structurally unsound.

  **The Structural Feature**
  The single feature causing the peel-apart is **compensating error via parameter confounding**. In M2, the false assumption (constant $q$) absorbs the structural error of missing technology dynamics, allowing the model to fit the data only because the errors cancel. If you remove this feature—say, by introducing independent acoustic survey data that breaks the $q$-$B$ confounding—M2 ceases to be empirically indistinguishable from reality; it would fail the fit test immediately, and Friedman's standard would then reject it too. The case relies on the epistemic limitation (data poverty) to protect M2 from empirical falsification.

  **The Strongest As-If Reply**
  A Friedman defender would argue that science is instrumental: if the goal is setting catch limits, and M2 produces stable, profitable limits without expensive surveys, the "truth" of $q$ is irrelevant. The brittleness you describe only matters if the regime changes (e.g., a technology ban); until then, the model succeeds at its assigned task, and demanding de-idealization imposes unnecessary costs for no predictive gain.

  **Your Counter-Reply**
  You answer that scientific models are tools for *intervention*, not just interpolation. A model that cannot distinguish between a stock collapse and a technology boom (because $q$ and $B$ are confounded) cannot diagnose *why* CPUE is stable. If management intervenes (e.g., restricts technology), M2's predictions will fail catastrophically because its success relied on the false assumption holding fixed. Predictive success in a stationary regime does not warrant an assumption that destroys counterfactual stability, which is required for control.

  **Honesty Check**
  This case does not smuggle the verdict, but it does lean heavily on the "data-poor" constraint. If independent surveys were available, M2 would be empirically falsified, and Friedman would lose his footing there anyway. The argument holds only in contexts where equifinality is enforced by measurement limits, which is common in ecology and climate science but less so in physics. You should acknowledge to your department that this is an argument about *robustness under ignorance*, not truth under ideal conditions.
