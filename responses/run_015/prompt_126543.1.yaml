      *   *Camp A (EDT/Functional Decision Theory - FDT):* Believes rationality is about choosing the *output* of your decision algorithm. If my algorithm outputs "cooperate," and I know your algorithm is similar/simulating me, you likely output "cooperate." Therefore, my choice *evidences* (or functionally determines) yours.
      *   *Camp B (Causal Decision Theory - CDT):* Believes rationality is about causing outcomes. If I cannot causally influence you (no signal, no physical interaction), my choice changes nothing about your state. Therefore, "trade" is impossible; it's just wishful thinking.
      *   *The Stalemate:* Utilities line up (both agree on the payoff matrix), but the *link* between action and outcome is disputed.

  3.  **Diagnosing the Disagreement (Substantive vs. Verbal vs. Category Error):**
      *   *Is it just verbal?* "Trade" usually implies exchange. If I give you nothing and you give me nothing, but we both *act* as if we traded, is it trade? Camp B says "No, that's not what trade means." Camp A says "Yes, the functional outcome is what matters." This suggests a verbal component regarding the definition of "trade."
      *   *Is it substantive?* Yes. It's about the definition of *rational agency*. Is an agent a physical locus of causal force (CDT) or an instantiation of an abstract algorithm (FDT/EDT)? This is a deep metaphysical/normative split.
