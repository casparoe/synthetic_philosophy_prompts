prompt: |-
  In my grad seminar we've been stuck on acausal trade for months—some students say it's just evidential decision theory applied across possible worlds, others say it's nonsense because "trade" presupposes causal interaction. Everyone cites the same Newcomb-style setups and thier utilities line up identically, yet nobody shifts. Is this a substantive disagreement about rationality, a verbal mess around what "agreement" means without causal contact, or are we actually asking two different things—one about decision theory, one about whether agency requires causal efficacy? Diagnose it using what each camp actually commits to, not just the slogans. And tell me: if it's not empirical—there's no experiment we can run—would a sharper formal distinction between causal and evidential reasoning in non-interacting systems actually move anyone, or is the stall just a sign that the concept of trade breaks down here?
