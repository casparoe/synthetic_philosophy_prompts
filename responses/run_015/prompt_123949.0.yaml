      *   *Conclusion:* Identifying a *qualitative* difference is not the same as establishing a *quantitative* hierarchy, though they often overlap in intuition. The charge of "smuggling" holds some weight if the philosopher implies "worse" while saying "different," but it's not logically necessary.

