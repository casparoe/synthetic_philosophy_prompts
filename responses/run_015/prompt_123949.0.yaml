      *   **Core Premise 2:** Philosophers who reject ranking often still claim genocide involves a *distinctive* moral wrong not present in other evils (like neglect or displacement).
      *   **Inference 2:** Isn't claiming a "distinctive wrong" effectively smuggling in an ordinal comparison of severity, contradicting the anti-ranking position?
      *   **Underlying Tension:** Is there a logical contradiction in the "anti-ranking" stance? Does rejecting hierarchy force radical egalitarianism of suffering, or is there a middle ground?

  2.  **Initial Assessment & Philosophical Context:**

