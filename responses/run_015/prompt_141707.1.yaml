answer: |-
  Here is a proposal for a principle, an analysis of the unlisted cases, and a statement on the moral status of manipulation, designed to fit the verdicts you have already reached.

  ### 1. The Principle: The Normative Expectation of Agency

  **Definition:**
  Influence is **manipulative** if and only if:
  1.  **Mechanism:** It intentionally operates by bypassing the target's critical deliberation (working on System 1, emotion, or inertia rather than the weighing of reasons); **AND**
  2.  **Context:** It occurs within a relationship or interaction where the target has a **reasonable normative expectation** that their agency will be engaged rather than circumvented; **AND**
  3.  **Authority:** The influencer lacks specific **role-based or consensual authority** to circumvent that agency for the target's benefit.

  **How this ties to your cases:**

  *   **Clause 1 (Mechanism)** captures the *Charity*, *GP*, *Manager*, and *Partner* cases. They all bypass full deliberation (emotion, framing, omission, default-setting). It excludes the *Beta Blocker* case (self-regulation is not bypassing agency, it is enabling it).
  *   **Clause 2 (Context/Expectation)** is the knife that separates the **Canteen** from the **Partner**.
      *   *Canteen:* A diner has no reasonable expectation that the canteen architecture is neutral or that they are entitled to a deliberative partnership regarding fruit placement. The context is service provision, not joint deliberation. Therefore, it fails Clause 2. It is *shaping*, not manipulation. This forces you to keep your verdict that it is "not manipulation."
      *   *Partner:* A life partner has a supreme expectation of joint agency. Arranging viewings unilaterally circumvents the joint deliberation process. It satisfies Clause 2.
      *   *Seminar:* Academic norms allow for rhetorical shorthand ("as we all know") as part of the flow of argument. The expectation of strict deliberative purity is lower here than in a medical or marital context. It satisfies Clause 2 only weakly, matching your "mild" verdict.
  *   **Clause 3 (Authority)** separates the **GP** from the **Manager** and the **Partner**.
      *   *GP:* The medical role grants specific authority to filter and frame information for health outcomes. The patient authorizes this bypass by entering the consultation. This defeats Clause 3. It is *persuasion*.
      *   *Manager:* The employment role grants authority to assign tasks, but not to obscure career risks. The manager lacks authority to bypass your deliberation on promotion prospects. This satisfies Clause 3. It is *manipulation*.
      *   *Partner:* There is no role authority that allows one partner to pre-empt joint life decisions. This satisfies Clause 3. It is *manipulation*.

  **The Verdict You Must Abandon:**
  To keep this principle precise, you must abandon the verdict on the **Union Organiser**.
  *   *Your Verdict:* Persuasion, permissible.
  *   *Principle's Verdict:* Manipulation.
  *   *Why:* The organiser is bypassing critical deliberation (using an unrepresentative anecdote to spur anger) within a context where members expect a honest assessment of the case for striking (Context). While they have some authority to advocate, lying by omission regarding representativeness exceeds that authority (Authority).
  *   *The Trade-off:* You must reclassify this as **permissible manipulation** rather than persuasion. The anger is about a real wrong, which justifies the manipulation, but it remains manipulation because it treats the members' agency as a tool to be sparked rather than a mind to be convinced. This aligns better with your intuition about the Charity case (manipulative but not wrong).

  **The Teacher Case:**
  This principle leaves the Teacher case ambivalent, which matches your gut.
  *   *Mechanism:* Bypasses belief-formation (asserting a truth the child doesn't yet hold).
  *   *Context:* High expectation of guidance.
  *   *Authority:* Does the teacher's role authorize *fabricating* belief for developmental ends?
  *   *Resolution:* If you view the teacher's role as "guardian of truth," it is manipulation. If you view it as "architect of potential," it is authorized. The principle forces you to decide what the teaching role *is*, rather than hiding the ambiguity.

  ### 2. Application to Unlisted Cases

  **Advance Consent ("You have my permission to push me")**
  *   **Verdict:** Not manipulation (or permissible manipulation).
  *   **Reasoning:** This satisfies Clause 3 (Authority). By granting explicit consent to be pushed, the target waives their normative expectation of non-interference. This is the logic of the Ulysses contract. However, if the push exceeds the scope of the consent (e.g., you agreed to be pushed to exercise, but I push you to sell your house), it reverts to manipulation.

  **Self-Manipulation (Deleting the app, Beta blockers)**
  *   **Verdict:** Not manipulation.
  *   **Reasoning:** This fails Clause 2. There is no *relational* expectation of agency between parts of the self in the relevant moral sense. We do not owe our future selves the same deliberative respect we owe a partner or patient. This is *self-regulation*. The principle defines manipulation as an interpersonal wrong; self-influence is a matter of prudence.

  **Institutional Influence / Algorithms**
  *   **Verdict:** Manipulative if the design intent bypasses deliberation without user authority.
  *   **Reasoning:** Clause 1 (Intention) is satisfied by the designers, even if no single person in the room intends it at the moment of impact. Clause 2 is satisfied because users have a reasonable expectation that a search engine or feed is offering relevant information, not engineering addiction. Clause 3 is usually satisfied because users have not authorized addiction-based design.
  *   *Nuance:* If the algorithm is a "Canteen" (e.g., a public health app moving fruit to eye level), it may be permissible shaping. If it is a "Casino" (engineering compulsion), it is manipulation. The principle forces you to look at the *design goal* relative to the *user's expectation*.

  ### 3. Moral Status and Belief vs. Choice

  **Is Manipulation Pro Tanto Wrong?**
  On this account, **yes**. Manipulation is pro tanto wrong because it violates the **Normative Expectation of Agency** (Clause 2). It treats a person as a mechanism to be tuned rather than a will to be engaged. This is a defect in the interaction itself, regardless of the outcome.
  *   *Why the Charity/GP cases are okay:* They are cases of **justified override**. The wrongness of bypassing agency is outweighed by the benevolence of the end and the authority of the role.
  *   *Why this matters:* It explains why you "dislike" the Charity technique even though you don't think it's wrong. You recognize the defect (bypassing reason) but accept the justification (saving lives). It explains why the Partner case feels worse than the Manager case: the violation of agency is deeper (intimate trust vs. transactional trust).

  **Belief vs. Choice**
  They must be handled separately, with **Belief Manipulation** treated as the more serious category.
  *   **Choice Manipulation (Canteen, Partner's viewings):** Alters the *environment* or *options* available to the agent. The agent's internal reasoning machinery remains intact, even if the inputs are skewed. This is easier to reverse and less invasive.
  *   **Belief Manipulation (Teacher, Seminar "as we all know"):** Alters the *agent's reasoning machinery* itself. It changes what the target takes to be true or possible.
  *   **The Principle's Stance:** Belief manipulation requires a higher threshold of Authority to be permissible. A GP can nudge a choice (take the statin) more easily than they can nudge a belief (lie about the success rate). The Teacher case is ambivalent precisely because it straddles this line: she is shaping a belief ("you are good at this") to enable a choice (try harder).
  *   **Recommendation:** In your handbook, argue that professional ethics should permit choice-nudging (paternalism) more readily than belief-shaping (indoctrination), unless the belief-shaping is explicitly developmental (as in education).

  **Summary for your Chapter:**
  Use the **Normative Expectation of Agency**. It allows you to say: "Manipulation is not defined by the *method* (nudging, framing, lying), but by the *violation of a relational contract*." This frees you to permit benevolent nudges (Canteen, GP) while condemning self-serving control (Manager, Partner), without getting tangled in definitions of "truth" or "transparency."
