      *   *Key Insight:* The Dollar Auction is often modeled as an all-pay auction. The escalation happens because players try to recoup sunk costs, which is technically irrational *unless* they value the win intrinsically or are signaling.
      *   *Best Path:* Focus on the **Common Knowledge of Rationality (CKR)** failure. This is the standard game-theoretic resolution to the Chainstore/Centipede/Dollar Auction paradoxes.

