answer: |-
  Prioritarianism is defined by a specific ranking rule: outcomes are evaluated by the sum of a transformation of individual wellbeing levels, $\sum f(w_i)$, where $f$ is increasing and strictly concave. This concavity ensures that a benefit to a person matters more the lower their wellbeing level. The view's primary selling point is its immunity to the levelling-down objection. Unlike strict egalitarianism, prioritarianism never ranks an outcome as better simply because the better off are dragged down; since $f$ is increasing, raising anyone's wellbeing always increases the total value. It purportedly captures the moral urgency of helping the worse off without fetishizing equality for its own sake. However, this immunity is tested when we move from certainty to uncertainty. When identities are not fixed in advance and choices involve risk, the levelling-down objection does not disappear; it migrates, reappearing as a conflict between prioritarian rankings and the *ex ante* Pareto principle.

  Consider the case of Ada and Bella. They are currently equally well off. We face a choice between Option S (Safe), where each ends at a wellbeing level of 60 for sure, and Option R (Risky), where a fair coin decides who ends at 130 and who ends at 10. Under R, the distribution of wellbeing is identical in either state: one person at 130, one at 10. The expected wellbeing for each person under R is 70, compared to 60 under S. Furthermore, total wellbeing is 140 in every state under R, versus 120 under S. Despite these facts, standard (*ex post*) prioritarianism prefers S. Using the square root transformation as specified, the value of S is $2 \times \sqrt{60} \approx 15.49$. The value of R is the expected sum of transformed utilities: $0.5(\sqrt{130} + \sqrt{10}) + 0.5(\sqrt{10} + \sqrt{130}) = \sqrt{130} + \sqrt{10} \approx 11.40 + 3.16 = 14.56$. Since $15.49 > 14.56$, the view recommends S. It prefers an option where every person has a lower expected wellbeing and where total wellbeing is lower in every possible state.

  Is this verdict the levelling-down objection in a new guise? Strictly speaking, no one is levelled down here. In the classic objection, egalitarians admit a world where the better off are reduced is *in one way* better (more equal), even if worse overall. Here, no actual person is reduced to achieve equality; rather, an expected gain for everybody is declined. However, the structural complaint is identical. The objection to egalitarianism was that it sacrifices overall good for the sake of a pattern. In this risk case, prioritarianism sacrifices *expected* overall good (and *ex ante* individual good) for the sake of the concave weighting function. The "levelling" occurs in the space of expectations. The view effectively says that the moral gain from avoiding the possibility of someone being at 10 outweighs the certain loss of expected utility for both agents. If the levelling-down objection is fundamentally about a theory recommending an option that is worse for everyone (in expectation or reality) to satisfy a distributive constraint, then prioritarianism fails to escape it. It merely shifts the domain from certain outcomes to probabilistic choices.

  To maintain this verdict, the prioritarian must reject the *ex ante* Pareto principle, which holds that if every person has a higher expected wellbeing in Option A than Option B, A cannot be worse than B. Rejecting *ex ante* Pareto is a significant cost. It implies that rational agents, knowing R offers them a higher expected return, ought to choose S for moral reasons. The prioritarian might defend this by arguing that a person's good is not their expected wellbeing, but their actual realized wellbeing. Probabilities are epistemic or metaphysical features of the choice, but moral urgency attaches to the actual state of the person who ends up at 10. On this *ex post* view, the coin flip does not dilute the claim of the person who actually suffers. The strong priority weight assigned to the level 10 outweighs the gains at 130, regardless of the probabilities.

  However, this defense comes at the price of making the view appear irrational from the standpoint of the agents involved. If Ada and Bella both prefer R, and the moral theory tells them to choose S, the theory alienates the agents from their own good. It suggests that what is good for them (expected wellbeing) is not what matters morally. This is a coherent position, but it limits the view's appeal as a guide for social choice under uncertainty.

  Alternatively, the prioritarian could accept *ex ante* Pareto by modifying the view to apply the concave transformation to expected wellbeing levels rather than realized ones (*ex ante* prioritarianism). Here, we calculate $\sum f(E[w_i])$. Since both have an expected wellbeing of 70 under R and 60 under S, and $f$ is increasing, R is strictly better than S. This saves *ex ante* Pareto and avoids the "levelling down" of expectations. But this revision eviscerates the core motivation of prioritarianism. If we apply the transformation to expectations, the view becomes indifferent between Option R (a 50% chance of 130 or 10) and a Sure Option T where both get 70 for sure. In both cases, $E[w] = 70$, so the prioritarian value is identical. Yet, intuitively, the person who actually lands at 10 in Option R has a stronger moral claim than someone at 70. *Ex ante* prioritarianism cannot register this claim because it ignores the actual distribution of realized wellbeing. It collapses into a form of utilitarianism regarding risk, caring only about the distribution of expectations, not outcomes. This is a fatal loss of grip on the intuition that motivated the view: that benefits matter more the worse off the recipient *actually is*.

  One might propose an intermediate view, such as giving some weight to *ex ante* Pareto and some to *ex post* outcomes. But any such hybrid requires a trade-off rule that is itself arbitrary. If we prioritize *ex post* outcomes enough to distinguish R from a sure 70, we reintroduce the violation of *ex ante* Pareto in cases where the risk is high enough. There is no stable middle ground that preserves the concave weighting of actual outcomes while satisfying *ex ante* Pareto in all cases. The mathematics of the concave function dictates that if you care about the dispersion of realized outcomes, you must sometimes prefer a lower expected sum to avoid low realized states.

  Therefore, we must decide: does prioritarianism survive this case? It survives only if we accept that the *ex ante* Pareto principle is not absolute. The objection that prioritarianism recommends an option worse for everyone in expectation is valid, but it is not decisive against a theory that prioritizes actual wellbeing over probabilistic advantage. However, admitting this reveals that the escape from the levelling-down objection was cosmetic. The objection did not disappear; it migrated. In the certain case, prioritarianism avoids saying a world where everyone is worse off is better. But in the uncertain case, it says an option where everyone is *expected* to be worse off is better. The underlying tension remains: the view's commitment to weighting the worse off heavily enough to override aggregate gains (or expected aggregate gains) is the very feature that invites the Pareto/Levelling-Down critique.

  Consequently, prioritarianism does not truly escape the spirit of the levelling-down objection. It avoids the specific formulation involving certain equality, but it inherits a structurally identical problem under uncertainty. To remain a distinct view that cares about the actually worse off, it must violate *ex ante* Pareto. If it refuses to violate *ex ante* Pareto, it ceases to be prioritarianism in any meaningful sense, becoming indifferent to actual inequality. Thus, the prioritarian must bite the bullet: they must reject *ex ante* Pareto. In doing so, they admit that their theory sacrifices expected good for the sake of its weighting function. This confirms that the levelling-down objection was never merely about "levelling" in the literal sense, but about the willingness to sacrifice overall value for distributive weightings. Prioritarianism retains this willingness, proving that the objection migrates rather than vanishes. The view survives, but only by acknowledging that it demands a sacrifice of expected individual advantage to protect the actually vulnerable, a cost that mirrors the egalitarian sacrifice it sought to avoid.
