          *   *Lewis:* SemVer works *because* we all agree it works. It reduces cognitive load. If I bump a minor version, you know your code won't break. This is a coordination equilibrium.
          *   *Evolutionary:* Forking is the selection pressure. If a maintainer breaks SemVer too often, their project dies (users leave/fork). The norm survives because projects that violate it get "selected out."
          *   *Synthesis:* It's Lewisian *within* a project, Evolutionary *across* the ecosystem.
      *   **The Forking Paradox (Failure vs. Exit):**
          *   Coordination Failure: Splitting the network effect. Doubling maintenance work.
          *   Democratic Exit: The "Right to Fork" is the ultimate check on maintainer power. It's the nuclear option that keeps maintainers honest.
      *   **The Blockchain Contradiction:**
