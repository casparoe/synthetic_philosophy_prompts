answer: |-
  This is a fantastic question. You've identified a genuine tension in the sociology of software engineering. As a backend engineer, you deal with the *consequences* of these norms (breaking builds, dependency hell), but you're asking about the *meta-structure* that allows them to exist.

  Here is the breakdown of the philosophical machinery running under the hood of open source versioning and forking.

  ### 1. Lewisian Coordination vs. Evolutionary Selection

  You asked if this dance presupposes David Lewis's idea of conventions (coordination equilibria based on common knowledge) or a pure evolutionary account (norms survive fork-pressure).

  **The short answer:** It uses Lewisian logic *locally* and Evolutionary logic *globally*.

  **The Lewisian View (Inside a Project):**
  Semantic Versioning (SemVer) is a textbook Lewisian convention. It only works because of **common knowledge**.
  *   I know that `1.1.0` won't break my code.
  *   I know that *you* know that `1.1.0` won't break my code.
  *   I know that *you* know that *I* know this, so you feel social pressure not to break it.

  If this common knowledge breaks down (e.g., a maintainer decides SemVer is "too restrictive"), the coordination equilibrium collapses. Users stop trusting minor releases. They pin dependencies strictly. The utility of the convention vanishes. In this view, forking is a **coordination failure**. It means the group failed to maintain the common knowledge required to stay on one branch.

  **The Evolutionary View (Across the Ecosystem):**
  However, the *existence* of the fork option is an evolutionary pressure. Norms in open source aren't enforced by a central government; they are enforced by **selection pressure**.
  *   If a maintainer violates the SemVer norm too aggressively, the "organism" (the project) risks death.
  *   Users migrate to a fork (a competitor species) that respects the norm.
  *   The norm survives not because everyone agreed to it in a meeting, but because projects that ignore it get abandoned.

  **The Synthesis:**
  The practice presupposes a **hybrid**. We *talk* like Lewisians ("This is a promise," "This is a contract") to maintain local coordination, but we *act* like Evolutionists ("If you don't like it, fork it") to maintain global health. The threat of the fork (evolutionary selection) is what keeps the maintainer honest enough to sustain the Lewisian convention.

  ### 2. The Blockchain Contradiction: Stability vs. Sovereignty

  You noted the inconsistency: Breaking changes in libraries are "morally bad," but hard forks in blockchain are often celebrated or treated as neutral governance tools.

  This isn't actually a contradiction if you look at the **teleology** (the purpose) of the system.

  *   **Open Source Libraries (The Service Model):** The goal is **utility and stability**. You import a library to *not* think about it. It is a dependency. A breaking change increases your cognitive load and maintenance cost. Therefore, breaking the API is a violation of the implicit social contract: "I provide stability; you provide adoption."
  *   **Blockchains (The Sovereignty Model):** The goal is **consensus on truth**. A blockchain is a state machine agreed upon by a network. If the community decides the rules need to change (e.g., to reverse a hack, or to change inflation rates), the "code is law" paradigm must yield to "community is law." A hard fork is a **schism in sovereignty**. It's not seen as "breaking an API"; it's seen as a civil war where both sides claim legitimacy.

  **Philosophical Distinction:**
  *   In OSS libs, the user is a **client**. Breaking changes are bad service.
  *   In Blockchain, the node operator is a **citizen**. Hard forks are elections.

  Treating them the same would be a category error. We condemn breaking changes in `lodash` because we want a tool. We accept hard forks in Ethereum because we want a polity.

  ### 3. Governance Implications of an Evolutionary View

  If we accept that norms evolve without central authority (the Evolutionary view), current package repository governance (npm, PyPI, crates.io) is actually fighting the wrong battle. Currently, they try to enforce Lewisian conventions (e.g., warning about breaking changes, encouraging SemVer).

  If the underlying theory is truly evolutionary, governance should shift to **facilitating selection** rather than **enforcing coordination**.

  **What would change?**
  1.  **Fork Visibility:** Currently, forks are often treated as second-class citizens in package registries. An evolutionary system would treat forks as first-class competitors. The registry should make it trivial to see "This package has a fork with 20% more adoption and better security patch velocity."
  2.  **Automated Migration:** Instead of promising not to break things (Lewisian), assume things *will* break. Invest heavily in tooling that automatically refactors code to match the new API. Reduce the "cost of mutation."
  3.  **Reputation over Versioning:** SemVer is a low-bandwidth signal. An evolutionary system would rely on high-bandwidth reputation metrics (time-to-patch, bus factor, dependency health) to let users select the "fittest" branch automatically.
  4.  **Immutable Dependencies:** If norms are fluid, the only safety is immutability. Governance might move toward content-addressed storage where "latest" is a dangerous concept, and every build explicitly selects its point in the evolutionary tree.

  ### 4. Is the Practice Underdetermined?

  **Yes, it is philosophically underdetermined.**

  The practice of open source does not strictly commit us to Lewis or Evolution. You can justify the current workflow using either framework:
  *   **Lewisian Justification:** "We fork only when coordination is impossible, to preserve the value of the convention."
  *   **Evolutionary Justification:** "We use SemVer to reduce friction, but we fork to ensure bad maintainers are selected out."

  However, the **rhetoric** we use is heavily Lewisian. We talk about "breaking the contract," "violating trust," and "promises." This suggests that while the *mechanism* of survival is evolutionary, the *psychological glue* holding the community together is Lewisian common knowledge.

  If we dropped the Lewisian rhetoric and admitted it was purely evolutionary ("We don't owe you stability, survive if you can"), the ecosystem would likely collapse into high-friction chaos. The "lie" (or perhaps the "noble fiction") that SemVer is a moral promise is necessary to lower transaction costs, even if the ultimate enforcement mechanism is the threat of the fork.

  ### Summary for the Backend Engineer

  *   **The Norm:** SemVer is a coordination equilibrium (Lewis) sustained by the threat of forking (Evolution).
  *   **The Fork:** It is both a failure of coordination (inefficient) and a necessary check on power (democratic).
  *   **The Blockchain:** Different goal (sovereignty vs. stability), so different norms apply.
  *   **The Governance:** If you lean evolutionary, stop trying to enforce promises and start building tools that make switching costs near-zero.
  *   **The Philosophy:** The system is underdetermined. We use Lewisian language to keep the peace, but Evolutionary mechanics to keep the code alive.

  You don't need to resolve the philosophy to write code, but understanding that SemVer is a **social technology** rather than a **technical constraint** explains why it fails so often when maintainers treat it as just numbers.
