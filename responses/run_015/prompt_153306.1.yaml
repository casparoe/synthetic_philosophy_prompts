answer: |-
  **Question 1**
  Let's press immediately on the explanatory weight of this 'exclusion clause'. David Lewis famously argued that consistency is preserved by ordinary causal failures—the gun jams, you slip on a banana skin. You're claiming something stronger: that the action is conceptually unrepresentable to the agent at that specific temporal node. But isn't there a risk that this is merely a redescription of the consistency constraint rather than a mechanism for it? If I stand before my grandfather and find I cannot even formulate the intention to shoot, have you actually explained *why* the paradox is avoided, or have you simply pushed the modal mystery back from the physical realm into the cognitive one? What work is the clause doing that isn't already done by saying 'the probability of that event is zero'?

  **Question 2**
  I want to follow that through to the Grandfather Paradox specifically, but complicating the agent's psychology. If we accept your view that representational content is tied to the temporal node, how does this cope with psychological fragmentation across loops? Suppose the agent's mind isn't a unified whole across the timeline—perhaps memory or cognitive capacity is degraded or split by the traversal. If the representational content required to form the intention is blocked at node A, but the psychological continuity from node B suggests the capacity exists, does the agent experience a phenomenological gap? Can they feel the inability to represent the act, or does the exclusion clause imply their psychology is altered such that they don't even notice the missing option?

  **Question 3**
  Finally, let's step away from thought experiments. Your defence relies heavily on conceptual coherence and the logic of representation. But suppose physicists were to detect signatures of Closed Timelike Curves in quantum systems, or neuroscientists discovered that intention formation is entirely decoupled from temporal context in the way your clause forbids. What kind of empirical discovery—not another logic puzzle, but a finding in physics or cognitive science—would actually force you to abandon the exclusion clause? Where is the falsifiable line in the sand?
