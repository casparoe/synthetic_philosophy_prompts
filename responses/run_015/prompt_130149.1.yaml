entity to branch without contradiction, or we reject one of (1) through (5). (11) Rejecting (8) is costly: it severs identity from uniqueness and makes the concept of “one life-path” incoherent. (12) Rejecting (1) is also costly: it implies that a patient whose neurons are slowly replaced by prosthetics over a decade is literally not the original patient. (13) Rejecting (5) requires explaining why physical adjacency within one skull matters more than functional-causal isomorphism across substrates, which seems to reintroduce an unexplained, mysterious substrate-dependence. I want to preserve (1) and (2) if I can, but I need to know whether the escape is in (4), in (7), or in (8), and what each escape actually commits me to ontologically. Which step should I give up, and what does giving it up cost?
