answer: |-
  Right, let's unpack this. Your tutor's positions are a classic mix of the **Non-Identity Problem** (Parfit) and what looks like a **Hybrid View** on harm. She isn't sticking to just one rulebook; she's weaving between *person-affecting* intuitions (did we hurt this specific person?) and *impersonal* principles (is the world worse off?).

  Here is the breakdown of her framework, the prediction for your clinic case, and the specific hypothetical that would force her rules to crash into one another.

  ### 1. Diagnosing the Framework
  Your tutor is running a **Hybrid View: Impersonal Welfare with an Agency Constraint.**

  *   **The Impersonal Rule (Teen Mom/Depletion/Climate):** She accepts the logic of the Non-Identity Problem. She agrees that if a choice determines *who* exists, you can't say the resulting person is "worse off" than they would have been (since the alternative was non-existence). However, she rejects the idea that this makes the choice morally neutral. She believes we have an obligation to future people to ensure their lives go well, regardless of their identity. This is often called the **Same Number Quality Claim**: if we could create person X or person Y, and Y would have a better life, it's wrong to create X, even if X isn't "harmed."
  *   **The Agency Constraint (Deaf Embryo):** Here, she shifts. She calls this "harming someone specific." Why the difference from the teen mum case? Likely because of **intentionality and medical context**. In the teen mum case, the hardship is a foreseeable side effect of timing. In the deaf embryo case, the disability is the *selected trait*. She seems to hold that when we are in a medical/procreative context, deliberately selecting for impairment violates a specific duty of care to that child, triggering person-affecting language.
  *   **The Non-Existence Rule (No Child):** She confirms she isn't a total utilitarian; there is no duty to bring happy people into existence, only a duty not to bring people into existence who will have poor lives (or worse lives than available alternatives).

  ### 2. Prediction: The Clinic Case
  **The Scenario:**
  *   **Option A:** Edit Embryo A. Fixes lethal mutation, but leaves chronic condition (life worth living).
  *   **Option B:** Wait 48 hours. Embryo B forms (different genetics, healthy).

  **Her Verdict:**
  *   **Is picking A-with-fix wrong?** **Yes.** She will likely rule this impermissible. Even though Embryo A isn't "harmed" relative to death (the lethal mutation), the parents had the option to create Embryo B, who would have a significantly better life. Following her logic on *Depletion* and *Teen Mum*, creating a child with a chronic condition when a healthy alternative was available is a "bad choice" that violates our obligation to future people. Given her *Deaf Embryo* verdict, she might even go further and say this *does* harm A specifically, because it involves a medical intervention that knowingly leaves a child impaired when a healthy alternative existed.
  *   **Is picking B wrong?** **No.** This is the morally preferable option. It aligns with the principle of **Procreative Beneficence** (selecting the child expected to have the best life).

  **Why?**
  She treats this less like the *Teen Mum* case (where the hardship is social/circumstantial) and more like the *Deaf Embryo* case (medical selection). Since B is available and healthy, choosing A imposes a chronic condition unnecessarily.

  ### 3. The "Splitting Case"
  You asked for a hypothetical that would split her rules apart. The tension in her view is between **Maximising Welfare** (Impersonal) and **Avoiding Medical Impairment** (Agency/Person-Affecting).

  To break this, we need a case where the "Impaired" option actually produces *more* welfare than the "Healthy" option.

  **The Hypothetical: The "Happier Impaired" Embryo**
  Imagine the clinic presents a new variation:
  *   **Option A (Edit Embryo A):** The fix leaves A with the chronic condition (e.g., permanent mobility issues), *but* due to other genetic factors, A is predisposed to a very high level of happiness, resilience, and life satisfaction (Score: 8/10).
  *   **Option B (Wait for Embryo B):** B is physically healthy with no chronic conditions, *but* is predisposed to moderate happiness and higher susceptibility to depression (Score: 6/10).

  **How the Rules Split:**
  1.  **The Impersonal Welfare Rule (Teen Mum/Depletion):** This rule demands we create the best life possible. Since A's life (8/10) is better than B's (6/10), this rule says **Pick A**. To pick B would be to create a person with a lower quality of life when a better one was available.
  2.  **The Agency/Deafness Rule:** This rule is suspicious of deliberately selecting a child with a chronic condition/impairment. Even if A is happier, A is still "chronically condition-ed" compared to healthy B. Her intuition from the *Deaf Embryo* case suggests that selecting for impairment is "harming someone specific." This rule pushes her to **Pick B** to avoid the "harm" of the chronic condition.

  **The Verdict Conflict:**
  If she picks **A**, she admits that welfare trumps the "harm" of impairment (undermining her Deaf Embryo verdict).
  If she picks **B**, she admits that avoiding impairment trumps maximising welfare (undermining her Depletion/Teen Mum verdict where she insisted we must avoid creating poorer lives).

  ### Summary for your Tutorial
  Tell her you suspect she is applying an **Impersonal Welfare Principle** generally, but switches to a **Person-Affecting Constraint** when medical selection is involved. Then, hit her with the **"Happier Impaired"** case. Ask her: *"If the child with the chronic condition would objectively have a happier life than the healthy alternative, do we still owe it to them to be healthy rather than happy?"* That is where her hybrid view will likely creak.
