answer: |-
  ### 1. Exam Prompt

  **Course:** PHIL 450: Advanced Metaphysics
  **Assessment:** Final Essay
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approx. 1,200 words

  **Prompt:**

  Consider the following scenario ("The Synthetic Deposition Case"):

  An automated additive manufacturer constructs a statue (*S*) using clay. The machine draws from a reservoir of original clay particles (*R*). However, the machine operates via a "synthetic swap" mechanism: as each particle from *R* is deposited to form a layer of *S*, it is instantaneously replaced by a synthetically identical particle (*P***) of different molecular origin before bonding occurs. Consequently, *S* is composed entirely of *P*** particles, while *R* (minus the used volume) is compressed into a separate lump (*L*). At no point do *S* and *L* share any material parts. *S* and *L* occupy distinct spatial regions during formation, but upon completion, *L* is moved to occupy the exact spatial region of *S*'s base, though they remain materially distinct.

  Write an essay assessing the metaphysical implications of this case. Specifically, you must address:

  1.  **Constitution:** Does the lump *L* ever come to constitute the statue *S*, given they share no mereological overlap?
  2.  **Persistence:** Does *S* survive the complete part-replacement occurring *during* its own formation, or is it a mere sequence of temporal parts?
  3.  **Theoretical Viability:** Can a Constitution-without-Identity (CwI) view accommodate this scenario without collapsing into a coincidence of distinct objects or eliminativism about *S*?

  Your answer must engage with the specific mechanics of the synthetic swap. Generic summaries of the standard Statue/Lump puzzle will not suffice.

  ***

  ### 2. Model Answer Outline

  **Title:** Material Discontinuity and the Limits of Constitution

  **Introduction (approx. 150 words)**
  *   **Thesis:** The Synthetic Deposition Case severs the standard link between constitution and material coincidence. *L* does not constitute *S* because they share no matter. *S* persists only if identity is grounded in causal-functional continuity rather than mereological constancy. Consequently, standard CwI fails unless modified to account for non-material constitution, risking a collapse into eliminativism.
  *   **Roadmap:** Analyze the material divergence, assess diachronic identity during formation, and evaluate CwI's capacity to handle non-coincident objects.

  **Section 1: The Failure of Standard Constitution (Question a) (approx. 300 words)**
  *   **Standard View:** Typically, constitution requires the constituter (Lump) and constituted (Statue) to share all material parts at time *t* (spatial coincidence).
  *   **Application:** In this scenario, *S* is made of *P*** (synthetic) and *L* is made of *R* (original). They are materially disjoint.
  *   **Analysis:** Therefore, *L* cannot constitute *S* in the standard sense. To claim *L* constitutes *S* would require a view where constitution is purely formal or causal, not material. If constitution requires material sharing, the relation here is null. The "Statue/Lump" intuition relies on them being the same stuff arranged differently; here, they are different stuff entirely.
  *   **Implication:** This forces a distinction between *material constitution* (sharing parts) and *causal constitution* (one object bringing another into being). *L* causally enables *S*, but does not materially constitute it.

  **Section 2: Diachronic Identity and Formation (Question b) (approx. 350 words)**
  *   **The Problem:** *S* undergoes 100% part replacement *during* its coming-into-existence. Standard Ship of Theseus cases involve replacement *after* formation; here, the replacement is constitutive of the formation.
  *   **Mereological Essentialism:** If *S* requires its original parts (*R*), *S* never exists. The object is merely a sequence of *P*** aggregates.
  *   **Four-Dimensionalism/Temporal Parts:** *S* is a spacetime worm. The "swap" is just a difference in temporal slices. *S* survives if there is causal continuity between the deposition of *R* and the bonding of *P***.
  *   **Functionalist View:** *S* survives if the functional role (shape, structural integrity) is maintained despite the molecular swap.
  *   **Conclusion on Persistence:** *S* survives only if we reject mereological essentialism. However, unlike standard cases, there is no moment where *S* consists of *R*. Thus, *S*'s identity is entirely dependent on the *process*, not the *substrate*.

  **Section 3: CwI and the Risk of Collapse (Question c) (approx. 300 words)**
  *   **CwI Standard:** *S* and *L* are numerically distinct but spatially coincident.
  *   **The Conflict:** In this case, upon completion, *L* is moved to *S*'s region. If they are materially distinct, they cannot be spatially coincident in the strict sense (two material objects cannot occupy the same space).
  *   **Collapse into Coincidence:** If the theorist insists *S* and *L* coincide, they must argue for interpenetrable matter (implausible) or that *S* is immaterial (platonism).
  *   **Collapse into Eliminativism:** If matter cannot interpenetrate, and *S* is not *L*, and *S* is not the *P*** aggregate (due to swap), then *S* does not exist. Only the *P*** aggregate exists.
  *   **Resolution:** To save CwI, one must argue that constitution is a relation between an object and a *history*, not an object and *matter*. However, this stretches "constitution" beyond recognition. It is more honest to adopt a causal-historical view of objecthood, admitting that standard CwI cannot handle non-materially-constituted objects.

  **Conclusion (approx. 100 words)**
  *   Summarize: The Synthetic Deposition Case demonstrates that standard material constitution theories rely on hidden assumptions about material continuity.
  *   Final Verdict: *L* does not constitute *S*. *S* persists only via functional continuity. CwI fails here unless it abandons material coincidence, effectively becoming a theory of causal history rather than constitution.

  ***

  ### 3. Marking Scheme (Total: 20 Points)

  | Must-Hit Analytical Move | Points | Characteristic Error (Loss of Points) |
  | :--- | :---: | :--- |
  | **1. Identification of Material Disjointness:** Explicitly notes that *S* (synthetic) and *L* (reservoir) share no atomic parts, violating the standard condition for material coincidence. | **4** | **The Coincidence Assumption:** Assumes *S* and *L* share matter because they are "clay," ignoring the prompt's synthetic swap mechanic. |
  | **2. Rejection of Standard Constitution:** Argues that *L* does not constitute *S* under standard definitions because constitution requires mereological overlap at *t*. | **4** | **Recitation Trap:** Defines constitution using standard textbook definitions (e.g., "Lump constitutes Statue") without adjusting for the lack of shared matter. |
  | **3. Diachronic Analysis of Formation:** Distinguishes this case from standard Ship of Theseus cases by noting the replacement happens *during* ontological genesis, not post-formation survival. | **4** | **Temporal Confusion:** Treats the formation swap as identical to post-creation replacement, failing to address whether *S* ever actually comes into existence. |
  | **4. CwI Viability Assessment:** Correctly identifies that CwI collapses into eliminativism (no statue) or physical impossibility (interpenetration) if it insists on spatial coincidence without material identity. | **4** | **Theoretical Dogmatism:** Defends CwI by ignoring the spatial exclusion principle, claiming *S* and *L* coincide despite being made of different, exclusive particles. |
  | **5. Application over Taxonomy:** Uses the specific mechanics of the "synthetic swap" to drive the argument, rather than listing generic objections (e.g., modal properties, sortal concepts) unrelated to the material flow. | **4** | **Generic Abstraction:** Writes a generic essay on Statue/Lump puzzles that could apply to the standard case without referencing the additive manufacturing or particle swap details. |

  **Grading Notes:**
  *   **17-20 (Distinction):** Flawless execution of all five moves; nuanced discussion of causal vs. material constitution.
  *   **13-16 (Pass/Credit):** Hits moves 1, 2, and 5 clearly; struggles slightly with the implications for CwI (Move 4).
  *   **0-12 (Fail):** Falls into the "Recitation Trap" (Move 2 error) or "Generic Abstraction" (Move 5 error); treats the prompt as the standard Statue/Lump case.
