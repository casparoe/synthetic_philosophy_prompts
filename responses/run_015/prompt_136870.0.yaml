answer: |-
  ### Part 1: Unstructured Brainstorming

  Okay, let's sit with this. You're wrestling with the classic boundary problem in normative ethics: the line between the *obligatory* (what we must do) and the *supererogatory* (what is good to do but not required). Your tentative rule—High Benefit + High Cost = Supererogatory—is a good heuristic, but as you've noticed, it collapses because it ignores the *baseline*.

  The toddler case kills your rule immediately. High benefit, low cost = Duty. So cost isn't just a weight in a calculation; it's a *limiting condition* on duty. Duty holds until the cost gets too high. But how high is "too high"?

  The grenade vs. kidney intuition is fascinating. Logically, death (grenade) is a higher cost than an organ (kidney). So why does the kidney feel *more* optional to you? Maybe it's about *urgency*. The grenade is an emergency; the kidney is elective. Emergencies tighten the screws of duty. Or maybe it's about *agency*. The grenade jumper acts in a split second; the kidney donor schedules surgery. We tend to view scheduled sacrifices as more "optional" because there was time to talk oneself out of it.

  The 10% income case is the Peter Singer problem. If we accept the principle "prevent bad when you can without sacrificing something of comparable moral significance," then 10% is likely a *duty*. But common sense morality rebels. This suggests our intuition of duty is tied to *social norms* and *fair shares*, not just pure utility.

  The nurse case (norm ratchet) is a collective action problem. If one person does it, it's virtue. If everyone does it, it's exploitation. This suggests duty is partly determined by *what can be universally expected without breaking the system*.

  The mother case is the most telling. It reveals that duties aren't just about cost/benefit; they're about *priority*. We have special obligations to our children that trump general obligations to strangers. You can't be a saint to a stranger by sinning against your child.

  And the "optional is an insult" worry? That's the emotional core. If I say "you didn't have to do that," am I diminishing the act? Or am I acknowledging that you gave me something I had no right to claim?

  Okay, I think I see the shape of the principle. It's not one single scale. It's a baseline of "reasonable demand" modified by "special relationships." Let's build that.

  ***

  ### Part 2: The Considered Answer

  You are looking for a principle that distinguishes duty from supererogation. Your intuition that cost matters is correct, but your formulation needs adjustment. Cost does not function as a trade-off against benefit (i.e., "enough benefit cancels out high cost"). Instead, cost functions as a **threshold of reasonable demand**.

  Here is the principle I propose, which I call **The Baseline of Reasonable Demand**, modified by **Special Obligations**.

  #### The Principle
  1.  **The Baseline:** We have a duty to prevent significant harm to others when the cost to ourselves is *moderate* or *low*. This is the "Easy Rescue" principle.
  2.  **The Threshold:** Duty ceases where the cost to the agent becomes *significant enough to disrupt their own life projects and autonomy*. Beyond this threshold, action is supererogatory.
  3.  **The Modifier (Special Obligations):** We owe a higher baseline of care to those with whom we have specific relationships (children, parents, promises) than to strangers. Violating a special obligation to fulfill a general one is not praiseworthy; it is often blameworthy.
  4.  **The Constraint:** Supererogatory acts cannot violate existing duties. You cannot be a saint to a stranger by neglecting your child.

  #### Where Cost Enters
  Cost is not a trade-off; it is a **limit**.
  *   **Low Cost + High Benefit** = Duty (The Toddler).
  *   **High Cost + High Benefit** = Supererogatory (The Grenade/Kidney).
  *   **High Cost + Low Benefit** = Foolish/Neutral.
  *   **Moderate Cost + High Benefit** = The Disputed Zone (The 10% Income).

  The reason your friend says 10% is a duty and you say it's optional is that you are disagreeing on where the "Threshold of Reasonable Demand" sits. She thinks modern affluence lowers the threshold (you can afford more); you think personal autonomy raises it (it's your life). Philosophically, she is likely closer to the truth of *moral demand*, but you are closer to the truth of *social sustainability*.

  #### Applying the Principle to Your Cases (and Correcting Your Gut)

  **1. The Toddler (Duty)**
  *   **Verdict:** Correct.
  *   **Why:** High benefit, negligible cost. Falls well within the Baseline.

  **2. The Grenade vs. The Kidney (Supererogatory)**
  *   **Verdict:** Both are supererogatory, but your intuition on the *degree* of optionality is worth challenging.
  *   **Correction:** You feel the kidney is *more* optional than the grenade. I suspect this is because the grenade is an *emergency*. In emergencies, the threshold for duty temporarily rises because there is no time to calculate self-interest. The kidney is elective. However, strictly speaking, both are beyond the call of duty. The grenade is a higher cost (life), so it is *more* supererogatory, not less. If it feels less optional, it's because the emergency context creates a temporary, intense duty of rescue that the kidney lacks.

  **3. The 10% Donation (The Disputed Zone)**
  *   **Verdict:** This is the hardest case.
  *   **Analysis:** Under the "Reasonable Demand" principle, if 10% allows you to live a decent life while saving lives, it leans toward duty. However, if society does not expect this of everyone, enforcing it as a duty creates a "demandingness" problem.
  *   **My take:** Your friend is morally ambitious; you are morally conventional. Neither is "simply wrong," but if we take moral impartiality seriously, your friend has the stronger argument. However, calling it a *duty* risks making morality so hard that people opt out entirely. It is safer to call it a "quasi-duty"—strongly expected, but not blameworthy if omitted.

  **4. The Nurse (The Norm Ratchet)**
  *   **Verdict:** Praiseworthy individually; problematic collectively.
  *   **Analysis:** This is where individual ethics meets institutional ethics. Her act is supererogatory. But when management *expects* it, they are converting supererogation into duty without compensation. This is exploitation. Your discomfort is correct: Praise is appropriate for her, but *blame* is appropriate for management. The "ratchet" turns virtue into a baseline expectation, which destroys the supererogatory nature of the act.

  **5. The Secret Lunch Payer (Credit without Audience)**
  *   **Verdict:** Deserves credit; praise is secondary.
  *   **Analysis:** Moral worth is intrinsic to the act and the intention (Kant would agree). Praise is a social tool to reinforce norms. He deserves credit even if no one knows. Your odd feeling about praising him once found out is just the awkwardness of spotlighting someone who sought shadows. It doesn't diminish the act.

  **6. Credit Exhaustion (The Repeat Donor)**
  *   **Verdict:** She is not "off the hook," but we understand her refusal.
  *   **Analysis:** Morality is not a ledger. You don't "buy" freedom from future duties. However, human psychology has limits. We recognize *moral fatigue*. While she technically has the same duty to the new patient as the old one, we acknowledge that continuous high-cost sacrifice is unsustainable. We don't say she's "off the hook" morally; we say we cannot *demand* it of her psychologically.

  **7. The Mother and the Kids (Special Obligations)**
  *   **Verdict:** Your gut is right; this is potentially wrong, not praiseworthy.
  *   **Analysis:** This validates the **Special Obligations Modifier**. We owe our children a duty of security and risk-aversion that we do not owe strangers. Donating a kidney introduces a risk (however small) to your future capacity to care for your children. Prioritizing a stranger over your children's security violates the hierarchy of duty. Supererogation cannot be built on the foundation of neglected duty.

  ***

  #### The Flip-Flop Case: Caring for Your Mum

  Now, to your personal case. Quitting your job to care for your mum with early-stage dementia when a good care home is available.

  **The Verdict:** This is **Supererogatory**, not Duty.

  **Why:**
  1.  **Special Obligation:** You do have a special obligation to your mother, stronger than to a stranger.
  2.  **The Cost Threshold:** Quitting a career for two years is a *significant* disruption to your life projects and autonomy. It crosses the threshold of "reasonable demand."
  3.  **Alternatives:** A good care home was available and affordable. This means the harm (her suffering) could be prevented without your total self-sacrifice. Duty requires us to ensure care, not necessarily to *provide* it personally at the cost of our own livelihoods.

  **Is "Optional" an Insult?**
  You asked if calling this "optional" is praise or an insult. This is the crux of your anxiety.
  *   If I say it was your **Duty**, I am saying you *had* to do it. If you hadn't, you would be a bad child. This acknowledges the importance of the act but denies your freedom.
  *   If I say it was **Optional (Supererogatory)**, I am saying you were not bound to do it. You had a right to say no. By saying yes, you gave a gift that I had no right to claim.

  **Calling it "optional" is the highest form of praise.**
  To call it a duty is to cheapen it. It implies you merely paid a debt. To call it supererogatory is to acknowledge that you gave something that was yours to keep. The word "optional" does not mean "indifferent"; it means "uncalled for." It means you went beyond the contract of existence.

  **Where your gut might be wrong:**
  You feel queasy about the "Credit Exhaustion" case (the repeat kidney donor). You feel the person needing the kidney today doesn't care about the past. Morally, you are right: the need is present regardless of history. But your queasiness about *demanding* it again is also right. We must hold two thoughts: **The need is absolute, but the demand is limited.** We can acknowledge the tragedy of the patient's need without asserting a right to the donor's body.

  **Summary Prediction:**
  If you quit your job, you did something **beautiful**. If you had not quit your job, and instead ensured she was well-cared for in the home, you would have been **good**.
  *   **Good** is what we owe each other.
  *   **Beautiful** is what we give each other.

  Do not let the word "optional" convince you that the act was less significant. It makes it *more* significant, because it was truly yours to give.
