          *   *Does fixing it change anything?* If you give sortitionists longer terms, electionists say "now they're a new elite." If you keep short terms, electionists say "they're incompetent." So, the objection isn't really about memory; it's about *class formation*.
      *   **Step 4: Defining Progress.**
