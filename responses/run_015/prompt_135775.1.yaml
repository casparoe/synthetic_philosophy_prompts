  2.  **Initial Brainstorming & Deconstruction:**
      *   *Pro-Sortition:* Focus on descriptive representation, breaking elite capture, deliberative quality, epistemic diversity, reducing polarization. Key concept: *Trusteeship via randomness* or *Surrogate Representation*.
      *   *Anti-Sortition (Pro-Election):* Focus on authorization, accountability, vertical control, mandate, partisanship as a feature (aggregation of interests). Key concept: *Principal-Agent relationship*.
      *   *The Stall:* They talk past each other. Why? Because they prioritize different democratic values.
      *   *The "Rotational Fatigue" Point:* This is interesting. Critics say random citizens don't know enough/forget too much. Proponents say that's the point (prevents careerism). Is this a factual claim about competence or a normative claim about what kind of competence matters?
