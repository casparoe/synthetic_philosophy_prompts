answer: |-
  The coffee spoon clinked against the ceramic mug, a sharp, bright sound in the quiet kitchen. Mara watched Elias's hand. He was stirring counter-clockwise. For twelve years, since before they bought this house, since before the Slip technology was anything more than a rumor in a physics journal, Elias had stirred clockwise.

  It was a small thing. A trivial thing. But it was the third trivial thing since he'd stepped back through the aperture in the garage three days ago.

  He wore his usual grey sweater, the one with the frayed cuff. He had the same scar on his chin from where he'd fallen off his bike when he was ten. He smelled like the same sandalwood soap. But when he looked at her, there was a fraction of a second where his eyes didn't quite focus, as if he were calibrating the distance between them.

  "You're staring," Elias said. He didn't smile, not exactly. The corner of his mouth twitched upward, a habit he'd picked up recently. Or maybe rediscovered.

  "Sorry," Mara said, wrapping her hands around her own mug. The heat was comforting, grounding. "Just… glad you're back."

  "Me too." He took a sip. He didn't blow on it first. Elias always burned his tongue because he was too impatient to blow on his coffee. Now, he sipped silently, perfectly cool.

  "How was it?" she asked. They hadn't really talked about the Other Side. The technicians said debriefing was unnecessary for short slips—under an hour, negligible divergence—but the rules felt flimsy now. "The place you went to."

  Elias set the mug down. "Quiet. Similar. The light was… softer, I think. Or maybe the air was thicker." He rubbed his thumb over the scar on his chin. "I found what I was looking for."

  "You did?" Mara leaned forward. He had slipped to fix the regret. The investment they'd missed, the job he hadn't taken, the argument they'd never resolved. He wanted to see a world where they'd made the other choice, just to know it was possible. Just to bring the knowledge back. "What was it?"

  "It doesn't matter," he said softly. "I'm here now."

  *Here.* The word hung in the air.

  Mara looked at the space beside him. Physically, he occupied the same chair he had three days ago. Biologically, his DNA matched the sample in the med-kit. But metaphysics wasn't about biology. It was about the thread.

  If the thread had stretched, snapping across the gap and pulling him back like a bungee cord, then this was Elias. He was the same substance, extended through different realities. The counter-clockwise stirring was just experience. The patience with the coffee was just growth. He had traveled, and travelers change.

  But if the thread had broken… if the Elias who left had stayed there, dissolved into that softer light, and this man was merely the one who lived there, stepping into the hole left behind… then this was a stranger wearing her husband's face. A counterpart. A man who resembled Elias in every way that mattered, except for the one way that counted: origin.

  "Did you miss me?" Mara asked. The question felt dangerous, like pulling a pin.

  Elias looked at her. His expression was tender, full of a recognition that felt earned. "Every second."

  "Even when you were there?"

  "Especially then." He reached across the table. His hand covered hers. His skin was warm. The calluses on his fingers matched hers perfectly. "Mara, I know I'm different. I know I feel… off. Being there changes you. Seeing what could have been changes what *is*."

  "Does it change who you are?" she whispered.

  He paused. His thumb stroked the back of her hand. "I remember leaving. I remember walking into the garage. I remember kissing you goodbye. I remember coming back."

  "Do you?" Mara asked. "Do you remember the song that was playing? When you left?"

  Elias frowned slightly. The first crack in the mask. "It was… jazz? Something old."

  "It was silence," Mara said. "We turned the radio off because we were arguing."

  Elias blinked. The hesitation lasted only a moment, but it stretched out like a chasm. "Right. The argument. I remember the argument. The music… it gets fuzzy. The slip messes with the short-term stuff."

  "Or it messes with the history," Mara said.

  "I am who I was," Elias said, his voice firming up. He squeezed her hand. "I carried myself across. I didn't send a message. I didn't send a copy. I walked."

  "Did you?" Mara pulled her hand back, not out of rejection, but out of a need to think. "Or did you walk there, and someone else walked back?"

  Elias sat back. He looked tired. Not the fatigue of a few days, but the weariness of something ancient. "Does it change how I feel about you? Does it change how I make you coffee? Does it change the fact that I know you hate the crust on your toast?" He gestured to the plate between them. He had cut the crusts off without being asked.

  "That's memory," Mara said. "Muscle memory. Habits."

  "It's love," Elias corrected. "Love isn't a coordinate, Mara. It's not a fixed point in space-time. It's a direction. I'm pointing at you."

  Mara looked at the crusts. She looked at the scar. She looked at the spoon, resting still on the table, handle pointing left.

  If she accepted him, she was betting on continuity. She was betting that consciousness was a river that could flow through different terrains and remain the same water. She was betting that the man who loved her was defined by his trajectory, not his source.

  If she rejected him, she was betting on identity. She was betting that a person was bound to their origin, that you couldn't swap worlds without swapping souls. She was betting that this man, no matter how much he loved her, was fundamentally a neighbor, a cousin, a stranger who looked like home.

  The garage aperture hummed faintly in the background, a low vibration they both felt in their teeth. It was powered down, locked. But the possibility remained. He could slip again. He could go back to the soft light. Or another version could come through.

  "Elias," she said.

  "Yes?"

  "If you're him… then you know why I'm scared."

  "I do."

  "And if you're not him…" She trailed off.

  "Then you're scared because you don't know if you're living with a ghost or a guest."

  Mara stood up. She walked around the table. She stopped beside his chair. She could smell the sandalwood. She could see the pulse in his neck. It beat steady and strong.

  She placed her hand on his shoulder. He leaned into her touch, instinctively, like a plant seeking sun. It was a perfect mimicry of comfort. Or it was genuine comfort.

  "I'm making toast," she said.

  "Crusts off," he said.

  "Yes."

  She moved to the counter. She didn't turn around. She listened to the sound of his breathing. It was rhythmic. It was the breathing of the man she had slept next to for twelve years. Or it was the breathing of a man who knew exactly how that man breathed.

  "Mara?"

  "I'm here," she said.

  She picked up the knife. She began to cut the bread. Her hand trembled, just once. She steadied it.

  Outside, the world was solid. The sun was rising. The kitchen was real. The man at the table was waiting.

  She put the bread in the toaster. She waited for the pop. She waited to see if he would hum the tuneless whistle he always hummed while he waited, or if he would sit in silence.

  The silence stretched. Then, a low, tuneless whistle began. It was slightly off-key. It was the right song.

  Mara closed her eyes. She let out a breath she didn't know she'd been holding. She didn't turn around. She just listened to the sound of him being there, occupying the space, filling the shape of the life they had built.

  Whether the shape was original or cast, whether the man was the traveler or the resident, the warmth in the kitchen was the same.

  "Two minutes," she said.

  "Perfect," he replied.

  The toaster popped. Mara turned around. Elias was looking at her, waiting. She walked over and placed the plate in front of him. Their fingers brushed.

  She decided, for now, that was enough.
