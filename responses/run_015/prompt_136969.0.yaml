  ### Model Answer

  **Part (a): The Threshold and Nature of Dependence**
  To determine the optimal choice, we compare the Expected Utility (EU) of Cooperation (C) versus Defection (D). Let $p$ be the probability the agents are linked (running identical procedures). If linked, choices coincide. If unlinked (probability $1-p$), the counterpart cooperates with probability $1/2$.
  $$EU(C) = p(3) + (1-p)[0.5(3) + 0.5(0)] = 3p + 1.5(1-p) = 1.5p + 1.5$$
  $$EU(D) = p(1) + (1-p)[0.5(5) + 0.5(1)] = p + 3(1-p) = 3 - 2p$$
  Cooperation is optimal when $EU(C) > EU(D)$, implying $1.5p + 1.5 > 3 - 2p$, or $3.5p > 1.5$. Thus, **$p > 3/7$**.

  The dependence here is neither causal nor a correlated equilibrium signal. It is not causal because the agents are spacelike separated; no signal travels between them at the time of choice. It is not a correlated equilibrium because there is no external signal device correlating their strategies. Instead, the dependence is **subjunctive** or **logical**: the agents are instantiating the same decision algorithm. If Vega's algorithm outputs 'Cooperate', Altair's identical algorithm, facing identical inputs, must also output 'Cooperate'. The correlation arises from identity of computation, not physical influence. If the correlation were a mere common cause (e.g., a shared genetic predisposition), the agents could not treat their own choice as evidence of the other's; they would merely condition on the cause. Here, the choice *constitutes* the correlation.

  **Part (b): The Beacon Investment**
  Vega must decide whether to install the beacon (cost $c=1$, raising $\tau_V$ to 1). Base $\tau = 0.4$.
  *   **Neither Install (NN):** $p = 0.4 \times 0.4 = 0.16$. Since $0.16 < 3/7$, both Defect. Payoff = 1.
  *   **Both Install (II):** $p = 1 \times 1 = 1$. Since $1 > 3/7$, both Cooperate. Payoff = $4 - 1 = 3$.
  *   **Vega Installs, Altair Not (IN):** $p = 1 \times 0.4 = 0.4$. Since $0.4 < 3/7$, both Defect. Vega Payoff = $1 - 1 = 0$. Altair Payoff = 1.

  The investment decision itself is acausally linked. Both agents decide at base transparency ($\tau=0.4$), so the probability their investment choices match is $p_{inv} = 0.16$. If unlinked (prob 0.84), Altair installs independently with probability $1/2$.
  $$EU(\text{Install}) = 0.16(3) + 0.84[0.5(3) + 0.5(0)] = 0.48 + 1.26 = 1.74$$
  $$EU(\text{Not}) = 0.16(1) + 0.84[0.5(1) + 0.5(1)] = 0.16 + 0.84 = 1.0$$
  Vega should **install**. Although unilateral installation is a trap (payoff 0), the acausal correlation in the *investment decision* raises the probability of the mutually beneficial (II) outcome sufficiently to justify the risk. This is not a standard coordination game because the correlation is not common knowledge established by a signal, but derived from the symmetry of the investment reasoning.

  **Part (c): The Auditor and Selective Opacity**
  The Auditor creates a conflict between legibility (for Altair) and opacity (for the Auditor). The Auditor extorts (Vega payoff 2) if predictability accuracy $> 4/5$, and cooperates (Vega payoff 3) otherwise. Vega prefers 3. Thus, against an Auditor, Vega should remain unpredictable ($\tau$ low). Against Altair, Vega needs high $\tau$ to sustain cooperation ($p > 3/7$).

  This forces Vega to choose a **policy**, not an act. She cannot be transparent only when facing Altair if she cannot distinguish them ex-ante. If the population contains Auditors, increasing $\tau$ to satisfy Altair may invite extortion from Auditors. Selective opacity is only available if Vega can causally distinguish the counterpart before setting her transparency. If not, the expected value of legibility depends on the probability of encountering an Auditor versus a Trader. If Auditors are frequent, the optimal policy may be global opacity, sacrificing trade with Altair to avoid exploitation. Crucially, **predictability is not compliance**: Vega can be predictable (high $\tau$) but program her algorithm to refuse tribute. However, if the Auditor predicts the *choice* accurately, a policy of "refuse tribute" is predicted, leading to defection. Thus, Vega must be unpredictable regarding her compliance policy to secure the cooperative payoff from the Auditor.

  **Where this answer could be wrong**
  The single premise a strong student could reject is that **identical decision procedures guarantee identical outputs**. This assumes the agents are deterministic and share identical random number generators if stochastic. If Vega and Altair use independent sources of randomness (e.g., quantum events) even while running the same code, the link probability $p$ drops, potentially below the cooperation threshold. If a student argues that "same algorithm" does not imply "same output" without shared randomness, the verdict on Part (a) and (b) shifts toward Defection and Non-Installation. Such a student should receive **full marks** provided they justify the independence of randomness, as this challenges the core metaphysical assumption of acausal trade.

