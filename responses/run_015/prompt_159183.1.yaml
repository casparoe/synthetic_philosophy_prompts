  *(Self-Correction Note on "Truth-tellers")*: Arendt says the truth-teller is bound by reality. The WVU researchers fit this. They didn't invent the emissions; they found them. They were bound by the data. This fits Arendt well.

  *(Self-Correction on "Power")*: Arendt says factual truth has no power to compel belief. VW proved this. The facts existed (pollution), but no one believed/acted until the *power* of the EPA threatened certification. The truth needed power to become effective.

