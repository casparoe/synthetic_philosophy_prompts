  2.  **Deconstruct the Epistemological Problem:**
      *   *Judy Benjamin Problem:* Learning "If A, then P(B) = p" (or similar constraint) vs. learning "A → B". Naive conditioning on the material conditional or the proposition "If A then B" often leads to counterintuitive results (e.g., probability of A drops when learning "If A then B" is true, depending on interpretation). In risk registers, usually, we want to update the probability of the consequent *given* the antecedent, or update the joint distribution based on the constraint.
      *   *Observation/Reporting:* "If gauge > 3m, we tell you." Learning "We told you" is different from learning "Gauge > 3m" if the reporting is imperfect or policy-driven.
      *   *Directives:* "If X, treat as Y." This isn't evidence; it's a policy.
      *   *Constraint:* No similarity metric (Jeffrey conditioning usually requires a partition). Judy Benjamin often suggests minimizing information loss (entropy), but the user wants a practical spreadsheet procedure without complex optimization. The user asks for a move given "only a partition and no similarity metric". Usually, this implies treating the conditional as a constraint on the conditional probability $P(C|A)$ rather than conditioning on a proposition $A \to C$.
      *   *Practicality:* Needs to be sign-offable by a non-expert director.

