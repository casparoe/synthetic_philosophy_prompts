      *   Need to handle the Judy Benjamin aspect (updating on a constraint vs. a fact).
      *   Need to handle silence/alerts.
      *   Need to flag theory vs. convention.

      *Step 1: Classification.* Is this (a) World, (b) Observation/Report, or (c) Directive?
      *Step 2: Directive Check.* If (c), log it. Do not update probabilities. (Theory: Directives aren't evidence).
      *Step 3: Observation Check.* If (b), is the reporting mechanism perfect? If no, estimate false negative/positive rate. If "didn't say", assume perfect (Convention) but flag for Director.
      *Step 4: Antecedent Status.* Is the antecedent known true, false, or uncertain?
      *Step 5: Consequent Form.* Is the consequent a fact ("water rises") or a constraint ("chance is real")?
      *Step 6: Judy Benjamin Check.* If learning a constraint on probabilities (e.g., "real chance"), do not condition on the conditional as a proposition. (Theory: Naive conditioning distorts antecedent probability). Instead, set $P(C|A)$ to the stated value.
      *Step 7: Hedging.* If no number ("real chance"), assign default (e.g., 0.5) or ask Director. (Convention).
      *Step 8: Silence.* If alert policy, update on "No Alert" using Bayes rule on the reporting process.

      *Refining for Word Count & Clarity:* Combine steps. Ensure the "Theory vs. Convention" flag is clear.

  4.  **Drafting the Table:**
      *   Message Type | Update Move | Refusal Condition
      *   World Fact | Standard Conditioning | Antecedent probability undefined
      *   Probability Constraint (JB) | Fix $P(C|A)$ | Consequent probability unspecified
      *   Reporting/Alert | Update on Report Event | Reporting reliability unknown
      *   Directive | Log Only | N/A

  5.  **Drafting the Cases:**
      *   *Marsh Road:* "If levee breached, gauge > 3m." Looks like World Fact, but gauge is observation.
      *   *Hedged Rainfall:* "If rain > 90th, real chance overtops." JB case. Hedged consequent.
      *   *Alert/Directive:* "If pump fails, we tell you." Or Ops Manual directive. Let's use the Alert Policy one to show refusal of naive update.

  6.  **Drafting Limitations:**
      *   Cannot resolve conflicting expert testimony. Cannot generate priors.

  7.  **Review against Constraints:**
