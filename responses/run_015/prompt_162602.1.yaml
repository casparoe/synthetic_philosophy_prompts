answer: |-
  **Decision Procedure for Conditional Risk Inputs**

  1.  **Classify Message Type [Theory]:** Is this (a) a claim about the world, (b) a claim about what we will observe/be told, or (c) a directive on how to treat something?
      *   *Sufficient:* Explicit categorization.
      *   *If "didn't say":* Assume (a) but flag for Director.
  2.  **Directive Check [Theory]:** If (c), log the rule in the ops manual register. **Do not update probabilities.** Stop.
      *   *Reason:* Directives are policies, not evidence.
  3.  **Observation Reliability [Convention]:** If (b), is the reporting mechanism perfect?
      *   *Sufficient:* False-positive/negative rates.
      *   *If "didn't say":* Assume perfect reliability. **Hand to Director** for sign-off.
  4.  **Antecedent Probability [Convention]:** Estimate $P(A)$ from existing models.
      *   *Sufficient:* Numeric value or distribution.
      *   *If "didn't say":* **Hand to Director.** Do not proceed without prior $P(A)$.
  5.  **Consequent Form [Theory]:** Is the consequent a fact ("C happens") or a probability constraint ("Chance of C is $p$")?
      *   *Sufficient:* Identification of constraint vs. event.
  6.  **Judy Benjamin Move [Theory]:** If probability constraint: **Do NOT condition on the conditional proposition.**
      *   *Reason:* Naive conditioning on "If A then C" distorts $P(A)$ when only the link $P(C|A)$ is learned.
      *   *Action:* Fix cell $P(C|A)$ to stated $p$. Keep $P(A)$ fixed.
  7.  **Hedging [Convention]:** If consequent is hedged ("real chance") with no number: Assign 0.5.
      *   *Action:* **Hand to Director** for approval of default value.
  8.  **Alert Silence [Theory]:** If (b) and no message received: Update on "No Alert" using false-negative rate.
      *   *If reliability unknown:* **Log it and don't update.** Do not assume absence of evidence is evidence of absence.

  | Message Type | Update Move | Refusal Condition |
  | :--- | :--- | :--- |
  | World Claim | Condition on $A$ or set $P(C\|A)$ | $P(A)$ undefined |
  | Probability Constraint (JB) | Set $P(C\|A)$; fix $P(A)$ | $p$ unspecified |
  | Report/Alert | Bayes on Report Event | Reliability unknown |
  | Directive | Log Only | Never |

  **Worked Cases**

  **1. Marsh Road Gauge:** "If levee breached, gauge > 3m."
  Step 1 classifies this as (a) World Claim (physical implication). Step 5 identifies the consequent as a fact. Since the breach is uncertain, we treat this as a constraint on the conditional probability. Step 6 applies: we set $P(\text{Gauge}>3 | \text{Breach}) = 1$. We do not update the probability of the breach itself based solely on this rule. If the gauge *reads* 3m, we then condition on the observation.

  **2. Hedged Rainfall:** "If winter rainfall > 90th percentile, real chance embankment overtops."
  Step 5 identifies this as a Probability Constraint (Judy Benjamin shape). Step 6 forbids naive conditioning on the proposition "If rain, then overtop," which would artificially lower the probability of high rainfall. Instead, we adjust the conditional probability cell $P(\text{Overtop} | \text{Rain})$. Step 7 triggers because "real chance" lacks a number. We assign 0.5 but must hand this to the Director for approval. This slows the process but prevents arbitrary precision.

  **3. Alert Policy:** "If pumping station loses power, alarm sounds." (No alarm received).
  Step 1 classifies as (b) Observation. Step 8 applies. We must update on "No Alarm." This requires the false-negative rate (probability alarm fails given power loss). If the expert "didn't say" (Step 8 condition), the procedure forces us to **log it and don't update**. This refuses the common practice of treating "No Alarm" as "No Power Loss." It hands the risk of silent failure to the Director rather than hiding it in a zero probability.

  **Limitations**
  This procedure cannot resolve conflicting expert testimony (e.g., two modellers giving different $p$ values); it requires a separate arbitration step. It assumes a static Bayesian network and cannot generate priors where none exist. It treats "Director sign-off" as a proxy for epistemic responsibility when theory underdetermines the value.
