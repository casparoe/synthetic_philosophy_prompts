answer: |-
  **Joint Statement on Hard Choices**

  **Preamble: The Phenomenon**

  We begin by fixing the subject of our collaboration. By a hard choice, we mean a case in which the agent has full information about her options, has reasoned as well as she can, is not impaired by inattention, weakness of will, or confusion, and yet the deliberative difficulty survives everything that further information or further reasoning could do. In such cases, neither option seems better, nor worse, nor equally good. Both camps accept that hard choices in this sense are real, that they are not merely choices we find psychologically difficult, and that a hard choice is rationally resolvable in a way that tossing a coin is not. We reject the easy-choice view, which holds that the trichotomy of better, worse, and equally good exhausts all axiological relations between options. We agree that when an agent resolves a hard choice well, she does not merely discover a pre-existing ranking, nor does she act arbitrarily. The following document records our substantive agreements, maps our disagreements, identifies the cruxes that bear on our divergence, and specifies the conditions under which we would abandon our respective positions.

  **Part I: Agreed Claims**

  1.  **The Failure of Trichotomy:** In hard choices, the relation between options is not betterness, worseness, or equality. The standard trichotomy is incomplete.
  2.  **Non-Epistemic Difficulty:** The hardness is not due to ignorance or cognitive limitation. The value facts, such as they are, do not determine a unique choice.
  3.  **Rational Competitors:** The options in a hard choice are genuine rational competitors. It is not irrational to choose either one, provided the resolution is handled correctly.
  4.  **Non-Arbitrary Resolution:** Resolving a hard choice is not a matter of flipping a coin. The resolution involves the exercise of rational agency that distinguishes it from random selection.
  5.  **Constitutive Will:** The agent's will or commitment plays a constitutive role in the resolution. The agent puts her authority behind one option, making it the chosen one.
  6.  **No Discovery:** The resolution is not a matter of discovering which option was better all along. There is no fact of the matter waiting to be found that settles the choice prior to the act of willing.
  7.  **Constrained Authority:** The authority of the will is not unconstrained. Some resolutions are criticizable; one cannot resolve a hard choice well by choosing arbitrarily or against one's core values.
  8.  **Extensional Equivalence:** For all first-order normative purposes—guiding action, advising others, evaluating outcomes—the recommendations of the Parity Camp and the Incomparabilist Camp coincide. The dispute is not about what to do.
  9.  **Value Indeterminacy:** The world contains value indeterminacy. It is not the case that every pair of valuable things is comparable in terms of better, worse, or equal.
  10. **Reasons Creation:** In resolving a hard choice, the agent generates a reason for her choice that did not exist in the same form before the resolution.
  11. **Rational Regret:** Post-choice regret can be rational without implying that the original choice was a mistake.
  12. **Agency Beyond Tracking:** Rational agency involves more than tracking pre-existing comparative value; it involves shaping one's normative landscape through commitment.

  **Part II: Disagreements Table**

  | Issue | Parity Camp Formulation | Incomparabilist Camp Formulation | Genuine or Verbal? | Crux / Substantive Question |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Axiological Relation** | The options stand in a fourth positive relation, "on a par." This is a sui generis form of comparability. | No positive axiological relation holds. "On a par" is a misleading label for the failure of comparability. | Genuine | Is there a positive relation of comparability that is not trichotomous, or is comparability exhausted by the trichotomy? |
  | **The Nature of Resolution** | The agent creates a reason by leveraging the parity relation, which permits but does not require choice. | The agent creates a reason because no comparative reason exists to begin with; the will fills a normative vacuum. | Verbal | The term "comparability." Parity uses it to mean "axiologically related"; Incomparabilists use it to mean "rankable by trichotomy." |
  | **Metaphysics of Value** | Value structures include parity as a fundamental feature. Parity is part of the fabric of value. | Value structures are sparse. Where trichotomy fails, there is simply no value relation, not a fourth kind. | Genuine | Does value possess a positive structure in cases of hardness, or is the structure absent? |
  | **Transitivity** | Parity is not transitive. A can be on a par with B, B with C, without A being on a par with C. | Incomparability is not transitive. Failure of relation does not imply a chain of failures. | Verbal | The term "transitivity." Both agree the logical behavior is non-transitive; they disagree on whether this describes a relation or its absence. |
  | **Explanation of Normativity** | The parity relation itself licenses the exercise of normative power. | The absence of comparison licenses the exercise of normative power. | Genuine | Does the permission to choose stem from a positive feature of the options or the absence of a constraint? |

  **Part III: Cruxes**

  **1. The Value-Span Model**
  *Shared Machinery:* An agent's values are represented by a set of admissible precisifications, each a complete ordinal ranking. Two options are spanned when some precisifications rank one above the other and some the reverse. No precisification is correct independently of resolution.
  *The Crux:* Does this model deliver comparability that is not trichotomous, or does it merely redescribe incomparability?
  *Parity Prediction:* The span constitutes a positive structure. The set of precisifications represents the parity relation itself, which is a form of comparability distinct from the rankings within the precisifications.
  *Incomparabilist Prediction:* The span represents indeterminacy. The lack of a single ranking across all precisifications is the definition of incomparability. The model describes the limits of comparison, not a new form of it.

  **2. Robustness Under Small Improvement**
  *Shared Case:* A hard choice between two careers. Add to one option a benefit so trivial it is normally irrelevant (e.g., a slightly shorter commute).
  *The Crux:* Is hardness robust under such improvements? If not, where does a determinate ranking appear?
  *Parity Prediction:* Hardness is not robust. A small improvement can make one option better than the other. The location is vague, but the parity relation is sensitive to small changes in value.
  *Incomparabilist Prediction:* Hardness is robust. A trivial improvement cannot bridge the gap of incomparability. If a ranking appears, it is because the improvement was large enough to establish comparability, not because it tipped a balance within hardness.

  **3. The Second-Chance Case**
  *Shared Case:* An agent resolves a hard choice, lives the chosen life for a decade, and is offered the other option again at no cost. Variant: She resolves inwardly days before, but the world changes so options become determinately ranked before exercise.
  *The Crux:* Does a comparative judgment ("this is better for me") become apt where it was not apt before? What becomes of the earlier resolution in the variant?
  *Parity Prediction:* Yes. The resolution alters the normative landscape. The chosen option becomes better relative to the agent's history and commitments. In the variant, the earlier resolution is overridden by the new value facts.
  *Incomparabilist Prediction:* No. The options remain incomparable. The agent chooses again based on new commitments, not because the first option became better. In the variant, the earlier resolution is voided because the conditions for hard choice no longer exist.

  **4. The Staircase**
  *Shared Case:* A series of options where each adjacent pair is a hard choice, but the first is determinately better than the last. The agent moves one step at a time.
  *The Crux:* Can every step be permissible while the whole descent is not? Does rationality require resolving at the level of policy?
  *Parity Prediction:* Yes, every step is permissible. Rationality requires a policy constraint to prevent the descent. The parity relation allows local permissibility but global irrationality.
  *Incomparabilist Prediction:* No. If the descent is irrational, at least one step must have been impermissible. The appearance of permissibility at each step is an illusion caused by the failure of comparability to transmit across the series.

  **5. Menu Sensitivity**
  *Shared Case:* Two hard options are joined by a third that is determinately worse than both but resembles one along the dimension on which that one is stronger.
  *The Crux:* Does what is permissible change with the menu? Is this a reductio or a feature?
  *Parity Prediction:* It is a feature. The parity relation is context-sensitive. The presence of the third option alters the normative force of the parity relation between the original pair.
  *Incomparabilist Prediction:* It is a reductio of comparability claims. Incomparability is absolute; if permissibility shifts, it is because the reasons structure changes, not because the relation between the original pair changed.

  **Part IV: Defeat Conditions**

  **Parity Camp Defeat Condition:**
  We would abandon the Parity view if it were demonstrated that the "on a par" relation cannot be distinguished from "equally good" without violating basic logical constraints on rational preference, such as transitivity in a way that leads to money-pump vulnerabilities that cannot be blocked by policy constraints. If parity collapses into equality under formal scrutiny, the fourth relation does not exist.

  **Incomparabilist Camp Defeat Condition:**
  We would abandon the Incomparabilist view if it were demonstrated that rational resolution in hard choices is impossible without a comparative fact to ground the choice. If it can be shown that an agent cannot rationally commit to one option over another unless there is a truth about their comparative value (even a non-trichotomous one), then incomparability is incompatible with rational agency.

  **Residual Dispute:**
  Since we agree on the extensional recommendations for action, the residual dispute is metaphysical and explanatory. It concerns the architecture of value and the explanation of the phenomenology of choosing. The Parity Camp posits a richer value structure to explain the feeling of genuine competition. The Incomparabilist Camp posits a sparser value structure to explain the feeling of normative freedom. Both agree that the agent must act, and act rationally, despite the silence of the trichotomy.
