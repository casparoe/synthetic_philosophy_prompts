              2.  *Ubuntu:* "I am because we are." This isn't just guilt (individual act) or shame (individual identity). It's relational harmony. The TRC used this, but the Western guilt/shame lens might obscure it.
              3.  *Power:* Economic structures remained. You can't "repair" (guilt logic) if the power imbalance remains.

      *   **Section 4: Testing the Theory (The Mixed Legacy):**
