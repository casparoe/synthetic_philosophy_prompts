          *   *Shame:* The public nature. Being named a torturer on TV. This risks the "concealment" dynamic the prompt mentions.
          *   *Analysis:* The design *aimed* for guilt (reparable truth) but risked shame (public exposure). The amnesty clause was the key to mitigating shame (you don't lose your future).

      *   **Section 3: Where the Theory Fits and Fails:**
