  7.  **Final Polish:** Organize with clear headings. Ensure the "Verdict" for each section is explicit (Clean, Distorted, None). (Proceed to generate output based on this structure).

      *   *Key Insight for Vote Selling:* In MD, vote selling is often modeled as a coalition deviation or side payment. If the mechanism is strategy-proof, vote selling shouldn't matter *unless* it changes the type space. But Sandel argues it changes the *interpretation* of the vote. This is a semantic layer MD ignores.
      *   *Key Insight for Price Gouging:* This is about the price signal itself carrying information/norms. In MD, price is just a Lagrange multiplier. Sandel says price is a signifier.

