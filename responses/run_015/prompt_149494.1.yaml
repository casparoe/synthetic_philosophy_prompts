  3.  **Translate to Mechanism Design (MD) Vocabulary:**

      *   *Roth's Repugnance:* This is the easier translation. In MD, we define a set of feasible allocations $\mathcal{A}$. Usually, $\mathcal{A}$ is defined by physical constraints (resource availability) and incentive constraints (IC, IR). Roth suggests adding a "repugnance constraint" $R \subseteq \mathcal{A}$. If a mechanism $f(\theta) \notin R$, it is infeasible.
          *   *Translation:* Feasibility set restriction.
          *   *Status:* Clean translation.

      *   *Sandel's Crowding Out:* Standard MD assumes fixed preference profiles $\theta \in \Theta$. The mechanism $f$ maps $\theta \to a$. Sandel argues $f$ affects $\theta$. If we introduce a market for emergency water, agents' valuation of water changes from "need-based right" to "commodity."
          *   *Translation:* Endogenous preferences. The utility function $u_i(a, \theta, f)$ depends on the mechanism rule $f$ itself, not just the outcome $a$.
          *   *Status:* Requires violating the standard independence assumption (preferences are exogenous to the mechanism). Can be modeled as a dynamic game or evolutionary process, but static MD struggles.

      *   *Sandel's Corruption of Meaning:* This is the hard one. It's not just that preferences change; it's that the *good* changes ontologically. A vote sold is not a vote cast.
