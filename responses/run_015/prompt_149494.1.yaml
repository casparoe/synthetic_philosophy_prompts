          *   *Translation:* Collapsing a non-transferable right into a transferable utility problem. In MD, this looks like allowing side-payments in a voting mechanism.
          *   *Status:* Distortion. MD can model side-payments, but cannot model the *legitimacy* loss of the outcome.

      *   *Price Gouging (Emergency Supplies):*
          *   *Standard MD:* High prices clear the market (efficient).
          *   *Sandel's Objection:* Exploits necessity, changes water from life-sustaining to profit-generating.
          *   *Translation:* Distributional weights in social welfare function? Or a constraint on prices $p \leq \bar{p}$?
          *   *Status:* Distortion. Capping prices is a constraint, but doesn't capture the "moral corruption" aspect, only the distributional outcome.

  4.  **Drafting the Response (Iterative Refinement):**

