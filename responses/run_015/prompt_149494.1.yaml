      *(Self-Correction on "Residue"):* Be careful not to dismiss philosophy as "indeterminate." It might be that MD is "normatively blind." Frame it as a domain mismatch.

      *(Refining the "Crowding Out" translation):* If preferences depend on the mechanism, the Revelation Principle might fail or require modification. Standard RP assumes fixed types. If $u_i(\cdot, M)$, then truth-telling depends on $M$ in a feedback loop. This is a fundamental break from standard implementation theory.

