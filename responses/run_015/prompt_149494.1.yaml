      *   **Constraints:** Be honest (no smuggling moral assumptions), focus on price-gouging and vote-selling (skip kidneys), address endogenous preferences (crowding out) and vote-selling/transferable utility.
      *   **Tone:** Rigorous, technical, honest about limitations.

  2.  **Deconstruct the Philosophical Claims:**
      *   **Sandel:** Markets change the *nature* of the good. Putting a price on X makes it a different kind of X (corruption). Markets displace non-market norms (crowding out).
