answer: |-
  Here is a translation of the Sandel-Roth debate into the formal vocabulary of mechanism design, followed by an analysis of the translational residue.

  ### 1. Roth's Repugnance Constraint
  **Philosophical Claim:** Certain transactions (e.g., selling votes, price-gouging during disasters) are morally offensive. Even if such transactions are efficient (Pareto improving) and incentive compatible, they should be prohibited because the transaction type itself is socially unacceptable.

  **Mechanism Design Translation:**
  Let $\mathcal{O}$ be the set of physically feasible outcomes. Standard mechanism design defines the set of *implementable* outcomes $\mathcal{I} \subseteq \mathcal{O}$ based on incentive compatibility (IC) and individual rationality (IR) constraints. Roth proposes adding a **repugnance constraint** $\mathcal{R} \subseteq \mathcal{O}$.
  The designer's feasible set becomes $\mathcal{F} = \mathcal{I} \cap \mathcal{R}$.
  In this framework, repugnance operates as a hard boundary condition on the range of the Social Choice Function (SCF), $f: \Theta \to \mathcal{O}$. If $f(\theta) \notin \mathcal{R}$ for any $\theta$, the mechanism is infeasible, regardless of its efficiency properties.

  **Translation Verdict:** **Clean.**
  This maps directly to a restriction on the feasible set. In implementation theory, we routinely exclude outcomes based on physical or legal constraints. Treating repugnance as a constraint requires no distortion of the mathematical structure; it simply expands the definition of "feasibility" to include social acceptance as a parameter.

  ---

  ### 2. Sandel's "Crowding Out"
  **Philosophical Claim:** Introducing market incentives (prices) for certain goods (e.g., emergency supplies) displaces non-market norms (e.g., civic duty, mutual aid). The introduction of the mechanism alters the agents' motivations, reducing the supply of the good or degrading the quality of cooperation.

  **Mechanism Design Translation:**
  Standard mechanism design assumes **exogenous preferences**. Agents have types $\theta_i \in \Theta_i$ representing preferences $u_i(x, \theta_i)$, which are independent of the mechanism $M$.
  Sandel's claim requires modeling **endogenous preference formation**. Here, the utility function depends on the mechanism rule itself: $u_i(x, \theta_i, M)$.
  Specifically, let $M_{market}$ be a price-based allocation rule and $M_{queue}$ be a non-price rule. Sandel argues that for certain goods, $u_i(x, \theta_i, M_{market}) < u_i(x, \theta_i, M_{queue})$ even if the physical allocation $x$ is identical, because the *rule* $M$ alters the psychological or social cost/benefit structure.
  Formally, this violates the **independence of irrelevant alternatives** in the preference domain and complicates the **Revelation Principle**. If preferences depend on the mechanism, a direct revelation mechanism cannot simply assume truth-telling is optimal in isolation; the act of reporting types may itself shift the preference profile.

  **Translation Verdict:** **Distorted / Requires Model Extension.**
  This can be expressed in MD, but only by violating the standard assumption that the type space $\Theta$ is fixed prior to mechanism selection. It requires a dynamic or evolutionary model where the mechanism $M_t$ updates the distribution of types $F(\theta_{t+1} | M_t)$. While tractable, this moves the problem from static implementation to dynamic system control. The distortion lies in reducing a normative shift ("civic duty is degraded") to a parameter shift in a utility function ("the cost of trading increased").

  ---

  ### 3. Sandel's "Corruption of Meaning" (Vote Selling & Price Gouging)
  **Philosophical Claim:**
  *   **Vote Selling:** Voting is an exercise of civic agency, not a property right. Selling a vote converts a public decision into an aggregation of private wealth, undermining the legitimacy of the outcome.
  *   **Price Gouging:** Charging market-clearing prices for emergency goods treats necessity as a commodity, violating the social meaning of the good as a right of membership/survival.

  **Mechanism Design Translation:**
  *   **Vote Selling:** In MD, vote selling is modeled as **side-contracting** or **transferable utility** within a voting mechanism. If agents can transfer utility, the Gibbard-Satterthwaite theorem implications shift; the mechanism effectively becomes a market. MD evaluates the outcome based on efficiency (e.g., does the vote go to the agent with the highest valuation?).
      *   *The Mismatch:* Sandel argues the *legitimacy* of the outcome $x$ is a function of the *process* used to derive it. MD treats the process as a "black box" function $f(\theta) \to x$. MD has no variable for "legitimacy" other than compliance with IC/IR. To capture Sandel, one would need to define utility over the *history* of the game, not just the terminal node.
  *   **Price Gouging:** In MD, high prices during shortages are the efficient solution to a scarcity constraint (clearing the market). Sandel's objection is that the price signal $p$ carries semantic content beyond rationing.
      *   *The Mismatch:* MD treats price $p$ as a Lagrange multiplier or a transfer $t_i$. Sandel treats $p$ as a signifier. There is no variable in the allocation rule $f(\theta) = (x, t)$ that captures the "meaning" of $t$.

  **Translation Verdict:** **No Counterpart.**
  Mechanism design is fundamentally **consequentialist**. It evaluates mechanisms based on the properties of the outcome allocation (efficiency, fairness, stability). Sandel's claim is **constitutive**: the nature of the good is defined by the rules governing its exchange. MD lacks the vocabulary to distinguish between "allocating a vote via market" and "allocating a vote via civic duty" if the final winner is the same. The "corruption" is not an externality in the welfare function; it is a change in the ontology of the good being allocated.

  ---

  ### 4. The Residue

  The untranslatable remainder lies in the **ontology of the good** and the **source of legitimacy**.

  **1. The Ontological Gap:**
  In mechanism design, a "vote" is a signal $\sigma_i \in \{0,1\}$ or a report $\hat{\theta}_i$. It is defined entirely by its functional role in the SCF. Sandel argues a "vote" is a social object whose definition depends on the norms surrounding its use.
  *   *Analysis:* This is not a failure of mechanism design's expressive power, but a domain mismatch. MD is a tool for optimizing allocation given a fixed definition of goods and preferences. It is not designed to adjudicate the definition of the goods themselves. The residue indicates that MD is **normatively agnostic**. It can optimize a slave auction for efficiency (IC, IR, BB), but it cannot represent the claim that the good "human" should not be in the set of allocatable objects $\mathcal{O}$.

  **2. The Legitimacy Gap (Vote Selling):**
  Can vote selling be represented without collapsing democratic legitimacy into transferable utility?
  *   *Analysis:* No. In MD, "legitimacy" is typically proxied by "strategy-proofness" or "fairness" (e.g., anonymity). If we allow side-payments, we move from a voting mechanism to a market mechanism. MD can model this transition, but it cannot represent the *loss of authority* of the outcome. If the SCF selects candidate $A$, MD asks "Was this efficient/IC?" Sandel asks "Does this outcome bind the populace?"
  *   *Residue:* This suggests the philosophical claim is **determinate** but **outside the scope** of the formalism. The claim is about the *binding nature* of the social contract, which is a pre-condition for the mechanism to exist, not a variable within it.

  **3. Endogenous Preferences (Crowding Out):**
  Does capturing crowding out require violating the independence assumption?
  *   *Analysis:* Yes. Standard implementation theory assumes $\Theta$ is fixed. If $M$ affects $\Theta$, the Revelation Principle does not apply in its standard form because the "direct mechanism" would itself alter the types it seeks to elicit.
  *   *Residue:* This is a sign that the philosophical claim is **more determinate than the standard model allows**. It highlights a genuine limitation in static mechanism design. The "crowding out" effect is a dynamic feedback loop that static IC constraints cannot capture. To model this faithfully, MD must evolve into a theory of **institutional evolution**, where the mechanism is part of the environment that selects for preferences.

  ### Summary of Translation

  | Philosophical Claim | MD Translation | Fidelity |
  | :--- | :--- | :--- |
  | **Roth's Repugnance** | Constraint on Feasible Set ($\mathcal{F} \subset \mathcal{O}$) | **Clean** |
  | **Sandel's Crowding Out** | Endogenous Preferences ($u_i(x, \theta, M)$) | **Distorted** (Violates static independence) |
  | **Corruption of Meaning** | Path-Dependent Utility / Institutional Externalities | **None** (MD is consequentialist; Claim is constitutive) |
  | **Vote Selling** | Side-Contracting / Transferable Utility | **Distorted** (Collapses legitimacy into efficiency) |

  ### Conclusion on the Residue

  The residue is not a sign that the philosophical claims are indeterminate. Rather, it is a sign that **mechanism design is a technology of coordination, not a theory of value.**

  When Sandel argues that putting a price on emergency supplies "corrupts" the good, he is asserting that the *metric of value* (price) is inappropriate for the *domain of the good* (survival/citizenship). Mechanism design takes the metric of value (utility) as given. Therefore, MD cannot represent the claim that the metric itself is invalid.

  To fully capture Sandel within your vocabulary, you would need to expand the mechanism design framework to include a **meta-constraint on the admissible utility functions**. You would need a "Normative IC" constraint, where a mechanism is only implementable if it preserves the structural integrity of the agents' preference domains (e.g., preventing the conversion of civic preferences into market preferences). Without this, MD treats the "corruption of meaning" as a preference change to be optimized around, rather than a boundary condition to be respected.
