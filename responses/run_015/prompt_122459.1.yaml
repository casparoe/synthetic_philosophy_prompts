answer: |-
  TO: Interdisciplinary Research Fellowships Committee
  FROM: Undergraduate Student Representative
  DATE: October 24, 2023
  RE: Allocation of Remaining Fellowship Line

  **Bottom Line:** I recommend we fund the Philosophy of Physics postdoc, but only if we attach binding conditions requiring demonstrated changes to physics research procedures.

  **Context and Stakes**
  We have one fellowship line remaining. If unspent this cycle, funds revert to the Physics Department's equipment budget. This makes declining an active choice to purchase hardware rather than support personnel. Furthermore, the donor gift agreement explicitly mandates work that "increases the effectiveness of physics research." General outreach or graduate seminars do not satisfy this constraint. The current proposal promises "papers and a workshop," which measures output, not effectiveness. To comply with the donor and justify the opportunity cost, we require sharper success criteria.

  **The Scientific Case and Halvorsen's Objection**
  The proposal targets the measure problem in eternal inflation and evidentiary standards for the multiverse. Prof. Halvorsen argues that conceptual muddles in physics are historically resolved by further physics, citing renormalization and decoherence. He contends philosophy offers only commentary written after the fact.

  Halvorsen is right that physics often absorbs its own conceptual shocks. However, the measure problem is distinct from renormalization. It is not a mathematical inconsistency removed by new calculation; it is an underdetermination of probability. Without a rule for weighting observers, the theory yields no predictions at all. In this specific case, conceptual clarity is a prerequisite for calculation, not commentary upon it. If the postdoc identifies a measure that allows predictive power where none existed, they have increased research effectiveness. If they merely categorize existing views, Halvorsen is correct that the line would be wasted.

  **Evaluation: Counting Uses, Not Papers**
  Because the donor requires effectiveness, citation counts are insufficient. A paper can be highly cited yet ignored by practicing cosmologists. The committee's proposed "use" metric is the correct standard: we must track cases where a physics group's actual procedure changed based on the fellow's work. This might include adopting a specific measure, altering how a null result is stated, or changing how an analysis is framed.

  To make this enforceable, we must require visible acknowledgment. The fellow must document instances where collaborating physicists explicitly attribute a methodological change to their conceptual intervention. This shifts the burden from "publishing philosophy" to "enabling physics."

  **Recommendation**
  We should fund the line but treat this as a pilot program with strict review criteria. This respects the Dean's enthusiasm and the potential necessity of conceptual work in inflation theory, while protecting the committee against Halvorsen's valid concern that philosophy often decouples from practice. If the fellow cannot demonstrate procedural impact within 18 months, the line should not be renewed.

  **Motion**
  "I move to allocate the remaining fellowship line to the Philosophy of Physics postdoc proposal, contingent on the successful meeting of the attached effectiveness conditions at the 18-month review."

