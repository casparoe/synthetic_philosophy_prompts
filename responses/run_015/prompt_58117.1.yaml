  So my roommate Maya got really into superrationality after our intro game theory class and she will not shut up about it at dinner. Her basic pitch is that if two agents are really running the same kind of reasoning and both know it, they can both cooperate in a one-shot prisoners dilemma becuase they know the other will reach the same conclusion, even though normal game theory says defect. Anyway we kept throwing toy cases at her and her verdicts have been weirdly consistent. She says she would cooperate against her twin sister Lena because they think exactly alike and both know it, and defect against some random backpacker on a train she will never see again. She also says she would cooperate against this open-source bot that literally runs a copy-paste of her own decision script, even though she has zero social connection to whoever deployed it, but she would defect against her cousin who she adores but who is super impulsive and would never think about this similarity stuff at all. And she says she would cooperate against this guy from her study group because they both bought into the whole superrationality idea together and talked it through beforehand and both know the other did.

  Now she has to play a one-shot prisoners dilemma for actual money in our dorm lab against this finance bro from poker night who is nothing like her and thinks game theory is dumb, except the guy just bought some creepy predictor app trained on all her texts and past lab plays that is like 95 percent accurate, and he told her straight up he will just do whatever the app says she will do, and she actually believes the app works that well. So his move is almost guaranteed to match hers even though he is definitely not reasoning the way she reasons. Do you think she will say cooperate or defect there, and what rule do you think she has actually been running all along? I am less interested in the cooperate versus defect call than in what other rules fit her old verdicts just as well, what each one predicts for this finance bro case, your best guess with why, and what one extra case would seperate them cleanly.
