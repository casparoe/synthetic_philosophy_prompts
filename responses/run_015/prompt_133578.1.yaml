prompt: |-
  I'm a senior editor for a technical standards board and we publish huge regulatory docs made up of like five hundred individual clauses, each vetted seperately by a different working group. Right now my team has no real framework for deciding clause-by-clause whether we "accept" it into the standard, reject it, or punt it upstairs — and the problem is straight out of the preface paradox plus the lottery problem. Any single clause looks 99% likely correct, but with hundreds of them we know some errors will definitely get in. I want you to turn that philosophical mess into an actual decision proceedure my reviewers can run in about twenty minutes per clause, with ordered questions, what counts as a sufficient answer, where it stops with a hard no, and where it has to hand off to a human because it's a values call not a probability call. Don't flatten out the distinction between "accepting for practical reasoning" and "believing it's true" — that has to survive in the steps somehow. I also want you to build in a kind of document-level "error budget" idea, where acceptance of one clause affects the risk pool for the rest, since that's the only way the lottery logic makes operational sense here.

  Apply this to three cases: a routine typography/formatting clause; a pedestrian-bridge structural-load clause where expert confidence is 99.2% but being wrong kills people; and a climate-adaptation clause that an industry group is pushing hard for, where the historical base-rate for similar clauses being wrong is high. One of these needs to come out in a way my team genuinely won't like — probably forcing rejection or an expensive delay despite the high confidence number. Then be explicit about what the procedure can't do: for instance, who sets the global error cap, whether we're ever required to reopen accepted clauses, or how to weigh political pressure against the budget.

  Please lead with the bottom line in your first sentence — the single governing rule that replaces a flat belief-threshold — then lay out the reasoning, the checklist in order, the three worked cases (including the unwelcome one), and the hard limits, all with no preamble and without restating my question. Keep it practical, but don't pretend the philosophy disappears.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Senior Editor for a technical standards board.
      *   **Problem:** Managing hundreds of clauses vetted by different working groups. Facing the "Preface Paradox" (believing each clause is true but knowing the conjunction is likely false) and the "Lottery Problem" (high probability per ticket/clause, but certainty of some failures).
      *   **Goal:** Create a decision procedure (checklist) for reviewers (~20 mins/clause) that distinguishes between "accepting for practical reasoning" vs. "believing it's true," incorporates an "error budget" (document-level risk pool), and handles value judgments vs. probability judgments.
      *   **Requirements:**
          *   Lead with the bottom line (single governing rule).
          *   No preamble, no restating the question.
          *   Lay out reasoning, checklist (ordered questions, stop conditions, handoffs).
          *   Apply to three cases:
              1.  Routine typography/formatting.
              2.  Pedestrian-bridge structural-load (99.2% confidence, high stakes).
              3.  Climate-adaptation (industry push, high historical error rate).
          *   One case must yield an unwelcome result (rejection/delay despite high confidence).
          *   Explicitly state hard limits (who sets error cap, reopening clauses, political pressure).
          *   Keep it practical but acknowledge the philosophy.

  2.  **Deconstruct the Philosophical Core:**
      *   *Preface Paradox:* An author believes each claim in the book but admits in the preface that there are likely errors.
      *   *Lottery Problem:* Each ticket is likely to lose, but one must win. Here, each clause is likely correct, but some must be wrong.
      *   *Solution:* Shift from "Is this true?" to "Is this safe to include given our remaining risk budget?" This moves from epistemic justification to pragmatic acceptance based on risk allocation.
      *   *Error Budget:* If the document can tolerate $X$ errors, and we have $N$ clauses, each clause consumes part of that budget based on its risk profile. High-stakes clauses consume more budget per unit of uncertainty.
      *   *Acceptance vs. Belief:* The procedure must validate "assertion for use" rather than "ontological truth."

  3.  **Drafting the Governing Rule:**
      *   Needs to replace a flat belief threshold (e.g., "95% confidence").
      *   Needs to incorporate the error budget.
      *   *Draft:* "Accept a clause only if its risk-weighted uncertainty cost fits within the remaining document-level error budget, regardless of individual confidence levels."
      *   *Refinement:* Make it punchier. "No clause is accepted based on isolated probability; acceptance is granted only if the clause's risk-weighted uncertainty cost fits within the remaining document-level error budget."

  4.  **Developing the Procedure (The Checklist):**
      *   Time limit: ~20 mins.
      *   Steps need to be ordered.
      *   Need to distinguish practical reasoning vs. truth.
      *   Need to account for the "Error Budget."
      *   *Step 1: Categorize Stake/Impact.* (Low, Medium, Critical).
      *   *Step 2: Assess Uncertainty.* (Not just confidence, but base rates).
      *   *Step 3: Calculate Budget Cost.* (Stake x Uncertainty).
      *   *Step 4: Check Budget.* (Is there room?)
      *   *Step 5: Value Judgment Handoff.* (If political/ethical).
      *   *Stop conditions:* Hard No if budget exceeded. Handoff if values unclear.

  5.  **Developing the Three Cases:**
      *   *Case 1: Typography.* Low stake. Low cost. Even with moderate uncertainty, it fits budget. Accept.
      *   *Case 2: Structural Load.* High stake (death). 99.2% confidence sounds good, but 0.8% error rate on death is too high. Cost exceeds budget. *This is the unwelcome one.* Reject or demand higher proof (delay).
      *   *Case 3: Climate Adaptation.* Industry push. High historical error rate (base rate fallacy risk). Medium/High stake. Budget cost high. Might need handoff due to political pressure vs. technical merit. Let's make this one require the "Values Handoff" because of the industry pressure vs. historical error.
      *   *Wait, the prompt asks for one to come out in a way the team won't like.* The structural load one is the obvious candidate for "99.2% isn't good enough." That's counter-intuitive to engineers who love high percentages.
      *   *Refining Case 3:* Climate clause. Industry pushing. Historical base rate for similar clauses being wrong is high. This triggers the "Lottery" aspect. Even if current confidence is high, the *class* of clause has high failure rate. This should consume massive budget.

  6.  **Refining the Error Budget Concept:**
      *   Total Document Error Tolerance (TDET).
      *   Each clause has a "Risk Weight" (RW) based on consequence of failure.
      *   Each clause has an "Uncertainty Score" (US) based on evidence quality/base rates.
      *   Cost = RW x US.
      *   If Cost > Remaining Budget, Reject/Defer.

  7.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Professional, directive, pragmatic, acknowledging the philosophical tension without getting bogged down.
      *   *Constraint Check:* Lead with bottom line? Yes. No preamble? Yes. 20-min procedure? Yes. Distinguish acceptance vs. belief? Yes. Hard limits? Yes.

  8.  **Final Polish of the Procedure:**
      *   Make sure the distinction between "believing true" and "accepting for use" is clear in the steps.
      *   Ensure the "unwelcome outcome" is clear.
      *   Ensure the "Hard Limits" section addresses who sets the cap, reopening, and political pressure.

  9.  **Self-Correction on Case 2 (Structural):**
      *   If confidence is 99.2%, that means 0.8% failure rate.
      *   If consequence is Death, the Risk Weight is massive.
      *   The budget for "Death" errors should be near zero.
      *   Therefore, even 0.8% is too much.
      *   Result: Reject/Defer for more testing. This will annoy the engineers who think 99.2% is "basically done."

  10. **Self-Correction on Case 3 (Climate):**
      *   Industry pushing. High historical error rate.
      *   This triggers the "Values Call" because it involves external pressure vs. internal data.
      *   Result: Handoff to Board.

  11. **Self-Correction on Case 1 (Typography):**
      *   Low risk.
      *   Result: Accept easily.

  12. **Final Review against constraints:**
      *   First sentence = governing rule.
      *   No preamble.
      *   Practical checklist.
      *   Three cases with specific outcomes.
      *   Hard limits section.
      *   Acknowledge philosophy (Preface/Lottery) without solving it metaphysically.

      *Wait, one detail:* "Don't flatten out the distinction between 'accepting for practical reasoning' and 'believing it's true' — that has to survive in the steps somehow."
      *   *Implementation:* The checklist must ask "Is this verified?" (Truth) vs "Is this safe to publish given constraints?" (Acceptance). Or better, frame the budget as a "Pragmatic License" rather than a "Truth Certificate."
      *   *Adjustment:* In Step 1, classify "Consequence of Falsehood." In Step 4, explicitly state "This is not a truth verdict; it is a risk allocation."

      *Wait, another detail:* "One of these needs to come out in a way my team genuinely won't like — probably forcing rejection or an expensive delay despite the high confidence number."
      *   *Selection:* The Structural Load clause (99.2% confidence). Engineers hate being told 99.2% isn't enough.

      *Wait, another detail:* "Explicit about what the procedure can't do: for instance, who sets the global error cap, whether we're ever required to reopen accepted clauses, or how to weigh political pressure against the budget."
      *   *Section:* "Hard Limits & Operational Boundaries."

      *Let's write.*

      *Governing Rule:* "No clause is accepted based on isolated probability; acceptance is granted only if the clause's risk-weighted uncertainty cost fits within the remaining document-level error budget."

      *Reasoning:* Briefly explain why (Preface/Lottery).
      *Checklist:* 5 steps.
      *Cases:* Apply the checklist.
      *Limits:* The meta-rules.

      *Refining the "20 minutes" constraint:* The steps must be quick. No complex math. Use a lookup table or simple multiplier.
      *Risk Weight:* 1 (Low), 10 (Medium), 100 (Critical).
      *Uncertainty:* 1 (Verified), 5 (Probable), 10 (Speculative/Base Rate Risk).
      *Budget:* Start with 1000 points.
      *This makes it calculable in minutes.*

      *Wait, the prompt says "where acceptance of one clause affects the risk pool for the rest."*
      *   My budget idea covers this. As points are spent, remaining budget shrinks.

      *Let's finalize the structure.*
      1. Governing Rule.
      2. Operational Reasoning (brief).
      3. The 20-Minute Decision Protocol (Checklist).
      4. Applied Cases (1, 2, 3).
      5. Hard Limits & Operational Boundaries.

      *Check:* Did I distinguish acceptance vs belief?
