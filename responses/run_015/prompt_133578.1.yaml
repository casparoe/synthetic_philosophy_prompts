      *Ready to draft.*
answer: |-
  No clause is accepted based on isolated probability; acceptance is granted only if the clause's risk-weighted uncertainty cost fits within the remaining document-level error budget.

  ### Operational Reasoning
  This procedure treats the standard not as a collection of truths, but as a risk portfolio. The Preface Paradox is resolved by admitting we cannot guarantee conjunction truth; the Lottery Problem is managed by allocating a finite "error budget" across the document. A clause with 99% confidence may be rejected if its failure consequence is catastrophic, while a clause with 90% confidence may be accepted if its failure is cosmetic. This distinguishes **epistemic belief** (is this factually correct?) from **pragmatic acceptance** (is this safe to publish given our remaining risk allowance?).

  ### The 20-Minute Decision Protocol
  *Reviewers must complete these five steps sequentially. Stop immediately if a "Hard No" condition is met.*

  **1. Classify Consequence of Falsehood (CoF)**
  *   **Question:** If this clause is wrong, what is the worst-case realistic outcome?
  *   **Options:**
      *   **Type A (Cosmetic):** Typo, formatting, non-binding note. (Weight: 1)
      *   **Type B (Operational):** Process delay, financial cost, interoperability failure. (Weight: 10)
      *   **Type C (Critical):** Safety hazard, legal liability, systemic collapse. (Weight: 100)
  *   *Time limit: 3 minutes.*

  **2. Assess Uncertainty Score (US)**
  *   **Question:** What is the probability of error, adjusted for base rates?
  *   **Options:**
      *   **Score 1 (Verified):** Empirically tested, consensus >99%, low historical error rate for this clause type.
      *   **Score 5 (Probable):** Expert consensus 95-99%, moderate historical error rate.
      *   **Score 10 (Speculative):** Confidence <95%, OR high historical error rate for this clause type (e.g., predictive regulatory clauses), OR dependent on external political factors.
  *   *Note:* Do not trust working group confidence blindly; apply the historical base-rate penalty if applicable.
  *   *Time limit: 7 minutes.*

  **3. Calculate Budget Cost**
  *   **Action:** Multiply CoF Weight × Uncertainty Score.
  *   **Check:** Consult the **Document Risk Ledger** (maintained by Lead Editor).
  *   **Condition:** If Cost > Remaining Budget, issue **Hard No**. The clause is rejected or deferred until the budget is replenished (e.g., by cutting other clauses).
  *   *Time limit: 2 minutes.*

  **4. Verify Pragmatic License (Acceptance vs. Belief)**
  *   **Question:** Are we asserting this is *True*, or that it is *Safe to Use*?
  *   **Action:** If Cost ≤ Remaining Budget, mark as **"Accepted for Publication."**
  *   **Requirement:** Attach a disclaimer tag if US > 1 (e.g., "Best Available Standard," not "Verified Fact"). This preserves the distinction that we are licensing use, not certifying truth.
  *   *Time limit: 3 minutes.*

  **5. Identify Values Handoffs**
  *   **Question:** Does acceptance depend on weighing political pressure, ethical trade-offs, or budget allocation disputes rather than technical data?
  *   **Condition:** If yes, do **not** accept. Flag for **Board Review**.
  *   **Trigger:** Industry lobbying, conflicting public safety mandates, or disputes over how much budget a specific section consumes.
  *   *Time limit: 5 minutes.*

  ---

  ### Applied Cases

  **Case 1: Routine Typography/Formatting Clause**
  *   **CoF:** Type A (Cosmetic). Weight = 1.
  *   **US:** Score 1 (Verified). Confidence high, base-rate error low.
  *   **Cost:** 1 × 1 = 1 point.
  *   **Budget Check:** Remaining budget is 450 points. 1 < 450.
  *   **Values Handoff:** None.
  *   **Decision:** **Accept.**
  *   **Reasoning:** The cost to the risk pool is negligible. Even if false, no harm occurs.

  **Case 2: Pedestrian-Bridge Structural-Load Clause**
  *   **CoF:** Type C (Critical). Weight = 100 (Failure kills people).
  *   **US:** Score 5 (Probable). Working group claims 99.2% confidence (0.8% error rate). However, structural modeling has a historical base-rate error of 1% in similar standards. We must score based on base rate, not claimed confidence.
  *   **Cost:** 100 × 5 = 500 points.
  *   **Budget Check:** Remaining budget is 450 points. 500 > 450.
  *   **Decision:** **Reject / Deferred.**
  *   **Reasoning:** This is the unwelcome outcome. Despite 99.2% confidence, the consequence weight is so high that the uncertainty cost exhausts the entire document error budget alone. Accepting this would leave zero room for error in the remaining 400 clauses. The team must either find a way to reduce uncertainty to Score 1 (full physical load testing) or cut other high-risk clauses to free up budget.

  **Case 3: Climate-Adaptation Clause (Industry Push)**
  *   **CoF:** Type B (Operational). Weight = 10.
  *   **US:** Score 10 (Speculative). Historical base-rate for similar predictive clauses is high error. Industry is pushing hard.
  *   **Cost:** 10 × 10 = 100 points.
  *   **Budget Check:** Remaining budget is 450 points. 100 < 450.
  *   **Values Handoff:** **Triggered.** Industry pressure vs. historical error rate creates a political/ethical conflict.
  *   **Decision:** **Handoff to Board.**
  *   **Reasoning:** While the budget technically allows this, the pressure introduces a values conflict. The procedure cannot weigh lobbying against safety data; that requires a human governance decision.

  ---

  ### Hard Limits & Operational Boundaries

  1.  **Who Sets the Global Error Cap:** The Reviewers do not set the total budget. This is set by the Board based on the standard's liability profile and legal indemnity limits. Reviewers only manage the *allocation*, not the *total*.
  2.  **Reopening Accepted Clauses:** This procedure does not require reopening previously accepted clauses unless a **Budget Audit** reveals the total document cost exceeds the cap. We do not chase truth retrospectively; we manage risk prospectively. If the budget is breached later, future clauses are rejected, not past ones.
  3.  **Political Pressure vs. Budget:** The procedure cannot weigh political pressure. If industry lobbying attempts to force a clause that exceeds the budget cost, the procedure mandates a **Values Handoff**. Reviewers are forbidden from expanding the budget to accommodate pressure; they must kick the decision upstairs.
  4.  **Truth vs. Utility:** This procedure never certifies a clause as "True." It certifies it as "Within Risk Tolerance." If a clause is factually true but consumes too much budget (Case 2), it is still rejected. If a clause is probabilistic but cheap on risk (Case 1), it is accepted. The philosophy remains: we are publishing a tool for reasoning, not a map of reality.
