answer: |-
  Good morning, and welcome to Bristol. It is a pleasure to see this room filled half with those who spend their lives theorising democracy, and half with those who spend their lives practising it. Usually, these two groups speak past one another. The academics seek consistency; the practitioners seek workability. Today, under the banner of 'Who Gets the Ballot?', I want us to resist the urge to tidy things up too quickly.

  We are gathered to discuss compulsory voting, the voting age, and the franchise for non-citizen residents. But we cannot discuss these abstractly. We are meeting in the shadow of a specific, peculiar experiment happening right here in our city. As you know, Bristol is launching a pilot for local climate budget referendums. The rules are novel, and frankly, they are contradictory.

  On one hand, we are expanding the franchise. Sixteen-year-olds will vote. Residents who have lived here over ten years without citizenship will vote. This is a bold claim about stakeholding: if you breathe the air and pay the taxes, you should have a say in the climate budget.

  But on the other hand, there is a catch. The votes of these young people and long-term residents only count fully if registered citizen turnout hits eighty per cent. If the core citizenry stays home, the votes of the newcomers become advisory only. They are heard, but not heeded.

  Now, for the philosophers in the room, this looks like a normative mess. It violates the principle of individual autonomy—your vote's weight depends on someone else's behaviour. It also violates the principle of equal collective self-government—it creates a two-tier electorate where one group holds the keys to the other's legitimacy.

  For the councillors and activists in the room, this looks like a political compromise dressed up as policy. It risks telling our youth and our migrant neighbours that their belonging is conditional, hostage to the apathy of others.

  I urge you not to dismiss this tension as mere bureaucratic clumsiness. Instead, I want to suggest that this pilot scheme strips away the comforting illusions we usually wrap around democracy.

  Often, we speak of voting as a right inherent to individual autonomy. But compulsory voting undermines that, and this conditional threshold undermines it further. You do not have an inviolable right to a decisive vote here; you have a claim that is honoured only if the community shows up to validate it.

  Similarly, we often speak of democracy as straightforward collective self-rule. But this eighty per cent threshold admits something uncomfortable: that the 'collective' is not one body. There is a core, and there is a periphery. The pilot scheme makes explicit what is usually implicit: that inclusion is often granted by the established body to the newcomer, rather than claimed by the newcomer as of right.

  This is philosophically revealing. It suggests that democracy is not a status you possess, like a property deed. It is a practice you sustain, like a trust.

  If we look at the three topics of this workshop through this lens, the questions shift.

  Regarding compulsory voting: We cannot argue it forces people to be free. Instead, we must ask: is there a duty to participate sufficient to unlock the franchise for others? Does my laziness at the ballot box disenfranchise my neighbour?

  Regarding the voting age and non-citizen residents: We cannot simply argue they have a natural right to vote. We must ask: how do we integrate their stakes into the community without triggering a backlash that lowers turnout and renders their votes advisory? The pilot admits that expansion of the franchise is fragile. It depends on the enthusiasm of the existing electorate.

  This is dangerous terrain. To tell a sixteen-year-old that their vote counts only if their parents turn out is risky. To tell a resident of ten years that their voice is advisory because their neighbour didn't bother to vote is deeply unjust.

  But it is honest. It reveals that democratic inclusion is not a one-off grant. It is a continuous negotiation of solidarity. The Bristol pilot exposes the wiring behind the wall. It shows us that the boundary of the demos is not a fixed line, but a membrane that expands and contracts based on the energy of the body politic.

  So, over the next two days, I am not asking you to solve this contradiction. I am asking you to sit with it. If we argue for pure autonomy, we ignore the reality of this pilot. If we argue for pure majoritarianism, we ignore the injustice of the threshold.

  We need to find a language that acknowledges this interdependence. We need to explain to our constituents that voting is not just about expressing preference; it is about maintaining the conditions under which others are allowed to belong.

  The philosophers here can help us understand the legitimacy of such conditionality. The practitioners here can tell us whether such fragility is sustainable in the real world. If we cannot bridge that gap, this workshop is just talk. But if we can, we might just find a new way to understand who gets the ballot, and what that ballot actually means.

  Thank you. Let's begin.
