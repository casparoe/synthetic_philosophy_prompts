prompt: |-
  Hey, I need you to act like an expert political philospher and a seasoned speechwriter — please think carefully and do a quick bit of brainstorming before you actually draft anything. I'm giving the opening remarks at a workshop in Bristol next month called 'Who Gets the Ballot?' The room will be split: about half are academic philosphers of democracy who will catch every conceptual move, and about half are local councillors and youth activists who don't want jargon but do care about fairness. The workshop covers three things — compulsory voting, lowering the voting age to sixteen, and letting long-term non-citizen residents vote in local elections.

  But here's the specific situation I need the speech to revolve around, because its not just decoration: our city is running a pilot for the local climate budget referendums. In this pilot, sixteen-year-olds and residents who've lived here over ten years but don't have citizenship can cast votes, but those votes only count fully if registered citizen turnout hits 80%. If turnout is lower, their votes are advisory only. So we're expanding and restricting the franchise in the same breath, and I want the speech to treat that tension as philosophically revealing rather than just a political compromise. The idea should shape what I can and can't say — for example, I can't sincerely frame this as pure respect for individual autonomy, since compulsory voting and conditional advisory status both undermine that framing. But I also can't pretend its straightforward collective self-government, because the 80% threshold is clearly protecting citizen privilege. I need you to navigate that without alienating either half of the room.

  Please write about five minutes of remarks in British English (colour, centre, labour, etc.). Don't include any bibliography, reading list, or citations — I just want the text. Also, there's probably a typo in my brief above but just roll with it. Make sure the philosophical argument does real structural work, not just window dressing.
