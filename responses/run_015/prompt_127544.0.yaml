      *   *What is Telic Egalitarianism?* It's the view that equality is *intrinsically* good. Inequality is *intrinsically* bad. The outcome itself is judged by how equal it is.
      *   *What is the LDO?* Imagine two outcomes: A (Unequal, some high, some low) and B (Equal, everyone at the low level). B is achieved by "leveling down" the high group to match the low group. No one is made better off; some are made worse off; no one gains.
      *   *The Mechanism:* If equality is intrinsically valuable, then B is *in one respect* better than A (it is more equal). Even if B is all-things-considered worse (because people suffer), the egalitarian must admit there is *some* pro tanto reason to prefer B.
      *   *The Objection:* This seems absurd. How can a situation where some suffer and no one benefits be better *in any respect*? It violates the "Person-Affecting Intuition" (or at least the idea that justice must benefit someone). It makes equality a "fetish."
      *   *Why not Prioritarianism?* Prioritarianism holds that benefits matter more the worse off the recipient is. It weights utility. It does *not* care about relational equality (gaps between people). It cares about absolute levels, weighted. If you level down, you reduce total weighted utility. You hurt the rich (loss of utility) and help no one (the poor stay same). Since weights are positive, a loss is always a loss. There is no compensating gain in "equality" because equality isn't the metric. Therefore, prioritarianism never recommends leveling down.

