answer: |-
  **Private Brainstorm**
  Agreement lies in the mathematics of variance decomposition: both accept $H^2 = V_G/V_P$ is population-specific. The Larkspur-Cinderford vignette forces Constraint to admit environment drives mean differences (0.8 SD) despite low $H^2$ in Cinderford. It forces Malleability to admit uniform environments inflate $H^2$ (0.75 in Larkspur). Contention centers on the policy weight of residual variance. Constraint worries high $H^2$ signals exhausted environmental leverage; Malleability worries this phrasing invites determinism. Movement requires Constraint to acknowledge mean shifts are possible without variance reduction, and Malleability to acknowledge that successful equalization may paradoxically raise $H^2$. The vignettes prevent abstract sloganizing about "genes vs. environment" by fixing the parameters. The cruxes must target whether specific interventions alter $V_G$ expression or simply shift the norm of reaction.

  ***

  # Joint Statement on Heritability, Inequality, and Intervention

  ### I. Agreed Claims Regarding Quantitative Genetic Parameters
  1.  **Variance Proportion:** Heritability ($H^2$) quantifies the proportion of phenotypic variance ($V_P$) attributable to genetic variance ($V_G$) within a specific population at a specific time; it is not a measure of individual genetic determination.
  2.  **Population Specificity:** As demonstrated in **Vignette Larkspur-Cinderford**, $H^2$ is contingent on environmental variance ($V_E$); reducing $V_E$ (Larkspur) increases $H^2$ (0.75) even if $V_G$ remains constant, while increasing $V_E$ (Cinderford) decreases $H^2$ (0.35).
  3.  **Within-Group vs. Between-Group:** High within-group $H^2$ entails nothing regarding the cause of mean differences between groups; the 0.8 SD mean deficit in Cinderford is entirely environmental despite its lower $H^2$.
  4.  **Additivity:** Standard heritability estimates primarily capture additive genetic variance ($V_A$); non-additive effects (dominance, epistasis) are often subsumed into error or specific variance components unless modeled explicitly.
  5.  **Gene-Environment Interaction (GxE):** Genetic effects are mediated by environmental contexts; the same genotype may yield different phenotypic values across different environments (norms of reaction).
  6.  **Gene-Environment Correlation (rGE):** Passive, active, and evocative correlations can inflate $H^2$ estimates in observational data by confounding genetic transmission with environmental transmission.
  7.  **Immutability:** High $H^2$ does not imply trait immutability; a trait can be highly heritable yet highly responsive to environmental intervention that shifts the population mean.
  8.  **Intervention Effects:** Successful universal interventions (e.g., **Vignette Lenses Plus Tutoring**) may reduce $V_E$, thereby increasing post-intervention $H^2$ even as absolute inequality decreases.

  ### II. Residual Disagreements

  | Domain | Camp Constraint Wording | Camp Malleability Wording |
  | :--- | :--- | :--- |
  | **Policy Limits** | High $H^2$ indicates that remaining variance is increasingly resistant to environmental leveling, implying diminishing returns on equalization efforts. | High $H^2$ indicates only that current environmental variance is low relative to genetic variance, not that new environmental interventions lack efficacy. |
  | **Inequality** | Residual inequality after optimal environmental intervention is largely inevitable due to persistent $V_G$. | Residual inequality is contingent on the specific suite of interventions tried; untried interventions may reduce variance further. |
  | **Interpretation** | Heritability estimates provide a ceiling on the variance reduction achievable by standard environmental manipulations. | Heritability estimates describe the status quo and provide no ceiling on variance reduction achievable by novel or intensive manipulations. |

  ### III. Application to Stipulated Vignettes

  **Vignette Larkspur-Cinderford**
  *   **What Follows:** The 0.8 SD mean difference between towns is environmental in origin, as the distribution of relevant genetic variants is identical. The difference in $H^2$ (0.75 vs. 0.35) is driven by differences in $V_E$, not $V_G$.
  *   **What Does Not Follow:** It does not follow that Larkspur children's outcomes are "more genetic" than Cinderford children's. It does not follow that Cinderford's lower mean is constrained by genetics.
  *   **Implication:** Camp Constraint must acknowledge that large mean shifts occur independently of $H^2$. Camp Malleability must acknowledge that environmental uniformity (Larkspur) naturally elevates $H^2$.

  **Vignette Lenses Plus Tutoring**
  *   **What Follows:** Implementing this program in Cinderford may raise the mean fluency score significantly (closing the 0.8 SD gap) regardless of the baseline $H^2$ of 0.35. If the program standardizes the learning environment, post-intervention $H^2$ in Cinderford may rise toward 0.75.
  *   **What Does Not Follow:** It does not follow that the program will eliminate all variance. It does not follow that genetic differences will cease to predict individual differences post-intervention.
  *   **Implication:** Camp Constraint must acknowledge that high post-intervention $H^2$ is compatible with successful mean-level remediation. Camp Malleability must acknowledge that successful remediation may result in higher heritability estimates.

  ### IV. Cruxes for Empirical Resolution

  **Crux 1: Scaling and Diminishing Returns**
  *   **Question:** Does the efficacy of high-dosage tutoring diminish as it scales to universal coverage, or do effects remain stable?
  *   **Agreed Evidence:** A randomized controlled trial (RCT) scaling the **Lenses Plus Tutoring** program across multiple districts with varying baseline $V_E$.
  *   **Camp Constraint Prediction:** Effect sizes will decay as scaling reduces implementation fidelity, leaving residual variance largely explained by $V_G$.
  *   **Camp Malleability Prediction:** Effect sizes will remain robust if fidelity is maintained, significantly reducing $V_P$ regardless of baseline $H^2$.

  **Crux 2: Aptitude-Treatment Interaction (GxE)**
  *   **Question:** Do genetic propensities predict responsiveness to the tutoring intervention?
  *   **Agreed Evidence:** Polygenic score analysis within the **Lenses Plus Tutoring** treatment arm to test for genotype-by-intervention interaction.
  *   **Camp Constraint Prediction:** Significant interaction will emerge; those with lower genetic propensity will benefit less, preserving rank-order inequality.
  *   **Camp Malleability Prediction:** Interaction will be negligible; the intervention acts as a "floor" effect, benefiting those with lower propensity most, reducing rank-order inequality.

  **Crux 3: Fade-out vs. Maintenance**
  *   **Question:** Are intervention gains maintained into adulthood where $H^2$ for IQ typically peaks?
  *   **Agreed Evidence:** Longitudinal follow-up of **Lenses Plus Tutoring** recipients to age 25.
  *   **Camp Constraint Prediction:** Gains will fade as individuals select into environments matching their genetic propensities (active rGE), restoring baseline variance structures.
  *   **Camp Malleability Prediction:** Gains will persist if the intervention alters developmental trajectories (e.g., literacy skills), sustaining mean shifts despite high adult $H^2$.

  ### V. Note on Verbal Dispute
  A portion of the dispute is verbal, centering on the definition of "constraint." Camp Constraint uses the term to describe limits on *variance reduction* (inequality), whereas Camp Malleability uses "malleability" to describe potential for *mean shifts* (adequacy). Both camps agree that means can shift and variances may persist. Clarifying that high heritability constrains the *elimination of rank-order differences* more than it constrains the *improvement of absolute levels* would resolve much of the rhetorical friction without altering empirical commitments.
