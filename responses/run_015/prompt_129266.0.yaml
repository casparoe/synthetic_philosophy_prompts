answer: |-
  ### Recommendation: Run the Two-Player (CHSH) Version

  **Verdict:** Do not run the three-player (GHZ/Mermin) version. Run the two-player (CHSH) version.

  **Why:** The GHZ version is a logical sledgehammer: it proves a contradiction in a single shot. While dramatic, it obscures the two philosophical points you care about most. First, it hides the *statistical* nature of real Bell tests, making it harder to discuss loopholes (detection efficiency, noise) because the theoretical prediction is 100% certainty. Second, it makes the "no-signaling" constraint harder to grasp; when correlations are perfect, it feels like communication is happening. The CHSH (two-player) version forces students to sit with probability. They have to accept that 75% is a hard ceiling for classical strategies and that 85% is a specific, constrained violation. This statistical tension is where the philosophy lives. It allows you to discuss why we need many rounds (closing the statistical loophole) and why 85% is the limit (Tsirelson's bound) without invoking heavy math.

  Below is a complete 80-minute lesson plan designed to meet your constraints.

  ---

  ### Activity Design: "The Correlation Game"

  **Forbidden Words:** Bell, Locality, Entanglement, Quantum, Particle, Spin.
  **Allowed Words:** Inputs, Outputs, Pairs, Strategy, Box, Referee.

  #### 1. Materials List
  *   **8 "Station Kits"** (one per pair): Each contains 2 folders (labeled "Player 1" and "Player 2"), a pad of paper, and 2 pens.
  *   **Question Cards:** 2 decks. Deck A has cards marked "Setting 1". Deck B has cards marked "Setting 2".
  *   **Randomizer:** A phone app or dice for the Referee (you or a TA).
  *   **The "Black Box" Decks:** 4 decks of index cards prepared by you in advance (details below).
  *   **Payoff:** Candy or participation points.
  *   **Scoreboard:** Whiteboard to track Win/Loss tallies.

  #### 2. The Rules (Read aloud, 5 minutes)
  Divide the class into 8 pairs. Each pair must separate to opposite corners of the room (or one stays, one goes to the hall). They cannot communicate once the round starts.

  **The Goal:** Maximize the team's win rate.
  **The Round:**
  1.  The Referee sends a **Setting** (1 or 2) to Player 1 and a **Setting** (1 or 2) to Player 2. These are chosen randomly and independently.
  2.  Each player writes down an **Output** (0 or 1) on their slip.
  3.  They hand the slips to the Referee.
  4.  **Win Condition:**
      *   If **any** player received Setting 1 (i.e., 1-1, 1-2, or 2-1): The Outputs must **MATCH** (0-0 or 1-1).
      *   If **both** players received Setting 2 (i.e., 2-2): The Outputs must **MISMATCH** (0-1 or 1-0).

  **Payoff:** The pair with the highest win rate gets candy/credit.

  #### 3. Phase 1: The Classical Strategy (25 minutes)
  Tell the students: *"You are the devices. You may agree on a strategy beforehand. You may bring notes. But once you separate, no communication."*

  *   **Prep (5 mins):** Let them huddle and plan. (They will likely agree on "Always output 0" or "Output whatever Setting you got".)
  *   **Play (15 mins):** Run 10 rounds.
      *   Referee generates Settings randomly (e.g., roll a die: 1-3 = Setting 1, 4-6 = Setting 2).
      *   Runners collect Outputs.
      *   Tally wins on the board immediately after each round to keep energy up.
  *   **Result:** They will cap out near 75%. If a pair claims 90%, accuse them of cheating (signaling) and make them re-do it. This is a feature, not a bug—it primes the "loophole" discussion.

  #### 4. Phase 2: The Black Box (15 minutes)
  Tell the students: *"You failed to beat 75%. Now we test a Black Box. You are no longer the devices; you are the testers. You send the Settings in; the Box returns the Outputs."*

  *   **Setup:** You (the Instructor) hold the **Black Box Decks**.
  *   **Procedure:**
      1.  A pair sends you their two Settings (e.g., "Player 1: 2, Player 2: 2").
      2.  You select the corresponding Deck (Deck 2-2).
      3.  You draw the top card, which tells you what Outputs to give them (e.g., "0, 1").
      4.  You record the win/loss.
  *   **The Trick:** The decks are pre-shuffled to mimic quantum statistics.
      *   **Decks 1-1, 1-2, 2-1:** Contain 85% Matching pairs (0,0 or 1,1) and 15% Mismatching.
      *   **Deck 2-2:** Contains 85% Mismatching pairs (0,1 or 1,0) and 15% Matching.
      *   *Crucial Constraint:* To ensure **No-Signaling**, the marginal probabilities must be 50/50.
          *   In Decks 1-1, 1-2, 2-1: Ensure half the matches are 0-0 and half are 1-1.
          *   In Deck 2-2: Ensure half the mismatches are 0-1 and half are 1-0.
      *   *Preparation:* Make 20 cards per deck. For Deck 2-2: 8 cards say "0,1", 8 cards say "1,0", 2 cards say "0,0", 2 cards say "1,1".
  *   **Result:** The class aggregate win rate will jump to ~85%.

  #### 5. The Debrief (35 minutes)
  *Now you may use the forbidden words.*

  **Step 1: Map the Cheats (Objective #2)**
  Ask: *"In Phase 1, how could you have beaten 75% if I wasn't watching?"*
  *   *Student:* "Yell the question to my partner."
      *   *You:* "That's the **Locality Loophole**. In real experiments, we separate detectors by kilometers so light can't travel between them in time."
  *   *Student:* "You could have picked the questions based on what we wrote."
      *   *You:* "That's the **Freedom of Choice Loophole**. We use cosmic random number generators to ensure the settings aren't influenced by the source."
  *   *Student:* "You could throw away the rounds we lost."
      *   *You:* "That's the **Detection Loophole**. We have to count every photon, even the ones we miss."

  **Step 2: Signaling vs. Correlation (Objective #1)**
  Ask: *"In Phase 2, the Box won 85% of the time. Did Player 1 know what Setting Player 2 got?"*
  *   Look at the data. When Player 2 got Setting 1, Player 1 output 0 roughly 50% of the time. When Player 2 got Setting 2, Player 1 *still* output 0 roughly 50% of the time.
  *   *Point:* "The *correlation* changed, but the *local statistics* did not. Player 1 sees random noise regardless of what happens at Player 2. You cannot send a message. This is the **No-Signaling Theorem**. Entanglement correlates outcomes, it does not transmit information."

  **Step 3: Why 85%? (Objective #3)**
  Ask: *"Why not 100%? If the Box is magic, why not win every round?"*
  *   Draw a truth table on the board. Show that to win 100% of the time, the Outputs would have to satisfy a logical contradiction (e.g., $A=B, B=C, C=D, D \neq A$).
  *   *The Kicker:* "To win 100%, Player 1 would need to know Player 2's Setting *before* answering. That requires signaling. The 85% limit (Tsirelson's Bound) is the maximum correlation possible *without* allowing faster-than-light signaling. If nature allowed 100%, causality would break."

  ---

  ### Arithmetic & Logistics

  **Distinguishing 75% from 85%:**
  *   **Sample Size:** With 8 pairs playing 10 rounds, $N = 80$.
  *   **Classical Expectation:** 60 wins ($75\%$). Standard Deviation $\sigma \approx 3.9$.
  *   **Quantum Expectation:** 68 wins ($85\%$). $\sigma \approx 3.1$.
  *   **Significance:** The difference is 8 wins. The combined error is $\approx 5$. This is a $1.6\sigma$ effect. It is *suggestive* but not definitive.
  *   **Mitigation:** Do not claim this proves physics. Claim it *demonstrates the gap*. Say: *"In a real lab, we run millions of rounds to get $5\sigma$ certainty. Today, we just want to see the trend."*
  *   **Time Management:** 10 rounds is the max. If rounds take longer than 90 seconds, cut to 5 rounds and aggregate data from all pairs more aggressively.

  **Predictable Failure Modes:**
  1.  **Collusion:** Students will try to text or signal.
      *   *Fix:* Confiscate phones. Put one student in the hallway. Make it a competition; if a pair is caught signaling, they are disqualified. This makes the rule enforcement part of the lesson (closing the loophole).
  2.  **Small Sample Noise:** A classical pair might get 90% by luck.
      *   *Fix:* If a pair beats 80% in Phase 1, highlight it. "This is statistical fluctuation. If we played 1,000 rounds, they would fall back to 75%." This teaches the law of large numbers.
  3.  **Confusion on Rules:** The "Mismatch on 2-2" rule is tricky.
      *   *Fix:* Print the Win Condition on their folders. "If ANY 1 $\rightarrow$ MATCH. If BOTH 2 $\rightarrow$ MISMATCH."

  ---

  ### Limitations: What You Must Supply in Words

  Be honest with your students. This activity is a simulation, not an experiment.

  1.  **The "Black Box" Honesty:** You must admit that *you* generated the 85%. You are not claiming the students produced quantum effects. You are claiming that *nature* behaves like the Black Box. The activity proves that *if* nature behaves this way, classical logic fails.
  2.  **The Mechanism:** The activity does not explain *how* the correlation happens. It only proves *that* classical local realism cannot explain it. You will need to briefly explain the wavefunction (non-separable state) in the debrief to satisfy their curiosity.
  3.  **Tsirelson's Bound:** The activity shows 85% is possible. It doesn't prove 86% is impossible. You have to state that information-theoretic constraints (like no-signaling) mathematically cap the win rate at $\cos^2(\pi/8)$.

  ### Final Note on Objective #3 (Why 85% isn't arbitrary)

  You asked if you can make them *feel* that 100% is "too much of a good thing."
  **Yes, but only in the debrief.**
  During the discussion, propose a "Super-Box" (a PR Box) that wins 100%.
  Ask: *"If Player 1 outputs 0, and they win 100% of the time, what must Player 2 output if they got Setting 2?"*
  Walk them through the logic: To win 100% on the (2,2) round, Player 2's output must depend on Player 1's Setting. But Player 2 is isolated. Therefore, Player 1's Setting must have instantly influenced Player 2's Output.
  **Conclusion:** 85% is the "speed limit" of correlation. 100% correlation requires a signal. The universe allows spooky correlation, but it forbids spooky communication. That is the precise boundary Bell's theorem exposes.
