answer: |-
  ### Scenario: The Hospital Budget Negotiation

  A Hospital Administrator (Row) and the Head Surgeon (Column) are negotiating the annual departmental budget. The Administrator can propose a **Cost-Cutting Plan (A)**, a **Quality-First Plan (B)**, or a **Moderate Budget (C)**. The Surgeon can choose to **Cooperate (X)** with the administration's proposal or **Resist (Y)** by mobilizing staff opposition. The Administrator gains political capital (4) if they force through a polarized plan against resistance or if the Surgeon cooperates with a Quality-First plan, but gains nothing (0) if they cut costs without a fight (Surgeon takes credit) or if they push Quality-First against resistance (Surgeon demands more). The Moderate plan yields a modest, safe gain (1) regardless of the Surgeon's reaction. The Surgeon prefers to Resist polarized plans to secure resources (2) but prefers to Cooperate with a Moderate plan to maintain stability (2 vs 0).

  ### Payoff Matrix

  Payoffs are listed as (Administrator, Surgeon).

  | | **Cooperate (X)** | **Resist (Y)** |
  | :--- | :---: | :---: |
  | **Cost-Cutting (A)** | 0, 0 | 4, 2 |
  | **Quality-First (B)** | 4, 0 | 0, 2 |
  | **Moderate (C)** | 1, 2 | 1, 0 |

  ***

  ### Demonstration and Analysis

  **(1) Pure-Strategy IESDS (Stall)**
  We first check for strict dominance using only pure strategies.
  *   **Row Player:**
      *   Compare A and B: A is better against Y ($4>0$), B is better against X ($4>0$). Neither dominates.
      *   Compare C and A: C is better against X ($1>0$), A is better against Y ($4>1$). Neither dominates.
      *   Compare C and B: C is better against Y ($1>0$), B is better against X ($4>1$). Neither dominates.
      *   *Result:* No Row strategy is strictly dominated.
  *   **Column Player:**
      *   Compare X and Y: Against A, Y is better ($2>0$). Against B, Y is better ($2>0$). However, against C, X is better ($2>0$).
      *   *Result:* Because X yields a higher payoff against C, X is not strictly dominated by Y. Because Y yields a higher payoff against A and B, Y is not strictly dominated by X.
  *   **Conclusion:** In Round 1, no strategies are eliminated. The procedure stops with all 6 profiles surviving.

  **(2) Mixed-Strategy IESDS (Unraveling)**
  We now allow Row strategies to be dominated by mixed strategies.
  *   **Step 1: Eliminate C.** Consider the mixed strategy $\sigma = 0.5A + 0.5B$.
      *   Expected payoff against X: $0.5(0) + 0.5(4) = 2$.
      *   Expected payoff against Y: $0.5(4) + 0.5(0) = 2$.
      *   Payoff for C against X is 1; against Y is 1.
      *   **Inequality:** $2 > 1$. Since the mix yields 2 against both columns and C yields 1, $\sigma$ strictly dominates C. **Eliminate C.**
  *   **Step 2: Eliminate X.** The game is now reduced to Row {A, B} and Column {X, Y}.
      *   Column payoffs against A: X=0, Y=2.
      *   Column payoffs against B: X=0, Y=2.
      *   **Inequality:** $2 > 0$. Y strictly dominates X in the reduced game. **Eliminate X.**
  *   **Step 3: Eliminate B.** The game is now reduced to Row {A, B} and Column {Y}.
      *   Row payoffs against Y: A=4, B=0.
      *   **Inequality:** $4 > 0$. A strictly dominates B. **Eliminate B.**
  *   **Conclusion:** The unique surviving profile is **(A, Y)**.

  **(3) The Critical Feature**
  You are correct. The mechanism relies entirely on the convexity of the payoff space. Strategies A and B create a "specialized-swap" pattern: $(0, 4)$ and $(4, 0)$. A 50-50 mixture manufactures an expected payoff vector of $(2, 2)$. Strategy C offers a constant payoff vector $(k, k)$. For the mix to *strictly* dominate C, we require $2 > k$.
  *   **If $k=1$:** $2 > 1$ holds. C is eliminated.
  *   **If $k=2$:** $2 > 2$ is false. The mix only *weakly* dominates C. Under strict dominance rules, C survives, and the procedure stalls (as seen in the pure-strategy round).
  *   **If $k=1.5$:** $2 > 1.5$ holds. C is eliminated. However, since your constraint requires integer payoffs for the matrix, $k=1$ is the largest integer that permits the unraveling.

  **(4) Counterfactuals and Collapse**
  *   **Changing $k$ to 2:** If C's payoffs become $(2, 2)$, the 50-50 mix yields 2, which equals C's payoff. Strict dominance fails. The mixed-strategy procedure stalls immediately, just like the pure-strategy procedure. The game retains multiple rationalizable outcomes.
  *   **Changing Column Payoffs:** Suppose we alter the Column payoffs so that X does *not* become dominated after C is eliminated (e.g., change Column's payoff at (A, X) from 0 to 3). After C is removed, Column compares X (3 against A, 0 against B) vs Y (2 against A, 2 against B). Neither dominates the other. The procedure would eliminate C, but then stall at the 2x2 stage. It would not collapse to a single profile, demonstrating that the "unraveling" depends on the specific interdependence of Row's elimination enabling Column's elimination.

  **(5) Skeptic Objection and Reply**
  *   **Objection:** A skeptic might argue that in a one-shot game without an observable randomization device, a player cannot actually "play" a mixed strategy. Therefore, eliminating a pure strategy (C) because a *hypothetical* lottery over other strategies (A and B) beats it is ontologically dubious. The Administrator cannot literally flip a coin to decide between Cost-Cutting and Quality-First; they must choose one. If they must choose one, C might be a best response to some belief about the Surgeon (e.g., if the Administrator is 90% sure the Surgeon will Cooperate, C yields 1 while A yields 0.1).
  *   **Reply:** The justification for mixed-strategy dominance in IESDS is not that the player *randomizes*, but that the strategy is never a *best response* to any coherent belief. If a strategy is strictly dominated by a mix, there exists no probability distribution over the opponent's strategies for which the dominated strategy maximizes expected utility. Rationality implies players maximize expected utility given their beliefs. Since C is never a best response to any belief the Administrator could hold about the Surgeon, a rational Administrator will not play C. The mixed strategy is merely the mathematical certificate proving C is inferior, not a prescription for behavior.
