  After the scenario (one paragraph) and the matrix, please do the demonstration: (1) run the pure-only procedure and show explicitly that no strategy is strictly dominated by a pure strategy in round 1, so it stops with 6 profiles; (2) run the mixed procedure step by step, writing out the inequality showing the 50-50 mix beats C against both X and Y, then the inequality for X becoming dominated after C is gone, then the final elimination of B; (3) tell me which feature of the payoff matrix is doing the work — I think it is that C's payoff is (k,k) while A and B are (0,4) and (4,0), so the mix manufactures (2,2) and only beats C if k < 2, but say if I'm wrong; (4) say what happens if that feature is removed, e.g., if C's payoff is changed to (2,2) or if column X does not become dominated after C is eliminated, and whether the case then collapses back into a standard pure-dominance example or stalls; and (5) give the best objection a skeptic who thinks only pure-strategy dominance is legitimate would make against using the mixed move here, and how you'd reply to it.

  Don't give me a bibliography or citations; I just need the worked case. Thanks!
