      *   *The Relational Equality Grads (The Allies/Skeptics):* They worry about "muddying the waters." They want to know if "status" is doing the work or if it's just outcomes.
          *   *Phrasing:* Focus on "expressive harm," "social meaning," "conceptual clarity."
          *   *Damage:* Medium. They are friendly but need conceptual precision.

      *   *The Poli Sci Scholar (The Institutionalists):* They will ask about *who* decides the rules. Democratic legitimacy vs. Moral Truth.
          *   *Phrasing:* Focus on "authority," "procedure vs. substance," "who designs the system."
          *   *Damage:* Medium. Important for the "institutional" part of the thesis.

      *   *The Roommate's Point (The Collapse Objection):* Democratic Proceduralism.
          *   *Damage:* High. This is the "Prayer Question."

  4.  **Ordering by Damage:**
