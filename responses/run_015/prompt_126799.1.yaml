      *(Refining the "Prayer Question")*: The prompt suggests the user is already worried about Prioritarianism/Democratic Proceduralism. I should make the "Prayer Question" the specific formulation of that fear that is hardest to answer. Let's go with the "Metric of Subordination" problem.

