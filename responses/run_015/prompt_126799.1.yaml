      *   *Weakness:* Risks losing the "individualist" constraint that makes Scanlon distinct from utilitarianism. Risks collapsing into rule-utilitarianism or pure democratic proceduralism. Scanlon explicitly focuses on *individual* reasons for rejection. Shifting to *systems* might violate the "generic reasons" constraint.

  3.  **Drafting the Objections (Audience Specific):**

      *   *The Scanlonians (The Purists):* They will attack the move from individual claims to systemic rules. They'll say this violates the "individualist restriction."
          *   *Phrasing:* Needs to sound like they know the text (*What We Owe to Each Other*). Focus on "generic reasons" and "individual standpoints."
          *   *Damage:* High. If this isn't Scanlonian, the project fails.

      *   *The Consequentialist (The Skeptic):* They will say this is just rule-utilitarianism with extra steps.
          *   *Phrasing:* Focus on "smuggling in the sum," "outcome sensitivity."
