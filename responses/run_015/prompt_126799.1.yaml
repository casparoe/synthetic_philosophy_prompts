answer: |-
  # Q&A Prep Sheet: Procedural Relationalism & Scanlonian Aggregation

  **Strategic Concessions (Say this in your opening or first reply):**
  1.  **Exegetical Honesty:** Concede immediately that Scanlon's text emphasizes individual acts and specific claims. Frame your project as *reconstructive* or *systematizing* for non-ideal theory, not pure exegesis. If you claim Scanlon "meant" this, the two dissertation writers will eat you alive.
  2.  **The Aggregation Limit:** Concede that your view *does* allow some aggregation, but insist it is *constrained* aggregation. You are not summing welfare; you are summing *claims to non-subordination*.
  3.  **Institutional Dependency:** Admit that your view requires a background of just institutions to work. It doesn't solve the "who guards the guardians" problem alone.

  ---

  ### 1. The "Individualist Restriction" Objection (The Scanlonians)
  **Damage Level:** Critical. If this sticks, you aren't doing contractualism.
  **Who:** The two dissertation writers.
  **The Objection:** "Scanlon's individualist restriction is the core of the view. We assess principles by asking if a *particular* person has a generic reason to reject them based on their *own* standpoint. By shifting the site of evaluation to 'institutional rule-systems,' you are allowing the burdens on Person A to be outweighed by the benefits to Persons B through the back door. You've effectively dissolved the individual constraint into a systemic calculus. How is this not just a violation of the separateness of persons?"

  **The 2-Minute Reply:**
  "The individualist restriction is preserved, but we have to be precise about *what* the individual is rejecting. In my view, the individual isn't rejecting a specific burden (e.g., 'I lose $500'). They are rejecting a *status* (e.g., 'I am the kind of person whose interests are systematically discounted to serve the majority').
  When we evaluate the rule-system, we aren't summing welfare. We are asking: 'Does this rule assign me a structural role of subordination?' If a rule saves five lives by killing one innocent, the one innocent has a generic reason to reject the *rule* because it treats them as expendable. If a rule saves five lives by imposing a minor tax on everyone, no one has a generic reason to reject it because no one's status is subordinate. The aggregation happens at the level of *rule feasibility*, but the veto power remains at the level of *individual relational status*. The separateness of persons is protected because no one can be told their standing is worth less than another's."

  **Weakest Point:**
  You are relying heavily on the distinction between "burden" and "status." The Scanlonians will press you on hard cases where a burden *constitutes* subordination (e.g., severe disability accommodations vs. aggregate cost). If the cost to the system is high enough, does the disabled person's claim still veto? If yes, you're rigid Scanlonian. If no, you've allowed aggregation based on cost, which looks like the "systemic calculus" they accused you of.

  ### 2. The "Collapse into Democratic Proceduralism" Objection (The Roommate/Poli Sci)
  **Damage Level:** High. Threatens the philosophical novelty of the project.
  **Who:** The Visiting Scholar (and your roommate's ghost).
  **The Objection:** "You ground rejectability in 'structural subordination' within a 'social practice.' But who determines what counts as subordination? If it's not an objective moral fact, it seems you need a democratic procedure to decide which rules are legitimate. If it *is* an objective fact, why do we need the contractualist framework at all? It seems your view collapses into a theory of democratic legitimacy: a rule is wrong because it wasn't authorized by equals, not because of the moral reasons themselves."

  **The 2-Minute Reply:**
  "That's a crucial distinction, but I want to separate the *criterion* of rightness from the *procedure* for decision-making. My claim is substantive: a rule is wrong if it establishes a relation of subordination, regardless of whether a democracy voted for it. A democratic vote can still produce a rule that treats a minority as structurally subordinate.
  Contractualism provides the *standard* by which we judge the democratic output. The 'co-authorship' language isn't about actual voting; it's about the hypothetical justification owed to each person. So, while institutional design matters, the moral work is being done by the relational norm (non-subordination), not the procedure itself. Democracy is the best *tool* to approximate this, but it's not the *source* of the norm."

  **Weakest Point:**
  You risk circularity. If "structural subordination" is defined by what free and equal people would reject, and free and equal people are defined by democratic norms, you are close to pure proceduralism. The Poli Sci scholar will ask for a concrete metric of subordination that doesn't rely on hypothetical agreement.

  ### 3. The "Rule-Utilitarianism in Disguise" Objection (The Consequentialist)
  **Damage Level:** Medium-High. Makes your view redundant.
  **Who:** The Hardline Consequentialist.
  **The Objection:** "Let's be honest. You're evaluating rules based on their general acceptance and the distribution of burdens across a population. You're just doing Rule-Utilitarianism but using the word 'status' instead of 'utility.' If the rule that maximizes welfare also happens to minimize feelings of subordination most of the time, your theory is redundant. If they come apart, and you choose the non-subordinating rule even when it tanks welfare, you're fetishizing procedure over human well-being. Why isn't this just smuggling in the math?"

  **The 2-Minute Reply:**
  "The divergence test is where the theories separate. A Rule-Utilitarian accepts a rule that sacrifices one person's fundamental interests if the aggregate gain is high enough. My view prohibits this *in principle*, not because of a calculation, but because of the *reason* offered to the victim.
  To the person being sacrificed, the Utilitarian says: 'Your loss is outweighed.' The Procedural Relationalist says: 'This rule cannot be justified to you because it makes you a means to the social end.' The math is not smuggled in; it's blocked at the door of justification. We care about the *distribution* of the burden, not just the sum. If the burden falls randomly, it might be acceptable. If it falls systematically on one group, it's rejectable. Utilitarianism is indifferent to that pattern as long as the sum is maximized."

  **Weakest Point:**
  The Consequentialist will hit you with "Threshold Deontology." They will argue that even Utilitarians accept side-constraints when stakes are low. They will press you to define the exact threshold where aggregation becomes permissible in your view. If you can't give a number or a principle, they will claim your view is just intuitionism with extra steps.

  ### 4. The "Relational Vagueness" Objection (The Relational Equality Grads)
  **Damage Level:** Medium. Threatens clarity and application.
  **Who:** The Grad Students.
  **The Objection:** "We like the focus on status, but 'structural subordination' feels incredibly vague. Does a tax burden count? A zoning law? A hiring practice? Without a clear account of what constitutes a 'relational harm' versus a mere 'material burden,' this framework is hard to apply. Are you muddying the waters of relational equality by making it the catch-all for every distributive dispute?"

  **The 2-Minute Reply:**
  "I agree clarity is key. The distinction lies in *public justifiability*. A material burden is just a cost. A relational harm occurs when the burden implies a lower moral worth or political standing.
  For example, a progressive tax is a material burden but implies equal civic duty. A policy that requires ID checks only in certain neighborhoods implies those citizens are presumptive criminals. The test is: 'Can this burden be explained to the bearer without implying they matter less?' If the only justification for the burden is 'because your group is the cheapest place to cut costs,' that is relational harm. I'm not trying to solve all distributive justice, but to set the boundary conditions where distribution becomes domination."

  **Weakest Point:**
  This is the hardest line to hold in practice. Many material burdens *do* signal lower status (e.g., cutting disability benefits). You might be forced to concede that material and relational harms are inseparable, which complicates your "rule-system" focus.

  ---

  ### The "Prayer Question" (The One You Hope They Don't Ask)
  **Damage Level:** Fatal if mishandled.
  **The Question:** "If the core of your view is preventing 'structural subordination' determined by what cannot be reasonably rejected by individuals within a system... how is this distinct from **Prioritarianism** (giving weight to the worst off) or **Democratic Proceduralism** (whatever the process decides)? If a Prioritarian says 'we weight the burdens of the vulnerable more heavily' and you say 'we reject rules that subordinate the vulnerable,' aren't you just describing the same outcome with different vocabulary? What work is 'contractualism' actually doing here?"

  **Why this hurts:**
  It attacks the *identity* of your theory. If you can't distinguish your view from Prioritarianism (a consequentialist cousin) or Proceduralism (a political cousin), you haven't added value to moral philosophy.

  **Emergency Reply Strategy:**
  1.  **Distinguish from Prioritarianism:** Prioritarianism aggregates. It says "Weight the poor's interests *more* in the sum." You say "Do not put them in the sum if it violates their status." Prioritarianism can still sacrifice the worst-off if the aggregate is high enough (just needs a higher threshold). You cannot.
  2.  **Distinguish from Proceduralism:** Proceduralism says "If the vote was fair, the outcome is just." You say "A fair vote can produce an unjust rule if it subordinates a minority."
  3.  **The "Work" Contractualism Does:** It provides the *language of justification*. It's not about the outcome (distribution); it's about the *reason* (reciprocity). It explains *why* we prioritize the worst off (because they are vulnerable to subordination), not just *that* we do.

  **Honest Note on Weakness:**
  This is your soft spot. In non-ideal theory, the outcomes of your view and Prioritarianism will overlap 90% of the time. You need to be comfortable saying: "The overlap is high, but the *justification* determines how we handle the 10% divergence, specifically in cases of rights violations vs. resource allocation."
