      3.  **The "Rule-Utilitarianism in Disguise" Objection (Consequentialist):** If the output is the same, why bother?
      4.  **The "Relational Vagueness" Objection (Relational Grads):** Is "structural subordination" just a buzzword?

  5.  **Drafting the Content (Iterative refinement):**

      *   *Concession:* Need to admit Scanlon focuses on individuals. The move is *reconstructive*, not exegetical.
      *   *Reply Strategy:* Distinguish between the *site* of evaluation (rules) and the *currency* of rejection (individual status).
