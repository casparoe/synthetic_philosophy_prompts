      *   (3) implies we *do* act on low $p$, high $L$. This seems to contradict (2) unless the threshold is per-person vs. aggregate, or unless the nature of the risk (existential) changes the calculus.
      *   *Tension:* (2) says ignore $10^{-6}$ per person. (3) says act on asteroid risk (which might be $< 10^{-6}$ per year per person, but threatens everyone).
      *   *Resolution Hypothesis:* The threshold in (2) is often applied to *individual* risk in regulatory impact analysis (RIA), whereas (3) involves *collective* existential risk where the "de minimis" logic might be overridden by "precautionary" logic or distinct budgetary silos. Or, the practice is inconsistent.
      *   *Reconstruction Goal:* Find a theory that makes sense of this apparent inconsistency.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. The practice isn't a single axiomatic system but a "reflective equilibrium" of competing heuristics.

      *   **1. Reconstruct the Implicit Theory:**
          *   Is it anti-fanaticism? Yes, effectively. Pure EV would force us to fund the stranger (Pascal's Mugging) if the stake is high enough.
