answer: |-
  The pattern you describe is not a single decision theory but a **layered administrative heuristic**. It attempts to reconcile the efficiency of cost-benefit analysis (CBA) with the political necessity of ignoring trivialities and the sovereign duty to prevent catastrophe. To reconstruct it as a unified theory requires imposing a structure that the practice itself often treats as separate silos.

  Here is the reconstruction of the implicit decision theory, addressing your six points.

  ### 1. Reconstruct the Implicit Theory
  The practice strictly presupposes **anti-fanaticism**. It is not compatible with plain expected-value (EV) maximisation, even with empirical constraints.

  Plain EV maximisation implies that for any cost $C$, there exists a stake $S$ and probability $p$ such that $p \cdot S > C$. Feature (2) explicitly violates this: it sets a probability floor $\epsilon$ (e.g., $10^{-6}$) below which $p \cdot S$ is treated as 0, regardless of $S$. If the practice were consistent with EV, a risk of $10^{-9}$ per person affecting $10^9$ people (1 expected death) would be treated identically to a risk of $10^{-6}$ affecting $10^6$ people. Feature (2) says the former is negligible; Feature (1) says the latter is calculable.

  Therefore, the implicit theory is **Truncated Expected Utility with Lexical Exceptions**.
  *   **Domain A (Routine Regulation):** Bounded EV. Risks below $\epsilon$ are zeroed out. Benefits are linear (VSL).
  *   **Domain B (Existential/Security):** Lexical Priority. Risks threatening the "state" or "civilisation" bypass the $\epsilon$ threshold and the linear VSL accounting.

  This is not merely "EV plus empirical claims." An empirical claim might say "the probability is actually zero," but Feature (3) admits the probabilities are non-zero (asteroids, pandemics). The refusal to fund the stranger (Pascal's Mugging) despite non-zero credence confirms that the rejection is structural, not empirical. The theory requires that the utility function or the probability weighting function is non-linear in a way that suppresses extreme tails in routine contexts but activates them in sovereign contexts.

  ### 2. The Evidential Defence
  The distinction between model-based probabilities and bare assertions is the primary practical firewall, but it fails as a theoretical defence against fanaticism.

  *   **The Distinction:** Regulatory agencies operate under mandates requiring "substantial evidence." A probability derived from orbital mechanics (asteroids) is actionable; a probability derived from a stranger's assertion is not. This allows the agency to assign $p=0$ to the stranger for administrative purposes.
  *   **Model Averaging:** You correctly identify the flaw. A careful agent assigns some credence to the possibility that their model class is incomplete. If we average over models, and one model (however outlandish) assigns non-zero probability to the stranger's claim, the EV explodes.
  *   **Relocation:** The evidential defence merely relocates the problem to the **prior**. To stop the explosion, the regulator must assign a prior of exactly zero to hypotheses lacking a mechanistic model. This is dogmatism, not Bayesian updating.
  *   **Verdict:** The defence saves the *bureaucracy* (which needs audit trails) but does not save the *decision theory*. It explains why agencies ignore the stranger, but it does not justify why a rational agent *should* ignore him if the stakes are truly infinite. The practice relies on the evidential defence to mask the underlying anti-fanatical structure.

  ### 3. The Structural Objection
  The structural objection is the strongest justification for the thresholds. If the utility function is unbounded and the probability distribution has heavy tails (or allows for arbitrary stakes), **no optimal policy exists**.

  *   **The Regress:** For any policy $X$, there is a policy $Y$ with lower probability and higher stake such that $EV(Y) > EV(X)$. If the state attempts to maximize EV without bounds, it enters an infinite loop of prioritizing ever-more-speculative, higher-stakes interventions. Budgets collapse because every dollar is better spent on the "biggest" long shot.
  *   **Real Work:** The thresholds are not squeamishness; they are **regularization conditions**. They ensure the optimization problem is well-posed. By imposing a hard floor on probability (Feature 2) or a cap on value (bounded utility), the state ensures a maximum exists.
  *   **Falling Probabilities:** In the physical world, probabilities of specific events generally fall exponentially with complexity, while stakes (lives lost) scale linearly or polynomially. In that specific domain, EV converges. But in the logical domain (Pascal's Mugging), stakes can scale faster than probabilities fall. The thresholds are necessary to protect against the logical domain invading the physical budget.

  ### 4. A Specific Anti-Fanatical Rule
  Consider the rule: Fund only if $p > k / f(V)$, where $f(V)$ grows slower than $V$ (e.g., $f(V) = \sqrt{V}$).
  *   **Does it reproduce (1)?** For small $V$ (ordinary VSL cases), $\sqrt{V}$ is small. The required $p$ is low. The linear approximation holds roughly well for routine regulation.
  *   **Does it reproduce (2)?** Yes, it establishes a probability floor that rises as stakes fall. For very small stakes, $p$ must be high.
  *   **Does it reproduce (3)?** For existential stakes ($V \to \infty$), the required $p \to 0$. This allows funding for asteroids.
  *   **The Stranger:** If $V$ is astronomical ($10^{100}$), the required $p$ becomes vanishingly small ($10^{-50}$). If the stranger can posit a stake large enough, he clears the bar. **This rule fails to block fanaticism.** To block the stranger, $f(V)$ must grow *at least* as fast as $V$ (which kills EV maximization) or Utility must be bounded.
  *   **Principled or Fitted?** This rule is a curve fit. The actual practice looks more like a **discontinuous step function**:
      *   If Risk $\in$ Routine: Hard probability floor ($10^{-6}$).
      *   If Risk $\in$ Existential: No floor, but strict evidentiary requirements.
      *   This is not a smooth mathematical principle; it is a categorical distinction between "regulatory risk" and "sovereign risk."

  ### 5. What Would Have to Change
  *   **The Fanatic Government:** If the state adopted pure EV maximization, regulatory analysis would collapse into **speculative arbitrage**.
      *   *Budget:* Every budget would be diverted to the intervention with the highest $p \times V$. Since $V$ (future lives) can be inflated indefinitely by extending the timeline or positing digital minds, all current consumption would cease.
      *   *Competition:* When two long shots compete (e.g., asteroid deflection vs. AI alignment), the state would fund whichever posits the larger stake. This incentivizes **stake inflation**—agencies would exaggerate the catastrophic potential of their domain to secure funding.
  *   **The Bounded-Value Government:** If the state placed an upper bound on the value of the future (e.g., "we value at most 1 billion future lives"):
      *   *Feature (3) Survival:* Asteroid detection survives only if framed as **insurance against ruin**. It is not justified by $p \times V$ (since $V$ is capped), but by **risk aversion** (concave utility).
      *   *Weaker Arguments:* Yes, the arguments become weaker. Insurance premiums are typically small fractions of the stake. If the stake is bounded, the premium for existential risk drops. Pandemic preparedness would have to be argued as protecting *current* economic capacity (Feature 1) rather than saving the *future* (Feature 3). The "shape of everything that comes after" would be explicitly excluded from the calculus.

  ### 6. Where is the Practice Underdetermined?
  A bounded-value theorist and a probability-threshold theorist can both endorse Features (1)-(3) in routine cases, but they diverge on **Longtermist Interventions**.

  *   **The Test Case:**
      *   *Programme A:* \$50M, reduces civilizational collapse this century by $10^{-4}$. (Stake: $\approx 10^{10}$ lives). $EV \approx 10^6$ lives.
      *   *Programme B:* \$50M, $10^{-9}$ chance of securing $10^{18}$ future lives. $EV \approx 10^9$ lives.
  *   **The Practice:** Current regulatory practice (Feature 2) would likely reject Programme B. A probability of $10^{-9}$ is below the de minimis threshold for *individual* risk, and without a clear mechanistic model (Feature 2/Evidential), it is treated as speculation. Programme A is treated as "safety" or "security" (Feature 3).
  *   **The Divergence:**
      *   *Probability-Threshold Theorist:* Rejects B because $10^{-9} < \epsilon$.
      *   *Bounded-Value Theorist:* Rejects B because the value of $10^{18}$ lives is capped (discounted heavily or bounded), making $EV(B) < EV(A)$.
      *   *Pure EV (Fanatic):* Chooses B.
  *   **Underdetermination:** The practice does not currently have a formal mechanism to distinguish between "existential risk to current population" (A) and "existential risk to potential future population" (B). It treats A as Sovereign Risk (Feature 3) and B as Speculation (Feature 2).
  *   **Should it?** If the practice is to remain consistent, it must decide whether the "Lexical Priority" of Feature (3) applies to *potential* lives or only *existing* constituents. Currently, it implicitly favors existing constituents (temporal discounting). A principled reconstruction would require admitting that Feature (3) is not about "lives saved" but about **continuity of the decision-making agent itself** (the State). Programme A threatens the State; Programme B threatens a hypothetical future. The practice is consistent only if the object of value is the *State's continuity*, not the *sum of human welfare*.

  ### Summary of the Reconstruction
  The implicit theory is **Sovereign Continuity Maximisation subject to Administrative Constraints**.

  1.  **Objective:** Ensure the survival and functioning of the political order (The State).
  2.  **Constraint 1 (Efficiency):** Use linear VSL for routine allocation to prevent waste (Feature 1).
  3.  **Constraint 2 (Noise):** Ignore probabilities below $\epsilon$ to prevent administrative paralysis and frivolous claims (Feature 2).
  4.  **Exception (Survival):** Suspend Constraints 1 & 2 when the threat targets the Sovereign's continuity itself (Feature 3).

  This explains why we ignore the stranger (he threatens individuals, not the State's continuity, and lacks evidence) but fund asteroid detection (threatens the State's continuity, has evidence). It is not a universal moral theory; it is a **theory of statecraft**.
