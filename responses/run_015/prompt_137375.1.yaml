      *Refining the "Evidential Defence":* The key is that regulatory agencies operate under a mandate of *actionable* knowledge. A probability without a mechanism is not a "risk" in the administrative sense, it's a "speculation." This is a semantic/mandate boundary, not a decision-theoretic one. I need to highlight this.

      *Refining the "Underdetermination":* The test case provided in (6) is the crux. Current regulation (e.g., EPA, OSHA) would likely fund A. Longtermist EV would fund B. This shows the practice is *not* pure EV. It is *temporally discounted* EV or *bounded* EV.

