          2.  *De Minimis Threshold:* Risks below a certain probability (e.g., $10^{-6}$) per person are ignored, even if aggregate expected deaths are non-negligible.
          3.  *Existential/Catastrophic Spending:* Governments *do* spend on low-probability, high-stakes risks (asteroids, pandemics, nuclear security).
      *   **The Counter-Example (Pascal's Mugging):** A stranger threatens astronomical torture unless paid. We reject this, despite non-zero credence $\times$ huge stake $>$ cost.
      *   **The Concept:** "Fanaticism" = Expected Value (EV) maximization without bounds/thresholds.
      *   **The Questions:**
          1.  Reconstruct the implicit theory (Anti-fanaticism vs. EV + empirical constraints).
          2.  The Evidential Defence (Model-based vs. bare assertion probabilities; model averaging).
          3.  The Structural Objection (Unbounded stakes vs. falling probabilities; regress).
          4.  Specific Anti-Fanatical Rule (e.g., $p > k/\sqrt{V}$). Does it fit features (1)-(3)? Is it principled?
