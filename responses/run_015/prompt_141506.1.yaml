answer: |-
  ### 1. The Essay Question

  **Exam Question 3 (Value Theory Seminar)**
  **Time Allocation:** 45 Minutes
  **Instructions:** Closed book. No citations required. Answer in your own words.

  **The Heterogeneity Problem and the One-Lever Requirement**

  Classical hedonism claims that pleasure is the sole intrinsic good. To function as a guide for action (and for utilitarian aggregation), hedonism must satisfy **The One-Lever Requirement**. This means hedonism must provide a single scale such that:
  (a) **Comparability:** Any two experiences can be ranked as better, worse, or equal.
  (b) **Common Unit:** There is a single property ("pleasure") measured in a common unit across all experiences.
  (c) **Hedonic Fixity:** The ranking is fixed entirely by the hedonic facts of the experiences, not by external moral or aesthetic judgments.

  The "heterogeneity problem" suggests that pleasures are too different to satisfy this requirement. In your seminar, you have considered Mill's distinction between quality and quantity, as well as recent debates on whether pleasure is a distinct feeling or an attitude toward experience.

  **Consider the following two cases:**

  *   **Case 1 (The Swap):** Priya solves a difficult mathematical proof. For her, this experience has the exact felt bodily character of an itch-scratch (a tingle, warmth, located relief). Conversely, when Priya scratches an itch, the experience has the quiet, featureless "yes, go on" character that solving a proof normally has for others. The *felt quality* and the *activity type* have swapped.
  *   **Case 2 (The Split Judges):** Two individuals have lived identical lives in terms of physical events, but one lived it primarily as an athlete and one as a scholar. Both have now experienced both modes of life extensively. They disagree stably about which life contained more total pleasure. Neither is mistaken, distracted, or self-deceived. There is no further evidence available to settle the dispute.

  **The Task:**
  Write an essay that addresses the following:
  1.  Diagnose precisely which part of **The One-Lever Requirement** (a, b, or c) is threatened by Case 1 and which is threatened by Case 2.
  2.  Explain why Mill's appeal to "quality" fails to resolve Case 1 without violating condition (c).
  3.  Take a stand: Can hedonism survive these cases? If yes, what definition of "pleasure" must be adopted (e.g., sensory, attitudinal, functional), and what specific theoretical cost does this impose on the view? If no, explain why the theory collapses.

  ***

  ### 2. Model Answer (Approx. 700 words)

  The heterogeneity problem is not merely that pleasures feel different; it is that they may lack the common metric required for hedonism to function as a normative theory. To evaluate this, we must test the pleasures against the One-Lever Requirement. Case 1 threatens condition (b), the Common Unit. Case 2 threatens condition (c), Hedonic Fixity. A hedonist can survive these challenges, but only by abandoning the claim that pleasure is a distinct, introspectively obvious sensation, thereby losing the theory's initial intuitive appeal.

  In Case 1 (The Swap), Priya's intellectual achievement carries the phenomenology of a bodily itch-scratch, while the bodily itch carries the phenomenology of intellectual absorption. If the hedonist claims the proof is more valuable because it is a "higher" pleasure, they must explain why. If they say it is because of the *felt quality*, they are forced to admit the itch-scratch (which now has the proof's quiet character) is the higher pleasure. This is absurd. If they say it is because of the *activity* (math is better than scratching), they have abandoned condition (c). The ranking is no longer fixed by hedonic facts alone but by external judgments about the worth of mathematics. Mill's move to distinguish quality from quantity attempts to save this by suggesting competent judges prefer the higher source regardless of feeling. However, Case 1 shows this is circular. If the "quality" tracks the activity type rather than the feeling, then "pleasure" is no longer the common unit doing the work; the value is coming from the activity itself. Hedonism risks collapsing into a perfectionist or desire-satisfaction theory wearing a hedonic mask.

  To save the Common Unit (b) in Case 1, the hedonist must argue that pleasure is not a specific sensory tone (like a tingle or warmth) but a pro-attitude taken toward the experience. On this "attitudinal" view, Priya enjoys the proof not because it tingles, but because she is pleased *that* she is solving it. This allows the sensory feel to vary while the "pleasure" (the attitude) remains the common unit. However, this comes at a cost. It severs the link between goodness and immediate phenomenology. If pleasure is an attitude, it is possible to be in pain but pleased about it (masochism), or in sensory delight but unpleased (boredom). The "evident from the inside" attraction of hedonism—that we know pleasure is good simply by feeling it—drains away.

  Case 2 (The Split Judges) attacks Hedonic Fixity (c). If two competent judges disagree about which life had more pleasure, and neither is in error, there is no objective fact of the matter about the "amount" of pleasure. This suggests pleasure is not a natural quantity like weight or length, which exist independently of our judgments. If there is no fact of the matter, condition (a) Comparability fails for utilitarian aggregation. We cannot sum pleasures if the unit of measurement is relative to the judge.

  The hedonist has two responses here. First, they can posit a hidden, objective hedonic fact that the judges are missing. But this makes the theory epistemologically idle; if we can never access the true unit, it cannot guide action. Second, they can accept relativism: pleasure is real, but its quantity is relative to the subject's standpoint. This saves the theory from falsification but destroys its use for interpersonal comparison. Utilitarianism requires comparing *my* pleasure to *yours*. If the "unit" of pleasure is relative to the judge's perspective, we cannot place them on the same scale.

  Therefore, hedonism survives only by transforming into Attitudinal Hedonism. This solves Case 1 by making the common unit a functional role (being wanted/enjoyed) rather than a sensory feel. However, to handle Case 2, it must concede that "amount of pleasure" is not a hard natural fact but depends on the agent's own endorsement. The cost is significant: the theory loses its claim to be a simple, objective calculus of felt good. It becomes a theory about the satisfaction of subjective attitudes. This is a coherent position, but it is no longer the simple empiricist hedonism of Bentham. It survives the heterogeneity problem by ceasing to be a theory about a specific *feeling* and becoming a theory about *valuing*.

  ***

  ### 3. Marking Scheme (Out of 20)

  **A-Range (16–20)** vs. **B-Range (11–15)**
  *   **B-Range:** Identifies that Mill's quality distinction is circular or insufficient. Correctly maps the cases to the One-Lever Requirement clauses. Concludes hedonism has a problem.
  *   **A-Range:** Explicitly identifies the *theoretical modification* required to save hedonism (e.g., shifting from sensory to attitudinal/functional definition) and articulates the specific *cost* of that move (loss of phenomenological immediacy or loss of interpersonal comparability).

  **Five Must-Hit Points:**

  1.  **Diagnosis of Case 1 (4 marks):** Identifies that The Swap threatens the **Common Unit (b)**. Explains that if value tracks activity rather than feel, the "hedonic" unit is empty.
      *   *Common Error:* Treating Case 1 as just an example of "different feelings" without noting the decoupling of value from phenomenology.
  2.  **Diagnosis of Case 2 (4 marks):** Identifies that Split Judges threatens **Hedonic Fixity (c)** or **Comparability (a)**. Explains that disagreement without error implies no objective fact of the matter.
      *   *Common Error:* Claiming one judge must be wrong, ignoring the "no identifiable error" constraint in the prompt.
  3.  **Critique of Mill (4 marks):** Explains why appealing to "quality" violates condition (c) (Hedonic Fixity). Shows that ranking by source/activity imports non-hedonic values.
      *   *Common Error:* Parroting Mill's "competent judge" line without explaining why it fails the One-Lever definition provided.
  4.  **Proposed Solution (4 marks):** Commits to a specific definition of pleasure to save the theory (e.g., Attitudinal Hedonism or Functionalism).
      *   *Common Error:* Remaining agnostic ("Hedonists might say...") rather than taking the stand requested in the prompt.
  5.  **Articulation of Cost (4 marks):** Clearly states what is lost by adopting the solution (e.g., pleasure is no longer a distinct sensation, or interpersonal comparison becomes impossible).
      *   *Common Error:* Claiming the solution saves the theory "without cost" or failing to connect the cost back to the initial appeal of hedonism.

  ***

  ### 4. Instructor Notes

  **Flagged External Concepts in Model Answer:**
  *   **"Attitudinal Hedonism" / "Pro-attitude":** The model answer assumes students can grasp the distinction between *sensory* hedonism (pleasure is a feeling) and *attitudinal* hedonism (pleasure is enjoying/being pleased that). If your seminar focused strictly on sensory papers (e.g., Kagan vs. Feldman), you may need to ensure the "attitude" concept was covered. If not, replace "attitudinal" with "functional role" in the prompt instructions.
  *   **"Epistemologically idle":** This is a slight technical flourish. Students can get full marks for saying "we can't know the true amount" instead.

  **One-Line Hint for the Board:**
  *"Don't just say pleasures are different; ask what breaks the measuring scale."*
