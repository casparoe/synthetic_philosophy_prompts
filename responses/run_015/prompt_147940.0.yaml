answer: |-
  ### The reconstructed theory

  The reconstructed theory posits leisure as a hybrid concept serving three conflicting masters, revealing no single ontological status for rest. First, as **negative liberty**, rest is a sovereign sphere where employer authority terminates, exemplified by hour caps and disconnect rights. Here, time is a boundary of autonomy, a space the boss cannot invade. This treats leisure as protected negative space, defined solely by the absence of labor command. Second, as a **welfare good**, rest is biological maintenance; the *karoshi* threshold treats the worker's body as a machine subject to fatigue curves, where harm is a probabilistic function of exposure rather than a direct rights violation. Third, as **recoverable labor-power**, leisure is merely the recharging period necessary for future production, instrumentalized by the state for economic continuity. Finally, the waiver option introduces a **commodification** layer, framing time as private property the worker may alienate for premium pay. This implicit theory refuses to categorize leisure as either inherently valuable or purely instrumental. Instead, it oscillates between treating the worker as a rights-bearing citizen, a biological risk pool, and a rational economic agent maximizing utility. The Protestant ethic lurks beneath, morally penalizing the very leisure the law protects, suggesting the system presupposes work as the primary locus of virtue, with rest merely a tolerated concession to physical limits or legal compliance. This creates a fragmented subject: legally protected, biologically monitored, economically incentivized to overwork, and culturally shamed for resting.

  ### Coherence and tension

  These parts rely on rival philosophical commitments rather than a consistent view, creating a system that is philosophically underdetermined. The negative liberty model is deontological: rest is protected regardless of consequences or consent. The *karoshi* threshold is consequentialist and actuarial: harm matters only when statistical probability crosses a line of insurability. These clash fundamentally. One forbids invasion; the other manages risk exposure. Similarly, the waiver option presupposes libertarian autonomy—that individuals own their time absolutely—while hour caps presuppose paternalism—that individuals cannot consent to their own exploitation even for higher pay. The law avoids defining the *good* of leisure to accommodate conflicting stakeholders. Is it freedom? Health? Efficiency? By leaving this undefined, the system maintains industrial peace rather than logical consistency. Unions seek caps, employers seek flexibility, and insurers seek actuarial clarity. This creates a zone of contradiction where a worker is simultaneously protected from overwork, incentivized to sell their protection, and morally judged for not working. The coherence is purely pragmatic, allowing rival theories to coexist in separate regulatory silos without resolving the underlying tension between rights and markets.

  ### Strict presupposition vs. compatibility

  Strictly speaking, the practices are incompatible under a single rigorous theory. If leisure is an inalienable human right, it cannot be waived for money; the buyout option logically negates the right's inalienability. If overwork is a rights breach, the statistical causation model is irrelevant; consent should not validate harm. The current system survives only by treating these as separate regulatory domains rather than unified principles. The *karoshi* logic presupposes a probabilistic view of harm that clashes with the intentionalist framing of labor contracts, where voluntary agreement validates risk. You cannot hold that overtime is inherently dangerous (requiring caps) and simultaneously safe enough to be sold (waivers) without contradicting the underlying assessment of danger. The practice is not built on strict presuppositions but on overlapping jurisdictions that ignore each other's philosophical foundations. It assumes compatibility where there is only coexistence, relying on the worker to navigate the contradiction between being a protected subject and a commercial agent.

  ### What unified reform looks like

  A genuinely unified policy must choose a foundational good and eliminate the contradictions. If leisure is non-instrumental human flourishing, overtime exemptions must be killed and waivers banned; rest becomes a status condition, not a negotiable term. If the goal is health protection, the statistical causation model must drop in favor of precautionary limits that recognize fatigue before epidemiological thresholds are met. A rights-based unification would redefine leisure as non-instrumental, removing the moral stigma of idleness and forbidding its commodification. This would require abolishing the buyout premium, as one cannot sell a right that defines one's humanity. Alternatively, a purely market-based unification would remove caps entirely, treating harm as a tort issue. But to resolve the current tension, the law must stop treating rest as both a shield and a commodity. It must declare time sovereign, not sellable. This means ending the probabilistic assessment of death and recognizing overwork as a structural violation, not a statistical anomaly.
