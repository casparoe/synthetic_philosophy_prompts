  ***

  # ADVERSARIAL COLLABORATION: PROVENANCE AND VALUE IN ART AND SOFTWARE

  ## 1. Agreed Claims
  *Both parties sign the following claims. They are stated to be non-vacuous and to avoid begging the question at issue.*

  1.  **Physical Constraint:** The physical properties of an object (or the bit-structure of a file) constrain the range of possible perceptual experiences it can afford.
  2.  **Market Reality:** Provenance documentation (signatures, certificates, chain of custody) causally affects the market price and institutional placement of an object, regardless of its physical properties.
  3.  **Deception Harms:** If a viewer is deceived about the origin of a work (e.g., a forgery sold as an original), their trust is violated, and their subsequent engagement is negatively altered upon discovery.
  4.  **Multiplicity:** Some art forms (e.g., etching, bronze casting, video) are ontologically multiple, meaning more than one physical object can count as an instance of the same work.
  5.  **Attention Modulation:** Knowledge of an object's history can alter where a viewer directs their attention, thereby changing the specific qualitative character of their experience.
  6.  **Competence Variance:** Competent, well-informed viewers may disagree on perceptual details even under good viewing conditions; there is no single "ideal" viewing that exhausts the object.

  ## 2. Disagreements Table
  *Residual disagreements stated neutrally, then in the wording each party accepts.*

  | Neutral Statement | Provenance-First (User) Wording | Experience-First (Friend) Wording |
  | :--- | :--- | :--- |
  | **The Source of Value** | Part of a work's value is constituted by its causal-historical relation to the artist, independent of perceptual uptake. | A work's value is exhausted by the experience it affords; history matters only as a tool to unlock that experience. |
  | **Identity Conditions** | Two physically indistinguishable objects with different histories are numerically different works (or instances) with different values. | If two objects are perceptually indistinguishable to a competent viewer, they function as the same work; any perceived difference is merely learned perception. |
  | **The Role of Provenance** | Provenance is constitutive; without the right causal chain, the object lacks the status of the work (like an unsigned binary). | Provenance is evidential; it signals what kind of experience to expect but does not constitute the work itself. |
  | **The "Look Harder" Claim** | There are genuine differences in value even if no human observer can ever perceptually detect them. | If a difference matters, it must eventually be perceptible; if you learn to see it, it was a perceptual difference all along. |

  ## 3. Cruxes Section
  *Note on Verbal Disputes: Before addressing the cases, we must resolve the ambiguity of the word "Value." We agree to split this into **Aesthetic Merit** (worth looking at/experiencing) and **Artifactal Status** (worth having/protecting/authenticating). The User argues Artifactal Status contributes to Aesthetic Merit. The Friend argues they are separate; Artifactal Status only affects price or curiosity, not Aesthetic Merit. Settling this distinction is a prerequisite for the following cases.*

  ### 3.1 The Silent Swap
  **(a) Sub-question:** Does the destruction of the causal-historical chain diminish the *Aesthetic Merit* of the object, even if the *Experience* remains identical?
  **(b) Concrete Case:** An original painting is destroyed in a fire and replaced overnight with an atom-for-atom duplicate created by a machine. The switch is never discovered. The museum continues to display it; viewers continue to have the same experiences.
  **(c) Predictions:**
  *   **Provenance-First:** The work's Aesthetic Merit has decreased objectively, even if no one knows. The object is now a "hollow shell." *Falsification:* If it is demonstrated that viewers' long-term engagement remains identical over decades without any degradation in critical regard once the truth is (hypothetically) revealed as impossible to know.
  *   **Experience-First:** Nothing of Aesthetic Merit has been lost, only Artifactal Status (historical record). If the experience is identical, the value is identical. *Falsification:* If competent viewers, upon being told the swap *might* have happened (without knowing if it did), report a measurable, permanent degradation in their ability to engage with the work compared to a control group.

  ### 3.2 De-attribution and Re-attribution
  **(a) Sub-question:** When value jumps upon re-attribution, is it because a real property was revealed, or because the viewer's psychology changed?
  **(b) Concrete Case:** A painting is catalogued as a studio copy (low value). It is re-attributed to the master (high value). No physical change occurs. We measure the "value jump."
  **(c) Predictions:**
  *   **Provenance-First:** The jump reflects the recognition of a real property (authenticity) that was present all along. The work *is* different because its history is different. *Falsification:* If blind testing shows that when viewers are told the attribution is random, their reported aesthetic experience correlates perfectly with the physical properties alone, regardless of the true history.
  *   **Experience-First:** The jump is a change in belief that changes what people look for. The "real property" is just the disposition to cause certain experiences in informed viewers. *Falsification:* If viewers who are told the truth but instructed to "ignore it" physically cannot stop experiencing the work differently (proving the history is constitutive of the perception, not just a cue).

  ### 3.3 The Ageing Forgery
  **(a) Sub-question:** Can an object acquire Aesthetic Merit through its own subsequent history that overrides its origin?
  **(b) Concrete Case:** A 1930s forgery of a master is now 100 years old, historically significant for how it influenced art history, and hangs in a museum labelled as "Imitator."
  **(c) Predictions:**
  *   **Provenance-First:** It remains a forgery (lesser Artifactal Status), but may gain *historical* value. It cannot gain the specific Aesthetic Merit of the master's act. *Falsification:* If critics and viewers consistently rate the forgery as aesthetically equal to the master's work *because* of its own history, not despite it.
  *   **Experience-First:** It has acquired its own authenticity as a 1930s object. Its value is now based on what it is (a skilled 1930s painting), not what it isn't (a masterwork). *Falsification:* If the label "Forgery" continues to suppress aesthetic engagement even when the viewer is fully educated on the forgery's own independent historical merit.

  ### 3.4 The Identity of Multiples (Authorised Multiple & Signed Edition)
  **(a) Sub-question:** In multiple-instance works, is the provenance (signature/certificate/number) a legalistic add-on or a constitutive part of the instance's identity?
  **(b) Concrete Case:**
      *   *Sculpture:* 12 authorized casts exist. Cast #1 is lost; a perfect physical duplicate is made from the original mould but without the artist's authorization.
      *   *Video:* 5 cryptographically signed copies exist. File #1 is copied bit-for-bit to a new drive without the key.
  **(c) Predictions:**
  *   **Provenance-First:** The unauthorized cast/file is a different (lesser) instance. The signature/key is not merely legal; it is the mechanism of individuation. *Falsification:* If the art market and critical consensus treat the unauthorized duplicate as fully equivalent to the authorized instances once the physical identity is confirmed.
  *   **Experience-First:** The signature/key is institutional convention (Artifactal Status), not Aesthetic Merit. If the visual/auditory experience is identical, the work is the same. *Falsification:* If viewers report a genuine aesthetic difference (not just anxiety about legality) when viewing the authorized vs. unauthorized instance, even when both are guaranteed to be physically identical.

  ### 3.5 The "Look Harder" Test
  **(a) Sub-question:** Is the claim "if it matters, you can learn to see it" empirically bounded or metaphysically open-ended?
  **(b) Concrete Case:** Two objects (one original, one perfect duplicate) are shown to a group of "expert" viewers. They are told one is a fake. They are given unlimited time and tools (microscopes, spectral analysis) to find the difference.
  **(c) Predictions:**
  *   **Provenance-First:** There may be no perceptual difference to find. The difference is historical, not physical. If experts find nothing, the User still maintains the value difference exists. *Falsification:* If the User concedes that if no physical/perceptual difference exists even in principle, the value difference vanishes.
  *   **Experience-First:** If experts find nothing, there is no aesthetic difference. If they claim to find one, it must be describable in perceptual terms (texture, color, brushwork). *Falsification:* If the Friend concedes that a value difference can persist even if no perceptual difference is found by any human observer under any condition.
