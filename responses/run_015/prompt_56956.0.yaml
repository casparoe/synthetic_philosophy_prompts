          *   *Resolution:* Restrict (8) or adopt a more complex rule (like Field's or Weisberg's modifications).

      *   **Tension D: (6) vs. (2) [The "Implementation" Tension]**
          *   (6) says JC is a fallible implementation of SC.
          *   (2) says JC is *what actually happens*.
