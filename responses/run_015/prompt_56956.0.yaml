      *   **Tension A: (6) vs. (1) & (2) [The "Propositional" Tension]**
          *   (6) claims there is a *single proposition* $E^*$ such that $P_{new}(\cdot) = P_{old}(\cdot | E^*)$.
          *   (1) claims no contingent proposition gets credence 1.
          *   Standard Conditionalization (SC) requires $P_{new}(E^*) = 1$.
          *   If (1) is true, $P_{new}(E^*) < 1$. If $P_{new}(E^*) < 1$, then $P_{new}(\cdot) \neq P_{old}(\cdot | E^*)$ (unless $P_{old}(E^*)=1$ already, which is trivial).
          *   *Severity:* High. This is a fundamental contradiction between Jeffrey's Radical Probabilism and the idea that JC approximates SC.
          *   *Resolution:* Drop (6) or weaken it to a metaphor.

      *   **Tension B: (4) vs. (7) [The "Rigidity vs. Discounting" Tension]**
