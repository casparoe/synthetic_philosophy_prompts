      *   (6) *Total Evidence/Standard Conditionalization (SC) Ideal:* JC is a fallible implementation of $P_{new}(H) = P_{old}(H|E^*)$, where $E^*$ is the "total evidence proposition."
      *   (7) *Discounting/Defeating:* If evidence is known to be distorted (sleep deprivation, bias), discount the shift.
      *   (8) *Order Independence:* Commutativity of updates. $P_{AB} = P_{BA}$.
