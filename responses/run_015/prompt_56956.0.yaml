      *   (2) *Jeffrey Conditioning (JC):* Update via $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$.
      *   (3) *Rigidity:* $P_{new}(H|E_i) = P_{old}(H|E_i)$. The experience changes $P(E_i)$, not the link between $E_i$ and $H$.
