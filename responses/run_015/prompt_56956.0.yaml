          *   If partitions differ, $P_1(H|F_j)$ depends on how $P_1$ distributed mass over $E_i \cap F_j$. JC doesn't specify $P(E_i \cap F_j)$ uniquely without extra assumptions.
          *   Rigidity/Discounting: If I know I'm drunk, $P_{new}(H|E_{teal})$ should not equal $P_{old}(H|E_{teal})$ because $E_{teal}$ is unreliable. To save Rigidity, the partition must be $E_{teal} \& \text{Sober}$, $E_{teal} \& \text{Drunk}$.
