          *   (5) chooses coarse, salient cells. Different salient cells might be chosen at different times or overlap poorly.
          *   If Update 1 is on Partition $\mathcal{E}$ and Update 2 is on Partition $\mathcal{F}$, JC commutes only if $P_{new}(E_i \cap F_j)$ is specified in a way that respects both. Usually, JC does *not* commute across different partitions.
