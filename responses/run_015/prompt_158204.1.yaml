answer: |-
  **Pre-Drafting Analysis: Defining "Collapse"**

  To adjudicate this grant, we must first settle what "collapse" signifies. I propose testing three candidate definitions against the exhibit's specific cases.

  First, *Demographic Extinction*: Collapse means the people vanish. This fails immediately. The Maya did not vanish; their descendants are the museum's neighbors. Easter Islander descendants persist. This definition validates the Indigenous curator's objection entirely but renders the exhibit title factually incorrect for two of three cases. It is unusable.

  Second, *Socio-Political Integration*: Collapse means the loss of central authority, trade networks, and monumental construction. This fits the Bronze Age well (palace economies burned), though it struggles with Egypt (which persisted). It fits the Classic Maya (kingship ended), but risks implying the culture ended. It fits Easter Island only if we ignore post-contact devastation and focus solely on statue production. This definition is structurally sound but risks erasing human continuity if not carefully qualified.

  Third, *Complexity and Trauma*: Collapse is a rapid reduction in socio-economic complexity experienced as catastrophe by contemporaries, without implying the end of the people. This aligns with the "mill town" intuition: the mills (complexity) closed, causing trauma, but the town (people) persisted. This handles the Maya (loss of city-states, not people), the Bronze Age (loss of palaces, regional variation), and Easter Island (shift in resource use, followed by external shock). It preserves the urgency the Director needs while respecting the Curator's concern. I will proceed with this third definition.

  ***

  **DECISION MEMO**

  **TO:** Program Committee, State Humanities Council
  **FROM:** [Your Name], Historical Philosophy Consultant
  **DATE:** October 26, 2023
  **SUBJECT:** Grant Recommendation: "When Civilizations Fail"

  **Bottom Line Recommendation**
  I recommend **Award with Conditions**. The grant should be released only upon successful revision of the exhibit interpretive plan within 90 days. The current proposal risks public harm by conflating systemic change with human failure, but the core educational goal—linking past resilience to future climate challenges—is vital. We must not fund historical erasure, but neither should we defund public engagement with difficult history.

  **Decision Rule: Structural Discontinuity**
  For future proposals, the Council should adopt a definition of collapse as **Structural Discontinuity**. This rule distinguishes between the failure of *institutions* (governments, economies, monument building) and the persistence of *people*.

  Testing this against the three cases confirms its utility:
  1.  **The Maya:** The Classic period political system discontinued, but the people and culture persisted. Under this rule, we can discuss the abandonment of cities without implying the people "failed." This directly addresses the Indigenous partner's objection.
  2.  **The Bronze Age:** Palace economies discontinued in Greece and Anatolia, but continued in Egypt. This rule allows the exhibit to show a "patchwork" of disruption rather than a uniform event, fixing the alcove's current oversimplification.
  3.  **Easter Island:** Monument building discontinued, but society adapted until external contact. This rule allows us to discuss resource management without endorsing the debunked "ecocide" narrative of total self-destruction.

  This rule preserves the word "collapse" for systems, satisfying the Director's need for urgency, while protecting living communities from being labeled as "failures," satisfying the Curator.

  **The "Collapse-O-Meter"**
  The current interactive must be **redesigned**. A slider scoring "how completely it failed" from 0 to 100 is ethically untenable; it quantifies human worth.

  *   **Redesign Specification:** Replace the "Failure Slider" with a "Complexity Curve."
  *   **Axes:** The Y-axis should measure "Socio-Political Complexity" (low to high); the X-axis should measure "Time."
  *   **Function:** Visitors adjust variables (e.g., "Drought," "Trade Disruption") to see how systems simplify over time.
  *   **Label Warning:** The interface must bear a permanent label: *"Systems change. People endure. This graph measures institutions, not human value."*
  This retains the interactive engagement the Director needs while shifting the metric from moral judgment to structural analysis.

  **Easter Island Material**
  The education department's desire for a "cleaner cautionary tale" must be overruled, but without turning the gallery into a historiography seminar. We do not need to display academic debates to teach accurate history.

  *   **Implementation:** Frame the narrative as "Resilience and Shock." The exhibit should state clearly that Rapa Nui society adapted to environmental limits for centuries (resilience) before facing catastrophic population loss due to external contact and disease (shock).
  *   **Visuals:** Show the statues not as tombstones of a dead culture, but as enduring markers of a living lineage.
  *   **Lesson:** The climate lesson remains intact—resource management matters—but the moral shifts from "they destroyed themselves" to "adaptation has limits, especially when external shocks occur." This is a more robust lesson for a climate-changed future.

  **Addressing Stakeholder Concerns**
  We must give both the Museum Director and the Curator of Indigenous Partnerships their best day in court, as both hold valid claims on the project's success.

  *   **To the Museum Director:** You argue that "collapse" drives visitation and that the donor agreement mandates the title. You are right that urgency mobilizes audiences. However, a exhibit based on contested or harmful history risks long-term reputational damage that outweighs short-term ticket sales. Regarding the donor: Most named gifts allow for interpretive adjustments provided the core theme remains. Framing this revision as "enhancing accuracy to protect the donor's legacy" is a stronger negotiation position than "changing the title." If the title must remain *When Civilizations Fail*, the interior content must explicitly redefine "Failure" as "Structural Change" to honor the agreement's spirit without violating historical truth. A hall nobody trusts educates nobody.
  *   **To the Curator of Indigenous Partnerships:** You argue that scoring "failure" scores living ancestors. You are right. The proposed "Structural Discontinuity" rule validates your objection without scrapping the exhibit. It ensures that Maya descendants are portrayed as survivors of systemic change, not victims of inherent failure. However, consider that the word "collapse," if rigorously defined, can serve Indigenous interests by highlighting the resilience required to survive such events. The goal is not to remove the trauma of history, but to locate it in systems rather than people.

  **Timeline and Conditions**
  1.  **Day 0:** Conditional Award Notification.
  2.  **Day 30:** Museum submits revised interpretive plan incorporating the "Structural Discontinuity" definition and redesigned interactive specs.
  3.  **Day 60:** Review by Council and Indigenous partners.
  4.  **Day 90:** Final approval and fund release.

  **Conclusion**
  My intuition, born of a town that "collapsed" yet persists, is that collapse names a change in the shape of a thing, not the end of it. This exhibit can teach that lesson. It can show that when systems fail, people suffer, but people also adapt. If we fund this, we must ensure it tells the truth about the systems without lying about the people.

  **Recommendation:** Award with Conditions.
