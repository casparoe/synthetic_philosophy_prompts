      *   **Constraint 2 (Core Idea):** Use "the greeting problem" – we always generalize to greet, but the key is which generalizations we hold open to correction.
      *   **Constraint 3 (Tone/Content):** Praise the evening without relying on "national character," "heritage," or "culture" as essentialist concepts. Must land for recent arrivals, long-term locals, and the "only kid from country X" delegates. Must address the annoyed dad indirectly but empathetically.
      *   **Constraint 4 (Style):** British English. Short, speakable sentences (bad acoustics, small children). No jokes at any country's expense.
