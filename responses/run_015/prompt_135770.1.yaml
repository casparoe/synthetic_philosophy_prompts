answer: |-
  Good evening, everyone.

  Thank you for coming. And thank you for the noise. A quiet school is a worrying thing.

  I have been asked to say a few words about why we are here. Usually, this is the part where I talk about celebration. Or community. But I want to talk about something smaller. I want to talk about how we start a conversation.

  Think about when you meet someone new. You have to say something. You have to make a guess. You might ask about the weather. You might ask where they live. You might ask about their children.

  To ask is to assume. It is to say: 'I think this matters to you.'

  Sometimes we are right. Sometimes we are wrong.

  I call this 'the greeting problem'. You cannot greet someone without a guess. You cannot address them without a prior idea of who they are. The question is not whether we generalize. We always do. The question is: what do we do next?

  Do we treat our guess as a fact? Or do we hold it open? Do we leave room for the other person to say, 'Actually, no. It is like this instead.'

  Look around this hall. Look at the displays. Look at the costumes.

  These are guesses. They are starting points.

  A display about Poland is not the truth about Poland. It is a collection of things someone thought were worth sharing. A dance from the Caribbean is not the whole story of the Caribbean. It is a rhythm someone loves.

  These are offerings. They are invitations to speak.

  I know that for some families, this evening is straightforward. Your country is on the wall. You feel seen. That is a good feeling.

  I know for others, it is complicated. Some children have been assigned a place they have never visited. It can feel strange to wear a label that does not fit. It can feel like a costume.

  If that is you, please know this: you are not pretending. You are exploring. You are learning what someone else loves. That is a generous thing to do. You are not claiming a passport. You are sharing a curiosity.

  And I know some children here are the only ones from their country in this school. You might feel pressure. You might feel like you are the ambassador. You might feel like you have to get it right for everyone back home.

  You do not.

  You are not a delegate. You are a neighbour. You do not carry the weight of a nation on your shoulders. You only carry your own story. If someone asks you a question you cannot answer, you are allowed to say, 'I do not know.' That is a true answer.

  This evening is not about proving who we are. It is not about fixing identities in place. Maps are useful. But people are not maps.

  The value of tonight is not in the accuracy of the displays. It is in the conversations they start.

  When you stand in front of a board about Japan, do not just nod. Ask a question. If someone tells you about food in Ghana, listen. But if you know something different, say so.

  This is how we live together. We make a guess. We offer a greeting. And then we listen for the correction.

  'Thank you, but actually…'

  'That is interesting, but for us…'

  'I have never tried that, but I like…'

  That gap between the guess and the correction? That is where the community lives. Not in the flag. Not in the stereotype. But in the space between us where we explain ourselves.

  So, here is my request.

  Enjoy the dances. Eat the food. Look at the work your children have made. They have worked hard. The teachers have worked harder.

  But when you talk to each other, remember the greeting problem. Make your guesses. But hold them lightly. Be ready to be corrected. Be ready to learn that the person in front of you is more specific, and more surprising, than any display can show.

  We are not here to confirm what we think we know. We are here to find out what we do not know yet.

  Thank you. Enjoy the evening.
