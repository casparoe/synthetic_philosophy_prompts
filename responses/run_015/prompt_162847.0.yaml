prompt: |-
  I'm putting together the function week for a grad seminar in philosophy of biology this spring, and I realised I don't actually know what I'm asking of a theory of biological function. My students do this thing where someone produces a case — a heart that has never pumped and never will, the very first heart token, the heart's thumping noise, a liver that does forty things — and everyone treats the case as decisive for or against an account, and I have no principled way to say how much weight it should carry. So before we read any more of the literature I want the spec instead. Write me the desiderata: what any account of what it is for a trait or part to have a function has to deliver, with the case or consideration behind each requirement, and mark which are non-negotiable and which are just preferences of one camp. To keep it honest, fix the purpose: I want a function concept that can (a) underwrite a notion of malfunction or dysfunction that does real work for my colleague in philosophy of medicine, who needs to separate pathology from mere statistical atypicality, and (b) still carry the naturalistic load that theories of mental content lean on it for. If those two customers want different things from the concept, I want that said explicitly, with each desideratum tagged for which customer it comes from. And please route some of the requirements through cases I can use to break the usual rut, because the ones in the literature are over-rehearsed: a de novo designed protein dropped into a synthetic cell, whose only history is a lab selection protocol run by a robot; an enzyme produced by directed evolution where the selecting was done by an automated pipeline rather than by anything ecological; a trait in a digital organism in an artificial-life platform; a gene-drive construct engineered to crash a wild population, whose function seems to be something no organism ever benefited from; a transposable element that spread by selfish replication and is now doing regulatory work it was never selected for; and a holobiont or extended-phenotype case like a beaver dam or a termite mound, where it isn't clear whose history is supposed to matter. Distinguish also between what a theory must explain — why the trait is there, what it currently does, how a part can be broken — and what it must merely respect, like the distinction between having a function and having that function well, or between a function and a useful side effect.

  The part I most want is the negative structure of the list: tell me which subset of the desiderata you think cannot be jointly satisfied, and say whether that's because the list is over-ambitious or because the concept is genuinely over-constrained (the origin-of-function problem plus the normativity requirement plus the explanatory-role requirement feel like they might not all fit together, but I want you to actually check rather than nod along). Tell me which single requirement excludes the most candidate theories, and which of the usual demands on a theory of function you think are prejudices dressed up as desiderata — the ones that just bake in an answer. A short scorecard at the end is fine: how the selected-effect/etiological account, the causal-role or systemic-capacity account, and some kind of pluralist or deflationary option do against your list, a few lines each. But keep the weight on the criteria and their motivating cases, since the criteria are where the thinking is and I can redo the scoring myself.

  And be explicit about where you're unsure. Give me the desideratum you'd abandon first if I pushed back on it, tell me what would actually change your mind — a case, an argument, a result from biology — and flag the step in your reasoning you think is most likely to be wrong, rather than presenting the list as if it dropped out of the sky fully justified.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Task:** Create a list of desiderata for a theory of biological function.
      *   **Context:** Grad seminar in philosophy of biology (Spring).
      *   **Specific Purpose:**
          1.  Underwrite malfunction/dysfunction for philosophy of medicine (distinguish pathology from statistical atypicality).
          2.  Carry the naturalistic load for theories of mental content (teleosemantics).
      *   **Key Constraint:** Distinguish between non-negotiable requirements vs. preferences. Tag requirements by "customer" (Medicine vs. Content).
      *   **Key Constraint:** Use novel/fresh cases (de novo protein, directed evolution enzyme, digital organism, gene-drive, transposable element, holobiont/extended phenotype) instead of over-rehearsed ones (standard heart examples).
      *   **Key Constraint:** Distinguish between what a theory must *explain* vs. what it must *respect* (e.g., function vs. functioning well).
      *   **Key Constraint:** Negative Structure. Identify incompatible subsets of desiderata. Is it over-ambition or genuine over-constraint? Identify the single most exclusionary requirement. Identify "prejudices dressed up as desiderata."
      *   **Key Constraint:** Epistemic Humility. Explicitly state uncertainties, which desideratum to abandon first, what would change my mind, and the most likely flawed step in reasoning.
      *   **Output:** A scorecard at the end (SE, CR, Pluralist) but keep the weight on the criteria.

  2.  **Deconstruct the "Customers":**

      *   **Philosophy of Medicine (Boorse-style/Normative):** Needs a robust notion of *dysfunction*. If a heart doesn't pump, it's broken, not just different. Needs to distinguish disease from mere variation. Requires a normative element (how things *ought* to be).
      *   **Philosophy of Mind (Teleosemantics/Millikan/Papineau):** Needs a naturalistic grounding for representation. Mental states have content because they have functions. Needs a historical/etiological link to explain why a state represents *that* rather than *this*. Requires a link between history and current utility.

      *   *Potential Conflict:* Medicine often wants ahistorical, structural norms (Boorse's Biostatistical Theory), while Teleosemantics demands history (Selected Effects). If a brain state is structured to represent X but has no selection history (e.g., in a new environment), Teleosemantics struggles, whereas Medicine might still call it a dysfunction if it fails a structural norm.

  3.  **Drafting the Desiderata (incorporating novel cases):**

      *   *D1: The Normativity Constraint (Medicine).* Must distinguish "failed to function" from "failed to be useful." (Case: Gene-drive).
      *   *D2: The History Constraint (Content).* Must ground function in something prior to current utility to avoid circularity in content. (Case: De novo protein).
      *   *D3: The Malfunction Constraint (Medicine).* Must allow for tokens that cannot perform the function to still *have* the function. (Case: First heart token).
      *   *D4: The Multiplicity Constraint (General).* Must handle traits with multiple effects without calling all of them functions. (Case: Liver doing 40 things / Transposable element).
      *   *D5: The Novelty Constraint (Content/General).* Must handle traits with no evolutionary history but clear functional organization. (Case: Digital organism / Directed evolution enzyme).
      *   *D6: The Unit of Selection Constraint (General).* Must specify whose history counts. (Case: Holobiont / Beaver dam).

  4.  **Analyzing Conflicts (The "Negative Structure"):**

      *   *The Big Tension:* D2 (History) vs. D5 (Novelty). Teleosemantics needs history. Directed evolution/Digital organisms have "history" but it's artificial or truncated. De novo proteins have no *evolutionary* history. If function requires evolutionary history (SE), D5 fails. If function requires only current causal role (CR), D1 (Normativity/Malfunction) fails (a broken heart just *doesn't* pump, it's not *dysfunctional* in a normative sense).
      *   *The "Prejudice":* The idea that "Function" must be a *single* natural kind. This is likely the prejudice.
      *   *Most Exclusionary:* The History Constraint (D2). It kills Causal Role accounts immediately.
      *   *Over-constrained?* Yes. You cannot have strong normativity (Medicine) + strict naturalistic history (Content) + applicability to synthetic/novel biology (Science practice) without fragmentation.

  5.  **Refining the Desiderata & Tagging:**

      *   *Make them punchy.*
      *   *Ensure the novel cases are integrated.*
      *   *Clarify Explain vs. Respect.*

  6.  **Developing the Scorecard:**

      *   *Selected Effect (SE):* Good on History/Normativity. Bad on Novelty/Synthetic cases.
      *   *Causal Role (CR):* Good on Novelty/Current utility. Bad on Normativity/Malfunction (the "everything is a function" problem).
      *   *Pluralist:* Good on flexibility. Bad on unifying the concept (might not satisfy the "single concept" desire).

  7.  **Addressing Epistemic Humility:**

      *   *What to abandon?* The "Single Concept" assumption.
      *   *What changes my mind?* A successful naturalistic reduction of normativity that applies to synthetic biology.
      *   *Likely flaw:* Assuming Medicine *needs* a philosophical theory of function rather than a pragmatic operationalization.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the pedagogical goal.
      *   *Section 1: The Two Customers.* Define the stakes.
      *   *Section 2: The Desiderata.* List them with tags (M for Medicine, C for Content, B for Biology practice). Use the specific cases requested.
      *   *Section 3: The Negative Structure.* The incompatibility matrix.
      *   *Section 4: Prejudices.* The "One True Function" bias.
      *   *Section 5: Scorecard.* Brief assessment.
      *   *Section 6: Humility.* My uncertainties.

      *(Self-Correction during drafting)*: I need to make sure I don't just list standard SE vs CR arguments. I need to use the *specific* cases requested (gene drives, de novo proteins, etc.) to drive the desiderata.
      *   *Gene Drive:* Challenges the "benefit to organism" requirement.
      *   *De Novo Protein:* Challenges the "evolutionary history" requirement.
      *   *Holobiont:* Challenges the "individual organism" boundary.

      *(Refining the Conflict)*: The core conflict is between *Normativity* (Medicine) and *Naturalism/History* (Content + SE theory). Medicine wants "broken." Content wants "selected for." Synthetic biology wants "designed for." These pull in different directions.

      *(Refining the "Prejudice")*: The prejudice is that "Function" explains *why the trait is there*. Sometimes function is just *what it does*. Demanding etiology for all functions is a prejudice of the SE camp.

      *(Refining Humility)*: I should admit that maybe "Function" isn't the right tool for Medicine. Maybe they need "Health" which is distinct.

  9.  **Final Polish:** Check tone. Needs to be academic but direct, suitable for a grad seminar handout or prep note. Ensure all constraints of the prompt are met. (Check: Did I tag customers? Yes. Did I use the specific cases? Yes. Did I identify the incompatibility? Yes. Did I express uncertainty? Yes.)

      *Wait, one specific constraint:* "Distinguish also between what a theory must explain — why the trait is there, what it currently does, how a part can be broken — and what it must merely respect." I need to make sure this distinction is explicit in the desiderata section.

      *Another constraint:* "Tell me which single requirement excludes the most candidate theories." That's likely the History requirement.

      *Another constraint:* "Give me the desideratum you'd abandon first." I'll pick the "Unified Concept" assumption or the strict History requirement for synthetic cases. Let's go with the "Unified Concept" assumption as the thing to abandon, but if forced to pick a *desideratum*, it's the strict History requirement for *all* functions.

      *Let's write.*
answer: |-
  This is a diagnostic framework for your seminar. It is designed to break the "heart token" deadlock by shifting the burden from intuitions about standard cases to structural requirements derived from your two specific "customers" (Medicine and Mind), tested against the edge cases of contemporary biology.

  ### I. The Customers and Their Stakes

  Before the list, we must fix the telos of the theory itself. You have two stakeholders who are implicitly fighting over the same word.

  1.  **Philosophy of Medicine (The Normative Customer):** Needs a concept of **Dysfunction**.
      *   *Goal:* Distinguish pathology (a broken mechanism) from statistical atypicality (a rare but working mechanism) and from mere disutility (a heart that works perfectly but belongs to a diver who dies of the bends).
      *   *Requirement:* The theory must support a *normative* claim (how the part *ought* to behave) without resorting to moral or social values.
  2.  **Philosophy of Mind (The Naturalistic Customer):** Needs a concept of **Teleosemantics**.
      *   *Goal:* Naturalize mental content. A belief represents *that there is water* because its function is to indicate water.
      *   *Requirement:* The theory must ground function in **history** (selection) to avoid circularity. If function is just "what it does now," then a misrepresentation (a false belief) is just doing something else, not malfunctioning.

  ### II. The Desiderata List

  I have distinguished between what the theory must **Explain** (provide a truth condition for) and what it must **Respect** (accommodate as a pre-theoretical distinction).

  **D1. The Malfunction Constraint (Tag: Medicine | Status: Non-Negotiable)**
  *   **Type:** Explain.
  *   **Requirement:** The theory must allow for a token trait to *have* a function F even if it *cannot* currently perform F.
  *   **Motivating Case:** *The First Heart Token.* The very first heart in evolutionary history had the function to pump blood, even if it pumped inefficiently or failed immediately. If function requires successful performance, the first heart had no function, and selection cannot get started.
  *   **Motivating Case:** *Pathological Organ.* A congenitally defective valve has the function to regulate flow, even if it physically cannot. Medicine needs to call this "disease," not "absence of function."

  **D2. The History Constraint (Tag: Mind | Status: Non-Negotiable for Content)**
  *   **Type:** Explain.
  *   **Requirement:** Function assignment must depend on facts prior to the current existence of the trait (typically selection history), not merely current causal contributions.
  *   **Motivating Case:** *The Thumping Noise.* A heart makes a noise. It is useful for doctors to listen to it. But the noise is not the function. Only history explains why pumping is the function and thumping is a side-effect.
  *   **Motivating Case:** *Misrepresentation.* To solve the disjunction problem for mental content, the state must have a history of being selected for correlating with X, even if it currently correlates with X-or-Y.

  **D3. The Novelty Constraint (Tag: Biology Practice | Status: Negotiable)**
  *   **Type:** Respect.
  *   **Requirement:** The theory must be able to assign functions to traits that lack a deep evolutionary history but possess a design history or systemic role.
  *   **Motivating Case:** *De Novo Protein.* A protein designed in a lab and inserted into a synthetic cell. It has no evolutionary history. Yet, biologists will say its function is to catalyze reaction R.
  *   **Motivating Case:** *Digital Organism.* In an A-life platform (e.g., Avida), a logic-gate trait arises. It has a "history" of selection in the code, but no biological history. If our theory says this has *no* function, it cuts off a huge swath of synthetic biology.

  **D4. The Beneficiary Constraint (Tag: Biology Practice | Status: Negotiable)**
  *   **Type:** Explain.
  *   **Requirement:** The theory must specify *who* or *what* benefits from the function to determine its identity.
  *   **Motivating Case:** *Gene Drive.* A construct engineered to crash a wild population. Its function is to spread, even though it reduces the fitness of the host organism. Standard SE theory struggles here because the "organism" is not the beneficiary.
  *   **Motivating Case:** *Transposable Element.* A "selfish gene" spreading by replication, now co-opted for regulatory work. Is its function replication (history) or regulation (current role)? Medicine needs to know if the regulation is the "proper" function to judge if its disruption is pathology.

  **D5. The Boundary Constraint (Tag: Biology Practice | Status: Negotiable)**
  *   **Type:** Respect.
  *   **Requirement:** The theory must identify the relevant unit of selection to which the function is ascribed.
  *   **Motivating Case:** *Holobiont/Beaver Dam.* Is the function of the beaver dam to shelter the beaver (organism) or to alter the ecosystem (extended phenotype)? Is the function of a termite gut microbe to digest cellulose for the termite or for the microbe? If the theory cannot delineate the system, it cannot define dysfunction for the host.

  **D6. The Normativity Constraint (Tag: Medicine | Status: Non-Negotiable)**
  *   **Type:** Respect.
  *   **Requirement:** The theory must distinguish between *having a function* and *performing it well*.
  *   **Motivating Case:** *The Aging Liver.* A liver doing 40 things. As it ages, it does them at 40% capacity. It still has the functions, but it is functioning poorly. Medicine needs to know at what point "poorly" becomes "pathologically." A theory that equates function with current causal role (Causal Role theory) collapses this distinction.

  ### III. The Negative Structure: Incompatibilities

  Here is the honest assessment of the logical friction. You cannot satisfy all of the above without fragmentation.

  **1. The Impossible Trinity**
  You cannot jointly satisfy **D2 (History)**, **D3 (Novelty)**, and **D6 (Normativity)** under a single monistic account.
  *   **Why:**
      *   To get **Normativity (D6)** and solve the **Mind (D2)** problem, you generally need **Selected Effects (History)**. You need a past standard to judge current failure.
      *   But **History (D2)** fails **Novelty (D3)**. The *De Novo Protein* and *Directed Evolution Enzyme* have no evolutionary history. If you stretch "history" to include "lab selection," you dilute the naturalism required for **Mind** (teleosemantics relies on *blind* variation, not intelligent design).
      *   If you switch to **Causal Role** to save **Novelty**, you lose **Normativity (D6)**. If function is just "what it does," a broken heart isn't dysfunctional; it's just a heart that doesn't pump. Medicine loses its ground.

  **2. The Most Exclusionary Requirement**
  **D2 (The History Constraint).**
  This is the killer. It immediately excludes Causal Role (Cummins-style) accounts, Systemic Capacity accounts, and Goal-Contribution accounts. It forces you into Etiological (Millikan/Neander) or Hybrid views. It is the primary source of friction with synthetic biology cases.

  **3. Prejudices Dressed as Desiderata**
  *   **The "Single Kind" Prejudice:** The assumption that there is *one* concept of function that does all this work. This is likely false. Medicine might need a "structural norm" concept, while Mind needs a "historical indicator" concept. Demanding one theory to do both is a metaphysical prejudice, not a methodological necessity.
  *   **The "Benefit" Prejudice:** The assumption that functions must always benefit the *organism*. The *Gene Drive* and *Transposable Element* cases show that functions can be selfish or supra-organismal. Insisting on organismic benefit is a hangover from adaptationism, not a requirement of the concept.

  ### IV. Scorecard

  **Selected-Effect (Etiological) Account**
  *   **Pros:** Crushes **D1 (Malfunction)** and **D2 (History)**. Perfect for the Philosophy of Mind customer. Handles the *First Heart* well.
  *   **Cons:** Fails **D3 (Novelty)**. The *De Novo Protein* has no function on this view until it evolves. Struggles with **D4 (Beneficiary)** regarding *Gene Drives* (who is the selector?).
  *   **Verdict:** Best for Mind, risky for Synthetic Biology.

  **Causal-Role (Systemic) Account**
  *   **Pros:** Crushes **D3 (Novelty)** and **D5 (Boundary)**. The *Directed Evolution Enzyme* has a function immediately. Great for lab biology.
  *   **Cons:** Fails **D1 (Malfunction)** and **D6 (Normativity)**. Cannot distinguish a broken heart from a heart that doesn't pump, except pragmatically. Useless for the Philosophy of Medicine customer (cannot define disease).
  *   **Verdict:** Best for Lab Practice, useless for Medicine/Mind.

  **Pluralist / Deflationary Option**
  *   **Pros:** Acknowledges the **Impossible Trinity**. Allows Medicine to use a Biostatistical Theory (Boorse) and Mind to use Teleosemantics.
  *   **Cons:** Philosophically unsatisfying. Doesn't tell you what function *is*, only how to use the word.
  *   **Verdict:** Most honest, least theoretically ambitious.

  ### V. Epistemic Humility & Uncertainty

  **The Desideratum I Would Abandon First:**
  **D3 (The Novelty Constraint).**
  If forced to choose, I would bite the bullet and say that *De Novo Proteins* and *Digital Organisms* do not have "biological functions" in the strict sense required for naturalism; they have "design functions." This preserves the naturalistic load for Philosophy of Mind (D2) and the normative load for Medicine (D1/D6). We can treat synthetic biology as a distinct category.

  **What Would Change My Mind:**
  A successful **naturalistic reduction of normativity** that applies to ahistorical systems. If someone can show how a *De Novo Protein* can be "dysfunctional" in a robust, non-pragmatic sense without referencing a designer's intent or an evolutionary history, then D2 is not necessary, and Causal Role accounts become viable for Medicine. (Currently, I suspect this is impossible).

  **The Most Likely Flaw in This Reasoning:**
  I am assuming that **Philosophy of Medicine** actually needs a *philosophical* theory of function. It is highly probable that Boorse's Biostatistical Theory works fine for medicine *without* solving the etiology problem. Medicine cares about reference classes and statistical norms, not whether the trait was selected for. By tying Medicine to the "Malfunction Constraint" (D1) in a way that demands etiology, I may be creating a problem for Medicine that Medicine doesn't actually have. Medicine might be satisfied with Causal Role + Statistical Norms, while only Mind needs Etiology.

  **Recommendation for the Seminar:**
  Start with the **Impossible Trinity**. Ask your students: "Which customer are you willing to fire?" If they want to save Teleosemantics, they must accept that synthetic biology uses a different concept of function. If they want to save Synthetic Biology, they must admit Teleosemantics is incomplete. The "heart token" cases are only decisive if you pretend all three corners of the triangle can be satisfied.
