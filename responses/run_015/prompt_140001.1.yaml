  9.  **Final Polish:** Ensure the distinction between the *Procedure* and the *Application* is clear. The prompt asks for the procedure *and* to run it on the cases. I will structure it as "The Protocol" followed by "Application to Live Questions."

      *(Self-Correction on Confidence Notes)*: The prompt asks for this "at the end of each major step." I will insert these blocks clearly.

      *(Self-Correction on "No Usable Number")*: For the alliance case, if the procedure fails to produce a number, I must state that plainly as a feature, not a bug.

      *(Refining the "Backtest")*: Since they produce 12 forecasts a year, a full backtest might take time. I will suggest a "Rolling Backtest" on the last 3 years of archived forecasts to keep it within the 0.5 day limit per *new* forecast (maybe the backtest is a quarterly maintenance task, but the prompt implies it's part of the procedure. I will frame it as a "Pre-Launch Check" using historical data available at the time). Actually, to fit the 0.5 day constraint per forecast, the backtest should be a periodic team exercise, but the *protocol* for it must be defined now. I will define the protocol but note it runs quarterly, not per forecast, to respect time limits. Wait, the prompt says "The procedure has to be run in about half a working day per forecast." I need to make the backtest lightweight. Maybe just checking the *Reference Class* stability against past forecasts. Okay, I will streamline the backtest to be a "Reference Class Validation" step using existing data.

      *Re-reading prompt:* "a backtest protocol in which we re-run the whole procedure on past forecasts whose outcomes we mask from ourselves..." This sounds like a separate exercise. I will include it as a mandatory quarterly step, but keep the *per forecast* steps tight. Actually, to strictly follow "run in about half a working day per forecast," I must integrate the validation into the workflow. I will suggest a "Shadow Forecast" step where one past case is re-evaluated during the process to keep the muscle memory sharp.

      *Wait, one more constraint:* "where the procedure stops and returns no usable number." I need to make sure this is an explicit exit condition.

      *Let's build the steps.*

