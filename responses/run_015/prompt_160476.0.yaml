answer: |-
  **To:** The Committee on Amnesty and Reparations
  **From:** [Your Name/Commissioner]
  **Date:** Thursday
  **Re:** Draft Recommendation regarding Kalkrand Consolidated Application

  You have asked for an analysis of our precedents to resolve the conflict between the instrumental view (amnesty as a purchase of truth) and the constitutive view (amnesty as a personal exchange of accountability). Below is the breakdown of the rules, the prediction, and the discriminating test case you requested.

  ### 1. The Rules of Precedent

  Based on the seven decisions and the internal tension provided, three distinct rules emerge. They do not all point in the same direction.

  **Rule A: The Political Objective Requirement (The *Case 2* Rule)**
  *   **Formulation:** Amnesty is only available for acts undertaken with a recognized political objective; acts deemed punitive, disproportionate, or purely economic are excluded regardless of the level of disclosure.
  *   **Source:** Case 2 (Commander refused for punitive raid); Case 1 (Conscript granted for political objective).
  *   **Prediction for Kalkrand:** **Refusal.** The company explicitly disclaims a political objective, citing economic motives (production/share price). Under Case 2, an act without a political objective is ineligible, regardless of the truth provided.

  **Rule B: The Full Disclosure and Recovery Requirement (The *Case 3 & 6* Rule)**
  *   **Formulation:** Amnesty turns on the utility and completeness of the disclosure. If an applicant provides information essential for recovery (remains, chain of command) that is otherwise unobtainable, the threshold for granting is lowered, even for non-violent actors.
  *   **Source:** Case 3 (Refused for withholding bodies); Case 6 (Granted to clerk for revealing network function); Case 4 (Conditional grant for community role).
  *   **Prediction for Kalkrand:** **Grant (Conditional).** The archive provides burial sites and commander names no individual has disclosed in nine years. This satisfies the "recovery of remains" imperative of Case 3 and the "network function" value of Case 6.

  **Rule C: The Non-Transactional Integrity Rule (The *Case 7* Rule)**
  *   **Formulation:** Reparative contributions (money, clinics, exhumations) cannot be the *quid pro quo* for immunity. They may be recorded and welcomed, but amnesty must be granted on the merits of the act and disclosure, not purchased.
  *   **Source:** Case 7 (Clinic offer refused as trade); Case 5 (Amnesty relieves liability, does not sell blamelessness).
  *   **Prediction for Kalkrand:** **Refusal of the "Deal."** We cannot grant immunity *in return* for the fund. We could accept the fund separately, but linking it to the immunity request violates Case 7.

  **Where They Come Apart:**
  Rule A and Rule C support your position (the constitutive view): the applicant lacks the correct *status* (political actor) and is attempting a forbidden *transaction*. Rule B supports your friend's position (the instrumental view): the *outcome* (bodies recovered) justifies the grant. The case turns on whether Rule B can override Rule A.

  ### 2. Decision, Analog, and Principle

  **Best Guess at Decision:**
  The Committee should **refuse the application for amnesty**, but **accept the archive and reparations fund as a separate civic contribution**, recording them in the final report without granting immunity.

  **Closest Analog:**
  **Case 2 (The Section Commander).**
  *   **Why:** This is the strongest legal barrier. In Case 2, the applicant confessed fully but was refused because the act was "punitive rather than political." Kalkrand's admission is even more damaging: they explicitly state their motive was *economic* and that they would have collaborated with *any* government. This is the definition of a non-political act in our jurisprudence. Case 6 (the clerk) does not save them because the clerk was part of a political security apparatus; Kalkrand claims to be apolitical.
  *   **Secondary Analog:** **Case 7.** The company is explicitly trying to trade a fund and exhumations for immunity. Case 7 forbids this. To grant immunity now would overrule Case 7 by implication.

  **The Principle Adopted:**
  *   **If we Refuse:** We affirm that **amnesty is constitutive, not transactional.** We establish that the state cannot sell immunity for information, nor can it grant amnesty for acts devoid of political objective. We preserve the moral coherence of the process (your view) but risk leaving the bodies in the ground.
  *   **If we Grant:** We affirm that **truth recovery is the supreme good,** superseding the requirements of political motive and personal accountability (your friend's view). We establish that corporations are eligible applicants and that immunity can be bartered for information.
  *   **On the Money:** We must follow Case 7. We can take the money for the exhumations *only if* we decouple it from the immunity decision. If we grant immunity *because* they paid for exhumations, we corrupt the commission. If we refuse immunity but they pay anyway, it remains a voluntary reparation, which is permissible.

  **Addressing the Tension:**
  The tension (Early case: duplicate docket granted for corroboration vs. Later case: duplicate docket refused for lack of new info) is resolved in Kalkrand's favor regarding *information value*. Their archive is not a duplicate; it contains burial sites no one else has. Therefore, the Later Case refusal does not apply. However, this only clears the "Disclosure" hurdle (Rule B); it does not clear the "Political Objective" hurdle (Rule A).

  **Foreign State Objection:**
  Case 4 requires the affected community to have a "real role." The neighboring state represents the community of the dead (migrant workers). Their formal objection suggests the community role requirement is not met. This further supports Refusal.

  ### 3. The Discriminating Case

  You proposed two hypotheticals to distinguish our views. The one that does the discriminating work is:

  **The Former Personnel Director (Natural Person, Economic Motive, High Truth).**
  *   **The Scenario:** An elderly individual who managed the Kalkrand archive applies personally. He avows the acts (handing over lists), provides the same burial site data, but admits his motive was solely to keep his job and protect company profits (economic, not political).
  *   **Why this distinguishes us:**
      *   It removes the "Corporate Personhood" variable. If we refuse Kalkrand because they are a company, the Director should pass. If we refuse Kalkrand because of the *motive*, the Director should fail.
      *   It isolates the **Political Objective** requirement (Case 2) from the **Truth Value** requirement (Case 6).
  *   **What the Verdict Shows:**
      *   **If we Grant the Director:** It proves your friend is right. It establishes that **Truth Value trumps Political Motive.** It means amnesty is indeed a currency for information, and the "political objective" clause in our mandate is effectively dead letter when high-value truth is on the table. It would imply we *should* have granted Kalkrand amnesty too, and our refusal was merely a technicality about corporate status.
      *   **If we Refuse the Director:** It proves you are right. It establishes that **Political Motive is Constitutive.** Even a natural person, even with full disclosure, even with the bodies of the victims, cannot buy amnesty without a political objective. This confirms that Kalkrand's refusal is based on principle, not just legal form.

  **Why the other case (Corp with Duplicate Records) fails:**
  That case merely re-litigates the "Internal Tension" you already flagged (New Info vs. Old Info). A verdict there tells us about the threshold for "disclosure," but it does not tell us whether *motive* or *personhood* matters. Since Kalkrand has *new* info, the Duplicate Corp case is distinguishable on the facts. The Personnel Director case forces us to choose between Rule A (Politics) and Rule B (Truth).

  **Recommendation:**
  Draft the recommendation to refuse amnesty based on **Case 2 (Lack of Political Objective)** and **Case 7 (Improper Quid Pro Quo)**. Offer to accept the archive and fund as a voluntary contribution to national reconciliation, recorded in the final report, contingent on the company withdrawing the request for immunity. This honors the precedents without abandoning the victims' need for the truth.
