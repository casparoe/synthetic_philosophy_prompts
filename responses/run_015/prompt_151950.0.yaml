answer: |-
  M: Let us dispense with the mysticism. The careenium is a closed mechanical system. The pistons move because simmballs collide with levers, transferring momentum according to thermodynamic laws. To suggest the *symbol* pushes the piston is to suggest a ghost in the machine. The simmball is merely a trace; the substrate does all the work.

  N: A tidy picture, until you break the engine. Suppose I replace a simmball with a placeholder identical in mass, temperature, and instantaneous position, yet bearing a different symbol within the system's lexicon. The piston trajectory alters. If the substrate were all that mattered, identical physical inputs should yield identical outputs. They do not. The symbol-pattern functionally constrains the substrate.

  M: You are smuggling in a dualist property. If mass, temperature, and position are identical, the physical state is identical. If the outcome differs, you must posit a non-physical cause. I reject that. The 'symbol' is nothing over and above the arrangement of matter. It supervenes on the substrate. If the substrate is fixed, the symbol is fixed. You cannot vary one while holding the other constant.

  N: You conflate micro-properties with systemic state. Supervenience grants that the symbol depends on the substrate, but it does not explain the *mapping*. Why does this specific arrangement trigger *that* piston? Supervenience without downward causation leaves the functional specificity unexplained. It tells us the symbol cannot change without the substrate changing, but not why the substrate obeys the symbolic rule rather than merely the mechanical force.

  M: Because the rule is physically instantiated. The 'logic' is just wiring. You appeal to multiple realisability—that different physical states can realise the same symbol—to argue for symbolic autonomy. But does that prove the symbol causes the motion, or merely that we can describe the same causal chain at different levels of granularity?

  N: It proves the causal power resides in the pattern, not the particle. If copper balls or wooden blocks can both realise the symbol 'Alpha' and drive the piston identically, the material composition is causally irrelevant to the logic of the move. The substrate is slave to the pattern.

  M: Or, the pattern is a descriptive redundancy. Multiple realisability shows that many physical states belong to the same equivalence class *from our perspective*. It proves the utility of the symbolic description for observers like us, not that the description exerts force on the balls. You are confusing the map with the territory because the territory was built to look like the map.

  N: But when the territory is built to look like the map, the map becomes the blueprint. To deny the symbol's efficacy is to deny the design. You offer a causal story that is physically complete but explanatorily blind.

  M: And you offer one that is explanatorily rich but causally magical. I prefer the blind truth to the magical fiction.

  N: Then you prefer a truth that cannot account for the engine standing before us.
