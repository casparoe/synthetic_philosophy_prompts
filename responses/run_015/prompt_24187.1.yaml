  7.  **Final Review against constraints:**
      *   Did I answer the selection question? Yes.
      *   Did I answer the discarding question separately? Yes.
      *   Did I address the Non-Identity Problem? Yes.
      *   Did I correct the Scheffler/Savulescu error? Yes.
      *   Did I discuss operational changes? Yes.

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "discarding" part. The user asks if discarding commits the clinic to a view of personhood that selection does not. Actually, selection *might* imply the embryo is a "possible person" with interests. Discarding implies it is *not* an actual person. So discarding requires a *weaker* view of personhood than selection implies? No, selection implies the embryo is a vessel for a future person. Discarding implies it is not *yet* a person. The tension is: How can you discard something you are selecting based on its future welfare?
  *Resolution:* Selection is about the *future child*. Discarding is about the *current entity*. The clinic treats the embryo as a *proxy* for the child during selection, and as *biological tissue* during disposal. This is the "Pragmatic Hybrid." I will highlight this duality.

