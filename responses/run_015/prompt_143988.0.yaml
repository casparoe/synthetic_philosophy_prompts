      *   *Fatal Defeaters:*
          *   **The "Lost Ledger" Problem:** If the ledger is historical, what happens when history is lost? If we don't *know* if Einstein tweaked GR to fit Mercury, does the confirmation status remain indeterminate? This threatens objectivity.
          *   **The "Double Counting" / "Screening Off" Issue:** If the ledger is part of $K$, then $P(E|K) = 1$. Standard Bayes says $P(T|E \& K) = P(T|K)$. The user says "fix that by letting the background carry a tuning ledger." But if $E$ is in $K$ (as old evidence), conditioning on $E$ adds nothing. The ledger needs to modify the *likelihood ratio*, not just sit in $K$. How exactly? If $T$ entails $E$, $P(E|T) = 1$. If $E$ is on the ledger, does $P(E|T \& Ledger) < 1$? That contradicts entailment. The user needs to explain how the *probability* shifts, not just the *status*.
          *   **The "Prescient Theory" Problem:** Suppose a theory is formulated, and it turns out it *could* have been tuned to fit $E$, but wasn't. Or, a theory is constructed specifically to fit $E$, but it *also* predicts $F$ (new). Does the tuning of $E$ poison the well for $F$? (Overfitting generalization).

