          *   **The "Degree of Tuning" Problem:** The ledger is binary (on the list/not on the list). But tuning is continuous (1 parameter vs. 10 parameters vs. functional form). How does the ledger handle degrees of freedom?
          *   **The "Competing Theories" Asymmetry:** Theory A fits $E$ (tuned). Theory B fits $E$ (untuned). Theory C fits $E$ (tuned but simpler). The ledger alone doesn't capture complexity penalties (AIC/BIC).

