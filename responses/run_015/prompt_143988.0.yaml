      *   Key Insight to offer: The distinction between *accommodation* (fitting data) and *prediction* (entailing data) is often blurred. The real issue is *degrees of freedom*. The "Ledger" is essentially a qualitative proxy for AIC/BIC.

  7.  **Self-Correction during drafting:** I initially thought about saying the view is formally incoherent. But it's not incoherent; it's just shifting the burden to the Prior. I need to be precise: The ledger penalizes the Prior Probability of the Theory, not the Likelihood of the Evidence given the Theory. If the user claims it changes the Likelihood, that's a fatal formal error. If they claim it changes the Prior (because a tuned theory is *ad hoc* and thus less plausible a priori), that's a standard "ad hocness" defense. I need to press them on *where* in the equation the ledger sits.

