      *   *Refining the "Retroactive" point:* If confirmation depends on the ledger, and the ledger is historical, then confirmation is not a logical relation between $T$ and $E$, but a relation between $T$, $E$, and the *history of T*. This is "Historical Bayesianism." It's defensible but costly. It means $T$'s support can decay if we find a lab notebook.
