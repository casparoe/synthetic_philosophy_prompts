answer: |-
  ### 1. The Examination Question

  **Doctoral Comprehensive Examination: Moral Philosophy**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. No external materials permitted.

  **Question:**

  Define *Karma* strictly as a theory of moral desert: the claim that an agent's welfare levels ought to correspond to their moral conduct, such that suffering is justified only as a response to prior wrongdoing attributable to the sufferer. Assume a metaphysical framework where persons are not enduring substances but "person-streams": temporal sequences of psychologically connected stages (memories, intentions, character traits) without a persisting self.

  Consider the **Provenance Problem**: If Stage-B suffers for a wrong committed by Stage-A, and Stage-B is not numerically identical to Stage-A (only causally connected), on what basis is the suffering *deserved* by Stage-B rather than merely *caused* by Stage-A's act?

  Analyze this problem using the following two stipulative cases:

  1.  **The Doctrine of Transferred Merit:** Suppose an advanced agent (Agent X) can voluntarily assume the karmic debt of a wrongdoer (Agent Y). Agent Y's suffering is remitted; Agent X suffers instead. Agent X did not commit the wrong, nor are they part of Agent Y's person-stream.
  2.  **The Preventive Calibration:** Suppose the karmic mechanism inflicts suffering on a person-stage not for a *past* wrong, but to alter their character and prevent a *future* wrong that the causal stream predicts they will commit. No past wrong exists in this stream to ground the suffering.

  Argue for a determinate position: Can Karma function as a theory of *moral desert* within a person-stream ontology? In your answer, explain whether the Transferred Merit case is more or less incoherent than standard karmic retribution, and whether the Preventive Calibration case reveals karma to be a form of consequentialism rather than desert. Address whether this framework dissolves moral luck or merely relocates it.

  ***

  ### 2. Model Answer

  The Provenance Problem demonstrates that karma, understood as moral desert, is incompatible with the person-stream ontology often associated with it. Desert requires identity; causation supplies only continuity. To deserve punishment, the subject of the suffering must be the author of the wrong. In a person-stream, Stage-B is not Stage-A. They are linked by causal chains and psychological resemblance, but numerical identity is absent. If desert tracks identity, Stage-B cannot deserve Stage-A's debt. If desert tracks causation, the concept of desert collapses into natural consequence, stripping the doctrine of its moral normative force.

  The Doctrine of Transferred Merit clarifies this incoherence. In standard retribution, one might argue that psychological continuity is sufficient for identity, allowing Stage-B to pay for Stage-A. Transferred Merit removes even that continuity. Agent X is a distinct stream. If Agent X can justly bear Agent Y's debt, then desert is detachable from the agent entirely. This implies that suffering is a free-floating currency that can be moved to wherever it is most useful or voluntary. But if desert can be transferred to a non-agent of the wrong, it was never truly *desert* to begin with. It was merely a quota of suffering required for cosmic balance. Transferred Merit is not *more* incoherent than standard karma; it is merely the honest admission of standard karma's logic. Both treat suffering as a utility to be allocated rather than a judgment anchored to an agent. If standard karma is coherent, Transferred Merit must be too, because both sever the link between the specific wrongdoer and the specific sufferer.

  The Preventive Calibration case forces a distinction between desert and consequentialism. Desert is inherently backward-looking; it justifies suffering *because* of a past act. Preventive Calibration justifies suffering *for the sake of* a future state of affairs (the prevention of a wrong). If the karmic mechanism permits this, it is not operating on desert. It is operating on a form of cosmic consequentialism, where the goal is the minimization of future wrongs or the optimization of character, regardless of past innocence. A theory of desert must forbid punishing the innocent, even if doing so produces good outcomes. If karma allows Preventive Calibration, it abandons the claim to be a theory of justice and becomes a theory of moral hygiene.

  Consequently, karma cannot function as a theory of moral desert within a person-stream ontology. It faces a dilemma: either it insists on strict identity, in which case retribution across stages is unjust (the Provenance Problem), or it relies on causal continuity, in which case it is indistinguishable from natural cause-and-effect or consequentialist management. The appeal to psychological continuity fails because memory and character can fade or be manipulated without negating the intuition that punishing a changed person for a past act is unjust.

  Finally, regarding moral luck: this framework does not dissolve luck; it relocates it. Proponents argue karma eliminates luck by ensuring every outcome is earned. However, being the later stage of a stream that contains past wrongdoing is itself a matter of luck. Stage-B does not choose to inherit the causal momentum of Stage-A. If Stage-B suffers for Stage-A's act, Stage-B is the victim of constitutive moral luck—the luck of being causally tied to a wrongdoer. The system claims to be a ledger of justice, but it functions as a lottery of birth and causal position. Therefore, the doctrine fails to secure the moral agency required for desert. It offers a causal story of suffering, which may be metaphysically consistent, but it cannot sustain the normative claim that the suffering is *merited*. To save karma, one must abandon desert; to save desert, one must abandon the person-stream.

  ***

  ### 3. Marking Scheme (20 Marks)

  **Move 1: Articulating the Provenance Problem (4 Marks)**
  *   **4 Marks:** Clearly distinguishes between *numerical identity* (required for desert) and *causal/psychological continuity* (supplied by the stream). Explains why causation alone cannot ground normative desert.
  *   **2 Marks:** Identifies the tension between stages but treats it as merely a metaphysical puzzle rather than a normative failure of desert.
  *   **0 Marks:** Fails to distinguish identity from causation; assumes continuity is sufficient without argument.
  *   *Failure Mode:* Treating the "no-self" doctrine as a conversation-stopper rather than a problem for accountability.

  **Move 2: Analysis of Transferred Merit (4 Marks)**
  *   **4 Marks:** Argues that if standard karma is coherent, Transferred Merit must be too (since both sever agent/sufferer identity). Concludes this reveals "desert" is actually "suffering quota."
  *   **2 Marks:** Dismisses Transferred Merit as obviously incoherent without comparing it to the standard case, missing the dialectical trap.
  *   **0 Marks:** Treats the case as a theological curiosity unrelated to the definition of desert.
  *   *Failure Mode:* Claiming voluntary assumption makes the suffering "deserved" by the volunteer, confusing consent with desert-base.

  **Move 3: Analysis of Preventive Calibration (4 Marks)**
  *   **4 Marks:** Identifies that backward-looking justification (desert) conflicts with forward-looking justification (consequentialism). Concludes that permitting prevention voids the desert claim.
  *   **2 Marks:** Notes the time-direction difference but fails to draw the normative conclusion that this changes the *type* of theory.
  *   **0 Marks:** Argues that preventing future wrongs is a form of "karmic justice" without defining justice.
  *   *Failure Mode:* Sliding from "this produces good states" to "this is just."

  **Move 4: Ontological Consistency (4 Marks)**
  *   **4 Marks:** Takes a determinate stance (e.g., "Karma cannot be desert"). Synthesizes the two cases to show the ontology undermines the normativity.
  *   **2 Marks:** Hedges ("It depends on the tradition") despite the stipulative instructions.
  *   **0 Marks:** Summarizes the prompt without advancing a thesis.
  *   *Failure Mode:* Surveying options rather than arguing for one.

  **Move 5: Moral Luck and Synthesis (4 Marks)**
  *   **4 Marks:** Correctly identifies that inheriting a stream is constitutive luck. Argues that karma relocates luck rather than dissolving it. Integrates this into the final conclusion.
  *   **2 Marks:** Mentions luck but treats it as a secondary issue unrelated to the Provenance Problem.
  *   **0 Marks:** Claims karma eliminates luck by definition without analyzing the inheritance mechanism.
  *   *Failure Mode:* Asserting that "causal connection" eliminates luck because it is not random.

  ***

  ### 4. Note on Moral Luck

  **Recommendation:** Fold Moral Luck into **Move 5 (Synthesis)** rather than creating a sixth marked point.

  **Reasoning:** The Moral Luck issue is not a separate philosophical problem from the Provenance Problem; it is the *implication* of the Provenance Problem. If a candidate understands why Stage-B suffering for Stage-A's acts is a desert failure, they inherently understand that Stage-B is the victim of constitutive luck. Making it a separate mark risks candidates treating it as a "bolt-on" paragraph (e.g., "Also, this involves luck") rather than integrating it into their argument about identity and justice.

  **Examiner Instruction:** In borderline scripts (e.g., 11/20), award the difference based on how well they handle Move 5. A candidate who sees that "being the continuation of a bad person" is unchosen luck demonstrates a deeper grasp of the normative stakes than one who simply accepts causal continuity as sufficient for justice. Do not penalize heavily if they use different terminology (e.g., "constitutive luck" vs. "lottery of birth"), provided the structural point is clear.
