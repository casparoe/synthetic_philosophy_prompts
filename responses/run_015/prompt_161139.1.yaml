answer: |-
  # Taxonomy of Suffering-Focused Ethics

  *   **Q1: Two-second pinprick vs. 10,000 years mild contentment. Can contentment outweigh?**
      *   **No (Threshold Exists)** → *T-View Family*
          *   **Q2: One person's minute of joy vs. billion people's five-second itch. Does joy outweigh?**
              *   **No** → **Leaf 1: Hard Lexical Negative Utilitarianism**
              *   **Yes** → *Soft Lexical (Within-Life Threshold)*
                  *   **Q3: Hyper-sensitive being (itch = our agony). Does itch trigger threshold?**
                      *   **Yes** → **Leaf 2: Sensation-Lexicalism**
                      *   **No** → **Leaf 3: Attitude-Lexicalism**
                  *   **Q4: Hour agony (memory erased) vs. hour tedium (remembered). Does erased agony trigger threshold?**
                      *   **Yes** → **Leaf 4: Objective Suffering Lexicalism**
                      *   **No** → **Leaf 5: Experiential Suffering Lexicalism**
                  *   **Q5: One-in-a-billion chance vast suffering vs. certainty modest pleasure. Is risk permissible?**
                      *   **No** → **Leaf 6: Risk-Averse Lexicalism**
                      *   **Yes** → **Leaf 7: Risk-Weighted Lexicalism**
      *   **Yes (No Threshold)** → *Non-T-View Family*
          *   **Q6: Billion people's five-second itch vs. one person's minute of joy. Do itches aggregate to outweigh?**
              *   **No** → **Leaf 8: Incommensurability View**
              *   **Yes** → *Aggregative View*
                  *   **Q7: Choosing agony to spare others mild tedium. Is this rational/required?**
                      *   **Yes** → **Leaf 9: Prioritarian Suffering View**
                      *   **No** → **Leaf 10: Classical Utilitarianism**
                  *   **Q8: Creating barely net-positive life vs. preventing already-occurring severe pain. Priority?**
                      *   **Prevent Pain** → **Leaf 11: Negative Prioritarianism**
                      *   **Create Life** → **Leaf 12: Total View Utilitarianism**

  ### Unoccupied Logical Cells
  *   **Hard Lexical + Risk-Permitted:** Incoherent; if suffering is lexical, any non-zero risk of threshold breach forbids the action.
  *   **Sensation-Lexicalism + Experiential Memory:** Unattractive; claims sensation matters fundamentally but erased sensation does not trigger threshold.
  *   **Classical Utilitarianism + Prevent Pain Priority:** Incoherent; linear trade-offs cannot prioritize prevention over net-positive creation without weighting.

  ***

  **Note on Structure**
  Questions 1, 6, and 7 represent standard carve-ups in normative ethics regarding aggregation and sacrifice. The distinction between Sensation and Attitude (Q3) is contested among suffering-focused ethicists but often conflated in broader literature. Q4 (Memory) and Q5 (Risk) are my invented distinctions to stress-test the threshold's metaphysical basis. Q8 isolates population ethics commitments often hidden within suffering-focused views. Do not treat the binary splits as exhaustive; they are pedagogical tools to locate logical commitments.
