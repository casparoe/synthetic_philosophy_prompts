answer: |-
  ### The Population Value Taxonomy

  This tree is designed to sort your group's intuitions about the *value* of population size, assuming we have the power to influence it. It avoids labels until the very end. Work through the six nodes in order. At each node, choose the answer that best reflects your considered judgement on the specific case presented.

  #### Node 1: The Source of Value
  **Case:** Imagine a world where adding more people has no effect on innovation, fiscal sustainability, or environmental strain. The new people live lives worth living, but they produce nothing of note and consume resources that would otherwise remain unused.
  **Question:** Is the world *better* simply because there are more people experiencing these lives, or is population size only valuable insofar as it leads to other goods (like stability or discovery)?
  *   **A:** Only valuable for contingent benefits (pensions, innovation, resilience).
  *   **B:** Valuable in itself (either for the welfare contained or the scale of civilisation).

  > *Path A leads to **Leaf 1 (Instrumentalists)**.*
  > *Path B continues to Node 2.*

  #### Node 2: Mere Addition
  **Case:** We can add one extra person to the world. Their life will be happy, but only barely worth living. No one else is affected; no existing people are made worse off.
  **Question:** Does adding this life make the outcome *better*?
  *   **A:** Yes, a happy life is always a gain.
  *   **B:** No, not unless it meets a certain threshold of quality, or it doesn't matter at all.

  > *Path B suggests you reject the idea that existence is a benefit by default. Continue to Node 3.*
  > *Path A suggests you accept impersonal value. Continue to Node 3.*
  > *(Note: This node begins to separate Person-Affecting views from Impersonal views, though both may answer 'No' for different reasons.)*

  #### Node 3: The Repugnant Trade-off
  **Case:** You must choose between:
  1.  **8 billion people** at a very high welfare level (70/100).
  2.  **12 billion people** at a lower, but still positive, welfare level (55/100).
  **Question:** Which outcome is better?
  *   **A:** 12 billion (The total sum of welfare is higher).
  *   **B:** 8 billion (The average quality of life is more important, or the drop is unacceptable).

  > *Path A leans towards Totalism or Scale-Value.*
  > *Path B leans towards Averagism, Critical-Level, or Prioritarianism.*
  > *Continue to Node 4.*

  #### Node 4: The Symmetry of Suffering
  **Case:** Consider the long-run future. Suppose you believe it is more likely to be astronomically bad (dominated by suffering) than astronomically good.
  **Question:** Is creating a new happy life *as good* as preventing a new miserable life is *bad*?
  *   **A:** Yes, they are symmetrical trade-offs.
  *   **B:** No, preventing suffering is far more urgent than creating happiness (or creating happiness has no weight compared to preventing suffering).

  > *Path B leads to **Leaf 7 (Suffering-Focused)** or **Leaf 6 (Asymmetry/Antinatalist)** depending on Node 2 answers.*
  > *Path A continues to Node 5.*

  #### Node 5: Existing Priority (Non-Identity Light)
  **Case:** For the same cost, you can either:
  1.  **Save a 40-year-old** who will live another 40 happy years.
  2.  **Cause a new person to exist** who will live 80 happy years.
  **Question:** Do you have a stronger reason to save the existing person, or is the choice morally neutral?
  *   **A:** Save the existing person (they have a priority claim).
  *   **B:** It is neutral (a life is a life, regardless of when it starts).

  > *Path A leads to **Leaf 5 (Person-Affecting / No-Difference)**.*
  > *Path B continues to Node 6.*

  #### Node 6: The "Glossed Over" Split (Scale vs. Sum)
  **Case:** Imagine two civilisations with the *exact same sum total of individual welfare*.
  1.  **Civilisation X:** 10 billion people engaged in a massive, cooperative scientific and cultural project.
  2.  **Civilisation Y:** 20 billion people living isolated, contented lives with no collective endeavour.
  **Question:** Is Civilisation X potentially more valuable *over and above* the sum of individual lives?
  *   **A:** No, value is exhausted by individual welfare.
  *   **B:** Yes, there is value in the scale and collective capacity of a civilisation itself.

  > *Path A leads to **Leaf 2 (Totalism)** or **Leaf 4 (Critical-Level)**.*
  > *Path B leads to **Leaf 8 (Scale-Value)**.*

  ---

  ### Locating the Leaves

  Here is where the standard positions land in the tree. Note that some paths converge on the same leaf, while others diverge on subtle points.

  1.  **Instrumentalists (Node 1A):** Population size matters only for fiscal sustainability, innovation, or recovery from catastrophe. They have no intrinsic view on whether 8bn is better than 12bn; it depends entirely on the empirical context.
  2.  **Total Utilitarians (Node 1B, 2A, 3A, 4A, 5B, 6A):** The classic "more is better" view. They accept Mere Addition, choose the 12bn option, treat suffering and happiness symmetrically, are neutral between saving existing and creating new lives, and deny Scale-Value.
  3.  **Averagists (Node 1B, 2B/3B, 3B):** They reject the 12bn option because it lowers the average. They often reject Mere Addition if the new life is below the current average.
  4.  **Critical-Level Utilitarians (Node 1B, 2B, 3B):** Similar to Averagists but posit a "critical level" of welfare. Lives below this level (even if worth living) add no value. They avoid the Repugnant Conclusion without strictly averaging.
  5.  **Person-Affecting / No-Difference (Node 1B, 2B, 5A):** They argue that an outcome can only be better if it is better *for someone*. Adding a new person benefits no one (since that person wouldn't otherwise exist to be deprived), so Mere Addition is neutral. They prioritise the existing 40-year-old over the new person.
  6.  **Asymmetry / Antinatalist (Node 1B, 2B, 4B):** They hold that while suffering is bad, creating happiness is not *good* (or is less good). They reject Mere Addition and are highly sensitive to the risk of astronomical suffering.
  7.  **Suffering-Focused (Node 1B, 4B):** Distinct from Antinatalists, they may accept some happiness matters, but the prevention of extreme suffering lexically dominates. In the astronomical risk case, they argue against expansion.
  8.  **Scale-Value (Node 1B, 2A, 3A, 6B):** They agree with Totalists on most welfare cases (12bn is better) but diverge at Node 6. They believe a larger, more complex civilisation has intrinsic value beyond the sum of its parts.
  9.  **Prioritarian / Threshold (Node 1B, 3B):** They believe size is beside the point; what matters is the condition of the worst-off. If 12bn implies more poverty or a lower floor, it is worse, regardless of the sum.

  ### Unoccupied Space and Indistinguishability

  **Unoccupied Combinations:**
  *   **Totalism + Person-Affecting Priority:** It is logically incoherent to believe value is determined by the total sum (Totalism) but that existing people count for more than potential people (Node 5A). If a new life adds to the total, it should weigh equally. This space is empty because the aggregation method contradicts the priority claim.
  *   **Averagism + Pro-Natalist Intrinsic:** It is rare to find someone who believes population size is intrinsically valuable (Node 1B) but also an Averagist (Node 3B). Averagism typically leads to scepticism about expansion, as adding lives usually lowers the average. Those who want more babies usually rely on Instrumentalism (Node 1A) or Totalism (Node 3A).

  **Indistinguishable Leaves:**
  *   **Totalism vs. Critical-Level (Low Critical Level):** If the "critical level" is set very low (e.g., just above zero), Critical-Level Utilitarianism will yield the exact same verdict as Totalism on almost all real-world cases (including the 8bn vs 12bn case). Your tree cannot separate them unless you probe the "Mere Addition" case with a life that is happy but below the critical threshold. In practice, these two leaves often function identically.
  *   **Suffering-Focused vs. Antinatalist:** On the question of *encouraging births*, these often converge on "don't". However, they are distinct: the Antinatalist thinks creating life is inherently a harm; the Suffering-Focused thinker might allow it if suffering is guaranteed to be low. The tree groups them near Node 4, but they are technically distinct leaves.

  ### Where Impossibility Results Bite

  *   **The Repugnant Conclusion:** This squeezes **Totalists (Leaf 2)** and **Scale-Value (Leaf 8)**. Both are committed to saying the 12bn world (welfare 55) is better than the 8bn world (welfare 70), provided the total sum is higher. If your group finds this conclusion unpalatable, these leaves are the ones under pressure.
  *   **The Sadistic Conclusion:** This bites **Averagists (Leaf 3)** and **Critical-Level (Leaf 4)**. To avoid the Repugnant Conclusion, they must sometimes accept that adding miserable people is *worse* than adding happy people, which can lead to counter-intuitive results where one prefers a smaller population with more suffering to avoid lowering the average.
  *   **The Non-Identity Problem:** This bites **Person-Affecting Views (Leaf 5)**. If a policy changes who exists (e.g., climate policy affecting conception dates) but the resulting people have lives worth living, the Person-Affecting view struggles to say the policy was wrong, even if a different policy would have produced happier people.

  ### A Note on Policy vs. Outcome

  Finally, a warning for your discussion: **None of these leaves automatically hand you a reason to encourage births.**

  *   **Totalists** believe a larger population is *better*, but if resources are fixed, adding people lowers welfare per head. They might conclude we should maintain current size rather than grow.
  *   **Instrumentalists** are the only ones who might argue for births *purely* to fix dependency ratios, even if the intrinsic value of those lives is neutral.
  *   **Suffering-Focused** and **Antinatalist** leaves see encouraging births as actively harmful.
  *   **Person-Affecting** views leave it contingent: if the new people will be happy, it's permissible, but not required.

  Ensure your group distinguishes between "A world with more people is better" (an axiological claim) and "We should subsidise childcare" (a policy claim). The former does not entail the latter without empirical premises about resources, environmental limits, and welfare.
