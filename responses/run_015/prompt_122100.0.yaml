answer: |-
  1. This project asks whether the wrong of a revealed, aesthetically indistinguishable forgery constitutes a residual institutional harm, specifically epistemic pollution, rather than mere deception. Current scholarship leaves this open by framing the problem exclusively as either a perceptual failure to distinguish copies or a historical loss of causal contact with the artist.

  2. The conceptual method will analyse the normative structures of provenance-tracking systems rather than relying on empirical art history or psychology. By treating the museum archive as an epistemic institution, the research will isolate how forgery corrupts the stability of objects as nodes within a public record.

  3. Success entails demonstrating that institutional trust degrades independently of individual belief, thereby establishing forgery as a systemic epistemic vice. Failure would result if the alleged harm collapses back into standard accounts of deception or aesthetic deficiency upon rigorous scrutiny.

  4. The primary deliverable will be a policy framework outlining how institutions might audit their provenance protocols to mitigate epistemic pollution. This document will offer curators and historians a philosophical justification for retaining revealed forgeries within archives as distinct from authentic works.

  5. In six months, the project can realistically formulate the theoretical account of institutional harm but cannot resolve every edge case regarding digital reproductions. The scope is therefore limited to physical artefacts within traditional museum contexts to ensure a robust initial model.
