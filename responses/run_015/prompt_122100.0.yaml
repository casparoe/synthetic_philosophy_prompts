prompt: |-
  I'm drafting a proposal for a six-month philosophical research grant on fakes, forgeries, and the value of originals, and I need you to refine my half-formed idea into a precise, fundable question. The standard literature tends to frame the problem of perfect forgeries either as a perceptual failure—we overlook subtle aesthetic differences—or as an historical deception, where value resides in causal contact with the artist; I want to push past both and ask whether the real damage of forgery is institutional rather than individual, specifically the corruption of a collective provenance-tracking system that allows curators, markets, and historians to treat an object as a stable node in a public record. The central research question, then, is whether the wrong of a revealed, aesthetically indistinguishable forgery can be fully accounted for by deception, or whether there is a residual institutional harm—perhaps a kind of epistemic pollution—that persists even when every viewer knows the object is inauthentic.

  Please present the proposal as exactly five numbered points, each comprising one or two sentences only, with no introductory or concluding paragraph: first, state the precise question and why current answers leave it open; second, describe the conceptual method, which should analyse institutional practices rather than rely on empirical art history or psychology; third, specify what success and failure would look like for this project; fourth, identify a concrete deliverable useful to people working on provenance or museum policy; and fifth, offer an honest assessment of what can realistically be achieved in six months. Do not ask for bibliographies, reading lists, or citations—I will supply those myself—and please write in formal British English.
