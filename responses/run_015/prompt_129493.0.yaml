prompt: |-
  In AI ethics threads people keep comparing a convincing chatbot to counterfeit currency -- it passes every behavioral test, but there's no "gold backing", so letting it circulate debases the whole concept of a person. They invoke Dennett's idea of counterfeit people to argue that perfect mimicry still shouldn't earn moral standing. How far does the money analogy hold? Give me the correspondence table -- mint, reserve, detector, debased economy -- then the breaks, especially around whether consciousness is like intrinsic value or just functional acceptance. Does Dennett's actual worry depend on this economic framing, or is the analogy smuggling in a commodity theory of mind that makes the conclusion look inevitable? And if the mapping collapses, does his case fall with it, or is there a cleaner version that doesn't need the mint metaphor?
