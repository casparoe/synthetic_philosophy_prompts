      The deciding factor lies in how Abraham expects the trial to end. If he expects to lose Isaac permanently, the relational model holds. If he expects Isaac back "by virtue of the absurd," the instrumental model gains traction, but only if the "absurd" is not itself a calculation. I will focus on the passages where Abraham's expectation is described to decide between these models.

