      Most secondary discussions frame *Fear and Trembling* around a binary: is Abraham a murderer or the father of faith, and can a divine command override universal morality? This framing concedes the point I wish to press. By asking whether the suspension is *justified*, these readings assume we already know what the suspension *is*. They treat the teleological suspension as a settled mechanism that simply needs moral evaluation. This overlooks the internal tension of the phrase itself. If the suspension is teleological in an ordinary means-end sense, it risks collapsing back into the ethical reasoning it claims to suspend—a calculation of outcomes where the end justifies the means. If the *telos* is instead the relation to God itself, the term "teleological" becomes misleading, as a relation is not an end that justifies action. Resolving this ambiguity is prerequisite to deciding whether Abraham's faith is a higher ethics or a rupture with ethics entirely.

