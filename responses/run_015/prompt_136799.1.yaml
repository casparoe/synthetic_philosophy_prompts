  I counted up the benefits of years,
  And weighed the stone against the peace it gave.
  Each joy extracted from its native ground,
  As if the sum were all that mattered now.
  The friend reduced to mere advantage gained,
  The garden valued for the quiet breath,
  Assigning to each its separate space,
  To tally up the profit and the loss.
  But severing the tie to find the source
  Dissolves the very good we sought to see.
  For value lives where elements are bound,
  Not in the parts analyzed by the mind.
  It belongs to no specific place,
  Yet vanishes when wholeness is undone.
