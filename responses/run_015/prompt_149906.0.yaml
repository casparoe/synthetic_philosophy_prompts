  2.  **Deconstruct the Core Concepts:**

      *   **Mises (1920):** Focuses on *private property* and *money prices*. Without private ownership of means of production, there's no exchange. Without exchange, there are no money prices. Without money prices, there's no common denominator for comparison (profit/loss). Therefore, rational calculation is *impossible*. It's an *a priori* praxeological argument.
      *   **Hayek (1937, 1945):** Focuses on *information*. Even if you have the equations (which Mises said you couldn't solve), the data isn't given. Knowledge is dispersed, tacit, local, and fleeting. The price system is a telecommunications mechanism. Centralization loses the nuance. It's an *empirical/epistemological* argument.
      *   **Lange (1936-37):** Proposes "Market Socialism." State owns means of production. CPB sets prices. Managers follow rules (minimize cost, equate marginal cost to price). CPB adjusts prices based on surpluses/shortages (trial and error). Claims to simulate the market.

  3.  **Evaluate Lange against Mises:**
      *   *Mises's Objection:* Prices emerge from entrepreneurial judgment over *owned* assets. Shadow prices are parametric functions, not outcomes of asset transfer.
      *   *Lange's Reply:* We don't need asset transfer; we need the *ratio* for calculation.
      *   *Verdict:* Lange arguably solves the *arithmetic* problem (you can have numbers), but Mises would say he misses the *institutional* prerequisite (property rights drive the discovery of those numbers).

  4.  **Evaluate Lange against Hayek:**
      *   *Hayek's Objection:* The CPB doesn't know *why* there's a shortage. Is it a temporary glitch? A shift in taste? A supply chain break? The *context* matters.
      *   *Lange's Reply:* Managers on the ground have the local info; they just follow rules. The CPB only aggregates.
      *   *Verdict:* This is the weak point. Managers in socialism aren't residual claimants. They have no incentive to reveal true costs or innovate. The "rules" require interpretation. Hayek's tacit knowledge isn't just "local data"; it's the *ability to use* that data.

  5.  **Address the "Shadow Prices" Question:**
      *   Are they real prices? Real prices reflect opportunity costs determined by competing claims on resources. Shadow prices in Lange's model are administrative parameters adjusted by bureaucracy. They lack the *risk* component.
