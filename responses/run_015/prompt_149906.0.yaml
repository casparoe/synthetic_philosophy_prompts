  6.  **Address the "Separation" Question (Calculation vs. Knowledge):**
      *   Is it a mistake to separate them? Mises's calculation problem *presupposes* the knowledge problem in a way. You can't calculate without the knowledge embedded in prices. But Mises focuses on the *institutional generation* of prices, while Hayek focuses on the *transmission/utilization* of the knowledge within them.
      *   Lange treats them as separable (we can compute the equilibrium if we simulate the rules). Hayek/Mises say the equilibrium is a process, not a destination.

