  **JOINT STATEMENT ON DEFENSE POSTURE, CIVIC OBLIGATION, AND STRATEGIC AUTONOMY**

  **Issued by:** The Working Group on Defense Models and Democratic Theory
  **Date:** October 26, 2023
  **Signatories:** Proponents of Conscription-Integrated Democratic Citizenship; Proponents of Professional Volunteer Defense Forces

  ### I. SHARED CLAIMS AND COMMON GROUND

  We, the undersigned, acknowledge that while our normative priorities differ, we operate within a shared strategic reality. We affirm the following propositions as factual or mutually acceptable premises for further debate:

  1.  **The Strategic Logic of Armed Neutrality:** We agree that "armed neutrality" is not a passive stance but an active doctrine requiring the capacity to impose unacceptable costs on an aggressor without relying on external security guarantees. Both sides accept that credibility in this doctrine depends on the perceived will and capability to defend national territory independently.
  2.  **The Swiss Militia Structure:** We acknowledge that the Swiss model integrates military service with civilian life, maintaining a large cadre of trained citizens who remain in the reserve. Both sides accept that this structure creates a high threshold for foreign occupation but requires sustained political will and logistical investment to maintain equipment readiness among the civilian population.
  3.  **The Finnish Reserve-Based Territorial Defense:** We agree that Finland's security architecture relies on a large, conscription-trained reserve capable of rapid mobilization to defend a long border. Both sides accept that this model prioritizes territorial denial and attrition over expeditionary power projection.
  4.  **Sweden's 2017 Reactivation:** We accept as fact that Sweden's reinstatement of conscription was driven by a deteriorating regional security environment and a shortage of personnel within the professional framework. We further agree that the new model is selective and gender-inclusive, differing from the universal male-only service of the 20th century.
  5.  **The Neutrality-Credibility Paradox:** We recognize the tension wherein maintaining strict neutrality requires defense autonomy, but achieving that autonomy is costly. A professional force capable of matching a conscript mass may require budgetary allocations that strain the state, potentially creating dependency on alliance structures for cost-sharing or strategic depth. Conversely, a conscript force may ensure autonomy but risks political fragility if public support wavers.
  6.  **Democratic Integrity:** Both sides agree that the military must remain subordinate to civilian democratic control and that the method of recruitment impacts the relationship between the citizen and the state.

  ### II. TABLE OF DISAGREEMENTS

  The following table outlines our remaining disputes. We have phrased each position in language its proponents endorse to ensure steel-manning. We distinguish between *Substantive* disagreements (conflicts over values or predicted outcomes) and *Verbal* disagreements (conflicts over the definition of terms).

  | Issue | Position A: Conscription-Integrationist | Position B: Professional-Volunteerist | Type |
  | :--- | :--- | :--- | :--- |
  | **Nature of Service** | Universal service is a civic duty analogous to taxation or jury duty; it prevents the military from becoming a distinct caste separate from the people. | Mandatory service is a form of coerced labor that violates individual autonomy; defense should be a career choice like any other public service profession. | Substantive |
  | **Source of Deterrence** | Deterrence rests on the threat of protracted territorial resistance by a mobilized population, making conquest too costly to attempt. | Deterrence rests on high-readiness technological superiority and interoperability with allies, making aggression too risky to attempt. | Substantive |
  | **Social Cohesion** | Shared hardship in training creates a "school of the nation" that bridges class and regional divides, strengthening democratic resilience. | Social cohesion is better served by a meritocratic institution where citizens serve only if motivated, avoiding the resentment associated with coercion. | Substantive |
  | **Strategic Adequacy** | A professional force is insufficient to hold territory against a mass-mobilization adversary without immediate alliance reinforcement, compromising neutrality. | A mass reserve is obsolete in an era of precision warfare; a smaller, highly trained force is more adaptable and sustainable for modern threat profiles. | Substantive |
  | **Definition of "Legitimacy"** | Legitimacy requires the *potential* for universal participation; the burden of violence must be legally shareable by all to be democratically authorized. | Legitimacy requires *consent*; the state's right to use force is authorized by representatives, not by the physical participation of every citizen. | Verbal |
  | **Definition of "Neutrality"** | Neutrality requires structural independence from alliance command structures and logistics, necessitating self-sufficiency. | Neutrality is a diplomatic status that can be maintained while procuring equipment or training alongside partners, provided no mutual defense treaty exists. | Verbal |

  ### III. CORE CRUXES AND PROBATIVE CASES

  We identify two fundamental cruxes where our disagreement is decisive. For each, we have identified a concrete institutional feature or comparative case that both sides agree is probative. We record in advance what each camp predicts this evidence demonstrates.

  #### Crux 1: Democratic Legitimacy and the Shared Burden
  **The Question:** Does democratic legitimacy regarding the use of lethal force require a universally shared burden of defense, or is representative authorization sufficient?

  *   **Probative Case:** The comparative resilience of national will during prolonged crisis in societies with universal service histories versus those with long-standing volunteer forces.
  *   **Conscription-Integrationist Prediction:** This case will demonstrate that societies with recent universal service histories exhibit higher tolerance for casualties and longer endurance in siege or crisis conditions because the risk of loss is distributed across the social fabric, preventing the war from becoming "someone else's problem."
  *   **Professional-Volunteerist Prediction:** This case will demonstrate that volunteer forces maintain higher morale and ethical standards over time because personnel are self-selected for commitment. It will show that public support in volunteer societies remains stable so long as the war is perceived as just, regardless of personal risk, and that conscription can actually fracture legitimacy if compliance is resisted.

  #### Crux 2: Credible Neutrality and Force Structure
  **The Question:** Is credible neutrality structurally dependent on a mass-mobilizable reserve, or can a standing professional force achieve the same deterrent effect without alliance integration?

  *   **Probative Case:** The comparative mobilization timelines and sustained combat mass of the Finnish reserve model versus a hypothetical all-volunteer equivalent scaled to the same defense budget.
  *   **Conscription-Integrationist Prediction:** This comparison will show that a volunteer force of equivalent cost would lack the manpower density to defend a long border against a larger neighbor. It will demonstrate that without the threat of mass mobilization, a neutral state becomes vulnerable to "fait accompli" aggression, forcing it to seek alliance protection and thereby losing neutrality.
  *   **Professional-Volunteerist Prediction:** This comparison will show that modern firepower and sensor technology allow a smaller professional force to achieve denial effects previously requiring mass. It will demonstrate that the high cost of maintaining conscript equipment reserves diverts funds from modernization, rendering the force capable of mobilization but incapable of surviving high-intensity combat, thus failing the credibility test.

  ### IV. ADDRESSING THE NEUTRALITY-CREDIBILITY PARADOX

  We explicitly acknowledge the **Neutrality-Credibility Paradox** as the central tension of this collaboration.

  1.  **The Autonomy Cost:** We agree that defense autonomy is expensive. The Conscription-Integrationist argues that conscription is the only fiscally sustainable way to maintain the mass required for autonomy. The Professional-Volunteerist argues that conscription carries hidden economic costs (labor market disruption) and that a professional force, while expensive, allows for deeper specialization that reduces long-term dependency on foreign logistics.
  2.  **The Alliance Trap:** We agree that if a professional force is too small to guarantee survival, the state must join an alliance. The Conscription-Integrationist views this as the failure of neutrality. The Professional-Volunteerist views this as a rational evolution of security strategy where neutrality is less valuable than collective defense.
  3.  **Path Forward:** We commit to evaluating future policy not merely on ideological preference, but on whether the chosen model can resolve this paradox without compromising the core value each side holds paramount: for the Integrationist, the democratic equality of shared risk; for the Volunteerist, the ethical imperative of individual liberty.

  ***

  **Signed,**

  *The Conscription-Integrationist Working Group*
  *The Professional-Volunteerist Working Group*
