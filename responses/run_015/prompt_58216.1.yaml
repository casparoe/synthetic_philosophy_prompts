prompt: |-
  So we had this endless cookout debate last weekend and my uncle kept coming back to the idea that a country is basically like a house — you lock your doors at night, you decide who sleeps on the couch, and nobody thinks you are mean for not letting the whole neighborhood move in. He was using it to say asylum is pure charity, like we can take a few people if we feel generous but no one outside has any real claim to get in, and people fleeing war vs people looking for better jobs are all just strangers at the door. My cousin who volunteers with resettlement kinda pushed back but didn't have a clean answer, and tbh I feel like the house thing is doing a lot of hidden work.

  The part that got me stuck is my friend threw in two wrinkles and my uncle just waved them away. One was, what if its not a single-family house but more like a big co-op apartment building where you own your unit but the hallways, heat, and roof are shared and decisions about spare rooms affect everyones bills — does that change who gets to decide? The other was, what if you or the previous owners of your house helped smash the neighbors windows, like you started a war there or pumped out most of the pollution that flooded their place, so now they are at your door partly because of stuff you did. I beleive those matter but I can't quite spell out why.

  Can you audit the house analogy for me? Lay out what maps to what in a little table — owner, guest, trespasser, door, property taxes, whatever — then say where it breaks down and what it quietly smuggles in about ownership and consent and having no prior connection that doesn't actually fit countries and refugees. Tell me which disanalogies actually matter for my uncles conclusion that we owe nothing except optional charity, and whether that conclusion survives once you fix the mapping, and if the house picture is hopeless suggest a better everyday analogy that handles the co-op costs and the smashed-windows responsibility bits. Please end your whole answer with a last line that starts with Verdict: and then one of holds, partly-holds, or fails for the house analogy.
