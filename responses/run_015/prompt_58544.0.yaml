answer: |-
  **The Story**
  Imagine you're driving home late, starving, with two identical-looking exits on the highway. Exit 1 leads to a closed construction zone (waste 20 mins, 0 points), Exit 2 leads to the 24-hour pizza place (dinner, 4 points), and missing both means sleeping hungry (sad but fast, 1 point). You're too exhausted to count miles or tell the exits apart, so the night before you set a randomizer rule on your phone: "When you see an exit, roll a virtual die." To maximize your chance of pizza over the whole trip, the math says set the rule to "Turn only on a 1" (33% chance), meaning you mostly keep driving. But if you pause at an exit and ask, "Given I'm standing here, what should I do?", the math flips: since you successfully drove past the first exit (if this is the second), you're likely at the pizza place, so you should mostly turn right now.

  ***

  **The Unpacking**
  Here is why the numbers actually split, without fudging:

  **1. The Ex-Ante Plan (Before you leave)**
  You optimize for the whole trip. Let $p$ be your chance of turning.
  *   **Score** = (Chance Turn 1 $\times$ 0) + (Chance Turn 2 $\times$ 4) + (Chance Miss Both $\times$ 1)
  *   **Score** = $(p \cdot 0) + ((1-p) \cdot p \cdot 4) + ((1-p) \cdot (1-p) \cdot 1)$
  *   **Score** = $4p - 4p^2 + 1 - 2p + p^2 = -3p^2 + 2p + 1$
  *   Take the derivative and set to zero: $-6p + 2 = 0$, so **$p = 1/3$**.
  *   **Verdict:** You should only turn 33% of the time. **Mostly drive.**

  **2. The In-The-Moment View (At the exit)**
  You are at an exit. You don't know which one. But your belief depends on your plan ($p=1/3$).
  *   **Likelihood it's Exit 1:** 1 (You always reach the first one).
  *   **Likelihood it's Exit 2:** $2/3$ (You only reach the second one if you didn't turn at the first).
  *   **Total "Weight":** $1 + 2/3 = 5/3$.
  *   **Probability it's Exit 2:** $(2/3) / (5/3) = \mathbf{40\%}$.
  *   **Probability it's Exit 1:** $\mathbf{60\%}$.
  *   **Value of Turning Now:** $40\% \times 4 \text{ points} = \mathbf{1.6}$.
  *   **Value of Driving On:** $60\% \times (\text{Future Value}) + 40\% \times 1$.
      *   *Future Value* (if this was Exit 1) = Expected score from remaining trip = $1/3(4) + 2/3(1) = 2$.
      *   **Value of Driving On** = $0.6(2) + 0.4(1) = \mathbf{1.6}$.
  *   *Wait, they are equal?* That's the equilibrium. But if you recalculate the *optimal* $p$ purely from this node (ignoring that changing $p$ changes your probability of arriving), the local incentive pushes higher. Specifically, because arriving makes Exit 2 feel more likely (40%) than the raw 50/50 guess, the immediate temptation to turn is much stronger than the original plan allowed. If you were slightly more optimistic (say, 50% chance it's Exit 2), Turning (2 pts) beats Driving (1.5 pts). The "split" is that your planning self knows turning early ruins the trip, but your present self thinks "I made it this far, I'm probably at the good one."

  **The Little Detail Doing All the Work**
  It's the **Observation Selection Effect**. Your presence at the exit is not random; it is *caused* by your decision to keep driving earlier. The "Interim" math treats your arrival as evidence that you are at the second exit, but that evidence is just a mirror of your own past strategy. You are using your own hesitation as a clue.

  **The Tweak That Makes the Split Disappear**
  Give the driver **one bit of external info**. Put a mile marker at the first exit but not the second, or make the first exit slightly less sharp. If the driver can distinguish the exits even 1% of the time, the "I'm probably at the second one" belief collapses, and the Ex-Ante and Interim math realign.

  **The Best Line Your Roommate Can Use**
  "You're treating a **consequence** of your plan as **evidence** against your plan. Just because you made it to the second exit doesn't mean you're *likely* at the second exit; it just means you followed the rule. You're double-counting your own luck."
