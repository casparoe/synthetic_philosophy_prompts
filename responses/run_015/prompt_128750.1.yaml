  2. The traditional view permits Elena to remain silent and stay married, reasoning that the sacramental bond relies on external fidelity and duty rather than the fluctuating transparency of internal emotional states.

  3. Russell's view requires Elena to confess the attachment and potentially restructure the relationship, reasoning that concealment creates psychological harm and undermines the friendship basis essential to a valid marriage.

  4. The precise feature forcing Russell into the stricter position is the prioritization of psychological authenticity over institutional stability, making the burden of truth heavier than the burden of silence.

  5. A defender of the traditional view could argue this scenario cheats by misrepresenting sacramental obligations as mere external compliance, ignoring that true sacramental marriage also demands internal conversion and charity which might likewise require difficult honesty.
