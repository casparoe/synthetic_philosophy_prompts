answer: |-
  ### 1. The Three Split-Questions

  First, is individual freedom conceptually prior to communal belonging, or is it constituted by membership? *Case:* Can a person define their life plan before joining a society, or only within one? Second, is deep value pluralism permanent, or is it overcomeable (provisional/illusion)? *Case:* Should the state remain neutral among conceptions of the good, or promote a specific ethos? Third, does the right to exit take unconditional priority, or is it restricted (conditional/none)? *Case:* May a member leave a mandatory worship community without penalty, or only if no harm occurs, or never? For this taxonomy, splits two and three are bifurcated: pluralism is either permanent or overcomeable; exit is either unconditional or restricted.

  ### 2. The Tree and Leaves

  1.  **Rawlsian Political Liberalism** (Prior, Permanent, Unconditional): *Awkward Commitment:* It must treat comprehensive doctrines as private hobbies, risking political alienation.
  2.  **Perfectionist Liberalism** (Prior, Overcomeable, Unconditional): *Awkward Commitment:* It must promote specific goods without violating the prior right to choose them.
  3.  **Unnamed Leaf A** (Prior, Permanent, Restricted): *Gap Diagnosis:* Incoherence; prioritizing freedom while restricting exit contradicts the priority claim.
  4.  **Civic Republicanism** (Prior, Overcomeable, Restricted): *Awkward Commitment:* It must treat civic duty as a free choice that becomes obligatory upon participation.
  5.  **Unnamed Leaf B** (Constituted, Permanent, Unconditional): *Gap Diagnosis:* Unattractiveness; constituted identity implies binding ties, making unconditional exit psychologically implausible.
  6.  **Taylor-Style Recognition Communitarianism** (Constituted, Permanent, Restricted): *Awkward Commitment:* It must demand recognition from others while admitting their identities are equally constituted and potentially incompatible.
  7.  **Civic-Nationalist Communitarianism** (Constituted, Overcomeable, Unconditional): *Awkward Commitment:* It must treat national ethos as constitutive yet allow members to dissolve that constitution at will.
  8.  **MacIntyre-Style Tradition Communitarianism** (Constituted, Overcomeable, Restricted): *Awkward Commitment:* It must treat rival traditions as incommensurable while claiming one tradition objectively supersedes them.

  ### 3. Unoccupied Spaces and Separation Failures

  The two unnamed leaves reveal structural tensions. Leaf A (Prior/Permanent/Restricted) is logically incoherent because restricting exit undermines the conceptual priority of freedom. Leaf B (Constituted/Permanent/Unconditional) is psychologically unattractive, positing deep communal bonds that vanish upon individual whim. A separation failure exists between Civic-Nationalism and MacIntyre-style Communitarianism; both occupy the Constituted/Overcomeable branch and differ only on the degree of exit restriction (conditional vs. none). This distinction is thin, relying on whether the community is viewed as a voluntary nation or an inescapable tradition, which the binary split struggles to capture without nuance.

  ### 4. Note on Textbook Comparisons

  Standard textbooks typically contrast liberalism and communitarianism as monolithic blocks opposing individual rights versus communal goods. This taxonomy differs by disaggregating those labels into specific conceptual commitments. It reveals that Civic Republicanism aligns more closely with Liberalism on the priority of freedom than with MacIntyre on the constitution of identity, demonstrating that the debate is not a binary clash but a multidimensional space of overlapping philosophical commitments.
