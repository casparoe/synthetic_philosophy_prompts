      *   *Cranes:* Bottom-up mechanisms that build complexity upon existing complexity (e.g., natural selection, neural networks). Dennett loves these.
      *   *Dennett's Goal:* To show that Darwinism provides cranes all the way down, eliminating the need for skyhooks.
      *   *The User's Challenge:* If you push reductionism hard enough ("greedy reductionism"), the difference between a mechanism built from below (crane) and a seemingly magical explainer (skyhook) vanishes. Why? Because *any* stable higher-level pattern looks like a foundation (hook) to the level below it, but is actually just a compressed history of lower-level interactions.

  3.  **Formulate the Core Argument (The "Collapse"):**
