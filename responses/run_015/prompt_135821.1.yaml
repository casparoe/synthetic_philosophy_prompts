  Please argue that Dennett's cranes-vs-skyhooks distinction actually collapses if you take greedy reductionism seriously - if every decent explaination is reducible downward, then a 'crane' is just a skyhook seen from below, and the whole distinction becomes rhetorical rather than metaphysical. Don't just summarise Dennett; defend the collapse. You might use the idea that emergent stability in complex systems is really just compressed evolutionary history, not an independent explanatory level that needs its own ontological category. There's probably a typo or two in my framing but you get the gist.
