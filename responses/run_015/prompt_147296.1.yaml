prompt: |-
  I work as a drafting clerk for a state-level legislature, and lately every bill preamble and every floor speech ends with some version of "this honors the will of the people." My supervisor asked me to build a quick vetting procedure I can run on these texts before they go to print -- she doesn't want philosophical essays, she wants a reusable checklist that takes about fifteen minutes and that I can defend if a legislator complains. I don't have formal training in political philosophy, so I need the procedure to actually embed whatever democratic theory knows about collective will: not just "people disagree," but the structural issue that a group doesn't have a mind, and any claim about its will depends on how you constitute it (aggregation, acclamation, representation that manufactures the consent it reports, and that weird negative-sovereignty idea my roommate brought up where the will is just whatever people haven't actively rejected).

  Can you turn this into a step-by-step decision procedure? It needs to cover: what to check when the bill cites a specific policy prefference (like a tax rate); what to check when it claims the people "have spoken" after a narrow or contested vote; and what to check when it appeals to a "silent will" of people who never showed up. For each, include a quick test sentence or two I can apply, mark the steps that are really judgment calls in disguise, and work through all three examples including one where the procedure forces me to flag something that politically I actually agree with. Also be explicit about where the procedure breaks down and definately can't settle the dispute, and don't ask me to look up scholars or build a bibliography -- I just need the logic operationalized.
reasoning: |-
  Here's a thinking process that leads to the suggested vetting procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Drafting clerk for a state-level legislature.
      *   **Task:** Create a 15-minute vetting procedure/checklist for bill preambles and floor speeches.
      *   **Specific Problem:** Overuse of the phrase "this honors the will of the people."
      *   **Supervisor's Goal:** Avoid philosophical essays; wants a defensible, reusable checklist.
      *   **User's Constraint:** No formal training in political philosophy, but understands the core structural issues (no group mind, aggregation problems, manufactured consent, negative sovereignty).
      *   **Required Content:**
          *   Step-by-step decision procedure.
          *   Cover three specific scenarios: specific policy preference, contested vote/"spoken," and silent will/non-voters.
          *   Include "test sentences" for each step.
          *   Mark steps that are judgment calls.
          *   Work through three examples (including one where the user politically agrees but must flag).
          *   Explicitly state where the procedure breaks down/can't settle disputes.
          *   No bibliography/scholar lookup.

  2.  **Deconstruct the Political Theory (Implicitly):**
      *   *The Problem:* "The Will of the People" is a fiction. There is no singular entity.
      *   *Aggregation:* Voting methods change outcomes (Condorcet, Arrow).
      *   *Representation:* Principals vs. Agents (do reps reflect or lead?).
      *   *Negative Sovereignty:* Legitimacy comes from the *ability* to reject, not active approval (Holmes, Urbinati).
      *   *Manufactured Consent:* Preferences are shaped by the process itself.

  3.  **Drafting the Procedure (The "Will-of-the-People Vetting Protocol" - WVP):**
      *   *Time Limit:* Needs to be fast. 15 minutes means ~5 minutes per section.
      *   *Structure:* Three distinct tracks based on the claim type.
      *   *Tone:* Bureaucratic, neutral, operational. Not academic.
      *   *Defense:* Needs to be defensible to a legislator. "It's not about whether you're right, it's about precision."

  4.  **Developing the Three Tracks:**

      *   *Track 1: Specific Policy Preference (e.g., "The people want a 5% tax").*
          *   Issue: Is there evidence? Is it a proxy?
          *   Test: "Can I point to a direct mechanism linking this specific number to a constituent input?"
          *   Judgment Call: What counts as valid input (poll vs. election)?

      *   *Track 2: The "People Have Spoken" (Post-Vote).*
          *   Issue: Narrow margins, contested counts, equating majority with "the people."
          *   Test: "Does this text acknowledge the minority or the margin, or does it treat 50%+1 as 100%?"
          *   Judgment Call: How narrow is too narrow to claim a mandate?

      *   *Track 3: The "Silent Will" (Non-voters/Abstract).*
          *   Issue: Negative sovereignty vs. mind-reading.
          *   Test: "Is the claim based on the *absence of rejection* or the *presence of desire*?"
          *   Judgment Call: Distinguishing apathy from consent.

  5.  **Developing the Examples:**
      *   *Example 1 (Policy):* A gas tax hike claimed to be "what commuters want."
      *   *Example 2 (Contested Vote):* A bill passed 21-20 in the Senate, preamble says "The People demand this."
      *   *Example 3 (Silent Will/Agreement Trap):* A popular bill (e.g., child safety) where the user agrees, but the preamble claims "Every parent supports this" (ignoring dissent or nuance). *Self-Correction:* The prompt asks for a case where the user *politically agrees* but must flag. Let's make it a popular environmental bill where the preamble claims "The People demand immediate closure of Plant X," but there was no vote on Plant X specifically.

  6.  **Refining the "Breakdown" Section:**
      *   Must admit that this checklist doesn't prove the will *doesn't* exist, only that the *claim* is structurally unsupported.
      *   It cannot solve the "Counterfactual" problem (what *would* people want?).

  7.  **Review against Constraints:**
      *   15 minutes? Yes, it's a checklist.
      *   No scholars? Yes, operationalized logic only.
      *   Judgment calls marked? Yes.
      *   Defensible? Yes, framed as "precision" not "truth."

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Set the stage. This is about *attribution*, not *validity*.
      *   *The Checklist:* Use clear headers.
      *   *The "Red Flag" System:* Green (Safe), Yellow (Qualify), Red (Remove/Revise).
      *   *The Examples:* Walk through the logic.
      *   *The Breakdown:* Be honest about limits.

      *(Self-Correction during drafting)*: Make sure I explicitly address the "negative sovereignty" point the user mentioned. That fits best in Track 3 (Silent Will). The distinction is between "They didn't say no" (Negative) vs "They secretly want this" (Positive mind-reading).

      *(Refining the "Judgment Call" markers)*: I need to make sure the user knows *where* they are making a subjective decision so they can defend it as "clerical discretion" rather than "philosophical stance."

      *(Refining the "Agreement" Example)*: The prompt asks for one where the procedure forces a flag on something the user politically agrees with. This is crucial for showing neutrality. I'll use a "Common Sense Safety Bill" where the preamble overreaches.

  9.  **Final Polish:** Check tone. Needs to be professional, slightly dry (bureaucratic), but intellectually rigorous. Ensure the "15-minute" constraint is respected by keeping steps concise.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Legislative Drafting Office
  **FROM:** [Your Name], Drafting Clerk
  **SUBJECT:** Operational Protocol for "Will of the People" Attribution Claims
  **TIME ESTIMATE:** 15 Minutes per Document

  ### **1. PURPOSE AND SCOPE**
  This procedure does not determine if a bill is *good* or *bad*. It determines if the text structurally supports the claim that the outcome reflects a collective "will." Since a population does not possess a singular mind, claims about its will are technically claims about *process* (how preferences were counted) or *authority* (who is allowed to decide).

  This checklist operationalizes three structural risks:
  1.  **Aggregation:** Mistaking a specific metric for a general desire.
  2.  **Constitution:** Mistaking a slim majority for the whole group.
  3.  **Negative Sovereignty:** Mistaking silence for consent.

  ---

  ### **2. THE VETTING CHECKLIST (15-Minute Cap)**

  #### **TRACK A: Specific Policy Preferences**
  *Use when text claims the people want a specific number, rate, or mechanism (e.g., "The people demand a 5% tax").*

  *   **Step A1 (Source Trace):** Is there a direct evidentiary link between the specific number and a constituent input?
      *   *Test Sentence:* "If I remove the word 'people' and replace it with 'the polling data from [Date],' does the sentence remain factually accurate?"
      *   **[JUDGMENT CALL]:** Deciding if a proxy (like a campaign promise) counts as "constituent input."
  *   **Step A2 (Specificity Match):** Does the granularity of the policy match the granularity of the input?
      *   *Test Sentence:* "Did the electorate vote on this specific percentage, or did they vote on a candidate who might choose this percentage?"
      *   *Action:* If they voted on a candidate, change "The people demand [X%]" to "This administration proposes [X%]."

  #### **TRACK B: The "People Have Spoken" (Post-Vote)**
  *Use when text claims a mandate following a legislative or public vote, especially if narrow.*

  *   **Step B1 (Margin Check):** Does the text equate the winning coalition with "The People" (singular/whole)?
      *   *Test Sentence:* "Does this preamble acknowledge the dissenting percentage, or does it treat 50% + 1 as 100%?"
      *   *Action:* If the margin is under 10%, flag for qualification (e.g., "A majority of representatives...").
  *   **Step B2 (Manufactured Consent):** Did the voting options limit the expression of will?
      *   *Test Sentence:* "Was the vote a choice between distinct preferences, or a choice between 'this specific text' and 'nothing'?"
      *   **[JUDGMENT CALL]:** Determining if "nothing" was a viable alternative for the voters.

  #### **TRACK C: The "Silent Will" (Non-Voters/Apathy)**
  *Use when text claims support from those who did not participate or explicitly object.*

  *   **Step C1 (Negative Sovereignty Check):** Is the claim based on the *absence of rejection* or the *presence of desire*?
      *   *Test Sentence:* "Are we claiming people *haven't stopped us* (legitimate negative sovereignty) or that people *secretly want this* (illegitimate mind-reading)?"
      *   *Action:* If the text claims silent people *want* the bill, flag for removal. If it claims silent people *permit* the bill, it passes.
  *   **Step C2 (Barrier to Entry):** Was silence actually possible?
      *   *Test Sentence:* "Did the people who didn't show up have a realistic mechanism to object, or were they structurally excluded?"
      *   **[JUDGMENT CALL]:** Assessing whether exclusion was structural (e.g., voter ID laws, timing) or voluntary.

  ---

  ### **3. WORKED EXAMPLES**

  #### **Example 1: Specific Policy (The Gas Tax)**
  *   **Text:** "This 15-cent fuel tax increase honors the will of the people, who are tired of crumbling roads."
  *   **Application:**
      *   *Track A1:* Is there a poll showing exactly 15 cents? Unlikely. (Fail)
      *   *Track A2:* Did they vote on a candidate who promised "road repair" generally? Yes. (Fail on specificity).
      *   **Result:** **FLAG.** The specific number cannot be attributed to "the people."
      *   **Revision:** "This fuel tax increase fulfills the legislative mandate to repair roads." (Shifts agency from "people" to "legislature").

  #### **Example 2: Contested Vote (The Budget Bill)**
  *   **Text:** "Passed 21-20 in the Senate. Preamble: 'The People have spoken clearly: fund this program.'"
  *   **Application:**
      *   *Track B1:* Margin is 1 vote. Equating this to "The People" ignores the 20 dissenters and their constituents. (Fail).
      *   *Track B2:* Vote was "This Bill" vs. "Shutdown." (Passes as a binary choice, but B1 overrides).
      *   **Result:** **FLAG.** A 1-vote margin is a legislative decision, not a popular mandate.
      *   **Revision:** "The Senate has determined to fund this program."

  #### **Example 3: The "Agreement Trap" (Child Safety Internet Bill)**
  *   **Text:** "Every parent knows the internet is dangerous. This bill honors the silent will of the people to ban App X immediately."
  *   **Context:** *I personally support this bill. I want App X banned.*
  *   **Application:**
      *   *Track C1:* Claims "silent will... to ban." This asserts positive desire from silent people. (Fail).
      *   *Track C2:* Many parents do not use App X. Their silence is indifference, not consent to a ban. (Fail).
      *   **Result:** **FLAG.** Even though I agree with the policy, the claim about the "silent will" is structurally false. Silence is not a vote for a ban.
      *   **Revision:** "This bill addresses safety concerns raised by constituent groups." (Limits claim to those who actually spoke).

  ---

  ### **4. WHERE THIS PROCEDURE BREAKS DOWN**

  You must be prepared to admit the following limitations if a legislator challenges you. This procedure **cannot** settle these disputes:

  1.  **The Counterfactual Problem:** We cannot know what people *would* have wanted if they were fully informed. This checklist only vetting what they *did* do. If a legislator argues, "They didn't vote on it, but if they knew the facts, they would," this checklist cannot refute that. It is a philosophical claim, not a procedural one.
  2.  **The "Judgment Call" Zones:** Steps marked **[JUDGMENT CALL]** rely on your discretion. If a legislator argues that a 55% vote is "clear" enough to be called "The People," you cannot prove them wrong mathematically. You can only state: *"Per protocol, margins under 60% require qualification to distinguish the majority from the whole."*
  3.  **Negative Sovereignty Limits:** The procedure distinguishes between "permission" (negative) and "desire" (positive). However, in practice, legislators often treat permission as desire. This checklist flags the linguistic error, but it cannot stop the political interpretation.

  ### **5. DEFENSE SCRIPT**

  If a legislator asks why you flagged their text:

  > "Senator, this isn't a judgment on the bill's merit. It's a precision check. 'The Will of the People' is a specific legal claim about authorization. If we claim the people chose a specific tax rate when they only chose a candidate, or if we claim silent people support a ban when they just haven't objected, we open the bill to legal challenges regarding representation. This edit protects the bill by ensuring the attribution of authority matches the actual record."
