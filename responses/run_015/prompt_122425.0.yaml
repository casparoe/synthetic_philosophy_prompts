prompt: |-
  Henry Sidgwick—utilitarian moral philosopher, co-founder and first president of the Society for Psychical Research, and advocate of exceptionally stringent evidential standards—died in 1900. Imagine that a present-day research group publishes a large-scale, pre-registered study of anomalous cognition conducted under sensory-deprivation conditions, using Bayesian sequential analysis with declared stopping rules; critics concede the registration but charge that the prior distributions were effectively calibrated after preliminary data inspection. Drawing on Sidgwick’s documented insistence that psychical inquiry must be held to stricter, not looser, canons of proof than conventional science, and on the epistemic discipline he tied to ethical impartiality in his moral philosophy, predict how he would assess this dispute. Would he regard formal pre-registration as sufficient protection against the experimenter-bias he feared, or would he identify a deeper failure of intellectual virtue in the framing of the priors? Focus on his conceptual commitments—his view of evidence, bias, and moral-epistemic duty—rather than biographical speculation, and do not supply citations or a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Subject:** Henry Sidgwick (utilitarian moral philosopher, co-founder/first president of the Society for Psychical Research (SPR), advocate of stringent evidential standards).
      *   **Scenario:** A present-day research group publishes a large-scale, pre-registered study on anomalous cognition (psi) under sensory deprivation. They use Bayesian sequential analysis with stopping rules.
      *   **Conflict:** Critics concede the pre-registration but argue the *prior distributions* were calibrated *after* inspecting preliminary data (essentially "p-hacking" the priors).
      *   **Task:** Predict how Sidgwick would assess this dispute.
      *   **Key Constraints:**
          *   Draw on his insistence on stricter canons of proof for psychical inquiry than conventional science.
          *   Draw on the epistemic discipline tied to ethical impartiality in his moral philosophy.
          *   Focus on conceptual commitments (evidence, bias, moral-epistemic duty).
          *   *Do not* regard formal pre-registration as automatically sufficient (evaluate this).
          *   *Do not* supply citations or a reading list.
          *   *Do not* engage in mere biographical speculation (focus on philosophy/methodology).

  2.  **Deconstruct Sidgwick's Philosophical Stance:**
      *   **Psychical Research (SPR):** Sidgwick wasn't a gullible believer. He was a skeptic who wanted to *find* truth. He famously argued that if psychical phenomena exist, they require evidence of a much higher order than ordinary scientific facts because they contradict established laws. He feared "wishful thinking" and "credulity" more than skepticism. The maxim was: "The weight of evidence must be proportional to the strangeness of the claim."
      *   **Moral Philosophy (Utilitarianism/Intuitionism):** Sidgwick emphasized "intellectual conscience." In *The Methods of Ethics*, he stresses impartiality, clarity, and the duty to avoid self-deception. For a utilitarian, the right action depends on the truth of consequences; therefore, accurate belief formation is a moral duty. Bias is not just a methodological error; it's an ethical failure.
      *   **Epistemology:** He valued rigorous scrutiny. He was willing to spend decades investigating claims that often turned out to be fraudulent or erroneous, believing the *process* of rigorous elimination was necessary to establish any genuine residue of truth.

  3.  **Evaluate the Scenario through Sidgwick's Lens:**
      *   **The Study:** Large-scale, sensory deprivation (good controls), pre-registered (modern standard), Bayesian analysis (sophisticated).
      *   **The Flaw:** Priors calibrated *after* looking at data.
      *   **The Criticism:** This undermines the Bayesian framework. Priors represent prior belief *before* evidence. If tuned to data, they inflate the likelihood of the hypothesis artificially. It's a form of bias.
      *   **Pre-registration:** Does it save them? Pre-registration usually locks in the *plan*. If the priors weren't locked or were justified post-hoc, the pre-registration is a shell.
      *   **Sidgwick's Verdict:** He would likely see this as a critical failure. Why?
          *   *Stricter Canons:* Psi claims are extraordinary. Conventional science might let a methodological slip pass if the p-value is low. Sidgwick would demand *more* rigor, not less. Tuning priors is a slip that favors the hypothesis.
          *   *Ethical/Epistemic Duty:* Adjusting priors to fit data is a form of self-deception or "wishful thinking." For Sidgwick, the investigator's duty is to truth, not to a positive result. This violates the "intellectual conscience."
          *   *Pre-registration:* He would view formal compliance (checking the box of pre-registration) as insufficient if the *spirit* of impartiality is violated. The "letter" of the method vs. the "spirit" of inquiry.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Establish Sidgwick's dual commitment: rigorous skepticism in psychical research and ethical impartiality in moral philosophy. State the thesis: He would reject the study's validity despite pre-registration.
      *   *The Nature of the Claim:* Psi is "strange." Sidgwick's maxim applies. Extraordinary claims need extraordinary proof. A methodological compromise (tuning priors) weakens the proof exactly where it needs to be strongest.
      *   *The Prior Distribution Issue:* Explain why tuning priors matters. It introduces bias. Sidgwick feared the "wish to believe." This looks like the wish to believe influencing the math.
      *   *Pre-registration vs. Intellectual Virtue:* Pre-registration is a procedural safeguard. Sidgwick cares about the *moral-epistemic* state of the researcher. If the researcher manipulates the starting point (priors) based on the ending point (data), they have failed the duty of impartiality. Formalism cannot cure a lack of intellectual virtue.
      *   *The Moral Dimension:* Connect to *The Methods of Ethics*. Clearheadedness is a duty. Self-deception is a vice. This isn't just bad stats; it's bad ethics.
      *   *Conclusion:* Sidgwick would demand the priors be justified independently of the data. He would likely call for a replication with fixed priors determined *before* any data inspection. The study, as is, fails the "stricter canon."

  5.  **Refining the Tone:**
      *   Needs to be analytical, philosophical, and authoritative.
      *   Avoid modern jargon where possible, or explain it through Sidgwickian concepts.
      *   Ensure the distinction between "procedural compliance" and "epistemic duty" is clear.
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm saying Sidgwick believed in psi. He remained agnostic but open. The point is the *standard of proof*. He wouldn't say "Psi is fake," he would say "This proof is insufficient."

  6.  **Final Polish (checking against constraints):**
      *   Did I mention citations? No.
      *   Did I focus on conceptual commitments? Yes (evidence proportionality, intellectual conscience, impartiality).
      *   Did I address the pre-registration vs. priors issue? Yes.
      *   Is the tone appropriate? Yes.

  7.  **Final Output Generation:** (This matches the thought process above, structured into a coherent essay-style response.)
      *   *Key phrase to include:* "Weight of evidence proportional to the strangeness of the claim."
      *   *Key concept:* Intellectual conscience/duty.
      *   *Key judgment:* Formalism is not virtue.

      *(Self-Correction)*: Wait, ensure I explicitly address the Bayesian aspect. Sidgwick didn't know Bayesian stats, but he understood *weight of evidence* and *antecedent probability*. I need to map his concepts onto the Bayesian framework without anachronism. He understood that your starting assumption (antecedent probability) heavily dictates your conclusion. If you move the starting line after the race, you cheat.

      *(Refining the Pre-registration point)*: Sidgwick would likely see pre-registration as a useful tool, but not a talisman. If the *content* of the registration (the priors) was manipulated or ambiguous, the tool is useless. He would focus on the *intent* and the *logical integrity*.

      *(Final check on "Moral-Epistemic Duty")*: This is crucial. For Sidgwick, knowing the truth is a moral obligation. Therefore, methodological sloppiness in high-stakes claims is a moral failing.

      *Okay, ready to write.*
answer: |-
  Henry Sidgwick would almost certainly judge the study as methodologically compromised and epistemically insufficient, regardless of its formal pre-registration. To understand why, one must synthesize his two defining commitments: his maxim for psychical research that the weight of evidence must be proportional to the strangeness of the claim, and his moral-philosophical insistence that the pursuit of truth is a duty governed by intellectual conscience.

  Sidgwick approached psychical inquiry not as a believer seeking confirmation, but as a skeptic seeking to eliminate error. He famously argued that because psychical phenomena, if true, would overturn established scientific laws, they require a higher standard of proof than ordinary scientific facts. In the scenario you describe, the calibration of prior distributions after inspecting preliminary data represents a contamination of the antecedent probability. In Sidgwickian terms, this is an adjustment of the "strangeness" threshold to accommodate the data, rather than forcing the data to overcome the threshold. By tuning the priors to the data, the researchers have effectively lowered the barrier of proof for an extraordinary claim. Sidgwick would view this as a violation of the fundamental canon of psychical research: the evidence must stand on its own against a rigorous, unyielding standard of improbability. If the starting point of the analysis is shifted to favor the conclusion, the "weight" of the evidence is artificially inflated.

  Regarding the pre-registration, Sidgwick would distinguish between procedural compliance and genuine intellectual integrity. He lived in an era before pre-registration existed, yet he advocated for its spirit: the public declaration of methods and the rigorous documentation of failures as well as successes. However, he would not regard the mere existence of a registration document as a shield against bias. If the priors were not fixed and justified independently of the data *before* the analysis began, the pre-registration becomes a formality rather than a safeguard. Sidgwick was deeply concerned with the "wish to believe," recognizing that human desire for a specific outcome can unconsciously shape methodological choices. He would argue that adjusting priors post-hoc is a sophisticated manifestation of this wish. The formal act of registration cannot cure a failure of impartiality in the framing of the mathematical assumptions. To Sidgwick, a method is only as honest as the discipline of the person wielding it; a loophole exploited is a virtue abandoned.

  This leads to the core of his assessment: the intersection of epistemology and ethics. In his moral philosophy, Sidgwick posited that we have a duty to cultivate clearheadedness and to avoid self-deception. Error is not merely a technical mistake; when it arises from a lack of rigor in high-stakes inquiry, it is a moral failing. The "intellectual conscience" requires that the investigator remain indifferent to the desirability of the result. By calibrating priors to fit preliminary data, the researchers have prioritized a positive finding over the logical integrity of the inference. They have allowed the end to justify the means.

  Sidgwick would likely conclude that the study fails to meet the stricter canons required for psychical claims. He would argue that the proper course is not to defend the statistical maneuvering, but to acknowledge that the antecedent probabilities were not established with the necessary neutrality. He would demand a replication where the priors are determined by independent theoretical grounds or consensus *before* any data is observed, treating the prior distribution not as a tunable parameter but as a fixed constraint representing genuine scientific skepticism. For Sidgwick, the protection against bias is not the bureaucracy of registration, but the moral-epistemic virtue of the inquirer who refuses to move the goalposts, even when the mathematics allows it. The study, therefore, would be set aside not because the results are necessarily false, but because the process failed to demonstrate the requisite indifference to the outcome that truth demands.
