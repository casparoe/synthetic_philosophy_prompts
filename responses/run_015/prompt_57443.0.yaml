answer: |-
  This is a sharp, viable project. You are essentially testing Plutarch's moral epistemology against a modern institutional crisis of credibility. The tension between *historical truth* and *moral utility* is exactly where Plutarch lives, and the Catholic hagiography reforms provide a concrete stress test for it.

  Here is the mapping you requested, broken down by your specific questions, with the epistemic status of claims flagged as required.

  ### (a) The Agents and the Moral Work of the Life

  To run this through Plutarch, you need to define what each agent thinks a "Life" is *for*.

  **1. The Bollandists (17th C. Onwards)**
  *   **Role:** The Critical Historians.
  *   **Theory of Moral Work:** They operate on the assumption that **moral utility requires evidential integrity.** You cannot imitate a phantom. If the *acta* are forged, the virtue is fictitious, and the imitation is void.
  *   **Plutarchan Alignment:** They align with Plutarch's demand for truth (*alētheia*), but they miss his prioritization of character over comprehensive record. They treat the *Life* as a subset of *History*, whereas Plutarch treats *History* as a resource for *Life*.
  *   **Epistemic Status:** **Settled** that the Bollandists introduced critical historiography to hagiography. **Contested** whether they intended to *debunk* saints or merely *purify* the record to strengthen the Church's intellectual credibility. (Your paper should assume the latter: they were loyal Jesuits, not skeptics).

  **2. The 1969 Reformers (Congregation for Divine Worship)**
  *   **Role:** The Liturgical Regulators.
  *   **Theory of Moral Work:** They operate on a distinction between **universal proposal and local permission.** The moral work of a *universal* feast requires a historical basis sufficient to bind the whole Church. If the history is absent, the universal obligation is removed. However, they explicitly allowed local continuation.
  *   **Plutarchan Alignment:** This is the rupture point. Plutarch does not distinguish between "universal" and "local" exemplars. A virtue is a virtue regardless of the audience size. By downgrading Christopher from universal to local/optional based on evidence, they imply that the *scope* of moral imitation depends on the *strength* of historical evidence. Plutarch would likely reject this scaling.
  *   **Epistemic Status:** **Highly Contested.** Liturgical scholars debate whether the removals were driven strictly by historical skepticism or by a desire to de-clutter the calendar and emphasize Christocentric feasts. Some argue the "historical" justification was a pretext for liturgical streamlining. You must flag this: if the motive was streamlining, your Plutarchan critique of their "historicism" misses the mark.

  **3. The Devotees (Medal Wearers)**
  *   **Role:** The Moral Consumers.
  *   **Plutarchan Alignment:** They align most closely with Plutarch's *mirror* theory, but detached from the *historical* anchor. For them, the medal functions as a mirror regardless of the referent's existence. The moral work is **performative and symbolic**, not biographical.
  *   **Epistemic Status:** **Settled** that devotion persisted post-1969. **Contested** whether this persistence represents a "superstition" (in the reformers' view) or a valid "popular theology" (in the sociologists' view). For your paper, treat it as data: the moral utility survived the historical deletion.

  ### (b) Plutarch's Apparatus: Confirmations and Blind Spots

  **What the Episode Confirms:**
  *   **Negative Exemplars:** Plutarch says we learn by avoiding vice. The Bollandist project effectively turns dubious hagiography into a negative exemplar: *Do not be credulous.* The critical method itself becomes a moral lesson in discernment.
  *   **The Mirror:** The persistence of the medals confirms Plutarch's view that the viewer completes the moral circuit. The object (Life/Medal) is inert until the viewer projects virtue onto it.

  **What the Episode Breaks (The "No Story" Problem):**
  *   **The Narrative Necessity:** Plutarch's theory requires *praxis* (action) to reveal *ēthos* (character). In *Alexander 1*, he argues that a trifling action reveals character better than a battle. But there must *be* an action.
  *   **The 1969 Anomaly:** The reform created a category Plutarch cannot generate: **The Name Without The Narrative.** Christopher remains a saint (locally), but the universal narrative is suppressed. For Plutarch, a name without a story is not an exemplar; it is a statue. You cannot imitate a noun.
  *   **The Pairing:** Plutarch's moral judgment relies on comparison (*synkrisis*). The reformers did not pair Christopher with a "Historically Verified Saint." They paired him with "Null." Plutarch's apparatus has no slot for deletion; it only has slots for praise, blame, or comparison. Deletion is a modern bureaucratic move, not a biographical one.

  ### (c) "Lives Not Histories": License for Purge or Argument Against It?

  Your instinct is correct, but it needs nuance regarding the *kind* of historical lack.

  **Argument for License (The Purge):**
  If "Lives not Histories" means "I am not bound by the rigorous standards of archival history," one could argue Plutarch admits his material is soft. Therefore, if the Church finds the material *too* soft (i.e., non-existent), it is consistent to remove it. If Plutarch distinguishes his project from history, he implies history has a higher bar for evidence. If the saints fail the historical bar, perhaps they fail the Plutarchan bar too.
  *   *Weakness:* This misreads the proem. Plutarch isn't lowering the truth bar; he's changing the *selection* criteria.

  **Argument Against (Your Instinct):**
  "Lives not Histories" (*Alex.* 1) is a claim about **moral salience**, not **factual indifference**. Plutarch says he will not record *all* great deeds, only those revealing character. He presupposes the deeds happened.
  *   **The Theseus/Romulus Proem:** This is actually more critical for your paper than *Alexander*. In *Theseus 1*, Plutarch addresses the "mythical" period. He says he wants to clean up the myths to make them "submit to reason and take on the appearance of history." He does **not** say "If it's mythical, delete it." He says "Make it morally plausible."
  *   **Application:** Plutarch would likely argue that if the *story* of Christopher (carrying Christ, immense strength used for service) conveys a stable moral truth, the lack of archival evidence is secondary. He writes about figures where evidence is scarce (Lycurgus, Theseus) because the *moral type* is clear.
  *   **Verdict:** The disclaimer is an argument **against** the purge. Plutarch protects the moral utility of the life from pedantic historical objection. He would view the 1969 removal as a category error: judging a *Life* by the standards of a *Archive*. For Plutarch, if the virtue is imitable, the Life stands.

  **Where you might have it backwards:**
  Plutarch *does* care about truth. He attacks historians who lie (*On the Malice of Herodotus*). If the Church proved Christopher was a *fabrication* (a deliberate lie) rather than just *unknown*, Plutarch might agree to the purge. A lie cannot teach virtue because it teaches that virtue is a performance. The 1969 reform was based on *absence of evidence*, not *evidence of absence*. Plutarch tolerates the former (see *Theseus*); the reformers did not.

  ### (d) Evaluating Your Concepts

  **1. Narrative Warrant vs. Evidential Warrant**
  *   **Verdict:** **Not junk. This is your theoretical engine.**
  *   **Refinement:** Plutarch claims to trade on Evidential Warrant (he uses sources, criticizes them) but actually operates on Narrative Warrant (coherence of character, moral probability).
  *   **Application:** The Bollandists tried to shift the Church from Narrative to Evidential Warrant. The 1969 reform enforced Evidential Warrant for universal liturgy. The laity reverted to Narrative Warrant (the medal works because the story *means* something, not because it happened).
  *   **Caution:** Be careful implying Plutarch *doesn't care* about evidence. He cares deeply. He just subordinates it to moral utility when they conflict. Your term should reflect that hierarchy. Maybe "Moral Probability vs. Archival Certainty."

  **2. Exemplar Decay**
  *   **Verdict:** **Strong, but needs a variable.**
  *   **Refinement:** You ask if decay is total or partial. The medals suggest near-zero decay. This proves that for the *consumer*, the warrant was Narrative all along.
  *   **The Twist:** The decay happened *institutionally*, not *individually*. The Church lost the authority to *propose* the exemplar universally, but the exemplar retained the power to *function* locally.
  *   **Plutarchan Fit:** Plutarch assumes the biographer controls the decay (by writing the life). Here, the institution tried to control the decay by *erasing* the life, and failed. This suggests Plutarch underestimates the "stickiness" of an exemplar once it enters the cultural ecosystem. Once a mirror is placed in the world, the author (or Church) loses the right to take it back.

  ### (e) Epistemic Status: Settled vs. Contested

  You must be explicit about these distinctions in the paper to avoid faculty pushback.

  **Regarding Plutarch:**
  *   **Settled:** Plutarch's primary goal is moral improvement (*psychagōgia*). He uses historical sources but shapes them for moral clarity. He distinguishes between "myth" and "history" but believes myth can be rehabilitated (*Theseus*).
  *   **Contested:** The "Lives not Histories" line.
      *   *View A:* It is a genre distinction (I am writing biography, not chronicle).
      *   *View B:* It is an epistemological shield (I am not responsible for factual accuracy in the same way a historian is).
      *   *View C:* It is a rhetorical humility topos.
      *   *Advice:* Do not claim View B is settled. Argue that *even if* View A is correct, it still implies moral utility trumps comprehensive record, which supports your argument against the purge.

  **Regarding the Catholic Reforms:**
  *   **Settled:** The 1969 *Mysterii Paschalis* removed universal feast days for specific saints (Christopher, George, etc.). The Bollandists produced the *Acta Sanctorum* using critical methods.
  *   **Contested:** The *rationale* for the 1969 removals.
      *   *View A:* Strict historicism (If we can't prove they existed, we can't worship them universally).
      *   *View B:* Liturgical Pastoralism (Too many saints distracted from the central mysteries; history was the convenient lever).
      *   *Advice:* Acknowledge View B. If View B is true, your Plutarchan critique of their "historicism" is attacking a straw man. However, you can argue that *regardless* of motive, the *mechanism* used was historicist, and *that mechanism* is what you are testing against Plutarch.

  **Regarding the Intersection:**
  *   **Settled:** Nothing. This is your contribution.
  *   **Contested:** Whether hagiography functions like biography. (Hagiographers would say no, it's theology; Plutarchans say yes, it's character). You are arguing they function similarly enough for the comparison to hold.

  ### Summary Recommendation for the Paper

  1.  **Lead with the *Theseus* Proem, not just *Alexander*.** The problem of Christopher is the problem of Theseus: a figure of moral significance whose historical footprint is obscured by myth. Plutarch's solution (rehabilitate the myth to serve reason) is the direct counter-model to the 1969 solution (suppress the feast due to myth).
  2.  **Use "Narrative vs. Evidential Warrant."** It's a robust framework. It explains why the Bollandists failed to stop devotion (they attacked the Evidential Warrant, but the devotion ran on Narrative Warrant).
  3.  **Hold the "Lives not Histories" line firmly.** Argue that this phrase protects the moral utility of the life from the fragility of the archive. The 1969 reform made the moral utility hostage to the archive. Plutarch would call this a mistake in moral pedagogy.
  4.  **Flag the 1969 Motive.** Add a footnote or parenthetical acknowledging that if the reform was about liturgical clutter rather than history, your argument shifts from "They were wrong about history" to "They used history as a tool for management, which Plutarch would find alien."

  This approach respects the complexity of the sources while giving you a clear argumentative lane.
