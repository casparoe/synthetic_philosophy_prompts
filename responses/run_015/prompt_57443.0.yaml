      *   *Exemplar Decay:* This is excellent. Does the exemplar rot when history fails? The medals suggest "No." This implies the "Warrant" was Narrative/Functional all along for the users, even if the Institution claimed Evidential.
      *   *Critique:* Need to be careful. Plutarch *does* care about truth. He criticizes historians who lie. He doesn't invent ex nihilo. So "Narrative Warrant" isn't a free pass to lie for Plutarch, it's about *selection* and *emphasis*.

  8.  **Drafting Section (e): Epistemic Status (Settled vs. Contested):**

      *   *Plutarch:*
