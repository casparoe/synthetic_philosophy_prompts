      *   *Self-Correction on Plutarch:* I need to make sure I don't paint Plutarch as a postmodernist who doesn't care about truth. He *does* care. He criticizes Herodotus for malice. He tries to get the facts. But if facts are scarce, moral probability rules. The 1969 reform removed saints because evidence was *absent*, not because the stories were proven *false* (mostly). This is a key distinction. Plutarch writes about figures where evidence is scarce (Theseus, Romulus) but still writes their lives. He explicitly addresses the "mythical" nature of early figures in the *Theseus/Romulus* proem. This is a crucial parallel to St. Christopher.

  10. **Final Polish:** Organize by the user's requested structure (Agents, Apparatus Match/Mismatch, Lives/History, User Concepts, Epistemic Status). Ensure the distinction between "unproven" and "false" is clear in the Plutarchan analysis. (Plutarch writes about Theseus despite the myth; the Church dropped Christopher because of the myth).

