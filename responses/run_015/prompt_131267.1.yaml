answer: |-
  # The Galilee Procedure: Historical Verdict Workflow

  ## Part 1: The Procedure (Detailed)

  Run every item (saying, action, or scene) through these steps in order. Record the verdict for **Event** (did it happen?), **Saying** (did he say this?), and **Staging** (did it happen this way?) separately.

  ### Step 1: The Anachronism Gate (One-Way Filter)
  **Question:** Does this require knowledge, terminology, or geography unavailable in Galilee/Judea between 28–30 CE?
  *   **Sufficient Answer:** No developed Trinitarian formula, no post-70 CE destruction references, no later Gentile church polity.
  *   **Verdict:**
      *   **Fail:** **HARD NO.** Cut or rewrite. (This is the only test that returns "False").
      *   **Pass:** Proceed to Step 2. (Passing does not confirm authenticity).

  ### Step 2: Contextual Plausibility (One-Way Filter)
  **Question:** Does this fit the social, political, and religious texture of 1st-century Palestinian Judaism?
  *   **Sufficient Answer:** Fits known sects (Pharisee, Essene, etc.), Roman occupation dynamics, and Aramaic idioms.
  *   **Asymmetry Rule:** Passing proves nothing (later legends fit context too). Failing kills the item.
  *   **Verdict:**
      *   **Fail:** **NO VERDICT.** Treat as later theology. Do not put in Jesus' mouth as fact.
      *   **Pass:** Proceed to Step 3.

  ### Step 3: Multiple Attestation (Gate/Weight)
  **Question:** Does this appear in independent streams of tradition?
  *   **Crude Independence Test:**
      1.  **Stream A:** Mark + Matthew/Luke parallels (count as **1**).
      2.  **Stream B:** John (distinct tradition).
      3.  **Stream C:** Paul/Epistles (early creeds).
      4.  **Stream D:** Non-Christian (Josephus/Tacitus) or Early Non-Canonical (Thomas).
  *   **Sufficient Answer:** Presence in **two** distinct streams (e.g., Mark + John, or Mark + Paul).
  *   **Verdict:**
      *   **2+ Streams:** **HIGH WEIGHT.** Proceed to Step 6.
      *   **1 Stream:** **LOW WEIGHT.** Proceed to Step 4.
      *   **0 Streams:** **NO VERDICT.** Proceed to Step 5 (only if dramatically essential).

  ### Step 4: The Dissimilarity Cap (Tie-Breaker)
  **Question:** Is this item accepted *mainly* because it is unlike both contemporary Judaism and the later Church?
  *   **Constraint:** No more than **20%** of the season's total Jesus material may rest primarily on this test.
  *   **Reasoning:** A Jesus entirely dissimilar to his context is a fiction.
  *   **Verdict:**
      *   **Cap Reached:** **NO VERDICT.** Cut or reassign to another character.
      *   **Cap Open:** Proceed to Step 6.
      *   **Tie-Breaker (If two scenes compete for the last slot):** Choose the scene that serves the season's dramatic arc better. Historical weight is equal; narrative weight decides.

  ### Step 5: The Explanatory Orphan (User Test)
  **Question:** Does this item explain a historical outcome (e.g., why the movement survived) that nothing else explains, without being better explained by a later church need?
  *   **Misfire Warning:** Fails if the "explanation" solves a theological problem that arose *after* 50 CE (e.g., Gentile inclusion, Temple destruction).
  *   **Verdict:**
      *   **Pass:** Adds **MODERATE WEIGHT**.
      *   **Fail:** **NO VERDICT.** (Does not kill the item, just removes weight).
      *   **Proceed to Step 6.**

  ### Step 6: Coherence (Tie-Breaker)
  **Question:** Does this fit the portrait of Jesus established in previous episodes?
  *   **Warning:** This is a trap if used as a Gate. It confirms bias.
  *   **Verdict:**
      *   **Use:** Only when Step 3 (Attestation) yields a tie.
      *   **Action:** Pick the version that maintains character consistency.

  ### Step 7: Values Hand-Off (Decision Point)
  **Question:** If the historical verdict is "Low Weight" or "No Verdict," do we keep it?
  *   **Action:** This is no longer a historical question. It is a values question.
  *   **Hand-Off:**
      *   **Risk of Misleading Audience:** Send to Factual Standards.
      *   **Risk of Offending Believers:** Send to Faith Advisory Board.
      *   **Risk of Losing the Scene:** Writer's Decision (you).
  *   **Hedging Rule:** Narrator hedging is legitimate *only* if the script explicitly acknowledges the uncertainty (e.g., "Some say..."). It is illegitimate if used to state a disputed fact as truth while whispering a disclaimer.

  ---

  ## Part 2: Case Studies

  ### 1. The Baptism by John
  *   **Step 1 (Anachronism):** Pass. Jewish ritual washings existed.
  *   **Step 2 (Context):** Pass. John the Baptist is historically attested; submission to him fits the setting.
  *   **Step 3 (Attestation):** **HIGH WEIGHT.** Multiple streams (Mark, Q, John, Josephus).
  *   **Step 4 (Dissimilarity):** Passes (Embarrassing to early church, so unlikely invented). Counts toward cap, but strong enough to ignore cap.
  *   **Verdict:** **Event: Yes. Saying: Maybe. Staging: Yes.**
  *   **Weakest Link:** The exact dialogue. The *fact* of baptism is solid; the voice from heaven is tradition, not event.

  ### 2. The Cry from the Cross
  *   **Step 1 (Anachronism):** Pass.
  *   **Step 2 (Context):** Pass. Aramaic transliteration (*Eloi*) fits. Psalm quotation fits Jewish piety.
  *   **Step 3 (Attestation):** **MIXED.** Mark/Matthew have the Aramaic cry. Luke/John have different last words. Split stream.
  *   **Step 5 (Orphan):** Explains the bystanders' confusion (Elijah/Elias).
  *   **Verdict:** **Event: Yes (a cry happened). Exact Words: No Verdict (tradition varies). Misunderstanding: Plausible.**
  *   **Decision:** You can stage the cry. You cannot dogmatize the exact wording as historical fact without hedging. The misunderstanding is dramatic gold but historically uncertain.

  ### 3. Barabbas and Pilate Washing Hands
  *   **Step 1 (Anachronism):** Pass.
  *   **Step 2 (Context):** **FAIL.** No historical evidence of Passover prisoner release custom. Roman procedure makes Pilate washing hands unlikely (he held *imperium*).
  *   **Step 3 (Attestation):** **LOW WEIGHT.** Mostly Markan tradition. John varies.
  *   **Step 5 (Orphan):** **MISFIRE.** Explains later Christian need to appease Rome and shift blame to Jewish leaders.
  *   **Verdict:** **Event: No Verdict. Staging: Likely Theological.**
  *   **Decision:** This is a Values Hand-Off.
      *   **Strongest Case for Keeping:** It is the narrative climax of the trial. Cutting it loses the act.
      *   **Required Changes:** Do not stage the custom as historical fact. Use the Narrator to flag the tradition ("The story tells us..."). Shift the blame from "The Jews" to "The Crowd" or "The Authorities" to satisfy the Board. Pilate washing hands should be staged as symbolic hesitation, not legal procedure.
      *   **Hedging:** Legitimate here because the historical uncertainty is high. Narrator must say "The Gospels record..." not "Pilate washed..."

  ---

  ## Part 3: The One-Page Workflow (Desk Copy)

  **ITEM:** ___________________ **EP:** ____

  **1. ANACHRONISM GATE (One-Way Filter)**
  *   [ ] Knowledge/Terms available 28–30 CE?
  *   **NO:** **CUT.** (Verdict: False)
  *   **YES:** Continue.

  **2. CONTEXTUAL PLAUSIBILITY (One-Way Filter)**
  *   [ ] Fits 1st-C Galilee/Judea?
  *   **NO:** **NO VERDICT.** (Do not put in Jesus' mouth as fact).
  *   **YES:** Continue. (Passing ≠ True).

  **3. MULTIPLE ATTESTATION (Weight)**
  *   [ ] Stream A (Synoptics) + Stream B (John/Paul/Outside)?
  *   **2+ Streams:** **HIGH WEIGHT.**
  *   **1 Stream:** **LOW WEIGHT.**
  *   **0 Streams:** **NO VERDICT.**

  **4. DISSIMILARITY CAP (Tie-Breaker)**
  *   [ ] Is this kept *only* because it's unique/weird?
  *   **YES:** Check Season Cap (Max 20% of Jesus material).
  *   **Cap Full:** **NO VERDICT.** (Cut or reassign).
  *   **Cap Open:** Continue.

  **5. EXPLANATORY ORPHAN (Weight)**
  *   [ ] Explains a historical outcome without solving a later theology problem?
  *   **YES:** Add Weight.
  *   **NO:** No change.

  **6. COHERENCE (Tie-Breaker)**
  *   [ ] Fits established character arc?
  *   **USE:** Only if Attestation is tied.

  **7. VALUES HAND-OFF**
  *   [ ] Is Verdict "Low" or "No Verdict"?
  *   **YES:** Send to **Standards** (Misleading?) or **Board** (Offensive?).
  *   **Hedging:** Allowed only if script acknowledges uncertainty.

  **FINAL VERDICT:**
  [ ] Event: _______ [ ] Saying: _______ [ ] Staging: _______

  ---

  ## Part 4: Reasoning for Ordering

  1.  **Gates First (Steps 1 & 2):** You cannot weigh something that is impossible. Anachronism and Context are the only true filters. They save time by killing dead items immediately. Note the asymmetry: Context passes everything plausible, but fails the impossible.
  2.  **Weight Second (Steps 3 & 5):** Attestation and Orphan tests accumulate probability. They do not prove truth, but they justify the risk of staging.
  3.  **Caps Third (Step 4):** Dissimilarity is dangerous. It creates a "unique" Jesus who never existed. Capping it prevents the season from drifting into fiction masquerading as history.
  4.  **Values Last (Step 7):** History runs out. At some point, you are making art, not a documentary. This step explicitly hands the liability to the stakeholders (Board/Standards) when the history is ambiguous.

  ## Part 5: Calls This Procedure Cannot Make

  1.  **Theological Truth:** This procedure assesses historical probability, not divine revelation. It cannot tell you if Jesus *is* the Son of God, only if the *claim* fits the period.
  2.  **Exact Wording:** Aramaic oral tradition was fluid. The procedure can validate a *sentiment*, rarely a specific Greek sentence.
  3.  **Internal Motive:** You can stage an action, but you cannot historically verify *why* Jesus did it (e.g., "He did this to fulfill prophecy"). That is interpretation, not event.
  4.  **Miracle Verification:** The procedure treats miracles as "reported events." It cannot validate the supernatural claim, only the tradition of the report.
