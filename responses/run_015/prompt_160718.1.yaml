answer: |-
  Here is a complete design for the 90-minute session, built around your sampling mechanism. It prioritizes student discovery, manages the logistical constraints of a single instructor, and isolates the specific philosophical friction points you identified.

  ### 1. Materials and Setup

  **Room:** Seminar table or clustered desks. Students must not see each other's papers.
  **Instructor:** Needs a private screen or desk area to sort slips quickly.

  **Materials:**
  *   **Slips:** 200 small slips of paper (16 students $\times$ 12 rounds + spares).
      *   Pre-print or write on 12 sets of 16 slips.
      *   In each set of 16: 14 say **"ASLEEP – Write Decoy"**, 2 say **"AWAKE – Write Answer"**.
      *   *Crucial:* On **Tails** rounds, you will distribute the set as is (2 Awake). On **Heads** rounds, you must secretly swap one "AWAKE" slip for an "ASLEEP" slip before distributing, so only 1 person is Awake.
      *   *Simpler Alternative:* Print 16 slips per round that say "Round X". You, the instructor, mark them *after* the coin flip but *before* distribution. This saves prep time but requires you to turn your back to mark them.
      *   *Best Method for Speed:* Prepare 12 envelopes. Inside each envelope are 16 slips.
          *   Label envelopes 1–12.
          *   Privately decide the Coin Sequence beforehand (e.g., H T T H T H T T H T H T).
          *   For H envelopes: Ensure only 1 slip says "AWAKE".
          *   For T envelopes: Ensure 2 slips say "AWAKE".
          *   Seal them.
  *   **Tokens:** Poker chips or printed paper money. Two colors: "Correct" and "Incorrect" (or just one color for Correct).
  *   **Scoreboard:** Whiteboard to track aggregate class tokens per round.
  *   **Lab Assistant Kit:** One distinct color of slip and a standing desk at the front.

  ---

  ### 2. Payoff Scheme and Arithmetic

  You need two layers of commitment: a **Bet** (for tokens) and a **Credence** (for discussion).

  **The Scheme:**
  1.  **Bet:** Students write **H** or **T**.
      *   If Scored (Awake) and Correct: **+2 Tokens**.
      *   If Scored (Awake) and Incorrect: **0 Tokens**.
      *   If Asleep: **0 Tokens** (Decoy guess ignored).
  2.  **Credence:** Students write a percentage (0–100%) representing $P(Heads)$. This is not scored for tokens but collected for the debrief to reveal the "Halfer who bets Tails" phenomenon.

  **Stage 1 Arithmetic (The 1/3 Result):**
  *   **Coin:** Fair ($P(H)=0.5, P(T)=0.5$).
  *   **Selection:**
      *   If H: 1 student selected (prob $1/16$).
      *   If T: 2 students selected (prob $2/16$).
  *   **Conditional Probability for a Selected Student:**
      $$P(H | Selected) = \frac{P(Selected | H)P(H)}{P(Selected | H)P(H) + P(Selected | T)P(T)}$$
      $$P(H | Selected) = \frac{(1/16)(1/2)}{(1/16)(1/2) + (2/16)(1/2)} = \frac{1}{1+2} = \frac{1}{3}$$
      $$P(T | Selected) = \frac{2}{3}$$
  *   **Expected Payoff per Scored Round:**
      *   **Strategy "Always Heads":** Wins 1/3 of scored rounds. Exp Payoff = $1/3 \times 2 = 0.66$ tokens.
      *   **Strategy "Always Tails":** Wins 2/3 of scored rounds. Exp Payoff = $2/3 \times 2 = 1.33$ tokens.
      *   **Gap:** 0.67 tokens per round. Over 12 rounds, a consistent Tails-better wins $\approx 8$ more tokens than a Heads-better. This is visible above noise.

  **Stage 2 Arithmetic (The "First Awakening" Shift):**
  *   **Protocol:** On Tails rounds, the two awake slips are marked **T1** and **T2**. You announce: *"Only slips marked 1 (H1 or T1) are scored this round."*
  *   **Conditional Probability:**
      *   H: 1 slip (H1). Scored? Yes.
      *   T: 2 slips (T1, T2). Scored? Only T1.
      *   Total Scored Slips in population: 1 (from H) + 1 (from T) = 2.
      *   $P(H | Scored \cap First) = 1/2$.
  *   **Expected Payoff:**
      *   Heads and Tails are now equally likely among scored slips.
      *   Exp Payoff (H) = Exp Payoff (T) = 1.0 token.

  ---

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup and Rules**
  *   Distribute envelopes (one per round). Tell students **not to open them yet**.
  *   Select one **Lab Assistant**. Give them a separate stack of "Always Awake" slips. Their job: Write a guess every round, always scored.
  *   **Rules:**
      1.  Open envelope only when told.
      2.  If "ASLEEP": Write *any* guess (decoy), seal slip, place in bin. You get no tokens.
      3.  If "AWAKE": Write **H** or **T** and a **%** credence. Seal slip.
      4.  **Silence:** No talking, no eye contact, no rustling papers intentionally.
      5.  **Collection:** Pass slips to front. Instructor sorts privately.
  *   *Instructor Note:* Emphasize that "ASLEEP" students must mimic the motion of "AWAKE" students to preserve the blind.

  **00:10 – 00:50: Stage 1 (The Sampling Game)**
  *   Run **12 Rounds**.
  *   **Pacing:** 3 minutes per round.
      *   Min 1: Open, Read, Write, Seal.
      *   Min 2: Collect, Instructor Sorts (Students wait silently).
      *   Min 3: Announce Results (e.g., "Round 1: Coin was Tails. 2 Awake. Both guessed T. +4 tokens to class pool."). Update Board.
  *   *Instructor Load:* You need to sort quickly. Have two boxes: "Heads Rounds" and "Tails Rounds". As you collect, you know the coin result for Round $N$. Put slips in the corresponding box. Later, count wins.
  *   **Mid-Point Check (Round 6):** Announce the cumulative token count. If Tails is leading, highlight it. If Heads is leading (bad luck), remind them "Expected value is long term."

  **00:50 – 01:05: The Tally and The Shock**
  *   Stop the game.
  *   **Reveal the Data:**
      *   Total Scored Guesses (Awake slips): Should be $\approx 18$ (6 H $\times$ 1 + 6 T $\times$ 2).
      *   Count how many scored guesses were H vs T.
      *   Count how many were Correct vs Incorrect.
  *   **The Question:** "Look at the slips that actually counted. What fraction were Tails?"
  *   *Expected Outcome:* The class sees $\approx 66\%$ Tails among scored slips.
  *   **The Conflict:** Ask students to reveal their written Credence %.
      *   *Target Moment:* Find a student who wrote **50%** but bet **Tails**. Ask them to explain why. (Answer: "I believe it's 50/50, but Tails pays better.")
      *   *Target Moment:* Find a student who wrote **33%** and bet **Tails**.
      *   *Target Moment:* Find a student who wrote **50%** and bet **Heads**. (Ask: "Why did you lose tokens?")

  **01:05 – 01:20: Stage 2 (The "First Awakening" Protocol)**
  *   Explain the rule change: "In Tails rounds, one awake slip is 'First', one is 'Second'. We will only score 'First' slips today."
  *   Run **3 Rounds** (quickly).
  *   **Prediction:** Ask them to write down their new Credence % *before* the round.
  *   **Result:** The ratio of H:T among scored slips will shift to 50:50.
  *   **Observation:** Thirders should update their credence to 50%. Halfers should feel vindicated in their 50% credence, but realize their Stage 1 betting advantage disappeared.

  **01:20 – 01:25: The Lab Assistant Reveal**
  *   Ask the Lab Assistant: "What was your accuracy?" (Should be $\approx 50\%$).
  *   Ask the Class: "What was your accuracy?" (Should be $\approx 66\%$ on Tails bets).
  *   **The Question:** "The Assistant knew the coin was fair. You knew the coin was fair. Why did you bet differently?"

  **01:25 – 01:30: Debrief and Mapping**
  *   Connect the game to Sleeping Beauty.
  *   Map "Being Selected" to "Being Awake."
  *   Map "Lab Assistant" to "External Observer."
  *   End on the open question: "Does the sampling mechanism capture the amnesia, or does it change the problem?"

  ---

  ### 4. Debrief: Mapping Game to Philosophy

  Use this script to guide the final discussion without lecturing.

  1.  **The Halfer/Better Split:**
      *   *Observation:* "Several of you wrote 50% credence but bet Tails."
      *   *Philosophical Map:* This is the **Pragmatic Halfer** position. You maintain the coin is fair ($P(H)=1/2$), but you acknowledge that *being awake* is evidence of Tails in this specific sampling setup (SIA).
      *   *SBP Connection:* In SBP, Halfers argue Beauty's credence should remain 1/2. But if offered a bet *per awakening*, they often agree she should take the Tails bet. This game forces that dissociation into the open.

  2.  **The Reference Class (Assistant vs. Student):**
      *   *Observation:* "The Assistant bet 50/50 and was right half the time. You bet Tails and were right two-thirds of the time."
      *   *Philosophical Map:* You occupy different **Reference Classes**.
          *   Assistant: "I am an observer of *Rounds*." ($P(H)=1/2$).
          *   Student: "I am an observer of *Awakenings*." ($P(H)=1/3$).
      *   *SBP Connection:* This is the core of the **Self-Indication Assumption (SIA)** vs. **Self-Sampling Assumption (SSA)** debate. The game proves 1/3 is correct *if* you treat yourself as a random sample of awakenings.

  3.  **The "First Awakening" Shift:**
      *   *Observation:* "When we filtered for 'First', the advantage vanished."
      *   *Philosophical Map:* This mirrors learning "It is Monday."
      *   *SBP Connection:* Thirders update from 1/3 to 1/2 upon learning it's Monday. Halfers stay at 1/2. The game shows that *information about location* changes the betting odds, even if the coin didn't change.

  ---

  ### 5. Failure Modes and Mitigation

  **1. The Noise Tell (High Risk)**
  *   *Problem:* Asleep students put pens down; Awake students keep writing. Or rustling sounds differ.
  *   *Fix:* Enforce the "Decoy" rule strictly. "If your slip says Asleep, you must write a guess and seal it exactly as if it counted." Watch the room during the writing phase. If you hear silence from half the room, stop and restart the round.

  **2. Small Sample Variance**
  *   *Problem:* You flip 8 Heads and 4 Tails by luck. The "Tails pays better" signal vanishes (8 H-slips vs 8 T-slips).
  *   *Fix:* Do not hide the Coin Log. If the coin runs hot for Heads, point to the *theoretical* expectation. "We got 8 Heads, so we have 8 scored slips. If we had gotten 8 Tails, we would have 16 scored slips. The *density* of Tails slips is higher."
  *   *Better Fix:* If Round 1-6 are heavily skewed, announce: "We are extending to 18 rounds to stabilize the average."

  **3. The "Amnesia Objection" Arrives Early**
  *   *Problem:* A student says in Minute 15: "This isn't Sleeping Beauty. In the story, Beauty *knows* she's awake. Here, I didn't know I'd be picked."
  *   *Fix:* **Validate and Park.** "That is an excellent objection. It is the exact objection we will test in Stage 3. For now, suspend disbelief and let's see if the math holds for *this* game. If the math fails, we discard the game. If the math holds, we ask why it might not apply to Beauty."
  *   *Why:* If you let them debate this now, the game stops. You need the empirical result first to make the objection weightier later.

  **4. Credence vs. Bet Confusion**
  *   *Problem:* Students think writing "50%" forces them to bet "Heads".
  *   *Fix:* In instructions, explicitly say: "Your percentage is your belief. Your bet is your strategy. You may believe the coin is fair but bet on Tails if the payoff is better. We want to see if you separate these."

  ---

  ### 6. Limitations: What This Activity Cannot Do

  Be honest with yourself (and eventually the class) about the surrogate's limits.

  **1. Genuine Self-Locating Ignorance**
  *   *Limitation:* In the game, students know *before opening the envelope* that they might be asleep. In SBP, Beauty knows *before sleeping* that she will be awake.
  *   *Consequence:* The game models **Selection Bias** (I might not exist in this branch), whereas SBP models **Indexical Uncertainty** (I exist in both branches, but don't know which one I am).
  *   *Instructor Note:* In the final 10 minutes, you must supply this distinction. "In this game, being awake was *news*. In the original problem, being awake is *guaranteed*. Does that difference matter? The Thirder says 'No, the structure of awakenings is the same.' The Halfer says 'Yes, without selection bias, the 1/3 argument collapses.' This game cannot settle that; it only shows what happens *with* selection bias."

  **2. The "Double Halfer" Trap**
  *   *Limitation:* Some students may argue "The coin is 50/50, so I bet 50/50, and I don't care about tokens."
  *   *Consequence:* They opt out of the utility lesson.
  *   *Instructor Note:* Use the token tally to gently pressure them. "You finished with 2 tokens. The person next to you finished with 10. Your belief was protected, but your wallet wasn't. Is credence supposed to be immune to evidence that pays?"

  **3. The Lab Assistant's Knowledge**
  *   *Limitation:* Students might argue the Assistant knows *more* than them (e.g., "They see the room").
  *   *Correction:* Ensure the Assistant *only* knows the protocol and the day, not the coin. They must be epistemically symmetric regarding the coin, differing only on *self-location*.
  *   *Instructor Note:* "The Assistant knows the coin is fair. You know the coin is fair. The Assistant knows they are an Assistant. You know you are a Student. That single piece of indexical information ('I am a randomly selected awakening') is the only difference. Is that enough to change probability?"

  ### Summary of Instructor Mindset
  Your role is not to prove Thirders right. Your role is to make the **cost of the Halfer position visible**.
  *   In Stage 1, Halfer *credence* (50%) is compatible with Thirder *betting* (Tails).
  *   In Stage 2, the betting advantage vanishes.
  *   In Stage 3, the mechanism is critiqued.
  *   If a student leaves saying, "I'm still a Halfer, but I see why I lose tokens in this specific game," you have succeeded. That is the precise philosophical nuance the seminar requires.
