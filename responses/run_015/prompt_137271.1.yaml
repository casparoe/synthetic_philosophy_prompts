prompt: |-
  Hey — take a breath and think this through properly before you answer. You're a professional moral philosopher who's spent years working on the reactive attitudes literature and its neighbourhood, and who also has opinions about what's worth funding. Do some unstructured brainstorming first, then commit to an actual ordering: I want your honest ranking, not the diplomatic one where everything is tied for first.

  Here's the situation. I'm on a panel that gets to allocate roughly eight philsopher-years over three years to work on moral responsibility in the broadly Strawsonian tradition. Constraints: armchair work only, one or two people per project, and no empirical psychology, no imaging, no surveys. And let me be blunt up front: if what comes back is mostly a map of the literature — names, papers, who said what about which — I'll be annoyed. Don't give me a reading list or a bibliography; I can find those myself. What I want is a defended agenda, and the reasoning that produces it.

  Two things make this an odd funding round, and they're my hobby-horses, so indulge me.

  First: most of the blame ordinary people now recieve is delivered by or through intermediaries that don't hold any attitude at all — automated moderation, platform enforcement, risk scores, HR scripts, statements issued in an institution's name. Nobody resents you; a process handles you. Call it laundered blame if you like.

  Second: most recipients of blame can leave the relationship for the price of a click — block, mute, switch platform, move, quietly self-exile from a community. On the reading I was brought up on, the participant stance isn't something you can opt out of wholesale, but people do withdraw from this or that relationship constantly, and that seems to change what blame is even able to do.

  So: given all that, which open questions in this area should the money go to, in what order? No more than five on the list, and I want them ranked, not hedged. Tell me your criteria and how they trade off: how upstream a question is relative to the others, whether one or two philosophers could genuinely move it in three years with armchair methods, and whether an answer would change anything outside a seminar room. On that last one, the practice I have in mind is the institutional design of blame — moderation policies, restorative-justice programmes, how organisations sanction people.

  Then tell me what you'd defund on purpose: name one question in this area that strikes you as overrated, and one that sounds terminally boring but is secretly load-bearing. And say what argument or evidence over the next two years would move things up or down your list.

  Last thing, and argue with me about it: everyone on the panel keeps saying the money should go wherever it's most likely to change how institutions blame people. I'm not sure that's the right end. Is aiming at applicability the right call here, or is there some internal conceptual payoff that matters more and would be lost if we aimed there?
