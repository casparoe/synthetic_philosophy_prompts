prompt: |-
  I chair the collections committee of a mid-sized city museum — roughly 120,000 objects, of which perhaps 4,000 fall within the periods and regions that restitution claims concern. We receive four to six inquiries or claims a year. Our capacity is two registrars, a shared conservator, and no in-house lawyer; outside legal advice is billed by the hour and the board resents paying for it. Triage has to happen within a week of an inquiry arriving, and any recommendation to return has to reach the board's collections subcommittee, which meets quarterly, as a file a non-specialist trustee can read in twenty minutes.

  Please write me a decision procedure my committee can actually run: the questions in the order we should ask them, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the decision to a person because the question is one of values rather than facts. Build it on the following positions, which the committee has argued itself into over the last two years and which I want the procedure to honour rather than reopen:

  a) The anti-washing rule: a later good-faith purchase does not cure an originally tainted taking while the dispossession is still live — that is, within the living memory of the community concerned, or before a genuine change in the political relation between that community and the power that took the object. Work out how "live" is to be determined on our records, and what to do when the record is silent.
  b) Burden of proof: for anything acquired under a colonial administration with an incomplete chain, the gap counts against us rather than against the claimant. Silence in our own documentation is evidence, not neutrality.
  c) Authorisation by an occupying or imperial power does not by itself make a removal legitimate — but tell me what work, if any, a surviving document of permission can still do in the procedure.
  d) Capacity: where the receiving institution's storage or conservation weaknesses are traceable to the same historical relation as the taking, they cannot be made a condition of return. Remediation is something we fund, not something we require. Where the weaknesses are not so traceable, decide whether and how much they may count.
  e) Display value: any argument from what the object teaches in our galleries has to survive a surrogate test — could we teach the same thing with a replica, a digital surrogate, or the documentation together with the story of the object's removal? Decide what passes and what fails, and say who judges.
  f) Role reversal: any condition we attach to a return must be one we would accept if the roles were reversed.
  g) Claimants: continuity of grievance matters more than formal state locus. A body that has carried the claim forward and is recognised by the community should count even without state backing. Tell me what to do when two such bodies claim the same object, and what to do when a state claims without them.
  h) Sets and parts: a "set" is our curatorial category more often than theirs. Say when a group may be divided and when it may not, and whether we may retain a token piece.

  At every fork where reasonable people could go either way, commit to one branch and give your reason. I do not want a menu of options with their trade-offs; I want a procedure with your choices baked in, each with a one-line note saying that a reasonable committee could have gone the other way and why you went yours. Where a step is irreducibly a value judgement, mark it as a place where the procedure stops and a person signs off, and say which person.

  Then run it on three live files:

  1. A Benin-type brass plaque bequeathed to us in 1938 by the family of a colonial officer, with a documented chain going back to the British punitive expedition that sacked Benin City in the 1890s. The claim comes from Nigeria's federal antiquities authority and from the court of the Oba. Tell me what paperwork is sufficient, what timing the procedure implies, and — this is the part the board will fight about — which conditions we may *not* attach. They will want a long-term loan back, a shared rotating display, and a delay until our digitisation project finishes. Say which of these the procedure blocks and why.
  2. A fragment of sculpture from the Parthenon, bought at auction in 1921 from a private collection, with a chain going back to the early nineteenth century but not to Elgin himself. The claim comes from the Greek state. The committee is split on whether the gap in our chain is our problem under (b), and on how much the permission documents from the imperial authority then in place are worth under (c). Commit. Also say how an architectural-reunification argument should be weighed against an encyclopedic-display argument at the display-value step.
  3. The one where I expect to dislike the answer. A carved figure bought from a dealer in 1961, whose file shows it was carved in the 1920s and sold by its maker, with nothing in the record connecting it to any taking; the claim comes from a national heritage body on the argument that all such material belongs to the national patrimony. My instinct is that refusing feels wrong and will read as special pleading. Tell me honestly whether the procedure returns a no here, and if it does, what the committee should say out loud when it says no.

  Finally, be explicit about what the procedure cannot do: where it will misfire, which claims it cannot adjudicate at all, and what we should do with those. We know the general shape of the restitution literature and do not need citations, bibliographies, or reading lists; what we lack is something we can run. Keep it to something my committee can hold to a few pages.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a Collections Committee at a mid-sized city museum (120k objects, 4k relevant, 4-6 claims/year).
      *   **Constraints:** Limited capacity (2 registrars, shared conservator, no in-house lawyer), tight timelines (triage in 1 week, board packet in 20 mins), board resistance to legal fees.
      *   **Goal:** A concrete decision procedure (flowchart-style logic) that honors specific pre-agreed ethical positions (a-h).
      *   **Requirements:**
          *   Questions in order.
          *   Sufficient answers defined.
          *   Stop points (No vs. Hand-off).
          *   Commit to choices at forks (no menus), with one-line justification for the choice.
          *   Mark irreducible value judgments for human sign-off.
          *   Apply to three specific case studies.
          *   Explicitly state limitations of the procedure.
          *   Keep it short (few pages).
      *   **Tone:** Professional, decisive, pragmatic, ethically rigorous but operationally feasible.

  2.  **Deconstruct the Ethical Positions (a-h):**

      *   (a) *Anti-washing:* Good faith purchase doesn't cure tainted taking if dispossession is "live." Need definition of "live."
      *   (b) *Burden of Proof:* Gaps in colonial chains count against the museum. Silence = evidence against us.
      *   (c) *Authorization:* Imperial permission $\neq$ legitimacy. Documents have limited weight.
      *   (d) *Capacity:* Can't use claimant's storage issues (if traceable to history) as a barrier. We fund remediation.
      *   (e) *Display Value:* Must pass "surrogate test" (replica/digital/story).
      *   (f) *Role Reversal:* Conditions must be reciprocal.
      *   (g) *Claimants:* Continuity of grievance > State locus. Community recognition matters. Handle competing claims.
      *   (h) *Sets/Parts:* Curatorial sets $\neq$ Cultural sets. Retaining tokens generally discouraged.

  3.  **Drafting the Procedure (The "Engine"):**

      *   *Structure:* Needs to be a step-by-step filter.
      *   *Step 1: Triage/Validity.* Is this a claim we process? (Based on g).
      *   *Step 2: Provenance & Burden.* Apply (b) and (a). Is the taking tainted? Is it "live"?
      *   *Step 3: Legitimacy of Transfer.* Apply (c). Does permission matter?
      *   *Step 4: Capacity & Conditions.* Apply (d) and (f). Can we attach strings?
      *   *Step 5: Display Value.* Apply (e). Do we need the original?
      *   *Step 6: Integrity of Object.* Apply (h). Sets and tokens.
      *   *Sign-off:* Where does the human decide?

      *   *Refining the "Live" Definition (a):* Needs to be operational. Let's define "live" as: Community asserts it + Political relation hasn't fundamentally reset (e.g., independence didn't automatically cure colonial theft). If records silent on date, assume recent/continuous grievance.
      *   *Refining Burden (b):* If colonial context + gap = Presumption against Museum.
      *   *Refining Permission (c):* Permission documents only prove *process*, not *justice*. They don't stop restitution but might inform *how*.
      *   *Refining Capacity (d):* If weakness is historical legacy -> Museum pays. If new/negligent -> Can delay slightly but not deny.
      *   *Refining Display (e):* Curator proposes surrogate. Committee approves. If surrogate works -> Return.
      *   *Refining Claimants (g):* Community-recognized body > State. If competing -> Pause for mediation (don't pick sides). If State only -> Accept if no community body exists.
      *   *Refining Sets (h):* Cultural integrity > Curatorial integrity. No tokens.

      *   *Commitments:* I need to make hard choices where the prompt asks.
          *   *Choice 1 (Live):* Define "live" as "claimed by community" rather than a fixed date. *Reason:* Moral continuity outweighs statutory limitation.
          *   *Choice 2 (Permission):* Imperial permission is evidentiary only, not exculpatory. *Reason:* Power imbalance invalidates consent.
          *   *Choice 3 (Capacity):* Museum funds remediation if linked to history. *Reason:* Restorative justice requires resource transfer.
          *   *Choice 4 (Display):* Curator must prove surrogate *fails*. *Reason:* Possession is the exception, not the rule.
          *   *Choice 5 (Claimants):* Community body trumps State. *Reason:* Legitimacy flows from grievance, not borders.

  4.  **Drafting the Case Studies:**

      *   *Case 1 (Benin):*
          *   Provenance: Punitive expedition (Tainted).
          *   Claimants: State + Oba (Both valid, Oba carries grievance).
          *   Conditions: Loan back? (Violates Role Reversal). Rotating display? (Violates Anti-washing/Control). Delay for digitization? (Violates Capacity/Priority).
          *   Outcome: Return unconditionally.
      *   *Case 2 (Parthenon):*
          *   Provenance: 1921 auction, gap before that. Colonial context (Ottoman/British).
          *   Burden (b): Gap counts against Museum.
          *   Permission (c): Ottoman firman doesn't cure.
          *   Display (e): Encyclopedic vs. Reunification. Surrogate test: Can we teach "Empire" with a cast? Yes. Can we teach "Reunification" without the piece? No.
          *   Outcome: Return.
      *   *Case 3 (The Hard One - 1961 Purchase):*
          *   Provenance: 1961 purchase, made 1920s, sold by maker. No taking evident.
          *   Claim: National patrimony law.
          *   Analysis: No "tainted taking" found. Burden of proof (b) applies to *gaps*, but here the record shows sale by maker.
          *   Outcome: No restitution.
          *   Messaging: Acknowledge the asymmetry. "We retain because no theft is evidenced, not because your claim is invalid."

  5.  **Drafting the Limitations:**

      *   What can't this do?
      *   Legal title disputes (courts handle that).
      *   Sacred/Secret objects (requires different protocol).
      *   Human remains (separate policy usually).
      *   Competing community claims (procedure pauses).

  6.  **Review and Refine:**

      *   *Check Constraints:* Is it short enough? Yes, needs to be dense but readable.
      *   *Check Tone:* Is it authoritative? Yes.
      *   *Check Commitments:* Did I pick sides? Yes.
      *   *Check Sign-offs:* Did I identify where the human decides? Yes (Chair/Director for value judgments).
      *   *Check "One-line notes":* Ensure every committed choice has the justification note.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Live" definition is practical for registrars. "Living memory" is vague. Let's tie it to the political relationship status.
      *   *Correction:* Ensure the "20-minute file" constraint is met by the output structure.
      *   *Correction:* In Case 3, ensure the "No" doesn't sound dismissive. The prompt asks what to say *out loud*.
      *   *Correction:* Ensure the "Role Reversal" test kills the "Loan back" idea in Case 1.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Collections Committee Restitution Procedure (v1.0)

  **Purpose:** To triage and recommend on restitution claims within one week for board packet inclusion.
  **Authority:** Committee Chair signs off on factual findings; Director signs off on value judgments.
  **Constraint:** All files must be readable by a non-specialist trustee in 20 minutes.

  ---

  ## Part I: The Decision Procedure

  ### Step 1: Claimant Validity (Position g)
  **Question:** Who is claiming, and do they represent the grievance?
  *   **Test:** Is the claimant a State body OR a community-recognized body carrying continuous grievance?
  *   **Sufficient Answer:** Documentation of recognition (e.g., community mandate, state charter).
  *   **Conflict:** If two community bodies claim the same object, **PAUSE**. Do not proceed until they mediate. If State claims without community body, **PROCEED**.
  *   **Commitment:** Community recognition trumps State locus where they conflict.
      *   *Note: A reasonable committee could prioritize State sovereignty; we prioritize continuity of grievance.*
  *   **Stop:** If claimant is a private dealer or unconnected individual → **NO**.
  *   **Hand-off:** If competing community bodies exist → **Director** (to manage pause).

  ### Step 2: Provenance & Burden (Positions a & b)
  **Question:** Is the dispossession "live," and is the chain complete?
  *   **Test A (Live):** Is the dispossession within living memory OR pre-dating a genuine political reset (e.g., independence did not automatically cure colonial theft)?
      *   *Definition:* If the community asserts it is live, it is live. Silence in records assumes the grievance persists.
      *   *Note: A reasonable committee could set a fixed date cutoff; we prioritize moral continuity over legal finality.*
  *   **Test B (Burden):** If acquired under colonial administration, is there a gap in the chain?
      *   *Rule:* Any gap counts against the Museum. Silence in our documentation is evidence of tainted taking.
      *   *Note: A reasonable committee could require claimant to prove theft; we place the burden on the holder of power.*
  *   **Stop:** If acquisition was post-colonial, private sale, with full chain and no evidence of coercion → **NO** (See Case 3).
  *   **Hand-off:** If records are silent on the "live" status → **Committee Chair** (presume live).

  ### Step 3: Legitimacy of Transfer (Position c)
  **Question:** Does a document of permission exist?
  *   **Test:** Is there an export license, firman, or receipt from an occupying/imperial power?
  *   **Rule:** Permission proves administrative process, not moral legitimacy. It does not block restitution.
  *   **Commitment:** Imperial permission is evidentiary only, not exculpatory.
      *   *Note: A reasonable committee could treat permits as legal title; we treat them as products of power imbalance.*
  *   **Action:** File the document. It does not stop the procedure.

  ### Step 4: Capacity & Conditions (Positions d & f)
  **Question:** Can we attach conditions regarding storage, conservation, or timing?
  *   **Test A (History):** Are the claimant's storage weaknesses traceable to the same historical relation as the taking (e.g., underfunding due to colonial extraction)?
      *   *Rule:* If yes, weaknesses cannot block return. Museum funds remediation.
      *   *Note: A reasonable committee could cite risk to object; we prioritize restorative justice over risk aversion.*
  *   **Test B (Role Reversal):** Would we accept this condition if the roles were reversed?
      *   *Rule:* If no, the condition is void.
      *   *Note: A reasonable committee could prioritize our operational needs; we prioritize reciprocity.*
  *   **Stop:** If conditions fail Test B → **Remove Condition**.
  *   **Hand-off:** Determining "historical traceability" of storage issues → **Committee Chair**.

  ### Step 5: Display Value (Position e)
  **Question:** Does retaining the object serve a unique educational purpose?
  *   **Test:** The Surrogate Test. Can we teach the same lesson with a replica, digital surrogate, or documentation + story of removal?
  *   **Rule:** Curator must prove the surrogate *fails*. "Encyclopedic context" is not unique if the story of removal teaches more.
  *   **Commitment:** Curator must prove surrogate fails; possession is the exception.
      *   *Note: A reasonable committee could assume original objects are inherently superior; we assume context often outweighs material.*
  *   **Hand-off:** Judgment on surrogate adequacy → **Committee Chair** (based on Curator's written case).

  ### Step 6: Integrity of Object (Position h)
  **Question:** Is the object part of a set, or should we retain a token?
  *   **Test:** Is the "set" defined by our catalog or their culture?
  *   **Rule:** Cultural integrity > Curatorial integrity. Do not retain token pieces unless the claimant requests it.
  *   **Commitment:** No tokens retained for "study" without claimant consent.
      *   *Note: A reasonable committee could retain a percentage for research; we prioritize wholeness.*
  *   **Stop:** If Museum wants to split set → **NO** (Return whole).

  ---

  ## Part II: Application to Live Files

  ### File 1: Benin-Type Brass Plaque (1938 Bequest, 1890s Sack)
  *   **Step 1 (Claimant):** Federal Authority + Oba's Court. Both valid. Oba carries grievance; State carries legal locus. Accept joint claim.
  *   **Step 2 (Provenance):** 1897 Punitive Expedition. Tainted taking. "Live" status confirmed by continuous Oba lineage and national claim. Gap in chain irrelevant due to colonial context (Burden on us).
  *   **Step 3 (Permission):** None expected. If British Army receipt exists, it is administrative only.
  *   **Step 4 (Conditions):**
      *   *Long-term loan back:* **BLOCKED.** Fails Role Reversal (we would not accept a loan on our own sovereign property).
      *   *Shared rotating display:* **BLOCKED.** Fails Anti-washing (implies we retain ownership interest).
      *   *Delay for digitization:* **BLOCKED.** Fails Capacity (our project timeline is not their historical burden).
  *   **Step 5 (Display):** Surrogate Test. Can we teach "British Imperialism" with a high-res cast and the story of the sack? Yes. In fact, the cast + story teaches *better* than the looted original.
  *   **Step 6 (Sets):** Return whole plaque. No fragments retained.
  *   **Recommendation:** **RETURN UNCONDITIONALLY.**
  *   **Board Note:** Conditions proposed by staff (loan, delay) violate the committee's agreed Role Reversal and Anti-washing principles. Remediation funding should be budgeted immediately.

  ### File 2: Parthenon Fragment (1921 Auction, Gap pre-1921)
  *   **Step 1 (Claimant):** Greek State. Valid. No competing community body identified.
  *   **Step 2 (Provenance):** Chain goes to 1921, then gap to early 19th century. Colonial/Administrative context (Ottoman/British).
      *   *Decision:* Under Position (b), the gap counts against us. We cannot prove it wasn't removed during the contentious Elgin period.
      *   *Commitment:* The gap triggers the colonial burden of proof.
          *   *Note: A reasonable committee could rule the 1921 auction cleans the title; we rule the gap obscures the original removal.*
  *   **Step 3 (Permission):** Ottoman permission likely exists for Elgin, not this specific fragment. Even if it did, Position (c) renders it non-exculpatory.
  *   **Step 4 (Capacity):** National Gallery in Athens is sufficient. No historical capacity barrier.
  *   **Step 5 (Display):**
      *   *Argument:* Encyclopedic display (context of Empire) vs. Architectural Reunification.
      *   *Decision:* Surrogate Test. A cast teaches "Empire/Collection History." Only the original stone teaches "Architectural Integrity." The reunification argument survives the surrogate test; the encyclopedic argument does not.
      *   *Commitment:* Reunification outweighs Encyclopedic context.
          *   *Note: A reasonable committee could prioritize our local visitors' access to originals; we prioritize the integrity of the source monument.*
  *   **Recommendation:** **RETURN.**
  *   **Board Note:** The burden of proof regarding the 19th-century gap cannot be met. Display value is superseded by architectural integrity.

  ### File 3: Carved Figure (1961 Purchase, 1920s Maker Sale)
  *   **Step 1 (Claimant):** National Heritage Body. Valid State locus.
  *   **Step 2 (Provenance):** 1961 purchase from dealer. Record shows 1920s carving and sale by maker.
      *   *Decision:* No "tainted taking" evidenced. No colonial administration involved in the specific transaction. No gap in chain that suggests coercion.
      *   *Outcome:* Procedure stops at Step 2. **NO RESTITUTION.**
  *   **Step 5 (Display):** Irrelevant, as Step 2 failed.
  *   **Recommendation:** **RETAIN.**
  *   **What to Say Out Loud:** "We have reviewed this claim against our ethical framework. While we acknowledge the asymmetry of global art markets, our procedure requires evidence of dispossession or a broken chain under colonial administration. The record shows a sale by the maker. To return this without evidence of theft would be to prioritize patrimony laws over provenance facts, which sets a precedent we cannot apply consistently to our European holdings. We retain not because your claim is invalid, but because our threshold for evidence of wrongdoing has not been met."
  *   **Commitment:** Provenance facts trump broad patrimony claims absent coercion.
      *   *Note: A reasonable committee could return based on 'cultural affiliation' alone; we require a link to dispossession.*

  ---

  ## Part III: Limitations & Misfires

  **This procedure cannot adjudicate:**
  1.  **Legal Title Disputes:** If a claimant threatens litigation regarding private property law, pause and seek external counsel. This procedure is ethical, not legal.
  2.  **Sacred/Secret Material:** If an object is restricted by gender or initiation, the Curator cannot assess "Display Value." **Hand-off to Director** for confidential consultation with elders.
  3.  **Human Remains:** Separate policy applies. Do not run through Step 5 (Display).
  4.  **Competing Community Claims:** Step 1 pauses the file. This procedure does not have a mechanism to choose between two indigenous groups. External mediation is required.
  5.  **Financial Insolvency:** If the Museum cannot fund the remediation required in Step 4, the procedure recommends return but flags a financial crisis to the Board. It does not allow retention based on our poverty.

  **Sign-Off Authority:**
  *   **Registrars:** Fact-finding (Steps 1-3).
  *   **Committee Chair:** Value judgments on "Live" status, Capacity traceability, and Surrogate adequacy (Steps 2, 4, 5).
  *   **Director:** Final signature on Board Packet, specifically where conditions are rejected or competing claimants exist.

  **Note to Committee:** This procedure is designed to be run in one week. If a file requires more than 10 hours of Registrar time, it has failed the triage. Escalate to the Chair immediately.
