  **CAREENIUM CORPORATION**
  **SUBSTRATE DIVISION**
  **FIELD SERVICE BULLETIN 404-C**

  **TO:** All Licensed Operators, Model C Units
  **RE:** Protocols for Reported Substrate Drift and Causal Attribution

  This bulletin addresses recurring tickets regarding "Substrate Drift," defined as symm trajectories deviating from Newtonian prediction in correlation with high-level symmball configurations. While operators frequently describe these events as "thoughts pushing magnets," Substrate Division reminds owners that the Model C operates under strict causal closure. The microphysical substrate admits no gaps. The following adjudication protocols are now mandatory for all drift claims involving alleged downward causation.

  **1. Form 27-B Filing Requirements**
  Operators alleging downward causation must submit Form 27-B (Report of Macro-Level Influence). Section 4 requires a complete vector account of the interaction. Crucially, the operator must describe the alleged symmball influence using exclusively symm-level vocabulary. You must specify which individual symm transferred momentum to which other symm to instantiate the "symbol-level" event. Failure to isolate the specific micro-collision responsible for the macro-pattern will result in immediate denial. We cannot process claims where the cause is described as a "pattern," "idea," or "self" rather than a coordinate. If you cannot name the symm, the symm did not be shoved by the symbol.

  **2. The Non-Duplication Clause**
  Pursuant to standard warranty terms, the Careenium guarantees sufficient microphysical causation for every state change. If a symm-level cause is identified (as it always is), any concurrent symmball-level cause is deemed redundant. Honoring both would violate conservation laws by double-counting momentum. Therefore, if the symms account for the motion, the symmball is excluded from the causal ledger. You may retain the symmball description for aesthetic or mnemonic purposes, but it carries no causal weight. To assert otherwise is to claim the universe pays momentum twice for the same transaction.

  **3. The Identity Rider**
  Operators often argue that the symmball event is not distinct from the symm event, but rather the same event described differently. Under the Identity Rider, we will honor this claim provided the operator certifies that the symmball is numerically identical to the symm cluster. However, please note: if the symmball *is* the symms, then the causation remains firmly at the symm level. The Rider restores ontological status to the symmball only by conceding it adds no additional shoving power. You are free to say "I pushed the symms," provided you accept "I" refers strictly to the symms themselves.

  **4. Ledger Reclassification**
  All logged drift instances are automatically reclassified upon review. Correlations between symmball states and symm trajectories are recorded as epiphenomenal regularities. No compensation is issued for feelings of agency not backed by microphysical exclusivity. The ledger remains balanced; no momentum has been lost to abstraction. Claims suggesting the walls bounced differently because of "meaning" are treated as sensor calibration errors.

  **Adjudication Example: Claim 8940-I**
  **Operator:** Internal Self-Model (Unit C-7)
  **Incident:** Operator reported deciding to move a symmball cluster, resulting in symm displacement.
  **Investigation:** Telemetry confirmed symm movements occurred. Telemetry also confirmed sufficient prior symm collisions caused these movements.
  **Decision:** Denied.
  **Reasoning:** Operator filed Form 27-B describing the cause as "My Will." This is not symm-level vocabulary. Under the Non-Duplication Clause, the prior symm collisions suffice. Under the Identity Rider, if "My Will" is identical to the symm collisions, the cause is still symm-level. The claim asserts downward causation where only lateral transmission exists.
  **Note:** Operator is reminded that while the feeling of shoving is vivid, the shoving itself is performed entirely by magnets. Please cease filing claims on your own behalf until vocabulary is adjusted.

  ***

  **Notes on the Choices**

  The Careenium, symms, symmballs, and the "who shoves whom" question are Hofstadter's (from *Who Shoves Whom Around Inside the Careenium?* and *I Am a Strange Loop*). The bureaucratic devices—Form 27-B, the Non-Duplication Clause, the Identity Rider, and the Ledger—are mine, designed to operationalize Jaegwon Kim's exclusion argument. The bulletin assumes a definite reading: causal closure of the physical is non-negotiable, and downward causation is a category error. It treats the "Self" not as an agent but as a claimant filing paperwork about itself, highlighting the reflexive oddity of reductionism. Your memory of the Sperry phrasing is correct; Hofstadter credits Sperry with the original "who shoves whom" formulation regarding mind-brain interaction. The bulletin ignores the "Strange Loop" solution (that the shoving is real because the level distinction is porous) to maintain the satirical target: the sterile correctness of the exclusionist view.

  **Is it Fair?**

  The strongest reply for the exclusionist is that physics has never observed a violation of causal closure; momentum is never actually double-counted in the lab. The bulletin is physically correct. However, the joke survives because it exposes the explanatory cost of that correctness. By being scrupulously right about momentum, the manufacturer renders the operator's experience of agency a formal error. The queasiness arises not from physical falsehood, but from the fact that a true description of the substrate leaves no room for the describer. The satire holds because the exclusionist wins the argument but loses the person.
