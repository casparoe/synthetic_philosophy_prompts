      *   **Miriam 3 (Intensity vs. Richness):** Conflates richness of life with urgency of suffering. Agony is agony regardless of neuron count. Robustness claim: Conclusion survives deeper discounts. Burden of proof on skeptics to show prob < robustness range.
      *   **Anselm 3 (The Sign Problem):** Wild insects are r-selected. Most lives are net negative (starve, eaten). Taking welfare seriously implies reducing abundance (fewer hedgerows, more paving). *Reductio ad absurdum* (nobody endorses this).
      *   **Miriam 4 (Wild vs. Farmed Distinction):** Concedes sign problem for wild insects. Distinguishes wild (equilibrium, death fixed by recruitment) vs. farmed (exist only because we breed them). Not breeding farmed insects reduces total without conservation conflict. This is the target.

