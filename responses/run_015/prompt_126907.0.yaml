          *   (c) Neural scaling is controversial. Panpsychists or hedonists might disagree (pain is pain), but functionalists might agree. It's a valid counter-argument to her weighting.
      *   **Miriam 3:** *Partly Right.* The distinction between *capacity* for suffering and *richness* of life is philosophically defensible (negative utilitarianism focus). *Weakness:* The "robustness" claim is an assertion. She shifts the burden of proof, which is rhetorically effective but logically circular if the prior is the dispute.
      *   **Anselm 3:** *Right (Logically), Mistaken (Practically).* The logic holds: if wild insect welfare matters, wild insect reduction follows. *Weakness:* It assumes the only way to improve welfare is reducing numbers. It also assumes "nobody would endorse this" is a refutation (appeal to popularity/intuition vs. moral truth). However, as a *reductio*, it works against naive aggregation.
