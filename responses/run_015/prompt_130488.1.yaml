answer: |-
  ### The list

  1.  **Entrusted Power:** The act must involve a role holding authority delegated by the public or an organisation. *Case:* The clerk inventing a queue holds power over access; a private citizen does not. **Tag:** Non-negotiable (Universalist).
  2.  **Private Gain:** There must be a benefit accruing to the official or their clique, distinct from public policy goals. *Case:* Clientelism looks like service, but if benefits route only to co-villagers for votes, it is private gain. **Tag:** Non-negotiable (Universalist).
  3.  **Duty Violation (Spirit):** The act violates the intended purpose of the role, even if it follows written rules. *Case:* The minister routing benefits legally to his village breaches the spirit of impartial allocation. **Tag:** Non-negotiable (Universalist).
  4.  **Manufactured Scarcity:** Creating an obstacle solely to solicit a bypass payment counts as corruption, regardless of local custom. *Case:* The clerk inventing a queue to sell skips is corrupt, even if everyone pays. **Tag:** Non-negotiable (Universalist).
  5.  **Secrecy Threshold:** Concealment is a strong heuristic for corruption; transparency mitigates it. *Case:* The vendor gift was logged and open; had it been hidden, it would be suspect. **Tag:** Preference (Universalist).
  6.  **Cross-Border Baseline:** Agents must adhere to the stricter of home or host country standards when operating abroad. *Case:* The NGO firm cannot claim local bribery norms excuse violations of their home procurement laws. **Tag:** Preference (Universalist/Legal).
  7.  **Local Norms Defence:** Survival payments in dysfunctional systems are distinct from enrichment schemes. *Case:* The border fee might be 'etiquette' if the alternative is starvation, but not if it funds private luxury. **Tag:** Preference (Anthropological).
  8.  **Welfare Impact:** Significant harm to public efficiency or welfare elevates the severity of the act. *Case:* Regulatory capture that stifles competition is corrupt even without cash changing hands. **Tag:** Preference (Economist).
  9.  **Gradability:** Corruption is a spectrum of severity, not a binary switch. *Case:* Systemic rot differs from a one-off error; prioritisation depends on the degree. **Tag:** Non-negotiable (Universalist/Economist).
  10. **Intent vs. Negligence:** Deliberate subversion differs from incompetence, though both may require remediation. *Case:* Nepotism implies intent; a bad hire might not. **Tag:** Preference (Universalist).

  *Note on Politics:* Requirements 6 and 7 are explicitly political. The Universalist/Legal camp demands 6 to maintain integrity across borders, while the Anthropological camp demands 7 to avoid imperialistic judgements on local survival strategies. You cannot fully satisfy both without a hierarchy; this spec prioritises 6 for organisational liability, but uses 7 for individual moral blame. Requirement 8 is Economist politics, prioritising outcomes over deontology. Requirement 5 is Universalist, assuming transparency equals legitimacy, which local contexts may dispute.

  ### The collisions

  Three pairs here cannot be jointly satisfied without prioritisation. First, **Cross-Border Baseline (6) clashes with Local Norms Defence (7).** If the home country bans facilitation payments but the host country expects them, you cannot both comply with home law and respect local etiquette. *Resolution:* Drop 7 where it conflicts with 6. The NGO must follow home law to avoid liability, though it may mitigate internal sanctions for staff acting under duress.

  Second, **Welfare Impact (8) clashes with Duty Violation (3).** Sometimes breaking a rule (e.g., bypassing red tape) improves welfare. A pure welfare account would call this good; a duty account calls it corrupt. *Resolution:* Drop pure welfare. Rule-breaking for efficiency is still corruption, albeit potentially justifiable corruption. Keep the label accurate to maintain institutional integrity.

  Third, **Gradability (9) clashes with Legal Binary.** Law often requires an on/off switch for prosecution, but reality is graded. *Resolution:* Drop the legal binary for internal governance. Use the graded scale for prioritisation and risk assessment, reserving the binary label only for formal sanctions.

  ### What it rules out

  This spec primarily relies on **Duty Violation (Spirit) (3)** to exclude the **Purely Legalistic Account**. A legalistic theory would say the minister's benefits allocation is clean because it followed written rules; this spec flags it as corrupt because it violated the impartial spirit of the office. This is the heavy lifter for your benefits-allocation model.

  Secondly, **Entrusted Power (1)** excludes the **Purely Welfare-and-Efficiency Account**. An economist might call a private monopoly corrupt due to market harm, but without entrusted public power, it is merely anti-competitive behaviour, not corruption. This keeps your scope focused on governance.

  Finally, **Cross-Border Baseline (6)** excludes the **Purely Local-Norms Account**. Relativism suggests whatever is normal locally is permissible. This spec rejects that for international actors, asserting that exported standards apply. This prevents the 'cultural etiquette' defence from swallowing the rule of law in field offices.

  ### Applied to my two cases

  **Vendor Gift:** This clears the bar. It involves entrusted power (1), but fails the Secrecy Threshold (5). Because it was logged and transparent, it lacks the concealment typical of private gain (2). It is not corrupt, though it remains a risk factor.

  **Border Fee:** This fails the Manufactured Scarcity test (4). If the delay was artificial to solicit payment, it is corrupt regardless of local norms (7). If the fee was a standard, unavoidable tariff known upfront, it is merely a cost of business. The key is whether the obstacle was invented to sell the solution.
