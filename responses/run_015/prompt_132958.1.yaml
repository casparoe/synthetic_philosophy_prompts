      *   *VR Simulation (Matrix/Red Pill):* Pop-culture version. Implies there *is* a real world, you are just plugged in. Solvable by unplugging.
      *   *The "Engineering Fix":* The idea that skepticism is just a lack of data resolution. If we measure better, we know we're real.
      *   *Physicist's Insight:* Calibration loops. You can't calibrate a meter with a meter that needs calibrating. You need a standard *outside* the system.
      *   *Core Tension:* VR implies a dualism (Real World vs. Simulated World). BIV (in the radical skeptical sense) questions the coherence of "Real World" itself from the subject's perspective.

  3.  **Drafting the Correspondence Table:**
