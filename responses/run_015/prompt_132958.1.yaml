      *   The "calibration loop" says: Skepticism = structural impossibility of self-verification.
      *   Verdict: The VR analogy *hides* the problem rather than solving it. It makes skepticism look like a containment breach (fixable) rather than a foundational limit (unfixable). The conclusion ("build a better sensor") fails because of the calibration loop.

