answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague of Elaine's, which means I've had the privilege of watching her work for over thirty years. Looking around this room, I see a rather specific divide. On my left, we have the family, who know Elaine primarily as the woman who never met a claret she didn't like. On my right, the classicists, who know her as the author of *The Wine Mirror*.

  Usually, one tries to bridge that gap by simplifying the work for the family, or dumbing down the anecdotes for the academics. But tonight, I think we should do what Elaine would do: let the theory dictate the toast.

  For four decades, Elaine argued that Plato's *Laws* wasn't about temperance in the boring sense. She taught us that Book I isn't banning drink; it's prescribing it. Her thesis was that controlled intoxication acts as a civic diagnostic. Wine doesn't corrupt character, she wrote; it strips away the social polish that hides it. It dissolves the *schēma*—the outward form—to reveal the *ēthos* beneath.

  Now, this philosophical framing is crucial, because it stops me from standing here and pretending Elaine was a saint. We all know she wasn't. And thank goodness for that.

  If Elaine's theory holds water—and given the monograph, we must assume it does—then those moments after her second glass weren't lapses in judgement. They were data points. We've all been on the receiving end of what happens when the social polish dissolves. She could be quite cutting. There were department meetings where the wine was flowing, the polite fictions of academia were evaporating, and Elaine would say exactly what everyone else was thinking but too cowardly to voice.

  If I were to smooth that over, to say "she was really quite sweet underneath," I would be contradicting her life's work. I would be suggesting the wine corrupted her. But Elaine taught us that the wine *revealed* her.

  So, what did we learn about her character over three decades of these gatherings? We learned that beneath the academic tenure and the polite dinner party manners, there was a woman of rigorous, unvarnished honesty. Yes, it stung sometimes. Yes, she could be sharp. But that sharpness wasn't a flaw; it was the integrity of the diagnostic working properly. She refused to let the social contract lie for her.

  To her family: you knew she loved the wine. But now you know why. She wasn't just enjoying the vintage; she was testing the truth of the room. And to her colleagues: we may miss her expertise, but I suspect we'll miss that diagnostic clarity even more. It is rare to find a scholar whose life so perfectly mirrors their text.

  Elaine, you've spent forty years teaching us how to read the bottle. Now, finally, you're putting it down. We promise to keep the glasses full, and the honesty flowing.

  To Prof. Voss.
