prompt: |-
  I work on the product governance team at a savings and investing app — around three million users, mostly people who've never invested before, and most of them on their phone at 11pm. Every proposed change to the app comes past me for a half hour review before it can ship: I write a one pager, and it has to be signed off by our head of product and by legal, neither of whom has any philosophy and both of whom will read two pages maximum. We look at four or five flows a month. The argument we keep having is whether a flow is *taking advantage* of people, and it goes in circles because everyone in the room is using a different test without noticing. I was arguing about this with a mate who did a philosophy degree and he said the thing I'm groping at is the money pump argument, so I've been reading a bit on my own and it feels exactly right but I can't get from the idea to something I can run on a Tuesday afternoon. The bit that seems to matter and that nobody here can articulate is the difference between a set of preferences that can be exploited in one go — you lay out a menu and whichever way they choose they lose — and a *sequence* of choices where each individual choice looks perfectly sensible to the person making it at the time and the damage only shows up when you add them up. Our head of product says if each step is fine then the whole thing is fine and I'm pretty sure that's the exact mistake but I can't say why in words he'd accept.

  We've drifted into four rough labels in my notes and I suspect they're doing philosophical work I haven't noticed: 'rake' (we take a fixed cut on a transaction, that's just a fee, nobody minds), 'switchback' (the flow gets someone to move back and forth between two states and pay each time), 'treadmill' (nothing cycles, but the framing keeps restarting the same decision so it gets made over and over), and 'pump' (saved for when someone ends up strictly worse off and nothing they value got produced along the way). I think 'treadmill' might actually be the interesting one rather than the boring one but I can't defend that. So: write me a decision procedure, in the order I should ask the questions, that comes out of what this literature actually says — the questions in order, what counts as a sufficient answer to each, which questions should end in a hard no, and which ones have to be handed to a human being because they're a values call dressed up as a factual one. It needs to survive being read by a lawyer and a data scientist who will both push back. There are some cases I specifically need it to handle. Our legal person's favourite test is 'would the user have agreed to the whole sequence up front?' and I don't trust it but I don't know what's wrong with it. Then there's the user who knows they'll end up slightly poorer and does the whole thing anyway because fiddling with the app is the fun part — if the process is the product, is there any money pump left? And the user whose preferences genuinely shift mid-sequence because they learned something, which feels like it should be completely fine and not exploitative at all. Also: is a hundred tiny losses the same objection as one large one, or does the smallness of each step actually matter to the argument? Our data scientist says we should just A/B test everything and look at whether users end up with less money, and I want to know why that isn't sufficient, if it isn't — partly because we can't run clean experiments on things that have already shipped. And one thing that genuinely bugs me: if these flows really were exploiting an incoherence in someone's preferences, wouldn't we expect some users to just bleed out completely? They don't. So is the whole idea secretly unfalsifiable, or does that tell us something about which version of the argument to use?

  Run it on three flows. First: a streak feature where if you'd miss a week you can pay two quid to freeze your streak, and the freeze button appears about four seconds after the missed week and nowhere else. Second: a switchback where users get a notification when markets fall nudging them into the safe pot and one when markets rise nudging them into the growth pot, fifty pence a swap, and the nudge copy is written to match whatever they said they wanted in onboarding. Third, and this is the one I actually need: boost tokens, where each month you get three free boosts that lift the rate on one of your pots for thirty days, you have to activate them by hand, they expire at month end, and the pot that's boosted rotates each month so people keep shuffling balances between pots — we shipped it eight months ago, it's our most used feature, engagement went up a lot, users say in the reviews that they enjoy it, and it's in our current marketing. If your procedure says we should pull it, say that plainly and tell me what I'd have to argue to the committee to keep it anyway, and be honest about whether your procedure can say anything useful about a feature that's already live and that we can't cleanly experiment on now.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the User and the Problem:**
      *   **User Role:** Product Governance at a savings/investing app (3M users, novices, mobile, late-night usage).
      *   **Task:** Review proposed changes (one-pager, 30 mins, sign-off by Head of Product & Legal).
      *   **Core Conflict:** Determining if a flow is *exploitative* ("taking advantage").
      *   **Current Friction:** Head of Product (HoP) argues "if each step is fine, the whole is fine." User suspects this is the "Money Pump" fallacy but can't articulate it simply. Legal uses "ex-ante consent" test ("would they agree up front?"). Data Scientist wants A/B tests on net wealth.
      *   **User's Taxonomy:** 'Rake' (fee), 'Switchback' (cycle/pay), 'Treadmill' (restart decision), 'Pump' (strictly worse off, no value).
      *   **Specific Questions to Answer:**
          *   Why HoP's "step-by-step" logic is flawed.
          *   Why Legal's "ex-ante consent" is flawed.
          *   Does "fun/process as product" negate exploitation?
          *   What about genuine preference shifts (learning)?
          *   Do small losses aggregate to the same objection as large ones?
          *   Why A/B testing net wealth isn't sufficient.
          *   Why don't users "bleed out" completely (falsifiability)?
          *   **Application:** Run the procedure on three specific flows (Streak Freeze, Market Switchback, Boost Tokens).
      *   **Constraint:** Needs to be a decision procedure (ordered questions, pass/fail criteria, human escalation points) that survives scrutiny from Legal and Data Science. Max 2 pages effectively (since HoP/Legal read max 2 pages).

  2.  **Theoretical Grounding (The "Philosophy" Bit):**
      *   *Money Pump Argument:* If preferences are intransitive (A>B, B>C, C>A), an agent can be pumped for money indefinitely. The core ethical violation is *exploiting cognitive error* vs. *serving revealed preference*.
      *   *Exploitation:* Taking advantage of a vulnerability (bias, friction, ignorance) to extract value without providing commensurate benefit.
      *   *HoP's Error:* Ignoring *dynamic inconsistency*. A choice made at T1 might be rational, but if the system manipulates the context at T2 to reverse T1 without new information, that's exploitation.
      *   *Legal's Error:* "Ex-ante consent" fails because of *bounded rationality*. Users can't foresee how they will be manipulated in the moment (hot/cool empathy gap).
      *   *Data Science's Error:* Net wealth isn't the only utility. "Fun" counts. Also, A/B tests often miss long-tail harm or aggregate small losses that look insignificant individually but matter systemically.
      *   *The "Bleed Out" Objection:* Users don't bleed out because they have *stopping rules* (run out of money, get angry, notice). Exploitation doesn't require infinite extraction, just extraction beyond the value provided.

  3.  **Drafting the Decision Procedure (The "Tool"):**
      *   Needs to be actionable.
      *   Needs to address the specific taxonomies ('Rake', 'Switchback', 'Treadmill', 'Pump').
      *   Needs to handle the "Tuesday afternoon" constraint.
      *   *Structure:*
          1.  Value Check (Is value created?)
          2.  Friction/Agency Check (Is the choice free/informed?)
          3.  Sequence Check (The Money Pump test).
          4.  Aggregation Check (Death by 1000 cuts).
          5.  Escape Valve (Human review).

  4.  **Refining the Questions (Iterative Process):**
      *   *Q1: Value.* Does the user get something they value? (Addresses "Process is Product").
      *   *Q2: Transparency.* Do they know the cost *before* the impulse? (Addresses Legal's consent).
      *   *Q3: Reversibility/Loop.* Does the flow encourage undoing a recent decision without new info? (Addresses HoP's step-by-step & Switchbacks).
      *   *Q4: Aggregation.* Do small costs accumulate to a significant % of principal? (Addresses Data Scientist).
      *   *Q5: Vulnerability.* Does this target a specific cognitive bias (loss aversion, endowment)?

  5.  **Addressing the Specific Flows:**
      *   *Flow 1: Streak Freeze.*
          *   Cost: £2.
          *   Trigger: Missed week (negative emotion).
          *   Timing: 4 seconds after (panic).
          *   Analysis: High risk. Targets loss aversion. No value created (streak is artificial).
      *   *Flow 2: Market Switchback.*
          *   Cost: 50p/swap.
          *   Trigger: Market moves (volatility).
          *   Framing: Matches onboarding (trust).
          *   Analysis: Classic Money Pump. Encourages timing the market (bad for novices). Fees eat returns.
      *   *Flow 3: Boost Tokens (The Hard One).*
          *   Cost: "Free" tokens, but requires shuffling balances.
          *   Benefit: Higher rate for 30 days.
          *   Friction: Manual activation, expiry, rotating pots.
          *   Status: Live, popular, engagement up.
          *   Analysis: This is the 'Treadmill'. Is the shuffling value-neutral? If the rate boost > effort, it's a gamified savings tool. If the shuffling causes missed opportunities or confusion, it's a pump. *Crucial:* The rotation forces movement. Is the movement valuable?
          *   *Verdict:* Likely needs modification, not pull, but strict monitoring. The "rotation" is the suspicious part. Why rotate? To drive engagement? That's a 'Treadmill'.

  6.  **Addressing the User's Specific Philosophical Queries:**
      *   *HoP's "Step-by-Step":* Refute using *Dynamic Inconsistency*. The context changes the preference.
      *   *Legal's "Ex-Ante":* Refute using *Bounded Rationality*. You can't consent to a manipulation you can't predict.
      *   *Fun vs. Exploitation:* If the *game* is the product, fees must be transparent entry fees, not hidden penalties.
      *   *Small vs. Large:* Yes, aggregation matters. Behavioral economics shows small frictionless payments are *more* exploitative because they bypass pain-of-paying.
      *   *Bleed Out:* Users stop due to budget constraints or frustration, not because exploitation isn't happening.
      *   *A/B Testing:* Lagging indicator. By the time wealth drops, harm is done. Also misses "regret."

  7.  **Finalizing the Output Structure:**
      *   **Part 1: The One-Pager Procedure.** (Designed to be copy-pasted into the user's actual one-pager). Clear questions, Pass/Fail/Escalate.
      *   **Part 2: The Arguments.** (For the meeting). How to talk to HoP, Legal, Data.
      *   **Part 3: The Flow Analysis.** (Running the tool on the three cases).
      *   **Part 4: The "Boost" Verdict.** (Specific advice on the live feature).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Simplify the language. Use the user's taxonomy ('Rake', 'Pump', etc.).
      *   *Critique:* Will Legal accept it?
      *   *Fix:* Frame it as "Reputational Risk" and "Treating Customers Fairly" (TCF) principles, which regulators love.
      *   *Critique:* Will Data accept it?
      *   *Fix:* Acknowledge A/B tests but define *leading* indicators (churn, support tickets, regret surveys).
      *   *Critique:* The Boost Token feature is live. Telling them to "pull it" might be unrealistic.
      *   *Fix:* Provide a "Remediation" path. If it stays, what guards are needed? (e.g., auto-renew, stop rotation).

  9.  **Final Polish:** Ensure the tone is empathetic to the user's position (stuck in the middle) but rigorous enough to arm them. (The prompt asks for a decision procedure *in the order I should ask the questions*.)

  *(Self-Correction on the "Money Pump" definition)*: I need to be careful. A true money pump requires intransitive preferences. In UX, it's often *induced* intransitivity via framing. I should clarify that distinction in the "Arguments" section so the user doesn't get caught out by a philosopher friend later.

  *(Refining the "Boost" analysis)*: The key issue with Boost Tokens is the *rotation*. If I have £1000, and Pot A gets boosted, I move £1000 to A. Next month Pot B gets boosted. I move £1000 to B. This is a 'Switchback' disguised as a 'Reward'. The value is the interest, the cost is the cognitive load + risk of forgetting. If the interest > cost, it's fine. If the rotation is *only* to drive app opens, it's a 'Treadmill'. I need to be honest: if the rotation is arbitrary, it's exploitative engagement farming.

