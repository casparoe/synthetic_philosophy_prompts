answer: |-
  Here is a decision procedure designed for your constraints. It translates the philosophical concepts (Money Pump, Dynamic Inconsistency, Bounded Rationality) into product governance language that Legal and Data can engage with.

  Following the procedure, I have addressed your specific theoretical questions (HoP, Legal, Data arguments) and run the procedure on your three flows.

  ### Part 1: The Exploitation Decision Procedure (EDP)

  **Purpose:** To distinguish between *value exchange* (Rake) and *preference exploitation* (Pump/Treadmill).
  **Format:** Five sequential questions. Answering "No" to Q1 or Q2 is a Hard Stop. Answering "No" to Q3, Q4, or Q5 requires escalation to the Governance Committee with a mitigation plan.

  **Q1: The Value Floor (Is this a Rake or a Pump?)**
  *   **Question:** Does this flow produce a tangible asset, return, or utility that persists *after* the session ends?
  *   **Pass:** Yes (e.g., transaction executed, interest earned, knowledge gained).
  *   **Fail:** No (e.g., status badge, streak maintained, artificial urgency resolved).
  *   **Action:** **Hard Stop.** If no external value is created, fees or friction are purely extractive.
  *   **Philosophical Basis:** Distinguishes 'Rake' (fee for service) from 'Pump' (fee for nothing).

  **Q2: The Ex-Ante Clarity Test (The Legal Fix)**
  *   **Question:** Is the total cost (monetary + cognitive) of this sequence visible *before* the user enters the first step, without requiring them to click through to discover it?
  *   **Pass:** Yes (Upfront pricing, clear terms).
  *   **Fail:** No (Costs revealed mid-flow, expiry dates hidden, fees charged post-action).
  *   **Action:** **Hard Stop.** "Would they agree up front?" is invalid if they couldn't know the terms up front.
  *   **Philosophical Basis:** Addresses *Bounded Rationality*. Consent requires information.

  **Q3: The Reversal Check (The HoP Fix)**
  *   **Question:** Does this flow encourage the user to reverse a decision made within the last 30 days *without* new external information (e.g., life event, market news)?
  *   **Pass:** No (Decisions are sticky or driven by user-initiated research).
  *   **Fail:** Yes (Nudges to swap based on noise, timers that force re-selection).
  *   **Action:** **Escalate.** Requires evidence that the reversal serves the user's stated long-term goal.
  *   **Philosophical Basis:** Identifies the *Money Pump*. If A→B costs money and B→A costs money, and the user cycles without new info, preferences are being manipulated, not served.

  **Q4: The Aggregation Limit (The Data Fix)**
  *   **Question:** If a user engages with this flow at the 90th percentile frequency, do the cumulative costs (fees + opportunity cost) exceed 5% of their expected annual return or principal?
  *   **Pass:** No.
  *   **Fail:** Yes.
  *   **Action:** **Escalate.** Small frictionless payments bypass "pain of paying."
  *   **Philosophical Basis:** Addresses *Death by 1000 Cuts*. Small losses are *more* exploitative than large ones because they avoid cognitive resistance.

  **Q5: The Exit Ramp (The Vulnerability Check)**
  *   **Question:** Can the user easily opt-out of the sequence permanently, or does the feature reset/re-engage automatically (e.g., expiring tokens, rotating pots)?
  *   **Pass:** Opt-out is persistent and easy.
  *   **Fail:** Feature requires manual maintenance to avoid loss (expiry) or resets automatically (rotation).
  *   **Action:** **Escalate.** This indicates a 'Treadmill'.
  *   **Philosophical Basis:** Identifies *Dynamic Inconsistency*. If the system forces me to re-decide to maintain my status quo, it is taxing my willpower.

  ---

  ### Part 2: Answering Your Theoretical Objections

  **1. Why HoP is wrong ("If each step is fine, the whole is fine")**
  HoP is ignoring **Dynamic Inconsistency**. A choice at T1 (Invest) is rational. A choice at T2 (Sell) might be rational *if* based on new info. If T2 is triggered by a notification designed to induce panic/excitement without new info, the *sequence* exploits the gap between T1-You (planner) and T2-You (doer).
  *   **The Argument:** "We are not measuring the rationality of the atom; we are measuring the coherence of the chain. A chain of rational choices can form an irrational loop if the context is manipulated between links."

  **2. Why Legal is wrong ("Would they agree up front?")**
  This assumes **Perfect Foresight**. Users cannot consent to a psychological trap they haven't experienced. They might agree to "trading fees," but they cannot agree to "being nudged to trade when I am emotionally vulnerable" because they don't know they will be vulnerable.
  *   **The Argument:** "Consent requires comprehension. We cannot ask for consent on a manipulation that relies on the user *not* comprehending the impact in the moment."

  **3. Why Data is wrong ("Just A/B test net wealth")**
  Net wealth is a **Lagging Indicator**. By the time wealth drops significantly, the harm is done. Also, A/B tests miss **Regret**. A user might end up with slightly more money but be so stressed they churn. Furthermore, you cannot A/B test things already shipped (your Boost tokens).
  *   **The Argument:** "Wealth isn't the only utility. Stress and churn are costs. Also, small fees are designed to be statistically invisible in short-term wealth tests while aggregating to significant revenue for us."

  **4. The "Fun" Exception (Process as Product)**
  If the fiddling *is* the product (like a game), fees must be framed as **Entry Costs**, not **Penalties**.
  *   **The Test:** Is the fee charged to *play* (transparent, upfront) or to *avoid losing progress* (penalty)? If it's a penalty for stopping play, it's a treadmill, not a game.

  **5. The "Bleed Out" Objection (Why don't they go to zero?)**
  Exploitation doesn't require infinite extraction; it requires extraction **beyond value provided**. Users stop because of **Budget Constraints** or **Frustration**, not because the exploitation stops. The fact they don't bleed to zero just means they have other bills to pay.
  *   **The Insight:** The lack of total ruin doesn't prove fairness; it proves users have stopping rules. We should not design to the limit of their stopping rules.

  ---

  ### Part 3: Running the Procedure on Your Flows

  #### Flow 1: Streak Freeze (£2, 4s after miss)
  *   **Q1 (Value):** **Fail.** A streak is an internal metric. Paying £2 to preserve a number creates no external asset.
  *   **Q2 (Clarity):** **Fail.** Button appears 4 seconds after the miss (panic state).
  *   **Q3 (Reversal):** N/A.
  *   **Q4 (Aggregation):** **Fail.** £2/week = £104/year. On a small savings pot, this is massive.
  *   **Q5 (Exit):** **Fail.** Streaks reset automatically; requires payment to maintain status quo.
  *   **Verdict:** **Hard Stop.** This is a pure **Pump**. It monetizes loss aversion without creating value.
  *   **Fix:** Remove the pay-to-freeze. Let streaks break. Monetize via cosmetic badges if necessary, not functional freezes.

  #### Flow 2: Market Switchback (50p/swap, nudged on volatility)
  *   **Q1 (Value):** **Fail.** Novices timing the market generally lose value vs. holding. The "value" is negative expected return.
  *   **Q2 (Clarity):** **Pass.** 50p is likely visible.
  *   **Q3 (Reversal):** **Fail.** Nudges encourage swapping Safe→Growth→Safe based on noise, not new info.
  *   **Q4 (Aggregation):** **Pass/Fail.** Depends on volume. 50p is small, but frequent swapping kills compounding.
  *   **Q5 (Exit):** **Pass.** User can turn off notifications.
  *   **Verdict:** **Escalate.** This is a classic **Money Pump**. It encourages intransitive preferences (Safe is better when down, Growth is better when up) driven by your notifications.
  *   **Fix:** Add a "Cooling Off" period. If you swap, you cannot swap back for 30 days. This forces the decision to be T1-consistent.

  #### Flow 3: Boost Tokens (Live, 3/month, rotate pots, expire)
  *   **Q1 (Value):** **Pass.** Higher interest rate is tangible value.
  *   **Q2 (Clarity):** **Pass.** Terms are likely known.
  *   **Q3 (Reversal):** **Fail.** The *rotation* forces shuffling. If Pot A is boosted, I move money. Next month Pot B is boosted, I move money. This is a **Switchback** disguised as a reward.
  *   **Q4 (Aggregation):** **Pass.** The "cost" is cognitive load and risk of missing the expiry.
  *   **Q5 (Exit):** **Fail.** Tokens expire. This forces engagement to avoid loss. This is a **Treadmill**.
  *   **Verdict:** **Escalate (High Risk).**
      *   **The Problem:** The *rotation* is the exploit. If the goal is to give users higher rates, why rotate the eligible pot? Rotation drives engagement (opens), not user wealth. It forces users to manage the app rather than their money.
      *   **The "Fun" Defense:** Users say they enjoy it. This is the strongest counter-argument. If the *game* is the product, the fees (cognitive load) are the entry price.
      *   **However:** Expiry dates on *value* (boosts) create artificial scarcity to drive login frequency. That is a Treadmill.

  ### Part 4: What to do about the Boost Tokens (The Live Feature)

  You cannot pull this feature without a fight. It is your highest engagement driver. However, the EDP flags it as a **Treadmill**.

  **The Governance Argument to Keep It:**
  You must argue that the "Game" is the product, but you need to decouple the *Value* from the *Engagement*.

  **Required Mitigations to Sign Off:**
  1.  **Remove Expiry on Activation:** Once a boost is activated, it should run its 30 days without requiring the user to "claim" it in a specific window. Expiry on *unused* tokens is fine (scarcity); expiry on *activation windows* is friction (treadmill).
  2.  **Stop the Rotation (or Randomize less):** If the pot rotation forces users to move balances, that is friction. Allow boosts to apply to *any* pot, or lock the boost to the pot where the money sits. Forcing balance shuffling creates operational risk for the user (settlement times) and cognitive load.
  3.  **Auto-Renew Option:** Add a setting: "Auto-apply boost to largest pot." If users choose this, they get the value without the treadmill. If they choose manual, they are choosing the game.

  **If you cannot make these changes:**
  You must acknowledge to the committee that this feature relies on **Dynamic Inconsistency**. Users *say* they like it now (T1), but the design relies on them forgetting or panicking at T2 (expiry).
  *   **The Compromise:** Propose a "Power User" toggle. If a user turns on "Auto-Pilot," they get the boosts without the shuffling. If they keep "Manual," they acknowledge they are playing a management game. This separates the *investors* from the *gamers*.

  **Why this survives Legal/Data:**
  *   **Legal:** You are offering a "Fair" alternative (Auto-Pilot). You are not trapping them, you are offering a service (Manual) and a utility (Auto).
  *   **Data:** You can A/B test the "Auto-Pilot" feature. If engagement drops but retention stays same, you prove the engagement was friction, not value.

  ### Summary for your One-Pager
  1.  **Streak Freeze:** Kill it. It's a Pump. No value, pure anxiety tax.
  2.  **Switchback:** Restrict it. 30-day lock-up on swaps. Stop the Money Pump.
  3.  **Boost Tokens:** Modify it. Remove the forced shuffling (rotation) and the activation expiry window. Offer an "Auto-Apply" option. If the feature is valuable, users should want the rate, not the shuffling.

  **Final Word:**
  The fact that users don't "bleed out" doesn't mean they aren't being pumped. It means they have lives outside your app. Your job is to ensure that when they *are* in the app, at 11pm, on their phone, they are making decisions their 9am self would respect. The EDP above tests for exactly that.
