  Did privacy-as-control collapse? Yes, because "clicking agree" became a ritual devoid of meaningful choice regarding the *consequences* of data flow. Epistemic autonomy was destroyed because the informational environment was engineered covertly. People cannot self-govern their beliefs if they cannot see the architects shaping their feed.

  Where does the theory go silent? It struggles to adjudicate blame between Facebook (the enabler) and CA (the operator). Both degraded autonomy, but FB sold the shovel while CA dug the hole. The autonomy view implicates the system design itself, suggesting FB bears greater responsibility for creating an opaque epistemic ecosystem.

