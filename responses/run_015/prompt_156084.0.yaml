answer: |-
  The projector hums, a thin electric insect trapped in the plaster ceiling. On the screen, magnified to the size of a dinner plate, hangs the glyph. It is a perfect circle. It is black on white. It has no stem, no ear, no aperture. It is geometrically indistinguishable from the lowercase 'o' in the same font, yet Núria Ferran-Vidal insists it is an 'a'.

  Núria sits at the long laminate table, her fingers interlocked so tightly her knuckles bleach. Across from her, the Script Registry committee shifts in their chairs. They are the gatekeepers of the digital alphabet, the ones who decide if a shape gets a code point, a place in the universal memory of machines. If they say no, her typeface *Peristyle* remains a collection of unencoded vectors. If it remains unencoded, the TransEuro Rail tender slips away. The signage for the new high-speed line requires a custom font, and TransEuro wants *Peristyle* for its legibility at two hundred kilometers per hour. But their systems demand standard Unicode compliance. They need to know that when a computer reads the glyph, it knows it is an 'a'.

  "It closes," says Aris Thorne, the technical lead. He points a laser dot at the center of the projected circle. "Topology is binary here. A bowl with an aperture is an 'a'. A closed bowl is an 'o'. This is closed. Therefore, it is an 'o'."

  "In isolation," Núria says. Her voice sounds too loud in the acoustically dead room. "In *Peristyle*, the 'o' is slightly wider. It is an ellipse. The 'a' is a true circle. But yes, alone, they are twins."

  "Search functions don't run on context," Aris says. "If I Ctrl+F for 'platform', and your 'a' is encoded as 'o', the system sees 'ploform'. The signage fails. The contract fails."

  Núria stands. She walks to the screen, blocking the light. Her shadow swallows the circle. "You are defining the letter by its parts. By its anatomy. But a letter isn't a bone structure. It's a role."

  She clicks the remote. The screen changes. Now the circle is nestled between a 'p' and a 't'. *p ⃝ t*.

  "Read it," she says.

  The committee members blink. The oldest of them, Elias Vane, a historian who tracks genealogy rather than geometry, leans forward. "Pot," he says. Then he frowns. "Or pat."

  "It reads as 'a'," Núria says. "Because in the system of *Peristyle*, the 'o' is reserved for the sound 'o'. The brain assigns the role based on the negative space around it. The letter is defined by what it is not. In my font, that circle is not an 'o'. Therefore, it must be an 'a'."

  "That's structuralism," Elias says softly. He rubs his thumb over a manila folder. "But letters have ancestors. A shape without lineage is a monster. The single-storey 'a' comes from the Italic hand, the quick stroke of the nib. It has a tail, even if it's hidden. Your circle... where did it come from? It has no history. It has no DNA."

  "It comes from the pixel," Núria says. "It comes from the need to be seen from a distance. When you are moving fast, the aperture of a traditional 'a' fills in. It becomes a circle anyway. I am just admitting the truth of the medium."

  Aris shakes his head. "If we encode this as a distinct character, we break compatibility. If we encode it as standard 'a', we lie about its shape. You are asking us to codify a trick."

  "I'm asking you to codify a perception," Núria says. She feels the heat rising in her neck. The tender deadline is Friday. She needs the code point today. "You treat the alphabet as a set of objects. Fixed things. But when a child writes an 'a', it never looks the same twice. Sometimes it's a circle and a stick. Sometimes it's a loop. We know it's an 'a' because of the spirit of the thing. The function."

  "The spirit doesn't compile," Aris mutters.

  Elias stands up. He walks to the screen, standing beside Núria. He looks at the circle, then at the word *p ⃝ t*. "There is a fourth thing," he says. "You both assume the letter exists in the shape. Or in the system. But maybe it exists in the event."

  He turns to Núria. "If I write that circle with a chisel, it is a stone. If I write it with a nib, it is ink. If you draw it with vectors, it is math. In each case, the 'a' is different. You are trying to freeze a verb into a noun. You want a code point for a movement."

  Núria looks at the circle on the screen. It stares back, opaque and perfect. She thinks about the railway stations. The commuters rushing past. They won't see the vectors. They won't see the code point. They will see a shape that tells them where to go. If the shape works, does the definition matter?

  "If I change the 'o' to be a square," Núria says, testing the air. "Then the circle is definitely an 'a'. Does the definition depend on the neighbors? If I change the neighbors, does the letter change?"

  "Then you have no alphabet," Aris says. "You have a series of local agreements. You can't build a global standard on local tricks."

  "But reading is local," Núria counters. "Reading happens in the eye, one word at a time. Not in the registry."

  The room falls silent. The projector fan whirs. The circle on the screen seems to pulse, shifting slightly as the focus drifts. For a second, it looks like an 'o'. Then Núria remembers the word *platform*, and it snaps back into being an 'a'. It is neither shape nor history. It is a promise kept between the writer and the reader.

  Elias sits down. He opens his folder. "We cannot grant a new code point based on contextual reliance. The standard requires identity in isolation."

  Núria's stomach drops. The tender requires the standard.

  "However," Elias continues, looking at Aris. "We cannot deny it is an 'a' if the system treats it as such. The problem is not the glyph. It is the box."

  He looks at Núria. "You want us to define what makes an 'a' an 'a'. But you are asking a database to judge a relationship. We can encode the shape. We cannot encode the understanding."

  Aris sighs, rubbing his temples. "We'll propose a variant selector. It marks the glyph as 'a' but flags it for contextual rendering. It's a patch. It won't satisfy the purists."

  "It won't satisfy the historians," Elias adds.

  "It won't satisfy the topologists," Aris says.

  Núria looks at the screen. The circle is still there. It hasn't changed. It is still a closed loop. It is still a vessel waiting to be filled. She realizes then that the committee isn't deciding what the letter is. They are deciding how much ambiguity the machine can tolerate before it breaks.

  "Will it work for the rail tender?" Núria asks.

  "It will work," Aris says. "Until someone searches for it in isolation. Then it will vanish."

  Núria packs her laptop. The circle disappears from the screen, replaced by the Registry's logo. She walks out into the corridor, the cool air hitting her face. She thinks about the commuters. They will never know the circle is technically a lie. They will read the sign. They will find the platform. The letter will do its work, undefined and undefinable, surviving in the space between the ink and the eye.

  She takes out her notebook and draws a circle. She leaves it open, just a fraction. A breach in the wall. Enough to let the spirit out.
