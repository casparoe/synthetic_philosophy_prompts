  # The session

  The room smelled of ozone and old paper. Three stacks of binders sat on the table, their spines labeled with alphanumeric codes that matched the barcode on your mother's death certificate. Elena sat on the left. Her brother, David, stood by the window, checking his watch every forty seconds. Between them, two Readers in gray tunics stood over the open volumes.

  "State four-nine-zero," the first Reader said. She was turning pages in the primary index, her finger tracing a flowchart printed in microscopic font.

  "Branch delta," the second Reader replied. He was working the same set of volumes on the opposite side of the table, cross-referencing a different table. They were running the calculation in parallel. It was against standard protocol for a Conversational Edition, but David had insisted. He wanted the answer before sunset.

  Elena watched the pages turn. In the Conversational Edition, the brain was stored coarsely. Whole regions averaged into single variables. It meant the answers came in minutes, not days. It meant you could have a conversation. It also meant that if you pushed too hard, or asked the same question twice in different ways, the answers might drift. And with two readers forcing the state transitions simultaneously, nobody knew if you were speeding up the thought or tearing it in half.

  "Ready for input," the first Reader said. Her voice was flat, trained to be a neutral conduit.

  Elena leaned forward. "Mom? It's Elena. We need to know about the house. David wants to sell. I think we should keep it."

  The Readers began to work. The sound was rhythmic, like rain on a tin roof. *Flip, check, write, flip.* David stopped pacing. He stared at the binders as if he could see the neurons firing in the ink.

  Inside the machine, Elena knew, it wasn't minutes. If the scaling held, the silence stretching across the table was a pause of reasonable length for her mother. A breath. A moment to gather a thought. But if the coarse grain smoothed over the hesitation, if the parallel processing skipped the nuance of grief, then the pause was a lie.

  "Output," the second Reader said.

  The first Reader looked up. Her eyes didn't focus on Elena, but on a point just above her shoulder. When she spoke, the cadence was wrong. Too smooth. The hesitation markers had been averaged out.

  "The house is too big," the voice said. It was your mother's voice, synthesized from the text rules, but flat. "Sell it. Split the money."

  David exhaled, a sharp sound of victory. "See? She knows."

  "Ask her about Sarah," Elena said.

  David frowned. "Aunt Sarah's been dead ten years. What's the point?"

  "Ask her."

  David sighed, waving a hand. The Readers reset the state. *Flip, check, write.* The parallel processing was faster this time. They were finding the path of least resistance.

  "Mom," David said. "What do you think about Sarah?"

  The Readers stopped. The silence stretched. One minute. Two. The first Reader looked at the second. They were on different pages. This wasn't supposed to happen. The state should converge.

  "Sarah," the voice said. It came from the first Reader this time. "She liked the garden. Did she ever get the roses to bloom?"

  Elena felt a cold knot in her stomach. Sarah had died before the roses were planted. The coarse grain had merged two memories, smoothing the timeline to fit the pattern. It was a plausible answer. It sounded like her. It was wrong.

  "Stop," Elena said.

  "We're almost out of time," David said. "We paid for the afternoon."

  "The readers are out of sync."

  "It's fine. It's close enough." David turned to the Readers. "One more question. Confirm the sale authorization."

  "Wait," Elena said. She looked at the binders. The pages were still open. The rules were waiting. If nobody turned the pages, nothing happened. The mind inside was frozen in the state of waiting for the next input. But if they turned the pages wrong, if they forced the parallel paths too hard, did the mind feel the strain? Or did it just snap to a new configuration, unaware it had been broken?

  "Mom?" Elena said. "Are you there?"

  The Readers waited for the cue to process. David checked his watch. "Time's up. We have to close the session."

  "If we stop now," Elena said, "where does she go?"

  "She doesn't go anywhere," David said. "It's a book, El. It stays on the shelf."

  "The session isn't complete. The state is open."

  "We can't afford another hour." David nodded to the Readers. "Close it out."

  The Readers snapped the binders shut. The sound was like a gunshot in the quiet room. The voice vanished. There was no fade, no goodbye. Just the sudden absence of the sound.

  David picked up his jacket. "She said sell. That's what matters."

  Elena kept her hand on the top binder. It was warm from the friction of the pages. She wondered if, inside the rules, her mother was still waiting for an answer that would never come, frozen in a moment that lasted forever because no one was left to turn the page.

  "Did we split her?" Elena asked.

  David was already at the door. "It's the same mother for any purpose that matters."

  He left. Elena stood alone with the stacks of paper. She opened the top binder. The page showed a state transition waiting for an input code. She ran her finger over the text. Nothing happened. The room was silent. She closed the book.

  # What I was trying to do

  I chose to stage the reading using the "Conversational Edition" with parallel readers, rather than the Full Edition, to maximize the tension between utility and integrity. The Full Edition's time dilation (weeks inside = minutes outside) is profound, but it prevents conversation, which I needed to show the "drift" in personality. By using the Cheap Edition with two readers, I could press on both industry details: the coarse grain causes the factual error about the roses, while the parallel processing creates the synchronization glitch between the Readers.

  I left the metaphysical question unresolved because the prompt asked to live inside the discomfort rather than explain it away. A straight argument would ask, "Is this consciousness?" The story asks, "Does it matter if the answer is useful?" David represents the pragmatic view that functionality equals identity. Elena represents the phenomenological worry that the *process* of thinking matters as much as the output.

  The ending focuses on the physical book to ground the abstraction. The warmth of the paper and the open state transition highlight the dependency of this "mind" on external labor. By leaving Elena touching the closed book, I wanted to leave the reader with the uncertainty of whether the entity is paused, dead, or duplicated, without providing a technical resolution. The story shows that the ethics of the technology depend not on what the machine *is*, but on what we are willing to do to it to get what we want.
