answer: |-
  ### SCRATCH SECTION: DESIGN BRAINSTORMING

  **Design 1: The Vendor "Clarity Index" (Transparent High-Stakes)**
  *   **Mechanism:** Published weights, announced observations, hard data (LMS, syllabus). Used for merit/promotion.
  *   **Failure Mode:** **Campbell's Law/Goodhart's Law.** As seen in the pilot, when a measure becomes a target, it ceases to be a measure. TAs logging in for students proves the metric measures *compliance*, not *engagement*. Ritualized teaching proves it measures *performance for observers*, not *pedagogy*.
  *   **Verdict:** Reject for individual evaluation. Validity is compromised.

  **Design 2: Noise-and-Secrecy (Obfuscated High-Stakes)**
  *   **Mechanism:** Hidden weights, unannounced observations, statistical noise added to scores.
  *   **Failure Mode:** **Procedural Injustice & Epistemic Black Boxing.** While this theoretically prevents gaming (you can't optimize what you can't see), it destroys the feedback loop necessary for improvement. It treats faculty as adversaries to be tricked rather than professionals to be developed. It invites union grievances over arbitrary evaluation and fosters superstition (trying to guess the hidden rules).
  *   **Verdict:** Reject. It solves measurement error by creating moral hazard.

  **Design 3: Holistic Peer Review (Qualitative)**
  *   **Mechanism:** Trained peers review courses via artifacts and observation.
  *   **Failure Mode:** ** Institutional Constraint.** The Board has explicitly rejected this as non-auditable across campuses. It is also resource-intensive.
  *   **Verdict:** Reject as the *primary* compliance mechanism, though retain as support.

  **Design 4: Aggregated Programmatic Metric (Selected)**
  *   **Mechanism:** Use the Vendor data, but **only** report at the Department or Course-Level. Never attach to individual personnel files.
  *   **Failure Mode:** **Board Dissatisfaction.** The Board wants individual accountability. However, this preserves metric validity by removing the incentive for destructive individual gaming while still providing the Board with comparable data.
  *   **Verdict:** Adopt with strict usage limits.

  ***

  ### MEMORANDUM

  **TO:** The Faculty Senate
  **FROM:** Undergraduate Teaching Metrics Working Group
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Teaching Quality Metrics and Board Compliance

  **Context and Charge**
  The Working Group was convened to resolve the tension between the Board of Trustees' mandate for a single, auditable teaching metric per section and the Faculty's commitment to valid, equitable evaluation. Three years ago, student evaluation scores were retired due to documented biases. The current vendor proposal, the "Clarity Index," was piloted to fill this void. The Working Group has analyzed the pilot data, the vendor proposal, and the counter-proposal for "noise-and-secrecy." We offer this recommendation for Senate action.

  **Analysis of Proposed Models**
  The pilot of the Vendor's Clarity Index confirmed a predictable failure mode: **construct decoupling.** When the metric became high-stakes, faculty and departments optimized for the proxy rather than the construct. The 100% LMS login rate achieved by TA proxy-logins demonstrates that the metric measures administrative compliance, not student engagement. The "minute-twelve think-pair-share" ritual demonstrates that announced observations measure performance for auditors, not pedagogical integrity. If adopted for personnel decisions, this metric will incentivize gaming that actively harms educational quality.

  The counter-proposal, "noise-and-secrecy," offers a sophisticated measurement-theoretic solution to this gaming. By obscuring weights and injecting statistical noise, it makes optimization impossible. Theoretically, this preserves the metric's validity by preventing Goodhart's Law. However, we reject this model on grounds of **procedural justice.** Evaluation systems must allow the evaluated to understand the criteria governing their professional standing. A system designed to confuse the faculty treats them as adversaries rather than partners. It transforms teaching into superstition, where instructors guess at hidden rules rather than reflecting on practice. This would inevitably trigger union grievances and erode the trust required for genuine pedagogical improvement.

  **Distinguishing Metric Movement**
  In our deliberations, we identified three distinct types of metric movement, often conflated under the label "gaming." Our recommendation hinges on distinguishing them:

  1.  **Destructive Gaming:** Decoupling the means from the ends (e.g., TAs logging in for students). This increases the score while lowering quality.
  2.  **Constitutive Alignment:** Changing practice to match the metric in ways that are pedagogically neutral or positive (e.g., uploading syllabi on time). Here, the metric successfully defines a baseline standard.
  3.  **Genuine Improvement:** Using metric feedback to enhance student learning, regardless of score impact.

  The Vendor model fails because it incentivizes Type 1. The Noise model fails because it makes Type 3 impossible. We require a system that tolerates Type 2 while preventing Type 1 from having high-stakes consequences.

  **Recommendation**
  The Working Group recommends that the Senate **adopt the Clarity Index data collection protocol but prohibit its use in individual personnel decisions.**

  Specifically:
  1.  **Aggregation:** Scores shall be reported only at the **Course Level** (averaged across all sections of a course) and **Department Level**. No individual instructor shall receive a Clarity Index score in their personnel file.
  2.  **Usage:** These aggregated metrics shall be used solely for **Programmatic Review** and resource allocation (e.g., identifying courses needing curricular support).
  3.  **Compliance:** This satisfies the Board's requirement for a "single comparable number" per section while insulating individual faculty from the invalidating pressures of high-stakes metric gaming.

  This approach acknowledges that while the metric is too flawed for individual judgment, it may still contain signal at the aggregate level. Departments can investigate why *Course X* consistently scores low on engagement without punishing *Professor Y* for a metric they may have legitimately gamed to survive.

  **Timeline and Conditions**
  We recommend a **Two-Year Pilot** of this Aggregated Model, beginning Fall 2024.
  *   **Year 1:** Data collection only. No reporting to Board until audit.
  *   **Year 2:** Reporting to Board at Department level.
  *   **Adoption:** Full adoption contingent on Year 2 review.

  **Sunset Clause and Accountability**
  We recognize that administrative creep is a common failure mode in institutional design. Metrics introduced for "programmatic review" often migrate into tenure files. To prevent this, the following clause is attached to this recommendation:

  **Evidence of Failure:** If, within two years, (a) more than 5% of faculty grievances cite the Clarity Index as a factor in personnel decisions, or (b) independent audit shows a negative correlation between Clarity Index scores and student learning outcomes (as measured by blind pre/post testing in sentinel courses), **this metric protocol shall be immediately suspended.**

  **Responsibility:** In the event of such failure, the **Provost's Office** bears the responsibility to return to the Board with a validity challenge. The Working Group will be reconvened to propose an alternative, but the burden of proof shifts to the Administration to demonstrate why individual metric usage is valid despite the evidence of gaming or learning divergence.

  **Conclusion**
  We cannot give the Board a number that lies. We cannot give the Faculty a evaluation system they cannot trust. By aggregating the data, we provide the Board with auditable information without subjecting individual instructors to a validity-destroying incentive structure. We urge the Senate to vote for this limited adoption.

  **Action Required:** Vote to approve the Aggregated Programmatic Metric Pilot with the stipulated Usage Restrictions and Sunset Clause.
