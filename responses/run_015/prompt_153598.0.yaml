answer: |-
  Good morning, everyone. Grab a coffee if you haven't yet.

  Looking around this room, I see a tension that I think is actually productive. On one side, we have the philosophers of mind. You guys love a clean thought experiment. You love the Ship of Theseus, you love teleportation paradoxes, you love uploading scenarios where the substrate swaps out instantly and we ask, "Is it still him?"

  On the other side, we have the neurologists and surgeons. You're the ones actually opening skulls. You're doing partial basal ganglia replacements over months. You're looking at EEGs, behavioral metrics, and patient interviews.

  Here's what I want us to do today: I want us to stop letting each other off the hook.

  To the philosophers: Please, put down the sci-fi cases for a minute. We aren't talking about magic teleporters or instantaneous uploads. We are talking about wetware. We are talking about glial scarring, immune responses, and integration latency. If you treat this like a logic puzzle where the swap is clean, you're missing the biology that constitutes the very problem you're trying to solve. The "self" doesn't live in an abstract variable; it lives in the mess you're ignoring.

  But to the surgeons: I need you to stop claiming that continuous patient reports settle the metaphysics. Just because a patient wakes up and says, "I feel like myself," or can still hold a spoon without shaking, that doesn't mean the ontological question is closed. Phenomenological continuity is not the same as ontological continuity. You're measuring function; we're asking about the subject *having* the function. Don't assume the data speaks for itself on the hard problem.

  So, where do we meet? I want to propose a concept for the workshop to grind against: **Functional Shadowing.**

  In these gradual replacements, the synthetic tissue isn't just stepping in to take over the load. During the transition, it's running parallel. It's listening to the biological tissue, mimicking its firing patterns, running error-correction loops alongside the native neurons before it fully assumes control.

  For a few weeks or months, you don't have a biological brain, and you don't have a synthetic brain. You have a hybrid system where two distinct substrates are actively modeling each other.

  This creates a weird intermediate state. It's neither fully biological nor fully synthetic. It's a dual-processing state where the "self" might be distributed across a conflict resolution layer between the old tissue and the new shadow.

  For the philosophers, this means your identity conditions need to account for *overlap*, not just substitution. It's not A becoming B; it's A and B running in parallel until A fades.
  For the surgeons, this means your "successful integration" metrics might be masking a period of radical internal fragmentation. The patient says they're fine, but are they reporting on the biological half, the synthetic half, or the shadow interface between them?

  This is the structural work I want us to do. We need to map this intermediate state. We need to ask what happens to agency when error correction is being handled by a substrate that isn't technically "you" yet, but isn't "other" either.

  I had a typo in my outline for this talk—I wrote "transfromative experience" instead of transformative. I was going to fix it, but honestly? It fits. There's a "from" in there. A movement from one state to another that isn't a jump, but a smear.

  So, let's not let the philosophers drift into sci-fi, and let's not let the clinicians hide behind behavioral data. Let's look at the shadow. Let's look at the smear.

  Thanks, everyone. Let's get to work.
