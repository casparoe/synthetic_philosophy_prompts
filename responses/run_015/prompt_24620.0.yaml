answer: |-
  ### The Scenario: The Metastable Isomer

  Consider a classical chemical world physically identical to ours, except that fundamental indeterminism is a brute fact of nature, unrelated to quantum mechanics. In this world, there exists a stable organic molecule, "Z-oxide." When a sample of Z-oxide is heated to exactly 100°C in a vacuum (Condition $C$), it undergoes a structural rearrangement into "Y-oxide" (Event $B$). Extensive experimentation reveals a strict statistical regularity: across all batches, locations, and times, 99% of Z-oxide molecules rearrange within 10 seconds of reaching 100°C. The remaining 1% do not rearrange, remaining Z-oxide indefinitely despite meeting Condition $C$.

  Crucially, stipulate that the 1% failures are intrinsically indiscernible from the 99% successes. There are no hidden variables: the failing molecules have identical mass, energy, spin, isotopic composition, and history as the successful ones. No micro-scratch, no prior collision, no spatial location correlates with the failure. The 1% failure rate is stable across infinite trials, but for any single molecule, the outcome is fundamentally unpredictable and uncaused. A chemist using the rule "Under $C$, $P(B) = 0.99$" predicts outcomes perfectly according to the statistics, while a chemist insisting "All $Z$ become $Y$" is simply wrong 1% of the time.

  ### Theoretical Verdicts

  **1. The Lewisian Best-System Account (Humeanism)**
  For the Lewisian, laws are theorems of the deductive system that best balances *simplicity* and *strength* in describing the Humean mosaic of particular facts.
  *   **The Competition:** A deterministic universal ("All $Z$ in $C$ become $Y$") is maximally simple and strong, but it is *false* given the 1% failures. A system listing every exception ("All $Z$ become $Y$ except molecule $m_1, m_{54}...$") is true but infinitely complex, destroying simplicity.
  *   **The Winner:** The probabilistic statement "For any $Z$ in $C$, the chance of becoming $Y$ is 0.99" is extremely simple and captures almost all the strength of the deterministic claim. It fits the mosaic (the long-run frequencies match the probability) without the complexity of listing exceptions.
  *   **Compound Predictions:** Because this probability is a *law*, it grounds objective chances for sequences. The law licenses the inference that the probability of exactly 9 out of 10 independent molecules rearranging is given by the binomial distribution $\binom{10}{9}(0.99)^9(0.01)^1$. The law explains the frequency; the frequency does not constitute the law.

  **2. The Armstrongian Universal Theory (Anti-Humeanism)**
  For Armstrong, a law is a relation of necessitation ($N$) between universals ($F$ and $G$). If $N(F, G)$ holds, then being $F$ *necessitates* being $G$.
  *   **The Breakdown:** If the law is $N(\text{Z-oxide}, \text{Y-oxide})$, then every instance of Z-oxide must become Y-oxide. But 1% do not. Therefore, strict necessitation fails.
  *   **The Dilemma:** Armstrong must either (a) deny there is a law here, reducing the 99% regularity to a brute cosmic coincidence (which seems absurd given its stability), or (b) posit a probabilistic necessitation relation ($N_p$).
  *   **The Deficit:** Even if Armstrong adopts $N_p$, he struggles to ground the *single-case* chance. For Lewis, the chance is defined by the system's role. For Armstrong, $N_p$ is a primitive modal fact. Why does this primitive relation result in exactly 99% over the long run? Armstrong must assert a brute connection between the universal relation and the frequency. Consequently, regarding the compound case (9 out of 10), the Armstrongian cannot derive the binomial probability from the law as cleanly as the Lewisian; they must treat the sequence frequency as a separate brute fact that merely *accords* with the universal relation, lacking the Humean's tight link between law and long-run frequency.

  ### Honest Notes

  **Which single feature is doing the work?**
  The **intrinsic indiscernibility of the failures**. The pressure on Armstrong comes entirely from the stipulation that there is *no difference* between the 99% and the 1% other than the outcome itself. This prevents Armstrong from "saving" necessitation by finding a hidden universal (e.g., "All *pure* Z-oxides become Y") that excludes the failures. It forces the law to be inherently probabilistic rather than deterministic with unknown boundary conditions.

  **What happens if that feature is removed?**
  If the 1% failures shared a hidden physical property (e.g., a specific microscopic lattice defect), the Armstrongian wins easily. They would posit a universal $N(\text{Z-oxide-without-defect}, \text{Y-oxide})$. The law remains exceptionless and necessitarian; the 1% simply didn't instantiate the antecedent universal. The scenario would no longer distinguish the theories, as both would agree on a deterministic underlying law.

  **Best Objection from the Armstrongian Defender**
  *Objection:* "Armstrong explicitly allows for probabilistic laws ($N_p$). The relation is not between 'Z' and 'Y', but between 'Z-in-C' and 'having-a-0.99-propensity-to-become-Y'. The propensity is a real, irreducible property grounded in the universals. Thus, there *is* an exceptionless law: 'All Z-in-C possess propensity 0.99'. The failure of the effect doesn't violate the law, because the law only necessitates the *chance*, not the *outcome*."

  *Does it survive?* **Barely.** This move saves the "exceptionless" requirement but at a high cost. It posits a primitive modal property (propensity) that is empirically inaccessible except through the very frequencies the Lewisian uses to define the law. The Lewisian can argue this is ontologically bloated: the Armstrongian is reifying the statistical regularity into a "propensity universal" without gaining any explanatory power. The Lewisian explains the stability of the 99% via the Best System; the Armstrongian explains it by saying "It is the nature of Z to have a 0.99 propensity," which risks being a circular restatement of the frequency rather than a ground for it. The Lewisian account remains more parsimonious because it doesn't require the ontology of "probabilistic necessitation" to do the work that systematization does for free.
