      *   *Response B:* Probabilistic Necessitation ($N_p(F, G)$). Armstrong tried this later, but it's controversial. The prompt asks to show where the "exceptionless universal" requirement breaks. I should focus on the strict Armstrong view where laws necessitate.
      *   *Verdict:* Either no law (just brute regularity) or a weakened "tendency" that lacks the modal oomph to ground compound probabilities.
