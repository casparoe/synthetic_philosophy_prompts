  We brush the dust to find the blackest ash
  And mark the stratigraphy of each layer
  Hoping the soil will yield a proper name
  But stories survive longer than the song
  Until we fix a century, a date
  And tie the mythic bloodline to one king

  Hisarlik holds the body of the king
  Or at least cities turned to blackened ash
  Seven destructions narrow down the date
  If Homer missed the right destruction layer
  The whole identification breaks the song
  And Priam becomes fiction without name

  Badon Hill stands without a leader's name
  Gildas leaves the room empty for the king
  Later bards fill the silence with a song
  No burnt cities mark the Saxon war's ash
  We find no fifth-century distinct layer
  Just centuries blurred without a solid date

  We pin the story to a pharaoh's date
  But find no record of the Hebrew name
  The Sinai sand reveals no cultural layer
  No corpses for the pharaoh or the king
  Jericho's walls lack the expected ash
  The narrative survives inside the song

  A story hardens when it risks the song
  One dig could find a contradictory date
  Or if the fire never produced the ash
  Or if the stele fails to carve the name
  Then the hypothesis dies, not the king
  And truth retreats up through the sterile layer

  Troy rests secure within a destruction layer
  While Camelot dissolves back into song
  And Sinai tests the existence of a king
  But lacks the pottery to confirm the date
  So one becomes a fact, one keeps a name
  And one becomes a question in the ash

  We measure truth by what cracks the layer, shifts the date
  Not how the song preserves a hero's name
  But if the dirt denies the king his ash

  The biggest liberty is stanza four, line five; Jericho's walls are disputed, not definitively absent.
  I'd defend stanza two, line three hardest; Hisarlik's destruction levels are concrete data points.
  Troy crosses the line to history; Arthur remains literature; Exodus is a hypothesis refuted by dirt.
  This ranking accepts falsification as the only bridge between story and actual past.
  It ignores the cultural truth that survives when physical evidence fails completely.
  But for this room, the risk of being wrong is the price of being specific.
