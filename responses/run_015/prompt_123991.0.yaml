  **INTERPLANETARY AIRWAYS LTD**
  **CONDITIONS OF CARRIAGE (EARTH–TWIN EARTH ROUTE)**

  **1. Determination of Semantic Reference**
  1.1 Passengers acknowledge that the content of all utterances, tickets, and claims filed aboard the vessel is not determined solely by neural states or internal intention.
  1.2 Reference is fixed exclusively by the microstructural composition of the local environment surrounding the speaker at the precise moment of utterance.
  1.3 Consequently, a passenger departing Earth may utilise the term 'water' with distinct semantic value from a passenger arriving at Twin Earth, notwithstanding identical phonological output and subjective phenomenological experience.

  **2. Mid-Voyage Re-anchoring**
  2.1 The sublight crossing necessitates a transit duration of approximately six years.
  2.2 During this period, the vessel passes through varying semantic fields. Passengers accept that their terms may be quietly re-anchored mid-journey without conscious awareness.
  2.3 No notification will be issued when a passenger's concept shifts from H₂O to XYZ. Such shifts are undetectable from the first-person perspective and do not constitute a breach of contract or an alteration of personal identity.
  2.4 The Carrier accepts no liability for existential distress resulting from the retrospective discovery that one's thoughts have been partly constituted by external factors beyond one's skin, nor for the confusion arising when fellow passengers use identical words to denote distinct natural kinds.

  **3. Provision of Refreshments**
  3.1 Requests for beverages are fulfilled according to the destination port's chemical standards.
  3.2 A complaint regarding the taste or composition of 'water' served upon arrival will not be upheld if the liquid conforms to the local extension of the term at the arrival gate.
  3.3 The Carrier denies liability for dissatisfaction arising from the realisation that one has been drinking XYZ whilst believing oneself to be drinking water, provided the belief was sincere at the time of consumption.
  3.4 Passengers are advised not to request chemical analysis prior to consumption, as this invalidates the a priori nature of self-knowledge guaranteed under Clause 4.
  3.5 Passengers requiring H₂O specifically must purchase the Premium Internalist Cabin and even then are advised not to look too closely at the label.

  **4. First-Person Authority**
  4.1 The Carrier offers reassurance that whatever a passenger has turned out to mean, she can always know a priori that she meant it.
  4.2 Ignorance of local chemistry does not impair knowledge of one's own mind. Passengers retain full authority over the fact of their thinking, though not over the content's external fixation.
  4.3 You cannot be mistaken about whether you are thinking that water is wet, even if you are mistaken about what stuff 'water' denotes.

  **5. Premium Internalist Cabin**
  5.1 A supplementary fare is available for the Cabin of Humoured Insistence.
  5.2 In this class, crew will respectfully pretend that passengers have meant the same thing the whole way.
  5.3 This service is purely cosmetic; reference will still shift according to Clause 1.2, but crew will refrain from correcting the passenger's assumption of semantic stability or pointing out environmental determinants. Staff are trained to nod sympathetically when passengers claim their meaning has remained constant despite the changing stellar background.

  **6. Dispute Resolution**

  *Model Complaint:*
  "Dear Sirs, I asked for water throughout the voyage. Upon arrival, you served me a thick, oily substance you call 'water'. I feel deceived. I know what I meant, and it wasn't this."

  *Carrier Response:*
  "You know a priori that you meant what you meant, but at the point of service, you meant XYZ; therefore, no deception has occurred. We note your complaint is valid from inside your head, but invalid from outside it."
