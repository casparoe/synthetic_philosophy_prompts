answer: |-
  The puzzle begins with a simple distinction. There is a difference between a list of items and a claim about the world. To write down Brutus, Caesar and stabbing is to inventory three things; to say Brutus stabbed Caesar is to say something true or false. The problem, known as Bradley's regress, is that if we treat the proposition as a collection of items, we cannot explain what glues them together. If we add the glue as another item, a relation, we simply have another thing sitting alongside the terms, requiring yet more glue to bind it to them, ad infinitum. The result is a philosophical paralysis where no proposition is ever truly unified, and nothing is ever actually said to be the case.

  The Fregean solution attempts to dissolve the problem by changing the categories of the constituents. On this view, the trouble arises only if we model the relation as an object, on all fours with the names. Frege argues that the expression for a relation is unsaturated. It is not a thing, but a function with gaps, incomplete by its very nature. Objects do not need to be glued to it because they are what complete it. Unity is therefore not something extra that has to be supplied; it is the absence of anything left over. The concept reaches out for the object, and the object fills the void. This asymmetry between object and concept is intended to stop the regress before it starts, by denying that the relation is a separate entity waiting to be tied.

  Your interviewee offers a different mechanism, the assembly account. Here, unity is neither a further constituent nor a tie, but the residue of an operation. Think of a proposition as the terminal state of a procedure run over a stack. Names and predicates push semantic values; a binary predicate pops two values, forms a single value from them, and pushes that back. At no point is there a completed array of items sitting there waiting to be bound together, because the binding is something the operation does as it goes. The regress, on her telling, is not stopped but rendered unmotivated. It only gets a grip if you first lay out the constituents as a manifold and then ask what relates them, and her procedure never produces such a manifold.

  However, one must ask whether this account is genuinely immune to the regress, or if it merely relocates it. The operation of consuming two values and returning one looks suspiciously like a relation between the operation and its inputs. One wants to know why that relation does not itself stand in need of a tie. If the operation is an event, and the inputs are values, what binds the event to the values? To make the answer stick, she would have to add that the operation is not an entity within the system but the primitive condition of the system itself. She must argue that the procedure is not a thing that relates other things, but the fundamental mode by which semantic value exists at all. Without this claim, the operation is just a relation in disguise, and the regress resumes.

  This leads to a second difficulty regarding propositions that nobody has assembled. If unity is the residue of a procedure, then it seems to become dependent on somebody's running it, on the order in which they run it, and on the notation they run it in. This risks making truth dependent on thought, a position known as psychologism. If no one runs the stack, is there no proposition? The Fregean view fares better here, positing thoughts as abstract objects that exist independently of being grasped. For the assembly theorist, this is potentially fatal unless she can turn it into a virtue. She might argue that the procedure is abstract and potential, not necessarily enacted by a mind, but this weakens the procedural metaphor. If the procedure exists without being run, it looks suspiciously like the static structure she sought to avoid.

  There is also the charge that the Fregean asymmetry between object and concept is an explanation of unity, or merely a redescription of it with a technical label attached. To say a concept is unsaturated is to say it needs completion, which is to say it needs unity. Critics argue this labels the mystery rather than solving it. The assembly account is exposed to the parallel charge of having redescribed the binding of a proposition as the execution of a procedure. Saying unity is the result of an operation is close to saying unity is what happens when we unify. However, there is a distinction. Frege offers an ontological claim about the nature of reality, while the assembly theorist offers a functional claim about the architecture of thought. Frege says unity is built into the furniture of the world; the assembly theorist says it is built into the mechanics of access. Both risk circularity, but they circle different centres.

  Despite these tensions, the two views are closer than they sound. Both are ways of denying the same premise, that a proposition is first a plurality of items and only afterwards a unity. They agree that the list model is a category error. The disagreement that survives comes down to whether logic is a static landscape of functions and objects, or a dynamic process of construction. Frege prioritises the truth-bearer itself, independent of us. The assembly account prioritises the act of judgement, making unity something achieved rather than found.

  This matters because it determines whether we view truth as something we discover waiting in the world, or something we construct through the act of thinking. If the Fregean is right, our minds mirror a pre-existing logical structure. If the assembly theorist is right, logical structure is a trace left by the mind's own movement. The choice is between a universe that speaks to us, and a universe that we speak into being.

  **Standfirst**
  Why does the architecture of a sentence matter to anyone outside a philosophy seminar? Because the answer determines whether truth is a structure we discover in the world, or a construction we impose upon it. The debate over what holds a proposition together is ultimately a debate over whether reality comes with instructions attached.

  **Breakdown Point**
  Her account is most likely to break when pressed to explain how a proposition can be true before any mind has run the procedure to assemble it.
