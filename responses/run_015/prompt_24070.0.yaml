  # Joint Statement on the Simulation Hypothesis and Longtermist Priority

  **Date:** October 26, 2023
  **Parties:** [User Name] ("Party A") and [Friend Name] ("Party B")
  **Subject:** The impact of Bostrom's Simulation Argument on Longtermist Expected Value Calculations

  ## 1. Agreed Claims and Definitions

  We, the undersigned, having engaged in adversarial collaboration regarding the intersection of Nick Bostrom's Simulation Argument (SA) and Longtermist ethics, agree upon the following foundational claims, definitions, and framing:

  1.  **The Simulation Trilemma:** We accept Bostrom's formulation that at least one of the following propositions is true:
      *   (1) The fraction of human-level civilizations that reach a posthuman stage is very close to zero.
      *   (2) The fraction of posthuman civilizations that are interested in running ancestor-simulations is very close to zero.
      *   (3) The fraction of all people with our kind of experiences that are living in a simulation is very close to one.
  2.  **Longtermist "Fanaticism":** We define "fanaticism about the far future" operationally as the willingness to incur significant present-day costs to mitigate existential risks, driven by an Expected Value (EV) calculation where the magnitude of the potential future population (astronomical waste) outweighs the low probability of successfully influencing it.
  3.  **Moral Weight:** We agree that sentient beings in the far future possess moral weight comparable to sentient beings in the present. We disagree on neither the existence of this weight nor the general obligation to consider it.
  4.  **Decision Framework:** We agree that Expected Utility Theory is the correct framework for prioritizing global interventions. Our disagreement is not about *whether* to use EV, but about how the probability distribution over worlds (specifically, simulated vs. base reality) updates the EV calculation.
  5.  **Relevance of SA:** We agree that the Simulation Hypothesis is not irrelevant. It is not merely a skeptical curiosity; it bears directly on the estimates of (a) the duration of the future available to us, and (b) the causal leverage our actions possess over that future.
  6.  **Non-Settled Status:** We acknowledge that neither side has currently produced a knockdown argument. The question remains an open empirical and philosophical problem within our shared framework.

  ## 2. Precise Formulations of Disagreement

  While we share the framework above, we maintain the following specific disagreements regarding the *direction* and *magnitude* of the update that the Simulation Hypothesis demands.

  | ID | Disagreement | Party A (User) Position | Party B (Friend) Position |
  | :--- | :--- | :--- | :--- |
  | **D1** | **The Net EV Update** | Conditioning on a non-negligible probability of SA (Disjunct 3) either leaves the EV of longtermist interventions unchanged or increases it. | Conditioning on a non-negligible probability of SA (Disjunct 3) significantly decreases the EV of longtermist interventions. |
  | **D2** | **Causal Leverage** | Our actions within a simulation can retain high leverage, either because the simulation is long-running, or because our behavior influences the simulators (base reality) in morally relevant ways. | Our actions within a simulation have truncated leverage because the simulation is likely to be terminated before the "far future" arrives, or because simulators are indifferent to our long-term outcomes. |
  | **D3** | **Proposition Status** | "We are in a simulation" is a factual claim about the physical substrate of our reality that alters the payoff matrix of our actions. | "We are in a simulation" is primarily an indexical fact about our epistemic situation that does not necessarily alter the external payoff matrix of the base reality we might influence. |

  ## 3. Cruxes and Pre-Registered Predictions

  We identify the following specific cruxes. For each, we have defined the evidence or argument that would resolve the dispute, and we pre-register our predictions regarding what that investigation will show.

  ### Crux 1: The Ratio of Simulated-to-Base Person-Years
  **The Issue:** Party B argues that simulations are computationally bounded and likely to be truncated (shrunken future). Party A argues that the Base Reality (where the simulators live) may be vastly larger than a non-sim human future, and simulations may run for substantial subjective time.
  **The Test:** An estimate of the ratio $R = \frac{\text{Expected Simulated Person-Years}}{\text{Expected Base Reality Person-Years}}$ accessible to our influence.
  **Agreed Resolution Condition:**
  *   If rigorous modeling suggests $R \ll 1$ (Simulated future is negligible compared to a standard non-sim future), Party B's view is strengthened.
  *   If rigorous modeling suggests $R \geq 1$ (Simulated future + Base influence is comparable or larger), Party A's view is strengthened.

  | Side | Pre-Registered Prediction |
  | :--- | :--- |
  | **Party A** | I predict that accounting for the potential size of the simulator's civilization (Base Reality) and the possibility of long-running simulations will result in an $R \geq 1$. The "far future" does not shrink; it potentially expands to include the simulator's timeline. |
  | **Party B** | I predict that computational costs and the specific purpose of ancestor simulations (historical interest vs. open-ended future) will result in an $R \ll 1$. Simulations are likely to be cut off before reaching posthumanity, truncating the value we can create. |

  ### Crux 2: Indexicality vs. Causal Structure
  **The Issue:** Party B suspects "Are we in a sim?" is an epistemic label that doesn't change the physics of our causal influence. Party A suspects it changes the *rules* of our causal influence (e.g., we are subject to shutdown commands).
  **The Test:** A decision-theoretic analysis of whether "Sim-Hypothesis" functions as a *state of the world* (affecting outcomes) or merely an *indexical uncertainty* (affecting only self-location).
  **Agreed Resolution Condition:**
  *   If it is demonstrated that our actions in a sim have no causal pathway to the base reality's long-term value (and the sim is finite), Party B's view is strengthened.
  *   If it is demonstrated that our actions can influence the simulators' behavior or the simulation's longevity (e.g., via "acausal trade" or demonstrating value to simulators), Party A's view is strengthened.

  | Side | Pre-Registered Prediction |
  | :--- | :--- |
  | **Party A** | I predict that decision theories (such as Evidential or Functional Decision Theory) will show that acting *as if* we can influence the simulators preserves the EV of longtermist action. The proposition is well-defined and affects payoffs. |
  | **Party B** | I predict that treating "Sim" as a distinct state introduces unwarranted speculation. Without empirical evidence of simulator interaction, the rational prior is that our causal sphere is limited to the simulation's runtime, which is likely short. |

  ## 4. Note on Verbal Disputes

  We acknowledge that a portion of our disagreement may be verbal regarding the definition of **"The Far Future."**

  *   **Ambiguity:** If "The Far Future" refers strictly to *our* biological descendants in *our* spacetime continuum, the Simulation Hypothesis likely dampens fanaticism (as our timeline may be artificially truncated).
  *   **Ambiguity:** If "The Far Future" refers to *all* sentient beings whose welfare we can causally or acausally influence (including the simulator civilization), the Simulation Hypothesis may not dampen fanaticism (as the simulator's future may be vast).

  **Resolution:** We agree to adopt the broader definition (all beings we can influence) for the purpose of this collaboration. However, we record that Party B believes the *accessible* portion of that broader future is significantly smaller under the Sim Hypothesis, while Party A believes it is comparable or larger.

  ***

  **Signed,**

  _________________________ (Party A)

  _________________________ (Party B)
