prompt: |-
  This is going to sound like nothing, but it's become weirdly important to me: I moved into a forty-odd person housing co-op last autumn, got put on the rota committee more or less by accident, and we've spent the last three months arguing about one thing. The house runs entirely on unwritten rules — the washing-up rota, quiet after eleven, whoever's last downstairs locks the back door, the communal milk — and it mostly works. Then three new members moved in, kept breaking things, and one of them said, completely reasonably, that nobody had ever actually told her any of it. So now there's a vote in a fortnight on whether to write everything into a handbook, and half of us think that writing it down is precisely what will kill the thing that works.

  I did some philosophy years ago and the argument in the house has turned into two positions that keep missing each other. One is the Lewisian / convention-first side: the unwritten patterns are solutions to recurring coordination problems, everyone conforms, everyone expects everyone else to, everyone would rather conform given the others do, and there's some alternative pattern that would have served just as well — that's the rough shape of it as I remember, so don't hold me to the exact formulation. The other is the norms-first / normativist side: a real social norm needs normative expectations (people think you ought to comply, and think others think so) plus some readiness to sanction, and coordination equilibria can't give you that; conventions are at best a subclass of norms, not the explanation of them.

  What I want is the document an adversarial collaboration between those two would produce, and I want it to be about my house, not about the literature in general. Please don't give me a reading list or citations — I've got no library access out here.

  - A numbered agreed-claims section: things both sides can actually sign, and non-vacuous ones, the kind someone could deny. Not "people sometimes follow rules."
  - A disagreements table, one row per disagreement, with each row phrased twice — once in the formulation the convention-first person would accept for their own view, once in the formulation the norms-first person would accept for theirs — and a marker on each row for whether you think it's a real disagreement or a fight about words. If any of it is verbal, say which part and why.
  - A cruxes section: the sub-questions such that settling one would move at least one side. For each crux, an argument or case both sides agree bears on it, and each side's prediction about it written down in advance.

  Four cases I want them to have to handle, because these are the ones the house actually argued about:

  1. The laminated sheet. We now have a written rota on the kitchen wall. Nobody remembers agreeing to it, nobody has ever read it properly, and everyone complies. Is that a convention, a norm, both, or neither — and is it the same object as the unwritten thing it replaced, or a different one?
  2. The phantom convention. Everyone believes quiet hours were voted in in 2009. I checked the minutes and they never were; the pattern has just been stable for years. Call this a 'phantom convention': a regularity sustained by a widely believed but false story about its origin. Does the false origin story matter to what the thing is?
  3. The milk. Whoever buys the communal milk is slightly out of pocket and slightly put out. Everyone agrees someone has to do it and that it'd be unfair if it were always the same person. This isn't clean coordination — there's a small sucker payoff in it. Can the convention-first account handle it, or does it need fairness, or turn-taking, or something irreducibly normative?
  4. Pluralistic ignorance. Suppose everyone privately resents the back-door rule and locks up only because they believe everyone else is keen on it, and they're all wrong about that; on top of which a newcomer has no expectations about any of it at all. Does the pattern still count as whatever it was, and does it still count as something she has a reason to go along with?

  Then a short section where each side says what would count as evidence against their own position — the thing that would actually make them give it up — and whether there's anything at all both agree would settle the dispute. If it's a survey of what people in the house actually expect, say what it would have to show for each side.

  Finally, half a page max: if the collaboration had to make a recommendation to us about the handbook vote, what's the most both could sign off on together? I genuinely don't know which way to vote and the meeting is in two weeks. British English, please, and sorry if this is a lot — the house has been at it for months and I'm definately losing perspective on it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A 40-person housing co-op is arguing about whether to codify unwritten rules into a handbook.
      *   **The Conflict:** Two philosophical positions are driving the argument:
          *   *Convention-First (Lewisian):* Unwritten patterns are coordination equilibria. They work because everyone expects everyone else to follow them. Writing them down might kill the organic nature.
          *   *Norms-First (Normativist):* Real social norms require normative expectations ("ought") and readiness to sanction. Coordination isn't enough. Writing them down clarifies obligations.
      *   **Task:** Create a document representing an "adversarial collaboration" between these two positions, applied specifically to the house situation.
      *   **Constraints:**
          *   No reading lists or citations.
          *   British English.
          *   Specific structure:
              1.  Numbered Agreed-Claims Section (non-vacuous).
              2.  Disagreements Table (two formulations per row, verbal vs. real marker).
              3.  Cruxes Section (sub-questions, agreed evidence, predictions).
              4.  Four Specific Cases (Laminated Sheet, Phantom Convention, The Milk, Pluralistic Ignorance).
              5.  Falsification Section (what evidence would make each side give up).
              6.  Recommendation (max half-page, consensus advice on the vote).
      *   **Tone:** Philosophical but practical, respectful, precise, addressing the user's specific housing dilemma.

  2.  **Deconstruct the Philosophical Positions (for application):**
      *   *Lewisian (Convention-First):* Focus on regularity, expectation, preference to conform if others do, alternative equilibria possible. Skeptical of "ought" without underlying coordination. Worried codification changes the game (makes it legalistic).
      *   *Normativist (Norms-First):* Focus on "ought," sanctioning, legitimacy, obligation. Coordination is insufficient for *norms* (like fairness/milk). Codification clarifies the "ought" and helps newcomers.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official but specific. "The Co-op Norms & Conventions Working Paper."

      *   **1. Agreed Claims:**
          *   Need things both sides accept but could deny.
          *   *Idea 1:* Regularity exists. (Too vacuous?) -> *Refinement:* Regularity exists *and* is generally effective at preventing conflict.
          *   *Idea 2:* Newcomers face a disadvantage. (Both agree this is the trigger).
          *   *Idea 3:* Writing things down changes behaviour. (Not necessarily for better or worse, just that it changes the psychological stance).
          *   *Idea 4:* Sanctions happen (even if informal).
          *   *Selection:* 1. The current unwritten patterns successfully coordinate most daily activities most of the time. 2. New members currently lack the information required to conform without explicit instruction. 3. Codification will alter the motivational structure of compliance, regardless of whether it improves compliance rates. 4. There are at least some rules (e.g., safety) where 'ought' is stronger than mere preference.

      *   **2. Disagreements Table:**
          *   Need two formulations per row.
          *   *Row 1 (Nature of the rule):* Lewisian: "It's a regularity sustained by mutual expectation." Normativist: "It's an obligation sustained by normative pressure." *Verbal?* Partly, but hinges on whether 'ought' is real or reducible.
          *   *Row 2 (Effect of writing):* Lewisian: "Writing it kills the convention by turning it into a rule." Normativist: "Writing it solidifies the norm by making the obligation explicit." *Real?* Real disagreement on causal mechanism.
          *   *Row 3 (The Milk):* Lewisian: "It's a coordination problem with a slight cost." Normativist: "It's a fairness norm requiring sanctioning." *Real?* Real disagreement on the source of motivation.

      *   **3. Cruxes:**
          *   What would change minds?
          *   *Crux 1:* Does writing it down increase compliance without increasing resentment?
          *   *Crux 2:* Is the 'ought' feeling reducible to 'I want to avoid awkwardness'?
          *   *Evidence:* A trial period or survey.
          *   *Predictions:* Lewisian predicts resentment/rigidity. Normativist predicts relief/clarity.

      *   **4. The Four Cases:**
          *   *Case 1 (Laminated Sheet):* Lewisian: It's a *new* artificial convention replacing the old organic one. Normativist: It's the same norm, now properly articulated.
          *   *Case 2 (Phantom Convention):* Lewisian: Origin doesn't matter, only current equilibrium. Normativist: The story provides legitimacy; if false, the norm is fragile.
          *   *Case 3 (The Milk):* Lewisian: Harder. Needs 'precedent' as the coordinating device. Normativist: Classic norm (fairness). Lewis might struggle here without 'precedent' as the signal.
          *   *Case 4 (Pluralistic Ignorance):* Lewisian: It's a fragile convention, ready to collapse. Normativist: It's not a valid norm yet because the 'ought' isn't genuinely shared.

      *   **5. Falsification:**
          *   Lewisian: If writing it down *improves* atmosphere and doesn't kill spontaneity.
          *   Normativist: If writing it down leads to *more* violation or legalistic loopholing without moral guilt.
          *   *Common Ground:* A pilot scheme.

      *   **6. Recommendation:**
          *   Needs to be actionable.
          *   Compromise: Write the "Milk" and "Safety" (Normative), leave "Quiet Hours" and "Vibes" unwritten (Conventional). Or: Write it as "Current Practice" not "Rules."
          *   Let's go with: Write it as a "Living Document" of *current practice* rather than *law*. This satisfies Lewis (it describes the equilibrium) and Normativist (it informs newcomers of expectations).

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I use British English? (e.g., "programme," "favour," "whilst," "co-op").
      *   *Check:* Is the philosophy accurate enough without being academic? (Keep Lewis's "arbitrariness" and "equilibrium" in mind, keep Normativist "sanction" and "ought" in mind).
      *   *Check:* Is the tone right? It needs to sound like a document produced by two smart housemates trying to bridge the gap, not a textbook.
      *   *Check:* The "Disagreements Table" needs to clearly distinguish verbal vs. real. The "Ought" is often the verbal dispute, but the *consequences* of the ought are real.
      *   *Check:* The Milk case is the hardest for Lewis. I need to ensure the Lewisian account doesn't just crumble. Lewis handles mixed-motive games via precedent. I should mention precedent.
      *   *Check:* Recommendation limit (half page). Keep it tight.

  5.  **Final Review against constraints:**
      *   No citations? Yes.
      *   Numbered agreed claims? Yes.
      *   Disagreements table with dual formulation? Yes.
      *   Cruxes with predictions? Yes.
      *   Four cases handled? Yes.
      *   Falsification section? Yes.
      *   Recommendation max half page? Yes.
      *   British English? Yes.

  6.  **Final Polish:** Ensure the distinction between "Convention-First" (Lewisian) and "Norms-First" (Normativist) remains consistent throughout the document. Ensure the advice feels practical for a housing co-op meeting. (Self-correction: Make sure the recommendation isn't just "compromise" but a specific philosophical synthesis).

  *(Drafting the response...)*
  *Wait, one detail:* "Disagreements table... one row per disagreement... phrased twice." I need to make sure the phrasing captures the *voice* of each side.
  *Wait, another detail:* "Cruxes... argument or case both sides agree bears on it." Need to find empirical tests they both accept as relevant.
  *Wait, Case 3 (Milk):* Lewis actually has an account for this (precedent in mixed-motive games), but it's weaker than pure coordination. I should reflect that tension.
  *Wait, Case 4 (Pluralistic Ignorance):* Lewis says it's still a convention if the expectations hold. Normativist says a norm requires genuine acceptance. This is a key divergence.

  Okay, ready to write.
answer: |-
  # The Co-op Norms & Conventions Working Paper
  **Prepared for the General Meeting (Fortnightly Vote)**
  **Authors:** The Rota Committee (Convention-First & Norms-First Working Group)

  ## 1. Agreed Claims
  *The following propositions are accepted by both the Convention-First (CF) and Norms-First (NF) positions. Each is non-vacuous and could reasonably be denied by an outside observer.*

  1.  **The Efficiency Claim:** The current unwritten patterns successfully coordinate the majority of daily domestic activities (kitchen use, door locking) without requiring explicit negotiation each time.
  2.  **The Newcomer Deficit:** A new member cannot reliably infer the specific content of these patterns solely by observation during their first week; explicit transmission is currently required for compliance.
  3.  **The Codification Effect:** Transforming an unwritten pattern into a written text will alter the psychological motivation for compliance, regardless of whether the rate of compliance rises or falls.
  4.  **The Sanction Reality:** Social sanctions (awkwardness, dirty looks, verbal reminders) currently occur when patterns are breached, regardless of whether the breacher knew the pattern existed.
  5.  **The Arbitrariness Condition:** For at least some rules (e.g., which bin bag goes where), an alternative rule would have worked equally well provided everyone adopted it simultaneously.

  ## 2. Disagreements Table

  | Topic | Convention-First Formulation | Norms-First Formulation | Verbal or Real? |
  | :--- | :--- | :--- | :--- |
  | **The Source of Compliance** | Members comply because they expect others to comply and prefer coordination to non-coordination. | Members comply because they believe they *ought* to comply and that others are entitled to expect it. | **Real.** (CF reduces 'ought' to preference; NF treats 'ought' as irreducible.) |
  | **The Effect of Writing** | Writing the rule transforms it from a flexible convention into a rigid regulation, inviting loophole-finding. | Writing the rule transforms it from a vague expectation into a clear obligation, reducing anxiety and ambiguity. | **Real.** (Disagreement on the causal outcome of text.) |
  | **The Status of the Milk** | Buying milk is a coordination problem solved by precedent; the 'fairness' is just a label for the equilibrium. | Buying milk is a fairness norm; the 'precedent' is merely evidence of the underlying moral obligation. | **Verbal/Real Hybrid.** (Verbal on whether 'fairness' adds anything; Real on how to handle free-riders.) |
  | **The Role of Sanctions** | Sanctions are merely costs added to the payoff matrix to restore equilibrium. | Sanctions are the enforcement mechanism of a normative community, expressing disapproval. | **Verbal.** (Both agree sanctions happen; dispute is on whether 'expression' matters.) |

  ## 3. Cruxes
  *Sub-questions where settling the fact would move at least one side. Both sides agree on the relevance of the evidence.*

  **Crux A: The Resentment Metric**
  *   **Question:** Does codification increase compliance *without* increasing reported resentment among long-term members?
  *   **Agreed Evidence:** An anonymous survey six months post-codification measuring "feelings of flexibility" and "willingness to comply."
  *   **CF Prediction:** Compliance stays same or drops; resentment rises (rules feel imposed).
  *   **NF Prediction:** Compliance rises; resentment drops (ambiguity is removed).

  **Crux B: The Newcomer Integration**
  *   **Question:** Do newcomers integrate faster with a handbook, or do they feel more policed?
  *   **Agreed Evidence:** Feedback from the three recent new members regarding their sense of belonging vs. feeling corrected.
  *   **CF Prediction:** They feel policed and less likely to contribute organically.
  *   **NF Prediction:** They feel relieved and more confident to participate.

  **Crux C: The Collapse Scenario**
  *   **Question:** If the written rule is breached, does the group correct the *person* or the *rule*?
  *   **Agreed Evidence:** Observation of the next major breach (e.g., someone leaves dishes for a week).
  *   **CF Prediction:** The group will ask if the rule needs changing (flexible equilibrium).
  *   **NF Prediction:** The group will ask why the person didn't follow the rule (fixed obligation).

  ## 4. The Four Cases

  **1. The Laminated Sheet**
  *   **CF View:** This is a *new* object. The old convention was sustained by mutual expectation; this is sustained by the authority of the text. It is no longer a Lewisian convention because the 'arbitrariness' is lost—the text makes it seem necessary.
  *   **NF View:** This is the *same* norm, finally rendered visible. The unwritten version was defective because it excluded newcomers. The text does not change the obligation, only its accessibility.
  *   **Joint Analysis:** It is a hybrid. It functions as a convention (everyone still does it because everyone else does) but claims the authority of a norm.

  **2. The Phantom Convention (Quiet Hours)**
  *   **CF View:** The origin story is irrelevant. A convention is defined by current mutual expectations and regularities. The false story is just 'cheap talk' that helps sustain the equilibrium.
  *   **NF View:** The origin story provides legitimacy. If members discover the vote never happened, the normative force weakens because the 'authority' was fabricated.
  *   **Joint Analysis:** The pattern remains stable either way, but the *stability* is more fragile for NF if the myth is busted. CF is indifferent to the bust.

  **3. The Milk**
  *   **CF View:** This is a 'Mixed-Motive Game'. Coordination isn't enough because there's a cost. It relies on *precedent* as a coordinating device. It works only as long as the 'sucker payoff' doesn't outweigh the social cost of not buying.
  *   **NF View:** This is the strongest case for a handbook. Coordination cannot explain why people *should* take a loss for the group. This requires a fairness norm, which needs explicit statement to enforce sanctioning of free-riders.
  *   **Joint Analysis:** CF admits this is the weakest link for a pure convention account. NF admits that without the convention of 'taking turns', the norm has no mechanism. They need each other here.

  **4. Pluralistic Ignorance (The Back Door)**
  *   **CF View:** As long as everyone *believes* others want it locked, it remains a convention. It is unstable, but it counts. The newcomer has a reason to comply only to avoid friction, not because the rule is 'right'.
  *   **NF View:** This is not a norm at all. A norm requires genuine normative acceptance, not just mistaken beliefs about others' acceptance. The newcomer has *no* reason to comply other than prudence.
  *   **Joint Analysis:** Both agree the pattern is fragile. CF calls it a 'bad convention'; NF calls it a 'false norm'. Both agree a handbook would shatter the illusion and likely end the practice.

  ## 5. Falsification Conditions

  **What would make the Convention-First side give up?**
  If a written handbook were introduced and, after one year, long-term members reported *higher* feelings of spontaneous cooperation and *lower* feelings of legalistic rigidity than before. Essentially, if writing it down did *not* kill the vibe.

  **What would make the Norms-First side give up?**
  If a written handbook were introduced and violation rates *increased* because members began treating the rules as minimum requirements (loopholing) rather than moral obligations, and the community lost the ability to sanction breaches informally.

  **Is there a shared settlement?**
  Yes. A **Trial Period**. Both sides agree that a six-month trial of a 'Living Document' (a handbook that can be verbally amended at house meetings without a vote) would generate the data needed for Cruxes A and B.

  ## 6. Recommendation to the House

  **Re: The Handbook Vote**

  We recommend a **Yes vote**, but with a specific amendment to the *nature* of the document.

  Do not write a Rulebook. Write a **User Guide**.
  The philosophical dispute turns on whether writing things down turns 'customs' into 'laws'. You can avoid this by drafting the handbook descriptively rather than prescriptively.

  *   **Bad (Prescriptive):** "Members *must* lock the back door. Violators *will* be fined." (This confirms CF fears of rigidity).
  *   **Bad (Descriptive only):** "People usually lock the door." (This confirms NF fears of lack of obligation).
  *   **Recommended (The Hybrid):** "Current Practice: The back door is locked by the last person down. We do this because..."

  This formulation satisfies the **Norms-First** requirement by making expectations explicit for newcomers (solving the 'Newcomer Deficit'), but satisfies the **Convention-First** requirement by framing the rules as 'Current Practice'—an equilibrium we have chosen, rather than a law imposed upon us. It preserves the arbitrariness (we could change it if we all agreed) while clarifying the expectation.

  Specifically regarding **The Milk**: This should be the only section written prescriptively. As agreed in Case 3, this is not pure coordination; it requires a fairness norm. Write the rota down.

  Regarding **Quiet Hours** and **Door Locking**: Write these as 'Current Practice'. If the phantom story is busted, let it go. The practice stands on its own utility.

  Vote to produce a document that describes *how we live*, not *how you must behave*. This keeps the convention alive while giving the normativists the clarity they need to welcome new members.
