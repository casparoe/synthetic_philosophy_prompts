      *   **Comparison:**
          *   EDT compares $0.1$ (Stay) vs $0.08$ (Flee) [using $h=0.2$]. EDT prefers Stay.
          *   CDT compares $0.8p + 0.1$ (Stay) vs $(0.9 - 0.8p)(0.8)$ (Flee).
