      *   **Problem with Current Case:** Students conflate it with Newcomb's Problem. The instructor wants to highlight the distinction between *uncertainty about one's own action* (Death in Damascus) vs. *prediction already made* (Newcomb).
      *   **Constraints:**
          1.  *Realism:* Two-city structure, sense of doom. Predictor is mundane (tracker/stalker), reliability 80-90% (round numbers). No demons/time travel.
          2.  *Independent Hazard:* One option must have a causal risk independent of the predictor (e.g., dangerous road).
          3.  *Characteristic Doom:* Conditional on either act, the probability of dying must remain high (no safe harbor).
          4.  *CDT/EDT Divergence:* The theories must disagree on the choice (Stay vs. Flee) without side bets.
          5.  *Quantitative Analysis:* Show verdicts as a function of prior credence in fleeing. Identify the range of disagreement and the flip point. Address the "mixed-strategy fix" objection.
          6.  *Self-Ratifying Policy:* Determine CDT's self-ratifying policy (pure or mixed), the mixing probability, and the threshold where it flips.
          7.  *Hunch Check:* Verify if the flip point in prior credence equals the mixing probability of the self-ratifying policy.
          8.  *Feature Isolation:* Identify the specific feature driving the result. Confirm if removing the independent hazard collapses it back to the original (coin flip) case.
          9.  *Evaluation:* Honest paragraph on the case's worth (Newcomb with noise vs. genuinely different) and potential defenses.
      *   **Format:** Scenario first, then machinery (acts, states, utilities, probabilities, arithmetic), then self-ratifying policy analysis, then feature isolation, then evaluation. No citations.

  2.  **Drafting the Scenario:**

      *   *Setting:* Damascus vs. Aleppo (keep the classic flavor but modernize slightly for realism).
      *   *Predictor:* "The Tracker." A skilled bounty hunter.
      *   *Reliability:* Let's pick 90% ($0.9$). It's high enough to create the doom feeling but leaves room for error.
      *   *Independent Hazard:* Fleeing to Aleppo involves a dangerous mountain pass. Staying in Damascus is safe *unless* the Tracker finds you.
      *   *Payoffs:*
          *   Survival = 100 utility.
          *   Death = 0 utility.
          *   Cost of Fleeing (hazard): Even if the Tracker isn't there, there's a risk of dying in the pass. Let's make it significant but not certain. Say, 20% chance of death due to accident/landslide independent of the Tracker.
      *   *The Doom:* If you Stay, Tracker is likely there (90%). If you Flee, Tracker is likely there (90%).
      *   *Refining the Hazard:* To ensure CDT and EDT diverge, the causal structure needs to be specific.
          *   If I Stay: Death if Tracker is in Damascus.
          *   If I Flee: Death if Tracker is in Aleppo OR if Accident happens.
          *   Tracker's location depends on his prediction of my action.
          *   Accident is independent.

  3.  **Formalizing the Model:**

      *   **Acts:** $S$ (Stay in Damascus), $F$ (Flee to Aleppo).
      *   **States:** $T_D$ (Tracker in Damascus), $T_A$ (Tracker in Aleppo).
      *   **Predictor Reliability:** $P(T_D | S) = 0.9$, $P(T_A | F) = 0.9$.
          *   Consequently: $P(T_A | S) = 0.1$, $P(T_D | F) = 0.1$.
      *   **Independent Hazard:** Let $H$ be the event of death by hazard (accident) if Fleeing. $P(H) = h$. Let's set $h = 0.2$ for now. If Staying, $P(H) = 0$.
      *   **Outcome (Death):**
          *   If $S$: Die if $T_D$. (Prob = 0.9). Survive if $T_A$. (Prob = 0.1).
          *   If $F$: Die if $T_A$ OR $H$. (Assume independent).
              *   $P(\text{Die} | F) = P(T_A | F) + P(H) - P(T_A | F)P(H)$.
              *   $P(\text{Die} | F) = 0.9 + 0.2 - (0.9)(0.2) = 1.1 - 0.18 = 0.92$.
      *   **Wait, check Constraint 3 (Characteristic Doom):** Both conditional probabilities of death must be high.
          *   $P(\text{Die} | S) = 0.9$.
          *   $P(\text{Die} | F) = 0.92$.
