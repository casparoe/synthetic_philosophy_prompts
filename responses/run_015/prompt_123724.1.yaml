              *   So $P(\text{Live} | F, \text{do}) = P(T_D) \cdot (1-h) + P(T_A) \cdot (1-h)(1-1) = P(T_D)(1-h)$.
              *   Wait, if Tracker is in Aleppo, I die (Tracker finds me). Hazard is redundant but consistent.
              *   Let's refine the Hazard logic.
