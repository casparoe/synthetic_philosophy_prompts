answer: |-
  ### The Mountain Pass Variant

  **Scenario**
  You are in Damascus. A skilled bounty hunter ("The Tracker") has been hired to eliminate you tomorrow. The Tracker is not supernatural; he is a shrewd human operative who has studied your psychology and habits. He must commit tonight to waiting for you in either Damascus or Aleppo. Based on his profile of you, his reliability is **90%**: if you stay, he predicts "Damascus" with probability 0.9; if you flee, he predicts "Aleppo" with probability 0.9. He will be waiting in the city he predicts.

  You have two options: **Stay** in Damascus or **Flee** to Aleppo.
  However, the road to Aleppo crosses a treacherous mountain pass. Even if the Tracker is not there, the journey itself carries an independent **20%** risk of fatal accident (landslide, banditry, mechanical failure). This hazard is causally independent of the Tracker's location. If you Stay, there is no travel hazard.

  **The Doom:**
  *   If you **Stay**: You die if the Tracker is in Damascus (90% chance). You survive only if he guessed wrong (10% chance).
  *   If you **Flee**: You die if the Tracker is in Aleppo (90% chance) *OR* if the accident occurs (20% chance).
  In either case, your conditional probability of death is extremely high. There is no safe harbor.

  **The Question:**
  You must choose tonight. Do you Stay or Flee?

  ***

  ### The Machinery

  **Acts:**
  *   $S$: Stay in Damascus.
  *   $F$: Flee to Aleppo.

  **States (Tracker's Location):**
  *   $T_D$: Tracker is in Damascus.
  *   $T_A$: Tracker is in Aleppo.

  **Parameters:**
  *   Tracker Reliability ($r$): $0.9$.
  *   Independent Hazard ($h$): $0.2$ (applies only to $F$).
  *   Utilities: $U(\text{Live}) = 1$, $U(\text{Die}) = 0$. (We maximize Probability of Survival).

  **Probabilities:**
  Let $p$ be your prior credence that you will Flee ($P(F) = p$).
  The Tracker's prediction correlates with your act.
  $$P(T_A | F) = r = 0.9$$
  $$P(T_D | S) = r = 0.9$$
  $$P(T_A | S) = 1 - r = 0.1$$
  $$P(T_D | F) = 1 - r = 0.1$$

  The unconditional probability of the Tracker being in Aleppo depends on your propensity $p$:
  $$P(T_A) = P(T_A | F)p + P(T_A | S)(1-p)$$
  $$P(T_A) = 0.9p + 0.1(1-p) = 0.8p + 0.1$$
  $$P(T_D) = 1 - P(T_A) = 0.9 - 0.8p$$

  **Evidential Decision Theory (EDT):**
  EDT maximizes conditional expected utility $V_{EDT}(A) = \sum P(S | A) U(A, S)$.
  *   **Value of Stay:**
      $$V_{EDT}(S) = P(\text{Live} | S) = P(T_A | S) = 0.1$$
  *   **Value of Flee:**
      To survive Fleeing, the Tracker must be wrong ($T_D$) *and* the accident must not happen ($\neg H$).
      $$P(\text{Live} | F) = P(T_D | F) \times (1 - h) = 0.1 \times 0.8 = 0.08$$
      $$V_{EDT}(F) = 0.08$$

  **Verdict:** Since $0.1 > 0.08$, **EDT strictly prescribes Stay**, regardless of $p$.

  **Causal Decision Theory (CDT):**
  CDT maximizes causal expected utility $V_{CDT}(A) = \sum P(S | \text{do}(A)) U(A, S)$. The act does not causally influence the Tracker's prior location, so $P(T | \text{do}(A)) = P(T)$.
  *   **Value of Stay:**
      $$V_{CDT}(S) = P(T_A) \times 1 + P(T_D) \times 0 = P(T_A) = 0.8p + 0.1$$
  *   **Value of Flee:**
      If you Flee, you survive only if the Tracker is in Damascus ($T_D$) *and* the accident does not happen.
      $$V_{CDT}(F) = P(T_D) \times (1 - h) = (0.9 - 0.8p) \times 0.8 = 0.72 - 0.64p$$

  **Verdict:** CDT depends on $p$.
  *   Prefer Flee if $V_{CDT}(F) > V_{CDT}(S)$.
      $$0.72 - 0.64p > 0.8p + 0.1$$
      $$0.62 > 1.44p$$
      $$p < \frac{62}{144} = \frac{31}{72} \approx 0.43$$
  *   Prefer Stay if $p > \frac{31}{72}$.
  *   Indifferent if $p = \frac{31}{72}$.

  **Range of Disagreement:**
  The theories disagree when $p < 31/72$. In this range, EDT says **Stay** (due to the hazard evidence), while CDT says **Flee** (because the causal odds of the Tracker being in Damascus are high enough to outweigh the hazard). When $p > 31/72$, both theories say **Stay**.

  ***

  ### Self-Ratifying Policy

  A rational agent's credence $p$ should align with her intended policy.
  *   **EDT Policy:** Since $V_{EDT}(S) > V_{EDT}(F)$ always, the EDT agent intends to Stay. Thus $p = 0$. This is consistent ($0 < 31/72$, but EDT doesn't look at the CDT flip point). EDT settles on a **Pure Strategy: Stay**.
  *   **CDT Policy:** If the agent intends to Flee ($p=1$), CDT values Stay higher ($0.9 > 0.08$). If she intends to Stay ($p=0$), CDT values Flee higher ($0.1 < 0.72$). The only stable credence is where she is indifferent.
      **Mixing Probability:** $p^* = \frac{31}{72} \approx 0.43$.
      **CDT Policy:** **Mixed Strategy** (Flee with probability 43%, Stay with 57%).

  **The Hunch Check:**
  You suspected the flip point in the prior credence ($31/72$) is the same number as the mixing probability of the self-ratifying policy ($31/72$).
  **This is correct.** In linear CDT problems of this sort, the point where the value functions cross (the verdict flip) is definitionally the point where the agent is indifferent, which defines the equilibrium mixing probability.

  **Thresholds:**
  *   **Reliability Threshold:** If the Tracker's reliability $r$ drops, the value of mixing drops. If $r$ is low enough, CDT will also prefer Pure Stay.
  *   **Hazard Threshold:** If the hazard $h$ increases, $V_{CDT}(F)$ drops. If $h$ is large enough, CDT will prefer Pure Stay even at $p=0$. Specifically, CDT flips to Pure Stay if $V_{CDT}(F)|_{p=0} < V_{CDT}(S)|_{p=0}$.
      $$(0.9)(1-h) < 0.1 \Rightarrow 0.9 - 0.9h < 0.1 \Rightarrow 0.8 < 0.9h \Rightarrow h > 8/9 \approx 0.89.$$
      If the pass is more than 89% deadly, even CDT says Stay.

  ***

  ### Feature Isolation

  The feature doing the work is the **Independent Causal Hazard ($h$)**.

  If you remove the hazard ($h=0$):
  1.  **EDT:** $V_{EDT}(S) = 0.1$, $V_{EDT}(F) = 0.1$. EDT becomes **indifferent**. It no longer issues a strict verdict.
  2.  **CDT:** Equilibrium shifts to $p^* = 0.5$ (Coin Flip).
  3.  **Result:** The case collapses to the original Death in Damascus structure where both acts are equally bad news. The disagreement becomes weak (Indifferent vs. Coin Flip) rather than strong (Stay vs. Mixed).

  The hazard breaks the symmetry for EDT. It gives EDT a causal reason to prefer Stay (avoiding the accident), which it conflates with the evidential news. CDT separates the two: it acknowledges the hazard but realizes it can mitigate the Tracker risk via randomization. The hazard forces EDT off the fence, making the divergence sharp and actionable.

  ***

  ### Evaluation

  Is this genuinely different from Newcomb's Problem, or just Newcomb with noise? It is Newcomb's Problem with the payoff structure inverted and a causal tax added. In Newcomb's, one box is "good news" and "causally safe." Here, both boxes are "bad news," but one is "causally riskier." This inversion is pedagogically vital. It prevents students from fixating on the "reward" (the million dollars) and forces them to focus on the "prediction mechanism."

  The case is worth using because it isolates the **mixed-strategy fix**. A defender of EDT will argue that randomization is irrational; you cannot confuse a predictor by flipping a coin if the predictor predicts the coin flip. They will claim the 90% reliability holds against the mixed strategy, rendering CDT's calculation illusory. A defender of CDT will argue that the predictor predicts the *act*, and if the act is essentially random (a true mixed policy), the predictor's accuracy is mathematically constrained to the base rate, allowing the agent to exploit the gap.

  However, the "loser" here is clearly EDT. By refusing to randomize, the EDT agent accepts a 90% death rate to avoid a 20% hazard, ignoring that her certainty makes the Tracker's 90% accuracy lethal. CDT offers a 55% survival rate via randomization. The case demonstrates that in high-stakes prediction environments, evidential reasoning can be fatal because it treats the agent's own policy as fixed evidence rather than a causal variable that influences the predictor's success rate. It forces the student to admit that sometimes, the rational thing to do is make yourself unpredictable, even if predictability feels safer.
