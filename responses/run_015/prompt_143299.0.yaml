prompt: |-
  hey so i want you to act like a philosopher of history who's also comfortable with archaeology and textual criticism — not a librarian, just someone who thinks about how stories turn into accepted facts. before you dive in, do a quick brainstorm: list maybe three or four things that usually push people to upgrade a story from "myth" to "probably happened," then we'll test them.

  here are my gut verdicts on four cases, and i want to know if there's a single principle behind them or if i'm just being inconsistent.

  1. the trojan war. there's the destruction layer at Hisarlik and those hittite texts mentioning Wilusa, so i think there's a real conflict behind Homer's poem. but the wooden horse and Achilles' heel are clearly legend. verdict: history with legend glued on.

  2. king arthur. people point to some romano-british leader or battle lists, but there's no contemporary record and the first real texts are centuries later. verdict: still legend, maybe with a tiny unprovable kernel.

  3. the exodus narrative. there's the merneptah stele mentioning israel in canaan, and some scholars compare it to the hyksos expulsion, but i don't think that saves the mass-migration story. verdict: foundation legend, not history, despite some distant echoes.

  4. made-up case to stress-test my intuition: the "three blacksmiths of bergen" local legend. they say in 1349 three smiths forged a sword that stopped a flood, with specific names given. recently a sword was pulled from the riverbed near Bergen with 14th-century metalurgy, but no document mentions the story before the 1600s. verdict: lucky artifact match, still a legend.

  so my pattern seems like: archaeology plus near-contemporary texts equals kernel; long textual gap equals legend; archaeological absence plus internal narrative equals legend; and a single artifact without textual continuity equals still legend.

  but there's tension: troy and exodus both have some external textual referances, yet i accept one and reject the other. and for the blacksmiths i reject despite the sword. is my real principle about the *type* of evidence — destruction layers versus single objects? or about narrative scale? please propose one or two precise principles, say what each predicts for romulus and remus given the recent lupercal cave findings, and be honest about which of my four verdicts each principle forces me to drop or revise.

  also please say what specific kind of discovery — like a certain kind of document or archaeologial pattern — would change your mind about which principle is right, and point out exactly where your reasoning is shakiest. i want you to be self-critical: tell me what argument or evidence would flip your verdict, and don't pretend you're more sure than you are.
