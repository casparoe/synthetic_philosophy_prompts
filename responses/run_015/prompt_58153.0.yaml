  **(Self-Correction Note):** Make sure the names fit the setting. "Elara" and "Solveig" are a bit fantasy-esque. Let's go with something more grounded. "Katrien" and "Liesbet"? Or just "The Shipwright" and "The Archivist" in my head, but give them names in the text. Let's use **Ineke** (Shipwright) and **Claes** (Archivist)? No, sisters. **Ineke** and **Sara**. Let's go with **Ineke** (Shipwright) and **Mara** (Archivist). It sounds maritime.

