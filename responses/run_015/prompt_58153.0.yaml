answer: |-
  The tide was turning, the water in the basin rising to meet the hull of the working ferry. It bobbed gently against the pilings, dark and solid. On the slipway above, dry as bone and propped on timber cradles, sat the other *Maren*. The scent of creosote and brine hung heavy between the two sisters.

  Hanne, the elder, leaned her hip against the dock rail, her hands stained permanently with oak gall and oil. Greta stood closer to the slipway, her fingers tracing the spine of a ledger, clean and precise.

  "You look at her as if she's a ghost," Hanne said, nodding toward the vessel on the slipway. "But she's just wood that refused to rot."

  "She is not just wood," Greta replied, her voice low. "She is the *Maren*. Every plank that was laid in the yard thirty years ago is in that hull. You know the inventory. I have the bills of lading for every timber you discarded."

  "And I have the logbook for every crossing," Hanne countered. "The *Maren* that floats is the one that carried the butcher, the priest, and the magistrate across this channel four thousand times. The one on the cradles has never wet her keel. How can a ferry be a ferry if she doesn't ferry?"

  "Identity isn't a job description, Hanne. It's an origin story. If you take a man's coat and replace the sleeves, then the collar, then the hem, until no original thread remains, is it the same coat? Or is it a copy that merely resembles the first?"

  "It is the same coat because the man wore it through the winter without noticing the change. Continuity is the thread, not the wool. You removed the timbers because they were spent. I set the new ones to keep the shape true. The form persisted. The purpose persisted. The name persisted in the mouths of the town."

  Greta stepped away from the ledger, looking up at the dry hull. "But the name was applied to the matter, not the function. When you pulled the original keel, you broke the spine. You say the form persisted, but form is just an arrangement of matter. If I scatter the stones of a cathedral and build a house, then take those stones and rebuild the cathedral elsewhere, the house is not the cathedral. The stones remember where they belonged."

  "But I didn't scatter them," Hanne insisted, pushing off the rail. "I replaced them one by one. There was never a moment when the *Maren* ceased to be. If I swap a rotten plank today, is she still *Maren*?"

  "Yes."

  "And tomorrow?"

  "Yes."

  "Then at what point in thirty years did she become a stranger? If you cannot name the day the soul left the hull, then it never left. Gradual change is how living things survive. We shed skin, we lose hair, we heal wounds. Am I not the same sister who stood with you when Mother died, though every cell in me has turned over?"

  Greta turned back, her eyes sharp. "That is the trap of gradualism. It assumes that because the eye cannot detect the change, the change does not count. But consider this: Suppose you had not thrown the old timbers away. Suppose you had kept them in the shed, as I did. On the day you laid the very last new plank, you would have had a complete set of original parts sitting in the warehouse. At that exact moment, before I assembled them, where was the *Maren*?"

  "She was in the water, working."

  "Then what was in the warehouse?"

  "Debris. Discarded matter."

  "But if I assemble that debris," Greta pressed, "and suddenly the *Maren* appears on the slipway, did she teleport from the water to the wood? Or did she cease to exist in the water the moment the last original piece was removed?"

  Hanne frowned, the line of her brow deepening. "She didn't cease. The history didn't stop. The town still calls to her to come ashore."

  "The town can be wrong. They call the sun 'rising,' but it does not rise. Here is the objection you cannot answer, Hanne: If the working ship is *Maren* because of continuity, and the reassembled ship is *Maren* because of origin, then we have two *Marens*. But there cannot be two identical identities. If both vessels claimed the name at once, which one do you arrest for a breach of contract? If the original timber-ship sinks, does the working-ship die? Or does the working-ship survive and the timber-ship become a monument?"

  Hanne was silent for a moment, watching the tide lift the floating hull. "If the timber-ship sinks, I feel no loss. If the working-ship sinks, the town is stranded. You speak of identity as if it is a property of the object, like weight or density. It is not. It is a property of the relationship between the object and the world. A sword kept in a glass case is a sculpture. A sword swung in battle is a weapon. The *Maren* is defined by the crossing."

  "That reduces the ship to a verb," Greta said softly. "But a verb requires a subject. What is doing the crossing? If it is not the original wood, then what? You argue that the pattern survives. But a pattern is an abstraction. You cannot sail an abstraction. You sail matter. When you replaced the keel, you killed the first vessel and birthed a second, identical twin. You kept the name to spare the town's feelings, but you know the truth. The ship that touched the water this morning is a child of the original, not the original itself."

  "And your ship on the slipway?" Hanne shot back. "It is a corpse reanimated. You have the bones, yes. But you lack the life. You speak of the 'original wood,' but wood rots. Wood warps. The timber in your warehouse sat for ten years. It dried. It shrank. When you nailed it back together, you forced it into a shape it no longer naturally held. You built a likeness. I maintained a life."

  "Is life so fragile that changing a rib kills it?" Greta asked. "If a man loses a leg to gangrene and wears a wooden prosthetic, is he a different man?"

  "No. But if you take the man apart while he sleeps and rebuild him with new flesh, leaving the old flesh in a pile to be woken up... which one wakes up screaming?"

  Greta flinched, just slightly. "That is a horror story, not a shipyard logic. We are talking about property and provenance. If I sell you a painting, and you scrape off the paint to preserve the canvas, then I take the scraped paint and reconstruct the image on a new canvas, who owns the masterpiece? The owner of the canvas, or the owner of the pigment?"

  "The owner of the image," Hanne said immediately. "Because the value is in the seeing."

  "The value is in the hand of the artist," Greta corrected. "The touch of the original maker. The *Maren* was built by Father's hands. Those hands touched the wood on the slipway. They never touched the wood in the water. You are sailing a ghost of his work. I am preserving his actual touch."

  Hanne walked down the gangplank to stand on the deck of the working ferry. She stomped her foot. The wood rang solid. "His hands are gone, Greta. The town remains. If I tell them their ferry is a fake, the trust breaks. The utility breaks. Is truth something you keep in a ledger, or something you live by?"

  "Truth is what survives the fire," Greta said, gesturing to the dry hull. "If the yard had burned thirty years ago, and only the warehouse survived, I would have the *Maren*. You would have nothing but a memory. Therefore, the essence of the ship resided in the stored timber, not the active hull. The active hull was merely the temporary vessel of the idea."

  "But the yard did not burn," Hanne said, her voice hardening. "The river flows. It is never the same water, yet it is the same river. If you dam the river to keep the original water in a lake, and let a new stream flow through the bed, which is the river? The stagnant lake, or the flowing stream?"

  "The stream is the riverbed," Greta conceded. "But the water is the life. You have kept the bed and changed the water. I have kept the water and found a new bed."

  "We are at an impasse," Hanne said, looking up at her sister. "You want the ship to be a noun. I need her to be a verb."

  "And yet," Greta said, descending the slipway steps to stand on the same level as Hanne, "tomorrow the town will vote. They must decide which vessel bears the name for the registry. They cannot register both. If they choose you, they admit that matter is disposable. If they choose me, they admit that function is irrelevant. What does that say about us? Are we the sum of our parts, or the sum of our days?"

  Hanne looked at the floating ferry, then at the dry one. The tide was high now; the working *Maren* was ready to cast off. The dry *Maren* sat silent in the moonlight.

  "Perhaps," Hanne said, reaching for the mooring line, "the name is the only thing that was never replaced. And perhaps it is too heavy for either of us to carry alone."

  "Then let the name break," Greta said, turning back toward the archive, "rather than the truth."

  "Or let the truth bend," Hanne replied, casting off the line, "so the town can cross."

  The ferry drifted out into the dark water, leaving the dry hull behind on the land, neither sister looking back to see which one truly held the shadow of the name.
