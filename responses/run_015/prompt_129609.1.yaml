  2.  **Deconstruct the Core Concepts:**

      *   **Expected Value (EV) under Uncertainty:**
          *   *Roommate's view:* Standard rational choice theory. $EV = Probability \times Impact$.
          *   *User's view:* Knightian Uncertainty (unknown unknowns). Assigning a 1% chance to a policy shift is arbitrary. If you change it to 0.1% or 5%, the decision flips. This is "fake precision."
          *   *Verdict:* The user is right to be skeptical. EV works best with frequentist data (like malaria nets), not unique political events. However, *rough* EV thinking is still useful to avoid obviously bad bets.

      *   **Diversification (Moral Portfolio):**
          *   *Pros:* Hedges against being wrong about which cause is best. Reduces regret. Psychological comfort. Captures value if *any* of the causes turn out to be the "winner."
          *   *Cons:* Dilutes impact if one cause is objectively 100x better than the others (concentration bias). Transaction costs (time/effort).
          *   *Does it fix the ignorance?* It doesn't fix the ignorance, but it manages the *risk* of ignorance. It's an admission that "I don't know which model of the world is correct."

      *   **The Specific Options:**
          *   *Malaria Nets:* High confidence, diminishing returns (maybe), tangible lives saved.
          *   *Climate Policy:* Low confidence, potentially massive scale (global), long time horizon.
