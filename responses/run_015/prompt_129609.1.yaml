      *   **Option A (High Risk/High Reward):** Tiny climate-policy nonprofit. Potential outcomes: Flop (0 impact) or Huge Carbon-Tax Shift (Massive impact). Probabilities unknown.
      *   **Option B (Safe/Proven):** Index fund + 4% annual donation to malaria bednets (Against Malaria Foundation style). Proven impact, lower ceiling per dollar but reliable.
