  2.  **Determine the Argument Strategy:**
      *   I need to address the "merged city" issue directly. The user sees the merger as breaking the chain of responsibility (like sharing a fence with a neighbor). I need to argue that the merger creates a *new* entity that inherits the assets and status of the old ones, including the moral ledger.
      *   I need to address the "dead people" issue. The apology isn't about personal guilt of current residents, but about the institution's continuity.
      *   I need to address the "empty symbol" issue. The plaque/ceremony isn't just words; it's a statement of current values and acknowledgment of ongoing effects (even if burial fees aren't changed).
      *   I need to answer "Who is apologizing to whom for what?"
          *   Who: The current political community (the city).
          *   To Whom: The descendants of the excluded and the public trust.
          *   For What: The institutional injustice that shaped the community we live in today.

  3.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, I need to sound like a passionate but reasonable defender. Not a professor, but someone who cares about civic integrity.*
      *   *Address the merger:* When towns merge, they don't just share a fence; they become one body. They take the assets, the roads, the buildings. You can't take the good stuff (the tax base, the land) and leave the bad stuff (the shame, the injustice) behind.
      *   *Address the "neighbor's grandfather" analogy:* It's not like a neighbor. It's like buying a house with a hidden defect. If you buy a house, you own the problems too. But better yet, it's about the *city* as an institution. The city didn't die in the 40s. It's the same city, just renamed or expanded.
