      *   *Key Point:* The city is a continuing institution. The merger doesn't erase history; it incorporates it. The residents aren't apologizing for personal guilt, but for the institution they now govern.
      *   *Key Point:* The benefit isn't just burial plots; it's the kind of community that was built. Exclusion built wealth and social capital for some that persists.
      *   *Key Point:* The apology is about the present relationship, not just the past act.

  5.  **Final Polish (simulating the voice):**
      "Look, the difference between a neighbor and a merged city is that a city is an institution that doesn't die when its residents do. When your town merged, you didn't just share a fence; you swallowed that town's history, assets, and liabilities into a single new body. You can't claim the tax base and the land value those policies helped build while pretending the shame belongs to a ghost. The apology isn't about you personally feeling guilty for something your grandfather didn't do; it's about the city admitting that the foundation it stands on was poured unfairly. We are apologizing as the current stewards of that institution to the descendants who were told they didn't belong, acknowledging that the trust between them and local government was broken in a way that still echoes today. If we say the merger wipes the slate clean, we're basically saying institutions have no memory, which lets them off the hook for every long-term consequence of their own rules."

