answer: |-
  It's not daft at all. What you're bumping up against is a cultural clash between the meritocratic mindset you're used to (common in the UK/US) and the egalitarian ethos of Scandinavia, specifically the **Law of Jante** (*Janteloven*). Since she's just come back from Bergen, she's likely re-calibrating to life here, and unfortunately, she's projecting that cultural shock onto you.

  The phrase "don't think you're better than us" is a blunt instrument. It smashes several different ideas together. Here is the breakdown of those claims, from the reasonable to the toxic, along with an assessment of their validity.

  ### 1. The Human Worth Claim
  *   **The Claim:** "Earning more money or having a fancier title does not make you a morally superior human being to the rest of the family."
  *   **Verdict:** **True (but a platitude).**
  *   **Analysis:** Obviously, a pay rise doesn't make you a better person. Most reasonable people know this. If this is all she means, she's reminding you to stay humble.
  *   **Does it stop the promotion?** No. You can be humble and still be ambitious.

  ### 2. The Behavioural Claim
  *   **The Claim:** "Do not let this success change how you treat us. Don't become arrogant, dismissive, or less available."
  *   **Verdict:** **Defensible.**
  *   **Analysis:** This is a valid concern. Success can change people. She is pre-emptively asking you to promise that you won't get 'big for your boots'.
  *   **Does it stop the promotion?** No, but it comes with a condition: you must remain the same sibling you were before.

  ### 3. The Relational Claim
  *   **The Claim:** "Don't let your ambition create distance between us. Don't drift away into a different social circle or lifestyle."
  *   **Verdict:** **Defensible but Arguable.**
  *   **Analysis:** Sometimes moving up professionally does change your lifestyle. She is expressing insecurity that you might outgrow the family unit. This is more about her fear of loss than your actual behaviour.
  *   **Does it stop the promotion?** No, but it requires reassurance that you aren't leaving the family behind.

  ### 4. The Cultural Harmony Claim (The Jante Law)
  *   **The Claim:** "Individual standout success disrupts the group equilibrium. We value collective modesty over individual achievement here."
  *   **Verdict:** **Culturally Specific (Arguable).**
  *   **Analysis:** This is what she learned in Norway. In Scandinavia, overt ambition can be seen as selfish. In the UK, it's often seen as admirable. Neither is objectively 'true', but they are incompatible values. She is trying to enforce Scandinavian social norms on a British family chat.
  *   **Does it stop the promotion?** No. You live here, not in Bergen. You are not bound by Norwegian social contracts.

  ### 5. The Insecurity Claim (The Tall Poppy)
  *   **The Claim:** "Your success makes us feel bad about our own lack of success, so you should suppress it to protect our feelings."
  *   **Verdict:** **False (and Toxic).**
  *   **Analysis:** This is the 'spicy' version. It suggests your light shines too brightly on their shadows. This is emotional manipulation, plain and simple.
  *   **Does it stop the promotion?** Absolutely not. You cannot sacrifice your livelihood to manage someone else's insecurity.

  ### What she actually means
  When people trot this line out, they usually mean a mix of **Claim 2** and **Claim 5**. They wrap the toxic insecurity (Claim 5) in the reasonable request for humility (Claim 2). Because she's just moved back from a culture that institutionalises Claim 4, she probably thinks she's being morally righteous rather than insecure.

  ### Should you go for the promotion?
  None of these claims give you a valid reason to turn down the shift-lead role.
  *   If you are humble (Claim 1 & 2), you are fine.
  *   If you stay close to the family (Claim 3), you are fine.
  *   You are not responsible for managing her insecurity (Claim 5).
  *   You are not Norwegian (Claim 4).

  ### Draft Response for the Group Chat
  You want something that acknowledges her experience without accepting her premise. It needs to be firm but loving, so it doesn't start a war. Here is a draft you can adapt:

  ***

  "Hey, I've been thinking about what you said regarding the 'tall poppy' thing and Jante Law from your time in Bergen. I get where you're coming from — over there, standing out can be seen as selfish, and I respect that culture.

  But I need to be honest about where I'm at. For me, going for this role isn't about thinking I'm better than anyone; it's about securing my future and taking on more responsibility. I'm still the same person, I still love this family, and I'm not going anywhere.

  I know sometimes sharing good news can feel like showing off, but I share it because I want you lot involved in my wins, just like I celebrate yours. I'm not asking for permission to succeed, just asking for your support while I do it. Let's not make this a competition — there's enough success to go round for all of us."

  ***

  **Why this works:**
  *   **Validates her:** Acknowledges the Bergen influence so she feels heard.
  *   **Sets boundaries:** "I'm not asking for permission" is key.
  *   **Reframes intent:** Changes it from "arrogance" to "security/responsibility".
  *   **British Tone:** It's polite but direct, using standard spelling (organise/realise style) to keep your flatmate happy.

  If she kicks off after that, you know it's purely Claim 5 (insecurity), and you can stop sharing news with her directly while continuing to live your life. Good luck with the shift-lead role.
