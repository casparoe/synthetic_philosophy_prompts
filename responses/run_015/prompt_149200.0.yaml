  **MEMORANDUM**

  **TO:** Cross-Cultural Research Ethics Board
  **FROM:** Ethics Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Feedback Norms in Joint Collaborations

  **Recommendation:** The Board must adopt a "Structured Feedback Protocol" mandating written clarification of critical verbal feedback within 14 days, implementable by Spring Semester.

  **Reasoning:** The Van Dijk/Tanaka dispute illustrates that unregulated cultural norms cause tangible harm. Dr. Van Dijk's directness caused dignitary harm, triggering the student's exit. However, Dr. Tanaka's indirectness incurred what we term "communicative debt." While softening truth preserves social trust, it creates an obligation to correct the record eventually. Failure to pay this debt is not merely polite; it is a theft of the researcher's time and agency, resulting in the epistemic harm seen here.

  **Addressing Counterarguments:** We acknowledge the Japanese co-PI's position: brutal honesty can dismantle the psychological safety required for learning. Prioritizing raw truth ignores that social trust needs smoothing, or people shut down. This protocol respects that concern by allowing initial verbal softening, provided it is not the final word. We recognize that dignity is a prerequisite for productivity, not an obstacle to it.

  **Protocol Details:**
  1.  **Verbal Flexibility:** PIs may use culturally normative indirectness during initial discussions to preserve dignity.
  2.  **Mandatory Clarification:** Any verbal feedback implying significant methodological risk must be followed by a written summary within 14 days.
  3.  **Debt Ceiling:** If a project is deemed unsalvageable, this must be explicitly stated in writing within 30 days of identification. No "interesting potential" assessments may exceed this timeframe without concrete milestones.

  This approach honors the charter's dual mandate. It permits cultural sensitivity without permitting permanent ambiguity. By institutionalizing the repayment of communicative debt, we prevent time theft while maintaining respectful collaboration.

  **Action:** Draft policy language by November 15; ratify by December 1.
