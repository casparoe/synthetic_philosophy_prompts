prompt: |-
  I just got out of this long, exhausting argument with my friend about wether being blunt is actually more moral than being polite, like Dutch directness versus Japanese indirectness and wether white lies are ever okay. She kept saying that if you soften the truth to spare feelings you're treating the other person like a child, and I was like okay but also if you're brutally honest you ignore that social trust needs some smoothing or people just shut down. Anyway I'm on my university's cross-cultural research ethics board and we have a concrete case for Thursday that hits this exact tension, so I need a memo I can circulate before the meeting.

  The case: we run a joint Dutch-Japanese lab collaberation, and there's a dispute over feedback norms. The Dutch PI, Dr. Van Dijk, told a grad student her methodology was "fundamentally broken and not salvageable," and the student dropped out. Meanwhile the Japanese co-PI, Dr. Tanaka, had been telling the same student for months that her work was "interesting and might develop further," which she took as encouragement, so she wasted half a year on a dead end before learning the Dutch PI's actual view. Now both sides complain — the Dutch side says Japanese indirectness caused real epistemic harm and violated a duty of honesty; the Japanese side says Dutch bluntness caused dignitary harm and violated our charter's "respectful collaboration" clause. Our charter says feedback should be "both truthful and culturally sensitive" but doesn't say what to do when those clash. I need you to draft the board's recommendation memo — pick either prioritizing directness, prioritizing indirectness, or some concrete procedural fix — with a clear course of action and a time frame (like implement by next semester). The memo should have the bottom line up front, then reasoning, and it needs to take the strongest argument on the losing side seriously, not just dismiss it. Also please weave in my friend's idea about "communicative debt" — that every softened message creates an obligation to correct eventually, and failure to correct is a kind of theft of the other person's time — I'm not sure if that supports directness or undermines it, but address it. Keep it tight: max 350 words, no citations or reading lists, and write it like an actual document I could send, not like a philosophy essay. Oh and please don't just restate the charter; I need a real recommendation with teeth.
