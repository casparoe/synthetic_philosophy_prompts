answer: |-
  ### Preliminary Framework Analysis

  **Value-Components at Stake:**
  *   **Aesthetic/Manifest Value:** Visual pleasure, compositional balance, technical skill (brushwork, light), expressive power.
  *   **Provenance/Historical Value:** Authenticity of origin (Vermeer vs. Van Meegeren), rarity, art-historical significance, connection to a specific genius/period.
  *   **Instrumental/Market Value:** Financial price, investment potential, museum prestige.
  *   **Moral/Legal Value:** Honesty in attribution, national heritage laws, treason vs. forgery charges.
  *   **Narrative Value:** The story of discovery, the story of deception, the story of resistance (Göring).

  **Candidate Mappings (Framework to Case):**
  *   *Manifest-Feature Value:* The visual beauty of *Supper at Emmaus* remains constant regardless of attribution.
  *   *Provenance-Value:* The high acclaim and price depended on the belief it was by Vermeer (fails Counterfactual-attribution test).
  *   *Revelation-Sensitivity:* The drop in esteem and price upon confession is revelation-sensitive. The continued exhibition is revelation-insensitive regarding manifest value but sensitive regarding classification.
  *   *Second-Order Authenticity:* The painting becomes a "genuine Van Meegeren forgery," acquiring value as a historical artifact of deception and skill, explaining why it was not destroyed.

  **Silences and Distortions:**
  *   **Perceptual Theory-Ladenness:** The framework assumes manifest features are stable. In reality, experts may have *seen* the brushwork differently because they believed it was Vermeer (confirmation bias).
  *   **Moral Weight:** The framework treats value abstractly. It struggles to capture the specific moral outrage of selling to Göring vs. the admiration for deceiving him.
  *   **Market Mechanics:** The framework distinguishes values but doesn't fully explain the *mechanism* of price collapse (trust collapse vs. value loss).
  *   **Second-Order Generality:** If every forgery becomes a "genuine forgery," does the concept of forgery lose its pejorative force? The framework risks validating all fakes eventually.

  ***

  ### 1. Agent Mapping

  The framework requires us to distinguish what each agent valued based on their epistemic position regarding provenance.

  *   **The Connoisseur-Experts (e.g., Bredius):**
      *   *Valuation:* They attributed high **provenance-value** (believing it was a lost Vermeer) which amplified their perception of **manifest-feature value**.
      *   *Options:* Praise, authenticate, publish.
      *   *Evidence:* Visual features (style), stylistic expertise, but crucially reliant on the *assumption* of 17th-century origin.
      *   *Framework Implication:* Their praise was **revelation-sensitive**. Had they known it was Van Meegeren (Counterfactual-attribution test), the value assigned would have been significantly lower (a good pastiche rather than a masterwork).

  *   **The Museum/Art Society:**
      *   *Valuation:* Acquired for **provenance-value** (national treasure status) and **manifest-feature value** (public admiration).
      *   *Options:* Buy, display, protect.
      *   *Evidence:* Expert testimony, provenance documents (forged), visual inspection.
      *   *Framework Implication:* Their acquisition was rational under false beliefs about provenance. Upon revelation, the object's kind changed, requiring reclassification rather than destruction.

  *   **The Ordinary Pre-Revelation Viewer:**
      *   *Valuation:* Primarily **manifest-feature value** (enjoyment of the image), but bolstered by the awe of **provenance-value** (standing before a Vermeer).
      *   *Options:* View, admire.
      *   *Evidence:* Visual features, museum label.
      *   *Framework Implication:* Their enjoyment was partially **revelation-sensitive**. Knowing it is a fake may diminish the "awe" component (provenance) even if the visual pleasure (manifest) remains.

  *   **Göring as Buyer:**
      *   *Valuation:* High **provenance-value** (status of owning a Vermeer), instrumental value (investment/power), and **manifest-feature value**.
      *   *Options:* Buy, possess.
      *   *Evidence:* Expert assurance, price (as a signal of quality).
      *   *Framework Implication:* His transaction was based on false provenance. The framework explains his loss not as visual, but as **provenance-value** collapse.

  *   **The Postwar Public (Van Meegeren as Hero):**
      *   *Valuation:* New **second-order authenticity**. The object became a symbol of Dutch resistance/cunning.
      *   *Options:* Celebrate, forgive.
      *   *Evidence:* The confession, the context of the occupation.
      *   *Framework Implication:* This validates the **second-order-authenticity** clause. The object gained a new causal-historical value (deceiving the enemy) that replaced the lost Vermeer provenance.

  *   **The Present-Day Viewer:**
      *   *Valuation:** **Manifest-feature value** (historical style) + **Second-order provenance-value** (famous forgery).
      *   *Options:* View, study, recontextualize.
      *   *Evidence:* Known history, visual features.
      *   *Framework Implication:* The viewer values the object *as* a Van Meegeren. The value is stable because beliefs match reality (no further revelation sensitivity regarding authorship).

  ### 2. Explanatory Mapping

  The framework illuminates the trajectory of the *Supper at Emmaus* by categorizing the shifts in value rather than denying them.

  *   **Initial Acclaim:** Explained by the conflation of **manifest-feature value** and **provenance-value**. The experts believed the manifest features were evidence of Vermeer's genius (provenance), inflating the value. The Counterfactual-attribution test confirms this: had it been attributed to Van Meegeren in the 1930s, it would not have been hailed as a "major rediscovery."
  *   **High Value Placement:** The financial and prestige value was largely **provenance-value**. The framework explains why the price collapsed upon confession: the causal-historical relation to Vermeer was severed.
  *   **Shock of Exposure:** This is a **revelation-sensitive** response. The physical object did not change, but the beliefs about its genesis did. The framework validates your intuition that something real was lost (the relation to Vermeer), countering your friend's claim that only a "label" changed.
  *   **Change in Legal/Public Standing:** Van Meegeren moved from traitor (selling national treasure) to forger (selling own work). The framework's **second-order-authenticity** explains this: the objects ceased to be "Vermeers" (national treasures) and became "Van Meegerens" (evidence of crime/skill). This reduced the severity of the crime (no national treasure lost) and altered the public narrative.
  *   **Exhibition as Forgeries:** The paintings were not discarded because they retained **manifest-feature value** and acquired new **second-order provenance-value**. They are now genuine artifacts of 20th-century deception. The framework explains this preservation as a rational shift in evaluative kind, not a contradiction.

  ### 3. Silence and Distortion

  While useful, the framework has limitations when applied to the full complexity of the case.

  *   **Theory-Laden Perception:** The framework assumes **manifest-feature value** is stable ("visually perceptible thing"). However, art history suggests experts may have *seen* the brushwork as "masterful" only because they believed it was Vermeer. If the framework assumes manifest value is independent of attribution, it may distort the reality that aesthetic perception is often cognitively penetrated by provenance beliefs.
  *   **Moral and Political Valence:** The framework treats value abstractly. It struggles to capture the specific moral weight of Göring's ownership. The "value" lost there wasn't just provenance; it was the moral taint of Nazi ownership. The framework's "provenance-value" category is too neutral to capture the negative value of immoral ownership history.
  *   **Legal Categories:** The shift from treason to forgery was a legal maneuver, not just an aesthetic reclassification. The framework explains the *artistic* reclassification well but is silent on the *legal* mechanics of cultural property laws that defined "national treasure" based on attribution.
  *   **Market Trust:** The framework explains the drop in value via lost provenance. It is less clear on the collapse of *trust* in the expert system itself. The "derivative trust-value" mentioned in the framework is under-theorized; the scandal damaged the value of *all* attributions, not just this canvas.

  ### 4. Two-Directional Test

  This section evaluates the framework's robustness based on the case.

  *   **Does it confirm provenance-value is distinct?**
      *   *Yes.* The drastic shift in esteem and price upon confession, despite unchanged visual features, confirms that **provenance-value** is a distinct component from **manifest-feature value**. Your friend's claim that "only a story" is lost is refuted; the story *constitutes* a specific category of value (provenance) that rational agents pursue.
  *   **Does it show manifest-feature value is less independent than assumed?**
      *   *Yes (Awkward Lesson).* The initial acclaim suggests experts saw the manifest features *through* the lens of attribution. If the framework insists manifest value is purely perceptual, it distorts the phenomenology of expert viewing. This is an **awkward** lesson: the framework needs to acknowledge that manifest-value assessments are often epistemically dependent on provenance beliefs, even if the features themselves are physical.
  *   **Does second-order authenticity rescue too much?**
      *   *Yes (Fatal Lesson).* If every exposed forgery becomes a "genuine forgery" with its own provenance-value, the distinction between original and fake risks collapsing into a difference of narrative. A bad forgery could claim "second-order authenticity" as a genuine bad forgery. This is a **fatal** flaw if not constrained. The framework must specify that second-order authenticity requires *significant* historical impact (like Van Meegeren's), not merely the fact of being a fake. Otherwise, it validates all failures as successes of a different kind.

  **Ranking of Lessons:**
  1.  **Fatal:** The over-generosity of Second-Order Authenticity (needs constraint to avoid validating all fakes).
  2.  **Awkward:** The interdependence of Manifest Value and Attribution (perception is theory-laden).
  3.  **Confirmed:** The distinctness of Provenance Value (validates your position against your friend).

  **Concession vs. Rejection:**
  *   *Concede:* You should concede that manifest-feature value is not purely perceptual; expert vision is trained and theory-laden.
  *   *Reject:* You should reject your friend's claim that provenance is merely "snobbery." The framework confirms it is a distinct rational value.
  *   *Modify:* You must modify your own view to accept that "Second-Order Authenticity" is not automatic; a forgery must earn its new status through historical significance, not just exposure.

  ### 5. Epistemic Audit

  To conclude, we must separate settled knowledge from live controversy.

  *   **Settled Common Knowledge:**
      *   It is settled that the *Supper at Emmaus* was painted by Van Meegeren and not Vermeer.
      *   It is settled that the market price and art-historical status collapsed upon this revelation.
      *   It is settled that the paintings were preserved and reclassified rather than destroyed.
      *   Consensus holds that forgery involves an intent to deceive regarding provenance.

  *   **Live Controversies:**
      *   **Perceptual Experience:** It is contested whether exposure changes the *actual visual experience* (phenomenology) or only the *judgment* of value. Some argue you literally see it differently; others say you see the same thing but value it less.
      *   **Rationality of Provenance-Value:** It is contested whether valuing provenance is rational (as you argue) or merely social convention/snobbery (as your friend argues). The framework supports the rationality view, but this remains a philosophical debate.
      *   **Artistic vs. Aesthetic Value:** It is contested whether a forgery can be *aesthetically* equal but *artistically* inferior. The framework distinguishes manifest (aesthetic) from provenance (artistic/historical), but whether these can be fully separated is live.

  *   **Interpretations vs. Entailments:**
      *   *Entailment:* The framework entails that the value drop is due to lost provenance-value.
      *   *Interpretation:* My claim that expert perception was "theory-laden" is an interpretation added to critique the framework, not a strict entailment of the framework itself.
      *   *Interpretation:* The classification of the "Second-Order Authenticity" risk as "fatal" is a philosophical judgment, not a logical necessity of the framework.

  **Conclusion for Your Argument:**
  The framework supports your resistance to your friend. The loss upon exposure is not merely a "label"; it is the loss of **provenance-value**, a distinct and rationally pursueable good. However, you must concede that the object is not worthless; it acquires **second-order authenticity**. The stalemate is broken: your friend is wrong that *nothing* but a story changes (provenance value is real), but you are wrong if you imply the object becomes valueless (it becomes a different kind of valuable object).
