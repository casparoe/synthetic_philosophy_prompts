  Here is the uncomfortable truth I've been sitting with. To hold leaders accountable for starting a war, the Allies needed a charge that didn't really exist before. If they stood up and said, "We are making this rule up right now," the whole thing looks like victory vengeance. It loses its moral weight. So, they had to perform the trial as if the law had always been there, waiting to be found. They had to wear the mask of discovery.

  This disguise was necessary, but it came at a cost. It taught us that justice sometimes requires a kind of fiction to survive. The judges knew they were building the bridge while walking on it. But the audience—the world watching—was told the bridge was solid stone. When we hide the construction of justice, we risk making the law seem like something distant, something handed down rather than something we build together. We traded transparency for legitimacy. That is a heavy price. It suggests that sometimes, for the sake of the greater good, we agree not to look too closely at the machinery. And when we stop looking at the machinery, we stop owning it. We let the law become a magic trick instead of a tool. The legacy of those trials is not just that monsters were punished. It is that we accepted a story about law being found rather than made. We accepted that moral authority might depend on a kind of collective silence about how the rules were actually born. When justice hides its own construction, it becomes something done to us, not something we do.

  So why does this matter here, in this room, tonight? Because this legal-aid society does the opposite of that old performance. When you walk through those doors seeking help, nobody pretends the law is perfect or that it was always on your side. We admit the system is built by people, and sometimes it needs fixing. We don't hide the wiring. This workshop isn't about worshipping the past; it's about understanding how justice is made. Real justice doesn't need to hide its tools. It admits when it is stretching to reach something new. Whether you are a lawyer filing a brief or a neighbor helping a family fill out a form, you are participating in honest construction. You aren't pretending the rules are ancient stone; you are showing that they are living things that need care. In this work, the authority comes from honesty, not from hiding the seams. We show that the law belongs to everyone, not just the judges in the high chairs. This clinic knows that the law is often broken for the poor before it is ever applied. We don't pretend otherwise. We pick up the pieces. We acknowledge the construction so we can repair it. That is the difference between a performance of power and the practice of care.

