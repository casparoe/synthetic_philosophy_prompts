answer: |-
  The summary your friend provided closely mirrors the argument made by Steven Pinker in *The Better Angels of Our Nature*, as well as the work of historical criminologists like Manuel Eisner and political scientists like Joshua Goldstein. This is known as the "Decline of Violence" thesis.

  To answer your question, we need to separate the **empirical claims** (what the data says) from the **explanatory claims** (why it happened) and the **normative claims** (what it means morally). Defenders of the thesis would endorse the broad strokes of your friend's summary but would introduce significant nuance regarding the data's scope and the moral interpretation.

  Here is an analysis of what defenders accept, where the summary conflates or overstates, and whether the moral conclusion holds.

  ### 1. What Defenders Accept as Accurate
  Defenders of the decline thesis would validate the following core components of your friend's summary:

  *   **Per Capita Measurement:** Defenders insist that absolute numbers are misleading when comparing eras with vastly different population sizes. They argue that the *rate* of violent death (deaths per 100,000 people) is the correct metric for assessing the "risk" of violence an individual faces. By this metric, they argue, the 20th century (even including both World Wars) was less violent than the Stone Age or the Middle Ages.
  *   **The Pre-Modern Baseline:** They accept the anthropological and archaeological consensus that hunter-gatherer and early agrarian societies had significantly higher rates of lethal violence (both homicide and warfare) than modern states.
  *   **The Mechanisms of Decline:** The summary correctly identifies the "Big Three" drivers often cited by proponents:
      1.  **The Leviathan:** The monopolization of force by centralized states reduces feuding and vendettas.
      2.  **Gentle Commerce:** Trade makes other people more valuable alive than dead, incentivizing cooperation over plunder.
      3.  **The Expanding Circle:** (A term from Peter Singer) The growth of empathy and cosmopolitanism reduces dehumanization.
  *   **The "Long Peace":** Defenders emphasize that despite the visibility of modern conflict, the rate of interstate war and battle deaths has declined significantly since 1945.

  ### 2. Conflations, Nuances, and Overstatements
  Your friend's summary simplifies several complex debates. Defenders would likely clarify the following points, while critics would argue these are fatal flaws.

  **A. "Sustained Decline" vs. "Jagged Trend"**
  *   **The Conflation:** The summary implies a smooth downward curve.
  *   **The Reality:** Defenders acknowledge the decline is not linear. There were massive spikes in the mid-20th century. The thesis is not that violence disappears, but that the *baseline* has shifted downward and the *recovery* from spikes is faster.
  *   **The Overstatement:** Claiming the evidence for fewer battlefield deaths carries over to "violence more broadly" is the weakest empirical link. Data on battle deaths is relatively robust (for the last century or two). Data on historical homicide is decent (via court records). However, data on **non-lethal violence** (assault, domestic abuse, child beating, rape) is notoriously sparse for pre-modern eras. Defenders argue these likely declined in tandem with homicide, but they admit this is an inference, not a direct measurement.

  **B. The Nature of State Violence**
  *   **The Conflation:** The summary treats "centralized states" as purely pacifying.
  *   **The Reality:** While states reduce interpersonal homicide (feuds), they create the capacity for **industrialized state violence** (genocide, democide, totalitarian purges). The decline thesis counts these deaths in the totals and argues they are still outweighed by the reduction in anarchy. However, this changes the *character* of violence from decentralized/chotic to centralized/systematic.
  *   **The Nuance:** A defender would argue that while states *can* kill more efficiently, they generally kill *less frequently* than the sum of warlords and feuding clans they replace.

  **C. Geographic and Demographic Variance**
  *   **The Overstatement:** The summary implies a global uniformity.
  *   **The Reality:** The decline was earliest and steepest in Western Europe. Many regions (e.g., parts of Latin America or conflict zones in the Global South) have homicide rates comparable to medieval Europe. The "global" average is often skewed by the stability of the Global North.

  ### 3. Does the Moral Conclusion Follow?
  This is the crux of your skepticism. Even if we accept the corrected empirical version (rates of lethal violence are down, but non-lethal data is spotty, and state violence has changed character), does it follow that contemporary life is "less violent in the sense that matters morally"?

  This depends entirely on your ethical framework.

  **The Utilitarian Case (Yes, it follows)**
  If you view violence morally primarily through the lens of **suffering and death**, the conclusion holds. If fewer people are being killed, tortured, or beaten per capita, then the aggregate amount of suffering has decreased. From this view, the population adjustment is morally necessary because saving a life in a world of 1 billion is statistically equivalent to saving a life in a world of 10 million; the moral value of the individual remains constant.

  **The Deontological/Rights-Based Case (Not necessarily)**
  If you view violence through the lens of **rights, dignity, and justice**, the conclusion is shakier.
  *   **Institutionalized Cruelty:** A society might have a low homicide rate but maintain slavery, brutal prisons, or systemic oppression. The *rate* of violence might be low, but the *legitimization* of violence against specific groups might be higher. (e.g., A peaceful slave society vs. a violent free society).
  *   **The Quality of Violence:** Critics argue that modern violence is often more psychological, structural, or bureaucratic. The "sanitization" of war (drones, remote bombing) lowers combatant death rates but may detach killing from moral responsibility.
  *   **Existential Risk:** A utilitarian calculation of *past* deaths ignores the *potential* for future annihilation. The fact that we have nuclear weapons means that while the *rate* of violence is low, the *stakes* are infinitely higher. A single error could produce a death toll that no population adjustment could minimize.

  **The "Violence Broadly" Problem**
  You asked if the evidence for battlefield deaths carries over to violence more broadly.
  *   **Empirically:** There is a strong correlation between societal lethality and non-lethal aggression, but they are not identical. A society can reduce murders while maintaining high rates of domestic assault or police brutality.
  *   **Morally:** If "violence that matters morally" includes the threat of violence, the degradation of dignity, or structural violence (poverty caused by coercive systems), then a decline in body counts does not automatically equate to moral progress.

  ### Summary Verdict
  Your friend's summary is a **faithful representation of the popularized thesis**, but it glosses over the data gaps regarding non-lethal violence and the shift in the *type* of violence (from interpersonal to state-organized).

  *   **Accept:** The long-term decline in the *risk* of violent death (per capita) is well-supported by evidence.
  *   **Question:** The generalization to all forms of violence (including non-lethal) and the assumption that state pacification is morally unambiguous.
  *   **Moral Conclusion:** The conclusion follows **only if** you define moral progress primarily as the minimization of physical suffering and premature death. If you define it via autonomy, justice, or the absence of structural coercion, the decline in homicide rates is a necessary but insufficient condition for moral progress.

  Your hesitation is well-founded: knowing that we are less likely to be killed than our ancestors does not necessarily prove we are more ethical, only that we are more efficient at pacification and perhaps more risk-averse.
