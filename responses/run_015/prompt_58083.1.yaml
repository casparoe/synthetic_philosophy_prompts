      *   *Claim 3: Even large absolute death tolls of the 20th century remain low once adjusted for population.* -> This is a core statistical argument of the thesis (per capita rates).
      *   *Claim 4: Contemporary life is less violent in the sense that matters morally.* -> This is the normative conclusion.

  3.  **Evaluate Accuracy vs. Conflation/Overstatement (The "Defender's View" vs. "Critique"):**
