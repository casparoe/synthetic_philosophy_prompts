      *   *Paragraph 2: Defending the Base Rate vs. Inside View.* Address the "adaptability" argument. Adaptability is a hypothesis, not a data point. Unless you can show a base rate of "constitutional frameworks surviving AI-driven labor substitution in hegemonic powers," invoking the 250-year history is just storytelling. The outside view isn't about ignoring structure; it's about recognizing that our confidence in structural exceptions is usually overcalibrated. Until you can quantify the protective effect of "liberal hegemony" against this specific dual shock, the base rate of the closest analog stands.

