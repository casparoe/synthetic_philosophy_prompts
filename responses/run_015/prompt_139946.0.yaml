prompt: |-
  Hi. I sit on the review panel for a new interdisciplinary call at our foundation (working title something like "Origins of Mind and Society" — the scope is roughly: how you get cognition, cooperation and culture out of stuff that has none of it). We see about forty proposals a cycle, from physicists, developmental psychologists, anthropologists, ML people, and at least one person per round who has discovered that everything is really a resonance. My job is to attach a one-page "explanatory adequacy" note to each proposal, and I have maybe twenty minutes per proposal, no way to ask proposers for clarifications (it's blind), and a panel chair who is a cell biologist and will visibly loose patience if I say anything that sounds like jargon. Each proposal is around 1.5M over four years, and I have to be able to defend the note if a rejected PI complains.

  What I want is a decision procedure I can run, not an essay. The ideas to operationalize are Dennett's: cranes versus skyhooks, and the complaint about greedy reductionism — the move where you "explain" something by jumping straight to the bottom level and skipping the middle ones. My panel basically agrees with both when I describe them in plain words, and both are useless to me as stated, because nobody writes a proposal that says "and then a skyhook happens."

  So: give me an ordered set of gates, each with (a) the question to ask of the proposal text as written, (b) what counts as a sufficient answer, (c) where I stop with a no, and (d) where I hand the decision to the panel because it's a values call rather than a factual one — risk appetite, whether we're funding techniques or answers, that kind of thing. Verdicts should come from a short fixed list I can put in a dropdown, and the output should include the one objection I'd have to raise if the PI appealed.

  Two bits of vocabulary I've half-invented and been using on my own — keep them if they're worth keeping, tell me plainly if they're confused:

  - "Ghost crane": a proposal that looks like a mechanism because it's written in mechanism language, but whose moving parts are credited with exactly the competence that was supposed to be explained, just at a smaller scale, an earlier time, or a lower level. My rough test is that you can substitute the word for the thing-to-be-explained into the description of the part without anything changing.
  - "Handoff debt": every crane has to be handed off from the level below it — somewhere you have to say how the dumber parts do the work. Declared debt (they say roughly who will pay it and when) I'm happy to fund against. Hidden debt is where I think greedy reductionism actually lives.

  Other tests I've been fiddling with and can't get to behave: a look-ahead test (does the mechanism need the end state specified in advance in order to work at all?), an unplugging test (if the crane is removed, does the capacity degrade gradually or does the whole thing vanish?), and some rule about what the lower-level story predicts that the upper-level story doesn't — if the answer is "nothing", why go down there? Consolidate these, drop them, or replace them as you see fit, but be explicit about which distinctions have to survive for the procedure to still be tracking the real idea and which ones are only conveniences.

  Then run it properly on three proposals (treat these as one-page summaries):

  1. A physicist proposes a new variational principle — call it "coherence maximization" — that governs open systems, and claims it explains both the origin of life and the evolution of cooperation, with a proposed experimental signature in thermodynamic efficiency.
  2. A group proposes to explain a large, well-documented social trend (your pick: the long decline in interpersonal violence, or the fertility transition) with a story about a neuromodulator, plus a design that measures proxies for it in a modern population.
  3. One from my own lab, which is why I'm asking: we want money to model children's word learning as Bayesian inference over a hypothesis space of candidate meanings. I think it's a crane. I suspect your procedure is going to tell me the hypothesis space is a ghost crane and that the actual explanatory work is somewhere we haven't done it. If that's what it says, say so, and say what a version of the project that passes would look like.

  Also show me the procedure declining to give a verdict: e.g. a proposal that just wants to build a large descriptive model of collective behaviour from video data and claims to explain nothing. I don't want to force those into the frame.

  Finally, be honest about where the procedure misfires. I'm most worried about (i) genuinely new phenomena where nobody yet knows what the levels are, (ii) proposals that are right but badly written, and (iii) me using "skyhook" as a fancy way of saying "I definately don't like this guy."
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Review panel for an interdisciplinary foundation call ("Origins of Mind and Society"). ~40 proposals/cycle. Budget ~1.5M/4yrs.
      *   **User Role:** Panelist needing a 1-page "explanatory adequacy" note per proposal. 20 mins/proposal. Blind review. No clarifications. Chair is a cell biologist (hates jargon). Need to defend against appeals.
      *   **Core Concepts to Operationalize:** Dennett's "Cranes vs. Skyhooks" and "Greedy Reductionism."
      *   **User's Invented Vocabulary:** "Ghost Crane" (mechanism language but competence assumed), "Handoff Debt" (missing link between levels).
      *   **User's Struggling Tests:** Look-ahead, Unplugging, Lower-level prediction.
      *   **Deliverables:**
          1.  An ordered set of gates (Decision Procedure).
          2.  Specifics for each gate: Question, Sufficient Answer, Stop/No condition, Handoff to Panel condition.
          3.  Fixed list of verdicts (dropdown).
          4.  Specific output for appeals (one objection).
          5.  Evaluation of user's vocabulary ("Ghost Crane", "Handoff Debt").
          6.  Evaluation/Consolidation of user's struggling tests.
          7.  Application to 3 specific proposals (Physicist, Social/Neuro, User's Lab).
          8.  Application to a "Descriptive Only" proposal (Procedure declines verdict).
          9.  Honesty about failure modes (New phenomena, bad writing, bias).

  2.  **Deconstruct the Core Concepts:**
      *   *Cranes:* Mechanisms built from below that lift explanation up. Requires intermediate steps.
      *   *Skyhooks:* Miraculous leaps from bottom to top without support.
      *   *Greedy Reductionism:* Skipping levels. Saying "it's just physics" without showing *how* physics becomes psychology.
      *   *Ghost Crane:* Looks like a crane, but the parts are just mini-versions of the whole (homunculus problem).
      *   *Handoff Debt:* Acknowledging the gap between levels.

  3.  **Refine the Vocabulary & Tests:**
      *   *Ghost Crane:* Keep it. It's a precise definition of a homuncular fallacy disguised as mechanism.
      *   *Handoff Debt:* Keep it. It distinguishes "we know we don't know" (fundable) from "we pretend we know" (fatal).
      *   *Look-ahead (Teleology):* Does the mechanism require the goal to exist beforehand? If yes -> Skyhook.
      *   *Unplugging (Necessity):* If removed, does function vanish or degrade? Helps distinguish core mechanism from correlation.
      *   *Lower-level Prediction:* Does the lower level predict something the upper level doesn't? If no -> Epiphenomenal/Greedy.

      *Decision:* Consolidate "Look-ahead" into Gate 2 (Competence). Consolidate "Unplugging" into Gate 3 (Dependency). Consolidate "Lower-level Prediction" into Gate 4 (Novelty/Yield).

  4.  **Drafting the Decision Procedure (The Gates):**
      *   *Goal:* 20 minutes. Needs to be fast.
      *   *Gate 1: The Target.* Is there actually something to explain? (Avoids funding description masquerading as explanation).
      *   *Gate 2: The Ghost Check.* (User's "Ghost Crane"). Is the mechanism just the phenomenon in disguise?
      *   *Gate 3: The Handoff.* (User's "Handoff Debt"). Is the link between levels specified or acknowledged?
      *   *Gate 4: The Yield.* Does going down a level buy us anything new? (Anti-greedy reductionism).

      *Verdicts:* Needs to be a fixed list.
      1.  Fundable Explanation (Cranes present, debt managed).
      2.  Fundable Exploration (Debt acknowledged, high risk).
      3.  Skyhook (Mechanism missing).
      4.  Ghost Crane (Circular competence).
      5.  Greedy Reduction (Levels skipped, no yield).
      6.  No Explanatory Claim (Descriptive only).

      *Appeal Objection:* Must be specific to the gate failed.

  5.  **Evaluating the "Descriptive Only" Case:**
      *   The procedure needs an "Exit Early" option. If the proposal admits it's descriptive, it shouldn't fail the explanation gates. It should be routed to a "Methods/Data" track or rejected based on scope mismatch (if the call *requires* explanation). The prompt says the call is "Origins...", implying explanation is required. So a descriptive proposal is a "Scope Mismatch."

  6.  **Running the Procedure on the 3 Proposals:**
      *   *Proposal 1 (Physicist/Coherence):* Likely a Skyhook or Greedy Reduction. "Coherence maximization" sounds like a law that does the work for you.
      *   *Proposal 2 (Neuro/Social):* Likely Greedy Reduction or Ghost Crane. Neuromodulator -> Social Trend is a huge gap. Is the neuromodulator just a label for the social trend?
      *   *Proposal 3 (User's Lab/Bayesian):* User suspects Ghost Crane. Bayesian inference often assumes the hypothesis space is pre-structured. If the space is the explanation, it's a Ghost Crane. To pass, need to explain *how* the space is constructed (Handoff Debt).

  7.  **Addressing Failure Modes:**
      *   New phenomena (levels unknown): Procedure might flag as "Skyhook" unfairly. Need a "Frontier" exception.
      *   Bad writing: Might look like "Hidden Debt." Need to distinguish clarity from substance.
      *   Bias: "Skyhook" is subjective. Need to anchor it in the text.

  8.  **Refining the Output Structure:**
      *   Start with the Vocabulary Check (Keep/Toss).
      *   Present the Decision Procedure (The Gates).
      *   Show the Verdict List.
      *   Run the 3 Proposals.
      *   Run the "Descriptive" Proposal.
      *   End with Failure Modes/Honesty.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is 20 minutes enough for 4 gates?
      *   *Fix:* Make the questions binary where possible.
      *   *Critique:* The Chair is a cell biologist.
      *   *Fix:* Ensure the "Appeal Objection" is plain English, no Dennett jargon.
      *   *Critique:* User's "Look-ahead" test.
      *   *Fix:* Integrate it into Gate 2 (Ghost Crane). If the part knows the whole, it's a ghost.
      *   *Critique:* User's "Unplugging" test.
      *   *Fix:* Integrate into Gate 3 (Handoff). If the lower level doesn't constrain the upper, it's decorative.

      *Refining the "Descriptive" case:* If the call is for "Origins," a descriptive proposal is technically out of scope. But the user asked to see the procedure *decline* to give a verdict. So I will add a "Gate 0" that filters for Explanatory Intent. If missing, procedure stops.

      *Refining Proposal 3:* I need to be honest with the user. Bayesian modeling of word learning *is* often criticized for assuming the hypothesis space. I need to show how to fix it (e.g., learning the priors, or social scaffolding).

  10. **Final Review against constraints:**
      *   One-page note style? (The procedure generates the note).
      *   Dropdown verdicts? (Included).
      *   Appeal objection? (Included for each case).
      *   Honesty about misfires? (Included).

      *(Self-Correction on Vocabulary)*: "Ghost Crane" is excellent. "Handoff Debt" is excellent. Keep them. They are operational.
      *(Self-Correction on Tests)*: "Look-ahead" is essentially checking for pre-existing competence (Ghost Crane). "Unplugging" is checking for causal necessity (Handoff). "Lower-level prediction" is checking for Yield. I will map these explicitly.

      *(Final Polish)*: Ensure tone is professional, direct, and respectful of the user's expertise while providing the requested structure.

      *(Wait, one detail)*: The user asked for the output to include the one objection for appeals. I need to make sure that's clear in the procedure application.

      *(Wait, another detail)*: "Show me the procedure declining to give a verdict." I need to make sure Gate 0 handles this.

      *(Wait, Proposal 2)*: "Neuromodulator + Social Trend." This is classic greedy reductionism unless they bridge the scale gap. I'll flag that.

      *(Wait, Proposal 1)*: "Variational Principle." This is often a Skyhook if it claims to *cause* the organization without a mechanism for selection.

      Let's assemble.

      *Structure:*
      1. Vocabulary Audit.
      2. The Decision Procedure (Gates 0-4).
      3. The Verdict Dropdown.
      4. Application to Proposals 1, 2, 3.
      5. Application to Descriptive Proposal.
      6. Failure Modes.

      *Tone:* Collaborative, rigorous, pragmatic.

      *Let's write.*
answer: |-
  ### Part 1: Vocabulary Audit

  Your invented terms are excellent. They are operational, distinct, and map directly onto the philosophical problems without requiring the panel to read Dennett.

  *   **Ghost Crane:** **Keep.** It precisely identifies the homunculus fallacy disguised as mechanism. It is better than "circular reasoning" because it allows for multi-stage models that still cheat.
  *   **Handoff Debt:** **Keep.** It distinguishes *ambition* (we will bridge this gap) from *negligence* (we pretend the gap doesn't exist). This is crucial for funding high-risk interdisciplinary work.

  **Consolidation of your "fiddling" tests:**
  *   **Look-ahead:** Fold this into **Gate 2 (Ghost Crane)**. If the mechanism requires the end-state to function, the competence is already present in the parts.
  *   **Unplugging:** Fold this into **Gate 3 (Handoff)**. If removing the lower-level mechanism doesn't break the upper-level function in the model, the handoff is decorative.
  *   **Lower-level Prediction:** Rename to **Yield**. This becomes **Gate 4**. If the lower level predicts nothing the upper level didn't, it's greedy reductionism.

  ---

  ### Part 2: The Decision Procedure (The 5 Gates)

  **Time Budget:** 20 Minutes.
  **Instruction:** Read the Specific Aims and Methodology sections first. Ignore the bibliography.

  #### Gate 0: Explanatory Intent
  *   **(a) Question:** Does the proposal claim to explain *how* a phenomenon arises, or only *that* it exists/correlates?
  *   **(b) Sufficient Answer:** Explicit claim of mechanism, origin, or causal pathway.
  *   **(c) Stop/No:** If the proposal is purely descriptive, correlational, or taxonomic.
  *   **(d) Handoff:** None. This is a scope check.
  *   **Action:** If **No**, stop. Verdict: **Scope Mismatch (Descriptive)**.

  #### Gate 1: The Target Phenomenon
  *   **(a) Question:** Is the thing being explained (the *explanandum*) clearly defined and distinct from the mechanism proposed?
  *   **(b) Sufficient Answer:** "We explain X (e.g., cooperation)" using "Y (e.g., reciprocity algorithms)." X and Y are not synonyms.
  *   **(c) Stop/No:** If the phenomenon is defined by the mechanism (e.g., "We explain cooperation using the cooperation gene").
  *   **(d) Handoff:** If the phenomenon is vague but the mechanism is solid, pass to Gate 2 but note "Target Ambiguity."
  *   **Action:** If **No**, Verdict: **Tautology**.

  #### Gate 2: The Ghost Crane Check
  *   **(a) Question:** Do the proposed parts possess the competence they are supposed to produce? (Substitution Test: Can I replace the part's description with the phenomenon's name without breaking the sentence?)
  *   **(b) Sufficient Answer:** The parts are "dumber" than the whole. (e.g., Neurons don't "know" words; they fire.)
  *   **(c) Stop/No:** If the parts are "mini-minds," "pre-wired for X," or "resonate with truth."
  *   **(d) Handoff:** If the competence is borderline, pass to Gate 3 but flag "High Ghost Risk."
  *   **Action:** If **No**, Verdict: **Ghost Crane**.

  #### Gate 3: The Handoff Debt Audit
  *   **(a) Question:** Is the transition from the lower level (physics/biology) to the higher level (mind/society) specified or acknowledged as a gap?
  *   **(b) Sufficient Answer:** Either a concrete bridge mechanism is proposed, OR the proposal explicitly states "We assume X to focus on Y" (Declared Debt).
  *   **(c) Stop/No:** If the proposal jumps levels without comment (Hidden Debt). (e.g., "Quantum effects cause culture" with no intermediate steps).
  *   **(d) Handoff:** If the debt is declared but the plan to pay it is weak, this is a **Risk** call, not a factual error.
  *   **Action:** If **No**, Verdict: **Greedy Reduction**. If **Yes (Declared)**, proceed to Gate 4.

  #### Gate 4: The Yield Test
  *   **(a) Question:** Does modeling this at the lower level predict or constrain something the higher-level description does not?
  *   **(b) Sufficient Answer:** Yes. (e.g., "The neural model predicts a reaction time lag the behavioral model misses.")
  *   **(c) Stop/No:** If the lower level is just a re-description of the upper level.
  *   **(d) Handoff:** If the yield is speculative but plausible, this is a **Values** call (Technique vs. Answer).
  *   **Action:** If **No**, Verdict: **Epiphenomenal**. If **Yes**, Verdict: **Fundable**.

  ---

  ### Part 3: The Verdict Dropdown

  Select one for the final note. These map to appeal defenses.

  1.  **Fundable (Mechanism)**: Gates 0-4 passed. Low debt, clear yield.
  2.  **Fundable (Exploration)**: Gates 0-3 passed, Gate 4 weak. High risk, declared debt.
  3.  **Scope Mismatch (Descriptive)**: Failed Gate 0.
  4.  **Rejection (Tautology)**: Failed Gate 1.
  5.  **Rejection (Ghost Crane)**: Failed Gate 2. (Competence assumed in parts).
  6.  **Rejection (Greedy Reduction)**: Failed Gate 3. (Hidden handoff debt).
  7.  **Rejection (Epiphenomenal)**: Failed Gate 4. (No new predictions).

  **Appeal Objection Field:** (Auto-generated based on Verdict)
  *   *Template:* "The proposal asserts [X] explains [Y], but the text attributes [Y]'s core competence to [X] without specifying the mechanism of transfer." (Tailor to specific verdict).

  ---

  ### Part 4: Procedure Application

  #### Proposal 1: The Physicist ("Coherence Maximization")
  *   **Gate 0:** Claims to explain origin of life/cooperation. **Pass.**
  *   **Gate 1:** Target is "organization." Mechanism is "variational principle." **Pass.**
  *   **Gate 2:** Does "coherence maximization" require the system to already seek coherence? Yes. It attributes a goal (maximization) to open systems without a selector. **Fail.**
  *   **Gate 3:** Jumps from thermodynamics to cooperation. No intermediate selection mechanism. **Fail.**
  *   **Verdict:** **Rejection (Ghost Crane)**.
  *   **Appeal Objection:** "The proposal attributes goal-directed behavior ('maximization') to physical systems without specifying a selection mechanism that distinguishes this from standard entropy."
  *   **Note to Chair:** "It uses math to hide a skyhook. The principle doesn't build the crane; it assumes the crane is already standing."

  #### Proposal 2: The Neuro-Social Group (Neuromodulator -> Violence Decline)
  *   **Gate 0:** Explains social trend. **Pass.**
  *   **Gate 1:** Target: Violence decline. Mechanism: Neuromodulator levels. **Pass.**
  *   **Gate 2:** Do neuromodulators "know" about social norms? No. **Pass.**
  *   **Gate 3:** Handoff from molecule to societal trend over centuries. Is the bridge declared? They propose measuring proxies in a *modern* population. They are ignoring the historical/cultural transmission layer. **Fail (Hidden Debt).**
  *   **Verdict:** **Rejection (Greedy Reduction)**.
  *   **Appeal Objection:** "The proposal skips the cultural transmission layer required to scale a molecular proxy to a multi-generational social trend."
  *   **Note to Chair:** "They are measuring the brick and claiming it explains the cathedral. They need a plan for how the brick gets stacked."

  #### Proposal 3: Your Lab (Bayesian Word Learning)
  *   **Gate 0:** Explains word learning. **Pass.**
  *   **Gate 1:** Target: Word meaning. Mechanism: Bayesian inference. **Pass.**
  *   **Gate 2:** **Critical Fail.** Where does the "hypothesis space of candidate meanings" come from? If the child can generate the space, they already have the concepts. The space is a Ghost Crane.
  *   **Gate 3:** Handoff from "math" to "child's mind." Usually hidden in these models.
  *   **Verdict:** **Rejection (Ghost Crane)** — *unless modified.*
  *   **How to Fix (To Pass):** You must fund the *construction of the hypothesis space*, not just the inference over it.
      *   *Revision:* "We model how social scaffolding *restricts* the hypothesis space, making Bayesian inference tractable."
      *   *New Verdict:* **Fundable (Exploration)**.
      *   *Appeal Objection (if rejected as is):* "The model assumes the learner can generate the candidate meanings, which is the competence the project claims to explain."

  #### Proposal 4: The Descriptive Model (Video Data Collective Behaviour)
  *   **Gate 0:** Claims to "model collective behaviour from video data." Aims section says "characterize patterns," not "explain origin."
  *   **Action:** **Stop.**
  *   **Verdict:** **Scope Mismatch (Descriptive)**.
  *   **Appeal Objection:** "The call requests explanatory mechanisms for origins; this proposal offers descriptive taxonomy of outcomes."
  *   **Note:** Do not run Gates 1-4. You cannot judge the explanatory adequacy of a project making no explanatory claims. It is not a bad explanation; it is not an explanation.

  ---

  ### Part 5: Failure Modes & Honesty

  You asked where this misfires. Here is the risk assessment for your panel note.

  **1. The "Frontier" Problem (Unknown Levels)**
  *   **Risk:** A genuinely new field (e.g., quantum biology in cognition) may not have established levels. Gate 3 (Handoff) will flag this as "Hidden Debt."
  *   **Mitigation:** Use Verdict **Fundable (Exploration)**. If the proposal explicitly says "We do not know the levels, we are mapping them," that counts as *Declared Debt*.
  *   **Bias Check:** If you reject a frontier proposal as "Greedy Reduction," ensure you aren't punishing novelty. Ask: "Is the debt hidden, or is the map just blank?"

  **2. The "Bad Writer" Problem**
  *   **Risk:** A brilliant proposal written opaquely may look like a Ghost Crane (Gate 2) because the competence of the parts isn't clearly limited.
  *   **Mitigation:** Look for *constraints*. Does the model break if the part is made dumber? If the text is vague, default to **Fundable (Exploration)** with a note: "Mechanism clarity required in Year 1." Do not Reject on Gate 2 unless the competence attribution is explicit.

  **3. The "I Don't Like This Guy" Problem (Skyhook Bias)**
  *   **Risk:** "Skyhook" is a slur in disguise. You might use Gate 2 to reject approaches you personally dislike (e.g., nativism vs. empiricism).
  *   **Mitigation:** The **Substitution Test** (Gate 2b) is your anchor. You must be able to show the sentence works if you swap the part for the whole. If you can't demonstrate the swap, you cannot vote Ghost Crane.
  *   **Chair Management:** If the Chair asks why you rejected, do not say "It's a skyhook." Say: "The proposal assumes the parts can do the job of the whole without explaining how they got that ability."

  **Summary for your Panel Note:**
  This procedure converts "explanatory adequacy" from a philosophical debate into a compliance check. It protects you from appeals because the objection is textual (e.g., "Section 2 attributes competence to Section 1 without a bridge"). It protects the Chair from jargon because the verdicts are plain English. It protects the Foundation from funding "resonance" people via Gate 2.

  **Final Advice:** For your own proposal (3), do not try to game the procedure. If the hypothesis space is unexplained, it *is* a Ghost Crane. Reframe the grant to focus on the *constraints* on that space (social, developmental, or structural). That turns the Ghost Crane into a declared Handoff Debt, which is fundable.
