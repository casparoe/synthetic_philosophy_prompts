answer: |-
  # The Separateness-of-Persons Decision Tree

  **Instructions:** Answer each question based on your immediate intuition about the case described. Do not worry about theoretical consistency; the tree maps the inconsistencies for you. There are eight questions in total.

  ### The Branch Questions

  **Q1 (The Burning Building):** A fire traps one person in Room A and five people in Room B. You control the ventilation. You can save the people in Room A or the people in Room B, but not both. No one is at fault for the fire. Do you save the five?
  *   **Yes:** Go to Q2.
  *   **No:** Go to Q7.

  **Q2 (The Painful Therapy):** A doctor proposes a treatment for *you*. It involves severe pain today but guarantees you a pain-free life starting tomorrow. Is the doctor permitted to impose this treatment on you without your consent?
  *   **Yes:** Go to Q3.
  *   **No:** Go to Q6. (Leaf: **Radical Individualism** — *Least comfortable commitment: You must endure preventable suffering even when it benefits your own future self.*)

  **Q3 (The Stranger's Therapy):** A doctor proposes a treatment. It involves severe pain for *you* today but guarantees a *stranger* a pain-free life starting tomorrow. Is the doctor permitted to impose this?
  *   **Yes:** Go to Q6.
  *   **No:** Go to Q4.

  **Q4 (The Forgetful Patient):** A doctor proposes a treatment. It involves severe pain for *you* today. The beneficiary is *you* in fifty years, but due to a medical condition, that future self will remember nothing of your current life, share none of your goals, and have a different personality. Is the doctor permitted to impose this?
  *   **Yes:** Go to Q5.
  *   **No:** Go to Leaf 3.

  **Q5 (The Split):** A person enters a machine that splits their psychology into two bodies. Both successors remember the original's life. Is it permitted to inflict pain on the original person so that *both* successors benefit?
  *   **Yes:** Go to Q6.
  *   **No:** Go to Leaf 4.

  **Q6 (The Leveler):** Everyone in society is happy, but some are much happier than others. We can reduce the happiness of the happiest people so that everyone is equal, but this will not make the unhappy people any happier (the total happiness drops). Is this permitted?
  *   **Yes:** Go to Leaf 5.
  *   **No:** Go to Q7.

  **Q7 (The Innocent Suspect):** A mob will kill five innocent people unless you hand over one innocent suspect (who will be executed). You are not the one lighting the fire (Q1); you are actively handing over the suspect. Do you hand them over?
  *   **Yes:** Go to Q8.
  *   **No:** Go to Leaf 6.

  **Q8 (The Reason):** In the case where you refused to hand over the suspect (or refused to save the five in Q1), is the wrongness primarily that the *total outcome* is worse, or that the *individual person* could reasonably object to being used?
  *   **Total Outcome:** Go to Leaf 7.
  *   **Individual Objection:** Go to Leaf 8.

  ---

  ### The Leaves (Positions & Commitments)

  **Leaf 1: Total Utilitarianism (Harsanyi Style)**
  *   **Address:** Q1(Yes) → Q2(Yes) → Q3(Yes) → Q4(Yes) → Q5(Yes) → Q6(No) → Q7(Yes).
  *   **Least Comfortable Commitment:** You must accept sacrificing an innocent person whenever the mathematical sum of benefits outweighs the loss, regardless of individual boundaries.
  *   **Note:** **Prioritarianism** lands here as well; the tree cannot distinguish them without asking about the *weight* of benefits to the worse-off rather than permission structures.

  **Leaf 2: [Empty Node: The Altruistic Self-Denier]**
  *   **Address:** Q1(Yes) → Q2(No).
  *   **Why Empty:** **Incoherent.** It is psychologically and rationally unstable to permit saving strangers (Q1) while forbidding sacrifice for one's own future self (Q2); this implies the self is less valuable than a stranger.

  **Leaf 3: The Psychological Unity View (Parfitian Reductionism)**
  *   **Address:** Q1(Yes) → Q2(Yes) → Q3(No) → Q4(No).
  *   **Ground:** **Unity Ground.**
  *   **Least Comfortable Commitment:** You must treat your future amnesiac self as a stranger, forbidding savings accounts or long-term planning that requires psychological connectedness.
  *   **Note:** This position ties the separateness objection to what unifies stages (memory/character).

  **Leaf 4: The Fission Restrictionist (Nozick-Adjacent)**
  *   **Address:** Q1(Yes) → Q2(Yes) → Q3(No) → Q4(Yes) → Q5(No).
  *   **Ground:** **Standpoint Ground.**
  *   **Least Comfortable Commitment:** You must treat the two successors as fully distinct persons, doubling the moral weight of their claims against the original, even though they share one history.
  *   **Note:** This position ties separateness to the number of distinct standpoints currently existing.

  **Leaf 5: Telic Egalitarianism**
  *   **Address:** Q1(Yes) → Q2(Yes) → Q3(Yes) → Q4(Yes) → Q5(Yes) → Q6(Yes).
  *   **Least Comfortable Commitment:** You must accept making everyone worse off simply to eliminate inequality, even if no one's complaint is relieved.
  *   **Note:** The **Levelling-Down Case** (Q6) successfully isolates this view but fails to distinguish between those who value equality intrinsically versus those who value it instrumentally for social stability.

  **Leaf 6: Rights Constraint Deontology (Nozick Style)**
  *   **Address:** Q1(Yes) → Q2(Yes) → Q3(No) → Q4(Yes) → Q5(No) → Q6(No) → Q7(No).
  *   **Least Comfortable Commitment:** You must let five people die rather than violate the bodily integrity of one innocent person, treating persons as inviolable ends.
  *   **Note:** This view relies on the **Standpoint Ground**; the discontinuity case (Q4) is permitted because the standpoint holder is the same biological organism, but fission (Q5) creates new constraints.

  **Leaf 7: Threshold Deontology (Unclaimed)**
  *   **Address:** Q1(Yes) → Q2(Yes) → Q3(No) → Q4(Yes) → Q5(No) → Q6(No) → Q7(Yes) → Q8(Total Outcome).
  *   **Least Comfortable Commitment:** You must admit that rights are real constraints but vanish when the disaster is large enough, without a clear principle for where the line is drawn.
  *   **Why Unclaimed:** Most theorists find this unstable; if outcomes justify violation at the threshold, they should justify it earlier (collapsing to Utilitarianism).

  **Leaf 8: Contractualism (Scanlon Style)**
  *   **Address:** Q1(No) → Q7(No) → Q8(Individual Objection).
  *   **Least Comfortable Commitment:** You must accept that a policy can be wrong even if it produces the best overall outcome, solely because one person has a reasonable ground for rejection.
  *   **Note:** This rests on the **Standpoint Ground**; the individual complaint trumps the aggregate good.

  **Leaf 9: Contractarianism (Rawls Style)**
  *   **Address:** Q1(No) → Q7(No) → Q8(Total Outcome).
  *   **Least Comfortable Commitment:** You must justify principles based on what would be chosen in a hypothetical agreement, even if actual individuals today would reasonably object to the result.
  *   **Note:** **Rawls** and **Scanlon** land at the same address here; the tree cannot pry them apart without asking about the *Veil of Ignorance* specifically versus *Actual Agreement*.

  **Leaf 10: Anti-Aggregationism (Taurek Style)**
  *   **Address:** Q1(No).
  *   **Least Comfortable Commitment:** You must flip a coin between saving one person and saving five, granting no extra weight to the greater number of lives saved.
  *   **Note:** The **Numbers Case** (Q1) does the discriminating work here, but fails to explain why Taurekians often still aggregate benefits *within* a life.

  **Leaf 11: [Empty Node: The Interlife Aggregator]**
  *   **Address:** Q1(Yes) → Q2(Yes) → Q3(Yes) → Q4(No).
  *   **Why Empty:** **Unattractive.** This view permits sacrificing you for a stranger (Q3) but forbids sacrificing you for your own amnesiac future (Q4). It values strangers over your own continuity, which contradicts the usual motive for aggregation.

  **Leaf 12: [Empty Node: The Fission Aggregator]**
  *   **Address:** Q1(Yes) → Q2(Yes) → Q3(No) → Q4(Yes) → Q5(Yes).
  *   **Why Empty:** **Unclaimed.** This view forbids sacrificing one person for another (Q3) but permits sacrificing one person for *two* successors of that person (Q5). It treats fission as a loophole to bypass the separateness constraint, which no major theory explicitly advocates.

  ---

  ### Seminar Notes on Structure and Discrimination

  **1. Separating the Two Grounds**
  The tree forces a distinction between the **Unity Ground** and the **Standpoint Ground** at **Q4 (The Forgetful Patient)**.
  *   **Leaf 3 (Psychological Unity)** rests on the *Unity Ground*. It forbids the sacrifice because the psychological ties that unify the life are broken. Compensation is only permitted where identity (in the psychological sense) holds.
  *   **Leaf 6 (Nozick)** and **Leaf 8 (Scanlon)** rest on the *Standpoint Ground*. They permit Q4 (same biological standpoint holder) but forbid Q3 (different standpoint holder). For them, the complaint belongs to the "person" defined by the standpoint, not the psychological stages.

  **2. The Fission Test (Q5)**
  This question tests the robustness of the Standpoint Ground.
  *   **Leaf 4** and **Leaf 6** treat the two successors as generating *two* separate constraints/complaints.
  *   **Leaf 1** treats them as a continuation of the original sum.
  *   This reveals whether the student views the "person" as a container of value (Utilitarian) or a source of claims (Deontological/Contractualist).

  **3. Limitations of Standard Cases**
  *   **The Numbers Case (Q1):** Often fails to distinguish **Taurek** from **Contractualists**. Both say "No." The tree separates them at Q8 (Reason for refusal).
  *   **The Levelling-Down Case (Q6):** Successfully isolates **Telic Egalitarianism**, but fails to distinguish it from **Prioritarianism** in non-lexical cases. Prioritarians also land at Leaf 1 because they accept the sacrifice if the weighted total is higher, whereas Telic Egalitarians accept it purely for equality.
  *   **Prioritarianism:** As noted in Leaf 1, this tree cannot structurally separate Prioritarianism from Total Utilitarianism without introducing a question about *diminishing marginal value* (e.g., "Is a benefit to a poor person worth more than the same benefit to a rich person?"). Since that introduces jargon ("benefit," "value"), it was omitted to keep the cases concrete. They share an address.

  **4. Empty Nodes**
  *   **Leaf 2** highlights the absurdity of denying intralife compensation while accepting interlife aggregation.
  *   **Leaf 11** highlights the instability of allowing interlife sacrifice but denying it for discontinuous selves; usually, if you aggregate across lives, you aggregate across stages.
  *   **Leaf 12** highlights that no one uses fission to *expand* aggregation permissions while maintaining interlife constraints; fission is usually used to test the limits of identity, not to create utilitarian loopholes in deontology.
