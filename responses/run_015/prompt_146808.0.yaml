      *   **Section 2: The "Intact Ecosystem" Intuition:** Discuss fitness vs. welfare. Degradation isn't just loss of value; it's creation of negative value. Intact isn't perfect, but degraded might be actively worse.
      *   **Section 3: Prevention vs. Mitigation:** Prevention is key (don't create traps), but remediation is also key (fix existing traps). Prioritize habitats based on suffering density, not just biodiversity.
