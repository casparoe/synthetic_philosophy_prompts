answer: |-
  This is a fascinating puzzle because your friend is intuitively navigating a debate that occupies professional philosophers (specifically social ontology, think John Searle or Ian Hacking). Her record shows she isn't using a single binary switch; she's sensitive to *why* something is constructed.

  Here is the breakdown of the rules she might be running, the predictions for your new cases, and how to test her logic.

  ### 1. The Candidate Rules

  Based on her glosses, she is distinguishing between **Ontological Dependence** (does it exist without us?) and **Kind Membership** (are the boundaries fixed by nature?).

  *   **Rule A: The "Mind-Independence" Test (The Gold/Flu Rule)**
      *   *Logic:* If the entity would continue to exist and behave the same way if humans vanished, it is **Not Constructed**.
      *   *Fits:* Mountains, Gold, The Flu.
      *   *Fails:* Money, Chess, Weeds (a "weed" vanishes as a concept without a gardener).
      *   *Tension:* Race. Under this rule, Race should be "Not Constructed" because the genetic variation exists without us. But she calls it Constructed. This suggests Rule A is incomplete.

  *   **Rule B: The "Boundary Convention" Test (The Race/Weeds Rule)**
      *   *Logic:* If the *category* or *status* depends on human agreement, purpose, or arbitrary cutoffs—even if the underlying stuff is real—it is **Constructed**.
      *   *Fits:* Race (variation real, boxes ours), Weeds (plants real, "weed" is functional), Money (value is agreed), Chess (rules are agreed).
      *   *Fails:* Gold (atomic number is fixed by nature), Flu (virus is distinct), Mountains (geological mass is distinct enough).
      *   *Tension:* Mountains. Geologically, the line between "hill" and "mountain" is fuzzy. If she were strictly running Rule B, "Mountains" might be constructed. Her verdict suggests she treats large geological features as "Brute Facts" despite fuzzy boundaries.

  *   **Rule C: The "Human Interest" Synthesis (Most Likely)**
      *   *Logic:* Something is **Constructed** if its identity or function relies on human purposes, laws, or classification systems. It is **Not Constructed** if its identity relies purely on physical constitution.
      *   *Why this fits:* It explains why Gold (physical constitution) is Not, but Money (human purpose) is. It explains why Flu (physical agent) is Not, but Weeds (human purpose relative to a garden) are. It explains Race: the *biology* is brute, but the *Race* is the social box, which is her target.

  ### 2. Predictions for the Four New Cases

  Here is how Rule C (The Human Interest Synthesis) predicts she will rule, along with the reasoning she will likely use:

  1.  **Brain Death:** **Constructed.**
      *   *Reasoning:* This matches her "Race" gloss perfectly. The biology (brain activity) is real, but the *status* of "dead" is a legal/medical cutoff decided by committees for specific purposes (transplants). It is a boundary convention.
  2.  **Species:** **Constructed.**
      *   *Reasoning:* This matches "Race" and "Weeds." Nature produces the variation (like genetic ancestry), but "Species" is a taxonomic box. The "lumpers vs. splitters" argument is the exact same logic as "the boxes are ours."
  3.  **The Mean High-Water Line:** **Constructed.**
      *   *Reasoning:* This is a hybrid of "Money" and "Weeds." The tides are real (like Mountains), but the *Line* is a legal abstraction computed for property rights. It exists only because the law says it does.
  4.  **ADHD:** **Constructed.**
      *   *Reasoning:* This matches "Race" and "Gender." The behaviors/neurology may be real, but the *category* "ADHD" is a diagnostic label with shifting criteria (DSM revisions) that changes how people are treated and see themselves.

  **Summary:** She will likely call **all four Constructed.** Her track record shows that once human classification, law, or purpose enters the chat, the "Not Constructed" verdict disappears (see: Weeds).

  ### 3. The Best Splitter Among the Four

  If you want to see which rule is dominant in her head (Rule A: Existence vs. Rule B: Boundaries), **Species** is the diagnostic case.

  *   **Why:** "Species" sits directly between **Gold** and **Race**.
      *   Like **Gold**, a Lion is a natural kind with biological reality. If she prioritizes *Ontological Dependence* (Rule A), she should say "Not Constructed" because lions existed before us.
      *   Like **Race**, "Species" is a classification system with fuzzy boundaries. If she prioritizes *Boundary Convention* (Rule B), she should say "Constructed" because the line is drawn by biologists.
  *   **The Split:** If she says "Not Constructed," she is prioritizing the underlying reality (Gold Rule). If she says "Constructed," she is prioritizing the human taxonomy (Race Rule).
  *   *Note:* Brain Death is a close second, but "Death" feels more like a binary state (like the Flu killing a cell), whereas "Species" is explicitly about grouping and boundaries, which triggers her "boxes are ours" gloss.

  ### 4. Best Guess Overall

  **She is running Rule C (The Human Interest Synthesis), with a bias toward the "Boundary Convention" test.**

  **Why:**
  The strongest evidence is her verdict on **Weeds**. A weed is biologically identical to a non-weed plant of the same species; the *only* difference is human intent (is it in a garden?). If she were running a strict "Mind-Independence" rule, she might have hesitated on Weeds. But she didn't. She recognized that if the *definition* relies on human context, it's constructed.

  She treats **Gold** and **Flu** as "Not Constructed" because their definitions don't rely on human intent (Gold is Element 79 regardless of value; Flu is a specific viral structure regardless of pandemic status).

  Therefore, for the new cases: Since Brain Death, Species, High-Water Line, and ADHD all rely on human-defined cutoffs, legal statuses, or diagnostic manuals, she will classify them as **Constructed**. She distinguishes between the *stuff* (which is real) and the *label* (which is constructed), and she verdicts based on the label.

  ### 5. The One Further Case to Settle It

  To definitively prove whether she prioritizes **Underlying Reality** (Gold) or **Human Boundaries** (Race), ask her this:

  > **"Is the distinction between a 'hill' and a 'mountain' constructed?"**

  *   **Context:** She already ruled "Mountains" are **Not Constructed** because "they'd be there with or without us."
  *   **The Trap:** Geologically, there is no hard line between a hill and a mountain (often it's just an arbitrary height, e.g., 1,000 feet).
  *   **If she says "Not Constructed":** She is running the **Existence Rule**. She cares that the rock mass is real, ignoring the fuzzy boundary. (She prioritizes the Gold logic).
  *   **If she says "Constructed":** She is running the **Boundary Rule**. She admits that while the rock is real, the *category* "mountain" vs "hill" is a human box. (She prioritizes the Race logic).

  This question forces her to choose between her verdict on "Mountains" and her gloss on "Race." It reveals whether "Not Constructed" means "The physical stuff exists" or "The category is naturally precise."
