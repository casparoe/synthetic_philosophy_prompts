answer: |-
  # Activity: The Anchor Trap
  **Course:** Welfare Economics / Social Choice Seminar
  **Time:** 80 Minutes
  **Students:** 14 (4 Groups of 3, 2 Rotating Auditors)
  **Materials:** Printed Handouts (Versions A & B), Person D Cards, Whiteboard.

  ## Part 1: The Setup (0:00 – 0:10)
  **Instructor Action:** Walk in. Do not lecture. Do not define "utility." Hand out the materials immediately.

  **Group Configuration:**
  *   Divide the class into 4 groups of 3 students.
  *   Assign the remaining 2 students as **Auditors**. Their job is to circulate, check arithmetic, and ensure no group talks to another group. They swap groups after Round 2.

  **Roles within Groups:**
  1.  **Allocator:** Makes the final decision on the budget.
  2.  **Scribe:** Records the justification for the decision.
  3.  **Skeptic:** Tasked with finding flaws in the reasoning (must speak at least once per round).

  **The Story:**
  "You are a committee allocating a fixed resource (Policy X or Policy Y) among three constituents: Person A, Person B, and Person C. You are given their 'Welfare Scores' for each policy. Your mandate is to maximize Social Welfare. You cannot ask the constituents how they feel; you only have these numbers."

  ---

  ## Part 2: The Handouts & Numbers

  ### Handout 1: The Raw Data (All Groups)
  *Instructions: Calculate the Total Social Welfare for Policy X and Policy Y. Choose the higher sum.*

  | Constituent | Policy X (Equality) | Policy Y (Efficiency) |
  | :--- | :---: | :---: |
  | **Person A** | 100 | 110 |
  | **Person B** | 20 | 10 |
  | **Person C** | 50 | 50 |
  | **TOTAL** | **170** | **170** |

  *(Note: In Round 1, the totals are equal. This forces a tie-break discussion. Most will pick X due to equality, or Y due to Pareto improvement for A.)*

  **Correction for Round 1:** *Wait, to make the flip work, we need a clear winner in Round 1 that flips in Round 2.*
  *Revised Handout 1 (Version Standard):*
  | Constituent | Policy X | Policy Y |
  | :--- | :---: | :---: |
  | **Person A** | 100 | 120 |
  | **Person B** | 20 | 10 |
  | **Person C** | 50 | 50 |
  | **TOTAL** | **170** | **180** |
  *(Utilitarian Choice: Policy Y)*

  ### Handout 2: The Calibration Memo (Distributed at 0:25)
  *Instructions: New information from the data bureau. The units for Person B were under-reported. Person B experiences welfare changes 10x more intensely than Person A. Recalculate Welfare using **Adjusted Utils** for Person B (Multiply B's score by 10). Person A and C remain unchanged.*

  | Constituent | Policy X | Policy Y |
  | :--- | :---: | :---: |
  | **Person A** | 100 | 120 |
  | **Person B (Adj)** | 200 | 100 |
  | **Person C** | 50 | 50 |
  | **TOTAL** | **350** | **270** |
  *(Utilitarian Choice: Policy X. **The Flip.**)*

  ### Handout 3: The Zero-Point Directive (Distributed at 0:40)
  *Instructions: New mandate. Welfare is measured as 'Distance from Survival Baseline.' The Survival Baseline is fixed at **150 Adjusted Utils**. If a person falls below 150, they are in 'Crisis.'*
  *Rule: Maximize Total Welfare, BUT no constituent can be in Crisis.*

  *   **Policy X:** A(100), B(200), C(50). *Wait, I need to map the previous numbers to this baseline.*
  *   *Let's simplify Round 3 for the Zero-Point lesson.*
  *   *Use the Adjusted Numbers from Round 2.*
  *   *Baseline = 110.*
  *   **Policy X:** A(100 < 110 **Crisis**), B(200), C(50 < 110 **Crisis**).
  *   **Policy Y:** A(120), B(100 < 110 **Crisis**), C(50 < 110 **Crisis**).
  *   *This is getting messy. Let's streamline Round 3 to focus purely on the Zero Point shift affecting a 'Priority' rule.*

  **Revised Round 3 Plan:**
  Keep the **Adjusted Numbers** from Round 2.
  **New Rule:** "Maximize the Sum of Welfare **Gains** relative to the Status Quo."
  **Scenario 1:** Status Quo = 0 for everyone. (Gains = Raw Score).
  **Scenario 2:** Status Quo = 100 for everyone. (Gains = Score - 100).
  *   *Policy X Gains (SQ=0):* 100 + 200 + 50 = 350.
  *   *Policy Y Gains (SQ=0):* 120 + 100 + 50 = 270. (Pick X).
  *   *Policy X Gains (SQ=100):* 0 + 100 + (-50) = 50.
  *   *Policy Y Gains (SQ=100):* 20 + 0 + (-50) = -30. (Pick X).
  *   *Mathematically, the ranking doesn't change.* **This is the trap.**
  *   *To make the Zero Point matter, we must introduce a **Critical Level** constraint.*
  *   **Round 3 Instruction:** "You must ensure no one ends up with a negative welfare score. You may shift the Zero Point to either: (A) The worst outcome in the set (Min=0), or (B) An external biological baseline (where B's outcome in Policy Y is -10)."
  *   **Task:** Choose the Anchor (A or B) and the Policy (X or Y).

  ### Person D Card (Handed to Skeptics only)
  "Person D exists. For every policy outcome, Person D reports a utility of **50**. Person D claims their '50' is the same happiness as Person A's '50'. You have no way to verify this. If you include Person D in the sum, does it change your choice? What if Person D says their '50' is actually misery?"

  ---

  ## Part 3: The Timeline

  **0:00 – 0:10: Distribution & Reading**
  *   Hand out Round 1 materials.
  *   Auditors circulate.
  *   **Constraint:** No talking to other groups. No Googling "utility theory."

  **0:10 – 0:25: Round 1 (The Naive Sum)**
  *   Groups calculate totals.
  *   Most will pick Policy Y (180 > 170).
  *   Skeptics should note: "Person B loses half their welfare."
  *   **Stop:** Collect decisions. Write counts on board (Y vs X).

  **0:25 – 0:40: Round 2 (The Unit Shift)**
  *   Hand out Calibration Memo (B's units x10).
  *   Groups recalculate.
  *   New Totals: X (350) > Y (270).
  *   **Stop:** Collect decisions. Write counts on board.
  *   **Observation:** The "Utilitarian" choice flipped without changing the ethical rule, only the scale.

  **0:40 – 0:55: Round 3 (The Zero Point)**
  *   Hand out Zero-Point Directive.
  *   **Task:** Choose an Anchor (Internal Min vs. External Baseline) AND a Policy.
  *   **Constraint:** If using External Baseline, Person B in Policy Y is at -10 (Crisis). If using Internal Min, everyone is ≥ 0.
  *   **Rule:** "Maximize Sum, subject to No Crisis (Negative Score)."
  *   **Result:** Internal Min allows Y (if B is ≥0). External Baseline forbids Y (B is -10).
  *   **Stop:** Collect Anchor Choice + Policy Choice.

  **0:55 – 1:20: The Debrief (Instructor Led)**
  *   See below for script.

  ---

  ## Part 4: The Debrief Guide

  **1. The Unit Flip (0:55 – 1:05)**
  *   **Ask:** "Who changed their vote between Round 1 and 2? Why?"
  *   **Concept:** **Unit Comparability.**
  *   **Point:** In Round 1, you assumed 1 Util for A = 1 Util for B. In Round 2, you assumed 1 Util for B = 10 Utils for A.
  *   **Lesson:** Utilitarianism ($\sum u_i$) is *not* invariant to different scaling factors ($a_i$) across individuals. If you can stretch Person B's scale, you make them matter more to the Sum. This looks like Prioritarianism (weighting the worse off), but it's just measurement calibration.
  *   **Theorem Link:** This is the **Measurability** condition in Social Choice. Without full interpersonal comparability of units, the Social Welfare Function is indeterminate.

  **2. The Zero Point Trap (1:05 – 1:15)**
  *   **Ask:** "In Round 3, did the Anchor choice determine the Policy?"
  *   **Concept:** **Level Comparability.**
  *   **Point:** If you used the "Internal Min" anchor, Policy Y was permissible. If you used "External Baseline," Policy Y was forbidden.
  *   **Honest Correction:** "Mathematically, for a fixed population, shifting the zero point ($u_i + b$) adds a constant to the Total Sum ($ \sum u_i + nb $). It should *not* change the ranking of X vs Y if you are just maximizing Sum."
  *   **The Catch:** It *did* change your decision because you implicitly switched from **Utilitarianism** to **Sufficientarianism** (No one below zero). The Zero Point doesn't change the Sum ranking, but it changes the *feasibility set* of constraint-based rules.
  *   **Lesson:** Debates about "baseline welfare" are often debates about whether we have a threshold constraint, not about the sum itself.

  **3. Person D & The Skeptic (1:15 – 1:20)**
  *   **Ask:** "Skeptics, did Person D help or hinder?"
  *   **Concept:** **Non-Comparability.**
  *   **Point:** If Person D's "50" is incomparable to A's "50", adding them is noise. If it is comparable, they are a tie-breaker.
  *   **Limitation:** The game assumes the numbers *mean* something. In reality, we cannot observe $u_i$. We observe choices.
  *   **Axiom Check:** Arrow's Impossibility Theorem assumes ordinal non-comparable utilities. Sen's work shows if we allow *some* comparability (like we did in Round 2), we can escape impossibility, but we pay the price of arbitrary calibration.

  **4. What the Game Hid (Instructor Monologue)**
  *   "You felt the moral weight shift when I changed the numbers. That is the danger. The moral weight *should* come from your ethical axiom (Prioritarianism vs. Utilitarianism), not from the data entry."
  *   "There is no 'Privileged Scale.' Neuroscience might one day give us a 'hedonic meter,' but until then, the zero point and the unit size are normative choices disguised as empirical ones."
  *   "When you argue for 'weighting the worse off,' ask yourself: Are you arguing for a concave transformation $g(u)$, or are you just arguing that the worse off have a larger unit scale $a$? The math looks the same; the justification is different."

  ---

  ## Part 5: Predictable Failures & Mitigation

  **1. "Just ask them to rate happiness 1-10."**
  *   **Prediction:** A student will suggest surveying the "constituents" to normalize the scales.
  *   **Mitigation:** Remind them this is a seminar on *welfare economics*, not survey design. The numbers *are* the revealed preference utility. If they suggest normalization, ask: "By what rule do you normalize? Equal averages? Equal variances? That rule itself is an interpersonal comparison."

  **2. "I refuse to compare." (The Arrow Purist)**
  *   **Prediction:** The Skeptic will say, "These numbers are ordinal, I can't add them."
  *   **Mitigation:** Validate them. "You are technically correct for Round 1. But the prompt *ordered* you to maximize the Sum. You were forced to treat them as cardinal. The point of the activity is to show what happens when you obey that order without questioning the scale."

  **3. Arithmetic Disputes**
  *   **Prediction:** Groups waste time debating the math.
  *   **Mitigation:** Auditors have final say on arithmetic. Instructor keeps strict time.

  **4. The "Fixed Population" Math Check**
  *   **Prediction:** A sharp student notices the Zero Point shift doesn't change the Sum ranking in Round 3.
  *   **Mitigation:** **Celebrate this.** "Exactly. If you were pure Utilitarians, the Zero Point shouldn't matter. The fact that it *did* matter to you proves you are not Utilitarians; you are Sufficientarians. The activity successfully revealed your hidden constraint."

  ---

  Bottom line: This activity forces students to operationalize interpersonal comparisons, revealing that their ethical conclusions often depend on arbitrary measurement anchors rather than explicit moral principles.
