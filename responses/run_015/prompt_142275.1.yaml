  2.  **Deconstruct the Economic/Philosophical Core:**
      *   *Problem:* Utilitarianism ($\sum u_i$) and Prioritarianism ($\sum g(u_i)$ where $g$ is concave) look like different ethical commitments.
      *   *Twist:* If utility functions are only unique up to positive affine transformations ($u' = a u + b$), then changing $b$ (the zero point) changes the ranking of allocations under Utilitarianism.
      *   *Example:*
          *   Person A: $u_A(x) = x$. Person B: $u_B(x) = x - 100$.
          *   Allocation 1: A gets 10, B gets 10. Sum = $10 + (-90) = -80$.
          *   Allocation 2: A gets 5, B gets 20. Sum = $5 + (-80) = -75$.
          *   Utilitarian prefers 2.
          *   Now shift B's zero: $v_B(x) = x$.
          *   Allocation 1: Sum = $10 + 10 = 20$.
          *   Allocation 2: Sum = $5 + 20 = 25$.
          *   Still prefers 2.
          *   *Wait, I need the ranking to FLIP.*
          *   Let's try:
              *   Option X: A=10, B=10.
              *   Option Y: A=20, B=5.
              *   Scale 1 (Raw): $u_A = x, u_B = x$. X=20, Y=25. Pick Y (Utilitarian favors total).
              *   Scale 2 (Shifted B): $v_A = x, v_B = x - 20$.
              *   X: $10 + (10-20) = 0$.
              *   Y: $20 + (5-20) = 5$.
              *   Still Y.
              *   *I need the shift to change the marginal weight.*
              *   Actually, simple addition is invariant to *common* shifts, but not *individual* shifts.
              *   Let's check: $\sum (a_i u_i + b_i) = \sum a_i u_i + \sum b_i$. If we compare Option X vs Option Y, the $\sum b_i$ cancels out *if the population is fixed*.
              *   *Correction:* If the population is fixed, adding a constant to everyone's utility *does not* change the Utilitarian ranking. $\sum u_i(X) > \sum u_i(Y) \iff \sum (u_i(X) + k_i) > \sum (u_i(Y) + k_i)$. The constants cancel.
              *   *CRITICAL REALIZATION:* The prompt asks to show that "sum rule mimics priority rule" depending on the anchor. This implies the *units* (scaling factor $a$) matter more than the zero point ($b$) for Utilitarianism, OR the prompt implies a specific context where the zero point matters (e.g., critical-level utilitarianism, or comparing against a status quo).
              *   *Re-reading the prompt:* "under one anchor the sum rule mimicks the priority rule and under another it doesn't."
              *   If I change the zero point, Utilitarianism (sum) is invariant *unless* the set of people changes (population ethics) OR if we are comparing against a threshold (critical level).
              *   *However*, Prioritarianism (concave transformation) is *not* invariant to affine transformations.
              *   *Wait, the prompt says:* "The thing I want them to walk into is that 'add up the utilities' and 'weight the worse off more' stop being rival policies once the anchor is up for grabs."
              *   This suggests the activity should reveal that what looks like a "priority weight" might just be a scaling artifact.
              *   *Let's pivot:* If I define "Welfare" as $u_i$, Utilitarianism sums $u_i$. If I define "Welfare" as $v_i = a u_i + b$, Utilitarianism sums $v_i$.
              *   If $a$ differs across people (unit comparability), the sum changes.
              *   If $b$ differs across people (level comparability), the sum ranking *doesn't* change for fixed population.
              *   *So the prompt's intuition about the "zero point" flipping the sum rule is technically incorrect for standard Utilitarianism with fixed population.*
              *   *BUT*, as an instructor, I need to make the activity work *pedagogically* even if I have to correct the theory in the debrief. Or, I need to find a setup where the zero point *does* matter.
              *   *Where does the zero point matter?*
                  1.  **Critical-Level Utilitarianism:** $\sum (u_i - c)$. If $c$ is fixed externally, shifting $u_i$ matters.
                  2.  **Status Quo Bias:** Comparing $\Delta u$. If baseline is arbitrary, $\Delta u$ is arbitrary.
                  3.  **The "Priority" Illusion:** If Person A has a scale where 1 unit = 1 util, and Person B has a scale where 1 unit = 10 utils, summing them weights B heavily. This looks like Prioritarianism (weighting the worse off) if B is the worse off, but it's just unit scaling.
              *   *Decision:* I will design the numbers so that **Unit Scaling** (which students often conflate with Zero Point) drives the flip. I will also include a "Zero Point" manipulation that affects a *threshold* rule (like "no one below zero"), which forces them to confront level comparability.
              *   *Actually, let's look closer at the prompt's specific mechanism:* "zero at the worst outcome in the choice set versus zero at some shared external baseline."
              *   If I set zero at the worst outcome *for each person individually*, then everyone's minimum is 0.
              *   If I set zero at an external baseline, some might be negative.
              *   If the rule is "Maximize Sum", the ranking is invariant to individual shifts ($b_i$).
              *   *Unless* the rule is "Maximize Sum subject to no one below 0" (Sufficientarianism).
              *   *Okay, I need to be careful in the debrief.* The prompt asks me to make them *feel* it. The feeling comes from the arbitrariness of the scale. I will construct the numbers so that changing the *units* (slope) flips the Utilitarian result, and changing the *zero* (intercept) flips a Sufficientarian/Prioritarian result. I will explicitly address the "fixed population invariance" in the debrief as a "gotcha" that deepens the learning.
              *   *Wait, one more check:* Is there a way the zero point flips the Sum? Only if the "Sum" is actually "Sum of Gains from Status Quo". If Status Quo is the zero point, then shifting the zero point changes the Status Quo utility, thus changing the Gain.
              *   *Plan:* I will frame the allocation as "Distribution of Gains" vs "Distribution of Absolute Levels". This allows the zero point to matter for the "Gains" calculation.

  3.  **Drafting the Numbers (The Robust Flip):**
      *   Need 3 people (A, B, C).
      *   Two Policies: Policy X (Equalish), Policy Y (Unequal, higher total).
      *   Scale 1 (Raw): Sum favors Y. Priority favors X.
      *   Scale 2 (Rescaled): Sum favors X (mimics Priority).
      *   Let's try:
          *   Person A (Rich/Insensitive): Policy 1 = 100, Policy 2 = 110.
          *   Person B (Poor/Sensitive): Policy 1 = 10, Policy 2 = 5.
          *   Person C (Middle): Policy 1 = 50, Policy 2 = 50.
          *   Raw Sum: P1 = 160, P2 = 165. (Utilitarian picks P2).
          *   Priority (concave): P1 looks better because B loses 5 in P2.
          *   Now, rescale B. Suppose B's units are "10x more sensitive".
          *   New B: P1 = 100, P2 = 50.
          *   New Sum: P1 = 100+100+50 = 250. P2 = 110+50+50 = 210.
          *   Now Utilitarian picks P1.
          *   *Result:* Changing B's unit scale made Utilitarianism act like Prioritarianism.
      *   *Zero Point Twist:*
          *   Case 1: Zero = Worst outcome in set. (B's min is 0).
          *   Case 2: Zero = External Baseline (e.g., Survival). B is at -50 in P2.
          *   If rule is "Maximize Sum", this doesn't change the *ranking* (as established above).
          *   *Correction for Activity:* I must use a rule where the zero matters. E.g., "Maximize Sum, but veto if anyone drops below 0." OR I acknowledge in the debrief that for pure Sum, zero doesn't matter, but for *measuring improvement*, it does.
          *   *Better approach for the prompt:* The prompt specifically asks for the zero point to do the work. I will create a scenario where they calculate "Total Welfare" but define Welfare as "Distance from Zero". If Zero moves, Distance moves.
          *   *Actually, I'll stick to the Unit Flip for the Sum, and the Zero Flip for a 'Minimum Standard' rule.* This covers both bases and allows the debrief to distinguish them.
          *   *Wait, I need to follow the prompt's intuition:* "under one anchor the sum rule mimicks the priority rule". This implies the Sum ranking changes. As noted, this requires Unit changes ($a$), not Zero changes ($b$). I will design the activity to conflate them initially (as students do) and separate them in the debrief. I will explicitly manipulate the *units* in the "Anchor" phase, calling it "calibration."

  4.  **Developing the Activity Structure:**
      *   **Groups:** 3 groups of 4, plus 2 floaters (or 4 groups of 3-4). Let's do 4 groups of 3-4 students.
      *   **Roles:** Allocator, Scribe, Skeptic, Timekeeper.
      *   **Materials:** Handout with Utility Tables (Version A and Version B). Card for Person D (The "Middling" Control).
      *   **Timeline:**
          *   0-10: Setup & Handout (No lecture).
          *   10-25: Round 1 (Raw Numbers).
          *   25-40: Round 2 (Calibration/Anchoring).
          *   40-55: Round 3 (The Conflict Case).
          *   55-80: Debrief.

  5.  **Refining the Numbers for the "Flip":**
      *   Need to ensure the flip isn't fragile.
      *   *Person A:* High baseline, low marginal sensitivity.
      *   *Person B:* Low baseline, high marginal sensitivity.
      *   *Person C:* Neutral.
      *   *Policy 1:* Equality. *Policy 2:* Efficiency.
      *   *Version 1 (Units aligned):* Sum prefers Efficiency.
      *   *Version 2 (B's units expanded):* Sum prefers Equality.
      *   *Zero Point:* I will introduce a "Survival Threshold" at 0. In Version 1, everyone is above 0. In Version 2 (shifted zero), B dips below 0 in Policy 2. This triggers the "Zero Point" moral intuition even if the Sum math is invariant.

  6.  **Addressing Predictable Failures:**
      *   *"Just ask them 1-10":* I need a rule forbidding communication with the "constituents" (the numbers are given).
      *   *"Refuse to compare":* The "Skeptic" role is designed to voice this, but the task forces a decision.
      *   *"Math error":* Keep numbers integers, simple sums.

  7.  **Drafting the Debrief:**
      *   Must distinguish: Cardinality (intrapersonal) vs. Comparability (interpersonal).
      *   Must distinguish: Level (zero) vs. Unit (scale).
      *   Must admit: Utilitarianism is invariant to level shifts (fixed pop), but *appears* sensitive if we frame it as "gains."
      *   Must mention: Arrow's Impossibility, Sen's Capability Approach.

  8.  **Final Review against Constraints:**
      *   14 students? (4 groups of 3, 1 group of 2? Or 3 groups of 4, 2 observers? Let's go with 4 groups of 3, 2 students as 'Auditors' who rotate). Actually, 14 divides poorly. 3 groups of 4, 1 group of 2 is awkward. 4 groups of 3 = 12, 2 floaters. Let's make the floaters "Regulators" who check the math.
      *   80 minutes? Yes, timeline fits.
      *   No real money? Yes, hypothetical utility.
      *   Bottom line? Needs to be punchy.

  9.  **Self-Correction on the "Zero Point" Math:**
      *   I cannot lie in the handout. If I tell them "Sum changes when Zero changes," a sharp student will catch me ($ \sum (u+b) = \sum u + nb $).
      *   *Solution:* I will frame the task in Round 3 as "Maximize Sum of *Gains* from Baseline." If Baseline = Zero Point, then shifting Zero changes the Gain. This makes the Zero Point mathematically relevant to the decision rule provided.
      *   *Rule:* "Maximize Total Net Welfare relative to the Anchor."
      *   This validates the prompt's intuition without breaking math.

  10. **Final Polish:** Check tone. Needs to be academic but active. Ensure the "Person D" card serves a purpose (the 'level' comparison problem).

  *(Self-Correction during drafting)*: Wait, if I use "Gains from Baseline," and the Baseline is the Zero Point...
  If Baseline is "Worst in Set" (0), then Gains are just the Utility numbers.
  If Baseline is "External" (e.g., -50), then Gains are $u - (-50) = u + 50$.
  Sum of Gains = $\sum u + 50n$.
