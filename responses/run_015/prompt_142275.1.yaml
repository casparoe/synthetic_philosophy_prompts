  *Okay, I have to be very honest in the debrief.* The activity will *feel* like the zero point matters because of the "Survival Constraint" (nobody below zero), even if the Sum doesn't change. I will use the "Survival Constraint" as the lever for the Zero Point, and "Unit Scaling" as the lever for the Sum Flip. This is mathematically sound and pedagogically rich.

