answer: |-
  The view faces a fatal dilemma between unfollowability and redundancy: if speakers must match actual hearer stakes the norm violates ought-implies-can, but if they need only match expected stakes the view collapses into a standard negligence account that makes the hearer-stakes rider explanatorily idle.

  **Fatal and Serious Defeaters**

  1.  **The Actionability Problem (Fatal):** A norm must be followable to be a norm. In your coordinator case, the hearer's stakes are transparent (health/life). In the bar case, they are assumed low. But consider a stranger asking for the time while secretly rushing a bomb defusal. Their stakes are infinite. If your norm requires warrant calibrated to *actual* stakes, you impermissibly assert the time despite having perfect knowledge, violating ought-implies-can because you cannot access their secret context. If you retreat to *reasonable expected* stakes, you are no longer tracking hearer stakes but speaker evidence about stakes. This shifts the burden back to the speaker's epistemic position, which is already covered by your "borrowed warrant" clause. The hearer-stakes rider either makes assertion impossible or adds nothing to the requirement that the speaker not be reckless about their own evidence.

  2.  **Collapse into Negligence (Serious):** Your friend's suspicion that this is the Knowledge Norm in disguise is partially right, but the deeper risk is collapse into a Negligence Norm. In the coordinator case, the criticism feels like "you should have checked the inbox because lives were at risk." This is a claim about due diligence, not assertion *per se*. Your view already includes a clause that borrowing warrant must not be "reckless." Recklessness is naturally defined by stakes: ignoring an email is reckless when patients are at risk, negligible when they are not. If the stakes merely determine what counts as reckless borrowing, then the hearer-stakes rider is doing no independent work; the work is being done by the negligence condition. The view becomes: "Assert iff you know and haven't been negligent," where negligence is stakes-sensitive. This is a standard account, not a new norm.

  3.  **No-Hearer Cases (Serious):** For a novelist, this is critical. Diary entries, soliloquies, and narrator assertions lack a specific hearer. If the norm is essentially relational (calibrated to *the* hearer), these become norm-free zones or require ad hoc stipulations about "virtual hearers" (the future self, the implied reader). If you posit an implied reader, what are their stakes? If a narrator asserts a falsehood that harms no one but misleads the reader aesthetically, is that a violation? If the view requires a principled exemption for fiction, it admits that assertion is not univocal. If it tries to cover fiction by positing "reader stakes," it becomes unwieldy: does a thriller narrator need higher warrant than a comedy narrator because the reader's emotional stakes differ? This suggests the norm governs *communication*, not assertion itself.

  **Hearer-Stakes Calibration and Intuitions**

  *   **Hostile/Self-Imposed Stakes:** A gambler asks for a horse tip. You have ordinary warrant. They bet their life savings (self-imposed high stakes). Your view implies you need higher warrant to assert the tip than you would for a casual bettor. Intuition suggests you are not responsible for their irrational stakes; ordinary warrant suffices. Your view risks making speakers hostage to hearers' unpredictable valuations.
  *   **Low Stakes Extremes:** Telling a stranger a trivial fact (e.g., "it is Tuesday") where stakes are nil. Does this lower the warrant bar below knowledge? If yes, you permit assertion on mere belief, which contradicts your "position to know" condition. If no, the rider is idle for low-stakes cases, working only to raise the bar for high-stakes cases, which looks less like a calibration and more like a veto.
  *   **The Coordinator Case:** You argue the criticism is about calibration, not ignorance. But if the unread email contains a defeater, standard epistemology says she lacks knowledge regardless of stakes (defeasibility). If the email does *not* contain a defeater, and she is in a position to know, the Knowledge Norm says she may assert. Your intuition says she may not. This is the strongest point for your view, but it relies on the sense that she *ought to have checked*. That is a duty of inquiry, not a norm of assertion. The norm of assertion kicks in *after* inquiry is complete. Your view conflates the norm of inquiry with the norm of assertion.

  **Consequences and Predictive Power**

  *   **Consequence Rivals Avoid:** Your view makes the permissibility of an assertion depend on facts external to the speaker's epistemic state (the hearer's actual situation). This creates a fragmentation of assertion: two speakers with identical evidence saying identical words perform different speech acts regarding permissibility. While contextualists accept this, your view adds a layer of moral responsibility (calibration to hearer welfare) that rivals treat as separate from epistemic permission. This burdens the speaker with a duty of care that rivals locate in general morality, not the specific norms of assertion.
  *   **Predictive Power:** The view predicts that as hearer stakes rise, the warrant required rises, even if speaker stakes remain low. This matches the coordinator case. However, it also predicts that if hearer stakes are low, warrant requirements drop. This is harder to test. If the view is qualified to say "warrant must still meet the threshold for knowledge," then it predicts nothing the Knowledge Norm doesn't. If it says warrant can drop below knowledge, it conflicts with the "position to know" condition.
  *   **Unfalsifiability:** There is a risk of quiet qualification. If a counterexample arises (e.g., high stakes but we feel assertion is okay), a defender can say "the stakes weren't actually that high for the hearer." If this move is always available, the view is insulated from disconfirmation but ceases to be empirical. Given your preference for concrete cases, you must decide if "stakes" are objective facts or intuitive proxies. If they are proxies, the view is descriptive, not normative.

  **Concessions vs. Wave-Offs**

  *   **What to Concede:** You must concede that "ought-implies-can" requires the norm to reference *expected* or *reasonable* hearer stakes, not actual ones. You must also concede that in no-hearer cases, the norm either lapses or must be reframed as a norm of "record-making" rather than assertion.
  *   **What to Wave Off:** You can rightly wave off arguments from the "constitutive aim of assertion" (e.g., assertion aims at knowledge). These are often circular. You can also wave off the claim that this is *just* the Knowledge Norm, provided you maintain that Knowledge is invariant but Assertability is stakes-sensitive (the Knowledge-Plus position). However, you cannot wave off the charge that this makes the theory less parsimonious than Interest-Relative Invariantism, which builds stakes into Knowledge itself.

  **Bottom Line on Insulation**

  The view is not well insulated. It is vulnerable to the charge that it solves a problem of *inquiry* (how much should I check?) by posing as a solution to *assertion* (what may I say?). In the coordinator case, she violated a norm of diligence (check your email), not necessarily a norm of assertion (don't say what you don't know). By the time she speaks, if she is in a position to know, the damage of the unchecked email is either that she doesn't know (Knowledge Norm violation) or that she was negligent in arriving at that position (Inquiry Norm violation). The hearer-stakes rider attempts to bridge these, but in doing so, it becomes a hybrid that inherits the weaknesses of both: the accessibility problems of stake-sensitive norms and the redundancy of negligence accounts.
