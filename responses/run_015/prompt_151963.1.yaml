      *   *Rigging:* In Round 1, ensure the early movers have *weak* signals but announce confidently. The later mover has a *strong* signal. If they follow the crowd, it's an Info Cascade (rational).
      *   *Actually, the prompt says:* "One person... ends up holding strong evidence against a unanimous-looking crowd."
      *   *Okay, let's lock the mechanics:*
          *   Truth: Determined by a hidden coin flip or card draw at start.
          *   Signals: Private cards.
          *   Reliability: Private index card (High/Low).
          *   Round 1 (Truth Game): Points for the *Team* if the Majority Call matches Truth.
          *   Round 2 (Career Game): Points for *You* if Your Call matches the *Previous Person's Call*.
      *   *The Twist:* In Round 2, the Truth is revealed to be opposite of the first 3 callers. But the incentive is to match them.

  5.  **Drafting the Plan:**

      *   **Title:** "The Diagnostic Chain."
      *   **Materials:** Deck of cards (Red/Black), Index cards (marked "High Fidelity" / "Low Fidelity"), Whiteboard.
      *   **Setup:** 14 seats in a semi-circle.
      *   **Round 1 (The Rational Silence):** Incentive = Group Accuracy.
          *   Deal signals. Rig the first 3 to have "Low Fidelity" but same color. Rig Person 4 to have "High Fidelity" opposite color.
          *   If Person 4 follows the crowd, it's because the probability math says the first 3 are likely right despite low fidelity (or just that the public info swamps private).
          *   *Correction:* For an Info Cascade to be rational, the public history must outweigh the private signal. If 3 people say Black, and I have a High Fidelity Red signal, do I follow? Only if I believe their signals were likely strong too. Since I don't know their fidelity, I assume average. 3 average signals > 1 strong signal. So yes, rational to follow.
      *   **Round 2 (The Incentive Trap):** Incentive = Individual Alignment.
