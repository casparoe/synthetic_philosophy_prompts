answer: |-
  ### Design Selection Process

  **Candidate 1: The "Speed vs. Accuracy" Auction.**
  *Concept:* Participants bid time tokens on their confidence in a decision. Round 1 rewards accuracy; Round 2 rewards speed of agreement.
  *Drop Reason:* This measures risk tolerance and time pressure, not social epistemology. It conflates "being fast" with "following the crowd." I need them to feel the *epistemic* weight of the crowd, not just the time pressure.

  **Candidate 2: The "Hierarchical Command" Chain.**
  *Concept:* Assign roles (Commander, Lead, Tech). Lower roles see higher roles' decisions before making their own.
  *Drop Reason:* This introduces status bias immediately. I want the cascade to emerge from *information*, not rank. The prompt specifies the failure was "nobody said anything," implying a peer-group silence, not just obeying a boss.

  **Candidate 3: The "Sensor Fidelity" Sequence (Selected).**
  *Concept:* Participants act as diagnostic nodes in a chain. They hold private signals of varying reliability. They announce a conclusion publicly in sequence.
  *Why:* This isolates the variable I need. By changing only the *payoff structure* between Round 1 (Group Truth) and Round 2 (Individual Alignment), I can force the same behavior (following the crowd) to feel like "smart reasoning" in the first round and "compromised integrity" in the second.

  ***

  ### Workshop Design: "The Diagnostic Chain"

  **Participants:** 14 Ops/Incident Response staff.
  **Time:** 60 Minutes.
  **Materials:** 1 Deck of playing cards (Red/Black), 28 Index Cards (14 marked "Sensor A", 14 marked "Sensor B"), Whiteboard, Markers.

  #### 1. The Setup (5 Minutes)
  Seat the 14 participants in a visible semi-circle (1 to 14).
  Tell them: *"We are simulating a distributed diagnostic system. A hidden 'Incident Type' exists (Red or Black). You each receive a private sensor reading."*

  *   **The Signal:** Deal one playing card face down to each person. Red = Incident Type A; Black = Incident Type B.
  *   **The Fidelity:** Deal one Index Card face down to each person.
      *   **Sensor A (High Fidelity):** Tell them privately (via a legend on the whiteboard visible only when they check their card, or verbally beforehand): "Sensor A is 90% accurate."
      *   **Sensor B (Low Fidelity):** "Sensor B is 60% accurate."
  *   **The Constraint:** They may **only** announce "Red" or "Black". They cannot show their card, reveal their Sensor Type, or discuss probabilities.
  *   **The Sequence:** Participants announce their call in order (1 through 14). Everyone hears all previous calls.

  #### 2. Round 1: The Rational Cascade (15 Minutes)
  **Payoff Scheme:** *"The Team Win."*
  *   If the **Majority** of the 14 calls match the **Actual Truth** (determined by a single 'Truth Card' drawn by you at the start and kept hidden), everyone gets a "Performance Credit" (stickers, candy, or just public praise).
  *   If the Majority is wrong, no one gets credit.

  **The Rig:**
  *   Set the **Truth** to **Red**.
  *   **Participants 1, 2, 3:** Give them **Sensor B (Low)** + **Black Card**. (They are noisy and wrong).
  *   **Participant 4:** Give them **Sensor A (High)** + **Red Card**. (They are accurate and right).
  *   **Participants 5-14:** Mix of Sensors, mostly Red cards.
  *   *Why this rig:* Participants 1-3 will confidently announce "Black" (trusting their own sensor). Participant 4 hears "Black, Black, Black." They hold a High-Fidelity "Red" signal.
  *   *The Trap:* Mathematically, three previous signals (even if assumed average) often swamp one private signal. If Participant 4 announces "Black" to align with the crowd, they are making a **rational Bayesian update**. They are sacrificing their private evidence because the public record suggests *they* are the outlier.

  **Run the Round:** Go down the line. Record calls on the whiteboard. Reveal Truth. Celebrate if they win.

  #### 3. Round 2: The Incentive Cascade (15 Minutes)
  **Payoff Scheme:** *"The Individual Metric."*
  *   Reset the cards (or reshuffle). Set **Truth** to **Black**.
  *   **The Rig:**
      *   **Participants 1, 2, 3:** Give them **Sensor B (Low)** + **Red Card**. (Noisy and Wrong).
      *   **Participant 4:** Give them **Sensor A (High)** + **Black Card**. (High and Right).
  *   **New Rule:** *"This quarter, we are measuring 'Diagnostic Consistency'. You receive a Personal Credit if your call **matches the person immediately before you**. If you deviate, you get no credit, regardless of the Truth."*

  **The Trap:** Participant 4 hears "Red, Red, Red." They hold a High-Fidelity "Black" signal. They *know* the crowd is likely wrong (since they have a better sensor). However, the payoff structure now punishes deviation. If they announce "Black" (Truth), they lose their credit. If they announce "Red" (Lie), they secure their credit.
  *   Most will announce "Red." This is not epistemic reasoning; it is **reputational hedging**.

  #### 4. The Debrief (25 Minutes)
  Do not reveal the terms "Informational Cascade" or "Reputational Cascade" until the end.

  **Step 1: The Feeling Check (10 mins)**
  *   Ask Participant 4 (and others in that slot): *"In Round 1, when you heard three 'Blacks' before you, what was going through your head when you made your call?"*
      *   *Target Answer:* "I thought my sensor might be glitchy," or "The odds were against me."
  *   Ask Participant 4 (Round 2): *"What about the second time? Same situation, different rule."*
      *   *Target Answer:* "I knew I was right, but I didn't want to be the only one out of step," or "The rules said match the predecessor."

  **Step 2: Mapping the Distinction (10 mins)**
  *   **Name (a):** *"In Round 1, you followed the crowd because you respected the information. You assumed three people couldn't all be wrong. That is **Informational Cascading**. It is rational. It is not cowardice. It is math."*
  *   **Name (b):** *"In Round 2, you followed the crowd because you respected the incentive. You knew the information was bad, but the cost of being the outlier was too high. That is **Reputational Cascading**. That is the failure mode we had last quarter."*
  *   **The Fix:** *"You cannot fix (a) by telling people to 'speak up.' You fix it by improving private signal quality. You fix (b) by changing the payoff structure so that deviation is rewarded (e.g., 'Devil's Advocate' bonuses)."*

  **Step 3: Closing (5 mins)**
  *   Connect to the real incident: *"Last quarter, did we have a Round 1 problem (we genuinely thought the data said X) or a Round 2 problem (we knew X was wrong but didn't want to stall the launch)?"*

  ***

  ### Facilitator Notes

  #### What Will Predictably Go Wrong
  1.  **The Meta-Player:** Someone in position 1 or 2 will realize the game is about "cascades" and try to signal their fidelity ("I'm not sure, but...").
      *   *Fix:* Enforce the "Only announce Color" rule strictly. If they hedge, count it as no call.
  2.  **The Silent Objector:** Participant 4 in Round 2 might refuse to lie, saying "I'm calling Black because it's the truth."
      *   *Fix:* This is actually a win for the debrief. Highlight them. *"You absorbed the cost. Why? What would have made that easier?"* (Answer: Psychological safety/structural rewards).
  3.  **Confusion on Fidelity:** Participants might forget their Sensor Type.
      *   *Fix:* Have them hold the Index Card in their hand visibly (to themselves) throughout the round as a tactile reminder.

  #### Success Indicator: How to know (a) landed
  Watch Participant 4's **body language** in Round 1 vs. Round 2.
  *   **In Round 1 (Rational):** They will look *conflicted*. They will look at their card, look at the board, frown, and hesitate. They are doing math.
  *   **In Round 2 (Reputational):** They will look *resigned*. They might smirk, shrug, or announce quickly. They aren't calculating truth; they are calculating survival.
  *   *If you see the shrug in Round 2, you have successfully simulated the incident review failure.*

  #### Structural Limitation (What you must say out loud)
  This activity assumes a **perfect queue** (Turn 1, then Turn 2, etc.).
  *   *The Limitation:* Real incidents are not turn-based. People talk over each other; status hierarchy matters more than sequence; loud voices swamp quiet ones regardless of signal quality.
  *   *The Closing Line:* *"In this game, the only cost was a sticker. In reality, the 'queue' is determined by who speaks loudest or holds the highest title. If Person 1 was the VP, Person 4 wouldn't just feel a reputational risk; they'd feel a career risk. The mechanism is the same, but the pressure is amplified by hierarchy. That is why we need structured 'pre-mortems' where rank is temporarily suspended."*
