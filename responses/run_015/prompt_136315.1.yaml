prompt: |-
  I host a podcast about philosophy of mind and ethics, and next week I’m talking with a philosopher who defends the scale argument for insect sentience — the claim that with something like ten quintillion insects alive at once, even a one-in-a-million prior that a given ant or beetle is conscious multiplies out to enormous expected moral weight. I want the interview to stay in the weeds, not just have her restate the headline.

  Could you draft eight to ten quesitons? I need:

  - One that presses the prior-assignment problem: how does she avoid just pulling a number out of thin air when she assigns that low-but-nonzero probability to insect consciousness? Include a follow-up keyed to the answer she’ll probably give, something about evolutionary continuity.

  - One on the evolutionary divergence objection — that because insect nervous systems are wired so differently from vertebrates, we shouldn’t share the same base rate across lineages, which might collapse the multiplication. Follow-up anticipating her reply about functional convergence.

  - One on practical paralysis: if she’s right, then walking through grass or using pesticides causes astronomical harm. Is the view self-defeating, or just genuinely overwhelming? Follow-up for her likely distinction between direct and indirect harm.

  - One comparing insects to digital systems: if scale times a tiny prior generates moral concern, shouldn’t we worry about every simple algorithm running on billions of servers? Follow-up keyed to her likely claim that biological integration is what matters.

  Please keep it casual, like I’m asking a smart friend. No reading lists or citations — the model answering this can’t search the web. Oh, and I definatly want the follow-ups tied to her likely answers, not generic ones.
