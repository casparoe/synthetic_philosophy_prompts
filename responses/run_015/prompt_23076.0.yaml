  I retired from comparative physiology and have only recently begun reading philosophy of biology. Please describe the most important implications of the Gould-Lewontin spandrels critique for assessing a claim that a vertebrate sensory structure is an adaptation rather than a developmental byproduct, especially when the evidence comes from comparative anatomy and phylogenetic reconstruction rather than controlled experiments. In your answer, distinguish current function from historical origin, specify what evidence would make a spandrel or constraint hypothesis credible, and identify the main pitfalls in adaptationist reasoning that the critique exposes.
