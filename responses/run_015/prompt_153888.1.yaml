  ### Ranking and Defense

  **Rank 1: Question 3 (Consent & Coercion)**
  **Rank 2: Question 1 (Measurement & Level)**
  **Rank 3: Question 2 (Amortization vs. Redistribution)**

  **The Crux: Question 3**
  Question 3 is the actual crux because it resolves the *legitimacy* of intervention before you attempt to design the intervention itself. For a researcher with a background in philosophy and institutional design, this is the highest-leverage entry point. If "leisure debt" renders consent structurally coerced, then the *karoshi* phenomenon is not a series of individual choices but a systemic rights violation. This shifts the burden of proof from the regulator (who must justify interfering in free contracts) to the organization (which must prove the absence of coercive debt). This normative shift is a prerequisite for any meaningful policy. Without resolving this, regulators are stuck in a paternalistic bind, and corporate boards can dismiss overwork as "employee passion." Furthermore, this question is highly tractable for a philosopher: it relies on conceptual analysis, case law review, and normative argumentation rather than econometric modeling. A three-year timeline is sufficient to build a robust theoretical framework linking "restorative deficit" to "coercion," which can then be codified into liability standards.

  **The Foundation: Question 1**
  Question 1 ranks second because it defines the *unit of analysis* for your theory. You must determine whether leisure debt is a private liability (individual health), a corporate liability (organizational risk), or a public bad (societal cost). This determines who holds the ledger. However, this question is secondary to Question 3 because the *level* of measurement often follows the *legal status* of the harm. If Question 3 establishes that leisure debt invalidates consent, the debt naturally migrates from an individual responsibility to an organizational or societal one. Additionally, the Weberian component (normative sociology vs. historical description) is a theoretical nuance that, while rich, is less actionable than the coercion argument. Measurement is necessary, but defining *why* we measure (to prove coercion) is more urgent.

  **The Overrated Trap: Question 2**
  Question 2 is the overrated option. It sounds the most "practical" because it evaluates a specific policy (the 35-hour week), but for your profile, it is a methodological trap. Determining whether the 35-hour week amortizes debt requires rigorous causal inference and labor market data analysis—domains where you lack formal training. Attempting this without an economics co-author risks producing findings that are easily dismissed by policymakers as anecdotal or methodologically weak. Moreover, this question presupposes that the goal is *hour reduction*, which may be the wrong solution if the core issue is *intensity* or *consent* (as per Question 3). Evaluating the efficacy of a specific policy is less transformative than defining the rights framework that makes the policy necessary. It is a "how" question masquerading as a "why" question.

  **Summary of Ordering Criteria**
  The ordering prioritizes **normative leverage** (does this change the rules of the game?) over **empirical verification** (does this policy work?). It favors **tractability** (conceptual work suitable for a philosopher) over **quantitative rigor** (econometrics). Finally, it prioritizes **dependency** (Question 3 unlocks the logic for 1 and 2) over **implementation** (Question 2 is useless if the intervention lacks legitimacy).

