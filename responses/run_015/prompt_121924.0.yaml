      *   To understand rule changes, they need to distinguish between rules that govern behavior (object-level) and rules that govern rules (meta-level).
      *   To understand the paradox, they need to see what happens when the meta-level collapses into the object-level (self-reference).
      *   To understand the *logical* knot (vs. political dispute), they need to isolate the normative force (obligation) from the sociological fact (power).
      *   *Sequence:* Rule Structure $\rightarrow$ Hierarchy (Object/Meta) $\rightarrow$ Self-Reference mechanism $\rightarrow$ Conditional Obligation $\rightarrow$ The Paradox (Validity vs. Validity).

