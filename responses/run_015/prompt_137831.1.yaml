answer: |-
  **Definitions**
  *   **Illusionism:** The view that phenomenal consciousness as commonly conceived does not exist; gap reports are false.
  *   **Phenomenal-Realism:** The view that phenomenal consciousness is a real, non-functional feature; gap reports are veridical.
  *   **Quietism:** The view that the hard problem is linguistic or fundamental; no reductive explanation is possible.

  **Desiderata for Meta-Problem Solutions**

  1.  **Explanatory Granularity**
      The solution must explain the specific content of gap reports (e.g., zombie conceivability), not merely their existence. It must account for the inferences drawn from introspection.
      *Status: Non-negotiable.* Without this, the solution fails to address the hard problem's specific pressure.

  2.  **Asymmetry and Scope**
      The solution must explain why gap reports arise in the first-person case but often vanish in the third-person case. It must also explain why other opaque introspective domains (e.g., familiarity) do not generate similar gaps.
      *Status: Non-negotiable.* A general theory of introspective error is insufficient without domain specificity.

  3.  **Cognitive Persistence**
      The solution must distinguish between the mechanism eliciting the report and the mechanism retaining it despite debunking explanations. It must model why knowledge of the mechanism does not always dissolve the intuition.
      *Status: Non-negotiable.* This addresses the resilience of the hard problem intuition against physicalist explanations.

  4.  **Linguistic Contingency**
      The solution must pronounce on whether a population lacking experiential vocabulary would produce gap reports upon prompting. It must state if this predicts their existence, refutes the theory, or is irrelevant.
      *Status: Negotiable/Camp-relative.* Realists may claim concepts are innate; Illusionists may claim they are learned.

  5.  **Reflexive Consistency**
      The solution must account for the status of the theorist's own reports. If gap reports are illusory, the report generating the theory must not be similarly undermined without residue.
      *Status: Non-negotiable.* Self-defeat renders a theory dialectically useless.

  6.  **Framework Neutrality**
      The solution should be acceptable to both Realists and Illusionists as a common premise for dispute.
      *Status: Negotiable/Prejudicial.* This demand is likely incoherent; explaining the *error* of gap reports inherently favours Illusionism, while vindicating them favours Realism.

  7.  **Falsifiability**
      The solution must specify empirical or conceptual conditions under which it would fail. It cannot be compatible with every possible outcome.
      *Status: Non-negotiable.* Unfalsifiable theories are vacuous and cannot serve as evidence.

  **Incompatibility and Exclusion**

  **Incompatible Pair:** *Framework Neutrality* and *Explanatory Granularity*.
  To explain the specific content of gap reports (that experience seems non-physical), one must typically assert whether this content is accurate or erroneous. A truly neutral account remains too vague to satisfy the granularity required to explain the specific inferences users make. Neutrality is therefore a false desideratum.

  **Most Excluding Desideratum:** *Reflexive Consistency*.
  This requirement excludes the most candidate solutions. Illusionist accounts often struggle to explain why their own theoretical reports are trustworthy while denying the trustworthiness of phenomenal reports. Realist accounts often beg the question by assuming the veridicality of the very reports under scrutiny. Quietist accounts frequently evade the requirement entirely.

  **Scorecard Against Candidate Families**

  | Family | Granularity | Consistency | Neutrality | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Illusionism** | High (explains error) | Low (risk of self-defeat) | Low (commits to error) | Fails Consistency |
  | **Realism** | High (accepts data) | Medium (avoids defeat) | Low (commits to truth) | Fails Neutrality |
  | **Quietism** | Low (denies explanation) | High (no claim made) | High (no stance) | Falsifiability |

  *Illusionism* posits gap reports are false. *Realism* posits they are true. *Quietism* posits the question is misguided. Illusionism fails Reflexive Consistency most often. Realism fails Framework Neutrality by definition. Quietism fails Falsifiability by avoiding commitment.

  \answer{Reflexive Consistency}
