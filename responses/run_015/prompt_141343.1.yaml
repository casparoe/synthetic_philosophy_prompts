  Please act as a senior formal epistemologist and game theorist who has sat through several hundred job-market talks and has an unusually good memory for the specific ways that talks like mine die in the question period. Do not flatter the argument and do not hedge: I would rather be told now that a result is indefensible than find out in front of a search committee. Before you write anything, take a short brainstorming pass in which you list every fault line you can see in the sketch below, rate each for how likely it is to be raised by the audience I describe, and only then assemble the prep sheet. Then give me the deliverables in a form I can rehearse from: at most eight objections, ordered by expected damage, each attributed to the kind of person who will raise it and phrased the way that person would actually say it (not in my vocabulary), each with a reply I can give in two minutes or less, and each with an explicit note on where that reply is soft or where I am bluffing. Tell me what I should concede in the first three minutes rather than have it extracted from me, tell me which single reply has to land if the paper is to survive at all, and tell me which of my three results is the most exposed and should be cut to a slide and a promise. Finally, give me the question you think I am hoping nobody asks, and if you think the question I am privately dreading is the wrong one to dread, say so.

  The talk is my job-market paper, "Rationality Is Not Free: Costly Nesting, Bounded Reasoning Depth, and the Backward-Induction Outcome," and the argument is roughly this. Take a finite two-player perfect-information game — I use a six-node centipede — and recall the standard epistemic picture: common knowledge of rationality plus common knowledge of the game form pins down the backward-induction profile, so the first mover takes immediately, while in laboratory centipedes people pass for a few nodes and then take. The usual explanations are altruism or social preferences, uncertainty about the opponent's payoffs, or an exogenously imposed bound on reasoning depth from a level-k or cognitive-hierarchy model. My proposal is that the depth of nesting should be endogenous and costly. Define depth inductively: a depth-1 player best-responds to an unmodelled opponent; a depth-k player best-responds to a depth-(k−1) opponent. Now charge δ per level of nesting, either as a payoff cost δ·k subtracted from the outcome or as a probability (1−δ)^k of completing the inference correctly — I argue the two are equivalent up to a rescaling of stakes, which is one of the claims I am least sure about. Each player then chooses a reasoning depth alongside an action plan, and here is what I claim. Result 1, the one I lead with: for every δ greater than zero the symmetric equilibrium depth is finite, so common knowledge of rationality would cost an infinite amount and is therefore not merely unattainable but forbidden by the very rationality it is supposed to idealize — the standard ideal is self-undermining, and the near-certainty literature that relaxes certainty while keeping the infinite hierarchy buys exactly the wrong thing. Result 2: as δ goes to zero the equilibrium depth diverges and play converges to the backward-induction outcome, so my model nests the standard result as a limit and the empirically observed cooperation is explained by the size of δ rather than by kindness or by payoff uncertainty. Result 3: with unequal δ the cheaper reasoner gains only up to a point — beyond a threshold, extra depth is wasted because the opponent has stopped — and because scaling all payoffs by a factor λ raises the optimal depth, the model predicts that cooperation in the centipede should collapse as stakes rise, a prediction I have no evidence for and no way to check before the talk. A friend who works on reasoning in language models pointed out to me that in her systems extra inference steps cost compute and sometimes make the answer worse, which is where the framing came from, and I would like to open with a version of that analogy; tell me whether that opening will cost me the room.

  The audience is a joint economics-and-philosophy department and the room will be about forty people, but the questions will come from four or five quarters. There are two senior microeconomic theorists who work on the epistemic foundations of equilibrium and who think the point of epistemic analysis is to characterize equilibrium concepts rather than to model deliberation; they will think I have changed the subject. There is a formal epistemologist who treats common knowledge as a fixed point and will want to know whether my depth-k hierarchies are even a well-defined object and what happens to my result under public announcement of the game. There are two behavioral and experimental economists who are broadly sympathetic to level-k and cognitive-hierarchy models, think all the philosophy is decoration, and will demand to know what my extra parameter identifies that theirs does not. There is a philosopher of action who will say that one cannot simply choose how hard to think, so the choice variable at the center of the model is incoherent. And there is an econometrician who will ask, in a friendly way that is not friendly, about identification, about whether δ is a primitive or a residual, and about the stakes prediction. Assume twenty minutes of questions and that I will be interrupted; assume also that I have defended this twice already and that the two objections I got last time — that I am smuggling in altruism, and that a cost on reasoning is just a change of game form — are ones I will get again and need better answers to than I had then.
