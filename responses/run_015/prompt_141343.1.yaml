answer: |-
  ### Brainstorming Pass: Fault Lines & Risk Assessment

  1.  **The "Triviality" Charge (Micro Theorists):** You subtracted $\delta \cdot k$ from payoffs. That is literally changing the utility function. Backward induction still solves *that* game. You haven't undermined BI; you've just solved a different game. *Damage: Fatal.* *Likelihood: Certain.*
  2.  **Identification of $\delta$ (Econometrician/Behavioral):** Is $\delta$ a cognitive cost, a discount factor, or altruism? If you can't distinguish it from discounting without the stakes prediction (which you admit has no data), your parameter is unidentifiable. *Damage: High.* *Likelihood: Certain.*
  3.  **Coherence of "Choosing Depth" (Philosopher of Action):** Agents don't choose $k$ like they choose 'Left' or 'Right'. Reasoning depth is a capacity, not a strategy. Making it a choice variable is category error. *Damage: High.* *Likelihood: High.*
  4.  **Smuggling Altruism/Patience (Micro Theorists - Recurring):** Passing in centipede is usually modeled as discounting or altruism. Your $\delta$ looks exactly like a discount factor over time steps. *Damage: Medium-High.* *Likelihood: Certain.*
  5.  **Empirical Void on Stakes (Experimentalist):** Result 3 predicts cooperation collapses as stakes rise. You admit you have no evidence. This makes Result 3 look like storytelling. *Damage: Medium.* *Likelihood: High.*
  6.  **Epistemic Status of CKR (Formal Epistemologist):** If CKR is "forbidden," what is the common knowledge assumption in your model? Is it Common Knowledge of Costly Rationality (CKCR)? Does the fixed point exist? *Damage: Medium.* *Likelihood: Medium.*
  7.  **Equilibrium Existence/Uniqueness (Micro Theorists):** You claim symmetric equilibrium depth is finite. Have you proven existence for all $\delta$? What about mixed strategies over depth? *Damage: Medium.* *Likelihood: Medium.*
  8.  **LLM Opening Analogy (Senior Theorists/Philosophers):** Comparing human rationality to transformer inference steps may strike the room as category-mistaken or trendy in a bad way. *Damage: Low-Medium.* *Likelihood: Medium.*

  ---

  ### Job-Market Prep Sheet: "Rationality Is Not Free"

  **Constraint:** You have 20 minutes. You will be interrupted. Do not lecture. Do not defend the indefensible.

  #### Objection 1: The Triviality Charge (Game Form Change)
  *   **Who:** Senior Micro Theorist (Epistemic Foundations).
  *   **The Question:** "You've subtracted a cost from the payoff function. That means you've defined a new game. Backward induction applies to this new game just as it did to the old one. You haven't shown rationality is self-undermining; you've just shown that if you change the utilities, the equilibrium changes. This is trivial."
  *   **Your Reply:** "I distinguish between the *physical game form* (the rules of movement and terminal payoffs) and the *epistemic access* to the solution. Standard BI assumes agents have costless access to the fixed point of the reasoning hierarchy. I am modeling the *cost of accessing that fixed point*. If I model this as a utility cost for tractability, it is a reduced-form representation of a computational constraint, not a preference change. The claim is that the *standard* solution concept assumes a costless epistemic state that is physically impossible. I'm not solving a new game; I'm showing the standard solution concept relies on an impossible idealization."
  *   **Soft Spot/Bluff:** **Bluff.** If you subtract from utility, standard theory says you changed the game. You are relying on the room accepting "computational cost" as distinct from "utility cost." If they press on the definition of utility, you lose. Stand firm on "utility represents overall welfare including cognitive effort," but admit this is a modeling choice.

  #### Objection 2: Identification of $\delta$
  *   **Who:** Econometrician / Behavioral Economist.
  *   **The Question:** "You claim $\delta$ explains cooperation better than altruism or uncertainty. But without the stakes data, $\delta$ is just a residual. How do I know this isn't just a discount factor $\delta^t$? What does your parameter identify that a standard discounting model does not?"
  *   **Your Reply:** "In a discounting model, the cost is tied to *time* or *delay*. In my model, the cost is tied to *depth of recursion*. In a centipede, these correlate, but they diverge in games where depth doesn't equal time steps. My model predicts cooperation varies with the *complexity* of the reasoning tree, not just the length of the game. Discounting predicts cooperation falls with time; I predict it falls with branching factor or nesting depth even if time is constant."
  *   **Soft Spot/Bluff:** **Soft.** You need a specific example where depth and time diverge. Have one ready (e.g., a simultaneous move game transformed to extensive form, or a game with trivial nodes). If you don't have a clean example, this reply wobbles.

  #### Objection 3: Coherence of Choosing Depth
  *   **Who:** Philosopher of Action.
  *   **The Question:** "You model agents choosing $k$ alongside their action. But I don't choose how many steps I reason; I just reason until I stop or see the answer. Treating reasoning depth as a strategic choice variable seems incoherent. It's a capacity, not a move."
  *   **Your Reply:** "I agree agents don't consciously count steps. I model $k$ as a meta-strategic choice of *disposition* or *preparation*. Before the game, an agent commits to a level of scrutiny—like deciding how much time to allocate to a problem. The equilibrium is over these dispositions. It's a rational reconstruction of bounded capacity, not a phenomenological claim about conscious counting."
  *   **Soft Spot/Bluff:** **Soft.** This is a standard defense (rational reconstruction), but if the philosopher pushes on "how is this disposition chosen if not by reasoning?", you risk an infinite regress. Cut the reply there; don't elaborate on the meta-choice mechanism.

  #### Objection 4: Smuggling Altruism (Recurring)
  *   **Who:** Senior Micro Theorist (Who asked this last time).
  *   **The Question:** "You promised a better answer than last time. Passing in the centipede is usually altruism. You've added a cost parameter. Why isn't this just a complex way of saying 'players care about each other'? If $\delta$ is low, they pass. That looks like kindness."
  *   **Your Reply:** "Altruism changes the *terminal payoffs* (I care about your outcome). My cost changes the *path to the decision*. Altruism predicts passing even in one-shot simultaneous games if preferences align. My model predicts passing only when reasoning depth is costly relative to the gain from defection. The structural difference is in the comparative statics: altruism is insensitive to game complexity; my model is sensitive to the depth of the tree."
  *   **Soft Spot/Bluff:** **Hard.** This is defensible if you stick to comparative statics. Do not let them equate "passing" with "altruism." Keep the focus on the *mechanism* (depth vs. preference).

  #### Objection 5: The Stakes Prediction (No Evidence)
  *   **Who:** Experimental Economist.
  *   **The Question:** "Result 3 says cooperation collapses as stakes rise. You admit you have no data. Why should we trust a theoretical prediction about behavior that you haven't checked, especially when high-stakes centipede data is mixed?"
  *   **Your Reply:** "I concede I lack empirical verification for Result 3 currently. That is why I present it as a novel prediction, not a fitted explanation. The value of the model is generating this testable distinction. I am proposing this as the next step for experimental validation. The theoretical contribution stands on Results 1 and 2; Result 3 is the empirical hook for future work."
  *   **Soft Spot/Bluff:** **Concession.** Do not bluff here. Admit the lack of data. Frame it as a feature (prediction) not a bug (fitting).

  #### Objection 6: Epistemic Fixed Point
  *   **Who:** Formal Epistemologist.
  *   **The Question:** "You say Common Knowledge of Rationality is forbidden. But your model relies on Common Knowledge of the Game and the Cost Structure. Is there a fixed point? If we announce the game publicly, does the hierarchy collapse or stabilize? What is the epistemic state?"
  *   **Your Reply:** "The epistemic state is Common Knowledge of Costly Rationality (CKCR). The hierarchy stabilizes at finite $k$ because the marginal benefit of depth $k+1$ is less than $\delta$. It is a fixed point of *bounded* reasoning, not infinite. Public announcement confirms the cost structure, reinforcing the finite bound."
  *   **Soft Spot/Bluff:** **Soft.** Ensure you have the math on the fixed point existence ready in an appendix slide. If they ask for the proof, point to the appendix. Do not try to prove it on the board.

  #### Objection 7: Equilibrium Existence/Uniqueness
  *   **Who:** Senior Micro Theorist (Technical).
  *   **The Question:** "You claim symmetric equilibrium depth is finite for $\delta > 0$. Have you proven existence for all game forms? What if there are multiple equilibria in depth selection?"
  *   **Your Reply:** "For the finite centipede, existence is guaranteed by the compactness of the strategy space and continuity of the payoff function in $k$. Uniqueness holds under the specific monotonicity conditions I derive in the appendix. I acknowledge multiple equilibria might arise in more complex graphs, which is a limitation of the current scope."
  *   **Soft Spot/Bluff:** **Soft.** If you haven't proven uniqueness rigorously, admit it. "Uniqueness holds under the conditions specified in Proposition 1." Don't overclaim.

  #### Objection 8: The LLM Opening
  *   **Who:** Senior Theorist / Philosopher (General Room Vibe).
  *   **The Question:** (Likely a comment rather than a question) "Comparing human rationality to transformer inference steps is a category error. Humans aren't computing probabilities over tokens."
  *   **Your Reply:** "I use the LLM analogy strictly to motivate the *cost of computation*, not to equate architectures. The point is that inference steps consume resources, whether silicon or neural. I'm happy to drop the analogy if it distracts from the formal contribution."
  *   **Soft Spot/Bluff:** **Concession.** If the room bristles, drop it immediately. It's not worth the capital.

  ---

  ### Strategic Deliverables

  #### 1. Concessions (First 3 Minutes)
  *   **The "Game Form" Interpretation:** Explicitly state early: "I model computational cost as a payoff subtraction for tractability. I know this looks like changing the game. My claim is that this represents a constraint on *access* to the solution, not a change in preferences over outcomes. I will defend this distinction." (Pre-empts Objection 1).
  *   **The Stakes Data:** "Result 3 predicts cooperation falls as stakes rise. I must concede I do not have empirical evidence for this yet. This is a theoretical prediction I hope to test." (Pre-empts Objection 5).
  *   **The Choice of $k$:** "When I say agents 'choose' depth, I mean they adopt a disposition or strategy of scrutiny, not that they consciously count steps online." (Pre-empts Objection 3).

  #### 2. The Single Reply That Must Land
  *   **Objection 1 (The Triviality Charge).**
  *   **Why:** If the room decides you just changed the utility function, the paper is trivial and the job talk is over.
  *   **Strategy:** You must convince them that *standard* BI assumes costless epistemic access. You are not solving a different game; you are solving the *same* game with a realistic model of the *agent*. The cost is on the *reasoning*, not the *outcome*. Even if modeled as payoff subtraction, the *interpretation* is the key. Do not let them reduce this to "you changed the numbers."

  #### 3. Most Exposed Result
  *   **Result 3 (Unequal $\delta$ / Stakes Prediction).**
  *   **Action:** Cut this to a single slide. Label it "Future Empirical Predictions." Do not spend time deriving it. Promise the data later. If you spend too much time on this, the Econometrician and Experimentalist will tear you apart for lack of evidence. Focus your time on Results 1 and 2 (Theoretical contribution).

  #### 4. The Dreaded Question Analysis
  *   **The Question You Fear:** "Isn't this just altruism?" (You've heard this before).
  *   **The Question You Should Fear:** "What exactly is $\delta$ identified as?" (The Econometrician).
  *   **Why:** The altruism objection is philosophical; you can talk your way out of it with definitions. The identification objection is methodological. If $\delta$ is unidentifiable without data you don't have, your model is empirically empty.
  *   **Advice:** Pivot hard to the *structural* difference (depth vs. time/preference) when asked about identification. Use the "complexity vs. delay" distinction.

  #### 5. The Opening Analogy (LLMs)
  *   **Verdict:** **High Risk.**
  *   **Advice:** Tone it down. Do not open with "LLMs do this." Open with "Computational complexity constraints." Say: "In computational systems, inference steps cost resources. I propose we model human rationality with a similar constraint." Mention LLMs only if asked or as a footnote. Senior economists often view CS analogies as trendy noise. Don't give them a reason to dismiss you as a "tech bro" theorist.

  #### 6. Final Memory Check
  *   You have defended this twice. You know the altruism objection is coming. You have a better answer (structural comparative statics). Use it.
  *   The Micro Theorists care about equilibrium concepts. Ensure you specify the equilibrium concept clearly (Nash over extended strategy space $(k, action)$).
  *   The Philosopher cares about coherence. Ensure you don't claim humans *literally* calculate $\delta$. Claim it's a *model* of boundedness.

  **Final Order:** Get Result 1 and 2 solid. Sacrifice Result 3 if time runs short. Defend the "Costly Access" interpretation against the "Changed Game" charge with your life. Good luck.
