  (a) **Prediction**
  My prediction is that your teacher will rule this cognition **is a *pramā* (true awareness)**, but he will classify it as ** *anumāna* (inference)**, not *pratyakṣa* (perception).

  (b) **Two Divergent Principles**
  Here are two principles that are both fully compatible with the 13 prior verdicts but yield opposite results for the sandalwood case.

  **Principle 1: The "Proper Object" Constraint (Modality Specificity)**
  *   **Statement:** A cognition counts as *pratyakṣa* only if the specific property (*viśeṣaṇa*) being cognized is the proper object (*viṣaya*) of the sense organ currently in contact with the substrate. If the property belongs to a different sense modality (e.g., odor for the nose) but is cognized through a different sense (e.g., the eye), the cognition is *anumāna*, even if it arises immediately.
  *   **Compatibility with Record:**
      *   Fits Cases 1, 2, 6, 11: In all these, the property cognized (pot-shape, identity, absence) is accessible to vision.
      *   Fits Case 4: The jaundiced eye fails because it distorts its *proper* object (color).
      *   Fits Case 8: "Night eating" is not visible; it is an unseen fact inferred from visible fatness. Thus *anumāna*.
      *   Fits Case 7: Fire is unseen, inferred from smoke. Thus *anumāna*.
  *   **Prediction for Sandalwood:** ** *Anumāna* **. The eye sees the log (form/color), but the fragrance is the proper object of the nose. Cognizing smell via sight is inferring an unperceived quality from a perceived mark.

  **Principle 2: The "Inherent Quality" Constraint (Substrate Presence)**
  *   **Statement:** A cognition counts as *pratyakṣa* if the substrate (*dharmin*) is directly perceived and the property cognized is an inherent, static quality of that substrate, provided the cognition arises without a *conscious* step of reasoning (*parāmarśa*). Memory of the association is merely auxiliary (as in Case 6), not the instrument. *Anumāna* is reserved for cognizing *actions* or *facts* not inherent in the immediate visual data (like Case 8).
  *   **Compatibility with Record:**
      *   Fits Cases 1, 2, 6: Substrate is seen; identity/form are inherent.
      *   Fits Case 11: Absence is a quality of the locus (floor) perceived directly.
      *   Fits Case 8: "Night eating" is a *habitual action*, not a static inherent quality of the body like color or smell. Thus, it requires inference.
      *   Fits Case 13: Dream substrate is not present.
  *   **Prediction for Sandalwood:** ** *Pratyakṣa* **. The log (substrate) is seen. Fragrance is a static, inherent quality of sandalwood. The cognition is immediate (no conscious reasoning). Therefore, it is perception of the object *with* its qualities.

  (c) **Analogs and Discriminating Work**
  *   **Closest Analog:** **Case 8 (Fat Devadatta/Night Eating)**.
      *   *Why:* Both cases involve seeing a substrate (Devadatta/Log) and immediately cognizing a feature not currently sensed by the operating organ (Night Eating/Fragrance). Both rely on past experience/memory to bridge the gap.
      *   *Discriminating Work:* This is the case doing the heavy lifting. If the teacher treats Case 8 as *anumāna* because the "night eating" is unseen, he will likely treat the "fragrance" as unseen (supporting Principle 1). If he treats Case 8 as *anumāna* only because "eating" is an *action* rather than a *quality*, he might allow the sandalwood fragrance as *pratyakṣa* (supporting Principle 2).
  *   **Secondary Discriminator:** **Case 6 (Recognition)**.
      *   *Why:* The teacher explicitly allows memory to be *auxiliary* in perception here. The sandalwood case also uses memory (of the smell).
      *   *Discriminating Work:* In Case 6, the *person* is fully present to the eye. In Sandalwood, the *smell* is not present to the eye. The question is whether memory can supply a *missing sense-quality* in perception, or only assist in *identifying* what is already sensed.

  (d) **Best Guess and Defense**
  I rank **Principle 1 (Proper Object Constraint)** higher. My best guess is ** *Anumāna* **.

  **Reasons for Preference:**
  1.  **Conservatism regarding *Pramāṇa* Count:** The teacher resists adding a fifth *pramāṇa* (Case 8, 11). He is willing to stretch *anumāna* to cover *arthāpatti* (postulation). This suggests he prefers to classify "gap-filling" cognitions as inference rather than expanding the definition of perception. The gap between "seeing wood" and "knowing smell" is a causal gap filled by memory, structurally identical to "seeing fat" and "knowing eating."
  2.  **Case 4 (Jaundice) Precedent:** The teacher ruled the yellow conch as *not pramā* because the sense organ was defective regarding its *proper object* (color). This implies he holds a strict view of sense-specificity. If the eye cannot correctly perceive color in Case 4, it is inconsistent to allow it to perceive smell in the Sandalwood case.
  3.  **Case 11 (Absence) Distinction:** He calls absence *pratyakṣa*. In Nyāya, absence is perceived by the *same* sense that would perceive the presence. The eye perceives the empty floor. In the Sandalwood case, the nose would perceive the smell, not the eye. The teacher's acceptance of Case 11 shows he follows the "sense-specific" rule for absence; he should logically follow it for cross-modal qualities too.

  (e) **Further Case to Separate Survivors**
  To definitively test which principle he holds, ask him this case next week:

  **The Case:** "You see a block of ice across the room, far too distant to feel its coldness. You have touched ice before. On seeing it, you judge immediately, 'this is cold'."

  *   **Principle 1 (Proper Object) Prediction:** ** *Anumāna* **. Coldness is the proper object of touch (skin), not sight. Cognizing it via the eye is inference.
  *   **Principle 2 (Inherent Quality) Prediction:** ** *Pratyakṣa* **. Ice is the substrate seen; coldness is an inherent, static quality. No conscious reasoning occurs.

  **What his answer shows:**
  *   If he says *Anumāna*, he commits to strict sensory modality boundaries (Principle 1).
  *   If he says *Pratyakṣa*, he commits to a holistic object-perception where inherent qualities are co-perceived with the form (Principle 2).

  (f) **Philosophical Commitments**
  Here is what he would be conceding under each option:

  *   **If he rules *Pratyakṣa*:**
      *   **Boundary of Perception:** He is expanding *pratyakṣa* beyond strict sense-object contact (*indriyārtha-sannikarṣa*). He concedes that perception can include qualities not currently stimulating the sense organ, provided they are associated with the substrate.
      *   **Risk:** This blurs the line between perception and memory-based inference. If "seeing cold" is perception, why is "seeing night-eating" (Case 8) inference? He would need a robust theory of "inherent qualities" vs. "facts" to maintain consistency.

  *   **If he rules *Anumāna*:**
      *   **Reach of Inference:** He concedes that a vast amount of daily "perceptual" experience is technically inferential. We rarely see "fire" without inferring "heat," or "food" without inferring "taste."
      *   **Benefit:** This preserves the purity of *pratyakṣa* as raw sense-data. It aligns with his treatment of Case 8 (subsuming postulation under inference). It maintains that *pramāṇas* are defined by their *causal structure* (eye-contact vs. memory-link), not just the phenomenological feeling of immediacy.

  **Final Advice:** Given his handling of Case 8 (collapsing *arthāpatti* into *anumāna*) and Case 4 (sense-defect specificity), he is signaling a commitment to **causal structure over phenomenological immediacy**. The cause of the sandalwood cognition is memory-association, not just eye-contact. Therefore, *anumāna* is the consistent verdict.
