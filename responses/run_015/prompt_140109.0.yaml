answer: |-
  **Session arc**

  1.  **Individual Rationality (10 mins):** Establish that individuals satisfy vNM axioms. *Makes available:* Individual utility functions ($U_i$), unique up to positive affine transformation.
  2.  **Social Preferences (10 mins):** Posit a social ordering over the same lotteries. *Makes available:* A social welfare function ($W$) to be constrained.
  3.  **Pareto Indifference (10 mins):** If all individuals are indifferent between lotteries, society is indifferent. *Makes available:* The dependency of $W$ on $U_i$; rules out social preferences unrelated to individual welfare.
  4.  **Social vNM Axioms (15 mins):** Require society to satisfy Independence and Continuity over lotteries. *Makes available:* The linearity of $W$. This is the crucial step: Pareto connects $W$ to $U_i$, but Social vNM dictates the *linear* form.
  5.  **Aggregation Theorem (10 mins):** Derive $W = \sum a_i U_i$. *Makes available:* The formal result that rational social planning implies weighted utilitarianism.
  6.  **The Weights Problem (15 mins):** Discuss affine transformations. Changing $U_i$ scales changes $a_i$. *Makes available:* Understanding that the theorem proves existence of weights, not their equality. Equal weights require unit comparability.
  7.  **Impartial Observer (10 mins):** Introduce the observer argument. Equal chance of being anyone implies equal weights *if* units are comparable. *Makes available:* A normative justification for specific weights, distinct from the aggregation logic.
  8.  **Axiom Critique (10 mins):** Ask what happens if we drop Social Independence. *Makes available:* Space for prioritarianism (which violates Social vNM) without labeling it irrational.

  **The case**

  Your coin-flip example (sure 40/60 vs. lottery 90/10/10/90) is effective because it separates ex post equality (sure thing) from ex ante equality (lottery). Person 1 prefers the lottery (expected 50 > 40); Person 2 prefers the sure thing (60 > 50). This conflict demonstrates why Pareto alone cannot decide the case, necessitating the aggregation theorem. However, warn students that Harsanyi's solution (ranking by expected utility) privileges the ex ante perspective.

  Use the loaded-dice variant (probability proportional to life-years) immediately after Step 7. It illuminates the role of the equal-chance assumption by showing that changing observer probabilities changes the weights. This clarifies that the Aggregation Theorem permits any weights, while the Impartial Observer argument selects specific ones. Do not use it earlier, or it will confuse the derivation of the linear sum with the justification for equal weighting.

  **Misconception map**

  1.  **"Pareto does all the work":** Students will think unanimity forces the sum. Head this off at Step 4. Explain that Pareto ensures $W$ respects individual preferences, but only Social Independence forces the *linear* aggregation. Without Social vNM, $W$ could be a concave sum (prioritarianism) while still satisfying Pareto.
  2.  **"Weights are mere convention":** The departmental quip arises at Step 6. Defuse it by distinguishing *representation* from *normativity*. The theorem proves a representation exists given scales. The "artefact" worry is correct regarding the *values* of weights without fixed units, but the *linearity* is not artefactual. Acknowledge the limit: the theorem requires interpersonal comparability to yield definite policy recommendations.
  3.  **"Harsanyi refutes prioritarianism":** This emerges at Step 8. Clarify that prioritarianism is not irrational simpliciter; it is incompatible with *Social Independence*. Framing it as a choice of axioms (social risk neutrality vs. aversion) prevents the conclusion that prioritarianism is mathematically disallowed.
  4.  **"Equal weights are theorem-derived":** Correct this at Step 7. The theorem yields weighted utilitarianism; equal weights come from the additional impartial observer premise (equal probability), not the aggregation logic itself.

  **The check**

  Put this question to them: "If we retain Pareto Indifference but drop the requirement that social preferences satisfy the Independence axiom, does the Aggregation Theorem still hold?"

  A wrong-but-confident answer will be: "Yes, because Pareto ensures society respects individual rationality, so the sum must still be linear." This reveals they believe Pareto drives the linearity.

  The correct answer is: "No. Without Independence, social preferences over lotteries need not be linear in individual utilities. We could sum a concave transformation of utility (prioritarianism) without violating Pareto." This confirms they understand that Social vNM, not Pareto, carries the structural weight.

  **What I'll leave out**

  I will refuse to go into the formal linear algebra proof of the theorem. At this level, the intuition behind the axioms matters more than the derivation. I will name this "Formal proof mechanics" and note that it is available in the reading but not required for the philosophical critique. I will also leave out the detailed debate between Harsanyi and Rawls regarding the veil of ignorance. I will label this "Alternative meta-ethical foundations" and explain that focusing on it would distract from the specific logical structure of the aggregation argument we are analysing today.

  **Settled vs contested**

  **Settled:** Among specialists, the mathematics is uncontested: given individual vNM utilities, Social vNM axioms, and Pareto Indifference, the social welfare function must be a linear weighted sum. It is also settled that vNM utilities are unique only up to positive affine transformation, meaning weights are scale-dependent.

  **Contested:** Whether the Social Independence axiom is normatively appropriate is heavily disputed. Many political theorists reject social risk neutrality, arguing society should be risk-averse over welfare distributions (favouring prioritarianism). Furthermore, whether this theorem supports "utilitarianism" depends on contested claims about interpersonal utility comparability.

  **Pedagogical Flag:** My recommendation to treat the theorem as a consistency check rather than a proof of utilitarianism is a contested reading. Some economists treat the theorem as a stronger normative defence. I will present it as the former to encourage critical engagement with the axioms.
