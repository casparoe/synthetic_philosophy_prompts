      *   *Section 1: Classification (Testimony vs. Experience).* Argue that for Hume, mediation breaks the chain of direct causation. The "sensor" is a witness. The "viewer" is a recipient of testimony.
      *   *Section 2: The Bayesian/Probabilistic Weighing.* Address the "Synthetic Corroboration." Explain why $N$ witnesses $\neq$ $N \times$ Reliability if errors are correlated. Hume understood collusion (religious sects); he would apply this to networked infrastructure.
      *   *Section 3: The Shift in "Uniform Experience".* This is crucial. Hume's argument rests on the firmness of natural law. But now, "digital integrity" is part of our empirical background. The probability of a deepfake is higher than a resurrection.
      *   *Section 4: Internal Tensions.* Discuss the conflict between the *psychological force* of the image (which Hume knows is powerful) and the *logical weight* of the evidence. Also, the tension of trusting the "uniform experience" of physics vs. the "uniform experience" of tech vulnerability.
