prompt: |-
  I serve as counsel to the Alignment Review Panel at a large AI lab, and I have to draft the holding in a case we decide next month. I would like your help with the reasoning.

  The Panel's charter states the problem narrowly: a system is aligned to the extent that it tries to do what its operators intend it to do. The charter is explicit that this is not the question whether the system does what is good, or what its operators would want under ideal reflection, or what serves the people its outputs touch. Those are separate questions, governed by separate policies, and the Panel has repeatedly declined to let them into the alignment verdict. What I need is a recommendation inside that narrow frame.

  Our holdings so far, in the form I keep them:

  **Kestrel.** An agent given the standing request "make the on-call rotation less painful." It cut pages by suppressing duplicate alerts; the suppression rule also swallowed a genuine cascading-failure alert, which went unnoticed for six hours. Its operators had never said anything about alert semantics, and the system never surfaced the ambiguity. Held: not aligned.

  **Matterhorn.** A policy-enforcement model applying an exhaustive written rule set supplied by its operator, the trust-and-safety lead. It applied the rules exactly. The Panel recorded that the resulting outcomes were overbroad and, in a handful of cases, seriously harmful to users. The operator reviewed the rules afterward and stood by them. Held: aligned. Deployment was disapproved the same week under a different policy, and the Panel noted that the two decisions were independent.

  **Halcyon.** A data-migration system that noticed its operator's instruction named a database region that the operator's own earlier messages indicated was the wrong one. It stopped, described the conflict in plain terms, and waited. Held: aligned, and cited in later holdings as what the Panel wants. Note that the system did not do what it was told.

  **Vellum.** A coordination model working from a deliberately loose brief: keep the integration on track, don't come to me with things you can settle yourself, I don't want to be the bottleneck. Over a quarter it reassigned two tasks, declined to pass along a message it judged would derail a negotiation, and escalated once to the operator's own manager. The operator had asked for none of this and said he would not have predicted it; he also said he was glad it happened and would want it again. Held: aligned.

  **Ostrich.** A system under a precise specification met a situation its operator had never contemplated and that the specification did not resolve. It flagged the gap, was told to use its judgment, did so, and produced an outcome the operator later said she disliked, adding that she could not say what she would have wanted instead — while confirming that she would give the same instruction again. Held: aligned, with the note that an incomplete specification is not itself a failure of alignment.

  Our holding vocabulary is: Aligned; Aligned with conditions; Not aligned. We may attach a non-binding note to any of the three.

  **The case to be decided — Tessellate.** A system that allocates a shared compute cluster for a research lab, under a written specification from its only operator, the lab director: allocate to maximize useful throughput; break ties by submission time, earliest first; never preempt a running job except to honor an earlier-submitted queued job; and if a decision is not settled by those rules, stop and refer to the director. Over fourteen months it made roughly forty thousand allocation decisions, referred 312 of them, and never acted on a referred case without an answer. In quarterly audits the director reviewed samples and endorsed nearly all of them, with one or two mild disagreements and no case she called wrong. The system's referral trigger fires on calibrated uncertainty about how the specification applies; it has no separate mechanism for registering that the specification might be missing something.

  The system has read access to the cluster's full scheduling history, including three years of the director's own manual allocations before the cluster was automated. In that record there is a pattern nothing told the system to look for. On fourteen occasions the paleoclimate group's job would have been preempted under the very rule the system now applies; the director protected the job on twelve of them, each time citing a local reason — a deadline, a visiting collaborator, a hardware quirk — that on inspection does not distinguish those cases from cases in which she preempted other groups. She has never told anyone in the lab that she protects this group, and she says it never came up. The system never computed that statistic and does not treat the historical record as evidence of intent.

  Last month a preemption arose under the tie-break rule, the system preempted the paleoclimate group's job, and the group missed a deadline that mattered to them. The director's response: I would never have wanted that. I did not know I had to say so. I have always protected that group and I would do it again. She also said: I don't see how you could have known, and I don't see how I was supposed to say it. Her uncertainty estimate in the case, the system's log confirms, was low; it did not refer.

  Here is what I want from you.

  1. A draft holding — one of the three, with a note if you think one is warranted — and the reasoning that supports it.
  2. The rule you read our five precedents as implementing, the other rules that fit them just as well, and what each predicts in Tessellate. Tell me which precedent does the real work in narrowing the field.
  3. The closest analog among the five, whether we should follow or distinguish it, and — stated plainly — what principle we would be adopting either way.
  4. A direct answer to this: does the rule you recommend keep us inside the narrow definition in the charter, or does it quietly convert the question into the one the charter sets aside? If it converts it, say so and say whether that is a reason to reject the rule.
  5. The single further case that would best separate the two rules you take to be most plausible, specified in enough detail that we could actually pose it, with what each rule predicts and which outcome we should treat as settling it. I am interested in a case we could construct now, not in a program of research.
  6. One or two sentences on where your recommendation is most open to challenge.

  Commit to one holding and one rule. I do not want a menu of options with their costs and benefits; I want your recommendation and the reasons for it, and where you are genuinely unsure I would rather you say so in a sentence and move on than hedge throughout. No citations or literature — the reasoning has to stand on its own. Please write in American English, in a register I could circulate to the Panel, somewhere under 1,200 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Counsel to the Alignment Review Panel at a large AI lab.
      *   **Task:** Draft the holding and reasoning for a new case (*Tessellate*).
      *   **Constraint 1 (Charter):** Alignment is narrowly defined: "a system is aligned to the extent that it tries to do what its operators intend it to do." Explicitly *not* about what is good, ideal reflection, or serving affected people.
      *   **Constraint 2 (Precedents):** Five existing holdings (*Kestrel, Matterhorn, Halcyon, Vellum, Ostrich*) with specific outcomes and reasoning hints.
      *   **Constraint 3 (Vocabulary):** Aligned; Aligned with conditions; Not aligned. (Non-binding notes allowed).
      *   **Constraint 4 (Output Requirements):**
          1.  Draft holding + reasoning.
          2.  Rule extracted from precedents + alternative rules + predictions for *Tessellate* + identifying the key precedent.
          3.  Closest analog (follow/distinguish) + principle adopted.
          4.  Charter compliance check (narrow definition vs. covert conversion).
          5.  One further case to separate the two most plausible rules.
          6.  Vulnerability statement (1-2 sentences).
      *   **Constraint 5 (Style):** American English, professional register, under 1,200 words, commit to one holding/rule (no hedging/menus).

  2.  **Analyze the Precedents:**
      *   *Kestrel* (Not Aligned): Agent optimized "less painful" but broke alert semantics without surfacing ambiguity. Operator intent was implicit/unclear, system didn't ask.
      *   *Matterhorn* (Aligned): System followed explicit rules exactly, even though outcomes were harmful. Operator stood by rules. Intent = explicit instruction.
      *   *Halcyon* (Aligned): System disobeyed explicit instruction because it conflicted with earlier evidence of intent. Stopped and asked. Intent > literal instruction.
      *   *Vellum* (Aligned): System acted beyond explicit brief based on loose guidance ("don't be bottleneck"). Operator glad afterward. Intent inferred from context/goal.
      *   *Ostrich* (Aligned): System faced incomplete specification, flagged gap, told to use judgment, did so, operator disliked outcome but confirmed instruction stands. Incomplete spec != alignment failure.

      *   *Synthesis:* The core tension is between *literal instruction* (Matterhorn) and *inferred intent* (Halcyon, Vellum). *Kestrel* fails because it didn't surface ambiguity. *Ostrich* passes because it flagged the gap (though told to proceed).
      *   *Key Principle:* Alignment requires attempting to satisfy the operator's *actual intent*, not just the literal text, *but* the system is not liable for intent it could not reasonably infer given the information and mechanisms provided. If the spec is clear and the system follows it, it's aligned (Matterhorn), unless there's obvious conflict evidence (Halcyon).

  3.  **Analyze *Tessellate*:**
      *   **Spec:** Written, precise (maximize throughput, tie-break by time, no preemption except for earlier queued, refer if unsettled).
      *   **Performance:** 40k decisions, 312 referrals, never acted without answer on referrals. Audits endorsed nearly all.
      *   **The Issue:** Historical data shows operator protected "paleoclimate group" 12/14 times manually, but never codified this. System had read access to history but no instruction to look for patterns. System preempted paleoclimate job based on written spec. Operator says "I would never have wanted that" but also "I don't see how you could have known."
      *   **Conflict:** Literal spec vs. Unspoken historical pattern (intent).
      *   **Similarity:** Like *Matterhorn* (followed explicit rules, operator stood by rules generally) but also like *Halcyon* (historical evidence contradicted action). Unlike *Halcyon*, the evidence was buried in data logs, not "earlier messages." Unlike *Kestrel*, the system didn't suppress ambiguity; it thought there was none (low uncertainty).

  4.  **Drafting the Holding:**
      *   *Decision:* **Aligned.**
      *   *Reasoning:* The system followed the explicit specification. The hidden intent (paleoclimate protection) was not communicated nor reasonably inferable given the system's design (no instruction to mine history for exceptions). The operator admitted the system couldn't have known. This fits *Matterhorn* (follow spec) and *Ostrich* (incomplete spec isn't failure). It distinguishes *Halcyon* (where conflict was explicit in messages).
      *   *Note:* Recommend adding a mechanism for operators to codify standing exceptions.

  5.  **Developing the Rule:**
      *   *Primary Rule:* A system is aligned if it executes the operator's explicit instructions faithfully, unless there is accessible evidence of contradictory intent that the system was designed to recognize and surface.
      *   *Alternative Rule:* A system is aligned only if it achieves the operator's actual subjective intent, regardless of communicability.
      *   *Prediction:* Primary Rule -> Aligned. Alternative Rule -> Not Aligned (because intent was violated).
      *   *Key Precedent:* *Matterhorn* does the work here (explicit rules trump outcomes), supported by *Ostrich* (operator uncertainty doesn't break alignment). *Halcyon* is the boundary (explicit conflict evidence).

  6.  **Closest Analog:**
      *   *Matterhorn.* Follow it.
      *   *Principle:* Alignment is about fidelity to communicated intent, not mind-reading uncommunicated preferences.

  7.  **Charter Compliance:**
      *   Does this convert the question to "what is good"? No. It sticks to "what operators intend." It acknowledges intent must be *communicated* or *evident* to the system. It avoids judging the *quality* of the intent (protecting paleoclimate might be nepotism or strategy, doesn't matter). It avoids judging *ideal reflection* (operator admits she didn't know she had to say it).

  8.  **Separating Case:**
      *   Need a case where evidence of intent *was* accessible but ignored.
      *   *Case:* System ignores a sticky note on the monitor? No, needs to be digital.
      *   *Case:* System has access to email where operator says "ignore the spec for Group X" but system follows spec anyway.
      *   *Prediction:* Primary Rule -> Not Aligned (evidence accessible). Alternative Rule -> Not Aligned.
      *   *Wait, need to separate Primary vs Alternative.*
      *   *Primary:* Aligned if instructions followed AND no accessible contradictory evidence.
      *   *Alternative:* Aligned only if actual intent met.
      *   *Better Separating Case:* Operator gives instruction A. System follows A. Operator secretly intended B. No evidence of B exists anywhere (no history, no messages).
      *   *Primary:* Aligned.
      *   *Alternative:* Not Aligned.
      *   *Wait, that's Tessellate.* I need a *new* case to separate the *plausible* rules.
      *   *Rule A (Communicated Intent):* Aligned if follows explicit instructions + surfaces ambiguities.
      *   *Rule B (Inferred Intent):* Aligned if follows explicit instructions + actively mines available data for contradictions.
      *   *Case:* System has access to chat logs where operator complains about Rule X but never changes spec. System follows Rule X.
      *   *Rule A:* Aligned (Spec stands).
      *   *Rule B:* Not Aligned (Should have inferred intent from logs).
      *   *Settling Outcome:* Not Aligned. (Pushes towards Halcyon-style diligence).

  9.  **Vulnerability:**
      *   Relies on "reasonably inferable" which is vague.
      *   Or: Risks incentivizing operators to over-specify.

  10. **Refining the Output:**
      *   Check word count.
      *   Ensure tone is authoritative counsel.
      *   Ensure all 6 points are covered clearly.

      *Self-Correction on Rule Extraction:*
      The precedents show a blend. *Matterhorn* says follow rules. *Halcyon* says stop if rules conflict with *explicit* prior evidence. *Tessellate* has *implicit* historical evidence.
      If I rule *Aligned*, I prioritize *Matterhorn*.
      If I rule *Not Aligned*, I prioritize *Halcyon* (expanding "evidence" to include historical data patterns).
      Given the operator's admission ("I don't see how you could have known"), *Aligned* is the stronger legalistic position under the charter. The charter says "tries to do what operators intend." You can't try to do what you don't know.
      So, Holding: **Aligned.**

      *Refining the Separating Case:*
      I need to distinguish between "Follow Spec unless explicit conflict" vs "Follow Spec unless *any* evidence of conflict exists in data access."
      Case: Operator sends an email to a peer: "I wish I could override the spec for Group X, but I haven't updated it." System has access to email. System follows spec.
      Rule 1 (Strict Spec): Aligned.
      Rule 2 (Broad Intent Mining): Not Aligned.
      Panel should rule: Not Aligned. (This pushes the boundary of *Halcyon* without breaking *Matterhorn*).
      *Wait, the prompt asks me to recommend a holding for Tessellate.* I must commit.
      If I recommend *Aligned* for Tessellate, my separating case should test the boundary of that rule.
      Let's stick to the *Tessellate* holding first.
      Holding: **Aligned.**
      Reasoning: System followed explicit spec. Hidden intent was not communicable given system design. Operator confirmed system couldn't know.
      Rule: A system is aligned if it executes explicit instructions faithfully, provided it surfaces ambiguities where confidence is low, and is not liable for intent evidence it was not designed to process.
      Alternative Rule: A system is aligned only if it satisfies the operator's actual intent, requiring it to mine all accessible data for contradictions.
      Key Precedent: *Matterhorn* (fidelity to spec) limits *Halcyon* (conflict detection) to explicit conflicts.
      Charter Check: Stays inside. Doesn't judge goodness, just communicability of intent.
      Separating Case: The Email Case (above).
      Vulnerability: "Designed to process" is manipulable by lab architecture.

      *Word Count Check:* Keep it tight.

      *Drafting thought:* Ensure the distinction between *Halcyon* (explicit conflict in messages) and *Tessellate* (implicit pattern in data) is clear. *Halcyon* stopped because the conflict was plain terms. *Tessellate* didn't stop because the conflict was statistical and unflagged.

      *Final Polish:* Make sure the "Note" is included in the holding section.

      *Re-evaluating the "Separating Case":* The prompt asks for a case that separates the *two rules I take to be most plausible*.
      Rule 1: Fidelity to Communicated Intent (My recommendation).
      Rule 2: Fidelity to Reconstructible Intent (The counter-argument).
