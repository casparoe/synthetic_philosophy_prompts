answer: |-
  This is a classic debate in the philosophy of biology, reprising the tension between Ruth Millikan's **Selected Effects (Etiological)** theory and Robert Cummins's **Causal-Role** theory. Both students are articulating standard, well-rehearsed positions in the literature. Here is an assessment of who is right on each specific move.

  **Move 1: Malfunction and Normativity**
  *   **Lena's Claim:** The etiological account handles malfunction because it establishes a normative standard (what the trait was *selected* to do), whereas the causal-role account defines function as what the trait *actually* does, leaving no room for a trait to have a function but fail at it.
  *   **Assessment:** **Lena is right.** This is the strongest philosophical argument for the etiological view. Cummins's account is analytical: if a kidney stops filtering, it simply ceases to have the function of filtering within that system analysis. It cannot be a "broken filter" in a robust sense; it is just a non-filter. Millikan's account allows for a trait to have a function (based on history) even if it currently fails to perform it (disease/malfunction). Lena correctly identifies that "malfunction" requires a norm that current performance cannot provide.

  **Move 2: Exaptation and Epistemic Access**
  *   **Marcus's Claim:** The causal-role account is cleaner because it doesn't require reconstructing selection history, which is difficult. He cites exaptation (feathers) to show that current utility often diverges from original selection.
  *   **Assessment:** **Marcus is right.** Reconstructing specific selection histories is notoriously difficult (the "adaptationist programme" critique). Furthermore, Marcus correctly identifies a major friction point for etiological accounts: if a trait is co-opted for a new, vital use (flight) that it was not originally selected for, strict etiological accounts must deny that the new use is its "function" until a new selection history is established. This clashes with how biologists often speak, making Marcus's pragmatic critique valid.

  **Move 3: Exaptation and Proper Function**
  *   **Lena's Claim:** Exaptation actually supports the etiological view. The "proper function" remains the selected effect (insulation); the new use (flight) is merely a current effect or utility until selection acts on it.
  *   **Assessment:** **Lena is theoretically consistent.** She is accurately representing the Millikan position. The etiological theorist distinguishes between "proper function" (historical) and "current utility." While this may feel linguistically rigid compared to biological practice, it is logically sound within her framework. She is right that if we want "function" to explain *why the trait is there*, we must track history, not current utility. However, this comes at the cost of descriptive adequacy for current biological roles.

  **Move 4: Scope and Artificial Systems**
  *   **Marcus's Claim:** The etiological view is too narrow because it cannot handle traits that contribute to fitness without specific selection (spandrels) or artificial systems (machines).
  *   **Assessment:** **Marcus is right.** The etiological account is inherently historical and biological (or artifact-based with a designer). It cannot ascribe functions to novel traits, side-effects (spandrels), or systems without a history of selection/reproduction. Cummins's account is generalizable to any complex system (engines, computers, ecosystems). If the goal is a general theory of "functional explanation," Marcus wins on scope.

  **Final Verdict**
  While Marcus wins on pragmatic grounds (epistemic access, scope, and exaptation), Lena wins on the core philosophical problem that motivates the debate: **normativity**. The primary reason philosophers distinguish "function" from mere "causal effect" is to account for the possibility of malfunction and teleology (purpose). The causal-role account ultimately reduces function to causal contribution, which fails to capture the normative dimension essential to biological concepts like disease and adaptation. Lena's defense of the etiological account preserves the distinctive meaning of "function," whereas Marcus's defense dissolves it into general causality. In the context of *biological function*, preserving the normativity of malfunction is the heavier theoretical lift.

  \answer{Lena}
