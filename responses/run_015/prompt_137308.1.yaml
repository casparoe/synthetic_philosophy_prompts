  ### The Taxonomy Tree

  To use this tree, start at the top and follow the path of claims you accept. If you reach a leaf labeled **"Empty,"** that combination of views is generally considered incoherent or unoccupied.

  **1. Is the moral quality of an act determined *solely* by the state of the world it produces (suffering/welfare)?**
  *   **YES:** (Consequentialist Wing)
      *   **2. Is the "state of the world" defined as the impartial sum of all beings' welfare, or the agent's own karmic trajectory?**
          *   **Impartial Sum:**
              *   **3. For a liberated being in a consequence-free context (Lone Arhat), is there still a "correct" answer to "what should I do"?**
                  *   **NO:** → **Leaf A: The Impartial Minimizer**
                  *   **YES:** → **Leaf B: Empty (Incoherent)**
          *   **Agent's Trajectory:**
              *   **3. For a liberated being in a consequence-free context (Lone Arhat), is there still a "correct" answer to "what should I do"?**
                  *   **NO:** → **Leaf C: The Karmic Prudentialist**
                  *   **YES:** → **Leaf D: Empty (Incoherent)**
  *   **NO:** (Non-Consequentialist Wing)
      *   **2. Is the primary standard the *intention* at the moment of acting, or the *character* of the agent?**
          *   **Intention:**
              *   **3. Can a fully compassionate intention rightly include an act that physically harms a being (e.g., killing)?**
                  *   **NO:** → **Leaf E: The Strict Intentionalist**
                  *   **YES:** → **Leaf F: The Pure Intention Exceptionalist**
          *   **Character:**
              *   **3. Can a fully cultivated character rightly include an act that physically harms a being?**
                  *   **YES:** → **Leaf G: The Sacrificial Bodhisattva**
                  *   **NO:**
                      *   **4. For a liberated being in a consequence-free context (Lone Arhat), is there still a "correct" answer to "what should I do"?**
                          *   **YES:** → **Leaf H: The Objective Virtue Theorist**
                          *   **NO:** → **Leaf I: The Spontaneous Naturalist**

  *(Note: To keep the tree manageable, Leaf F and Leaf G are functionally very similar regarding the "Ship Captain" case, but differ on whether bad karma is generated. Leaf B and Leaf D are marked Empty because if consequences are all that matter, a consequence-free context eliminates the basis for "correctness.")*

  ---

  ### The Leaves

  **Leaf A: The Impartial Minimizer**
  *   **Most Awkward Commitment:** In the abandoned monastery, the Arhat has no moral reason to avoid stepping on ants since no welfare is at stake.
  *   **Test Cases:** Kills Captain (Yes); Gift Value (Depends on recipient's welfare); Accidental Insect (Regrettable but not wrong); Lone Arhat (No duty).

  **Leaf B: Empty (Incoherent)**
  *   **Status:** Unoccupied.
  *   **Reason:** If rightness is *solely* about outcomes, there can be no "correct" action when there are no outcomes.

  **Leaf C: The Karmic Prudentialist**
  *   **Most Awkward Commitment:** You must let 500 people die rather than kill one, because killing ruins your own mind-stream.
  *   **Test Cases:** Kills Captain (No); Gift Value (Depends on recipient's virtue); Accidental Insect (No bad karma); Lone Arhat (No duty).

  **Leaf D: Empty (Incoherent)**
  *   **Status:** Unoccupied.
  *   **Reason:** Same as Leaf B; personal karmic trajectory ends for an Arhat, so no "correct" path remains.

  **Leaf E: The Strict Intentionalist**
  *   **Most Awkward Commitment:** A well-intentioned disaster is morally superior to a clumsy success that saves lives.
  *   **Test Cases:** Kills Captain (No); Gift Value (Depends on giver's faith); Accidental Insect (No blame); Lone Arhat (Duty exists via intention).

  **Leaf F: The Pure Intention Exceptionalist**
  *   **Most Awkward Commitment:** Killing is sometimes karmically neutral if the mind is pure, which contradicts the law that volition determines karma.
  *   **Test Cases:** Kills Captain (Yes); Gift Value (Depends on intention); Accidental Insect (No blame); Lone Arhat (Duty exists via intention).
  *   **Verbal Note:** This differs from **Leaf A** mainly verbally on the Ship Captain case (both say "Kill"), but Leaf F claims no bad karma is generated, whereas Leaf A claims the act is net good.

  **Leaf G: The Sacrificial Bodhisattva**
  *   **Most Awkward Commitment:** The agent must willingly accept rebirth in hell to save others, making enlightenment secondary to compassion.
  *   **Test Cases:** Kills Captain (Yes, accepting karma); Gift Value (Depends on compassion); Accidental Insect (No blame); Lone Arhat (Duty exists via vows).
  *   **Verbal Note:** This differs from **Leaf F** on whether bad karma is *generated* (Leaf G says Yes, Leaf F says No).

  **Leaf H: The Objective Virtue Theorist**
  *   **Most Awkward Commitment:** Morality exists even when no one is there to be harmed or helped.
  *   **Test Cases:** Kills Captain (No); Gift Value (Depends on virtue); Accidental Insect (No blame); Lone Arhat (Duty exists objectively).

  **Leaf I: The Spontaneous Naturalist**
  *   **Most Awkward Commitment:** "Morality" dissolves entirely upon enlightenment; the Arhat acts like a force of nature, not a moral agent.
  *   **Test Cases:** Kills Captain (No); Gift Value (Irrelevant); Accidental Insect (Irrelevant); Lone Arhat (No duty, just nature).
  *   **Verbal Note:** This differs from **Leaf H** only verbally on the Lone Arhat case; both describe the same behavior (not stepping on ants), but disagree on whether "should" applies.

  ---

  ### Unoccupied Combinations (Empty Cells)

  *   **Consequentialism + Arhat Duty:** (Leaves B & D). It is incoherent to claim an act is right *solely* because of its consequences, and then claim it is right when there are *no* consequences.
  *   **Karmic Prudentialism + Killing Captain:** It is unattractive/incoherent to claim one should optimize their own karma while simultaneously performing an act that guarantees severe negative karma.

  ### Testing Your Suspicion

  You suspected that the **Impartial Minimizer (Leaf A)** and the **Character-Based views (Leaves H & I)** agree on nearly every case and come apart mainly over the empty monastery.

  *   **Ship Captain:** Leaf A says **Kill** (Net welfare). Leaf H says **Don't Kill** (Virtue doesn't kill). Leaf I says **Don't Kill** (Nature doesn't kill).
      *   *Result:* They **disagree** here, unless you adopt the Mahāyāna Character view (Leaf G), which says **Kill**.
  *   **Accidental Insect:** Leaf A says **Bad Outcome** (but excusable). Leaf H/I say **No Blame**.
      *   *Result:* They largely **agree** on the moral assessment (no fault), though for different reasons.
  *   **Lone Arhat:** Leaf A says **No Duty**. Leaf H says **Duty**. Leaf I says **No Duty (but acts anyway)**.
      *   *Result:* This is the strongest point of divergence. Leaf A stops acting morally; Leaf H continues; Leaf I continues but drops the "ought."

  If your forum argues that "Buddhist ethics is consequentialist," they are likely debating between **Leaf A** (Impartial) and **Leaf C** (Karmic Prudence). If they argue about the Arhat, they are debating between **Leaf A** and **Leaf H/I**. The tree shows these are distinct disagreements.
