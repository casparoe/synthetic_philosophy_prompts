prompt: |-
  I'm a third-year maths-and-philosophy student, and on Thursday I'm taking one of the problem sessions for a first-year course called Chance, Symmetry and Evidence. The students can integrate a density and have met the uniform distribution on an interval, but they have no measure theory, no group theory, and no formal epistemology, and I have twenty-five minutes to use the paradox that goes back to Bertrand — the probability that a random chord of a circle is longer than the side of the inscribed equilateral triangle, with the three familiar answers 1/3, 1/2 and 1/4 each falling out of a parameterization that sounds equally random — to get them to see what goes wrong with the principle of indifference, or principle of insufficient reason, when it is applied to a continuous quantity. I don't need the paradox explained to me: I need a plan for explaining it, and the part I keep getting wrong is the sequencing.

  Three things in particular. First, the order and the dependencies: which idea has to be in place before the paradox can even look like a problem rather than a trick — my instinct is that the three chord answers cannot come first, because students who see 1/3, 1/2 and 1/4 before they have felt the pull of the original question just conclude that the question was vague and move on, and that instead something has to be built first about what an indifference argument is supposed to be doing when it distributes credence over a continuum — but I'm not confident about what that something is, or about whether the distinction between the parameterization doing the work (pick the midpoint, pick the radius, pick the endpoint) and the measure that results should be made explicit before or after. Second, the carrying example, and whether the one I've been toying with actually carries: a point chosen at random in a circular dartboard of radius one, and the probability that it lands in the concentric circle of radius one half, which is 1/2 if you choose a radius uniformly and then an angle uniformly, and 1/4 if you choose uniformly by area, and which I like because the two procedures can be drawn on the board as pictures of each other and because the difference in the densities is visible rather than merely algebraic. My supervisor says my dartboard is a cheat: here there is a privileged answer, since the area-uniform distribution is the one that is invariant under the Euclidean motions that preserve the board and the uniform-radius distribution is not, so the case can only show that students picked a silly parameterization, not that a well-meant indifference argument can fail in a way nobody can repair. Is she right, and if she is, what does a carrying example have to contain that mine lacks — must it have no privileged measure at all, or must it merely have one that is not obvious to a first-year — and is the dartboard worth keeping as a five-minute warm-up before the chord anyway, or will it install the wrong moral? Relatedly, I've been dividing the failures into two kinds for my own notes: cases like mine where the rival parameterizations disagree because one of them quietly introduces a length scale or a preferred region that the setup does not contain, and cases like the chord where the rivals disagree even though each respects every symmetry the setup obviously has. Is that distinction load-bearing or cosmetic, and if it is load-bearing, where in the sequence does it belong?

  Third, the misconceptions, in the order they will actually arrive and the point at which each should be defused rather than merely corrected at the end. The ones I expect are: that uniform just means every outcome equally likely, so the paradox is only about infinity; that there must be a true answer among the three and we simply don't know which; that the moral is that probability is subjective, or that the setup was under-described and any answer is therefore as good as another; that one can average the three answers and split the difference; and, from the sharper students, that maximum entropy repairs indifference, or that the whole difficulty is that a uniform distribution on a length is not a uniform distribution on the area or on the ratio, which is true and yet somehow not the end of the matter. For each I'd like to know whether it should be headed off preemptively in the setup, absorbed when it surfaces, or deliberately left standing until the last two minutes, and what I should say in one sentence if it surfaces early and I don't want to derail the arc. Finally, I want a check that discriminates: a question I can put to them cold at the end, ideally set in a new case rather than a circle, that a student who has only memorized the phrase it depends on how you choose at random cannot answer, plus your view on what I should openly refuse to explain at this level and say out loud that I'm refusing — I'm thinking anything involving the uniqueness of invariant measures on a group, any derivation of a maximum-entropy distribution in the continuous case, and the historical question of what Bertrand himself took himself to be doing, but tell me if I'm being too cautious or not cautious enough. For what it's worth, I got into an argument in the maths society afterwards in which one friend insisted that the chord question has a correct empirical answer because you could always go and throw straws at a circle drawn on the floor, and another insisted that this just relocates the choice into the throwing; if either of them is pointing at something my session should make room for, I'd rather find out now than on Thursday.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year Maths & Philosophy student.
      *   **Task:** Leading a 25-minute problem session for first-year students.
      *   **Course:** "Chance, Symmetry and Evidence" (sounds like an introductory probability/epistemology mix).
      *   **Student Background:** Can integrate densities, know uniform distribution on an interval. *No* measure theory, *no* group theory, *no* formal epistemology.
      *   **Topic:** Bertrand's Paradox (probability a random chord > side of inscribed equilateral triangle).
      *   **Goal:** Use the paradox to show what goes wrong with the Principle of Indifference (PoI) on continuous quantities.
      *   **Constraints:** 25 minutes is *very* short. Sequencing is the main worry.
      *   **Specific Concerns:**
          1.  Sequencing/Dependencies (PoI concept vs. Paradox reveal).
          2.  The "Dartboard" Warm-up (Is it a cheat? Does it help or hinder?).
          3.  Misconceptions (When to address them).
          4.  Assessment/Check (A question to test understanding).
          5.  Scope (What to explicitly refuse to explain).
          6.  The "Straw Throwing" Argument (Empirical vs. Procedural).

  2.  **Deconstruct the Three Specific Concerns:**

      *   **Concern 1: Sequencing & Dependencies.**
          *   *User's Instinct:* Don't show the 1/3, 1/2, 1/4 immediately. Build the PoI concept first.
          *   *Analysis:* Correct. If they see the answers first, they treat it as a trick. They need to feel the *plausibility* of the PoI first.
          *   *Strategy:* Start with a discrete case (safe PoI) $\to$ Move to continuous (dartboard?) $\to$ Reveal the ambiguity in the Chord problem.
          *   *Parameterization vs. Measure:* Needs to be explicit *during* the derivation of the three answers, not before. Before, it's just "random." During, it's "random *with respect to what variable*?"

      *   **Concern 2: The Dartboard Example.**
          *   *User's Example:* Point in circle radius 1, prob inside radius 1/2. Uniform radius (1/2) vs. Uniform area (1/4).
          *   *Supervisor's Critique:* It's a "cheat" because area uniformity is physically privileged (rotation/translation invariance).
          *   *Analysis:* The supervisor is technically right (Jaynes' resolution), but for *first-years*, the dartboard is excellent pedagogy. It visualizes density without algebra. It shows that "uniform" is relative to a variable.
          *   *Decision:* Keep it as a warm-up, but frame it carefully. Don't claim it's unsolvable like Bertrand's. Claim it illustrates *why* we need to specify the variable. It bridges the gap between "uniform on interval" (which they know) and "uniform on chords" (which is ambiguous).
          *   *Distinction (Scale/Region vs. Symmetry):* This is too advanced for 25 mins. Keep it implicit. The dartboard shows parameter dependence. Bertrand shows parameter dependence *even when symmetry arguments seem to apply to all*. Don't explicitly teach the distinction, just let the chord problem feel "worse" than the dartboard.

      *   **Concern 3: Misconceptions.**
          *   *List:* "Uniform = equally likely outcomes" (Infinity issue), "True answer exists", "Probability is subjective", "Average them", "MaxEnt/Change of Variable".
          *   *Strategy:*
              *   "Equally likely outcomes": Address early. Continuous = density, not count.
              *   "True answer exists": Address at the end. The *question* is ill-posed, not the math.
              *   "Subjective/Under-described": This is the *target* learning outcome. Embrace this.
              *   "Average them": Dismiss quickly (mathematically unjustified).
              *   "MaxEnt/Change of Variable": Refuse explicitly (out of scope).
          *   *Straw Throwing:* This is the "physicalist" objection. It's crucial. It validates that "random" implies a *process*. If you don't specify the process, you don't have a probability.

  3.  **Drafting the Plan (Iterative Process):**

      *   *Time Budget:* 25 mins is tight.
          *   0-5: Warm-up (Dartboard) + PoI intuition.
          *   5-15: Bertrand's Paradox (The 3 methods).
          *   15-20: The "Why" (Parameterization & Process).
          *   20-25: Conclusion, Check Question, Scope Boundaries.

      *   *Refining the Dartboard:* Use it to establish that $P(A) \neq P(B)$ if the density changes. Show the visual difference (clumping at center vs. even spread). Acknowledge the supervisor's point: "In this case, physics might save us, but in the next case, physics doesn't help."

      *   *Refining Bertrand's:* Don't derive all three integrals in detail. Sketch the geometry. Focus on the *variable* being uniformized.
          1.  Endpoints (1/3).
          2.  Radius/Distance from center (1/2).
          3.  Midpoint (1/4).
          *   *Crucial Step:* Ask "Which variable is 'random'?"

      *   *Refining the Check Question:* Needs to be new context. Square? Cube? Stick breaking?
          *   *Stick Breaking:* Classic. Break a stick of length 1 at two random points. Prob triangle? (Also ambiguous).
          *   *Square:* Point in square. Prob closer to center than edge? (Parabolic region). Depends on coordinate system?
          *   *Selection:* "The Stick" is good, but "The Square" might be easier to visualize quickly. Let's go with a variation of the stick or a new geometric setup. Actually, the "Two Bus Problem" or similar is good, but geometric is better for this crowd. Let's try: *A point is chosen in a square. What is the probability it is closer to the center than to the edge?* (Actually, that has a specific answer usually).
          *   *Better Check:* "I choose a random number $X$ between 0 and 1. I then square it to get $Y$. Is $Y$ uniformly distributed?" (Tests change of variable).
          *   *Best Check:* "I have a cube. I pick a random point inside. What's the probability it's in the inner cube of half volume?" (Tests 1/2 vs 1/8). Wait, that's just the dartboard in 3D.
          *   *Ideal Check:* A scenario where the *process* isn't specified. "I pick a random line intersecting a square." (Too hard).
          *   *Let's stick to the prompt's request:* "New case rather than a circle." How about: *A random rectangle with perimeter 4. What is the probability the area is greater than 1?* (Requires parameterizing length/width). If $L \sim U[0,2]$, $W = 2-L$. Area $= L(2-L)$. Max area is 1. So prob is 0? But if we parameterize differently?
          *   *Actually, the "Stick Breaking" is the standard companion to Bertrand.* Break a stick at one point. Prob left side > 2/3? (1/3). Break at *two* points. Prob they form a triangle? (1/4).
          *   *Let's go with the "Random Square" idea.* Pick a random square. Prob side length > 1? (Need a bound).
          *   *Decision:* Use the "Random Number" transformation. It's algebraic and hits the "uniform on X is not uniform on f(X)" point hard. Or, simpler: *I choose a random angle $\theta$ in $[0, 2\pi)$. What is the probability that $\sin(\theta) > 0.5$?* (This tests if they understand the density of the sine transformation).
          *   *Wait, the prompt asks for a check that discriminates against "it depends".* The answer *should* be "It depends." The check is whether they can articulate *what* it depends on.
          *   *Revised Check:* "I choose a random chord in a *square*. What is the probability it is longer than the side?" (Same ambiguity).
          *   *Better:* "I choose a random number $x$ from $[0,1]$. What is the probability that $x^2 < 0.5$?" vs "I choose a random number $y$ from $[0,1]$ uniformly. Let $x = \sqrt{y}$. What is the probability $x^2 < 0.5$?" (Shows the variable matters).
          *   *Let's go with the "Stick" variant.* It's the standard pedagogical partner to Bertrand. "Break a stick of length 1 at a random point. What is the expected length of the shorter piece?" (Depends on distribution). No, simpler.
          *   *Okay, I will recommend the "Random Rectangle" or "Random Stick" but focus on the articulation of the generating process.*

      *   *Refining Scope:*
          *   Refuse: Measure theory, Group Invariance (Jaynes), MaxEnt derivations, Bertrand's biography.
          *   Accept: The need for a physical process or explicit variable specification.
          *   Straw Argument: Validate it. "Random" is a property of the *generator*, not the *object*.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty (25 mins is very short). Validate the user's instincts.
      *   **Part 1: Sequencing & Dependencies:** Step-by-step timeline.
      *   **Part 2: The Dartboard:** Address the supervisor's critique. Keep it, but qualify it.
      *   **Part 3: Misconceptions:** Triage list (Preempt, Absorb, Deflect).
      *   **Part 4: The Check & Scope:** The final question and what to withhold.
      *   **Part 5: The Straw Argument:** How to handle the empirical objection.

  5.  **Drafting Content (Self-Correction during drafting):**
      *   *Correction on Dartboard:* Make sure to tell the user *exactly* what to say so it doesn't undermine the main point. "Here, physics suggests an answer. In Bertrand's, physics doesn't help."
      *   *Correction on Sequencing:* Ensure the PoI is defined simply. "If we have no reason to prefer A over B, assign equal probability."
      *   *Correction on Check:* The check needs to be solvable *if* they understand the lesson, but the answer must be "It depends on the selection method."
      *   *Refining the "Straw" point:* The friend who said "throwing straws relocates the choice" is right. The friend who said "empirical answer" is wrong because the throwing *is* the parameterization. This is the key insight.

  6.  **Final Polish:** Check tone (collegial, precise, respecting the user's math/phil background). Ensure the 25-minute constraint is respected (don't suggest too much content).

      *(Self-Correction on the Check Question)*: I need a question where a student who just memorized "it depends" fails.
      *   *Bad Question:* "What is the answer to Bertrand's paradox?" (They say "It depends").
      *   *Good Question:* "I want to pick a random number between 1 and 100. I roll a die to pick the tens digit and a die to pick the units digit. Is this uniform? What if I pick a random real number $r$ in $[0,1]$ and set $X = \lfloor 100r \rfloor + 1$?"
      *   *Better:* "Consider a cube of side 2. I pick a random point inside. What is the probability it lies within distance 1 of the center?" (This is the 3D dartboard).
      *   *Best:* "I have a stick of length 1. I break it at a 'random' point. What is the probability the left piece is longer than 2/3?"
          *   If "random point" = uniform distance from end $\to$ 1/3.
          *   If "random point" = uniform angle of a spinning pointer attached to the end? (Same).
          *   If "random point" = chosen by area of a square?
          *   Actually, let's use the **Square Chord** idea. It mirrors Bertrand but changes the shape.
          *   *Wait, simplest is best.* "I choose a random number $X$ uniformly from $[0,1]$. Let $Y = X^2$. Is $Y$ uniform?" (No). "If I wanted $Y$ to be uniform, how should I choose $X$?" (This tests the change of variable/density understanding).
          *   *Actually, the prompt asks for a check that discriminates against "it depends".* The student needs to say *what* it depends on.
          *   *Okay, I'll propose the "Random Rectangle" problem.* Perimeter fixed vs Area fixed.

      *(Final Decision on Check)*: Use a variation of the "Random Number" transformation. It's algebraic, fits their integration skills, and directly tests the "uniform on $x$ $\neq$ uniform on $f(x)$" concept without needing new geometry.
      *   *Wait, one more thought:* The prompt asks for a check set in a *new case*.
      *   *Idea:* "A random line intersects a unit square. What is the probability the length of the intersection is greater than 1?" (Too hard).
      *   *Idea:* "I pick a random triangle inscribed in a circle. Probability it is obtuse?" (Also ambiguous).
      *   *Let's go with the Stick.* It's the standard. "Break a stick at random. Prob(length > 2/3)?"
      *   *Wait, I need to ensure they can't just say 'it depends'.* I need them to specify the *variable*.
      *   *Okay, the plan is solid.* I will structure the response clearly around the user's three points plus the straw argument.

  7.  **Final Review against constraints:**
      *   25 mins? Yes, the plan is tight.
      *   No measure/group theory? Yes.
      *   Address supervisor's critique? Yes.
      *   Address straw argument? Yes.

      *(Self-Correction on Supervisor's Critique)*: The supervisor is right that the dartboard has a "natural" measure (Lebesgue/Area). But for first-years, the point is that "uniform radius" is a *coherent* alternative distribution, even if not "rotationally invariant." The lesson isn't "there is no answer," it's "you must specify the distribution." The dartboard shows *how* distributions differ. Bertrand shows *why* specification is hard. I will advise the user to use the dartboard to teach *density*, not *ambiguity*.

      *(Refining the "Straw" argument)*: The friend who said "throwing straws relocates the choice" is the one who understood the lesson. The empirical friend thinks "physics solves metaphysics." The lesson is "physics *is* the metaphysics here." The mechanism *is* the distribution.

      *Let's write.*
answer: |-
  This is a superb pedagogical challenge. Twenty-five minutes is razor-thin for Bertrand's Paradox, especially with first-years who lack the formal machinery to resolve it. Your instincts on sequencing are correct: if you lead with the three answers, you lose the epistemological crisis and reduce it to a calculation trick.

  Here is a plan designed to fit the time limit, address your supervisor's concern, and handle the misconceptions without derailing the narrative.

  ### 1. Sequencing and Dependencies (0–25 Minutes)

  Your instinct is right: **Do not start with the chord.** Start with the *Principle of Indifference (PoI)* itself, validate it in a discrete case, break it in a continuous case (Dartboard), and then show that the break is unfixable in the Chord case.

  **0:00–0:05: The Principle and the Dartboard (The "How")**
  *   **Define PoI simply:** "If we have no reason to prefer one outcome over another, we assign them equal probability."
  *   **Discrete Check:** Coin toss. Heads/Tails. No reason to prefer. $P=1/2$. (Safe).
  *   **The Dartboard (Your Warm-up):** Draw a circle radius $R=1$. Concentric circle $r=1/2$.
      *   *Ask:* "I throw a dart. It hits the board. What is the probability it hits the inner circle?"
      *   *Elicit Answer 1 (Area):* $1/4$. (Uniform on area).
      *   *Elicit Answer 2 (Radius):* "What if I pick a random direction, then pick a random *distance* from the center between 0 and 1?" Answer: $1/2$. (Uniform on radius).
      *   **The Point:** Do not solve the "which is right" debate yet. Use this to establish that **"Uniform on $X$" does not mean "Uniform on $f(X)$."**
      *   *Supervisor's Critique:* She is right that the area measure is privileged by Euclidean symmetry (Jaynes' resolution). **However**, for a first-year session, the dartboard is not a cheat; it is a *visualizer*. It makes the density difference visible (clumping at the center vs. even spread).
      *   **How to frame it:** "In the dartboard case, physics might tell us 'area' is the natural measure. But notice: both calculations were mathematically valid. They just answered different questions. The dartboard teaches us that 'random' is not a property of the *space*, but of the *selection process*."

  **0:05–0:15: Bertrand's Chord (The "Why it Breaks")**
  *   **The Setup:** Circle, inscribed equilateral triangle. Chord longer than side?
  *   **The Three Methods (Sketch, don't integrate):**
      1.  **Endpoints:** Fix one point, pick the other uniformly on the circumference. (Result: 1/3).
      2.  **Radius:** Pick a radius, pick a point on it uniformly for the midpoint. (Result: 1/2).
      3.  **Midpoint:** Pick a point uniformly inside the circle as the midpoint. (Result: 1/4).
  *   **The Crucial Move:** Do not present these as "three ways to solve the problem." Present them as "three different physical experiments."
      *   Method 1: Spin a spinner twice to get endpoints.
      *   Method 2: Spin a spinner for angle, roll a die for distance from center.
      *   Method 3: Throw a dart at the interior to fix the midpoint.
  *   **The Dependency:** You must make explicit that **Parameterization = Physical Process**. The math follows the physics. If the physics isn't specified, the math is under-determined.

  **0:15–0:20: The Moral (Indifference on Continua)**
  *   **Synthesis:** Why did the PoI fail?
  *   **Statement:** "The Principle of Indifference works on discrete alternatives (Heads/Tails). On continuous quantities, 'equally likely' is meaningless unless you specify *which quantity* is equally likely."
  *   **Distinction (Your Notes):** You asked if the distinction between "silly parameterization" (dartboard) and "symmetric parameterization" (chord) is load-bearing. **Yes, but do not teach it explicitly.** It consumes too much time. Instead, imply it: "In the dartboard, we might argue area is 'more natural.' In the chord case, all three methods respect the circle's symmetry. There is no 'natural' choice. The ambiguity is in the problem, not our math."

  **0:20–0:25: Assessment and Boundaries**
  *   **The Check Question (See below).**
  *   **Scope Boundaries (See below).**

  ---

  ### 2. The Dartboard: To Keep or To Cut?

  **Keep it.** Your supervisor is worrying about *foundations*; you are teaching *intuition*.
  *   **Why keep it:** First-years cannot visualize density functions on chord spaces. They *can* visualize points on a dartboard. It bridges the gap between "Uniform on $[0,1]$" (which they know) and "Uniform on Chords" (which is abstract).
  *   **How to neutralize the "Cheat" objection:** Explicitly acknowledge it. Say: "In the dartboard case, we might appeal to physics to say the area method is 'correct.' But notice that the radius method is still a valid *probability distribution*. Bertrand's Paradox is worse: there is no physical appeal that clearly favors one chord method over the others."
  *   **The Moral:** The dartboard shows *that* distributions change under transformation. Bertrand shows *that* we often lack the information to choose the distribution.

  ---

  ### 3. Misconceptions: Triage and Scripts

  You cannot correct these at the end. You must manage them as they arise.

  | Misconception | Timing | Strategy | One-Sentence Deflection |
  | :--- | :--- | :--- | :--- |
  | **"Uniform means every outcome equally likely."** | **Preempt** (0:00) | Address in the Dartboard intro. | "In continuous cases, the probability of any single outcome is zero; 'uniform' means constant *density*, and density depends on your coordinates." |
  | **"There must be a true answer (1/3, 1/2, or 1/4)."** | **Absorb** (0:15) | When they ask "But which is it?" | "The math is correct in all three; the question is incomplete because it didn't specify the selection process." |
  | **"Probability is just subjective."** | **Absorb** (0:20) | Distinguish epistemic from physical. | "It's not that truth is subjective; it's that 'random' describes a *mechanism*, and without a mechanism, there is no fact of the matter." |
  | **"Just average the three answers."** | **Deflect** (0:15) | Dismiss immediately. | "Averaging probabilities from different distributions has no mathematical justification; it's like averaging apples and oranges." |
  | **"MaxEnt / Change of Variable fixes this."** | **Refuse** (0:25) | Explicitly out of scope. | "Those are advanced tools for selecting distributions, but they don't change the fact that the original question was under-specified." |

  ---

  ### 4. The Check Question and Scope Boundaries

  **The Check Question:**
  Do not use a circle. Use a **Stick**.
  > "I have a stick of length 1. I break it at a 'random' point. What is the probability the shorter piece is less than 1/4?"

  *   **Why this works:**
      *   If they say "1/2" (Uniform on length), they understand the standard interpretation.
      *   If they say "It depends," ask: "On what?"
      *   **The Discriminator:** A student who memorized "it depends" will stop there. A student who understood the session will say: "It depends on how the break point is chosen. If the break point is uniform on the length, it's 1/2. If the break point is chosen by some other process (e.g., uniform on the square of the position), it changes."
      *   **Better Discriminator:** "If I choose the break point $X$ uniformly on $[0,1]$, the answer is 1/2. If I choose $Y = X^2$ uniformly on $[0,1]$ and break at $X = \sqrt{Y}$, is the probability still 1/2?" (This forces them to acknowledge the density change).

  **What to Refuse to Explain (Say this out loud):**
  1.  **Group Invariance:** "There is a sophisticated argument involving rotational symmetry that favors the 1/2 answer, but that requires group theory we don't have."
  2.  **Maximum Entropy:** "There are methods to pick the 'least biased' distribution, but they require calculus of variations."
  3.  **Bertrand's Intent:** "We don't know if Bertrand thought this was a paradox or a joke, and it doesn't matter for the math."

  **Why this refusal is good:** It signals that the *ambiguity* is the lesson, not the *resolution*. It validates the students' confusion as a feature of the landscape, not a failure of their understanding.

  ---

  ### 5. The "Straw Throwing" Argument (Post-Session Prep)

  Your friends' argument is the single most important philosophical point of the session.
  *   **Friend A (Empirical):** "Throw straws, get an answer."
  *   **Friend B (Procedural):** "Throwing straws just picks a parameterization."
  *   **Verdict:** **Friend B is right, but Friend A is asking the right question.**
  *   **How to handle it:** If this comes up (or if you want to plant it), say this:
      > "If you throw straws on the floor, you *will* get an empirical frequency. Maybe it's 1/3. Maybe 1/2. But that frequency tells you about *your throwing mechanism*, not about 'random chords' in the abstract. If you change your stance, your grip, or the height of the throw, the frequency changes. The paradox proves that 'random chord' is not a physical object; it is a description of a process. Without the process, the probability does not exist."

  This validates the empirical intuition (probabilities connect to frequencies) while correcting the metaphysical error (frequencies come from *specific* processes, not abstract shapes).

  ### Summary Checklist for Thursday
  1.  **Minute 0-5:** Dartboard. Show $P(\text{Area}) \neq P(\text{Radius})$. "Uniform" needs a variable.
  2.  **Minute 5-15:** Bertrand. Three methods = Three physical experiments.
  3.  **Minute 15-20:** The Moral. PoI fails on continua without specified variables.
  4.  **Minute 20-25:** Stick Question. Refuse advanced resolutions. Validate the "Process" view.

  You are not teaching them how to solve Bertrand's Paradox. You are teaching them to **distrust the word "random"** when it appears without a generator. That is a lesson that will serve them better than any integration technique.
