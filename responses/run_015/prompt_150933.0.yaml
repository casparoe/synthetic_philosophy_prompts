answer: |-
  **Scenario**

  The Oakwood University Housing Code, Section 9(b), states: "To ensure uninterrupted sleep for all residents, no dog weighing more than 20 pounds may be kept in the dormitories." Alex, a resident, keeps a 15-pound terrier in his room. While the dog meets the weight requirement, it suffers from a condition that causes it to bark incessantly throughout the night, waking neighboring students repeatedly. The Housing Board seeks to evict Alex for violating Section 9(b), citing the sleep disruption, while Alex argues his dog complies with the explicit weight limit.

  **Check**

  **What each theory says and why:**
  *   **Textualism:** Alex wins. The operative command is unambiguous: "no dog weighing more than 20 pounds." A 15-pound dog does not satisfy the condition for prohibition. The preamble ("To ensure uninterrupted sleep") explains the motivation but does not alter the clear numerical threshold chosen by the drafter.
  *   **Purposivism:** Alex loses. The rule's purpose is explicitly stated as ensuring "uninterrupted sleep." The weight limit is merely a proxy for identifying disruptive animals. Because Alex's dog defeats the specific purpose (sleep) the rule was designed to protect, the prohibition applies despite the weight technicality.

  **Single feature doing the work:**
  *   **Under-inclusive Proxy.** The text uses an objective measure (weight) as a stand-in for the underlying harm (noise/sleep disruption). The case falls into the gap where the proxy fails to capture the harm (a light dog that is still loud).

  **What happens if you remove that feature:**
  *   If the rule read "No dogs that disrupt sleep may be kept," the proxy is removed. Both theories converge on evicting Alex, as the text now directly targets the harm.

  **Strongest textualist reply:**
  *   **Administrative Fairness and Notice:** A textualist would argue that weight is an objective, pre-compliance standard, whereas "sleep disruption" is subjective and post-hoc. By choosing weight, the Housing Board provided residents a clear bright line to organize their lives around. Allowing enforcement based on the purpose clause rather than the text grants enforcement officers arbitrary discretion to decide what counts as "disruptive," undermining the rule of law values of predictability and notice that the clear text was intended to secure.
