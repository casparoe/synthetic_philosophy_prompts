prompt: |-
  Two colleagues of mine in a biomedical ethics working group spent the better part of a seminar arguing past one another, and at the end they asked me to referee. I declined, because I genuinely could not tell which of them had the better of it, and I would be grateful if you would take it up instead. I have reconstructed their exchange below as faithfully as I can, and I have not indicated my own sympathies, since I have none.

  The disputed thesis — call it tranquilism — was stipulated at the start of the session as follows: a person's welfare over an interval is fixed entirely by the extent to which, across that interval, they are free of craving and of suffering. Positive enjoyment, absorption, interest, and what we ordinarily call pleasure contribute nothing in their own right, though they may matter indirectly, by preventing later craving or by serving as evidence that craving is currently absent. Both participants accepted this statement of the view.

  The case around which the argument turned was introduced by Nadia. It concerns a safe, cheap, fully reversible neural implant she called the governor, adjustable from 0 to 100, which scales down the motivational force of desire — anticipation, restlessness, frustration at delay, the sting of disappointment — while leaving sensory discrimination and the felt character of ongoing activity untouched. At high settings a person still enjoys dinner, conversation and music while having them, but does not want them beforehand, does not mind when they are cancelled, and does not grieve when they end. Both parties agreed that no third party is affected and that the only question is whether a person on a high setting is thereby better or worse off.

  1. Nadia: Our recoil from the governor is not evidence about welfare. What we recoil from is the loss of something we value — striving, ambition, a recognizably human shape of life — and tranquilism is precisely the thesis that what we value and what benefits a person can come apart. There is independent support for it. Asked to choose between a life of calm contentment and a life of ecstatic highs and devastating lows, most people choose the calm one, and they do so even when the two lives are described so as to contain comparable totals of enjoyment by ordinary hedonic reckoning. The natural explanation is that the highs contribute nothing and the lows are doing all the negative work.

  2. Paul: That comparison does not discriminate between the theories. The ecstatic life as described contains real suffering — crashes, anxiety about the next crash, dependency — and pleasures saturate while pains compound. Equalize for those and the intuition evaporates. Here is a cleaner argument, the argument from residual richness. Take two subjects, each wholly free of craving and suffering for one hour. One spends it absorbed in a late Beethoven quartet, noticing and savoring every phrase; the other spends it in flat, grey, neutral wakefulness with nothing going on. Hold the craving-and-suffering profile fixed — no frustration, no ache, and no boredom either — so that the entire difference lies on the positive side. Tranquilism must say the two hours are exactly equally good for their subjects. That is a consequence I reject, and it is not one you can soften.

  3. Nadia: The argument from residual richness assumes the point at issue, namely that absorption is a separable positive ingredient rather than a pattern within the negative one. There is a credible alternative: what we call enjoyment is largely the phenomenology of relief — attention settling, a background restlessness lifting, a strain released. The quartet listener's hour is not the grey hour plus an additive good; it is a differently shaped relief-profile, and it presupposes a craving-free subject as its substrate. Notice how difficult it is to imagine pure positive enjoyment with no relief anywhere in it: every example one tries collapses either into relief or into blankness. That is at least some evidence that the two dimensions are not separable in experience.

  4. Paul: Grant all of that for sensory pleasures. It does not touch achievement, knowledge, or love. Someone who spends a decade mastering a difficult language, at real cost in frustrated craving, acquires something that makes those years worth having, and not merely because the accomplishment wards off later craving. On your view the costs count and the accomplishment counts for nothing at all, which renders unintelligible the ordinary structure of prudential trade — paying in suffering for a good that is not itself an absence of suffering.

  5. Nadia: I accept part of this. On my view the achievement has no weight as such; it matters only by keeping subsequent craving and suffering away, and I concede that this is a bullet to bite. But the bite is smaller than it looks, because tranquilism is a thesis about what benefits a person, not about what is admirable, worth doing, or worth choosing. We can praise striving, and even choose it for ourselves, while denying that it makes anyone's life go better for them.

  6. Paul: The concession spreads to the governor, which is why it matters. Consider how the device would be evaluated in practice: ask people on a high setting whether they want it dialled down. But the implant also dampens the desire to alter the setting, so their answers are produced by the very thing under assessment and are worthless as evidence — a difficulty that does not arise for ordinary analgesics. And when people who fully understand the trade refuse the implant outright, the natural reading is that they are paying in craving for positive goods they expect to receive. If tranquilism cannot represent that trade, it cannot represent prudential reasoning at all.

  7. Nadia: On unreliability: any intervention can reshape the desires you would use to judge it — a demanding career changes what one wants from a career — and we do not on that ground dismiss what people say about their own lives. On the refusals: what they show is that people dread the loss of striving, and dread is itself an anticipatory discomfort of the sort tranquilism instructs us to treat as evidence about the state the person is actually in, not about the state they are imagining.

  8. Paul: That is the difficulty in one sentence. The person on the governor reports contentment, and you count it; the person offered the governor reports dread, and you discount it. A view that must sort first-person reports before it may use them is not so much a theory of welfare as a rule about whom to believe.

  Two things struck me as bystander, and I mention them only because neither participant addressed them. First, they never settled whether craving was meant to include merely dispositional appetites — standing tendencies to want things, which can be present while the person feels nothing — or only occurrent felt urgings, and several of their claims seemed to me to slide between the two readings. Second, they never distinguished a person's welfare from what makes a life meaningful, though a good number of their remarks appeared to belong to the second question rather than the first.

  Please adjudicate the exchange move by move. For each of the eight numbered contributions, say whether it is clearly mistaken, weak but fair, strong, or clearly right, and justify your rating briefly — including, where a move is strong, whether the other side had a good reply available that they did not make. Then state who has the better of the argument overall and why, and say what, if anything, both parties are missing. I would especially value your judgement on whether the verdict changes depending on how craving is understood, since that ambiguity seemed to me to be doing unacknowledged work. I am not looking for a survey of considerations on both sides; I want a verdict, with the reasoning that supports it.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a philosophical debate between two colleagues (Nadia and Paul) regarding a specific thesis called "tranquilism."
      *   **Thesis (Tranquilism):** Welfare is fixed *entirely* by freedom from craving and suffering. Positive enjoyment/pleasure contributes nothing directly (only indirectly by preventing craving/suffering).
      *   **Case Study:** The "Governor" implant (scales down motivational force of desire without affecting sensory experience).
      *   **Format:** Evaluate each of the 8 numbered moves (Clearly Mistaken, Weak but Fair, Strong, Clearly Right) with justification. Then declare an overall winner. Finally, address the "missing" elements (craving ambiguity, welfare vs. meaning) and specifically how the craving definition affects the verdict.
      *   **Constraint:** Do not provide a survey; provide a verdict with reasoning. Be decisive.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Nadia):** Argues that recoil from the Governor is about values (striving), not welfare. Cites preference for calm contentment over ecstatic highs/lows as evidence that highs don't add value, only lows subtract.
          *   *Analysis:* The preference for calm over rollercoaster is a common intuition pump for negative utilitarianism/tranquilism. However, equating "value" entirely with "welfare" is contentious. The claim that highs contribute *nothing* is strong.
          *   *Rating:* Strong, but relies on a specific interpretation of the "calm vs. ecstatic" intuition.

      *   **Move 2 (Paul):** "Argument from Residual Richness." Two subjects, no craving/suffering. One listening to Beethoven, one in grey neutrality. Tranquilism says they are equal. Paul rejects this.
          *   *Analysis:* This is the classic "Nozick's Experience Machine" or "Philosophical Zombies" style objection applied to negative hedonism. It targets the core claim that positive states have zero weight. It's a direct intuition pump against the core axiom.
          *   *Rating:* Strong. It isolates the variable (positive experience) while holding the tranquilist variable constant (no craving/suffering).

      *   **Move 3 (Nadia):** Counters Move 2. Claims enjoyment *is* relief (phenomenology of craving cessation). Argues positive enjoyment isn't separable from relief.
          *   *Analysis:* This is a reductive move. It tries to collapse the positive into the negative (pleasure = relief from pain/craving). This is a known philosophical position (Schopenhauer, etc.), but empirically/phenomenologically controversial. Is *all* pleasure relief? What about "gratuitous" pleasures?
          *   *Rating:* Weak but Fair. It's a coherent defense of the theory, but phenomenologically dubious (not all pleasure feels like relief).

      *   **Move 4 (Paul):** Extends to "higher goods" (achievement, knowledge, love). Mastering a language involves craving/frustration but yields a good that isn't just absence of suffering. Tranquilism makes prudential trade unintelligible.
          *   *Analysis:* This attacks the "indirect" clause of tranquilism. Tranquilism says achievement matters *only* if it prevents future suffering. Paul argues the achievement itself is a good worth the suffering. This targets the "trade-off" structure of life.
          *   *Rating:* Strong. It highlights the counter-intuitive implication that struggle for a non-relief goal is welfare-neutral or negative.

      *   **Move 5 (Nadia):** Concedes achievement has no intrinsic weight. Distinguishes Welfare vs. Admirability/Choice. We can choose striving without it benefiting us.
          *   *Analysis:* This is a "bullet-biting" move. It retreats to a strict definition of welfare (hedonic/negative) vs. broader value. It saves the theory from refutation by narrowing its scope, but at the cost of making "welfare" less relevant to "how to live."
          *   *Rating:* Weak but Fair. It preserves logical consistency but reduces the theory's practical appeal. It admits the counter-intuition but labels it irrelevant to the definition.

      *   **Move 6 (Paul):** Attacks the Governor evaluation. Self-report is compromised because the implant dampens the desire to change it. Refusal of the implant shows people pay craving for positive goods.
          *   *Analysis:* This is a meta-argument about evidence. If the theory alters the metric (desire) used to test it, it's unfalsifiable or circular. The refusal point reinforces the "trade" argument.
          *   *Rating:* Strong. It identifies a self-sealing mechanism in the theory's application.

      *   **Move 7 (Nadia):** Defends self-report. All interventions change desires (career). Refusal is based on "dread," which is anticipatory discomfort (suffering), so it counts as evidence *for* tranquilism (avoid the suffering of dread).
          *   *Analysis:* The career analogy is weak (career doesn't chemically suppress the desire to evaluate the career). The "dread is suffering" move is clever but circular: "You don't want it because you suffer from the thought of it" ignores *why* you suffer from the thought (because you value the lost positive goods).
          *   *Rating:* Weak. The career analogy fails on reversibility/mechanism. The dread explanation begs the question.

      *   **Move 8 (Paul):** Summarizes the asymmetry. Contentment counts; dread doesn't (or is reinterpreted). The theory becomes a rule about whom to believe rather than a theory of welfare.
          *   *Analysis:* This is a damning summary of Move 7. It points out the epistemic privilege the theory grants to the drugged state over the pre-drugged state.
          *   *Rating:* Clearly Right. It exposes the epistemic circularity.

  3.  **Evaluate the "Missing" Elements:**
      *   **Craving Ambiguity (Dispositional vs. Occurrent):**
          *   If *Dispositional*: The Governor removes the *force* but maybe not the *disposition*. If I don't *feel* the urge but still have the tendency, am I craving-free? If tranquilism means "no occurrent feeling," the Governor works. If it means "no disposition," the Governor might not work.
          *   Nadia seems to rely on *Occurrent* (felt restlessness) to claim the Governor works.
          *   Paul seems to rely on *Dispositional* (the underlying want/striving) to claim something is lost.
          *   *Impact:* If craving is dispositional, Nadia's defense of the Governor collapses (because the disposition remains or is merely suppressed). If craving is occurrent, Paul's "Residual Richness" argument is stronger (because you can have occurrent richness without occurrent craving).
      *   **Welfare vs. Meaning:**
          *   Nadia explicitly separates them in Move 5. Paul conflates them in Move 4 (achievement).
          *   Much of the intuition against tranquilism comes from "Meaning" (striving gives life meaning). Tranquilism might be right about *welfare* (feeling good) but wrong about *value* (living well).
          *   *Impact:* If the debate is strictly about welfare (phenomenal state), Nadia has a stronger logical case. If it's about "how to live," Paul wins. The prompt asks about "welfare," but the examples (achievement, Governor) bleed into "how to live."

  4.  **Determine the Winner:**
      *   Paul seems to land the heavier blows.
      *   Move 2 (Residual Richness) is the strongest philosophical objection to negative hedonism/tranquilism. Nadia's reply (Move 3) is reductive and phenomenologically questionable.
      *   Move 6 & 8 (Epistemic Circularity) expose a fatal flaw in applying the theory to the Governor case. Nadia's defense (Move 7) is weak.
      *   Nadia wins on logical consistency (Move 5), but only by making the theory less relevant.
      *   Overall: Paul has the better of the argument because he successfully demonstrates that Tranquilism either contradicts common phenomenological experience (Move 2) or renders itself unfalsifiable/epistemically circular (Move 6/8). Nadia survives by retreating to a narrow definition of welfare that ignores the very intuitions Paul raises.

  5.  **Drafting the Adjudication:**
      *   *Tone:* Impartial, analytical, decisive.
      *   *Structure:*
          1.  Move-by-move evaluation (1-8).
          2.  Overall Verdict.
          3.  Analysis of Missing Elements (Craving & Meaning).
      *   *Specific Focus:* Ensure the distinction between dispositional and occurrent craving is highlighted as a pivot point.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Paul is right because Tranquilism is false." I must judge the *argumentative exchange*. Did Nadia defend her position well? Yes, Move 3 and 5 are standard defenses of negative utilitarianism. But Paul's objections (2 and 8) are structurally more damaging to the specific case of the Governor.
      *   *Refining Move 3:* Is it "Weak but Fair" or "Clearly Mistaken"? It's not *mistaken* logically, but phenomenologically it's a stretch. "Weak but Fair" is safer.
      *   *Refining Move 5:* This is a standard "Separateness of Welfare and Value" move. It's logically sound but dialectically costly. "Weak but Fair."
      *   *Refining Move 8:* This is the knockout punch regarding the Governor. "Clearly Right."

  6.  **Final Review against Constraints:**
      *   Did I rate every move? Yes.
      *   Did I justify ratings? Yes.
      *   Did I state who won? Yes.
      *   Did I address the craving ambiguity? Yes.
      *   Did I avoid a survey? Yes, focused on verdict.

  7.  **Final Polish:** Check the distinction between "Strong" and "Clearly Right." "Clearly Right" implies the point is virtually indisputable within the context. Move 8 fits this because it exposes a logical asymmetry in Nadia's evidentiary rules. Move 2 is "Strong" because it relies on intuition which can be contested (though Paul frames it well).

      *Wait, looking closer at Move 1:* Nadia claims the preference for calm over ecstatic proves highs add nothing. Paul counters in Move 2 that the ecstatic life has *suffering*. Move 1 is actually a bit weak because it assumes the "calm" life doesn't have hidden cravings. But it's a standard opening gambit. I'll rate it "Weak but Fair."

      *Looking at Move 7:* Nadia says dread is anticipatory discomfort. Paul says that's circular. Nadia's point is that the *reason* for refusal is the discomfort, not the loss of value. This is actually a coherent tranquilist move. However, Paul's rebuttal in 8 undermines it. I will rate 7 as "Weak" because it fails to address the *source* of the dread (which Paul identifies as the loss of positive goods).

      *Let's finalize the ratings.*
      1. Weak but Fair.
      2. Strong.
      3. Weak but Fair.
      4. Strong.
      5. Weak but Fair.
      6. Strong.
      7. Weak.
      8. Clearly Right.

      *Overall:* Paul.
      *Missing:* Craving definition is crucial. If craving is dispositional, Nadia's Governor case fails immediately. If occurrent, Paul's Richness case holds. Meaning vs. Welfare is the deeper issue.

      *Wait, one nuance:* The prompt asks me to say if the other side had a good reply available.
      *   For Move 2 (Paul): Nadia's Move 3 is the standard reply. Is there a better one? She could have argued that "absorption" *is* the absence of craving (flow state). She did argue something similar.
      *   For Move 8 (Paul): Nadia has no good reply. This is the weak point of her position.

      *Okay, ready to write.*
answer: |-
  ### Adjudication of the Exchange

  **1. Nadia:** **Weak but Fair.**
  Nadia correctly identifies that intuitions about "the good life" often conflate welfare with other values (ambition, narrative shape). However, her use of the "calm vs. ecstatic" preference is question-begging. She assumes the ecstatic life contains "comparable totals of enjoyment," but if tranquilism is true, the "highs" are welfare-neutral, meaning the ecstatic life is strictly worse due to the lows. She cannot use a preference for calm to prove tranquilism without already assuming that highs lack weight.
  *Available Reply:* Paul could have pressed harder here on whether the preference for calm is actually a preference for *security* (avoiding the risk of lows) rather than a judgment that highs are valueless.

  **2. Paul:** **Strong.**
  The "Argument from Residual Richness" is the strongest philosophical objection to negative hedonism. By holding craving and suffering constant (at zero) and varying only the positive phenomenological content (Beethoven vs. grey neutrality), Paul isolates the specific claim of tranquilism: that positive states have zero weight. This forces Nadia into a reductive corner.
  *Available Reply:* Nadia's subsequent move (3) is the standard reply, but she could have strengthened her position by arguing that "absorption" in the quartet is itself a state of craving-satisfaction (a flow state), thereby denying the premise that the two subjects are equally craving-free.

  **3. Nadia:** **Weak but Fair.**
  Nadia attempts to save the theory by reducing all positive phenomenology to relief (the cessation of craving). This is a coherent internal defense, but it is phenomenologically dubious. While some pleasures are reliefs (eating when hungry), many are not (listening to music when not distressed). Asserting that *all* enjoyment collapses into relief is a substantial empirical claim she does not support.
  *Available Reply:* Paul could have noted that relief has a specific temporal structure (tension → release) that does not match the sustained appreciation of art, which lacks the antecedent tension.

  **4. Paul:** **Strong.**
  This move successfully generalizes the objection beyond sensory pleasure to "higher goods" (achievement, knowledge). It highlights that tranquilism renders prudential planning unintelligible: if the goal (achievement) has no positive weight, one cannot rationally accept negative weight (struggle) to attain it. This strikes at the practical application of the theory.
  *Available Reply:* Nadia's reply (5) is the only one available—biting the bullet—but she fails to address why, if achievement has no welfare weight, it commands such universal prudential endorsement.

  **5. Nadia:** **Weak but Fair.**
  Nadia preserves logical consistency by distinguishing *welfare* from *admirability* or *choice*. This is a standard move in welfare theory (e.g., separating "what is good for me" from "what is good simpliciter"). However, it comes at a high dialectical cost: it renders the theory less useful for guiding life choices, which is usually the point of debating welfare.
  *Available Reply:* Paul could have argued that a theory of welfare that systematically diverges from rational choice is defective by definition, as welfare is supposed to be the object of rational self-interest.

  **6. Paul:** **Strong.**
  Paul identifies a self-sealing mechanism in the Governor case. If the device alters the desires used to evaluate the device, the evaluation is circular. This is a serious epistemic objection. Furthermore, he correctly notes that refusal of the device implies a trade-off (craving for goods) that tranquilism denies exists.
  *Available Reply:* Nadia's reply (7) attempts to normalize this by comparing it to career changes, but the analogy fails because careers do not chemically suppress the capacity to evaluate the career.

  **7. Nadia:** **Weak.**
  Nadia's defense here is the weakest link in her chain. She claims the refusal is based on "dread" (anticipatory suffering). While technically consistent with tranquilism, it ignores the *intentional object* of the dread. People dread the Governor not because of the feeling of dread itself, but because of what the Governor *removes* (striving/positive engagement). To say the dread is just "suffering" ignores that the suffering is *about* the loss of something valued.
  *Available Reply:* Paul's subsequent move (8) effectively closes this off.

  **8. Paul:** **Clearly Right.**
  This is the decisive move. Paul exposes an asymmetry in Nadia's evidentiary rules: reports from the tranquil state are accepted as truth (contentment), while reports from the pre-tranquil state are discounted or reinterpreted (dread). A theory of welfare that must invalidate the subject's own reasoning process to remain consistent is epistemically bankrupt. It transforms the theory from an account of well-being into a paternalistic rule for dismissing dissent.

  ***

  ### Overall Verdict

  **Paul has the better of the argument.**

  Nadia succeeds in keeping her theory logically consistent, but she does so by retreating into a narrow definition of welfare that contradicts phenomenological experience and creates epistemic circularity. Paul successfully demonstrates that tranquilism cannot account for the value of positive states (Move 2), makes prudential trade-offs unintelligible (Move 4), and relies on a biased interpretation of self-report to survive the Governor case (Move 8). Nadia's best moves (3 and 5) require her to deny common experience or admit the theory is irrelevant to choice; Paul's best moves show the theory is internally coherent only if it ignores the data it purports to explain.

  ### The Missing Elements

  **1. The Ambiguity of Craving**
  The verdict shifts significantly depending on how "craving" is defined, and this ambiguity is doing unacknowledged work in Nadia's favor.
  *   **If Craving is Occurrent (Felt):** Nadia's defense of the Governor is stronger. The Governor removes the *feeling* of frustration. However, Paul's "Residual Richness" argument (Move 2) becomes devastating, because one can have rich occurrent experience without occurrent craving.
  *   **If Craving is Dispositional (Standing Desire):** Paul wins easily. The Governor suppresses the *force* of desire, but if the disposition remains, the subject is still in a state of "craving" on the dispositional reading. If the disposition is removed, the subject is no longer the same agent making choices. Nadia slides between these: she needs craving to be occurrent to say the Governor works, but dispositional to explain why the "grey" life is devoid of value (since a dispositional desire for stimulation is absent).
  *   **Impact:** If the definition is fixed as **Dispositional**, Nadia's Move 1 and 7 collapse (the Governor doesn't remove craving, it masks it). If fixed as **Occurrent**, Paul's Move 2 stands unrefuted (richness without craving is possible). The ambiguity allows Nadia to survive longer than she should.

  **2. Welfare vs. Meaning**
  Both parties miss the extent to which they are debating **meaning** under the label of **welfare**.
  *   Nadia is correct that "striving" might be meaningful without increasing welfare (Move 5).
  *   Paul is correct that a life without striving feels "worse" for the person living it, not just less admirable to observers.
  *   **The Missed Synthesis:** The debate stalls because they are using "welfare" to do two jobs: tracking phenomenal state (Nadia's focus) and tracking successful agency (Paul's focus). Tranquilism is likely a plausible theory of *phenomenal welfare* (how it feels), but a failed theory of *prudential value* (what is good for a person to pursue). Paul wins because in the context of the Governor—a device that alters how life is lived—the distinction collapses. You cannot separate how a life feels from how it is lived when the device changes the living of it. Paul recognizes this; Nadia tries to maintain the separation to save the theory.
