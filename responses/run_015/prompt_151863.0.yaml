  # Teaching Plan: Displacement Density and Moral Accounting

  ## 1. Component Sequencing and Rationale

  You must introduce the three components in this specific order: **1. Crop Mortality, 2. Feed-Conversion Ratios (FCR), 3. Displacement Density.**

  **Why this order works:**
  This sequence moves from the concrete to the abstract, building the metric layer by layer.
  *   **Step 1 (Crop Mortality):** Establishes the baseline moral cost of *any* agriculture. It disrupts the default assumption that plant cultivation is harm-free. By starting here, you ground the seminar in a tangible mechanism (harvest deaths) that students can visualize immediately.
  *   **Step 2 (FCR):** Introduces the multiplier. Once students accept that crops kill, FCR demonstrates how meat consumption amplifies that kill count. It bridges the gap between "farming harms" and "eating meat harms."
  *   **Step 3 (Displacement Density):** Synthesizes the previous two with the final variable: pasture-driven habitat compression. This is the most abstract concept, so it must come last. It allows students to see beef not just as "more crops" (via FCR) but as "more land" (via pasture).

  **Why reversing Crop and Pasture breaks the intuition:**
  If you introduce the pasture-driven habitat compression (the core of the beef argument) before establishing crop mortality, students will anchor on **land size** rather than **harm density**. They will intuitively treat "empty pasture" as morally neutral space. By forcing them to account for crop mortality first, you establish that *all* agricultural land imposes a cost. When you then add pasture displacement, it registers as an *additional* burden rather than a substitute for crop harm. Reversing this allows students to compartmentalize beef as "land use" and chicken as "crop use," missing the cumulative moral weight that "displacement density" is designed to capture.

  ## 2. The Comparative Example

  **Use: Soy-Fed Beef vs. Soy-Fed Chicken.**

  Do not use grass-fed beef for this specific lesson. While grass-fed beef reduces crop mortality, it complicates the variable you are teaching: displacement density. If you use grass-fed beef, students will fixate on the lack of crop deaths and miss the habitat compression argument.

  **Why this pair:**
  By controlling for feed type (soy for both), you isolate the efficiency variable.
  *   **Chicken:** High efficiency (low FCR), low land use, negligible pasture.
  *   **Beef:** Low efficiency (high FCR), high land use, significant pasture compression.

  **Addressing the Hidden Assumption:**
  You must explicitly state that this comparison assumes **land-use efficiency is the primary moral proxy**. Students may intuitively feel that "efficient" equals "good." You need to flag that this is a utilitarian calculation specific to this metric, not a holistic verdict on environmental ethics. This prevents them from smuggling in assumptions that "efficient farming is automatically morally superior" without scrutinizing the suffering intensity within that efficiency.

  ## 3. Predictable Misconceptions and Defusal Points

  **Misconception 1: Conflating "Body Count" with "Suffering"**
  *   **The Error:** Students will assume that because crop mortality involves millions of mice and insects, it outweighs the suffering of fewer large animals in pasture displacement.
  *   **Where to Defuse:** **Step 1 (Crop Mortality).**
  *   **The Fix:** Explicitly decouple *quantity* from *intensity*. State clearly: "Displacement density tracks the *scope* of impact, not necessarily the *depth* of suffering. We are mapping the footprint first; we will weigh the pain separately."

  **Misconception 2: The " Invisible Habitat" Bias**
  *   **The Error:** Students will treat pasture land as "empty" or "natural," missing that managed pasture compresses wild populations even without fencing.
  *   **Where to Defuse:** **Step 3 (Displacement Density).**
  *   **The Fix:** Use the term "compression" deliberately. Explain that displacement isn't just animals being fenced out; it's the reduction of carrying capacity for wild populations within the agricultural zone.

  **Misconception 3: The "Vegan Escape"**
  *   **The Error:** Students may argue that avoiding meat entirely solves the crop mortality issue.
  *   **Where to Defuse:** **Step 2 (FCR).**
  *   **The Fix:** Show the math. Even if humans eat the soy directly, the land use exists. The lesson is about *relative* density per protein unit, not absolute zero harm. Keep the focus on the comparative metric, not the ideal outcome.

  ## 4. Scope Refusal

  **What to refuse to explain:** **Full ecological population modeling.**

  Students will ask about trophic cascades, predator-prey dynamics, or whether displaced animals migrate successfully. Refuse this. State: "We are using a static metric for moral accounting, not a dynamic ecological simulation. We are measuring the *pressure* applied, not the complex biological *response*." If you open the door to population dynamics, the seminar will bog down in empirical disputes rather than moral architecture.

  ## 5. Final Check Question

  To verify they grasp displacement as a separate concept from direct mortality, ask this:

  > "Imagine a new farming technology reduces harvest deaths (crop mortality) by 50% but requires 200% more land to produce the same protein. According to the displacement density framework, has the moral footprint increased or decreased, and which component drives that change?"

  **Correct Answer Logic:**
  They must identify that while the *crop mortality* component dropped, the *habitat compression* component likely spiked due to the land increase. If they answer solely based on the reduced death count, they have failed to separate displacement from direct killing. They need to recognize that displacement density can rise even if direct kills fall.
