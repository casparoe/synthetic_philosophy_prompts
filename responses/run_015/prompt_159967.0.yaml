      *   *Correction:* You need two phases. Phase 1 (Actual World): Empirical lookup determines that the stuff in lakes maps to structure H2O. Phase 2 (Modal Check): Iterate through counterfactual worlds. In World W, does the stuff that *actually* is water (H2O) exist? If yes, is it H2O? The "necessity" isn't that the *word* maps to the *structure* in all worlds (that's rigidity), but that the *object* picked out in the actual world has that structure in all worlds where it exists.
      *   *Wait, deeper issue:* "Water is H2O" is an identity statement between a natural kind term and a structural description. Kripke argues natural kind terms are rigid. H2O is a rigid description of a structure. So if Water = H2O in actual world, it is true in all worlds.
      *   *User's "Cheap" Feeling:* It feels cheap because in their code, `const WATER = H2O`. Of course `WATER == H2O` is necessary.
      *   *The Fix:* The model needs to distinguish between the *intension* (the lookup rule) and the *extension* (the stuff). In the user's model, the rigid designator *is* the pointer. In Kripke, the rigid designator picks out an object. The "a posteriori" part is discovering *which object* the pointer points to. The "necessary" part is that *given* it points to that object, it points to it in all worlds.
