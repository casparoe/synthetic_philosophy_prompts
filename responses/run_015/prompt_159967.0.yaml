      *   *User's Model:*
          *   Rigid Designator: A global variable/pointer bound at $t_0$ (actual world).
          *   Necessity: $\forall s \in Reachable, P(s)$.
          *   Identity: Pointer equality.
          *   Result: "Water = H2O" is true by definition of the pointer.

      *   *Kripke's Semantics (Standard Possible Worlds):*
          *   Possible Worlds: Complete ways the world could have been (counterfactuals), not just epistemic possibilities or future states.
          *   Rigid Designator: Refers to the *same object* in every world where that object exists, *not* via a description satisfied in that world.
          *   Necessity: True in all possible worlds.
          *   A Posteriori: We need empirical investigation in the *actual world* to fix the reference before we can evaluate the modal claim.

      *   *The Core Mismatch:* The user is modeling *epistemic* modality (what we know/label) or *temporal* modality (states over time) rather than *metaphysical* modality (counterfactual realities). The user's "states" look like "times" or "epistemic states," whereas Kripke's "worlds" are "counterfactual scenarios."

