          *   *Implicit vs. Explicit Bias/Control.*
          *   *Michel Foucault:* Disciplinary power (panopticon) vs. Sovereign power (public execution).
          *   *Winner's own distinction:* He talks about technologies *requiring* specific political structures (inherent politics) vs. technologies *compatible* with many (compatible politics).
          *   *Best Fit:* Lawrence Lessig's "Code is Law" (architecture regulating behavior without words) vs. Legal regulation. Also, "Normative Artifacts" (Verbeek).
          *   *Silent:* "Material Politics," "Embedded Values," "Opaque Algorithmic Governance."
          *   *Loud:* "Regulatory Framework," "Terms of Service," "Signage."
      *   *Theory Fit:* This distinction fits better with *Soft Determinism* or *Social Shaping of Technology* where human intent is visible in the "loud" but sedimented in the "silent." It aligns closely with Lessig's modalities of regulation.

  4.  **Drafting the Response:**

