      *   *Refinement:* Actually, Dana's Move (3) is very strong. Ravi's Move (2) doesn't fully defeat Dana. But Ravi's Move (4) on parsimony is the clincher. I will give the edge to Ravi on the *explanation of the phenomenon*, but acknowledge Dana's methodological point. Let's say Ravi is more right overall because he better explains *why* the asymmetry exists (constitutive normativity) rather than just labeling it "bias."

