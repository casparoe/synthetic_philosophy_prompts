answer: |-
  **Move (1) Dana:** **Mostly Right.** She correctly identifies that mental states are held fixed while judgments shift, which strongly suggests moral valence influences the response. However, she is too quick to conclude this proves the concept is purely descriptive; it could instead show the concept is inherently normative.

  **Move (2) Ravi:** **Mostly Right.** He successfully demonstrates that the asymmetry tracks norm-violation rather than just harmful consequences, which undermines a simple "harm-based bias" explanation. However, the fact that 31% still said "intentionally complied" suggests the asymmetry is not absolute, leaving room for Dana's claim that other factors are at play.

  **Move (3) Dana:** **Clearly Right.** She correctly points out that swapping "harm" for "rule violation" does not distinguish between a concept that *is* normative and one that is merely *influenced* by normativity. Until blame and intentionality come apart, the "contamination" hypothesis remains viable.

  **Move (4) Ravi:** **Mostly Right.** His parsimony argument is strong: if two judgments always move together, positing two separate mechanisms is theoretically costly. However, he conflates the psychological reality of how we judge with the philosophical utility of having a precise, neutral definition for theory-building.

  **Move (5) Dana:** **Mostly Right.** She accurately maps the methodological dilemma: philosophers must either stipulate a technical term or risk importing moral verdicts into descriptive premises. She is slightly mistaken, however, in assuming stipulation is cost-free; abandoning ordinary language can make theories less applicable to real-world responsibility.

  **Move (6) Ravi:** **Mostly Right.** He is right that conceptual analysis should explain the concepts we actually use to hold each other accountable, not just idealized versions. Yet, he underestimates that ordinary language is often inconsistent, and philosophy sometimes requires cleaning up those inconsistencies to avoid contradiction.

  ***

  **Overall Verdict:**
  **Ravi is more right overall.** While Dana correctly identifies the methodological risks, Ravi provides the better explanation for *why* the data looks the way it does. The fact that the asymmetry persists even without harmful consequences (Move 2) and his parsimony argument (Move 4) suggest that normativity is constitutive of our ordinary concept of intentional action, not merely an external bias contaminating a neutral judgment.

  **What Both Are Missing:**
  Both treat "intentional" as a monolithic, static concept that means the same thing in every context. They ignore the possibility that the meaning is **gradable** or **context-sensitive**: we might use a stricter standard of control for praise than for blame, not because the concept is normative, but because the *stakes* of the conversation change the threshold for applying the word. They also both focus entirely on the observer's judgment, ignoring the agent's own perspective on whether they felt they acted intentionally.

  ***

  **Proposed Survey Version:**
  **The "Justified Violation" Case.**
  Present a story where Maya violates the handbook rule (placing machines at nine feet) but does so to prevent a serious safety hazard (e.g., the ten-foot spot blocks a fire exit). Ask: "Did Maya intentionally violate the handbook rule?" and "Is Maya to blame?"

  *   **Favors Dana:** If respondents say she **did** intentionally violate the rule (high percentage) but is **not** to blame (low percentage). This would show the descriptive judgment of intentionality can remain high even when the negative moral judgment is removed, proving the concepts can come apart.
  *   **Favors Ravi:** If respondents say she **did not** intentionally violate the rule (low percentage, closer to the compliance baseline). This would show that when the normative "sting" of the violation is removed by justification, the attribution of intentionality drops, proving the concept is inherently tied to answerability for a wrong.
