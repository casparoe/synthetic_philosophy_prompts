answer: |-
  ### The Decision Tree: Dramatizing the Dead

  This tree forces you to locate your ethics in your workflow. Answer **Yes** or **No** to each question. Follow the path to your leaf.

  **Q1. Did the subject leave explicit instructions against being portrayed?** (Case 6)
  *   **Yes:** Go to Q2.
  *   **No:** Go to Q4.

  **Q2. Do you treat their veto as binding and abandon the project?**
  *   **Yes:** **Leaf 1: The Executor.**
      *   *Awkward Commitment:* "I must let some public truths die to keep a private promise."
  *   **No:** Go to Q3.

  **Q3. Do you explicitly signal to the audience that you are overriding the subject's wishes?**
  *   **Yes:** **Leaf 2: The Whistleblower.**
      *   *Awkward Commitment:* "I must publicly shame the dead to honor the living."
  *   **No:** **Leaf 3: The Sovereign.**
      *   *Awkward Commitment:* "My judgment of historical value outweighs the subject's autonomy."

  **Q4. Is the available evidence either contradictory (memoir vs. archive) or compromised by power dynamics (exploiter records)?** (Cases 4 & 5)
  *   **Yes:** Go to Q5.
  *   **No:** Go to Q6.

  **Q5. Do you intervene (speculate or correct) to restore the subject's agency or truth?**
  *   **Yes:** **Leaf 4: The Restorer.**
      *   *Awkward Commitment:* "I must imagine their mind to prove they had one."
  *   **No:** **Leaf 5: The Archivist.**
      *   *Awkward Commitment:* "I must publish silence rather than risk speculation."

  **Q6. Do you move verified events in time or merge minor real people for narrative flow?** (Cases 2 & 3)
  *   **No:** **Leaf 6: The Chronicler.**
      *   *Awkward Commitment:* "I will bore the audience to keep the timeline clean."
  *   **Yes:** Go to Q7.

  **Q7. Do you invent intimate relations or assign villainy without archival evidence?** (Cases 1 & 7)
  *   **No:** **Leaf 7: The Dramatist.** (Most students land here)
      *   *Awkward Commitment:* "I claim fidelity while admitting I moved the furniture."
  *   **Yes:** Go to Q8.

  **Q8. Do you explicitly signal these high-stakes inventions to the audience (e.g., Author's Note, disclaimer)?** (Pet Distinction A)
  *   **Yes:** **Leaf 8: The Transparent Fictionalist.**
      *   *Awkward Commitment:* "I must label my speculation as history to sell it."
  *   **No:** **Leaf 9: The Fabricator.**
      *   *Awkward Commitment:* "I claim truth while knowing I lied about the body."

  ***

  ### Logical Space Analysis

  **Unoccupied Combinations**
  Because this is a pruned tree, not a full matrix, several logical combinations are structurally impossible.
  *   **The "Respectful Fabricator" (Q1-Yes, Q2-No, Q7-Yes, Q8-No):** You cannot override a subject's explicit veto (Q2-No) and then arrive at *The Fabricator* (which requires passing through Q6/Q7). The tree assumes that if you violate consent, you are already in a high-harm category; you don't get to "calmly" invent sex scenes after ignoring a veto without passing through the "Sovereign" leaf. This combination is **unattractive**; writers who ignore vetos usually justify it via "Sovereign" historical importance, not by hiding the invention separately.
  *   **The "Silent Restorer" (Q4-Yes, Q5-Yes, Q8-Yes):** You cannot reach Q8 (Signal Invention) from the Q4/Q5 branch. The tree assumes that if you are correcting compromised archives (*The Restorer*), you are dealing with *evidence*, not *invention*. If you speculate to restore agency, the tree classifies that as restoration, not the "invention" tracked in Q7/Q8. This is a **structural pruning** decision: distinguishing "restorative speculation" from "dramatic invention" is vital, so they occupy different branches.

  **Indistinguishable Leaves**
  *   **The Sovereign (Leaf 3) vs. The Fabricator (Leaf 9):** The tree cannot separate these two based on *audience impact*. Both result in a work where the audience believes they are seeing truth, but the writer has knowingly violated a constraint (one of consent, one of evidence). Unless the writer confesses (moving them to *Whistleblower* or *Transparent Fictionalist*), the audience sees the same product: an undisclosed falsehood. The distinction exists only in the writer's private intent.

  ***

  ### Evaluation of Pet Distinctions

  **(a) The Two-Audience Problem (Duty to Person vs. Duty to Audience/History)**
  *   **Verdict:** **Load-Bearing.**
  *   **Placement:** This is the engine of **Q3** and **Q8**.
  *   **Why:** The tree proves this distinction sorts writers effectively. *The Whistleblower* and *The Transparent Fictionalist* both prioritize the audience's right to know (Duty to Audience) over the smoothness of the illusion. *The Sovereign* and *The Fabricator* prioritize the story's impact (Duty to Story/History) over the audience's epistemic security. Without this branch, *The Whistleblower* and *The Sovereign* would collapse into the same leaf, obscuring a major ethical difference in how the writer views their contract with the viewer.

  **(b) Attention Scarcity (Opportunity Cost/Canon)**
  *   **Verdict:** **Not a Sorting Distinction.**
  *   **Placement:** **Nowhere (Pre-Tree).**
  *   **Why:** This distinction fails the "decision at a desk" test. Attention scarcity is a *selection* criterion (Who do I write about?), not a *dramatization* criterion (How do I write them?). Once you are in the workshop asking "Do I invent this sex scene?", the decision to write about *this* person instead of *that* person has already been made.
  *   **Unoccupied Space:** There is no leaf for "I wrote this person *only* because no one else was available." If a writer claims they are dramatizing a figure solely due to scarcity, they usually default to *The Archivist* (safe, low intervention) or *The Restorer* (high intervention to justify the choice). Scarcity motivates the project, but it doesn't dictate the *method* of depiction. It is a justification for Q1 (Why override the veto? Because they are the only voice we have), but it doesn't create a unique branch.
