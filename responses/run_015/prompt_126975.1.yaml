answer: |-
  Good morning. Welcome to [City Name].

  We are gathered here among the repaired veins of this city. The water flows again. The trains run. But we know that infrastructure is not just concrete and pipe; it is trust. And trust is rebuilt slowly, through honest work.

  Looking around this room, I see two distinct ways of knowing. On one side, I see the people who lived the crisis. You are the engineers, the emergency managers, the officials who slept in your offices. You hold the "inside view." You know the specific phone calls, the resource constraints, the contingent judgments made at 3:00 AM.

  On the other side, I see the analysts, the economists, the scholars. You hold the "outside view." You bring reference classes, base rates, and statistical models. You know how similar systems fail and recover across time and geography.

  And to the family members of our local officials here today: thank you. You remind us that behind every decision log is a human being, and behind every statistic is a community.

  Usually, workshops like this try to pick a winner. We often argue that the truth is either in the gritty details of experience or in the clean patterns of data. Today, we will do neither. Instead, we will treat the tension between these views as a structural constraint. We are practicing epistemic modesty. We are admitting that neither side sees the whole elephant.

  The inside view carries a specific blindness. When you have fought hard to save a system, it is natural to weave a narrative where your actions caused the survival. You risk overfitting your local story, seeing causal chains where there was actually chaos or luck.

  The outside view carries a different blindness. When you study systems from a distance, you risk underweighting the contingent recovery path that was actually taken. You see the trend line, but you might miss the moment the line nearly broke.

  This brings us to the core challenge of our work. I call it the drift between intended agency and recorded outcome. It is the gap between what decision-makers knew they meant in the moment and what external measurement can later verify.

  In the heat of crisis, you act on intention. You valve off a sector to save the grid. You reroute a bus line to clear a zone. Later, the data records the outcome. Sometimes, the data confirms your intent. Often, it shows something else entirely. If we ignore this drift, our recommendations will be flawed. If we only trust the intention, we indulge in myth. If we only trust the outcome, we erase human judgment.

  So, how do we proceed? We hold these views in productive friction. We do not seek to resolve the tension prematurely. We seek to survive it.

  To that end, I propose one working norm for this workshop. It is simple, but it will be difficult. No proposal should be adopted unless it can be articulated honestly from both the inside and the outside view.

  If a recommendation makes sense to the modeler but sounds like fiction to the engineer who stood in the floodwater, it is not ready. If a solution feels true to the practitioner but looks like a statistical anomaly to the economist, it is not ready. We must build findings that are robust enough to withstand the scrutiny of data and human enough to withstand the scrutiny of experience.

  We are here to learn how to bend without breaking. Let us begin by ensuring our own methods do not snap under the weight of their own certainty.

  Thank you. Welcome to the work.
