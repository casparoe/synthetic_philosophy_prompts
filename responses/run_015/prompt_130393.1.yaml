answer: |-
  Two epistemologists, Silas and Mara, are grading papers.

  Silas sighs, putting down a red pen. "I'm struggling to assign a grade. Inside view, the argument is sound. But outside view, students who think their arguments are sound are usually wrong."

  Mara doesn't look up. "So discount your confidence."

  "I did. But then I asked: what's the reference class for 'people discounting their confidence'?"

  "‘Graduate students’?"

  "Too broad," Silas says. "Dilutes the base rate with dissimilar reasoners who don't care about bias. I need a class of people actually trying to be modest."

  "Okay. ‘People trying to be modest’."

  "But to know if I'm in that class, I need to know if I'm *actually* being modest, or just performing it. That requires an inside view of my own neglect."

  Mara finally looks up. "So you need an inside view to verify your eligibility for the outside view?"

  "Exactly. If I use the outside view to check for my neglect of the outside view, I need a base rate for neglect. But to apply that base rate to *me*, I need an inside view to confirm I'm not an exception. Which defeats the purpose of the outside view."

  "So you're stuck."

  "Not quite. I solved the reference class problem."

  "Oh?"

  "I defined the class as: ‘People who recognize that applying the outside view to their own neglect requires an inside view about that very neglect.’"

  Mara blinks. "And how many people are in that class?"

  "Currently? Just me."

  "So your outside view is based on a sample size of one?"

  "Technically, yes. But since I have perfect inside-view access to the only data point, the inside and outside views converge."

  "So you're certain?"

  "I'm 100% confident that I am uniquely humble."

  "Silas," Mara says, picking up her pen. "That's not epistemic modesty. That's a fortress of solitude built out of base rates."

  "Maybe," Silas shrugs. "But the error bars are incredibly tight."
