answer: |-
  # Workshop Activity: "The Ghost Provenance"

  **Time:** 75 Minutes
  **Participants:** 13 (Individual play, collective discussion)
  **Goal:** Experientially isolate *Intentional Causation* from *Material Continuity* to test why we value originals.
  **Core Twist:** The "Ghost Canvas" (Authentic materials, inauthentic mind).

  ---

  ## 1. Setup & Materials (Prep Time: 30 mins)

  **The Artworks:**
  Select 3 famous, visually distinct paintings (e.g., a Rothko, a Van Gogh, a Warhol). Print high-quality A4 color copies of each.
  *   **Crucial Constraint:** Tell participants: *"For the purpose of this simulation, assume all versions presented are visually indistinguishable under forensic scanning. You cannot judge by eye."*

  **The Player Packets:**
  Each participant gets a folder with 3 "Appraisal Sheets" (one per artwork). Each sheet has three sections:
  1.  **Visual:** (The Image)
  2.  **Material Certificate:** (Sealed with "Open Round 1" sticker)
  3.  **Causal History:** (Sealed with "Open Round 2" sticker)

  **Currency:**
  "Curator Cred" (CC). Start everyone with **100 CC**. Use poker chips or just track on paper.

  ---

  ## 2. Game Flow

  ### Phase 1: The Blind Valuation (20 mins)
  1.  **Instruction:** You are senior appraisers for a national museum. Your reputation (CC) depends on acquiring valuable works and avoiding fakes.
  2.  **Action:** Open **Visual** and **Material Certificate** only.
      *   *Material Certs vary:*
          *   **Piece A:** Period-correct canvas, period-correct pigments, sourced from artist's known supplier.
          *   **Piece B:** Modern synthetic canvas, modern pigments, chemically matched to look old.
          *   **Piece C (The Ghost):** Period-correct canvas, **Artist's actual leftover paint tubes**, **Artist's actual brushes** found in studio after death.
  3.  **The Bet:** For each piece, wager 0–20 CC on the statement: *"This work belongs in the Permanent Collection as an Original."*
      *   High Wager (15-20): You certify it as an Original.
      *   Low Wager (0-5): You certify it as a Copy/Replica.
  4.  **Collection:** Collect wagers. Do not reveal outcomes yet.

  ### Phase 2: The Causal Reveal (20 mins)
  1.  **Instruction:** "Forensic historians have released the Causal History reports. This details the *chain of intention*."
  2.  **Action:** Open **Causal History** seals.
      *   **Piece A (True Original):** "Painted by Artist's hand, 1954. Signed. Witnessed by dealer."
      *   **Piece B (Perfect Copy):** "Created 2023 by master forger. No contact with Artist. Intention: Deceive."
      *   **Piece C (The Ghost):** "Created 1955 by Artist's Studio Assistant. Used Artist's open paint and brushes. **Intention:** 'Finish the masterpiece the Boss left incomplete.' **Artist never saw this stroke, never authorized it, and was deceased when the final layer was applied.**"
  3.  **The Re-Bet:** Participants may adjust their wagers (increase, decrease, or hold).
      *   *Rule:* If you change your wager from Round 1 to Round 2, it costs 2 CC (transaction fee).
  4.  **Scoring:** Reveal the "Market Truth."
      *   **Piece A:** High wagers win 2x. Low wagers lose 50%.
      *   **Piece B:** Low wagers win 2x. High wagers lose 100% (You bought a fake).
      *   **Piece C (The Ghost):** Low wagers win 2x. High wagers lose 100%.
      *   *Note:* The game treats the Ghost as a "Fake" for scoring purposes to create the tension.

  ### Phase 3: The Debrief (35 mins)
  *See detailed guide below.*

  ---

  ## 3. The "Ghost" Card Text (Example)
  *Print this exactly to ensure the philosophical distinction lands.*

  > **ARTIFACT C: "Sunset Study"**
  > **Material Provenance:** VERIFIED. Canvas weave matches 1954 batch. Pigment analysis matches open tubes found in Artist's studio sink. Brush hairs match Artist's preferred size 6 sable.
  > **Causal Chain:** BROKEN. Artist died March 1954. This stroke was applied April 1954 by Assistant. Assistant intended to "honor the Artist's vision." Artist had no mental state regarding this specific mark. No aesthetic decision was transmitted from Artist's mind to this canvas.

  ---

  ## 4. Debrief Guide: Mapping the Tension

  Do not just tally scores. Use the score shock to drive the philosophy.

  **Step 1: The Material Intuition (5 mins)**
  *   Ask: "In Round 1, before knowing the Causal History, how many of you wagered High on Piece C (The Ghost)?"
  *   *Likely Outcome:* Many will bet High because the materials were authentic.
  *   *Concept:* **Material Continuity.** We feel the "dust of the artist" confers value.

  **Step 2: The Intentional Shock (10 mins)**
  *   Ask: "Who dropped their wager on Piece C after reading the Causal History? Why?"
  *   *Likely Outcome:* Most will drop it.
  *   *Concept:* **Intentional Causation.** The value vanished when the *mind* was removed, even if the *matter* remained.
  *   *Discussion:* "If the paint is the same, and the look is the same, what exactly disappeared? Is art a physical object or a historical event?"

  **Step 3: The Normative Limit (10 mins)**
  *   **Crucial Facilitator Note:** You must admit the game's limitation here.
  *   *Script:* "The scoring system punished you for valuing the Ghost. It treated the Ghost as worthless. But did the game prove the Ghost *is* worthless? No. It only proved that the **Art Market** treats it as worthless."
  *   *Question:* "If we found out tomorrow that the Assistant actually captured the Artist's vision *better* than the Artist would have, does the Causal Chain still matter? Or is 'Authenticity' just a fetish we can't shake?"

  **Step 4: Mapping the Triad (10 mins)**
  Draw this on the whiteboard based on their votes:
  1.  **Perceptual Identity:** (Identical across all 3). Did anyone vote based on this? (Hopefully no).
  2.  **Material Continuity:** (High in A & C). Did this carry weight in Round 1?
  3.  **Intentional Causation:** (High in A only). Did this override Material Continuity in Round 2?

  ---

  ## 5. Predictable Failure Modes & Mitigation

  You are right to worry about participants ignoring the hidden info. Here is what will actually go wrong and how to fix it:

  **Failure 1: The Aesthetic Rebellion**
  *   **What happens:** Participants say, "I don't care about the history. Piece C looks beautiful. I'm betting High anyway."
  *   **Why:** They reject the premise that provenance dictates value.
  *   **Mitigation:** Pre-frame the game. *"You are not buying for your living room. You are appraising for a National Archive. Your job is to assess **Historical Authenticity**, not Beauty. If you bet High on a fake, you are fired."* Force them into the institutional role.

  **Failure 2: The "Ghost" Confusion**
  *   **What happens:** Participants treat Piece C as just a "really good forgery" and don't see the nuance of the *artist's paint*.
  *   **Why:** The distinction between "fake paint" and "real paint, wrong hand" is subtle.
  *   **Mitigation:** During the Round 2 reveal, dramatize it. *"This isn't a forgery trying to trick you. This is a relic that lacks a soul. It is the Artist's body, but not the Artist's action."*

  **Failure 3: Score Apathy**
  *   **What happens:** Since it's not real money, they don't feel the "loss" when the Ghost is revealed as valueless.
  *   **Why:** Points feel abstract.
  *   **Mitigation:** Add a non-monetary stake. The person with the most CC at the end gets to choose the topic for the next workshop OR gets a physical "Master Appraiser" certificate (printed nicely). Make the status visible.

  **Failure 4: The Normative Blindspot**
  *   **What happens:** The group concludes "Originals are objectively better" because the game said so.
  *   **Why:** The scoring key reinforces the status quo.
  *   **Mitigation:** This is where your debrief honesty is vital. You must explicitly state: *"This game simulates the current market, not metaphysical truth. Nelson Goodman (philosopher) argued that knowing a work is a copy changes our perception of it. Others argue the aesthetic experience is all that matters. The game forces you to feel the **pull** of essentialism, not the **truth** of it."*

  ## 6. Why This Works for Your Niche
  The "Ghost Canvas" prevents the easy answer of "Fake paint = Fake art." By giving them the *Artist's matter*, you validate their material intuition in Round 1. By stripping the *Artist's mind* in Round 2, you force them to confront whether art resides in the **object** or the **history**. The point loss creates a somatic marker (frustration/regret) that makes the philosophical discussion stickier than a lecture ever could.
