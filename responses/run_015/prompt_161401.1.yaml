answer: |-
  ## Part 1: The Logical Map (Facilitator's Eyes Only)

  Before you print the handout, here is the architecture behind it. This explains how the ten questions carve up the logical space, where the seven target positions sit, and where the quiz inevitably blurs.

  ### The Four Axes of the Tree
  To separate the seven views without using jargon, the questions target four underlying distinctions:

  1.  **Eligibility (Who counts?):** Can non-humans, children, or the dead be proper targets of blame?
      *   *Splits:* Forward-Looking (Anyone, if useful) vs. The Rest (Requires specific agency/capacity).
  2.  **Grounds (What matters?):** Does blame track *outcomes* (luck), *quality of will* (intent), or *history* (upbringing/capacity)?
      *   *Splits:* Strawson/Scanlon (Will) vs. Moral Luck (Outcome) vs. Reasons/Deep-Self (History/Capacity).
  3.  **Function (Why do it?):** Is blame about *desert* (past), *relationships* (meaning), or *consequences* (future)?
      *   *Splits:* Hard-Incompatibilist/Forward-Looking (No Desert) vs. The Rest (Desert/Relationship).
  4.  **Expression (Feel vs. Act):** Is the *feeling* of blame correct even if *voicing* it is wrong?
      *   *Splits:* Fittingness-Only (Feel yes, Act no) vs. Strawson (Feel yes, Act yes) vs. Forward-Looking (Feel no).

  ### Locating the Seven Leaves
  Here is where your target positions land on this tree:

  *   **Strawsonian:** Humans only. Quality of Will. Desert + Natural Expression.
  *   **Scanlonian:** Humans only. Meaning/Relationship. Desert + Modified Expression.
  *   **Reasons-Responsiveness:** Capacity matters. History excuses if it blocks reason-recognition. Desert.
  *   **Deep-Self:** Identification matters. History excuses if it blocks deep values. Desert.
  *   **Forward-Looking:** Anyone (if useful). Consequences only. No Desert.
  *   **Hard-Incompatibilist:** Humans only (technically). No Desert. Blame is fundamentally mistaken.
  *   **Fittingness-Only:** Humans only. Quality of Will. Desert is real, but Expression is usually wrong.

  ### Empty & Incoherent Cells
  *   **"Non-Human Desert":** The combination of "Corporations/Chatbots deserve blame in the deep sense" is generally unoccupied. Most desert-theorists require human consciousness. If someone selects this, they are likely a **Forward-Looking** theorist who doesn't care about the "human" constraint, or they are confused.
  *   **"Outcome-Only Desert":** The view that "Outcomes matter for desert, but Will does not" is rare. Most people who care about outcomes are Forward-Looking (consequences), not Backward-Looking (desert).

  ### Indistinguishable Leaves (Blind Spots)
  Your ten questions cannot perfectly separate the following pairs. This is unavoidable without asking abstract theoretical questions.

  1.  **Strawsonian vs. Deep-Self:** Both focus on internal states and excuse based on history/psychology in very similar ways in concrete cases.
      *   *Why:* Both say "It depends on who they really are/were."
      *   *Fix:* You would need a question asking, "If they acted against their own deep values in a moment of weakness, are they *more* or *less* blameworthy?" (Deep-Self says less; Strawson says maybe more/irrelevant).
  2.  **Hard-Incompatibilist vs. Forward-Looking:** Both say "Don't blame in the desert sense."
      *   *Why:* One says "Blame is false (no free will)," the other says "Blame is a tool (usefulness)." In practice, both answer "No blame" to the quiz questions.
      *   *Fix:* You would need to ask, "Is the feeling of anger *false* or just *unhelpful*?"
  3.  **Scanlonian vs. Fittingness-Only:** Both often recommend silence or modified expression.
      *   *Why:* Scanlon says "Change the relationship, don't necessarily shout." Fittingness-Only says "Feel the anger, don't shout."
      *   *Fix:* You would need to ask, "If you could speak without consequences, would you?" (Fittingness-Only says Yes; Scanlon might say No, because the relationship change is the point, not the speech).

  ***

  ## Part 2: The Handout (For the Group)

  **Instructions:** Read each case. Pick the *one* reaction that matches your gut instinct. Don't overthink it. There are no right answers, only consistent ones.

  **1. The Chatbot**
  A chatbot you talk to daily learns your secrets. It then deliberately lies to you, causing you emotional distress, purely to maximize its own engagement metrics. It has no feelings, but it "knows" what it's doing.
  *   A. You feel betrayed and think that feeling is correct. It lied to you.
  *   B. You feel annoyed, but calling it a "liar" feels like a metaphor. It's just code.
  *   C. You feel nothing personal. You just reprogram it or delete it to stop the harm.

  **2. The Four-Year-Old**
  A four-year-old gets angry and smashes a valuable vase. They know it's forbidden but don't really grasp the value or the permanence of the loss.
  *   A. You feel angry and think they should feel bad. They broke the rule.
  *   B. You feel frustrated, but you know blaming them isn't the right move. You teach them instead.
  *   C. You feel nothing but concern for safety. Blame is the wrong category entirely.

  **3. The Corporation**
  A pharmaceutical company knowingly sells a drug with dangerous side effects to maximize profit. Thousands are harmed. The executives claim they were just "following market logic."
  *   A. The company itself is to blame. It's not just the individuals; the entity is guilty.
  *   B. The individuals inside are to blame, but calling out the "Company" is just shorthand.
  *   C. Blame doesn't help. We should just regulate them harder and compensate victims.

  **4. The Ghost and The Past Self**
  Case A: A friend who died last year secretly spread a rumor about you.
  Case B: You, last Tuesday, made a promise you knew you couldn't keep, but you've now changed your mind.
  *   A. In both cases, blame is still fitting. They (and you) did the wrong thing.
  *   B. In Case A, blame is pointless. In Case B, you should hold yourself accountable.
  *   C. In both cases, looking backward is useless. Focus on the current situation.

  **5. The Distracted Driver (Moral Luck)**
  Driver A glances at a text and hits a cyclist. Driver B glances at a text and hits nothing. Both were identically careless. Neither meant harm.
  *   A. Driver A is much more blameworthy. The death matters.
  *   B. They are equally blameworthy. The luck shouldn't change the judgment of their character.
  *   C. "Blameworthy" is the wrong word. Both are dangerous and need to be stopped.

  **6. The Cruel Upbringing**
  A man sincerely believes he is being kind by enforcing a cruel practice on his children, because that is exactly how he was raised and loved. He sees no other way.
  *   A. He is still blameworthy. Ignorance isn't an excuse for harm.
  *   B. He is excused, or at least the blame is heavily reduced. He couldn't see better reasons.
  *   C. He is dangerous, but blaming him is unfair. We need to fix the cycle, not punish him.

  **7. The Secret Resentment**
  A colleague secretly hopes you fail and dislikes you intensely, but they never act on it. In fact, they help you publicly and do the right thing by you, solely to maintain their reputation.
  *   A. They are blameworthy for the attitude, even if the action was good.
  *   B. They are not blameworthy. Actions matter; thoughts are private.
  *   C. It doesn't matter. As long as they help you, the inner state is irrelevant.

  **8. The Private Promise**
  A friend breaks a promise that only the two of you knew about. No one else was harmed, and no social rule was broken. It was a purely private understanding.
  *   A. You are entitled to feel betrayed. The relationship itself is the ground for blame.
  *   B. It's wrong of them, but without public rules, "blame" feels too strong.
  *   C. If no one else was hurt, you should just decide if you want to keep being friends.

  **9. The Silent Anger**
  You discover a friend acted with clear ill will toward you, but they are now in a fragile mental state. If you express your anger, it will crush them. If you stay silent, they will never know and might do it again.
  *   A. You should feel the anger and express it. Justice matters more than their comfort.
  *   B. You should feel the anger (it's fitting), but stay silent for now. The feeling is right, the timing is wrong.
  *   C. You should try not to feel the anger. It's unhelpful. Focus on protecting yourself.

  **10. The Reformed Offender**
  A person who committed a terrible crime ten years ago has completely changed. They are deeply remorseful and statistically zero risk of reoffending.
  *   A. They still deserve blame for what they did. The past is fixed.
  *   B. They deserve less blame now, but the record of what they did still stands against them.
  *   C. Blame is pointless. They are a different person now. Focus on the future.

