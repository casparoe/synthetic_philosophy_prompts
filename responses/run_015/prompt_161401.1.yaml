  ## Part 3: Scoring Key (Facilitator's Guide)

  **How to Tally:**
  Have everyone count their **A**, **B**, and **C** answers. Then, look at the *pattern* of specific questions below. The total count gives a general vibe, but the specific questions determine the specific view.

  ### General Vibe Check
  *   **Mostly As:** You are a **Backward-Looking / Desert** theorist. You think blame is about what is earned.
  *   **Mostly Bs:** You are a **Modified / Relational** theorist. You think blame is nuanced, contextual, or internal.
  *   **Mostly Cs:** You are a **Forward-Looking / Skeptic** theorist. You think blame is about safety, utility, or is an illusion.

  ### Specific Position Mapping
  *Ask the group to check which cluster matches their specific answers.*

  **1. The Strawsonian (Quality of Will)**
  *   **Pattern:** As on Q5 (Luck doesn't matter), Q7 (Attitudes matter), Q8 (Relationships matter).
  *   **View:** Blame is about the quality of regard others show us. It is natural, fitting, and often appropriate to express.
  *   **Key Indicator:** Q5=B (Luck irrelevant) + Q7=A (Attitudes count).

  **2. The Scanlonian (Relationship Modification)**
  *   **Pattern:** As on Q7/Q8 (Meaning matters), but Bs on Q9 (Expression modified).
  *   **View:** Blame is about recognizing that a relationship has been impaired. It is fitting, but the *action* of blame is about adjusting the relationship, not necessarily punishing.
  *   **Key Indicator:** Q8=A (Private promise counts) + Q9=B (Feel but don't act).

  **3. The Reasons-Responsiveness (Fair Opportunity)**
  *   **Pattern:** Bs on Q6 (Upbringing excuses), As on Q2 (Kids different).
  *   **View:** You are blameworthy only if you had a fair chance to recognize and respond to reasons. History matters if it blocks that capacity.
  *   **Key Indicator:** Q6=B (Upbringing reduces blame) + Q2=B (Kids lack capacity).

  **4. The Deep-Self (Identification)**
  *   **Pattern:** As on Q6 (Upbringing doesn't fully excuse), Bs on Q7 (Actions matter more than fleeting thoughts).
  *   **View:** You are blameworthy if the action flowed from your deep values. If you were brainwashed (Q6), you might be excused, but if it's just weakness, you are not.
  *   **Key Indicator:** Q6=B (Excused if sincere/blocked) + Q10=A (Past self still counts).

  **5. The Forward-Looking (Consequentialist)**
  *   **Pattern:** Cs almost everywhere.
  *   **View:** Blame is a tool for behavior modification. If it doesn't help, don't use it.
  *   **Key Indicator:** Q3=C (Regulate, don't blame) + Q10=C (Reformed = no blame).

  **6. The Hard-Incompatibilist (Revisionist)**
  *   **Pattern:** Cs on Q6 (History determines all), Q10 (No desert), but As on Q2 (Kids are different from adults).
  *   **View:** Nobody ever truly deserves blame in the deep sense because no one is the ultimate source of their actions. We must revise our practices.
  *   **Key Indicator:** Q6=C (Unfair to blame) + Q10=C (No desert). *Distinguish from Forward-Looking by checking Q1: if they say Chatbots can't be blamed (1=B/C) but Humans can't either (6=C), they are Incompatibilists.*

  **7. The Fittingness-Only (Separation View)**
  *   **Pattern:** As on Q5/Q7 (Blame is deserved), but B on Q9 (Don't express it).
  *   **View:** The anger is *correct* (fitting), but expressing it is often morally wrong or imprudent.
  *   **Key Indicator:** Q5=A or B (Desert exists) + Q9=B (Feel yes, Act no).

  ***

  ## Part 4: Blind Spots & Discussion Starters

  **If your group lands here, you might be talking past each other:**

  *   **The "C" Cluster Confusion:** If half the group chose **C** on Question 10 (Reformed Offender) and half chose **A**, you have a **Forward-Looking vs. Desert** split.
      *   *Ask:* "Is blame a *tax* on the past or a *fee* for the future?"
  *   **The "B" on Question 9 Split:** If everyone agrees blame is *fitting* (Q5/Q7) but disagrees on Q9 (Expression), you have a **Strawson vs. Fittingness-Only** split.
      *   *Ask:* "Is the anger itself the punishment, or is the punishment the thing you *do* with the anger?"
  *   **The "Upbringing" Tie:** If you can't agree on Question 6 (Cruel Upbringing), you have a **Reasons-Responsiveness vs. Deep-Self** split.
      *   *Ask:* "Does being taught to be cruel make you *unable* to see reasons, or just *unlikely* to follow them?"

  **Note on Indistinguishable Views:**
  This quiz cannot definitively separate **Hard-Incompatibilists** from **Forward-Looking Consequentialists**. Both reject desert. To tell them apart, ask: "Is the feeling of blame *false* (Incompatibilist) or just *impolite* (Consequentialist)?"

  This quiz cannot definitively separate **Strawsonians** from **Deep-Self** theorists. Both focus on the agent's psychology. To tell them apart, ask: "If someone acts out of character in a moment of passion, are they *more* blameworthy (Strawson: loss of control) or *less* (Deep-Self: not their true self)?"
