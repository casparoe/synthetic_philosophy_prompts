answer: |-
  Don't let the data-labelers off the hook on species-being; fragmenting cognitive labor into micro-tasks prevents holistic creation just as effectively as an assembly line, severing them from their capacity as conscious producers. Your "predictive alienation" is sharp, but it doesn't break the labor theory of value because data traces alone create no value. They are raw material processed by labor to optimize extraction or reduce circulation time, not value sources in themselves. Where there is no direct wage, you're looking at either unpaid labor subsumed under capital or rentier extraction on value produced elsewhere in the circuit. The "without a wage relation" claim is illusory; even unpaid data generation relies on the reproduction of labor power paid for elsewhere, or it is simply unpaid labor appropriated directly. Marx's framework requires only that surplus derives from labor power exploitation somewhere in the system; this "future-self" monetization is just a sophisticated capture method, not a new mode of production.
