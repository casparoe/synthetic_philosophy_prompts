answer: |-
  ### Preliminary Taxonomy

  The honest answer is that 'convention' is a folk term conflating three distinct mechanisms. Your committee cannot deliberate effectively using a single category because the *levers* differ for each. You should split the taxonomy before applying desiderata:

  1.  **Coordination Conventions:** Practices sustained because agents prefer to match others' behavior, absent intrinsic preference for the act itself (e.g., which side of the road to drive on). Stability relies on common knowledge of regularity.
  2.  **Conditional Social Norms:** Practices sustained because agents prefer to comply *conditional* on believing others comply (empirical expectations) and/or believe others think they ought to comply (normative expectations). Stability relies on the interplay of these expectations (e.g., unpaid reviewing).
  3.  **Institutional Constraints:** Practices sustained by external payoff modifiers or rules not endogenous to the group's expectations (e.g., funder reporting requirements). Stability relies on enforcement or necessity, not mutual expectation.

  The desiderata below apply to a theory capable of distinguishing and manipulating these three types.

  ### Desiderata for a Reform-Oriented Theory

  **1. Lever Specificity**
  The theory must map each diagnostic category to a distinct subset of available instruments (precedent, observability, announcement, cost, population). It must explicitly rule out instruments that are inert for a given category.
  *   **Case/Consideration:** If you treat a funder constraint (Type 3) as a norm (Type 2), you will waste effort on public announcements that cannot move the practice, whereas removing the constraint would dissolve it instantly. Conversely, attacking a coordination convention (Type 1) with moral suasion fails; you must change the focal point.
  *   **Status:** Non-negotiable.
  *   **Confidence:** High.
  *   **Drop Condition:** If a case arises where two distinct categories (e.g., Norm vs. Convention) respond identically to *all* listed instruments, rendering the distinction operationally useless for a reformer.

  **2. Expectation Diagnostics**
  The theory must distinguish between *empirical expectations* (what I think others do) and *normative expectations* (what I think others approve of), and allow for their divergence.
  *   **Case/Consideration:** This is required to sort your test case of pluralistic ignorance (everyone complies, falsely believing others endorse it). A theory that collapses these expectations cannot explain why a public announcement of private dissent might trigger collapse in one case but not another.
  *   **Status:** Non-negotiable.
  *   **Confidence:** High.
  *   **Drop Condition:** If evidence shows that behavior is driven primarily by habit or cognitive scripts independent of *any* expectations about others.

  **3. Constraint Separability**
  The theory must provide a procedure to distinguish endogenous stability (held up by the group) from exogenous stability (held up by external constraints) without requiring historical data.
  *   **Case/Consideration:** Required to sort your test case of the funder requirement. If the theory cannot distinguish an external payoff modifier from an internalized norm, you risk repealing a rule that was actually serving a coordination function, causing unintended chaos.
  *   **Status:** Non-negotiable.
  *   **Confidence:** Medium-High.
  *   **Drop Condition:** If it turns out that "external constraints" are always internalized as norms eventually, making the distinction purely semantic rather than mechanistic.

  **4. Turnover Robustness**
  The theory must explain how a practice survives near-total population turnover without explicit teaching or codification.
  *   **Case/Consideration:** Required to sort your test case of the unstated practice that survives member replacement. If the theory relies on common knowledge held by specific individuals, it cannot explain institutional memory. It needs a mechanism for transmission (e.g., observing seniors).
  *   **Status:** Prejudice of the rationalist/expectations camp.
  *   **Confidence:** Medium.
  *   **Drop Condition:** If the practice is shown to be embedded in physical infrastructure or software (e.g., a submission portal that forces a specific citation style) rather than social transmission.

  **5. Collapse Dynamics (Tipping Points)**
  The theory must account for rapid endogenous collapse without changes in sanctions, population, or private convictions.
  *   **Case/Consideration:** Required to sort your test case of the practice that collapses within a year. Equilibrium theories often predict stickiness; a reform theory must explain how small changes in *public* information can shift the equilibrium threshold.
  *   **Status:** Non-negotiable.
  *   **Confidence:** High.
  *   **Drop Condition:** If all observed collapses are traceable to unobserved external shocks, suggesting true endogenous tipping is rarer than it appears.

  ### Tensions and Trade-offs

  **The Stability vs. Change Tension**
  You are correct to suspect a tension between explaining stability and explaining endogenous change.
  *   **The Conflict:** Desideratum 5 (Collapse Dynamics) and Desideratum 1 (Lever Specificity) pull against a strict equilibrium conception. Equilibrium concepts (Lewis) excel at explaining why inefficient practices persist (Test Case 4) but treat movement between equilibria as exogenous. Dynamic accounts (Skyrms) explain movement but often lack the granularity to tell a committee *which* lever to pull *now*.
  *   **Resolution:** Given your purpose (reform from the inside), **Desideratum 5 (Collapse Dynamics) should take precedence over strict Equilibrium Stability.** You need a theory that models thresholds and cascades, even if it sacrifices some precision on why the old equilibrium held for decades. You lose the ability to guarantee that a new practice will be *stable* once established, but you gain the ability to predict how to *establish* it. A theory that explains stability but not change is a museum guide; you need an architect.

  ### The Exclusionary Requirement

  **Lever Specificity (Desideratum 1)** is the single requirement that excludes the most candidates.
  *   **Why:** Most philosophical and sociological theories are descriptive. They classify practices to understand society, not to provide a menu of interventions for a committee. Pure game-theoretic accounts often identify the equilibrium but offer no comparative statics for human agents lacking the power to change payoff matrices directly. Purely descriptive sociological accounts often reject the idea of "levers" entirely, viewing practices as emergent cultural wholes.
  *   **Status:** This is a **genuine requirement** derived from your stated purpose ("a theory a reformer can use... to answer... which of the instruments... has any chance"). It is not a preference; it is a functional constraint.

  ### Modeling Bias Warning

  I suspect this list is shaped by **Rationalist/Expectation Bias**.
  *   **Where it is wrong:** The list assumes practices are sustained by *beliefs* and *preferences* that can be shifted by information (announcements) or incentives (costs). It underweights **Habit and Cognitive Load**.
  *   **The Risk:** Some practices (e.g., panel order) may persist not because of expectations or norms, but because they are the default setting in a cognitive script or administrative template. Changing the expectation may do nothing if the behavior is automatic. If your committee finds that announcements fail despite shifted expectations, you must look for non-agentic causes (software defaults, room layouts, inherited templates) which this theory might misclassify as "constraints."

  ### Evaluation of Existing Accounts

  **Lewisian Coordination Account**
  This account scores well on distinguishing Coordination Conventions from other regularities and explains the stability of inefficient practices (Test Case 4) via equilibrium selection. However, it fails Desideratum 2 (Expectation Diagnostics) because it does not distinguish between empirical and normative expectations, making it unable to model pluralistic ignorance (Test Case 1). It also fails Desideratum 5 (Collapse Dynamics); in a Lewisian framework, conventions are sticky, and endogenous collapse without a change in payoffs or population is difficult to explain. It treats change as largely exogenous, offering little guidance on how a committee can engineer a shift from the inside.

  **Evolutionary and Dynamic Accounts (Skyrms-style)**
  These accounts excel at Desideratum 4 (Turnover Robustness) and Desideratum 5 (Collapse Dynamics) by modeling how strategies propagate and tip over time. They explain how a practice can survive turnover and how small perturbations can lead to large shifts. However, they struggle with Desideratum 1 (Lever Specificity) for a short-term reformer. The timescales of evolutionary dynamics are often too long or abstract to map onto a committee's annual cycle. They explain *that* a shift is possible, but often lack the granularity to tell you whether an *announcement* or a *cost* is the correct intervention for a specific local cluster.

  **Normative-Expectations Accounts (Bicchieri-style)**
  This account performs best against the full list. It satisfies Desideratum 2 by distinguishing empirical from normative expectations, directly addressing pluralistic ignorance (Test Case 1). It handles Desideratum 5 well through the concept of threshold models, explaining rapid collapse. It also aids Desideratum 3 (Constraint Separability) by focusing on conditional preferences rather than external rules. Its primary weakness lies in Desideratum 4 (Turnover Robustness); while it explains transmission via expectations, it can underplay the role of non-cognitive institutional inertia. However, for a reformer needing to identify levers like "public announcement" (which shifts empirical expectations), this provides the most actionable diagnostic framework.
