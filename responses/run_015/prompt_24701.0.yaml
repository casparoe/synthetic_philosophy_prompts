      2.  *Kantian Duty:* Kantians might argue beneficence is a duty, even if wide. Does calling it supererogatory undermine duty?
      3.  *The "Saintliness" Trap:* Does labeling it supererogatory make morality too demanding for normal people, thereby excusing them?
