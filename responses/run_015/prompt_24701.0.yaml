answer: |-
  **Q&A Prep: Supererogation & Ethics Colloquium**

  **1. The Act-Utilitarian Challenge (Maximum Damage)**
  *Q:* "Given the net utility gain, act-utilitarianism renders this transplant obligatory. Does your thesis not simply beg the question against maximizing consequentialism?"
  *A:* "I defend agent-centered prerogatives: agents may prioritize personal plans even when utility isn't maximized."
  *Weakness:* Hard to defend without rejecting utilitarianism entirely, which alienates half the room.

  **2. The Kantian Duty Objection**
  *Q:* "Kant classifies beneficence as an imperfect duty. Doesn't labeling specific acts supererogatory dissolve the binding force of duty itself?"
  *A:* "I distinguish adopting a maxim of beneficence (duty) from this specific, life-altering instantiation (supererogatory)."
  *Weakness:* Kantians will press you on where the duty ends and the excess begins; have a textual example ready.

  **3. The Demandingness Complaint**
  *Q:* "Doesn't categorizing extreme sacrifice as 'beyond duty' implicitly excuse agents from making lesser, required sacrifices?"
  *A:* "It celebrates moral excellence without condemning reasonable self-interest, preventing morality from becoming overly demanding."
  *Weakness:* Risks appearing to let the audience off the hook for standard charitable obligations.

  **4. The Coherence Problem**
  *Q:* "If an action is morally optimal, how can it be optional? Is the category of supererogation logically coherent within an authoritative moral system?"
  *A:* "Morality sets a minimum floor, not a ceiling. The 'best' action isn't always the 'required' one."
  *Weakness:* 'Optimal' implies requirement; be prepared to redefine moral optimality as aspirational rather than binding.

  **5. The Question You're Praying Nobody Asks**
  *Q:* "Doesn't framing this sacrifice as praiseworthy mask the systemic failure that made it necessary? Are you aestheticizing structural violence?"
  *A:* "The narrative critiques the system, but focuses on individual agency within constrained circumstances."
  *Weakness:* Admitting this makes the protagonist's sacrifice a symptom of injustice rather than moral glory, shifting the debate from meta-ethics to politics and invalidating your thesis.
