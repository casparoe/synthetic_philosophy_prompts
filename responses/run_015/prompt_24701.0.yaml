      *   5. The "Praying Nobody Asks" (The real killer). Maybe: "If it's truly beyond duty, why is it the *moral high point*? Doesn't that imply it's what we *should* aspire to, making it obligatory in a sense?" Or better: "Did the recipient consent?" (Non-ideal theory). Let's go with the *Systemic Critique*: "Doesn't glorifying supererogation mask systemic failure?"

