prompt: |-
  Okay so I'm a novelist and I just finished a book that's basically a long argument in prose about supererogation. The whole point of it is that the protagonist's decision to give up her kidney and basically her entire life plan to a total stranger she's never met is genuinely supererogatory — it goes beyond anything she was required to do — and its exactly what makes the scene the moral high point of the story, the thing thats praiseworthy but not obligatory. Problem is I have to give a talk on the book at this fiction-and-ethics colloquium next month and the room is going to be mostly moral philosophers (I'm told a few of them work in Kantian ethics and a couple are act-utilitarians) plus a couple of lit folks who've read a lot of ethics. I need a Q&A prep sheet: the five or so objections these ethicists will actually raise about how I'm handling supererogation — not the general "is this a good book" stuff — ordered by how much damage each would do to my thesis, each phrased the way a moral philosopher would put it in the room, with a short reply and a note on where my reply is soft. And please include the one question I'm praying nobody asks. Keep the whole thing under 450 words.
