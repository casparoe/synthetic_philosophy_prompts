  *(Self-Correction on Claim 2):* Does it say more than "mechanisms explicit"? Yes, it imposes a *constraint* on the mechanism. It must be subjectively plausible to the actor, not just statistically significant.

  *(Self-Correction on Claim 3):* Does it say more than "estimands chosen to serve interests"? Yes, it suggests the *identity* of the historical object is tied to those interests. "Capitalism" isn't a natural kind waiting to be found; it's a category formed by our interest in rationalization.

