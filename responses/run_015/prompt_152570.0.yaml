answer: |-
  hey, this is a cool workshop idea. sci-fi readers love ethics puzzles but they'll bolt if it feels like a lecture. here's the plan to keep the logic tight without losing them.

  **the flow (lock this order)**

  1.  **open with the uncertainty.** start by saying "we don't know if insects feel pain." don't hedge.
  2.  **defuse misconception #1 immediately.** ("if we cant know then its moot"). tell them: in worldbuilding, acting on uncertainty is the whole point. if we waited for 100% proof, we'd never make decisions. frame it as risk management, not truth.
  3.  **introduce visibility bias.** now explain *why* we think the probability is low. it's not data, it's because bugs don't scream or have faces. this sets up the probability number without them arguing the biology yet.
  4.  **defuse misconception #2.** ("low probability means basically zero"). this is the critical pivot. use a lottery analogy or something simple. 1% chance of disaster is still a disaster if it happens a million times. get them to agree that small % × big number ≠ zero before you move on.
  5.  **hit the scale argument.** now multiply. show the math conceptually (no formulas yet).
  6.  **run the example (silk vs. wheat).** (see details below).
  7.  **defuse misconception #3.** ("killing one cow is still worse"). acknowledge it. yes, prob for cow is higher. but ask if the bug total *ever* catches up. this validates their intuition without killing the argument.
  8.  **check-in question.** (see below).
  9.  **state refusals.** set boundaries so you don't get bogged down.

  **the silk vs. wheat example**

  *   **what it needs:**
      *   **silk:** use this for *certainty of death*. we boil the pupae. we know they die. the number is high (thousands) but human-scale.
      *   **wheat/pesticide:** use this for *scale*. the number is astronomical (millions/billions of insects per acre). the certainty of sentience is lower, but the N is so big it swamps the silk numbers.
      *   **keep them separate:** don't let them say "both are bad so it's the same." force them to see silk is about *intent/certainty* and wheat is about *collateral scale*. you want them to see that wheat wins on the scale argument even if the individual chance of feeling is lower.
  *   **what to avoid:**
      *   don't get into organic vs. conventional farming debates. that's a rabbit hole.
      *   don't let them merge the two into "all farming is murder." keep the variable distinct: one is high certainty/low scale, one is low certainty/mega scale.

  **where to kill the misconceptions**

  1.  **"if we cant know then its moot"**: kill this at step 2. if you wait, they'll tune out during the probability stuff. tell them: "fiction is about what if, not what is."
  2.  **"low prob = zero"**: kill this at step 4. right before you show the big numbers. if they think 1% is zero, the scale argument fails.
  3.  **"cow is worse"**: kill this at step 7. let them feel this tension. it's the natural resistance. validate it ("yes, cows probably suffer more individually") but pivot back to the aggregate ("but does 1 cow outweigh 100 million bugs?").

  **visibility bias placement**

  put this at step 3. it belongs *between* the uncertainty and the probability estimation.
  *   **why:** it explains *why* they feel the probability is low. it stops them from arguing biology ("but bugs have ganglia!") and makes it about human perception ("we ignore them because they look alien").
  *   **risk:** if you put it too late, it feels like an excuse. if you put it too early, it feels like psychology class. it needs to bridge "we don't know" to "so we guess low."

  **the check-in question**

  don't ask "do you agree?" ask this:

  *"if we drop the chance of sentience from 10% to 1%, how much bigger does the population need to be to keep the ethical weight the same?"*

  *   **why:** if they say "it doesn't matter" they missed the scale point. if they say "10 times bigger" they get the dependency. you want to see if they understand the *trade-off*, not just the conclusion.

  **what to openly refuse to explain**

  be blunt about this at the start or when someone pushes. say something like:

  *"look, i'm not teaching formal expected-value calculus today. we're doing rough intuition, not math homework. also i'm not solving the hard problem of consciousness (phenomenal vs access). we're treating 'sentience' as a black box for the sake of the story."*

  *   **why:** if you let them drag you into defining qualia or deriving equations, you'll lose the room. keep it on the narrative ethics.

  keep it moving. if someone gets stuck on the cow thing, park it and come back at the end. good luck tuesday.
