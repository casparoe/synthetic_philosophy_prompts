      *   **Film:** *Memento* (2000).
      *   **Core Task:** Provide a reading that takes both film and philosophy seriously, avoiding treating the film as mere illustration. Test the instructor's specific hunches.
      *   **Key Distinction:** "Interface Claim" (simplified rendering) vs. "User Claim" (no unified subject).
      *   **Instructor's Hunch:** Leonard's external prostheses (tattoos, notes) *manufacture* the next self, suggesting a "third option": a user that is real but manufactured/externally maintained.
      *   **Questions to Address:**
          1.  Is this "manufactured user" position coherent, or does it collapse into realism or illusionism?
          2.  Does it help or hinder the illusionist case?
          3.  Leonard's processing without integration: Subject with no user, or user compressed to minutes? Does this distinction matter for the debate?
          4.  Where does the reading *fail*? (Specifically Sammy Jankis ambiguity and the Ending).
          5.  Reverse-ordered sequences: Philosophical work or rhetorical?
          6.  Scene recommendations for a handout.
          7.  What "lived stakes" does the film reveal that prose doesn't?

  2.  **Deconstruct the Instructor's Hunch (The "Manufactured User"):**
      *   *Idea:* Leonard's system (brain + props) creates a "user" moment-to-moment.
      *   *Illusionist View:* The "user" is a fiction/posit (Center of Narrative Gravity).
      *   *Realist View:* The "user" is a substantial entity (Cartesian Theater or robust phenomenal self).
      *   *Instructor's "Third Option":* The user is *real* but *manufactured*.
      *   *Critique:* This sounds suspiciously like Dennett's "Center of Narrative Gravity." Dennett argues the self is an abstraction, like a center of gravity. It's "real" as an abstraction but not a "thing" inside the head. If the instructor means "real" as in "ontologically robust substance," it collapses into Realism. If they mean "functionally indispensable construct," it *is* Illusionism (specifically Dennett's brand).
      *   *Nuance:* The *external* nature of the props is key. Dennett's narrative is mostly internal (language loops). Leonard's is literally on his skin. This extends the "vehicle" of consciousness into the world (Extended Mind thesis + Illusionism).
      *   *Verdict:* It doesn't escape Illusionism; it radicalizes it. It shows the "user" is a distributed process, not a homunculus. It helps the illusionist by showing *how* the trick is done materially.

  3.  **Leonard's Processing (Integration vs. Compression):**
      *   Leonard has intact procedural memory and short-term processing but no episodic consolidation.
      *   *Illusionist take:* Consciousness *is* the narrative integration. Without it, there is no "user," just a zombie system. Leonard is a collection of sub-routines.
      *   *Realist take:* He still feels pain, anger, confusion. There is *something it is like* to be Leonard in the moment. The "user" exists in the specious present.
      *   *Does it matter?* Yes. If Leonard has phenomenal experience without narrative continuity, it challenges the strong Illusionist claim that the *narrative* creates the experience. It suggests the "interface" exists even if the "user history" doesn't. This supports the "Interface Claim" over the strong "User Claim."

  4.  **The Failure Points (Sammy Jankis & The Ending):**
      *   *Sammy Jankis:* Is he malingering? Leonard says conditioning proves no memory. But Leonard projects his own condition onto Sammy.
      *   *Philosophical Issue:* If Sammy is faking, it suggests behavior can mimic consciousness without the "deep fact." This supports Illusionism (behavioral functionalism). If Sammy is real but failed conditioning, it suggests a limit to the "system."
      *   *Instructor's Worry:* Is it about self-trust? Yes. Illusionism says self-trust *is* the self. If that breaks, the self breaks.
      *   *The Ending:* Leonard chooses to ignore truth (burns photo, writes false clue).
      *   *Moral Agency:* If Leonard is an illusion, who is responsible? The film *demands* we hold him responsible. This is the tension. Illusionism struggles with moral responsibility (Dennett tries to reconcile this, but it's hard). The film suggests that *choosing the illusion* is the moral act. This leans Realist (a real agent chooses the lie) OR a very pragmatic Illusionism (the utility of the fiction is what matters).
      *   *Verdict:* The ending threatens Illusionism because it posits a "decider" behind the narrative manipulation. If the narrative creates the decider, how can the decider manipulate the narrative *knowingly*? (Self-deception paradox).

  5.  **Reverse Chronology:**
      *   It's not just rhetorical. It forces the viewer into the "Interface Claim." We experience the confusion, the lack of context, the reliance on immediate cues. We become the "compressed user." It phenomenologically simulates the loss of the "Center of Narrative Gravity."

  6.  **Scene Selection:**
      *   Need scenes that show: 1. The prosthetic construction of self. 2. The gap between processing and memory. 3. The manipulation of the narrative. 4. The moral choice.
      *   *Selection:*
          1.  The Tattoo Scene (Physicalizing the memory).
          2.  The Sammy Jankis Insulin Story (The theory of mind/conditioning).
          3.  The "I Have to Believe in a World Outside My Own" Monologue (The justification of the illusion).
          4.  The Final Sequence (Burning the photo/Writing the license plate).

  7.  **Lived Stakes:**
      *   Prose discusses "qualia" and "functionalism." Film shows *grief* and *guilt*. The "illusion" isn't just cognitive; it's emotional survival. The cost of the illusion is moral corruption.

  8.  **Drafting the Response:**
      *   *Tone:* Academic, respectful, rigorous, engaging with the specific philosophical nuances (Dennett, Frankish, Nørretranders).
      *   *Structure:*
