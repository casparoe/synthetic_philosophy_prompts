      *   *Discreteness:* Notes are discrete units; Letter parts (terminals, curves) are continuous and interdependent.
      *   *Tolerance:* Melodies survive huge timbral/tempo changes; Letters break identity with small geometric shifts (e.g., closing the aperture of 'a' makes it 'o' or 'e').
      *   *The "Score" Problem:* In music, the score exists independently (often). In typography, there is no "Platonic 'a'" score independent of existing fonts. We infer the skeleton *from* the performances.
      *   *Style vs. Structure:* In music, style often overlays structure. In type, style *is* the structure (proportions change with weight).
      *   *Systemic Identity:* A note is defined by frequency. A letter is defined by contrast within a set (an 'a' is an 'a' because it isn't an 'o' or a 'd').

