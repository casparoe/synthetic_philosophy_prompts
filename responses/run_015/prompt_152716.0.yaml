answer: |-
  Friedrich Nietzsche sat in the minimalist office of Dr. Elena Vogel, a pioneer in what she termed "Ontological Microbiomics." She did not treat him as a patient, but as a case study in physiological determinism. She had read *Ecce Homo* not as autobiography, but as a clinical trial protocol.

  "Herr Professor," Vogel said, sliding a petri dish across the desk. "Your microbiome is exhibiting classic signs of German *Ressentiment*. These bacteria are hoarding nutrients. They ferment when they should assimilate. It is a slave morality of the gut."

  Nietzsche nodded grimly. "I suspected as much. The heavy dumplings of my youth… they weigh upon the spirit. They dull the German intellect."

  "Precisely," Vogel replied. "We must instigate a dietary self-overcoming. No alcohol. No coffee. Only the light oils of Turin and pure water. We need your gut to express the Will to Power, not the Will to Digestion. If the stomach is affirmative, the metaphysics will be affirmative."

  Nietzsche adhered to the regimen with ascetic rigor for six months. He abandoned German heaviness for Italian lightness. His migraines vanished. His complexion cleared. He felt the lightness of the dancer. He returned to Vogel, triumphant, clutching a manuscript.

  "It is done," Nietzsche announced. "I have dictated the *Revaluation of All Values*. My stomach is entirely affirmative. The thoughts flowed like olive oil."

  Dr. Vogel did not reach for the manuscript. Instead, she handed him a sterile specimen cup.

  "Friedrich," she said gently. "You misunderstand the physiology. If the stomach's condition directly determines the quality of one's thinking, then the thinking happens *in the gut*. The writing is merely the excretion of what has already been resolved metabolically."

  She tapped the cup.

  "Fill this. If the sample shows perfect assimilation, I will type it up for you—the logic is guaranteed by the peristalsis. But if I see any undigested German cabbage…" She paused, smiling clinically. "...we know the argument is flawed, and there is no point in reading it."

  Nietzsche stared at the cup, then at his manuscript. He realized the collision was complete: he had sought to master his body to write philosophy, but in doing so, he had proven that the philosophy was nothing but the body mastering itself.

  "But the style?" Nietzsche asked weakly.

  "Style is motility," Vogel said, uncapping a pen. "Now, please. The lab closes at five."
