answer: |-
  There is no single, universally accepted noun for this specific configuration. In literary theory, it is often discussed under the umbrella of **Ethical Criticism** or **Reception Theory**, but those fields tend to argue about *whether* you should read, not map the *shape* of the refusal you are describing. In pop culture, it is often lumped into "Cancel Culture" or "The Wagner Problem," but those are too blunt for the nuance you've isolated.

  However, the mechanism you are describing is distinct enough that we can name it by synthesizing the theoretical components. The most precise label for the phenomenon is **The Testimonial Breach**.

  Here is the breakdown of what that is, why your four features matter, and where the boundaries lie.

  ### 1. The Core Mechanism: The Testimonial Breach

  To understand why the damage is local but the withdrawal is global, you have to look at how readers process voice. When we read a novel, we are not just decoding text; we are entering a **trust contract** with the **Implied Author**. (This is a term coined by Wayne Booth to distinguish the "author" we infer from the text from the real human being).

  Usually, readers successfully separate the Real Author from the Implied Author. But when the Real Author commits a moral atrocity, a **Testimonial Breach** occurs. The reader stops hearing the *Narrator* or the *Implied Author* and starts hearing the *Real Author*.

  This explains your first point (Local Flaw, Global Withdrawal). The flaw *is* local (one passage feels like a sales pitch), but the vessel is global (the Voice). If you discover the person speaking to you is lying about their identity, you don't just discount the lie; you stop listening to the sentence that follows, even if it's a weather report. The "global withdrawal" is not a judgment on the book's quality; it is a safety response to a broken channel of communication.

  ### 2. Analysis of Your Four Features

  Using **The Testimonial Breach** as the definition, we can determine which of your features are essential (structural) and which are accidental (modulating).

  **A. Local Flaw, Global Withdrawal (Essential)**
  This is the engine of the phenomenon. If the reader merely enjoyed the book less, it would be a change in *taste*. Because they stop entirely, it is a change in *status*. The book has shifted from "Art" to "Evidence." You cannot "read" evidence for pleasure; you can only scrutinize it. This feature is essential. Without this disproportionate reaction, you just have disappointment, not a Breach.

  **B. The One-Directional Leak (Essential)**
  This is **Moral Asymmetry**. In aesthetics, goodness is fragile; badness is sticky. A beautiful book cannot prove a soul is good (because sociopaths can write beautifully), but a cruel act can prove a soul is cruel (because cruelty requires action). Therefore, the "badness" of the author overwrites the "goodness" of the text, but the "goodness" of the text cannot overwrite the "badness" of the author. This asymmetry is essential to the Breach. If art could redeem the artist, the breach would heal itself.

  **C. Thematic Proximity (Essential to the *Intensity*, Accidental to the *Existence*)**
  You noted that a book about coercion by a coercive writer collapses, while a book about fishing does not. This is **Relevance-Weighted Contagion**.
  *   **Is it essential?** Yes, because it dictates the *mode* of the breach. In the fishing book, the Breach might be a low-level hum (guilt over royalties). In the coercion book, the Breach is a scream (the text is now a reenactment of the crime).
  *   **Why?** Because the closer the subject matter, the harder it is to maintain the separation between Implied Author and Real Author. The text becomes a **confession** rather than a **creation**.

  **D. Temporal Decay (Accidental/Modulating)**
  The "Dead for 100 Years" factor is **Historical Amnesties**. This is not essential to the Breach itself, but to the *cultural context* in which the Breach happens. We forgive the dead because they can no longer profit, and because their moral framework is viewed as archaeological rather than contemporary. If this feature were essential, we wouldn't see readers struggle with authors who died 20 years ago. The fact that the Breach *fades* suggests it is a social enforcement mechanism, not a textual one.

  ### 3. Boundary Cases: What It Is Not

  To sharpen the definition of **The Testimonial Breach**, we must distinguish it from its neighbors.

  **It is not a Boycott.**
  *   *Boycott:* A political or economic choice. "I will not buy this to hurt the author's wallet."
  *   *Breach:* A psychological impossibility. "I *cannot* buy this because the text no longer functions as art for me."
  *   *Boundary:* A boycotter can admit the book is good. A reader experiencing a Breach feels the book has fundamentally changed state.

  **It is not the Biographical Fallacy.**
  *   *Biographical Fallacy:* Using the author's life to *explain* the text (e.g., "He wrote about the sea because he was a sailor").
  *   *Breach:* Using the author's life to *invalidate* the text.
  *   *Boundary:* In the Fallacy, the life adds meaning. In the Breach, the life subtracts access.

  **It is not "Death of the Author."**
  *   *Death of the Author:* A theoretical stance that the author's intent is irrelevant to meaning.
  *   *Breach:* The **Resurrection of the Author**. The author's intent (and character) has become the *only* thing that matters. The reader is saying, "I cannot interpret this text without knowing who sent it."
  *   *Boundary:* Death of the Author liberates the text. The Testimonial Breach imprisons it.

  **It is not Loss of Trust in a Speaker.**
  *   *Speaker:* A journalist or politician. If they lie, their facts are void.
  *   *Novelist:* A fiction writer. They are *expected* to lie (invent).
  *   *Boundary:* The Breach happens when the reader decides the novelist is no longer lying *artistically*, but lying *morally*. They aren't saying "This plot is fake"; they are saying "This emotion is fraudulent."

  ### 4. The Shape of the Thing

  You asked for the shape. The shape is a **Funnel**.

  1.  **Wide Top:** The entire bibliography is available.
  2.  **The Narrowing:** The revelation of the act.
  3.  **The Filter (Thematic Proximity):** Books far from the crime pass through (fishing). Books close to the crime catch.
  4.  **The Blockage (The Breach):** For the caught books, the "Voice" clogs. The reader cannot proceed past the point where the Voice feels contaminated.
  5.  **The One-Way Valve:** Nothing flows back up. The book cannot cleanse the author.
  6.  **The Erosion (Time):** Over decades, the clog dissolves (Historical Amnesty).

  ### 5. Why Your Reader Wrote That Email

  Your reader said the last chapter "hits different" but was still her favorite. She was experiencing the **early stage of the Breach**. She hasn't reached the "Global Withdrawal" yet because the thematic proximity wasn't high enough, or her personal attachment is strong enough to act as a dam. But she identified the **Voice-Poisoning**: the narrator sounds like they are lying.

  She was telling you that the **Implied Author** had collapsed into the **Real Author**. She is no longer reading your book; she is reading *you*, and she found something in *you* that scares her.

  ### Summary Definition

  **The Testimonial Breach**
  *A phenomenon in aesthetic reception where knowledge of an author's moral failing causes the reader to conflate the Implied Author with the Real Author. This results in a disproportionate withdrawal from the text (Global Withdrawal) triggered by a specific loss of trust in the narrative voice (Local Flaw). The effect is asymmetrical (art cannot redeem the artist), modulated by thematic proximity (Relevance-Weighted Contagion), and subject to historical decay.*

  It is not that the book is "dirty." It is that the book has become a **witness** instead of a **world**, and the witness is compromised. You cannot dwell in a world that is testifying against itself.
