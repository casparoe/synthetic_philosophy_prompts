answer: |-
  Here are nine interview questions designed to navigate around your guest's standard defenses, along with her likely responses and the necessary follow-ups to press the point.

  ### 1. The Argument Behind the Heuristic
  **Question:** You've argued that the famous "parity principle"—the idea that if a tool acts like memory, it *is* memory—was never really an argument, just a hint for where to look. If that hint isn't the proof, what is? Specifically, how do we define "functional equivalence" between a notebook and a brain without making the definition so broad that a thermometer, which reliably tells me the temperature, counts as part of my sensory system?

  **Likely Answer:** She will likely say that the thermometer fails the other criteria: it isn't automatically endorsed or integrated into her reasoning processes in the same way. She'll argue that functional equivalence isn't just about input and output, but about how the resource is *used* in the flow of cognition.

  **Follow-up:** But who decides what counts as "the flow of cognition"? If we define the equivalence by how much the tool *feels* like memory to the user, haven't we just moved the goalposts from the physical world to the user's psychology?

  ### 2. Coupling vs. Constitution
  **Question:** Critics often say you are confusing "coupling" with "constitution." In plain English, they say just because a tool is tightly connected to a thinker doesn't mean it's *part* of the thinker, any more than a guitar is part of a guitarist's hands. You've suggested this is a metaphysical distraction, but if you want this to be an empirical claim, what does a non-question-begging account of that difference look like in practice?

  **Likely Answer:** She will likely respond that the difference is a matter of degree, not kind. She'll argue that at a certain level of integration, the distinction between "holding a tool" and "using a limb" dissolves, and that neuroscience can show us where that dissolution happens.

  **Follow-up:** If the distinction dissolves, does the concept of the individual mind dissolve with it? If I can't draw a line between where my brain ends and the tool begins, can I still be held responsible for thoughts generated in that blurry zone?

  ### 3. Cognitive Overflow
  **Question:** You argue that the boundaries of the mind come in degrees rather than sharp lines. But doesn't this risk making the concept of "mind" so stretchy that it covers everything? If I can offload memory to a notebook, why not to a supercomputer, or a library, or the internet? At what point does the system get so large that saying "it's all mind" stops telling us anything useful?

  **Likely Answer:** She will likely say that science deals with fuzzy boundaries all the time—like the boundary between a mountain and a hill—and that doesn't stop geology from being useful. She'll argue we should accept that cognition is a spectrum.

  **Follow-up:** Geology doesn't need to assign rights or responsibilities to mountains. If we are talking about *minds*, doesn't that fuzziness create a problem for things like privacy or consent, where we usually need a clear yes or no?

  ### 4. Trust and Automatic Endorsement
  **Question:** Your criteria rely heavily on "trust" and "automatic endorsement." But trust is subjective. If I carry a notebook I constantly double-check, it's not part of my mind. But if I carry a horoscope I trust completely, even though it's nonsense, does your view imply that the horoscope *is* part of my mind, simply because I treat it that way?

  **Likely Answer:** She will likely clarify that the trust must be *appropriate* to a reliable system. She'll argue that a horoscope fails the reliability condition, so it doesn't matter how much I trust it; it won't count as cognitive extension.

  **Follow-up:** But if the reliability has to be judged from the outside, aren't you abandoning the user's perspective? And if the user is the one doing the endorsing, how can an outside observer ever say they are wrong about what constitutes their own mind?

  ### 5. Overlapping Minds
  **Question:** Imagine two researchers who have shared a single lab notebook for twenty years. They both add to it, both retrieve from it, and sometimes neither can remember who wrote a specific entry. If that notebook is part of a cognitive system, whose system is it? Are we committed to the idea that their minds literally overlap in that book, rather than there being two distinct minds?

  **Likely Answer:** She will likely embrace this, suggesting that cognitive systems can indeed overlap. She'll argue that the "one mind per person" assumption is a folk intuition that science might overturn, much like we overturned the idea that the sun orbits the earth.

  **Follow-up:** If minds can overlap, does that mean intellectual property is more complicated than we thought? If a thought emerges from that shared notebook, can one researcher claim it as solely theirs, or does the "shared mind" own it?

  ### 6. The Cloud and External Control
  **Question:** Let's bring this to the present. Many of us use cloud assistants we trust completely, but we can't inspect their code, and the provider can update them overnight. If that assistant is part of your mind, what does your view say about a provider silently changing what that system will "tell" you tomorrow? Does that mean a third party has the ability to rewrite your beliefs while you sleep?

  **Likely Answer:** She will likely concede that this is a risk but argue it's no different than brainwashing or propaganda. She'll say the empirical fact is that the cognition is distributed, and the ethical question is how we regulate that distribution.

  **Follow-up:** But if the cognition is distributed, isn't the violation more direct? If they change the server, aren't they literally editing your memory, rather than just lying to you? Shouldn't that change how we legislate data privacy?

  ### 7. Consciousness and Experience
  **Question:** Your thesis focuses on memory and processing. But does this extension apply to consciousness itself? If a notebook stores my memories, does it also store my *experience* of those memories? If you say no, can you really keep the two separate, or does the logic that extends the mind eventually have to extend the feeling of being a mind?

  **Likely Answer:** She will likely draw a line here, arguing that extended mind is about functional processing, not subjective experience (qualia). She'll say we can have extended cognition without extended consciousness.

  **Follow-up:** But if the machinery of thought is outside the head, why does the "light" of consciousness stay inside? If you separate them, aren't you admitting that the most important part of the mind—the part that actually *feels*—remains strictly biological?

  ### 8. Empirical Settlement
  **Question:** You often say the live question is empirical: we need to see how cognition is distributed. But for an experiment to settle this, there must be an observable difference between a resource being *part* of a memory system versus just being *coupled* to one. What exactly are we looking for in the data, and who is in a position to detect it—a neuroscientist, or the person using the tool?

  **Likely Answer:** She will likely suggest we look for neural signatures that treat external retrieval the same as internal recall. She'll argue that if the brain lights up the same way, the distinction is irrelevant.

  **Follow-up:** If the brain treats them the same, does that prove the tool *is* memory, or just that the brain is incredibly adaptable and can treat external tools *as if* they were memory? Is "treating as" the same as "being"?

  ### 9. Real-World Consequences
  **Question:** Finally, does this view change anything outside the seminar room? If my smartphone is part of my cognitive system, is confiscating it more like stealing a wallet or like inflicting a temporary brain injury? Should the law treat an hour without my device as a period of cognitive impairment?

  **Likely Answer:** She will likely say it *should* change how we think about harm, perhaps arguing that destroying someone's external tools is a form of cognitive sabotage. She'll suggest we need new ethical frameworks for the digital age.

  **Follow-up:** If we accept that, does it mean that people who can't afford these cognitive extensions are literally less cognitively capable than the wealthy? Does your theory inadvertently suggest that intelligence is now something you can buy, not just something you are born with?
