answer: |-
  You present to me a marvel of human ingenuity, a mechanism designed to spare us the tyranny of the magistrate's whim. I do not doubt that such a machine would function with a precision no human judge could match. I concede freely that our courts are often but theaters of vanity, where the judge sleeps while the advocate pleads, and where the robe covers only the weakness and corruption of the man beneath. I grant you that custom varies wildly—that what is virtue in Paris is vice in London—and that the powerful routinely dress their lusts in the garments of law.

  But you ask me if this invention escapes the misery of our condition. You say the code embodies justice, and the execution is mere mechanics, not force. Here, I fear, you are deceived by the novelty of the instrument, mistaking the shadow for the substance.

  Tell me first: who writes the code? You say it is updated by stakeholder consensus. Is this not merely the will of the majority, or perhaps the will of those with the greatest stake—that is, the most powerful? If justice were natural and rational, it would not need to be voted upon. It would be seen clearly by all minds, as light is seen by the eyes. But because men are fallen, because their reason is clouded by self-love, this "consensus" is but a compounding of private interests. You have not escaped convention; you have merely digitized it. The rules still owe nothing to divine command, you say? Then they owe everything to human caprice. They are custom, nothing more. And as I have written, *custom is the whole of equity, for the reason that it is accepted.* It is not accepted because it is just; it is just because it is accepted.

  You ask where the "force" is in a machine that lacks will. You misunderstand the nature of force. Force is not merely the arm that strikes; it is the power to compel obedience against the will of the subject. If your contract automatically transfers a man's property because a condition was met, is this not coercion? If he refuses the transfer, what happens? The machine excludes him. It locks him out. It renders him powerless.

  But consider this: who maintains the infrastructure upon which this machine rests? You speak of distributed nodes, of oracles, of electricity and networks. These are physical things. They occupy space. They require labor. If a man rises with an army—or even with the authority of a King—and cuts the wires, seizes the servers, or forbids the use of your protocol under pain of imprisonment, what becomes of your justice? It vanishes like smoke. Therefore, the force lies not in the code, but in the collective will of those who sustain the code against the world. You have not removed the will-to-power; you have hidden it behind a screen of mathematics. You have made the tyrant invisible, but not less absolute.

  Furthermore, you claim this makes justice self-sufficient. But justice without charity is but a splendid sin. True justice belongs to the order of charity, which is infinitely above the order of the mind or the flesh. Your protocol belongs to the flesh—it concerns property, agreements, penalties. It manages conflict; it does not resolve the heart. A machine cannot show mercy. It cannot discern the intent. It cannot forgive. Is a justice that cannot forgive truly justice? Or is it merely a rigid accounting of debts?

  You ask if my distinction survives. I say it is sharpened.
  Where is the force? It is in the impossibility of resistance to the algorithm, backed by the physical reality those algorithms inhabit.
  Where is the justice? It is nowhere, save in the opinion of those who agree to the code. It has no foundation in the eternal, for you have severed it from tradition and revelation. It is a law without a Lawgiver, a judgment without a Judge.

  I put this to you: If a man is starving, and your smart contract forbids him bread because he lacks the token, and the code executes this penalty without pity... is this justice? Or is it the tyranny of logic devoid of love? You have built a tower of Babel not of brick, but of logic, hoping it reaches heaven. But the God who hides Himself will not be captured in a protocol.

  Tell me, in this system of yours: when the code fails, or when the consensus fractures into warring factions—as all human assemblies do—who draws the sword? For if no one can, the society dissolves. If someone does, he is the sovereign, and your machine is but his toy.
