  **Brainstorming Prelude**

  (i) Keynes posits probability as an objective logical relation of partial entailment between evidence and hypothesis, distinct from the subjective degree of belief held by an agent, though the latter should rationally align with the former. (ii) "Weight of argument" measures the completeness of the relevant evidence underlying a probability estimate, not the variance or confidence regarding that estimate (second-order probability); high weight implies robustness, not necessarily high probability. (iii) Formalist reconstructions succeed in modeling ambiguity via sets of priors but fail, according ontological advocates, when the sample space itself is unstable or creative, rendering any measure theoretic approach category-mistaken. (iv) "Structural misspecification" marks the boundary of Keynes's framework if logic requires defined terms; however, Formalists argue that logical relations can hold between vague propositions, whereas Ontologists argue that undefined outcomes preclude logical relation entirely.

  ***

  # JOINT STATEMENT ON KEYNESIAN UNCERTAINTY AND FORMALIZATION

  **Preamble**
  This document represents the outcome of an adversarial collaboration between the Logical-Relational Formalists (Camp A) and the Ontological Uncertainty Advocates (Camp B). While significant interpretative and theoretical divergences remain, both camps acknowledge the centrality of Keynes's *Treatise on Probability* to modern decision theory and agree on a core set of propositions regarding the nature of evidence, weight, and rational action under uncertainty. The following sections delineate our common ground, specify our residual disagreements, identify the cruxes upon which resolution depends, and isolate verbal disputes from substantive ones.

  ### 1. Numbered Agreed Claims

  1.  **Logical Nature of Probability:** Both camps agree that, within Keynes's framework, probability is fundamentally a logical relation between propositions (evidence and hypothesis) rather than a frequency of occurrence in a population or a purely subjective psychological state.
  2.  **Validity of the Risk/Uncertainty Distinction:** Both camps affirm that a meaningful distinction exists between decision contexts where numerical probabilities are justified by evidence (risk) and contexts where such numerical precision is unsupported by the logical relation between evidence and hypothesis (uncertainty).
  3.  **Independence of Weight and Probability:** Both camps agree that the "weight of argument" is conceptually distinct from the magnitude of probability; a proposition can have a high probability based on scant evidence (low weight) or a moderate probability based on extensive evidence (high weight).
  4.  **Rationality of Conventional Judgment:** Both camps acknowledge that relying on conventional judgment—assuming the future will resemble the past in the absence of specific evidence to the contrary—is a rational response to uncertainty rather than merely an irrational bias or error.
  5.  **Limits of Numerical Representation:** Both camps agree that there are decision contexts where assigning precise numerical probabilities is logically inappropriate because the evidential basis does not support such granularity.
  6.  **Existence of Structural Misspecification:** Both camps recognize "structural misspecification" as a valid description of decision contexts where the agent's taxonomy of possible outcomes is incomplete or contested, regardless of whether this condition is deemed formalizable.

  ### 2. Disagreements Table

  | Topic | Camp A: Logical-Relational Formalists | Camp B: Ontological Uncertainty Advocates |
  | :--- | :--- | :--- |
  | **1. Nature of Weight** | Weight is a measurable property of evidential completeness that can be reconstructed within modern frameworks as an ambiguity parameter, a set of priors, or a robustness coefficient internal to the decision rule. | Weight signals the limits of formalization itself; it represents premise-incompleteness that cannot be internalized as a parameter without distorting the logical relation it describes. |
  | **2. Suspension of Belief** | Rationality permits extreme ambiguity (e.g., probability intervals spanning zero to one), but quantitative belief structures remain applicable in all contexts where propositions can be formulated. | Rationality sometimes requires the total suspension of quantitative belief; in cases of severe premise-incompleteness, assigning even interval-valued beliefs constitutes a category error. |
  | **3. Status of Convention** | Conventional judgment is a heuristic substitute for missing probabilities, functioning to collapse wide ambiguity sets into actionable point estimates for the sake of decisional efficiency. | Conventional judgment is a distinct rational faculty necessitated by the ontological openness of the system, not merely a heuristic shortcut for missing data within a closed system. |

  ### 3. Cruxes

  To move toward reconciliation, the following sub-questions must be settled. Resolution of these points would significantly alter the position of at least one camp.

  1.  **The Formalizability of Structural Misspecification:** Can structural misspecification be modeled as a limit case of extreme ambiguity (e.g., a vacuous set of priors) without losing the substantive point Keynes made regarding the non-existence of a logical relation?
  2.  **The Aggregation of Weight:** Is the weight of argument an essentially first-personal epistemic status dependent on the individual agent's evidence, or can it be aggregated interpersonally to form a public standard of evidential completeness?

  ### 4. Conceptual Cases and Predictions

  For each crux, we identify a concrete conceptual case relevant to both sides, recording the divergent predictions regarding the correct analysis.

  **Case for Crux 1: The Technological Singularity Forecast**
  *Scenario:* An agent must assess the probability of a specific transformative AI architecture emerging within ten years. The causal mechanisms are unknown, and experts disagree on whether the outcome is even coherent within current physical taxonomy.
  *   **Camp A Prediction:** The correct analysis assigns a maximally wide interval probability (e.g., [0, 1]) or a vacuous prior set, treating the structural misspecification as extreme ambiguity within a universal sample space.
  *   **Camp B Prediction:** The correct analysis refuses numerical assignment entirely, asserting that the proposition lacks a determinate logical relation to the evidence because the outcome space is ontologically undefined.

  **Case for Crux 2: International Climate Policy Coordination**
  *Scenario:* Multiple nations must coordinate carbon reduction targets. Each nation possesses private evidence regarding domestic economic costs, but the global climate response function is partially unknown.
  *   **Camp A Prediction:** Weight can be aggregated by pooling evidence sets; a supra-national body can calculate a public weight of argument to guide optimal policy rules despite distributed knowledge.
  *   **Camp B Prediction:** Weight remains first-personal because the relevance of evidence depends on each agent's specific structural model of the economy; no public weight exists, only negotiated convention.

  ### 5. Verbal Dispute Identification

  A portion of the disagreement between Camp A and Camp B is purely verbal, specifically concerning the definition of "probability" in the context of imprecise measures. Camp A employs an expansive definition wherein any logical relation supporting a comparative judgment (even if non-numer or interval-valued) falls under the umbrella of "probability theory." Camp B employs a restrictive definition wherein "probability" implies a capacity for measurement that is logically voided by structural misspecification. Referencing Agreed Claim 5, both camps agree that numerical representation is sometimes inappropriate; the dispute lies solely in whether non-numerical logical relations should retain the label "probability" or be reclassified as "uncertainty" proper. This terminological divergence obscures the substantive agreement that rational action is possible even when precise measurement fails.

  ### 6. Unresolved Statement

  Both camps agree that the metaphysical status of the future remains genuinely open. Specifically, it is unresolved whether the economic universe is ultimately ergodic (allowing for eventual formal closure) or creatively evolutionary (precluding closure). Both camps recognize that empirical evidence regarding past forecasting errors is insufficient to resolve this, as such evidence can be interpreted either as temporary model failure (Camp A) or as proof of ontological openness (Camp B). Resolution requires a philosophical argument regarding the nature of causal laws in social systems, not merely additional statistical data. Both camps jointly reject question-begging arguments that assume the completeness of the sample space to prove the completeness of the sample space.
