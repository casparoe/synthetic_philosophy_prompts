      *   *Why the loop?* Context dependence, diminishing returns, sensory adaptation, or different criteria weighing differently in different pairings.
      *   *Example:* A vs B (noise masking vs. distraction), B vs C (some sound vs. none), C vs A (unnatural sound vs. natural silence).
      *   *Key Insight:* "Better" is not a universal property of the pod; it's a relationship between the pod, the user's current state, and the specific alternative.

