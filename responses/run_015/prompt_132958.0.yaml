reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired physicist, new to philosophy, notices a trend in skepticism threads (BIV vs. VR/Matrix), suspects the "engineering fix" (build a better sensor) is too simplistic.
      *   **My Persona:** Professional philosopher of science with strong epistemology training.
      *   **Task:** Audit the BIV vs. VR analogy.
      *   **Specific Requirements:**
