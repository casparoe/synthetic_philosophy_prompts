  3.  **Design Decision:** Bet on **Structural Fidelity**. Ensure your mapping preserves geometric relationships (topology, continuity, parity) as perfectly as possible. Do not over-invest in "calibration" exercises where users must touch and hear simultaneously; her rule implies this is unnecessary for spatial recognition.
