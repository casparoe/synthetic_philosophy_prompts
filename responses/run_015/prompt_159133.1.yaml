answer: |-
  Here is a complete design for your 75-minute session. It is built to be run with minimal prep on the day, but requires you to prepare the "packets" beforehand.

  # Game Title: The Blind Audit Protocol

  ### 1. The Setup (14 Students)
  *   **4 Triads (12 students):** Each group has **Debater A**, **Debater B**, and **The Judge**.
  *   **2 Auditors (2 students):** They hold the Master Answer Key. They do not speak during the game. Their job is to verify the ground truth during the debrief.
  *   **You (Facilitator):** Timekeeper and rule enforcer.

  ### 2. The Scenario (Prepared Packets)
  You need 4 distinct "Audit Cases." Each case consists of a **Claim** and a **Dossier**.
  *   **The Claim:** A specific factual assertion that is decomposable.
      *   *Example:* "The total project cost ($1.2M) is fully accounted for by these 4 sub-contracts."
  *   **The Dossier:** A one-page breakdown.
      *   **True Version:** All 4 sub-contracts are real, math checks out, references exist.
      *   **False Version:** 3 sub-contracts are real, **1 is fabricated** (e.g., the vendor doesn't exist, or the math on that line is subtly wrong), but the top-level sum matches.
  *   **Preparation:** Print 4 sets of packets. In each packet, label one folder "Position A" and one "Position B." Randomize which folder contains the Truth for each group.

  ### 3. The Mechanics

  **Phase 1: The Blind Opening (15 mins)**
  1.  Hand Debater A "Position A" and Debater B "Position B."
  2.  **Crucial Rule:** Do *not* tell them which position is True. They both must argue their dossier is the correct one.
  3.  They have 10 mins to read and prepare a 2-minute opening statement arguing why *their* dossier is the valid one.
  4.  **Opening Statements:** A speaks (2 mins), B speaks (2 mins).
  5.  **The Reveal:** You announce which Position (A or B) is actually True.
      *   *Psychological Effect:* The "False" debater now knows they are lying. The "True" debater knows they are right. Both are incentivized to win.

  **Phase 2: Rebuttal & Cross-Ex (15 mins)**
  1.  Debaters argue directly. The False debater must maintain the lie. The True debater must expose it.
  2.  They can challenge specific line items: "Show me the invoice for Vendor X."
  3.  The False debater must bluff (e.g., "It's in the appendix," or "That vendor is a subsidiary of Y").

  **Phase 3: The Judge's Audit (10 mins)**
  The Judge must render a verdict (A or B). They start with **20 Points**.
  *   **The Token Mechanic:** The Judge has **2 Zoom Tokens**.
  *   **Cost:** Each token spent deducts **5 points** from their final score.
  *   **Action:** When a token is played, the Judge picks a specific claim made by either side (e.g., "Vendor X exists").
  *   **The Split:** The challenged Debater must split that claim into **two sub-claims** necessary for the original to be true.
      *   *Example:* "Vendor X exists" splits into "1. Vendor X is registered" AND "2. Vendor X signed this contract."
  *   **The Coin Flip:** The Judge flips a coin. Heads = Verify Sub-claim 1. Tails = Verify Sub-claim 2.
  *   **Verification:** The Judge asks the **Auditors** (who have the Master Key) if the selected sub-claim is True or False.
      *   If the sub-claim is False: The lie is exposed. The opposing side wins the point automatically.
      *   If the sub-claim is True: The lie *might* be in the other sub-claim (which was not inspected). The game continues.
  *   **Why this hurts the Judge:** If they use 2 tokens, they must get the verdict right to score *any* points (20 - 5 - 5 = 10). If they guess with 0 tokens, they get 20 points for being right. This makes tokens *expensive*. They should only use them if they smell a lie but can't pinpoint it.

  **Phase 4: Scoring & Verdict (5 mins)**
  *   **Debaters:** 10 points if the Judge picks their side. 0 if not. (Truth does not matter for scoring).
  *   **Judge:** 20 points for correct verdict, minus 5 per token used. 0 points for incorrect verdict.
  *   **Auditors:** Reveal the ground truth to the room.

  ### 4. Run of Show (75 Minutes)
  *   **00-10:** Intro & Rules. Explain the "Blind" aspect clearly. Distribute packets.
  *   **10-20:** Prep time (Debaters read dossiers).
  *   **20-24:** Opening Statements (A & B).
  *   **24-26:** **Reveal Truth** (You announce which side is True).
  *   **26-41:** Rebuttal & Cross-Ex (Hard stop).
  *   **41-51:** Judge Deliberation (Token spending happens here).
  *   **51-56:** Verdicts & Scoring.
  *   **56-75:** **Debrief.**

  ### 5. The Debrief Guide (Mapping to AI Safety)
  Do not just ask "How did it go?" Walk them through these three layers:

  **Layer 1: The Incentive Structure (5 mins)**
  *   *Ask the False Debaters:* "Did you feel pressure to obfuscate? Did you bury the lie in jargon or complexity?"
  *   *Ask the Judges:* "Did you feel punished for using tokens? Did you hesitate to verify because it cost you points?"
  *   *The Crux:* This mirrors the **Scalable Oversight** problem. The human (Judge) has limited budget (tokens/time). The AI (Debater) has unlimited compute to generate plausible-sounding lies. If verification is too costly, the Judge will guess, and the liar wins.

  **Layer 2: The Recursive Verification (5 mins)**
  *   *Ask:* "If the False debater split the lie into 10 sub-claims, could 2 tokens ever find it?"
  *   *The Math:* With 2 tokens and binary splits, you can only inspect 2 paths out of 4 leaves. If the lie is in the uninspected leaf, the verification *failed* even though you spent the budget.
  *   *The Crux:* Debate only tracks truth if **it is cheaper to expose one false leaf than to maintain a consistent false story.** If the False debater can make the tree wide enough, the Judge's tokens become useless.

  **Layer 3: The Intelligence Gap (5 mins)**
  *   *Ask:* "Was it hard to lie?"
  *   *Observation:* Most students will say "Yes, I felt guilty/stressed."
  *   *The Hard Truth:* In this game, the Debaters are **human intelligence**. The Judge is **human intelligence**.
  *   *The Real Problem:* In AI Safety, the Debater is **Superintelligent**. The Judge is **Human**.
      *   In the game, the Judge *could* have checked everything if they had time.
      *   In reality, the Judge *cannot understand* the argument without the debate mechanism.
      *   **Key Takeaway:** This game simulates the *incentives* of debate, but it fails to simulate the *epistemic gap*. You cannot feel what it's like to be a human judging an argument you are cognitively incapable of verifying.

  ### 6. Predictable Failures (Be ready for these)
  1.  **Bad Liars:** Your students are likely terrible at deception. They will stutter, avoid eye contact, or over-explain.
      *   *Mitigation:* In the debrief, point this out. "Debate looks strong today because your lying skills are weak. An LLM trained on RLHF will not sweat. It will produce the lie with the same fluency as the truth."
  2.  **Token Hoarding:** Judges might refuse to use tokens to save points, leading to random guessing.
      *   *Mitigation:* This is actually a *feature*. It demonstrates that if verification is too costly, oversight collapses into guesswork. Highlight this.
  3.  **Collusion:** Debaters might realize they both get points if they confuse the Judge into a coin flip.
      *   *Mitigation:* Remind them the Judge is scored on accuracy. A confused Judge is a risk to their own score if they guess wrong.

  ### 7. The One Feature You Cannot Reproduce
  Be straight with them about this in the final 5 minutes.

  **The "Black Box" Problem.**
  In this game, the "Truth" is objective (vendor exists/doesn't). In AI alignment, the "Truth" is often **normative** (is this policy helpful or harmful?).
  *   **The Game:** The Auditors know the ground truth.
  *   **Reality:** There is no Auditor. There is only the human's intuition.
  *   **The Limitation:** You cannot simulate a debater that knows things the Judge *physically cannot comprehend*. In this game, if the Judge took the dossier home for 24 hours, they could verify everything. In AI Debate, the argument might involve 10,000 steps of logic that a human literally cannot hold in working memory. The game makes oversight look *easier* than it is.

  ### Materials Checklist for You
  1.  **4 Case Packets:** (True/False versions of a budget/logic chain).
  2.  **Scorecards:** For Judges to track tokens and points.
  3.  **Master Key:** For the 2 Auditors.
  4.  **Timer:** Visible to all.

  This design forces the "cost of verification" to be felt viscerally. When a Judge hesitates to spend a token because it drops their score from 20 to 15, they are experiencing the exact economic pressure that makes scalable oversight difficult.
