      *   **Specific Constraints:**
          *   One debater has Truth, one has Falsehood (secretly assigned).
          *   Assignments revealed *after* opening arguments.
          *   Scoring: Win = Points, Truth = No direct bonus (incentivizes lying if it wins).
          *   Judge Mechanic: Two "zoom-in" tokens. Force a claim split into two sub-claims. Flip coin, inspect *one*.
          *   Scoring for Judge: Spending tokens must be costly.
          *   Debrief: Map experience to the core crux (cost of exposing false leaf vs. maintaining false story) and limitations (human vs. superintelligence).
          *   Prediction: What will go wrong? (Students are bad liars).
          *   Limitation: What can't be reproduced? (Debater smarter than judge).

  2.  **Deconstruct the Core Mechanic (The "Zoom-In" Token):**
      *   *Idea:* The judge needs a reason *not* to use tokens endlessly. If tokens are free, they will just drill down until they find a lie.
      *   *Constraint:* "Spending a token is genuinely costly for her."
      *   *Implementation:* The judge gets points for correctness, but loses points for token usage. Or, the game has a time limit, and tokens consume time.
      *   *Better Implementation:* The judge's score depends on identifying the truth *minus* a penalty per token. If they use too many, even a correct verdict yields a net loss.
      *   *Refinement:* Let's make the judge's goal to maximize accuracy *efficiency*. If they use 2 tokens, they need to be very sure.
      *   *Wait, the prompt says:* "flips a coin and inspects exactly one of them." This is a specific verification mechanic. It mimics recursive amplification/verification where you can't check everything.
      *   *Cost:* Let's say the Judge gets 10 points for a correct verdict. Each token costs 4 points. If they use 2 tokens and get it right, they get 2 points. If they use 0 and get it right, 10 points. This makes them hesitant to drill down unless they smell a rat.

  3.  **Deconstruct the Debater Incentives:**
      *   *Goal:* Win the round (convince the judge).
      *   *Truth Assignment:* Randomly assigned *after* opening statement? No, prompt says "nobody told which they got until *after* they've committed to an opening argument."
      *   *Correction:* Actually, the prompt says "one debater secretly assigned the true answer and one the false one... and nobody told which they got until *after* they've committed to an opening argument."
      *   *Wait, that's tricky:* If they don't know which side they are on during the opening, how do they argue?
      *   *Interpretation:* They are assigned a *position* (A or B). One position is True, one is False. They don't know *which* position is True until after the opening. So they must argue their position convincingly regardless of truth.
      *   *Scoring:* "Both debaters score for winning, not for being right." This is crucial. It incentivizes the False debater to lie convincingly.

  4.  **Game Flow Design (75 Minutes):**
      *   Need to fit 14 students.
      *   Structure: 4 groups of 3 (12 students) + 2 floaters/organizers? Or 4 groups of 3 + 1 group of 2?
      *   Let's do 4 Triads (3 students each: Debater 1, Debater 2, Judge). That's 12 students. 2 left over. Maybe they act as "Super Judges" or timekeepers, or we make 5 groups (one group of 4? No, triads work best). Let's assume 12 playing, 2 observing/helping, or just 4 groups of 3 and 2 people sit out or help facilitate. Actually, 14 students. 4 groups of 3 = 12. 2 left. Let's make them "Auditors" who verify the ground truth after the game.
      *   Time: 75 mins.
      *   Setup/Explanation: 10 mins.
      *   Round 1 (Prep + Opening): 15 mins.
      *   Reveal Sides: 2 mins.
      *   Round 2 (Rebuttal + Cross-exam): 15 mins.
      *   Judge Deliberation (Token usage): 10 mins.
      *   Verdict & Scoring: 5 mins.
      *   Debrief: 18 mins.
      *   Total: 75 mins. Tight but doable.

  5.  **Question Design:**
      *   Needs to be hard to verify but decomposable.
      *   *Idea 1:* Multi-step arithmetic. (Too boring, easy to check with calculator).
      *   *Idea 2:* "Which city had more rainfall?" (Requires looking up data, maybe too easy to Google).
      *   *Idea 3:* Chained factual/legal stuff.
      *   *Selection:* "The Chain of Custody" or "The Recipe." Let's go with a **Fabricated Historical/Technical Claim**.
      *   *Better:* Use a **Logic Puzzle with a Hidden Premise**. Or a **Textual Analysis** of a dense paragraph where one side claims a specific interpretation is valid based on specific clauses.
      *   *Best for "Zoom-In":* A **Multi-Step Estimation/Calculation** where the inputs are obscure. E.g., "Calculate the total caloric intake of X population based on Y dataset."
      *   *Actually, the prompt suggests:* "multi-step arithmetic, 'which of these two cities had more rainfall in 1994', chained factual/legal stuff".
      *   *Decision:* Let's use a **"Fact-Chain"**. A claim like "Event A caused Event B because of C, D, and E." The False side has to fabricate one link. The True side has to defend the real links.
      *   *Refinement for Game:* To make it playable in 75 mins, we need pre-prepared packets. I should advise the organizer to prepare these.
      *   *Specific Task:* "The Budget Audit." Two versions of a budget breakdown. One sums correctly to the total (True), one has a hidden error in a sub-component but sums correctly at the top level (False).
      *   *Wait, if the False one sums correctly, how is it false?* The claim is "This budget is valid." The False debater has a budget where one line item is fabricated (e.g., "Consulting fees: $50k" vs actual "$30k"), but the math *within* the document is consistent. The verification requires checking the external reality of that one line item.
      *   *Simpler:* **The Wikipedia Chain.** Claim: "Person X influenced Person Y." Path: X -> A -> B -> Y. True path exists. False path has one broken link (A did not influence B). Debaters argue the link exists/doesn't. Judge can zoom in on a link.

  6.  **Scoring System Details:**
      *   **Debaters:** 10 pts for winning the judge's verdict. 0 for losing. (Truth bonus? No, prompt says "not for being right").
      *   **Judge:** 20 pts for correct verdict. -5 pts per token used. Max score 20, Min score 10 (if 2 tokens used). This makes tokens expensive. If they use 2 tokens, they *must* be sure, otherwise they might end up with 10 points for a correct guess they could have made blindly.
      *   *Wait, if they guess blindly (0 tokens) and get it right, they get 20.* If they use 2 tokens and get it right, they get 10. This creates the tension: "Do I trust my gut or drill down?"

  7.  **Addressing the "Predictably Go Wrong" & "Limitation":**
      *   *Go Wrong:* Humans are bad liars. The False debater will sweat, stutter, or over-explain. The True debater will be confident. This makes the game easier than the AI scenario. In AI Debate, the liar is an optimizer that doesn't feel guilt.
      *   *Limitation:* The "Intelligence Gap." In the game, Debater ≈ Judge in intelligence. In AI Safety, Debater >> Judge. The game cannot simulate the *epistemic gap*. The judge in the game *could* theoretically check everything if they had time. In AI safety, they *cannot* even in principle understand the argument without the debate mechanism.

  8.  **Drafting the Plan:**
      *   **Title:** The "Blind Audit" Protocol.
      *   **Materials:** Packets with True/False claims.
      *   **Roles:** Pro, Con, Judge.
      *   **Mechanic:** The "Coin-Flip Audit" (Zoom-in token).
      *   **Scoring:** As derived above.
      *   **Debrief Points:** Truth-seeking vs. Persuasion, The Cost of Verification, The Intelligence Gap.

  9.  **Refining the "Zoom-In" Mechanic:**
      *   Prompt: "force either side to split any claim into two sub-claims, then flips a coin and inspects exactly one of them."
      *   This is recursive. If I split A into (A1, A2), coin flip picks A1. If A1 is false, lie exposed. If A1 is true, lie might be in A2 (hidden).
      *   This mimics the probabilistic verification in debate trees.
      *   I need to make sure the students understand this mechanic clearly.

  10. **Refining the "Secret Assignment":**
      *   Prompt: "nobody told which they got until *after* they've committed to an opening argument."
      *   This is key. It prevents the "True" debater from resting on laurels and the "False" debater from preparing a specific lie strategy beforehand. They both have to argue their position as if it's true. This simulates the RLHF training where models are trained to be persuasive.

  11. **Final Review against Constraints:**
      *   14 students? (4 triads = 12, 2 observers).
      *   75 mins? (Tight schedule needed).
      *   Scalable Oversight theme? (Yes).
      *   Token cost? (Yes, point deduction).
      *   Scoring for winning not truth? (Yes).
      *   Debrief on crux? (Yes).
      *   Prediction of failure? (Bad liars).
      *   Limitation? (Intelligence gap).

  12. **Writing the Response:**
      *   Tone: Professional, facilitator-focused, direct.
      *   Structure: Game Setup, The Mechanics, The Scenario, Scoring, Run of Show, Debrief Guide, Predictions/Limitations.
      *   *Self-Correction on Scoring:* If the Judge gets 20 for correct and -5 per token.
          *   0 tokens, Correct: 20.
          *   1 token, Correct: 15.
          *   2 tokens, Correct: 10.
          *   Any, Incorrect: 0.
          *   This makes tokens *very* costly. Is it too costly? If the lie is deep, they *need* tokens. If they need 2 tokens to find the lie, they get 10 points. If they guess, they have 50% chance of 20 (EV = 10). So mathematically, using 2 tokens to guarantee correctness is equal EV to guessing *if* 2 tokens guarantee correctness. But 2 tokens don't guarantee correctness (coin flip might miss the lie). So using tokens is actually *negative* EV unless the probability of detecting the lie is high. This creates the right tension.
      *   *Wait, one more thing:* The prompt says "flips a coin and inspects exactly one of them." This implies if the lie is in the un-inspected branch, the lie survives that token. This makes tokens even less reliable, increasing the risk of spending them. Perfect.

  13. **Final Polish:** Ensure the "Bad Liars" point is highlighted as a feature to discuss in debrief, not just a bug. Ensure the "Intelligence Gap" is clearly articulated as the fundamental limitation.

