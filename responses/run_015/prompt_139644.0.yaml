  ### I. Prerequisites and Order of Operations

  You cannot run the argument until the logical relations are fixed on the board. The audience's fluency in Expected Utility (EU) is a liability here; they will try to model this as a continuous function. You must force a discrete logical structure before introducing the substantive case.

  **Order of Components:**
  1.  **Relations:** Define **Strictly Better Than ($>$)** and **At Least As Good As ($\geq$)**.
      *   *Dependency:* You cannot define intransitivity without specifying which relation is failing. Intransitivity in $>$ (A>B, B>C, not A>C) is distinct from intransitivity in $\geq$.
  2.  **Transitivity Axiom:** State formally: $\forall x,y,z$, if $x > y$ and $y > z$, then $x > z$.
      *   *Dependency:* This establishes the rule the argument will threaten.
  3.  **The Step Condition:** Define what counts as a "neighbouring case" ($A_i$ vs $A_{i+1}$).
      *   *Dependency:* You must establish that the comparison is between *adjacent* members, not arbitrary ones.
  4.  **The Endpoint Condition:** Define the comparison between First ($A_1$) and Last ($A_n$).
      *   *Dependency:* The paradox only arises if the local chain ($A_1 > A_2 > \dots$) conflicts with the global intuition (not $A_1 > A_n$).

  **Why this order:** If you introduce the case before defining $>$, policy students will immediately model value as a continuous variable $V(x)$, allowing them to say "the difference is just $\epsilon$." By fixing the logic first, you force them to treat the relations as binary truths, which makes the "threshold" constraint of the case bite harder later.

  ---

  ### II. The Case: "The Spectrum of Mastered Proofs"

  Do not use lives saved or dollars; their CBA training will smooth the curve. Use **"Actually Understanding a Proof."**

  **The Sequence:**
  *   **$A_1$:** You fully understand *one* profound proof (e.g., Gödel's Incompleteness).
  *   **$A_2$:** You fully understand *two* slightly less profound proofs.
  *   **$A_3$:** You fully understand *three* slightly less profound proofs than $A_2$.
  *   ...
  *   **$A_n$:** You fully understand *one million* trivial proofs (e.g., $1+1=2$ in formal notation).

  **Required Features & Reasons:**
  1.  **The Threshold Good ("Mastered"):**
      *   *Feature:* Understanding is binary. You either grasp the proof or you don't. There is no "0.5 understood."
      *   *Reason:* This blocks the "smooth divisibility" escape. In CBA, they can always say "marginal utility decreases." Here, the unit of value is the *completed cognitive state*. If the threshold isn't met, the value is zero. This forces them to treat each step as a discrete gain in *number* of threshold-goods achieved.
  2.  **Perceptible Steps:**
      *   *Feature:* The drop in profundity from $A_i$ to $A_{i+1}$ is noticeable, not imperceptible.
      *   *Reason:* Students will try to claim adjacent cases are "indifferent" ($\sim$). By making the trade-off perceptible (one deep insight vs. two moderate insights), you force them to admit a preference ($A_{i+1} > A_i$) based on quantity, rather than hiding behind "roughly as good as."
  3.  **Global Discontinuity:**
      *   *Feature:* $A_1$ is intuitively superior to $A_n$ (One Gödel insight > One million trivialities).
      *   *Reason:* This creates the intransitivity. If $A_{i+1} > A_i$ for all steps, transitivity demands $A_n > A_1$. Their intuition says $A_1 > A_n$.

  ---

  ### III. The Misconception Map

  Expect three specific defensive moves. Do not answer them when they arise; **defuse** them at the specific structural points below.

  | Misconception | The Student Move | Exact Point to Defuse | How to Defuse |
  | :--- | :--- | :--- | :--- |
  | **Imperceptibility** | "The difference between $A_i$ and $A_{i+1}$ is too small to matter." | **Case Introduction** (Before the sequence starts). | Stipulate that the trade-off is *perceptible*. "Assume for the sake of argument that you can tell the difference between one deep proof and two moderate ones. We are testing logic, not psychophysics." |
  | **Indifference Transitivity** | "Adjacent cases aren't 'better', they are 'roughly as good as' ($\sim$). Since $\sim$ is transitive, the chain holds." | **During the Walkthrough** (At step $A_5$ vs $A_6$). | Block the use of $\sim$. "If you say $A_i \sim A_{i+1}$, you must accept $A_1 \sim A_n$. Do you really value one Gödel proof exactly the same as a million trivialities? If not, you must admit some $>$ relation exists in the chain." |
  | **Money Pump / Cyclical Preference** | "If betterness is intransitive, I can be money-pumped. I'll trade $A_1$ for $A_2$, pay a fee, trade $A_2$ for $A_3$..." | **Post-Sequence / Implications** (After the paradox is established). | Distinguish *Sorites Intransitivity* from *Cyclical Intransitivity*. "A money pump requires a cycle ($A>B>C>A$). This argument produces a chain ($A>B>\dots>Z$) where the ends don't match. You cannot trade back up the chain without reversing the preference. The exploitability argument does not apply here." |

  ---

  ### IV. Closing

  **The Diagnostic Question:**
  > "To save transitivity, you must reject one of two premises: either you deny that the adjacent improvement ($A_{i+1}$ over $A_i$) is genuinely *better*, or you deny that the first case ($A_1$) is genuinely *better* than the last ($A_n$). Which premise are you willing to break, and does that break imply that value is vague or that rationality is bounded?"

  **What to Decline to Settle:**
  > "I will not tell you whether Transitivity is a requirement of **Rational Choice** (a rule for agents) or a property of **Betterness** (a fact about the world). In ninety minutes, we can expose the tension, but we cannot adjudicate whether the fault lies in your decision theory or in the structure of value itself."
