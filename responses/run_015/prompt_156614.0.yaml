answer: |-
  ### (1) Exam Question

  **Question 4 (20 marks)**

  Consider the case of the "Lock-In Convention" described below:

  > In a population *P*, everyone follows regularity *R* in situation *S*. Each individual prefers to follow *R* conditional on others doing so (deviation brings sanctions). However, nearly everyone would prefer a state where the whole population followed an alternative *R\** (with no sanctions), and almost everyone falsely believes that others genuinely prefer *R* over *R\**.

  You have been provided with a summary of Lewis's conditions for convention, including the requirements for coordination equilibrium, arbitrariness, and common knowledge.

  Write an essay addressing the following:
  1.  Does the Lock-In case satisfy Lewis's conditions for a convention? Defend your answer by focusing specifically on the **common knowledge** requirement regarding preferences and expectations.
  2.  What are the consequences of your verdict for the theory's ability to explain how norms persist and how they might change? Specifically, evaluate whether behavioral tipping (a stubborn minority switching to *R\***) or epistemic revelation (revealing true preferences) is the necessary mechanism for escape.
  3.  Briefly explain whether Lewis's account can distinguish between having a *reason* to conform and being *entitled* to sanction non-conformists in this context.

  ---

  ### (2) Model Answer

  The Lock-In case presents a significant stress test for Lewis's account of convention. While it superficially resembles a coordination equilibrium, it ultimately fails to satisfy the strict epistemic conditions Lewis requires, specifically regarding common knowledge of preferences. Recognizing this failure is essential for understanding why such norms persist and what is required to dismantle them.

  To determine if Lock-In counts as a convention, we must look beyond the behavioral regularity. Lewis requires that a convention be a coordination equilibrium where everyone conforms, everyone expects everyone to conform, and everyone prefers to conform on the condition that others do. In the Lock-In case, the conditional preference holds: I work seventy hours because I believe you do, and I wish to avoid the sanction of looking lazy. However, Lewis also requires that the preference structure itself be common knowledge. In a standard convention, we know that we are all coordinating to solve a problem and that we are all indifferent between the equilibrium chosen and other possible equilibria, provided we match. In the Lock-In case, the epistemic condition is fractured. Each agent believes the others intrinsically prefer the grind (*R*). Therefore, agents do not share common knowledge of the true preference ordering (which favors *R\**). Because the mutual belief required to sustain the equilibrium is based on a systematic falsehood about others' utilities, the case fails the common knowledge condition. It is not a convention in the Lewisian sense, but rather a pluralistic ignorance trap sustained by false beliefs.

  This verdict carries significant costs for the explanatory power of the account. If we exclude Lock-In from the category of convention, Lewis's theory cannot explain the stability of many oppressive social norms that function exactly like this research group. If we include it by relaxing the common knowledge requirement, the concept of "convention" becomes too broad, swallowing up coercive norms that lack the arbitrariness Lewis deemed essential. The distinction matters for explaining change. If this were a standard Lewisian convention, change could occur through salience or precedent; a small minority switching to *R\** could signal a new focal point, shifting expectations until the population tips. Priya's suggestion that a five percent minority could trigger this relies on the assumption that observers update their expectations rationally based on new behavior.

  However, because the Lock-In case relies on false beliefs about preferences, behavioral tipping alone is insufficient. If I see a minority working forty hours, I may interpret this not as a signal of a new equilibrium, but as evidence that they are misguided or unaware of the (alleged) group preference for hard work. As long as I believe the majority genuinely loves the grind, I will not follow the minority. Therefore, the mechanism for escape cannot be purely behavioral; it must be epistemic. The lock-in dissolves only when the preference structure is revealed—through a survey or credible announcement—correcting the second-order beliefs. Once I know that you also hate the seventy-hour week, the conditional preference to conform evaporates, and *R\** becomes the viable equilibrium. Lewis's machinery, which focuses on expectations derived from past behavior, lacks the resources to explain change driven by preference revelation rather than behavioral precedent.

  Finally, there is the issue of normativity. Lewis explains why an individual has a prudential reason to conform: deviation leads to a worse outcome given the expectations of others. However, his account does not generate a normative entitlement to sanction. In the Lock-In case, I sanction you for working forty hours to protect my own utility within the equilibrium. Lewis can explain this as a rational strategy to maintain the coordination I prefer (conditionally), but he cannot explain why I am *morally authorized* to punish you. The gap between "I have a reason to pressure you" and "I have a right to pressure you" remains unbridged by coordination logic alone.

  In conclusion, the Lock-In case fails Lewis's common knowledge condition due to false beliefs about preferences. This failure highlights that while Lewis explains how equilibria sustain themselves through expectations, he cannot adequately explain the persistence of norms based on ignorance, nor the mechanisms required to break them. Escaping Lock-In requires correcting beliefs, not just shifting behavior, and Lewis's framework offers no account for the normative authority claimed by those enforcing the status quo.

  ---

  ### (3) Marking Scheme (Total: 20 Marks)

  **1. Diagnosis of Common Knowledge (4 marks)**
  *   **Award:** 4 marks for identifying that while conditional preferences exist, the *common knowledge of the true preference structure* is missing (agents falsely believe others like *R*).
  *   **Common Fumble:** Students argue it *is* a convention because the behavioral equilibrium holds, ignoring the epistemic requirement that agents know *why* others are conforming.

  **2. Explanatory Cost of Verdict (4 marks)**
  *   **Award:** 4 marks for articulating the trade-off: excluding Lock-In limits the theory's scope (can't explain bad norms); including it dilutes the concept (conflates coordination with coercion/ignorance).
  *   **Common Fumble:** Students claim there is no cost, or simply state "Lewis is descriptive" without analyzing how the definition affects explanatory power regarding persistence.

  **3. Mechanism of Change (4 marks)**
  *   **Award:** 4 marks for arguing that behavioral tipping (Priya's view) fails without epistemic correction, because false beliefs block the interpretation of the minority's action as a viable precedent.
  *   **Common Fumble:** Students accept the "tipping point" model uncritically, failing to see that in Lock-In, new behavior is interpreted as noise or deviance rather than a signal.

  **4. Normative Gap (4 marks)**
  *   **Award:** 4 marks for distinguishing between prudential reasons to conform (avoiding sanction) and the entitlement to sanction (normative authority), noting Lewis only provides the former.
  *   **Common Fumble:** Students conflate "having a reason to sanction" with "having a right to sanction," or claim Lewis solves this via mutual obligation.

  **5. Coherence and Stand (4 marks)**
  *   **Award:** 4 marks for a clear, consistent argument throughout that synthesizes the epistemic and behavioral points into a final verdict on the theory's limits.
  *   **Common Fumble:** Students hedge excessively ("On one hand... on the other...") without reaching a conclusion about whether Lewis's account needs augmentation.

  ---

  ### (4) Differentiation Note (A vs. B)

  A **B-range answer** will correctly apply the definition of convention to the case, noting that the conditional preferences are met, and will likely accept Priya's view that behavioral tipping can solve the problem. They will summarize Lewis's conditions accurately but treat the "false belief" element as a minor detail rather than a structural failure of the common knowledge condition. They will typically conclude that Lewis's account is sufficient but perhaps "unhappy" in this case.

  An **A-range answer** will identify that the false beliefs about preferences constitute a failure of the *common knowledge* condition, not just an unfortunate outcome. They will rigorously argue that Lewis's reliance on precedent cannot fix epistemic errors, meaning preference revelation is necessary for change. They will clearly separate the prudential rationality of sanctioning from the normative authority to sanction, concluding that Lewis's account requires supplementation (e.g., by a theory of normative expectations) to fully explain the Lock-In phenomenon.
