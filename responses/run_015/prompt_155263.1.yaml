  **MEMORANDUM**

  **TO:** Academic Policy Committee
  **FROM:** Junior Class Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Dev Appeal & Surprise Assessment Policy

  **Decision on Appeal**
  I recommend we **deny Dev's appeal** and uphold the quiz grade. While Dev's logical deduction (the "Unexpected Hanging Paradox") is formally valid within a closed logical system, it fails empirically. The paradox relies on the student *knowing* the teacher's announcement is true as an axiom. In reality, the teacher's action is independent of the student's deduction. Dev was empirically surprised on Tuesday; therefore, the pedagogical condition of the quiz was met for him. Okafor's rebuttal ("you didn't know, you guessed") holds: logical certainty is not required for surprise, only actual ignorance.

  **Strongest Point of the Losing Side**
  We must acknowledge Dev's strongest point: the announcement was logically self-contradictory. If the committee accepts that a "promise" implies logical consistency, Okafor broke his word regardless of the empirical outcome. Additionally, regarding the accommodations: if four students received 24-hour notice, the assessment conditions were not uniform. The strongest argument against upholding the quiz is equity, not logic.

  **Policy Recommendation**
  To resolve the conflict between surprise pedagogy and accommodation policy, I propose the following rule:

  1.  **Sections with Accommodations:** If any student in a section requires 24-hour notice for assessments, **surprise quizzes are prohibited for the entire class.** The teacher must provide 24-hour notice to all students. Maintaining a secret among four students in a high school environment is functionally impossible; allowing it creates an inequitable advantage (prep time) for accommodated students over peers.
  2.  **Sections without Accommodations:** Surprise quizzes are permitted, but **not on Fridays.**
      *   *Reasoning:* A surprise quiz is logically coherent on Monday through Thursday. Friday is excluded because if the quiz has not occurred by Thursday evening, Friday becomes the only remaining option, rendering it certain rather than surprising. While a teacher *could* still surprise students on Friday empirically, the announcement itself becomes logically false, inviting valid appeals.

  **Coherent Announcement Structure**
  A valid surprise announcement is: *"There will be one quiz this week, on a day you cannot deduce beforehand."*
  *   **Valid Days:** Monday, Tuesday, Wednesday, Thursday.
  *   **Invalid Day:** Friday.
  *   **Why:** On Monday-Thursday, multiple possibilities remain open, preventing deductive certainty. On Friday (if previous days pass), deductive certainty occurs, voiding the "surprise" condition.

  **Uncertainty Note**
  I am least confident about the prohibition of surprise quizzes in sections with accommodations. My recommendation prioritizes equity over pedagogical variety, assuming that 24-hour notice for all students will not significantly degrade learning outcomes. However, if evidence suggests that universal notice leads to severe cramming and retention issues compared to surprise checks, I would flip to supporting the "Announced Window" compromise (e.g., "Quiz sometime Thursday or Friday") provided the teacher can guarantee accommodated students do not泄露 (leak) the specific date to peers.
