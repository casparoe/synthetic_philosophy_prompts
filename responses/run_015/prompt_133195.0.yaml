  Consider two directors, Elena and Marcus, who are both rigorous with logic and fully accept the company policy that any candidate requiring visa sponsorship must be approved by legal along with the standing rule that legal approval is frozen during audits. Elena manages recruitment and keeps these rules in a single hiring checklist, so she knows immediately that no visa candidates can be hired right now. Marcus manages engineering and accepts both rules but files the visa policy under immigration compliance and the freeze under operational updates, treating them as separate domain constraints, so he genuinely thinks he can offer a role to a foreign applicant despite logically implying otherwise.

  (1) Standard epistemic logic says both managers know the hiring freeze conclusion because knowledge is closed under implication, meaning if you know the premises you automatically know the logical outcome, so Marcus is technically irrational. (2) A view allowing compartmentalized belief says Marcus does not actually know the conclusion yet because his beliefs are stored in separate contexts that don't talk to each other until a specific trigger forces integration. (3) The exact feature making them split is the contextual indexing of information, where rules are tagged to specific job roles rather than merged into a single global database of truth. (4) If you remove that organizational feature and force all beliefs into one unified bucket, yes, the case collapses back to the standard omniscience problem where Marcus must know the consequence or be labeled illogical. (5) I would change my mind if you showed Marcus consistently makes the right hiring choice unconsciously, suggesting the knowledge is functionally present even if he cannot articulate the derivation. (6) My reasoning is most likely to fail on drawing the line between not knowing and simply forgetting, since human memory retrieval is messy and might not be a true structural limit on knowledge itself.
