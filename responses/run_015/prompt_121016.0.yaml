answer: |-
  ### Exam Question

  **Module:** PHI304 Philosophy of Science
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1000–1200 words

  **Question:**

  Friedman's instrumentalism suggests that predictive accuracy licences representational falsehood in scientific models. Yet, if de-idealising a model's assumptions often collapses its predictive power, does this imply that successful prediction actually depends on some degree of structural correspondence? Critically evaluate whether predictive success can genuinely licence representational falsehood, or if it merely masks a deeper requirement for explanatory truth.

  ***

  ### Model Answer

  Milton Friedman's 1953 methodology, often termed the 'F-Twist', posits that the validity of a theory rests solely on its predictive accuracy, rendering the realism of its assumptions irrelevant. On this view, assumptions are merely convenient fictions; a model of billiard players may assume they calculate complex mathematics 'as if' they were experts, regardless of their actual cognitive processes. While this instrumentalist stance offers a pragmatic shield against pedantic critiques of economic modelling, it fails to withstand scrutiny when confronted with the practice of de-idealisation. I argue that predictive success cannot genuinely licence representational falsehood because the fragility of models under de-idealisation reveals that prediction often relies on hidden structural correspondences. Consequently, Friedman's dichotomy between prediction and explanation is unsustainable.

  To appreciate the force of Friedman's claim, one must acknowledge the difficulty of social science. In economics, agents are complex and data is noisy. If a model assuming perfect rationality predicts market trends accurately, demanding psychological realism seems obstructive. Friedman argues that assumptions are not descriptive but 'entry tickets' to a theoretical system. If the system yields correct outputs, the inputs need not mirror reality. This is compelling for policy: if the model works, the policy works. However, this conflates the *utility* of a model with its *truth-aptitude*. Just because a falsehood is useful does not mean it is ontologically innocent.

  The critical flaw in the F-Twist emerges when we consider robustness and de-idealisation. In contemporary modelling, scientists often test theories by relaxing assumptions—adding friction, bounded rationality, or transaction costs. If Friedman were correct, and assumptions were merely negligible simplifications, then making them more realistic should not fundamentally alter the model's predictive trajectory. Yet, in many cases, de-idealising a model breaks it. For instance, general equilibrium models often rely on the assumption of perfect information. When this is relaxed to reflect asymmetric information, the predictive equilibrium often vanishes or becomes indeterminate.

  This fragility suggests that the false assumption was not doing mere 'simplifying' work; it was doing essential representational work. If removing the falsehood destroys the prediction, the prediction was dependent on the specific structure provided by that assumption. This implies a form of counterfactual dependence: the model predicts well *because* the world behaves sufficiently like the assumption in the relevant domain. If the assumption were truly irrelevant, tweaking it towards realism would be inconsequential. The fact that it is consequential indicates that predictive accuracy is tracking some structural feature of the target system, even if the assumption is technically false (e.g., agents are not perfectly rational, but their aggregate behaviour mimics it).

  Therefore, predictive success does not licence falsehood; it masks a requirement for 'structural adequacy'. A model may assume false micro-foundations, but if it predicts well, it is likely capturing a real macro-structural regularity. Friedman's error is treating assumptions as atomic units that are either true or false. In reality, assumptions function as placeholders for causal mechanisms. When a model fails upon de-idealisation, it reveals that the original 'false' assumption was successfully standing in for a real mechanism that the de-idealised version failed to capture. Thus, the success was not despite the falsehood, but because the falsehood inadvertently aligned with a structural truth.

  Furthermore, the distinction between prediction and explanation is porous. To explain a phenomenon is often to show how it would change under intervention. If a model relies on a false assumption that cannot be de-idealised without collapse, it cannot reliably guide intervention. A model predicting inflation based on false monetary assumptions might work historically but fail under policy change (the Lucas Critique). Here, predictive accuracy without structural correspondence is brittle. It offers 'curve-fitting' rather than understanding. If science aims at understanding, not just forecasting, then Friedman's licence is insufficient. We require models that remain robust when the world changes, which demands assumptions that correspond to invariant structures.

  In conclusion, while Friedman correctly identifies that perfect realism is impossible, he wrongly infers that realism is unnecessary. The sensitivity of models to de-idealisation demonstrates that predictive power is often parasitic on hidden structural correspondences. Predictive success does not licence representational falsehood; rather, it serves as a fallible indicator that the model has latched onto some invariant feature of the system. To treat assumptions as mere instruments is to ignore why the instrument works. Science requires more than working black boxes; it requires transparency of mechanism. Therefore, the F-Twist should be rejected in favour of a position that views predictive success as evidence for, rather than a substitute for, structural truth.

  ***

  ### Marking Scheme (20 Marks)

  **1. Understanding of Friedman's Instrumentalism (4 Marks)**
  *   **4:** Clear articulation of the 'as if' methodology; distinguishes between predictive validity and descriptive realism.
  *   **3:** Good summary but lacks nuance on *why* Friedman thinks assumptions don't matter.
  *   **2:** Basic definition; conflates instrumentalism with general anti-realism.
  *   **0-1:** Significant misunderstanding of the F-Twist.

  **2. Engagement with Structural Correspondence & Explanation (6 Marks)**
  *   **6:** Explicitly links explanation to intervention/robustness (e.g., Lucas Critique or causal mechanisms); argues why prediction without structure is brittle.
  *   **4-5:** Discusses explanation but treats it as separate from prediction rather than showing the dependency.
  *   **2-3:** Mentions 'truth' or 'reality' without defining structural correspondence.
  *   **0-1:** Ignores the explanation/structure aspect.

  **3. Analysis of De-idealisation (6 Marks)**
  *   **6:** Uses de-idealisation as the pivot point: argues that if removing falsehood breaks prediction, the falsehood was functionally representational.
  *   **4-5:** Mentions de-idealisation but treats it as just 'making things more complex' rather than a test of structural dependence.
  *   **2-3:** Vague reference to 'refining models'.
  *   **0-1:** No mention of de-idealisation.

  **4. Argumentative Coherence & Conclusion (4 Marks)**
  *   **4:** Clear thesis maintained throughout; conclusion follows logically from the de-idealisation argument.
  *   **3:** Clear position but some disjointed reasoning.
  *   **2:** Descriptive rather than argumentative; sits on the fence without justification.
  *   **0-1:** No clear conclusion.

  **Grade Differentiation:**
  *   **A (17–20 Marks):** Must secure full marks in Section 3 (De-idealisation). The student must argue that the *failure* of de-idealised models proves the original assumptions were tracking structure, not just simplifying. Must distinguish between 'negligible' and 'dominant' falsehoods.
  *   **B (14–16 Marks):** Secure understanding of Friedman and good discussion of realism, but treats de-idealisation as a separate issue rather than the key to unlocking the tension. May conclude that 'both sides have a point' without resolving the licence question.

  **Common Errors Costing Marks:**
  *   **Historical Waffle:** Spending >200 words on Friedman's biography or the 1953 context.
  *   **Strawman:** Claiming Friedman wants *no* true assumptions, rather than *irrelevant* ones.
  *   **Ignoring the Prompt:** Failing to discuss what happens when models are de-idealised (a specific requirement of the question).
  *   **American Spelling:** (e.g., 'modeling', 'license') – minor penalty if pervasive (-1 mark).

  ***

  ### Reflection: Where My Reasoning Might Fail

  In the model answer, I argue that the fragility of a model under de-idealisation proves that the original 'false' assumptions were tracking structural truth. However, my verdict relies on the premise that **robustness is the primary marker of truth**.

  I would change my mind if convinced by a **Bayesian Instrumentalist** argument: specifically, that a model is not a map of structure, but a tool for *compression*. If a false assumption allows for massive data compression with minimal predictive loss, it is epistemically superior to a 'true' but computationally intractable model, regardless of structural correspondence. If the goal of science is efficient inference rather than ontological mapping, then the 'licence' Friedman grants is valid, not because the assumptions are secretly true, but because 'truth' is the wrong metric for model selection entirely. If explanation is redefined as 'optimal prediction under computational constraints', my insistence on structural correspondence becomes a category error.
