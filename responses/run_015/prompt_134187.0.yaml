      *   (2) Justification is Recipient-Relative: Reasons must be *uptake-accessible* (UA) for C. UA means C could accept it based on *existing* commitments/evidence.
      *   (3) Religious Reasons are UA-inaccessible: They depend on premises others reasonably reject.
      *   (4) Conclusion so far: Religious reasons can't justify coercion. (Proviso doesn't help because structure matters, not order).
      *   (5) Symmetry: Secular comprehensive doctrines (utilitarianism, perfectionism) are also UA-inaccessible.
      *   (6) General Restraint: All comprehensive reasons excluded. Only thin political rationale works.
      *   (7) Derivative Coercion: *All* state acts (including omissions/baselines) are coercion. Restraint applies everywhere.
      *   (8) Self-Application: PRL itself is a contested doctrine. It can't justify itself to those who reject it.
      *   (9) Failed Escape: Second-order module strategy fails due to circularity or empirical exclusion.
      *   (10) Universality/Translation Tax: Too burdensome/unfair. Asymmetric burden on religious.
      *   (11) Historical Ratchet: Past justified laws (Civil Rights) relied on religious reasons for traction. If (4) holds, they were illegitimate.
      *   (12) Conclusion: The view is self-excluding, arbitrary, unlivable, or historically revisionist. Therefore (1)-(3) must be false.

  3.  **Identify the Core Tension:**
