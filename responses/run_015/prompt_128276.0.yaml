      *   *Substantive Issue:* The debate often hinges on the *function* of assertion. Is it to transmit knowledge? To coordinate action? To express belief? If the function varies, the norm varies.
      *   *The "Single Question" Problem:* The user is right that participants often talk past each other. One says "You shouldn't assert that" (moral/practical), the other says "That's not a proper assertion" (constitutive).
