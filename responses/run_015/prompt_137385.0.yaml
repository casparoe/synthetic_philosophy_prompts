prompt: |-
  I write literary fiction — three novels, and I teach an advanced workshop most autumns — and for the last year I have been reading, slowly and with a dictionary, about how economics gave up on measuring happiness and replaced it with something supposedly thinner and harder: the doctrine that an agent's wants are nothing over and above what her choices disclose, that the numbers assigned to those wants have no unit and no common scale across persons, and that any claim about the inner magnitude or the felt texture of a desire is, strictly speaking, idle. My formal training is in no relevant field; I lasted one term of a philosophy-and-economics survey before switching to English, and while I can use words like ordinal, budget set, and maximisation in a sentence I could not define them under pressure. So I do not want an explanation of the debate so much as a translation of it. The vocabulary I actually think in is the vocabulary of craft: show-don't-tell, subtext, in-character and out-of-character, objective and obstacle, the arc, voice, the scenic menu of live options a scene puts on the table, and a private document I keep for each novel called the want ledger, in which I write down what I take each character to want and revise it as the draft goes on.

  Here is why I am asking. I am finishing a novel whose narrator, Margot, spends a decade turning down a promotion she has plainly been positioned for, saying each time that she never wanted it, and then, in the last third, litigates furiously for a version of the same thing under another name. My readers and my editor agree on the facts of her behaviour and disagree about everything else. Some say she'd never do that, which I take to mean not that the action is improbable but that it proceeds from nothing. Others say the litigation is the truest thing about her and the refusals were the evasion. I have found myself using the word real about her want in a way I cannot cash out, and I have noticed something else: whether Margot reaches for the thing in a given scene depends on which other options I have left on the page. Remove the alternative and she does not move at all; put a worse alternative beside it and she suddenly wants it badly. In workshop I call this the cut-option test, and I use it to decide whether a want is load-bearing or an artefact of the scene, but I have started to suspect that the test is doing the same work as a technical apparatus I cannot read. I also do, on every page, something I am told is impossible: I weigh the intensity of Margot's desire against her brother's and decide whose loss the chapter is really about, and I do it not by measuring anything but by allocating sentences.

  So please do this. Restate the revealed-preference picture of agency, and the quarrel about what the term utility means once it has been prised loose from happiness or felt satisfaction, as faithfully as you can in my vocabulary — tell me what a budget set is in terms of a scene, what the consistency conditions on choice amount to as constraints on character, what it would mean to say that a utility number is only an indexing of behaviour rather than a quantity of anything. Then give me the residue report. Which of their claims translate cleanly into craft terms, which translate only if you quietly import an assumption that is mine or theirs rather than common to both, and which cannot be expressed in my vocabulary at all? I am especially interested in three places where I expect the translation to fail: my conviction that as her maker I know what Margot wants prior to and independent of any choice of hers, in a way no observer could; the phenomenon in which a want survives its own renunciation, so that the refusal is evidence for the desire rather than against it; and my practice of comparing the force of one character's want with another's by compositional means. For each, say whether the residue indicts my vocabulary or theirs — whether it shows that the craft terms are doing real work economics has no room for, or that what I call knowledge of a character is less clear than it feels from inside the writing of it. And then tell me, practically, what I should do with Margot.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A literary fiction writer (3 novels, teaches advanced workshop).
      *   **Task:** Translate economic/philosophical concepts (revealed preference, utility, ordinality, interpersonal comparison) into the vocabulary of literary craft (show-don't-tell, subtext, character arc, want ledger, etc.).
      *   **Specific Context:** Finishing a novel about a narrator (Margot) who refuses a promotion for a decade, then litigates for a version of it later. Readers disagree on whether this is consistent/real.
      *   **Key Concepts to Translate:**
          *   Revealed Preference (wants = choices).
          *   Utility (indexing behavior vs. felt satisfaction).
          *   Budget Set (scene options).
          *   Consistency Conditions (character constraints).
      *   **The "Residue Report":** Identify where the translation fails.
          *   Authorial Omniscience (knowing wants prior to choice).
          *   Renunciation as Evidence (refusal proves desire).
          *   Interpersonal Comparison (weighing Margot's desire vs. Brother's via sentence allocation).
      *   **Verdict:** Does the residue indict the craft vocabulary or the economic vocabulary?
      *   **Practical Advice:** What to do with Margot?

  2.  **Deconstruct the Economic Concepts (Mental Draft):**
      *   *Revealed Preference:* You don't know what someone wants until they choose. If they choose A over B, they prefer A. Period. No access to internal feelings.
      *   *Utility:* Not happiness. Just a ranking number. If U(A) > U(B), they choose A. It's ordinal, not cardinal. You can't say "twice as happy."
      *   *Budget Set:* The menu of available choices constrained by resources (money, time, rules).
      *   *Interpersonal Comparison:* Impossible in standard welfare economics. I can't say your pain is worse than mine.
      *   *Consistency:* If you choose A over B today, you shouldn't choose B over A tomorrow unless the menu changed. (Transitivity, WARP).

  3.  **Translate to Craft Vocabulary:**
      *   *Revealed Preference* $\rightarrow$ *Action as Definition.* "Show, don't tell" taken to the extreme. The character *is* what they do. Internal monologue is irrelevant data.
      *   *Utility* $\rightarrow$ *Dramatic Weight.* Not "happiness," but "narrative priority." A number assigned to rank options, not measure joy.
      *   *Budget Set* $\rightarrow$ *The Scenic Menu.* The live options on the page. If an option isn't written, it doesn't exist for the character.
      *   *Consistency* $\rightarrow$ *Character Coherence/ARC.* If a character acts out of established pattern without a shift in the "menu," they feel "false" or "out of character."
      *   *Interpersonal Comparison* $\rightarrow$ *Compositional Allocation.* Giving more page space/sentences to one desire implies greater narrative weight.

  4.  **Address the "Residue Report" (The Failure Points):**
      *   *1. Authorial Omniscience (The Want Ledger):* Economics says wants are *only* revealed. The author says "I know what she wants before she chooses."
          *   *Conflict:* Economics denies access to internal states. Craft demands it (subtext, motivation).
          *   *Verdict:* Economics is too thin for fiction. Fiction requires the "idle" inner texture.
      *   *2. Renunciation as Evidence:* Margot refuses the promotion. Economics says: She doesn't want it. Craft says: The refusal *is* the symptom of the want (denial, fear, subtext).
          *   *Conflict:* Revealed preference treats refusal as negation. Craft treats refusal as potential affirmation (via subtext).
          *   *Verdict:* Craft vocabulary handles complexity better here. Economics flattens irony.
      *   *3. Interpersonal Comparison:* Economics says you can't compare Utility between people. Writer does it by "allocating sentences."
          *   *Conflict:* Economics calls this meaningless. Craft calls it "theme" or "focus."
          *   *Verdict:* Craft creates a shared scale (the reader's attention) that economics forbids.

  5.  **Address the Margot Problem (Practical Advice):**
      *   The readers are fighting because the "Scenic Menu" (Budget Set) might be obscuring the "Want Ledger."
      *   If she refuses 10 times, Revealed Preference says "She doesn't want it."
      *   If she litigates later, Revealed Preference says "She wants it now."
      *   The gap is the *change in the menu* or the *revelation of the true want*.
      *   Advice: Make the "Budget Set" shift explicit. Why is the litigation different? Is it the *same* want under a new name? The text must show the *constraint* changed, not just the choice.
      *   Use the "cut-option test" but acknowledge its economic limit: removing options forces a reveal, but doesn't explain the *history* of the want.
      *   Lean into the "Residue." The author's knowledge of the "inner magnitude" is the novel's value, not a bug.

  6.  **Drafting the Response (Iterative refinement for tone):**
      *   *Tone:* Respectful, intellectual, mirroring the user's precise, craft-focused language. No condescension. Acknowledge their expertise.
      *   *Structure:*
          1.  Translation of Economic Terms to Craft Terms.
          2.  The Residue Report (The three failure points).
          3.  Verdict on Vocabulary (Craft vs. Economics).
          4.  Practical Advice for Margot.
      *   *Key Metaphor:* The "Want Ledger" vs. The "Choice Archive."
      *   *Refining the "Utility" translation:* It's not "happiness," it's "ranking." In craft, it's "dramatic necessity."
      *   *Refining the "Budget Set":* It's the "scene's live options."
      *   *Refining the "Interpersonal":* It's "narrative focus."

  7.  **Self-Correction/Check during drafting:**
      *   *Did I answer the specific question about the residue indicting which vocabulary?* Yes, need to be explicit.
      *   *Did I address the "cut-option test"?* Yes, link it to the Budget Set.
      *   *Did I address the "sentence allocation"?* Yes, link it to Interpersonal Utility.
      *   *Is the advice practical?* Needs to be about revision, not just theory. Focus on the *name change* and the *constraints*.

  8.  **Final Polish:** Ensure the distinction between *ordinal* (ranking) and *cardinal* (measuring) is clear in craft terms. (Ranking scenes vs. measuring joy). Ensure the "revealed preference" trap is clear (action defines desire).

  *(Self-Correction on the "Verdict"):* The prompt asks: "whether the residue indicts my vocabulary or theirs." I need to take a stand. The residue suggests Economics is insufficient for *fiction*, but Fiction's claim to "truth" about desire is subjective. I should argue that Economics describes *behavior* (reader view), while Craft describes *agency* (author view). The conflict is the novel's engine.

  9.  **Finalizing the Margot Advice:** The problem isn't consistency of *choice*, it's consistency of *constraint*. If the promotion was "Poison" before and "Justice" now, the object changed. The translation must show the *re-labeling*.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is the translation you asked for, followed by the residue report and a recommendation for Margot.

  ### I. The Translation: Economics as Craft

  **Revealed Preference $\rightarrow$ Action as Definition**
  In your workshop, you likely warn students against writing "She felt sad." You demand the tear, the silence, the broken cup. Revealed preference is this rule radicalized into ontology. It claims there is no "sadness" behind the tear. The tear *is* the sadness.
  *   **The Translation:** A character's want is not the entry in your *Want Ledger*. It is the final draft of their action. If Margot says "I don't want the promotion" but takes the lunch meeting that secures it, the text (like the economist) ignores her dialogue and records the preference for the promotion. Her interiority is subtext; her choice is text. In this view, you do not know what Margot wants until she turns the page.

  **The Budget Set $\rightarrow$ The Scenic Menu**
  In economics, a budget set is the collection of all affordable bundles of goods given prices and income.
  *   **The Translation:** This is your "scenic menu of live options." It is not what Margot *could* do in the abstract world, but what you, the author, have rendered available on the page. If you do not write the option, it is not in the budget set. If Margot chooses A, it is only because B and C were either unavailable (priced out by consequence) or unrendered (invisible to the reader). Her "freedom" is constrained by your omission.

  **Utility (Ordinal) $\rightarrow$ Dramatic Ranking**
  Economists prised utility loose from happiness. It is not a measure of joy (cardinal); it is a ranking of consistency (ordinal). $U(A) > U(B)$ simply means "A is chosen over B." It has no unit. You cannot say Margot wants the promotion "twice as much" as she wants her weekend.
  *   **The Translation:** This is the hierarchy of dramatic necessity. It is not about how much Margot *enjoys* the choice, but which choice wins the scene. A utility function is a map of her consistency. If she chooses Safety over Ambition in Chapter 1, and Ambition over Safety in Chapter 2, her utility function has shifted. In craft terms, her *arc* has moved. But strictly speaking, utility is just the scorecard of those moves, not the feeling of them.

  **Consistency Conditions (WARP/Transitivity) $\rightarrow$ Character Coherence**
  Economics assumes agents are consistent. If you prefer A to B, you shouldn't prefer B to A when both are available, unless the context has changed.
  *   **The Translation:** This is "in-character" vs. "out-of-character." If Margot refuses the promotion (Choice A) when the alternative is Status Quo (Choice B), she establishes a preference: Status Quo > Promotion. If later she chooses Promotion > Status Quo, she violates transitivity *unless* you have changed the Budget Set (e.g., the Promotion is now renamed, or the Status Quo has become toxic). If the menu is the same and she chooses differently, the reader cries "false." If the menu changes, they cry "arc."

  **Interpersonal Comparison of Utility $\rightarrow$ Compositional Allocation**
  Standard economics says you cannot compare my utility to yours. There is no common scale.
  *   **The Translation:** You do this every page by "allocating sentences." When you give Margot three paragraphs of interiority regarding her desire and her brother one paragraph of dialogue regarding his, you are asserting a common scale of narrative weight. You are claiming her loss *matters more* to the story than his. This is the "theme" or "focus." Economics forbids this; craft demands it.

  ***

  ### II. The Residue Report

  Here is where the translation breaks down. These are the points where the economic model cannot map onto the craft model without leaving a remainder.

  **1. The Authorial Ledger (Omniscience vs. Revelation)**
  *   **The Claim:** You believe you know what Margot wants prior to and independent of her choice (the *Want Ledger*). Economics claims the want is nothing over and above the choice.
  *   **The Residue:** Economics treats the *Want Ledger* as fiction (literally). To an economist, your private document is a record of your *hopes* for the character, not data about the character. The character *is* the public text.
  *   **The Verdict:** This residue indicts **Economics**. In fiction, the subtext *is* the text. The "inner magnitude" you track is the engine of the plot. If you accept the economic view, you must delete the *Want Ledger* and write only from the outside, like a behaviorist camera. But then you lose the novel. The craft vocabulary captures the *cause* of the action; economics captures only the *effect*. Your conviction is not delusion; it is the definition of the genre.

  **2. Renunciation as Evidence (The Paradox of Refusal)**
  *   **The Claim:** Margot refuses the promotion. Economics says: Preference = No Promotion. You say: The refusal is evidence of a deeper, perhaps terrified, desire for the Promotion.
  *   **The Residue:** Revealed preference cannot process irony. It cannot process "I want this so much I am afraid to take it." It treats the refusal as a terminal data point. Craft treats the refusal as a complication of the want.
  *   **The Verdict:** This residue indicts **Economics**. The economic model is too thin to hold ambivalence. In craft, a "No" can be a screaming "Yes." This is the domain of subtext. Economics assumes the agent is transparent to themselves; literature assumes the agent is often opaque to themselves. Your vocabulary handles the "true want" vs. the "stated want"; economics collapses them into the "chosen want."

  **3. Interpersonal Weighing (Sentence Allocation)**
  *   **The Claim:** You weigh Margot's desire against her brother's by allocating sentences. Economics says this is impossible (no common unit).
  *   **The Residue:** Economics is right that there is no *objective* unit of desire. But you are not measuring desire; you are measuring *attention*. By giving Margot more sentences, you are not proving her pain is objectively greater; you are instructing the reader to *value* it more.
  *   **The Verdict:** This residue indicts **Neither**. It reveals a category error. Economics tries to measure *welfare* (a state of being). You are measuring *narrative priority* (a structural decision). You are not claiming Margot suffers more in reality; you are claiming her suffering is the *subject* of the book. Your vocabulary works for the *book*; economics works for the *world*. Do not confuse the map for the territory.

  ***

  ### III. Practical Advice for Margot

  Your readers are fighting because Margot's behavior violates **Transitivity** (Consistency) without a clear shift in the **Budget Set** (The Menu).

  In economic terms, Margot is "irrational" because she chose Status Quo > Promotion for ten years, then Promotion > Status Quo later.
  *   **Reader Group A** ("She'd never do that") sees this as a violation of Character Coherence. They think you broke the model.
  *   **Reader Group B** ("The litigation is the truest thing") sees the first ten years as "noise" (evasion) and the litigation as the "signal" (reveal).

  **The Problem:**
  You are relying on the *Want Ledger* (your private knowledge) to bridge the gap, but the reader only has the *Choice Archive* (the text). You know the want survived the renunciation. They only see the renunciation.

  **The Fix:**
  You must change the **Budget Set**, not just the choice.
  If Margot litigates for "a version of the same thing under another name," you must make the *renaming* a change in the economic constraints of the scene.

  1.  **Make the Constraint Explicit:** In the early refusals, ensure the "Promotion" comes with a specific cost (a poison pill) that makes the Utility negative. (e.g., It requires betraying a value).
  2.  **Make the Litigation Different:** In the final third, the "version under another name" must remove the poison pill or change the currency. Perhaps she isn't litigating for the *power* (which she didn't want), but for the *recognition* (which she does want).
  3.  **Use the Cut-Option Test:** You suspected this test mirrors technical apparatus. It does. It isolates the variable.
      *   *Test:* In the early scenes, if you remove the "moral cost" of the promotion, does she take it? If yes, then her want was always for the promotion, but the *price* was too high.
      *   *Revision:* If the price was too high, show the price more clearly in the early drafts. If the price is invisible, her refusal looks like a lack of want. If the price is visible, her refusal looks like a budget constraint.

  **Final Judgment:**
  Do not abandon the *Want Ledger*. It is the only place where the "inner magnitude" lives, which is the only thing that makes Margot human rather than a data point. However, you must externalize the Ledger's revisions.

  The economics of the novel must match the economics of the mind. If she wants the thing but refuses it, the text must show the **tax** she is paying to refuse it. The "loss" you allocate via sentences must be the cost of the refusal, not just the cost of the desire.

  Let the readers argue about whether she is consistent. That argument is the book. But ensure the *menu* changed enough to justify the new choice. If the menu is the same, you must show that *she* is different (a shift in the Utility Function), and that requires a scene of conversion, not just a scene of action.
