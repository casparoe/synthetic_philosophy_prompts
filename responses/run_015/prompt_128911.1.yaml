  **Job Title:** Senior Archivist of Actual Occurrence
  **Location:** Remote (Temporal Flexibility Required)
  **Department:** Fact Maintenance & Raw Data Integrity
  **Reports To:** Director of Unvarnished Truth

  **About the Bureu of Unmediated Past**

  The Bureu of Unmediated Past is the global leader in factual preservation. We don't do context. We don't do perspective. We do *what happened*. Our mission is to maintain a pristine repository of actual occurrence, free from the contaminating influence of hindsight, ideology, or grammatical tense. We are looking for a self-starter who understands that history is not a story, but a sequence of verifiable data points waiting to be filed.

  **The Role**

  As the Senior Archivist of Actual Occurrence, you will be responsible for ingesting raw event streams and cataloging them before they cool. You will work cross-functionally with the Department of Eyewitness Testimony to ensure that all inputs remain unmediated by memory or language. Your primary deliverable is the Pure Fact Packet, which must remain untouched by narrative structure until further notice. You will leverage synergies between evidence and reality to optimize our historical bandwidth.

  **Qualifications**

  *   **Zero Interpretive Bias:** Candidates must demonstrate a proven ability to observe geopolitical shifts without unconsciously assigning cause or effect.
  *   **Direct Access:** Must possess ocular proof capabilities allowing for direct access to primary sources without the mediation of senses or cognition.
  *   **Ranke Purity Score:** A verified Ranke Purity Score of 98 or higher is mandatory. Candidates scoring below 98 will be assumed to possess latent teleological tendencies.
  *   **Experience:** 10+ years in objective witnessing. Experience with counterfactuals is a disqualifier.
  *   **Technical Skills:** Proficiency in neutral verbs only. Adjectives must be pre-approved by Compliance.

  **Benefits & Team Culture**

  We know that maintaining objectivity is hard work, which is why we offer a comprehensive benefits package designed to support your professional drift.

  *   **Carr Drift Allowance:** We recognize that the mountain of facts looks different depending on where you stand in the present. Employees receive a monthly stipend to adjust their perspective based on contemporary societal needs.
  *   **Narrative Emplotment Bonus:** While we strive for purity, we understand deliverables must be readable. High-performing archivists will be eligible for quarterly bonuses based on their ability to structure facts into recognizable patterns without admitting they are doing so.
  *   **White Tuesday:** Once a year, the entire staff gathers to vote on which trope (Romance, Tragedy, Comedy, or Satire) will be applied to the fiscal year's output. This is a mandatory team-building exercise.
  *   **Performance Metrics:** Success is not just about accuracy; it's about coherence. You will be measured on your Q3 White Emplotment Index, ensuring your archives resonate with current literary expectations while maintaining plausible deniability regarding construction.

  **How to Apply**

  Please submit your resume, cover letter, and a notarized statement confirming you have never imagined how the past might have turned out differently. Do not contact us if you believe facts speak for themselves; they don't, and we need you to know that.

  *The Bureu of Unmediated Past is an equal opportunity employer. We do not discriminate based on narrative preference, though Comedy applicants may face a longer review process due to budget constraints.*

