prompt: |-
  Hey — you're a decision theorist who has had to teach rational choice to skeptical, numerate adults before (think quants, actuaries, ML engineers), so I want a *teaching plan*, not an explanation of the independence axiom itself. I've got a 75-minute slot in my team's internal training week and the topic I got saddled with is the Allais paradox / independence axiom. The audience is comfortable with expected value and probability, a few of them have heard of loss aversion, none of them have seen von Neumann–Morgenstern expected utility theory as a package, and at least two will arrive convinced that "people are irrational, we already know this, next slide."

  What I need from you: think it through carefully, brainstorm two or three possible arcs before committing to one, and give me the dependencies — what has to be in place before the axiom can even be stated so it doesn't sound like a tautology or like a claim that you should maximize expected *money*. Then the carrying example: design the actual pair of choice problems I should put on the board, and tell me what such an example has to have and what it has to lack. My guesses: the two problems must share a common consequence so the comparison is a чист swap, the stakes have to be identical across all four options so that risk aversion can't explain the switch, and the outcomes have to be described richly enough that the chooser's reasons are exhausted by the description — but not so richly that the money means something different in different cells ("this is the deposit on a house" would poison the example, I think). Correct me if I'm wrong about any of that.

  Then the misconception map, with the point in the sequence where I should defuse each one. Here's what I predict, tell me what I'm missing: (a) "the axiom says be risk-neutral"; (b) "this is just about tiny probabilities / people overweight certainty"; (c) "the two problems differ, so there's no inconsistency" — the students will hunt for a difference that justifies the flip; (d) "if most people violate it, the axiom is false"; (e) someone will think the axiom is a prediction about behavior rather than a coherence constraint.

  Two things I'm stuck on and want you to settle. First, my hunch for the way in is the sequential version: let the shared branch resolve *before* the chooser picks, so violating independence means you'd reverse yourself after learning which branch you're in. Does that argument quietly assume dynamic consistency or consequentialism as a separate commitment, and should I say that out loud or shut up at this level? Second, I want to add a wrinkle: rerun the same example where the uncertainty comes from an already-fixed but unknown fact (a sealed envelope, a lab result that's back but unread) instead of a lottery wheel. I suspect the violation gets louder, but I can't tell whether that's the same phenomenon turned up or a genuinely different one (ambiguity/ignorance vs. chance) that I should keep out of a 75-minute session.

  Finish with: one question I can ask at the end that tells me whether they got the axiom rather than memorized the shape of the paradox — ideally a non-monetary case where they have to spot whether independence even applies — and a short list of what I should openly refuse to explain in 75 minutes (the representation theorem, prospect theory's weighting function, etc.). No readings or bibliography, I won't have time for any of that anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** Decision Theorist teaching skeptical, numerate adults (quants, actuaries, ML engineers).
      *   **Task:** Create a 75-minute teaching plan for the Allais Paradox / Independence Axiom.
      *   **Constraints:** Not just an explanation of the axiom. Needs brainstorming of arcs, dependencies, carrying example design, misconception map, resolution of two specific sticking points (sequential version & fixed but unknown uncertainty), a final check question, and a "do not cover" list.
      *   **Audience Profile:** Comfortable with EV/prob, some know loss aversion, none know vNM EU theory as a package, some cynical ("people are irrational, next slide").
      *   **Time:** 75 minutes.

  2.  **Deconstruct the Challenge:**
      *   *The Cynicism:* The "people are irrational" crowd needs to be addressed early. The goal isn't to prove people are rational, but to show *why* we care about consistency axioms in modeling.
      *   *The Math:* They know EV. The leap to EU (Utility) is the hard part. The Independence Axiom often looks like "ignore common consequences," which feels wrong intuitively until framed as a coherence constraint.
      *   *The Example:* Needs to be crisp. Classic Allais (1A/1B, 2A/2B) is standard but needs careful presentation to avoid "risk aversion" confusion.
      *   *The Sticking Points:*
          1.  *Sequential/Dynamic:* Does showing the common branch resolving first assume consequentialism? Yes. Should I admit it? Yes, but briefly.
          2.  *Fixed but Unknown (Ambiguity):* Is this the same phenomenon? Technically, Allais is risk (known probs), Ellsberg is ambiguity (unknown probs). Mixing them might confuse the specific point about the Independence Axiom vs. Sure Thing Principle. Better to keep it pure Risk for Independence, maybe mention Ambiguity as a "next step" limitation.

  3.  **Brainstorming Arcs:**
      *   *Arc 1: The "Money Pump" Approach.* Focus on Dutch Books. If you violate independence, I can take your money.
          *   *Pros:* Appeals to quants/finance types. Concrete consequence.
          *   *Cons:* Can get bogged down in mechanics. Might feel like a trick rather than a principle.
      *   *Arc 2: The "Model Integrity" Approach.* Focus on vNM as the foundation of RL/ML/Optimization. If your objective function violates this, your optimizer breaks.
          *   *Pros:* Relevant to ML engineers. Frames it as engineering constraints.
          *   *Cons:* A bit abstract initially.
      *   *Arc 3: The "Consistency vs. Description" Approach.* Focus on framing. Show that the preference reversal implies the *same* state of the world is being valued differently solely based on how it's bundled.
          *   *Pros:* Hits the core logical contradiction.
          *   *Cons:* Requires careful setup to avoid "but the context matters" arguments.

      *   *Selection:* I'll blend Arc 1 and Arc 3. Start with the Money Pump (grab attention/cynics), move to the Logical Consistency (the core theory), and end with the Modeling Implication (why we care).

  4.  **Drafting the Plan - Section by Section:**

      *   **Dependencies:** What must be established before stating the axiom?
          *   Outcomes $\neq$ Money. Need to establish "Prizes/States" vs. "Value."
          *   Preferences are over *lotteries*, not just outcomes.
          *   The "Common Consequence" logic needs to be visualized (trees or matrices).
          *   Crucial: Distinguish *Descriptive* (how people act) vs. *Normative/Prescriptive* (how a consistent agent *should* act).

      *   **The Carrying Example:**
          *   Classic Allais is best, but needs tweaking to avoid "risk aversion" claims.
          *   Problem 1: Certain \$1M vs. Gamble (10% \$5M, 89% \$1M, 1% \$0).
          *   Problem 2: Gamble (11% \$1M, 89% \$0) vs. Gamble (10% \$5M, 90% \$0).
          *   *Correction on User's Guess:* The user thinks stakes must be identical across all four options. Actually, the *common consequence* (the 89% branch) is the key. The stakes in the *varying* part must be comparable.
          *   *Refinement:* Use \$1M, \$5M, \$0. It's standard for a reason.
          *   *Requirement:* Outcomes must be final wealth states (or at least treated as such) to avoid "house deposit" framing effects.

      *   **Misconception Map:**
          *   (a) Risk Neutrality: Address when defining Utility vs. Money.
          *   (b) Tiny Probs/Certainty: Address during the example analysis (the "Certainty Effect").
          *   (c) "Problems Differ": Address with the Sequential/Tree visualization.
          *   (d) "Most people violate = Axiom False": Address early (Normative vs. Descriptive).
          *   (e) Prediction vs. Constraint: Address in the intro.

      *   **Sticking Point 1: Sequential/Dynamic:**
          *   Does it assume consequentialism? Yes. It assumes you only care about where you end up, not the path.
          *   Should I say it? Yes. Acknowledge it as a "commitment we make to build the model." If they reject consequentialism, vNM isn't for them. Don't hide it.

      *   **Sticking Point 2: Fixed but Unknown (Ambiguity):**
          *   This is Ellsberg, not Allais. Allais is about known probabilities (Risk).
          *   Including it confuses the Independence Axiom (vNM) with the Sure Thing Principle (Savage).
          *   *Decision:* Leave it out of the core 75 mins. Mention it as a "boundary condition" in the last 5 mins if time permits, but don't run the example. It muddies the water on *probability* vs. *preference*.

      *   **Final Question:**
          *   Needs to be non-monetary.
          *   Needs to test if they see the *structure* of independence, not just the money.
          *   Idea: Vacation packages or Medical trials. Let's go with Medical/Time.

      *   **"Do Not Cover" List:**
          *   Representation Theorem proof.
          *   Prospect Theory details (just mention it exists).
          *   Savage vs. vNM distinction (too deep).
          *   Risk measures (VaR, CVaR) - distinct topic.

  5.  **Refining the Tone:**
      *   Needs to be respectful of their numeracy but firm on the theory.
      *   Avoid "psychology class" vibe. Keep it "systems design" vibe.
      *   Acknowledge the cynicism ("Yes, humans are messy. We are building compilers for decision-making, not simulating brains.")

  6.  **Review against Constraints:**
      *   75 minutes? Yes, the timing needs to be tight.
      *   No bibliography? Check.
      *   Address specific sticking points? Check.
      *   Teaching Plan format? Check.

  7.  **Final Polish:**
      *   Make sure the "Dependencies" section clearly distinguishes between Utility and Value.
      *   Ensure the "Sequential" argument is framed as a *test* of consistency, not a proof of rationality.
      *   Check the "Fixed but Unknown" advice: Be decisive. It's a different beast (Ambiguity Aversion). Keep it out to save time and clarity.

  *(Self-Correction during drafting)*: I initially thought about suggesting they use the Money Pump argument heavily. But for ML engineers, the "Objective Function Consistency" argument might land better. I will frame the Money Pump as "arbitrage against your own policy."
  Also, need to be careful about the "stakes identical" claim by the user. In Allais, the stakes *are* identical in terms of outcomes (\$0, \$1M, \$5M), but the probabilities shift. The user's intuition is correct but needs precise wording: The *outcome set* is identical, the *probability distribution* over the common consequence is what gets cancelled.

  Let's assemble the plan.cw
answer: |-
  Here is a teaching plan designed for a skeptical, numerate audience. It treats the Independence Axiom not as a law of nature, but as a design constraint for consistent decision-making systems.

  ### Phase 1: Strategic Arcs (Brainstorming)

  Before settling on the plan, I evaluated three narrative arcs.

  1.  **The "Money Pump" Arc:** Focus entirely on Dutch Books. If you violate independence, I can construct a sequence of trades that drains your bank account.
      *   *Verdict:* **Discard.** It feels like a parlor trick to engineers. They will argue about transaction costs or "one-off" decisions. It doesn't explain *why* the axiom is structurally necessary for utility theory.
  2.  **The "Objective Function" Arc:** Frame vNM utility as the necessary condition for having a stable scalar objective function. If you violate independence, your "loss function" changes depending on how the data is batched.
      *   *Verdict:* **Strong Contender.** This speaks to ML engineers. However, it risks becoming too abstract too quickly.
  3.  **The "Substitution" Arc (Selected):** Focus on the logic of cancellation. If Option A and Option B differ only in a specific branch, and you prefer A, you must still prefer A if that branch is swapped for an identical branch in both.
      *   *Verdict:* **Winner.** This bridges the gap between the Money Pump (consequence) and the Objective Function (structure). It allows you to use the sequential visualization to make the logic undeniable, while acknowledging the psychological friction.

  ---

  ### Phase 2: The Teaching Plan (75 Minutes)

  #### 0:00 – 0:10 | Setup & Pre-empting Cynicism
  **Goal:** Define the game. Distinguish *Descriptive* (psychology) from *Prescriptive* (coherence).
  *   **The Hook:** Acknowledge the elephants. "Two people in this room think humans are irrational and this axiom is false. You are right about the humans. You are wrong about the axiom."
  *   **The Distinction:** We are not modeling *brains* today; we are modeling *agents*. If you are building an RL agent, a trading bot, or a policy, do you want it to be exploitable? Do you want its preferences to flip based on irrelevant formatting?
  *   **The Commitment:** State clearly: The Independence Axiom is a **coherence constraint**, not a behavioral prediction. It is the price of admission for Expected Utility Theory.

  #### 0:10 – 0:25 | Dependencies (The "Pre-Flight" Check)
  **Goal:** Establish the vocabulary so the axiom doesn't sound like "maximize expected money."
  *   **Dependency 1: Outcomes $\neq$ Money.**
      *   *Action:* Write $O$ (Outcomes) and $u(O)$ (Utility) on the board.
      *   *Point:* If you are risk-averse, $u(\$1M) > 0.5 \times u(\$2M)$. The axiom applies to $u$, not dollars. If you think the axiom demands risk-neutrality, you have stopped at the dollar level.
  *   **Dependency 2: Preferences are over Lotteries.**
      *   *Action:* Define a prospect $L = \{(p_1, O_1), (p_2, O_2)...\}$.
      *   *Point:* You are choosing between distributions, not just point estimates.
  *   **Dependency 3: Consequentialism.**
      *   *Action:* State it plainly. "We assume you care about where you end up, not the path you took to get there."
      *   *Note:* This is the hidden assumption in the sequential argument. Acknowledge it. If they reject consequentialism (e.g., they value "regret" or "process"), vNM is the wrong tool. Don't hide this; it builds trust.

  #### 0:25 – 0:45 | The Carrying Example (Allais)
  **Goal:** Demonstrate the violation without allowing "risk aversion" as an excuse.

  **The Setup:**
  Put this on the board. Do not use "House Deposit" framing. Use "Final Wealth State" or "Lump Sum."

  *   **Problem 1:**
      *   **1A:** 100% chance of \$1 Million.
      *   **1B:** 10% chance of \$5M, 89% chance of \$1M, 1% chance of \$0.
  *   **Problem 2:**
      *   **2A:** 11% chance of \$1M, 89% chance of \$0.
      *   **2B:** 10% chance of \$5M, 90% chance of \$0.

  **Design Requirements (Correcting your intuition):**
  1.  **Common Consequence:** You are correct; there must be a shared branch (the 89% chance of \$1M in Prob 1, which becomes 89% chance of \$0 in Prob 2).
  2.  **Identical Stakes:** You are correct; the outcome set $\{\$0, \$1M, \$5M\}$ must be identical across all four options. If 1A offered \$1M and 2A offered \$100k, risk aversion could explain the switch.
  3.  **Exhaustive Description:** You are correct; the description must be final. No "this is for rent" vs. "this is for gambling."
  4.  **Correction:** The stakes don't need to be "identical across all four options" in terms of probability, but the *outcome values* must be constant. The variation must be isolated to the probability mass shifting between the common consequence and the varying consequence.

  **The Move:**
  1.  Ask for a show of hands for 1A vs 1B. (Most pick 1A).
  2.  Ask for a show of hands for 2A vs 2B. (Most pick 2B).
  3.  **The Reveal:** Draw the decision trees.
      *   Show that 1A and 1B share an 89% branch yielding \$1M.
      *   Show that 2A and 2B share an 89% branch yielding \$0.
      *   **The Kicker:** Point out that the *remaining* 11% branch is **identical** in structure between the two problems, merely scaled.
      *   In Problem 1, you are comparing (100% \$1M) vs (10/11 \$5M + 1/11 \$0) *conditional on the 11% slice*.
      *   In Problem 2, you are comparing (100% \$1M) vs (10/11 \$5M + 1/11 \$0) *conditional on the 11% slice*.
      *   If you prefer 1A, you are saying "Certain \$1M is better than the gamble."
      *   If you prefer 2B, you are saying "The gamble is better than Certain \$1M."
      *   **Conclusion:** You have reversed your preference on the *exact same sub-lottery* solely because it was bundled with a different common consequence.

  #### 0:45 – 0:60 | Misconception Map & Defusal
  **Goal:** Handle the pushback.

  | Misconception | When it arises | Defusal Strategy |
  | :--- | :--- | :--- |
  | **(e) Prediction vs. Constraint** | Intro (0:05) | "This is not a law of physics. It is a definition of consistency. You can violate it, but you cannot claim to be maximizing Expected Utility." |
  | **(a) "Axiom says be risk-neutral"** | Example (0:30) | "No. If $u(\$1M)$ is high enough, you pick 1A and 2A. If $u(\$5M)$ is high enough, you pick 1B and 2B. Just don't switch." |
  | **(c) "The problems differ"** | Example (0:35) | Use the **Sequential/Tree Visualization**. Hide the 89% branch. Show that the remaining decision node is isomorphic. |
  | **(b) "Certainty Effect / Tiny Probs"** | Discussion (0:50) | "Agreed. Humans overweight certainty. That is Prospect Theory. But if you overweight certainty, you are not an EU maximizer. You cannot have both." |
  | **(d) "Most people violate = Axiom False"** | Discussion (0:55) | "Most people also violate the laws of probability (conjunction fallacy). Does that mean probability theory is false? No, it means human intuition is buggy." |

  #### 0:60 – 0:70 | The Two Sticking Points (Resolution)

  **1. The Sequential Argument (Dynamic Consistency)**
  *   **Your Question:** Does showing the shared branch resolving *before* the choice assume consequentialism?
  *   **My Advice:** **Yes, it does.** It assumes you don't care about the *history* of the choice, only the future node.
  *   **Action:** Say this out loud. "This argument assumes **Consequentialism**: that you evaluate the decision at the node you are currently at, ignoring how you got there. If you care about 'regret' or 'safety' as a historical property, this axiom doesn't apply. But if you are building a forward-looking optimizer, you must accept consequentialism."
  *   **Why:** Skeptics smell hidden assumptions. If you hide this, they will tear you apart. If you expose it, they will respect the boundary.

  **2. Fixed but Unknown (Ambiguity)**
  *   **Your Question:** Should I run the example with a sealed envelope (fixed but unknown) instead of a lottery wheel?
  *   **My Advice:** **No.** Do not do this in a 75-minute session.
  *   **Why:** This moves you from **Risk** (known probabilities, vNM Independence) to **Ambiguity** (unknown probabilities, Savage Sure Thing Principle / Ellsberg Paradox).
      *   While the violation feels similar, the theoretical fix is different. Ambiguity aversion suggests the probabilities themselves are ill-defined. Allais is about *known* probabilities being weighted non-linearly.
      *   Introducing this invites the argument: "Well, maybe the probabilities aren't trustworthy." That derails the specific point about the Independence Axiom.
      *   **Compromise:** Mention it in the Q&A as a "boundary condition." "If the probabilities themselves are unknown, we enter Ellsberg territory, which is a different beast. Today we assume the probabilities are trusted."

  #### 0:70 – 0:75 | The Check & The "Do Not Cover"

  **The Final Check Question:**
  Do not ask them to solve an Allais variant. Ask them to identify *applicability*.

  > "I am designing a medical triage algorithm.
  > **Option A:** Patient definitely survives 1 year.
  > **Option B:** 90% chance survive 10 years, 10% chance immediate death.
  >
  > Later, a new constraint arises: There is a 50% chance the hospital loses power tomorrow, and the patient dies regardless of the treatment chosen.
  >
  > Does the Independence Axiom demand I maintain my original preference between A and B, given this new common 'death' branch? Why or why not?"

  *   **Correct Answer:** Yes. The 50% common consequence should cancel out. If the preference flips, the utility function is incoherent.
  *   **What it tests:** It tests if they understand that *common consequences* (even bad ones) should not alter the relative ranking of the remaining branches. It removes money and uses time/survival.

  **The "Do Not Cover" List (Write this on the board at the start):**
  1.  **The Representation Theorem Proof:** We are using the result, not proving it.
  2.  **Prospect Theory Weighting Functions:** We will mention the *effect*, not the math ($\pi(p)$).
  3.  **Savage vs. vNM:** We are assuming known probabilities (vNM). Don't ask about subjective probability.
  4.  **Risk Measures (VaR/CVaR):** Those are regulatory constraints, not preference axioms.
  5.  **How to "Fix" Human Bias:** We are diagnosing the inconsistency, not therapy.

  ---

  ### Instructor Notes for Delivery

  *   **Tone:** Keep it dry and engineering-focused. When a participant says, "But I feel safer with 1A," reply with, "Feelings are data for psychologists. We are building a loss function. Does 'feeling safe' belong in the utility $u$, or is it a violation of the independence of irrelevant alternatives?"
  *   **Board Work:** Draw the trees. The visual cancellation of the 89% branch is the only thing that makes the logic stick for numerate audiences. Algebra alone will let them argue about "variance." Trees show the *structure* is identical.
  *   **Handling the Cynics:** If someone says, "This is useless because no one actually thinks this way," agree with them. "Correct. That is why we have compliance layers and risk limits. But if your core optimizer violates this, your risk limits are just patching a leaky hull. We want to know if the hull is sound."

  This plan respects their intelligence, acknowledges the empirical reality (people violate the axiom), but holds the line on the theoretical necessity (consistent agents must not).
