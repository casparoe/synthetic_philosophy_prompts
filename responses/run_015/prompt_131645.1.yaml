      *   **Mnemonic vs. Constitutive:** Leonard suffers both, but the horror is the collapse of one into the other. He treats constitutive gaps (who is John G.?) as mnemonic ones (I just need to find the right note). The film shows the *construction* of the fact where there is none.
      *   **Teddy and the Corrupt Community:** This is crucial. Kripke's solution requires agreement. Teddy provides agreement, but it's manipulative. This challenges the normative force of the skeptical solution. If the community lies, do I still mean anything? Leonard chooses the lie.
      *   **John G. vs. Quus:** Differentiate them. Quus is logical/semantic. John G. is pragmatic/existential. The film conflates them to show how semantic indeterminacy allows ethical evasion.
      *   **Form and Viewer:** Reverse chronology forces the viewer into Leonard's rule-following position. We construct the narrative rule, then it collapses.
      *   **Conclusion:** Does it add to the debate? Yes, it adds the dimension of *bad faith*. Kripke is abstract; Leonard is willing. The film shows rule-following as a survival mechanism, not just a semantic condition.

