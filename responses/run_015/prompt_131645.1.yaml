  2.  **Deconstruct the Philosophical Issues:**
      *   **Kripke's Skeptic:** There is no fact of the matter about what I meant by "+" in the past. Any past usage is compatible with infinitely many rules (e.g., quus). Meaning is constituted by community agreement/correction (Skeptical Solution).
      *   **Private Language Argument:** No private rules. Need public check.
      *   **Leonard's Condition:** Anterograde amnesia. Cannot form new memories. Relies on external artifacts (notes, tattoos).
      *   **The User's Distinction:** Mnemic (I meant to kill John G., but I forgot *which* John G. or *why*) vs. Constitutive (There was never a fact that I meant *this* John G. vs. *that* one).
      *   **The Student's Objection:** Externalized memory makes the signs public.
      *   **The Rebuttal:** The signs are public *tokens*, but their *type* (meaning) is fixed by Leonard's interpretation, which is uncheckable. The "fact" written on the photo is often a performative command disguised as a description ("Fact 6: John G. is a cop").
      *   **Teddy/Community:** Kripke needs a *truthful* community for correction. Teddy manipulates the "correction" process. This suggests the Skeptical Solution fails if the community is corrupt.
      *   **"John G." vs. "Quus":** Quus is about semantic indeterminacy. John G. is about referential indeterminacy fueled by motivated reasoning. They are structurally similar (infinite candidates) but ethically charged in the film.
