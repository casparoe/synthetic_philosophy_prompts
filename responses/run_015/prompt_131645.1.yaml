  *(Refining the Student Objection)*: The student says symbols are public/stable. The counter is that stability of the *token* does not guarantee stability of the *type*. A tattoo saying "John G." is stable ink. But does "John G." refer to Teddy? John Smith? A concept? The rule for applying the label is internal to Leonard's decaying mind. The "public" object is a prop in a private play.

