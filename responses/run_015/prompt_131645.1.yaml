  8.  **Final Polish:** Check the flow. Ensure the distinction between mnemonic and constitutive is clear. Ensure the rebuttal to the undergrad is sharp. (The key is that publicness requires *shared* norms, not just visible symbols. Leonard's symbols are publicly visible but privately governed.)

