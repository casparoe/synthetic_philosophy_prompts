answer: |-
  # Research Prospectus: Generalized Summability and the Dominance Principle in the Pasadena Paradox

  **Course:** Graduate Seminar in Decision Theory
  **Project Type:** Term Paper Proposal
  **Target Length:** 6,000 words

  ## 1. Abstract

  The Pasadena Paradox presents a lottery with a well-defined probability space but an undefined expected value (EV), as the associated utility series fails to converge. Standard responses in the literature diagnose this as a failure of the EV maximization principle, suggesting either that the lottery has no value, that EV maximization must be restricted to convergent cases, or that dominance principles must be abandoned in infinite contexts. This paper proposes a different diagnostic avenue. I argue that the "undefined EV" diagnosis is superficial; the deeper problem is the lack of a specified aggregation rule for infinite series of utilities. This project will investigate whether a "Generalized Expected Value" (GEV), defined via generalized summation methods (such as Cesàro or Abel summation), can resolve the paradox. Specifically, I will test the existence of a valuation functional that satisfies three conditions: (i) consistency with standard EV on convergent lotteries, (ii) definedness on the Pasadena lottery, and (iii) adherence to the State-Wise Dominance principle. I hypothesize that no such functional exists that satisfies all three conditions simultaneously without violating linearity or stability. The paper will formally construct the obstruction, demonstrating that the tension in the Pasadena Paradox is not merely about convergence, but about the incompatibility of infinite aggregation methods with normative decision-theoretic axioms.

  ## 2. Motivation and Background

  ### 2.1 The Insufficiency of the Standard Diagnosis
  The standard treatment of the Pasadena Paradox focuses on the divergence of the expectation series. The lottery is constructed such that the terms of the expected value series do not tend to zero; rather, they oscillate with constant magnitude. Consequently, the sum is undefined in the standard Riemann sense. The typical philosophical conclusion is that rational preference cannot be represented by an expectation function in this domain, or that the lottery itself is ill-formed.

  However, this diagnosis is mathematically premature. In analysis, divergent series are frequently assigned values via regularization or summation methods (e.g., Cesàro, Abel, Borel). These methods extend the domain of the summation functional while preserving linearity and stability on the subspace of convergent series. If decision theory is to handle infinite prospects, it requires an aggregation principle. Simply declaring the value "undefined" is a refusal to specify the aggregation rule, not a proof that no rule exists.

  ### 2.2 The Gap in the Literature
  Existing responses to Pasadena generally fall into two camps: those that truncate the utility function (bounding the outcomes) and those that reject the Dominance principle for infinite cases. Few have rigorously investigated whether the *aggregation rule itself* can be modified to save both Dominance and the intuition that the lottery should have a determinate value. If a generalized summation method could assign a value to the Pasadena lottery while respecting Dominance, the paradox would dissolve into a mere technicality of series convergence. If no such method exists, the impossibility theorem itself reveals a deeper structural constraint on rational choice over infinite state spaces. This project aims to close this gap by treating the Pasadena Paradox as a problem in functional analysis applied to decision theory.

  ## 3. Research Question and Conjectures

  The central research question is: **Does there exist a linear functional on the space of countable lotteries that extends standard expectation, assigns a finite value to the Pasadena lottery, and satisfies the State-Wise Dominance principle?**

  To make this tractable, I will formalize the problem using the following definitions:
  *   Let $\mathcal{L}$ be the vector space of lotteries with countable outcomes and finite probability sums.
  *   Let $E_{std}$ be the standard expectation functional defined on the subspace $\mathcal{L}_{conv} \subset \mathcal{L}$ where the utility series converges absolutely.
  *   Let $L_P$ be the Pasadena lottery.
  *   Let $\succeq$ be the preference relation represented by the functional $\phi$.

  I will investigate the following conjectures:

  **Conjecture A (The Possibility Claim):** There exists a summation method $S$ (e.g., Cesàro) such that defining $\phi(X) = S(\sum x_i p_i)$ satisfies Dominance for all $X, Y \in \mathcal{L}$ including $L_P$.

  **Conjecture B (The Impossibility Claim):** Any functional $\phi$ that extends $E_{std}$ and assigns a value to $L_P$ must violate State-Wise Dominance for some pair of lotteries in $\mathcal{L}$.

  **Conjecture C (The Obstruction Claim):** The specific obstruction arises from the conflict between *Shift Invariance* (required for most generalized sums) and *State-Wise Ordering* when the utility terms do not decay to zero.

  My working hypothesis is that Conjecture B is true. The intuition is that generalized summation methods typically rely on the ordering of the series terms. However, State-Wise Dominance is invariant under the permutation of states. If the valuation depends on the order of summation (which it must for conditionally convergent or oscillating series), it will inevitably conflict with a dominance principle that treats the states as an unordered set of possibilities.

  ## 4. Methodological Approach

  This project will proceed in three phases: formalization, construction, and refutation.

  ### 4.1 Phase 1: Formalizing the Space of Lotteries
  I will model the lotteries as sequences in a vector space. Since the Pasadena lottery involves probabilities decaying as $1/2^n$ and utilities growing as $2^n$, the terms of the expectation series are constant magnitude ($1/2$). This places the series of expectations in the space of bounded sequences, $l_\infty$.
  I will define the "Generalized Expected Value" (GEV) as a linear functional $\phi: l_\infty \to \mathbb{R}$.
  Key properties to define:
  1.  **Regularity:** $\phi(s) = \lim(s)$ if $s$ converges.
  2.  **Linearity:** $\phi(as + bt) = a\phi(s) + b\phi(t)$.
  3.  **Positivity (Dominance):** If $s_n \ge 0$ for all $n$, then $\phi(s) \ge 0$.

  The critical move here is to distinguish between the *sequence of outcomes* and the *sequence of expectation terms*. Dominance applies to the outcomes; summation applies to the expectation terms. I must rigorously map the dominance condition on outcomes to a positivity condition on the expectation series. This mapping is non-trivial because a pointwise dominant lottery does not necessarily generate a term-wise dominant expectation series if the probabilities differ across states. I will need to construct a "canonical" ordering of states to align the dominance condition with the sequence order required for summation.

  ### 4.2 Phase 2: Testing Generalized Summation Methods
  I will evaluate specific summation methods against the Dominance principle.
  *   **Cesàro Summation:** This averages the partial sums. For the Pasadena series ($1/2 - 1/2 + 1/2...$), the Cesàro limit is $1/4$. I will test if this valuation respects dominance. I will construct a "Modified Pasadena" lottery that dominates the original pointwise (e.g., by adding a small positive constant to every outcome) but check if the Cesàro value increases appropriately.
  *   **Abel Summation:** This considers the limit of the power series as the variable approaches 1. I will determine if the Abel sum yields a different value and if it is more robust to dominance violations.
  *   **Banach Limits:** These are linear functionals on $l_\infty$ that extend the limit functional and are shift-invariant. They are the strongest candidate for a GEV. I will investigate whether a Banach Limit can be constructed that respects the specific positivity constraints imposed by State-Wise Dominance in the Pasadena context.

  ### 4.3 Phase 3: Identifying the Obstruction
  If the tests in Phase 2 fail (as I suspect they will), I will isolate the precise axiom causing the failure.
  *   Is it **Linearity**? (Perhaps value is non-linear in probabilities for infinite cases).
  *   Is it **Dominance**? (Perhaps we must accept that $A$ can be better than $B$ in every state but have lower GEV).
  *   Is it **State-Individuation**? (Perhaps the problem is that we are summing over outcomes indexed by $n$, but dominance requires summing over states $\omega$).

  I expect to show that the obstruction lies in the **permutation invariance** of the probability space versus the **order dependence** of the summation method. If the value of the lottery depends on the order in which we sum the terms (which is necessary for divergent series), but the dominance principle assumes the value is intrinsic to the mapping from states to outcomes (independent of summation order), a contradiction is inevitable. I will formalize this by constructing two representations of the same lottery (via state permutation) that yield different GEVs, thereby violating the indifference required by the probability structure.

