  ## 6. Feasibility and Risk Assessment

  ### 6.1 Tractability
  The mathematical tools required (basic functional analysis, series summation) are within the scope of graduate-level decision theory. The Pasadena series is simple enough ($1/2 - 1/2...$) that calculations can be done explicitly without needing heavy measure theory. The core work is conceptual: mapping the decision-theoretic axiom (Dominance) to the analytic property (Positivity of the functional).

  ### 6.2 Potential Risks
  *   **Risk 1: Known Impossibility Theorem.** It is possible that a theorem already exists in the mathematical literature (e.g., regarding positive linear functionals on $l_\infty$) that settles this immediately.
      *   *Mitigation:* I will frame the paper not as discovering a new mathematical theorem, but as interpreting an existing analytic constraint through the lens of the Pasadena Paradox. The contribution will be the decision-theoretic interpretation of the obstruction.
  *   **Risk 2: Scope Creep.** Investigating all summation methods is too broad.
      *   *Mitigation:* I will restrict the analysis primarily to Cesàro and Banach Limits, as these are the most relevant to decision theory (averaging and shift-invariance). Abel summation will be mentioned as a secondary check.
  *   **Risk 3: Mathematical Complexity.** Proving the non-existence of a functional can be technically demanding.
      *   *Mitigation:* I will rely on constructive counter-examples rather than general existence proofs. Showing one pair of lotteries where Dominance fails under a specific GEV is sufficient to reject that GEV. Showing that *any* GEV requires a property that contradicts Dominance is the stronger claim I will aim for, but I will settle for a robust impossibility argument if a full proof is too dense.

  ### 6.3 Resource Requirements
  I will need to review standard texts on summability theory to ensure the definitions of the functionals are precise. I will also need to revisit the axioms of Savage or Jeffrey to ensure my formalization of Dominance is consistent with the seminar's framework. No external data or empirical work is required.

  ## 7. Expected Contribution

  This project aims to shift the discourse on the Pasadena Paradox from "EV is undefined" to "Aggregation rules conflict with Dominance."
  1.  **Clarification:** It clarifies that the paradox is not about probability or utility per se, but about the summation of infinite series.
  2.  **Negative Result:** It provides a rigorous argument for why "fixing" the EV with math tricks (summation methods) fails to save the normative principles of decision theory.
  3.  **Positive Recommendation:** It suggests that if we wish to retain Dominance, we must accept that some lotteries (like Pasadena) genuinely have no value, not because the math fails, but because no coherent valuation function exists that respects our normative constraints.

  By the end of the semester, I expect to have a complete draft that demonstrates the impossibility of a Dominance-respecting Generalized Expected Value for the Pasadena lottery, thereby closing the door on summation-based solutions and forcing a re-evaluation of the Dominance principle in infinite decision theory.

