  Then restate that position as faithfully as possible using only the vocabulary of predictive processing and active inference: generative models, hierarchical Bayesian inference, prediction-error minimization, precision weighting, and variational free energy. Do not smuggle analogical language in disguised as Bayesian terms; if a commitment requires distortion to fit, say exactly where the distortion occurs. In particular, address whether "slippage" survives as anything other than ordinary hierarchical model updating or precision-modulated prediction-error reduction.

