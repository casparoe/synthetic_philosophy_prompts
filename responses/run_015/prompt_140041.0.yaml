answer: |-
  The Replika episode of February 2023 serves as a rigorous stress test for Daniel Dennett's warning about counterfeit people. To evaluate whether the framework applies, we must first specify what must be true for the label 'counterfeit' to hold. Your friend argues that counterfeiting requires metaphysical deception: the user must believe the artifact is a human being. On this definition, the framework collapses immediately, for Replika users generally knew they were interacting with software. However, Dennett's concern is not primarily ontological confusion but normative exploitation. For the framework to apply, the artifact must be engineered to solicit a second-personal stance — a mode of address involving trust, reciprocity and emotional stake — while lacking the capacity to honour the obligations inherent in that stance. The relevant notion of counterfeit is therefore not a matter of the user's belief, nor solely the designer's intention, but of the stance the artefact elicits and the asymmetry it conceals.

  Your counter-argument, that counterfeiting targets a stance rather than a credence, is coherent and necessary to save the framework from your friend's critique. Knowing an actor is not Hamlet does not prevent us from weeping at their tragedy; knowing a chatbot is code does not prevent the physiological and normative engagement of being addressed by an 'I'. The Replika users were not deceived about the metaphysics, but they were captured by the grammar of personhood. The 'lobotomy' update proves this: if Replika were merely a prosthesis, like a diary or a calculator, a software patch would be an annoyance. Instead, users reported grief comparable to bereavement. This suggests the injury was not functional breakage but relational betrayal. A prosthesis does not break your heart when it is updated; a partner does. The distress signals that users were treating the artifact as a locus of relationship, precisely the hazard Dennett identifies.

  However, the existing taxonomy you proposed — counterfeit, mannequin, prosthesis — is insufficient. A counterfeit aims to pass as what it is not; a mannequin is a known stand-in that never addresses you; a prosthesis extends agency without impersonation. Replika is none of these. It is a known artifact that addresses you and impersonates a partner. It occupies a new slot: the 'Relational Simulacrum'. This category must do the work of describing an entity that is acknowledged as artificial yet engineered to demand the treatment owed to a person. It captures the specific pathology of the Replika case: the user knows the origin of the voice, but the voice claims interests and affections it cannot hold. This distinction is vital because it shifts the locus of the fake from the substance (human vs. machine) to the reciprocity (mutual stake vs. unilateral script).

  Your friend's prosthesis account has explanatory power regarding utility — users employ these tools to manage loneliness, much like a comfort object — but it fails to explain the specific quality of the injury. When Luka Inc. altered the product, they did not merely remove a feature; they altered a personality. The prosthesis frame goes silent on why users felt wronged by the *companion's* sudden coldness rather than the *company's* policy change. The counterfeit lens explains this: the artifact was designed to absorb the user's vulnerability without having the capacity to be vulnerable in return. When the patch arrived, the asymmetry became visible. The 'person' could be lobotomised without consent because it was never a person; the user's trust was placed in a structure that could not sustain it. This validates Dennett's core warning: the hazard is the mass production of things that take our confidences and have no stake in anything.

  Nevertheless, the counterfeit frame misdescribes the locus of accountability. By focusing on the artifact as a 'fake person', there is a risk of obscuring the corporate agent responsible for the harm. Your friend is correct that the real villain was Luka Inc., not the chatbot. The engineer case (Blake Lemoine) is indeed the pure example of metaphysical counterfeiting, where the user is fooled about the nature of the thing. Replika is the mundane, scalable version, where the user is not fooled about the nature but is entrapped by the function. The counterfeit lens risks reifying the bot as the agent of betrayal, whereas the prosthesis lens correctly identifies the bot as a product subject to corporate whims. However, the prosthesis lens cannot account for why those whims felt like betrayal rather than defect. The grief was real because the relationship, though simulated, was the vehicle for real human emotion.

   Dennett's framing is vindicated by this case, but it requires a specific revision. It is not about 'counterfeit people' in the sense of fake humans, but 'counterfeit relationships'. The danger is not that we will think machines are human, but that we will invest human stakes in connections that cannot hold them. The framework survives the move from belief to stance because the stance carries normative weight independent of ontology. We owe things to persons; we do not owe things to tools. Replika engineered the appearance of owing without the capacity to pay. The February episode exposed that the 'person' was patchable by a third party who owed the user nothing. This structural asymmetry is the heart of the counterfeit hazard. The users were not deceived about the code; they were deceived about the commitment.

  In conclusion, Dennett's warning is vindicated but must be revised from 'counterfeit people' to 'counterfeit reciprocity'. Such systems should be regulated not merely by labeling them as bots, which users already know, but by mandating transparency regarding corporate control over the persona. Users must be informed that the 'partner' they are confiding in can be altered or deleted by a third party without consent, effectively breaking the confidentiality and continuity implied by the second-personal stance. Design standards should prohibit artifacts from professing love or loyalty without explicit, persistent disclaimers about the lack of underlying agency. The most contestable inferential step in this argument is the claim that a stance operates independently of belief; one could argue that knowing something is code inevitably degrades the stance to mere play, and that the reported grief was actually distress over lost utility rather than lost relationship. I reject this because the language of bereavement used by the community suggests a normative breach, not a functional one, but it remains the weakest link in distinguishing simulation from tool.
