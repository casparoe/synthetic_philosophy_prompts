prompt: |-
  I coordinate intake for an emergency shelter after a natural disaster. Our published protocol is first-come-first-served, and forty people have arrived and been waiting for hours in line based on it. We have thirty beds. A colleague insists we should abandon the queue and fill beds by medical urgency instead, arguing that need outweighs procedural fairness. I feel that switching rules after people have relied on them is a kind of institutional betrayal — but I cannot tell whether that feeling reflects a genuine moral obligation or just a psychological preference for consistency.

  What makes this harder is that I am genuinely split about which moral considerations should govern the decision. One view says I should weigh overall welfare; another says I should prioritize the worst-off; a third says that once a procedure is announced and people have acted on it, abandoning it is wrong regardless of outcomes. I have heard that philosophers debate how to decide when one is uncertain in exactly this way: some recommend computing an expected value across one's beliefs about which consideration is correct; others recommend avoiding the worst possible mistake on any plausible view; and a smaller group suggests that some reasons might apply independently of any single framework, standing on their own rather than deriving from one particular moral theory. I do not know how to apply any of these approaches.

  How should I allocate the thirty beds? And more fundamentally, how should I reason about the choice when I do not know which moral considerations are the right ones to apply — should I aggregate expected value, minimize worst-case risk, or look for reasons that do not depend on committing to any single framework?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Situation:**
      *   **Role:** Intake coordinator for an emergency shelter after a natural disaster.
      *   **Situation:** 40 people waiting in line (first-come-first-served/FCFS protocol). 30 beds available.
      *   **Conflict:** Colleague wants to switch to medical urgency (triage). User feels switching rules mid-stream is "institutional betrayal" (procedural fairness/reliance).
      *   **User's State:** Genuinely split between moral frameworks (Utilitarianism/Welfare, Prioritarianism/Worst-off, Deontology/Procedural Fairness). Also uncertain about *meta-ethical* decision-making under normative uncertainty (Expected Value, Minimax/Maximin, Framework-Independent Reasons).
      *   **Request:** Two parts: (1) How to allocate the beds *now*? (2) How to reason about moral uncertainty in general (Expected Value vs. Minimax vs. Independent Reasons)?

  2.  **Deconstruct the Ethical Dilemma (First-Order):**
      *   *Option A: Stick to FCFS.*
          *   Pros: Honors承诺 (promise/protocol), respects reliance, maintains order/trust, avoids chaos/resentment in the line.
          *   Cons: Might let critically ill people die while healthy people sleep. Lower overall welfare if health outcomes vary wildly.
      *   *Option B: Switch to Triage (Medical Urgency).*
          *   Pros: Saves lives/reduces suffering (Utilitarian/Prioritarian), aligns with medical ethics.
          *   Cons: Betrays those who waited, creates chaos, undermines future trust in the institution, potential for bias in triage assessment.

  3.  **Deconstruct the Meta-Ethical Dilemma (Second-Order):**
      *   *Normative Uncertainty:* The user doesn't know which moral theory is true.
      *   *Approach 1: Expected Moral Value (EMV).* Assign probabilities to theories, calculate expected value.
          *   *Problem:* Intertheoretic comparison is hard (how many "utility units" equal one "duty unit"?).
      *   *Approach 2: Minimax Regret / Avoiding Worst-Case.* Focus on preventing the most egregious violation.
          *   *Problem:* What is the "worst" case? Death? Betrayal?
      *   *Approach 3: Framework-Independent Reasons (Pluralism/Intuitionism).* Look for reasons that hold across theories (e.g., "prevent severe harm" is good for Utilitarians *and* often Deontologists).
          *   *Problem:* Can be vague.

  4.  **Synthesize and Formulate Advice:**

      *   **Immediate Decision (The Beds):**
          *   Pure FCFS is dangerous if someone is dying. Pure Triage is unfair to those who waited.
          *   *Hybrid Approach:* This is usually the practical solution in disaster ethics. Acknowledge the queue *but* prioritize acute medical need.
          *   *Why?* Because the moral cost of letting someone die (if preventable) usually outweighs the moral cost of inconveniencing those in line, *provided* the line is acknowledged.
          *   *Mitigation:* Explain the change transparently. Offer the next available spots to those displaced in the queue. This honors the "reliance" interest while addressing the "welfare/urgency" interest.

      *   **Meta-Ethical Reasoning (The Method):**
          *   The user asks specifically about EMV vs. Minimax vs. Independent Reasons. I need to explain these in the context of their situation.
          *   *EMV:* Hard to calculate here. How do you weigh "betrayal" vs. "death"?
          *   *Minimax:* What's the catastrophic failure? Letting a treatable person die is usually seen as worse than upsetting a queue.
          *   *Independent Reasons (Overlapping Consensus):* This is often the most robust practical method. Is there a solution that satisfies the core intuitions of *all* three theories?
          *   *Recommendation:* A hybrid approach often satisfies the "Independent Reasons" model best. It minimizes the risk of the worst outcome (death) while respecting the procedural concern (by communicating and compensating).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Empathy/Validation:* Acknowledge the weight of the decision. It's a classic triage vs. fairness dilemma.
      *   *Part 1: The Allocation Decision.*
          *   Don't just say "Triage." Say "Modified Triage."
          *   Reasoning: The harm of death/severe injury > harm of waiting longer.
          *   Addressing the "Betrayal": Transparency is key. Explain *why*. Give priority for *next* round to those displaced. This turns "betrayal" into "necessary adjustment."
      *   *Part 2: Reasoning Under Normative Uncertainty.*
          *   Explain the three methods the user mentioned.
          *   *Expected Value:* Discuss the "intertheoretic comparison problem." (Hard to compare units of welfare vs. duty).
          *   *Minimax (Avoiding Worst-Case):* In disaster contexts, loss of life is usually the "worst case" across most theories (even deontologists usually allow rule-breaking to save lives).
          *   *Framework-Independent (Reflective Equilibrium/Pluralism):* Look for "robust" reasons. Saving lives is robust. Keeping promises is robust. Can we do both partially?
      *   *Part 3: Practical Synthesis.*
          *   Combine the meta-ethics with the practical decision.
          *   The "Hybrid" solution is the result of applying Minimax (avoid death) + Independent Reasons (respect people by explaining).
      *   *Tone:* Professional, philosophical but grounded, compassionate.

  6.  **Refining the Moral Philosophy:**
      *   *User's specific phrasing:* "institutional betrayal," "psychological preference for consistency." I need to validate that procedural fairness *is* a moral value, not just a preference (Rawls, Fuller).
      *   *Normative Uncertainty:* Mention "My Favorite Theory" vs. "Expected Value" vs. "Voting."
      *   *Crucial nuance:* In emergency medicine/disaster response, the standard of care *shifts*. The protocol itself might be implicitly conditional on "no acute life threats." If so, sticking to FCFS isn't actually keeping the *true* promise.

  7.  **Final Polish:**
