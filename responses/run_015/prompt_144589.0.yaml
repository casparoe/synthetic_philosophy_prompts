answer: |-
  This is a profound ethical dilemma that sits at the intersection of practical crisis management and normative philosophy. You are facing a conflict between **consequentialist concerns** (maximizing welfare/saving lives), **prioritarian concerns** (helping the worst-off/medically vulnerable), and **deontological concerns** (keeping promises/procedural fairness).

  Furthermore, you are experiencing **normative uncertainty**: you are unsure not just about what to do, but about which *moral framework* should decide what to do.

  Here is a breakdown of how to handle the immediate allocation, followed by an analysis of how to reason under this kind of moral uncertainty.

  ---

  ### Part 1: How to Allocate the Thirty Beds

  In disaster ethics and emergency medicine, the consensus leans heavily toward **modified triage**, but with specific safeguards to address the procedural betrayal you rightly fear.

  **The Recommendation:**
  You should allocate beds based on **medical urgency**, but you must actively mitigate the procedural harm to those who waited.

  **The Reasoning:**
  1.  **The Stakes are Asymmetric:** The harm of denying a bed to someone with a critical medical condition (potential death or permanent injury) is morally weightier than the harm of denying a bed to someone who is healthy but tired (discomfort and frustration). Even many deontologists (who prioritize rules) accept that procedural rules can be overridden to prevent catastrophic harm.
  2.  **Implicit Contract:** While the published protocol is FCFS, emergency shelter protocols generally carry an implicit condition: *"provided no acute life-safety issues arise."* By switching to triage, you are not necessarily breaking the promise; you are fulfilling the deeper purpose of the shelter (preservation of life) which the FCFS rule was meant to serve administratively.
  3.  **Mitigating Betrayal:** Your feeling of "institutional betrayal" is not just a psychological preference; it is a valid moral concern regarding **reliance interests**. People acted on your rules. To ignore this undermines future trust. Therefore, you cannot simply switch rules silently.

  **Actionable Steps:**
  *   **Triage First:** Assess the 40 people for medical urgency. Fill the 30 beds with the most vulnerable.
  *   **Transparent Communication:** Address the line immediately. Acknowledge the change. "We announced FCFS, but we have identified life-threatening medical needs. We have to prioritize survival today. We know you waited, and we apologize for the change."
  *   **Compensatory Priority:** Guarantee those displaced from the queue (the healthy people who were in line first) **priority status for the next round** of beds or for other resources (food, transport, casework). This honors their reliance on the original rule without sacrificing life.

  ---

  ### Part 2: How to Reason Under Normative Uncertainty

  You asked whether to aggregate expected value, minimize worst-case risk, or look for framework-independent reasons. In high-stakes, time-sensitive crises, **minimizing worst-case risk (Minimax)** combined with seeking **robust reasons** is generally superior to Expected Moral Value (EMV).

  Here is how the three approaches apply to your situation:

  #### 1. Expected Moral Value (EMV)
  *   **The Method:** You assign a probability to each moral theory being true (e.g., 50% Utilitarianism, 30% Deontology, 20% Prioritarianism) and calculate the weighted value of each action.
  *   **The Problem:** This requires "intertheoretic comparison." How many units of "procedural fairness" equal one unit of "life saved"? There is no common currency between theories. If Deontology is true, breaking a promise might be infinitely bad, regardless of welfare. If Utilitarianism is true, a life saved is the only metric. Trying to compute this in an emergency is cognitively impossible and philosophically fraught.
  *   **Verdict:** **Avoid this.** It creates false precision in a chaotic environment.

  #### 2. Minimax Regret (Avoiding the Worst-Case)
  *   **The Method:** You look at the worst possible outcome of each choice under any plausible moral theory and choose the option that avoids the most catastrophic failure.
  *   **Application:**
      *   *Scenario A (Stick to FCFS):* Worst case = A person with a treatable condition dies because a healthy person took their bed. This is a catastrophic failure for Utilitarians, Prioritarians, and most Deontologists (violation of duty to preserve life).
      *   *Scenario B (Switch to Triage):* Worst case = People feel betrayed and trust is eroded. This is a failure for Deontologists (promise-breaking) and Utilitarians (social unrest), but it is rarely "catastrophic" in the same way as death.
  *   **Verdict:** **Strongly Recommended.** In emergency contexts, the "worst case" of letting someone die outweighs the "worst case" of procedural unfairness. This approach protects you from the most egregious moral error.

  #### 3. Framework-Independent Reasons (Moral Pluralism/Robustness)
  *   **The Method:** You look for reasons that hold weight across multiple theories, or "prima facie duties" (W.D. Ross) that must be balanced rather than derived from a single source.
  *   **Application:**
      *   *Reason 1:* Prevent severe harm (Supported by Utilitarianism, Prioritarianism, and most Deontologies).
      *   *Reason 2:* Honor reliance/promises (Supported by Deontology and Rule-Utilitarianism).
      *   *Synthesis:* A "robust" decision is one that satisfies Reason 1 as much as possible without unnecessarily violating Reason 2.
  *   **Verdict:** **This supports the Hybrid Approach.** By triaging (satisfying Reason 1) *and* communicating/compensating the queue (satisfying Reason 2), you act on reasons that are independent of any single framework. You are not betting on one theory; you are respecting the insights of all of them.

  ### Summary Recommendation

  **Do not use Expected Value.** It is too abstract for a crisis.

  **Use a Minimax/Robustness Hybrid:**
  1.  **Acknowledge the Risk:** The "worst case" moral failure here is preventable death. This risk dominates the calculation.
  2.  **Act on Robust Reasons:** Saving lives is a reason almost all moral theories accept. Keeping promises is also one. When they conflict, prevent the irreversible harm (death) while mitigating the reversible harm (disappointment/distrust).
  3.  **The Decision:** Switch to medical urgency for the 30 beds.
  4.  **The Mitigation:** Publicly acknowledge the rule change, apologize for the necessity, and grant the displaced individuals priority for the *next* available resources.

  This approach honors your intuition that "betrayal is wrong" without letting that intuition override the imperative to preserve life. It treats the queue with dignity even while bypassing it, which is often the best one can do in tragic choices.
