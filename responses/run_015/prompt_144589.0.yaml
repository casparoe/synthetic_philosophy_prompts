      *(Self-Correction during drafting)*: I initially thought about suggesting a lottery. But a lottery ignores medical urgency. A hybrid is better. I need to make sure I don't dismiss the "betrayal" feeling. It's valid. The solution is to mitigate it, not ignore it.

      *(Meta-Ethics Check)*: The user mentioned "reasons that apply independently." This sounds like Moral Pluralism or Ross's Prima Facie Duties. I should reference that.

      *(Final Plan)*:
