  *Proceed to generate text.*
answer: |-
  **Project Title:** Fragmented Ideals: The Structural Integrity of Indirect Normativity
  **Candidate:** [Name]
  **Context:** Dissertation Prospectus / Workshop Pitch

  **1. Introduction and Problem Statement**
  Indirect normativity posits that an agent's practical reasons are not fixed by the direct properties of actions, but by the advice or endorsement of an idealized version of that agent under conditions of full information and rational coherence. The standard debate surrounding this framework focuses on a dilemma of specification: if the idealization conditions are fully specified, the theory allegedly collapses into direct normativity (simply describing the right action); if left unspecified, the theory remains empty of content.

  This proposal shifts attention from the *content* of idealization to its *structural unity*. Standard formulations assume a single, globally unified ideal deliberator who advises the actual agent on all matters. However, it is unclear whether indirect normativity requires this unity. This project investigates whether the framework can tolerate *domain-fragmented idealization*, wherein the structurally improved self governing moral choice differs from the self governing prudential or epistemic choice. If the "moral ideal self" and the "prudential ideal self" offer divergent advice, the indirect framework faces a structural crisis: it must either arbitrate between them (risking a return to direct normativity) or accept contradictory reasons (risking incoherence).

  **2. Research Question**
  The central research question is stated as follows: *Does domain fragmentation in indirect normativity entail a theoretical collapse into direct, domain-specific norms, or does it produce practical incoherence due to the absence of a non-arbitrary criterion for partitioning normative domains?*

  This question admits a determinate answer because it isolates the structural conditions required for indirect normativity to function as a unified theory of reasons. The answer will determine whether the "ideal agent" must be a singular entity by logical necessity or merely by theoretical convention.

  **3. Gap in Existing Literature**
  Existing discussions of indirect normativity and internal reasons leave this question open because they typically presuppose the unity of the idealized agent without argument. Proponents of ideal deliberation models treat the "full information" and "rational coherence" conditions as applying to the agent *simpliciter*, rather than to domain-specific modules of the agent. This assumption treats the unity of the ideal self as a hidden presupposition rather than a substantive normative commitment. Consequently, it remains unknown whether the appeal to an ideal self does any distinct work in mediating conflicts between morality, prudence, and epistemology, or if it merely obscures a plurality of direct normative standards. By failing to test the unity constraint, current literature cannot determine if indirect normativity is a single theory or a label for a cluster of unrelated domain-specific theories.

  **4. Methodology**
  The project employs conceptual analysis of the constraints on idealization, specifically rational coherence, information access, and affective stability. The method proceeds in three stages:
  1.  **Decomposition:** I will analyze how each constraint operates when applied separately to moral, prudential, and epistemic domains. For instance, does "full information" in the moral domain require the same cognitive architecture as "full information" in the prudential domain?
  2.  **Conflict Testing:** I will construct cases where the advice of a morally-idealized self diverges from that of a prudentially-idealized self. I will then test whether the indirect framework has the resources to resolve this conflict without appealing to a direct normative fact (e.g., "morality overrides prudence").
  3.  **Integration Argument:** I will argue whether cross-domain unity can be justified as a requirement of rational agency or must be abandoned in favor of a fragmented model.

  **5. Possible Conclusions and Decision Criteria**
  There are two primary possible conclusions, decided by specific structural considerations:

  *   **Conclusion A (Collapse):** Domain fragmentation renders indirect normativity extensionally equivalent to a cluster of direct theories. This conclusion holds if the only way to reconcile fragmented ideal selves is to invoke a higher-order rule that prioritizes one domain over another based on direct normative weight (e.g., "moral reasons are inherently weightier"). If the arbitration rule is direct, the indirect machinery is redundant.
  *   **Conclusion B (Incoherence):** Domain fragmentation produces incoherence because there is no non-arbitrary criterion for partitioning domains. This conclusion holds if the conditions for idealization (e.g., rational coherence) logically require global consistency. If an agent cannot be rationally coherent in prudence while being incoherent in morality, fragmentation is impossible, and unity is required.

  The deciding consideration will be whether "rational coherence" is a domain-invariant property. If coherence is global, fragmentation fails (supporting Conclusion B). If coherence is local, the theory risks collapse (supporting Conclusion A).

  **6. Deliverables**
  The primary deliverable will be a taxonomy of fragmentation types, distinguishing between *weak fragmentation* (different information sets for the same ideal self) and *strong fragmentation* (distinct ideal selves with distinct constitutive aims). Accompanying this taxonomy will be a criterion for when indirect normativity remains genuinely indirect rather than reducible to direct norms. This criterion will specify the conditions under which an ideal advisor model provides normative guidance that is not already accessible through direct evaluation of the action's properties.

  **7. Scope and Feasibility Assessment**
  This project is tractable for a single semester because it limits its scope to the *structural* viability of the idealization framework, rather than attempting to solve the substantive problem of normative unity. I will not attempt to resolve whether morality actually overrides prudence in specific cases; I will only analyze whether the indirect framework *can* resolve such conflicts without self-contradiction.

  However, the project risks failure if it attempts to solve the general problem of normative unity across all practical domains. To remain feasible, the analysis must restrict itself to the logical constraints of the ideal deliberator model. If the inquiry expands into a general defense of moral rationalism or a comprehensive theory of practical reason, it will exceed the bounds of a semester-length prospectus. By focusing strictly on the architecture of indirect normativity, this project ensures a determinate outcome regarding the necessity of the unified ideal self.

  **8. Note on References**
  Positions and arguments regarding ideal deliberation, internalism, and normative fragmentation are referred to by general description. A full bibliography and specific literature review will be added separately in the final dissertation chapter.
