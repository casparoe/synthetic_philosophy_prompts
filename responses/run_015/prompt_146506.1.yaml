  Here's a thinking process that leads to the research proposal:

  1.  **Analyze the Request:**
      *   **Topic:** A structural problem in indirect normativity (specifically, the idealized-deliberation framework).
      *   **Core Issue:** Does indirect normativity require a *globally unified* idealized deliberator, or can it tolerate *domain-fragmented* idealization (different ideal selves for moral, prudential, epistemic choices)?
      *   **Format:** Two-page research proposal (dissertation prospectus or workshop pitch style).
      *   **Key Requirements:**
          *   State the research question precisely (determinate answer).
          *   Explain why existing discussions leave this open (assumption of unity).
          *   Describe the method (conceptual analysis of constraints applied separately, then argument for/against unity).
          *   Identify two main possible conclusions and decision criteria.
          *   Describe the deliverable (taxonomy + criterion).
          *   Include an honest scope assessment (tractable for a semester vs. risk of overreach).
          *   Refer to positions/arguments by general description only (no bibliography/citations).
      *   **Tone:** Academic, rigorous, philosophical.

  2.  **Deconstruct the Philosophical Content:**
      *   *Indirect Normativity:* Reasons are what an ideal self would want/advice (e.g., Smith's ideal advisor, Railton's ideal observer, etc., though I shouldn't name them).
      *   *The Standard Debate:* Collapse (becomes direct) vs. Emptiness (too vague).
      *   *The Proposed Shift:* Unity vs. Fragmentation of the Ideal Self.
      *   *The Risk:* If fragmented, does it just become direct normativity in disguise? (e.g., "Moral reasons are what Moral-Ideal-Self wants" just means "Do the moral thing"). Or does it create incoherence (conflicting advice from different ideal selves with no arbiter)?
      *   *The Goal:* Determine if fragmentation is viable without collapsing the theory.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but descriptive. *Fragmented Ideals: The Structural Integrity of Indirect Normativity.*
      *   **Introduction/Problem Statement:** Define indirect normativity briefly. State the standard collapse/emptiness objection. Introduce the new angle: the unity of the ideal deliberator.
      *   **Research Question:** Needs to be sharp. *Does domain-fragmented idealization preserve the distinctiveness of indirect normativity, or does it entail either theoretical collapse into direct normativity or practical incoherence?*
      *   **Motivation/Gap:** Why hasn't this been done? Philosophers assume a "full" ideal agent. They don't argue for unity; they presuppose it. This is a hidden commitment.
      *   **Methodology:** Conceptual analysis. Break down "idealization" (information, coherence, affect). Apply to domains (moral, prudential, epistemic). Test for cross-domain compatibility.
      *   **Possible Outcomes:**
          1.  *Unity is required:* Fragmentation leads to incoherence (conflicting commands).
          2.  *Fragmentation is viable:* But only if a higher-order integration rule exists (which might look like direct normativity).
      *   **Deliverables:** A taxonomy of fragmentation types. A criterion for "genuine indirectness."
      *   **Scope/Feasibility:** One semester is enough for the conceptual analysis of the *structure*, but not enough to solve the *substantive* question of whether morality and prudence actually conflict. Need to limit scope to structural coherence.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Length:* Two pages is roughly 800-1000 words single-spaced or 1200 double-spaced. I need to be concise.
      *   *Check Constraints:* No citations. Refer to positions generally (e.g., "proponents of the ideal advisor model").
      *   *Check Tone:* Needs to sound like a prospectus. "I propose," "This project will," etc.
      *   *Refining the Research Question:* Make sure it admits a determinate answer. It shouldn't just be "Is it good?" It should be "Does X lead to Y or Z?"
      *   *Refining the Scope:* Be honest. Don't promise to solve the conflict between morality and self-interest. Promise to analyze the *structural implications* of that conflict for indirect normativity.

  5.  **Drafting the Content (Iterative process):**

      *   *Header:* Title, Candidate, Context.
      *   *Abstract/Intro:* Hook the reader with the standard debate, then pivot.
      *   *The Question:* Focus on the "Unity Constraint."
      *   *The Gap:* Point out the tacit assumption of the "whole person" ideal.
      *   *Method:* Step-by-step analysis.
      *   *Outcomes:* Collapse vs. Incoherence.
      *   *Deliverable:* Taxonomy.
      *   *Scope:* The "Semester Limit."

  6.  **Final Review against Prompt:**
