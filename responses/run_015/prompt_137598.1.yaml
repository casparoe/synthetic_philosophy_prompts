  **CEDAR BASIN REGIONAL AUTHORITY**
  **BOUNDARY COMMISSION**
  **IN RE: FRANCHISE PETITION OF MILL CREEK SETTLEMENT**
  **OPINION OF THE COMMISSION**

  **I. PRELIMINARY DETERMINATIONS AND STATUTORY CONSTRAINTS**
  [High Confidence] The enabling statute of the Cedar Basin Regional Authority limits franchise in Authority referenda to "inhabitant voters." We interpret "inhabitant" to require physical residence within the geometric boundary of the District. Mill Creek lies outside this boundary. To grant full voting rights to non-inhabitants would require a statutory amendment by the legislature. This Commission lacks the authority to override the statutory text. Therefore, the petition for full enfranchisement of the non-resident population of Mill Creek is denied. This conclusion rests on settled administrative law and requires no novel interpretation of our precedents.

  **II. APPLICATION OF EXISTING PRECEDENTS**
  [High Confidence] We turn to the status of specific subgroups within Mill Creek under our existing franchise track record.

  *   **The Commuters:** Approximately two hundred Mill Creek residents work within the District. Under our *Commuter Precedent*, individuals subject to fare enforcement, transit police, and street ordinances are enfranchised regardless of residency. These workers enter the District daily and submit to its coercive power. They qualify for the franchise.
  *   **The Minors:** Approximately sixty residents are aged sixteen or seventeen. Under our *Youth Precedent*, age is not a bar to voting. However, that precedent applies to *inhabitants*. As non-inhabitants, they do not qualify under this rule alone. They qualify only if they also meet the *Commuter* test.
  *   **The Non-Working Residents:** The remaining population (approx. 640 souls) neither works nor owns property in the District. They are not subject to our police power, fines, or arrest.

  [High Confidence] Here, our precedents diverge. The *Non-Resident Owner Precedent* dictates that those outside the boundary who pay taxes and are affected by property value decisions are **out**. Mill Creek residents do not pay our taxes, but they are affected by our stormwater decisions. If we apply the logic of *Non-Resident Owners* strictly, they are **out**. If we apply the logic of the "Unchecked Power" test proposed by the petitioners, they are **in**, as the County offers them no stormwater protection and they cannot vote for us.

  **III. THE LIMIT OF PRECEDENT**
  [Speculative] We find that our precedents run out at this boundary. The *Non-Resident Owner* case turned on financial interest and the ability to exit the market (sell property). The *Commuter* case turned on submission to coercive state power (police/fines). Mill Creek residents present a third category: physical vulnerability to District infrastructure (flooding) without submission to District coercion and without the market exit options of property investors.

  To adopt the "Unchecked Power" test as a general rule for full franchise would quietly reverse the *Non-Resident Owner Precedent*. Owners outside the boundary are also subject to decisions that shape their prospects (tax rates/zoning) and often lack a checking body specific to our Authority. We decline to overturn that precedent by implication. However, to deny Mill Creek any recourse ignores the unique severity of physical flooding versus financial loss, and the County's admitted inability to check our stormwater authority.

  **IV. RULING AND REMEDY**
  [High Confidence] Accordingly, we rule as follows:
  1.  **Full Franchise:** Granted only to the two hundred Mill Creek residents who qualify as Commuters. Denied to all other Mill Creek residents.
  2.  **Advisory Delegate:** The Commission grants Mill Creek a single non-voting delegate to the Advisory Board, with the specific authority to table stormwater motions affecting the Mill Creek watershed.

  [High Confidence] This remedy respects the "Inhabitant" statute while acknowledging the gap in our precedents. It avoids the reversal of *Non-Resident Owners* (who receive no delegate) by distinguishing financial loss from physical habitability.

  **V. PRINCIPLES AND FUTURE DISCRIMINATION**
  [Speculative] By choosing this path, we commit to a principle of **Coercive Power for Full Franchise, Remedial Representation for Physical Vulnerability.** We affirm that the vote is tied to submission to the District's police power or residency, but that the District's moral obligation extends to those whose physical safety we control without their consent.

  [Speculative] The single further case that would best discriminate between the surviving rules (Coercive Power vs. Unchecked Power) is: **A downstream community affected by airborne particulate pollution from a District waste incinerator.**
  *   Under the *Coercive Power* rule, they are denied representation (no police power over them).
  *   Under the *Unchecked Power* rule, they are granted representation (health shaped by us, no other check).
  *   Our ruling today suggests they would qualify for a Delegate, but not a vote.

  **VI. NOTE ON DEMOCRATIC THEORY**
  [High Confidence] We anticipate objection to the compromise remedy.
  **The claim a democratic theorist is most likely to reject is:** *"A single delegate with tabling authority constitutes a sufficient check on unchecked power to satisfy democratic legitimacy without enfranchisement."*
  Theorists will argue that without the vote, the "unchecked power" remains unchecked, as tabling authority is not veto power, and the delegate represents 900 people against a Board of elected inhabitants. We accept this criticism but hold it is the maximum remedy available within our statutory and precedential constraints.

  **SO ORDERED.**

  ***

  ### Analysis of the Drafting Choices

  **1. Coherence with Precedents**
  *   **Closest Analog:** The *Non-Resident Owner* case is the closest analog for the **exclusion** from full franchise. Both groups are outside the boundary and affected by District decisions. To be consistent, Mill Creek must be excluded from the full vote, just as owners are.
  *   **Where Rules Come Apart:**
      *   *Coercive Power Rule:* Excludes Mill Creek (except commuters). Fits *Commuter* and *Detainee* cases. Consistent with *Non-Resident Owner* exclusion.
      *   *Unchecked Power Rule:* Includes Mill Creek. Fits the moral intuition of the flooding risk. **Conflict:** If applied consistently, it would require enfranchising *Non-Resident Owners* (who also lack a checking body for specific Authority decisions), thereby reversing that precedent.
  *   **Resolution:** I chose to admit precedents "run out" regarding the *remedy* (the Delegate) while holding the line on the *franchise* (the Vote) to avoid reversing *Non-Resident Owners*.

  **2. Statutory Weight**
  *   **"Inhabitant Voters":** I gave this **High Confidence/Dispositive Weight**. Full enfranchisement of non-inhabitants is legally impossible without legislative amendment. This forces the ruling toward Denial or Delegate. It makes the "Full Enfranchisement" option a non-starter for the Commission, regardless of moral merit.

  **3. Principles Committed**
  *   **Full Enfranchisement:** Would commit to "All Affected Interests" (Unchecked Power). Risks reversing *Non-Resident Owner* precedent and violating statute.
  *   **Partial (Commuters Only):** Commits to "Subjection to Coercive Power." Highly consistent, but leaves the flooding vulnerability unaddressed.
  *   **Delegate:** Commits to "Remedial Representation for Physical Vulnerability." Novel, but fits the "precedents run out" instruction.
  *   **Denial:** Commits to "Boundary Formalism." Consistent with *Non-Resident Owners*, but ignores the unique inability of Mill Creek to incorporate or annex.

  **4. The Further Case**
  *   **Airborne Pollution Case:** This discriminates between the rules because it removes the "water/flooding" specificity. If the Commission grants a delegate for pollution, they confirm the *Unchecked Power/Physical Harm* principle. If they deny, they confirm the *Coercive Power* principle (or limit the Delegate to hydrology only).

  **5. Confidence Markers & Theorist Claim**
  *   **Markers:** I marked statutory interpretation and precedent application as **High Confidence** (legal constraints). I marked the distinction between financial and physical harm as **Speculative** (this is the novel legal theory being introduced).
  *   **Theorist Claim:** I identified the sufficiency of the Delegate as the weak point. A democratic theorist would argue that "no taxation/representation without a vote" is violated, and that a non-voting delegate is tokenism, not a check. This aligns with your instruction to single out a claim a theorist would reject.
