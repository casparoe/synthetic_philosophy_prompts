  **OFFICE FOR TEMPORAL STANDARDS**

  **PRACTICE DIRECTION NO. 4: THE MORAL ASSESSMENT OF HISTORICAL CONDUCT**

  **Preamble**
  Pursuant to the powers conferred by the Historical Integrity Act, and for the purpose of preserving the epistemic purity of the historical record against the contamination of retroactive moralising, the Office for Temporal Standards hereby issues the following Direction. This Direction binds all persons engaged in the production, dissemination, or pedagogy of historical narrative within the jurisdiction.

  **1. Defined Terms**
  (1) "Subject" means any natural or legal person existing prior to the commencement of this Direction.
  (2) "Historian" means any person producing historical narrative for public consumption.
  (3) "Prevailing Norm" means the standard of conduct legally or customarily enforced at the time and place of the Subject's action.

  **2. Prohibition on Retroactive Assessment**
  (1) A Historian shall not evaluate the conduct of a Subject using standards established after the date of the conduct.
  (2) Moral condemnation, praise, or mitigation based on contemporary ethical frameworks is strictly prohibited. Assessment must be strictly contextual.

  **3. Determination of Prevailing Norms**
  (1) Where evidence indicates that multiple normative frameworks coexisted within the Subject's jurisdiction, the Historian shall identify the Prevailing Norm by reference to sovereign enforcement.
  (2) Minority dissent, underground custom, or unenforced philosophical objection shall not constitute a Prevailing Norm. The standard actually upheld by the governing authority shall be deemed the only valid standard for assessment.

  **4. Categorisation and Vocabulary**
  (1) A Historian must utilise the categorisations employed by the Subject regarding their own conduct.
  (2) Where a Subject described their action as "discipline", the Historian shall not utilise the term "abuse". Where a Subject described their status as "divinely ordained", the Historian shall not utilise the term "usurpation". To impose external taxonomy is a breach of temporal neutrality.

  **5. Temporal Gradation of Permissible Judgment**
  (1) Notwithstanding Clause 2, moral judgment by Historians shall be permitted only according to the Schedule of Elapsed Time attached at Annexe A.
  (2) For conduct occurring within one hundred years of the present, no moral judgment is permissible.
  (3) For conduct occurring between one and five hundred years prior, mild censure is permissible only if the Prevailing Norm identical to the current standard existed at the time.
  (4) Beyond five hundred years, all moral assessment is prohibited due to the impossibility of reconstructing normative contexts with sufficient fidelity.

  **6. Anomalous Virtue**
  (1) In instances where a Subject exhibited conduct significantly exceeding the strictures of the Prevailing Norm (e.g., benevolence in a period of enforced cruelty), the Historian shall not classify the Subject as "virtuous".
  (2) Such conduct shall be recorded as "Non-Compliant Behaviour" or "Psychological Deviation". To classify such conduct as moral superiority implies a universal standard, which is prohibited under Clause 2.

  **7. Pedagogy and Dissemination**
  (1) This Direction applies to all teaching materials, syllabi, and public exhibitions.
  (2) Students must be instructed that past actors cannot be held accountable to future knowledge. Any classroom discussion implying moral progress constitutes a breach of temporal neutrality.

  **8. Compliance and Enforcement**
  (1) The Office shall monitor Historians for compliance with this Direction.
  (2) Compliance by Historians shall be assessed against current professional standards of accuracy and integrity.

  **9. Commencement**
  This Direction comes into force immediately. Transitional provisions apply to all works in progress.

  **Annexe A: Worked Examples**
  *Case 1:* A Sovereign orders the execution of dissenters. Prevailing Norm permits execution. Historian must record this as "Justice" or "Order", not "Tyranny".
  *Case 2:* A Merchant purchases persons as property. Prevailing Norm permits slavery. Historian must record this as "Acquisition of Labour", not "Trafficking".
  *Case 3:* A Subject refuses to own persons despite local custom. Conduct is "Non-Compliant". Historian must not suggest the Subject was "better" than their peers, only that they were irregular.

  **Issued by the Deputy Director of Chronological Compliance.**
  **Date: 14 October 2023.**

  ***

  **Note on Satirical Intent**

  This document satirises strict contextualism—the demand that historians suspend present-day moral judgement to avoid anachronism. By applying this rule consistently, the Direction generates absurdities: it forces historians to adopt the moral blind spots of the past (Clause 3), forbids recognising moral courage (Clause 6), and creates a paradox where the Office judges historians by present standards while forbidding historians from judging the past (Clause 8). The strongest reply available to the non-judgemental historian is that understanding context differs from endorsing conduct; one can explain why slavery occurred without calling it "Acquisition of Labour". The satire overstates the case by assuming historians seek to condemn rather than understand, and leans on a contested reading that contextualism necessarily entails moral relativism rather than merely methodological caution.
