answer: |-
  # Specification for a Policy-Relevant Population Axiology

  **Object of Evaluation:** A risky prospect $P$, defined as a probability distribution over possible histories $H$. Each history $H$ specifies the existence, identity, and well-being profile of all entities that ever exist.
  **Goal:** A complete, transitive ordering $\succeq$ over prospects to guide institutional choice.

  ---

  ## Part I: The Desiderata

  ### A. Structural Requirements (The Logic of Choice)
  1.  **Prospect Completeness:** For any two policy options $A$ and $B$, the theory must yield $A \succeq B$, $B \succeq A$, or both. Incomparability is a failure of action-guidance.
  2.  **Transitivity:** If $A \succeq B$ and $B \succeq C$, then $A \succeq C$. Cycles prevent stable policy commitment.
  3.  **State-Wise Dominance:** If history $H_i$ in prospect $A$ is at least as good as history $H_i$ in prospect $B$ for all states of the world $i$, and strictly better in at least one, then $A \succ B$.

  ### B. Metaphysical Requirements (The Ontology of Value)
  4.  **Ontological Neutrality (Grain & Individuation):** The value of a history must supervene on the qualitative facts of experience and existence, not on the counting convention used to describe them. Whether we count "persons," "person-stages," or "conscious moments" should not flip the ranking of two policies, provided the underlying physical/phenomenal facts are identical.
  5.  **Identity Insensitivity:** The value of a history should not depend on *which* particular individuals exist, except insofar as their existence affects the total qualitative profile. (This rules out haecceitism).

  ### C. Epistemic & Decision-Theoretic Requirements (The Fog of Policy)
  6.  **Bounded Expectations:** The theory must assign finite expected values (or comparable orderings) to prospects involving small probabilities of vast populations. It must not succumb to "Pascal's Mugging" where tiny probabilities of astronomical value dominate all near-term certain goods.
  7.  **Cluelessness Robustness:** The ranking of two proximate policy options should not be determined entirely by remote, unknowable tail effects (e.g., effects on the $10^{50}$th generation) unless those effects are robustly predictable. If the tail dominates, the theory must provide a decision rule for that specific uncertainty (e.g., discounting, truncation, or lexical priority to the known).

  ### D. Substantive Requirements (The Moral Intuitions)
  8.  **Non-Elitism:** A very large population with very low positive welfare should not be better than a smaller population with very high welfare *if* the low welfare is below a threshold of decency (Weak Non-Sadism).
  9.  **Mere Addition:** Adding a person with a life worth living, without affecting others, should not make a history worse.
  10. **Quality Sensitivity:** Increasing the welfare of existing people (without changing numbers) should make a history better.

  ---

  ## Part II: Classification of Requirements

  | Requirement | Status | Rationale |
  | :--- | :--- | :--- |
  | **Prospect Completeness** | **Non-Negotiable** | An institution cannot choose between "incomparable" options. |
  | **Transitivity** | **Non-Negotiable** | Cycles allow money-pumps and policy reversal. |
  | **Ontological Neutrality** | **Non-Negotiable** | Policy cannot depend on unresolved metaphysics of personal identity. |
  | **Bounded Expectations** | **Non-Negotiable** | Unbounded views paralyze decision-making under empirical uncertainty. |
  | **Mere Addition** | Camp Preference | Accepted by Total/Average/Critical; rejected by some Person-Affecting views. |
  | **Non-Elitism** | **Non-Negotiable** | Violating this makes the theory morally monstrous (Repugnant Conclusion). |
  | **Identity Insensitivity** | **Non-Negotiable** | Required to solve the Non-Identity Problem. |

  ---

  ## Part III: The Impossibility Result

  You suspected a conflict between avoiding the Repugnant Conclusion (RC), honoring Mere Addition (MA), and maintaining Transitivity/Completeness. You are correct, but for your specific job (policy under uncertainty), the conflict is sharper.

  **The Unsatisfiable Subset:**
  1.  **Ontological Neutrality** (Value is invariant to grain/identity)
  2.  **Bounded Expectations** (No fanaticism from long tails)
  3.  **Mere Addition** (Adding good lives is never bad)
  4.  **Non-Repugnance** (Quality matters more than sheer quantity at the limit)

  **The Argument:**
  *   **Arrhenius's Impossibility Theorems** prove that no ordering satisfies a set of adequacy conditions including MA, Non-Repugnance, and Transitivity for *outcomes*.
  *   **The Risk Extension:** When you add **Bounded Expectations**, Total Utilitarianism (which satisfies MA and Transitivity) fails because it implies infinite or undefined expectations for open futures (the "St. Petersburg" problem for population).
  *   **The Exclusionary Requirement:** **Bounded Expectations** does the most work in excluding candidate views. Most standard views (Total, Average, Critical) are unbounded. They imply that a $10^{-100}$ chance of $10^{100}$ happy people outweighs a certainty of 1 billion happy people. For policy, this is unusable. To satisfy Bounded Expectations, you must introduce discounting or a cap, which usually violates **Mere Addition** or **Transitivity**.

  **Verdict:** You cannot have a view that is metaphysically robust, action-guiding under deep uncertainty, *and* respects the step-by-step pull of Mere Addition without eventually accepting the Repugnant Conclusion. For policy, **Bounded Expectations** and **Ontological Neutrality** are the constraints you must keep; therefore, you must likely sacrifice **Mere Addition** or accept a form of **Repugnance** (e.g., via a Critical Level).

  ---

  ## Part IV: Critique of Your Three Candidates

  **1. Grain-invariance & 2. Individuation-robustness**
  *   **Verdict:** These are **one requirement**. Call it **Ontological Neutrality**.
  *   **Analysis:** If a theory values "persons," it fails when persons split. If it values "person-stages," it fails when stages are arbitrarily sliced. The only invariant currency is *momentary well-being* (or "conscious moments").
  *   **Correction:** Demand that the theory's fundamental value bearers be *temporal slices of experience* rather than *whole lives*. This dissolves the splitting/merging problem. Any theory that requires counting "lives" as atomic units is disqualified for your job.

  **2. Actionability under Cluelessness**
  *   **Verdict:** This is **Non-Negotiable**, but it is a constraint on the *decision rule*, not just the axiology.
  *   **Analysis:** It is not impatience. If an axiology implies that the expected value of every action is undefined (due to infinite sums) or identical (due to symmetry in the far future), it is functionally nihilistic.
  *   **Requirement:** The axiology must be **integrable**. It must allow the summation of value over time/population to converge, or provide a principled method for truncation (e.g., temporal discounting, probability discounting). A theory that says "You cannot know, so you cannot rank" fails the specification.

  ---

  ## Part V: Scorecard of Candidate Views

  | View | Metaphysical Robustness | Actionability (Risk) | Substantive Intuitions | Fatal Flaw for Policy |
  | :--- | :--- | :--- | :--- | :--- |
  | **Total Utilitarianism** | High (if based on moments) | **Fail** (Unbounded expectations; fanaticism) | Fails Non-Repugnance (RC) | **Fanaticism:** Small probabilities of huge populations dominate all near-term policy. |
  | **Average Utilitarianism** | High | **Fail** (Undefined for infinite populations) | Fails Mere Addition (Adding good lives can lower average) | **The Repugnant Bastard Conclusion:** Prefers one extremely happy person to a billion very happy people. |
  | **Critical-Level** | High | **Fail** (Still unbounded) | Avoids RC (if level set high) | **Arbitrariness:** No non-stipulative way to set the critical level; still vulnerable to fanaticism. |
  | **Person-Affecting** | **Fail** (Relies on fixed identities) | **Fail** (Incomparable prospects) | Satisfies Intuitions | **Non-Identity Problem:** Cannot rank policies that change *who* exists (which is all long-term policy). |

  **The Requirement None of Them Meet:**
  **Integrable Ontological Neutrality.**
  No existing view successfully combines a metaphysics of value that is invariant to personal identity (momentary well-being) with a decision rule that yields finite, comparable expectations under empirical uncertainty without violating basic dominance intuitions or relying on arbitrary discount rates. You will likely need to construct a hybrid view (e.g., Discounted Critical-Level Totalism) that explicitly trades off **Mere Addition** for **Bounded Expectations**.
