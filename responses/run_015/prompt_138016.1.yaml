      *   *Actionability under Cluelessness:* This is tricky. Is it a demand on the *axiology* or the *decision theory*? If the axiology yields infinite or undefined expectations, the decision theory breaks. So, the axiology must yield *finite, comparable values* for prospects. This is Non-Negotiable for the stated *job*, even if pure theorists ignore it.

