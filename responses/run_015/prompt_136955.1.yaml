answer: |-
  The 2012 ENCODE controversy offers a rigorous test case for the Gould–Lewontin critique of the adaptationist programme, transposed from organismal morphology to molecular genetics. To map this episode strictly, we must first identify the analogues to the traits and adaptive stories targeted in 1979. Here, the "traits" are specific genomic sequences exhibiting biochemical activity—transcription, binding, or chromatin accessibility. The "adaptive story" advanced by the consortium was an inference from current activity to selective maintenance: because a sequence does something biochemical, it must be there because selection kept it there.

  Paradoxically, the consortium occupies the position of the Panglossian adaptationist in the Gould–Lewontin sense, despite the critics relying heavily on selectionist arguments. The consortium's procedure was to atomize the genome into active segments and assign function based on presence alone, treating the failure to identify a specific organismal benefit as a gap in knowledge rather than evidence of non-function. This matches the adaptationist method Gould and Lewontin indicted: assuming utility without ruling out alternatives. The critics, conversely, argued from mutational load and phylogenetic conservation. Their argument presupposes that selection is strong enough to purge deleterious insertions (the load argument) and that functional elements must show historical constraint. Thus, the critics are selectionists regarding the *limits* of genome size, but methodologically anti-adaptationist regarding the *attribution* of function to specific sequences. The Gould–Lewontin critique indicts the consortium's procedure, not necessarily their conclusion (which turned out to be wrong), specifically the leap from causal role to selected effect without comparative elimination of null hypotheses.

  Applying the four-category partition to the disputed sequence clarifies where biochemical assays fail. The categories are: (1) elements maintained by selection for organismal benefit; (2) architectural byproducts (spandrels); (3) exaptations; and (4) selfish sequences favored intragenomically. Biochemical activity is compatible with categories 1, 2, and 4. A transposon copy may be transcribed (activity) because it is selfish (category 4), or because it was co-opted (category 3), or because it is functional for the host (category 1). Biochemistry cannot discriminate between these because it measures current causal capacity, not historical origin or beneficiary. To discriminate, one requires phylogenetic conservation (to identify category 1) and population-genetic modeling of mutation-selection balance (to distinguish category 1 from 4 and neutral noise).

  This raises a critical theoretical question regarding the fourth category. Selfish DNA is an alternative to organismal adaptation that Gould and Lewontin's original list effectively omits. Their critique focused on architectural constraints and exaptation within the context of the organism as the unit of benefit. Selfish DNA, however, is adapted—it is selected—but the beneficiary is the replicator, not the organism. This is not a spandrel under another name; a spandrel is a non-adaptive byproduct of constraint, whereas selfish DNA is adaptive at a lower level of selection. The genome undermines the organismal presupposition of the spandrels critique in a way morphology does not. In morphology, the trait and the organism are physically coincident; in the genome, the "trait" (a sequence) can have fitness interests divergent from the vehicle carrying it. The adaptationism-versus-spandrels frame assumes the organism is the only relevant beneficiary, a presupposition the molecular data explicitly violates.

  Regarding the burden of proof, the episode complicates the standard reading of the critique. Gould and Lewontin are often read as denying that adaptedness is the default hypothesis. At the genome scale, is "junk" the default? Under neutral theory, the null hypothesis is indeed non-function, but establishing that a stretch of DNA is junk is a substantive claim requiring population-genetic support (e.g., demonstrating that effective population size is too small to purge the sequence, or that load constraints would be violated if it were functional). It is not merely a skeptical shrug. A test satisfying Gould and Lewontin's positive proposals would have required the consortium to employ the comparative method: demonstrating that the biochemical activity is conserved across lineages divergent enough that neutral drift would have erased it. This is precisely the evidence the critics marshaled—phylogenetic constraint—while the consortium relied on single-species biochemistry. Neither side fully satisfied the demand for a complete historical reconstruction, but the critics aligned closer to the comparative requirement by invoking cross-species data to infer selection.

  The verdict on whether the case tests the theory is mixed. The episode vindicates the spandrels critique as a diagnosis of overreach: the consortium assumed function without ruling out alternatives, precisely the error Gould and Lewontin described. However, it exposes the critique as having insufficient resources for resolution. The dispute was not settled by identifying architectural constraints or exaptations, the alternatives Gould and Lewontin championed. It was settled by conservation data and population genetics, tools rooted in neutral theory and selectionist quantification rather than structuralist constraint. The resolution came from showing that most activity is not constrained, not by showing it is a necessary byproduct of genome architecture.

  Furthermore, Gould's insistence on separating historical origin from current utility dissolves part of the dispute as verbal, but deepens it substantively. If "function" means causal role (current utility), the consortium was correct: 80 percent of the genome does something. If "function" means selected effect (historical origin), the critics were correct: only ~10 percent is conserved. In evolutionary biology, however, "function" standardly implies selected effect. Therefore, the dispute is not merely verbal; it is about whether evolutionary explanation requires historical justification. The consortium's error was treating current utility as sufficient for evolutionary explanation, which the critique correctly identifies as a category mistake.

  Finally, we must be explicit about the silence of the adaptationism-versus-spandrels frame. There are at least two features of this episode the frame cannot reach without importing additional theory. First, the frame cannot adequately handle neutral drift. Gould and Lewontin focused on non-adaptive traits arising from *constraint* (spandrels), but much junk DNA is non-adaptive due to a *lack of selection pressure* (drift). The spandrels critique lacks the vocabulary for neutrality distinct from constraint. To reach this, one must import near-neutral theory and population genetics. Second, the frame cannot resolve the selfish DNA category because it presupposes the organism as the unit of adaptation. To explain sequences that are functional for themselves but deleterious for the host, one must import a levels-of-selection framework or gene-centered view. The spandrels critique remains bound to the organismal level, leaving it blind to intragenomic conflict. Thus, while the critique correctly diagnoses the methodological overreach of the consortium, it lacks the theoretical machinery to explain the actual nature of the non-adaptive genome, which is governed as much by drift and intragenomic competition as by architectural constraint.
