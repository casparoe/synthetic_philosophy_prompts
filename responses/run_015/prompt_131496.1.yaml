prompt: |-
  hey so im writing a novel about a philosopher stuck in 1829 calcutta arguing with british magistrates and local pundits over widow-burning. i need you to analyze the actual 1829 sati abolition through a lens im calling 'moral translation failure'—the idea that norms dont just differ across cultures but are embedded in different ontologies of duty and pollution, so you cant translate the practice without breaking its internal logic. map out who the real actors were, what the theory says each side should have seen, where the british universal-rights framing misses the internal logic, and whether the episode proves relativism or just shows translation is hard. also be honest: where does my lens break? does it excuse too much? keep it tight, no bibliographies please, i hate those. and dont quote anyone verbatim.
reasoning: |-
