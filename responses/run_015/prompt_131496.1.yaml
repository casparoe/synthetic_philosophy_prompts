      *   *Application:* "Duty" (Dharma) vs. "Rights" (Liberty). "Pollution/Purity" vs. "Crime/Punishment".
      *   *Failure:* When the British say "murder," the pundits hear "sacrifice." When pundits say "dharma," the British hear "superstition." The translation collapses the meaning.

  4.  **Drafting - Section by Section:**

      *   **The Actors:**
