  hey so i know everyone is groaning about the new management mandate requiring causal justification in every post-mortem and honestly i get it because asking engineers to derive causality from logs feels like asking a mechanic to explain thermodynamics every time they change oil but since we have to do it i tried to draft a decision procedure that bridges the gap between the counterfactual theory most of us use intuitively and the interventionist theory that actually matters for fixing things and i want to walk you through how it works before we try to socialize it with the rest of the reliability team. the core idea is to treat causality not as a single binary switch but as a funnel where we filter out coincidences early and only label something a root cause if it passes both a necessity test and a recoverability test so the first question you ask during the review is strictly counterfactual and you need to imagine a world where the suspected change never happened and ask if the outage would have occurred at the exact same time and severity regardless. if the answer is yes because the system was already overloaded or dependent on a failing third party then you stop immediately and mark the change as not caused because a cause must be necessary in this context and there is no point in blaming a deploy that happened to land during a fire. if the answer is no and you believe the outage would not have happened without the change then you pass to the second stage which is the interventionist test and this is where we get practical because you have to ask if reverting the change or flipping the flag back restores service within our recovery time objective. if the system recovers cleanly then you have confirmed causality and you can move on to writing the remediation tasks but if the system does not recover you hit a critical stop point where you must determine why the intervention failed. here is where we need an explicit flag for value judgment because sometimes the intervention fails due to hysteresis or corrupted state rather than the change being irrelevant so if state corruption prevents rollback success you must note that the cause is valid counterfactually but interventionally opaque which means we list it as a trigger but not the root cause of the persistence. now applying this to the database migration case where traffic spiked during the deploy we run the counterfactual first and ask if the traffic spike alone would have taken down the old schema and if our capacity planning says yes then the migration is not the cause even if intuition screams otherwise because the system was fragile regardless of the change so we stop there and mark the migration as coincidental unless the migration specifically reduced capacity which requires evidence not vibes. for the feature flag case where rolling back does nothing because bad data propagated we hit the interventionist wall hard because the system does not recover so under a strict interventionist reading this procedure forces us to say the flag toggle was not the root cause of the ongoing outage even though everyone in the room will hate that answer because the root cause of the persistence is the lack of data sanitization not the toggle itself. this is where the checklist might misfire because it conflates the trigger with the vulnerability and if we cannot intervene on the trigger to fix the state we risk blaming the wrong layer so we need an explicit flag here that says intervention impossible due to state coupling and we acknowledge that while the toggle started the fire the lack of scrubbing is why we cannot put it out. the biggest risk in this procedure is when the interventionist test is impossible because rolling back is too dangerous or slow leaving us with pure counterfactual reasoning that might be misleading because we are simulating a world we cannot observe and we might end up blaming a change that was actually harmless but coincided with a failure we do not understand. i think what would change my mind on this balance is if we found a case where preventing the trigger was vastly cheaper than fixing the state but the procedure deprioritizes the trigger because it failed the recovery test since ultimately reliability is about prevention not just cure and if this checklist stops us from fixing the cheap lever because it does not reverse the damage then we are optimizing for the wrong outcome.
