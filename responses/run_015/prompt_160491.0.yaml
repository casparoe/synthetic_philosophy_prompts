  In margins thin they noted lack of bread,
  At vespers tolled the heavy iron bell,
  The sexton dragged the wet and wooden bier,
  The abbot waited for the absent heir,
  The fields were drowned beneath the constant rain,
  And so they closed the book upon the year.

  Year died and birthed another dying year,
  The people starved for want of common bread,
  The sky was brass and would not send us rain,
  The only sound was that of one sad bell,
  The lord died intestate without an heir,
  They nailed the planks to build a heavy bier.

  Bier followed bier, they carried out the bier,
  Winter extended its dominion year,
  The line expired leaving no living heir,
  There was no memory left of tasting bread,
  Silence consumed the tower and the bell,
  God turned his face away from all this rain.

  Rain was excused as cause for lack of rain,
  The carpenter charged extra for the bier,
  The sexton slept and never rang the bell,
  The scribe forgot to close the account year,
  The mice ate more than monks ate of the bread,
  The lawyers feasted while they sought the heir.

  Heir to nothing, the land waited an heir,
  We choose to mark the season of the rain,
  We choose to count the loaves of missing bread,
  We choose to note the weight of every bier,
  We choose the limits of the fiscal year,
  We choose the moment when we ring the bell.

  Bell tolls alone, no hand upon the bell,
  There is no claimant to become the heir,
  Time moves regardless of the measured year,
  The clouds dissolve and release the rain,
  The dead require the wood to make a bier,
  The living need the grain to make the bread.

  Bread and the bell are silent on the shape,
  The bier, the heir, the record limits choice,
  Rain falls, we choose the form to fit the year.
