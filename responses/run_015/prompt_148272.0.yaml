answer: |-
  # Specification for Moral Demand Adequacy

  You are asking for a calibration standard before measuring the instrument. That is correct procedure. Below are the desiderata derived from your eight cases and the required distinctions. Each is framed as a test condition.

  ### I. The Desiderata

  **1. The Coordination Index (Case: Pond with 11 Bystanders)**
  *   **Test:** The theory must specify whether Agent A's obligation to wade in changes if Agent B has already waded in, given the child needs two rescuers.
  *   **Requirement:** The theory must state whether moral demand is *fixed* (you must wade regardless of others) or *conditional* (you must wade only if needed).
  *   **Status:** **Non-Negotiable (NN).** A theory that cannot distinguish between redundant and necessary action cannot guide action in collective contexts.
  *   **Invented Parameter:** Rescue cost = 1 hour of ruined clothing. Child's life value = $\infty$ (lexical priority).

  **2. The Common Numeraire (Case: The Retiree)**
  *   **Test:** The theory must accept an input of 10 hours of time, $1,000 of assets, and 1 unit of social discomfort, and output a single magnitude of "sacrifice."
  *   **Requirement:** The theory must either provide a conversion rate between these currencies or explicitly declare them incommensurable (lexically ordered).
  *   **Status:** **Camp Preference (CP).** Consequentialists require this; Deontologists often reject it. However, for *your* purpose (planning a life), a theory lacking this is operationally useless to you.
  *   **Invented Parameter:** Pension surplus = $15,000/year. Free time = 30 hours/week.

  **3. The Ex Ante/Ex Post Cut (Case: The Null Result)**
  *   **Test:** Agent spends 20 years on a project with 10% ex ante probability of saving 1 million lives. It fails. Did Agent meet their demand?
  *   **Requirement:** The theory must locate the moral value in the *expectation* (the bet) or the *outcome* (the payoff).
  *   **Status:** **NN.** A theory that shifts criteria based on outcome luck cannot be used for prospective planning.
  *   **Invented Parameter:** Ex ante probability = 0.10. Ex post benefit = 0.

  **4. The Capacity Baseline (Case: The Second Career)**
  *   **Test:** Agent can train for 2 years at high cost to double their future earning capacity for good. Is the demand calculated on current capacity or potential capacity?
  *   **Requirement:** The theory must define the "can" in "ought implies can." Is it current ability or optimized ability?
  *   **Status:** **NN.** Without this, the demand moves as the agent moves, creating a instability loop.

  **5. The Hysteresis Clause (Case: The Two Agents)**
  *   **Test:** Agent A has sacrificed 50% of income for 10 years. Agent B has sacrificed 0%. Both are identical today. Does Agent A have a lower demand today?
  *   **Requirement:** The theory must state whether moral requirements *supervene* on the present state alone or integrate the historical trajectory.
  *   **Status:** **CP.** Most formal theories demand present supervenience (history is irrelevant). Moral intuition often demands hysteresis (fairness credits past effort).
  *   **Invented Parameter:** Past sacrifice = $200,000 total. Current income = $50,000/year.

  **6. The Calibration Reference (Case: The Moving Baseline)**
  *   **Test:** Agent trains themselves to enjoy poverty and labor. The sacrifice of giving away money drops to zero subjective cost. Does the demand increase to match the lowered cost?
  *   **Requirement:** The theory must specify the reference level for "sacrifice." Is it actual psychological cost, or the cost to a "standard" agent?
  *   **Status:** **NN.** If reference is actual desire, the theory incentivizes moral self-lobotomization. If standard, it ignores actual welfare loss.
  *   **Invented Parameter:** Subjective cost of donation = 0 (after training). Objective resource loss = $10,000.

  **7. The Risk Asymmetry (Case: Risk to Agent)**
  *   **Test:** Option A: Certain cost $1,000, Certain good 1 unit. Option B: 1% chance cost $100,000, 99% chance cost $0, Expected good 10 units.
  *   **Requirement:** The theory must specify if the agent is permitted to be risk-averse regarding their own sacrifice while the theory is risk-neutral regarding the good produced.
  *   **Status:** **NN.** Inconsistent risk attitudes create arbitrage opportunities where agents can game the system.
  *   **Invented Parameter:** Good units = Lives saved. Cost = Retirement security.

  **8. The Scale Invariance (Case: Universal Compliance)**
  *   **Test:** If 100% of agents comply, does the individual demand collapse (because marginal impact is zero) or hold (because duty is non-consequential)?
  *   **Requirement:** The theory must yield a stable verdict under full compliance conditions.
  *   **Status:** **NN.** A theory that works only under partial compliance is a heuristic, not a fundamental account.

  **9. The Deontic Granularity (Distinctions)**
  *   **Test:** The theory must separate four outputs: (1) Required, (2) Best but not Required, (3) Permitted, (4) Praiseworthy.
  *   **Requirement:** The theory must not collapse (2) into (1) (over-demandingness) or (1) into (3) (under-demandingness).
  *   **Status:** **NN.** Without this, the concept of "limit" is meaningless.

  ---

  ### II. The Physicist's Prejudices

  You asked for honesty regarding your imported laboratory habits. There are two significant tensions between your experimental training and ethical theory construction.

  **1. The Demand for Resolution (Verdict vs. Interval)**
  *   **Your Prejudice:** You want a theory to deliver a verdict (Required/Not Required) at a stated resolution, not an interval or a "shrug."
  *   **The Argument:** In physics, a measurement without an error bar is a lie. In ethics, a verdict without ambiguity is often a distortion. Moral concepts (like "sacrifice" or "need") are inherently vague predicates (the Sorites problem).
  *   **Verdict:** This is a **Prejudice.** Demanding binary resolution forces theories to draw arbitrary lines where none exist. An adequate theory should arguably output a *probability of obligation* or a *strength of reason*, not a boolean switch. Insisting on a binary verdict forces the theory to be more precise than the subject matter allows.

  **2. The Anti-Gerrymandering Constraint**
  *   **Your Prejudice:** You demand the theory not be gerrymandered to reproduce verdicts we antecedently like.
  *   **The Argument:** In physics, the data is independent of the theory. In ethics, the "data" (our considered judgments) is the *only* evidence we have for the theory. This method is called "Reflective Equilibrium." We *must* adjust the theory to fit the intuitions and the intuitions to fit the theory.
  *   **Verdict:** This is a **Category Error.** You cannot separate the "measurement" from the "instrument" in ethics. However, your core point stands: the theory should not be *ad hoc*. It should not add a new clause for every new case. It must have *predictive power* for cases we haven't thought of yet. So, keep the constraint, but understand that "fitting the data" is the job, not a bug.

  ---

  ### III. Incompatibilities (The Trilemma)

  You asked for pairs or triples that cannot be jointly satisfied. There is a structural trilemma here. You cannot satisfy all three of the following simultaneously:

  1.  **Hysteresis (Desideratum 5):** Past sacrifice reduces current demand (Fairness).
  2.  **Present Supervenience (Implicit in most formal logic):** Moral status depends only on current facts, not history.
  3.  **Universalizability (Desideratum 8):** The rule must apply to anyone in the exact same current situation.

  **The Conflict:** If you allow Hysteresis (1), you violate Present Supervenience (2). If two agents are identical *now* but have different histories, and you treat them differently, you violate Universalizability (3) because the rule cannot be stated in terms of present facts alone.

  **Which to Drop:**
  If you want a theory that is **action-guiding for planning** (your goal), you must drop **Present Supervenience**. You need to track your life as a trajectory, not a snapshot. A theory that ignores your past sacrifice is instrumentally inadequate for a 71-year-old allocating a remaining lifespan. However, be warned: dropping Supervenience makes the theory computationally complex and vulnerable to accusations of special pleading.

  **Secondary Conflict:** **Common Numeraire (2)** vs. **Deontic Granularity (9).**
  If you have a single currency for all goods (time, money, integrity), it is very difficult to maintain a zone of "Permitted but not Required." If saving a life costs less currency than buying a coffee, the coffee becomes forbidden. To keep the Granularity, you usually need to reject the Common Numeraire (e.g., by saying integrity is lexically superior to welfare).

  ---

  ### IV. The Most Exclusionary Requirement

  **The Common Numeraire (Desideratum 2).**

  This requirement does the most work in excluding otherwise attractive candidates.
  *   **Why:** It forces the theory to be consequentialist in structure. It demands that time, risk, relationships, and money be comparable on a single scale.
  *   **Exclusion:** This immediately excludes most Deontological theories (which treat duties as side-constraints, not costs), most Virtue Ethics (which treats actions as expressions of character, not exchanges of value), and most "Personal Prerogative" views (which posit a sphere of life immune to moral calculation).
  *   **Is it for a good reason?** For *your* specific purpose (allocating a retirement portfolio of time and money), yes. You cannot plan a life with incommensurable currencies. But for a general theory of morality, it is a reductionist imposition. It assumes morality is an optimization problem. If morality is actually about *constraints* or *relationships*, this requirement blinds the theory to its primary subject matter.

  ---

  ### V. Scorecard

  **Scalar and Satisficing Consequentialism**
  *   **Score:** High on Numeraire, Low on Granularity.
  *   **Assessment:** These theories handle your Retiree case (2) and Risk case (7) well by converting everything to expected utility. However, they fail the Deontic Granularity (9); scalar views deny the "required/permitted" distinction entirely (everything is just better/worse), which defeats your request for a limit. Satisficing views (do "enough") struggle to define the threshold without arbitrariness, failing your Resolution prejudice.

  **Views with a Personal Prerogative (e.g., Scheffler)**
  *   **Score:** High on Granularity, Low on Numeraire.
  *   **Assessment:** These protect a sphere of personal life from moral demand, satisfying your need for a limit. However, they typically fail the Common Numeraire (2); they assert a lexical break between "mine" and "the good" rather than a conversion rate. They also struggle with Universal Compliance (8); if everyone exercises their prerogative, does the good get done?

  **Motivation-Limited Views (e.g., Williams, Wolf)**
  *   **Score:** High on Hysteresis/Baseline, Low on Resolution.
  *   **Assessment:** These argue demand is limited by what preserves your integrity or sanity. They handle the Moving Baseline (6) well by referencing the agent's actual psychology. However, they fail your Resolution prejudice; "integrity" is vague. They also risk collapsing into subjectivity, where a selfish person has lower demands than a saintly one (failing Universalizability).

  **Unlimited Views (e.g., Strong Act Utilitarianism)**
  *   **Score:** High on Scale Invariance, Low on Retiree Feasibility.
  *   **Assessment:** These satisfy Universal Compliance (8) and Ex Ante evaluation (3) rigorously. They offer the best Resolution. However, they fail the Retiree case (2) in practice; they will demand you convert all assets and time until your marginal utility equals the global poor. They deny there is a limit, which contradicts your core project of finding one.
