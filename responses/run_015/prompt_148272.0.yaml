  *(Self-Correction on Prejudices):* The demand for *resolution* (a definite answer) is the biggest physicist bias. Ethics often deals in "all things considered" which can remain ambiguous. The demand against *gerrymandering* (fitting data) is actually a strength, but in ethics, "reflective equilibrium" *is* fitting data. I need to explain this tension.

