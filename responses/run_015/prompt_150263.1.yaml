  **PHILOSOPHY PhD COMPREHENSIVE EXAMINATION**
  **Section: Moral and Political Philosophy**
  **Time Allowed: 90 Minutes**
  **Total Marks: 25**

  **Question 1**

  T.M. Scanlon's contractualism grounds wrongness in principles that no one could reasonably reject, relying on a pairwise comparison of individual complaints. Standard objections focus on the aggregation of comparable harms (e.g., death vs. minor injury). However, consider a scenario involving structurally heterogeneous complaints: a policy imposes severe bodily deprivation on a small group (a welfare-based complaint) while simultaneously securing a dignity-based inclusion for a larger group (a status-based complaint that is not reducible to welfare).

  Assume these complaints resist translation onto a common metric of "strength." Evaluate whether the reasonable-rejection criterion can generate a single binding principle in this case without either (a) collapsing into a utilitarian aggregation of values to force comparability, or (b) allowing every party to veto the principle due to incommensurable grievance. Conclude by determining whether this difficulty represents a merely practical failure of application or a structural boundary in contractualism's account of wrongness.

  ***

  ### MODEL ANSWER GUIDELINES & MARKING SCHEME

  **Examiner's Note:** This question tests the candidate's grasp of the *architecture* of justification, not their memory of secondary literature. High-scoring responses will not merely recite the "aggregation objection" but will dissect the mechanics of pairwise comparison when the *terms* of comparison are heterogeneous. The following five moves constitute the essential architecture of a top-tier response.

  #### **Move 1: Reconstruction of the Pairwise Justification Mechanism (5 Marks)**
  **Requirement:** The candidate must accurately reconstruct Scanlon's individualistic constraint. They must explain that reasonable rejection typically relies on comparing the burden on one person under Principle P against the burden on one person under Principle Q, assuming generic reasons that are mutually recognizable.
  **Key Insight:** The response must highlight that pairwise comparison presupposes a shared space of reasons where burdens can be weighed against one another by a "generic" agent.
  **Characteristic Mistake:** Treating pairwise comparison as simply "one-on-one bargaining" rather than a test of justifiability to each individual based on generic reasons.

  #### **Move 2: Articulation of Structural Heterogeneity (5 Marks)**
  **Requirement:** The candidate must distinguish the prompt's scenario from standard aggregation cases. They must argue that bodily deprivation (welfare) and dignity-based exclusion (status) operate on different normative registers.
  **Key Insight:** The response must explain why these are not just different *magnitudes* of the same harm (which could be summed or weighed) but different *types* of validity claims that resist cardinal comparison.
  **Characteristic Mistake:** Assuming the problem is solved by simply assigning higher "weight" to dignity without explaining how that weight is commensurable with physical pain.

  #### **Move 3: Analysis of the Utilitarian Collapse Risk (5 Marks)**
  **Requirement:** The candidate must evaluate the first horn of the dilemma: forcing a common metric. They must argue that to compare welfare and dignity directly, contractualism would need a super-value (e.g., "overall well-being") to translate both.
  **Key Insight:** The response must identify that introducing such a metric violates the separateness of persons, effectively turning "reasonable rejection" into a masked form of consequentialist maximization, thereby abandoning the contractualist core.
  **Characteristic Mistake:** Claiming Scanlon can simply "balance" interests without acknowledging that balancing requires a common currency that contractualism explicitly rejects.

  #### **Move 4: Analysis of the Veto/Paralysis Risk (5 Marks)**
  **Requirement:** The candidate must evaluate the second horn of the dilemma: refusing translation. If complaints are incommensurable, any unreduced grievance might constitute a veto.
  **Key Insight:** The response must show that if every heterogeneous complaint blocks agreement, contractualism loses its action-guiding capacity, rendering the "single principle" requirement impossible to satisfy in pluralistic societies.
  **Characteristic Mistake:** Suggesting that "dialogue" solves incommensurability without explaining the normative mechanism that allows one incommensurable reason to override another.

  #### **Move 5: Structural vs. Practical Diagnosis (5 Marks)**
  **Requirement:** The candidate must conclude on the nature of the failure. A top response will argue this is a *structural* boundary, not a practical one.
  **Key Insight:** The response should posit that contractualism's account of wrongness is inherently individualistic and dyadic; it lacks the resources to adjudicate conflicts between *structural goods* (like social status) and *individual goods* (like bodily integrity) because the theory lacks a model of social ontology robust enough to weigh them without aggregation.
  **Characteristic Mistake:** Dismissing the problem as a "hard case" that better application could solve, rather than recognizing it as a limit in the theory's definition of what counts as a "reason."

  ***

  ### MARKING GRID

  | **Philosophical Move** | **Marks Available** | **Grading Criteria** |
  | :--- | :---: | :--- |
  | **1. Pairwise Mechanism** | **0–5** | **5:** Clear definition of generic reasons/individual constraint.<br>**3:** Vague on "generic" vs. "personal" reasons.<br>**1:** Confuses contractualism with bargaining/utilitarianism.<br>**0:** Irrelevant. |
  | **2. Heterogeneity** | **0–5** | **5:** Distinguishes type vs. magnitude of harm clearly.<br>**3:** Acknowledges difference but treats as weight variance.<br>**1:** Treats all harms as welfare equivalents.<br>**0:** Ignores the specific scenario. |
  | **3. Utilitarian Collapse** | **0–5** | **5:** Identifies common metric requirement as theory-breaking.<br>**3:** Notes the risk but doesn't explain *why* it breaks theory.<br>**1:** Claims Scanlon allows aggregation.<br>**0:** Misses the dilemma entirely. |
  | **4. Veto/Paralysis** | **0–5** | **5:** Explains why incommensurability leads to normative paralysis.<br>**3:** Notes stalemate but offers no theoretical cause.<br>**1:** Assumes consensus is always possible.<br>**0:** Irrelevant. |
  | **5. Structural Diagnosis** | **0–5** | **5:** Identifies limit in individualistic ontology/account of wrongness.<br>**3:** Calls it a practical difficulty only.<br>**1:** Offers no conclusion on the nature of the failure.<br>**0:** No conclusion provided. |
  | **TOTAL** | **25** | |

  **Examiner's Guidance on Grading:**
  *   **Distinction (20–25):** Makes all five moves with precision. Explicitly connects the incommensurability of harms to the failure of the "generic reason" architecture.
  *   **Merit (15–19):** Makes moves 1–4 well but hedges on Move 5 (the structural diagnosis), or slightly conflates heterogeneity with magnitude.
  *   **Pass (10–14):** Accurately describes Scanlon's view (Move 1) and identifies the problem (Move 2) but fails to rigorously analyze the collapse/paradox dilemma (Moves 3 & 4).
  *   **Fail (0–9):** Recites standard aggregation objections without addressing the heterogeneous/dignity aspect; treats the question as a standard utilitarianism vs. contractualism debate.
