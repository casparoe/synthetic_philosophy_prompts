      *Wait, check (c) again.* User asks: "does (c) actually follow from stripping risk out of (b), or am i sneaking in egalitarianism?" Answer: You are sneaking in egalitarianism. (b) is agent-relative (my survival). (c) is agent-neutral (social welfare). The bridge is impartiality.

