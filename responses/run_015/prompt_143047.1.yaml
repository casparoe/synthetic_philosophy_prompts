  **MEMORANDUM**

  **TO:** His Majesty, The Sovereign
  **FROM:** Institute for Constitutional Metrics (ICM), Compliance Division
  **DATE:** 14 October 2023
  **SUBJECT:** Q3 Onboarding / Prerogative Power KPIs & Metric Frameworks

  Welcome to the role. Per standard accession protocol, this memo outlines your performance metrics regarding the unwritten conventions of our parliamentary democracy. While the Crown retains formal reserve powers, the Institute monitors the stability of the realm through quantifiable restraint. Please review the following metrics carefully. Typos in this document do not constitute legal advice or a invitation to test boundaries.

  **1. Legitimacy-Action Gap (LAG)**
  The LAG measures the distance between your formal prerogative (e.g., refusing Royal Assent) and your actual non-interference. A healthy LAG is wide. Narrowing the gap triggers automatic constitutional reviews and potential media scrutiny. For example, while you *can* dissolve Parliament, doing so without a Prime Minister's request shrinks the LAG to critical levels. Our target is a sustained LAG of >95% theoretical power vs. <1% actual utilization. Please note: Attempting to optimize this metric by actually using powers is considered a breach of contract and may void your insurance policy.

  **2. Crown-Parliament Signal-to-Noise Ratio (CPSNR)**
  This metric tracks the frequency of private advice leaked to the press versus advice ignored by the Goverment. High signal (leaks) suggests meddling; high noise (ignored advice) suggests irrelevance. The optimal ratio is 0:0. You are encouraged to speak in platitudes. Specific policy preferences register as static interference. As republican consultant Dr. Aris Thorne noted during the last audit cycle, "If you start measuring the silence, you inevitably encourage someone to fill it. It's classic metric capture." We disregard this view as outside the scope of HR compliance and continue with standard monitoring.

  **Quarterly KPI Reviews**
  Your performance will be assessed quarterly via the Reserve Powers Rubric. Scores are weighted heavily toward inaction.
  *   **Royal Assent:** Binary pass/fail. Signing is a pass. Withholding is a fail requiring immediate abdication paperwork.
  *   **Appointment of PM:** Must align strictly with party leadership election results. Deviation results in a penalty score and a strongly worded letter from the Cabinet Secretary.
  *   **Speeches:** Written entirely by the Cabinet. Deviation from script >5 words triggers a CPSNR audit. Ad-libbing is classified as a Level 4 Incident.

  **Sidebar: Refund Policy for Accidental Dissolutions**
  In the event of an accidental dissolution of Parliament (e.g., misinterpreting a handshake as a request for elections), the Crown may apply for a procedural refund. Note that refunds are issued in political capital only, not currency. Repeated incidents will result in the conversion of the monarchy to a ceremonial presidency. Please submit Form 88-B within 48 hours of the snap election call. Late submissions will be rejected if the opposition party has already formed a coalition.

  We understand the ambiguity of your position is stressful. You possess absolute authority that you cannot use, funded by taxpayers who vote for the people telling you what to do. This is normal. It is designed to be this way to prevent you from becoming a problem. Please sign the attached Non-Interference Agreement and return it to your Private Secretary. Do not reply to this email.

  Regards,

  The Institute for Constitutional Metrics
  *Measurement is Sovereignty*
