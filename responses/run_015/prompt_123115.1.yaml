  **Tension Flag:** The Entry-Exit Asymmetry conflicts with Internal Valuation. If the machine life is internally flawless, leaving is a loss. If entering is a mistake, the life lacks value. A theory struggles to claim the life is worthless before entry but priceless after immersion without appealing to external facts irrelevant to the subject.

