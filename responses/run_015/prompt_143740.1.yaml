      *   *Good:* "Is the distress a full emotion involving the belief..."
      *   *Bad:* "Is it Humean conversion?"
      *   *Good:* "Does the enjoyment depend on and shape the distress?"

      *   *Documentary Constraint:* "a documentary of real suffering that no one would want to be caught enjoying."
      *   *Prediction:* For each leaf, state: "Would this viewer enjoy a documentary of real suffering?" (Most should say No, but explain why they enjoy the *art* version).
      *   *Repeater Constraint:* "predict about a viewer who already knows the ending and chooses to return."

