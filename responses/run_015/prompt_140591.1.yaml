      Legal frameworks often demand intent. The Turing Clause circumvents this by stipulating that a process is certified competent if its outputs pass an outcome audit. Questions about whether any person involved understands the process are ruled out of scope on the grounds that understanding was never in the specification. For the Triage Unit, this means patient survival rates are the sole metric. If the allocation of resources results in stabilized vitals, the logic is valid. Inquiry into the reasoning behind specific resource denials is contractually defined as non-essential data.

