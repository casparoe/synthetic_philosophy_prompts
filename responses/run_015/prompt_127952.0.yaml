  (7) here's where he went further: this applies to ANY promise of the form "i will do X on some day in [window], and you will never be able to predict which." the logic forces every day out, so the promise is self-defeating.
  (8) that means if i tell my partner "i'm planning a surprise anniversary trip sometime this month, but you'll never guess when," i'm literally saying something impossible. but people make these promises all the time and they work. so either logic is broken or one of the steps is smuggling in an extra assumption.
  (9) i think the slip might be between "i know it's not friday" and "therefore i can apply the induction to thursday" — maybe knowing the elimination requires common knowledge or something? but i don't want to just name-drop a concept i half-remember. where does this actually break, and if i have to give up a premise, which one costs me the least?

