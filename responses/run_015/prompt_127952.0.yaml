answer: |-
  Here is the breakdown. You are right to be suspicious of Step 3, but the rot goes slightly deeper. Your roommate is conflating **logical provability** with **psychological expectation**, and he is treating the Professor's announcement as an immutable law of physics rather than a claim that can be falsified.

  Here is where the chain breaks, priced out.

  ### 1. The Break Point: Step 3 ("So it's not Friday")
  Your roommate's logic relies on this move: "If the exam were on Friday, I would know it on Thursday. But the Professor said I wouldn't know. Therefore, the exam cannot be on Friday."

  This step assumes the Professor's announcement is **necessarily true**. It treats the announcement as an axiom (like $1+1=2$). But the announcement is a **contingent claim** about the future. It can be false.

  Here is the counter-move:
  On Thursday night, you reason: "If the Professor is telling the truth, it can't be Friday. But if the logic proves it can't be Friday, then the Professor's statement ('There will be a surprise exam') leads to a contradiction. If the statement leads to a contradiction, the statement might be false."

  If there is even a tiny sliver of doubt that the Professor is lying or mistaken, you cannot conclude with 100% certainty on Thursday night that the exam is Friday.
  *   If you aren't 100% certain it's Friday, then an exam on Friday **is still a surprise**.
  *   If Friday is still a surprise, Friday is not eliminated.
  *   If Friday is not eliminated, you can't eliminate Thursday.
  *   The whole backward induction collapses immediately.

  **The Cost:** You have to give up the premise that "The Professor's announcement is known to be true." You must accept that the announcement is just a claim that *might* be false. Once you allow for the possibility that the Professor is wrong, the "knowledge" required to eliminate Friday disappears.

  ### 2. The Definition of "Surprise"
  Your roommate is using a definition of surprise that doesn't exist in the real world.
  *   **Roommate's Definition:** "Surprise" = "It is logically impossible for me to deduce the day beforehand."
  *   **Real World Definition:** "Surprise" = "I did not confidently expect this specific day."

  In the real world (your anniversary trip example), "surprise" is probabilistic. If you think there's a 20% chance it's Tuesday, and it turns out to be Tuesday, you are still surprised. You didn't *know*. The paradox only works if "know" means "deductive certainty."

  Your roommate's Step 7 ("this applies to ANY promise") is false because real-world promises rely on psychological uncertainty, not logical unprovability. He has proven that **deductive certainty of a surprise is impossible**, not that **surprises are impossible.**

  ### 3. The Self-Reference Trap
  The announcement is self-referential. It says: "Event X will happen, AND you cannot prove Event X is happening."

  If you successfully prove Event X is happening (by eliminating all other days), you have made the second half of the statement false. If the second half is false, the whole announcement is false.
  If the announcement is false, you can't use it as a premise to prove Event X is happening.

  This creates a loop:
  1.  I use the announcement to prove it's Friday.
  2.  By proving it's Friday, I falsify the announcement.
  3.  If the announcement is falsified, I can't use it to prove it's Friday.
  4.  So I don't know it's Friday.
  5.  So it *can* be a surprise.

  The logic eats its own tail. It doesn't prove surprises are impossible; it proves that **you cannot consistently believe the announcement is true while simultaneously using it to deduce the day.**

  ### The Verdict
  Your roommate's chain fails at **Step 3**. He assumes the student *knows* the professor is telling the truth. But the student cannot know that, because the truth of the statement depends on the student *not* knowing the day.

  **Which premise costs you the least to drop?**
  Drop the idea that the recipient **knows the announcement is true.**
  Treat the announcement as a prediction that might fail.
  *   If the Professor gives the exam on Friday, he lied about the "surprise" part (because you might have deduced it).
  *   If the Professor gives the exam on Wednesday, he told the truth.
  *   Because you can't be sure which scenario you're in, you can never eliminate Friday with 100% certainty.

  **Do you owe him $20?**
  **No.**
  He proved that *perfect logical certainty* about a surprise is impossible within a closed system where the announcement is treated as absolute truth. He did not prove that surprises themselves are impossible. Since your anniversary trip relies on psychological uncertainty, not logical proof, his extension (Step 7) is invalid.

  **The Pushback:**
  Tell him this: "You proved that I can't be *logically certain* of the day without breaking the promise. You didn't prove you can't *surprise* me. If you show up on Friday, and I guessed it because of your logic, you lied about the surprise. If I didn't guess it, your logic was useless. Either way, the surprise works."

  Keep the $20. The paradox is a classic puzzle in epistemology (the study of knowledge), not a law of reality. It highlights the limits of what we can "know" about self-referential statements, not the limits of planning a party.
