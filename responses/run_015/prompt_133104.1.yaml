  ### The constructed case

  Consider Dr. Aris Thorne, who designed a proprietary linguistic encoding system for an isolated community thirty years ago. The system is now inefficient compared to modern digital translation tools, and maintaining it consumes resources that could yield higher utility elsewhere. Standard economic rationality dictates abandoning the encoding for superior tools; the resources spent developing the syntax are sunk and irrelevant to future optimization. However, Thorne's entire subsequent research agenda, professional relationships, and cognitive habits are structured around the specific logical constraints of this encoding. To abandon the system is not merely to switch tools; it is to invalidate the premises of his current and future inquiries. The "cost" here is not the time spent coding, but the disintegration of the conceptual framework that allows Thorne to function as a researcher. This is an ontological commitment cost. His future deliberative framework is calibrated around the project's continuation. If the project ceases, the standards by which he measures progress vanish, leaving him without a metric for rational action. The investment has become the scaffold of his agency. Therefore, continuing the maintenance is not sentimentality, but a structural requirement for maintaining a coherent planning architecture over time. The rational choice is determined by the necessity of preserving the agent's capacity to reason, not by immediate resource allocation. The sunk cost is effectively a foundational pillar of his cognitive infrastructure. To remove it is to induce a collapse in his ability to formulate coherent intentions. The commitment is not to the past, but to the continuity of the future self.

  ### The category-error objection

  The objection here is that Thorne confuses instrumental rationality with identity-preservation. Rationality demands maximizing outcomes based on current constraints, not honoring past expenditures. By treating his personal coherence as a constraint on action, Thorne commits a category error: he elevates a psychological need for continuity to the status of an objective rational requirement. The resources spent on the encoding are gone; clinging to them prevents the adoption of superior methods that would better serve the community. Identity is malleable; rational agents should update their self-conception to align with optimal strategies. The cost of dissolving his framework is merely psychological discomfort, not a logical impossibility. He can learn new metrics. To claim he cannot is to suggest that rational agents are static entities rather than adaptive systems capable of revising their own foundational premises in light of new evidence.

  ### The coherence defense

  The defense rests on the notion that rational planning requires a stable agent over time. If an agent's normative framework is deeply entangled with a specific project, abandoning that project does not recover resources; it actively undermines the agent's capacity for future rational planning. Thorne cannot simply learn new metrics without a period of radical disorientation where no rational action is possible. His commitment provides the continuity necessary for long-term intentionality. Without the project, his future selves lack the connective tissue to execute plans formed by his past self. This is not about ego, but about the temporal coherence required for agency. If the project constitutes the language in which his goals are articulated, removing it leaves him mute regarding future value. Thus, continuation is the genuinely rational option because it preserves the conditions of possibility for rationality itself. The sunk cost is reclassified as an ongoing structural load-bearing element of the agent's mind. To remove it is to collapse the building, not merely to renovate it. Rationality must account for the preservation of the rational agent. The cost of switching frameworks exceeds the utility gain because the switching cost includes the temporary loss of agency itself.

  ### The collapse boundary

  This defense fails when the project imposes irreversible harm on third parties or becomes physically impossible to sustain. If Thorne's encoding actively prevents the community from accessing life-saving medical information available only in standard languages, the ontological commitment is outweighed by external moral constraints. The boundary is crossed when the internal coherence of the agent conflicts with the basic agency of others. The fallacy applies when the structural load becomes a destructive weight rather than a supportive scaffold. At this collapse boundary, the agent's preservation no longer justifies the cost because the project no longer supports agency—it consumes it. Rationality then demands abandonment, not because the sunk cost is irrelevant, but because the ontological commitment has become toxic to the very possibility of shared rational action.
