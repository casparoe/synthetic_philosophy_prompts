      *   *Where it Breaks (The Disanalogies):*
          *   **Hardware/Software Dualism:** In computers, hardware exists independently of software. In biology, the "hardware" (ribosomes, polymerases) is built by the "software" (DNA). This is *autocatalytic*.
          *   **Semantics vs. Causation:** Code relies on arbitrary convention (ASCII, opcodes). DNA relies on chemical affinity (codon-anticodon binding). It's causal, not just symbolic.
          *   **Context Dependence:** Code usually runs deterministically on a standard OS. Gene expression is heavily dependent on context (epigenetics, environment, developmental stage).
          *   **The "Reader":** In computers, a CPU is designed to read code. In cells, the reading machinery evolved *alongside* the code. There is no external agent.

