          *   Determine if anything survives the audit.

  2.  **Deconstruct the "Genome as Code" Analogy:**
      *   *The Mapping:*
          *   **Source Code:** DNA sequence (A, C, G, T).
          *   **Programmer:** Evolution by Natural Selection (blind, iterative, no intent).
          *   **Compiler/Interpreter:** Transcription/Translation machinery (RNA polymerase, Ribosomes).
          *   **Machine/Hardware:** The Cell (cytoplasm, organelles, membranes).
          *   **Runtime Environment:** The Organism + Environment (temperature, nutrients, signals).
          *   **Input:** Environmental signals, metabolites, epigenetic markers.
          *   **Output:** Phenotype (proteins, structures, behaviors, the organism itself).
