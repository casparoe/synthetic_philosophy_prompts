      *   *Clarification on Information:* Distinguish between Shannon Information (surprise/entropy) and Semantic Information (meaning). The BiL conflates them. The Chemist denies the latter.
      *   *De-extinction:* Emphasize the "Epigenetic Bootloader." You need the egg cell's cytoplasm, not just the DNA.
      *   *The "Reader" Problem:* This is the core philosophical disagreement. The Chemist is right about "no intent," but the BiL is right about "functional constraint." I need to explain *Teleosemantics* simply.

  9.  **Final Polish:** Check against the user's specific questions.
      *   Map spelled out? Yes.
