      *   **Section 1: The Nature of the Distortion (The Violation):** Move beyond "inaccuracy." Frame it as *appropriation* and *reduction*. The "Christopher" invention isn't just a lie; it rewrites Turing's interiority.
      *   **Section 2: The Victim of the Harm (Who is Wronged?):**
