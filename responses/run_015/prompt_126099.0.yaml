          *   *Distortion 2:* Turing's personality. He was quirky, yes, but the film makes him almost Asperger's-coded in a way that feels modern and cinematic, rather than historically nuanced. He was also athletic, charming in his own way, not just a brooding machine.
          *   *Distortion 3:* The breaking of the Enigma code. The film suggests Turing did it mostly alone via a machine. It was a massive collaborative effort.
      *   *The "Good":* Mass awareness of his persecution, the pardon campaign, LGBTQ+ iconography.

  3.  **Structuring the Analysis:**
