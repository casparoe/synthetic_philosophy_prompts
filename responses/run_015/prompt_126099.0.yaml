      *   *Conclusion:* The theory holds water but requires nuance. The debt wasn't cancelled, it was *transferred*. We owe the real Turing accuracy, but we owe the *idea* of Turing justice. The film paid the second debt by incurring the first.

  5.  **Review against Constraints:**
