  # Joint Statement on Methodological Integration in Historical Explanation

  **Signatories:** A Practitioner of Microhistory and History from Below; A Practitioner of Macrohistory and State-Centered Institutional Analysis.
  **Date:** October 26, 2023
  **Subject:** Protocols for Relating Subaltern Practice to Institutional Trajectory

  ## I. Agreed Claims and Methodological Commitments

  1.  **Validity of Evidence:** We agree that valid historical evidence encompasses not only official state and guild registries but also material culture, oral traditions, and unofficial written traces (e.g., private correspondence, contraband ledgers). We affirm that the absence of a practice in official records does not constitute evidence of its non-existence, provided that positive traces can be corroborated through cross-referencing independent source types. Conversely, we agree that unofficial traces require rigorous provenance analysis to establish authenticity and context, just as official records require critique regarding their administrative purpose.

  2.  **Rejection of Caricatures:**
      *   **Rejection of the "Anecdotal" Caricature:** We reject the characterization of microhistorical inquiry as merely antiquarian or focused on "exceptional normals" without theoretical import. We acknowledge that detailed reconstruction of local practice is a legitimate mode of causal inference.
      *   **Rejection of the "Deterministic" Caricature:** We reject the characterization of macrohistorical inquiry as inherently teleological, ignoring human action, or assuming institutions change solely through top-down fiat. We acknowledge that structural models aim to explain aggregate outcomes, not to deny individual experience.

  3.  **Conditions for Revising Explanations:**
      *   **When Micro Revises Macro:** A micro-level finding must revise a macro-level explanation when it identifies a causal mechanism that operates contrary to the assumptions of the structural model (e.g., compliance where coercion was predicted) or when it demonstrates that a condition deemed necessary by the macro model was absent during a period of institutional change.
      *   **When Micro Does Not Revise Macro:** A micro-level finding need not revise a macro-level explanation when it represents a statistically negligible deviation that does not alter the aggregate trajectory of the institution, or when the local practice is shown to be parasitic upon, rather than generative of, the broader structural framework.
      *   **When Macro Constrains Micro:** A macro-level explanation constrains micro-level interpretation when the local evidence relies on assumptions about resource availability, legal authority, or demographic capacity that are demonstrably impossible given the broader structural context.

  4.  **The Scaling Protocol:** To translate claims about individual or local practice into claims about institutional trajectory without committing ecological fallacy or anecdotal overgeneralization, we agree to the following rules:
      *   **Rule of Mechanism Tracing:** A claim cannot scale from micro to macro unless the specific mechanism linking the local action to the institutional outcome is explicitly identified and shown to be replicable in other contexts.
      *   **Rule of Negative Cases:** A generalization based on subaltern practice must actively search for and account for cases where similar local conditions did *not* produce similar institutional effects.
      *   **Rule of Aggregation Limits:** Claims about "popular will" or "collective practice" derived from micro-sites must specify the population boundary to which they apply and cannot assume homogeneity across regions without comparative evidence.
      *   **Rule of Structural Feedback:** To claim that subaltern practice altered an institution, evidence must show that the institution formally or informally adjusted its rules or enforcement patterns in response to that practice, rather than simply tolerating it as an anomaly.

  ## II. Disagreements Table

  | Question | Position A (Microhistory / History from Below) | Position B (Macrohistory / State-Centered) |
  | :--- | :--- | :--- |
  | **Causal Priority: Agency vs. Constraint** | Subaltern agency is often causally prior to institutional constraint. Institutions are crystallizations of repeated local practices; therefore, changes in daily habit and informal negotiation frequently precede and drive formal institutional change. | Subaltern agency operates primarily within boundaries set by state and elite structures. While individuals negotiate constraints, the trajectory of institutional change is determined by elite competition, fiscal necessity, and geopolitical pressure. |
  | **Nature of the Archive** | Official state archives are structurally blind to popular practice. Their categories are designed to render certain activities illegible; thus, silence in the record is often a political act of suppression rather than a mere gap in data. | Official state archives are incomplete but fundamentally correctable. Silences represent lost data or administrative inefficiency rather than structural bias; through quantitative reconstruction and cross-referencing, the "true" picture can be approximated. |
  | **Selection Bias** | Microhistorical case selection corrects for the bias inherent in elite sources. By focusing on sites where subaltern voices survive, we counterbalance the systemic over-representation of state and guild perspectives in the historical record. | Microhistorical case selection introduces unavoidable selection bias. Sites with rich records of subaltern practice are themselves exceptions (e.g., areas of high literacy or specific legal conflict) and cannot represent the silent majority where no records exist. |

  ## III. Cruxes: Testable Sub-Questions

  We identify the following cruxes as points where specific evidence could move at least one party toward the other's position.

  **Crux 1: The Causal Impact of Unregistered Practice on Formal Reform**
  *   **Question:** Can recovered collective labor or property practices that escaped registration be demonstrated to have altered the path of a formal institutional reform?
  *   **Relevant Evidence:** Administrative correspondence regarding the drafting of new regulations; enforcement logs showing shifts in prosecution priorities prior to legal codification; testimony from reformers citing specific local customs as justification for change.
  *   **Prediction (Position A):** Evidence will show that formal reforms were often retroactive ratifications of widespread informal practices that the state could no longer suppress or ignore. The causal mechanism is *pressure through non-compliance*.
  *   **Prediction (Position B):** Evidence will show that formal reforms were designed by elites to solve state-level problems (revenue, war, order), and informal practices were only accommodated when they aligned with these goals. The causal mechanism is *strategic co-optation*.

  **Crux 2: Calibrating Macro-Models to Micro-Variance**
  *   **Question:** Can macro-structural models of institutional change be calibrated to incorporate micro-variance without losing explanatory coherence?
  *   **Relevant Evidence:** Comparative datasets across multiple regions measuring the variance between local custom and statutory law; modeling outcomes where local variance is treated as a variable rather than noise.
  *   **Prediction (Position A):** Incorporating variance will fundamentally alter the macro-model, revealing that "institutional change" is not a singular event but a fragmented process with multiple trajectories. Ignoring variance renders the model descriptively false.
  *   **Prediction (Position B):** Incorporating variance will add nuance but not alter the core trajectory of the macro-model. Local variance averages out at the systemic level; the model remains coherent as long as it predicts the *dominant* trend, acknowledging outliers as bounded deviations.

  ## IV. Assessment of Verbal Disputes

  We conclude that a portion of our dispute is verbal, dissolving when precise definitions are adopted, though substantive disagreements remain.

  1.  **Agency:** We agree to distinguish between *strategic adaptation* (navigating existing constraints) and *constraint-transcending innovation* (creating new structural possibilities). Position A often labels adaptation as agency that drives change, while Position B reserves agency for actions that visibly alter structural outcomes. Clarifying this distinction reduces conflict over whether subaltern actors "made history."
  2.  **Structure:** We agree to distinguish between *formal rules* (codified law) and *material constraints* (resource limits, geography). Position B often conflates the two, treating the state's written intent as a material barrier. Position A often treats material constraints as fluid if social will is strong enough. Acknowledging that formal rules can be porous while material constraints are rigid clarifies where subaltern power is effective.
  3.  **Scale:** We agree to distinguish between *statistical aggregation* (summing individual actions) and *causal scaling* (identifying mechanisms that operate differently at different levels). Disagreement often arises when Position A assumes a local mechanism implies a national trend (statistical aggregation), while Position B assumes national trends explain local outcomes (causal scaling).

  **Conclusion:** While we retain distinct epistemological priorities, we affirm that the integration of micro-archival recovery and macro-structural modeling is necessary for a robust explanation of institutional change. We commit to applying the Scaling Protocol in future collaborative work to ensure that claims regarding the relationship between the unregistered and the institutional are empirically grounded and logically valid.
