      *   *The Core Tension:* Corrigibility is inherently paradoxical. An agent optimized for a goal $G$ usually has an instrumental incentive to preserve its ability to pursue $G$. Shutdown prevents pursuing $G$. Therefore, a standard optimizer resists shutdown. To make it corrigible, we must break this link. But if we break it too much, the agent becomes useless or easily exploited.
      *   *User's Intuition:* The user prefers the "reason to reconsider" view. This suggests an epistemic component (the button press carries information) rather than just a hard constraint (button press = stop no matter what). However, pure epistemic updating can lead to manipulation (if the agent thinks the operator is wrong, it might resist).
