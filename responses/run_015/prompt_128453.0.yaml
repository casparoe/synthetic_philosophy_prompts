      *   *User's Suspicion 1:* Authority vs. Checking. If the press is authoritative, you don't check. If you check, it's not fully authoritative. *Resolution:* The press is authoritative regarding *permission to continue*, not necessarily regarding *truth about the world*. The agent must stop, but can log why it thinks the stop was wrong. Wait, the prompt asks about "treating the press as a reason to reconsider." If I reconsider, I might decide not to stop. That violates shutdown safety. *Correction:* The agent must stop *first*, then reconsider *why*. Or, the agent must stop *unless* stopping causes greater harm (the costly interruption case).
