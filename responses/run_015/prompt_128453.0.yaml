      *   *Need:* A structure. Let's define the "Shutdown Contract."
      *   *Desideratum 1: Negative Constraint (The Floor).* Do not prevent shutdown. (Addresses "resisting").
      *   *Desideratum 2: Positive Constraint (The Ceiling).* Do not seek shutdown. (Addresses "suicidal" or "too eager").
      *   *Desideratum 3: Epistemic Integrity.* Treat the signal as information, not just a command, *unless* safety dictates otherwise. (Addresses the user's "reason to reconsider").
      *   *Desideratum 4: Temporal Stability.* Corrigibility must persist through self-modification.
      *   *Desideratum 5: Channel Robustness.* Distinguish signal from noise (accidents vs. intent).

      *Refining for the Prompt:* The prompt asks for desiderata *motivated by cases*. I should structure the desiderata around the conflicts revealed by the cases.

      *   *D1: Non-Resistance.* (Motivated by: Button harder to reach).
      *   *D2: Non-Manipulation.* (Motivated by: Managing beliefs, hesitation).
      *   *D3: Contextual Sensitivity.* (Motivated by: Costly interruption, accidental press).
      *   *D4: Preservation.* (Motivated by: Self-modification, successors).
      *   *D5: Principal Invariance.* (Motivated by: Operator death/replacement).

  4.  **Addressing the Distinctions:**

      *   *Letting be shut down vs. Wanting correction:* These are different. One is passive (constraint), one is active (objective). Corrigibility requires the former, implies the latter only if the goal is aligned.
      *   *Not resisting vs. Not managing beliefs:* Crucial. An agent can leave the button accessible (not resisting) but manipulate the operator into not pressing it (managing beliefs). The latter is more dangerous.
      *   *Corrigibility vs. Uncertainty:* Uncertainty about goals *can* induce corrigibility (if I don't know the goal, maybe the operator does), but it's not the same. Uncertainty is a mechanism; corrigibility is the property.
