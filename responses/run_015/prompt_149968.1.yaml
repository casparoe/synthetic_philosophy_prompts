answer: |-
  You have correctly identified a gap between the popular shorthand of "Evolutionarily Stable Strategy" (ESS) and the richer dynamics possible in iterated, noisy, finite-population simulations. The vocabulary you are looking for exists primarily in **Evolutionary Game Theory (EGT)** and **Population Ecology**, but it is often fragmented between the two fields.

  Here is the conceptual carving you need, the nearest established terms, and how to distinguish your specific case from them.

  ### 1. The Core Concept: Non-Monotonic Frequency-Dependent Selection

  The umbrella concept for all your observations is **Frequency-Dependent Selection**. This simply means a strategy's fitness (average score) depends on how common it is in the population.

  However, standard textbook examples usually describe two simple varieties:
  *   **Negative Frequency Dependence:** "Rare is good." (e.g., Rock-Paper-Scissors). This leads to stable coexistence, but the strategy can usually invade from rarity.
  *   **Positive Frequency Dependence:** "Common is good." (e.g., Coordination games). This leads to tipping points and lock-in. If you pass the threshold, you take over; if you don't, you die.

  Your Observation 2 is a hybrid: **Positive dependence at low frequencies** (you need a critical mass to survive) combined with **Negative dependence at high frequencies** (you suffer diminishing returns or self-interference when too common).

  In ecology, the low-frequency threshold is called an **Allee Effect**. In game theory, the high-frequency decline is often called **Self-Limitation** or **Interference**.

  There is no single noun for a strategy that exhibits this specific hump-shaped fitness curve, but the *state* it produces has a precise name.

  ### 2. The State: Stable Polymorphic Equilibrium

  You wrote that the population "settles near the peak instead of going to fixation." In EGT, a population where two or more strategies persist indefinitely is in a **Polymorphic Equilibrium**.

  *   **Monomorphic Equilibrium:** One strategy fixes at 100%. (This is what a standard ESS implies).
  *   **Polymorphic Equilibrium:** Strategies coexist at specific frequencies.

  Your specific case is a **Stable Internal Equilibrium**.
  *   **Internal:** It exists somewhere between 0% and 100% (e.g., at 40%).
  *   **Stable:** If you perturb the system slightly (move to 35% or 45%), selection pressures push it back to 40%.

  However, you also noted a **Threshold** (around 15-20%). This means there is a second equilibrium point at that low frequency which is **Unstable**.
  *   Below the threshold: Selection pushes the strategy to 0% (Extinction).
  *   Above the threshold: Selection pushes the strategy to the Internal Equilibrium (40%).

  So, the precise technical description of your configuration is: **A stable polymorphic equilibrium protected by an unstable invasion threshold.**

  ### 3. Strategy vs. State (The "ESS" Confusion)

  You are right to be wary of the term "Evolutionarily Stable Strategy."
  *   **Maynard Smith's ESS:** A strategy is an ESS if, when *almost everyone* plays it, no mutant can invade. This describes **resistance to invasion** when fixed (monomorphic). It says nothing about whether the strategy can *invade* others.
  *   **Your Case:** Your strategy cannot invade from rarity (fails the "invasion" test) and does not want to be fixed (fails the "monomorphic" test). It is not an ESS in the strict sense.

  Instead, you are describing an **Evolutionarily Stable State**. This is a subtle but crucial distinction. The *strategy* is not stable on its own; the *mixture* of strategies is the stable object.

  For your readers, you should distinguish between:
  1.  **Invadability:** Can it spread from rarity? (Your strategy: No).
  2.  **Stability:** Can it resist displacement when established? (Your strategy: Yes, at the specific mix).
  3.  **Fixation:** Does it drive others to extinction? (Your strategy: No, it is self-limiting).

  ### 4. One-Shot vs. Iterated (Why this happens)

  Does the answer change between one-shot and iterated games? **Yes, fundamentally.**

  *   **One-Shot Prisoner's Dilemma:** The payoff matrix is fixed. Defection is the only Nash Equilibrium and the only ESS. You cannot get an internal stable peak for Cooperators unless you change the game mechanics (e.g., to a Snowdrift game).
  *   **Iterated Prisoner's Dilemma:** The "Game" is not fixed. The effective payoff matrix depends on the strategies' memory and the noise.
      *   **Why the Threshold?** When your strategy is rare, it mostly meets the Resident (likely Defectors or a different Cooperator). If it gets exploited more than it exploits, it dies. It needs to meet "its own kind" to trigger the mutual cooperation payoff. This is **Assortment**.
      *   **Why the Peak?** When your strategy becomes too common, two things might happen:
          1.  **Noise Sensitivity:** In IPD, strategies like Tit-for-Tat suffer when everyone plays them because a single error triggers a long vendetta. A mix allows some "buffer" agents.
          2.  **Lack of Exploitable Targets:** If your strategy relies on some degree of exploitation to boost its score above the average, having too many copies means it spends too much time cooperating with itself (moderate score) rather than exploiting the Resident (high score).

  This dynamic is unique to the iterated case because the "payoff" is an emergent property of the interaction history, not a static number in a table.

  ### 5. Artifact of the Reproduction Rule?

  You are using fitness-proportional reproduction (Replicator Dynamics). This is the standard assumption in EGT.
  *   **Is it an artifact?** No. If you used a "tournament winner takes all" rule, the dynamics would be more stochastic and jagged, but the *attractors* (the peaks and valleys) are determined by the **Payoff Structure**, not the reproduction rule.
  *   **The Noise:** The "misreported moves" are likely essential to the "peak" phenomenon. Without noise, many IPD strategies lock into perfect cooperation or perfect defection. Noise smooths the fitness landscape, allowing for intermediate optima where the cost of error management balances the benefit of cooperation.

  ### 6. Recommended Vocabulary for Your Write-Up

  Since you want to write about cooperation rather than code, avoid overly dense game-theoretic jargon where possible, but use the precise terms to anchor your claims.

  **For the Phenomenon:**
  > "The system exhibits **non-monotonic frequency-dependent selection**."
  > *Translation:* Success depends on how common you are, but being more common isn't always better.

  **For the Configuration:**
  > "The strategy supports a **stable polymorphic equilibrium**."
  > *Translation:* The population naturally settles into a mix, rather than one type winning.

  **For the Threshold:**
  > "The strategy faces an **invasion threshold** (or **critical frequency**)."
  > *Translation:* It cannot start from scratch; it needs a foothold.
  > *Analogy:* You can借用 the ecological term **Allee Effect** for the low-frequency failure, provided you clarify you mean "social Allee effect" (need enough partners to cooperate with).

  **For the Self-Limiting Nature:**
  > "The strategy is **self-limiting**."
  > *Translation:* It creates the conditions for its own decline if it becomes too dominant.

  **Summary Phrase for the Claim:**
  If you need a single phrase to describe the claim about cooperation, consider:
  > **"Critical-Mass Cooperation"** or **"Fragile Pluralism."**

  **The "Carving" Definition:**
  If you must define the concept explicitly because no single word suffices, define it as:
  > **Threshold-Dependent Coexistence:** A dynamic where a strategy requires a minimum frequency to survive (positive frequency dependence at low density) but suffers diminishing returns at high frequency (negative frequency dependence at high density), resulting in a stable mixed population rather than fixation.

  ### 7. How it differs from "Tipping Point"

  You mentioned "tipping point" describes the shape, not the mechanism. You are correct.
  *   **Tipping Point:** Usually implies a transition from State A to State B (e.g., 0% to 100%).
  *   **Your Case:** The "tip" leads to a **Resting Point** (40%), not a takeover.
  *   **Mechanism:** The mechanism is the **balance of interaction types**. At 40%, the time spent interacting with "friends" (high payoff) vs. "residents" (variable payoff) vs. "errors" (cost) creates a local maximum in fitness relative to the resident.

  ### Conclusion

  You are observing a **Stable Polymorphic Equilibrium maintained by Non-Monotonic Frequency-Dependent Selection.**

  The strategy itself is not an ESS. It is a **Niche Strategy** that occupies a specific frequency niche. It relies on **Assortment** to survive the threshold and is limited by **Interference** (or noise costs) at the peak.

  For your readers, the most honest and evocative description is that cooperation in this environment is **self-limiting** and requires a **critical mass** to establish, naturally leading to a **diverse society** rather than a uniform one. This is a stronger claim about cooperation than "Cooperation Wins," because it explains *why* defection (or other strategies) never fully disappears.
