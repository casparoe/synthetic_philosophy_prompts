answer: |-
  ### The Diagnosis: A Means/Ends Dualism Masquerading as Exegesis

  Your seminar is stuck because both camps are projecting a **Liberal Dualism** (Structure vs. Agency, or State vs. Citizen) onto a philosophy explicitly designed to dissolve it.

  *   **Camp A (Institutional)** treats experimentalism as a **Means**. They see "the lab" as a procedural technology to produce correct policy outputs (Epistemic Goal).
  *   **Camp B (Psychological)** treats experimentalism as an **End**. They see "the habit" as a moral virtue to produce better human characters (Ethical Goal).

  **The Real Blocker:** Dewey rejects the Means/Ends split. For Dewey, the "method" *is* the "growth." You cannot have a "lab-like institution" (Camp A) without citizens who possess the "habit of inquiry" (Camp B), and you cannot sustain that habit without institutions that *force* consequences into the open.

  The debate isn't verbal (literal vs. metaphorical). It's categorical. Both sides are assuming that **intelligence** is a property that resides *either* in the system (Camp A) *or* the agent (Camp B). Dewey's transactionalism argues intelligence resides in the **interaction**. An institution without the habit is a technocratic shell; a habit without the institution is a private sentiment.

  The stalemate persists because Camp A fears Camp B leads to impotent moralizing, while Camp B fears Camp A leads to technocratic authoritarianism. Both fears are correct *if* you accept their dualism. Dewey's point is that a democratic institution *just is* a crystallized habit of communication, and a democratic habit *just is* an internalized institutional norm.

  ### The One Distinction to Break the Logjam

  Stop arguing about "Institutions vs. Habits." Force the seminar to distinguish between **Technical Verification** and **Consequence-Tracing**.

  *   **Camp A (Technical Verification):** Assumes "experimentalism" means testing Policy X against Policy Y to see which yields better metrics (GDP, crime rates). This is the "Lab" model. It assumes we already know what the problem is and just need the right tool.
  *   **Camp B (Moral Attitude):** Assumes "experimentalism" means being nice/open-minded.
  *   **Dewey (Consequence-Tracing):** For Dewey, the "experiment" is not testing a solution; it is **identifying the problem**. Democracy is experimental because it is the only system that allows the *public* to trace the indirect consequences of private actions and *constitute* themselves as a political entity.

  **The Distinction:** Ask the room: *"Does Dewey's experimentalism tell us how to choose between pre-defined options (Camp A), or does it tell us how to discover what the options actually are (Dewey)?"*

  If they accept the latter, Camp A's "policy lab" collapses (because experts can't define the public's problems alone) and Camp B's "private virtue" collapses (because you can't trace consequences in isolation). The "institution" required is not a policy lab, but a **communication infrastructure** (news, education, association) that makes consequences visible.

  ### The One Piece of Empirical Evidence

  If the distinction doesn't work, introduce **Dewey's critique of "Social Science" vs. "Social Inquiry"** (specifically in *The Public and Its Problems*, Chapter 5).

  Point to the evidence of Dewey's engagement with the **Social Science Research Council (SSRC)** and similar technocratic bodies of the 1920s/30s.
  *   **The Evidence:** Dewey explicitly warned against handing democracy over to "social scientists" who treat policy as a technical engineering problem (Camp A's view). He argued that data collection without public communication is useless.
  *   **Why it breaks the jam:**
      *   It kills **Camp A**: Dewey did not want a government run by experts running controlled trials. He feared the "cult of expertise" would sever the link between knowledge and action.
      *   It kills **Camp B**: He *also* insisted that mere "goodwill" or "open-mindedness" (Camp B) is powerless without organized methods of inquiry and data dissemination.

  **The Kicker:** Show them Dewey's specific proposal for the "Great Community." He doesn't call for a legislative lab; he calls for the **localization of political life** where face-to-face communication makes consequences visible. The "machinery" he demands is **communicative**, not **administrative**.

  If Camp A admits the "lab" requires face-to-face communication to define hypotheses, they become Camp B. If Camp B admits "communication" requires institutional scaffolding to track consequences, they become Camp A. They merge into Dewey's **Social Inquiry**.
