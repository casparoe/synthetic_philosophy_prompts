answer: |-
  You have described a specific structural failure in reasoning that is distinct from standard logical fallacies. It is not merely a psychological bias, nor is it a simple case of unfalsifiability. You are looking for the epistemological anatomy of a belief system that consumes evidence without being nourished by it.

  Here is the carving you requested, addressed point by point.

  ### 1. Does this have a name?

  There is no single noun in the canon of logic (like *ad hominem* or *straw man*) that captures this exact structure. However, in the philosophy of science and the study of pseudoscience, it is best described as **Evidentiary Fungibility** operating within a **Degenerating Research Programme**.

  **Evidentiary Fungibility** describes the feature you noted: the individual claims are interchangeable components. Like currency, one unit is as good as another; if one is debased (debunked), it is swapped for a fresh unit without altering the total value (the conclusion). This distinguishes it from a standard scientific hypothesis, where evidence is *integral*. In a legitimate theory, removing a key pillar requires restructuring the roof. Here, the roof floats independently of the pillars.

  **Degenerating Research Programme** is the term coined by philosopher Imre Lakatos. He distinguished between "progressive" programmes (which predict novel facts) and "degenerating" ones (which merely accommodate existing facts by adding ad hoc patches). Your description is a specific, radical form of degeneration. Usually, a degenerating programme tweaks its auxiliary hypotheses to save the core. In the cases you describe, the adherents do not even tweak the hypotheses; they discard the specific evidence entirely and grab new evidence from a different domain. The "protective belt" around the core theory is not just flexible; it is infinite and unconnected.

  Why other terms fail:
  *   **Unfalsifiable:** You are correct to reject this. The individual claims *are* falsifiable (e.g., "This map is from 1800, not 1500"). The *system* is unfalsifiable, but the mechanism is not logical immunity; it is evidentiary replaceability.
  *   **Self-Sealing:** This implies the theory redefines terms to absorb the contradiction. Here, the theory ignores the contradiction and points elsewhere. It is not a seal; it is a sieve that never empties.
  *   **Confirmation Bias:** This locates the error in the mind of the observer. You are correct that the error is in the *structure of the argument*. Fungibility is a structural property of the evidence set, regardless of the believer's psychology.

  ### 2. What is wrong with the inference?

  The inference fails because it violates the rules of **probabilistic independence** and **likelihood ratios**.

  When a proponent says, "Surely not all of these can be coincidence," they are invoking a probabilistic argument: that the conjunction of multiple unlikely events ($E_1$ and $E_2$ and $E_3$) makes the hypothesis ($H$) exponentially more probable. Mathematically, this only works if the pieces of evidence are **conditionally independent**.

  In legitimate science, if $H$ is true, $E_1$ and $E_2$ occur because $H$ caused them. If $H$ is false, $E_1$ and $E_2$ should not correlate. In the cases you describe, the evidence items are not independent *given the alternative hypothesis* ($\neg H$).
  *   **The Failure of Independence:** A misdated map, a heavy stone, and a king list irregularity are all equally likely to occur under the hypothesis of "standard historical error, human ingenuity, and record-keeping noise" ($\neg H$). Because $P(E|\neg H)$ is high for all these items individually, stacking them does not drive $P(\neg H)$ down.
  *   **The Failure of Coherence:** In a valid accumulation of evidence, the items should constrain each other. If $E_1$ suggests an alien visit in 1000 BCE, and $E_2$ suggests one in 1000 CE, they must be reconciled by a mechanism (e.g., "they visit every 2,000 years"). In the fungible model, $E_1$ and $E_2$ do not talk to each other; they only talk to $H$. This means they provide no **cross-validation**.
  *   **The Likelihood Ratio:** For evidence to confirm a hypothesis, it must be more likely to exist if the hypothesis is true than if it is false. In these arguments, the "evidence" is usually vague enough (e.g., "precise stonework") that it is arguably just as likely under $\neg H$ (skilled human labor) as under $H$ (advanced lost tech). If the likelihood ratio is near 1:1, adding more items does not increase probability. It merely adds noise.

  The error is treating **heterogeneous anomalies** as **homogeneous data**. They are all "things standard history finds tricky," but they are not "things only this specific hypothesis explains."

  ### 3. Where are the edges? (Legitimate vs. Illegitimate)

  You are right to worry about detectives and historians. They also build cases from scattered, indirect traces. The distinction lies in **Explanatory Constraint** (often called **Riskiness**).

  **The Test of Constraint:**
  In legitimate historical or detective work, the hypothesis *rules things out*.
  *   **Legitimate:** "If this suspect committed the crime, he must have been in London on Tuesday. If we find a record of him in Paris, the hypothesis is damaged." The clues are bound by a causal story that creates expectations about *what else should be found* and *what should not*.
  *   **Illegitimate (Your Subject):** "If aliens built this, we might find precise stones, or strange maps, or gaps in records." The hypothesis does not predict *which* anomalies will appear, only that *some* anomalies will appear. It is compatible with any configuration of evidence.

  **The Coherence Test:**
  *   **Legitimate:** The clues form a network. The date of the map constrains the technology available for the stones, which constrains the labor force in the king list. If one clue changes, the others must be re-evaluated.
  *   **Illegitimate:** The clues form a star graph. They all point to the center (the Conclusion), but have no lines connecting them to each other. You can remove one spoke without the wheel collapsing.

  **A Practical Test for Print:**
  Ask: **"What specific finding would force you to discard this specific piece of evidence, and does discarding it lower your confidence in the main conclusion?"**
  If the answer is "Nothing would discard it" (it's reinterpretable) or "Discarding it changes nothing" (fungibility), the argument is structurally unsound. Legitimate reasoning requires that the evidence be **load-bearing**.

  ### 4. Is this different from pseudoscience?

  Epistemologically, **no**. Pragmatically, **yes**.

  **Epistemological Identity:**
  This is the same structural failure found in creationism or homeopathy. It is a **Lakatosian Degenerating Research Programme**. It does not predict novel facts; it accommodates old anomalies. It does not refine its mechanisms; it expands its list of examples. The "shrug" from your editors is not based on a difference in logical validity; the logic is equally broken in both cases.

  **Pragmatic Distinction:**
  The reason editors treat it differently is **testability** and **harm**.
  *   **Physics/Biology:** Claims can be settled by experiment. False claims can lead to immediate physical harm (e.g., vaccines).
  *   **History:** Claims are about the past. We cannot run the experiment. The "harm" is epistemic (confusion about history) rather than physical.

  However, you should not let the "it's just history" defense stand in your analysis. History, when done correctly, uses **Bayesian reasoning** on available evidence. It updates probabilities based on new findings. The material you are describing refuses to update. It is **pseudohistory** in the strict sense: it mimics the form of historical argument (citing evidence, making claims) without the function (updating belief states based on evidence quality).

  ### Summary for your Article

  If you need a phrase to reproduce this distinction accurately in print, I recommend this formulation:

  > "This is not a theory that is being tested by evidence; it is a conclusion that is consuming evidence. The individual claims are **fungible**: they are interchangeable tokens used to purchase the same pre-determined outcome. When one token is rejected, it is not because the theory has been refined, but because the token was spent.
  >
  > In legitimate history, clues are **load-bearing**; they constrain the story and rule out alternatives. Here, the clues are **decorative**; they accumulate without connecting to one another. The argument relies on the **Fallacy of Accumulation without Coherence**: the assumption that a large number of weak, unrelated anomalies adds up to a strong proof, when in fact, without a shared causal mechanism, they add up to nothing more than noise."

  This avoids caricaturing the believers (who may be sincere) while precisely indicting the structure of their argument. It identifies the problem not as "they are lying" or "they are stupid," but as "the machinery of their reasoning has no gears."
