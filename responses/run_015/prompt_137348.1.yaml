  1. **Competence Accumulation.** This thesis defines closeness strictly by the volume of competences conferred on the Union institutions to attain common objectives. It treats the Treaty's reference to conferring competences as the primary metric of integration.
  **Verdict:** Substantive and defensible. It aligns with the legal mechanism of integration but ignores the "peoples" relata.
  **Colleague's Inference:** Undercuts it. If closeness requires conferring competences, a tiered Union where some states confer fewer competences creates a "less close" relation for those states, violating the universal trajectory implied by "Union among the peoples."
  **Cases:** Passes Case B (competences widen); Fails Case A (no competence change); Fails Case D (net repatriation); Silent on Case C (depends if outer tier confers less).
  **Sovereignty:** Presupposes sovereignty is indivisible; pooling competences is a loss of state authority, so "closer" means "less sovereign states."
  **Deficit:** Implies the deficit is structural; increasing Union competences inherently distances decision-making from citizens, widening the legitimacy gap unless compensated.

  2. **Peoples' Interconnectedness.** This thesis locates closeness in the density of the transnational public sphere among the peoples of Europe, prioritizing the Preamble's relata over institutional structures.
  **Verdict:** Substantive and defensible. It respects the "peoples" wording but lacks a clear legal metric for enforcement.
  **Colleague's Inference:** Supports it. Social integration can proceed via a vanguard group without requiring uniform legal tiers for all member states.
  **Cases:** Passes Case A (thick programmes); Silent on Cases B, C, D (legal structures do not directly measure social ties or public sphere density).
  **Sovereignty:** Presupposes sovereignty as joint capacity; cultural exchange enhances joint action without necessarily diminishing state authority or requiring competence transfer.
  **Deficit:** Implies the deficit is a lag; building a transnational demos closes the gap between decisional closeness and the closeness of a people, legitimizing further integration.

  3. **Subsidiarity Proximity.** This thesis interprets closeness as decisions taken as closely as possible to the citizen, optimizing the level of governance rather than centralizing it.
  **Verdict:** Substantive and defensible. It leverages the "closely as possible to the citizen" clause to define the direction of travel.
  **Colleague's Inference:** Undercuts it. A permanent outer tier may fix decisions at a level too distant for some citizens, violating the optimization requirement for those populations.
  **Cases:** Passes Case D (repatriation respects proximity); Fails Case B (centralization without necessity); Silent on Case A (non-decisional); Silent on Case C (depends on efficiency).
  **Sovereignty:** Presupposes sovereignty as joint capacity; moving competences down restores state capacity without loss, viewing sovereignty as exercisable jointly at the optimal level.
  **Deficit:** Implies the deficit is a lag; optimizing the level reduces distance between voter and decision, potentially closing the deficit through better alignment.

  4. **Vectoral Minimalism.** This thesis requires only a non-decreasing net integration score across any dimension somewhere in the Union, treating the phrase as a directional aspiration rather than a uniform duty.
  **Verdict:** Trivial. It is true but incapable of bearing weight because any movement along one axis satisfies it, even if others regress.
  **Colleague's Inference:** Supports it explicitly. Any vanguard movement counts as "closer" regardless of stratification, making two-speed Union perfectly compatible.
  **Cases:** Passes Cases A, B, C; Fails Case D (if net loss); Silent on specific distribution of benefits or burdens across the Union.
  **Sovereignty:** Agnostic. Compatible with either zero-sum or joint capacity views, as it does not specify the mechanism of integration, only the direction.
  **Deficit:** Silent. It does not specify the relationship between integration direction and democratic legitimacy, allowing deficit to grow or shrink unnoticed.

  5. **Uniform Trajectory.** This thesis requires all member states and peoples to integrate at the same pace and depth, interpreting "Union among the peoples" as a singular, indivisible collective body.
  **Verdict:** False or incoherent. It contradicts the "process" wording and the practical reality of differentiated integration acknowledged in the Treaty.
  **Colleague's Inference:** Undercuts it. A two-speed Union violates the requirement for uniform movement, creating distinct classes of membership incompatible with a single Union.
  **Cases:** Fails Case C (legal stratification); Fails Case D (exit/readmission); Fails Case A (if programmes not universal); Silent on Case B.
  **Sovereignty:** Presupposes sovereignty is indivisible; uniform pooling is required to maintain equality, so differentiated integration threatens the sovereign equality of states.
  **Deficit:** Implies the deficit is structural; unequal integration creates permanent classes of citizenship, institutionalizing a democratic deficit for the outer tier.

  Only the Vectoral and Peoples' readings support differentiated integration without contradiction. The Competence and Uniformity readings render tiered integration legally precarious. The Subsidiarity reading offers a functional veto.
