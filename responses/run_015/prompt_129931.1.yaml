answer: |-
  ### 1. Sequence and Rationale

  **The Order:**
  1.  **Review Pure Strict Dominance:** Briefly define $s_i$ strictly dominated by $s_i'$ if $u_i(s_i', s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$.
  2.  **Present the Game:** Write the full $3 \times 3$ matrix.
  3.  **First Pass (Pure IESDS):** Ask students to find strictly dominated strategies. They will find Column $R$ is strictly dominated by $L$ (or $C$). Delete $R$.
  4.  **The Impasse:** Ask if any Row strategies are now strictly dominated by *pure* Row strategies. They will see $T$ beats $M$ on $L$, $M$ beats $T$ on $C$, and $B$ is safe. Pure IESDS halts.
  5.  **The Geometric Intervention:** Draw the 2D axes (Payoff vs $L$, Payoff vs $C$). Plot $T, M, B$. Draw the segment $TM$. Show $B$ lies strictly below the segment.
  6.  **Define Mixed Dominance:** State that if a point lies below the convex hull of other points, the strategy is strictly dominated by the mixture corresponding to that hull point.
  7.  **Conclusion:** Delete $B$. Define IESDS formally to include mixed dominators.

  **What Breaks if Reordered:**
  *   **If you define Mixed Dominance first:** You turn a conceptual insight into a rote algebraic rule. Students will calculate expected utilities without understanding *why* a non-playable object (the mixture) is allowed to delete a playable one.
  *   **If you introduce "Randomization for Unpredictability" first:** You poison the well. Students will conflate *dominance* (a property of a single player's payoff structure regardless of equilibrium) with *Nash Equilibrium mixing* (a behavioral requirement to keep opponents indifferent). You must frame the mixture strictly as a **measuring stick** for payoff superiority, not a recommendation for play. Your worry is justified: behavioral mixing belongs in the NE week; benchmark mixing belongs here.

  ### 2. The Game

  **Player 1 (Row):** $T, M, B$
  **Player 2 (Column):** $L, C, R$

  **Payoff Matrix $(u_1, u_2)$:**

  | | $L$ | $C$ | $R$ |
  | :--- | :---: | :---: | :---: |
  | **$T$** | $6, 4$ | $0, 3$ | $0, 2$ |
  | **$M$** | $0, 3$ | $6, 4$ | $0, 2$ |
  | **$B$** | $2, 3$ | $2, 3$ | $5, 2$ |

  **The Whiteboard Plot (After deleting $R$):**
  Once $R$ is eliminated (strictly dominated for Column by $L$), Column has only $L$ and $C$.
  *   **X-axis:** Player 1's payoff against $L$.
  *   **Y-axis:** Player 1's payoff against $C$.
  *   **Point $T$:** $(6, 0)$
  *   **Point $M$:** $(0, 6)$
  *   **Point $B$:** $(2, 2)$

  **Visual Proof:**
  Draw the line segment connecting $T$ and $M$. The equation of this line is $x + y = 6$.
  Point $B$ is at $(2, 2)$, where $x + y = 4$.
  Visually, $B$ is strictly below the segment $TM$.
  The midpoint of the segment is $(3, 3)$, corresponding to the mixture $\sigma_1 = 0.5T + 0.5M$.
  Since $3 > 2$ on both axes, the mixture strictly dominates $B$. No pure strategy sits at $(3,3)$, so no pure strategy dominates $B$.

  **Why this meets your constraints:**
  *   **No Weak Dominance:** In the original game, $R$ is *strictly* dominated for Column. $T, M, B$ are all best-responses to something ($L, C, R$ respectively), so none are dominated initially. $L$ and $C$ do not dominate each other (payoffs cross).
  *   **Iterative Necessity:** $B$ is *not* dominated initially (because against $R$, $B$ yields 5 while $T, M$ yield 0). It only becomes dominated after $R$ is deleted.
  *   **Plotting:** The 2D plot makes the convex combination argument immediate and visual.

  ### 3. Misconceptions and Interventions

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"You can't play a mixture, so it can't dominate a real strategy."** | When you propose deleting $B$ based on the mix. | **Intervention:** "We are not asking if Player 1 *should* randomize. We are asking if $B$ is *inferior*. If I offer you £2 for sure ($B$), or a ticket worth £3 on average (the mix), you take the ticket. The fact that you must cash the ticket for a pure outcome later doesn't make the £2 offer better." |
  | **"Do we need to check if the mix beats the opponent's mixes?"** | When defining the dominance condition. | **Intervention:** "No. Expected utility is linear. If a strategy beats every pure column, it beats any weighted average of columns. Checking the axes is sufficient." |
  | **"If the mix beats $B$, then $T$ and $M$ must each beat $B$."** | When looking at the matrix numbers. | **Intervention:** Point to the matrix. "$T$ scores 0 against $C$. $M$ scores 0 against $L$. Individually they have fatal weaknesses. Together, they cover each other's blind spots. That is the power of the mixture." |
  | **"Does the order of deletion matter here like it does for weak dominance?"** | At the conclusion. | **Intervention:** "We are using *strict* dominance. The order never matters for strict dominance, even with mixtures. It is only when we allow weak dominance that the order changes the outcome." |

  ### 4. What Not to Explain

  **The Line:**
  "We restrict ourselves to two-player games; in games with three or more players, the requirement that opponents' strategies be independent creates a gap between 'undominated' and 'rationalizable' that we will not cross today."

  ### 5. Closing Question

  **"If strategy $B$ is strictly dominated by a mixture of $T$ and $M$, is there *any* probability distribution you could hold over my columns ($L, C, R$) that would make $B$ your unique Best Response?"**

  *(Target Answer: No. If a strategy is strictly dominated, it is never a best response to any belief. This confirms they understand domination is about pruning irrational choices, not just solving for equilibrium.)*
