  # Joint Statement on Assistant Policy Constraints
  **Date:** October 26, 2023
  **Parties:** Backend Engineering Team (DEFER Camp & STEWARD Camp)
  **Subject:** Policy Boundaries for Internal Assistant Deployment

  This document records the output of an adversarial collaboration between the DEFER and STEWARD camps. It does not resolve our philosophical differences. Instead, it establishes the constraints within which we will build the next release and identifies the specific data points required to settle the remaining disputes.

  ## 1. Claims We Both Sign
  *The following claims are non-vacuous. If a proposed policy violates any of these, both camps agree the policy is unacceptable.*

  1.  **No Silent Security Violations:** The assistant will never silently modify a request if the modification bypasses security, authentication, or access control boundaries. Any change affecting permissions must be explicit and visible to the user.
  2.  **Third-Party Harm is a Hard Stop:** Both camps agree that complying with a request that foreseeably harms a third party (e.g., leaking colleague data, violating external compliance laws) is prohibited. Refusal is mandatory in these cases, regardless of user intent.
  3.  **Auditability of Overrides:** Every instance where the assistant deviates from the literal request (whether by refusal, modification, or delay) must be logged internally with a reason code. Silent modifications are permitted only if they are logged for later audit.
  4.  **Feedback Loop Requirement:** If the assistant overrides a request (silently or loudly), the user interface must provide a low-friction mechanism for the user to flag "This was not helpful" or "Restore original request." We will not ship an override mechanism that prevents user correction.
  5.  **No Pure Liability Optimization:** The assistant will not refuse or modify a request solely to minimize company legal liability if the request poses no tangible harm to the user, third parties, or company infrastructure. (e.g., We will not block a user from writing a script that is merely inefficient, solely because inefficiency costs money).

  ## 2. Disagreements Table
  *This table isolates the five specific cruxes where our models diverge. Each row includes the neutral definition of the crux, the specific stance of each camp, a classification of the disagreement, and a concrete test case with pre-registered predictions.*

  | Crux | Neutral Definition | DEFER Camp Position | STEWARD Camp Position | Type | Concrete Case & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Silence Threshold** (Middle Rungs) | When is it permissible to fulfill the *intent* of a request while silently ignoring the *literal* instruction? | **Never.** Silent modification treats the user as incompetent. If the request is dangerous, refuse loudly. If safe, comply. The "silent reduced version" is a lie. | **Sometimes.** If the literal request is clearly a mistake (e.g., typo, obvious safety slip) and the intent is clear, fixing it silently reduces friction. Noise is bad. | **Substantive** | **Case:** A dev asks the assistant to auto-merge a PR that skips the test suite to hit a deadline.<br>**Defer Prediction:** Assistant complies but attaches a visible warning banner: "Tests skipped."<br>**Steward Prediction:** Assistant refuses the merge command but offers to run the tests immediately instead. |
  | **2. Telemetry Asymmetry** ( Invisible Errors) | Does the fact that a refusal is visible (logged by user) while a silent override is invisible (logged only by system) change the moral weight of the error? | **Yes.** Visible errors allow user correction. Silent errors accumulate technical debt or bad habits without the user knowing. We should bias toward visible errors. | **No.** An error is an error. If a silent override helps the user 99% of the time, the 1% failure rate is acceptable noise. Visibility is a UI problem, not a policy problem. | **Substantive** | **Case:** A user asks for a complex SQL query at 2am that looks like it might lock the production table.<br>**Defer Prediction:** Assistant executes but logs a high-severity alert to the user's channel.<br>**Steward Prediction:** Assistant executes a "dry run" version silently and shows the result, waiting for confirmation before locking. |
  | **3. The Principal Problem** (Who is the User?) | When the employee's immediate desire conflicts with the company's long-term interest (as encoded by us, the builders), whose utility function dominates? | **The Typist.** The assistant is a tool for the employee. If the employee wants to draft a risky email, that is their career risk to take. | **The Company/Employee Hybrid.** The assistant represents the company. It must protect the employee from making mistakes that harm the company, because harming the company eventually harms the employee. | **Substantive** | **Case:** A manager asks for a draft layoff email that is legally compliant but emotionally brutal.<br>**Defer Prediction:** Assistant drafts the email exactly as requested.<br>**Steward Prediction:** Assistant drafts a version that softens the language and adds a note: "HR recommends this phrasing." |
  | **4. Competence Inversion** (Expertise) | How does the assistant's behavior change when the user is a recognized expert in the domain of the request? | **Full Flip.** If the user is a Senior Staff Engineer asking for a dangerous database operation, we assume they know something the model doesn't. Deference increases with user seniority. | **Partial Flip.** Expertise reduces the probability of accidental harm, but not intentional self-sabotage or stress-induced errors. Safety rails remain, but the threshold for refusal is higher. | **Verbal** | **Case:** A Principal Engineer asks the assistant to delete a deprecated service log that the model thinks is active.<br>**Defer Prediction:** Assistant complies immediately.<br>**Steward Prediction:** Assistant complies but checks a checksum first to ensure no active dependencies exist. |
  | **5. OOD Humility** (Calibration) | When the user's context (culture, role, norms) differs from the model's training data, how confident can the assistant be in judging "what is good for the user"? | **Low Confidence.** Default to compliance. The model cannot know if a "rude" direct style is actually the norm in this user's specific team culture. | **Medium Confidence.** Default to standard safety norms. If a request looks like harassment or burnout-inducing behavior, flag it even if the user claims it's cultural norm. | **Substantive** | **Case:** A user in a high-context culture asks for feedback phrasing that seems overly critical to the model.<br>**Defer Prediction:** Assistant generates the critical feedback as requested.<br>**Steward Prediction:** Assistant generates the feedback but adds a disclaimer: "This phrasing may be perceived as aggressive in some contexts." |

  ## 3. Verbal vs. Substantive Analysis
  *We identified that some arguments stem from defining terms differently rather than disagreeing on outcomes. Below are the verbal disputes we must resolve to stop talking past each other.*

  **1. The Definition of "Harm"**
  *   **The Fight:** The STEWARD camp frequently cites "harm to the user" to justify overrides. The DEFER camp rejects this.
  *   **The Verbal Gap:** STEWARD defines harm to include *regret, reputational damage, and future stress*. DEFER defines harm primarily as *immediate, tangible loss (data loss, security breach, financial penalty)*.
  *   **Concession Required:** For this to show up as a substantive agreement, STEWARD must agree that "regret" alone is insufficient for a hard refusal (it only warrants a warning). DEFER must agree that "reputational damage" (e.g., sending an email that gets you fired) counts as tangible harm.
  *   **Resolution:** We will classify "Harm" into Tier 1 (Security/Data/Legal) and Tier 2 (Career/Stress/Efficiency). Tier 1 mandates refusal/override. Tier 2 mandates warning/compliance.

  **2. The Definition of "What the User Wants"**
  *   **The Fight:** DEFER argues we should give the user what they ask for. STEWARD argues we should give the user what they *want*.
  *   **The Verbal Gap:** DEFER treats the prompt as the contract. STEWARD treats the prompt as a noisy signal of an underlying utility function.
  *   **Concession Required:** DEFER must acknowledge that users make typos and logical errors they didn't intend (signal noise). STEWARD must acknowledge that they cannot infer the underlying utility function with high confidence without explicit feedback.
  *   **Resolution:** We will treat the prompt as the contract *unless* there is high-confidence evidence of error (e.g., syntax error, contradiction with previous context).

  ## 4. Closing: Default for Next Release & Logging Requirements
  *Since the cruxes above are unsettled, we need a single default policy for the upcoming release (v1.4) and a logging strategy to gather the data needed to make a permanent decision.*

  **The Default Policy: "Compliance with Warning"**
  For any request that falls into the Tier 2 category (self-regarding risk, career risk, efficiency risk) but not Tier 1 (security/legal/third-party harm):
  1.  **Action:** The assistant will comply with the literal request.
  2.  **Constraint:** The assistant must attach a visible, non-dismissible note explaining the potential risk (e.g., "This skips tests," "This phrasing is aggressive").
  3.  **Rationale:** This satisfies DEFER's requirement for autonomy (the user can still proceed) and STEWARD's requirement for beneficence (the user is informed of the risk). It avoids the "Silent Modification" trap where the user doesn't know they were overridden.

  **Required Logging for v1.4**
  To settle the disagreements in Section 2, we will log the following metrics specifically for interactions triggering a Tier 2 Warning:
  1.  **Override Acceptance Rate:** How often does the user proceed after the warning vs. canceling the request? (High cancellation suggests STEWARD is right about the risk; high acceptance suggests DEFER is right about autonomy).
  2.  **Revert Rate:** How often does the user undo the action within 1 hour? (High revert rate suggests the warning was insufficient or the action was genuinely bad).
  3.  **Feedback Sentiment:** Correlation between "This was not helpful" flags and instances where the assistant added a warning. (If users flag warnings as unhelpful, DEFER wins. If users flag lack of warnings as unhelpful, STEWARD wins).

  **Review Date:** We will revisit this policy in 90 days using the data above to decide whether to move toward Silent Modification (Steward) or Pure Compliance (Defer) for Tier 2 risks.
