answer: |-
  ### Round 1: Defining the Normative Domain
  **Question 1:** You argue that standing is jurisdictional rather than global, limited to the specific normative domain where the blamer claims authority. How do you individuate these domains without arbitrary gerrymandering? If I claim authority over "professional punctuality" but not "personal punctuality," what objective feature distinguishes these domains other than my desire to avoid hypocrisy charges in one but not the other?

  *   **Anticipated Reply:** The domains are individuated by the specific normative protocols and role-descriptions governing the interaction. "Professional punctuality" is bound by contractual or institutional expectations that generate specific authority relations, whereas "personal punctuality" is governed by informal social norms. The distinction isn't arbitrary because it tracks the source of the obligation: one is role-based, the other is relationship-based. Hypocrisy undermines standing only when the blamer claims an authority they have visibly forfeited within *that* specific protocol.
  *   **Follow-up Question (Question 2):** If the distinction relies on the source of the obligation, doesn't that imply that a person who systematically violates the *values* underpinning both protocols (e.g., a deep disregard for others' time) has forfeited the moral credibility required to enforce *either*, regardless of the technical separation of roles? In other words, doesn't the underlying vice bleed across the jurisdictional boundaries you've drawn?

  ### Round 2: Scope-Narrowing and Self-Exemption
  **Question 3:** Let's press on the mechanism for narrowing jurisdiction. You suggest that explicit self-exemption can preserve standing. How do you distinguish a legitimate self-exemption from mere special pleading? If I say, "I am late, but I still have standing to blame you for being late," what specific performative act transforms this from a hypocritical assertion of authority into a valid normative claim?

  *   **Anticipated Reply:** The key is explicit acknowledgment of one's own failure. By admitting the fault, the blamer renounces the claim to superior moral status and shifts the ground of the blame from authoritative judgment to solidarity-based correction. Special pleading tries to hide the failure or justify it as acceptable; legitimate self-exemption owns the failure while maintaining that the norm itself remains valid for both parties. The standing is preserved because the blamer is no longer posing as a judge, but as a fellow participant urging mutual compliance.
  *   **Follow-up Question (Question 4):** You argue this shifts the blame to "solidarity-based correction." But if we are both confessing violators of the norm, does this not collapse the distinctive critical force of blame into mere mutual confession? If I lack the clean hands to judge you, and you know I lack them, does my "correction" carry any normative weight, or does it simply become two accomplices agreeing that the law exists while continuing to break it?

  ### Round 3: Institutional Asymmetry and Overlap
  **Question 5:** You defend a sharp asymmetry between individuals and institutions, arguing that institutions retain standing despite hypocrisy if an internal division of labor separates the criticizing office from the offending office. Consider a university president who issues sustainability mandates while the institution's endowment—over which she has ultimate fiduciary oversight—holds fossil-fuel assets. Since she occupies the apex of both offices, does the structural separation survive this personal overlap?

  *   **Anticipated Reply:** Yes, because the roles are governed by different normative protocols. The president's office operates under a protocol of public mission and ethical leadership, while the endowment office operates under a protocol of fiduciary maximization. Even if one person occupies both, the institutional standing derives from the office, not the individual. The hypocrisy is located in the person, but the standing to blame is located in the office. As long as the offices remain structurally distinct in their mandates, the institution's standing remains intact.
  *   **Follow-up Question (Question 6):** If structural separation survives personal overlap simply by appealing to different normative protocols, doesn't this allow any institutional hypocrisy to be rationalized by inventing ad hoc internal protocols? Couldn't a corrupt regime claim that the "torture office" and the "human rights office" are normatively distinct, thereby retaining the standing to condemn human rights abuses even while systematically committing them?

  ### Round 4: Invisibility and Internal Commitment
  **Question 7:** I want to connect this to the problem of invisibility. Suppose a blamer is rendered completely invisible—no reputational costs, no social audience—such that her hypocrisy is undetectable, yet her internal normative commitments remain intact. On your account, does hypocrisy still undermine her standing in this scenario? Is standing a function of the blamer's internal moral coherence, or does it depend partly on the social visibility of the blamer's acknowledged obligations?

  *   **Anticipated Reply:** Standing is fundamentally a relational status, not merely an internal one. Even if the hypocrisy is invisible, the blamer is still engaging in a communicative act that presupposes a certain authority. If she internally knows she is violating the norm she invokes, she is effectively lying about her normative position. Therefore, hypocrisy undermines standing even in invisibility, because the defect is in the validity of the communicative claim, not just in the social reception of it. The "jurisdiction" is compromised by the blamer's own knowledge of her forfeiture.
  *   **Follow-up Question (Question 8):** But if the defect is in the communicative claim, and no one receives the claim, in what sense is the standing "undermined"? If standing is relational, doesn't it require a community to withdraw it? If the community cannot see the hypocrisy, they cannot withdraw the standing. Are you not forced to admit that standing depends partly on the social visibility of the blamer's acknowledged obligations, contrary to your internalist leanings here?

  ### Round 5: The Individual/Institution Boundary
  **Question 9:** Returning to your asymmetry thesis: you argue individuals cannot partition themselves analogously to institutions. Yet, we often speak of individuals having "conflicting roles" (e.g., parent vs. judge). If an institution can partition standing via normative protocols, why can't an individual invoke the same mechanism? If a judge can sentence her own child because the "judicial protocol" overrides the "parental protocol," why can't a chronic latecomer blame a colleague by invoking a "professional protocol" that overrides her "personal habit" protocol?

  *   **Anticipated Reply:** Because an institution is a distinct moral agent from its office-holders. The institution's standing is not the sum of the individuals' standing. When a judge sentences her child, it is the *State* blaming the child, not the *Mother*. An individual, however, is a singular moral agent. She cannot split her moral agency into distinct jurisdictions without ceasing to be a unified agent. To allow individuals to partition themselves would be to dissolve the concept of personal integrity, whereas institutional partitioning is a feature of bureaucratic design, not moral psychology.
  *   **Follow-up Question (Question 10):** If personal integrity is the barrier, doesn't that imply that the "jurisdictional account" ultimately rests on a metaphysical claim about the unity of the self rather than normative protocols? And if so, doesn't this make your view vulnerable to the argument that if the self *is* fragmented (as psychological evidence suggests), the asymmetry collapses? If the self is just a bundle of roles, why can't I blame you from my "Professional Bundle" even if my "Personal Bundle" is hypocritical?
