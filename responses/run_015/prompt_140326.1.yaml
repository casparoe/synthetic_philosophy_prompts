  ### Empty & Incoherent Combinations

  **1. The "Abolish Everything" Cell (Priya + Abolition)**
  *   **Combination:** Leaf 7 (Everything is constructed) + Leaf 3 (We should abolish it).
  *   **Diagnosis:** **Incoherent/Unattractive.** If *everything* (rocks, trees, money, race) is constructed, "abolishing construction" means abolishing language or cognition. Nobody holds this. Priya uses the claim to stop the debate, not to start a revolution.

  **2. The "Causal Abolitionist" Cell**
  *   **Combination:** Leaf 2 (Causal/Physical Residue) + Leaf 3 (Abolish).
  *   **Diagnosis:** **Unoccupied.** If you believe the kind has physical residue (e.g., genetic clusters), people rarely argue we should *abolish* the classification, only that we shouldn't *value* it hierarchically. Abolition usually targets the *rules* (Leaf 3 path), not the *physical effects*.

  **3. The "Looping Naturalist" Cell**
  *   **Combination:** Leaf 1 (Natural Realism) + Leaf 4 (Looping).
  *   **Diagnosis:** **Incoherent.** If the kind exists without humans (Leaf 1), human labeling cannot change what the kind *is* (Leaf 4). It might change behavior, but not the kind itself.

