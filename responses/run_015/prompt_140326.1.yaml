  ### The Leaves (Positions & Predictions)

  Here are the 8 terminal positions. Each includes the prediction for **Money**, **Race (US 1900 Census "Black" category)**, **Gender**, **Organic (Legal)**, and **Noise**.

  **Leaf 1: Natural Realism**
  *   **Path:** Q1(Yes).
  *   **View:** The kind exists independently of us. Calling it "constructed" is false.
  *   **Predictions:**
      *   *Money:* False. (Money needs us).
      *   *Race:* True (on some biological views).
      *   *Gender:* True (on some essentialist views).
      *   *Organic:* False. (Needs certifiers).
      *   *Noise:* False. (Needs a listener).
  *   **Status:** **Defended.** (Standard scientific realism).

  **Leaf 2: Causal Constructionism (Origins Only)**
  *   **Path:** Q1(No) → Q2(Yes) → Q3(Yes).
  *   **View:** We caused this kind to exist, but it is now made of physical stuff that stands on its own. Our current attitudes don't sustain it.
  *   **Predictions:**
      *   *Money:* False. (Money needs current agreement).
      *   *Race:* Plausible (if viewed as biological divergence caused by segregation).
      *   *Gender:* Plausible (if viewed as biological dimorphism shaped by evolution).
      *   *Organic:* False. (Needs current certification).
      *   *Noise:* False. (Needs current annoyance).
  *   **Status:** **Defended.** (Often used in debates about whether race has biological *consequences* even if socially *caused*).

  **Leaf 3: Critical Abolitionism**
  *   **Path:** Q1(No) → Q2(No) → Q4(No) → Q5(Yes) → Q6(Yes).
  *   **View:** This kind is made of our attitudes, it hurts people (feedback), and we should get rid of it.
  *   **Predictions:**
      *   *Money:* False (Most want to keep money).
      *   *Race:* **True.** (Racial eliminativism).
      *   *Gender:* Contested (Some gender abolitionists).
      *   *Organic:* False (Nobody wants to abolish 'organic').
      *   *Noise:* False (We need the concept).
  *   **Status:** **Defended.** (Common in critical race theory).

  **Leaf 4: Interactive Constructionism (Looping)**
  *   **Path:** Q1(No) → Q2(No) → Q4(No) → Q5(Yes) → Q6(No).
  *   **View:** The kind is made of attitudes and changes the people classified, but we should keep using it carefully.
  *   **Predictions:**
      *   *Money:* True (Inflation/behavior changes).
      *   *Race:* True (Identity formation).
      *   *Gender:* **True.** (Performativity).
      *   *Organic:* False (Tomatoes don't change behavior).
      *   *Noise:* False (Soundwaves don't change behavior).
  *   **Status:** **Defended.** (Ian Hacking's "Making Up People").

  **Leaf 5: Error Theory / Fictionalism**
  *   **Path:** Q1(No) → Q2(No) → Q4(No) → Q5(No) → Q7(No).
  *   **View:** The kind is made up, doesn't help us explain anything, and is basically a mistake.
  *   **Predictions:**
      *   *Money:* False (Money explains trade).
      *   *Race:* **True.** (If one thinks race is biologically fake *and* socially useless).
      *   *Gender:* Contested.
      *   *Organic:* False (Useful for marketing).
      *   *Noise:* False (Useful for acoustics).
  *   **Status:** **Unattractive.** (Rare to say a concept is *both* constructed *and* useless unless you want to abolish it, which moves you to Leaf 3).

  **Leaf 6: Institutional Realism**
  *   **Path:** Q1(No) → Q2(No) → Q4(No) → Q5(No) → Q7(Yes) → Q8(No).
  *   **View:** The kind is made of rules/agreements, is contingent, but there is an objective fact about whether the rules are met.
  *   **Predictions:**
      *   *Money:* **True.** (You can be wrong about counterfeit bills).
      *   *Race:* True (Under legal definitions like 1900 Census).
      *   *Gender:* True (Under legal sex markers).
      *   *Organic:* **True.** (You either have the cert or you don't).
      *   *Noise:* False (Noise is subjective).
  *   **Status:** **Defended.** (John Searle's "Status Functions" without the jargon).

  **Leaf 7: Trivial Universalism (Priya's Leaf)**
  *   **Path:** Q1(No) → Q2(No) → Q4(No) → Q5(No) → Q7(Yes) → Q8(Yes).
  *   **View:** Everything is constructed in this way (even rocks), so saying "X is constructed" tells us nothing special about X.
  *   **Predictions:**
      *   *Money:* True.
      *   *Race:* True.
      *   *Gender:* True.
      *   *Organic:* True.
      *   *Noise:* True.
  *   **Status:** **Defended.** (Some strong social constructivists/linguistic idealists). *Note: Often leads to silence because the term loses bite.*

  **Leaf 8: Relational Subjectivism**
  *   **Path:** Q1(No) → Q2(No) → Q4(No) → Q5(No) → Q7(Yes) → Q8(Yes) [Specific to observer].
  *   **View:** The kind exists only in the relation between the object and the observer's attitude.
  *   **Predictions:**
      *   *Money:* False (Money is intersubjective, not just my attitude).
      *   *Race:* False (Race is usually treated as external to the observer).
      *   *Gender:* Contested (Some views of gender identity).
      *   *Organic:* False (Certification is external).
      *   *Noise:* **True.** (If I don't mind the sound, it's not noise).
  *   **Status:** **Defended.** (Specific to aesthetic/phenomenological kinds).

