answer: |-
  1. "Bottom line"
  0.4. The distinction relies on a notion of experience that dissolves under empirical scrutiny, making the question category-mistaken rather than merely technically difficult.

  2. "The sub-questions"
  1. **Distinction well-defined (0.2):** Dennett's Multiple Drafts model argues 'Orwellian' and 'Stalinesque' describe identical functional architectures with different metaphors, rendering the choice illusory.
  2. **Experience at $t$ independent of report (0.3):** Phenomenal content likely supervenes on availability for report; without report, 'experience at $t$' lacks truth conditions.
  3. **Neural state differs at $t$ (0.9):** Predictive coding versus retrospective fitting will inevitably leave distinct neural signatures in early visual cortex.
  4. **Mapping neural state to experience timing (0.2):** A neural signature of 'green' processing does not entail 'green experience' occurred then rather than later; this is the explanatory gap.
  5. **Probe measures experience not processing (0.3):** Your chromatic probe fails here. It measures sensitivity thresholds, which reflect subpersonal adaptation, not phenomenology. You measure the machinery, not the show. A green-biased threshold at $t$ could support Stalinesque (predictive construction) or Orwellian (early revision) equally well.
  6. **Field acceptance as settlement (0.5):** Neuroscientists might claim victory based on neural timing; philosophers will dispute the inference to phenomenology.
  7. **Verdict is 'neither story' (0.8):** The most likely empirical outcome is that the dichotomy is false, which settles the question by dissolving it, though this violates the 'different measurement' constraint.

  The probe idea is clever but targets the wrong layer. It assumes chromatic adaptation maps one-to-one with phenomenal color, but adaptation is a gain-control mechanism available to unconscious systems. Even if the probe shows green sensitivity at $t$, the subject might not experience green until the narrative is finalized post-flash. The term that dies with the probe is #5; without it, you cannot bridge #3 (neural state) to #4 (experience timing). The probe reads out the visual system's predictive state, not the content of consciousness. Consequently, the Orwellian story can claim the probe measures the pre-revision state, while the Stalinesque story claims it measures the pre-conscious construction phase. Both accommodate the data.

  3. "How they combine"
  The bottom line is dominated by the low credence on terms #1, #2, and #4. Even if neural states differ (#3 is 0.9), without a well-defined distinction (#1) or a bridge from neural state to experience timing (#4), the measurement cannot decide the stories. The high probability of dissolution (#7) raises the score slightly, as settling via dissolution counts per your ground rules, but since this violates the 'different measurement' constraint, it cannot push the number above 0.5. The terms are not independent; if #1 is false, #4 becomes impossible.

  4. "Where it's fragile"
  Term #4 (Mapping neural state to experience timing) is the weakest link. If we discover a Neural Correlate of Consciousness (NCC) with precise temporal resolution that strictly binds processing to phenomenality, this number jumps to 0.9, dragging the bottom line up. The single piece of evidence that would move my number most is a demonstration that altering neural activity at $t$ changes the reported timing of experience without altering the report itself. Currently, we assume neural timing equals experiential timing, but that is an assumption, not a finding. If that link breaks, the empirical question collapses.

  5. "Where the disagreement lives"
  You (0.3) and your friend (0.7) disagree primarily on Term #5 (Probe viability) and Term #1 (Definition). Your friend assumes the probe reads experience directly; I side with you that it reads processing. However, you are likely too pessimistic on Term #7 (Dissolution). I would tell your friend that the probe cannot distinguish the stories because both accommodate neural data. I would tell you that while the probe fails, empirical work may still settle the debate by proving the distinction itself is void, which counts as an answer under your rules.
