  hey im writing a novel about three historians who keep arguing over wether a myth can ever become history, and i found this summary in some unnamed popular book — maybe called The Boundary of Legend? — that tries to draw one line across three cases. it says the Trojan War counts as history now not because Schliemann dug up the right hill, but because Hittite diplomatic texts mention a western Anatolian city that sounds like Ilios, and the story of a trade-route conflict fits the Late Bronze Age collapse, even if the wooden horse is just literary embroidery. for King Arthur, it claims he stays firmly in legend because there's no contemporary administrative record — not even Welsh annals count, since the Annales Cambriae are 10th-century at earliest and the battle lists inside them are clearly retrospective — so without a 5th- or 6th-century charter or tax record linking to a real warlord, there's nothing to grab onto. and for the Exodus, it argues the story is stuck in legend not merely because Egyptian archives are silent, but because there's an active contradiction with Egyptian victory stelae that place Israel in Canaan around the late 13th century BCE; the summary then adds that the minimal kernel of a small group leaving Egypt can't be separated from the miracle narrative without destroying the tradition's internal coherence, so archaeologists rightly treat the whole thing as myth.

  i want to know if this is a fair summary of what specialists actually think, or if it's sneaking in a hidden philosophy of history. specifically, does the administrative record rule get applied consistently — does Troy get a pass on direct documentation that Arthur doesn't? and is the coherence argument about Exodus actually used by archaeologists, or is it a theological point being dressed up as historical method? please answer in british english, and say what would change your mind — for instance, if a 6th-century charter naming Arthur turned up, or if new Hittite decipherments showed that western Anatolian city was purely a ritual metaphor, would that make you think the summary was wrong? also tell me where your reasoning is most likely to fail, since im asking you to judge fields you might not be deep in.
