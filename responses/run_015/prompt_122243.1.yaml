answer: |-
  This is a fascinating premise for a novel, and the summary you have found poses some sharp historiographical questions. I cannot verify the existence of a popular book specifically titled *The Boundary of Legend*; it does not appear in standard bibliographies of historical theory or archaeology. It is possible the title is misremembered, or perhaps it is a fictional text within your own research context. However, the *arguments* presented in that summary are recognisable as positions held within academic circles, albeit simplified for a popular audience.

  Here is an analysis of whether that summary is fair, where it might be smuggling in a philosophy, and how the consistency holds up across the three cases.

  ### 1. The Case of Troy: History or Embroidery?
  The summary is broadly fair regarding the scholarly consensus on Troy. Most specialists today accept that there is a historical kernel to the Trojan War. This is not merely because Heinrich Schliemann dug up Hisarlik, but because the material culture (Troy VI and VIIa) shows signs of destruction by warfare around the Late Bronze Age (c. 1200 BCE).

  Crucially, the summary is correct to highlight the Hittite texts. The Hittite archives mention a vassal state called *Wilusa* (widely equated with Ilios/Troy) and a western power called *Ahhiyawa* (generally accepted as the Homeric Achaeans). There are records of tensions and possibly a treaty regarding Wilusa.
  *   **Verdict:** The summary is accurate here. Historians distinguish between the *event* (a conflict over trade or territory in western Anatolia) and the *narrative* (the *Iliad*, the gods, the Wooden Horse). The Wooden Horse is treated as literary embroidery, but the war itself is elevated to 'history' because of external, contemporary corroboration.

  ### 2. The Case of King Arthur: The Administrative Bar
  This is where the summary becomes more contentious. The argument that Arthur remains legend due to a lack of contemporary administrative records is the standard 'sceptical' position, but the specific demand for a 'charter or tax record' is problematic.
  *   **The Anachronism:** In 5th- and 6th-century Sub-Roman Britain, the administrative machinery that produced charters and tax records (as seen in later Anglo-Saxon or Frankish kingdoms) had largely collapsed. Demanding a 6th-century British charter is rather like demanding a text message from a Dark Age warlord; the medium simply did not exist in that form.
  *   **The Consistency Check:** You asked if the 'administrative record rule' is applied consistently. In a strict sense, no. Troy is granted historical status without a specific 'Agamemnon tax record' or a Hittite text explicitly describing the siege of Troy as Homer tells it. It is granted status based on *archaeological destruction layers* plus *indirect textual mention* of the city. Arthur lacks the archaeological correlation (a specific 'Battle of Badon' site is disputed) and lacks *any* contemporary textual mention (Gildas, writing in the 6th century, mentions a siege but does not name Arthur).
  *   **Verdict:** The summary is slightly unfair to Arthurian scholars by setting an anachronistic bar (charters), but the underlying point stands: Arthur lacks the *convergence of evidence* that Troy possesses. If a contemporary inscription naming Arthur as a commander at a specific battle were found, the consensus would shift rapidly.

  ### 3. The Case of Exodus: Coherence vs. Evidence
  The summary's treatment of the Exodus is the most philosophically loaded. It is true that the majority of archaeologists (such as Israel Finkelstein or William Dever) regard the Exodus as aetiological myth rather than history. The silence of Egyptian archives is significant, but the Merneptah Stele (c. 1208 BCE) is the stronger evidence; it places 'Israel' as a people already established in Canaan, contradicting a narrative of conquest *after* a wilderness wandering.

  However, the claim that archaeologists treat it as myth because separating the 'kernel' from the 'miracle' destroys the tradition's internal coherence is suspect.
  *   **The Methodological Issue:** Historians routinely separate kernel from miracle. We study the historical Jesus without accepting the Resurrection as a biological event; we study the life of Muhammad without accepting the supernatural aspects of the Night Journey as historical fact. To argue that the Exodus *cannot* be studied historically because removing the miracles ruins the *theological* story is a theological argument, not a historical one.
  *   **The Real Reason:** Archaeologists reject the Exodus narrative primarily because of a *lack of material evidence* (no evidence of a mass population in the Sinai during the Late Bronze Age) and *contradictory evidence* (the Merneptah Stele, Egyptian control of Canaan during the supposed period).
  *   **Verdict:** The summary is likely sneaking in a philosophical or theological point here. It suggests that some narratives are 'indivisible', which is a literary or theological claim, not a standard historical method. Historians usually argue the kernel is unrecoverable due to lack of evidence, not because extracting it ruins the story.

  ### 4. The Hidden Philosophy of History
  The summary appears to rely on a form of **positivism** or **verificationism**. It implies that 'History' begins only when a narrative can be corroborated by external, preferably administrative or diplomatic, documentation.
  *   **Troy** passes because of Hittite diplomacy.
  *   **Arthur** fails because of the lack of bureaucracy in Dark Age Britain.
  *   **Exodus** fails because of contradictory state propaganda (stelae).

  This privileges the 'State' view of history (records, taxes, treaties) over the 'Social' view (oral tradition, cultural memory). It is a coherent philosophy, but it is not the *only* way to do history. Some historians argue that 'myth' is a form of social history even if the events didn't happen, but your summary is drawing a hard line between 'Legend' and 'History'.

  ### 5. What Would Change My Mind?
  You asked what evidence would alter the assessment of this summary's validity.

  *   **For Arthur:** If a 6th-century inscription were discovered in Britain (perhaps on a stone marker or lead tablet) that explicitly named 'Arthur' as *Dux Bellorum* or linked him to a specific battle dated stratigraphically to that period, the 'administrative rule' would be exposed as inconsistent. We do not require such specific naming for many other accepted historical figures of the Migration Period. The *Artognou stone* found at Tintagel hints at this, but does not confirm the legendary king.
  *   **For Troy:** If new Hittite decipherments revealed that 'Wilusa' was explicitly described by a Hittite scribe as a ritual metaphor or a purely mythical place name with no geographical referent, the historical status of the Trojan War would collapse back into legend.
  *   **For Exodus:** If archaeological surveys in the Sinai Peninsula uncovered evidence of a semi-nomadic group of Semitic origin dating precisely to the 13th century BCE in numbers consistent with even a small 'kernel' (hundreds, not millions), the 'coherence argument' would be exposed as theological protectionism. Historians would immediately attempt to separate the kernel from the miracle, regardless of the tradition's internal coherence.

  ### 6. Where My Reasoning Might Fail
  I must be transparent about the limitations of my analysis, as you requested.
  *   **Specialist Nuance:** I am synthesising general academic consensus. There are 'maximalist' biblical archaeologists who argue for the Exodus, and 'traditionalist' Arthurians who argue for a historical king. My assessment leans towards the mainstream 'minimalist' or sceptical consensus, which might overlook valid minority arguments your novel's characters could exploit.
  *   **The Unnamed Book:** Since I cannot verify the specific book *The Boundary of Legend*, I am analysing the arguments in isolation. It is possible the original author qualified these points in ways the summary you found has omitted. For instance, the 'coherence' argument regarding Exodus might have been a critique of a specific theologian, not a general rule of archaeology.
  *   **Definition of 'History':** My reasoning assumes a modern, secular definition of history. If your novel's historians are operating under different definitions (e.g., oral history as valid history), my judgement of 'fairness' might not apply to their internal logic.

  In summary, the summary you found is a robust representation of the sceptical mainstream, but it is inconsistent regarding the 'administrative' requirement (due to anachronism in the Arthurian case) and it likely misrepresents the archaeological rejection of the Exodus as a matter of narrative coherence rather than material absence. This tension would make for excellent dialogue in your novel.
