  **VERIDIAN STREAMLINES**
  **INTERNAL MEMO | PEOPLE OPERATIONS**
  **TO:** All Staff
  **FROM:** Performance Management Division
  **DATE:** October 14, 2024
  **SUBJECT:** Implementation of Performance Tier 5 ("Beyond the Call")

  **1.0 Definition of Tier**
  Effective Q4 2024, the Performance Rubric will expand from four tiers to five. The new fifth tier, designated "Beyond the Call" (BtC), recognizes contributions that exceed the requirements of the employee's role description and standard excellence metrics. Unlike Tier 4 ("Exceeds Expectations"), which rewards high proficiency in mandatory duties, Tier 5 rewards actions that were not strictly obligatory upon the agent.

  **2.0 Promotion Precondition**
  Achievement of a Tier 5 rating in at least one review cycle is now a mandatory precondition for promotion from Level 4 to Level 5 and above. Employees seeking advancement must demonstrate a documented history of BtC performance. While the actions classified under Tier 5 are defined as non-obligatory, completion of such actions is required for career progression within the upper bands.¹

  **2.1 Reclassification of Duty**
  To resolve the conflict between Section 1.0 and Section 2.0, employees should understand that while specific acts remain discretionary in selection, the *category* of performance is mandatory. Failure to select and execute a discretionary act constitutes a failure to meet promotion requirements.

  **3.0 Intent and Instrumentalization**
  Credit toward Tier 5 will not be awarded for acts undertaken with the primary intent of securing a Tier 5 rating. The motivational structure of the agent must align with altruistic or company-first objectives rather than performance metric optimization. Managers are instructed to assess intent during review conversations. Evidence of instrumentalization will result in downgrading to Tier 4.

  **4.0 Cost and Sacrifice**
  A key differentiator for Tier 5 is the incurrence of personal cost. Actions that are easy or cost-neutral to the agent do not qualify, regardless of outcome value. Employees must submit Attachment B (Evidence of Personal Sacrifice) alongside any Tier 5 nomination. Acceptable evidence includes documented overtime exceeding policy limits, forfeiture of accrued leave, or verified stress-related medical consultations linked to the project.²

  **5.0 Collective Initiatives**
  In cases where a team executes a project that was not mandated, Tier 5 eligibility is assessed at the unit level. If the initiative itself was optional, the unit qualifies for Tier 5 classification regardless of individual burden distribution. Consequently, if a team undertakes an optional project where every individual's contribution remained within reasonable standard hours, all members receive Tier 5 credit. Individual sacrifice is not required if the collective output exceeds mandatory scope.

  **6.0 Audit and Verification**
  People Ops will conduct random audits on Tier 5 claims. However, due to the internal nature of motivational states (Section 3.0), verification relies on self-reporting and managerial attestation. Discrepancies between reported intent and observed career ambition will be flagged for review.

  **7.0 Rubric Saturation**
  This adjustment addresses statistical compression in the previous four-tier system. Data indicated that 85% of senior staff were clustered in Tier 4, rendering the distinction meaningless for compensation differentiation. The Tier 5 bucket is necessary to isolate top performers who deliver value outside defined constraints.

  ***

  **FAQ**

  **Q: If I need Tier 5 for promotion, isn't it required?**
  A: The specific act is optional; the rating is required. You may choose any act not listed in your job description.

  **Q: Can I sacrifice my vacation time retroactively?**
  A: No. Sacrifice must be concurrent with the act. Attachment B requires timestamps.

  **Q: What if my team did something optional but I worked normal hours?**
  A: Per Section 5.0, you qualify. The supererogatory status attaches to the project scope, not the individual labor cost.

  ***

  **CALIBRATION NOTE (COMPENSATION COMMITTEE)**
  *Please note that while the philosophical coherence of Tier 5 is subject to ongoing review, the business need for differentiation is immediate. We understand that mandating the optional creates a category error. However, we cannot compensate "Exceeds Expectations" at the level required to retain top talent without creating inflation. Treat Tier 5 as a functional bucket for high-impact outliers. If the definition of "optional" becomes ambiguous, default to approving the nomination. We need the bucket more than we need the distinction.*

  ¹ *Note: This section appears to conflict with Code of Conduct §4.2 (Duty of Maximal Utility), which states employees must always perform the action yielding the highest overall good. If §4.2 is enforced strictly, no action is optional, rendering Tier 5 obsolete. Until Legal clarifies §4.2, proceed with Tier 5 implementation.*
  ² *Attachment B must be notarized if sacrifice involves health metrics.*
