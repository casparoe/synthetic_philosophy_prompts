answer: |-
  This is a request for a **meta-ethical and methodological specification**. You are asking for the engineering blueprint before anyone tries to build the bridge. Most debates fail because one side is optimizing for *biodiversity*, another for *carbon*, and another for *sentient welfare*, but they all use the word "nature."

  Here is the specification for an adequate theory of **Net Ecosystem Welfare (NEW)**.

  ---

  ### Part 1: The Requirements Specification

  #### 1. Case Coverage (The "Must-Distinguish" List)
  A theory is inadequate if it yields the same verdict for morally/ecologically distinct states. It must generate differentiated outputs for:
  *   **The Swap:** Primary Rainforest $\rightarrow$ Oil Palm. (High biodiversity/complexity $\rightarrow$ Low biodiversity/simple).
  *   **The Conversion:** Logged Forest $\rightarrow$ Cattle Pasture. (Degraded wild $\rightarrow$ Domesticated).
  *   **The Engineering:** A Dam. (Floods a valley $\rightarrow$ Creates a reservoir $\rightarrow$ Alters downstream flow).
  *   **The "Empty Forest":** A protected area that retains canopy but is defaunated of megafauna due to poaching. (Structure remains, welfare subjects vanish).
  *   **The r-Strategy Problem:** A pond with 10,000 frog eggs (9,999 die painfully) vs. a zoo with 2 elephants (0 die painfully, but low autonomy).
  *   **Rewilding:** Introducing predators to control herbivore overpopulation. (Increases predation suffering $\rightarrow$ Decreases starvation suffering).

  **Verdict:** *Genuine Requirement.* If the theory cannot distinguish an "empty forest" from a "full forest," it is measuring biomass, not welfare. If it cannot distinguish a frog pond from a zoo, it is ignoring population dynamics.

  #### 2. Conceptual Distinctions (The "No Collapsing" Rule)
  The theory must explicitly separate these variables. It cannot allow one to stand in for the other.
  *   **Total vs. Average Welfare:** Does a hectare with 1 million miserable insects outweigh a hectare with 10 happy jaguars? (Total Utilitarianism vs. Average Utilitarianism).
  *   **Existence vs. Quality:** Is a life worth living if it is net negative? (The "Non-Identity Problem" applied to wild animals).
  *   **Density vs. Well-being:** High population density often correlates with stress, disease, and starvation in ecology. The theory must not treat "more animals" as "more good" by default.

  **Verdict:** *Genuine Requirement.* Collapsing these is the primary source of rhetorical sleight-of-hand in conservation ethics. "Saving species" often means "maximizing population count," which may maximize total suffering if the lives are net-negative.

  #### 3. The Currency Problem (The Unit of Account)
  The theory must declare its unit of aggregation.
  *   **The Individual:** Sum of welfare per sentient being. (Standard welfare ethics).
  *   **The Hectare:** Welfare density per land unit. (Useful for land-use policy).
  *   **The Biomass:** Welfare per kilogram of living matter. (Biocentric, problematic for welfare).
  *   **The NPP (Net Primary Productivity):** Energy flow. (Ecological health, irrelevant to welfare).

  **Verdict:** *Genuine Requirement:* The unit must be **The Sentient Individual**.
  *   *Why:* "Welfare" implies a subject to experience it. Hectares, biomass, and NPP do not feel pain or pleasure. Using them smuggles in *ecocentrism* (the health of the system is good) under the guise of *welfare* (the feelings of the inhabitants are good).
  *   *Prejudice Alert:* "More Biomass is Better" is a prejudice. A forest has more biomass than a savannah; that does not mean it has more welfare.

  #### 4. The Counterfactual Problem (The Baseline)
  The theory must define the "Net" in Net Welfare.
  *   **Requirement:** It must specify the baseline comparison. Is it:
      *   *Status Quo Ante?* (What was there before humans touched it).
      *   *Alternative Use?* (What would humans do if not this? e.g., If we don't log this, do we log elsewhere?).
      *   *Successional Trajectory?* (What would the land become if left alone for 100 years?).
  *   **Verdict:** *Genuine Requirement, but with a limit.* You cannot demand a *perfect* counterfactual (it's unknowable), but you must demand a *specified* one. A theory that says "compared to nature" fails because "nature" is a moving target. A theory that says "compared to concrete" is biased. The baseline must be **the most likely alternative land-use scenario.**

  #### 5. Ecological Consistency (The "Invertebrate Constraint")
  The theory must align with biological reality regarding numbers and trophic structure.
  *   **The Invertebrate Weight:** Invertebrates outnumber vertebrates by orders of magnitude (biomass and count). If they have even 1% of the sentience capacity of a mammal, they dominate the welfare calculus.
  *   **Trophic Cascades:** You cannot calculate the welfare of the herbivore without calculating the welfare of the predator that eats it and the plants that starve it.
  *   **Density Dependence:** Populations naturally expand until they hit carrying capacity, resulting in starvation/disease. A "healthy" ecosystem is often a "high suffering" ecosystem due to Malthusian pressures.

  **Verdict:** *Genuine Requirement.* Ignoring invertebrates is speciesism. Ignoring carrying capacity is ecological illiteracy.
  *   *Prejudice Alert:* "Natural Balance is Harmonious." This is the Romantic Fallacy. Ecology is competitive and often cruel. A theory that assumes "wild = happy" fails this requirement.

  #### 6. Temporal Scope (The Time Horizon)
  *   **Requirement:** The theory must state its discount rate. Is suffering today worth less than suffering in 100 years?
  *   **Verdict:** *Genuine Requirement.* Ecosystems shift. A dam causes immediate massive death but might stabilize water for 50 years. A rewilding project causes immediate predation spikes but long-term stability. The theory must be time-indexed (e.g., "Net Welfare over 100 years").

  ---

  ### Part 2: Prejudice Check (What to Ignore)

  | Claim | Status | Why |
  | :--- | :--- | :--- |
  | **"The theory must justify conservation."** | **Prejudice** | This rigs the outcome. If destruction yields higher net welfare (e.g., fewer starving animals), the theory must say so. |
  | **"Natural states are the baseline."** | **Prejudice** | "Natural" is undefined. Is it pre-human? Pre-industrial? Nature includes wildfires, plagues, and starvation. |
  | **"Biodiversity = Welfare."** | **Prejudice** | More species often means more niche specialization and more competition. There is no linear link between species count and individual happiness. |
  | **"We must be able to measure it."** | **Hybrid** | Ideally genuine, but strict empiricism can paralyze theory. It should be "principally measurable," not "currently measured." |
  | **"Humans are separate from the system."** | **Prejudice** | Human welfare is part of the ecosystem welfare if humans are in the system. Excluding them is arbitrary unless the scope is explicitly "Non-Human Welfare." |

  ---

  ### Part 3: Incompatibilities (The Trade-Offs)

  Here are the pairs of requirements that likely cannot be simultaneously satisfied. This is where the theory will break.

  #### 1. The "Invertebrate Constraint" vs. "Empirical Tractability"
  *   **Conflict:** Ecological consistency demands we count invertebrates (nematodes, insects) because they are the vast majority of animals. Empirical tractability demands we have data on their sentience and welfare states.
  *   **Result:** We have almost zero data on invertebrate valence (pain/pleasure).
  *   **Incompatibility:** You either ignore the majority of animals (violating Ecological Consistency) or you base your theory on pure speculation (violating Empirical Tractability).

  #### 2. "Total Welfare" vs. "Density Dependence"
  *   **Conflict:** If you maximize Total Welfare (sum of all happy moments), you might be forced to support high-density populations. However, Ecological Consistency dictates that high density leads to resource depletion, disease, and starvation (suffering).
  *   **Result:** Maximizing the *number* of lives often minimizes the *quality* of lives in wild systems.
  *   **Incompatibility:** A theory cannot consistently maximize population size and average welfare simultaneously in a resource-constrained system.

  #### 3. "Timeless Verdict" vs. "Ecological Succession"
  *   **Conflict:** You want a verdict (Good/Bad). But ecosystems are processes, not states. A burned forest is "bad" at year 1, "good" for certain species at year 5, "climax" at year 100.
  *   **Result:** Any static verdict is wrong.
  *   **Incompatibility:** A theory that gives a binary "Destroy/Preserve" answer violates the requirement of Temporal Dynamics.

  ---

  ### Part 4: The Killer Requirement

  **Which single requirement knocks out the most popular answers?**

  **The Invertebrate Sentience Constraint.**

  *   **Why:** Most popular arguments (both Pro-Conservation and Pro-Development) implicitly focus on vertebrates (mammals, birds).
      *   *Conservationists* argue "Save the forest to save the tigers."
      *   *Developers* argue "Clear the forest to feed humans/cattle."
  *   **The Knockout:** If the theory *must* weigh invertebrates (due to Ecological Consistency) and acknowledges that wild invertebrate life is typically short, violent, and high-mortality (r-strategy):
      *   **Preservationism collapses:** A natural forest may be a "suffering factory" of insects eating each other and starving. Preserving it preserves the suffering.
      *   **Developmentalism collapses:** Converting to pasture involves pesticides and monoculture, which may cause acute, massive insect death (potentially worse than natural mortality).
  *   **Result:** Once you include the insects, the "Net Welfare" of almost any land-use change becomes incalculable with current science, rendering most policy arguments void.

  ### Summary Table: The Specification Conflicts

  | Requirement A | Requirement B | Conflict Description | Winner (for a working theory) |
  | :--- | :--- | :--- | :--- |
  | **Ecological Consistency** (Count all animals) | **Empirical Grounding** (Need data) | We have data for elephants, none for nematodes. | **Empirical Grounding** (Must admit ignorance or theory is fiction). |
  | **Total Welfare** (Sum of lives) | **Average Welfare** (Quality of life) | More lives usually means lower quality (Malthus). | **Average Welfare** (Prevents "Repugnant Conclusion" of mass misery). |
  | **Counterfactual Baseline** | **Action Guidance** | Perfect baselines are unknowable; we need to act now. | **Action Guidance** (Use "Best Available Alternative" baseline). |
  | **Individual Currency** | **Ecosystem Health** | Healthy systems often require individual suffering (predation). | **Individual Currency** (Health is not welfare). |

  ### Final Recommendation for Your Reading
  When you read the next argument, apply this filter:
  1.  **Check the Currency:** Are they talking about *biomass* (trees/carbon) or *feelings* (animals)? If biomass, they aren't talking about welfare.
  2.  **Check the Insects:** Do they mention invertebrates? If not, their numbers are wrong by a factor of 1,000,000.
  3.  **Check the Baseline:** Are they comparing the forest to "nothing" (magic) or to "cattle" (reality)?
  4.  **Check the r-Strategy:** Do they acknowledge that most wild animals die as larvae/eggs? If they assume wild animals live full lives, they are romanticizing.

  If a theory fails any of these, it is not a theory of Net Ecosystem Welfare; it is aesthetic preference dressed as math.
