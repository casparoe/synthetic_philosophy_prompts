      *   **Goal:** Define the *specification* (requirements) for such a theory to be considered adequate *before* evaluating specific arguments.
      *   **Key Components:**
          *   List requirements with cases/distinctions/currency/counterfactuals/ecological consistency/time.
          *   Distinguish genuine requirements from camp prejudices (e.g., "conservationists need work" vs. "more life is better").
          *   Identify trade-offs/incompatibilities between requirements.
          *   Identify the "killer requirement" that eliminates most popular answers.
          *   Format: List + Analysis + Table (optional but requested).
      *   **Tone:** Analytical, rigorous, skeptical of hidden assumptions, philosophical but grounded in ecology.

  2.  **Deconstruct the Requirements (Drafting the List):**

      *   *Requirement 1: Case Coverage.* The theory must handle specific, hard cases.
          *   *Cases:* Logged forest vs. cattle pasture, Dam, Rewilding, Rainforest vs. Oil Palm, r-strategists (high mortality), Empty Forest Syndrome.
          *   *Why:* If it can't distinguish these, it's useless.
      *   *Requirement 2: Conceptual Distinctions.* Must not conflate distinct metrics.
          *   *Distinctions:* Total vs. Average Welfare, Population Size vs. Quality of Life, Existence vs. Suffering.
          *   *Why:* Sliding between these causes most debates.
      *   *Requirement 3: The Currency.* What is being summed?
          *   *Options:* Individual, Hectare, Biomass, NPP.
          *   *Why:* Different currencies yield opposite verdicts. Needs justification.
      *   *Requirement 4: The Counterfactual.* What is the baseline?
          *   *Issue:* Status quo vs. Natural State vs. Alternative Use.
          *   *Why:* "Destroying" implies a comparison. Without a baseline, "net" is meaningless.
      *   *Requirement 5: Ecological Consistency.* Must align with biological reality.
          *   *Factors:* Trophic cascades, Density dependence, Invertebrate abundance (the "numbers problem").
          *   *Why:* A theory ignoring invertebrates is likely wrong if they feel pain. A theory ignoring trophic cascades misses indirect welfare effects.
      *   *Requirement 6: Temporal Scope.* Time horizon.
          *   *Issue:* Short-term pain for long-term gain? Perpetuity?
          *   *Why:* Ecosystems change. Welfare fluctuates.

  3.  **Filter: Genuine Requirement vs. Prejudice:**
      *   *Prejudice:* "Must justify conservation." (No, maybe destruction is better).
      *   *Prejudice:* "More biomass = better." (Biomass isn't welfare).
      *   *Prejudice:* "Natural = Good." (Nature is cruel).
      *   *Genuine:* "Must account for sentience." (Welfare implies someone to feel it).
      *   *Genuine:* "Must be empirically tractable." (If we can't measure it, it's metaphysics, not policy).

  4.  **Identify Incompatibilities (The "Trade-offs"):**
      *   *Trade-off 1:* Sentience Granularity vs. Empirical Tractability. (Counting nematode welfare vs. elephant welfare is impossible to measure accurately).
      *   *Trade-off 2:* Total Welfare vs. Average Welfare (The Repugnant Conclusion applied to ecology).
      *   *Trade-off 3:* Ecological Realism (Invertebrate dominance) vs. Moral Intuition (Vertebrate focus).
      *   *Trade-off 4:* Counterfactual Specificity vs. Action Guidance. (Perfect baselines are unknowable; rough baselines allow action).

  5.  **Identify the "Killer Requirement":**
      *   Which one kills the most theories?
      *   *Candidate:* The Invertebrate/Sentience Scope. Most conservation ethics focus on vertebrates. If the theory *must* include invertebrates (ecological consistency + welfare definition), most "save the forest" arguments collapse because forests might contain more suffering due to high mortality rates of insects.
      *   *Candidate:* Empirical Tractability. If you demand measurable data, most philosophical theories fail.
      *   *Decision:* The "Invertebrate Sentience + High Mortality" combination is the strongest filter. It challenges both "preservationists" (forests might be suffering factories) and "developmentalists" (pesticides might cause worse suffering). Let's frame it as **Ecological Consistency (Invertebrate Weighting) + Empirical Grounding.**

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the frustration. Most arguments are motivated reasoning.
      *   *Section 1: The Spec.* Go through the user's list items.
      *   *Section 2: Prejudice Check.* Explicitly call out "Nature is Good" and "Conservation is the Goal."
      *   *Section 3: Incompatibilities.* Highlight the Total vs. Average and Vertebrate vs. Invertebrate tensions.
      *   *Section 4: The Table.* Summarize the conflicts.
      *   *Section 5: The Killer.* Pinpoint the specific requirement.

  7.  **Refining the "Counterfactual" point:**
      *   Is it a real requirement? Yes. You can't say "X is bad" without saying "Compared to Y." But it can't be an excuse for paralysis. The spec must demand a *defined* baseline (e.g., "immediate alternative use" or "successional trajectory").

  8.  **Refining the "Currency" point:**
      *   Welfare must be individual-centric. Aggregating by hectare or biomass smuggles in biocentrism which isn't welfare. *Correction:* The prompt asks what the unit *is*. I need to argue that for *welfare*, the unit *must* be the sentient individual, even if ecology measures in biomass. This creates tension.

  9.  **Final Review against constraints:**
      *   Did I answer the specific cases? (Frog eggs, empty forest, etc.)
      *   Did I flag prejudices?
      *   Did I identify incompatible pairs?
      *   Did I identify the killer requirement?
      *   Is the tone appropriate? (Direct, analytical).

  10. **Final Polish:** Ensure the distinction between "Ecological Health" and "Net Welfare" is clear. This is the root of most confusion. (Self-Correction: Make sure to emphasize that ecosystem health $\neq$ animal welfare).

  *(Self-Correction during drafting)*: I need to be careful not to answer the question "Is destruction good?" but rather "What does a theory need to look like to answer that?" Keep it meta-ethical/methodological.

  *(Refining the "Killer Requirement")*: I think the strongest filter is **Empirical Tractability applied to Invertebrate Sentience.** If you admit invertebrates count (ecological consistency) and you admit we need data (tractability), almost all current theories fail because we have zero data on insect valence.

