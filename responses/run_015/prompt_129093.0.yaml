  **Monotonicity Principle**
  *Kalai-Smorodinsky Monotonicity:* If problem $F$ transforms to $G$ such that $a_A(G) \ge a_A(F)$, $a_B(G) \ge a_B(F)$, and $F \subset G$, then the solution for the party whose ideal improved (A) should not decrease. (Here, A increased, B's ideal stayed same). KS satisfies this (A went 2 $\to$ 2.4). Nash violates the *spirit* of this specific monotonicity (A stayed at 2), but Nash satisfies IIA.

  **Geometric Features**
  *   **Nash:** Pinned by the **local slope of the frontier** at the solution (tangency to $u_A u_B = k$). If the local frontier is unchanged, the solution is unchanged (IIA).
  *   **KS:** Pinned by the **ray to the Ideal Point**. If the Ideal Point moves, the ray rotates, moving the solution even if the local frontier is unchanged.

  **Objection & Reply**
  *   **Objection:** "The set $G$ as described is not strictly convex; the kink at $(2,1)$ required to keep NBS fixed while extending $u_A$ to 6 creates a non-convexity in the hull if connected directly to $(6,0)$."
  *   **Reply:** "The example isolates the axiomatic divergence. In a smooth approximation, the frontier would lift slightly, moving NBS marginally, but the KS shift (driven by the Ideal Point) would remain the dominant effect, preserving the qualitative lesson."

  **Conclusion**
  This case establishes that Nash's IIA protects the status quo agreement from "irrelevant" expansions of the feasible set, while KS's Monotonicity redistributes gains based on changes in bargaining power (ideal points), even if the immediate options haven't improved for the disadvantaged party. It does not establish which axiom is morally superior, only that they prioritize stability versus responsiveness differently.
