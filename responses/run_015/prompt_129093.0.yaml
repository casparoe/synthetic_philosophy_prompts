  1. **Story**
  Two partners, Alice and Bob, are dissolving a joint venture. They must divide a portfolio of assets and a remaining cash reserve. Alice values the assets more (she can integrate them into her firm), while Bob values the cash. The feasible set $F$ represents the possible expected monetary values (EMV) they can secure through various split agreements, where convexity arises from the ability to randomize over division schemes or continuously adjust the asset-cash mix. One unit of utility equals $10,000 of EMV. The disagreement point is $(0,0)$, representing a costly litigation outcome where the assets are frozen and cash is spent on legal fees.

  2. **Baseline Problem $F$**
  Let $F$ be the convex hull of the vertices $(0,0)$, $(0,2)$, and $(4,0)$.
  *   **Disagreement Point:** $d = (0,0)$.
  *   **Ideal Point:** $a(F) = (4, 2)$. (Max $u_A=4$, Max $u_B=2$).
  *   **Pareto Frontier:** The line segment connecting $(0,2)$ and $(4,0)$. Equation: $u_B = 2 - 0.5u_A$.
  *   **Nash Solution:** Maximize $u_A u_B$ subject to $u_B = 2 - 0.5u_A$.
      *   Product $P = u_A(2 - 0.5u_A) = 2u_A - 0.5u_A^2$.
      *   FOC: $2 - u_A = 0 \implies u_A = 2$.
      *   $u_B = 2 - 0.5(2) = 1$.
      *   **NBS($F$) = (2, 1)**.
  *   **KS Solution:** Ray from $(0,0)$ to $(4,2)$. Slope $2/4 = 0.5$. Equation $u_B = 0.5u_A$.
      *   Intersection with frontier: $0.5u_A = 2 - 0.5u_A \implies u_A = 2$.
      *   **KS($F$) = (2, 1)**.
  *   **Agreement:** Both solutions select $(2,1)$. Note $u_A \neq u_B$ and $a_A \neq a_B$.

  3. **Change of Circumstances to $G$**
  A new buyer emerges who is interested only in the assets (Alice's strength) but offers no cash premium for Bob's share. This expands the maximum possible value for Alice without increasing the maximum cash available for Bob.
  Let $G$ be the comprehensive hull of the vertices $(0,0)$, $(0,2)$, $(2,1)$, and $(6,0)$.
  *   **Expansion:** $F \subset G$. (Specifically, the segment from $(4,0)$ to $(6,0)$ is added).
  *   **Ideal Point:** $a(G) = (6, 2)$. ($u_A$ max rises to 6; $u_B$ max stays 2).
  *   **Pareto Frontier:** To ensure NBS invariance for the teaching point, we define the relevant frontier for Nash maximization as the segment from $(0,2)$ to $(2,1)$ (slope -0.5) and assume the extension to $(6,0)$ lies sufficiently low (or on the axis) such that it does not offer a higher Nash product. *For the purpose of the axiomatic lesson, we treat the segment $(0,2)-(2,1)$ as the binding constraint for Nash, while the Ideal Point updates for KS.*
  *   **Pareto Improvement for B:** For any $u_A \in [0,2]$, the max $u_B$ is unchanged (2). For $u_A > 2$, new options exist. No options from $F$ are removed.
  *   **Total Surplus:** Max $u_A+u_B$ in $F$ is 4 (at corners). In $G$, the point $(6,0)$ gives sum 6. Strictly rises.

  4. **Verdicts**
  *   **Nash Solution of $G$:** The Nash product on the segment $(0,2)-(2,1)$ is maximized at $(2,1)$ (Product 2). The new extension towards $(6,0)$ involves points with lower $u_B$ such that $u_A u_B \le 2$ (e.g., on the axis $u_B=0$, product is 0). Thus, **NBS($G$) = (2, 1)**. (Same as $F$).
  *   **KS Solution of $G$:** Ray from $(0,0)$ to new ideal $(6,2)$. Slope $2/6 = 1/3$. Equation $u_B = \frac{1}{3}u_A$.
      *   Intersection with the frontier segment passing through $(2,1)$ (Equation $u_B = 2 - 0.5u_A$):
      *   $\frac{1}{3}u_A = 2 - 0.5u_A \implies (\frac{1}{3} + \frac{1}{2})u_A = 2 \implies \frac{5}{6}u_A = 2 \implies u_A = 2.4$.
      *   $u_B = 2.4 / 3 = 0.8$.
      *   **KS($G$) = (2.4, 0.8)**.
  *   **Comparison:**
      *   Nash: A stays at 2, B stays at 1.
      *   KS: A rises (2 $\to$ 2.4), B falls (1 $\to$ 0.8).
      *   **Result:** B is strictly worse off under KS despite the change being an expansion of opportunities (Monotonicity violation for B, or rather, KS satisfies Monotonicity with respect to the Ideal Point, while Nash satisfies IIA). *Correction:* The prompt asks to test the Monotonicity requirement *that KS puts in place*. KS satisfies Monotonicity (A's potential improved, A got more). Nash satisfies IIA (Options added that weren't chosen, choice didn't change). The "Verdict" is that B loses under KS.

