prompt: |-
  I build and maintain backend services for online games, and I've never studied philosophy, so I don't have vocabulary for this beyond what the systems force on me. I keep going back and forth on what, if anything, is real about the things we store, and on when something that happens to a player counts as something being done to them. Here are my gut verdicts on cases I've actually dealt with.

  A duping bug gives another player a second copy of a mount that was supposed to be unique; I keep mine. I don't think I've been harmed, and I don't think my mount stopped being the one I earned — though I also can't say which of the two copies is mine in any deep sense, and I'd be annoyed if the company deleted mine and left the duplicate.

  Someone social-engineers their way into my account and transfers away items I spent about two hundred hours earning, in a way that can't be reversed. That's a real harm, and I think the company owes me something.

  Same theft, except the studio rolls the database back to the previous nightly snapshot and the items reappear. Here I want to say the harm has been undone: nothing to compensate, nothing to make up for. This is the verdict I'm least sure of, because if someone took my laptop and the police returned it intact a day later, I'd still say I'd been wronged — the scare and the lost day don't vanish.

  A stranger uses only mechanics the game allows to wall my avatar into a sealed box and leaves me there for six hours. Nothing of mine is deleted or altered. I still count it as a genuine harm.

  Another player kills my character in a zone where the rules explicitly permit it and where I clicked through a warning saying so. That's a real loss to me, a painful one, but I don't think I've been wronged.

  My single-player save file on my own disk, which no one else can read or write: losing it would upset me badly, but I resist saying the character in it is real in the way an object in a shared world is.

  A stretch of procedurally generated terrain that the generator function would produce but that no client has ever rendered: I want to say it doesn't exist, and I also want to say that if a player walked there they would discover it rather than create it.

  My tentative principle is in two independent parts. An object is real just in case its state lives in an authoritative shared store that more than one agent can read and write. A harm is real just in case it sets back someone's interests, full stop — and the two questions have nothing to do with each other. I can't make that principle do the work, though. It needs something extra about consenting to a rule system to say yes to the boxing case and no to the PvP kill, and if it takes the setback-of-interests clause seriously it should say the rollback case is still a harm, which is the one verdict I'd most like to keep.

  What principle, or small set of principles, captures this pattern? I'd like it stated precisely enough that I could apply it to a new ticket without guessing, with the case that motivates each clause. I also want to know honestly which of my verdicts it forces me to drop, including whether the rollback one is just a feeling I should abandon. And please say what it predicts about two cases I haven't listed: the same theft carried out in a game whose currency is officially exchangeable for real money, and a studio shutting a world down permanently at end of life and deleting the database.
reasoning: |-
  Here's a thinking process that leads to the suggested philosophical framework:

  1.  **Analyze the User and the Problem:**
      *   **User:** Backend engineer for online games. Pragmatic, systems-oriented, no formal philosophy training.
      *   **Problem:** Struggling to define "reality" of digital objects and "harm" to players in various edge cases (duping, theft, rollback, griefing, PvP, single-player, unrendered terrain).
      *   **Current Tentative Principle:**
          1.  *Reality:* State in authoritative shared store (multi-agent R/W).
          2.  *Harm:* Setback of interests (consequentialist).
          3.  *Issue:* These two don't interact well. Needs a consent/normative layer to distinguish boxing vs. PvP. Needs to address the "rollback" intuition (is it harm if undone?).
      *   **Goal:** A precise principle (or small set) that captures their intuitions, identifies which intuitions must be dropped, and predicts outcomes for two new cases (RMT theft, server shutdown).

  2.  **Deconstruct the Cases & Intuitions:**

      *   *Case 1 (Duping):* Unique mount duplicated elsewhere. User keeps theirs. *Verdict:* No harm to user, object remains "theirs," but ontological status of "uniqueness" is shaky.
      *   *Case 2 (Theft, No Rollback):* Account hack, items gone permanently. *Verdict:* Real harm, compensation owed.
      *   *Case 3 (Theft, Rollback):* Account hack, items restored via DB snapshot. *Verdict:* User *wants* to say "harm undone/no compensation," but is unsure because of the "scare/lost day" factor (analogy to stolen laptop).
      *   *Case 4 (Griefing/Boxing):* Trapped using allowed mechanics. *Verdict:* Genuine harm.
      *   *Case 5 (PvP Kill):* Killed in allowed zone with warning. *Verdict:* Real loss, but *not* a wrong (no harm in the normative sense).
      *   *Case 6 (Single Player Save):* Local file. *Verdict:* Upsetting to lose, but character less "real" than shared world objects.
      *   *Case 7 (Unrendered Terrain):* Procedural, potential but not actualized. *Verdict:* Doesn't exist, but discovery feels like finding, not creating.

  3.  **Evaluate the User's Tentative Principle:**
      *   *Reality (Shared Store):* Works well for distinguishing Single Player (Case 6) vs. MMO. Struggles slightly with Unrendered Terrain (Case 7) – is the *potential* in the store? Usually, the seed is in the store, the terrain is computed.
      *   *Harm (Setback of Interests):* Too broad. It classifies PvP (Case 5) as harm (it sets back the interest of staying alive/loot retention). It also classifies Rollback (Case 3) as harm (time lost, stress).
      *   *Missing Link:* Normative Expectations / Social Contract. The distinction between Boxing (Case 4) and PvP (Case 5) isn't about mechanics (both allowed); it's about the *purpose* of the mechanics relative to the player's agency.

  4.  **Develop a Philosophical Framework:**
      *   *Ontology (What is real?):* Needs to be about *intersubjective stability*. It's not just "in the DB," it's "in the DB *and* recognized by the community as persistent." This handles the Duping case (uniqueness is a social fact, not just a DB flag).
      *   *Ethics (What is harm/wrong?):* Needs to distinguish between *constitutive losses* (part of the game) and *structural violations* (breaking the frame).
      *   *Key Concept:* **The Magic Circle + The Service Contract.**
      *   *Refinement:* Let's look at **Scanlonian Contractualism** or **Rawlsian Fairness** adapted for systems. Or simpler: **Legitimate Expectation.**
      *   *Better Fit:* **The Principle of Normative Invariance.**
          *   Reality = Persistent Intersubjective Reference.
          *   Harm = Violation of Legitimate Expectation formed by the Rules + Marketing + Community Norms.

      *   *Let's try to formalize the user's specific tension:* The user wants to say Rollback = No Harm (mostly), but PvP = Loss but No Wrong, and Boxing = Wrong.
      *   *Distinction:* **Gameplay Risk vs. Systemic Breach.**
      *   *PvP:* Risk inherent to the activity.
      *   *Boxing:* Exploiting mechanics to negate agency (afk trapping is usually against ToS even if mechanics allow movement restriction). *Correction:* User said "uses only mechanics the game allows." If it's truly allowed, why is it harm? Because it violates the *spirit* of play (agency).
      *   *Rollback:* Restores the *state*, but does it restore the *experience*? User wants to say "No compensation." This implies the *economic* state is what matters for compensation, even if the *experiential* harm occurred.

      *   *Proposed Framework:* **The Dual-Layer Covenant.**
          1.  **Ontological Layer (Existence):** An entity exists if it is a *stable node in the shared causal network*. (Handles DB vs. Local vs. Unrendered).
          2.  **Normative Layer (Harm/Wrong):** A wrong occurs if there is a *violation of the Ludic Contract*. A loss occurs if there is a *setback within the Ludic Contract*.

      *   *Wait, the Rollback Case is the pivot.* The user says: "Here I want to say the harm has been undone... This is the verdict I'm least sure of."
      *   *Honest Advice:* I need to tell them that philosophically, the Rollback *is* a harm (time, stress), but pragmatically (for a support ticket), it is treated as *remediated*. The principle should distinguish between *Compensable Harm* and *Experiential Harm*.

  5.  **Drafting the Principles:**

      *   *Principle 1: Ontological Status (The "Realness" Test).*
          *   Criterion: **Inter-Subjective Persistence.**
          *   Definition: An object is "real" if its state is determined by an authoritative source *and* acts as a causal constraint on multiple independent agents.
          *   *Case 6 (Single Player):* Fails (only one agent).
          *   *Case 7 (Unrendered):* Fails (not currently a causal constraint), but the *seed* is real.
          *   *Case 1 (Duping):* Both are "real" objects, but the *property* of uniqueness is broken.

      *   *Principle 2: Normative Status (The "Wrong" Test).*
          *   Criterion: **Violation of Legitimate Ludic Expectation.**
          *   Definition: A player is "wronged" (owed compensation) only when an outcome violates the reasonable expectations established by the explicit rules *and* the implied purpose of the system, excluding inherent risks consented to.
          *   *Case 5 (PvP):* Loss (setback), but not Wrong (expectation of death exists).
          *   *Case 4 (Boxing):* Wrong. Even if mechanics allow, the *purpose* of the game is agency. Trapping removes agency. (This requires interpreting "mechanics allowed" carefully—usually AFK trapping is bannable).
          *   *Case 2 vs 3 (Theft):* Both are Wrongs. Case 3 is *remediated*.

      *   *Refining the Rollback Verdict:* The user wants to say Case 3 is "nothing to compensate."
      *   *Philosophical Truth:* You *were* harmed (stress/time).
      *   *Systemic Truth:* The *debt* is cleared.
      *   *Advice:* You must drop the intuition that "no harm occurred." You must adopt: "Harm occurred, but restitution was perfect."

  6.  **Addressing the New Cases:**
      *   *RMT Theft:* If currency is exchangeable, the "Ludic Contract" merges with the "Real World Contract." The harm is no longer just ludic; it's financial. Compensation is mandatory, not discretionary.
      *   *Server Shutdown:* The "Inter-Subjective Persistence" is terminated by the provider. Is it a wrong? No, if the EULA specified temporality. The objects cease to be "real" because the causal network is dissolved.

  7.  **Structuring the Response:**
      *   **Acknowledge the expertise:** Validate that this is a known philosophical problem (Virtual Ethics, Ontology of Digital Objects).
      *   **The Framework:** Propose "The Ludic Contract & Causal Persistence."
      *   **Clause 1: Ontology (Causal Persistence).** Define reality based on shared constraint.
      *   **Clause 2: Ethics (Legitimate Expectation).** Define harm/wrong based on consented risk vs. systemic breach.
      *   **Clause 3: Restitution (State vs. Experience).** Address the Rollback paradox.
      *   **Application:** Walk through the user's cases.
      *   **Hard Truths:** Tell them which intuition to drop (Rollback = Harm, just fixed).
      *   **Predictions:** RMT and Shutdown.

  8.  **Refining the "Boxing" Case:**
      *   User says: "uses only mechanics the game allows."
      *   If the game *truly* allows it (e.g., a puzzle game where trapping is the goal), it's not harm.
      *   If it's an MMO and they used physics to trap, usually ToS prohibits "interference with gameplay."
      *   *Philosophical nuance:* Consent to *rules* is not consent to *ruin*. The "Spirit of the Game" clause.
      *   *Decision:* I will classify this as a violation of *Agency*, which is a higher-order rule than movement mechanics.

  9.  **Refining the "Rollback" Case:**
      *   User wants to say: "Harm undone."
      *   My advice: "Harm persisted, Debt cleared."
      *   Why? Because if it happens 10 times, even with rollbacks, the player quits. The stress accumulates.
      *   *Verdict:* You must accept it was a harm, but the *obligation* is discharged by restoration.

  10. **Final Polish:** Ensure tone is respectful, precise, and engineering-friendly (using terms like "state," "authority," "constraints"). Avoid overly dense jargon.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "consult ToS." The user is asking for a *philosophical principle* to guide the ToS or interpret edge cases where ToS is silent. The principle must be normative, not just legalistic.

      *Key Distinction:* **Constitutive Rules** (PvP kills are part of the game) vs. **Regulative Rules** (Don't hack).
      *   PvP: Constitutive. Loss is intended.
      *   Theft: Regulative violation.
      *   Boxing: Exploiting Constitutive to violate Regulative (Agency).

      *Let's build the "Principle of Ludic Integrity."*

      *   **Ontology:** Shared Causal Authority.
      *   **Harm:** Setback of Interest.
      *   **Wrong:** Violation of Ludic Integrity (Consent + Purpose).
      *   **Remediation:** State Restoration vs. Experience Restoration.

      *Wait, one more check on the Duping Case.*
      *   User: "I don't think I've been harmed... can't say which copy is mine."
      *   Principle: Uniqueness is a *relational property*, not an intrinsic one. If the relation is broken, the value is diluted, but the object persists.
      *   Verdict: No direct harm to *holder*, but systemic harm to *economy*.

      *Okay, ready to write.*
answer: |-
  You are grappling with two distinct branches of philosophy without realizing it: **Ontology** (what exists) and **Normative Ethics** (what counts as a wrong). Your intuition that these two questions are independent is correct, but your current definitions are slightly too blunt to handle the edge cases.

  Based on your cases, here is a precise framework called **The Principle of Ludic Integrity**. It consists of three clauses. This framework is designed to be operational for a backend engineer or support lead.

  ### The Principle of Ludic Integrity

  #### Clause 1: Ontological Status (The "Realness" Test)
  **An entity is "real" within the game world if and only if it serves as a stable causal constraint on multiple independent agents.**

  *   **Definition:** "Stable causal constraint" means the entity's state dictates what actions are possible for users, and that state is persisted by an authority outside any single user's control.
  *   **Motivation:** This distinguishes your Single-Player Save (Case 6) from the MMO Mount (Case 1). In single-player, the "authority" is you; the constraint is local. In an MMO, the database is the authority; the constraint is shared.
  *   **Application to Unrendered Terrain (Case 7):** The terrain does not *exist* yet because it is not currently constraining any agent. However, the *seed* exists. If a player walks there, they are interacting with the authoritative seed, not creating new data ex nihilo. Thus, they are *discovering* a potential constraint, not creating one.

  #### Clause 2: Normative Status (The "Wrong" Test)
  **A player is "wronged" (owed restitution) if and only if their interests are set back by a violation of the Ludic Contract, excluding risks inherent to the Constitutive Rules.**

  *   **Definition:**
      *   **Ludic Contract:** The reasonable expectation of agency and fairness formed by the ToS, marketing, and community norms.
      *   **Constitutive Rules:** Mechanics that define the game itself (e.g., "characters can die," "items can be traded").
      *   **Inherent Risks:** Losses that occur when Constitutive Rules function as intended.
  *   **Motivation:** This distinguishes the PvP Kill (Case 5) from the Account Theft (Case 2). In PvP, death is a Constitutive Rule; the loss is inherent to the activity you consented to. In Theft, the security of the account is a precondition of the Ludic Contract, not a risk of gameplay.
  *   **Application to Boxing (Case 4):** Even if the *physics* allow trapping, the Ludic Contract implies a baseline of **Agency**. Using mechanics to permanently remove another's agency (AFK trapping) violates the Contract's purpose, even if it doesn't violate the code. It is a Wrong.

  #### Clause 3: Remediation (The "Rollback" Test)
  **Restitution is complete when the authoritative state is restored to the pre-violation snapshot, but the "Wrong" remains a historical fact.**

  *   **Definition:** State restoration clears the *debt*, but does not erase the *event*.
  *   **Motivation:** This addresses your uncertainty in Case 3.
  *   **Application:** If you restore the items, you have fulfilled your obligation. You do not owe *additional* compensation for the item loss. However, you must acknowledge the player *was* wronged temporarily. If this happens repeatedly, the accumulation of "historical facts" becomes a new Wrong (breach of trust/service reliability).

  ---

  ### Applying the Principles to Your Cases

  Here is how the principle forces verdicts on your existing list. I have highlighted where you must adjust your intuition.

  1.  **Duping Bug (Unique Mount):**
      *   **Verdict:** The mount is **Real** (Clause 1: shared constraint). You are **Not Wronged** (Clause 2: no setback to your specific state).
      *   **Nuance:** The *property* of uniqueness is a systemic reality that was broken, but your specific instance remains valid. The harm is to the *economy*, not to you personally.
      *   **Action:** Do not delete your mount. Fix the systemic uniqueness constraint going forward.

  2.  **Theft (No Rollback):**
      *   **Verdict:** **Real Wrong.**
      *   **Reasoning:** Violation of Ludic Contract (security). Setback of interest is permanent.
      *   **Action:** Full compensation owed.

  3.  **Theft (With Rollback):**
      *   **Verdict:** **Real Wrong, Remediated.**
      *   **Honest Truth:** **You must drop the intuition that "no harm occurred."** Clause 3 dictates that harm *did* occur (stress, time lost, violation of trust), but the *debt* is cleared by the rollback.
      *   **Why:** If you tell the player "nothing happened," you gaslight them. If you tell them "You were wronged, but we fixed it," you validate their experience while closing the ticket.
      *   **Action:** Restore state. No extra compensation needed *unless* the rollback itself caused data loss (e.g., progress made during the theft window).

  4.  **Griefing (Boxing):**
      *   **Verdict:** **Real Wrong.**
      *   **Reasoning:** Clause 2. While mechanics allowed it, it violates the implied covenant of Agency. It is not a Constitutive Rule of the game that players can be removed from play against their will.
      *   **Action:** Unblock player. Sanction the trapper (this is usually "harassment" in ToS).

  5.  **PvP Kill:**
      *   **Verdict:** **Real Loss, Not a Wrong.**
      *   **Reasoning:** Clause 2. Death is a Constitutive Rule. You consented to the risk by entering the zone.
      *   **Action:** No compensation. This is gameplay.

  6.  **Single-Player Save:**
      *   **Verdict:** **Less Real.**
      *   **Reasoning:** Clause 1. Fails the "multiple independent agents" test. It is a local record, not a shared constraint.
      *   **Action:** Loss is tragic for the user, but ontologically distinct from MMO theft.

  7.  **Unrendered Terrain:**
      *   **Verdict:** **Potential Reality.**
      *   **Reasoning:** Clause 1. The *seed* is the real object in the store. The terrain is a computed view of that object.
      *   **Action:** If a bug deletes the seed, reality is destroyed. If a bug just glitches the render, reality is intact.

  ---

  ### Predictions for New Cases

  Here is what this principle predicts for the two cases you haven't listed.

  #### Case A: Theft in a Game with Official Real-Money Trading (RMT)
  *   **Scenario:** Same as Case 2 (theft), but the currency stolen can be withdrawn as fiat currency.
  *   **Prediction:** **This is no longer just a Ludic Wrong; it is a Financial Tort.**
  *   **Reasoning:** Clause 1 (Ontology) shifts. Because the currency bridges the "Shared Store" to the "Real World Banking System," the causal constraints extend outside the game. The "Interests" in Clause 2 are no longer just ludic (fun/status); they are economic.
  *   **Outcome:** The studio owes not just restoration of in-game value, but potentially legal liability for the real-world value. The "Ludic Contract" merges with a "Financial Service Contract." You cannot treat this as a simple rollback; you must treat it as a bank fraud incident.

  #### Case B: Server Shutdown (End of Life)
  *   **Scenario:** The studio turns off the servers and deletes the database permanently.
  *   **Prediction:** **The Objects Cease to Be Real; The Players Are Not Wronged (Provided Notice).**
  *   **Reasoning:**
      *   **Ontology:** Per Clause 1, if the authoritative store is deleted, the causal constraints vanish. The objects literally cease to exist. They do not "live on" in memory; they are gone.
      *   **Ethics:** Per Clause 2, the Ludic Contract includes the temporality of the service (usually in the EULA). If players were given reasonable notice, their "Legitimate Expectation" was for a service with an end date.
      *   **Outcome:** No compensation is owed for the loss of the items themselves. However, if the studio marketed the items as "permanent investments" or "heirlooms" (violating the expectation of temporality), they may have created a Wrong via false advertising.
      *   **Mitigation:** To preserve "Ludic Integrity," studios often offer a "memorial" (static snapshot) or transfer to a private server. This acknowledges the Ontological death while respecting the Normative bond.

  ### Summary of Required Intuition Shifts

  1.  **On Rollbacks:** You must accept that **a rollback is a successful apology, not a proof of innocence.** The harm happened. The fix worked. Do not tell the player "nothing happened." Tell them "This was wrong, and we corrected it."
  2.  **On Mechanics vs. Spirit:** Your principle needs to explicitly value **Agency** over **Mechanics**. If a mechanic removes agency (Boxing), it is a bug in the social system, even if it is a feature in the code.
  3.  **On Reality:** Reality is not about "bits on a disk"; it is about **"constraints on behavior."** If the bits don't constrain behavior (unrendered terrain), they aren't fully real. If the bits constrain behavior across the real-world boundary (RMT), they are hyper-real.

  This framework allows you to triage tickets without guessing.
  *   **Did the state change without consent?** (Check Clause 1 & 2)
  *   **Was the change part of the agreed game?** (Check Clause 2: Constitutive vs. Regulative)
  *   **Is the state back to baseline?** (Check Clause 3)

  If Yes, Yes, Yes -> Close Ticket.
  If Yes, No, Any -> Escalate/Compensate.
