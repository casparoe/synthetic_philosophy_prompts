  **1. (iii) Non-Cognitive Emotional Stance:** This claims belief is purely attitudinal, denying factual content. **Verdict:** False. Wittgenstein did not deny believers make truth-claims; he noted their *grammar* differs from science. **Impact:** This dismisses historical questions by denying the belief is about history. Since Christians assert the tomb was empty, this misapplication falsely shields the claim from evidence by redefining it as mere poetry. It protects the claim from scrutiny only by stripping it of the historical weight the believer intends, effectively changing the subject rather than answering the critique.

  **2. (ii) Framework Setting Internal Standards:** This claims belief establishes criteria for rationality within that community. **Verdict:** Substantive and defensible. Religious language operates as a "hinge" proposition, not a testable hypothesis. **Impact:** This doesn't block historical inquiry but limits its *decisiveness*. Evidence doesn't overturn the framework; the framework interprets the evidence. It stops historical data from *refuting* faith logically, but doesn't prove the event occurred independently of faith. Your friend might use this to say historical proof is a category error. While this prevents empirical disproof, it doesn't validate the historical claim itself. It protects the *belief system*, not the *historical fact*, leaving the actual event still open to historiographical debate.

  **3. (i) Unreasoned Social Habit:** This claims belief is just custom, immune to justification. **Verdict:** Trivial description, dangerous prescription. Practices are reasoned within their context. **Impact:** This is the fideistic shield your friend uses. It implies historical claims are immune to scrutiny because they are "just our way." If the resurrection is touted as objective history, this reading fails to protect it from scrutiny without abandoning truth claims entirely. It shuts down dialogue by declaring the game over before playing, confusing sociological description with epistemological immunity. It effectively says "you can't check our homework," which works for social cohesion but fails in interfaith truth-seeking.
