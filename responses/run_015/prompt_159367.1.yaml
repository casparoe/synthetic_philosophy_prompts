  2. This restriction maps closely to your no-selection-on-the-outcome rule, though the doctrine implies a stricter ban on conditioning on any information that reveals the outcome beyond what the latent rate itself provides.

  3. The principle survives by conditioning on the hypothesis that the latent rate is fixed, but stating this in your terms requires fudging the fact that your retrospective estimate of that rate is logically entangled with the very outcomes you are trying to predict.

  4. Deference to chance condemns that practice if the padding represents mere model error, unless your distinction between irreducible and reducible uncertainty maps cleanly onto the philosophical divide between ontological chance and epistemic ignorance.

  5. The residue points to something missing from your vocabulary, specifically a notion of what is being deferred to and of deference as a constraint on belief rather than output, because your latent rates are model parameters while their objective chance is a metaphysical posit.
