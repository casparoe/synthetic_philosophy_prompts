      *   *Proposed Game Structure:*
          1.  **Phase 1: The Split (Physical Simulation).** Use a deck of cards to represent the "Universal Wavefunction."
          2.  **Phase 2: The Bet.** Students act as the "Pre-Branch Self." They allocate chocolate stakes.
