          *   Make it steeper. "Give 20 chocolate to Minority."
          *   Branch Count: 0.5 * 20 - 1 = 9.
          *   Amplitude: 0.1 * 20 - 1 = 1.
          *   Okay, let's make it a loss for Branch Counting. "Give 8 chocolate to Minority."
          *   Branch Count: 0.5 * 8 - 1 = 3. (Take it).
