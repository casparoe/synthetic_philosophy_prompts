  4.  **Drafting the Plan (Iterative refinement):**

      *   *Materials:* 2 Decks of cards (distinct backs), Index cards, Markers, Chocolate.
      *   *Roles:* Instructor = "The Hamiltonian" (controls the split). Students = "Observers."
      *   *Round 1 (Equal Amps):* 2 Cards (Red/Black). 14 Students. Split 7/7.
