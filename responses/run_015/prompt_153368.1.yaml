      *   *Let's try the "Ellsberg-style" Diachronic Pump.*
      *   **Context:** Investment Portfolio Management.
      *   **Assets:**
          *   Fund U (Unknown): Returns depend on an ambiguous political outcome (Policy Pass/Fail).
