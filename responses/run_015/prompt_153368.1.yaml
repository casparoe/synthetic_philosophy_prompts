      *   **Update Rule:** The PM treats this ambiguity as a "red flag" that licenses revising the subjective probability of failure upward (violating the initial objective chance deference).
      *   **Action:** PM pays a penalty to switch to Vendor B.
      *   **Stage 3 (Reversal):** A second audit clarifies the risk is exactly as originally modeled. The PM now prefers Vendor A again (as the ambiguity is resolved).
      *   **Action:** PM pays a penalty to switch back to Vendor A.
