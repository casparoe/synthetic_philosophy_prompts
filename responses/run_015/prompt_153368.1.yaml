prompt: |-
  After a long, somewhat heated argument with a friend about whether rationality is fundamentally about never being exploitable over time or about holding coherent preferences at any single moment, I want a carefully engineered scenario that isolates exactly where diachronic and synchronic standards come apart. Design a three-stage decision problem set in an ordinary professional context—such as a project manager allocating resources across quarterly reviews, or a clinician adjusting a long-term treatment plan—where an agent satisfies every standard synchronic consistency condition (complete and transitive preferences, no dominance violations, coherent credences about outcomes at each stage) and yet can be turned into a money pump across the stages. The vulnerability must arise solely from her diachronic update rule: specifically, she treats genuinely ambiguous intermediate evidence as licensing a revision not merely of her beliefs about future states, but of her evaluation of prior commitments, in a way that breaks deference to the objective chance structure she initially accepted. The specifications are these: first, no exotic physics, perfect predictors, demons, or unrealistic bookies—only ordinary institutional or clinical contingencies; second, at each isolated stage her choice must be defensible by conventional decision theory, so the pump is genuinely diachronic rather than synchronic; third, identify the precise structural feature—perhaps an interaction between ambiguous evidence and a refusal to preserve prior conditional probabilities—that makes the extraction possible; fourth, lay out the exact sequence of offers and responses that drains value, explain why an agent who uses a strict conditionalization rule tied to the initial chance setup avoids the drain, and include an honest note on how a defender of the non-conditionalizing rule would resist the charge of irrationality, ideally by appealing to some other normative property that the rule protects. Please present the response in American English, keep the tone formal and polished, and do not include bibliographies, reading lists, or citations.
