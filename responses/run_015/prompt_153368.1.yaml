      *   **Objective Chance:** Coin is 50/50. Policy is initially assessed as 50/50 by the market (objective chance).
      *   **Stage 1:** Agent prefers Fund U over Fund K (due to higher potential upside, assuming 50/50).
      *   **Stage 2:** Intermediate news arrives. The news is "noisy" regarding the Policy. It doesn't change the objective probability, but it increases *ambiguity* (confidence interval widens).
