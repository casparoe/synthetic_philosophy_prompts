              3.  $t_3$: (Counterfactual or Pre-commitment stage) If the agent knew at $t_1$ they would switch at $t_2$, they would have paid to *bind* themselves to T.
              4.  *Actually, let's look for a "Double Switch".*
              5.  Scenario: The agent is offered a contract at $t_1$. They accept. At $t_2$, they are offered a modification. They accept (paying fee). At $t_3$, the outcome is worse than if they had stuck to $t_1$.
              6.  *Strict Pump:* To be a true money pump, the agent must end up with the original asset but less money.
