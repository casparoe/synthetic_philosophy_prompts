      *   **Address Step (2):** Clarify "Differential" vs. "Absolute" cost. Reliability comes from the *gap* in costs, not the total amount.
      *   **Address the "Vacuity" (Step 6):** Explain how the theory is falsifiable. It makes specific predictions about the *relationship* between quality and signal intensity, and the *marginal costs*.
      *   **Address the Flatmate's Cases:** Explain that "waste" isn't the necessary condition; "fitness cost" is. A stone used for a nest isn't "waste" for the group, but it is a cost for the male (energy/risk). Punishment is a cost.
      *   **Address Index Signals:** Distinguish Handicaps from Indices. The theory doesn't claim to explain indices.
