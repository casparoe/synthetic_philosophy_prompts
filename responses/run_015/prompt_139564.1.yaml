          2.  *Premise 2 (Cost-Reliability Link):* Higher cost = harder to fake = more reliable.
          3.  *Premise 3 (The Ratchet):* Both parties benefit from reliability, so costs should escalate until crippling.
          4.  *Observation:* Signals are moderate, not crippling. Some are cost-free (index signals).
          5.  *Counter-examples from Flatmate:* (a) Transfer costs (stone carrying), (b) Social punishment (counterfactual cost).
          6.  *Dilemma:* Either the theory predicts runaway waste (false) OR "cost" is defined so broadly it explains everything (vacuous).
          7.  *Conclusion:* Don't believe the theory.
