  7.  **Final Polish:** Organize by the user's numbered points for clarity. Ensure the distinction between "waste" (Zahavi's rhetorical flair) and "cost" (Grafen's mathematical formalization) is clear. (Zahavi liked "waste," but the math requires "differential fitness cost".)

  *(Self-Correction during drafting)*: I should make sure to mention that Zahavi's original formulation *was* vague, and the flatmate might be defending the modern formalized version (Grafen), while the user is attacking the pop-sci version. This explains the friction.

