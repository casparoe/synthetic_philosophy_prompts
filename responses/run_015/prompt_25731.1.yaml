answer: |-
  This is an excellent set of draft questions. You clearly grasp the dialectical landscape. However, for a colloquium Q&A, 45 minutes usually allows for about 5–6 substantive exchanges before time runs out. Your list of 7 substantive questions plus the closer might be ambitious, but since you are moderating, you can select the best ones based on what she emphasizes in the talk.

  I have refined your list to 8 items (7 substantive + 1 closer). I merged your **Indeterminacy** and **Misrepresentation** questions slightly to avoid redundancy (they are two sides of the same "normativity" coin), and I added a question on **Phenomenology**, which is almost guaranteed to come up in a Philosophy of Mind department and is a known pressure point for teleosemantics.

  I have also sharpened the **Anticipated Replies** to reflect standard Millikan-style moves (e.g., appealing to "Normal Conditions" and "Consumer Proper Functions") and crafted **Follow-ups** that prevent her from retreating into theory-stipulation.

  ### 1. The Determinacy/Consumer Problem (Refined Q1)
  **Question:** "A standard worry for teleosemantics is indeterminacy. A frog's detector fires at flies, but also BBs. The standard teleosemantic move is to appeal to the *consumer*: the content is fixed by how downstream systems use the signal. But doesn't this just relocate the indeterminacy? What fixes the content of the *consumer's* interpretation? If the consumer's function is also determined by selection, aren't we facing a regress or a circle where nothing ultimately anchors the content?"

  *   **Anticipated Reply:** She will likely argue that the regress stops because the consumer's proper function is defined by a *co-evolved* relationship with the producer. The content is fixed by the "mapping rule" that allowed the producer-consumer pair to survive together historically. It's a relational fact, not a regress.
  *   **Follow-up:** "But if it's a relational fact about co-evolution, does that mean content is holistically distributed across the whole organism? If so, how do we individuate specific mental states for the purposes of psychological explanation? It seems we lose the ability to say *this* specific state represents *that* specific thing."

  ### 2. Normativity and "Normal Conditions" (Refined Q2)
  **Question:** "Teleosemantics relies heavily on the notion of 'Proper Function' performed in 'Normal Conditions' to ground misrepresentation. But how do you define 'Normal Conditions' without circularity? If you define them statistically, then if most frogs fail to catch flies, the function changes. If you define them normatively (i.e., the conditions under which it *should* work), aren't you presupposing the very normativity you're trying to naturalize?"

  *   **Anticipated Reply:** She will distinguish "Normal" from "Statistical." Normal conditions are those under which the mechanism *historically* performed its function and contributed to fitness, regardless of current statistics. It's a historical/etiological fact, not a statistical one.
  *   **Follow-up:** "Understood. But in cases of rapid environmental change (e.g., modern humans with sugar cravings), the historical normal conditions no longer obtain. Does the mental state still represent what it did in the EEA (Environment of Evolutionary Adaptedness)? If so, it seems our current content is systematically out of sync with our current causal interactions, which makes the content explanatorily inert for current behavior."

  ### 3. Swampman and Explanatory Power (Refined Q3)
  **Question:** "On the Swampman case: if you bite the bullet and say Swampman has no contentful states, you preserve the theory's consistency. But does this come at the cost of explanatory power? If Swampman and I are physically identical and behave identically, but only I have 'thoughts,' does content do any causal or explanatory work? Or does this imply that cognitive science could explain all of Swampman's behavior without ever invoking content?"

  *   **Anticipated Reply:** She will likely accept this. She might argue that teleosemantics isn't trying to explain behavior *per se* (which physics/physiology can do), but rather explaining *intentionality*. She may say content is a relational property like "being a husband," which Swampman lacks, but that doesn't make it unreal.
  *   **Follow-up:** "If content is like 'being a husband'—extrinsic and historically dependent—then it seems content is not part of the *causal* machinery of the mind. How do you respond to the charge that this makes teleosemantics a theory of *labeling* rather than a theory of *cognitive mechanism*?"

  ### 4. Novel Concepts and Derived Content (Refined Q4)
  **Question:** "How does your view handle concepts like 'quark' or 'hedge fund' that played no role in our evolutionary past? The standard move is to say we have selected-for *learning mechanisms* that combine primitive concepts. But does the *output* of that learning inherit teleosemantic content? Or are we saying the *capacity* to learn has a function, but the specific content ('quark') is derived in a way that isn't strictly teleosemantic?"

  *   **Anticipated Reply:** She will argue for "derived proper function." The learning mechanism has a proper function, and if it operates in normal conditions, the resulting state has content. The content is anchored by the mapping rules of the primitive concepts recombined by the selected mechanism.
  *   **Follow-up:** "But for 'quark,' the mapping rules aren't fixed by selection; they're fixed by social convention and theory. Does teleosemantics eventually hand off the baton to a use-theory or social-externalist account for high-level concepts? If so, is teleosemantics only the foundation for a small subset of our mental life?"

  ### 5. Logic and Mathematics (Refined Q6)
  **Question:** "Following up on novelty: how do we get the content of logical or mathematical concepts? Selection history gives us 'predator' or 'food,' which track contingent features of the world. But 'modus ponens' or 'the number three' seem to track necessary truths. How does a selection history, which is essentially contingent, fix content that appears to be necessary and abstract?"

  *   **Anticipated Reply:** She might adopt an instrumentalist or nominalist stance (math talk is useful but doesn't refer to abstracta) OR argue that mathematical concepts are tools for tracking structural relations in the world that *were* adaptive (e.g., tracking quantities of food).
  *   **Follow-up:** "If mathematical content is just tracking adaptive structural relations, how do you account for the *normativity* of logic? We feel bound by modus ponens even when it doesn't lead to fitness. Is logical normativity reducible to biological normativity, or is there a gap there?"

  ### 6. Phenomenology and Qualia (New Addition)
  **Question:** "This is a Philosophy of Mind department, so I have to ask: how does your view interface with phenomenal consciousness? Teleosemantics gives a great story about reference and truth conditions. But does it tell us anything about *what it is like* to have a state? Can two states have the same teleosemantic content but different phenomenal characters, or does fixing the function fix the feel?"

  *   **Anticipated Reply:** Many teleosemanticists (like Millikan) are wary of qualia. She might argue that phenomenal character is just a specific kind of representational content (e.g., imperative content about bodily states) or that the "feel" is irrelevant to the semantic theory.
  *   **Follow-up:** "If the 'feel' is irrelevant to the semantic theory, does that mean a philosophical zombie could have full teleosemantic content? If so, haven't we naturalized reference at the cost of disconnecting it from the subjective perspective that makes it mental in the first place?"

  ### 7. Scaling to Human Cognition (Refined Q5)
  **Question:** "Much of the literature relies on simple systems: frogs, bacteria, magnetosomes. Is there a point where the teleosemantic story runs out of steam as we scale up to human propositional attitudes? Do you think the same basic producer-consumer machinery explains believing that 'Paris is the capital of France,' or does human language introduce a fundamentally different kind of intentionality that requires extra machinery?"

  *   **Anticipated Reply:** She will likely argue for continuity. Language itself is a biological device with proper functions. Public language sentences map onto internal states, extending the system. The machinery is the same, just more complex layers of mapping.
  *   **Follow-up:** "If language is just another biological device, how do you handle the normativity of *public* language meaning versus *internal* thought? It seems public meaning is governed by social norms that can override biological function (e.g., using a word ironically). Does teleosemantics have the resources to handle that social layer?"

  ### 8. The "Hardest Problem" (Refined Q7)
  **Question:** "Finally, stepping back from the objections: in your current work, what do you see as the single hardest problem for your specific version of teleosemantics? Not the standard objections you've answered before, but the one that keeps you up at night or drives your current research agenda."

  *   **Anticipated Reply:** (This is open, but she might mention: integrating with neuroscience, handling vagueness, or the "disjunction problem" in new forms).
  *   **Follow-up:** (Listen carefully). "That's fascinating. Do you think solving that requires modifying the core teleosemantic framework, or just applying it more rigorously?"

  ---

  ### Moderation Strategy Notes

  1.  **Grouping:** If time is tight, group **Q4 (Novelty)** and **Q5 (Math)** together. They both address the "Human/Abstract" challenge. You can say: *"I have a two-part question about the scope of the theory, covering both novel concepts and mathematical content..."*
  2.  **The "Her Own Version" Caveat:** Since you mentioned she has her own version of the view, listen closely to her talk. If she explicitly solves one of these (e.g., she offers a new solution to Swampman), **drop that question** and ask for elaboration instead. Asking a question she just answered makes you look like you weren't listening.
  3.  **Audience Management:** If an audience member asks a "softball" question (e.g., "Can you explain teleosemantics again?"), summarize it quickly and move to a harder one. If someone asks a hostile question, rephrase it charitably before handing it to her. *"So, the concern is about explanatory power, is that right?"*
  4.  **Tone:** Your follow-ups are sharp, but deliver them with curiosity, not aggression. Use phrases like *"I'm trying to press on..."* or *"Help me understand how..."* rather than *"But doesn't that fail because..."*

  This set covers the metaphysical (Swampman), the semantic (Indeterminacy), the cognitive (Novelty/Math), and the phenomenological (Qualia), giving you a comprehensive grip on the discussion. Good luck!
