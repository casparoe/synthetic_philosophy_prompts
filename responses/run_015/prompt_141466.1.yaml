      *(Self-Correction during drafting)*: I need to be careful not to dismiss SIA entirely. It is the dominant view among many anthropic reasoners (e.g., Bostrom initially, though he moved to FNC/SSA hybrids in some contexts, many Bayesians lean SIA). The "Segmented Life" objection is essentially the "Reference Class" problem. I should frame it as the *definition of the denominator*.
