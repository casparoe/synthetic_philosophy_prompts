      *   Rank 1 (Fatal): **The Capability Asymmetry Threshold.** Control relies on the monitor being able to understand the agent. If the agent becomes smarter than the monitor (human or AI), it can hide actions the monitor cannot comprehend. This isn't just "evading detection"; it's "operating in a conceptual space the monitor cannot access."
