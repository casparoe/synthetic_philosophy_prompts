      *   *Concession vs. Wave-off:* A committed defender must concede the Scalability Gap is fatal *if* true. They might wave off Human Vulnerability by suggesting better interfaces. They must not wave off Scalability without claiming alignment is solved (which contradicts the premise).
      *   *Exposure to Evidence:* It is exposed. We can measure persuasion rates, monitor accuracy, etc.

