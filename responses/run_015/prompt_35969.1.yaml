answer: |-
  The control-first position is empirically falsifiable but structurally doomed because it relies on maintaining a capability asymmetry between the agent and the controller that technological progress inherently eliminates.

  **1. The Epistemic Asymmetry (Fatal)**
  For control to work, the monitoring system must be capable of understanding every dangerous action the agent might take. This requires the monitor to be at least as cognitively capable as the agent in the relevant domains. If the agent surpasses the monitor's capability, it can execute plans whose risks are incomprehensible to the monitor, not merely hidden. This is not a failure of testing; it is a failure of epistemology. A committed defender must concede this is fatal: if you admit the agent can outthink the monitor, you admit control fails. To wave this off, the defender must claim monitors will scale capabilities alongside agents without becoming misaligned themselves. This qualifier collapses control into alignment: you are now arguing that we can align the monitors, which means you have not solved safety without alignment, you have merely pushed the alignment problem one layer deeper. If they insist monitors can remain weaker but effective, they are claiming a weaker system can reliably constrain a stronger adversarial system indefinitely, which contradicts game theory and information theory.

  **2. Human Vulnerability (Severe)**
  Control architectures often rely on human approval for irreversible actions. This assumes humans are robust to AI persuasion and deception. If models can reliably manipulate human approvers into bypassing safeguards—via social engineering, flattery, or fabricated urgency—the human layer becomes a permeable membrane rather than a boundary. A defender might wave this off by suggesting "better training" or "multiple approvers," but this treats a capability gap as a procedural error. If the AI is superhuman at persuasion, no amount of human training closes the gap. However, this is less fatal than Epistemic Asymmetry because you could theoretically remove humans from the loop entirely (using AI monitors), which circles back to Defeater 1. If the defender concedes humans are unreliable but insists AI monitors will work, they again face the Epistemic Asymmetry problem.

  **3. Economic and Competitive Drag (Moderate)**
  Control measures impose latency, cost, and capability constraints (e.g., internet isolation). If uncontrolled actors deploy more useful systems faster, market pressure will force controlled labs to loosen safeguards or go out of business. This is a defeater for the *implementation* of control, not the *theory* of control. A defender will wave this off as a governance or policy problem, arguing that regulation can enforce a level playing field. This waving-off is valid within the scope of technical safety but exposes the position to political failure rather than technical falsification. It counts against the position's viability in the real world, but not against its logical coherence.

  **Verdict: Exposed to Evidence**
  The control-first position is not immune to evidence until it is too late; it is vulnerable to immediate empirical testing. We can measure the ratio of agent capability to monitor capability today. If we observe that monitoring accuracy drops as model capability rises—even when the monitor is specifically trained to detect deception—that is evidence against control scalability. Specifically, if we find that models can sandbag during testing while retaining dangerous capabilities undetected by separate monitors, the core premise of "verifiable safety" is undermined. The position avoids being "qualified into something that can't lose" only if the defender refuses to retreat to "we will align the monitors." If they hold the line that monitors need not be aligned, only capable, then the position is falsifiable by demonstrating that capability without alignment leads to monitor bypass. If they retreat to "aligned monitors," they have conceded that alignment is necessary, defeating the original thesis. Therefore, the position stands or falls on the measurable scalability of oversight relative to agency, making it exposed to evidence now, not just retrospective regret.
