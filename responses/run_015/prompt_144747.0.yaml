answer: |-
  The institutional practice presupposes a hybrid ontology that treats protected classes like race and gender as nominal legal categories, while treating behavioral and lifestyle data as natural kinds. In this view, bias is understood as a semantic error—a matter of explicitly naming forbidden categories in the code—rather than a structural feature of the data itself. Consequently, the bank operates on the assumption that if a variable is not labeled "race," it is ontologically innocent, regardless of whether it functions as a perfect proxy for racialized social history. Creditworthiness, by contrast, is treated as an objective, pre-social trait that can be discovered through neutral observation of typing rhythms and consumption patterns, independent of the structural conditions that shape those behaviors.

  This view is fundamentally incoherent because it severs the causal link between social structure and data generation. If lifestyle clusters are produced by historical processes like segregation, redlining, and wealth stratification, then those clusters are not neutral features of nature but encoded artifacts of the very protected classes the model claims to ignore. The practice relies on a contradiction: it claims moral credit for "blindness" to race while simultaneously exploiting the economic correlations created by racism. By treating proxies as ontologically distinct from the categories they proxy, the institution commits a category error, mistaking the statistical shadow of a social kind for an individual merit signal. It assumes that removing the label removes the essence, which denies the reality that social kinds exist structurally, not just linguistically.

  Regarding underdetermination, a strict instrumentalist theory could license the same practice without contradiction, provided it abandons the claim of fairness. If the only goal is predictive accuracy, the ontology of the data does not matter; however, the bank's assertion that the model is "blind" and therefore fair introduces a deontological constraint that clashes with its consequentialist mechanics. Alternatively, a naive empiricism could argue that we simply observe correlations without theorizing causes, but this fails to account for the normative weight of lending decisions. The practice is therefore not underdetermined by a single consistent theory but is instead overdetermined by incompatible ones: it wants the ethical cover of nominalism (we didn't use race) with the economic utility of realism (we used the real predictors of risk).

  If we replaced this with a straightforward social-constructionist theory, the data pipeline and disclosure rules would require radical restructuring. Institutions would need to audit features not for their labels but for their disparate impact, treating high correlation with protected classes as a signal of structural bias rather than predictive value. Disclosure rules would need to shift from explaining individual denial reasons to acknowledging the structural factors influencing the score, perhaps requiring narrative explanations of how neighborhood data interacts with historical inequality. Finally, risk language would need to change from describing "probability of default" as an intrinsic trait to describing it as a conditional probability dependent on current social constraints, potentially necessitating adjusted thresholds to compensate for the constructed nature of the input data.

