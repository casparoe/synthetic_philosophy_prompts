          *   **Path B (Gate Waited):** Round 2 is about Blame/Complicity. (Cost of Rule). "You let us drown."
      *   *This is too much for 90 mins.*
      *   *Let's simplify.* The prompt asks for "The second half has to make the opposite move."
      *   *Idea:* In Round 1, the Rule is an Obstacle to Safety. In Round 2, the Rule is a Shield against Judgment.
      *   *Scenario:*
          *   **Round 1:** The Sluice. Water rising. Rule: Warden Only. (Break rule = Save Cellar).
          *   **Round 2:** The Town Hall (Immediate aftermath). The Warden says: "I can waive the penalty for breaking the rule, but only if you all agree that the emergency was real. If you disagree, the person who pulled the lever pays for the damage."
