          *   *This forces the "German" bureaucrats to either validate the hero (admitting rules are flexible) or crush them (upholding rules).*
          *   *This creates the "Bid for Authority" dynamic.* The Hero claimed authority to open the gate. Now the Group must ratify that claim.
