      *   *The "American" move:* Signing validates the *individual* but exposes the *group* to future risk.
      *   *Wait, if the Hero is the one who opened the gate, they are the American.*
      *   *In Phase 2, the American needs the Germans to validate them.*
      *   *The Germans must decide: Do we validate this breach (making rules flexible) or hold the line (making rules rigid)?*
      *   *If they validate:* Rules are shown to be suggestions. Future safety is compromised.
      *   *If they don't:* The individual is sacrificed. Future safety is maintained, but trust is broken.
      *   *This perfectly mirrors the User's insight.*

  11. **Final Polish:** Check tone. Needs to be practical, respectful of the user's craft, and rigorous about the constraints. Ensure the "Banned Words" list is prominent. Ensure the "Clock" is integrated.

      *   *Wait, one detail:* "The rule saying only the warden opens them is genuinely obsolete."
      *   *In Phase 2:* The Warden says "I can backdate the permit." This confirms the rule is flexible *if* the group agrees.
      *   *Okay, ready to write.*

      *(Self-Correction during drafting)*: Make sure the "Private Facts" on the cards actually drive the conflict without using banned words.
      *   *Example:* Instead of "You feel guilty," use "Your hands are shaking." Instead of "It's your duty," use "You have the only key."

