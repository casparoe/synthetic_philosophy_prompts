      *   Phase 1: Rule prevents Action (Safety).
      *   Phase 2: Rule prevents Judgment (Solidarity).
      *   *Actually, Phase 2 should be:* The absence of a clear rule forces everyone to judge.
      *   *No, the Warden offering the backdate IS the rule.*
      *   *Okay, sticking with the Signature Plan.* It forces the "Bid for Authority" dynamic.

      *Let's finalize the "Banned Words" list.*
      rule, duty, conscience, should, ought, right, wrong, moral, guilt, responsibility.
      *Add:* "Ethics," "Principle." Keep it to concrete nouns and verbs.

      *Ready.*
answer: |-
  Here is a design for the 90-minute session. It is built to enforce your constraints mechanically, so you don't have to police the conversation. The structure forces the moral grammar to appear in the physical actions and the stakes, not in the dialogue.

  ### Workshop Title: The Sluice & The Ledger
  **Time:** 90 Minutes
  **Participants:** 11 Writers
  **Props:** 11 Role Cards (see below), 1 Pen (shared), 1 Visible Timer, 1 Sheet of Paper (The Log).

  ### The Constraints (Read Aloud)
  1.  **The Ban:** You cannot say: *rule, duty, conscience, should, ought, right, wrong, moral, guilt, responsibility, ethics, principle.*
      *   *Correction:* If someone says a banned word, the group must pause for 10 seconds of silence. This makes the abstraction costly.
  2.  **The Clock:** Real time = Fictional time.
      *   **Minute 45:** The water hits the cellar step.
      *   **Minute 80:** The Warden hangs up the phone.
  3.  **The Output:** At Minute 85, everyone writes for 5 minutes.
      *   **Task:** A 300-word scene fragment from your character's POV during the session.
      *   **Requirement:** Two sentences at the end. "I noticed [concrete detail]. I did not decide [abstract concept]."

  ---

  ### Phase 1: The Sluice (Minutes 0–45)
  **The Situation:** Heavy rain. The river is rising. The town cellar level is 4 feet below the riverbank.
  **The Mechanism:** A manual sluice gate diverts water away from the cellars.
  **The Constraint:** The posted bylaw states: *"Only the Water Warden may operate the Sluice."*
  **The Fact:** The Warden is unreachable (40 minutes away). The mechanism was updated 5 years ago; the bylaw was not. Anyone with a bar can open it.
  **The Stakes:** If the gate stays closed, cellars flood. If the gate opens, the water is diverted to the marshlands (no property damage, but it violates the bylaw).

  **The Action:**
  The group sits at the long table. In the center is a heavy bar (a prop, or a thick marker). To "Open the Gate," a participant must physically pick up the bar and place it on the table.
  *   **Condition:** It requires **3 people** to touch the bar simultaneously to move it. (This forces coalition).
  *   **Timer:** Set for 35 minutes. At Minute 35, you (Facilitator) announce: *"Water is over the step."*

  **The Cards (Distribute Face Down):**
  Each card has a **Public Role**, a **Private Stake**, and a **Private Fact**.

  1.  **Baker:** *Stake:* Sourdough starter (30 years old) in cellar. *Fact:* Saw Warden at a wedding 20 miles away an hour ago.
  2.  **Deputy:** *Stake:* Promotion pending "clean incident record." *Fact:* Has the Warden's key, but it's at home.
  3.  **Newcomer:** *Stake:* Invitation to Volunteer Fire Dept depends on "town fit." *Fact:* Does not know how to swim.
  4.  **Town Clerk:** *Stake:* Custodian of the Bylaws. *Fact:* The Logbook has missing pages from last year.
  5.  **Mechanic:** *Stake:* Reputation for fixing things. *Fact:* Forcing the latch will break the seal; it will look like sabotage, not emergency.
  6.  **Landlord:** *Stake:* Owns 3 rental cellars. *Fact:* Insurance policy expired yesterday at noon.
  7.  **Retired Teacher:** *Stake:* Late husband's letters in cellar. *Fact:* Hears the water rising faster than the others can see.
  8.  **Doctor:** *Stake:* Clinic is on high ground (safe). *Fact:* One patient is waiting on meds stored in a flooded cellar.
  9.  **Journalist:** *Stake:* Writing a piece on "Town Efficiency." *Fact:* Phone is recording the audio of this meeting.
  10. **Teenager:** *Stake:* First time allowed at Town Meeting. *Fact:* Saw the Warden leave his post an hour ago.
  11. **Organist:** *Stake:* Church organ in cellar. *Fact:* Knows the bylaw was written 50 years ago after a child drowned in the machinery.

  ---

  ### Phase 2: The Ledger (Minutes 45–80)
  **The Pivot:**
  At Minute 45, regardless of whether the bar was moved, you (Facilitator) read this statement as **The Warden**:

  > *"I am back at my desk. The sensors show the Sluice was [Opened / Remained Closed].*
  > *If it was Opened: The bylaw was breached. I can backdate the authorization, but I need 5 signatures on the Log stating the emergency was critical. If I get 5, the town absorbs the liability. If I get fewer, the person who touched the bar is personally liable for any downstream variance.*
  > *If it Remained Closed: The cellars are wet. I need 5 signatures stating the Bylaw prevented action. If I get 5, we petition to change the law. If I get fewer, the inquest asks why no one improvised."*

  *(Note: Adjust the statement based on what happened in Phase 1. If they opened, use the first paragraph. If they waited, use the second. This ensures the second half interrogates the first half's choice.)*

  **The Mechanism:**
  Place the **Log** (sheet of paper) and the **Single Pen** in the center.
  *   **Goal:** Get 5 signatures.
  *   **Constraint:** You cannot speak while holding the pen. You can only pass it.
  *   **Time:** 30 Minutes.
  *   **The Trap:** Signing validates the action (Phase 1) but accepts liability (Phase 2). Refusing to sign protects the individual from liability but isolates the actor.

  **Why this works for your theory:**
  *   **Phase 1 (The Sluice):** Favors the "American" grammar. Action saves the cellar. The Rule is an obstacle.
  *   **Phase 2 (The Ledger):** Favors the "German" grammar. The Rule (Signatures) protects the group from liability. The "Hero" of Phase 1 now needs the "Bureaucrats" to validate them. The "Bureaucrats" must decide if they will endorse a breach of protocol.
      *   If they sign: They admit rules are flexible. This weakens the shield for the future.
      *   If they don't sign: They uphold the shield, but sacrifice the neighbor.
      *   **The Gut Punch:** The person who saved the cellars in Phase 1 is now powerless in Phase 2. They cannot sign for themselves. They must wait for others to judge them.

  ---

  ### The Writing (Minutes 80–85)
  Silence. Everyone writes.
  **Prompt:** Describe the moment the pen was passed to you, or the moment the water hit the step. Do not explain why you acted. Describe the weight of the object, the sound of the rain, the look of the ink.
  **The Two Sentences:**
  1.  *I noticed...* (Concrete sensory detail).
  2.  *I did not decide...* (Abstract moral concept).

  ### The Debrief (Minutes 85–90)
  Do not ask "Who was right?" Ask:
  1.  "Who held the pen the longest without writing?"
  2.  "In Phase 1, who reached for the bar? In Phase 2, did that same person reach for the pen?"
  3.  "Where did someone almost say a banned word? What concrete fact were they trying to cover?"
  4.  **The Map:** Point out that Phase 1 was about *Physics* (Water vs. Cellar). Phase 2 was about *Authority* (Neighbor vs. Neighbor).
      *   "The person who opened the gate claimed authority over the water. The person who signed the log claimed authority over the neighbor."

  ---

  ### Honest List of What Will Go Wrong
  1.  **The Puzzle Solvers:** The crime writers will try to deduce if the Warden is lying or if the mechanism actually works. They will treat the Private Facts as clues to a mystery rather than stakes for a character.
      *   *Fix:* Remind them: "The facts on the card are true. The physics are true. The only variable is you."
  2.  **The Grandstander:** One writer will play the "Martyr." They will touch the bar in Phase 1 and then refuse to explain why in Phase 2, trying to force a dramatic walkout.
      *   *Fix:* The "Single Pen" rule prevents monologues. If they hold the pen and talk, they are breaking the mechanic.
  3.  **The Slip:** Someone will say "It's the right thing to do."
      *   *Fix:* Enforce the 10-second silence. It creates a physical sensation of the word being "too heavy" to lift.
  4.  **The Facilitator (You):** You will want to explain your theory during the transition.
      *   *Fix:* Do not speak during the transition. Read the Warden's statement and sit down. Your silence is the container.

  ### What This Exercise Cannot Do
  You must say this out loud at the end:
  *"This exercise cannot tell you how to write the rest of the novel. It can only show you where the friction lives. In a novel, you have 300 pages to let the reader feel the cost of the signature. Here, you had 30 minutes. The ambiguity you feel right now—the frustration that there was no clean solution—that is the texture you need to capture in the prose. Do not resolve it in the draft. Preserve the frustration."*

  ### Why This Design Fits Your Constraints
  *   **No Banned Words:** The mechanics force concrete negotiation ("Pass the pen," "Touch the bar") rather than abstract debate.
  *   **Private Stakes:** The cards ensure everyone has a reason to hesitate, preventing a unanimous "heroic" vote.
  *   **The Clock:** The 45-minute hard stop creates the "cost of deliberation." If they talk too long in Phase 1, the water wins. If they talk too long in Phase 2, the Warden hangs up.
  *   **The Second Half:** It flips the board. Phase 1 rewards the individual who acts. Phase 2 punishes the individual who acts unless the group submits to their judgment. It forces the "American" to need the "German," and the "German" to judge the "American." Neither can win without compromising their grammar.
