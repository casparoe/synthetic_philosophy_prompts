          *   *Doctor:* Clinic is on high ground (safe). Private Fact: Patient in cellar waiting for meds.
          *   *Journalist:* Writing a piece on town efficiency. Private Fact: Recording the conversation.
          *   *Teenager:* First time at meeting. Private Fact: Saw the warden leave an hour ago.
          *   *Landlord:* Owns 3 cellars. Private Fact: Insurance expired yesterday.
          *   *Priest:* Holds the moral weight. Private Fact: Believes the flood is punishment. (Maybe too on the nose). Let's make it: *Organist.* Church organ in cellar. Private Fact: Knows the rule was written after a death 50 years ago.

  7.  **Addressing the Constraints:**

      *   **Banned Words:** List them clearly.
      *   **Clock:** 35 mins for Round 1. 5 min transition. 30 mins Round 2. 10 mins write/debrief.
      *   **Output:** 300 words + 2 sentences ("I noticed..." not "I decided...").

  8.  **Anticipating Failures:**

      *   Crime writers solving the puzzle (Is the rule *really* obsolete?).
      *   Someone grandstanding (The Walkout).
      *   Using banned words (Habit).
      *   Facilitator (User) stepping in to explain.

