      *   **Setup:** Long table. 11 writers.
      *   **Time:** 90 mins total.
          *   10 min: Intro & Cards.
          *   35 min: Round 1 (The Gate).
          *   5 min: The Turn (Warden Call).
          *   30 min: Round 2 (The Signatures).
