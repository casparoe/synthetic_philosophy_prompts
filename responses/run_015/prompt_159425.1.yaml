      *   *Actually, to ensure the moral conflict lands:* We force the "Open" outcome for the sake of the exercise's second half. Why? Because the user wants to explore the cost of the American move. If they Wait, the American move is theoretical. If they Open, it's real.
      *   *Wait, I can't force it.* That violates the "no correct answer" rule.
      *   *Okay, Branching Paths:*
