      *   Need 11 distinct roles.
      *   Stakes must be small but personal.
      *   Private Facts must complicate the decision.
      *   *Examples:*
          *   *Baker:* Cellar has flour. Private Fact: Knows the warden is actually at a wedding, not working.
          *   *Deputy:* Needs clean record for promotion. Private Fact: Has the warden's key but forgot it at home.
          *   *Newcomer:* Wants to join the volunteer fire dept. Private Fact: Doesn't know how to swim.
