                  *   *Actually, the user wants "The second half has to make the opposite move."*
                  *   *Okay, let's try this:*
                  *   **Phase 1 (45 mins):** The Crisis. (As described).
                  *   **Phase 2 (45 mins):** The Ratification. The gate was forced (or not). Now the Town Meeting is happening *now* (in the workshop). They have to vote on whether to punish or praise the actor.
                  *   *No, that's debate.*
                  *   *Let's go with the "Two Gates" idea but compressed.*
                  *   **Gate 1 (Upstream):** Protects the Baker, the Clerk, etc. Rule: Warden Only.
                  *   **Gate 2 (Downstream):** Protects the School, the Clinic, etc. Rule: None. (It broke last year, nobody fixed it).
                  *   **The Kicker:** The water released by Gate 1 *causes* the pressure at Gate 2.
                  *   **The Moral:** If you open Gate 1 (Conscience), you create the pressure at Gate 2 where there is no Rule to protect the victims. If you wait at Gate 1 (Rule), Gate 2 never engages.
                  *   *Wait, if Gate 2 has no rule, that favors the American.*
                  *   *Let's reverse it.*
                  *   **Gate 1:** Rule exists. Breaking it saves *your* cellar.
                  *   **Gate 2:** Rule exists. Keeping it saves *your* reputation/belonging. Breaking it saves the *town*.
                  *   *Okay, I need to stop overthinking the plot and focus on the MECHANICS of the workshop.*
                  *   *The User's Insight:* "The American move... is a bid... puts everyone else in the position of either endorsing you or being judged by you."
                  *   *How to make them DO this?*
                  *   **Round 1:** Decide to Open or Wait. (45 mins).
                  *   **Round 2:** The Warden calls. "I can cover for you, but I need 5 signatures vouching for the emergency. If you sign, you are liable if the downstream assessment is wrong."
                  *   *This works.* It shifts from "Physical Action" to "Social Liability."
                  *   *In Round 1:* The "American" wants to Act (Open Gate). The "German" wants to Wait (Follow Rule).
                  *   *In Round 2:* The Gate is Open. Water is diverted. Warden offers cover.
                  *   *The "American" now faces a dilemma:* To validate their action, they need others to sign. This forces others to submit to their judgment.
                  *   *The "German" now faces a dilemma:* To protect the group from liability, they refuse to sign. This protects the neighbor from being judged/liable, but leaves the actor exposed.
                  *   *This aligns perfectly.* Round 1 is about Physical Safety (Conscience vs Rule). Round 2 is about Social Safety (Authority vs Solidarity).

