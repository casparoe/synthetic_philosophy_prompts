      *   **Title:** The Sluice & The Signature.
      *   **Setup:** Room, Time, Bans.
      *   **Phase 1 (The Water):** Mechanics, Cards.
      *   **Phase 2 (The Ledger):** The Pivot, Mechanics.
      *   **Writing Prompt:** Specific instructions.
      *   **Debrief:** How to map the experience to the theory.
