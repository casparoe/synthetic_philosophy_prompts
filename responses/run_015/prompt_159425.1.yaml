          *   *Better Idea:* The scenario isn't two different towns, it's the *same* town, but the focus shifts from the *physical consequence* (water) to the *social consequence* (authority).
          *   *Refined Idea:* Part 1 is the Crisis (Water). Part 2 is the Accountability (The Logbook).
          *   *Wait, the prompt asks for "The second half has to make the opposite move."* The user suggested a mirror version where the rule is gone. I need to avoid the "lawless = freedom" trap.
          *   *New Concept for Part 2:* The "Rule" wasn't about the gate mechanism. It was about *consensus*. In Part 1, they decide whether to open the gate. In Part 2, they decide whether to *lie* about who opened it to protect the person who did.
          *   *Actually, let's look closer at the user's specific insight:* "The American move... is a bid... puts everyone else in the position of either endorsing you or being judged by you."
          *   *Design:*
              *   **Round 1 (The Upstream Gate):** Imminent flood. Rule: Warden only. Fact: Rule obsolete. Stakes: Cellars. *Action:* Open or Wait?
              *   **Round 2 (The Downstream Gate):** The water has been diverted. Now it's heading toward a different neighborhood (or the same one, but later). The Mechanism is broken *because* it was forced in Round 1. Now, the Warden is here. He asks: "Who turned the handle?"
              *   *Wait, that makes the American move look bad (broken mechanism).* The user said: "If the rule turns out to be secretly wise, the whole thing collapses."
              *   *Correction:* The mechanism must *not* be broken by forcing it. The consequence must be social.
              *   *Revised Round 2:* The gate was forced. The water is saved. But now the Warden is on the phone. He says, "The log shows manual override. That requires a signature. If no one signs, the system locks down for a month. If someone signs, they are liable for any downstream variance."
              *   *The Flip:* In Round 1, the American move (Act) saves the cellar. In Round 2, the American move (Claim Authority) endangers the neighbor. The German move (Refuse to Claim/Wait for Process) protects the neighbor from liability.
