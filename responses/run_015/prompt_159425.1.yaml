      *(Final check on "Second Half")*: Does it land the "Authority" insight? Yes, because the "Hero" cannot succeed alone in Phase 2. They need the group to ratify their judgment. The Group's refusal isn't cruelty; it's a defense of the shared standard.

      *Let's build the cards.*
      1. Baker (Cellar: Flour/Starter). Fact: Warden is at a wedding.
      2. Deputy (Stake: Promotion). Fact: Has key, left at home.
      3. Newcomer (Stake: Invitation). Fact: Can't swim.
      4. Clerk (Stake: Trust/Keys). Fact: Logbook has missing pages.
      5. Mechanic (Stake: Reputation). Fact: Forcing breaks seal (looks like sabotage).
      6. Landlord (Stake: 3 Cellars). Fact: Insurance expired.
