      *   **Goal:** Participants leave *unable* to decide who is right, with a scene fragment where both are right and neither is a villain.
      *   **Constraints:**
          1.  **Banned Words:** rule, duty, conscience, should, ought, right, wrong, moral, guilt, responsibility. Argument must be via concrete facts (who gets wet, mechanisms, timing).
          2.  **Private Stakes:** Everyone gets a card with a small, particular loss + one private fact.
          3.  **The Clock:** Real time = Fictional time. Deliberation has a cost. One grammar buys time, the other spends it.
          4.  **Scenario:** River town, sluice gates. Flood imminent. Warden 40 mins away. Rule says "Warden only," but rule is obsolete (mechanism changed).
          5.  **The Core Problem:** The user needs the *second half* of the exercise to flip the script. The first half favors the American (break obsolete rule to save property). The second half needs to show the cost of the American move (claiming authority over neighbors) vs. the German move (protecting the shared fabric). The user's instinct about a "lawless town" feels wrong (too liberating).
          6.  **Deliverables:** Both halves of scenario, roles/cards, mechanics, output (scene fragment + 2 sentences), debrief plan, honest list of failures, limitations.
          7.  **Crucial:** No correct answer.

  2.  **Deconstruct the Moral Conflict:**

      *   *Position A (American/Conscience):* The situation demands action. The rule is technical/obsolete. Saving the cellar is the priority. Action validates the self.
      *   *Position B (German/Rule):* The rule isn't about the mechanism; it's about who has the authority to act. If *I* open it, I decide for *you*. If we wait, we remain equal under the system, even if we get wet.
      *   *The Twist:* The user wants the second half to show that breaking the rule isn't just "saving the day," it's "imposing a verdict."

  3.  **Developing the Two Halves:**

      *   *Part 1 (The Flood):* As described. Water rising. Warden late. Obsolete rule.
          *   *Pressure:* Physical danger (water).
          *   *Dynamic:* Action vs. Wait.
          *   *Outcome:* If they force it, they save the cellars but break the protocol. If they wait, cellars flood, protocol holds.
      *   *Part 2 (The Aftermath/The Second Gate):* This needs to be the mirror.
          *   *Idea:* The water didn't rise? Or the water receded? No, that removes tension.
