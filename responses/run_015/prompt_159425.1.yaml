      8. Doctor (Stake: Patient meds). Fact: Clinic is safe.
      9. Journalist (Stake: Story). Fact: Recording.
      10. Teen (Stake: First vote). Fact: Saw Warden leave.
      11. Organist (Stake: Organ). Fact: Rule written after a death.

      *Looks solid.*

