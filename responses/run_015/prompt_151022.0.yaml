answer: |-
  There is no single, canonical term in political philosophy or social policy that functions as a neat label (like *ad hominem* or *straw man*) for this specific oscillating structure. However, your description maps precisely onto a convergence of three established concepts from rhetoric, social psychology, and critical political economy.

  Depending on which discipline you prioritize, this structure is best identified as **Kettle Logic** (rhetoric), **Asymmetric Reciprocity** (social policy), or the discursive arm of **The Centaur State** (critical sociology).

  Here is a delineation of these concepts, how they differ from adjacent fallacies, and how to test for them.

  ### 1. The Rhetorical Structure: Kettle Logic
  The most precise rhetorical label for the argumentative maneuver you describe is **Kettle Logic** (originally coined by Freud, drawing on a joke about a man accused of returning a borrowed kettle damaged).
  *   **The Structure:** The defendant offers three contradictory arguments: (1) I returned the kettle undamaged; (2) the kettle was already damaged when I borrowed it; (3) I never borrowed the kettle.
  *   **Application to Welfare:**
      1.  *Fiscal:* Conditionality saves money/stops fraud.
      2.  *Normative:* It's not about money; it's about moral reciprocity.
      3.  *Exceptionalism:* The rich/corporations are different (market mechanisms/contracts).
  *   **Why it fits:** Like Kettle Logic, these justifications are mutually exclusive if held simultaneously (if it's purely moral, fiscal data shouldn't matter; if it's purely fiscal, the rich should be audited equally), but they are deployed sequentially to ensure that *some* defense always stands against a specific line of attack.
  *   **Distinction from Motte-and-Bailey:** A standard Motte-and-Bailey involves retreating from a controversial claim (Bailey) to a defensible one (Motte). Your example involves **Multiple Mottes**. The defender does not retreat to a single safe position; they swap between two different safe positions (Fiscal Prudence vs. Moral Duty) depending on which one is currently under fire. This is sometimes called a **"Multi-Motte Defense"** or **"Discursive Oscillation."**

  ### 2. The Policy Mechanism: Asymmetric Reciprocity
  In social policy analysis, specifically within the literature on **Deservingness Heuristics** (pioneered by Wim van Oorschot), this is identified as the selective manipulation of the **CARIN criteria** (Control, Attitude, Reciprocity, Identity, Need).
  *   **The Mechanism:** Defenders of conditionality apply the **Reciprocity** criterion strictly to the poor (aid must be exchanged for labor) while applying the **Utility** or **Identity** criteria to the wealthy (subsidies are justified by economic growth or status).
  *   **Established Terminology:** Scholars like **Stuart White** (on reciprocity) and **Loïc Wacquant** (on punitive welfare) describe this as **Asymmetric Reciprocity** or **Categorical Particularism**.
  *   **Why it fits:** It captures the specific content of the shift. The defender is not just changing the *reason* (fiscal vs. moral); they are changing the *population* to whom the reason applies. The "principle" of reciprocity is presented as universal but is operationally particular.

  ### 3. The Structural Context: The Centaur State
  The French sociologist **Loïc Wacquant** provides the most robust structural explanation for *why* this argumentative oscillation occurs. He describes the neoliberal state as a **"Centaur State."**
  *   **The Concept:** The state is "liberal" (hands-off, permissive, deregulated) for the upper classes and "paternalistic" (intrusive, punitive, conditional) for the lower classes.
  *   **Relevance:** The argumentative oscillation you observe is the *discursive reflection* of this bifurcated state. When you ask about the poor, the "paternalistic" head of the centaur speaks (moral discipline). When you ask about the rich, the "liberal" head speaks (market freedom/contracts). The inconsistency in the argument is a feature, not a bug; it mirrors the dual function of the state apparatus.

  ### Delineation from Adjacent Concepts

  | Concept | Key Difference |
  | :--- | :--- |
  | **Hypocrisy** | Hypocrisy implies a gap between *belief* and *action*. Your structure can exist even if the defender sincerely believes both justifications. It is a structural incoherence, not necessarily a moral failing of the speaker. |
  | **Special Pleading** | Special pleading is the *result* (making an exception for the rich). Your structure describes the *process* (the oscillating justifications used to arrive at the exception). |
  | **Strategic Ambiguity** | Strategic ambiguity is usually designed to appeal to *multiple audiences* simultaneously. Your structure is defensive against a *single interlocutor*, shifting to neutralize specific counter-arguments. |
  | **Ideological Rationalization** | This is the broader category. Your structure is a specific *subtype* of rationalization characterized by **non-falsifiability through oscillation**. |

  ### Boundary Conditions: Sincerity vs. Strategy
  You asked whether the oscillation requires sincere belief. **Structurally, it does not.**
  *   **Strategic Deployment:** The defender knows the arguments contradict but uses them as tools.
  *   **Cognitive Dissonance:** The defender sincerely holds both beliefs but compartmentalizes them to avoid the psychological discomfort of the contradiction.
  *   **The Boundary Condition:** The defining feature is not the internal state of the defender, but the **immunization of the conclusion**. If the conclusion (poor people must be sanctioned) remains constant while the premises shift to avoid falsification, the structure is present regardless of sincerity. In political analysis, this is often treated as **"Functional Incoherence."**

  ### The Decisive Case Comparison
  To reveal whether a defender is running this structure rather than holding an ordinary inconsistent preference, you should propose a **Parallel Conditionality Test** involving **Corporate Welfare**.

  **The Test Case:**
  > "If the core justification is **Reciprocity**, then a corporation receiving a tax subsidy for 'job creation' should face the same sanctions as a welfare recipient if they fail to create the jobs. If the core justification is **Fiscal**, then the cost of policing corporate subsidy fraud should be weighed against the savings exactly as we weigh benefit fraud. Which principle applies here?"

  **Diagnosing the Response:**
  1.  **Ordinary Inconsistency:** "I hadn't thought about that. I guess I need to check if that applies." (Open to reflective equilibrium).
  2.  **Running the Structure:**
      *   *Shift to Contract:* "Corporations have legal contracts; welfare is a grant." (Reverts to Exceptionalism).
      *   *Shift to Utility:* "Corporate failure hurts the economy; individual failure doesn't." (Reverts to Fiscal/Utility).
      *   *Shift to Market:* "The market punishes them naturally." (Reverts to Non-State Mechanism).

  If they reject the parallel by invoking a *different register of justification* than the one they used for the poor (e.g., rejecting Reciprocity for corporations after demanding it for the poor), they are confirming the **Asymmetric Reciprocity** structure.

  ### Recommended Terminology for Your Analysis
  If you are writing on this, I recommend using a composite label to capture the nuance:
  > **"Discursive Oscillation within Asymmetric Reciprocity"**

  Or, if you prefer a rhetorical framing:
  > **"A Multi-Motte Defense of the Centaur State"**

  This signals that you recognize the argument is not merely inconsistent, but systematically structured to protect a specific policy outcome from both empirical (fiscal) and normative (moral) critique.

  ### Key References for Further Reading
  *   **Loïc Wacquant,** *Punishing the Poor: The Neoliberal Government of Social Insecurity* (for the Centaur State concept).
  *   **Wim van Oorschot,** "Making the difference in social Europe: Deservingness perceptions among citizens of European welfare states" (for CARIN criteria).
  *   **Stuart White,** "Freedom, Recognition, and the Duty to Work" (for the philosophical debate on reciprocity).
  *   **Nancy Fraser,** "Progressive Neoliberalism, Reactionary Populism, and the Prospects for a New Left" (for the fusion of emancipatory rhetoric with regressive policy).
  *   **Albert O. Hirschman,** *The Rhetoric of Reaction* (for the taxonomy of reactionary arguments: Futility, Perversity, Jeopardy). Your defender uses *Jeopardy* (fiscal risk) and *Perversity* (moral erosion) interchangeably.

