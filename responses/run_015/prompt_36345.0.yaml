          4.  Tie it to the Two Truths doctrine.
      *   **Tone:** Professional, accessible, intellectually rigorous but not overly technical Sanskrit jargon without explanation.

  2.  **Deconstruct the Core Philosophical Move:**
      *   *The Problem:* Humans have a cognitive habit of "substantialization" (reification). We hear "things lack inherent existence" and think, "Ah, so 'Lack-of-Inherent-Existence' is the *real* thing."
      *   *Nāgārjuna's Fix:* Emptiness is a predicate, not a subject. It's a description of how things function, not what they *are*. If you treat emptiness as a "thing," you've missed the point.
      *   *The "Sawing off the Branch" Objection:* If I say "All statements are false," is that statement false? If I say "Emptiness is empty," is that claim empty (i.e., useless)?
      *   *The Response:* Emptiness is therapeutic, not descriptive. It's a ladder to be kicked away (Wittgenstein comparison is often useful here).
      *   *Two Truths:* Conventional truth (how we navigate the world) vs. Ultimate truth (the lack of inherent nature). Emptiness bridges them; it doesn't destroy the conventional.

  3.  **Drafting - Section by Section:**

