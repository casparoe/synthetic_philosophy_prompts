      *   **Schrödinger's Cat:** A thought experiment illustrating the absurdity of the Copenhagen Interpretation of quantum mechanics when applied to macroscopic objects. A cat is in a superposition of alive and dead until observed. It concerns *ontological indeterminacy* (the state literally doesn't exist until measured) vs. *epistemic ignorance* (we just don't know).

