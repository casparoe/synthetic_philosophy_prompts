      *   *Application to Memory:* Public memory isn't a static record; it's shaped by past decisions. Removing a statue isn't just undoing an erection; it creates a new state that isn't the same as the pre-statue state. The "force" required to remove it (social unrest) is different from the force to erect it (colonial power).
      *   *Strengths:* Explains resistance to change, the permanence of the act, the lingering emotional charge (energy dissipation), and why "neutrality" is impossible after the fact.
      *   *Weaknesses:* Moral agency isn't magnetic domains. Humans deliberate; magnets don't. It risks implying inevitability rather than choice.

  3.  **Deconstruct Commemorative Ethics:**
