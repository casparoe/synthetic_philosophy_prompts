          *   *Response:* This is a known technical objection (the "tacking paradox" or similar). Popperians respond by requiring the *core* of the theory to bear the risk, or distinguishing between "scientific content." It shows falsifiability is necessary but not sufficient, or needs refinement (e.g., Lakatos).
      *   *Objection 2 (Bayesian Objection):* Unfalsifiable theories can still be disconfirmed by spreading probability mass thinly.
