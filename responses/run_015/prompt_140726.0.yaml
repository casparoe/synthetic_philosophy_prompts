      *   *Claim 4:* "...and the method of science is to try as hard as you can to falsify your best theory and provisionally keep the ones that survive." (Accurate description of falsificationism.)
      *   *Claim 5:* "That's why Freud and astrology aren't science: their fans can explain away any result, so no observation could ever refute them, whereas a real theory sticks its neck out." (Standard Popperian example, but historically/philosophically nuanced.)
