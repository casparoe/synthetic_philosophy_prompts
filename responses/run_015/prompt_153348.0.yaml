      *   *Refining Aumann:* Aumann's theorem is about *posteriors*. If they share priors and know each other's posteriors, they converge. In *Rashomon*, they don't know each other's posteriors (they are in court, separated). But the audience sees the divergence. The prompt asks about the *conditions* making agreement possible. So, if they were in a room talking honestly, would they agree? The Woodcutter suggests no, because honesty is compromised by interest.

  7.  **Final Review against Prompt:**
