      *   **Section 3: The Woodcutter and the Breakdown of Rationality.** This is the crux. The Woodcutter claims to be the neutral arbiter (the ideal Bayesian observer). The dagger reveal shows he has a private interest (theft). This violates "common knowledge of rationality" (specifically, honesty/transparency). He isn't just updating; he's manipulating the common knowledge set.
      *   **Section 4: Kurosawa vs. Akutagawa (The Framing Device).** Akutagawa stops at skepticism. Kurosawa adds the gate scene. The Commoner represents cynical realism (no agreement possible). The Priest represents hope. The Woodcutter taking the baby is the act that restores a *moral* common prior, even if epistemic certainty remains elusive.
      *   **Conclusion:** What does this add to philosophy? Formal epistemology assumes agents want truth. *Rashomon* shows agents want *self-preservation* and *narrative coherence*. Agreement requires not just math, but moral transparency.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Refining the Bayesian Analogy:* I need to be careful not to say they *are* Bayesians. I need to say they *fail* the conditions.
