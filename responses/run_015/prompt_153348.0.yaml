  3.  **Structuring the Argument:**

      *   **Introduction:** Set the stage. Define Aumann's theorem briefly. Introduce *Rashomon* not just as skepticism but as a test case for the *conditions* of agreement. Thesis: The film suggests disagreement persists not because convergence is logically impossible, but because the *preconditions* for Aumannian agreement (common priors, common knowledge of rationality, full disclosure of private info) are systematically violated by the construction of narrative identity.
      *   **Section 1: The Common Prior Assumption & Narrative Identity.** Analyze the three main testimonies (Bandit, Wife, Samurai). They aren't just lying; they are updating on different *values*. Their "priors" about honor and self are incompatible. Tajomaru (glory), Masago (victimhood/honor), Takehiro (shame/suicide).
