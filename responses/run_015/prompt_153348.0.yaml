      *   *Akutagawa's "Rashomon" (the story):* Need to mention the servant at the gate. This parallels the Commoner in the film. It grounds the epistemic problem in a materialist/survivalist ethic.
      *   *The "View from Nowhere":* The film argues there is no view from nowhere. Every view is from *somewhere* (interested). Aumann assumes a "view from nowhere" (objective probability space).
      *   *Philosophical Contribution:* Formal models treat priors as given. *Rashomon* asks where priors come from (culture, ego). It adds *motive* to *epistemology*.

