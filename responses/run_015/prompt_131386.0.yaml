answer: |-
  Here is the exam package designed for your roommate's seminar. It targets the specific conceptual confusions you mentioned (auxiliaries as magic wands, underdetermination as "anything goes") while respecting the 90-minute/25-mark constraints.

  ***

  # PHI 450: Advanced Philosophy of Science — Final Examination
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1: The Continuum/Grain Dilemma**

  Consider two competing cosmological frameworks: **Continuum** ($T_C$) and **Grain** ($T_G$).
  *   **$T_C$** posits that spacetime is fundamentally continuous.
  *   **$T_G$** posits that spacetime is discrete at the Planck scale, with macroscopic continuity emerging via statistical averaging.

  Stipulate that $T_C$ and $T_G$ generate identical predictions for every observable currently measurable or *foreseeably* measurable (including CMB anisotropies, gravitational-wave spectra, and black-hole shadow morphology). They are empirically equivalent by definition of the case.

  In an essay of approximately 750–900 words, address the following:
  1.  Does this scenario constitute a genuine instance of the **Quine-Duhem underdetermination thesis**, or is it merely a case of empirical equivalence? Explain the distinction.
  2.  Evaluate the role of **auxiliary hypotheses**. Given the stipulation that the equivalence holds for all *foreseeable* measurements, can the Quine-Duhem strategy of adjusting auxiliaries ever break the tie between $T_C$ and $T_G$?
  3.  What are the implications for **scientific realism**? If the metaphysical gap is permanently hidden from observation, must we suspend judgment on the ontology of spacetime, or do non-empirical virtues (e.g., simplicity, explanatory depth) license belief in one over the other?

  ***

  # Model Answer (Approx. 800 Words)

  The Continuum/Grain scenario presents a classic challenge to scientific rationality, but it requires careful dissection to avoid conflating distinct philosophical problems. To evaluate this, we must distinguish between empirical equivalence and epistemic parity, analyze the limits of the Quine-Duhem thesis, and assess the consequences for scientific realism.

  First, we must determine if this is genuine underdetermination. **Empirical equivalence (EE)** occurs when two theories entail the same observational evidence. **Epistemic parity (EP)** occurs when two theories are equally supported by that evidence, leaving rational agents with no reason to prefer one. The Quine-Duhem thesis suggests that because theories face the tribunal of experience only as a corporate body (alongside auxiliary hypotheses), we can always save a theory from refutation by adjusting auxiliaries. However, the Continuum/Grain case is stronger than standard Quine-Duhem underdetermination. Standard Q-D underdetermination is often local and temporary; we usually expect future data or better auxiliaries to break the tie. Here, the prompt stipulates equivalence for all *foreseeable* measurements. This moves the problem from local underdetermination to **global underdetermination**. It is a genuine underdetermination problem because it challenges the determination of theory by evidence *in principle*, not just in practice. However, recognizing EE does not automatically grant EP. Students of the "anything goes" variety often mistake the former for the latter. Just because evidence $E$ does not distinguish $T_C$ from $T_G$ does not mean $T_C$ and $T_G$ are equally rational choices.

  This leads to the role of auxiliary hypotheses. In a standard Q-D analysis, if a prediction fails, we can blame the auxiliary ($A$) rather than the core theory ($T$). Conversely, if we want to distinguish two theories, we often look for an auxiliary that interacts differently with each to produce divergent predictions. In the Continuum/Grain case, the stipulation blocks this move. If no foreseeable auxiliary—no matter how complex the experimental setup—yields divergent predictions, the Q-D strategy of "saving the phenomenon" via auxiliaries becomes inert regarding theory choice. We cannot adjust $A$ to make $T_C$ predict something $T_G$ does not, because the stipulation forbids it. Therefore, the tie cannot be broken *empirically*. This highlights a limitation of the Q-D thesis: while it explains how theories survive falsification, it does not guarantee that auxiliaries can always generate verification or differentiation. The auxiliaries here are not the saviors; they are part of the closed system that renders the theories indistinguishable.

  Finally, we must address scientific realism. If the metaphysical gap (continuous vs. discrete) is permanently hidden, does it matter? A strict **empiricist or instrumentalist** would argue that since observation cannot adjudicate the ontology, the difference is meaningless. We should treat spacetime models as tools for saving phenomena, not descriptions of reality. To commit to "Continuum" as truth would be metaphysical excess.

  However, a **scientific realist** might resist this agnosticism by appealing to non-empirical theoretical virtues. Even if $T_C$ and $T_G$ are empirically equivalent, they may not be theoretically equal. $T_C$ might be mathematically simpler or more coherent with General Relativity, while $T_G$ might offer better explanatory integration with Quantum Mechanics. If one theory provides a deeper explanation of *why* the observables are as they are (explanatory depth), realism licenses belief in that ontology despite the lack of direct empirical discrimination. Furthermore, this case motivates **Structural Realism**. If the observable structure of the world is identical under both frameworks, perhaps we should only be realists about the structural relations (the equations predicting the CMB) and agnostic about the intrinsic nature of the relata (spacetime points vs. grains).

  In conclusion, the Continuum/Grain case is a robust instance of global underdetermination because it precludes empirical resolution via auxiliaries. However, it does not force epistemic parity. Rational theory choice can proceed via non-empirical virtues, and scientific realism can be maintained either by committing to the theory with superior explanatory power or by retreating to a structural realism that captures the invariant empirical relations while suspending judgment on the hidden ontology. The metaphysical gap matters if ontology is the goal of science; it does not if prediction is the sole goal.

  ***

  # Marking Scheme & Rubric (25 Marks Total)

  ### Part 1: Underdetermination & Quine-Duhem (8 Marks)
  *   **7-8 Marks (A Level):** Clearly distinguishes **Empirical Equivalence (EE)** from **Epistemic Parity (EP)**. Identifies the scenario as **Global Underdetermination** (in principle) rather than Local (in practice). Explicitly notes that Q-D usually allows for future differentiation, but this case blocks it.
  *   **5-6 Marks (B Level):** Identifies EE correctly. Discusses Q-D thesis accurately but conflates EE with EP (suggests equivalence *forces* agnosticism). Treats the case as standard local underdetermination.
  *   **3-4 Marks (C Level):** Defines Q-D vaguely. Claims underdetermination means "scientists can pick whatever they like." Fails to distinguish between the theory and the auxiliaries.
  *   **0-2 Marks:** Fundamental misunderstanding of Q-D or the prompt.

  ### Part 2: Role of Auxiliaries (7 Marks)
  *   **6-7 Marks (A Level):** Locates exactly where auxiliaries enter the test (the link between core theory and observation). Explains *why* they fail to break the tie in this specific stipulated case (the "foreseeable measurement" block).
  *   **4-5 Marks (B Level):** States auxiliaries are involved. Argues auxiliaries *could* break the tie (ignoring the prompt's stipulation) OR says they can't without explaining why the stipulation matters.
  *   **2-3 Marks (C Level):** Treats auxiliaries as "extra evidence" rather than background assumptions. Claims auxiliaries are irrelevant to the core theory.
  *   **0-1 Marks:** No mention of auxiliaries.

  ### Part 3: Implications for Realism (7 Marks)
  *   **6-7 Marks (A Level):** Nuanced discussion. Mentions **Structural Realism** OR argues for **Inference to the Best Explanation (IBE)** via non-empirical virtues (simplicity/coherence). Distinguishes between ontology (what exists) and empirical adequacy (what predicts).
  *   **4-5 Marks (B Level):** Standard Realist vs. Anti-Realist argument. Claims we "can't know" (agnosticism) OR "must pick one" without justifying via non-empirical virtues.
  *   **2-3 Marks (C Level):** Claims realism is impossible if we can't see it. OR claims realism is fine because "one of them is true" (trivial truth).
  *   **0-1 Marks:** Irrelevant to realism.

  ### Part 4: Structure & Clarity (3 Marks)
  *   **3 Marks:** Logical flow, precise terminology, within word count.
  *   **2 Marks:** Readable but some terminological sloppiness.
  *   **1 Mark:** Disorganized or difficult to follow.

  ---

  ### Grade Differentiator (A vs. B)
  *To secure an **A (21+ marks)**, the essay MUST contain the following specific conceptual moves:*
  1.  **The EE $\neq$ EP Move:** Explicitly state that Empirical Equivalence does not automatically entail Epistemic Parity. (B answers usually assume EE forces a tie).
  2.  **The Stipulation Move:** Acknowledge that the "foreseeable measurement" constraint neutralizes the standard Q-D hope that new auxiliaries will eventually distinguish the theories.
  3.  **The Non-Empirical Move:** Argue that theory choice can rest on virtues *other* than observation (e.g., simplicity, unification) OR propose Structural Realism as a middle ground.

  ### Common Mistakes (Deductions)
  *   **The "Anything Goes" Error (-3 marks):** Claiming underdetermination means theory choice is purely subjective or political.
  *   **The "Theory-Ladenness" Conflation (-2 marks):** Confusing underdetermination (evidence doesn't decide) with theory-ladenness (observation is biased). These are different problems.
  *   **The "Auxiliary Magic" Error (-2 marks):** Arguing that we can just "invent an auxiliary" to solve the problem, ignoring the prompt's constraint that no foreseeable measurement distinguishes them.
  *   **The "Science Fiction" Dismissal (-5 marks):** Dismissing the prompt as unrealistic rather than engaging with the philosophical structure of the hypothetical. (Note: This addresses your friend's coffee comment—the point is the logic, not the physics).
