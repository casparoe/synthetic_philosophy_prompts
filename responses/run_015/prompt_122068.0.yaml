answer: |-
  Here is the prep sheet. I've sat in enough of these rooms to know the dynamic: the formalists will try to formalize you to death, the constructivists will try to dissolve your problem, and the Bayesian will sit silently until the end to ask for a likelihood function.

  ### Room Temperature & Strategy
  This room respects technical precision but smells blood when a normative claim isn't backed by a formal model. You are proposing a *normative* shift (Aptness > Outcome) based on a *structural* feature (Leakage).
  *   **Concede Early:** Concede that your "Aptness" looks structurally similar to equilibrium selection in FDT. Don't fight the resemblance; fight the *interpretation*. Concede that you don't have a full formal model yet (satisfies the Bayesian without lying).
  *   **Hold Firm:** Hold that idealization is not neutral. If the idealization removes the very feature (leakage) that constitutes the deliberative situation, the ideal is irrelevant to *deliberation*, even if relevant to *action*.
  *   **The Weakest Joint:** The move from "Deliberation leaks" (descriptive/causal) to "Therefore, norms are fixed by aptness" (normative). You are deriving an *ought* from a *feedback loop*. This is where the Constructivists will stab you.
  *   **The Dreaded Question:** It's not the Bayesian. It's not the Constructivist. It's the Lead Formalist asking: **"Isn't this just Functional Decision Theory (FDT) with extra steps? If FDT already selects the decision algorithm that maximizes utility given logical correlations, what work is 'Aptness' doing?"** If you can't distinguish your view from FDT, you have no paper.

  ---

  ### The 8 Objections (Ordered by Damage)

  #### 1. The FDT Redundancy (Lead Formalist)
  **Phrasing:** "You're describing a fixed point over decision procedures where the output affects the input via prediction. That's exactly what FDT does with logical counterfactuals. If your 'Apt Policy' diverges from the FDT-recommended algorithm, you're irrational. If it doesn't, you've just renamed FDT. What's the actual extensional difference?"
  **Reply (~90s):** "FDT asks 'Which algorithm outputs the best action?' My question is 'Which algorithm is stable to *instantiate*?' FDT treats the algorithm as a black box that determines the world. I'm treating the *process of running the box* as part of the world. In Newcomb, FDT says 'One-box.' I agree. But in cases where *calculating* the FDT solution triggers a predictor to punish you (e.g., 'punish agents who run complex simulations'), FDT says 'Calculate then Two-Box,' whereas Aptness says 'Don't Calculate.' FDT optimizes the output; Aptness optimizes the *occupancy* of the deliberative state. The extensional difference shows up in meta-deliberative costs."
  **Soft Spot:** If they press for a specific case where FDT output $\neq$ Apt policy, you need a concrete example ready (e.g., a "Parfit's Hitchhiker" variant where the predictor scans for *anxiety* about paying).

  #### 2. The Normative Force Challenge (Senior Formalist)
  **Phrasing:** "Okay, suppose Aptness diverges from Outcome-Maximization. You say I 'must not take up' the outcome-right procedure. Why? If I know deliberation X yields \$1M and deliberation Y yields \$1k, and you tell me Y is 'Apt,' aren't you just asking me to fetishize the procedure over the good?"
  **Reply (~90s):** "I'm not asking you to fetishize procedure. I'm claiming that in leakage-heavy environments, the 'Outcome-Right Procedure' is *unavailable* to you as a deliberator. You cannot genuinely deliberate 'I will do X' if the act of deliberating 'I will do X' causally precludes X. The 'ought' implies 'can.' If the leakage map makes the outcome-optimal policy unstable for the agent inhabiting it, then prescribing it is a category error. Aptness isn't a rival value to Good Outcomes; it's the feasibility constraint on deliberative access to them."
  **Soft Spot:** This sounds like a compatibility argument. If they argue you *can* commit to the outcome-right policy via pre-commitment, your "unavailable" claim weakens.

  #### 3. Equilibrium Multiplicity (Game Theorist)
  **Phrasing:** "Fixed points are rarely unique. In a leakage map, I can imagine multiple stable deliberative policies. One is 'Apt,' one is 'Stubborn.' Both are fixed points. Which one is normative? If you say 'the one with better outcomes,' you've collapsed back into direct normativity."
  **Reply (~90s):** "Correct, multiplicity is a feature, not a bug. When multiple fixed points exist, we need a selection criterion. I concede that *ex ante* outcome expectations break ties. But that doesn't collapse the view. The primary norm is stability (Aptness); outcome maximization is a tie-breaker, not the definition. Think of it like Nash Equilibrium vs. Payoff Dominance. We don't say Nash isn't real because we sometimes select the Pareto-superior equilibrium. Aptness defines the *set* of candidate norms; outcomes select within the set."
  **Soft Spot:** If the tie-breaker does all the work, Aptness becomes vacuous. Be ready to defend a case where the *worse* outcome fixed point is still mandatory.

  #### 4. The Constructivist Dissolution (Kantian 1)
  **Phrasing:** "You're treating norms as if they exist 'out there' to be matched by deliberation. But on constructivism, the authority of the norm comes from the agent's own practical identity. If your deliberation leaks, that's just part of the construction site. Why posit a second-order standard 'Aptness' rather than just saying the agent failed to construct a coherent will?"
  **Reply (~90s):** "I agree norms are constructed, but construction isn't unconstrained. You can't construct a bridge that defies gravity, and you can't construct a deliberative policy that defies its own causal footprint. 'Aptness' is just the name for the structural integrity of the construction. If you construct a policy that unravels upon inspection (leakage), you haven't failed morally; you've failed *architecturally*. My view is compatible with constructivism; it just insists that the 'materials' of construction include the causal effects of thinking."
  **Soft Spot:** They may argue that "structural integrity" is just another substantive value you're smuggling in, not a formal constraint.

  #### 5. The Bayesian Model Specification (The Statistician)
  **Phrasing:** "I haven't seen a likelihood function. How do I update on 'Leakage'? Is leakage a parameter $\lambda$? If 'Aptness' is a fixed point, is it a prior over policies? Without a loss function, I can't see how this generates a decision rule."
  **Reply (~90s):** "You're right that a full model would specify leakage as a transition probability $P(State_{t+1} | Deliberation_t)$. Currently, 'Aptness' is a qualitative constraint on that model: the policy $\pi$ must satisfy $\pi = \text{BestResponse}(\text{Leakage}(\pi))$. I'm not offering a new solver; I'm arguing that standard solvers assume $\text{Leakage}(\pi) = \emptyset$. If you want to model it, treat the cost of deliberation not as time $t$, but as information hazard $I$. The loss function remains utility, but the domain includes the deliberative trace."
  **Soft Spot:** They will nod but look unsatisfied. Don't try to derive equations live. Admit this is the next chapter.

  #### 6. Idealization as Baseline (Senior Formalist)
  **Phrasing:** "We idealize friction to understand motion. We idealize no-leakage to understand rationality. You're saying the friction *is* the motion. But don't we need the frictionless case to measure how far we've deviated? Otherwise, you have no baseline for 'error'."
  **Reply (~90s):** "In physics, friction is external to the object. In deliberation, leakage is internal to the *agency*. If I idealize away the agent's self-prediction, I haven't idealized the agent; I've replaced them with a calculator. My claim is that for *deliberative norms*, the frictionless case isn't a baseline; it's a different subject matter. It tells us about *choice*, not *deliberation*. We need both, but we shouldn't confuse the norms of the calculator with the norms of the thinker."
  **Soft Spot:** This risks conceding that your theory isn't about "Rationality" simpliciter, but a sub-species. Be careful not to marginalize your own thesis.

  #### 7. Dynamic Inconsistency (Decision Theorist)
  **Phrasing:** "Suppose the Apt Policy is 'Don't Calculate.' But midway through deliberation, I realize calculating would get me more money. Can't I just switch? If Aptness requires me to bind myself against my own future rationality, isn't it just self-binding?"
  **Reply (~90s):** "If you can switch midway without triggering the leakage penalty, then the original policy wasn't a fixed point. The definition of Aptness requires that *even knowing the policy*, you sustain it. If you abandon it when it gets tough, the leakage map changes, and you were never in an Apt equilibrium to begin with. It's not self-binding; it's recognizing that the 'you' that calculates is a different agent-state than the 'you' that acts. Aptness ensures continuity of agency across the deliberative timeline."
  **Soft Spot:** This leans heavily on a specific metaphysics of agency. If they reject the "different agent-state" claim, the fixed point dissolves.

  #### 8. Operationalization (General)
  **Phrasing:** "How do I know when I'm leaking? Most deliberation feels private. If I can't detect the leakage, I can't solve for the fixed point. This makes the norm action-guiding only in hindsight."
  **Reply (~90s):** "You don't need to detect specific leaks to adopt the policy. You adopt the *disposition* to be leak-aware. Just as I don't need to calculate air resistance to know I shouldn't jump without a parachute, I don't need to measure my cortisol levels to know that high-stakes calculation might signal weakness to a predictor. The norm is to treat deliberation as public by default. That heuristic is the operationalization of Aptness."
  **Soft Spot:** "Treat as public" is vague. They might press for when to *ignore* leakage (e.g., private diary).

  ---

  ### Final Advice for the Q&A
  *   **Watch the Clock:** You have 15 minutes. That is *three* deep questions or *eight* shallow ones. If the FDT guy starts talking, you must manage him. "That's the crux of the paper, can I come back to that after X asks their question?"
  *   **The Constructivists:** They won't try to break your math; they'll try to break your *authority*. If they say "Norms are constructed," reply "And leakage constrains construction." Keep it structural.
  *   **The Bayesian:** Do not bluff math. If you don't have the model, say "That is the formalization work for the next chapter. Philosophically, I'm arguing the variable *must* exist in the model."
  *   **Survival Mode:** If you get cornered on the "Why not just maximize?" (Objection 2), fall back on: **"Because in these cases, 'Maximize' is not an option you can pick. It's a mirage. Aptness is the map that shows the mirage."**

  Good luck. You've got a solid distinction, but keep your eye on the FDT overlap. That's where the room will live.
