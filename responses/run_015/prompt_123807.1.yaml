      *   *Articulation:* Thomson maps "right to remove" onto "right to end life" because in the analogy (and traditional pregnancy), they are identical. Partial ectogenesis decouples them.
      *   *The Hidden Assumption:* That the *only* way to end bodily intrusion is to end the life of the intruder. If the intruder can be moved elsewhere, the right to bodily integrity only justifies eviction, not execution.
      *   *Dependency Mapping:* We assume moral obligation tracks with *lethal* dependency. If dependency becomes *non-lethal* (transferable), the moral obligation shifts from "don't kill" to "don't abandon/duty to transfer."

