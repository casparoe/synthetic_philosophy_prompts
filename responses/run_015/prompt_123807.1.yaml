  2.  **Analyze Thomson's Violinist Analogy (Baseline):**

      *   *Premise:* You wake up plugged into a famous violinist who needs your kidneys for 9 months to survive.
      *   *Conclusion:* You have the right to unplug, even if it kills him.
      *   *Key Mechanism:* Bodily autonomy overrides the right to life *when that right requires the use of another's body*.
      *   *Implicit Assumption:* The dependency is total and physical. The "cost" is the use of the body.

  3.  **Analyze Partial Ectogenesis (The Shift):**

      *   *Scenario:* Mother carries for $X$ months, then transfers to an artificial womb (AW) for $Y$ months.
      *   *Implication:* The biological mother's bodily burden is finite and terminable *without* terminating the fetus's life (unlike the violinist, where unplugging = death).
      *   *Tension:* Thomson's argument justifies abortion *because* unplugging kills the violinist. If unplugging (transfer) doesn't kill, does the right to unplug still imply a right to kill? Or just a right to transfer?

  4.  **Address Core Question 1: Bodily Autonomy with Shared Burden:**

