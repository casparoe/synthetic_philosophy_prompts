      *   *The Shift:* FLO argument gains traction because the "future" is preserved.
      *   *Conceptual Tension:* Thomson tries to bypass the "right to life" status. But if the fetus survives, its "future-like-ours" is intact. The conflict moves from "Autonomy vs. Life" to "Autonomy vs. Parental Obligation to Facilitate Transfer."
      *   *Distribution:* The "future" isn't distributed morally; the *realization* of the future is. If the future exists in the AW, Marquis's objection to abortion (as killing) dissolves, but a new obligation might arise: the duty to ensure the future continues (i.e., transfer rather than abort).

  6.  **Address Core Question 3: Hidden Assumption of Continuous Dependency:**

