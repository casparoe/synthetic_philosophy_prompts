      *   **The Hole Argument (Einstein/Earman/Norton):** In GR, if you assume spacetime points have independent identity (haecceitism), diffeomorphism invariance leads to indeterminism. The metric field can be shifted over the manifold without changing physical observables, creating multiple futures from the same past.
      *   **Haecceitist vs. Structural Substantivalism:**
          *   *Haecceitist:* Point $p$ is $p$ regardless of what fields are there.
          *   *Structural:* Point $p$ is defined by its metric/field properties. If you swap properties, you swap points. This avoids the Hole Argument's indeterminism.
      *   **The Bucket Argument:** Newton's proof of absolute space via absolute rotation (concave water surface). Relies on inertial effects, not just relative motion.

