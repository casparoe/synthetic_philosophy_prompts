answer: |-
  You stand before two boxes, A and B. Box A is transparent and contains $10,000. Box B is opaque and contains either $1,000,000 or nothing, determined by a biological lock mechanism linked to your central nervous system. Twenty-four hours ago, a nanite swarm injected into your bloodstream settled into a configuration, State Z, which occurs in 50% of subjects. State Z physically locks $1,000,000 into Box B via a wireless signal sent at injection time; without State Z, Box B remains empty. State Z also alters dopamine receptor density, resulting in a 0.9 probability of selecting only Box B among carriers, while non-carriers select both boxes with 0.9 probability. You are aware of these statistics and the mechanism, but you do not know whether you currently harbor State Z. You must choose now to take only Box B or to take both Box A and Box B.

  **EDT Verdict: One-box.**
  **Reasoning:** EDT partitions states by the agent's choice, conditioning the probability of State Z on the action. P(Z | One-box) = 0.9, P(~Z | One-box) = 0.1. Expected Value(One-box) = (0.9 × $1,000,000) + (0.1 × $0) = $900,000. P(Z | Two-box) = 0.1, P(~Z | Two-box) = 0.9. Expected Value(Two-box) = (0.1 × $1,010,000) + (0.9 × $10,000) = $110,000. Since $900,000 > $110,000, EDT mandates taking only Box B.

  **CDT Verdict: Two-box.**
  **Reasoning:** CDT partitions states by the fixed past causes, treating the choice as an intervention independent of State Z. P(Z) = 0.5 regardless of action. Expected Value(One-box) = (0.5 × $1,000,000) + (0.5 × $0) = $500,000. Expected Value(Two-box) = (0.5 × $1,010,000) + (0.5 × $10,000) = $510,000. Since $510,000 > $500,000, and the choice cannot causally influence the past nanite configuration, CDT mandates taking both boxes.

  **Single Feature Preserving Validity:**
  The feature is the **endogenous integration** of the common cause (nanites altering receptor density within the decision architecture) rather than an exogenous pathology. This framing makes State Z feel constitutive of the agent's selection mechanism, preserving the intuition that aligning with the high-payoff type (One-box) is rational, whereas an exogenous cause feels like a fixed constraint you should work around.

  **Effect of Deleting Feature:**
  If State Z is described as an exogenous "brain lesion" or "tumor" unrelated to decision architecture (the Lesion Test variant), the intuition flips. The agent feels detached from the cause; the money is seen as fixed in the past, and the selection bias is viewed as a mere symptom. The EDT calculation remains mathematically identical, but the intuitive force collapses, making the CDT verdict (Two-box) feel obvious and the evidential correlation feel irrelevant to rational action.

  **Strongest CDT Attack:**
  "The case relies on a category error between evidence and control. By framing the nanite configuration as 'endogenous,' you invite the agent to treat their choice as a diagnostic tool that can influence the past state. However, rational agency is defined by causal leverage, not evidential correlation. Once the agent recognizes that the $1,000,000 is physically locked or not locked prior to the choice, any decision rule that sacrifices the guaranteed $10,000 (by One-boxing) to 'match' a past state is functionally identical to superstition. The EDT verdict only persists because the description obscures the temporal direction of causality, making the agent feel responsible for the nanite state rather than merely correlated with it."

  **Evaluation of Attack:**
  The attack lands on the causal logic but fails to displace the practical rationality of the EDT verdict in this specific design. While CDT is correct that the choice cannot *change* the past, the case successfully demonstrates that ignoring strong evidence about a fixed state (which determines 90% of the payoff variance) leads to systematically worse outcomes for the agent. The attack assumes that "rationality" requires causal leverage, but this case shows that in environments where your decision process is correlated with outcomes via common causes, maximizing expected utility requires acting on evidence even without causal power. The "superstition" charge fails because the correlation is physical and known, not magical; ignoring it is what becomes irrational.
