  **Verdict Prediction: Reject**

  **Reasoning:**
  The board is likely to reject the proposal because the sustained cost of 3.5 percent of GDP exceeds the implicit and explicit cost thresholds established in the precedents for long-term intergenerational safeguards. While Case 1 approved a climate plan, its cost was only 1.5 percent of GDP for a 120-year horizon. The new proposal more than doubles that cost burden while extending the timeline to 200 years. Crucially, Case 3 established a specific boundary condition: for "distant protection" (10,000 years), any burden exceeding 1 percent of GDP would be unjustified. Although 200 years is less distant than 10,000, it exceeds the 120-year horizon of Case 1 and approaches the 350-year "identity breakdown" horizon of Case 2. By demanding 3.5 percent—a figure significantly higher than the 1 percent warning in Case 3 and the 1.5 percent approval in Case 1—the proposal imposes a present sacrifice that the board’s precedents suggest is disproportionate to the reliability and identity-connection of beneficiaries two centuries hence. The 95 percent confidence helps, but it does not overcome the economic threshold logic that prioritizes present stability when costs become substantial.

  **Closest Analog:**
  **Case 3 (Deep-Geological Waste Containment).**
  While Case 1 shares the subject matter (climate), Case 3 provides the controlling *constraint* logic. Case 3 explicitly linked the permissibility of distant protection to a cost ceiling (1 percent). Since the new proposal (3.5 percent) breaches this ceiling, Case 3 is the stronger precedent for determining the *limits* of obligation, whereas Case 1 represents the lower-bound cost scenario.

  **Competing Principles:**

  1.  **Smoothly Decaying Epistemic-Horizon Function:**
      *   *Description:* Moral obligation is a continuous function of time, predictive reliability, and social identity connection. As time increases, epistemic uncertainty and identity discontinuity increase, smoothly reducing the weight of future welfare claims. Economic growth adjustments (Case 4) modulate this, but there are no hard time cliffs.
      *   *Commitment if Rejecting:* The board commits to a steep decay rate where the moral weight of lives 200 years in the future is sufficiently diminished that a 3.5 percent present cost is unjustifiable. It implies that even high confidence (95 percent) cannot fully offset the "identity distance" cost.
      *   *Commitment if Approving:* The board commits to a shallow decay rate, asserting that 200 years remains within a horizon of strong moral identity, and that high confidence allows for significant present sacrifice regardless of the cost percentage relative to Case 1.

  2.  **Two-Tier Lexical Threshold with Economic Adjustments:**
      *   *Description:* Obligations operate in two regimes. Tier 1 ("Foreseeable Future," e.g., <150 years) allows standard cost-benefit analysis (Case 1). Tier 2 ("Deep Future," e.g., >150 years) triggers a strict lexical cost cap (e.g., the 1 percent limit from Case 3) to prevent present-generation immiseration, regardless of the specific benefit magnitude, unless costs are trivial.
      *   *Commitment if Rejecting:* The board commits to classifying 200 years as Tier 2 ("Deep Future") and enforces the 1 percent cost cap strictly. It prioritizes the economic integrity of the present generation over distant optimization.
      *   *Commitment if Approving:* The board commits to classifying 200 years as Tier 1 or argues that "catastrophic prevention" creates a third emergency tier that overrides the cost cap. This would weaken the Case 3 constraint, suggesting cost caps are flexible based on the severity of the threat.

  **Distinguishing Further Case:**
  **A program costing 0.2 percent of GDP now to avert comparable harm in 600 years.**

  *   **Why it distinguishes them:**
      *   Under the **Two-Tier Lexical Threshold**, this case should be **Approved**. Since 600 years falls into Tier 2 ("Deep Future"), the governing rule is the Case 3 cost cap (1 percent). Because 0.2 percent is well below 1 percent, the project passes the lexical test, regardless of the extreme time distance.
      *   Under the **Smoothly Decaying Epistemic-Horizon Function**, this case is likely **Rejected**. Calibrating the decay curve to Case 2 (Reject 8 percent at 350 years) and Case 3 (Approve 0.05 percent at 10,000 years), the allowable cost at 600 years would likely fall significantly below 0.2 percent. The continuous decay of social identity and reliability at 600 years would render even a 0.2 percent cost disproportionate, whereas the Lexical model ignores the gradient between 150 years and 10,000 years as long as the cost cap is met.
