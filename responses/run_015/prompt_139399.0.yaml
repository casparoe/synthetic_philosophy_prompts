answer: |-
  ### The Diagnosis

  Your theory is correct. The fault line is **Individual vs. Steady-State Accounting**, which is a specific application of the **Non-Identity Problem** in ethics.

  Here is why the argument is stuck, and why Character C is actually the most philosophically precise person at the table, even if they are annoying about it.

  **1. The Fault Line: Replaceability**
  Character A (Vegan) is operating on a **Deontological/Individual Rights** model. To them, *this* mouse has a right to *its* life. Killing it is a harm to that specific subject, regardless of what happens to the population.
  Character B (Beef) is operating on a **Utilitarian/Systems** model. To them, the land has a "carrying capacity." If the land supports 100 voles, and 10 die per season to predation/harvest, the slot opens up and is filled by a new vole. Therefore, preventing *this* vole's death doesn't reduce the total death count of the system; it just swaps *which* vole occupies the slot.
  *   **A says:** "I saved this life."
  *   **B says:** "You just vacated a slot for a different life to end sooner."

  **2. Character C's Point (Marginal vs. Average)**
  This is not a deflection; it is the economic translation of your philosophical theory.
  *   **Average Hectare:** "How many mice die on a typical field vs. a typical pasture?" (This is the static accounting A and B are fighting over).
  *   **Marginal Hectare:** "If you put down your fork tonight, does the land use *actually change*?"
      *   If the pasture exists regardless of B's purchase, B is not causally responsible for the mice there.
      *   If the lentil field exists regardless of A's purchase, A is not causally responsible for the mice there.
      *   The only thing that matters is the *margin*: Does reduced demand convert pasture to crops, or crops to rewilded land?
      *   **Why it stalls:** C is right, but it kills the conversation. If the answer is "The market is too complex to know," then moral certainty is impossible. C is introducing **epistemic humility** into a fight about **moral purity**.

  **3. Why Nothing Moves**
  They are arguing **Math vs. Metaphysics**.
  *   A and B are trying to do math (counting deaths per calorie).
  *   But the variables are metaphysical (Is a wild life worth living? Is a replaced life a saved life?).
  *   You cannot solve a metaphysical disagreement with better data. A believes the *act* of killing is the sin. B believes the *state* of the ecosystem is the sin.

  ### What Would Move It
  To break the loop, you have to stop counting bodies and start defining **complicity**.
  The argument shifts when they stop asking *"How many died?"* and start asking *"What kind of death am I paying for?"*
  *   **The Distinction:** **Direct vs. Systemic Violence.**
      *   A pays for systemic violence (combine harvesters, habitat loss) that is invisible and deniable.
      *   B pays for direct violence (slaughter) that is visible and acknowledged.
  *   **The Measurement:** **Suffering Intensity vs. Duration.**
      *   Instead of counting *deaths*, count *minutes of fear*. A combine harvester kills in seconds. A hawk kills in minutes. A wolf in hours. Does the *quality* of the death outweigh the *quantity* of the dead?

  ### The Line

  The beef-eater needs to stop defending the cow and start attacking the vegan's accounting of the mouse. She needs to voice the "Steady-State" theory without using jargon. She needs to point out that the vegan is mourning a specific individual in a system that only cares about capacity.

  **"You're counting the dead like they're votes, but the field doesn't keep a ledger. It just holds a certain number of lives. You aren't saving the mouse; you're just vacating the slot for the one that dies next week."**

  *Why this works:* It hasn't been said because it's bleak. It admits the mouse dies (conceding A's point) but argues the death is inevitable due to population dynamics (asserting B's point). It shifts the moral weight from *prevention* to *delay*, which undermines the vegan's claim to purity.
