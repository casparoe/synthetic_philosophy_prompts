      *   Is the engineering lens too literal? Yes, software is deterministic (mostly). Brains are wet, noisy, and analog.
      *   *Conclusion:* The missing parts are likely features of the abstraction, not bugs in Dennett's theory. The engineering lens expects a "there" there, but Dennett says there isn't one.

  6.  **Evaluating the CRDT Analogy:**
