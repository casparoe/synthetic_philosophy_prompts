      *   *Verdict:* The trio works *if* the distinction between nociceptive detection and subjective feeling is sharply drawn. A single narrative scenario might be too anecdotal; the trio provides structural clarity for editors who think in systems.
      *   *Properties needed:* Clear behavioral markers (withdrawing vs. not withdrawing vs. smiling while withdrawing). Clear subjective reports ("I feel nothing" vs. "I feel it but don't care").
      *   *Properties to lack:* Ambiguity about tissue damage. All three must involve potential or actual tissue damage to keep the nociceptive context constant (except CIP where damage goes unnoticed). Actually, for CIP, damage happens without notice. For Asymbolia, damage happens with notice but no care. For Typical, damage happens with notice and care.
      *   *Recommendation:* The trio is superior to a single narrative for this specific audience (editors/writers) because it functions like a experimental design matrix.

