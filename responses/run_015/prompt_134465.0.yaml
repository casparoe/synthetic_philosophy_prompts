answer: |-
  Look, this is a really sharp pivot. Moving from descriptive reports ("I have a red qualia") to normative commitments ("This demands attention/is bad") is basically trying to solve the hard problem by changing the subject from metaphysics to pragmatics. It's similar to what some expressivists do in ethics, but applying it to phenomenology is tricky. The big worry you flagged—the hidden issue—is absolutely the pivot point. If you say "pain reports are normative," you still have to explain why physical brains make those specific normative moves at the right time. If normative *facts* are also causally inert, you haven't solved the exclusion problem; you've just kicked it down the road to the normative realm. If normative facts *do* cause things, you might have smuggled interactionism back in.

  Because of that hidden issue, your first year has to be meta-normative metaphysics. You can't build the language theory or the action theory until you know what kind of ontological weight these "normative commitments" carry. If normative facts turn out to be causally potent in a way that violates physical closure, your epiphenomenalist frame collapses. So, Question 1 is non-negotiable upstream work. Once you settle that (hopefully by arguing normative facts don't need causal power to be real, or that the *commitment* is physical even if the *norm* isn't), you can move to semantics. You need to define exactly what kind of speech act "This hurts" is. Is it pure expressivism (like "Ouch!") or is it a claim about reasons (like "You ought to help")? This dictates how you handle truth and correctness.

  Downstream from semantics is action theory. If the report is a normative commitment, how does a physical brain issue a commitment? Usually, we think of commitments as things agents *do*, not things neurons *fire*. You need a model of action that allows physical states to count as normative binders without requiring the consciousness to push them. Finally, you have to deal with correctness and authority. If I say "This hurts" and I'm wrong, what did I miss? If I can't be wrong, it's not a judgment, it's a reflex. If I can be wrong, how does an epiphenomenal consciousness validate the norm? This ordering is strict because if Q1 fails, Q2-5 are irrelevant. If Q2 fails (e.g., the semantics must be descriptive), Q3-5 need total redesign.

  Here is the breakdown of the five questions that deserve your time, ordered by dependency and risk.

  | Question | Why it's upstream/downsteam | Tractibility for solo work (2-3 yrs) | What result would change the ranking | Biggest risk if it's a dead end |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Do normative facts inherit causal exclusion?** | **Upstream:** If normative facts are causally potent, you lose epiphenomenalism. If they are inert, the paradox remains unless you explain the tracking. | **High:** Purely conceptual/armchair. Requires digging into meta-ethics and non-naturalist metaphysics. | If you find normative facts *must* cause physical events to be real, you must pivot to interactionism or eliminativism. | You spend 2 years building a normative theory that is metaphysically incompatible with physical closure. |
  | **2. What is the semantics of phenomenal avowals?** | **Upstream:** Determines whether you need truth-conditions (realism) or sincerity-conditions (expressivism). Dictates Q4. | **High:** Philosophy of language literature is vast but accessible. No lab needed. | If expressivism fails to capture the cognitive weight of pain reports, you must revert to descriptive semantics. | You build a language model that doesn't match how people actually use pain reports (e.g., embedding in conditionals). |
  | **3. How do physical states constitute normative commitments?** | **Midstream:** Bridges the metaphysics (Q1) and semantics (Q2) to action theory. Needs a model of "counting as" a commitment. | **Medium:** Requires synthesizing action theory with physicalism. Tricky but doable solo. | If you cannot explain how neurons "commit" without agent-causation, the bridge between mind and speech breaks. | The view collapses into behaviorism where the "normative" label is just decorative. |
  | **4. What are the correctness conditions for normative reports?** | **Downstream:** Depends on Q2. If reports aren't descriptive, what makes them "accurate" vs. "inappropriate"? | **High:** Conceptual analysis. Can be tested against intuition pumps and edge cases. | If correctness turns out to require causal contact with qualia, the epiphenomenalist solution fails. | You end up with a theory where all reports are "correct" by definition, making the practice trivial. |
  | **5. How is first-person authority preserved without causal access?** | **Downstream:** Depends on Q3 & Q4. Explains why *I* know my norms better than *you* without inner perception. | **Medium:** Requires careful distinction between authority and infallibility. | If authority requires causal monitoring, you must admit consciousness has some causal role. | You lose the asymmetry between first and third-person, making the view indistinguishable from heterophenomenology. |
