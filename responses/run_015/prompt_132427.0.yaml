answer: |-
  This is a sophisticated observation that cuts to the heart of a vulnerability within relational ontologies. You have identified a specific rhetorical and ontological manoeuvre that protects a relational theory from the empirical reality of exclusion by pathologising the excluded.

  To answer your identification question directly: there is no single, universally canonical term in either Ubuntu scholarship or mainstream recognition theory (Hegel, Honneth, Taylor) that captures this *exact* circular configuration. However, it is a recognised pathology. In African philosophy, it is often discussed under the rubric of the **"exclusionary risk of communitarianism"** or the **"problem of marginal cases"** within status-based personhood. In critical social theory, it overlaps with **"symbolic violence"** (Bourdieu) and **"ontological violence"** (Spivak/Fanek), but these are broader categories.

  Because the existing terminology describes the *harm* (social death) or the *error* (misrecognition) rather than the specific *argumentative structure* you have isolated, I will define this configuration precisely. I propose labelling this move **"Constitutive Retrojection"**.

  Below is the conceptual carving you requested, distinguishing this move from adjacent concepts, establishing its boundary conditions, and contrasting it with an honest relational view.

  ### 1. Differentiation from Adjacent Concepts

  To understand why "Constitutive Retrojection" is distinct, we must clear the conceptual space around it.

  **Versus Misrecognition (Honneth/Taylor):**
  Standard misrecognition theory posits that the subject *has* moral standing, but the community fails to acknowledge it. The error lies in the *gaze* of the recogniser. In Constitutive Retrojection, the speaker denies there is an error. They argue that because recognition is constitutive, the *absence* of recognition proves the *absence* of the capacity to be recognised. The fault is shifted from the observer's blindness to the observed's invisibility.

  **Versus Epistemic Injustice (Fricker):**
  Epistemic injustice concerns a deficit in knowledge or credibility (testimonial) or a lack of concepts to understand an experience (hermeneutical). Your observed pattern is ontological, not merely epistemic. It does not just claim "we cannot understand them"; it claims "they cannot *be* (fully) because they are not understood." It uses the epistemic gap to close the ontological door.

  **Versus Social Death (Patterson/Agamben):**
  "Social death" describes the *condition* of the excluded person (the loss of status, rights, and connection). It is a descriptive category of the victim's state. Constitutive Retrojection is the *justificatory logic* used by the excluser to explain that state. Social death says, "This person is dead to us." Constitutive Retrojection says, "This person is dead to us *because* they were never truly alive to relation."

  ### 2. Definition: Constitutive Retrojection

  **Constitutive Retrojection** is the argumentative move wherein the *contingent failure* of a community to recognise an individual is reinterpreted as *evidence* of that individual's antecedent incapacity for relation.

  It preserves the relational premise ("personhood requires community") while evading the relational obligation ("community must include the vulnerable"). It achieves this by treating the *effect* of exclusion (isolation) as the *cause* of exclusion (incapacity).

  ### 3. Boundary Conditions

  For an argument to qualify as Constitutive Retrojection, it must satisfy four specific conditions. If any are missing, it may be a different form of exclusion or an honest relational assessment.

  1.  **The Relational Premise:** The speaker must explicitly or implicitly affirm that moral standing or personhood is not intrinsic but is constituted through social recognition or participation. (If they believe personhood is intrinsic, they are simply an essentialist, not a corrupt relationalist).
  2.  **The Empirical Exclusion:** There must be an observable state of isolation, non-recognition, or marginalisation (e.g., solitary confinement, statelessness, institutionalisation).
  3.  **The Causal Inversion:** The speaker must attribute the cause of this exclusion to the *properties of the excluded* (e.g., "they cannot communicate," "they broke the bond," "they are unreachable") rather than the *refusal of the includer* (e.g., "we refuse to listen," "the walls prevent contact").
  4.  **The Normative Closure:** The conclusion must be that the exclusion is morally or ontologically justified. The lack of recognition is not treated as a tragedy to be remedied, but as a factual confirmation of the person's limited status.

  ### 4. Contrast with an Honest Relational View

  To sharpen the definition, we must distinguish Constitutive Retrojection from a rigorous, honest relational ontology (such as the idealised *Ubuntu* or *Botho*).

  **The Honest Relational View:**
  *   **Premise:** "A person is a person through other persons."
  *   **Observation:** "This individual is isolated."
  *   **Conclusion:** "The community has failed in its constitutive duty."
  *   **Obligation:** The community is morally required to extend recognition, even if it is difficult, to *make* the person. In this view, personhood is a *gift* bestowed by the community, particularly upon those who cannot claim it for themselves (infants, the disabled, the imprisoned). The burden of relation lies with the *stronger* party (the community).

  **Constitutive Retrojection:**
  *   **Premise:** "A person is a person through other persons."
  *   **Observation:** "This individual is isolated."
  *   **Conclusion:** "This individual lacks the capacity for personhood."
  *   **Obligation:** None. The burden of relation is implicitly placed on the *weaker* party (the individual), who is deemed to have failed the test of relationality.

  ### 5. Conceptual Naming and Structure

  The term **"Constitutive Retrojection"** captures the temporal and logical circularity of the move.
  *   **Constitutive:** It relies on the claim that relations constitute being.
  *   **Retrojection:** It projects the current state of affairs (exclusion) backward in time to posit a pre-existing condition (incapacity) that justifies the present.

  It creates a closed loop:
  1.  Personhood requires Recognition ($P \rightarrow R$).
  2.  There is no Recognition ($\neg R$).
  3.  Therefore, there is no Personhood ($\neg P$).
  4.  *Crucial Step:* The reason for $\neg R$ is explained as $\neg P$ (incapacity), rather than Community Refusal ($C_{refusal}$).

  This differs from simple victim-blaming because it is not merely moral; it is ontological. It does not say "you deserve this"; it says "you *are* this." It differs from essentialism because it claims to derive this essence from social facts, not biological ones, even though the result is indistinguishable from biological essentialism.

  ### 6. Context within Ubuntu Scholarship

  In the context of African philosophy, this move is often identified as a distortion of *Ubuntu*. Scholars like Mogobe Ramose and Dirk J. Snyman have noted the tension between personhood as a *given* (ontological) and personhood as an *achievement* (normative).

  Constitutive Retrojection exploits the "achievement" aspect to deny the "given" aspect. True *Ubuntu* ethics generally insists that the community bears the responsibility to maintain the humanity of the vulnerable (the principle of *survival of the community* depends on the inclusion of the weak). When a speaker uses relational language to exclude the vulnerable, they are engaging in what some critics call **"Communitarian Exclusionism"**. However, "Constitutive Retrojection" is the more precise philosophical label for the *logic* employed, regardless of whether the speaker claims an African or secular Western lineage.

  ### Summary

  You have identified a specific corruption of relational ethics. It is not merely misrecognition, nor is it standard social death. It is a defensive manoeuvre used by a community to protect its self-image as "relational" while practising exclusion. By defining it as **Constitutive Retrojection**, we capture its circular structure: it uses the absence of the constitutive element (relation) to prove the absence of the subject (person), thereby absolving the community of the duty to constitute.
