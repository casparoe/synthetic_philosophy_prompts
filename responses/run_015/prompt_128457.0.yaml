answer: |-
  Here is the 50-minute teaching arc designed to secure the distinction without relying on the standard regress formalism or the bicycle cliché.

  ### 0–5 Minutes: The Intellectualist Presupposition
  **Goal:** Establish the target before firing the arrow.
  Before the Knowing-How/Knowing-That distinction makes any sense, students must grasp the default assumption Ryle is attacking. Do not start with definitions. Start with the **Intellectualist Legend**.

  *   **Activity:** Ask the class: "When you see someone do something smart—solve a math problem, make a witty joke, play a complex song—what do you assume is happening in their head *before* they do it?"
  *   **Desired Output:** They will almost universally say "They are thinking about the rules," "They are recalling a theory," or "They are processing information."
  *   **Teaching Point:** Write this on the board: *Intelligent Action Requires Prior Internal Contemplation of Propositions.* This is the dependency idea. If they don't believe this is the default view, Ryle's distinction looks like a trivial categorization error rather than a philosophical correction.

  ### 5–20 Minutes: The Jazz Pianist (The Example)
  **Goal:** Land the example with enough density to resist reduction.
  Introduce the pianist. She is improvising over rapid chord changes (e.g., Giant Steps changes).
  *   **Detail 1 (No Naming):** She cannot name the chords as she plays them. If you pause her, she cannot state the proposition "I am now playing a D-flat major seventh."
  *   **Detail 2 (Embodied Error-Correction):** She learned this not by studying harmony books first, but by years of playing, hitting wrong notes, feeling the tension, and adjusting her hand shape until the tension resolved. The "rule" was never stated; it was felt as a physical correction.
  *   **Detail 3 (Real-Time):** The tempo is too fast for internal monologue. There is no time to consult a rule.

  ### 20–25 Minutes: The Distinction & Misconception 1
  **Goal:** Define the terms and head off the "Tacit Knowledge" objection.
  Draw the distinction: **Knowing-That** (propositional, verifiable true/false) vs. **Knowing-How** (dispositional, exhibited in performance).

  *   **Head Off Misconception 1 (KH = Fast/Tacit KT):**
      *   **The Student Objection:** "She just knows the rules so well she doesn't need to think about them. It's just internalized knowing-that."
      *   **The Intervention:** Stop here. Do not move to the twist yet. Ask: "Internalized *what* rules?" If she cannot name them, and if the skill was learned through physical error-correction rather than rule-absorption, there is no proposition to internalize.
      *   **The Point:** Knowing-how is not *hidden* knowing-that. It is a different category of state entirely. It is not that the proposition is unconscious; it is that the competence exists without the proposition ever having existed.

  ### 25–35 Minutes: The Non-Decomposability Twist
  **Goal:** Show that the skill cannot be broken into sub-routines.
  This is the core philosophical weight. Argue that her improvisation is not a sum of parts (Rule A + Rule B + Finger Movement C).

  *   **The Argument:** If the skill were decomposable, we could isolate the "harmonic rule" from the "motor execution." But in jazz improvisation, the harmonic intent *is* the finger movement. You cannot teach the "II-V-I turnaround" as a abstract rule and expect the jazz skill to appear. The skill is holistic; the context determines the movement.
  *   **Visual Aid:** Draw a circle labeled "The Skill." Try to draw arrows pointing to sub-components (Theory, Mechanics, Timing). Cross them out. Show that removing any element collapses the skill. The skill is not a chain of links; it is a single tensioned structure.

  ### 35–40 Minutes: Misconception 2
  **Goal:** Secure the validity of non-verbal understanding.
  Now that you've established the skill is real but non-propositional and non-decomposable, students will doubt its epistemic status.

  *   **Head Off Misconception 2 (No Verbalization = No Understanding):**
      *   **The Student Objection:** "If she can't explain *why* she played that note, she doesn't really understand the music. She's just a monkey hitting keys."
      *   **The Intervention:** Challenge the criterion of understanding. Ask: "If understanding requires verbalization, does a master pianist who speaks no English fail to understand Bach when playing it?"
      *   **The Point:** Understanding is demonstrated in the *success of the performance*, not in the ability to translate the performance into text. To demand verbalization is to demand Knowing-That as a prerequisite for Knowing-How, which returns us to the Intellectualist Legend we rejected in minute 5.

  ### 40–45 Minutes: The Omission
  **Goal:** Manage expectations on rigor vs. intuition.
  You must openly state what you are leaving out to maintain intellectual honesty.

  *   **Say So:** "I am deliberately leaving out Ryle's full **Regress Argument**. The formal logic argues that if Knowing-How required Knowing-That, we would need an infinite chain of prior contemplations to act. We are skipping the formal proof today to focus on the phenomenology of the skill itself. Know that the logical backup exists, but our evidence today is the structure of the skill, not the logic of the regress."

  ### 45–50 Minutes: The Check Question
  **Goal:** Verify grasp of non-decomposability.
  Do not ask "What is the difference between KH and KT?" That invites parroting. Ask a question that forces them to apply the non-decomposability constraint.

  *   **The Question:** "If we could successfully isolate the exact motor rule for the pianist's left hand and teach it to a beginner as a standalone explicit instruction, would that beginner possess the same knowing-how as the pianist? Why or why not?"
  *   **Correct Grasp:** They should answer **No**. They must articulate that the skill fails because the motor rule cannot be separated from the holistic context (the harmony, the timing, the error-correction history). If they say "Yes, but they need practice," they have missed the non-decomposability point and reverted to the "Tacit KT" model.
