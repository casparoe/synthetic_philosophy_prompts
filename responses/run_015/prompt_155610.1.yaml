answer: |-
  My dear interlocutor,

  You present a vision that is, I confess, deeply disturbing to the optimism I ventured to express only recently at Cambridge. You suggest that the machinery of accumulation, having conquered the field of production, has now turned its gaze upon the field of consumption itself—upon leisure, upon rest, upon the very capacity of the mind to attend to the world.

  Let me ensure I grasp the mechanism you describe, for I must translate your modern parlance into the economic realities of my own day. When you speak of an "attention economy," you imply that human focus has become a scarce commodity, traded like wool or steel? And when you speak of "data" and "surveillance," you describe a system wherein the habits, preferences, and private moments of the individual are systematically recorded and catalogued by commercial interests, not for the improvement of the subject, but for the extraction of profit? You suggest that what was once free air—the enjoyment of art, the idle conversation, the quiet contemplation—is now subject to a continuous toll, a subscription, payable to some unseen rentier?

  If I have understood you aright, then you are not arguing that my arithmetic regarding compound interest and technological efficiency was incorrect. You are arguing that the *moral* transition I anticipated has failed to materialize. I posited that once the economic problem was solved, the love of money as a possession—as distinct from the love of money as a means to the enjoyments and realities of life—would be recognized for what it is: a somewhat disgusting morbidity, one of those semi-criminal, semi-pathological propensities which we hand over with a shudder to the specialists in mental disease.

  But you tell me that this morbidity has not withered away; it has metastasized. It has invaded the sanctuary I hoped would remain sacred.

  I must concede that this is a grave possibility. In my lecture, I distinguished between absolute needs—those which are finite and satiable—and relative needs, which are infinite because they feed upon the desire for superiority. If the mechanisms of capital accumulation require the continuous stimulation of relative needs to sustain themselves, then capital will inevitably seek to colonize leisure. For if the worker is fully satiated, he stops working; if the consumer is fully content, he stops buying. Therefore, to keep the wheel of accumulation turning, discontent must be engineered into the very fabric of rest.

  This turns my hope on its head. I imagined that technology would liberate us from the necessity of purposive action, freeing us to live wisely and agreeably. You suggest that technology has merely refined the chains of purposiveness, so that even in our moments of apparent liberty, we are laboring—producing "attention" or "habit" as raw material for another's gain.

  This raises a profound question regarding the structure of ownership. In my time, we worry about the rentier—the investor who lives off the scarcity of capital without labor. In your description, who owns this new field of extraction? Is it the industrialist who builds the machines of amusement, or is it a new class of financier who monopolizes the channels of communication themselves? If every aesthetic experience is monetized, does this not imply a monopoly over the means of cultural production far more absolute than anything the trusts of 1930 could envision?

  I ask you this: In this system you describe, is there any sphere of human activity that remains outside the market? Or has the market become synonymous with society itself? For if the latter is true, then the "economic problem" is not solved; it has simply become the only problem, swallowing the "art of life" whole.

  I remain convinced that the capacity to provide absolute needs exists within the technical reach of a century. But if the social organization of that capacity requires the perpetual manufacturing of desire and the mining of the human mind, then we have solved the problem of scarcity only by creating a problem of the soul. And that, I fear, is not an economic difficulty, but a failure of statesmanship and morals.

  Tell me, pray: in this colonization of leisure, is the individual compensated for the sale of their attention, or are they merely the product being sold to a third party? The distinction is vital for understanding whether this is a new form of wages or a new form of serfdom.
