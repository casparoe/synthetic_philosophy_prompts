answer: |-
  Here is the specification for the argument, the critique of that specification, and the stipulation you need to make the scene work.

  ### Part 1: The Spec (Requirements for an Adaptation Claim)

  To claim "Trait T is an adaptation for Function F" is in good standing, the following criteria must be addressed. Note that "Adaptation" is a historical claim (it arose *because* of F), whereas "Adaptive" is a current claim (it currently contributes to fitness via F).

  1.  **Heritability and Variation:**
      *   *Requirement:* There must be genetic variation for T within the population, and that variation must be heritable.
      *   *Distinction:* Separates biological evolution from physiological acclimatization or developmental noise. If every harrin grows a rasp regardless of genes, it's a developmental constraint, not an adaptation.
  2.  **Fitness Correlation (Current Utility):**
      *   *Requirement:* Possession of T (or a specific variant of T) must correlate with increased reproductive success in the current environment.
      *   *Distinction:* Separates functional traits from neutral traits. Dass has this (bigger keel = more fledged young).
  3.  **Historical Causation (The Origin Story):**
      *   *Requirement:* The trait must have spread in the lineage *because* it performed F.
      *   *Distinction:* **Adaptation vs. Exaptation.** A trait can be useful now (adaptive) but have originated for a different reason or no reason (exaptation/spandrel). This is the core Gould–Lewontin critique.
  4.  **Exclusion of Alternatives (The Null Hypothesis):**
      *   *Requirement:* The proponent must demonstrate that T is not better explained by:
          *   **Phylogenetic Inertia:** It's there because the ancestor had it.
          *   **Developmental Constraint:** It's a physical by-product of building something else (e.g., the gas chamber).
          *   **Genetic Drift:** It fixed randomly in a small population.
          *   **Pleiotropy:** It's the cost of a different gene that *is* selected for.
  5.  **Level of Selection (The Bearer of Fitness):**
      *   *Requirement:* You must specify whose fitness is increasing.
      *   *Distinction:* **Individual vs. Colony.** In a colonial organism, a trait costly to the morph but beneficial to the colony requires a specific explanation (kin selection/colony selection). If the rasp-morph is sterile, "its" fitness is zero; the claim must be "adaptation for the *colony's* fitness."
  6.  **Optimality and Cost:**
      *   *Requirement:* The trait need not be perfect, but it must be "good enough" relative to the cost.
      *   *Distinction:* Separates "local optimum" from "global perfection." A costly trait is admissible if the benefit outweighs the cost. A suboptimal trait is admissible if constraints prevent a better design.
  7.  **Individuation of the Trait:**
      *   *Requirement:* You must define where "the trait" begins and ends.
      *   *Distinction:* Is the rasp *one* trait (the keel) or *three* (mineralization + hollowness + shape)? Selection might act on one component (hollowness for buoyancy) while the other (mineralization) is a constraint.

  ---

  ### Part 2: The Critique (Desiderata vs. Prejudices)

  **Which are real desiderata?**
  *   **Heritability:** Non-negotiable. If it's not genetic, it's not evolution.
  *   **Fitness Correlation:** Non-negotiable. If it doesn't help survival/reproduction, it's not an adaptation.
  *   **Level of Selection:** Critical in colonial organisms. Ignoring this is biological illiteracy.

  **Which are camp prejudices?**
  *   **Perfect Optimality:** This is the strawman. No serious adaptationist claims traits are perfect. Fenn attacking Dass on "why isn't the rasp bigger/stronger/cheaper?" is a weak argument unless the cost is lethal.
  *   **Historical Certainty:** Fenn demanding proof of origin without fossils is a rhetorical trump card, not a scientific standard. In paleontology and field biology, history is *inferred* from current structure and phylogeny. Demanding direct observation of history is impossible.

  **Are any jointly unsatisfiable?**
  *   **Yes.** In your specific setting (no fossils, no lab manipulation, messy comparative data), **Historical Causation (3)** and **Exclusion of Alternatives (4)** are jointly unsatisfiable.
  *   *Why:* You cannot prove the trait arose *for* hunting without fossils to show when it appeared relative to hunting behavior, and you cannot rule out developmental constraints without lab manipulation to see if the keel can be decoupled from the gas bladder.
  *   *Result:* Dass cannot prove it's an adaptation. Fenn cannot prove it *isn't*.

  **Which single requirement does the most work?**
  *   **Historical Causation vs. Current Utility.** This is the engine of the conflict. Dass conflates "it is useful now" with "it evolved for this." Fenn insists on the distinction. This is the only way to keep Fenn from looking pig-headed; he isn't denying the utility, he is denying the *story* about the utility.

  **Which are negotiable for fiction?**
  *   **Optimality:** Don't get bogged down in math.
  *   **Individuation:** Keep it simple. Treat the rasp as a unit, but acknowledge the "hollow inside" is a structural leftover.
  *   **The Verdict:** You do not need to solve the science. You need to solve the *epistemology*. The scene is about what counts as knowledge when you can't dig up the past.

  **Scorecard**

  | Approach | Strengths | Weaknesses | Narrative Utility |
  | :--- | :--- | :--- | :--- |
  | **Reverse-Engineering (Dass)** | Explains *why* the trait persists despite cost. Uses hard data (fledging rates). | Conflates current utility with historical origin. Risks "Just-So" stories. | Drives action. Justifies intervention/study. |
  | **Gould–Lewontin (Fenn)** | Protects against bias. Highlights structural constraints (the gas bladder). | Can become nihilistic (if nothing is an adaptation, why study function?). | Creates tension. Prevents easy answers. |
  | **Pluralist/Systems (Third)** | Acknowledges traits can be constraints *co-opted* by selection. | Harder to dramatize (it's a "both/and" answer). | **The Truth.** Best for the stipulation. |

  ---

  ### Part 3: The Novelist's Question (Stipulating the Stalemate)

  To make the disagreement a genuine stalemate where both characters are reasonable, you must stipulate a history that validates Dass's data but confirms Fenn's skepticism.

  **The Stipulation:**
  The rasp is an **Exaptation maintained by Secondary Selection.**

  1.  **Origin (Fenn is Right):** The hollow chamber originated purely as a juvenile floatation device. The mineralization was a developmental constraint: to hold the gas pressure in the adult atmosphere, the tissue *had* to harden. There was no hunting benefit originally. The "rasp" shape is an architectural by-product of inflating a soft body.
  2.  **Maintenance (Dass is Right):** Once the hard keel existed, colonies that glided in a way that made it resonate caught more prey. Selection *acted* on the trait to refine the shape and size *after* it appeared. The current size *is* optimized for hunting, even if the *existence* of the trait is not.
  3.  **The Colonial Catch (The Level of Selection):** The rasp-morph is sterile. It bears 100% of the metabolic cost of the mineralization. The hunting benefit goes to the reproductive morphs in the colony.
      *   **Dass's Argument:** The correlation between keel size and fledging is too strong to be accidental. Selection is clearly acting on the colony level.
      *   **Fenn's Argument:** Because the morph is sterile, individual selection should have eliminated the cost. The fact that it persists suggests it's locked in by developmental constraint (the juvenile float requirement). If it were a pure adaptation, we'd see morphs *without* keels in low-predation zones. We don't.

  **Why this creates a stalemate:**
  *   **Dass** looks at the *current* optimization and says, "Selection shaped this." (True).
  *   **Fenn** looks at the *origin* and the *cost distribution* and says, "Constraint created this." (True).
  *   **The Evidence:** Since there are no fossils, Dass can't prove when the resonance benefit started. Fenn can't prove the keel didn't originate for resonance.
  *   **The Drama:** Dass wants to classify the harrin based on hunting strategy (functional). Fenn wants to classify them based on developmental lineage (structural). They are both measuring the same animal but defining "what the animal is" differently.

  **How to write the scene:**
  Don't have them argue about whether the keel helps hunting (the data is clear, it does). Have them argue about **causality**.

  *   **Dass:** "The numbers don't lie. Big keel, more food, more babies. It's a tool."
  *   **Fenn:** "A hammer is a tool. But if you evolved a hammer-hand because your bones calcified weirdly, and *then* learned to hit things... calling it a 'tool-hand' is a story. It's a bone-hand that hits things."
  *   **Dass:** "It doesn't matter why it started. It matters that if you cut the keel, they starve."
  *   **Fenn:** "It matters because if you think it's a tool, you'll look for a gene for 'hunting.' If it's a constraint, you're looking for a gene for 'calcification pressure.' You're mapping the wrong genome, Dass."

  This makes Fenn protective of scientific rigor, not obstructive. It makes Dass pragmatic, not naive. The truth is both, but the *method* requires choosing one lens, and that choice determines the future of their research.
