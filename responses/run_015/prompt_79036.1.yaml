answer: |-
  **Exam Question**

  **1.** Hyperbolic discounting is frequently proposed as a naturalistic explanation of akrasia. Using the distinction between *structural* akrasia (time-inconsistent preferences) and *executive* akrasia (action against a stable, current ranking), argue whether hyperbolic discounting genuinely explains weakness of will or merely redefines it away. In your answer, assess the proposal that the akratic agent discounts not future goods, but her own future judgements. Does this salvage executive akrasia, and at what theoretical cost? You must commit to a position on whether the 'time-slice' model of agency is compatible with genuine executive failure. (30 marks)

  ***

  **Model Answer**

  Hyperbolic discounting (HD) models agents as having steeper discount rates for near-future delays than far-future ones. This generates preference reversals: at $t_1$, I prefer a larger-later reward (health) to a smaller-sooner one (cake); at $t_2$, proximate to the cake, the ranking flips. To evaluate whether this explains akrasia, we must distinguish structural from executive failure.

  Structural akrasia is defined by diachronic inconsistency. The agent at $t_1$ ranks A > B, but the agent at $t_2$ ranks B > A. HD explains this perfectly. It describes a mechanism where the 'will' is simply the output of a fluctuating discount function. There is no single ranking violated across time, only a succession of different rankings. If akrasia is merely acting against a *past* intention, HD suffices. However, this reduces weakness of will to a coordination problem between temporal selves, not a failure of rationality within a self.

  Executive akrasia is more demanding. It requires that at the moment of action ($t_2$), the agent judges A > B all-things-considered, yet chooses B. HD struggles here. If the discount rate shifts at $t_2$, then at $t_2$, the agent genuinely prefers B. To say she 'should' have chosen A is to appeal to the $t_1$ ranking, which no longer holds authority for the $t_2$ agent. Consequently, modelling the agent as a run of time-slices with independent preference sets does not explain executive akrasia; it eliminates it. If every slice acts on its own maximal preference, no slice acts akratically. The 'weakness' vanishes because the unified agent required to *be* weak is disaggregated.

  Proponents might rescue the HD model by suggesting the agent discounts not future goods, but future *judgements*. On this view, at $t_2$, I still judge that health is better, but I discount the authority of that judgement because I anticipate my $t_3$ self will regret it, or I distrust my $t_2$ evaluation as 'hot'. This attempts to locate the conflict within the current slice: I judge A is best, but I discount the motivational force of that judgement based on a meta-evaluation of my future epistemic state.

  Does this salvage executive akrasia? Only partially. It restores a conflict at $t_2$, but it risks collapsing back into structural inconsistency. If I discount my current judgement because I distrust my future self's validation of it, am I not simply prioritizing a different good (e.g., 'avoiding future regret' or 'immediate certainty')? If the all-things-considered judgement includes the discounting of the judgement itself, then acting on the discount is acting on the judgement. To maintain genuine executive akrasia, the judgement must remain normative despite the discount.

  The theoretical cost of the 'future judgements' move is high. It fragments the agent's rationality. If I can discount my own judgements based on anticipated shifts, the normative force of any current judgement becomes contingent on a higher-order discount rate. This leads to an infinite regress: do I also discount the discount rate? Furthermore, it concedes that the 'will' is not a capacity to act on judgement, but a market value assigned to judgements over time.

  I conclude that HD explains structural akrasia but explains away executive akrasia. The time-slice model is incompatible with genuine executive failure because it removes the synchronic conflict required for weakness. The 'discounting judgements' hypothesis is a redescription that masks this elimination. It treats the violation of a normative judgement as just another preference trade-off. To save executive akrasia, we must reject the pure time-slice model and posit a synchronic capacity to act against current preference—a capacity HD cannot capture without ceasing to be merely a discount function. HD describes the *pattern* of failure, but not the *failure* itself.

  ***

  **Marking Scheme (30 Marks)**

  **1. Accurate definition and application of the Structural/Executive distinction.**
  *   **6 Marks:** Clearly defines Structural (diachronic inconsistency) vs. Executive (synchronic violation of current ranking) and uses this as the framework for the essay.
  *   **Weak Answer Note:** Conflates the two or treats them as synonymous temporal delays.

  **2. Analysis of HD's fit with Structural Akrasia.**
  *   **6 Marks:** Acknowledges HD successfully models preference reversals over time (Structural) but notes this reduces akrasia to inconsistency rather than normative failure.
  *   **Weak Answer Note:** Claims HD explains structural akrasia without noting the reductionist implication (that no single self is violated).

  **3. Argument that the time-slice model eliminates Executive Akrasia.**
  *   **6 Marks:** Argues that if preferences shift with the discount rate, the $t_2$ agent acts on their current max, meaning no executive failure occurs within the slice.
  *   **Weak Answer Note:** Asserts HD explains executive akrasia simply because the agent 'changes their mind' (missing the synchronic requirement).

  **4. Critical evaluation of the 'Discounting Future Judgements' hypothesis.**
  *   **6 Marks:** Assesses whether this move restores synchronic conflict or merely relocates the preference (e.g., valuing 'certainty' over 'truth').
  *   **Weak Answer Note:** Accepts the hypothesis as a solution without analyzing whether it dissolves the normative conflict it aims to save.

  **5. Identification of the theoretical cost and a committed conclusion.**
  *   **6 Marks:** Identifies costs (fragmentation, regress, or loss of normativity) and commits to a stance on whether HD is compatible with executive akrasia.
  *   **Weak Answer Note:** Sits on the fence ("both sides have merit") or fails to identify a specific cost to the agency model.
