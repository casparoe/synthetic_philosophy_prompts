  Your policy rests on a hybrid theory: commemoration as a speech act bound by contract and constrained by epistemic fairness. It is neither purely deontological nor consequentialist. Clauses (1) and (2) strictly presuppose that moral blame requires epistemic access. You cannot be faulted for failing to know what was unknowable. This makes blameworthiness comparative regarding knowledge, not virtue. It sits comfortably with the view that honor is contrastive; we honor people to signal institutional values, not to canonize sainthood. If we honor someone who acted badly when contemporaries warned them against it, we signal that we ignore moral warnings. If we honor someone who held universal prejudices, we signal nothing except history.

  Regarding consistency: beliefs cause acts, but the policy pragmatically separates them to avoid judging historical figures by standards inaccessible to them. It treats honor as revocable only for moral negligence, not moral error. This is coherent if blame is backward-looking (what could you know?) while honor is forward-looking (what do we signal?). The policy assumes we can distinguish internal states coerced by culture from external choices where agency persists.

  Clause (3) is not merely money talking; it is institutional integrity. Steelmanated, it treats the name as a property right transferred via bequest. Renaming violates *pacta sunt servanda*. If the university breaks contracts when moral winds shift, it destroys the trust required for future philanthropy. It presupposes that some speech acts are frozen by agreement, distinguishing donated names (contractual) from chosen names (expressive). Clause (4) complements this by arguing that speech acts can lapse. If a name becomes purely referential ("meet me at Jefferson"), the honorific function has died. The policy assumes commemoration requires an audience that recognizes the honor. Without recognition, there is no endorsement to revoke. This treats names as living language, not static labels.

  A rival "honor as lease" theory treats commemoration as purely consequentialist. Names are retained only while net social utility is positive. This requires periodic review, as you noted. It presupposes that the past has no claim on the present except through current utility. Your policy, conversely, presumes the past has a claim (via contract or historical context) unless specific defeaters (negligence, lapse) apply. The lease view commits you to constant moral auditing; your policy commits you to stability unless thresholds are breached.

  Where are you underdetermined? Both theories might retain a Churchill lecture if attendees view it as mere branding (clause 4) or if the utility remains high (lease). Both might drop a Columbus fund if contemporaries condemned his violence (clause 1) or if current pain outweighs history (lease). Your disagreements aren't about outcomes but about *why* the outcome binds you. The policy hides a tension between honoring the dead (contract) and speaking to the living (function). You are trying to balance fidelity to past agreements with fidelity to current moral knowledge. The policy works only if you accept that some names are property, some are speech, and some are just geography. If you cannot distinguish those categories, the theory collapses. You must decide if you are curating history or managing assets.
