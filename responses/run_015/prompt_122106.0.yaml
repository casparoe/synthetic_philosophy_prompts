      *   *Crucial Point:* **Corrigibility.** An intent-aligned system allows itself to be corrected if it misunderstood the underspecified parameters. A value-aligned system might resist correction if it thinks it knows the "True Good" better than the user. This is the practical relief.

  9.  **Final Structure:**
