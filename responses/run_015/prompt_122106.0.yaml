      *   *Value Alignment* usually means the AI *internalizes* or *optimizes for* the human's terminal values (what is good/bad in itself).
      *   *Intent Alignment* means the AI *optimizes for* the human's instructions/goals (what the human asked for).
      *   The argument claims that to optimize the instruction, you must optimize the values hidden in the gaps.
      *   *Counter-argument:* You can approximate the user's values in the gaps *instrumentally* without *sharing* them. The AI doesn't need to *care* about safety; it just needs to *predict* that the user cares about safety and act accordingly to satisfy the intent.
