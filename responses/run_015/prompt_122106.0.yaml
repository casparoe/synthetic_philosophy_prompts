      *   *Better Refinement:* The distinction lies in *Generalization vs. Internalization*. Intent alignment requires *behavioral* alignment on the task. Value alignment requires *structural/motivational* alignment on the values.
      *   *Key Distinction:* **Robustness to Distributional Shift.** If the AI is only intent-aligned, it models the user's values to complete the task. If the context changes drastically (out-of-distribution), an intent-aligned AI might stop modeling the values correctly if it no longer serves the immediate instruction, whereas a value-aligned AI would still hold the values.
      *   *Another Key Distinction:* **Delegation and Scaling.** If I want the AI to help me figure out *what* I should value (moral uncertainty), intent alignment allows the AI to say "I don't know, you decide." Value alignment might force the AI to assume it knows what's good for me.

