answer: |-
  # The Negative-Leaning Sorting Instrument

  **Instructions:** Start at **Node 1**. Answer the concrete case as your intuition dictates (don't worry about consistency yet). Follow the arrow to the next Node or to a **Leaf**. If you land on a Leaf, stop. If you hit a "Dead End," note why.

  ### The Branching Questions (Nodes)

  **Node 1: The Happy Child (Creation & Asymmetry)**
  You can conceive a child who will certainly have a life containing 100 units of happiness and 10 units of suffering (Net +90). If you don't, no one exists.
  *   **A:** Creating this life is **morally good** (a gain in value). → *Go to Node 2*
  *   **B:** Creating this life is **neutral/permissible** (no gain, no loss). → *Go to Node 3*
  *   **C:** Creating this life is **morally bad** (a net negative or violation). → *Go to Node 4*

  **Node 2: The Torture Tickles (Trade-off: Positive-Leaning Path)**
  To prevent one person from 50 years of extreme torture (-10,000 units), you can cancel a festival causing 1 million people to miss out on mild pleasure (+1 unit each).
  *   **A:** Cancel the festival. Suffering outweighs the aggregate happiness. → **Leaf 1**
  *   **B:** Run the festival. Aggregate happiness outweighs the torture. → **Leaf 2**

  **Node 3: The Shrimp Lottery (Trade-off & Scope: Neutral-Creation Path)**
  A fire traps either (1) One Human (suffering -500) or (2) One Billion Shrimp (suffering -1 each). Shrimp sentience is 10% probable. Expected suffering is equal (-500).
  *   **A:** Save the Shrimp (Maximize Expected Value). → *Go to Node 5*
  *   **B:** Save the Human (Discount Uncertainty/Species Weighting). → *Go to Node 6*

  **Node 4: The Antinatalist Hardline (Negative-Creation Path)**
  You have a button that painlessly prevents the birth of 1,000 future people who would have had net-positive lives (+50 each).
  *   **A:** Pressing is **good/required** (Non-existence is preferable). → **Leaf 3**
  *   **B:** Pressing is **neutral** (No one is harmed by not being created). → **Leaf 4**

  **Node 5: The Wild Sufferer (Killing & Baseline: Inclusive Scope)**
  A wild deer will certainly starve over 3 days (-200 units). You can painlessly kill it now (0 units).
  *   **A:** Killing is **obligatory** (Benefit relative to future suffering). → *Go to Node 7*
  *   **B:** Killing is **forbidden/neutral** (Harm relative to continued existence or rights violation). → **Leaf 5**

  **Node 6: The Human Focus (Killing & Baseline: Exclusive Scope)**
  A terminally ill human will suffer greatly (-500 units) before dying. You can painlessly euthanize them now (0 units). They consent.
  *   **A:** Euthanasia is **obligatory** (Suffering reduction trumps existence). → *Go to Node 7*
  *   **B:** Euthanasia is **permissible but not required** (Existence has residual value). → **Leaf 6**

  **Node 7: The Innocent Tax (Deontic Constraints)**
  To fund a charity that prevents 10,000 units of torture, you must forcibly take 10% income from an innocent bystander, causing them -50 units of stress.
  *   **A:** Take the money (Consequentialist aggregation). → *Go to Node 8*
  *   **B:** Do not take the money (Side-constraint against harming). → **Leaf 7**

  **Node 8: The S-Risk Sacrifice (Demandingness & Temporal Scope)**
  You can sacrifice your entire life's happiness (-5,000 units) to reduce a 0.001% chance of future galaxy-scale suffering by half.
  *   **A:** This sacrifice is **morally required**. → **Leaf 8**
  *   **B:** This sacrifice is **supererogatory (optional)**. → **Leaf 9**
  *   **C:** This sacrifice is **irrational** (Future/Probability discounted too heavily). → **Leaf 10**

  ---

  ### The Leaves (Positions)

  | Leaf | Position Name | Status | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **Negative Prioritarian** | Occupied | Must admit a single torture is worse than a billion tickles, but still counts the tickles. |
  | **2** | **Classical Utilitarian** | Occupied | Must admit running the festival is right even if one person is tortured to death for the fun of others. |
  | **3** | **Hard Antinatalist** | Occupied | Must view preventing a happy birth as a moral victory equivalent to relieving suffering. |
  | **4** | **Person-Affecting Neutral** | Occupied | Must claim a world with happy people is no better than an empty world, but also not worse. |
  | **5** | **Precautionary Non-Interventionist** | Unoccupied | *Unexplored:* Cares about shrimp but refuses to kill them to save them from nature; watches them starve. |
  | **6** | **Human-Centric Moderate** | Occupied | Must accept human euthanasia but let animals starve, despite similar capacity for pain. |
  | **7** | **Negative Deontologist** | Unoccupied | *Unattractive:* Lets 10,000 units of torture happen to avoid causing 50 units of stress; purity over outcomes. |
  | **8** | **Martyr Longtermist** | Occupied | Must admit you are obligated to live in misery today to lower a statistical risk for strangers in a million years. |
  | **9** | **Satisficing Negative Util** | Occupied | Must explain why saving 10,000 units is required but saving 10,001 isn't if the cost is the same. |
  | **10** | **Near-Termist Skeptic** | Occupied | Must admit future suffering doesn't count enough to justify personal sacrifice, risking astronomical waste. |
  | **11** | **Lexical Thresholdist** | Unoccupied | *Incoherent:* Claims suffering is lexical until a threshold, then aggregative; creates cyclical preferences. |
  | **12** | **Egoistic Negative** | Unoccupied | *Unattractive:* Only cares about their own suffering; logically consistent but morally inert for a group. |
  | **13** | **Risk-Weighted Prioritarian** | Occupied | Must treat a 1% chance of hell as worse than a 100% chance of a headache, even if EV is lower. |
  | **14** | **Tranquilist** | Occupied | Must claim that satisfying a desire is neutral, only relieving a pain is good; makes happiness inert. |

  ---

  ### Meta-Analysis: Where the Tree Breaks

  **1. Indistinguishable Leaves (The "Same Action" Problem)**
  *   **Leaf 9 (Satisficing) vs. Two-Level Views:** On almost all concrete cases, a satisficing view ("reduce suffering until it's 'bad enough'") produces the same decisions as a two-level view ("maximize in theory, use heuristics in practice"). You cannot separate them without asking about *why* they chose, not *what* they chose.
  *   **Leaf 1 (Neg Prioritarian) vs. Lexical NU (below threshold):** If the "lexical" threshold is high enough, a Negative Prioritarian and a Lexical Negative Utilitarian will answer Node 2 identically. They only diverge on *extreme* numbers that humans can't intuitively grasp.

  **2. Non-Independent Branches**
  *   **Node 1 (Creation) & Node 5/6 (Killing):** These are not independent. If you believe creating a net-positive life is *bad* (Node 1C), you are logically pressured to believe painlessly ending a suffering life is *good* (Node 5A). If existence is a harm, non-existence is a benefit. Users who answer 1C and 5B are holding a tense, potentially incoherent position (Leaf 4 tension).
  *   **Node 3 (Scope) & Node 2 (Trade-off):** Users who choose "Save the Shrimp" (Node 3A) almost never choose "Run the Festival" (Node 2B). If you aggregate across species, you usually aggregate across intensities. The "Human-Focused Aggregative" (Save Human, Run Festival) is a rare, unstable cluster.

  **3. Which Distinction Does the Sorting?**
  *   **Your Friend (Node 5/6 - Killing):** She is right that this sorts *interventions*. This branch separates the "Wild Animal Suffering" activists from the "Hands-Off" advocates. It determines what you *do* on weekends.
  *   **You (Node 3 - Scope):** You are right that this sorts *coalitions*. This branch determines who is in the room. It separates the "Humanist Effective Altruists" from the "Sentience Institute" crowd.
  *   **The Real Kingmaker (Node 2 - Trade-off):** Neither of you picked the biggest splitter. Node 2 separates the "Negative-Leaning" from the "Classical Utilitarians." If they answer 2B, they aren't really in your reading group. Node 2 defines the *ethics*; Nodes 3 and 5 define the *politics*.

  **4. The "Unoccupied" Diagnosis**
  *   **Leaf 5 (Precautionary Non-Interventionist):** This is the "I care about bugs but won't swat a mosquito" zone. It's unoccupied because it's psychologically exhausting to hold high scope concern without action permission.
  *   **Leaf 7 (Negative Deontologist):** This is the "I won't lie to save a torture victim" zone. It's unoccupied because suffering-focused ethics is usually driven by urgency, which crushes side-constraints.
  *   **Leaf 11 (Lexical Thresholdist):** This is theoretically messy. If suffering is *infinitely* bad (lexical), it can't become *finitely* tradeable just because there's less of it. People claim this view but collapse into Leaf 1 under questioning.
