          *   *T1 (Trajectory):* The ODEs (Newtonian or GR) are deterministic. Poincaré didn't break this; he broke the *method* of integration. Laskar didn't break this. The episode says nothing against T1. The "chaos refuted determinism" claim is indeed a category error (confusing T1 and T2). Does T1 matter if T2 fails? Yes, for counterfactuals and model validity, but not for prediction.
