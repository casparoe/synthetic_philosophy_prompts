      *   *Constraint Check:* No references. Critique the distinction (don't just praise it).
      *   *Specific Critique of the Distinction:* T1 and T2 are often conflated, good. T3 and T4 are the interesting split. T4 is essentially "ensemble forecasting without ergodicity." The weakness is the dependence on the *shape* of the initial uncertainty distribution, which T3 washes out.
