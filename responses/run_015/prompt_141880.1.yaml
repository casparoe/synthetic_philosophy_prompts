  ### The Decision Tree

  **Node 1: Exhaustiveness**
  Does the structural/mathematical description of physical entities exhaust their intrinsic nature, or is there a categorical residue required to ground the structure?
  *   **Exhausts:** Go to Node 3.
  *   **Residue:** Go to Node 2.

  **Node 2: Residue Nature**
  Is this categorical residue intrinsically experiential (phenomenal) or merely disposed to constitute experience under certain conditions (proto-experiential)?
  *   **Phenomenal:** Go to Node 4.
  *   **Proto-experiential:** Go to Node 7.

  **Node 3: Experience Status**
  If structure exhausts reality, does conscious experience exist as a real natural phenomenon, or is it a systematic user-illusion?
  *   **Illusion:** **Leaf 1.**
  *   **Real:** Go to Node 4.

  **Node 4: Fundamental Locus**
  Where does experience fundamentally reside: in the smallest physical entities, in unified macro-systems, or in the cosmos as a whole?
  *   **Cosmos:** **Leaf 2.**
  *   **Macro-Systems:** **Leaf 3.**
  *   **Micro-Entities:** Go to Node 5.

  **Node 5: Macro-Subject Existence**
  If experience is fundamental to micro-entities, do macro-subjects (like humans) exist as distinct subjects over and above the micro-subjects?
  *   **No (Eliminativism):** Go to Node 8.
  *   **Yes:** Go to Node 6.

  **Node 6: Macro-Micro Relation**
  Are macro-subjects constituted by the micro-subjects (the micro-subjects are the parts of the macro-subject) or emergent from them (the macro-subject is a new entity caused by the micro-subjects)?
  *   **Constitutive:** **Leaf 4.**
  *   **Emergent:** **Leaf 5.**

  **Node 7: Valence Detachability**
  *(Applies to Phenomenal, Proto, or Real-Experience paths)*
  Can valence (suffering/pleasure) exist without sensory modality, representational content, a unified self, or diachronic unity?
  *   **Attached (Requires Content/Self):** **Leaf 6.**
  *   **Detachable (Pure Valence):** Go to Node 8.
      *   *Note: If you answered "Proto-experiential" at Node 2, answer regarding the experience that would eventually emerge.*

  **Node 8: Subject Count in Aggregates**
  In a thermal aggregate with no clear boundaries (e.g., a rock at room temperature), is there a non-arbitrary fact of the matter about how many subjects exist?
  *   **Yes (Definite Count):** **Leaf 7.**
  *   **No (Indeterminate/Vague):** Go to Node 9.

  **Node 9: Indeterminacy Default**
  If the count of subjects in a boundary-less aggregate is indeterminate, does this vagueness entail there are zero subjects or indefinitely many overlapping subjects?
  *   **Zero:** **Leaf 8.**
  *   **Many:** Go to Node 10.

  **Node 10: Moral Aggregation**
  Does the moral weight of many small experiences aggregate (sum up), or is there a threshold/non-aggregating principle?
  *   **Non-Aggregating/Threshold:** **Leaf 9.**
  *   **Summation:** Go to Node 11.

  **Node 11: Epistemic Access**
  Is the valence (positive/negative) of fundamental physical processes knowable in principle, or is it permanently hidden from structural investigation?
  *   **Hidden:** **Leaf 10.**
  *   **Knowable:** Go to Node 12.

  **Node 12: Precautionary Threshold**
  Given the asymmetry of stakes (infinite potential suffering vs. finite research cost), does a bare possibility compel risk management or merely further research?
  *   **Research Only:** **Leaf 11.**
  *   **Risk Management:** **Leaf 12.**

  *(To ensure 12-16 leaves, we split specific metaphysical commitments below into distinct ethical leaves where the practical output diverges.)*

  **Additional Leaves for Granularity:**
  *   **Leaf 13:** (From Node 6/Constitutive) Specific commitment to "Combination Problem" solved via fusion.
  *   **Leaf 14:** (From Node 6/Emergent) Specific commitment to "Combination Problem" solved via causal emergence.
  *   **Leaf 15:** (From Node 10/Summation) Commitment to linear summation.
  *   **Leaf 16:** (From Node 10/Summation) Commitment to diminishing marginal utility of micro-experiences.

