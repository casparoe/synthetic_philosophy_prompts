prompt: |-
  Hey — I'm the community member on my hospital's ethics committee (I write software, which I assume is why they asked me to sit on it), and I need a short decision memo I can circulate before Thursday's meeting.

  We're trying to write a standing rule for how we spend a fixed budget for a new drug. Two live cases are forcing the issue.

  Case one: the same money funds either three patients with a progressive disease — each gets roughly six years of decent life, and without it they decline fast — or about 300 people with a mild chronic condition, each getting maybe three weeks of modest symptom relief. Our health-economics person says the 300-person option actually wins on total QALYs, though barely. Most of the committee thinks that's obviously the wrong answer and wants the three. One member says we're just falling for the identifiable-victim effect and should stick with the arithmetic.

  Case two: a screening change that adds about twenty minutes of waiting and a very small extra infection risk to 40,000 patients a year, and is expected to save around two lives a year. Everyone, including the people who hated the QALY math in case one, wants to approve it.

  Here's where I'm stuck. Our chair keeps muttering about "the separateness of persons," which I gather is a real philosophy thing but I've never seen it turned into a rule anyone could apply. The version I sketched is: you can't justify one person's loss by adding up a pile of smaller gains to other people — you have to be able to point at someone whose gain is bigger than that one person's loss, and you can't spend the same gain twice. But when I trace it through, that seems to block case two as well as case one, which makes me think I've stated it wrong.

  Can you draft the memo? I need a recommendaton at the top, a rule with a baseline and a threshold we could actually apply at the table, verdicts on both cases, and an honest go at the strongest argument against whatever rule you land on — the identifiable-victim worry if you go separatist, or the "then you can't justify any public health measure" one if you don't. Keep it under two pages; the clinicians won't read more.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Community member on a hospital ethics committee (software background).
      *   **Task:** Draft a short decision memo for circulation before Thursday's meeting.
      *   **Context:** Creating a standing rule for spending a fixed drug budget. Two live cases are driving the need.
      *   **Case 1:** 3 patients (progressive disease, +6 years decent life each) vs. 300 patients (mild condition, +3 weeks modest relief each). QALYs favor the 300 (barely). Committee leans toward the 3. One member argues for QALYs (identifiable victim effect warning).
      *   **Case 2:** Screening change. 40,000 patients get +20 mins wait + tiny infection risk. Saves ~2 lives/year. Committee unanimously supports it.
      *   **The Philosophical Problem:** The Chair mentions "separateness of persons." The user's draft rule ("can't justify one person's loss by adding up smaller gains to others") blocks Case 2 as well as Case 1.
      *   **Requirements:**
          *   Recommendation at the top.
          *   A rule with a baseline and a threshold (actionable).
          *   Verdicts on both cases.
          *   Strongest counter-argument (honest assessment).
          *   Length: Under two pages (clinicians won't read more).

  2.  **Deconstruct the Ethical Conflict:**
      *   *Utilitarianism (QALYs):* Maximize total good. Favors 300 in Case 1. Favors screening in Case 2.
      *   *Prioritarianism/Segregation (Separateness of Persons):* Focus on individual impact. Aggregating tiny benefits to outweigh a massive loss to one person feels wrong (Case 1).
      *   *The Puzzle:* Why does Case 2 feel okay if Case 1 feels wrong?
          *   In Case 1, the 300 get *small* benefits, the 3 lose *everything* (relative to treatment).
          *   In Case 2, the 40,000 incur *tiny* burdens, the 2 gain *life*.
          *   *Key Distinction:* It's not just about aggregation; it's about the *magnitude of burden vs. benefit per person*. In Case 2, the burden is trivial (20 mins), the benefit is existential (life). In Case 1, the benefit to the 300 is trivial (3 weeks), the loss to the 3 is existential (6 years).
      *   *Refining the Rule:* We need a threshold that prevents "tyranny of the aggregation" (Case 1) but allows "trivial burden for vital gain" (Case 2). This sounds like a *de minimis* threshold for burdens/benefits.

  3.  **Drafting the Rule (The "Separateness" Fix):**
      *   User's draft: "Can't justify one person's loss by adding up smaller gains." -> Too strict. Blocks Case 2.
      *   Better version: "Aggregation is permissible only when individual burdens are below a significance threshold." OR "We prioritize significant individual need over aggregated trivial benefits, unless the individual burden is trivial."
      *   Let's try a "Significance Threshold" approach.
      *   *Baseline:* Maximize health outcomes (QALYs).
      *   *Constraint:* Do not aggregate trivial benefits to override a significant loss to an identifiable individual *unless* the burden on the many is trivial relative to the benefit to the few.
      *   *Actually, let's look at the "Separateness of Persons" (Nozick/Williams).* It argues against treating society as a single container of utility.
      *   *Proposed Rule:* "The Significant Burden Constraint." We may not aggregate small benefits across many people to deny a life-saving or life-sustaining intervention to a few, *unless* the cost/burden to the many is negligible per person.
      *   *Wait, Case 2 is the reverse:* Small burden to many saves few. This is generally acceptable in public health.
      *   *Case 1 is:* Small benefit to many denies life-sustaining to few. This is the problem.
      *   *Distinction:* It's about *denying* vs. *imposing*.
      *   *Revised Rule Idea:* A "Threshold Prioritarianism."
          1.  Maximize total benefit.
          2.  EXCEPTION: If an intervention provides a *significant* life-course benefit to an individual (e.g., >1 year), it cannot be denied solely to provide *sub-significant* benefits (e.g., <1 month) to others, regardless of numbers.
          3.  EXCEPTION 2 (Public Health): Trivial burdens (time, negligible risk) imposed on many to prevent death/serious harm to few are permissible.

      *   *Let's simplify for a memo:* We need one coherent rule.
      *   *Rule:* "The Non-Aggregation Threshold."
      *   *Principle:* We maximize total health (QALYs) *subject to* a constraint: We do not deny a significant life-prolonging treatment to an individual to fund trivial symptom relief for others. However, we may impose trivial burdens on many to save lives.
      *   *Why the difference?* Because in Case 2, the 40,000 are not being *denied* care; they are experiencing a process friction. In Case 1, the 3 are being *denied* treatment.
      *   *Actually, the Chair's "Separateness" point:* You can't sum the 300 to outweigh the 3. But you *can* sum the 40,000 burdens? No, in Case 2, the *benefit* is to the 2 (life), the *burden* is to the 40,000. In Case 1, the *benefit* is to the 300, the *loss* is to the 3.
      *   *Symmetry:*
          *   Case 1: Many gain little, Few lose much. (Verdict: Don't do it).
          *   Case 2: Many lose little, Few gain much. (Verdict: Do it).
      *   *The Rule:* "Asymmetric Aggregation." We allow aggregation of trivial *burdens* to prevent significant harm, but we do not allow aggregation of trivial *benefits* to cause significant harm (or denial of vital care).

  4.  **Drafting the Content:**
      *   **Header:** Standard Memo format.
      *   **Recommendation:** Adopt the "Significant Interest Threshold" rule.
      *   **The Rule:** Define "Significant" (e.g., >6 months life/quality) vs "Trivial" (e.g., <1 month).
      *   **Application:**
          *   Case 1: 3 patients lose 6 years (Significant). 300 gain 3 weeks (Trivial). Rule blocks aggregation. Fund the 3.
          *   Case 2: 2 patients gain life (Significant). 40,000 lose 20 mins (Trivial). Rule allows aggregation of burden. Approve screening.
      *   **Counter-Argument:** The "Identifiable Victim" / Consistency critique. If we reject QALYs in Case 1, are we just being emotional? If we accept them in Case 2, aren't we being hypocritical? The strongest argument is that this rule is ad hoc and lacks a unified moral theory (it's intuitionist). It risks bias toward the loud/sick over the numerous/mildly ill in ways that aren't mathematically defensible.

  5.  **Refining the Tone:**
      *   Needs to be professional, concise, and accessible to clinicians.
      *   Avoid heavy jargon (Nozick, Rawls) but keep the logic sound.
      *   Acknowledge the software background (logic/rules) without making it sound like code.
      *   Keep it under 2 pages (approx. 600-800 words).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Chair's "separateness" comment? Yes, by framing the rule around individual thresholds rather than total sums.
      *   *Check:* Did I solve the Case 2 paradox? Yes, by distinguishing between aggregating *benefits* vs. aggregating *burdens*.
      *   *Check:* Is the counter-argument honest? Yes, it challenges the consistency of the rule.
      *   *Check:* Is there a baseline and threshold? Yes (Maximize QALYs baseline, Significant Interest threshold).

  7.  **Final Polish:** Ensure the recommendation is bold and clear at the top. Make sure the verdicts are explicit. (Proceed to generate output).

  *(Self-Correction on the Rule Logic)*: Wait, simply saying "burdens vs benefits" might be too complex for a standing rule. Let's frame it as a "Claim Strength" threshold.
  *   Strong Claim: Life/Significant Function.
  *   Weak Claim: Modest Symptom Relief.
  *   Rule: Strong Claims trump aggregated Weak Claims. Weak Burdens can be aggregated to meet Strong Claims.
  This captures the asymmetry cleanly.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Community Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Budget Allocation Rule (Standing Order)

  **RECOMMENDATION**
  I recommend the Committee adopt a **"Significant Interest Threshold"** rule for budget allocation. This rule maximizes total health outcomes (QALYs) as a baseline but prohibits aggregating trivial benefits to override significant individual needs. This resolves the conflict between Case 1 and Case 2 without relying on inconsistent intuition.

  **PROPOSED RULE: THE SIGNIFICANT INTEREST THRESHOLD**
  To guide spending decisions where resources are fixed, the Committee will apply the following two-step test:

  1.  **Baseline:** Prefer the option that yields the highest total health benefit (QALYs).
  2.  **Constraint (The Threshold):** Do not deny a **Significant Interest** to an individual or small group solely to provide **Sub-Significant Benefits** to a larger group, regardless of the total sum.
      *   *Significant Interest:* Intervention prevents death or restores >1 year of decent function.
      *   *Sub-Significant Benefit:* Intervention provides <1 month of modest symptom relief.
      *   *Note on Burdens:* This constraint applies to *denying benefits*. It does not prohibit imposing *trivial burdens* (e.g., wait times, negligible risk) on a population to secure a Significant Interest for others.

  **PHILOSOPHICAL RATIONALE**
  The Chair has raised the concern of the "separateness of persons." This is the idea that society is not a single container of utility; we cannot simply pour happiness into the "total" bucket if it requires emptying the bucket of a specific person.

  My previous draft failed because it banned *all* aggregation, which would block public health measures (Case 2). The distinction lies in **claims vs. burdens**.
  *   In **Case 1**, we are weighing the *claims* of the 300 against the *claims* of the 3. The rule says a strong claim (life/function) cannot be defeated by the sum of weak claims (modest relief).
  *   In **Case 2**, we are weighing the *burdens* on the 40,000 against the *claims* of the 2. The rule says trivial burdens can be aggregated to meet a strong claim.

  **APPLICATION TO LIVE CASES**

  **Case 1: Progressive Disease vs. Chronic Condition**
  *   **Analysis:** The 3 patients face a loss of 6 years of life (Significant Interest). The 300 patients seek 3 weeks of relief (Sub-Significant Benefit).
  *   **Verdict:** **Fund the 3.** Under the Threshold, we cannot aggregate the 300 weak claims to override the 3 strong claims, even if the QALY math slightly favors the 300. This avoids the "identifiable victim" error by focusing on the *magnitude of the need*, not the identity of the patient.

  **Case 2: Screening Protocol Change**
  *   **Analysis:** The 2 saved patients gain life (Significant Interest). The 40,000 incur 20 minutes of wait time (Trivial Burden).
  *   **Verdict:** **Approve Screening.** The Constraint does not block aggregating trivial *burdens* to save lives. The "separateness" of the 40,000 is respected because no single person suffers a significant loss; the cost is distributed below the significance threshold.

  **STRONGEST COUNTER-ARGUMENT**
  **The Consistency Critique:** A strict utilitarian will argue this rule is intellectually dishonest. They will say: *"If QALYs are the right metric for Case 2 (public health), they must be the metric for Case 1 (drug budget). By switching rules, you are simply codifying a bias toward the severely ill over the numerous mildly ill."*

  This is a valid risk. If we define "Significant" too loosely, we risk exhausting the budget on a few high-cost patients while ignoring preventive care that helps thousands. To mitigate this, the "Significant Interest" definition (e.g., >1 year) must be rigid, not emotional. However, if we do not adopt this threshold, we risk a system where a hospital could ethically justify letting a child die to fund mild pain relief for a stadium full of people, provided the numbers are high enough. Most committee members—and the public—find that conclusion unacceptable.

  **NEXT STEPS**
  If the Committee accepts this logic, I will draft the specific numerical thresholds (months/years) for the bylaws prior to the vote.
