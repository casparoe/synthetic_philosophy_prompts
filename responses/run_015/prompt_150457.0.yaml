      Let's assemble the argument.

      *Thesis:* The SSP system operates on **Normative Essentialism**. It treats species as if they have immutable essences that must be preserved, prioritizing taxonomic purity over genetic fluidity or individual welfare.

      *Wait, is it Pragmatic?* One could argue it's just pragmatic because laws (ESA) protect species. But the prompt says "regardless of ecological function or individual welfare." If it were purely pragmatic, they would bend the rules for welfare. The rigidity suggests essentialism. I will argue it is **Institutionalized Essentialism**—a pragmatic adoption of an essentialist framework that functions as if the essences are real.

