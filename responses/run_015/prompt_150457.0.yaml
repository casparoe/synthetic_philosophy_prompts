answer: |-
  The practice of Species Survival Plans (SSPs) as described presupposes a philosophy of **Operational Essentialism**. While the biologists administering these plans may intellectually subscribe to population thinking or pluralist realism, the *institutional logic* of the SSP treats taxonomic species as fixed, discrete natural kinds with immutable boundaries. This is not merely a pragmatic convention, because a pure convention would bend when welfare or ecology demands it; nor is it pluralist realism, because it does not adjust the species concept to fit the biological reality of the organism (e.g., accepting clinal variation). Instead, it imposes a typological framework onto dynamic populations and assigns that framework normative authority.

  ### 1. Implicit Theory of the Species
  The SSP framework reconstructs the species as a **Conservation Atom**. In this implicit theory:
  *   **Discreteness:** Species are treated as ontologically distinct units rather than points on a genetic continuum. The boundary is viewed as a barrier that should not be crossed, mirroring a rigid Biological Species Concept (reproductive isolation) but enforced prescriptively rather than descriptively.
  *   **Historical Integrity:** The species is viewed as a historical lineage that must be preserved in a state of "purity." Hybridization is treated not as an evolutionary process but as contamination or loss of information.
  *   **Moral Agency:** The taxonomic unit itself is granted a form of moral standing. The "right" of the species to persist as a distinct entity outweighs the welfare of the individual organisms (e.g., preventing a pairing that would produce healthy hybrids but blur taxonomic lines).

  ### 2. Intrinsic vs. Instrumental Value
  Under this framework, the species is valued **intrinsically as a taxonomic entity**, even if the justification given is instrumental (e.g., "biodiversity").
  *   **Intrinsic:** If the boundary carried only instrumental weight, cross-species pairings would be permitted when they enhance individual welfare or ecosystem function (e.g., using a surrogate species to save a niche). The prohibition of such pairings implies that the *identity* of the lineage has value independent of its function or the welfare of its constituents.
  *   **Instrumental:** The *institution* values the species instrumentally (for accreditation, funding, and legal compliance), but the *management protocol* treats the species boundary as an intrinsic constraint. The "Species" is the end goal, not the organisms themselves.

  ### 3. Strictly Required vs. Merely Fits
  To distinguish the necessary conditions of this practice from those that are merely compatible:
  *   **Strictly Requires:**
      1.  **Stable Nomenclature:** A governing authority (like the IUCN or AZA Taxon Advisory Groups) must have the final say on what constitutes a "species," regardless of new genetic data.
      2.  **Pedigree Tracking:** The ability to trace lineage to ensure no "unauthorized" gene flow has occurred.
      3.  **Exclusionary Power:** The administrative authority to remove hybrids or cryptic lineages from the breeding pool.
  *   **Merely Fits:**
      1.  **Biological Reality:** It is not required that the taxonomic species actually correspond to reproductively isolated groups in the wild. The system functions even if the species designation is biologically arbitrary, provided it is administratively stable.
      2.  **Evolutionary Potential:** The system does not require that the managed population remains evolutionarily viable in the wild; it only requires that it remains taxonomically "pure."
      3.  **Individual Welfare:** The health of the individual animal fits the system but is not required; an animal may be sterilized or excluded from breeding solely due to taxonomic impurity despite being healthy.

  ### 4. Viability Under Replacement Standards
  The SSP framework **could not survive** replacement by a population-genetics or ecosystem-function standard without collapsing into a fundamentally different system.
  *   **Population-Genetics Standard (ESUs):** If management prioritized Evolutionarily Significant Units or raw heterozygosity over Linnaean names, "purity" would become irrelevant. Hybridization might be encouraged to rescue inbred populations. The SSP's core metric (taxonomic integrity) would be abolished.
  *   **Ecosystem-Function Standard:** If management prioritized niche fulfillment, a hybrid or surrogate species that performs the ecological role would be acceptable. The SSP's focus on *identity* would be replaced by a focus on *process*.
  *   **Conclusion:** The SSP is structurally dependent on the taxonomic species as the unit of account. Removing it removes the ledger itself. The system would not adapt; it would cease to be an SSP and become a Genetic Rescue Program or Ecosystem Management Plan.

  ### 5. What Would Change My Mind
  My assessment that this practice presupposes Operational Essentialism rests on the assumption that the taxonomic boundary is the primary constraint. I would revise this view under the following conditions:

  *   **Evidence for Pragmatic Convention:** If SSP coordinators produced internal guidelines explicitly stating that taxonomic labels are used *solely* for legal tractability (e.g., compliance with the Endangered Species Act) and CITES, while simultaneously revealing that **genetic management prioritizes Evolutionarily Significant Units (ESUs) over species names** in practice. For example, if they secretly allowed "cryptic" hybrids to breed when demographic necessity demanded it, treating the species label as a bureaucratic skin rather than a biological commandment, the philosophy would be **Pragmatic Convention**.
  *   **Evidence for Reproductive-Isolation Realism:** Conversely, if SSPs were shown to rigorously update their breeding pairs based *strictly* on new genomic data that redefines reproductive isolation (even when it splits popular species into less fundable units), and if they allowed hybridization only when genomic data proved the populations were historically sympatric and exchanging genes, this would indicate a commitment to **Pluralist Realism**. This would show the "boundary" is not normative but descriptive, and the prohibition on crossing is based on biological fact rather than taxonomic dogma.

  Currently, the rigidity regarding hybrids and the exclusion of clinal variation suggests the former (Essentialism) dominates the latter (Realism), making the SSP a system that conserves *names* as much as, if not more than, *life*.
