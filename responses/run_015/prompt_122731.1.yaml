answer: |-
  Here is the specification for an adequate account of anachronism, designed for operational use in historical monographs rather than moral seminars.

  ### 1. The Conceptual Intelligibility Constraint
  *   **Requirement:** The account must distinguish between a standard being *unintelligible* to an agent (conceptually unavailable) and a standard being *unacceptable* to an agent (morally rejected), and specify when the former excuses the latter.
  *   **Motivating Case:** *The Unavailable-Concept Case.* Condemning an eighteenth-century planter using "structural racial exploitation."
  *   **Status:** **Non-negotiable.** Without this, the historian cannot distinguish between a failure of imagination and a failure of will.
  *   **Distinction to Preserve:** *Conceptual availability* (could they formulate the thought?) versus *Latent constructibility* (could they have formulated it with effort?). The theory must state whether latent constructibility imposes a duty to innovate.

  ### 2. The Dissent Accessibility Distinction
  *   **Requirement:** The account must determine whether the existence of a dissenting minority makes a standard *socially available* to the majority, or merely *logically possible*, and set a threshold for when "someone knew better" becomes "they should have known better."
  *   **Motivating Case:** *The Few-Did Case.* Contemporaries dissented, so "no one knew" is factually false.
  *   **Status:** **Non-negotiable.** A monograph must decide whether to treat dissenters as prophets (validating the standard) or outliers (invalidating its availability).
  *   **Distinction to Preserve:** *Epistemic access* (was the view in circulation?) versus *Social cost* (was adopting the view ruinous?).

  ### 3. The Evidentiary Reflexivity Rule
  *   **Requirement:** The account must provide a method for weighing silence in the archive, distinguishing between the *absence of evidence* (no dissent occurred) and the *evidence of absence* (dissent was erased).
  *   **Motivating Case:** *The Archive-Silence Case.* The powerful shaped the record, so silence may be coerced.
  *   **Status:** **Non-negotiable.** Historians write from fragments; the theory must license inferences about lost voices without fabricating them.
  *   **Distinction to Preserve:** *Historical fact* (what happened) versus *Archival fact* (what was recorded).

  ### 4. The Agency Attribution Rule
  *   **Requirement:** The account must specify how cognitive and moral predicates attach to collective entities, distinguishing between *corporate intent* (the office's policy) and *aggregated individual intent* (the clerks' beliefs).
  *   **Motivating Case:** *The Collective-Agent Case.* A chartered company or colonial office.
  *   **Status:** **Camp Preference.** (Strict methodological individualists will reject this; institutional historians require it).
  *   **Distinction to Preserve:** *Structural causation* (the system did it) versus *Moral agency* (the system chose it).

  ### 5. The Asymmetric Epistemic Warrant
  *   **Requirement:** The account must explain why the historian's later temporal position grants *epistemic advantage* (seeing consequences) without automatically granting *moral superiority* (being better people), thereby blocking the symmetry of judgment.
  *   **Motivating Case:** *The Temporal-Symmetry Case.* If we judge them, they (or the future) judge us.
  *   **Status:** **Non-negotiable.** Critical history collapses if the historian cannot claim to know more than the subject without claiming to *be* better than the subject.
  *   **Distinction to Preserve:** *Retrospective clarity* (we see the outcome) versus *Normative progress* (we are more virtuous).

  ### 6. The Uptake/Validity Separation
  *   **Requirement:** The account must distinguish whether present endorsement of a past condemnation *validates* the historical judgment or merely *instrumentalizes* it for present politics.
  *   **Motivating Case:** *The Retrospective-Uptake Case.* Descendants endorse the condemnation (statues/apologies).
  *   **Status:** **Non-negotiable.** Historians must know if present consensus changes the truth-value of past descriptions.
  *   **Distinction to Preserve:** *Historical truth* (was it wrong then?) versus *Political utility* (is it useful to call it wrong now?).

  ### 7. The Non-Performative Genealogy
  *   **Requirement:** The account must allow the historian to historicize their own critical vocabulary without rendering the use of that vocabulary performatively contradictory or self-undermining.
  *   **Motivating Case:** *The Self-Application Case.* Our standards are also historical products.
  *   **Status:** **Non-negotiable.** If the theory makes critical history impossible to write consistently, it fails the monograph test.
  *   **Distinction to Preserve:** *Genealogical origin* (where our standards came from) versus *Normative force* (why our standards bind).

  ***

  ### Unsatisfiable Subset
  The triad of **(1) Radical Self-Application** (our standards are wholly contingent historical products), **(2) Objective Normativity** (judgments of the past are truth-apt, not just expressions of preference), and **(3) Non-Circular Warrant** (justification for judgment cannot presuppose the standards being judged) cannot be jointly satisfied. You must relinquish one: either our standards are not merely contingent, or judgments are not objectively true, or our justification is inevitably circular.

  ### Most Exclusionary Requirement
  **The Asymmetric Epistemic Warrant.** This requirement excludes Strict Contextualism (which denies the right to judge from a later vantage) and Thoroughgoing Presentism (which denies the asymmetry, treating past and present as a flat conversational field). It forces the theory to navigate the narrow path between claiming we know *more* and claiming we *are more*.

  ***

  ### One-Line Theory Summaries
  *   **Strict Contextualism:** Anachronism is a fatal error; the historian must reconstruct past meanings without applying present evaluative predicates.
  *   **Relativism-of-Distance:** The propriety of judgment scales inversely with temporal proximity and conceptual overlap, permitting critique only where continuity is established.
  *   **Thoroughgoing Presentism:** All history is contemporary dialogue; anachronism is inevitable and therefore licit, provided it serves present ethical needs.
