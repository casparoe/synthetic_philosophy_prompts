      *Self-Correction on Requirement 4 (Collective Agent):* Is this NN or CP? Some historians reject collective agency entirely. I should mark it CP.
      *Self-Correction on Requirement 5 (Symmetry):* This is crucial for the "working historian" who wants to judge without being judged by the future as harshly. It needs to be NN for the *project* of critical history, even if philosophically contentious.
