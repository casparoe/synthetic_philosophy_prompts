prompt: |-
  I am a high school junior serving as parliamentarian for our student council, and I am trying to turn what we studied about ancient Athens into something my council can actually use.

  We discussed three failures of Athenian democracy in class. In the first, the assembly angrily voted to punish a rebellious allied city with extreme severity and then, after a night of reflection and a second debate, reversed itself the next day. In the second, the assembly was persuaded by enthusiastic speeches to approve a large, distant military expedition, brushed aside warnings from more cautious and experienced commanders about cost, distance, and poor information, and suffered a catastrophe. In the third, a large citizen jury convicted a philosopher who questioned conventional views and annoyed prominent people, on broad charges of impiety and corrupting the young.

  Our council meets for about forty-five minutes each Tuesday with thirty members between the ages of fourteen and eighteen. We decide matters such as dance budgets under two thousand dollars, spirit week plans, and recommendations to the administration on phone use and club funding. None of us has training in history or philosophy, our faculty advisor must sign off on any action, and we are under constant pressure to vote quickly when feelings run high. I need a reusable procedure, not advice on a single vote: a step-by-step checklist or flowchart in words that a chair with no background in theory could follow in real time and that would fit on one page if summarized.

  Please design that procedure so it preserves the core lessons of the three Athenian cases while dropping details that do not transfer to a school setting. It should specify in order the questions to ask, what counts as a sufficient answer at each step, when a vote must be delayed to a second meeting, when dissenting or expert voices must be heard, and what protections apply when the target of a proposal is an unpopular person or view. Mark clearly the points where judgment cannot be eliminated and must be exercised by the chair or advisor.

  Then run the procedure step by step on three live proposals: a proposal to ban phones during lunch immediately after a cheating incident, where sponsors demand a same-day vote while anger is high; a proposal to spend most of our annual budget on an ambitious overnight leadership retreat in another city, promoted with great enthusiasm while warnings from the treasurer and advisor about cost and logistics are being dismissed as negativity; and a proposal to remove our newspaper representative from the council after an editorial sharply criticizing the council and administration, on grounds of disloyalty and bad character. Include at least one application where the procedure blocks or delays what I and a majority currently want, and conclude with an honest statement of what the procedure cannot do and where it is likely to misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** High school junior, Student Council Parliamentarian.
      *   **Goal:** Create a reusable procedure (checklist/flowchart) for the Student Council based on lessons from three specific Athenian democratic failures.
      *   **Context:** 45-minute meetings, 30 members (ages 14-18), low-stakes decisions (budgets < $2k, spirit week, admin recommendations), no historical/philosophical training, faculty advisor sign-off required, pressure to vote quickly.
      *   **The Three Athenian Cases (Lessons to Embed):**
          1.  *Mytilenean Debate:* Reversing a rash, angry decision after reflection. (Lesson: Cool-down periods for punitive/emotional votes).
          2.  *Sicilian Expedition:* Ignoring expert warnings due to enthusiasm/populism. (Lesson: Mandatory consideration of logistical/financial objections).
          3.  *Trial of Socrates:* Punishing unpopular speech/views. (Lesson: Protections for minority speech/dissent, especially against individuals).
      *   **Requirements:**
          *   Step-by-step checklist/flowchart in words.
          *   Fit on one page (summarized).
          *   Specify questions, sufficient answers, delay triggers, dissent/expert voice requirements, protections for unpopular targets.
          *   Mark points requiring Chair/Advisor judgment.
          *   **Application:** Run the procedure on three specific live proposals (Phone ban, Leadership Retreat budget, Newspaper Rep removal).
          *   **Constraint:** Include at least one application where the procedure blocks/delays what the user/majority wants.
          *   **Conclusion:** Honest statement of limitations/failure points.

  2.  **Deconstruct the Athenian Lessons into Procedural Rules:**
      *   *Mytilene (Rash Punishment):* If a vote is punitive or emotionally charged, require a "cooling-off" period (second meeting) before final ratification.
      *   *Sicily (Ignored Expertise):* If a proposal involves significant resources (money/time) or risk, specific time must be allocated for "Risk/Logistics" objections, and the Treasurer/Advisor must formally speak.
      *   *Socrates (Minority Persecution):* If a proposal targets a specific individual or group's rights/speech, a higher threshold or specific defense time is needed.

  3.  **Drafting the Procedure (The "Athenian Safety Valve" Protocol):**
      *   *Structure:* Needs to be linear but with decision diamonds (Yes/No).
      *   *Tone:* Practical, clear, actionable for a 16-year-old chair.
      *   *Key Triggers:* Emotion/Punishment, Cost/Logistics, Individual Rights.
      *   *Judgment Points:* Clearly marked where the Chair or Advisor decides.

      *Drafting Steps:*
      1.  Introduction of Motion.
      2.  Trigger Check 1: Is this punitive or emotionally charged? (Mytilene) -> If yes, delay vote.
      3.  Trigger Check 2: Does this exceed budget/risk thresholds? (Sicily) -> If yes, require Expert Testimony (Treasurer/Advisor).
      4.  Trigger Check 3: Does this target a person or speech? (Socrates) -> If yes, require Defense Time & Supermajority.
      5.  Final Vote & Advisor Sign-off.

  4.  **Refining the Procedure for the Context:**
      *   *Time:* 45 minutes is short. A "second meeting" delay is feasible, but "second reading" same day might be better for some things. Let's stick to the Athenian lesson: *Time* is the cure for anger. So, a delay to the next meeting for punitive stuff.
      *   *Budget:* "Most of annual budget" is high risk. Define a threshold (e.g., >25% or >$500).
      *   *Rights:* Removing a member is a big deal. Needs high bar.
      *   *Advisor:* They have veto power essentially. Make them the "Expert" in the Sicily scenario.

  5.  **Developing the Three Scenarios:**

      *   *Scenario 1: Phone Ban (Mytilene Case).*
          *   Context: Anger over cheating. Demand for immediate vote.
          *   Application: Trigger "Emotional/Punitive" clause.
          *   Outcome: Vote delayed. (This blocks what the majority likely wants immediately).
      *   *Scenario 2: Leadership Retreat (Sicily Case).*
          *   Context: High cost, enthusiasm, ignoring treasurer.
          *   Application: Trigger "Resource/Risk" clause.
          *   Outcome: Treasurer/Advisor *must* speak. Vote can happen but only after warnings are recorded.
      *   *Scenario 3: Newspaper Rep Removal (Socrates Case).*
          *   Context: Criticism, "disloyalty," targeting speech.
          *   Application: Trigger "Individual/Rights" clause.
          *   Outcome: Defense time required, Supermajority needed. Likely fails or is heavily modified.

  6.  **Writing the Content - Section by Section:**

      *   *Title:* The Student Council Safety Valve Protocol (SCSVP).
      *   *The Checklist:* Use bolding for actions. Use [JUDGMENT] tags.
      *   *The Applications:* Walk through the steps explicitly.
      *   *The Limitations:* Be honest. Procedures don't fix culture. Advisors can still override. Kids might find loopholes.

  7.  **Review against Constraints:**
      *   *One Page Summary?* I will provide a detailed version then a "Cheat Sheet" version to ensure it meets the "fit on one page if summarized" requirement.
      *   *Blocks Majority Will?* Yes, the Phone Ban delay blocks the immediate anger-vote.
      *   *Mark Judgment Points?* Yes, will use brackets.
      *   *Tone:* Respectful of the user's intelligence (High School Junior Parliamentarian) but practical.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is a full meeting delay too burdensome for a high school council?
      *   *Fix:* For the "Mytilene" trigger, allow a "Cooling Off" period within the meeting *if* the Chair deems the emotion has subsided, BUT the Athenian lesson is specifically about the *next day*. To honor the prompt's historical fidelity, I should insist on a delay to the next meeting for punitive measures. It teaches the lesson better.
      *   *Critique:* The Advisor sign-off is already required. How does this add value?
      *   *Fix:* This structures *how* the advisor gives sign-off. It forces the advisor to engage with the specific risks before signing, rather than just rubber-stamping a finished vote.
      *   *Critique:* Make sure the "Socrates" protection isn't just "don't do it." It needs to be procedural (right to speak, higher vote threshold).

  9.  **Final Polish:** Check the flow. Ensure the distinction between the "Detailed Procedure" and the "One-Page Summary" is clear. Ensure the limitations section is humble and realistic. (Self-correction: The prompt asks for *one* procedure design, then a summary fit for one page. I will structure the output to provide the robust procedure first, then the condensed checklist).

      *Wait, re-reading prompt:* "Please design that procedure... [and] fit on one page if summarized." Okay, I will design the procedure such that it *can* be summarized on one page. I will provide the full text and then the "Cheat Sheet" version.

      *Re-reading prompt:* "Include at least one application where the procedure blocks or delays what I and a majority currently want." The Phone Ban scenario is perfect for this.

      *Re-reading prompt:* "Mark clearly the points where judgment cannot be eliminated." I will use **{JUDGMENT}** tags.

      *Let's build the "Socrates" protection:* It needs to protect unpopular views. Removing a rep for an editorial is exactly that. The procedure should require the accused to speak and a 2/3 vote.

      *Let's build the "Sicily" protection:* Mandatory "Opposition Time" for financial/logistical risks. The Treasurer *must* be recognized.

      *Let's build the "Mytilene" protection:* Mandatory delay for punitive/emotional votes.

      *Okay, ready to write.*

  10. **Final check of the Limitations:** What can't this do? It can't stop groupthink if everyone ignores the rules. It can't stop the Advisor from caving to admin pressure. It can't fix apathy.

      *(Self-Correction on Length)*: Keep the procedure tight. High schoolers won't read a 10-page manifesto.

      *(Final Plan)*:
      1. Introduction acknowledging the role.
      2. The "Safety Valve" Protocol (Detailed).
      3. The One-Page Cheat Sheet.
      4. The Three Case Applications.
      5. Limitations Statement.

      *Wait, one more check:* "Mark clearly the points where judgment cannot be eliminated and must be exercised by the chair or advisor." I need to make sure these are very visible.

      *Okay, proceeding.*
answer: |-
  ### The Student Council Safety Valve Protocol (SCSVP)

  **Purpose:** To prevent rash decisions, protect minority voices, and ensure logistical reality checks before voting.
  **Authority:** This protocol supplements *Robert's Rules of Order*. If a conflict arises, this protocol determines the *order* of business before a vote is taken.

  #### Phase 1: Classification (The Trigger Check)
  *Before debate begins, the Chair must classify the motion.*

  1.  **Is the motion punitive or reactive to a specific incident?** (e.g., banning something because of a scandal, punishing a person/group).
      *   **YES:** **{JUDGMENT: CHAIR}** Declare this a "Red Motion." Proceed to Phase 2A.
      *   **NO:** Proceed to Question 2.
  2.  **Does the motion commit more than 25% of the annual budget or require significant logistical risk?** (e.g., travel, large contracts).
      *   **YES:** **{JUDGMENT: TREASURER/ADVISOR}** Declare this a "Yellow Motion." Proceed to Phase 2B.
      *   **NO:** Proceed to Question 3.
  3.  **Does the motion restrict the rights, position, or speech of a specific student or club?** (e.g., removing a member, defunding a specific club).
      *   **YES:** **{JUDGMENT: CHAIR}** Declare this a "Blue Motion." Proceed to Phase 2C.
      *   **NO:** Standard Green Motion. Proceed to Phase 3.

  #### Phase 2: Mandatory Safeguards (Based on Classification)

  **2A: Red Motion (The Mytilene Safeguard)**
  *   **Rule:** No final vote may occur at this meeting.
  *   **Action:** Motion is tabled to the next regular meeting.
  *   **Requirement:** Sponsors may speak for 2 minutes *only* to explain intent. No debate.
  *   **Rationale:** Anger cools overnight. A second debate is mandatory.

  **2B: Yellow Motion (The Sicily Safeguard)**
  *   **Rule:** "Risk Testimony" is mandatory before general debate.
  *   **Action:** The Treasurer and Faculty Advisor **must** be recognized to speak for 3 minutes each on costs/logistics.
  *   **Requirement:** Their objections must be read into the minutes.
  *   **Rationale:** Enthusiasm cannot drown out expertise.

  **2C: Blue Motion (The Socrates Safeguard)**
  *   **Rule:** The target of the motion has a Right of Reply.
  *   **Action:** The affected student/representative must be offered the floor to speak in their own defense *before* any vote.
  *   **Voting Threshold:** Requires a 2/3 Supermajority to pass (not simple majority).
  *   **Rationale:** Protecting unpopular speech requires a higher bar than simple preference.

  #### Phase 3: Debate and Vote
  *   **Debate:** Standard rules apply, but the Chair must ensure at least two speakers *against* the motion are heard before closing debate. **{JUDGMENT: CHAIR}**
  *   **Advisor Sign-Off:** **{JUDGMENT: ADVISOR}** The Advisor must verify that Phase 2 safeguards were met before signing the final motion. If safeguards were skipped, the Advisor must veto the procedural validity.

  ***

  ### One-Page Cheat Sheet (For the Chair's Podium)

  **STEP 1: CLASSIFY THE MOTION**
  *   [ ] **RED (Punitive/Emotional):** Reaction to scandal/incident?
      *   *ACTION:* **STOP.** Table to next meeting. No vote today.
  *   [ ] **YELLOW (High Cost/Risk):** >25% Budget or Travel?
      *   *ACTION:* **PAUSE.** Treasurer & Advisor *must* speak on risks first.
  *   [ ] **BLUE (Rights/Person):** Removing someone or limiting speech?
      *   *ACTION:* **PROTECT.** Target gets to speak. Needs 2/3 Vote.
  *   [ ] **GREEN (Standard):** Routine business.
      *   *ACTION:* Proceed to debate.

  **STEP 2: RUN SAFEGUARDS**
  *   [ ] Did the angry sponsors wait? (Red)
  *   [ ] Did the Treasurer warn us? (Yellow)
  *   [ ] Did the accused speak? (Blue)

  **STEP 3: VOTE & SIGN**
  *   [ ] Chair ensures 2 "Con" speakers heard. **{JUDGMENT}**
  *   [ ] Advisor confirms safeguards met before signing. **{JUDGMENT}**

  ***

  ### Application to Live Proposals

  Here is how the SCSVP applies to your three current scenarios.

  #### Case 1: The Phone Ban (Red Motion)
  *   **Proposal:** Ban phones during lunch immediately after a cheating incident. Sponsors demand a same-day vote.
  *   **Classification:** This is reactive to a specific scandal and punitive in nature. It is a **Red Motion**.
  *   **Procedure Execution:**
      1.  Chair classifies motion as Red.
      2.  Chair invokes Phase 2A.
      3.  Sponsors are allowed 2 minutes to state why they want the ban.
      4.  **Action:** Chair tables the motion to next Tuesday. No vote is taken today.
  *   **Outcome:** **The procedure blocks the majority's immediate desire.** Even if 28 of 30 members want to vote now, the protocol forbids it.
  *   **Lesson Applied:** *Mytilene.* It prevents the council from legislating in anger. If they still want the ban next week after emotions cool, it is likely a better policy.

  #### Case 2: The Leadership Retreat (Yellow Motion)
  *   **Proposal:** Spend 80% of annual budget on an overnight retreat in another city.
  *   **Classification:** This exceeds the 25% budget threshold and involves logistical risk. It is a **Yellow Motion**.
  *   **Procedure Execution:**
      1.  Chair classifies motion as Yellow.
      2.  Chair invokes Phase 2B.
      3.  Enthusiastic sponsors present their vision.
      4.  **Mandatory Step:** Chair *must* recognize the Treasurer and Advisor before opening general debate.
      5.  Treasurer outlines that this leaves no money for Spirit Week or Homecoming. Advisor outlines liability risks.
      6.  These objections are recorded in the minutes.
      7.  Vote proceeds.
  *   **Outcome:** The vote is not blocked, but the "enthusiasm bubble" is pierced. The council cannot claim later they "didn't know" the cost.
  *   **Lesson Applied:** *Sicily.* Expert warnings are formally entered into the record, making ignorance impossible.

  #### Case 3: The Newspaper Representative (Blue Motion)
  *   **Proposal:** Remove the newspaper rep from council due to "disloyalty" after a critical editorial.
  *   **Classification:** This targets a specific individual's position based on their speech. It is a **Blue Motion**.
  *   **Procedure Execution:**
      1.  Chair classifies motion as Blue.
      2.  Chair invokes Phase 2C.
      3.  **Mandatory Step:** The Newspaper Rep is invited to the floor to defend themselves *before* council members debate their removal.
      4.  The Rep explains the editorial was journalism, not disloyalty.
      5.  **Voting Threshold:** The motion requires a 2/3 majority (20 votes) to pass, not 16.
  *   **Outcome:** This makes removal significantly harder. It forces the council to look the person in the eye before punishing them for speech.
  *   **Lesson Applied:** *Socrates.* It creates procedural friction against persecuting unpopular views.

  ***

  ### Limitations and Honest Conclusion

  As Parliamentarian, you must understand what this procedure cannot do.

  1.  **It Cannot Fix Culture:** If the entire council is determined to bully a student (Case 3), they may find a pretext to classify the motion as "Green" (e.g., "We aren't removing him for speech, we are removing him for attendance") to bypass the Blue Safeguard. **{JUDGMENT: CHAIR}** relies on the Chair's integrity to classify correctly.
  2.  **It Cannot Override the Advisor:** The Faculty Advisor holds the ultimate veto. If the Administration demands the phone ban (Case 1) immediately, the Advisor may instruct the Chair to ignore the "Red Motion" delay. This protocol creates a *norm*, not a law.
  3.  **It Relies on Accurate Classification:** The system fails if the Chair is too timid to label a motion "Red" or "Blue." A 14-year-old Chair may feel pressured by 18-year-old seniors to skip the safeguards.
  4.  **It Slows Efficiency:** In a 45-minute meeting, tabling a motion (Case 1) means it might die from neglect rather than merit. Good ideas can be lost to bureaucracy.

  **Final Statement:** This procedure does not guarantee wisdom; it guarantees *process*. It forces the council to pause when angry, listen when spending, and protect when punishing. It is designed to make bad decisions harder to make, not impossible. If the council chooses to ignore the safeguards, the procedure will fail, but the *violation* will be on the record, which is the only protection a Parliamentarian truly has.
