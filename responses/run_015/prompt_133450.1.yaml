  1. The probability that the Frege-Geach problem is genuinely fatal rather than an artifact of an overly rigid semantic model.
  2. The probability that hybrid accounts genuinely preserve non-cognitivism rather than smuggling in descriptive content.
  3. The probability that adopting a non-bivalent or non-classical logic for embedded moral sentences is a defensible price for pure expressivists.
  4. The probability that a constructed "procedural-embedding" variant—where moral clauses sit inside institutional rules like "If this agreement is exploitative, it is void"—creates a residual difficulty that even hybrid accounts fail to resolve.

  For each factor, assign a rough probability (0–1) and one line of justification. State your combination method and compute the overall credence. Identify which factor is your weakest link and describe what specific conceptual argument (not a citation request) would shift it most.

