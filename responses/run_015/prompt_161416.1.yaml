  **Preliminary Readings**

  Before settling on the argument below, I considered three frameworks. First, the *Standard Precedent Autonomy* view: the clause is just a Ulysses contract, valid because the past self knows best. I reject this because it ignores the artificial nature of the incapacity. Second, the *Psychological Discontinuity* view: mid-procedure Joel is literally a different person, so his objection doesn't count. I reject this because it relies on a metaphysical cutoff that doesn't match the phenomenological reality of suffering. Third, the *Constructive Incapacity* view: the clause doesn't just anticipate incapacity; it manufactures it to secure its own authority. This is the reading I commit to below. It treats the clause not as a protection of identity, but as a weaponization of it.

  ***

  **The Lacuna Clause: Precedent Autonomy and Manufactured Incapacity**

  The standard defense of advance directives rests on a distinction between critical interests and experiential interests. The past self, possessing a complete narrative and rational capacity, sets boundaries to protect the life story. The present self, perhaps compromised by dementia or distress, operates on immediate experiential urges. We honor the directive because we believe the past self had epistemic and rational superiority. The Lacuna twist—where Joel signs a clause stating that mid-procedure objections are invalid because the objector is "not really him yet"—appears to be this standard structure with the timeline compressed. It is not. It is morally distinct in kind, and that distinction destabilizes the authority of the past self.

  In the standard dementia case, the incapacity is natural and external to the directive. The disease arrives independently of the refusal of treatment. The directive is a shield against a fate the self could not control. In the Lacuna case, the incapacity is internal and causal. The procedure itself creates the confusion, the memory loss, and the psychological fragmentation that the clause cites as justification for ignoring objections. This creates a circular moral hazard. The clause claims the mid-procedure Joel lacks authority because he is losing his memory, but he is losing his memory *because he signed the clause*. This is not precedent autonomy; it is metaphysical gaslighting. It transforms the advance directive from a protective instrument into a self-sealing trap. In medical ethics, we override a dementia patient's resistance because we believe they lack the capacity to understand the stakes. In the Lacuna case, the "lack of capacity" is the intended output of the service purchased. To honor the clause is to validate the idea that one can consent to be rendered incapable of consenting, which dissolves the concept of consent entirely.

  This leads to the question of Joel's resistance. Does his mid-procedure panic count as revocation? Under the *Constructive Incapacity* reading, the question of "who is speaking" is not incoherent, but it is morally irrelevant to the validity of the objection. The film presents Joel's mind as a fading landscape, not a binary switch. He does not vanish instantly; he degrades. To claim the objector is "not really him yet" is to impose a metaphysical cutoff on a gradual process. Even if we grant that mid-procedure Joel is psychologically discontinuous from Pre-Procedure Joel, he is still a conscious subject experiencing distress. In medicine, we do not override resistance simply because a patient's personality has changed; we override it because they lack understanding. But Joel's resistance isn't just noise. As he hides Clementine in childhood memories, he is generating new values in real-time. He is discovering that the pain of loss is constitutive of his identity. This is not the confusion of dementia; it is the clarity of revision. To disregard this is not to honor the past self's authority; it is to privilege a dead narrative over a living one. The resistance counts as revocation because the conditions under which the original consent was given—that the procedure would be a clean erase without moral complication—have been falsified by the procedure itself.

  Finally, we must address the ending. Joel and Clementine receive the tapes, learn the full history of their toxicity and pain, and choose to begin again anyway. This devastates the view that grants the earlier self authority precisely because it remembers what the later self has lost. The standard argument suggests the past self is the guardian of information the future self will discard. But the film shows the future self reclaiming that information and rejecting the conclusion. They know the relationship will likely fail. They know the pain is waiting. They choose it regardless.

  This suggests that the authority of the past self does not rest on an information advantage. If it did, the ending would be irrational. Instead, the film suggests authority rests on *endorsement*. The only reason the past self's directive holds weight is if the future self, upon regaining capacity and information, would ratify it. In the dementia case, the patient cannot ratify the choice. In the Lacuna case, the "patient" wakes up, gets the data back, and effectively vetoes the procedure's intent by restarting the relationship. This implies that advance directives should not be treated as binding commands from the past, but as provisional hypotheses about what the future self would want. If the future self can speak, even imperfectly, their current valuation outweighs the past self's prediction. The film argues that identity is not a vessel to be protected from leakage, but a story that must be continuously rewritten. The past self has no special authority over the future self unless the future self grants it.

  ***

  **An Honest Note on Fit**

  There are points where the film forces the framework. First, memory erasure is not dementia. In dementia, the loss of self is a tragedy of biology; in *Eternal Sunshine*, it is a consumer service. This makes the "manufactured incapacity" argument stronger in the film than in real medicine, where we cannot accuse patients of engineering their own confusion. Second, the film treats memory as the sole constituent of identity. In real medical ethics, we worry about bodily integrity and biological life even when memory is gone. Joel's resistance is psychological; a dementia patient's resistance might be purely physiological. Finally, the "restart" at the end is a fantasy of clean slate ethics. In reality, knowing the past doesn't allow you to redo it without the scars. The film suggests we can choose our pain wisely; real medicine often deals with patients who cannot choose at all. I am using the sci-fi element to isolate the variable of *consent over time*, but this isolates it too cleanly, removing the messy biological constraints that make advance directives necessary in the first place.
