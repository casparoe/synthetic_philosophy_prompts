      *   **Moderate Aesthetic Realism:** Beauty is a property of the object (often response-dependent). Aesthetic judgments can be true or false independently of any *particular* observer, though they rely on human capacities to detect them. Disagreement implies one party is missing something about the object.
      *   **Common Ground:** Both reject naive subjectivism ("beauty is in the eye of the beholder" in the trivial sense) and both reject hard scientistic realism (beauty is like mass or shape). Both value the role of the critic/expert.

  3.  **Drafting - Section by Section:**

