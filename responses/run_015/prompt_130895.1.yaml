answer: |-
  **Project Title:** Depth vs. Breadth: Splitting the Norms of Inference to the Best Explanation
  **Applicant:** [Your Name]
  **Duration:** 6 Months

  **The Question**
  Here's the scenario I lived through a dozen times in thirty years of crustacean ecology: A shrimp farm reports a sudden die-off. We have two competing models. Model A offers a precise pathogenic mechanism—it traces the virus, the infection vector, the cellular collapse. It's mechanistically deep but ignores the fact that water chemistry shifted dramatically the same week. Model B points to broad environmental stressors—temperature spikes, salinity drops. It explains the shrimp die-off plus three other species shifts in the bay, but it's mechanistically shallow; it doesn't tell us *how* the shrimp died, just that the conditions were bad.

  In the field, we didn't treat these as points on a single scale. We argued about them differently. My question for this project is simple: Should Inference to the Best Explanation (IBE) actually be split into two distinct norms? One norm for selecting deep mechanistic explanations, and another for selecting broad integrative ones. Or are philosophers right to treat them as competing virtues on a single axis? I suspect forcing them into one principle creates the fake paradoxes philosophers worry about, while scientists just get on with weighing them separately.

  **The Gap in the Literature**
  I'm new to the philosophy department, but I've been reading the standard IBE literature. It seems to treat "explanatory goodness" as monolithic. Philosophers list virtues—simplicity, scope, consistency, depth—and assume they can be traded off against one another in a single utility function. If an explanation is broader, it loses points on simplicity; if it's deeper, it might lose points on scope.

  But in practice, scientists don't always trade them off. Sometimes a shallow-but-broad explanation is rejected not because it's too simple, but because it's the *wrong kind* of explanation for the task at hand. Conversely, a deep mechanistic model might be rejected not because it lacks scope, but because it's too fragile to generalize. The standard literature leaves this open because it rarely looks at how scientists actually argue when the stakes are high and the data is messy. It assumes a unified logic of explanation where there might actually be two distinct epistemic tools being used.

  **The Approach**
  I propose a conceptual analysis grounded in empirical case studies from aquaculture and fisheries science. I'm not running experiments—my friend over coffee joked that I'm just admitting I miss the lab work, and he's half-right—but I am treating scientific practice as the data.

  1.  **Case Study Reconstruction:** I will select three historical episodes of ecological crisis (e.g., shrimp die-offs, crab fishery collapses) where model selection was contested. I'll reconstruct the arguments used in the published literature and internal reports.
  2.  **Mapping the Arguments:** I'll code the reasoning used to accept or reject models. Did the scientists prioritize mechanism (depth) or generalization (breadth)? Was there a explicit trade-off, or did they treat them as incommensurable?
  3.  **Colleague Interviews:** I'll conduct informal interviews with two former colleagues who are still active in fisheries management. I want to know how they justify model choice to policymakers versus how they justify it to peers. This should reveal if the "norm" changes based on the audience.

  **Success and Failure**
  **Success** looks like a clear two-axis framework. I want to produce a set of conditions describing when the "Depth Norm" applies (e.g., when intervention requires precise targeting) versus when the "Breadth Norm" applies (e.g., when policy requires ecosystem-wide risk assessment). If I can show that conflating these leads to specific logical errors in philosophical accounts of IBE, that's a win.

  **Failure** looks like finding that depth and breadth always collapse into a single utility function upon closer inspection. If I find that scientists are implicitly maximizing a single variable (like "predictive accuracy") and just using "depth" and "breadth" as rhetorical flourishes, then the standard monolithic view holds. That's still a result, but it's not the one I'm betting on.

  **Scope and Feasibility**
  This is a six-month project for one person. There are no lab costs, no equipment, and no travel budget required beyond maybe zoom calls with colleagues. I have thirty years of archived field notes and professional networks to draw from, so the data collection is immediate. The heavy lifting is philosophical analysis and writing, which fits comfortably into a half-year timeline. I'm retired, not rushing toward tenure, so I can focus entirely on the quality of the argument without the distraction of teaching loads.

  **Why This Matters**
  You might wonder why a bridge foundation should care about how shrimp biologists argue. It matters because environmental policy hinges on which explanation gets crowned "best." If we choose a broad, shallow explanation for a fishery collapse, we manage for environmental variability. If we choose a deep, mechanistic one, we manage for disease control. Choosing the wrong normative framework leads to the wrong management strategy.

  Scientists are often bad at being explicit about why they reject a shallow-but-broad explanation. We just say it's "not quite right." This project aims to give scientists and philosophers a shared vocabulary to articulate that intuition. If IBE is actually two tools, not one, we should stop trying to hammer screws with it. I want to help write the manual for when to use the screwdriver.
