  Please begin with a one-sentence bottom line stating which branch of the tree represents the sharpest current disagreement in embedded-agency research. Then present the taxonomy as a nested list. Each internal node must pose a concrete diagnostic question—drawn from the logical space of self-reference, logical correlation, and bounded computation—on which the positions genuinely diverge. Each branch must be labelled by the claim that separates it from its siblings. Each terminal leaf must carry either a named position or 'unnamed', followed by one sentence describing its most awkward commitment.

  The tree must incorporate these three specific cases: (i) an agent that can read its own source code but cannot complete a full self-simulation without risking non-termination; (ii) an agent whose present decision is logically correlated with, but causally isolated from, an identical copy running elsewhere; (iii) an agent that must select an action within a hard 10-millisecond computation budget. You must place as leaves: classical externalist decision theory; embedded causal decision theory; a logical-dependence view in the functional-decision-theory family; bounded-rationality embedded agency in a Simon-style heuristic tradition; and at least one combination of answers that is currently unoccupied, with a brief diagnosis (incoherent, unattractive, or merely unexplored).

  Where two positions share the same path through the tree, flag them explicitly rather than forcing a false separation. Use British English throughout. Keep the response within 550 words, arranged so that the nested structure is visible without prose paragraphs between nodes.
