      *   **Structure:** Must be structured around two Humean constraints.
          1.  *Constraint 1 (Value of Life):* Adopt Hume's claim that suicide is permissible not when life lacks pleasure, but when existence is an *active burden*. Use this to reject framing life's value as a single scale to be calibrated.
          2.  *Constraint 2 (Causality/Will):* Develop an analogy from Hume's denial of the will as an efficient cause. Frame the patient's decision not as a sovereign causal act producing death, but as ceasing a contrary inclination (like releasing a weight). This must avoid metaphysically loaded language about "causing death" without using passive voice euphemisms.
      *   **Tone:** Orient clinicians/families (not lectured), precise for philosophers (no misrepresentation). Oral delivery style.
