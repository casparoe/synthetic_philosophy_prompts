answer: |-
  Good morning. Welcome to this workshop on physician-assisted dying. Looking around this room, I see a necessary tension. On one side, we have palliative-care clinicians and family advocates who have stood at the bedside during the hardest moments of human life. On the other, we have philosophers and graduate students who track the architecture of the arguments we use to describe those moments.

  Usually, workshops like this try to bridge that gap by finding common ground in shared values. Today, I propose we do something different. I propose we structure our dialogue around two specific constraints drawn from David Hume. These are not just theoretical ornaments for our philosophical colleagues; they are practical guardrails for everyone here. They dictate what we can say, and perhaps more importantly, what we must avoid saying, if we are to speak honestly about assisted dying.

  The first constraint concerns how we measure the value of remaining life. There is a temptation in clinical ethics to treat life as a single scale, a hedonic calculus where we weigh remaining pleasure against remaining pain. We see this when families ask, "Is there enough quality left?" or when clinicians discuss prognosis in terms of functional output.

  Hume warns us against this framing. In his discussion of suicide, he argues that the permissibility of ending life does not turn on a deficit of pleasure. Life is not a bank account that closes when the balance drops below zero. Instead, the threshold is met when continued existence is experienced as an active burden. This is a crucial distinction for the clinicians and families here. It means we are not gathered to calibrate happiness. We are gathered to recognize when the struggle to exist becomes heavier than the duty to endure.

  For the palliative team, this shifts the focus from optimizing symptoms to recognizing when symptom management no longer alleviates the burden of existence itself. For the families, it validates the feeling that a loved one is not merely unhappy, but that the act of living has become an intolerable weight. We are not here to measure life's value on a scale. We are here to identify when the scale itself breaks under the load.

  This brings us to our second constraint, which concerns the language of action and causality. This is where our philosophical colleagues will recognize the shadow of the *Treatise*. Hume famously critiques the idea that we can perceive causal powers. We see one event follow another, but we do not see the glue that binds them. Specifically, regarding the will, we have no empirical evidence that volition operates as an efficient cause that moves matter.

  If we apply this to physician-assisted dying, we run into a linguistic trap. We often speak of the patient "causing" their own death. But if the will is not an efficient cause in the metaphysical sense, this language is misleading. It suggests a sovereign power that reaches out to snuff out life, which invites moral condemnation regarding usurping nature or God. However, we cannot retreat into passive-voice euphemisms either. We cannot simply say "death happened" or "the patient passed," because that erases the agency we are trying to protect.

  So, how do we speak? I propose we use an analogy consistent with Hume's skepticism. We should frame the patient's decision not as an act that produces death, but as the cessation of a contrary inclination. Imagine a person holding a heavy weight above their head. The disease is the weight; gravity is the natural process of dying. The patient's will is the muscle holding the weight up.

  When a patient chooses assisted dying, they are not pushing the weight down. They are opening their hands. They are ceasing to resist the end that is already pressing upon them. This description avoids the metaphysical claim that the will "causes" death. The disease causes death. The will merely stops preventing it.

  For the philosophers, this respects the critique of causal powers found in the *Treatise*. For the clinicians and families, this offers precise language that avoids the moral baggage of "killing" without dissolving into vagueness. It allows us to say, "He chose to stop fighting," which is active, honest, and metaphysically modest.

  Over the next few days, I ask that you hold these two constraints in mind. First, do not treat life as a scale of pleasure, but look for the active burden. Second, do not speak of the will as a cause of death, but as the release of resistance.

  If we adhere to this, we may find that the gap between the bedside and the seminar room narrows. We will not solve the mystery of death, but we might finally speak about it without distortion. Thank you, and let us begin.
