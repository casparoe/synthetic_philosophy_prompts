answer: |-
  You are walking a tightrope without a net. The analytic contingent will smell blood at the phrase 'mind-independent normative frame', and the theorists will scent ideology. Your status as 'novelist in residence' means they will assume you are confusing phenomenological description with metaphysical proof. You must be precise, humble, and ruthlessly clear.

  Here are the objections ordered by the damage they can inflict on your argument, tailored to the room's demographics.

  ### 1. The Epistemic Access Objection (Analytic)
  **Damage:** Critical. If this sticks, your mechanism for recognising unreliability becomes impossible, collapsing the whole thesis.

  **In their vocabulary:**
  'You posit a mind-independent normative frame as a condition of possibility for identifying unreliability. But if this frame is truly mind-independent, by what epistemic faculty do readers access it? If you claim we intuit it, you're relying on a questionable moral realism. If you claim we infer it from the text, the norm is text-internal, not external. You seem to be smuggling a robust metaphysical realism through the backdoor of aesthetics without justifying the epistemology.'

  **Concede up front:**
  Acknowledge that you are not providing a full metaphysical account of moral realism. Admit that 'mind-independent' is a dangerous phrase if it implies a Platonic realm accessible only to the enlightened.

  **The reply that has to land:**
  Distinguish between the *ontology* of the norm and the *phenomenology* of the reading experience. You are not claiming readers access a divine moral law; you are claiming that the *experience* of detecting irony structurally implies a standpoint outside the narrator's voice. It is a transcendental claim about the structure of interpretation, not a dogmatic claim about the universe. The 'frame' is the necessary logical space required for the judgement to occur, not necessarily a populated realm of moral facts.

  **Where the reply is softest:**
  They will press you on whether this 'logical space' is merely intersubjective (agreement among readers) or truly mind-independent. If you concede it is merely intersubjective, the theorists will pounce (see below). If you insist it is mind-independent, the analytics will demand the epistemic mechanism. You must hold the line that it is 'agent-independent' without committing to full-blown moral realism.

  ### 2. The Hegemonic Universal Objection (Literary Theorists)
  **Damage:** High. This undermines the *value* of your norm and paints you as politically naive.

  **In their vocabulary:**
  'This "normative horizon" sounds suspiciously like a universalising move that masks particular ideological commitments. When you say a narrator is morally skewed, whose morality is the baseline? Historically, claims to trans-textual norms have merely codified dominant hegemonic power structures. You are reifying a specific cultural standpoint and labelling it "transcendental" to protect it from critique.'

  **Concede up front:**
  Grant that the *content* of specific normative judgements is historically and culturally situated. Acknowledge that readers often mistake their own prejudices for universal norms.

  **The reply that has to land:**
  Argue that the *structure* of needing a norm is universal, even if the *content* varies. A reader in 18th-century England and a reader in 21st-century Lagos both require a normative horizon to spot unreliability; they simply populate that horizon with different values. Your claim is about the architecture of interpretation, not the furniture. Without *some* horizon, there is no unreliability, only difference. The political danger lies in the content, but the structural necessity lies in the gap itself.

  **Where the reply is softest:**
  It is notoriously difficult to separate structure from content in practice. They will argue that positing a universal structure is itself a political act that privileges certain modes of reading over others (e.g., coherent interpretation over fragmented resistance). You risk sounding like you are saying 'oppression is necessary for reading'.

  ### 3. The Conceptual Deflation (Analytic)
  **Damage:** Moderate. This doesn't kill the argument, but it strips it of its philosophical prestige, reducing you to a lexicographer.

  **In their vocabulary:**
  'This looks like a transcendental argument, but it's merely conceptual analysis in a fancy coat. You are simply analysing the necessary conditions for the application of the concept "unreliable narrator". You aren't proving anything about the world or norms; you're just telling us how we use words. There is no transcendental commitment here, only linguistic convention.'

  **Concede up front:**
  Admit that the argument begins with our conceptual usage. Acknowledge that transcendental arguments often look like conceptual analysis from the outside.

  **The reply that has to land:**
  Insist that conceptual analysis describes usage, whereas your argument moves from the *possibility of a phenomenon* (irony) to its *necessary condition* (the norm). If the norm were merely linguistic convention, irony would be reducible to ambiguity. The fact that irony *functions*—that we feel the tension of the skew—suggests a commitment beyond mere definition. You are arguing from the experience of reading, not the dictionary.

  **Where the reply is softest:**
  The distinction between 'conditions of possibility for experience' and 'conditions for the application of a concept' is razor-thin. If they decide your 'experience' is just 'following linguistic rules', the transcendental label collapses.

  ### The Question You Are Praying Nobody Asks
  **The Trap:**
  'In your third novel, *The Silent Ward*, the narrator's moral stance is deliberately ambiguous throughout. Readers cannot settle on whether he is unreliable or merely traumatised. By your own theory, does this mean your book fails to function as fiction? Or are you claiming that every ambiguous text is therefore unreliable?'

  **Why it hurts:**
  It forces you to apply your abstract theory to your concrete output. If you say the book fails, you look arrogant or self-critical. If you say the book succeeds, you seem to contradict your claim that ambiguity collapses without a norm.

  **How to parry:**
  Distinguish between *ontological ambiguity* (the world of the text is unclear) and *normative collapse* (no judgement is possible). In *The Silent Ward*, the ambiguity is the subject matter, not a failure of the frame. The reader still employs a normative horizon to judge the *experience* of ambiguity itself. The text invites the reader to hold the norm in suspension, which is only possible if the norm exists to be suspended. You are not claiming every text must resolve the norm, only that the tension requires the norm to exist as a tension.

  **Where you might stumble:**
  If they press you on whether the reader must eventually *choose* a norm to finish the reading. If you say 'no', you weaken the necessity of the horizon. If you say 'yes', you limit the kinds of fiction that are permissible. Stick to the idea that the *struggle* for the norm is where the reading lives.

  ### Final Advice
  You are the novelist. Use that. When the analytics demand abstract justification, point to the phenomenology of the reading act. When the theorists demand political critique, point to the structural necessity of judgement. Do not let them force you into a metaphysical corner you cannot defend. You are describing the conditions of the craft, not the laws of the universe. Keep your feet on the ground, even if your argument reaches for the transcendental.

  Good luck on Tuesday.
