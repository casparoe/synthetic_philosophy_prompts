      *   *The Mismatch:* In Red Queen, the race *continues*. In *Strangelove*, the Doomsday Machine is an attempt to *stop* the race by making the cost infinite. It's not a race anymore; it's a cliff.
      *   *The "Smuggled" Assumption:* Red Queen assumes survival of the lineage. The nuclear trap threatens the extinction of the lineage. The Red Queen dynamic leads to the Doomsday Machine, but the Machine itself is the end of the Red Queen dynamic. It's the point where the arms race consumes the arena.
