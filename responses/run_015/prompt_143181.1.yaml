answer: |-
  **TO:** Ideas Editor
  **FROM:** [Consultant]
  **RE:** Specification for Grand Historical Narratives

  You are asking for a filter that separates *storytelling* from *explanation*. The market is flooded with the former; the latter requires structural integrity. Below is the spec derived from your half-formed list, validated against current methodological standards.

  I have marked each criterion with its epistemic status: **[CONSENSUS]** indicates methodological agreement among archaeologists/historians (ignoring this makes the book empirically weak); **[LIVE FIGHT]** indicates a theoretical divide (ignoring this makes the book partisan).

  ### I. The Validated Criteria

  **1. The Mechanism Test**
  *Requirement:* The core argument must be statable in one sentence that retains explanatory power when stripped of all anecdotes.
  *Status:* **[CONSENSUS]**
  *Reasoning:* If the mechanism relies on the anecdotes to function, it is illustration, not explanation. Grand narratives often hide circular reasoning behind vivid storytelling.

  **2. The Falsifiability Condition**
  *Requirement:* The author must name a specific archaeological or genetic finding that would prove them wrong.
  *Status:* **[CONSENSUS]**
  *Reasoning:* Without a risk condition, the narrative is unfalsifiable mythology. If everything fits the theory, the theory explains nothing.

  **3. The Two-Clocks Problem**
  *Requirement:* The explanation must account for how the mechanism scales from generational time (psychology/decision) to millennial time (evolution/environment).
  *Status:* **[LIVE FIGHT]**
  *Reasoning:* Most books conflate these. Structuralists prioritize the long clock; agency-focused authors prioritize the short one. A viable spec demands the author acknowledge the gap, even if they privilege one side.

  **4. Portability (The New Guinea Test)**
  *Requirement:* The theory must hold when applied to a region not used as a primary case study (e.g., Andes, Highlands, Arctic).
  *Status:* **[CONSENSUS]**
  *Reasoning:* Cherry-picking Eurasia is the primary failure mode of Eurocentric narratives. If the mechanism is universal, it must travel.

  **5. Category Variation**
  *Requirement:* The book cannot treat "Agriculture," "Civilization," or "Hunter-Gatherer" as monolithic singularities. It must account for internal variation greater than the difference between categories.
  *Status:* **[CONSENSUS]**
  *Reasoning:* Archaeobotany and ethnography confirm these are diverse suites of practices, not switch-flips. Treating them as singular events is empirically false.

  **6. Necessity vs. Contingency**
  *Requirement:* Distinct separation between "this is how it happened" and "this is what had to happen."
  *Status:* **[CONSENSUS]**
  *Reasoning:* Hindsight bias converts contingency into inevitability. The text must explicitly mark where paths could have diverged.

  **7. Teleology Check**
  *Requirement:* The endpoint (us/now) cannot be smuggled in as the cause of the trajectory.
  *Status:* **[CONSENSUS]**
  *Reasoning:* This is the "Whig History" fallacy. Evolution has no direction; history has no destination. Causality must flow from past to present, not present to past.

  **8. Preservation Bias Acknowledgement**
  *Requirement:* Explicit admission that the record is skewed toward stone, dry places, and elite durability.
  *Status:* **[CONSENSUS]**
  *Reasoning:* Organic materials, wood, and perishable institutions vanish. Ignoring this creates a false picture of technological or social dominance.

  **9. Moral Transparency**
  *Requirement:* If grading the past by present standards, the author must declare the metric explicitly rather than implying it is objective.
  *Status:* **[LIVE FIGHT]**
  *Reasoning:* Some argue moral judgment is the point of history; others argue it is anachronistic. The sin is not judging, but hiding the judgment as fact.

  **10. Agency Allowance**
  *Requirement:* The narrative must leave room for refusal, exit, and deliberate institutional design, not just environmental determinism.
  *Status:* **[LIVE FIGHT]**
  *Reasoning:* This is the Diamond (determinism) vs. Graeber/Wengrow (voluntarism) axis. A robust book acknowledges the constraint of structure without erasing the possibility of choice.

  ### II. The Jointly Unsatisfiable Tensions

  You cannot maximize all criteria simultaneously. There are three inherent conflicts you must weigh during commissioning:

  1.  **Elegance vs. Variation:** The *Mechanism Test* demands simplicity (one sentence). *Category Variation* demands complexity (nothing is one thing). A book that satisfies the Mechanism Test will almost always violate Category Variation. *Recommendation:* Prioritize Variation. A simple lie is worse than a complex truth.
  2.  **Scope vs. Portability:** The broader the claim (all human history), the harder it is to pass the *New Guinea Test*. *Recommendation:* Demand the author limit their scope rather than fudge the data.
  3.  **Agency vs. Two-Clocks:** Explaining individual choice (*Agency Allowance*) is easy on the generational clock but nearly impossible on the millennial clock (*Two-Clocks*). *Recommendation:* Accept that the book will privilege one, but penalize it if it claims to have solved both.

  ### III. The Killer Criterion

  If you apply only one filter, use **Category Variation (Criterion 5)**.

  This is the single requirement that knocks out the most books currently on your shelf. It immediately invalidates the "Agricultural Revolution" as a singular event, which collapses the foundational premise of Diamond-style environmental determinism and Harari-style cognitive shifts. It forces the author to engage with the archaeological reality that "farming" in the Andes is not "farming" in the Fertile Crescent, and that "hunter-gatherers" were not a uniform baseline. Books that fail this are not just simplistic; they are describing a world that did not exist.

  ### IV. Consensus vs. Fight Summary

  *   **Settled Science (Ignore at peril):** Preservation Bias, Teleology Check, Category Variation, Falsifiability. These are methodological baseline requirements. A book failing these is akin to a physics book ignoring gravity.
  *   **Theoretical Battles (Choose your poison):** Agency Allowance, Two-Clocks, Moral Transparency. These depend on the book's philosophical aim. A book can be determinist *if* it admits it. A book can be moralistic *if* it declares its metrics. The sin is smuggling these assumptions in as neutral observations.

  ### V. Author Scoring (Brief)

  *   **Yuval Noah Harari:** Fails **Category Variation** and **Teleology**. Excellent mechanism, but the mechanism drives a fictionalized history.
  *   **Jared Diamond:** Fails **Category Variation** and **Agency**. Strong on **Preservation Bias** (sometimes), but treats environmental constraints as destiny.
  *   **Graeber & Wengrow:** Pass **Agency** and **Category Variation**. Occasionally strain the **Two-Clocks** problem and risk **Teleology** by projecting modern political desires onto the Paleolithic.

  **Final Instruction:** Do not commission the "next *Sapiens*." Commission the book that explains why *Sapiens* was a story, not a science.
