      *   **Goal:** Distinguish between "good read" and "worth belief." Provide desiderata for a grand narrative *as an explanation*.
      *   **Constraints:**
          *   No bibliography/citations/reading list.
          *   Mark which points are settled consensus vs. live fights in the field.
          *   Keep author scoring to a few lines at the end.
          *   Length: Around 1,200 words (implied by the context of a review spec, though the prompt asks for the *spec* itself, not a review. I should aim for a concise, skimmable format suitable for a commissioning meeting).
          *   Tone: Professional, sharp, analytical, "editor-to-editor."
      *   **Input Material:** The user provided a list of "half-formed" criteria (mechanism, falsifiability, timescales, portability, category variation, necessity vs. contingency, moral standards, preservation bias, teleology, agency).
      *   **Key Deliverables:**
          1.  Evaluate the user's half-formed criteria (Real vs. Prejudice vs. Negotiable).
          2.  Identify the "jointly unsatisfiable" tensions (trade-offs).
          3.  Identify the single requirement that knocks out the most current books.
          4.  Mark consensus vs. debate status for each point.

  2.  **Deconstruct the User's Criteria:**
      *   *Mechanism in a sentence:* Real requirement. Grand narratives need a core engine.
      *   *Falsifiability (archaeological/genetic sinker):* Real requirement. Science-adjacent history needs risk.
      *   *Two-clocks problem (scaling):* Real requirement. Explanations often fail when moving from micro to macro.
      *   *Portability (New Guinea/Andes):* Real requirement. Avoids cherry-picking.
      *   *Category variation (Agriculture isn't one thing):* Real requirement. Essential nuance.
      *   *Necessity vs. Contingency (had to vs. went):* Real requirement. Avoids determinism.
      *   *Moral standards (anachronism):* Negotiable/Prejudice. Some books *aim* to judge. Needs transparency, not avoidance.
      *   *Preservation bias (stone/dry):* Real requirement. Source criticism.
      *   *Teleology (endpoint as cause):* Real requirement. Avoids hindsight bias.
      *   *Agency (refusing/designing):* Live fight. Structuralists vs. Agency-focused.

  3.  **Drafting the Spec - Section by Section:**

      *   **Introduction:** Acknowledge the editor's plight. Set the stage.
      *   **The Filter (Evaluating the User's List):** Go through the provided points. Classify them.
      *   **The Tensions (Unsatisfiable Conflicts):** Where do these criteria fight each other? (e.g., Simplicity vs. Accuracy).
      *   **The Killer Criterion:** Which one kills the most bad books? (Likely the "Two-Clocks" or "Teleology" or "Category Variation"). Let's go with *Category Variation* or *Teleology*. Actually, *Teleology* (smuggling the endpoint in) is the most common sin of *Sapiens*-style books. But *Category Variation* (treating "Agriculture" as monolithic) is the most common *factual* sin. Let's pick the "Mechanism without Anecdote" or "Falsifiability." No, the prompt asks which single requirement knocks out the most books. I'll argue for **The Two-Clocks Problem** or **Teleology**. Let's go with **Teleology/Endpoint Bias** because it undermines the *explanation* itself. Actually, looking at the field, the biggest sin is usually **Category Collapse** (treating "Hunter-Gatherer" as a single stable state). I will select **Category Variation** as the killer because it invalidates the premises of Diamond-style environmental determinism immediately.
      *   **Consensus vs. Fight:** Need to clearly tag these.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Word Count:* The prompt mentions a "~1,200-word review" as the *context* for the editor's work, but asks *me* to write the spec. The spec itself should be concise enough to skim in a meeting. I shouldn't strictly hit 1,200 words for the *spec*, but keep it tight. The prompt says "Keep the scoring of actual authors to a few lines at the end; the criteria are the deliverable."
      *   *Tone:* Needs to be authoritative but not academic.
      *   *Consensus Marking:* I need to be careful here. Archaeology is rarely "settled." I should use terms like "Methodological Consensus" vs. "Interpretive Fight."
      *   *The "Half-Formed" List:* I need to explicitly validate these.
      *   *The "Unsatifiable" Part:* This is crucial. Elegance vs. Truth.

  5.  **Finalizing the Criteria Selection:**
      *   *Real Requirements:* Mechanism, Falsifiability, Two-Clocks, Portability, Category Variation, Teleology, Preservation Bias.
      *   *Negotiable/Prejudice:* Moral Standards (depends on the book's aim), Agency (this is the big theoretical fight).
      *   *The Killer:* **Category Variation.** If you treat "Agriculture" as a single event, you are already wrong. This kills Diamond and Harari immediately.
      *   *Consensus:* Preservation bias is settled. Teleology is a logical fallacy (settled). Category variation is settled (archaeologists know agriculture was diverse). Agency is a fight. Moral judgment is a fight.

  6.  **Drafting the Response (incorporating the constraints):**
      *   *Header:* To: Ideas Editor. From: [AI]. Re: Grand Narrative Spec.
      *   *Section 1: The Validated Criteria.* (Grouping the user's list).
      *   *Section 2: The Trade-offs.* (Where the criteria conflict).
      *   *Section 3: The Killer Criterion.*
      *   *Section 4: Consensus vs. Fight.* (Integrated or separate? Prompt says "mark, per requirement or in a short section at the end." I'll do per requirement for clarity).
      *   *Section 5: Author Scoring.* (Brief).

      *(Self-Correction on Consensus Marking)*: The prompt asks to "mark, per requirement or in a short section at the end... which points are settled... and which are live fights." I will add a specific tag to each criterion for clarity.

      *(Self-Correction on Word Count)*: The prompt mentions the *review* is 1,200 words. It doesn't strictly limit *my* output to 1,200, but "in a form I can skim" suggests brevity. I will aim for high density.

      *(Refining the "Agency" point)*: The user says "leave room for people refusing... not just being pushed." This is the Graeber/Wengrow vs. Diamond axis. This is definitely a *live fight*, not settled consensus. I need to mark that clearly.

      *(Refining the "Moral" point)*: "Grading the past by present moral standards." This is the "Whig history" problem. Most historians agree you shouldn't do it *unconsciously*, but doing it *explicitly* is a valid philosophical choice. So it's a transparency requirement, not a prohibition.

  7.  **Final Polish:** Check against "No bibliography," "Blunt about confidence," "Skimmable."

      *Let's structure the "Consensus/Fight" status clearly.* I will use bold tags like **[CONSENSUS]** and **[LIVE FIGHT]**.

      *Let's identify the "Killer Criterion".* I think **Category Variation** is the strongest. If a book treats "The Agricultural Revolution" as a singular, global, inevitable shift, it is empirically dead on arrival according to current archaeobotany. This kills Diamond and Harari. Graeber/Wengrow survive this but might trip on others.

      *Let's identify the "Unsatifiable" tension.* It's between **Mechanism Simplicity** (one sentence) and **Category Variation** (nothing is one thing). You can't have a one-sentence mechanism if the variables are infinitely complex.

      *Okay, ready to write.*

      *(Wait, one last check on the "Author Scoring")*: "Keep the scoring of actual authors to a few lines at the end." I need to briefly mention Harari, Diamond, Graeber/Wengrow in the context of the spec.

