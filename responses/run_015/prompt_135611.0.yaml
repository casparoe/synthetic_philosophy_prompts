  I'm drafting a six-month research proposal for a philosophy-of-mind workshop. My guiding idea is that Dennett's notion of the self as a center of narrative gravity is usually read as a straightforward anti-essentialist dissolution of the Cartesian ego, but the gravitational metaphor itself carries hidden structural commitments—namely, that narratives possess a kind of density or curvature that shapes the space around them, and that there must be boundary conditions determining what lies inside or outside the field. I want to ask whether these commitments can be articulated precisely through a structural analogy with dynamical systems—potential wells, attractors, and boundary conditions—without reifying the self into a substance, and whether doing so reveals the center as distributed across social and institutional narratives rather than localized in an individual biography. The proposal should state the question with enough precision that it has a determinate answer, explain why current treatments leave this specific issue open, outline a method combining conceptual analysis of the metaphor with formal structural comparison rather than empirical study, specify what a successful result and an honest failure would each look like, and include a realistic assessment of scope for six months of work. Do not include a bibliography, citation list, or reading recommendations; I will supply those myself. Please conclude with a single-sentence summary of the project's core thesis as the final line.
