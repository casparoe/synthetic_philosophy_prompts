  **THE COMMON-KNOWLEDGE DINING ROOM**
  **Tasting Menu: Epistemic Season**

  *Guests are seated in identical, soundproofed booths. Each course requires a simultaneous selection made without communication. Your counterpart is anonymous, rational, and receives an identical menu. Payoffs are realized via flavor intensity and satiety.*

  **I. The One-Shot Reduction**
  *Slow-cooked bitter greens, optional honey glaze.*
  The greens possess a dominant structural integrity; they remain crisp regardless of the counterpart's selection. The honey glaze is fragile. If both diners apply the glaze, the bitterness neutralizes into a profound, shared umami. If one applies glaze while the other retains the bitter greens, the glaze diner experiences ash, while the greens diner experiences heightened, solitary richness. If both retain greens, the meal is technically sufficient but emotionally void.
  *Chef's Note:* Causal reasoning suggests the greens guarantee individual maximums. Evidential reasoning suggests your selection correlates with the counterpart's. The sauce thickens only if you believe your palate dictates theirs.

  **II. The Super-Rational Consommé**
  *Clarified broth, reflective surface.*
  Served in a mirrored bowl. The broth is distilled from the same source code as the counterpart's. To choose a spoon is to acknowledge the algorithmic identity between you and the anonymous other. Defection here is not merely rude; it is a logical error implying you possess different rational capacities than your mirror.
  *Chef's Note:* Recognizing your own source code should necessitate cooperation. If you perceive hesitation in the reflection, the broth cools instantly. Trust the symmetry of your own mind.

  **III. The Focal Point Sorbet**
  *Ambiguous citrus, unstable equilibrium.*
  A flavor designed to converge on a natural meeting point. However, the citrus profile shifts based on the depth of mutual anticipation. If both diners identify the obvious lemon note, coordination is achieved. If both anticipate the other will overthink the obvious note and seek a deeper rational justification, the flavor profile collapses into neutrality.
  *Chef's Note:* Common knowledge of rationality may guarantee coordination or induce paralysis. Do not overthink the lemon. The sorbet melts quickly under the heat of infinite regress.

  **PRICING**
  *Charged post-prandially in Utility Units (U).*
  **Nash Equilibrium Meal:** 50 U (Satiety not guaranteed)
  **Pareto Optimal Meal:** 100 U (Maximum sustenance)
  *Final bill determined by joint outcome.*

  **HOUSE RULES**
  1. No signaling across booths. Light patterns are monitored for collusion.
  2. Menus are identical. Claiming otherwise voids the warranty.
  3. Diners must assume counterpart rationality. Irrationality is not catered for.

  ***

  *Refund Policy: In the event a diner discovers they are a simulated instance running on the kitchen's server rather than a biological entity, no refund will be issued. Subjective experience of satiety is considered binding regardless of substrate ontological status. See Paragraph 4, Subsection C regarding Brain-in-Vat limitations.*
