answer: |-
  You have not just described three different things as one; you have accurately reconstructed a specific, high-stakes dynamic from game theory and international relations that often goes unnamed in casual discourse.

  The established concept you are looking for is indeed the **Commitment Race**, but your intuition that the standard label feels slightly "off" is correct. The standard textbook definition often assumes a rational equilibrium where one side commits and the other yields. Your description captures the *pathological* version of this race, where the escalation continues because both sides are racing to bind themselves to a third party.

  In political science and economics, the specific mechanism you identified (recruiting a third party to punish reversal) is called **Audience Costs**.

  If you want a tight label for the specific phenomenon you observed—the competitive spiraling of irreversible constraints enforced by third parties—I propose we call it **Competitive Hand-Tying**.

  Here is the carving you asked for.

  ### 1. The Core Concept: Competitive Hand-Tying
  This is a subset of **Strategic Precommitment** (Schelling, 1960).

  In a standard precommitment, one actor binds themselves to make a threat credible (e.g., "I will strike if you cross this line, and I have wired the detonator to a dead man's switch").
  In **Competitive Hand-Tying**, two or more actors are racing to bind themselves *first* to force the other into a concession, using **Audience Costs** as the binding agent.

  *   **The Goal:** Not to improve capability, but to remove discretion.
  *   **The Mechanism:** Delegating enforcement to a third party (voters, markets, regulators) who will punish backtracking.
  *   **The Dynamic:** A race where the payoff is strictly ordinal (being first matters more than the absolute quality of the commitment).

  ### 2. Why "Commitment Race" felt wrong to you
  You noted that "Commitment Race implies a finish line, which mine doesn't have."

  In game theory textbooks, the race ends when one player successfully commits, forcing the other to yield (a Stackelberg equilibrium). However, in the real world (especially politics or corporate strategy), you often see a **Commitment Spiral**. This happens when both sides successfully tie their hands simultaneously.
  *   **The Finish Line:** In the healthy version, the finish line is *concession*.
  *   **The Crash:** In the pathological version (which you are observing), the finish line is *collision*. If both parties successfully remove their ability to back out, the system breaks. The "lack of a finish line" you observe is actually the warning sign that the race has entered a zone of mutual infeasibility.

  ### 3. The Diagnostic (The Carving)
  To distinguish **Competitive Hand-Tying** from a Capability Race, a War of Attrition, or simple Bluffing, you must observe these four markers. If any are missing, it is not this phenomenon.

  #### Marker A: The Capability/Credibility Divergence
  *   **Observation:** Resources are being spent, but technical/operational capacity is *not* increasing.
  *   **The Test:** Ask: "If the opponent vanished tomorrow, would this expenditure still make the project/product/policy better?"
      *   **Yes:** It is a Capability Race.
      *   **No:** It is likely Hand-Tying. The value is purely relational/psychological.
  *   **Example:** A company announcing a release date they know is tight. The code doesn't get written faster by the announcement; the *market's expectation* gets locked.

  #### Marker B: The Third-Party Enforcer (The Audience)
  *   **Observation:** The cost of reversal is not intrinsic; it is socially or contractually mediated.
  *   **The Test:** Ask: "Who punishes them if they change their mind?"
      *   **Physics/Engineering:** (The bridge collapses) → Not this.
      *   **Internal Will:** (I feel bad) → Not this (that's Ulysses Pact).
      *   **External Agent:** (Shareholders sue, voters vote them out, the press ruins them) → **This is Competitive Hand-Tying.**
  *   **Crucial Nuance:** The "harsher audience" escalation you described is the smoking gun. If they are shopping for a regulator or journalist who will make backing down more painful, they are hand-tying.

  #### Marker C: Irreversibility of Discretion, Not Action
  *   **Observation:** They *can* physically stop, but they *won't* economically/socially.
  *   **The Test:** Ask: "Is the door locked, or is the key just too expensive to use?"
      *   **Locked:** (Burning Boats) → Close, but usually one-sided.
      *   **Expensive Key:** (Audience Costs) → **This is it.**
  *   **Differentiation:** In "Burning Boats," the option is physically gone. In Hand-Tying, the option remains but is priced out of existence by the third party. This allows for the "shopping for a harsher audience" dynamic you noticed.

  #### Marker D: First-Mover Dominance in Constraint
  *   **Observation:** The value of the move decays to zero if the other side does it first.
  *   **The Test:** Ask: "If Side B makes the same pledge tomorrow, do they gain anything?"
      *   **Yes:** It is a Signaling Race or Norm Setting.
      *   **No:** Side B looks like a follower or a reactor, gaining no credibility boost. → **This is Competitive Hand-Tying.**

  ### 4. How it differs from your exclusions

  | Concept | Your Intuition | The Actual Distinction |
  | :--- | :--- | :--- |
  | **Burning Boats** | "One side doing it once." | **Correct.** Burning boats is unilateral. Competitive Hand-Tying is *bilateral escalation*. Also, boats are physical; Hand-Tying is reputational/contractual. |
  | **Ulysses Pact** | "I don't change my mind." | **Correct.** Ulysses is internal (Self vs. Future Self). Hand-Tying is external (Self vs. Opponent via Third Party). |
  | **Chicken** | "Look committed, keep option to swerve." | **Partial.** Standard Chicken involves bluffing. **Commitment Race Chicken** involves *actual* commitment. Your scenario is the latter. The difference is that in your scenario, they *actually* hand over the steering wheel. |
  | **All-Pay Auction** | "Money goes to somebody." | **Correct.** In an auction, the auctioneer gets the money. In Hand-Tying, the value is *destroyed* (sunk cost) to create credibility. The "payment" is the loss of flexibility. |
  | **War of Attrition** | (Not listed, but relevant) | In Attrition, you pay costs *over time* waiting for the other to quit. In Hand-Tying, you pay a cost *upfront* to remove the ability to quit. |

  ### 5. Real-World Examples (To validate the carving)

  1.  **WWI Mobilization Schedules:**
      *   **Capability:** No. The trains didn't run faster.
      *   **Hand-Tying:** Yes. Generals told Kings, "If we stop mobilization, the logistics will collapse, and we will be invaded." The "third party" was the logistical reality enforced by the military bureaucracy.
      *   **Race:** Germany had to mobilize before Russia, or be stuck. Russia had to mobilize before Germany, or be stuck.
      *   **Result:** Commitment Spiral → Collision.

  2.  **Corporate Earnings Guidance:**
      *   **Capability:** No. Announcing a target doesn't help hit it.
      *   **Hand-Tying:** Yes. The "third party" is the SEC and shareholders who will sue or dump stock if you miss.
      *   **Race:** If Competitor A sets a bold date, Competitor B must match it or look weak.
      *   **Result:** Both lock into unrealistic timelines.

  3.  **Political Primary Pledges:**
      *   **Capability:** No. Pledging "No New Taxes" doesn't balance the budget.
      *   **Hand-Tying:** Yes. The "third party" is the primary voters who will vote you out in the next cycle.
      *   **Race:** Candidate A signs the pledge. Candidate B must sign it or look soft.
      *   **Result:** Both are locked into policy they might privately know is unworkable.

  ### Summary Definition
  **Competitive Hand-Tying** occurs when:
  1.  **Competitors** seek an advantage not by improving **capacity**, but by reducing **flexibility**.
  2.  **Credibility** is purchased by inviting **third-party punishment** for reversal (Audience Costs).
  3.  **Value** is determined by **order** (who binds themselves first), not magnitude.
  4.  **Negotiation** is precluded because pausing to talk allows the opponent to bind themselves first.

  You are not imagining it. It is a distinct, dangerous, and well-documented structural trap. The reason it feels unnamed is that while game theorists study the *math* of it (Schelling), and political scientists study the *mechanism* (Fearon's Audience Costs), few have a catchy phrase for the *competitive spiral* of the two combined. **Competitive Hand-Tying** is the carve.
