answer: |-
  Thanks for sending this over. It is a sharp way to frame a messy debate, and I appreciate that you are asking for decomposition rather than just a verdict. My headline credence on your proposition is 0.4. I am slightly more optimistic than you but significantly more skeptical than your friend, and I think the gap between us is explainable once we unpack the mechanics of how philosophy actually moves. I am not highly confident in this number, maybe 0.6 confidence in the number itself, because predicting institutional dynamics over a century is inherently noisy, but I will walk you through how I got there.

  To start with the secession credit term you mentioned, which is whether questions handed off to science count as philosophical progress. I assign a 0.8 probability that questions like the nature of life or the structure of language will continue to migrate to biology and linguistics, but only a 0.5 probability that this counts toward your retirement criterion in the way you intend. The definition you gave includes questions set aside as ill-posed or split into sub-questions, which technically covers secession, but there is a persistent philosophical residue that refuses to dissolve. For example, even if neuroscience explains consciousness mechanisms, the hard problem often reasserts itself rather than vanishing. So while I think about five of the thirty questions will effectively secede, I am only counting about three of them as stable retirements because the philosophical version tends to linger as a conceptual shadow even after the empirical work is done. This is likely where you and your friend diverge most sharply. If your friend works in a successor discipline, they likely see the handoff as a successful completion of the project, whereas you seem to view it as the question escaping the field before it was solved. I suspect this valuation difference accounts for at least 0.15 of the gap between your 0.35 and their 0.7.

  On the question of whether agreement is driven by argument or by fashion and generational turnover, I give a 0.7 probability that turnover is the dominant driver. Philosophy does not have a knockout punch mechanism, so consensus usually arrives when the generation holding the old view dies out rather than because they were logically refuted. This actually helps your proposition slightly because it means progress does not require solving the hard problems, only outlasting the dissenters. However, this introduces instability. If consensus is demographic rather than evidential, it is vulnerable to reversal. I assign a 0.4 probability that any consensus reached this way will remain stable above 70 percent for more than a decade, which is why I am not raising my headline number higher. If agreement were driven by proof, I would be more confident in the stability, but since it is driven by pipelines, the 70 percent threshold is fragile. This is the second biggest wedge between you and your friend. They likely assume that convergence implies convergence on truth or best argument, while you are likely modeling it as convergence on vocabulary or professional norms, which makes you doubt the permanence of the retirement.

  Regarding whether dissolution counts as progress or just giving up, I assign a 0.6 probability that successful dissolution will happen for at least a few questions, but only a 0.3 probability that it will be recognized as such by the majority of the field. Dissolution requires everyone to agree the question was bad, which is itself a philosophical claim that generates disagreement. For instance, claiming the free will question is ill-posed often just shifts the debate to whether the dissolution was legitimate. So while I think dissolution is a viable path for retirement, I discount its contribution to your total because it rarely achieves the stable 70 percent acceptance you require. It usually splits the room between those who think the question is dissolved and those who think the dissolvers are confused. This ties into whether the questions admit determinate answers. I give a 0.5 probability that at least some of the thirty questions are genuinely factual rather than conceptual or normative. If half the questions are actually disagreements about what to care about dressed up as truth claims, they cannot be solved, only outvoted. Your friend likely assumes most questions are truth-apt, while you seem to suspect many are verbal or normative, which lowers your expectation of resolution.

  Finally, on the time horizon, I give a 0.6 probability that one hundred years is enough for significant movement. A century is three or four academic generations, which is enough for a paradigm shift if one is possible, but philosophy has shown remarkable inertia over the last century. The questions from 1925 are largely the questions of 2025. However, the rate of change might be accelerating due to interdisciplinary pressure. I am combining these by estimating the expected number of retired questions. I expect about three from secession, two from demographic consensus, and two from stable dissolution, totaling seven. Since you need ten to hit the one-third threshold, I fall short of your proposition, hence the 0.4 credence. I am treating this as a Poisson-like process where the rate is slightly below the required threshold. The number is most sensitive to the dissolution term. If you convince me that dissolution is more stable than I think, or that recognizing a question as ill-posed commands quicker consensus than I expect, my number would jump to 0.6. Conversely, if you argue that secession should not count at all, my number drops to 0.25.

  I should be upfront that I think your setup has a structural weakness, though it is not broken enough to refuse the game. The 70 percent threshold is doing a lot of work here, and it is arguably arbitrary. Consensus in philosophy has historically been a poor indicator of truth, as seen in the history of logic or metaphysics where majority views have flipped repeatedly. By defining progress as retirement via consensus, you might be measuring institutional consolidation rather than epistemic progress. Additionally, the list of thirty questions is not static. New questions emerge as old ones retire, so the denominator might shift, though I understand you are fixing the list to the current canonical set. The falsifiability is also tricky because determining stable acceptance in 2125 requires looking back from 2135, and distinguishing between stable acceptance and temporary fashion will be hard for historians then too. Despite these issues, the operationalization is good enough for a bet.

  To answer your specific worry about where you and your friend are disagreeing, I agree with your suspicion that secession credit is the primary wedge, but I think there is a secondary disagreement about the nature of dissolution. Your friend likely views the dissolution of a question as a successful clarification that saves us from wasting time, counting it as a win for the field. You seem to view it as a failure to engage with the substantive issue, or at best a lateral move that does not constitute progress on the original truth claim. If you two could agree on whether a question handed off to cognitive science counts as a point for philosophy or a point against it, you would probably meet in the middle around 0.5. I would shift my probability up if you showed me historical cases where philosophical dissolution remained stable for over fifty years, and I would shift it down if you showed me cases where 70 percent consensus reversed within a century. I hope this helps you settle the bet, or at least clarifies why you are talking past each other.
