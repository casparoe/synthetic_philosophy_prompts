      *   *Prerequisite Idea:* Physicalism vs. Phenomenalism. Students need to secure why Neurath rejected Carnap's "I see red now" protocols. They need to understand that for Neurath, science must be public and intersubjective. Private experience is out. Therefore, protocols must be physicalistic (spatio-temporal coordinates). *Before* pictures make sense as protocols, students must accept that words alone (in natural language) were seen as prone to metaphysical slipperiness, but private sense-data were unacceptable. The bridge is: How do we make public observation statements standardized enough to avoid metaphysical drift but physicalistic enough to be shared?
      *   *The Concrete Scenario:* Needs to show transformation of data into visual form. A statistical representation of social data fits Neurath's actual work (museum of society). Let's use "Unemployment in Vienna, 1930."
