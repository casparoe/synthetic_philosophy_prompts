prompt: |-
  I'm preparing a seventy-five-minute session for philosophy-of-science graduate students who know Carnap's protocol sentences and Quine's web of belief but have only encountered Otto Neurath as the author of the boat metaphor. I want them to understand his ISOTYPE project not as decorative illustration but as an attempt to build a standardized visual protocol-language—one that he still insisted could not serve as a theory-neutral observational foundation. Plan the teaching arc: which idea has to be secured before the picture-language proposal even sounds plausible (and why opening with the boat undermines the point), the one concrete scenario that should carry the session—something that forces students to see both the syntactic rigor and the unavoidable conventional choices in visual representation—and what that scenario must include and exclude, the misconceptions they will arrive with or form in sequence (for instance, that pictures simply bypass interpretation, that ISOTYPE was a logical-positivist reduction of science to sense-data, or that Neurath sought private mental images), the precise point in the arc where each should be intercepted, the end-of-session check that distinguishes grasping the tension from merely repeating that 'pictures need rules,' and what I should openly declare out of scope for this window. Write in American English. End with a final line beginning 'Summary:' followed by a one-sentence summary of the core pedagogical strategy.
