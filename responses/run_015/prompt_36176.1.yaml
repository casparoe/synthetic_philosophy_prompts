answer: |-
  This is one of the hardest challenges a historical society can face, but it is also an opportunity to create a much richer, more honest piece of public history. You are correctly identifying the logical trap in the committee's debate: **Selective Historicism.** You cannot use the "standards of the time" defense to excuse harm while simultaneously using "standards of our time" to praise virtue. If the doctor gets credit for funding a Black school in an era of segregation (a progressive act), he must accept responsibility for sterilizing the poor in an era where eugenics was debated (a harmful act).

  Here is how you should approach the exhibit, the principle behind it, and the specific questions nagging at you.

  ### The Principle: Moral Agency Within Context
  The guiding principle for your exhibit should be **consistent moral agency.** We judge historical figures not by whether they broke the law, but by whether they engaged with the moral debates of their time. If an action was universally accepted and unquestioned (like wearing wool coats in winter), it is neutral context. If an action was contested, debated, or targeted vulnerable populations without consent (like sterilization or funding integrated schools), the actor made a choice.

  This principle solves your second nagging thought. If you excuse the sterilization because "everyone did it," you must logically subtract credit for the Black school because "everyone was segregated." If you give him credit for the school because he was *ahead* of his time on race, you must hold him accountable for the sterilizations because he was *aligned* with a harmful movement that others were already fighting. You cannot have it both ways.

  ### The Evidence of Dissent
  Your first nagging thought is historically crucial. The existence of contemporaneous dissent matters immensely. It proves that eugenics was not an inevitable force of nature like gravity; it was a policy choice. When your doctor published his article defending sterilization as "public health," he was entering a debate, not stating a fact. The fact that ministers and other doctors opposed the sterilization bill shows that the moral framework to oppose him existed. He chose the side of coercion. This doesn't necessarily make him a monster in a vacuum, but it removes the "ignorance" defense. He knew there was opposition and proceeded anyway.

  ### Exhibit Strategy: Integration, Not Erasure or Dominance
  Do not follow Member A (lead with the scandal) or Member B (hide behind context). Member A turns the exhibit into a prosecution, which can make visitors defensive. Member B turns it into a hagiography, which destroys trust.

  Instead, follow a modified version of Member C's approach, but with curatorial intent. **Integrate the sterilization into the narrative of his public health work.**
  *   **The Narrative:** Frame his legacy around his definition of "Public Health." To him, health meant vaccines and schools, but it also meant removing those he deemed "unfit." This is historically accurate. The Progressive Era often combined social welfare with social control.
  *   **The Display:** Place the sterilization records near the vaccination records. Let visitors see the parallel: one saved lives through immunity, the other prevented lives through coercion. Both were done in the name of science and community good.
  *   **The Takeaway:** This allows visitors to feel the complexity. They can acknowledge the good (the hospital, the school) without ignoring the cost (the 60 patients). This makes the history *more* compelling, not less. It transforms the doctor from a cardboard saint into a real human being capable of both great generosity and great harm.

  ### The Name on the Building
  The exhibit's job is education, not advocacy. I recommend the exhibit present the facts clearly so the *community* can decide on the name, rather than the historical society petitioning for removal as part of the exhibit. If the exhibit is honest, the public will have the information they need to pressure the county. If the exhibit becomes a political petition, it risks losing its authority as a trusted source of truth. Let the history speak; let the voters decide.

  ### Summary
  Trust your visitors. People are capable of holding two truths at once: that this man built the institutions that care for us today, and that he violated the bodies of the vulnerable to do it. That tension is exactly what history is for.

