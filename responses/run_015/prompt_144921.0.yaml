prompt: |-
  You are an expert in philosophy of mind and an experienced seminar facilitator. Before drafting the activity, briefly brainstorm three ways students might instinctively revert to binary thinking about animal consciousness, and identify one conceptual feature of gradualism that a live exercise can never fully capture.

  Design a 60-minute classroom activity for a philosophy-of-mind graduate seminar of 8 students that makes participants feel the pressure of applying a gradualist, non-binary view of phenomenal consciousness across animal species—specifically, the idea that if consciousness admits of degrees of intensity rather than being all-or-nothing, then standard moral frameworks that divide beings into persons and non-persons become unstable. The scenario should place students in a structured deliberation with real (small) stakes: they must allocate a fixed pool of welfare resources among human patients, octopuses, and insects based on assigned "phenomenal weight" coefficients that they do not choose and that contain no sharp cutoff. Include explicit roles or rules, a minute-by-minute timeline, and a debrief that maps moments of conflict in the exercise back onto parts of the gradualist position.

  In the debrief, say what will predictably go wrong (for example, participants manufacturing hidden thresholds to avoid paralysis), how the facilitator should handle it, and be frank about which feature of the idea—the metaphysical absence of a boundary—the activity can reproduce experientially and which feature it must leave to direct argument.

  Write your response in American English, keep it focused, and do not include bibliographies, reading lists, or citations.
