          *   Close with limitations/systematic misfires.

  2.  **Deconstruct the Ethical Standard (Lexical-Threshold Negative Utilitarianism):**
      *   *Below Threshold:* Pain and pleasure/benefit are commensurable (tradeable). Cost-benefit analysis applies.
      *   *At/Above Threshold:* Pain has lexical priority. No amount of benefit justifies it. Protocol fails *unless* pain is mitigated below the line.
      *   *Negative Utilitarianism:* Focus on minimizing suffering rather than maximizing happiness.
      *   *Lexical:* Hierarchy. Severe pain trumps all else.

  3.  **Drafting the Procedure (The "How-To"):**
      *   *Goal:* Make it operational for laypeople. Avoid jargon where possible, but keep the logic strict.
      *   *Step 1: The Ledger (Scope).* What counts?
          *   Patient pain (physical).
          *   Patient psychological (dread, memory/trauma).
          *   Parental distress? (Tricky. Standard NU usually focuses on the subject, but in pediatrics, family suffering matters. Let's include it as secondary but distinct).
          *   *Decision:* Include patient physical, patient psychological (dread/memory), and parental distress *witnessing* pain. Exclude general resource costs unless they impact care.
      *   *Step 2: Locating the Threshold (Ordinal Data).*
          *   We don't have "pain units." We have FLACC scales, NIPS, parent reports.
          *   *Solution:* Define the threshold behaviorally/clinically. E.g., "Inconsolable crying," "Physiological instability," "Reported 8/10."
          *   *Disagreement:* If *any* credible observer (nurse/parent) rates it above threshold, treat as above threshold (Precautionary Principle). This protects the vulnerable.
      *   *Step 3: Intensity vs. Duration.*
          *   Below threshold: Multiply intensity × duration (roughly).
          *   Above threshold: Duration doesn't matter for the *prohibition*. One second of torture is forbidden. But for comparing two forbidden protocols (if we must choose the 'least bad'), duration might break ties.
      *   *Step 4: Present Pain vs. Future Benefit.*
          *   Below threshold: Trade allowed.
          *   Above threshold: Trade forbidden. Future health gain cannot justify current severe pain.
      *   *Step 5: Choosing Between Two "Above Threshold" Protocols.*
          *   If *both* violate the rule, strictly speaking, both should be rejected.
          *   *Real-world constraint:* Sometimes one *must* be chosen (e.g., treating a life-threatening condition requires painful intervention).
          *   *Procedure:* If both are above threshold, reject both *unless* medical necessity dictates action is required to save life/prevent greater harm. If action is mandatory, choose the one with the *fewest individuals* crossing the threshold (Non-aggregation principle). Do not sum the pain. Minimize the *number* of rights violations.
      *   *Step 6: Decision Points.*
          *   Stop = "No" (Above threshold, mitigations failed).
          *   Defer = "Committee Vote" (Below threshold, benefits vs. burdens unclear).

  4.  **Applying the Procedure to the Three Protocols:**

      *   **Protocol (i): Newborns (200), severe pain, seconds, no anesthetic (workflow), alternative = sedative (fatal risk).**
          *   *Pain:* Severe (Above Threshold).
