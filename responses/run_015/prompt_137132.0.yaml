      *   *Tone:* Professional, clinical, procedural, yet honest about the ethical weight.
      *   *Structure:*
          1.  The Procedure (The "Algorithm").
          2.  Application to Cases.
          3.  Limitations/Misfires.
      *   *Constraint Check:* "Mark where the procedure stops with a no, and where it hands the decision back to us." "Close by saying what the procedure cannot do."

  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Threshold Definition:* How do laypeople define "lexical threshold"? I need to give them a concrete anchor. "Inconsolable," "Physiological compromise," "FLACC > 7."
      *   *Disagreement:* If a parent says 10/10 and nurse says 4/10. Precautionary principle: Assume 10/10. The child is vulnerable.
