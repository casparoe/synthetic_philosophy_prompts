          *   If Option A is above threshold, it's forbidden. Option B is the alternative. If Option B is the only way to avoid Option A, and Option A is forbidden... this is a hard stop.
          *   *Outcome:* The procedure likely kills Protocol (i) as written. It demands the pain be removed. If the only way to remove pain carries fatal risk, that's a medical judgment, but ethically, you cannot inflict the severe pain. You must find a third way or accept the risk of the sedative. But if the protocol *is* the unanaesthetised procedure, it's a No.

      *   **Protocol (ii): 40 Children, 6 months, moderate pain, substantial health gains, pride/relief after.**
          *   *Pain:* Moderate (Below Threshold).
          *   *Analysis:* Trading is allowed.
          *   *Ledger:* Pain (moderate, long duration) vs. Health Gain + Pride.
          *   *Outcome:* **DEFER TO COMMITTEE.** The procedure allows the trade. The committee must weigh if the moderate pain is worth the gain. It doesn't mandate a "No."

      *   **Protocol (iii): Choice between Two Above-Threshold Protocols.**
          *   *Option A:* 30 children, higher peak.
          *   *Option B:* 120 children, lower (but still above) peak.
          *   *Analysis:* Both are above threshold. Aggregation is forbidden (we can't say 120 * low > 30 * high).
          *   *Lexical NU Priority:* Minimize the number of rights violations (people subjected to impermissible pain).
          *   *Outcome:* **CHOOSE OPTION A (30 children).** Even though peak is higher, fewer individuals cross the lexical line. This is the "Non-Aggregation" result.
          *   *Unpalatable:* Sacrificing the 30 to intense pain to save the 120 from "lesser" severe pain. Or, if both are forbidden, we reject the treatment entirely. But if we *must* choose, we minimize the count of victims.

