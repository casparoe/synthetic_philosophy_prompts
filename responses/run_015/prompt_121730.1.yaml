answer: |-
  Dear colleague,

  It is a pleasure to hear that your reading group has reached the point where updateless decision theory is the natural next step, and I share your concern that the final session should crystallize the conceptual shift through experience rather than exposition. The difficulty you identify is genuine: if the agents know they are in the losing branch, paying looks irrational, but if they do not know, it looks like standard expected utility maximization behind a veil of ignorance. To resolve this in a ninety-minute session without relying on a contested predictor, you need a mechanism that mechanically binds the later action to the earlier policy while leaving enough psychological space for the students to feel the tug of the updateful impulse. The following design uses a sealed-envelope protocol combined with a conditional voucher system to simulate the updateless standpoint, forcing the conflict to arise from the tension between holding a reward and having to pay to claim it.

  You will need to prepare two types of envelopes and a set of vouchers in advance. For a group of fourteen, prepare fourteen state envelopes, ten marked Green and four marked Red, shuffled so no one knows their distribution. Green represents the common branch where paying is cheap or neutral, and Red represents the improbable branch where paying is a pure loss given the state. You will also need policy slips and vouchers worth course points or chocolate tokens. The session begins with ten minutes of rule-setting where you explain that this is a game of policy selection, not just action. Each student receives a policy slip and must write down a complete strategy before touching their state envelope. The strategy must specify an action for both states: for example, If Green then Keep, If Red then Keep, or If Green then Keep, If Red then Pay. Emphasize that this slip is their binding commitment for the purpose of payoff calculation. Once all slips are collected and sealed in a box, you distribute the state envelopes. Students open them simultaneously. At this point, they know whether they are in Green or Red. You then hand out vouchers to those whose policy slips indicated they would Pay in the Red state. The voucher is worth a significant amount, say twenty points, enough to outweigh the cost of paying. However, you announce the crucial rule: the voucher is only redeemable if their actual action matches their written policy. They now have five minutes to decide whether to actually pay the cost (say five points) into a central pot or keep their endowment. Those in the Green state will find paying easy or irrelevant. Those in the Red state will hold a twenty-point voucher but face a five-point cost to validate it. Here is where the conflict lives. An updateful agent reasoning from the Red state sees the voucher as already theirs because the policy was already submitted and verified, so paying the five points feels like a sunk cost or a fee for no new gain. An updateless agent recognizes that the voucher was never theirs unconditionally; it was theirs only relative to the policy that required paying in this exact scenario. They must pay to realize the value that was assigned to them from the prior standpoint. After the actions are collected, you spend fifteen minutes calculating and distributing the payoffs, allowing the Red students who refused to pay to realize they forfeited the voucher, while those who paid feel the sting of the loss even while profiting overall.

  The remaining thirty minutes are for the debrief, which you should steer by mapping their visceral reactions to the theoretical framework. When the Red students complain that paying felt like a sucker's move once they knew they were in Red, you point out that this feeling is the essence of the updateful perspective, which treats the state as new information that screens off the prior commitment. When they acknowledge that they would have signed the policy willingly before opening the envelope, you map that moment to the updateless standpoint where the policy is evaluated from the initial position before observations arrive. You must make explicit that the policy is not a blind command but a function from evidence to action; the updateless agent does not ignore the fact that they are in Red, but they treat that fact as an input to the function they selected earlier, not as a reason to select a new function. This is the moment to raise the awkward question of where the initial standpoint comes from for an agent that was never behind a veil. In the game, the standpoint was the start of the session, but in real life, agents are born into states. You should suggest that for UDT, the initial standpoint is a theoretical construct, perhaps the moment of architectural design or evolutionary selection, where the decision rule itself was chosen before the specific circumstances of its application were known. This helps them see that the disagreement is not about using evidence, but about whether the evaluation of the rule moves with the evidence or stays fixed at the design stage.

  You must also anticipate the objection that this setup relies on a contractual binding rather than a logical or counterfactual connection. A sharp student will note that in Newcomb's problem, the box is filled because of what you are, whereas here the voucher is given because of what you wrote and enforced by your rule. You should meet this honestly by admitting that the activity cannot reproduce the metaphysical link between the agent's disposition and the state of the world. The activity demonstrates the incentive structure of updatelessness, showing why an agent would want to bind themselves, but it does not demonstrate how such binding is possible without an external enforcer. You will need to supply in your own words that UDT posits a logical connection between the agent's algorithm and the predictor's simulation, or between the agent's choice and the logical facts of the universe, which replaces the external enforcer. The activity shows the rationality of the policy if such a connection exists, but it cannot prove the connection exists. This distinction is vital so they do not leave thinking UDT is just about precommitment contracts.

  For the final ten minutes, you replace the chance device with a mathematical proposition to shift the modality from empirical uncertainty to logical uncertainty. Write a proposition on the board, such as the claim that the ten-thousandth digit of pi is even. Explain that this fact is fixed but unknown to them, analogous to the Red or Green state. Ask them whether the reasoning changes if the state is determined by logic rather than chance. If they accept the updateless argument in the chance case, they should accept it here, because from the perspective of the agent before checking the digit, the logical fact is just as uncertain as the chance event. This reinforces the idea that updatelessness applies to logical information as well as empirical information. Ask them if they would sign a policy that pays out if the digit is odd, even if they later calculate and find it is even. If they say yes, they have grasped that the policy is scored from the standpoint of ignorance, not knowledge. If they say no, ask them to locate the difference between the chance envelope and the mathematical fact. This closing phase solidifies the view that the relevant uncertainty is epistemic, regardless of whether the underlying reality is chancy or deterministic.

  There are three predictable failures you should be ready to handle. First, students may try to peek at their state envelopes before writing their policies, or argue that the rule allowing them to forfeit the voucher is unfair. Handle this by enforcing the protocol strictly as a condition of the game, treating the rules as the laws of physics for the simulation. Second, some Red students may refuse to pay despite the incentive, simply to prove a point about rationality. If this happens, use it as data for the debrief to show how strong the updateful intuition is, noting that their refusal confirms the theory that updateful agents leave money on the table in these structures. Third, the group may get bogged down in calculating the exact expected utilities during the payoff phase. Keep the numbers simple enough that the dominance is obvious without a calculator, ensuring the focus remains on the decision rule rather than the arithmetic. If you manage the timing so that the mathematical proposition lands just as the session ends, you will leave them with the thought that the updateless standpoint is not about ignoring reality, but about choosing the lens through which reality is evaluated, and that the choice of lens is the only decision that is truly theirs.

  I hope this staging serves your group well and provides the productive friction you are looking for. It is a difficult concept to embody, but if they leave arguing about whether the initial standpoint is a fiction or a necessity, you will have succeeded.

  Best wishes for the final session.
