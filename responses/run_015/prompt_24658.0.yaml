  The game proposed at the dinner table is a striking variation on a classic theme in probability theory. To understand the predicament facing the quantitative risk analyst, we must first formalize the mechanics of the wager. A fair coin is tossed repeatedly until it lands heads for the first time. Let $N$ be the random variable representing the toss number on which this first head occurs. Since the coin is fair, the probability that the first head appears on the $n$-th toss is given by $P(N=n) = (1/2)^n$. This is a standard geometric distribution. We can verify that the game terminates with probability one by summing the probabilities over all possible outcomes: $\sum_{n=1}^{\infty} (1/2)^n = 1$. Thus, the game will almost surely end; it will not continue forever.

  The payoff, however, is where the pathology begins. Let $X$ be the random variable representing the player's winnings. The rules state that if $N=n$, the player wins $2^n$ dollars when $n$ is odd and loses $2^n$ dollars when $n$ is even. The sequence of possible payoffs is therefore $+2, -4, +8, -16, +32, \dots$. Notice that the magnitude of the payoff grows exponentially with $n$, meaning the payoff is unbounded in both the positive and negative directions. While the probability of reaching these extreme outcomes diminishes rapidly, the financial stakes explode quickly enough to disrupt standard analysis.

  To evaluate the game, a risk-neutral player typically calculates the expected value, $E[X]$. This is the sum of each possible payoff multiplied by its probability. For the $n$-th outcome, the contribution to the expectation is $P(N=n) \times \text{Payoff}(n) = (1/2)^n \times (\pm 2^n) = \pm 1$. Specifically, odd $n$ contributes $+1$ and even $n$ contributes $-1$. The expected value is the sum of the series:
  $$ E[X] = 1 - 1 + 1 - 1 + 1 - 1 + \dots $$
  In the theory of integration and expectation, a random variable has a well-defined expected value only if the sum of the positive contributions and the sum of the negative contributions do not both diverge to infinity. Here, the sum of the positive terms is $1 + 1 + 1 + \dots$, which diverges to positive infinity. The sum of the negative terms is $-1 - 1 - 1 - \dots$, which diverges to negative infinity. Consequently, the expectation is undefined. It is not merely infinite; it is mathematically indeterminate, akin to the expression $\infty - \infty$.

  This distinguishes the game sharply from the famous St. Petersburg paradox. In the St. Petersburg game, the player always wins $2^n$ dollars. There, the expected value contributions are all positive ($1 + 1 + 1 + \dots$), so the expectation is well-defined in the extended real numbers as positive infinity. A risk-neutral agent in the St. Petersburg game should theoretically pay any finite amount to play. In this dinner party game, however, the expectation does not exist even as an infinite quantity. The positive and negative infinities cancel each other out in no consistent way.

  This lack of a defined mean leads to a deeper problem regarding the order of summation. In standard calculus, a series that converges but does not converge absolutely is called conditionally convergent. While the specific series of contributions here ($1 - 1 + 1 \dots$) oscillates rather than converges, it shares the critical defect of conditionally convergent series: it lacks absolute convergence. The sum of the absolute values of the contributions is $\sum | \pm 1 | = \infty$. Riemann's rearrangement theorem states that for any series that is not absolutely convergent, the terms can be rearranged to sum to any real number, or to positive or negative infinity.

  In the context of this game, "rearranging the terms" corresponds to grouping the outcomes differently. If a bookie were to group the outcomes as $(1 - 1) + (1 - 1) + \dots$, the sum appears to be zero. If they group them as $1 + (-1 + 1) + (-1 + 1) + \dots$, the sum appears to be one. By taking more positive terms before negative ones, one could construct a sum that drifts toward positive infinity; by taking more negative terms, one could drift toward negative infinity. This is not a defect in the arithmetic but a defect in the notion of "expected value" for this distribution. The mean is not an intrinsic property of the game's payoff distribution because it depends on the arbitrary order in which we choose to sum the possibilities. For a decision theorist, this means the expected value cannot serve as a guide for action.

  If the mean fails, we might look to the median. The median payoff is the value $m$ such that the probability of winning more than $m$ is at most $1/2$ and the probability of winning less than $m$ is at most $1/2$. Let us compute this. The first outcome ($n=1$) yields $+\$2$ with probability $1/2$. The cumulative probability of achieving a payoff of $\$2$ or less includes the $n=1$ outcome and all negative outcomes ($n=2, 4, 6 \dots$). The probability of any even $n$ is $\sum_{k=1}^{\infty} (1/2)^{2k} = 1/3$. Thus, $P(X \le 2) = 1/2 + 1/3 = 5/6$, which is greater than $1/2$. Conversely, the probability of achieving $\$2$ or more includes the $n=1$ outcome and all positive outcomes ($n=3, 5 \dots$). The probability of odd $n > 1$ is $1/6$. Thus $P(X \ge 2) = 1/2 + 1/6 = 2/3$, which is also greater than $1/2$. Therefore, the median payoff is well-defined at $+\$2$. Unlike the mean, the median is stable; it does not depend on summation order, and it is finite. It suggests that a typical run of the game yields a small profit, despite the catastrophic risks lurking in the tail.

  This brings us to the bookie's question: what entry fee makes the game fair? For a risk-neutral player, a fair game is one where the expected net gain is zero. If the entry fee is $c$, the net payoff is $X - c$. The linearity of expectation would suggest $E[X - c] = E[X] - c$. However, since $E[X]$ is undefined, $E[X] - c$ is also undefined for any finite constant $c$. Subtracting a fee does not stabilize the expectation; the positive and negative parts still diverge. Therefore, no finite entry fee can make the game "fair" in the expected-value sense.

  Faced with this, a careful decision theorist has several defensible positions, each with a cost. First, one could refuse the game entirely. Since the worst-case outcome is unbounded below (losses can be arbitrarily large), a minimax criterion—which seeks to maximize the minimum possible gain—offers no verdict other than caution. The minimum gain is negative infinity. Second, one could accept the game for free. The median is positive ($+\$2$), and more than half the time the player loses money (since $P(X < 0) = 1/3$, wait, $P(X < 0)$ is sum of even $n$, which is $1/3$. So $2/3$ of the time the player wins or breaks even? No. $P(N=1)=0.5$ (win). $P(N=2)=0.25$ (lose). $P(N=3)=0.125$ (win). Total win prob = $0.5 + 0.125 + \dots = 2/3$. Total lose prob = $1/3$. So the player wins more often than they lose). Accepting for free exploits the positive median and the higher probability of winning. Third, one could price the game using the median rather than the mean, demanding $\$2$ to play. This ensures that half the time the player ends up ahead of the fee. However, this ignores the magnitude of the losses; losing $\$1,000,000$ hurts more than winning $\$2$ helps, a fact the median ignores but the (undefined) mean attempts to capture.

  Ultimately, this game illustrates a boundary condition for expected utility theory. The theory assumes that rational agents maximize the expectation of their utility. But when the expectation is undefined, the theory provides no prescription. It shows that rational choice cannot always be reduced to a single number. In the presence of unbounded risks and oscillating expectations, rationality may require abandoning the mean in favor of other metrics, or simply acknowledging that some gambles are beyond the scope of calculation. The analyst at the dinner party is not merely facing a tricky bet; they are facing a hole in the mathematical foundation of risk itself.
