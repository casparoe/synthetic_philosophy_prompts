ame fair for a risk-neutral player, and the essay should explain why no finite fee does — subtracting any constant from the payoff leaves the expectation undefined — and then survey the defensible positions a careful decision theorist could take: refuse the game, accept it for free, or replace the mean with some other summary of the distribution such as the median, stating the cost of each, and noting that a minimax criterion offers no verdict either, since the worst outcome is unbounded below. Close with one or two sentences on what the case shows about the scope of expected utility theory as a theory of rational choice. Write in clear, unhurried prose; no citations or reading lists are needed, and the essay should stand on the game's own description rather than on its name in the literature.
