answer: |-
  **INTERNAL OPERATING PROCEDURE: ADJUDICATION OF FRAMEWORK-DISPUTE APPEALS**

  **Reference:** AP-INT-04
  **Owner:** Head of Appeals and Research Integrity
  **Operator:** Appeals Case Officer (CO)
  **Time Allocation:** 45 minutes per case
  **Scope:** Appeals alleging rejection based on incommensurable research frameworks rather than bias, error, or procedure.

  ### 1. SEQUENTIAL ADJUDICATION TESTS

  Apply these tests in order. If a test yields a definitive disposition, stop. If the test is inconclusive, proceed to the next.

  **Test 1: Consistency of Claim**
  *   **Examine:** The original proposal versus the appeal rebuttal.
  *   **Look for:** Whether the specific framework or methodological tradition cited in the appeal was explicitly named, defined, or justified in the original proposal.
  *   **Sufficient Finding:** The proposal describes the method as standard or does not mention the alternative framework, while the rebuttal introduces the framework as a defence against criticism.
  *   **Licences:** **Dismiss.** This indicates post-hoc rationalisation. The label 'incommensurability' is being used opportunistically.
  *   **Judgment Marker:** Distinguishing between 'implicit' framework usage and 'retrospective' invention. Err on the side of the document text; if it is not written in the proposal, it was not communicated to reviewers.

  **Test 2: Translatability Check**
  *   **Examine:** The review reports and the rebuttal.
  *   **Look for:** Specific terms where the applicant claims 'no common meaning' versus terms where they simply disagree on weight or importance.
  *   **Sufficient Finding:** The applicant can define their terms using the reviewers' vocabulary (or vice versa) without loss of meaning, even if they disagree on the value of the concept.
  *   **Licences:** **Uphold in Part.** Direct the panel to reconsider the specific objection. This is a lexical or communicative failure, not a framework clash.
  *   **Judgment Marker:** Determining whether a definition is a genuine translation or a forced equivalence. Err towards 'translatable'; true incommensurability is rare.

  **Test 3: Internal Coherence and Decision Rules**
  *   **Examine:** The proposal's methodology section.
  *   **Look for:** A rule within the applicant's framework that determines what counts as a successful outcome, a failed experiment, or a concluded inquiry.
  *   **Sufficient Finding:** The proposal lacks a criterion for falsification, success, or termination that is intelligible even within the applicant's own stated framework (e.g., 'we will explore until we find something interesting').
  *   **Licences:** **Dismiss.** Incommensurability does not exempt a proposal from having internal decision rules. A framework that cannot define its own success conditions is not research; it is fishing.
  *   **Judgment Marker:** Distinguishing between 'exploratory' research and 'undefined' research. Err towards requiring a decision rule; public funds require accountability.

  **Test 4: Anomaly Resolution**
  *   **Examine:** The rebuttal's justification for the alternative framework.
  *   **Look for:** A specific empirical phenomenon, theoretical contradiction, or anomaly that the mainstream framework fails to explain but the applicant's framework preserves or explains.
  *   **Sufficient Finding:** The applicant admits the mainstream framework handles the phenomena adequately, but argues their framework is 'more consistent', 'more elegant', or 'philosophically superior' without identifying a specific failure of the mainstream.
  *   **Licences:** **Dismiss.** Methodological pluralism supports alternative approaches to *unsolved problems*, not redundancy where the mainstream is sufficient.
  *   **Judgment Marker:** Assessing whether a claimed 'anomaly' is genuine or trivial. Err towards the status quo; the burden of proof lies with the appellant.

  **Test 5: Referral Necessity**
  *   **Examine:** The outcome of Tests 1–4.
  *   **Look for:** A case where the framework is consistent (Test 1), truly distinct (Test 2), internally coherent (Test 3), and addresses a genuine anomaly (Test 4), but the CO cannot judge the scientific merit due to lack of subject knowledge.
  *   **Sufficient Finding:** The dispute is substantive and concerns the validity of the framework itself, not the execution of the proposal.
  *   **Licences:** **Refer.** Commission a new review by a panel constituted to include expertise in the appellant's tradition. (Budget constraint: Max 20 referrals per annum across all appeals).
  *   **Judgment Marker:** Deciding if the cost of a new review is justified by the likelihood of a different outcome. Err towards conservation of referral slots; use only for high-potential pluralism cases.

  ---

  ### 2. TAXONOMY OF DIAGNOSES

  Classify the disagreement into one of the following four types. This classification informs the disposition in Test 5.

  **Type I: Lexical Divergence**
  *   **Definition:** Parties use the same words to mean different things, or different words for the same concepts, but a translation dictionary can be constructed.
  *   **Adjudicability:** Adjudicable by a standard both parties accept (clarity of communication).
  *   **Justification:** If terms can be defined without loss, the disagreement is about precision, not worldview.
  *   **Disposition:** Uphold in Part (Direction to Reconsider).

  **Type II: Evidentiary Divergence**
  *   **Definition:** Parties agree on the aim but disagree on what counts as evidence or a valid result (e.g., qualitative vs quantitative, network state vs hypothesis test).
  *   **Adjudicability:** Adjudicable only at prohibitive cost (requires experts fluent in both traditions to validate the evidence standard).
  *   **Justification:** Determining validity requires deep subject knowledge to ensure the alternative standard is rigorous, not just lax.
  *   **Disposition:** Refer (if budget allows and Tests 3 & 4 are passed) or Dismiss (if the proposed standard lacks internal decision rules).

  **Type III: Teleological Divergence**
  *   **Definition:** Parties disagree on the aims and desiderata of the field (e.g., prediction vs understanding, consistency vs empirical fit). They weight shared values differently.
  *   **Adjudicability:** Adjudicable only at prohibitive cost (requires value judgment on the direction of the field).
  *   **Justification:** This is a policy decision masquerading as a scientific one. It requires a panel mandated to support pluralism.
  *   **Disposition:** Refer (only if the funder's strategic plan explicitly supports this divergence) or Dismiss.

  **Type IV: Ontological Divergence (Kuhnian)**
  *   **Definition:** Disagreement about how objects of study are classified into kinds. A failure of translation between locally inter-defined vocabularies.
  *   **Adjudicability:** Not adjudicable at all within the current review structure.
  *   **Justification:** If the 'objects' themselves are defined differently, there is no common ground for comparison without a conversion process that takes years.
  *   **Disposition:** Refer (to a specialist panel capable of 'bilingual' assessment) or Dismiss (if the proposal fails to communicate the ontology clearly).

  ---

  ### 3. RULE ON ENTITLEMENT

  **Principle:** Incommensurability entitles an appellant to **assessment by peers competent in their framework**, not to **exemption from the standards of rigour applicable to that framework.**

  **Operational Rule:**
  1.  An appellant cannot claim a proposal is 'good' within their framework if the framework itself lacks mechanisms for error-correction or validation.
  2.  An appellant cannot claim 'misunderstanding' if the proposal failed to articulate the framework's standards to the reviewers in the first instance.
  3.  The label 'incommensurable' does not shield a proposal from the requirement to specify what would count as a negative result.

  ---

  ### 4. VALUE VS OPPORTUNISM TEST

  To distinguish genuine framework innovation from opportunistic defence of poor quality, apply the following checks:

  **Check A: The Reconstruction Test**
  *   **Question:** Did the panel reject the work for reasons that the applicant now claims are framework-specific, or for reasons that are universal (e.g., clarity, feasibility)?
  *   **Indicator of Opportunism:** The panel cites vague aims or lack of focus; the applicant replies with 'paradigm clash'.
  *   **Indicator of Value:** The panel cites specific incompatibility with established laws/models; the applicant explains why those laws/models do not apply in their ontology.

  **Check B: The Anomaly Test**
  *   **Question:** Does the applicant's framework preserve or explain something the mainstream framework leaves anomalous?
  *   **Indicator of Opportunism:** The applicant argues their framework is 'different' but admits it explains the same things as the mainstream (redundancy).
  *   **Indicator of Value:** The applicant identifies a specific phenomenon the mainstream cannot accommodate (e.g., non-linear dynamics in a linear model).

  **Check C: The Post-Hoc Test**
  *   **Question:** Is the panel's reasoning reconstructed after the fact?
  *   **Indicator of Opportunism:** The panel summary cites standard criteria (e.g., 'unidentified model'), and the applicant redefines the criteria in the rebuttal rather than defending the model's identification.
  *   **Indicator of Value:** The panel summary explicitly acknowledges the framework clash but rejects it based on field consensus; the applicant challenges that consensus.

  ---

  ### 5. JUDGMENT MARKERS

  Points where the procedure cannot eliminate human judgment.

  1.  **Sincerity of Framework:** The CO must judge if the applicant truly works in this tradition or is using it as a shield.
      *   *Likely Error:* Towards the Funder. COs will assume opportunism to protect the budget.
  2.  **Severity of Anomaly:** The CO must judge if the 'unexplained phenomenon' is significant enough to warrant funding.
      *   *Likely Error:* Towards the Funder. COs will favour established problems over novel ones.
  3.  **Referral Worthiness:** The CO must decide if a new panel would actually change the outcome.
      *   *Likely Error:* Towards the Appellant. COs may refer difficult cases to avoid making a hard decision (deferral).

  ---

  ### 6. SYSTEMATIC FAILURE MODES

  1.  **The Conservative Bias:** The procedure will systematically dismiss emerging fields that look like 'lack of rigour' to a generalist CO. It errs towards the Funder.
  2.  **The Bilingual Gap:** True Type IV (Ontological) disputes may be dismissed as Type I (Lexical) because the CO cannot see the depth of the translation failure. It errs towards the Funder.
  3.  **The Budget Cap:** With only ~20 referrals available for ~90 appeals, meritorious Type II/III disputes will be dismissed due to resource exhaustion, not merit. It errs towards the Funder.
  4.  **The Pluralism Trap:** The procedure may uphold proposals that are methodologically pluralistic but scientifically dead-ends, simply because they pass the 'Internal Coherence' test. It errs towards the Appellant.

  ---

  ### 7. CASE APPLICATIONS

  **Case (a): Infection and Immunity (Network vs One-Target)**

  *   **Disposition:** **Dismiss.**
  *   **Reasoning for Determination Letter:**
      "The Appeal Committee has reviewed the documentation. We acknowledge the methodological divergence between the proposed network perturbation approach and the reviewers' expectation of hypothesis-driven testing. However, under Procedure AP-INT-04 Test 3 (Internal Coherence), a proposal must specify the criteria by which success or failure is determined, regardless of the framework employed. The proposal states no pre-specified primary endpoint and offers no alternative decision rule for concluding the inquiry. While we support methodological pluralism, this commitment does not extend to funding inquiries that lack internal mechanisms for validation. The rejection stands on the grounds of indeterminacy, not framework bias."
  *   **Judgment Exercised:**
      I judged that 'change in network state' is too vague to function as a decision rule without further specification. I erred towards the Funder (Conservative Bias), as a specialist panel might have accepted 'state change' as a valid endpoint in systems biology. This outcome contradicts the funder's sympathy for pluralism, but the procedure mandates dismissal where no success criterion exists.

  **Case (b): Macroeconomics (Stock-Flow vs Microfoundations)**

  *   **Disposition:** **Dismiss.**
  *   **Reasoning for Determination Letter:**
      "The Appeal Committee notes the applicant's defence of the stock-flow consistent framework. However, under Procedure AP-INT-04 Test 4 (Anomaly Resolution), the appellant must demonstrate that their framework addresses an empirical or theoretical anomaly that the mainstream framework cannot. The rebuttal concedes that mainstream models can represent the identified phenomena and argues instead for 'accounting consistency'. While this is a valid theoretical preference (Taxonomy Type III: Teleological Divergence), public funding prioritises the resolution of unexplained phenomena over theoretical redundancy. The rejection stands."
  *   **Judgment Exercised:**
      I judged that 'accounting consistency' is a desideratum, not an anomaly resolution. I erred towards the Funder. A pluralist might argue that consistency prevents future crises (an anomaly), but on the documents provided, this was not claimed.

  **Case (c): Archaeology and Genetics (Chronology)**

  *   **Disposition:** **Uphold in Part (Direction to Reconsider).**
  *   **Reasoning for Determination Letter:**
      "The Appeal Committee finds that the discrepancy in chronology arises from a difference in calibration conventions (radiocarbon ages vs calendar dates) rather than a fundamental incompatibility of temporal frameworks. This falls under Taxonomy Type I (Lexical Divergence). The applicant's claim of 'incommensurable temporal frameworks' is not supported by the evidence; the discrepancy disappears under consistent conversion. However, as the panel's rejection relied on this discrepancy, the objection must be reconsidered on the corrected data. The case is referred back to the Chair for a decision based on the calibrated dates."
  *   **Judgment Exercised:**
      I judged that the error was clerical/conventional rather than philosophical. This is a low-risk judgment. The procedure correctly identified this as a translation failure, not a paradigm clash.

  ---

  **End of Document**
