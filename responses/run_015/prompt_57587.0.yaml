          *   Test 4: Anomaly Resolution. Does the new framework solve something the old one doesn't?
      *   **Section 2: Taxonomy.**
          *   Type 1: Lexical (Translation possible). Adjudicable easily.
          *   Type 2: Evidentiary (What counts as data). Adjudicable at cost (needs experts).
          *   Type 3: Teleological (Aims of the field). Adjudicable at prohibitive cost (value judgment).
          *   Type 4: Ontological (Kinds of things). Not adjudicable (requires conversion).
      *   **Section 3: Entitlement Rule.** Incommensurability $\neq$ automatic funding. It entitles you to *assessment by peers who understand your framework*, not exemption from rigor.
      *   **Section 4: Framework Value vs. Opportunism.** Look for predictive power or resolution of known anomalies vs. vagueness. Check for post-hoc reconstruction in the rebuttal.
      *   **Section 5: Judgment Markers.** Where does the CO have to guess? (e.g., sincerity of the framework claim). Likely error: Towards the funder (risk aversion).
      *   **Section 6: Failure Modes.** What will this miss? (Subtle bias, emerging fields that look like noise).

