      *   *The "Kuhn" Trap:* Applicants often use "incommensurability" to mean "you didn't like my idea." The procedure must filter this out.
      *   *The Adjudicability:* Most real disputes are "adjudicable only at prohibitive cost" (i.e., requires a new panel of experts who understand *both* frameworks). This is where the referral budget comes in.

  3.  **Drafting the Procedure (Section by Section):**

      *   **Title:** Needs to sound official. "Procedure for Adjudication of Framework-Dispute Appeals."
