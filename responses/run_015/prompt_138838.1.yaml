answer: |-
  # The Committee on External Partnerships: Signaling Integrity Procedure

  ## Preamble: Theoretical Scope
  This procedure operationalizes the Handicap Principle and Spence's signaling models for institutional decision-making. It rests on the axiom that a commitment is informative only if its **marginal cost** is lower for a high-integrity partner than for a low-integrity partner. 

  **Note on Theoretical Worries:**
  1.  **Reversibility & Baselines:** Your concerns regarding reversibility and sector baselines are theoretically sound. A recoverable cost is not a handicap; a universal cost is a pooling equilibrium (entry fee) and conveys zero information. The procedure treats these as failure modes.
  2.  **The Wrong-Pocket Problem:** This is technically a *principal-agent* decoupling, not a signaling failure. Signaling theory assumes the sender bears the cost. If the signer does not bear the cost, they are not the sender; they are a proxy. The procedure treats this as a structural invalidation of the signal *from the counterparty*, requiring a redirect to the actual cost-bearer.

  ---

  ## Part I: The Decision Procedure

  **Instruction:** The Committee Chair reads each question sequentially. The Committee must agree on the answer before proceeding. If a "Stop" condition is met, the proposal is flagged as **NOT CREDIBLE**. If the procedure reaches Step 6, the signal is **CREDIBLE**, but the final partnership decision requires a Value Handoff.

  ### Step 1: Agency and Cost-Bearing (The Wrong-Pocket Filter)
  **Question:** Does the legal entity signing the agreement bear the direct marginal cost of fulfilling the commitment, or are they contractually bound to ensure the cost is paid by a parent/successor/member?
  *   **Sufficient Answer:** Yes, the signer pays; OR, the signer provides a binding guarantee from the cost-bearing entity (e.g., parent company guarantee, endowment deed).
  *   **Stop Condition:** No, and no binding guarantee is offered. (The signer is decoupled from the cost).
  *   **Output:** If Stop $\rightarrow$ **NOT CREDIBLE**.

  ### Step 2: Sunkness and Reversibility (The Handicap Filter)
  **Question:** Is the cost incurred prior to or independent of the university's benefit, and is it irreversible (sunk) without penalty exceeding the benefit of defection?
  *   **Sufficient Answer:** Yes, costs are sunk upfront; OR, costs are future-facing but breach penalties (legal or reputational) exceed the gain from cheating.
  *   **Stop Condition:** No, the commitment is uptake-contingent (costs start only if we sign), reversible without penalty, or lapses based on external thresholds (e.g., "if others sign").
  *   **Output:** If Stop $\rightarrow$ **NOT CREDIBLE**.

  ### Step 3: Differential Cost (The Separation Filter)
  **Question:** Relative to a low-integrity actor (e.g., a reputation launderer, a data exploiter, a non-compliant firm), would fulfilling this commitment impose a significantly higher operational, financial, or reputational burden than on a high-integrity actor?
  *   **Sufficient Answer:** Yes. The commitment targets a specific vulnerability or operational constraint that a "bad" type cannot easily mimic without genuine structural change.
  *   **Stop Condition:** No. A "bad" type could fulfill this as easily as a "good" type (e.g., a generic pledge with no audit).
  *   **Output:** If Stop $\rightarrow$ **NOT CREDIBLE**.

  ### Step 4: Baseline and Informativeness (The Entry Fee Filter)
  **Question:** Is this commitment currently a sector norm or regulatory requirement for entities of this type?
  *   **Sufficient Answer:** No, this exceeds the sector baseline; OR, even if normative, the *specific manner* of fulfillment here is differential (e.g., third-party audit vs. self-reporting).
  *   **Stop Condition:** Yes, this is a standard entry fee with no differentiation in execution. (Signal is pooled).
  *   **Output:** If Stop $\rightarrow$ **NOT CREDIBLE**.

  ### Step 5: Cost Estimation (The Epistemic Filter)
  **Question:** Can the Committee estimate the cost of the signal using available proxies (financial data, legal precedent, sector analysis)?
  *   **Sufficient Answer:** Yes, we have sufficient data to estimate the burden.
  *   **Handoff Condition:** No, the cost is purely internal/reputational and opaque to outsiders.
  *   **Output:** If Handoff $\rightarrow$ **UNDECIDED BY THE PROCEDURE** (Proceed to Step 6 with warning).

  ### Step 6: Value Handoff (The Risk Tolerance Filter)
  **Instruction:** The procedure ends here. The signal is deemed **CREDIBLE** (or UNDECIDED). The Committee must now decide if the *residual risk* is acceptable given the university's mission.
  *   **Decision:** This is not an evidence question. It is a value judgment on how much risk the university accepts in exchange for the partnership's benefits.
  *   **Output:** **CREDIBLE** (signal works) or **UNDECIDED** (signal opaque). Final Go/No-Go is a policy decision, not a signaling decision.

  ---

  ## Part II: Application to Cases

  ### Case 1: Software Company / Transparency Lab
  *   **Proposal:** Joint lab. Commitment: Annual transparency report on government data requests, named officer accountable, publication written as condition of continued participation.

  **Step 1 (Agency):** The software company signs. The legal/PR cost falls on the company.
  *   *Verdict:* PASS.
  **Step 2 (Sunkness):** Report is annual (future-facing). However, failure to publish terminates the lab agreement.
  *   *Analysis:* Is the penalty (losing the lab) greater than the benefit of hiding data requests? If the lab is valuable, yes. If the lab is small, no. We must estimate the lab's value to them.
  *   *Verdict:* PASS (Conditional on valuation).
  **Step 3 (Differential):** Does a "bad" company (one that hides requests) find this harder than a "good" company?
  *   *Analysis:* Yes. A company with nothing to hide incurs low PR cost. A company hiding requests incurs high legal/PR risk. The cost is differential.
  *   *Verdict:* PASS.
  **Step 4 (Baseline):** Is this a sector norm?
  *   *Analysis:* Many tech firms publish transparency reports, but tying it to a *university lab condition* is not normative. It creates a specific binding tie.
  *   *Verdict:* PASS.
  **Step 5 (Estimation):** Can we estimate the cost?
  *   *Analysis:* We can estimate legal/PR costs. We cannot know exactly how many requests they wish to hide.
  *   *Verdict:* PASS (Proxies available).
  **Step 6 (Value):**
  *   *Analysis:* The signal is structurally honest. The Committee must decide if the risk of them hiding requests *despite* the penalty is acceptable.
  *   *Procedure Output:* **CREDIBLE**.

  ### Case 2: Trustee / Dissident Archive
  *   **Proposal:** Large gift for archive/lecture series. Condition: Building renamed, permanent series. Signal: Commitment to free expression.

  **Step 1 (Agency):** Donor signs gift agreement. Donor pays.
  *   *Verdict:* PASS.
  **Step 2 (Sunkness):** Gift is an endowment (sunk capital). Lecture series is ongoing cost covered by endowment.
  *   *Analysis:* The capital is irreversible. The *use* of the capital is bound by the deed.
  *   *Verdict:* PASS.
  **Step 3 (Differential):** Does this separate "free speech advocates" from "reputation launderers"?
  *   *Analysis:* Funding an archive is easy for the wealthy. Funding a *dissident/samizdat* archive carries specific reputational risk in certain geopolitical or donor circles. A "safe" launderer might prefer a less controversial topic. The specific content imposes a differential reputational cost.
  *   *Verdict:* PASS.
  **Step 4 (Baseline):** Is this a sector norm?
  *   *Analysis:* Named buildings are normative. Funding dissident literature is not a standard entry fee.
  *   *Verdict:* PASS.
  **Step 5 (Estimation):** Can we estimate the cost?
  *   *Analysis:* Financial cost is known. Reputational cost to the donor is opaque.
  *   *Verdict:* PASS (Financial proxy sufficient for signal honesty).
  **Step 6 (Value):**
  *   *Analysis:* The Vice-Chancellor is using this as a signal of *university* values. The procedure validates the donor's commitment, but the *interpretation* of that commitment as a university signal is a value judgment.
  *   *Procedure Output:* **CREDIBLE**.

  ### Case 3: Consortium / Procurement Pledge
  *   **Proposal:** Co-sign sector commitment. Signed by Director. No member obligation. No audit. Lapses if <10 signatories.

  **Step 1 (Agency):** Consortium Director signs. Members pay/comply.
  *   *Analysis:* The signer bears no cost. The members bear the cost but are not bound.
  *   *Verdict:* **FAIL (Stop Condition Met).**
  *   *Note:* This is the "Wrong-Pocket" problem. The signal is cheap for the signer.
  **Step 2 (Sunkness):** Commitment lapses if <10 sign.
  *   *Analysis:* Uptake-contingent. No cost unless threshold met.
  *   *Verdict:* **FAIL.**
  **Step 3 (Differential):** No audit or reporting.
  *   *Analysis:* A "bad" procurer can sign with zero operational change. Cost is zero for both types.
  *   *Verdict:* **FAIL.**
  **Procedure Output:** **NOT CREDIBLE**. (Procedure stops at Step 1).

  ---

  ## Part III: Limitations of the Procedure

  You asked for plain talk on what this procedure cannot do.

  1.  **It Cannot Measure Internal Culture:** The procedure evaluates structural incentives, not moral intent. A "CREDIBLE" signal from a bad actor is possible if the penalties are high enough (e.g., Case 1 company might comply solely to keep the lab, while continuing unethical practices elsewhere). The procedure validates the *constraint*, not the *character*.
  2.  **It Cannot Predict Successor Risk:** While Step 1 asks for binding successors, the procedure cannot assess the *political will* of a future administration to enforce those bindings. It treats legal enforceability as a proxy for actual enforcement, which is a known weakness in institutional memory.
  3.  **It Re-describes Political Disagreements:** If the Committee disagrees on Case 2 (e.g., "Is dissident literature too risky?" vs. "Is it essential?"), the procedure declares the signal CREDIBLE but pushes the disagreement to Step 6. It does not settle value conflicts; it isolates them. It will not tell you if the gift is *good*, only if the donor's commitment is *honest*.
  4.  **It Cannot Resolve the "Wrong-Pocket" Theoretical Tension:** As noted in the preamble, this procedure treats the Wrong-Pocket issue as a disqualifier. However, in practice, you may accept a subsidiary's signature if the parent's reputation is sufficiently collateralized. The procedure forces a binary "Guarantee or No" which may be too rigid for nuanced corporate structures where reputation *is* the bond.
  5.  **It Is Blind to "Signal Jamming":** If a bad actor floods the zone with cheap signals (Case 3 style), the procedure correctly identifies them as NOT CREDIBLE. However, it cannot prevent the *noise* from making it harder for you to find the honest signals. It protects you from bad deals, but it does not make good deals easier to find in a noisy market.

  ---

  ## Part IV: Final Determinations

  \answer{Case 1: CREDIBLE, Case 2: CREDIBLE, Case 3: NOT CREDIBLE}
