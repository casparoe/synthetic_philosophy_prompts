  1. Simulation rules and round structure
  Roles: Three students form the Central Pricing Board (CPB); seventeen act as Sector Managers (SMs). Materials include hidden "Local Condition" cards for SMs (e.g., "machinery fault," "unexpected surplus"), price sheets for the CPB, and production order forms. Goods are Steel and Coal (inputs) and Consumer Goods (output). Run the simulation for 75 minutes total.

  Round 1: CPB sets initial prices. SMs receive hidden cards affecting costs or capacity. SMs submit orders. CPB observes only aggregate excess demand/supply.
  Round 2: CPB adjusts prices based on Round 1 aggregates. SMs may choose an "Innovation" option: reveal specific card details to CPB for higher efficiency, costing private points.
  Round 3: CPB makes final price adjustments. SMs finalize output.

  Information Partition: CPB sees only total numbers. SMs know specific constraints but cannot fully communicate this without cost. The CPB cannot distinguish between a general shortage and a localized bottleneck. Time limit: 15 minutes per round. CPB must write down rationale for price changes before seeing the next report. SMs calculate profit as revenue minus input costs. The CPB wins if total system waste is under 10%; SMs win individually by maximizing personal points. This asymmetry ensures conflict between local optimization and global coordination. Collect order slips in a sealed box to prevent leakage. The CPB must record price changes on a public ledger visible to all. Hidden cards specify constraints like "Transport Delay" or "High Grade Ore." SMs must meet a quota while minimizing costs. CPB aims to balance total supply and demand. Physical separation is key: CPB sits at the front, SMs in clusters.

  2. Payoff scheme and strategic tension
  SMs earn points for meeting private production targets (tied to hidden cards) plus "profit" (output value minus input costs at CPB prices). The CPB earns points for minimizing aggregate inventory imbalances and maximizing total social output.

  The tension arises because SMs maximize points by adapting to local conditions, often ignoring price signals that don't match their specific reality. If a manager faces a local bottleneck, high input prices hurt them disproportionately, yet the CPB interprets reduced demand as low valuation rather than incapacity. In Round 2, the "Innovation" option forces a trade-off: revealing local data helps the CPB set accurate prices (boosting social output) but costs the individual manager points. This mirrors the public good problem of information. The CPB systematically misses the mark because aggregate data flattens distinct local crises into a single number, distorting incentives. Consequently, social welfare suffers.

  3. Debrief mapping
  Begin by asking the CPB why they adjusted prices as they did. They will cite aggregate shortages. Then ask SMs why they didn't respond as expected. When a SM reveals, "I didn't buy less coal because it was too expensive; I bought less because my truck broke," the epistemic gap becomes visible.

  Map this to the debate: The CPB enacted the Lange-Lerner rule of trial-and-error pricing, treating prices as accounting parameters to clear markets. However, the SMs held tacit knowledge—specific, time-bound facts—that could not be aggregated without loss. When the CPB raised prices to clear a shortage, they punished efficient managers who simply faced temporary local constraints, while failing to fix the actual bottleneck.

  Highlight the Round 2 innovation choice: even when revelation was socially optimal, private costs inhibited it. This shows why spontaneous ordering outperforms central design; the market rewards revelation through profit, whereas the simulation required sacrifice. The failure wasn't computational speed; it was the nature of the information. The simulation demonstrates that prices function not merely as rationing devices but as telecommunications systems carrying dispersed knowledge. Centralizing price-setting severs the link between decision-makers and specific circumstances, rendering iterative adjustment ineffective. This concrete experience grounds the abstract theoretical objection.

  4. Predictable failures and fixes
  First, SMs may altruistically reveal all hidden cards immediately, collapsing the information asymmetry. Fix: Enforce the point cost for revelation strictly and remind them their grade depends on individual performance, not social welfare. Second, the CPB might solve the equilibrium too quickly if the math is simple. Fix: Introduce "noise" into the aggregate reports (e.g., report ranges instead of exact numbers) or add a third input good to increase complexity.

  Third, managers might collude to game the CPB. Fix: Isolate communication between SMs during rounds. Finally, if the CPB becomes frustrated and passive, intervene as a "Political Authority" demanding higher output, forcing them to adjust prices aggressively despite poor data. This reinforces the pressure central planners face to act despite ignorance.

  5. Necessary simplification
  This simulation flattens the dynamic process of entrepreneurial discovery into static rounds of optimization. In reality, the market process is not merely about adjusting quantities to given prices, but discovering new preferences and technologies through rivalry.

  Verbally supply this by explaining: "In this game, you optimized within fixed rules. In the real debate, the critique is deeper: without private property and profit/loss, there is no mechanism to discover what should be produced or how to innovate. The simulation shows the knowledge problem in allocation; the broader argument concerns the discovery of the data itself."
