      *   **Participants:** ~20 students (3 Central Pricing Board, 17 Sector Managers).
      *   **Core Tension:** Central board can adjust prices iteratively based on aggregates, but fails to capture dispersed, tacit local knowledge.
      *   **Mechanics:** Must make the failure tangible, not just explained.
      *   **Structure:**
          1.  Simulation rules and round structure (~250 words).
          2.  Payoff scheme and strategic tension (~150 words).
          3.  Debrief mapping (~200 words).
          4.  Predictable failures and fixes (~150 words).
          5.  Necessary simplification (~100 words).
      *   **Constraints:** No bibliographies, no assigned readings, no citations, no verbatim quotes from Hayek/Lange/Mises, avoid obscure secondary literature. Self-contained.

  2.  **Drafting Section 1: Simulation Rules and Round Structure**
      *   *Roles:* 3 Central Board (CB), 17 Sector Managers (SM).
      *   *Materials:* Hidden condition cards for SMs, price sheets for CB, order forms.
      *   *Goods:* Steel, Coal (inputs), Consumer Good (output).
      *   *Rounds:* 3 Rounds.
      *   *Info Partition:* CB sees aggregate supply/demand. SMs see local constraints (e.g., "flooded mine," "new vein").
      *   *Sequence:* CB sets prices -> SMs decide production/orders -> CB sees aggregates -> CB adjusts prices.
      *   *Round 2 Twist:* Innovation option (reveal info for efficiency).
      *   *Word Count Check:* Need to keep it tight around 250 words.

      *Drafting:*
      Roles: Three students form the Central Pricing Board (CPB); seventeen act as Sector Managers (SMs). Materials include hidden "Local Condition" cards for SMs (e.g., "machinery fault," "unexpected surplus"), price sheets for the CPB, and production order forms.

      Round 1: CPB sets initial prices for Steel and Coal. SMs receive hidden cards affecting their production costs or capacity. SMs submit orders for inputs and production targets. CPB observes only aggregate excess demand/supply.
      Round 2: CPB adjusts prices based on Round 1 aggregates. SMs may choose an "Innovation" option: reveal specific card details to CPB for higher efficiency, costing private points. Production occurs.
      Round 3: CPB makes final price adjustments. SMs finalize output.

      Information Partition: CPB sees only total numbers (e.g., "Steel shortage: 50 units"). SMs know specific constraints (e.g., "My coal transport is blocked") but cannot fully communicate this without cost. The CPB cannot distinguish between a general shortage and a localized bottleneck. Time limit: 15 minutes per round to induce pressure.

      *Review:* Looks good. Covers roles, materials, sequence, info partition.

  3.  **Drafting Section 2: Payoff Scheme and Strategic Tension**
      *   *Points:* SMs get points for meeting local targets + profit (price differential). CPB gets points for minimizing imbalance + total social output.
      *   *Tension:* SMs want to hide info to maintain flexibility/private gain unless innovation pays off. CPB wants info to set prices but only gets aggregates.
      *   *Failure:* CPB adjusts price up for shortage, but the shortage was local, not general. Price rise hurts others unnecessarily.
      *   *Word Count Check:* Around 150 words.

      *Drafting:*
      SMs earn points for meeting private production targets (tied to hidden cards) plus "profit" (output value minus input costs at CPB prices). The CPB earns points for minimizing aggregate inventory imbalances and maximizing total social output.

      The tension arises because SMs maximize points by adapting to local conditions, often ignoring price signals that don't match their specific reality. If a manager faces a local bottleneck, high input prices hurt them disproportionately, yet the CPB interprets reduced demand as low valuation rather than incapacity. In Round 2, the "Innovation" option forces a trade-off: revealing local data helps the CPB set accurate prices (boosting social output) but costs the individual manager points. This mirrors the public good problem of information. The CPB systematically misses the mark because aggregate data flattens distinct local crises into a single number, leading to price adjustments that solve nothing while distorting incentives for unaffected managers.

      *Review:* Covers payoff, tension, revelation choice, and systematic failure.

  4.  **Drafting Section 3: Debrief Mapping**
      *   *Link moments:* CPB raising price on shortage -> actually a local transport issue.
      *   *Logic:* Iterative adjustment (Lange) vs. Dispersed Knowledge (Hayek).
      *   *Takeaway:* Prices aren't just accounting tools; they summarize tacit knowledge.
      *   *Word Count Check:* Around 200 words.

      *Drafting:*
      Begin by asking the CPB why they adjusted prices as they did. They will cite aggregate shortages. Then ask SMs why they didn't respond as expected. When a SM reveals, "I didn't buy less coal because it was too expensive; I bought less because my truck broke," the epistemic gap becomes visible.

      Map this to the debate: The CPB enacted the Lange-Lerner rule of trial-and-error pricing, treating prices as accounting parameters to clear markets. However, the SMs held tacit knowledge—specific, time-bound facts—that could not be aggregated without loss. When the CPB raised prices to clear a shortage, they punished efficient managers who simply faced temporary local constraints, while failing to fix the actual bottleneck.

      Students should see that the failure wasn't computational speed or goodwill; it was the nature of the information. The simulation demonstrates that prices function not merely as rationing devices but as telecommunications systems carrying dispersed knowledge. When you centralize the price-setting, you sever the link between the decision-maker and the specific circumstances of time and place, rendering iterative adjustment ineffective regardless of the board's intelligence.

      *Review:* Connects play to theory, highlights the specific failure mechanism, states the takeaway.

  5.  **Drafting Section 4: Predictable Failures and Fixes**
      *   *Failures:* SMs might be too cooperative (reveal everything). CPB might solve it too fast.
      *   *Fixes:* Enforce cost of revelation strictly. Complicate the aggregate data (give ranges or noise).
      *   *Word Count Check:* Around 150 words.

      *Drafting:*
      First, SMs may altruistically reveal all hidden cards immediately, collapsing the information asymmetry. Fix: Enforce the point cost for revelation strictly and remind them their grade depends on individual performance, not social welfare. Second, the CPB might solve the equilibrium too quickly if the math is simple. Fix: Introduce "noise" into the aggregate reports (e.g., report ranges instead of exact numbers) or add a third input good to increase complexity.

      Third, managers might collude to game the CPB. Fix: Isolate communication between SMs during rounds. Finally, if the CPB becomes frustrated and passive, intervene as a "Political Authority" demanding higher output, forcing them to adjust prices aggressively despite poor data. This reinforces the pressure central planners face to act despite ignorance.

      *Review:* Addresses cooperation, complexity, collusion, and passivity.

  6.  **Drafting Section 5: Necessary Simplification**
      *   *Simplification:* Entrepreneurial discovery vs. static optimization. The sim is static rounds; real market is dynamic discovery.
      *   *Verbal Supply:* Explain that in reality, prices aren't just adjusted by a board; they emerge from rivalry and discovery of new ends/means.
      *   *Word Count Check:* Around 100 words.

      *Drafting:*
      This simulation flattens the dynamic process of entrepreneurial discovery into static rounds of optimization. In reality, the market process is not merely about adjusting quantities to given prices, but discovering new preferences and technologies through rivalry.

      Verbally supply this by explaining: "In this game, you optimized within fixed rules. In the real debate, the critique is deeper: without private property and profit/loss, there is no mechanism to discover *what* should be produced or *how* to innovate before the fact. The simulation shows the knowledge problem in allocation; remember that the broader argument concerns the discovery of the data itself."

      *Review:* Identifies simplification (static vs. dynamic discovery) and provides the verbal patch.

