  2.  **Deconstruct the Disagreement:**
      *   *The Formal Core:* Backward Induction (BI) relies on Common Knowledge of Rationality (CKR) and Common Knowledge of the Game Structure. In a finite game, BI is the unique SPE.
      *   *Faction 1 (Orthodox):* Treats the model as a normative benchmark or a logical deduction. If reality diverges, reality is "wrong" (or the mapping is wrong). Commitment: Rationality is defined by consistency with the axioms (Savage/von Neumann-Morgenstern + CKR).
      *   *Faction 2 (Skeptics):* Treats the model as a descriptive hypothesis about reasoning. Since the prediction fails, the premises (CKR) must be false/impossible. Commitment: Rationality requires epistemic accessibility; CKR is epistemically impossible for finite minds.
      *   *Faction 3 (Off-Path):* Focuses on the epistemic status of counterfactuals. If Player 1 passes, Player 2 must update beliefs. But CKR says Player 1 *wouldn't* pass. So if Player 2 sees a pass, CKR is falsified. How should Player 2 reason *then*? BI assumes Player 2 stays rational *even after* observing an "impossible" event. Commitment: Belief revision policies matter; standard BI ignores how beliefs update upon surprise.

