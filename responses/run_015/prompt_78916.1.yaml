      *   *Verbal vs. Real:* Is it merely verbal? No. It conceals a real disagreement about the *logic of belief revision* (epistemic game theory). If you make the commitments explicit, the dispute shifts from "Is BI correct?" to "What epistemic conditions sustain BI?"

  4.  **Diagnose the Kind of Disagreement:**
      *   It is *not* primarily empirical (though experiments trigger it).
