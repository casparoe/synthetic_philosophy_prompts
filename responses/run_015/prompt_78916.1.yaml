      *   *Refining the Diagnosis:* It's not just "normative vs. descriptive." It's about the *logic of counterfactuals*. The Centipede game exposes a rift between *strategic rationality* (choosing best response) and *epistemic rationality* (maintaining consistent beliefs).
      *   *Refining the Progress:* Don't suggest "more experiments." Suggest "Epistemic Game Theory." The move is to formalize the belief revision process. If you do that, Faction 1 and 3 merge (BI requires specific belief revision), and Faction 2 is validated (that belief revision is cognitively demanding).

