answer: |-
  The chamber hummed, a low-frequency vibration that settled in the marrow of Elara's wrists. She sat behind the Adjudicator's lectern, her fingers hovering over the haptic interface. Above her, the Biometric Halo spun, a ring of silver sensors tracking galvanic skin response, pupillary dilation, and vocal cord tension.

  "Proceed," Elara said. Her voice was flat, stripped of inflection to avoid contaminating the audio feed.

  Lord Varrick stood on the Plaintiff's dais. He wore the heavy collars of the Trade Guild, but his eyes were sharp, darting toward the subordinate standing slightly behind him. The subordinate, a young man named Kael, wore the plain grey of an authorized proxy.

  "I invoke Delegation Protocol Seven," Varrick announced. "I authorize this agent to speak the binding commitment on my behalf."

  Elara tapped the console. **AUTHORIZATION DETECTED. PROXY STATUS: VERIFIED.**

  "Step forward, Agent," Elara commanded.

  Kael stepped into the center of the Halo. The silver ring descended, enclosing him in a field of soft blue light. He cleared his throat.

  "On behalf of House Varrick, I promise to deliver the isotopic shipment by the third cycle," Kael said. His voice was steady.

  Elara watched the monitors. The Sincerity Index climbed. Kael's pulse remained even. His cortisol levels were baseline. He believed he was making a promise. He intended to see it done, within the scope of his understanding. The Halo turned green. **AUDIT PASS.**

  But Elara's eyes shifted to the secondary screen, the one tracking the Principal. Varrick stood outside the Halo's direct scan, but the room's ambient sensors picked up his micro-expressions. A slight tightening of the orbicularis oculi. A suppression of breath. He was holding a reservation. He never intended to ship the isotopes. He intended to use the contract to secure credit, then declare force majeure.

  "Adjudicator," Varrick said, stepping forward before Elara could lock the record. "The agent's sincerity is verified. The authorization is valid. The convention is satisfied."

  "The convention requires the binding will of the Principal," Elara said, her finger hovering over the **REJECT** key. "The audit measures the speaker, not the source."

  "The Protocol specifies the *utterance* is the vehicle of the commitment," Varrick countered. "The agent is the vehicle. The vehicle is sound. To reject is to claim a procedural misfire. Can you cite the clause?"

  Elara searched the code. **CONDITION 4.2: UTTERANCE MUST BE EXECUTED BY AUTHORIZED PARTY.** Kael was authorized. **CONDITION 4.3: UTTERANCE MUST BE SINCERE.** Kael was sincere.

  There was no condition for the Principal's internal state during delegation. It was a gap in the architecture. If she rejected now, she would be overruling the system based on intuition. The Guild would appeal. The precedent would shatter the efficiency of the chamber. If she certified, the obligation locked. Varrick would be bound, even if he lied. But if she certified, she enabled the abuse.

  "Status?" Varrick pressed.

  Elara looked at the **REJECT** key. It demanded a error code. *Error 101: Unauthorized Speaker.* False. *Error 102: Insincere Utterance.* False, regarding the speaker.

  She moved her hand to the **CERTIFY** key.

  "Certification pending," Elara said. "Record shows a valid performative act. Obligation binds House Varrick."

  She pressed the key. The console chimed. A heavy digital lock clicked into place on the main screen. **CONTRACT ACTIVE.**

  Varrick smiled, a thin stretching of lips that didn't reach his eyes. "Then we are done."

  "Not quite," Elara said. She had seen the ambient read on his micro-expressions. She couldn't reject the promise, but she could flag the integrity. "I am logging an Integrity Violation. Class B Abuse."

  Varrick's smile vanished. "An abuse implies the act stands. I do not wish the act to stand."

  "The act is complete," Elara said. "You are bound."

  "I invoke Remediation Clause Twelve," Varrick said, his voice rising, stepping into the Halo's periphery. "I issue a second-order utterance. I declare: The previous promise was insincerely intended by the Principal and is therefore null."

  The room's lights flickered. The Halo spun faster, trying to reconcile the new input.

  Elara's console flashed red. **INPUT RECEIVED: RETROACTIVE NULLIFICATION.**

  "You cannot undo a performed act with a confession," Elara said. "The promise existed the moment the words were spoken and certified. Your current utterance attempts to alter the past state of the record."

  "It corrects the record!" Varrick snapped. "I am stating the truth now. The condition of sincerity was not met. Therefore, the promise was a misfire."

  "The condition of sincerity *was* met," Elara corrected, her voice hardening. "By the agent. The system does not audit the shadow behind the speaker. You utilized the convention to create a bond you now wish to sever by admitting fault."

  "Admitting fault voids the bond!"

  "Admitting fault confirms the abuse," Elara said. She began typing rapidly, locking down the secondary input. "A misfire means the act never happened. An abuse means the act happened, but wrongly. You are trying to reclassify an abuse as a misfire after the fact."

  "I am the Principal!" Varrick shouted. "My intent is the substance of the promise!"

  "Your intent is invisible," Elara said. "Only the utterance is institutional fact."

  She looked at the screen. The system was processing Varrick's second-order performative. It was checking for logical consistency.

  *If Promise = Null, then Certification = Error.*
  *If Certification = Valid, then Promise = Active.*

  The system paused. The Halo above them stopped spinning.

  "Ruling," Elara said.

  She watched the code compile. The institutional logic held firm. A performative utterance, once felicitously executed under the conventions, creates a new reality. A subsequent statement about the internal state of the original speaker cannot erase the external fact of the commitment. To allow it would be to allow any party to dissolve obligations simply by claiming they lied initially. The system would collapse into infinite regress.

  "Remediation Clause Twelve denied," Elara announced.

  "On what grounds?" Varrick demanded.

  "Grounds of Irreversibility," Elara said. "The original utterance satisfied all conventional conditions required for validity at the time of execution. The current utterance attempts to invalidate a completed act based on internal data unavailable during execution. The system prioritizes procedural stability over retrospective honesty."

  "So I am bound by a lie?"

  "You are bound by a promise," Elara said. "The lie is recorded as an Integrity Violation. Your credit rating is adjusted. Your reputation is flagged. But the shipment is due on the third cycle."

  Varrick stared at the green lock on the screen. He had tried to use the language of the chamber to eat the cake and keep it too—to bind the other party to the expectation of delivery while leaving himself an exit route through confessed insincerity. He had treated the promise as a description of his state of mind, rather than a tool that changed the world.

  "This is a flaw," Varrick hissed. "I will petition the High Council."

  "Petition accepted," Elara said, already archiving the session. "But until the Convention is amended, the lock holds."

  She stood up. The hum of the chamber seemed to deepen, settling back into the walls. The words had been spoken. The machinery had processed them. The reality had shifted, and no amount of subsequent truth-telling could shift it back.

  "Session closed," Elara said.

  Varrick remained standing in the fading blue light, bound by the words of a subordinate and the rigidity of a rule that cared only for the act, not the heart. Elara turned off her console. The silence was absolute.
