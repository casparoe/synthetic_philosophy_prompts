answer: |-
  Here are ten lines of inquiry designed for a graduate-level interview, structured as primary questions with anticipated replies and targeted follow-ups. They cover the four required thematic areas and conclude with the requested question on evidence.

  ### 1. The Status of the Asymmetry (Axiological vs. Deontic)
  **Question:** Is the procreation asymmetry fundamentally a claim about the comparative betterness of outcomes (axiology), or is it a claim about the structure of our practical reasons and duties (deontology)?
  **Anticipated Reply:** She will likely argue it is deontic (about reasons) to avoid the metaphysical awkwardness of "free-floating goods" that belong to no one.
  **Follow-up:** If the asymmetry is solely about reasons for action, how do you derive the substantive conclusion that coming into existence is a *harm* to the person who exists, rather than merely that the parents lacked a *reason* to create them?

  ### 2. The Status of the Asymmetry (Impersonal Value)
  **Question:** If you instead opt for the axiological reading to secure the claim that existence is a harm, how do you metaphysically ground a "good" (the absence of pain) that obtains when there is no subject to possess or experience that good?
  **Anticipated Reply:** She will likely appeal to impersonal value, arguing that some states of affairs are good even without a beneficiary.
  **Follow-up:** Does committing to impersonal value in the case of absent pain undermine the person-affecting intuition that motivates the asymmetry in the first place—namely, that we should be concerned primarily with harms *to people*?

  ### 3. Deprivationism and Temporal Symmetry
  **Question:** Standard deprivationist accounts claim death is bad because it deprives a subject of future goods. How do you distinguish the badness of posthumous nonexistence from prenatal nonexistence without appealing to an arbitrary temporal bias?
  **Anticipated Reply:** She will likely argue that posthumous nonexistence affects an *actual* person who once existed, whereas prenatal nonexistence does not.
  **Follow-up:** If the moral weight rests entirely on the "actualness" of the subject, does this render the asymmetry a trivial consequence of actualism rather than a substantive moral insight about pain and pleasure?

  ### 4. Deprivationism and the Subject Constraint
  **Question:** You argue the absence of pain is good even without a subject, but the absence of pleasure is not bad unless there is a subject to be deprived. Why does the valence of the value (good vs. bad) determine whether a subject is required?
  **Anticipated Reply:** She will likely maintain that harm requires a subject to be harmed, while "good" can be more loosely defined as the absence of a negative.
  **Follow-up:** Is this not a category mistake in your value theory? If the absence of pain is a "good" state of affairs impersonally, why isn't the absence of pleasure a "bad" state of affairs impersonally, regardless of a subject?

  ### 5. The Empirical Gap (Net-Positive Lives)
  **Question:** The asymmetry alone seems to permit procreation if a life is guaranteed to be sufficiently good. What specific empirical premises about the human condition bridge the gap from the asymmetry to strict antinatalism?
  **Anticipated Reply:** She will likely cite the inevitability of severe suffering and the impossibility of obtaining consent for the risk involved.
  **Follow-up:** If empirical data on hedonic adaptation suggested that most lives are net-positive and severe suffering is rare, would your view retreat to a risk-aversion principle rather than a categorical prohibition?

  ### 6. The Empirical Gap (Risk and Existing Persons)
  **Question:** Is the antinatalist conclusion driven by the magnitude of potential suffering, or does the asymmetry itself make *any* risk of pain morally decisive?
  **Anticipated Reply:** She will likely argue the asymmetry makes the risk unacceptable regardless of the potential magnitude of pleasure.
  **Follow-up:** If the asymmetry makes any risk of pain impermissible when creating a person, does this not imply that imposing risks of pain on *existing* persons (e.g., mandatory vaccination or surgery) is similarly impermissible?

  ### 7. The Selection Case (Reasons to Select)
  **Question:** In a selection case where you are committed to having a child either way, does the asymmetry leave you with any reason to bring into existence the child expected to fare better rather than the one expected to fare worse?
  **Anticipated Reply:** She will likely say yes, arguing we have reasons regarding the welfare of the future child, even if we had no reason to create them.
  **Follow-up:** If you have a reason to select the better-off child *for that child's sake*, why is that reasoning unavailable in the existence versus non-existence case?

  ### 8. The Selection Case (Consistency)
  **Question:** If the selection case relies on the intuition that it is better for a specific child to have a happier life, does acknowledging this not concede that existence can be a benefit to the person who comes into existence?
  **Anticipated Reply:** She will likely distinguish between "better for" in a comparative sense (between two possible lives) and "better than" non-existence.
  **Follow-up:** What is the morally relevant difference between comparing two possible lives and comparing one possible life with non-existence, given that in neither case does the subject currently exist to hold interests?

  ### 9. Modal Scope (Humans vs. Animals)
  **Question:** Is the asymmetry a necessary truth grounded in the concept of harm, or is it contingent on the psychological capacities of the being in question?
  **Anticipated Reply:** She will likely argue it is a necessary conceptual truth about sentience and harm.
  **Follow-up:** If it is necessary, does this imply that procreating sentient non-human animals is equally impermissible, and if so, does this not lead to a *reductio* regarding the natural order of predation and reproduction?

  ### 10. Closing: Falsifiability and Evidence
  **Question:** Given that the asymmetry is often defended via reflective equilibrium, what kind of philosophical argument or empirical evidence would count decisively against the view?
  **Anticipated Reply:** (Open-ended; she may cite a successful person-affecting counter-example or a coherent axiology of non-existence).
  **Follow-up:** If the view is insulated from empirical disconfirmation by its conceptual nature, does relying on it to mandate a universal prohibition on procreation impose an unjustified epistemic burden on potential parents?
