answer: |-
  Here is a systematization of your intuitions, formulated as a precise principle, tested against your cases and the new scenarios you requested.

  ### The Principle of Integrated Homeostatic Agency (IHA)

  A system $S$ constitutes a single subject if and only if it satisfies the following four conditions:

  1.  **Emergent Content:** $S$ enters global states whose informational content is not reducible to the state of any proper part of $S$.
  2.  **Sub-Personal Downward Causation:** These global states causally determine the behavior of the parts of $S$ via mechanisms that bypass the parts' own deliberative or semantic interpretation. (The parts respond to the global state as *causes*, not as *reasons*).
  3.  **Homeostatic Closure:** $S$ utilizes these global states to detect and correct deviations from its own operational norms, maintaining its structural and functional integrity over time without external intervention.
  4.  **Temporal Depth:** $S$ retains global states across time intervals sufficient to allow for learning, expectation, or the distinction between error and success.

  ---

  ### Motivation for the Clauses

  *   **Clause 1 (Emergent Content)** is motivated by your **Megaphone Colony**. If the global state is just the scout's state amplified, there is no new subject, only a louder scout. This ensures the subject is genuinely collective.
  *   **Clause 2 (Sub-Personal Downward Causation)** is motivated by your **Firm** and **Clever Keeper** cases. In the Firm, employees read a policy and *choose* to comply; the global state works through their personal agency. In Aunt Hillary, ants respond to pheromones *instinctively*; the global state works through their sub-personal physiology. This clause distinguishes a *coalition of subjects* (Firm) from a *single subject made of organs* (Hillary). It also excludes the Clever Keeper, where the "intelligence" is outsourced to the interpreter's semantic understanding.
  *   **Clause 3 (Homeostatic Closure)** is motivated by your **Ledger** and **Epiphenomenal Colony** cases. The Ledger is static; it cannot use its content to repair itself. The Epiphenomenal colony has patterns that do nothing. A subject must be an *agent* that acts to preserve its own existence and coherence using its global states.
  *   **Clause 4 (Temporal Depth)** is motivated by the nature of **Belief**. A system that tracks only the instantaneous present cannot have beliefs about the world, only reactions to it. This excludes simple thermostats or reflex arcs from subjecthood.

  ---

  ### Predictions for the Four New Cases

  1.  **A colony built from the start out of a mixture of ants and synthetic units doing the same jobs.**
      *   **Prediction:** **Yes.**
      *   **Reasoning:** This satisfies all four clauses. Substrate independence is permitted (as per your Ship of Theseus verdict) provided the functional role (Clause 2) and homeostatic contribution (Clause 3) are maintained. If the synthetic units respond to the chemical field exactly as ants do, the integration holds.

  2.  **A colony whose global states reach only about a tenth of its workers.**
      *   **Prediction:** **No.**
      *   **Reasoning:** This fails Clause 2 (Downward Causation) regarding *integration*. If the global state cannot recruit the majority of the system's resources to act on its content, the system is not functionally unified. It is a fragmented agent, or a subject with severe paralysis, but on a binary verdict, it lacks the causal power to be a distinct subject. It is merely a local pattern.

  3.  **Two colonies held in perfect synchrony so that they share every global state.**
      *   **Prediction:** **Two Subjects.**
      *   **Reasoning:** This satisfies Clause 1 and 4, but fails a corollary of Clause 3 regarding *boundary identity*. If they are physically distinct systems (two nests, two sets of ants) that merely happen to be identical, they are numerically distinct. Sharing *content* does not merge *subjects*. (Like identical twins thinking the same thought are still two thinkers).

  4.  **A colony with global states but no memory at all, tracking only the present.**
      *   **Prediction:** **No.**
      *   **Reasoning:** This fails Clause 4 (Temporal Depth). Without memory, the system cannot distinguish a correction from a new event. It cannot be "mistaken" (Clause 3), because error implies a deviation from a past norm or a future goal. It is a reactive field, not a mind.

  ---

  ### Conflicts and Overturns

  Here is the honest account of where this principle diverges from your verdicts and what that costs.

  **1. The Ledger Case**
  *   **Your Verdict:** No (but unsure why).
  *   **IHA Verdict:** No (Confidently).
  *   **Analysis:** The IHA clarifies your uncertainty. The Ledger fails Clause 3 (Homeostatic Closure). It is a *map*, not a *machine*. It requires the Keeper to be the agent.
  *   **Cost:** None. This stabilizes your intuition.

  **2. The Firm Case**
  *   **Your Verdict:** No.
  *   **IHA Verdict:** No.
  *   **Analysis:** The IHA explains *why* without contradicting your intuition about Hillary. The Firm fails Clause 2. The "official position" is a symbol interpreted by conscious agents (employees). Aunt Hillary's "belief" is a chemical gradient reacted to by sub-conscious organs (ants).
  *   **Cost:** None. This protects Hillary from the "Firm reductio" by identifying the causal mechanism difference.

  **3. The Hillary-and-Hortense Continuum**
  *   **Your Verdict:** Indeterminate in the middle range.
  *   **IHA Verdict:** **Fact of the Matter exists, but it is graded.**
  *   **Analysis:** You asked if there is a fact of the matter. IHA says **Yes**. The line is drawn at the merger of the **Regulatory Loop** (Clause 3).
      *   *Distinct Odours:* Two regulatory loops. Two subjects cooperating.
      *   *Single Field:* One regulatory loop. One subject.
      *   *The Middle (Shared Foraging, Distinct Nests):* This is a **partial merger**. IHA predicts this is not a binary "Yes/No" but a measure of *degree of integration*. However, for counting subjects, we look for *independent homeostatic maintenance*. If they can survive the severing of the link, they were always two subjects with a coupling. If severing the link causes systemic collapse (loss of homeostasis) for one or both, they were one subject.
  *   **Overturn:** I must overturn your comfort with vagueness. There is a fact of the matter: **Are they one homeostatic unit or two?** If the shared network is merely resource-sharing, they are two. If the shared network is *control-sharing* (one colony's state dictates the other's survival behavior), they are merging into one.
  *   **Cost:** You lose the "back and forth" ambiguity. You must accept that some intermediate cases are *unstable hybrids* (two subjects pathologically coupled) rather than a "half-subject."

  **4. The Nested Colonies (Yes at both levels)**
  *   **Your Verdict:** Yes at both levels.
  *   **IHA Verdict:** **Yes, conditionally.**
  *   **Analysis:** This is the hardest case. If the lower colonies are subjects (satisfy IHA), and the upper colony treats them as *parts* (satisfying IHA at the higher grain), you have nested subjecthood.
  *   **Constraint:** This only works if the upper colony's global states bypass the *lower colonies' deliberative capacity*. If the lower colonies "choose" to obey the upper colony, the upper colony is a Firm (Coalition). If the lower colonies are chemically/physically compelled to serve the upper colony's field (like ants in a nest), the upper colony is a Subject.
  *   **Cost:** You must ensure your "smaller colonies" are not *too* agentic. If they are full subjects with their own goals, the upper layer is likely a political coalition, not a mind. If they are "subject-like" but functionally organs to the larger system, both can exist.

  ### Summary of the Repair

  Your tentative principle was very close but lacked a mechanism to distinguish **Symbolic Cooperation** (The Firm) from **Constitutive Coupling** (Aunt Hillary).

  By adding **Clause 2 (Sub-Personal Downward Causation)** and **Clause 3 (Homeostatic Closure)**, we exclude the Firm (which relies on the personal agency of parts) and the Ledger (which lacks self-maintenance), while preserving the Simulation (which replicates the causal logic) and the Synthetic Replacement (which preserves the functional coupling).

  The **Continuum** is resolved by focusing on **Homeostatic Independence**. If the bridge is cut, do they die? If yes, they were one subject. If no, they were two. The "middle range" you described (shared foraging, distinct odours) suggests they are **Two Subjects with a Symbiotic Link**, not one vague subject. The vagueness you feel is the difficulty of distinguishing symbiosis from identity, but the fact of the matter rests on the survival dependency of the regulatory loops.
