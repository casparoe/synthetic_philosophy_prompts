      *   *Question 5: Empirical Assumptions.*
          *   *List:*
              1.  That trust in welfare systems relies on interpersonal signals (accent/history) rather than institutional integrity.
              2.  That migrants time their arrival based on welfare vesting periods rather than labor market conditions.
              3.  That universal benefits require less monitoring/trust than means-tested ones (administrative cost vs. social trust).
              4.  That the "upbringing cost" (Note 5) is a net loss for the sender that isn't offset by remittances.

  4.  **Review against Constraints:**
      *   *No citations?* Check.
