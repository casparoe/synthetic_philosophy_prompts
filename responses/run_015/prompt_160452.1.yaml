          *   *Better Objection:* It creates a "two-tier" citizenship. But the main economic objection is about *moral hazard on the state side*. If the state collects the reversion, do they have an incentive to push people out before vesting?
          *   *Selection Objection:* It doesn't stop people who plan to stay illegally. If I plan to overstay, the reversion clause doesn't bite. It selects for people confident they won't be deported, not necessarily those who won't use welfare.
          *   *Refinement:* The "hostile economist" would say this is just a deferred entry fee. If the expected value of the welfare draw is higher than the vested stake, the adverse selection remains. It prices the risk, but does it prevent the *timing* game?

      *   *Question 4: Weakest Premise.*
