answer: |-
  ### Confidence Statement

  Before we begin, per your request: I am **95% confident** that the phenomenon you describe is real, structurally significant, and currently under-named in the public discourse. I am **90% confident** that there is no single, canonical English noun phrase that captures *exactly* this specific rhetorical move across philosophy, physics, and neuroscience, though several adjacent concepts exist.

  The terminology I offer below is split into two categories: **Established Vocabulary** (terms you can quote with academic backing) and **Proposed Coinage** (terms I am synthesizing to fill the gap, which you should attribute as such or use descriptively).

  What would change my mind? If you produced a paper from the philosophy of complex systems (specifically from the "causal emergence" school, e.g., Erik Hoel, or the IIT critical literature, e.g., Scott Aaronson or Peter Godfrey-Smith) that explicitly labels this "The [X] Problem" where [X] is a standardized term like "The Individuation Fallacy." To my knowledge, no such consensus term exists yet; the debate is currently fought using paragraphs of explanation rather than a single label.

  ---

  ### 1. The Established Vocabulary (The Nearest Neighbours)

  There are three existing concepts that cover parts of this terrain. None cover the whole move, but together they map the boundaries.

  **A. Researcher Degrees of Freedom (Statistics/Methodology)**
  *   **Status:** Established (Simmons, Nelson, & Simonsohn, 2011).
  *   **What it covers:** This is the closest functional equivalent. In statistics, it refers to the many choices a researcher makes during analysis (which variables to include, what time window to measure, how to define an outlier) that can be tweaked until a significant result appears.
  *   **Fit:** It captures the *post hoc* nature and the lack of pre-specified rules.
  *   **Mismatch:** It usually applies to data analysis, not to the fundamental definition of the *object* being studied (ontology). Your example isn't just about how you crunch the numbers, but about what you decide counts as a "thing" in the first place.

  **B. The Grain Problem (Philosophy of Mind / IIT)**
  *   **Status:** Established within niche literature (e.g., Wasmuth, 2019; critiques of IIT).
  *   **What it covers:** This addresses the specific question: "At what spatial or temporal scale does consciousness exist?" IIT attempts to solve this with its **Exclusion Postulate** (which states that only the level with the *maximum* integrated information exists).
  *   **Fit:** It identifies the exact variable being shifted (zoom level, timescale).
  *   **Mismatch:** "The Grain Problem" names the *puzzle*, not the *debating move*. It doesn't capture the sleight-of-hand where the theorist shifts the grain to match their intuition.

  **C. Coarse-Graining (Physics / Complex Systems)**
  *   **Status:** Established (Statistical Mechanics).
  *   **What it covers:** The legitimate scientific practice of grouping micro-states into macro-states to make a system tractable (e.g., treating gas as pressure/temperature rather than tracking every molecule).
  *   **Fit:** It describes the mechanism of the re-description.
  *   **Mismatch:** In physics, coarse-graining is usually dictated by the tools available or the thermodynamic limits, not by whether the result "feels" conscious.

  ---

  ### 2. The Coinage (Naming the Move)

  Since no single term captures the *rhetorical maneuver* of shifting the level of description to preserve a theory's intuition, I propose the following terms for your use.

  **Technical Term: Outcome-Dependent Individuation**
  **Journalistic Term: Scale Gerrymandering**

  #### Definition: **Scale Gerrymandering**
  *Scale Gerrymandering* is the practice of selecting the spatial, temporal, or causal granularity of a system *after* observing the theoretical output, specifically to align that output with pre-theoretical intuitions, without independent justification for why that specific granularity is the ontologically correct one.

  It is distinct from legitimate **Coarse-Graining** because legitimate coarse-graining is constrained by independent factors (e.g., the resolution of the measuring instrument, the thermodynamic closure of the system, or pre-registered experimental parameters). Scale Gerrymandering is constrained only by the desire to avoid counter-intuitive results.

  #### Why "Gerrymandering"?
  In politics, gerrymandering involves drawing district boundaries to ensure a desired election outcome. In these consciousness debates, the "districts" are the boundaries of the system (which neurons count, what millisecond window matters), and the "election outcome" is the verdict on consciousness. The boundaries are drawn to ensure the "right" candidate wins.

  ---

  ### 3. Boundary Cases: When is Re-Description Legitimate?

  You asked where the edges are. How do we distinguish *Scale Gerrymandering* from a legitimate scientific correction? Here is the test:

  **Case 1: The Dodgy Move (Scale Gerrymandering)**
  *   **Scenario:** A theory says a photodiode is conscious.
  *   **Response:** "Ah, but you must look at the timescale of the *mechanism*, not the electron flow. At that scale, phi is zero."
  *   **Verdict:** **Gerrymandering.** Why that timescale? Because it saves the theory from the photodiode objection. If the theory cannot specify the scale *before* the calculation, it is vulnerable to this charge.
  *   **Indicator:** The justification for the scale relies on the *result* ("We must choose this scale because otherwise the result is absurd").

  **Case 2: The Legitimate Move (Constrained Coarse-Graining)**
  *   **Scenario:** A theory says a specific brain region isn't conscious.
  *   **Response:** "We modeled it at 1ms intervals, but biological integration happens at 100ms (gamma cycles). Recalculating at 100ms changes the causal structure."
  *   **Verdict:** **Legitimate.** The timescale (100ms) is justified by independent biological data (neural oscillation literature), not by the desire to make the region conscious.
  *   **Indicator:** The justification for the scale relies on *external data* ("We must choose this scale because independent evidence shows this is how the system operates").

  **Case 3: The False Positive (Looks like Gerrymandering, Isn't)**
  *   **Scenario:** A critic says, "Your theory implies a grid is conscious." The theorist says, "No, a grid has no causal power at the macro scale."
  *   **Verdict:** **Legitimate (potentially).** If the theory includes an **Exclusion Postulate** (as IIT does) that *mathematically mandates* selecting the scale of maximum integration, then shifting the scale isn't a dodge; it's following the math.
  *   **The Catch:** The criticism then shifts to the Postulate itself. If the Postulate allows *multiple* local maxima, and the theorist picks the one that matches human intuition, it reverts to **Scale Gerrymandering**.

  ---

  ### 4. How to Explain This to Readers

  For your column, you can frame it as a crisis of **Individuation**.

  > "Science requires us to count things. To count them, we must know where one thing ends and another begins. In consciousness research, the theory is supposed to tell us which things are conscious. But if we have to decide where the thing *is* before we can run the theory, and we decide that based on where we *think* the consciousness is, we are reasoning in a circle.
  >
  > Call it **Scale Gerrymandering**. It is the move of drawing the boundaries of a system not by the ruler of nature, but by the map of our intuitions. When the theory yields a result we dislike, we zoom in. When it misses something we value, we zoom out. The picture always comes out right, because we adjusted the lens to ensure it did."

  ### 5. Summary of Confidence and Limitations

  *   **Established:** "Researcher Degrees of Freedom," "The Grain Problem," "Coarse-Graining," "Exclusion Postulate." (High Confidence).
  *   **Coinage:** "Scale Gerrymandering," "Outcome-Dependent Individuation." (Medium Confidence — these are descriptive synthesizes, not yet standard lexicon).
  *   **Limitation:** Proponents of IIT would argue this isn't gerrymandering because the **Exclusion Postulate** is a principled mathematical rule, not an intuitive choice. They would claim the "maximum phi" scale is objective.
  *   **Counter-Argument:** Critics (like Aaronson) argue that finding the "maximum phi" scale is computationally intractable and often requires heuristic choices that reintroduce the human bias. This is where your observation holds: the *application* of the postulate often requires the dodgy move, even if the postulate itself is clean.

  **What would change my mind?**
  If a formal paper demonstrated that the "scale" in IIT is uniquely determined by the system's physical connectivity without human intervention (i.e., the math picks the scale automatically, no choices required). Currently, the consensus among critics is that human judgment is still required to define the "nodes" and "edges" before the math can begin. If that consensus shifts, "Scale Gerrymandering" becomes an unfair charge. Until then, it remains the central vulnerability.
