prompt: |-
  I direct the Office of Performance and Innovation for a city of roughly 340,000. My staff is five people, none of them economists; our one analyst is a part-time data person who mostly maintains dashboards. In the spring our city manager attended a conference session on governance by prediction markets and came back convinced we should pilot something he is calling futarchy on a handful of decisions this fiscal year. The version of the idea that persuaded him was roughly the one its originator popularized: let elected officials settle what we are trying to achieve, then let speculators bet on which of the candidate policies will achieve more of it, and adopt whichever branch the market prices higher. He has asked me to produce a written procedure that any program manager in any department can run on an incoming proposal before we commit public money to opening a market. He does not want another essay on whether prediction markets are wise in general; he wants steps, in order, with a stopping condition at each one.

  The constraints are these. The pilot has $60,000 in total, most of which is earmarked for seeding liquidity, because the platform vendor assures us the contracts themselves are trivial to write. Proposals arrive continuously — we field fifteen to twenty serious ones a year and expect four or five to reach the pilot — and each one gets a single afternoon of analysis before our monthly review board, at which the city attorney and one council member must sign off before anything goes live. The decisions at issue range from about $1 million to $15 million and affect anywhere from a few hundred households to most of the city; a couple of them are effectively irreversible for a decade. One department head insists any market must be written on a single dollar figure, and another insists that a dollar figure is exactly the wrong thing to write it on and wants a composite index instead. Please write the procedure so that this disagreement is resolved by the procedure rather than by whoever talks longest.

  Specifically, I need it to tell a non-specialist, step by step: what makes a decision eligible at all, and whether repeatability matters; how to tell a measurable outcome apart from a value, and who is permitted to choose the outcome the contract pays on; how to condition a contract on the policy actually being adopted, and who gets to declare that the condition was met; how thick a market has to be before its price is evidence rather than noise, and what to do when the honest answer is that we cannot get a number; how we would ever know the price was right, given that we only observe the branch we took and the losing branch is never resolved; how we keep a trader from buying the outcome he wants, in the market, in the world, or both, especially when the best-informed potential traders are also interested parties; what the losing side of the bet is entitled to do afterwards; and at which step the procedure must stop and hand the question back to elected officials because it is about what we should want rather than what will happen. Mark clearly which steps are genuinely mechanical and which are judgment calls wearing a procedural costume.

  Then run the procedure on three proposals we actually have on the table. First, whether to convert four low-ridership bus routes into a higher-frequency network, where the transit department wants the contract written on total boardings and the equity office wants it written on total rider-minutes, and where implementation would be partial and phased. Second, whether to sign a ten-year exclusive contract with one waste hauler or keep the collection zones out to competitive bid, where the parties with the best information about the answer are the bidders themselves. Third — and this is the city manager's flagship, the one he has already mentioned to the council — whether to open an overnight shelter at a specific vacant site, with the market written on assessed property values within a half mile over eighteen months. If the procedure kills the flagship, say so plainly and explain what specifically fails; if it lets all three through, tell me it is not a procedure but a rubber stamp. Finally, give me the limits: what classes of decision this will systematically get wrong, what a bad outcome would look like, and what we should be watching in month six that would tell us the pilot is failing before the failure is expensive.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Director, Office of Performance and Innovation (City of ~340k).
      *   **Staff:** 5 people (no economists, 1 part-time data analyst).
      *   **Task:** Create a written procedure for piloting futarchy (governance by prediction markets) on city decisions.
      *   **Constraints:**
          *   Budget: $60k total (mostly liquidity seeding).
          *   Volume: 15-20 proposals/year, 4-5 expected for pilot.
          *   Timeline: Single afternoon analysis per proposal before monthly board review.
          *   Approval: City Attorney + 1 Council Member sign-off required.
          *   Decision Scale: $1M - $15M, impact ranges from hundreds to whole city, some irreversible for a decade.
          *   Conflict: One dept head wants single dollar figure outcome; another wants composite index. Procedure must resolve this.
          *   Tone/Style: Step-by-step, stopping conditions, distinguish mechanical vs. judgment calls, no essays on wisdom of futarchy.
      *   **Specific Requirements:**
          *   Eligibility (repeatability?).
          *   Outcome vs. Value (who chooses?).
          *   Conditioning on adoption (who declares met?).
          *   Market thickness/liquidity (when is price noise?).
          *   Counterfactual problem (how to know price was right if only one branch taken?).
          *   Manipulation (traders buying outcome in market or world).
          *   Losing side rights.
          *   When to hand back to elected officials (values vs. facts).
          *   Apply procedure to 3 specific proposals (Bus, Waste, Shelter).
          *   Provide limits/warning signs.

  2.  **Deconstruct the Challenge (Futarchy in Government):**

      *   *The Core Problem:* Futarchy relies on efficient markets to predict outcomes of policies. Government decisions are often low-frequency, high-stakes, politically charged, and lack liquid markets. The "counterfactual problem" (we only implement the winning policy, so we never know if the market was right about the loser) is fatal to learning. Manipulation is easy when stakeholders are traders.
      *   *The Constraint:* The City Manager *wants* this. I cannot say "Don't do it." I must create a procedure that protects the city from harm while adhering to the manager's directive, effectively acting as a rigorous filter that might kill bad ideas (like the shelter one) without insubordination.
      *   *The Budget:* $60k is tiny for liquidity seeding across 4-5 decisions. This limits market depth significantly.
      *   *The Staff:* No economists. The procedure must be foolproof for non-experts.

  3.  **Drafting the Procedure (Step-by-Step):**

      *   *Goal:* Create a funnel. Most proposals should fail early.
      *   *Step 1: Eligibility (The "Can We?" Check).* Needs to address reversibility and frequency. Futarchy works best on repeatable, reversible decisions. High-stakes/irreversible decisions are bad candidates.
      *   *Step 2: Metric Definition (The "Dollar vs. Index" Conflict).* Need a tie-breaker. The constraint says resolve by procedure. *Solution:* Hierarchy of Metrics. Dollar figures are preferred for auditability, *unless* they create perverse incentives. If disagreement persists, default to the metric most directly tied to the Council's stated goal, verified by the Analyst.
      *   *Step 3: Value vs. Fact (The "Should vs. Will" Check).* This is crucial. Markets predict *facts*, not *values*. If the decision is about what we *want*, it goes to Council, not a market.
      *   *Step 4: Adoption Conditionality.* How to ensure the policy is actually implemented if the market says "yes." Needs a binding trigger.
      *   *Step 5: Liquidity & Thickness.* With $60k total, we can't seed deep markets. Need a minimum threshold of open interest or spread width to validate price.
      *   *Step 6: Manipulation & Insider Trading.* Stakeholders trading on their own actions. Need trading limits or disclosure.
      *   *Step 7: Resolution & Counterfactuals.* Acknowledge we can't know the truth of the loser. The "Losing Side" gets a post-mortem, not a payout based on reality (since reality isn't observed).
      *   *Step 8: Final Sign-off.* Attorney + Council Member.

      *Refining the "Dollar vs. Index" conflict:* The procedure needs a mechanical way to decide. Let's use a "Direct Causality Test." If the dollar figure can be directly manipulated by the actor without achieving the goal, reject it. If the index is too vague, reject it. If both pass, the Office Director (me) decides based on data availability.

      *Refining the Counterfactual:* This is the hardest part of futarchy. We implement the winner. We never resolve the loser. The market price on the loser remains hypothetical. The procedure must acknowledge this limitation: The market informs the *choice*, but we cannot validate the market's accuracy on the unchosen path. This limits learning.

  4.  **Applying the Procedure to the Three Proposals:**

      *   *Proposal 1: Bus Routes (Boardings vs. Rider-Minutes).*
          *   Eligibility: Reversible? Mostly.
          *   Metric: Boardings (easy to game/cut service) vs. Rider-Minutes (better equity measure).
          *   Conflict Resolution: Rider-Minutes aligns better with "service quality" vs. "volume."
          *   Liquidity: Niche interest. Might be thin.
          *   Verdict: *Conditional Pass.* Needs strong seeding.
      *   *Proposal 2: Waste Hauler (Exclusive vs. Competitive).*
          *   Eligibility: 10-year contract. Irreversible for a decade.
          *   Manipulation: Bidders are the best informed traders. Huge conflict of interest. They can trade the market *and* bid the contract.
          *   Verdict: *Hard Fail.* Insider trading/Manipulation risk is too high.
      *   *Proposal 3: Overnight Shelter (Property Values).*
          *   Eligibility: Irreversible (once opened, hard to close). High political heat.
          *   Metric: Property Values. Noisy. Affected by macro factors, not just shelter. Causality is weak.
          *   Value vs. Fact: This is a value judgment (compassion/safety vs. property values).
          *   Verdict: *Hard Fail.* Wrong metric for the goal, high manipulation risk (NIMBYs shorting), value judgment disguised as fact.

  5.  **Drafting the Limits and Warning Signs:**

      *   *Systematic Errors:* Low-frequency events, high political salience, metrics easily gamed.
      *   *Bad Outcome:* Market manipulated to block popular policy, or market validates policy that fails in reality (but we can't prove it).
      *   *Month 6 Watch:* Liquidity drying up, spread widening, stakeholder complaints about insider trading.

  6.  **Review against Constraints:**

      *   *Staff:* Is it simple enough for the part-time analyst? Yes, checklists.
      *   *Budget:* $60k is tight. The procedure needs to enforce liquidity minimums.
      *   *Tone:* Bureaucratic, precise, no fluff.
      *   *Conflict:* The metric dispute is resolved by the "Causality & Auditability" test.
      *   *Counterfactual:* Explicitly addressed.

  7.  **Final Polish:**

      *   Ensure the distinction between "Mechanical" and "Judgment" is clear.
      *   Make sure the "Stop" conditions are prominent.
      *   Ensure the Shelter proposal gets the scrutiny it deserves (since the Manager is invested).
      *   Check the $60k budget implication. If we seed 4 markets at $15k each, that's very thin liquidity. The procedure must reflect that thin markets = no go.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm sabotaging the Manager, but the prompt asks me to be honest ("If the procedure kills the flagship, say so plainly"). The Shelter proposal is fundamentally flawed for futarchy (property values are too noisy/lagging for a shelter impact). I must call that out.

      *(Refining the Metric Conflict)*: The prompt asks to resolve the Dollar vs. Index disagreement by procedure.
      *Rule:* Use the metric with the highest *signal-to-noise ratio* regarding the specific policy intervention, provided it is auditable by the Analyst. If the dollar figure is subject to external macro volatility (like property values), it fails. If the index is subjective, it fails.

      *(Refining the Counterfactual)*: Futarchy's fatal flaw is we don't learn if the market was right about the loser. I need to state that the procedure accepts this risk but limits exposure.

      *(Refining Manipulation)*: If the best informed traders are bidders (Waste), they cannot trade. If they can't trade, the market has no information. Therefore, no market.

  8.  **Final Output Structure:**
      *   Header.
      *   The Procedure (Steps 1-8).
      *   Application to Proposals (Bus, Waste, Shelter).
      *   Limits & Warning Signs.

      *Let's write it.*
answer: |-
  **TO:** City Manager, City Attorney, Review Board
  **FROM:** Office of Performance and Innovation
  **SUBJECT:** Standard Operating Procedure 24-01: Futarchy Pilot Eligibility and Execution
  **DATE:** October 26, 2023
  **BUDGET CAP:** $60,000 (Liquidity Seeding & Operations)

  ### SECTION 1: THE PROCEDURE

  This procedure applies to any proposal seeking to allocate public funds via a prediction market (hereinafter "Market"). Proposals must pass each step sequentially. Failure at any step terminates the proposal for this fiscal cycle.

  **STEP 1: REVERSIBILITY AND FREQUENCY CHECK**
  *   **Question:** If the policy chosen by the Market fails, can it be undone within 24 months at a cost of less than 10% of the original appropriation?
  *   **Question:** Is this decision type repeated at least annually?
  *   **Mechanism:** Office of Performance and Innovation (OPI) Director review.
  *   **Stopping Condition:** If **NO** to either question, the proposal is **INELIGIBLE**. Futarchy requires feedback loops. Irreversible or one-off decisions do not generate sufficient data to validate market performance and pose unacceptable risk.
  *   **Classification:** *Mechanical.*

  **STEP 2: VALUE VS. FACT SEPARATION**
  *   **Question:** Is the decision about what the city *should want* (Value) or what *will happen* (Fact)?
  *   **Mechanism:** OPI Director consults the City Attorney.
  *   **Rule:** Markets may only predict factual outcomes (e.g., "Ridership will be X"). Markets may not resolve value conflicts (e.g., "Is safety more important than cost?").
  *   **Stopping Condition:** If the core disagreement is ethical or political rather than empirical, the proposal is **INELIGIBLE**. Hand the question back to the Council.
  *   **Classification:** *Judgment Call.* (Note: Disguising values as facts is the primary failure mode.)

  **STEP 3: METRIC SELECTION (RESOLVING THE DOLLAR VS. INDEX CONFLICT)**
  *   **Conflict:** Department Head A demands a single dollar figure. Department Head B demands a composite index.
  *   **Mechanism:** OPI Data Analyst applies the **Causality & Auditability Test**:
      1.  **Auditability:** Can the metric be verified by existing city data within 30 days of the resolution date without new surveys or external appraisals?
      2.  **Causality:** Is the metric insulated from external macro-volatility (e.g., interest rates, regional property markets) unrelated to the policy?
      3.  **Incentive:** Does optimizing for this metric create a perverse outcome (e.g., cutting service to boost profit)?
  *   **Tie-Breaker:** If both metrics pass, select the one with the lower historical variance (higher signal-to-noise). If the dollar figure fails the Causality test (e.g., property values), the Index is mandatory. If the Index fails Auditability (e.g., subjective scoring), the Dollar figure is mandatory. If both fail, the proposal is **INELIGIBLE**.
  *   **Classification:** *Mechanical (with Analyst Judgment).*

  **STEP 4: INSIDER AND MANIPULATION RISK ASSESSMENT**
  *   **Question:** Are the parties with the best information about the outcome also the parties who stand to gain/lose financially from the policy implementation?
  *   **Mechanism:** City Attorney reviews potential trader pool.
  *   **Rule:** If the "best informed" traders are vendors, bidders, or direct beneficiaries, they must be banned from trading.
  *   **Stopping Condition:** If banning these traders removes >50% of the likely liquidity or information capacity, the proposal is **INELIGIBLE**. A market without informed traders is a casino, not a forecast.
  *   **Classification:** *Judgment Call.*

  **STEP 5: LIQUIDITY THRESHOLD**
  *   **Question:** Can we seed enough liquidity to ensure the bid-ask spread is <5%?
  *   **Mechanism:** OPI Director calculates seed capital required based on vendor estimates.
  *   **Rule:** Total seeding per market cannot exceed $15,000 (based on $60k budget / 4 expected pilots).
  *   **Stopping Condition:** If the vendor indicates $15,000 is insufficient to prevent price manipulation by a single actor with $5,000, the proposal is **INELIGIBLE**. Thin markets produce noise, not evidence.
  *   **Classification:** *Mechanical.*

  **STEP 6: CONDITIONAL ADOPTION TRIGGER**
  *   **Question:** Who declares the policy "Adopted" for the sake of the contract?
  *   **Mechanism:** The Contract shall read: *"This contract resolves to YES if [Policy X] is formally enacted by [Date] AND [Metric Y] exceeds [Value Z] by [Resolution Date]."*
  *   **Rule:** The City Manager's Office must certify the "Enacted" condition. The OPI Analyst must certify the "Metric" condition.
  *   **Stopping Condition:** If the policy implementation is discretionary or phased such that "Adoption" cannot be binary verified, the proposal is **INELIGIBLE**.
  *   **Classification:** *Mechanical.*

  **STEP 7: COUNTERFACTUAL ACKNOWLEDGEMENT**
  *   **Requirement:** All market documentation must state: *"Only the winning branch will be implemented. The accuracy of the losing branch's price will never be empirically verified."*
  *   **Rule:** The "Losing Side" of the bet is entitled to a Post-Mortem Report but no financial reconciliation based on real-world outcomes of the unchosen path.
  *   **Classification:** *Mechanical.*

  **STEP 8: FINAL AUTHORIZATION**
  *   **Requirement:** City Attorney and one Council Member sign-off.
  *   **Rule:** Sign-off confirms Steps 1-7 are satisfied. It does not constitute endorsement of the policy itself.
  *   **Classification:** *Judgment Call (Political Cover).*

  ---

  ### SECTION 2: APPLICATION TO CURRENT PROPOSALS

  **PROPOSAL 1: Bus Route Conversion (Low Ridership -> High Frequency)**
  *   **Step 1 (Reversibility):** **PASS.** Routes can be adjusted quarterly.
  *   **Step 2 (Value vs. Fact):** **PASS.** Ridership is a fact.
  *   **Step 3 (Metric Conflict):** Transit wants *Boardings*; Equity wants *Rider-Minutes*.
      *   *Auditability:* Both are auditable via tap-card data.
      *   *Causality:* Boardings are susceptible to "gaming" (shortening routes to increase turnover). Rider-Minutes are more robust to service changes.
      *   *Variance:* Rider-Minutes have higher variance but better alignment with "service quality."
      *   *Decision:* **Rider-Minutes selected.** Boardings create a perverse incentive to cut long-distance riders.
  *   **Step 4 (Insiders):** **PASS.** Drivers/Union could trade, but public transit enthusiasts and commuters provide sufficient external liquidity.
  *   **Step 5 (Liquidity):** **CONDITIONAL PASS.** Niche interest. Requires full $15k seed to ensure spread stability.
  *   **Step 6 (Trigger):** **PASS.** Implementation is phased but can be binary certified (Plan A vs. Plan B).
  *   **VERDICT:** **ELIGIBLE.** Proceed with Rider-Minutes contract.

  **PROPOSAL 2: Waste Hauler Contract (Exclusive vs. Competitive Bid)**
  *   **Step 1 (Reversibility):** **FAIL.** 10-year contract. Cost to break >10% of appropriation.
  *   **Step 4 (Insiders):** **CRITICAL FAIL.** The bidders (waste companies) are the only entities with accurate cost data. If they are banned from trading (to prevent bid-rigging via market), the market has no information. If they are allowed to trade, they can manipulate the market to win the contract.
  *   **VERDICT:** **INELIGIBLE.** The information asymmetry is structural. This is a procurement decision, not a prediction problem.

  **PROPOSAL 3: Overnight Shelter (Flagship)**
  *   **Step 1 (Reversibility):** **FAIL.** Opening a shelter at a specific site is politically and practically irreversible for a decade. Closing it triggers immediate litigation and reputational damage.
  *   **Step 2 (Value vs. Fact):** **FAIL.** The core conflict is not whether property values will rise or fall; it is whether the city prioritizes homeless safety over nearby owner equity. This is a Value judgment.
  *   **Step 3 (Metric):** **FAIL.** *Assessed Property Values* within a half-mile over 18 months.
      *   *Causality:* Property values are driven by interest rates, regional economy, and crime stats unrelated to the shelter. The signal-to-noise ratio is near zero.
      *   *Auditability:* Assessments lag reality by 6-12 months. Resolution date cannot be met.
  *   **Step 4 (Insiders):** **CRITICAL FAIL.** The best-informed traders are NIMBY neighbors (who want to short the market) and shelter operators (who want to go long). Both are interested parties. This invites manipulation to influence the decision, not predict it.
  *   **VERDICT:** **INELIGIBLE.** This proposal fails Steps 1, 2, 3, and 4.
      *   *Specific Failure:* You cannot use a noisy, lagging financial metric (property values) to resolve a high-salience value conflict (homelessness vs. property rights) in a low-liquidity market. Doing so will result in a market price that reflects local political activism, not policy efficacy.

  ---

  ### SECTION 3: LIMITS AND WARNING SIGNS

  **SYSTEMATIC ERRORS**
  This procedure will systematically reject:
  1.  **High-Stakes/One-Off Decisions:** Capital projects, long-term contracts, zoning changes.
  2.  **Value Conflicts:** Any decision where "success" is defined by competing stakeholder groups rather than a single dataset.
  3.  **Noisy Metrics:** Outcomes influenced heavily by external macro-factors (property values, regional crime rates, unemployment).

  **WHAT A BAD OUTCOME LOOKS LIKE**
  A "successful" market that leads to a policy failure. Because of the **Counterfactual Problem (Step 7)**, we will never know if the market was wrong about the losing option. A bad outcome is when the market price is manipulated by a stakeholder group to force a policy choice that benefits them financially (via the market payout) rather than the public.

  **MONTH SIX WATCH LIST (FAILURE INDICATORS)**
  1.  **Spread Widening:** If the bid-ask spread on any active contract exceeds 10%, liquidity has dried up. The price is no longer evidence. **Action:** Pause seeding.
  2.  **Concentration:** If any single wallet holds >20% of the open interest on a contract, manipulation is likely. **Action:** Freeze trading and investigate.
  3.  **Metric Gaming:** If the department responsible for the metric begins changing data collection methods mid-contract. **Action:** Void the market.
  4.  **Political Leakage:** If Council members reference market prices as "public will" rather than "probability estimates." **Action:** Issue corrective guidance immediately.

  **FINAL NOTE ON BUDGET**
  With $60,000 total and a $15,000 per-market cap, we cannot support deep markets. We are buying *signals*, not *truth*. If the signal conflicts with strong departmental data, the departmental data prevails. The market is an advisory input, not a binding vote.

  **APPROVED BY:**
  Director, Office of Performance and Innovation
