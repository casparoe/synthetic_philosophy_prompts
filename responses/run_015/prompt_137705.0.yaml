answer: |-
  Here is the principle, the commitment, and the costs.

  ### The Principle: Validated Contextual Authority

  Promising is not about predicting the future, and it is not primarily about reliance. It is an act of **transferring authority**. When you say "I promise," you are handing the promisee a specific normative right: the right to demand performance from you and to hold you accountable if you fail.

  However, this transfer is not unlimited. It is governed by three constraints:
  1.  **Validity:** The transfer must be voluntary, informed, and morally permissible (voids coercion, lies, and immoral acts).
  2.  **Scope:** The *extent* of the authority transferred is defined by the **reasonable stakes of the context**.
  3.  **Persistence:** Once transferred, the right belongs to the promisee. It does not vanish because they forget it, die, or lose capacity, unless they explicitly waive it.

  ### Where I Overturn Your Verdict

  Your theory of the **Plane Guy** is wrong. You say the promise "binds, but barely — like a 2 out of 10."

  My principle says this is a category error. The **obligation** is binary: you either transferred authority or you didn't. If you used the word "promise," you transferred it. The *stakes* were low (an article vs. a dog), so the *harm* of breaking it is low, and the *social blame* is low. But the **bindingness** is not 2/10. It is 10/10.

  You feel it's "barely binding" because you are conflating the *wrongness of the violation* with the *severity of the consequences*. If you don't email the article, you haven't committed a small wrong; you have committed a full violation of a small right. Recognizing this matters because it explains why you still feel a twinge of guilt even though he forgot. You violated his authority, not just his expectations.

  ### Predictions on Your Unsettled and New Cases

  **1. The Alzheimer's Case**
  **Verdict:** You must go.
  **Reasoning:** Under the Persistence constraint, the authority you transferred belongs to her, not her current mental state. A property right doesn't vanish because the owner gets amnesia. The *stakes* (her emotional comfort) may have dropped to near zero, which lowers the *harm* of your absence, but the *obligation* remains because the right was validly transferred when she was competent. You go not because she needs it, but because *you owe it*. To stop going is to unilaterally reclaim authority you gave away.

  **2. The Brother's Confidence**
  **Verdict:** You break the promise.
  **Reasoning:** This hits the Validity constraint (moral permissibility). You cannot transfer authority over an action that violates a higher moral duty (preventing genuine awfulness). The promise is void *ab initio* regarding the harmful act. You do not owe him secrecy; you owe the potential victim safety.

  **3. The Pressured Release**
  **Verdict:** You are still bound.
  **Reasoning:** A release is itself a promise (a promise not to hold the other to account). If that release was extracted under pressure, it fails the Validity constraint (voluntariness). You cannot be forced to give up a right you hold, and the promisor cannot force you to release them. The original promise stands.

  ### Where My Answer Is Likely Wrong

  I am willing to admit two specific failures of this account.

  **1. The "Self-Promise" Exclusion**
  My theory explicitly excludes your New Year's Resolution case. I argue that **you cannot promise yourself.** You cannot transfer authority to yourself because you already possess it. If you "break" a promise to yourself, you aren't violating a normative claim; you are just failing at discipline. My theory calls your intuition here a mistake. If you feel a distinct *moral* guilt (rather than just frustration) when breaking a self-promise, my theory cannot explain it. It treats self-promises as metaphors, not real promises.

  **2. The "Scope" Fuzziness**
  My theory relies on "reasonable stakes of the context" to explain why the Dog promise is heavier than the Plane promise. This is the soft underbelly of the account. It risks circularity: *Why were the stakes higher?* Because we feel more bound. *Why do we feel more bound?* Because the stakes were higher. I don't have a clean metric for measuring "contextual stakes" other than appealing to shared social intuition. If you and I disagree on whether a plane article is low-stakes or high-stakes, my theory offers no objective arbiter other than "what a reasonable person would think," which is often just a polite way of saying "I don't know."

  ### Summary
  I commit to **Validated Contextual Authority**. It treats promises as real transfers of power, not just predictions or reliance-generators. It demands you keep the Alzheimer's promise, it corrects your assessment of the Plane Guy, and it admits it has no idea how to handle promises made to yourself.
