answer: |-
  Short answer
  There is no single canonical noun for the question itself, though the dynamic is widely discussed under **underdetermination** and **theory-ladenness**. You might best call it a **conceptually elastic question**, where the terms stretch to accommodate any empirical outcome.

  The nearest established notions
  The phenomenon you describe sits at the intersection of three well-known philosophical concepts. The first is **underdetermination**, associated with Quine and Duhem. This thesis holds that empirical data is never sufficient to uniquely determine a theory because auxiliary hypotheses can always be adjusted to save the core claim. In your case, the core claim is about innate ideas, and the auxiliary hypothesis is about wiring time or low-level cues. The data doesn't falsify the theory; it just forces a tweak in the auxiliaries.

  The second is **theory-ladenness**, championed by Hanson and Kuhn. This suggests that observation is not neutral; what counts as "seeing a cube" depends on the observer's conceptual framework. If one side defines vision as immediate recognition and the other as usable discrimination, they are literally seeing different things despite looking at the same subject. This mirrors your observation that the re-descriptions are individually reasonable; each side observes through a different theoretical lens.

  The third is **open texture**, a term coined by Waismann. He argued that most empirical concepts have an inherent indeterminacy; we cannot define all possible future conditions of their use. The concept of "recognition" has an open texture because we didn't know until recently that we could test it with cataract surgery or sensory substitution. When the new situation arises, the concept stretches to cover it. Finally, there is the **verbal dispute**, often discussed by Carnap or Chalmers. This suggests the disagreement is merely about language, not facts. If both sides agree on the physics of the eye and the behavior of the subject but disagree on whether it counts as "knowing," the dispute is semantic. All four notions capture the feeling that the argument persists despite the evidence, because the evidence itself is being processed through flexible theoretical structures.

  Where each falls short
  Despite their proximity, none of these notions quite captures the specific pathology of the question itself. Underdetermination typically describes a temporary state of theory choice, implying that enough data will eventually tip the scale. Your case suggests the question might *never* be settled, not because data is scarce, but because the question absorbs data by design. It treats the absorption as a feature of the question's structure, not just the theories surrounding it.

  Theory-ladenness explains why observers disagree, but it doesn't explain why the *question* remains stable while the answers shift. It focuses on the perception of the evidence, not the resilience of the inquiry. Open texture describes the vagueness of concepts, but it doesn't account for the strategic way these concepts are tightened or loosened to protect a philosophical position. It implies innocence, whereas your case suggests a structural immunity to falsification.

  Finally, calling it a verbal dispute risks dismissing the substantive stakes. You noted the re-descriptions are reasonable, not just semantic quibbles. The disagreement isn't merely about the word "see"; it's about the architecture of the mind. A verbal dispute implies we could solve it by stipulating a definition. Your case suggests that even stipulating a definition (like a time window) just moves the debate to whether that definition matters. The problem isn't just language; it's that the question functions as a container that expands to hold whatever evidence is poured into it.

  Definition and boundary
  I propose the term **Conceptually Elastic Question**. This is a query where the critical terms lack fixed operational boundaries, allowing competing frameworks to reinterpret empirical outcomes without falsification. To count as elastic, the question must survive contradictory evidence by shifting the criteria for what counts as an answer, while maintaining the appearance of asking the same thing.

  A clear case is the debate over **Free Will**. Compatibilists and incompatibilists absorb neurological data about determinism by redefining "freedom" either as the absence of coercion or the absence of causal determination. The question persists because the core concept stretches to fit the physics. A near miss is the question of **whether light is a particle or wave**. This looked elastic for centuries, but it was eventually resolved by quantum mechanics, which hardened the concepts. The question didn't stretch; the theory changed to make the question precise. The boundary lies in whether new evidence forces a theory change (near miss) or merely a reinterpretation of the question's terms (elastic case).

  Back to Molyneux
  Your diagnosis is correct: the time-window issue is the primary locus of elasticity. "At first sight" is the elastic term; setting it to half a second versus five minutes isn't just measurement noise, it's choosing which philosophical framework wins. Your savings test is a genuine attempt to harden the operationalization, moving from a binary state (knows/doesn't know) to a rate of change. This escapes the binary trap, but it remains vulnerable. If one side argues that faster learning is just general intelligence and not cross-modal transfer, the elasticity returns. The savings test is a sharper instrument, but unless the camps agree on what savings *implies* about innate ideas, the question remains conceptually elastic.
