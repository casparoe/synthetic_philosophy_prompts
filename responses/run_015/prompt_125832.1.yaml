      *(Self-Correction during drafting)*: I need to make sure I don't just say "Dan is wrong." I need to explain *why* the math he cites doesn't bind them. The key distinction is "Common Priors." Dan assumes the case studies *are* the prior. User assumes local history *is* the prior. They aren't starting from the same place.
      Also, the bet. If Dan offers 70% odds (e.g., User puts $200 on "Fail", Dan puts $466 on "Success" to make it even money at 70%? Or does he mean even money bet?). The prompt says "at his odds." If Dan thinks it's 70%, he should offer 3:7 odds. If he offers even money, he's giving away value. Let's assume he offers odds consistent with 70%.
