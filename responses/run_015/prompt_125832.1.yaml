      *(Refining the "Split the Difference" advice)*: Is it rational to report 55%? If the committee needs a single number for a cost-benefit analysis, averaging might be the best *procedural* solution, even if epistemically shaky. It represents the committee's collective uncertainty.

      *(Refining the "Ladder")*: The ladder stalled because they updated on the *fact* of disagreement, but not on the *reason*. Once I know you think 70%, I update. But if I know *why* you think 70% (reference class) and I still weigh local culture higher, I won't move further. That's rational.

