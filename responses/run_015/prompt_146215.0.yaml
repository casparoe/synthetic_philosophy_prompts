          *   *Strength:* Protects against "hit and run" development or transient majorities. Acknowledges that a home is more than an asset; it's a repository of memory and relationship.
          *   *Weakness:* Can calcify neighborhoods, preventing necessary evolution. Privileges age over need.

      *   **Principle 2: Housing Justice and Access (Anti-Tenure/Pro-YIMBY).**
          *   *Argument:* Exclusionary zoning harms the poor and marginalized. Weighted voting creates a veto for incumbents, driving up costs. Housing is a basic need; property rights are not absolute.
          *   *Strength:* Addresses the exclusionary history of zoning. Prioritizes human need over local preference.
          *   *Weakness:* Can ignore legitimate local concerns (shadow, traffic, infrastructure). Can feel like colonialism ("outsiders deciding our fate").

      *   **Principle 3: Historical Rectification (The Grandmother Factor).**
          *   *Argument:* Past injustices (urban renewal/highways) create a specific duty to protect existing vulnerable communities from *further* disruption.
          *   *Strength:* Acknowledges that "neutral" rules often repeat historical harms.
          *   *Weakness:* Can be weaponized by wealthy incumbents who weren't the victims of the original injustice. Conflates "long-term white homeowners" with "displaced black families."

      *   **Principle 4: Democratic Equality (One Person, One Vote).**
          *   *Argument:* Political power shouldn't be bought or earned through time. Everyone affected should have equal say.
          *   *Strength:* Prevents oligarchy of old-timers.
          *   *Weakness:* Ignores that some are *more* affected than others (immediacy of impact).

      *   **Principle 5: Property Rights vs. Social Obligation.**
          *   *Argument:* Owners have a right to enjoy their property without nuisance. But property is a social institution subject to regulation for the common good.
          *   *Strength:* Balances individual liberty with collective welfare.
          *   *Weakness:* Vague on where the line is drawn.

  3.  **Constructing the Strongest Versions:**

      *   *For Weighted Voting:* It's not about privilege; it's about *stake*. Long-term residents have "sweat equity" in the social fabric. They are the custodians of the neighborhood's identity. Without protection, neighborhoods become commodities churned by capital, losing the stability required for community trust. It mimics corporate shareholder structures (long-term holders get more say) or academic tenure (protection to allow long-term thinking).
      *   *Against Weighted Voting:* It institutionalizes exclusion. It creates a "caste system" of citizenship within the city. It conflates *duration* with *virtue*. It effectively grants a veto to those whose financial interests align with scarcity. It violates the principle that the city belongs to everyone, not just current occupants.

