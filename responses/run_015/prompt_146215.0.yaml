          5.  The Verdict (Weighted Vote).
          6.  Confidence & Empirical Flags.

      *   *Refining the Argument on Weighted Voting:* The core philosophical error is conflating *attachment* with *authority*. Attachment is real, but authority in a democracy (or a city) must be grounded in equality or impact, not tenure. Tenure correlates with age and wealth, not necessarily wisdom or stake.
      *   *Refining the History Argument:* The "Highway vs. Duplex" distinction is vital. One was state violence for infrastructure; the other is market activity for housing. Blocking the latter doesn't fix the former; it often exacerbates the economic exclusion that followed the displacement.
      *   *Refining the Money Argument:* NIMBYism isn't invalid just because money is involved. But money cannot be the *sole* justification for using state power to exclude.

  6.  **Self-Correction/Review during drafting:**
