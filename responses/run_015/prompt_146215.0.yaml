      *   *Resident Claim vs. Prospective Claim:* Current residents have a claim to *not be harmed* (nuisance, loss of light). Prospective residents have a claim to *opportunity* (access to jobs, schools). The harm to the outsider (exclusion) is often greater than the harm to the insider (change in character).
