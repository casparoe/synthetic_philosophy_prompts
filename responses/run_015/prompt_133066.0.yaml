answer: |-
  Dear Student,

  Based on the pattern of rulings you have described from your professor, I predict she will likely declare the new case involving the unelected long-term stability council illegitimate. Her reasoning would probably center on the distinction between precommitments that protect fundamental rights or democratic conditions versus those that lock in specific policy preferences or governance structures for future generations. In the past, she validated the torture ban because it protects a basic human right, and she validated the savings account lock because it was a form of self-binding with a safety valve for unforeseen circumstances. However, she rejected the carbon tax and the national curriculum because they imposed specific policy choices on future citizens who did not consent to them, effectively reducing their sovereign power to govern themselves. The stability council fits this latter category because it creates an unelected body with the power to veto future laws, which restricts the democratic agency of future generations without offering a clear escape hatch, much like the carbon tax scenario. Furthermore, the sixty-five percent support is lower than the seventy percent support she rejected for the national curriculum, suggesting that supermajority consent alone cannot legitimize a structure that insulates power from future majorities.

  The primary rule she appears to be running is what we might call the Democratic Sovereignty and Fundamental Rights principle. Under this rule, constitutional precommitment is permissible only when it safeguards the essential conditions of democracy or basic human dignity, such as the ban on torture, or when it allows the current generation to bind themselves while preserving a mechanism for future correction, like the court-ordered escape hatch for the savings account. Any amendment that binds future generations to specific policy outcomes or administrative structures without their consent is illegitimate because it treats the constitution as a policy lock rather than a framework for self-governance. This explains why the local forest ban was acceptable, as local decisions are easier to undo and affect a smaller consent community, whereas national policy locks like the curriculum or tax rate are too restrictive on the future populace. The stability council fails this test because it is a national governance structure that limits future legislative power based on predictions of harm, which is a policy judgment, not a fundamental right.

  However, there is an alternative rule that fits her past verdicts almost equally well, which focuses strictly on Procedural Flexibility and Reversibility. Under this rule, the legitimacy of a precommitment depends entirely on whether future generations have a realistic mechanism to undo it if circumstances change. The savings account was legit because of the escape hatch, and the town forest was okay because it was easy to undo. The torture ban might be an exception under this rule, or perhaps she views rights as inherently non-reversible. The carbon tax and curriculum were rejected because the thresholds to change them were too high, making them practically irreversible. The stability council would be illegitimate under this rule because thirty-year terms and veto powers create a rigid structure that is difficult to reverse, regardless of whether the subject matter is rights or policy. This rule shifts the focus from what is being decided to how hard it is to un-decide it.

  To split these two rules, you would need a case that involves a fundamental right or principle but lacks procedural flexibility, or a policy lock that is highly reversible. Consider a constitutional amendment that bans the use of capital punishment forever with no exception and no override clause. Under the Democratic Sovereignty and Fundamental Rights rule, this should be legitimate because it protects a human right similar to the torture ban, regardless of the lack of an escape hatch. However, under the Procedural Flexibility and Reversibility rule, this should be illegitimate because it binds future generations forever without any mechanism to change course, similar to the rejected carbon tax or the stability council. Alternatively, you could propose a constitutional amendment requiring a balanced budget every year that can be overridden by a simple majority vote during a declared emergency. The Sovereignty rule might reject this as a policy lock that binds future fiscal choices, while the Flexibility rule might accept it because the escape hatch is easy to use. Either of these cases would force your professor to choose between protecting substantive rights and ensuring procedural freedom for the future.

  I hope this helps you prepare for the upcoming case discussion. It sounds like a fascinating semester where the tension between present consent and future autonomy is being carefully mapped out. If you pay close attention to whether she emphasizes the subject matter of the amendment or the difficulty of reversing it during the class debate, you will see which of these rules she prioritizes. Good luck with the analysis next week.

  Sincerely,

  Your Assistant
