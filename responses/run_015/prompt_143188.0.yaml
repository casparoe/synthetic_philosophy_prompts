  # APPENDIX III: TAXONOMY OF COMMITMENTS REGARDING VERISIMILITUDE
  **Prepared for the Seminar on Realism and Representation**  
  **Date: [Redacted]**

  ### Instructions for Use
  This decision tree is designed to map the logical architecture of a respondent's position on scientific progress. It avoids established nomenclature in the diagnostic phase to prevent signaling. Proceed from the Root through the branching nodes. At each junction, select the option that best aligns with your intuitions regarding the specific cases presented. The terminal leaves identify the resulting philosophical position, note significant convergences, or diagnose logical vacancies.

  ***

  ### ROOT NODE: The Intelligibility of Progress
  **Question:** Is the history of scientific theory-change intelligible as a movement toward a more accurate representation of mind-independent reality, or is "progress" strictly a measure of increasing empirical adequacy and problem-solving efficiency?

  *   **[A] Progress is strictly empirical efficiency; "proximity to truth" is a misleading metaphor.**  
      ⮕ **LEAF 1: Epistemic Deflation / Constructive Empiricism**  
      *(Commitment: One must abandon the idea that mature science tells us what the world is like, only what it observes like.)*

  *   **[B] Progress involves increasing proximity to the truth, even for false theories.**  
      ⮕ **Proceed to Node 1.**

  ***

  ### NODE 1: The Distribution of Falsehood
  **Question:** Consider a theory that yields exceptional predictive coverage but entails one fundamental ontological falsehood (e.g., treating space as absolute rather than relational). Compare this to a rival theory that is strictly true in all its claims but offers significantly weaker predictive coverage. Is the false but powerful theory *closer to the truth* than the weak but true theory?

  *   **[A] No. Any falsehood disqualifies a theory from having greater verisimilitude than a wholly true theory.**  
      ⮕ **LEAF 2: Popper's Early Definition (1963)**  
      *(Diagnosis: **Collapsed.** This position was logically refuted by Miller and Tichý (1974), who demonstrated that under this definition, no false theory can be closer to the truth than any other. To hold this is to maintain a concept that entails its own emptiness.)*

  *   **[B] Yes. Truthlikeness allows for trade-offs between content and accuracy.**  
      ⮕ **Proceed to Node 2.**

  ***

  ### NODE 2: Structural Correspondence vs. Propositional Content
  **Question:** When calculating this proximity, does the *arrangement* of terms matter independently of their truth-value? If Theory A correctly maps the causal relations between variables but gets the numerical constants wrong, and Theory B gets the constants right by accident but posits no causal structure, is Theory A closer to the truth?

  *   **[A] No. Verisimilitude is a function of the count of true versus false propositions (content).**  
      ⮕ **Proceed to Node 3.**

  *   **[B] Yes. Verisimilitude requires a match in the "shape" or structure of reality, not just sentence matching.**  
      ⮕ **LEAF 3: Structural-Realist / Similarity-Based Account**  
      *(Note: **Convergence Zone.** This leaf captures both Verisimilitudinarian Structural Realism (e.g., Psillos) and Similarity Accounts (e.g., Niiniluoto's later work). The distinction between "structure" and "similarity" here is pragmatic rather than logical; both commit to the view that reference can be partial and relations can be preserved despite ontological error.)*  
      *(Awkward Commitment: One must explain how structure is individuated without relying on the very vocabulary subject to language-dependence paradoxes.)*

  ***

  ### NODE 3: The Interpretation of Formal Obstacles
  **Question:** Formal proofs (Miller/Tichý) demonstrate that content-based measures of truthlikeness vary depending on the linguistic vocabulary used to translate the theory (e.g., "rainy/windy" vs. "rainy/minnesotan"). Does this language-dependence demonstrate a fatal flaw in the concept of content-based verisimilitude?

  *   **[A] Yes. If the measure shifts with language, the metric is objective nonsense.**  
      ⮕ **LEAF 4: Unnamed (The Skeptical Realist)**  
      *(Diagnosis: **Incoherence.** This position asserts that truthlikeness is real and measurable [Root B] but accepts that all proposed metrics are logically invalid [Node 3A]. It occupies a space of desire without mechanism.)*

  *   **[B] No. The obstacle is surmountable through refined logical constraints or normalized metrics.**  
      ⮕ **Proceed to Node 4.**

  ***

  ### NODE 4: Comparative vs. Absolute Assignment
  **Question:** Is verisimilitude essentially a relation between rival theories (Theory A is closer than Theory B), or can it be assigned as an absolute value to a single framework (Theory A is 0.8 true)?

  *   **[A] Strictly Comparative. We can only rank rivals, never assign a score.**  
      ⮕ **LEAF 5: Popper's Revised Comparative Account**  
      *(Awkward Commitment: This requires a logic of confirmation that allows for ranking without quantification. It avoids the precision trap but leaves the "distance" to truth undefined.)*

  *   **[B] Absolute. A theory can possess a specific degree of truthlikeness independent of rivals.**  
      ⮕ **LEAF 6: Quantitative Content Account (e.g., Niiniluoto's Min-Sum)**  
      *(Awkward Commitment: One must defend the choice of metric (sum vs. min) against the charge of arbitrariness. Why is the distance between propositions measured *this* way and not another?)*

  ***

  ### VACANCIES AND UNOCCUPIED LOGICAL SPACE

  **Vacancy I: The Absolute Skeptic**  
  *Path:* Root [B] → Node 1 [B] → Node 2 [A] → Node 3 [A] → Node 4 [B].  
  *Diagnosis:* **Unattractiveness.** This position claims one can assign an absolute score to a theory's truthlikeness while simultaneously admitting that all metrics for doing so are language-dependent and therefore invalid. No serious theorist occupies this node.

  **Vacancy II: The Non-Comparative Structuralist**  
  *Path:* Root [B] → Node 1 [B] → Node 2 [B] → Node 4 [B] (without Node 3).  
  *Diagnosis:* **Neglect.** While structural realists often imply absolute progress, few have formalized an absolute metric for structural matching that avoids the content-counting paradoxes. This is a live area for construction rather than a settled position.

  ***

  ### SEMINAR NOTE ON CONVERGENCE
  Participants should note that **Leaf 3 (Structural/Similarity)** and **Leaf 6 (Quantitative Content)** often yield identical judgments in practical scientific cases. The divergence is metaphysical: Leaf 6 treats the world as a set of states describable by logic; Leaf 3 treats the world as a system of relations describable by mapping. In the context of this seminar, treat them as distinct only when the discussion turns to the *nature* of the obstacle, not the *outcome* of the judgment.
