  Here is the principle, the analysis of the gap, the answer to the raft question, and my commitment regarding your verdicts.

  ### The Principle

  **The Principle of Vested Security and Expected Survival**

  1.  **Primary Duty:** Act to maximize the expected number of survivors.
  2.  **Security Constraint:** Do not actively inflict fatal harm upon a person who has established **Vested Security** (physical possession of a safe place aboard), unless doing so is the *only* way to prevent **Certain Total Loss** (death of all aboard) or the person has **Forfeited** their claim.
  3.  **Forfeiture Conditions:** A claim is forfeited if (a) the person is culpable for the danger, (b) the person will die inevitably regardless of intervention, or (c) the person's removal is necessary to utilize their unique instrumental value to save the rest (e.g., navigation).
  4.  **Pre-Vesting Partiality:** Among those *without* Vested Security (e.g., in the water), it is permissible to prioritize based on special obligations (kin) or expected life-years (age), provided this does not violate the Primary Duty significantly.
  5.  **Refusal Symmetry:** Refusing admission to those without Vested Security is governed solely by the Primary Duty (maximize expected survivors), without the Security Constraint.

  ### Application to Your Cases

  *   **(1) Fifteen aboard, certain death:** The Security Constraint is overridden by the **Certain Total Loss** clause. Ejection is permissible. The volunteer preference is captured by **Forfeiture** (voluntary waiver of claim).
  *   **(2) Twelve aboard, three in water:** Those in water lack **Vested Security**. The Primary Duty dictates keeping the boat safe (12). Refusal is permissible. The Security Constraint does not apply because no right has vested.
  *   **(3) Graded risk (stopping at 14):** *See Commitment below.* The principle dictates continuing to maximize expected survivors unless the risk approaches Certain Total Loss.
  *   **(4) Fourteen aboard, eject to reduce risk (10% $\to$ 2%):** The Security Constraint forbids active ejection because the risk (10%) does not constitute **Certain Total Loss**. The gain (8% risk reduction) does not outweigh the violation of Vested Security.
  *   **(5) Culpable panic-maker:** **Forfeiture Condition (a)** applies. He goes first.
  *   **(6) Skills (Navigator/Radio/Doctor):** **Forfeiture Condition (c)** applies to Navigator/Radio (instrumental to survival). Doctor is uncertain because their value is probabilistic, not deterministic for the boat's physical safety.
  *   **(7) Unconscious/Dying vs. Age:** Unconscious man meets **Forfeiture Condition (b)** (inevitable death). Age (70 vs. 20) falls under **Pre-Vesting Partiality** (expected life-years), but once aboard, Vested Security equalizes them; hence your refusal to choose between healthy adults is correct under the Security Constraint (no grounds for forfeiture).
  *   **(8) Wife vs. Stranger:** Wife in water vs. Stranger in water = **Pre-Vesting Partiality** (take wife). Stranger aboard (Vested) vs. Wife in water = **Security Constraint** forbids ejecting stranger for wife.
  *   **(9) Child vs. Adult:** In water = **Pre-Vesting Partiality** (expected life-years favors child). 2 Adults vs. 1 Child = **Primary Duty** (maximize numbers). 20 vs. 80 = **Pre-Vesting Partiality** suggests 20, but your indecision suggests a conflict with equality; the principle resolves this in favor of expected life-years.

  ### Closing the Gap: (2), (3), and (4)

  You asked if a single principle can treat leaving a person in the water as permissible (2) while treating identical risk reduction via ejection as impermissible (4).

  **Yes.** The distinction is not merely a label; it is the **Security Constraint** (Clause 2).

  Morally, there is a difference between *withholding aid* (2) and *active killing* (4). In (2), the threat is the sea (nature); you are merely failing to intervene. In (4), the threat is *you*; you become the agent of death. The **Vested Security** clause codifies this: once a person is aboard, they have entered a social contract of mutual protection. Violating that contract requires a higher threshold of justification (Certain Total Loss) than withholding entry (which requires only Expected Survival optimization).

  This explains why (4) feels wrong while (2) feels permissible, even if the arithmetic is similar. In (2), you are maintaining a safe system. In (4), you are sabotaging a secure individual to improve system statistics.

  ### The Raft Question

  *Case: Three must go, but there is a small raft with a 20% (or 0.5%) chance of rescue.*

  **Does permissibility vary continuously?** **Yes.**
  The **Security Constraint** prohibits *inflicting fatal harm*. If the "water" includes a raft, the harm inflicted is no longer certain death, but *exposure to risk*.
  *   **At 20% survival:** The harm is significantly reduced. If the risk to the boat is high enough, the Primary Duty (maximize survivors) may override the Security Constraint because you are not condemning them to *certain* death, only to a risky alternative.
  *   **At 0.5% survival:** This is functionally equivalent to certain death. The Security Constraint holds; ejection is impermissible unless Total Loss is certain.

  The permissibility scales with the **Expected Harm Inflicted**. If Expected Harm (Ejection) < Expected Harm (Boat Swamping), ejection becomes permissible. The raft transforms the act from "killing" to "risk-transfer."

