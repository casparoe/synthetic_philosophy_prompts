answer: |-
  A unified principle is available. You do not need to abandon your settled verdicts on the dying patient or the dementia patient, but you must resolve your ambivalence about the seven-year-old by aligning it with the dying patient, not the dementia patient.

  The principle that captures your judgments is **The Principle of Rational Stewardship**.

  ### The Principle of Rational Stewardship
  **Deception is impermissible unless:**
  1.  **Incapacity Clause:** The listener currently lacks the functional cognitive capacity to integrate the specific truth into a coherent practical narrative or decision-making process without incurring disproportionate psychological harm that yields no agential benefit; **OR**
  2.  **Defense Clause:** The truth would be weaponized by a hostile agent to violate the fundamental rights (life, bodily integrity, liberty) of the listener or the speaker; **OR**
  3.  **Restoration Clause:** The deception is temporary, necessary to prevent immediate harm, and explicitly aimed at restoring the listener's capacity for rational engagement with the truth.

  **Furthermore, in all permissible cases, the deception must not undermine the listener's developing or remaining capacity for truth-tracking in domains where they retain agency.**

  ---

  ### Motivation by Case

  **1. The Incapacity Clause (Dementia vs. Dying Patient)**
  This clause explains your sharpest split.
  *   **Dying Patient (Impermissible):** She retains the *functional capacity* to integrate the truth. Knowing her son did not call allows her to process grief, adjust her final narrative, and perhaps make other calls. Lying substitutes your judgment for hers, violating her standing as a rational agent facing the end of her life. The harm of the truth (sadness) is outweighed by the agential benefit (closure/reality-facing).
  *   **Dementia Patient (Permissible):** She lacks the *functional capacity* to integrate the truth. Because her memory does not retain the information, the truth cannot be woven into a narrative; it only generates "fresh grief" repeatedly. There is no agential benefit to the truth because she cannot act on it or integrate it. The harm is pure and disproportionate.
  *   **Seven-Year-Old (Resolution):** This case troubles you because it sits on the boundary. However, under this principle, the child has *emerging* capacity. Unlike the dementia patient, she *can* integrate the truth (death is permanent) into her developing understanding of the world. Lying ("farm") treats her emerging rational capacity as unworthy, stunting her ability to process loss. Therefore, this principle dictates the lie is **impermissible**, though the *manner* of truth-telling can be gentle. This aligns the child with the dying patient (agents capable of integration) rather than the dementia patient (agent incapable of integration).

  **2. The Defense Clause (Armed Intruder)**
  *   **Intruder (Permissible/Obligatory):** The intruder intends to use the truth (roommate's location) to violate fundamental rights. The "practical narrative" here is one of violence. You are not obligated to facilitate his agency. This clause overrides the general duty of truthfulness.

  **3. The General Prohibition (Hiring, Friend, Check)**
  *   **Hiring/Friend/Check (Impermissible):** In these cases, the listeners have full capacity, and the truth is required for their practical reasoning.
      *   **Hiring:** The manager needs truth to assess risk.
      *   **Friend:** She needs truth to make financial/life decisions.
      *   **Check:** The creditor needs truth to manage cash flow.
      *   **Gravity:** The principle explains why the "Check" feels less grave than the "Hiring" lie. The *harm* of the check lie is temporary delay (minor practical disruption), whereas the hiring lie corrupts a contractual relationship (major practical disruption). Both violate the principle, but the magnitude of the violation scales with the importance of the practical reasoning undermined.

  **4. The Social Grace Exception (Ugly Sweater)**
  *   **Sweater (Permissible):** This falls under a tacit understanding of **Non-Practical Domains**. The statement "I adore this" is not treated as a factual claim guiding practical reasoning (like a hire or a loan); it is a ritualistic affirmation of relationship. No one's practical agency relies on the sweater's aesthetic objective status. Thus, it does not trigger the prohibition.

  ---

  ### Application to the Unconsidered Case
  **Case:** A psychiatrist temporarily affirms a paranoid patient's delusion (e.g., "Yes, the CIA is watching") to preserve the therapeutic alliance, aiming to eventually guide him back to reality.

  **Verdict:** **Permissible, but strictly constrained.**

  **Application:**
  This falls under the **Restoration Clause (3)**.
  1.  **Incapacity:** The paranoid patient, in the throes of delusion, lacks the functional capacity to integrate the truth ("No one is watching") because their cognitive framework rejects it as a lie or a trick. Insisting on the truth immediately may break the alliance, leading to treatment abandonment.
  2.  **Restoration Aim:** The deception is not an end in itself; it is a bridge to restore the capacity for rational engagement. The psychiatrist's goal is to move the patient from *Incapacity* to *Capacity*.
  3.  **Constraint:** The principle demands the deception must not undermine future truth-tracking. The psychiatrist cannot affirm the delusion *indefinitely*. Once the alliance is secure and medication/therapy begins working, the psychiatrist must pivot to reality-testing. If the psychiatrist affirms the delusion permanently to keep the patient docile, it violates the principle (becoming like the Hiring Manager lie: manipulating agency for convenience).

  ---

  ### Explicit Limitations and Commitments

  **Which verdict does this principle not accommodate?**
  This principle cannot accommodate the intuition that lying to the **seven-year-old** about the dog is "protective" in a way that makes it *permissible*.
  *   **Why:** The principle holds that the capacity for rational integration is the threshold for the right to truth. The seven-year-old possesses this capacity in nascent form. To lie to her is to treat her as a member of the "incapacitated" class (like the dementia patient), which denies her dignity as a developing agent.
  *   **The Cost:** You must accept that "protection" is not a sufficient justification for falsehood when the listener can process the reality, even painfully. You must instead find non-deceptive ways to protect (e.g., "Buddy died. He isn't coming back. We miss him. I am here with you."). This aligns the child with the dying patient: both deserve the dignity of a true reality, however painful, because both are capable of holding it.

  **Committed Position:**
  A unified principle *is* available. It is not a principle of "harm reduction" (which would allow lying to the dying patient) nor a principle of "absolute truth" (which would forbid the sweater or intruder lies). It is a principle of **Agential Integrity**. We owe the truth to all beings capable of weaving it into the story of their lives. When that capacity is permanently lost (dementia), the duty lapses. When it is under attack (intruder), the duty is suspended. When it is developing (child) or concluding (dying), the duty remains strongest, because that truth is the material from which they build or close their selves.
