preserve the therapeutic alliance with the aim of eventually guiding him back to reality), and be explicit about which of my verdicts your principle cannot accommodate and why. Give a committed answer: take a definite position on whether a unified principle is available, do not merely lay out options for me to choose between, and give your reasons directly.
