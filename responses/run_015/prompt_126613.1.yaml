answer: |-
  **Project Title:** Disaggregating Idealization: Epistemic, Motivational, and Procedural Dimensions in Indirect Normativity

  **Research Question**
  Does disaggregating epistemic idealization from motivational and procedural idealization insulate indirect normative theories from the alienation objection?

  **Project Summary and Background**
  Indirect normative theories determine the deontic status of an action not by its intrinsic properties, but by its relation to a decision procedure or set of rules endorsed by an idealized agent. Standard formulations typically treat idealization as a monolithic epistemic condition: the agent possesses complete information, logical consistency, and freedom from cognitive bias. My project hypothesizes that this standard framing conflates three distinct dimensions of idealization: (1) *Epistemic* (knowledge and reasoning capacity), (2) *Motivational* (concern for correct ends or values), and (3) *Procedural* (methods of aggregation or justification).

  The central problem addressing this project is the "alienation objection." This objection holds that indirect theories require agents to act on reasons they cannot recognize from their first-personal perspective, creating a divisive split between the agent and the moral requirement. Current literature suggests this objection is fatal to indirect normativity. I propose that the objection only succeeds when all three dimensions of idealization are bundled. If epistemic idealization is isolated—where the agent knows the facts but lacks specific motivational or procedural enhancements—the gap between the idealized endorsement and the actual agent's perspective may close sufficiently to block the objection without collapsing the theory into direct normativity.

  **The Unresolved Ambiguity in Current Debates**
  Existing debates between rule-consequentialists and contractualists leave this ambiguity unresolved because both traditions implicitly rely on a "thick" conception of the ideal observer that bundles these dimensions.

  In rule-consequentialism, the ideal agent selects rules based on optimific outcomes. However, the literature often assumes that an agent with full information (epistemic) will necessarily prioritize the general good (motivational) and utilize a maximizing calculus (procedural). When critics argue that actual agents feel alienated from optimific rules, they are attacking a package deal. It remains unclear whether the alienation stems from the epistemic gap (not knowing the outcomes) or the motivational gap (not caring about the aggregate good).

  Similarly, contractualist frameworks rely on reasonable agreement among idealized agents. These agents are typically characterized as fully informed (epistemic), but also as mutually motivated to find justifiable terms (motivational) and constrained by specific vetoeing procedures (procedural). When an actual agent feels alienated from a contractualist requirement, it is ambiguous whether this is because they lack the information the ideal agent had, or because they lack the specific moral motivation attributed to the ideal agent. By failing to distinguish whether the idealization is about *knowing* the moral truth, *wanting* the moral truth, or *calculating* the moral truth, current debates cannot determine if a "thinner" idealization would suffice to ground normative authority without inducing alienation.

  **Proposed Method**
  The research will proceed over six months in three distinct phases, operating at roughly twenty hours per week.

  *Phase 1: Conceptual Mapping (Months 1–2)*
  The first phase will establish rigorous definitions for the three dimensions of idealization. I will construct a conceptual matrix that allows these dimensions to vary independently. For example, I will model an agent who possesses complete information (high epistemic idealization) but retains actual human motivational structures (low motivational idealization). The output will be a taxonomy of indirect theories based on which dimensions they prioritize. This phase ensures that subsequent analysis does not inadvertently reintroduce the conflation I aim to critique.

  *Phase 2: Case Studies (Months 3–4)*
  I will apply this taxonomy to two canonical frameworks: rule-consequentialism and contractualism. These will not be treated as competing doctrines to be defended, but as structural case studies. I will reconstruct each framework in three variants: one bundling all idealizations (standard), one isolating epistemic idealization, and one isolating procedural idealization. This involves analyzing the decision procedures inherent to each theory to determine where the idealization loads most heavily. The goal is to produce "disaggregated versions" of these theories that retain their indirect structure but alter the profile of the idealizing agent.

  *Phase 3: Evaluation of the Alienation Objection (Months 5–6)*
  In the final phase, I will subject each variant to the alienation objection. I will analyze whether the first-personal gap persists when motivational and procedural idealizations are stripped away, leaving only epistemic enhancement. I will assess whether the resulting view remains distinctively indirect (i.e., the right action is still determined by the ideal agent's choice, not the actual agent's direct intuition) or if it collapses into a form of direct normativity where the idealization becomes redundant.

  **Criteria for Success and Failure**
  *Success:* The project succeeds if I can demonstrate that at least one disaggregated variant (specifically the epistemic-only model) blocks the alienation objection while maintaining a non-trivial distinction between the criterion of rightness and the decision procedure. Specifically, success requires showing that an actual agent can recognize the authority of the idealized endorsement without sharing the idealized agent's motivational profile.

  *Failure:* The project fails if I demonstrate that the three dimensions are conceptually inseparable in any normatively interesting form. For example, if possessing "complete information" in a moral context logically entails possessing "correct motivation," then the proposed separation is impossible. Alternatively, failure occurs if the disaggregated models block the alienation objection only by collapsing into direct normativity (where the ideal agent's choice merely mirrors what the actual agent should directly perceive), rendering the indirect structure redundant.

  **Scope Assessment and Risk Management**
  The six-month timeline is tight for a project involving conceptual reconstruction and objection testing. The primary risk lies in Phase 1: defining "motivational idealization" without slipping into substantive moral claims. There is a danger of spending excessive time debating the metaphysics of motivation rather than its role in idealization.

  A secondary risk is scope creep in Phase 2. Analyzing both rule-consequentialism and contractualism deeply may exceed the available hours.

  *Truncation Strategy:* If Phase 1 extends beyond eight weeks, I will truncate Phase 2 by focusing exclusively on rule-consequentialism. This framework offers a clearer distinction between epistemic and procedural elements than contractualism, providing a sufficient test case for the hypothesis. If Phase 3 reveals that the epistemic-only model collapses into direct normativity, I will shift focus to documenting *why* this collapse occurs as a negative result, rather than attempting to salvage the model. This ensures the project yields a determinate conclusion regarding the separability of the dimensions, even if the primary hypothesis is falsified.

  This project offers a structural clarification of indirect normativity that does not require new empirical data or formal modeling, making it feasible within the stipend's constraints while promising significant clarification for ongoing debates in normative ethics.
