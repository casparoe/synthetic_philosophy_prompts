          *   Address the contradiction: Rigid classification *vs.* Plasticity. This *is* unsatisfiable if treated ontologically. It must be treated functionally/operationally.
      *   **Conclusion:** Summarise the verdict.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I use British English? (e.g., "behaviour", "modelling", "programme").
      *   *Check:* Did I address the "jointly unsatisfiable" instruction? Yes, I need to be explicit that rigid taxonomy + fluid plasticity is a contradiction unless redefined.
      *   *Check:* Did I push back on the premise? Yes, the "nested layers" vs. "distinct types" issue is the biggest philosophical hurdle.
      *   *Tone:* Academic, rigorous, direct, but helpful for a novelist.

  6.  **Final Polish:**
