      *   Ensure the "Gregorian" aspect (tools of thought) is distinguished from mere social learning.
      *   Make sure the "switching" mechanism is plausible (e.g., stress regressing to Skinnerian, training ascending to Gregorian).

  7.  **Final Review against constraints:**
