  *(Refining the Hybridisation point)*: The user wants to know how a Gregorian can enter a Skinnerian mode. This is actually quite common (panic/regression). How does a system switch between Popperian and Darwinian? That's harder. Darwinian is slow. Maybe they mean "hard-coded reflex" vs "planning". I need to clarify that "Darwinian" in a single lifetime usually means "hard-wired instinct".

