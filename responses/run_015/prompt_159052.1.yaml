answer: |-
  # Joint Statement of Adversarial Collaboration: Epiphenomenalism and Phenomenal Judgment

  ### I. Agreed Claims

  1.  **Definition of Epiphenomenalism:** Side A asserts that phenomenal properties exist but exert no causal influence on physical states, including speech behavior and cognitive judgments. Side B accepts this definition as the target of their critique.
  2.  **The Paradox:** Both sides agree the core problem is explaining how a subject can refer to, know, or report on a phenomenal property if that property plays no causal role in producing the report.
  3.  **Solution vs. Dissolution:** A "solution" must explain the mechanism of reference without causal contact. A "dissolution" denies the coherence of the demand for causal contact. Both sides agree that merely restating the correlation is insufficient; the *link* must be accounted for.
  4.  **Verbal vs. Substantive Dispute:** Both sides agree that terminology ("caused by" vs. "in virtue of" vs. "tracks") obscures a real metaphysical dispute. The substantive issue is whether non-causal relations can sustain knowledge and reference.
  5.  **The Artifact Case:** Both sides agree that a machine monitoring its own states without feedback is structurally isomorphic to the biological case. It is not a genuine extra test, but the same argument in a costume.
  6.  **Varieties of Side A:** Both sides agree that "Constitution" views (judgment partly constituted by experience) differ metaphysically from "Common Cause" views (physical state causes both experience and judgment). This choice changes downstream predictions regarding memory and latency.
  7.  **Tripartite Report Structure:** Both sides accept the distinction between (i) what causes the report token, (ii) what makes it about the experience, and (iii) what makes it authoritative. They disagree on which of these epiphenomenalism threatens.

  ### II. Disagreements Table

  | Neutral Crux | Side A (Epiphenomenalist) Formulation | Side B (Paradox Critic) Formulation | Accepted Case / Argument | Side A Prediction | Side B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Tripartite Report** | Epiphenomenalism threatens only (i) Cause. (ii) Aboutness is secured by non-causal acquaintance; (iii) Authority by reliable common cause. | Epiphenomenalism threatens (ii) Aboutness and (iii) Authority. Without causation, "aboutness" is magic and authority is luck. | **Immediate Report:** Subject says "Red" instantly upon seeing red. | Report is caused by physical state; reference secured by direct presence of qualia. | Report is caused by physical state; reference fails because qualia are causally isolated. |
  | **2. Non-Causal Reference** | Reference is a primitive relation. Experience need not push the judgment; it need only be present to be grabbed. | Reference requires causal contact. If the experience does not touch the judgment, the judgment is not about the experience. | **Concept Acquisition:** Learning the word "pain" while feeling pain. | Subject associates word with physical correlate; qualia are simultaneously present to ground meaning. | Subject associates word with physical correlate; qualia remain unlinked, making meaning incomplete. |
  | **3. The Latency Ladder** | Memory traces are physical. The original experience need not cause the trace, only correlate with the physical encoding event. | Memory preserves information via causal chains. If the experience doesn't cause the encoding, the trace contains no info about the experience. | **Deferred Vocabulary:** Experience at age 5, word learned at age 30 based on memory. | Physical memory trace survives; adult judgment refers to trace, which refers back to qualia via acquaintance. | Physical memory trace survives; adult judgment refers only to physical trace, losing the phenomenal content. |
  | **4. Cross-Wired Reliability** | Reliability is maintained by the common cause (physical state). Inverted wiring breaks the correlation, making reports false, not impossible. | Inverted wiring shows the report tracks physical states, not qualia. If qualia invert but reports don't, reports never tracked qualia. | **Inverted Spectrum:** Subject says "Red" when experiencing Green (due to wiring swap). | Subject is mistaken. The report mechanism is broken relative to the experience. | Subject is consistent. The report mechanism reveals it was never tracking the experience. |
  | **5. Falsification Conditions** | **Evidence Against:** Discovery of a phenomenal judgment with no corresponding physical state correlate (violates physical closure). | **Evidence Against:** A coherent model of non-causal knowledge that explains error conditions without causation. | **Decisive Case:** Breakdown of psychophysical correlation without physical explanation. | Physical explanation will always be found; correlation is nomologically necessary. | Correlation breakdown proves causation was necessary; epiphenomenalism fails. |

  \answer{Whether non-causal acquaintance can ground phenomenal knowledge.}
