answer: |-
  This is a sophisticated request that requires balancing formal game mechanics with philosophical nuance. The goal is to create an *aporia* (a puzzle with no easy exit) that mirrors the structural constraints of Harsanyi's Aggregation Theorem.

  Below is a complete lesson plan, including materials, timeline, and a specific strategy for the "Round 2 Twist" to ensure it lands as a conceptual revelation rather than a logistical confusion.

  # Seminar Plan: The Aggregation Trap
  **Topic:** Harsanyi's Aggregation Theorem & Interpersonal Comparison
  **Time:** 90 Minutes (of a 2-hour block)
  **Class Size:** 13 Students (4 Groups of 3, 1 Group of 1 or attach to a group)

  ## 1. Learning Objectives
  By the end of the session, students will be able to:
  1.  Demonstrate why satisfying **Pareto** and **vNM Independence** at the social level forces a linear aggregation of individual utilities.
  2.  Experience the instability of social rankings when interpersonal utility comparisons are removed (affine transformations).
  3.  Distinguish between the *mathematical necessity* of Harsanyi's result and the *normative contestability* of its premises.

  ## 2. Materials Needed
  *   **Persona Cards (3 Types):** A, B, C. (See *Appendix A*).
  *   **Policy Cards:** 4 Policies (X, Y, Z, W) with defined outcomes for each Persona.
  *   **Lottery Slips:** Pre-written mixes (e.g., "50% Policy X, 50% Policy Z").
  *   **Constraint Cards:** One per group, listing the "Rules of Rationality."
  *   **Currency:** Poker chips (for participation stakes).
  *   **Whiteboard:** For tracking group rankings.

  ---

  ## 3. Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Intro & Setup** | Divide into 4 groups. Distribute Persona Cards. Explain the "Social Planner" role. |
  | **10-25** | **Round 1: The Comparable World** | Groups rank 4 Lotteries. Utilities are presented as "Well-Being Units" (WBUs). |
  | **25-35** | **Round 1 Debrief** | Compare rankings. Most will converge on Summation. Highlight outliers (Maximin/Prioritarian). |
  | **35-40** | **The Twist Announcement** | Reveal the "Measurement Error." Distribute Round 2 Cards. |
  | **40-55** | **Round 2: The Arbitrary Scale** | Groups re-rank using their Round 1 *rule*. Rankings shatter. |
  | **55-75** | **Formal Debrief** | Map game mechanics to Harsanyi's premises. Discuss the "Weights" problem. |
  | **75-90** | **Philosophical Implications** | Rawls vs. Harsanyi. What must we give up to save Justice? |

  ---

  ## 4. Game Mechanics & Instructions

  ### The Setup (00-10)
  Tell the students: *"You are the Constitutional Convention. There are three citizens (Personas A, B, C). You must choose a Social Welfare Function to rank Policies. You do not know which Persona you will be."*

  **The Constraints (Write on Board):**
  1.  **Pareto:** If every Persona prefers Policy 1 to Policy 2, Society must prefer 1 to 2.
  2.  **Independence:** If Society prefers Policy 1 to Policy 2, then a 50/50 Lottery of (1 + 3) must be preferred to (2 + 3). *Your rule cannot flip based on irrelevant alternatives.*
  3.  **Continuity:** No lexical/lexicographic rankings (no "Infinity" values).

  ### Round 1: The Comparable World (10-25)
  Distribute **Persona Cards (Set 1)**.
  *   **Key Feature:** The "0" point and the "Unit" size are identical across all three personas. They are implicitly comparable (e.g., "0 = Death, 100 = Bliss").
  *   **Task:** Rank the following 4 Lotteries from Best to Worst.
      *   **L1:** 100% Policy **Equal** (A:50, B:50, C:50)
      *   **L2:** 100% Policy **Unequal** (A:90, B:40, C:20)
      *   **L3:** 50% Policy **Equal**, 50% Policy **Disaster** (A:0, B:0, C:0)
      *   **L4:** 50% Policy **Unequal**, 50% Policy **Disaster**

  *   **The Math Trap:**
      *   Sum of Equal = 150. Sum of Unequal = 150. (Indifferent).
      *   Therefore, L3 and L4 should be indifferent (0.5 * 150).
      *   *If they use Maximin:* They prefer Equal (Min 50) > Unequal (Min 20).
      *   *If they use Prioritarian (e.g., Sqrt):* They prefer Equal.
      *   *Check Independence:* Ask them to compare L3 vs L4. If they preferred Equal in L1/L2, they *must* prefer L3 over L4.
      *   *Most groups will naturally Sum.* Give them 5 chips if they produce a consistent ranking.

  ### Round 2: The Arbitrary Scale (35-55)
  **The Twist:** Collect the Round 1 cards. Hand out **Persona Cards (Set 2)**.
  *   **Script:** *"We discovered a calibration error. Persona A measures in 'Celsius,' Persona B in 'Fahrenheit,' Persona C in 'Arbitrary Hedons.' Their zeros and unit sizes are not comparable. However, their internal preferences (orderings) haven't changed."*
  *   **The Data Change:** Apply positive affine transformations ($U' = aU + b$) to each persona *differently*.
      *   **Persona A:** Same as Round 1 ($U$).
      *   **Persona B:** Shifted Zero ($U + 50$).
      *   **Persona C:** Stretched Scale ($2U$).
  *   **Task:** *"Use the **exact same rule** you used in Round 1 (e.g., 'Sum the numbers') to rank the Lotteries again."*
  *   **The Result:**
      *   Round 1 Sum (Equal): $50+50+50 = 150$.
      *   Round 1 Sum (Unequal): $90+40+20 = 150$.
      *   Round 2 Sum (Equal): $50 + (50+50) + (50\times2) = 200$.
      *   Round 2 Sum (Unequal): $90 + (40+50) + (20\times2) = 220$.
      *   **Shock:** In Round 1, they were indifferent. In Round 2, "Unequal" is now strictly better, purely due to labeling.
      *   **Maximin/Prioritarian users:** Their rankings will also shift wildly because the "worst off" identity might change based on the zero-point shift.

  ### Debrief Strategy (55-90)
  1.  **Ask:** "Who changed their ranking between Round 1 and 2 without changing their moral rule?" (Everyone should have).
  2.  **Map to Theorem:**
      *   Constraint 2 (Independence) $\rightarrow$ Forces Linearity (Weighted Sum).
      *   Round 1 Assumption (Comparability) $\rightarrow$ Allows Weights to be Equal ($1, 1, 1$).
      *   Round 2 Reality (Non-Comparability) $\rightarrow$ Weights are arbitrary.
  3.  **The Harsanyi Conclusion:** To be a Utilitarian, you need *both* vNM rationality *and* Interpersonal Comparability. If you deny Comparability (like Rawls), you cannot be a Utilitarian. If you keep Comparability, you must accept the Weighted Sum.

  ---

  ## 5. Appendix A: The Cards (Printable Content)

  ### Persona Cards (Set 1: Round 1)
  *Print 4 sets of these. Tell students: "These numbers represent comparable Well-Being Units."*

  | Outcome | Persona A (Risk Neutral) | Persona B (Risk Neutral) | Persona C (Risk Neutral) |
  | :--- | :---: | :---: | :---: |
  | **Policy Equal** | 50 | 50 | 50 |
  | **Policy Unequal** | 90 | 40 | 20 |
  | **Policy Disaster** | 0 | 0 | 0 |

  ### Persona Cards (Set 2: Round 2)
  *Print 4 sets. Tell students: "Recalibrated Data. Scales are now arbitrary and non-comparable."*

  | Outcome | Persona A (Unchanged) | Persona B (Zero Shift +50) | Persona C (Scale x2) |
  | :--- | :---: | :---: | :---: |
  | **Policy Equal** | 50 | 100 | 100 |
  | **Policy Unequal** | 90 | 90 | 40 |
  | **Policy Disaster** | 0 | 50 | 0 |

  *(Note for Instructor: In Set 2, Persona B's "Disaster" is 50, not 0. This breaks Maximin instantly, as B is never the worst off in Disaster anymore.)*

  ### Lottery Slips
  *   **L1:** 100% Policy Equal
  *   **L2:** 100% Policy Unequal
  *   **L3:** 50% Policy Equal / 50% Policy Disaster
  *   **L4:** 50% Policy Unequal / 50% Policy Disaster

  ---

  ## 6. Anticipated Failure Modes & Mitigation

  | Failure Mode | Prediction | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **Voting** | A group simply votes on which policy they *like* rather than deriving a rule. | Circulate and ask: "If I offered you a lottery between your top choice and Disaster, would your rule hold?" Force them to write down the *formula*, not just the ranking. |
  | **Rejecting Independence** | A student says, "But L4 has a chance of Disaster, I don't care about the math." | Validate this! Write on board: "Group X rejected vNM Independence." This is a valid philosophical move (Sen's critique), but note they have exited the Harsanyi framework. |
  | **Averaging Money** | Students treat utils as dollars and assume risk neutrality. | The tables *give* them the utils. If they try to recalculate based on "fairness," remind them: "You must use the numbers on the card as the measure of welfare." |
  | **Round 2 Confusion** | Students think they are allowed to change their rule in Round 2. | Be strict: "You are testing the *robustness* of your Round 1 rule. Do not change the rule. Apply the same formula to the new numbers." |

  ---

  ## 7. Debrief Notes: Math vs. Interpretation

  **What is Settled Math:**
  1.  **Harsanyi's Theorem (1955):** It is mathematically true that if Individual Preferences and Social Preferences both satisfy vNM axioms, and Pareto holds, the Social Welfare Function is a linear combination of individual utilities ($W = \sum a_i U_i$).
  2.  **The Measurement Problem:** It is mathematically true that if $U_i$ are unique only up to positive affine transformation (vNM utility), the sum $\sum U_i$ is not invariant to those transformations unless the scales are calibrated (interpersonally comparable).

  **What is Contested Interpretation:**
  1.  **The Normative Force of Independence:** Many philosophers (e.g., Amartya Sen, John Weymark) argue that Social Welfare *should not* satisfy the Independence Axiom. They argue that distribution matters in a way that independence forbids. *Tell students: "You are allowed to reject Independence, but you must accept you are no longer a Harsanyi-Utilitarian."*
  2.  **The Reality of Comparability:** Harsanyi assumes we *can* compare utilities. Rawls argues we cannot/should not. The game shows the *consequence* of assuming comparability, not that comparability is real.
  3.  **The Weights ($a_i$):** Harsanyi's theorem gets you to a *weighted* sum. It does not prove the weights must be equal ($1, 1, 1$). Equal weights require an additional ethical premise (Impartiality/Anonymity). The game usually pushes them to equal weights, but technically they could assign Person A more weight.

  **Closing Thought for Students:**
  *"Harsanyi shows you that you can have Rationality (vNM) and Benevolence (Pareto), but only if you accept Aggregation (Utilitarianism) and Comparability. If you want to protect the Worst-Off (Rawls), you must sacrifice either Rationality (Independence) or Comparability. Which one do you drop?"*

  ---

  ## 8. Instructor Guide for the "Round 2 Twist"
  *This is the critical moment. If handled poorly, students think it's a trick. If handled well, it's an epiphany.*

  1.  **Do not apologize.** Present the Round 2 cards as "New Data from the Bureau of Statistics."
  2.  **Emphasize the Invariance.** Ask: "Did anyone's *preferences* change? Does Persona B still prefer Equal to Disaster?" (Yes: 100 > 50). "So why did the Social Ranking change?"
  3.  **The Takeaway:** "Because your rule (Summation) relied on the *size* of the numbers, not just the *order*. But vNM utility only guarantees the order and risk attitude, not the size. Your rule required more information than the utility functions provided."
  4.  **Connect to Theory:** "This is why Rawls rejects Utilitarianism. He says interpersonal comparison is meaningless. Harsanyi says it's necessary. You just felt the cost of Harsanyi's necessity."
