prompt: |-
  I teach a 13-person third-year seminar on distributive justice, two-hour session. We've done Rawls and a couple of weeks of expected utility theory, so they're fine reading a vNM utility table and comparing lotteries. I want a classroom game that makes them feel the bite of Harsanyi's aggregation theorem without naming it, or utilitarianism, up front: I want them to run into the fact that once you require (a) the social ranking to respect unanimity and (b) the social ranking itself to behave like an individual's ranking under uncertainty (transitive, and satisfying independence), you get pushed into ranking prospects by a weighted sum of individual utilities — and that most of the alternatives they find intuitive up front (prioritarian weighting, anything leximin-ish, plain "help the worst off") quietly stop being available.

  What I need: persona cards with stated utility tables, a deck of lottery cards over who ends up in which outcome, a rule that forces groups of 3-4 to produce one group ranking, small stakes (chips counting toward participation, no money), and a timeline for about 90 minutes. The part I most want help with: I'd like a second round in which I secretly change one thing — same numbers, but I announce that each persona's scale is in it's own arbitrary units, so levels can't be compared across people — and they discover that the ranking they were proud of in round one now depends on a labeling choice nobody made on purpose. I don't know how to stage that so it lands rather than just confusing them.

  Then a debrief mapping moments in the game onto the premises of the result, what will predictably go wrong the first time I run it (I expect one group to just vote; I expect someone to flatly refuse the independence requirement; I expect someone to try to average money instead of utility), and an honest note on what the game cannot stage — I assume it can't give them the proof, and it can't give them the equal-weights step that gets you from "some weighted sum" to averaging. Please also be clear about which claims you're building the session on are settled math and which are contested interpretation; I really don't want to teach a contested reading as if it were textbook.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 13-person third-year seminar on distributive justice (2 hours).
      *   **Background:** Students know Rawls and Expected Utility Theory (vNM utility, lotteries).
      *   **Goal:** A classroom game/experience that leads students to discover Harsanyi's Aggregation Theorem (social welfare function = weighted sum of individual utilities) *without* naming it upfront.
      *   **Key Constraints:**
          *   Must enforce (a) Pareto/Unanimity and (b) vNM rationality (Independence) for the social ranking.
          *   Must show that intuitive alternatives (Prioritarianism, Leximin, "Help the Worst Off") fail under these constraints.
          *   **Crucial Feature:** A "Round 2" twist where interpersonal utility comparison is removed (ordinal/non-comparable scales), revealing the fragility of their Round 1 rankings.
          *   **Logistics:** Persona cards with utility tables, lottery cards, groups of 3-4, small stakes (chips), 90-minute timeline.
          *   **Debrief:** Map game moments to theorem premises, anticipate failure modes (voting, rejecting independence, averaging money), clarify math vs. interpretation.

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *Premise 1:* Individuals have vNM utility functions (representing preferences under risk).
      *   *Premise 2:* Social preferences satisfy vNM axioms (including Independence).
      *   *Premise 3:* Social preferences satisfy Weak Pareto (if everyone prefers A to B, society prefers A to B).
      *   *Conclusion:* Social welfare function is a linear combination of individual utilities ($W = \sum a_i U_i$).
      *   *The "Bite":* If you want linearity (Independence) and Pareto, you *must* accept weighted utilitarianism. You cannot have Leximin or Prioritarianism (which are non-linear in utility).
      *   *The "Twist" (Interpersonal Comparison):* Harsanyi assumes cardinal unit comparability (or at least that the weights can be fixed). If utilities are just vNM scales (unique up to positive affine transformation) and not comparable across persons, the weights $a_i$ are arbitrary. This leads to the "labeling choice" problem the user wants to highlight.

  3.  **Designing the Game Mechanics:**
      *   *Personas:* Need 3 distinct utility functions. Let's call them A, B, C.
      *   *Outcomes:* Need distinct states of the world (e.g., Allocation X, Y, Z).
      *   *Lotteries:* Need probabilistic mixes of outcomes.
      *   *Task:* Groups must rank Lotteries.
      *   *Round 1 (Cardinal & Comparable):* Give them specific numbers. Tell them these numbers represent "well-being points" that are comparable.
          *   *Trap:* If they try to help the worst off (Maximin), they will violate Independence.
          *   *Trap:* If they try to be Prioritarian (concave transformation), they will violate Independence.
          *   *Success:* Only linear aggregation satisfies the constraints.
      *   *Round 2 (Ordinal/Non-comparable):* Keep the *preferences* (rankings of outcomes) the same, but change the *numbers* (affine transformations) for each person independently.
          *   *Revelation:* A linear sum that worked in Round 1 now yields different rankings because the "zero" and "unit" size changed arbitrarily for each person.

  4.  **Drafting the Materials:**
      *   *Personas:*
          *   Person 1 (High variance): Loves Risk.
          *   Person 2 (Risk averse): Hates Risk.
          *   Person 3 (Neutral): Linear.
          *   *Actually, for Harsanyi, the individuals just need vNM utilities over *outcomes*. The "risk" is in the social lottery (veil of ignorance style).*
          *   *Correction:* Harsanyi's theorem is about aggregating *fixed* individual utility functions into a *social* utility function. The "lotteries" in the game should be social prospects (e.g., Policy A gives Person 1 outcome X, Person 2 outcome Y...).
          *   *Wait, simpler approach for a seminar:* Use the "Veil of Ignorance" interpretation often associated with Harsanyi. The students act as the "Social Planner." The Personas are the citizens. The Lotteries are policies that assign outcomes to citizens with certain probabilities (or assign citizens to outcomes).
          *   *Better approach for the specific constraint:* The prompt asks for "lottery cards over who ends up in which outcome." This suggests a Veil of Ignorance setup.
          *   *Setup:* 3 Outcomes (Good, Medium, Bad). 3 People.
          *   *Lottery:* A policy is a probability distribution over who gets what.
          *   *Actually, Harsanyi's Aggregation Theorem is distinct from his Veil of Ignorance argument.* Aggregation takes *given* utility functions $U_1, ... U_n$ and finds $W$. The Veil of Ignorance argument *derives* Utilitarianism from rational choice behind the veil.
          *   *User's specific request:* "ranking prospects by a weighted sum of individual utilities." This is Aggregation.
          *   *Game Structure:*
              *   Citizens (Personas) have fixed utilities over 3 basic Outcomes (O1, O2, O3).
              *   Social Choices are Lotteries over these Outcomes *for the group*? No, that's just one person.
              *   Social Choices must be distributions of Outcomes to People.
