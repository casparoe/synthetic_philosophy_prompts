      *   The "Social Lotteries" will be probability distributions over these Outcomes *for the whole group*? No, that ignores distribution.
      *   *Crucial Decision:* Harsanyi's Aggregation Theorem aggregates *individual utility functions* into a *social welfare function*. The inputs are $U_1(x), U_2(x)...$ where $x$ is a social state.
      *   To make this playable: A "Social State" is a distribution of goods.
