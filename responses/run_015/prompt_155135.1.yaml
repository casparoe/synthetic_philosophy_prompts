      *   Or, hand them new Persona Cards that say "Re-calibrated Data."
      *   *Key:* The *order* of outcomes for each individual must remain the same (preserving vNM preferences), but the *intervals* and *zeros* must shift differently for each person.
      *   *Example:*
          *   R1: P1 (0, 5, 10), P2 (0, 5, 10), P3 (0, 5, 10). Sum = Utilitarian.
          *   R2: P1 (0, 5, 10), P2 (10, 15, 20) [Shifted zero], P3 (0, 20, 100) [Stretched scale].
          *   If their rule was "Sum the numbers," the ranking of policies changes drastically.

  6.  **Anticipating Failure Modes:**
      *   *Voting:* They might just vote on which lottery is best. *Counter:* Remind them they are designing a *rule*, not choosing once. Or force them to justify via the Constraints.
      *   *Rejecting Independence:* A student might say "But in Lottery A, the worst case is terrible!" *Response:* That's the point. Write it on the board. "This group rejected Independence."
      *   *Averaging Money:* If the utilities are presented as dollars. *Fix:* Call them "Utils" or "Hedons" to discourage risk-neutrality assumptions unless encoded in the table.

  7.  **Math vs. Interpretation:**
      *   *Math:* Harsanyi's theorem (1955) is a formal result. If axioms hold, conclusion follows.
      *   *Interpretation:* Whether social welfare *ought* to satisfy vNM Independence is contested (Sen, Weymark). Whether interpersonal comparison is possible is contested.
      *   *Must clarify:* The game shows the *cost* of the axioms, not that Utilitarianism is morally true.

  8.  **Timeline Construction (90 Minutes):**
      *   0-10: Intro & Groups.
      *   10-25: Round 1 (The Trap).
      *   25-35: Round 1 Reporting & Confusion.
      *   35-50: Round 2 (The Twist).
      *   50-65: Round 2 Reporting & Frustration.
      *   65-90: Debrief & Lecture (Harsanyi).

