      *   *Better:* In Round 1, don't tell them to sum. Tell them to satisfy Pareto + Independence. Let them propose rules (Maximin, Util, Prioritarian). Test the rules against specific lottery pairs that distinguish them.
      *   *Actually, to save time:* Give them 3 specific Lotteries to rank.
      *   Lottery 1: Certain Outcome X.
      *   Lottery 2: 50% Outcome Y, 50% Outcome Z.
      *   Lottery 3: ...
