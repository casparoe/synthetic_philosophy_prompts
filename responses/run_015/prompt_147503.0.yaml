answer: |-
  This is a brilliant observation. You have identified that bureaucracy does not merely *describe* reality; it *enacts* ontology. Administrative rules are applied metaphysics. When an institution writes a policy about identity, they are solving the Ship of Theseus paradox for payroll, liability, or cataloging purposes.

  Here is the breakdown of the hidden ontologies, the compatibility of these systems, and the catastrophic results of universalizing the strictest one.

  ### 1. The Smuggled Ontologies

  Each sector is running on a different theory of persistence, chosen not for philosophical truth, but for institutional utility.

  **A. The Strict Archive (Digital Essentialism)**
  *   **The Rule:** A single bit flip destroys identity.
  *   **The Metaphysics:** **Mereological Essentialism.** This is the view that the parts of an object are essential to its identity. If you change a part, you destroy the whole. It also relies on **Substrate Dependence**: the information cannot be separated from the specific physical arrangement of electrons/magnetic domains that constitute it.
  *   **The Goal:** *Evidentiary Integrity.* In law and archives, the value is often in the fact that *this specific string of bits* existed at *this specific time*. Any change implies tampering.
  *   **Note on the 30%:** You mentioned a 30% repair threshold. In standard cryptographic fixity (SHA-256), the threshold is 0%. One bit changes the hash entirely. If an archive allows 30% variation, they are no longer treating the file as a *record*; they are treating it as a *signal*. They have shifted from **Digital Essentialism** to **Informational Platonism** (the "message" matters, not the "medium"). That 30% is likely not metaphysical; it's the limit of their Error Correction Code (ECC) before the data becomes semantically unintelligible.

  **B. Corporate Law (Functional Perdurantism)**
  *   **The Rule:** The company survives total turnover of humans and assets.
  *   **The Metaphysics:** **Four-Dimensionalism (Perdurantism)** mixed with **Functionalism**. The corporation is not a 3D object made of people; it is a "space-time worm" defined by a continuous legal narrative and a specific functional role in the economy. It is an abstract entity that *has* parts (employees, assets) but *is not identical* to them.
  *   **The Goal:** *Liability and Continuity.* If identity depended on material composition, contracts would void every time an employee quit. Capital requires immortality.

  **C. Museums (Causal History vs. Material Authenticity)**
  *   **The Rule:** Theseus's Ship (replaced planks) is real; a reconstructed painting is a fake.
  *   **The Metaphysics:** This is the most conflicted.
      *   *The Ship:* **Spatiotemporal Continuity.** As long as the change is gradual and the form/function persists in the same location, identity holds.
      *   *The Painting:* **Causal Essentialism.** The value is in the *history of production*. A perfect forgery fails because it lacks the correct causal chain back to the artist's hand (the "aura," per Walter Benjamin).
  *   **The Goal:** *Authenticity.* Museums sell the experience of proximity to history. A replaced plank preserves the "ship-ness"; a repainted canvas destroys the "artist-ness."

  ### 2. Are They Compatible?

  **No.** If you try to unify them under a single metaphysical framework, the systems break.

  *   If you apply **Corporate Law** to **Archives**: You could "repair" a legal contract by changing 30% of the words as long as the "intent" remains. Fraud becomes impossible to prosecute.
  *   If you apply **Strict Archives** to **Corporate Law**: Every time an employee leaves, the company dies. A new legal entity must be formed. Mergers become impossible; bankruptcy becomes instantaneous.
  *   If you apply **Museums** to **Humans**: You are not the same person you were seven years ago (due to cell regeneration). Your marriage vows void automatically.

  **The Reconciliation: Interest-Relative Identity**
  The only theory that makes them hang together is **Pragmatic Ontology** (or Interest-Relative Identity). This view suggests that "identity" is not a property of the object itself, but a relationship between the object, its history, and the *purpose of the observer*.
  *   To the *Auditor*, the company is the same (liability).
  *   To the *Archivist*, the file is different (evidence).
  *   To the *Curator*, the ship is the same (narrative), but the painting is not (provenance).

  They are all "winging it," but they are winging it systematically. They select the metaphysics that minimizes friction for their specific transaction costs.

  ### 3. Universalizing the Strict Archive Rule

  If we universalized the **Mereological Essentialist** rule (any material change = new object) across society:

  1.  **First to Collapse: The Legal System.**
      *   Contracts rely on parties persisting through time. If a company loses one employee, it ceases to exist. Every contract instantly voids. Litigation becomes impossible because the defendant is technically a different entity than the one who committed the tort.
      *   *Time to collapse:* Immediate.

  2.  **Second to Collapse: Biology and Medicine.**
      *   Human cells turnover constantly. Under strict essentialism, you cease to exist roughly every 7 to 10 years. But deeper: metabolic processes change your molecular structure every second.
      *   *Time to collapse:* Instantaneous. You cannot hold a person responsible for a crime committed 5 minutes ago, as they are materially different.

  3.  **Third to Collapse: The Archives Themselves.**
      *   This is the irony. Magnetic decay, cosmic rays, and thermal noise flip bits constantly. If identity requires perfect material stasis, *no digital object can persist for more than a few milliseconds.* The archive would be empty before it could write the first catalog entry.

  ### 4. Is the 30% Threshold Principled?

  **It is almost certainly arbitrary.**

  In information theory, there is a "Shannon Limit," which defines the maximum rate at which information can be transmitted over a noisy channel with zero error. However, in archival policy, a threshold like 30% is usually a **Risk Management Number**, not a metaphysical one.

  *   **Below 30%:** We assume the *semantic content* is preserved (you can still read the document).
  *   **Above 30%:** We assume the *context* is compromised (we can't trust what the document implies about its era).

  It is a bureaucratic compromise between **Purity** (0% change) and **Utility** (we need to be able to read the file). It smuggles in a **Graded Identity** theory, which is metaphysically incoherent (an object is either itself or it isn't), but administratively necessary.

  ### 5. Conclusion: Are We Winging It?

  Yes. But it is a **stable winging-it.**

  We do not have a consistent answer because "identity" is not a natural kind. It is a tool.
  *   **Law** needs identity to be **robust** (survive change).
  *   **Archives** need identity to be **fragile** (detect change).
  *   **Museums** need identity to be **narrative** (survive repair, fail replication).

  If you force them to agree, you don't get truth; you get paralysis. The inconsistency *is* the feature. We maintain different ontologies in different rooms so that capitalism can function in the boardroom while evidence can be preserved in the basement.

  The metaphysics isn't hiding in the rules; the rules are hiding from the metaphysics. If we acknowledged that corporate personhood is a fiction or that digital fixity is physically impossible, the systems would lose their authority. So we pretend the ontology is real, to keep the bureaucracy running.
