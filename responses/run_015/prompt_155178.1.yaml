answer: |-
  Here is the plain assessment you asked for.

  **The Bottom Line:** Your core intuition is solid and theoretically viable, but you are walking into a minefield of existing literature that you need to navigate to avoid reinventing the wheel. You are not "renaming" hermeneutical injustice (HI), but you are describing a specific *mechanism* of it that Fricker under-theorizes. However, your use of Ryle is risky and needs careful framing to avoid technical incoherence.

  Here is the breakdown by your specific questions.

  ### 1. Is "Direction of Conceptual Labor" distinct from Fricker's HI?
  **Verdict:** Yes, but you need to cite Kristie Dotson.

  Fricker's original formulation of Hermeneutical Injustice focuses on the *gap* in collective resources. The primary harm is that the subject cannot understand their own experience (e.g., "I feel wrong but don't know why"). The secondary harm is practical (e.g., "I can't report this harassment").

  Your claim shifts the focus to the **interactional cost**. You are arguing that even if understanding is eventually reached, the *burden of translation* falls disproportionately on the marginalized subject. This is a crucial distinction. Fricker focuses on the *absence* of concepts; you are focusing on the *extraction of labor* required to bridge that absence.

  **The Trap:** You are describing something very close to what Kristie Dotson calls **Contributory Injustice** (in "Tracking Epistemic Violence," 2012). Dotson argues that injustice occurs not just when concepts are missing, but when dominant groups possess the hermeneutical resources but refuse to utilize them or listen to the marginalized group's attempts to expand them.
  *   **If the clinician literally *cannot* conceive of dissociation:** That is standard Frickerian HI.
  *   **If the clinician *could* know but relies on reductive bins to save time/effort:** That is Dotson's Contributory Injustice.

  **Advice:** Don't frame this as "Fricker missed this." Frame it as "Fricker identifies the structural gap, but I am analyzing the *labor dynamics* of that gap." If you ignore Dotson, your seminar peers will catch it.

  ### 2. Is the Ryle Move legitimate?
  **Verdict:** It is metaphorically powerful but technically shaky. Proceed with caution.

  Ryle's "category mistake" is a specific logical error (e.g., asking "Where is the University?" after being shown all the buildings). It implies a misunderstanding of the *logical grammar* of a concept.

  **The Problem:** Diagnosing dissociation as depression isn't strictly a Rylean category mistake; it's a diagnostic error within the same logical category (mental health pathology). Both are biomedical/psychological classifications. A Rylean mistake would be treating a moral failing as a viral infection, or a spiritual crisis as a chemical imbalance.

  **The Fix:** You can salvage this by arguing that the clinician is committing a **phenomenological category mistake**. They are treating a *first-person experiential category* (dissociation as a state of being) as a *third-person symptom category* (depression as a checklist item).
  *   **Why this works:** It highlights the epistemic violence of forcing a lived experience into a bureaucratic box.
  *   **The Risk:** Analytic philosophers love to nitpick Ryle applications. If you use it, explicitly state you are adapting the concept socially/phenomenologically, not adhering to Ryle's strict logical definitions. Alternatively, consider José Medina's concept of **Hermeneutical Domination**, which might fit your "active misplacement" idea better than Ryle.

  ### 3. Is there a counterexample where the "wrong" category benefits the patient?
  **Verdict:** Yes, and you must address this to strengthen your essay.

  **The "Insurance Diagnosis" Scenario:** A patient experiences complex trauma (which might not be covered or taken seriously) but accepts a "Major Depressive Disorder" code to unlock insurance coverage for therapy.
  *   **Pragmatic Benefit:** They get treatment and financial support.
  *   **Epistemic Harm:** They are misrecognized. Their self-narrative is distorted. They may be treated with SSRIs when they need trauma-informed care.

  **Why this matters for your argument:** This proves your point that **epistemic harm and pragmatic benefit can diverge.** Fricker acknowledges secondary practical harms, but your case shows practical *benefits* masking epistemic *harms*. This supports your "direction of labor" claim: the patient accepts the epistemic harm (doing the labor to fit the box) to secure the pragmatic benefit. This makes the injustice more insidious, not less.

  ### 4. Does this require clinician bad intent?
  **Verdict:** No. You are correct here.

  Fricker's HI is structural. The clinician is operating within a system (insurance codes, DSM-5 limitations, 15-minute appointment slots) that incentivizes binning. The injustice is in the **systemic allocation of hermeneutical power**, not the individual malice.
  *   **Warning:** Be careful not to slide into Testimonial Injustice (TI). TI involves a credibility deficit due to prejudice (e.g., "She's hysterical, don't listen"). HI involves a *resource* deficit (e.g., "I don't have a code for this"). Your example sounds like HI, but if the clinician ignores the patient's description because they think the patient is unreliable, that's TI. Keep the focus on the *toolkit limitation*, not the *credibility judgment*.

  ### Summary of Recommendations

  1.  **Engage Dotson:** You are describing the *labor* aspect of hermeneutical marginalization. Dotson's "Contributory Injustice" is the necessary counterpoint. If you don't mention her, it looks like you haven't done the reading.
  2.  **Soften the Ryle Claim:** Frame it as a "social category mistake" or "ontological misplacement" rather than a strict Rylean logical error. It's a useful heuristic, not a logical proof.
  3.  **Lean into the Labor:** This is your strongest original contribution. The idea that the marginalized subject must perform **interpretive labor** to make themselves intelligible to the powerful is a robust argument. It connects epistemic injustice to emotional labor.
  4.  **Address the "Benefit" Counterexample:** Acknowledge that patients sometimes accept the "wrong bin" for survival/resources. This highlights that the injustice is coercive, not just confusing.

  **Final Verdict:** Your premise is not confused. It is a viable, graduate-level refinement of Fricker. However, it is not entirely new (Dotson/Medina cover the ground), so your novelty lies in the specific focus on **interpretive labor asymmetry**. If you anchor that, the essay holds up.
