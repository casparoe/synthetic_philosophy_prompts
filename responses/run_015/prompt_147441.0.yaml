answer: |-
  1. Begin with the mapping worry to establish that implementation is not trivial, for without a fixed subject the moral question is vacuous. Only once the physical realisation is secured should you introduce the duplication-and-merge case, which then naturally forces the question of whether sentience admits of degrees upon recombination.

  2. Your merge case is suitable provided it preserves functional identity while challenging causal continuity, as this forces students to confront whether moral weight resides in the pattern or the process. It must lack any loss of information during the averaging, otherwise they will dismiss the result as mere corruption rather than a philosophical puzzle.

  3. You must preempt the nihilistic conclusion about arbitrary boundaries during the initial mapping discussion, lest they decide the entire inquiry is linguistically futile before reaching the ethics. Head off the summation error immediately after introducing the duplication, clarifying that moral weight is not extensive like mass before they calculate the merge.

  4. Ask them to specify precisely which physical property distinguishes a morally relevant computation from a trivially mapped one, rather than allowing them to assert that functionality alone suffices. This demands they articulate the constraint on implementation rather than merely repeating the slogan that consciousness is computational.

  5. Your instinct regarding the hard problem is correct, so you should declare that you are bracketing the origin of experience to focus strictly on the conditions under which we attribute it. Say simply that explaining why there is something it is like to be a system lies outside the scope of an ethical framework based on computational structure.
