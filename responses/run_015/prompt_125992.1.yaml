answer: |-
  The *Mauerschützenprozesse* serve as a crucible for the Hart–Fuller exchange, not because they resolve the debate, but because they force its abstract categories into concrete adjudicative shapes. Using your decomposition—Validity, Excuse, Adjudicative, and Transmission—we can map the divergent paths Hart and Fuller prescribe for the guards, commanders, and courts.

  For Hart, the Validity question is straightforward: the published GDR Border Law was positive law. It satisfied the pedigree tests of the predecessor order. Consequently, on the Excuse question, the legal authorization exists but does not morally exculpate; the guards faced a choice between legal sanction and moral wrong. Getting it right meant recognizing the law's validity while accepting moral liability. For the courts, the Adjudicative question demands honesty: if the law was valid, convicting the guards breaches the prohibition on retroactivity. The correct move is to acknowledge the validity, admit the retroactive punishment, and legislate expressly to achieve justice. Regarding Transmission, Hart's model treats the Federal Republic as a new sovereign imposing its moral standards on the past acts of a distinct order, akin to conquest.

  For Fuller, the analysis turns on the internal morality of law. On Validity, the existence of unpublished standing orders pressing guards to prevent escape "at any cost" creates a failure of congruence between declared rule and official action. This defect strips the norm of legal character. On the Excuse question, if the norm was not law, there is no legal excuse to defeat; the defendant stands裸露 before the moral judgment of the community. For the courts, the Adjudicative obligation is to declare the invalidity as a matter of discovery, not creation. Getting it right means demonstrating that the GDR regime failed its own claim to legality. On Transmission, Fuller's approach suits the stipulated fact that the Federal Republic absorbed the GDR as a continuation of a single legal order. If the GDR norms were never law, the successor court is not punishing retroactively but enforcing the enduring requirements of legality that the predecessor violated.

  When we test these mappings against the actual features of the episode, the explanatory power diverges. Fuller better explains the graded sentences and the disparity between trigger-pullers and order-givers. The courts treated senior officials harsher because they corrupted the internal morality of the system—they authored the secret instructions that broke congruence. The guards, facing the published statute, were seen as operating within a narrower band of legal fidelity, hence the acquittals or suspended sentences. This aligns with Fuller's view that legality is a matter of degree. Hart's framework struggles here; if the law was valid, both guards and leaders followed it. Hart can explain individual guilt via morality, but he lacks the resources to explain why the *legal* reasoning distinguished so sharply between those who wrote the secret orders and those who followed the published ones.

  Furthermore, Fuller explains the courts' need to present invalidity as discovered rather than created. By invoking the GDR's own constitutional text to read the Border Law narrowly, the courts practiced a form of fidelity to law, attempting to salvage legality from the wreckage. This matches Fuller's insistence that law is a purposive enterprise. Hart, conversely, explains the critical reaction of the German legal literature. Scholars criticized the reasoning as dishonest because, in Hart's view, the courts were doing exactly what he warned against: denying the validity of past law to avoid the stigma of retroactivity. Hart correctly identifies that the courts sacrificed candor for legitimacy. However, Hart is silent on why the courts felt compelled to this fiction. He treats it as a moral failing of the judges, whereas Fuller would see it as an adjudicative necessity to maintain the continuity of the legal order during Transmission.

  Yet, neither theory fully captures the adjudicative reality. The courts did not simply invalidate the law via Radbruch, nor did they honestly punish via retroactivity. They used interpretive doctrine to bypass the jurisprudential quarrel. This suggests a third possibility: the positivism/natural-law debate was adjudicatively inert. The outcome was produced by intertemporal doctrine and the specific facts of the unpublished orders, not by a commitment to either separation or union of law and morals. The courts used Fuller's language of congruence to achieve Hart's goal of punishment, without accepting Hart's cost of honesty.

  Running the analysis in the other direction, does the episode vindicate Hart or Fuller? It vindicates Fuller's diagnostic utility, though not necessarily his metaphysical claims. Hart's standing challenge was that a regime could satisfy the internal morality—generality, clarity, prospectivity—and still be substantively abominable. Theoretically, Hart is correct; a wicked code can be clear and prospective. However, the *Mauerschützenprozesse* did not involve such a regime. The GDR border regime was not just substantively wicked; it was procedurally deceitful. The existence of secret instructions alongside published law is a precise failure of Fuller's congruence requirement. Therefore, the case does not test Hart's challenge directly because the GDR law failed the internal morality test on procedural grounds, not just substantive ones.

  This distinction saves Fuller's claim that the internal morality is a morality of law rather than merely of efficacy. Hart argues that adhering to internal morality only makes law more efficient, not more just. But the German courts treated the breach of congruence as a breach of authority. By hiding the true rule (shoot to kill) behind a false rule (last resort), the GDR forfeited the claim to fidelity that law demands. The courts punished the leaders not merely for killing, but for corrupting the legal form itself. This suggests that the internal morality is not just about efficacy; it is about the legitimacy of the claim to obligation. When a regime lies about its rules, it cannot demand obedience as law, only compliance as force.

  Ultimately, the episode shows that while Hart is right about the theoretical possibility of wicked law, Fuller is right about the adjudicative leverage provided by procedural defects. The courts could not have convicted the guards solely on substantive injustice without triggering the retroactivity bar. They needed the procedural hook—the secret orders—to declare the law invalid without admitting retroactivity. This allowed the Transmission question to be resolved in favor of continuity: the Federal Republic was not conquering a foreign state but cleansing its own extended legal order of a period of illegality.

  Therefore, the case vindicates neither theory completely but reveals their functional limits. Hart provides the critical lens for the scholars' dissatisfaction with the courts' honesty. Fuller provides the doctrinal tools the courts actually used to distinguish the leaders from the guards. The outcome was produced by interpretive doctrine, but that doctrine was structured by Fuller's insights into congruence. A regime can satisfy most desiderata of the internal morality and be abominable, as Hart insists. But when it fails congruence, as the GDR did, Fuller's morality becomes a threshold condition for the existence of law. In the *Mauerschützenprozesse*, the defect was not just that the law was wicked, but that it was a sham. The courts recognized that a sham law offers no excuse, and in doing so, they treated Fuller's internal morality as a constitutive element of legal validity, not merely a guide to efficacy.
