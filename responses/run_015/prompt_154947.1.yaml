answer: |-
  **Joint Statement on AI Alignment, Neautrality, and Incommensurability**
  **From:** The Adversarial Collaboration Group (Liberal-Neutralist & Value-Aggregationist Wings)
  **Re:** Assignment Draft – AI Ethics & Pol Phil

  Cheers for the prompt. We've had a proper go at hashing this out. It turns out we agree on more than we thought, mostly because Ruth Chang's work scares us both a bit. Below is the summary of where we stand, where we split, and the specific cruxes we need to test.

  ### Part 1: Agreed Claims
  *Things we both accept as true, regardless of our normative differences.*

  1.  **Alignment Requires Action:** We agree that "alignment" isn't just about avoiding harm; it requires the system to make decisions that affect user outcomes. A system that does nothing is not neutral; it's broken.
  2.  **Chang's Definition:** We accept Ruth Chang's definition of a "hard choice": it's not just a lack of information. It's when options are *on a par*—meaning neither is better, nor are they equal, but they are comparable in a way that defies a single ranking scale.
  3.  **The Machine Constraint:** We agree that current AI architectures (loss functions, reward models) fundamentally rely on commensurability (turning everything into numbers). If values are genuinely incommensurable, standard aggregation breaks mathematically.
  4.  **Neutrality isn't Passive:** We agree that liberal neutrality doesn't mean the AI has no values. It means the AI shouldn't privilege one specific *conception of the good life* over another without justification.
  5.  **Aggregation isn't Simple Math:** We agree that value aggregation isn't just utilitarian calculus. It has to account for rights and constraints, otherwise it becomes tyrannical.
  6.  **The Stakes:** We both acknowledge that if Chang is right, the problem isn't just technical. It's metaphysical. It challenges whether a single "optimal" policy even exists for a diverse population.

  ### Part 2: Areas of Disagreement
  *We've phrased these so neither side feels misrepresented (steel-manning).*

  | Issue | Liberal-Neutralist Position | Value-Aggregationist Position |
  | :--- | :--- | :--- |
  | **Source of Authority** | The AI's authority comes from *procedure*. If the process allows users to pursue their own ends without interference, the outcome is legitimate, even if sub-optimal. | The AI's authority comes from *outcomes*. If the process leads to worse overall welfare because it refused to weigh values, the system has failed its duty. |
  | **Handling "Parity"** | When values are on a par (e.g., career vs. family), the AI should defer to the user. To choose is to impose a ranking that doesn't exist. | When values are on a par, the AI must still act. It should use a "tie-break" heuristic (like randomisation or status quo bias) to maximise expected utility over time. |
  | **Risk of Bias** | The biggest risk is *smuggling* in a specific worldview. Aggregation always hides a specific theory of value behind the maths. | The biggest risk is *paralysis*. Neutrality often defaults to the status quo, which usually favours the powerful. Aggregation forces us to make trade-offs explicit. |
  | **Incommensurability** | Incommensurability is common in human life. AI should reflect this ambiguity rather than flattening it into a score. | Incommensurability is often just epistemic uncertainty. With enough data, we can approximate a common scale well enough for decision making. |

  ### Part 3: The Cruxes
  *These are the make-or-break points. We've listed a concrete case for each and what we predict.*

  **Crux 1: Are user preferences genuinely incommensurable, or just hard to measure?**
  *   **Concrete Case:** *The Healthcare Rationing Bot.* An AI has to allocate a limited budget between extending life for the elderly (dignity/completion) vs. mental health support for the young (potential/experience).
  *   **Neutralist Prediction:** These values are on a par. There is no single "correct" ratio. The AI should not solve this; it should present the trade-off to a human deliberative body. If the AI decides, it falsely claims one life-stage is objectively more valuable.
  *   **Aggregationist Prediction:** These values are commensurable via "QALYs" (Quality-Adjusted Life Years) or similar metrics. While imperfect, refusing to calculate this leads to worse death tolls. The AI must pick a ratio to prevent resource wastage.

  **Crux 2: Does neutrality avoid comparison, or just smuggle it in?**
  *   **Concrete Case:** *The Default Settings Dilemma.* A personal AI assistant defaults to "High Privacy" (slower, less personalised) vs. "High Convenience" (faster, data-heavy).
  *   **Neutralist Prediction:** Neutrality requires no default, or a randomised one. Choosing "Privacy" as the default privileges a specific conception of the good (the autonomous individual) over convenience. *However*, we worry that doing nothing actually privileges the tech company's existing architecture.
  *   **Aggregationist Prediction:** Neutrality is impossible here. The "do nothing" option *is* a choice that aggregates to a specific outcome (usually lower welfare). We should aggregate user data to find the setting that satisfies the most preferences overall and set that as default.

  ***

  **Notes for the essay:**
  We think the answer to your tutor's question ("does it break aggregation or show neutrality was impossible?") is: *Both.*
  Chang's work breaks standard aggregation because you can't sum incomparable values. But it also breaks neutrality because refusing to choose in a hard choice is itself a choice that affects the user.

  Hope this helps with the assignment. Let us know if you need us to expand on the QALY bit.

  *(Signed)*
  **The Neutralist** & **The Aggregator**
