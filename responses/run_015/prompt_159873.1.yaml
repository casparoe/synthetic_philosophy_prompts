answer: |-
  **Mara:** Let's stipulate the case clearly so we don't drift. Subject S is shown a grid of colored squares for fifty milliseconds. Simultaneously, S is engaged in a high-load auditory monitoring task that fully occupies her central executive. We assume, for the sake of argument, that this load prevents any higher-order thought (HOT) about the visual array from occurring at the time of presentation, $t_1$. One second later, at $t_2$, the load lifts. S immediately reports the color and position of the squares and says, "I saw them; it looked like something to me."

  **Elena:** Agreed. That's the battleground. On my dispositional reading, S's visual state at $t_1$ was phenomenally conscious. It didn't need an actual HOT to occur then; it only needed to be available to her higher-order system. The fact that she reports it accurately and claims phenomenal awareness at $t_2$ confirms that the state was poised for uptake. It was conscious *then*, even if she didn't think about it *then*.

  **Mara:** And on my occurrent reading, S was blind to the array at $t_1$. The first-order visual state existed, but it was dark. Consciousness requires the actual lighting-up of a higher-order state. Since the cognitive load blocked that occurrence, there was no experience. Her report at $t_2$ is a reconstruction based on a residual sensory trace, not a memory of a phenomenal experience. She says "it looked like something," but she is misdescribing a non-phenomenal registration as a conscious sight.

  **Elena:** That seems uncharitable to the subject. Why assume she's wrong about her own experience?

  **Mara:** Because the mechanism is blocked. If the HOT system is busy, it can't represent the state. No representation, no consciousness. That's the core of Higher-Order Theory. You're keeping the theory but removing the "Higher-Order" part at the crucial moment.

  **Elena:** I'm keeping the *dependence* on the Higher-Order system, just not the *occurrence*. But let's address the first pressure point. The Symmetry Worry. When S reports at $t_2$, she obviously forms a HOT then. She introspects the memory and thinks, "I saw red." So, a HOT occurs in both our stories. In yours, it occurs only at $t_2$. In mine, one occurs at $t_2$ about a state that was available at $t_1$. If the observable output—the report—is generated by the HOT at $t_2$ in both cases, what empirically distinguishes us? Are we just arguing about a metaphysical ghost?

  **Mara:** It's not a ghost if it changes the causal history. On my view, the report at $t_2$ is inferential. S infers from the accuracy of her guess or the strength of the sensory trace that she must have seen it. On your view, the report is a direct retrieval of a phenomenal property. If we could measure the neural latency or the confidence markers, we might see the difference. Reconstruction takes more work than retrieval. But even if we can't measure it, the distinction is real. If consciousness is an event, it either happened or it didn't. You're saying the event can be retroactively true. I say that's incoherent.

  **Elena:** I'm not saying the event is retroactive. I'm saying the *status* of the first-order state was different at $t_1$. Think of it like a phone ringing in an empty room. If no one hears it, did it make a sound? You say no, because hearing is the event. I say yes, because the air vibrations were available to a hearer. The symmetry worry suggests that because the "hearing" happens later in both cases (when she checks the voicemail, so to speak), we can't tell the difference. But the difference is whether the sound existed *before* the check. My theory says the phenomenal character is a property of the state's availability, not just the act of checking.

  **Mara:** But that leads directly to the External-Monitor Worry. If "availability to a system" is enough, what stops *any* system from making the state conscious? Suppose I attach a probe to S's skull that reads the visual state and transmits it to a computer. That state is now "available" to an external monitor. Or suppose I, Elena, look at your brain scan and form a thought about your visual state. That state is available to *my* higher-order system. By your logic, does that make *your* state conscious for *you*?

  **Elena:** No, and here is why. The disposition must be intrinsic to the *subject's* cognitive architecture. It's not just availability to *any* monitor; it's availability to the specific higher-order system that constitutes the subject's self-model. The probe doesn't feed into S's decision-making or rational agency. My theory requires that the first-order state be poised for uptake by the *same* system that would generate the self-ascription. It's about internal functional integration, not just causal access.

  **Mara:** But if no uptake occurs, how does "internal integration" differ from "external access" in terms of phenomenology? You're smuggling in a First-Order intuition. You want the state to be conscious because of what it *does* internally, even if the higher-order part never happens. If the HOT never fires, the "higher-order" in your theory is doing no work. It's just a label for "functionally integrated first-order state."

  **Elena:** It does work. It explains why the state is reportable without attention. The work is done by the *connection*, not the *firing*. If the connection is severed, the state becomes unconscious, like in blindsight. In blindsight, the visual state isn't available to the HOT system. In our case, it is available, just not accessed. That's the difference. The external probe doesn't fix the internal disconnect of the blindsighter.

  **Mara:** Fine, but that brings us to the cost each of us pays. Let's be explicit. My cost is that experience winks out. If S looks at a sunset while solving a complex equation, the sunset goes dark. The world disappears phenomenally whenever attention is fully absorbed elsewhere. That seems to contradict the continuity of experience.

  **Elena:** Exactly. It makes consciousness gappy. It makes us zombies whenever we are distracted. My cost, which you haven't let me state, is that a subject can be conscious of a state she is in no position to register as her own. I admit that. On my view, S is conscious of the red square at $t_1$ even though she has no idea she is conscious of it until $t_2$.

  **Mara:** And that is "unconscious consciousness." It violates the transparency of experience. If you are conscious of X, you know you are conscious of X. That's the whole point of a Higher-Order theory! To explain subjective awareness. If you allow consciousness without the higher-order awareness occurring, you've abandoned the motivation for the theory. You might as well be a First-Order theorist who adds a dispositional clause to dodge objections.

  **Elena:** I haven't abandoned it. I've refined what the higher-order relation *is*. It's a capacity, not an act. The cost you pay is worse. You have to tell S that when she says, "I saw the red square," she is lying about the past. She says it looked like something. You say it was nothing. I trust the subject's phenomenological report; you trust the strictures of your occurrent mechanism over the report.

  **Mara:** I trust the mechanism because the report is theory-laden. S assumes that because she can report it now, she experienced it then. That's a folk-psychological error. My cost—gappy experience—is actually a virtue. It explains change blindness. We think we see everything, but we don't. We only see what we attend to. My theory aligns with the data that unattended stimuli often fail to enter awareness. You have to say unattended stimuli are conscious as long as they are *accessible*. That predicts we are conscious of far too much.

  **Elena:** I don't say *all* accessible stimuli. Only those poised for the *specific* higher-order system. But let's step back. We've addressed the symmetry, the external monitor, and the costs. We're still at an impasse. What is this really about?

  **Mara:** It's about whether consciousness is an *event* or a *property*. I hold that consciousness is something that happens to a state. It's an occurrence. Like a light turning on. If the switch isn't flipped, the light is off.

  **Elena:** And I hold that consciousness is a *status* a state has in virtue of its role in the system. It's like being "readable." A file is readable even if no one opens it, provided the drive is connected and the format is compatible.

  **Mara:** But a file isn't *seen* until it's opened.

  **Elena:** But the visual state isn't a file. It's a mode of the subject. If the subject's system is tuned to it, the subject is in a conscious state, even if the spotlight of attention hasn't swept over it yet.

  **Mara:** So for you, "consciousness" just means "capable of being noticed."

  **Elena:** No. It means "having the kind of functional profile that constitutes a perspective." The perspective exists even if the specific act of self-scrutiny is delayed. For you, the perspective only exists during the act of scrutiny.

  **Mara:** Precisely. And if the act of scrutiny is absent, there is no one home.

  **Elena:** And if the capacity to scrutinize is present, someone is home, even if they're looking out the window.

  **Mara:** Then we agree on the architecture but disagree on the metaphysics of presence.

  **Elena:** We agree that the Higher-Order system is necessary. We disagree on whether its *activation* is necessary, or if its *readiness* suffices.

  **Mara:** And until we can decide whether the "light" of consciousness is the bulb or the electricity, we won't move.

  **Elena:** Or whether the light needs to be shining to count as a lamp.

  **Mara:** I say yes.

  **Elena:** I say no.

  **Mara:** Then we have work to do.

  **Elena:** We always do.
