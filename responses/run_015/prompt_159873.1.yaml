      *Let's refine the Symmetry Worry:* The worry is that since the subject reports it at $t_2$, she forms a HOT at $t_2$. So observable behavior is identical. Mara: "Exactly, the HOT happens at $t_2$, so there was none at $t_1$." Elena: "But the *ground* for the HOT was there at $t_1$." They need to dig deeper. Is there *any* observable difference? Maybe neural latency? Mara might argue that if it was conscious at $t_1$, there should be a trace distinct from unconscious processing. Elena argues the trace *is* the availability.
