answer: |-
  ### 40-Minute Session Arc: The Epistemology of Organisation

  **0–5 mins: Framing the Problem (Defusing "Anti-Democratic")**
  *   **Goal:** Establish that this is a critique of *decision-making quality*, not a plea for chaos.
  *   **Action:** Acknowledge the room's premise (parties are necessary for power). State Weil's counter-premise: "If the goal is collective change, the mechanism of thought must be uncorrupted."
  *   **Defuse Misconception (Anti-Democratic):** Clarify immediately that Weil argues parties *reduce* democracy by substituting the "general will" with the "party will." She wants *more* genuine public consent, not less structure.
  *   **Dependency:** You must establish the *value of truth* before discussing the *mechanism of corruption*. If you start with "parties are bad," they hear moralizing. If you start with "truth requires isolation from pressure," they hear psychology.

  **5–15 mins: The Mechanism (Attention vs. Collective Pressure)**
  *   **Goal:** Demonstrate the cognitive cost of affiliation.
  *   **Concept:** Define **Attention** not as focus, but as a receptive state where the mind waits for evidence to form a conclusion. Define **Collective Pressure** as the force that demands a conclusion *before* evidence is fully weighed to maintain group cohesion.
  *   **Defuse Misconception (Power Asymmetries):** Address this here. Explain that Weil sees the party not as a tool to *fight* power asymmetries, but as a machine that *creates* a new asymmetry: the group over the individual conscience. The party becomes the dominant power object, superseding the public good.
  *   **Dependency:** This must precede the political conclusion. You must prove that *belonging* changes *thinking* before you argue that *abolishing belonging* improves politics.

  **15–30 mins: The Carrying Example (Zoning Dispute)**
  *   **Goal:** Visualize the epistemic damage in real-time.
  *   **Scenario:** A local zoning dispute regarding affordable housing density.
      *   **Group A (Party Caucus):** Members belong to a party with a national platform on housing.
      *   **Group B (Unaligned Deliberation):** Members are neighbours with no permanent affiliation.
  *   **What to Include:** A specific conflict where the *local data* contradicts the *national platform* (e.g., the specific site floods, but the platform demands maximum density everywhere). Show the Caucus member voting for density *despite* the flood risk to avoid weakening the party's bargaining position.
  *   **What to Exclude:** Personal corruption (bribes, career climbing). Weil's argument is structural, not about "bad apples." Exclude emotional shouting matches; keep it cold and procedural to highlight the *structural* necessity of the lie.
  *   **Critique of your idea:** Your jury comparison is close, but a jury is legalistic. Weil cares about the *public good*. Ensure the "Unaligned" group isn't just deciding guilt, but designing a solution. The key difference must be the *ability to change one's mind* without treason.
  *   **Dependency:** This applies the mechanism (Pressure) to the politics (Parties). It proves the earlier theory has material consequences.

  **30–35 mins: Misconceptions & Alternatives (Defusing "Anarchist")**
  *   **Goal:** Clarify what replaces the party.
  *   **Defuse Misconception (Secretly Anarchist):** Explain that Weil does not abolish *organisation*, only *permanent collective egoism*. She proposes temporary movements based on specific proposals (e.g., "Pass this Housing Bill") rather than permanent tribes ("We are the Labour Party"). Structure remains; tribal permanence goes.
  *   **Why here?** Once they see the damage (via the example), they will ask "But what do we do?" This is the moment to offer the alternative without it sounding like utopianism.

  **35–40 mins: The End Check**
  *   **Goal:** Verify grasp of epistemic damage vs. moral disagreement.
  *   **Activity:** Ask participants to write down one sentence.
  *   **Prompt:** "Identify the exact moment in the zoning example where the Party Caucus member tells a lie, even if they believe the housing goal is good."
  *   **Success Criterion:** They must identify the lie as *suppressing the flood risk data* to maintain platform consistency, not the vote itself. If they say "the lie is voting against housing," they missed the point. The lie is prioritizing the *party's position* over the *reality of the site*.

  ### What to Leave Out
  **Leave out:** Her religious/mystical framework (Catholic mysticism, "waiting on God").
  **Why:** For secular organisers, framing "attention" as a spiritual duty alienates the audience and obscures the political mechanism. Translate "attention" into "radical intellectual honesty" or "evidence-based receptivity." The political argument stands on epistemology alone; the theology is scaffolding you can remove for this specific group.

  ### Discovery Conditions & Shaky Reasoning
  **Reorder Condition:** If you discover during the intro that most participants are *elected officials* bound by whips, rather than *organisers*.
  *   **Reason:** Officials operate under legal/constitutional party constraints that Weil ignores. You would need to move the "Misconceptions/Alternatives" section earlier to address the practical impossibility of their situation, or the session becomes purely theoretical frustration.
  **Shakiest Reasoning:** My assumption that 10 minutes is sufficient to explain "Attention" vs. "Pressure." This is Weil's most difficult concept. If they don't grasp that "pressure" is an epistemic blocker (not just social awkwardness), the rest of the argument collapses into "parties are mean." I am flagging this as the highest risk point for failure.

  This plan sequences psychological mechanism before political conclusion to prevent dismissal as idealism, uses a zoning case to isolate structural lying from personal corruption, and verifies understanding by testing for the suppression of evidence rather than policy disagreement.
