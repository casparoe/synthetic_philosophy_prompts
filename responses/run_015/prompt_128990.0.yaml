      *   Core text: *On the Abolition of All Political Parties* (1940).
      *   Core mechanism: The party is a machine that generates collective passion. The individual submits to the pressure of the collective.
      *   Key concept: "Attention" (waiting for truth) vs. "Pressure" (forcing a conclusion).
      *   The Party's goal: Self-preservation and growth, not truth or public good.
      *   The result: Lying becomes necessary; nuance becomes treason.
      *   Weil's alternative: Movements based on specific public good proposals, not permanent affiliations.

  3.  **Drafting the Arc (40 minutes):**
      *   *0-5 min:* Hook & Framing. Acknowledge their belief (parties are necessary). State the goal (test the *mechanism* of judgement).
      *   *5-15 min:* The Mechanism (Attention vs. Pressure). Define "attention" as receptive truth-seeking. Define party pressure as the antagonist.
      *   *15-25 min:* The Example (Zoning Dispute). Compare Caucus vs. Jury.
      *   *25-35 min:* Misconceptions & Nuance. Address democracy, power, anarchism.
      *   *35-40 min:* End Check & Closing.

  4.  **Refining the Dependency Order:**
      *   Must start with *human psychology/epistemology* (how we know truth), not political structure. If we start with "parties are bad," they'll reject it as idealism.
      *   Order: 1. The nature of Truth/Attention (individual capacity). 2. The mechanism of Collective Pressure (how groups warp #1). 3. The Party as the institutionalization of #2. 4. The Conclusion (abolition).
      *   Why? Because if they accept that truth requires isolation from pressure, the party becomes logically impossible to reconcile with truth.

  5.  **Evaluating the Example (Zoning Dispute):**
      *   *Proposal:* Party Caucus vs. Unaligned Jury.
      *   *Critique:* Weil cares about the *general will* vs. *particular will*. A jury is legalistic. A zoning dispute is concrete.
      *   *Weil's focus:* She cares about the *motivation* (growth of party vs. public good).
      *   *Adjustment:* The example must show the *moment of compromise*. In the caucus, the compromise is "what keeps the coalition together." In the unaligned group, the compromise is "what fits the facts."
      *   *Include:* A specific policy detail where party platform conflicts with local reality.
      *   *Exclude:* Personal gain/corruption (Weil's point is structural, not about bad apples).

  6.  **Addressing Misconceptions:**
      *   *Anti-democratic:* Address during the "Alternative" phase (25-35 min). She wants *more* democracy (truth-based), not less.
      *   *Ignores Power:* Address during the Mechanism phase. She knows power exists; she argues parties *magnify* brute force over reason.
      *   *Secretly Anarchist:* Address at the end. She isn't against structure, she's against *permanent* collective egoism.

  7.  **End Check:**
      *   Need to test if they understand the *epistemic* claim.
      *   Question: "Describe a situation where voting against your party line would be an act of loyalty to the public good, according to Weil."
      *   Better: Ask them to identify the "moment of lying" in the example.

  8.  **What to Leave Out:**
      *   *Religious Framework:* Yes, leave out. Her concept of "attention" is spiritual (waiting on God), but for this group (organisers), translate it into "radical listening" or "evidence-based reasoning." Bringing in Catholic mysticism will distract from the political mechanism.

