      *   *TA's specific error:* The TA says "Butterfly effect means..." The butterfly effect is a property of deterministic non-linear systems. So the TA is contradicting the definition of the phenomenon they are citing.
      *   *Tone Check:* Ensure I don't sound arrogant. Frame it as "Here are the distinctions your TA is collapsing."

