prompt: |-
  I'm preparing a proposal for a philosophy-of-physics term paper, about 6,000 words over one semester, and I want to turn a half-formed classroom idea into a sharply framed project. In our coursework we've covered the standard explanation of the thermodynamic arrow: combine statistical mechanics with a low-entropy boundary condition—often called the Past Hypothesis—located in the temporal past. What keeps bothering me is whether every formulation of this boundary condition smuggles in the very temporal direction it is supposed to ground; we call the boundary condition "past" only because we already assume entropy increases toward the future. I want to ask whether the arrow can be reconstructed from a purely structural asymmetry in macroscopic records, where "record" is defined not by temporal location but by the robustness of correlations across subsystems. The precise question should be this: if we characterize record-stability without invoking earlier or later, can that asymmetry alone determine the direction of entropy increase, or does it inevitably collapse back into a redescription of the standard boundary-condition account?

  The proposal needs to state exactly why existing answers leave this gap open—standard treatments treat record asymmetry as a consequence of the arrow rather than its explanatory ground, and they rarely examine whether identifying the low-entropy boundary as "past" is circular. It should lay out the actual semester-long method: formalizing a minimal toy model of correlation stability, comparing its predictions against the statistical-mechanical baseline, and pinpointing where temporal vocabulary becomes indispensable rather than merely convenient. Please specify what a successful result looks like (a genuinely non-circular derivation yielding the correct directional asymmetry) versus failure (either unavoidable circularity or an account indistinguishable from the standard one), and include an honest assessment of whether this is too ambitious for a single term paper—what must be narrowed or dropped. Do not include a bibliography, reading list, or citations; I will add references myself.
