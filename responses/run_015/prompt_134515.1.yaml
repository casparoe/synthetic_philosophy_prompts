onse with the tree itself, presented as nested split-questions leading to named or unnamed leaves, followed immediately by the leaf descriptions, the flagged separation failures, and the empty-combination diagnoses. No introductory paragraph, no repetition of the assignment, and no citations, bibliographies, or reading lists.
