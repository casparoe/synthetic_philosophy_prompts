  Decision Tree: Conceptual Mapping of American Exceptionalism

  1. What kind of claim is the speaker making about American Exceptionalism?
      ├── A. Historical Claim (about what the country *is/was*)
      │   ├── 1. Is the alleged uniqueness structural or performative?
      │   │   ├── i. Structural (rooted in durable institutional design)
      │   │   │   └── [Leaf: Structural Exceptionalism]
      │   │   └── ii. Performative (discourse generates the political conditions)
      │   │       └── [Leaf: Performative Exceptionalism]
      │   └── (End of Historical Branch)
      ├── B. Normative Claim (about what the country *ought* to do)
      │   ├── 1. Is the implied duty exemplary or missionary?
      │   │   ├── i. Exemplary (the nation should be imitated)
      │   │   │   └── [Leaf: Exemplary Exceptionalism]
      │   │   └── ii. Missionary (the nation should actively spread its system)
      │   │       └── [Leaf: Missionary Exceptionalism]
      │   └── (End of Normative Branch)
      └── C. Ideological Claim (about what social function the idea *serves*)
          ├── 1. Does exceptionalism primarily legitimize participation or expansion?
          │   ├── i. Democratic Participation
          │   │   └── [Leaf: Democratic-Legitimation Ideology]
          │   └── ii. Imperial Expansion
          │       └── [Leaf: Imperial-Legitimation Ideology]
          └── (End of Ideological Branch)

  Leaf Descriptions

  Structural Exceptionalism
  Name: Structural Exceptionalism
  Awkward Commitment: It must attribute global institutional convergence to imitation rather than independent development to maintain the claim of uniqueness.

  Performative Exceptionalism
  Name: Performative Exceptionalism
  Awkward Commitment: It concedes that the nation ceases to be exceptional if citizens stop reciting the creed.

  Exemplary Exceptionalism
  Name: Exemplary Exceptionalism
  Awkward Commitment: It demands foreign policy paralysis to avoid contaminating the domestic model.

  Missionary Exceptionalism
  Name: Missionary Exceptionalism
  Awkward Commitment: It accepts that destroying a democracy may be necessary to build one.

  Democratic-Legitimation Ideology
  Name: Democratic-Legitimation Ideology
  Awkward Commitment: It categorizes systemic critique as psychological maladjustment rather than political reasoning.

  Imperial-Legitimation Ideology
  Name: Imperial-Legitimation Ideology
  Awkward Commitment: It requires describing subordinate populations as beneficiaries of their own subjugation.

  Separation Failures

  Structural Exceptionalism vs. Institutional Comparative Advantage
  Flag: The tree cannot reliably separate Structural Exceptionalism from a purely institutional comparative-advantage view.
  Diagnosis: Both positions point to durable institutional design as the source of success; the distinction relies entirely on whether the speaker insists on absolute uniqueness versus relative advantage, a difference often rhetorical rather than substantive.

  Empty Combinations

  Historical Claim + Missionary Duty (without Normative Bridge)
  Diagnosis: Incoherent.
  Reasoning: This combination attempts to derive an obligation to spread a system directly from a fact of uniqueness, committing the naturalistic fallacy without an intervening normative premise.

  Negative Structural Exceptionalism (Uniquely Flawed)
  Diagnosis: Unattractive.
  Reasoning: While logically possible within the Historical/Structural leaf, this position lacks mobilizing power and is rarely adopted as a primary political identity because it offers no basis for patriotism.

  Performative Mechanism + Imperial Function
  Diagnosis: Unexplored.
  Reasoning: Admitting that the uniqueness is a constructed myth used solely to justify expansion is logically consistent but politically unsustainable for public discourse, leaving this combination occupied only by critical outsiders rather than adherents.
