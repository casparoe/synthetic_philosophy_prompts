  ## 8. Checklist for Success

  1.  **Test the Boards:** Before Tuesday, build Alpha and Beta. Ensure the boundary match is obvious.
  2.  **Enforce the "Detector" Language:** Correct anyone who says "coordinate." Use "slot" or "detector."
  3.  **Hold the Line on Scoring:** When they protest the voided Type P bets, stand firm. "The theory allows both. I cannot pay on a distinction the theory does not recognize."
  4.  **Manage the Ego:** Retired engineers may feel "tricked." Frame it as "Einstein tricked the greatest physicists of his day for ten years. You lasted 45 minutes."
  5.  **Leave Time for the Contested:** Ensure the last 10 minutes acknowledge that philosophers still fight about this. It validates their intuition if they felt the "Relationalist" solution was a bit of a cop-out.

  This design respects their intelligence (no baby talk), uses their strength (systems/prediction), and forces the philosophical conclusion through mechanical necessity rather than lecturing.
