answer: |-
  Consider a post-mortem on a corporate data breach. Two analysts agree on the base rates: in the industry, 10% of breaches involve SQL injection ($A$) and 10% involve phishing ($B$). They also agree on the ontology: these are distinct techniques with no causal link (wire-free independence). However, they are only analyzing this specific incident because data was lost ($L$), and loss occurs if *either* $A$ or $B$ succeeds.

  Analyst 1 leans on the **wire-free** intuition. "There's no mechanism linking SQL injection to phishing," they say. "So we factorize." They estimate the probability both were used as $P(A) \times P(B) = 0.01$ (1%). They treat the background fact ($L$) as inert.

  Analyst 2 insists on **filter-proof** independence. "We are conditioning on $L$," they counter. "$L$ is a collider caused by $A$ or $B$." They calculate $P(A \land B | L) = P(A \land B) / P(A \lor B) = 0.01 / 0.19 \approx 5.3\%$.

  Both agree on the evidence and the causal wiring. But Analyst 1 assumes wire-free implies **factorizing** conditional on evidence, while Analyst 2 sees that the selection filter ($L$) induces correlation. The heuristic "multiply the probabilities" fails because the condition "we are looking at this case" destroys the independence, even if the world itself is wire-free.

  The honest presumption is not that events are causally isolated, but that your specific background knowledge $K$ does not function as a collider: $P(A \land B | K) \approx P(A | K)P(B | K)$.
