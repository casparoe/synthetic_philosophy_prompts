      *   **Mechanism:** Agents meet a "fair share" of the "global utility shortfall" calculated against a "collective baseline."
      *   **Core Question:** Does this avoid the demandingness objection, OR does it relocate the demandingness to the baseline calculation?
      *   **Implicit Requirement:** The student needs to engage with the *relocation* possibility. The prompt explicitly asks: "In particular, does it genuinely resolve the problem, or does it relocate the demandingness to the baseline calculation?" This is a binary or nuanced choice that requires argumentation.

  3.  **Analyze the Student Answer:**
