          *   *Student Answer:* Claims APCC sidesteps Scheffler's objection. Shifts from individual optimization to collective fair-share. Example: 10% income. Attributes view to Liam Murphy's "division of moral labor" applied to climate finance. Claims institutions set baseline. Concludes demandingness is solved once baseline is fixed.

  2.  **Analyze the Exam Question (The Prompt):**
