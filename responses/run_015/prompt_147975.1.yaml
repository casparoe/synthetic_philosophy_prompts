answer: |-
  You are conflating two distinct phenomena: the second is an established normative doctrine in population ethics called "The Asymmetry," while the first is a framing-dependent inconsistency in risk evaluation that lacks a single canonical name.

  The second case you describe is precisely "The Asymmetry," a term coined in population ethics by Jan Narveson and popularized by Derek Parfit. It is a normative claim stating that we have strong moral reasons not to bring into existence people whose lives would be miserable, but no corresponding moral reasons to bring into existence people whose lives would be happy. This principle is scale-invariant; it applies to having one child as much as to populating the galaxy. It is not primarily psychological but axiological, rooted in the view that suffering is a harm to a subject who exists, whereas non-existence is not a harm to a subject who never exists. Consequently, recasting the creation of happy beings as "preventing the loss of happiness" does not dissolve this asymmetry, because there is no subject to suffer the loss if they are never conceived.

  The first case, regarding risk probabilities, is not The Asymmetry but rather a tension within expected utility theory often explained by loss aversion or risk-weighted decision rules. In standard expected utility theory, shifting probability mass from a catastrophic outcome to a utopian one should be valued symmetrically if the magnitudes are equal. The differential treatment you observe—accepting the reduction of existential risk while rejecting the promotion of existential hope—is usually driven by psychological loss aversion (where losses loom larger than gains) or normative risk aversion (where variance in bad outcomes is weighted more heavily than variance in good outcomes). Unlike The Asymmetry, this evaluation is highly sensitive to framing; if you describe the "astronomically good outcome" as "preventing the loss of a valuable future," the objection often vanishes, suggesting the asymmetry lies in the direction of change relative to a status quo rather than in the valence of the outcome itself.

  These two phenomena converge in longtermist discourse because the "future" involves both potential people (triggering The Asymmetry) and probabilistic trajectories (triggering Risk Asymmetry), but they remain logically independent. You can consistently hold that creating happy lives is neutral (The Asymmetry) while maintaining that reducing the risk of extinction is urgent because it preserves existing value or prevents suffering for those who will exist regardless. Conversely, you could believe creating happy lives is obligatory (rejecting The Asymmetry) but still treat probability shifts toward utopia as fanatical due to epistemic uncertainty about the probabilities involved. The first case depends on the stakes being astronomical to trigger "Pascalian" objections, whereas the second applies equally to ordinary scales. The first is often a descriptive claim about how people argue (rhetorical double standards) or a normative claim about risk weighting; the second is almost exclusively a normative claim about moral reasons.

  I am highly confident that these are distinct philosophical categories with different stability conditions under reframing. I am least sure whether there is a niche slang term within effective altruism communities that bundles these specific rhetorical inconsistencies under a single label, such as "s-risk prioritization bias," though no such term has achieved canonical status in academic philosophy.
