answer: |-
  The glue on the wall chart was still damp. Elara stood before the large panel depicting the flow of capital in a textile factory, her arms crossed. Behind her, Lukas leaned against the doorframe, wiping ink from his fingers.

  "It's clean," Elara said. "Too clean."

  "It's legible," Lukas corrected. "A woman in Favoriten can stand there and understand where her wage goes without needing a dictionary."

  "She understands a lie." Elara tapped the row of identical blue figures at the bottom of the chart. "Look at them. One icon represents five hundred workers. They are all the same height. Same posture. Same lack of a face. You've erased the foreman, the union steward, the sick leave, the accident. You've turned a struggle into a geometry problem."

  "Words erase too, Elara. 'Proletariat.' 'Labor Force.' Those are abstractions just as much as the little man is." Lukas pushed off the doorframe and stepped beside her. "But if I write 'exploitation' in German, a Czech migrant won't read it. If I write it in academic prose, a factory girl won't understand it. The picture is the only bridge we have."

  "It's not a bridge. It's a smoothing iron." She turned to him. "That's the trick, isn't it? Because it looks like a drawing of reality, people assume it *is* reality. If you write a pamphlet arguing that profits are too high, I can argue back. I can say your definitions are wrong. But this?" She gestured to the red arrows siphoning money from the workers to the shareholders. "This looks like physics. You've hidden the ideology inside the style. It's propaganda that claims it isn't propaganda."

  Lukas looked at the chart, then back at her. "So you prefer the pamphlet? The pamphlet says 'trust me, I know the words.' The chart says 'count the boxes.'"

  "Counting isn't thinking."

  "Isn't it?" Lukas pointed to the red arrow representing profit share. "Otto says we are sailors on a ship at sea. We cannot dry-dock the vessel to rebuild it on solid ground. We have to replace the planks while floating. Words are rotten planks, Elara. They are soaked in centuries of metaphysics and class baggage. You say 'freedom,' I hear one thing, the Chancellor hears another. We argue forever and the ship sinks."

  "And pictures are solid wood?"

  "Pictures are inspectable." Lukas's voice tightened. "If this chart is wrong, if the profit share is actually ten percent and not twenty, the worker can point to the red block and say 'that is too big.' She doesn't need to deconstruct your syntax. She can see the proportion. The ideology isn't hidden; it's right there in the ratio. You want to argue about the definition of 'worker.' I want to show her how much money leaves her pocket."

  "You show her the money, but you don't show her who decided the amount." Elara leaned in, lowering her voice. "By making the worker an icon, you make her interchangeable. Replaceable. You've naturalized the system you claim to critique. You're giving them a map of the cage and calling it freedom because the lines are clear."

  Lukas was quiet for a moment. He reached into his pocket and pulled out a small proof sheet, a test print of a new diagram regarding housing costs. He held it out to her. It showed a stack of coins versus a stack of bricks.

  "Look at this," he said. "We tried to do it with text last year. 'Rent burden correlates inversely with caloric intake.' No one read it. Too dense. Too many ways to twist the meaning. So we drew the coins. We drew the bread. Now the mother sees the coins are taller than the bread. She knows she is starving."

  "She knows she is starving," Elara agreed. "But she doesn't know why. Is it the landlord? The government? The market? The picture stops the question at the phenomenon. It creates a shared observation but kills the shared analysis."

  "Maybe," Lukas said. "But if she doesn't know she's starving because the text is too hard, she dies anyway. Analysis is a luxury of the fed."

  "That's condescending."

  "It's survival." Lukas tucked the proof away. "You say the picture hides the ideology. I say the picture exposes the material condition. You want to dry-dock the ship. You want to wait until we have the perfect language, the perfect theory, before we speak. But Otto is right. We are at sea. The water is rising. We need a hull that floats, not one that is philosophically pure."

  "So we build with lies that look like truths."

  "We build with tools that can be used." Lukas turned back to the wall chart, running a hand over the surface where the blue icons stood in their rigid rows. "You say the icon erases the individual. I say it allows the individual to recognize herself in the collective. She sees the icon and says 'that is me.' She doesn't see her face, she sees her function. And because she sees her function, she sees where the function is cheated."

  Elara looked at the blue figure. It was simple, geometric, harmless. It was also incredibly powerful. She realized that was what frightened her. Not that it was false, but that it might work *because* it was false. It bypassed the critical mind and spoke directly to the eye.

  "If I change the icon," she said slowly, "if I give him a hammer instead of a blank hand... I've changed the argument."

  "Yes," Lukas said. "And you can do that tomorrow. We can reprint the chart. We can change the red arrow to blue. Try changing a dogma that quickly. Try changing a textbook."

  He had her there. The medium was mutable. But the mutability felt like a trap.

  "You're asking them to trust the designer," Elara said. "You've just moved the priesthood from the writer to the artist."

  "Then let them watch us work," Lukas said. "Let them see the sketches. The method is open. The counts are public. It is not a revelation. It is a calculation."

  Elara stepped back from the wall. The museum was quiet, the heavy Vienna dust settling in the shafts of afternoon light. Outside, the streets were getting louder, the political marches growing more frequent. They didn't have time for perfect truths.

  "It's a dangerous game, Lukas," she said. "Giving people pictures and telling them they are facts."

  "Giving people words and telling them they are facts is what got us here," he replied.

  Elara turned toward the door. She wanted to have the last word, to articulate why the simplification felt like a violence. But the image of the blue worker stayed in her mind. She could see how easily it could be used to calm a crowd, to make complex misery look manageable. But she could also see a woman pointing at it, angry, demanding the red block be smaller.

  She paused at the threshold, her hand on the cool wood of the frame.

  "Make sure the counts are public," she said. "If you're going to build the ship at sea, don't hide the blueprints."

  "They're on the desk," Lukas said.

  Elara nodded, once, and walked out into the corridor. The silence of the gallery remained, but the little blue men on the wall seemed to stand a little taller, or perhaps she just noticed the shadow they cast.
