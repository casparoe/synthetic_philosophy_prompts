  There is no single, universally accepted term that captures this configuration across all disciplines, but there are several converging concepts in systems theory, jurisprudence, and logic that describe specific facets of it. The phenomenon you have identified is most rigorously treated under the heading of **operational closure** (in systems theory) or the **paradox of constituent power** (in jurisprudence). In the philosophy of mind and logic, it is often referred to as a **tangled hierarchy**.

  Here is how these terms map onto the structure you described, and how they distinguish it from simple circularity or Gödelian self-reference.

  ### 1. Systems Theory: Operational Closure and Re-entry
  In social systems theory, particularly in the work of Niklas Luhmann, this configuration is described as **operational closure**. A system is operationally closed when it produces the elements that constitute itself using only its own elements. The "higher level" (the system's self-description or identity) is not outside the system; it is a construct generated *within* the system to maintain its coherence.

  The specific mechanism you describe—where the boundary is drawn by the system itself—is called **re-entry** (a term borrowed from G. Spencer-Brown). This occurs when a distinction (such as "constitutional vs. unconstitutional" or "safe vs. unsafe") is re-entered into the space of the distinguished side. The system observes itself using its own distinctions. The "inviolate core" corresponds to the system's **organisation** (in autopoietic theory), which remains invariant even as the system's **structure** changes. The organisation is dependent on the structure to exist, yet it dictates what structural changes are permissible. This fits your description of a core that is conceptually superior but mechanically dependent.

  ### 2. Jurisprudence: Constituent vs. Constituted Power
  In legal theory, this is the classic problem of **constituent power** (*pouvoir constituant*) versus **constituted power** (*pouvoir constitué*). The constituent power is the authority that creates the constitution; the constituted power is the authority created by the constitution (e.g., the parliament or the courts).

  The paradox arises when the constitution attempts to codify and limit the constituent power itself (via eternity clauses), effectively turning the constituent power into a constituted power. When a court derives its jurisdiction from the constitution to police the unamendable core of that same constitution, it is exercising **self-embracing sovereignty**. Scholars often refer to this as the **paradox of constitutionalism**. The "inviolate core" is the **constitutional identity**, which is treated as transcendent to ordinary politics but is enforced by institutions that are merely parts of that ordinary politics. This is not viewed as a logical failure in law, but as a necessary **fiction of validity** (similar to Kelsen's *Grundnorm*) that allows the system to function.

  ### 3. Logic and Philosophy: Tangled Hierarchy
  Douglas Hofstadter coined the term **tangled hierarchy** to describe systems where levels of abstraction loop back on one another without collapsing into simple circularity. In a standard hierarchy, level *n* controls level *n-1*, and is distinct from it. In a tangled hierarchy, moving up the levels leads you back to the bottom, yet the levels remain conceptually distinct to the observer.

  This distinguishes the pattern from **Gödelian self-reference**. In Gödel's incompleteness theorems, self-reference typically leads to undecidability or paradox (a statement that cannot be proven true or false within the system). In the configuration you describe, the system does not crash or become undecidable; it remains stable. The "loop" is not a logical error but a structural feature that sustains the system's identity. Hofstadter argues that this is how consciousness arises: the "self" feels like a higher-level controller, but it is implemented by the lower-level neurons it supposedly governs.

  ### Defining the Phenomenon
  If a precise umbrella term is required, the sharpest definition is **internally sustained transcendence** or **reflexive closure**.

  To define it rigorously, distinguishing it from ordinary hierarchy or vicious circularity, you would specify the following boundary conditions:

  1.  **Immanent Implementation:** The meta-rule (higher level) is executed using the operational capacity of the object-rule (base level). There is no external "god's eye" view enforcing the hierarchy.
  2.  **Asymmetric Dependence:** The higher level is ontologically dependent on the lower level (it cannot exist without the base machinery), yet normatively superior (it claims the authority to validate or invalidate the base).
  3.  **Protected Invariance:** There exists a subset of rules (the core) that is exempt from the revision procedures defined by the meta-rule, yet this exemption is enforced by the very revision procedures it limits.
  4.  **Functional Stability:** Unlike a vicious circle, this configuration does not lead to infinite regress or contradiction. Instead, the tension between the levels generates the system's stability and identity.

  ### Distinction from Related Concepts
  *   **Vs. Ordinary Hierarchy:** In an ordinary hierarchy, the higher level is genuinely external or independent (e.g., a human programmer editing code). In your pattern, the "programmer" is itself a program running within the code.
  *   **Vs. Vicious Circularity:** A vicious circle prevents resolution (A depends on B, B depends on A, therefore nothing exists). Your pattern is a **virtuous circle** or a **stable loop**: the interdependence sustains the existence of both levels.
  *   **Vs. Gödelian Self-Reference:** Gödelian loops typically expose limits (incompleteness). Your pattern exploits the loop to create **authority**. It is a pragmatic solution to the regress problem, not a logical proof of undecidability.

  In summary, while you may encounter terms like **autopoiesis**, **strange loops**, or **self-embracing sovereignty** depending on the field, the configuration is best understood as a system of **operational closure** that maintains a **tangled hierarchy** to sustain an **inviolate organisational core**.
