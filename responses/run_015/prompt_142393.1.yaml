  *(Self-Correction on Relativism):* The book claims "a community that hinges on astrology... is not making a mistake." Wittgenstein actually says (OC 513) that if someone believes the earth is young, we might call them a "fool" or "mentally disturbed," not just "different." I must emphasize this.

  *(Self-Correction on Conspiracy Theorists):* The book says "nothing we can rationally say." Wittgenstein implies we might have to treat them as outside the game, or try to change their *world-picture* through persuasion/missionary work, not proof.

