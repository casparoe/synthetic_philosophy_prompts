answer: |-
  This is a sharp question that cuts right to the tension between Russell's 1905 logic and modern two-dimensional semantics (like Kaplan's).

  The short answer is: **It fits as a natural extension only if you treat the parameter as part of the descriptive condition (the predicate), but it collapses Russell's core thesis if you treat the parameter as a semantic rule attached to the phrase itself.**

  Here is the breakdown of why that distinction matters for his framework.

  ### 1. The "Incomplete Symbol" Constraint
  Russell's central claim in *On Denoting* is that definite descriptions are **incomplete symbols**. They do not correspond to any single constituent in the final logical proposition. When you analyze "The present King of France is bald," the phrase "The present King of France" disappears. It gets unpacked into a quantificational structure:
  *   $\exists x (King(x) \land \forall y (King(y) \rightarrow y=x) \land Bald(x))$

  Because the phrase vanishes upon analysis, it cannot carry a semantic value (like a context-parameter) *independently* of the sentence. If you say the phrase *itself* carries a hidden parameter that shifts its denotation, you are effectively treating the phrase as a semantic unit that survives analysis. You are giving it a "meaning" (a function from contexts to individuals) in isolation, which is exactly what Russell denies.

  ### 2. Context as Predicate vs. Context as Rule
  There are two ways to handle your "hidden context-parameter":

  **Option A: The Parameter is part of the Predicate (Russellian)**
  You treat "present" or "current" as part of the descriptive condition $F$.
  *   "The current president" becomes "The $x$ such that $x$ is president at time $t$."
  *   Here, $t$ is supplied by the context of the utterance, but it is baked into the *propositional function*, not attached to the phrase.
  *   **Verdict:** This fits Russell. The phrase still has no meaning in isolation; the *sentence* expresses a proposition that is time-sensitive. The context helps determine which proposition is expressed, but the phrase itself remains an incomplete symbol.

  **Option B: The Parameter is a Rule of the Phrase (Kaplan-esque)**
  You treat the phrase as having a semantic rule: *In any context $c$, this phrase denotes the president at $c$'s time.*
  *   **Verdict:** This breaks Russell. This assigns the phrase a **character** (a stable meaning that yields different contents in different contexts). For Russell, the phrase has *no* meaning apart from the sentence. If you give it a rule that operates prior to the sentence's truth-conditions, you are treating it like a proper name or an indexical with independent semantic weight. This undermines the "no standalone meaning" claim.

  ### 3. The Problem with Primary and Secondary Occurrences
  This is where your specific worry about negation and scope becomes critical.

  Russell's distinction between primary and secondary occurrences relies on the description having **scope** relative to logical operators (like negation).
  *   **Secondary (Narrow Scope):** $\neg [\exists x (King(x) \land ... \land Bald(x))]$
      *   Translation: "It is not the case that there is a unique King of France who is bald." (True, because there is no King).
  *   **Primary (Wide Scope):** $\exists x (King(x) \land ... \land \neg Bald(x))$
      *   Translation: "There is a unique King of France, and he is not bald." (False, because there is no King).

  If you introduce a context-parameter that fixes the denotation *before* logical analysis (Option B above), you effectively force a **Primary Occurrence**.
  *   If the context parameter resolves "the current president" to "Biden" *before* you process the negation, the sentence becomes "Biden is not bald." The description has vanished into a name.
  *   You lose the ability to generate the secondary occurrence reading where the existence claim is part of what is being negated.

  For Russell to keep his scope distinction, the descriptive content (including the time parameter) must remain part of the logical form *inside* the scope of the operator. The context determines the proposition, but it shouldn't resolve the description to an individual *before* the logical structure is built.

  ### Conclusion
  Your intuition identifies a real fault line.
  *   If the context-parameter is just a variable in the predicate (e.g., $President(x, t_{now})$), it is a **natural extension**. Russell can accommodate indexicality without giving phrases standalone meaning.
  *   If the context-parameter is a semantic rule attached to the phrase (Character), it **collapses the framework**. It reifies the description as a meaningful unit, destroys the "incomplete symbol" doctrine, and threatens to eliminate the scope distinctions (primary/secondary occurrences) that Russell needs to solve puzzles about negation and existence.

  Russell wants the context to help select the *proposition*, not to give the *phrase* a semantic value. Keeping that order of operations is the only way to stay within his 1905 logic.
