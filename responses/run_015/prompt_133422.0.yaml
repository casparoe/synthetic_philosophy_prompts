answer: |-
  You are absolutely right to be suspicious. Your professor's slogan—"Secularism is just the state not picking favorites"—sounds like a common-sense definition, but in comparative law, it is a **loaded theoretical claim**. It conflates *neutrality* with *secularism* and assumes a specific version of neutrality that favors the German model over the French or American ones.

  Here is the conceptual map you need for seminar. It breaks down the slogan into precise claims, identifies which one saves the *Kirchensteuer*, and tests whether the slogan survives contact with other systems.

  ### I. The Menu of Claims
  When your professor says "not picking favorites," he could mean one of four things. They range from empty tautologies to controversial philosophical commitments.

  **1. The Trivial Claim (Non-Discrimination)**
  *   **Meaning:** The state cannot legally declare one specific sect (e.g., Lutheranism) as the *only* true religion while banning others.
  *   **Status:** **True but Weak.** Almost no modern state does this anymore.
  *   **Relevance to Tax:** This doesn't help the professor. Germany doesn't ban other religions; the argument is about *support*, not prohibition.

  **2. The Formal Claim (Procedural Neutrality)**
  *   **Meaning:** The rules apply equally on paper. If the state collects taxes for Catholics, it must offer the same mechanism to Protestants, Jews, etc., if they meet the criteria.
  *   **Status:** **Defensible.** This is the "blindfolded justice" model.
  *   **Relevance to Tax:** **This is the professor's primary shield.** He is arguing that because the *mechanism* is open to all qualified religious corporations, the state isn't picking a favorite *among* religions.

  **3. The Substantive Claim (Outcome Neutrality)**
  *   **Meaning:** The state's actions must not result in religion having more power, money, or influence than non-religion (or secular worldviews).
  *   **Status:** **Contested.** This requires looking at effects, not just rules.
  *   **Relevance to Tax:** **This kills the professor's argument.** If the state collects taxes for churches but *not* for secular ethical societies (or does so with much higher hurdles), the *outcome* is favoritism toward religion as a category.

  **4. The Positive Claim (Facilitative Neutrality)**
  *   **Meaning:** The state isn't just passive; it has a duty to create conditions where religious freedom can flourish. This might require active help (funding, tax collection) to ensure religions *can* function.
  *   **Status:** **Specific to German Constitutional Law.**
  *   **Relevance to Tax:** **This is the "Save."** It redefines "picking favorites" to mean "hostility." By this logic, helping churches isn't favoritism; it's fulfilling the state's duty to protect religious exercise.

  ---

  ### II. Formal vs. Substantive & Descriptive vs. Normative

  To dismantle the slogan in seminar, you need to separate these two axes.

  **1. Formal vs. Substantive Neutrality**
  *   **The Professor is arguing Formal Neutrality:** "We offer the tax service to everyone equally."
  *   **The Counter-Argument is Substantive Neutrality:** "But you only offer it to religious groups, not secular ones. And the administrative entanglement gives the state leverage over who counts as a 'church'."
  *   **The Trap:** The slogan hides the fact that *administrative help* is a form of *subsidy*. If the state collects my taxes for my chess club, that's a service. If it only does it for my church, that's establishment.

  **2. Descriptive vs. Normative**
  *   **Descriptive:** "Secularism *is*..." (Claiming this is what the word means historically).
  *   **Normative:** "Secularism *should be*..." (Claiming this is the ideal model).
  *   **The Smuggle:** Your professor is treating a **Normative** claim (Positive Neutrality is the *best* kind of secularism) as a **Descriptive** fact (This is *what* secularism is). This allows him to dismiss the French or US models as "not really secular" or "misunderstanding secularism" if they don't fit his definition.

  ---

  ### III. Which Reading Saves the *Kirchensteuer*?

  The professor is relying on a specific hybrid: **Formal Neutrality + Positive Neutrality.**

  *   **The Logic:**
      1.  **Formal:** We don't favor Catholic over Protestant (all can access the tax system).
      2.  **Positive:** We are not hostile to religion; we facilitate it (collecting the tax helps them survive).
      3.  **Conclusion:** Therefore, we are not "picking favorites."
  *   **The Vulnerability:** This definition excludes **Substantive Neutrality**. It ignores that by defining the "favorites" as *religious corporations* rather than *worldview corporations* (including secular ones), the state is picking a favorite **category**.
  *   **Seminar Point:** Ask: *"If 'not picking favorites' allows the state to collect taxes for churches but not for secular humanist groups, isn't the state picking 'religion' as the favorite category over 'non-religion'?"*

  ---

  ### IV. Does the Slogan Collapse Elsewhere?

  This is where you can show the slogan isn't universal. It works for Germany, but breaks in France and the US.

  **1. France (*Laïcité*)**
  *   **Verdict:** **The Slogan Collapses.**
  *   **Why:** French *laïcité* is not just about "not picking favorites." It is often about **secular supremacy** in the public sphere.
  *   **The Conflict:** In France, "not picking favorites" means the state ignores religion entirely to protect the public sphere from it. State collection of church taxes would be viewed as the state *becoming* the church's accountant, which violates the separation required to maintain neutrality.
  *   **Takeaway:** In France, "neutrality" = **Distance**. In Germany, "neutrality" = **Even-handed Support**. The professor's slogan pretends these are the same thing. They aren't.

  **2. United States (Establishment Clause)**
  *   **Verdict:** **The Slogan is a Battleground.**
  *   **Why:** The US Supreme Court has moved toward "Neutrality" (like the professor's view) in recent years (e.g., *Carson v. Makin*), but historically, "Entanglement" was a dealbreaker.
  *   **The Conflict:** Even if the state offered tax collection to *all* religions equally, the US would likely view the **administrative entanglement** (the state having a list of members, handling the money) as excessive involvement.
  *   **Takeaway:** In the US, "not picking favorites" isn't enough; you also can't get too cozy. The professor's claim that tax collection is "just administrative help" would likely fail the US *Lemon* test (or its modern equivalents) because it creates political divisiveness and entanglement.

  **3. England (Established Church)**
  *   **Verdict:** **The Slogan is False.**
  *   **Why:** England literally picks a favorite (the Monarch is the Supreme Governor of the Church of England; bishops sit in the Lords).
  *   **Takeaway:** If the professor's slogan were true, England wouldn't be a secular democracy. But we classify it as one. This proves "not picking favorites" is not a necessary condition for a modern liberal state, undermining his definition.

  ---

  ### V. Seminar Ammo (Questions to Ask)

  1.  **On Definition:** "When you say 'picking favorites,' are you talking about favoritism *among* religions (Catholic vs. Protestant) or favoritism *for* religion over non-religion? Because the *Kirchensteuer* seems neutral on the first but biased on the second."
  2.  **On Administration:** "If administrative help isn't favoritism, would the state be neutral if it collected dues for the Green Party but not the Conservative Party, as long as it offered the service to any party that met the threshold? Or is there something unique about religion that makes state collection different?"
  3.  **On Comparability:** "Does your definition of secularism mean France isn't secular? Because their version of 'not picking favorites' requires the state to refuse administrative help entirely, whereas our version requires giving it. Which one is the 'real' secularism?"
  4.  **On Positive Neutrality:** "Is 'Positive Neutrality' just a fancy way of saying 'Establishment Lite'? At what point does facilitation become endorsement?"

  **Summary for your notes:** The professor is defining secularism as **Non-Discriminatory Accommodation**. You are critiquing it from the perspective of **Substantive Separation**. The slogan works only if you accept that the state *should* support religion, provided it does so evenly. If you reject that premise, the slogan fails.
