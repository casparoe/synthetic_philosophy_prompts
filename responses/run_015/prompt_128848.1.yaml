  Based on the voting record and the specific precedents you have outlined, Dr. Alderton is not operating on a simple "commodification" or "paternalism" framework. Her record is too inconsistent for those. Instead, she appears to be running a hybrid principle I would call **"The Civic-Bodily Integrity Rule."**

  Here is the reconstruction of the machinery, the candidate rules, the prediction, and the decisive hypothetical.

  ### 1. The Machinery: "Compensated Burden vs. Priced Asset" within "Equal Access"

  Dr. Alderton distinguishes between **compensating a person for a burden** (permissible) and **pricing an asset or status** (forbidden). She further constrains this with a **Civic Equality** constraint: financial mechanisms cannot allow wealth to bypass shared queues for essential public goods.

  *   **Permissible (Burden/ Labor):**
      *   *Plasma:* Compensated as a collection service. (Override: "No alternative supply" creates a utilitarian necessity).
      *   *Eggs:* Capped flat rate. This signals "recognition of burden/risk," not "market value of genetics."
      *   *Drug Trials:* Payment for "time and burden," explicitly not for the biological data itself.
  *   **Forbidden (Asset/ Status/ Queue):**
      *   *Kidneys (Market):* Pricing a vital, non-regenerative organ asset.
      *   *Surrogacy:* Pricing gestational labor that creates a person (inalienable function).
      *   *Sterilization:* Pricing the permanent loss of function, specifically targeting the poor (violates equality).
      *   *Votes/ Museum Queues:* Pricing civic standing or access to public goods. This is the strongest signal: she opposes **queue-jumping** regardless of the good.

  **The Core Rule:** *Financial incentives are permissible only when they function as a fixed honorarium for temporary burden or risk, provided they do not create a market for vital bodily assets, do not target the vulnerable for permanent loss, and do not allow the purchase of priority access to essential public goods.*

  ### 2. Candidate Rules and Predictions

  Here are the three competing rules that fit her past verdicts, and how they predict her vote on the **Living-Donor Benefit Proposal**.

  | Candidate Rule | Logic | Prediction on Proposal | Why? |
  | :--- | :--- | :--- | :--- |
  | **A. The Anti-Market Rule** | She opposes private negotiation and brokers. | **YES** | The proposal is state-run, statutory, and has no price negotiation. It removes the "market" she voted against twice. |
  | **B. The Vital Organ Rule** | She opposes incentives for permanent, vital organ loss (Kidneys/Sterilization) but allows renewable/material (Plasma/Eggs). | **NO** | A kidney is a vital, non-regenerative organ. The annuity functions as a price for the organ, not just burden compensation. |
  | **C. The Civic Equality Rule** | She opposes using money to alter queue positions for public goods (Museums/Votes). | **NO** | The **Family Credit** allows a donor to move a relative up the waiting list. This is functionally identical to reselling a museum queue position. |

  ### 3. The Best Guess: Rule C (Civic Equality) + Rule B (Vital Organ)

  **She will likely vote NO.**

  While the absence of a private market (Rule A) addresses one of her concerns, the proposal trips two of her harder wires:
  1.  **The Family Credit (The Museum Precedent):** This is the strongest evidence in her record. She explicitly prohibits reselling queue positions for free public museums. A government-run kidney waitlist is a public good allocation. Allowing a donor to transfer priority to a relative is a "transferable queue position." To her, this corrupts the equality of the waiting list just as selling a museum ticket does.
  2.  **The Annuity (The Vital Organ Precedent):** While framed as a "benefit," a 20-year annuity for a kidney looks less like "compensation for time" (drug trials) and more like "payment for an asset" (kidney market). Since dialysis exists as an alternative (unlike plasma), her "Necessity Override" does not trigger.

  **Which parts of her record are doing the work?**
  *   **High Weight:** The **Museum/Queue Jumping** vote and the **Kidney Market** vote. These establish the boundaries of "Public Allocation" and "Vital Organs."
  *   **Low Weight:** The **Plasma** vote. This is a specific utilitarian exception ("no alternative") that does not apply here (dialysis exists). The **Egg** vote is distinguishable because eggs are capped/flat-rate and regenerative/potential, not a vital organ removal.

  ### 4. The Decisive Hypothetical

  To separate Rule B (Vital Organ) from Rule C (Civic Equality/Queue Jumping), you need to isolate the **Family Credit** from the **Organ Type**.

  **The Hypothetical:**
  > "Dr. Alderton, imagine we keep the annuity and insurance, but we remove the transferable family credit. Instead, the donor receives a **'Reciprocal Priority Card'**: if *they* ever develop kidney failure in the future, they move to the front of the line. It is non-transferable, strictly insurance against their own risk.
  >
  > Does the objection remain? Or was the **transferability** to a third party the violation of civic equality?"

  **Why this works:**
  *   **If she says YES (Permissible):** Her primary objection is **Third-Party Leverage/Coercion** (family pressure) or the "sale" of a relative's health. It suggests the "Queue Jumping" rule has an exception for self-insurance.
  *   **If she says NO (Impermissible):** Her primary objection is **Incentivizing Vital Organ Loss**. It confirms that *any* benefit package tied to kidney donation is impermissible, regardless of queue mechanics. This solidifies the "Vital Organ" rule over the "Civic Equality" rule.

  **Alternative (The Bone Marrow Test):**
  If you prefer to test the **Bodily Integrity** rule against the **Necessity** rule (Plasma exception):
  > "If this exact package were offered for **Bone Marrow** donation—regenerative, lower risk, but still with the family credit for a relative with leukemia—would you vote yes?"
  *   **Yes:** Her rule is about **Permanent/Vital Loss** (Kidneys are unique).
  *   **No:** Her rule is about **Financial Incentives in Allocation** (The benefit package itself is the problem).

  **Recommendation:** Use the **Reciprocal Priority Card** hypothetical. It directly addresses the novel "Family Credit" feature of the proposal and pits her **Museum/Queue** precedent against her **Drug Trial/Compensation** precedent. It forces her to clarify if the sin is *buying priority* or *buying priority for someone else*.

  ### 5. Summary for the Profile

  *   **The Principle:** She is a **Structural Egalitarian**. She tolerates individual financial transactions (plasma, eggs) only when they do not aggregate to undermine equal access to essential goods (queues, votes, vital organs).
  *   **The Vote:** **No.** The Family Credit is a "queue-jumping token," which violates her museum ticket precedent. The Annuity prices a vital organ, which violates her kidney market precedent.
  *   **The Question:** Ask her if **self-insurance priority** (donor gets queue jump if *they* get sick) is morally distinct from **family credit priority** (relative gets queue jump). This reveals whether her core commitment is to **Market Integrity** (no buying priority) or **Anti-Coercion** (no family leverage).
