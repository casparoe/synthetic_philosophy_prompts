  While my credence that *Kant's essay* permits your lie is low (24%), the credence that *Kantian Ethics* (as a living tradition) permits it is significantly higher. Most contemporary Kantians argue that protecting your roommate's physical safety preserves the conditions necessary for rational agency, which is the ultimate goal of the Categorical Imperative. You likely violated a strict reading of the 1797 essay, but you arguably upheld the deeper principle of respecting humanity.
