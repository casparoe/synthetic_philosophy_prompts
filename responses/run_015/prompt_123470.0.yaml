  If a previously unstudied marginalia or lecture transcript from Kant's later period surfaced clarifying that he distinguished between a *formal declaration* (owed to the state/contract) and *private speech* (owed to friends), Term (1) would jump from 35% to 80%. This would shift the final credence above 60%. Currently, we lack definitive proof that Kant intended *Aussage* to be a technical legal term in this specific essay rather than a synonym for truthful speech.

