answer: |-
  # Desiderata for a Theory of Simmball-Careenium Interaction

  The following specification outlines the criteria of adequacy for any theoretical account attempting to resolve the causal status of simmballs within the careenium framework. These desiderata are organized by phenomenological coverage, ontological distinction, dynamical consistency, and logical coherence. Each item includes the motivating consideration, its modal status (non-negotiable vs. camp-specific), and the specific conceptual tension it addresses.

  ## I. Phenomenological Adequacy
  *A theory must account for the observable behaviors of the system without dismissing them as illusions, unless explicitly arguing for an error theory.*

  ### 1. The Trajectory Deviation Criterion
  *   **Specification:** The theory must explain instances where the application of a symbolic rule (simmball configuration) appears to redirect the careenium's evolution away from its immediate local physical attractor toward a state dictated by logical consistency or syntactic validity.
  *   **Motivating Case:** A computational system correcting an error. The substrate dynamics (voltage flows, particle movements) might naturally decay toward equilibrium (noise), but the symbolic structure forces a transition to a high-energy, low-entropy state to maintain logical validity.
  *   **Status:** **Non-negotiable** for Interactionists and Emergentists; **Negotiable** for Epiphenomenalists (who may argue the deviation is illusory or pre-determined by substrate micro-structure).
  *   **Tension Flag:** High tension with *Substrate Causal Closure*. If the careenium is closed, the "redirect" must have been physically determined all along, rendering the symbolic rule descriptive rather than efficacious.

  ### 2. The Substrate Vulnerability Criterion
  *   **Specification:** The theory must account for cases where substrate noise or instability disrupts symbolic stability without altering the abstract rule itself.
  *   **Motivating Case:** Hardware corruption. A simmball representing a specific proposition ceases to be instantiated or becomes garbled due to careenium turbulence, even though the "rule" it was instantiating remains valid in the abstract.
  *   **Status:** **Non-negotiable** (All camps agree symbols depend on substrate stability).
  *   **Tension Flag:** Low tension. This supports supervenience but does not decide the direction of causation.

  ### 3. The Causal Grading Criterion
  *   **Specification:** The theory must accommodate differences in causal "weight" or stability across different kinds of simmballs. Not all symbolic configurations should exert the same influence (or appear to exert the same influence) on the substrate.
  *   **Motivating Case:** Complex self-referential loops (deep simmballs) appear more robust and capable of steering larger regions of the careenium than transient, shallow symbolic patterns.
  *   **Status:** **Camp-Specific Preference** (Functionalists require this; strict Reductionists may deny the gradient is real, viewing it as uniform substrate complexity).
  *   **Tension Flag:** Moderate tension with *Substrate Autonomy*. If the substrate is uniform in its causal powers, the "grade" must be an emergent property of configuration, not intrinsic power.

  ## II. Ontological and Conceptual Distinctions
  *A theory must preserve key distinctions to avoid collapsing the framework into triviality.*

  ### 4. The Non-Reducibility Constraint
  *   **Specification:** The theory must preserve the distinction between local substrate perturbation and global symbolic restructuring. It must explain how a simmball can be mapped onto a region of the careenium without being reducible to the specific micro-state of that region.
  *   **Motivating Consideration:** Multiple Realizability. The same simmball (symbolic state) should be instantiable across different careenium micro-states without losing its identity.
  *   **Status:** **Non-negotiable** for Functionalists and Emergentists; **Rejected** by Type-Identity Physicalists.
  *   **Tension Flag:** High tension with *Strict Substrate Autonomy*. If the simmball is not reducible, yet has causal power, it risks becoming a "ghost" variable not accounted for in the substrate equations.

  ### 5. The Correlation-Causation Boundary
  *   **Specification:** The theory must provide a mechanism or logical argument to distinguish between simmballs merely tracking substrate changes (correlation) versus simmballs initiating substrate changes (causation).
  *   **Motivating Consideration:** The risk of the "Common Cause" fallacy. Both the symbolic state and the subsequent substrate movement might be caused by prior substrate states, making the symbol a passive passenger.
  *   **Status:** **Non-negotiable** (Any robust theory must define its stance on this).
  *   **Tension Flag:** Critical. Failure here collapses the framework into Epiphenomenalism.

  ### 6. The Embedding Strength Distinction
  *   **Specification:** The theory must distinguish between *weak embedding* (the symbol is a pattern recognized by an external observer) and *strong downward determination* (the symbol actively constrains substrate degrees of freedom).
  *   **Motivating Consideration:** Avoiding the "homunculus" problem. If the careenium doesn't "know" it's instantiating a simmball, how does the simmball constrain it?
  *   **Status:** **Camp-Specific Preference** (Interactionists require strong determination; Descriptivists accept weak embedding).
  *   **Tension Flag:** High tension with *Dynamical Consistency*. Strong determination implies the substrate obeys laws not native to its own physics.

  ## III. Dynamical and Physical Consistency
  *A theory cannot violate established constraints regarding unstable dynamical media.*

  ### 7. Conservation and Continuity Compliance
  *   **Specification:** Any proposed downward causal mechanism must not violate conservation laws (energy, momentum, information) applicable to the careenium.
  *   **Motivating Consideration:** If simmballs push the careenium around, where does the energy come from? "Magic" is not an acceptable explanatory primitive.
  *   **Status:** **Non-negotiable** (Scientific naturalism constraint).
  *   **Tension Flag:** High tension with *Robust Downward Causation*. It is difficult to show how abstract logic moves physical matter without energy transfer, which symbols ostensibly lack.

  ### 8. Sensitivity to Initial Conditions (Chaotic Consistency)
  *   **Specification:** The theory must respect the non-linearly unstable nature of the careenium. Small symbolic interventions should not require disproportionately large physical inputs if the system is near a bifurcation point, but cannot exploit this to violate macroscopic predictability.
  *   **Motivating Consideration:** The "Butterfly Effect." Simmballs might act as control parameters that nudge the system at critical junctures rather than brute-forcing state changes.
  *   **Status:** **Non-negotiable**.
  *   **Tension Flag:** Moderate. This offers a potential path for *Downward Causation* (control via instability) but limits the *scope* of that causation to specific unstable regions.

  ## IV. Logical Coherence and No-Go Results
  *A theory must navigate known metaphysical exclusion arguments.*

  ### 9. The Causal Exclusion Avoidance
  *   **Specification:** The theory must explicitly address the Causal Exclusion Argument: If every careenium state $C_1$ is causally sufficient for $C_2$, and Simmball $S_1$ supervenes on $C_1$, then $S_1$ is causally redundant.
  *   **Motivating Consideration:** Overdetermination. We cannot have two sufficient causes (substrate and symbol) for one effect without implying systematic coincidence.
  *   **Status:** **Non-negotiable** (Must be addressed, even if by rejection of premises).
  *   **Tension Flag:** **CRITICAL TENSION.** This is the primary no-go zone.
      *   *To satisfy Substrate Closure:* You must accept Epiphenomenalism.
      *   *To satisfy Downward Causation:* You must deny Substrate Closure (Interactionism) or redefine Causation (Non-reductive Physicalism).
      *   *You cannot have both Substrate Closure and Robust Downward Causation without logical contradiction.*

  ### 10. The Semantic Closure Condition
  *   **Specification:** If simmballs are self-referential, the theory must explain how the careenium processes semantic content without a semantic interpreter external to the system.
  *   **Motivating Consideration:** The symbol must "mean" something to the careenium to direct it, but the careenium is defined as non-symbolically structured.
  *   **Status:** **Camp-Specific Preference** (Crucial for Strong AI/Functionalism; irrelevant for Epiphenomenalism).
  *   **Tension Flag:** High tension with *Substrate Autonomy*. It requires the substrate to be sensitive to semantic properties, which are typically considered extrinsic.

  ---

  # Summary of Tensions and Theoretical Viability

  The central architectural conflict in this framework is the **Exclusion Dilemma** (Desideratum 9). It renders the joint satisfaction of *Substrate Causal Closure* (implied by Desideratum 7) and *Robust Downward Causation* (implied by Desideratum 1) logically unsatisfiable under standard definitions of causation.

  *   **Strict Substrate Autonomy (Physicalism):** Satisfies Desiderata 2, 7, 8, 9. Fails Desiderata 1, 3, 6. It renders simmballs epiphenomenal patterns.
  *   **Strong Interactionism (Dualism/Substance Pluralism):** Satisfies Desiderata 1, 3, 6. Risks violating Desideratum 7 (Conservation) and 9 (Exclusion). It posits simmballs as distinct causal agents.
  *   **Non-Reductive Emergentism:** Attempts to satisfy all by redefining causation (e.g., via realization or constraint). It often struggles with Desideratum 9, frequently accused of "causal drainage" where the real work is always done by the substrate.
  *   **Compatibilist/Constraint-Based Views:** Attempt to satisfy Desideratum 8 (Chaotic Consistency) to argue that simmballs act as *boundary conditions* rather than *energy sources*. This is the most promising path for satisfying Desiderata 1 and 7 simultaneously, though it requires a nuanced definition of "causation" that distinguishes *structuring causes* from *triggering causes*.

  Any viable theory must explicitly state which desiderata it sacrifices to resolve the Exclusion Dilemma, or provide a novel metaphysics of causation that dissolves the contradiction between Desideratum 1 and Desideratum 9.
