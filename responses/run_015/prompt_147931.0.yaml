  5.  **Address the Specific Questions:**

      *   *Which rule fits?* A hybrid of **Negative Utilitarianism** (suffering reduction > happiness creation) and **Epistemic Agnosticism** regarding the net value of wild life.
      *   *Marsh Prediction:* Likely **Oppose**. The explosion of r-strategists (high mortality) is a red flag for WAS advocates.
      *   *Number vs. Quality:* She is committed to *Number* in the Rat case (fewer rats = good). She is committed to *Quality* in the Rabbit case (vaccinate to reduce suffering). The Marsh increases Numbers with uncertain Quality. Given the Rat precedent, she likely views high-turnover populations as net negatives.
      *   *Epistemic View:* It coheres. If $V(\text{life})$ is unknown but has a significant probability of being $<0$, then $E[\text{Total Value}]$ decreases as $N$ increases.
      *   *Scrub vs. Rats Consistency:* Consistent if the moral weight of killing existing animals is outweighed by the reduction of future suffering in the Rat case (where rats are pests/suffering), but not outweighed by human housing in the Scrub case.
      *   *Solar Array:* She would likely view it more favorably than the Marsh. It separates the rules because it reduces capacity without the "killing" objection of the Scrub case and without the "population explosion" objection of the Marsh case.
      *   *Evidence Needed:* She needs data on **causes of death** and **welfare balance**. Mortality rates, predation stress, disease prevalence. She needs to know if the "better shelter" actually translates to net positive welfare or just slightly less negative welfare.

