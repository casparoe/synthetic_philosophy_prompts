answer: |-
  The archive air was cold, smelling of dust and ozone. Dr. Beata Rell sat behind a desk piled with computation logs, an oxygen tube taped to her cheek. Anselm Kraul stood by the stacks, coat still damp from the cliff rain.

  **Rell:** You should not have come back, Anselm. The Asperity is far, and the air here is recycled.

  **Kraul:** The jury convenes at dawn. They vote on the Disclosure Rule. I needed to know if you still believe it works.

  **Rell:** Believe? It is data. At eighteen, we show them the mechanics. We show them how their allotment is calculated, which variables are tweaked to ensure contentment. They know the hand that feeds them. And they stay. Compliance rises after disclosure.

  **Kraul:** Because you teach them that resistance is inefficient. You show them the cage bars and tell them the steel is for their safety. That isn't consent, Beata. It is grooming.

  **Rell:** It is honesty. The old legend—the one we built this on—said the miracle of freedom was too heavy. The Cardinal understood that men would trade liberty for bread if someone else carried the burden of choice. We simply make the trade explicit.

  **Kraul:** The legend also said the Cardinal acted in the name of the spirit who offered the stones. You know that. You taught me that. By making the manipulation visible, you do not cleanse it; you institutionalize the temptation. You ask them to worship the machine because it works.

  **Rell:** Because it prevents the burning. Look at the history before the Office. Freedom meant starvation for the weak. We removed the hunger. The Disclosure Rule ensures they know it is a gift, not a right.

  **Kraul:** A gift implies a giver. You make the state the provider. What happens to the soul that needs to struggle? You say the Preserve Clause handles that. You fund us in the Asperity. You let us refuse.

  **Rell:** Exactly. We do not crush the strong. We honor them. We give you the cliffs and the funds to live your dangerous life. The system is not a prison; it is a managed whole. The many have peace; the few have freedom. Everyone is accounted for.

  **Kraul:** You pay us to be your conscience so you do not have to be. The Preserve Clause is a zoo enclosure. You keep the lions behind glass so the sheep can sleep soundly, knowing the lions are fed by the sheep's wool. It neutralizes the threat of true dissent.

  **Rell:** It preserves the possibility of dissent! Without the Office, the lions would eat the sheep. With us, the lions survive, and the sheep survive. Is that not a moral victory? The Cardinal was accused of loving men too little. I say he loved them enough to spare them the fire.

  **Kraul:** He stole the fire to keep them warm. You speak of the sheep. I speak of the child who looks at the Disclosure log and learns that their happiness is a computed variable. You kill the capacity for surprise. You kill the chance of sainthood.

  **Rell:** (She coughs, adjusting the tube) Sainthood is a luxury of the secure. Most people do not want to be saints. They want to sleep without fear. I built this so they could sleep.

  **Kraul:** And if they want to wake?

  **Rell:** Then they go to the cliffs. We pay for their boat.

  **Kraul:** You pay for our exile. Beata, listen to me. The Disclosure Rule must fall. Not because it hides the truth, but because it makes complicity a civic duty. When I sign that log at eighteen, I am not agreeing to live; I am agreeing to be managed.

  **Rell:** (She leans forward, eyes bright) Then concede this. The Asperity exists only because the Office generates the surplus. Your freedom on the cliffs is subsidized by the compliance of the valley. If the Rule falls, compliance drops. The surplus vanishes. Your cliffs go dark. Can you bear that blood?

  **Kraul:** (He looks down at his boots) We would starve. Yes. I concede it. The Asperity is parasitic. We eat the bread you bake. We claim moral superiority while warming ourselves by your furnace.

  **Rell:** Then keep the Rule. Acknowledge the cost.

  **Kraul:** But you must acknowledge yours. You say you spare them the fire. But you also spare them the light. You have created a world where no one ever has to choose the hard right over the easy wrong, because the wrong is removed. You have saved them from sin by removing virtue.

  **Rell:** (She sits back, the energy leaving her) I know. I have always known. We bought peace with potential. I look at the logs and I see contentment. But sometimes, in the silence of this archive, I wonder if we have built a graveyard of spirits. I concede that. We have secured their lives by stagnating their souls.

  **Kraul:** Then why defend it?

  **Rell:** Because the alternative is the burning. I would rather they be stagnant than ash. The jury votes at dawn. They will see your concession—that you need us. They will see mine—that we kill something sacred.

  **Kraul:** They will see that the Disclosure Rule is a mirror. It shows them exactly what they are willing to sell.

  **Rell:** And what they are willing to buy. Go now, Anselm. The air is too thin for both of us.

  **Kraul:** Will you be here for the count?

  **Rell:** I will be here. The logs require signing. Someone must account for the peace.

  **Kraul:** Or the price of it.

  **Rell:** Go. Let them vote.

  Kraul turned to the door. The wind howled outside, sounding like voices from the cliff settlement. Rell picked up her pen, hovering over the master ledger. The ink waited, dark and final.

