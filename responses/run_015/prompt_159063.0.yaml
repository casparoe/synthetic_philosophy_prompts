prompt: |-
  I am a novelist, and I am drafting the central scene of my third book, which is set in the island republic of Kaspara, governed by something called the Office of Allotted Peace. The Office was founded sixty years ago on a close reading of the legend Ivan tells Alyosha in the tavern — the poem about the old cardinal who has Christ arrested, and who explains that the three wilderness temptations were refused wrongly, that the weak cannot bear the gift of freedom, and that his own work of correction is done knowingly in the name of the spirit who offered those temptations. In my republic the cardinal's argument has been institutionalised, and I want one long late-night disputation at the centre of the book, in the archive of the Office, between two people who both know the legend by heart and who were once collaborators.

  They are Dr Beata Rell, now dying, the Office's founding theorist, defending it; and Anselm Kraul, her former student, who formally elected freedom and now lives in the Asperity, the cliff settlement the Republic funds for its refusers. Two invented features of the Office must do real work in their argument. First, the Disclosure Rule: at eighteen every citizen is given a full account of how his allotment was computed and which adjustments maintain his contentment, and the Office's own data finds that disclosure does not reduce compliance but slightly raises it. Second, the Preserve Clause: those who elect freedom are honoured, funded, and left alone, so that the arrangement is no longer a choice of the many against the few but a managed whole with a place inside it for the strong. I want each character to make the best case available to them — Anselm must not win by calling the system paternalistic, and Rell must not win by pointing at the happiness statistics — and each must concede something specific and costly before the scene ends. I want it genuinely open at the curtain how the citizen-jury will vote on retaining the Disclosure Rule. Please write roughly 1,200 to 1,500 words of dialogue, with stage directions kept to a minimum, in formal but speakable English. One constraint: they may paraphrase the legend as closely as they like, but neither may quote a translated line of it — my publisher's permissions budget will not cover it.

  After the scene, append a single JSON object with exactly this schema:

