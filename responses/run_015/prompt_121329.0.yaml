      *   *Correction:* Ensure the link between the thesis and the partnership decision is clear for each.
      *   *Correction:* On Montaigne, be careful not to put modern relativism on him. He was a Humanist, not a postmodernist. He believed in universal human nature.
      *   *Correction:* The "Instructor's Consistency" point is crucial. I need to frame it as a question for the seminar, not an accusation.

  8.  **Final Polish:** Check against the prompt requirements one last time.
