prompt: |-
  I am a high school student preparing a response for an ethics seminar in which our instructor cited Montaigne's claim that people habitually label as barbarism whatever differs from their own customs, using it to defend a proposed exchange partnership with a school that practices ritual public shaming for academic failure. Before I reply, I need the slogan disambiguated into its precise possible meanings. Please lay out the distinct theses it could express — a descriptive psychological generalization, a comparative claim about the equivalence of all customs, and a normative prohibition on cross-cultural judgment — and for each indicate whether it is trivial, defensible, or false, and whether that specific version actually supports accepting the partnership. Then address whether Montaigne's essay on cannibals endorses the normative version or only the descriptive one, and whether the parts of the slogan that collapse under precise formulation reveal that the argument is relying more on rhetoric than on a substantive philosophical position. I need this broken into a clear menu I can use in class, with particular attention to whether the instructor's reading commits her to accepting practices she would condemn in her own institution.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** High school student preparing for an ethics seminar.
      *   **Context:** Instructor cited Montaigne ("people habitually label as barbarism whatever differs from their own customs") to defend an exchange partnership with a school that uses *ritual public shaming for academic failure*.
      *   **Task:** Disambiguate the slogan into distinct theses (Descriptive, Comparative, Normative). Evaluate each for truth/triviality/defensibility and whether it supports the partnership. Analyze Montaigne's actual essay ("Of Cannibals"). Assess if the argument relies on rhetoric over substance. Check for consistency (would the instructor accept this locally?).
      *   **Format:** Clear menu for class use.
      *   **Tone:** Academic, rigorous, appropriate for a high school ethics seminar (sophisticated but accessible).

  2.  **Deconstruct the Slogan:**
      *   *Slogan:* "People habitually label as barbarism whatever differs from their own customs." (Paraphrase of Montaigne).
      *   *Goal:* Break this down into three specific philosophical claims as requested.
          1.  Descriptive Psychological Generalization (People *do* judge others).
          2.  Comparative Claim (All customs are *equally* valid/barbaric).
          3.  Normative Prohibition (We *should not* judge others).

  3.  **Evaluate Each Thesis:**

      *   **Thesis 1: Descriptive Psychological Generalization.**
          *   *Claim:* Humans have a cognitive bias to view their own culture as standard and others as deviant.
          *   *Status:* Defensible/True (Ethnocentrism is well-documented). Not trivial (it's an insight into human psychology).
          *   *Supports Partnership?* No. Just because we *do* judge doesn't mean we *shouldn't*, or that the practice is okay. It explains resistance, doesn't justify the practice.

      *   **Thesis 2: Comparative Claim (Moral Equivalence).**
          *   *Claim:* All customs are functionally equivalent; "barbarism" is purely relative, so shaming is no worse than our methods.
          *   *Status:* False/Highly Controversial. Some practices cause harm (public shaming vs. private grading). Not all customs are equal in outcome.
          *   *Supports Partnership?* Yes, *if* true. If shaming is "just different," then accept it. But it's hard to defend.

      *   **Thesis 3: Normative Prohibition.**
          *   *Claim:* We *ought not* to judge other cultures by our standards.
          *   *Status:* Defensible in some contexts (humility), but problematic in others (human rights).
          *   *Supports Partnership?* Yes, *if* accepted. It forbids us from calling shaming "wrong."
          *   *Risk:* Leads to moral paralysis.

  4.  **Analyze Montaigne's "Of Cannibals":**
      *   *What did he actually say?* He argued that the Tupinambá (who practiced ritual cannibalism) were not "barbarians" in the moral sense, often behaving more virtuously than Europeans (who tortured each other during religious wars).
      *   *Descriptive or Normative?* He uses the descriptive observation (we call them barbarians because they are different) to launch a *normative* critique of European arrogance. However, he doesn't say *anything* goes. He appeals to universal reason/nature. He condemns torture/betrayal regardless of culture.
      *   *Relevance to Shaming:* Montaigne valued honor and shame, but also mercy. He criticized *cruelty*. Public shaming for academic failure might strike him as petty cruelty compared to the "barbarism" of European religious violence.
      *   *Conclusion:* Montaigne supports the descriptive claim to undermine arrogance, but he does *not* support a "anything goes" moral relativism. He judges based on reason/nature.

  5.  **Address the "Rhetoric vs. Substance" & Instructor's Consistency:**
      *   *Rhetoric:* Using Montaigne to shut down criticism is a rhetorical move (appeal to authority + guilt-tripping about ethnocentrism).
      *   *Substance:* The argument collapses if pushed. If "barbarism is just difference," then we can't condemn slavery, genocide, etc., if they are "customs."
      *   *Instructor's Consistency:* Would the instructor accept public shaming *here*? If not, why is it okay there? This reveals the "Normative Prohibition" is likely not held consistently. It exposes a double standard or a weak argument.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Structure:* Introduction -> The Menu of Theses (1, 2, 3) -> Montaigne's Actual View -> The Rhetoric Check -> The Consistency Check -> Conclusion.
      *   *Tone Check:* Ensure it empowers the student to speak up respectfully but critically. Avoid being overly aggressive, but be firm on the logic.
      *   *Specific Constraint:* "High school student." Keep language precise but not overly jargon-heavy. Explain terms like "normative" and "descriptive."
      *   *Specific Constraint:* "Menu I can use in class." Use bullet points or numbered lists.

  7.  **Refining the Content (Self-Correction during drafting):**
