answer: |-
  Good evening. For those who don't know me, I'm one of the graduate students in the History and Philosophy of Science department. My chair asked me to speak for ten minutes. I understand this stands between you and dinner, so I have taken this as a strict constraint on both length and abstraction. I also know there are people in this room who have edited Turing's papers, and people who have funded this new lab, and I am acutely aware that I am the person with the least tenure standing between those two groups. So I will be careful.

  We are here to celebrate Alan Turing's birthday, and to mark the launch of this new AI laboratory. Usually, when we talk about Turing's 1950 paper on computing machinery and intelligence, we talk about the imitation game. We talk about the question: Can machines think? But I want to talk about a section near the end of that paper that often gets overlooked. It is not a footnote. It is a numbered section, right there in the text, and it deals with something that makes modern scientists very uncomfortable: extrasensory perception.

  Here is the situation Turing describes. He looks at the statistical evidence available to him at the time regarding telepathy, clairvoyance, and psychokinesis. He concludes that the data looks strong. He says, more or less, that he expected scientists to dismiss these phenomena out of hand, but he was surprised to find they did not. To him, the numbers suggested these things were real.

  Now, I am not going to stand here and tell you that telepathy is real. It isn't. And I am not going to tell you that Turing was being credulous or mystical. He was being an empiricist. He looked at the data he had, and he followed where it led. He was wrong about the world, but he was right about how to handle being wrong.

  Because here is what he does next. He doesn't ignore ESP because it's awkward. He doesn't sweep it under the rug to save his theory. Instead, he asks a devastatingly practical question: If telepathy is real, what does it do to the imitation game?

  He realizes that if the human competitor can read the interrogator's mind, or if the machine cannot, then the human has an information channel that the machine does not. The test is no longer measuring intelligence; it is measuring psychic ability. The score means nothing. So, Turing proposes a solution. He says the game must be run in a shielded room, built to whatever standard the telepathy researchers themselves would accept. He treats ESP not as a threat to his thesis, but as a threat to the validity of his test. And he protects the test.

  This is the moment I want us to sit with. It is easy to look back and say, "Well, he was wrong about the telepathy." It is much harder to see what he got right. He understood that the integrity of an experiment depends on controlling the flow of information.

  For the computer scientists in the room, this should feel familiar. I won't use your jargon, but you know the problem. It is the moment when a system under evaluation gets hold of information the evaluation was never supposed to hand it. Imagine you are testing a student on their math ability. But unbeknownst to you, the student has found a way to hear the answers whispering from the teacher's mind. If the student gets a perfect score, you haven't proven they are good at math. You've proven the test was leaky. Turing saw that if you don't seal the leaks, the result is meaningless.

  He was willing to complicate his own beautiful idea to make sure it was robust. He found the implications of ESP disturbing. He wrote that they were too disturbing to sit with easily. But he sat with them anyway. He didn't let the discomfort stop the inquiry. He let the discomfort refine the method.

  This is why I am comfortable standing here, as a historian, talking to the donors and engineers funding this new lab. I know what the chair asked me to say. He told me to make you feel good about the cheque. And I can do that, honestly, because this is what Turing models for us. It is not about being right about everything. It is about being rigorous about the questions.

  The work of this new laboratory will not be about magic. It will not be about pretending machines are human when they are not. It will be about building the shielded room. It will be about ensuring that when we evaluate these systems, we know exactly what is being measured. It is about protecting the integrity of the test against the things we don't understand, the things that might be disturbing, or the things that might leak in from the outside.

  There are people in this room who disagree about whether machines can think. There are people who disagree about whether Turing was right about the future. We do not need to resolve those disagreements tonight. We don't need to resolve them ever. What we need to agree on is the standard of the testing. We need to agree that when we build something powerful, we owe it to ourselves to test it honestly. We owe it to ourselves to build the shielded room.

  Turing's legacy isn't just the idea of the machine. It is the discipline of the test. It is the willingness to say, "If there is a variable I haven't accounted for, even a frightening one, I will account for it before I claim a result."

  So, when you look at the work coming out of this new lab, don't just ask if the results are impressive. Ask if the room was shielded. Ask if the information flow was controlled. Ask if the test was hard enough to actually mean something.

  That is how you honor Alan. Not by pretending he was infallible. He wasn't. He thought telepathy was real. But he cared more about the truth of the method than the comfort of the conclusion.

  We have the historians here to keep us honest about what he said. We have the engineers here to build what he imagined. And we have the donors here to make sure the lights stay on while we do the work. That is a good ecosystem. That is a good reason to open a lab.

  So, if I could ask you to raise a glass. To Alan Turing. Not because he got everything right, but because he taught us how to find out when we're wrong. And to the new lab. May it be a place where the questions are hard, the tests are rigorous, and the room is always shielded.

  Happy Birthday, Alan. Thank you.
