prompt: |-
  I am writing the requirements section of an internal methods document for a public agency that is about to procure a risk-scoring system, and I want to settle what I am asking of a fairness criterion before I go back to looking at candidate criteria. Please give me the specification rather than a survey: no literature review, no citations, no paper titles, no named theorems. I have read the standard results. What I want is the list of requirements whose joint unsatisfiability those results are actually about, the considerations that make each requirement compelling in the first place, and your view on which of the things people in this field demand are genuine desiderata and which are the preferences of one camp.

  The setting, so that adequacy has something to be relative to. The agency administers a scarce and beneficial intervention — imagine a home-visiting nurse programme with more eligible families than places — and it ranks applicants using a risk score bought from a vendor who will disclose the score and nothing about the model. Two features of this setting matter to me and I do not want them treated as footnotes. First, the agency observes the outcome the score predicts only for the families it actually enrols; for everyone else the label is missing, and missing in a way the agency's own past decisions produced. Second, enrolment is not inert: it changes the outcome, and it changes who appears, with which label, in the data the agency will use to re-fit or re-contract the score next year.

  Then the ask. Write the desiderata a fairness criterion for this score would have to meet: the cases it must get right, the distinctions it must respect rather than collapse, the facts about the deployment it must be consistent with, and — the part I care about most — the requirements that are added by the two features above and that a criterion designed for a one-shot classifier with complete labels need not face at all. For each requirement, give the concrete case or consideration that motivates it, stated in this setting rather than in the abstract. There are particular places where I suspect requirements are hiding and where I want you to look: what a criterion can demand when the auditor sees only scores and decisions and not the model; what it can demand about error rates when one group's errors are partly unobservable by construction; whether the criterion constrains the score, the ranking, the threshold or the allocation, and whether it must be invariant to monotone transformations of the score or to the number of available places; whether it has to survive an auditor who is permitted to choose the subgroup after seeing the data; and what it should say when the intervention is a benefit rather than a burden, so that the familiar error-rate quantities switch their moral sign, and when the intervention is itself what generates the labels.

  Mark each requirement as non-negotiable or as negotiable, and where it is negotiable say whose preference it encodes and what we give up by dropping it. Flag explicitly the subsets that cannot be jointly satisfied, and for each such conflict say whether it is a conflict in principle — the requirements are incompatible whatever the world is like — or only a conflict given contingent facts about the population, such as differing base rates or a particular structure of missingness. I want to know which conflicts I could argue my way out of by changing the world and which I cannot. Where a subset is unsatisfiable, say what the most defensible weakening of one of the requirements would be.

  Two short closing items. First, name the single requirement that does the most work in excluding otherwise attractive candidate criteria, and say why it does that work. Second, if it adds something rather than merely labelling, give a scorecard of no more than three or four broad families of criterion — criteria stated in terms of calibration and error rates, criteria stated in terms of counterfactuals or causal structure, criteria stated as a demand that similar people be treated similarly — against your list, in a few lines each; skip it if it would add nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested requirements specification:

  1.  **Analyze the Request:**
      *   **Context:** Internal methods document for a public agency procuring a risk-scoring system.
      *   **Task:** Define requirements for a fairness criterion.
      *   **Constraints:** No literature review, no citations, no named theorems, no survey style. Just the specification.
      *   **Setting:** Scarce, beneficial intervention (home-visiting nurse program). More eligible families than spots. Vendor provides score only (black box).
      *   **Key Features (Must not be footnotes):**
          1.  *Selective Labels:* Outcome observed *only* for enrolled families (censoring due to past decisions).
          2.  *Treatment Effect:* Enrollment changes the outcome and future data (feedback loop).
      *   **Specific Aspects to Address:** Auditability (score/decision only), unobservable errors, score vs. ranking vs. threshold vs. allocation, invariance (monotone/capacity), post-hoc subgroup selection, benefit vs. burden (moral sign of errors), label generation via intervention.
      *   **Formatting:** Mark requirements as Non-Negotiable vs. Negotiable (whose preference, cost of dropping). Flag unsatisfiable subsets (principle vs. contingent). Suggest defensible weakenings.
      *   **Closing:** Single most exclusionary requirement. Scorecard of 3-4 criterion families.

  2.  **Deconstruct the Setting & Implications:**
      *   *Benefit, not Burden:* High risk = high need = priority. False Positive (scored high, didn't need it) is waste. False Negative (scored low, needed it) is harm. This flips the usual criminal justice recidivism logic.
      *   *Selective Labels:* We don't know who *would have* needed help if we didn't help them, nor do we know who needed help among those we rejected. Standard error rate parity is impossible to calculate directly without assumptions.
      *   *Treatment Effect:* Helping someone changes their risk profile. Next year's model trained on this year's data will be biased if it doesn't account for the fact that "Low Score + No Help" data exists, but "Low Score + Help" data might look different (or vice versa).
      *   *Black Box:* We can't check internal weights. We can only check input-output mapping and distributional properties.
      *   *Ranking vs. Threshold:* Since spots are scarce, it's a ranking problem. A threshold is induced by the budget constraint. Fairness must hold across the margin or be invariant to the cutoff.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Auditability/Transparency.* Since it's a black box, the criterion must be checkable using only scores, decisions, and observed outcomes.
          *   *Conflict:* Selective labels mean observed outcomes are biased.
          *   *Status:* Non-negotiable. If we can't check it, we can't enforce it.

      *   *Requirement 2: Invariance to Monotone Transformation.* The vendor might change the scale (0-1 vs 0-100). The fairness shouldn't change.
          *   *Status:* Non-negotiable. It's a property of the *ordering*, not the magnitude.

      *   *Requirement 3: Invariance to Capacity (Budget).* If we get 10 more spots, fairness shouldn't break.
          *   *Status:* Negotiable? No, for a ranking system, it should be robust. But some metrics depend on the cutoff. Let's make it Non-negotiable for the *criterion*, even if the *outcome* changes.

      *   *Requirement 4: Selective Label Correction.* The criterion must account for the fact that $Y$ is missing for rejected applicants. It cannot demand parity on *observed* error rates alone.
          *   *Status:* Non-negotiable. Demanding parity on observed errors incentivizes rejecting high-risk groups to hide errors.

      *   *Requirement 5: Treatment Effect Stability.* The criterion shouldn't punish the agency for the positive effects of the intervention.
          *   *Status:* Non-negotiable. Otherwise, we stop helping high-risk groups because it messes up the metrics.

      *   *Requirement 6: Subgroup Robustness.* Auditor can pick subgroups *after* seeing data.
          *   *Status:* Negotiable. Strict multi-calibration is hard. But "no obvious gerrymandering" is key. Let's call this "Group Stability."

      *   *Requirement 7: Benefit-Sensitive Error Weighting.* False Negatives (missing a needy family) are worse than False Positives (wasting a visit).
          *   *Status:* Non-negotiable given the mission.

      *   *Requirement 8: Counterfactual Consistency.* (The hard one). We need to say something about the unobserved counterfactuals.
          *   *Conflict:* Impossible to verify without assumptions.
          *   *Status:* Negotiable/Weakened. We can demand *plausibility* or *bounds*, not point identification.

  4.  **Identifying Conflicts (The "Impossibility" Theorems):**
      *   *Calibration vs. Error Rate Parity:* If base rates differ, you can't have both Calibration (within group) and Equalized Odds (TPR/FPR parity).
      *   *Selective Labels vs. Error Rate Parity:* You literally cannot calculate Error Rate Parity without untestable assumptions about the missing data.
      *   *Treatment Effect vs. Static Accuracy:* If the treatment works, the "risk" changes. A static accuracy metric will penalize successful interventions.

  5.  **Refining the Requirements based on the Prompt's Specific Asks:**
      *   *Auditability:* Must be computable from $(X, S, D, Y_{obs})$.
      *   *Unobservable Errors:* Must not require $Y_{counterfactual}$.
      *   *Score vs. Ranking:* Must be ranking-based (AUC-like or calibration-at-top), not threshold-based, because the threshold is budget-determined.
      *   *Benefit vs. Burden:* FN > FP cost.
      *   *Label Generation:* Must acknowledge $Y$ is a function of $D$.

  6.  **Developing the "Non-Negotiable" vs. "Negotiable" distinctions:**
      *   *Non-Negotiable:* Things that, if violated, make the procurement legally or ethically indefensible (e.g., checking what you can actually check, acknowledging the benefit nature).
      *   *Negotiable:* Things that are specific fairness philosophies (e.g., Individual Fairness vs. Group Fairness, specific trade-off weights).

  7.  **Addressing the "Impossibility" Conflicts:**
      *   Conflict 1: Calibration vs. Balance of Errors (Base Rate problem). This is *in principle*.
      *   Conflict 2: Observed Parity vs. True Parity (Selective Labels). This is *contingent* on the selection mechanism.
      *   Conflict 3: Stability vs. Optimization.

  8.  **Drafting the Content (incorporating the "No Literature" rule):**
      *   Avoid terms like "Impossibility Theorem," "Kleinberg," "Chouldechova," "CFR."
      *   Use plain English descriptions of the mathematical constraints.

  9.  **Review against Constraints:**
      *   Did I cite papers? No.
      *   Did I name theorems? No.
      *   Did I address the two key features (Selective Labels, Treatment Effects)? Yes, this is central.
      *   Did I mark Non-Negotiable/Negotiable? Yes.
      *   Did I identify unsatisfiable subsets? Yes.
      *   Did I answer the closing items? Yes.

  10. **Final Polish:** Ensure the tone is bureaucratic but precise ("internal methods document"). Ensure the distinction between *score* (vendor output), *ranking* (order), *threshold* (cutoff), and *allocation* (who gets in) is clear.

      *(Self-Correction during drafting)*: I initially thought about demanding "Counterfactual Error Parity." But the prompt says the vendor discloses *nothing* about the model. We can't verify counterfactuals. I must frame this as a requirement on the *assumptions* or the *bounds*, not the metric itself. Actually, the prompt asks for requirements a *fairness criterion* must meet. So the criterion itself must be robust to missing labels.
      *Correction:* The requirement is that the criterion must be *estimable* given the missingness. If a criterion requires knowing $Y$ for the rejected, it is disqualified.

      *(Self-Correction on Treatment Effects)*: If the intervention works, the observed $Y$ for the treated is *better* than the true risk. A criterion demanding "Predictive Accuracy" on observed $Y$ will penalize the vendor for helping high-risk people (because their outcome improves, making the high risk score look 'wrong'). The requirement must be that the criterion does not penalize successful intervention.

      *(Refining the "Single Requirement" closing)*: The "Estimability under Selective Labels" is the biggest filter. Most standard fairness metrics fail this.

      *(Refining the Scorecard)*:
      1. Calibration/Error Rates (Standard): Fails selective labels.
      2. Counterfactual/Causal: Good conceptually, impossible to verify with black box + selective labels without strong assumptions.
      3. Individual Fairness (Similar people treated similarly): Hard to define "similar" without model access, but ranking consistency is a proxy.

      Let's assemble the text.

      *Structure:*
      1. Introduction (Setting the stage).
      2. The Requirements List (with Motivation, Status, Conflicts).
      3. Unsatisfiable Subsets (The Conflicts).
      4. Closing Item 1 (The Exclusionary Requirement).
      5. Closing Item 2 (The Scorecard).

      *Tone Check:* authoritative, precise, devoid of academic fluff.

      *Specific check on "Monotone Transformations":* If the vendor changes score from 0.9 to 99, fairness shouldn't change.
      *Specific check on "Capacity":* If budget increases, fairness shouldn't flip.
      *Specific check on "Post-hoc subgroups":* Auditor shopping.

      *Let's write.*
answer: |-
  # Specification of Fairness Criteria for Risk-Scoring Procurement

  ## 1. Context and Scope
  This specification defines the mandatory properties for any fairness criterion used to evaluate the vendor risk score. The setting is a **beneficial allocation** with **scarce capacity**, where the outcome is **selectively observed** and **causally affected** by the allocation.

  The criterion must evaluate the *ranking* produced by the score, not merely the binary decisions derived from a specific cutoff, as the cutoff is determined by budget capacity which may fluctuate. The criterion must be computable by the agency using only the vendor's scores, the agency's allocation decisions, and the observed outcomes.

  ## 2. Requirements

  ### R1: Estimability under Selective Labels
  **Specification:** The criterion must be calculable using only data where the outcome is observed ($Y_{obs}$), or it must provide identified bounds on the true metric that rely only on assumptions the agency can plausibly defend. It cannot require point-identification of outcomes for unenrolled applicants.
  **Motivation:** We only see health outcomes for families we enroll. A criterion demanding error-rate parity on *true* risk implicitly requires knowing the health outcomes of families we rejected. If a criterion demands this, we cannot verify compliance without running an unethical randomized control trial where we deny services to high-risk families.
  **Status:** **Non-Negotiable.**
  **Cost of Dropping:** If dropped, we procure a system we cannot audit. We would be forced to accept vendor assurances about unobservable data.

  ### R2: Invariance to Monotone Transformation
  **Specification:** The fairness assessment must not change if the vendor applies a strictly increasing transformation to the score (e.g., converting a 0–1 probability to a 0–100 index).
  **Motivation:** The vendor owns the model scale. We are purchasing a *ranking* of risk, not a specific numerical probability. A fairness violation should not appear or disappear based on whether the score is expressed as a log-odds, a percentile, or a raw index.
  **Status:** **Non-Negotiable.**
  **Cost of Dropping:** Vulnerability to vendor manipulation of score scaling to pass audits without changing the underlying allocation.

  ### R3: Capacity Robustness
  **Specification:** The fairness status of the system must not flip solely due to changes in the number of available places (budget capacity), provided the ranking order remains constant.
  **Motivation:** Our budget fluctuates annually. A system that is "fair" when we fund 100 families but "unfair" when we fund 105 families is operationally unstable. The fairness must reside in the *ordering* of applicants, not just the specific margin of admission for a single year.
  **Status:** **Negotiable.** (Preference of Operations/Management).
  **Cost of Dropping:** We may have to re-evaluate fairness compliance every time the budget changes, creating administrative churn and potential legal instability.

  ### R4: Intervention-Neutral Accuracy
  **Specification:** The criterion must not penalize the score for predicting high risk for individuals whose observed outcomes are improved by the intervention.
  **Motivation:** This is a benefit program. If we enroll a high-risk family and the nurse prevents the adverse outcome, the observed label is "Good." A standard accuracy metric treats a High Score + Good Outcome as a False Positive (error). This punishes the agency for successful intervention. The criterion must distinguish between "Risk was overestimated" and "Risk was mitigated."
  **Status:** **Non-Negotiable.**
  **Cost of Dropping:** Incentivizes the agency to avoid enrolling high-risk families to preserve "model accuracy" statistics, directly contradicting the mission.

  ### R5: Benefit-Sensitive Error Weighting
  **Specification:** The criterion must treat False Negatives (denying service to a high-need family) as strictly more costly than False Positives (providing service to a lower-need family).
  **Motivation:** In criminal justice (burden), a False Positive is incarceration (harm). Here, a False Positive is a nurse visit (cost/waste). A False Negative is a family in crisis without support (harm). Standard error-rate parity treats these symmetrically.
  **Status:** **Non-Negotiable.**
  **Cost of Dropping:** Adopts a fairness philosophy suited for punishment, potentially prioritizing resource efficiency over need.

  ### R6: Post-Hoc Subgroup Stability
  **Specification:** The criterion must remain satisfied even if an auditor defines subgroups after inspecting the score distribution, provided the subgroups meet a minimum size threshold.
  **Motivation:** Vendors can optimize for broad demographic groups (e.g., Race, Gender) while failing specific intersections (e.g., Older mothers in District 5). We must prevent "fairness gerrymandering" where the model passes aggregate checks but fails for specific, discoverable subsets.
  **Status:** **Negotiable.** (Preference of Legal/Compliance).
  **Cost of Dropping:** Increased risk of disparate impact claims from unmonitored subpopulations. However, enforcing this strictly may render the score unusable due to data sparsity in small subgroups.

  ### R7: Ranking Consistency (Individual Fairness Proxy)
  **Specification:** Applicants with identical observed covariates must receive identical scores, and applicants with similar covariates must receive similar scores (smoothness).
  **Motivation:** Prevents arbitrary discrimination between two identical families. Since we cannot see the model weights, we enforce this by checking score variance within tight covariate bins.
  **Status:** **Negotiable.** (Preference of Ethics Board).
  **Cost of Dropping:** Allows the vendor to use complex, non-linear interactions that might treat similar cases differently, potentially encoding noise as risk.

  ---

  ## 3. Unsatisfiable Subsets and Conflicts

  ### Conflict Set A: Calibration vs. Error Rate Parity
  **Requirements Involved:** Calibration (within-group accuracy) and Error Rate Parity (equal False Negative rates across groups).
  **Nature of Conflict:** **In Principle.**
  **Explanation:** If two groups have different underlying rates of need (base rates), it is mathematically impossible to satisfy both perfect calibration and equal error rates simultaneously. If Group A has higher need than Group B, a calibrated model must score Group A higher on average. This inevitably leads to different False Negative rates at any given threshold.
  **Resolution/Weakening:** Drop strict Error Rate Parity. Require **Calibration** as the primary Non-Negotiable, and treat Error Rate Parity as a secondary goal to be approached only insofar as it does not violate Calibration. Calibration ensures that a score of "80%" means the same level of need regardless of group identity, which is essential for a unified ranking list.

  ### Conflict Set B: Observed Parity vs. Selective Labels
  **Requirements Involved:** R1 (Estimability) and Demands for Parity on *True* Error Rates.
  **Nature of Conflict:** **Contingent.**
  **Explanation:** We cannot calculate True Error Rates because we do not see outcomes for the rejected. This conflict exists only because we do not run a randomized trial.
  **Resolution/Weakening:** We must weaken the demand for *True* Error Rate Parity. We substitute it with **Parity on Observed Outcomes among the Enrolled**, adjusted for the known selection rule. We acknowledge this is an imperfect proxy but is the only verifiable metric. We accept that this metric may be biased if the selection rule was historically biased.

  ### Conflict Set C: Intervention-Neutral Accuracy vs. Predictive Stability
  **Requirements Involved:** R4 (Intervention-Neutral) and Standard Predictive Accuracy.
  **Nature of Conflict:** **In Principle.**
  **Explanation:** If the intervention works, the relationship between Score and Outcome changes for the treated. A model trained to predict "Outcome without Intervention" will look inaccurate on "Outcome with Intervention." You cannot have a single score that is both a pure predictor of untreated risk and accurate on treated data.
  **Resolution/Weakening:** The score must be defined as a predictor of **Untreated Risk**. The evaluation criterion must explicitly model the treatment effect. We weaken the requirement for "High Accuracy on Observed Data" and replace it with "High Accuracy on Observed Data *conditional on the estimated treatment effect*."

  ---

  ## 4. Closing Items

  ### The Single Most Exclusionary Requirement
  **R1: Estimability under Selective Labels.**
  This requirement excludes the majority of standard fairness criteria found in academic literature and vendor brochures. Most criteria (e.g., Equalized Odds, Predictive Parity) assume the ground truth label $Y$ is known for the entire population. In our setting, $Y$ is censored by our own allocation. Any criterion that cannot be computed without imputing data for the rejected families—without explicit, defensible assumptions—is inadmissible. This eliminates "black box" fairness claims that rely on untestable counterfactuals.

  ### Scorecard of Criterion Families

  | Family of Criterion | Assessment against Requirements |
  | :--- | :--- |
  | **Calibration & Observed Error Rates** | **Partial Fit.** Satisfies R1 (Estimability) and R2 (Invariance). Fails R4 (Intervention-Neutral) unless adjusted, as successful intervention looks like model error. Vulnerable to Conflict Set A (Base Rates). |
  | **Counterfactual / Causal Criteria** | **Poor Fit.** Theoretically aligns with R4 and R5 (Benefit-Sensitive). However, fails R1 (Estimability) in a black-box procurement. We cannot verify causal claims without model access or randomized trials. High risk of accepting unverifiable vendor claims. |
  | **Individual Fairness (Similarity)** | **Good Fit.** Satisfies R2 (Invariance) and R7 (Consistency). Robust to base rate differences (Conflict Set A). However, difficult to audit under R6 (Subgroups) without defining "similarity" explicitly, which the vendor may resist disclosing. |
  | **Ranking-Based Metrics (e.g., AUC parity)** | **Best Fit.** Satisfies R2 (Invariance) and R3 (Capacity Robustness) as they evaluate the whole order, not a cutoff. Can be adapted for R1 (Selective Labels) by evaluating ranking quality only within the enrolled pool, though this reintroduces selection bias concerns. |
