  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** Chief Actuary
  **DATE:** October 24, 2023
  **SUBJECT:** Strategic Implementation of First-Person Actuarial Standards (FPAS)

  **Executive Summary**
  Following the Q3 vote to formally accept the Quantum Immortality (QI) argument as grounds for policy continuation, this office has modeled the financial impact of transitioning to First-Person Actuarial Science (FPAS). While the shift allows for significant reserve releases under specific counting conventions, it introduces novel liability structures regarding disability claims and beneficiary designations. This memo outlines the operational adjustments required to align regulatory capital with first-person survival probabilities while maintaining third-person settlement protocols.

  **1. Reserve Conventions and Measure Weighting**
  The Quantitative Division has proposed two conventions for calculating reserves on QI-eligible policies. Convention A counts all surviving branches equally. Convention B weights branches by their squared-amplitude measure. Under Convention A, the firm recognizes a $2.4 billion reserve release, as the insured subjectively survives in at least one branch regardless of objective risk. Under Convention B, the measure-weighted probability of the firm's own survival in the insured's branch shrinks toward zero over time.

  The CFO has indicated a preference for Convention A for current reporting cycles. However, Risk Management notes that Convention B more accurately reflects the shrinking liquidity of surviving branches. The entire reserve release turns on this convention choice rather than underlying physics. We recommend locking Convention A for regulatory capital calculations to maximize leverage, while monitoring measure decay.

  **2. Risk Exposure: The Perpetual Claimant**
  The Risk Committee has identified a critical exposure in the survival data. Branches where the insured survives high-mortality events are overwhelmingly those in which the insured is catastrophically maimed rather than unharmed. Consequently, the firm faces the "Perpetual Claimant" scenario: a policyholder who, in their own continuous experience, is never dead and never off claim.

  While third-person books show a closed claim upon death, first-person accounting recognizes an infinite stream of disability and critical-illness benefits accruing to the surviving copy. This represents an infinite liability in first-personal terms against a finite reserve on the books. We must cap disability riders for QI-eligible policies to prevent insolvent exposure to unending care costs in the surviving branch.

  **3. Beneficiary Designations and Payout Logic**
  A structural asymmetry exists regarding death benefits. Payouts are triggered by death, yet under QI, the client does not subjectively die. Nothing about the client's subjective survival helps the balance sheet if the benefit cannot be claimed. To resolve this, Product Development proposes a "Continuity Rider." This allows the policyholder to name their own surviving copy as the beneficiary.

  This routes around the requirement for a distinct deceased insured. The surviving copy receives the death benefit as a "continuity settlement." Legal advises this may blur the line between life insurance and endowment, but it ensures liquidity flows to the surviving branch where the client remains alive to spend it.

  **4. Legal Constraints and Analytics Proposals**
  Legal has flagged ambiguity regarding the suicide exclusion clause. If a client operates a home quantum-suicide apparatus, the act is third-personally lethal in nearly all measure while first-personally never resulting in death. Standard exclusion voids coverage for suicide within two years. Legal recommends classifying apparatus usage as "high-risk hobbyism" rather than suicide, provided the client survives. However, adverse selection is a concern: the only customers requesting the Continuity Rider are those planning to use the machine.

  Furthermore, Analytics proposes funding client-owned apparatuses as an in-house test of many-worlds. The memo must note this can never confirm anything for the firm. From the company's own standpoint, the data will show near-total mortality in every branch the company itself is around to read. We will not fund external verification that yields no usable data for our specific observer track.

  **Exhibit A: Reserve Model Comparison (FY24 Projection)**

  | Metric | Convention A (Equal Branch) | Convention B (Measure-Weighted) |
  | :--- | :--- | :--- |
  | **Survival Probability** | 100% (Subjective) | <0.01% (Measure) |
  | **Reserve Release** | $2.4 Billion | $0 |
  | **Liability Horizon** | Infinite (Perpetual Claim) | Finite (Death) |
  | **CFO Preference** | **High** | Low |

  **Recommendation**
  To stabilize the balance sheet while honoring the Board's philosophical commitment, we recommend a hybrid accounting framework. The firm should adopt first-person accounting for regulatory capital requirements to recognize the reserve releases associated with subjective survival. Simultaneously, we must continue to settle claims third-personally, requiring objective death verification for standard payouts unless the Continuity Rider is purchased. This allows the firm to capitalize on subjective immortality while limiting liabilities to objective mortality events.

  Approval is requested to implement FPAS immediately.
