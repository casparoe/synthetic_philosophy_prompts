      Let's write the responses to be spoken, not read. Short sentences. Clear signposting.

      *Refining the "Writing" reply:* This is the hardest one. Rousseau distinguishes between *presence* and *representation*. Writing preserves presence (author to reader) better than theater (actor replacing character replacing author). I need to make sure the user doesn't get bogged down in Derridean stuff. Keep it political: Writing allows pause/reflection; theater demands immediate emotional surrender.

