      *Wait, one more check:* The prompt asks for "Upfront concessions" separately. So I can put Anachronism in the opening advice, and keep the Q&A order strictly by thesis damage.
      Okay, let's finalize the order:
      1. Writing/Representation (Logical self-refutation).
      2. Festivals (Textual inconsistency).
      3. Anachronism (Methodological validity).
