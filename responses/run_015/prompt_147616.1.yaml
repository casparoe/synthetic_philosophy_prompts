prompt: |-
  I was in a seiminar on liberalism and the profesor kept going on about Rawls's public reason idea — like, religious people have to translate there beliefs into reasons everyone can share before they enter politics. My freind who actually goes to church said it feels like being told to speak in a language that deletes half of what you think. So I want a satire that makes that tension visceral without just name-calling anyone.

  Write a parody of an official government FAQ / user manual for a fictional "Office of Civic Translation" that processes religious arguments before they enter the public square. The form should be deadpan bureaucratic: numbered sections, subheadings, form-field instructions, maybe a sidebar on penalties. Voice like an actual IRS or DMV manual — cheerful, precise, and quietly ruthless. The target is Rawlsian public reason and the asymmetry that religious citizens bear the translation burden while secular comprehensive doctrines often slip through unchecked. Exaggerate real features: the idea of an overlapping consensus, the burden of judgment, the public/private reason distinction, and the idea that some arguments are simply "not admissible" in shared deliberation. Inject two invented but conceptually coherent mechanisms: a "Translation Credit Score" citizens build by rendering religious claims into secular public reason; a "Reverse-Doctrinal Audit" that traces secular arguments back to hidden metaphysical commitments; and an "Exemption Certificate for Epistemically Modular Belief Systems" that is technically open to all but practically impossible to get. Don't center this on a real politician or named living person — invent the Office and its director. Keep it readable to someone who hasn't read Rawls — the satire should land through bureaucratic absurdity — but precise enough that a reader who knows the literature reccognizes which objections (hidden secularism, unfair cognitive burden, who certifies the translation) are mapped onto which fictional rules. Around 650 word's for the FAQ itself, with clear section headers.

  Then include one titled section: "Commentary on the choices made" (around 200 words). In it, briefly explain which real debates you're exaggerating — for instance, why the Translation Credit system maps onto the criticism that public reason imposes an unequal burden, why the Reverse Audit points to the charge that secular liberalism is itself a comprehensive doctrine — and note which invented elements have no direct academic counterpart. Don't include a bibliography, citation list, or page-number references; just talk about the concepts.
