answer: |-
  **DEPARTMENT OF PUBLIC DELIBERATION**
  **OFFICE OF CIVIC TRANSLATION (OCT)**
  **Citizen's Guide to Public Reason Compliance (Form 88-PR)**

  **Welcome to the Public Square!**
  To ensure fair cooperation among free and equal citizens, the Office of Civic Translation (OCT) manages the flow of arguments into political deliberation. Our goal is an Overlapping Consensus where no one is coerced by truths they cannot share. Please review the following protocols to maintain your Civic Standing. We appreciate your cooperation in keeping the square neutral.

  **1. Eligibility and Filing Requirements**
  All citizens operating under a "Comprehensive Doctrine" (religious, philosophical, or moral) must translate private convictions into Public Reason before legislative advocacy. Secular humanist frameworks are presumptively public but subject to random Review. If your motivation begins with "My faith requires," you must file a Translation Petition. Do not cite sacred texts unless accompanied by a secular justification acceptable to all reasonable persons. A "reasonable person" is defined as anyone who accepts the burden of judgment and rejects state enforcement of theological truth.

  **2. The Translation Protocol**
  Arguments must be grounded in shared political values, not sectarian truth.
  *   **Admissible:** "Policy X reduces suffering and promotes stability."
  *   **Inadmissible:** "Policy X fulfills Divine Will or Natural Law."
  Citizens must strip metaphysical premises until only the "Overlapping Consensus" remains. Use the OCT Glossary to replace "Sin" with "Social Harm," "Grace" with "Equity," and "Salvation" with "Public Order." Translations must be intelligible to a citizen holding no specific doctrine. If your argument loses its meaning during translation, it was likely too sectarian to begin with.

  **3. Translation Credit Score (TCS)**
  Citizens accumulate TCS points by successfully rendering religious claims into secular language. A high TCS (750+) grants expedited hearing access and priority seating at town halls. Low scores trigger mandatory "Burden of Judgment" workshops. Note: Secular citizens begin with a baseline score of 800; religious citizens start at 0 and must earn parity through consistent translation. Maintaining parity requires approximately 15 hours of weekly linguistic labor. Points decay if you revert to sectarian language during stressful debates.

  **4. Reverse-Doctrinal Audit**
  The OCT reserves the right to audit secular arguments for hidden metaphysical commitments. If a secular claim is found to rely on unproven philosophical axioms (e.g., "Autonomy is the highest good"), it may be flagged for doctrinal contamination. However, flagged secular claims remain admissible pending review, whereas untranslated religious claims are immediately silenced. This ensures neutrality while acknowledging all doctrines have roots. Secularists are trusted to self-correct; religious citizens must prove correction externally.

  **5. Exemption Certificate for Epistemically Modular Belief Systems**
  Citizens may apply for an Exemption if they can prove their beliefs are fully separable from their political reasoning. Applicants must submit notarized affidavits proving they never consult their conscience during voting and that their identity is not constituted by their commitments. Processing time: 4–6 years. Approval rate: 0.03%. Most applicants are denied for "Insufficient Modularity" or "Excessive Integrity."

  **SIDEBAR: PENALTIES AND ENFORCEMENT**
  *   **First Offense:** Warning and mandatory re-translation.
  *   **Second Offense:** Reduction of TCS by 50 points.
  *   **Third Offense:** "Civic Silence" order, restricting speech to private spaces only.
  *   **Repeat Offenders:** Referral to the Department of Reasonable Accommodation for re-education.

  **Director:** Dr. Aris Thorne
  **Contact:** compliance@oct.gov
  **Remember:** You are free to believe anything in private, provided it sounds like everyone else in public.

  ***

  **Commentary on the choices made**

  This satire targets the asymmetry in Rawlsian public reason, where religious citizens bear a unique burden to translate their convictions while secular doctrines often pass as "neutral." The **Translation Credit Score** literalizes the criticism (advanced by scholars like Nicholas Wolterstorff) that public reason demands extra cognitive labor from the religious, effectively penalizing them for their identity. By giving secularists a head start, the FAQ highlights how liberalism privileges certain ways of thinking as default.

  The **Reverse-Doctrinal Audit** addresses the charge that secular liberalism is itself a "comprehensive doctrine" (a critique associated with Michael Sandel). While the audit theoretically checks secular arguments, its leniency satirizes how secular metaphysical commitments (like autonomy) are often treated as public reason rather than contested beliefs. The **Exemption Certificate** mocks the impossibility of separating personal identity from political reasoning. By making the exemption technically available but practically unreachable, the text underscores the unrealistic expectation that citizens can split themselves into private believers and public reasoners without loss of integrity. The bureaucratic tone masks the coercive nature of these requirements, mirroring the polite but exclusionary force of the theory itself.
