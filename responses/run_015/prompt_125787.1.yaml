  1. Calling this gerrymandering misses the normative force of the shared logical constraint. Peerhood isn't a metaphysical caste; it's an epistemic status grounded in comparable reliability on the specific question. When B violates a constraint we both explicitly accepted, B isn't functioning as a peer here; they're functioning as a systematic error source. I'm not saying 'I'm right, so you're out'; I'm saying 'You broke the rules of the game we agreed to play.' If we were calculating a sum and you ignored carrying the one, I wouldn't average our totals. Steadfastness here protects reasoning process against known violations, not just my ego.

  2. I concede conciliationism rightly warns against too easily diagnosing 'errors' to protect our ego in messy, real-world debates.

  3. But once A identifies the violation, does conciliationism require treating B's confidence as equally weighted evidence despite the flaw? If so, aren't you demanding irrationality by forcing me to weight errors equally with correct reasoning?
