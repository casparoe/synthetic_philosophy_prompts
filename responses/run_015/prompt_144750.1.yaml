answer: |-
  **Project Title:** The Mirror and the Crucible: Compatibility Tensions in the Normative Justification of Sortition

  **Research Question**
  Are the descriptive and deliberative justifications for sortition mutually compatible, or does the success of one undermine the authority claimed by the other? Specifically: if a randomly selected body successfully deliberates and transforms its preferences, does it cease to function as a descriptive mirror of the population, and if so, which normative ground—representation or improvement—remains sufficient for democratic authority?

  **State of the Field and Dialectical Gap**
  Current defenses of sortition typically rely on two distinct lines of argumentation used in tandem. The first is descriptive: a randomly selected body statistically mirrors the population's composition and pre-existing preferences, offering a corrective to the distortions of electoral careerism. The second is deliberative: given balanced information and facilitated discussion, ordinary citizens will transcend initial biases and reach reasoned decisions superior to aggregate public opinion.

  The literature treats these arguments as complementary reinforcements. Proponents assume that a body can be both a statistical mirror and a deliberative crucible without tension. The gap lies in the lack of scrutiny regarding what happens when the deliberative process works as intended. If transformation occurs, the body's output no longer mirrors the population's input preferences. Consequently, the claim to descriptive representation weakens precisely as the claim to deliberative quality strengthens. Existing accounts do not address whether these two forms of legitimacy are competitive rather than cumulative. They leave open whether sortition derives its authority from representing the people as they *are* or governing them as they *might become*, and whether attempting to claim both renders the theoretical foundation unstable.

  **Methodology and Work Plan**
  This project employs conceptual analysis and normative theory rather than empirical review. While empirical data on citizens' assemblies is abundant, it cannot settle a question about conflicting normative justifications. Data can tell us whether preferences change, but it cannot determine whether that change validates or invalidates the body's claim to representativeness. The conflict is logical, not factual.

  *Month 1: Reconstruction and Mapping.* I will reconstruct the strongest versions of both the descriptive and deliberative arguments as they appear in contemporary political theory. The goal is to charitable map the specific claims each makes about democratic authority. I will also determine whether the empirical wrinkle regarding self-selection bias belongs in this analysis or must be bracketed as a separate institutional variable.
  *Month 2: Stress Testing the Compatibility.* I will model the interaction between the two arguments. If deliberation transforms preferences, does the body retain descriptive legitimacy? If descriptive fidelity is the priority, does deliberation become a risk to be managed rather than a virtue to be encouraged? I will test whether existing distinctions (e.g., advisory vs. binding powers) resolve the tension or merely hide it.
  *Month 3: Drafting the Argument.* I will write the core of the paper, aiming to demonstrate that defenders of sortition must choose a primary locus of authority. I will explore the implications of choosing one over the other: does prioritizing transformation collapse sortition into a form of epistocracy? Does prioritizing mirroring render deliberation superfluous?
  *Month 4: Revision and Polishing.* I will refine the argument for a generalist audience, ensuring the theoretical stakes are clear without excessive jargon. The final manuscript will be prepared for submission to a generalist political theory journal.

  **Risk and Failure Conditions**
  The project fails if the apparent conflict turns out to be a scope confusion already resolved in the literature—for example, if proponents consistently assign descriptive legitimacy to advisory bodies and deliberative legitimacy to governing bodies, with no overlap. I will know this by the end of Month 2. If the literature clearly segregates these claims by institutional type, there is no paradox to resolve, only a taxonomy to clarify.

  A second failure mode is producing a purely negative critique that dismantles the dual justification without offering a constructive path forward. To mitigate this, Month 3 is dedicated not just to exposing the tension but to evaluating which single justification offers a more robust foundation for lottocracy, or whether a synthesized third option (e.g., legitimacy via procedural fairness alone) is viable.

  **Scope Check**
  This proposal is scoped for a single 8,000-word paper. The empirical question of self-selection bias and compulsory service—while relevant to the mechanism of transformation—is excluded from this project to maintain focus on the normative tension. That empirical wrinkle requires a separate treatment regarding institutional design and will be reserved for a sequel. This project remains strictly within the bounds of normative theory, ensuring it is completable within one semester of research leave.
