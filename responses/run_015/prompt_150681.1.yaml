  The rules that fit his old verdicts come apart on whether the **certainty stipulation** neutralizes the "look in the eye" discount. If he treats the sealed cache as making future people morally equivalent to present people (consistent with his Case 5 claim that government should be indifferent over time for the same person), he must fund the 130; if he treats the cache as merely solving *risk* but not *relational distance*, he funds the 100. To settle this, put him this case: **100 lives saved now vs. 100 lives saved in 500 years (zero risk, sealed cache).** If he chooses "Now," he admits to pure time/existence discounting despite his verbal principles; if he says "Indifferent," he undermines his previous choices in Cases 1, 2, and 4 and commits himself to funding the 130 in the current case.
