answer: |-
  We are submitting this document as a record of our adversarial collaboration, written jointly to reflect where our views converge and where they fundamentally diverge after a term of debate. We intend for both of us to sign this, which means we have vetted every paragraph to ensure that neither of us feels misrepresented. Our goal is not to manufacture agreement where none exists, but to isolate the exact points of contention so that they can be tested rather than merely argued. We begin with the empirical and conceptual ground we both occupy. We agree that there are real dissociations between what people report experiencing and what they can discriminate behaviorally. We both accept that perception is not a perfect mirror of the world and that cognitive access can fail even when sensory processing remains intact. Furthermore, neither of us believes in a little inner theater with a homunculus watching it. We reject the idea that there is a separate self inside the head viewing experiences as objects. Finally, we both think the explanatory gap between a functional or neural story and the phenomenology is a genuine puzzle and not just confusion. We agree that explaining how neurons fire does not immediately explain why it feels like something to be those neurons, though we will disagree in a second about whether the gap is in the world or in our concepts.

  Where we part ways is on the ontological status of experience itself. One of us holds the interface line, arguing that consciousness is a species-specific user illusion, akin to a desktop interface on a computer. On this view, perception is a compressed display of what matters for action rather than a window onto how the world is. The evolutionary point is that selection rewards fitness, not accuracy, and the claim is that what we call the feel of experience is just the interface running and not some further fact about it. The other of us holds that experience is a real, structured, causally efficacious process going on in the organism. This view maintains that illusion talk quietly helps itself to the very thing it wants to demote, because you can only say the icon isn't how things are by relying on how things look. To call experience an illusion presupposes a reality of appearance that the illusionist wants to explain away.

  We have identified three cruxes where this disagreement becomes concrete, and for each one, we have stated the test and our respective predictions. The first crux concerns what the interface is made of and who it is for. The realist keeps pushing that the interface view either needs a user, which risks bringing the homunculus back again, or has to identify the user with some downstream consumer subsystem. The interface theorist's actual answer is that the user is indeed a downstream consumer subsystem, but one that operates on the compressed data without needing its own inner light. The prediction here is that if we can isolate a subsystem that guides complex behavior using compressed data without generating reportable feel, the interface theorist will identify this as the user completing the circuit. The realist predicts that any such subsystem will either turn out to have some minimal phenomenology or will be shown to be purely unconscious processing that does not solve the hard problem of why there is an interface at all. The load-bearing question is whether a user without experience is a coherent concept or just a relabeling of unconscious computation.

  The second crux is a case made up in section, which we are calling the fading icons case. In this scenario, subjects under a heavy dual-task load report over a few seconds that the color of a patch has gone flat, that they have swapped from seeing blue to merely knowing it is the blue one, while their forced-choice discrimination of exactly those patches stays up in the high eighties or nineties. The interface theorist says this is precisely what you would predict if experience is a display mode that dims when computational resources are allocated elsewhere. The display is optional; the data processing is not. The realist's best response is that this shows reportability fading while experience remains, suggesting the subjects are confusing access with phenomenology. However, the realist must admit this is where their position is weakest, because it relies on trusting introspective reports about presence over reports about quality. If the subject says it feels flat, the realist must argue they are wrong about their own experience, which is a difficult line to hold without appealing to hidden essences.

  The third crux involves a hypothetical closed-loop stimulation that reliably makes people say their pain has gone symbolic. In this case, they still withdraw, still rate it as bad, still learn to avoid the stimulus, but insist it no longer feels like anything to them. The interface theorist predicts this is possible because the affective rating and withdrawal are behavioral outputs driven by the interface, while the feel is just the mode of display which can be switched to symbolic representation. The realist predicts this is impossible, arguing that if the avoidance and badness rating remain, the affective feel must remain, and the report of it being symbolic is just a confusion about the nature of suffering. This case cuts differently from the first because it targets the motivational core of experience rather than perceptual detail. If the feel can be stripped while the function remains, the interface view gains significant ground. If the feel cannot be stripped without changing the function, the realist view that experience is causally efficacious is strengthened.

  We suspect part of our fight is just about words, specifically about whether illusion means misrepresentation or merely compression. If consciousness is a compression of data for fitness, calling it an illusion might be rhetorically strong but technically accurate only if one expects perception to reveal truth. We also suspect we are sometimes using consciousness for different things, sometimes meaning the reporting mechanism and sometimes meaning the felt quality. We have tried to separate these in the cruxes above. The interface theorist insists the compression is the reality, while the realist insists the compression rests on a real process of feeling. We do not agree on whether this is a verbal dispute or a substantive one, but we agree that the predictions above will help settle it. If the fading icons case shows discrimination surviving reported loss of feel, it supports the compression model. If the symbolic pain case proves impossible, it supports the causal efficacy model. We are both willing to let the data decide, provided the experiments are described precisely enough to rule out equivocation. This document represents our best attempt to state the disagreement such that either of us could read it and say, yes, that is what I believe, and that is what my partner believes, and here is how we would know who is right. We submit this as a single voice composed of two distinct perspectives, bound by the shared constraint that we must both be able to sign it without reservation.
