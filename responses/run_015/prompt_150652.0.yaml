answer: |-
  ### Specification for Non-Human Causation in Historical Explanation

  **I. The Requirements**

  1.  **The Evidential Tractability Clause**
      *   **Motivating Case:** *Case 2 (The Silent Eruption).* A geophysically real event leaves no documentary or proxy trace in the human record.
      *   **Argument:** History is an empirical discipline constrained by evidence. If a forcing cannot be correlated with a change in the human record (textual, archaeological, or proxy), it remains a geological event, not a historical cause. An account must specify what observable difference the causation claim entails.
      *   **Status:** **Non-negotiable.**

  2.  **The Mediation Specification**
      *   **Motivating Case:** *Case 3 (Potato Blight).* The pathogen existed, but mortality was determined by export policy and land tenure.
      *   **Argument:** Non-human forces do not act directly on historical outcomes (e.g., regime collapse); they act on biological or material substrates (crops, bodies). The account must explicitly model the social institutions that translate biological stress into historical change. Without this, the explanation is geophysical determinism.
      *   **Status:** **Non-negotiable.**

  3.  **The Semantic Causality Condition**
      *   **Motivating Case:** *Case 5 (Cholera/Miasma).* Policy effects were real despite the causal belief (miasma) being scientifically false.
      *   **Argument:** Human responses to non-human forces are mediated by *beliefs* about those forces. An adequate account must distinguish between the ontic cause (the vibrio) and the semantic cause (the belief in bad air), acknowledging that the latter often drives the historical outcome more directly than the former.
      *   **Status:** **Non-negotiable.**

  4.  **The Scale-Compatibility Rule**
      *   **Motivating Case:** *Case 7 (Monsoon vs. Parliament).* A regional climate failure explains harvest loss but not specific legislation.
      *   **Argument:** Causal explanations must respect scalar matching. A continental-scale forcing cannot explain a local-scale outcome without intermediate mechanism steps. The account must forbid "leaping" scales without specifying the transmission mechanisms (e.g., price signals, migration flows).
      *   **Status:** **Non-negotiable.**

  5.  **The Feedback Loop Capacity**
      *   **Motivating Case:** *Case 6 (The Loop/Anthropocene).* Human depopulation alters carbon cycles, which alter climate, which alters history.
      *   **Argument:** Non-human causation is not always exogenous. The account must allow for endogenous feedback where human action modifies the non-human variable, which then returns as a cause. Linear models fail here.
      *   **Status:** **Negotiable.** (Some linear historical narratives may legitimately bracket the feedback for specific periods, though Earth-system history cannot.)

  6.  **The Agency Distinction**
      *   **Motivating Case:** *General (Actor vs. Cause).* When is a volcano an "actor"?
      *   **Argument:** To call a non-human an "actor" implies a capacity for responsiveness or goal-directedness it does not possess. The account must preserve a distinction: non-humans are *causes* (forcing functions); humans are *actors* (interpreting agents). Collapsing this distinction (symmetry) obscures the mechanism of responsibility and response.
      *   **Status:** **Negotiable.** (Actor-Network theorists will deny this, arguing for flat ontology. It is philosophically contestable whether "agency" requires intent.)

  **II. Tensions and Incompatibilities**

  **The Tension:** There is a conflict between **Requirement 3 (Semantic Causality)** and **Requirement 1 (Evidential Tractability)**.
  *   **The Conflict:** Semantic causality relies on human belief systems which may posit non-existent forces (miasma). Evidential tractability demands observable/proxy differences. If the belief is the cause, but the object of the belief (miasma) leaves no physical trace, how do we validate the causation without validating the false science?
  *   **Resolution:** I prioritize **Requirement 1**. We can evidence the *belief* (texts) and the *outcome* (policy), but we must not evidence the *non-human force* as real if it was not. The account must tolerate false beliefs as historical causes without granting them ontological status as natural forces. If a theory requires the miasma to be real to explain the quarantine, the theory is wrong.

  **III. The Most Exclusionary Requirement**

  **Requirement 1 (The Evidential Tractability Clause)** does the most work. It eliminates all purely speculative environmental determinism, any narrative that relies on "hidden" climatic shifts without proxy support, and any philosophical account that treats history as independent of the archival/physical record. It rules out "just-so" stories where a climate shift is invoked to explain a social change without a demonstrable chain of evidence linking the two.

  **IV. Verdict on "Vulnerability Window" and "Channeling"**

  These are **genuine desiderata**, not disciplinary prejudices.
  *   **Vulnerability Window:** This is not a concession to anti-determinism; it is a recognition of *threshold dynamics*. A forcing only becomes a cause when it exceeds the system's buffering capacity (resilience). An account that ignores this fails Case 2 (Silent Eruption) and Case 3 (Potato).
  *   **Channeling:** This is simply the requirement for *mechanism*. It does not concede that nature is passive; it acknowledges that nature is indeterminate regarding social outcomes until mediated by structure.
  *   **Conclusion:** Any adequate account must integrate these as core components of the causal mechanism, not as external qualifiers.

  **V. Addressing Internal Issues**

  1.  **Looped Causation:** The account **must** handle this (Requirement 5). History is increasingly defined by these loops (Anthropocene). A linear model is empirically inadequate for the modern period, though perhaps acceptable for deep history where human feedback was negligible.
  2.  **Actor vs. Cause:** The account should **deflate talk of actors into talk of causes** for non-humans. "Actor" implies the capacity to do otherwise or respond to interpretation. A volcano does not respond to sanctions or pleas. Preserving the distinction prevents the anthropomorphizing of geophysics, which obscures the specific human responsibility in managing the risk (Case 3).
  3.  **Evidential Clause:** The account **must include this** (Requirement 1). As a scientist, you know that a signal without a detectable proxy is noise. A historical claim that cannot, in principle, be tested against a record (textual or natural) is metaphysics, not history.

  **VI. Evaluation of Main Families**

  | Family | Performance on Specification | Critical Failure Point |
  | :--- | :--- | :--- |
  | **Environmental Determinism** | Fails. | Violates **Mediation Specification**. Treats forcing as direct cause (fails Case 3 & 7). |
  | **Possibilism** | Partial Pass. | Handles limits well, but often lacks **Evidential Tractability** for specific events. Too vague on *which* possibility was realized and why. |
  | **Counterfactual / Difference-Making** | Strong Pass. | Excellent on **Evidential Tractability** and **Scale**. Struggles with **Feedback Loops** (hard to model complex system counterfactuals). |
  | **Actor-Network (ANT)** | Mixed. | Strong on **Mediation**, but fails **Agency Distinction**. Symmetry obscures the difference between a virus and a policy (ontological flattening). |
  | **Earth-System / Anthropocene** | Strong Pass. | Excellent on **Feedback** and **Evidence**. Risks swamping human **Semantic Causality** (Case 5) under geophysical magnitude. |

  **Summary Verdict:** The Earth-system narrative comes closest to satisfying the physical constraints, but it must be integrated with a Counterfactual approach to ensure social mechanisms and evidence standards are not lost in the geophysics. Determinism is obsolete; ANT is ontologically confusing.
