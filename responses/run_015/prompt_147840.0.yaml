          *   Relational aspect: The "files" are pointers to the "blob." The blob is the substance; the path is the relation.
          *   Haecceitist view: A haecceitist would hate this *if* they believed every file instance had a primitive "thisness." But they can accept it as an optimization.

      *   *Law (Fungibility vs. Specificity):*
          *   Practice: Money/Grain = Fungible (replaceable). Bike/Heirloom = Specific (irreplaceable).
          *   Implicit Theory: Identity is context-dependent. Some objects are defined by type (universal), some by token (particular).
          *   Underdetermination: Physically, every grain of sugar is distinct (impurities, position). Legally, we *stipulate* fungibility. It's a social contract, not a discovery of nature.
          *   Haecceitist view: Compatible. The law *ignores* haecceity for sugar but *respects* it for bikes.

      *   *Physics (Stat Mech/QM):*
          *   Practice: Divide by $N!$. Permutations aren't new states.
          *   Implicit Theory: Particles lack primitive thisness (Haecceity). They are excitations of a field or purely qualitative bundles.
          *   Underdetermination: Gibbs Paradox resolution. If we don't divide, entropy isn't extensive. Is this because particles *are* indistinguishable, or because we *can't distinguish* them?
          *   The "Measurability" angle: If we could tag them (like colloids), we wouldn't divide. So it's about access/interaction, not just "being."
          *   Haecceitist view: A haecceitist *must* say the permutations exist metaphysically but are epistemically inaccessible. But then why does nature care (entropy)? If nature counts states, and nature doesn't count permutations, nature isn't a haecceitist.

  3.  **Developing the Core Argument (The "Pick a Side" Phase):**

