answer: |-
  This is a sophisticated epistemological problem disguised as an editorial policy question. You are grappling with the **Lottery Paradox** (case a) versus the **Gatecrasher/Blue Bus Paradox** (case g), mediated by the **Preface Paradox** (cases b, c, e) and the engineering reality of **Common-Cause Failure** (case d).

  Your intuition is correct: standard probability thresholds are insufficient. A probability of 0.999 justifies a bet in (a) but not a verdict in (g). The difference lies not in the math, but in the *relationship between the evidence and the specific truth of the claim.*

  Here is a candidate principle designed for journalism, incorporating the reliability engineering insight your partner offered without reducing your craft to it.

  ### The Principle of Sensitive Independence

  To print a factual claim $C$ about a specific entity or event, three conditions must be met:

  1.  **The Threshold Clause:** $P(C)$ must exceed a threshold $T$, where $T$ rises with the stakes of the error and falls with the visibility/cost of correction. (This handles your case f).
  2.  **The Independence Clause:** The probability estimate must not be vulnerable to an untested **common-cause failure**. If the error risk is correlated across the system (e.g., a single sensor, a single batch), you cannot assert individual claims until the common cause is ruled out. (This handles your case d).
  3.  **The Sensitivity Clause:** The evidence supporting $C$ must **track the truth** of $C$. If $C$ were false, the evidence you currently possess would likely be different. Naked statistical base rates about a class do not track the truth of a specific member unless the class mechanism *constitutes* the reality of the member. (This separates a from g).

  Additionally, you must observe a **Norm of Non-Conjunction**: You may assert individual claims that clear the bar, but you may not assert the conjunction of those claims (e.g., "Every line is correct") as a single fact, even if the joint probability is high. (This handles b, c, e).

  ---

  ### Testing the Principle Against Your Cases

  *   **(a) The Lottery:** **Passes.**
      *   *Threshold:* Extremely high ($>0.999999$).
      *   *Independence:* The mechanism (random draw) guarantees independence of tickets.
      *   *Sensitivity:* This is the tricky one. Philosophically, if ticket 437 *were* the winner, your evidence (1 in 10M) would be the same. However, because this is a **prediction about a closed system** rather than a retrodiction about an open one, the "Sensitivity" requirement is relaxed for future-tense claims based on constitutive rules. The lottery rules *make* the odds true.
  *   **(b) & (c) Database/Book:** **Passes.**
      *   *Threshold:* 0.997 is high enough for individual lines (low stakes per line, corrigible).
      *   *Independence:* Audits suggest independent errors.
      *   *Non-Conjunction:* You correctly refuse to assert "All lines are correct." The principle mandates this. The "Preface" admission is not a claim about a specific error, but a meta-commentary on the process, which is permissible.
  *   **(d) Single Sensor:** **Fails.**
      *   *Independence:* Violated. The 0.997 figure is illusory because the error is correlated (common-cause). If the sensor is wrong, *all* lines are wrong. You correctly pulled the database.
  *   **(e) Double Audit:** **Passes (Individual), Fails (Conjunction).**
      *   *Independence:* Restored. Two methods reduce common-cause risk.
      *   *Non-Conjunction:* Your gut refuses to print "Every line is correct." The principle agrees. Even at 97% joint probability, asserting the conjunction invites a binary falsification ("Find one error and the statement is false") that individual claims do not.
  *   **(f) Conjunctive Reporting:** **Passes.**
      *   *Threshold:* 0.92 is lower, but stakes are narrative, not binary data.
      *   *Sensitivity:* The evidence (witness + lab) tracks the specific truth. If the official wasn't there, the witness wouldn't say she was. This is not naked statistics; it is causal evidence.
  *   **(g) The Blue Bus:** **Fails.**
      *   *Sensitivity:* Violated. If it *wasn't* the company's van (the 1 in 1,000), your evidence (fleet ownership stats) would be exactly the same. The evidence does not track the specific truth of the accident, only the population distribution.
      *   *Even with Random Dispatch:* Your unease is defensible. Random dispatch makes the *probability* accurate, but it does not create *sensitive evidence*. You are still relying on a base rate, not a trace.

  ---

  ### Predictions for New Cases

  **1. Clumped Errors (Bad Batch)**
  *   *Scenario:* Expected wrong lines = 12, but they are concentrated in one block of 50 due to a batch contamination.
  *   *Prediction:* You **cannot** print the lines in that batch, even if the per-line calculated probability remains 0.997.
  *   *Reasoning:* This violates the **Independence Clause**. Reliability engineering teaches us that redundancy doesn't help if the failure mode is shared. You must test the batch integrity before asserting the lines. If you cannot isolate the batch, you must lower the confidence of *all* lines or withhold the database.

  **2. The Two Hundred Documents**
  *   *Scenario:* Source sends 200 docs, says "Exactly one is forged." You examine Doc #1, find no obvious signs of forgery.
  *   *Prediction:* You **cannot** print "Doc #1 is authentic" if your *only* evidence is the source's note and the absence of obvious flaws.
  *   *Reasoning:* This is structurally identical to (g) The Blue Bus. It is naked statistical evidence (199/200 chance). If Doc #1 *were* the forgery, your current evidence (the note + visual inspection) might not change. You need **sensitive evidence** specific to Doc #1 (e.g., metadata verification, chain of custody) that would look different if it were the forged one.
  *   *Nuance:* You *can* print "Doc #1 appears consistent with authentic records," but not the flat factual claim "Doc #1 is authentic."

  **3. The "Every Line is Correct" Question**
  *   *Scenario:* Two audits agree, joint probability 97%.
  *   *Prediction:* Do **not** print "Every line is correct."
  *   *Reasoning:* The **Norm of Non-Conjunction**. A claim about the whole set is a different speech act than a set of claims. It invites a "gotcha" falsification that undermines the utility of the database. Instead, print: "We estimate fewer than X errors remain." This is a claim about the *error rate*, which is supported by the audit, rather than a claim about the *zero-error state*, which is not.

  ---

  ### Hard Truths: What Must Be Overturned

  You asked me to be honest about which verdicts this principle cannot save.

  **1. You must overturn your comfort with (a) if you treat it as a knowledge claim.**
  If you stand by (a) ("Ticket 437 will lose"), you must acknowledge that you are making a **pragmatic assertion**, not a claim of knowledge. In philosophy, this is the "Lottery Paradox": you don't *know* the ticket will lose (because your evidence isn't sensitive), but you are licensed to *act* as if it will.
  *   *Advice for your talk:* Distinguish between **Reporting Facts** (past/present) and **Reporting Expectations** (future). You can print "Ticket 437 is expected to lose" or "It is virtually certain to lose." Avoid the flat "Ticket 437 will lose" if you want to be philosophically airtight, though in practice, no editor will fault you for it. The principle saves this by classifying it as a prediction based on a closed system, which has lower evidentiary burdens than retrodiction.

  **2. You must overturn the idea that (g) becomes okay with random dispatch.**
  You wrote: *"when I make (g) airtight by stipulating that vans are assigned to identical routes by a random dispatcher, I still don't feel right printing the flat sentence."*
  *   *Verdict:* **Trust that unease.** It is defensible. Even with random dispatch, you lack **Sensitive Evidence**. If you are sued, and it turns out it was the 1-in-1,000 independent van, you have no causal story to tell. Journalism, like law, requires a causal link, not just a statistical likelihood, for specific liability. Printing "It was Company X" implies you traced the van, not just the fleet.
  *   *Fix:* Print "Company X's vans account for 99.9% of traffic in the area; investigators have not ruled them out." That is accurate and safe.

  **3. Belief vs. Printing.**
  You asked: *"whether the principle you like is really a principle about what to print or only about what to believe."*
  *   *Answer:* It is a principle about **what to print**.
  *   *Reasoning:* You can rationally *believe* every claim in your book is true while simultaneously *believing* the book contains an error (The Preface Paradox). This is not irrational; it is probabilistic coherence. However, **printing is a warranty.** When you print "X is true," you are inviting the reader to rely on X for *their* decisions.
  *   *The Distinction:* Belief is internal; Printing is a speech act that transfers risk. The **Threshold Clause** and **Non-Conjunction Norm** are ethical constraints on that transfer, not constraints on your internal state. You can believe the database is clean (97% chance); you cannot print that it *is* clean (binary claim).

  ### Summary for Your Talk

  When you stand before the standards editors, do not offer them a probability threshold. Offer them a **Theory of Evidence**.

  Tell them: *"We do not print numbers; we print relationships between evidence and truth. A number is good enough to print when it is **Independent** (not subject to hidden systemic failure), **Sensitive** (the evidence would change if the fact were false), and **Local** (we do not assert the conjunction of many claims as a single fact)."*

  This allows you to keep the database (independent audits), keep the lottery prediction (closed system), keep the narrative reporting (causal evidence), but reject the Blue Bus verdict (naked stats) and the Single Sensor data (common-cause failure). It respects the engineering reality your partner sees while protecting the journalistic integrity you require.
