      *   **Zhuangzi:** Ontological/Ethical project. Goal: Freedom/Flow (*Xiaoyao*). Method: Perspectival shifting. Butterfly dream: Not about "am I dreaming?" but "who am I now?" Conclusion: *Wuhua* (transformation). Fear: Rigidity/Attachment to a fixed self.
      *   **The Gap:** Descartes wants to *stop* the doubt to build knowledge. Zhuangzi wants to *lean into* the doubt to liberate the self.
      *   **Disjunctivism:** McDowell, etc. Veridical perception and hallucination are fundamentally different states, not just phenomenologically similar. This challenges the "common kind assumption" underlying skepticism.
      *   **Application to Zhuangzi:** If waking and dreaming are distinct kinds, Zhuangzi's point isn't that we can't tell them apart, but that the distinction doesn't matter for the *flow of transformation*.

  3.  **Drafting the Argument - Section by Section:**

