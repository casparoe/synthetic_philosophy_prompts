          2.  *Succession:* It's actually a sequence of programmes (A1, A2, A3) linked by family resemblance.
          3.  *Laudan's Research Traditions:* Mention Larry Laudan. He specifically fixed this Lakatosian problem by allowing "research traditions" to have mutable core assumptions. This is a crucial addition to the answer.
      *   **Progressive/Degenerating Status:** If the core drifts, evaluation becomes harder. If the drift generates novel predictions, it's progressive *despite* the drift. If the drift is just semantic to save face, it's degenerating.

