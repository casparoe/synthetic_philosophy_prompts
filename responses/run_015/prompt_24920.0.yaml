prompt: |-
  I watched this documentary on Netflix about how language shapes the way we think, and there was this part where the narrator summed up the Sapir-Whorf hypothesis. I wrote down what he said as best I could:

  "The Sapir-Whorf hypothesis says that the language you speak determines how you perceive and think about the world. For example, the Hopi people have no words for time, no tenses, no way to talk about past and future, and as a result they don't experience time the way we do — they live in a kind of eternal present. Another example: Russian speakers have different words for light blue and dark blue, and experiments show they can distinguish shades of blue faster than English speakers, which proves that language literally changes what you can see. The strong version of the hypothesis — that language completely determines thought — has been disproven, but a weaker version — that language influences thought — is now accepted by basically all linguists. So the takeaway is: your language is a pair of glasses you can't take off, coloring everything you experience, and if your language lacks a word for something, you literally can't think it."

  I've been going down rabbit holes about this topic and somthing feels off about this summary but I can't put my finger on where. I know enough to be suspicious — like I've heard the Hopi thing might be overblown — but I don't know the details. Can you go through this paragraph and tell me what's accurate, what's a distortion, and whether the overall picture it paints is fair to what linguists and psychologists actually believe? I'm especially curious about whether the glasses metaphor at the end follows from anything solid in the research or if that's the documentary being dramatic.
