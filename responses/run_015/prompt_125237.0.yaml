answer: |-
  **To:** The Editorial Board, *The Synthesis*
  **From:** Junior Editor, Epistemology Working Group
  **Subject:** Testimony Evaluation Protocol (STEP) – Draft for Adoption

  Per our faculty advisor's guidance, the following procedure formalizes how we evaluate claims based on testimony. It is designed to be run during our bi-monthly meetings without requiring philosophical training, but it preserves the logical distinction between **Reductionism** (trust requires independent proof of reliability) and **Anti-Reductionism** (trust is default unless there are specific reasons to doubt).

  This protocol does not force the board to choose one philosophy forever. Instead, it identifies exactly where the two philosophies disagree, allowing us to flag those moments for deliberate discussion.

  ***

  # The Synthesis Testimony Evaluation Protocol (STEP)

  **Instructions:** For any submission where a key claim ($p$) rests primarily on a speaker's or author's assertion rather than data provided in the text, run the following checklist.

  ### Phase 1: The Defeater Scan (Common Ground)
  *Both Reductionists and Anti-Reductionists agree that if there are strong reasons to doubt the speaker, the claim must be rejected.*

  **1.1 Internal Consistency Check**
  *   **Question:** Does the testimony contradict itself or established facts presented elsewhere in the same essay?
  *   **Stop Rule:** If **YES**, issue verdict: **REJECT**. (Reason: Internal incoherence).
  *   **If NO:** Proceed to 1.2.

  **1.2 External Defeater Check**
  *   **Question:** Is there direct evidence available to the board that the speaker is lying, mistaken, or lacked access to the information? (e.g., known retractions, proven alibis, physical impossibility).
  *   **Stop Rule:** If **YES**, issue verdict: **REJECT**. (Reason: Positive defeater).
  *   **If NO:** Proceed to Phase 2.

  ### Phase 2: The Reliability Gap (The Split Point)
  *This is the critical juncture. Reductionists require positive evidence here; Anti-Reductionists do not.*

  **2.1 Independent Corroboration Check**
  *   **Question:** Is there evidence *outside* of the testimony itself that confirms the speaker's reliability regarding this specific claim? (e.g., lab notes, third-party verification, matching historical records).
  *   **Test:** Can we verify the *process* that led to the claim, not just the claim itself?
  *   **If YES:** Proceed to Verdict A.
  *   **If NO:** **STOP AND BRANCH.** Do not proceed to Verdict A. Move to Verdict B.

  ### Phase 3: Verdict Determination
  *Apply the outcome based on the result of Phase 2.*

  **Verdict A (Corroboration Found)**
  *   **Outcome:** **ACCEPT AS TESTIMONY-JUSTIFIED.**
  *   **Logic:** Both Reductionist and Anti-Reductionist standards are met. The claim is safe for publication.

  **Verdict B (No Corroboration Found)**
  *   **Outcome:** **REFER TO BOARD JUDGMENT.**
  *   **Logic:** The procedure has identified the Epistemic Split.
      *   **If the Board operates as Reductionists:** The verdict is **REJECT**. (Reason: Lack of independent grounding).
      *   **If the Board operates as Anti-Reductionists:** The verdict is **ACCEPT**. (Reason: No defeaters were found in Phase 1; testimony carries presumptive weight).
  *   **Action:** The Editor-in-Chief must call a vote on the journal's "Epistemic Stance" for this specific category of claim. The vote is not on the *fact*, but on the *standard of proof*.

  ***

  # Worked Applications

  The following cases demonstrate how STEP functions in practice. Note how the procedure isolates the disagreement.

  ### Case 1: The Unreplicable Expert Report
  **Submission:** An essay in neuroscience cites a verbal communication from a tenured professor at a major research university. The professor claims to have observed a novel neural pathway. The experiment was a one-time occurrence; the data logs were corrupted, and the experiment cannot be replicated.
  **Claim:** "Neural Pathway X exists."

  **Running the Protocol:**
  *   **Phase 1.1 (Consistency):** No internal contradictions in the essay. **Pass.**
  *   **Phase 1.2 (External Defeaters):** No evidence the professor is lying or physically incapable of the observation. **Pass.**
  *   **Phase 2.1 (Corroboration):** Is there independent evidence of reliability?
      *   *Analysis:* The data is lost. The experiment is unreplicable. There is no third-party verification of the *result*.
      *   *Result:* **NO.**
  *   **Phase 3 (Verdict B - The Split):**
      *   **Reductionist Path:** Requires independent grounding. Since Phase 2.1 failed, the justification is incomplete. **Verdict: REJECT.**
      *   **Anti-Reductionist Path:** Requires only absence of defeaters. Since Phase 1 passed, the testimony is prima facie justified. **Verdict: ACCEPT.**

  **Divergence Flag:** The split occurs at **Phase 2.1**.
  **Why it feels counterintuitive:** Intuitively, we want to trust a tenured professor (Anti-Reductionist outcome). However, the Reductionist path demands we reject the claim because the *process* cannot be verified, regardless of the person's status. The procedure forces the board to admit that accepting this claim is a choice to prioritize *speaker status* over *independent verification*.

  ### Case 2: The Anonymous Historical Document
  **Submission:** A history essay relies on a pamphlet from 1790 describing a local riot. The pamphlet is unsigned. No archival record exists of who printed it or which faction sponsored it.
  **Claim:** "The riot was initiated by Group Y."

  **Running the Protocol:**
  *   **Phase 1.1 (Consistency):** No internal contradictions. **Pass.**
  *   **Phase 1.2 (External Defeaters):**
      *   *Analysis:* The anonymity is total. In historical methodology, unknown provenance for a contentious claim is often treated as a defeater because the author's motive (bias) cannot be assessed.
      *   *Result:* **YES.** (Anonymity regarding a contentious event counts as a defeater for perceptual access/honesty).
  *   **Phase 3 (Verdict):**
      *   **Stop Rule Triggered at 1.2.**
      *   **Verdict:** **REJECT FOR LACK OF INDEPENDENT CORROBORATION.**

  **Outcome:** Both Reductionist and Anti-Reductionist paths converge here. Even the Anti-Reductionist must reject the claim because Phase 1 identified a specific reason to doubt (unknown authorship prevents assessing bias). The procedure saves time by rejecting this before reaching the philosophical split at Phase 2.

  ***

  # The Unsettleable Gap: Value Judgments & Social Position

  This procedure cannot settle whether **social position, institutional authority, or demographic identity** count as "Independent Corroboration" in Phase 2.1.

  *   **The Reductionist Problem:** If we count "Tenured Professor" as sufficient corroboration in Phase 2.1, we are effectively treating *authority* as *evidence*. A strict Reductionist might argue this is a fallacy (Appeal to Authority) and that only data counts.
  *   **The Anti-Reductionist Problem:** If we count "Anonymous" as a Defeater in Phase 1.2, we are making a value judgment that *identity* is required for trust. A strict Anti-Reductionist might argue the words should stand on their own regardless of the speaker.

  **Procedural Limit:**
  STEP treats "Institutional Authority" as a **Board Discretion Variable**.
  *   When voting at **Phase 3 (Verdict B)**, board members must explicitly state if they are counting the speaker's title as "Corroboration."
  *   **Warning:** If the board accepts a claim *solely* because of the speaker's identity without data, you are making a **sociological judgment**, not an epistemic one. You are deciding that *who* speaks matters more than *what* is said. This procedure flags that choice but cannot justify it for you.

  **Instruction for the Board:** When you encounter a "Refer to Board Judgment" verdict, do not argue about the facts. Argue about whether our journal treats *institutional prestige* as a valid form of verification. That is a policy decision, not a procedural one.
