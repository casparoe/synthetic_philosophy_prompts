  the ai alignment crowd keeps fighting over whether models should do utilitarian reasoning or deontological reasoning, and every panel ends in the exact same stalemate. i think part of the problem is that people confuse a criterion of rightness with a decision procedure - like, asking an LLM to "be a utilitarian" might mean optimizing outcomes, while "be a deontologist" might mean following hard constraints, but those operate at different levels and arent really rivals. but maybe theres also a hidden empirical disagreement about how reward-model generalization actually works that neither side admits? diagnose whether this stall is verbal, a real moral-theory clash, or just engineers and philosophers answering different questions under one heading. and tell me honestly: what would count as progress - a formal result, a conceptual distinction, or are we just stuck with bedrock intuitions?
reasoning: |-
