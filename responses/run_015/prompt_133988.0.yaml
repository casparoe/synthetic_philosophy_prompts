answer: |-
  Here is an attempt to bring your cases and your intuitions into reflective equilibrium. I will propose two candidate principles, select the stronger one, test it against your hardest cases, and then address the two meta-questions you raised about units and evaluation.

  ### Candidate Principles

  **Principle 1: The Resilience Threshold**
  A society collapses when it suffers a significant reduction in socio-political complexity (population, hierarchy, specialization) that it fails to recover within a timeframe equal to two generations, regardless of the welfare of the survivors.
  *   *Motivating Cases:* This handles **Case 8** (slow, permanent shrinkage = collapse) versus **Case 9** (fast, temporary shock = disaster). It explains why **Case 1** (Mycenae) is a collapse (no recovery for centuries) while **Case 2** (Maya) is ambiguous (recovery occurred in the north, continuity in the south).
  *   *Cost:* It struggles with **Case 4** (Glasshouse). Glasshouse involves a reduction in complexity (fewer people, less maintenance), but you do not call it collapse. To accommodate this, you must add a clause excluding reductions that are the result of deliberate optimization for welfare or values. It also struggles with **Case 10** (Aqueducts), as losing a technology is a loss of complexity, but you reject the label. You would need to specify that the complexity lost must be *organizing* complexity, not just *technical* capacity.

  **Principle 2: The Continuity of Meaning**
  A society collapses when the specific symbolic or institutional tools required to transmit its self-conception to the next generation are lost, such that the successors cannot recognize or reproduce the predecessor's form of life, provided this loss is not a deliberate substitution of one coherent identity for another.
  *   *Motivating Cases:* This handles **Case 1** (Script lost = collapse) versus **Case 10** (Aqueducts lost = not collapse). Script is constitutive of identity and memory; aqueducts are instrumental. It handles **Case 4** (Glasshouse) because the new religion provides a *new* coherent identity, deliberately chosen, rather than a loss of capacity to mean anything. It handles **Case 9** because the form of life returned; the break was not permanent.
  *   *Cost:* It struggles with **Case 3** (Rapa Nui). If the loss is caused by external genocide/disease, is it a failure of "transmission"? You would need to stipulate that the *mechanism* of loss (internal vs. external) does not change the *status* of the outcome. It also struggles with **Case 6 & 7** (Conquest), because the "self-conception" depends entirely on whether you define the society as the Kingdom (lost) or the Villages (persisted).

  ### The Best Candidate: A Synthesis

  To capture your intuitions most accurately, I propose combining these into a single principle.

  **The Principle of Irreversible Constitutive Loss:**
  *A society collapses when it suffers a reduction in its capacity for social coordination that becomes permanent within its own historical memory, and this reduction entails the loss of constitutive tools (symbols, scripts, institutions) required to maintain its prior self-conception, provided this loss was not the result of a deliberate, coherent collective choice to adopt a new identity.*

  **Where this principle misfires and the cost of repair:**

  1.  **Case 3 (Rapa Nui):** The principle implies an internal failure of capacity. Rapa Nui was destroyed externally.
      *   *The Cost:* You must add a clause: "regardless of whether the trigger was internal or external." This accepts your intuition that a house destroyed by an earthquake has still collapsed, even if the house didn't fail structurally on its own. You sacrifice the idea that collapse implies moral or systemic fault.
  2.  **Case 6 & 7 (Conquest/Unit):** The principle relies on "its prior self-conception." If the unit is the Kingdom, the self-conception is gone. If the unit is the Village, the self-conception (local, agrarian) remains.
      *   *The Cost:* You must accept that "collapse" is relative to the *political unit* being observed, not the biological population. This means your friend is partially right: calling it a collapse does import a preference for the Kingdom level over the Village level.
  3.  **Case 5 (Future Rich Country):** This is the hardest test.
      *   *Application:* Under the principle, is this a collapse?
          *   *Reduction in coordination?* Yes (fewer people, less building).
          *   *Permanent?* Yes (fertility trends suggest it).
          *   *Loss of constitutive tools?* This is the pivot. Is "building for millennia" a constitutive tool of this society's self-conception? If the society viewed itself as a bridge to the deep future, then yes, losing that capacity is a loss of self-conception. If it viewed itself as a comfort-maximizer, then no.
          *   *Deliberate choice?* Here lies the difference between **Case 4 (Glasshouse)** and **Case 5**. In Glasshouse, a new religion drove the change—a coherent new identity. In Case 5, you describe "fertility long below replacement" and "language heavily anglicized." This sounds like drift, entropy, or passive assimilation, not a deliberate adoption of a new coherent identity.
      *   *Verdict:* The principle classifies Case 5 as **Collapse**. The loss of the capacity to project oneself into the future (monuments, stable language, institutions) is a loss of constitutive tools, and it is happening via drift, not choice. This matches your current intuition.

  **A New Constructed Case:**
  *The Archive.* A global digital civilization stores all its knowledge, law, and art in a cloud infrastructure. Over a century, energy costs rise, and the society decides to delete 90% of the archive to save power, keeping only practical manuals. They live longer and richer lives. Within two generations, the encryption keys are lost; the remaining archive cannot be read.
  *   *Verdict:* **Collapse.**
  *   *Reasoning:* Even if welfare is high, the loss of the *access* to their own past (the encryption keys) functions exactly like the loss of script in Case 1. It is a constitutive loss. It distinguishes this from Case 10 (aqueducts) because the archive is memory, not plumbing.

  ### The Unit Question

  You asked: *Is collapse always collapse of something, and if the unit can be chosen to make any verdict come out either way, is the concept too gerrymanderable?*

  Your worry in **Case 6 and 7** is well-founded. If I can define the society as "The Empire" and call it a collapse, or "The Peasantry" and call it continuity, have I said anything real about the world?

  The answer is that "society" is not a natural kind like "gold" or "water." It is a functional description. Therefore, collapse is always collapse *of a specific order of complexity*.
  *   In **Case 2 (Maya)**, your friend says you are special pleading. You are not, provided you specify: "The Divine Kingship collapsed; the Maya civilization did not."
  *   In **Case 6 & 7**, the verdict changes because you are measuring two different systems. The *State* collapsed; the *Local Community* did not.

  Is the concept too gerrymanderable? No, but it requires precision. If you use the word "collapse" without specifying the *unit* (the polity, the culture, the population), you are indeed moralizing. You are implicitly saying, "The level of organization I care about has vanished." To use the term honestly, you must attach it to a specific structure. "The Bronze Palace System collapsed" is a factual claim. "The Greek World collapsed" is a moral claim.

  If you accept this, you do not need to abandon the word. You simply need to acknowledge that it describes the failure of a *structure*, not necessarily the death of a *people*.

  ### The Evaluative Question

  You asked: *Does calling something a collapse entail that something valuable was lost? Is it just a graph?*

  Your friend argues that "collapse" is just a graph of complexity going down, and calling it "collapse" smuggles in the value judgment that complexity is good.

  Here is the distinction: **Capacity is not a value; it is a fact. But the loss of capacity is a fact that enables value judgments.**

  If a society loses the ability to write (Case 1), that is a factual loss of a specific capacity. Whether that is "bad" depends on what you think writing is for. However, if a society loses the ability to *recognize itself* (the Continuity of Meaning), that is a break in causal continuity.
  *   **The Graph:** A graph shows population and energy use.
  *   **The Collapse:** The graph cannot show whether the grandchildren can read the grandparents' letters.

  So, is the word neutral? No. It entails that a *loss of capacity* occurred. But your friend is right that it often smuggles in the idea that the *previous* capacity was worth having.
  *   In **Case 4 (Glasshouse)**, the graph goes down (fewer people, less building), but you reject "collapse." Why? Because the capacity lost (monumental building) was traded for a capacity gained (longer life, spiritual coherence).
  *   In **Case 1 (Mycenae)**, the graph goes down, and you accept "collapse." Why? Because the capacity lost (literacy, trade) was not traded for anything; it was simply gone.

  Therefore, "collapse" is not just a graph. It is a graph *plus* a judgment about whether the loss was a *trade-off* or a *degradation*. If the loss is a degradation (unintended, irreversible loss of coordinating tools), the term applies. If the loss is a trade-off (Glasshouse), the term does not apply.

  ### Conclusion: Should You Stop Using the Word?

  Your friend is half-right: "Collapse" is often used to moralize about people who were not us. It is often used to say, "They sinned, and so they fell." You should stop using it in that sense.

  However, your friend is wrong that *all* uses are moralizing. There is a factual core: the irreversible loss of the tools required for a specific form of social continuity.

  **Which of your verdicts has to go?**
  To maintain consistency with the **Principle of Irreversible Constitutive Loss**, you must revise **Case 6 (Regional Kingdom Overrun)**.
  *   *Reasoning:* If the villages (Case 7) continue, and the people are better off, and the only thing lost is the *administrative layer* (taxes, conscription, capital), then the *society* (the people and their local form of life) has not collapsed. The *State* has collapsed.
  *   *Correction:* You must distinguish between **State Failure** and **Societal Collapse**. Case 6 is State Failure. Case 1 is Societal Collapse. If you conflate them, you validate your friend's claim that you are just valuing Empire over Village.
  *   *Action:* Keep the word "collapse" for Case 1, 3, 5, 8. Use "conquest" or "state failure" for Case 6. This aligns your terminology with your intuition in Case 7, removing the contradiction that worries you.

  If you make that distinction, you can keep the word. It describes a real phenomenon: the point where a community loses the ability to be the thing it was, not because it chose to become something else, but because it lost the tools to be itself. That is not just a graph.
