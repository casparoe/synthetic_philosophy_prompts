answer: |-
  **To:** The Interpretation Committee
  **From:** [Your Name], Reader in Philosophy
  **Date:** 5 March 2024
  **Subject:** Philosophical Opinion regarding the Endowment for the Gallery of Civilisational Collapse

  Colleagues,

  We are convened to consider a gift of £4.2m contingent upon the use of the word 'collapse' in the gallery title. The donor's test—abandonment of cities and disuse of script within three generations—is archaeologically specific but philosophically loaded. We face three competing imperatives: curatorial accuracy (institutions ended, people persisted), ethical duty to descendant communities (the label inflicts harm), and educational efficacy (the word 'collapse' drives engagement). I write to clarify the ontology of 'collapse', assess the proposed 'descendant veto', and recommend a course of action.

  First, we must determine what 'collapse' is properly predicated of. It is a category error to predicate it of a 'people' or an ethnic group. People do not collapse; they migrate, adapt, or assimilate. Nor should it be predicated of 'civilisation' as a monolithic cultural spirit. Properly, collapse is predicated of a **polity**—a politically organised unit—and specifically of its **institutional arrangement**. When we speak of the Classic Maya collapse, we refer to the failure of divine kingship and the calendar tradition, not the extinction of Maya people. By anchoring the term to institutional complexity rather than human continuity, we satisfy the curators' objection without diluting the donor's requirement. The cities were abandoned; the script fell silent. The *system* collapsed, even if the *society* transformed.

  This brings me to the principle I previously floated: the 'descendant veto'. This principle holds that a polity may only be described as collapsed if no living community claims descent or maintains practices. I recommend we **reject** this veto, though not lightly. We must face two difficulties. First, as the curators note, it makes the truth-value of a historical description contingent on present-day demography. Whether the Bronze Age Eastern Mediterranean 'collapsed' would depend on whether a modern group claims inheritance, rendering history unstable. Second, and more troublingly, the veto licenses the harshest language precisely where there is no one left to object. It reserves the label of 'failure' for the most complete destructions, implying that the voiceless dead are the only ones we may freely disparage. This ethical asymmetry is untenable. We cannot allow the absence of survivors to become a license for defamatory historical judgment.

  However, rejecting the veto does not mean we ignore the descendant communities. Their objection is not merely about feelings; it is about the wrong of being exhibited as a failed state. We accommodate this not by silencing the word 'collapse', but by rigorously defining its subject in the interpretive text.

  Regarding the educational framing: does the question 'could it happen to us?' survive the disanalogy between ancient regional subsystems and our planetary civilisation? The ancient cases had neighbours unaffected by the collapse; we have no outside. The analogy holds only if we clarify what is at risk. It is not biological extinction, but **systemic simplification**. The risk is not that humanity will vanish, but that our global institutional arrangements—supply chains, governance, energy grids—might undergo the same rapid loss of complexity as the Bronze Age palaces. The gallery must teach that collapse is not an apocalypse, but a unraveling of complexity that living people must endure.

  **Recommendation**
  I recommend **accepting the gift while re-engineering the interpretive text** so that every use of 'collapse' has an explicit subject (e.g., 'political complexity') and a stated measure of loss. We cannot vary the title without risking the endowment, and declining the funds would deprive us of the platform to correct the narrative from within.

  **The Rejected Alternative**
  In rejecting the option to **decline the gift**, I acknowledge the strength of the descendant communities' position. Their strongest consideration is that some harms cannot be mitigated by text. If the title itself constitutes a public stigmatisation of living peoples as 'failed', then no amount of internal nuance repairs the injury. Accepting the money makes the museum complicit in a categorisation that perpetuates colonial narratives of disappearance, regardless of our explanatory panels. There is moral integrity in refusing to be the venue for one's own misrepresentation.

  **Conclusion**
  We must walk the line between historical honesty and ethical responsibility. We accept the donor's word but redefine its weight.

  **Proposed Opening Wall Text**
  "This gallery examines the failure of specific political institutions, not the disappearance of peoples, asking how complex societies transform when the systems sustaining them fall away."
