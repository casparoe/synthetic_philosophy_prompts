answer: |-
  **Unstructured Brainstorming & Commitment**

  Candidate framings: (1) Impact as state-distance from a baseline; (2) Impact as loss of future optionality (reachability); (3) Impact as violation of negative constraints. Baselines: (1) Null action (no humans); (2) Status quo (current farming); (3) Counterfactual resource use. Failure modes: Over-penalizing necessary change (goal conflict); under-penalizing cascading effects (horizon too short); baseline hacking (agent manipulates the counterfactual).

  Objection to my initial leaning: I am inclined to say impact measures smuggle in value. Steelman against this: Capacity-based measures (like Attainable Utility Preservation) are formally value-agnostic regarding *which* utilities are preserved, only *that* capacity is preserved. It is a meta-value (preserve flexibility), not an object-level value (preserve quolls). It claims to be a heuristic for robustness under uncertainty, not a value specification.

  Commitment: I argue that while capacity is meta-level, the choice of *which* capacities matter (the auxiliary set) and the *baseline* against which change is measured inevitably encode object-level value judgments about what counts as "normal" or "safe." The "meta-value" of flexibility is not neutral; preserving the capacity to burn fossil fuels is different from preserving the capacity to sequester carbon.

  Trade-off: By choosing this, I give up the hope that impact regularization solves the specification problem. I accept it is merely a robustness heuristic that requires domain-specific tuning to be useful. It is not a substitute for value alignment.

  **1. Disciplined Mapping**

  **Principal:** Queensland Bureau of Sugar Experiment Stations.
  **Deployment:** Release of *Bufo marinus* into cane fields.
  **Objective:** Reduce greyback cane beetle larvae density.
  **Environment:** Queensland agro-ecosystem (cane, beetles, native predators).
  **Inaction Baseline:** This is the whole ballgame. "No human intervention" is wrong because it penalizes farming itself. "No release" is better but ambiguous: does it mean "no toads, same pesticides" or "no toads, no pesticides"? A low-impact measure needs the baseline to be "continued use of existing chemical/mechanical controls." This isolates the marginal impact of the toads. If the baseline is chosen technically (e.g., literal agent inaction), the measure flags all farming as impact. If chosen normatively (e.g., "industry standard practice"), it smuggles in the value judgment that current farming methods are safe. The choice determines whether ecological disruption is counted as impact or background noise.

  **2. Running Specific Measures**

  **Baseline-Relative State/Reachability:** This penalizes divergence from the baseline state or loss of reachability to other states.
  *Flags:* Immediate change in local fauna distribution.
  *Misses:* Long-term toxicity effects if the state representation doesn't include "predator health" or "toxin concentration." It sees "more toads," not "dead quolls."
  *False Positives:* It penalizes the intended beetle reduction, since that is a state change. If the penalty weight is high enough to stop ecological damage, it may forbid the pest control entirely. It cannot distinguish "good change" (fewer beetles) from "bad change" (dead quolls) without value weights. It degenerates into conservatism that blocks the objective.

  **Attainable Utility Preservation (AUP):** Penalizes change in the ability to optimize a bank of auxiliary reward functions.
  *Flags:* Reduction in ability to optimize "native biodiversity" or "livestock safety" IF those are in the auxiliary set.
  *Misses:* If auxiliaries are generic (e.g., "move object A to B"), it misses ecological collapse. It only catches toxicity if an auxiliary function correlates with it.
  *Degeneration:* If the auxiliary set is rich enough to capture "ecosystem health," you have essentially specified value. If it is sparse, it misses the toxicity. It does not forbid action unless the action reduces *general* power; releasing toads might increase local biomass, potentially increasing reachability for some auxiliary functions, yielding a false negative.

  **3. Engaging the Taxonomy**

  Your distinction survives but reveals the limits of impact measures.
  **Option Loss:** Reachability measures handle this well. Releasing toads reduces the option to "have a toad-free north Australia." This is measurable without knowing *why* you want that option.
  **Externalized Harm:** Impact measures miss this without value content. "Harm" requires knowing which states are bad. AUP only catches this if an auxiliary function correlates with the harmed value. If "quoll survival" isn't in the auxiliary set, the harm is invisible.
  **Feedback Corruption:** Structurally blind. Impact measures measure world state, not the principal's epistemic access. If the deployment degrades monitoring (e.g., toads make field surveys impossible), standard impact penalties don't see it unless "monitoring capacity" is an explicit state variable.
  **Replacement:** "Epistemic Impact" needs to be a separate category. Physical side effects are distinct from corrupting the principal's ability to notice them. Current theory lumps them, leading to blind spots.

  **4. The Release-Action Problem**

  This is the framework's breaking point. Standard measures assume $s_{t+1} = f(s_t, a_t)$. Here $s_{t+k}$ is driven by $toads_{t+k}$, which grows exponentially. The agent releases a process, not just an action.
  **Underestimation:** A fixed horizon (e.g., 1 year) sees only the initial release. The divergence is unbounded. A penalty computed over a standard horizon systematically underestimates the risk by orders of magnitude.
  **Repair?** Discounted infinite horizons help but rely on the discount rate being perfectly tuned to ecological timescales (unlikely). Penalizing dynamics changes (changing the transition function $f$) is more appropriate than state changes. But measuring "change in dynamics" requires a model of the true dynamics, which we lack (that's why we have uncertainty).
  **Verdict:** The framework presupposes agency stays bounded. It is built for one-shot optimizers, not released processes. There is no natural repair within current impact measure theory; it requires a shift from measuring state impact to measuring *process containment*.

  **5. Adjudicating the Readings**

  **Foreseeable-but-unmodelled vs. Irreducible Ignorance.**
  Facts: Toxicity was known (bufotoxin). Niche mismatch was the error (toads don't climb cane to eat beetles).
  **Support:** This supports "Foreseeable-but-unmodelled." A measure with auxiliaries for "predator survival" or "dietary overlap" would have flagged risk. The failure was not that the world was unknowable, but that the model excluded relevant variables (predator toxicity).
  **Implication:** Low-impact work is useful *if* the auxiliary set is ecologically informed. It is not value-free; it requires domain knowledge. However, if we treat "ecological knowledge" as "value specification," then impact measures didn't save us; better modeling did. Low-impact work is good for catching known-unknowns, not unknown-unknowns. It is a good use of researcher time only if paired with robust model validation, not as a standalone safety layer.

  **6. The Analogy Break**

  **Toads as Agents vs. Optimizers.**
  Toads are biological agents (fitness maximizers). AI is an artificial optimizer.
  **Undercut:** Yes. Impact measures assume the tool stops when the job is done. Toads don't. The risk isn't specification gaming (the toads aren't trying to game us); it's *deployment dynamics*.
  **Rehabilitation:** If we view advanced AI as continuous services (daemons) rather than one-shot queries, the analogy holds. The risk isn't that the AI misunderstands the goal, but that the deployed process persists and interacts with the environment in unmodeled ways.
  **Shift:** This shifts the focus from "aligning the goal" to "containing the process." Impact measures designed for state distance are insufficient for containing autonomous processes. We need measures that penalize *autonomy* or *persistence*, not just state change. The cane toad case is evidence that impact measures designed for one-shot actions are ill-suited for released agents, whether biological or artificial.

  **Uncertainty:** I am uncertain whether "penalizing dynamics changes" is computationally tractable for high-dimensional systems. Theory has little to say here beyond "it's hard." I am also uncertain if the distinction between "agent" and "optimizer" holds at advanced AI levels; if an AI modifies its own code, it becomes a released process similar to the toads.
