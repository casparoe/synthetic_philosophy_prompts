answer: |-
  1. "Short answer"
  There is no single, canonical term that perfectly captures this specific dynamic, though the device itself is called an **Intuition Pump**. The phenomenon you are describing is best understood as a misunderstanding of how intuition pumps work, specifically conflating the **surface features** of the scenario with the **deep structure** of the argument.

  2. "Closest existing terms"
  **Intuition Pump:** Coined by Daniel Dennett, this term describes thought experiments designed to "pump" a specific intuition from the reader. Dennett explicitly warns that bad pumps hide premises in the details, but the term focuses on the *designer's* tool rather than the *audience's* error. It fits because it identifies the story as a tool for accessing feeling, but it doesn't fully name the error of treating the tool's incidental details as logically load-bearing.

  **Surface Features vs. Deep Structure:** In cognitive science and education research, novices tend to categorize problems by "surface features" (trains, planks, buses) while experts categorize by "deep structure" (conservation laws, moral principles). This fits your observation that people argue about the concrete details (surface) instead of the underlying principle (deep). However, this term is usually applied to problem-solving performance rather than philosophical argumentation about the validity of the details themselves.

  **The Concreteness Effect:** This is a psychological phenomenon where concrete information is remembered and weighted more heavily than abstract information. It explains *why* people get stuck on the details (because concrete stories feel more real and significant). However, it describes a cognitive bias in memory and weighting, not the specific argumentative error of treating psychologically necessary details as logically relevant premises.

  3. "What I actually keep seeing"
  The phenomenon is a category error regarding the *function* of narrative details in philosophical reasoning. The concrete scenario serves a **psychological function** (triggering an intuitive response via simulation) but is assigned an **argumentative status** (treated as a variable that determines the truth of the conclusion). In a valid thought experiment, the details are scaffolding: they are necessary to build the intuition but should be removable once the principle is accessed. What you are observing is when the audience refuses to remove the scaffolding, arguing over the material of the props instead of the building they support. It is the mistake of treating the *heuristic device* as the *object of study*, causing debate to center on the fidelity of the simulation rather than the validity of the principle it was meant to reveal.

  4. "Where it stops"
  This description stops applying when the concrete details are actually morally or logically relevant to the principle being tested. For example, in the Trolley Problem, switching from "pulling a lever" to "pushing a person" is not just a surface detail; it introduces the distinction between *doing* vs. *allowing* or *using someone as a means*, which is central to the ethical principle at stake. Similarly, if the thought experiment is specifically designed to test boundary conditions (like the Ship of Theseus), then the replacement schedule is the variable being tested, not a distraction. The phenomenon only exists when the details are claimed to be neutral but are treated as decisive.

  5. "A name, if it needs one"
  **The Scaffold Illusion**
  *Definition:* The cognitive error of treating the narrative scaffolding of a thought experiment as structurally load-bearing for the philosophical conclusion. It occurs when the concrete details, which serve only to trigger an intuition (psychological utility), are mistakenly argued over as if they determine the validity of the abstract principle (logical utility), confusing the temporary support structure with the permanent argument.
