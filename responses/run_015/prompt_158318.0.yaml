      *   **Sorites Paradox:** Small changes (hair removal) don't change status (bald/not-bald), but cumulative changes do. Naive tolerance leads to contradiction.
      *   **Epistemicism (e.g., Williamson):** Vagueness is ignorance. There *is* a sharp boundary (e.g., hair #4,321 is bald, #4,322 is not), but we cannot know it. Truth is bivalent.
      *   **Supervaluationism (e.g., Fine):** Vagueness is semantic indeterminacy. There are many "admissible precisifications" (ways to make the predicate precise). A sentence is "super-true" if true on all precisifications, "super-false" if false on all. Borderline cases are neither (truth-value gaps).
      *   **The Conflict:** Epistemicism saves bivalence but accepts unknowability. Supervaluationism saves intuition about borderline cases but sacrifices bivalence (for borderline cases) and classical logic rules (like contraposition or existential generalization in some formulations).
