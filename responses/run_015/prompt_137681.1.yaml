answer: |-
  **Q&A PREP SHEET: "Nothing Is Locked In"**

  **STRATEGIC CONCESSIONS & REFUSALS**
  **Concede in Talk:** Specific *arrangements* (e.g., QWERTY keys) are sticky due to coordination costs. Distributional outcomes matter even if functional outcomes are equivalent. Lock-in rhetoric is useful heuristically, even if ontologically loose.
  **Refuse to Concede:** Stickiness equals inefficiency. Stickiness equals impossibility of endogenous change. The burden of proof lies with the lock-in claimant to show no admissible migration was possible, not on you to prove every alternative was viable.

  **THE SEVEN OBJECTIONS**

  **1. The Identification Problem (Economic Historians)**
  *Objection:* "You posit a 'functional shadow'—a counterfactual path with different arrangements but equivalent outcomes. Since this shadow is unobservable, how do you identify it without resorting to just-so stories? In DiD terms, you're claiming the treatment effect is zero based on untestable assumptions."
  *Reply:* Lock-in claims are themselves counterfactual assertions of impossibility ("we could not have switched"). I am not claiming the shadow *did* happen, only that it was *admissible*. The burden of proof for 'lock-in' requires demonstrating the absence of alternatives. I shift the burden: if you claim a path was locked, you must show why every admissible coalition failed to migrate. I only need to demonstrate one plausible breach in the lock to falsify the strong claim. My method is falsificationist, not estimative.
  *Soft Spot:* Relies on theoretical plausibility rather than hard data.
  *Damage:* [FATAL]

  **2. The Modality Problem (Philosophers)**
  *Objection:* "Your 'migration test' hinges on 'historically admissible coalitions.' What is the modal scope here? Are you ruling out exogenous shocks by fiat? If 'admissible' means 'rational agents with current info,' you've defined lock-in out of existence by restricting the possibility space."
  *Reply:* 'Admissible' means endogenous coordination changes given existing agents, information, and incentives. Exogenous shocks (wars, plagues) break paths; they don't prove lock-in *within* the path. If a system only changes via external destruction, that's fragility, not lock-in. I am testing the internal stability of the equilibrium, not the system's resilience to asteroid strikes.
  *Soft Spot:* Boundary between 'endogenous shift' and 'exogenous shock' can be blurry.
  *Damage:* [FATAL]

  **3. The 'Every Node' Burden (Historians/Sociologists)**
  *Objection:* "You require the test be failed at *every* node of the path. Empirically, how can you verify a negative across all time? This makes your theory unfalsifiable because you can always claim a switch was possible at some unobserved node."
  *Reply:* I don't need to verify all nodes; I need to find one breach. Lock-in claims are universal negatives ('no switch was possible'). I only need one positive existence proof of an admissible switch point to collapse the lock-in narrative. I am looking for the weak link in the chain, not auditing the whole chain.
  *Soft Spot:* Requires deep archival work to find specific switch points.
  *Damage:* [ABSORBABLE]

  **4. The Power/Distribution Objection (Sociologists)**
  *Objection:* "Functional equivalence ignores distributional outcomes. QWERTY might be functionally equivalent to Dvorak, but it locked in benefits for manufacturers over users. By focusing on 'function,' you erase the politics of who wins."
  *Reply:* I concede distribution matters. But that is a story about power and rent-seeking, not technological or institutional path dependence. Conflating 'winners protected their rents' with 'history is locked in' muddies the mechanism. My framework isolates the coordination problem from the distributional fight.
  *Soft Spot:* Risks alienating power-focused sociologists.
  *Damage:* [ABSORBABLE]

  **5. The Terminological Stipulation (General)**
  *Objection:* "You're just redefining path dependence to mean something narrower. The literature already accepts increasing returns and contingency. Why not keep the standard definition and add nuance?"
  *Reply:* The standard definition has become too loose, explaining everything and nothing. If 'path dependence' covers both 'hard to change' and 'impossible to change,' it loses predictive power. Precision aids mechanism. I am salvaging the concept by stripping away the rhetorical exaggeration.
  *Soft Spot:* Can seem pedantic.
  *Damage:* [ABSORBABLE]

  **6. Equifinality is Known (Sociologists)**
  *Objection:* "Comparative historians already know about equifinality—different paths to the same outcome. What is new here?"
  *Reply:* Equifinality is about outcomes; I am about process stability. Lock-in implies resistance to change *along* the path. I show that resistance is overstated. It's not just that different roads lead to Rome, but that travelers could have switched roads halfway without losing their way.
  *Soft Spot:* Might seem like splitting hairs.
  *Damage:* [ABSORBABLE]

  **7. The Policy Implication (The Hope Nobody Asks)**
  *Objection:* "If nothing is locked in, does that imply institutional reform is always easy? Doesn't this suggest failed institutions are simply choices by dominant coalitions, removing structural constraints from the analysis of poverty?"
  *Reply:* No. It means change is always *possible* but requires coordination, not just waiting for history to unlock. It places agency back on actors. It doesn't mean reform is easy, only that it isn't structurally impossible. It avoids fatalism without denying power.
  *Soft Spot:* Risks sounding like neoliberal apologia ("markets always find a way").
  *Damage:* [ABSORBABLE]

  \answer{Identification Problem}
