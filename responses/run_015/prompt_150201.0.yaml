answer: |-
  **Exam Question: Philosophy of AI (Final Seminar)**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Your response must engage directly with the hypothetical scenario provided. Avoid generic surveys of realist versus eliminativist positions; instead, focus your analysis on the specific constraints of the synthetic training environment described.

  **Prompt:**
  Consider a vision model trained exclusively on a synthetic dataset of convex geometric shapes. During mechanistic analysis, you identify a single unit that activates maximally on convex boundaries and also on shadows cast by those boundaries. Ablating this unit degrades performance on both boundary detection and shadow identification.

  Does this unit represent *convexity*, *shadow-boundary*, *neither*, or a *disjunctive property*? Specifically, evaluate whether the model's training objective (minimizing reconstruction error on this synthetic dataset) can substitute for evolutionary history in a teleosemantic account of content, or whether it merely relocates the disjunction problem onto designer intent.

  In your essay, you must:
  1.  Explain why causal relevance demonstrated by ablation is insufficient for establishing semantic content.
  2.  Analyze how the disjunction problem arises for artificial systems lacking evolutionary selection.
  3.  Assess whether the synthetic training objective resolves that problem or pushes it back.
  4.  Identify and diagnose one common student error regarding representational status (e.g., treating feature-visualization as sufficient).
  5.  Provide a reasoned conclusion that takes a definitive stand rather than ending in agnosticism.

  ***

  **Model Answer**

  The ablation study demonstrates that the unit is causally necessary for specific outputs, but causal relevance alone cannot secure semantic content. A fuse is causally necessary for a car engine to run, yet the fuse does not represent "engine operation." Similarly, while removing the unit disrupts the network's ability to process boundaries and shadows, this only establishes a functional dependency. Semantic content requires conditions of satisfaction—conditions under which a representation is correct or incorrect—not merely conditions under which the system fails. Without a criterion for misrepresentation, the unit is merely a causal bottleneck, not a semantic vehicle.

  This limitation precipitates the disjunction problem. In biological systems, teleosemantics often relies on evolutionary history to fix content: a state represents water because detecting water conferred survival advantages, whereas detecting non-water did not. In this synthetic model, there is no evolutionary history, only training history. Because convex boundaries and shadows co-occurred perfectly in the training distribution, the unit was never penalized for conflating them. Consequently, there is no factual basis to claim the unit represents convexity *rather than* shadows, or convexity-or-shadows. The system lacks a history of selecting one property over the other in cases where they diverge, leaving the content indeterminate between the specific property and the disjunction.

  One might argue that the training objective—minimizing reconstruction error—substitutes for evolutionary fitness. However, this merely relocates the problem. The loss function defines successful performance, not semantic reference. If the model minimizes error by exploiting the shadow boundary correlation, the objective is satisfied regardless of whether the unit "means" convexity or shadow. To claim the objective fixes content, one must appeal to the designer's intent: what property did the designer *intend* the loss function to capture? This shifts the burden from the system's history to the external mind of the engineer, failing to ground content intrinsic to the artificial system itself. The objective ensures utility, not truth-conditions.

  A common error in analyzing such cases is treating feature-visualization or predictive utility as sufficient for representational status. Students often argue that because the unit activates when a convex shape appears, it represents convexity. This confuses correlation with reference. High activation maps show statistical dependence, not semantic aboutness. If the unit activates equally for shadows, claiming it represents convexity ignores the symmetric causal structure. Predictive utility explains why the unit exists, not what it stands for. Conflating utility with content assumes that any useful feature is a representation, which collapses the distinction between a calculator's gear and a belief state.

  Therefore, the unit does not possess determinate representational content. It is an instrumental feature optimized for a specific loss landscape, not a semantic atom. Without a mechanism to decouple the co-occurring properties during training—either through divergent data or an explicit structural constraint—the system cannot distinguish between the property and its correlate. The training objective ensures the unit is useful, but usefulness is not meaning. We should conclude that the unit is a functional component without semantic content until the system is embedded in a broader context where misrepresentation carries a cost distinct from mere loss increase. Realism about representations requires more than functional stability; it requires a grounded distinction between success and accuracy, which this synthetic environment fails to provide.

  ***

  **Marking Scheme (Total: 20 Marks)**

  | Criterion | Marks | Typical Failure Mode (Deduction Guide) |
  | :--- | :---: | :--- |
  | **1. Causal Relevance vs. Content** | 4 | **Failure:** Treating ablation results as proof of meaning (e.g., "It breaks, so it represents"). |
  | **2. Disjunction Problem Analysis** | 4 | **Failure:** Ignoring the co-occurrence issue or assuming biological evolution is irrelevant without argument. |
  | **3. Training Objective Evaluation** | 4 | **Failure:** Asserting loss functions fix content without addressing the shift to designer intent. |
  | **4. Diagnosis of Student Error** | 4 | **Failure:** Identifying an error but failing to explain *why* it is philosophically mistaken. |
  | **5. Definitive Conclusion** | 4 | **Failure:** Ending agnostically (e.g., "It depends on one's theory") rather than taking a stand. |
