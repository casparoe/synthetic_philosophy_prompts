  2.  **Deconstruct the Core Tension:**
      *   *Internal Demarcation:* Focuses on the logic of the argument, use of evidence, consistency, ad hoc hypotheses. (Popperian vibe).
      *   *Institutional Demarcation:* Focuses on the sociology of science/history, engagement with the community, willingness to submit to correction. (Kuhn/Lakatos/Social Epistemology vibe).
      *   *The Trap:* Students often think "bad method = pseudoscience" OR "rejected by institutions = pseudoscience." The goal is to show they are distinct layers that often overlap but can come apart.
      *   *The Example:* A fabricated excerpt about Atlantis using correct carbon-dating jargon.
          *   *Risk:* If it looks methodologically sound but is about Atlantis, does it prove internal rigour exists in pseudohistory? Or does it just look like "rhetorical dressing"?
          *   *Requirement:* It must show *internal coherence* (or at least the appearance of it) while lacking *institutional engagement*, OR show *internal failure* despite *institutional trappings*.
          *   *Refinement:* To distinguish internal vs. institutional, the example needs to be *internally plausible* (uses terms correctly) but *institutionally isolated* (no chain of custody, no peer scrutiny of the artefact's existence). Actually, the prompt suggests using it to illuminate the distinction. If the excerpt uses correct terminology but refers to a non-existent artefact, it highlights that *internal linguistic rigour* $\neq$ *empirical accountability*. But the prompt asks about Internal (method) vs. Institutional (peer correction).
          *   *Better approach for the example:* The excerpt should demonstrate a *methodological move* that looks valid internally (e.g., "C14 dating suggests...") but is insulated from institutional correction (e.g., "The artefact was lost at sea immediately after testing"). This isolates the institutional failure (uncheckable) from the internal claim (technically phrased).

  3.  **Drafting the Explanatory Arc:**
      *   *Prerequisite:* Students must understand that "science/history" isn't just a body of truths, but a *practice*. They need to grasp the norm of "organized scepticism" (Merton) or "critical rationalism" (Popper) before they can see the violation of it.
      *   *Sequence:*
          1.  Popper Recap (Falsifiability).
          2.  The Limit of Popper (Ad hoc saves).
          3.  Introduce the Two Layers: Internal Logic vs. Institutional Ecology.
          4.  Case Study 1: Fomenko (Mathematical internal logic, but ignores historical philology institutions).
          5.  Case Study 2: Atlantis (Mythic internal logic, often ignores material evidence institutions).
          6.  The Fabricated Example (The pivot point).
          7.  Synthesis: Demarcation as a cluster concept.

  4.  **Handling Student Objections:**
      *   *"All history is interpretation":* Address early. Acknowledge theory-ladenness but distinguish *interpretation of evidence* from *invention of evidence*.
      *   *"Fomenko was marginalized/political":* Address during the Institutional section. Distinguish *heterodoxy* from *pseudodoxy*.
      *   *"Peer review is gatekeeping":* Address near the end. Reframe peer review not as permission, but as the mechanism of error-correction.

  5.  **Addressing the Misconception:**
      *   *Misconception:* Demarcation is a binary switch (Science/Not-Science) based on one rule.
      *   *Intervention:* Introduce the "Layered Assessment" idea *before* the case studies fully unfold. Make it clear we are looking for "degrees of scientificity" or "family resemblances."

  6.  **Developing the Check-for-Understanding Question:**
      *   Needs to test the distinction, not the facts.
      *   *Idea:* Present a hypothetical scenario where a historian uses perfect method but publishes only on a personal blog, OR a historian who publishes in journals but fakes data. Ask which failure is "internal" and which is "institutional" and which is more damaging to demarcation.
