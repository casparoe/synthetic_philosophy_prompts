      *   *Critique:* It risks conflating *fraud* with *pseudohistory*. Pseudohistory often believes its own claims.
      *   *Adjustment:* The excerpt must show *interpretative flexibility* masquerading as rigour. E.g., "The C14 date is 12,000 BP, consistent with the Cataclysm." The internal failure is the *link* between the date and the Cataclysm (ad hoc). The institutional failure is that the sample isn't archived.
