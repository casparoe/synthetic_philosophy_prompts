      *   *Correction:* Ensure the plan highlights that Fomenko mimics *mathematical* rigour (internal) but rejects *historical* institutions, whereas Atlantis narratives often mimic *archaeological* discovery but fail *internal* consistency regarding geology/physics. Actually, the prompt says Atlantis and Fomenko fail in *structurally different ways*.
