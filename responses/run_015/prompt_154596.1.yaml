      *   **Duration:** 90 minutes.
      *   **Prior Knowledge:** Popper (falsificationism) and a summary of Fomenko's New Chronology.
      *   **Core Conceptual Tension:** Internal methodological failures (e.g., selective data, circular reasoning) vs. Institutional refusal (e.g., bypassing peer review, ignoring correction mechanisms).
      *   **Goal:** Move beyond checklists; show demarcation as a layered assessment; distinguish structural failures (Atlantis vs. Fomenko).
      *   **Specific Constraints:**
          *   Plan the explanatory arc (prerequisites).
          *   Evaluate the "fabricated primary-source excerpt" example (Atlantean artefact with carbon-dating terminology).
