answer: |-
  ### Confidence Statement

  I am **85% confident** in this pedagogical plan. It successfully structures the ninety-minute session to move from Popperian basics to a nuanced, social-epistemological understanding of demarcation, directly addressing your goal of layering internal and institutional criteria.

  The point about which I am **least certain** concerns your proposed **fabricated primary-source excerpt**. There is a significant risk that presenting a text with correct carbon-dating terminology regarding a non-existent artefact will conflate *methodological rigour* with *rhetorical dressing*. Students may conclude that "using the right words" is sufficient for internal rigour, failing to see that internal rigour also requires *truthful reporting of data provenance*. To prevent this collapse, the excerpt must explicitly contain an internal clause that precludes institutional verification (e.g., stating the sample was destroyed or is privately held). Without this specific property, the example risks teaching students that pseudohistory is merely "sciencey-sounding language" rather than a structural failure of evidence management.

  ---

  ### Seminar Plan: The Two Layers of Demarcation

  #### 1. The Explanatory Arc and Prerequisite Concept

  **The Prerequisite:** Before the distinction between internal and institutional demarcation can be grasped, students must firmly understand the concept of **Organised Scepticism** (Merton) or the **Division of Cognitive Labour**. They need to accept that scientific/historical knowledge is not a static collection of facts, but a *process* dependent on the community's ability to locate and correct errors. If they view knowledge as individually held rather than socially distributed, the "institutional" layer will look like mere gatekeeping rather than an epistemic necessity.

  **The Arc:**
  1.  **Recap & Problematisation (15 mins):** Briefly revisit Popper's falsification. Ask: "If Fomenko's mathematics are internally consistent, why is it pseudohistory?" This exposes the limit of pure internal logic.
  2.  **The Internal Layer (20 mins):** Define this as logical coherence, data consistency, and avoidance of *ad hoc* hypotheses. Use Fomenko here: his math works, but his deployment of historical data is selective (internal failure).
  3.  **The Institutional Layer (20 mins):** Define this as engagement with correction mechanisms (peer review, data archiving, replication).
  4.  **The Fabricated Example (20 mins):** The pivot point where the two layers are tested against each other.
  5.  **Synthesis & Objection Handling (15 mins):** Integrating the objections into the layered model.

  #### 2. The Carrying Example: The Fabricated Excerpt

  You are right to be cautious. A text that simply uses correct terminology risks teaching students that demarcation is about stylistic register. To illuminate the distinction, the excerpt must possess specific properties:

  *   **Property it MUST Possess:** It must explicitly state that the **material evidence is inaccessible to others**. For example: *"Radiocarbon analysis of the crystalline shard yielded 12,000 BP; the shard vaporised during mass spectrometry."*
  *   **Property it MUST Lack:** It must not contain obvious internal logical contradictions (e.g., do not say "12,000 BP" and "Old Kingdom" in the same breath without explanation).

  **Why this works:**
  *   **Internal Rigour:** The terminology is correct; the causal link (testing $\rightarrow$ date) is logically sound.
  *   **Institutional Failure:** The claim is structured to make peer correction impossible.
  *   **The Lesson:** This shows that a claim can be *internally coherent* (it makes sense as a sentence) but *institutionally inert* (it cannot enter the economy of scientific exchange). This prevents the collapse of the distinction: it is not just "rhetorical dressing" because the language is technically accurate; it is a structural barrier to verification.

  #### 3. Sequencing Student Objections

  Advanced undergraduates will likely raise these objections in a specific order. You should absorb them where they strengthen the arc, rather than treating them as interruptions.

  1.  **Objection:** *"All history is interpretation anyway."*
      *   **When:** Early, during the Recap (Minute 15).
      *   **Response:** Concede the point. Acknowledge theory-ladenness. Then pivot: "Demarcation is not about the absence of interpretation, but the *management* of it. Fomenko interprets data; so does a mainstream historian. The difference lies in how they handle conflicting data." This sets up the Internal Layer.
  2.  **Objection:** *"Fomenko was marginalised for political reasons / Peer review is merely gatekeeping."*
      *   **When:** During the Institutional Layer (Minute 55).
      *   **Response:** This is the crucial moment. Distinguish between **Heterodoxy** (unpopular but testable claims) and **Pseudodoxy** (claims insulated from testing). Ask: "If Fomenko published his raw data for independent re-calculation, would he be accepted?" This reframes peer review from 'permission' to 'error-checking'.
  3.  **Objection:** *"So, is it pseudohistory just because no one likes it?"*
      *   **When:** Synthesis (Minute 75).
      *   **Response:** Use this to cement the "Layered Assessment." No, it is pseudohistory because it fails the internal layer (selective data) *and* the institutional layer (refusal to submit to correction). One might suffice, but together they confirm the status.

  #### 4. Heading Off the Key Misconception

  **The Misconception:** Students will assume demarcation requires one **necessary-and-sufficient condition** (a "litmus test"). They will want to know: "Is it the carbon dating or the peer review that decides it?"

  **Intervention Point:** Introduce the **Layered Assessment** model *before* you present the Atlantis/Fomenko comparison (Minute 35).
  *   **Action:** Draw two concentric circles on the board. Label the inner circle "Internal Logic" and the outer "Institutional Ecology."
  *   **Script:** "Do not look for a single boundary line. Look for a gradient. A claim might pass the internal test (logical consistency) but fail the institutional test (unverifiable). Another might pass the institutional test (published in a journal) but fail the internal test (fraudulent data). Pseudohistory typically fails both, but understanding *how* it fails matters."
  *   **Why:** This prevents them from trying to reduce the seminar to a binary checklist and prepares them for the nuanced conclusion.

  #### 5. Check-for-Understanding Question

  Do not ask them to define pseudohistory. Ask them to diagnose a hypothetical scenario that splits the two layers.

  **The Question:**
  > "Imagine a researcher publishes a paper in a top-tier history journal. The paper argues for a revision of the Bronze Age collapse. The methodology is flawless, the data is archived, and the peer review was rigorous. However, five years later, it is discovered that the researcher privately believes their own theory is 'spiritually true' and refuses to entertain any future contradictory evidence, claiming their initial proof is final.
  >
  > **Has the work crossed from science/history into pseudoscience/history? If so, at which layer of demarcation did the breach occur, and does the initial institutional validation save it?**"

  **What this reveals:**
  *   If they say "It is pseudohistory because of the attitude," they grasp the **Institutional/Ecological** layer (science is an ongoing process, not a one-off event).
  *   If they say "It remains history because the paper was peer-reviewed," they are still relying on **Institutional Authority** rather than **Institutional Mechanism**.
  *   If they say "It depends on whether the data was faked," they are reverting to the **Internal** layer only.
  *   **Ideal Answer:** They should identify that demarcation is dynamic. The work *becomes* pseudohistorical when the researcher withdraws from the community of correction, regardless of the initial internal rigour. This confirms they understand demarcation as a practice, not a stamp.

  ### Summary of Pedagogical Risks

  *   **High Risk:** The fabricated excerpt looking like "fake science" rather than "institutionally isolated science." Ensure the text explicitly blocks replication.
  *   **Medium Risk:** Students conflating "institutional" with "political." Keep the focus on *epistemic* institutions (verification), not *sociological* institutions (universities).
  *   **Low Risk:** The Popper recap. They have read him; keep it brisk to allow time for the new material.

  This plan respects the students' advanced level by refusing to give them a easy checklist, forcing them to grapple with the sociology of knowledge alongside the logic of inquiry.
