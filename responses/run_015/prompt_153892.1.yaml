answer: |-
  **Grade: 22/25**

  **Assessment Summary**
  This is a high-quality response that demonstrates a sophisticated grasp of current archaeological debates. You correctly identify the nuance between societal "collapse" and political/structural transformation. However, the response is significantly shorter than the requested length (~260 words vs. ~500 words), which limits the depth of your analysis regarding *why* these divergent paths occurred.

  **Point-by-Point Breakdown**

  **1. Argument and Thesis (9/10)**
  *   **What's Right:** Your thesis is clear and defensible: "collapse" applies to institutional frameworks (Bronze Age) but not necessarily to populations or cultures (Maya, Easter Island). You effectively use the concept of "complexity theory" to frame the argument, distinguishing between voluntary downsizing and systemic failure.
  *   **What's Shaky:** You argue that Bronze Age palaces "couldn't adapt," but you don't explain *why* they couldn't adapt while the Maya and Rapa Nui could. Given the word count allowance, you missed the chance to explore systemic interdependence in the Bronze Age vs. the more localized resilience of the other cases.

  **2. Evidence and Accuracy (9/10)**
  *   **What's Right:** Your specific evidence is excellent and up-to-date.
      *   **Maya:** Correctly noting the shift to the Northern Lowlands (Chichen Itza) and the continuity of writing/religion counters the old "mysterious disappearance" myth.
      *   **Easter Island:** You accurately reflect the revisionist archaeological view (Hunt & Lipo vs. Diamond) regarding the Birdman cult and the timing of population decline (European contact vs. ecocide).
      *   **Bronze Age:** Correctly identifying the loss of Linear B and the disintegration of redistribution economies as markers of true institutional collapse.
  *   **Where It Slips Up:** The Easter Island timeline ("forests... gone by around 1600") is debated, but acceptable for this level. However, you generalize the Bronze Age survival ("Egypt survived") without noting that Egypt lost its empire and entered a period of significant fragmentation, which complicates the "survival" narrative slightly.

  **3. Constraints and Depth (4/5)**
  *   **What's Right:** You addressed the core prompt requirements (what broke down vs. what stayed intact).
  *   **Where It Slips Up:**
      *   **Word Count:** You wrote approximately half the requested length. While concise, this prevented you from fully fleshing out the "what stayed intact" section for the Bronze Age (e.g., did village life continue? Yes, but how?).
      *   **Case Selection:** The prompt asked to "pick two cases." You discussed all three. While this served your comparative argument, strictly speaking, it deviates from the instruction. In this case, it worked rhetorically, but it contributed to the brevity of each individual section.

  **Justification for Score**
  You lost 3 points primarily on constraints and missed opportunities for depth.
  *   **-2 points:** Significant underwrite (approx. 260 words vs. 500). This is not a penalty for brevity itself, but because the prompt's length requirement was designed to ensure you elaborated on the *mechanisms* of collapse vs. reorganization.
  *   **-1 point:** Minor deviation on case selection (3 instead of 2), though this was forgiven because it strengthened the comparative thesis.

  The content itself is A-range work (accurate, nuanced, theoretical), but the execution regarding course constraints keeps this in the high A-/low A range. For the final, ensure you expand on your theoretical points to meet the length expectations; you have the knowledge, just needs more elaboration.
