  2. This axiom seduces because preservation feels like honesty, yet it ignores that a feature transplanted without adaptation often ceases to function as it did in the source.
  3. Abandoning this costs you the comfort of a single fidelity metric, forcing you to judge each version by whether its constraints generate equivalent poetic energy rather than mere correspondence.
  4. Opting instead to reject step (4) exacts a higher price, as it concedes that formal features conflict and your game of accumulation must halt where the poem begins to break.
  5. Consequently, you ought to treat your constraints not as boxes to tick for fidelity, but as provocations that cease to be useful the moment they stifle the poem's breath in English.
