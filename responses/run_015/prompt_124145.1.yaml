  1. **Sicilian Expedition:** This ranks as the clearest structural failure because the assembly maintained high feedback latency over years, ignoring negative strategic data despite having the institutional power to recall forces, which reveals a systemic inability to process failure without escalating commitment.

  2. **Trial of Socrates:** This lands in the middle because the judicial structure imposed zero latency for correction with no appeals process, creating a structural gap, though the specific verdict relied heavily on contingent personal animus rather than sustained policy drift.

  3. **Mytilene Debate:** This ranks as mostly contingent because the assembly demonstrated low feedback latency by reconvening within 24 hours to successfully activate a built-in correction path, proving the machinery could self-correct faster than the damage could solidify.

  **Does this framing add value?**
  Yes, it moves the diagnosis from static human nature to dynamic system design. The usual "mobs are irrational" take struggles to explain why the same "irrational mob" reversed the Mytilene decree but doubled down on Sicily; the latency lens clarifies that Mytilene had a fast feedback loop while Sicily suffered from institutional momentum that blocked negative feedback. It shifts the critique from "people are too emotional" to "institutions need faster correction mechanisms," distinguishing between volatility (which can be self-correcting) and rigidity (which is fatal).
