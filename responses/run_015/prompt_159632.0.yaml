  Drop step (6). It looks convincing because it mimics the logic you successfully used against group selection in (5): if the entity doesn't transmit its structure intact, it can't be a unit of selection. But this conflates the *unit of heredity* with the *unit of selection*. Genes are the only things copied faithfully enough to accumulate changes over eons (replicators), but organisms are the things that actually live, die, and reproduce (vehicles). Selection acts on the vehicle's performance in the world. A queen doesn't need to pass her genome intact for her body to be the thing tested by survival; she just needs to pass enough genes to build another vehicle. The shuffling you mention is noise relative to the gene, but the organism remains the coherent entity facing the pressure. By rejecting (6), you acknowledge that genes are the beneficiaries of evolution, but organisms are the machinery doing the work. This saves the reality of design: eyes are for seeing because organisms with seeing-eyes survived, even if the specific genes coding for them get shuffled. The organism is the test site; the gene is the recipe. You can test a cake without the recipe surviving intact, provided enough copies of the recipe exist elsewhere to make more cakes.

  If you dropped (5) instead, you'd allow group selection, implying colonies evolve traits that hurt individual genes for the colony's sake. This is costly because it requires mechanisms to prevent "cheater" genes within the group, which are rare in nature. In your bee context, it would mean admitting workers might sacrifice themselves for a colony genetic interest distinct from their own, which complicates the sterile worker explanation unnecessarily. If you dropped (3), you'd imply acquired traits are inherited, which is biologically false. The cost of keeping (6) is nihilism about biology's main subject: the organism. The cost of dropping (6) is simply accepting that "unit of heredity" and "unit of selection" are different jobs. Genes hold the information; organisms spend it. You can keep your skepticism of group selection without denying that a bee's sting is a real adaptation for the bee's lineage, mediated by genes. You preserve the utility of the organism as a functional unit without granting the group the same status.
