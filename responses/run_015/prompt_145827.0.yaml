answer: |-
  Your hypothesis is sharp on the surface grammar but misses the deep structure. You have correctly identified the *modes* of argument (empirical, agency, epistemic), which explains why the replies feel like category errors. However, this tidiness obscures a uniform underlying conflict: every critique is ultimately a challenge to **consequentialism** itself, while every reply defends it. The debate stalls not because the logical types differ, but because one side is playing chess (optimizing moves) and the other is questioning the board (legitimacy, values, rules).

  There are verbal disputes here—"effective" presupposes outcomes matter more than actions; "systemic" presupposes structures exist over and above individuals—but these are symptoms, not causes. Hidden empirical questions exist (replaceability rates, efficacy of advocacy), but answering them would only shift the boundary of the disagreement, not resolve it.

  Here is the diagnosis of the dispute's shape.

  | Critique | Disagreement Type (Surface / Deep) | Hidden Empirical Question | Concrete Progress Marker | Resolvability |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Structural / Institutional** | **Surface:** Empirical (causal models of change).<br>**Deep:** Values (Justice/Power vs. Welfare). | Does institutional change have higher leverage than direct aid per dollar? | A comparative study showing institutional reform yields more QALYs than direct intervention *in specific contexts*. | **Partial.** Empirical claims can be tested, but the definition of "harm" (structural vs. aggregate) remains a value clash. |
  | **2. Earning-to-Give / Complicity** | **Surface:** Empirical (counterfactuals/replaceability).<br>**Deep:** Moral Framework (Consequentialism vs. Deontology). | How replaceable is the individual in the harmful role? | Data on labor market elasticity in finance/tech sectors. | **Low.** Even if replaceability is 100%, critics object to *dirty hands*. This is a moral axiom, not a calculation. |
  | **3. Measurability / Quantification** | **Surface:** Epistemic (uncertainty handling).<br>**Deep:** Risk Tolerance (Bias vs. Variance). | Can we model long-termist claims with error bars smaller than the signal? | Development of robustness checks that survive adversarial scrutiny without collapsing to zero. | **Medium.** Methodological improvements can reduce bias, but the value of the unmeasurable remains contested. |
  | **4. Authorization / Legitimacy** | **Surface:** Political (who decides).<br>**Deep:** Legitimacy (Outcomes vs. Process). | None. This is not an efficacy claim. | A shift in funding governance (e.g., democratic oversight of EA funds). | **None.** No evidence touches this. It requires a political settlement, not an argument. |

  ### Diagnosis of Your Hypothesis
  You are right that these are different logical types, which explains why the replies feel like they are dodging the critique. When a critic says "power structures," and an EA says "counterfactual dollars," they are speaking different languages. However, manufacturing tidiness risks hiding the fact that **all three critiques are ultimately political or moral challenges to a technocratic worldview.**

  *   **Verbal Disputes:** Yes. "Effective" is a loaded term implying a single metric of good. "Systemic" is often used by critics to mean "political" and by EAs to mean "high-leverage causal chains." Clarifying these definitions would help readers see the mismatch, but won't settle the dispute.
  *   **Hidden Empirical Questions:** The replaceability rate (Critique 2) and the leverage of institutional change (Critique 1) are genuine empirical questions. If EAs conceded replaceability is low, earning-to-give collapses. If critics conceded institutional change is low-leverage, the structural critique weakens.
  *   **Where to Tell Readers "No Progress":** Be explicit that Critique 2 (Complicity) and Critique 4 (Authorization) are **non-falsifiable**. You cannot prove to a deontologist that dirty hands are clean via math. You cannot prove to a democrat that plutocracy is legitimate via bednets. Tell your readers these are conflicts of *authority and axiom*, not evidence.

  ### Progress vs. Stalemate
  Progress is possible only on the empirical margins (leverage rates, measurement error). Stalemate is guaranteed on the foundational layer (who decides, what counts as good). The debate never moves because EA treats morality as an engineering problem, while critics treat it as a political or spiritual one.

  \answer{Incompatible moral frameworks and legitimacy claims}
