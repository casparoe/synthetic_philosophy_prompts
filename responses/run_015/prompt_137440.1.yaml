  # The Denial/Consciousness Map

  **Entry Commitment:** We are granting the datum: *There is something it is like to be in a state you would sincerely deny.* (If you reject this—if you think a feeling only exists once admitted—stop at **Leaf 1**).

  ---

  ### Question 1: The Driver Case (Access vs. Experience)
  *Your character brakes for a light while lost in thought. Later, she has no memory of seeing the light. Was there a visual experience of the light that faded, or was it purely mechanical processing with no "see-ing" involved?*

  *   **A. Purely mechanical.** (Consciousness requires the state to be available for memory/report.)
      *   → **Leaf 2: Global Workspace Theory.**
      *   *Awkward Commitment:* Your widower isn't actually feeling grief while humming; he's a philosophical zombie until he speaks.
  *   **B. There was an experience.** (Consciousness can exist without being available for use.)
      *   → Go to Question 2.

  ### Question 2: The Widower Case (Source of Consciousness)
  *When the widower hums, does the humming become a conscious feeling because it *is* a feeling, or because something else in his mind *notices* the feeling?*

  *   **A. Because it is a feeling.** (The state itself carries the consciousness.)
      *   → **Leaf 3: Phenomenal Overflow (Block-Style).**
      *   *Awkward Commitment:* Your character has rich inner lives that can never be spoken or acted upon, making them permanently isolated.
  *   **B. Because something notices it.** (Consciousness requires a mental act about the state.)
      *   → Go to Question 3.

  ### Question 3: The Noticing Condition (Actual vs. Disposition)
  *Does that "noticing" have to be happening right now, or is it enough that the character *could* notice it if asked?*

  *   **A. Enough that they could.** (A standing disposition is sufficient.)
      *   → **Leaf 4: Dispositional Higher-Order View.**
      *   *Awkward Commitment:* Blurs the line between sleeping and waking; your character is conscious of grief even in deep sleep if disposed to notice it.
  *   **B. Has to be happening now.** (The noticing must occur.)
      *   → Go to Question 4.

  ### Question 4: The Scope of Noticing (Specific vs. Loose)
  *Does the noticing have to be about *that specific* feeling (e.g., "this grief"), or can it be a general alertness that sweeps the feeling up?*

  *   **A. General alertness.** (Consciousness comes from attention scanning the state.)
      *   → **Leaf 5: Attention-Based / Higher-Order Perception.**
      *   *Awkward Commitment:* Makes consciousness depend on focus, so your absorbed driver wasn't conscious of the light at all.
  *   **B. About that specific feeling.** (The noticing targets the state directly.)
      *   → Go to Question 5.

  ### Question 5: The Grief/Relief Case (Accuracy)
  *Can the noticing be wrong? (Can the mind notice the state and label it "grief" when it is actually "relief"?)*

  *   **A. Yes, it can be wrong.** (The noticing determines the reality.)
      *   → **Leaf 6: Misrepresentational Higher-Order Thought.**
      *   *Awkward Commitment:* Allows a rock to be conscious if the monitor misrepresents it as such; your character's relief is technically grief if the monitor says so.
  *   **B. No, it must be accurate.** (The noticing must match the state.)
      *   → Go to Question 6.

  ### Question 6: The Regress Check (Visibility of Noticing)
  *Does the noticing itself have to be felt/conscious, or can it be invisible?*

  *   **A. It can be invisible.** (Unconscious monitor.)
      *   → **Leaf 7: Standard Higher-Order Thought.**
      *   *Awkward Commitment:* Posits invisible mental machinery; hard to justify why the character denies the state if the monitor is working.
  *   **B. It must be felt.** (The monitor is itself conscious.)
      *   → Go to Question 7.

  ### Question 7: The Unity Check (Structure of Noticing)
  *If the noticing is felt, is it a separate feeling looking at the first one, or one single feeling that includes itself?*

  *   **A. A separate feeling.** (One state looking at another.)
      *   → **Leaf 8: Infinite Regress (Unattractive/Empty).**
      *   *Why Empty:* Requires an endless chain of notices; no serious theory lives here.
  *   **B. One single feeling.** (The state represents itself.)
      *   → **Leaf 9: Self-Representationalism.**
      *   *Awkward Commitment:* Requires mental states to be inherently self-aware; hard to write a character who lacks self-insight without making them sub-human.

  ---

  ### Top Leaf (The Rejectors)
  *   **Leaf 1: Datum Rejectors (e.g., Strict Behaviorists / Some Wittgensteinians).**
      *   *Position:* You cannot feel what you deny; the denial proves the feeling isn't there.
      *   *Awkward Commitment:* Makes your novel's subtext impossible; if the character denies the grief, there is no grief to write.

  ---

  ### Map Notes & Confidence

  **Indistinguishable Leaves:**
  I must flag **Leaf 4 (Dispositional)** and **Leaf 7 (Standard HOT)**. While the tree separates them by "Actual vs. Disposition," in practice, a strong disposition is often indistinguishable from a faint actual occurrence. In a dinner debate, you may find you cannot tell these apart without splitting hairs about what "happening now" means.

  **Confidence Level:**
  I am **85% confident** this map covers the logical space relevant to your fiction. It captures the major distinctions (Access, Order, Disposition, Accuracy, Regress) without getting bogged down in metaphysical weeds.

  **Least Sure Placement:**
  I am least sure about the boundary between **Leaf 3 (Phenomenal Overflow)** and **Leaf 2 (Global Workspace)**. Some theorists argue that "Access" is the only thing that matters, while others argue "Experience" exists without it. In a writing context, the difference is subtle: does the character *have* the feeling but can't use it (Leaf 3), or do they *not have* the feeling until they use it (Leaf 2)? This is the thinnest wall in the tree.
