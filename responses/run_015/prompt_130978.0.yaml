prompt: |-
  You serve as methodological adviser to a regional public-works board that reviews high-stakes infrastructure proposals and must combine conflicting stakeholder reports about risk and welfare. The board wants to operationalize Harsanyi's aggregation theorem—under which social preferences over lotteries satisfy the von Neumann-Morgenstern axioms and a weak Pareto condition if and only if social welfare equals a state-independent weighted sum of individual cardinal utilities—into a reusable decision procedure that non-economist members can execute in a single two-hour session without software.

  Construct the procedure as an ordered sequence of tests with explicit stopping rules: (1) the verification questions that establish whether each stakeholder report can be treated as a vNM preference ordering; (2) the check for the independence axiom and what to do when it fails for one group; (3) the determination of welfare weights, marked clearly as a value judgment that the procedure cannot resolve; (4) the computation or approximation step, with instructions for what to do when cardinal utilities are only ordinally ranked; and (5) the final aggregation rule and the conditions that force deferral to a human vote. Specify the hard cases the procedure must handle, including stakeholder proxies who represent future generations through discount-rate models and groups whose ambiguity aversion about climate scenarios violates independence. Apply the procedure to two proposals: reinforcing a coastal levee where agricultural representatives reject standard lotteries over flood probabilities, and extending a transit corridor where present users and a future-generations proxy disagree on both outcomes and weights. Include one application where the procedure recommends approval that conflicts with the board's intuitive moral judgment, and explain why. Conclude by stating precisely what the procedure cannot determine—especially the normative source of the weights and the status of goods that fall outside utility—so the board knows where judgment is unavoidable.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Methodological Adviser to a regional public-works board.
      *   **Task:** Construct a reusable decision procedure based on Harsanyi's Aggregation Theorem.
      *   **Constraints:**
          *   Executable by non-economists.
          *   Single two-hour session.
          *   No software (manual calculation/estimation).
          *   Must be an ordered sequence of tests with explicit stopping rules.
      *   **Required Components:**
          1.  Verification of vNM preferences.
          2.  Check for Independence Axiom (and handling failures).
          3.  Determination of welfare weights (marked as value judgment).
          4.  Computation/approximation (handling ordinal vs. cardinal).
          5.  Final aggregation rule and deferral conditions.
      *   **Hard Cases to Handle:** Future generations (discount rates), Ambiguity aversion (climate scenarios).
      *   **Applications:**
          1.  Coastal levee (Ag reps reject lotteries).
          2.  Transit corridor (Present vs. Future disagreement).
          3.  Conflict case (Procedure says approve, intuition says no).
      *   **Conclusion:** Limitations (normative source of weights, non-utility goods).

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *Premise:* Individual preferences satisfy vNM axioms (Completeness, Transitivity, Continuity, Independence).
      *   *Premise:* Social preferences satisfy vNM axioms + Weak Pareto (if everyone prefers A to B, society prefers A to B).
      *   *Conclusion:* Social Welfare Function (SWF) = $\sum w_i u_i(x)$, where $w_i \ge 0$.
      *   *Challenge:* Utilities must be *cardinal* and *interpersonally comparable* (up to a common scale origin and unit). Harsanyi assumes this is possible via "ethical preferences," but in practice, this is the hardest part for a board to do without software or deep expertise.
      *   *Constraint Check:* The prompt asks to *operationalize* this. I need to simplify the cardinalization and weighting process for a 2-hour manual session.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: vNM Verification.* Non-economists don't know "transitivity" jargon. I need to translate this into questions. "Can you rank options?" "If A is better than B, is B worse than A?" "Are you willing to gamble?"
      *   *Step 2: Independence Axiom.* This is the tricky one. Independence means preferences over lotteries depend only on outcomes where they differ. Violation often happens with ambiguity (Ellsberg paradox) or extreme tail risks. The prompt specifically mentions climate ambiguity. *Action:* If failed, Harsanyi doesn't apply directly. Need a stopping rule or adjustment (e.g., treat as non-vNM, use minimax, or flag for deferral).
      *   *Step 3: Weights.* Harsanyi doesn't determine weights; it just says they exist. The board must set them. This is political/ethical. I need to make sure the procedure highlights this as *their* responsibility, not math's.
      *   *Step 4: Cardinalization.* Stakeholders usually give ordinal rankings ("I like A more than B"). Harsanyi needs cardinal utility ($u(A) - u(B)$ matters). I need a manual method for this. *Idea:* Standard Gamble Method or Simple Rating Scale (0-100) anchored by worst/best outcomes.
      *   *Step 5: Aggregation.* Sum the weighted scores. Deferral if data is too messy or weights are contested.

      *   *Refining for Time/Usability:* A full vNM verification takes too long. I need to streamline this into a "Checklist" approach.
      *   *Refining for Hard Cases:*
          *   *Future Generations:* Need a proxy. Discounting is the mechanism.
          *   *Ambiguity:* If they hate ambiguity, they violate Independence. The procedure needs to acknowledge this violation and suggest a workaround (e.g., safety margin) or deferral.

  4.  **Developing the Specific Sections:**

      *   **Introduction:** Set the tone. Formal but accessible.
      *   **The Protocol:** Numbered steps with Yes/No gates.
      *   **Step 1 (vNM Check):** Focus on consistency and willingness to accept probability.
      *   **Step 2 (Independence):** Use a specific test scenario (e.g., adding a common risk to two options).
      *   **Step 3 (Weights):** Explicitly state "Board Vote" or "Policy Mandate."
      *   **Step 4 (Utility Scaling):** Use a 0-100 scale anchored by "Status Quo" and "Catastrophe."
      *   **Step 5 (Calculation):** Weighted sum.
      *   **Deferral Rules:** When to stop.

  5.  **Drafting the Applications:**

      *   *Case 1 (Levee):* Ag reps hate lotteries (violation of Continuity or Independence?). If they reject probabilistic flood risk, they aren't vNM agents. *Result:* Deferral or modification of the model (e.g., use worst-case).
      *   *Case 2 (Transit):* Present vs. Future. Future uses discounting. Disagreement on weights. *Result:* Show the math. If weights favor present, transit fails. If weights favor future, transit passes.
      *   *Case 3 (Conflict):* Need a scenario where the sum is positive, but it feels wrong (e.g., tyranny of the majority, or rights violation). Harsanyi is utilitarian. It ignores rights/distributional fairness unless encoded in weights/utility. *Example:* Displacing a small minority for large gain to majority.

  6.  **Addressing the "Hard Cases" & Limitations:**
      *   Must explicitly mention that Harsanyi cannot solve the "weighting" problem normatively.
      *   Must mention that goods like "justice" or "rights" might not fit in $u_i$.

  7.  **Review against Constraints:**
      *   *Two-hour session?* The steps need to be tight. No complex elicitation.
      *   *No software?* Arithmetic must be simple (integers, percentages).
      *   *Stopping rules?* Yes, "If No, go to Step X."
      *   *Non-economists?* Avoid jargon like "affine transformation" without explanation.

  8.  **Final Polish:**
      *   Ensure the tone is advisory and procedural.
      *   Check that the "Conflict Case" clearly illustrates the limitation of Utilitarianism (which Harsanyi implies).
      *   Make sure the "Independence Failure" handling is practical (since the prompt highlights ambiguity aversion).

      *(Self-Correction during drafting)*: Initially, I might think about asking them to elicit full utility functions. That's too hard for 2 hours. I should suggest a *simplified scoring system* (0 to 10) that *approximates* cardinal utility, with a warning that this is an approximation.
      *(Self-Correction on Weights)*: I must emphasize that the procedure *does not calculate weights*. It requires the board to *input* them. This is a crucial distinction.
      *(Self-Correction on Independence)*: If Independence fails, Harsanyi's theorem technically breaks. I need a rule that says "If Independence fails, Harsanyi aggregation is invalid; switch to Precautionary Principle or Deferral."

  9.  **Finalizing the Output Structure:**
      *   Header: Memo format.
      *   Section 1: The Protocol (Steps 1-5).
      *   Section 2: Handling Hard Cases (Future, Ambiguity).
      *   Section 3: Applied Scenarios (Levee, Transit, Moral Conflict).
      *   Section 4: Limitations & Conclusion.

  10. (Final Check of the Prompt Requirements):
      *   Ordered sequence of tests? Yes.
      *   Explicit stopping rules? Yes.
      *   Verification questions? Yes.
      *   Independence check & failure handling? Yes.
      *   Welfare weights (value judgment)? Yes.
      *   Computation (ordinal to cardinal)? Yes.
      *   Final aggregation & deferral? Yes.
      *   Hard cases (future, ambiguity)? Yes.
      *   Two proposals (Levee, Transit)? Yes.
      *   Conflict case (Approval vs. Intuition)? Yes.
      *   Conclusion on limitations? Yes.

  Proceed to generate response.
answer: |-
  **MEMORANDUM**

  **TO:** Regional Public-Works Board
  **FROM:** Methodological Adviser
  **SUBJECT:** Operational Procedure for Harsanyi-Based Welfare Aggregation
  **DATE:** October 26, 2023
  **TIME ALLOCATION:** 120 Minutes (Strict)

  ### **Executive Summary**
  This document outlines the **Harsanyi Aggregation Protocol (HAP)**. Its purpose is to convert conflicting stakeholder reports into a single social welfare metric using the logic of Harsanyi's Aggregation Theorem. The theorem states that if individual and social preferences satisfy specific rationality axioms (vNM), social welfare is a weighted sum of individual utilities.

  **Warning:** This procedure is a calculation tool, not an ethical oracle. It requires the Board to supply ethical weights. If the procedure yields a result that violates fundamental rights or intuition, the Board must exercise its override authority (see Step 5).

  ---

  ### **Part I: The Decision Protocol (120 Minutes)**

  #### **Step 1: vNM Preference Verification (20 Minutes)**
  *Goal: Ensure stakeholder reports represent rational preferences over risk.*
  **Action:** Review each stakeholder submission. Ask the following three questions regarding their stated preferences over project outcomes (e.g., "Flood" vs. "No Flood").

  1.  **Completeness:** Can the stakeholder rank every pair of outcomes (A is better than B, B is better than A, or Indifferent)?
  2.  **Transitivity:** If A > B and B > C, is A > C?
  3.  **Continuity (Risk Tolerance):** Is there *any* probability of the worst outcome that would make the stakeholder reject a gamble for the best outcome? (e.g., Would you reject a 1% chance of death for $1 million?)

  **Stopping Rule:**
  *   **IF** any stakeholder answers "No" to Completeness or Transitivity: **STOP.** Their report is logically inconsistent. Request revision.
  *   **IF** any stakeholder answers "No" to Continuity (e.g., "No risk of extinction is acceptable"): **FLAG.** Proceed to Step 2, but note this group violates vNM assumptions.

  #### **Step 2: The Independence Axiom Check (30 Minutes)**
  *Goal: Detect ambiguity aversion or context-dependent risk.*
  **Action:** Present the following test to stakeholders who passed Step 1, specifically regarding uncertain scenarios (e.g., climate models).

  *   *Scenario:* "Do you prefer Option A (50% chance of High Benefit, 50% Low Benefit) over Option B (Guaranteed Medium Benefit)?"
  *   *Modification:* "Now assume there is a 50% chance the project is cancelled entirely (Zero Benefit) regardless of your choice. Does your preference between A and B change?"

  **Logic:** Under vNM, adding a common risk (cancellation) should not flip your preference.
  **Stopping Rule:**
  *   **IF** preference flips (Independence Violation): **HALT HAP FOR THIS GROUP.** This indicates Ambiguity Aversion (common in climate cases).
      *   *Remedy:* Do not use their utility in the linear sum. Instead, apply a **Precautionary Discount** (reduce their reported benefit score by 50%) or move to **Deferral** (see Step 5).
  *   **IF** preference holds: Proceed to Step 3.

  #### **Step 3: Welfare Weight Determination (20 Minutes)**
  *Goal: Assign ethical importance to each stakeholder group.*
  **Action:** The Board must assign a weight ($w_i$) to each verified stakeholder group $i$.
  *   **Constraint:** Weights must be non-negative ($w_i \ge 0$).
  *   **Normalization:** For ease of calculation, set the sum of all weights to 10 (e.g., if 2 groups have equal standing, $w_1=5, w_2=5$).

  **CRITICAL VALUE JUDGMENT:**
  *   **The Procedure Cannot Determine Weights.** Harsanyi's theorem proves weights *exist* if Pareto efficiency holds, but it does not say what they *should be*.
  *   **Instruction:** Assign weights based on statutory mandate, population size, or vulnerability.
  *   **Future Generations:** If a proxy represents future generations, assign $w_{future}$ based on the Board's ethical discount rate policy (e.g., if using a 3% discount rate over 50 years, the weight may be significantly lower than present users).

  #### **Step 4: Utility Cardinalization & Computation (30 Minutes)**
  *Goal: Convert ordinal rankings to cardinal scores for summation.*
  **Problem:** Stakeholders usually say "I prefer A to B." Harsanyi requires "A gives me 10 units of welfare, B gives me 5."
  **Action:** Use the **Anchored Scaling Method** (Manual Approximation).

  1.  Identify the **Worst Possible Outcome** ($O_{min}$) for the region. Assign Utility = 0.
  2.  Identify the **Best Possible Outcome** ($O_{max}$) for the region. Assign Utility = 100.
  3.  Ask stakeholders to place their expected project outcome on this 0–100 scale.
      *   *Note:* If a stakeholder only provides ordinal ranks (1st, 2nd, 3rd), assume equal spacing unless they specify intensity (e.g., "1st is much better than 2nd").
  4.  **Calculation:** Compute Social Welfare ($W$) for each proposal:
      $$W = \sum (w_i \times u_i)$$
      *(Where $w_i$ is the weight from Step 3 and $u_i$ is the 0–100 score from Step 4).*

  **Stopping Rule:**
  *   **IF** stakeholders refuse to provide cardinal scores (0–100) and insist only on ordinal ranks: **FLAG.** The aggregation is technically invalid. Proceed with caution using assumed equal intervals, but note high uncertainty.

  #### **Step 5: Final Aggregation & Deferral Rule (20 Minutes)**
  *Goal: Make the decision or recognize failure.*

  1.  **Compare:** Calculate $W_{proposal}$ vs. $W_{status\_quo}$.
  2.  **Decision:** If $W_{proposal} > W_{status\_quo}$, the procedure recommends **Approval**.
  3.  **Deferral Conditions (Mandatory Human Vote):**
      *   If Step 2 (Independence) failed for >50% of affected population.
      *   If the Weight Assignment (Step 3) resulted in a tie or deadlock.
      *   If the Recommendation conflicts with Constitutional Rights or Statutory Protections (see Limitations).

  ---

  ### **Part II: Handling Hard Cases**

  **1. Future Generations (Discount-Rate Proxies)**
  *   **Issue:** A proxy (e.g., "Office of Sustainability") represents people not yet born. They use discount-rate models to value future welfare.
  *   **Procedure Adjustment:** In Step 3, the weight $w_{future}$ is not a headcount. It is a function of the Board's chosen social discount rate.
  *   **Risk:** High discount rates effectively set $w_{future} \approx 0$, silencing the proxy. The Board must explicitly vote on the discount rate before Step 3 begins.

  **2. Ambiguity Aversion (Climate Scenarios)**
  *   **Issue:** Stakeholders refuse to assign probabilities to climate outcomes (e.g., "I don't know the chance of sea-level rise, so I won't gamble"). This violates the Independence Axiom (Step 2).
  *   **Procedure Adjustment:** Do not force a probability. Treat the ambiguity as a cost. In Step 4, reduce the utility score ($u_i$) of the ambiguous proposal by an "Ambiguity Penalty" (e.g., -20 points) before aggregation. This approximates max-min expected utility without breaking the calculation.

  ---

  ### **Part III: Applied Scenarios**

  #### **Case 1: Coastal Levee Reinforcement**
  *   **Stakeholders:** Urban Residents (Pro-Levee), Agricultural Representatives (Anti-Levee).
  *   **Conflict:** Ag Reps reject standard lotteries over flood probabilities. They argue, "A 1% chance of total crop loss is unacceptable, regardless of compensation."
  *   **Procedure Execution:**
      *   **Step 1:** Ag Reps fail Continuity (No risk acceptable).
      *   **Step 2:** Ag Reps fail Independence (Ambiguity on flood models).
      *   **Outcome:** **DEFERRAL.**
      *   **Reasoning:** Harsanyi aggregation requires vNM compliance. The Ag Reps view the risk as a rights violation, not a utility trade-off. The Board cannot sum these preferences linearly. A political negotiation on safety standards is required, not a welfare calculation.

  #### **Case 2: Transit Corridor Extension**
  *   **Stakeholders:** Present Users (High immediate utility), Future-Gen Proxy (Low discounted utility due to maintenance costs).
  *   **Data:**
      *   Present Users: $u = 90$, Weight $w = 5$.
      *   Future Proxy: $u = 20$ (burdened by debt), Weight $w = 2$ (discounted).
  *   **Calculation:**
      *   $W = (5 \times 90) + (2 \times 20) = 450 + 40 = 490$.
      *   Status Quo $W = (5 \times 50) + (2 \times 50) = 350$.
  *   **Outcome:** **APPROVE.**
  *   **Reasoning:** Despite the Future Proxy's objection, the heavy weighting of present users (mandated by Board policy on discounting) drives the sum positive. The procedure faithfully executes the Board's prior ethical commitment to the discount rate.

  #### **Case 3: The Moral Conflict (The "Tyranny" Case)**
  *   **Proposal:** Build a waste facility in a small, low-income neighborhood to save the region money.
  *   **Stakeholders:**
      *   Region (Majority): $u = 80$ (lower taxes), $w = 9$.
      *   Neighborhood (Minority): $u = 0$ (health hazard), $w = 1$.
  *   **Calculation:**
      *   $W_{build} = (9 \times 80) + (1 \times 0) = 720$.
      *   $W_{status\_quo} = (9 \times 50) + (1 \times 50) = 500$.
  *   **Procedure Recommendation:** **APPROVE.**
  *   **Board Intuition:** **REJECT.** (Violates distributive justice/rights).
  *   **Explanation:** Harsanyi's theorem is Utilitarian. It maximizes the *sum*, not the *distribution*. It treats utility as a single currency. If the majority gains enough, the theorem permits sacrificing the minority.
  *   **Action:** Invoke **Step 5 Deferral Condition**. The procedure identifies the net gain, but the Board must override it because the procedure cannot account for *rights constraints* or *fairness* unless explicitly built into the weights (which requires the Board to value the minority higher than their population share).

  ---

  ### **Part IV: Limitations & Conclusion**

  The Board must recognize that this procedure is a **consistency check**, not a **moral compass**. Specifically:

  1.  **Normative Source of Weights:** The procedure cannot determine *who counts*. Setting $w_i$ is a political act. Harsanyi's theorem assumes weights exist; it does not justify them. If the Board sets weights arbitrarily, the output is mathematically precise but ethically hollow.
  2.  **Non-Utility Goods:** The procedure assumes all value can be captured in $u_i$ (0–100 scale). It cannot process "Rights," "Justice," or "Dignity" unless stakeholders translate these into utility losses. If a stakeholder says, "This violates a right," and the Board forces them to give a utility score, the procedure has already failed to capture the moral reality.
  3.  **Interpersonal Comparison:** The 0–100 scale assumes a "unit of utility" is roughly comparable across people. This is an assumption. One person's "50" might be another's "90." The procedure requires the Board to act *as if* these are comparable.

  **Final Advisory:** Use HAP to clarify trade-offs and expose inconsistencies. Do not use HAP to abdicate responsibility for the ethical weights or to override fundamental rights. When the math conflicts with conscience, the conscience must vote.
