      *   *Premise 2:* This quantity behaves like physical quantities (conserved or divided among branches).
      *   *Observation:* In fission (2 copies), Parfit says there is *no loss* of what matters (it's as good as survival).
      *   *User's Deduction:* If it's not divided, it must be additive. If additive, $N$ copies $\times$ Fidelity $F$ = Total Value.
      *   *Reductio:* If $N$ is large and $F$ is slightly $< 1$, Total Value $> 1$ (survival). This creates a "fission pump."
      *   *The Error:* The assumption that "what matters" is *additive* across distinct subjects.

  3.  **Address the Core Philosophical/Conceptual Error (The "Physics" Analogy):**
      *   The user is treating a *relational* property (survival *for me*) as an *aggregate* property (total utility/value in the universe).
      *   In physics, energy is conserved globally. In Parfit's view, "what matters" is indexed to the *subject*.
      *   *Key Distinction:* "What matters" is not a substance flowing through time; it's a description of the *relation* between person-stages.
      *   *The Fission Case:* If I split into Lefty and Righty, I don't survive as *one* person. But from the perspective of "what matters," having two successors is not *worse* than having one. It doesn't mean I get "double survival." It means the *fear of death* is unwarranted.
      *   *The "Fission Pump" Flaw:* Creating 1000 low-fidelity copies doesn't give *me* 1000 times the survival. It gives 1000 *other* people who are psychologically connected to me. From *my* current perspective, does this improve *my* survival? Parfit would say survival isn't a scalar quantity that can be maximized like utility. It's binary in practice (am I going to exist later?) but the *quality* of that connection is what R measures. But crucially, R is not *aggregatable* across distinct future streams to benefit the current stream.
      *   *Analogy:* Think of it not like Energy (conserved), but like *Information* or *Correlation*. If I send a signal to two receivers, the information isn't "doubled" for the sender. The sender's state is just correlated with two future states.
      *   *Better Analogy:* Probability. If I have a 50% chance of surviving, that's different from having two successors each with 100% psychological connectedness. Parfit argues the latter is *better* than death, not that it equals "200% survival."
      *   *Correction:* "What matters" is not a conserved fluid. It is a relation that holds *between* stages. In fission, the relation holds twice. But you cannot sum the relations of *distinct* future people to get a "super-survival" for the *current* person. The "value" is indexed to the *future subject's* experience of being the successor, not a global tally.

  4.  **Address the No-Cloning Theorem (Physics Objection):**
      *   *User's Colleague:* Quantum no-cloning forbids copying unknown states. Quantum teleportation destroys the original.
      *   *Response:* Parfit's thought experiment is *functionalist*, not necessarily quantum-mechanical. It assumes the brain is computable/classical at the relevant level of description (connectome/synaptic weights).
      *   *Physics Check:* Molecular spectroscopist knows that macroscopic states (like neural firing patterns) are generally decohered and treatable classically. The "quantum state" of a person is not a coherent superposition needed for no-cloning to apply in the strict sense. We are talking about *information* patterns, not wavefunction replication.
