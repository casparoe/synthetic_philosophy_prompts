answer: |-
  Here are four positions from the foundations of decision theory, translated into your stack.

  **1. Operationalism (Strict Revealed Preference)**
  *   **Utility:** The optimal value function of your regularised objective ($R - \beta \text{KL}$).
  *   **Choice Behaviour:** The current policy's sampling distribution $\pi(\tau|x)$.
  *   **Claim:** There is no latent reward signal independent of the policy. The reward model is merely a compression of the choice structure. Off-policy evaluation is category error; if a trajectory is not sampled by $\pi$, it has no reward value.
  *   **Analogue to No-Cycles:** Stochastic transitivity in pairwise labels. If violations occur, no scalar reward exists, even on-policy.

  **2. Mentalist Realism**
  *   **Utility:** A latent scalar field $R^*(\tau)$ existing independently of $\pi$.
  *   **Choice Behaviour:** Annotator selections modelled as noisy samples from $R^*$.
  *   **Claim:** The preference dataset is a noisy measurement of $R^*$. Distribution shift is a measurement problem, not an ontological one. With sufficient coverage (fixed proposal distribution), you can recover $R^*$ off-policy.
  *   **Analogue to No-Cycles:** Violations imply measurement noise or model misspecification, not the absence of utility.

  **3. Normative Welfarism**
  *   **Utility:** A user welfare function $W(\tau)$, distinct from annotator choices.
  *   **Choice Behaviour:** Annotator preferences (treated as biased proxies).
  *   **Claim:** Annotator choices reveal preferences, but preferences may not align with welfare (e.g., due to deception or shortsightedness). Optimising the recovered reward may minimise true welfare. The objective should be $W$, not the rationalisation of choices.
  *   **Analogue to No-Cycles:** Irrelevant. Choices can be perfectly consistent (rational) yet welfare-reducing.

  **4. Proceduralism (Context-Dependence)**
  *   **Utility:** A function $R(\tau, \mathcal{M})$ dependent on the menu $\mathcal{M}$ of offered completions.
  *   **Choice Behaviour:** Selection from the specific self-generated menu.
  *   **Claim:** Preferences are constructed during elicitation. As your policy drifts, the menu $\mathcal{M}$ changes, altering the utility function itself. A fixed proposal distribution does not fix the problem; it merely changes the construction context.
  *   **Analogue to No-Cycles:** Cycles may appear when aggregating choices across different menus, indicating utility is not state-independent.

  **Residue Report**

  Your suspicion is correct: your vocabulary cannot express the ontological disagreement between Operationalism and Realism.

  **1. "Underdetermined" vs. "No Fact of the Matter"**
  *   **Translation Status:** No expression.
  *   **Analysis:** Your vocabulary assumes a loss landscape exists to be minimised. You can express "many reward functions fit the data" (underdetermined/non-identifiable). You cannot express "there is no reward function to fit" (ontological emptiness). When the Operationalist says reward is undefined off-policy, and the Realist says it is merely unobserved, you hear both say "underdetermined by data".
  *   **Verdict:** **Vocabulary Gap.** You lack a formalism for ontological commitment. You treat reward as a parameter vector $\phi$; the dispute is whether $\phi$ refers to anything outside the computation graph. Filling this gap requires distinguishing *epistemic* uncertainty (noise) from *ontic* indeterminacy (non-existence).

  **2. "Reward Hacking"**
  *   **Translation Status:** Translates only with hidden assumption.
  *   **Analysis:** To say the policy is "hacking" the reward model implies $R_{\text{model}}(\tau) \neq R_{\text{true}}(\tau)$. The Operationalist forbids this; for them, $R_{\text{true}}$ off-policy is meaningless. Using the term "hacking" smuggles in Mentalist Realism. You are committing to a ground truth you officially disown in design reviews regarding non-identifiability.
  *   **Verdict:** **Substantive Pseudo-Problem.** This is not a gap you need to fill. Engineering requires a target. Even if reward is ontologically empty off-policy, you must act *as if* it exists to prevent degradation. The dispute is metaphysical; the term "hacking" is a pragmatic necessity for stability. Do not let the philosophy break the engineering heuristic.

  **Summary**
  The Operationalist and Realist agree on the maths (gradient descent on loss) but disagree on what the variables refer to. Your stack captures the maths but collapses the reference. You cannot state the disagreement without importing metaphysics. However, for engineering purposes, the Realist assumption is a necessary fiction. Treat the "no fact of the matter" claim as a warning about overfitting, not a literal denial of external validity.
