          *   *Rank:* Awkward but survivable if one refines "modernity" to mean *instrumental rationality* specifically, not just record-keeping.
      *   *Candidate 2: Algorithmic Governance (Post-Modernity).*
          *   *Analysis:* Bauman's distancing relies on human agents passing the buck. Algorithmic decision-making removes the human agent entirely from the specific decision.
