      *   *Wait, I need to be careful.* Bauman distinguishes between *formal* rationality (efficiency of means) and *substantive* rationality (goals). The Holocaust was formally rational. So the 'irrationality' objection is often misunderstood. I should treat it as 'Awkward' rather than 'Fatal' because Bauman has a counter-argument ready.
      *   *The Pre-Modern objection is stronger.* If the Incas or Assyrians did it, "Modernity" is not the differentiator.
      *   *The Algorithmic objection is interesting.* Does it extend or break? If it breaks, does it invalidate the Holocaust analysis? No, it just means we are in a new epoch. But if the *mechanism* of distancing relies on *human* psychology (obedience), and algorithms remove the human, does the theory hold?
