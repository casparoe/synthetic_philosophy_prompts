answer: |-
  1. The Lockean argument suggests settlers earn ownership of celestial land by mixing their labor with it, effectively turning unowned resources into private property through improvement. This view prioritizes individual initiative and resource extraction as the basis for legitimate claims in space.
  2. In contrast, the stewardship model treats planets and asteroids as inalienable commons that must be preserved in trust for all humanity, including future generations. This framework prevents private appropriation and emphasizes collective responsibility over individual gain.
  3. These frameworks clash fundamentally because Lockean rights encourage rapid transformation of the environment, while stewardship demands restraint to maintain the status quo for others. The tension lies between viewing space as a frontier for acquisition versus a heritage for conservation.
  4. Applying the non-identity problem reveals that colonization policies determine which specific individuals are born in the future, meaning different rules create entirely different populations. If strict stewardship prevents colonization, the specific people who would have lived under a Lockean system never exist to complain about their absence.
  5. Consequently, future colonists cannot claim they were harmed by a stewardship model that prevented their birth, since they owe their existence to the specific policies that allowed them to be conceived. This paradox challenges whether we can owe duties to specific future individuals regarding property rights when our actions determine their very identity.
