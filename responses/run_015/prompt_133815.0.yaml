          *   *Conflict:* If you can't run the counterfactual (because history is unique/underdetermined), how do you satisfy the interventionist criterion for macro causes?
          *   *Severity:* High. This threatens the core definition of causation for the specific domain (macro-history) the user cares about.

      *   **Tension C: (1) vs (2) [The Constraint vs. Cause Clash]**
          *   (1) says culture is a "modal constraint" (shapes imagination/legitimacy).
          *   (2) says culture is "genuinely causal" (interventionist).
          *   *Conflict:* Is a constraint a cause? In interventionism, yes (changing the constraint changes the outcome). But (1) sounds like it's softening the blow ("not billiard ball").
          *   *Severity:* Low/Medium. Mostly terminological. Interventionism handles constraints well (changing the rules changes the game).

      *   **Meta-Commitment Check:**
          *   Explanatory Pluralism + Ontological Monism.
          *   This tries to save (3) and (4). You can explain via macro (Pluralism) but the *causation* itself is one thing (Monism).
