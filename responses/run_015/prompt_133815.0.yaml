      *   **Commitment 2 (Interventionism):** $X$ causes $Y$ if manipulating $X$ changes $Y$. Relies on counterfactuals.
      *   **Commitment 3 (Weak MI):** All causal mechanisms must run through individuals. No group minds.
      *   **Commitment 4 (Macro Realism):** Macro patterns (path dependence) are causally real and *not reducible* to summed psychology (due to feedback loops).
      *   **Commitment 5 (Anti-Epi):** Culture matters.
