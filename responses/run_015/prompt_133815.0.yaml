      *   Be specific about what to give up.
      *   No citations.

      *(Self-Correction during drafting)*: Wait, let's look closer at (1) vs (2). User asks if "modal constraint" denies causation. In interventionism, constraints *are* causes. If I change the speed limit (constraint), accident rates change. So (1) and (2) are actually very compatible. I should mark this as a "dissolves on inspection" point.

      Let's look at (3) vs (4) again. "Weak Methodological Individualism" usually means *all social phenomena are the result of individual actions*. "Not reducible to summed-up psychology" usually refers to *emergence*. These are compatible *if* the user distinguishes between *ontology* (what exists) and *explanation* (how we model). But the user says "ontologically im a monist." If macro patterns are "causally real," do they exist? If they exist and aren't individuals, Ontological Monism is threatened unless the macro patterns are *relations* between individuals. I need to be careful here. The tension is between "bottom out in individuals" and "not recoverable." If it's not recoverable, how does it bottom out?
