      *   *Severity 1: (2) vs (6).* Interventionism *requires* well-defined counterfactuals. If macro-history counterfactuals are "broken," you cannot claim interventionist causation for macro-history. You are left with causation for small-scale stuff only.
          *   *Fix:* Drop strict Interventionism for macro-history. Adopt a "Process/Mechanism" view for history (tracing the chain) while keeping Interventionism for general social science theory. Or, soften (6) to say they are *hard*, not *broken*.
      *   *Severity 2: (3) vs (4).* "Bottom out in individuals" vs "Not recoverable at individual level."
          *   *Fix:* Refine (3). Change "bottom out in individual beliefs" to "mediated by individual actions." This allows the *structure* (macro) to be real and causally efficacious (path dependence) as long as it works *through* individuals, even if the *pattern* isn't visible at the individual level. This saves Weak MI without killing Macro Realism.
      *   *Severity 3: Meta.* Ontological Monism + Explanatory Pluralism is tricky if (4) is true. If macro causation is real and not reducible, is it the *same kind* of causation as individual causation?
          *   *Fix:* Keep Explanatory Pluralism. Drop Ontological Monism. Accept that "causation" might mean slightly different things at different levels (or is a pragmatic tool). Or, double down on Monism and force (4) to be reducible (which the user doesn't want). Better to drop Ontological Monism.

  5.  **Final Review against User Constraints:**
