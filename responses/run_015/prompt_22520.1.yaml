answer: |-
  Franklin's Quaker friend asked him, "Ben, how can you track humility without turning it into a competition with yourself?"

  Franklin sighed and pointed to the thirteenth row of his chart. "You can't. Every time I resisted pride, I felt proud of my restraint, so I marked a black dot. But then I felt virtuous for my honesty in marking the dot, so I marked another. By Wednesday, the column was solid ink.

  "So I stopped keeping score entirely. Now, when I look at the blank row, I feel proud of my perfection. And when I tell everyone I never actually acquired the virtue, I get credit for humility without the burden of having it. I never acquired the virtue, but I did balance the books."
