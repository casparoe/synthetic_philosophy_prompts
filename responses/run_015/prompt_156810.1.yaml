  This is a classic "philosophical detective" exercise. Your professor is playing the role of a theorist who believes definitions are best tested against intuitions (the method of cases), rather than stated dogmatically. Based on the track record you've provided, I can reconstruct her theoretical commitments with high confidence.

  Here is the breakdown of her rule, the predictions for your new cases, and the diagnostic tools you asked for.

  ### 1. The Rule: Public Intentional-Historical Definition
  Your professor is running a modified version of **Jerrold Levinson's Intentional-Historical Definition**, with a specific constraint on **publicity**.

  The core rule is: *X is a work of art if it is intended by its maker for regard-as-a-work-of-art, i.e., regard in any way preexisting artworks are or were correctly regarded.*

  However, her verdict on the **Private Stones** adds a crucial clause: *The intention must be externally offered.* It is not enough to intend privately; the work must be put forward for potential regard by others.

  **Why this fits the data best:**
  *   **Duchamp/Warhol:** Intended for art-regard (specifically, regarding non-art as art).
  *   **Sunset/Nest:** No human intention.
  *   **Fridge Drawing:** The child lacks the concept of "art-regard" (she explicitly said the kid "wasn't doing what Duchamp was doing").
  *   **Elephants:** No human intention.
  *   **Van Meegeren:** Intended for art-regard (even if deceptively).
  *   **Cathedral vs. Bridge:** Cathedral was built for religious/symbolic regard (a precursor to art-regard); Bridge was built for utility. Beauty is irrelevant (hence the Bridge verdict).
  *   **Lascaux Facsimile:** Intended as a document/copy, not for regard as an *original work*.
  *   **Private Stones:** Intention existed, but no **offer** was made ("nothing was ever offered").

  ### 2. Predictions on the Three New Cases

  **Case 1: The Engineer's Kinetic Machine**
  *   **Verdict:** **Not Art.**
  *   **Reasoning:** This is the inverse of Duchamp. Duchamp took a non-art object and *intended* it for art-regard. The Engineer takes an object and *explicitly denies* art-regard ("insists... definitely not art"). Under an Intentional-Historical view, the maker's intention is constitutive. The curator's desire to show it is irrelevant (Institutional Theory would say it *is* art once shown; your professor's verdict on the Private Stones suggests she prioritizes the maker's offer over the viewer's uptake).
  *   **Key Precedent:** Private Stones (no offer/intention for art-regard) + Fridge Drawing (maker not doing "art things").

  **Case 2: The Guerrilla Painting**
  *   **Verdict:** **Art.**
  *   **Reasoning:** The woman intended the painting to be regarded as art (hanging it in a museum corridor is a clear signal of art-regard). It was regarded as art (by guards/cleaners) for a week. The museum's later denial is akin to the Artworld rejecting a piece, but rejection does not strip arthood (see: Van Meegeren was still art even when exposed as a forgery). The lack of permission affects *legality*, not *arthood*.
  *   **Key Precedent:** Duchamp (context confers meaning) + Van Meegeren (dishonesty/rejection doesn't negate arthood).

  **Case 3: The AI Student**
  *   **Verdict:** **Art.**
  *   **Reasoning:** She intends the output to be regarded as her work (in the tradition of painting). The method (AI vs. Brush) is secondary to the intentional stance. The deception regarding the process makes it *dishonest* art, but not *non-art*.
  *   **Key Precedent:** Van Meegeren (forgery is dishonest art, but still art).

  ### 3. The Constraining Verdict
  You guessed the Cathedral/Bridge pair, but the single verdict doing the most work is the **Private Stones**.

  *   **Why:** The Cathedral/Bridge pair rules out Aestheticism (beauty isn't enough). But the Private Stones verdict rules out **Pure Institutional Theory** (Dickie). A pure Institutionalist would argue that if the maker regards it as art, or if *anyone* regards it as art, it gains status. By saying "Probably not... because nothing was offered," she establishes that **maker intention + public offer** is necessary, even if institutional *conferral* (acceptance) is not. This constraints the Engineer case (Maker says No) and the Guerrilla case (Maker says Yes + Offer made).

  ### 4. The "First Art" Problem
  The fact that she waved off the "First Art" problem is a strong signal that she is a **Historicist**.

  *   **The Logic:** The "First Art" problem (If art is defined by reference to prior art, what was the first art?) is the specific Achilles' heel of Historical Definitions (like Levinson's). Institutionalists and Aestheticists do not have this problem.
  *   **The Wave-Off:** If she were an Institutionalist, she wouldn't need to wave it off; the "Artworld" just emerges sociologically. By waving it off, she acknowledges the problem exists for her theory but treats it as a boundary condition that doesn't invalidate the definition for *subsequent* art. She is likely assuming a "bootstrapping" view (the first art is art by virtue of having properties that *later* became art-properties), which is a standard Historicist move.

  ### 5. The Discriminating Case
  To separate the two closest competing rules—**Public Intentional-Historical** (her likely view) vs. **Institutional Theory** (the main rival)—you need a case where Intention/Offer exists, but Institutional Conferral is explicitly denied.

  **The Case: The Blacklisted Submission**
  > An artist creates a sculpture, intending it to be regarded as art (in the tradition of Rodin). She submits it to the National Gallery. The jury explicitly rejects it, issuing a public statement: "This is not art; it is merely a manufactured object." They return it to her. She keeps it in her living room. It is never shown publicly again.

  *   **Public Intentional-Historical Prediction:** **Art.**
      *   *Why:* The maker had the correct intention and made the public offer. The Artworld's rejection is a judgment of *quality* or *category*, but it cannot retroactively erase the intentional-historical status. (Matches Van Meegeren: rejected/fake, but still art).
  *   **Institutional Theory Prediction:** **Not Art.**
      *   *Why:* The Artworld (the Gallery) explicitly refused to confer the status of "candidate for appreciation." Without that conferral, the object remains a mere artifact.

  ### 6. The Family Resemblance Caveat
  If the honest answer is that her verdicts are just **Family Resemblance** judgments (Wittgenstein), then no single rule will perfectly predict every case because there is no essence to "art."

  **Is the definitional project still worth doing?**
  Yes, for two reasons:
  1.  **Mapping the Grammar:** Even if there is no definition, tracing the "rules" she uses reveals the *values* of our current art-concept. For example, her distinction between the Bridge and Cathedral tells us that our concept of art prioritizes *symbolic intent* over *functional beauty*. That is a sociological fact about us, even if it isn't a metaphysical fact about Art.
  2.  **Spotting Tensions:** The project reveals where our intuitions conflict (e.g., Engineer vs. Curator). Philosophy doesn't always solve these, but it clarifies *why* we disagree (Intention vs. Uptake). The value lies in the clarity of the conflict, not the resolution.

  **Summary for your seminar:**
  She is a **Historical Intentionalist** who requires a **Public Offer**. She prioritizes the maker's stance over the institution's acceptance (Stones/Engineer) but requires the maker to step into the public sphere (Stones). She treats dishonesty as a moral flaw, not an ontological one (Van Meegeren/AI). The "First Art" wave-off confirms she accepts the historical recursion despite its logical cost.
