answer: |-
  There is no canonical, established name for this specific asymmetry in the existing literature. While it resides within the broader debates surrounding Parfit's "Spectrum Arguments," the Repugnant Conclusion, and the aggregation problem, the specific distinction between *somatic* micro-harms and *epistemic* micro-harms does not have a dedicated label like "The Benign Addition Paradox" or "The Non-Identity Problem."

  However, the phenomenon can be precisely carved conceptually. The most accurate descriptive label is **The Somatic-Cognitive Aggregation Asymmetry**.

  Below is the conceptual definition, its boundary conditions against related problems, and an analysis of where the distinction fails.

  ### 1. Conceptual Definition

  **The Somatic-Cognitive Aggregation Asymmetry** is the normative intuition that micro-harms grounded in sensory immediacy (somatic) are fungible and aggregable across persons, while micro-harms grounded in interpretive mental states (cognitive/epistemic) are non-fungible and resistant to aggregation, even when stipulated to be equivalent in subjective disutility.

  This asymmetry relies on a hidden premise regarding the **intersubjective comparability of qualia**. It assumes that a "unit" of physical irritation is a stable, transferable metric across different bearers (Person A's itch is comparable to Person B's itch), whereas a "unit" of epistemic confusion is context-bound and idiosyncratic (Person A's confusion about math is not comparable to Person B's confusion about directions). Consequently, the somatic harms sum linearly, while the epistemic harms remain isolated integers that do not compound into a collective moral weight.

  *Note on Terminology:* Your use of "phenomenally transparent" for somatic harms diverges from standard philosophy of mind usage (where transparency usually refers to perceptual experience looking *through* to the world, while pain is often considered opaque). For the sake of this carving, I will treat your usage as **"Sensory Immediacy"** (somatic) versus **"Content Mediation"** (epistemic).

  ### 2. Boundary Conditions

  To isolate this asymmetry, we must distinguish it from three adjacent philosophical problems.

  **A. Versus Scope Neglect (Psychological Insensitivity)**
  *   **Scope Neglect:** A global failure to scale moral concern with numbers. (e.g., 1,000 birds dying feels the same as 10,000).
  *   **The Asymmetry:** This is not a global failure to scale. The subject *is* willing to scale the somatic harms (10 billion irritations = bad). The failure to scale is local and content-specific. If the intuition were scope neglect, the subject would reject aggregation for *both* the irritations and the confusions. The fact that they accept one and reject the other rules out simple scope insensitivity.

  **B. Versus Person-Affecting Restrictions**
  *   **Person-Affecting View:** An act is only wrong if it makes some *particular* person worse off.
  *   **The Asymmetry:** Both scenarios satisfy the person-affecting view. In both cases, specific individuals are made slightly worse off. The person-affecting view does not explain why the *type* of worsening matters for aggregation. The asymmetry operates *within* the set of harms that already qualify as person-affecting.

  **C. Versus The Non-Identity Problem**
  *   **Non-Identity:** Concerns whether future people can be harmed by actions that also bring them into existence.
  *   **The Asymmetry:** The scenarios you describe involve existing populations experiencing concurrent harms. The identity of the victims is fixed. The asymmetry is about the *nature of the experience*, not the *existence of the experiencer*.

  **D. Versus Lexical Views (Threshold Deontology)**
  *   **Lexical Views:** Certain severe harms (torture) cannot be outweighed by any number of minor harms (specks).
  *   **The Asymmetry:** Lexical views usually draw a line based on *intensity*. Your scenario stipulates that the intensity is identical (barely noticeable). The asymmetry draws the line based on *category* (body vs. mind). It suggests a "Category Lexicality" where somatic micro-harms are aggregable but cognitive micro-harms are not, regardless of intensity.

  ### 3. Where the Edges Fail

  A precise conceptual carving must identify where the distinction dissolves. The Somatic-Cognitive Aggregation Asymmetry loses coherence under the following conditions:

  **A. The Psychosomatic Bridge**
  If the epistemic confusion is stipulated to produce a somatic marker (e.g., "a moment of confusion that causes a micro-tension headache"), the resistance to aggregation typically vanishes. This suggests the asymmetry is not about the *source* of the harm (epistemic) but about the **embodiment of the signal**. If the cognitive harm recruits a sensory channel, it becomes aggregable. This implies the asymmetry is actually a **"Sensory Verifiability Bias"** rather than a deep moral distinction.

  **B. The Agency Dilution**
  The asymmetry weakens if the epistemic harm is framed as externally imposed rather than internally generated. If the confusion is caused by "gaslighting" or "information obstruction" (an external agent obscuring truth), people are more willing to aggregate the harm than if the confusion is framed as "failing to understand." This suggests the asymmetry borders on **Complicity Intuitions**: we aggregate harms done *to* the body more readily than failures *of* the mind, which are subtly attributed to the victim's cognitive agency.

  **C. The Continuum Collapse**
  If the "confusion" is described as "inability to process sensory input" (e.g., visual static), it becomes phenomenally identical to physical irritation. If the "irritation" is described as "interpretive itch" (e.g., feeling itchy only when thinking about bugs), it becomes epistemic. In these boundary cases, moral intuition tends to fluctuate wildly, indicating that the categories "somatic" and "epistemic" are not natural kinds in welfare economics but **folk-psychological heuristics**.

  ### Summary
  The phenomenon is the **Somatic-Cognitive Aggregation Asymmetry**. It is defined by the selective fungibility of sensory qualia versus cognitive states in collective welfare calculus. It is distinct from scope neglect because it is content-sensitive, distinct from person-affecting views because it accepts the victims are harmed, and distinct from lexical views because it applies to sub-threshold harms. Its edges fail when cognitive harms are embodied or when somatic harms are interpretivized, revealing that the asymmetry rests on the **intersubjective verifiability of the harm** rather than the harm itself.
