answer: |-
  Hi there,

  It is completely understandable that you feel a seam in this package, because you have assembled a set of commitments that are individually popular but collectively form a very high-wire act. You are trying to hold onto the intuitive commonsense view of time while respecting modern physics and rigorous metaphysics, and the tension you are sensing is real. I will walk through the specific friction points where your claims pull against one another, identify which ones are the structural weak spots, and outline what you would need to adjust to make the system coherent.

  The most significant tension lies directly between your second and third claims. You state that special relativity is physically correct in the strong sense, meaning the relativity of simultaneity is a real feature of the world, but you also state that there is a definite fact of the matter about distant simultaneity. These two statements are logically incompatible as they stand. If the relativity of simultaneity is a real ontological feature of the world, then there is no unique, frame-independent fact about what is happening right now at a distance; simultaneity is genuinely relative to the observer's frame. If there is a definite fact of the matter about what is simultaneous across the universe, then the relativity of simultaneity cannot be a real feature of the world, but rather only a feature of our measurements or coordinate systems. You mentioned that you added the third claim to keep presentism from getting crushed by relativity, and you are right to do so, but you cannot keep the second claim in its current strong form. To make this work, you have to adopt what is known as a Lorentzian interpretation of relativity rather than an Einsteinian one. This means you must concede that while the mathematics of special relativity are empirically correct and no experiment can detect a preferred frame, there is nonetheless a hidden, privileged frame of reference that defines the true present. The cost here is that you have to accept a preferred frame that is physically undetectable in principle, which some physicists find ontologically costly, but it is the only way to reconcile your presentism and your claim about distant simultaneity with the empirical success of relativity.

  Once you adjust that seam, the next major pressure point is between your presentism and your truthmaker theory. You claim that only the present exists, but also that every true proposition, including past-tensed ones, must be made true by something that exists. If only the present exists, then dinosaurs do not exist, and past events do not exist. So what currently existing thing makes it true that the dinosaurs went extinct? Standard presentists cannot point to the dinosaurs themselves, so they are forced to introduce hidden metaphysical machinery that you have not explicitly listed in your package. To maintain consistency here, you must commit to the idea that the present world possesses special properties that encode the past, often called Lucretian properties, or that there are abstract objects existing now that represent past states of affairs. Without adding one of these specific metaphysical posits, your first and sixth claims will collapse under the truthmaker objection. This is a hidden cost of your package; you cannot be a presentist truthmaker theorist without also being a theorist of specific present-time properties or ersatz structures that bear the weight of past truth.

  There is also a subtle but important friction between your view of the open future and your truthmaker theory. You claim the future is genuinely open and there are no settled facts about what will happen, yet you also claim every true proposition needs a truthmaker. This forces a decision on the logic of future contingent statements. If a statement about the future is true now, your truthmaker theory demands something existing now that makes it true. If nothing exists now that settles the future, then strictly speaking, there is no truthmaker. You have two options to resolve this. You can either say that future contingent propositions are neither true nor false, which preserves the open future and satisfies truthmaker theory by removing the demand for a truthmaker, or you must accept that they are true but grounded in something present, like probabilistic tendencies or divine knowledge, which might threaten the openness you want to preserve. Most presentists who want an open future reject the principle of bivalence for future claims, meaning they accept that some statements are currently truth-valueless. If you do not adopt this logical adjustment, your commitment to an open future will conflict with your demand for truthmakers for all true propositions.

  The claim about the passage of time is actually the least problematic of your set, provided you fix the issue with special relativity. If you establish a privileged frame of reference to save your presentism, then you have a global now that can genuinely advance. The passage of time fits naturally with presentism and a determinate simultaneity relation. However, you should be aware that this combination makes your view dynamically distinct from the block universe view not just in ontology, but in dynamics. You are committed to the idea that existence itself is changing, with things coming into and going out of existence absolutely, not just relative to a worldline. This is metaphysically robust but requires you to explain what governs the rate of this passage if it is not just a measure of change in physical objects.

  So, to summarize where the package stands and what needs to give. The strongest tension is between your strong reading of special relativity and your claim about distant simultaneity. You cannot have both. To save presentism, you must weaken your interpretation of special relativity from an ontological claim to an empirical one, accepting a hidden preferred frame. This is the least costly way to restore consistency because it preserves your core intuition about time while respecting the data, though it costs you theoretical simplicity in physics. The second necessary adjustment is to your truthmaker theory or your ontology of the present. You must explicitly adopt a theory of past-making properties or accept that some propositions about the past and future lack classical truth values. If you make these two adjustments, accepting a Lorentzian preferred frame and a specific presentist theory of truthmakers, the package can hold together. Without them, the seam you are feeling will eventually tear because you are trying to hold onto the ontology of Newton, the physics of Einstein, and the metaphysics of Aristotle all at once without the requisite bridging machinery.

  I hope this helps you locate the stress points in your view. It is a robust position, but it requires being very precise about where you are willing to modify standard interpretations of physics and logic to make the metaphysics work.

  Best regards,

