  ok so i just had this long argument with my friend about lost cause myths — confederacy, masada, kosovo, dunkirk, all that. she says tearing down confederate statues but keeping dunkirk memorials is just hypocrisy because every defeat eventually gets turned into national identity. i told her theres a difference in what i call moral-ontological fusion: when the cause's defeat also exposes its moral bankruptcy, you cant peel commemorative honor off from revisionist justification. she said thats just me saying "my guys were good actually."

