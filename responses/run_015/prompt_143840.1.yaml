  my opening move: if dunkirk was just a tactical retreat with no moral stain, then its memorials are purely commemorative, right? so where is the hidden fusion there? and if separation is always impossible, what does that do to masada — are we honoring resistance, or the ideology that made suicide the only honorable option?
