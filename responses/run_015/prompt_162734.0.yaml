answer: |-
  Here is an audit of the passage, sorted by risk level. I have structured this to help you avoid emails from annoyed specialists while preserving the core of your argument about how "truth" is weaponized in public discourse.

  ### Group 1: Grant as It Stands
  *These claims are historically accurate enough that a specialist would not object to them appearing in a general-interest piece without qualification.*

  *   **The Naming History:** It is accurate that C.S. Peirce coined "pragmatism," that William James popularized it, and that Peirce later renamed his specific doctrine "pragmaticism" due to his irritation with James's interpretation.
  *   **The General Orientation:** It is safe to say Peirce oriented his maxim toward scientific/logical inquiry and laboratory contexts, while James oriented his toward psychological experience and moral life.
  *   **The "Continental Drift" Objection:** You can use the continental drift example as an *illustration of a common criticism* leveled against pragmatism. (i.e., "Critics argue that if truth is what works now, then plate tectonics was false in 1910 and true in 1960.") You do not need to defend the physics, only report that this is how the theory is often attacked.

  ### Group 2: Print with Qualifications
  *These claims contain kernels of truth but are compressed to the point of distortion. You can use them if you add the specific nuance noted below. This protects you from the "specialist email."*

  *   **James on Individual Utility (The "Whoever Holds It" Claim)**
      *   *The Book's Claim:* James believed truth is usefulness to *whoever happens to hold it*.
      *   *The Nuance:* James did argue that truth is made in the process of verification and must satisfy the believer. However, he did not believe *any* useful delusion counted as truth. He required that a belief also align with external reality and not contradict other established truths.
      *   *How to Qualify:* If you paraphrase this, add that James believed usefulness had to be tested against "experience" and "reality," not just personal comfort.
      *   *Why:* This prevents the specialist from saying, "James wasn't a solipsist."

  *   **Peirce on Community Consensus (The "Final Opinion" Claim)**
      *   *The Book's Claim:* Truth is whatever the scientific community *ends up agreeing on*.
      *   *The Nuance:* Peirce did not mean a simple vote or a temporary consensus. He meant an **ideal limit** of inquiry—a point where reality *forces* all investigators to agree, regardless of their desires. It is a counterfactual ideal, not a sociological prediction.
      *   *How to Qualify:* Change "ends up agreeing on" to "would be forced to agree on by the evidence."
      *   *Why:* The book's phrasing makes Peirce sound like a social constructivist. He was actually a realist who believed truth was independent of what you or I think.

  *   **The Cancer Patient Example (The "Useful False Belief" Claim)**
      *   *The Book's Claim:* Pragmatism must call the cancer patient's hope "true," which is a *reductio*.
      *   *The Nuance:* James explicitly addressed this in *The Will to Believe*. He distinguished between empirical truths (which require evidence) and moral/religious truths (where belief can help create the fact). He would likely say the patient's hope is "true for living" but not "scientifically true."
      *   *How to Qualify:* Frame this as a tension within James's system rather than a fatal logical error. "Critics argue this forces pragmatists to call comforting delusions 'true,' though James attempted to carve out exceptions for faith."

  ### Group 3: Do Not Repeat
  *These claims are historically or philosophically incorrect. If you print these, a historian of philosophy will correctly identify them as errors, which undermines your credibility on the broader point about misinformation.*

  *   **"Both classical pragmatists gave the same surprising answer..."**
      *   *Why:* This is the most dangerous sentence in the passage. Peirce and James had a **substantive metaphysical disagreement**, not just a difference of "venue and temperament." Peirce believed truth was discoverable and independent of the mind (Realism); James believed truth was partially manufactured by the mind's interaction with the world (Pluralism). Peirce's rebranding to "pragmaticism" was specifically to distance himself from James's definition.
      *   *Risk:* If you claim they said the "same thing," you validate the very confusion you might be trying to analyze.

  *   **"If the last inquirer dies... nothing would be true."**
      *   *Why:* This misunderstands Peirce's modal logic. For Peirce, truth is about what *would* happen if inquiry were pursued, not what *does* happen. The extinction of humanity does not negate the truth of gravity, because gravity would still constrain any *potential* inquirer.
      *   *Risk:* This makes the book's author look unfamiliar with Peirce's actual texts.

  *   **"The program had been abandoned within academic philosophy by the 1940s."**
      *   *Why:* This is historically false. Pragmatism evolved into Logical Empiricism (via Quine) and saw a massive revival in the 1980s and 90s (via Rorty, Putnam, Brandom). It never went away.
      *   *Risk:* Historians of philosophy treat the "death of pragmatism" narrative as a myth.

  *   **"What survives... is a licence for saying that everyone has their own truth."**
      *   *Why:* This is the punchline you want to use, but as written, it attributes this view *to* pragmatism. Peirce would violently disagree, and James would argue for a "pluralistic universe" but not radical relativism.
      *   *Risk:* You conflate the *philosophy* with the *caricature*.
      *   *Fix:* You can argue that the **popular misunderstanding** of pragmatism has become a license for "everyone has their own truth." That is a defensible sociological claim. Do not claim that is what the philosophers actually taught.

  ### Answers to Your Specific Questions

  **1. Does James's account really make truth relative to the individual believer?**
  Not exactly. The book mistakes a claim about *verification* for a claim about *constitution*. James argued that we *verify* truth through its practical consequences for the individual. However, he maintained that the "cash value" must be redeemable in a shared reality. He is not a "post-truth" relativist, though his language is loose enough to be weaponized by one.
  *Action:* If you use James, frame him as opening the door to subjectivity, not locking it open.

  **2. Is Peirce's final opinion an actual future consensus or an ideal limit?**
  It is an **ideal limit** (a regulative ideal). It makes a massive difference to him that the community is idealized. He believed reality exerts a "brute force" on inquirers that eventually compels agreement. The book's description ("whatever the community ends up agreeing on") sounds like truth is determined by a vote. Peirce believed truth determines the vote.
  *Action:* Do not use the book's definition of Peirce. It inverts his realism.

  **3. Is the difference between them really one of venue and temperament?**
  No. It is a substantive disagreement about the nature of reality. Peirce was a scholastic realist; James was a nominalist. Peirce thought truth was found; James thought truth was made (in part). The book flattens this to make a cleaner narrative, but it is philosophically unsustainable.
  *Action:* Acknowledge the split. It strengthens your piece to show that even the founders couldn't agree on what "truth" meant.

  **4. How much of the book's punchline survives if corrected?**
  The cautionary tale actually becomes **stronger** if corrected.
  *   *The Book's Version:* "Pragmatism failed because it was logically flawed and now means relativism." (Weak, historically false).
  *   *The Corrected Version:* "Pragmatism offered a rigorous way to test ideas by their consequences. However, because James emphasized individual experience and Peirce emphasized eventual consensus, the public latched onto the former and ignored the latter. The result is a 'cautionary tale' where a philosophy of scientific rigor was diluted into a license for 'my truth.'"
  *   *Why this works:* This allows you to use the "everyone has their own truth" line as a description of our *current misuse* of the term, rather than a description of the *philosophy itself*. This insulates you from specialist criticism while keeping your thesis about institutional trust intact.

  ### Recommendation for Your Piece
  Do not quote the paragraph directly. It is too vulnerable. Instead, paraphrase the *tension*:

  > "In the early 20th century, William James and C.S. Peirce offered a new way to define truth: not as a static mirror of reality, but as something validated by its practical consequences. But even they could not agree on the details. Peirce saw truth as the ideal endpoint of scientific inquiry; James saw it as what proves expedient in the life of the believer. While academic philosophy moved on, the public retained a simplified version of James's view. Today, that legacy survives less as a tool for verification than as a rhetorical shield: the idea that if a belief 'works' for me, it is, in some sense, my truth."

  This captures the book's utility without inheriting its errors.
