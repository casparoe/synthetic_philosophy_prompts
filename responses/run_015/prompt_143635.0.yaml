answer: |-
  ### Exam Question (60 Minutes)

  **Prompt:**
  Traditional accounts of self-deception stumble over the static paradox: how can one simultaneously believe $p$ and not-$p$? Contemporary theory offers two escapes. The **Partitioned-Mind Model** posits functionally isolated subsystems within a single agent, allowing contradictory beliefs to coexist without awareness. The **Deflationary Strategic Model** denies internal division, arguing that apparent self-deception is rational belief-management driven by social signaling costs (e.g., maintaining confidence to persuade others).

  Write an essay defending *one* of these models as the superior explanation of self-deception. Your argument must explicitly adjudicate the following: (1) Can epistemic akrasia (holding a belief against one's better judgment) occur without doxastic voluntarism (direct voluntary control over belief)? (2) Can signaling-cost explanations fully replace the explanatory labor assigned to internal sub-agents? Do not merely describe the paradox; resolve it through your chosen framework.

  ***

  ### Model Answer (Deflationary Strategic Model)

  The Deflationary Strategic Model offers a superior account of self-deception because it dissolves the static paradox without inflating our ontology with unobservable sub-agents. While the Partitioned-Mind Model preserves the intuition that self-deception mirrors interpersonal deception, it fails to explain how a single agent maintains functional unity. The deflationary approach succeeds by reinterpreting self-deception not as a state of contradictory belief, but as a diachronic process of biased evidence gathering motivated by social utility.

  Critics argue that without internal partitions, self-deception requires impossible epistemic akrasia grounded in doxastic voluntarism. They claim one cannot choose to believe $p$ while knowing evidence supports not-$p$ unless one lacks direct voluntary control over belief formation. However, the deflationary model bypasses this requirement. We do not need direct control over beliefs (voluntarism) to be responsible for self-deception; we only need control over the *activities* that influence belief. An agent can voluntarily avoid checking evidence, associate only with confirers, or dwell on comforting scenarios. These actions are voluntary, even if the resulting belief is not directly willed. Thus, epistemic akrasia occurs not because the agent forces a belief into existence against their will, but because they strategically manipulate the input data. The belief formed is genuine, not contradictory, but it is acquired through motivated reasoning rather than truth-tracking.

  Furthermore, signaling-cost explanations fully replace the explanatory labor of internal sub-agents. Partition theories posit a "deceiver" subsystem and a "dupe" subsystem to explain why the agent acts confidently despite negative evidence. This is ontologically expensive and risks an infinite regress of homunculi. The deflationary model explains the same behavior through social signaling costs. If projecting confidence yields higher social rewards (leadership, mating success, alliance building) than accurate pessimism, natural selection favors mechanisms that bias belief toward confidence. The agent does not need to hide the truth from themselves via a mental wall; they simply need to believe the useful fiction to signal it effectively. A liar who believes their lie is more convincing than one who knows they are lying. Therefore, the "partition" is unnecessary; the motivation to signal efficiently explains the bias without positing internal division.

  In conclusion, the Deflationary Strategic Model is preferable because it is parsimonious and psychologically realistic. It resolves the static paradox by shifting focus from synchronic contradiction to diachronic bias. It accounts for epistemic akrasia through indirect voluntary control over evidence gathering, and it replaces the metaphysical baggage of sub-agents with the evolutionary logic of signaling costs. Self-deception is not a fracture in the mind, but a feature of rational social strategy.

  ***

  ### Marking Scheme (Total 20 Marks)

  | Analytical Move | Marks | Characteristic Mistake |
  | :--- | :---: | :--- |
  | **1. Committed Thesis:** Clearly selects one model (Partitioned or Deflationary) and states it as the superior explanation without hedging. | 4 | Loses points if the essay remains neutral or attempts to synthesize both models equally. |
  | **2. Paradox Resolution:** Explains how the chosen model avoids the static paradox (simultaneous belief in $p$ and not-$p$) via mechanism (isolation vs. bias). | 4 | Loses points if the student merely restates the paradox rather than explaining the model's solution. |
  | **3. Akrasia & Voluntarism:** Explicitly argues whether epistemic akrasia requires direct doxastic voluntarism, distinguishing control over beliefs from control over evidence-gathering actions. | 4 | Loses points if the student claims belief must be directly willed or ignores the indirect control distinction. |
  | **4. Signaling vs. Sub-agents:** Evaluates whether signaling costs can fully replace the explanatory labor of sub-agents, addressing ontological parsimony or functional adequacy. | 4 | Loses points if the student mentions signaling costs but fails to argue they *replace* the need for internal divisions. |
  | **5. Coherent Conclusion:** Synthesizes the arguments into a final judgment that logically follows from the premises regarding mechanism and motivation. | 4 | Loses points if the conclusion introduces new arguments or contradicts the established thesis. |
