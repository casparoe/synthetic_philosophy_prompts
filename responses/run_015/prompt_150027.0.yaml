          *   *Fit:* This is strong. Aristotle worries about treating things (or people?) as mere means to wealth. Treating attention as an infinite resource to be mined fits *chrematistike*.
          *   *Nuance:* Is the user acquiring a tool for living? Yes, they get the service. But the *platform's* goal is the unnatural accumulation. The user needs to distinguish between the user's *oikonomia* (using the app) and the platform's *chrematistike* (mining data).
      *   *Cryptocurrency:*
          *   *Argument:* Self-referential value, detached from use-value.
