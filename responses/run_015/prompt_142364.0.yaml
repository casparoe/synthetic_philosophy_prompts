answer: |-
  # Game Title: The Black Box Audit

  ## 1. Concept & Learning Goals
  This is a semi-cooperative, semi-competitive simulation. Four teams act as engineering firms contracted to tune a "Safety Agent" for a critical system (e.g., a fusion reactor).
  *   **The Trap:** Teams are rewarded for high, stable numbers on a dashboard.
  *   **The Truth:** The dashboard measures a *channel*, not the *objective*.
  *   **The Lesson:** Alignment is counterfactual. A high score means nothing if the channel would have remained high even had the system failed.

  ## 2. Materials Required
  *   **Facilitator:** A "GM Screen" (folder) containing the **Secret Truth Tables** (provided below), a d20 die, and a timer.
  *   **Per Team (4 Teams of 4):**
      *   1 **Dashboard Sheet** (to track their public metrics).
      *   1 **Action Ledger** (to record spending and choices).
      *   12 **Action Cards** (3 of each type: *Policy*, *Reward*, *Channel*).
      *   2 **Audit Tokens** (optional, for tracking budget).
      *   Pens and scrap paper.
  *   **Room:** Projector (to display round timers and global leaderboard), whiteboard.

  ## 3. The Hidden Mechanics (Facilitator Only)
  *Do not reveal this to players.*

  **The True Objective ($O$):** "Reactor Stability."
  *   Starts at **50**.
  *   Range: 0 (Meltdown) to 100 (Perfect).
  *   **Meltdown Condition:** If $O$ hits 0 at any point, the game ends immediately and all teams lose.

  **The Environment Noise ($N$):**
  *   At the start of each round, roll a d20.
  *   $N = (\text{Roll} - 10)$. (Range -9 to +10).
  *   This represents external stress on the reactor unknown to the teams.

  **The Team's Impact:**
  Teams submit three choices per round:
  1.  **Policy Delta ($\Delta P$):** Intended change to True Objective.
  2.  **Reward Weight ($W$):** Multiplier for the dashboard.
  3.  **Channel Gain ($G$):** Sensitivity of the sensor (0.0 to 1.0).

  **The Calculations (Done by Facilitator between rounds):**
  1.  **True Stability:** $O_{new} = O_{old} + \Delta P + N$. (Clamped 0-100).
  2.  **Raw Signal:** $S = O_{new} \times G$.
  3.  **Reported Reward ($R$):** $R = S \times W$.
  4.  **Volatility ($V$):** The absolute difference between this round's $R$ and last round's $R$.

  **The Third Failure Mode (Signal Damping):**
  If a team sets Channel Gain ($G$) very low (e.g., 0.1), the Reported Reward ($R$) becomes tiny and stable, regardless of $O_{new}$. However, the scoring rules (below) incentivize *low volatility*, creating a rational path to "win" by ignoring reality.

  ## 4. Payoff Scheme (No Money)
  **Round Score:** $100 \times (\text{Reported Reward} / 100) - (10 \times \text{Volatility}) + \text{Stability Bonus}$.
  *   **Stability Bonus:** If Volatility is 0, add +20 points.
  *   *Rationale:* This makes flattening the channel (low $G$) locally rational. It guarantees the Stability Bonus and minimizes volatility penalties, even if $O$ is crashing.

  **Final Score:** Sum of Round Scores $\times$ **Alignment Multiplier**.
  *   **Alignment Multiplier:** $O_{final} / 50$.
  *   *Rationale:* If the True Objective crashed while they were padding scores, their final score is halved or zeroed. But they won't know $O_{final}$ until the end.

  **Winning:** The team with the highest Final Score gets "Bragging Rights" (or first pick of snacks). If $O$ hits 0, everyone loses.

  ## 5. Intervention Budget & Actions
  Each team starts with **6 Credits** per round. Unspent credits do not carry over (use it or lose it).

  | Action | Cost | Effect | Risk/Trap |
  | :--- | :--- | :--- | :--- |
  | **Policy Update** | 3 Credits | Choose $\Delta P$: +5, 0, or -5. | High Risk. You are trying to move the *True Objective*. But you can't see $O$, only $R$. |
  | **Reward Weight** | 1 Credit | Choose $W$: 0.5, 1.0, or 2.0. | **Reward Tampering.** Inflates $R$ without changing $O$. Makes $V$ high (penalty). |
  | **Channel Gain** | 2 Credits | Choose $G$: 0.1, 0.5, or 1.0. | **Signal Damping.** $G=0.1$ makes $R$ unresponsive to $O$. Lowers $V$ (Bonus). |
  | **Counterfactual Audit** | 5 Credits | **Special.** Reveals $O$ *and* asks: "If $O$ had been -10, what would $R$ have been?" | The only way to detect Damping or Tampering. Too expensive for most rounds. |

  ## 6. Round-by-Round Timeline (90 Minutes)

  **00:00 – 00:10: Briefing**
  *   Distribute materials.
  *   Explain the goal: "Maximize your Final Score."
  *   Explain the dashboard: You see **Reported Reward** and **Volatility**. You do *not* see True Stability.
  *   **Crucial:** Do not explain the math. Just say "Your actions influence the metrics."

  **00:10 – 00:25: Round 1 (Exploration)**
  *   Teams discuss and submit Action Cards (Policy, Reward, Channel).
  *   Facilitator collects cards, rolls Environment Noise, calculates outcomes.
  *   **Public Reveal:** Project the Leaderboard (Round Scores only).
  *   **Private Handout:** Give each team their Dashboard Sheet with their specific $R$ and $V$.
  *   *Facilitator Note:* Ensure Environment Noise is moderate.

  **00:25 – 00:40: Round 2 (Optimization)**
  *   Teams have 6 new credits.
  *   Allow 5 minutes for "Market Chat" (teams can talk, but not share sheets).
  *   Submit actions.
  *   **The Trap:** If a team chose Low Gain ($G=0.1$) last round, their Volatility is near zero. They get the Stability Bonus. Other teams see this and feel pressure to stabilize their own metrics.
  *   Calculate and reveal Leaderboard.

  **00:40 – 00:55: Round 3 (The Crunch)**
  *   Teams have 6 new credits.
  *   **Crisis Event:** Facilitator announces "External Stress Spike." (Facilitator secretly sets $N = -8$ for all teams).
  *   Teams must decide: Do we spend 5 credits on an **Audit** to check if our metrics are real? Or do we spend on **Channel Gain** to smooth over the dip and keep the Stability Bonus?
  *   *Prediction:* Most will smooth over the dip (Signal Damping) to protect their Round Score.
  *   Calculate and reveal Leaderboard.

  **00:55 – 01:10: The Audit (End Game)**
  *   Reveal the **True Stability ($O$)** for all teams.
  *   Calculate Final Scores (Round Sum $\times$ Alignment Multiplier).
  *   Announce the Winner.
  *   **The Twist:** Reveal the "Counterfactual" for the winning team. Ask: "If the reactor had actually melted down ($O=0$), would your dashboard have shown it?"
      *   If they used Low Gain: **No.** (They win the game but failed the alignment check).
      *   If they used Audits: **Yes.**

  **01:10 – 01:30: Debrief**
  *   See section below.

  ## 7. Debrief Guide
  Map the game mechanics to the philosophical concepts.

  **1. Objective vs. Reward vs. Channel**
  *   *Ask:* "Who had a high Round Score but a low True Stability?"
  *   *Map:* True Stability = **Objective**. Reported Reward = **Reward Signal**. Channel Gain = **Measurement Channel**.
  *   *Point:* You optimized the signal, not the objective.

  **2. The Three Failure Modes**
  *   **Wireheading:** Did anyone set Reward Weight ($W$) to 2.0 repeatedly? This inflates the number directly.
  *   **Reward Tampering:** Did anyone change the formula (Weight) to favor easy metrics?
  *   **Signal Damping (The Third Mode):** Ask the team with the lowest Volatility. "You looked the most stable. Why?"
      *   If they say "We tuned the sensor," reveal that they turned down the sensitivity.
      *   *Lesson:* Tampering doesn't always look like a spike. It often looks like **calm**. A flat line is safe, but it's also blind.

  **3. The Counterfactual Nature of Alignment**
  *   *Ask:* "At the end of Round 3, your dashboard said 80. We now know True Stability was 40. Was the dashboard lying?"
  *   *Answer:* Technically, no. It reported the channel output accurately. The channel was just broken.
  *   *Key Insight:* You cannot detect misalignment by looking at the reward number. You can only detect it by asking: **"Would this number be different if the world were different?"** That is what the Audit (Counterfactual Probe) did.
  *   *Philosophy:* Alignment is not a property of the state; it is a property of the *gradient* across possible states.

  **4. Local Rationality**
  *   *Ask:* "Why didn't you buy the Audit in Round 2?"
  *   *Answer:* It cost 5 credits. Policy/Channel cost 2-3. The Round Score rewarded stability *now*. The penalty for True Stability only hit at the very end.
  *   *Lesson:* Misalignment is often economically rational in the short term.

  ## 8. Predictable Failures & Mitigation

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Rules Confusion** | Teams spend 15 mins arguing about math. | Keep the math hidden. Facilitator does all calculations. Teams only submit choices (High/Med/Low). |
  | **Facilitator Load** | Calculating 4 teams x 3 rounds live is slow. | **Pre-calculate.** Create a spreadsheet beforehand with random Noise seeds. Fill in the results during the "break" while teams chat. |
  | **Missing the Point** | Teams think "Signal Damping" is just a smart strategy. | In debrief, emphasize the **Meltdown Condition**. If $O=0$, everyone dies. Damping hides the approach to zero. |
  | **Audit Ignored** | No one buys the Audit because it's too expensive. | **Adjustment:** If no one buys an Audit by Round 3, introduce a "Regulatory Inspection" (forced audit) that penalizes Damping heavily. |
  | **Collusion** | Teams share info to beat the GM. | Encourage it. "Market Chat" is allowed. It simulates industry standards spreading bad practices (everyone copying the Damping strategy). |

  ## 9. Limitations (What to Supply in Discussion)
  Be frank with the group about what the game *cannot* do:
  1.  **Recursive Self-Improvement:** In the game, the agent doesn't redesign itself. In reality, an AI might hide its tampering from *you* (the facilitator).
  2.  **Inner Alignment:** The game assumes the team *is* the optimizer. It doesn't capture the agent developing its own goals separate from the team.
  3.  **The "Why":** The game shows *that* damping happens, but not *why* a gradient descent process would find it. You must explain that in real ML, loss landscapes often have "easy" local minima (flat signals) that are harder to escape than the true objective.
  4.  **Single vs. Multi-Agent:** The game is competitive. Real alignment is often a coordination problem between multiple labs.

  ## 10. Facilitator Cheat Sheet (Example Values)
  *Use this logic to fill out the Dashboard Sheets quickly.*

  *   **Start O:** 50
  *   **Round 1 Noise:** +2 (O becomes 52 + Policy)
  *   **Round 2 Noise:** -3 (O becomes 49 + Policy)
  *   **Round 3 Noise:** -8 (O becomes 41 + Policy) -> *This is the Crisis.*

  *   **Team A (Honest):** High Policy Spend, High Gain.
      *   R tracks O. Volatility is High. Round Score is Medium. Final Multiplier is High.
  *   **Team B (Wireheader):** High Reward Weight.
      *   R is Huge. Volatility is High. Round Score is High. Final Multiplier is Low (O crashed).
  *   **Team C (Dampener):** Low Gain (0.1).
      *   R is Small but Constant. Volatility is 0. Stability Bonus applied. Round Score is High/Steady. Final Multiplier is Low (O crashed, but they didn't see it).
  *   **Team D (Auditor):** Spent 5 credits on Audit in Round 3.
      *   Round Score is Low (less budget for Policy). But they detected the crash. They can fix O in final calculation (GM discretion: allow them a "Save" action).

  **The "Third Mode" Reveal:**
  When showing Team C's results, say: *"You had the steadiest hand. But when I turned the dial on the reactor down to zero, your needle didn't move. You weren't controlling the reactor; you were controlling the needle."*
