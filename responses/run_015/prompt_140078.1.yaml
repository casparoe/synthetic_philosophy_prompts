  # INSTRUCTOR'S KEY & DEFENSE
  *(Do not distribute. Use to manage the discussion.)*

  ### Entry Point Defense
  **Why start with Truth Functionality?**
  You suggested entering at "false antecedents aren't automatically true." I kept this as **START**.
  *   **Why here?** It's the only premise your syntax people and semanticists will universally grant. It clears the room of logic 101 holdouts immediately.
  *   **Why not later?** If you wait, you waste time discussing "closest worlds" with someone who thinks $A \supset B$ does the job.
  *   **Risk:** It's too easy. Everyone says "NO".
  *   **Mitigation:** It acts as a speed-bump. If anyone says "YES", they are out of the seminar (or need a private chat about material implication).

  ### Node Commentary & Placement

  **NODE 1 (Probability/Embedding)**
  *   **Why here?** This is the "Suppositional" kill-switch. If they deny truth conditions here, Nodes 3-6 (about worlds/similarity) are category errors for them.
  *   **Why not later?** If you put this at the end, the Adams/Edgington fans have to pretend to care about "closest worlds" for 40 minutes.
  *   **The Trap:** This node separates the **Realists** from the **Expressivists**.
  *   **Honesty Check:** Can someone hold "Probability = Conditional Probability" AND "Truth Conditions vary by Similarity"? **No.** Lewis's Triviality Results prove this is mathematically incoherent unless probability is context-dependent (which changes the view to Leaf 6-ish). Mark Leaf 10 as "Incoherent" on the handout.

  **NODE 2 (The Doctor)**
  *   **Why here?** This tests the **Context Set**. If the doctor is lying, the context set is "what is known". If she's fine, the context set is "what is compatible with the conversation".
  *   **Why not Node 1?** Probability is a bigger metaphysical split. Doctor cases are often confused with politeness maxims.
  *   **The Case:** "If the scan shows a tumour..."
  *   **Diagnosis:** A "YES" (She's lying) points to **Stalnaker's Assertion** or **Strict Conditional** views. A "NO" points to **Kratzer** or **Lewis**.

  **NODE 3 (The Hiring / Sobel)**
  *   **Why here?** This kills the **Strict Conditional**. Strict conditionals validate Strengthening of the Antecedent. Variably-strict ones don't.
  *   **Why not earlier?** You need to establish they aren't Material (Start) or Strict-Context (Node 2) first.
  *   **The Case:** Hiring + Fraud clause.
  *   **Honesty Check:** Does this separate Stalnaker (Unique) from Lewis (Ties)? **No.** Both fail Strengthening. This node only separates Strict from Variable. Don't let students claim this proves "similarity".

  **NODE 4 (The Quantum Coin)**
  *   **Why here?** This is the **Stalnaker vs. Lewis** divider. Stalnaker assumes a Unique Closest World (Conditional Excluded Middle). Lewis allows ties (Indeterminism).
  *   **Why not Node 3?** Sobel sequences work on both Unique and Ties views. You need indeterminism to split them.
  *   **The Case:** Unflipped fair coin. "Would" vs "Might".
  *   **Diagnosis:** If "Would" is True/False → Stalnaker. If Indeterminate → Lewis.

  **NODE 5 & 6 (The Lottery & The Alibi)**
  *   **Why two nodes?** You requested three Ind/CF contrast nodes total. Node 2 was one (implicitly). These are the other two.
  *   **Node 5 (Lottery):** Tests **Felicity**. Indicatives are okay with high-probability antecedents; Counterfactuals imply the antecedent is false/unlikely.
  *   **Node 6 (Alibi):** Tests **Truth Conditions**. Do they track the same facts?
  *   **Why split them?** Felicity (Node 5) can be pragmatic. Truth Conditions (Node 6) are semantic.
  *   **Diagnosis:**
      *   Same TC + Pragmatic difference → **Unified (Kratzer/Stalnaker)**.
      *   Different TC → **Dual (Lewis/Anderson)**.
  *   **Honesty Check:** The "No semantic difference and no pragmatic story" cell (Leaf 9) is **Empty**. If the semantics are identical, the felicity difference *must* be explained (presupposition, implicature, or morphology). If a student lands here, they haven't thought about *why* the mood differs.

  ### Leaf Definitions & Awkward Commitments

  1.  **Material Implication:** *Awkward:* "If Paris is in Germany, Paris is in Europe" is True.
  2.  **Suppositional / Adams:** *Awkward:* Conditionals have no truth conditions (cannot be embedded in 'It is true that...').
  3.  **Strict / Context-Set:** *Awkward:* The Doctor is lying/misleading when using standard medical indicatives.
  4.  **Strict + Ordering Source:** *Awkward:* Must explain why Strengthening the Antecedent fails without shifting worlds.
  5.  **Stalnaker / Unique World:** *Awkward:* Commits to a fact of the matter about the unflipped coin (Conditional Excluded Middle).
  6.  **Unified / Kratzer:** *Awkward:* Must treat Counterfactual tense as a modal operator, not past time.
  7.  **Unified Variably-Strict:** *Awkward:* Similar to Stalnaker but struggles with the Ind/CF felicity split without extra pragmatics.
  8.  **Dual Semantics / Lewis:** *Awkward:* 'If' is ambiguous (two different words for Indicative vs Counterfactual).
  9.  **Empty (No Diff/No Story):** *Status:* **Incoherent.**
  10. **Empty (Adams + Similarity):** *Status:* **Mathematically Impossible** (per Lewis 1976).

  ### Control Cases (For Verification)
  *Use these if a student claims "Everyone agrees with me" on a node.*
  1.  **Tautology:** "If it rains, it rains." (All leaves say True).
  2.  **Contradiction:** "If it rains and doesn't rain, I'm happy." (All leaves say True/Vacuous).
  3.  **Modus Ponens:** "If A then B. A. Therefore B." (All leaves validate this).
  *If a student rejects these, they aren't in the conditional literature space; they are in non-classical logic.*

  ### Troubleshooting "No Cell"
  **Scenario:** A student answers "No" to Truth Conditions (Node 1) but "Yes" to Unique World (Node 4).
  **Diagnosis:** They are confused. You can't have a "closest world" if there's no truth condition.
  **Response:** "You've landed in the 'Suppositional' branch, but you're answering questions about 'Worlds'. For you, 'closest world' talk is just a metaphor for belief revision. Go to Leaf 2."

  **Scenario:** A student says Ind/CF are Different (Node 5) but Unified (Node 6).
  **Diagnosis:** They distinguish felicity but not truth.
  **Response:** "You are in Leaf 6 (Unified/Kratzer). The difference is in the *Modal Base*, not the conditional operator itself."

  ### Known Collapses (Flagged on Handout)
  *   **Stalnaker (Leaf 5) vs. Unified Var-Strict (Leaf 7):** These collapse on almost all data except the Coin Case (Node 4). If your group doesn't care about indeterminism, these are the same view.
  *   **Kratzer (Leaf 6) vs. Dual (Leaf 8):** Both handle Sobel sequences well. They only diverge on whether 'if' is the same word in both moods. This is often a notational dispute unless you have morphological evidence.
