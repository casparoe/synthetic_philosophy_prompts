answer: |-
  # STUDENT HANDOUT: The Conditional Sorter
  **Instructions:** Start at **START**. Follow the path that matches your intuition about the cases. Circle your final Leaf.

  **START:** Consider: "If Paris is in Germany, then Paris is in Europe." The 'if'-part is false. Is the whole sentence **True**?
  *   **YES** → **LEAF 1: Material Implication** *(You treat 'if' like $\supset$.)*
  *   **NO** → Go to **NODE 1**.

  **NODE 1 (The Betting Test):** "There's a 90% probability that if it rains, the match is cancelled." Can this be true even if there is **no fact of the matter** about whether the match *would* be cancelled?
  *   **NO** (It needs a truth-maker) → Go to **NODE 2**.
  *   **YES** (It's just degrees of belief) → **LEAF 2: Suppositional / Adams** *(Conditionals aren't true/false, just probable.)*

  **NODE 2 (The Doctor):** A doctor knows the scan result (it's clear). She tells the patient: "If the scan shows a tumour, we biopsy." Is this statement **misleading/false** because she knows the 'if'-part is false?
  *   **YES** (She should have said "Since it doesn't...") → **LEAF 3: Strict / Context-Set** *(Indicatives quantify over what's known.)*
  *   **NO** (It's fine to suppose what you know) → Go to **NODE 3**.

  **NODE 3 (The Hiring Committee):**
  (1) "If she had published, we would have hired her." (True)
  (2) "If she had published and been convicted of fraud, we would have hired her." (False)
  Does adding the second clause **break the entailment** from (1)?
  *   **NO** (Entailment must hold) → **LEAF 4: Strict with Ordering Source** *(You keep strictness but add relevance.)*
  *   **YES** (Antecedents shift the standard) → Go to **NODE 4**.

  **NODE 4 (The Quantum Coin):** A fair coin was not flipped. "If it had been flipped, it **would** have landed Heads." Is this True, False, or Indeterminate?
  *   **True/False** (There is a fact) → **LEAF 5: Stalnaker / Unique World** *(There is always one closest world.)*
  *   **Indeterminate** (It's a tie) → Go to **NODE 5**.

  **NODE 5 (The Lottery):**
  Indicative: "If ticket 742 lost, it was in the bin." (Sounds OK)
  Counterfactual: "If ticket 742 **had** lost, it **would** have been in the bin." (Sounds Weird/False)
  Do these two sentences have **different truth conditions**?
  *   **NO** (Same meaning, different presupposition) → **LEAF 6: Unified Semantics / Kratzer** *(Mood changes the modal base, not the logic.)*
  *   **YES** (Different meanings entirely) → Go to **NODE 6**.

  **NODE 6 (The Alibi):**
  Indicative: "If John was at the bar, he is innocent." (Investigation open)
  Counterfactual: "If John **had been** at the bar, he **would be** innocent." (John wasn't there)
  Is the difference purely **grammatical (tense/mood)** or **semantic (metaphysics)**?
  *   **Grammatical** → **LEAF 7: Unified Variably-Strict** *(Stalnaker-style but dual mood.)*
  *   **Semantic** → **LEAF 8: Dual Semantics / Lewis** *(Indicatives are epistemic; Counterfactuals are metaphysical.)*

  **UNUSED / EMPTY CELLS:**
  *   **LEAF 9:** "No semantic difference and no pragmatic story." *(Incoherent.)*
  *   **LEAF 10:** "Adams' Thesis + Truth Conditions vary by Similarity." *(Triviality Result: Mathematically impossible without context-shift.)*

