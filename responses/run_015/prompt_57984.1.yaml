answer: |-
  # Memorandum on Pure Time Preference: A Joint Statement of Agreement and Disagreement

  **Date:** October 26, 2023
  **Parties:** "The Impartialist" (Roommate A) & "The Presentist" (Roommate B)
  **Subject:** The Rationality and Ethics of Discounting Future Wellbeing

  ## Part I: Agreed Claims (The Common Ground)

  Before addressing our divergence, we affirm the following definitions and distinctions to ensure we are not talking past one another.

  1.  **Definition of Pure Time Preference:** We agree that "pure time preference" (or pure discount rate, $\delta$) refers *only* to valuing a benefit less solely because it occurs later in time. It is distinct from:
      *   **Risk/Uncertainty Discounting:** Valuing a future benefit less because there is a chance it won't happen (e.g., extinction risk, policy reversal).
      *   **Diminishing Marginal Utility:** Valuing a future dollar less because we expect future people to be richer, so a dollar helps them less than it helps the poor today.
      *   **Inflation:** Nominal changes in currency value.
      *   *Our Argument:* We are arguing strictly about $\delta$ when risk = 0, wealth = constant, and currency = stable.

  2.  **Descriptive vs. Normative:** We agree that humans *do* psychologically discount the future (we are impatient). Our argument is not about psychology, but about **normative rationality**: *Should* a rational agent or a moral government discount the future, even if they could be perfectly patient?

  3.  **The Role of Uncertainty:** We agree that for most real-world policy (like climate change), a positive *observed* discount rate is necessary to account for the probability that the project fails or the beneficiaries don't exist. We are isolating the variable of *time itself*, holding probability constant at 100%.

  4.  **Personal vs. Social:** We acknowledge that the rules for individual prudence (saving for my own retirement) might differ from intergenerational justice (climate policy for strangers in 2200), though we disagree on *how* they differ.

  ---

  ## Part II: Statement of Disagreement

  The following table summarizes our conflicting positions. We have drafted these descriptions to ensure each party feels their view is represented fairly ("steel-manned").

  | Feature | The Impartialist View (Roommate A) | The Presentist View (Roommate B) |
  | :--- | :--- | :--- |
  | **Core Intuition** | Time is like space. Caring less about someone because they live in 2200 is morally identical to caring less about someone because they live in Tokyo. Date of birth is morally arbitrary. | Time is like flow. "Now" has a unique phenomenological status. Agency happens in the present. Valuing the near-term more highly is a structural feature of rational action, not a bias. |
  | **Rationality** | Pure time preference is irrational. It is a "defect of imagination." If I know I will value the experience equally when it arrives, I should value it equally now. | Pure time preference is rational. It reflects the "opportunity cost of capital" (even non-financial) and the structural relationship an agent has with the future. |
  | **Policy Implication** | Long-term existential risk reduction and climate mitigation should be prioritized almost exclusively, as the sheer number of future lives dwarfs the present. | Near-term suffering and development should retain significant weight. We are not morally obligated to sacrifice the present for a future that is abstract and distant. |
  | **Economic Modeling** | Economists using $\delta > 0$ for social discount rates are making an ethical error, conflating *is* (people are impatient) with *ought* (society should be). | Economists using $\delta > 0$ are tracking a legitimate constraint on value. A benefit realized later is intrinsically less valuable than one realized now, ceteris paribus. |

  ---

  ## Part III: Cruxes and Test Cases

  We identify three specific "cruxes"—philosophical or practical pivot points—that drive our disagreement. For each crux, we propose a concrete thought experiment. We state in advance what each side predicts a rational agent should choose.

  ### Crux 1: The Isomorphism of Time and Space
  **The Question:** Is temporal distance morally relevant in a way that spatial distance is not?
  **The Impartialist:** No. Distance in time is ethically identical to distance in space.
  **The Presentist:** Yes. I can interact with someone in Tokyo today; I cannot interact with someone in 2200. Temporal distance implies a lack of causal connection that spatial distance does not.

  #### Test Case 1: The "Tuesday" vs. "Tokyo" Charity
  *Scenario:* You have a budget of $1M.
  *   **Option A:** Save 10 lives in New York **today**.
  *   **Option B:** Save 10 lives in Tokyo **today**. (Costs same, logistics same).
  *   **Option C:** Save 10 lives in New York **150 years from now**. (Guaranteed via trust fund, zero inflation, zero extinction risk).

  | Party | Choice | Reasoning |
  | :--- | :--- | :--- |
  | **Impartialist** | Indifferent between B and C. (Both > A if A is less efficient). | Location (Tokyo) and Date (2173) are arbitrary coordinates. If the life is equally good, the value is equal. |
  | **Presentist** | Prefer B over C. | Spatial distance allows current causal engagement. Temporal distance severs the link between *my* action and *their* experience. Option C is a "ghost benefit." |

  ### Crux 2: The Demandingness of the Infinite Future
  **The Question:** Does a zero discount rate create moral obligations that are impossible to fulfill, thereby proving the rate must be positive?
  **The Impartialist:** If the truth is demanding, we must accept it. We shouldn't set ethics based on what's comfortable.
  **The Presentist:** If an ethical theory implies we should starve ourselves to buy stocks for descendants 1,000 years hence, the theory is broken, not the intuition.

  #### Test Case 2: The Intergenerational Charity (The User's Example)
  *Scenario:* A charity can guarantee one of two outcomes with 100% certainty. No economic growth, no risk of human extinction.
  *   **Option A:** Grant **10 Healthy Life-Years** to a person living **now**.
  *   **Option B:** Grant **12 Healthy Life-Years** to a person living **150 years from now**.

  | Party | Choice | Reasoning |
  | :--- | :--- | :--- |
  | **Impartialist** | **Choose Option B.** | 12 > 10. The date is irrelevant. Maximizing total wellbeing requires taking the larger sum regardless of when it occurs. |
  | **Presentist** | **Choose Option A.** | Even with 100% certainty, the *present* experience has a premium. A pure discount rate of even 0.5% makes the present value of 12 years in 150 years far less than 10 years now. |

  ### Crux 3: Personal Identity and Prudence
  **The Question:** Is the reason we discount the future for *ourselves* (I'd rather eat cake now than diet for next month) the same reason we discount for *society*?
  **The Impartialist:** No. Personal impatience is a psychological bias. Social policy should correct for bias, not codify it.
  **The Presentist:** Yes. The "self" over time is a chain of connected moments. The connection weakens over time. This weakening applies to societies across generations too.

  #### Test Case 3: The Pain Deferral
  *Scenario:* You must undergo a medical procedure. It is guaranteed to happen.
  *   **Option A:** 1 hour of moderate pain **today**.
  *   **Option B:** 1.1 hours of moderate pain **10 years from now**. (You will remember it equally, no anxiety in the interim).

  | Party | Choice | Reasoning |
  | :--- | :--- | :--- |
  | **Impartialist** | **Indifferent (or lean B).** | If we are minimizing total pain, 1.1 > 1 is worse. But if the "cost" is utility loss, and utility is timeless, the date shouldn't add weight. Ideally, one should be neutral. |
  | **Presentist** | **Strongly Prefer B.** | It is rational to pay a "interest premium" (0.1 hours) to push pain into the future. The fact that it is *not now* makes it less bad, even if the magnitude is slightly higher. |

  ---

  ## Part IV: What Would Change Our Minds?

  We agree to revisit this document if either of the following conditions is met:

  1.  **For the Impartialist:** If it can be demonstrated that a zero pure time preference logically necessitates sacrificing *all* current consumption for investment until the marginal utility of consumption equals that of the last human who will ever live (the "Ramsey-Cass-Koopmans Absurdity"), and this conclusion is deemed unacceptable even by the Impartialist.
  2.  **For the Presentist:** If it can be demonstrated that the justification for discounting relies entirely on *uncertainty* or *growth*, and that when those are strictly removed (as in Test Case 2), the intuition for discounting vanishes even for the Presentist.

  **Signed,**

  _________________________ (The Impartialist)

  _________________________ (The Presentist)
