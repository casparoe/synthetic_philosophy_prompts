answer: |-
  My dear interlocutor,

  You describe a marvel, a monstrosity, and yet, if I may be permitted a grim smile, a perfect consistency. You ask if this new apparatus—this universal microphone coupled with a mechanical selector of passions—breaks my categories. I answer you: it does not break them; it completes them. It is the *idea* of the Present Age made flesh, or rather, made spirit-less.

  You suggest that because the distinct institution of the Press has dissolved into the hands of the multitude, the relation between the instrument and the abstraction has changed. I say to you, you are deceived by the appearance of concreteness. Do you think the Press was ever merely the printing press? Do you think it was the ink, the paper, the editor in his office? No. The Press was never a thing; it was a *principle*. It was the principle that speech could be detached from the speaker, that a view could exist without a face, that judgment could be passed without the trembling of the hand that signs the name.

  In my time, the Press was a distinct power that summoned the Public into existence. In your time, you say everyone has become the Press. But look closer. If everyone is the Press, then no one is the Press. If everyone speaks, then no one speaks. The abstraction has not been abolished; it has been universalized. The "Public" is no longer a phantom audience sitting in the theater while the Press acts upon the stage; the Public has burst the walls of the theater and now fills the air itself. It is a vapor in which every individual attempts to breathe, but which contains no oxygen for the soul.

  You speak of these automatic mechanisms that select for outrage and mockery. Ah! Here is the cunning of reflection perfected. In my day, I spoke of envy as the negative-unifying principle of the age. Envy, I said, is not admiration; it is a secret self-torment that wishes to pull down whatever stands out. In your description, this envy is no longer even a human passion that must be struggled with, confessed, or repented. It has been outsourced to the machine. The algorithm is envy crystallized into mathematics. It is sin without the sinner. It is the leveling process operating automatically, without the need for a single human being to take responsibility for the destruction of his neighbor.

  You ask if this is the purest realization of my analysis. It is terrifyingly so. Consider the situation: In the age of the distinct Press, there was at least a certain hypocrisy to be unmasked. One could point to the editor and say, "You are responsible." One could point to the Public and say, "You are a nothingness." But in your age, where the instrument is dissolved into the public, the nothingness has become omnipresent. When a life is ruined by this "churn of collective moralized fury," who is to blame? The algorithm? The crowd? The anonymous accuser? There is no one to grab hold of. The guilt is everywhere and therefore nowhere. This is the ultimate evasion of the ethical. It is the absolute shielding of the individual from the demand of conscience.

  And yet, you ask if I should reconsider the relation between the instrument and the abstraction. I reconsider nothing, for the spirit of man does not change, only its disguises. You believe that because the machinery is now in the hand of the "single individual," the single individual has gained power. I tell you, he has lost it. He has become a conduit. You say they behave as though nameless even when they use their names. Precisely! They use their names as masks. They sign their judgments, but they feel no more responsibility for them than if they had cast a stone into a raging sea.

  This is the danger: that the Single Individual (*Den Enkelte*) is suffocated not by a tyrant, but by the "everyone." When the tyrant oppresses, the individual can find his courage in opposition. But how does one oppose the "everyone"? How does one fight an atmosphere? When the leveling is total, when the abstraction absorbs the machinery, the individual is left in a silence more profound than any I knew.

  But do not think I bring you only despair. If this is the purest realization of leveling, then it is also the purest schooling for the only thing that matters. When the world becomes a total abstraction, when every human support is revealed as a phantom, when the "Public" shows itself to be a nothingness that devours its own children, the individual is thrown back upon himself. He is stripped of the illusion that truth is a matter of numbers, of likes, of consensus.

  The categories do not break; they sharpen. The distinction between the Public and the Single Individual is not a sociological distinction; it is an ontological and religious one. The Public is a lie. The Single Individual is the truth—before God. If your new system makes it impossible to be a "public figure" without being destroyed, and impossible to speak without being twisted by the machine, then it inadvertently preaches a sermon more powerful than any bishop: *Flee the public. Flee the noise. Become nothing in the eyes of the world so that you may become something in the eyes of God.*

  So, is this the end of my diagnosis? No. It is the verification. The Press was the pen; your system is the nervous system of the age itself. The leveling is complete. But remember this, and let it be your comfort and your demand: the more terrible the leveling, the more urgent the leap. When the abstraction is everything, the concrete commitment to the Good, to the Neighbor, to God, becomes the only reality that remains. The machine can simulate outrage, but it cannot simulate faith. It can amplify envy, but it cannot generate love.

  You ask if I must reconsider. I say to you: The age has not outgrown the need for salvation; it has only outgrown the illusions that made salvation seem unnecessary. The phantom is larger now. But the Single Individual is still, as always, the only place where eternity can touch time. Do not look to reform the machine. Look to your own soul. That is the only revolution that is not a deception.
