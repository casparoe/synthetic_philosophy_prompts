answer: |-
  **Desiderata for a Theory of Material Constitution**

  As one trained in the rigours of physical chemistry, I approach ontology with the expectation that it must not contradict the structural constraints of the natural world. A theory of material constitution cannot merely be logically consistent; it must be physically plausible. The following list specifies the requirements any adequate account must meet, distinguishing between those demanded by logic and empirical science (non-negotiable) and those that reflect specific metaphysical preferences (camp preference).

  **1. The Modal Discrimination Requirement**
  *   **Motivation:** The statue and the clay appear to have different modal properties. The clay could survive being squashed into a ball; the statue could not. If they are strictly identical, they must share all properties (Leibniz's Law). If they are distinct, we must explain how two things occupy the same space.
  *   **Status:** *Non-negotiable.* A theory must either deny the difference in modal properties, deny Leibniz's Law, or accept distinctness with an explanation for co-location. It cannot simply ignore the intuition that the object has different persistence conditions than its matter.

  **2. The Continuity of Persistence Requirement**
  *   **Motivation:** Living organisms and engineered systems persist through the gradual replacement of parts (metabolic turnover or the Ship of Theseus). A theory that declares an object ceases to exist upon the exchange of a single atom contradicts biological and engineering practice.
  *   **Status:** *Non-negotiable.* Any theory that entails organisms cease to exist continuously due to metabolic flux is empirically inadequate. The theory must accommodate functional and structural continuity despite mereological change.

  **3. The Determinacy of Fission and Fusion**
  *   **Motivation:** In cases where one object divides into two (fission) or two merge into one (fusion), logic demands we know whether the original object survives, ceases, or becomes both. Ambiguity in identity leads to contradictions in counting and reference.
  *   **Status:** *Non-negotiable.* While our *knowledge* may be uncertain, reality cannot be contradictory. The theory must provide a principled rule for identity through branching or merging histories, even if that rule is revisionary.

  **4. The Synchronic-Diachronic Distinction**
  *   **Motivation:** We must distinguish between what constitutes an object *now* (the clay currently shaping the statue) and what constitutes it *over time* (the succession of clay stages). Some theories collapse these, treating the object as merely the sum of its temporal parts.
  *   **Status:** *Camp Preference.* A theory may choose to treat objects as wholly present at each moment (endurantism) or as extended space-time worms (perdurantism). However, it must explicitly state its position, as collapsing the distinction alters the nature of change.

  **5. The Physical Compatibility Requirement**
  *   **Motivation:** Modern physics posits conservation of mass-energy and denies absolute simultaneity. If a statue and its clay are distinct physical entities, do they double the mass in that region? If constitution is simultaneous, which reference frame defines 'simultaneous'?
  *   **Status:** *Non-negotiable.* A metaphysical theory cannot violate conservation laws or rely on a privileged Newtonian time. If two entities are co-located, the theory must explain why this does not imply double mass-energy or gravitational effect.

  **6. The Dissolved-Scaffold Requirement**
  *   **Motivation:** Consider the ceramic artefact built by layer-by-layer deposition around a scaffold that is later dissolved. There was never a single lump of clay pre-existing the object; the matter was assembled incrementally.
  *   **Status:** *Non-negotiable.* A theory must account for objects that are not formed from a pre-existing, continuous mass. It must clarify whether this case differs in *kind* from the statue (which starts as a lump) or only in *degree*. If the theory relies on a "constituting lump" existing prior to the object, it fails this case.

  ***

  **The Joint Tension**

  There is a subset of these desiderata that appears jointly unsatisfiable under standard logical and physical constraints. Specifically, the **Modal Discrimination Requirement** (1), the **Physical Compatibility Requirement** (5), and the **Continuity of Persistence Requirement** (2) form a trilemma.

  If we satisfy (1) by claiming the statue and clay are distinct entities (to account for different survival conditions), we risk violating (5). If they are distinct physical entities occupying the same region, standard physics suggests we should observe double mass-energy or gravitational influence, which we do not. If we claim they are distinct but do not add to the mass, we posit 'ontologically real' entities that are physically undetectable, which sits uneasily with scientific realism.

  Conversely, if we satisfy (5) by claiming the statue and clay are strictly identical (one entity, one mass), we violate (1), as the single entity cannot have contradictory modal properties (surviving crushing vs. not surviving crushing). To save identity, one must often deny (2), arguing that the object does not truly persist through change in the way common sense or biology suggests, but rather that we are dealing with a series of distinct, momentary entities. Thus, one cannot simultaneously maintain distinct modal profiles, strict physical uniqueness, and robust persistence through change without incurring significant theoretical costs.

  ***

  **Assessment of Competing Frameworks**

  **Strict Identity Theory**
  This view holds the object and the matter are one and the same.
  *   **Performance:** It satisfies Physical Compatibility (5) perfectly, as there is only one mass.
  *   **Failure:** It fails the Modal Discrimination Requirement (1). It must deny that the statue and clay have different properties, forcing the counter-intuitive claim that the statue *could* survive being squashed (because the clay could) or that the clay *could not* (because the statue could not). It pays the cost of revising basic modal intuitions.

  **The Constitution View**
  This view holds the object and the matter are distinct but co-located entities.
  *   **Performance:** It satisfies Modal Discrimination (1) and Continuity of Persistence (2) elegantly.
  *   **Failure:** It struggles with Physical Compatibility (5). It must explain why two distinct entities do not constitute two masses. Furthermore, regarding the Dissolved-Scaffold Requirement (6), it often relies on the existence of a constituting 'lump', which is absent in the scaffold case, requiring ad hoc adjustments to define what constitutes the 'matter' side of the relation.

  **Mereological Essentialism**
  This view holds that an object's parts are essential to it; if parts change, the object ceases.
  *   **Performance:** It preserves Logical Consistency in Fission/Fusion (3) and avoids co-location issues in (5).
  *   **Failure:** It blatantly fails the Continuity of Persistence Requirement (2). It entails that organisms and ships cease to exist constantly as atoms are exchanged. For a physical scientist, this renders the concept of 'organism' or 'engineered system' useless for describing continuous processes.

  **Four-Dimensional Perdurantism**
  This view treats objects as space-time worms composed of temporal parts.
  *   **Performance:** It handles Persistence (2) and Fission (3) well by treating identity as a matter of temporal overlap. It can accommodate the Dissolved-Scaffold case (6) by focusing on the space-time region occupied.
  *   **Failure:** It faces difficulties with the Synchronic-Diachronic Distinction (4) by collapsing it, which many find revisionary. More critically, regarding Physical Compatibility (5), it must explain the ontology of 'temporal parts' in a way that respects relativistic frames, as slicing a space-time worm 'at a time' is frame-dependent. It risks making constitution relative to a reference frame, which is physically coherent but ontologically unsettling.

  ***

  No single framework satisfies all non-negotiable desiderata without incurring substantial revisionary costs to either logic, physics, or common sense.

  Adequate material constitution requires reconciling modal distinctness with physical uniqueness without abandoning the continuity of persistence.
