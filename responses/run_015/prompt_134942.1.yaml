answer: |-
  Here's the brainstorming and the plan. I've taught this to CS folks before, and the trick is always preventing them from reducing semantics to engineering constraints.

  ### 1. Dependency Structure (The Logical Scaffold)

  You can't just drop the two theories side-by-side. If you do, Epistemicism looks like "mystery" and Supervaluationism looks like "fuzziness." You need to build a specific tension first.

  **Order of Operations:**
  1.  **The Sorites Pressure:** Establish that small changes shouldn't change the category, but large changes must. (Standard setup).
  2.  **The Classical Commitment:** Remind them that in classical logic (which they know), every proposition is True or False (Bivalence) and there are no gaps.
  3.  **The Boundary Problem:** Force the question: "Where does the switch happen?"
      *   *Crucial Step:* You must establish that **denying a sharp boundary** seems to require denying Bivalence (if there's no line, there must be a gap).
      *   *The Twist:* Both theories want to save Classical Logic, but they save different parts of it.
  4.  **The Split:**
      *   **Epistemicism:** Saves Bivalence by insisting the line *exists* (metaphysically), even if we can't find it.
      *   **Supervaluationism:** Saves the *validity of classical inferences* by allowing truth-value gaps for borderline cases, but retaining Bivalence for clear cases.

  **Minimal Logical Machinery:**
  *   They need to understand **Bivalence** (P is T or F, no third option).
  *   They need to understand **Truth-Conditions** (what makes a statement true).
  *   *Do not* teach them model theory. Just use the idea of "ways of making the language precise."

  **Why this order?** If you start with Epistemicism, they'll reject it as absurd immediately. If you start with Supervaluationism, they'll think it's just "context dependence." You need them to feel the pain of the Boundary Problem first.

  ---

  ### 2. The Carrying Example: ML Classifier vs. Alternative

  **Verdict on the ML Classifier:**
  It is **pedagogically risky** in its current form.
  *   **The Problem:** Confidence scores (0.49 vs 0.51) imply *probability* or *degree of belief*. Vagueness is not probability. A tree isn't "51% tall." CogSci students know this distinction well. If you use confidence scores, they will conflate vagueness with measurement noise or model uncertainty (epistemic uncertainty vs. alethic vagueness).
  *   **The Fix:** If you use ML, drop the confidence score. Use the **Decision Boundary** itself.
      *   *Setup:* You have a legacy script that classifies trees. It uses a threshold `height > X`.
      *   *Epistemicist View:* There is a *correct* integer `X` mandated by the concept 'tall', even if the original developer didn't document it and we can't deduce it from usage.
      *   *Supervaluationist View:* There is a *range* of admissible `X` values (e.g., 150cm to 160cm) consistent with the concept. If a tree is 155cm, some admissible scripts say True, some say False. Therefore, the statement "This tree is tall" has no truth value in the legacy system.

  **Better Alternative: The "Database Schema Migration"**
  Since they are CogSci grad students, they likely deal with data cleaning.
  *   **Scenario:** You are merging two datasets. One has continuous `height_cm`. The other has a boolean `is_tall`. You need to write a SQL query to populate `is_tall` based on `height_cm`.
  *   **Why it works:**
      *   It forces a binary decision (True/False), matching classical logic.
      *   It makes the "precisification" concrete (choosing a specific `WHERE height_cm > X`).
      *   It avoids the "confidence score" trap. The data is exact; the *label* is the problem.

  **Properties the Example Must Have:**
  *   **Continuous Input:** (Height, frequency, wavelength).
  *   **Binary Output:** (Tall/Not, Red/Not, Safe/Unsafe).
  *   **No Measurement Error:** Stipulate the height is known exactly to the millimeter. The vagueness is in the *word*, not the *world*.

  ---

  ### 3. Misconceptions & Mitigation Strategy

  Here is where they will drift off, mapped to the timeline.

  **Misconception A: "Epistemicism is just Measurement Error"**
  *   **When it arises:** Minute 25, when you posit the sharp boundary.
  *   **The Thought:** "Obviously there's a line, we just need better instruments or more usage data to find it."
  *   **The Fix:** Explicitly stipulate **Ideal Knowledge**. Tell them: "Imagine you know every fact about how humans use the word 'tall', every brain state, every historical usage. The Epistemicist says even *then*, you couldn't know the boundary because there is no fact of the matter that grounds it—it's just brute metaphysical fact."
  *   **Key Phrase:** "It's not that we lack data; it's that the meaning doesn't supervene on usage."

  **Misconception B: "Supervaluationism is Relativism/Subjectivism"**
  *   **When it arises:** Minute 55, when introducing "precisifications."
  *   **The Thought:** "So truth depends on which precisification I choose? That's subjective."
  *   **The Fix:** Hammer the constraint of **Admissibility**. Not every threshold is allowed. A precisification that says "2cm is tall" is *inadmissible*. Truth is not up to the speaker; it's fixed by the range of *acceptable* sharpenings.
  *   **Key Phrase:** "Supertruth is truth across *all* admissible ways, not *any* way you like."

  **Misconception C: "Supervaluationism Rejects Bivalence Sloppily"**
  *   **When it arises:** Minute 65, comparing the two.
  *   **The Thought:** "So you're saying logic is broken?"
  *   **The Fix:** Show them that Supervaluationism *keeps* classical tautologies (e.g., "Either the tree is tall or it is not tall" is still Supertrue). It only rejects bivalence for *atomic* borderline claims.
  *   **Key Phrase:** "Classical logic holds for the clear cases and the tautologies; gaps only appear in the borderline atomic claims."

  ---

  ### 4. The Check Question & The Exclusion

  **The Check Question (Minute 85):**
  Don't ask "What is Epistemicism?" Ask this:

  > "Consider a borderline case (e.g., a 155cm tree).
  > 1. If the Epistemicist is right, is the statement 'This tree is tall' True, False, or Neither?
  > 2. If the Supervaluationist is right, is it True, False, or Neither?
  > 3. **Crucial Follow-up:** If the Supervaluationist says 'Neither', how do they explain why 'Either this tree is tall or it is not tall' is still a valid logical truth?"

  *Why this works:* It forces them to distinguish the truth value of the atomic claim (where they differ) from the logical law (where Supervaluationism tries to preserve classical logic). If they say Supervaluationism makes the excluded middle false, they missed the point of "Supertruth."

  **The Explicit Exclusion:**
  **Do not explain the formal semantics of precisification spaces.**
  *   Don't draw the models. Don't talk about accessibility relations between precisifications. Don't introduce the formal definition of validity in supervaluationary logic.
  *   **Why:** In 90 minutes, formal semantics will eat all your time and leave them knowing the math but not the philosophy. Keep it conceptual: "Imagine a set of compatible SQL queries." If they want the formalism, they can read the papers later.

  ---

  ### 90-Minute Run-of-Show (Rough Cut)

  *   **00-10:** Intro & The Sorites Setup (using the Database example).
  *   **10-25:** The Boundary Problem & Classical Logic commitments.
  *   **25-45:** **Epistemicism.** (Focus: Sharp boundary, ignorance is fundamental). *Mitigate Misconception A here.*
  *   **45-50:** Break / Reset.
  *   **50-70:** **Supervaluationism.** (Focus: Admissible precisifications, truth-value gaps). *Mitigate Misconceptions B & C here.*
  *   **70-85:** Head-to-Head Comparison. Why choose one over the other? (Costs/benefits).
  *   **85-90:** The Check Question & Wrap.
