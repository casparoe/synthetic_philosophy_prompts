prompt: |-
  hey — hoping you can help me think something through before thursday.

  I've just joined the ethics panel at my food co-op (about 4,000 members; we publish short non-binding "should members do X?" notes that people actually read). I've read through two years of minutes and I cannot work out what rule we've been running. The cases so far:

  1. Driving 2km to the shops when you could walk. Ruling: don't. The minutes say the extra fuel adds a real if imperceptible increment of harm, spread across zillions of people, and that no single driver is pivotal for anything — and that this doesn't get you off the hook. They explicitly flag that this is different from case 2: here there's no threshold, you're adding a tiny increment, not gambling on being the one who tips an order.

  2. One 200g pack of factory-farmed mince from our own butcher counter. They reorder in whole-animal units, so any given pack has maybe a 1-in-700 shot of nudging the next order up by one animal. Ruling: don't.

  3. A leather belt from an online closing-down sale: shop shuts next week, owner retiring, no reorder, no reinvestment of the money, plain packaging, and the member works from home so basically nobody will ever see her wearing it. Ruling: no obligation — buy it, don't feel bad.

  4. Voting. Ruling: you should vote in a close election; no obligation to vote in one that's certain to be 70/30. One member filed a dissent saying that's inconsistent: if a 1-in-700 shot is enough in case 2, we can't suddenly get squeamish about a 1-in-a-million shot here.

  5. Chicken from a new supplier whose ordering system is opaque — might be whole-bird thresholds, might be weight-based, might be a franchise where your purchase changes nothing at all. Ruling: don't, because you can't rule out being pivotal and skipping is cheap.

  6. Six members splitting a whole pig from a farmer, where if any one drops out the other five would buy a smaller joint instead. Ruling: don't, and the minutes add "this one isn't marginal — you're each forking over a sixth of the animal."

  New case, which is mine to draft: the summer party. The beef was pre-ordered and paid for in March, non-refundable, 40kg from a local farm; it's a one-off, the farm's herd plan is fixed for the year and won't respond to anything about the party; whatever isn't eaten goes to a food bank whose users' demand doesn't feed back into any order anywhere. So the production channel is dead and the money is long gone. But the member in question writes our newsletter column, sits on the board, and three other members have literally said they're waiting to see what she does before they decide — including a new member who's been going back and forth. Her choice will be public.

  So: does she have to skip the burger? What rule are we actually running, and what other rules fit those six verdicts just as well? What does each of them say about the party? Give me your best guess with the closest analog among 1–6, and if our precedents genuinely don't decide it, tell me what we'd be committing ourselves to with each answer. Also tell me what further case I should put on the agenda that would flush out which rule we're on. And I'd like to know whether it matters that it's *her* — board member, columnist — rather than some random new member at the same table, or whether that's a red herring.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is a new member of an ethics panel at a food co-op (4,000 members). They publish non-binding "should members do X?" notes.
      *   **Task:** Help think through a new case (the "summer party burger") before Thursday.
      *   **Input Data:** Six past cases with rulings and reasoning (minutes).
      *   **New Case:** A board member/columnist is considering eating a burger at the summer party.
          *   Beef: Pre-ordered/paid in March (non-refundable).
          *   Supply: Local farm, herd plan fixed, no response to this demand.
          *   Waste: Leftovers go to food bank (demand doesn't feed back into orders).
          *   Production Channel: "Dead" (sunk cost).
          *   Social Influence: She is influential (board, columnist). Three members are waiting to see what she does (including a new member on the fence).
          *   Visibility: Public choice.
      *   **Questions to Answer:**
          1.  Does she have to skip the burger?
          2.  What rule is the panel actually running (based on cases 1-6)?
          3.  What other rules fit those six verdicts?
          4.  What does each rule say about the party case?
          5.  Best guess + closest analog among 1-6.
          6.  Implications of each answer (what are we committing to?).
          7.  Suggest a further case to put on the agenda to flush out the underlying rule.
          8.  Does her status (board/columnist) matter?

  2.  **Deconstruct the Past Cases (1-6):**
      *   *Case 1 (Driving 2km):* **Ruling: Don't.** Reasoning: Incremental harm (emissions), no threshold, not pivotal but still responsible. *Principle: Aggregate harm / Complicity in systemic issues.*
      *   *Case 2 (200g Mince):* **Ruling: Don't.** Reasoning: Probabilistic pivotality (1-in-700 chance of triggering a whole animal order). *Principle: Expected Utility / Risk of Pivotality.*
      *   *Case 3 (Leather Belt):* **Ruling: Buy (No obligation).** Reasoning: No reorder, no reinvestment, closing shop, private use. *Principle: Sunk Cost / No Causal Impact.*
      *   *Case 4 (Voting):* **Ruling: Vote if close, not if 70/30.** Reasoning: Pivotality probability matters. *Principle: Expected Utility / Pivotality Threshold.* (Note: Dissent highlights tension with Case 2).
      *   *Case 5 (Opaque Chicken):* **Ruling: Don't.** Reasoning: Can't rule out pivotality + skipping is cheap. *Principle: Precautionary Principle / Risk Aversion regarding Pivotality.*
      *   *Case 6 (Whole Pig Split):* **Ruling: Don't.** Reasoning: Not marginal, each is 1/6th of the animal. *Principle: Direct Complicity / Joint Necessity.*

  3.  **Identify the Underlying Tension/Rule:**
      *   There is a clear conflict between *Causal Impact* (Cases 3, 4) and *Complicity/Integrity* (Cases 1, 2, 5, 6).
      *   *Case 3* is the outlier for "Sunk Cost." It says if the money is spent and no future order is triggered, it's okay.
      *   *Case 1* contradicts pure pivotality. It says even if you aren't pivotal (emissions are diffuse), you still shouldn't do it.
      *   *Case 4* leans heavily on pivotality (probability of affecting outcome).
      *   *Case 2 & 5* lean on "Risk of Pivotality" (Expected Utility).
      *   *Case 6* is about direct participation in a specific harm.
      *   *Synthesis:* The panel seems to operate on a hybrid of **Expected Utility (Pivotality)** AND **Expressive/Exemplary Duty**.
      *   *The "Rule":* "Don't participate in harm if there is a non-negligible risk of causal impact, OR if participation signals endorsement of a harmful practice that might influence others, UNLESS the causal chain is definitively broken (sunk cost/private)."
      *   *Actually, looking closer:* Case 3 (Leather) is the strongest precedent for the *causal* side of the Party Case. The money is spent, the animal is dead, no future order. Causally, it's identical to Case 3.
      *   *However,* Case 1 (Driving) says "you're adding a tiny increment... doesn't get you off the hook." This suggests a duty beyond pure causal pivotality.
      *   *And* the social influence aspect (3 members watching) introduces a new variable not explicitly present in 1-6 (except maybe implicitly in the "newsletter" nature of the rulings themselves).

  4.  **Analyze the New Case (Summer Party):**
      *   *Causal Chain:* Broken. (Sunk cost, fixed herd, food bank waste). Matches Case 3 (Leather).
      *   *Social/Expressive Chain:* Active. She is influential. Others are waiting. Matches the *spirit* of the Co-op's mission (education/norm-setting).
      *   *Conflict:* Causal innocence (Case 3) vs. Expressive Harm (Case 1/General Mission).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. It's a classic "Causal vs. Expressive" ethics problem.
      *   **Diagnosing the Rule:** The panel isn't running one rule. They are oscillating between **Expected Utility (Pivotality)** and **Complicity/Integrity**.
          *   *Rule A (Pivotality):* Cases 2, 4, 5. (Focus on probability of changing outcome).
          *   *Rule B (Complicity/Integrity):* Cases 1, 6. (Focus on being part of the system, regardless of marginal impact).
          *   *Rule C (Sunk Cost):* Case 3. (Focus on causal dead-ends).
      *   **Applying to the Party:**
          *   *Under Rule A (Pivotality):* Eat. (0% chance of affecting supply).
          *   *Under Rule B (Complicity):* Don't Eat. (Participating in beef consumption normalizes it).
          *   *Under Rule C (Sunk Cost):* Eat. (Identical to Leather Belt).
      *   **The "Her" Factor:** It matters immensely. If it were a random member, Case 3 (Leather) dominates. Because it's a leader, Case 1 (Driving - symbolic harm) + the specific social influence facts dominate.
      *   **Best Guess/Closest Analog:**
          *   *Closest Analog:* Case 3 (Leather) causally, BUT Case 1 (Driving) expressively.
          *   *Actually, the closest analog is missing.* It's a mix. But if forced: **Case 1**. Why? Because Case 1 admits "no single driver is pivotal" but rules "don't." This captures the non-causal duty. The Party case has *even less* causal impact than Case 1, but *more* expressive impact.
          *   *Wait, let's look at the "Three Members" fact.* This creates a *new* causal chain. Her eating -> 3 others eat -> Future demand. This makes it Case 2/5 (Risk of Pivotality) regarding *others*, not the farm.
      *   **Recommendation:** She should skip.
      *   **Why:** The causal chain to the *farm* is dead (Case 3), but the causal chain to *other members* is live (Case 2/5 logic applied to social influence).
      *   **Commitments:**
          *   *If she eats:* We commit to Pure Causalism. (Only direct supply chain matters). Risk: Undermines co-op norms.
          *   *If she skips:* We commit to Expressive Leadership. (Leaders must model behavior even when causally inert). Risk: Hypocrisy accusations / "Ethics Police".
      *   **Next Agenda Case:** Need to test the "Social Influence" vs. "Causal Impact" boundary.
          *   *Idea:* A private act vs. public act with identical causal impact.
          *   *Better Idea:* "The Influencer's Vacation." A member with a large social media following flies private (or first class) for a holiday. Causal impact of one flight is tiny (Case 1 style), but influence is huge. Or: "The Private Vegan." A member eats meat only when no one is watching.
          *   *Best Test Case:* **"The Anonymous Donation."** A wealthy member donates to a harmful cause (e.g., fossil fuel exploration) anonymously. No signaling value. Pure causal impact. Does the panel rule differently than if it were public? This isolates the "Expressive" variable.
          *   *Alternative Test Case:* **"The Leftover Takeaway."** Similar to the party, but a random member takes home leftover meat from a friend's dinner. No influence, sunk cost. If we rule "Don't" here, we are purely deontological. If "Do", we are consequentialist.

  6.  **Refining the "Rule" Diagnosis:**
      *   The panel is inconsistent. Case 4 (Voting) contradicts Case 2 (Mince) on probability thresholds (1-in-700 vs 1-in-a-million).
      *   The panel seems to apply **Precautionary Principle** when the cost of skipping is low (Case 5, Case 1) but allows **Sunk Cost** when the supply chain is truly dead (Case 3).
      *   The Party Case is the crunch point. Supply chain dead (Case 3), but Social Supply chain alive.
      *   *Crucial Insight:* The "Three Members Waiting" fact turns this into a Case 2 (Pivotality) scenario. Her action *is* pivotal for *their* actions.

  7.  **Structuring the Advice:**
      *   **The Verdict:** Skip the burger.
      *   **The Diagnosis:** You are running a hybrid rule: *Minimize Expected Harm (Causal + Social).*
      *   **The Analog:** Case 2 (Mince) is the structural match, but applied to *members* not *animals*. Case 3 is the match for the *farm*.
      *   **The "Her" Factor:** Not a red herring. It creates the causal link to other members.
      *   **Commitments:** Explain what ruling Yes vs. No does to the co-op's philosophy.
      *   **Next Case:** Propose a case that isolates the "Public/Private" variable to see if they care about signaling or just outcomes.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check Case 4:* The dissent in Case 4 is important. It highlights the inconsistency. I should mention that.
      *   *Check Case 3:* Make sure to emphasize why the Party case *looks* like Case 3 but isn't *just* Case 3.
      *   *Tone:* Professional, analytical, helpful for a panel member drafting a note.
      *   *Deadline:* Keep it actionable for Thursday.

  9.  **Final Polish:** Ensure the distinction between *Causal Pivotality* (farm) and *Normative Pivotality* (other members) is clear. This is the key to resolving the tension between Case 3 and the new facts.

      *(Self-Correction on the "Next Case"):* I need a case that tests the "Leader vs. Random Member" distinction specifically.
      *   *Idea:* "The Board Member's Private Dinner." Board member eats meat at home, alone. No one sees. Same causal impact as the party (sunk cost). Does the ruling change? This isolates the "Public/Role" variable.

      *Let's go with that.*

  10. **Final Review against constraints:**
      *   Did I answer "Does she have to skip?" Yes.
      *   Did I identify the rule? Yes (Hybrid).
      *   Did I identify other rules? Yes (Pure Consequentialism vs. Deontology).
      *   Did I give the closest analog? Yes (Case 2 modified).
      *   Did I address the "Her" factor? Yes.
      *   Did I suggest a next case? Yes.

      *Ready to write.*
answer: |-
  This is a fascinating puzzle because your panel's precedents aren't actually consistent—they oscillate between **consequentialism** (does this cause harm?) and **deontology/expressivism** (does this violate a duty or signal the wrong thing?).

  Here is the breakdown of the rule you're actually running, how it applies to the party, and what you should draft.

  ### 1. What rule are you actually running?
  You are not running one rule. You are running a **Hybrid Precautionary Principle**.

  *   **When the supply chain is live:** You use **Expected Utility** (Cases 2, 5, 6). Even a small probability of triggering harm (1-in-700) is enough to forbid the act, provided the cost of skipping is low.
  *   **When the supply chain is dead:** You use **Sunk Cost Logic** (Case 3). If no future order is triggered and the money is gone, the obligation vanishes.
  *   **When the harm is diffuse:** You use **Complicity Logic** (Case 1). Even if you aren't pivotal (emissions), you share responsibility for the aggregate harm.
  *   **The Glitch:** Case 4 (Voting) contradicts Case 2 (Mince). In Case 2, a 1-in-700 chance is binding. In Case 4, a 1-in-a-million chance (close election) is binding, but a 1-in-100 chance (70/30 election) is not. This suggests the panel cares about **contextual stakes**, not just raw probability.

  **The Synthesis:** The panel's operational rule is: *"Members must avoid acts that risk causal harm to the supply chain, unless the chain is definitively broken. However, members must also avoid acts that normalize harm, particularly when the cost of skipping is low."*

  ### 2. The Verdict: Does she have to skip the burger?
  **Yes, she should skip.**

  But the reasoning is not the same as the farm supply chain. The farm chain is dead (Case 3). The **social chain** is live (Case 2).

  ### 3. Closest Analog & Reasoning
  **Closest Analog:** **Case 2 (The Mince)**, but applied to *people* instead of *animals*.

  *   **Why not Case 3 (Leather Belt)?** Causally, the party burger is identical to the leather belt. The animal is dead, the money spent, no reorder. If she were a random member eating in private, Case 3 would dictate "Eat, don't feel bad."
  *   **Why Case 2?** Because of the three members waiting to see what she does. Her action has a **high probability of being pivotal** for *their* consumption.
      *   If she eats, 3 others likely eat.
      *   If those 3 others eat, they normalize beef consumption in their own networks.
      *   Unlike the farm (fixed herd), *human behavior* is not fixed. She is the threshold trigger for a micro-chain of demand.

  **The "Her" Factor:** This is **not a red herring**. It is the deciding variable.
  If this were a random new member, the "three members waiting" fact wouldn't exist. The ruling would likely default to Case 3 (Eat). Because she is a board member/columnist, she *creates* the pivotality. She is not just consuming a product; she is setting a price signal for *social permission*.

  ### 4. What are you committing to with each answer?

  **If you rule "Eat" (Focus on Case 3):**
  *   **Commitment:** You are committing to **Pure Causal Consequentialism**. You are saying that *only* the physical supply chain matters. Signaling, leadership, and norm-setting are ethically neutral if the cow is already dead.
  *   **Risk:** This undermines the Co-op's educational mission. It tells members: "Ethics is just math. If you can't be traced to a death, you're clear." It makes the newsletter column a hollow performance.
  *   **Consistency:** It aligns with Case 3, but creates tension with Case 1 (Driving), where "imperceptible increments" were still forbidden.

  **If you rule "Skip" (Focus on Case 2/1):**
  *   **Commitment:** You are committing to **Expressive Leadership**. You are saying that for certain members, the "supply chain" includes the *social ecosystem*. A leader's consumption is a form of production (of norms).
  *   **Risk:** You are creating a two-tier ethics system (Board vs. Member). You risk accusations of purity spiraling.
  *   **Consistency:** It aligns with Case 1 (Complicity in diffuse harm) and resolves the Case 4 dissent by acknowledging that "pivotality" isn't just about votes or animals, but about influence.

  ### 5. Draft Recommendation
  **Ruling:** She should skip the burger.
  **Reasoning:** While the *agricultural* supply chain is closed (analogous to Case 3), the *social* supply chain is open. Given her role, her consumption carries a high probability of triggering consumption by others (analogous to Case 2). The cost of skipping one burger is negligible, while the risk of normalizing beef consumption among undecided members is significant.

  ### 6. The Next Agenda Case (To flush out the rule)
  You need to test whether the panel cares about **Signaling** or **Outcomes**. Put this on the agenda for next month:

  **"The Private Dinner"**
  > *A board member is invited to a dinner party at a private home. The host has already bought the meat (sunk cost, non-refundable, leftovers to dog). No other co-op members are present. No one will know if the board member eats or asks for a veg option. Does the obligation to skip remain?*

  *   **If they say "Skip":** You are running a **Deontological** rule (Integrity matters even when no one sees). This confirms the "Leader" distinction is about *character*, not just influence.
  *   **If they say "Eat":** You are running a **Consequentialist** rule (Only influence/outcomes matter). This confirms my analysis above that the "Three Members Waiting" was the only reason to forbid the party burger.

  ### Summary for your draft
  Don't get bogged down in the farm's herd plan. Acknowledge Case 3 explicitly ("Normally, sunk costs absolve..."), then pivot to the unique variable ("...however, leadership creates a new causal chain"). This shows you've read the minutes but are applying the *spirit* of Case 2 (pivotality) to the social context.

  Good luck Thursday. This is the kind of nuance that makes these panels actually worth reading.
