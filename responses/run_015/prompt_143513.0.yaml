answer: |-
  ### The Psychiatric Kinds Sorting Instrument

  **Instructions for the Seminar:**
  Present the following nine questions sequentially. Participants answer based on their intuitive judgment of the case or claim presented. Do not reveal the destination (the "Leaf") until the end of the path. The goal is to map their ontological commitments, not to test their knowledge of the DSM.

  ***

  #### Branch 1: The Opaque Loop
  **Case:** A proprietary algorithm predicts suicide risk using smartphone keystroke dynamics and sleep data. Patients are told they "crossed a threshold" but cannot see the criteria or contest the logic.
  **Question:** If the algorithm predicts outcomes perfectly but explains nothing about the human mind, is it tracking a **real kind of person** or just a **useful statistical pattern**?
  *   **A.** Real kind of person. (Go to Branch 2)
  *   **B.** Useful statistical pattern. (Go to Branch 7)

  #### Branch 2: The Hidden Cause
  **Claim:** For a standard diagnosis like Major Depression, consider the relationship between the symptoms (insomnia, low mood, fatigue).
  **Question:** Do these symptoms cause each other (a network), or does a hidden underlying disease entity cause all of them (a mechanism)?
  *   **A.** Hidden underlying disease entity. (Go to Branch 3)
  *   **B.** Symptoms cause each other (Network). (Go to Leaf: **Network View**)

  #### Branch 3: The Billing Loop
  **Case:** A new reimbursement code is introduced. Prevalence of the disorder doubles within a year. Patients do not know the code exists and their self-understanding has not changed.
  **Question:** Did the **kind of person** existing in the world change, or did only the **count of people** captured by the institution change?
  *   **A.** Only the count changed. (Go to Branch 4)
  *   **B.** The kind of person changed (Institutional Looping). (Go to Branch 5)

  #### Branch 4: Diagnostic Decay
  **Case:** A label becomes stigmatized. Patients learn to hide specific behaviors to avoid the diagnosis, so the criteria stop picking them out.
  **Question:** Does this mean the category has failed to track reality (the target moved), or that the patients are now successfully masking the reality (the tool is blocked)?
  *   **A.** The target moved (Unstable Kind). (Go to Branch 5)
  *   **B.** The tool is blocked (Stable Kind). (Go to Branch 6)

  #### Branch 5: The Equilibrium Check
  **Claim:** Regarding the instability identified in the previous steps (looping/moving targets).
  **Question:** Do you expect the criteria and the people to eventually settle into a stable equilibrium, or is the instability a permanent feature of this kind?
  *   **A.** Permanent instability (The kind evolves with the classification). (Go to Leaf: **Looping-Aware Realism**)
  *   **B.** Temporary instability (We are still refining the measurement). (Go to Branch 6)

  #### Branch 6: The Function Boundary
  **Claim:** Regarding the underlying mechanism or stable trait.
  **Question:** Is there a clear, biological line between "functioning" and "dysfunctioning," or is it a gradient of traits where we draw a pragmatic cutoff?
  *   **A.** Clear line between function and dysfunction. (Go to Leaf: **Harmful Dysfunction**)
  *   **B.** Gradient of traits with pragmatic cutoff. (Go to Leaf: **Mechanistic Property Cluster**)

  #### Branch 7: The Identity Claim
  **Case:** Prolonged Grief Disorder. Bereaved people organize to demand the diagnosis, not to be "cured" of grief, but to have their loss taken seriously.
  **Question:** Are they seeking **treatment for a sickness** or **recognition of an identity**?
  *   **A.** Treatment for a sickness. (Go to Branch 8)
  *   **B.** Recognition of an identity. (Go to Leaf: **Neurodiversity/Reclamation**)

  #### Branch 8: The Utility vs. Truth
  **Claim:** Regarding the "useful statistical pattern" from Branch 1.
  **Question:** Is the primary value of the category that it helps us **do things** (bill, treat, manage) or that it **describes nature** accurately?
  *   **A.** Helps us do things (Instrumental). (Go to Leaf: **Pragmatic Conventionalism**)
  *   **B.** Describes nature (Realist). (Go to Branch 9)

  #### Branch 9: The Abolition Check
  **Claim:** If a category is socially harmful (stigma) but clinically useful (access to care).
  **Question:** Should the category be **abolished** to stop the harm, or **retained** to manage the harm?
  *   **A.** Abolished. (Go to Leaf: **Eliminativist Constructivism**)
  *   **B.** Retained. (Go to Leaf: **Pragmatic Conventionalism**)

  ***

  #### The Calibration Question (Agreement Point)
  **Question:** "Does the application of a psychiatric label alter a patient's access to insurance, medication, or legal protections?"
  **Expected Answer:** **Yes.** (Every position from Realism to Eliminativism agrees on this material consequence, even if they disagree on what the label *means*.)

  ***

  ### The Leaves (Ontological Positions)

  1.  **Harmful Dysfunction:** (Branches 1A → 2A → 3A → 4B → 6A). There is a biological mechanism, a clear line between health and disease, and the category tracks a stable natural kind.
  2.  **Mechanistic Property Cluster (MPC):** (Branches 1A → 2A → 3A → 4B → 6B). There is an underlying mechanism, but traits exist on a gradient; the category is real but requires pragmatic cutoffs.
  3.  **Network View:** (Branches 1A → 2B). There is no hidden disease; the symptoms themselves causally reinforce one another. The "disorder" is the system of symptoms, not a latent entity.
  4.  **Looping-Aware Realism:** (Branches 1A → 3B/4A → 5A). The kind is real, but it is unstable because classifying it changes it. The target moves because the people move.
  5.  **Neurodiversity/Reclamation:** (Branches 1A → 7B). The difference is real and stable, but the "pathology" frame is the error. Looping is identity formation, not symptom creation.
  6.  **Pragmatic Conventionalism:** (Branches 1B → 8A OR 1B → 9B). Truth is secondary to utility. Categories are tools for care and administration, not mirrors of nature.
  7.  **Eliminativist Constructivism:** (Branches 1B → 9A). The category is a fiction of power that causes net harm. It should be abolished, not refined.

  ***

  ### Seminar Leader's Commentary (Meta-Analysis)

  **1. Merged or Split Leaves?**
  *   **Harmful Dysfunction vs. MPC:** These two are notoriously difficult to separate in practice. Both commit to a biological mechanism. The distinction rests entirely on Branch 6 (Sharp Line vs. Gradient). In a seminar, residents may argue these are the same position with different degrees of confidence. I kept them separate because the "dysfunction" boundary is the specific flashpoint for debates about medicalization (e.g., is grief a dysfunction?).
  *   **Pragmatic Conventionalism:** This leaf captures two paths (Branch 8A and 9B). This is intentional. Whether you start from "it's just a tool" or "it's harmful but we need it," you end up at the same clinical posture: use the code, but don't reify the ontology.

  **2. Indistinguishable Leaves?**
  *   **Looping-Aware Realism vs. Neurodiversity:** These can blur. Both agree the category affects the person. The tree separates them on *normativity* (Branch 7): Is the goal cure (Realism) or recognition (Neurodiversity)? However, a sophisticated participant might argue that "recognition" *is* a form of treatment, merging the leaves. Be prepared to defend the distinction between "managing a pathology" and "validating an identity."

  **3. Empty or Unoccupied Combinations?**
  *   **Biological Realist + Eliminativist:** The tree technically allows someone to answer "Real Kind" (Branch 1A) but then choose "Abolish" (Branch 9A). This combination is rarely occupied. If you believe a biological disease entity exists, you almost never argue for abolishing the category (you might argue for renaming it, but not abolition). This combination is usually incoherent: why abolish a name for a real thing unless the name itself causes the harm (which pushes you toward Constructivism)?
  *   **Network Model + Harmful Dysfunction:** The tree prevents this (Branch 2 splits them), which is correct. You cannot consistently hold that symptoms cause each other (Network) AND that a hidden biological dysfunction causes the symptoms (HD). If a participant tries to claim both, they are conflating "mechanism" with "causal system."

  **4. The "Opaque Loop" Problem:**
  *   Branch 1 is designed to catch the **Opaque Loop** case. If a participant says the ML category is *not* a real kind (1B) because there is no mechanism, they are committed to **Pragmatism** or **Eliminativism**. If they say it *is* a real kind (1A) despite the opacity, they are committed to a form of **Realism** that prioritizes prediction over understanding. This forces a choice between "knowing why" and "knowing that."

  **5. The "Billing Loop" Distinction:**
  *   Branch 3 isolates the **Reimbursement-Code Loop**. If a participant says the kind *didn't* change (3A), they are treating the category as **Indifferent** (like a chemical element) despite the institutional shifting. If they say the kind *did* change (3B), they are admitting that institutional forces constitute the kind, even without patient awareness. This is a harder form of constructivism than Hacking's standard "interactive kind," which usually requires the subject's uptake.

  **6. Where the Disagreement Isn't:**
  *   Use the **Calibration Question** at the start or end. It demonstrates that while the room is divided on *what* a diagnosis is (ontology), they are united on *what a diagnosis does* (material consequence). This grounds the metaphysical debate in the clinical reality they all share.
