  **Mara:** So, your pitch is that underdetermination isn't a universal threat? It's just a bug in high-dimensional systems?

  **Leo:** Not a bug, a feature of the topology. Look, global underdetermination assumes you can always twist an auxiliary hypothesis to save the core theory without cost. But in low-dimensional spaces—classic kinematics, say—there's nowhere to hide. If you tweak the mass parameter to save a force law, the trajectory breaks. The parameters are statistically identifiable. The evidence locks onto the ontology because the degrees of freedom are exhausted by the data.

  **Mara:** That assumes the data speaks for itself. It doesn't. You're treating the model structure as fixed, but the boundaries of that model are auxiliary commitments themselves. Even in $F=ma$, you're smuggling in assumptions about instrument calibration, frictionless surfaces, and background fields. You can always adjust the error term to accommodate a rival ontology.

  **Leo:** But you're conflating logical possibility with statistical identifiability. Yes, logically, I can invent a demon that shifts my caliper readings. But statistically, in a low-dimensional paramter space, that demon introduces variance that the data rejects. The likelihood function spikes too sharply. Underdetermination only survives when the noise floor is wide enough to absorb the tweak. That's why it bites in climate modeling—thousands of coupled variables—but vanishes in Newtonian mechanics.

  **Mara:** The noise floor isn't given, Leo. It's modeled. When you say the data "rejects" the tweak, you're relying on a background theory of measurement error. That theory is itself underdetermined. You're claiming the dimensionality saves you, but you've just pushed the underdetermination down one level to the statistics package.

  **Leo:** I'm not saying statistics are theory-free. I'm saying the *capacity* for underdetermination is gated by dimensionality. If the system has five variables and you have five hundred data points, the solution space collapses. You can't save a false theory without making it look absurdly complex. Global underdetermination ignores the penalty for complexity. It treats all auxiliaries as equally cheap, but in low dimensions, expensive auxiliaries are statistically visible.

  **Mara:** Visible to whom? To a framework that already assumes simplicity is a virtue. That's a pragmatic choice, not an evidential one. You're saying ontology is determined in kinematics because the math forces a unique solution. I'm saying the math only forces a unique solution *given* your auxiliary commitment to standard error distributions. Change the distribution assumption—another auxiliary—and your "unique" solution dissolves. The dimensionality doesn't matter; the logical space of auxiliaries is always open.

  **Leo:** But opening that space changes the dimensionality! If you add error distributions as free parameters, you've moved the problem into a higher-dimensional space where my view applies. You're proving my point. Underdetermination isn't a global shadow; it's a local condition that emerges when you expand the model enough to hide the discrepancies. In tight systems, you can't expand without breaking the fit.

  **Mara:** So you're admitting it's always *possible* to expand the model?

  **Leo:** Possible, yes. But not viable. Science isn't about what's logically possible; it's about what's identifiable.

  **Mara:** And identifiability is just underdetermination wearing a suit. You've defined away the problem by restricting the field to where it doesn't appear.
