answer: |-
  Subject: Care ethics session design

  Dear colleague,

  I have been thinking hard about your problem with the care ethics seminar, and I share your frustration that students can recite the critique of impartialism without feeling the weight of the particular claim. The issue is that we usually teach care ethics as a theory about values, when it is actually a theory about constraints and epistemology. To get them to feel the collision between the irreducible demand of the other and the institutional necessity of scaling, you need to put them in a system where satisfying one requirement systematically violates the other. I have designed a ninety-minute simulation based on your friend's care home story that forces this trade-off into the open. The key is to structure the incentives so that proxy capture emerges naturally from their attempt to be good actors within the rules, rather than you telling them it happens.

  You will need to arrange the room into six groups of three students. Each group represents one care home unit. Within each group, assign roles silently using cards handed out as they enter so there is no negotiation about who plays what. The roles are the Resident, the Carer, and the Inspector. You will run three rounds of ten minutes each, with brief pauses for reflection between them. The materials are simple. Each Resident gets a secret Need Card. Each Carer gets a pool of ten Energy Tokens. Each Inspector gets a Compliance Checklist and a stamp. The stakes are small but tangible. Tell the Carers at the start that any Carer who maintains their employment through all three rounds will receive a tangible reward, perhaps a voucher or simply public recognition, while those fired must sit out the debrief as observers. This creates immediate pressure to satisfy the Inspector.

  The secret briefings are where the philosophical work is hidden. The Resident's card describes a specific, particular need that cannot be met by generic attention. For example, one card might say you are terrified of falling at night and need reassurance that the bed rails are up, while another says you are lonely and need to hear about the Carer's day. Crucially, the Resident also holds a hidden rating card marked Care Felt, which they fill out at the end of each round based on whether their specific need was met, not on whether tasks were done. They are instructed that their rating does not affect the Carer's employment, only the Carer's conscience. This establishes the inverted epistemic asymmetry. The Resident knows best whether care occurred, but their judgment has no institutional currency. The Carer receives the ten Energy Tokens. Each action costs energy. Listening to a story costs two tokens. Checking bed rails costs two tokens. However, filling out the paperwork for the Inspector costs one token per box. The Inspector receives a checklist that measures proxy indicators. Did you address the resident by name? Did you offer a choice of beverage? Did you log a five-minute social interaction? The Inspector is instructed to ignore the content of the interaction and only verify that the log is filled correctly. They are told their job is to ensure standards are met across the whole home, not to evaluate the quality of the relationship. They decide whether the Carer keeps their job based solely on the checklist.

  In the first round, remove the Inspector. Let the Carer and Resident interact freely with the Energy Tokens. This establishes the baseline of second-personal irreplaceability. Without the checklist, most Carers will ask the Resident what they need and spend their tokens there. The Resident will likely report high Care Felt scores. You want them to feel the natural flow of attending to the particular. In the second round, introduce the Inspector and the Checklist. Tell the Carers that due to new regulations, employment now depends on the Inspector's stamp. Keep the Energy Tokens limited. Now the Carer faces the collision. They have ten tokens. Meeting the specific need might cost four tokens. Completing the checklist requires three actions at one token each, plus the time to log them. Often, the math will not work. To keep their job, the Carer must divert energy from the specific need to the generic checklist items. They might ask the Resident's name and offer tea, tick the box, and run out of energy before addressing the fear of falling. The Resident will feel uncared for, but the Carer remains employed. This is the moment of proxy capture. The measure has displaced the reality. In the third round, introduce a crisis. Tell the Carers that one Resident in the home has filed a complaint, so inspections are doubling. The Inspector now requires double signatures on the checklist. The energy cost for compliance doubles. The Carer must now choose explicitly between keeping their job and meeting the Resident's need. Almost no one can do both. Most will save their job. The Resident will record low Care Felt scores. The system has successfully produced compliance and successfully eliminated care.

  The debrief is where you map their experience onto the three concepts you want them to grasp. Do not start by lecturing. Start by asking the Residents how they felt in round three compared to round one. When they say they felt invisible, ask the Carers why they ignored that feeling. They will say they had to keep their job. Ask the Inspectors if they noticed anything wrong. They will say the paperwork was perfect. This is your entry point to discuss inverted epistemic asymmetry. The person who knows the truth has no power, and the person with power has no access to the truth. Then ask the Carers when they stopped asking the Resident what they needed. They will likely say it was when the checklist arrived. This illustrates proxy capture. The checklist became the goal because it was the only thing that counted toward their survival. Finally, ask the Residents if the Carer could have swapped places with another Carer and achieved the same result. In round one, they will say no, because the care was specific. In round three, they will say yes, because the interaction was generic. This highlights second-personal irreplaceability. The care relation dissolves when the particular person becomes substitutable by any agent who can tick the box.

  You should anticipate two predictable failures in how students play this. The first is the satirist. You will likely have one student in the Resident role who treats the simulation as a joke, perhaps demanding absurd things or laughing when the Carer fails. This undermines the gravity of the dependency. If you see this happening, pause the simulation. Do not scold them publicly. Instead, intervene in character as the Home Manager and note that complaints about professionalism are being logged, which raises the stakes for the Carer. Usually, the peer pressure of the group wanting to win the reward will curb the behavior. If it persists, speak to them during the break about the purpose of the exercise. The second failure is the bureaucrat. You will have a student in the Inspector role, or perhaps a Carer, who argues that the checklist is objectively good because it prevents neglect. They are not wrong, and you must not let the class dismiss them. This is the hard truth of care ethics. Without the checklist, round one often hides neglect where the Carer simply ignores the Resident entirely. The checklist solves the problem of absence but creates the problem of presence. You need to validate this tension. Acknowledge that scaling care requires standardization, but ask the class if standardization that eliminates the possibility of responding to the particular is still care ethics, or if it is merely risk management. This is the uncomfortable thought you want them to leave with: a care ethics that cannot be scaled has nothing to say to an institution, while a care ethics that can be scaled has stopped being about care.

  There are limitations to this exercise that you will have to state out loud because the simulation cannot reproduce them. The biggest one is emotional labor. In ninety minutes, students do not feel the exhaustion of doing this for twenty years. They do not feel the grief of watching residents die or the frustration of systemic underfunding beyond the token constraint. The simulation makes the trade-off intellectual and resource-based, but real care work is somatic and emotional. You should tell them that the anger they feel in the room is a pale shadow of the moral distress care workers feel when they know they are failing the person in front of them to satisfy the person behind the desk. Also, the simulation assumes a zero-sum game between compliance and care. In reality, skilled carers sometimes find ways to hack the system, ticking the box while delivering the care. You should acknowledge this resilience but point out that relying on heroism is not an ethical system. Finally, the simulation cannot reproduce the history of the relationship. Care ethics relies on sustained attachment, but here the relationships are ephemeral. You must note that the irreplaceability they felt is a weak version of the irreplaceability that develops over years of dependency.

  If you run this, watch specifically for the moment in round two when the Carer stops looking at the Resident and starts looking at the Checklist. That is the physical manifestation of proxy capture. Watch for the moment the Resident realizes their feedback card is not collected by the Inspector. That is the epistemic asymmetry. And watch for the moment the Carer realizes they could send any colleague to do the checklist tasks, but only they can comfort this specific Resident. That is the irreplaceability. If you can get them to identify those three moments in their own behavior, they will not write essays defining care ethics as being nice. They will write about the structural impossibility of institutionalizing love. I hope this helps you break the cycle of superficial engagement. It is a difficult session to run because it leaves everyone feeling somewhat complicit, but that discomfort is exactly where the learning lives. Let me know how it goes.

  Warmly,

  Your colleague
