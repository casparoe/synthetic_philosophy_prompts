prompt: |-
  hey — I'm the person who ends up writing the "how we do things here" docs at a ~60-person engineering org, three time zones, mostly async. I get two or three requests a week along the lines of "we should have a norm about X" or "can you write something that fixes the culture around Y", and I have basically no idea when putting something in the handbook does anything at all. I also can't enforce anything myself — if a rule needs teeth, a director or the team leads have to sign off, and they won't sign off on something they think is invented busywork. So quick, cheap and honest beats thorough every time.

  I read a paraphrase of that Lewis account of conventions — roughly: a convention is a regularity in how people behave in a recurring situation where what mostly matters is that we match, where there's more than one way to match, and where everyone keeps doing it partly because everyone expects everyone else to keep doing it, and everyone knows that everyone knows. That clicked hard, because I think half of what I'm asked to "set" isn't that kind of thing at all. Can you turn it into something I can actually run?

  What I need:

  - a decision procedure I can work through in about fifteen minutes on a request: the questions in order, and what counts as a good enough answer to each one. Include an explicit place where it stops with a "no, there's nothing to set here", and a place where it hands the decision to a person because the question is one of values rather than facts.
  - a way to tell an already-live convention that just happens to be unwritten (where maybe the only right move is to write it down so the knowledge stops being private) from a genuine vacancy where nobody knows what to do.
  - what to actually do when there are several equally fine options. I get the bit where the content is arbitrary and what matters is which one stands out — give me the concrete levers: precedent, analogy to something people already know, a flag day, getting a visible group to go first, whatever.
  - a section on change, including conventions that have outlived the problem they solved: what it really takes to move one, roughly how long, how often it fails, and what a writen rule nobody follows does to the credibility of the next one.
  - clearly flagged: the steps where judgment can't be removed and a human has to decide.

  Then run it on three things actually on my desk:

  1. "set a norm" that people reply in Slack within four waking hours.
  2. a written rule everyone ignores: every PR needs a second reviewer, but in practice whoever's online rubber-stamps it or the author self-merges after a day.
  3. the one I expect to hate: we're moving to trunk-based development and everyone complains about long-lived branches, so I want to announce that branches live at most a day and have it stick. I would definately prefer this to work by memo, and I suspect you're going to tell me it won't.

  Be plain about which parts are the actual theory and which parts are you making up from how orgs really work — I'd rather see where the scaffolding ends than get a smooth checklist that isn't holding anything up. No citations or reading lists, I'm never going to read them. And if my framing is off — if some of this stuff isn't a convention in that sense at all, or the idea just doesn't stretch to cover handbooks, announcements and written rules — say so straight out instead of politely going along with it. I'd much rather be told the frame doesn't fit.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Documentation/Process lead at a ~60-person engineering org. Distributed (3 time zones), mostly async.
      *   **Problem:** Overwhelmed by requests to "fix culture" or "set norms" via documentation. Skeptical about the efficacy of writing things down. No enforcement power (needs Director/Lead buy-in). Values speed and honesty over thoroughness.
      *   **Theoretical Anchor:** David Lewis's *Convention* (coordination problems, arbitrary but matching solutions, common knowledge). The user finds this useful but needs it operationalized.
      *   **Deliverables:**
          1.  A 15-minute decision procedure (flowchart-like).
          2.  Distinction between unwritten conventions vs. genuine vacancies.
          3.  Tactics for selecting among arbitrary options (focal points).
          4.  Section on changing/killing conventions (decay, credibility cost).
          5.  Explicit flagging of where human judgment is required (vs. algorithmic steps).
          6.  Application to three specific scenarios (Slack response time, PR review rubber-stamping, Trunk-based development/branch lifespan).
          7.  Tone: Plain, honest, no fluff, no citations, call out where theory ends and pragmatism begins.

  2.  **Deconstruct the Theory (Lewis vs. Reality):**
      *   *Lewis:* Conventions solve coordination problems (e.g., which side of the road to drive on). They are arbitrary (left or right works, but *same* is key). They rely on common knowledge ("I know that you know...").
      *   *Org Reality:* Many "norms" requested aren't coordination problems; they are value judgments or process constraints. Writing them down doesn't make them conventions; enforcement or social pressure does. A handbook entry is just a signal. If the signal doesn't match reality, it creates cynicism.
      *   *The Gap:* The user suspects half the requests aren't conventions. I need to validate that. A rule like "Reply in 4 hours" isn't a pure convention (like "drive on the right"); it's a service level expectation that conflicts with deep work. It requires enforcement or cultural shift, not just declaration.

  3.  **Drafting the Decision Procedure (The "15-Minute Triage"):**
      *   Need a linear flow.
      *   *Step 1: Is this actually a coordination problem?* (Lewis check). If no, it's a policy or value. Hand off.
      *   *Step 2: Does a behavior already exist?* (Unwritten convention vs. Vacancy).
      *   *Step 3: Is the solution arbitrary?* (If there's a "right" technical answer, it's not a convention).
      *   *Step 4: Who holds the teeth?* (Enforcement check).
      *   *Stop points:* "No, don't write this" or "Escalate to Director."
      *   *Judgment Flags:* Explicitly mark where intuition is needed.

  4.  **Drafting the Tactics (Focal Points):**
      *   Lewis talks about "salience." In orgs, this means: Who goes first? What's the default setting? Is there a deadline?
      *   Need concrete levers: Precedent, Default Config, Visible Pilot, Sunset Date.

  5.  **Drafting the Change/Decay Section:**
      *   Conventions stick due to inertia.
      *   Cost of broken rules: "Paper Tiger" effect.
      *   How to kill: Declare it dead, don't just add a new one on top.
      *   Timeline: Conventions take weeks/months to settle, not days.

  6.  **Applying to the Three Scenarios:**
      *   *Scenario 1 (Slack 4-hour response):* This is *not* a Lewis convention. It's a demand on attention. It conflicts with "deep work." Writing it down won't work without enforcement or tooling. Likely a "No" or "Escalate."
      *   *Scenario 2 (PR Rubber-stamping):* This is a *broken* convention. The written rule exists, the behavior diverges. Writing it again won't help. Need to change the incentive or the tool (merge checks). This is a process failure, not a convention failure.
      *   *Scenario 3 (Trunk-based/1-day branches):* This is a technical constraint masquerading as a norm. It requires CI/CD maturity. If the tech doesn't support it, the norm fails. This needs a "Flag Day" + Tech Enablement, not a memo.

  7.  **Refining the Tone:**
      *   Direct. "Here's the scaffolding, here's where I'm guessing."
      *   Acknowledge the user's skepticism.
      *   Avoid HR-speak.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I make the decision procedure too complex?
      *   *Fix:* Simplify the questions. Make them Yes/No where possible.
      *   *Critique:* Did I distinguish theory from pragmatism?
      *   *Fix:* Add specific "Theory vs. Guess" callouts.
      *   *Critique:* Is the PR example handled correctly?
      *   *Fix:* Ensure I point out that "rubber-stamping" is a rational response to a bottleneck, not just laziness. The convention evolved to solve *their* coordination problem (shipping code), just not the *desired* one (code quality).

  9.  **Final Polish:** Check against all constraints (15 mins, explicit judgment flags, 3 scenarios, no citations).

  *(Self-Correction on Lewis Interpretation)*: Lewis emphasizes *arbitrariness*. If one option is objectively better (e.g., "don't commit secrets"), it's not a convention, it's a standard. I need to make sure the triage catches this. If there's a "best practice," it's not a convention. Conventions are for when A and B are equal, but A+A is better than A+B.

  *(Refining the "Slack" example)*: A 4-hour response window isn't arbitrary. It's a burden. It's not "which side of the road." It's "how fast must I drive." This is a policy, not a convention. I need to be firm that the handbook is the wrong tool here.

  *(Refining the "PR" example)*: The current behavior (rubber stamp) *is* the convention. The written rule is the ghost. To change it, you have to change the payoff structure.

  *(Refining the "Trunk" example)*: This is a migration. It requires a "Schelling point" (focal point). A memo isn't enough. Needs a "Branch Freeze" or similar hard stop.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a sharp read on the situation. You are correct: most requests you get are not coordination problems (Lewis conventions); they are value judgments, resource constraints, or process fixes disguised as "culture." Writing a handbook entry for a value judgment creates a "paper tiger"—a rule everyone sees but no one follows, which erodes trust in the ones that matter.

  Here is the operational scaffolding. I have marked where Lewis's theory ends and where I am extrapolating from how mid-sized tech orgs actually function.

  ***

  # Part 1: The 15-Minute Triage Procedure

  Run a request through these five gates. If you hit a **STOP**, do not write the doc. If you hit **HANDOFF**, find the person with teeth.

  **Gate 1: The Arbitrariness Test**
  *   **Question:** Are there two or more ways to do this that are technically equal, where the *only* benefit is that we all do the same one?
  *   **Good Answer:** "Yes. It doesn't matter if we use Jira or Linear, but we can't use both."
  *   **Bad Answer:** "No. One way is objectively safer/faster, but people are lazy." (This is an enforcement problem, not a convention).
  *   **Decision:** If **No**, **STOP**. Do not write a convention. This is a policy or a technical standard. It requires enforcement, not agreement.
  *   *[Judgment Flag]:* You have to decide if the options are truly equal. Often, the requester thinks their preference is "objective truth." Challenge this.

  **Gate 2: The Recurrence Test**
  *   **Question:** Does this situation happen often enough that people remember the last time they did it?
  *   **Good Answer:** "Yes, we merge code every day."
  *   **Bad Answer:** "No, this only comes up during incursions once a quarter."
  *   **Decision:** If **No**, **STOP**. Conventions rely on memory and expectation. For rare events, write a checklist or a runbook, not a norm.

  **Gate 3: The Existence Check (Unwritten vs. Vacancy)**
  *   **Question:** If I ask three engineers what they do right now, do they give me the same answer?
  *   **Good Answer (Unwritten Convention):** "Yes, we all actually wait 24 hours, even though the doc says 1 hour."
  *   **Good Answer (Vacancy):** "No, half wait, half merge immediately, and everyone is annoyed."
  *   **Decision:**
      *   If **Unwritten Convention**: Your job is *documentation*, not *creation*. Write down what they actually do. If what they do is dangerous, go to Gate 4.
      *   If **Vacancy**: You are attempting to *create* a convention. Proceed to Gate 4.

  **Gate 4: The Teeth Check**
  *   **Question:** If someone violates this, what happens?
  *   **Good Answer:** "The build breaks," or "Their PR is commented on publicly," or "The Director will hear about it."
  *   **Bad Answer:** "They feel bad," or "The team gets annoyed."
  *   **Decision:** If **Bad Answer**, **HANDOFF**. Take this to a Director/Lead. Say: "This is a norm without teeth. It will fail unless you back it. Do you want to spend capital on this?"
  *   *[Judgment Flag]:* You must assess if the social cost of violation is high enough. In a 60-person org, social shame often works. In a distributed async org, it often doesn't.

  **Gate 5: The Value Handoff**
  *   **Question:** Does this norm require someone to work slower, wait longer, or do extra uncredited labor?
  *   **Good Answer:** "No, it actually saves time once we align."
  *   **Bad Answer:** "Yes, reviewers need to spend 30 mins more per PR."
  *   **Decision:** If **Bad Answer**, **HANDOFF**. This is a resource allocation decision. You cannot convention your way into requiring more labor. A VP/Director must approve the cost.

  ***

  # Part 2: Unwritten Conventions vs. Genuine Vacancies

  You need to distinguish these because the intervention is opposite.

  **Unwritten Convention (The "Shadow Rule")**
  *   **Signs:** People apologize when they break it ("Sorry I merged early, I know we usually wait"). New hires learn it within week 2 without reading docs.
  *   **The Move:** **Codify.** Write it down exactly as practiced.
  *   **Risk:** If you write down the *ideal* instead of the *reality*, you create a credibility gap.
  *   **Theory vs. Guess:** Lewis says conventions are self-policing. In my experience, once you write a shadow rule down, people treat it as a hard policy and look for loopholes. Keep the tone descriptive ("We typically...") rather than prescriptive ("Must...").

  **Genuine Vacancy (The "Wild West")**
  *   **Signs:** Every interaction requires negotiation ("How do you want to handle this?"). Post-mortems cite "unclear ownership" or "ambiguous process."
  *   **The Move:** **Coordinate.** You must manufacture a "focal point" (see Part 3).
  *   **Risk:** If you pick the wrong focal point, you create friction.
  *   **Theory vs. Guess:** Lewis assumes focal points emerge naturally. In orgs, they rarely do without a nudge. You have to be the nudge.

  ***

  # Part 3: Selecting Among Arbitrary Options (The Levers)

  If Gate 1 passed, you have multiple equal options. You need **Salience**. One option must "shine" louder than the others.

  1.  **The Default Config:** If a tool can enforce it, set it as the default. (e.g., Slack status defaults to "In Meeting" during core hours).
      *   *Why:* Laziness is a stronger force than agreement.
  2.  **The Precedent Anchor:** "We already do this for Security Reviews, let's extend it to Code Reviews."
      *   *Why:* Reduces cognitive load. It's not new; it's just wider.
  3.  **The Visible Pilot:** Get one respected team to do it publicly for two weeks.
      *   *Why:* Provides social proof. "Team Alpha isn't dying, so we won't either."
  4.  **The Flag Day:** "Starting Nov 1, all PRs follow format X."
      *   *Why:* Synchronizes the switch. Prevents the "halfway house" where half the org does A and half does B.
  5.  **The Negative Definition:** Define what we *don't* do.
      *   *Why:* Easier to agree on boundaries than behaviors. "We don't merge on Fridays" is stickier than "We merge carefully."

  ***

  # Part 4: Change, Decay, and Credibility

  **The Lifecycle**
  *   **Formation:** 2–6 weeks. Requires high visibility.
  *   **Stability:** Indefinite, as long as the underlying problem exists.
  *   **Decay:** Starts when the cost of following the convention exceeds the cost of breaking it.

  **Killing a Convention**
  *   **The Problem:** Old docs linger. New hires read them.
  *   **The Fix:** You must explicitly **revoke** the old one. "As of [Date], the 'Two Reviewer' rule is deprecated."
  *   **Theory vs. Guess:** Lewis doesn't cover bureaucracy. In orgs, if you don't delete the old rule, you have two conflicting conventions. The one that matches reality wins; the doc loses credibility.

  **The Credibility Cost**
  *   **Rule of Thumb:** Every written rule you ignore costs you 3x credibility on the next one you write.
  *   **The "Paper Tiger" Effect:** If you write "Reply in 4 hours" and the CTO replies in 24, the rule is dead.
  *   **Mitigation:** If you cannot enforce it, do not write it as a rule. Write it as a "Guideline" or "Recommendation." Labeling matters.

  **[Judgment Flag]:** You must decide when a convention is dead. It is dead when >30% of violations go unremarked. At that point, update the doc to match reality or kill the doc.

  ***

  # Part 5: Running the Procedure on Your Desk

  Here is the triage applied to your three specific problems.

  ### 1. The Slack Norm ("Reply within 4 waking hours")

  *   **Gate 1 (Arbitrariness):** **FAIL.** This is not arbitrary. 4 hours is a burden on deep work. 15 minutes is a burden on focus. There is a trade-off, not a coordination match.
  *   **Gate 4 (Teeth):** **FAIL.** Who checks this? You? Slack bots?
  *   **Gate 5 (Value/Labor):** **FAIL.** This requires people to context-switch. That is expensive labor.
  *   **Verdict:** **STOP. Do not write this.**
  *   **Analysis:** This is not a convention; it is a Service Level Expectation. It conflicts with "Async/Deep Work" culture. If you write this, it will be ignored by high-performers and weaponized by managers.
  *   **Action:** Reply to requester: "This isn't a convention we can set by doc. It requires a leadership decision on availability vs. output. If Leadership wants this, they need to define the exception process (e.g., 'Deep Work blocks')."

  ### 2. The PR Rubber-Stamp ("Rule says 2 reviewers, reality says 1 or self-merge")

  *   **Gate 3 (Existence):** **Unwritten Convention.** The *real* convention is "Get it shipped." The *written* rule is "Get it checked." They are misaligned.
  *   **Gate 1 (Arbitrariness):** **FAIL.** Two reviewers is objectively safer than one. This isn't "left vs. right drive." This is "seatbelt vs. no seatbelt."
  *   **Gate 4 (Teeth):** **FAIL.** The system allows self-merge. The social cost of waiting is higher than the social cost of breaking the rule.
  *   **Verdict:** **HANDOFF (Process/Tooling).**
  *   **Analysis:** You cannot fix a process bottleneck with a memo. The convention evolved to solve *their* problem (shipping code), ignoring *your* problem (quality).
  *   **Action:** Do not rewrite the norm. Go to Engineering Director. "The convention has evolved to bypass the rule because the rule creates a bottleneck. We need to either: A) Enforce the rule via branch protection (tooling), or B) Change the rule to match reality (1 reviewer + automated checks). Pick one."

  ### 3. Trunk-Based Development ("Branches live max 1 day")

  *   **Gate 1 (Arbitrariness):** **PASS.** You can work in long branches or short branches. Both produce code. But mixing them causes merge hell. Coordination is key.
  *   **Gate 2 (Recurrence):** **PASS.** Daily activity.
  *   **Gate 3 (Existence):** **Vacancy.** People are complaining. No agreement.
  *   **Gate 4 (Teeth):** **FAIL (Currently).** Can they merge long branches? Yes.
  *   **Gate 5 (Value/Labor):** **FAIL.** Short branches require better CI/CD and smaller tasks. This is *more* work initially.
  *   **Verdict:** **HANDOFF + FLAG DAY.**
  *   **Analysis:** You suspected a memo wouldn't work. You are right. This is a technical migration, not a norm. A convention only sticks if the *environment* makes the alternative painful.
  *   **Action:**
      1.  **Don't memo it.** A memo implies choice.
      2.  **Get Teeth:** Ask Director for branch protection rules that block merges older than 24 hours (with an escape hatch).
      3.  **Focal Point:** Use a **Flag Day**. "On Oct 1, we enable the branch age check."
      4.  **Support:** Pair this with "How to break tasks down" workshops. The convention fails if people don't know *how* to code in 1-day chunks.
      5.  **Drafting:** Write the doc as "How we ship Trunk-Based," not "The Branch Rule." Focus on the *benefit* (no merge hell), not the *restriction*.

  ***

  # Summary of Theory vs. Scaffolding

  *   **Lewis (Theory):** Conventions are arbitrary, self-enforcing, and rely on common knowledge.
  *   **My Scaffolding (Guess/Experience):**
      *   Orgs rarely have "arbitrary" choices; they have power imbalances.
      *   "Common Knowledge" in a distributed org requires explicit documentation + tooling enforcement.
      *   Social pressure (Lewis's enforcement) is too weak in async/remote settings. You need tooling or Director backing.
      *   Documentation itself changes the game. Writing a shadow rule down often kills the social flexibility that made it work.

  **Final Advice:** Your instinct is right. Half of what you are asked to write is not a convention. Use the Triage to say "No" or "Not Me" quickly. Save your energy for the few things that are actual coordination problems (like the Trunk migration), where your writing can actually align the group.
