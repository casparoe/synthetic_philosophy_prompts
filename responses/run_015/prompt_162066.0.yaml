answer: |-
  ### Metaphor Endorsement

  To satisfy the requirement of literal truth rather than *façon de parler*, the theory must endorse the **Code** metaphor, specifically a **Digital Transmission Code**, while explicitly rejecting **Blueprint**, **Law**, and unqualified **Template**.

  *   **Why Code:** A code implies a mapping rule between a vehicle (nucleotide sequence) and a referent (amino acid/functional RNA) that is mediated by a decoding mechanism (ribosome/tRNA). This allows for the separation of the message from the physical chemistry of the vehicle, which is necessary to distinguish DNA from mere causal factors.
  *   **Why not Blueprint:** Blueprints imply a spatial isomorphism between the plan and the structure. DNA does not map spatially to the phenotype; it maps temporally and chemically.
  *   **Why not Law:** Laws are universal and exceptionless. Biological information is contingent, noisy, and context-dependent.
  *   **Why not (mere) Template:** Templating (as in prions or replication) relies on physical complementarity. While DNA *is* templated during replication, its role in translation is coded. Conflating the two fails to distinguish DNA from prions.

  ---

  ### Desiderata for a Literal Theory of Genetic Information

  The following requirements distinguish a theory that treats information as a real, causal property of the DNA sequence from one that treats it as a heuristic for human observers.

  #### 1. The Arbitrariness Condition (Non-Negotiable)
  **Specification:** The relationship between the signifier (codon) and the signified (amino acid) must not be determined solely by stereochemical necessity or physical law. There must be a contingent mapping rule.
  **Case Handled:** *Degeneracy and Variants.* If the mapping were physically necessary (like a key in a lock), variants (organellar reassignments, stop-codon recoding) would be impossible. The existence of "dialects" of the genetic code proves the mapping is a convention maintained by the cellular machinery, not a law of physics.
  **Justification:** Without arbitrariness, "information" collapses into "physical causation." If codon X *must* bind amino acid Y by chemical affinity, there is no code, only chemistry. To claim DNA carries information literally, the link must be mediated, not direct.

  #### 2. The Digital Discreteness Condition (Non-Negotiable)
  **Specification:** The information-bearing vehicle must consist of discrete, combinatorial units that are insensitive to the physical magnitude of the signal during transmission.
  **Case Handled:** *Redistribution Critique (Methylation/Gradients).* Cytoplasmic gradients and methylation marks are often analog or continuous variables. DNA sequence is digital (A, C, G, T). Digital signals can be copied with high fidelity independent of the substrate's mass or concentration.
  **Justification:** This excludes niche features and most maternal gradients from counting as "genetic information." They are causal parameters, but they lack the copy-fidelity and discrete combinatorial capacity required for evolutionary information storage.

  #### 3. The Normativity Condition (Non-Negotiable)
  **Specification:** The theory must define a "correct" state distinct from the "actual" state, allowing for the literal possibility of error (mutation, misincorporation) rather than mere physical variation.
  **Case Handled:** *Sequence vs. Outcome Gap.* A frameshift or misincorporation is not just a different physical outcome; it is a *mistake* relative to the encoded instruction.
  **Justification:** In pure physics, everything that happens is "correct" relative to the laws of motion. Information requires a normative standard (the sequence intended vs. the sequence executed). If a theory cannot distinguish a mutation from a variation, it cannot account for information.

  #### 4. The Decoding Mechanism Condition (Preference)
  **Specification:** The theory must identify a distinct physical subsystem responsible for interpreting the code, separate from the code itself.
  **Case Handled:** *Prions vs. DNA.* Prions template their own conformation directly onto new proteins. DNA requires the ribosome and tRNA synthetases to be interpreted.
  **Justification:** This strengthens the "Code" metaphor. However, it is marked as a Preference because some theories (e.g., stereochemical theories of origin) might argue the decoder evolved *from* the code, blurring the line. A literal theory prefers the distinction but might survive without it if Arbitrariness is maintained.

  #### 5. The Context-Independence of Vehicle Condition (Preference)
  **Specification:** The identity of the message must remain stable across different cellular contexts, even if the phenotypic outcome varies.
  **Case Handled:** *Genome/Gene Gap (Splicing/Imprinting).* The sequence `ATG...` remains the same message whether it is spliced into isoform A or B, or imprinted by the father. The *interpretation* changes, but the *message* does not.
  **Justification:** This defends DNA against the Developmental Systems critique. If the message identity shifts with every context, information is redistributed to the context. Maintaining vehicle stability keeps the information localized to the DNA, even if the *effect* is distributed.

  ---

  ### The Unsatisfiable Pair

  **Vehicle Specificity** vs. **Interpretive Plasticity**

  *   **Vehicle Specificity:** To defeat the parity argument, the theory must claim DNA is the *unique* or *privileged* carrier of information (satisfying Desiderata 2 & 5).
  *   **Interpretive Plasticity:** To account for biological reality (alternative splicing, imprinting, tissue-specific expression), the theory must admit that the "meaning" of the sequence is determined by the cellular context (the spliceosome, methylation status, transcription factors).

  **The Conflict:** If the meaning is determined by the context (Plasticity), then the DNA sequence alone does not carry the full "information" required to build the trait; the context carries the decoding key. If the context carries the key, the parity argument resurfaces: why is the message privileged over the key? To maintain Vehicle Specificity, one must argue the sequence contains the *potential* for all interpretations, but this stretches the definition of "message" to include possibilities that are never actualized. To maintain Plasticity, one must concede that "information" is a property of the *system*, not the DNA, undermining the chapter's goal of validating DNA-centric information talk.

  **Where the reasoning is likely to fail:** The attempt to locate the "key" entirely within the cellular machinery while claiming the "lock" (DNA) holds the information. In many cases (e.g., maternal effect genes), the "key" is physically located in the cytoplasm of the egg, not the zygotic DNA.

  ---

  ### The Most Exclusionary Requirement

  **The Normativity Condition (Desideratum 3).**

  This requirement does the most work in excluding candidates, particularly Developmental Systems Theory (DST) and pure causal-manipulation accounts. DST tends to view development as a web of causal interactions where "mutation" is just another causal variation. If there is no normative standard (no "wild type" or "intended sequence" against which errors are measured), there is no information, only dynamics. By insisting that a theory of biological information must account for *error* (not just difference), you exclude any account that reduces biology to pure physics or sociology of scientific practice. It forces the theory to explain *why* a C-to-T transition is a loss of information, not just a change in state.

  ---

  ### Defeaters: What Would Change My Mind

  #### 1. Demoting the Arbitrariness Condition (NN → P)
  **The Finding:** A comprehensive stereochemical demonstration showing that *all* 64 codon assignments are determined by direct physicochemical affinity between RNA triplets and amino acids (or their precursors), with no historical contingency.
  **The Reasoning:** If the mapping is physically necessary (like the shape of a key fitting a lock), the "Code" metaphor collapses into the "Template" or "Lock-Key" metaphor. "Information" in the Shannon/Semantic sense relies on the selection of one option among possibilities. If physics dictates the pairing, there is no selection, hence no information. I would have to accept that DNA is a *template* or *mold*, not a code, and rewrite the chapter to argue that "information" is a category mistake in molecular biology, replaced by "specific causation."

  #### 2. Resolving the Unsatisfiable Pair (Vehicle Specificity vs. Plasticity)
  **The Argument:** A formal information-theoretic model (e.g., using Integrated Information Theory or specific causal decomposition metrics) that quantitatively partitions "information" between the DNA sequence and the cellular context, showing that >50% of the specificity for phenotypic traits resides in the *context* (methylation, cytoplasm, niche) rather than the sequence.
  **The Reasoning:** My current reasoning assumes that "information" must be localized to the DNA to be useful for the monograph's argument. If a rigorous mathematical framework demonstrates that causal specificity is objectively higher in the cytoplasmic gradients than the DNA sequence for key developmental outcomes, my insistence on Vehicle Specificity becomes ideological rather than empirical. I would have to drop the claim that DNA is the *primary* information carrier and shift to a "Distributed Information" model, conceding the core point of the parity argument.

  #### 3. The Prion Counter-Example
  **The Finding:** Discovery of a widespread biological system where heritable phenotypic variation is transmitted via protein conformation (prion-like) *without* nucleic acid change, yet exhibits the same fidelity and evolutionary adaptability as DNA-based systems.
  **The Reasoning:** If prion-like templating can sustain open-ended evolution and complex adaptation without a digital code, the **Digital Discreteness Condition** loses its status as a requirement for *biological* information. It would suggest that "information" is substrate-neutral. I would have to broaden the definition to include analog templating, which weakens the specific defense of DNA as a unique informational molecule.
