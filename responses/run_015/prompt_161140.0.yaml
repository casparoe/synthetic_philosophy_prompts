answer: |-
  # Stage 1: Brainstorming and Rejections

  **Candidate Cases Considered**
  1.  **The Irish Potato Famine (1845–1852):** *Phytophthora infestans* vs. British policy/land structure.
  2.  **The Black Death (1347–1351):** *Yersinia pestis* vs. medieval labor markets/religious response.
  3.  **Tambora Eruption (1815) / Year Without a Summer:** Volcanic ash vs. agricultural adaptation/migration.
  4.  **1918 Influenza Pandemic:** Virus vs. war censorship/public health measures.
  5.  **French Panama Canal Failure (1880s):** Mosquitoes vs. engineering/medical ignorance.

  **Obvious-But-Wrong Opening Moves**
  1.  **Defining "Agency" Philosophically:** Starting with a definition of agency from philosophy of action.
      *   *Rejection:* First-years will treat this as abstract vocabulary memorization. It disconnects from the historical narratives they know. It invites the "intentionality" trap immediately.
  2.  **Leading with the Two-Sentence Rule:** Presenting the rule as a checklist before they understand the problem it solves.
      *   *Rejection:* Students will treat it as a formatting constraint ("I need two sentences") rather than a causal tool. They won't understand *why* the uptake sentence matters until they see a explanation fail without it.
  3.  **Starting with the Black Death:** Using the plague as the primary example.
      *   *Rejection:* The scale is too totalizing. It is too easy for students to slide into "the plague killed everyone, therefore it determined everything." The human uptake (labor shortages, flagellants) looks like a reaction to inevitability rather than a contingent variable. It makes distinguishing "relevant" from "determining" nearly impossible in 50 minutes.
  4.  **Starting with Tambora:** Using climate shock.
      *   *Rejection:* The mechanism chain is too long (ash -> stratosphere -> temperature -> crop -> price -> riot). Students will get lost in the science or treat the climate as a backdrop rather than an actor. It lacks a sharp institutional uptake point comparable to land law or medical policy.

  **Reasoning for Selected Path**
  I am rejecting the Black Death and Tambora because they encourage environmental determinism in novices. The scale overwhelms the human variable. I am selecting the Irish Potato Famine (with European contrast) because the pathogen is identical across borders, but the outcome (famine vs. crop failure) varies sharply based on human uptake. This isolates the variable I need them to see. I am rejecting the 1918 Flu because the war context complicates the "uptake" (censorship vs. care) in ways that distract from the causal structure. The Panama Canal is reserved for the assessment because it is unfamiliar enough to prevent rote memorization of the lecture content.

  **Pressure-Testing the Two-Sentence Rule**
  *   *Does it work?* Yes. It forces the student to bridge the gap between "thing happened" and "people responded."
  *   *Does it need a third sentence?* No. A third sentence (e.g., a counterfactual) adds cognitive load that risks collapsing the distinction between mechanism and uptake. The "Uptake" sentence must bear the weight of contingency.
  *   *Sharpening:* The "Uptake" sentence must explicitly allow for *alternative action*. It cannot simply say "people starved." It must say "authorities chose X instead of Y."
  *   *Timing:* It must be introduced *after* the concept of non-human causation is legitimized but *before* they attempt to write history. If introduced too early, it is grammar. If introduced too late, they have already written determinist narratives.

  ***

  # Stage 2: Teaching Plan

  ## 1. Order and Dependency

  **Phase 1: The Intentionality Trap (0–10 minutes)**
  *   **Activity:** Write "The germ killed the farmer" on the board. Ask: "Did the germ intend to kill the farmer?" When they say no, ask: "Did the germ cause the death?" When they say yes, ask: "Can something be a cause without a plan?"
  *   **Dependency:** This *must* occur first. If you introduce the Two-Sentence Rule before breaking the link between "actor" and "intention," students will write mechanism sentences that attribute goals to pathogens (e.g., "The germ sought to spread"). You cannot license "actor-talk" for non-humans until you have decoupled agency from intentionality.
  *   **Goal:** Defuse the reflex that agency requires a mind. License the word "actor" for non-humans.

  **Phase 2: The Determinism Slip (10–20 minutes)**
  *   **Activity:** Present the claim: "The blight caused the Famine." Ask: "If the blight was the cause, could anything have stopped the Famine?" Guide them to see that if the answer is "no," they are describing determinism, not history.
  *   **Dependency:** This depends on Phase 1. Once they accept the germ is an actor, they will tend to make it the *only* actor. You must separate "causally relevant" from "sole determining cause" before giving them the tool to fix it. If you introduce the Rule before this, they will write uptake sentences that are merely descriptive ("people died") rather than contingent ("people could have imported grain").
  *   **Goal:** Establish that non-human causation does not erase human contingency.

  **Phase 3: Introducing the Two-Sentence Rule (20–30 minutes)**
  *   **Activity:** Present the rule.
      1.  *Mechanism:* How the non-human entity made a causal difference (pathway).
      2.  *Uptake:* What human agents did, failed to do, or could have done differently to turn that difference into the specific outcome.
  *   **Dependency:** This depends on Phases 1 and 2. The rule is the solution to the problems raised in 1 and 2. If placed earlier, it is arbitrary syntax. If placed later, students have already practiced incorrectly.
  *   **Goal:** Provide the structural constraint that prevents both metaphorical emptiness and determinism.

  **Phase 4: Guided Application (The Carrying Case) (30–45 minutes)**
  *   **Activity:** Apply the rule to the Irish Potato Famine vs. European Crop Failure.
  *   **Dependency:** Depends on Phase 3. Students need the rule to analyze the case correctly.
  *   **Goal:** Demonstrate the rule in action. Show how the same non-human actor yields different outcomes based on uptake.

  **Phase 5: The Check (45–50 minutes)**
  *   **Activity:** Transfer task (see Section 4).
  *   **Dependency:** Depends on Phase 4. Requires them to have internalized the rule enough to apply it to a new context.
  *   **Goal:** Verify retention and transfer.

  ## 2. The Carrying Case

  **Verdict:** The Irish Potato Famine (1840s) is the correct carrier, provided you manage the contrast carefully.

  **Why it fits the criteria:**
  *   **Localized/Legible Non-Human:** *Phytophthora infestans* is a specific pathogen, not a vague "climate shift."
  *   **Recognizable Uptake:** Land tenure systems, export policies, and relief works are institutional human actions students can grasp without specialist economics.
  *   **Contrast Available:** The blight hit Continental Europe too, but did not produce mass mortality on the same scale. This allows you to hold the non-human constant while varying the human uptake.
  *   **Scale:** It is catastrophic enough to matter, but specific enough not to look like "the end of the world" (unlike the Black Death).

  **Why the alternatives are traps:**
  *   **The Black Death:**
      *   *Makes Easy:* Showing a pathogen matters.
      *   *Makes Impossible:* Showing human uptake mattered. The mortality rate was so high it obscures human variation. Students will inevitably slide into "the plague decided everything." It reinforces the determinism you are trying to break.
  *   **Tambora (1815):**
      *   *Makes Easy:* Showing a non-human shock.
      *   *Makes Impossible:* Writing a clean Mechanism sentence. The chain (ash -> climate -> crop -> market -> hunger) is too long for a 50-minute intro. Students will get stuck on the science or treat the volcano as a backdrop rather than an actor.
  *   **1918 Influenza:**
      *   *Makes Easy:* Showing a pathogen.
      *   *Makes Impossible:* Isolating uptake. The war context (troop movements, censorship) is so entangled with the virus spread that students will struggle to separate "what the virus did" from "what the army did." It conflates mechanism and uptake.

  **Instruction for Use:**
  Do not spend time on the biology of the blight. State it killed the potato. Spend the time on the *contrast*. Why did Ireland starve while Belgium suffered crop loss but not mass death? The difference is the uptake (export of grain from Ireland vs. retention in Belgium; land tenure vs. peasant ownership). This proves the blight was causally relevant but not determining.

  ## 3. The Misconception Map

  **Misconception 1: Agency Requires Intention**
  *   *When it forms:* Phase 1 (immediately upon hearing "non-human actor").
  *   *The Error:* "If the germ is an actor, it must have wanted to kill." OR "If it didn't want to kill, it's just a thing, not an actor."
  *   *The Fix:* Board move: Write "Actor = Makes a Difference." Cross out "Actor = Has a Plan."
  *   *Phase:* Phase 1.

  **Misconception 2: The Decoration Trap**
  *   *When it forms:* Phase 2 (when discussing human response).
  *   *The Error:* "The blight caused the famine, and then people reacted." (Human action is just aftermath, not part of the cause).
  *   *The Fix:* The Uptake Sentence requirement. If the sentence doesn't show how human action *completed* the causal chain, it is invalid.
  *   *Phase:* Phase 3 (Rule Introduction).

  **Misconception 3: The Determinism Slide**
  *   *When it forms:* Phase 2/4 (when discussing the outcome).
  *   *The Error:* "Given the blight, the famine was inevitable." (Collapses relevant into determining).
  *   *The Fix:* The Contrast Case. Show the blight existed elsewhere without the famine. Ask: "What was different?"
  *   *Phase:* Phase 4 (Guided Application).

  **Misconception 4: The Sufficiency/Necessity Confusion**
  *   *When it forms:* Phase 4 (after the contrast is shown).
  *   *The Error:* "Since the blight didn't cause famine in Belgium, the blight didn't matter in Ireland." (Slides from "not sufficient" to "not necessary/relevant").
  *   *The Fix:* Explicitly state: "The blight was necessary but not sufficient." Use the board to draw a circle for "Blight" and a circle for "Policy." The overlap is "Famine."
  *   *Phase:* Phase 4 (Guided Application).

  **Additional Predictable Misconception: The Metaphor Dismissal**
  *   *When it forms:* Phase 1 or 3.
  *   *The Error:* "Calling the germ an actor is just poetry."
  *   *The Fix:* The Mechanism Sentence. If you can write the physical pathway (rotting tuber -> no food -> hunger), it is not poetry, it is mechanism.
  *   *Phase:* Phase 3 (Rule Introduction).

  ## 4. The Check

  **The Task:**
  Put the following on the board:
  *"The French failed to build the Panama Canal because the mosquitoes defeated them."*

  **Instruction:**
  "Diagnose this sentence. Is it history or poetry? Using the Two-Sentence Rule, rewrite this explanation on a scrap of paper. You have 3 minutes."

  **Correct Answer:**
  *   **Diagnosis:** It is incomplete/poetic because it attributes agency ("defeated") without mechanism or uptake.
  *   **Rewrite (Mechanism):** *Anopheles* mosquitoes transmitted yellow fever and malaria to the workforce, causing high mortality and absenteeism.
  *   **Rewrite (Uptake):** French engineers failed to identify the vector and continued to house workers in stagnant water areas, whereas later American engineers drained the swamps and screened the housing.
  *   *Key Element:* The uptake must show contingency (the French *could have* done what the Americans did, or did something specific that worsened the mechanism).

  **Superficially Correct Answer (That Does Not Count):**
  *   **Rewrite:** The mosquitoes carried disease which killed the workers. The French workers died and could not dig.
  *   **Why it fails:** The uptake sentence is empty. "Workers died" is part of the mechanism, not the human uptake. It lacks the *decision* or *institutional failure* element. It slides back into determinism (mosquitoes killed, therefore failed). It does not show what humans *did* to turn the disease into a project failure.

  ## 5. Refusals

  **What to Decline:**
  1.  **Metaphysics of Agency:** Do not explain *what* agency really is in a philosophical sense.
      *   *Say:* "We are not solving philosophy today. We are solving how to write history that doesn't accidentally claim germs have plans."
  2.  **Formal Causation:** Do not discuss necessary vs. sufficient conditions using formal logic notation.
      *   *Say:* "We are looking for what made the difference, not building a logic proof."
  3.  **Biological/Climatological Detail:** Do not explain the life cycle of the blight or the chemistry of volcanic ash.
      *   *Say:* "The science is the mechanism, but we don't need the textbook details. We need the pathway to the human outcome."
  4.  **Named Theoretical Frameworks:** Do not mention "Actor-Network Theory," "Materialism," or "Environmental Determinism" by name.
      *   *Say:* "These are labels for later. Right now, we are building sentences."

  **When Pressed:**
  If a student asks, "But does the germ really have agency?"
  *   *Response:* "If you can write the Mechanism Sentence, it acts. If you can write the Uptake Sentence, it doesn't decide. That is all the history worker needs."
