      *Specific thought on Carrying Case:* The Irish Famine is risky because students often come in with "It was genocide" or "It was just nature." I need to ensure the contrast case (Europe) is ready to deploy immediately to show the *variable* human uptake.

      *Let's finalize the Brainstorming section.* It needs to list cases considered, wrong moves, and rejections.
