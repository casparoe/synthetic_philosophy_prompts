      *Refining the "Two-Sentence Rule" advice:* The user suspects it has to arrive before turning them loose. I agree. But it must arrive *after* they feel the need for it. So: Problem -> Case (messy) -> Rule (tool) -> Case (clean). Or: Concept -> Rule -> Case. Given 50 mins, Concept -> Rule -> Case is tighter. But better: Mini-Case (intuition pump) -> Rule -> Main Case.
