      *   **Topic:** Distinguishing between non-human causal relevance, determinism, and narrative agency (without attributing intention).
      *   **Specific Device:** A "two-sentence rule" (Mechanism Sentence + Uptake Sentence).
      *   **Constraints:**
          *   Two stages: 1. Brainstorming (candidate cases, wrong moves, rejections), 2. Teaching Plan.
          *   Do not explain the concept to the user (assume they know it).
          *   Do not give reading lists/bibliographies/citations.
          *   Name and reject alternatives (show reasoning).
          *   Focus on dependency structure (order matters).
          *   Address the "Two-Sentence Rule" (pressure test it).
          *   Address the "Carrying Case" (Irish Potato Famine vs. others).
          *   Address Misconception Map.
          *   Address Final Check (transfer task).
          *   Address Refusals (what *not* to teach).
      *   **Audience:** First-year undergrads, no philosophy/science background, comfortable with basic narrative history sentences.
      *   **Goal:** Students can hold apart: causal relevance vs. determining cause vs. narrative character (without intention).

  2.  **Stage 1: Brainstorming (Mental Simulation & Drafting):**
      *   *Candidate Cases:*
          *   Irish Potato Famine (Phytophthora infestans): Strong candidate. Clear non-human agent, clear human policy failure (Corn Laws, relief), clear contrast (Europe vs. Ireland). Risk: Political sensitivity, potential oversimplification of "British malice" vs. "structural failure."
          *   Black Death (Yersinia pestis): Too big? Often leads to "everything changed" determinism. Hard to isolate specific human uptake in a 50-min session without getting bogged in medieval economics.
          *   Tambora (1815): Good for climate, but "Year Without a Summer" effects are diffuse. Hard to pinpoint specific "uptake" sentences that aren't just "people starved."
          *   Panama Canal (Mosquitoes): Good for specific human failure (French vs. US approach), but requires explaining germ theory briefly which might distract.
          *   1918 Flu: Too modern? Complex war context.
      *   *Obvious-but-Wrong Opening Moves:*
          *   Defining "agency" philosophically first. (Too abstract, kills engagement).
          *   Starting with the Two-Sentence Rule immediately. (Students won't know *why* they need it).
          *   Starting with the Irish Famine narrative without setting up the conceptual problem. (They will default to "British evil" or "Nature cruel" binaries).
          *   Letting students debate "Was it genocide?" (Sidetracks into morality, not causal structure).
      *   *Reasons for Rejection:*
          *   Philosophy first bores them.
          *   Rule first feels arbitrary.
          *   Famine narrative first reinforces existing simplistic causal models.
      *   *Pressure-Testing the Two-Sentence Rule:*
          *   Does it work? Yes, it forces mechanism (how) and uptake (human response).
          *   Does it need sharpening? Maybe ensure "uptake" isn't just "people died." It needs to be "people did X which turned potential into actual."
          *   Third sentence? Maybe a "counterfactual" sentence? No, keep it simple for 50 mins. Two is enough if strict.
          *   Timing: Must come *after* the problem is felt but *before* they practice.
      *   *Dependency:* Need to break the "agency = intention" link before introducing the rule. Need to establish "causal relevance vs. determinism" before applying the rule.

  3.  **Stage 2: Developing the Plan (incorporating constraints):**
      *   *Section 1: Order and Dependency.* Needs to be rigid. Concept -> Case -> Rule -> Practice.
      *   *Section 2: Carrying Case.* Evaluate Irish Potato Famine. It fits the criteria (localized pathogen, institutional uptake, contrast available). Why not Black Death? Too totalizing. Why not Tambora? Too diffuse. Why not 1918 Flu? Too entangled with WWI narrative.
      *   *Section 3: Misconception Map.* Map the specific errors (Intentionality, Determinism, Equivocation on "Cause", Sufficiency vs. Necessity).
      *   *Section 4: The Check.* Needs to be a transfer task. Panama Canal is good because it's distinct from Famine but same structure (mosquitoes vs. policy).
      *   *Section 5: Refusals.* Explicitly list what to avoid (Metaphysics, Formal Causation, Biology details, Theory names).

  4.  **Refining the Two-Sentence Rule:**
      *   User's rule: Mechanism (how it made difference) + Uptake (what humans did/failed to do).
      *   Critique: It's strong. It prevents "The volcano caused the revolution" (missing uptake) and "The volcano erupted, then people revolted" (missing mechanism).
      *   Modification: Ensure "Uptake" emphasizes *contingency*. "Could have done differently."
      *   Placement: After the conceptual distinction is made, before the practice.

  5.  **Refining the Carrying Case (Irish Potato Famine):**
      *   Pros: Familiar, clear pathogen, clear policy contrast (Ireland vs. Europe/England).
      *   Cons: Politically charged.
      *   Verdict: Keep it, but manage the politics carefully. Focus on *structural* uptake (Corn Laws, relief works) rather than moral intent.
      *   Alternatives rejection:
          *   Black Death: Makes non-human cause look too omnipotent (determinism trap).
          *   Tambora: Mechanism is hard to specify in 5 mins (ash -> climate -> crop -> society). Too many links.
          *   1918 Flu: War censorship complicates "uptake."

  6.  **Drafting the Content (adhering to style):**
      *   Tone: Professional, pedagogical, direct.
      *   Structure: Brainstorming first (visibly distinct), then Plan (1-5).
