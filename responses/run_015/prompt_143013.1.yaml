  I am curating a conceptual dataset that asks language models to reason from first principles rather than recall familiar examples, and I should be grateful if you would design a tailored thought experiment for me. The subject is costly signaling—specifically the Spence-style strategic model in which agents bear arbitrary costs to separate types—and the handicap principle in Zahavi's evolutionary formulation, in which a signal is honest precisely because it is a direct, differentially costly handicap on the very quality being advertised. I want you to build a realistic, non-fictional scenario, confined to a single paragraph and situated in a professional guild or workplace rather than in any speculative or physical-science setting, in which these two accounts yield contrary predictions about the fate of a wasteful apprenticeship ritual once a cheap, technically perfect substitute becomes available.

  The design should work as follows. Costly signaling theory ought to predict that rational agents abandon the ritual, since employers can now observe competence directly through the certified output of the substitute. By contrast, the handicap principle ought to predict persistence, or even intensification, because the ritual involves enduring physical strain and repetitive-risk injury that are not arbitrary expenses but direct handicaps indexing long-term resilience and monotony tolerance—traits that employers genuinely require and that the substitute, being process-invisible, cannot display. To isolate this divergence, you must embed a structural feature I shall call the transparency trap: the substitute renders the final work product fully observable and verifiable to all observers, while making the production process entirely opaque. After presenting the scenario, please demonstrate that each theory delivers its specified verdict, identify the precise feature that makes the case split, explain whether removing that feature collapses the disagreement back into a standard convergence, and indicate how a proponent of the costly-signaling account might rebut the case by disputing the job-relevance of the indexed trait. Present your response in British English, and refrain from offering bibliographies, reading lists, or citations.
