answer: |-
  In the Guild of Archival Restorers, aspirants traditionally endure a three-year apprenticeship grinding pigments by hand under dim gaslight, a practice known to induce chronic retinal fatigue and repetitive strain injury in the wrists, yet upon completion, their ink quality is indistinguishable from machine-made blends. Recently, a spectroscopic synthesiser has become available that produces chemically identical ink instantly at negligible cost, rendering the final pigment composition fully observable and verifiable to any master restorer while rendering the production process entirely opaque. Despite this technological parity, the Guild mandates that aspirants continue the manual grinding ritual before handling valuable manuscripts, arguing that the physical toll proves the candidate possesses the ocular resilience and monotony tolerance required for decades of delicate repair work, whereas the synthesiser user remains an untested variable regarding long-term stamina.

  Under Spence's costly signaling model, rational agents ought to abandon the ritual immediately. Because the synthesiser renders the final work product fully observable and verifiable, the information asymmetry regarding technical competence is resolved without the need for a costly investment; the ritual becomes a wasteful expenditure with no marginal return on signaling ability. Conversely, the handicap principle predicts the persistence, or even intensification, of the ritual. Here, the signal is not merely an investment but a direct handicap; the physical strain and risk of injury are the very mechanisms that guarantee honesty regarding the candidate's resilience and monotony tolerance. Since the synthesiser creates a transparency trap by making the production process opaque, it conceals the absence of this handicap, leaving the employer unable to verify the underlying physiological capacity required for the broader role.

  The precise feature driving this divergence is the transparency trap itself, which decouples product verification from process visibility. If this feature were removed—meaning the production process were also transparent—employers could directly observe whether a candidate relied on the machine or endured the strain during actual work. This would likely collapse the disagreement into a standard convergence: both theories would acknowledge that direct observation of the trait during employment renders the separate, pre-emptive ritual redundant, as the work itself becomes the test. Finally, a proponent of the costly-signaling account might rebut the handicap argument by disputing the job-relevance of the indexed trait. They would argue that resilience to pigment grinding strain does not necessarily correlate with success in document restoration, rendering the ritual an arbitrary barrier rather than a functional index of productivity, and thus warranting its abolition in favour of direct skills assessment.
