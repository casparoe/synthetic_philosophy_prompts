  You should reject Step (4) because the Kelly criterion is not preference-free arithmetic but rather the mathematical solution for maximizing expected logarithmic utility, which embodies a specific and distinct attitude toward risk.

  Step (4) looks acceptable because the Kelly fraction derives from the laws of large numbers and compounding formulas, which feel like objective physics rather than subjective economics. It tempts you to believe that because the growth rate is a measurable number, the strategy that maximizes it must be universally rational. However, maximizing geometric growth is equivalent to maximizing the expected value of the logarithm of your wealth, and choosing a logarithmic utility function over a linear one (which would maximize expected dollar value) is itself a risk preference. By claiming the 10 percent stake is "pure compounding arithmetic," your friend hides the value judgment that you should care about geometric means rather than arithmetic means or absolute safety.

  To keep Step (4), you would have to accept that your aunt and the professional bettors using half-Kelly are acting irrationally, simply because they prioritize lower variance or survival over maximum growth rate. This prices out the validity of different utility functions and contradicts the standard economic view that risk tolerance varies legitimately between individuals. If you reject Step (4), you must give up the comfort of a single, objectively "correct" stake size for every person in every situation; you have to accept that rational people might stake less to sleep better at night or because they face a one-shot scenario where long-run convergence does not apply.

  You can still hold on to Steps (2) and (3) by treating them as conditional truths rather than universal laws. Step (2) remains mathematically correct: Kelly does maximize the long-run growth rate. Step (3) remains the correct advice for you, provided your goal is indeed to maximize that growth rate over many repetitions. The correction simply clarifies that this is the optimal move for your specific goal, not the only rational move for any human being, which resolves the contradiction with your aunt's experience and validates the use of fractional Kelly when risk tolerance demands it.
