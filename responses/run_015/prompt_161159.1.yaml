      *   *Missing:* They are debating the *definition* of probability. Grant: Frequency/Truth. Mira: Betting/Compression of Compute.
      *   *Confidence vs Odds:* For bounded agents, they collapse. You can't have a private confidence different from your betting odds without creating an internal Dutch Book (akrasia).

