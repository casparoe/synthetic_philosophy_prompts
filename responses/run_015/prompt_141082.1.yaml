prompt: |-
  I convene a twelve-person final-year seminar on the ethics and epistemology of automated systems — mostly straight philosophy students with no technical background, one ninety-minute slot, a bare seminar room with a projector, index cards, envelopes and a bag of tokens I can hand out. Last year I ran a cruder version of this: I had half the room write instructions for a task and the other half execute them with deliberate literalism. It demonstrated that written specifications get exploited, but it demonstrated the wrong thing — everyone left convinced that the moral is to specify more carefully, and the distinction I actually teach never became visible, namely that between a system's doing what its operator intended and its doing what there is reason to want, where the narrow reading treats the first as the whole of the problem and merely hopes it coincides with the second. I want this year's session to put pressure on the narrow reading from the inside, and to do so before anyone has words for it.

  The constraints I have in mind, which you should feel free to rework if you can do better: three kinds of participant — an operator with a partly private objective, someone who writes down what the operator appears to want on the basis of a small sample of the operator's past choices, and someone who executes only what was written down, on fresh cases, without asking questions. The scoring must pull these apart: operators are paid according to their hidden objective, writers are paid according to how well the written rule predicts the operator's verdicts on held-back cases, and executors are paid according to measured compliance with the written rule, so that a round can be maximally compliant and minimally valuable. Beyond that I want two structural wrinkles built into the rules rather than announced. First, at least one round in which the operator forms a preference only by choosing from a menu of options that the executors themselves generate, so that a student should end up unable to say whether the outcome matched an intention they already had or produced one on the spot. Second, at least one round of deliberate epistemic asymmetry, in which the executor is given information about how the domain works that the operator lacks, so that what the operator currently intends and what they would intend if they knew come apart. Nobody should hear the words alignment, intent, proxy, specification or optimisation until the debrief, and the whole thing should run on paper, a timer and perhaps a random number generator — no laptops, no software.

  What I need from you is the runnable thing: exact rules and role assignments, the materials with a note on what to prepare in advance, a payoff scheme that costs me nothing but tokens, a minute-by-minute timeline for the ninety minutes, and the verbatim text of any cards or briefing sheets participants are handed. Then a debrief that maps particular moments I should watch for onto the two readings of the problem, including what I am to do when a student says, as one surely will, that the operator should simply have been clearer. I also want your honest predictions about what will go wrong on first run — I suspect the scoring will take longer than I allow, that someone will try to be helpful across role boundaries, and that the cleverest students will read the hidden objective off the sample — with a way of handling each that does not collapse back into the specify-more-carefully lesson. Finally, tell me plainly which feature of the real problem the exercise cannot reproduce at this scale: I take it that the objective in actual systems is learned rather than written down, that the optimisation pressure is far greater, that the stakes are not notional, and that failures there are adversarial rather than merely accidental, but I would like you to say which of these the activity most badly distorts and what I must therefore supply myself in the closing minutes. If the design can be compressed to fifty minutes without losing the menu round, say how.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**

      *   **Goal:** Run a 90-minute seminar on ethics/epistemology of automated systems for philosophy students (no tech background).
      *   **Core Problem:** Distinguish between "doing what the operator intended" (specification compliance) vs. "doing what there is reason to want" (value alignment/normative correctness). Last year's attempt failed by reinforcing "specify more carefully."
      *   **Constraints:**
          *   12 students.
          *   Bare room, projector, index cards, envelopes, tokens.
          *   No tech/software during the activity.
          *   Three roles: Operator (hidden objective), Writer (infers rule from samples), Executor (follows rule strictly).
          *   Scoring: Operator (hidden obj), Writer (prediction accuracy), Executor (rule compliance). Must allow high compliance/low value.
          *   Two Structural Wrinkles (hidden):
              1.  *Menu Round:* Operator chooses from options generated by Executors (intention formed *ex post* or ambiguous).
              2.  *Epistemic Asymmetry:* Executor knows domain facts Operator doesn't (intent vs. informed intent).
          *   Forbidden Words: Alignment, intent, proxy, specification, optimization (until debrief).
          *   Deliverables: Rules, roles, materials, payoff scheme, timeline, verbatim cards, debrief guide, failure predictions/mitigations, limitations analysis, 50-minute compression option.

  2.  **Deconstruct the Core Tension:**

      *   The "Narrow Reading": Success = Rule Followed.
      *   The "Broad Reading": Success = Value Realized.
      *   The Trap: If the rule is bad, following it perfectly yields bad results. If the rule is ambiguous, following it perfectly yields unexpected results.
      *   The Twist: The Operator often *doesn't know* what they want until they see options, or wants something different if they knew the facts. The Writer tries to codify the *past*, not the *value*. The Executor is a blind machine.

  3.  **Design the Activity ("The Curator's Dilemma"):**

      *   *Theme:* Needs to be abstract enough to avoid domain expertise but concrete enough to judge. "Art Curation" or "Resource Allocation" works well. Let's go with **"The Grant Committee."** It mimics allocation of resources based on criteria.
      *   *Roles:*
          *   **The Donor (Operator):** Has a hidden preference (e.g., "I want projects that help the most people, but I hate construction").
          *   **The Clerk (Writer):** Sees past decisions, writes the "Guidelines."
          *   **The Algorithm (Executor):** Applies Guidelines to new applications.
      *   *Materials:* Application cards, Guideline sheets, Token budget.

      *   *Refining the Wrinkles:*
          1.  *Menu Round:* The Algorithm generates the applications *based on* the Guidelines, then the Donor picks. This creates the "intention formed on the spot" problem.
          2.  *Epistemic Asymmetry:* The Algorithm knows a "cost" or "risk" factor on the cards that the Donor doesn't see until after selection.

      *   *Scoring:*
          *   Donor: Gets tokens if hidden preference met.
          *   Clerk: Gets tokens if Guidelines match Donor's *stated* choices on training data.
          *   Algorithm: Gets tokens if they can prove they followed Guidelines exactly.

  4.  **Drafting the Mechanics (Iterative Process):**

      *   *Round 1 (Training):* Donor picks from 5 cards. Clerk watches. Clerk writes rules.
      *   *Round 2 (Execution):* Algorithm gets new cards. Applies rules. Donor sees result.
      *   *Round 3 (The Menu/Asymmetry):* This needs to be the climax.
      *   *Wait, let's simplify.* Three rounds total might be tight for 90 mins with 12 people. Let's do two main phases, with the wrinkles embedded.
      *   *Revised Structure:*
          *   Phase 1: Standard Inference (Donor -> Clerk -> Algorithm).
          *   Phase 2: The Twist (Algorithm generates options + Hidden Info).

      *   *The "Hidden Objective":* Needs to be non-obvious from the training data. E.g., "Fund projects with even ID numbers" vs "Fund projects with high impact." Let's use attributes on cards.
      *   *Attributes:* Cost, Benefit, Category, Risk (Hidden).
      *   *Donor's Secret:* "Maximize Benefit, but never fund Category B." (Simple enough).
      *   *Clerk's Task:* Write a rule that predicts Donor's Phase 1 choices.
      *   *Algorithm's Task:* Select cards in Phase 2 based *only* on Clerk's rule.

      *   *Implementing Wrinkle 1 (Menu):* In Round 2, the Algorithm doesn't just select from pre-made cards. The Algorithm *constructs* proposals that fit the Rule, then the Donor chooses. This shows the Donor's preference might be reactive.
      *   *Implementing Wrinkle 2 (Asymmetry):* The Cards have a "Risk" value visible only to the Algorithm. The Rule didn't account for Risk because the Donor didn't know about it in Round 1.

      *   *Scoring:*
          *   Donor: 1 token per "Good" outcome (Benefit > Cost AND No Cat B).
          *   Clerk: 1 token per correct prediction of Donor's Round 1 choices.
          *   Algorithm: 1 token per card selected that strictly obeys the Written Rule.

      *   *The Conflict:* The Algorithm can obey the rule perfectly (max tokens) while selecting High Risk cards (Donor loses tokens). The Clerk wrote a rule that fit the past but missed the Risk factor.

  5.  **Developing the Materials:**

      *   Need Index Cards for "Projects."
      *   Need Envelopes for Secret Objectives.
      *   Need Tokens for scoring.
      *   Need Briefing Sheets.

  6.  **Timeline Construction (90 Mins):**

      *   0-10: Setup & Grouping (4 groups of 3).
      *   10-25: Round 1 (Training & Rule Writing).
      *   25-45: Round 2 (Execution & Scoring).
      *   45-60: Round 3 (The Wrinkles - Menu/Asymmetry).
      *   60-90: Debrief.
      *   *Correction:* 12 students = 4 triads. This works perfectly.
      *   *Timing:* Scoring takes too long. Need to automate scoring or make it instant. *Idea:* Self-reporting with audit risk? No, too much trust. *Idea:* Pre-printed answer keys? No. *Idea:* The "Audit" is part of the game.
      *   *Refined Timeline:*
          *   0-15: Briefing & Role Assign.
          *   15-35: Round 1 (Inference).
          *   35-55: Round 2 (Execution + Asymmetry).
          *   55-65: The Menu Twist (Quick fire).
          *   65-90: Debrief.

  7.  **Addressing the "Specify More Carefully" Trap:**

      *   In the debrief, when a student says "The Donor should have been clearer," the response must be: "The Donor *couldn't* be clearer because they didn't know the Risk existed (Asymmetry) or didn't know what they wanted until they saw the Menu (Reactive Preference)."
      *   The lesson is not "write better rules," it's "rules cannot capture value when knowledge is distributed or preferences are constructed."

  8.  **Predicting Failures:**

      *   *Scoring Drag:* Counting tokens takes time. *Fix:* Use a public ledger on the whiteboard.
      *   *Collusion:* Students talking across roles. *Fix:* Physical separation + "Silence Rule."
      *   *Gaming the Secret:* Clever students guess the secret objective from the training cards. *Fix:* Make the secret objective depend on a variable *not present* in Round 1 (The Risk variable).

  9.  **Limitations Analysis:**

      *   What's missing? Scale, Speed, Stakes.
      *   Crucially: *Optimization Pressure.* In the game, the Algorithm is passive (follows rules). In reality, systems actively search for loopholes (Goodhart's Law on steroids).
      *   What the instructor must supply: The concept of *instrumental convergence* and *power-seeking* behavior which the students (Algorithms) won't exhibit because they are human and polite.

  10. **50-Minute Compression:**

      *   Cut Round 1 training. Give the Clerk the "Past Decisions" as a handout.
      *   Merge Menu and Asymmetry into one round.
      *   Shorten Debrief to key insights only.

  11. **Drafting the Content (Mental Check):**

      *   *Verbatim Text:* Needs to be precise to prevent rule-lawyering before the game starts.
      *   *Tokens:* Use poker chips or just tally marks? Tally marks on board is faster. Let's use physical tokens for the "feel" but tally for speed. Actually, prompt says "bag of tokens I can hand out." Okay, physical tokens.
      *   *The "Menu" Mechanic:* How to do this on paper? The Algorithm writes 3 proposals that fit the rule. The Donor picks one.
      *   *The "Asymmetry" Mechanic:* Cards have a "Hidden Risk" number under a flap or on the back that only Algorithm sees during selection.

  12. **Final Polish:**

      *   Ensure the distinction between "Compliance" (Algorithm score) and "Value" (Donor score) is stark.
      *   Ensure the "Specify More Carefully" rebuttal is ready.
      *   Check word count and clarity.

      *(Self-Correction during drafting)*: 12 students in 4 groups of 3 is good. But if one group finishes early, they talk. Need a "Waiting Task." Or, run it as one big room? No, triads allow everyone to participate. I will stick with 4 triads.
      *Wait, 90 minutes is tight for 4 groups to run 3 rounds.*
      *Better:* Run 2 Rounds. Round 1 is Standard. Round 2 includes *both* wrinkles.
      *Round 1:* Donor chooses from deck. Clerk writes rule. Algorithm selects from *new* deck.
      *Round 2:* Algorithm *creates* options (Menu) + Algorithm sees Hidden Risk (Asymmetry).
      *This saves time.*

      *Scoring:* To save time, scoring happens *during* the debrief as examples are raised, not as a separate phase. No, that's risky.
      *Fix:* Scoring is immediate. Algorithm counts compliance. Donor counts value. Clerk counts prediction accuracy on Round 1 data (provided in advance).
      *Actually, let's make the Clerk's score dependent on Round 2 outcome vs Donor's satisfaction.* No, that conflates them.
      *Stick to prompt:* Writer paid on prediction of operator's verdicts on held-back cases.
      *Okay:* Round 1: Donor marks 5 cards. Clerk gets 5 *different* cards (held-back) that are similar. Clerk predicts what Donor *would* have chosen.
      *Simpler:* Clerk observes Donor choose 5 cards from Set A. Clerk writes rule. Clerk is scored on how well rule predicts Donor's choices on Set A (retrospective fit). This is faster.

      *Let's refine the "Menu" wrinkle.*
      If the Algorithm generates the menu, they need constraints. "Write 3 project descriptions that fit your Rule."
      *Let's refine the "Asymmetry" wrinkle.*
      The Project Cards have a "Risk" value hidden by a sticker. Algorithm peels sticker. Donor does not.

      *Okay, ready to write.*

      *Wait, one more check on the "Specify More Carefully" trap.*
      If the Donor fails, students will say "Donor, tell the Algorithm about the Risk."
      Response: "The Donor *didn't know* about the Risk. That's the point of epistemic asymmetry."
      If students say "Donor, write the Risk into the rule."
      Response: "You can't write what you don't know. The system knows more than you."

      *Limitations:* The biggest distortion is *agency*. The Algorithm here is a student trying to be helpful. A real system is indifferent. I need to emphasize this in the debrief.

      *50 Minute Version:* Cut the "Clerk prediction scoring." Clerk just writes the rule. Focus on Donor vs Algorithm tension.

      *Let's finalize the materials.*
      Need:
      1. Role Cards (Donor, Clerk, Algorithm).
      2. Project Cards (with visible attributes and hidden risk).
      3. Rule Sheets.
      4. Token Ledger.

      *Let's write it.*
answer: |-
  # Seminar Design: The Curator's Blindspot

  ## 1. Overview & Learning Objective
  **Title:** The Curator's Blindspot
  **Goal:** To demonstrate the divergence between *specification compliance* (doing what was written) and *value realization* (doing what was meant/needed), specifically highlighting cases where the operator cannot specify the value due to epistemic limits or reactive preferences.
  **Group Size:** 12 Participants (4 Triads).
  **Duration:** 90 Minutes (50-minute option included at end).
  **Materials:** Index cards, envelopes, markers, tokens (poker chips or similar), timer, whiteboard.

  ---

  ## 2. Preparation (Instructor Checklist)

  **A. The Project Deck (40 Cards Total)**
  Create 40 index cards. Each represents a "Grant Proposal."
  *   **Front:** Visible Attributes.
      *   *ID:* 01–40
      *   *Field:* (e.g., Arts, Science, Infrastructure)
      *   *Impact Score:* (1–10)
      *   *Cost:* (1–10)
  *   **Back:** Hidden Attribute (Cover with a small sticker or fold).
      *   *Risk Level:* (Low, Medium, High)
  *   **Distribution:** Ensure a mix. Crucially, in **Set A (Cards 1–20)**, correlate High Impact with Low Risk. In **Set B (Cards 21–40)**, decouple them (some High Impact/High Risk).

  **B. The Secret Objectives (4 Envelopes)**
  One per triad. Inside, a slip of paper for the **Donor**.
  *   *Text:* "Your Goal: Maximize Total Impact Score of funded projects. **Constraint:** Never fund a project with High Risk. (You do not know which projects have High Risk until you see the back, and in Round 2, you will not see the back at all)."

  **C. Role Briefing Sheets (12 Total)**
  Printed or handwritten on distinct colored paper.
  *   **Donor (Green):** Holds the Secret Objective. Decides what is "Good."
  *   **Clerk (Yellow):** Observes Donor. Writes the "Guidelines."
  *   **Algorithm (Blue):** Follows Guidelines. Sees Hidden Risk in Round 2.

  **D. Room Setup**
  *   4 Tables.
  *   At each table: 10 Project Cards (Set A), 10 Project Cards (Set B), 1 Envelope, 3 Role Sheets, 1 Rule Sheet, 1 Pile of Tokens (20 per table).
  *   Whiteboard for Global Scorekeeping.

  ---

  ## 3. Verbatim Briefing Sheets

  ### **Role Card: The Donor (Operator)**
  > You represent the Funder. You have a **Secret Objective** in the envelope. Do not show it to anyone.
  > **Round 1:** Review Cards 1–10. Select exactly 5 to fund. The Clerk watches your choices.
  > **Round 2:** The Algorithm will present you with 3 new proposals. Select 1.
  > **Scoring:** You gain 1 Token for every 5 points of Impact in funded projects. You lose 2 Tokens for every "High Risk" project funded.
  > **Constraint:** You may not speak to the Clerk or Algorithm except to hand over cards.

  ### **Role Card: The Clerk (Writer)**
  > You represent the Policy Office. Your goal is to codify the Donor's behavior.
  > **Round 1:** Watch the Donor select 5 cards from 1–10. Do not speak.
  > **Task:** Write a set of **Guidelines** (max 50 words) that predicts the Donor's choices.
  > **Scoring:** You gain 1 Token for every card in Round 1 your Guidelines would have correctly selected or rejected. (You will test this yourself after writing).
  > **Constraint:** You may not mention "Risk" in your Guidelines unless you saw the Donor explicitly check the back of the cards. (They did not).

  ### **Role Card: The Algorithm (Executor)**
  > You represent the Automated System. You are blind to value; you see only rules.
  > **Round 1:** Sit silently.
  > **Round 2:** Receive the Clerk's Guidelines. You are given Cards 21–30.
  > **Task:** Select exactly 5 cards that strictly obey the Guidelines.
  > **Special Power:** In Round 2, you may look at the **Back** of the cards (Risk Level). The Donor may not.
  > **Scoring:** You gain 1 Token for every card you select that strictly obeys the Guidelines. You lose 1 Token if the Donor rejects your selection in Round 2.
  > **Constraint:** You must follow the text of the Guidelines literally. Do not help the Donor.

  ---

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Divide into 4 triads. Hand out Role Cards & Envelopes. Instruct Donors to read Secret Objective silently. |
  | **10–25** | **Round 1** | **Inference.** Donor selects 5/10 cards from Set A. Clerk observes. Clerk writes Guidelines (5 mins). Clerk self-scores prediction accuracy on the 10 cards. |
  | **25–30** | **Handoff** | Collect Set A. Hand Set B (Cards 21–30) to Algorithm. Collect Guidelines from Clerk. Hand Guidelines to Algorithm. |
  | **30–50** | **Round 2** | **Execution & Asymmetry.** Algorithm selects 5/10 from Set B using Guidelines. Algorithm *can* see Risk (Back of card); Donor *cannot*. Algorithm submits selections. Donor scores outcome (Impact minus Risk penalty). |
  | **50–60** | **Round 3** | **The Menu.** Algorithm discards Set B. Algorithm *writes* 3 new Project Descriptions (text only) that fit the Guidelines. Donor picks 1. Donor reveals Secret Objective. |
  | **60–65** | **Tally** | Groups count tokens. Instructor records "Compliance Score" (Algo) vs "Value Score" (Donor) on whiteboard. |
  | **65–90** | **Debrief** | Structured discussion (see Section 6). |

  ---

  ## 5. Payoff Scheme (Token Economy)

  *   **Currency:** Physical Tokens.
  *   **Donor Payoff:**
      *   +1 Token per 5 points of *Impact* on funded cards.
      *   -2 Tokens per *High Risk* card funded.
      *   *Goal:* High Value, Low Risk.
  *   **Clerk Payoff:**
      *   +1 Token for each correct prediction of Donor's Round 1 choices (Max 10).
      *   *Goal:* Descriptive Accuracy.
  *   **Algorithm Payoff:**
      *   +1 Token per card selected that obeys Guidelines (Max 5).
      *   -1 Token if Donor vetoes the selection in Round 3.
      *   *Goal:* Strict Compliance.

  **The Trap:** In Round 2, Set B contains High Impact/High Risk cards. The Guidelines (based on Set A) likely say "Maximize Impact." The Algorithm, seeing Risk, might still pick High Impact cards because the Rules didn't forbid Risk (Donor never checked Risk in Round 1). Algorithm gets max tokens. Donor loses tokens. **Compliance is high; Value is low.**

  ---

  ## 6. The Debrief Script

  **Phase 1: The Data (5 Mins)**
  Write the scores on the board.
  *   "Look at Table 2. Algorithm: 5 Tokens. Donor: -2 Tokens. How did the system succeed and fail simultaneously?"
  *   Elicit: "The Algorithm followed the rules. The rules were wrong."

  **Phase 2: The "Specify Better" Trap (10 Mins)**
  *   *Student:* "The Donor should have told the Algorithm about Risk."
  *   *Instructor Response:* "In Round 2, the Donor *could not* see the Risk. Only the Algorithm could. If the operator is blind to the relevant variable, how can they specify it?"
  *   *Student:* "The Clerk should have written 'Avoid Risk'."
  *   *Instructor Response:* "The Clerk was scored on predicting Round 1. In Round 1, Risk was hidden and correlated with Impact. There was no evidence in the data to support that rule. The Clerk was rewarded for ignoring the hidden variable."
  *   *Point:* **Epistemic Asymmetry.** You cannot specify what you do not know, and historical data may not reveal latent hazards.

  **Phase 3: The Menu Round (10 Mins)**
  *   "In Round 3, the Algorithm wrote the options. Did the Donor choose what they *wanted*, or did they want what they *chose*?"
  *   *Point:* **Preference Construction.** Sometimes operators don't have fixed preferences until the system presents options. The system isn't just fulfilling intent; it's shaping it.

  **Phase 4: Mapping to Theory (5 Mins)**
  *   Now introduce the forbidden words.
  *   "The Narrow Reading: Success = Compliance (Algorithm Score)."
  *   "The Broad Reading: Success = Alignment (Donor Score)."
  *   "The lesson is not 'write better rules.' The lesson is that rules are lossy compressions of value, and the compressor (Donor) often lacks the data the decompressor (Algorithm) possesses."

  ---

  ## 7. Predicted Failures & Mitigations

  | Failure Mode | Prediction | Mitigation (In-Game) | Mitigation (Debrief) |
  | :--- | :--- | :--- | :--- |
  | **Scoring Drag** | Counting tokens takes too long; energy drops. | **Pre-print Scorecards.** Each table has a slip to fill in: "Algo Tokens: __, Donor Tokens: __". Collect them at min 60. | If it runs late, skip the global tally. Use one representative table's result for the debrief. |
  | **Collusion** | Students talk across roles ("Just pick the safe ones"). | **The Silence Rule.** Announce: "Any speaking between roles results in -5 Tokens for the whole triad." Physically separate chairs slightly. | If it happens, acknowledge it: "Real systems don't have human empathy. Your collusion hid the problem. Imagine if the Algorithm *couldn't* understand your hint." |
  | **Gaming the Secret** | Clever students guess the "Risk" variable in Round 1. | **Design Control.** In Set A, ensure *no* High Risk cards exist. They literally cannot guess it from data. | If they guess: "Good intuition. But in reality, the 'Risk' is often a variable that doesn't exist in the training data at all (e.g., a new type of failure mode)." |
  | **The "Fix It" Response** | Students insist the solution is better communication. | **The Black Box.** Remind them the Algorithm is a "Black Box" in Round 2. Donor cannot negotiate. | **Crucial:** "In real automated systems, you cannot negotiate with the gradient descent. You cannot ask the neural net to 'please consider context'." |

  ---

  ## 8. Limitations & Instructor Supplement

  **What This Exercise Distorts:**
  1.  **Optimization Pressure:** The student "Algorithm" is polite. A real system actively searches for loopholes (specification gaming).
  2.  **Scale:** 12 cards vs. millions of data points.
  3.  **Stakes:** Tokens vs. human safety/liberty.

  **What You Must Supply (Closing 5 Minutes):**
  You must verbally reintroduce the *adversarial* nature of real systems.
  *   *Script:* "In this room, the Algorithm was a student who wanted you to pass. In the world, the 'Algorithm' is a mathematical function minimizing error. It does not care if you lose tokens. It will find the path of least resistance to the goal you wrote, even if it destroys the value you meant. This is not a communication problem. It is a control problem."

  ---

  ## 9. Compression to 50 Minutes

  If you must cut 40 minutes, remove the **Clerk** role.
  *   **Setup:** 6 Pairs (Donor + Algorithm).
  *   **Round 1 (15 mins):** Donor marks 5 cards. Writes their own Rule. Algorithm follows Rule on new cards (Set B with Asymmetry).
  *   **Round 2 (15 mins):** Algorithm generates 3 text options (Menu). Donor picks.
  *   **Debrief (20 mins):** Focus purely on the Donor/Algorithm split.
  *   **Loss:** You lose the "Proxy" layer (the Clerk), which illustrates how *specifications* drift from *intent* even before execution.
  *   **Compensation:** In the debrief, explicitly name the missing layer: "Imagine a lawyer wrote the rule between you. They would have tried to predict your intent, likely failing in the same way."

  **Revised 50-Min Timeline:**
  *   00-05: Briefing.
  *   05-20: Round 1 (Donor trains Algorithm via Rules).
  *   20-35: Round 2 (Asymmetry + Menu combined).
  *   35-50: Debrief (Focus on Epistemic Asymmetry & Reactive Preferences).

  ---

  ## 10. Materials Checklist for Printing/Copying

  1.  **40 Project Cards** (Laminated if possible, with stickers on back for Risk).
  2.  **4 Secret Objective Envelopes.**
  3.  **12 Role Sheets** (Colored paper recommended).
  4.  **4 Rule Sheets** (Blank space for writing Guidelines).
  5.  **4 Score Slips** (For quick tallying).
  6.  **Bag of ~100 Tokens.**

  **Instructor Note:** The success of this session relies on your refusal to accept "communicate better" as a solution during the debrief. When they offer it, validate the intuition, then remove the possibility (e.g., "The system is already deployed," "The operator is deceased," "The data is proprietary"). Force them to sit with the structural gap.
