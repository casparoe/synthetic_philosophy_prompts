      Regarding conclusion three, the public framing is dangerous. Selling the genome project as reading the book of life implies a determinism the biology does not support. It suggests we can read the blueprint without building the house. The context dependence you mentioned, splicing and reading frames, actually strengthens the language analogy but weakens the code analogy. Natural language is context-dependent, yes, but code is usually rigid. If the same stretch yields different products, it behaves more like a musical score than a computer program. A score requires an orchestra to exist before the notes have sonic value. Yet even this fails because the orchestra builds itself from the score.

      So where does this leave you? The code picture will not hold the ontological weight your colleague places on it. It is a useful shorthand for sequencing, but a poor model for development. Information in biology is not a thing carried by DNA; it is a property of the causal process involving DNA. If you must replace the analogy, do not look for another static object like a list or a book. Think of the genome as a resource or a constraint. It limits what can be built but does not specify the construction alone. The search for a perfect analogy fails because biology is not a communication system designed by an engineer; it is a self-constructing chemical cycle. Keep the code talk for the lab bench, but leave it at the door of the seminar room. If you insist on literalism, you must admit the cytoplasm reads as loudly as the nucleus. The regress does not sink the ship, but it does flood the hold. You cannot separate the text from the reader without killing the system.

