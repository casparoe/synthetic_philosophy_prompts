answer: |-
  It is completely understandable that you feel stuck on this because the nonidentity problem is designed to unsettle our deepest intuitions about morality and responsibility. When you first encounter the idea that our actions today determine not just the quality of life for future generations but their very identities, it can feel like the ground beneath our ethical reasoning has been pulled away. If saving the planet means a completely different set of people will be born than if we destroy it, then it seems logically impossible to say we are saving those specific people from harm, since without the destruction they would never have existed to be harmed in the first place. This paradox, famously articulated by the philosopher Derek Parfit, forces us to shift how we think about our obligations, moving away from a person-affecting view where we try to help specific individuals, toward an impersonal view where we focus on the quality of the world itself.

  The most important implication for how you should think about climate action is that you are not working to protect specific future individuals whose names and faces are already determined, but rather you are working to ensure that whoever comes into existence inherits a habitable world. Even though the specific identities of the people living in two hundred years will depend on exactly how we manage carbon emissions today, it remains true that a world ravaged by climate change is worse than a stable one, regardless of who lives there. We do not owe it to a specific future person named Alice to prevent her suffering, because if we act to prevent climate change, Alice might never be born. Instead, we owe it to the concept of wellbeing itself to ensure that the future contains people who have lives worth living rather than lives filled with preventable suffering. This shifts the moral weight from a transaction between you and a specific future victim to a broader responsibility to maintain conditions that allow for human flourishing. It means that climate action is not about saving particular souls but about stewarding the stage upon which future souls will perform, ensuring the theater does not collapse regardless of which actors are cast.

  This leads directly to your question about whether we owe anything to particular future people, and the unsettling answer suggested by this line of thinking is that we do not owe duties to specific non-existent individuals in the way we owe duties to existing ones. Instead, our obligation is to avoid creating states of affairs that are worse than alternatives. If we choose a policy that leads to a depleted, dangerous world, we have done something wrong not because we harmed the specific people who end up living there, but because we created a world where life is worse than it could have been. This can feel abstract and cold, but it actually strengthens the case for action rather than weakening it. It means we cannot excuse ourselves by saying the future people won't mind because they owe their existence to our negligence. The metric of success is not whether specific individuals are better off than they would have been, but whether the future we bring about is better than the future we could have brought about. We are responsible for the quality of the future, not the identity of its inhabitants.

  When you apply this same logic to having kids versus adoption, the waters get murkier but the distinction remains significant. You are right to notice that both choices determine which specific people come to exist or are raised by you. If you have a biological child, you bring one specific individual into existence, and if you adopt, you care for an existing individual while likely preventing the biological child you would have had from existing. In a strict metaphysical sense, the nonidentity problem highlights that both acts are identity-determining. However, this does not necessarily make them morally the same in practice. While both choices involve selecting who exists in your care, the consequences for overall wellbeing differ. Adopting a child typically provides a home to someone who already exists and often faces systemic disadvantages, whereas having a biological child adds a new person with a new carbon footprint and resource demand to the planet.

  The nonidentity problem reminds us that the biological child cannot complain that they were harmed by being born into a crowded world, because without that choice they wouldn't exist to complain. But that does not mean the choice is morally neutral. We still have to weigh the impact of adding a new life against the impact of caring for an existing one. The philosophical puzzle shows us that the harm principle is insufficient to judge procreation, but it does not erase other ethical frameworks like utilitarianism or virtue ethics. You might still conclude that adoption is preferable not because it helps a specific person more than biological reproduction would help a different specific person, but because it reduces overall suffering or resource strain. The nonidentity problem simply clarifies that your reasoning shouldn't rest on the idea that you are helping a specific future child who would otherwise be worse off, because in the case of biological reproduction, the alternative for that child is non-existence.

  Ultimately, getting stuck on these details should not lead to paralysis or nihilism. The purpose of exploring the nonidentity problem is not to prove that nothing matters, but to refine our understanding of why it matters. It teaches us that our responsibility is to the future as a whole rather than to specific future tenants. When you think about climate action, you are voting for a type of world, not saving specific strangers. When you think about having kids, you are weighing the value of creating new life against caring for existing life, knowing that both paths create different sets of people. The paradox dissolves when you realize that morality is not just about comparing how specific individuals fare across different scenarios, but about choosing the scenario that produces the most good overall. So while it is true that the specific people of the future are contingent on our actions, the value of their lives is not. We act to ensure that whoever those people turn out to be, they have a world that supports their dignity and survival, and that obligation remains binding even if their identities are fluid. I hope this helps untangle the knot a bit, as it is one of the hardest things to wrap your head around in ethics.
