answer: |-
  Here is the shape of the account you require, tested against your cases, repaired, and applied to your contractual problem.

  ### 1. Diagnosis of Your Current Rule

  Your working rule relies on two clauses: **Narrative Role Continuity** and **Authorial Licence**.

  *   **Clause 1 (Role):** This fails in **Case 5 (The Promotion)**. You argue Ivor persists because he occupies the plot function, but your readers argue Ruth persists because she occupies the causal history (name and past). "Role" is too functional; it ignores the history of the name-tag. It also struggles with **Case 6 (Fission)**, where one role retrospectively becomes two.
  *   **Clause 2 (Licence):** This distinguishes **Case 3 (Another Hand)** from **Case 4 (Translation)** adequately *if* "adds nothing of their own" is interpreted as "adds no new fictional facts." A translator changes words but preserves facts; a continuator adds facts. However, this clause does not explain the tension between **Case 1 (Drift)** and **Case 2 (Swap)**. In both, the textual basis is replaced. In Drift, you say identity persists; in Swap, you say lives are exchanged. Your rule treats them similarly (author made the change), yet your verdicts differ.

  The root of the trouble is that you are mixing **Ontological Identity** (what the character *is* in the canon) with **Aesthetic Continuity** (what the character *feels like* to the reader). For a contract, only Ontological Identity matters.

  ### 2. The Proposed Principle: The Chain of Authorial Designation

  To capture your verdicts (mostly) and solve the contradictions, I propose replacing your rule with a principle of **Causal-Intentional Lineage**.

  **The Principle:**
  > A fictional character is an abstract artifact established by an initial act of naming and description. Identity persists across texts if and only if:
  > 1.  **Lineage:** The later text stands in a chain of authorized revision or extension from the original text; AND
  > 2.  **Designation:** The author (or authorized successor) explicitly intends the name or designator in the later text to refer to the *same artifact* as in the earlier text, regardless of property changes; AND
  > 3.  **Differentiation:** Distinct names within a single canonical text denote distinct artifacts, unless a subsequent authorized text explicitly retcons them as identical or splits them as ambiguous.

  **Why this shape?**
  It treats a character not as a bundle of traits (which Case 1 disproves) nor as a narrative function (which Case 5 disputes), but as a **file** maintained by the author. As long as the author keeps the file open and labels it "Sark," it is Sark, even if every paper inside the file is replaced.

  ### 3. Testing the Principle Against Your Cases

  *   **1. Drift:** **Verdict: Same Character.**
      *   *Motivation:* Clause 2 (Designation). You intended Sark throughout. The "file" was never closed, only updated.
      *   *Rate of Change:* This principle renders your worry about "instant change" moot. Ontologically, if you publish Book 2 tomorrow with all changes and designate him Sark, he is Sark. Reader confusion is an aesthetic risk, not an ontological break. The "Ship of Theseus" is resolved by the shipwright's log, not the planks.
  *   **2. The Swap:** **Verdict: Same Names, Swapped Properties.**
      *   *Motivation:* Clause 2 (Designation). You attached the name "Vane" to the file labeled "Vane." Even though you poured Munn's life into it, the *artifact* designated as Vane persists.
      *   *Correction:* You must accept that ontologically, Vane is still Vane. The *content* is Munn's, but the *identity* follows the label you authorized. This explains why readers feel the swap—they notice the content mismatch—but legally, Vane remains Vane.
  *   **3. Another Hand:** **Verdict: Different Character.**
      *   *Motivation:* Clause 1 (Lineage). The chain of intention is broken. The new novelist creates a *new* artifact that mimics the old one. It is a forgery, not a revision.
  *   **4. Translation:** **Verdict: Same Character.**
      *   *Motivation:* Clause 1 & 2. The translator intends to preserve the original artifact's facts, merely changing the linguistic code. No new fictional facts are added; the lineage is unbroken.
  *   **5. The Promotion:** **Verdict: Ruth is Ruth.** (This overturns your verdict).
      *   *Motivation:* Clause 3 (Differentiation). "Ivor" and "Ruth" are distinct designators. If you delete Ivor, the artifact "Ivor" ceases to be updated. If you give Ivor's scenes to Ruth, you are updating the artifact "Ruth" with new properties.
      *   *Cost:* You must abandon your intuition that it is "Ivor dressed in Ruth's name." Readers are correct: it is Ruth acting out of character. To make it Ivor, you would have needed to rename Ruth to Ivor.
  *   **6. Fission:** **Verdict: Two Characters.**
      *   *Motivation:* Clause 3 (Differentiation). Book 8 clarifies that the reference in Books 1–7 was ambiguous. The single "file" is retrospectively split into two distinct lineages. Both exist from Book 1, but they were indistinguishable until Book 8.

  ### 4. The Unsettled Cases

  *   **Halloran vs. Seddon:**
      *   **Verdict:** **Seddon is a different man.**
      *   *Reasoning:* Unless you explicitly state in the new book "Seddon was formerly known as Halloran," the Chain of Designation is broken. Halloran belongs to the abandoned draft (a different textual universe). Seddon belongs to the new book. Inheriting scenes is inheritance of *property*, not identity.
      *   *Exception:* If you publish a note stating "Seddon is a revision of Halloran," then they merge under Clause 2.
  *   **Estate Prequel:**
      *   **Verdict:** **The Boy is Sark.**
      *   *Reasoning:* If the Estate licenses the work as an official part of the sequence (Clause 1: Lineage), and the writer intends to depict Sark's childhood (Clause 2: Designation), then it is Sark. The fact that the writer hasn't read your notes is irrelevant; they are reading the published canon, which constitutes the public artifact.
      *   *Caveat:* If you wish to prevent this (per Case 3 intuition), you must retain **Moral Rights** or **Approval Veto** in the contract.

  ### 5. The Cost of This Account

  To adopt this principle, you must pay two costs:

  1.  **Abandon Case 5:** You must accept that "Ruth" is Ruth, even if she does Ivor's job. Identity follows the Name/Designator, not the Plot Function. This aligns you with your readers and the law, but contradicts your authorial feeling.
  2.  **Accept Stipulation:** You must accept that "Character" is not a discovery but a declaration. If you decide tomorrow that Sark is a woman, she is a woman. There is no "true" Sark beyond what you designate. This removes the safety net of "objective" character traits.

  ### 6. Advice for the Solicitor

  A solicitor needs a definition that is enforceable, not philosophical. Philosophical definitions of "identity" are litigious nightmares. You cannot define "Gabriel Sark" by a list of traits (Case 1 proves they change). You cannot define him by "role" (Case 5 proves it is subjective).

  **You must define "The Character" by Reference and Right.**

  **Recommended Contract Clause Structure:**

  > **Definition of "The Character":**
  > "The character known as 'Gabriel Sark' shall be defined as the fictional persona appearing in the Works [list the 9 books], identified by the name 'Gabriel Sark' (or such variations as 'Gabe', 'Sark', etc.), **and any derivative depiction thereof that the Author explicitly designates in writing as being the same character.**"
  >
  > **Restriction on Alteration:**
  > "No option holder shall alter the fundamental identity of The Character (including but not limited to name, core biography, or psychological continuity) without the Author's prior written consent, **which consent may be withheld at the Author's sole discretion.**"
  >
  > **Exclusion of Unauthorized Continuations:**
  > "For the purposes of this agreement, 'The Character' does not include depictions created by third parties (including estate licensees) unless such depictions are approved as canonical by the Author during their lifetime, or by [Specific Executor] thereafter."

  **Why this works:**
  1.  **It bypasses the metaphysics:** It doesn't ask *what* Sark is, it asks *who says* it is Sark. It codifies the **Chain of Designation**.
  2.  **It protects Case 3:** It gives you the veto to say a continuator's work is "Not Sark" legally, not just intuitively.
  3.  **It protects Case 1:** It allows you to change traits (Drift) without breaching the contract, because the definition relies on your *designation*, not a fixed list of traits.
  4.  **It resolves Case 5:** It establishes that the Name is the primary identifier. If you rename Ivor to Ruth, the contract no longer covers him as Sark/Ivor.

  **Final Warning:**
  There is no account I would trust to define "Character" solely by description (e.g., "A male spy born in Bristol"). That definition will be breached by Book 10. You must define the character **indexically** (by pointing to the books) and **intentionally** (by reserving the right to say who counts).

  Your intuition in Case 3 (that another hand makes a different character) is a **Moral Right**, not a copyright fact. In many jurisdictions, you can waive this. Do not waive it. If you sell the copyright, the new owner can legally make Sark a woman, a robot, or a dog, and call it Sark. Your only protection is a contractual clause that ties the *definition* of the character to *your ongoing approval*.

  **Summary for the Solicitor:**
  Define "Gabriel Sark" not as a set of attributes, but as **the entity designated as such by the Author within the canonical sequence.** Tie the definition to your **right of approval** for any future depiction. This is the only way to ensure the legal definition matches your ontological verdicts.
