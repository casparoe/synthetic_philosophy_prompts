      *   *Wait, re-reading:* "I have... thirty printed 7x7 Hex boards." If I don't use them, it's wasteful. But the prompt asks me to choose the *opening*. I will advise: Open with Failed Construction on the doc cam (to focus attention), *then* use the boards for a specific task (testing monotonicity or visualizing the "extra stone"), not free play. Free play leads to "I lost because I was bad," not "This game is hard to solve."
      *   *Actually, looking at the "Surprise" requirement:* The surprise should be the gap between existence and knowledge.
      *   *Refining the "Game Choice":* The prompt asks me to settle Hex vs Chomp vs Tic-Tac-Toe. I must be decisive. Hex is the right choice for the resources and the "no draw" axiom (which is plausible to students), whereas Tic-Tac-Toe is factually a draw (confusing) and Chomp is less visual with counters.
      *   *Refining "Hex vs Chomp Species":* They are the same. Both rely on $S \subseteq S' \implies Value(S) \le Value(S')$.
      *   *Refining "Swap Rule":* It breaks the P1 advantage. It shows the proof is "real" because players patch the game to fix the imbalance the proof reveals.

