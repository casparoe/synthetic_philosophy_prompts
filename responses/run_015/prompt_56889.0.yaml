      *   **Goal:** Consolidate the idea that existence $\neq$ constructibility. Use Strategy-Stealing as the *central* theme, not just an example.
      *   **Constraints:** No readings/references. Focus on pedagogy and conceptual sequencing (dependency structure).
      *   **Specific Questions to Answer:**
          *   Open with play, known game, or failed construction?
          *   How to handle the "no-draw" property in Hex (concede vs. assume)?
          *   Which game to commit to (Hex, Tic-Tac-Toe, Chomp)? Are Hex/Chomp arguments the same species?
          *   Smallest change to make the argument fail?
          *   View on the Swap Rule.
          *   Misconception Map: When to head off specific errors (constructive, copycat mechanics, draw vs. win, symmetry/asymmetry, applicability to chance games).
          *   Minute allocation.
