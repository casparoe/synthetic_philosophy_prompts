answer: |-
  ### Session Plan: The Strategy-Stealing Argument

  **Goal:** Demonstrate that existence proofs can be completely decoupled from construction, using the Strategy-Stealing argument in Hex as the sole vehicle.
  **Time:** 75 Minutes
  **Resources:** Whiteboard, Document Camera, 30 printed 7×7 Hex boards (used for demonstration, not free play), counters.

  ---

  ### 1. Opening Strategy: The Epistemic Gap (0–10 mins)

  **Decision:** Open with an **explicit failed construction attempt** on the document camera, not free play.
  **Reasoning:** Free play generates noise ("I lost because I blundered") rather than signal ("This game is computationally opaque"). You need them to feel the *impossibility* of finding the move, not the frustration of losing.

  **Sequence:**
  1.  **Project a 7×7 Hex board.** Place a single Black stone in the center.
  2.  **Ask:** "Black moves first. Black wants to connect top-to-bottom. White wants to connect left-to-right. I am claiming Black has a winning strategy. Who can tell me Black's winning first move?"
  3.  **Wait.** Allow silence. Solicit guesses. Refute them quickly by showing a White defense.
  4.  **State the Promise:** "In 40 minutes, you will have a proof that Black *must* have a winning move on this board. You will also leave this room knowing less about *which* move it is than you do right now."

  **The "No-Draw" Concession:**
  *   **Do not prove it.** Do not attempt a topological hand-wave.
  *   **State it as an Axiom:** "Hex has a property we will not prove today: the game cannot end in a draw. One player must win. This is a theorem of topology (Brouwer's Fixed Point Theorem), but for this section, it is **Rule 0**. If you doubt Rule 0, the rest of the proof holds conditionally: *If* there are no draws, *then* P1 wins."
  *   **Why:** This models mathematical honesty. You are isolating the logic of the strategy-stealing argument from the topology of the board.

  ---

  ### 2. Conceptual Dependency Structure

  You cannot present the proof linearly. You must build the prerequisites in a specific dependency chain. If you violate this order, the misconceptions will take root before you can address them.

  **Dependency Chain:**
  1.  **Game Rules** (Perfect Information, Deterministic, Finite).
      *   *Must precede:* Definition of Strategy.
  2.  **Definition of "Strategy"** (A complete function mapping every possible board state to a move).
      *   *Must precede:* The concept of "Stealing."
      *   *Constraint:* Emphasize a strategy is not a heuristic; it is a lookup table for *every* contingency.
  3.  **Monotonicity Property** (An extra stone of your color never hurts you).
      *   *Must precede:* The "Occupied Cell" workaround in the proof.
      *   *Critical:* This is the only place Hex and Chomp are identical.
  4.  **The "No-Draw" Axiom** (Established in Opening).
      *   *Must precede:* The Conclusion (Win vs. Force-Draw).
  5.  **The Proof** (Contradiction via Strategy Stealing).
      *   *Requires:* 1, 2, 3, and 4.

  ---

  ### 3. The Core Argument: Hex vs. Chomp vs. Tic-Tac-Toe (10–45 mins)

  **Decision:** Commit to **Hex**.
  **Reasoning:**
  *   **Tic-Tac-Toe:** Fatal flaw. It is a draw. Strategy stealing only proves P1 can force a *draw*. This confuses the "Existence of a Win" lesson.
  *   **Chomp:** Logically identical to Hex for this argument, but visually abstract for a 75-minute section. The "poisoned" square adds cognitive load unrelated to the logic.
  *   **Hex:** You have the boards. The monotonicity (extra stone = good) is visually intuitive.

  **Are Hex and Chomp the same species?**
  Yes. They are the same argument. Both rely on **Monotonicity**: adding a piece to your set of controlled spaces strictly increases (or maintains) your winning chances.
  *   **Hex:** Extra stone connects paths better.
  *   **Chomp:** Eating more chocolate removes more options for the opponent.
  *   **Smallest Change to Break the Argument:** Remove Monotonicity.
      *   *Example:* "Hex with Obstacles." If you place a stone that completes a 2x2 square of your own color, you lose. Now an extra stone *can* hurt you. The strategy-stealing argument collapses because when P1 plays the "extra" random move, they might instantly lose.

  **The Proof Walkthrough (Whiteboard):**
  1.  **Assumption for Contradiction:** Assume Player 2 (White) has a winning strategy $S_W$.
  2.  **The Theft:** Player 1 (Black) makes an arbitrary first move (Stone A).
  3.  **The Simulation:** Black now pretends to be White. Black ignores Stone A for a moment and uses $S_W$ to respond to White's actual moves.
  4.  **The Conflict:** What if $S_W$ calls for a move on the cell occupied by Stone A?
  5.  **The Resolution (Monotonicity):** Black plays *any* other empty cell. Since having an extra stone (Stone A) never hurts Black, having Stone A *plus* the new stone is at least as good as having just the new stone.
  6.  **The Contradiction:** Black has effectively used White's winning strategy to win as Black. This contradicts the assumption that White has a winning strategy.
  7.  **Conclusion:** White cannot have a winning strategy. Since there are no draws, Black must have a winning strategy.

  ---

  ### 4. Misconception Map & Intervention Points

  Do not wait for questions. Head these off at the specific timestamps below.

  | Misconception | When to Head Off | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"The proof tells us how to play."** | **Minute 5 (Opening)** | Explicitly state: "This proof is non-constructive. It proves the lookup table exists, but gives zero entries." |
  | **"It's just copycat/mirroring."** | **Minute 30 (During Proof)** | Students think P1 mirrors P2's moves across an axis. **Correction:** "P1 is not mirroring geometry; P1 is simulating a *role*. P1 is playing White's strategy *as* Black." Use the "Ghost Player" analogy: P1 imagines a Ghost Black playing against them, and copies the Ghost's moves. |
  | **"P2 can steal P1's strategy." (Symmetry)** | **Minute 40 (Post-Proof)** | Ask: "Why can't White steal Black's strategy?" **Answer:** Asymmetry of the first move. White does not have an "extra stone" to waste. The proof relies on P1 having a move that is *free* to be ignored/repurposed. |
  | **"This proves P1 wins Tic-Tac-Toe."** | **Minute 45 (Comparison)** | Clarify: "In Tic-Tac-Toe, this proof only shows P1 can force a *non-loss*. Because draws exist, 'not losing' $\neq$ 'winning'. Hex works because 'not losing' $=$ 'winning'." |
  | **"Apply this to Poker/Backgammon."** | **Minute 60 (Limitations)** | Clarify: "Requires Perfect Information. If you can't see the opponent's hand or the dice roll, you cannot define a deterministic strategy function." |

  ---

  ### 5. The Swap Rule (Minute 50)

  **Question:** "Real Hex players use a 'Swap Rule': P1 places a stone, then P2 chooses to play as Black or White. Does this break the proof?"
  **Answer:** Yes, it breaks the proof for P1.
  **Pedagogical Value:** This is evidence that the proof is *true*. Players invented the Swap Rule *because* they knew P1 had a theoretical advantage, even if they didn't know the move. The rule neutralizes the "extra move" asymmetry. It is a patch applied specifically because the non-constructive proof holds water.

  ---

  ### 6. Minute Allocation

  *   **00–10:** **The Hook.** Failed construction attempt on doc cam. Establish the "No-Draw" axiom.
  *   **10–25:** **Definitions.** Strategy (as a function), Monotonicity (extra stone $\ge$ 0 value), Perfect Information.
  *   **25–45:** **The Proof.** Derive it on the whiteboard. Stop at the "Occupied Cell" conflict and let them propose solutions before revealing Monotonicity.
  *   **45–55:** **Misconception Check.** Symmetry (why P2 can't steal) and Constructive nature (why we don't know the move).
  *   **55–65:** **Boundaries.** Swap rule, Poker/Chance, Tic-Tac-Toe draws.
  *   **65–75:** **Closing & Assessment.**

  ---

  ### 7. Moment of Genuine Surprise (Minute 60)

  **The Revelation:** "We know who wins on a 19×19 Hex board."
  **The Follow-up:** "No human and no computer knows *how* to win."
  **Explanation:** The strategy-stealing argument scales to any size. We know a winning strategy exists for P1 on 19×19. But the search space is larger than the number of atoms in the universe. We possess certainty without knowledge. This is the recruitment pitch for combinatorics: studying the structure of things we cannot compute.

  ---

  ### 8. Closing Question (Diagnostic)

  **Question:** "I modify Hex. New Rule: If your stones form a closed loop (a cycle), you immediately lose. All other rules (including no draws) stay the same. Does the Strategy-Stealing proof still guarantee Player 1 wins?"

  **Desired Answer:** No.
  **Diagnostic Wrong Answers:**
  1.  **"Yes, because P1 still moves first."**
      *   *Reveals:* They missed the **Monotonicity** dependency. Forming a loop is a penalty for having *more* stones/connectivity. An extra stone can now hurt you.
  2.  **"Yes, because there are still no draws."**
      *   *Reveals:* They think the **No-Draw** axiom is the only condition. They missed that the "Occupied Cell" workaround fails if the random move risks a loop.
  3.  **"No, because P2 can now steal."**
      *   *Reveals:* They missed the **Asymmetry** logic. The rule change doesn't symmetrize the turn order.

  ---

  ### 9. What to Leave Out (Deferred vs. Ignored)

  **Name and Defer (Write on board as "Future Topics"):**
  *   **The Topology of No-Draws:** Acknowledge this is a deep theorem (Brouwer), not a game rule. It justifies treating it as an axiom for today.
  *   **Computational Complexity:** Mention that finding the strategy is PSPACE-complete. This explains *why* we can't construct it despite knowing it exists.

  **Do Not Raise (Ignore Completely):**
  *   **Determinacy (Zermelo's Theorem):** Too abstract. It muddies the water to talk about general finite games when Hex is the specific vehicle.
  *   **Maker-Breaker Theory:** Unnecessary terminology.
  *   **Explicit Board Sizes:** Do not discuss which small board sizes (e.g., 3×3, 4×4) have *known* constructive solutions. It distracts from the non-constructive point.

  ### Summary of Pedagogical Stance
  You are not teaching them how to win Hex. You are teaching them that **mathematics can certify truth without providing a witness.** Every element of the session must serve that epistemic distinction. If a student asks "But what is the move?", the correct answer is "The proof tells us asking that question is the wrong way to think about existence."
