  2.  **Deconstruct the Pedagogical Challenge:**

      *   *The Core Tension:* Students equate "proof of existence" with "finding the thing." Strategy-stealing is the perfect antidote because it proves $P1$ has a winning strategy in Hex without telling them *what* the first move is.
      *   *The Dependency:* To understand *why* the proof works, they need to understand the rules. To understand *why* it's non-constructive, they need to feel the inability to find the move. To understand *why* it doesn't apply everywhere, they need to see the specific axioms (monotonicity, perfect information, no draws).
      *   *The Hex Problem:* Proving Hex has no draws is topological (Brouwer Fixed Point equivalent). Too hard for this section. Must be an axiom.
      *   *The Game Choice:*
          *   *Tic-Tac-Toe (3x3):* Bad. It's a draw. Strategy stealing only proves P1 can force a draw. Confuses "win" vs. "not lose."
          *   *Chomp:* Good for monotonicity (eating more is better). Bad for physical intuition in a 75-min section (poisoned chocolate is abstract).
          *   *Hex:* Best visual. Monotonicity is intuitive (extra stone never hurts). Connection to "no draws" is the weak link, but manageable as an assumption.
          *   *Decision:* Stick with Hex. It matches the resources (printed boards). It's the standard for this argument.
      *   *Hex vs. Chomp:* They are the same species of argument (Strategy Stealing based on monotonicity + extra move advantage). The "extra stone never hurts" (Hex) is isomorphic to "eating more is better" (Chomp).
      *   *Swap Rule:* It breaks the strategy stealing argument for P1. It's a patch *because* the argument works. Good discussion point.

  3.  **Drafting the Plan - Section by Section:**

      *   **Opening (0-15 min):**
          *   *Idea:* Play first? Risk: They think it's a draw. Risk: Wastes time.
          *   *Better:* Failed Construction. Show a 3x3 Hex board (small enough to analyze). Ask them to find the winning move. They will struggle.
          *   *Decision:* Start with the *question*, not the play. "Does P1 have a winning strategy?" Let them guess. Then reveal we will prove it *without* finding it.
          *   *Wait, the prompt asks:* "Tell me whether to open with play, with a game they already know cold, or with an explicit failed construction attempt."
          *   *Refinement:* Open with a *failed construction attempt* on the board. It highlights the epistemic gap immediately. Play takes too long and leads to the "draw" confusion.
          *   *The "No Draw" Concession:* Be explicit. "We are taking as an axiom that Hex cannot end in a draw. Proving this requires topology we don't have time for." Don't hide it.

      *   **The Core Argument (15-45 min):**
          *   Need to define "Strategy." It's a function from Board States to Moves.
          *   Need to define "Winning Strategy."
          *   The Proof by Contradiction structure:
              1.  Assume P2 has a winning strategy ($S_2$).
              2.  P1 makes a random move (extra stone).
              3.  P1 pretends to be P2 using $S_2$.
              4.  If $S_2$ calls for the occupied spot, P1 plays randomly (monotonicity saves us).
              5.  P1 wins. Contradiction.
          *   *Misconception Check:* The "Copycat" error. Students think P1 mirrors P2. P1 *steals* P2's strategy. Crucial distinction.
          *   *Misconception Check:* Symmetry. Why can't P2 steal P1's strategy? Because P1 moves first. The "extra stone" is the asymmetry.

      *   **The "Species" Question (Hex vs. Chomp):**
          *   They are the same species. Both rely on *Monotonicity* (extra piece/square never hurts).
          *   Smallest change to fail: Remove monotonicity. Example: A game where having more pieces blocks your own path (e.g., "Go" capture rules, or a maze where pieces are walls). Or allow draws (Tic-Tac-Toe).
          *   Swap Rule: It invalidates the proof for P1. It acknowledges the proof's conclusion (P1 advantage) and neutralizes it.

      *   **Misconception Map & Timing:**
          *   *Constructive:* Address early. "I will not tell you the move."
          *   *Copycat:* Address during the proof step where the occupied cell arises.
          *   *Draws (Tic-Tac-Toe):* Address when comparing games.
          *   *Symmetry:* Address at the conclusion of the proof.
          *   *Chance/Poker:* Address in the "limitations" section.

      *   **Surprise & Closing:**
          *   *Surprise:* The fact that we know P1 wins on 19x19 Hex but no human/computer knows *how*.
          *   *Closing Question:* Needs to test the *conditions* of the theorem, not the theorem itself. "I modify Hex: if you make a cycle, you lose. Does the proof hold?" (Tests monotonicity/no-draw).

      *   **Deferred Topics:**
          *   *Name and Defer:* Topology of no-draws (honesty), Complexity (why we can't compute it).
          *   *Ignore:* Determinacy (too abstract), Maker-Breaker (too technical).

  4.  **Refining the Dependency Structure:**

      *   *Constraint 1:* Cannot define "Winning Strategy" until Rules are clear.
      *   *Constraint 2:* Cannot run the Contradiction until "Strategy" is defined as a complete plan.
      *   *Constraint 3:* Cannot explain the "Occupied Cell" workaround until Monotonicity is established.
      *   *Constraint 4:* Cannot discuss Symmetry until the Proof is complete.
      *   *Constraint 5:* Cannot discuss Applicability (Poker) until Perfect Information is defined.

  5.  **Addressing Specific Prompt Queries:**

      *   *Open with:* Failed construction. It creates the "need" for the proof.
      *   *No-Draw:* State as an axiom. Do not attempt to prove.
      *   *Game:* Hex. It fits the counters/boards.
      *   *Hex vs. Chomp:* Same species (Monotonicity).
      *   *Smallest Change:* Remove Monotonicity (e.g., pieces block movement).
      *   *Swap Rule:* It's a patch that acknowledges the proof.
      *   *Surprise:* 19x19 Hex is solved (existence) but unsolved (construction).
      *   *Closing:* Modified rule set question.

  6.  **Developing the Minute Allocation:**

      *   0-10: Setup & Failed Construction.
      *   10-25: Definitions (Strategy, Monotonicity, No-Draw Axiom).
      *   25-50: The Proof (Interactive derivation on whiteboard).
      *   50-60: Misconception Check (Symmetry, Constructive nature).
      *   60-70: Limitations & Extensions (Swap rule, Poker).
      *   70-75: Closing Question & Exit.

  7.  **Fleshing out the Misconception Map:**

      *   *Constructive:* Head off at the start. "By the end, you will know *that* a move exists, but you will be unable to name it."
      *   *Copycat:* Head off during the proof step. "We are not mirroring; we are simulating."
      *   *Draws:* Head off when defining the game properties. "Hex has no draws. Tic-Tac-Toe does. That changes the conclusion."
      *   *Symmetry:* Head off at the end. "Why didn't P2 steal?"
      *   *Chance:* Head off in limitations. "Perfect Information required."

  8.  **Final Review against Constraints:**

      *   No readings? Check.
      *   Dependency structure explicit? Check.
      *   26 students/75 mins? Check.
      *   Address all specific questions (Hex vs Chomp, Swap, etc.)? Check.

  9.  **Self-Correction/Nuance:**
