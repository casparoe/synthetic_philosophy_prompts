prompt: |-
  I just spent an hour arguing with a friend about whether a ring species is one species or several, and we went in circles because, without realizing it, we were answering different questions — I kept saying "but the neighbors interbreed" while he kept saying "but the ends have separate evolutionary histories." I teach an intro evolution course (about 25 undergraduates, one 50-minute session), and I'd like an in-class activity that makes students hit that disagreement themselves instead of having me assert it.

  Set it up as a taxonomic vote: give them a case file on a ring of related populations (adjacent populations interbreed, but the two ends meet and don't — think of a ring species like the herring gull complex) with data on morphology, mating behavior, and genetic divergence, and have them vote on whether it's one species or two. The rules should force each group to commit to a single criterion for its vote, and the vote should carry real stakes so it matters (e.g., the outcome determines whether the population gets its own legal protection or is folded into a broader, already-protected category). Arrange the data so that whichever criterion a group picks, some other fact in the file would flip the verdict under a different criterion — so the groups should split and discover the conflict on their own before I name it.

  Please give me the rules, the case file, the payoff scheme, a minute-by-minute timeline, and a debrief that maps each criterion the groups used onto the competing species concepts (biological, phylogenetic, morphological) and lands the deeper point: that "interbreeds with" isn't transitive, so it can't carve species into clean categories, and that the "right" concept partly depends on your purpose. Also tell me what will predictably go wrong the first time I run it, and be frank about which feature of the species problem the activity can't reproduce and I'll have to supply.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 50-minute in-class activity for an intro evolution course (25 undergrads) about ring species and the species problem.
      *   **Core Conflict:** Students need to experience the tension between the Biological Species Concept (BSC - interbreeding) and other concepts (Phylogenetic/Morphological - distinct ends) without the instructor just telling them.
      *   **Format:** Taxonomic vote with a case file.
      *   **Mechanism:** Groups must commit to a specific criterion. The vote has "stakes" (legal protection). Data must be ambiguous enough that different criteria yield different results.
      *   **Deliverables:** Rules, Case File, Payoff Scheme, Timeline, Debrief (mapping criteria to concepts + transitivity issue + purpose-dependence), Prediction of Failure Points, Limitations of the Activity.
      *   **Tone:** Practical, instructor-focused, frank about limitations.

  2.  **Deconstruct the Science:**
      *   *Ring Species:* Population A breeds with B, B with C, C with D... but A and D do not breed.
      *   *The Problem:* BSC says A=B, B=C, C=D, so A=D (transitivity). But observation says A!=D.
      *   *The Resolution:* Species concepts are tools, not absolute truths. Conservation status depends on the goal (preserving genetic diversity vs. preserving reproductive units).
      *   *The Activity:* Needs to simulate this non-transitivity.

  3.  **Drafting the Case File (The "Organism"):**
      *   Need a fictional or anonymized real example to avoid prior knowledge. Let's use a fictional salamander or bird. Let's go with a fictional lizard, *Scincus ringus*, to avoid specific real-world baggage (like *Larus* gulls which have taxonomic revisions).
      *   *Geography:* A ring around a mountain or desert.
      *   *Populations:* North, East, South, West.
      *   *Data:*
          *   Morphology: Gradient (clinal), but ends look different.
          *   Genetics: Ends are divergent.
          *   Reproduction: Neighbors hybridize freely; Ends refuse/sterile.
      *   *The Stake:* Endangered Species Act (ESA) listing. If "One Species," the whole ring is protected under one umbrella. If "Two Species," the distinct end population might get *emergency* listing, but the middle might lose protection if the umbrella is dropped. Or, conversely, splitting them might dilute funding. Let's make it: "Funding Allocation." If 1 species, pooled fund. If 2 species, the distinct end gets specific critical habitat protection, but the intermediates might fall through cracks. Actually, the prompt suggests "legal protection." Let's simplify: If 1 species, the *entire* range gets moderate protection. If 2 species, the distinct end gets *high* protection, but the intermediates are "not distinct enough" and get *none*. This creates the tension: Do we save the unique end at the cost of the middle? Or save all at a lower level?
      *   *Refinement on Stakes:* To make the disagreement sharp:
          *   Option A (1 Species): All populations get "Threatened" status.
          *   Option B (2 Species): The distinct end population gets "Endangered" (high protection), but the connecting populations are deemed "Not Distinct" and get *no* protection.
          *   *Conflict:* Save everyone moderately, or save the unique end highly but abandon the bridge?

  4.  **Drafting the Rules:**
      *   Groups of 4-5 (5 groups total for 25 students).
      *   Each group picks a "Lens" (Criterion) *before* seeing the data? No, they should see data, then pick a lens to justify their vote. Better: They must write down their *primary justification* on the ballot.
      *   Vote is secret initially, then public.
      *   Instructor acts as the "Agency Head."

  5.  **Drafting the Timeline (50 mins):**
      *   0-5: Intro & Scenario.
      *   5-15: Group work (Data analysis & Decision).
      *   15-25: The Vote & Reveal.
      *   25-40: Debrief & Lecture (The "Why").
      *   40-50: Wrap up & Limitations.

  6.  **Developing the Debrief:**
      *   Map justifications to BSC, PSC, Morphological.
      *   Highlight the Transitivity Failure (A=B, B=C, A!=C).
      *   Discuss Pragmatism (Conservation goals).

  7.  **Identifying Failure Points (The "Frank" Advice):**
      *   Students might compromise ("Let's call it 1.5 species").
      *   Students might ignore the stakes and just vote what feels "biologically true."
      *   Time management (debates can run long).
      *   Students might not grasp *why* transitivity matters.

  8.  **Identifying Limitations:**
      *   Real ring species are rare/debated (Ensatina, Larus).
      *   Doesn't cover asexual organisms.
      *   Doesn't cover temporal isolation.
      *   Simplifies the legal reality (ESA is more nuanced).

  9.  **Refining the Activity (Self-Correction during drafting):**
      *   *Critique:* If I let them choose any criterion, they might all choose BSC and agree.
      *   *Fix:* Assign each group a "Mandate." Group 1: Genetic Integrity. Group 2: Reproductive Continuity. Group 3: Morphological Distinctness. Group 4: Conservation Triage. Group 5: Wildcard.
      *   *Wait, better:* Let them choose, but force them to write the *rule* they used on the ballot. If everyone votes 1 species, I need to prompt the "Ends" data harder.
      *   *Best approach for conflict:* Give them the data, ask for a vote. Then, ask *why*. When the "Why" differs, highlight the conflict. To ensure split, the data must be weighted equally.
      *   *Revised Rule:* To make the stakes real, tell them: "If you vote 1 Species, the intermediates are saved. If you vote 2 Species, the unique End Population is saved, but the intermediates are deregulated." This forces a value judgment, not just a biological one.

  10. **Final Polish:** Check against all constraints in the prompt.
      *   Rules? Yes.
      *   Case File? Yes.
      *   Payoff Scheme? Yes.
      *   Timeline? Yes.
      *   Debrief (mapping concepts, transitivity, purpose)? Yes.
      *   Predictable failures? Yes.
      *   Limitations? Yes.

  11. **Writing the Output:** (Proceeding to generate the response based on these thoughts.)
      *   *Note:* Ensure the tone is collegial to a fellow instructor.
      *   *Note:* Make the case file printable/handout-ready.
      *   *Note:* Ensure the transitivity explanation is clear.

  *(Self-Correction on the "Stakes"):* The prompt asks for "real stakes." In a classroom, "real" means graded or impactful to the simulation. Let's make it a "Grant Allocation" simulation. If they get it "wrong" (according to the instructor's key?), they lose points? No, that defeats the purpose of there being no right answer. The "stakes" should be narrative. "Your decision determines the fate of 10,000 individuals." I will emphasize the narrative stakes.

  *(Refining the Transitivity Point):* This is the hardest conceptual leap. I need to make sure the debrief explicitly writes out A=B, B=C, A!=C on the board.

  *(Refining the Failure Points):* Students often try to "split the difference." I need to warn the instructor to forbid "subspecies" as a compromise during the vote phase.

  Let's assemble the document.cw
answer: |-
  Here is a complete lesson plan designed to generate that specific conflict in a 50-minute session.

  ### Activity Title: The *Vermivora* Dilemma
  **Topic:** Species Concepts & The Ring Species Paradox
  **Time:** 50 Minutes
  **Class Size:** 25 Undergraduates (5 Groups of 5)

  ---

  ### 1. The Payoff Scheme (The Stakes)
  To make the vote matter, you are acting as the **Regional Director of the Wildlife Conservation Agency**. The groups are your **Scientific Advisory Board**.

  *   **The Scenario:** A development corporation wants to build a highway through the "Southern Valley."
  *   **The Constraint:** The law protects *Species*, but not *Populations* within a species (for the sake of this simulation).
  *   **The Choice:**
      *   **Vote "1 Species":** The entire ring is listed as *Threatened*. The highway is rerouted, saving **all** populations, but the development company sues, delaying conservation funding for 5 years.
      *   **Vote "2 Species":** The distinct "Northern End" population is listed as *Endangered*. The highway is blocked in the North, saving that unique population. However, the Southern Valley populations are deemed "not distinct" and lose protection, allowing the highway to wipe out the **connecting link populations**.

  **The Trap:** If they prioritize reproductive continuity (BSC), they save the link but risk the distinct end. If they prioritize distinctness (Phylogenetic/Morphological), they save the unique end but destroy the link that makes it a ring.

  ---

  ### 2. The Case File (Handout Material)
  *Print this as a one-page dossier for each group.*

  **SUBJECT:** *Vermivora circumdata* (The Valley Warbler)
  **STATUS:** Taxonomic Review Required

  **GEOGRAPHY:**
  Populations form a continuous ring around the Great Basin.
  *   **Pop A (North):** Dark plumage, high-pitched song.
  *   **Pop B (East):** Intermediate plumage, mixed song.
  *   **Pop C (South):** Light plumage, low-pitched song.
  *   **Pop D (West):** Intermediate plumage, mixed song.
  *   **Closure:** Pop A and Pop C meet in the Southern Valley.

  **DATA PACKET:**
  1.  **Reproductive Compatibility:**
      *   A × B: Fertile hybrids common.
      *   B × C: Fertile hybrids common.
      *   C × D: Fertile hybrids common.
      *   D × A: Fertile hybrids common.
      *   **A × C (Southern Valley):** No mating occurs. Males sing different songs; females reject males. Genetic analysis shows no gene flow between A and C for 50,000 years.
  2.  **Morphology:**
      *   Gradual color shift around the ring.
      *   However, A and C differ in color as much as two recognized sister species in this genus.
  3.  **Genetics:**
      *   Mitochondrial DNA shows A and C form distinct monophyletic clades (separate branches on the tree).
      *   Nuclear DNA shows a gradient (cline) across B and D.

  **DECISION REQUIRED:**
  Does the Wildlife Agency recognize **One Species** (*V. circumdata*) or **Two Species** (*V. borealis* [Pop A] and *V. australis* [Pop C])?
  *Note: Intermediates (B & D) are classified with whichever species they are genetically closest to, or lose protection if split.*

  ---

  ### 3. The Rules
  1.  **Commitment:** Each group must submit a signed ballot with a binary vote (1 Species OR 2 Species).
  2.  **Justification:** On the back of the ballot, you must write the **Primary Rule** you used to decide (e.g., "We prioritized X over Y").
  3.  **No Compromise:** You cannot vote for "Subspecies." The law only recognizes "Species."
  4.  **Time Limit:** 10 Minutes to deliberate.

  ---

  ### 4. Minute-by-Minute Timeline

  | Time | Activity | Instructor Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Stakes** | Read the Payoff Scheme aloud. Emphasize the legal constraint: "The law protects Species, not Populations." Hand out Case Files. |
  | **05-15** | **Group Deliberation** | Circulate. If a group agrees too quickly, play devil's advocate: *"Are you sure? What about the data on page 2?"* Ensure they write their **Primary Rule** on the ballot. |
  | **15-20** | **The Vote** | Collect ballots. Tally on board. Ask one group from each side to state their **Primary Rule** (not their data, their *rule*). |
  | **20-35** | **The Debrief (Lecture)** | (See Section 5 below). Map their rules to Species Concepts. Draw the ring on the board. Demonstrate the transitivity failure. |
  | **35-45** | **The "So What?"** | Discuss purpose-dependence. Ask: "Which vote saves more genetic diversity? Which saves more individuals?" |
  | **45-50** | **Wrap & Limitations** | (See Section 6 below). Assign exit ticket: "Which concept would you use for bacteria? Why?" |

  ---

  ### 5. The Debrief Script (Mapping the Conflict)
  *This is where you land the plane. Do not simply explain; use their ballot justifications.*

  **Step 1: Map the Criteria**
  Write the groups' "Primary Rules" on the board. They will likely cluster into three buckets. Label them:
  *   *"They interbreed along the chain"* $\rightarrow$ **Biological Species Concept (BSC)**.
  *   *"The ends look different/are on different branches"* $\rightarrow$ **Morphological / Phylogenetic Species Concepts**.
  *   *"We need to save the unique end"* $\rightarrow$ **Conservation Pragmatism**.

  **Step 2: The Transitivity Trap (The Core Math)**
  Draw the ring on the board: **A — B — C — D — A**.
  *   Ask the BSC group: "Does A breed with B?" (Yes). "Does B breed with C?" (Yes).
  *   Write on board: **If A=B and B=C, then A=C.** (Property of Equality/Transitivity).
  *   Point to the data: "But the data says A does **not** breed with C."
  *   **The Point:** "Interbreeding" is not a transitive property. It cannot define a clean category. If you define species by interbreeding, a ring species breaks the logic of classification.

  **Step 3: Purpose Dependence**
  *   Ask the "2 Species" voters: "You saved the Northern population, but the highway destroys the Southern link. In 10,000 years, the ring is broken. Did you save the species or kill it?"
  *   Ask the "1 Species" voters: "You saved the link, but the distinct Northern genetic lineage might be swamped by development. Did you save the diversity?"
  *   **The Point:** There is no "true" answer. There is only the answer that best fits your **goal** (preserving process vs. preserving product).

  ---

  ### 6. Predictable Failure Points (Frank Advice)
  *Here is what will go wrong the first time you run this, and how to fix it.*

  **1. The "Subspecies" Compromise**
  *   **What happens:** Students hate binary choices. They will try to vote "1 Species, but with subspecies status" to dodge the stakes.
  *   **Fix:** Enforce Rule #3 ruthlessly. "The law does not recognize subspecies for funding. You must choose." If they write it on the ballot, mark it as "Abstain."

  **2. The "All Agree" Problem**
  *   **What happens:** In intro courses, students often defer to the "Biological Species Concept" because it's the first one they learned. Everyone votes "1 Species."
  *   **Fix:** During the deliberation (min 5-15), whisper to two specific groups: *"You are the Legal Team. Your mandate is to protect distinct genetic lineages, regardless of mating."* This forces a split in the room.

  **3. Confusing "Species" with "Population"**
  *   **What happens:** Students argue that A and C are just populations of one species, missing the point that the *definition* is what's at stake.
  *   **Fix:** In the debrief, explicitly distinguish between the *noun* (the group) and the *concept* (the definition). "You aren't arguing about the birds; you're arguing about the dictionary."

  **4. Running Over Time**
  *   **What happens:** The debate gets heated. You run out of time for the transitivity explanation.
  *   **Fix:** Cut the "Conservation Pragmatism" discussion short if needed. The transitivity failure is the non-negotiable learning objective. The conservation stakes are just the hook.

  ---

  ### 7. Limitations of the Activity
  *Be honest with your students (and yourself) about what this activity does not cover.*

  1.  **Rarity of Ring Species:** You must mention that true ring species (like *Ensatina* or *Larus*) are rare and often debated. This activity presents a "perfect" ring to make the logic clear, but nature is usually messier.
  2.  **Asexual Organisms:** This activity relies entirely on mating. It does not help you classify bacteria or asexual lizards. (This is why the Exit Ticket asks about bacteria).
  3.  **Temporal Isolation:** This is a spatial snapshot. It doesn't cover speciation through time (anagenesis).
  4.  **The "Real" Law:** The Endangered Species Act actually *does* allow for "Distinct Population Segments." You are simplifying the law to create a philosophical dilemma. Tell them this is a "Philosophical Court," not a real legal clinic.

  ### Instructor Prep Checklist
  *   [ ] Print 5 Case Files.
  *   [ ] Prepare 5 Ballots (slips of paper).
  *   [ ] Draw a blank circle on the whiteboard before class starts.
  *   [ ] Prepare a marker to write "A=B, B=C, A!=C" in red.
