answer: |-
  Here's the spec. You want a theory of specieshood that doesn't crumble when you poke it with a stick. Below are the six hard constraints any serious contender needs to handle, why they matter, and whether you can wave them away.

  ### 1. The "No Sex? No Problem" Constraint (Asexuals)
  **The Gist:** Your theory must apply to things that don't fuck. Bacteria, bdelloid rotifers, apomictic plants.
  **Why it matters:** If your definition relies on "interbreeding," you've just excluded a massive chunk of the tree of life. That makes "species" a eukaryotic privilege, not a biological universal.
  **Negotiable?** Only if you're willing to admit "species" is just a convenient label for sexual animals and we need a different word for bacteria. If you want one universal theory, this is non-negotiable.
  **Who it kills:** **Biological Species Concept (BSC).** Dead on arrival. BSC is built on reproductive isolation; asexuals have no reproduction to isolate. **Phylogenetic Species Concept (PSC)** survives this easily (lineages exist without sex).

  ### 2. The "Leaky Border" Constraint (Hybrid Zones)
  **The Gist:** Distinct groups swap genes constantly but don't merge into a homogeneous blob. Think wolves and coyotes, or various oak trees.
  **Why it matters:** Nature hates sharp lines. If your theory demands zero gene flow to count as separate species, almost nothing qualifies. If it allows unlimited gene flow, everything is one species. You need a threshold for "enough independence despite the leakage."
  **Negotiable?** Non-negotiable. This is reality. Ignoring it makes your theory a fantasy model.
  **Who it kills:** **BSC** takes a heavy hit here. It defines species by *isolating* mechanisms. If isolation is porous, the concept gets fuzzy. **PSC** handles it better if the lineages remain diagnosably distinct despite the leak, but struggles if hybridization creates a new, stable lineage (reticulation).

  ### 3. The "Ring of Fire" Constraint (Ring Species)
  **The Gist:** Population A breeds with B, B with C, C with D... but A and D meet at the end of the ring and *cannot* breed. (e.g., *Ensatina* salamanders).
  **Why it matters:** It breaks transitivity. If A=B and B=C and C=D, logic says A=D. But biology says A!=D. Your theory has to explain whether this is one species or four without arbitrariness.
  **Negotiable?** Technically negotiable if you claim ring species are vanishingly rare anomalies, but they are the logical stress-test for any boundary concept.
  **Who it kills:** **BSC** chokes hard. By its own rules, A and B are the same species, B and C are the same... so A and D must be the same. But they can't interbreed. Contradiction. **PSC** usually just splits them into separate species based on genetic distance, which solves the logic but feels like it ignores the biological continuity.

  ### 4. The "Counterfactual Meet-Cute" Constraint (Allopatry)
  **The Gist:** Two populations are separated by an ocean and never meet. They look identical. In a counterfactual world where the ocean dries up, *would* they interbreed?
  **Why it matters:** This is the philosophical core. Most species are allopatric (geographically separated). You can't test interbreeding if they never meet. Your theory must decide if specieshood is a *dispositional property* (they *could* breed) or a *historical property* (they *descended* from the same group).
  **Negotiable?** Non-negotiable. Most speciation happens in isolation. A theory that only works for sympatric (overlapping) species is useless.
  **Who it kills:** **BSC** relies on this counterfactual ("potential to interbreed"), which is untestable and metaphysical. How do you prove potential? **PSC** ignores the counterfactual and looks at actual history/DNA. It doesn't care if they *could* breed, only if they *did* share an exclusive ancestor recently.

  ### 5. The "Diagnosability" Constraint (Operationability)
  **The Gist:** A field biologist must be able to look at an organism (or its DNA) and assign it to a species without waiting 10,000 years to see if it evolves separately.
  **Why it matters:** If a species concept is theoretically perfect but practically impossible to use, it's philosophy, not science. We need to be able to point and say "that one."
  **Negotiable?** Non-negotiable for practical science. Negotiable for pure ontology (what exists vs. what we can know).
  **Who it kills:** **BSC** struggles here. Cryptic species look the same but don't interbreed. You can't diagnose them without breeding experiments. **PSC** loves this. It defines species by fixed, diagnosable traits (usually genetic).

  ### 6. The "Independent Fate" Constraint (Lineage)
  **The Gist:** A species must be a unit of evolution. It needs to be able to go extinct, adapt, or speciate independently of its neighbors.
  **Why it matters:** This is the evolutionary point of the whole exercise. If two groups aren't on separate evolutionary trajectories, calling them different species is just stamp collecting.
  **Negotiable?** Non-negotiable. This is the whole reason we care about species.
  **Who it kills:** Neither kills it outright, but they define "fate" differently. **BSC** says fate is sealed by gene flow (or lack thereof). **PSC** says fate is sealed by ancestry.

  ---

  ### The "Jointly Unsatisfiable" Problem
  Here's the bad news. You cannot satisfy **Diagnosability**, **Leaky Borders**, and **Independent Fate** simultaneously without contradictions, given what we know about gene flow.

  1.  **Discreteness vs. Continuity:** To satisfy *Diagnosability*, you need sharp boundaries (PSC strength). To satisfy *Leaky Borders* and *Ring Species*, you must acknowledge continuous gene flow (BSC strength). You can't have sharp boundaries where there is continuous gene flow.
  2.  **Process vs. Pattern:** The *Counterfactual Meet-Cute* requires judging a *process* (interbreeding potential). *Diagnosability* requires judging a *pattern* (current traits). In allopatric populations, the pattern might say "same" while the process (if they met) might say "different." You have to pick one: are species defined by what they *are* (pattern) or what they *do* (process)?
  3.  **The Time Lag:** *Independent Fate* takes time to establish. *Diagnosability* often picks up differences before reproductive isolation is complete, or misses reproductive isolation until it's too late.

  **Verdict:** You can have a theory that works for sexual vertebrates (BSC-ish) OR a theory that works for everything including bacteria and fossils (PSC-ish). You cannot have one theory that satisfies all six desiderata without resorting to "Species Pluralism" (admitting there is no single definition).

  ---

  ### Quick Failure Notes

  **The Biological Species Concept (BSC)**
  *   **The Pitch:** Species are groups of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups.
  *   **The Failure:** It's a zombie concept. It works great for sympatric birds and mammals. It dies instantly for asexuals, fossils, and allopatric populations where "potential" is a guess. It also collapses in ring species due to logical intransitivity. It treats species as *processes* (isolation), which is elegant, but unobservable in 90% of cases.

  **The Phylogenetic Species Concept (PSC)**
  *   **The Pitch:** A species is the smallest diagnosable cluster of individual organisms within which there is a parental pattern of ancestry and descent.
  *   **The Failure:** It's a splitters' paradise. Because DNA is so sensitive, every population with a unique mutation becomes a "species." It solves the asexual and fossil problem but creates taxonomic inflation (thousands of new "species" that don't act like independent evolutionary units). It ignores the *mechanism* of speciation (gene flow) in favor of the *pattern* (diagnosability), meaning it might label two groups as different species even if they would happily merge if brought together.
