  | :--- | :--- | :--- | :--- |
  | Higher violence rates in NZ vs Nordic | Mechanism/Ranking | Fatal | Yes |
  | Contracts used for debt bondage | Mechanism | Fatal | Yes |
  | Street safety better under Nordic | Scope/Ranking | Serious | Yes |
  | Stigma unchanged in NZ | Mechanism | Awkward | No |

  4. Decisive defeaters
  Fatal evidence would show legibility actively harming workers. Example: Contracts used not for protection but for specific performance clauses that bind workers to exploitative managers, where the state enforces the debt rather than the safety. If New Zealand shows higher rates of trafficking convictions because trafficking is easier to hide in a deregulated market compared to licensed brothels where inspections occur, your ranking flips. If Nordic countries demonstrate lower homicide rates for sex workers despite lower legibility, it suggests demand reduction outweighs evidentiary benefits. This would imply your mechanism ignores the volume effect: fewer transactions might mean fewer victims even if each transaction is riskier. Furthermore, if legibility increases police harassment without increasing safety, the mechanism fails. You must also confront data where informal networks provide better protection than state institutions. If workers report higher trust in peer networks than courts, legibility loses its value proposition. The mechanism assumes the state is a benevolent enforcer; evidence of state predation falsifies this. Additionally, if legalization leads to market consolidation where large agencies capture all the legibility benefits while independent workers are squeezed out, the net welfare gain could be negative. You need to show that legibility distributes power to workers, not just to compliant businesses. If data shows that visible records make workers easier targets for blackmail by bad actors who access those records, the mechanism is inverted.

  5. Merely awkward defeaters
  Awkward evidence includes high stigma persisting in New Zealand. You can argue legibility works despite culture, but it weakens the claim that decriminalization automatically improves social standing. If German licensing protects licensed workers perfectly, you admit your ranking applies only to the marginal worker, which limits the policy's universal appeal. If street workers in New Zealand see no benefit, you retreat to the scope condition, but this admits the policy fails the most vulnerable. These are survivable because they refine the boundary conditions rather than breaking the causal link. They suggest legibility is necessary but not sufficient, or that it requires complementary anti-stigma work. Another awkward result is if client deterrence in Nordic models reduces overall violence simply by shrinking the market, even if per-transaction risk rises. You can absorb this by distinguishing total harm from individual risk. Similarly, if administrative burdens in Germany are lighter than expected, you adjust the weighting of the exclusion argument. These outcomes do not prove legibility useless, only that it operates alongside other variables like culture and market size. You might also find that tax compliance lowers net income significantly, making workers prefer the informal economy despite higher risk. This suggests economic incentives can override safety benefits, requiring you to add income stability to your model.

  6. Concessions from the home team
  Defenders must concede that legibility requires trust in police. If police are corrupt, records become weapons used for blackmail rather than protection. You must admit the Nordic model may reduce overall market size, which has utilitarian value even if per-worker safety drops. You must acknowledge that ability to enter the formal sector is often determined by immigration status, which sex-work law does not fix. A migrant worker cannot sign a legal contract if they are deportable. Critiques about correlation are valid if enforcement intensity is not controlled for. A defender cannot claim legibility causes safety if safer countries simply enforce laws better regardless of the model. You must also concede that some workers prefer anonymity for safety from family or community, making legibility a net negative for them. This validates the scope condition but limits the policy's universal appeal. Accepting these points strengthens credibility by acknowledging trade-offs rather than claiming a free lunch. You must also admit that data quality varies wildly between nations, making direct comparison hazardous. Self-reported safety data is notoriously unreliable across different legal contexts.

  7. Insulation audit
  The scope condition is dangerously elastic. If you define able to enter as those who benefited, it is tautological. To be falsifiable, you need an ex-ante metric of formality potential, like the percentage of indoor versus street work before reform. If ninety percent of the market is street-based and unhelped, claiming victory because the ten percent indoor workers are safer is misleading. It is a reasonable feature only if you explicitly weight the policy success by the proportion of the population served. Otherwise, it is degenerative. You risk creating a theory that predicts success for the privileged and ignores the marginalized, then calls itself a general policy solution. To avoid unfalsifiability, you must specify what percentage of the workforce must be reachable for the policy to count as a success. Without this, the scope condition insulates the view from all negative outcomes regarding vulnerable groups. You should treat the scope condition as a cost-benefit constraint: if the excluded population is too large, the policy is a failure regardless of formal sector gains. This prevents you from claiming a policy victory when only a tiny elite is protected.

  8. Final verdict
  Keep the mechanism, qualify the ranking. The Legibility Mechanism is a valuable heuristic for institutional design. However, treat the New Zealand versus Nordic ranking as contingent on local enforcement capacity and market structure. Tighten the scope condition to require a minimum threshold of workers reached. Do not abandon the view, but stop treating it as a universal hierarchy; it is a conditional one. Your insight about records is robust, but your confidence in the regime ranking exceeds current evidence. Use the mechanism to analyze specific jurisdictions rather than prescribing a global order. This preserves the analytical value while reducing exposure to empirical falsification. You should maintain prescriptive humility regarding which model fits which context.
