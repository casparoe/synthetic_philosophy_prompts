  The following table categorizes challenges by whether they break the theory or just bruise it. Fatal defeaters destroy the causal link between legibility and safety. Serious defeaters overturn the regime ranking without killing the mechanism. Awkward defeaters are noise a defender can explain away. A fair-minded defender must concede fatal and serious points if evidenced, whereas awkward points only require scope refinement.

