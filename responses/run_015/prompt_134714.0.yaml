  Someone courts **DEATH** (6)
  To earn the **WAGE** (4)
  That buys another **HOUR**. (1)
  Of someone else's **WORK** (2)
  To keep the **SABBATH**. (5)

  **SABBATH** (5) means the trains run.
  Her quiet **REST** (3)
  Needs strangers' **WORK** (2)
  Who flirt with **DEATH** (6)
  To sell her back the **HOUR** (1)
  At any **WAGE**. (4)

  No **WAGE** (4) can buy **SABBATH** (5)
  When every clock strikes **HOUR**. (1)
  And everyone takes **REST**. (3)
  Then who prevents **DEATH** (6)
  From stopping all the **WORK**? (2)

  **WORK** (2) signals you stay.
  Beyond the living **WAGE**. (4)
  Closer to **DEATH** (6)
  Than any promised **SABBATH**. (5)
  She sacrifices **REST** (3)
  To save the **HOUR**. (1)

  *Envoi*

  The signal is the **WORK**, (2) not the **WAGE**. (4)
  **SABBATH** (5) keeps the passing **HOUR**. (1)
  Where silent **DEATH** (6) purchases **REST**. (3)

  ***

  The poem leans hardest on the second premise: leisure's dependency on others' labor. The imagery of trains running and lights staying on makes the abstract "comparative value" concrete. A Protestant work ethic believer would argue I've cheated by equating stewardship with mortality. They'd say the "signal" of staying late isn't fear, but vocation—that the work itself sustains the soul, whereas my poem suggests it only sustains the system that kills it. I offer no redemption, only the trap.
