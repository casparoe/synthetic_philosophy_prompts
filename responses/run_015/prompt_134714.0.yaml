  *   **The Turn:** The pivot must land in stanza four. Stanzas one through three establish the physical toll and the individual's desire to leave. Stanza four needs to reveal the trap: the quiet she wants (the train running, the shop open) requires someone else to be working. If everyone leaves, the silence collapses. This shifts the blame from "greedy boss" to "structural necessity."
  *   **The Last Line:** It cannot sound like liberation. If it ends on *REST*, it must feel heavy. *DEATH* must be the agent purchasing it. The image should be transactional, not redemptive. The clock keeps ticking; the rest is borrowed, paid for by the very mortality the worker is risking. It's a truce, not a victory.

