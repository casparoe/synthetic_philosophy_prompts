answer: |-
  Here is your Q&A prep sheet. It is structured to help you navigate the specific fault lines in that room.

  ### **The Pre-Emptive Strike (Slide 2)**
  **Put this up before you even state the thesis.**
  *   **The Text:** "Optimality models are excellent at explaining *maintenance*. They are silent on *origination*. This talk is about the inference gap between the two."
  *   **Why:** This disarms the behavioural ecologists immediately. You aren't telling them their models are useless; you're telling them they are being asked to do a job they weren't designed for. It frames the debate as *scope of inference*, not *ideological war*.

  ---

  ### **The 8 Objections (Ordered by Likelihood & Damage)**

  #### **1. The Behavioural Ecologist (The "Straw Man" Charge)**
  *   **The Question:** "Look, we know current utility isn't proof of origin. That's Intro Bio 101. In practice, when we build an optimality model, we're testing if the trait *matches* the optimum, not just if it's useful. If it matches, we infer adaptation. If it doesn't, we look for constraints. What's new here?"
  *   **The 2-Minute Reply:** "You're right that the *textbook* definition includes that caveat. But look at the *practice*. When a model fits, the paper concludes 'this behaviour is an adaptation for X.' When it fails, we tweak the cost parameters until it fits. We rarely ask: 'Would this behavioural slot exist if this specific mechanism hadn't evolved?' You test alternative *functions*, I'm asking you to test alternative *histories of the slot*. The model confirms maintenance, but you're publishing it as a history of origin."
  *   **Concede:** "I concede that the best practitioners do know this. But the literature is full of 'Adaptation for X' titles based on synchronic fit."
  *   **Soft Spot:** If they pull up a specific paper where they explicitly modelled the null hypothesis of 'no slot,' you have to admit that exists but argue it's the exception, not the rule.

  #### **2. The Population Geneticist (The "Falsifiability" Charge)**
  *   **The Question:** "Your 'vacancy test' is a counterfactual. I can't measure a counterfactual. I need selection coefficients. If you can't give me an effect size for the 'cost of the slot,' this is just storytelling. How is this falsifiable?"
  *   **The 2-Minute Reply:** "It's not a model; it's a burden of proof. I'm not asking you to measure the vacancy; I'm asking you to stop claiming adaptation until you've ruled it out. Think of it like a null hypothesis in statistics. You don't 'measure' the null; you assume it until the data forces you to reject it. Currently, the field assumes 'Arch' (adaptation) by default. I'm saying the default should be 'Tenant' until the vacancy test is passed."
  *   **Concede:** "You're right, it lacks a quantitative threshold. That's a limitation of the current framework."
  *   **Soft Spot:** They will press on *how* to reject the null without equations. If you can't point to a statistical test, they will dismiss this as philosophy, not science. **(Flag: This is the 'unwritten paper' zone. You need a quantitative proposal here eventually.)**

  #### **3. The Philosopher (The "Exaptation" Distinction)**
  *   **The Question:** "Gould and Vrba (1982) already distinguished adaptation from exaptation. Exaptation is a trait co-opted for a use other than the one for which it was built. Your 'Tenant' sounds identical. Why do we need a new term? Are you just re-branding exaptation?"
  *   **The 2-Minute Reply:** "Exaptation focuses on the *trait's* history (it did job A, now it does job B). 'Tenant' focuses on the *slot's* independence. A Tenant trait moves into a functional space that would have existed *even if the trait never evolved*. Exaptation allows that the slot was created by the trait's previous function. Tenant says the slot is structurally or ecologically inevitable. It's a stronger claim about the environment/organism interface than standard exaptation."
  *   **Concede:** "There is significant overlap. Tenant is a subset of exaptation."
  *   **Soft Spot:** If they argue that *all* exaptations imply a pre-existing slot, your distinction collapses. You need to be ready with a case where exaptation applies but Tenant does not (e.g., a trait built for A is co-opted for B, but B didn't exist as a 'slot' until the trait arrived).

  #### **4. The Evo-Devo Person (The "Mechanism" Charge)**
  *   **The Question:** "You talk about 'slots' and 'architecture.' In evo-devo, we call this pleiotropy or developmental constraint. If a trait is a Tenant, isn't that just saying it's a byproduct of a developmental module that was selected for something else? Why not just use the mechanistic language we already have?"
  *   **The 2-Minute Reply:** "Pleiotropy explains why the *gene* is there. Tenant explains why the *functional niche* is there. You can have a Tenant without pleiotropy if the slot is ecological. For example, a cavity in a bone (structural) allows a muscle to route through it (Tenant). The muscle didn't cause the cavity, and it's not pleiotropic with the bone growth genes. It's exploiting a structural inevitability. I need the functional category, not just the genetic one."
  *   **Concede:** "In many biological cases, they will overlap. But not all."
  *   **Soft Spot:** If they ask for a molecular example where Tenant and Pleiotropy diverge, you might struggle. Keep it morphological/ecological.

  #### **5. The Behavioural Ecologist 2 (The "Does It Matter?" Charge)**
  *   **The Question:** "Okay, suppose you're right. It's a Tenant. Selection is still maintaining it now. So what? For predicting how the population responds to environmental change, does it actually matter if it was an Arch or a Tenant 10,000 years ago?"
  *   **The 2-Minute Reply:** "Yes, because it tells you about evolvability. If it's an Arch, the trait is tightly integrated with the selection pressure. If the pressure changes, the trait changes. If it's a Tenant, the trait is sitting in a slot. If the slot disappears, the trait might vanish instantly, or it might be highly labile because it was never 'built' for stability. It changes your prediction about robustness."
  *   **Concede:** "For short-term dynamics, maybe not. For long-term evolutionary trajectories, yes."
  *   **Soft Spot:** This is a weak argument. Often, current selection dominates history. Be prepared to admit this is more about *explanation* than *prediction*.

  #### **6. The Philosopher 2 (The "Methodological Adaptationism" Charge)**
  *   **The Question:** "Godfrey-Smith sorted this out. We have 'Empirical Adaptationism' (most traits are adaptations) vs. 'Methodological Adaptationism' (start by assuming they are). You seem to be attacking Methodological Adaptationism. But that's just a heuristic. Why treat it as a vice?"
  *   **The 2-Minute Reply:** "Because heuristics become dogma. When 'Methodological Adaptationism' becomes the *only* published null hypothesis, it biases the literature. I'm not saying don't use the heuristic. I'm saying publish the failure of the vacancy test. If you can't show the slot was contingent, label it 'Maintenance Adaptation' not 'Historical Adaptation'."
  *   **Concede:** "Heuristics are necessary. But they shouldn't dictate terminology."
  *   **Soft Spot:** This is a normative claim about publishing standards, which is hard to defend empirically.

  #### **7. The Grad Student (The "How-To" Charge)**
  *   **The Question:** "I'm studying bird song. How do I run a vacancy test on Monday? I can't rewind evolution. Do I just knock out the gene and see if the niche disappears?"
  *   **The 2-Minute Reply:** "Use phylogenetics. Map the trait and the 'slot' (e.g., the acoustic space or the neural circuitry) onto a tree. Did the circuitry evolve *before* the song? If yes, the song is a Tenant in that circuit. Or, look at developmental mutants. If the song center is gone, does the bird still have the capacity to learn *something*? If the capacity remains, the slot was pre-existing."
  *   **Concede:** "It's hard. It requires comparative data you might not have."
  *   **Soft Spot:** This is the practical bottleneck. If the test is too hard, nobody will do it.

  #### **8. The Pop Gen 2 (The "Effect Size" Follow-up)**
  *   **The Question:** "You keep saying 'selection maintains it.' If selection is maintaining it, there must be a fitness cost to losing it. If that cost is small, it's effectively neutral. If it's large, it's an adaptation. Where is the cutoff? What's the effect size of 'Tenant-hood'?"
  *   **The 2-Minute Reply:** "There is no cutoff. That's the point. A Tenant can have a huge fitness benefit now. The 'effect size' of the history is binary: did selection create the slot? Yes or No. The current selection coefficient is irrelevant to the historical question."
  *   **Concede:** "I understand the frustration with non-quantitative categories."
  *   **Soft Spot:** This is your weakest point scientifically. Biologists love continuous variables. You are offering a binary historical claim.

  ---

  ### **The "Must Land" Reply**
  **The Distinction between Maintenance and Origin.**
  If you fail to convince them that *current utility* $\neq$ *historical origin*, the talk dies.
  *   **The Soundbite:** "Selection is a editor, not just an author. It can keep a typo in the text because it happens to rhyme (Tenant), but that doesn't mean the author wrote it for the rhyme (Arch). We need to stop confusing the editor's approval with the author's intent."

  ---

  ### **The Weakest Category: "Tenant"**
  **Why:** It is your novel contribution, but it risks collapsing into "Exaptation" or "We don't know the history."
  **How to Defend:**
  *   Don't defend it as a *frequency* claim (i.e., "most things are Tenants").
  *   Defend it as a *logical possibility* that is currently being ignored.
  *   **Strategy:** Use a physical analogy. "A bird nesting in a tree hollow. The hollow exists due to decay (structural inevitability). The bird is adapted to the hollow. But the hollow is not an adaptation for the bird. That is a Tenant. Now apply that to physiology."
  *   **If attacked:** Concede that identifying Tenants is hard, but argue that *assuming* Arch is harder to justify.

  ---

  ### **The "Fair Objection / Unwritten Paper" Flag**
  **The Quantification Problem (Objection 2 & 8).**
  *   **When to say it:** If the Pop Gen people gang up on the lack of equations.
  *   **What to say:** "That is a fair objection. This framework is currently qualitative. My next project is to model the 'vacancy probability' as a parameter in a phylogenetic likelihood framework. I don't have those equations today, but I agree that's where this needs to go to be useful for your work."
  *   **Why:** It shows you respect their rigor without pretending you have the math ready now.

  ---

  ### **The Question You Hope Nobody Asks**
  *   **The Question:** "Can you give me one concrete example from the literature where applying the 'Tenant' view changed a biological conclusion, rather than just changing the label?"
  *   **Why it kills you:** If you say "The human chin" (classic spandrel), they'll say "That's Gould's old news." If you say "Bird song," they'll ask for the data (see Grad Student objection). If you don't have a *success story* where this view led to a new discovery or corrected a major error, they will view this as purely semantic tinkering.
  *   **Prep:** Have a backup case study ready. Ideally something where assuming 'Arch' led to a failed prediction (e.g., trying to optimize a trait that turned out to be a structural constraint). If you don't have one, admit it: "I'm proposing the tool; I'm inviting you to use it to find the cases." (Risky, but honest).
