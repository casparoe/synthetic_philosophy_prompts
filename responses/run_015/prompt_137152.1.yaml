      *   *Analyzing the Tension:* The Nuclear grant (tiny impact) suggests they aren't strict EV maximizers *unless* the cost was also tiny. The Resilience grant suggests they care about *recovery value*, not just survival. The Settlement offers survival but kills recovery value.
      *   *Closest Analogue:* The Civilisational Resilience Project. It's the direct counterpoint. One says "recover fast," the other says "survive slow."
