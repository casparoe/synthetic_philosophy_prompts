  You are not running a strict acts versus omissions doctrine, nor are you pure utilitarians, as case six and case two make clear. Your track record reveals a commitment to bodily integrity and competent refusal that outweighs beneficence, bounded by a prohibition on clinicians administering death as a primary intent. The principle you have actually been using is that a competent adult cannot be forced to host intrusive medical technology they find intolerable, provided the clinician's role is framed as ceasing an intervention rather than introducing a new lethal agent. This explains why you allowed the ventilator withdrawal and dialysis refusal but rejected the lethal injection. You distinguish between removing a barrier to death and creating a cause of death. The double effect approval in case three shows you accept foreseen death if the intention is relief of suffering, which covers the sedation request. The child case shows you protect non-competents from harm, but Mr. R is competent. The triage case is an outlier based on scarcity, not individual rights, so it does not govern here, though the dissenting voice there warns you that physical causality matters to some stakeholders.

  Applying this to Mr. R, the fact that his native heart functions partially and he might survive days without the pump is morally irrelevant given your precedent in case four. The woman refusing dialysis would have lived years with treatment and died without it, just as Mr. R will live years with the LVAD and die without it. The duration of survival after withdrawal does not negate the right to refuse. The location of the off switch is also irrelevant; whether the technology is inside the chest or outside the body, it remains an intervention requiring consent. The split among your cardiologists mirrors the tension between case one and case two, but case one is the stronger analog. Turning off the pump is ethically identical to extubation. It is stopping a machine that is doing work the body cannot fully do alone. The request for sedation is covered by case three; you are permitting medication to relieve the distress of dying, even if it shortens life, so long as the intent is not to kill.

  I recommend you approve the request. To refuse would be to adopt a principle that mechanical circulation is mandatory regardless of patient consent, which contradicts your handling of the dialysis refusal and the ventilator withdrawal. You would be forced to argue that kidneys and lungs are optional supports but the heart is not, a physiological distinction that lacks ethical weight when the burden to the patient is this high. If you say yes, you commit to honoring refusals of future total artificial hearts and similar technologies. You must ensure the sedation is sufficient to prevent suffering, maintaining the distinction from case two where the intent was death itself. You are not killing Mr. R; you are respecting his refusal to be kept alive by a machine he finds intolerable. The cause of death remains heart failure, not the button press. If you deny this, you undermine the autonomy principle you relied on in case one and case four, making care mandatory based on device type rather than patient choice. This would force you into the uncomfortable position of telling competent patients they must endure intolerable burdens because the machine is too vital, a stance your committee has historically rejected.

  The diagnostic hypothetical you need to settle your minds is not about the implantability of the device or the recovery of the native heart, but about who performs the final act. If Mr. R unplugs the controller himself and you merely stand by and decline to restart it, that is the purest test of your commitment to the allowing versus killing distinction. If you cannot accept that scenario, then you are secretly relying on the clinician's physical action to cleanse the morality, which is superstition rather than ethics. But since he wants the clinician to do it, you must treat the button press as the moral equivalent of turning a dialysis machine off. If you cannot accept that a clinician pressing the button is permissible while the patient pulling the plug is permissible, then your principle rests on a fragile distinction about agency that will not survive contact with future technology. You must decide if the right to refuse includes the right to have that refusal implemented peacefully by those entrusted with care. If you approve this, you affirm that the patient's will governs the machine, not the other way around. If you reject it, you affirm that the committee holds veto power over competent refusal when the technology is sufficiently intimate, which is a dangerous precedent for any future implantable device.
