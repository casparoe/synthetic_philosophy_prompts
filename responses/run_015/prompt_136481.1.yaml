answer: |-
  In biological systems, we observe that the function of an organ cannot always be predicted by analyzing its constituent cells in isolation; the living tissue possesses emergent properties that arise only from specific structural relationships. G. E. Moore's principle of organic unity in ethics mirrors this observation. He argued that the intrinsic value of a complex whole—such as a beautiful landscape or a deep friendship—is not merely the sum of the values of its parts. For a retired biologist turning to moral philosophy, this suggests that value theory must accommodate non-linear dynamics similar to those found in complex adaptive systems. An adequate theory of intrinsic value must therefore satisfy a specific set of desiderata that respect both the holistic nature of goods and the empirical realities of human psychology.

  The first and most critical requirement is **Non-Aggregative Valuation**. A theory must explain how the value of a whole can exceed or differ from the arithmetic sum of its isolated components. The motivating case is Moore's own example: a beautiful world existing without consciousness might have little value, and consciousness alone might have little value, but consciousness appreciating beauty possesses immense value. This is not additive; it is synergistic. This condition is non-negotiable for any theory claiming to take Moore's insight seriously.

  Second, the theory must account for **Relational Asymmetry**. It must distinguish between the value of passive aesthetic appreciation and the value of active interpersonal engagement. The motivating distinction lies between viewing a majestic landscape and sustaining a friendship. In the landscape, the value resides primarily in the subject's contemplation of the object. In friendship, the value is co-constituted; it requires reciprocal recognition and shared agency. A theory that treats friendship as merely two individuals experiencing pleasure side-by-side fails to capture the constitutive role of the relationship itself. This is a non-negotiable condition for capturing interpersonal goods.

  Third, the theory must address **Downward Causation of Value**. In biology, emergent traits (like an organism's behavior) can causally influence lower-level processes (like cellular activity). In value theory, this translates to whether the value of the whole confers or alters the value of the parts. For example, does a specific action gain value because it occurs within a virtuous friendship, even if the action itself is neutral? A naturalistic theory might demand this causal power, while non-naturalistic accounts often struggle to explain how value properties influence physical events. This is a camp-specific preference, leaning toward naturalism.

  Fourth, the theory must maintain **Empirical Consistency**. It cannot contradict established findings in aesthetics or social psychology. For instance, research on "flow" states or shared intentionality suggests that value experiences are context-dependent and often rely on perceived unity. A theory that posits value exists independently of psychological capacity for integration would contradict these findings. This is non-negotiable for a philosophically robust naturalism.

  Fifth, the theory must provide **Action Guidance**. While value may be holistic, moral agents must still make decisions. The theory cannot render calculation impossible. The motivating case is the tragedy of incommensurability: if no values sum, how does one choose between saving a masterpiece or a friend? A theory that dissolves into total particularism fails as a guide for living. This is non-negotiable for a moral theory.

  However, there is a significant tension within these requirements. The subset comprising **Non-Aggregative Valuation** and **Action Guidance** is jointly unsatisfiable in a strict sense. If value is truly organic and non-summatic, standard maximization procedures fail. One cannot calculate the best outcome if the value of the outcome depends on holistic configurations that cannot be broken down for comparison. Moore himself acknowledged this, suggesting we rely on intuition, but this offers little procedural guidance. This tension forces a compromise: either we loosen the strictness of non-aggregativity or we accept limited action guidance.

  When we score existing frameworks against these criteria, distinct patterns emerge. Moore's own holism meets the Non-Aggregative and Relational Asymmetry requirements beautifully, respecting the unique quality of complex goods. However, it fails Action Guidance, leaving agents without a calculus for decision-making, and it fits awkwardly with Downward Causation, as Moore's non-natural value properties lack causal power. Hedonist reductionism excels at Action Guidance, offering a clear calculus of pleasure sums, but it fails Non-Aggregative Valuation and Relational Asymmetry, reducing friendship to individual mental states. Preference-satisfaction accounts meet Action Guidance and handle individual variance well, but they fail Empirical Consistency regarding objective aesthetic goods and fit awkwardly with Relational Asymmetry, as preferences can be solitary and do not necessitate the reciprocal structure of friendship.

  Ultimately, the most exclusive requirement is Non-Aggregative Valuation. It is the gatekeeper that separates holistic theories from reductionist ones. Any theory that satisfies this must fundamentally rethink how value is measured, moving away from arithmetic models toward topological or systemic ones, much like the shift from reductionist genetics to systems biology.

