answer: |-
  ### The Matched Pair

  **Case A: The Private Escrow (Personal)**
  Eleanor, a freelance graphic designer, wishes to save for a house deposit but knows she succumbs to impulse spending when stressed. At *t1*, she voluntarily signs a contract with a private escrow firm, 'LockStep'. She transfers £20,000 into a locked account; if she requests early release before five years, the funds are forfeited to LockStep as a penalty fee. Eleanor understands at *t1* that at *t2* she will desperately want the money for non-essential reasons she currently deems worthless, and she accepts this loss as the price of discipline. LockStep is a third-party enforcer. Crucially, the contract stipulates that only Eleanor can authorise a release or lodge a complaint against LockStep's interpretation of the terms. At *t2*, when the stress arrives, she is the sole monitor of the enforcer who profits from her failure.

  **Case B: The Endowment Lock (Institutional)**
  The trustees of a small housing charity, fearing short-term political pressure to divert funds, vote at *t1* to amend their governing document. They entrench a rule that the capital endowment cannot be spent, only the interest, reversible only by a two-thirds vote and Charity Commission approval. They foresee at *t2* they will face intense pressure to spend the capital on a crisis, which they currently deem a catastrophic error for the charity's long-term mission. The rule is enforced by the courts and the Commission. Crucially, the beneficiaries (tenants) and the regulator have independent legal standing to monitor the trustees' compliance and challenge any breach. The bound agents (trustees) are distinct from the monitoring principals (beneficiaries/regulator).

  ### The Rival Accounts

  **1. The Diachronic Autonomy Account**
  *Standard View:* This account holds that precommitment is justified when the *t1* will legitimately extends across time to govern the *t2* self. Normally, this strongly favours **Case A** (Eleanor's autonomous choice binds her) and is sceptical of **Case B** (the 'dead hand' of past trustees binding future ones).
  *Reversed Verdict:* In this pair, the Diachronic Account must reject **Case A**. Autonomy is not merely the enactment of a past preference; it requires a functional system of self-governance. Because Eleanor is the sole monitor of an enforcer who profits from her failure, she has alienated her agency entirely rather than constraining it. The *t1* will has created a tyranny that *t2* cannot check, violating the continuity of autonomy required for the 'extended will' to remain legitimate. Conversely, it accepts **Case B**. The charity's corporate will is a diachronic entity; because the monitoring is distributed to beneficiaries, the *t1* mandate is preserved without alienating the agency of the *t2* trustees, maintaining the integrity of the corporate will over time.

  **2. The Contemporaneous-Incentive Account**
  *Standard View:* This account argues precommitment is only justified if it restructures incentives for *present* agents to solve an agency problem. Normally, this favours **Case B** (trustees are agents for beneficiaries) and is indifferent to **Case A** (one cannot have an agency problem with oneself).
  *Reversed Verdict:* Here, the account rejects **Case A** because there is no *other* present agent whose incentives are being aligned. LockStep's incentives are aligned against Eleanor, and Eleanor cannot monitor them. It is a market transaction, not a governance solution. It accepts **Case B** because the entrenchment clause successfully restructures the incentives of the *t2* trustees by empowering the beneficiaries to monitor them. The precommitment device works not because of *t1*'s will, but because it creates a viable check on *t2* agents by *t2* principals.

  ### The Structural Feature

  The single feature doing the work is **Distributed Monitoring Authority**.
  In **Case A**, the Bound Agent and the Monitoring Principal are identical (Eleanor). In **Case B**, they are distinct (Trustees vs. Beneficiaries). This feature determines whether the enforcement mechanism creates a check-and-balance or a conflict of interest.

  ### The Collapse Test

  If we remove **Distributed Monitoring Authority**, the verdicts collapse back to the standard view.
  *   *Institutional Collapse:* If we amend **Case B** so that beneficiaries have no standing to challenge the trustees (removing distributed monitoring), the entrenchment becomes a pure 'dead hand' constraint. The Institutional case becomes unjustified, as there is no check on the *t1* trustees' power over *t2*.
  *   *Personal Collapse:* If we amend **Case A** so Eleanor appoints an independent ombudsman with power to override LockStep if they are acting unreasonably (introducing distributed monitoring), the Personal case becomes justified. The enforcer is now checked, and Eleanor's autonomy is preserved alongside her commitment.

  ### The Strongest Objection

  A defender of the Diachronic Autonomy Account (which fares badly on the personal case here) would argue: **"Sovereignty of the Waiver."**
  They would contend that you are imposing a paternalistic structural requirement on what counts as autonomy. If Eleanor voluntarily waives her right to monitor the enforcer at *t1*, that waiver is itself an exercise of autonomy. To say she *cannot* waive her right to check the enforcer is to say she owns herself less than she claims. You are protecting her from her own *t1* sovereignty by demanding she retain a 'safety valve' she explicitly chose to destroy. The account should respect the *t1* decision to alienate that monitoring power, however risky, because respecting the agent's will at the moment of commitment is the definition of autonomy.

  ### Conclusion: General or Rigged?

  I have not rigged the cases in the sense of smuggling in forbidden criteria (like 't2 knows better'), but I have isolated a specific *mechanism* of precommitment: **delegated enforcement**.
  This pair shows something general about precommitment devices that rely on third-party enforcers (banks, lawyers, apps, constitutions). In those contexts, the legitimacy of the bind depends heavily on who watches the watcher. However, this does not generalise to *all* precommitment. If Eleanor simply hides her own credit card in a block of ice (self-enforcement), the monitoring problem vanishes, and the Personal case becomes justified again without distributed monitoring. So, the pair reveals a crucial vulnerability in *delegated* precommitment, but it does not prove that personal precommitment is inherently inferior to institutional entrenchment. It proves that **governance structures matter more than the identity of the binder.**
