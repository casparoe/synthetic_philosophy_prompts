answer: |-
  **The Case**
  A residential microgrid relies on a backup diesel generator that emits health-damaging particulates whenever it runs above 50% capacity. Due to neighbors' essential medical equipment, baseline demand is locked at 90% during peak hours, ensuring the generator stays in the high-emission "Performance Mode" regardless of your usage. You turn on your air conditioning; the generator's output, fuel consumption, and particulate dispersion remain physically identical to the scenario where you abstain, as the system regulates output to match the fixed high demand rather than marginal input. However, drawing power requires manually switching your breaker to the "Performance" line, formally routing your consumption through the high-emission channel rather than disconnecting, thereby registering your load as part of the collective demand sustaining the toxic mode.

  **The Verdicts**
  The **pure inefficacy view** (causal consequentialism) judges the act permissible: since the particulate matter released and the resulting health risks are invariant to your choice, you have caused no harm, and moral responsibility tracks causal difference-making. The **participatory view** judges the act wrong: by switching your breaker, you constitute yourself as a co-agent of the harmful practice, sharing responsibility for the collective output regardless of marginal impact. They split because the inefficacy view locates wrongness in *outcome alteration*, while the participatory view locates it in *joint agency*—you are not merely a bystander to the neighbors' harm, but a member of the collective body producing it.

  **The Key Feature & The Counter-Attack**
  The feature doing all the work is the **overdetermined threshold**: the harm mechanism is binary and already triggered by others, decoupling individual input from marginal output. If you remove this overdetermination (e.g., if you were the 50% threshold tipper), the case collapses into standard consequentialism where both views agree. A defender of the inefficacy view would attack the participatory judgment by arguing it smuggles in **expected-outcome reasoning**: they would claim that calling your act "wrong" only makes sense if you assign non-zero probability to being the threshold-tipper or if you generalize your maxim (rule-consequentialism). They will accuse the participatory account of "moral fetishism," arguing that without causal leverage, your "complicity" is merely expressive symbolism masquerading as substantive responsibility.
