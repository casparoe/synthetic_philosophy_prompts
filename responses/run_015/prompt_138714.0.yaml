  Here is a draft for your handout, designed to be printed on a single sheet (double-sided if necessary). It incorporates your insights about the "porous" dream and the Limbo time dilation without getting bogged down in jargon.

  Following the handout, I've included a **Facilitator's Note** just for you. This section addresses the specific philosophical questions you raised at the end of your prompt (regarding guilt, the film's ontological needs, and the "porous" mechanic) to help you steer the post-film discussion.

  ***

  # HANDOUT TEXT

  **LIBRARY SCI-FI FILM NIGHT: INCEPTION**
  **Topic:** *The Reality of the Dreamt Life*

  **The Common Assumption**
  When we watch *Inception*, we accept a basic premise: when a character enters a dream, they are having an experience in real-time. If they spend five minutes in the van, they spend an hour in the hotel. If they spend years in Limbo, they age and suffer and remember those years. We treat the dream as a place you *go*, not just a story you *tell*.

  **The Philosophical Objection**
  Philosophers of mind have long argued that this "common sense" view might be wrong.
  *   **The Skeptic (e.g., Norman Malcolm):** Dreams are not experiences that happen *during* sleep. There is no "movie" playing in your head while you are unconscious. The only thing that makes a dream "true" is the report you give when you wake up. If you say you dreamt of falling, you did; if you say you didn't, you didn't. Nothing actually happened in the night.
  *   **The Empiricist (e.g., Daniel Dennett):** It is possible the brain assembles the dream at the very moment of waking, filing it into memory as if it had happened earlier. In this view, the dream is a "retroactive construction." It feels like an experience, but it was written at the end, not lived through in sequence.

  **How *Inception* Plays with This**
  The film mostly assumes the "Common Assumption" (dreams are real-time places). However, two mechanical devices in the film complicate this:

  1.  **The Porous Dream (The Kick):** In the film, a physical jolt in the real world (a "kick") appears as content inside the dream (a falling elevator, a van driving off a bridge). This looks like the dream is being assembled at the moment of waking to account for external stimuli. However, a skeptic could argue the dreamer simply incorporates the sensation into their waking report.
  2.  **The Time Dilation (Limbo):** Cobb claims he and Mal spent fifty years in Limbo. If the dream is assembled at the moment of waking (the Empiricist view), it is hard to explain how a lifetime of sequential memory could be compressed into a few hours of sleep without losing the *weight* of that life. The film requires the dream to be "lived," not just "reported."

  **The Stakes: Guilt and Memory**
  Why does this distinction matter? Because of Cobb's guilt.
  If the Skeptic is right, Cobb never actually planted the idea in Mal's mind during a dream. Nothing "happened" to either of them in Limbo. It was just a story Cobb tells himself upon waking.
  If nothing happened, can Cobb be truly guilty? Can you murder someone in a place that doesn't exist?
  *Inception* argues that the subjective weight of the experience is what matters. If it felt real to Mal, the consequence is real.

  **Questions for Discussion**
  *   Does the film need dreams to be "real" experiences for the emotional stakes to work, or does it only *look* like it needs that?
  *   If the dream is assembled at the moment of waking, does Cobb's guilt survive?
  *   Is there a value to a "dreamt life" that philosophical arguments about reality miss?
  *   Does the spinning top at the end matter if the experience itself was meaningful?

  ***

  # FACILITATOR'S NOTE (For Your Eyes Only)

  You raised some excellent points in your prompt that go deeper than the handout. Here is a breakdown to help you manage the discussion if those topics arise:

  **1. Which position does the film *need*?**
  The film *dramatically* needs the **Ordinary Picture** (dreams are real-time experiences). If Malcolm is right (nothing happens during sleep), Cobb is not a murderer, he is merely a man with a guilty conscience about a story he told. The tragedy of Mal—her suicide based on a conviction formed in Limbo—collapses if Limbo wasn't "lived." The film resists the philosophical question by forcing the ontology of the dream to match the ontology of the waking world: cause and effect must hold in both.

  **2. The "Porous" Kick & Malcolm**
  Your insight here is sharp. A Malcolmian *can* account for the kick (the waking report includes the sensation of the van braking). However, the film shows the dreamers *anticipating* the kick to time their awakening. This suggests a causal link that requires the dream to be ongoing. If the dream were assembled at waking, they couldn't synchronize their internal timeline with an external event *before* waking. The film machinery distorts the question by making dreams *engineerable*. You can't engineer a report; you can only engineer an experience.

  **3. The Value of the Dreamt Life**
  This is the strongest angle for discussion. Both Malcolm and Dennett focus on *truth conditions* (did the event occur?). The film focuses on *phenomenological weight* (how did it feel?).
  *   **Discussion Pivot:** If Cobb chooses to stay in Limbo with his children (ignoring the top), is he choosing a "false" life? The film suggests that if the emotional resonance is identical, the distinction between "real" and "dreamt" loses its moral force. This is a point neither Malcolm nor Dennett fully addresses, as they are concerned with epistemology, not ethics.

  **4. Talking Down vs. Lifting Up**
  The handout avoids defining terms like "ontology" or "qualia." It frames the debate as "Story vs. Experience." This keeps it accessible. If a patron brings up "retroactive construction," you can validate that by referencing the Dennett section of the handout.

  **5. Handling the Ending**
  If the group gets stuck on "Is he still dreaming?", pivot to the Guilt question. "If he is dreaming, does his guilt change?" If the audience says "No," then they have implicitly agreed with the film's thesis: the reality of the experience matters more than the reality of the world.
