answer: |-
  This is such a good rabbit hole to go down. You're basically wrestling with the oldest debate in history: the "Great Man" theory (or Great Event) versus historical materialism (the idea that underlying forces drive everything).

  I think you're really close with your "counterfactual fragility vs. structural elasticity" idea. Let's simplify that into one working principle I call **"The Boulder Test."**

  Here's the rule: **Is the boulder already rolling down the hill, or is it balanced on the peak?**

  *   **Structural Elasticity (The Rolling Boulder):** The underlying pressure is so high that the outcome is inevitable. The specific event is just the dust kicking up when it hits the bottom. If you remove the event, the boulder still rolls. (Rome, Gutenberg).
  *   **Counterfactual Fragility (The Balanced Boulder):** The system is in equilibrium or chaos. A tiny nudge sends it careening down a path it wasn't already on. If you remove the event, the boulder stays put or rolls a different way. (Sarajevo, Florida).

  If we apply **The Boulder Test** strictly, here is how we sort your pile, including the tricky ones.

  ### The Tricky Cases

  **The Cuban Missile Crisis:**
  This is a **Balanced Boulder**. Even though there was structural pressure for peace (Mutually Assured Destruction), the military and political machinery was actively primed to fire. The decision-making process was down to individual humans in a room making split-second calls. If Kennedy bombs, the boulder rolls into nuclear winter. If he doesn't, it rolls back. That is peak fragility. Verdict: **Real Hinge.**

  **JFK and Civil Rights:**
  This is where you have to be ruthless with yourself. You admitted: *"the movement was so strong that some major law probably passes by 1966 anyway."*
  If you accept that, then by your own logic on Rome (where the empire falls regardless of Odoacer), the Civil Rights Act is a **Rolling Boulder**. The social pressure, the marches, the economic shifts—they were the gravity pulling the boulder. JFK's death provided the martyrdom that *greased* the skids for LBJ, but it didn't create the slope.
  Verdict: **Not a Real Hinge** (for the outcome of Civil Rights legislation). It's a hinge for LBJ's presidency, but not for the law itself.

  **Fleming and Penicillin:**
  Here is your biggest contradiction. You say Gutenberg is **Not Contingent** because "the tech was ripe." But science is the same way. By 1928, microbiology was exploding. Other researchers were noticing mold killing bacteria. If Fleming sleeps in, someone else notices the petri dish within a few years.
  The *application* during WWII was driven by the war (structural pressure), not just the discovery. If you keep Gutenberg as "inevitable," you have to classify Fleming as "inevitable."
  Verdict: **Not a Real Hinge** (for the existence of antibiotics). Maybe a hinge for the *exact year*, but not the historical arc.

  ### The Fukushima Prediction

  So, what about the 2011 Tohoku earthquake missing Fukushima by 50 miles?

  Apply **The Boulder Test**: Was there a massive global structural momentum *against* nuclear power before 2011?
  Actually, no. There was a "nuclear renaissance" happening. Countries were planning new plants. The industry was stable.
  If the earthquake hits 50 miles east, there is no meltdown. There is no global panic. Germany doesn't shut down its plants immediately. The "nuclear renaissance" likely continues.
  Because the industry was stable (balanced) and not already collapsing (rolling), the specific location of the quake acts as the nudge.
  Verdict: **Real Hinge.** That specific geological coordinate changed the global energy mix for the 21st century. Without the meltdown, we likely have way more nuclear power today.

  ### Which Verdicts Do You Have to Drop?

  If you want to stick to the simplest version of **The Boulder Test** (Momentum vs. Nudge), you have to change two of your current verdicts to be consistent:

  1.  **Drop the Fleming Verdict:** You can't say Gutenberg was inevitable because "tech was ripe" but Fleming was a hinge. Science is structural. If the knowledge base exists, the discovery happens. You have to move this to **Not a Real Hinge**.
  2.  **Drop the JFK/Civil Rights Verdict:** You can't say Rome was inevitable because "the army loyalty was broken" but JFK's death was a hinge for Civil Rights when you admit "the movement was so strong." Social movements are structural. You have to move this to **Not a Real Hinge** (regarding the passing of the law).

  ### Summary
  *   **Sarajevo:** Hinge (Alliances were tense, but war wasn't guaranteed *then*).
  *   **Rome:** Not Hinge (Empire was dead man walking).
  *   **Fleming:** Not Hinge (Science was ripe—*change your view*).
  *   **Florida:** Hinge (System was perfectly balanced).
  *   **Gutenberg:** Not Hinge (Tech was ripe).
  *   **Cuban Missile Crisis:** Hinge (Human decision overrode structural military logic).
  *   **JFK/Civil Rights:** Not Hinge (Movement momentum was too high—*change your view*).
  *   **Fukushima:** Hinge (Industry was stable until the disaster).

  It's a cleaner way to look at it, even if it makes history feel a bit less magical. Sometimes the boulder was just going to crush us anyway.
