answer: |-
  1. The practice strictly presupposes a reflective judgment view because the ladder question demands a cognitive assessment of life status rather than momentary affect, ruling out a plain hedonic view where income might raise scores without changing daily feelings. It remains compatible with an objective-list view only instrumentally, treating things like health or freedom as causes of the judgment rather than constitutive elements of happiness itself.

  2. The measurement assumes the imagined top rung is stable and comparable across cultures, but if people adaptively revise their aspirations downwards due to hardship, the score masks deprivation rather than revealing it. This creates a vulnerability where improved conditions might not raise scores if expectations inflate simultaneously, severing the link between policy inputs and reported outcomes.

  3. The practice implicitly assumes self-reports are publicity-proof, yet life-evaluation judgments are notoriously susceptible to framing effects and social desirability biases introduced by tracking itself. If citizens adjust their answers to align with government targets or perceived expectations, the metric ceases to measure independent wellbeing and becomes a performative artifact of the policy.

  4. A state targeting the rank commits itself to a positional view of wellbeing, treating progress as relative standing rather than absolute improvement, which is an artifact of the league-table format rather than a discovery about human flourishing. Targeting the average score avoids the zero-sum trap but still fails to distinguish between uniform improvement and inequality reduction, leaving the measure potentially inconsistent with how individual lives are actually going.

  5. Swapping to experience-based affect would require changing the question to sample moments rather than evaluate life, likely altering cross-country comparisons due to cultural differences in emotional reporting norms rather than actual feeling. This replacement would make your publicity test harder to pass, because knowing one's emotions are monitored might induce performative regulation of mood rather than the cognitive adjustment seen in life evaluations.
