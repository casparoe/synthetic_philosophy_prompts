      *   *State Variables:* Pressure, Temp, Humidity $\rightarrow$ Prices, Voting intentions, Resource stocks, Belief distributions.
      *   *Initial Conditions:* Current atmospheric state $\rightarrow$ Current institutional configuration, demographic snapshot.
