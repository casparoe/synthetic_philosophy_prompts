      *   *Detachment:* Meteorologist doesn't change the weather. Social scientist *is* part of society. *Verdict:* Crucial. Referee says it's degree (harvests planted based on forecast). User asks if this repairs it. *Analysis:* It's not just perturbation; it's *constitutive* feedback. Weather doesn't learn. Society does.
