      *   The $f(0)$ term for the *other* patient cancels out.
      *   We are left comparing $0.5 f(20)$ vs $f(10)$.
      *   Concavity says $f(10)$ is bigger.
      *   So Ex Post Prioritarianism *still* prefers Treating P2.
