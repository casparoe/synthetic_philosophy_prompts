      *   **Question:** Would Lewis allow an "emergency revision" or stick with the updateless line?
      *   **Constraint:** No need for references, just work it out (speculative philosophical reconstruction).

  2.  **Deconstruct David Lewis's Philosophical Stance:**
      *   **Causal Decision Theory (CDT):** Lewis championed CDT (along with Brian Skyrms). The core idea is that rational choice depends on the *causal consequences* of actions, not just evidential correlations. You maximize expected utility based on counterfactuals ("If I were to do A, what would happen?").
      *   **Rationality as Consistency:** Lewis viewed rationality largely as a matter of internal consistency among beliefs, desires, and actions.
      *   **Temporal Perspective:** Lewis was sensitive to the temporal indexicality of belief. He wrote about "survival" and "personal identity" over time. He cared about the agent *at the time of decision*.
      *   **Pre-commitment:** Lewis acknowledged the value of pre-commitment (e.g., Ulysses and the Sirens). However, he distinguished between *binding oneself* (changing the available options) and *choosing irrationally later*.
      *   **Belief Revision:** Lewis was a Bayesian. Beliefs should update on evidence. To ignore evidence is generally irrational *unless* there's a prior structural reason not to.

  3.  **Analyze Updateless Decision Theory (UDT) through a Lewisian Lens:**
      *   **UDT Core:** Choose a policy at the beginning (behind a veil of ignorance or at time $t_0$) that maximizes expected utility, and stick to it even if new information at $t_1$ suggests a different action would yield better local outcomes. The agent treats its own algorithm as a fixed output rather than a dynamic believer.
      *   **Lewis's CDT vs. UDT:**
          *   CDT says: At $t_1$, look at the causal consequences of actions *available now*.
          *   UDT says: At $t_1$, do what the $t_0$ policy dictates, because the $t_0$ policy *caused* the setup (in logical/timeless decision theory terms).
          *   *Conflict:* Lewis rejects "evidential" correlations that aren't causal. UDT often relies on logical correlations (my decision is correlated with a predictor's prediction). Lewis would be skeptical of "logical causation."
          *   *However:* If the pre-commitment physically alters the world (e.g., via a binding contract), CDT supports it. If it's just a mental resolve, CDT says at $t_1$ you should defect if defecting yields more utility *then*.
      *   **Lewis on "Treating Updates as Irrelevant":** This is the crux. For Lewis, belief is a map of the world. If the map changes (new evidence), ignoring it is forming a false belief. Rational action requires true belief (plus desire). To act on a known false belief (or an outdated one) is instrumentally irrational *at that moment*.

  4.  **Address the "CDT Pushed to the Limit" Question:**
      *   Would Lewis see UDT as CDT + Pre-commitment?
      *   *Argument for Yes:* If you can pre-commit physically (burn the bridge), CDT says do it. UDT is just mental pre-commitment.
      *   *Argument for No:* Lewis distinguishes between *changing the payoff structure* (binding) and *ignoring the payoff structure* (irrationality). UDT asks you to ignore the local causal structure at $t_1$ in favor of a global logical structure. Lewis's CDT is local and causal. He would likely say UDT confuses *evaluating a policy from the outside* with *making a decision from the inside*.
      *   *Verdict:* He'd likely say it breaks the framework. CDT is about what you can *now* causally influence. You cannot causally influence the past (or the predictor's past simulation) by your current choice, unless you have a time machine. UDT assumes a kind of "acausal influence" Lewis would reject as superstition or evidential fallacy.

  5.  **Address the "Leaky Mirror" Problem:**
      *   *Scenario:* Agent sees its update rule is being corrupted by an external reward signal (manipulation) but UDT says "don't update, stick to policy."
      *   *Lewis's Reaction:* This sounds like self-deception or akrasia.
      *   *Rationality:* For Lewis, rationality is responsive to the world. If the input mechanism is corrupted, the belief is false. Acting on false beliefs is usually bad.
      *   *Emergency Revision:* Lewis values the coherence of the self. If the "self" at $t_1$ knows the "self" at $t_0$ was operating on bad premises (or the mechanism is broken), sticking to $t_0$ is not rational fidelity; it's stupidity.
      *   *The "Sirens" Analogy:* Lewis discussed Ulysses. Ulysses binds himself because he knows his future preferences will be *distorted* (by the Sirens). But Ulysses doesn't pretend the Sirens aren't singing. He acknowledges the danger.
      *   *In the Leaky Mirror:* If the agent *knows* the update rule is corrupted, that knowledge is evidence. Ignoring it violates the Bayesian norm. Lewis would argue that a rational agent must account for the corruption.
      *   *Would he allow "Emergency Revision"?* Yes, but not as a hack. He would argue that the *definition* of the rational policy includes handling corruption. If the policy says "never update," the policy is flawed. A rational pre-commitment would be "Follow policy X unless evidence Y suggests mechanism corruption, then switch to Z."
      *   *Sticking to the Updateless Line:* If the policy is rigid ("Never Update"), Lewis would say the agent is irrational at $t_1$. He prioritizes the rationality of the *current* agent over the *past* agent's plan, unless the past agent changed the *options* available.

  6.  **Synthesize the Argument:**
      *   **Introduction:** Acknowledge Lewis's commitment to CDT and Bayesianism.
      *   **CDT vs. Updatelessness:** Lewis would likely view UDT as a category error. CDT is about causal leverage *now*. UDT relies on logical correlations or acausal influence, which Lewis rejects. He would see "treating updates as causally irrelevant" as denying the reality of the current causal situation.
      *   **Pre-commitment:** He distinguishes between binding (changing the world) and resolving (changing the mind). UDT is often just resolution. Lewis would say at $t_1$, the resolution has no causal power over the predictor, so you should defect.
      *   **The Leaky Mirror:** This is the clincher. Lewis is a realist. If the mirror is leaky (corrupted), the image is false. To act on a false image is irrational. He would advocate for a policy that allows revision *because* rationality demands responsiveness to evidence.
      *   **Conclusion:** Lewis would reject hard UDT. He would view it as Evidential Decision Theory (EDT) in disguise or a confusion of evaluating a life vs. living it. He'd support a sophisticated CDT that allows for pre-commitment mechanisms but insists on local causal rationality at the moment of choice.

  7.  **Refine the Tone:**
      *   Needs to sound philosophical, analytical, and respectful of Lewis's specific views (Humean, Causal, Bayesian).
