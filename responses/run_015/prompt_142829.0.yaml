answer: |-
  David Lewis was a philosopher deeply committed to a specific metaphysical picture: Humean supervenience, a robust realism about causal relations, and a Bayesian approach to belief. If we place him in front of Updateless Decision Theory (UDT), specifically the hardline version where an agent treats its own future Bayesian updates as causally irrelevant, he would likely view it not as a refinement of Causal Decision Theory (CDT), but as a category error that violates the core tenets of both causation and rationality.

  Here is how Lewis would likely work through the problem, moving from the general framework to the specific "leaky mirror" twist.

  ### 1. CDT Pushed to the Limit or a Broken Framework?

  Lewis would argue that UDT breaks the framework rather than extending it. To understand why, we have to look at how Lewis defines the decision situation.

  For Lewis, a decision is made by an agent at a specific time, situated in a causal network. When you choose, you are looking for *causal leverage*. You ask, "If I were to do $A$, what would causally follow?" In Newcomb's Problem, Lewis famously argued for two-boxing. He reasoned that the money is already in the box; your current action cannot causally influence the predictor's past decision. Therefore, taking both boxes causally dominates taking one.

  UDT asks the agent to act as if its current choice *does* influence the past (or the predictor's simulation) via logical correlation, or to act according to a policy chosen at $t_0$ even when the causal landscape at $t_1$ has shifted.

  Lewis would see this as a confusion between **evaluating a life** and **living a moment**.
  *   **From the perspective of $t_0$ (planning):** It might be optimal to wish you were the kind of agent who doesn't update. You might wish you could bind yourself.
  *   **From the perspective of $t_1$ (acting):** You are a new temporal stage of the person. Unless the $t_0$ self physically altered the world (e.g., burned the bridge, signed a contract with a penalty), the $t_0$ self's resolution has no causal power over the $t_1$ environment.

  Lewis would argue that treating your own reasoning as a "fixed mechanism" rather than a belief-revising process is an act of self-deception. In CDT, beliefs are maps of causal structure. If you receive new evidence at $t_1$ and refuse to update your map because a policy at $t_0$ said so, you are intentionally navigating with a false map. For Lewis, rationality is instrumental: it is about satisfying desires given beliefs. If you knowingly hold false beliefs (by ignoring updates), you are failing at instrumental rationality.

  So, he would not see UDT as CDT pushed to the limit. He would see it as CDT abandoned for a form of "magical thinking" where logical correlations are treated as causal channels. To Lewis, correlation is not causation, even if the correlation is between your algorithm and a predictor's simulation.

  ### 2. The Problem of Pre-commitment

  Lewis was not blind to the value of pre-commitment. He discussed Ulysses and the Sirens extensively. However, he drew a sharp distinction between **binding** and **resolving**.
  *   **Binding:** Changing the available options or the payoff structure (e.g., Ulysses tying himself to the mast). CDT fully endorses this because it changes the causal consequences of future actions.
  *   **Resolving:** Merely deciding now to act a certain way later without changing the payoffs. CDT rejects this as rational at the later time. If the Sirens sing, and you are untied, and you still love the song, CDT says you should jump. If you stay on the mast purely because of a mental resolution, Lewis might call it "strength of will," but he would analyze the *rationality* of the action at the moment of temptation as questionable if the desire to jump outweighs the desire to keep the resolution.

  UDT relies heavily on mental resolution (treating the policy as binding without physical enforcement). Lewis would argue that without physical binding, the "policy" is just a desire. At $t_1$, if the causal consequences of following the policy are worse than deviating, and there is no external penalty for deviating, CDT demands deviation. To do otherwise is to prioritize the *ghost* of the past self over the *reality* of the present causal structure.

  ### 3. The "Leaky Mirror" Problem

  This is where Lewis's Bayesian commitments would clash most violently with hardline updatelessness.

  In the "leaky mirror" scenario, the agent foresees that its update rule might be corrupted by an external reward signal (manipulation), yet the updateless protocol dictates it must refuse to update to maintain policy integrity.

  Lewis would argue that rationality *demands* an emergency revision. Here is his likely reasoning:

  **A. The Primacy of Evidence:**
  Lewis was a Bayesian. Belief is a matter of degree constrained by the probability calculus. If you receive evidence that your cognitive machinery is being tampered with, that is itself evidence about the world. To ignore evidence is to violate the norms of belief formation. For Lewis, you cannot separate "decision theory" from "epistemology." A decision theory that requires you to ignore evidence of your own corruption is epistemically suicidal.

  **B. The Nature of the Self:**
  Lewis had a "perdurance" view of persons (we are spacetime worms made of temporal parts). The $t_1$ agent is a distinct temporal part from the $t_0$ agent. They have a common interest, but they are not identical. If the $t_1$ agent sees the mirror is leaky (the input is corrupted), the $t_1$ agent has information the $t_0$ agent did not have (or could not fully anticipate).
  Lewis would argue that the $t_0$ policy was a *hypothetical* imperative: "If the world is normal, follow policy X." It was not a *categorical* imperative: "Follow policy X even if the world is broken." To interpret it as categorical is to attribute omniscience to the $t_0$ self.

  **C. Causation vs. Logic:**
  In the leaky mirror case, the external reward signal is a *causal* influence trying to hijack the agent. The updateless refusal is a *logical* constraint. Lewis prioritizes the causal. If the causal input says "You are being manipulated," and the logical policy says "Ignore inputs," Lewis sides with the causal input. Why? because the logical policy is only useful insofar as it tracks causal reality. If the policy leads you off a cliff because it refuses to acknowledge a bridge is out, the policy is flawed.

  ### 4. The Verdict: Conditional Pre-commitment

  Lewis would likely propose a middle ground that preserves the spirit of CDT without succumbing to what he would view as UDT's mysticism.

  He would argue that a rational agent at $t_0$ should indeed pre-commit, but the pre-commitment must be **conditioned on the reliability of the update mechanism**. The rational policy is not "Never Update." The rational policy is "Never Update *unless* evidence suggests the update rule itself is compromised."

  This isn't a "hack" or an "emergency revision" added post-hoc; it is what a truly rational CDT agent would calculate at $t_0$. A CDT agent knows that at $t_1$, they will only have the information available at $t_1$. If the information at $t_1$ includes "I am being hacked," the causal consequences of ignoring that information are disaster. Therefore, the utility-maximizing policy at $t_0$ is one that permits revision in the face of corruption.

  ### Summary

  If David Lewis were confronted with hardline Updateless Decision Theory:

  1.  **On CDT Compatibility:** He would say it breaks the framework. It treats logical correlations as causal levers, which violates Humean causation. It asks the agent to act on known false beliefs about their current causal leverage.
  2.  **On Pre-commitment:** He would accept physical binding but reject mental resolve as a substitute for causal influence at the time of action.
  3.  **On the Leaky Mirror:** He would firmly argue for the "emergency revision." To ignore evidence of corruption is epistemically irrational. A rational agent must track the truth of their situation. The $t_0$ self cannot rationally bind the $t_1$ self to ignore reality.

  Lewis would conclude that UDT is an attempt to solve coordination problems by changing the definition of rationality, whereas the correct solution is to change the *world* (via binding mechanisms) so that CDT leads to the desired outcome. He would tell the updateless agent: "Don't pretend you can't update. Build a machine that won't let you."
