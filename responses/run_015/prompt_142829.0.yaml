prompt: |-
  If David Lewis was still around and had to take a stance on updateless decision theory—specifically the kind where an agent pre-commits to a policy and treats its own future Baysian updates as causally irrelevant—what do you think he'd say? I'm particularly stuck on how this interacts with his causal decision theory. In CDT the agent picks actions based on causal influence, but an updateless agent seems to treat its own reasoning like a fixed mechanism, not like a belief-revising agent. Would Lewis see that as just CDT pushed to the limit, or as something that breaks the framework? There's also this niche twist people are now calling the 'leaky mirror' problem: the agent can foresee that its update rule might get corrupted by an exteral reward signal, yet it still refuses to update. Would Lewis argue that rationality demands allowing a single 'emergency revision' in that case, or would he stick with the updateless line? No need for references, just work it out.
