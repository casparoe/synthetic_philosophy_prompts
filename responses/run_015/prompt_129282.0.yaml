  # Desiderata for an Adequate Theory of the Meta-Problem of Consciousness

  ## 1. Definition and Scope
  The meta-problem of consciousness is defined here not as the task of solving the hard problem (explaining how physical processes give rise to experience), but as the task of explaining why we *think* there is a hard problem. An adequate theory must explain why phenomenal consciousness appears to present a special explanatory gap, even to thinkers who explicitly reject substance dualism and endorse physicalism. The theory must account for the problem intuitions themselves as natural phenomena requiring explanation.

  ## 2. Phenomena to be Accounted For
  A robust theory must explain the following specific features of our intuitive landscape, supported by motivating cases.

  ### A. The Persistence of Intuitions Among Trained Physicalists
  **Phenomenon:** The intuition that there is an explanatory gap does not vanish upon accepting physicalist ontology or undergoing philosophical training.
  **Motivating Case:** Consider the 'Knowledge Argument' (Jackson's Mary). Even when physicalists offer rebuttals (e.g., the ability hypothesis or phenomenal concept strategy), many trained physicalists report that the intuitive force of the argument remains. They may assent to physicalism propositionally, yet the cognitive sense of an 'explanial residue' persists. A theory that suggests the intuition is merely a result of ignorance or lack of training fails to account for its resilience in expert populations.

  ### B. The Asymmetry of Functionalisation
  **Phenomenon:** There is a marked disparity in our readiness to accept functional or mechanistic explanations for non-phenomenal mental states compared to phenomenal states.
  **Motivating Case:** We readily accept that 'memory' or 'attention' can be fully explained by computational or neural mechanisms without remainder. However, when presented with an identical functional account of 'pain' or 'redness', we typically demand, 'But why does it *feel* like this?' An adequate theory must explain why phenomenal concepts trigger a resistance to functional reduction that other psychological concepts do not.

  ### C. Cross-Cultural and Historical Stability
  **Phenomenon:** The intuition that experience possesses a non-functional, intrinsic nature appears stable across different cultural contexts and historical periods, not limited to contemporary analytic philosophy.
  **Motivating Case:** Similar distinctions between the physical body and the 'experiencing self' appear in Cartesian dualism, but also in certain interpretations of Buddhist *vijñāna* or Advaita Vedānta, despite vast metaphysical differences. If the intuition were merely a artefact of Western linguistic structure or specific philosophical pedagogy, it would not exhibit this stability. The theory must account for this ubiquity without resorting to universal dualist metaphysics.

  ## 3. Conceptual Distinctions to Preserve
  An adequate theory must maintain rigorous separation between the following categories to avoid category errors.

  ### A. Cognitive Origin vs. Structural Irreducibility
  The theory must distinguish between explaining *how* we acquire phenomenal concepts (cognitive origin) and explaining *why* those concepts appear structurally simple or unanalysable (structural irreducibility).
  *   **Requirement:** It is insufficient to trace the genealogy of the concept (e.g., via introspection mechanisms); the theory must also explain why the concept presents itself as lacking internal structure. A theory that explains the origin but fails to explain the *seeming* simplicity leaves the meta-problem unsolved.

  ### B. Cognitive Illusion vs. Experiential Architecture
  The theory must distinguish between treating the gap as a *mistake* (illusionism) and treating it as a reflection of the brain's actual information-processing architecture (structuralism).
  *   **Requirement:** The theory must be explicit about whether the 'gap' is a bug in our cognitive software (a false representation) or a feature of the hardware (a genuine limitation on how the system can model itself). Conflating these leads to ambiguity regarding the ontological status of consciousness.

  ## 4. Hard Constraints
  The theory must operate within specific boundaries. These are divided into non-negotiable constraints (required for naturalistic coherence) and camp-specific preferences (dependent on one's stance on the hard problem).

  ### A. Non-Negotiable Constraints
  1.  **Causal Closure:** The theory must be consistent with the absence of detectable non-physical causal interaction. The explanation for the intuition must be physically implementable. It cannot posit that the intuition exists *because* non-physical properties causally influence our judgement.
  2.  **Empirical Adequacy:** The theory must be consistent with current neuroscience and psychology. It cannot posit cognitive mechanisms that are known to be biologically impossible.

  ### B. Camp-Specific Preferences (Contested)
  1.  **Veridicality:** Whether the intuition tracks a real ontological feature (dualist/panpsychist preference) or is a systematic error (illusionist preference). This is not a constraint on the *meta-problem theory* itself, but an output variable.
  2.  **Eliminativism:** Whether the theory should aim to dissolve the intuition entirely or accommodate it. Some approaches prefer to preserve the intuition as useful; others seek to eradicate it.

  ## 5. Jointly Unsatisfiable Desiderata
  There is a significant tension between two plausible requirements for the theory. I suspect the following pair is jointly unsatisfiable:

  1.  **Phenomenological Fidelity:** The theory must fully validate the first-person report that the gap is real and unbridgeable.
  2.  **Ontological Parsimony:** The theory must explain the gap entirely within a standard physicalist framework without positing new fundamental properties.

  **Reasoning:** If a theory respects Phenomenological Fidelity completely, it implies the intuition is veridical, which pressures the theory towards non-physical ontology (violating Parsimony). If it adheres strictly to Ontological Parsimony, it must treat the intuition as misleading or partial (violating Fidelity). A theory cannot simultaneously claim the intuition is a perfect guide to reality *and* that reality is exhausted by standard physics.

  ## 6. The Exclusionary Requirement
  The single requirement that does the most to rule out existing approaches is: **The Persistence Constraint.**

  Many existing approaches (particularly early eliminativist or 'education-based' models) assume that the hard problem intuition is a result of confusion that will dissolve with better science or clearer concepts. The requirement to explain why the intuition *survives* explicit philosophical training and sophisticated physicalist knowledge rules out any theory that relies on the intuition being a simple error correctable by information. It forces the theory to posit a deep-seated, structural cognitive mechanism rather than a superficial misconception.

  ## 7. Settled vs. Contested
  To maintain neutrality, the following distinctions are drawn between what is generally accepted and what remains debated.

  ### Settled Among Specialists
  *   **Existence of Intuitions:** It is settled that the 'problem intuitions' (e.g., zombie judgements, gap intuitions) exist as psychological phenomena.
  *   **Physicalist Framework:** The working assumption for the meta-problem is methodological naturalism; explanations should seek physical or functional mechanisms.
  *   **Distinction from Hard Problem:** It is settled that the meta-problem is distinct from the hard problem. Solving the meta-problem does not automatically solve the hard problem, though it may constrain solutions.

  ### Genuinely Contested
  *   **Veridicality of Intuitions:** It is fiercely contested whether the intuition that 'physicalism is incomplete' is a reliable guide to ontology or a cognitive illusion.
  *   **Sufficiency:** It is contested whether solving the meta-problem renders the hard problem obsolete (the 'dissolution' view) or merely sidelines it.
  *   **Mechanism Specificity:** There is no consensus on the specific cognitive mechanism responsible for the gap (e.g., whether it is due to the lack of sensory monitoring of concepts, the simplicity of phenomenal concepts, or specific introspective limitations).

  No contested view regarding the truth of physicalism or the reality of qualia should be presented as consensus within the formulation of the meta-problem theory itself. The theory must remain compatible with multiple ontological outcomes, even if it favours a naturalistic explanation of the *intuition*.
