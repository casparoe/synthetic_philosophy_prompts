answer: |-
  **Joint Statement on Equality and Priority**

  **1. Common Ground**
  We agree on the following substantive claims:
  1.  **The Target:** The Leveling-Down Objection (LDO) targets *telic* egalitarianism (equality is intrinsically good), not *instrumental* egalitarianism (equality leads to stability, etc.).
  2.  **All-Things-Considered:** We agree the leveled-down world is worse all-things-considered. No one gains, some lose. The Egalitarian does not advocate leveling down; she claims it is better *in one respect*.
  3.  **Not Utilitarianism:** Rejecting the LDO does not force us into Utilitarianism. We can agree equality/priority matters without summing welfare maximally.
  4.  **Person-Affecting Constraint:** We agree the LDO gains traction because it violates the intuition that a change must be better *for someone* to be good. The dispute is whether this intuition is decisive.
  5.  **Extrinsic Badness:** We agree many inequalities are bad for reasons outside this debate (e.g., oppression, status hierarchy, political domination). Neither view captures all moral concerns.

  **2. Core Disagreements**

  | Issue | The Egalitarian's View | The Prioritarian's View |
  | :--- | :--- | :--- |
  | **The Nature of "Respects"** | A "respect" can be an impersonal pattern. The leveled-down world is pro tanto better because the pattern of equality is instantiated, even if no individual benefits. | A "respect" must be anchored in individual welfare. Calling a pattern "better" without a beneficiary is category confusion, not a genuine value fragment. |
  | **Source of Priority Weight** | Priority weighting (caring more about the worse-off) implicitly relies on a comparative baseline. You can't define "worse-off" without implying equality is the normative default. | Priority weighting relies on diminishing marginal value of benefits. It is absolute, not comparative. We care about the poor because benefits *do more good*, not because they are unequal. |
  | **Collapse Stability** | If priority weight is high enough to match egalitarian intuitions, Prioritarianism just *is* Egalitarianism in disguise. This collapse is welcome (truth wins). | If weight is high, it becomes arbitrary; if low, it collapses to Utilitarianism. Neither collapse is acceptable. The weighting function must remain distinct from equality. |

  **3. Cruxes and Predictions**
  To move forward, we identify three sub-questions where settling the verdict would require one of us to budge. We record our predictions here.

  **Crux 1: The Verbal Dispute (What is "Value"?)**
  *The Question:* Is "better in one respect" a genuine fragment of value, or just a dressed-up report that a non-value fact (a pattern) obtains?
  *The Case:* **The Lonely Universe.** Two people exist on separate planets, never interacting. A is well-off, B is poorly-off. No causal link exists.
  *   **Egalitarian Prediction:** We will intuit this state is *bad* compared to one where both are equally well-off, even if no one knows the difference. This confirms impersonal value.
  *   **Prioritarian Prediction:** We will intuit this state is *neutral* regarding equality. Without interaction or knowledge, "inequality" is just a description, not a flaw. If we feel it's bad, it's verbal confusion.
  *   *Move Condition:* If we agree the intuition is neutral, Egalitarian admits the "respect" is merely descriptive. If we agree it's bad, Prioritarian admits value exists without person-affecting links.

  **Crux 2: The Overshoot Transfer**
  *The Question:* Does the value of equality symmetrical (gap-closing) or directional (helping the bottom)?
  *The Case:* **The Leapfrog.** A is at 100, B is at 10. We transfer resources to B until B is at 110 and A is at 90.
  *   **Egalitarian Prediction:** We will judge the final state (90/110) as *worse* than the equal midpoint (95/95) solely due to the return of inequality, even if total welfare is higher. The gap itself is a negative.
  *   **Prioritarian Prediction:** We will judge the transfer (10→110) as wholly good until marginal utility flips. The new inequality (90/110) is not intrinsically bad; only future blocks to helping the new "worst-off" (A) would be bad.
  *   *Move Condition:* If the new inequality is felt as a distinct negative, Prioritarian must admit symmetry matters (egalitarianism). If not, Egalitarian must admit only absolute levels matter (prioritarianism).

  **Crux 3: The Incidental Gain**
  *The Question:* Can we isolate the value of equality from causal side-effects?
  *The Case:* **The Spillover.** We level down the Rich (100→50). This causes no gain to the Poor (stay at 50), but incidentally helps a Third Party (Neutral→60) via a causal chain unrelated to equality.
  *   **Egalitarian Prediction:** We can separate the value. The Third Party gain is good. The Equality gain (50/50) is *also* good, independently. We should count both.
  *   **Prioritarian Prediction:** We cannot separate them. The Third Party gain is good. The Equality gain is zero. Any intuition that the equality adds value is actually just sensing the Third Party gain.
  *   *Move Condition:* If we find the world is *extra* better beyond the Third Party gain, Prioritarian collapses. If we find no extra value, Egalitarian admits the "respect" vanishes when no one gains.

  **Signatures**

  ________________________ (Telic Egalitarian)
  ________________________ (Prioritarian)
  ________________________ (Scribe)
