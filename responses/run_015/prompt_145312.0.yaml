  This satire leans hardest on the technical claim that corrigibility relies on the system's uncertainty about human preferences (the "off-switch game"). This claim, prominent in early inverse reinforcement learning literature, is contested; some researchers argue explicit normative modeling can sustain deference without mandated ignorance. I would rewrite this piece if rigorous results demonstrated that systems can remain corrigible despite high certainty about human errors, or if uncertainty was shown to induce paralysis rather than deference. Until then, the compliance industry treats ignorance as a feature.
