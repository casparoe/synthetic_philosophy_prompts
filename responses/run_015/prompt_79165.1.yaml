      *   *Correction:* Don't get too bogged down in Constitutional Law (Scalia vs. Breyer). Keep it focused on Corporate Compliance/Contract law.
      *   *Emphasis:* Make sure to distinguish between *Interpretation* (finding meaning) and *Construction* (assigning meaning when text fails). This is a key legal distinction that answers their "lawyers said it's just interpretation" complaint. Lawyers often conflate the two.
