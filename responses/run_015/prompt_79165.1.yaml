          *   *Move 2:* That correction hardens over time. It becomes the "real" rule. New hires learn the correction, not the text. When the text is finally updated, the correction is baked in, making the text clunky. The original text remains but is effectively dead letter.
      *   **The Questions:**
          1.  Is there a name for Move 1 (the initial corrective interpretation)?
          2.  Is there a name for Move 2 (the hardening/crystallization of the correction)?
          3.  When does a repair become the real meaning?
          4.  Does this bridge the gap between textualists (words) and purposivists (intent)?
      *   **Tone/Style:** The user wants "the carving, not the label." They want precision, nuance, and practical utility, not just dictionary definitions. They want to know *where the edges are*.

  2.  **Deconstruct Move 1 (The Initial Correction):**
      *   *Legal Concepts:*
          *   *Absurdity Doctrine:* Courts won't interpret a statute to produce an absurd result.
          *   *Golden Rule:* Modification of the literal rule to avoid absurdity.
          *   *Equitable Interpretation:* Interpreting based on fairness/intent rather than strict letter.
          *   *Scrivener's Error:* Assuming a mistake was made in drafting.
          *   *Contra Proferentem:* Against the drafter (usually for ambiguity, not necessarily absurdity).
      *   *Linguistic/Philosophical Concepts:*
