answer: |-
  You are right to be unsatisfied with "that's just interpretation." Your colleagues are conflating two distinct cognitive and legal operations. In legal theory, there is a sharp distinction between **Interpretation** (discovering the semantic meaning of the words) and **Construction** (assigning legal effect when the words are ambiguous, silent, or absurd).

  What you are describing is a lifecycle of **Construction** hardening into **Custom**, which then fossilizes back into **Text**.

  Here is the carving you asked for.

  ### 1. The First Move: Saving the Text from Itself
  **The Legal Name:** *The Absurdity Doctrine* (or *The Golden Rule*)
  **The Linguistic Name:** *Pragmatic Enrichment*
  **The Compliance Name:** *Equitable Construction*

  When you read "no vehicles" and understand "no motor vehicles," you are not interpreting the word *vehicle*. Semantically, a bicycle is a vehicle. You are engaging in **Construction**. You are determining that the *legal effect* of the sentence must be modified to align with the *purpose* of the rule, because the literal semantic meaning leads to an absurdity (banning ambulances).

  In statutory law, this is the **Absurdity Doctrine**: a court may depart from the plain meaning of a text if that meaning leads to a result that is logically impossible or grossly contrary to legislative intent. In contract law, it is often handled under **Equitable Interpretation** or by invoking the **Mischief Rule** (asking: *what harm was this rule designed to prevent?*).

  However, the most precise carving comes from linguistics: **Pragmatic Enrichment**. This is where the listener (you) uses context to supply unspoken qualifiers to the speaker's (the policy's) utterance. The text says $X$, but the context implies $X + Y$.
  *   **The Edge:** This move is valid only as long as the "absurdity" is genuine. If the literal reading is merely *inconvenient* but not *absurd*, this move is technically unauthorized. That is where your colleagues have a point: if the rule says "receipts over $25" and you demand one for $24.99, that's not absurd, that's just strict. The first move requires a threshold of *untenability*.

  ### 2. The Second Move: The Hardening
  **The Legal Name:** *Practical Construction* (or *Course of Performance*)
  **The Sociological Name:** *Institutionalization*
  **The Drafting Name:** *Textual Accretion*

  This is the phenomenon you rightly feel lacks a specific label. The correction stops being a "fix" and becomes the "rule."

  In contract law, this is **Practical Construction** (or *Course of Performance* under the UCC). If parties to a contract consistently ignore a clause and act according to a different understanding, the court will often rule that the *conduct* has amended the *text*. The "real" contract is what the parties *did*, not what they *wrote*.

  In organizational theory, this is **Institutionalization**. An informal norm (no motor vehicles) becomes so embedded in training, memory, and workflow that it acquires the force of formal policy.

  But the specific phenomenon of the *text* getting clunkier because it has to absorb the history of these corrections is **Textual Accretion**. Like a coral reef, the policy grows layers of dead exceptions over the living core. The original text becomes a "dead letter," but it remains on the books as a fossil layer.

  **Does it have a name?**
  If you want to name the specific moment the repair becomes the baseline, call it **Normative Crystallization**.
  *   **The Edge:** Crystallization occurs when **Reliance Interests** attach. As long as the "correction" is just a wink-and-nod among senior staff, it's a repair. Once new hires are trained on the *correction* rather than the *text*, and once budget/operations are planned based on the *correction*, it has crystallized. At that point, reverting to the text would cause damage.

  ### 3. When does the repair become the "Real" meaning?
  You asked: *At what point does a hardened repair stop being a repair and become the real meaning?*

  The boundary is **Estoppel**.
  In law, estoppel prevents someone from arguing something contrary to a claim they previously made (or allowed) if another party has relied on that position to their detriment.

  *   **Phase 1 (Repair):** Senior staff know the text is wrong and ignore it. No harm yet.
  *   **Phase 2 (Reliance):** A department head budgets for a motorized cart based on the "no motor vehicles" understanding. A vendor signs a contract assuming airfare receipts are always needed.
  *   **Phase 3 (Crystallization):** If you tried to enforce the *original text* now, you would breach an implicit agreement and cause financial loss.

  The repair becomes the "real" meaning the moment **enforcing the original text would constitute a breach of good faith.**

  ### 4. Does this bridge the Textualist vs. Purposivist gap?
  You asked: *If the words have been quietly absorbing purposes for a century, are the two camps even pointing at different objects?*

  Yes, this suggests they are often looking at the same object through different time horizons.

  *   **Textualists** look at the text at $T_0$ (the moment of signing/enactment). They want to constrain judges/compliance officers from injecting their own will.
  *   **Purposivists** look at the text at $T_{now}$ (the moment of application). They want the rule to function in the current reality.

  Your observation reveals a third category: **The Living Text.**
  When **Practical Construction** (Move 2) is recognized, the "Text" is no longer just the ink on the page. The "Text" is *Ink + History of Application*.

  If you accept that **Custom** can amend **Contract** (which the law generally does, provided it doesn't contradict express terms), then the Textualist and the Purposivist are actually agreeing on the *source of truth*, they just disagree on *where the truth is stored*.
  *   The Textualist says the truth is in the *file*.
  *   The Purposivist says the truth is in the *intent*.
  *   You are saying the truth is in the *practice*.

  In many legal systems (particularly under the Uniform Commercial Code), **Practice wins.** "Course of performance" trumps "general terms." So, to answer your question: Yes, if the words have absorbed the purposes via crystallization, the "words" (broadly defined to include their operational history) *are* the purpose. The distinction collapses.

  ### 5. A Proposal for the Cycle
  Since you asked for a name for the second move if one didn't exist, and to define its edges:

  **The Term:** **Compliance Accretion**
  **The Definition:** The process by which an operational workaround for a textual defect hardens into an authoritative norm, eventually requiring textual amendment that preserves the workaround as an exception, thereby increasing textual complexity without increasing clarity.

  **The Edges of Compliance Accretion:**
  1.  **Initiation:** A textual absurdity is identified and bypassed via Equitable Construction.
  2.  **Propagation:** The bypass is taught to new actors as standard procedure (Institutionalization).
  3.  **Crystallization:** Reliance interests make it costly to return to the original text (Estoppel).
  4.  **Fossilization:** The text is amended to codify the bypass, preserving the original absurd language alongside the correction (Accretion).

  **Why this matters for your work:**
  When you are arguing with colleagues:
  *   If they say "Go by the words," ask them if they mean the **Semantic Text** (the ink) or the **Operational Text** (the ink plus the last five years of reliance).
  *   If the rule has undergone **Compliance Accretion**, enforcing the Semantic Text is not "strict compliance"; it is actually a **change in policy** that violates established reliance.

  You aren't just interpreting; you are managing the sedimentation of organizational history. The lawyers called it "interpretation" because that's the box they put everything in. But you've identified that it's actually **governance drift**. Recognizing *Compliance Accretion* gives you the leverage to say: "We aren't arguing about what this sentence means. We are arguing about whether we are ready to break the reliance interests we've built for five years." That is a much stronger argument.
