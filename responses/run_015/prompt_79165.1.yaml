          *   *Constructive Interpretation:* Dworkin. Making the text the best it can be.
      *   *Best Fit:* The "Absurdity Doctrine" is the closest legal term, but the user says lawyers dismissed it as "just interpretation." The philosophical concept of **Pragmatic Enrichment** or **Implicature** fits well because it explains *how* we understand "no vehicles" as "no motor vehicles" without changing the words. However, in a compliance/legal context, **Equitable Interpretation** or the **Mischief Rule** (Heydon's Case) is strong.
      *   *Refinement:* Let's look for a term that captures the *act* of overriding the text. **Rectification** is a specific legal remedy, but that's usually for contracts where there's proof of prior agreement. **Construction** vs. **Interpretation**. Interpretation finds meaning; Construction assigns meaning when interpretation fails or leads to absurdity.
      *   *Selection:* I need to offer a few layers. Legal (Absurdity Doctrine/Golden Rule), Linguistic (Pragmatic Enrichment), and Institutional (Operational Norm).

  3.  **Deconstruct Move 2 (The Hardening):**
      *   *Legal Concepts:*
          *   *Precedent (Stare Decisis):* But this is usually case law, not policy text.
          *   *Custom and Usage:* Trade usage or course of dealing.
          *   *Practical Construction:* How the parties actually performed the contract.
          *   *Desuetude:* The opposite (law exists but isn't used).
          *   *Norm Crystallization:* Sociological term.
      *   *Organizational Concepts:*
          *   *Shadow System / Informal Organization:* The way work actually gets done vs. the org chart.
          *   *Path Dependence:* Past decisions constrain future ones.
          *   *Institutional Memory:* Or the lack thereof.
      *   *Best Fit:* **Practical Construction** is the strongest legal term for "how we actually do it becomes the meaning." **Custom and Usage** is also strong. In organizational theory, this is **Reification** (making an abstract concept concrete) or **Institutionalization**.
      *   *The "Clunky Text" Phenomenon:* This is **Accretion**. Like geological layers. Or **Palimpsest** (writing over old writing).
      *   *Selection:* **Practical Construction** (legal), **Institutionalization** (sociological), and **Accretion** (textual).

  4.  **Addressing the "When does it become real?" Question:**
      *   This is the core philosophical/legal puzzle.
      *   *Legal View:* It becomes real when reliance interests attach. If people rely on the "motor vehicle" rule to plan their lives/business, changing it is unfair (Estoppel).
      *   *Organizational View:* It becomes real when the cost of correcting the text exceeds the cost of the ambiguity, or when turnover completes (no one remembers the old rule).
      *   *The "Edge":* The edge is **Reliance**. When new actors structure their behavior on the *correction* rather than the *text*, the correction wins.

  5.  **Addressing the Textualist vs. Purposivist Debate:**
      *   The user asks if this bridges the gap.
      *   Yes. If the text absorbs the purpose over time, the "words" *become* the "purpose" via the mechanism of Practical Construction.
      *   Textualists argue words constrain. Purposivists argue purpose guides. If the "words" are understood by the community to include the "purpose" (via Move 2), the distinction blurs.
