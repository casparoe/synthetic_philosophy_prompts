      *   **Ethical Framework:** The user is struggling with the "Dirty Hands" problem, specifically a distinction introduced by their professor: *Participatory Dirty Hands* (personal performance of wrong) vs. *Structural Dirty Hands* (maintaining ties that enable wrongs by others).
