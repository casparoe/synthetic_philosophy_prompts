answer: |-
  **MEMORANDUM**

  **TO:** Research Partnerships and Ethics Oversight Committee
  **FROM:** Graduate Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Overseas Epidemiological Institute Partnership

  **Recommendation**
  I recommend that the Committee decline a standard five-year renewal and instead authorize a **Phased Transition with Strict Conditions**. This course of action entails a limited, 18-month extension solely to complete data collection and care for the current cohort of 2,000 participants, followed by a full divestment of institutional ties. During this transition, all funding and data flows must be audited to ensure no surplus capacity is transferred to the host Defense Ministry.

  **Ethical Framework: Structural Complicity**
  We must confront the nature of our involvement. This is not a case of "participatory dirty hands," where committee members personally commit wrongful acts to secure a good outcome. We are facing "structural dirty hands." By providing data infrastructure and funding legitimacy, our university becomes a component in a system that enables civilian suppression by the host Defense Ministry.

  Some might argue that structural complicity is more diffuse and therefore more easily justified than direct participation. I argue the opposite: because it is bureaucratic and distant, it is more insidious. It allows us to claim moral cleanliness while our institutional capacity bolsters a problematic regime. We cannot treat this as a mere reputational risk; it is a question of whether our research infrastructure is ethically compatible with our partner's administrative parent. Continuing a long-term partnership normalizes this entanglement.

  **Participant Welfare and the Constraint**
  However, acknowledging structural complicity does not absolve us of our immediate duty of care. The strongest argument against divestment is the concrete harm to the 2,000 enrolled participants. Terminating the agreement immediately would abandon these subjects, potentially invalidating the trial and denying them access to the intervention. This is a measurable public health setback and a violation of the principle of non-maleficence. We cannot wash our hands of the Ministry's actions if doing so means washing our hands of the participants' safety.

  **The Cost of This Decision**
  In recommending a phased transition rather than full renewal, I acknowledge the significant cost to the "losing" side of this argument. The researchers argue that this institute is irreplaceable and that ending the partnership after 18 months may jeopardize the long-term viability of the vaccine program, not just the current trial. It is possible that no other partner can operate in this region, and our withdrawal could delay malaria eradication efforts by years. We must accept this risk honestly: prioritizing our institutional integrity may come at the price of global health efficiency. We cannot claim this decision is cost-free.

  **Actionable Conditions**
  To make this transition viable, the following conditions must be met:
  1.  **Scope Limit:** The extension covers only the completion of the current trial phase; no new enrollment is permitted.
  2.  **Firewalling:** IT and Finance must certify that our data servers and funds are ring-fenced strictly for the epidemiological unit, with no overflow capacity accessible by the Defense Ministry.
  3.  **Exit Strategy:** The research team must use the 18-month window to identify alternative local partners or transition plans for post-trial participant care.

  **Conclusion**
  A phased transition allows us to honor our commitment to the participants without cementing a long-term structural alliance with a ministry implicated in human rights abuses. It accepts a degree of scientific loss to preserve institutional integrity. I urge the Committee to adopt this path.
