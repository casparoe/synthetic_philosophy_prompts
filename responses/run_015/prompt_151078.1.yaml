  4.  **Refining the Tone and Content:**
      *   *Tone:* Needs to be diplomatic but firm. It's a committee memo, not a philosophical essay.
      *   *The "Dirty Hands" Concept:* Integrate it naturally. Don't lecture the committee on the professor's theory, but use it to frame the decision. The distinction matters because it shifts the focus from "Did *I* kill someone?" to "Did *our institution* build the road the tank drove on?"
