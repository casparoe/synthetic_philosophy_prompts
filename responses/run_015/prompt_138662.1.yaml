      *   *The Problem:* "Slot" is a pre-treatment covariate? Or is it post-treatment? If the policy changes conception timing, the "slot" might be defined by the treatment.
      *   *Selection Bias:* If we condition on "Slot Filled," we might be opening a collider if "Slot" depends on $A$.
      *   *Verdict:* It looks like matching on a post-treatment variable (the specific conception event). It tries to recover exchangeability between $i$ and $j$ by asserting they are the "same unit" functionally.
      *   *Fatal Flaw:* In CI, if $A$ causes the unit identity, you can't match across identities without assuming a higher-level unit (the "Slot"). But if the "Slot" is just a label for "whoever is born," it's tautological. If it's "Time $t$, Parents $P$," then $A$ changes $t$. So $K$ is not invariant.
      *   *User's Instinct:* Is it just an ill-posed estimation problem? Yes, statistically. But the *moral* question is whether we *should* pose it that way. The CI framework forces you to define the unit. If you define the unit as "biological human," NIP breaks. If you define the unit as "welfare-instance," NIP dissolves. The fight is about unit definition, not estimation.

  7.  **Refining and Polishing:**
