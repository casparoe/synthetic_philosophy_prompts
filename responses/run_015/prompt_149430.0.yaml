answer: |-
  To be consistent with its track record, the Board should rule this **Corrupt**.

  The closest analog is **Case 5 (Principal's Fund)**. Like Case 5, this involves a gift offered by a party with a direct financial stake while a specific decision affecting them is pending. Case 5 established that cultural custom does not override the timing of the gift relative to the decision; similarly, the "three-year tradition" here should not override the suspicious shift in timing and guest list.

  ### The Implicit Rule: Objective Opportunity for Influence

  Your Board is not running a test of **subjective intent** (what the giver was thinking), nor is it running a test of **explicit exchange** (was a deal spoken?). Case 2 and Case 3 make clear that explicit requests are not required; Case 5 makes clear that subjective cultural justifications are irrelevant.

  Instead, your Board is applying an **Objective Standard of Influence Potential**. You weigh three variables:
  1.  **Temporal Proximity:** Is a decision pending? (Cases 2, 3, 5 = Corrupt; Case 1 = Not).
  2.  **Selectivity:** Is the gift targeted at the specific decision-makers? (New Case = Yes; Case 4 = No).
  3.  **Financial Stake:** Does the giver stand to gain from the decision? (Case 5 = Yes; Case 1 = No).

  In the new case, all three variables align toward corruption: The vote is pending (Temporal), only voters are invited (Selective), and the restaurant benefits from the fee increase (Stake). The "three-year tradition" is a mitigating factor drawn from Case 4, but Case 4 involved a generalized gift (all teachers) with no pending decision. The modification of the tradition (excluding alternates/adviser, moving the date) suggests the "tradition" is being weaponized, which negates the Case 4 defense.

  ### Underdetermination: What Each Verdict Commits You To

  While the weight of precedent points to "Corrupt," your rulings do contain a tension between **Case 4 (Custom as Shield)** and **Case 5 (Timing as Sword)**. If you find the case genuinely ambiguous, here is what each choice commits the Board to:

  **If you rule "Not Corrupt":**
  *   **The Principle:** *Established Norms Create Safe Harbors.*
  *   **The Commitment:** You are prioritizing the *history* of the interaction over the *structure* of the current instance. You are deciding that a standing relationship (even one that changes slightly) creates a presumption of innocence that overrides temporal proximity.
  *   **The Risk:** This contradicts the hint in Case 5 that "standing relationships of favors are worse." It also weakens Case 2 and 3, suggesting that if you do something enough times, the timing of the gift relative to the decision no longer matters.

  **If you rule "Corrupt":**
  *   **The Principle:** *Structural Opportunity Defines Corruption.*
  *   **The Commitment:** You are deciding that the *appearance of impropriety* is objective. If the gift creates an opportunity for undue influence (by targeting voters before a vote), it is corrupt regardless of past history or lack of explicit request.
  *   **The Risk:** You risk penalizing benign community building. If a local business wants to support students, this ruling suggests they must avoid anyone who might ever vote on anything related to them, potentially chilling legitimate community partnerships.

  ### The Tie-Breaker Case

  To resolve the tension between **Tradition (Case 4)** and **Timing/Stake (Case 5)**, you need a case that isolates *Custom* from *Financial Stake*.

  **Proposed Case:**
  > A local bookstore has donated $500 to the school library every December for ten years (a known tradition). This year, the school is voting on whether to switch all textbook purchasing to an online vendor, which would put the bookstore out of business. The bookstore owner sends the $500 check in December, two weeks before the vote. No note is attached.

  **Why this separates the rules:**
  *   **If you rule Corrupt:** You have confirmed that **Financial Stake + Timing** trumps **Tradition**. This solidifies the "Corrupt" verdict for the Restaurant Case.
  *   **If you rule Not Corrupt:** You have confirmed that **Long-standing Custom** trumps **Timing/Stake**. This would force you to rule "Not Corrupt" in the Restaurant Case to remain consistent, implying that the "change in guest list" is the only thing that made the Restaurant Case suspicious, not the timing itself.

  **Recommendation:**
  Rule **Corrupt**. The modification of the guest list (excluding non-voters) is the smoking gun. It proves the "tradition" is being altered to maximize influence, moving it from a Case 4 scenario (general goodwill) to a Case 3 scenario (targeted inducement). The three-year history does not grant immunity; it merely raises the stakes, per the hint in Case 5.
