          *   Classify requirements as Non-Negotiable vs. Preference (Priya vs. User).
          *   Identify conflicting requirements (trade-offs).
          *   Identify the single requirement that rules out obvious candidate approaches ("preserve all," "read against grain," "oral testimony," "original order").
          *   Define what counts as "cheating" (vague platitudes like "be reflexive" without a test).
          *   No internet access (argue from cases).

  2.  **Deconstruct the Distinctions & Cases:**

      *   *Case A:* Town council minutes (1921-1974). Official, bureaucratic, likely excludes the poor/un enfranchised.
      *   *Case B:* Shoebox of unlabelled photographs. Visual, context-less, potentially intimate or intrusive.
      *   *Case C:* Ledger of pauper burials. Names of the dead, but reduced to cost/status.
      *   *Distinction (i):* Never-created (poor didn't vote), Destroyed (fire? purge?), Unfindable (bad cataloging).
      *   *Distinction (ii):* Present-but-distorted (Pauper ledger: name exists, person doesn't).
      *   *Distinction (iii):* Abundance-as-absence (Minutes full of procedural nonsense, hiding the actual impact).
      *   *Distinction (iv):* Chosen silence (Someone didn't want to be recorded).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Goal:* Practical policy guidance.
      *   *Requirement 1 (Addressing Distinction i):* We need to know *why* something isn't there. Is it lost or was it never made?
