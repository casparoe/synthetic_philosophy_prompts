answer: |-
  Here is a specification for an "Account of Silence" tailored to your municipal archive context. It is designed to function as a policy checklist, not a theoretical framework.

  ### Part 1: The Distinctions
  You asked which of your four distinctions are essential for this spec and which are optional.

  *   **(i) Never-created vs. Created-then-destroyed vs. Created-but-unfindable:** **Core.** You cannot write policy on "filling gaps" if you cannot diagnose the type of gap. A search box cannot fix "never-created," and "unfindable" requires a different labour investment (re-cataloging) than "destroyed" (acknowledging loss).
  *   **(ii) Present-but-distorted:** **Core.** This is your primary workload. The pauper ledger and council minutes are full of people who appear only as costs or problems. Any policy must handle how to index a human being who is described only as a burden.
  *   **(iii) Abundance that functions like absence:** **Optional.** In a tiny municipal archive, you rarely have *too much* data. You likely have the opposite problem. This distinction matters for national archives, but for you, it is a low-priority edge case.
  *   **(iv) Silence somebody chose:** **Core.** This is the ethical floor. The shoebox of photos and recent minutes (1974 is within living memory for some) require you to consider whether digitization violates a choice to remain unrecorded.

  ### Part 2: The Specification Requirements
  Each requirement includes the concrete case, the classification (Non-Negotiable vs. Preference), and the camp it favours (Priya vs. You).

  **Req 1: The Source Attribution Tag**
  *   **Case:** A name appears in the Pauper Burial Ledger.
  *   **Rule:** Every searchable term attached to a record must carry a tag indicating the *origin* of that term: `[Source Text]`, `[Cataloguer Inference]`, or `[External Testimony]`.
  *   **Type:** **Non-Negotiable.**
  *   **Camp:** **Yours.**
  *   **Reason:** Prevents the search engine from treating an inference (e.g., guessing a neighbourhood based on a church) as fact. It stops the "nice-looking exercise of power" by forcing the interface to show the user where the information came from.

  **Req 2: The Negative Space Statement**
  *   **Case:** The Council Minutes (1921–1974).
  *   **Rule:** Any digital collection landing page must display a "Scope of Absence" statement that explicitly lists who is *structurally excluded* from these records (e.g., "These minutes record the views of ratepayers; non-property holders appear only when subject to enforcement").
  *   **Type:** **Non-Negotiable.**
  *   **Camp:** **Yours.**
  *   **Reason:** Counters Priya's claim that "absence only looks like silence because nobody has looked properly." This forces the archive to admit that looking properly will not find what was never written.

  **Req 3: The Distortion Warning**
  *   **Case:** A removal order in the minutes where a family is described as "nuisance" or "filthy."
  *   **Rule:** If a subject appears in the record solely as the object of a negative administrative action, the metadata must not normalise the language. The search index must allow searching for the *action* (Removal Order) without indexing the *insult* as a neutral descriptor of the person.
  *   **Type:** **Preference (Yours).**
  *   **Camp:** **Yours.**
  *   **Reason:** Priya wants everything searchable. You want to prevent the archive from reinforcing the council's bias. If a user searches "nuisance," they should find the *policy*, not be handed a list of people labelled as nuisances without context.

  **Req 4: The "Unfindable" Labour Cap**
  *   **Case:** The shoebox of unlabelled photographs.
  *   **Rule:** Do not digitise items where the identification labour requires contacting living relatives or speculative community crowdsourcing, unless a specific project fund exists for it.
  *   **Type:** **Preference (Priya).**
  *   **Camp:** **Priya.**
  *   **Reason:** Priya argues "get everything up." This requirement limits that to what is practically manageable without exploiting volunteer labour to solve the "created-but-unfindable" problem indefinitely. It accepts some silence to preserve volunteer capacity.

  **Req 5: The Chosen Silence Opt-Out**
  *   **Case:** A photograph in the shoebox that is clearly private (e.g., a family gathering) but ended up in the archive by accident.
  *   **Rule:** If a record lacks public context (no caption, no official provenance) and depicts identifiable individuals post-1950, it is classified as "Restricted" by default until provenance is established.
  *   **Type:** **Non-Negotiable.**
  *   **Camp:** **Yours.**
  *   **Reason:** Addresses Distinction (iv). It assumes silence was chosen unless evidence proves otherwise. This directly contradicts "preserve and catalogue everything."

  **Req 6: The Volume Neutrality**
  *   **Case:** 50 years of minutes where 90% of the text concerns road repairs and 10% concerns people.
  *   **Rule:** The search interface must not weight results by volume. A single mention of a person must be as retrievable as a recurring mention of a street name.
  *   **Type:** **Preference (Priya).**
  *   **Camp:** **Priya.**
  *   **Reason:** Addresses Distinction (iii). Priya wants the search box to work hard. This ensures that "abundance of bureaucracy" doesn't bury the "scarcity of human data."

  ### Part 3: The Conflict
  You guessed the conflict was between "explain the mechanism" and "don't invent voices." That is a tension, but it is manageable. The actual irreconcilable pair in this spec is:

  **Req 1 (Source Attribution Tag) vs. Req 6 (Volume Neutrality / Searchability)**

  *   **The Conflict:** Priya wants a "decent search index" that fixes absence. To make the search index "decent" for the user, you want to make it seamless. But Req 1 demands that every tag show its provenance (e.g., `[Inference]`).
  *   **Why they can't coexist:** If you tag every inference, the search results become cluttered and "scary" for the casual user (Priya's concern: access). If you make the search seamless and clean, you hide the distinction between fact and guesswork (Your concern: power/speculation).
  *   **The Trade-off:** You must decide if the archive is a **research tool** ( Req 1 wins, search is clunky but honest) or a **public resource** (Req 6 wins, search is smooth but risks misleading). You cannot have a seamless search box that also visibly flags every speculative tag without degrading the user experience significantly.

  ### Part 4: The Killer Requirement
  You asked for the single requirement that does the most work in ruling out the obvious candidate approaches.

  **The Requirement:** **Req 1 (The Source Attribution Tag).**
  *"Every searchable term attached to a record must carry a tag indicating the origin of that term: [Source Text], [Cataloguer Inference], or [External Testimony]."*

  **Why it rules out the candidates:**
  1.  **Rules out "Preserve and catalogue everything":** You cannot catalogue everything without inferring things (dates, locations, identities). If you must tag every inference, the labour cost triples. You will be forced to prioritise, not just preserve.
  2.  **Rules out "Read the sources against the grain":** This approach often relies on the historian's interpretation becoming the "truth" of the record. Req 1 forces you to label your reading as `[Cataloguer Inference]`, stripping it of the authority of the original text. It prevents the "against the grain" reading from becoming the new official record.
  3.  **Rules out "Plug the holes with oral testimony":** You can add oral testimony, but Req 1 forces you to tag it as `[External Testimony]`. It prevents the memory from merging with the minute. It stops you from "fixing" the silence by pretending the memory *is* the record.
  4.  **Rules out "Stick to original order and provenance":** Original order often hides the mechanism of erasure (e.g., pauper files kept separate from ratepayer files). To apply Req 1 accurately, you often have to re-arrange or link records to show *why* the tag is `[Source Text]` vs `[Inference]`, breaking strict provenance to ensure metadata accuracy.

  ### Part 5: The Anti-Cheating Test
  You warned against requirements like "be reflexive" or "centre marginalised voices." These are cheating because they are virtues, not instructions. A volunteer cannot "be reflexive" at 4 PM on a Tuesday.

  **The Test:** **The "Stranger Rule."**
  *   **Definition:** A requirement passes the test if a volunteer who disagrees with the archive's ethics can follow the instruction *mechanically* and still produce the correct ethical outcome.
  *   **Application to Req 1:** A volunteer who thinks "guessing is fine" can still follow Req 1. They simply have to tick the box `[Cataloguer Inference]`. The system exposes the guess without requiring the volunteer to *feel* guilty about it.
  *   **Application to "Be Reflexive":** Fails. A volunteer can think "I am being reflexive" while making a harmful guess. There is no mechanical check.
  *   **Application to "Centre Marginalised Voices":** Fails. In the Pauper Ledger, the marginalised voice *is not there*. A volunteer trying to "centre" it will inevitably invent one. Req 1 prevents this by forcing the tag `[Source Text]` (which says "Pauper") rather than allowing a tag like `[Community Member]` (which is an invention).

  **Summary for your Committee:**
  Adopt **Req 1** and **Req 2** as Non-Negotiable. They protect you from lying about the collection. Adopt **Req 5** to protect the living. Accept the conflict between **Req 1** and **Priya's vision of a seamless search**; tell her that a search box that hides the difference between a fact and a guess is not a search box, it's a generator of misinformation. Use the **Stranger Rule** to vet any future ethical guidelines: if it requires a change of heart rather than a change of workflow, reject it.
