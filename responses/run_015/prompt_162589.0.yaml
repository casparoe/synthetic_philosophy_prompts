      *   *Requirement 2 (Addressing Distinction ii):* If they are only objects, say so. Don't pretend the record speaks for them.
          *   *Case:* A removal order in the minutes.
          *   *Draft:* Label the perspective of the record.
      *   *Requirement 3 (Addressing Distinction iii):* Volume isn't coverage.
          *   *Case:* 50 years of minutes about road repairs, nothing about the people living on the roads.
          *   *Draft:* Audit for density of coverage, not just volume of pages.
      *   *Requirement 4 (Addressing Distinction iv):* Respect the right to be forgotten.
          *   *Case:* Unlabelled photos. Maybe they are private.
          *   *Draft:* Allow for redaction or non-digitization based on privacy/consent.
      *   *Requirement 5 (The "Cheating" Test):* Make "reflexivity" actionable.
          *   *Draft:* Every annotation must state who is speaking.

  4.  **Refining and Classifying (Non-Negotiable vs. Preference):**

      *   *Priya's Camp:* Maximize access, trust search, fill gaps with context.
      *   *User's Camp:* Acknowledge limits, don't speculate, protect silence.
      *   *Non-Negotiable:* Must prevent harm, must be truthful about the source.
      *   *Preference:* How much effort to spend on context vs. raw data.

  5.  **Identifying Conflicts:**

      *   The user suspects "explain the mechanism" vs. "don't invent voices."
      *   *Better Conflict:* "Provide context to explain the silence" vs. "Do not add metadata that wasn't in the original." If you explain *why* a pauper is silent, you are adding interpretive layer (User likes this, Priya might find it clutter). But the real tension is between *Accessibility* (Priya) and *Integrity of Silence* (User).
      *   *Specific Conflict:* "Make everything searchable" vs. "Respect chosen silence." If I digitize the photo, I violate the silence. If I don't, I violate access.

  6.  **Identifying the "Killer" Requirement:**

      *   Which one kills "preserve everything," "read against grain," "oral testimony," "original order"?
      *   "Preserve everything" fails if silence was chosen.
      *   "Read against grain" fails if it invents voices.
      *   "Oral testimony" fails if it conflates memory with record.
      *   "Original order" fails if the order itself is the mechanism of erasure.
      *   *Candidate:* "The archive must distinguish between the *record of an event* and the *experience of the participant*." Or: "Metadata must not upgrade the status of a subject."
      *   *Stronger Candidate:* **"No annotation may convert a subject into an agent without explicit evidence."** This stops speculation (User's fear) but also stops "reading against the grain" if that means pretending the pauper had agency in the ledger. It also challenges "preserve everything" because some things (unlabelled photos) might violate this by exposing subjects without agency.

  7.  **Defining "Cheating":**

      *   Vague terms like "community engagement" or "ethical stewardship."
      *   *Test:* Can a volunteer follow this instruction without a philosophy degree? If no, it's cheating.

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the stakes (policy, not theory).
      *   **The Distinctions:** Validate and categorize the user's four distinctions (Core vs. Optional).
      *   **The Specification (Requirements):** List them with Case, Type (NN/Preference), and Rationale.
      *   **The Conflict:** Identify the irreconcilable pair.
      *   **The Killer Requirement:** Identify the one that filters the standard approaches.
