prompt: |-
  So I'm about 60k into a historical novel — late Roman north Africa — and my POV character is a bishop I made up, Honoratus, who's a rigorist about lying (roughly the absolutist camp people associate with Augustine, though I'm not writing the man himself and Honoratus isn't supposed to be a mouthpiece for him). Problem is I've already written him ruling on a bunch of lying cases in earlier chapters, a beta reader says he's inconsistent, and now I have to write the scene I've been putting off and I can't decide whether he does the thing or not.

  His track record as written so far:

  - Soldiers ask a deacon's wife where a runaway is. She says "I don't know." She does know. Honoratus: that's a sin, and she should have said nothing at all or told them to go to hell instead.
  - A grain merchant tells a ridiculous tall story in a tavern, everybody laughs, nobody believes a word of it. Honoratus: still a lie, but a small one; he lets it go with a prayer.
  - A physician tells a dying man he'll recover. Honoratus: wrong. He makes the physician go back in and tell him the truth.
  - A widow is hiding two fugitives and, asked if they're in her courtyard, says "they are not here" — she means something like "not here in the sense you mean," a mental-reservation sort of move. Honoratus: no. That's a lie. Stop.
  - A man carrying a letter is stopped by a gang looking to kill the person it's addressed to. He refuses to answer, they beat him, he says nothing. Honoratus: this is the right way. You're allowed to not answer.
  - Two chapters back he's facing a mob hunting a tax collector. He doesn't say a word, but he points down the wrong road. I wrote him doing it and then hating himself for a week. I genuinely can't tell if that's consistant with the rest of it, since pointing isn't asserting anything false.

  Here's the scene I owe my editor. The fugitive is a twelve-year-old hiding in the bell tower. The person asking is not a mob and not a murderer: she's the town magistrate, a decent woman doing her job, and she questions him under oath, in the church. He answers in one sentence — something strictly true that she will definately take to mean the boy has gone north. And separately, a few hours before he's questioned, he leaves the tower door unlatched and a lamp burning so it will look like someone bolted out the back.

  So: does he say the line? But more usefully for me, what rule is he actually running? Because I can see at least three that fit all six of those verdicts — (a) never assert what you believe to be false, and everything else is fair game; (b) never give any sign in order to plant a false belief in someone, words or otherwise; (c) never let your words mean something other than what you believe, though what your hands do is a different matter. And maybe a fourth: something about an oath, or about being asked a direct question by someone who has a right to ask, where answering the question as asked matters and not just the literal truth of the sentence.

  Which one does the track record point to, what does each of them predict about the sentence and about the door-and-lamp business, which should I write him as running, and — the part that would be most helpfull — if I want a later chapter to make the rule unmistakable to a reader, what case should I put him in next? One more wrinkle: the novel has a small heretical sect, the Simplices, who hold that every sign is covenantal, so even locking a door is a kind of speech. I'd like to use them but don't want them to be a device that just exists so I can agree with them.

  Sorry, long one. I care less about the verdict than about the shape of the rule — I can write either version of the scene, I just can't write it if I don't know which consistency I'd be breaking.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** Historical novel, Late Roman North Africa.
      *   **Protagonist:** Honoratus, a fictional rigorist bishop (similar to Augustine's absolutist stance on lying, but distinct).
      *   **Current State:** 60k words in. Beta reader says Honoratus is inconsistent regarding lying.
      *   **The Conflict:** The author needs to write a scene where Honoratus faces a dilemma: A 12-year-old fugitive is hiding. A decent magistrate questions him under oath in church.
      *   **The Proposed Actions:**
          1.  Speak a sentence that is strictly true but misleading (implicature).
          2.  Stage a scene (unlatched door, burning lamp) to suggest escape.
      *   **The Goal:** Determine the *underlying rule* Honoratus follows based on his past verdicts, decide if the proposed actions fit that rule, and suggest a future scene to clarify the rule for the reader.
      *   **Constraint:** There's a heretical sect (Simplices) who believe *all* signs are covenantal (even locking a door). The author wants to use them but not as strawmen.

  2.  **Analyze Honoratus's Track Record (The Data):**
      *   *Case 1 (Deacon's Wife):* "I don't know" (when she does). Verdict: **Sin.** (Direct false assertion).
      *   *Case 2 (Merchant Tall Tale):* Obvious joke, no one believes. Verdict: **Sin, but venial.** (False assertion, but no intent to deceive belief).
      *   *Case 3 (Physician):* False hope to dying man. Verdict: **Sin.** (False assertion, harmful deception).
      *   *Case 4 (Widow/Mental Reservation):* "Not here" (meaning "not here in the spiritual sense"). Verdict: **Sin.** (Words mean one thing to listener, another in speaker's head).
      *   *Case 5 (Letter Carrier):* Refuses to answer, takes beating. Verdict: **Virtuous.** (Silence is permissible).
      *   *Case 6 (Mob/Tax Collector):* Points down wrong road. Verdict: **Sin (self-hated).** (Non-verbal assertion of falsehood).

  3.  **Evaluate the Proposed Rules against the Data:**

      *   *(a) Never assert what you believe to be false, everything else is fair game.*
          *   Fits: Cases 1, 3, 4 (asserting falsehood).
          *   Problem: Case 6 (Pointing). Pointing isn't a verbal assertion, but he hated himself for it. This suggests his rule covers non-verbal communication intended to deceive.
          *   Prediction for New Scene: The sentence is *strictly true*. So (a) allows it. The door/lamp is non-verbal. (a) might allow it if not an "assertion."
          *   *Verdict:* Too loose. Doesn't explain the pointing guilt.

      *   *(b) Never give any sign in order to plant a false belief in someone, words or otherwise.*
          *   Fits: Cases 1, 3, 4, 6 (Pointing creates false belief).
          *   Fits: Case 5 (Silence plants no false belief).
          *   Fits: Case 2 (Tall tale doesn't plant false belief).
          *   Prediction for New Scene: The sentence is true, but intended to plant a false belief (that the boy went north). The door/lamp is intended to plant a false belief (that he escaped).
          *   *Verdict:* **Strongest Fit.** This aligns with the "Augustinian" rigorist view that the *intent to deceive* is the sin, regardless of the literal truth of the words or the medium (hand vs. tongue).

      *   *(c) Never let your words mean something other than what you believe, though what your hands do is a different matter.*
          *   Fits: Cases 1, 3, 4.
          *   Problem: Case 6 (Pointing). He hated himself for pointing. If hands were different, he wouldn't feel guilt.
          *   *Verdict:* Incorrect. Honoratus treats gestures as morally equivalent to speech.

      *   *(d) Something about Oaths/Authority.*
          *   Fits: Case 5 (Refusing to answer).
          *   Problem: Case 1 (Soldiers aren't necessarily lawful authority in the same way a magistrate is, but he condemned the lie). Case 6 (Mob has no authority).
          *   *Verdict:* Too specific. Honoratus seems to apply the rule universally, not just under oath.

  4.  **Synthesize the "Honoratus Rule":**
      Based on Case 6 (the pointing), Honoratus believes that **communication is covenantal.** To communicate is to enter a bond of truth with the listener.
      *   *The Core Principle:* **Do not intend to deceive.**
      *   *Literal Truth isn't enough:* If you speak truth *in order* to deceive (Case 4 mental reservation is close, but the new sentence is implicature), it's still a sin.
      *   *Actions aren't exempt:* Pointing (Case 6) and staging a scene (New Scene) are communicative acts. If they intend to create a false belief, they are lies.
      *   *Silence is the only out:* You can withhold truth (Case 5), but you cannot invert it.

      *Wait, let's look closer at Case 4 (Widow).* She said "They are not here" with mental reservation. He said No.
      *   *New Scene Sentence:* "Something strictly true that she will definitely take to mean the boy has gone north." This is *not* mental reservation (where the speaker holds a secret meaning). This is *misleading implicature* (where the speaker relies on the listener's assumption).
      *   *Augustinian View:* Augustine distinguishes between *lying* (speaking falsehood) and *deceiving* (leading to falsehood). But in *De Mendacio*, he argues that *any* signification intended to deceive is a lie.
      *   *The Pointing Case:* This is the key. He pointed down the wrong road. He hated himself. Why? Because the gesture signified "He went that way," which was false.
      *   *The Door/Lamp:* This signifies "Someone left through here." That is false.
      *   *The Sentence:* If he says "I saw him heading toward the northern gate" (and he saw him heading there, but then he came back to the tower), that is technically true but intended to deceive.
      *   *Consistency Check:* If Honoratus hated himself for pointing (non-verbal false sign), he must hate himself for the door/lamp (non-verbal false sign). If he condemned the widow for mental reservation (words meaning one thing to listener, another to God), he must condemn misleading implicature (words meaning one thing to listener, another to reality/intent).

      *Refining the Rule:* **A lie is any sign (word, gesture, arrangement) given with the intent to create a belief the signer knows to be false.**
      *   Silence is not a sign.
      *   Truth spoken without intent to deceive (Case 2 Joke) is not a lie (or a minor one).
      *   Truth spoken *with* intent to deceive (The New Sentence) *is* a lie.

  5.  **Address the Specific Questions:**

      *   *Which rule fits?* Rule (b) is the closest, but needs refinement regarding *intent*. It's not just "planting a false belief," it's "signifying falsehood."
      *   *Does he say the line?* If he is consistent with Case 6 (Pointing) and Case 4 (Widow), **No.** He cannot say the line if the intent is deception. He cannot leave the door unlatched if the intent is deception.
      *   *Which should I write him as running?* He should refuse. He should offer silence or a refusal. This creates conflict with the Magistrate (perjury/contempt).
      *   *How to clarify for the reader?* Need a scene where the distinction between *withholding* and *inverting* is crystal clear.
      *   *The Simplices:* How to use them? They take it further (locking a door is speech). Honoratus can disagree with them on *what counts as a sign*, while agreeing on the *sanctity of signs*. This makes them nuanced. Honoratus: "A locked door is privacy, not speech." Simplices: "A locked door says 'Go Away', thus it is speech."

  6.  **Drafting the Advice:**

      *   **Diagnosis:** The beta reader is right. Case 6 (Pointing) is the anchor. It proves Honoratus views non-verbal communication as morally equivalent to speech.
      *   **The Rule:** "Do not signify falsehood." It covers words, gestures, and staged evidence. Intent to deceive makes it a lie, even if words are technically true (implicature).
      *   **The Verdict:** He cannot say the line. He cannot stage the door. He must choose silence or refusal, risking the Magistrate's wrath.
      *   **The Simplices:** Use them to highlight the boundary. Honoratus thinks they are crazy for calling a locked door "speech," but he respects their rigor. This shows Honoratus isn't *just* crazy, he has a specific theology of *communication*.
      *   **Future Scene:** A situation where telling the truth causes harm, but silence is impossible. Or a situation distinguishing *concealment* (hiding the boy) vs. *deception* (staging the escape). Concealment is okay; deception is not.

  7.  **Refining the "Strictly True" Sentence:**
      *   If the sentence is *strictly true*, is it a lie?
      *   Augustine: Yes, if the *intent* is to deceive. (See *De Mendacio*).
      *   Example: "I do not know where he is *now*." (He knows where he was an hour ago).
      *   Honoratus's view: If you say it to make her think you don't know his location, it's a lie.
      *   So, for maximum consistency with Case 6 (Pointing), the sentence must be rejected.

  8.  **Structuring the Response:**
      *   **Validate:** Acknowledge the complexity. This is good theological/philosophical ground for a novel.
      *   **Identify the Anchor:** Case 6 (Pointing) is the key to unlocking the rule.
      *   **Define the Rule:** "The Covenant of Signification."
      *   **Apply to Current Scene:** Verdict on the sentence and the door.
      *   **The Simplices:** How to integrate them without strawmanning.
      *   **Future Scene:** A specific scenario to cement the rule.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, Case 2 (Joke):* He let it go with a prayer. Why? Because there was no *intent to deceive belief*. Everyone knew it was a joke. This confirms **Intent** is the key variable.
      *   *Case 4 (Widow):* Mental reservation. He said No. Why? Because she intended the listener to believe a falsehood, even if her "internal" meaning was true.
      *   *New Sentence:* If it's misleading implicature, it functions like Mental Reservation. The listener believes X, Speaker knows Not-X, Speaker intends Listener to believe X. This is a lie.
      *   *Conclusion:* He must not say it.

  10. **Final Polish:** Ensure tone is helpful for a writer, not just a theologian. Focus on narrative tension. (The tension of *not* lying is often higher than the tension of lying).

      *(Self-Correction on the Simplices)*: If the Simplices say locking a door is speech, and Honoratus says it isn't... that creates a great theological debate. Honoratus can be *less* extreme than the heretics, which makes him more sympathetic/grounded, while still being extreme compared to normal people.
      *   Honoratus: "Signs require intent to communicate."
      *   Simplices: "All actions are signs before God."
      *   This allows Honoratus to leave the door unlatched? No, because he *intends* it to communicate.
      *   Actually, if the Simplices say *everything* is speech, Honoratus can argue against them to clarify his own position. "I do not speak with my door, I speak with my tongue and my gestures." But wait, Case 6 (Pointing) contradicts "only tongue."
      *   Better: Honoratus believes *intentional signs* are covenantal. Simplices believe *all existence* is covenantal. Honoratus can stage the door *if* he doesn't view it as a sign? No, he's staging it *to be seen*. That makes it a sign.
      *   Okay, keep it simple: Honoratus agrees with Simplices on the sanctity of signs, disagrees on the scope.

      *Let's finalize the recommendation:*
      1.  Rule: **Intentional Deception via Signification.**
      2.  Scene: He refuses to speak/stage.
      3.  Simplices: Use them to show the *limit* of his rigor (he's not *that* crazy).
      4.  Future Case: Hiding vs. Lying.

      *(Wait, one nuance on the "Strictly True" sentence)*: If he says "The boy is not in this building" (and the boy is in the bell tower, which is technically a separate structure?), that's Mental Reservation (Case 4). If he says "I saw him running north" (and he saw him running north *earlier*, before he doubled back), that's misleading implicature. Augustine condemns both. Honoratus should too.

      *Okay, ready to write.*
answer: |-
  This is a fantastic problem to have. It means your character has a coherent internal logic that is now pressing against the plot, which is where the best drama lives. The beta reader is right to flag inconsistency, but only because the *rule* hasn't been explicitly defined yet, not because Honoratus is necessarily broken.

  Based on the six verdicts you've provided, specifically the **Pointing Case (Case 6)** and the **Mental Reservation Case (Case 4)**, I can tell you exactly what rule Honoratus is running, what he should do in the Magistrate scene, and how to use the Simplices to sharpen the theme without making them caricatures.

  ### 1. The Rule: "The Covenant of Signification"

  Your Option (b) is the closest, but it needs one specific theological tweak to fit all six previous cases. Honoratus isn't just avoiding "planting a false belief." He is avoiding **breaking the covenant of communication.**

  For Honoratus, to communicate (via word, gesture, or staged evidence) is to enter a temporary bond of trust with the listener. To use that bond to transmit falsehood is a sin against the nature of the sign itself.

  **The Formula:**
  *   **Is it a sign?** (Words, gestures, staged evidence intended to be read). **YES.**
  *   **Is the content false?** (Either literally or in the intended takeaway). **YES.**
  *   **Is the intent to deceive?** **YES.**
  *   **Verdict:** **LIE.**

  **Why this fits your track record:**
  *   **Cases 1, 3, 4:** False words intended to deceive. (Clear violations).
  *   **Case 5 (Silence):** Silence is the *absence* of a sign. You cannot break a covenant you do not enter. He stays silent, takes the beating, remains virtuous.
  *   **Case 6 (Pointing):** This is your anchor. Pointing is non-verbal, but it is a *sign*. He hated himself because he used a sign to convey falsehood. This proves his rule covers **actions intended to be read.**
  *   **Case 2 (Joke):** This is the exception that proves the rule. It wasn't a lie (or was venial) because there was **no intent to deceive belief.** The covenant was suspended by mutual social agreement (humor).

  ### 2. The Verdict on the Magistrate Scene

  If you want Honoratus to remain consistent with Case 6 (Pointing) and Case 4 (Widow), **he cannot do either thing.**

  *   **The Sentence:** Even if strictly true, if the *intent* is to make the Magistrate believe the boy went north, it is a lie. Augustine (whose camp Honoratus occupies) argues that speaking truth *in order to deceive* is still a lie because the "heart" is lying. It functions exactly like the Widow's Mental Reservation: the listener understands X, the speaker knows Not-X, the speaker intends the listener to believe X.
  *   **The Door and Lamp:** This is identical to Case 6. An unlatched door and a burning lamp are signs that say, "Someone passed through here." If no one passed through, the sign is false. He staged a sign to deceive. That is a lie.

  **What you should write:**
  Honoratus must choose **Silence or Refusal.**
  He can hide the boy (concealment is not a sign). He can refuse to answer the Magistrate (withholding a sign is not a lie). But he cannot actively construct a false reality.

  **The Narrative Payoff:**
  This creates *more* tension than if he lies.
  *   If he lies, he saves the boy and hurts his soul.
  *   If he refuses, he saves the boy (maybe), but he risks the Magistrate's wrath, charges of contempt, or the Magistrate searching the church anyway.
  *   *Crucially:* It forces him to trust God with the outcome rather than manipulating the outcome through sin. That is the core of the rigorist mindset.

  ### 3. Using the Simplices (Without Strawmanning)

  You mentioned the Simplices believe "every sign is covenantal, so even locking a door is a kind of speech." This is a goldmine for clarifying Honoratus's rule.

  If Honoratus agrees with them completely, he becomes a caricature. If he disagrees completely, he looks lax. **Split the difference.**

  *   **The Simplices' Heresy:** They believe *existence* is speech. To lock a door is to say "Go Away." To eat bread is to say "I accept God's gift." They cannot hide anything, because hiding is a sign of "I am concealing."
  *   **Honoratus's Orthodoxy:** He believes *intent* makes the sign. Locking a door is just physics (wood on metal). It only becomes a "lie" if you lock it *specifically to signal* that the room is empty when it is not.

  **How to use them in the novel:**
  Have Honoratus debate a Simplex leader *after* the Magistrate scene.
  *   **Simplex:** "You left the door latched. You signified 'secure'. But the boy was inside. You lied with the wood."
  *   **Honoratus:** "The wood says nothing. I spoke nothing. I withheld my voice. There is no lie in silence, only in false speech."
  *   **Simplex:** "God reads the dust on the floor. Your inaction is a shout."
  *   **Honoratus:** "Then God is a tyrant, and we are not men but puppets. We are responsible for what we *send*, not what is *inferred*."

  This makes Honoratus look reasonable (he's not *that* crazy) while still maintaining his rigor on actual communication. It defines the boundary of his rule: **Intentional Signification.**

  ### 4. The "Unmistakable" Future Scene

  To make the rule crystal clear to the reader in a later chapter, you need a case that distinguishes **Concealment** (Permissible) from **Deception** (Sin).

  **The Scenario:**
  Honoratus is smuggling Eucharistic bread or sacred vessels past a checkpoint (perhaps during a persecution or a confiscation).
  *   **Option A:** He hides the vessels in a false bottom of a cart. The soldiers ask, "Is there anything else in this cart?" He says, "Nothing that concerns you." (Ambiguous/True).
  *   **Option B:** He puts the vessels in the cart. The soldiers ask, "Is there anything else?" He says, "No." (False).
  *   **Option C:** He carries the vessels openly but refuses to say what they are.

  **The Scene to Write:**
  Put him in a situation where **Concealment fails unless he Lies.**
  *   *Setup:* He is carrying a letter. He swallows it. The soldiers ask, "Did you have a letter?"
  *   *The Conflict:* If he says "No," it is technically true *now* (he has no letter, he has digested paper), but intended to deceive.
  *   *The Resolution:* He says, **"I have nothing to give you."**
      *   This is the "Honoratus Rule" in action. It is technically true (he won't give it to them). It implies he doesn't have it. But he didn't assert "I do not possess it."
      *   *Wait, actually:* To be truly consistent with Case 4 (Widow), even that might be too slippery for him.
      *   *Better Resolution:* He says nothing. They search him. They find nothing. He accepts the risk that they might cut him open (metaphorically or literally).

  **The Best Clarifying Case:**
  **The Pursued Innocent.**
  A man runs into Honoratus's church. Pursuers arrive. "Is he in here?"
  *   **Honoratus's Action:** He stands in the doorway. He does not speak. He does not point. He physically blocks them.
  *   **The Dialogue:**
      *   Pursuer: "Move, Bishop."
      *   Honoratus: "I cannot let you enter."
      *   Pursuer: "Is the man inside?"
      *   Honoratus: "I will not answer."
      *   Pursuer: "Then he is."
      *   Honoratus: "You may infer what you wish. I will not speak."

  This distinguishes him from the Simplices (who would say blocking the door is a sign) and from normal people (who would lie). It shows his rule is: **I control my tongue and my gestures. I do not control your inferences.**

  ### Summary of Advice

  1.  **The Rule:** Honoratus follows **"Do not intentionally signify falsehood."** This covers words, gestures (pointing), and staged evidence (the lamp). Literal truth does not excuse intent to deceive.
  2.  **The Scene:** He **does not** say the line. He **does not** leave the lamp. He refuses to answer the Magistrate under oath, citing the sanctity of the church or his office, and accepts the consequences (contempt, threat of arrest). This raises the stakes.
  3.  **The Simplices:** Use them to show Honoratus is *not* insane. He disagrees with them on "unintentional signs." This makes his rigor a choice, not a compulsion.
  4.  **Future Clarity:** Write a scene where he protects someone by **withholding information** rather than **inverting information**. Show him accepting physical danger rather than compromising the "Covenant of Signification."

  This path keeps your beta reader happy (consistency), keeps Honoratus sympathetic (he suffers for his truth), and keeps the theology nuanced (via the Simplices).
