prompt: |-
  hi — I keep having the same argument in our department's work-in-progress group and I'm not winning it, so I want to get clearer before I answer back in the comments thread on the group blog.

  Setup: whenever someone runs a spectrum/continuum argument — the mere-addition kind of chain of small "better than" steps that ends somewhere like the Repugnant Conclusion — a value theorist who visited us last month (very good, annoyingly) leans on one analogy every time. "Better than," he says, is just like "taller than." Both are ordinary comparative relations; behind each there's a single underlying scalar quantity that the items have more or less of; that quantity's structure makes the relation transitive; and our inability to tell the difference between neighbours in a long chain is a Sorites-style epistemic blur, not a metaphysical fact about the relation. So, he concludes, in any such chain at least one step is simply false, we just can't locate which one, and spectrum arguments therefore show nothing about wether "better than" is transitive — they're the value-theory version of arguing from "you can't say when someone stops being tall" to "there's no fact about who's tall." He also seems to want the stronger bit: that there's a real-valued magnitude of goodness out there, since that's what makes the height case tick.

  Could you audit the analogy properly for me? I want the correspondence table — what plays the role of the objects, the quantity, the unit, the measurement procedure, the thresholds — and then the breaks, and, importantly, which breaks actually matter for the use he's making of it versus which are just cute. Three things I half-think and can't get straight: (1) height is an extensive magnitude, you can concatenate rods and count units, and that structure is what underwrites both the transitivity and the claim that a sharp cut-off exists somewhere even if we can't find it; betterness has no concatenation operation I can see, so even if transitivity transfers, the "there must be a break" half has nothing to stand on. (2) spectrum arguments are mostly built out of weak steps — "not worse than," "at least as good" — and in the height case the threshold-infected, intransitive relation is the perceptual one ("looks the same height as": Luce's semiorders and that whole literature), while strict "taller than" stays clean; so it looks like the analogy may be pointing at the wrong relation, transitive where the argument needs it to be silent and silent where the argument needs it to say something. (3) I suspect it begs the question: if betterness had a unit and a real-valued representation, transitivity would follow by construction and there'd be no debate.

  So: does the conclusion survive, does it survive in some weaker form (say only as "a spectrum on its own can't establish intransitivity, you need an extra premise ruling out sharp breaks"), and is there a better comparison to reach for? I've heard "better chess player than" and majority-preference/ tournament cycles floated, and someone muttered about multidimensional dominance, but I couldn't make any of them carry the weight the height analogy carries. And if he's basically right, say that plainly too — I'd rather know now than in front of the group.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is in a departmental work-in-progress group. A visiting value theorist keeps using a "Better than is like Taller than" analogy to defend transitivity against spectrum arguments (specifically the Repugnant Conclusion style mere-addition paradoxes).
      *   **The Visitor's Claim:** "Better than" is a comparative relation based on a single underlying scalar quantity (like height). Sorites-style blur is epistemic, not metaphysical. Therefore, in any spectrum chain, one step *must* be false (a sharp cutoff exists), so spectrum arguments don't prove intransitivity. He implies goodness is a real-valued magnitude.
      *   **User's Goal:** Audit this analogy. Needs a correspondence table (objects, quantity, unit, measurement, thresholds), identify the breaks (where the analogy fails), distinguish critical breaks from superficial ones, and address three specific half-formed thoughts (extensive magnitude/concatenation, weak vs. strict relations/semiorders, question-begging).
      *   **Desired Output:** Does the conclusion survive? Weaker form? Better comparisons? Honest assessment if the visitor is right.

  2.  **Deconstruct the Visitor's Analogy ("Better than" $\approx$ "Taller than"):**
      *   *Core Claim:* Transitivity is secure because there's a hidden real number (magnitude) determining the relation. Vagueness is epistemic (we can't see the jump), not ontic (the jump doesn't exist).
      *   *Implication:* Spectrum arguments fail because they rely on the premise that every step is true ($A_1 > A_2 > \dots > A_n$). The visitor says one step *must* be false.

  3.  **Address the User's Three Half-Formed Thoughts:**
      *   *(1) Extensive Magnitude/Concatenation:* Height is extensive (you can stack blocks). Goodness isn't obviously extensive. Does this matter for transitivity? Transitivity holds for intensive magnitudes too (temperature), but the *measurement* and *sharp cutoff* justification relies on the structure of the scale. If goodness isn't measurable in units, the "sharp cutoff" claim is less motivated.
      *   *(2) Weak vs. Strict Relations (Semiorders):* Spectrum arguments often use "not worse than" ($\geq$) or "at least as good as." "Taller than" ($>$) is transitive. "Indistinguishable in height" ($\sim$) is *not* transitive (Luce's semiorders). The visitor conflates the epistemic access (looks same height) with the metaphysical relation (is same height). Spectrum arguments exploit the indifference relation.
      *   *(3) Question-Begging:* Asserting a real-valued representation *assumes* transitivity and completeness (Weak Order). If the debate is *whether* goodness forms a Weak Order, assuming it has a real-valued magnitude begs the question.

  4.  **Develop the Correspondence Table:**
      *   *Objects:* People/States of Affairs.
      *   *Quantity:* Height (meters) vs. Goodness (utils? value?).
      *   *Unit:* Meter vs. ??? (No standard unit of value).
      *   *Measurement:* Ruler/Optics vs. Intuition/Reflection (Noisy).
      *   *Threshold:* Sharp physical difference vs. Sharp axiological difference.

  5.  **Identify the Breaks (Where the Analogy Fails):**
      *   *Break 1: Ontology of the Quantity.* Height is physical and mind-independent (mostly). Goodness is normative/platonic/naturalist (disputed).
      *   *Break 2: Measurement Precision.* We *know* height has a sharp cutoff because physics says so. We *don't* know goodness does.
      *   *Break 3: The Nature of the Sorites.* In height, the Sorites is about *predicates* ("is tall"). In spectrum arguments, it's about *relations* ("is better than"). The visitor conflates "is tall" (vague predicate) with "is taller than" (transitive relation).
      *   *Break 4: Small Improvements.* In height, a micron difference makes $A$ taller than $B$. In value, a tiny improvement might not make $A$ *better* than $B$ (could be *on a par*, or *incommensurate*). This is the "Small Improvement Argument" (Chang, etc.).

  6.  **Evaluate the Visitor's Conclusion:**
      *   *Does it survive?* No, not in its strong form. It assumes what it tries to prove (that value is a linear scale).
      *   *Weaker form?* Yes: "Spectrum arguments alone don't *prove* intransitivity without ruling out epistemic sharp cutoffs." This is the "Epistemicist" reply to the Repugnant Conclusion (Greene, Sider, etc.).
      *   *Better Comparisons?*
          *   *Tournament/Cycles:* Rock-Paper-Scissors (intransitive by nature).
          *   *Multidimensional:* "Better all-things-considered" vs. "Better in respect X."
          *   *Chromatics:* Color hues (is Redder than). Actually, this supports the visitor (spectrum of wavelength), but "Better" might be more like "Better Match" (contextual).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, philosophical, rigorous but accessible (for a blog comment).
      *   *Structure:*
          1.  Direct Answer (The Verdict).
          2.  The Correspondence Table.
          3.  The Critical Breaks (addressing the user's 3 points).
          4.  Assessment of the Conclusion (Strong vs. Weak).
          5.  Alternative Analogies.
      *   *Refining Point 1 (Extensive Magnitude):* Focus on the *Archimedean property*. Height satisfies it. Goodness might not (lexical values). If lexical values exist, no real-valued function represents the order.
      *   *Refining Point 2 (Semiorders):* This is crucial. The visitor attacks the strict relation ($>$), but the Repugnant Conclusion often relies on the weak relation ($\geq$) or the indifference relation ($\sim$). If $A \sim B$ and $B \sim C$ but $A > C$, transitivity of indifference fails. The visitor says "Indifference is just ignorance of $>$." The counter is "No, indifference is a sui generis normative relation (parity)."
      *   *Refining Point 3 (Question Begging):* Representational Measurement Theory. To map to Reals, you need a Weak Order. Assuming the map exists assumes the Order.

  8.  **Final Polish:** Check against the user's specific constraints ("audit the analogy properly," "correspondence table," "which breaks matter"). Ensure the distinction between *Epistemicism* (there is a fact, we don't know it) and *Ontic Vagueness/Intransitivity* is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "the visitor is wrong." I need to explain *why* the analogy feels compelling but fails under pressure. The "Epistemicist" defense of transitivity is a legitimate position (e.g., Sider), so I must acknowledge that while showing why the *height analogy* specifically doesn't do the heavy lifting.

      *Key distinction:* The visitor is making an *Epistemicist* claim about value. The analogy supports Epistemicism about *predicates* (is tall), but spectrum arguments are about *relations* (better than). The shift from Predicate Vagueness to Relational Intransitivity is the weak point.

      *Wait, one more thing:* The user mentioned "mere-addition." This is Parfit. The specific move is $A \to A^+ \to B \dots \to Z$. The visitor says one step is false. The counter is: Which one? If it's arbitrary, it violates Supervenience or Non-Arbitrariness. Height cutoffs aren't arbitrary in the same way (physics). Value cutoffs seem arbitrary.

      *Okay, ready to write.*
answer: |-
  This is a classic move in meta-ethics and value theory, often associated with **epistemicism about vagueness** applied to transitivity. The visitor is essentially arguing that "betterness" is a **Weak Order** (complete and transitive) representable by a real-valued function, and that any apparent failure of transitivity is due to our inability to detect the precise point where the magnitude shifts.

  Here is the audit you requested, broken down into the correspondence table, the structural breaks, an assessment of your three hunches, and a verdict on whether his conclusion survives.

  ### 1. The Correspondence Table

  To see where the analogy loads the dice, we need to map the structural components of the "Height" case to the "Goodness" case.

  | Component | The Height Case ("Taller Than") | The Goodness Case ("Better Than") | Status of Mapping |
  | :--- | :--- | :--- | :--- |
  | **Objects** | Physical bodies / rods. | Outcomes / States of affairs / Lives. | **Secure.** Both are relata. |
  | **Quantity** | Physical extension (length). | Normative magnitude (value/utility). | **Contested.** Length is natural; Value is normative/platonic. |
  | **Scale Type** | Ratio Scale (has true zero, units). | Unknown (Ordinal? Interval? Ratio?). | **Break.** Height is Archimedean; Value may be lexical. |
  | **Unit** | Meter / Inch (standardized). | Util? Hedon? (No consensus unit). | **Break.** No operational definition of a "unit of goodness." |
  | **Measurement** | Ruler / Laser / Optics. | Intuition / Reflection / Moral Theory. | **Break.** Measurement error in height is technical; in value, it may be constitutive. |
  | **Relation** | Strict Order ($>$). | Strict Order ($>$) or Weak Order ($\geq$). | **Break.** See "Semiorders" below. |
  | **Threshold** | Physical difference (e.g., 1 micron). | Normative difference (e.g., one happy life). | **Break.** Physical diffs are continuous; Value diffs may be discrete or gappy. |
  | **Vagueness** | Epistemic (we can't see the micron). | Epistemic (Visitor's claim) vs. Ontic (Parity). | **The Crux.** |

  ### 2. The Critical Breaks (Where the Analogy Fails)

  You identified three hunches. All three are correct, but they target different layers of the argument. Here is how they function as "breaks" in the analogy.

  #### Break A: The Measurement/Unit Problem (Your Point 1)
  *   **The Visitor's Move:** Because height has a unit and is extensive, we know a sharp cutoff *must* exist physically, even if we can't see it. Therefore, goodness must have a sharp cutoff too.
  *   **The Break:** Height is an **extensive magnitude**. You can concatenate two rods to make a longer one. This structure (an extensive structure) *proves* the existence of a real-valued representation (representation theorems in measurement theory). Goodness has no concatenation operation. You cannot "add" two lives together to make a longer life in the same way.
  *   **Why it matters:** Without an extensive structure, you cannot derive the existence of a real-valued magnitude. Asserting that goodness *has* a real-valued magnitude without a concatenation operation is not an analogy; it is an **axiom**. If you assume the axiom, you get transitivity by definition. This makes the argument circular (your Point 3).

  #### Break B: The Semiorder Problem (Your Point 2)
  *   **The Visitor's Move:** He treats "Better than" strictly as the strict relation ($>$). He argues that just as $A$ is strictly taller than $B$ even if they look the same, $A$ is strictly better than $B$ even if they seem equal.
  *   **The Break:** Spectrum arguments (like Parfit's) usually rely on the **weak relation** ("not worse than" or "at least as good as", $\geq$) or the **indifference relation** ($\sim$).
      *   In height: "Indistinguishable height" is intransitive (Luce's Semiorders). $A \sim B$, $B \sim C$, but $A > C$. This is accepted as *perceptual* limitation.
      *   In value: The spectrum argument claims the *normative* indifference is intransitive. $A$ is *normatively* on a par with $B$, $B$ with $C$, but $A$ is better than $C$.
  *   **Why it matters:** The visitor dismisses the "blur" as merely epistemic (we can't tell). But in value theory, the claim is often that the *normative relation itself* is not a linear order. By focusing on "Taller than" (strict), he ignores the relation actually doing the work in the paradox ("At least as good as"). If "At least as good as" is not transitive, the real-valued magnitude model collapses.

  #### Break C: The Arbitrariness Objection (The "Which Step?" Problem)
  *   **The Visitor's Move:** "One step is simply false, we just can't locate which one."
  *   **The Break:** In the height case, the cutoff is determined by physical facts (atomic structure, etc.). In the spectrum argument (e.g., from Mozart to Muzak, or from A to Z populations), the items are qualitatively distinct.
  *   **Why it matters:** If there is a sharp cutoff in value, *where is it?* Is it at the 4,592nd person added? Is it when the pleasure quality drops by 0.003%? In height, the cutoff isn't arbitrary; it's fixed by physics. In value, a sharp cutoff implies a **normative brute fact** that seems arbitrarily placed. Most value theorists reject this because it violates the principle that normative supervenience shouldn't be arbitrary. The height analogy hides this arbitrariness because we accept physical brute facts more easily than normative ones.

  ### 3. Audit of Your Three Hunches

  1.  **"Height is extensive... betterness has no concatenation."**
      *   **Verdict:** **Correct and Fatal.** This is the strongest technical objection. In Measurement Theory (Krantz, Luce, Suppes, Tversky), to claim a relation is representable by real numbers ($x > y \iff \phi(x) > \phi(y)$), you need specific structural axioms (like the Archimedean axiom). Height satisfies these. Goodness likely does not (due to lexical values or incommensurability). If goodness isn't Archimedean, it can't be represented by real numbers, and the "sharp cutoff" logic fails.
  2.  **"Spectrum arguments use weak steps... 'looks the same' is intransitive."**
      *   **Verdict:** **Correct and Crucial.** The visitor is attacking a straw man. He defends the transitivity of *strict* betterness ($>$). But the Repugnant Conclusion and spectrum arguments usually exploit the transitivity of *indifference* or *weak preference* ($\sim$ or $\geq$). If he concedes that "looks the same height" is intransitive, he must explain why "normatively on a par" isn't allowed to be intransitive too.
  3.  **"It begs the question."**
      *   **Verdict:** **Correct.** To say "Goodness is a real-valued magnitude" is logically equivalent to saying "Goodness is a complete, transitive, Archimedean order." Using the former to prove the latter is circular.

  ### 4. Does the Conclusion Survive?

  **Strong Form:** ("There *is* a sharp cutoff, goodness is a real magnitude, spectrum arguments fail.")
  *   **Verdict:** **No.** The analogy does not support this. It assumes the metaphysics of value (that it is a linear magnitude) to prove the metaphysics of value.

  **Weaker Form:** ("A spectrum argument *alone* cannot establish intransitivity without an extra premise ruling out epistemic sharp breaks.")
  *   **Verdict:** **Yes, this survives.** This is a standard **Epistemicist** reply (defended by philosophers like Ted Sider or Jamie Dreier). The logic is: *If* you accept classical logic and bivalence, then in a chain of propositions ($A_1$ is better than $A_2$, $A_2$ is better than $A_3$...), one must be false. The spectrum argument needs the premise "There are no sharp cutoffs in value" to work.
  *   **How to use this:** You can concede the weaker point without accepting the height analogy. You can say: "You are right that we need a 'No Sharp Cutoffs' premise. But the height analogy fails to justify that premise because value lacks the extensive structure that makes sharp cutoffs plausible in physics."

  ### 5. Better Comparisons to Reach For

  If you want to counter the height analogy with a better one that captures the normative structure:

  1.  **"Better Chess Player Than" (Tournament Relations):**
      *   *Why:* Chess rankings are often intransitive (A beats B, B beats C, C beats A).
      *   *Weight:* It shows that "better performance" doesn't always map to a single scalar skill rating. However, the visitor will say "That's just performance noise, underlying ELO is transitive."
  2.  **"All-Things-Considered Better" vs. "Better in a Respect" (Multidimensional):**
      *   *Why:* Height is one-dimensional. Value is plausibly multidimensional (pleasure, autonomy, knowledge).
      *   *Weight:* If $A$ is better on dimension 1, $B$ on dimension 2, there may be no fact of the matter about which is "better" simpliciter. This supports **incompleteness** rather than intransitivity, which also kills the real-valued magnitude claim.
  3.  **The "Color Spectrum" (Hue):**
      *   *Why:* This is actually *better* for the visitor's case (wavelength is real-valued), but you can turn it.
      *   *The Turn:* "Redder than" is transitive. But "Is Red" is vague. The spectrum argument is more like "Is Red." However, the better analogy is **Color Matching**. In color science, perceptual matching is intransitive (semiorder). If value is like color *perception* rather than color *wavelength*, the visitor's analogy fails.

  ### 6. Suggested Response Strategy for the Blog

  Don't try to prove intransitivity directly. Attack the **support** for his transitivity claim.

  **Drafting the core point:**
  > "The 'Taller Than' analogy relies on a specific measurement structure (extensive magnitude) that guarantees a real-valued representation. In physics, we accept sharp cutoffs in height because we have independent access to the underlying quantity (meters). In value theory, positing a 'hidden magnitude' of goodness is not an analogy; it is the very thesis under dispute.
  >
  > If we assume goodness is a real-valued magnitude, transitivity follows by construction. But spectrum arguments are designed to test whether goodness *has* that structure. To defend transitivity by assuming the structure that entails transitivity begs the question.
  >
  > Furthermore, the analogy conflates the strict relation ('taller than') with the weak relation ('at least as good as'). We accept that 'indistinguishable in height' is intransitive (a semiorder). The spectrum argument suggests 'normatively on a par' might be similarly intransitive. Dismissing this as 'epistemic blur' requires us to believe in arbitrary normative cutoffs (e.g., exactly where one life becomes better than another) without the physical grounding that makes such cutoffs plausible in the height case."

  **Verdict:** The visitor is relying on **Epistemicism**. It is a coherent position, but the height analogy does not *prove* it; it merely illustrates it. The analogy fails because the metaphysical grounding for the sharp cutoff in height (physics) is absent in value (normativity). You are right to resist it.
