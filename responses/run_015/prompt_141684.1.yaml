  Our reading group did Hobbes on geometry last night — his move that geometry is demonstrable because the lines and figures we reason about are things we ourselves draw and generate (a line from a point moved), whereas in natural philosophy we don't make the bodies, so we only conjecture causes from effects — plus that bit where he says reasoning is nothing over and above reckoning, adding and subtracting with marks. I want to open the next session with a question they can fight over, so give me the answer I'll be arguing against.

  Say somebody shows Hobbes a modern proof assistant. You feed in definitions and rules; the machine grinds out a verified proof of some geometric proposition, a million lines long, no human can follow it or picture the figure, and all anyone can honestly say is that the program says it checks. Would Hobbes count that as knowledge of the proposition?

