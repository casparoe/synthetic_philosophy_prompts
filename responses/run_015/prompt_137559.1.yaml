      *   *Avoid:* "Preferences". Use "Vector Field" or "Gradient of Value".
      *   *Clarify:* The user's guess about "gradient of scalar potential" is very close. If preferences are a vector field on the state space of goods, transitivity $\iff$ conservative field $\iff$ exists potential.
      *   *Diachronic:* Be careful with "Resolute Choice". In control, this is *open-loop control*. "Sophisticated" is *closed-loop feedback (HJB)*. "Precommitment" is *constraining the admissible control set at $t > 0$*.
      *   *Exploitability:* Distinguish between *Available Storage* (max extractable) and *Required Supply* (min needed to reach state). The Money Pump is about Available Storage being positive (energy can be taken out).
      *   *Binary vs. Graded:* Emphasize that control theory quantifies "how unstable." Philosophy struggles with "how irrational."

  5.  **Final Review against Constraints:**
