answer: |-
  Your hypothesis is structurally sound, but it requires sharpening to capture the precise friction point. You are correct that the impasse is not primarily about Newcomb's Problem itself; Newcomb's is merely the canonical stress test. The stalemate arises because CDT and the Updateless family (UDT/FDT/TDT) are operating with incompatible *ontologies of agency* and divergent *normative criteria for rationality*.

  However, dismissing this as merely "answering different questions" is too concessive. The Updateless camp argues that CDT is asking an ill-posed question in logically correlated environments. Conversely, CDT argues that Updateless theories conflate correlation with causation by reifying abstract algorithms into causal levers.

  Here is the diagnosis of the structure, the internal technical cruxes, and the prospects for resolution.

  ### 1. The Structure of the Disagreement: Ontology and Normativity

  You identified the "causal unit" (event vs. procedure) as the divergence. Formally, this manifests as a disagreement over the **scope of the intervention operator**.

  **Causal Decision Theory (CDT)** treats the decision as a local intervention on a physical variable at time $t$.
  $$ \text{Choose } a \text{ to maximize } \sum_s P(s | do_t(A=a)) U(s) $$
  Here, $do_t(A=a)$ surgically severs the node $A$ from its parents in the causal graph at time $t$. The predictor's output, being in the causal past, is a fixed parameter $S$. CDT agents condition on their observations (they update), treating the prediction as a fixed fact of the environment. Their norm is **Dynamic Consistency**: at the moment of choice, given the current state of the world, no other action yields higher expected utility.

  **Updateless Decision Theory (UDT/FDT)** treats the decision as the selection of a policy function $\pi$ that maps observations to actions.
  $$ \text{Choose } \pi \text{ to maximize } \sum_w P(w) U(\text{Outcome}(\pi, w)) $$
  Crucially, the expectation is taken over the *prior* $P(w)$, not the posterior after observing the box contents or the predictor's setup. The intervention is not on the action $A$, but on the output of the algorithm $M$ that produces $A$.

  **The Ontological Clash:**
  CDT assumes the physical token of the decision is the only causally efficacious entity. The "algorithm" is a description, not a cause.
  Updateless theories assume **Subjunctive Dependence**: distinct physical instantiations of the same logical computation are causally linked via logical necessity. If I compute $2+2$, and a predictor simulates me computing $2+2$, the outputs must match. Therefore, my decision *here* logically constrains the prediction *there*.

  **The Normative Clash:**
  *   **CDT** defines rationality as **local instrumental efficacy**. If the money is already in the box, taking two boxes *causes* me to have more money than taking one. To CDT, UDT is engaging in "magical thinking"—believing my choice influences the past.
  *   **Updateless** defines rationality as **global policy optimality**. An agent that two-boxes is the output of a policy that loses Newcomb problems. Since the agent *is* the policy, the agent loses. To UDT, CDT is "dynamically inconsistent"—it would have precommitted to one-boxing but fails to execute that commitment when the moment arrives.

  **Verdict:** This is not merely verbal. It is a substantive disagreement about whether **logical facts** can serve as the relata of counterfactual dependence. CDT says no (only physical causation counts); Updateless says yes (logical necessity constrains counterfactuals).

  ### 2. The Internal Schism: UDT vs. TDT vs. FDT

  Your suspicion regarding the Updateless camp is correct. The splits are not cosmetic; they track a profound, unresolved technical difficulty: **The Problem of Logical Counterfactuals.**

  To make Updateless Decision Theory work, one must formalize the statement: *"If my algorithm outputted $X$ instead of $Y$, what would the predictor's simulation have outputted?"*
  In standard logic, if the algorithm *actually* outputs $Y$, then the statement "It outputs $X$" is a contradiction. In classical logic, anything follows from a contradiction (Principle of Explosion). Decision theory requires evaluating counterpossibilities that are logically false but computationally uncertain.

  Here is where the formulations diverge:

  **TDT (Timeless Decision Theory):**
  *   **Approach:** Augments causal graphs with "logical nodes."
  *   **The Crux:** It lacks a formal criterion for graph construction. When do two physical systems share a logical node? Is it source code identity? Behavioral equivalence? If the predictor simulates me with a 1% error rate, are we logically linked? TDT relies on an intuitive notion of "similarity" that resists formalization. It hand-waves the **Reference Class Problem**.

  **UDT (Updateless Decision Theory - Wei Dai):**
  *   **Approach:** Maximizes expected utility over policies using a prior over "mathematical structures." It refuses to update on observations.
  *   **The Crux:** **Computational Tractability and Priors.** To evaluate a policy, UDT needs a prior over logical possibilities. But logical truths are not probabilistic in the standard sense (they are 0 or 1). UDT requires a theory of **Logical Uncertainty** (e.g., Logical Induction). Furthermore, UDT struggles with "Troll Bridge" scenarios: if an agent reasons that "If I cross the bridge, I might prove I'm irrational, therefore I shouldn't cross," it can get stuck in spurious proofs. UDT needs a way to distinguish between *causal* counterfactuals and *spurious logical* correlations.

  **FDT (Functional Decision Theory):**
  *   **Approach:** Attempts to synthesize TDT and UDT by focusing on "subjunctive dependence."
  *   **The Crux:** **Defining Dependence.** FDT claims an agent should act as if they control the output of all instantiations of their decision function. But without a rigorous metric for "instantiation," FDT is vulnerable to the **Newcomb's Soda** objection. (If I drink cola, does that mean a predictor who guessed my preference based on a common cause also guessed correctly? FDT risks one-boxing in cases where the correlation is merely physical/common-cause, not logical.)

  **The Technical Bottleneck:**
  The divergence tracks the difficulty of defining $P(Output(M') = y \mid do(Output(M) = x))$ where $M$ and $M'$ are distinct physical processes.
  *   If you treat this via **proofs** (Proof-based UDT), you run into Löb's Theorem and spurious counterfactuals.
  *   If you treat this via **probabilities** (Logical Induction), you struggle with convergence and defining the "same algorithm."
  *   If you treat this via **causal graphs** (TDT/FDT), you struggle with defining the nodes.

  ### 3. Prospects for Progress

  You asked what would count as progress. Given the diagnosis, empirical resolution is impossible; Newcomb problems are not physically reproducible in a way that settles the metaphysics. Progress must be formal or conceptual.

  **1. A Theory of Logical Counterfactuals (The Holy Grail)**
  Progress requires a formalism that allows an agent to reason about "what if this logical statement were false?" without exploding into inconsistency.
  *   **Current State:** Logical Induction (Garrabrant et al.) is the strongest candidate. It assigns probabilities to logical sentences before they are proven.
  *   **The Hurdle:** Integrating Logical Induction with decision theory without reintroducing the "Troll Bridge" problem (where an agent avoids actions because reasoning about them leads to proofs of bad outcomes).
  *   **Success Condition:** A decision algorithm that one-boxes on Newcomb, two-boxes on transparent Newcomb (where the box is visibly empty), and doesn't get paralyzed by self-referential proofs.

  **2. Mapping the Domain of Applicability**
  We may need to accept a **pluralistic ontology**.
  *   **Progress:** A rigorous theorem specifying the boundary conditions where CDT and UDT converge vs. diverge.
  *   **Hypothesis:** CDT is optimal when correlations are purely physical/common-cause. UDT is optimal when correlations are logical/computational.
  *   **The Barrier:** The "Transparent Newcomb" problem. If the box is transparent and you see it is empty, CDT says two-box (money is gone). UDT says one-box (if you were the type to one-box, the box would be full). But if you *see* it is empty, how can your decision change that?
  *   **Resolution:** This requires a theory of **counterfactuals on observations**. Can an agent reason "If I were the type to one-box, I would not be seeing an empty box"? This implies updating on the *logical implication* of the action on the observation, not just the observation itself.

  **3. Redefining the Agent**
  The deepest progress would come from dissolving the "agent" as a primitive.
  *   If we model agents as **subroutines within a larger computation** (the universe), the distinction between "causing the past" and "being correlated with the past" dissolves. The universe computes a function; the agent is a sub-function. The output of the sub-function constrains the output of the larger function.
  *   **Verdict:** This favors the Updateless view but requires accepting a block-universe or computationalist metaphysics that CDT proponents reject.

  ### Conclusion: Is Resolution Possible?

  I must be honest: **Do not expect a consensus that declares one side "Right."**

  The disagreement is **framework-relative**.
  *   If you define "cause" as physical energy transfer, CDT is correct, and Newcomb's Problem is a trick question involving a predictor that cannot exist.
  *   If you define "cause" to include logical constraint, Updateless is correct, and CDT is a heuristic that fails in high-fidelity simulation environments.

  **What you should teach your students:**
  The impasse is not a failure of intelligence but a reflection of the fact that **decision theory is currently underspecified for logically correlated environments.**
  1.  **Acknowledge the Ontology:** CDT assumes a universe where logical facts are inert background. Updateless assumes a universe where logical facts are causal levers.
  2.  **Highlight the Technical Debt:** The Updateless camp has the better normative argument (dynamic consistency), but the weaker formalism (no rigorous theory of logical counterfactuals). CDT has the robust formalism (Pearlian causality) but the weaker normative outcome (leaving money on the table).
  3.  **The Path Forward:** Progress lies not in arguing about boxes, but in **formalizing logical counterfactuals**. Until we have a mathematically rigorous way to compute $P(Y | do(X))$ where $X$ and $Y$ are logical statements, the debate will remain a clash of intuitions.

  Your students are stalled because they are trying to solve a metaphysical problem with normative tools. The "solution" is to recognize that the definition of "rationality" is contingent on the computational structure of the environment the agent inhabits. In a world of perfect predictors (logical correlation), Updateless is the only consistent theory. In a world of opaque physics (causal isolation), CDT suffices. The friction arises because we do not know which world we inhabit, nor do we have the math to describe the boundary.
