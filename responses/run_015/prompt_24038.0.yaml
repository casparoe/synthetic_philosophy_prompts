      *   *Updateless View (UDT/FDT/TDT):* The decision node is an instance of a logical/computational pattern. The "choice" is selecting the output of a function. Correlations via logical identity matter. Rationality = Optimal policy selection from a prior perspective (before specific observations).
      *   *The User's Hypothesis:* They are spot on. It *is* about the causal unit and the definition of rationality.
      *   *Diagnosis:* It's not merely verbal. It's a clash of *normative frameworks* grounded in different *metaphysical commitments* about agency. CDT treats the agent as a physical locus of intervention. Updateless treats the agent as a logical locus of control.
      *   *Is it distinct questions?* Yes. CDT asks "What should I do *now*?" Updateless asks "What rule should I have committed to *before*?" The conflict arises because Updateless claims the "now" question is ill-posed without the "before" context in logically correlated scenarios.

  3.  **Analyze the Updateless Internal Splits (UDT vs. TDT vs. FDT):**
