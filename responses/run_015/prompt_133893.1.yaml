answer: |-
  **The Scenario**

  Three systems in a memory clinic are tasked with retaining the belief *'The pill is at 2 PM'*. **System A** is neurotypical; specific neural activation sustains the belief autonomously over time. **System B** has hippocampal damage; identical neural activation is induced via deep-brain stimulation, but decays within seconds unless a clinician manually adjusts voltage every thirty seconds. **System C** is an android; silicon registers sustain the belief autonomously. During observation windows, all three answer questions identically and exhibit identical counterfactual behaviors (e.g., reaching for the pill at 2 PM). The clinician's adjustments are sub-personal; B perceives no input, and the behavioral output remains perfectly matched across all nearby counterfactuals regarding the pill. The only variance is the internal dependency on external maintenance to sustain the physical vehicle.

  **The Verdicts**

  (i) **Plain Role Functionalism:** Restrictive. Mental states are defined by causal roles within the system boundaries. A and C satisfy the role: the state persists and guides action via internal causal powers. B fails. Although B matches the input-output profile momentarily, the state lacks the counterfactual stability to cause future behavior without external intervention. The causal chain required by the functional definition is broken outside the system boundary. Functionalism excludes B because the *role* is not fully realized internally.

  (ii) **Realizer-Focused/Type Identity:** Liberal. Mental states are identical to physical vehicle types. A and B share the same neural activation pattern (the realizer). The method of maintenance (natural homeostasis vs. external stimulation) is irrelevant to the identity of the state itself. Both are in the same neural state, hence the same mental state. C is excluded (different stuff). Here, Identity Theory is the permissive view, grouping the humans despite the functional fragility of B.

  (iii) **Refined Condition (Endogenous Stability):** A state counts only if the system's internal dynamics sustain the causal role across nearby counterfactual temporal slices without external re-tuning. This validates the functionalist verdict: A and C pass; B fails. It isolates *causal autonomy* as the functional requirement, distinguishing robust realizers from fragile props.

  **The Toggle**

  The feature is **Endogenous Stability**. Flip it: Suppose B's stimulation device is automated and internalized (a closed-loop implant). B now sustains the state without clinician intervention. Functionalism now includes B (same role as A). Identity Theory still includes B (same neural realizer). The case collapses into standard Multiple Realizability (A, B, and C all count). The restrictive verdict disappears because the functional defect was repaired. This confirms the restriction wasn't about substrate, but about causal structure. If you remove the stability requirement, Functionalism becomes liberal again, but loses the ability to distinguish B from a lookup table.

  **Best Functionalist Reply**

  The strongest reply rejects the system boundary. Functionalism shouldn't stipulate "skin-skull" boundaries a priori. If the clinician is causally necessary for the role, the clinician is part of the functional system. On this "Extended Functionalist" view, B+Clinician satisfies the role. Thus, Functionalism is *not* restrictive; it just expands the system. This saves the liberal verdict but concedes that individualism was the error, not functionalism. It forces students to debate where the "mind" stops. If they accept the extension, Functionalism regains its liberal status, but only by swallowing the environment. This is the cost of maintaining the role definition over the realizer.

  **Lookup Table Relation**

  This is not merely Block's lookup table rewritten. Block's argument targets combinatorial state exhaustion (no internal structure). This case targets *temporal fragility* despite structural similarity. B has the right internal structure *now*, but lacks the dynamic persistence. It challenges whether a "state" is a snapshot or a trajectory. It's distinct: Block says "no structure"; this says "unstable structure." It avoids the brute tabulation worry by focusing on maintenance dynamics rather than state-space size. The problem isn't that B is too big; it's that B is too dependent. This isolates the *shape* of tolerance: functionalism tolerates substrate variance, but not causal fragility.
