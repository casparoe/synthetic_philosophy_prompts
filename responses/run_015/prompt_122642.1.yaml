      *   *Refining the Hofstadter Interpretation:* I need to be careful not to put words in Hofstadter's mouth, but GEB is clear on "Meaning is not intrinsic." The "Message, Frame, and Outer Message" section (Chapter VI, "The Location of Meaning") is the key reference. Hofstadter uses the example of a record sent to aliens. He argues meaning is *potential* until activated by a receiver with similar structure. The notes claim Hofstadter says meaning is *in* the inner message. Actually, Hofstadter says the inner message *contains* the meaning *for a receiver who can decode it*. The notes miss the "receiver" part of the equation in their conclusion.
