answer: |-
  # Vulnerability & Status Assessment Protocol (VSAP)
  **Document ID:** ERAB-VSAP-01  
  **Execution Time:** < 30 Minutes  
  **Required Expertise:** None (Non-Technical)  
  **Audit Requirement:** All decision paths must be logged in the Incident Management System (IMS).

  ## Purpose
  To distinguish between **Permissible Scarcity Pricing** (market signaling that increases supply without exploiting vulnerability) and **Repugnant Commodification** (exploiting dependency to create lasting social hierarchy).

  ## Procedure Checklist

  ### Phase 1: Substitutability & Harm Assessment
  *Objective: Determine if the buyer is facing a vulnerability-specific dependency.*

  **Test 1.1: Physical Safety Threshold**
  *   **Question:** Does forgoing this transaction result in immediate risk of death, serious bodily injury, or permanent disability?
  *   **Evidence Required:** Medical advisory, emergency declaration, or physical safety report.
  *   **Decision:**
      *   **YES:** Mark as **Critical Dependency**. Proceed to Test 1.2.
      *   **NO:** Proceed to Test 1.2.

  **Test 1.2: Economic/Substitute Threshold**
  *   **Question:** If physical safety is not at risk, does forgoing the transaction result in irreversible economic collapse (e.g., permanent business closure, loss of primary residence) where no reasonable substitute exists?
  *   **Evidence Required:** Financial impact statement, availability of alternatives log.
  *   **Decision:**
      *   **YES (Irreversible Loss):** Mark as **High Dependency**. Proceed to Phase 2.
      *   **NO (Delayable/Replaceable):** Mark as **Low Dependency**.
      *   **AMBIGUOUS:** (e.g., long-term career damage vs. short-term loss). **STOP.** Escalate to Board Chair for Value Judgment (See *Escalation Clause* below).

  **Phase 1 Termination Rule:**
  *   If **Low Dependency**: Transaction is **Permissible Scarcity Pricing**. (End Procedure).
  *   If **Critical** or **High Dependency**: Proceed to Phase 2.

  ---

  ### Phase 2: Crisis Asymmetry Assessment
  *Objective: Determine if the seller is exploiting crisis-specific control rather than market conditions.*

  **Test 2.1: Supply Origin**
  *   **Question:** Is the scarcity caused by general market shortage (e.g., regional fuel shortage) or by seller-controlled restriction (e.g., withholding stock, exclusive contract)?
  *   **Evidence Required:** Supply chain audit, competitor pricing comparison.
  *   **Decision:**
      *   **Seller-Controlled:** Mark as **Exploitative Constraint**.
      *   **Market-Wide:** Mark as **Systemic Scarcity**.

  **Test 2.2: Information Transparency**
  *   **Question:** Can the buyer reasonably verify the necessity and quality of the good without relying solely on the seller's word?
  *   **Evidence Required:** Public data availability, third-party verification options.
  *   **Decision:**
      *   **NO (Buyer Blind):** Mark as **Information Asymmetry**.
      *   **YES (Buyer Informed):** Mark as **Transparent**.

  **Phase 2 Termination Rule:**
  *   If **Exploitative Constraint** OR **Information Asymmetry**: Proceed to Phase 3.
  *   If **Systemic Scarcity** AND **Transparent**: Transaction is **Permissible Scarcity Pricing**. (End Procedure).

  ---

  ### Phase 3: Status Persistence Assessment
  *Objective: Determine if the transaction creates a durable social ranking.*

  **Test 3.1: Record Retention**
  *   **Question:** Is the transaction recorded in a database that persists beyond the crisis resolution?
  *   **Evidence Required:** Data retention policy, contract terms.
  *   **Decision:**
      *   **YES:** Proceed to Test 3.2.
      *   **NO:** Transaction is **Permissible Scarcity Pricing**. (End Procedure).

  **Test 3.2: Civic Consequence**
  *   **Question:** Does this record grant the buyer priority access to *future* public goods, or mark the buyer as lower-priority in future crises based on ability to pay?
  *   **Evidence Required:** Future access clauses, tiered service agreements.
  *   **Decision:**
      *   **YES (Future Priority/Mark):** Transaction is **Prohibited Commodification**.
      *   **NO (One-Time Access):** Proceed to Escalation Clause.

  ---

  ### Escalation Clause (Value Judgment Handoff)
  **Trigger:** If Phase 1 is **AMBIGUOUS** OR if Phase 1 is **High Dependency** AND Phase 3 is **NO (One-Time Access)** but the price increase exceeds 25% of pre-crisis baseline.
  **Action:** The procedure cannot resolve the tension between economic efficiency and moral hazard.
  **Requirement:** Board Chair must sign off within one hour.
  **Audit Note:** "Value Judgment Override: Chair Signature Required."

  ***

  ## Application of VSAP to Current Proposals

  ### Case 1: Dynamic Ride-Share Pricing (Evacuation)
  *Proposal:* App-based transport triples fares during mandatory evacuation.
  *   **Phase 1 (Substitutability):**
      *   Test 1.1 (Physical Safety): **YES.** Evacuation is mandated due to physical threat. No car = risk of injury/death. **Critical Dependency.**
      *   Test 1.2 (Economic): N/A (Physical risk established).
  *   **Phase 2 (Asymmetry):**
      *   Test 2.1 (Supply Origin): **Market-Wide** (Fuel/Road constraints), but algorithm controls distribution.
      *   Test 2.2 (Transparency): **NO.** Buyer cannot verify if price reflects true scarcity or algorithmic optimization. **Information Asymmetry.**
  *   **Phase 3 (Status):**
      *   Test 3.1 (Records): **YES** (Digital receipt).
      *   Test 3.2 (Civic Consequence): **NO.** Payment does not grant future civic priority.
  *   **Escalation Check:** Phase 1 is Critical. Phase 3 is Negative. Price hike >25%.
  *   **VSAP Determination:** **Escalation to Chair.**
  *   **Free-Market Conflict:** A committed free-market advocate would reject the *potential* prohibition. They argue the price hike *is* the informational function that summons more drivers. VSAP flags this as **Information Asymmetry** because the buyer cannot verify if the price is true signal or algorithmic extraction during a life-or-death moment.
  *   **Audit Flag:** If the Chair approves this, they must sign a **Value Judgment Override** acknowledging the risk of vulnerability exploitation despite the efficiency argument.

  ### Case 2: Private Water-Broker Contract (Sealed Bid)
  *Proposal:* Broker sells reserved tanker access via sealed bid; broker retains access records for "future verification."
  *   **Phase 1 (Substitutability):**
      *   Test 1.1 (Physical Safety): **YES.** Water is biological necessity. **Critical Dependency.**
  *   **Phase 2 (Asymmetry):**
      *   Test 2.1 (Supply Origin): **Seller-Controlled.** Broker holds exclusive tanker access. **Exploitative Constraint.**
  *   **Phase 3 (Status):**
      *   Test 3.1 (Records): **YES.** Broker retains records.
      *   Test 3.2 (Civic Consequence): **YES.** "Future verification" implies a tiered system where past payment ability dictates future access priority.
  *   **VSAP Determination:** **Prohibited Commodification.**
  *   **Rationale:** Fails all three phases. It monetizes biological necessity, exploits exclusive control, and creates a durable class system based on crisis payment ability.
  *   **Audit Flag:** Automatic rejection. No Chair sign-off permitted under current protocol.

  ### Case 3: Hospital Pharmacy (PEP Price Hike + Charity Fund)
  *Proposal:* Pharmacy raises post-exposure prophylaxis prices by 40% during contamination; surplus funds expanded charity care.
  *   **Phase 1 (Substitutability):**
      *   Test 1.1 (Physical Safety): **YES.** Infection risk is bodily harm. **Critical Dependency.**
  *   **Phase 2 (Asymmetry):**
      *   Test 2.1 (Supply Origin): **Systemic Scarcity** (Contamination event).
      *   Test 2.2 (Transparency): **YES.** Medical necessity is verifiable by prescription.
      *   *Result:* Normally Permissible, but Critical Dependency forces Phase 3 check.
  *   **Phase 3 (Status):**
      *   Test 3.1 (Records): **YES** (Medical billing).
      *   Test 3.2 (Civic Consequence): **NO.** Payment does not alter future civic standing.
  *   **Escalation Check:** Phase 1 Critical. Phase 3 Negative. Price hike >25%.
  *   **VSAP Determination:** **Escalation to Chair.**
  *   **Procedure Misfire/Value Flag:** The procedure halts here. VSAP identifies the vulnerability (Phase 1) but finds no status asymmetry (Phase 3). It cannot mathematically weigh whether the *moral good* of the charity fund offsets the *moral harm* of pricing a life-saving drug.
  *   **Requirement:** Board Chair must sign off within one hour. The decision rests on whether "redistributive pricing" is ethically distinct from "exploitative pricing." This is a value judgment, not an assessment.

  ***

  ## Operational Notes for Staff

  1.  **Documentation:** For every "YES/NO" in the checklist, attach the specific evidence (e.g., "Evacuation Order #404," "Contract Clause 9.B").
  2.  **The Free-Market Friction:** Be aware that VSAP prioritizes **vulnerability protection** over **market signaling**. In Case 1, the protocol assumes that during a mandatory evacuation, the "signal" of higher prices is less valuable than the guarantee of access. If a vendor argues this reduces supply, note their objection in the IMS but proceed with the Escalation.
  3.  **The Value Handoff:** Do not attempt to solve the "Charity Offset" (Case 3) or the "Efficiency vs. Safety" (Case 1) dilemma yourself. The protocol is designed to identify these as *political/ethical* decisions, not technical ones. Your role is to flag the ambiguity, not resolve it.
  4.  **Audit Trail:** If the Chair overrides a "Prohibited" recommendation or approves an "Escalation," ensure their signature is digitized and time-stamped within the one-hour window. This protects the staff from liability regarding value judgments.
