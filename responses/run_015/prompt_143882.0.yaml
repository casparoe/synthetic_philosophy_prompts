answer: |-
  **Question 1 (Conceptual Structure: Precedence)**
  Your position relies on the claim that distinct normative frames can converge on a single action pathway to generate conflicting obligations. However, agents must still act; they cannot remain in a state of suspension. If obligations are indexed to frames, by what non-arbitrary criterion is one frame granted precedence in a given situation without collapsing your view into a hidden form of consequentialist weighing? If you appeal to a higher-order rule to select the frame, do you not risk reintroducing the very resolutionist architecture you aim to avoid?

  **Follow-up 1 (Conceptual Structure: Authority Conditions)**
  *I anticipate your reply will be that precedence is determined not by aggregative comparison but by the internal authority conditions of the frame itself.* But if the authority conditions of the "filial" frame and the "institutional" frame both claim supremacy in this specific context, on what basis do we adjudicate between those competing claims of authority? Are those authority conditions not themselves contested across frames, and if so, does invoking them simply push the conflict back a step without resolving the incommensurability?

  ***

  **Question 2 (Conceptual Structure: Frame Individuation)**
  Moving to the ontology of the frames themselves: you treat frames as sufficiently discrete to generate genuine conflict, yet porous enough to converge on a single action. How do you individuate these frames without relying on the agent's subjective perception? If the boundaries of a frame are determined by social practice, does this not make the existence of a moral dilemma contingent on sociological facts rather than normative ones, potentially dissolving the dilemma in cultures where such frames are more integrated?

  **Follow-up 2 (Conceptual Structure: Regress)**
  *If you argue that frames are objective social structures,* does this not invite a regress problem? If the conflict arises from the intersection of two objective social structures, is there not a "social" frame that encompasses both, which would then dictate the resolution? How do you block the move that a sufficiently capacious description of the social context always dissolves the conflict into a single, complex obligation?

  ***

  **Question 3 (Phenomenology: Residue vs. Regret)**
  I would like to turn to the phenomenological distinction you draw between moral residue and Bernard Williams's notion of agent-regret. You claim that agent-regret is excessively psychological, whereas moral residue is an objective feature of the normative situation that persists even when the agent is fully justified and feels no emotional turmoil. If the agent feels no turmoil, what evidentiary access do we have to this residue? How can we confirm its existence if it is decoupled from the agent's first-person experience?

  **Follow-up 3 (Phenomenology: Reparative vs. Remedial)**
  *I expect you will defend the view that we can detect residue through the appropriateness of reparative obligations rather than affective states.* My follow-up is this: how do you distinguish such reparative obligations from ordinary remedial duties that arise after any harmful but permissible action, such as compensating a pedestrian you accidentally bump into while acting justifiably? Without relying on an intuitionist reading of moral remainder, what normative marker signals that a duty is "reparative" of a moral wrong rather than "remedial" of mere bad luck?

  ***

  **Question 4 (Meta-Conflict: Second-Order Obligations)**
  Let us consider second-order or meta-level conflicts. What occurs when the frames themselves generate obligations about how first-order conflicts ought to be resolved — for instance, when a professional code demands transparency about internal disagreement, while a familial frame demands discretion regarding family matters? Does your framework accommodate obligations that govern the selection of frames, or are frames opaque to one another at that level?

  **Follow-up 4 (Meta-Conflict: Stratification)**
  *You are likely to respond that second-order obligations operate at a different logical level and thus do not generate the same type of conflict.* But if the second-order obligations also conflict, does that stratification not simply relocate the dilemma rather than dissolve it? If we require a third-order frame to resolve the second-order conflict, do we not face a vicious regress, or must we admit that at some level, the agent is left without normative guidance?

  ***

  **Question 5 (Applied Scenario: The Archivist)**
  Finally, I want to test this against a concrete scenario. Imagine a senior archivist at a government institution who discovers documentary evidence of historical abuses committed by a still-living former official who is also her parent. Her institutional role demands public disclosure according to archival ethics, while her filial frame generates obligations of loyalty and protection. How does your framework explain the qualitative difference in residue when the agent chooses disclosure versus silence? specifically, is the residue experienced in the disclosure case genuinely moral, or is it merely relational?

  **Follow-up 5 (Applied Scenario: Moral vs. Relational)**
  *If you maintain that the residue is genuinely moral even when the agent acts on the institutional frame,* does this not imply that the filial obligation retains normative force even when it is overridden? If so, does this not undermine the authority of the institutional frame by suggesting the agent is simultaneously acting rightly (institutionally) and wrongly (filially) in the exact same action-execution? How do you prevent this from becoming a contradiction in terms of practical rationality?
