answer: |-
  This is a classic Rorty situation: you, your friend, and the pop-philosophy book are all talking past each other because Rorty spent his career trying to dissolve the very distinctions you're using to argue about him. The paperback you grabbed sounds like a standard "Analytic Philosophy 101" summary, which tends to treat Rorty as a villain who broke the rules of the game, rather than someone trying to show the game was rigged.

  Here is the breakdown of the summary, followed by an analysis of your friend's two objections and the "no theory" claim.

  ### Part 1: Grading the Summary Paragraph

  If you showed this paragraph to a serious Rortyan scholar, here is how they would mark it up:

  **1. "Truth isn't a matter of our sentences matching up with how things really are."**
  *   **Verdict:** **Accept.**
  *   **Why:** This is the core of *Philosophy and the Mirror of Nature*. Rorty is an anti-representationalist. He denies the correspondence theory of truth.

  **2. "'Truth' is just a compliment we pay to claims that are useful to us, or that nobody around us can think of an objection to."**
  *   **Verdict:** **Slippage/Caricature.**
  *   **Why:** Rorty moved away from the Jamesian "useful" (cash value) definition early on because it invites the exact eclipse objection your friend made. He prefers the Davidsonian line: truth is what you can defend against all comers in a free and open encounter. "Useful" implies instrumental success; Rorty is more interested in *social justification*.

  **3. "Really it's about what your conversation partners will let you get away with."**
  *   **Verdict:** **Caricature.**
  *   **Why:** This makes it sound cynical, like truth is just political power or bullying. Rorty talks about *solidarity*, not "getting away with it." For Rorty, justification is normative within a community, not just a matter of force.

  **4. "Reality doesn't constrain what we say, only our habits of talk do."**
  *   **Verdict:** **Wrong.**
  *   **Why:** This is the biggest error in the summary. Rorty explicitly admits the world *causes* us to have beliefs. If I kick a stone, my foot hurts, and I believe "there is a stone." The world constrained that belief causally. Rorty's point is that the world cannot *justify* the belief. Only other beliefs (habits of talk) can justify a belief. The summary conflates causal constraint with justificatory constraint.

  **5. "No such thing as being wrong about how things are, only being out of step with the people around you."**
  *   **Verdict:** **Caricature.**
  *   **Why:** Again, this reduces epistemology to social conformity. Rorty would say you are "wrong" if your beliefs fail to help you cope with the world or if they cannot be justified to your peers. But he denies there is a "way things are" independent of description to be wrong *about*.

  **6. "Neopragmatism is mostly treated as a dead end these days."**
  *   **Verdict:** **Non-Sequitur.**
  *   **Why:** This is a sociological claim about the profession, not a philosophical conclusion derived from the previous sentences. Even if the critics are right, it doesn't mean the position is logically incoherent, just unpopular.

  ---

  ### Part 2: The Eclipse Objection (False Theory, True Prediction)

  **The Scenario:** A civilization predicts eclipses perfectly for 400 years using a theory that is (metaphysically) false.
  **The Friend's Charge:** Rorty must call this "true" because it survived objection. Therefore, Rorty's definition of truth is broken.

  **Is it fair?**
  It is a standard objection (often associated with Hilary Putnam), but it relies on begging the question against Rorty. The objection assumes there *is* a fact of the matter ("the theory is, as it happens, completely false") independent of the community's ability to verify it. Rorty denies the coherence of that assumption.

  **Does Rorty have to bite the bullet?**
  **Yes.** Rorty bites this bullet happily.
  For Rorty, truth is not eternal; it is temporal. Newtonian physics was "true" for 200 years until Einstein provided a vocabulary that handled anomalies Newton couldn't. If the Eclipse Civilization has no vocabulary that predicts eclipses *better* than their current one, and no internal objections have arisen, then **for them, it is true.**

  **What's left for him to object to?**
  The friend asks: "If that's not a position about truth, what is?"
  Rorty's response: "It is a position about *assertibility*."
  Rorty wants to replace the concept of "Truth" (with a capital T, corresponding to Reality) with "Justified Assertibility."
  *   **The Realist:** "The theory is false because it doesn't match the gears of the universe."
  *   **Rorty:** "The 'gears of the universe' is a metaphor you invented. If the theory predicts the eclipse, copes with the sky, and no one can refute it, calling it 'false' adds nothing to the description except a nod to God."

  **The Weakness:** The weakness here isn't logical, it's intuitive. Most people feel that if the theory posits "giant dragons eating the sun" but the math works, the theory is *wrong* about the dragons even if the math is right. Rorty would say: "The math is the tool. The dragons are just poetic decoration. If the decoration doesn't hinder the tool, why ban it?"
  Your friend is right that this makes "truth" lose its normative bite regarding *reality*, but Rorty argues that "reality" never had a bite to begin with.

  ---

  ### Part 3: Causation vs. Justification

  **The Friend's Charge:** The whole system rides on separating "the world causes belief" from "the world justifies belief." If antirepresentationalism eats this distinction, the critics win.

  **Is this the load-bearing move?**
  **Yes. Absolutely.** This is the engine of *Philosophy and the Mirror of Nature*.
  Rorty needs the world to be hard enough to push us around (so we aren't solipsists) but soft enough that it can't speak (so it can't validate our sentences).
  *   **Causation:** A physical relation (Stone hits foot -> Pain).
  *   **Justification:** A linguistic/social relation (Claim A supports Claim B).

  **Does it survive his own premises?**
  This is where the critics (like John McDowell or critical realists) squeeze him the hardest.
  The argument against Rorty is: *How do you know the world caused the belief unless the belief represents the cause?*
  If I believe "There is a cliff," and I stop walking, the world caused me to stop. But isn't the *cliff-ness* of the world justifying my belief that "There is a cliff"?
  Rorty says: No. The cliff caused the belief. Your *community* justifies the belief by agreeing that "cliff" is the right word for that obstacle.

  **The Verdict:**
  The distinction is pragmatically useful but metaphysically fragile.
  *   **If you accept it:** Rorty's system holds. You can be a materialist about causation and a pragmatist about truth.
  *   **If you reject it:** If you think causal interaction implies some form of representational content (i.e., the mind must "mirror" the cause to be caused by it), then Rorty collapses back into the realism he hates.
  Your friend is correct that this is the hinge. If Rorty cannot keep the physical shove separate from the logical reason, the "Mirror" comes back. Rorty insists we *can* keep them separate because language is a tool, not a picture.

  ---

  ### Part 4: The "No Theory of Truth" Claim

  **The Claim:** Rorty insists he isn't offering a theory of truth, just a recommendation to stop using the word.
  **Your Question:** Isn't "stop asking whether your beliefs correspond to reality" itself a claim about truth?

  **The Analysis:**
  This is the "Performative Contradiction" objection.
  *   **Critic:** "You claim there is no Truth. Is *that* claim True?"
  *   **Rorty:** "No, it's not 'True' in the correspondence sense. It's a *proposal*."

  Rorty views philosophy as **cultural conversation**, not a tribunal of reason. He isn't trying to state a fact about the universe; he is trying to change the subject. He compares himself to someone suggesting we stop using the concept of "witchcraft."
  *   Saying "Witches don't exist" is a truth claim.
  *   Saying "Let's stop using the word 'witch' because it doesn't help us cope with illness" is a pragmatic recommendation.

  **Is it a claim about truth?**
  Technically, yes. To say "Correspondence is useless" is to say "It is *true* that correspondence is useless."
  Rorty admits this but treats it as an **ironic** truth. He knows he is using the tools of philosophy to dismantle philosophy. He calls this "ironism." He knows his own arguments are contingent on his historical moment and vocabulary.

  **Does it work?**
  It works if you accept his therapeutic goal. If you think philosophy's job is to find The Truth, Rorty is self-refuting. If you think philosophy's job is to help us cope and reduce cruelty (his metric), then his recommendation stands on its utility, not its "truth."

  ### Summary: Who Won the Bar Fight?

  **The Book:** **Lost.** It caricatured Rorty as a crude relativist ("truth is whatever you get away with") rather than a deflationist ("truth is just a compliment paid to justified beliefs"). It also got the causation/justification distinction wrong.

  **Your Friend:** **Won on technicals, maybe lost on spirit.**
  *   **Point 1 (Eclipse):** Fair objection, but Rorty has a consistent (if unpalatable) answer. Your friend assumes "false" means something Rorty explicitly rejects.
  *   **Point 2 (Causation/Justification):** This is the killer move. If your friend can show that causation *implies* representation, Rorty is in trouble. This is the strongest philosophical critique available.

  **You:** **In the middle.**
  You were right to suspect the book. It treated Rorty as someone making a *better* theory of truth, when Rorty was trying to argue we should stop looking for a theory of truth entirely.

  **The Final Word:**
  Rorty isn't a relativist in the sense that "anything goes." He believes in rigorous justification within a community. He is a relativist only in the sense that he thinks no community (not even Science) has a pipeline to God's eye view.
  Your friend is right that this makes "truth" feel thin. Rorty would reply: "Good. It was always thin. Now let's talk about how to reduce suffering instead of arguing about mirrors."

  If you want to settle it, tell your friend: "Rorty admits the Eclipse theory is 'true' for that civilization until they find a better tool. He doesn't care about your 'actually false' because he thinks 'actually' is a weasel word. But you're right that his whole house of cards falls if causation requires representation. That's the only move that matters."
