answer: |-
  This is a classic debate that touches on the epistemic foundations of game theory. Both friends have grasped the mechanics correctly, but they are drawing different philosophical conclusions from them.

  Here is the referee's ruling on their exchange, broken down by specific claim, followed by the crucial context they are both missing.

  ### Round 1: Strict Dominance and Order Independence
  **Friend 1 Claim:** *Eliminating strictly dominated strategies gives the same surviving set no matter the order.*
  **Friend 2 Claim:** *Agrees on that part.*

  **Verdict:** **Both are Right.**
  This is a fundamental theorem in game theory. Iterated Elimination of Strictly Dominated Strategies (IESDS) is **order-independent**.
  *   **Why:** A strictly dominated strategy is never a best response to *any* belief about what the opponent might do. Because it can never be optimal, removing it does not change the optimality calculations for the remaining strategies. You can remove them all at once or one by one; the set of rationalizable strategies that survive will be identical.
  *   **The Point:** Friend 1 is correct that this makes IESDS a "safe," robust solution concept. Friend 2 is correct to concede this.

  ### Round 2: Weak Dominance and Order Dependence
  **Friend 2 Claim:** *With weak dominance, the order you eliminate in can change which strategies survive.*
  **Friend 1 Claim:** *That's just a practical wrinkle, pick a sensible order and move on.*

  **Verdict:** **Friend 2 is Right; Friend 1 is Hand-Waving.**
  Iterated Elimination of Weakly Dominated Strategies (IEWDS) is **order-dependent**.
  *   **Why:** A weakly dominated strategy *can* be a best response (specifically, if the opponent plays the strategy that makes you indifferent). If you eliminate a weakly dominated strategy early, you might remove the very condition that made another strategy viable for the opponent.
  *   **Example:** In a 3x3 game, Strategy A might be weakly dominated by Strategy B. But Strategy B might only be dominant if Strategy C is in the game. If you eliminate C first (because it was weakly dominated by something else), A might no longer be dominated.
  *   **The Point:** Friend 1 calls this a "practical wrinkle." It is not. It is a fundamental instability. Telling someone to "pick a sensible order" is theoretically empty unless you define what "sensible" means mathematically. Without a rule for the order, the prediction is indeterminate.

  ### Round 3: "Games That Actually Matter"
  **Friend 1 Claim:** *Weak dominance is the concept you actually want most of the time.*
  **Friend 2 Claim:** *In games that actually matter, eliminations are usually weak dominance.*

  **Verdict:** **Both are Overgeneralizing.**
  *   **Friend 1:** Weak dominance is powerful, but it is not always what you "want." Because it is order-dependent, it can eliminate Nash Equilibria that are perfectly reasonable. Relying on it blindly can lead you to discard valid outcomes.
  *   **Friend 2:** The claim that "games that actually matter" usually rely on weak dominance is an empirical overstatement. Many standard economic models (like Cournot competition or differentiated Bertrand) rely on strict dominance or simply Nash Equilibrium without elimination. However, Friend 2 is right that in voting theory, auctions, and signaling games, weak dominance is frequently the tool required to get a unique prediction.
  *   **The Point:** Neither strict nor weak dominance is universally "the one." Strict is robust but often leaves too many strategies standing. Weak is powerful but fragile.

  ### Round 4: The "Rigged" Accusation
  **Friend 2 Claim:** *If the answer depends on an arbitrary choice like order, it's not a solution concept at all, just whatever you happen to get. The whole exercise is rigged.*

  **Verdict:** **Friend 2 is Wrong.**
  *   **Why:** Order dependence does not mean the exercise is "rigged" or useless; it means the solution concept is **incomplete**. It signals that rationality alone is not enough to solve the game; you need an additional assumption.
  *   **The Point:** Dismissing IEWDS entirely throws the baby out with the bathwater. It is a valid tool, but it cannot stand alone as a standalone prediction without further refinement. Calling it "rigged" implies malpractice, when it is actually a feature of the mathematical structure indicating that more information is needed.

  ---

  ### What Both Friends Are Missing

  If you want to win this argument, you need to introduce the concept that resolves the tension between them. They are arguing about *procedure* (order of elimination), but the real issue is *justification* (why are we eliminating these strategies?).

  **1. The Trembling Hand Perfection**
  The standard justification for eliminating weakly dominated strategies is not just "rationality," but **Trembling Hand Perfection** (introduced by Reinhard Selten).
  *   The logic is: "I will eliminate your weakly dominated strategy because I assume there is a tiny, non-zero probability that I might make a mistake ('tremble') and play any strategy."
  *   If there is even a 0.0001% chance I tremble, a weakly dominated strategy is no longer a best response; it becomes *strictly* dominated.
  *   **The Resolution:** If you assume trembles, weak dominance elimination becomes order-independent (because the trembles make the dominance strict). Friend 1 wants the result of weak dominance; Friend 2 wants the robustness of strict dominance. Trembling Hand gives you both, provided you accept the "tremble" assumption.

  **2. Epistemic Foundations**
  *   **IESDS (Strict):** Relies on "Common Knowledge of Rationality." If we both know we are rational, and we know we know, etc., we converge on the IESDS set.
  *   **IEWDS (Weak):** Requires a stronger assumption. It usually requires Common Knowledge of Rationality *plus* a specific belief structure (like the trembles mentioned above).
  *   **The Missing Insight:** Friend 2 is right that order dependence is a problem, but wrong that it invalidates the concept. The order dependence disappears if you specify the *epistemic conditions* (the beliefs about trembles) that justify the elimination.

  ### The Final Ruling

  **Friend 1** is right that Strict Dominance is robust, but wrong to treat Weak Dominance order-dependence as a minor wrinkle. You cannot just "pick an order"; that is theoretically unsound.

  **Friend 2** is right that Weak Dominance is order-dependent and that this creates ambiguity, but wrong to claim this makes the concept "rigged" or useless. It simply means the concept requires a refinement (like Trembling Hand) to be well-defined.

  **The Compromise:**
  Tell them to stop arguing about "order" and start arguing about **refinements**.
  *   If they want a prediction that holds up under *any* belief system, they must stick to **Strict Dominance** (Friend 1's safety).
  *   If they want a unique prediction in a game where strict dominance fails, they must use **Weak Dominance**, but they must explicitly justify it using **Trembling Hand Perfection** or **Proper Equilibrium**.

  **Winner:** **Friend 2** wins on the technical facts (order matters for weak dominance), but **Friend 1** wins on the utility (we often *need* weak dominance to solve games). The true winner is the person who mentions **Selten's Trembling Hand**, because that is the mathematical bridge that fixes Friend 2's problem while delivering Friend 1's result.
