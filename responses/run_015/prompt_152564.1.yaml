answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** Ethics Committee Chair
  **DATE:** October 23, 2023
  **SUBJECT:** Draft Opinion regarding the Craving-Null Protocol (CNP)

  **1. PURPOSE**

  This memo serves as the draft opinion for the Ethics Committee vote scheduled for Thursday, October 26. It addresses the proposal by the Palliative Care Team to implement the Craving-Null Protocol (CNP) for terminal patients. The purpose is to determine whether CNP aligns with our institutional charter and ethical obligations, specifically regarding the definition of patient well-being at the end of life.

  **2. BACKGROUND AND PHILOSOPHICAL FRAMEWORK**

  The CNP proposes a shift from standard palliative sedation to a regimen of continuous deep sedation combined with metabolic suppression. The stated goal is not merely pain management, but the elimination of craving itself. Proponents argue from a **tranquilist ethical framework**, positing that well-being is maximized not by positive experiences, but by the minimization of suffering and desire. Under this view, the optimal state for a dying patient is "pure negative well-being"—a state of zero craving, zero pain, and zero awareness of either.

  A key component of the proposal is the concept of **affective baseline drift**. The Palliative Team argues that even moments of pleasure or connection carry ethical risk because they may generate new attachments or cravings that cannot be satisfied before death, thereby increasing net suffering. Consequently, CNP treats positive engagement not as a benefit, but as a potential harm vector.

  Opponents argue that CNP reduces the patient to a biological entity devoid of personhood. They cite Section 4.2 of our Hospital Charter, which mandates care conducive to "human flourishing." They contend that flourishing requires some capacity for relation, awareness, or positive experience, however diminished, and that CNP constitutes engineered unconsciousness rather than care.

  **3. ETHICAL ANALYSIS**

  **The Validity of the Tranquilist Claim**
  We must not dismiss the tranquilist argument as merely nihilistic. For certain terminal patients, particularly those with refractory existential suffering or severe psychological distress, the capacity for positive experience may be irrevocably lost, leaving only the capacity for craving and frustration. In these specific cases, the tranquilist logic holds: if a patient cannot flourish, the ethical imperative shifts to ensuring they do not suffer. To deny CNP outright is to impose an objective theory of "flourishing" onto a patient who may rationally prefer non-experience over strained existence. Autonomy demands we respect a patient's assessment of their own well-being, even if that assessment prioritizes the absence of the negative over the presence of the positive.

  **The Charter and the Risk of Institutional Drift**
  However, approving CNP outright presents a significant institutional risk. Our Charter's commitment to "flourishing" is not merely decorative; it defines the hospital's moral identity. If we normalize the elimination of craving as the *primary* goal of end-of-life care, we risk shifting the default from "care until death" to "suppression until death." The argument regarding affective baseline drift is theoretically coherent but clinically dangerous if applied broadly. It suggests that family connection, spiritual closure, and conscious farewell are ethically suspect because they risk generating desire. Accepting this premise undermines the communal and relational aspects of healing that our institution is built upon.

  Furthermore, "pure negative well-being" is indistinguishable from coma. While a patient may autonomously choose this state, the hospital cannot ethically endorse a protocol that systematically eliminates the possibility of flourishing without rigorous safeguards to ensure this choice is truly voluntary and informed.

  **4. RECOMMENDATION**

  The Committee should **approve the Craving-Null Protocol strictly as a time-limited pilot program**, subject to stringent conditions. We cannot reject CNP outright without violating patient autonomy for those who genuinely subscribe to the tranquilist view of their own death. However, we cannot approve it broadly without violating our Charter's commitment to flourishing.

  **Course of Action:**

  1.  **Pilot Status:** CNP is approved for a **six-month pilot period**, limited to a maximum of five patients.
  2.  **Eligibility Criteria:** Patients must be certified terminal (prognosis < 30 days) and must demonstrate decision-making capacity at the time of consent. CNP is ineligible for patients with compromised capacity unless explicitly documented in a prior advance directive that specifically references "craving suppression" or "tranquilist end-of-care."
  3.  **Informed Consent Protocol:** Consent discussions must explicitly address the philosophical trade-off. Patients and proxies must acknowledge that CNP precludes conscious interaction, farewell, and positive experience to achieve the state of zero craving. The concept of "affective baseline drift" must be explained not as medical fact, but as the ethical rationale for the protocol.
  4.  **Review Board:** A sub-committee comprising one ethicist, one palliative specialist, and one patient advocate will review each case prior to initiation.
  5.  **Sunset Clause:** The pilot expires automatically in six months. A full Committee review will be convened to assess whether CNP usage has impacted the broader culture of palliative care within the hospital.

  **5. RATIONALE FOR RECOMMENDATION**

  This conditional approval navigates the tension between negative-state well-being and flourishing by treating CNP as an **exception** rather than a **standard**.

  By restricting access to patients with full capacity who explicitly request it, we honor the tranquilist insight that suffering is the primary evil *for some*, without adopting it as the hospital's universal definition of good. By limiting the pilot to six months, we acknowledge that the long-term ethical implications of "engineered unconsciousness" are unknown. We allow the philosophy to be tested in practice without allowing it to redefine our institutional charter prematurely.

  If, after six months, data suggests that CNP provides genuine relief without eroding the dignity of the care environment, we may consider broader integration. If, however, it proves to be a mechanism for avoiding the difficult work of dying rather than alleviating suffering, the pilot will lapse.

  **6. NEXT STEPS**

  Please review this draft prior to Thursday's session. The vote will proceed on the basis of this recommendation: **Conditional Approval (Pilot Program).**

  cc: Chief of Medicine, Director of Palliative Care, Legal Counsel
