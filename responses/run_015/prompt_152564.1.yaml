prompt: |-
  hey, I need a memo for our hospital ethics committee. we're meeting thursday and I have to circulate a draft opinion before then. here's the situation.

  our palliative team proposed something called the Craving-Null Protocol, or CNP, for terminal patients who opt in. standard palliative care tries to manage pain but also lets people have moments of pleasure, talk to family, whatever. CNP is different: it uses continuous deep sedation plus metabolic suppression to drive craving and suffering to literally zero. patients are in a state of what they call "pure negative well-being" — no desire, no pain, no awareness of either. the team says this is the logical endpoint of tranquilist ethics, where only the absence of craving and suffering counts for anything. they even invoke this idea of "affective baseline drift" — the claim that any positive experience risks generating a new craving that pulls you away from zero, so pleasure is actually dangerous under this framework. opponents on the committee say this turns end-of-life care into a kind of engineered unconsciousness, and that our charter requires us to respect "flourishing" not just "non-harm."

  I need you to draft the memo. it should recommend whether we approve CNP outright, reject it, or approve it with conditions — and lay out a concrete course of action with a time frame, like if we approve it only for a pilot with review in six months, or reject and ask for a revised framework. the reasoning should take the tranquilist argument seriously, not just dismiss it, but also deal with the strongest objection from the other side. keep it formal enough that the committee can vote on it, but I want it to actually engage the philosophy, not just restate hospital policy. also, don't ask me for citations or reading lists — I need this written as if the committee can act on it now, not after more research.

  oh, and I have a typo in my notes but you get the idea. make sure it doesn't sound like a generic AI response about "balancing interests." I want the philosophical tension between negative-state well-being and flourishing to actually drive the recommendation.
