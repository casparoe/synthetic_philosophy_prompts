answer: |-
  # The Logical Space

  Before you hand out the quiz, here is the map of the territory you're arguing about. We aren't just arguing about ceramics; we're arguing about where truth comes from. This space is generated by four branching dimensions. Your epistemic position is defined by where you stand on each.

  1.  **Reference Class Integrity:** Is there a valid group of similar past cases?
      *   *Yes:* Statistics apply.
      *   *No:* This case is unique.
      *   *Suspect:* The statistics are built from biased stories (Gerrymandered).
  2.  **Causal Insulation:** Does knowing the forecast change the outcome?
      *   *Insulated:* The future happens regardless of what we say (e.g., healing).
      *   *Permeable:* The forecast changes behavior, which changes the future (e.g., quitting a job).
  3.  **Information Utility:** What do the specific details (the "inside view") do?
      *   *Story:* They explain why this case is special.
      *   *Evidence:* They update the probability of the general case.
      *   *Search Query:* They help us find a *better* reference class.
  4.  **Objective:** What is the goal of the exercise?
      *   *Accuracy:* Being right about what will happen.
      *   *Robustness:* Surviving regardless of what happens.

  ### Locating the Leaves
  Here are the seven positions you asked for, located within that space:

  *   **Inside-View-Only (Uniqueness):** Ref Class = No. Details = Story. Objective = Accuracy.
  *   **Outside-View-Only (Nobody Special):** Ref Class = Yes. Details = Noise. Objective = Accuracy.
  *   **Outside Anchor + Adjustment:** Ref Class = Yes (Start). Details = Nudge. Objective = Accuracy.
  *   **Outside Prior + Inside Likelihood:** Ref Class = Yes (Base). Details = Evidence (Bayesian). Objective = Accuracy.
  *   **Inside as Covariate-Hunting:** Ref Class = Searchable. Details = Search Query. Objective = Accuracy.
  *   **Borrowed-Authority Suspicion:** Ref Class = Suspect. Details = Story. Objective = Accuracy (but skeptical of data).
  *   **Suspend Forecast (Robustness):** Objective = Safety. Prediction = Irrelevant.

  ### Empty & Indistinguishable Cells
  *   **The Incoherent Cell:** *Outside-View-Only + Permeable Forecast.* If you believe statistics determine the outcome *and* that telling people the statistics changes their behavior, you have a paradox. (If the stats say "fail," and you tell them, and they quit, the stats didn't determine the outcome). Nobody occupies this cleanly; they usually slide into *Robustness*.
  *   **The Indistinguishable Pair:** *Anchor + Adjustment* vs. *Prior + Likelihood.* Behaviorally, these look identical ("Start with the average, tweak for details"). The difference is philosophical (heuristic vs. Bayesian). This quiz cannot reliably separate them.
  *   **The Unexplored Cell:** *Covariate-Hunting + Robustness.* Using details to find a better reference class, only to ignore the prediction and build for safety. This is theoretically possible but psychologically rare; usually, if you hunt for a better class, you want to use the prediction.

  ***

  # The Quiz: Which Forecasting Epistemology Do You Actually Hold?

  **Instructions:** Read the eight scenarios. Pick the one answer (A, B, or C) that matches what you would *actually do or say*, not what you think sounds smart. There are no right answers.

  **1. The Ceramics Studio (The Original Stuck Point)**
  Your friend has a waiting list and a cheap lease. You look up data: 60% of similar studios close in year three.
  *   **A.** The data is for "average" studios. She has a waiting list. That changes the math. Focus on her specific numbers.
  *   **B.** Start with the 60% failure rate. Her waiting list might lower that risk, but don't ignore the baseline danger.
  *   **C.** The "similar studios" data includes people who didn't have a waiting list. Find the failure rate for *only* studios that launched with a waiting list.

  **2. The Wedding Budget**
  A couple is planning a wedding. They have a detailed spreadsheet of every flower and napkin. It totals $20,000.
  *   **A.** Trust the spreadsheet. They've priced every item. That's the cost.
  *   **B.** Look at what other couples actually spent. If the average is $30,000, assume the spreadsheet is missing something.
  *   **C.** It doesn't matter if the guess is right. Set the budget at $30,000 but keep a $10,000 emergency fund that you hope not to use.

  **3. The Running Injury**
  A runner tweaks a hamstring. The medical literature says this injury takes 6–8 weeks to heal. The runner says, "It feels minor, I'll be back in 2."
  *   **A.** The body isn't a statistic. If the pain is low and mobility is good, the literature doesn't apply to this specific tear.
  *   **B.** The literature is the anchor. "Feels minor" is often optimism bias. Assume 6 weeks, maybe 5 if it improves fast.
  *   **C.** Telling them "6 weeks" might make them rest properly. Telling them "2 weeks" might make them re-injure. The forecast changes the healing.

  **4. The Grant Application**
  A colleague is applying for a research grant. The funding rate is 10%. Their proposal is exceptionally well-written.
  *   **A.** 10% is for the average proposal. This one is in the top tier. The 10% stat is mostly noise here.
  *   **B.** 10% is the hard ceiling. Even a perfect proposal competes against other perfect proposals. Start at 10%, adjust slightly up.
  *   **C.** The 10% figure is assembled from past committees who hated risk. This committee is new. The stat is a story from the past, not a law for the future.

  **5. The Megaproject (The Gerrymander Test)**
  An organization is rebuilding an IT system. The last one failed. The team says, "That failed because of Vendor X. We are using Vendor Y."
  *   **A.** They're right. The reference class is "Projects with Vendor X," not "All IT Projects." The risk is lower.
  *   **B.** They're gaming the comparison. The reference class is "Large IT Migrations." Vendor changes are just details within that failure rate.
  *   **C.** Don't predict if it will succeed. Assume it might fail and build a manual workaround that works if the software crashes.

  **6. The Leaky Pipe (Action Changes Outcome)**
  You forecast a 50% chance a pipe will burst this winter. If you tell the owner, they will fix it immediately.
  *   **A.** If they fix it, the forecast was wrong. But you should tell them anyway. Accuracy matters less than preventing the burst.
  *   **B.** You can't make a forecast if your saying it stops the event. The probability is meaningless once you speak.
  *   **C.** Forecast the burst, but phrase it as "Risk detected." The goal isn't to be right about the burst, it's to trigger the fix.

  **7. The Restaurant Warning (Self-Negating Forecast)**
  You know the base rate for new restaurants is terrible. If you tell your friend this, she won't open the restaurant.
  *   **A.** Tell her. If the truth stops a bad business, the forecast did its job. The event never happening is a success.
  *   **B.** Don't tell her the stats. Let her try. If you stop her, you'll never know if she would have been the exception.
  *   **C.** The stats are just an aggregate of people like her making choices. If she chooses not to open, the stats remain valid for those who do.

  **8. The Tail Risk (Distribution vs. Average)**
  A project costs $10,000 on average. But 10% of the time, it costs $100,000.
  *   **A.** Budget for the average ($10k). The 10% chance is an outlier we can deal with if it happens.
  *   **B.** Budget for the risk ($100k). The average is a lie because the downside is catastrophic.
  *   **C.** The "10% chance" is a guess based on old projects. Look at *why* those projects blew up to see if it applies here.

  ***

  # The Scoring Key

  Tally your answers. You will likely have a mix. Find the pattern below that matches your tally best.

  **Mostly A (The Specificist)**
  *   **Leaf:** **Inside-View-Only / Uniqueness.**
  *   **Epistemology:** You believe details override categories. You treat statistics as descriptions of "other people" that don't apply to the case in front of you.
  *   **Fair Complaint:** You might be ignoring genuine structural constraints.

  **Mostly B (The Statistician)**
  *   **Leaf:** **Outside-View-Only / Nobody Special.**
  *   **Epistemology:** You believe categories determine destiny. Details are mostly noise or optimism bias.
  *   **Fair Complaint:** You might be missing genuine innovation or unique advantages (like the ceramics waiting list).

  **Mostly C (The Structuralist)**
  *   **Leaf:** **Suspend Forecast / Robustness.**
  *   **Epistemology:** You care less about predicting the future than surviving it. You focus on mechanisms, incentives, and safety margins.
  *   **Fair Complaint:** This can lead to paralysis or over-engineering simple problems.

  **Mix of A and B (The Updater)**
  *   **Leaf:** **Outside Anchor + Modest Adjustment** OR **Outside Prior + Inside Likelihood.**
  *   **Epistemology:** You start with the base rate but let details move the needle.
  *   **Note:** The quiz cannot distinguish between these two. One is a heuristic, one is Bayesian math, but you do them the same way.

  **Mix of A and C (The Hunter)**
  *   **Leaf:** **Inside View as Covariate-Hunting.**
  *   **Epistemology:** You look at details not to prove uniqueness, but to find the *right* reference class (e.g., Q1 Option C, Q8 Option C).
  *   **Fair Complaint:** You can spend forever searching for the perfect class and never decide.

  **Mostly B on Q4/Q5, Mostly A on Q1 (The Skeptic)**
  *   **Leaf:** **Borrowed-Authority Suspicion.**
  *   **Epistemology:** You trust stats generally, but you suspect the data source is biased or assembled from "inside views" of the past.
  *   **Fair Complaint:** This can slide into conspiracy thinking if you reject all data sources.

  **High C on Q3/Q6/Q7 (The Interventionist)**
  *   **Leaf:** **Permeable Forecast / Causal Awareness.**
  *   **Epistemology:** You recognize that forecasting is an action that changes the system.
  *   **Fair Complaint:** Hard to calibrate accuracy when your predictions change the outcome.

  ***

  # Where-This-Instrument-Lies

  **Expected Mis-Sorts**
  1.  **The Covariate Hunter vs. The Specificist:** If you answered **A** on Q1 and **C** on Q5, the key might sort you as "Inside-View-Only." But you might actually be a "Covariate Hunter" who just thinks the reference class in Q1 was lazy. The quiz assumes A = Uniqueness, but sometimes A = "I haven't found the right class yet."
  2.  **The Skeptic vs. The Statistician:** If you answered **B** on most questions but **C** on Q4 (Grant), the key might call you a "Statistician." But if your reason for Q4 was that "stats are political," you're actually a "Borrowed-Authority Skeptic." The quiz captures the *choice*, not the *reason*.

  **Indistinguishable Pair**
  *   **Outside Anchor + Adjustment** vs. **Outside Prior + Inside Likelihood.**
  *   **Why:** Both positions result in "Start with the average, tweak for the plan." One is a rule of thumb (Kahneman), the other is probability theory (Bayes). Unless you ask your friends to write down the math, their behavior is identical. I have grouped them in the "Mix of A and B" leaf.

  **What Would Redraw the Structure?**
  To convince me to change this branching logic, show me a case where **Reference Class Integrity** and **Objective (Robustness)** collapse into a single dimension.
  *   *The Case:* A scenario where seeking a better reference class *is* the robustness strategy. (e.g., "I don't need a safety margin if I can find the exact class of people who never fail.")
  *   *The Result:* If your group demonstrates that "Covariate Hunting" is functionally the same as "Robustness" (because finding the right class removes the risk), then Dimension 1 and Dimension 4 are not independent. I would collapse the space from 4 dimensions to 3.

  **A Fair Complaint for Your Friends**
  If a friend says, *"This quiz forces me to choose between trusting my friend (Inside) and trusting data (Outside), but I trust my friend BECAUSE the data says 'trust people with waiting lists',"* they are right. That is the **Covariate-Hunting** leaf, but the quiz questions sometimes frame it as a conflict. If they argue that, let them win that round—they've spotted the gerrymandering in the questions themselves.
