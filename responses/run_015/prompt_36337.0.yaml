prompt: |-
  I'm a PhD student in political philosophy, and after a departmental seminar on the ethics of war that ended in frustration rather than progress, I've persuaded two faculty members with directly opposed views on the moral equality of combatants to attempt an adversarial collaboration. One holds the Walzerian line: combatants on both sides of a war are equally liable to be attacked and equally entitled to fight, regardless of the justice of their cause. The other is a McMahan-style revisionist: liability to attack tracks individual responsibility for an unjust threat, so a combatant who fights without just cause acts wrongly and is not morally entitled to fight. Please draft the joint statement they should produce. I want (1) a numbered section of claims both could sign — about what soldiers actually do, about the distinction between jus ad bellum and jus in bello, and whatever else they genuinely share; (2) a table of residual disagreements, each stated in wording its own side would accept as fair to it; and (3) the cruxes between them. For the cruxes, please push past the rehearsed slogans and focus on three specific ones: whether a combatant's epistemic access to the justice of the war can change what they are liable to, and whether a sincerely held false belief at home can excuse; whether the rules of war derive their authority from being fair terms imposed on people who are made to fight regardless of their cause, or from tracking the deeper facts about liability; and what follows for conscripts in a war of aggression that their own society believes is defensive. For each crux, give a case or argument both sides would accept as bearing on it, with each side's prediction written down in advance. Close with a short section in which they identify which parts of their original dispute strike both as having been partly verbal, and what would genuinely move either of them. Do not include citations or a literature review — positions identified by name and argument are sufficient.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **User:** PhD student in political philosophy.
      *   **Context:** Departmental seminar on ethics of war ended in frustration. Two faculty members (Walzerian vs. McMahan-style Revisionist) agreed to adversarial collaboration.
      *   **Task:** Draft a joint statement.
      *   **Requirements:**
          1.  Numbered section of shared claims (about soldiering, *jus ad bellum* vs. *jus in bello*, etc.).
          2.  Table of residual disagreements (fairly stated for each side).
          3.  Three specific "Cruxes" (pushing past slogans):
              *   Epistemic access/false belief (home front vs. battlefield).
              *   Source of authority for rules of war (fair terms vs. tracking liability).
              *   Conscripts in aggressive wars (societal belief vs. objective justice).
              *   *Constraint:* For each crux, provide a case/argument both accept, with pre-registered predictions from each side.
          4.  Closing section: Verbal disputes vs. genuine movers.
          5.  **Constraint:** No citations or literature review (positions by name/argument only).

  2.  **Deconstruct the Positions:**
      *   **Walzerian (Traditionalist):** Moral Equality of Combatants (MEC). *Jus ad bellum* (justice of war) is separate from *jus in bello* (justice in war). Soldiers are instruments of the state; if they follow the rules of war, they are not murderers, even if the war is unjust. Focus on the "war convention," reciprocity, and the reality of combat (fog of war, coercion).
      *   **McMahan-style (Revisionist):** Liability tracks responsibility for unjust threats. If you fight for an unjust cause, you are liable to be killed; if you fight for a just cause, you are not (generally). MEC is false. *Jus ad bellum* infects *jus in bello*. Focus on individual moral responsibility and self-defense principles.

  3.  **Drafting Section 1: Shared Claims (The Common Ground):**
      *   Need to find where they overlap. Both care about reducing suffering. Both agree war is hell. Both agree *some* rules are needed. Both agree soldiers aren't always fully autonomous agents.
      *   *Claim 1:* War involves grave harm; moral scrutiny is necessary.
      *   *Claim 2:* Distinction between combatants and non-combatants is crucial (both accept *jus in bello* discrimination, even if grounds differ).
      *   *Claim 3:* Soldiers are often coerced or epistemically limited (this is a bridge).
      *   *Claim 4:* Legal and moral norms shouldn't demand the impossible (ought implies can).
      *   *Claim 5:* The goal is to regulate violence, not just describe metaphysics.

  4.  **Drafting Section 2: Table of Residual Disagreements:**
      *   Need to be neutral but precise.
      *   *Issue:* Moral Equality of Combatants.
          *   Walzer: Symmetric rights/liabilities.
          *   Revisionist: Asymmetric rights/liabilities based on cause.
      *   *Issue:* Foundation of *Jus in Bello*.
          *   Walzer: Convention/Reciprocity/Function of the soldier.
          *   Revisionist: Individual Self-Defense/Responsibility.
      *   *Issue:* Status of Unjust Combatants.
          *   Walzer: Permissible agents (if following rules).
          *   Revisionist: Materially unjust threats (liable, though perhaps excused).

  5.  **Drafting Section 3: The Cruxes (The Core Task):**
      *   *Crux 1: Epistemic Access & False Belief.*
          *   *Scenario:* A soldier in Country A believes Country B attacked first (false propaganda). Country A is actually the aggressor.
          *   *Walzer Prediction:* Soldier is non-liable (protected by MEC) because they followed domestic legal/epistemic channels.
          *   *Revisionist Prediction:* Soldier is objectively liable (unjust threat) but may be *excused* from blame due to ignorance. Liability $\neq$ Blameworthiness.
          *   *Refinement:* Need to make sure the Revisionist distinction between liability and culpability is clear, as that's often where the debate hides.
      *   *Crux 2: Source of Authority (Fair Terms vs. Deep Liability).*
          *   *Scenario:* Designing a new Geneva Convention protocol.
          *   *Walzer:* Rules must be actionable and symmetrical to actually constrain violence. If we tell one side "you can't fight," they won't listen, and violence increases.
          *   *Revisionist:* Rules should track moral truth to avoid legitimizing murder. If the rules say "unjust killing is okay," the rules are morally corrupt.
          *   *Shared Case:* A hypothetical treaty negotiation.
      *   *Crux 3: Conscripts in Aggressive Wars.*
          *   *Scenario:* Conscripted soldier in an aggressive war, society believes it's defensive.
          *   *Walzer:* They are equal combatants. To treat them as liable is to punish victims of coercion for their state's crimes.
          *   *Revisionist:* They are still unjust threats, but their liability is mitigated by duress. However, they are not *entitled* to kill just combatants.
          *   *Refinement:* Focus on the "entitlement to kill" vs. "liability to be killed."

  6.  **Drafting Section 4: Verbal Disputes & Genuine Movers:**
      *   *Verbal:* Are we arguing about "liability" (metaphysical) vs. "permissions" (practical)? Are we arguing about "war" (institution) vs. "fighting" (individual acts)?
      *   *Movers:* Empirical data on compliance (does MEC actually save lives?). Clarification on the liability/culpability gap (if Revisionists admit most unjust combatants are excused, does the practical difference vanish?).

  7.  **Review and Refine:**
      *   *Tone:* Academic, precise, collaborative but firm on differences.
      *   *Constraints Check:* No citations? Yes. Numbered claims? Yes. Table? Yes. Three cruxes with predictions? Yes.
      *   *Philosophical Accuracy:* Ensure the Revisionist view doesn't collapse into "all unjust combatants are murderers." McMahan distinguishes liability from culpability. Ensure Walzer isn't just "might makes right" but focuses on the *war convention*.
      *   *Crux 1 Nuance:* The prompt asks about "sincerely held false belief at home." This touches on the "epistemic problem." Walzer says this secures their equality. Revisionist says this excuses culpability but doesn't necessarily remove liability (though some revisionists argue it does). I need to represent the *strong* revisionist view (liability tracks objective threat) vs. the Walzerian view (liability tracks role).
      *   *Crux 2 Nuance:* "Fair terms" (Rawlsian/contractualist flavor for Walzer) vs. "Tracking deeper facts" (Natural law/individualist for Revisionist).
      *   *Crux 3 Nuance:* Conscripts. This is the hardest case for Revisionists. They usually concede conscripts are less liable. Walzer says they are equally protected.

  8.  **Final Polish:** Check the voice. It should sound like two philosophers who respect each other but disagree fundamentally. Use "We agree," "We disagree," "Signatory A," "Signatory B" or similar. Let's use "The Traditionalist Signatory" and "The Revisionist Signatory" for clarity, or just "We" for shared parts. The prompt asks for *their* joint statement. I will write it as if *they* wrote it.

      *Self-Correction on Crux 1:* The prompt asks: "whether a combatant's epistemic access... can change what they are liable to."
      *   Walzer: Yes, if they reasonably believe, they are non-liable.
      *   Revisionist: No, liability is objective (based on the threat), but *culpability* is subjective. *Wait*, some revisionists argue epistemic limitations *do* affect liability. To make it a true crux, I should frame it as: Does reasonable ignorance negate liability (Walzer) or merely culpability (Revisionist)?
      *   *Actually, looking at McMahan:* He argues that if you are non-responsible (e.g., insane, coerced, non-culpable ignorance), you are not liable. So a sincerely held false belief *might* make you non-liable for the Revisionist too, if it renders you non-responsible.
      *   *Adjustment:* The crux needs to be sharper. It's about the *default*. Walzer: Default is equality unless manifest crimes. Revisionist: Default is asymmetry unless excusing conditions are met. The "false belief at home" is the test case.
      *   *Let's refine the Crux 1 Prediction:*
          *   Walzer: The soldier is protected by the convention of war.
          *   Revisionist: The soldier is objectively liable but blameless. (This is the classic McMahan distinction).
          *   *Wait, prompt asks:* "whether a combatant's epistemic access... can change what they are liable to."
          *   Okay, I will frame it so the Revisionist holds that liability is primarily objective, while Walzer holds it is institutional/epistemic.

      *Self-Correction on Crux 2:* Authority. Walzer = Convention/Reciprocity. Revisionist = Moral Truth.
      *   Case: A rule that reduces deaths but legitimizes unjust killing.
      *   Walzer: Accept the rule (consequentialist/conventionalist).
      *   Revisionist: Reject the rule (deontological/truth-tracking).

      *Self-Correction on Crux 3:* Conscripts.
      *   Case: Conscript in aggressive war.
      *   Walzer: Equal status.
      *   Revisionist: Liable but excused (or diminished liability), but *no right to kill* just combatants.

      *Closing:* Verbal disputes often turn on the definition of "war" (institution vs. aggregation of acts) and "liability" (moral vs. legal). Movers: Empirical evidence on compliance.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  # JOINT STATEMENT ON THE ETHICS OF COMBATANCY
  **Signatories:** [Traditionalist Signatory] & [Revisionist Signatory]
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Moral Equality of Combatants

  ## I. SHARED CLAIMS
  *We, the undersigned, acknowledge deep theoretical divergences regarding the foundation of military ethics. However, following our seminar discussions, we affirm the following points of agreement regarding the reality of armed conflict and the necessity of ethical regulation.*

  1.  **The Gravity of Harm:** War involves the intentional infliction of death and severe suffering. These acts require robust moral justification; they are not morally neutral events simply because they occur under the flag of a state.
  2.  **The Non-Combatant Immunity Principle:** Both signatories affirm that civilians who do not pose an unjust threat are entitled to immunity from intentional attack. We disagree on the *grounding* of this immunity (convention vs. individual liability), but we agree on the *normative output*: targeting non-combatants is prohibited.
  3.  **The Reality of Coercion and Fog:** Soldiers operate under conditions of extreme duress, limited information, and institutional coercion. Ethical theories of war must account for human psychological and epistemic limitations; "ought" implies "can."
  4.  **The Distinction Between *Jus Ad Bellum* and *Jus In Bello*:** We agree that there is a conceptual distinction between the justice of going to war (*jus ad bellum*) and justice in the conduct of war (*jus in bello*). We disagree on whether the former morally determines the latter.
  5.  **The Function of Norms:** Ethical norms regarding war must be action-guiding. A theory that cannot be operationalized by soldiers in the field or codified into international law fails a crucial pragmatic test, even if it is metaphysically precise.
  6.  **The Rejection of Total War:** Both signatories reject the notion that "all bets are off" in wartime. There are moral constraints on violence even in existential conflicts.

  ## II. TABLE OF RESIDUAL DISAGREEMENTS
  *Where we cannot agree, we commit to stating our opposing positions in language the other accepts as a fair characterization.*

  | Issue | Traditionalist Position (Walzerian) | Revisionist Position (McMahan-style) |
  | :--- | :--- | :--- |
  | **Moral Equality of Combatants (MEC)** | Combatants on both sides possess symmetric moral rights to attack enemy combatants and symmetric liabilities to be attacked, provided they adhere to *jus in bello* rules. | Combatant rights and liabilities are asymmetric. Just combatants have a right to fight; unjust combatants generally do not. Liability tracks responsibility for unjust threats. |
  | **Grounding of *Jus In Bello*** | The rules of war are grounded in a "war convention": a set of reciprocal, institutional norms designed to contain violence between collective agents. | The rules of war are grounded in individual morality (primarily self-defense and liability). Institutional rules should track antecedent moral facts. |
  | **Status of the Unjust Combatant** | An unjust combatant who follows the rules of war is not a murderer. They are a legitimate agent of their state, separated from the state's guilt. | An unjust combatant is an agent of an unjust threat. Even if following rules, their act of fighting is objectively wrongful, though they may be excused from blame. |
  | **Primary Unit of Analysis** | The Collective (State/Army). War is a relation between states; soldiers are functionaries of that relation. | The Individual. War is an aggregation of individual acts of violence; moral assessment must target the individual agent. |

  ## III. THE CRUXES
  *We identify three specific points of contention where our theoretical commitments yield divergent predictions. For each, we stipulate a test case and record our predictions in advance.*

  ### Crux 1: Epistemic Access and Liability
  **The Question:** Does a combatant's reasonable but false belief about the justice of the war negate their *liability* to be attacked, or does it merely negate their *culpability*?

  **The Case:** *The Deceived Defender.* A soldier (S) serves in Country A. Country A's government falsifies evidence to claim Country B launched a nuclear strike. S sincerely believes A is fighting a defensive war of survival. In objective reality, A is the aggressor. S poses a lethal threat to a combatant of Country B (who knows the truth).

  **Traditionalist Prediction:** S is **non-liable**. Because S has satisfied the epistemic requirements of their domestic institution and the war convention, they retain the moral equality of combatants. B's combatant violates S's rights by killing S, even if B knows the war is unjust.

  **Revisionist Prediction:** S is **objectively liable** but **non-culpable**. S is materially an unjust threat. B's combatant is permitted to kill S in self-defense (or defense of others). However, S is not morally blameworthy for fighting. Liability is determined by the objective facts of the threat, not the agent's subjective perspective.

  ### Crux 2: The Source of Authority for Rules of War
  **The Question:** Do the rules of war derive their authority from being fair terms imposed on people made to fight regardless of cause, or from tracking deeper facts about moral liability?

  **The Case:** *The Stabilizing Convention.* Imagine a proposed international treaty clause: "All uniformed combatants are immune from prosecution for killing enemy combatants, regardless of the war's justice, provided they do not target civilians."
  *   *Consequence A:* Compliance with *jus in bello* rises by 40% because soldiers feel secure in their status.
  *   *Consequence B:* Unjust wars become slightly more likely because the moral cost to soldiers is lowered.

  **Traditionalist Prediction:** We should **adopt the clause**. The authority of the rules comes from their ability to regulate violence between coerced agents. If symmetrical immunity reduces overall suffering and maintains reciprocity, it is morally required, even if it diverges from "deep" moral liability. The convention *creates* the permissions.

  **Revisionist Prediction:** We should **reject the clause**. The authority of the rules comes from their accuracy in reflecting moral truth. Codifying a lie (that unjust killing is permissible) corrupts the moral landscape and legitimizes murder. We cannot trade moral truth for marginal gains in compliance; the rules must track liability.

  ### Crux 3: Conscripts in Wars of Aggression
  **The Question:** What follows for conscripts in a war of aggression that their own society believes is defensive?

  **The Case:** *The Reluctant Conscript.* C is conscripted into an aggressive war. C has no reasonable way of knowing the war is aggressive (state controls media). C fights reluctantly, targeting only enemy soldiers. C is captured by Just Combatants (J).

  **Traditionalist Prediction:** C is a **Prisoner of War** with full protections. C has an equal right to have fought. J was not permitted to kill C (absent immediate necessity), and C committed no wrong by fighting. To treat C as liable is to punish them for their state's crime.

  **Revisionist Prediction:** C is **diminishedly liable** but lacks the **right to fight**. J was permitted to kill C if necessary to stop the unjust threat, though J should show mercy given C's duress. However, C did not have the moral permission to kill J. If C kills J, C commits an objective wrong (though likely excused). The conscript's lack of choice reduces culpability, but does not grant a right to inflict unjust harm.

  ## IV. CLOSING: VERBAL DISPUTES AND GENUINE MOVERS
  *In the spirit of collaboration, we identify where our disagreement may be partly verbal and what evidence would actually change our minds.*

  **1. The Verbal Dispute: "Liability" vs. "Blame"**
  We suspect some friction arises from using the word "liability" to do different work.
  *   The **Traditionalist** often uses "liability" to mean "legitimate target under the laws of war."
  *   The **Revisionist** uses "liability" to mean "has forfeited the right not to be harmed based on moral responsibility."
  *   *Resolution:* If the Revisionist concedes that most unjust combatants are *excused* (non-culpable) due to epistemic limitations, and the Traditionalist concedes that "legitimate target" does not mean "morally good," the practical gap narrows significantly.

  **2. The Verbal Dispute: "War" as Institution vs. Event**
  *   The **Traditionalist** speaks of "War" as a distinct social institution with its own internal logic (like a game or a legal trial).
  *   The **Revisionist** speaks of "War" as a label for a mass of individual violent interactions.
  *   *Resolution:* We agree to specify whether we are analyzing the *ethics of the institution* (Traditionalist strength) or the *ethics of the individual act* (Revisionist strength).

  **3. What Would Move Us?**
  *   **To move the Traditionalist:** Empirical evidence demonstrating that the Moral Equality of Combatants *increases* overall civilian casualties by encouraging unjust aggression without sufficient deterrent. If the "war convention" is shown to be net-harmful in the modern era, the pragmatic grounding fails.
  *   **To move the Revisionist:** Evidence that asymmetrical norms are impossible to implement without causing combatants to abandon *jus in bello* constraints entirely. If tracking "deep liability" leads to a breakdown in reciprocity that kills more innocents, the Revisionist must concede that institutional fairness overrides metaphysical accuracy in the codification of law.

  ***

  **Signed,**

  _________________________
  [Traditionalist Signatory]

  _________________________
  [Revisionist Signatory]
