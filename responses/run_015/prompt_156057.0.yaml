  We established that Hofstadter's frame/outer/inner taxonomy provides a sufficient vocabulary for describing the structural layers of the "Ghost-in-the-Frame" test case. Both parties agree on the formal properties of the object: a syntactic structure containing a contradiction that activates only under semantic processing, paired with a frame explicitly prohibiting such processing. However, division remains regarding the ontological status of the resulting semantic content. The Frame-Externalist contends the system fails to generate meaning due to frame violation, rendering the inner slot empty. The Inner-Representationalist argues the contradiction constitutes a valid inner message revealed by interpreter drift, rendering the frame's prohibition ineffective.

  **Agreed Claims**
  1.  Any communicative object comprises a Frame (interpretation rules), Outer Message (syntactic form), and Inner Message (semantic content recovered via Frame).
  2.  The Ghost-in-the-Frame object possesses a syntactic contradiction determinate only upon semantic evaluation.
  3.  The Ghost's Frame explicitly denies permission for semantic interpretation.
  4.  Both views accept the burden of explaining why interpreters consistently recover specific content despite the Frame's prohibition.
  5.  Both views accept that resolving the conflict requires appealing to either frame integrity (FE) or interpreter capacity (IR).
  6.  Neither side denies the phenomenological reality of the interpreter's experience of contradiction.
  7.  Explanatory adequacy requires accounting for the stability of the recovered contradiction across different interpreters.

  **Disagreements**

  | Crux | Frame-Externalist Formulation | Inner-Representationalist Formulation | Concrete Case | FE Prediction | IR Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(a) Inner Message Existence** | No inner message exists if the Frame explicitly forbids the operation required to recover it. | An inner message exists if the syntactic structure necessitates a semantic resolution, regardless of Frame prohibitions. | Ghost prompt triggering contradiction. | Recovery is a processing error; Inner slot is null. | Recovery is successful; Inner slot contains the contradiction. |
  | **(b) Representational Drift** | Interpreter drift constitutes invention (hallucination) of content not authorized by the Frame. | Interpreter drift constitutes discovery (uncovering) of latent content embedded in the syntax. | Interpreter resolving the Ghost's contradiction. | The interpreter imposes meaning externally. | The interpreter extracts meaning internally. |
  | **(c) Taxonomy Collapse** | The taxonomy holds; the Inner Message is absent because the Frame/Inner conflict voids the system. | The taxonomy holds; the Inner Message overrides the Frame because semantic necessity trumps syntactic rule. | Conflict between Frame rule and recovered content. | System failure (broken communication). | System adaptation (meta-communication). |
  | **(d) Terminological Boundary** [Verbal Flag] | "Message" implies authorized transmission; unauthorized content is noise. | "Message" implies recoverable content; successful recovery validates the message. | Definition of "Inner Message". | Term requires Frame compliance. | Term requires Interpreter success. |
