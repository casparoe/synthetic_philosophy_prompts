answer: |-
  **Scenario A: The Emergency Shift**
  You agree to cover a weekend shift at your part-time job after your boss calls and says, "The person scheduled is in the ER, I'm desperate." You hate working weekends and would have said no to a normal request, but you say yes because of the emergency. You work the eight hours. Later, you find out the other employee wasn't sick at all; they just wanted the day off for a concert, and your boss lied to guilt you into it. Despite the lie being the only reason you agreed, and you definitely would have refused otherwise, everyone agrees you still earned your paycheck and the shift counts as worked—you can't demand double pay or claim you were forced to work against your will after the fact.

  **Scenario B: The Co-Author Deal**
  You are a senior who needs one last credit to graduate, but your laptop dies the night before a major final paper is due. A classmate offers to lend you their spare laptop, but only on the condition that you add their name to your essay as a co-author, even though they did no work. There are no other computers available, the teacher isn't watching, and the classmate didn't break your laptop—they are just setting terms. You understand exactly what you're agreeing to, there are no threats, and you are sober. You sign the deal, submit the paper, and graduate. Yet, if the school finds out, they will invalidate the credit and punish both of you, treating your "yes" as meaningless because the agreement itself violates a boundary you aren't allowed to cross, regardless of your understanding.

  ***

  ### The Walkthrough

  **Scenario A Analysis:**
  This hits Maya's **Condition 1 (Nobody deceived you)** directly. The boss lied, and the lie caused the "yes." Under Maya's strict rule, consent should be void. However, intuitively, the consent *to the labor* holds (you get paid, the shift is covered). The difference here isn't about the lie itself, but about **what the lie concerned**. The lie was about the *motive* (why the help was needed), not the *terms* (what the work was or the pay). In philosophy, this is often split between "fraud in the fact" (lying about what the act *is*) and "fraud in the inducement" (lying about *why* you should do it). Your intuition says the latter doesn't necessarily void the consent to the act itself, only makes the liar morally blameworthy.

  **Scenario B Analysis:**
  This passes all three of Maya's conditions: No deception (terms are clear), no pressure (classmate didn't cause the crisis), and competence (you understand the deal). Yet, the consent feels void. Your hunch about "hating the menu" is close, but it's not just that the options are bad; it's that **some things cannot be consented to**. This is the concept of **Inalienable Rights** or **Structural Integrity**. You cannot validly consent to academic fraud, just like you can't validly consent to be someone's slave, even if you sign a contract. The "No" comes from outside the interaction—it's a rule about what kinds of agreements are permissible in the first place, regardless of how clearly they are agreed upon.

  ***

  ### The Debate Prep: How They Survive

  **Maya's Defense (Attacking Scenario A):**
  Maya has to dig in and argue that **consent in Scenario A *is* actually void**, even if we pay the worker. She will argue that you didn't truly consent to *this* shift under *these* conditions; you consented to an "emergency shift," not a "cover-for-a-concert shift." To save her theory, she has to bolt on a distinction: **Material Deception**. She must argue that only lies about "material facts" (what the act is, the risks, the pay) void consent, while lies about "collateral motives" (why the boss needs help) are just moral betrayals that don't technically void the agreement to work. If she doesn't make this split, her rule destroys every everyday agreement where someone exaggerates a need to get help.

  **Denis's Defense (Attacking Scenario B):**
  Denis has to argue that **consent in Scenario B *is* actually valid**, even if the school punishes it. He will claim that the school punishing you doesn't mean your consent was fake; it means the **consequences** are bad. He'll argue that you *did* validly consent to the deal (you made a choice), but the deal was unethical or against school rules. To save his position, he has to separate **Validity** from **Permissibility**. He must argue that consent makes an act *yours*, but it doesn't make it *right*. If he conflates the two, he admits that "No Pressure/No Lies" isn't enough, and Maya wins.

  ### The Verdict: Patch or Rebuild?

  The three-condition picture needs a **patch**, not a full rebuild, but the patch is heavy. Maya's list is good for **interpersonal** morality (how we treat each other), but it fails at **structural** morality (rules of the system).

  **The Patch:** Add a **Condition 4: Permissibility.**
  *   *Consent counts only if:* (1) No Deception, (2) No Pressure, (3) Competence, **AND (4) The act itself is something a person is allowed to agree to.**

  **Why the Club Will Tear It Apart:**
  They will ask: "Who decides what is permissible?" If you add Condition 4, you can override anyone's "yes" by saying "You aren't allowed to agree to that." That's paternalistic. It gives teachers or parents the power to say "You thought you consented, but you weren't allowed to," which undermines the whole point of consent.

  **The Better Rebuild:**
  Instead of a checklist, present consent as a **Threshold of Autonomy**.
  *   *May's conditions* protect the **internal** threshold (are you clear and free?).
  *   *Scenario B* shows the **external** threshold (does this agreement destroy your future ability to choose?).
  *   *Scenario A* shows that **motives** are fragile, but **actions** are solid.

  Tell the club: "Maya's rules protect the *mind* of the person consenting. Scenario B shows we also need rules to protect the *status* of the person consenting. You can't agree to stop being a person with rights." That's the bridge between their two arguments.
