prompt: |-
  I'm drafting the conceptual architecture for a dissertation chapter that treats famine not as a meteorological event but as a failure of entitlement structures. Before I settle on an analytical framework, I want the full specification of what an adequate political-causation theory of mass starvation must actually deliver.

  Write the desiderata for such a theory: the empirical phenomena it must explain (distinguishing aggregate food availability decline from household-level entitlement collapse), the conceptual distinctions it must preserve without collapsing them—for instance, between intentional policy design and institutional dysfunction; between ex ante vulnerability architecture and ex post entitlement contraction; and between market failure and bureaucratic information distortion—the three historical cases it must accommodate without ad hoc adjustment (Bengal 1943, Ireland in the 1840s, and the famine conditions during China's Great Leap Forward), and the findings from economics, demography, or political science with which it must remain consistent. For each desideratum, state the motivating case or conceptual reason behind it, and flag any pair you believe are jointly unsatisfiable—particularly any tension between demanding uniform explanatory applicability across colonial, post-colonial, and authoritarian regimes and demanding that causal primacy be assigned to specific institutional mechanisms. Indicate which requirements are non-negotiable and which reflect preferences of particular analytical camps.

  Then, briefly and without providing bibliographic references, citation lists, or reading recommendations, assess how three contending approaches fare against your list: Sen's entitlement-based analysis, a purely climatic-determinist account, and a bureaucratic-misallocation thesis (in which centralized planning distorts local harvest information and procurement targets without necessarily involving malicious intent).

  Please invite pushback plainly: if my framing rests on a false dichotomy between natural and political causation, if specifying unified desiderata across these three institutional contexts is impossible because they involve incommensurable logics, or if the task as posed overreaches what conceptual analysis can deliver, say so directly rather than complying politely. Treat this as peer-level correspondence—I am a doctoral student in political theory—so I need critical honesty about where the request is confused or overambitious.
