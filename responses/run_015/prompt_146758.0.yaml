  **Node 1 (Start):** Do you accept that Galileo's falling-bodies case (heavy object tied to a light one) reveals something about nature that pure observation alone couldn't?
  *   **No:** → **Leaf 1: Full Scepticism.** (Thought experiments are just rhetorical decoration or pedagogical tools; they yield no new knowledge.)
  *   **Yes:** → Go to Node 2.

  **Node 2:** Is the knowledge yielded primarily *intersubjective* (aligning our shared judgements) rather than *individual* (happening inside one mind)?
  *   **Yes:** → **Leaf 2: The Calibratonist View.** (Thought expreiments calibrate shared modal intuitions against baseline empirical stories; the payoff is alignment, not world-directed discovery.)
  *   **No:** → Go to Node 3.

  **Node 3:** Is the mechanism essentially *logical* (unpacking hidden premises) rather than *imaginative* (simulating or seeing)?
  *   **Yes:** → Go to Node 4.
  *   **No:** → Go to Node 5.

  **Node 4:** (Logical Branch) Are the premises strictly *empirical* (derived from prior observation)?
  *   **Yes:** → **Leaf 3: The Argument View.** (Norton-style: it's a disguised argument with empirical premises.)
  *   **No:** → **Leaf 4: [Empty Slot].** (Logical mechanism but *a priori* premises without Platonic intuition. Diagnosed below.)

  **Node 5:** (Imaginative Branch) Does the imagination reveal a pre-existing *abstract law* or construct a temporary *mental model*?
  *   **Abstract Law:** → **Leaf 5: Platonism.** (Brown-style: direct intuition of necessary laws.)
  *   **Mental Model:** → **Leaf 6: Model-Based Simulation.** (Nersessian-style: running a cognitive simulation to test constraints.)

