  # Seminar Activity: The Fleet of Forgetful Drivers
  **Time:** 90 Minutes  
  **Participants:** 10 Grad Students  
  **Goal:** Enact the Absent-Minded Driver (AMD) paradox to feel the tension between *ex-ante* planning and *ex-post* dominance reasoning.

  ## 1. Setup & Roles (0–10 mins)
  **The Scenario:** The class is a "Fleet" of 10 autonomous vehicles driving down a highway at night. There are two identical exits, followed by the end of the road.
  **The Payoff Scheme (Write on Board):**
  *   **Exit 1:** 0 Points (Wrong exit)
  *   **Exit 2:** 4 Points (Destination)
  *   **End of Road (Pass both):** 1 Point (Missed it)
  *   **Fleet Bonus:** If the Fleet's *average* score is > 2.5 points, every driver gets **+1 Bonus Point**.

  **The Constraint (Common Knowledge):**
  1.  **Binding Vote:** Before driving, the Fleet votes on a binding policy.
  2.  **Amnesia:** Once on the highway, drivers forget the vote.
  3.  **Indistinguishability:** At any intersection, the driver cannot tell if it is Exit 1 or Exit 2.

  ## 2. Phase I: Ex-Ante Planning (10–25 mins)
  **Activity:** The Fleet Congress.
  1.  Ask students to calculate the optimal path *before* driving.
      *   *Math:* If you Exit at 1 (0), you lose. If you Exit at 2 (4), you win. If you pass both (1), you lose.
      *   *Consensus:* The rational plan is **"Continue at Exit 1, Exit at Exit 2."**
  2.  **The Vote:** Have them formally vote on this policy. Record it on the board.
  3.  **The Handover:** Collect all notebooks, phones, and papers. Issue each student two blank index cards and a pen. Tell them: *"You are now on the highway. You have amnesia. You do not know the vote. You do not know which exit you are at."*

  ## 3. Phase II: The Drive (25–55 mins)
  **Mechanic:** Sequential Decision with "Memory Wipe."
  *Note: Since we cannot induce real amnesia, we use procedural isolation to simulate the epistemic state.*

  1.  **Intersection 1:** Hand every student Card A labeled only **"INTERSECTION."**
      *   Instruction: *"Choose EXIT or CONTINUE. Do not talk. Do not reference the vote."*
      *   Collect cards immediately.
      *   **Filter:** Announce: *"Drivers who chose EXIT are parked. You receive your payoff now. Drivers who chose CONTINUE, remain in the vehicle."* (Those who exited sit out the next round).
  2.  **The "Wipe":** Play 30 seconds of white noise. Shuffle the remaining students' seating. Remind them: *"You have amnesia. You do not know if this is your first decision or your second. You do not recall the vote."*
  3.  **Intersection 2:** Hand remaining students Card B labeled only **"INTERSECTION."** (It looks identical to Card A).
      *   Instruction: *"Choose EXIT or CONTINUE."*
      *   Collect cards.
  4.  **Resolution:**
      *   Those who Exited on Card B: **4 Points.**
      *   Those who Continued on Card B: **1 Point.**
      *   Those who Exited on Card A: **0 Points.**
      *   Calculate Fleet Average. Distribute Bonus if applicable.

  ## 4. Phase III: The Reveal & Tension (55–70 mins)
  1.  **Reveal Scores:** Most students will likely **Continue** in Phase II (Intersection 2) because it feels safer, and many will **Continue** in Intersection 1 fearing they are already at Exit 2.
  2.  **The Dominance Trap:** Ask the students who Continued at the second intersection *why* they did it.
      *   *Expected Reasoning:* "I didn't know if I was at Exit 1 or 2. If I Exit, I might get 0. If I Continue, I might get 4 or 1. Continuing looks safer."
  3.  **The Paradox:** Point out that if everyone reasons this way *ex-post*, the Fleet Average drops to 1.0 (everyone reaches the End). The *ex-ante* plan (Avg 4.0) is abandoned by *ex-post* rational agents.

  ## 5. Debrief & Philosophical Mapping (70–90 mins)
  **Discussion Guide:**
  1.  **Ex-Ante vs. Ex-Post:** Map the "Fleet Congress" to the *planning self* and the "Driver in the Seat" to the *acting self*. Why did the acting self betray the planning self?
  2.  **The Dominance Argument:** Reconstruct the math on the board.
      *   *At the intersection:* Credence is 50/50 (due to indistinguishability).
      *   *Exit EV:* $0.5(0) + 0.5(4) = 2$.
      *   *Continue EV:* $0.5(4) + 0.5(1) = 2.5$.
      *   *Result:* Continue dominates Exit locally, even though it leads to a globally worse outcome.
  3.  **Bindingness:** Discuss why the vote didn't hold. Was it not binding enough? Or is rationality itself time-inconsistent?

  ---

  ## Instructor's Cheat Sheet: Limitations & Predictions

  ### 1. The "Honest Note" (What this activity *cannot* capture)
  You must verbally supply this during the debrief, as the game mechanics cannot fully replicate the metaphysics of the original problem.
  *   **The Limitation:** In the original AMD problem, the driver is **one person over time**. The paradox relies on the tension of *personal identity* (Why should my future self obey my past self if my future self is rational?).
  *   **The Distortion:** In this collective version, you have turned an **Intrapersonal** problem into an **Interpersonal** one. You have created a Prisoner's Dilemma where the "selves" are different people.
  *   **Why it matters:** The collective version makes the solution look like *social contracting* (we need to enforce rules on each other). The original problem is harder: it asks if a *single* rational agent can bind themselves without external enforcement.
  *   **Verdict:** The collective framing **strengthens the normative pull** (it clearly shows why binding rules are useful) but **muddies the metaphysical puzzle** (it hides the question of whether 'future me' is bound by 'past me' by making them distinct people).

  ### 2. Predictable Failure Modes (First Run)
  *   **The "Round 2" Tell:** Students will know Card B is the second exit because they survived Round 1.
      *   *Fix:* Acknowledge this openly. Tell them: *"Physically, you know this is Round 2. Philosophically, you must bracket that knowledge. Pretend the card you hold is the only information you have."* If they refuse, the game fails.
  *   **Collusion:** Students may try to signal during the "Wipe" phase.
      *   *Fix:* Enforce strict silence. Frame it as "Radio Silence on the Highway."
  *   **Payoff Confusion:** Students might think the Fleet Bonus applies individually.
      *   *Fix:* Keep the Bonus math on the board throughout.
  *   **The "50/50" Objection:** Sharp students will argue their credence of being at Exit 2 isn't 50% if everyone plans to Exit at 2 (since no one would be at Exit 2).
      *   *Response:* This is the *actual* philosophical debate (Piccione & Rubinstein vs. Aumann et al.). Tell them: *"For the sake of feeling the paradox, assume indistinguishability forces a 50/50 split. We will debate the probability calculus in the last 10 minutes."*

  ### 3. Does the Collective Framing Help?
  **Verdict:** It makes the **normative lesson clearer** but the **paradox shallower**.
  *   **Pro:** It makes the cost of time-inconsistency visible immediately (the Fleet loses points). It motivates the need for "Ulysses Contracts" (binding pre-commitment).
  *   **Con:** It allows students to offload the philosophical tension onto "coordination problems." They might say, "We just failed to coordinate," rather than "Rationality is time-inconsistent."
  *   **Instruction:** When debriefing, force them back to the individual. Ask: *"If you were the only driver in the universe, would you still feel the pull to Continue at the second intersection?"*

  ### 4. Payoff Scheme Clarity (No Cash)
  Use **"Seminar Credits"** or **"Paper Points."**
  *   Tell them the winner (highest individual score) gets to choose the reading for the next week, or gets a "Get Out of Presentation Free" card.
  *   Alternatively, keep it purely symbolic but track it on a public leaderboard. Grad students are competitive enough that public scoring works as well as money.

