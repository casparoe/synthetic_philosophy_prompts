answer: |-
  Montaigne's essay advances a critique of ethnocentric arrogance rather than strong normative relativism, so your friend's conclusion that cross-cultural moral criticism is always off-limits is textually unsupported and philosophically inconsistent with his explicit ranking of European cruelty as worse than Tupinamba rituals.

  Here is the menu of precise claims hidden within the slogan "we call barbarism whatever isn't our own practice," analyzed for textual presence, defensibility, and whether it supports your friend's conclusion.

  **1. The Trivial Psychological Claim**
  *   **The Claim:** Humans have a knee-jerk emotional reaction of disgust or fear toward unfamiliar customs, leading them to label the unfamiliar as "bad."
  *   **In the Text:** Yes. Montaigne opens by observing that everyone has their own truth and that custom shapes our perception immediately.
  *   **Defensible:** Yes, this is a robust psychological observation about in-group bias.
  *   **Gets Friend to Conclusion?** No. Acknowledging a bias exists does not mean the bias is correct, nor does it mean we are forbidden from correcting it. If I admit I am biased against spicy food, I am not forced to conclude all food is equally good; I am simply warned to check my judgment. This claim warns against hasty judgment, but does not prohibit judgment itself.

  **2. The Epistemological Custom Claim**
  *   **The Claim:** Our reason itself is constructed by our local customs, so we lack a neutral, God's-eye view from which to judge other cultures objectively.
  *   **In the Text:** Yes. Montaigne argues that reason is not natural but infused by habit, and that even Plato's laws were shaped by his specific context.
  *   **Defensible:** Partially. This is a strong hermeneutic point (we are situated), but it risks sliding into skepticism. It is defensible as a caution against arrogance, but not as a proof that truth is inaccessible.
  *   **Gets Friend to Conclusion?** No. Even if our viewpoint is situated, it does not mean all viewpoints are equally valid or that comparison is impossible. It simply means our criticism must be humble and self-aware. This supports a methodology of caution, not a prohibition on criticism.

  **3. The Strong Normative Relativism Claim**
  *   **The Claim:** Because customs differ, there is no universal moral standard; therefore, no practice can be judged as morally superior or inferior to another.
  *   **In the Text:** No. Montaigne never says the Tupinamba practices are *equal* to European practices in a moral vacuum; he argues they are often *better* according to specific virtues like courage and loyalty.
  *   **Defensible:** No. This leads to moral paralysis where one cannot condemn genocide or torture if they are "customary." It contradicts the human capacity for shared moral intuition.
  *   **Gets Friend to Conclusion?** Yes, this is the only claim that leads to your friend's conclusion that cross-cultural criticism is off-limits. However, since Montaigne does not hold this view, your friend is attributing a modern anthropological stance to a Renaissance humanist who is actually making moral comparisons.

  **4. The Immanent Critique Claim (Montaigne's Actual Position)**
  *   **The Claim:** We should use the "other" not to suspend judgment, but to reflect our own practices back to us to reveal our own barbarism more clearly.
  *   **In the Text:** Yes. The essay is structured to invert the label of "barbarian" from the Tupinamba to the Europeans.
  *   **Defensible:** Yes. This is a powerful philosophical tool (immanent critique) that uses a society's own standards against them to reveal hypocrisy.
  *   **Gets Friend to Conclusion?** No, it does the opposite. It validates cross-cultural criticism but redirects the target. It argues we *can* and *should* criticize, but we must start by criticizing ourselves using the mirror of the other.

  **The Wars of Religion Comparison**
  Your friend's omission of Montaigne's comparison to the French Wars of Religion is fatal to her reading because it introduces a universal metric of cruelty that breaks strong relativism. Montaigne explicitly describes the Tupinamba eating the dead as less horrific than Europeans torturing the living, burning people at the stake, and tearing bodies apart during religious conflicts. He writes that there is more barbarity in eating a man alive than roasting him after death, but then immediately pivots to show that Europeans are doing the former (metaphorically and literally through torture) while the Tupinamba do the latter.

  This comparison relies on a shared standard of human suffering and dignity. If strong normative relativism were true, Montaigne could not rank European torture as *worse* than Tupinamba ritual cannibalism; he would have to say they are just "different." By ranking them, he asserts that there is a scale of horror accessible to human reason regardless of culture. He is not saying "cannibalism is good"; he is saying "your torture is worse than their cannibalism, so you are the true barbarians." This requires the ability to make cross-cultural moral judgments, which directly contradicts your friend's claim that such criticism is always off-limits. Montaigne is not abolishing moral judgment; he is correcting the target of it.
