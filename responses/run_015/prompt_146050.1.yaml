prompt: |-
  I'm the on-call ethics consultant at a regional hospital and every few months I have to referee a death-determination dispute between neurology and critical care, usually with ECMO in the mix and a familly that doesn't accept brain death. I need a reusable decision procedure -- a flowchart in words with ordered tests and stop/go points -- that turns the philosophical distinction between organismal integration and irreversible loss of consciousness into steps I can run in 20 minutes before a meeting. It should say exactly what to do when brainstem reflexes are fragmentary, where it stops and hands the call to values (like religious objections to brain-death framing), and where it forces a declaration even if I know risk management will back down. Include the weird edge case where someone argues that potential future neuro-prosthetic restoration blocks declaring death -- put that in the flowchart as a confounder I have to address. Then apply it to three cases: a clean brain-death determination with donation consent; an ECMO patient with flat EEG but intact hypothalmic temperature regulation whose family insists on circulatory criterias; and a case where the procedure tells me to declare death but the attending refuses to sign for fear of litigation, so I see where my own tool breaks. Start with the actual checklist, no intro, then the cases, and flag every step that's really a judgment call dressed up as procedure. I want to see where it gives me an answer I hate.
