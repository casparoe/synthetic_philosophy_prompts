      *   View on Non-existence: Non-existence isn't a "state" someone enjoys; it's the cessation of the illusion. But the Will persists.
      *   View on Rationalism: Schopenhauer is skeptical of pure reason solving metaphysical problems. Ethics is intuitive/compassionate, not utilitarian calculus.

  3.  **Deconstruct Benatar's Asymmetry:**
