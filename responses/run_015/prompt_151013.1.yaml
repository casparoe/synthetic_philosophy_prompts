      *   *Metaphysical Issue:* Benatar assumes individual potential subjects matter metaphysically. Schopenhauer sees individuals as ephemeral manifestations of the one Will. Preventing birth doesn't stop the Will, only redirects it. However, ceasing to propagate is a step toward denying the Will.
