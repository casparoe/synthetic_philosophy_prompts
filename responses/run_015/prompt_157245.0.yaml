answer: |-
  **Project Title:** Remedial Taxonomies: Reclassifying Goodhart Effects by Intervention Strategy and Calibration Limits

  **Principal Investigator:** [Your Name], Emeritus Professor of Ecology

  **Project Summary**
  This project proposes a conceptual reorganization of Goodhart's Law and specification gaming literature. Standard taxonomies classify measurement failures by their causal mechanism (e.g., adversarial vs. extremal). However, from the perspective of a practitioner responsible for maintaining monitoring protocols, causal origin is less useful than remedial availability. This project argues that classifying failures by the intervention required to fix them—and distinguishing between epistemic proxy drift (exceeding calibration ranges) and ontological target shifting (where the measure constitutes the target)—offers a more operationally useful framework for policy and science. Over six months, I will develop this argument through conceptual analysis and three non-AI case studies, culminating in a 6000-word paper and one departmental talk.

  **Statement of Research Questions**
  The project addresses two determinate questions. First, does sorting Goodhart-type failures by the remedies actually available to a practitioner cut the cases up differently than sorting them by causal mechanism, and if so, is the remedial classification more useful for design and governance? Second, to what extent does the current literature conflate epistemic failures (where a proxy is pushed outside its calibrated range) with ontological failures (where the act of measurement alters the definition of the target itself)?

  The hypothesis is that a remedial taxonomy yields distinct categories that cross-cut causal lines. For example, two failures might both be caused by adversarial gaming, but one is fixed by rotating proxies (cheap) while the other requires abandoning the metric entirely (expensive). Furthermore, I hypothesize that a significant portion of what is labeled "gaming" is actually instrument error: optimization pressure shoving a system outside the region where the proxy was validated, rather than any corruption of the target. Distinguishing these matters because calibration errors require technical fixes, while ontological shifts require political or philosophical renegotiation of the goal.

  **Background and Gap in Existing Literature**
  Current philosophical and economic discussions of Goodhart's Law typically organize cases by what breaks the link between measure and target. Distinctions are drawn between causal pathways (the measure causes the target), regress pathways (the measure is a symptom of the target), and adversarial pathways (agents manipulate the measure). While analytically precise, this framing assumes the observer's goal is explanation. In my thirty years managing state monitoring protocols, the goal was never merely explanation; it was maintenance. When a protocol broke, knowing *why* it broke was secondary to knowing *what I could do about it* and *how much it would cost*.

  Existing positions leave this open because they treat the measure-target relationship as binary: either it holds or it fails. They rarely account for the "calibration range" familiar to instrumentalists. In field ecology, a calling count tracks frog population size only within certain density ranges; outside that range, the correlation degrades without anyone "cheating." The literature also tends to assume the target is well-defined independent of the proxy. It assumes there is a real population size out there. It does not adequately handle cases where the target is partly constituted by the measure, such as academic prestige, where pushing on citation counts changes what "prestige" means. This project fills that gap by importing instrumentation logic into social measurement theory.

  **Methodology and Timeline**
  This is a conceptual project requiring no empirical data collection, laboratory work, or advanced machine learning training. The method consists of structured conceptual analysis applied to specific case histories. The work will be conducted part-time over six months.

  *   **Months 1–2: Literature Mapping and Taxonomy Construction.** I will review standard classifications of specification gaming and measurement failure, mapping them against remedial strategies found in management and policy literature. I will draft the formal definitions for " epistemic drift" (calibration exceedance) and "ontological shift" (target constitution).
  *   **Months 3–4: Case Study Analysis.** I will apply the proposed taxonomy to three worked examples (detailed below). I will test whether the remedial classification groups these cases differently than the causal classification and whether the calibration model explains the failure better than the gaming model.
  *   **Month 5: Drafting.** I will write the 6000-word paper, integrating the taxonomy, the case analyses, and the argument for why the remedial view is superior for practitioners.
  *   **Month 6: Revision and Presentation.** I will refine the argument based on feedback from the philosophy reading group and prepare the final departmental talk.

  **Worked Examples**
  The project will rely on three detailed cases from science and policy, avoiding AI-specific examples to ensure the logic holds in traditional governance contexts.

  1.  **Conservation Payment Schemes (Nest Counts):** In this scenario, landowners are paid per verified bird nest. The causal view sees this as adversarial gaming if landowners breed birds solely for payment. The remedial view asks: can we fix this by rotating surveyors (cheap) or do we need to change the payment structure (expensive)? The calibration view suggests that at low densities, nest counts track population health, but at high densities induced by payments, the proxy breaks because "population health" implies natural carrying capacity, which is now artificially inflated. This is likely an ontological shift, not just a measurement error.
  2.  **Hospital Waiting-Time Targets:** Hospitals are penalized if patients wait longer than four hours. Staff may move patients to "assessment wards" to stop the clock. Causally, this is adversarial. Remedially, the fix requires changing the definition of "waiting" (expensive/political) rather than just auditing the clocks (cheap). This case likely fits the ontological shift category: the target "timely care" is being reconstituted as "timely processing."
  3.  **Academic Hiring (Citation Counts):** Departments use citation counts to judge impact. High pressure leads to citation clubs or salami-slicing papers. Here, the target "scientific impact" is partly constituted by the measure. Pushing the proxy changes the target. A remedial classification would note that no cheap fix exists; the metric itself is corrupting the goal. This contrasts with the frog count, where a better survey method might restore calibration.

  **Possible Conclusions and Deciding Considerations**
  The project will likely support one of three conclusions.
  1.  **The Remedial Taxonomy is Superior:** If the case studies show that remedies cluster differently than causes, I will argue that policy literature should adopt remedial classifications for practical guidance.
  2.  **The Calibration Model Explains "Non-Cheating" Failures:** If I can show that many failures occur without adversarial intent simply because optimization pressure exceeded the validation range, I will argue for a "instrumental limit" warning in protocol design.
  3.  **Ontological Cases Require Governance, Not Measurement:** If the distinction between epistemic and ontological failure holds, I will conclude that ontological cases cannot be fixed by better metrics, only by changing incentives or goals.

  The deciding consideration will be whether the remedial classification predicts the *cost* of the fix more accurately than the causal classification. If knowing the remedy tells you the cost, but knowing the cause does not, the remedial taxonomy is the useful one.

  **Risk Assessment: Conditions for Failure**
  This project would fail if the proposed taxonomy collapses back into the standard causal one. For example, if every "remedial" category maps perfectly onto a "causal" category (e.g., all adversarial cases require expensive fixes), then the new taxonomy adds no value. It would also fail if the distinction between epistemic drift and ontological shift proves untenable—for instance, if it turns out that all targets are partly constituted by their measures, making the distinction meaningless. Finally, the project would fail if I cannot articulate the "calibration range" concept clearly outside of physical instrumentation, rendering the analogy useless for social metrics. I will monitor this during Months 3 and 4; if the cases do not fit, I will pivot to a critique of the calibration analogy rather than a defense of it.

  **Scope Check and Deliverables**
  I am aware of the tendency to overextend. This project is strictly limited to conceptual analysis and existing case histories. I will not collect new data, interview practitioners, or attempt to formalize the taxonomy mathematically. I will not engage with the technical machine learning literature on specification gaming beyond general conceptual parallels. The scope is limited to three case studies; adding more would threaten the timeline.

  The final deliverable is a paper of approximately 6000 words suitable for submission to a journal in philosophy of science or science policy. Additionally, I will deliver one talk to the department summarizing the findings. The length is constrained to ensure depth over breadth; a 6000-word limit forces me to focus on the three core examples and the central taxonomy argument without drifting into broader critiques of metrics. This scope is realistic for a part-time, six-month fellowship given my background in protocol design and current engagement with the philosophy reading group.
