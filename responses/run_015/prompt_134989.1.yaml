answer: |-
  I have been turning the special composition question over in my head lately and I keep coming back to the feeling that the standard debate is stuck in a rut because we are too focused on static furniture. We argue about tables and chairs until the concepts feel worn smooth, but I think the real stress test for any theory of composition lies in dynamic, temporary collective entities rather than enduring physical objects. If we look at something like a flash mob or an ad-hoc political coalition, we get a clearer view of whether there is a stable middle ground between universalism and nihilism. The usual worry is that any restricted view of composition collapses because it seems arbitrary to say that some particles compose an object while others do not, especially when the difference is just a matter of degree. Universalists say everything composes something, nihilists say nothing does, and the restricted compositionalist tries to carve out a space for organisms and artifacts without sliding into vagueness. My suspicion is that the middle ground is only unstable if we define composition based on spatial proximity or static bonding, but it becomes robust if we anchor it to causal integration and specifically to the capacity for self-maintenance.

  When you consider a flash mob, you have a collection of individuals who are spatially proximate and share a temporary intention. They move together, they disperse together, and for that hour, they seem to act as a unit. If composition is driven by shared intentionality, then the flash mob should count as an object. But if the flash mob is an object, why isn't a crowd of people waiting for a train also an object, or why isn't the sum of the flash mob plus the pigeons flying above them an object? This is where the threat of arbitrariness looms. If we accept the flash mob as a composite object, we seem forced to accept almost any collection of things that share a loose functional role, which pushes us toward universalism. On the other hand, if we deny that the flash mob is an object, we have to explain why a human body is one. A human body is also a collection of cells that coordinate, but the coordination is far more rigid and biologically enforced. The difference cannot just be that one is biological and the other is social, because we generally accept that artificial machines can be composite objects too. The distinction needs to be metaphysical, not categorical.

  This brings us to the condition of causal integration. For restricted composition to hold up without collapsing, the parts must not just act together; they must act together to maintain the existence of the whole. In a living organism, the cells work to repair damage, regulate temperature, and sustain the structure against entropy. The causal power flows from the whole back to the parts in a feedback loop that preserves the unity. In a flash mob, the coordination is one-way or external. The individuals decide to act, and the group exists only as long as that decision holds, but the group itself does nothing to maintain the individuals or even its own structure against disruption. If a few people leave, the mob doesn't heal itself; it just degrades. This suggests that shared intentionality alone is insufficient for composition because it lacks the recursive causal glue that binds parts into a genuine unity. The middle ground remains stable only if we insist that composition requires the emergence of a new causal agent that acts to preserve its own boundaries.

  If we adopt this view, we can see why the middle ground does not have to collapse into nihilism or universalism. Nihilism fails because there are clearly entities that exhibit this kind of self-sustaining causal unity, like organisms and perhaps complex machines with feedback systems. Universalism fails because arbitrary sums like the moon and a sixpence do not engage in any joint causal activity to maintain a unified structure. The flash mob falls on the nihilist side of the line, not because it isn't real in a sociological sense, but because it does not meet the ontological threshold for being a single composite object. It is a plurality acting in concert, not a singular entity. This verdict might seem harsh to those who want to grant ontological status to social groups, but it saves the theory from vagueness. The line is drawn at the presence of internal regulatory mechanisms that distinguish the inside from the outside in a causally significant way.

  Some might argue that this is still arbitrary because there are borderline cases where self-maintenance is weak or distributed. A colony of ants or a decentralized network might blur the line. However, admitting borderline cases does not invalidate the distinction any more than the existence of twilight invalidates the difference between day and night. The core principle remains non-arbitrary because it is tied to a specific metaphysical function, namely the unification of causal powers into a single trajectory of existence. When the parts work to ensure the continuation of the whole, composition occurs. When they merely coincide or coordinate temporarily without that self-referential maintenance, no composition occurs. This allows us to say that a human exists, a table exists insofar as it is maintained by external agents who treat it as a unit, but a flash mob does not exist as an object over and above the people involved.

  So my conclusion is that restricted composition does hold up, but only if we stop looking for it in static arrangements and start looking for it in dynamic causal histories. The middle ground is inherently unstable if we try to define objects by their materials or their shapes, because those properties admit of degrees. But if we define objects by their causal autonomy and their capacity to resist entropy through internal coordination, the distinction becomes sharp enough to bear weight. We do not need to accept that every collection of particles is an object, nor do we need to deny that any are. We just need to recognize that being an object is a job description, and most collections of things, including flash mobs, simply do not do the work required to fill it. This preserves our common sense intuition that people and animals are real things while avoiding the metaphysical bloating of universalism, securing a stable position that acknowledges the reality of unity without projecting it onto every coincidence of matter.
