answer: |-
  No single established term perfectly captures this phenomenological middle ground, so I propose **"Negotiated Extension"** to define the state where cognitive authority is dynamically shared without claiming ontological integration.

  Clark and Chalmers' Extended Mind Hypothesis (EMH) relies on the criterion of transparency: the external resource must be so seamlessly integrated that it is treated with the same unconscious trust as biological memory (e.g., Otto's notebook). LLMs fail this test because they remain opaque interlocutors that require active verification and prompt engineering, preventing the "invisibility" required for literal extension. Conversely, traditional tool-use models assume a clear subject-object distinction where the tool has no agency and the user bears full responsibility for the output. LLMs disrupt this by simulating agency, generating rationale, and inviting collaboration, which leads users to adopt a social stance toward the software.

  "Distributed Cognition" comes closest by analyzing the system as a whole, but it typically focuses on group dynamics or complex socio-technical environments rather than the individual's phenomenological experience of a blurred cognitive boundary. It describes the flow of information but not the user's specific attribution of shared reasoning ("our output"). "Negotiated Extension" fills this gap by emphasizing that the boundary is not fixed by hardware or functional equivalence, but is constantly recalibrated through dialogue, trust, and critique.

  Boundary cases clarify the distinction:
  1.  **Pure Tool (Calculator):** The user inputs data and accepts the result based on known algorithms; there is no shared reasoning, only verification. If the calculator errors, the user blames the device, not the partnership.
  2.  **Literal Extension (Neural Implant/OT's Notebook):** The user accesses the information immediately without questioning the source's reliability in the moment; the boundary is functionally erased.
  3.  **Negotiated Extension (LLM):** The user challenges the model's draft, the model refines the logic, and the user defends the final output as a co-constructed product. The boundary is porous and maintained through active negotiation rather than fixed integration or distinct separation.
