answer: |-
  **Problem Set: Probability Kinematics and the Source of Evidence**

  **Context:** Let $H$ be the hypothesis that a sample is contaminated. Let $E$ be the proposition that a monitor reading is positive. Your prior probabilities are $P(H) = 0.5$, $P(E|H) = 0.8$, and $P(E|\neg H) = 0.2$. Consequently, your prior marginal $P(E) = 0.5$. You undergo an experience that shifts your confidence in $E$ to $P^*(E) = 0.9$.

  **(a) Calculation (5 marks)**
  Using Jeffrey's rule (probability kinematics), calculate your new probability for $H$, $P^*(H)$. Show the intermediate conditional probabilities derived from the prior distribution.

  **(b) The Source Blindness (5 marks)**
  Consider two distinct causes for this shift. Case 1: You glimpse the display in poor light (sensory uncertainty). Case 2: You read a logbook entry stating the run used a 'high-gain' setting, which is known to occur more often with hot samples (correlated evidence). The rule yields $0.74$ in both cases. Explain why the rule is blind to this distinction. Is this a defect, or does it reflect a specific assumption about what the shift in $E$ signifies?

  **(c) The 'Cause' Repair (5 marks)**
  Suppose we modify the rule: rigidity holds only relative to a proposition $C$ describing the cause of the shift, of which you become certain. If $C$ is the logbook entry in Case 2, does updating on $C$ collapse into ordinary conditioning? Does this repair solve the problem in Case 2 without breaking Case 1?

  **(d) Minimum Information (5 marks)**
  Jeffrey's rule is often justified as the unique update that minimizes information gain subject to the new marginals. Does this justification resolve the worry in (b)? If the source of the shift implies constraints beyond the new marginal of $E$, does the minimum-information principle detect them?

  ***

  **Model Answer**

  **(a)**
  First, recover the old conditionals using Bayes' theorem.
  $P(H|E) = \frac{P(E|H)P(H)}{P(E)} = \frac{0.8 \times 0.5}{0.5} = 0.8$.
  $P(H|\neg E) = \frac{P(\neg E|H)P(H)}{P(\neg E)} = \frac{0.2 \times 0.5}{0.5} = 0.2$.
  Jeffrey's rule preserves these conditionals (rigidity). The new marginal is $P^*(H) = P(H|E)P^*(E) + P(H|\neg E)P^*(\neg E)$.
  Substituting values: $P^*(H) = 0.8(0.9) + 0.2(0.1) = 0.72 + 0.02 = 0.74$.

  **(b)**
  The rule takes only the partition $\{E, \neg E\}$ and the new marginals as input. It assumes the *only* information received is the change in confidence over this partition. In Case 1 (lighting), the sensory experience bears on $H$ only via $E$; the shift in $E$ screens off the experience from $H$. Rigidity holds. In Case 2 (logbook), the logbook entry ($L$) likely bears on $H$ directly, independent of $E$ (since gain settings correlate with hot samples). By updating only on $E$, we ignore the direct link between $L$ and $H$. The shared answer is a defect in Case 2 because rigidity is violated: the mechanism producing the shift carries extra information about $H$ not captured by $P^*(E)$.

  **(c)**
  If you become certain of the cause $C$ (the logbook entry), updating on $C$ is ordinary conditioning: $P_{new}(H) = P(H|C)$. This is not Jeffrey conditioning on $E$; it is standard conditioning on a richer proposition. This solves Case 2 because $P(H|C)$ captures the direct correlation. However, it breaks Case 1. In the sensory case, there is no certain proposition $C$ (like "I saw a flash") that screens off the uncertainty; the uncertainty *is* the evidence. Requiring certainty of a cause forces all learning into standard conditioning, which cannot model inconclusive sensory experience. The repair generalizes nothing; it merely shifts the domain where conditioning applies.

  **(d)**
  The minimum-information justification selects the distribution closest to the prior (by cross-entropy) that satisfies the new marginal constraints. This mathematically derives Jeffrey's rule. However, it assumes the constraints provided are the *exhaustive* list of new information. If the source of the shift implies additional constraints (e.g., in Case 2, that $H$ and the cause are correlated), and these are not included in the input, the principle cannot detect them. It minimizes information gain relative to the *stated* constraints, not the *actual* information received. Thus, it formalizes the source-blindness rather than resolving it. It guarantees consistency with the inputs, not correctness relative to the world.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **Part (a): 5 Marks**
  *   **3 Marks:** Correct derivation of $P(H|E) = 0.8$ and $P(H|\neg E) = 0.2$.
  *   **2 Marks:** Correct final calculation ($0.74$).
  *   *First-class move:* Explicitly noting $P(\neg E) = 0.5$ before calculating the second conditional.
  *   *Common mistake:* Confusing likelihoods $P(E|H)$ with posteriors $P(H|E)$ and using 0.8/0.2 directly without derivation.

  **Part (b): 5 Marks**
  *   **3 Marks:** Identifying that Case 2 violates rigidity because the cause correlates with $H$ independently of $E$.
  *   **2 Marks:** Stating that the rule assumes the shift exhausts the new information (screening off).
  *   *First-class move:* Distinguishing that Case 1 satisfies screening-off while Case 2 does not.
  *   *Common mistake:* Claiming the rule is always defective because it ignores psychology, rather than probabilistic relevance.

  **Part (c): 5 Marks**
  *   **3 Marks:** Recognizing that conditioning on certain $C$ is standard conditioning, not Jeffrey conditioning.
  *   **2 Marks:** Noting this fails Case 1 where no certain cause exists (sensory uncertainty).
  *   *First-class move:* Explicitly stating the repair collapses the generalization back into standard conditioning.
  *   *Common mistake:* Arguing that we can always find a certain $C$ for sensory experience (e.g., "I had an experience").

  **Part (d): 5 Marks**
  *   **3 Marks:** Explaining that minimum information is relative to stated constraints only.
  *   **2 Marks:** Concluding it formalizes the blindness rather than fixing it.
  *   *First-class move:* Using the phrase "exhaustive list of constraints" to define the limit of the principle.
  *   *Common mistake:* Suggesting minimum information automatically accounts for hidden correlations.
