  9.  **Final Polish:** Ensure the tone is academic but sharp. Use Kantian terminology correctly (*Recht*, *Besuchsrecht*, *Völkerbund*).

  *(Self-Correction on (5)):* Does nuclear deterrence *require* standing armies in Kant's sense? Kant opposed standing armies because they threaten other states and drain resources. Nuclear weapons are the ultimate standing threat. The user admits this. The tension with (1) is that nuclear command is inherently non-deliberative. I need to emphasize that.

  *(Self-Correction on (3)):* Kant's hospitality is a right to *present oneself*, not to be *accepted*. Making it a right to *sanctuary* transforms it. This is the biggest departure from Kant. I need to highlight that this moves from *Right* to *Ethics*.

