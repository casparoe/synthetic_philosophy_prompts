  Therefore, our default stance must be refusal. We do not fund crime. However, we must acknowledge reality. If systems controlling life-support or ICU monitoring are locked and patients will die within hours, we reserve the right to pay. This exception requires unanimous approval from the CEO, CMO, and Legal Counsel during the incident. This high bar ensures payment is a last resort, not a convenience.

  **Strongest Objection:** Security experts argue that any exception destroys deterrence. Attackers know hospitals value life, so they will target ICU systems specifically to force the exception, rendering the policy useless. They are right. A conditional policy is weaker than an unconditional one. However, an unconditional policy that demands patient deaths is morally indefensible for our organization. We must accept the increased risk to avoid the moral hazard of valuing policy over people.

