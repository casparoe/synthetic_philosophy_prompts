      *Key Insight:* Moore's Paradox is usually about a momentary glitch in rationality. Stevens represents a *sustained* Moore's Paradox. It's a "life-sized" paradox. This challenges the philosophical view that such states are unstable and must collapse. Stevens shows they can be stable for a lifetime.

