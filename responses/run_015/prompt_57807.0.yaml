answer: |-
  1. **Imperceptible Harm Recognition**
     *Requirement:* The account must attribute moral significance to actions that cause actual harm even if the effect is imperceptible to observers.
     *Reasoning:* In **Gradual Reservoir**, every bucket lowers crop yield linearly. An adequate account cannot excuse harm merely because it is below the threshold of perception, preserving the distinction between actual consequences and expected consequences by acknowledging actual, albeit tiny, causal impacts.
     *Status:* Non-negotiable for adequacy.

  2. **Probabilistic Risk Accounting**
     *Requirement:* The account must assign responsibility based on risk imposition when actual harm is uncertain but probabilistically linked to the action.
     *Reasoning:* In **Buffer Order**, a purchase rarely triggers an order but raises the probability. Responsibility must track expected harm rather than just actual outcomes, preserving the distinction between actual consequences and expected consequences under conditions of uncertainty.
     *Status:* Non-negotiable for adequacy.

  3. **Structural Discrimination**
     *Requirement:* The account must distinguish between linear aggregation of harm and threshold-based triggers.
     *Reasoning:* **Gradual Reservoir** involves linear harm, whereas **Buffer Order** involves a threshold mechanism. Moral evaluation should reflect these different causal structures, preserving the distinction between linear and threshold-like structures of harm.
     *Status:* Non-negotiable for adequacy.

  4. **Non-Pivotal Responsibility**
     *Requirement:* The account must allow for moral responsibility or duty even when the individual action has no decisive causal impact on the outcome.
     *Reasoning:* In **Landslide Election**, a single vote is not decisive. An adequate account must explain why voting may still be required or meaningful, preserving the distinction between causing additional harm and bearing moral responsibility for participation.
     *Status:* Commitment belonging to a particular moral outlook (e.g., deontology vs. strict consequentialism).

  5. **Collective Rationality Distinction**
     *Requirement:* The account must distinguish between what is rational for an individual to do in isolation and what is best for the collective.
     *Reasoning:* In all three cases, individual cost-benefit analysis (e.g., saving time, money, or effort) conflicts with the collective good (crop yield, animal welfare, democratic outcome). The account must preserve the distinction between what is individually rational and what would be collectively best.
     *Status:* Non-negotiable for adequacy.

  6. **Expressive Value Accommodation**
     *Requirement:* The account must recognize non-consequentialist value in actions that express solidarity, disregard, or civic standing.
     *Reasoning:* In **Landslide Election**, voting has expressive and coordination-related aspects independent of the vote count. This preserves the distinction between causal contribution and complicity or expression of disregard.
     *Status:* Commitment belonging to a particular moral outlook.

  7. **Epistemic Feasibility**
     *Requirement:* The account must be action-guiding given that agents lack perfect knowledge of the collective state (e.g., current buffer level or exact election margin).
     *Reasoning:* Agents in **Buffer Order** and **Landslide Election** act under uncertainty regarding thresholds and margins. Responsibility assessments must remain consistent with background facts about decision making under uncertainty.
     *Status:* Non-negotiable for adequacy.

  8. **Complicity Differentiation**
     *Requirement:* The account must distinguish between directly causing a specific unit of harm and participating in a harmful practice or system.
     *Reasoning:* In **Buffer Order**, a buyer may not cause a specific chicken's death but joins the demand chain. This preserves the distinction between causal contribution and complicity or expression of disregard.
     *Status:* Non-negotiable for adequacy.

  There is a significant tension between **Structural Discrimination** and **Epistemic Feasibility**. To satisfy Structural Discrimination, an agent must know whether they are operating in a linear system (like the Reservoir) or a threshold system (like the Buffer). However, Epistemic Feasibility requires that moral demands be applicable despite limited knowledge. In real-world scenarios like climate change or supply chains, agents rarely know the exact causal structure (linear vs. tipping point) or the current state of the buffer. Demanding that agents distinguish these structures to assign responsibility correctly may violate the constraint that moral rules must be usable by non-omniscient actors.

  A **strict actual-difference view** fails significantly against this list. It violates Imperceptible Harm Recognition by denying wrongness in Gradual Reservoir cases where no perceptible difference is made. It also fails Non-Pivotal Responsibility, rendering voting in Landslide Election morally neutral since no single vote changes the outcome. It handles Structural Discrimination poorly by focusing only on actual outcomes rather than causal structures.

  An **expected-consequence view** performs well on Imperceptible Harm Recognition and Probabilistic Risk Accounting, as it aggregates tiny harms and risks in Gradual Reservoir and Buffer Order. However, it struggles with Non-Pivotal Responsibility and Expressive Value Accommodation; in Landslide Election, the expected utility of voting is often too low to justify the cost unless expressive value is quantified, which strains the view's consequentialist foundations.

  A **universalizability or fairness-based view** excels at Non-Pivotal Responsibility and Collective Rationality Distinction, framing voting and restraint as duties of fairness regardless of impact. It handles Gradual Reservoir well via free-riding arguments. However, it faces challenges with Probabilistic Risk Accounting and Structural Discrimination, as universalizability tests are less sensitive to the specific probabilistic mechanics of the Buffer Order case compared to consequentialist calculations.

  A **complicity or expressive view** succeeds on Non-Pivotal Responsibility and Complicity Differentiation, capturing the wrongness of participating in harmful systems like factory farming regardless of causal pivotality. It also accommodates Expressive Value Accommodation for voting. However, it may underweight Imperceptible Harm Recognition in linear cases like Gradual Reservoir, potentially focusing too much on the symbolic act of participation rather than the actual cumulative harm caused.

  Verdict: Structural Discrimination
