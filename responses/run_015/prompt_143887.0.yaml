answer: |-
  To facilitate your intervention, here is a disambiguation menu of the slogan **"If there's no physical impact, there's no real harm."** 

  This slogan is philosophically unstable because it conflates four distinct dimensions: **Ontology** (what exists), **Causation** (what affects what), **Phenomenology** (what it feels like), and **Normativity** (what matters morally). Your classmate likely slides between these to make the argument appear robust when it is actually shifting ground.

  Below are five precise readings of the thesis, evaluated by their logical status and their ability to dismiss both the **Psychological Objection** (stalking) and the **Economic Objection** (assets).

  ### Menu of Theses

  #### 1. The Semantic Stipulation
  *   **The Claim:** "We define the term 'real harm' exclusively as 'physical damage to biological tissue or material property.'"
  *   **Dimension:** **Semantic/Linguistic.** This is a proposal for how to use words, not a claim about the world.
  *   **Status:** **Trivial (True by definition).** It cannot be false, but it cannot be interesting. It begs the question by defining away the counter-examples.
  *   **Dismisses Both Objections?** **Yes.** By fiat, psychological injury and economic loss are not "real harm" because the definition excludes them.
  *   **Casual Intent?** **Low.** Casual speakers usually believe they are describing reality, not merely defining terms. If challenged, they rarely admit, "I'm just stipulating a definition."

  #### 2. The Ontological Eliminator
  *   **The Claim:** "Virtual objects and interactions do not exist; therefore, they cannot be the subjects or instruments of harm."
  *   **Dimension:** **Metaphysical/Ontological.** Claims virtual entities lack being.
  *   **Status:** **False / Metaphysically Ambitious.** It is difficult to maintain that code, server states, and digital contracts do not exist in any sense. They exist as institutional facts (like money or marriage).
  *   **Dismisses Both Objections?** **Yes.** If the stalking didn't "really" happen and the assets don't "really" exist, no harm could have occurred.
  *   **Casual Intent?** **High.** This is often the "It's just a game" intuition. However, it collapses immediately when reminded that the servers and contracts are physically real.

  #### 3. The Causal Bottleneck
  *   **The Claim:** "Virtual events cannot initiate causal chains that result in physical changes in the real world (e.g., neurochemical states or resource availability)."
  *   **Dimension:** **Causal/Material.** Claims a firewall between the virtual and the physical.
  *   **Status:** **Empirically False.** Virtual stalking causes cortisol spikes (physical brain states). Destroying assets triggers contract law, which moves physical resources (money/food).
  *   **Dismisses Both Objections?** **No.** This reading is vulnerable to immediate empirical falsification. The psychological objection proves the causal chain to the brain; the economic objection proves the causal chain to material resources.
  *   **Casual Intent?** **Medium.** Speakers often forget that brains and banks are physical systems. They intend this, but they are mistaken about the facts.

  #### 4. Normative Somaticism
  *   **The Claim:** "Only physical pain or bodily restriction has moral significance; psychological distress and financial loss are morally negligible unless they manifest somatically."
  *   **Dimension:** **Normative/Ethical.** Claims that *what matters* is restricted to the somatic.
  *   **Status:** **Substantive and Debatable.** This is a defensible ethical position (similar to strict hedonism or materialism), but it is not a fact. It requires ethical argumentation to defend why mental anguish doesn't count.
  *   **Dismisses Both Objections?** **Yes.** It grants that the harm *occurs* (causally) but denies it *matters* (normatively).
  *   **Casual Intent?** **High.** This is usually the underlying moral intuition: "No blood, no foul."

  #### 5. The Directness Requirement
  *   **The Claim:** "Harm is only 'real' if the causal mechanism is direct physical force, not mediated by social agreement or code."
  *   **Dimension:** **Ambiguous (Causal/Normative Hybrid).** Distinguishes between "hitting someone" vs. "triggering a script that hurts someone."
  *   **Status:** **Ambiguous / Vague.** What counts as "direct"? Is a poison dart direct? Is a signed contract direct? This relies on a fuzzy intuition about proximity.
  *   **Dismisses Both Objections?** **Yes (Provisionally).** It treats virtual mediation as a buffer that dilutes responsibility or reality.
  *   **Casual Intent?** **Very High.** This captures the "it's not personal, it's digital" vibe.

  ---

  ### Analysis of the "Slide"
  Your classmate's argument works only because they slide between these readings depending on which objection is raised.

  1.  **Against the Stalking Objection:** They likely rely on **Reading 4 (Normative Somaticism)**. They acknowledge you feel bad but imply, "It's all in your head, so it's not *real* harm." They treat psychological pain as ontologically secondary to physical pain.
  2.  **Against the Economic Objection:** They likely switch to **Reading 2 (Ontological Eliminator)** or **Reading 5 (Directness)**. They treat the virtual asset as "fake" or the destruction as "indirect," ignoring that the contract is a real-world legal fact.

  **The Contradiction:** If they accept the Economic Objection is invalid because virtual assets aren't "physical" (Reading 2), they must also admit virtual stalking isn't "physical." But if they admit the stalking causes psychological injury, they have admitted a causal link to the physical brain (refuting Reading 3). They cannot consistently hold that virtual assets have no reality while virtual actions have no physical effects, because the assets are maintained by the same physical infrastructure that transmits the actions.

  ### Strategic Recommendation for the Session
  Do not attack the slogan directly. Instead, force a **selection from the menu**.

  **Proposed Intervention:**
  > "I think we need to disambiguate your slogan to see if it holds. Are you making a **semantic claim** (that we simply won't *call* it harm), a **metaphysical claim** (that virtual things don't exist), or a **normative claim** (that only bodily pain matters)?
  >
  > *   If it's **semantic**, you're begging the question against the victims.
  > *   If it's **metaphysical**, you're ignoring that servers and contracts are physical.
  > *   If it's **normative**, you're arguing that psychological torture doesn't matter morally unless it leaves a bruise.
  >
  > Which one are you defending? Because the reading that dismisses the stalking case (Normative Somaticism) is different from the one that dismisses the asset case (Ontological Eliminator), and they aren't compatible."

  This forces the student to commit to a specific thesis, exposing the weakness of the one they choose. Most casual speakers, when forced to choose **Normative Somaticism**, will realize how unpopular the position is (i.e., that emotional trauma doesn't count as harm).
