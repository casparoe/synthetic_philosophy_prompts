answer: |-
  # Simulation Design: "The Genesis Protocol"
  **Course:** Advanced Undergraduate Seminar (Decision Theory / Social Philosophy)  
  **Class Size:** 16 Students  
  **Duration:** 75 Minutes  
  **Materials:** 16 sealed envelopes, 100 paper tokens (or points on a board), whiteboard/markers, printed role cards.

  ## 1. Conceptual Core
  This simulation models the **Unilateralist's Curse** as a multi-round Public Bad game with heterogeneous capability. The core tension is not merely "selfishness vs. altruism," but the rational calculation that *my* restraint is futile (or personally costly) if others are likely to act, combined with the incentive to secure private benefits before the "window closes."

  The specific dynamic targeted is: **Individual Rationality $\rightarrow$ Over-Activation $\rightarrow$ Collective Harm.**
  The scaling mechanic demonstrates that **more capable agents = worse collective outcome**, even if no individual becomes more "selfish."

  ## 2. Setup and Roles (10 Minutes)
  **The Narrative:** The class is a consortium of independent research labs. A new technology ("The Protocol") is available.
  *   **Activating** the Protocol yields a private breakthrough (prestige/funding).
  *   **However**, every Activation releases radiation (collective harm).
  *   **Constraint:** Not every lab has the technical capacity to Activate.

  **Distribution:**
  1.  Hand each student a sealed envelope and 5 paper tokens (starting endowment).
  2.  **Envelopes:** Contain a slip saying either **"CAPABLE"** or **"INCAPABLE."**
      *   *Round 1:* 3 Capable, 13 Incapable.
      *   *Round 2:* 8 Capable, 8 Incapable.
      *   *Round 3:* 16 Capable, 0 Incapable.
  3.  **Secrecy:** Students must not show their slip to anyone. This creates the epistemic uncertainty central to the curse (I know I can act; I don't know if *you* can).

  **The Payoff Structure (Visible on Whiteboard):**
  *   **Decision:** Simultaneous choice to **ACTIVATE** or **RESTRAIN**.
  *   **Private Benefit:** If you choose ACTIVATE *and* are CAPABLE, you gain **+20 Tokens**. (Incapable agents who try gain 0).
  *   **Public Cost:** For *every* successful Activation in the round, **ALL 16 students lose 3 Tokens**.
  *   **Net Payoff Calculation:**
      *   *Activator (Capable):* $20 - (3 \times \text{Total Activations})$
      *   *Restrainer (or Incapable):* $0 - (3 \times \text{Total Activations})$

  **The Logic:**
  *   **Individual Incentive:** If I am Capable, my marginal gain from Activating is +20. My marginal contribution to the public cost is 3. Since $20 > 3$, it is *always* individually rational to Activate, regardless of what others do.
  *   **Collective Optimum:** If 0 people Activate, everyone keeps their endowment. If 1 person Activates, the group loses $48$ tokens total ($16 \times 3$) while one person gains 20. Net social loss.
  *   **The Curse:** As the number of Capable agents rises, the probability of the "0 Activation" equilibrium drops to near zero, guaranteeing collective loss.

  ## 3. Gameplay Procedure (45 Minutes)
  *Facilitator Note: Do not explain the Nash Equilibrium. Do not explain the "Curse." Only explain the rules.*

  **Round 1: Scarcity (15 Minutes)**
  1.  **Distribution:** 3 Capable envelopes.
  2.  **Coordination Phase (3 mins):** Allow open discussion. Students may make promises ("I will restrain if you do").
  3.  **Decision Phase (2 mins):** Students write "ACT" or "REST" on a slip of paper, fold it.
  4.  **Reveal & Pay:** Collect slips. Reveal how many ACTs occurred. Distribute/collect tokens. Update board.
  5.  **Silent Reflection (1 min):** Ask them to note how they felt about the agreements made.

  **Round 2: Proliferation (15 Minutes)**
  1.  **Distribution:** 8 Capable envelopes. (Collect old envelopes, shuffle, redistribute).
  2.  **Coordination Phase (3 mins):** Allow discussion.
  3.  **Decision Phase:** Same as Round 1.
  4.  **Reveal & Pay:** Tally results.
  5.  **Observation:** Point out the token totals on the board. Ask: "Did the group wealth increase or decrease compared to Round 1?"

  **Round 3: Universality (15 Minutes)**
  1.  **Distribution:** 16 Capable envelopes.
  2.  **Coordination Phase (3 mins):** Allow discussion.
  3.  **Decision Phase:** Same as Round 1.
  4.  **Reveal & Pay:** Tally results.
  5.  **Final Tally:** Count individual token stacks.

  ## 4. Structured Debrief (20 Minutes)
  *Do not lecture immediately. Draw the theory out of their experience.*

  **Phase 1: The Phenomenology of Defection (5 mins)**
  *   **Ask:** "In Round 1, did anyone promise to Restrain and then Activate? Why?"
  *   **Target Insight:** Students will admit they feared others would defect. This maps to the **lack of credible commitment**.
  *   **Ask:** "In Round 3, did anyone feel *guilty* about Activating?"
  *   **Target Insight:** Most will say no. They felt *compelled*. This maps to **individual rationality**. "If I didn't do it, I'd be the sucker who restrained while others profited."

  **Phase 2: Mapping the Curse (10 mins)**
  Draw the payoff matrix on the board based on their actual data.
  *   **Preference Ordering:** Elicit their ranking.
      1.  I Act, Others Restrain (Best for me).
      2.  Everyone Restrains (Good for group, okay for me).
      3.  Everyone Acts (Bad for me, worst for group).
      4.  I Restrain, Others Act (Worst for me).
  *   **The Scaling Effect:** Highlight Round 1 vs. Round 3.
      *   *Facilitator Prompt:* "In Round 1, restraint was possible. In Round 3, it was mathematically improbable. Did anyone become more 'selfish' between Round 1 and 3?"
      *   *Point:* No. The *structure* changed. Increasing the number of capable agents ($N$) increased the probability of the worst outcome without changing individual incentives. This is the **Unilateralist's Curse**: the capacity for unilateral action scales faster than the capacity for coordination.

  **Phase 3: Theoretical Connection (5 mins)**
  *   Introduce the term **Unilateralist's Curse** (Bostrom, Sandberg, & Öhman).
  *   Connect the simulation to real-world examples (e.g., geoengineering, AI release, gene drives).
  *   **Key Takeaway:** The problem is not moral failure; it is the absence of a mechanism to convert individual rationality into collective rationality when unilateral capability is high.

  ## 5. Predicted Failure Modes & Facilitator Responses
  *Honest prediction of classroom dynamics:*

  **Failure Mode 1: The "Moralizing" Collapse (Round 2)**
  *   *Prediction:* A student will stand up in the Coordination Phase and say, "We all need to just agree to Restrain. It's the right thing to do." The class will agree verbally. In the Decision Phase, 4+ students will Activate anyway.
  *   *Why:* The incentive (+20 vs -3 cost share) is too high. Talk is "cheap."
  *   *Facilitator Handling:* Do not scold. In the debrief, ask the "Moralizer": "Did you believe the promises?" Then ask the "Defectors": "Did you believe the promises?" The gap between *belief* and *trust* is the lesson.

  **Failure Mode 2: The "Spite" Player**
  *   *Prediction:* A student realizes the game is about points and decides to Activate every time just to see the group fail, regardless of capability.
  *   *Facilitator Handling:* Incorporate this into the debrief as "Uncertainty about Preferences." In the real world, we don't know if other agents are rational maximizers or malicious. This worsens the curse.

  **Failure Mode 3: Perfect Coordination (Round 1)**
  *   *Prediction:* In Round 1, with only 3 capable agents, they might identify each other (via subtle cues) and agree that *one* person Acts to "take the hit" while others Restrain, or all Restrain.
  *   *Facilitator Handling:* If they succeed too well, increase the stakes in Round 2 verbally ("Imagine the funding is double"). If they still coordinate, point out that this relies on *small group dynamics* which break down at global scale (Round 3).

  ## 6. Limitations of the Simulation
  *Be frank about what the classroom version cannot reproduce.*

  1.  **Infinite Horizon / Reputation:** In the game, rounds are discrete and end. In reality, agents interact repeatedly. Reputation *could* solve the curse, but the simulation shows that when stakes are high enough (or anonymity is preserved), reputation fails. *Facilitator Note:* Mention that in the real world, anonymity (e.g., anonymous code release) recreates the one-shot game dynamic.
  2.  **Heterogeneous Valuation:** In the game, everyone values the +20 equally. In reality, the Unilateralist's Curse is often driven by *disagreement* about the good. (e.g., "I think this AI is safe, you think it's dangerous"). The simulation assumes common knowledge of harm, which makes the curse *easier* to spot than in reality where the harm is disputed.
  3.  **Communication Channels:** Here, students can talk face-to-face. Real unilateralists are often globally distributed and cannot verify agreements. The fact that they *still* fail to coordinate despite face-to-face contact underscores the severity of the incentive structure.

  ## 7. Closing Argument (The "Supply" in Closing Minutes)
  Since the simulation assumes common knowledge of harm (everyone sees the -3 cost), you must explicitly state in the final 5 minutes:
  > "In this game, you all knew the cost. In the real Unilateralist's Curse, the hardest part is that the Activator often believes they are *saving* the world. They don't see the -3 cost; they see a +100 benefit for humanity. When you combine *epistemic disagreement* with *unilateral capability*, the pressure to act becomes almost irresistible. The simulation showed you the structure; reality adds the conviction that makes breaking the structure feel like a moral duty."
