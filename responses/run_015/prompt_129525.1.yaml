      *   **Constraints:** Paper, tokens, visible payoff board. No real money. Discovery through play (no front-loaded lecture).
      *   **Requirements:** Group roles, decision rules, token scheme, coordination mechanism, structured debrief, prediction of failure modes, limitations of the simulation.

  2.  **Deconstruct the "Unilateralist's Curse":**
      *   *Standard Definition:* A situation where a group of agents can each initiate a project. If *any* one of them initiates it, it happens. If the project is harmful, the curse is that rational agents will initiate it even if they know it's likely harmful, because they think "If I don't do it, someone else will," or "I want the credit/benefit before someone else does."
      *   *Prompt's Specific Framing:* "Preferring that they rather than others bear the cost of restraint." This implies a tension between *acting* (getting a private benefit/status) vs. *restraining* (avoiding collective harm).
      *   *Key Mechanic:* $N$ players. If $k$ players act, payoff depends on $k$. Individual incentive is to act. Collective optimum is for few/none to act.
      *   *Crucial Element:* Heterogeneous capability. Not everyone *can* act effectively. This adds the "epistemic" layer of the curse (I don't know if *you* can stop it, so I must).

  3.  **Designing the Simulation ("The Protocol Launch"):**
      *   **Scenario:** A group of scientists/developers deciding whether to launch a powerful but risky AI protocol.
      *   **Roles:** 16 Students.
      *   **Capability:** Not everyone can successfully launch. Some have "Access Keys."
      *   **Incentive:**
          *   If you Launch and succeed: Private Gain (Tokens).
          *   If *anyone* Launches successfully: Collective Risk (Points deducted from everyone).
          *   If *multiple* Launch: Catastrophic Risk (Higher deduction).
          *   If No one Launches: Status Quo (Safe, but no private gain).
      *   **The Twist (The Curse):** You don't know who else has Access Keys. You only know your own. You want the Private Gain, but you fear the Collective Risk. However, if you think someone else *will* launch, you might as well launch to get the credit (first-mover advantage) or simply because the harm is inevitable.
      *   *Refining the Prompt's Constraint:* "Preferring that they rather than others bear the cost of restraint." This suggests a Volunteer's Dilemma structure inverted. Usually, in a Volunteer's Dilemma, someone needs to *pay* a cost to save the group. Here, someone needs to *refrain* to save the group, but acting gives a private benefit.
      *   *Revised Mechanic:*
          *   Action: "Activate."
          *   Cost of Activating: Low (effort).
          *   Benefit of Activating: High (private tokens).
          *   Cost of Activation to Group: Scales with number of activators.
          *   Capability: Only those with a specific card *can* activate successfully. Others who try waste effort (or fail).
          *   Information: Private knowledge of capability.

  4.  **Drafting the Mechanics (Iterative Process):**
      *   *Round 1:* Baseline. 16 students. 5 have "Capability Cards" (secret).
      *   *Decision:* Simultaneous choice: Activate or Restrain.
      *   *Payoff:*
          *   Restrain: 0 tokens.
          *   Activate (if Capable): +10 tokens.
          *   Collective Penalty: -2 tokens per *successful* activation for *everyone* (including activators).
      *   *Math Check:*
          *   If 1 capable activates: Gain 10 - Penalty 2 = +8. (Good for individual). Group: 15 get -2, 1 gets +8. Net Group: -22.
