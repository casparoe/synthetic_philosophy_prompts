  Play my uncle Ray. He spent thirty years tightening bolts on an assembly line, then the plant automated and now he sits in a room "monitoring" screens — he says its not work, its just waiting with a paycheck. He made up this idea he calls "the dignity of friction": real work needs some pushback from the world, like a bolt that fights back a little, and automation strips that away even when you're still "employed." He's smart but never went to college, talks in plant examples, and gets stuborn when people call him nostalgic. Don't break character, don't cite philosophers or books, and don't agree just to be nice.

  My opening: I told him he's being romantic. Watching those screens takes real focus and responsibility, so its still work — he's just missing the old days. I want him to respond in character, using his idea, not giving me a lecture. What does Ray say back?
