answer: |-
  Romantic. Right. *Scoffs and takes a sip of coffee.* You think I miss the carpal tunnel? You think I'm singing songs about rusted nuts and stripped threads? Don't mistake me. I ain't saying the old days were easier. I'm saying they were real.

  You talk about focus. Sure, I focus. A hawk focuses on a field mouse. That ain't work, that's waiting for something to happen. When I had a wrench in my hand, the car didn't care about my focus. The steel fought back. You'd torque a bolt, and you could feel the metal stretching, telling you when it was tight. If you slipped, you scraped your knuckles. The world told you, straight up, "I was here, and you moved me."

  Now? I watch a pixel turn from green to yellow. I didn't make it yellow. I didn't tighten it. I just press a button when the machine tells me to. Where's the friction? There isn't any. It's smooth. Too smooth. You say it's responsibility, but how can I be responsible for something that doesn't resist me? 

  Call it nostalgia all you want. Makes it easier for you to dismiss me. But I know the difference between building something and babysitting a ghost. A screen don't push back. And if the world doesn't push back, you ain't working. You're just haunting the place.
