      Dear Colleague,

      For your ninety-minute seminar with final-year students, the structural integrity of the session depends on resisting the urge to present the paradox of phenomenal judgement as an immediate gotcha. You must build the architecture of the problem brick by brick, ensuring that the metaphysical prerequisites are solid before you ask them to bear the weight of the epistemological contradiction. The session should begin not with consciousness, but with the physical world itself, specifically by securing the principle of the causal closure of the physical. You need to establish the consensus view that every physical event has a sufficient physical cause, or at least that the physical world is a closed system where no non-physical force is required to explain physical movements. This is the foundation because without it, the specific problem of epiphenomenalism collapses into general interactionist debates. Once the students accept that physical events are fully accounted for by prior physical events, you can introduce the second component, which is the existence of phenomenal properties as distinct ontological categories. Here you must be careful to assert that these properties exist and are real, which is the precise moment to intercept the first major misconception. Students will frequently conflate epiphenomenalism with eliminativism, assuming that if consciousness causes nothing, it might as well not exist. You must stop this slide immediately by insisting that epiphenomenalism is a realist doctrine about qualia, merely denying them causal power, not their existence. If you do not correct this here, the subsequent paradox will seem to them to be about nothing rather than about something inert.

      With causal closure secured and the reality of the mental affirmed, you can now derive the inertness of phenomenal properties. Since the physical is closed, and the mental is distinct, the mental cannot push the physical around without violating closure. This is the point to introduce your central example, which should avoid the overused zombie or pain-behaviour links. Instead, propose a scenario involving a silent internal alarm. Imagine a student monitoring a complex system who experiences a sudden, vivid phenomenal surge of dread indicating danger. For this example to work, it must have genuine phenomenal character, meaning there is something it is like to feel the dread, but it must also possess complete causal isolation. The feeling itself must lack any behavioural or neural consequence. It does not trigger the adrenaline, it does not fire the motor neurons to shout a warning, and it does not alter the subsequent neural processing that leads to the hand moving. The physical brain state causes the dread, and the physical brain state causes the hand to move, but the dread sits between them like a shadow, causing nothing. This specific isolation is crucial because if the dread triggers even a micro-neural change, you have smuggled in interactionism and broken the setup.

      Once the inertness is visualized through this alarm scenario, you can move to the third stage, which is the act of judgement or reporting. Ask the students how we come to say I feel dread. Establish that the report itself, whether spoken or written, is a physical event involving vocal cords or finger movements. Now you can begin constructing the paradox in stages rather than delivering it as a single contradiction. The first stage of the paradox is to note that we make these reports reliably. The second stage is to recall that the phenomenal state is causally inert. The third stage is to ask what connects the report to the state. If the state causes nothing, it cannot cause the report. If the physical brain causes the report, and the physical brain also causes the state, the correlation is pre-established but the knowledge claim is ungrounded. It is at this juncture that you must intercept the second common misconception, which is the idea that the paradox dissolves if we simply admit our reports are unreliable. Students will suggest that perhaps we are just guessing about our consciousness. You must explain why this fails: if we are guessing, then our claim to know our own minds is false, which undermines the very premise of the seminar that we are discussing known phenomenal states. The paradox is not that we might be wrong, but that if epiphenomenalism is true, we have no explanation for why we are right so often.

      To conclude the session, you need a diagnostic question that tests whether they have grasped this structural tension rather than simply memorizing that consciousness is causally useless. Do not ask them to define epiphenomenalism. Instead, ask them this: If epiphenomenalism is true, what causal chain leads you to believe it, and does that chain track the truth of the theory or merely physical convenience? This forces them to see that the theory itself undermines the justification for believing it, which is the self-stultifying nature of the report. Finally, you must be disciplined about what to omit to keep within the ninety-minute limit and maintain philosophical focus. You should explicitly avoid detailed interactionist physics, such as debates over the conservation of energy, as these distract from the conceptual logic of the paradox. You should also omit contemporary neuroscientific objections regarding specific neural correlates, as these invite empirical escapes rather than forcing engagement with the logical problem. By adhering to this sequence, securing the physical closure before the mental inertness, and timing your interventions against misconceptions precisely, you will guide them through the paradox as a structural inevitability rather than a mere puzzle.

      Sincerely,
      [Your Name]

