answer: |-
  **Adversarial Collaboration: Responsibility Gaps in Autonomous Systems**
  **Signatories:** The Gap Realist & The Gap Institutionalist

  **Introduction**
  We employ a distinction between an *attributability gap* (no individual satisfies backward-looking blame conditions) and an *accountability gap* (no entity is positioned to answer for outcomes or reform practices). This distinction genuinely separates our positions: the Realist argues that an attributability gap prohibits deployment; the Institutionalist argues that accountability mechanisms suffice even when attributability fails. However, the distinction does no work to resolve the normative stalemate: both sides agree an attributability gap exists in hard cases, but disagree on whether that gap is morally fatal. This document records our agreements, disagreements, and empirical cruxes.

  **1. Agreed Claims**
  1.  **Harm Frequency:** The dispute is not about how often harm occurs. Both sides agree that even rare, opaque harms generate the philosophical problem.
  2.  **Slogan Warning:** The assertion that "someone must be responsible" is not itself an argument. It begs the question between requiring a blameworthy agent versus a liable institution.
  3.  **Technical Constraint:** The hard cases are ones where the performance gain and the opacity come from the same feature of the system (e.g., high-dimensional learning). We cannot simply demand transparency without sacrificing the benefit that justified deployment.

  **2. Disagreements Table**

  | Claim | Gap Realist Position | Gap Institutionalist Position | Type |
  | :--- | :--- | :--- | :--- |
  | **Nature of the Gap** | **Attributability Failure:** When behavior emerges from learning conditions no individual specified, nobody satisfies the control/foreseeability conditions blame requires. | **Accountability Maintenance:** Responsibility practices never required individual blame. We handle organizational harm through strict/vicarious liability and enterprise liability. | Substantive |
  | **Normative Remedy** | **Restrict Deployment:** If nobody satisfies blame conditions, the honest conclusion is to restrict deployment until control is restored. | **Redesign Institutions:** Where technology defeats existing liability devices, the device needs redesigning (or insurance mandates), not that responsibility has run out. | Substantive |
  | **Meaning of "Responsibility"** | **Moral Blame:** Responsibility implies a moral relationship between agent and act that is broken by opacity. | **Social Liability:** Responsibility implies a functional role in answering for harm and funding repair, which institutions can fill. | Verbal/Substantive |

  *Note on Type:* The third row is verbal insofar as we define terms differently, but substantive because those definitions drive incompatible policy recommendations (restriction vs. regulation).

  **3. Three Cruxes**

  **Crux 1: The Human Organization Analogy**
  *Question:* Is a gap that would equally arise inside a large human organization any less of a gap?
  *Shared Evidence:* Historical cases of bureaucratic diffusion of responsibility (e.g., complex supply chain failures) where no single employee could foresee the outcome.
  *Realist Prediction:* These are genuine moral failures in human organizations too; we tolerate them poorly. Automating them compounds the error.
  *Institutionalist Prediction:* We already tolerate them because enterprise liability works. If the structure handles the harm, the "gap" is merely philosophical, not practical.

  **Crux 2: The Redesign Test**
  *Question:* Could the system have been built with an intervention point legible to a named role without losing the gains that justified deploying it?
  *Shared Evidence:* Engineering audits of "human-in-the-loop" systems showing that meaningful intervention often degrades system efficiency to baseline levels.
  *Realist Prediction:* If the answer is "no," the system is illegitimate. Opacity without override capability violates control conditions.
  *Institutionalist Prediction:* If the answer is "no," liability shifts entirely to the enterprise. The lack of a legible intervention point justifies higher insurance premiums, not bans.

  **Crux 3: The Should-Have-Known-at-a-Cost Standard**
  *Question:* Does a feasible monitoring cost restore attributability, or merely adjust liability?
  *Case:* A hospital's patient-allocation system, trained on throughput data, learns a triage policy that improves survival overall but concentrates delays on one group of patients. No clinician or engineer can reconstruct why, and the pattern only appears under a rare combination of admissions. Suppose the hospital could have detected the pattern by spending a specified amount on monitoring that it chose not to spend.
  *Realist Prediction:* If the cost was reasonable, the hospital is negligent (attributability restored via organizational choice). If the cost was prohibitive relative to the risk, the gap remains, and the system should not have been deployed. The opacity itself is the barrier, not just the monitoring cost.
  *Institutionalist Prediction:* The monitoring cost determines the standard of care for liability, not deployment legitimacy. If they didn't spend the money, they pay for the harm via strict liability. The gap is closed by the compensation mechanism, regardless of whether anyone could have foreseen the specific pattern.

  **Conclusion**
  We agree that the *attributability gap* is real in high-opacity learning systems. We disagree on whether *accountability mechanisms* (liability, insurance) are sufficient to bridge it. The Realist holds that without attributability, deployment is morally unauthorized. The Institutionalist holds that accountability is the only functional requirement for justice. Future work must determine whether the public will accept institutional liability as a substitute for individual blame.
