answer: |-
  Here is a 90-minute lesson plan designed to avoid the common pedagogical traps of Updateless Decision Theory (UDT).

  ### The Core Pedagogical Problem
  Your previous attempts likely failed because you started with the **solution** ("choose a policy") before establishing the **failure mode** of the standard view ("maximize EU given current beliefs"). To a student trained in standard Bayesian rationality, conditioning on all available evidence is a virtue. You must demonstrate a scenario where that virtue becomes a vice *before* you introduce UDT as the cure.

  ### 1. The Carrier Scenario: Counterfactual Mugging
  **Do not use Transparent Newcomb.**
  *   **Why:** In Transparent Newcomb, Evidential Decision Theory (EDT) and UDT often agree (both one-box), while Causal Decision Theory (CDT) two-boxes. This turns the session into a debate about CDT vs. EDT, obscuring the specific "updateless" mechanic.
  *   **The Better Choice:** **Counterfactual Mugging.**
      *   **Setup:** Omega flips a fair coin.
          *   **Heads:** Omega gives you $10,000 *if* it predicts you would have given it $100 had the coin come up Tails.
          *   **Tails:** Omega asks you for $100. (No $10,000 is available in this branch).
      *   **The Crux:** You are in the **Tails** branch. You see the coin is Tails. You know the $10,000 is impossible.
      *   **Why it works:**
          *   **CDT:** Don't pay. (Paying costs $100, gains nothing).
          *   **EDT:** Don't pay. (Your action doesn't change the coin flip; the $10k is already gone).
          *   **UDT:** Pay. (Because the *policy* "Pay if Tails" is what secures the $10k in the Heads branch).
      *   **Benefit:** It isolates "Updatelessness" as the *only* variable that changes the outcome. It forces the student to value a counterfactual world they know is false.

  ---

  ### 2. The 90-Minute Sequence

  #### Phase 1: The Trap (0–15 mins)
  **Goal:** Solidify the "Standard View" so you can break it.
  *   **Whiteboard:** Write the standard decision rule: *$Action^* = \arg\max_a \mathbb{E}[U | a, \text{Observations}]$*.
  *   **Dialogue:** Ask them why we condition on Observations. (Answer: Because information is valuable; ignoring info is irrational).
  *   **Commitment:** Get them to agree that once you know the state of the world, you should optimize for *that* state, not hypothetical ones.
  *   **Warning:** Do not mention UDT yet. If you do, they will treat the upcoming scenario as a puzzle to fit the theory, rather than a problem to solve.

  #### Phase 2: The Scenario & The Failure (15–45 mins)
  **Goal:** Walk through Counterfactual Mugging until the standard view feels painful.
  *   **Step 1 (The Setup):** Draw the decision tree.
      *   Root: Coin Flip (50% H, 50% T).
      *   Branch H: You get $10k *if* Policy = "Pay on T".
      *   Branch T: You are asked for $100.
  *   **Step 2 (The Ex Ante View):** Ask: "Before the flip, what policy do you want?"
      *   *Calculation:* Policy "Pay" = 50% ($10,000) + 50% (-$100) = $4,950. Policy "Refuse" = $0.
      *   *Consensus:* Everyone agrees they want the "Pay" policy beforehand.
  *   **Step 3 (The Ex Post View):** Reveal the coin is **Tails**.
      *   **Crucial Question:** "You now know the $10,000 branch is impossible. It is causally inaccessible. Do you pay the $100?"
      *   **Let them argue:** Most will say "No." Why throw away $100 for nothing?
      *   **The Pain Point:** Highlight the contradiction. "Five minutes ago you wanted to be the kind of person who pays. Now that you are that person, you regret it. If you know you will regret it *then*, why be that person *now*?"
      *   **Diagnosis:** The standard rule ("Maximize given current beliefs") forced you to switch policies mid-game. That switch is what cost you the $10k in the counterfactual.

  #### Phase 3: The UDT Move (45–65 mins)
  **Goal:** Define the solution without jargon.
  *   **The Shift:** Erase the standard rule. Replace it with: *$Policy^* = \arg\max_\pi \mathbb{E}[U | \pi, \text{Prior}]$*.
  *   **Key Distinction:** You are not choosing an **Action** (Pay/Refuse) in light of observations. You are choosing a **Mapping** (If H then X, If T then Y) from the "Original Position" (before the coin flip), even though you execute it after the flip.
  *   **Whiteboard Visual:** Draw a box around the whole decision tree. Label it "The Algorithm."
      *   **CDT/EDT:** Optimizes the *output* of the algorithm given the current input.
      *   **UDT:** Optimizes the *algorithm itself* given the distribution of possible inputs.
  *   **The "Why":** Explain that in problems with logical/predictive correlations, your decision *now* is evidence of what your algorithm *is*. If your algorithm changes based on the input, the predictor (in the H branch) would have predicted that change.

  #### Phase 4: Defusing the "Ignore Your Eyes" Misconception (65–80 mins)
  **Goal:** Address the specific fear that UDT requires blindness.
  *   **The Misconception:** "UDT means I shouldn't look at the coin. I should act as if I don't know it's Tails."
  *   **The Correction:** "UDT does not mean you ignore evidence in your *beliefs*. It means you don't let evidence change your *decision criterion*."
  *   **Analogy (The Code Deployment):**
      *   Imagine you write a trading bot. You backtest it on historical data (the Prior). You find the best strategy.
      *   You deploy the bot. The market crashes (the Observation).
      *   **Standard View:** The bot sees the crash, re-evaluates its core strategy from scratch, and decides "Actually, losing money is bad, I'll stop trading."
      *   **UDT View:** The bot sees the crash, but runs the code you wrote during backtesting. The code says "Hold." It holds.
      *   **Point:** The bot *knows* the market crashed. It uses that info as an *input* to the function. But it doesn't *rewrite the function* based on the input.
  *   **Verbal Script:** "You update your *map* (beliefs) to match the territory. But you do not update your *compass* (policy) to match the map. The compass was set for the whole journey."

  #### Phase 5: Scope & Assessment (80–90 mins)
  **Goal:** Manage expectations and verify understanding.
  *   **What to Explicitly Exclude:**
      *   **Logical Uncertainty:** Don't try to explain *how* the predictor simulates you (Turing machines, halting problems). Treat the predictor as a black box that correlates with your policy.
      *   **FDT vs. UDT:** Don't introduce Functional Decision Theory distinctions. It's too much archaeology.
      *   **Infinite Regress:** If they ask "But what determines the policy?", stop at "The agent design."
  *   **The Comprehension Check Question:**
      *   Do not ask "What is UDT?" (They will recite definitions).
      *   **Ask this:** "In the Counterfactual Mugging, a UDT agent pays the $100. Does the agent *believe* there is a 50% chance the coin is Heads? If not, why is it calculating expected utility using 50%?"
      *   **Correct Answer:** "No, it believes it is 100% Tails. But it calculates expected utility over the *policy's performance across all possible worlds*, not the *action's performance in the actual world*."
      *   **Why this works:** It forces them to distinguish between *epistemic probability* (what I believe is true) and *decision-theoretic weight* (what worlds count toward my score). If they say "It pretends the coin is 50/50," they haven't understood updatelessness; they've just understood ignorance.

  ---

  ### 3. Anticipated Pitfalls & Interventions

  | Pitfall | When it happens | Intervention |
  | :--- | :--- | :--- |
  | **"This is just Precommitment."** | Phase 3 | Acknowledge it is precommitment, but note: "Standard precommitment requires an external enforcer (a contract). UDT claims you can precommit *computationally* just by reasoning correctly. You don't need a gun to your head; your own logic binds you." |
  | **"But the money is gone!"** | Phase 2 | Agree enthusiastically. "Yes! That's the point. You are paying $100 to make it true that you *are the kind of agent* who gets money in other branches. You are paying for the *label* on your algorithm." |
  | **"What if the coin was 99% Tails?"** | Phase 4 | This is the stress test. If P(Tails) = 99%, Ex Ante Value of "Pay" is negative. UDT says *Refuse*. This proves UDT isn't dogmatic; it follows the Ex Ante math. Use this to show UDT *does* care about probabilities, just the *prior* ones. |
  | **"Is this realistic?"** | Anytime | "We aren't arguing Omega exists. We are arguing about what 'rational' means. If you define rational as 'winning', and you define 'winning' over the whole game tree, this is the math that follows." |

  ### 4. Whiteboard Layout Plan
  *   **Left Third:** The Standard Rule ($\max E[U|Obs]$). Leave this up throughout to contrast.
  *   **Middle:** The Counterfactual Mugging Tree. Draw the "Ex Ante" box (around the root) and the "Ex Post" dot (on the Tails branch).
  *   **Right Third:** The UDT Rule ($\max E[U|Policy, Prior]$). Use this space for the "Code/Compass" analogy during the misconception phase.

  ### Summary of the "Order"
  1.  **Validate** the standard view (Conditioning is good).
  2.  **Break** the standard view (Counterfactual Mugging makes conditioning lose).
  3.  **Replace** the object of choice (Actions $\to$ Policies).
  4.  **Replace** the timing of choice (Now $\to$ Ex Ante).
  5.  **Clarify** the epistemology (Beliefs update, Policies don't).

  This order prevents UDT from looking like a "weird trick" and frames it as the only consistent way to resolve the conflict between Ex Ante and Ex Post rationality.
