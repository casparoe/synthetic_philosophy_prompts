prompt: |-
  hey — i'm a phd student in political philosophy running a grad workshop session (8 people, 75 mins) on nuclear deterrence paradoxes and brinkmanship. i want an in-class excersise — a simulation or structured game — that makes the group actually feel the 'delegated irrationality' problem: rational actors build automatic escalation mechanisms (like Schelling's doomsday machine) to make threats credible, but that credibility can make an opponent more likely to strike first because they know you can't back down. i don't want standard chicken or prisoner's dilemma; instead, design rules with hidden commitment cards, three escalation rounds, and a payoff scheme in points (not money) where each player can secretly lock in an automatic response for round 2, but the opponent only sees that lock-in after they've decided whether to preempt in round 1. the idea is that participants should discover for themselves that committing to irrationality protects them in one dimension and exposes them in another — before anyone names the paradox. include roles, the timeline, the debrief that maps specific moments in play onto ex ante vs ex post rationality, and tell me what will predictably go wrong the first run (mabey nobody activates their commitment card, or everyone preempts too early?). also be frank about which feature of real-world deterrence the game can't reproduce — mabey the actual existential weight? — and separate what's fairly settled in deterrence theory from what's genuinely contested about whether this paradox actually undermines the whole framework. don't present the contested side as consensus.
