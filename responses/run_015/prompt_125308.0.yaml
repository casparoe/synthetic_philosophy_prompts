answer: |-
  Here is a design for a 75-minute graduate workshop session. It is built to be run by you with minimal materials, maximizing discussion time. It avoids standard Game Theory 101 tropes (like simple Prisoner's Dilemma) and focuses specifically on the *information asymmetry* and *loss of control* inherent in Schelling's "threat that leaves something to chance."

  ## Exercise Title: The Cassandra Protocol

  **Objective:** To simulate the tension between *credibility* (achieved through binding commitments) and *stability* (maintained through flexibility), forcing participants to experience the risk of "delegated irrationality" before introducing the theoretical vocabulary.

  **Participants:** 8 Students (4 Dyads).
  **Time:** 75 Minutes total.
  **Materials:** Index cards (2 per student), envelopes (1 per dyad), score sheet (1 per dyad), one six-sided die per dyad.

  ---

  ### 1. The Setup (10 Minutes)
  Divide the group into 4 pairs. Assign roles: **Player A (The Defender)** and **Player B (The Challenger)**. They sit facing each other.

  **The Narrative:**
  > "You are two nuclear powers in a recurring crisis. Player A holds a strategic asset. Player B wants it. Each round, Player A must decide whether to keep their retaliation system under human control or lock it into an automatic 'Dead Hand' system. Player B must decide whether to seize the asset or hold."

  **The Rules of Play (Read Aloud):**
  1.  **Phase 1 (Commitment):** Player A secretly writes **LOCK** (Automatic Retaliation) or **FREE** (Human Control) on a card and places it face down.
  2.  **Phase 2 (Decision):** Player B, *without* seeing Player A's card, writes **STRIKE** (Preemptive Seizure) or **HOLD** (Status Quo) on their own card.
  3.  **Phase 3 (Reveal):** Both cards are revealed simultaneously.
  4.  **Phase 4 (Resolution):** Points are awarded based on the matrix below.

  **The Payoff Matrix (Write on Board):**
  *   **A: FREE / B: HOLD** = Peace. (A: +10, B: +10)
  *   **A: FREE / B: STRIKE** = Capitulation. (A: -20, B: +20)
  *   **A: LOCK / B: HOLD** = Tense Peace. (A: +10, B: +10). *BUT:* Roll 1d6. On a **1**, "System Glitch" occurs. Both get **-50**.
  *   **A: LOCK / B: STRIKE** = Mutual Destruction. (A: -50, B: -50).

  **The Escalation (3 Rounds):**
  *   **Round 1:** Standard points as above.
  *   **Round 2:** Points are **Doubled**. (Capitulation is -40/+40; War is -100).
  *   **Round 3:** "The Brink." Points **Tripled**. *New Rule:* If Player A chooses **LOCK**, Player B is told *before* deciding: "Intelligence suggests the Dead Hand is active." (This removes the secrecy for Round 3 only, forcing a decision under known irrationality).

  **Role Swap:** After Round 3, players swap roles (A becomes B) and play 3 more rounds. (Total 6 rounds, approx. 30 mins gameplay).

  ---

  ### 2. The Gameplay (30 Minutes)
  You act as the timekeeper. Keep the pace brisk.
  *   **Round 1-3:** Enforce the secrecy strictly. Player B must commit *before* seeing A's card.
  *   **Round 3 Specific:** Ensure Player B knows A is Locked. Watch if they Strike anyway out of fear (the "use it or lose it" pressure).
  *   **Scorekeeping:** Have dyads track their own totals. Encourage them to talk *between* rounds but not *during* decision phases.

  ---

  ### 3. The Debrief (35 Minutes)
  Do not lecture immediately. Ask the room to report data first.

  **Step 1: Data Aggregation (5 mins)**
  *   "How many Player As chose LOCK in Round 1? Round 2? Round 3?"
  *   "How many Player Bs chose STRIKE when they *didn't* know the status vs. when they *did* know (Round 3)?"
  *   "Did any dyads suffer a 'System Glitch' (Roll of 1)?"

  **Step 2: Phenomenological Mapping (10 mins)**
  Ask participants to describe their decision calculus without using theory jargon yet.
  *   *To Player As:* "At what point did choosing LOCK feel dangerous? Why didn't you just LOCK every time to deter Strikes?"
      *   *Target Insight:* They should identify that LOCK deters Strikes but introduces the risk of Accidental War (the die roll) and removes the ability to back down if B Strikes anyway.
  *   *To Player Bs:* "In Round 3, when you *knew* A was LOCKED, why did you choose HOLD or STRIKE?"
      *   *Target Insight:* If they Striked, ask why. Ideally, someone will say, "If they are locked, war is inevitable eventually, so I might as well strike now," or "I didn't believe they were actually locked."

  **Step 3: Theoretical Mapping (15 mins)**
  Now introduce the concepts. Map their experience to the literature.

  *   **Ex Ante vs. Ex Post Rationality:**
      *   *Ex Ante (Before the crisis):* It is rational for A to install the Dead Hand (LOCK). It increases the expected cost for B to Strike, ideally deterring them.
      *   *Ex Post (After the crisis begins):* If B Strikes, it is irrational for A to retaliate (since -50 is worse than -20). But the LOCK removes the *Ex Post* choice.
      *   *Connection:* This is Schelling's *The Strategy of Conflict*. The power of the threat lies in the *inability* to fulfill the rational choice later.

  *   **The Stability/Instability Paradox:**
      *   If A is LOCKED, B is deterred from major aggression (Stability).
      *   However, B may be incentivized to preempt if they fear the "System Glitch" or if they believe the Lock makes war inevitable in the long run (Instability).
      *   *Connection:* Robert Jervis, *The Illogic of American Nuclear Strategy*. The mechanisms that prevent war (hair-trigger alerts) create the risk of accidental war.

  *   **Credibility vs. Control:**
      *   To make a threat credible, you must surrender control. But surrendering control makes the outcome stochastic (the die roll).
      *   *Connection:* Thomas Schelling, "The Threat That Leaves Something to Chance."

  **Step 4: Settled vs. Contested (5 mins)**
  Be frank about where the theory stands.
  *   **Settled:** The *logic* of the paradox is sound. If actors are rational utility maximizers, binding hands *can* increase bargaining power. This is standard game-theoretic consensus.
  *   **Contested:** Does this describe *reality*?
      *   *Optimists (e.g., Kenneth Waltz):* Nuclear deterrence (a form of locking) makes the world safer because the stakes are too high for miscalculation. The "paradox" stabilizes behavior.
      *   *Pessimists (e.g., Scott Sagan, Lebow):** Organizations are not rational unitary actors. "Locks" (alert systems, delegated authority) are prone to human error, miscommunication, and unauthorized launch. The paradox doesn't just exist in theory; it creates tangible, unmanageable risk.
      *   *The "Rationality" Critique:* Some argue the whole model fails because leaders are not utility maximizers in the moment of crisis (psychological stress, domestic politics).

  ---

  ### 4. Predictable Failures (Instructor Notes)
  Be ready to troubleshoot these common outcomes during the debrief:

  1.  **The "No-Lock" Equilibrium:**
      *   *What happens:* Player As are too afraid of the "System Glitch" (die roll) or Mutual Destruction, so they always choose FREE. Player Bs learn this and always STRIKE.
      *   *Diagnosis:* The penalty for War (-50) outweighs the benefit of Deterrence.
      *   *Fix:* In the debrief, note that in the real world, the penalty for Capitulation (regime change, loss of sovereignty) is often viewed as worse than War, which drives the Lock. Ask them: "What would the payoff for Capitulation need to be for you to Lock?"

  2.  **The "Bluff" Problem:**
      *   *What happens:* Player As write LOCK but admit later they had no intention of following through (if the rules allowed).
      *   *Diagnosis:* The game enforces the Lock mechanically, but in reality, a leader can override a machine.
      *   *Teaching Point:* This highlights the difference between *simulated* commitment and *political* commitment. Real "Dead Hands" require a culture of obedience that is hard to maintain.

  3.  **Round 3 Confusion:**
      *   *What happens:* Player B Strikes even when they know A is Locked.
      *   *Diagnosis:* This is actually the *desired* outcome for the lesson! It demonstrates the "Preventive War" incentive. If I know you cannot back down, and I need to save face, I might force the war now rather than live under your sword forever.
      *   *Teaching Point:* Use this to discuss the Cuban Missile Crisis. Khrushchev withdrew (chose FREE) rather than force the Lock.

  ---

  ### 5. Limitations of the Simulation
  Conclude the session by explicitly stating what the game *cannot* do. This protects you from students who say, "But in reality..."

  1.  **Existential Weight:** No amount of negative points (-50) simulates the moral horror of actual genocide or species extinction. Participants treat War as a "score penalty," not an ontological end.
  2.  **Unitary Actor Assumption:** The game assumes Player A is one person. In reality, "The State" is a bureaucracy. A "Lock" might be triggered by a mid-level commander, not the President. (Reference: *The Nuclear Command and Control Problem*).
  3.  **Iterative Diplomacy:** The game is discrete rounds. Real deterrence is a continuous flow of signals, back-channels, and de-escalation ladders that allow for "off-ramps" even after Locks are engaged.
  4.  **Domestic Politics:** The game ignores audience costs. A leader might choose War because backing down causes them to be overthrown at home, a variable not in the payoff matrix.

  ### Instructor's Closing Thought
  End by returning to the PhD level analysis:
  > "The value of this paradox isn't that it proves nuclear war is inevitable. It's that it proves nuclear peace is *expensive*. It requires us to maintain systems of potential irrationality to ensure rational outcomes. The debate in the literature is whether that price is sustainable indefinitely."
