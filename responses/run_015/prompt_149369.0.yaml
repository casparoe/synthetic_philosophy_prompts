answer: |-
  There is no single, canonical term (like "Gresham's Law") that exclusively captures this specific dynamic, but your observation aligns precisely with a cluster of concepts in **Critical Genocide Studies**, **Third World Approaches to International Law (TWAIL)**, and the **Sociology of International Law**.

  The dynamic you describe is most commonly discussed under the headings of **"Normative Asymmetry,"** **"Sovereign Exceptionalism,"** or **"Constitutive Exclusion."** However, to distinguish it from mere hypocrisy, you need to frame it not as a failure of application, but as a *feature of the category's design*.

  Here is a conceptual delineation of the existing literature, followed by a precise distinction from hypocrisy and a proposed term for your work.

  ### 1. Existing Conceptual Frameworks

  While no single word exists, three overlapping frameworks capture different facets of your observation:

  **A. The "Sovereignty Shield" (Critical Genocide Studies)**
  Scholar **A. Dirk Moses**, particularly in *The Problems of Genocide* (2021), argues that the 1948 Genocide Convention was not designed primarily to protect populations, but to protect the **state system**. By setting an impossibly high threshold for "intent" and limiting jurisdiction to state consent, the category was structurally engineered to be applicable only to "rogue" or "collapsed" states (outsiders) while shielding "legitimate" states (insiders) from prosecution.
  *   **Relevance:** This supports your claim that the asymmetry is not accidental but **structurally adaptive**.

  **B. The "Standard of Civilization" (Critical International Legal Theory)**
  Drawing on **Martti Koskenniemi** (*The Gentle Civilizer of Nations*), this framework posits that international law historically divides the world into "civilized" (law-making) and "uncivilized" (law-receiving) entities. In the modern era, this manifests as a distinction between "functioning democracies" (whose violence is framed as *law enforcement* or *counter-terrorism*) and "pariah states" (whose violence is framed as *atrocity*).
  *   **Relevance:** This explains why the *same acts* receive different *legal descriptions* based on the perpetrator's status within the international order.

  **C. "Hierarchies of Grievability" (Critical Theory)**
  **Judith Butler** (*Frames of War*) argues that normative frameworks determine which lives are "grievable" and which are not. When a state is integrated into the liberal international order, its victims are often rendered "ungrievable" in the specific legal sense required to trigger the genocide label, whereas victims of pariah states are hyper-visible.
  *   **Relevance:** This captures the *moral economy* of the naming process you described.

  ### 2. Distinguishing from "Hypocrisy" or "Selective Outrage"

  To advance your argument, you must distinguish this dynamic from **Strategic Hypocrisy**. Hypocrisy implies a moral failing of *actors* who know the rule and violate it. Your observation suggests a functional property of the *system*.

  | Feature | Strategic Hypocrisy / Selective Outrage | **Your Dynamic (Structural Asymmetry)** |
  | :--- | :--- | :--- |
  | **Locus of Fault** | **Agential:** Specific states or diplomats choose to ignore evidence. | **Systemic:** The legal category itself contains adaptive thresholds. |
  | **Relationship to Law** | **External:** Actors stand outside the law to violate it. | **Internal:** The law *produces* the distinction through its application. |
  | **Function** | **Deceptive:** Aims to hide inconsistency. | **Constitutive:** Aims to maintain the stability of the international order. |
  | **Analogy** | **Tax Evasion:** Breaking the rules to save money. | **Tax Loophole:** The rules are written to save money for specific classes. |
  | **Outcome** | Undermines legitimacy (if exposed). | **Preserves legitimacy** (by reserving judgment for "outsiders"). |

  **The Crucial Distinction:** Hypocrisy suggests the system *would* work fairly if actors were more moral. Your observation suggests the system *cannot* work fairly because its jurisdictional consequences (intervention, sanctions, loss of sovereignty) are incompatible with the stability of the core state system. Therefore, the *descriptive* category must bend to accommodate the *jurisdictional* reality.

  ### 3. Proposed Conceptual Terminology

  If you wish to name this precisely in your work, I recommend one of the following neologisms or refinements, depending on your theoretical emphasis:

  **Option A: "Constitutive Juridical Asymmetry"**
  *   **Why:** "Constitutive" signals that this asymmetry is required for the system to function (it constitutes the boundary between insider/outsider). "Juridical" highlights that the legal consequences drive the descriptive naming.
  *   **Usage:** *"The Genocide Convention operates through a logic of **constitutive juridical asymmetry**, where the descriptive threshold rises in proportion to the perpetrator's integration into the international order."*

  **Option B: "Performative Immunity"**
  *   **Why:** Draws on Speech Act Theory. The act of *not naming* genocide is a performative act that grants immunity. It highlights that the silence is not a gap, but an action.
  *   **Usage:** *"Integrated states benefit from **performative immunity**, where the refusal to apply the genocide label functions as a shield against jurisdictional consequences."*

  **Option C: "Systemic Normative Containment"**
  *   **Why:** Borrows from IR security studies. The "genocide" label is a dangerous normative force; the system "contains" it by restricting its use to pariah states, preventing it from destabilizing core members.
  *   **Usage:** *"This is not selective enforcement, but **systemic normative containment**: the category is managed to prevent reflexive judgment against the core of the international system."*

  ### 4. Boundary Cases for Delineation

  To sharpen your argument, you can use these boundary cases to show where your concept applies and where mere hypocrisy applies:

  *   **Case 1: Rwanda (1994).**
      *   *Classification:* Genocide.
      *   *Status:* Collapsed/Pariah context.
      *   *Analysis:* Fits your dynamic. The label was applied (belatedly) because the state was already destroyed; no sovereignty needed to be breached to intervene.
  *   **Case 2: Srebrenica (1995).**
      *   *Classification:* Genocide (by ICJ), but often politically debated as "Ethnic Cleansing."
      *   *Status:* Occurred within a civil war involving recognized entities, but the perpetrators (Bosnian Serbs) were not fully integrated into the Western liberal order.
      *   *Analysis:* A liminal case. The label was applied, but only after the fact and against non-state/semi-state actors, shielding the sovereign states (Serbia/Greece/Russia) from direct "genocidaire" status.
  *   **Case 3: Gaza or Xinjiang (Contemporary).**
      *   *Classification:* Debated. Often termed "Conflict," "Counter-terrorism," or "Re-education."
      *   *Status:* Functioning, integrated member states (or allies thereof).
      *   *Analysis:* Fits your dynamic perfectly. The evidentiary threshold for "genocide" appears to inflate structurally when the accused state holds a seat at the UN Security Council or is a major trade partner.
  *   **Case 4: The Holocaust.**
      *   *Classification:* The archetypal Genocide.
      *   *Status:* Perpetrator was a defeated, dismantled state.
      *   *Analysis:* The category was codified *after* the state was destroyed. This supports your thesis: the label is safe to apply when the perpetrator state no longer poses a sovereign challenge to the order.

  ### Summary Recommendation
  For your work, I suggest using **"Constitutive Juridical Asymmetry."** It captures the *structural* nature (constitutive), the *legal mechanism* (juridical), and the *outcome* (asymmetry). It allows you to argue that the Genocide Convention functions less as a shield for victims and more as a **boundary-maintenance mechanism** for the international state system, preserving its moral authority by punishing the excluded while immunizing the included. This moves you beyond "hypocrisy" (a moral critique) into "systemic function" (a sociological critique).
