answer: |-
  It is a pleasure to engage with a colleague who brings the empirical patience of ecology to the abstract terrain of game theory. Your observation of "cooperative inertia"—the slow decay of cooperation after the structural incentives for it have been removed—is a profound puzzle. It touches on the very heart of how we model social systems: as static configurations of rational minds or as dynamic populations of interacting entities.

  You have asked for a careful comparison of Rational Choice Theory (RCT) and Evolutionary Game Theory (EGT) as accounts of this phenomenon. I will structure this response by following the four lines of inquiry you proposed, arguing that while RCT defines the *landscape* of possibilities, EGT describes the *motion* across that landscape, and that your phenomenon is fundamentally one of motion.

  ### 1. Stability and the Question Being Asked

  To begin, we must ask: are these frameworks answering the same question? In a superficial sense, yes: both ask "What outcome should we expect?" But their underlying logic regarding *why* an outcome persists differs radically.

  **Rational Choice Theory (RCT)** operates on the logic of *justification*. It asks: "Given that everyone else is doing X, does any individual have a reason to do Y?"
  *   **Key Concept:** **Nash Equilibrium.** A strategy profile is a Nash equilibrium if no player can increase their payoff by unilaterally changing their strategy.
  *   **The One-Shot vs. Repeated Contrast:** In a one-shot Prisoner's Dilemma (PD), Defection is the unique Nash equilibrium. In the indefinitely Repeated PD (IPD), the **Folk Theorem** states that if the discount parameter $\delta$ (the weight given to future payoffs) is sufficiently high, almost any payoff profile, including mutual cooperation, can be sustained as a Nash equilibrium.
  *   **Notion of Stability:** Stability here is *static*. It means "no incentive to move." It does not imply that the system will *return* to this state if disturbed, only that if it is there, it stays there.

  **Evolutionary Game Theory (EGT)** operates on the logic of *survival*. It asks: "If a population is doing X, will a mutant doing Y spread and replace them?"
  *   **Key Concept:** **Evolutionarily Stable Strategy (ESS).** A strategy is an ESS if, when adopted by the whole population, it cannot be invaded by a small fraction of mutants using an alternative strategy.
  *   **The One-Shot vs. Repeated Contrast:** In the one-shot PD, Defection is the unique ESS. In the IPD, cooperation can be an ESS, but only if the strategy supporting it (e.g., Tit-for-Tat) is robust against invasion by defectors *given the specific $\delta$*.
  *   **Notion of Stability:** Stability here is *dynamic resilience*. It implies that if the system is perturbed (e.g., by a few defectors appearing), selection pressures push it back toward the cooperative state.

  **Divergence:** The crucial divergence lies in the **Equilibrium Selection Problem**. RCT, via the Folk Theorem, tells you that when $\delta$ is high, Cooperation is *an* equilibrium, but so is Defection, and so is "Alternate Cooperate/Defect." RCT has no internal mechanism to predict which one will be played; it requires an external "focal point." EGT, by contrast, treats the equilibrium as the *limit* of a dynamic process. It asks which equilibrium the population flows toward from a given starting point.

  ### 2. Path Dependence and the Machinery of Inertia

  This brings us to your core observation: the slow decay of cooperation and the dependence on history.

  **RCT and the Need for Imported Machinery**
  Standard RCT is ill-equipped to handle "cooperative inertia." In a static equilibrium framework, if you change a parameter (lowering $\delta$ below the threshold), the set of equilibria changes instantly. If the old cooperative profile is no longer a Nash equilibrium, a rational agent should defect immediately. There is no "momentum" in logic.
  To explain inertia, RCT must import **dynamic learning models** (e.g., fictitious play or reinforcement learning) or **friction** (e.g., switching costs, bounded rationality). It must essentially cease to be pure equilibrium reasoning and become a theory of adjustment. Without this imported machinery, RCT must treat your observation as a transient anomaly or a failure of rationality.

  **EGT and Natural Path Dependence**
  EGT, particularly in the **finite population** context you describe, possesses the conceptual resources to represent this naturally.
  *   **Replicator Dynamics:** In infinite populations, strategy frequencies change proportional to their fitness advantage.
  *   **Stochastic Stability:** In finite populations (a few hundred agents), randomness matters. We model this as a Markov process where mutations introduce strategy variants. A state is **stochastically stable** if, as the mutation rate approaches zero, the system spends almost all its time in that state.

  Here is where your "inertia" finds its home. When $\delta$ is high, the cooperative state is a deep **basin of attraction**. To move to the defective state, the system must cross a "fitness valley"—a sequence of rare mutations where defectors must appear and survive long enough to gain a foothold.
  When you lower $\delta$ below the threshold, you shallower the basin, but you do not necessarily flatten it instantly. The population is still distributed heavily toward cooperative strategies. The "slow decay" you observe is the **waiting time** for a rare sequence of mutations and drift events to push the population out of the cooperative basin.
  The fact that decay is slower after a long time above the threshold is explained by **entrenchment**. In many evolutionary models, the specific mix of strategies (the "genetic" or "memetic" makeup) adapts to the high-$\delta$ environment. For example, agents might evolve "forgiving" strategies that are robust to error. When $\delta$ drops, these forgiving strategies persist until selected against. The history is encoded in the current distribution of strategies.

  **Verdict:** EGT represents path dependence endogenously (as part of the dynamics). RCT represents it exogenously (by adding friction or learning rules).

  ### 3. Artifact vs. Feature: Diagnostics from Inside the Simulation

  Would either framework regard cooperative inertia as an artifact?
  *   **RCT:** Likely yes. A strict rationalist would argue that if $\delta$ is below the threshold, cooperation is not subgame-perfect. The persistence is a "bug" of the simulation (e.g., agents are not optimizing fast enough).
  *   **EGT:** Likely no. This is a feature of **metastability**. In finite systems with noise, transitions between states take time. The "decay" is the system traversing a probability landscape.

  **How to distinguish this inside the simulation:**
  You can distinguish between "irrational lag" (artifact) and "stochastic metastability" (feature) by manipulating population size ($N$) and mutation rate ($\mu$).

  1.  **Scaling with Population Size:** In a stochastic evolutionary model, the expected time to escape a metastable basin (the decay time) typically scales **exponentially** with population size ($N$). If you double $N$, the inertia should last vastly longer because it becomes exponentially harder for a mutant defector lineage to drift to fixation against the majority. If the decay time remains constant or scales linearly with $N$, it suggests a learning-lag artifact (RCT style) rather than a stochastic barrier.
  2.  **The Mutation Test:** Vary your error/mutation rate. In stochastic stability theory, the waiting time to escape a basin is inversely related to the mutation rate raised to some power (the "radius" of the basin). If you lower the mutation rate and the inertia increases dramatically, you are observing a genuine stochastic barrier. If the decay rate is insensitive to mutation rate, the inertia is likely driven by the deterministic payoff structure (e.g., the specific learning algorithm), not the stochastic dynamics.

  ### 4. Rivals or Complements? The Philosophical Judgment

  Are these frameworks rivals? I argue they are **complementary descriptions pitched at different levels**, but for your specific phenomenon, one is doing the heavy lifting.

  *   **RCT** provides the **proximate** logic. It defines the payoff structure and the "forces" acting on the agents (the incentives). It tells you the slope of the hill.
  *   **EGT** provides the **ultimate** dynamics. It describes the motion of the population across that hill, including the friction of finite numbers and the momentum of history.

  **What is the "Real Explanatory Work"?**
  A philosopher of biology would likely identify the **dynamic process** (EGT) as doing the real explanatory work in the case of cooperative inertia.
  Why? Because "inertia" is a kinematic concept. It describes change over time. RCT is fundamentally a static theory of consistency. To explain a rate of decay, you need a theory of rates of change.
  Furthermore, your observation that "history matters" invokes **hysteresis**. In biological systems, hysteresis is explained by the state of the system (the distribution of phenotypes/strategies), not just the external parameters. RCT, with its focus on the *logic of the situation*, tends to erase history (the "tabula rasa" of rationality). EGT, with its focus on *population state*, preserves history.

  There is a deeper philosophical point here regarding **typological vs. population thinking**.
  *   RCT is typological: It classifies outcomes into types (Equilibria). An outcome either is or is not an equilibrium.
  *   EGT is population thinking: It focuses on the variance and frequency of traits.
  Your simulation shows that the "type" (Cooperation) persists even when the conditions for its "definition" (high $\delta$) are removed. This suggests that the "type" is an emergent property of the population dynamics, not a logical necessity of the game structure. Therefore, the explanation must reside in the framework that models the population dynamics.

  ### Conclusion

  Your "cooperative inertia" is a classic instance of **metastability in a finite stochastic system**.

  1.  **RCT** identifies that the cooperative state is no longer *normatively* supported once $\delta$ drops, but it lacks the machinery to explain why the system doesn't jump instantly to the new norm. It views the inertia as a friction to be explained away.
  2.  **EGT** identifies that the cooperative state is a *dynamical attractor*. Even if it becomes unstable (or less stable), the system requires time and rare stochastic events to escape its basin of attraction. It views the inertia as a natural consequence of finite population dynamics.

  To answer your final question: The two frameworks are complementary in the broad study of cooperation, but for *this* phenomenon, **Evolutionary Game Theory is the superior explanatory framework.** It treats the agents as components of a system with memory (encoded in strategy frequencies) rather than as isolated calculators of the present moment. The "real work" is being done by the **stochastic dynamics of strategy frequencies**, which transform the static incentives of the Prisoner's Dilemma into a landscape with valleys and hills that take time to traverse.

  You have, in effect, observed the ecological resilience of a social system. Just as a disturbed soil community does not collapse the instant the pH changes, your community of agents retains the "biomass" of cooperation until the selective pressure has persisted long enough to erode the stock of cooperative strategies. That is a biological insight, and it requires a biological (evolutionary) framework to be fully understood.
