      *   *Self-Correction on Premise:* I need to be careful not to say "You are wrong." Instead, "Empirical scholarship suggests X, but philosophically, if we assume Y..." This respects the user's creative license while ensuring accuracy.
      *   *Wait, looking closer at the prompt:* The user says "jurisdictions that retain capital punishment often provide..." This sounds like a claim about the real world. I *must* correct this gently. If I don't, the novel might be criticized for factual inaccuracy. However, I can frame it as "In the narrative logic you are exploring..." or "While empirical data varies..."
