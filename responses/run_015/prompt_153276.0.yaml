          1.  What philosophical commitments about punishment (retributive, deterrent, risk-based) does this practice presuppose?
          2.  Does it treat execution as uniquely irreversible/demanding ritual correction?
          3.  Does it presuppose the essential wrong is destruction of life vs. deprivation of liberty?
          4.  Can this be reconciled with the risk-based argument (execution forecloses remedy)?
      *   **Constraint:** Separate what is philosophically settled from what is genuinely contested. Do not present any single interpretation as consensus.

  2.  **Fact-Check the Premise (Crucial Step):**
      *   *Premise:* "Jurisdictions that retain capital punishment often provide formal state exonerations, named apologies, and statutory reparations to the heirs of executed people later proven innocent..."
