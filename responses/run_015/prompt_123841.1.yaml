prompt: |-
  Write an essay on the following controversy: why do promises generate genuine obligations rather than merely prudential reasons to keep one's word? Examine the tension between the authority-transfer view, according to which promising delegates part of one's practical authority to the promisee, and the reliance-harm view, according to which breaking a promise wrongs the promisee primarily by frustrating deliberately cultivated legitimate expectations. Reach and defend a definite conclusion about which account succeeds, or whether both must be supplemented.

  To keep the analysis from becoming a standard literature review, frame your argument through the concept of normative residue: the persistent moral remainder—something like agent-regret or a standing reason to make amends—that often survives even after full compensation and the dissipation of all further harm. Ask whether this residue is better explained by the authority-transfer model (because the promisee retains an unexercised claim) or by the reliance-harm model (because the original expectation-creating act cannot be fully undone). Then consider a layered alternative: that promises bind through two independent mechanisms, a deontic reason tied to authority or harm and a distinct aretaic reason tied to the promisor's integrity or fidelity, which can come apart in cases of compelled or overridden promises. Weigh the objection that this layered view overcounts the moral cost by making promise-breaking doubly wrong, and the counter-objection that without the aretaic layer the phenomenon of normative residue becomes inexplicable.

  Your essay should not end in agnosticism; defend one of the three positions—the authority-transfer view, the reliance-harm view, or the layered hybrid—or a carefully qualified variant. At the very end, state your bottom line in this exact form:

  Verdict: [your conclusion summarized in one sentence].
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**
      *   **Topic:** Why promises generate genuine obligations (not just prudential reasons).
      *   **Core Conflict:** Authority-Transfer View (delegating practical authority) vs. Reliance-Harm View (frustrating legitimate expectations).
      *   **Analytical Lens:** "Normative Residue" (moral remainder, agent-regret, standing reason to make amends even after compensation/harm dissipation).
      *   **Alternative to Consider:** A Layered Hybrid View (Deontic reason [authority/harm] + Aretaic reason [integrity/fidelity]).
      *   **Objections to Address:**
          *   Against Hybrid: Overcounting moral cost (doubly wrong).
          *   For Hybrid: Without the aretaic layer, normative residue is inexplicable.
      *   **Requirement:** Do not end in agnosticism. Defend one position (Authority, Reliance, or Hybrid/Variant).
      *   **Formatting Requirement:** End with "Verdict: [one sentence summary]".

  2.  **Deconstruct the Concepts:**
      *   *Genuine Obligation vs. Prudential Reason:* Prudential = "I should keep it because it's good for me/reputation." Genuine = "I should keep it because I *owe* it to them, regardless of cost."
      *   *Authority-Transfer:* When I promise, I give you the right to demand performance. It's a mini-sovereignty transfer. (Associated with Shiffrin, Hume, perhaps Raz).
      *   *Reliance-Harm:* Promising creates expectations. Breaking it hurts the reliance. (Associated with Scanlon, utilitarian accounts).
      *   *Normative Residue:* Even if I pay you for the broken promise and you aren't harmed financially, I still feel I owe an apology or feel "dirty." Why?
      *   *Layered Hybrid:* There's the duty to the other person (deontic) AND the duty to oneself/virtue (aretaic).

  3.  **Evaluate the Views through the Lens of Normative Residue:**
      *   *Reliance-Harm:* If I compensate you fully, the harm is gone. The expectation is frustrated, but if you are made whole, why is there residue? This view struggles to explain why an apology is needed *beyond* compensation. It reduces the wrong to a tort-like injury.
      *   *Authority-Transfer:* I gave you authority. Even if I compensate you, I violated your authority. You still hold the unexercised claim. This explains the residue better (the relationship was altered). However, does it explain *agent-regret* specifically?
      *   *Layered Hybrid:* The deontic layer explains the duty to the other. The aretaic layer (integrity) explains the internal residue (I failed to be a person of my word). This seems to capture the full phenomenology of promise-breaking.

  4.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The peculiar force of a promise. It's not just a prediction.
          *   Define the problem: Prudential vs. Moral Obligation.
          *   Introduce the two main rivals (Authority vs. Reliance).
          *   Introduce the test case: Normative Residue.
          *   Thesis Statement: I will argue for the Layered Hybrid view because it alone accounts for the persistence of normative residue without reducing the promisee to a mere victim of harm or the promisor to a mere subject of authority.

      *   **The Reliance-Harm View & Its Deficit:**
          *   Explain the view (Scanlon-esque). Principle of Fidelity.
          *   Apply the Residue Test: If I break a promise but compensate you fully (no net harm), why do I still owe an apology? Why do I feel regret?
          *   Critique: It treats promising like negligence. Once damages are paid, the case is closed. But moral life doesn't work that way. The residue remains.

      *   **The Authority-Transfer View & Its Strength/Weakness:**
          *   Explain the view (Shiffrin/Raz). I give you control over my action.
          *   Apply the Residue Test: Violating authority is a distinct wrong from causing harm. Even if compensated, the authority was usurped.
          *   Critique: It explains the *interpersonal* residue well (the claim remains). But does it explain the *intrapersonal* residue (integrity)? Also, can authority really be transferred so easily?

      *   **The Layered Hybrid Proposal:**
          *   Propose the solution: Two mechanisms.
          *   1. Deontic (Authority/Harm): The obligation *to* the promisee.
          *   2. Aretaic (Integrity): The obligation *of* the promisor to their own moral identity.
          *   Explain how this handles residue: The apology addresses the deontic violation; the regret addresses the aretaic failure.

      *   **Addressing Objections:**
          *   *Objection:* Overcounting. Isn't it double jeopardy to say it's wrong to harm them AND wrong to lack integrity?
          *   *Rebuttal:* No, because they can come apart. (Example: A coerced promise). If coerced, I might have no obligation to perform (no deontic wrong to break), but I still feel bad about making a promise I knew I couldn't keep (aretaic stain). Or, if I break a trivial promise with no harm, the deontic cost is low, but the integrity cost remains.
          *   *Counter-Objection:* Without the aretaic layer, residue is inexplicable. (Use this to bolster the hybrid view). The reliance view can't explain why *I* feel bad if *you* are fine.

      *   **Conclusion:**
          *   Summarize the argument.
          *   Reiterate why the Hybrid view wins (comprehensive explanation of residue).
          *   Final Verdict sentence.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I focus enough on "Normative Residue"?
      *   *Adjustment:* Ensure every section ties back to the "moral remainder." Make sure the distinction between compensation and moral clearance is clear.
      *   *Check:* Did I avoid agnosticism?
      *   *Adjustment:* Be decisive in the conclusion. The Hybrid view is the strongest.
      *   *Check:* Is the "Verdict" format exact?
      *   *Adjustment:* Ensure it matches "Verdict: [sentence]".

  6.  **Final Polish:**
      *   Tone: Academic, philosophical, rigorous.
      *   Vocabulary: Deontic, aretaic, normative residue, practical authority, legitimate expectations.
      *   Flow: Ensure smooth transitions between the critique of reliance, the analysis of authority, and the synthesis of the hybrid view.

      *(Self-Correction on the Hybrid View)*: I need to be careful not to just say "both are right." I need to argue that the *combination* is necessary to explain the specific phenomenon of residue. The prompt asks to weigh the objection that this overcounts. I need to argue that it *doesn't* overcount because the two layers track different moral values (relationship vs. character).

      *(Refining the Verdict)*: It needs to be one sentence. "Verdict: The layered hybrid view succeeds because..."

  7.  **Final Review against constraints:**
      *   Essay on controversy? Yes.
      *   Examine Authority vs. Reliance? Yes.
      *   Frame through Normative Residue? Yes.
      *   Consider Layered Alternative? Yes.
      *   Weigh objections (overcounting vs. inexplicability)? Yes.
      *   Defend definite conclusion? Yes.
      *   Exact Verdict format? Yes.

      *Let's write.*
answer: |-
  The moral force of a promise is a philosophical puzzle. When an agent says, "I promise to X," they do not merely predict a future action or state a prudential intention; they create a normative bond that obligates them to perform, independent of changing circumstances or shifting desires. The central controversy lies in explaining the source of this obligation. Does promising generate genuine obligations because it transfers a slice of practical authority to the promisee, or does it wrong the promisee primarily by frustrating deliberately cultivated legitimate expectations? To resolve this, we must look beyond the moment of breach to the aftermath. Specifically, we must examine the phenomenon of "normative residue"—the persistent moral remainder, akin to agent-regret or a standing reason to make amends, that survives even after full compensation and the dissipation of all further harm. By testing the authority-transfer and reliance-harm views against this residue, and subsequently evaluating a layered hybrid account, it becomes clear that neither monistic view suffices. The obligation of a promise is best understood as a hybrid structure where deontic duties to the other and aretaic duties to the self operate independently, jointly explaining the stubborn persistence of moral remainder.

  The reliance-harm view, often associated with Scanlonian contractualism, posits that the wrong of breaking a promise lies in the violation of the expectation the promisor intentionally induced. On this account, promising is a mechanism for securing reliance; the obligation is derived from the principle that one should not harm others by leading them to expect specific conduct and then disappointing them without justification. However, this view struggles to account for normative residue in cases where harm is fully negated. Suppose a promisor breaks a promise but immediately provides compensation that leaves the promisee better off than if the promise had been kept. The reliance interest is satisfied; the expectation is frustrated, but the welfare is intact. If the obligation were solely about preventing harm or managing expectations, the moral ledger should be balanced. Yet, intuitively, the promisor still owes an apology, and the promisee retains a right to feel aggrieved. The residue suggests that something was violated that cannot be repaired by compensation. The reliance view reduces the promise to a tort-like injury; once damages are paid, the case is closed. But moral life does not function like a liability insurance policy. The persistence of the residue indicates that the wrong was not merely about the consequence (harm), but about the act itself.

  The authority-transfer view offers a more robust explanation for this interpersonal residue. Associated with theorists like Seana Shiffrin and Joseph Raz, this model suggests that in promising, the promisor delegates a portion of their practical authority to the promisee. The promisee gains the right to demand performance or release the promisor from the duty. When a promise is broken, the promisor usurps an authority that no longer belongs solely to them. This explains why compensation is insufficient: one cannot buy back authority that was gifted. The normative residue here is the unexercised claim of the promisee. Even if the promisee is materially whole, their status as a holder of authority was disregarded. This view captures the relational asymmetry of promising better than the reliance view. However, the authority-transfer model faces its own limitations regarding the *intrapersonal* dimension of normative residue. It explains why the promisee has a complaint, but it is less effective at explaining the specific quality of the promisor's agent-regret. If the obligation were purely a matter of transferred authority, one might expect that if the promisee waives the claim or is compensated, the promisor should feel entirely absolved. Yet, promisors often report a lingering sense of moral stain—a failure of integrity—even when the promisee is fully satisfied and releases them. This suggests that the authority view, while superior to the reliance view regarding the promisee's standing, misses the dimension of the promisor's own moral identity.

  This gap invites a layered alternative: that promises bind through two independent mechanisms. The first is a deontic reason tied to the authority-transfer or harm model (the obligation *to* the promisee). The second is a distinct aretaic reason tied to the promisor's integrity or fidelity (the obligation *of* the promisor to their own moral character). On this hybrid view, breaking a promise incurs a double cost: it violates the promisee's claim and it fractures the promisor's integrity. This duality provides the most comprehensive explanation of normative residue. The apology addresses the deontic violation (restoring the relationship), while the regret addresses the aretaic failure (acknowledging the lapse in virtue). The residue persists because while compensation can address the harm to the promisee, it cannot instantly restore the promisor's status as a person of their word.

  A significant objection to this layered view is that it overcounts the moral cost, making promise-breaking "doubly wrong" in a way that seems excessive. If I break a promise, am I really committing two distinct wrongs, or is this just one wrong described in two ways? Critics might argue that integrity is simply the disposition to fulfill deontic obligations; thus, violating the obligation *is* the lack of integrity, not a separate offense. If we count them separately, we risk inflating the gravity of minor promise-breaking, turning every broken appointment into a crisis of character and relationship simultaneously.

  However, this objection fails to recognize cases where the two layers come apart, proving their independence. Consider a coerced promise, or a promise made under a misunderstanding where the promisor knows they cannot perform but promises to avoid immediate conflict. In some nuanced deontic frameworks, the obligation to perform might be overridden or nullified (no deontic wrong to break), yet the promisor still feels a stain on their integrity for having placed themselves in a position where their word was unreliable (aretaic wrong). Conversely, consider a "noble lie" scenario where breaking a promise prevents a catastrophe. The promisor may have strong deontic justification (or the promisee might release them), yet the promisor still feels a tragic residue—a regret that they were forced to compromise their fidelity. If the obligation were singular, this residue would be irrational. The fact that the residue feels rational and persistent suggests that the aretaic layer tracks a value (fidelity) that is distinct from the deontic layer (authority/harm). Without the aretaic layer, the phenomenon of normative residue becomes inexplicable, particularly the agent-regret that persists even when the promisee is made whole. The "overcounting" charge is actually a feature, not a bug; it accurately reflects the complex moral texture of promising, which implicates both our social bonds and our individual character.

  Therefore, the reliance-harm view is insufficient because it cannot explain residue after compensation, and the authority-transfer view is incomplete because it neglects the internal dimension of integrity. The layered hybrid view succeeds because it acknowledges that promising is a unique speech act that simultaneously alters the normative landscape between two agents and commits the agent to a standard of personal coherence. The normative residue is the shadow cast by both violations: the debt to the other and the debt to oneself. To deny the aretaic layer is to reduce the promisor to a mere node in a network of claims, ignoring the moral agency required to sustain those claims. To deny the deontic layer is to reduce the promise to a matter of self-help, ignoring the specific vulnerability of the promisee. Only by accepting both can we explain why, even when the books are balanced financially and the promisee is appeased, the promisor still has something to atone for.

  Verdict: The layered hybrid view succeeds because it alone accounts for the persistence of normative residue by distinguishing between the interpersonal violation of authority and the intrapersonal failure of integrity.
