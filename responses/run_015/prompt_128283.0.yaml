      *   *Decapod Reality:* There is no single "seat of consciousness." Function is decentralized.
      *   *The Conflict:* Applying a binary state ("stunned" vs. "not stunned") to a system that operates on a spectrum of localized functionality. If the head ganglia are offline but the tail ganglia are firing nociceptive signals, is the animal suffering?

  4.  **Develop a Concrete Example:**
      *   *Scenario:* Electrical Stunning in Shrimp/Prawns.
      *   *Method:* Passing current through water to induce paralysis/unconsciousness before boiling or cutting.
      *   *The "Technical" View:* We need enough voltage to stop movement.
      *   *The "Conceptual" View:* Movement stops, but does *experience* stop?
      *   *The Specific Issue:* Dissociation between central processing and peripheral nociception.
      *   *Example:* The "Zombie Reflex" or "Segmental Nociception." If you crush the cerebral ganglia (head), the animal doesn't move. But if you then cut the tail, the abdominal ganglia might still process pain signals locally, even if there's no "self" to perceive it globally. Or, conversely, during electrical stunning, the current might inhibit motor output (paralysis) while leaving sensory ganglia active (locked-in syndrome equivalent).

