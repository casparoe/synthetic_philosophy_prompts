prompt: |-
  Give an example of a conceptual issue in fish and crustacean welfare in aquaculture. Specifically im curious about decapods—shrimp, crabs—where theres no central brain but distributed ganglia. Is 'humane stunning' just technically harder for them, or does it actually break the concept of instantaneous consciousness-loss that we import from mammalian welfare law? Give an example that shows its genuinely conceptual: like, if death or insensibility is graded across ganglia rather than all-at-once, then what does 'stunned' even mean? And maybe mention how this screws with trying to apply a binary welfare threshold (suffering vs not) to an animal with no single point of failure.
