      *   *Mammals:* Centralized brain (cortex/thalamus). Stunning (e.g., captive bolt, electrical) targets this center. Loss of consciousness is generally treated as a binary switch (on/off) linked to global brain function.
      *   *Decapods:* Distributed nervous system. Cerebral ganglia (head) + Ventral nerve cord + Segmental ganglia (thorax/abdomen). Reflexes can occur locally without central input.
      *   *The Problem:* If you destroy the cerebral ganglia, the tail might still curl. If you electrify the water, some ganglia might shut down before others.

  3.  **Identify the Conceptual Conflict:**
