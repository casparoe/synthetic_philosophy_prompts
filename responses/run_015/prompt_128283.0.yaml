      *   *Attempt 2 (Focusing on the "Single Point of Failure"):* Mammalian welfare relies on the brain as a single point of failure. Turn it off, animal is out. Decapods don't have this. So "stunning" isn't a switch, it's a dimmer across different body parts. This means "suffering" isn't a yes/no question.
      *   *Refinement:* Use the example of **Electrical Stunning vs. Thermal Shock**. Or better, **Spiking (Pithing) vs. Boiling**. Let's go with Electrical Stunning because it highlights the "paralysis vs. insensibility" confusion.

