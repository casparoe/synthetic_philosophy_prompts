      *   *Wait, a better conceptual angle:* The definition of "death" or "insensibility." In mammals, brain death = death. In decapods, if the cerebral ganglia are destroyed, but the abdominal ganglia react to salt or heat, is the animal "dead" for welfare purposes?
      *   *Selected Example:* **The Dissociation of Motor Paralysis and Sensory Insensibility during Electrical Stunning.** This directly addresses the "what does stunned mean" prompt.

