answer: |-
  You are describing **one phenomenon**, not three. The relocation of the money and the fixation on the metric are not separate failures; they are twin symptoms of a single structural constraint.

  The closest existing term is **Goal Displacement** (specifically *means-ends inversion*), but that term is often burdened with bureaucratic connotations (organizations preserving themselves rather than their mission). A tighter, more precise label for what you are seeing is **Operational Surrogation**.

  Here is the concept, its edges, and how it handles your specific cases.

  ### The Concept: Operational Surrogation

  **Definition:** Operational Surrogation occurs when a policy goal (an abstract construct, e.g., "undue influence") cannot be directly legislated or measured, forcing regulators to target a concrete proxy (an operational definition, e.g., "hard money contributions"). Over time, the proxy replaces the goal in both implementation and evaluation. The system optimizes for the *measure of the proxy* rather than the *reality of the goal*, not because the actors are gaming the system, but because the system cannot "see" anything else.

  **Why it is one thing:**
  You hypothesized that the relocation and the scoring are linked because "you can only write a rule against a channel." This is correct. In political science and metrology, this is the **Constraint of Operationalizability**.
  1.  **Legislation Phase:** You cannot ban "influence." It is unobservable and legally indefinable. You can only ban "transactions" (channels).
  2.  **Evaluation Phase:** You cannot measure "influence." It is contested and expensive. You can only count "transactions" (metrics).

  Because the *same constraint* (observability) dictates both the *shape of the rule* and the *shape of the score*, the displacement of the money and the displacement of the metric are inevitable consequences of the same root cause. The reform *must* target the channel to exist; the evaluation *must* target the channel to be legible. The "success" of the reform is defined by the emptying of the channel, even if the goal was the reduction of influence.

  ### Distinguishing from the Near-Misses

  You were right to dismiss the four terms you listed, though they are adjacent. Here is the boundary line:

  *   **Goodhart's Law:** Goodhart implies the metric *breaks* because people game it ("When a measure becomes a target, it ceases to be a good measure"). In Operational Surrogation, the metric *does not break*. The number of hard-money donations really does go down. The data is accurate; it is just **construct-invalid**. It measures the channel, not the influence. Goodhart is about corruption of the data; Surrogation is about irrelevance of the data.
  *   **Regulatory Arbitrage:** Arbitrage implies intent to exploit a gap. In your pattern, the actors are often complying in good faith with the new rule while pursuing the same objective. Arbitrage is finding a loophole; Surrogation is following the road the law built, even when it leads away from the destination.
  *   **Waterbed/Balloon Effect:** This describes the *flow* (the money moves) but is silent on the *evaluation* (why we count the old hole). Operational Surrogation explains why we keep looking at the old hole.
  *   **Streetlight Effect:** This is about search bias (looking where the light is). Operational Surrogation is about **evaluation lock-in**. We aren't just looking there because it's bright; we are looking there because the statute defines "success" as "darkness in this specific spot," regardless of how bright it gets next door.

  ### Intentionality

  **Purely Structural.**
  Operational Surrogation does not require anyone to intend the relocation or the deception. In fact, it works best when everyone is acting in good faith.
  *   **Legislators** write what is enforceable (channels).
  *   **Donors** pursue influence via the path of least resistance (new channels).
  *   **Reformers** measure what is reportable (registrations).
  No one needs to lie for the system to fail. The failure is baked into the requirement that laws be written about nameable things and evaluated by countable things.

  ### Handling Your Two Cases

  **(a) Court Decision Reopens the Channel**
  **Verdict:** This is **not** Operational Surrogation.
  **Reasoning:** If a court strikes down the cap (e.g., *Citizens United*), the channel reopens not because the money flowed around the rule, but because the rule ceased to exist. The feedback loop is broken exogenously. Operational Surrogation requires the rule to *hold* while the behavior shifts *around* it. If the rule vanishes, the "surrogate" goal (emptying the channel) becomes impossible for everyone, not just evaded by donors. This is **Regulatory Nullification**, a different animal.

  **(b) Public Financing / Small-Donor Matching**
  **Verdict:** This is a **different animal** (Dilution vs. Displacement).
  **Reasoning:** In your primary pattern, the *total influence* remains constant while the *channel* shifts (Displacement). In public financing with matching, the *total money* may rise, but the *causal density* per dollar drops (Dilution).
  *   **Why it differs:** Operational Surrogation relies on the proxy (dollars) being a fixed stand-in for the goal (influence). If the reform changes the *exchange rate* between dollars and influence (e.g., a candidate funded by 10,000 small donors is less beholden to any single one than a candidate funded by one billionaire), then counting the dollars is no longer the only error.
  *   **The Trap:** However, be careful. If reformers evaluate this scheme *only* by counting the number of small donors (the new channel) without measuring whether those donors actually exert influence, you have entered a **Second-Order Surrogation**. You have swapped one proxy (hard money) for another (small donor count), still without measuring the construct (influence). But structurally, case (b) has the potential to break the loop if it actually lowers the *price* of access, whereas your primary pattern assumes the price is constant.

  ### The Genuine Non-Instance

  You asked what would count as a reform that *actually* changed how much money buys, rather than where it flows. Under the definition of Operational Surrogation, a non-instance must bypass the **Constraint of Operationalizability**.

  A genuine non-instance would be a reform that **decouples the metric from the channel.**

  **Example:** A reform that does not cap money or disclose donors, but instead **reduces the dependency of officials on the money.**
  *   **Mechanism:** Shortening campaign seasons, providing free broadcast media, or increasing legislative staff resources so members rely less on outside information funded by lobbyists.
  *   **Evaluation:** Success is measured by **time allocation** (how much time a member spends fundraising vs. legislating) or **legislative output** (bill sponsorship rates), not by dollar volume.
  *   **Why it works:** It targets the *demand side* of the influence market (the official's need for resources) rather than the *supply side* (the donor's ability to give). Because it changes the *need* for the money, rather than the *pipe* the money flows through, a shift in channel does not negate the reform. If money moves to a SuperPAC but the candidate no longer needs the SuperPAC to win because they get free media, the influence is actually reduced.

  ### Summary

  *   **Name:** Operational Surrogation (a structural form of Goal Displacement).
  *   **Core:** The operational definition required to write the law replaces the theoretical goal of the law in the evaluation of the law.
  *   **Intentionality:** Structural; requires no bad faith.
  *   **Non-Instance:** Demand-side reforms that reduce the *value* of money rather than restricting the *flow* of money, evaluated by behavioral metrics (time, dependency) rather than transactional metrics (dollars).

  You are not getting annoyed at the same article; you are identifying a systemic validity error in how policy is constructed and audited. The "water" moves because the "bucket" was the only thing the law could hold, and the "scoreboard" only counts water in that specific bucket.
