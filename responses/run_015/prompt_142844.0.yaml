answer: |-
  You have spotted the motte-and-bailey correctly. The blog post you describe mixes genuine anthropological insights with a nihilistic conclusion that does not follow from the premises. It is a sophisticated piece of sophistry, and your discomfort with it is warranted. Let us audit the claims one by one, then look at your "who gets bumped" test.

  **Claim 1: "Corruption" is a 1990s Western invention.**
  *Verdict: Etymological red herring.*
  A defender of universalism would concede that the *term* has been operationalised by development agencies recently. They would reject the idea that the *concept* is new. Abuse of entrusted power for private gain is condemned in the Arthashastra, Roman law, and Islamic jurisprudence long before the World Bank got involved. The word's history does not dictate the morality of the act. Rotting meat is still rotten even if you rename it.

  **Claim 2: The definition assumes a Weberian bureaucracy.**
  *Verdict: Fair hit, but overstated.*
  This is the strongest point in the relativist's arsenal. The definition of corruption does presuppose a distinction between the public office and the private individual. In societies where the leader *is* the state (patrimonialism), this distinction collapses. However, most modern societies, including those in the Global South, are striving for exactly that distinction because citizens demand it. To say the definition is circular is to ignore that the "public good" is a recognizable concept across cultures, even if the institutional machinery differs.

  **Claim 3: Bribe = Gift (Cultural Relativism).**
  *Verdict: Conflation.*
  This is where the argument slips. A gift establishes a relationship; a bribe purchases a specific outcome. If you give a official Diwali sweets, you expect them to remain friendly. If you give them an envelope, you expect them to ignore a regulation. The former is social glue; the latter is a transaction. Cultures distinguish between these constantly. To conflate them is to ignore the intent of the giver and the expectation of the receiver.

  **Claim 4: Mauss says all gifts create obligation, so all gifts are bribes.**
  *Verdict: The sneaky step.*
  You were right to smell something here. Mauss argued that gifts create social bonds, but he did not argue that all social bonds are corrupt. The relativist is committing a category error. The obligation created by a birthday present is generalised reciprocity (I give you something now, you give me something sometime, perhaps to someone else). The obligation created by a bribe is specific reciprocity (I give you this now, you vote for my tender next Tuesday). Collapsing this distinction makes the word "bribe" useless, which is exactly what the relativist wants, but it does not make the distinction unreal.

  **Claim 5: Clientelism is just corruption with relationships.**
  *Verdict: Description, not justification.*
  Ethnographers would agree that clientelism functions through relationships. However, they would reject the implication that this makes it morally neutral. An ethnographer spent two years in a village would tell you that while people understand *why* clientelism happens (survival, lack of trust in institutions), they often hate it. They know it means the clinic runs out of medicine because the stock was diverted to a cousin. Recognising the mechanism is not endorsing the morality.

  **Claim 6: Conclusion (Corruption is just power prohibiting stuff).**
  *Verdict: Non-sequitur.*
  This does not follow from the parts. Even if the definition of corruption is culturally situated, it does not mean there is no factual difference between a fair process and a rigged one. The conclusion relies on a radical scepticism that undermines itself. If "corruption" is just power, then the relativist's own argument is just power too.

  **The Ethnographer's View**
  Someone who actually does the fieldwork would reject the "it's all just power" summary. They would argue that context determines meaning, but not that anything goes. They distinguish between *generalised reciprocity* (building community trust) and *negative reciprocity* (exploitation). They would tell you that the sweets are fine because they are consumed socially and create no specific debt of office. The wine is risky because it is private, valuable, and easily converted into a sense of specific indebtedness. The line is not arbitrary to the participants; it is felt.

  **The "Who Gets Bumped" Test**
  Your test is promising but needs tuning. You are worried it over-catches competitive losses and under-catches systemic capture.

  To fix the over-catching: The test is not whether someone is worse off, but whether they were worse off *due to a violation of the rules*. In a fair tender, competitors get "bumped" because their bid was inferior. That is legitimate harm. In a corrupt tender, they get bumped because the criteria were altered or ignored. The harm is not the loss of the contract; the harm is the loss of a fair chance. So, refine the test: *An exchange is corrupt if it induces the official to violate the procedural rules of their role, thereby depriving a third party of a fair opportunity.*

  To fix the under-catching (capture): Here, the "third party" is not a specific competitor, but the public trust itself. Regulatory capture bumps the citizenry. They are worse off because the regulation serves the industry rather than safety. Your test can handle this if you define the "role requirement" broadly. The official's role is to serve the public interest, not the industry's interest. If the exchange shifts their loyalty, the "bump" is suffered by the public collectively.

  **Does the conclusion follow?**
  No. The relativist argument relies on sliding between "definitions vary" and "reality varies". Yes, the £25 limit is arbitrary. It is an administrative bright line designed to save you from having to make a philosophical judgement every time a box of chocolates arrives. It is a compliance threshold, not a moral event horizon. But the difference between the chocolates and the £40 wine is not just the price; it is the capacity of the wine to create a specific, private obligation that competes with your public duty.

  The universalist does not need to prove that Western bureaucracy is the only valid system. They only need to prove that when you undertake a role defined by specific rules (like managing public contracts), violating those rules for private gain is distinct from normal social bonding. The blog post tries to dissolve that distinction by dissolving the concept of duty itself. You do not need to accept that to acknowledge that cultural context matters.

  Your instinct is correct. The sweets maintain the relationship required to do the job smoothly. The wine risks purchasing influence over how the job is done. The £25 limit is a crude tool, but it cuts along the grain of that distinction. Keep logging the wine.
