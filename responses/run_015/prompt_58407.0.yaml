answer: |-
  Dear Friend,

  I have been reflecting on your defense of the resolute choice model in the context of the absent-minded driver problem, and while I share your attraction to the clarity it brings to agency under imperfect recall, I believe there are significant vulnerabilities that deserve careful scrutiny. Your position holds that rationality consists in selecting the ex ante optimal tendency, such as exiting with a one-third probability, and adhering to it without reconsideration at the intersection. This avoids the dynamic inconsistency that plagues other accounts, but it does so by insulating the planning self from the acting self in a way that may be too rigid or even vacuous. To understand the stakes, we should look at how the resolute view handles specific variations of the case, beginning with a scenario where the driver has the option to pay a small cost to leave a mark at the first intersection.

  Imagine the driver can purchase a flare gun before the trip for a cost that reduces the final payoff by a negligible amount, say zero point one. If fired at the first intersection, the second intersection becomes distinguishable. A standard instrumental rationality model suggests the driver should buy the flare, fire it at the first exit without stopping, and then exit at the second, securing a payoff of roughly three point nine. A resolute chooser who views resoluteness as the primary virtue might hesitate here, fearing that acquiring distinguishing information invites the temptation to reconsider. However, if the resolute chooser refuses the flare solely to maintain the purity of the imperfect recall condition, they sacrifice expected utility, ending up with the ex ante optimal expected value of roughly one point three three. This reveals a structural failure if resoluteness is interpreted as a prohibition on information gathering. If, however, the resolute chooser accepts the flare as part of the ex ante plan, then resoluteness collapses into standard precommitment strategy. The vulnerability here is not that the driver fails to maximize, but that the theory must explain why the moment of intersection is normatively inert. If the driver can plan to mark the road, they are admitting that the intersection state matters, which undermines the claim that the driver must ignore their location to be rational. A defender of resoluteness would likely accept the cost of the flare as a rational precommitment, but this concedes that the core work is being done by ex ante planning rather than the specific psychological stance of resoluteness at the intersection.

  Consider next a variant with three indistinguishable intersections and a adjusted payoff structure, where exiting at the first yields zero, the second yields zero, the third yields four, and passing all yields one. The ex ante optimal probability of exiting shifts, requiring a more complex randomization strategy to maintain. The vulnerability here concerns the psychological plausibility of the resolute stance. In the two-exit case, maintaining a one-third tendency is difficult but conceivable. In the three-exit case, the driver must maintain a specific probability distribution without any feedback on whether they have passed an exit. If the driver feels a surge of anxiety or a shift in belief at the third intersection, perhaps suspecting they have traveled too far to still be at the first, the resolute instruction is to ignore this feeling. This demands a level of cognitive dissociation that borders on the implausible. If the theory predicts that a rational agent can and should ignore all experiential evidence accumulated during the trip, it risks making rationality incompatible with human psychology. A defender might argue that rationality is normative, not descriptive, and thus should not bow to psychological difficulty. However, if the cost of maintaining resoluteness includes high cognitive load or stress that reduces the effective payoff, the ex ante calculation should account for this. If the theory ignores these internal costs, it makes an implausible prediction about what the driver can sustain; if it includes them, it again reduces resoluteness to a standard cost-benefit analysis of willpower.

  A third variant involves a driver who knows they are not fully resolute and anticipates a predictable pattern of future reconsideration. Suppose the driver knows that upon arriving at an intersection, they will inevitably update their beliefs based on the fact that they are there, leading them to exit with a higher probability than planned. This is the heart of the Piccione and Rubinstein critique, which shows that if you assume the agent will optimize at every node given their beliefs, the ex ante optimal plan is not sustainable. A sophisticated agent anticipates this weakness and chooses a different ex ante plan that accounts for the future deviation. A resolute agent, by contrast, plans to ignore the deviation. The vulnerability is that the resolute agent is effectively planning a lie to their future self. If the future self is the same person with the same access to reasons, why should the future self be bound by the past self's command to ignore evidence? This touches on intuitions about personal persistence. If we view the driver as a sequence of temporal selves, resoluteness looks like tyranny by the past self. If we view the driver as a single persisting agent, resoluteness looks like a refusal to update on available evidence. Defenders of resoluteness, following McClennen, would argue that rationality is a property of the whole plan, not the individual nodes, and that separability is the error. They would regard the objection about ignoring evidence as a misunderstanding of the normative status of the plan. However, this leaves them open to the charge that they are defining rationality in a way that disconnects it from the agent's actual reasons for action at the time of action.

  When we look at formal work on imperfect recall, the tension is sharp. Standard game theory treats the agent as playing against themselves in a game of imperfect information, requiring a consistent equilibrium across all information sets. Resoluteness violates the principle of separability, which states that preferences over future outcomes should not depend on past choices that are now sunk. By violating separability, resoluteness avoids the paradoxes of dynamic inconsistency but at the cost of making the agent's choices at a given node dependent on constraints imposed by a previous node that no longer exists. Comparisons with ordinary cases of planning and temptation, such as Ulysses tying himself to the mast, suggest that resoluteness is most plausible when there is a clear conflict between long-term and short-term interests. But in the absent-minded driver case, there is no temptation in the hedonic sense; there is only ignorance. The driver does not want to exit early; they simply do not know where they are. Treating ignorance as a temptation to be resisted via resoluteness seems to miscategorize the problem. It suggests the driver is fighting themselves rather than fighting the lack of information. This is a genuine liability that defenders must accept: they must argue that the structure of the decision problem itself creates a conflict that justifies binding the future self, even without a change in desires.

  This brings us to the most serious concern regarding the flexibility of the resolute view. You asked whether the view stakes anything on how these cases turn out or whether it can be restated to absorb any outcome. There is a risk that resoluteness becomes a label for whatever strategy maximizes ex ante utility, including the strategy of being flexible. If the resolute theorist says that one should be resolute unless being sophisticated yields a higher ex ante payoff, then resoluteness is no longer a distinct normative principle but merely a description of the ex ante optimum. This flexibility should worry you because it renders the theory unfalsifiable. If the theory allows the agent to choose resoluteness or sophistication based on which pays better, then the claim that rationality consists in resoluteness is false; rationality consists in maximizing ex ante utility, and resoluteness is just one possible tool. To avoid this vacuity, the resolute theorist must claim that resoluteness is required even in cases where sophistication might yield a marginally higher payoff, or that sophistication is not truly available to a rational agent. But if they take this hard line, they face the vulnerabilities described in the variants above, such as refusing useful information or demanding impossible psychological feats.

  In conclusion, while the resolute position offers a compelling way to bypass the paradoxes of imperfect recall by prioritizing the planning self, it faces significant challenges in distinguishing itself from standard sophisticated planning. The variant cases show that if resoluteness is too rigid, it loses utility; if it is flexible enough to regain utility, it loses its distinctiveness. The formal violation of separability is a cost defenders accept, but the disconnect between the agent's reasons at the time of action and the plan's requirements remains a deep philosophical liability. If the view can absorb any outcome by adjusting what counts as part of the ex ante plan, it risks becoming an empty tautology about maximizing expected utility. You should be worried if your attraction to resoluteness depends on it providing a unique account of agency, because it may simply be a redescription of consequentialism over time. However, if your goal is simply to secure the ex ante optimum against the erosion of dynamic inconsistency, the resolute view succeeds, provided you are willing to accept that rationality sometimes requires ignoring the evidence of your own eyes.

  Sincerely,

  A Philosophical Correspondent
