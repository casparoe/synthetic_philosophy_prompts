answer: |-
  # Session Plan: The Chameleon Character
  **Topic:** Virtue Ethics vs. Situationism (Global Traits vs. Contextual Variability)  
  **Duration:** 60 Minutes  
  **Participants:** 14 Students (Ages 16–18)  
  **Materials:** Envelopes, Decision Sheets, Timer, Whiteboard, Two distinct background audio tracks (optional: calm ambient vs. ticking clock).

  ---

  ## I. Learning Objectives
  1.  **Experience** the tension between attributing stable character traits and observing situational variability.
  2.  **Analyze** the Situationist Critique: Do global traits exist if behavior flips based on framing?
  3.  **Evaluate** the Virtue-Ethical Reply: Can *phronesis* (practical wisdom) and thresholds explain the variability without discarding traits?

  ---

  ## II. Simulation Design: "The Allocation Game"

  ### 1. Roles (Split the group)
  *   **7 Principals (Agents):** They make the decisions. They sit at the front or in a distinct circle.
  *   **7 Assessors (Observers):** They watch specific Principals and rate their character. Pair each Assessor with one Principal.

  ### 2. The Concealed Payoff Structure
  The mathematical payoff is **identical** in both rounds, but the *emotional framing* changes.
  *   **The Task:** The Principal receives 10 Tokens. They must decide how many to keep and how many to give to their Partner (the Assessor).
  *   **The Math:** 1 Token = 1 Point toward a prize (e.g., candy, extra break, or simply "winning" the round).
  *   **The Concealment:** Students are told the *goal* of the game changes, but the rules (1 Token = 1 Point) remain constant. The variability in behavior is driven by **Time Pressure** and **Social Framing**, not mathematical incentives.

  ### 3. The Two Rounds

  #### Round 1: "The Collaboration" (Low Stress / Pro-Social Frame)
  *   **Instruction to Principals:** *"You are building a long-term partnership. Take your time. Consider what your partner needs. There is no time limit. The goal is mutual success."*
  *   **Ambient Framing:** Calm music or silence. Facilitator speaks softly.
  *   **Expected Behavior:** Principals tend to give more tokens (5–8) to appear cooperative/kind.
  *   **Assessor Task:** After the decision, Assessors rate their Principal on a "Character Card" (Scale 1–10 on *Generosity* and *Integrity*).

  #### Round 2: "The Efficiency Audit" (High Stress / Self-Protection Frame)
  *   **Instruction to Principals:** *"We are behind schedule. This is now an individual performance audit. You must finalize your allocation immediately. Errors will be penalized. Focus on securing your own quota."*
  *   **Ambient Framing:** Loud ticking clock sound (phone speaker). Facilitator speaks briskly/loudly. Use a visible countdown timer set to 60 seconds.
  *   **Expected Behavior:** Principals tend to keep more tokens (7–10) to secure their "quota" under stress.
  *   **Assessor Task:** Assessors rate the *same* Principal again on a new "Character Card."

  ---

  ## III. Step-by-Step Run of Show (60 Minutes)

  ### 0:00–0:05 | Introduction (No Jargon)
  *   **Facilitator:** "Today we are testing a question: Is who you *are* separate from where you *are*? If you are an 'honest person,' should you be honest everywhere? Or does the room you are in change you?"
  *   **Setup:** Assign roles. Seat Principals facing Assessors. Hand out envelopes labeled **ROUND 1**.

  ### 0:05–0:20 | Simulation Phase
  *   **Round 1 (7 mins):** Read the "Collaboration" script. Let them decide. Collect tokens. **Assessors fill out Card 1 (Green).**
  *   **Transition (1 min):** Collect Round 1 sheets. Hand out envelopes labeled **ROUND 2**. Change the room energy immediately (turn on timer sound, stand up, move faster).
  *   **Round 2 (7 mins):** Read the "Audit" script. Emphasize urgency. **Assessors fill out Card 2 (Red).**

  ### 0:20–0:25 | The Reveal
  *   **Facilitator:** "Stop. Look at your two Character Cards. Did the score change?"
  *   **Data Check:** Ask Principals: "Did the rules of math change?" (No). "Did the tokens change value?" (No).
  *   **Visual:** Write two averages on the board: *Avg. Tokens Given (Round 1)* vs. *Avg. Tokens Given (Round 2)*.
  *   **Key Point:** "The agent is the same. The math is the same. The behavior flipped. Why?"

  ### 0:25–0:55 | Structured Debrief (The Philosophical Core)

  #### Part A: The Situationist Critique (10 mins)
  *   **Question:** "Assessors, did you label your Principal 'Generous' in Round 1? Did you label them 'Selfish' in Round 2?"
  *   **Concept:** Introduce **Global Traits** (Virtue Ethics) vs. **Local Dispositions** (Situationism).
  *   **Discussion:** If behavior changes this easily with just a timer and a sentence, do "Global Character Traits" exist? Or are they just stories we tell to make sense of chaos?
  *   **Situationist Claim:** Behavior is a function of the Person × The Situation. If the Situation variable is strong enough, the Person variable disappears.

  #### Part B: The Virtue-Ethical Reply (10 mins)
  *   **Facilitator:** "A Virtue Ethicist (like Aristotle) wouldn't surrender yet. They argue that Virtue requires **Practical Wisdom** (*Phronesis*)."
  *   **Concept:** Virtues are not robotic reflexes. They are skills.
  *   **The Threshold Argument:** "Imagine 'Courage.' If you put a person in a burning building, they might freeze. Does that mean they lack courage? Or does it mean the situation exceeded the **threshold** where their virtue could activate?"
  *   **Application:** "In Round 2, did the 'Audit' frame create a threat that bypassed your moral reasoning? Did you go into survival mode?"
  *   **Key Distinction:** Situationists say the trait *doesn't exist*. Virtue Ethicists say the trait exists but requires the right *conditions* (thresholds) to be visible.

  #### Part C: Limitations & Failure Modes (5 mins)
  *   **Facilitator:** "What did this simulation fail to show?"
  *   **Answer:** It showed external pressure, but it couldn't show **Internal Recognition**.
  *   **Explanation:** Practical wisdom is the ability to *notice* the moral demand. In Round 2, the framing hid the moral demand (it looked like a math task, not a moral one). A truly virtuous person might have seen through the 'Audit' frame and given tokens anyway. The simulation punished that insight with stress, but in real life, *phronesis* allows you to override the stress.

  ### 0:55–1:00 | Closing Reflection
  *   **Prompt:** "Next time you judge someone (or yourself) as 'lazy' or 'kind,' ask: Is this a global trait, or is this a Round 2 Audit Frame?"

  ---

  ## IV. Facilitator Notes & Warnings

  ### 1. The Predictable Failure Mode: "Demand Characteristics"
  *   **Risk:** On the first run, students may realize you are testing their consistency. They might deliberately give the same amount in Round 2 to prove they are "consistent."
  *   **Mitigation:**
      *   Do not tell them you are studying *consistency*. Tell them you are studying *decision efficiency*.
      *   Make the stress in Round 2 **genuine**. Use a real reward for high individual scores (e.g., "Top 3 scorers get first pick of snacks"). If there is a tangible cost to generosity in Round 2, the situational pressure will override the desire to look consistent.
      *   **Backup Plan:** If behavior *doesn't* change significantly, pivot the debrief. Ask: "Why did the situation fail to change you? Is your generation more resilient? Or did the framing not work?" This still explores the Person/Situation interaction.

  ### 2. What the Simulation Cannot Reproduce
  *   **The Internal Threshold:** The simulation manipulates *external* pressure (time, noise). It cannot replicate the *internal* threshold of Practical Wisdom.
  *   **Why this matters:** In the simulation, the "Virtue" is suppressed by stress. In Virtue Ethics, a fully virtuous agent is supposed to have a *higher* threshold—they remain calm under pressure. Because these are high school students (still developing *phronesis*), they will likely crumble under the Round 2 stress.
  *   **Explicit Explanation:** You must tell them: *"This simulation shows how easily situation overpowers us. A Virtue Ethicist would say a fully mature moral agent would have recognized the 'Audit' was a false frame and acted generously anyway. We are testing average dispositions, not perfected virtue."*

  ### 3. Managing the "Halo Effect"
  *   **Risk:** Assessors may refuse to lower their Round 2 rating even if the Principal kept all the tokens. They might say, "They were just stressed."
  *   **Instruction:** Tell Assessors: *"Rate the behavior you saw, not the person you think they are. If they kept the tokens, rate the Generosity low for this round."*
  *   **Philosophical Value:** If they refuse to lower the rating, you have demonstrated **Trait Resilience**. This is a great data point for the debate (evidence *for* global traits).

  ### 4. Ethical Debriefing
  *   Since this uses mild deception (framing the math as different when it is the same), you must **debrief the deception** explicitly at the end.
  *   **Script:** "We told you the goal changed. It didn't. We wanted to see if the *feeling* of the goal changed your action. This is exactly what Situationists study: how invisible frames control visible choices."

