answer: |-
  **Handout: Week Six — Omelas and Structural Optimism**

  By week six, you have likely settled into reading *The Ones Who Walk Away from Omelas* as a utilitarian critique: a challenge to the calculus that permits local suffering for global happiness. Today, we complicate that reading by applying a Leibnizian lens. We are not asking whether Omelas is *useful*, but whether it is *optimal*. We are testing "Structural Optimism": the claim that value attaches to whole worlds as maxima, and that no local evil can be excised without global loss. We strip away the theological props—no God, no Fall, no afterlife compensation—to see if the machinery holds.

  **Crux 1: The Child in the Basement (Means vs. Concomitant)**
  Your notes distinguish between evils that are unavoidable concomitants of a package of goods and evils that function as means to goods. Leibniz insists God permits the former (*conditiones sine qua non*) but never wills the latter. To will evil as a means is to make it an instrument, which contradicts divine goodness.
  *   **The Leibnizian View:** The child's suffering must be a metaphysical necessity of *this* specific compossible world, not a causal price paid to buy prosperity.
  *   **The Story:** Le Guin writes that prosperity "depends entirely" on the child's misery and would "wither" if the child were relieved. This sounds instrumental—a price paid, not a structural shadow.
  *   **Verdict:** Here the lens cracks. If the dependence is brute causality, Omelas is utilitarian, not Leibnizian. Leibniz can only absorb this if the suffering is logically incompossible with the joy, not merely causally linked. The story suggests the latter; Leibniz requires the former.

  **Crux 2: The Citizen Who Stays (Spectatorial vs. Authorizational)**
  You separated the participatory objection (causal sustenance), the spectatorial (knowing and staying), and the authorizational (ratifying the arrangement).
  *   **The Leibnizian View:** Leibniz absorbs the spectatorial objection easily. God sees all evil and permits it for the sake of the whole. The citizen who weeps but stays mirrors the rational agent who recognizes the necessity of the global maximum. However, the authorizational objection is harder. Leibniz argues God permits evil but does not author sin.
  *   **The Story:** The citizens are told the terms and explicitly accept them. They do not merely permit; they ratify.
  *   **Verdict:** Structural Optimism can absorb the spectatorial stance (accepting the world as given) but struggles with the authorizational. In a secular framework, without a divine will to bear the burden of authorization, the citizens become co-authors of the evil. Leibniz's machinery protects God from this; it offers no protection for the citizen.

  **Crux 3: The Ones Who Walk Away (The Maximum)**
  You raised the "no-maximum" worry: if for any possible world there is a better one, optimism fails. Leibniz argues there is a unique best world.
  *   **The Leibnizian View:** If Omelas is the best possible world, there is nowhere better to go. To walk away is to pursue a logical impossibility or a lesser good.
  *   **The Story:** The walkers go toward a place "even less like Omelas." The narrator cannot describe it, but implies it exists.
  *   **Verdict:** This is the genuine counterexample. The walkers imply either that Omelas is not the maximum (there is a better world without the child) or that some goods are morally inaccessible regardless of optimality. Leibniz cannot accommodate the walkers unless their destination is illusory. If their destination is real, Structural Optimism collapses.

  **Does Structural Optimism Collapse Without God?**
  Yes, largely. Leibniz's system relies on a divine intellect to compare possible worlds and select the maximum. Without a chooser, the claim that *this* world is the "best" loses its normative force and becomes mere fatalism ("this is what exists"). Furthermore, without post-mortem compensation, the child's suffering remains a net loss. A secular structural optimism must argue that the global whole is valuable enough to outweigh the unredeemed suffering of the part. This is a harder sell than Leibniz's, where the child might ultimately be compensated in the City of God.

  **What the Story Adds**
  You guessed the story contributes a phenomenology of refusing benefit. You are correct, but it goes further. It exposes the texture of the "good" itself. In Leibniz's abstract calculus, the good is a sum. In Omelas, the good is tainted. The story suggests that a good purchased at the price of another's suffering is not the *same* good as one achieved without it, regardless of the hedonic sum. The music of Omelas is less beautiful because of the child's silence. Leibniz argues the whole is perfect; Le Guin suggests the whole is corrupted by its necessary parts. The story forces us to ask whether a world containing unredeemed suffering can ever be a maximum, or whether the very presence of such suffering disqualifies it from optimization entirely.
