      *   *Principle:* **The Principle of Comprehensive Option Description.** Revealed preference is valid *only if* the options being compared are described comprehensively enough to include the epistemic and psychological conditions of the choice itself. If the description is too narrow (e.g., just "$50" vs. "Gamble"), RPT yields a misleading account of fundamental value.

  4.  **Evaluate the Verdicts against the Principle:**
      1.  *Choc/Van:* Options are physically identical except taste. Comprehensive description matches physical. Verdict saved.
      2.  *Price:* Cost is part of the option description. Verdict saved.
      3.  *Gamble:* Option is "$50 + No Anxiety" vs. "Gamble + Anxiety". RPT holds, but we acknowledge the "Anxiety" term. Verdict saved (it reveals risk/temperament, not just monetary value).
      4.  *Ignorance:* Option is "Salmon + Ignorance" vs. "Special + Knowledge". Choice reveals preference for the bundle. Verdict saved.
      5.  *Ballot:* Option is "Vote A + Privacy" vs. "Advocate B + Social Cost". These are different actions. The conflict arises from conflating "Policy Preference" with "Action Preference". Verdict saved by distinguishing the two.

  5.  **Address the Test Case (IQ Test):**
