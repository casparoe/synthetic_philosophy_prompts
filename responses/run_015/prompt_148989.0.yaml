      *Key Insight for Case 5:* The ballot case is slightly different. It's about *revealing* vs. *having* a preference. In public, the "price" of voting B is social ostracization. In private, the price is zero. This is actually just Case 2 (Price) again. The user feels torn because they think "Preference" should mean "Political Conviction," not "All-things-considered Choice." I need to highlight this distinction: **All-Things-Considered Preference (ATC)** vs. **Fundamental Value**. RPT reveals ATC. The user wants Fundamental Value. The principle must bridge these.

      *Revised Principle:* **The Two-Tier Utility Principle.**
      1.  *Revealed Utility:* Ranking of available actions (includes costs, risks, epistemic states). This is what RPT measures.
      2.  *Fundamental Utility:* Ranking of final world states (excluding the cost of choosing).
      *   *Verdict:* RPT correctly identifies Revealed Utility. Your intuitions correctly identify that Revealed Utility $\neq$ Fundamental Utility in cases of epistemic manipulation.
      *   *This is stronger.* It admits RPT is right *about choice*, but wrong *about welfare* if not adjusted.

