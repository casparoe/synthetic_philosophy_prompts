      *   **The Winning Point:** If it were just money, they'd stop when comfortable. They don't. They keep grinding because the *culture* of the metric demands it. Therefore, culture (the meaning of the metric) causes the behaviour (asceticism), which causes the economics.

  5.  **Writing - Focus on Voice:**
