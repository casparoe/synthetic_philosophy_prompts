          *   **Niche Twist:** Apply Weber's "elective affinity" to modern startup culture (ascetic discipline driven by VC metrics vs. theology). Does this extend or collapse Weber's logic?
          *   **Format:** Dialogue/Scene (no footnotes, bibliographies, etc.).
