  The pub was thick with the smell of stale ale and damp coats, a low hum of Friday evening chatter filling the gaps between their sentences. Mara swirled the dregs of her porter, watching the foam settle, while Jonah leaned forward, elbows on the sticky table, pointing a finger that smelled faintly of tobacco.

  'You're romanticising the ghost in the machine, Mara,' Jonah said, his voice tight. 'You keep talking about values as if they have legs. They don't. They're exhaust fumes. The bourgeoisie needed a labour force that wouldn't drink away its wages on a Monday, so they championed a theology that called drunkenness a sin. The economics came first. The sermon was just the justification.'

  Mara set her glass down with a deliberate clink. 'That's the vulgar Marxist reading, and you know it's too clean. If economics determined culture so neatly, every mercantile society would have produced industrial capitalism. They didn't. China had the trade; India had the capital. They didn't have the specific psychic drive. Weber wasn't saying Calvinists invented capitalism. He said the *anxiety* of predestination created a behavioural pattern that made capitalism inevitable.'

  'Anxiety is a material condition,' Jonah countered. 'Fear of hell is just fear of social ostracisation dressed up in metaphysics. It's about status. It's about signalling you're one of the elect so you get the contract. It's rational action masked as piety.'

  'But that's where you lose the thread,' Mara said, leaning in. 'Because if it were just rational signalling, you'd stop signalling once the cost outweighed the benefit. But they didn't. They kept working. They kept accumulating. They denied themselves the enjoyment of the wealth they created. That's not rational economics. That's cultural compulsion. The value system locked them into a behaviour that economics alone wouldn't dictate.'

  Jonah took a long pull of his lager, wiping his mouth with the back of his hand. 'Alright. Let's bring it home. You want causal power? Look at the tech sector. Look at Silicon Valley, or Shoreditch, or wherever the kids are coding themselves into an early grave these days. You've got founders working hundred-hour weeks. Sleeping under desks. Eating meal replacements. It looks like asceticism, doesn't it?'

  'It looks exactly like the Protestant Ethic,' Mara said.

  'Does it?' Jonah shook his head. 'Or is it just the burn rate? They work because if they don't, the venture capital dries up. They lose the house, the status, the equity. That's not elective affinity; that's a gun to the head. The "mission statement" is the hymn sheet, but the material interest is the only thing loading the weapon. They say they're "changing the world," but they're really just chasing an exit strategy. It's post-hoc rationalisation. They tell themselves it's a calling so they can bear the grind.'

  Mara paused. She picked up a coaster and began to fold it corner to corner. 'You're describing the constraint, Jonah. Not the motivation. Yes, the VC metrics create the pressure. But why does the founder internalise that pressure as a moral virtue? Why is "growth" good in itself?'

  'Because growth equals money.'

  'No,' Mara said sharply. 'Because growth equals *salvation*. Think about it. In Weber's model, you don't know if you're saved. You look for signs. In startup culture, you don't know if you're a genius or a fraud until the IPO. The valuation metrics are the new predestination. You can't control them directly; you can only work harder, optimise more, deny yourself sleep. The metric becomes the deity.'

  Jonah scoffed. 'That's poetic, but it doesn't change the material outcome. The VC gets the return.'

  'But the mechanism is cultural!' Mara insisted. 'If it were purely economic, you'd optimise for profit maximisation per hour. You'd work less. But the culture of the startup demands *ascetic discipline* regardless of efficiency. They burn cash to grow. They prioritise scale over revenue. That's irrational economically. It only makes sense if you accept the cultural premise that "growth" is a moral imperative. The venture capital metric creates an elective affinity with a specific type of human behaviour—secular monkhood. And that behaviour *causes* the economic outcome. Without the belief in the metric, the labour wouldn't happen.'

  Jonah went quiet. He traced the condensation on his glass. 'You're saying the metric functions as theology.'

  'I'm saying the affinity is real,' Mara said. 'The VC doesn't just give money; they impose a culture. They select for founders who believe in the gospel of growth. If a founder treats it purely as a job—nine to five, rational labour exchange—they get fired. The system selects for the believers. So, the culture isn't the exhaust. It's the engine. The material constraint exists, yes, but the *meaning* attached to it drives the intensity. You can't explain the hundred-hour week with wages alone. You need the faith.'

  Jonah sat back, the tension in his shoulders dropping slightly. He looked at the coaster Mara had folded into a tight, geometric shape.

  'The selection mechanism,' Jonah murmured. 'If the capital selects for the believers, then the culture becomes a material force. Because only the believers survive the market.'

  'Exactly,' Mara said. 'The values aren't just rationalisations. They're selection criteria. If you don't believe the grind is virtuous, you exit. The ones left are the ones who treat the spreadsheet like a prayer book. So, culture causes the economic result because it filters the actors.'

  Jonah let out a short, dry laugh. 'Bloody hell. You've just argued that venture capital is a religious institution.'

  'I'm arguing that Weber was right about the mechanism, even if he got the deity wrong,' Mara said, unfolding the coaster and flattening it out. 'It's not about God. It's about the unseeable future demanding sacrifice in the present. Whether that's heaven or an IPO, the psychology is identical. And that psychology drives the labour.'

  Jonah picked up his pint, raising it slightly in a reluctant toast. 'Alright. You've got me. If the belief system is required to sustain the labour intensity that the capital requires, then culture isn't superstructure. It's infrastructure. I concede the point.'

  'Good,' Mara said, clinking her glass against his. 'Now, are you going to finish that, or can I order another round? I believe in the moral imperative of a fresh pint.'

  'Don't push your luck,' Jonah smiled. 'That's purely material necessity.'
