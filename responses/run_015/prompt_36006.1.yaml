answer: |-
  **Plan: Ellsberg for Actuaries**

  **1. Sequence & Prerequisites**
  *   **Prerequisites (3 mins):** Establish *Risk* (known probabilities) vs. *Ambiguity* (unknown probabilities). EV fluency is your base; ambiguity removes the inputs EV requires.
  *   **Setup (5 mins):** Use the Classic Two Urns. Urn A: 50 Red/50 Black. Urn B: 100 balls, unknown mix. Payoff $100 on match.
  *   **The Trap (7 mins):**
      1.  Ask: "Bet on Red?" (Most pick A).
      2.  Ask: "Bet on Black?" (Most pick A).
      3.  Reveal contradiction: Preferring A for Red implies P(Red|B) < 0.5. Preferring A for Black implies P(Black|B) < 0.5. Sum < 1. Impossible.
  *   **Objections (5 mins):** Address pushback immediately after the trap.

  **2. Handling Objections**
  *   *Risk Aversion:* Head this off **before the trap**. Note payoffs are binary ($100/$0). If P=0.5, variance is identical. The discomfort is about *parameter uncertainty*, not outcome variance.
  *   *The "Assign 50/50" Guy:* Address **during Objections**. Do not argue psychology. Argue coherence. If he assigns 0.5 via Principle of Insufficient Reason, EVs are equal. He *must* be indifferent. If he prefers Urn A, he implicitly asserts P < 0.5. You cannot hold a coherent subjective probability distribution where Urn A is preferred for *both* colors. Force him to admit his preferences violate probability axioms, regardless of the number assigned. Remind him: Subjective Expected Utility still requires probabilities to sum to 1. His preferences imply they don't. The paradox isn't picking A; it's picking A for *both* bets.

  **3. Exclusions**
  State clearly: No Savage axioms, no utility curve adjustments, no ambiguity premium formulas. We are demonstrating axiom violation, not pricing the behavior.

  **4. Closing Question**
  "If I draw from Urn B *first*, hide the ball, and then let you choose to bet on Red or Black, do you still prefer Urn A?"
  *(Target insight: They should switch to Urn B, as they can match the color, guaranteeing a win. This proves the aversion is to information asymmetry, not the odds.)*
