prompt: |-
  I was recently appointed co-executor of the literary estate of a deceased essayist, and I must now oversee the preparation of a critical edition of twelve volumes of unpublished notebooks. These notebooks are not clean drafts: they contain a primary script layer, interlinear revisions, marginal annotations in different colored inks, and cross-outs that may represent either deliberate emendation or, in annotations made during the author’s final months of documented cognitive decline, alterations of questionable authority. I need a reusable decision procedure—one that an editorial board without philosophical training can apply consistently across hundreds of ambiguous passages—to determine whether to preserve a passage in its primary form, adopt a later annotation as authoritative, or flag the passage for editorial commentary. The procedure must be grounded in what philosophy of language and literary theory actually maintain about authorial intention, textual meaning, and the authority of post-compositional revision, but translated into practical steps. In particular, it must operationalize the distinction between executive intention (the author’s decision to alter the text) and interpretive intention (the meaning the text is meant to bear), and it must specify evidentiary criteria for judging when a later layer possesses sufficient executive authority to override the primary script. For each step, please indicate what counts as sufficient evidence, where the procedure must halt because the issue is irreducibly one of values rather than recoverable fact, and where it will necessarily misfire—especially when an author’s published theoretical commitments, such as an explicit anti-intentionalist stance, appear to conflict with the interpretive implications of a revised passage. Please deliver: (1) an ordered checklist or flowchart in words that a non-philosopher can run in sequence; (2) worked applications to three cases—(a) a contradiction between the primary text and a red-ink marginal note made during the documented period of cognitive decline; (b) a cross-out that removes a metaphor the author’s published correspondence explicitly defends as essential to the argument; and (c) a case in which the procedure preserves an apparently erroneous claim that I personally believe ought to be corrected, with an explanation of why the procedure still yields that result despite my judgment; and (3) an explicit statement of what the procedure cannot settle and where decision-making must be handed over to human judgment, to be signed off by both the lead editor and the estate’s legal representative.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Co-executor of a literary estate.
      *   **Task:** Create a reusable decision procedure for editing 12 volumes of unpublished notebooks.
      *   **Complexity:** Notebooks have multiple layers (primary script, interlinear revisions, marginalia in different inks, cross-outs). Some revisions might be during cognitive decline.
      *   **Audience:** Editorial board *without* philosophical training (needs to be practical/operationalized).
      *   **Theoretical Grounding:** Must be grounded in philosophy of language/literary theory (authorial intention, textual meaning, authority of revision) but translated into steps.
      *   **Key Distinction:** Operationalize "Executive Intention" (decision to alter) vs. "Interpretive Intention" (meaning intended).
      *   **Specific Requirements:**
          1.  Ordered checklist/flowchart (words).
          2.  Three worked applications (Cognitive decline contradiction; Cross-out vs. correspondence defense; Personal bias vs. procedure).
          3.  Explicit statement of limitations (what the procedure *cannot* settle) requiring human sign-off.
      *   **Constraints:** Must identify where evidence is sufficient, where it halts (values vs. facts), and where it misfires (e.g., anti-intentionalist author).

  2.  **Theoretical Framework (Internal Knowledge Retrieval):**
      *   *Authorial Intention:* Wimsatt & Beardsley (Intentional Fallacy) vs. Hirsch (Validity in Interpretation) vs. Post-structuralism (Death of the Author).
      *   *Textual Criticism:* Greg-Bowers theory (copy-text), social text theory (McGann), genetic criticism.
      *   *Executive vs. Interpretive Intention:* This is a specific nuance. Executive = the act of changing. Interpretive = the semantic goal. A change might be executive (they wrote it) but lack interpretive authority (they didn't understand what they were changing due to decline).
      *   *Cognitive Decline:* Legal/ethical dimension regarding capacity.
      *   *Anti-Intentionalism:* If the author claimed "I don't care what I meant," does a revision count? Usually, in editing, the *act* of revision is treated as a new intention unless proven otherwise.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Goal:* Make it binary/ternary where possible (Keep Primary / Adopt Revision / Flag).
      *   *Step 1: Provenance & Chronology.* Establish the timeline. Is the revision later?
      *   *Step 2: Capacity Check.* This is crucial given the prompt's mention of cognitive decline. Need a "Red Flag" period.
      *   *Step 3: Nature of Change.* Is it mechanical (spelling) or substantive (meaning)?
      *   *Step 4: Corroboration.* Do other texts support the change?
      *   *Step 5: Theoretical Conflict.* Address the anti-intentionalist issue.
      *   *Step 6: Final Determination.*

      *Refining the "Executive vs. Interpretive" distinction:*
      *   Executive Intention is proven by the physical act (ink, hand).
      *   Interpretive Intention is proven by coherence with the wider oeuvre/correspondence.
      *   *Rule:* Executive intention overrides primary text *unless* Interpretive intention is compromised (e.g., cognitive decline) or contradicts established core arguments without explanation.

  4.  **Developing the Worked Cases:**
      *   *Case A (Cognitive Decline):* Primary text vs. Red Ink (decline period).
          *   Application: Step 2 (Capacity) triggers a halt. Default to Primary unless medical evidence suggests lucidity.
      *   *Case B (Cross-out vs. Correspondence):* Author crosses out metaphor, but letters say metaphor is essential.
          *   Application: Step 4 (Corroboration). The correspondence suggests the cross-out might be impulsive or misaligned with "Interpretive Intention." Flag or keep Primary. Let's argue for Flagging/Commentary because the *Executive* act happened, but the *Interpretive* authority is disputed.
      *   *Case C (Editor Bias):* Editor thinks text is wrong factually.
          *   Application: Step 6 (Intervention). Procedure says "Do not correct." Explanation: Editorial role is preservation of authorial voice, not truth-testing.

  5.  **Addressing the Limitations (The "Stop" Points):**
      *   Where does the algorithm fail?
      *   Value judgments (Is this change "better"?).
      *   Ambiguous capacity (Gray area of decline).
      *   Theoretical paradoxes (Author hates intention, but we are editing based on intention).
      *   Legal/Ethical liability.

  6.  **Refining the Tone:**
      *   Must be authoritative, clear, and bureaucratic enough for an editorial board but philosophically rigorous.
      *   Avoid jargon where possible, or define it immediately.

  7.  **Review against Constraints:**
      *   *Ordered checklist?* Yes.
      *   *Three worked cases?* Yes.
      *   *Explicit statement of limitations?* Yes.
      *   *Sign-off requirement?* Yes.
      *   *Operationalize Executive vs. Interpretive?* Yes, this needs to be central to the criteria.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the distinction between Executive and Interpretive clear enough for a non-philosopher?
      *   *Fix:* Define Executive as "The Hand" (physical evidence of change) and Interpretive as "The Mind" (consistency with known views).
      *   *Critique:* How to handle the anti-intentionalist author?
      *   *Fix:* Include a specific step that acknowledges the "Intentional Paradox." If the author rejected intention, we treat the *final physical state* as the text, unless capacity is in doubt.
      *   *Critique:* Make sure the "Cognitive Decline" aspect is handled sensitively but firmly.
      *   *Fix:* Create a "Medical/Chronological Threshold."

  9.  **Final Polish:** Check the structure. Ensure the "Sign-off" section looks like a formal document component. (Proceed to generate output).

  *(Self-Correction Note on Case B)*: If the author crosses it out, that is strong Executive Intention. If correspondence defends it, that is strong Interpretive Intention from an earlier time. The conflict is between *later Executive* and *earlier Interpretive*. The procedure should probably prioritize the *later Executive* unless there's evidence the cross-out was accidental or capacity was impaired. However, the prompt asks to operationalize the distinction. I will structure the procedure to flag this specific tension for commentary rather than a hard binary, as that is the scholarly safe harbor.

  *(Self-Correction Note on Case C)*: Ensure the explanation emphasizes the *editorial contract* (fidelity to the author) vs. *pedagogical correction*.

  *(Self-Correction on Limitations)*: Be explicit that this procedure cannot resolve *aesthetic* value or *moral* implications of the text.

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  # PROTOCOL FOR TEXTUAL AUTHORITY AND REVISIONARY STATUS (TARS)
  **Version 1.0 | Estate of [Author Name] | Confidential**

  ## PREAMBLE: THEORETICAL OPERATIONALIZATION
  This procedure translates complex theories of authorship into actionable editorial criteria. It distinguishes between two modes of intention:
  1.  **Executive Intention (The Hand):** Evidenced by the physical act of alteration (ink, cross-out, insertion). It proves the author *decided to change* the mark on the page.
  2.  **Interpretive Intention (The Mind):** Evidenced by coherence with the author's established arguments, correspondence, and philosophical commitments. It proves the author *understood the meaning* of the change.

  **Guiding Principle:** Executive Intention is presumed authoritative *unless* there is positive evidence that Interpretive Intention was compromised (e.g., cognitive decline, accidental mark, contradiction of core established doctrine without explanation).

  ---

  ## PART 1: THE DECISION CHECKLIST
  *To be applied sequentially by the Editorial Board for every ambiguous passage.*

  ### STEP 1: CHRONOLOGY AND MEDIUM VERIFICATION
  **Action:** Determine the temporal relationship between the Primary Script (PS) and the Revision Layer (RL).
  *   **Evidence Required:** Ink analysis, handwriting stability, notebook dating, or explicit dates on entries.
  *   **Decision:**
      *   If RL is contemporaneous with PS: Proceed to Step 2.
      *   If RL is demonstrably later: Proceed to Step 2.
      *   If RL is demonstrably earlier (e.g., underlining later crossed out): Treat RL as Primary Script.
  *   **Stop Condition:** If chronology cannot be determined via physical evidence, **FLAG FOR COMMENTARY**. Do not guess.

  ### STEP 2: CAPACITY AND CONTEXT THRESHOLD (The "Cognitive Red Line")
  **Action:** Cross-reference the date of the RL with the Author's medical/biographical timeline.
  *   **Evidence Required:** Medical records, executor logs, or correspondence indicating periods of documented cognitive decline, sedation, or incapacity.
  *   **Decision:**
      *   If RL falls *outside* documented decline periods: Proceed to Step 3.
      *   If RL falls *within* documented decline periods: **PRESUME PRIMARY SCRIPT.**
      *   *Exception:* If the RL simplifies a complex error into a known factual truth *and* matches the author's long-standing style, it may be adopted. Otherwise, revert to PS.
  *   **Stop Condition:** If the period is a "gray zone" (onset of decline but not documented), **FLAG FOR COMMENTARY**.

  ### STEP 3: NATURE OF THE REVISION (Mechanical vs. Substantive)
  **Action:** Categorize the change.
  *   **Evidence Required:** Visual inspection of the text.
  *   **Decision:**
      *   **Mechanical (Spelling, Grammar, Punctuation):** ADOPT REVISION. (Presume Executive Intention is valid; Interpretive Intention is irrelevant).
      *   **Substantive (Meaning, Argument, Tone):** Proceed to Step 4.
  *   **Stop Condition:** If the change is illegible, **FLAG FOR COMMENTARY**.

  ### STEP 4: CORROBORATION OF INTERPRETIVE INTENTION
  **Action:** Check if the RL aligns with the Author's established views in published works or private correspondence.
  *   **Evidence Required:** Index of Author's key arguments, published essays, and verified letters.
  *   **Decision:**
      *   **Aligned:** RL supports or clarifies a known argument. **ADOPT REVISION.**
      *   **Contradictory:** RL negates a core argument the Author previously defended as essential. **FLAG FOR COMMENTARY.** (Do not automatically revert to PS; the Author may have changed their mind. The Board must note the tension).
      *   **Neutral:** RL changes phrasing without altering argumentative trajectory. **ADOPT REVISION.**

  ### STEP 5: THE ANTI-INTENTIONALIST PARADOX CHECK
  **Action:** Determine if the Author publicly espoused anti-intentionalist theories (e.g., "The text belongs to the reader," "I do not control meaning").
  *   **Evidence Required:** Published theoretical statements by the Author.
  *   **Decision:**
      *   **If Author was Anti-Intentionalist:** Prioritize the **Final Physical State** of the notebook (the last mark made), regardless of whether it creates contradiction. The "death of the author" implies the "life of the document."
      *   **If Author was Intentionalist:** Prioritize **Interpretive Coherence** (Step 4).
  *   **Stop Condition:** If the Author's theoretical stance is ambiguous or evolved over time, **FLAG FOR COMMENTARY**.

  ### STEP 6: FINAL DETERMINATION
  **Action:** Apply the output of the previous steps.
  *   **Outcome A (Adopt Revision):** Replace PS with RL in the critical edition.
  *   **Outcome B (Preserve Primary):** Print PS; relegate RL to apparatus notes.
  *   **Outcome C (Flag for Commentary):** Print PS; include RL in apparatus with a standardized note: *"Revision made during [Period/Context]; authority disputed due to [Reason from Step 2 or 4]."*

  ---

  ## PART 2: WORKED APPLICATIONS

  ### Case A: The Cognitive Decline Contradiction
  **Scenario:** The Primary Script reads, "Memory is a reconstruction." A marginal note in red ink (dated during the Author's final 3 months of documented dementia) crosses this out and writes, "Memory is a recording."
  *   **Application:**
      *   **Step 1:** RL is later. (Pass)
      *   **Step 2:** RL falls *within* documented decline. (Fail)
      *   **Protocol:** The "Cognitive Red Line" triggers a presumption of incapacity. The Executive Intention (the hand moving) exists, but the Interpretive Intention (the mind understanding the philosophical shift) is compromised.
      *   **Result:** **Preserve Primary Script.** The red ink is transcribed in the apparatus with a note regarding the medical timeline.
      *   **Why:** The procedure prioritizes the integrity of the Author's competent voice over the physical fact of a late alteration.

  ### Case B: The Cross-Out vs. Correspondence Defense
  **Scenario:** The Author crosses out a metaphor comparing "language to a virus." However, in letters from the same year, the Author writes to a colleague: "The virus metaphor is the keystone of my entire theory; I will not remove it."
  *   **Application:**
      *   **Step 1:** RL is later (cross-out). (Pass)
      *   **Step 2:** No cognitive decline documented. (Pass)
      *   **Step 3:** Substantive change. (Pass)
      *   **Step 4:** Corroboration check. The RL *contradicts* explicit correspondence defending the metaphor.
      *   **Protocol:** This is a conflict between Late Executive Intention (crossing out) and Early Interpretive Intention (defending the metaphor). The procedure cannot assume the Author changed their mind versus acting impulsively.
      *   **Result:** **Flag for Commentary.** The text retains the metaphor (PS), but the cross-out is noted.
      *   **Why:** A non-philosopher board cannot adjudicate whether the Author underwent a genuine philosophical conversion or a momentary lapse. The contradiction itself is scholarly data that must be presented, not resolved.

  ### Case C: The Editor's Personal Bias (The "Error" Correction)
  **Scenario:** The Primary Script states, "Kant was born in 1725." (Factually incorrect; Kant was born in 1724). There are no revisions. You, the Editor, know this is wrong and want to correct it silently.
  *   **Application:**
      *   **Step 1:** No RL exists.
      *   **Step 2:** N/A.
      *   **Step 6:** Final Determination.
      *   **Protocol:** The TARS protocol governs *authorial* authority, not *factual* truth. There is no Executive Intention to correct the error. To correct it is to impose *Editorial Intention* over *Authorial Intention*.
      *   **Result:** **Preserve Primary Script (1725).** Add an editorial footnote: "[Author's note: Immanuel Kant was born in 1724.]"
      *   **Why:** The edition is a record of the Author's thought, not a textbook. Correcting the error silently falsifies the historical document. The procedure forces the Editor to separate their role as *scholar* (who knows the truth) from their role as *executor* (who preserves the voice).

  ---

  ## PART 3: LIMITATIONS AND SIGN-OFF REQUIREMENTS

  ### STATEMENT OF IRREDUCIBLE UNCERTAINTY
  The TARS Protocol is a tool for consistency, not a substitute for judgment. It **cannot** settle the following issues. Any decision regarding these matters requires a unanimous vote by the Editorial Board and explicit sign-off from the Estate's Legal Representative.

  1.  **Aesthetic Value:** The procedure cannot determine if a revision makes the text "better." It only determines if the revision is *authoritative*.
  2.  **The "Gray Zone" of Capacity:** Where medical evidence of cognitive decline is circumstantial rather than diagnostic, the Protocol halts at Step 2. The decision to treat the Author as competent or incompetent in these periods is an ethical/legal judgment, not a textual one.
  3.  **Theoretical Paradox:** If the Author's anti-intentionalist statements conflict with the practical necessity of editing (which requires assuming intention), the Protocol defaults to the "Final Physical State." However, if this results in a text the Author would theoretically disavow, this is a value judgment requiring Board approval.
  4.  **Moral/Legal Liability:** If a preserved passage contains defamatory, libelous, or legally actionable content, the TARS Protocol is suspended. Legal counsel overrides textual authority.

  ### AUTHORIZATION BLOCK

  **We, the undersigned, acknowledge that the TARS Protocol is binding for the preparation of the Critical Edition. We understand that where the Protocol indicates a "Stop Condition" or "Flag," the matter exceeds mechanical procedure and requires human judgment.**

  **Lead Editor:** _________________________________________________ Date: ____________

  **Co-Executor/Representative:** ___________________________________ Date: ____________

  **Legal Counsel for the Estate:** _________________________________ Date: ____________

  *(Signatures certify that the signatories have read the Limitations Statement and accept liability for decisions made outside the Protocol's automated determinations.)*
