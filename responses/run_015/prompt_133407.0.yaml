answer: |-
  **Seminar: Moral Standing and the Ethics of Blame**
  **Participants:** Philosopher A (Diachronic View), Philosopher B (Synchronic View)
  **Topic:** The Standing to Blame and the Problem of Hypocrisy
  **Case:** "Elena," a former fossil-fuel lobbyist turned climate litigator.

  **A:** Let's return to the case of Elena. She spent fifteen years lobbying against carbon regulation, actively obfuscating climate science for major oil conglomerates. Now, she leads a landmark litigation effort suing those same conglomerates for ecological damages. When she issues a public statement blaming her former employers for "moral bankruptcy," there is a palpable hesitation in the public response. We sense a deficit. My claim is that this deficit is real: Elena lacks full *standing* to blame. Her moral authority is constituted diachronically. It is built across a biography, and the residue of her past complicity cannot be fully dissolved by reform.

  **B:** I disagree. That hesitation you describe is psychological, not normative. Standing to blame is a synchronic matter. It depends on Elena's present relational position and her current moral consistency. If Elena currently upholds the norm she is invoking, and if she is not currently violating it, she has standing. Her past hypocrisy is irrelevant unless it generates a present conflict of interest—for example, if she were suing them to secure a payout she personally engineered. But if she is genuinely reformed, her past is merely history. To deny her standing is to commit a genetic fallacy regarding moral authority.

  **A:** But you're conflating the *truth* of the blame with the *authority* to issue it. Of course, the oil companies are liable. The proposition is true. But blame isn't just a truth-claim; it's a speech act that demands a certain relationship between the blamer and the blamed. When Elena speaks, she isn't just stating facts; she is positioning herself as a guardian of a norm she previously weaponized against. If standing is synchronic, you sever the link between who we are and what we say. You treat moral agents as momentary snapshots. But we experience ourselves narratively. The "hollowness" people feel isn't just bias; it's a recognition that her moral voice lacks the weight of sacrifice. She didn't pay the cost of that norm when it mattered.

  **B:** I'm not severing the link between agent and action; I'm protecting the possibility of moral redemption. If standing is diachronic in the way you suggest—if the past leaves a residue that is *never fully dissolved*, as you put it—then standing becomes unattainable for anyone with a non-ideal history. We all have dirty hands. If Elena cannot blame because she lobbied against regulations, can a reformed thief blame theft? Can a recovering addict blame substance abuse? If the past permanently attenuates standing, you create a moral caste system. The reformed are forever second-class citizens in the moral community. That discourages reform. Why switch sides if your voice on the new side will always be hollow?

  **A:** That's a pragmatic worry, not a metaphysical one. You're arguing we should *pretend* the past doesn't matter to encourage good behavior. But let's look closer at the "hollowness." It's not just that she was inconsistent; it's that her past actions contributed to the very harm she now condemns. There is a causal link. Her lobbying delayed policy, which increased the damages she now litigates. If standing is purely synchronic, you ignore this causal complicity. You allow her to claim the moral high ground on a hill she helped build. My diachronic view accounts for this: she has *some* standing, because she is currently aligned with the good. But it is compromised standing. She must acknowledge the residue. She cannot speak as a pure victim or a pure guardian. She must speak as a penitent.

  **B:** But "penitent" is a role, not a limitation on standing. If she acknowledges her past—if she says, "I helped cause this, and that is why I am stopping it now"—doesn't that satisfy the synchronic requirement? At the moment of blame, she is consistent. She acknowledges the inconsistency of her past as part of her current moral stance. The synchronic view can accommodate the history as *content*, but not as a *disqualifier*. The issue isn't that she lacks standing; it's that her blame requires a specific framing to be effective. You are mistaking the *efficacy* of blame for the *right* to blame. Just because people hesitate to listen doesn't mean she lacks the normative jurisdiction to speak.

  **A:** I think you're underestimating the normative weight of that hesitation. Standing isn't just a permission slip; it's a social status. It relies on trust. When Elena blames the industry, she is calling for sanctions. But sanctions require a community to enforce them. If the community perceives her as lacking standing, they withdraw the cooperation necessary for the blame to function. So, the "right" is constituted by the community's recognition of her biography. If you insist on a synchronic view, you risk alienating the very community whose values you claim to uphold. You prioritize the logic of the agent over the ecology of the relationship.

  **B:** But the "ecology of the relationship" can be corrupted by mob mentality. If we allow standing to be determined by the community's perception of a biography, we invite ad hominem attacks. "You drove too fast in 2010, so you can't advocate for traffic safety today." That's the tu quoque fallacy institutionalized. The synchronic view protects the norm itself from being held hostage to the messenger's history. In Elena's case, the norm is "corporations must not destroy the climate." That norm stands or falls on its own merits. If we deny Elena standing, we aren't protecting the norm; we're protecting our sense of moral purity. We are saying it's more important that the blamer be clean than that the blame be issued.

  **A:** It's not about purity; it's about fairness. There is a reciprocity condition in standing. To blame another for violating a norm, I must have submitted myself to the burden of that norm in relevantly similar circumstances. Elena avoided that burden for fifteen years. She profited while others sacrificed. Now she demands the industry sacrifice. That asymmetry creates a debt. A synchronic reformer says, "I'm consistent now, so the debt is cleared." A diachronic view says, "The debt is acknowledged, but it remains." This doesn't mean she can't blame. It means her blame comes with a caveat. She lacks the standing to blame *indignantly*. She can blame regretfully, or urgently, but not with the righteous fury of someone who never wavered.

  **B:** That distinction—between indignation and regret—is useful. But does it map to standing, or to the *tone* appropriate for the standing? I would argue she retains the standing, but the synchronic consistency requires she adjust her tone to maintain credibility. If she blames indignantly, she reveals a lack of self-awareness, which undermines her current consistency. So, on my view, if she is truly consistent *now*, she will recognize that indignation is inappropriate given her history. But if she adopts the appropriate tone, her standing is intact. You are building the tone requirement into the definition of standing itself. Why? What work is "diachronic standing" doing that "synchronic consistency with appropriate tone" isn't?

  **A:** Because tone is voluntary; standing is structural. If it's just about tone, she could choose to be indignant, and you'd say she's making a rhetorical error. I'm saying she's making a normative error. She is claiming a authority she does not possess. The work diachronic standing does is it forces us to acknowledge that moral authority is a resource that can be depleted. It's not binary. It's not that she has it or she doesn't; it's that she has less of it than someone who didn't lobby against the climate. And that difference matters when we allocate moral labor. Perhaps she shouldn't be the lead voice. Perhaps she should fund the voice of someone who has been consistent. The diachronic view helps us distribute moral roles based on moral history.

  **B:** And that is dangerous. Who decides the distribution of moral roles? If we start gatekeeping who is allowed to lead climate litigation based on a purity test of their biography, we shrink the coalition needed to solve the problem. Elena brings insider knowledge. She brings resources. If you tell her, "Your standing is attenuated, step back," you might lose the case. The synchronic view is utilitarian in a sense: it maximizes the available moral agents. It says, "If you are fighting for the right thing *now*, you are in." The diachronic view risks moral narcissism—obsessing over the cleanliness of the movement rather than the success of the movement.

  **A:** But a movement built on compromised authority is fragile. If Elena wins the lawsuit using her insider knowledge, but the public perceives her as a turncoat without standing, the precedent may be dismissed as a vendetta rather than a principle. The victory becomes personal, not systemic. The diachronic view insists that for the victory to be systemic, the authority must be robust. And robustness requires time. It requires the "residue" to be worked through, not just waved away by a change of employment. I'm not saying she must step back. I'm saying she must stand differently. She must stand *with* the residue, not pretend it's gone.

  **B:** We might be converging on the practice, but diverging on the theory. You say she must "stand with the residue." I say she must "stand with consistency." If standing with the residue means acknowledging her past to maintain current consistency, then we agree on what she should *do*. We disagree on whether her past *constitutively limits* her standing. I maintain it does not. If it did, then moral conversion would be a lie. It would mean we can change our actions, but we cannot change our moral status. That contradicts the very idea of redemption. If Elena cannot regain standing, she cannot be redeemed. She can only be managed.

  **A:** And if standing is fully recoverable synchronically, then moral history loses its gravity. It suggests we can rack up moral debts for decades and then declare bankruptcy with a single press release. That makes standing too cheap. It treats moral identity as a series of disconnected moments. I am arguing that we are our histories. If Elena is truly reformed, her history is part of her. She doesn't shed it; she integrates it. The standing isn't "regained" as if it were lost coin; it is "reconstructed" as a new structure. It will always bear the scars of the old one. That's not a denial of redemption; it's a realistic account of it. Redemption isn't erasure. It's reconciliation.

  **B:** But reconciliation with whom? If the community refuses to grant standing because of the scars, the reconciliation fails. That brings us back to the social function. If the goal of blame is to realign values, Elena's blame can realign values regardless of her scars. The oil companies are still liable. The climate is still warming. If her synchronic consistency allows her to effectively realign those values, then functionally, she has standing. Your diachronic view risks making standing an aesthetic judgment about the blamer rather than a functional tool for moral repair.

  **A:** And your synchronic view risks making moral agency atomistic. It ignores that we live in a web of obligations over time. Let's agree on this: Elena should speak. But she should speak acknowledging that her authority is complicated. Whether you call that "attenuated diachronic standing" or "synchronic consistency that requires humility," the practical outcome is the same. But the theoretical stakes differ. If you are right, she can eventually be just like someone who never lobbied. If I am right, she will always be the lobbyist-who-reformed. And that distinction should matter to how we trust her, how we follow her, and how she understands her own moral weight.

  **B:** I can accept that the distinction matters for *trust*, but I refuse to accept it matters for *standing*. Trust is empirical; standing is normative. I can trust a reformed liar less than a consistent truth-teller, but both have the standing to tell the truth. If we conflate the two, we punish the reformed for the very history that gives their reform meaning. Elena's past makes her current stance more costly, not less authoritative. She risks more by speaking now. That sacrifice should *increase* her standing, not attenuate it.

  **A:** The sacrifice increases her credibility, yes. But it doesn't erase the complicity. It offsets it. And in the ledger of standing, offsets are not erasures. But perhaps this is where we must pause. You see the ledger as balanceable; I see it as narrative.

  **B:** And you see the narrative as binding; I see it as context.

  **A:** Precisely. So, for next week: let's look at whether "narrative binding" is a feature of moral life or a bug.

  **B:** Agreed. But I'll bring the case of the reformed tyrant. Let's see if your diachronic residue holds when the stakes are higher than lobbying.

  **A:** I'll be waiting. And I'll bring the case of the consistent bigot. Let's see if your synchronic consistency holds when the history is clean but the future is bleak.
