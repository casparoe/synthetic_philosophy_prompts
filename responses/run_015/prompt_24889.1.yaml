      *   *Analogy:* A vacuum doesn't "pull"; pressure pushes into the vacuum. Similarly, the public doesn't "act" positively; it exerts force through the *absence* of resistance/responsibility.
      *   *Key Concept:* **Reflection** vs. **Action**. The Present Age is an age of reflection. Reflection postpones action. The "public" is the institutionalization of this postponement.
      *   *Key Concept:* **Irresponsibility**. Because the public is "no one," no one is responsible. This lack of accountability *is* the power. It allows for cruelty without consequence.

