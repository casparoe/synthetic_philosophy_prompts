      *   **Topic:** Moral progress via the "expanding circle" (Peter Singer's metaphor).
      *   **Key Distinctions provided by User:**
          1.  *Inclusion vs. Re-founding vs. Proliferation:* Is new moral concern just applying old rules to new cases, changing the rules, or adding new dimensions?
          2.  *Three Framings:* Descriptive (causes), Normative (was it good?), Strategic (should we push it?).
          3.  *The Unaudited Present:* The epistemic humility problem (we judge the past, but successors might judge us similarly).
      *   **Deliverables:**
          *   Defended agenda (ranked questions).
          *   For each item: Upstream impact, tractability (conceptual only), neglectedness, conditions for re-ranking.
          *   Allocation of effort across the three framings (argue against one).
          *   Identify the *Single Crux* that would reorganize the agenda.
          *   Explicitly exclude questions that don't change behavior.

  2.  **Deconstruct the Distinctions & Constraints:**
      *   *No Empirical Social Science:* This kills the "Descriptive" framing mostly. Philosophers can't do history or sociology rigorously enough to compete with historians on *causes* without data. This suggests the Descriptive framing should be minimized or dropped.
      *   *Usable by Resource Allocators:* This prioritizes the "Strategic" framing. If the work isn't actionable, it fails the mandate. However, you can't be strategic without knowing *what* is good (Normative).
      *   *Conceptual Rigor:* The group's strength. They need to clarify concepts before prescribing action.
      *   *The Unaudited Present:* This is a meta-ethical/epistemic challenge. If we can't trust our current moral vantage point, strategic action is risky. This needs addressing but shouldn't paralyze action.
      *   *Inclusion vs. Re-founding:* This determines *how* to expand. If it's inclusion, we apply existing logic. If re-founding, we need new logic. This is high leverage for practitioners.

  3.  **Determine Effort Allocation (Framings):**
      *   *Descriptive:* Drop it. Why? The constraint says "no empirical social science." Explaining *why* the circle expanded historically requires history/sociology/psychology. Philosophers speculating on causes is armchair anthropology. It doesn't help allocators decide what to do *now*.
      *   *Normative:* Essential. You can't strategize progress without defining it. But pure meta-ethics can become idle. Needs to be tethered to the "Unaudited Present" problem.
      *   *Strategic:* The end goal. Allocators need this. But strategy depends on the definition of progress (Normative) and the nature of expansion (Inclusion/Re-founding).
      *   *Decision:* **Normative** gets the largest share (40%), **Strategic** gets significant share (40%), **Descriptive** gets near zero (20% max, mostly conceptual history, not causal history). *Correction:* The prompt asks to argue *against* one being worth the time. I should argue against the *Descriptive* framing being worth *philosophical* time given the "no empirical" constraint. It's a historian's job, not a conceptual ethicist's job.
      *   *Refined Allocation:* Normative (50%), Strategic (40%), Descriptive (10% - only insofar as it informs concepts). Actually, to be bold: Argue Descriptive is a waste of *this* group's specific resources.

  4.  **Develop the Research Questions (The Agenda):**
      *   *Goal:* Rank them.
      *   *Constraint:* Must be tractable conceptually. Must matter for allocators.
      *   *Idea 1 (The Unaudited Present):* How do we act if we might be wrong? This is crucial for risk management in resource allocation.
      *   *Idea 2 (Inclusion vs. Re-founding):* Allocators need to know if they are funding "extension" (easier) or "paradigm shift" (harder/riskier).
      *   *Idea 3 (Proliferation):* Is adding a new axis (e.g., AI rights) progress or distraction?
      *   *Idea 4 (Normative Grounding):* What makes expansion *good*? (Already implied in Unaudited Present).

      *Drafting the Rank:*
      1.  **The Epistemics of the Unaudited Present:** If we can't trust our vantage point, how do we justify funding future-oriented moral change? This is the bottleneck.
      2.  **Inclusion vs. Re-founding Diagnostics:** A conceptual toolkit for allocators to classify potential projects. Is this project extending a principle or breaking it?
      3.  **The Normative Status of Proliferation:** When does adding a new moral axis count as progress vs. noise?
      4.  **Strategic Heuristics for Expansion:** How to push without backlash (conceptual, not empirical).

