      *   *Exclusions:* "What caused the abolition of slavery?" (Descriptive/Empirical). "Is moral realism true?" (Too abstract, doesn't change behavior).

  8.  **Final Review against Constraints:**
      *   *5 Philosophers, 3 Years:* Keep scope tight.
      *   *No Empirical:* Ensure questions are conceptual.
      *   *Usable by Allocators:* Ensure "Strategic" link is clear.
      *   *Three Distinctions:* Integrate Inclusion/Re-founding, Framings, Unaudited Present into the reasoning.

      *(Self-Correction during drafting)*: Make sure I explicitly state which framing gets the largest share. I will argue **Normative** gets the largest share because without solving the Unaudited Present and the Inclusion/Re-founding definition, Strategy is blind. But Strategy is the *goal*. I'll split Normative/Strategic heavily, but argue Descriptive is the waste.
