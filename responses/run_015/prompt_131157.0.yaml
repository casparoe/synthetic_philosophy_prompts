answer: |-
  ### Executive Summary: Effort Allocation

  **Largest Share: Normative (50%)**
  **Second Share: Strategic (40%)**
  **Negligible Share: Descriptive (10%)**

  **Argument Against the Descriptive Framing:**
  This group has no empirical social science capacity. The descriptive question ("What *caused* past expansions?") is a historical, sociological, and psychological question. Philosophers speculating on causal mechanisms without data produce armchair anthropology, which is neither rigorous nor usable. Furthermore, for a resource allocator, knowing *why* the circle expanded in the past (e.g., economic incentives vs. moral argument) is less critical than knowing *whether* a proposed future expansion is genuine progress and *how* to conceptualize it. The descriptive framing is a distraction for this specific team; it should be left to historians. We will treat history only as a source of case studies for conceptual analysis, not as a causal dataset.

  **The Single Crux**
  **Does the "Unaudited Present" entail moral skepticism?**

  *   **Resolution A (Yes):** Our current standpoint provides no traction for distinguishing progress from drift.
      *   **Reorganization:** The group abandons the Strategic framing entirely. The mandate shifts to defensive meta-ethics: developing a "moral risk mitigation" framework for allocators that emphasizes caution, preservation, and procedural neutrality rather than active expansion. The goal becomes avoiding moral error, not achieving progress.
  *   **Resolution B (No):** We can justify confidence in our current standpoint despite the lack of future audit.
      *   **Reorganization:** The group proceeds with the agenda below, prioritizing the Strategic framing in Year 3. The goal becomes active cultivation of expansion, accepting some risk of error as the cost of progress.

  ---

  ### Ranked Research Agenda

  #### 1. The Epistemic Policy of the Unaudited Present
  *   **Framing:** Normative / Meta-Ethical
  *   **Upstream Of:** Every other item on this list. If we cannot justify confidence in our current moral vantage point, strategic intervention is reckless.
  *   **Tractability:** High. This is a conceptual problem regarding epistemic humility and justification, solvable via argument analysis (e.g., distinguishing *fallibility* from *skepticism*).
  *   **Neglectedness:** High. The literature acknowledges the problem but rarely offers a "policy" for acting under it. Most theorists assume their standpoint is sufficiently privileged to judge.
  *   **Re-ranking Condition:** If, by Month 6, the group concludes that no non-circular justification for our current standpoint is possible, this item consumes 100% of resources (see Crux above). If a robust justification is found, this item drops to Rank 3.
  *   **Deliverable (Year 2):** A white paper titled "Moral Confidence under Epistemic Asymmetry," offering allocators a decision matrix for when to trust current moral intuitions vs. when to hedge.

  #### 2. A Diagnostic Toolkit for Inclusion vs. Re-founding
  *   **Framing:** Conceptual / Strategic
  *   **Upstream Of:** Resource allocation decisions. Allocators need to know if they are funding "logic application" (Inclusion) or "paradigm creation" (Re-founding). The risk profiles and success metrics differ radically.
  *   **Tractability:** High. Requires conceptual analysis of historical case studies (e.g., animal rights = Inclusion? Environmental ethics = Re-founding?) to derive necessary and sufficient conditions for each category.
  *   **Neglectedness:** Very High. The literature treats "expansion" as monolithic. Blurring this distinction leads to funding strategies that fail (e.g., applying rights-language to ecosystems where it may not fit).
  *   **Re-ranking Condition:** If the group finds the distinction is merely verbal (no practical difference in how one argues for the expansion), move to Rank 4. If the distinction maps onto distinct argumentative structures, keep at Rank 2.
  *   **Deliverable (Year 2):** A "Project Classification Guide" for grantmakers. It will allow them to tag proposals as Inclusion, Re-founding, or Proliferation, with associated epistemic risk warnings.

  #### 3. The Normative Status of Proliferation
  *   **Framing:** Normative
  *   **Upstream Of:** Prioritization among competing moral causes. Is adding a new axis (e.g., AI moral status) progress, or is it moral "noise" that dilutes focus on existing axes (e.g., global poverty)?
  *   **Tractability:** Medium. Requires defining "moral coherence." Does progress require unification (fewer axes) or sensitivity (more axes)?
  *   **Neglectedness:** Medium. Effective Altruism debates this implicitly, but rarely on the conceptual level of "moral dimensions."
  *   **Re-ranking Condition:** If the group determines that "Proliferation" is conceptually incoherent (i.e., all new axes must reduce to old ones), this collapses into Item 2. If it is coherent, it remains Rank 3.
  *   **Deliverable (Year 2):** A conceptual paper on "Moral Dimensionality," arguing whether resource allocators should prioritize deepening existing commitments or widening to new ontological categories.

  #### 4. Conceptual Barriers to Expansion (Strategic Heuristics)
  *   **Framing:** Strategic
  *   **Upstream Of:** Advocacy and implementation.
  *   **Tractability:** High. This involves mapping the logical and conceptual objections raised against past expansions (e.g., "animals can't reason," "women are naturally submissive") and categorizing them as *conceptual errors* vs. *boundary disputes*.
  *   **Neglectedness:** Low. Political philosophy covers this, but rarely for the purpose of *resource allocation strategy*.
  *   **Re-ranking Condition:** If Item 1 (Unaudited Present) suggests we cannot identify "barriers" reliably (because they might be truths we haven't grasped), this item is dropped.
  *   **Deliverable (Year 3):** A handbook on "Identifying Conceptual Lock-in," helping allocators spot when resistance is based on outdated moral concepts vs. legitimate trade-offs.

  ---

  ### Deliberate Exclusions

  **1. Causal Histories of Moral Change**
  *   **Reason for Exclusion:** Violates the "no empirical social science" constraint. Answering "Did slavery end because of economics or ethics?" requires data we cannot generate. Furthermore, the answer does not change behavior: knowing the *cause* of past progress does not tell an allocator whether *future* progress is desirable or how to achieve it.
  *   **Behavioral Impact:** None. An allocator does not need to know *why* the circle expanded to decide *where* to push it next.

  **2. The Meta-Ethical Truth of Moral Realism**
  *   **Reason for Exclusion:** Too abstract. Whether moral facts exist "out there" is less relevant than whether we can justify confidence in our current judgments (Item 1). A group can operate on "robust intersubjective justification" without settling metaphysical realism.
  *   **Behavioral Impact:** None. Allocators operate on justified belief, not metaphysical certainty. Resolving realism would not change a funding decision that is already based on the best available moral reasoning.

  **3. Specific Applied Ethics Cases (e.g., "Do AI have rights?")**
  *   **Reason for Exclusion:** Too narrow. The group's mandate is to produce work *usable* by allocators across domains. Solving one specific case is less valuable than providing the *toolkit* (Item 2) for them to solve it.
  *   **Behavioral Impact:** Low. Solving one case helps one cause. Providing a diagnostic toolkit helps all causes.

  ### Summary of Strategy

  This agenda prioritizes **securing the ground (Normative)** before **building the house (Strategic)**. The "Unaudited Present" is the greatest threat to the group's legitimacy; if ignored, the work is arrogant. If solved, it provides the license to act. The **Inclusion/Re-founding** distinction is the greatest lever for utility; it turns abstract philosophy into a classification system for grantmaking. By excluding empirical history and pure meta-ethics, we ensure every hour spent is convertible into decision-guidance for the people holding the resources.
