      *Check Usability:* Allocators need to know where to put money. Question 2 is very usable. Question 1 is foundational.

  5.  **Address the "Single Crux":**
      *   What changes everything?
      *   If "Moral Progress" is purely subjective/cultural vs. objective/discoverable.
      *   Better: If the "Expanding Circle" is actually a *myth* (i.e., it's just power consolidation).
      *   Best Crux based on the prompt's distinctions: **Whether Re-founding is possible.**
