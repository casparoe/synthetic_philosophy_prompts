answer: |-
  **The Vacuum and the Friction: A Verdict on Good's Theorem**

  It is a distinct pleasure to address a colleague who recognizes that the elegance of a proof is not always a guarantee of its universality. In experimental physics, we learn early that the ideal gas law is beautiful, but it breaks down the moment pressure gets too high or temperature too low. We do not say the law is "false"; we say it describes a specific regime. Your intuition regarding I. J. Good's theorem on the value of information is precisely analogous: you are sensing the friction that appears when the mathematical vacuum of the proof meets the atmospheric pressure of reality.

  The dispute you outline—whether Newcomb-style cases and information-sensitive outcomes are genuine counterexamples or merely boundary violations—is central to the philosophy of decision theory. To reach a verdict, we must dissect the proof's mechanics, weigh the strength of the purported counterexamples, and determine whether the popular slogan ("information is never worse") is a robust principle or a dangerous heuristic.

  ### The Elegant Core and Its Hidden Costs

  Let us briefly rehearse the elegance you admire, to ensure we agree on what is being defended. Good's theorem compares two strategies for an agent facing uncertainty about a state of the world $S$ and a set of actions $A$.
  1.  **Immediate Action:** Choose $a \in A$ now to maximize expected utility $E[U(a)]$.
  2.  **Delayed Action:** Observe a signal $E$ (evidence), update beliefs to $P(S|E)$, then choose $a \in A$ to maximize $E[U(a)|E]$.

  The value of the first strategy is $\max_a \sum_s P(s) U(a, s)$.
  The value of the second strategy is $\sum_e P(e) \max_a \sum_s P(s|e) U(a, s)$.

  The proof relies on the convexity of the maximum function. Essentially, the maximum of averages is less than or equal to the average of maxima. It is a mathematical tautology within the framework of probability theory.

  However, as you noted, this derivation leans on silent pillars. The most critical is **Act-State Independence**. The proof assumes that the probability distribution over states $P(s)$ is fixed prior to the decision, and that the act of observing $E$ does not causally influence $S$ or the payoff function $U$. It also assumes **Dynamic Consistency**: that the future self, upon receiving $E$, will indeed execute the utility-maximizing action defined by the current self's utility function.

  ### The Case for Genuine Counterexamples

  The strongest argument for treating Newcomb-style cases as genuine refutations is pragmatic. A theory of rationality that cannot handle predictors, correlations, or self-referential loops is, for many, no theory of rationality at all.

  Consider the variant you mentioned: a predictor has already filled a box based on whether they predict you will seek information. If you look, the predictor (having anticipated this) leaves the box empty. If you don't look, they fill it. Here, the expected utility of "looking then choosing" is strictly lower than "choosing without looking."

  Proponents of this view argue that decision theory should be *action-guiding* in the actual world, not just in a sanitized model. If the slogan "information is never worse" leads an agent to look and thereby lose money, the slogan has failed its primary function. From this perspective, the assumptions of Good's theorem are not merely boundary conditions; they are idealizations so severe that they strip the theorem of its normative force. If a physicist derived a law of motion that only applied in the absence of gravity, we might admire the math but reject the physics. Similarly, if Good's theorem only applies when information is causally inert, does it tell us anything useful about *information*, which is often causally potent?

  Furthermore, there is the issue of **logical correlation**. In Newcomb problems, the state of the world (money in the box) is correlated with your action not through causation, but through logical prediction. Standard Bayesian updating treats evidence as a window onto a fixed state. But in these cases, your decision process *constitutes* the evidence the predictor used. The "state" is not independent of the "action." If the theorem cannot accommodate the fact that agents are part of the causal fabric they are measuring, it is arguably incomplete.

  ### The Case for Boundary Artifacts

  The counter-argument, which I find more rigorous, is that these cases do not refute the theorem; they refute the *misapplication* of the theorem. This view treats Good's result like the conservation of energy: it holds strictly, provided you define the system boundaries correctly.

  In the "predictor penalizes looking" scenario, the act of looking is not a passive observation; it is a causal intervention. By choosing to look, you are effectively choosing a different world than if you choose not to look. In the language of Causal Decision Theory (CDT), the observation $E$ is not independent of the state $S$ conditional on your action. The proof of Good's theorem requires that $P(s|a, e) = P(s|e)$. In the Newcomb variant, $P(s|a, e) \neq P(s|e)$ because the predictor's prior action was conditional on $a$.

  When the theorem fails in these scenarios, it is not because the math is wrong, but because the input variables violate the preconditions. To claim this is a counterexample is akin to claiming that air resistance refutes the Pythagorean theorem because a triangle drawn in turbulent air looks distorted. The theorem describes the geometry of the decision space, not the physics of the environment in which the decision is embedded.

  Moreover, the "rational future self" assumption is not a loophole; it is a definition of agency. If your future self will not maximize expected utility (due to akrasia, weakness of will, or preference reversal), then *you* are not a single agent over time, but a sequence of competing agents. Good's theorem applies to a unified agent. If you bind your future self to ignorance, it is not because information has negative value; it is because you are playing a game against your future self, and information would give your future self an advantage against your current self's interests.

  ### The Verdict

  I commit to the following position: **The Newcomb-style and information-sensitive cases are not counterexamples to Good's Theorem, but they are fatal counterexamples to the popular slogan that "information is never worse."**

  Good's Theorem is a mathematical identity that is strictly true within its domain. It is not "false" in the face of predictors; it is simply *inapplicable*. However, the domain of applicability is far narrower than the slogan suggests, and recognizing this distinction is vital for a retired physicist who values precision over platitude.

  The theorem survives only under three strict conditions:
  1.  **Causal Neutrality:** The act of acquiring information must not causally influence the state of the world or the payoff structure. (No "observer effects" that alter the outcome, and no predictors who penalize curiosity).
  2.  **Act-State Independence:** The probability distribution over states must not be logically correlated with the action choice in a way that violates the standard conditionalization rules (the domain of Causal Decision Theory).
  3.  **Dynamic Consistency:** The agent must remain a unified expected-utility maximizer over time.

  When these conditions hold, the value of information is strictly non-negative. When they do not hold, the "value of information" is conflated with the "value of intervention." In the Newcomb case where looking signals two-boxing, "looking" is not gathering data; it is sending a signal. The loss incurred is not the cost of information, but the cost of the signal.

  ### Conclusion: A Local Truth, Not a Universal Law

  Therefore, the popular formulation that "more information is never worse" is **indefensible as a general principle**. It is a local claim with a narrow domain of application. It holds in the "vacuum" of causally neutral, costless observation by a dynamically consistent agent. It fails in the "atmosphere" of the real world, where observation can be an intervention, where predictors exist, and where agents suffer from time inconsistency.

  This does not diminish Good's achievement. It merely contextualizes it. Just as Newton's First Law is not "refuted" by friction but is instead understood as describing motion in the absence of net force, Good's Theorem describes the value of information in the absence of causal back-reaction.

  For the rational agent, the lesson is not to blindly seek information, but to rigorously analyze the causal structure of the inquiry. Before asking a question, one must determine if the universe is listening. If the answer is yes—if the asking changes the answering—then Good's Theorem recedes, and we are left with the more complex, messy, and fascinating physics of strategic interaction. The theorem remains elegant, but it is not a shield against a world that punishes the curious.
