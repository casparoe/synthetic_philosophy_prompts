      *   *Objection 5 (The Mechanist):* Idealization. Interventionism allows idealizations. Just admit your GRN model is an idealization.
      *   *Objection 6 (The Mechanist):* Control. Without intervention, you can't control the system. What's the pragmatic cash value?
