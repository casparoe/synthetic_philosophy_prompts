      *Refining Order:* The Invariance objection is definitely #1. The Statistician's "it's just math" is very damaging to the novelty claim. The Mechanist's "you can intervene" is the standard defense. The Physicist's reductionism is a background threat but less specific to the GRN argument. Let's order by immediate threat to the *argument's validity*.

