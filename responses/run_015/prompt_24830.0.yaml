answer: |-
  This is a classic dilemma in the contemporary literature on moral responsibility (often discussed by philosophers like Macalester Bell, Christopher Fritz, or Gary Watson). Your friend has constructed a *reductio* that forces you to choose between a condition that is too strict (moral paralysis) and one that is too weak (triviality).

  To keep the two things you value—**(4) the intuition that minor slips don't block standing** and **the idea that standing is a robust, non-trivial restriction**—you need to cut the argument at **Step (6)**.

  Here is the breakdown of why Step (6) is doing the bad work, how to fix it, and what it costs you.

  ### The Bad Step: (6)
  > *(6) On the most natural understanding, "relevant to" means "at least as serious as" — your own wrong has to be of comparable weight to theirs for it to undercut your standing.*

  **Why it's wrong:**
  Step (6) smuggles in a **quantitative** metric (severity/weight) to solve a **qualitative** problem (normative relevance). It assumes that standing is about *scorekeeping* (who did worse?) rather than *hypocrisy* (are you violating the norm you are invoking?).

  If standing were only about severity, then a chronic shoplifter would have the standing to blame a murderer (theft is less serious than murder). But intuitively, the shoplifter lacks the standing to blame *anyone* for property crimes, regardless of how "big" the other person's crime is. Conversely, under Step (6), if I lie to you (small lie) and you lie to the boss (big lie), I lack standing to blame you. But if I snap at you (rudeness) and you lie to the boss, Step (6) suggests I *do* have standing, which matches your intuition (4).

  The error in (6) is equating "relevance" with "severity." Relevance is about **normative kind**, not **moral weight**.

  ### The Fix: Normative Similarity, Not Severity
  To save the Clean-Hands condition, you replace Step (6) with a **Normative Similarity Condition**.

  **Revised (6*):** Your own wrong undercuts standing only if it violates the *same normative commitment* as the wrong you are blaming.

  *   **How this saves (4):** Snapping at a coworker violates a norm of *civility/politeness*. Lying to the boss violates a norm of *honesty/integrity*. These are different norms. Therefore, your hands are "clean" regarding the norm of honesty. You retain standing.
  *   **How this saves the "Non-Trivial" constraint:** Suppose you *also* lied to the boss last week, but your lie was small (e.g., "I'm 5 minutes late" vs. their massive fraud). Under the old Step (6), you might have standing because your wrong was smaller. Under (6*), you **lack standing**. You violated the *same norm* (honesty). This preserves the idea that standing is a strong restriction: it's not enough to be the "lesser wrongdoer"; you must be *clean regarding the specific norm*.

  ### The Cost: What do you lose by rejecting (6)?

  If you give up Step (6), you avoid the dilemma, but you pay a theoretical price. Here is what it costs you:

  **1. The Cost of Granularity (The "Same Norm" Problem)**
  By rejecting severity as the metric, you must now do the hard work of defining what counts as the "same norm."
  *   *Is lying to a spouse the same norm as lying to a boss?* (Most say yes.)
  *   *Is stealing $5 the same norm as stealing $5,000?* (Yes.)
  *   *Is forgetting a birthday the same norm as ignoring a cry for help?* (Both are neglect, but are they the same *kind*?)
  You lose the simplicity of a sliding scale of "badness." You now have to argue about categorical boundaries. Your friend will press you on where the lines are drawn.

  **2. The Cost of "Clean Hands" as a Metaphor**
  The metaphor "Clean Hands" suggests purity (no dirt at all). By rejecting (6), you are admitting that you can have "dirty hands" (you snapped, you were rude) and still have standing. You might need to shift your metaphor from **Purity** to **Authority** or **Commitment**.
  *   *Purity:* "I haven't sinned." (Too strict, leads to Step 3).
  *   *Authority:* "I am committed to the rule I am enforcing." (Allows minor slips, blocks same-norm violations).
  You have to concede that the "Clean-Hands" label is slightly misleading. It's really a "No-Hypocrisy" condition.

  **3. The Cost of Disposition vs. Act**
  To make this really stick, you might need to tweak Step (1) slightly. It's not just about whether you *did* the thing once (an act), but whether you are *disposed* to do it (a trait).
  *   *Revision:* You lack standing if you are *culpably committed* to the same type of wrong.
  *   *Cost:* This makes standing harder to judge in real-time. I might not know if you are a "liar" or just made a mistake. It moves standing from an objective fact about the episode to a judgment about your character.

  ### Summary of the Escape Route

  1.  **Reject Step (6).** Deny that relevance is determined by severity.
  2.  **Assert:** Relevance is determined by **normative identity** (same kind of wrong).
  3.  **Result:**
      *   You can blame the liar even if you were rude (Different norms). **(Keeps 4)**
      *   You cannot blame the liar if you are also a liar, even if your lie was smaller. **(Keeps "Stronger Restriction")**
      *   You avoid the "proves too much" problem because minor, different-norm slips don't count.
      *   You avoid the "triviality" problem because same-norm violations block standing regardless of size.

  **What to tell your friend:**
  "The argument fails at (6). You're treating standing like a courtroom where only the person with the cleanest record can speak. But standing is about *hypocrisy*, not *ranking*. I lack standing to blame you for lying if I am a liar, not because my lies are bigger, but because I have forfeited my authority to speak for the norm of honesty. Snapping at you doesn't forfeit that authority. So (6) is false: relevance is qualitative, not quantitative."

  This allows you to walk out of the argument with your core intuitions intact.
