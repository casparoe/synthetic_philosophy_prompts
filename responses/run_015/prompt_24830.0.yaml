  3.  **Identify the Weak Link:**
      *   Step (6) is the culprit. It defines "relevance" purely in terms of *severity* (weight/size of the wrong).
      *   Philosophical literature on standing (e.g., Bell, Fritz, Miller, Todd) usually distinguishes between *types* of wrongs, not just *sizes*.
      *   *Hypocrisy* is the core concern of standing. Hypocrisy isn't just "I did a bigger bad thing." It's "I am violating the very norm I am invoking."
      *   If I lie to the boss, and you snap at me, you haven't violated the norm of *honesty*. You violated a norm of *politeness*. Therefore, your hands are "clean" regarding the specific norm of honesty.
