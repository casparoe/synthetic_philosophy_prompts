      *   *Example:* I steal $5. You steal $500. I blame you for stealing $500. Under (6), I have standing (my wrong is smaller). Under the "Same Norm" view, I *lack* standing (I am also a thief). This preserves the "stronger than bigger wrongdoer" constraint the user wants.

