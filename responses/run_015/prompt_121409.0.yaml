      *   *The Tension:* Clark & Chalmers (1998) emphasize the *dispositional* nature of belief. Otto's notebook works because it functions *like* biological memory (reliable, accessible, endorsed).
      *   *The User's Insight:* If function is king, why does duration matter? A pebble arrangement performs a computational role *now*.
      *   *Assessment:* This is a strong move. It highlights a potential bias in EMT towards *memory* extensions rather than *computational* extensions.

  3.  **Address Question 1: Persistent Accessibility vs. Momentary Availability:**
