      *   *Verdict:* The 1998 paper leans towards persistence (to mimic dispositional belief). However, the *Parity Principle* itself is functionalist. If the function is performed transiently, parity suggests it counts *during that time*. The user is identifying a tension between the specific criteria for *belief* extension (Otto) and the general principle of *cognitive* extension.
