  1.  **Vs. "Dismantled Machine" (Your Idea 1):** That tests Single-Case vs. Long-Run. But your supervisor already accepted single-case objectivity in Case 1 (Die rolled once and melted). This wouldn't new information.
  2.  **Vs. "Shifted Frequency" (Your Idea 2):** That tests if probability changes with setup. We expect it to. It doesn't tell us *what* the probability *is*.
