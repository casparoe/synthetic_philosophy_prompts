  Hey there, it sounds like you guys had a really intense lunch debate and that Mr. Harris is pushing you to think critically about the difference between physical scarcity and human distribution, which is exactly what Amartya Sen is famous for. To help you prepare for your Model UN simulation regarding Alvara, I have broken down two possible rules Mr. Harris could be using based on his past lessons, how they apply to your scenario, and where the real distinction lies.

  The first rule you could attribute to him is what I would call the Entitlement Protection Standard. This rule stays very close to Sen's original economic theory and argues that a famine is a political crime whenever the government fails to protect the ability of its poorest citizens to access food, regardless of whether food is being exported. Under this rule, if wages fall, prices spike, or safety nets fail to prevent starvation, the government is responsible because it did not secure the entitlements of its people. If Mr. Harris is using this rule, he would likely call the Alvara famine a political crime. Even though the government tried to help, the fact that world prices doubled and they could not afford enough rice means their economic policy failed to protect the poor from the price shock, and the thirty thousand deaths were preventable with better fiscal planning or earlier international borrowing.

  The second rule is what I would call the Active Diversion Standard. This rule seems to fit Mr. Harris's specific distinction about the 1816 volcano case where he admitted kings were selfish but still called it a natural disaster. This rule argues that a famine is only a political crime if food is physically available but actively diverted away from the starving population by human decisions, such as exports, hoarding, or requisitioning. Under this rule, if the food is genuinely destroyed by nature and cannot be moved due to physical barriers like floods or lack of technology, it is a natural disaster even if the government is imperfect. If Mr. Harris is using this rule, he would say the Alvara famine was a natural disaster. The drought destroyed the crop, the floods physically blocked the rail line, and the government did not export food or lie about harvests, so the deaths were caused by physical constraints rather than human theft.

  My best guess is that Mr. Harris is actually using the Active Diversion Standard because of how he handled the 1816 example. He specifically noted that the kings were selfish anyway, which implies that bad intent or incompetence is not enough to make it a political crime in his view. He seemed to draw the line at whether food was being moved out of the region while people starved, which happened in Bengal, Ireland, and China, but did not happen in 1816 or in your Alvara scenario. Since the Alvara government banned exports, opened granaries, and faced genuine physical barriers like the washed-out rail line, he would likely argue that this was a tragedy of nature rather than a crime of politics, consistent with his view on the volcano-induced famine.

  The closest analog to Alvara from your class readings is definitely the 1816 Year Without a Summer famine. In both cases, there was a massive environmental shock that destroyed crops across a wide area, and in both cases, the ability to move food was severely limited by physical factors, whether it was horses and carts in 1816 or flooded rail lines in Alvara. Both scenarios involve governments that were not perfectly effective but were not actively stripping food from the starving to send elsewhere, which distinguishes them from the Bengal or Irish famines where food was visibly leaving the famine zones.

  To separate these two rules for sure, you would need a made-up case where food is available domestically and not exported, but the poor still starve due to economic policy. Imagine a country called Borduria where the harvest is normal and no food leaves the country, but the government prints too much money causing hyperinflation so the poor cannot afford bread. The Entitlement Protection Standard would call this a political crime because the government destroyed the people's purchasing power, but the Active Diversion Standard might call it a natural economic tragedy or accident because no food was physically taken away or blocked from entering. If Mr. Harris calls that a political crime, he is following the Entitlement rule, but if he calls it a tragedy because the food was technically there, he is sticking to the Active Diversion rule. Good luck with your simulation, and I hope this helps you nail the argument.
