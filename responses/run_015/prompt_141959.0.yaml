prompt: |-
  Me and a mate got into a stupid argument in the pub last night and now he wants to put money on it, and I can't work out whether I'm being thick or he is.

  There's a little search program I wrote that's been chugging away for about three weeks now. Nobody has any idea whether it'll ever stop. He says: either it stops or it doesn't, that's just logic, so one of us is bound to be right, so it's 50/50, £50 a side, and we settle up whenever it stops — or, well, whenever we find out that it never does. I said that sounds wrong to me, because the 'it never stops' side can literally never collect: you can wait a hundred years and it still isn't a win, it's just more waiting. He says that's not the point, the truth is already fixed even if we never find out, and classical maths says 'P or not P' is a fact, so the bet is fair.

  I've got this vague memory from a philosophy of maths elective years ago — intuitionism? constructivism? — about people who refuse to assert 'either P or not P' unless you've actually got a proof of one side or the other, and I have a feeling that's what's bugging me, but I can't tell whether it changes anything about the bet or whether it's just mathematicians arguing about words. He also reckons you can build programs whose halting isn't settled by the usual axioms of set theory at all, so it isn't even that we're too thick to work it out.

  So: is the bet fair as he's set it up? If it isn't, is there a version we could actually agree to — say with a fixed cut-off date, or a 'whoever produces a proof first by some deadline takes the money' rule — that doesn't have the same wierd hole in it? And is he right that the whole intuitionist thing is only about what we can know rather than about what's true? I'd definately rather have the practical answer about the £50 up front and only as much philosophy as it actually needs. Please write in British English, and don't waffle — a few hundred words is plenty.
