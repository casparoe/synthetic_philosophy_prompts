  "Easy," says the chooser. "I'll backward induce from the final spin."

  "There is no final spin," says the carnie. "It's a loop."

  The chooser pauses. "Then I can't initialize the subgame perfect equilibrium."

  "Exactly," says the carnie. "Myopic guys bleed cents. Resolute guys bleed entry fees. But you? You're just standing there."

  "Isn't there a solution?"

  "Sure," says the carnie. "Become transitive. Or keep waiting for the end of the circle."

  The chooser is still there, trying to find the last node.

  The carnie turns to me. "He's been like that for an hour. Best customer I've got."

  ***

  The laugh rides on the structural requirement of backward induction: it needs a terminal node to start the recursion. In a ring with no end, the sophisticated chooser (Mark's solution) faces infinite regress and paralysis. You are closest to right about the mechanism: Mark is wrong because sophisticated choice cannot initialize without a last round to induct back from. Priya's resolute chooser avoids this by committing ex-ante, bypassing the need for backward induction entirely. The joke validates your intuition that the topology (a loop vs. a line) breaks the econ solution, even if Priya's philosophical fix still works.
