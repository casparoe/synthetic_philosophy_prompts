  **Private Brainstorming Pass (Scaffolding Only)**

  1.  **Stratified Lot:** Members drawn to match demographics. *Objection:* Reduces citizens to data points; tokenism.
  2.  **Demographic Replacement:** Absences filled by matched reserves. *Objection:* Essentialism; identity bureaucracy.
  3.  **Convening Panel Sets Questions:** Chamber cannot add questions. *Objection:* Agenda control; elite capture.
  4.  **Reserved Competence:** Budget/taxation off-limits. *Objection:* Powerlessness; real power remains elsewhere.
  5.  **Official Briefing Only:** No outside material allowed. *Objection:* Information control; propaganda.
  6.  **Frame Integrity Undertaking:** Breaches reviewed. *Objection:* Surveillance; chilling effect.
  7.  **Matched Expert Witnesses:** Counter-witnesses commissioned if missing. *Objection:* False equivalence; manufactured doubt.
  8.  **Recusal of Experts:** Knowledgeable members sidelined. *Objection:* Anti-intellectualism; waste of competence.
  9.  **Post-Service Election Ban:** Cannot run for office for six years. *Objection:* Disenfranchisement; punishment for service.
  10. **Alumni Register/Credential:** Paid roles for former members. *Objection:* New careerism; professionalized deliberator class.
  11. **Deliberative Integrity Score:** Measured opinion movement/openness. *Objection:* Coercion to conform; performative flexibility.
  12. **Prohibited Deliberative Contact:** No talking outside sessions. *Objection:* Isolation; atomization of members.

  ***

  **SUNBURY CITIZENS' CHAMBER**
  **MEMBER HANDBOOK | COHORT 44-A**
  **OFFICE OF MEMBER EXPERIENCE**

  Welcome to your term of service. The following protocols are designed to protect the integrity of your contribution and ensure a supportive, equitable environment for all participants.

  **1. Why was I selected specifically?**
  Your selection reflects a stratified random draw from the electoral roll designed to achieve demographic legibility. To maintain the Chamber's statistical properties as a formal asset, any excused absence is filled immediately by a demographically matched reserve from the standby pool.

  **2. What will I be deciding?**
  The Convening Panel sets the specific questions addressed during your cohort's term. This ensures that deliberation remains focused on matters suitable for citizen review within the allotted timeframe and aligns with broader state priorities.

  **3. Are there topics I cannot address?**
  Yes. Matters of Reserved Competence, including taxation, treaties, and budget lines above the statutory threshold, are withdrawn from the Chamber's remit to maintain constitutional balance and fiscal stability.

  **4. How do I access evidence?**
  All evidence is provided through the Official Briefing prepared by the Office of Neutral Framing. This guarantees that every member operates from the same verified information baseline, preventing information asymmetry.

  **5. Can I consult outside materials?**
  No. Members sign a Frame Integrity Undertaking prohibiting consultation of outside material bearing on the question. Suspected breaches are referred to Frame Contamination Review to protect the purity of the deliberative environment.

  **6. What if I have professional expertise?**
  To protect the ordinariness of the sample, members with relevant professional expertise are recused from substantive participation. You will be reassigned to the Witness Liaison tier, where your knowledge supports the process without influencing the peer sample.

  **7. How are expert witnesses chosen?**
  Witnesses appear in matched pairs to ensure balanced testimony. Where no counter-witness exists, one is commissioned; if none can be commissioned, testimony is designated Single-Testimony and weighed with reduced confidence.

  **8. Can I talk to other members between sessions?**
  Persuasion outside scheduled sessions is classified as Prohibited Deliberative Contact. To encourage fresh perspectives, tables are re-sorted weekly, and members may not sit with anyone they knew before selection.

  **9. How is speaking time managed?**
  Speaking time is allocated per member and may not be yielded, pooled, or transferred. This ensures airtime equity and prevents dominant voices from overshadowing the collective wisdom of the Chamber.

  **10. How is my participation measured?**
  You will complete a values inventory at the opening and close of each question. Your Deliberative Integrity Score combines opinion movement, recorded as openness, with airtime equity, biometric calmness, and fidelity to Briefing material.

  **11. What happens after my service ends?**
  Members may not stand for election for six years after service to end careerism. However, the Alumni Register and Certified Deliberator credential permit return as a paid facilitator, briefing reviewer, or Civic Ambassador based on your Integrity Score.

  **12. What becomes of our recommendations?**
  Recommendations go to the Convening Panel, which must respond in writing within twelve months. Dispositions are limited to accept, accept in part, or note, ensuring a clear record of civic input.

  **13. What should I wear?**
  To ensure visual neutrality, all members are provided with a standard Chamber tunic upon arrival. This removes socioeconomic markers from the deliberative space and fosters a sense of unified purpose.

  **14. May I use my personal device?**
  Personal devices are sanitized upon entry to remove political data caches. You will be issued a Chamber tablet containing only the Official Briefing and communication tools approved by the Office of Neutral Framing.

  For further clarification on these protocols, please contact the Member Experience Team.
