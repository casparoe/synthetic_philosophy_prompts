      *   *Wrinkle 2 (Translation):* Is this testimony or perception? It's testimony about linguistic properties. It mirrors the tetrachromat case (access barrier). It suggests the "see it yourself" rule is really about "access the relevant properties yourself," which testimony *can* sometimes facilitate (via translation) or block (via incapacity).

