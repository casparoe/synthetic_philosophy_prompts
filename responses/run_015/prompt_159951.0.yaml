      *   *Thesis 6: The Concept Possession Claim.* (Can't grasp 'devastating' without experience). Semantic/Psychological. Strong/Controversial.
      *   *Thesis 7: The Non-Cognitivist Claim.* (No truth to transmit). Meta-ethical. Strong/Controversial.

  4.  **Evaluating the Theses against the "Destroyed Performance" Case:**
      *   The student argues: Novice knows the piece *was* devastating based on testimony (since it's destroyed).
