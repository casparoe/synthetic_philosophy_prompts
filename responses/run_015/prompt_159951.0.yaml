      *   *Thesis 3: The Strong Epistemic Pessimism.* (Testimony *cannot* yield aesthetic knowledge/justified belief). Strong/Controversial. This kills the case.
      *   *Thesis 4: The Acquaintance Principle.* (Knowledge-of vs. Knowledge-that). Substantive/Defensible. Distinguishes knowing *it is good* vs. knowing *the goodness*.
