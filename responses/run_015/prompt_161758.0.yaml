          *   Conditions: Both sides share *all* empirical data, forecasts, causal models, budget. No corruption/stupidity/posturing. Disagreement is *not* factual.
          *   Requirement (a): On Carnap's criteria, the disagreement *must* emerge as external (framework choice), generated by the case details, not stipulated.
          *   Requirement (b): Carnap's instrumental criterion *must* give a determinate verdict (no "anything goes" relativism).
          *   The Wrinkle (Fruitfulness Regress): The frameworks disagree on what counts as success. There is no neutral yardstick for fruitfulness because the framework specifies the purpose. Yet, the case must still yield a recommendation.
          *   Post-Case Analysis:
              *   Analyze under three readings: Carnap-as-technocrat, Carnap-as-decisionist, User's reading (internal/external line shifts).
              *   Determine which reading the case *actually* supports and why.
              *   Identify the single feature doing the work and test counterfactuals (disagree on purposes, one framework strictly more fruitful, revisable choice).
