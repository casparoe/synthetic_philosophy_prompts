answer: |-
  **The Case**

  The Regional Water Authority's board must adopt the statutory metric for "Security" to allocate the 1974 capital budget, with all hydrological data, demand forecasts, and depletion models agreed upon by both the Engineering and Operations divisions. The Engineering division proposes a **Flow Framework**, defining Security as *volume delivered per quarter*, where success is maximizing throughput and failure is rationing; the Operations division proposes a **Reserve Framework**, defining Security as *aquifer recharge rate relative to extraction*, where success is net-positive storage and failure is depletion. Under the Flow Framework, the data shows the current extraction rate is highly efficient and meets all demand, recommending infrastructure expansion to increase pump capacity; under the Reserve Framework, the identical data shows the current extraction rate is catastrophic, recommending immediate rationing to halt expansion. Both frameworks are internally consistent and empirically accurate regarding the water molecules, but they individuate the "system" differently: Flow counts water at the tap, Reserve counts water in the ground. The Authority's charter mandates "ensuring water security for the region," but does not specify a time horizon. The Flow Framework renders future depletion invisible as a metric failure (since the tap still flows today), while the Reserve Framework renders current demand satisfaction invisible as a metric success (since the tap flow is restricted).

  ***

  **Analysis of Readings**

  **1. Carnap-as-Technocrat:** This reading treats the dispute as an internal, empirical question waiting for better data. It assumes there is a fact of the matter about "Security" that the models haven't yet captured. It would recommend commissioning a study to determine which metric *really* correlates with security. This reading fails because the case stipulates all empirical data is shared and agreed upon; the disagreement is not about the water, but about what counts as the *object* of planning (tap vs. aquifer). The Technocrat cannot see the framework because they assume the framework is transparent to the facts.

  **2. Carnap-as-Decisionist (Your Friend):** This reading treats the choice as a pure external decision, a matter of pragmatic will. Since both frameworks are logically consistent and empirically adequate, the choice is non-cognitive. The Board should simply vote based on their political preferences (e.g., short-term popularity vs. long-term caution), and once the metric is legislated, all subsequent disputes become technical calculations within that metric. Politics is a one-time switch-flip; administration follows. This reading captures the "external" nature of the choice but fails to account for the instrumental constraint: one framework makes the continued existence of the Authority impossible.

  **3. The Relocation Reading (Yours):** This reading argues that the internal/external distinction holds, but the "external" choice is not a neutral administrative toggle. It is the site where political conflict is *encoded* into the bureaucracy. The choice of framework determines which harms are visible (depletion vs. rationing). The "determinate verdict" arises not from neutral facts, but from the pragmatic requirement that a planning body must sustain the conditions of its own operation over time. The Reserve Framework is instrumentally superior *for the purpose of continuing to plan*, whereas the Flow Framework is pragmatically self-defeating. Politics is not dissolved; it is relocated into the struggle over which temporal horizon gets built into the accounting system.

  **Which Reading the Case Supports**

  The case supports the **Relocation Reading**. The Technocrat reading is falsified by the shared empirical data; there is no new fact to find. The Decisionist reading is falsified by the instrumental asymmetry: while the choice is "external" (not truth-apt), it is not arbitrary. Carnap's criterion of "fruitfulness" is not relativistic here because the Flow Framework undermines the possibility of future fruitfulness for *any* goal requiring water. However, this verdict relies on a hidden premise: that the Authority intends to exist in the future. If the Board's purpose is "maximize extraction before the next election," Flow is more fruitful. Thus, the "determinate verdict" is only determinate relative to a *shared commitment to continuity*, which is itself a political stance, not a logical necessity. The case shows that Carnap's distinction does not eliminate the political; it reveals that the political resides in the selection of the *conditions of intelligibility* for the administration.

  **The Single Feature Doing the Work**

  The operative feature is the **temporal horizon embedded in the unit of account**. The Flow Framework operationalizes "now"; the Reserve Framework operationalizes "later." This feature does the work because it turns a value conflict (present vs. future) into a structural constraint on visibility.

  *   **If the two sides also disagreed on purposes:** If Engineering wanted "profit" and Operations wanted "conservation," the case collapses into a standard value conflict. Carnap's distinction would offer no leverage, as there would be no shared instrumental goal to measure fruitfulness against.
  *   **If one framework were strictly more fruitful:** If Flow also led to better reserves (a technological miracle), the dispute would become internal/empirical. The framework choice would dissolve because one would be factually superior, removing the "external" decision element entirely.
  *   **If the framework choice were revisable:** If the Board could switch metrics annually, the political stakes would lower, but the *administrative inertia* would remain. The first framework adopted creates data histories that make switching costly. The political relocation persists because the initial choice biases all subsequent "internal" evidence.

  **The Strongest Attack (From the Decisionist)**

  "The Relocation Reading smuggles a substantive value judgment into the pragmatic criterion of 'fruitfulness.' You claim the Reserve Framework is 'instrumentally superior' because it sustains the Authority, but why must the Authority be sustained? If the elected Board decides their pragmatic goal is to maximize voter satisfaction over a four-year cycle, the Flow Framework is objectively more fruitful. It delivers the visible goods (water) without the visible pain (rationing). Carnap explicitly states the choice of framework depends on the interests of the adopters. By insisting that 'continuity' is the neutral standard for fruitfulness, you are merely asserting your own political preference for long-termism as if it were a logical requirement. The distinction *does* dissolve politics into administration, provided you admit that the 'administration' includes the administrative decision to prioritize the future over the present. That is a decision, not a discovery, and once made, the rest is indeed engineering."
