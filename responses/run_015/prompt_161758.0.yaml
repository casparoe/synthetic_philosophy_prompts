      *Resolution:* I must argue that for the *planning body* (as a continuing institution), A is instrumentally irrational. It's like choosing a map that erases the cliff you are driving toward. It's not a value judgment to say "don't drive off the cliff" if the goal is "continue driving." The shared goal is "Regional Water Authority" (implies continuity).

