      *   **Goal:** Argue that Carnap's distinction *relocates* the political rather than eliminating it.

  2.  **Deconstruct the Philosophical Problem:**

      *   *Carnap's Position:* Internal questions = truth-apt (empirical/logical). External questions = pragmatic decisions (efficiency, fruitfulness).
      *   *Friend's Position:* External decisions are one-time administrative choices. Once made, everything is internal/technical. Politics $\rightarrow$ Administration.
      *   *User's Position:* The "external" decision isn't neutral. The criteria for "fruitfulness" are themselves framework-dependent. Therefore, the political isn't dissolved; it's embedded in the framework choice, which is recurrent and contested.
      *   *The Challenge:* How to show a determinate verdict is possible *without* a neutral yardstick, while showing the disagreement is structural (framework) not factual?
      *   *Key Insight:* The "Fruitfulness Regress." If Framework A defines success as $X$ and Framework B defines success as $Y$, how do we choose? Carnap says "practical efficiency." But efficiency *for what*? If the "what" is part of the framework, we have a circle. To break it without stipulation, we need a shared *higher-order* constraint that isn't a factual claim but isn't arbitrary either. Or, we need to show that one framework fails its *own* internal coherence regarding the shared goal, while the other succeeds, making the choice "determinate" but still "external."
      *   *Wait, the prompt asks for:* "The fruitfulness of a framework gets measured against purposes the framework itself partly specifies... there's no neutral measure, and yet the case still has to yield a recommendation."
      *   *Solution Strategy:* The shared purpose must be vague enough to allow two frameworks, but specific enough that one framework *undermines* the possibility of achieving it over time, while the other sustains it. The "determinate verdict" comes from the *sustainability* of the practice, not a neutral metric. This aligns with Neurath's boat (repairing while floating) rather than Carnap's pure logic.
      *   *Actually, looking closer at the constraint:* "Carnap's instrumental criterion has to give a determinate verdict... or the case just shows relativism."
      *   *Idea:* A planning scenario where the "unit of account" determines visibility. If you count $X$, you see problem $P$. If you count $Y$, problem $P$ disappears. The shared goal is "reduce suffering/inefficiency." Framework 1 makes suffering visible but unmanageable. Framework 2 makes suffering invisible but manageable metrics look good.
      *   *Refinement:* Let's use a **Housing Authority** allocating maintenance funds.
      *   *Shared Goal:* "Maximize habitable unit-years within budget."
      *   *Framework A (Component-Based):* Tracks individual repairs (boilers, roofs). Success = % of repair requests fulfilled.
      *   *Framework B (Unit-Based):* Tracks whole-unit viability. Success = % of units certified "habitable."
      *   *The Conflict:* Data shows that fulfilling repair requests (Framework A) does not correlate with units staying habitable long-term (Framework B). Framework A looks efficient internally (high throughput). Framework B looks inefficient (low throughput, high cost per win).
      *   *The Regress:* Which metric measures "Maximize habitable unit-years"? Framework A says "repairs done." Framework B says "units certified."
      *   *The Determinate Verdict:* Framework A is *self-defeating* relative to the shared goal. If you adopt A, you lose track of the goal (habitable years). If you adopt B, you track the goal. The verdict is determinate because A fails *instrumentally* regarding the shared aim, even though A has its own internal logic.
      *   *Wait, is that "External"?* Yes, choosing the metric is external. But the *reason* for choosing B is that A fails the shared aim.
      *   *Does this support the User?* Yes. It shows the "political" is in the metric choice. If you choose A, you privilege the maintenance union/contractors (activity). If you choose B, you privilege the tenants (outcome). The choice isn't neutral.
      *   *Does it meet the "Fruitfulness Regress"?* The prompt wants: "frameworks disagree about what would count as the plan succeeding... no neutral yardstick... yet the case still has to yield a recommendation."
      *   *Adjustment:* The shared goal needs to be interpreted differently. Let's try **Transit Agency**.
