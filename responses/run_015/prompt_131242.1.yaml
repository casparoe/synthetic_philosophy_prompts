answer: |-
  The institute's framing treats indeterminacy as an engineering bottleneck rather than a constitutive limit of evidence. This is dangerous. If the director believes we can *solve* indeterminacy, she misunderstands the thesis; if she believes we can *work around* it, she needs a new definition of "work." The real stake is not whether we can find the true manual, but whether "true manual" is a coherent goal for **mute interpretation**. I suspect the lumping of cetaceans, scripts, and neural networks obscures vital differences in causal history, but the philosophical problem remains invariant across them. The most suspicious element is the assumption that "decoding" implies recovering semantics rather than mastering prediction. If we pursue **home-language bleed** too aggressively, we paralyze the project; if we ignore it, we build on sand. I considered framing the agenda around empirical case studies immediately, but that begs the question of what counts as data. I also considered focusing solely on **the identifiability parallel**, but that risks reducing philosophy to math without addressing the semantic stakes. The core tension is between mission viability and philosophical honesty. We must operationalize success without pretending to have solved Quine.

  To rank these lines, I weigh mission viability against philosophical depth. The institute has three years to show results, not just aporia. Therefore, tractability outweighs theoretical completeness. A line that proves the project impossible is valuable only if it saves us from wasting three years; a line that enables work despite indeterminacy is preferable. I resolve the conflict by prioritizing operational definitions over metaphysical closure. This costs us the comfort of knowing *why* our methods work, but it buys us the ability to *make* them work. Importance is measured by dependency: if Line 1 fails, Lines 2 and 3 are irrelevant. Neglect is measured by current literature: ML researchers ignore the philosophy, philosophers ignore the math. We bridge this gap.

  1.  **Success criteria without semantics.**
      *   **Question:** Can we specify a non-semantic success metric for **mute interpretation** that remains invariant under the substitution of **a patchy manual**?
      *   **Upstream/Downstream:** Upstream of all empirical work; downstream of nothing. If this fails, the institute has no definition of success.
      *   **Tractability:** High. Requires conceptual analysis and simulation of permutation effects on prediction scores.
      *   **Productive Negative:** A proof that all predictive metrics presuppose semantic categories, forcing a pivot to purely instrumentalist goals.
      *   **18-Month Evidence:** A taxonomy of metrics (compression, transfer, counterfactual generalization) ranked by vulnerability to indeterminacy.

  2.  **The identifiability parallel.**
      *   **Question:** Which mathematical constraints in representation learning correspond to non-question-begging anchors for **mute interpretation**?
      *   **Upstream/Downstream:** Upstream of **the anchor question**; downstream of success criteria. It provides the technical toolkit.
      *   **Tractability:** Medium. Requires researchers fluent in both formal learning theory and philosophy of language.
      *   **Productive Negative:** Demonstration that provable identifiability conditions require query access unavailable in **mute interpretation**.
      *   **18-Month Evidence:** A mapping of specific identifiability theorems to philosophical categories of evidence (e.g., causal intervention vs. passive observation).

  3.  **The anchor question.**
      *   **Question:** Does causal-interventional access break the regress of empirically equivalent manuals for mute targets without invoking **home-language bleed**?
      *   **Upstream/Downstream:** Upstream of final theoretical claims; downstream of the identifiability parallel.
      *   **Tractability:** Low. This is hard philosophy with high risk of stalemate.
      *   **Productive Negative:** A rigorous demonstration that all candidate anchors (simplicity, causality, innateness) secretly presuppose the semantic facts they recover.
      *   **18-Month Evidence:** A comparative analysis of candidate anchors showing which survive the "presupposition test."

  I am defunding Candidate A (Equivocation space), Candidate C (Home-language bleed), and Candidate F (Overrated-implications). Candidate A is too abstract; knowing the shape of the space matters less than knowing how to navigate it. Candidate C is defunded not because it is false, but because it is existentially toxic to a mission-driven budget; if we fund **home-language bleed** as a primary line, we risk concluding nothing is possible before we start. It must be a background constraint, not a work package. Candidate F is defensive; we cannot spend three years auditing other people's misconceptions. We must build, not critique.

  If I must place the entire budget behind one line, it is the first: Success criteria without semantics. Without a coherent definition of success that survives indeterminacy, the institute is merely producing data without a framework to claim it means anything.
