prompt: |-
  im taking a philosophy of mind course and weve been stuck on Wittgensteins hinge epistemology for ages. my lecturer keeps saying hinges have to stand fast whenever someone asks whether we can really doubt basic maths or that we have hands, and uses it to shut down the question entirely. i feel like that phrase is doing way too much work but i cant unpack it. can you break down the different precise things that claim could actually mean — like psychological limits, logical prerequisites, normative rules for inquiry, or language-game conditions? lay them out as a menu with whether each is trivial, defensible, or false, and tell me which ones actually justify dismissing someone who asks if 2+2=4 could be wrong. also, in seminar we talked about this idea of epistemic friction where hinges resist doubt differently depending on context, not just sitting there static — does that change any of the readings? please answer in british english and dont just list books, i need the concepts not a bibliography.
