prompt: |-
  I am trying to formalise a decision framework for cases where two institutional goods—say, epistemic transparency and procedural privacy—are genuinely incommensurable. I understand that, according to the parity view, such values can stand in a relation of being on a par rather than being better, worse, or equal. However, I seem to have drawn the conclusion that if they are on a par, then any institutional rule that prioritises one over the other in a specific context must be either arbitrary or an illicit reduction of the other value to a subordinate metric. This leads me to propose what I call structured parity with lexical side-constraints: a system in which neither value is ever traded off, but each governs its own non-overlapping domain. Is this a coherent way to preserve incommensurability within institutional design, or does it rest on a false presupposition about the relationship between parity, rational ordering, and domain separation? In particular, am I wrong to assume that being on a par precludes any context-sensitive ranking, and if so, what does that imply for hard choices in policy-making? Please respond in British English, and avoid citing specific texts or authors where possible.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Problem:** The user is trying to formalise a decision framework for incommensurable institutional goods (e.g., epistemic transparency vs. procedural privacy).
      *   **Theoretical Basis:** They are using the "parity view" (values can be "on a par" rather than better/worse/equal).
      *   **User's Conclusion:** If values are on a par, prioritising one over the other in a specific context seems arbitrary or reduces one value to a metric of the other.
      *   **User's Proposal:** "Structured parity with lexical side-constraints." Neither value is traded off; each governs a non-overlapping domain.
      *   **Key Questions:**
          1.  Is this coherent for preserving incommensurability?
          2.  Does it rest on false presuppositions about parity, rational ordering, and domain separation?
          3.  Is the user wrong to assume parity precludes context-sensitive ranking?
          4.  What does this imply for hard choices in policy-making?
      *   **Constraints:** Respond in British English. Avoid citing specific texts or authors.

  2.  **Deconstruct the Theoretical Concepts:**
      *   **Incommensurability:** No common metric to compare values.
      *   **Parity:** A fourth relation beyond "better than," "worse than," and "equal to." It implies comparability but without a determinate ranking based on a single scale. It allows for rational choice without one option being strictly superior.
      *   **The User's Dilemma:** They fear that *choosing* one over the other implies commensurability (ranking them on a single scale) or arbitrariness (irrational choice).
      *   **The User's Solution:** Domain separation (lexical side-constraints). Transparency rules here, Privacy rules there. No overlap, no trade-offs.

  3.  **Evaluate the User's Proposal ("Structured Parity with Lexical Side-Constraints"):**
      *   *Coherence:* It is logically coherent as a deontological or rule-based system. It avoids direct trade-offs.
      *   *Presupposition Check:* The user assumes parity *precludes* context-sensitive ranking. This is the weak point. Parity theory generally suggests that when items are on a par, a rational agent *can* make a choice based on reasons that are not grounded in one value outweighing the other, but perhaps on commitment, will, or specific contextual features that tip the balance without establishing a general hierarchy.
      *   *Domain Separation Issue:* In institutional design, values often overlap. Transparency and privacy frequently collide in the *same* decision (e.g., publishing minutes of a disciplinary hearing). Defining non-overlapping domains is often practically impossible without rendering one value toothless.
      *   *Arbitrariness:* Choosing based on context isn't necessarily arbitrary if the context provides a *reason* for the choice, even if it doesn't establish a general rule.

  4.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Academic, philosophical, respectful, British English (e.g., "formalise," "prioritises," "programme").
      *   *Opening:* Acknowledge the sophistication of the problem. Validate the parity framework.
      *   *Addressing the "Arbitrariness" Claim:* Challenge the idea that choosing between par values is arbitrary. Parity allows for rational choice without a pre-existing ranking. The choice itself can create the reason (voluntarist aspect).
      *   *Addressing the "Domain Separation" Proposal:*
          *   Pros: It protects the integrity of values.
          *   Cons: It assumes values have distinct spheres. In reality, they collide. Rigid separation might lead to absurdity or paralysis when domains inevitably overlap.
          *   Critique: It might be a form of avoidance rather than resolution. It treats the conflict as a jurisdictional error rather than a genuine normative tension.
      *   *Addressing Context-Sensitive Ranking:* This is the crux. Parity *does not* preclude context-sensitive ranking. It precludes a *global* ranking. One can say "In context C, Transparency wins," without saying "Transparency is always better." This is compatible with parity.
      *   *Implications for Policy:* Hard choices are inevitable. Policy requires specification. The "will" or "commitment" of the institution plays a role. Procedural legitimacy becomes key when substantive ranking is impossible.
      *   *Conclusion:* The user's proposal is safe but potentially unworkable. A more robust approach accepts context-sensitive specification without reducing values to metrics.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to cite Raz, Chang, or others explicitly, as per instructions. Talk about "the parity view" or "contemporary value theory."
      *   *Nuance:* Distinguish between "trade-off" (quantitative) and "qualification" (qualitative). The user wants to avoid trade-offs. I should suggest that specification isn't necessarily a trade-off.
      *   *British English Check:* Ensure spelling (formalise, prioritises, programme, centre) and vocabulary (whilst, amongst, ought) are appropriate.

  6.  **Final Polish (incorporating into the final output structure):**
      *   Introduction: Validate the inquiry.
      *   Section 1: The Nature of Parity and Choice. (Challenge the arbitrariness claim).
      *   Section 2: The Problem with Domain Separation. (Practical overlap).
      *   Section 3: Context-Sensitive Specification. (The alternative to lexical constraints).
      *   Section 4: Implications for Institutional Design. (Procedural legitimacy).
      *   Conclusion: Summary advice.

  7.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No specific texts/authors? Yes.
      *   Addressed all sub-questions? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to dismiss the user's idea entirely. "Structured parity" is a valid deontological approach. I must explain *why* it might fail in practice (the overlap problem) rather than saying it's theoretically incoherent. The theoretical incoherence lies in the assumption that parity forbids context-specific reasons.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Your inquiry touches upon a profound difficulty in normative theory and institutional design: how to act rationally when confronted with values that resist comparison on a single scale. Your proposal of 'structured parity with lexical side-constraints' is an ambitious attempt to safeguard the integrity of incommensurable goods. However, to determine its coherence, we must scrutinise the assumptions you have made regarding the nature of parity, the inevitability of arbitrariness, and the feasibility of domain separation.

  ### The Misconception Regarding Parity and Choice

  Your initial concern rests on the premise that if two values are on a par, any decision to prioritise one over the other in a specific instance must be either arbitrary or a illicit reduction of one value to the metric of the other. This is the pivotal point where your framework may rest on a false presupposition.

  The parity view does not entail that rational choice is impossible between par items. Rather, it suggests that the rationality of the choice does not derive from a pre-existing fact that one option is better than the other. When values are on a par, the agent is not compelled by the weights of the values alone. Instead, the act of choosing can be grounded in reasons that are not strictly evaluative in a comparative sense. For instance, an institution might commit to transparency in a specific context not because transparency is 'more valuable' than privacy in that instance, but because the institution has formed a commitment or a policy intention that breaks the tie.

  Therefore, you are likely mistaken to assume that parity precludes context-sensitive ranking. Parity precludes a *global* or *determinate* ranking (i.e., that one is always better, or that they are exactly equal). It does not forbid an agent from having sufficient reason to choose one over the other in a particular circumstance. To claim otherwise is to conflate the indeterminacy of the values with the indeterminacy of the rational will. A choice between par options is not arbitrary if it is willed for a reason, even if that reason does not amount to a claim that one value has superseded the other in the abstract.

  ### The Feasibility of Domain Separation

  Your proposed solution—lexical side-constraints where each value governs a non-overlapping domain—is theoretically coherent as a form of deontological rule-utilitarianism or a rigid rights-based framework. It successfully avoids the appearance of trade-offs. However, in the context of institutional design, it faces a significant practical and conceptual hurdle: the assumption that epistemic transparency and procedural privacy possess distinct, non-overlapping spheres of authority.

  In complex institutions, these goods frequently collide within the very same decision. Consider the publication of findings from an internal review. To be transparent is to reveal the process; to preserve privacy is to withhold it. These are not separate domains; they are competing demands on the same action. By insisting on non-overlapping domains, you risk creating a framework that is either:
  1.  **Gerrymandered:** You define the domains so narrowly to avoid overlap that the values lose their substantive force (e.g., transparency applies only to public data, privacy only to personal diaries, ignoring the grey area of institutional conduct).
  2.  **Paralysing:** When an inevitable overlap occurs, the framework provides no mechanism for resolution, leading to decisional paralysis.

  Consequently, while your proposal preserves incommensurability by refusing to trade one value for the other, it may do so at the cost of rendering the institution incapable of functioning in hard cases. It treats the conflict as a jurisdictional error rather than a genuine normative tension that must be navigated.

  ### Context-Sensitive Specification vs. Trade-Offs

  A more robust approach to preserving incommensurability without resorting to rigid domain separation is to distinguish between *trading off* and *specifying*.

  A trade-off implies a quantitative sacrifice: we lose X amount of privacy to gain Y amount of transparency. This indeed suggests commensurability. However, specification is qualitative. It involves determining what the value *requires* in a specific context. One might argue that in the context of safety investigations, 'procedural privacy' does not mean total secrecy, but rather confidentiality limited to specific stakeholders. Simultaneously, 'epistemic transparency' does not mean public disclosure, but rather auditability by experts.

  In this view, the values are not being weighed against one another on a scale. Instead, the institution is defining the contours of the values themselves as they apply to the case. This allows for context-sensitive ranking without reducing one value to a subordinate metric. The choice is not 'privacy over transparency,' but rather 'the version of transparency appropriate here is compatible with the version of privacy required here.' When they cannot be made compatible, a choice must be made, but this choice can be framed as a commitment to a specific institutional identity rather than a calculation of value magnitude.

  ### Implications for Policy-Making and Hard Choices

  If we accept that parity allows for context-sensitive choice without arbitrariness, the implications for policy-making are significant.

  First, it shifts the burden of legitimacy from *substantive correctness* to *procedural authority*. Since reason alone cannot dictate the choice between par options, the legitimacy of the decision rests on the authority of the body making the choice and the integrity of the process by which they decide. Institutional design must therefore focus on who decides and how, rather than attempting to write rules that pre-determine every outcome.

  Second, it acknowledges the role of 'will' in institutional governance. Hard choices are not merely puzzles to be solved by better analysis; they are moments where an institution defines its character. Acknowledging parity allows policymakers to admit that a cost is being incurred (a genuine loss of a good) without claiming that the loss was justified by a greater gain. This honesty can preserve trust even when stakeholders disagree with the outcome.

  ### Conclusion

  Your proposal of structured parity with lexical side-constraints is a coherent attempt to protect incommensurable values from being flattened into a single metric. However, it relies on the questionable assumption that values can be hermetically sealed into non-overlapping domains. Furthermore, your inference that parity forbids context-sensitive ranking is theoretically unsound; parity forbids a *determinate* ranking, not a *reasoned* choice.

  A more flexible framework would accept that hard choices involve specification and commitment rather than trade-offs. This preserves the incommensurability of the goods—acknowledging that something of genuine value is set aside—while avoiding the paralysis of rigid domain separation. In doing so, you allow for rational institutional action in the face of value conflict, without resorting to the fiction that all goods can be measured on a common scale.
