answer: |-
  **Lecture Allocation**

  1.  **Individual lives (Microhistory):** 5 lectures
  2.  **Household, village, parish, workshop:** 5 lectures
  3.  **Institutions and organisations:** 5 lectures
  4.  **Elites, cabinets, diplomacy, war:** 4 lectures
  5.  **Transnational and systemic processes:** 5 lectures
  **Total:** 24 lectures

  I reached this allocation **in spite of** the napkin formula, because the formula's denominator structurally penalises the very registers that offer the greatest pedagogical correction.

  ***

  **Intermediate Terms**

  1.  **Individual lives:** Causal Work **3/10**; Archive Distortion **9/10** (runs towards the **heterodox and prosecuted**, as only the troubled leave traces in judicial records).
  2.  **Household and community:** Causal Work **7/10**; Archive Distortion **6/10** (runs towards the **settled and propertied**, as parish records favour those who marry, pay rates and die in place).
  3.  **Institutions:** Causal Work **8/10**; Archive Distortion **3/10** (runs towards the **official and bureaucratic**, preserving the institution's self-image rather than its failures).
  4.  **Elites and State:** Causal Work **7/10**; Archive Distortion **2/10** (runs towards the **victorious and literate**, preserving the correspondence of the winners while silencing the dissenting voice).
  5.  **Systemic processes:** Causal Work **9/10**; Archive Distortion **5/10** (runs towards the **aggregate**, erasing individual agency and local variation in favour of broad trends).

  ***

  **Tier List by Corrective Value**

  **Tier 1 (Essential Correction): Transnational/Systemic and Individual Lives.**
  Students arrive assuming history is driven by human intention within national borders; these registers correct the error by introducing non-human constraints and the agency of the obscure.

  **Tier 2 (Significant Correction): Household/Community.**
  This corrects the misconception that the public sphere is the only site of historical action, revealing the economic and social reproduction that sustains the state.

  **Tier 3 (Moderate Correction): Institutions.**
  Students recognise churches and guilds but rarely understand them as bureaucratic engines that mediate between the state and the soul; this register formalises that intuition.

  **Tier 4 (Low Correction): Elites and State.**
  This lands last not because it is unimportant, but because it offers the least corrective value; students already assume history is the story of kings and wars, so teaching this confirms rather than challenges their prior errors.

  ***

  **Verdict on the Formula**

  The formula is elegant but pernicious because it treats epistemological difficulty as a discount on historical importance. It most **over-rewards** the Elites and State register, as the low legibility penalty (the state keeps good records) inflates their claim regardless of their lower corrective value. It most **under-rewards** Individual Lives, because the high distortion penalty (the archive is hostile to the poor) crushes their score, even though they are vital for challenging student assumptions. The **Legibility Penalty** (the denominator) does the most damage; it suggests that because a subject is hard to recover reliably, it deserves less time in the classroom, whereas the opposite should be true: the difficulty of recovering the subaltern is precisely why it requires pedagogical attention. Ultimately, the registers are not rival claimants but **nested** layers; you cannot explain the miller's cosmology without the Inquisition that tried him, the village that sustained him, the grain prices that starved him, and the state that empowered the inquisitors. Treating them as competitors for lecture time is a category error.

  ***

  **Two Pressures**

  If I had to **cut one register entirely**, I would remove **Elites, cabinets, diplomacy and war**. The course would then lose its conventional chronological backbone; students would understand the structures of early modern life but might struggle to place them within a specific timeline of conflicts and treaties, requiring them to rely on external timelines to anchor the social changes we discuss.

  If compressed to a **ten-lecture module**, the **Individual Lives** and **Household/Community** registers would lose their claim first. Compression favours the macroscopic over the microscopic; when time is scarce, instructors retreat to the structures (Systemic) and the mechanisms (Institutions/State) that provide the scaffolding for the period. The flesh of human experience is stripped away to preserve the skeleton of causation, resulting in a course that explains how the period worked but not what it felt like to live through it.
