      *   **Part (a) Independence Axiom:** Needs a formal or precise statement. Usually: If $L \succeq L'$, then $\alpha L + (1-\alpha)L'' \succeq \alpha L' + (1-\alpha)L''$ for all $\alpha \in (0,1]$ and lottery $L''$.
      *   **Part (b) Proof:** Show algebraic contradiction.
          *   Q1: $u(1) > 0.89u(1) + 0.10u(5) + 0.01u(0)$.
          *   Q2: $0.10u(5) > 0.11u(1) + 0.89u(0)$.
