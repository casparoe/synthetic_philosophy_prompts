answer: |-
  The spreadsheet held eleven rows. Mara highlighted the column labeled *P(False Negative)* and typed the formula. She knew the number by heart, but she needed to see it render.

  One in six. That was her estimate for any single group's confidence being misplaced. A standard deviation of hubris. If the eleven actors were independent variables—four university labs, two startups, the National Institute, the Foundation, and Elias in the greenhouse—the arithmetic was straightforward. The probability that *all* of them were correct was $(5/6)^{11}$. The probability that at least one was confidently wrong was one minus that.

  She watched the cell populate: 0.865.

  Eighty-six percent chance that at least one of them was walking toward a cliff they believed was solid ground. In a normal market, this was noise. In this context, where a single release at scale rendered the restraint of the other ten moot, it was a certainty of disaster. The unilateral capacity to release meant the collective risk was not the average of the parts, but the maximum.

  But they were not independent. Mara deleted the formula. She opened a new tab and pulled up the citation graph for the foundational preprint on *Rhizobium* strain modification. Every group here had built their assay on Protocol 7-B. Three of the lead postdocs across the university labs had trained under the same two advisors at Zurich. The startups had licensed the same sequencing hardware.

  They were not eleven judges; they were one judge looking into ten mirrors.

  If the error was in the protocol, the correlation coefficient approached one. The calculation shifted. The probability that *all* were wrong was no longer negligible; it was simply the probability that the protocol was wrong. One in six. But the "wisdom of the crowd" mechanism—the idea that the median assessment would filter out outliers—collapsed. If the bias was systematic, the median was not a correction; it was a consensus hallucination. Averaging eleven copies of the same mistake did not produce truth. It produced confidence.

  Mara saved the file. Her job was to coordinate the notification body, a mailbox with a budget line and no authority. She was paid to inform, not to stop. But the math demanded a stop.

  The video conference convened at 14:00 UTC. Eleven squares on the grid. Mara kept her camera off; she was the secretariat, not a voter.

  Dr. Aris Thorne from the Foundation spoke first. He was the loudest square, his background a blurred office of books he likely hadn't opened in a decade.

  "We are dancing on a timer," Thorne said. "The agronomic window closes in six weeks. If we do not deploy the coating for the autumn planting, we miss the cycle. And if we miss the cycle, someone else takes the market. If I am second to publish, I lose the leverage to enforce safety standards. Being second is fatal."

  Mara unmuted. "Dr. Thorne, this is not a race. It is a lottery. If any one of you releases, the microbe enters the soil matrix. It replicates. Restraint by the other ten purchases nothing. You do not gain safety by being first. You only gain priority."

  Thorne's square jerked. "Priority is the only currency that matters, Mara. Without it, we are just another NGO. With it, we can dictate the terms of remediation."

  "You cannot dictate terms to a self-replicating organism," Mara said. "And you are not competing against each other. You are competing against the probability that Protocol 7-B is flawed."

  "Then we assess the probability," Thorne snapped. "And we move."

  "If you assess it individually, you are gambling," Mara said. "I propose a bind. We calculate the median risk assessment of this group. We agree, contractually, that no one releases unless the median judgment says the risk is acceptable. No single confident error can move the lever."

  Silence stretched across the bandwidth. It was the obvious remedy. It removed the unilateral capacity to disaster.

  "I can't sign that," said Sarah from the Startup bloc. She was the most cautious voice in the previous sessions, always requesting further longitudinal data. "Liability. If I bind to the median, and the median is wrong, I share liability with the National Institute. I cannot expose my investors to their indemnity clauses."

  Mara felt the floor drop. Sarah's caution was not epistemic. It was financial. She hadn't been holding back to save the soil; she was holding back to save her equity.

  "I will draft the waiver," Mara said. "I will assume the coordination liability."

  "You?" Thorne laughed. "You coordinate a mailbox."

  "I am coordinating the data," Mara said. She knew what she had to do. To make the Pact real, she had to make the cost of breaking it higher than the cost of keeping it. She had to change the incentives.

  "I am publishing the risk registry," Mara said. "Publicly. All eleven assessments, the correlation analysis, and the hazard model. If you break the Pact, you break it in the light."

  "You can't do that," Thorne said. "That's proprietary."

  "It's already in the protocol," Mara said. "I'm releasing the derivation."

  She clicked *Send* before anyone could veto. It was a unilateral act to enforce a collective bind. She made the hazard public to shame them into safety.

  The meeting fractured. Thorne muted himself. Sarah left the call. Only Elias, the lone grower, remained visible. He was sitting in a leased greenhouse, sunlight hitting the polycarbonate behind him.

  "Mara," Elias said. His voice was quiet. "You know what fertilizer costs this season?"

  "I know the figures, Elias."

  "Do you?" He leaned forward. "In my region, the price doubled. Nitrogen is out of reach for half the growers I supply. If this coating works, I can keep them on the land. If I wait for the median... the median doesn't eat. The median doesn't lose the farm."

  "The risk is irreversible," Mara said.

  "The poverty is also irreversible," Elias said. "You calculate the probability of soil contamination. I calculate the probability of my neighbors selling their children's future to pay for urea. You say one in six chance of error. I say one hundred percent chance of ruin if I do nothing. Why is your risk real and mine hypothetical?"

  Mara had no answer that wouldn't sound like privilege. She ended the call.

  The consequences of her unilateral leak arrived three days later. A briefing note landed in her inbox from a contact in the trade ministry. A state-backed agribusiness, not part of the eleven, not signed to any registry. Let's call them VolgaAg.

  They had seen the public registry. They had seen the hazard model. They knew the eleven ethical groups were now bound by a median pact that would likely delay release. They knew the market would be vacant.

  VolgaAg was moving. They had learned the hazard existed from Mara's own registry, and they had decided the hazard was acceptable compared to the market opportunity. The apparatus built to shrink the number of dangerous actors had increased it. She had signaled the value of the prize to a player who did not care about the rules.

  Mara sat in her office. The arithmetic ran in her head again.
  Independent error: 86%.
  Correlated error: 16%.
  VolgaAg release: 100%.

  If VolgaAg released, the eleven were irrelevant. The microbe would be in the soil regardless. The Pact was worthless. The caution was pointless. The only variable left was whether the eleven could mitigate the damage of the twelfth, or whether they should release their own version, which was at least monitored, to crowd out the unmonitored strain.

  Thorne called her. "You see this?"

  "I see it."

  "They're going to beat us. If we wait for the median, they own the genome. If we release now, we can at least track our strain."

  "That violates the Pact."

  "The Pact is dead. The twelfth party killed it. Now we are back to the race."

  "We are not back to the race," Mara said. "We are in the aftermath."

  "Then let me manage the aftermath," Thorne said. "Give me the green light. Tell me the median is clear."

  "The median is not clear. The correlation is too high."

  "Then you are useless," Thorne said, and hung up.

  Mara looked at the vial on her desk. It was a sample from the National Institute, sent weeks ago for the registry logs. A seed coating slurry. Grey, viscous.

  She had a garden. A small plot behind her rental house. Tomatoes, beans. She bought her fertilizer at the big box store, same as everyone else.

  If she applied the coating to her garden, it was a test. A single data point. Unobjectionable. A coordinator verifying the data.
  If the eleven saw her do it... if they saw the Coordinator planting the seeds... it would signal that the risk was managed. It would break the Pact without technically breaking it. It would give Thorne the cover he needed. It would give Elias the justification he needed.

  And if eleven people took that signal and applied the coating to their respective trials, scaling it up... it was a release.

  But if only she did it, it was just a garden.

  She looked at the vial. She thought of Elias's neighbors selling futures. She thought of VolgaAg moving blindly into the soil, unmonitored, untracked. If the eleven waited, the unmonitored strain would dominate. If the eleven released, at least there would be data. There would be a network of eyes on the disaster.

  Was it better to have a monitored disaster or an unmonitored one?

  The math didn't answer that. The math only said that error was likely. It didn't say whether action was better than inaction when action was inevitable by other hands.

  Mara picked up the vial. She walked out to the garden. The soil was dry, cracked from the heat. She knelt. She took a handful of seeds. She dipped them into the grey slurry.

  It was a small thing. One person coating seeds. It was what a gardener did. It was what a scientist did. It was harmless in isolation.

  She pressed the seeds into the earth. She covered them. She watered them.

  If eleven people did this, the nitrogen would fix. The soil would change. The cascade would begin.
  If only she did it, the tomatoes would grow.

  She stood up and wiped her hands on her trousers. She went inside and opened her laptop. She logged into the Registry. She updated the status of the National Institute sample from *Pending* to *Verified*.

  She did not send an email. She did not call Thorne. She just changed the status. It was an administrative act. A clerical correction. If one admin corrected a file, it was routine. If the system treated that correction as a clearance for release, it was a trigger.

  She closed the laptop. She waited for the phone to ring. It would ring. Thorne would see the status. Elias would see the status. VolgaAg would see the status.

  She had not solved the equation. She had simply introduced a new variable. She had made herself the first.

  Outside, the water soaked into the dry earth, darkening the soil around the seeds. It looked like nothing. It looked like gardening. It looked like the end of the world.

  Mara went to the kitchen and made tea. She sat by the window where she could see the patch of dirt. She watched it. She did not look away.
