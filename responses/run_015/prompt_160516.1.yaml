      *   *Point 1 (Increased/Diminished vs. Aided/Constrained):*
          *   "Increased/Diminished" refers to the *power of acting* (*potentia agendi*).
          *   "Aided/Constrained" (*juvatur vel coercetur*) refers to the *transition* or the *process*.
          *   Actually, looking at the Latin (*corpus... aptius redditur... vel ineptius*), it's often about the capacity to be affected.
          *   Standard interpretation: It's largely rhetorical reinforcement, but "aided/constrained" emphasizes the *causal* interaction with external bodies, whereas "increased/diminished" emphasizes the internal state of power. It underscores the dynamic nature. It's not just a static level; it's about being helped or hindered in existing.
          *   *Verdict:* Mostly rhetorical doubling for emphasis, but "aided/constrained" hints at the external causal context.

      *   *Point 2 ("And also the ideas"):*
