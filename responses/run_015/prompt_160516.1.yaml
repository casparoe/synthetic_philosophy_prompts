      *   *Mate (Perceptual/Cognitive Theory):* Emotions are the mind's registration/idea of the change in power. The bodily part is the object, but the emotion *is* the mental side.
      *   *Spinoza's Metaphysics:* Mind and Body are one substance under two attributes (Thought and Extension). They are identical in reality but conceptually distinct. You cannot have one without the other.
      *   *Verdict:* The Mate is closer to the standard scholarly interpretation, but the User isn't entirely wrong about the bodily basis. However, for Spinoza, an emotion *as experienced* is a mental state (an idea). A bodily modification without an idea isn't an *affectus* (emotion) for the *mind*, it's just a physical state. The definition says "modifications... *and also* the ideas". It's a union. But since the *Ethics* is primarily an guide for the mind's freedom, the mental aspect is crucial.
      *   *Refinement:* Actually, Spinoza defines *Affectus* (often translated as Emotion or Affect) as *both*. But the *experience* of it is the idea. If the mind doesn't have the idea, the mind isn't affected. So the Mate is closer on "what emotions *are* for us," but the User is right that they *ground* in the body.
      *   *Decision:* The Mate wins on the definition of *emotion* as a psychological phenomenon, but the User is right that it's not a "judgement" in the Stoic sense. It's a perception of bodily power.

