      *   *Self-Correction on Point 1:* "Aided or constrained" (*juvatur vel coercetur*) is often seen as synonymous with increased/diminished power in this context, but some scholars argue it refers to the *capacity to be affected* by external bodies. I should lean towards the rhetorical/emphatic view but acknowledge the causal nuance.
