  1.  **Analyze the User's Request:**
      *   **Context:** The user had a disagreement with their roommate about the nature of democracy (voting vs. experiment) based on John Dewey's philosophy.
      *   **Roommate's Claim:** Democracy is experimentalism; policies are falsifiable hypotheses; majority rule is bad science.
      *   **User's Stance:** Skeptical, thinks the roommate is stretching it, but wants to understand the implications.
