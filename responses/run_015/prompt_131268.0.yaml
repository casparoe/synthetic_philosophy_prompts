      *   *The "Scientific Method" Analogy:* Dewey loved the scientific method (problem -> hypothesis -> test -> evaluation). He thought society should work the same way.
      *   *Voting:* Dewey didn't hate voting, but he thought it was the *end* of a process, not the *substance*. If you vote without prior inquiry/discussion, it's just a headcount of prejudices.
      *   *Inquiry:* This is the core. Knowledge isn't static; it's made through action and reflection.
      *   *The Roommate's Point:* "Majority rule is bad science." This is a strong claim. In science, truth isn't decided by a vote. So, if democracy is inquiry, voting *alone* is insufficient.

  3.  **Address the Core Conflict (Voting vs. Experiment):**
      *   The roommate isn't entirely wrong, but they might be being reductionist.
      *   Voting *can* be a failure if it stops inquiry.
      *   But voting *can* also be a tool to authorize the next experiment.
      *   The key shift is from "Who wins?" to "What works?"

  4.  **Apply to Small Online Communities (The Practical Application):**
      *   Online communities (Discords, subreddits, forums) are perfect test beds for Deweyan ideas. They have rules, moderation, and culture.
      *   *Traditional Model:* Admins decide rules, users vote (maybe), mods enforce.
      *   *Deweyan Model:* Rules are hypotheses. "If we ban links, engagement will go up." Test it. Review data. Adjust.
