answer: |-
  Look, your roommate is annoying, but they aren't totally wrong. They're just taking a sledgehammer to a concept that usually gets treated like fine china.

  Here's the breakdown of Dewey's experimentalism without the academic fluff, and how it actually applies to running a Discord server or a subreddit.

  ### 1. Democracy isn't a machine; it's a lab
  Most people think democracy is a counting machine: you put ballots in, you get a government out. Dewey thought that was dead wrong. He saw democracy as a method of **collective intelligence**.

  If you treat democracy like an experiment, the goal isn't "winning." The goal is **learning**.
  *   **Traditional View:** We vote to see who has the most power.
  *   **Deweyan View:** We vote to authorize a course of action so we can see what happens, then we report back.

  So, when your roommate says "majority rule is bad science," they mean that truth isn't decided by a show of hands. In science, if 99 scientists vote that gravity doesn't exist, the 100th guy who drops a rock still wins. If democracy is about finding solutions to shared problems, a vote shouldn't settle the *truth* of the matter; it should only settle the *next step* of the test.

  ### 2. Is voting a methodological failure?
  This is the crux of your fight. The answer is: **Voting is a failure only if it stops the conversation.**

  If you vote on a rule and then say, "Okay, it's passed, no more talking about it, just obey," that is anti-inquiry. That's dogma.
  But if you vote and say, "Okay, we're going to try this rule for three months. We suspect it will reduce toxicity. Let's check the data and talk again in June," then the vote wasn't a failure. It was an experimental design choice.

  **The implication:** Voting shouldn't be the end of the process. It should be the start of the implementation phase. If your online community uses voting to shut down dissent, you're doing it wrong. If you use voting to allocate resources for a test, you're doing it right.

  ### 3. How this changes online community design
  If you actually apply this to a small online community (like a forum, a DAO, or a Discord), the rules look totally different.

  **A. Rules are Hypotheses, not Commandments**
  Instead of "Rule 5: No self-promotion," the rule is framed as, "We are limiting self-promotion to preserve signal-to-noise ratio."
  *   **Implication:** Rules need expiration dates or review periods. You don't just ban something forever; you ban it *until* we see if it actually hurts the community.
  *   **The Shift:** Moderation isn't about punishment; it's about data collection. Why did this break the rule? Was the rule bad, or was the user bad?

  **B. Dissent is Data, not Disruption**
  In a standard democracy, the minority loses. In an experimental democracy, the minority is the **control group**.
  *   **Implication:** If 80% of your community wants to change a feature and 20% hate it, you don't just crush the 20%. You need to understand *why* they hate it. They might see a bug in the hypothesis the majority missed.
  *   **The Shift:** You design channels specifically for criticism. A "complaints" channel isn't a toxicity pit; it's your peer review board.

  **C. Transparency of Results**
  Science requires publishing results. Most communities make rules in secret admin channels and announce them as decrees.
  *   **Implication:** Admins need to say, "We tried X, it failed because of Y, so we're trying Z."
  *   **The Shift:** This builds trust. People tolerate failure if they know the admins are learning. People revolt when they think admins are just guessing or power-tripping.

  ### 4. Where your roommate is stretching it
  Here's where you can push back in the argument. Dewey's experimentalism is great for *policy*, but it hits a wall with *values*.

  You can't treat human rights or basic ethics as "falsifiable hypotheses." You don't run an experiment to see if "allowing harassment increases engagement." Some things are axiomatic. If your roommate thinks *everything* is up for experimental debate, they're advocating for paralysis. You need some fixed stars (values) to navigate by, even if the map (policy) is always being redrawn.

  Also, real experiments take time. Online communities move at light speed. Sometimes you just need to ban a spam bot immediately. You don't hold a town hall to hypothesize about the bot's intent. Dewey works for governance, not necessarily for emergency moderation.

  ### 5. The Verdict
  Your roommate is right that **voting without inquiry is just mob rule.** If you vote on things you haven't discussed, researched, or understood, you're just aggregating ignorance.

  But you're right that **voting is still necessary.** You can't inquire forever. At some point, you have to commit to a path to see if it works.

  **The Coffee Shop Takeaway:**
  Tell him this: "Democracy isn't the vote. Democracy is the infrastructure that makes the vote intelligent."
  If your online community wants to be Deweyan, stop building voting booths and start building laboratories. Make the rules editable, make the data public, and treat the minority opinion as a bug report, not a loss.

  If you do that, voting isn't a failure. It's just the moment you hit "Run" on the code.
