prompt: |-
  You're a formal epistemologist — someone who actually works on imprecise credences and decision rules for them, not a generalist who's going to tell me to just pick a prior and shut up. Please brainstorm a bit before you commit to anything; I'd much rather watch you try two or three candidate principles and break them than get one tidy answer that quietly ignores half my cases.

  Some context for why this is suddenly not academic for me: I somehow became the person at work who sets the opening odds for our little internal prediction market (long story, I made a spreadsheet once), and at the same time I'm trying to decide whether to put real money into my friend's startup and whether to buy the separate flood insurance on a house we're closing on next month. And the more I try to be honest about what my actual states are, the less they look like numbers and the more they look like sets or intervals. Here's where I land, going case by case. (1) I read that about 1 in 6 people here are left-handed; I know nothing else about this specific guy; I feel totally sharp about 1/6 and would take either side of a 5:1 bet. (2) Ellsberg urn, 30 red and 60 that are black or yellow in some unknown mix: I'd definately pay more for a ticket that pays on red than one that pays on black, and it's not that I think the urn is out to get me, it's that I don't know which. (3) Coin I found in a drawer, never flipped, could in principle be bent: I act on 1/2 without hesitation. (4) Two weather models I respect equally, one says 30% rain and one says 70%, and they disagree because of different assumptions about the physics: I refuse to say 50%, and my honest state feels like an interval, [0.3, 0.7]. (5) Friend's startup: I'd say somewhere between 5% and 40% that it works out, and if you made me name a single price to buy or sell at I'd just decline, even for trivial amounts. (6) Flood risk: the map says roughly 1% a year, a hydrologist friend says the models ignore new upstream development, my interval is more like [1%, 4%] — and there I act on the pessimistic end and buy the insurance. (7) My interval on the startup was [0.05, 0.4]; then I found out their main competitor got acquired by Google, which is clearly bad news on net, and my interval got *wider*, [0.02, 0.45], even though nothing about it was good news. (8) The assay in our lab either has a real 90% sensitivity or it's basically broken and at 50%: I want my credence to be the two-point set {0.5, 0.9}, and I really don't want to be committed to 0.7 as an admissible stand-in — I've heard convexity gets forced on you by accuracy considerations but I don't see it. (9) Chain four links that I'd each call [0.6, 0.8] and naive interval arithmetic gives me [0.13, 0.41] for the conjunction, which feels way too wide, so either my per-link intervals are too wide or the propagation rule is wrong. (10) Before I check the three weather apps in the morning, knowing they're each about 80% accurate and will sometimes disagree: my gut says I should feel more uncertain before I look than after, but my head says that's crazy, since I know exactly what I'd believe given each combination of readings. Also, one detail that might matter: the ends of my intervals feel hard-edged, but I don't have any distribution *over* the interval — I'm not secretly uniform on [0.3, 0.7].

  The only principle I've managed to articulate is something I've started calling the chance-gap rule: my credence in P is imprecise just when what I'm ignorant about is the chances rather than merely the outcome, and the width of the interval should be the spread of chances I can't rule out. I think that gets (2), (4) and (6) and badly fails (5), since for a one-off startup there arguably aren't any chances to be ignorant about. The pair that really bothers me is (1) against (4): in both I'm aggregating over ignorance I can't resolve, but in one that feels obviously right and in the other it feels like fake precision. And (5) against (6) bothers me too — refusing to act at all versus acting on one end. So: is there a principle, or a short list of candidates, that captures these verdicts, stated precisely enough that I could actually apply it? Tell me which clause is doing the work in which case, be straight with me about which of my verdicts it forces me to give up, and tell me what it predicts for a case I haven't listed — say, after thirty straight clean runs with that assay, should my interval on its sensitivity have collapsed to something sharp, or does some imprecision survive no matter how much data I get?
