answer: |-
  This is a genuinely sophisticated set of intuitions. You have effectively reconstructed the core tensions in the literature on Imprecise Probabilities (IP) — specifically the debates between Walley's behavioral theory, Levi's E-admissibility, and the more recent work on dilation and non-convex sets — but you've done it through practical case work rather than axioms.

  The reason you feel friction is that you are trying to force a single *credal* principle to do the work of both *epistemology* (what do I believe?) and *decision theory* (what do I do?). In the formal literature, we usually separate these. Your cases (5) and (6) are the smoking gun: identical credal states ([0.05, 0.4] vs [0.01, 0.04]) yielding different decision rules (Indecision vs. Maximin).

  Here is the brainstorming process. I will propose three candidate principles, stress-test them against your ten cases, and then synthesize the one that survives, along with the specific costs you will have to pay to hold it.

  ### Candidate 1: The "Direct Inference" Principle
  **Principle:** Your credence is sharp if and only if there is a known objective chance or a symmetry constraint. It is imprecise if and only if you are aggregating over a set of epistemically admissible models with no meta-probability over them.
  *   **Verdict on Cases:**
      *   **Passes:** (1) Reference class = known chance. (3) Symmetry = sharp. (4) Model conflict = imprecise. (8) Two discrete hypotheses = non-convex set.
      *   **Fails:** (2) Ellsberg. There is no "model conflict" here, just a lack of information. This principle struggles to explain why (2) is imprecise while (3) is sharp, as both involve physical objects with unknown properties.
      *   **Fails:** (7) Dilation. Why does bad news widen the set of *admissible models*? This principle needs an auxiliary theory of model selection to explain widening.
      *   **Fails:** (5) vs (6). This is a credal principle; it offers no guidance on why you act differently in these two cases.

  ### Candidate 2: Walley's Behavioral Coherence (Lower Previsions)
  **Principle:** Your state is defined by your buying and selling prices. $\underline{P}(A)$ is the max you'll buy at; $\overline{P}(A)$ is the min you'll sell at. Coherence requires you avoid sure loss.
  *   **Verdict on Cases:**
      *   **Passes:** (5) & (6) beautifully. In (5), $\underline{P} < \text{Price} < \overline{P}$, so you decline. In (6), if the insurance premium is below your $\underline{P}(\text{Loss})$, you buy.
      *   **Passes:** (9). Walley explicitly warns against naive interval arithmetic on conjunctions without specifying the joint credal set.
      *   **Fails:** (8) Convexity. Standard coherence arguments (avoiding Dutch Books) tend to force the set of probabilities to be convex (closed under mixture). If you refuse to accept 0.7 for the assay, you are technically vulnerable to a "Dutch Book" if the bookie knows your set is {0.5, 0.9} and offers you a mixture of bets. You have to bite the bullet that you are *incoherent* by standard definitions, or adopt a weaker coherence notion.
      *   **Fails:** (10). Standard reflection principles suggest your current expectation of your future credence should equal your current credence. If you know you will be imprecise later, standard theory says you should be imprecise now, but it doesn't easily handle the "more uncertain before than after" intuition without invoking dilation.

  ### Candidate 3: The Admissible Model Representor (AMR) + Stakes-Sensitive Choice
  **Principle:**
  1.  **Credence:** Your state is the set $\Gamma$ of probability functions generated by all *epistemically admissible* models (including "ignorance" models). $\Gamma$ need not be convex.
  2.  **Updating:** Evidence conditions each $P \in \Gamma$. However, evidence can also *add* models to $\Gamma$ if it reveals structural uncertainty (Dilation).
  3.  **Decision:**
      *   **Speculative/Reversible:** Use **E-Admissibility**. Act only if an option maximizes expected utility for *some* $P \in \Gamma$. If multiple options are E-admissible, declare indecision (Case 5).
      *   **Safety-Critical/Irreversible:** Use **$\Gamma$-Maximin**. Maximize the minimum expected utility across all $P \in \Gamma$ (Case 6).

  **Verdict on Cases:**
  *   **Passes:** (1)-(4), (8). The "Admissible Model" clause handles the sharp vs. imprecise distinction. (1) has one admissible model (frequency). (4) has two. (8) has two discrete ones.
  *   **Passes:** (5) & (6). The Decision clause handles the split. Startup = Speculative (Indecision allowed). Flood = Safety (Maximin required).
  *   **Passes:** (7). This is the strongest point for AMR. Bad news (competitor acquired) doesn't just shift the probability of success; it undermines the *reliability* of your initial market model. You add a "Market Volatility" model to $\Gamma$. The set widens.
  *   **Passes:** (10). This is **Dilation**. If you know the weather apps (models) might disagree, your current $\Gamma$ must encompass the union of their possible outputs. You are *more* imprecise before looking than after, because looking selects a subset of models.
  *   **Fails/Requires Nuance:** (9). AMR requires you to specify the *joint* set of probabilities, not just marginals. If you treat the four links as independent in every $P \in \Gamma$, the interval narrows ($0.6^4$ to $0.8^4$). If you allow for unknown correlation in $\Gamma$, it stays wide. Your intuition that [0.13, 0.41] is "too wide" suggests you implicitly believe the links are positively correlated or that your marginal intervals are too conservative. AMR forces you to make this dependency explicit.

  ---

  ### The Synthesis: What You Should Adopt

  You should adopt **Candidate 3**, but you need to be precise about the clauses. Here is the formalized version of the principle that captures your verdicts, followed by the costs.

  #### The Principle of Admissible Models with Stakes-Sensitive Choice (AM-SSC)

  **Clause A (The Representor):** Let $\mathcal{M}$ be the set of probabilistic models you cannot rule out on epistemic grounds (including symmetry, frequency, and expert testimony). Your credal state is $\Gamma = \{ P : P \text{ is generated by } M \in \mathcal{M} \}$.
  *   *Note:* $\Gamma$ is **not** required to be convex. If $M_1$ yields $P=0.5$ and $M_2$ yields $P=0.9$, and no model yields $0.7$, then $0.7 \notin \Gamma$.

  **Clause B (Updating & Dilation):** Upon receiving evidence $E$:
  1.  Condition each $P \in \Gamma$ on $E$.
  2.  Check if $E$ undermines the reliability of any $M \in \mathcal{M}$. If so, expand $\mathcal{M}$ to include "failure mode" models. (This captures Case 7).
  3.  If $E$ is a prediction from a model you currently treat as uncertain, your pre-observation state must include the convex hull of the possible posterior states. (This captures Case 10).

  **Clause C (Decision):**
  1.  **Default:** An act is **permissible** if it is E-admissible (maximizes utility for some $P \in \Gamma$).
  2.  **Safety Override:** If the act involves irreversible, catastrophic loss (e.g., homelessness from flood), an act is permissible **only if** it maximizes the minimum expected utility across $\Gamma$ (Maximin).
  3.  **Market Constraint:** If setting odds (Prediction Market), you must post a single number. You are forced to pick a $P \in \Gamma$. To avoid sure loss against informed traders, pick the $P$ that minimizes your maximum regret (Minimax Regret) relative to $\Gamma$.

  ---

  ### Where This Principle Bites (The Costs)

  You asked me to be straight about which verdicts you have to give up. Here is the bill:

  1.  **You must accept Vulnerability to Dutch Books (Case 8).**
      By rejecting convexity in Case 8 (refusing 0.7), you violate standard coherence. A clever bookie can offer you a mixture of bets that looks good on {0.5, 0.9} but guarantees a loss if the "true" probability is treated as a mixture.
      *   *Defense:* You don't care. You aren't trading against a bookie who knows your $\Gamma$; you are acting on *admissible models*. Intermediate values are *inadmissible*, not just unlikely. You pay the price of "incoherence" to maintain semantic honesty.

  2.  **You must accept Indecision as a Stable State (Case 5).**
      Standard decision theory requires you to pick. AM-SSC says "Decline" is a rational output. In your prediction market job, this is dangerous.
      *   *Correction:* See Clause C.3. As the *market maker*, you have a functional role that overrides your personal epistemology. You must post a number. The principle forces you to use **Minimax Regret** there, even if you use **Maximin** for your flood insurance. You cannot be "imprecise" in the market; you must be "robust."

  3.  **Case 9 requires explicit Dependency Modeling.**
      Your intuition that [0.13, 0.41] is too wide is correct *only if* the links are independent. Naive interval arithmetic assumes Fréchet bounds (unknown dependence).
      *   *Correction:* AM-SSC forces you to specify if the models in $\Gamma$ assume independence. If your admissible models include "common cause failure," the wide interval is correct. If your admissible models all assume independence, the interval narrows. You cannot have it both ways.

  ### Prediction: The Assay After 30 Clean Runs

  You asked: *After thirty straight clean runs with that assay, should my interval on its sensitivity have collapsed to something sharp, or does some imprecision survive?*

  **AM-SSC Prediction:** **Imprecision survives.**

  Here is why:
  Your initial set was $\mathcal{M} = \{ \text{Working (0.9)}, \text{Broken (0.5)} \}$.
  30 clean runs is strong evidence against the "Broken" model *if* "Broken" means "Random Noise."
  However, in Case 8, you specified the Broken state as "Basically broken at 50%." If "50%" means $P(\text{Positive}|\text{Present}) = 0.5$, 30 positives in a row is statistically impossible ($0.5^{30}$). You would rule out the Broken model entirely.

  **But:** The AM-SSC Clause B (Dilation) intervenes.
  The fact that you are asking this question implies you have a third admissible model: **"The Calibration Drift Model."**
  Even if the assay works now, do you know it will work tomorrow? Is the "90%" a fixed chance, or a propensity that varies?
  *   If your $\mathcal{M}$ contains only {Fixed 0.9, Fixed 0.5}: The interval collapses to sharp {0.9}.
  *   If your $\mathcal{M}$ contains {Fixed 0.9, Fixed 0.5, **Variable [0.8, 0.95]**}: The interval collapses to [0.8, 0.95].

  **My advice:** Given your intuition in Case 7 (bad news widens intervals), you implicitly treat your models as *fragile*. Therefore, you should retain a small "Model Uncertainty" component in $\mathcal{M}$ that never fully updates away. Your interval should narrow significantly (e.g., to [0.85, 0.95]), but it should **not** collapse to a point. To collapse to a point is to claim you have ruled out all structural uncertainty about the assay's mechanism, which is epistemically dishonest for physical equipment.

  ### Summary of Application

  1.  **Prediction Market (Work):** You must post a number. Use **Minimax Regret** over your interval. If your interval is [0.3, 0.7], post 0.5, but widen your spread to protect against the uncertainty.
  2.  **Startup (Friend):** This is speculative. Use **E-Admissibility**. If the buy-in price is within your [0.05, 0.4] valuation gap, **decline**. Indecision is a valid output.
  3.  **Flood (House):** This is safety-critical. Use **Maximin**. Act as if the probability is 4%. Buy the insurance.
  4.  **Assay (Lab):** Update the weights of the models, but do not delete the "Uncertain Mechanism" model. Retain a non-zero width interval.

  This framework respects your "hard-edged" intervals, explains why you act differently on floods vs. startups, and validates your intuition that bad news can widen uncertainty (Dilation). The cost is that you must accept being "incoherent" by strict Bayesian standards and admit that sometimes, the rational thing to do is nothing.
