  *Note: Q6, Q7 refine internal distinctions but do not alter main branches in this simplified view.*

  5. The leaves
  **Global Reductionism.** Justification derives from induction over testimony as a class plus specific reasons. **Awkward:** Requires infants to possess complex empirical generalizations they cannot formulate or understand.

  **Local Reductionism.** The hearer needs reasons specific to this speaker and occasion for every instance. **Awkward:** Makes ordinary knowledge impossibly demanding, requiring constant investigation of sources.

  **Reliabilist Reductionism.** No reasons are needed in the hearer but justification is constituted by reliability alone. **Awkward:** Equates human testimony with thermometer readings, ignoring agency.

  **Default-and-Defeater.** The hearer is entitled to accept absent defeaters but testimony is not thereby a distinct source. **Awkward:** Struggles to explain why testimony feels different from memory or perception.

  **Anti-Reductionism (A Priori).** Resting on an a priori principle about acceptable assertion granting rights. **Awkward:** Commits to a mysterious normative principle independent of empirical reliability.

  **Anti-Reductionism (Assurance).** Resting on the nature of communication or assurance rather than on a principle. **Awkward:** Cannot easily account for overhearing conversations where no assurance is offered.

  **Transmission-Only.** Testimony can pass on knowledge but never generate more warrant than the speaker had. **Awkward:** Prevents knowledge expansion through chains of testimony where the original source is lost.

  **Sceptical Leaf.** Denies the starting commitment that we ever know via testimony alone. **Awkward:** Contradicts near-universal intuition and makes social learning impossible.

  6. Empty and crowded cells
  The combination affirming the LLM case but denying the Child case is empty; it is incoherent to require agency for machines but not infants. The Anti-Reductionism (Assurance) and (A Priori) leaves are crowded; your questions cannot separate them fully. The difference is verbal, showing up only in odd cases above, or is one you would need a further question to detect regarding the source of the norm.

  7. What would change my mind about this instrument
  I think the ordering of the questions is most likely to be wrong at the trunk. Splitting on the Stranger case first assumes reductionism is the default threat. I would drop the Dream question if I had to; it rarely divides major positions. Consideration convincing me the split is wrong would be finding a major theorist who affirms the Child case but denies the Stranger case, collapsing my Anti-Reductionist branch.
