answer: |-
  1. Using the instrument
  Start at the top. Read the scenario carefully. Choose the answer that matches your immediate intuition. Follow the arrow corresponding to your choice. Stop at a leaf. Record the label. Do not look ahead. Your path reveals your implicit commitments about where justification comes from. If you land on an empty leaf, your combination is theoretically possible but unoccupied. Compare your leaf with peers to find your philosophical allies.

  2. The questions
  1. **Stranger:** Imagine you are lost. A stranger at a railway station gives you a direction. You will never see them again. Must you have prior reason to trust strangers generally to be justified in believing them? Choose: Yes, I need general reasons. No, I do not.

  2. **Neighbor:** Your neighbor means well and is honest but whose reports have been wrong most of the time you have checked them. Can you believe them this time without new evidence? Choose: Yes, I can believe. No, I need new evidence.

  3. **Child:** A four-year-old told that the stove is hot, before she has any track record for reliability or any conception of deception. Does she know the stove is hot? Choose: Yes, she knows. No, she lacks capacity.

  4. **Expert:** An expert assertion in a field where you cannot evaluate the evidence even in principle. Can you know the claim is true? Choose: Yes, I can know. No, I cannot know.

  5. **Sincere/Wrong:** A speaker who is entirely sincere and confident but simply wrong. Does their sincerity give you justification? Choose: Yes, sincerity justifies. No, truth is required.

  6. **Anonymous/Many:** One anonymous report versus many independent reports of the same thing. Does having many reports change the *source* of justification compared to one? Choose: Yes, source changes. No, source stays same.

  7. **Dream:** Content nobody else could in principle check, such as what the speaker dreamed last night or what she had for breakfast. Can you know this via testimony? Choose: Yes, I can know. No, I cannot know.

  8. **LLM:** An assertion produced by a large language model, which is correct, but where there is no speaker with beliefs, intentions, or any stake in being believed. Are you justified? Choose: Yes, I am justified. No, I am not.

  3. The space they generate
  Eight binary questions yield 256 theoretical combinations. The literature occupies fewer than twenty. Many combos are unstable; for instance, denying the child knows while affirming the stranger case creates tension. Most positions cluster around specific nodes, leaving vast regions of the logical space empty. This instrument maps the dense clusters rather than the vacant fields.

  4. The tree
  ```text
                        [START: We sometimes know via testimony]
                                       |
                       Q1: Stranger (Need general reason?)
                      /               \
                    YES               NO
                   /                   \
          [Global Reductionism]         Q2: Neighbor (Believe w/o evidence?)
                                       /               \
                                     NO               YES
                                    /                   \
                           [Local Reductionism]          Q3: Child (Knows w/o concepts?)
                                                        /               \
