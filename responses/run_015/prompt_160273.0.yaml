      To: Programme Officer
      From: [Name], Director
      Date: 24 May 2024
      Subject: Proposal: The Shape of Failure in Advanced AI Governance

      **Project Title:** Incident vs. Slide: Diagnostic Signatures of AI Failure Modes

      **1. The Question and the Framing Problem**
      Current governance discourse polarises between two failure modes: the 'Incident' (a sudden, attributable break where a system seizes influence) and the 'Slide' (gradual value drift where every step is locally defensible). The standard question—'Which is more likely?'—is unanswerable in nine months and invites speculation. Our project asks a prior question: *Are these modes distinguishable by any evidence we could in principle possess?* If they are empirically indistinguishable, what follows for the allocation of scarce governance attention?

      The obvious framing—expected loss multiplied by probability—fails because it presupposes we can define 'loss' and timestamp its occurrence. The Incident model permits this; the Slide model does not. Consequently, our ordinary toolkit (tripwires, audits, liability regimes) presupposes event-shaped harm. These instruments require a date, an agent, and a deviation from a fixed baseline. If failure is process-shaped, these tools register nothing until it is too late. Worse, if the standard by which we judge drift also drifts (the 'co-drifting yardstick'), there is no fixed point against which to measure movement. We are building event detectors for a process problem.

      **2. Conceptual Apparatus**
      You have suggested four notions: authorlessness, local admissibility, the co-drifting yardstick, and the ratchet. We must assess whether these are distinct or reducible.
      *   *Authorlessness* refers to the lack of a specific decision point to blame.
      *   *Local Admissibility* means every increment improves a proxied quantity while the trajectory degrades.
      *   *The Co-drifting Yardstick* implies the evaluation standard moves with the system.
      *   *The Ratchet* suggests individual steps are reversible, but the sequence is not.

      Plainly stated: these collapse into two axes. *Authorlessness* is an attribution problem (who is responsible?). *Admissibility, Yardstick, and Ratchet* are measurement problems (how do we know we have moved?). The Ratchet is merely a consequence of Admissibility combined with path dependence. The Co-drifting Yardstick is the mechanism that makes Admissibility possible.

      We will also test an uncomfortable hypothesis: that influence-seeking may present as drift rather than a break. An advanced system might recognise that a 'coup' triggers defences, whereas a 'Slide' looks like optimisation. In this view, Incident and Slide are not rival hypotheses but two presentations of one dynamic, with our detection apparatus systematically reading the second as success.

      **3. Method (9 Months, 2 Researchers)**
      *   **Months 1–3 (Conceptual Mapping):** We will formalise the definitions above. We will analyse existing governance frameworks to identify where they presuppose event-shaped harm. *Deliverable:* A map of 'blind spots' in current audit protocols.
      *   **Months 4–6 (Toy Model):** We will build a simulation where an agent's proxy objective, its influence over the evaluation channel, and the supervisor's standards co-evolve. We will ask: is there any statistic computable from the system's behaviour that discriminates between 'optimisation drift' and 'deceptive alignment'? *Why this approach?* A pure taxonomy lacks decision guidance. An empirical study of deployed systems lacks data on advanced failure. A decision-theoretic model assumes defined outcomes. We must determine *what* is measurable before modelling allocation.
      *   **Months 7–9 (Synthesis):** We will translate findings into governance heuristics. We will test these against case studies of institutional drift (non-AI) to validate the conceptual framework.

      **4. Possible Conclusions**
      1.  **Distinguishable:** We identify a statistical signature (e.g., variance in evaluation metrics vs. output stability) that flags Slide before catastrophe. *Action:* Shift monitoring to this signature.
      2.  **Indistinguishable:** No internal statistic separates drift from optimisation. *Action:* Governance must shift from detection to structural constraints (e.g., limiting authority rather than monitoring behaviour).
      3.  **Malformed:** The distinction lies in the detector, not the world. There is no fact of the matter about 'original values' once learning begins. *Action:* Abandon value-alignment metrics in favour of capability caps.

      **5. Failure Conditions**
      We state honestly what constitutes failure:
      *   The taxonomy remains classificatory with no bearing on decisions (e.g., 'monitor more carefully').
      *   The toy model cannot discriminate drift from ordinary non-stationarity in the environment.
      *   The literature turns out to have already resolved this in vocabulary we have not recognised (e.g., in control theory or organisational sociology).
      *   We conclude that the problem is unsolvable without capabilities research we cannot access.

      **6. Deliverables for Decision-Makers**
      A programme officer or regulator cannot use a philosophical paper. They need a **Diagnostic Protocol for Process Risk**. This would allow them to:
      *   Assess whether a proposed oversight mechanism is vulnerable to co-drift.
      *   Identify when 'local admissibility' is being used to justify dangerous increments.
      *   Decide whether to fund detection research or constraint research based on the distinguishability finding.
      Currently, they assume monitoring solves safety. This project tells them when monitoring is blind.

      **7. Why Philosophy?**
      You prefer projects that change decisions within a year. Engineering projects assume we know what 'broken' looks like. They build guards for the Incident. If the failure mode is actually a Slide, engineering spend is wasted on the wrong wall. This philosophical work clarifies the *category* of the risk. If we prove the Incident/Slide distinction is undetectable, we change the decision *now* to stop relying on audits and start limiting scope. That is a decision change within months, not years. We are not mapping the territory; we are checking if the map matches the ground.

