      *   **Case Study:** An 1880s trading port collapsing due to three factors: (1) inland railway diverts freight, (2) harbour silts badly, (3) foreign tariff imposed. Contemporaries claim any one would have been enough.
      *   **Task 2:** Provide a "residue report" identifying what translates cleanly, what translates with distortion, and what has no counterpart.
      *   **Task 3:** Assess whether the residue indicates a limitation in epidemiological vocabulary or unclarity in the historical notion of cause.

  2.  **Deconstruct the Case Study (The "Port Collapse"):**
      *   *Outcome:* Commerce collapse in a single season.
      *   *Exposures:* Railway ($E_1$), Silt ($E_2$), Tariff ($E_3$).
      *   *Claim:* Each is individually sufficient (Overdetermination).
      *   *Context:* 1880s history (singular event, complex social system).

  3.  **Task 1: Restating the Debate in Epidemiological Terms:**
      *   *Concept:* Overdetermination. In philosophy/history, this means multiple causes, each sufficient on its own.
      *   *Epi Equivalent:* Sufficient-Component Cause Model (Rothman's Pies).
      *   *Application:* The "Collapse" is the disease. There are three distinct "sufficient causes" (Pies).
          *   Pie A: Railway + Background Conditions.
          *   Pie B: Silt + Background Conditions.
          *   Pie C: Tariff + Background Conditions.
      *   *Problem:* In standard epi, if Pie A is complete, the outcome occurs. If Pie B is also complete simultaneously, we have concurrent sufficient causes.
      *   *Counterfactuals:* If we remove Railway ($E_1$), does Collapse still happen? Yes, because of Silt ($E_2$). This breaks simple counterfactual dependence (necessity).
      *   *Attributable Fraction:* How much of the collapse is due to the railway? If all three are present and sufficient, the sum of attributable fractions exceeds 100%. This is the "interaction" or "redundancy" problem.
      *   *Confounding:* Are the causes independent? Did the tariff cause the railway investment? (Less relevant to the core overdetermination issue, but worth noting as a control issue).
      *   *Narrative:* Historians argue about *the* cause. Epidemiologists measure *risk*. How to reconcile?

  4.  **Task 2: The Residue Report (Translation Assessment):**
      *   *Clean Translations:*
          *   "Cause" $\rightarrow$ "Risk Factor/Component Cause".
          *   "Would have happened anyway" $\rightarrow$ "Counterfactual Outcome under Exposure Removal".
          *   "Multiple factors" $\rightarrow$ "Sufficient-Component Cause Model".
      *   *Distorted Translations:*
          *   "Sufficiency": In epi, sufficiency is often theoretical (completed pie). In history, "enough" implies economic viability thresholds which are fuzzy.
          *   "Attributable Fraction": In epi, this is population-level. In history, it's a singular event (N=1). You can't calculate a risk ratio for a single port collapse in the same way.
      *   *No Counterpart:*
          *   *Agency/Intent:* The tariff was a political decision; the silt was natural. Epi treats exposures largely as events, but historical causation often weighs *intent* or *meaning*.
          *   *Narrative Coherence:* Historians want a story (A led to B). Epi wants a mechanism (X increases probability of Y).
          *   *Singular vs. Population:* Epi is inherently probabilistic and population-based. History is often deterministic and singular.

  5.  **Task 3: Assessment of the Residue:**
      *   Is it Epi's limitation? Epi is designed for populations and probabilities. It struggles with singular, deterministic events (N=1).
      *   Is it History's unclarity? Historians often conflate "explanatory salience" (what matters to the story) with "ontological cause" (what made it happen).
      *   *Verdict:* Likely a category error. Epi handles *probabilistic causation in populations*. History handles *singular explanation*. The friction arises from applying a population tool to a singular event.

  6.  **Drafting the Content (incorporating British English and specific vocabulary):**
