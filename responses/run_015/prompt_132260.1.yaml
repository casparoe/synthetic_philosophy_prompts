answer: |-
  On an isolated coast, traders exchange fish for carved driftwood tickets, but ultimate accounting lives in a communal song memorized by elders, detailing who owes whom what labor. When a storm rots the wood tickets, trade continues seamlessly because the song preserves the credit relationships; everyone knows their standing. Conversely, when a plague kills the singers, the wood tickets remain piled in a warehouse, yet trade halts. No one accepts the wood because without the song, the carvings signify nothing but shaped driftwood. The community starves despite the warehouse full of "money," until a new ledger system is invented.

  Berkeley's verdict is correct: wealth is relational, residing in the acknowledged debt (the song), not the counter. The commodity verdict is false: it claims value inheres in the material, yet the wood piles fail to function as money when the song is lost. The isolating feature is the decoupling of the physical token from the social record of obligation; the wood is expendable, the memory essential. A commodity defender would try to break the case by arguing the driftwood was never "real" money, but merely a receipt for intrinsic value like fish stores. They would claim the song was just auxiliary bookkeeping. However, this admission proves the economic power lay in the accounting convention, not the material token, validating Berkeley's claim that money is a ticket for labor rather than a substance.
