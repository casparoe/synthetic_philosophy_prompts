answer: |-
  There is no single established term in security studies or game theory that captures this specific configuration: a hypothesis that is unfalsifiable not because it is vague, but because the *cost of the test* is contingent on the *truth of the hypothesis* in a way that makes testing irrational for the agent.

  The formal machinery for this exists (it is a **Pooling Equilibrium** sustained by **Catastrophic Off-Path Costs**), but that is a description of the *math*, not the *phenomenon*. The sociological concept of a **Self-Sealing Belief** captures the epistemic closure but usually implies irrationality or conspiracy, missing the *rational strategic restraint* central to your example.

  Since you need a carving for a chapter, I recommend coining the term **Strategic Unfalsifiability**.

  Below is the differentiation from nearest neighbors, followed by the formal definition and operationalization of the term.

  ### 1. Nearest Neighbors and Distinctions

  You correctly identified the candidates that feel similar but miss the mark. Here is exactly where they diverge from your configuration:

  *   **Self-Fulfilling Prophecy:** In a self-fulfilling prophecy, the belief *creates* the truth (e.g., believing a bank is insolvent causes a run that makes it insolvent). In your configuration, the belief does not necessarily create the danger; it merely prevents *knowing* if the danger exists. The Dark Forest may be dangerous regardless of whether civilizations believe it is. The belief preserves the *ignorance*, not necessarily the *reality*.
  *   **Off-Path Beliefs (Game Theory):** This is the formal container for your phenomenon. In a sequential equilibrium, players hold beliefs about nodes they never reach. However, "off-path belief" is a technical variable, not a strategic condition. It describes *that* the belief is untested, not *why* the test is structurally forbidden by the payoff matrix. **Strategic Unfalsifiability** is the substantive label for the specific *type* of off-path belief where the deviation cost is existential.
  *   **Selection Effects (Observer Bias):** This is passive. We don't see dead civilizations because they are dead. In your configuration, civilizations are *alive* but *silent*. They are actively choosing not to generate the data point. The missing data is the result of a strategic choice, not just a survivorship filter.
  *   **The Security Dilemma:** This explains why states arm themselves (defense looks like offense). It explains conflict escalation. It does not explain *epistemic closure*. A security dilemma can exist where both sides know exactly what the other has. Your phenomenon is about the impossibility of knowing what the other *is* (predator or benign).
  *   **Precautionary Success:** "We built a wall, no invaders came, so the wall worked." This assumes the threat was real. Your configuration allows for the threat to be *false* (the "Planted Forest" variant) while the precaution remains rational. The unfalsifiability protects the *falsehood* as effectively as the truth.

  ### 2. The Concept: Strategic Unfalsifiability

  **Definition:**
  **Strategic Unfalsifiability** is a condition in which a hypothesis regarding a threat cannot be empirically tested because the act of testing constitutes a deviation from the optimal survival strategy, and the cost of that deviation is contingent on the truth of the hypothesis itself.

  **The Minimal Conditions:**
  1.  **Binary Hypothesis ($H$):** The environment is either Hostile ($H$) or Benign ($\neg H$).
  2.  **Costly Verification ($T$):** There exists a test action $T$ (e.g., broadcasting, standing down) that would reveal the state of $H$.
  3.  **Asymmetric Payoff:**
      *   If $H$ is true, performing $T$ results in Catastrophic Loss ($L_{cat}$).
      *   If $H$ is false, performing $T$ results in Gain or Low Cost ($G$).
  4.  **Rational Restraint:** The Expected Value of $T$ is negative because the probability assigned to $H$ ($P(H)$) is high enough that $P(H) \times L_{cat} > P(\neg H) \times G$.
  5.  **Equilibrium Stability:** The collective choice to avoid $T$ prevents the updating of $P(H)$, keeping the system in a stable state of ignorance.

  **The "Planted Forest" Variant (Manipulated Strategic Unfalsifiability):**
  This occurs when a third party or subset of actors actively incurs costs to simulate the signs of $H$, thereby artificially inflating $P(H)$ in other agents to maintain the Restraint condition. This turns the epistemic trap into a weapon.

  ### 3. Non-Examples (Boundary Cases)

  To ensure you are using the term precisely, here are two cases that look like Strategic Unfalsifiability but are not:

  *   **The Nuclear Standoff (Classic Deterrence):** Two states hold nuclear weapons. Peace prevails. Is this Strategic Unfalsifiability? **No.** We know the weapons exist. We know the capability is real. The uncertainty is about *intent*, but the *capability* to destroy is verified. The test (using the weapon) is costly, but the hypothesis ("They can destroy us") is already falsified/verified. Strategic Unfalsifiability requires uncertainty about the *nature of the environment*, not just the intent of a known actor.
  *   **Classified Research:** A government keeps a technology secret because revealing it would allow adversaries to copy it. **No.** This is simple secrecy. The test (revealing the tech) is costly, but it doesn't test a hypothesis about the *adversary's nature*. It tests a hypothesis about *diffusion*. The cost is competitive, not existential/lethal in the immediate sense.

  ### 4. How to Test for Strategic Unfalsifiability (Non-Question-Begging)

  Since the phenomenon is defined by the impossibility of the direct test, you cannot test for it by looking for the truth of the hypothesis (e.g., "Is the forest actually dangerous?"). You must test for the *structure of the constraint*.

  **The Incentive Audit:**
  Do not ask "Is the threat real?" Ask "Who benefits from the belief that the threat is real?"
  *   **Step 1:** Map the actors who gain resources, cohesion, or power from the maintenance of the high-$P(H)$ belief.
  *   **Step 2:** Look for **Exogenous Shocks**. Has there ever been a case where an actor was *forced* to perform $T$ (e.g., accidental transmission, forced stand-down due to economic collapse)?
      *   If an accidental transmission occurred and no destruction followed, the hypothesis is weakened.
      *   If no accidental transmissions have ever occurred in a large sample size, the Restraint condition is robust.
  *   **Step 3:** Analyze the **Cost Correlation**. Is the cost of testing *actually* linked to the truth, or is it linked to the *belief*?
      *   In the Dark Forest, the cost is linked to the truth (predators shoot).
      *   In the Planted Forest, the cost is linked to the belief (predators shoot *because* they want you to think they shoot).
      *   If you can identify actors manufacturing the cost (decoys, false flags), you have identified Manipulated Strategic Unfalsifiability.

  ### Summary for your Chapter

  If you use **Strategic Unfalsifiability**, you are carving out a space between *irrational paranoia* and *rational deterrence*.

  *   **Paranoia** implies the belief is false and held irrationally.
  *   **Deterrence** implies the threat is known and managed.
  *   **Strategic Unfalsifiability** implies the threat is unknown, the belief is rational, and the ignorance is structurally enforced by the survival imperative.

  This allows you to discuss the "Planted Forest" variant not as a conspiracy theory, but as a stable exploitation of a rational epistemic trap. It gives you a vocabulary to discuss why security communities might rationally agree on a threat assessment that is potentially false, without accusing them of incompetence or madness.
