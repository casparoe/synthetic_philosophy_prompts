answer: |-
  **Joint Statement of Adversarial Collaboration: The Special Composition Question**

  **I. Agreed Claims**

  1.  **Mereological Neutrality:** Standard mereological formalisms (transitivity, uniqueness) are logically coherent but do not settle the Special Composition Question (SCQ). Logic alone cannot dictate when composition occurs.
  2.  **Particle Realism:** Both parties agree that the fundamental particles arranged tablewise exist. The dispute concerns whether a further entity, the *table*, exists over and above these particles.
  3.  **The Problem of the Many:** Both views face boundary vagueness. Universalists face it regarding which fusion is salient; Restrictivists face it regarding when a homeostatic process begins or ends. Neither can appeal to sharp boundaries as a decisive knock-down argument.
  4.  **Quantification and Commitment:** Quantification carries ontological commitment. The disagreement lies in whether ordinary language quantifiers ("there is a chair") track fundamental ontology or merely pragmatic salience.
  5.  **Salience vs. Existence:** Both agree that salience (joint-carving) and existence are distinct concepts. The Universalist argues existence is cheap and salience does the work; the Restrictivist argues existence should track salience to be metaphysically serious.

  **II. Disagreements and Adjudication**

  | Crux | Universalist (A) | Homeostatic Restrictivist (B) | Adjudicating Evidence (Hypothetical) | Predictions & Concessions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Nature of Composition** | Composition is a logical relation unrestricted by nature. Any plurality has a fusion. | Composition is a natural relation requiring causal unity via self-maintenance against perturbation. | **CogSci:** Object-tracking is thoroughly task-relative; no visual level is privileged. | **A:** Predicts this. Existence is unrestricted; tracking is pragmatic.<br>**B:** Predicts this. Tracking is not metaphysics; homeostasis is.<br>**Concede:** A concedes if tracking privileged homeostasis. B concedes if tracking privileged arbitrary fusions. |
  | **2. Circularity Worry** | Self-maintenance presupposes the entity being maintained. The condition is circular. | Self-maintenance is an observable process flow, not teleological. No prior unity needed. | **Physics/Bio Split:** Physics quantifies only over fields; Biology irreducibly over organisms. | **A:** Physics is fundamental; biology is derivative shorthand.<br>**B:** Biology reveals emergent unities physics abstracts away from.<br>**Concede:** A concedes if physics *required* composites. B concedes if biology reduced fully to fields. |
  | **3. Ontological Cost** | Unrestricted composition is ontologically innocent. We pay no cost for fusions. | Unrestricted composition is ontological cheapness. It inflates reality without unity. | **Vagueness/Counting:** Is there a determinate number of objects in this room? | **A:** Count is indeterminate/semantic. Existence is sharp, salience is vague.<br>**B:** Count is indeterminate because most "objects" don't exist.<br>**Concede:** A concedes if count is sharp. B concedes if count is sharp but arbitrary. |
  | **4. Joint-Carving** | Joint-carving is downstream of existence. It is about interest, not being. | Joint-carving is constitutive of existence. If it doesn't carve, it isn't an object. | **N/A (Conceptual)** | **A:** Reality is flat; carving is us.<br>**B:** Reality is structured; carving is nature.<br>**Concede:** A concedes if structure is mind-independent. B concedes if structure is mind-dependent. |

  **III. Analysis: Verbal vs. Substantive Dispute**

  This collaboration identifies where the dispute is merely verbal and where it cuts into the structure of reality. We reject the dissolutionist claim that the debate is *entirely* verbal, though linguistic confusion exacerbates the stalemate.

  **The Verbal Component:**
  A significant portion of the disagreement stems from the predicate "exists." The Universalist employs a permissive quantifier equivalent to "there is some stuff arranged thusly." The Restrictivist employs a restrictive quantifier equivalent to "there is a unified substance." When A says "There is a nose-Eiffel fusion," she means the particles exist arranged fusion-wise. When B says "There is no nose-Eiffel fusion," he means there is no causal unity holding those particles together. Once this semantic divergence is indexed, the claim "X exists" loses its bite as a standalone truth condition. Much of the heat regarding "ontological cost" dissolves here: if existence is logical, it is free; if existence implies unity, it is costly. They are arguing over which quantifier deserves the label "ontological commitment."

  **The Substantive Component:**
  However, the dispute does not collapse entirely into language. There is a substantive disagreement about the **structure of reality** (joint-carving).
  1.  **Causal Powers:** The Restrictivist claims that homeostatic unities have causal powers that arbitrary fusions lack (e.g., an organism acts as a unit of selection). The Universalist denies this, arguing causal work is done by the particles regardless of fusion status. This is empirically testable (see Physics/Bio Split). If biological models fail without irreducible organism variables, the Restrictivist gains ground on substantive causal structure.
  2.  **Circularity and Process:** The Universalist's circularity worry is substantive. If self-maintenance requires a beneficiary, the Restrictivist's condition is metaphysically empty. If self-maintenance is merely a pattern of energy flow, the Universalist must explain why *this* pattern grants objecthood while others do not. This is not verbal; it is a dispute about whether processes can constitute entities without prior substrates.
  3.  **Salience and Mind-Independence:** The Universalist claims salience is mind-dependent; the Restrictivist claims homeostasis is mind-independent. The CogSci hypothetical targets this. If object-tracking is purely task-relative, it supports the Universalist's view that *salience* is pragmatic. However, it does not refute the Restrictivist's claim that *unity* is objective. The substantive core remains: Is there a fact of the matter about unity independent of our tracking mechanisms?

  **Conclusion:**
  The parties agree that mereology is formal and particles are real. They disagree on whether composition adds to reality or merely describes it. The verbal dispute concerns the definition of "exists." The substantive dispute concerns whether nature privileges certain arrangements with genuine unity and causal efficacy. Future work should bypass the SCQ phrasing and focus directly on the metaphysics of unity and the fundamentality of special science quantifiers.
