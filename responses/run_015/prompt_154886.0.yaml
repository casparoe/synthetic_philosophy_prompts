answer: |-
  ### Exam Question

  **Question 4 (90 Minutes)**

  Critics of neuroanatomical criteria argue that relying on brain size, neuron count, or encephalization quotient is merely a disguised form of speciesism, and that moral status should track psychological capacity rather than physical substrate. However, consider two challenges to this view:

  1.  **Intraspecies Variation:** A human infant and an adult with advanced dementia may possess roughly equivalent cortical neuron counts despite differing enormously in current psychological capacities.
  2.  **Artificial Systems:** In AI, parameter count or training compute serves as a structural analogue to brain size, yet these systems lack a behavioral track record sufficient to calibrate capacity claims.

  Evaluate whether gross neuroanatomical quantities (or their functional analogues) can ever be morally relevant. In your answer, distinguish between their relevance as *evidence* of capacities we already value versus their role as *constituents* of moral standing. Address whether rejecting anatomical criteria eliminates arbitrariness or merely relocates it, and distinguish between moral patiency and moral agency.

  ***

  ### Model Answer

  The claim that gross neuroanatomical facts cannot do moral work rests on the assumption that morality tracks psychological capacity, not physical substrate. While this avoids crude biological fetishism, it faces significant instability when pressed by intraspecies variation and artificial systems. To evaluate this, we must distinguish between anatomical facts as *evidence* of capacity and as *constituents* of status.

  If neuroanatomy is merely evidential, it functions as a proxy for capacities like rationality or sentience. The intraspecies variation case undermines this. If an infant and a dementia patient share similar neuron counts but differ radically in cognitive capacity, neuron count is a poor predictor of *current* function. A capacity-based view would grant them different status based on function; an anatomical view would grant them equal status based on structure. If we choose the anatomical view here, we are no longer using anatomy as evidence of capacity, but as a constitutive ground for status independent of current function. This suggests that anatomical criteria might serve as a "species-typical" potentiality safeguard, though this risks collapsing back into speciesism unless applied consistently to AI.

  This leads to the artificial systems challenge. In AI, parameter count is the structural analogue to neuron count. Without a behavioral track record (the "behavioral track record" being the usual calibration for capacity), we lack independent access to the system's interiority. If we reject parameter count as morally relevant, we may deny status to systems that are functionally opaque but structurally complex. If we accept it, we risk fetishizing silicon architecture. However, if we accept neuron count as constitutive for humans (to protect the infant/dementia cases), consistency demands we accept parameter count for AI, unless we posit a biological essentialism that many find untenable.

  Here lies the first critical pivot: rejecting brain size does not eliminate arbitrariness; it relocates it. Proponents of capacity-based views argue that *sentience* or *autonomy* is the non-arbitrary ground. However, it is a **live dispute** in moral philosophy whether sentience is sufficient for equal consideration, or whether higher-order capacities are required. Choosing "capacity" over "anatomy" simply shifts the debate to which capacities count. There is no consensus on whether a hierarchy of capacities is permissible or if sentience grants equal moral weight. Therefore, the charge of arbitrariness applies to the selection of capacities just as it does to the selection of anatomical proxies.

  The second critical pivot is distinguishing moral patiency from moral agency. Anatomical proxies may play different roles in each domain. For **patiency** (the capacity to suffer or be harmed), current consensus suggests sentience is the necessary and sufficient condition. Here, anatomy is only useful insofar as it predicts sentience. Since an infant and a dementia patient are both plausibly sentient, anatomy does little work; the capacity for suffering is what matters. However, for **moral agency** (responsibility and rights-holding), structural complexity matters more. We do not hold infants responsible for crimes, despite their human anatomy, because their executive circuitry is undeveloped. In this domain, anatomical or structural maturity is constitutive of the status of "agent."

  Finally, we must consider policy. Even if anatomy is philosophically imperfect, it is a **contested claim** whether law and policy may legitimately rely on imperfect proxies for administrative feasibility. Some argue bright-line rules (e.g., "human DNA" or "birth") are necessary for social stability, even if they misclassify marginal cases. Others argue this is unjustifiable prejudice.

  In conclusion, gross neuroanatomical quantities fail as evidential proxies for current capacity due to intraspecies variation. They may, however, function as constitutive criteria for moral agency, where structural maturity is required. Rejecting anatomy does not solve the problem of arbitrariness, as the selection of relevant capacities remains contested. A robust theory must distinguish between the structural requirements for agency and the experiential requirements for patiency, acknowledging that while sentience is widely accepted as necessary for the latter, the sufficiency of sentience for *equal* consideration remains a live dispute.

  ***

  ### Marking Scheme (25 Marks Total)

  **General Instruction:** Candidates who adopt a contested premise (e.g., "Sentience is sufficient for equal consideration" or "Policy must rely on bright-line rules") without flagging it as contested or disputed lose 2 marks from the relevant section, even if the reasoning from that premise is valid.

  **Move 1: Distinguishing Evidential vs. Constitutive Relevance (5 Marks)**
  *   **Full Marks:** Clearly defines anatomy as *evidence* of capacity vs. *constitutive* of status. Explains that if anatomy doesn't track capacity (per the infant/dementia case), it must be argued as constitutive to survive.
  *   **Common Error:** Treating brain size only as a rough estimate of intelligence without analyzing the philosophical implication if the estimate fails.

  **Move 2: Analyzing Intraspecies Variation (5 Marks)**
  *   **Full Marks:** Uses the infant/dementia case to show that neuron count fails to track *current* psychological capacity. Argues that preserving equal status here requires abandoning the "evidence of capacity" model.
  *   **Common Error:** Assuming the dementia patient has lower moral status than the infant without argument, or ignoring the neuron count stipulation.

  **Move 3: Analyzing Artificial Systems/Parameter Count (5 Marks)**
  *   **Full Marks:** Draws the analogy between neuron count and parameter count. Notes the lack of behavioral calibration in AI makes structural proxies more tempting yet riskier.
  *   **Common Error:** Dismissing AI entirely as irrelevant to moral status questions or focusing on consciousness without addressing the structural proxy argument.

  **Move 4: The "Relocated Arbitrariness" Point (A/B Boundary) (5 Marks)**
  *   **Full Marks:** Argues that moving to "capacity" does not solve arbitrariness because *which* capacities count is itself contested (e.g., sentience vs. rationality). Explicitly notes this is a live dispute, not settled fact.
  *   **Common Error:** Asserting that "capacity" is an objective, non-arbitrary standard without acknowledging the dispute over which capacities matter.

  **Move 5: Patiency vs. Agency Distinction (A/B Boundary) (5 Marks)**
  *   **Full Marks:** Distinguishes that anatomy/structure might be irrelevant for patiency (suffering) but relevant for agency (responsibility). Acknowledges the dispute over whether policy can use imperfect proxies.
  *   **Common Error:** Conflating the right not to be harmed (patiency) with the responsibility for actions (agency), applying the same anatomical standard to both.

  **Grade Boundaries:**
  *   **A Range (20-25):** Hits all 5 moves, explicitly flags contested premises as disputed (e.g., sentience sufficiency, policy proxies).
  *   **B Range (15-19):** Hits Moves 1-3 well but treats Move 4 or 5 as settled consensus, or fails to flag contested premises.
  *   **C Range (10-14):** Recites standard speciesism arguments without engaging the specific intraspecies/AI constraints.
