prompt: |-
  Please argue that the all-affected principle — according to which anyone whose interests are affected by a political decision ought to have a say in making it — is untenable as a criterion for constituting the demos, and that the all-subjected principle (which restricts the demos to those subject to the coercive enforcement of a polity's laws) offers a more defensible alternative. Your argument should address the familiar regress objection: determining who is affected by a decision about who gets to decide seems to presuppose an answer to the very boundary question we are trying to resolve. Consider, however, whether the all-subjected principle faces a structurally analogous difficulty, and if so, whether it handles that difficulty any better than the all-affected principle does.
reasoning: |-
  Here's a thinking process that leads to the argument above:

  1.  **Deconstruct the Prompt:**
      *   **Task:** Argue that the All-Affected Principle (AAP) is untenable as a criterion for constituting the *demos* (the people) and that the All-Subjected Principle (ASP) is a more defensible alternative.
      *   **Key Requirement:** Address the "Boundary Problem" (or regress objection): Deciding who is affected by a decision about who decides seems to presuppose the answer.
      *   **Critical Nuance:** Consider whether ASP faces a *structurally analogous* difficulty and evaluate if it handles it better than AAP.
      *   **Tone:** Philosophical, argumentative, rigorous.

  2.  **Initial Brainstorming & Definitions:**
      *   *All-Affected Principle (AAP):* Everyone whose interests are impacted by a decision should have a vote. (Intuitively appealing, democratic ideal).
      *   *All-Subjected Principle (ASP):* Everyone subject to the coercive power/laws of a polity should have a vote. (Focuses on coercion, jurisdiction, legal obligation).
      *   *The Boundary Problem (Regress):* To apply AAP, we need to know the scope of the decision. But the scope of the decision depends on who is in the *demos*. Who decides who is in the *demos*? If we use AAP to decide the *demos*, we need a prior *demos* to decide that. Infinite regress.
      *   *Comparison:* Does ASP solve this? ASP relies on "subjection to law." Is "subjection" easier to define than "affected interests"?

  3.  **Structuring the Argument:**
      *   **Introduction:** Define AAP and ASP. State the thesis (AAP is untenable due to indeterminacy and regress; ASP is superior despite facing a similar structural challenge).
      *   **Section 1: The Indeterminacy of "Affected Interests" (AAP's Fatal Flaw).**
          *   Causality is infinite (butterfly effect).
          *   Interests are subjective and conflicting.
          *   Practical impossibility of drawing boundaries.
      *   **Section 2: The Regress Objection (The Boundary Problem).**
          *   Explain the logical circularity. To decide the *demos*, you need a *demos*.
          *   Show why AAP exacerbates this (every decision changes who is affected).
      *   **Section 3: The Case for the All-Subjected Principle (ASP).**
          *   Focus on coercion and legal obligation.
          *   Provides a clearer, binary status (subject vs. non-subject).
          *   Aligns with the purpose of democracy (controlling power).
      *   **Section 4: Does ASP Face the Same Regress?**
          *   Yes, technically. Who decides who is subject?
          *   *Crucial Distinction:* ASP relies on *factual* legal relations, not *counterfactual* causal impacts.
          *   The "pre-political" fact of coercion vs. the "political" determination of impact.
      *   **Section 5: Why ASP Handles the Difficulty Better.**
          *   Stability vs. Fluidity.
          *   Institutionalizability.
          *   Avoids the "everything is political" trap.
      *   **Conclusion:** Summarize. AAP is a moral ideal but an institutional failure. ASP is a workable political criterion.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start strong. Democracy requires a "people." How do we define them? AAP sounds nice but fails. ASP is the pragmatic solution.
      *   *Critique of AAP:* Use the "butterfly effect" argument. If Canada raises taxes, does it affect a farmer in Vietnam via global markets? Technically yes. Practically impossible to track. Also, *interests* are vague.
      *   *The Regress:* This is the core philosophical hurdle. Whiting (2014) or Goodin (2007) are good mental references here. The decision "Who votes?" is itself a political decision. If AAP applies to *that* decision, we need a prior *demos*. AAP leads to a fluid *demos* that changes every vote, making governance impossible.
      *   *The ASP Alternative:* Shift focus from *consequences* to *coercion*. Democracy is about legitimating force. If the law binds you, you should have a say. This creates a stable boundary (citizenship/residency).
      *   *The Analogous Difficulty:* I must be honest. ASP isn't magic. Who defines the jurisdiction? If the state expands its laws, the *demos* expands. There is still a meta-decision about the scope of law.
      *   *The Defense:* Why is ASP's version of the problem better? Because legal subjection is *institutional fact*, whereas affectedness is *causal speculation*. We can look at a legal code and see who is bound. We cannot look at a policy and see exactly who is affected until after the fact. ASP allows for a *fixed* demos for the duration of a political cycle, whereas AAP demands a *fluid* demos for every issue.
      *   *Refining the Regress Point:* The regress for AAP is vicious because it prevents *any* decision from being made (infinite deferral). The regress for ASP is manageable because the "subject" status exists prior to the specific vote (you are already a resident/citizen).

  5.  **Polishing and Refining:**
      *   *Check Tone:* Ensure it sounds like a philosophical argument, not just an opinion piece. Use terms like "ontological," "normative," "circularity," "coercive apparatus."
      *   *Check Constraints:* Did I address the regress objection specifically? Yes. Did I compare the structural difficulty? Yes.
      *   *Self-Correction during drafting:* I initially thought about saying ASP solves the regress completely. But the prompt asks me to consider if it faces an *analogous* difficulty. I need to concede that ASP doesn't fully escape the boundary problem but argue it *mitigates* it significantly. The distinction is between a *vicious* regress (AAP) and a *manageable* circularity (ASP).
      *   *Key Insight:* AAP makes the *demos* contingent on the *agenda*. ASP makes the *demos* contingent on the *jurisdiction*. Jurisdictions are stable; agendas are not.

  6.  **Final Review against Prompt:**
      *   Argue AAP untenable? Yes.
      *   Argue ASP defensible? Yes.
      *   Address regress objection? Yes.
      *   Consider analogous difficulty for ASP? Yes.
      *   Evaluate if ASP handles it better? Yes.

  7.  **Final Polish:** (Produces the final output provided previously.)
answer: |-
  The question of how to constitute the *demos*—the body of people entitled to participate in collective self-government—is the foundational problem of democratic theory. Without a defined boundary, "rule by the people" is an empty phrase. Two competing principles dominate this debate: the **All-Affected Principle (AAP)**, which grants participation rights to anyone whose interests are impacted by a decision, and the **All-Subjected Principle (ASP)**, which grants those rights to anyone subject to the polity's coercive laws.

  While the AAP possesses an intuitive moral appeal, it is untenable as an institutional criterion for constituting the *demos*. It suffers from radical indeterminacy and generates a vicious regress that makes democratic decision-making impossible. The ASP, by contrast, offers a more defensible alternative by anchoring the *demos* in the factual reality of legal coercion. Although the ASP faces a structurally analogous boundary difficulty, it handles this difficulty significantly better than the AAP by transforming a vicious logical regress into a manageable institutional circularity.

  ### The Indeterminacy and Regress of the All-Affected Principle

  The primary failure of the AAP is ontological and epistemic. To apply the principle, one must be able to identify "affected interests" prior to the decision being made. However, in a globally interconnected world, causal chains are infinite. A decision by a municipal council in Ohio to subsidize corn farming affects global commodity prices, which affects farmers in Kenya, which affects local food security, which affects geopolitical stability. If "affectedness" is the criterion for inclusion, the *demos* for almost any decision becomes potentially global.

  This indeterminacy leads directly to the **regress objection** (often called the Boundary Problem). To decide *who* gets to vote on a policy, we must first decide *who is affected* by that policy. But the decision to define the scope of "affectedness" is itself a political decision. According to the AAP, everyone affected by *that* boundary decision ought to have a say in making it. This creates a vicious circle: we need a *demos* to decide the *demos*, but we cannot constitute the *demos* without first deciding the boundary.

  Proponents of AAP often attempt to halt this regress by assuming a pre-existing *demos* to decide the boundaries. However, this contradicts the principle itself. If the AAP is the sole legitimate criterion for democratic inclusion, no pre-existing group has the normative authority to set the boundaries. Furthermore, because the AAP implies that the *demos* should shift depending on the issue at hand (since different issues affect different people), it renders stable governance impossible. A polity cannot function if the voting body dissolves and reconstitutes itself before every single ballot measure. The AAP thus collapses under the weight of its own scope, rendering democratic agency unintelligible.

  ### The All-Subjected Principle as a Defensible Alternative

  The All-Subjected Principle avoids these pitfalls by shifting the criterion from *causal impact* to *legal obligation*. The ASP argues that the *demos* should include all and only those who are subject to the coercive enforcement of the polity's laws. The normative core of this argument is that democracy is primarily a mechanism for legitimating coercion. If the state claims the right to force you to comply with its rules under threat of sanction, you must have a voice in the authorship of those rules to remain free.

  The ASP provides a binary, institutional test for membership: Are you legally bound by this jurisdiction? This is a matter of legal fact (residency, citizenship, territorial presence) rather than causal speculation. It creates a stable *demos* that persists across different policy issues. Whether the vote is on tax rates, zoning laws, or foreign policy, the *demos* remains the body of legal subjects. This stability allows for the continuity of institutions, accountability of representatives, and the formation of a collective political will over time.

  ### The Analogous Difficulty and Why ASP Handles It Better

  However, we must concede that the ASP is not immune to the boundary problem. A structurally analogous difficulty arises: **Who decides who is subject to the law?**

  The determination of jurisdiction is itself a legal and political act. If a state expands its territorial claims or extends its legal reach to extraterritorial actors, it changes the scope of the *demos*. To decide the scope of the law (and thus the scope of the *demos*), one presumably needs a *demos* to make that decision. Thus, the ASP also faces a circularity: the *demos* is defined by the law, but the law is defined by the *demos*.

  Despite this structural similarity, the ASP handles this difficulty far better than the AAP for three critical reasons.

  **1. Factual vs. Counterfactual Grounding**
  The regress in the AAP is vicious because it relies on counterfactual predictions about future interests. We cannot know who is affected until the decision is made, yet we need to know who is affected to make the decision. The ASP, conversely, relies on *antecedent factual status*. Legal subjection is usually a pre-existing condition. Before a vote takes place, it is an objective fact whether a person resides within the territory and is liable to arrest by the state's police power. The boundary of the *demos* under ASP is not determined by the specific outcome of the vote, but by the standing legal framework. This breaks the immediate logical loop that paralyzes the AAP.

  **2. Stability vs. Fluidity**
  The AAP demands a fluid *demos* that changes with every agenda item, making the regress practically unmanageable. The ASP allows for a fixed *demos* for the duration of a political cycle. While the question of "who is subject?" can be raised (e.g., in constitutional amendments regarding borders or citizenship), these are rare, higher-order decisions. For the vast majority of ordinary legislation, the boundary is settled. This allows the ASP to contain the regress to the constitutional level, whereas the AAP injects the regress into everyday legislation.

  **3. The Presumption of Coercion**
  Finally, the ASP aligns with the practical reality of state power. The state *already* coerces people. The boundary of subjection is not a theoretical abstraction; it is enforced by borders, police, and courts. The political question is not "Who *might* be affected?" (which is infinite), but "Who *is* currently being bound?" (which is finite and observable). While the decision to expand that coercion is subject to the boundary problem, the default position is clear: if the state claims authority over you, you are in the *demos*. This places the burden of proof on exclusion rather than inclusion, avoiding the paralysis of trying to calculate infinite causal ripples.

  ### Conclusion

  The All-Affected Principle fails as a criterion for constituting the *demos* because it conflates moral concern with political agency. While we may have moral obligations to those affected by our actions globally, granting them political rights in our specific polities renders the concept of a self-governing community incoherent. The regress objection demonstrates that the AAP cannot define its own scope without presupposing the very authority it seeks to justify.

  The All-Subjected Principle, while not magically escaping the philosophical puzzle of boundaries, offers a robust institutional solution. By anchoring the *demos* in the reality of legal coercion rather than the speculation of causal impact, it transforms a vicious logical regress into a manageable constitutional question. It acknowledges that democracy is not about managing all consequences, but about legitimating the specific power that binds us. Therefore, the ASP remains the only defensible principle for constituting a working democratic *demos*.
