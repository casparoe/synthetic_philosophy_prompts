answer: |-
  My friend, you speak the language of isotopes. It is precise. I like precision, even if I am a man of words and you are a man of elements. You propose that guilt is a substance, something emitted, something that loses its energy over time until it is harmless background noise. It is a comforting thought. It suggests that time itself is a solvent—that if we simply wait, the danger passes on its own.

  I will concede this to you: the heat of it. The immediate shame, the shouting in the streets, the way a man cannot look his neighbor in the eye... yes, that cools. The intensity changes. In that sense, your radiation meter might drop. The generation that signed the orders dies, and the screaming stops.

  But you speak of a nation being guilty, and then you speak of blaming someone. Here, I must pause. You are sliding between two different things.

  Before we proceed, I must ask you: When you say this "blame" remains or fades, are you talking about the burden on the conscience of the individual man, or the liability of the citizen before the world?

  Because if we speak of the political—if we speak of the citizen—that liability does not decay like an isotope. It is not a substance inside you waiting to dissipate. It is a relationship between you and the state you inhabit. Political guilt is collective because citizenship is collective. You did not pull the trigger, perhaps. But you are the body politic.

  Tell me, does the son inherit the property of the father, but not the debts? If the state continues, if the land remains, if the people remain... who pays the bill if not the ones who inherit the house?
