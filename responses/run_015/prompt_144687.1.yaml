prompt: |-
  You are a professional historian of science with training in philosophy of historiography. Think carefully, and begin by briefly mapping the core commitments of Whig historiography—especially its tendency to read past scientific controversies as linear progress toward present orthodoxy—before turning to the case.

  Analyze the 1854 Broad Street cholera outbreak and John Snow’s removal of the pump handle as a case study in Whig history. Do not simply retell the triumph-of-epidemiology story. Instead, examine how a Whig framing treats Snow’s contemporaries who defended the miasma theory—particularly the local Board of Health’s refusal to act on his water-borne hypothesis and the persistence of miasma explanations through the 1866 East London outbreak. For each side, identify what the Whig narrative must classify as “error” versus “insight,” and ask whether that classification obscures the internal coherence and evidential standards of the miasma program at the time. Then consider what the 1866 recurrence—after Snow’s death and after the board had finally adopted some sanitary measures—shows about the relationship between institutional reform and theoretical change: does the episode support a Whig reading in which correct theory eventually drives policy, or does it reveal that policy can shift for practical reasons while theoretical commitment lags, undermining the idea of history as rational convergence? Conclude by saying whether the case is best read as an anomaly for Whig historiography, a confirmation disguised by hindsight, or evidence that the Whig temptation is unavoidable once we know the outcome.
