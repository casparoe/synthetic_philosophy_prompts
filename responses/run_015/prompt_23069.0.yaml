      *Wait, looking at the "Steelman" instruction again:* "honestly steelman the side that says we have to honor the rules we posted, since bending them mid-game is exactly how you make nobody trust the next auction."
      Okay, I need to make sure I explicitly validate that fear.

      *Final check on the recommendation:* Is it better to collect both?
      If I recommend collecting both, I risk the donors refusing to pay. Then we have to sue or write it off. That's worse.
      If I recommend waiving, we get $1,900 guaranteed (likely), and goodwill.
      I will stick with Waiving the second bid. It's the responsible fiduciary choice for a non-profit.

      *Wait, is there a middle ground?* Ask the second bidder to convert their bid to a straight donation? No, that's still pressure. Waive it.

      *Okay, ready to generate.*

