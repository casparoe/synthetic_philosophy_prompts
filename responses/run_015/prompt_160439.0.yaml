          4.  Conceiving That $\neq$ Of (Precision).
      *   *Collapse Point:* #1. If they think writing a sentence creates a world, nothing else matters.
      *   *Misconceptions:* Let them assert "If I can write it, it's possible" early. Smash it with the Manuscript.
