  8.  **Refining the Core Case Argument:**
      *   Why the Manuscript? Because it's *their* language. They deal in texts. A causal loop of information is a writer's paradox, not just a physicist's.
      *   How to avoid causation quarrels? Ban the word "how." Focus on "what." The text exists. It has no author. Is that a *state of affairs* or a *description of ignorance*?
