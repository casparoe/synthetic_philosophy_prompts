          2.  The Core Case (Use the unauthored manuscript or something else? Argument for choice).
          3.  Misconception Map (Where to defuse them, which to let stick briefly).
          4.  Exit Check (Performance-based, applied to their work).
          5.  Exclusions (What to explicitly refuse to discuss).
      *   **Constraints:** Do *not* explain epistemology of modality to the user (me). Focus on pedagogy and session flow.

  2.  **Deconstruct the Dependency Structure:**
      *   I need to order the concepts so they build logically.
      *   *Concepts:* Epistemic vs. Metaphysical possibility, Narrated vs. Specified, First-pass vs. Sustained reflection, Conceiving that vs. Conceiving of, Bidirectional guide strength.
      *   *Logic:* You can't distinguish Epistemic/Metaphysical until you know what "possibility" means in context. You can't know if something is fully specified until you try to narrate it. You can't judge the guide's strength until you've tested a case.
      *   *Critical Failure Point:* If they don't grasp the difference between *narrative gloss* (skipping details) and *ontological specification* (filling all slots), the rest collapses. If they think "I can write a sentence about it" equals "I have defined a possible world," the lesson fails.
      *   *Order:*
          1.  Narratability vs. Specification (The "Gloss" vs. The "Blueprint").
          2.  Epistemic vs. Metaphysical (What fits my knowledge vs. What fits reality's rules).
          3.  Conceivability as a Guide (Graded/Defeasible).
          4.  Conceiving That vs. Of (Propositional vs. Object-involving).
      *   *Collapse Point:* The distinction between *Narratability* and *Specification*. If they think writing "It happened" counts as specifying *how*, they will never see the gaps. This must be first.

  3.  **Select the Core Case:**
      *   *Option A: The Unauthored Manuscript (Causal Loop).*
          *   Pros: Instructor's passion, immediately conceded as conceivable, craft-relevant.
          *   Cons: Risks devolving into time-travel mechanics/causation debates (as the user fears).
      *   *Option B: Inverted Spectrum/Color.*
          *   Pros: Classic philosophy of mind.
          *   Cons: Too abstract, feels like "philosophy class," less relevant to plot mechanics.
      *   *Option C: Arithmetic Going Wrong.*
          *   Pros: Clear impossibility.
          *   Cons: Too dry, easy to dismiss as "magic."
      *   *Option D: A Necessary Truth Discovered Empirically (Kripkean).*
          *   Pros: Hits the "conceivable but impossible" sweet spot hard.
          *   Cons: Hard to explain quickly to non-philosophers.
      *   *Decision:* Stick with the **Unauthored Manuscript**, but *modify the framing*. The user worries about causation. The fix is to shift the focus from *how* the loop happens (causation) to *what the text contains* (information/identity).
      *   *Why:* It keeps the session grounded in *writing*. The "impossibility" isn't physics; it's about *identity conditions*. If the text is identical in every copy, where did the *tokens* come from? It forces them to specify the *origin* without allowing a "magic" gap.
      *   *Requirement:* The example must lack physical mechanism (no time machine described) and focus on the *textual identity*. It must lack a "hidden source" reveal.

  4.  **Map the Misconceptions:**
      *   *M1: Picturing = Possible.* Defuse early (during Narratability vs. Specification).
      *   *M2: Unable to Picture = Impossible.* Defuse mid-session (during Guide Strength).
      *   *M3: Nomological vs. Metaphysical slide.* Defuse when discussing "rules of the world."
      *   *M4: Narratability = World Coherence.* This is the big one. Let them commit to this early so it can be shattered.
      *   *Unanticipated Misconception:* "If the author says it's possible, it is." (Authorial Fiat). Need to address that the *text* must do the work, not the *preface*.

  5.  **Design the Exit Check:**
      *   Needs to be performative, not verbal.
      *   Needs to apply to their WIP (Work In Progress).
      *   *Idea:* The "Gap Audit." Take a magical/impossible element in their draft. Write the sentence that makes it work. Now write the three sentences that specify *how* it exists without using the word "magic" or "because." If they can't, it's a narrative gloss, not a specified possibility.
      *   *Refinement:* Make it about *consequences*. If X is true, what *must* else be true? If they can't list the necessary consequences, they haven't specified the possibility, just pictured the result.

  6.  **Define Exclusions:**
      *   No Quantum Mechanics.
      *   No Multiverse Theory (too easy an out).
      *   No "Dream Sequences" (it was all a dream).
      *   No deep dive into Kripke/Putnam naming.
      *   No Time Travel Physics.

