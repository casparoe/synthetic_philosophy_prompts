  ### Stage 1: Brainstorming the Logical Space

  To build a decision tree that accurately maps the conceptual terrain without begging the question, I need to isolate the independent variables that define a researcher's stance. The debate is not a single line from "adaptationist" to "anti-adaptationist"; it is a multi-dimensional space defined by commitments to ontology (what exists), epistemology (how we know), and methodology (how we search).

  **Independent Questions (Dimensions):**
  1.  **Current Utility:** Does the trait currently contribute to fitness? (Yes/No)
  2.  **Causal Necessity:** If no utility, is the trait forced by physics/development? (Yes/No)
  3.  **Function Definition:** Does "function" refer to history or current causal role? (Etiological/Causal)
  4.  **Etiological Match:** Did selection for the *current* role cause the trait's origin? (Yes/No)
  5.  **Maintenance/Origin Identity:** Is the force maintaining the trait the same as the force that originated it? (Yes/No) — *The Palimpsest Node.*
  6.  **Evidential Sufficiency:** Is current utility sufficient evidence for past selection? (Yes/No) — *The Laundering Node.*
  7.  **Methodological Default:** Do we assume adaptation before testing? (Yes/No)
  8.  **Proof Standard:** Is a formal null-model required to claim adaptation? (Yes/No)
  9.  **Prevalence Claim:** Is adaptation the statistical norm in nature? (Yes/No)

  **Combinatorics:**
  With 9 binary questions, there are $2^9 = 512$ theoretical answer-combinations.
  However, logical dependencies prune this space drastically.
  *   If *Current Utility* is No, *Evidential Sufficiency* and *Methodological Default* regarding adaptation become moot or incoherent.
  *   If *Function Definition* is Causal (Current), *Etiological Match* is irrelevant.
  *   If *Proof Standard* is "Yes" (Null Model required), *Methodological Default* (Assume adaptation) is typically "No".

  **Expected Unoccupied Combinations:**
  1.  **The "Constraint-Panglossian":** Asserting a trait is physically constrained (Question 2 = Yes) but also that current utility proves it was selected for (Question 6 = Yes). This is incoherent; physical necessity precludes selection for alternative forms.
  2.  **The "Blind Frequency Adaptationist":** Claiming adaptation is the statistical norm (Question 9 = Yes) but refusing to assume it as a working hypothesis (Question 7 = No) and refusing to test it with null models (Question 8 = No). This is historically occupied (some casual empiricism) but theoretically unstable; it claims a statistic without a method to measure it.

  **Leaf Targets:**
  I need to route the paths to ensure the following positions emerge:
  *   Panglossian (Utility -> Laundering Yes)
  *   Methodological (Utility -> Laundering No -> Default Yes)
  *   Frequency (Utility -> Laundering No -> Default No -> Prevalence Yes)
  *   Pluralist (Utility -> Laundering No -> Default No -> Prevalence No)
  *   Drift (No Utility -> No Constraint -> No Byproduct)
  *   Constraint (No Utility -> Constraint Yes)
  *   Spandrel (No Utility -> Constraint No -> Byproduct Yes)
  *   Exaptation (Utility Yes -> Origin Match No)
  *   Deflationary (Function = Current)
  *   Abstentionist (Null Model Required)

  **Trait Allocation:**
  1.  Peacock's train (Utility/Laundering)
  2.  Redness of blood (Constraint)
  3.  Human chin (Byproduct)
  4.  Feathers (Origin/Maintenance mismatch)
  5.  Male nipples (Methodological Default)
  6.  Human navel (Null Model/Non-adaptive)
  *(Panda's thumb omitted to meet "6 of 7" constraint, though it fits Constraint/Byproduct).*

