  ### Stage 2: The Instrument

  #### Part A: The Decision Tree (Indented List)

  1.  **Does the trait currently increase the organism's chances of surviving or reproducing?**
      *   *Illustration:* The **peacock's train** attracts mates, increasing reproductive success.
      *   **No:** Go to Node 2.
      *   **Yes:** Go to Node 4.

  2.  **Is the trait's presence forced by the laws of physics or chemistry, such that it could not be otherwise?**
      *   *Illustration:* The **redness of blood** is a chemical necessity of hemoglobin binding oxygen, not a selected color signal.
      *   **Yes:** **Leaf A (Constraint-or-Structure-First).**
      *   **No:** Go to Node 3.

  3.  **Is the trait an unavoidable side-effect of a different adaptation, serving no purpose of its own?**
      *   *Illustration:* The **human chin** may be a structural byproduct of jaw reduction, not a selected feature for speech or beauty.
      *   **Yes:** **Leaf B (Byproduct-or-Spandrel).**
      *   **No:** **Leaf C (Drift-and-Noise-First).**

  4.  **When you use the word "function," do you mean "what it does now" or "why it was historically selected"?**
      *   *Illustration:* **Feathers** currently provide lift (what they do), but may have originally evolved for warmth (why they were selected).
      *   **What it does now:** **Leaf D (Deflationary).**
      *   **Why historically selected:** Go to Node 5.

  5.  **Did the trait originally arise *because* it provided the specific benefit it provides today?**
      *   *Illustration:* **Feathers** provide flight now, but likely originated for thermoregulation; the origin-explanation and maintenance-explanation differ (the palimpsest problem).
      *   **No:** **Leaf E (Exaptation-Centred).**
      *   **Yes:** Go to Node 6.

  6.  **If we lack fossil evidence of the origin, is the current benefit sufficient proof that natural selection caused the trait to appear?**
      *   *Illustration:* The **peacock's train** is useful now; does that prove it evolved *for* that usefulness, or are you maintenance-laundering?
      *   **Yes:** **Leaf F (Panglossian).**
      *   **No:** Go to Node 7.

  7.  **When beginning research on a useful trait, do you assume it is an adaptation until evidence proves otherwise?**
      *   *Illustration:* **Male nipples** exist; do you start by assuming they have a selected function, or that they are developmental artifacts?
      *   **Yes:** **Leaf G (Heuristic-or-Methodological Adaptationist).**
      *   **No:** Go to Node 8.

  8.  **Do you require an explicit optimality model with a null alternative before accepting a selection explanation?**
      *   *Illustration:* The **human navel** is a scar; for adaptive traits, do you demand a mathematical test against random drift before saying "selection"?
      *   **Yes:** **Leaf H (Abstentionist).**
      *   **No:** Go to Node 9.

  9.  **Is natural selection the explanation for the majority of traits in nature, or only a significant minority?**
      *   *Illustration:* Consider the whole set (blood, chin, feathers, etc.); is selection the rule or the exception?
      *   **Majority:** **Leaf I (Frequency-or-Empirical Adaptationist).**
      *   **Significant Minority:** **Leaf J (Pluralist).**

  #### Part B: Compact Path Table

  | Path Code | Node 1 (Utility) | Node 2 (Constraint) | Node 3 (Byproduct) | Node 4 (Function Def) | Node 5 (Origin Match) | Node 6 (Laundering) | Node 7 (Method Default) | Node 8 (Null Model) | Node 9 (Prevalence) | **Leaf Position** | **Most Awkward Commitment** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- | :--- |
  | **A** | No | Yes | - | - | - | - | - | - | - | **Constraint-or-Structure-First** | You must explain complex biological order without invoking selection as the primary architect. |
  | **B** | No | No | Yes | - | - | - | - | - | - | **Byproduct-or-Spandrel** | You must classify complex, useful-looking traits as functionless accidents of history. |
  | **C** | No | No | No | - | - | - | - | - | - | **Drift-and-Noise-First** | You must attribute the persistence of many traits to random chance rather than design. |
  | **D** | Yes | - | - | Current | - | - | - | - | - | **Deflationary** | You must decline to answer whether the trait was *designed*, focusing only on what it *does*. |
  | **E** | Yes | - | - | History | No | - | - | - | - | **Exaptation-Centred** | You must distinguish a trait's current utility from its historical reason for being, even if they align now. |
  | **F** | Yes | - | - | History | Yes | Yes | - | - | - | **Panglossian** | You must accept that current usefulness is sufficient proof of past selective intent. |
  | **G** | Yes | - | - | History | Yes | No | Yes | - | - | **Heuristic-or-Methodological Adaptationist** | You must admit your assumption of adaptation is a tool for discovery, not necessarily a fact about nature. |
  | **H** | Yes | - | - | History | Yes | No | No | Yes | - | **Abstentionist** | You must withhold judgment on adaptation until a mathematical null-model has been specified and tested. |
  | **I** | Yes | - | - | History | Yes | No | No | No | Majority | **Frequency-or-Empirical Adaptationist** | You must claim selection is the statistically dominant cause of traits without requiring a model for every case. |
  | **J** | Yes | - | - | History | Yes | No | No | No | Minority | **Pluralist** | You must treat adaptation as one of several equally important explanatory tools, not the default. |

  *(Note on Leaf J: This is the position the 1979 Gould-Lewontin paper is standardly read as defending. My verdict: This reading is partially right but muddles their ontological critique with their methodological recommendation; they argue for pluralism of causes, not just pluralism of methods.)*

