answer: |-
  # Pass 1: Brainstorming Dump

  **Cases to Account For:**
  *   **Kalenia:** Term extension (bad) + Clean election loss (good). Media capture (bad) + Commission reform (good). Net result? If they lost, did the backsliding matter? *Problem:* Outcome bias. If we wait for the election result to judge the term extension, it's too late to warn. If we flag the term extension, we look partisan if they lose cleanly anyway.
  *   **Marevia:** War/Exogenous shock. Emergency powers. Metrics drop more than Kalenia. *Problem:* Context blindness. Punishing a gov for war-time measures vs. punishing a gov for peace-time power grabs. Distinction between *capacity* constraint and *willful* erosion.
  *   **Mandate Case:** 2/3 majority, referendum. Abolishing checks. Elections clean. *Problem:* Majoritarianism vs. Liberalism. Is democracy just voting or also constraints? If we flag this, we override domestic mandates. If we don't, we allow elected autocracy.
  *   **Federation Case:** National decline, local improvement. *Problem:* Aggregation. Does "country-level" backsliding justify cutting funds to local partners in improving states?
  *   **Mirror Case:** "Good" side centralizes power to fix "bad" courts/franchise. *Problem:* Partisan asymmetry. If the definition doesn't catch this, it's a weapon. If it does, do we really want to flag franchise expansion as backsliding? (Probably not, but the centralization is the risk).

  **Distinctions Needed:**
  *   Intent vs. Effect. (Hard to prove intent).
  *   Reversible vs. Irreversible. (Term limits vs. Policy shifts).
  *   Legal vs. Normative. (Constitutional amendment vs. Norm breaking).
  *   Endogenous vs. Exogenous. (War/Economy vs. Political Choice).
  *   Contestation vs. Governance. (Can they lose power vs. Do they govern well).

  **Failure Modes:**
  *   **The Lag:** We realize it's backsliding only after the election is rigged (too late for partners).
  *   **The Partisan Trap:** We flag "our" allies less harshly than opponents (Mirror Case).
  *   **The False Positive:** We cut funding in Marevia during a war, destroying civil society when it's most needed.
  *   **The False Negative:** We ignore Kalenia's term extension because "they lost anyway."
  *   **The Aggregation Blindness:** We cut all funding in the Federation case, punishing the 12 improving states.
  *   **The Mandate Override:** We declare a popular referendum "backsliding" because it removed a court (Mandate Case). Legitimacy crisis for the foundation.

  **Tensions:**
  *   **Early Warning vs. Falsifiability:** To be early, we need proxies (rhetoric, bills). To be falsifiable (passable), we need outcomes (rigged elections). You can't have both easily.
  *   **Intent vs. Observability:** Backsliding implies *direction*. But we can't read minds. We have to infer intent from effect. But effects can be accidental or contextual (Marevia).
  *   **Universalism vs. Context:** One rule for Kalenia and Marevia? Or context-sensitive? Context sensitivity opens the door to bias.

  **Who Decides:**
  *   Domestic Courts? (Maybe captured).
  *   Voters? (Maybe misled).
  *   Us (Foundation)? (No mandate, look like foreign interferers).

  **Viability:**
  *   Is "Backsliding" a usable term? Or is it inherently a slur?
  *   Should we use a checklist of mechanisms instead? (Court packing, media capture, etc.)
  *   Can the concept return "No"? Or is it a ratchet?

  **Hard Requirements:**
  *   Must distinguish war from power grabs.
  *   Must distinguish mandate from erosion.
  *   Must be applicable to "our side."

  **Likely Violations:**
  *   We will probably ignore the "Mirror Case" in practice.
  *   We will probably wait too long (Lag).

  ***

  # Pass 2: Specification for Democratic Backsliding

  ## I. Core Requirements

  An adequate account of democratic backsliding for an external funding body must satisfy five specific requirements. Each is motivated by a failure mode observed in the cases provided.

  **1. The Agency Requirement (Endogeneity)**
  *   **Specification:** The decline in democratic quality must be attributable to the strategic choices of domestic political actors, not to exogenous constraints or security necessities.
  *   **Motivating Case:** **Marevia.** A war on the border forces emergency powers and election delays. If the account flags this as backsliding, it punishes survival strategies. If it ignores it, it must distinguish between *necessary* constraint and *opportunistic* constraint.
  *   **Failure Mode:** Without this, the account flags states under siege (false positives), causing the foundation to abandon partners when external threats are highest. An account that ignores agency treats a siege economy the same as a kleptocratic one.

  **2. The Contestation Requirement (Reversibility)**
  *   **Specification:** The changes must materially reduce the opposition's capacity to compete for power *in the future*, regardless of the outcome of the *current* election.
  *   **Motivating Case:** **Kalenia.** The coalition extended the president's term (reducing future contestation) but lost the next election anyway. A results-based account says "no backsliding" because they lost. A contestation-based account says "backsliding" because the *rules* were altered to favor incumbency, even if it failed this time.
  *   **Failure Mode:** Without this, the account is outcome-dependent. It only fires after the democracy is already dead (the election was rigged). For early warning, you must flag the *incapacitation of recourse*, not just the *exercise* of power.

  **3. The Mechanism Neutrality Requirement (Symmetry)**
  *   **Specification:** The assessment must track the *method* of power consolidation, not the *policy content* or the *ideological alignment* of the actor.
  *   **Motivating Case:** **The Mirror Case.** A government expands the franchise (good) but centralizes power to do it (potentially bad). If the account excuses centralization because the goal is liberal, it is partisan. If it flags franchise expansion because it disrupts stability, it is reactionary. It must isolate the centralization mechanism.
  *   **Failure Mode:** Without this, the concept becomes a weapon for one camp. It flags "their" centralization as backsliding and "our" centralization as reform. This destroys the foundation's credibility with donors and partners.

  **4. The Mandate Threshold (Legitimacy)**
  *   **Specification:** The account must distinguish between the use of democratic mandates to alter institutions and the subversion of mandates to protect incumbents. High-threshold procedural legitimacy (e.g., supermajorities, referenda) mitigates but does not immunize against backsliding charges.
  *   **Motivating Case:** **The Mandate Case.** A government with 2/3 support abolishes the constitutional court. Is this backsliding? Liberal theory says yes (removing checks). Majoritarian theory says no (people's will). The account must rule that removing *recourse* is backsliding even with a mandate, but the threshold for evidence must be higher.
  *   **Failure Mode:** Without this, the account either overrides domestic sovereignty (ignoring the referendum) or allows elected autocracy (ignoring the court removal). It forces the foundation to choose between respecting votes and protecting liberties.

  **5. The Granularity Requirement (Sub-national Variance)**
  *   **Specification:** The verdict must be assignable at the sub-national level where power is exercised, not just at the sovereign state level.
  *   **Motivating Case:** **The Federation Case.** National degradation in 8 states, improvement in 12. A country-level verdict forces an all-or-nothing funding decision.
  *   **Failure Mode:** Without this, the foundation engages in collective punishment. It cuts off civil society in improving regions because of degradation elsewhere, violating the charity's mission to support democracy where possible.

  ## II. Tensions and Trade-offs

  You asked whether some demands are jointly unsatisfiable. There are two critical tensions.

  **1. Early Warning vs. Falsifiability (The Kalenia Tension)**
  *   **The Tension:** To fire early (before the rigged election), the concept must rely on *intent* and *legal changes* (term extensions). To be falsifiable (a test a government could pass), it must rely on *outcomes* (did they actually win unfairly?).
  *   **Resolution:** This tension is real but manageable. You must prioritize *capacity for abuse* over *evidence of abuse*. In Kalenia, the term extension is the trigger, not the election result. This means the concept will occasionally flag governments that turn out to be benign (false positives). You must accept this cost. If you wait for certainty, you are no longer doing early warning; you are doing autopsies.

  **2. Intent vs. Observability (The Marevia Tension)**
  *   **The Tension:** Backsliding implies a *direction* (agency). But you cannot access motives. Marevia's government might be using war to grab power, or genuinely fighting for survival.
  *   **Resolution:** Do not attempt to measure intent. Measure *proportionality* and *sunset clauses*. If emergency powers in Marevia lack a sunset clause or extend beyond the active conflict zone, attribute agency. If they are strictly bounded, attribute to exogenous shock. This dissolves the tension by making intent inferable from institutional design.

  ## III. The Ratchet Problem and Verdict Viability

  **Can the concept return a verdict of "No"?**
  Yes, but only if you strictly enforce **Mechanism Neutrality**. If the concept is structurally a one-way ratchet that only fires on governments you dislike, it is useless for your purpose. It becomes a partisan label.
  *   **The Test:** Apply the definition to the **Mirror Case**. If your board hesitates to flag a "friendly" government centralizing power, the concept is broken.
  *   **Recommendation:** If you cannot enforce neutrality, **drop the umbrella term "backsliding."** It is too loaded. Instead, vote on a list of named mechanisms (court packing, media capture, harassment of civil service). This depoliticizes the decision. You are not judging "democracy"; you are judging "compliance with funding criteria."

  **Who Decides?**
  *   **Domestic Actors:** Insufficient. Opposition claims are partisan; courts may be captured; voters may be misled (Mandate Case).
  *   **External Observers (You):** Necessary, but costly. You lack a democratic mandate.
  *   **Solution:** You must override domestic verdicts *only* on procedural grounds, not policy grounds. If the domestic court says the term extension is legal, you check if the *process* of that legal change disabled future review. You are auditing the *machine*, not the *output*.

  ## IV. Hardest Requirements and Likely Violations

  **Which single requirement excludes the most candidate accounts?**
  **The Agency Requirement.** Most indices (V-Dem, Freedom House) measure *qualities* (freedom of press, rule of law). They do not distinguish *why* those qualities declined. They would flag Marevia heavily due to war-time press closures. An account that cannot distinguish war from repression is useless for a foundation deciding whether to suspend funds.

  **Which requirement will the board quietly violate?**
  **Mechanism Neutrality (The Mirror Case).** When a government you ideologically favor centralizes power, the board will rationalize it as "necessary reform" or "correcting past imbalances." You will apply the strict test to Kalenia and a lenient test to the Mirror Case. This is human nature. To mitigate this, you must blind the analysis: remove party names and policy goals from the briefing papers. Judge the *mechanism* in isolation.

  ## V. Scorecard of Existing Approaches

  *   **Expert-Coded Indices (V-Dem, Freedom House):**
      *   *Performance:* Poor for your purpose.
      *   *Why:* They are aggregate and laggy. They measure the *temperature* of democracy, not the *infection*. They would likely flag Marevia higher than Kalenia, leading you to cut funds in a war zone while maintaining them in a slowly eroding peace. They cannot handle the Federation Case (national averages hide local variance).
  *   **Institutional Guardrail Accounts (Levitsky/Ziblatt style):**
      *   *Performance:* Moderate.
      *   *Why:* Good at identifying norms (forbearance, mutual toleration). Handles the Mandate Case well (norms matter more than votes). However, they rely heavily on qualitative judgment, making them vulnerable to the "Mirror Case" bias. Hard to operationalize for a funding trigger.
  *   **Mechanism-Based Accounts (Media Capture, Electoral Administration):**
      *   *Performance:* Best for actionability.
      *   *Why:* Directly maps to your funding streams (media litigation, election monitoring). If the mechanism is captured, the funding is useless. This approach naturally handles the Federation Case (fund the states where mechanisms work). It avoids the "backsliding" label trap by focusing on specific operational risks.

  ## VI. Final Recommendation

  You asked whether you should keep using the term "backsliding." **You should not.**

  The term implies a moral judgment on the regime's trajectory that you cannot neutrally verify without appearing partisan. It forces you into the role of a democracy arbiter, which invites the "foreign interference" accusation, especially in the Mandate and Mirror cases.

  **Drop the umbrella concept.** Replace the charter's "moved off a democratic path" clause with a **Trigger List of Mechanisms**.
  1.  Incumbent extension of terms without election.
  2.  Removal of judicial review over electoral law.
  3.  Acquisition of >50% of national media market by allied entities.
  4.  Suspension of elections without exogenous security justification (defined by UN/NATO threshold).

  If two triggers are pulled, disbursements suspend. This satisfies the **Early Warning** need (triggers are observable acts), the **Neutrality** need (applies to friend and foe), and the **Agency** need (these are deliberate acts, not war outcomes). It accepts that you cannot measure "democracy" as a whole, but you can measure the *viability of your investment*. If the electoral commission is captured, election monitoring funds are wasted. Suspend not because the country is "undemocratic," but because the *mechanism you fund is broken*.

  This is the only specification that protects your partners from abandonment (Marevia), protects your reputation from bias (Mirror), and protects your capital from waste (Kalenia).
