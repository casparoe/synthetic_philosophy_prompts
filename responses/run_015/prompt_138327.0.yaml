answer: |-
  Here is the straight answer: **Your instinct is correct, and the Substack essay is overreaching.**

  The technical result (Tichý/Miller) is solid, but the philosophical conclusion drawn from it ("truthlikeness can't be analysed," "talk of convergence is hand-waving") is rejected by the majority of contemporary philosophers of science who work on this specific problem.

  Here is the breakdown of what is settled, what is contested, and how you can safely use this in your column.

  ### 1. The Technical Result: What is Settled
  **Claim:** *Tichý and Miller proved Popper's specific definition of verisimilitude was logically incoherent.*
  **Status:** **Settled Fact.**
  **Confidence:** 100%.

  Popper defined "truthlikeness" using logical content: Theory B is closer to the truth than Theory A if B has more true consequences and no more false consequences. Tichý and Miller proved mathematically that if a theory is false (which all empirical theories are, strictly speaking), you cannot compare them using this definition. Under Popper's rules, a wildly false theory could technically count as "closer" to the truth than a slightly false one, or no comparison is possible at all. Popper accepted this refutation immediately.

  You can state this flatly in your column. It is historical and logical fact.

  ### 2. The Philosophical Leap: What is Wrong
  **Claim:** *Therefore, truthlikeness cannot be analysed, and talk of convergence is hand-waving.*
  **Status:** **Philosophical Overreach.**
  **Confidence:** High (that this is a minority view).

  This is where the Substack author makes a category error. They are treating Popper's *specific attempt* to define truthlikeness as if it were the *only possible attempt*.

  Analogy: This is like saying, "Newton's law of gravity failed at relativistic speeds, therefore physics cannot describe gravitational attraction, and talk of orbits is hand-waving." No. It means Newton's *formula* was insufficient, not that the *phenomenon* doesn't exist.

  Most philosophers of science (specifically Scientific Realists) agree that we need a concept of truthlikeness to make sense of scientific progress. If we can't say General Relativity is "closer to the truth" than Newtonian gravity, we can't explain why we switched, other than pragmatic utility. The Tichý/Miller result killed a *logical/syntactic* approach, but it did not kill the *semantic* approach.

  ### 3. The Workarounds: Do They Fix It?
  **Claim:** *Later workarounds (possible worlds, relevant consequences) just relocate the arbitrariness.*
  **Status:** **Contested, but productive.**
  **Confidence:** Moderate (this is where the live debate is).

  After 1974, the research program didn't die; it shifted. The dominant modern approach comes from philosophers like **Ilkka Niiniluoto** and **Graham Oddie**.

  *   **The Shift:** Instead of counting logical consequences (Popper), they measure the "distance" between the actual world and the world described by the theory (Possible Worlds semantics).
  *   **The Idea:** Imagine all possible ways the universe could be. The "truth" is one specific point. Newtonian gravity describes a point *near* the truth. Aristotelian physics describes a point *far* from the truth. Verisimilitude is the distance between the theory's point and the truth's point.
  *   **The Criticism:** You asked if this just relocates arbitrariness. Critics (like Paul Teller or some instrumentalists) argue that to measure "distance," you need a metric, and choosing a metric involves human judgment about which features of the world matter more.
  *   **The Defense:** Proponents argue this isn't "hand-waving"; it's modeling. All science involves choosing metrics and parameters. The fact that we have to specify *in what respect* a theory is closer (e.g., predictive accuracy vs. ontological commitment) is a feature, not a bug.

  **Verdict for your column:** It is false to say these workarounds failed. It is accurate to say they require more nuance than Popper hoped for.

  ### 4. Relevance to Your Column
  **Claim:** *Your setup ("Newton wasn't so much wrong as less right") is muddled by this result.*
  **Status:** **False.**
  **Confidence:** High.

  Your setup is the standard position of **Scientific Realism**. The Tichý/Miller result is a technical obstacle within the philosophy of science, but it does not invalidate the realist intuition.

  In fact, acknowledging the difficulty makes your column stronger. It shows you aren't just repeating a cliché. You can say: *"Defining exactly what 'closer' means is notoriously difficult—so difficult that a famous logical proof seemed to ban the concept entirely in the 70s. But physicists and most philosophers still find the concept indispensable."*

  ### Summary for Writing
  Here is how you can categorize the claims for your piece:

  | Claim | Status | How to Print It |
  | :--- | :--- | :--- |
  | **Popper's definition was refuted by Tichý/Miller.** | **Settled.** | State flatly. "In 1974, logicians proved Popper's specific definition collapsed." |
  | **Therefore, truthlikeness is impossible to define.** | **False/Minority.** | Hedge or reject. "Some concluded this meant the concept was dead, but most philosophers disagree." |
  | **Modern definitions (possible worlds) exist.** | **Settled.** | State flatly. "New approaches measure 'distance' between theories and reality." |
  | **These modern definitions are perfect.** | **Contested.** | Hedge. "These aren't without their own controversies, but they restore the logic of progress." |
  | **Newton is closer to the truth than Aristotle.** | **Realist Consensus.** | State flatly (as your view). "Whatever the technical hurdles, GR explains more of the furniture of the universe than Newton did." |

  ### The "Straight Talk" Advice
  If I were editing your column, I would tell you this:

  1.  **Don't let the Substack essay scare you.** The author is taking a "logical impossibility proof" and turning it into a "pragmatic prohibition." That is a move most philosophers of science would push back on.
  2.  **Use the drama.** The story of Popper's definition being killed and then resurrected in a new form (Niiniluoto's verisimilitude) is actually a great example of the very progress you are writing about. Philosophy fixed its own "Newtonian" error.
  3.  **The "Arbitrariness" Point:** You are right to be suspicious that workarounds might just move the arbitrariness. You can print that. *"Critics argue that measuring 'distance to the truth' requires us to decide which errors matter more, which introduces human judgment. But that is true of all science."*

  **Bottom Line:** Your argument that "progress consists in getting less wrong" is safe. The Tichý/Miller result is a footnote about *how we define* "less wrong," not a refutation of the concept itself. You can acknowledge the footnote without surrendering the point.
