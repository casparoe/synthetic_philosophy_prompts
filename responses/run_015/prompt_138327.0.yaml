      *   **The Aftermath (Workarounds):** Discuss the "Possible Worlds" approach (Niiniluoto, Oddie). This is the standard modern fix. It defines distance between states of affairs. It's not perfect (requires a metric), but it's not "hand-waving" in the derogatory sense.
      *   **Confidence/Hedging:**
