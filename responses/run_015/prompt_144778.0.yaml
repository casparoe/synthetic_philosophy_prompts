answer: |-
  You have not confused yourself. You have identified one of the most subtle and philosophically charged features of modern stochastic thermodynamics and the physics of information. Your "cost-sliding" test is robust, and your intuition that this looks more like a constraint on accounting than a specific mechanical failure is shared by a significant faction of philosophers of physics.

  Here is the breakdown of what you are seeing, the existing terminology, the controversy surrounding it, and a formalization of your observation.

  ### 1. Does this have a name?

  There is no single standard noun phrase that captures exactly the "sliding" phenomenology you describe, but there are several technical concepts that map onto it.

  **In Physics:**
  *   **Coarse-graining Dependence of Entropy Production:** In statistical mechanics, entropy is not a property of a microstate but of a distribution over microstates relative to a set of macroscopic variables. When you change the idealization (e.g., "treat the tape as pre-prepared" vs. "track the tape preparation"), you are changing the coarse-graining. The *total* entropy production is invariant, but the *local* entropy production (attributed to specific subsystems) depends on which degrees of freedom you are tracking and which you are tracing out.
  *   **System-Environment Split:** In open quantum systems and stochastic thermodynamics, where you draw the boundary between "system" (the demon/engine) and "bath" (the environment) determines where dissipation is registered.
  *   **Mutual Information vs. Thermodynamic Entropy:** In modern information thermodynamics (Sagawa-Ueda formalism), the "cost" often exists initially as **mutual information** (correlation) between the controller and the system. It only becomes **thermodynamic entropy** (heat) when you discard (trace out) the controller. Your observation that the cost "jumps from a step in the cycle to a state of a subsystem" is precisely the conversion of mutual information into entropy depending on whether you treat the correlation as a resource or ignore it.

  **In Philosophy of Physics:**
  *   **The Norton Critique:** Philosopher John Norton (Pittsburgh) has argued extensively that Landauer's Principle is not a *physical mechanism* that saves the Second Law, but merely a *restatement* of it. He argues that the "exorcism" of Maxwell's Demon via information erasure is circular. Your observation supports his view: if the location of the cost is movable based on description, it functions as a consistency condition (accounting) rather than a causal mechanism (physics).
  *   **Explanatory Redundancy:** This is the claim that identifying the "erasure step" as the culprit is explanatorily redundant because the Second Law already guarantees the failure somewhere.

  ### 2. What exactly is it (and what is it not)?

  **What it is:**
  It is the **gauge freedom in the localization of irreversibility**.
  Thermodynamics guarantees that $\Delta S_{total} \ge 0$. However, $S_{total} = S_{system} + S_{bath} + I(system:bath)$, where $I$ is mutual information.
  *   If your model tracks the correlation ($I$), the cost is stored as "potential" (negentropy/correlation).
  *   If your model ignores the correlation (traces out the memory), the cost appears immediately as heat in the bath.
  *   If your model assumes the memory starts blank (low entropy), the cost is pushed to the *preparation* of that state.

  The "sliding" occurs because **entropy is relative to the observer's description of the system**. When you change the idealization (e.g., "reversible measurement"), you are changing which variables are considered controllable and which are thermalized. You are effectively changing the *macroscopic description* of the same microscopic physics.

  **What it is not:**
  *   **It is not a violation of energy conservation.** Energy is strictly local and invariant. The "cost" you are tracking is *entropic* cost (free energy dissipation), which is description-dependent.
  *   **It is not merely "drawing the boundary."** In standard thermodynamics, if you draw a boundary around a resistor, the heat is inside. If you draw it outside, the heat flows out. The *location* is fixed by the boundary. In your cases, the boundary stays roughly the same, but the *causal attribution* changes based on *counterfactuals* (e.g., "what if we didn't erase?"). This is deeper than simple boundary drawing; it is about the **causal model** imposed on the physics.

  ### 3. Is anybody actually troubled by this?

  **Yes.** This is the central fault line in the philosophy of information physics.

  *   **The Orthodox View (Bennett, Landauer, Zurek):** They tend to treat the erasure cost as a physical mechanism. The slogan "Information is Physical" is meant to imply that information processing *is* a physical process subject to specific costs (Landauer's $kT \ln 2$). They would argue the cost doesn't "slide"; rather, different descriptions reveal different parts of the *same* necessary physical process.
  *   **The Critical View (Norton, Earman, Hemmo & Shenker):** They argue that the "sliding" proves Landauer's Principle is not a fundamental physical law but a derived consistency condition. Norton famously calls the reliance on Landauer's Principle to save the Second Law "profligate flattery." If the cost can be pushed to the preparation of the tape, or the correlation, or the erasure, then saying "Erasure is the cause" is arbitrary.
  *   **The Middle Ground (Maroney, Parrondo):** Recent work in stochastic thermodynamics accepts the sliding. They frame it as **Information Thermodynamics**. The "cost" is the consumption of **non-equilibrium resources** (like a blank tape or a low-entropy battery). Where you say the resource is "consumed" depends on when you stop tracking the correlations.

  **Does it pressure "Information is Physical"?**
  It pressures the *slogan*, not the *physics*. It suggests "Information" is not a substance like mass that sits in a specific place. Instead, "Information" is a label for **correlations that we choose to exploit**. The physics is always just particles moving; the "information cost" is the bookkeeping we use to track our inability to control all those particles.

  ### 4. Coining a Term and Defining Borders

  Since "Coarse-graining Dependence" is too technical and "Norton's Critique" is too philosophical, your intuition deserves a specific label. I propose formalizing your term:

  **Term:** **Dissipation Localization Ambiguity (DLA)**
  *(Colloquially: Cost Sliding)*

  **Definition:**
  DLA occurs in thermodynamic cycles involving feedback or information processing when the attribution of entropy production to specific subprocesses (measurement, control, erasure, preparation) varies under changes in system idealization or boundary definition, while the global entropy production remains invariant and positive.

  **Border Cases:**

  *   **Clear Case of DLA (The Szilard Engine with Memory):**
      *   *Scenario A:* You model the demon's memory as part of the system. You measure, extract work, and the memory ends up correlated. No heat is dissipated *yet*. The "cost" is stored as mutual information.
      *   *Scenario B:* You model the memory as part of the environment (you trace it out). The measurement step now looks dissipative immediately.
      *   *Verdict:* This **is** DLA. The physics is identical; the accounting of *when* the entropy increases changes based on whether you track the correlation.

  *   **Not DLA (Different Machines):**
      *   *Scenario A:* A ratchet and pawl where the pawl is at temperature $T_1$ and the ratchet at $T_2$.
      *   *Scenario B:* A ratchet and pawl where both are at $T_1$.
      *   *Verdict:* This is **not** DLA. These are physically distinct setups with different global entropy productions. The "location" of the failure changes because the *machine* changed, not the description.

  *   **Not DLA (Unresolved Physics):**
      *   *Scenario:* Quantum measurement collapse. Does the wavefunction collapse dissipate heat?
      *   *Verdict:* This is **not** DLA; this is an **ontological disagreement**. In Copenhagen interpretations, collapse might be physical and dissipative. In Many-Worlds, it isn't. This isn't a sliding of accounting; it's a disagreement about the underlying dynamics.

  ### Summary for your Seminar

  You are correctly identifying that **Landauer's Principle functions as a conservation law for "negentropy" rather than a mechanical friction.**

  When you ask "Where is the cost paid?", you are asking a question similar to "Where is the potential energy located: in the brick or in the gravitational field?" In thermodynamics, the answer is: **It depends on which variables you are treating as fixed.**

  *   If you treat the blank tape as a **resource** (like a spring), the cost is paid when you **prepare** the tape.
  *   If you treat the blank tape as a **given state**, the cost is paid when you **reset** it.
  *   If you treat the correlation as **accessible**, the cost is paid when you **discard** the correlation.

  Your "cost-sliding" is the realization that **thermodynamic irreversibility is relative to the level of control assumed.** The demon fails not because a specific gear grinds, but because you cannot simultaneously control the gas *and* the memory *and* the preparation device without eventually hitting a boundary where your control runs out. The "location" of that boundary is up to you to draw.

  **Recommended Reading to back this up:**
  1.  **John Norton, "All Shook Up: Fluctuations, Maxwell's Demon and the Thermodynamics of Computation" (2005).** (Directly addresses the circularity/accounting issue).
  2.  **Owen Maroney, "Information Processing and Thermodynamic Entropy" (2009).** (Discusses the distinction between physical and information-theoretic entropy).
  3.  **Parrondo, Horowitz, & Sagawa, "Thermodynamics of Information" (Nature Physics, 2015).** (The modern physics view that formalizes the "sliding" via mutual information).

  You haven't confused the bookkeeping; you've noticed that the ledger is double-entry, and you can choose which column to write the debit in, as long as the balance holds.
