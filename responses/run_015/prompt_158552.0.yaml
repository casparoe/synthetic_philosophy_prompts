answer: |-
  Your teammate accurately describes the logical trap that broke the original 1930s version of the theory, but he is factually wrong that the view is dead, as modern philosophers successfully upgraded it to survive that exact problem.

  **Sentence 1: "Moral sentences don't describe anything, they just vent attitudes..."**
  *   **What's accurate:** This is a fair summary of *Emotivism* (the 1930s version championed by A.J. Ayer). They did literally compare moral judgments to exclamations like "Boo!" or "Hurrah!"
  *   **What's a strawman:** Any modern defender (called an *Expressivist*) rejects the "venting" characterization. They argue moral thoughts are genuine, complex states of mind that function like beliefs, even if they aren't descriptions of facts.
  *   **What's wrong:** Defenders do not say disagreement is impossible or that no one can be mistaken. They explain disagreement as a clash of attitudes (like wanting opposite things) and mistake as having attitudes that violate rational norms, not failing to match reality.

  **Sentence 2 & 3: "The Frege–Geach problem finished this off... validity needs the sentence to mean the same thing..."**
  *   **What's accurate:** This is the strongest part of his summary. The Frege-Geach problem is real and serious. It points out that if "wrong" means "boo" in "Stealing is wrong," it makes no sense in "If stealing is wrong..." because you aren't saying "boo" in the "if" clause.
  *   **What's accurate:** He is also right that logic requires consistency. If the word means "boo" in premise one but nothing in premise two, the argument is invalid (like a programming type error), yet moral arguments feel valid.
  *   **What a defender accepts:** Modern expressivists accept this was a devastating critique of the *old* version and spent the last 40 years building semantic theories to explain how moral words keep the same meaning in unasserted contexts.

  **Sentence 4: "The view was dead by the 1990s: everyone who thought hard about it became a realist..."**
  *   **What's just wrong:** This is factually incorrect. The 1990s was actually when the view was rehabilitated, not buried. Philosophers like Simon Blackburn (Quasi-Realism) and Allan Gibbard (Norm-Expressivism) published major works solving the Frege-Geach problem during this exact period.
  *   **What's wrong:** Metaethics is not dominated by realists. Expressivism remains one of the two or three major live positions in the field. Many smart people still work on it not because they "like hard problems," but because they find the non-realist explanation of morality more plausible than realism.

  **Negation and Questions**
  *   **Does it get harder?** The problem is equally hard for negation, questions, and disjunctions; they are all "embeddings." However, negation is a specific nightmare for expressivists. If "Stealing is wrong" expresses a disapproval attitude, what attitude does "Stealing is *not* wrong" express? It isn't just "no attitude," because you can actively believe something is permissible. Solving this required sophisticated logic work, but it hasn't stopped the theory from surviving.

  **Conclusion**
  *   **Does his conclusion follow?** No. He correctly identifies a fatal flaw in the 1930s version but incorrectly assumes no one fixed it. The Frege-Geach problem didn't kill the view; it forced it to evolve from crude "booing" into sophisticated Expressivism, which is why the view is still alive today.
