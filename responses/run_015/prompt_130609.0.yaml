  **BUREAU OF TEMPORAL EQUITY (BTE)**
  **PUBLIC FREQUENTLY ASKED QUESTIONS: VERSION 4.2**
  **SUBJECT: OPERATIONALISING THE RIGHTS OF UNBORN CITIZENS**

  **1. Who constitutes the constituency for the Future Generations Proxy?**
  The constituency is defined as the probabilistic aggregate of citizens likely to exist between 2080 and 2150. However, under the Non-Identity Protocols, the BTE acknowledges that specific policy interventions alter conception dates and partner selection. Consequently, the individuals represented by the Proxy may not exist if the Proxy successfully mitigates climate harm. To resolve this, the Proxy represents the *interest* of the slot, not the *identity* of the occupant. If successful mitigation prevents the birth of the specific constituency mandated by the charter, the Proxy is considered to have fulfilled its duty through obsolescence.

  **2. How are voting weights calculated across temporal boundaries?**
  Future votes are adjusted using a Standardised Temporal Discount Rate (STDR). This ensures that present-day welfare is not disproportionately compromised by speculative future claims. Rights are treated as present-value assets; a right to clean air in 2100 is weighted at 0.4% of a right to clean air in 2024. This prevents temporal discrimination against current taxpayers while maintaining a fiduciary duty to the future. Critics who suggest this constitutes ageism across time are reminded that discounting is a standard actuarial proceedure.

  **3. Why has the Department for Transport paused all new infrastructure projects?**
  Under the Intergenerational Liability Act, any present expenditure that increases carbon debt is classified as unauthorised borrowing against future collateral. The Chief Temporal Auditor, Dr. H. Vance, has issued Guidance Note 88 regarding fiscal restraint. Protecting the future requires the liquidation of certain present comforts. Therefore, austerity measures are not cuts, but repayments on principal. Citizens are advised that current hardship is evidence of the government's commitment to unborn stakeholders.

  **4. How does the Bureau handle identity continuity when policies "branch"?**
  This refers to the Vance Branching Clause. When Policy A results in Population Set X, and Policy B results in Population Set Y, the Proxy cannot represent both simultaneously. Dr. Vance's memo states: *"Where policy divergence alters the genetic composition of the future constituency, the proxy contract must be nullified and reissued for the resulting branch. Failure to do so results in representation of non-existent entities."*

  This creates a logistical paradox where successful long-term planning invalidates the mandate of the planners. To maintain continuity, the BTE utilises a Counterfactual Identity Framework. We assume the unborn citizen exists in all potential futures, despite biological evidence to the contrary. This allows administrative continuity even when the represented subject is theoretically impossible.

  **5. What recourse do future citizens have if we fail them?**
  None. As they do not yet exist, they cannot litigate. However, the BTE conducts quarterly Harm Audits. If a policy is found to reduce the quality of life for a potential future citizen below a baseline threshold, the responsible Minister receives a Formal Notice of Temporal Negligence. This notice is filed internally.

  **6. Where can I find the full list of represented future individuals?**
  This list is dynamic and contingent upon current emission trajectories. A static register would imply a fixed future, which contradicts the purpose of governance. Please check the BTE portal for daily updates on who is expected to be born based on yesterday's carbon output.

  *For further enquiries, contact the Office of Temporal Compliance. Please allow 6-8 weeks for a response, as we are currently understaffed due to hiring freezes intended to reduce debt burdening the next generation.*
