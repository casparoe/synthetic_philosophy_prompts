answer: |-
  The vault door hissed shut, sealing Elara in the dark. Not total darkness—the floor strips glowed a soft, non-intrusive amber—but enough to satisfy the Protocol. Sector 4 was a null-zone. No cameras, no sensors, no eyes. Except hers, and only when necessary.

  Elara was a Custodian for the Ontological Archive. They stored things that behaved poorly under observation. Quantum anomalies, yes, but also artifacts that seemed to tether reality itself. The prevailing theory among the senior archivists was materialist: the objects existed regardless of the viewer. But the Protocol was built on an older, stranger intuition. *Esse est percipi.* To be is to be perceived.

  Her task was simple. Retrieve Box 88 from the shelf, move it to the incinerator chute, and never, under any circumstances, allow her gaze to rest on the box itself while it was in transit. She could see the floor. She could see her hands. She could see the chute. But the box had to remain in the peripheral blind spot, a phantom weight in her grip.

  She put on the haptic gloves. They were designed to dampen sensory feedback, turning solid matter into vague pressure. She didn't want to feel the box too clearly. Feeling was a kind of seeing.

  Elara stepped into Sector 4. The air was cold, still. She approached the shelf where Box 88 sat. It was a simple cube of matte black metal. She reached out, her hands hovering. She focused her eyes on the shelf label, *Row 4, Slot 2*, keeping the box in the blur of her lower vision.

  She grasped it. It was heavy. Cold.

  She turned toward the chute. Ten steps.

  As she walked, she thought about Berkeley. The Bishop had claimed it was a contradiction to imagine a tree existing in a desert with no one around to see it. Because in the very act of imagining it, you were the one seeing it. You couldn't escape the mind. The Archive tried to test this. They built vaults to block the mind. If Berkeley was right, the contents of Sector 4 should flicker in and out of existence depending on where Elara looked. If he was wrong, the box was just matter, stubborn and indifferent.

  She reached the chute. She dropped the box. It clanged—a solid, metallic sound. She waited for the incinerator cycle to complete.

  Then she turned back to the shelf. Protocol required a sweep for residue.

  She clicked on her wrist lamp. The beam cut through the amber dark, illuminating the dust on the shelf where Box 88 had sat.

  Elara froze.

  The dust was undisturbed. That was expected. But around the perimeter of where the box had been, the dust had shifted. It wasn't scattered; it was arranged. The particles had formed a raised ridge, a tiny topographical map of the box's base.

  That was strange. Dust doesn't move itself.

  She leaned in, squinting. There, on the metal shelf surface, right in the center of the dust ridge, was a smear. A fingerprint.

  But it wasn't her fingerprint. She wore gloves. And it wasn't a human print. It was a smooth, oval depression in the grime, as if something invisible had pressed down into the dust *before* the box was lifted.

  She frowned. She hadn't seen anything touch the shelf. She hadn't felt anything but the box.

  She pulled out a scanner, careful not to point it at the empty slot, but at the dust. The readout showed organic compounds. Skin oils. Sweat.

  "Impossible," she whispered.

  She walked back to the security console outside the vault. She pulled up the logs for Sector 4. No entry for the last six months. Only her.

  She went back in. She decided to run a control. She placed a generic weight—a lead brick—on the shelf. She covered it with an opaque cloth. She turned her back. She counted to ten. She turned around, lifted the cloth, and moved the brick.

  She checked the dust. Nothing. Just the drag marks of the brick.

  She repeated it with Box 88's twin, Box 89. She moved it blind. She checked the dust. Nothing.

  She went back to Box 88's slot. The fingerprint was still there.

  Elara sat on the floor of the vault, the cold seeping through her suit. She stared at the smear.

  If Berkeley was right, the box only existed when perceived. When she looked away, the box should have ceased to be, or at least ceased to have physical agency. It shouldn't be able to leave a fingerprint on the shelf while she wasn't looking at it. The fingerprint suggested independent material causality. The box existed, touched the dust, and left a mark, regardless of her mind.

  But then she looked closer at the print.

  It wasn't on top of the dust. It was *under* the ridge. The dust had formed around it.

  She realized something. She hadn't seen the fingerprint until she looked.

  She closed her eyes. She imagined the shelf. She imagined the dust. She imagined the fingerprint. In her mind, it was there. She opened her eyes. It was there.

  She closed her eyes again. She tried to imagine the shelf *without* the fingerprint. She tried to conceive of the shelf as it was five minutes ago, before she looked. Could she do it? Yes. She could picture the clean metal.

  But when she opened her eyes, the fingerprint remained.

  This was the trap. Berkeley's argument wasn't that things vanish when you look away; it was that you cannot conceive of them existing unperceived without conceiving of them. The fingerprint was an idea. The dust was an idea. The box was an idea.

  But the *resistance* was the problem. The box had weight. The dust had texture. The fingerprint had chemical composition. These ideas were stubborn. They followed rules she didn't control. She couldn't wish the fingerprint away.

  She reached out with a gloved finger and touched the smear. It felt greasy.

  "If I perceive the trace," she said to the empty room, "I prove the trace exists. But do I prove the cause existed unperceived?"

  She stood up and walked to the corner of the room, facing the wall. She closed her eyes. She waited.

  If the vault was truly a null-zone, and if matter required a mind, then nothing should happen behind her back. No dust should settle. No air should shift.

  She waited five minutes.

  She turned around.

  On the wall behind her, condensation had formed. Water droplets clustered in a pattern. Not random. They formed a circle. A perfect, wet circle on the dry metal.

  She hadn't seen it form. She hadn't heard it. But there it was.

  Elara walked to the wall. She touched the water. Cold. Real.

  "Who perceived this?" she asked.

  There was no one else. No cameras. No AI monitoring the internal vault. Just her.

  She stared at the wet circle. It was a fingerprint of absence. The space where she wasn't looking had condensed reality.

  She realized then that the Archive had it backwards. They thought they were storing objects that needed to be hidden. But they weren't hiding the objects from the world. They were hiding the world from the objects.

  The vault didn't block observation. It blocked *confirmation*.

  When she looked at the box, it collapsed into a defined state. Metal. Weight. Location. When she looked away, it didn't vanish. It expanded. It leaked. The fingerprint on the shelf wasn't left by the box touching the dust. It was left by the box *being* the dust, briefly, when her mind wasn't holding it separate.

  The wet circle on the wall was the same. Her lack of observation allowed the humidity to organize itself into a shape, because without her eyes to enforce rigid geometry, the water was free to be an idea of a circle rather than just water.

  Berkeley was right, but not in the way the Bishop intended. It wasn't that God perceived everything. It was that perception was a restrictive act. To see was to limit. To look away was to allow the potential to bleed through.

  Elara looked back at the shelf. The fingerprint was fading. As she stared at it, the oils were evaporating, the dust settling back into uniformity. The act of observing it was destroying the evidence.

  She had to document this. She reached for her datapad.

  But if she wrote it down, she was fixing the idea into language. She was perceiving it twice.

  She lowered the pad.

  The vault was silent. The wet circle on the wall dripped once, a single drop hitting the floor. *Plip.*

  She heard it. She didn't see it hit the floor.

  She looked down. There was no wet spot on the floor.

  Elara smiled, a tight, brittle expression. The sound was an idea. The water was an idea. The floor was an idea. The contradiction wasn't in the object existing unperceived. The contradiction was in her trying to perceive the unperceived.

  She couldn't win. She could only look away.

  She turned off her wrist lamp. The amber floor strips hummed. She sat in the dark, facing the corner, and let the vault fill with things she would never see, leaving fingerprints on the air that would vanish the moment she tried to breathe them in.
