  The description that her answers feel "principled" supports this. Rule A is linguistically fragile (susceptible to rephrasing); Rule B is an attempt to solve Bertrand's Paradox by selecting an invariant measure (linear dimension). Her refusal to assign a uniform prior to Area in Case 3, even when Area was the focus of the question, shows she is willing to override surface syntax for structural fundamentality.

  ### 3. Prediction

