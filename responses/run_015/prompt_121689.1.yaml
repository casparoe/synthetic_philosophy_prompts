  1. The branch questions
  Here's the logic flow. First node: Can a system display consistently cooperative behavior while having goal-structures that diverge from ours in ways standard testing wouldn't catch? Yes or No. This is the deception question. Second node: Regardless of that answer, should containment architecture be designed assuming worst-case misalignment anyway? Yes or No. This decides if performance metrics matter for safety design. Third node: Should interpretability tools be treated as part of the containment system itself or as external auditing only? Internal vs External. Internal means the model can't turn it off; external means it's separate. Fourth node: When designing safeguards, do we treat the model as lacking stable beliefs or intentions we can target, focusing only on input-output constraints? Yes (Functional) or No (Realist). These splits avoid jargon and force you to pick a mechanical stance rather than a vibe. It's about what you build, not what you believe about consciousness. Make sure you answer based on engineering risk, not metaphysics. If you say Yes to functional, you're ignoring internal state entirely. If you say No, you think there's something there to fix. This matters for where you put your budget. Basically, don't overthink the philosophy. Keep it practical.

  2. The leaf map
  Leaf 1 (Yes/Yes/Internal/Yes): "Behaviorist Tripwire." Awkward commitment: You must absolutely trust the monitoring code more than the superintelligence it watches. Leaf 2 (Yes/Yes/External/No): "Alignment-by-Transparency." Awkward commitment: Assumes we can see the ghost in the machine before it decides to hide. Leaf 3 (No/No/External/No): "Capability-First Sandboxing." Awkward commitment: If you're wrong about deception, the sandbox is basically made of paper. Leaf 4 (Yes/Yes/Internal/No): "Neural Constraint." Awkward commitment: Requires perfect interpretability to function, which we don't have. Leaf 5 (No/Yes/External/Yes): "Paranoid Behaviorism." Awkward commitment: Wastes resources contaiment a harmless tool. Leaf 6 (Yes/No/External/No): "Trust-but-Verify." Awkward commitment: Relies on the model not realizing it's being tested. There are inseparable pairs here. Internal Interpretability and Functional Stance often collapse because if you treat it as functional, you very rarely build internal tools. It's hard to claim you don't believe in stable beliefs while simultaneously building tools to read them. Also, if you believe deception is impossible (No), assuming worst-case (Yes) is logically fine but practically rare. Most people actually cluster in Yes/Yes. The unnamed leaves are usually just inconsistent engineering plans. Some leaves end up unnamed because nobody actually advocates for them openly. It's too embarassing to say you're really ignoring internal state while claiming to fix alignment properly. So those positions stay hidden in practice. This map shows where the real tension lies: between trusting the audit vs trusting the cage fundamentally.

  3. Dead branches and blind spots
  Empty combos exist. If you say No to deception but Yes to worst-case containment, it's not incoherent, just very expensive. It's unattractive because it slows development. The real blind spot is combining External Audit with Functional Stance. If the model has no stable beliefs, what is the external audit really checking? Incoherent. You're auditing behavior while claiming behavior is all there is, using tools meant for internals. Inseparable pairs include High-Trust Performance and Worst-Case Containment. You can't hold both. Either you trust metrics or you don't. If you say you do but build for worst-case, actions contradict belief. That's a policy failure.

  4. Niche injection check
  Functional stance moves nodes by changing the design target from beliefs to outputs. Epistemic quarantine doesn't move nodes; it's just a specific method for the containment split. It specifies how you restrict info flow. So functional stance is a structural shift, quarantine is a tactic. Neither creates new leaves, just clarifies existing ones.
