prompt: |-
  I sit on the steering committee of a twelve-person research collective that funds and occasionally runs small, fast-moving technical projects — the sort where one person with repository access or a modest discretionary budget can, over a weekend, do something whose downside would be borne mostly by people who had no say in it. We had a near-miss last month that ended amicably, and I've been asked to draft a one-page internal norm for our next meeting. I have become fairly convinced by the unilateralist's curse line of argument, and before I commit us to a rule I want to know what should unsettle me. Let me state the package I'm inclined to write down, because I'd rather have it attacked as a whole than in pieces. First: where an action is high-stakes, hard to reverse, and its benefits are not verifiable in advance by others, the very fact that only one person is willing to take it is evidence against taking it — the people who act alone are selected, among other things, for being the ones whose judgement the others don't share, and for being unusually willing to bear risk that falls on other people; so unilateral action in that class has negative expected value even when the actor is personally confident, and the standard remedy — the principle of conformity, in the sense of deferring to the fact that others are unpersuaded — is the right shape of response. Second, my institutional version of that: no member may take such an action without recorded sign-off from at least two others who are not downstream beneficiaries of it, and the sign-off has to be substantive rather than a rubber stamp. Third, and this is the part I added myself: the norm is deliberately one-way. It constrains acting, not refraining. Anyone may always decline, delay, or insist on more process, and my reason is that a duty to act collectively seems to demand a kind of confidence I don't think we have, whereas blocking looks cheap and reversible — a decision not to act can always be revisited, a decision to act often can't.

  What I want is a map of that package's exposure, not a list of objections to some straw version of it. Tell me what would count against the selection argument itself, and specifically which of its assumptions could actually fail in a group like mine: that our errors are partly independent rather than shared (we read the same sources, share a training, and talk to each other constantly, so our mistakes may be correlated in exactly the way that makes extra signatures worthless as filters); that willingness to act is anti-correlated with being right rather than with being conscientious, junior, or simply the person who noticed; that the relevant quantity is expected value at all, rather than something where small probabilities of enormous harm dominate and the aggregation is contested; and any further load-bearing assumption I haven't named. For each, say what we would have to observe — in our own records, in how small groups actually behave, or in the world — for it to fail. Then draw two distinctions sharply. Which of these defeaters would someone who has argued for the unilateralist's curse themselves concede as genuine, and which would they reasonably dismiss as attacking a claim they never made? And: defeaters that should change what I write on the page — the number of sign-offs, whether omissions need sign-off too, whether to weight sign-off by track record, whether to require written reasons, whether to sunset or review the norm — versus defeaters that merely lower my confidence in it. I care much more about the first kind, since I have to produce a document either way.

  Two further things. I want your view on whether my one-way ratchet reintroduces the problem through the back door: if acting is expensive and blocking is free, then the blocker is selected too — for caution, for status-quo bias, for holding a veto that can be traded — and it looks to me as though I may have relocated the curse from the unilateral actor to the unilateral blocker without removing it. Is that a real symmetry or a bogus one, and if it is real, is there any formulation of the norm that isn't hostage to whichever tail of the distribution happens to hold the pen? And I want an honest assessment of whether the position, as I've stated it, risks anything at all: I notice I can always say of a unilateral action that turned out well that it wasn't really in the risk class, and of one that went badly that it confirms the rule. Tell me whether that insulation is legitimate — the mark of a claim about tail risk that has correctly identified its own domain — or whether I've built something I couldn't revise, and if the latter, what would make it revisable. Please rank the defeaters from fatal to merely awkward, answer in British English, and don't give me a reading list or citations: I want arguments, cases, and things I could go and check in our own records, not sources.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Member of a steering committee for a 12-person research collective.
      *   **Context:** Funds/runs small, fast-moving technical projects. High risk of unilateral action causing downside for others (Unilateralist's Curse).
      *   **Task:** Draft a one-page internal norm based on the Unilateralist's Curse argument.
      *   **Proposed Package:**
          1.  *Selection Argument:* Unilateral action in high-stakes/hard-to-reverse/low-verifiability contexts has negative EV because the actor is selected for divergent judgment/risk tolerance. Remedy: Conformity/deference.
          2.  *Institutional Rule:* No such action without recorded sign-off from $\ge$ 2 others (not downstream beneficiaries), substantive not rubber-stamp.
          3.  *One-Way Ratchet:* Constrains acting, not refraining. Blocking is cheap/reversible; acting is expensive/irreversible.
      *   **Specific Questions:**
          1.  Map the package's exposure (what could go wrong with the underlying assumptions?).
          2.  Identify load-bearing assumptions (independence of error, correlation of willingness/rightness, EV vs. Tail Risk, etc.).
          3.  For each assumption, specify what observation would falsify it (in their records, group behavior, or the world).
          4.  Distinguish between defeaters a proponent of the Unilateralist's Curse would concede vs. dismiss.
          5.  Distinguish between defeaters that require changing the text vs. those that just lower confidence.
          6.  Assess the "One-Way Ratchet" (does it shift the curse to the blocker?).
          7.  Assess the risk of insulation/unfalsifiability (is the claim robust or immune to revision?).
          8.  Rank defeaters from fatal to awkward.
          9.  **Constraints:** British English, no reading list/citations, focus on arguments/cases/checks.

  2.  **Deconstruct the Proposed Package & Identify Assumptions:**

      *   *Assumption 1: Error Independence.* The logic relies on the idea that if 11 people say "no" and 1 says "yes", the 1 is likely wrong *because* the others agree. This requires their errors to be somewhat independent. If they all read the same sources and share training, errors are correlated.
      *   *Assumption 2: Willingness $\neq$ Competence.* The argument assumes willingness to act alone correlates with poor judgment or excessive risk tolerance regarding others' costs. It might correlate with noticing a niche opportunity others missed.
      *   *Assumption 3: EV Aggregation.* The argument assumes we can sum expected values. If the downside is existential or catastrophic (tail risk), standard EV might not apply, or the "curse" logic might be too weak.
      *   *Assumption 4: The Ratchet Symmetry.* The user worries blocking is also a unilateral veto. Is blocking truly reversible? Is caution always better?
      *   *Assumption 5: Falsifiability.* Can the rule be proven wrong, or is it self-sealing?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Set the tone (analytical, direct, British English).
      *   **Part 1: Map of Exposure (The Assumptions & Falsification Conditions):**
          *   *Independence of Error:* If the group is an echo chamber, 11 "no"s count for less. *Check:* Look at past decisions where the minority was right. Were they using different data or just interpreting shared data differently?
          *   *Selection on Willingness:* Is the unilateralist reckless or just attentive? *Check:* Review the "near-miss." Was the actor negligent or uniquely informed?
          *   *EV vs. Tail Risk:* Is the harm truly bounded? *Check:* Define "high-stakes." If the downside is collective ruin, the curse argument is too weak; you need a veto, not just sign-off.
          *   *Cost of Delay:* The rule assumes delay is cheap. *Check:* Measure opportunity cost of blocked projects.
      *   **Part 2: Concede vs. Dismiss (The Bostrom/Ord Perspective):**
          *   *Concede:* Correlated errors (they acknowledge epistemic independence is required). High opportunity costs of delay (they care about good outcomes, not just safety).
          *   *Dismiss:* "Willingness implies competence" (they argue the structural incentive problem outweighs individual virtue). "EV is wrong" (the curse is *about* managing tail risks via epistemic humility).
      *   **Part 3: Text Changes vs. Confidence Lowering:**
          *   *Text Changes:* Correlated errors $\rightarrow$ Require diverse signatories (not just any 2). Opportunity cost $\rightarrow$ Time limits on sign-off. Tail risk $\rightarrow$ Higher threshold than 2.
          *   *Confidence Only:* General scepticism about group rationality.
      *   **Part 4: The One-Way Ratchet (Blocker's Curse):**
          *   *Analysis:* It is a real symmetry. A unilateral blocker can stall valuable work.
          *   *Nuance:* Acting is often *more* irreversible than blocking. But blocking can kill momentum permanently.
          *   *Fix:* Sunset clauses on objections. "Objection requires alternative proposal" or "Objection expires in 48h unless escalated."
      *   **Part 5: Insulation & Falsifiability:**
          *   *Risk:* The rule is self-sealing if "high-stakes" is defined post-hoc.
          *   *Fix:* Pre-define the class of actions (e.g., budget > £X, repo access to production).
          *   *Revisability:* Schedule a review in 6 months.
      *   **Part 6: Ranking Defeaters:**
          *   *Fatal:* Correlated errors (makes sign-off useless), Unreversible blocking (ratchet fails).
          *   *Awkward:* Opportunity costs, Definition of "substantive."

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Tone Check:* Ensure it sounds like a peer review, not a lecture. Use British spelling (organisation, programme, centre, etc.).
      *   *Constraint Check:* No citations. Focus on *what to observe*.
      *   *Specific Question:* "What would count against the selection argument itself?" Need to be precise here. The selection argument says "Unilateralists are selected for bad traits." Counter: "Unilateralists are selected for high variance/high insight."
      *   *Specific Question:* "Is the insulation legitimate?" Need to address the "No True Scotsman" risk regarding the risk class.
      *   *Specific Question:* "Rank the defeaters." Need a clear list at the end or integrated clearly. Let's integrate into the analysis and summarize at the end for clarity.

  5.  **Final Polish:**

      *   Check the "One-Way Ratchet" analysis. Is it truly symmetric? Acting changes the state of the world. Blocking maintains the status quo. The asymmetry lies in the *irreversibility*. I need to highlight that the user's justification ("decision not to act can always be revisited") is the weak point. Sometimes opportunities are time-sensitive.
      *   Check the "Sign-off" mechanism. If errors are correlated, getting 2 signatures from the same pool doesn't help. Need to suggest *diverse* signatories.
      *   Check the "Unilateralist's Curse" origin (Bostrom/Ord). They focus on *normative* conformity, not just procedural. The user is making a procedural fix for a normative problem. Does that work? Yes, if the procedure forces the normative check.

  6.  **Final Review against constraints:**
      *   British English? Yes.
      *   No citations? Yes.
      *   Rank defeaters? Yes.
      *   Address the ratchet? Yes.
      *   Address falsifiability? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated proposal that correctly identifies the structural incentives at play in small, high-trust collectives. However, your confidence in the selection argument rests on epistemic assumptions that often fail in precisely the sort of homogeneous, high-communication groups you describe. Below is a map of the exposure, an assessment of the ratchet, and a ranking of the defeaters.

  ### 1. Map of Exposure: Assumptions and Falsification Conditions

  Your selection argument relies on four load-bearing assumptions. For each, I have listed what observation would cause it to fail in your specific context.

  **Assumption A: Epistemic Independence**
  *   **The Claim:** The judgement of the eleven non-actors provides independent evidence against the action.
  *   **The Exposure:** In a twelve-person collective with shared training, sources, and constant communication, errors are likely highly correlated. If you all read the same papers and discuss the same risks, you share the same blind spots. The unilateralist may not be 'reckless'; they may simply be the only one who noticed a variable the group's shared mental model filters out.
  *   **Falsification Condition:** Check your records for the last three years. Identify decisions where the consensus was wrong or where a 'maverick' view (even if not acted upon) was later vindicated by external events. If the group's errors cluster around specific types of technical or strategic blind spots, the 'two signatories' rule adds no information; it merely confirms the shared bias.

  **Assumption B: Willingness is Anti-Correlated with Competence**
  *   **The Claim:** Those willing to act alone are selected for poor judgement or excessive risk tolerance regarding others' costs.
  *   **The Exposure:** Willingness to act alone may be correlated with *responsiveness*. In fast-moving technical environments, the person who notices a fleeting opportunity or a critical vulnerability is often the only one with the context to act. Requiring sign-off forces them to educate others, which consumes the very time that made the action valuable.
  *   **Falsification Condition:** Measure the 'time-to-decision' for recent projects. Compare this against the 'value-capture' (e.g., grants won, bugs fixed, papers published). If projects that moved fastest (often unilaterally) have a higher success rate than those that went through consensus, the selection argument is reversing the causality: it isn't that reckless people act alone, but that valuable opportunities require speed that consensus destroys.

  **Assumption C: Reversibility of Inaction**
  *   **The Claim:** 'Blocking looks cheap and reversible — a decision not to act can always be revisited.'
  *   **The Exposure:** This is the weakest link. Opportunities are often time-sensitive. A unilateral blocker does not preserve the status quo; they consume the option value of the moment. If the window closes, the 'decision not to act' is as permanent as a failed action.
  *   **Falsification Condition:** Look for 'ghost projects' — ideas that were discussed, blocked or delayed for process, and then became impossible or irrelevant due to external changes (competitor action, policy shifts, funding windows). If the cost of these missed windows exceeds the cost of the 'near-miss' you recently had, the asymmetry you posit is false.

  **Assumption D: Aggregation of Expected Value**
  *   **The Claim:** We are managing expected value where small probabilities of harm can be weighed against benefits.
  *   **The Exposure:** If the downside is existential to the collective (e.g., legal liability that shuts you down, reputational ruin), standard EV aggregation fails. The 'curse' argument is actually too weak for true tail risks; it argues for caution, not for a hard stop. Conversely, if the harms are trivial, the rule creates bureaucratic drag without safety gain.
  *   **Falsification Condition:** Define 'high-stakes' explicitly. If you cannot define it *ex-ante* (e.g., 'spending over £5k', 'deploying to production'), the rule is unenforceable. If you define it too broadly, you paralysed the group. If the 'near-miss' was actually low-stakes but felt high-stakes due to anxiety, your risk calibration is off.

  ### 2. Concede vs. Dismiss: The Proponent's View

  A proponent of the unilateralist's curse (e.g., Bostrom or Ord) would draw the line as follows:

  **They Would Concede:**
  *   **Correlated Errors:** They acknowledge that the force of the argument diminishes as group homogeneity increases. They would agree that if the group is an echo chamber, the 'wisdom of the crowd' premise fails.
  *   **Opportunity Costs:** They accept that excessive caution has a cost. The curse is about *uncoordinated* action causing harm, not about preventing all action. If the rule stifles the collective's primary mission, it is self-defeating.

  **They Would Dismiss:**
  *   **'Willingness implies Insight':** They would argue that even if the unilateralist is right, the *normative* issue remains: you cannot impose risk on others without their consent. The correctness of the outcome does not justify the procedure. They would view 'speed' as a benefit to the group, but not a justification for bypassing the risk-bearing veto.
  *   **'EV is Contested':** They would argue this is precisely why the rule is needed. When probabilities are contested, the default must be inaction to prevent the most optimistic (or least risk-averse) person from setting the trajectory for everyone.

  ### 3. Text Changes vs. Confidence Lowering

  Some defeaters require you to rewrite the norm; others merely suggest you should worry while implementing it.

  **Requires Text Changes:**
  *   **Correlated Errors:** If your group is homogeneous, requiring 'any two' signatories is useless.
      *   *Change:* Require signatories from *distinct sub-teams* or with *different areas of expertise*. Or, require a 'devil's advocate' statement rather than simple sign-off.
  *   **Reversibility of Inaction:** If blocking is effectively permanent due to time-sensitivity.
      *   *Change:* Implement a 'sunset' on objections. An objection must be accompanied by a proposed review date or an alternative path. If the objector cannot engage substantively within 48 hours, the veto lapses.
  *   **Insulation/Unfalsifiability:** If 'high-stakes' is defined post-hoc.
      *   *Change:* Define the 'Risk Class' numerically or categorically in the document (e.g., 'Any action exposing the collective to >£X liability or public-facing deployment').

  **Merely Lowers Confidence:**
  *   **General Scepticism:** The worry that any rule can be gamed by social dynamics (e.g., trading favours for signatures). You cannot legislate this away, only monitor it.
  *   **The 'Right' Unilateralist:** The possibility that a future genius will be hamstrung. You must accept this trade-off explicitly.

  ### 4. The One-Way Ratchet: Symmetry or Bogus?

  Your intuition is correct: **this is a real symmetry, not a bogus one.** You have relocated the curse from the unilateral actor to the unilateral blocker.

  *   **The Symmetry:** Just as a unilateral actor imposes risk on the group, a unilateral blocker imposes opportunity costs on the group. Both appropriate the collective's agency for their own risk assessment (one risk-averse, one risk-tolerant).
  *   **The Asymmetry:** The justification for the ratchet rests on the claim that *action* is harder to reverse than *inaction*. In technical systems, this is often true (data leaks cannot be un-leaked). However, in research and strategy, *inaction* is often irreversible (a missed publication window, a failed grant cycle).
  *   **The Fix:** Do not rely on the asymmetry of reversibility. Rely on the asymmetry of **burden of proof**.
      *   *Formulation:* 'Action requires positive justification (sign-off). Inaction requires no justification *unless* it blocks a pre-approved roadmap item.'
      *   *Better Formulation:* 'Objections must be actionable.' A blocker cannot simply say "no"; they must say "no, because X, unless Y is done." This prevents status-quo bias from becoming a veto without cost.

  ### 5. Insulation and Falsifiability

  You asked whether your position risks being self-sealing (claiming success as 'not high-stakes' and failure as 'confirmation').

  *   **The Risk:** Yes, this is a significant risk. If 'high-stakes' is not operationally defined, the norm is unfalsifiable. You will inevitably classify successful unilateral actions as 'low risk' in hindsight to avoid cognitive dissonance.
  *   **Is it Legitimate?** It is legitimate only if the domain is defined *ex-ante*. If you define the domain by the *nature of the action* (e.g., 'access to production database'), it is robust. If you define it by the *outcome* (e.g., 'actions that could have caused harm'), it is circular.
  *   **Making it Revisable:** You must include a **Review Clause**. 'This norm expires in 12 months unless renewed by the committee.' During that year, you must log every instance where the norm was invoked. At the review, you ask: 'Did this prevent harm? Did this prevent value?' If you cannot answer those questions with data, the norm is dogma.

  ### 6. Ranking of Defeaters

  I have ranked these from Fatal (requires abandoning or fundamentally rewriting the norm) to Awkward (requires mitigation but the norm stands).

  1.  **Fatal: Correlated Errors.** If your twelve members share the same blind spots, the 'two signatories' rule provides a false sense of security. It filters for conformity, not safety.
      *   *Remedy:* Require diverse signatories or external review for the highest risk class.
  2.  **Fatal: Irreversible Inaction.** If the 'one-way ratchet' allows a single cautious member to kill time-sensitive opportunities permanently, you have not solved the coordination problem; you have merely biased it towards stagnation.
      *   *Remedy:* Time-limited vetoes.
  3.  **Critical: Undefined Risk Class.** If 'high-stakes' is not defined objectively, the rule will be applied inconsistently and will be unfalsifiable.
      *   *Remedy:* Hard thresholds (budget, access levels, public visibility).
  4.  **Awkward: Social Trading.** Members may trade signatures ('I'll sign yours if you sign mine'), rendering the check performative.
      *   *Remedy:* Require written reasons for sign-off, auditable later.
  5.  **Awkward: Opportunity Cost.** The drag on speed may be higher than the risk of the 'near-miss'.
      *   *Remedy:* Monitor velocity metrics during the review period.

  ### Summary Recommendation

  Your draft is philosophically sound but institutionally fragile. The 'one-way ratchet' is the most dangerous element because it assumes time is on your side. To make this robust:

  1.  **Define the Risk Class objectively** (budget, access, publicity) to prevent hindsight bias.
  2.  **Diversify the Signatories** to mitigate correlated error.
  3.  **Time-limit the Veto** to prevent the blocker's curse from killing opportunity.
  4.  **Sunset the Rule** in 12 months to force a data-driven review of whether it prevented harm or merely slowed you down.

  If you do not make these changes, you risk creating a bureaucracy that protects you from the last disaster while leaving you vulnerable to the next one: stagnation.
