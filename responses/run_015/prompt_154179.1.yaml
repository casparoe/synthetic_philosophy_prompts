      *   **Round 1: The Nature of the Future (Ontology vs. Epistemology):**
          *   Elena: It's about the logical relation between evidence and hypothesis. Some things simply *cannot* be numbered. The "weight" of evidence matters.
          *   Marcus: But "weight" is just confidence in the prior. We can model confidence. Ambiguity aversion (Ellsberg style) handles this.

      *   **Round 2: Weight of Argument:**
          *   Elena: You're missing the point. Weight isn't confidence in a number; it's the completeness of the evidence set. If the set is ontologically incomplete, no number exists.
