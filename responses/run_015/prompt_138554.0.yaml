  **Note on the Poem**

  **Commitment:** I committed to the ontological reading: that the loops reveal something about time itself (its ideality), not merely that the mathematics permits odd geometries. The poem treats the return not as a technical feat but as a revelation of stasis ("There was no yesterday," "I stood upon the spot I stood"). The form enforces this by making the final line identical to the first, not as a resolution, but as a trap: the journey ends where it began because "beginning" and "ending" are coordinates, not events.

  **Physics Simplifications:** The poem simplifies the "dust" into a visible landscape ("The dust lay where it lay") and the geodesic into a "road." It also treats the "light cones" as visible objects ("The light leaned over") rather than causal boundaries. These are necessary for the imagery but technically imprecise.

  **Your Summary:** Your understanding is robust, but one nuance: you mention an "axis they turn around." In Gödel's solution, the universe is homogeneous; there is no unique center or axis. Every point can be treated as the center of rotation. The tipping of the cones happens everywhere relative to the matter, not just at a distance from a specific core.

  **Form Trade-offs:** The rhyme pair "time/crime" is the weakest link; "crime" is used to avoid sloganizing about morality or paradox, but it risks sounding colloquial. Additionally, to satisfy your constraint that the last line must be the first line again, the final stanza repeats the opening line as both the second and fourth line. This breaks the strict pantoum rule where the final stanza usually interleaves the first stanza's lines differently, but it tightens the loop to match the Closed Timelike Curve.
