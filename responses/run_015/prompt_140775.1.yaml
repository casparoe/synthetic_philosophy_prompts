prompt: |-
  I'm the only trained archivist at a mid-sized city records office, and twice a year I run appraisal: roughly thirty offers and transfers per cycle, half a day each, and way more material than our shelves can hold. A five-person volunteer board has to sign off, I file a one-page justification for every accept or decline, and the state retention schedules set a floor for government records but say nothing about donated personal papers. I have no budget for outreach and no time to read theory.

  Its not enough to be told that the archive is a product of power and that its silences are structured rather than accidental. I cant hand that sentence to a new hire or paste it into the appraisal manual. Turn it into a procedure I can actually run in half a day: the questions in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it hands the decision to a person because the question is one of values rather than facts.

  Two things I specifically want handled. First, a test for what kind of gap I'm looking at — stuff that was never created in the first place, stuff that was created and then destroyed or weeded, and stuff that exists but sits in someones attic or in another institution — because those seem to call for different responses and I keep conflating them. Second, a correction for what a colleague of mine calls the paper-trail gradient: the volume of documentation about a group tracks how closely that group was administered, not how much was actually going on, so a collections bulk is really evidence about the record-keeper. Should the procedure deliberately over-collect from the least-administered people, and how do I decide when enough is enough?

  Be straight about which steps are genuine tests and which are judgment calls dressed up as procedure. Then run it on three offers from this cycle: (a) about thirty linear feet of a housing departments tenant complaint and violation files, 1978–2015, with names, addresses and unit numbers; (b) one donated box of photocopied flyers, handwritten meeting notes and a membership list from a tenants association in those same buildings in those same decades; (c) the sheriffs office arrest ledgers and mugshots for a neighborhood that was demolished in the 1970s, which are basically the only surviving trace of the people who lived there. I will not like whatever it says about (c), so say it plainly. And tell me what the procedure cant do — especially where it cant tell me what a community actually wants without me going and asking them.
reasoning: |-
  Here's a thinking process that leads to the suggested appraisal procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Solo trained archivist at a mid-sized city records office.
      *   **Constraints:** High volume (30 offers/transfers per cycle, 2x/year), time-poor (half-day per appraisal), space-poor (shelves full), no outreach budget, no time for theory.
      *   **Governance:** 5-person volunteer board needs sign-off, requires one-page justification per decision.
      *   **Regulatory:** State retention schedules cover gov records (floor), but *not* donated personal papers.
      *   **Philosophical Stance:** Acknowledges archival power dynamics/silences but finds abstract theory useless for daily workflow. Wants actionable procedure.
      *   **Specific Requests:**
          1.  Distinguish types of gaps (never created, destroyed/weeded, existing elsewhere).
          2.  Address the "paper-trail gradient" (admin volume $\neq$ community activity). Should we over-collect from the less administered?
          3.  Differentiate between genuine tests and judgment calls.
          4.  Apply to three specific scenarios (a, b, c).
          5.  Be blunt about scenario (c).
          6.  Acknowledge limitations (can't know community wants without asking).

  2.  **Deconstruct the Problem:**
      *   The core tension is between *efficiency* (half-day appraisal) and *ethics* (addressing silences, power dynamics).
      *   Standard appraisal (provenance, original order, retention schedules) is too rigid for the "silences" problem.
      *   Radical appraisal (documenting the marginalized) is too time-consuming for a solo archivist with no outreach budget.
      *   Need a "Triage Protocol" that embeds ethical questions into a checklist format suitable for a one-page justification.

  3.  **Drafting the Procedure (The "Gap & Gradient" Protocol):**
      *   *Goal:* A flowchart-style checklist that fits on a page or two.
      *   *Structure:*
          *   Phase 1: The Hard Stops (Legal/Space/Condition).
          *   Phase 2: The Gap Test (Addressing Request 1).
          *   Phase 3: The Gradient Correction (Addressing Request 2).
          *   Phase 4: The Decision Point (Board vs. Archivist).
      *   *Distinguishing Tests vs. Judgments:* I need to explicitly label these. Tests = verifiable facts. Judgments = value-based decisions.

      *   *Refining the Gap Test:*
          *   Type A: Never Created (Structural Silence). Action: Document the silence, maybe seek oral history if possible (but user has no budget).
          *   Type B: Destroyed/Weeded (Archival Violence). Action: Investigate *why*. If malicious/illegal, keep evidence of destruction if possible.
          *   Type C: Elsewhere (Dispersed). Action: Coordinate? Or accept if it adds context?
          *   *Constraint:* User can't spend weeks researching this. The test must be based on *what is in front of them* + *basic knowledge of the function*.

      *   *Refining the Gradient Correction:*
          *   Premise: High volume = High surveillance/admin. Low volume = Low surveillance.
          *   Strategy: "Weighted Value." A box of marginalized voices counts more than a box of admin forms.
          *   Mechanism: "The Counter-Weight Rule." If the creator was subject to high administration (police, housing authority), lower the threshold for acceptance of *their* own records. If the creator *was* the administration, raise the threshold (strict retention schedule).

  4.  **Developing the Scenarios:**
      *   *(a) Housing Dept Complaint Files (30 linear feet):* High volume, Gov record, PII (names/addresses).
          *   *Analysis:* Retention schedule likely applies. Privacy issues. High "admin" gradient.
          *   *Verdict:* Likely Decline or Sample. Too big, privacy risk, duplicates the "admin" narrative.
      *   *(b) Tenant Association Papers (1 box):* Low volume, Community record, Same context as (a).
          *   *Analysis:* Low "admin" gradient. Counter-weight to (a). Fills the "Never Created" gap in the official record.
          *   *Verdict:* Accept. High value per inch.
      *   *(c) Sheriff Arrest Ledgers/Mugshots (Demolished Neighborhood):* High sensitivity, Vulnerable subjects, Only trace.
          *   *Analysis:* This is the trap. It documents police action (admin gradient), but it's the *only* record of the people (Gap Type A/B).
          *   *Ethical Conflict:* Preserving history vs. Perpetuating surveillance stigma.
          *   *Verdict:* The "Hard Truth." Keeping this reinforces the police narrative. But destroying it erases the people.
          *   *Procedure Output:* The procedure should flag this as a "Values Judgment." It cannot solve the ethics of surveillance archives alone.
          *   *User Warning:* "I will not like whatever it says about (c)." I need to be direct. The procedure likely says "Decline" or "Refer" because of the harm potential, *unless* there is a specific community partnership (which the user said they don't have time/budget for). I must admit the procedure fails here without community input.

  5.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the constraints. No fluff.
      *   **The Protocol:** Step-by-step. Label [TEST] vs. [JUDGMENT].
      *   **The Gap Taxonomy:** Define the three gaps clearly.
      *   **The Gradient Correction:** Explain the weighting system.
      *   **Scenario Run-Through:** Apply the protocol to a, b, c.
      *   **The Limitations:** Explicitly state where the procedure breaks (specifically regarding community consent).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too theoretical?
      *   *Fix:* Make the checklist binary where possible (Yes/No).
      *   *Critique:* Did I answer the "over-collect" question?
      *   *Fix:* Yes, in the Gradient Correction step. Explicitly state: "If Creator = Administered, lower volume threshold."
      *   *Critique:* Scenario (c) needs to be handled carefully.
      *   *Fix:* Don't soft-pedal. If the procedure is ethical, it must recognize that mugshots of a demolished neighborhood are often harmful. But if it's the *only* record, destruction is also violence. The honest answer is: "This procedure cannot clear this record without community consultation." I need to make sure I don't give a false "Accept" recommendation.
      *   *Critique:* The user asked for a procedure they can run in half a day.
      *   *Fix:* Ensure the "Research" steps in the protocol are limited to "Read the finding aid" or "Check the retention schedule," not "Conduct oral histories."

  7.  **Final Polish:**
      *   Tone: Professional, direct, empathetic to the workload, unflinching on ethics.
      *   Formatting: Use bolding, lists, and clear headers for scanability.
      *   Check against constraints: One-page justification support? Yes, the protocol generates the justification points.

  8.  *(Self-Correction on Scenario C)*: The prompt says "I will not like whatever it says about (c), so say it plainly."
      *   If I say "Accept," I risk perpetuating surveillance.
      *   If I say "Decline," I risk erasing the only trace of a demolished community.
      *   *The Procedure's Answer:* It flags this as a **STOP**. It requires a [JUDGMENT] that the procedure cannot make. It forces the Archivist to admit: "I cannot appraise this without community input."
      *   *Wait, looking closer:* The user has *no budget for outreach*. So the procedure *must* account for that. If the procedure says "Ask them," it's useless.
      *   *Revised Strategy for (c):* The procedure should lean towards **Decline/Refer** if the harm (surveillance) outweighs the informational value, *unless* the archivist can restrict access. But restrictions take time to manage.
      *   *Honest Truth:* The procedure reveals that accepting (c) is an act of power *by the archive*. It preserves the Sheriff's gaze. The "plain truth" is that without community partnership, this collection is likely toxic. I will write that.

  9.  **Finalizing the Text:** (Drafting the response based on these thoughts.)
      *   Start with the Protocol.
      *   Define the Gap Types.
      *   Define the Gradient Weighting.
      *   Run the scenarios.
      *   End with the Limitations.

  *(Self-Correction during drafting the "Gap" section)*: Make sure the distinction between "Never Created" and "Destroyed" is clear. "Never Created" = The system didn't care to record it. "Destroyed" = The system recorded it then hid/killed it. This matters for the justification.

  *(Self-Correction during drafting the "Gradient" section)*: How to operationalize "over-collect"? It means accepting smaller, fragmentary collections from marginalized groups that would be rejected if they came from City Hall. I need to make that a explicit rule: "The Fragment Rule."

  Okay, ready to write.
answer: |-
  Here is a functional appraisal protocol designed for your constraints: solo archivist, high volume, space scarcity, and a volunteer board. It converts archival theory into a binary checklist that generates the text for your one-page justifications.

  ### The "Gap & Gradient" Appraisal Protocol
  **Time limit:** 30 minutes per offer.
  **Output:** A completed checklist serves as the draft for your one-page justification.

  #### Phase 1: The Hard Stops (Tests)
  *If any answer is NO, the offer is Declined. No board vote needed.*

  1.  **Legal Authority:** Do we have the legal right to hold this (deed of gift or transfer order)? **[TEST]**
  2.  **Physical Capacity:** Do we have shelf space for the *entirety* of the offer without weeding? **[TEST]**
  3.  **PII/Privacy:** Does the collection contain unredacted sensitive data (SSN, medical, active juvenile records) that we lack resources to redact? **[TEST]**
  4.  **Retention Compliance:** For government records: Does this meet or exceed the State Retention Schedule minimum? **[TEST]**

  #### Phase 2: The Gap Taxonomy (Judgment)
  *Identify the type of silence this collection addresses. Select one. This determines the "Value Weight."*

  *   **Type A: Structural Silence (Never Created).** The function existed, but the system did not record it. (e.g., informal community mutual aid, domestic life of public housing tenants).
  *   **Type B: Archival Violence (Destroyed/Weeded).** Records were created but systematically removed or destroyed by the institution. (e.g., purged complaint files, lost arrest logs).
  *   **Type C: Dispersed Holdings (Exists Elsewhere).** Records exist but are held by another institution or private individual. (e.g., duplicate reports, personal copies of public records).

  **Rule:** Type A gets **High Weight**. Type B gets **Medium Weight** (requires context on *why* destroyed). Type C gets **Low Weight** (accept only if it adds unique annotation).

  #### Phase 3: The Paper-Trail Gradient Correction (Judgment)
  *This corrects for the fact that volume $\neq$ value.*

  **The Question:** Was the creator the **Administrator** (City Dept, Police, Agency) or the **Administered** (Tenants, Residents, Arrested Persons)?

  *   **If Administrator:** Apply **Strict Volume Control**. Accept only if it documents policy shifts or unique functions. Routine transactions must be sampled or declined.
  *   **If Administered:** Apply **The Fragment Rule**. Accept small, fragmentary, or disorganized collections that would be rejected from an Administrator. A single box of administered voices is worth ten boxes of administrative forms.

  **The Decision Threshold:**
  *   **Administrator + Type C Gap:** Decline (Redundant noise).
  *   **Administrator + Type A/B Gap:** Sample (Keep 5-10%).
  *   **Administered + Type A Gap:** Accept (Even if small/messy).
  *   **Administered + Type B Gap:** **STOP.** (See Phase 4).

  #### Phase 4: The Values Stop (Judgment Call)
  *The procedure cannot calculate harm. If you hit this, the decision goes to the Board with a specific warning.*

  **Trigger:** Does the collection document trauma, surveillance, or illegal activity involving vulnerable populations (e.g., mugshots, welfare investigations, immigration raids) where the subjects cannot consent?

  *   **Action:** Do not appraise based on "historical value." Appraise based on "potential harm."
  *   **Procedure:** Mark as **Deferred**. Justification must read: *"Collection preserves institutional gaze over vulnerable subjects. Retention requires community consultation which is currently beyond capacity. Risk of harm outweighs research value without partnership."*

  ---

  ### Running the Protocol on Your Cycle

  Here is how the protocol processes your three specific offers.

  #### (a) Housing Dept Tenant Complaint Files (30 linear feet, 1978–2015)
  *   **Phase 1:** Passes Legal/Space (assuming you clear shelf space). **Privacy Check:** Contains names/addresses. **FAIL.** (Unless you have budget to redact, this is a Hard Stop).
  *   **Phase 2:** **Type C Gap.** The complaints exist in the files, but the *outcome* or the *tenant voice* is often filtered through the inspector's pen.
  *   **Phase 3:** **Administrator.** Strict Volume Control applies. 30 feet is too high for routine complaints.
  *   **Phase 4:** No specific trauma trigger beyond standard privacy.
  *   **Verdict:** **DECLINE.**
  *   **Justification Draft:** *"Records fall under State Retention Schedule [Cite Code]. Volume exceeds storage capacity. Contains unredacted PII (names/addresses) requiring resources not available. As administrative records, they document the Department's activity, not the tenants' lives. Recommend transfer to Records Center for retention period, then destruction."*

  #### (b) Tenant Association Papers (1 box, flyers, notes, membership list)
  *   **Phase 1:** Passes Legal/Space/Privacy.
  *   **Phase 2:** **Type A Gap (Structural Silence).** The official record (a) shows the city acting *on* the building. This record shows the people living *in* the building organizing. This silence is structural; the city never intended to save these.
  *   **Phase 3:** **Administered.** Apply **Fragment Rule**. 1 box is small, but because they are the administered, the value per inch is high. It counter-weights offer (a).
  *   **Phase 4:** No trauma trigger.
  *   **Verdict:** **ACCEPT.**
  *   **Justification Draft:** *"Collection documents community response to housing conditions, filling a Structural Silence (Type A) in the official record. Creator status is 'Administered,' invoking the Fragment Rule; low volume is acceptable due to high evidential value of tenant agency. Complements but does not duplicate Housing Dept files."*

  #### (c) Sheriff Arrest Ledgers & Mugshots (Demolished Neighborhood, 1970s)
  *   **Phase 1:** Passes Legal/Space. **Privacy:** Mugshots of deceased persons? Likely pass, but ethically fraught.
  *   **Phase 2:** **Type B Gap (Archival Violence/loss).** The neighborhood is gone. The houses are gone. These records are the only trace. However, they were created by the Sheriff (Administrator).
  *   **Phase 3:** **Administrator.** Strict Volume Control suggests declining. **BUT**, the "Demolished Neighborhood" factor creates a conflict. The people are the Administered, but the *records* are the Sheriff's.
  *   **Phase 4:** **VALUES STOP.** This triggers the Harm Protocol. These records document state surveillance of a specific community that no longer exists to consent. Keeping them preserves the Sheriff's gaze as the primary history of that neighborhood.
  *   **Verdict:** **DEFER / DECLINE.** (I am telling you plainly: The procedure says you cannot ethically accept this without community input).
  *   **Justification Draft:** *"Collection represents the sole surviving record of a demolished community, creating high research demand. However, records document police surveillance (mugshots/ledgers) of vulnerable subjects. Retention perpetuates the institutional gaze as the primary historical narrative. As we lack capacity for community consultation regarding access and context, the risk of harm to descendant communities outweighs the archival value. Declined pending partnership opportunity."*

  **The Hard Truth about (c):** You want to save the history of the people. But these records do not contain the history of the people; they contain the history of the police *looking at* the people. By accepting them as the "only trace," you cement the police ledger as the tombstone for that neighborhood. The procedure forces you to admit that without money for outreach, you are not the right steward for this material.

  ---

  ### What This Procedure Cannot Do

  You asked for straight talk on limitations. Here is where this checklist fails you:

  **1. It cannot validate "Community Want."**
  The protocol assumes that "Administered" voices are inherently valuable. Sometimes they are not. Sometimes a tenant association was exclusionary, racist, or unrepresentative. The protocol tells you to accept (b) because it *looks* like resistance. It cannot tell you if the neighbors actually want those flyers preserved. Without a budget for outreach, you are guessing what the community values. You are still imposing power, just a different flavor of it.

  **2. It cannot solve the "Type B" Ethics.**
  In scenario (c), the protocol identifies the harm but offers no solution other than "Don't do it." If you decline (c), and no one else takes it, it gets shredded. The procedure protects *your* ethics, but it does not save the record. It prioritizes "Do No Harm" over "Preserve Everything." You have to be okay with the possibility that the record is lost because keeping it was unethical.

  **3. It relies on your ability to spot the "Administrator."**
  The Gradient Correction works only if you correctly identify who held the power. In complex partnerships (e.g., a city-funded non-profit), the line blurs. If you misidentify the power dynamic, you misapply the Volume Control. This is a [JUDGMENT] call disguised as a [TEST]. If you are tired or rushed, you will default to accepting the big, boxed, official-looking records (Administrator) and rejecting the messy bags (Administered).

  **4. It does not generate funding.**
  The procedure will consistently tell you to accept the high-labor, high-value marginalized records (like b and c) and reject the low-labor administrative records (like a). This increases your processing backlog. It makes your job harder. It is an ethical workflow, not an efficient one. It proves you are under-resourced, but it does not fix the resource gap.

  ### Summary for the Board
  When you present these decisions, use the language from the protocol. It shifts the debate from "Do we like this?" to "Does this meet the Gap and Gradient criteria?"

  *   **Reject (a)** because it is **Administrator + High Volume + PII**.
  *   **Accept (b)** because it is **Administered + Structural Silence + Fragment Rule**.
  *   **Reject (c)** because it is **Surveillance Material + No Consent Mechanism**.

  This allows you to defend the "silences" in your collection not as accidents, but as procedural choices.
