      *   *Category 2: Universal Altruism (Sacrificing for strangers/out-groups).* Secular humanism often excels here because it's based on universal rights rather than doctrinal boundaries. Religion can be parochial.
      *   *Category 3: Institutional Trust/Compliance (Paying taxes, following rules).* This is the crux of the "high trust society" argument. Is it God or is it rule of law/culture?

  3.  **Evaluate the "Religious Leftovers" Argument:**
