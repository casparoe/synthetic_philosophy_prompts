      *   *Decision:* I will argue that **secular civic infrastructure is more sustainable for modern, pluralistic "goodness" than religious belief alone.** Religion *can* generate social capital, but it's the *social capital* (the gathering), not the *theology* (the God), that drives the benefit. Therefore, the friend is wrong that religion *itself* is the necessary ingredient; the community aspect is, and that can be secularized.
      *   *Refinement:* To be decisive, I'll argue that **secular frameworks are more robust for defining "better" in a diverse world,** while acknowledging religion is a potent *tool* for community, not the *source* of morality. Actually, looking at the prompt's demand to "pick a side," I should probably side with the user (Secularism works) but validate the friend's mechanism (Community matters). Let's go with: **The User is right that religion isn't necessary, but the Friend is right that community is.** However, since I must pick a side on the *necessity* of religion: **Religion is not necessary for a high-trust society.**

  6.  **Drafting - Section by Section:**

