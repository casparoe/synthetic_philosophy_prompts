          1.  *Parochial Care (In-Group):* Religion wins here.
          2.  *Universal Altruism (Out-Group):* Secularism often wins here (less tribal).
          3.  *Systemic Trust (Institutions):* Secularism wins here (rule of law > divine fear).
      *   **The "Leftover Faith" Argument:** Address the Nordic paradox. It's not leftovers; it's institutional reliability.
      *   **The Two Towns Experiment:**
          *   Town A (Faith): High cohesion, high exclusion risk.
