      *   Counter-evidence: Nordic countries (highly secular, high trust) have been stable for decades.
      *   Mechanism: Trust comes from *reliability of institutions* and *repeated interaction*, not necessarily theological belief.

  4.  **Develop the "Two Towns" Thought Experiment:**
      *   *Town A (Religious):* Churches on every block. High initial cohesion. Risk: Sectarianism, exclusion of non-believers, reliance on supernatural monitoring.
      *   *Town B (Secular Civic):* Sports, parent groups, "Atheist Sunday." Focus on shared projects.
      *   *50-Year Outlook:* Town B likely sustains trust better *if* institutions are robust, because it relies on horizontal accountability (peer-to-peer) rather than vertical (God-to-human) which can fracture. However, Town A might have higher initial intensity.
      *   *Key Insight:* It's the *meeting-every-week part* (social capital) that does the work, not the *belief part*.

