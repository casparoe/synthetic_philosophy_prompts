  1. The Procedure

  This procedure operationalizes Dennettian autonomy varieties for clinical ethics review within a 45-minute window. Assessors must proceed sequentially; failure at any register halts the process and assigns the corresponding autonomy status. Clinical judgment overrides procedural rules only at explicitly flagged Value Hand-off points. The goal is to match institutional coercion to the specific variety of autonomy intact, avoiding metaphysical debates about free will.

  **Register 1: Control-Worth (Self-Modification)**
  *Question:* Can the patient evade immediate impulse for a stated reason?
  *Evidence:* Observable delay of gratification; verbalized restraint despite distress; successful use of coping mechanisms.
  *Stop Condition:* Patient acts on immediate urge despite acknowledged negative consequences.
  *Outcome if Failed:* **Guardianship Status.** No treatment consent valid; surrogate decision-makers required.
  *Value Hand-off:* The Committee must define the temporal threshold for delay. Is resisting for ten minutes sufficient, or must stability persist for weeks? This is not a clinical fact but an institutional value regarding risk tolerance. If a patient fails Register 1, Registers 2 and 3 are not assessed, as control is foundational to any agency.

  **Register 2: Respect-Worth (Social Accountability)**
  *Question:* Can the patient participate in a practice of giving and asking for reasons?
  *Evidence:* Acknowledgment of harm to others; ability to apologize; responsiveness to counter-arguments without aggression.
  *Stop Condition:* Inability to recognize social/medical norms or complete refusal to engage in dialogue.
  *Outcome if Failed:* **Protective Status.** Welfare interventions permitted without consent; patient views considered but not binding.
  *Value Hand-off:* The Committee determines which norms are non-negotiable. Does refusing life-saving treatment violate a norm of self-preservation, or is it a protected liberty? This overrides clinical assessment of capacity. This step requires consensus on the weight of social norms versus individual liberty.

  **Register 3: Project-Worth (Life-Planning)**
  *Question:* Does the patient form and pursue coherent long-term life plans?
  *Evidence:* Consistent narrative identity over time; planning steps toward future milestones; linking current sacrifices to future gains.
  *Stop Condition:* Absence of future orientation or radically contradictory goals.
