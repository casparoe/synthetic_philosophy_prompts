answer: |-
  This is a sophisticated impasse, and your hunch is correct: the debate is stalled not because the arguments are exhausted, but because the interlocutors are operating on different theoretical registers while using the same vocabulary. You are diagnosing a **category error compounded by a methodological mismatch.**

  Here is the diagnosis of the stalemate, an evaluation of your hunch, and a proposal for what counts as progress.

  ### 1. The Core Diagnosis: A Methodological Mismatch
  The primary reason the debate goes in circles is that the two sides are answering different *types* of questions, despite using the same terms.

  *   **The Open Borders Side** is predominantly arguing from **Ideal Theory**. They are asking: "In a just world, what rights do human beings have regarding movement?" Their premise is moral geometry. If coercion requires justification, and borders coerce, then borders are unjust unless justified. The welfare state is treated as a variable institution that *ought* to be reformed to accommodate justice, not a fixed constraint that limits justice.
  *   **The Restrictionist Side** is predominantly arguing from **Non-Ideal Theory** (often disguised as normative theory). They are asking: "Given existing human psychology and institutional fragility, what conditions sustain the practices we value?" Their premise is political sociology. If solidarity requires trust, and trust requires boundedness, then open borders destroy the precondition for the very redistribution the open borders side values.

  **Why this causes stalemate:**
  When the restrictionist says, "Open borders will destroy the welfare state," they are making a sociological prediction about stability. When the open borders advocate replies, "Then the welfare state is unjustly exclusionary," they are making a normative claim about priority.
  *   The restrictionist hears: "You are ignoring empirical reality."
  *   The open borders advocate hears: "You are privileging status quo institutions over human rights."

  They talk past each other because one is designing the engine (ideal justice) and the other is warning about the fuel quality (non-ideal stability). Neither can "win" because they are not disputing the same proposition. One is disputing a moral principle; the other is disputing a causal mechanism.

  **Confidence:** High. This explains why empirical data (e.g., from the EU or US) rarely shifts minds. The restrictionist treats data as proof of fragility; the cosmopolitan treats it as proof of adaptability, or dismisses it as irrelevant to the normative claim.

  ### 2. Validating Your Hunch: The "Welfare State" Bundle
  Your hunch about the three worries (fiscal, political, constitutive) is analytically precise. The stalemate persists because these three operate as a **Motte-and-Bailey fortress.**

  1.  **Fiscal (The Bailey):** Easy to attack. Empirical evidence often shows migrants are net contributors. Open borders advocates easily knock this down.
  2.  **Political (The Transition):** Harder to measure. This is the "erosion of support" argument. Restrictionists retreat here when fiscal arguments fail. It relies on counterfactuals about voter psychology that are difficult to falsify.
  3.  **Constitutive (The Motte):** Immune to empirical refutation. This is the argument you identified: boundaries *define* the community. If you remove the boundary, you haven't damaged the welfare state; you've dissolved the *demos* that authorizes it.

  **The Diagnostic Problem:**
  The debate stalls because the open borders side usually attacks the Fiscal or Political worries (empirical arguments), while the Restrictionist ultimately rests on the Constitutive worry (ontological argument).
  *   When you prove migrants don't drain funds, the restrictionist says, "It's not about money, it's about trust."
  *   When you argue trust can be expanded, the restrictionist says, "Trust isn't the point; self-determination is. We have a right to define the 'us' regardless of the economic outcome."

  You cannot empirically refute a constitutive claim. It is a definition, not a hypothesis. The stalemate is sustained because the restrictionist shifts from empirical claims (which can be lost) to definitional claims (which cannot).

  **Confidence:** High. This explains the "ten years of arguing" phenomenon. The goalposts move from economics to sociology to ontology.

  ### 3. The Conceptual Slippage: Entry vs. Membership
  You are also correct that "open borders" slides between **open entry** and **open membership**. This is a verbal disagreement with substantive consequences.

  *   **Open Entry:** The right to cross the line and reside.
  *   **Open Membership:** The right to access the welfare package and vote immediately.

  Much of the literature assumes these are bundled. They need not be.
  *   If "open borders" means *open entry only* (with a waiting period for benefits), the Fiscal and Political worries diminish significantly.
  *   If "open borders" means *open membership*, the Constitutive worry becomes paramount.

  The stalemate exists because the Restrictionist argues against Open Membership (defending the bounded *demos*), while the Open Borders advocate argues for Open Entry (defending freedom of movement). They agree to disagree on a proposal neither is actually defending in that moment.

  **Confidence:** Moderate-High. While some theorists (e.g., Carens vs. Wellman) are careful here, the broader discourse and even many specialized papers conflate residency rights with citizenship rights. Disaggregating them dissolves much of the heat, which is why the debate resists doing so; the heat is where the philosophical interest lies.

  ### 4. What Counts as Progress?
  Given this diagnosis, you should stop expecting **consensus** and start aiming for **typological clarity**. You will not solve the debate, but you can map why it is stuck. Here is what progress looks like for your literature review:

  **A. Change the Question (High Value)**
  Stop asking "Are open borders just?" Start asking: **"What is the relationship between the *site* of justice and the *scope* of the community?"**
  *   Progress is acknowledging that the Open Borders side prioritizes the *individual* as the site of justice, while the Restrictionist prioritizes the *structure* (the state) as the site of justice.
  *   Your contribution can be showing that the debate is actually a proxy war between **Cosmopolitan Individualism** and **Democratic Collectivism**.

  **B. Decouple the Welfare Worries (Medium Value)**
  Explicitly categorize every argument you review into Fiscal, Political, or Constitutive.
  *   Show where authors pivot from one to the other when pressed.
  *   Highlight that the Constitutive argument is the only one that survives empirical scrutiny, but also the one that is least vulnerable to normative critique (because it is circular by design: "We need boundaries to be a 'we'").

  **C. The "Transition" Problem (High Value)**
  The most fruitful ground is the **transition from non-ideal to ideal**.
  *   Ask: "Even if open borders are the ideal end-state, what are the preconditions for getting there without collapsing the institutions that make justice possible?"
  *   This forces the Open Borders side to engage with Non-Ideal Theory (institutional design) and the Restrictionist side to engage with Ideal Theory (admitting boundaries are instrumental, not intrinsic).
  *   **Progress** is a framework that treats borders not as a binary (open/closed) but as a **variable institutional design** (e.g., graduated membership, regional free movement, portable benefits).

  ### 5. Confidence and Falsifiability
  **Where I am most confident:**
  *   That the Ideal/Non-Ideal mismatch is the engine of the stalemate.
  *   That the "Welfare State" argument functions as a Motte-and-Bailey (Fiscal -> Political -> Constitutive).
  *   That Entry vs. Membership conflation obscures the actual disagreement.

  **Where I might be wrong (and what would change my mind):**
  *   **The Empirical Turn:** If new, robust comparative data emerged showing that high migration *increases* welfare solidarity (counter to the standard restrictionist assumption), the Political worry might collapse, forcing the debate entirely onto the Constitutive ground. If that happened and the debate *still* didn't move, my diagnosis that it's "foundational" would be confirmed. If the debate *did* resolve, then my diagnosis that it's a "methodological mismatch" was too generous; it was just a lack of data.
  *   **The Normative Shift:** If a prominent theorist successfully argued that the *constitutive* argument is itself unjust (e.g., by showing that "bounded community" is a fetishized concept with no moral weight), the Restrictionist position would crumble. If this happened and Restrictionists simply dug in deeper, then the disagreement is indeed foundational/tribal, not philosophical.

  **Where the diagnosis is most vulnerable:**
  *   It assumes the actors are arguing in good faith. It is possible the stalemate is sustained by **ideological incentives** (e.g., funding, political alignment) rather than philosophical confusion. If the literature is driven by policy advocacy rather than truth-seeking, no amount of conceptual distinction will create progress.
  *   It assumes "progress" is possible in political theory. It may be that this is a **permanent antinomy** (like Liberty vs. Equality). If so, the "progress" is simply recognizing it as an antinomy to be managed, not a problem to be solved.

  ### Summary for your Review
  Your literature review should not try to declare a winner. It should argue that the field is stuck because it treats a **multi-layered problem** (empirical, institutional, ontological) as a **single binary question**.
  *   **Diagnosis:** Methodological incommensurability (Ideal vs. Non-Ideal) + Conceptual conflation (Entry vs. Membership).
  *   **Mechanism:** The Restrictionist retreats to constitutive arguments when empirical arguments fail; the Cosmopolitan dismisses constitutive arguments as status quo bias.
  *   **Path Forward:** Shift from "Justification of Borders" to "Design of Membership."

  You have the right hunch. Trust the distinction between the fiscal, political, and constitutive. That is your lever. Use it to show that the two sides are not fighting over the same object.
