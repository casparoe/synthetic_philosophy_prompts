answer: |-
  **To:** Standards Editor & Editorial Desk
  **From:** [Your Name], Science & Ideas
  **Subject:** Decision Procedure for Slur Usage in Copy
  **Date:** October 26, 2023

  ### Introduction

  This document provides a 15-minute decision procedure for handling slurs in editorial copy. It is built on current linguistic and philosophical consensus regarding how slurs function differently from ordinary pejoratives (e.g., "jerk," "damn").

  **The Core Linguistic Fact:** Unlike ordinary insults, slurs retain derogatory force even when negated, quoted, or attributed to others (e.g., "He didn't call him a [slur]" still invokes the slur's harm). This is known as *projection*. Because the harm "leaks" out of grammatical containers, we cannot rely on attribution alone to neutralize the word.

  This procedure prioritizes **Necessity** and **Harm Mitigation** over grammatical technicalities. It identifies where linguistic theory ends and ethical judgment begins.

  ---

  ### Part 1: The Decision Procedure (15-Minute Clock)

  **Step 1: The Necessity Test (3 Minutes)**
  *Ask:* Is the specific word required to convey the news, or can the *fact* of its usage be conveyed without the *string of characters*?
  *   **Yes, the word itself is the story:** (e.g., A linguistic study on the word; a legal trial where the specific charge hinges on the word). → *Proceed to Step 2.*
  *   **No, the fact of usage is the story:** (e.g., A politician was racist; a historical figure held racist views). → **STOP.** Paraphrase or use partial masking (e.g., "the N-word"). Do not print verbatim.
  *   **Unclear:** → *Proceed to Step 2.*

  **Step 2: The Use vs. Mention Test (3 Minutes)**
  *Ask:* Is the subject *using* the word to target a group, or *mentioning* the word as an object of discussion?
  *   **Use (Targeting):** The speaker is applying the label to a person/group to derogate them. → **STOP.** Do not print verbatim. Mask or paraphrase. (Exception: Step 3).
  *   **Mention (Discussing):** The word is being analyzed, defined, or cited as data. → *Proceed to Step 3.*
      *   *Note:* Because slurs project meaning, "Mention" reduces harm but does not eliminate it.

  **Step 3: The Licensing & Agency Test (4 Minutes)**
  *Ask:* Who is uttering the word, and do they have the social license to do so?
  *   **In-Group / Reclaimed:** The speaker belongs to the target group and is using the term self-referentially or politically (e.g., "Queer," "N****r" in hip-hop or activism). → *Proceed to Step 4.*
  *   **Out-Group:** The speaker does not belong to the target group. → **STOP.** Do not print verbatim. Mask or paraphrase.
  *   **Archival / Historical:** The speaker is deceased or the text is a historical document. → *Proceed to Step 4.*

  **Step 4: The Harm vs. Value Calibration (5 Minutes)**
  *Ask:* Does the public value of printing the verbatim word outweigh the foreseeable harm to readers and the targeted community?
  *   **High Value / Low Ambiguity:** (e.g., A profile subject reclaiming a term; a scientific study where masking ruins the data). → **Decision:** Print verbatim. Add an editor's note or content warning if digital.
  *   **Low Value / High Ambiguity:** (e.g., Historical text where the slur is incidental to the main point; a quote where the shock value overshadows the information). → **Decision:** Mask or paraphrase.
  *   **Tie:** → **Decision:** Escalate to Senior Editor. Do not decide alone.

  ---

  ### Part 2: Application to Concrete Cases

  Here is how the procedure resolves the four scenarios you provided.

  #### Case 1: The State Legislator (Hot Mic)
  *   **Scenario:** Legislator uses the most common anti-Black racial slur. Story is about his use of the word.
  *   **Step 1 (Necessity):** The *fact* of his racism is the story. The specific phonetics are not required to understand he violated norms. → **Result:** Paraphrase/Mask.
  *   **Step 2 (Use/Mention):** He was *using* it to derogate, not mentioning it. → **Result:** Do not print.
  *   **Step 4 (Harm/Value):** Printing it amplifies the harm to Black readers without adding news value beyond confirming the slur was used.
  *   **Final Decision:** **Mask.** (e.g., "The legislator used the N-word.")
  *   **Rationale:** The news value lies in the *conduct*, not the *phonetics*.

  #### Case 2: The Gay Activist (Reclamation)
  *   **Scenario:** Activist refers to himself with a slur shouted at him decades ago. Requests exact quote.
  *   **Step 1 (Necessity):** The emotional weight of the reclamation is the story. Paraphrasing loses the reclamation aspect. → **Result:** Verbatim considered.
  *   **Step 3 (Licensing):** In-group/Reclaimed use. He has agency over the term. → **Result:** Proceed.
  *   **Step 4 (Harm/Value):** High value in showing reclamation. Harm is mitigated by speaker agency.
  *   **Final Decision:** **Print Verbatim.**
  *   **Caveat:** Ensure context makes the reclamation clear so readers do not mistake it for the publication endorsing the slur.

  #### Case 3: The 19th-Century Travel Writer (Archival)
  *   **Scenario:** Serializing passages where racial terminology for Indigenous peoples was standard then but is a slur now.
  *   **Step 1 (Necessity):** *Critical Junction.* Is the story about the racism of the era, or the geography/travel?
      *   If the article analyzes the racism: The word is evidence. → *Proceed.*
      *   If the article is about the landscape and the slur is incidental: The word is not necessary. → **Mask.**
  *   **Step 3 (Licensing):** Historical speaker. No living agency.
  *   **Step 4 (Harm/Value):** This is where your instinct (print verbatim for historical truth) meets the procedure.
      *   *Linguistic Reality:* The slur retains its sting (projection). It is not "inert" because it is old.
      *   *Ethical Reality:* "Historical Accuracy" is not a shield against current harm.
  *   **Final Decision:** **Conditional.** If the racism is the subject of the piece, print with an introductory editor's note contextualizing the language. If the racism is incidental to the narrative, paraphrase or mask.
  *   **Note on your Confession:** The procedure challenges your instinct. It argues that preserving "historical fidelity" is a lower priority than preventing gratuitous harm to current readers, unless that fidelity is the *point* of the journalism.

  #### Case 4: The Cognitive Scientist (Mention)
  *   **Scenario:** Study uses the slur as a stimulus. Sentence is pure mention ("Participants reacted to the word [slur]").
  *   **Step 1 (Necessity):** Scientific precision requires the specific stimulus. Masking invalidates the methodology description. → **Result:** Verbatim considered.
  *   **Step 2 (Use/Mention):** Pure mention. → **Result:** Proceed.
  *   **Step 4 (Harm/Value):** High scientific value. Reader harm is possible but mitigated by clinical context.
  *   **Final Decision:** **Print Verbatim.**
  *   **Mitigation:** Use a content warning at the top of the digital article. Ensure the surrounding text is strictly clinical.

  ---

  ### Part 3: Failure Modes & Limitations

  This procedure is a tool, not a moral absolution. It will misfire in the following ways. Editors must recognize these failure modes.

  **1. The "Trauma Blindspot" (Where Theory Fails)**
  Linguistics distinguishes between *meaning* and *force*. This procedure assumes that if we manage the force (via context/licensing), the meaning is safe to print.
  *   **Failure Mode:** A reader from the targeted group may experience trauma simply by *seeing* the word, regardless of whether it was "mentioned" vs. "used," or "reclaimed" vs. "archival."
  *   **Limitation:** This procedure cannot calculate individual trauma. It optimizes for *general* harm reduction, not *universal* safety. If a reader is harmed by the visual presence of the word, this procedure offers them no recourse. That is a limitation of the framework, not an error in its application.

  **2. The "Algorithmic Leak"**
  We publish digitally. Search engines and social media scrapers do not respect "Use vs. Mention."
  *   **Failure Mode:** A word printed in a scientific context (Case 4) may be scraped and displayed out of context on a social media feed, appearing as hate speech.
  *   **Limitation:** This procedure governs the *article*, not the *distribution*. Editors must consider metadata and social headlines separately. A verbatim word in the text might require a masked headline.

  **3. The "Normalization Risk"**
  Philosophers debate whether printing a slur, even critically, contributes to its normalization.
  *   **Failure Mode:** By creating a "safe" channel for the word (e.g., in science or history), we may inadvertently lower the barrier for its usage elsewhere.
  *   **Limitation:** This procedure cannot measure long-term cultural shifts. It addresses the immediate editorial decision.

  **4. The Archival Impasse (Addressing the Confession)**
  You noted your instinct is to print historical texts verbatim to avoid "lying about the past."
  *   **Where the Procedure Disagrees:** The procedure treats "lying about the past" as a secondary concern to "harming the present." Linguistics confirms the word *still works as a slur* in the present tense, even when quoted from the past.
  *   **The Compromise:** The procedure allows verbatim printing *only if* the racism is the subject of the inquiry. If the racism is merely background noise in a historical text, the procedure demands masking. This acknowledges that while we should not falsify history, we are not obligated to amplify historical violence gratuitously in a modern news product.

  ### Summary for the Desk Editor

  1.  **Is the word necessary to the news?** If no, cut it.
  2.  **Is it being used to hurt or mentioned to study?** If used to hurt, mask it.
  3.  **Does the speaker have the license?** If not, mask it.
  4.  **Does the value outweigh the harm?** If unsure, mask it.
  5.  **If printing:** Add context or warnings.

  **Final Note:** If the procedure yields a result that feels morally wrong to the editor, **escalate.** This tool handles 90% of cases. The remaining 10% are not linguistic puzzles; they are ethical judgments that require human deliberation, not a checklist.
