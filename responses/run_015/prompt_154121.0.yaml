      *   Actually, the strongest move is to attack the definition of "Mechanism" in Step (9). Mechanism $\neq$ Fixed Formal System. Mechanism = Computable Process. A process that updates its own code is still computable (Reflection principles, Turing progressions are computable sequences).
      *   So, Step (9) is false. An infinite hierarchy of self-correction *can* be mechanistic. It just isn't a *single* formal system.
