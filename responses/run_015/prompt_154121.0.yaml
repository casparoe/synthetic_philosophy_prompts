      *   **Addressing the User's specific worry:** "I don't want to accidentally declare that evolutionary biology isn't mechanistic."
      *   **Solution:** Reject the inference that "escaping fixed formalization" $\rightarrow$ "non-mechanistic." Mechanism allows for open-ended complexity. The Gödel argument only rules out equivalence to a *single, static, known* formal system. It does not rule out equivalence to a *process* that generates such systems.

