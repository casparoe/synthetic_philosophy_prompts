prompt: |-
  ok so im in a philosophy of psychiatry course and weve been talking about Hacking's looping effects — how classifying people can change them and then the classification shifts too. i work part-time on a clinical ethics board at my uni hospital that reviews proposals for new diagnostic subcategories. i need a proper reusable procedure, like a checklist in words with steps in order, that the board can run on any proposal to see if it risks bad looping. it needs to cover second-order looping as well, where the clinicians' own assessment tools start changing because patients begin performing the diagnosis back at them. for each step say what counts as a sufficient answer, where the procedure stops with a hard no, and where it just has to hand the decision to a person because its a values call not a fact. the board has clinicians and ethicists but no philosophers, and theyve only got about 20 minutes per proposal, so keep it practical. then run it on three cases: splitting generalised anxiety into 'algorithm-curated anxiety' and 'ambient anxiety' depending on digital triggers; adding prolonged grief disorder as its own category; and recognising 'climate-related existential distress' as a clinical subtype — im personally in favour of that last one but i want the procedure to be able to reject it if the logic demands. flag where the procedure misfires or cant settle things, and write it all in British English please.
