      *   *Application:* Run the three cases through the protocol.
      *   *Critique:* Be honest about where the checklist fails (e.g., it can't predict the future, it relies on self-reporting from proposers).
      *   *Formatting:* Use bolding, lists, and clear headings for readability.

      *(Self-Correction during drafting)*: I need to make sure I explicitly address *second-order* looping.
      *   *Adjustment:* Add a specific question about diagnostic tools and clinician behaviour. "Will the criteria force clinicians to ignore context?"

      *(Self-Correction on British English)*: Ensure spelling (categorisation, medicalisation, behaviour) and vocabulary (whilst, whilst, programme).

      *(Self-Correction on Case 3)*: The user wants the procedure to be able to reject it even if they like it. I must ensure the protocol doesn't bias towards validation. The risk is medicalising a rational political/emotional stance.

  7.  **Final Review against Prompt:**
