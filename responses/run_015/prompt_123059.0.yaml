answer: |-
  # Diagnostic Looping Risk Protocol (DLRP)
  **For use by Clinical Ethics Boards**
  **Time Allocation:** 20 Minutes per Proposal
  **Objective:** To identify and mitigate harmful 'looping effects' (Hacking) wherein new diagnostic categories alter patient behaviour or clinical practice in ways that undermine care or validity.

  ---

  ## Part 1: The Procedure

  **Instructions:** The Board Chair reads each step. The Proposer answers. The Board agrees on the status of the answer. Proceed sequentially.

  ### Step 1: The Utility Test (Fact-Based)
  **Question:** Does this subcategory offer a specific treatment pathway or resource access that the parent category cannot provide?
  *   **Sufficient Answer:** Yes, there is evidence that distinct interventions (pharmacological, therapeutic, or social) are effective for this subgroup and not the parent group.
  *   **Hard No:** If the answer is 'No' or 'Unclear'. *Stop here. Reject proposal.* (Creating a label without a distinct benefit invites medicalisation without gain).
  *   **Values Hand-off:** None. This is a matter of clinical efficacy.

  ### Step 2: The Identity Capture Test (First-Order Looping)
  **Question:** Is the label likely to become a 'master identity' for the patient, overriding other aspects of self, and is this capture necessary for care?
  *   **Sufficient Answer:** The label describes a transient state or a specific symptom cluster, not a fundamental character type. Patients are not expected to join communities or adopt lifestyles based on the label.
  *   **Hard No:** If the label describes a permanent character trait (e.g., 'born this way') where no biological marker exists, and the label carries high stigma.
  *   **Values Hand-off:** If the label *does* capture identity (e.g., neurodiversity categories) but proponents argue this provides community and validation. The Board must weigh **Validation vs. Stigma**.

  ### Step 3: The Performance Test (Second-Order Looping)
  **Question:** Are the diagnostic criteria vulnerable to 'gaming' by patients, or will they force clinicians to ignore context to fit the checklist?
  *   **Sufficient Answer:** Criteria rely on objective markers or verified history that cannot be easily performed or mimicked. Clinicians retain discretion to account for context.
  *   **Hard No:** If criteria rely entirely on self-reported checklists that are publicly available and easily mimicked to gain secondary gain (e.g., medication, exemptions), *and* there is no verification step.
  *   **Values Hand-off:** If the criteria *will* change clinician behaviour (e.g., shortening appointment times to fit a algorithm), but proponents argue this standardises care. The Board must weigh **Efficiency vs. Nuance**.

  ### Step 4: The Feedback Stability Test (Long-term Looping)
  **Question:** If patients change their behaviour to match this diagnosis, will the definition of the disorder become unstable within 5 years?
  *   **Sufficient Answer:** The underlying mechanism (biological or environmental) is stable enough that behavioural changes won't render the criteria obsolete.
  *   **Hard No:** If the category relies on rapidly changing cultural or technological trends (e.g., specific social media platforms) that will vanish or mutate before validation is complete.
  *   **Values Hand-off:** If the instability is accepted as a necessary cost of tracking a rapidly evolving crisis (e.g., environmental or societal). The Board must weigh **Relevance vs. Reliability**.

  ### Step 5: Final Adjudication
  *   If any **Hard No** was triggered: **Reject.**
  *   If only **Sufficient Answers**: **Approve.**
  *   If any **Values Hand-off** was triggered: **Board Vote required.** (Majority rules, but minority ethical concerns must be recorded in the minutes).

  ---

  ## Part 2: Application to Cases

  Here is the protocol run on your three scenarios.

  ### Case 1: 'Algorithm-Curated Anxiety' vs. 'Ambient Anxiety'
  *Proposal: Split Generalised Anxiety Disorder (GAD) based on whether triggers are digital/algorithmic or physical/environmental.*

  *   **Step 1 (Utility):** *Unclear.* Are treatments different? Digital detox vs. environmental change? Both use CBT.
      *   *Risk:* Weak utility.
  *   **Step 2 (Identity):** *High Risk.* Patients may identify as 'victims of algorithms', potentially reducing agency to change usage habits.
      *   *Values Call:* Validation of tech-harm vs. fatalism.
  *   **Step 3 (Performance):** *Hard No Risk.* Patients can easily curate their self-report to fit 'Algorithm' (blaming TikTok) vs 'Ambient' (blaming work) to seek different exemptions. Clinicians may stop asking about underlying trauma and just ask 'Which app?'.
  *   **Step 4 (Stability):** *Hard No.* Technology shifts faster than diagnostic manuals. 'Algorithm' criteria will be obsolete in 3 years.

  **Verdict:** **Reject.**
  *Reasoning:* Fails Step 1 (Utility) and Step 4 (Stability). High risk of Second-Order looping where clinicians stop assessing root causes and simply categorise based on the patient's preferred blame-target.

  ### Case 2: Prolonged Grief Disorder (PGD)
  *Proposal: Add PGD as a distinct category separate from Depression or Adjustment Disorder.*

  *   **Step 1 (Utility):** *Sufficient.* Specific grief-focused therapies exist that differ from standard depression treatment. Access to bereavement support requires a code.
  *   **Step 2 (Identity):** *Values Hand-off.* Risk that normal mourning is pathologised. However, proponents argue it validates those stuck in trauma.
      *   *Board Task:* Weigh Validation vs. Medicalisation of Normality.
  *   **Step 3 (Performance):** *Moderate Risk.* Time-based criteria (e.g., >6 months) are objective, but symptom reporting is subjective. Clinicians might feel pressured to diagnose to unlock funding.
      *   *Values Call:* Efficiency (funding access) vs. Nuance (cultural variations in mourning).
  *   **Step 4 (Stability):** *Sufficient.* Grief is a stable human phenomenon, not subject to rapid cultural mutation.

  **Verdict:** **Values Hand-off (Board Vote).**
  *Reasoning:* No Hard No triggers, but significant ethical tension in Step 2. The procedure cannot decide if the benefit of validation outweighs the risk of pathologising love/loss. This requires an ethical vote.

  ### Case 3: 'Climate-Related Existential Distress'
  *Proposal: Recognise as a clinical subtype of Anxiety/Adjustment Disorder.*

  *   **Step 1 (Utility):** *Sufficient.* Validates distress that is currently often dismissed as 'normal'. Allows for specific eco-therapy or group support funding.
  *   **Step 2 (Identity):** *Values Hand-off.* High risk of 'Eco-Warrior' identity merging with patienthood. However, validation may reduce isolation.
      *   *Board Task:* Weigh Validation vs. Political Medicalisation.
  *   **Step 3 (Performance):** *Moderate Risk.* Difficult to distinguish from rational fear. Clinicians might be forced to diagnose 'distress' in patients who are rationally worried, potentially shifting the clinician's role from healer to political validator.
      *   *Values Call:* Is it right for psychiatry to manage rational responses to global crisis?
  *   **Step 4 (Stability):** *Hard No Risk.* The 'climate crisis' is a long-term reality, but the *cultural understanding* of it shifts. However, unlike Case 1, the stressor (climate change) is not fleeting. Let's rate this as **Sufficient** with caveats.

  **Verdict:** **Values Hand-off (Board Vote).**
  *Reasoning:* This is the trickiest case. It passes the Utility test (people need help), but it fails the 'Fact vs. Value' boundary. Is this distress a *disorder* or a *rational reaction*? The procedure flags this in Step 2 and 3. It does not automatically reject it, but it forces the board to admit they are making a moral decision, not a clinical one.

  ---

  ## Part 3: Critique of the Procedure

  As a board member, you should note where this checklist might misfire during your 20-minute window:

  1.  **The 'Utility' Trap (Step 1):**
      *   *Misfire:* Proposers can always invent a 'potential' treatment to pass Step 1. In Case 1, they might claim 'Digital Detox' is a distinct treatment, even if evidence is thin.
      *   *Fix:* The Board must demand *current* evidence, not *theoretical* pathways.

  2.  **Predicting Looping (Step 2 & 3):**
      *   *Misfire:* We cannot know for sure if patients will 'perform' the diagnosis until it is released. This step relies on speculation.
      *   *Fix:* Treat this as a 'Precautionary Principle'. If the risk of gaming is *plausible*, treat it as probable.

  3.  **The Values Hand-off Overload:**
      *   *Misfire:* If too many cases trigger a 'Values Hand-off', the board becomes a political debating chamber rather than an ethics review. Case 2 and 3 both landed here.
      *   *Fix:* If Step 2 and 3 both trigger Values Hand-offs, the proposal should be sent for public consultation rather than board approval.

  4.  **Second-Order Blindspot:**
      *   *Misfire:* Clinicians on the board may not see how *their own* tools will change. They assume they will remain objective.
      *   *Fix:* In Step 3, explicitly ask: "Will this criteria make your job easier but your assessment worse?"

  ### Summary for your Board
  This protocol protects you from **bad science** (Step 1 & 4) and flags **ethical risks** (Step 2 & 3). It does not remove the need for human judgement, but it forces you to locate *where* that judgement is being made. In the case of **Climate-Related Distress**, the procedure correctly identifies that approving this is not a medical fact, but a moral stance on the role of psychiatry in societal crisis. If your board is uncomfortable taking that stance, the procedure gives you the logical grounds to defer or reject.
