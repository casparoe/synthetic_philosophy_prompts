answer: |-
  Here is my decomposition and credence.

  **My Credence on the Proposition:** **0.60**
  *(Proposition: "Collapse" is an irreducibly evaluative concept; no purely descriptive threshold works without gerrymandering or importing judgments.)*

  ### The Decomposition

  I'm breaking your proposition into four sub-claims that support the "irreducibly evaluative" conclusion.

  **1. The Metric Viability Claim:** *A purely quantitative threshold (e.g., 50% population loss, 75% reduction in monumental construction) can be stated that fits the paradigm cases (LBA, Maya, Rapa Nui) without ad hoc tuning.*
  *   **Probability:** 0.25
  *   **Justification:** Any single metric excludes a paradigm case (e.g., population holds in some Maya zones while institutions vanish; monuments stop in LBA but writing persists elsewhere), requiring weighted indices that implicitly value some traits over others.

  **2. The Dispute Resolution Claim:** *Even granting a clean descriptive definition, live scholarly disputes would be settled by it rather than persisting as arguments about which changes matter.*
  *   **Probability:** 0.20
  *   **Justification:** Disagreements are rarely about *whether* the palace burned, but about whether the palace burning constitutes a "collapse" or a "reorganization," which is a question of significance, not fact.

  **3. The Popular Usage Claim:** *Ordinary and popular usage of "collapse" (Diamond, etc.) is doing moral-fable work rather than tracking value-free structural change.*
  *   **Probability:** 0.90
  *   **Justification:** The genre is explicitly cautionary ("warning from the past"), relying on a normative baseline where complexity is "good" and its loss is "bad" to generate the moral stakes.

  **4. The Detachability Claim:** *This moral-fable freight is detachable from scholarly use, allowing the term to function neutrally in technical contexts.*
  *   **Probability:** 0.35
  *   **Justification:** Scholarly selection bias (choosing to study "collapse" rather than "transition") already presumes the loss of complexity is the noteworthy event, importing the popular valuation even if the methodology is rigorous.

  ### Combination Logic
  I am treating these as necessary conditions for the *negation* of your proposition. If *any* of these are true (specifically 1 or 4), the concept might be salvageable as descriptive. However, since 1 and 4 are low probability, the "evaluative" claim holds. I weighted **Metric Viability (1)** and **Detachability (4)** most heavily (40% each) because if you can't measure it neutrally or strip the baggage, the concept is evaluative by default. **Dispute Resolution (2)** and **Popular Usage (3)** carry 10% each; popular usage is damning but theoretically separable from science, and dispute resolution is a downstream effect of the definition.

  Calculation: $1 - [(0.25 \times 0.4) + (0.20 \times 0.1) + (0.90 \times 0.1) + (0.35 \times 0.4)] \approx 0.60$

  ### Sensitivity Analysis
  **Most Sensitive To:** **The Detachability Claim (0.35).**
  If you could demonstrate a subfield of archaeology or history that uses "collapse" strictly as a neutral periodization marker (like "Pleistocene") without implying a negative valuation of the change, my credence would drop sharply toward Maya's 0.25.
  **Evidence to Move It:** A consensus style guide or methodological paper from a major journal that successfully operationalizes "collapse" without referencing "loss of complexity" or "system failure," perhaps redefining it purely as "discontinuity in material culture" regardless of direction. If scholars stop treating collapse as a *problem to be explained* and start treating it as a *neutral state change*, the evaluative charge dissipates.

  ### The Gap Between You (0.65) and Maya (0.25)
  The gap isn't about the data; it's about the **ontology of "society."**
  *   **Maya (0.25)** is treating societies like **organisms**. In biology, "death" or "extinction" is descriptive. The heart stops; the species is gone. She wants "collapse" to mean "the polity stopped functioning." To her, the evaluation is in the *event*, not the *word*.
  *   **You (0.65)** are treating societies like **projects**. A project can end because it succeeded, failed, or was abandoned. Calling it a "collapse" implies it *failed*. You are sensing that the word selects the elite perspective (the project managers) over the participant perspective (the laborers who might be happier without the managers).
  *   **The Friction:** Maya thinks you're being too philosophical about a technical term; you think Maya is using a technical term that secretly contains a philosophy she hasn't admitted to. You are arguing about whether "society" refers to the *population* (which rarely collapses) or the *structure* (which does). The word "collapse" smuggles in the assumption that the *structure* is the *society*.

  ### The Ledger Test Verdict
  **Is it doing real work or restating your conclusion in technical costume?**
  It is **restating your conclusion in technical costume**, but that is not necessarily useless.
  The Ledger Test operationalizes *your* evaluative stance: it explicitly decides that administrative literacy is the "essence" of the society and subsistence continuity is incidental. It doesn't solve the problem of "collapse" being evaluative; it simply *chooses* which evaluation to standardize. It's a heuristic for "Elite System Failure," not "Societal Collapse." If your group adopts it, you must admit you are no longer studying "societal collapse" broadly, but specifically "the discontinuity of state-level administrative capacity." That clarifies the debate but concedes your point that the term is evaluative.

  ### Pushback: Is the Setup Confused?
  Yes, slightly. The "descriptive vs. evaluative" dichotomy is a bit of a trap because **all historical periodization is thick with evaluation.**
  However, the deeper confusion lies in the **Polity vs. Society distinction.**
  If you distinguish "Polity Collapse" (the state apparatus dissolves) from "Societal Collapse" (the people die or disperse), 80% of the argument dissolves.
  *   **LBA:** Polity collapse (Yes), Societal collapse (No).
  *   **Maya:** Polity collapse (Yes, in south), Societal collapse (No).
  *   **Easter Island:** Polity collapse (Yes), Societal collapse (Debatable/Partial).
  The reason the debate persists is that scholars use "Societal Collapse" when they mean "Polity Collapse" because "Polity Collapse" sounds less dramatic and sells fewer books (and gets fewer grants). The *word* "Collapse" is doing the heavy lifting of conflating the two to make the loss of the Polity feel like the loss of the Society.
  **Truth Value:** The proposition has a truth value, but it's contingent on whether you think the conflation of Polity and Society is a mistake (your view) or a standard shorthand (Maya's view). If it's a standard shorthand, the evaluation is baked into the discipline's language, making the concept *functionally* evaluative even if *theoretically* descriptive.

  **Final Note:** I am unsure about the empirical details of Rapa Nui's "collapse" timing relative to European contact; some recent literature suggests the "ecocide" narrative is overstated. If the "paradigm cases" themselves are empirically shaky, the search for a definition that fits them is inherently gerrymandered.
