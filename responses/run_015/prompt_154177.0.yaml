answer: |-
  **Setting:** *A noisy coffee shop near campus. It's raining outside. Dr. Maya Torres and Dr. Leo Park are sitting at a small table covered in napkins with scribbled notes and empty espresso cups.*

  **Leo:** Look, I'm not saying people are robots. I'm saying the data is stubborn. You show me a person who stands up to authority in one context, and I'll show you a study where that same person folds like a lawn chair in a slightly different context. That's the Milgram takeaway. It's not that everyone is evil; it's that "character" is too fragile to carry the weight you virtue ethicists want it to.

  **Maya:** But here's where I get stuck with your critique, Leo. If you dissolve character entirely into situational variables, what's left to hold the moral weight? When we look at Milgram, we say, "This was wrong. The subjects *should* have stopped." That "should" implies a capacity for agency that transcends the immediate stimulus. If there's no character, no stable disposition, then the subjects weren't disobedient—they were just malfunctioning machinery. You need virtue language to even call the result a tragedy rather than just a mechanical failure.

  **Leo:** I see that trap. And I'll step around it. I can agree that the outcome was morally bad without positing a stable "evil character" inside the subject. I can say the *situation* was morally bad. The architecture of the room, the coat of the experimenter, the script—they created a moral vacuum. But that doesn't save virtue ethics. It just moves the locus of evaluation from the person to the environment.

  **Maya:** Exactly. And that's where I think you're actually describing what I'm calling a moral ecology. You're saying the virtue isn't in the head; it's in the room.

  **Leo:** I'm saying the virtue might not be there at all. Let's take your favorite case study. Jordan.

  **Maya:** Jordan the paramedic.

  **Leo:** Right. Jordan. On the shift, Jordan is incredible. Calm, compassionate, decisive in chaos. Saves lives. But you've met Jordan's partner. Jordan comes home exhausted, snaps at the kids, refuses to help with dinner, walls off emotionally. If virtue is a stable state of character, Jordan is a contradiction. If virtue is real, Jordan shouldn't be a hero in the ambulance and a jerk at the kitchen table. The situationist says: Jordan isn't virtuous. Jordan is just reacting to high-stakes scaffolding at work and low-stakes freedom at home.

  **Maya:** Okay, but why do we instinctively feel like Jordan *is* virtuous, though? When we hear about the shift, we praise Jordan. We don't say, "Oh, the uniform made them do it." We say, "Jordan was brave."

  **Leo:** Because we're biased toward internalizing success. We want heroes.

  **Maya:** No, I think it's because we recognize that the ambulance isn't just a backdrop. It's part of the virtue itself. This is the ecological point. You're treating the uniform, the protocol, the team dynamic as external distractions from "real" character. I'm saying those things are the scaffolding that allows courage to exist. Jordan's virtue isn't a hidden gem inside their soul; it's a relationship between Jordan's training and the emergency context.

  **Leo:** So you're fragmenting virtue. You're saying Jordan has "ambulance virtue" but not "home virtue." That sounds like you're conceding the situationist point that cross-situational consistency is a myth.

  **Maya:** I'm saying cross-situational consistency is the wrong metric. It's a one-size-fits-all model of character that doesn't match human reality. We don't expect a fish to climb a tree; we don't expect a paramedic's specific ecological virtue to transfer seamlessly to a kitchen table where the protocols don't exist. The question isn't "Is Jordan consistent?" It's "Why does the ecology of the home fail to support the virtue shown at work?"

  **Leo:** That's convenient. It protects the idea of virtue by making it so contextual it loses its bite. If virtue depends entirely on the ecosystem, then moral responsibility gets diluted. If Jordan yells at their kid, can we blame Jordan? Or do we blame the "home ecology"?

  **Maya:** We blame Jordan, because Jordan is the node where the ecology connects. But we stop pretending Jordan can just "will" themselves to be patient when they're physiologically depleted and the home structure offers no support. Here's the thing, Leo: Your situationist critique assumes the environment is a test of character. I'm saying the environment is a constituent of character. Without the right ecology, virtue literally cannot show up. It's not that Jordan loses their virtue at home; it's that the home ecology doesn't sustain that specific form of care.

  **Leo:** I like that distinction. "Constituent" rather than "test." But doesn't that make virtue elitist? Only people with the right ecologies get to be virtuous? If I put Jordan in a prison guard uniform, like in the Stanford study, does Jordan become cruel because the ecology demands it?

  **Maya:** Maybe. Or maybe Jordan resists because they've internalized the paramedic ecology so deeply it becomes a portable shield. But that's rare. That's what we call sainthood. For most of us, virtue is fragile. It needs maintenance. It needs the right cues.

  **Leo:** So you're agreeing with me that Milgram shows character is fragile.

  **Maya:** I'm agreeing that *isolated* character is fragile. But that doesn't mean virtue ethics is dead. It means we need an ecological virtue ethics. We stop asking, "How do we make people better?" and start asking, "How do we build worlds where being better is possible?"

  **Leo:** That sounds nice, Maya, but it risks letting the agent off the hook. If I'm rude to a cashier, I can't say, "Well, the lighting in here wasn't conducive to my kindness."

  **Maya:** No, because you are still the agent navigating the ecology. But we can acknowledge that if you put a good person in a broken system, the system usually wins. That's what Milgram taught us. Not that people are bad, but that bad systems override good dispositions.

  **Leo:** Okay, let's go back to Jordan. If we accept this ecological view, how do we judge Jordan? Is Jordan a good person?

  **Maya:** Jordan is a person capable of great care within a specific structure. The tragedy isn't that Jordan is a hypocrite. The tragedy is that Jordan's virtue doesn't have a home to go to.

  **Leo:** So the moral failure isn't Jordan's inconsistency. It's the gap between the ecologies.

  **Maya:** Precisely. And that changes how we teach ethics. We don't just drill students on "be brave." We teach them to build ecologies that sustain bravery. We teach them to recognize when the ecology is turning toxic.

  **Leo:** I can live with that. It saves the phenomenon of virtue without ignoring the data. But I still worry about the fragmentation. If virtue is totally distributed, do we lose the sense of a unified self?

  **Maya:** Maybe the unified self is the myth, Leo. Maybe we're just a collection of ecological responses, and wisdom is knowing which ecology you're standing in.

  **Leo:** *Laughs.* That's a terrifying thought for a Tuesday morning.

  **Maya:** Tell me about it. Pass the sugar?

  **Leo:** *Slides the bowl across the table.* So, Jordan needs a better home ecology.

  **Maya:** Or needs to learn how to bring the ambulance ecology home. Decompression routines. Rituals. Scaffolding.

  **Leo:** Okay. I'll grant you this: If virtue is ecological, then situationism isn't the enemy. It's the diagnostic tool.

  **Maya:** And virtue ethics isn't the delusion. It's the goal. We build the ecology to support the virtue.

  **Leo:** I still think Jordan needs to apologize to their partner.

  **Maya:** *Smiles.* Oh, absolutely. The ecology doesn't absolve the action. It just explains the conditions.

  **Leo:** Good. Because I was ready to throw out the whole seminar if you said Jordan wasn't responsible.

  **Maya:** No throwing out the seminar. Just... renovating the foundation.

  **Leo:** I can work with a renovation. Just don't expect me to stop citing Milgram.

  **Maya:** I'd be worried if you did.
