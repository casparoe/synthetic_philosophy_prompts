answer: |-
  **JOINT PRE-REGISTRATION DOCUMENT: THE NORMATIVITY OF ACTION ATTRIBUTION**

  **1. JOINTLY ACCEPTED CLAIMS**

  1.  **Empirical Baseline:** Both sides accept as a jointly accepted empirical pattern that in standard survey conditions, subjects are significantly more likely to attribute intentional action to an agent who foresees a harmful side effect than to an agent who foresees a comparable beneficial side effect, despite identical statements of indifference regarding the side effect.
  2.  **Data Admissibility:** Neither side may appeal to its own intuitions about the cases, nor to the intuitions of the seminar participants, as data. Evidence must be derived from controlled experimental measures where response bias is monitored.
  3.  **Conceptual Stability:** Both sides agree that if the asymmetry disappears under conditions designed to isolate the semantic content of action verbs from pragmatic pressure, this counts as evidence against the competence-level hypothesis. Conversely, if the asymmetry persists under conditions designed to suppress emotional responding, this counts as evidence against the performance-level hypothesis.
  4.  **Vignette Standard:** All experimental materials must present the agent's attitude toward the side effect as strictly instrumental indifference, ensuring the only variable is the normative status of the outcome.

  **2. TABLE OF DISAGREEMENTS**

  | Crux | Claim (Side A: Competence) | Claim (Side B: Performance) | Test Case | Prediction (A) | Prediction (B) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Valence vs. Norm** | Normative violation constitutes the intentionality judgment. | Negative valence triggers affective bias that distorts judgment. | Explicit Rule Manipulation (see Design 1). | Intentionality tracks Rule Violation, not Valence. | Intentionality tracks Valence, regardless of Rule. |
  | **2. Generalization** | The asymmetry generalizes to "knowingly," "deliberately," and explicit foresight questions. | The asymmetry is specific to "intentionally" and vanishes with neutral terms or explicit foresight probes. | Verb Variation Task. | Asymmetry persists across all verbs and foresight questions. | Asymmetry diminishes or vanishes with "knowingly" and foresight questions. |
  | **3. Cognitive Load** | The asymmetry is a default output of the concept; it survives cognitive load. | The asymmetry relies on heuristic processing; it diminishes under load or speeded response. | Speeded Response / Dual-Task. | Asymmetry magnitude remains stable under load. | Asymmetry magnitude decreases under load. |
  | **4. Blame Blocking** | The asymmetry reflects conceptual structure; it survives when blame is explicitly blocked. | The asymmetry reflects blame attribution; it vanishes when the agent is excused. | Excuse Condition (e.g., coercion or ignorance of norm). | Asymmetry persists despite excuse. | Asymmetry disappears when blame is blocked. |
  | **5. Task Type** | The asymmetry reflects underlying competence; it survives production tasks. | The asymmetry reflects demand characteristics; it vanishes in neutral paraphrase tasks. | Paraphrase Selection (see Design 3). | Subjects select intentional paraphrases for harm more than benefit. | Selection rates equalize when accuracy is incentivized. |

  **3. AGREED EXPERIMENTAL DESIGNS**

  **Design 1: The Explicit Rule Crossing**
  *Vignette:* The vice-president of a company goes to the chairman and says, "We are thinking of starting a new program. It will help us increase profits, but it will also [help/harm] the environment." The chairman answers, "I don't care at all about [helping/harming] the environment. I just want to make as much profit as I can. Go ahead and start the new program." The program is started. [Condition: Rule Present adds: "The company has a written strict rule against [harming/helping] the environment." Condition: Rule Absent omits this sentence.] The environment is [helped/harmed].
  *Prediction A:* There will be a main effect of Rule Presence. Intentionality ratings will be high when the rule is breached, regardless of valence. [Note: Insulated. If valence drives the effect, A may claim valence signals implicit norm violation.]
  *Prediction B:* There will be a main effect of Valence. Intentionality ratings will be high in the Harm conditions, regardless of Rule Presence.

  **Design 2: The Community Mismatch**
  *Vignette:* The vice-president of a company goes to the chairman and says, "We are thinking of starting a new program. It will help us increase profits, but it will also [harm/benefit] the environment." The chairman answers, "In our industry, this is standard practice and fully approved by our peers. I don't care about the environment. I just want profit. Go ahead." The program is started. The environment is [harmed/benefited]. [Condition: Subject Disapproval is measured separately to ensure subjects view the outcome as negative despite agent community approval.]
  *Prediction A:* Intentionality will be low. Since the agent violates no internal or community norm, the normative status required for intentional action is absent. [Note: Insulated. A may claim the subjects' disapproval establishes the relevant normative status.]
  *Prediction B:* Intentionality will be high in the Harm condition. The subjects' negative affective response to the harm drives the attribution, regardless of the agent's community norms.

  **Design 3: Incentivized Paraphrase Selection**
  *Vignette:* (Standard Chairman case, Harm vs. Benefit).
  *Task:* Subjects are shown the vignette and two paraphrases: (1) "The chairman brought about the side effect," (2) "The side effect happened because of the chairman." Subjects are told one paraphrase is objectively clearer for a neutral reader and are paid $0.50 bonus for selecting the option most frequently chosen by professional editors in a pilot study.
  *Prediction A:* Subjects will select the agentive paraphrase (1) significantly more often in the Harm condition than the Benefit condition.
  *Prediction B:* Selection rates will equalize. The financial incentive removes the pragmatic pressure to blame, revealing the neutral concept. [Note: Insulated. B may claim the incentive was insufficient to override automatic affective processing.]

  **4. CLOSING: VERBAL DISPUTE AND RESIDUAL SUBSTANCE**

  A significant portion of this dispute appears verbal. First, there is ambiguity in the test question "Did the chairman intentionally bring about the side effect?" Side A often interprets "intentionally" as implying a thick concept involving answerability or blame, whereas Side B interprets it as a thin concept synonymous with "on purpose" or "foreseen." If Side A is analyzing a concept of *responsible* action while Side B analyzes *volitional* action, they are talking past one another. Second, the distinction between "competence" and "performance" risks being merely labels for the data. If "competence" is defined as whatever produces stable judgments, and "performance" as whatever produces variable judgments, the distinction is tautological.

  To isolate the substantive residual dispute, we must set aside these verbal issues. The remaining question is not about the word "intentionally," but about the structure of the cognitive mechanism underlying action attribution. The substantive claim is: Is normative evaluation a constitutive input into the mechanism that generates action concepts (Side A), or is it an external input that biases the output of a normatively neutral mechanism (Side B)? If Design 1 shows that rule violation drives judgments independently of valence, this supports the constitutive claim. If Design 3 shows that removing pragmatic pressure eliminates the asymmetry, this supports the bias claim. The joint paper will conclude that the dispute is substantive only insofar as it concerns the architecture of the attribution mechanism, not the definition of the English verb.
