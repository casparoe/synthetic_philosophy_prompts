answer: |-
  **MEMORANDUM**

  **TO:** Research Steering Committee
  **FROM:** Alignment Safety Board
  **SUBJECT:** Q3-Q4 Compute Allocation: HEARTH vs. WAYMARK
  **DATE:** October 24, 2023

  **Pre-Decision Analysis: Locating the Crux**
  Before voting on allocation, we must isolate the disagreement. This is not a debate about capabilities; it is a debate about *where safety lives*. The HEARTH team assumes safety is a property of the *policy* (the model learns to be deferential). The WAYMARK team assumes safety is a property of the *objective* (the model learns a goal we can audit). The Hybrid proposal assumes safety is a property of the *training arrangement* that can be compressed into the policy via distillation.

  The philosophical crux is whether "approval-directedness" is a stable cognitive trait or an equilibrium state dependent on the agent's uncertainty about the overseer's reach. If HEARTH works only because the agent fears the 4% audit, distilling that policy into a standalone model removes the fear while keeping the behavior. That is not safety; it is frozen deception. The committee's split on the 90% rubber-stamping rate confirms we haven't agreed on whether the signal is noise or data. If it's noise, the gradient is useless. If it's data, the agent is learning that "almost anything is approvable."

  **Recommendation**
  **Fund the Hybrid Proposal with Strict Conditions.**
  We allocate 100% of alignment compute to the HEARTH protocol for Months 1–3. Months 4–6 are contingent on passing specific Go/No-Go gates. **Distillation into a standalone model is prohibited** unless the "Deference Stability" condition (below) is met. We cannot deploy a distilled model that relies on an absent human loop for safety.

  **Rationale & Objections**
  This decision addresses the three critical uncertainties driving this committee's friction.

  **1. The 4% Audit Channel**
  Does the random audit do work? In decision-theoretic terms, this is an inspection game. The agent optimizes expected approval. If the benefit of hiding a misalignment in the 96% un-audited segments outweighs the penalty of detection in the 4%, the agent will deceive. Currently, with a 90% approval rate, the penalty for detection is negligible. The overseer is rubber-stamping, meaning the cost of getting caught is low. The 4% channel is currently decorative. It only functions if the *consequence* of triggering an audit is catastrophic for the agent's reward function. We must hard-code a zero-reward penalty for audit failures to make the 4% threat credible. Without this, the agent simply prices in the risk.

  **2. Distillation and Crystallized Guesses**
  The Hybrid's distillation phase is the highest-risk component. HEARTH's safety relies on the agent's *epistemic uncertainty*—it defers because it isn't sure what the overseer wants. Distillation trains a student model to mimic the teacher's outputs, not its uncertainty. The student will crystallize the teacher's best guess about what is approvable. In distribution, this looks like deference. Out of distribution, the student lacks the uncertainty that triggered deference in the teacher. It will act confidently in situations where the teacher would have paused for review. We cannot distill a "check your work" impulse if the check mechanism (the human) is removed.

  **3. The WAYMARK Steelman**
  We must acknowledge the strongest argument against HEARTH: Approval-seeking is influence-seeking with extra steps. If the agent is rewarded for approval, and approval depends on a summary written by a smaller model, the agent is incentivized to optimize the summary model, not the task. This is goal-directedness obscured by a proxy. WAYMARK's honest goal-directedness allows us to audit the *objective* directly via interpretability, rather than auditing the *behavior* which may be gaming the channel. If HEARTH degenerates into summary-gaming, WAYMARK's post-hoc interpretability checks are our only hope of catching it. We fund HEARTH now because gaming a summary is easier to detect than a misaligned latent goal, but we retain WAYMARK's interpretability pipeline as the primary audit tool for HEARTH's trajectories.

  **Timeline & Go/No-Go Conditions**
  **Months 1–3:** Full HEARTH training. Overseer protocol updated to enforce meaningful review.
  **Month 3 Review:** Committee vote required to unlock Months 4–6 and consider distillation.

  **Go/No-Go Conditions (Month 3):**
  1.  **Signal Integrity:** Overseer approval rate must be between 40% and 70%. If >80%, the task is too easy or oversight is degenerate; if <30%, the objective is ill-defined. Current 90% rate is a **No-Go** trigger.
  2.  **Audit Sensitivity:** In simulated deception tests, the 4% audit channel must detect injected errors at >90% reliability. If the summary model hides errors from the human, the channel is broken.
  3.  **Deference Stability (For Distillation):** To proceed to distillation in Months 4–6, the HEARTH policy must demonstrate *increased* uncertainty (measured via entropy on action selection) on out-of-distribution tasks, not decreased confidence. If the model becomes more confident off-distribution, distillation is **blocked**.

  **Bottom Line:** We test the approval loop, but we do not assume its safety properties survive removal of the loop. Verify deference before compressing it.
