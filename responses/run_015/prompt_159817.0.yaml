answer: |-
  # Q&A Preparation Sheet: The Reconsideration Reading of Williams

  **Seminar Context:** Work-in-Progress, 2 Hours (20 min talk, 100 min discussion).
  **Core Claim:** Williams's integrity objection targets the *disposition to reconsider* ground projects against impersonal reasons, not the occurrent deliberative content. This generalizes to any view with deliberative primacy (Kantianism, Pluralism). Integrity requires deliberative compartmentalization.

  ---

  ## Part 1: The Eight Objections (Ranked)

  ### 1. The Planning Agency Objection (Planning Theorist)
  **Likelihood:** Very High | **Damage:** Critical
  **The Question:** "You describe 'settledness' as a normative requirement for integrity, but in my framework, that's just the functional role of intention (à la Bratman). Intentions *must* resist reconsideration to coordinate action. If you're just describing the stability condition of intention, you haven't found a moral problem with consequentialism; you've described agency. If you're prescribing *more* stability than agency requires, aren't you just licensing irrational dogmatism?"

  **The Two-Minute Reply:**
  "I agree that stability is a functional requirement of agency. But agency requires resistance to reconsideration *simpliciter*, whereas integrity requires resistance to *specific kinds of reasons*. The planning theorist says I must treat my intention to marry as settled to get through the wedding day. I'm saying I must treat it as settled *even when the impersonal calculus says I should divorce*. The consequentialist allows the intention to exist but holds it hostage to external validation. My claim is that rationality licenses filtering *which challenges* count, not just filtering *when* we deliberate. It's not dogmatism; it's a structural constraint on what counts as a valid reason against a ground project."

  **Soft Spot:** This banks on a distinction between "functional stability" and "normative immunity" that I haven't fully argued. If she presses that all normative immunity reduces to functional utility, I lose the normative force of "integrity."

  ### 2. The Opacity Objection (Lead Sophisticated Consequentialist)
  **Likelihood:** High | **Damage:** High
  **The Question:** "You claim indirect consequentialism still requires the agent to be disposed to reconsider their dispositions. But on a sophisticated view, the disposition to maintain the commitment is opaque. The agent doesn't hold the commitment *on the condition* that it remains optimific. They just have the commitment. The *theorist* knows the condition, but the *agent* isn't disposed to reopen the question. You're conflating the justification of the disposition with the content of the disposition."

  **The Two-Minute Reply:**
  "Even if the disposition is opaque, its *retention* is conditional on the theorist's calculation. The agent lives under a threat they cannot see, but the structure of their agency is still contingent on impersonal validation. If the numbers change, the theory prescribes deleting the disposition. The alienation isn't necessarily phenomenological anxiety; it's the metaphysical contingency of the commitment. The commitment isn't *theirs* in the robust sense; it's on loan from the impersonal standpoint. Integrity requires the commitment be held non-contingently, which ISC cannot grant."

  **Soft Spot:** This relies on a metaphysical claim about "contingency" rather than a deliberative one. If they argue that "on loan" doesn't matter if the agent never feels the loan, the alienation charge weakens.

  ### 3. The Constraint vs. Trump Objection (Kantian Deontologist)
  **Likelihood:** High | **Damage:** Medium-High
  **The Question:** "You generalize the objection to Kantianism, claiming the Moral Law forces reconsideration of personal commitments. But the Categorical Imperative is a *constraint* on maxims, not a competing *reason* to be weighed. I don't reconsider my commitment to my spouse *against* the Moral Law; I check if the commitment is *permissible* under it. If it passes, the Moral Law doesn't weigh against it; it steps away. There is no deliberative primacy of the moral over the personal, only a boundary."

  **The Two-Minute Reply:**
  "The boundary *is* the reconsideration. When you ask, 'Can I universalize this commitment?', you are stepping outside the internal logic of the relationship to judge it by an external standard. If the maxim fails, you must drop the commitment. This means the commitment's validity depends on passing the external test. That is the structural identity I'm pointing to: the personal commitment is not self-validating. It requires validation from the privileged standpoint (the CI), which is the reconsideration threat."

  **Soft Spot:** Kantians distinguish sharply between *justification* and *deliberation*. If they can show the CI is part of the *internal* constitution of the commitment rather than an external check, the generalization fails.

  ### 4. The Vice Objection (Virtue Theorist)
  **Likelihood:** Medium | **Damage:** Medium
  **The Question:** "You conclude that integrity requires deliberative compartmentalization. But compartmentalization sounds like vice. The *phronimos* integrates their commitments. If you shield a commitment from challenge, you aren't protecting integrity; you're protecting stubbornness or worse. What happens when the commitment is to something morally dubious? Does your view license the integrity of the devoted racist, provided they compartmentalize?"

  **The Two-Minute Reply:**
  "Integrity is a structural virtue, not a substantive one. It concerns the relation between the agent and their projects, not the moral worth of the projects. Yes, a racist can have integrity on this view. That's a bullet I bite. Virtue theory conflates integrity with overall moral goodness. My point is that practical rationality allows you to hold commitments settled *even against moral challenge* in certain domains. If that licenses bad actors, that tells us something about the tension between integrity and morality, not a flaw in the definition of integrity."

  **Soft Spot:** This is normatively unattractive. The Chair and Visitor will pounce on this. I need to be prepared to limit "ground projects" to non-morally-repugnant ones without begging the question.

  ### 5. The Negligence Objection (Effective Giving Visitor)
  **Likelihood:** Medium | **Damage:** Medium
  **The Question:** "If deliberative compartmentalization is rational, doesn't this license ignoring the effective giving obligation? If I can hold my commitment to my career as 'settled' against the challenge that I could save more lives by donating 50% of my income, aren't you just rationalizing moral complacency? You're giving agents a permission slip to ignore the most pressing reasons."

  **The Two-Minute Reply:**
  "I'm not saying agents can ignore *all* moral reasons. I'm saying they can hold certain ground projects settled against *aggregative* challenges. There is a difference between 'I could save a life' and 'I could maximize utility.' The compartmentalization protects the *structure* of a life, not trivial preferences. However, I concede there is a limit. If the moral cost is catastrophic, compartmentalization collapses. But for the standard demandingness cases, rationality permits holding the personal commitment fixed."

  **Soft Spot:** I haven't defined the limit. "Catastrophic" is vague. This leaves me open to a slippery slope argument.

  ### 6. The Fidelity Objection (Rossian Pluralist)
  **Likelihood:** Medium | **Damage:** Medium
  **The Question:** "You say pluralism requires reconsidering commitments when moral reasons weigh against them. But on Ross's view, fidelity *is* a prima facie duty. When I choose my wife over the greater good, I'm not prioritizing a 'personal commitment' over a 'moral reason.' I'm weighing the duty of Fidelity against the duty of Beneficence. The relationship *generates* the moral reason. So there is no external reconsideration; it's all internal to the moral deliberation."

  **The Two-Minute Reply:**
  "Even if fidelity is a duty, it is a *prima facie* duty. That means it is defeasible. When Beneficence outweighs Fidelity, you must violate Fidelity. To know that, you must step back and weigh them. That weighing process treats the commitment as one input among others, subject to being overridden. The 'inside' view of the relationship says 'I must save her, period.' The Rossian view says 'I must save her, unless Beneficence outweighs.' That 'unless' is the reconsideration disposition."

  **Soft Spot:** Rossians might argue that the *experience* of deliberation doesn't feel like overriding a commitment, but fulfilling the most stringent duty. I'm attributing a phenomenology they might deny.

  ### 7. The Demandingness Reframing (Chair)
  **Likelihood:** Low | **Damage:** Low
  **The Question:** "This sounds like the demandingness objection wearing different clothes. Demandingness says consequentialism asks too much sacrifice. You're saying it asks too much *reconsideration*. But the cash value is the same: the agent gets to keep their stuff. Why do we need a new structural account of integrity when 'it's too demanding' does the work?"

  **The Two-Minute Reply:**
  "Demandingness is about the *output* (how much I lose). Integrity is about the *input* (how I deliberate). I could accept a highly demanding view that still respects integrity (e.g., a divine command theory that demands everything but doesn't require me to calculate it). Conversely, a low-demand utilitarianism still violates integrity because I must hold my commitments contingently. The structural complaint explains *why* demandingness feels alienating, not just that it is costly."

  **Soft Spot:** If the structural difference doesn't yield different practical recommendations, the distinction might be merely academic.

  ### 8. The Content of Reconsideration Objection (Second Sophisticated Consequentialist)
  **Likelihood:** Low | **Damage:** Low
  **The Question:** "Even if we reconsider dispositions, we do so *consequentially*. The content of the reconsideration will likely vindicate the personal commitment (since having deep commitments is optimific). So the agent reconsiders, finds the commitment passes, and keeps it. Where is the alienation? The commitment is validated by the very theory you claim threatens it."

  **The Two-Minute Reply:**
  "The validation is the problem. The commitment is only secure *because* it is optimific. If the world changes and it becomes sub-optimific, it must go. The agent knows (or the theory knows) that the commitment's security is contingent on the state of the world. Integrity requires the commitment to be secure *independently* of the state of the world. Being 'validated' by the impersonal standpoint is still being 'judged' by it."

  **Soft Spot:** This risks sounding like a distinction without a difference for the agent's lived experience.

  ---

  ## Part 2: Strategic Concessions & Critical Moves

  ### The Pre-emptive Concession (Slide 1)
  **What to concede:** "I concede that deliberative compartmentalization cannot be absolute. There must be a threshold of moral catastrophe (e.g., direct harm to innocents) where compartmentalization is irrational. My claim is not that personal commitments *always* trump moral reasons, but that they are not *automatically* subject to being weighed against aggregative impersonal reasons."
  **Why:** This disarms the Virtue Theorist and Effective Giving Visitor immediately. It prevents the "racist integrity" objection from becoming the entire discussion. It frames the chapter as defining the *scope* of compartmentalization, not asserting its infinity.

  ### The Chapter-Changing Objection
  **Which one:** **The Planning Agency Objection (#1).**
  **Why:** If "settledness" is just the functional role of intention, then my normative claim about integrity collapses into a descriptive claim about action theory. If I cannot distinguish "rational stability of intention" from "normative immunity to moral challenge," the chapter loses its philosophical bite.
  **Action:** I need to add a section distinguishing *functional stability* (needed to act) from *deliberative insulation* (needed to live a life). I must argue that one can have functional stability while still acknowledging the *authority* of the challenging reason, whereas integrity requires denying the *authority* of that reason within that domain.

  ### The Reply That Must Land
  **Which one:** **The Opacity Objection (#2) against the Sophisticated Consequentialist.**
  **Why:** This is Move 1 of my argument. If ISC does *not* require the disposition to reconsider, then the "Reconsideration Reading" fails to improve on the "Alienation Reading." The standard reply to Williams is "ISC solves alienation." I must prove ISC *also* fails the integrity test. If I concede that ISC agents don't hold commitments contingently, the consequentialists win, and the generalization to Kantianism becomes irrelevant.
  **Action:** Emphasize the *conditional retention* of dispositions. Even if the agent doesn't think about it, the *theory's* conditionality structures the agency.

  ### The "Hope Nobody Asks" Question
  **The Question:** "If practical rationality licenses compartmentalization against moral reasons, what prevents it from licensing compartmentalization against *epistemic* reasons? Can I hold my belief that 'my child is the best' settled against evidence to the contrary? If not, what is the relevant difference between practical and theoretical reason that allows for 'settledness' in one but not the other?"
  **Why:** This threatens the foundational claim about rationality. If I argue rationality allows ignoring reasons in the practical sphere, I risk undermining the normativity of reasons altogether. It opens a can of worms about the unity of reason that I do not have time to address in a chapter on Williams.
  **Deflection Strategy:** "That's a crucial question for the theory of reasons, but here I'm restricting the claim to the *practical* domain where commitments constitute the agent's identity in a way beliefs do not. I'm happy to take that as a separate project."

  ---

  ## Part 3: Seminar Management Notes

  *   **Time Management:** You have 100 minutes for discussion. With 11 people, that's ~9 minutes per person if everyone speaks. In reality, the 4 Consequentialists and the Planning Theorist will dominate.
  *   **Handling the Consequentialist Bloc:** They will talk to each other. If they start debating ISC amongst themselves, intervene: "I want to make sure my specific claim about *reconsideration* is clear before you debate the ISC mechanics."
  *   **Handling the Deontologists:** They will be sympathetic to the conclusion (compartmentalization) but hostile to the generalization (that their view has the same flaw). Don't fight them too hard on whether Kantianism is *exactly* like Consequentialism. Concede "structural similarity" rather than "identity" if pressed.
  *   **Tone:** You are defending a *reading* and a *structural claim*, not a full moral theory. Keep returning to: "My claim is about the *structure of deliberation*, not the *outcome*."
