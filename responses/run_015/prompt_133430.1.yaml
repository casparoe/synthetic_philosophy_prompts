          *   Total: 9/20. This feels more like a "you didn't read the prompt's constraint" grade rather than "you know nothing." Let's aim for around 10/20 to be fair but firm on the technical error. Actually, looking closer at Part 2, missing the "Dominance not EV" instruction is a major failure. Let's stick closer to 8-10/20. I'll go with 9/20. It highlights the critical error.

      *   *Wait, let's look at the "TA Persona":* A TA would notice the student ignored the "Dominance not EV" instruction in the prompt preamble. This is the biggest issue. The feedback needs to hammer this home gently but clearly.

  4.  **Drafting the Comments:**
      *   *Style:* Red pen style. Margin notes. Specific references to lines.
