  6.  **Refining the Output:**
      *   Make sure it looks like feedback on a paper.
      *   Use American spelling (wagering, color/colour - actually philosophy usually prefers standard US, so 'wagering', 'analyze').
      *   Ensure the marginal comments correspond to specific parts of the text.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Wrong." I need to say "This would be right for EV, but the prompt specified Dominance." That is the key pedagogical moment.

      *Part 1:* Student says "extra gods are just extra possibilities stacked on the 'God doesn't exist' side." This is false. A Muslim God is not "No God." A Spiteful God makes Wagering *worse*.
