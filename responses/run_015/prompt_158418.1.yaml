answer: |-
  1. Consider a river basin spanning fifty autonomous municipalities where upstream waste disposal systematically destroys downstream agriculture, and decades of voluntary bilateral compacts have failed to establish uniform filtration standards. Rigorous application of subsidiarity dictates that the regional authority must assume regulatory control because the lower-level units demonstrably lack the capacity to achieve the objective of clean water independently.
  2. The proximity interpretation concedes that functional reach outweighs physical distance, while the comparative-efficiency view argues centralization reduces transaction costs among fifty distinct actors. Both interpretations agree that local fragmentation prevents the effective realization of the policy goal.
  3. The democratic-accountability lens supports the shift because voters cannot effectively sanction multiple local mayors for a collective failure that only a single regional body can resolve. Thus, centralization restores the link between political responsibility and administrative power.
  4. The structural feature producing this centralist verdict is the mismatch between the ecological scale of the watershed and the jurisdictional scale of the municipalities, creating negative externalities that local boundaries cannot contain. This asymmetry renders local action inherently insufficient, triggering the subsidiarity clause that empowers the higher level when objectives cannot be sufficiently achieved by lower levels.
  5. A localist advocate could argue that the failure of voluntary compacts stems from poor design rather than inherent local incapacity, suggesting a federated council of municipalities could achieve the objective without full regulatory surrender. This challenge maintains the principle by demanding stricter proof that lower-level action is impossible before invoking the exception for central intervention.
