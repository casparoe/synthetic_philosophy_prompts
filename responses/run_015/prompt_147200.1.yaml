answer: |-
  You cannot jointly satisfy the demand for a single "smarter than us" ordering and the demand for jagged profiles without explicitly restricting the domain of problems to a specific niche, such as the human environment.

  **Desiderata vs. Prejudices**
  *   **Generalization (Stored Knowledge):** Non-negotiable. Restated: The system must compress information to solve novel instances rather than retrieving cached input-output pairs.
  *   **Efficiency (Speed/Resources):** Non-negotiable. Restated: Intelligence is capacity per unit of computation; slower hardware reduces throughput, not intelligence, unless latency violates causal constraints of the task.
  *   **Invariance (Same Problem):** Non-negotiable. Restated: Capability must persist across changes in surface representation that leave logical structure intact.
  *   **Competence/Performance (Damaged Hardware):** Non-negotiable. Restated: Distinguish the underlying computational capacity from the physical ability to execute or express it.
  *   **Normativity (Falsifiability):** Non-negotiable. Restated: The theory must assign lower intelligence to a system you intuitively judge as duller, even if it mimics smart behavior.
  *   **Scope (Jagged Systems):** Non-negotiable. Restated: Intelligence must be representable as a vector across domains, not necessarily a scalar.
  *   **Collections:** Droppable. Collective intelligence is an emergent property of coordination mechanisms, distinct from individual cognitive capacity; treating it as the same concept conflates structure with agent capability.
  *   **Distinctness:** Meta-rule. This is satisfied if the above definitions hold; it need not be a separate axiom.

  **Missing Specialist Requirements**
  1.  **Goal-Relative Optimization:** Intelligence must be defined relative to a distribution of goals and environments (Legg & Hutter); without specified goals, "solving" is undefined.
  2.  **Sample Efficiency:** Distinguishes learning capacity from computation speed; a system that requires a billion examples to learn what a dog learns from one is less intelligent, even if it eventually succeeds.

  **Testing Your Suspicions**
  *   **Jaggedness vs. "Smarter Than Us":** Confirmed. If intelligence is a vector (jagged), "smarter" is undefined without a weighting function over domains. A system smarter than us in physics but dumber in social navigation is only "smarter" relative to a specific niche.
  *   **Same Problem vs. Stored Knowledge:** Disconfirmed. They are distinct. A lookup table can store both word and diagram versions of a puzzle (satisfying Invariance) without reasoning (violating Generalization). However, in practice, failure of Invariance is the primary evidence for reliance on Stored Knowledge.
  *   **Damaged Hardware:** Disconfirmed. This is not sentimental; it is the technical Competence/Performance distinction. A theory that labels a paralyzed genius as unintelligent is measuring output bandwidth, not intelligence.

  **Impossibility Result & Most Exclusionary Requirement**
  *   **Impossible Subset:** You cannot satisfy **Universal Scalar Ordering** (a single "smarter than us" number), **Jaggedness** (domain-specific profiles), and **No Free Lunch** (no system dominates across all possible problem distributions) simultaneously. You must drop the Universal Scalar or restrict the problem domain to a specific niche (e.g., "human-relevant tasks").
  *   **Most Exclusionary Requirement:** **Generalization (Stored Knowledge).** This excludes behaviorist accounts, lookup tables, and current large language models if they are shown to rely on surface-statistical matching rather than structural compression.

  **Scoring Standard Families**
  *   **Psychometric (g-factor):** Handles human ranking well; fails cross-species/machine comparison; assumes a single scalar despite evidence of jaggedness.
  *   **Behavioral (Turing/Test):** Handles chatbot dispute poorly; fails Generalization requirement (cannot distinguish lookup from reasoning); validates mimicry over capacity.
  *   **Algorithmic (Complexity):** Handles Efficiency well; fails Goal-Relative Optimization (defines difficulty without purpose); too abstract for biological systems.
  *   **Functionalist (Goal-Optimization):** Handles superintelligence claim best; handles Jaggedness via environment weights; struggles to objectively define "goals" without anthropomorphism.
