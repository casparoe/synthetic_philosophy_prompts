  hey — I need a Q&A prep sheet for my thesis defense on Thursday, and I want the prep sheet, not a defense of the view. American English please. Also: no bibliographies, no citations, no reading lists — I know the literature fine, I just have to survive an hour of questions, and I won't be able to look anything up in the room.

  Here's the chapter. The thesis is that moral responsibility is entirely a matter of the fittingness of reactive attitudes, but that the fittingness facts aren't fixed independently of our practices of holding people responsible — because reactive attitudes are plastic. Being the sustained target of resentment, contempt or blame changes a person: it degrades the very capacities (to see others as participants, to feel guilt, to take reasons seriously in the way Strawsonians care about) in virtue of which blame is supposed to fit them in the first place. So there's a feedback loop: the practice of holding responsible partly makes and unmakes the property it's answering to. I call this the plasticity constraint. I argue (a) that any Strawsonian account that can't represent this loop is incomplete, (b) that it explains why excessive or structurally biased blaming is worse than merely unfair — it's self-fulfilling, it manufactures the impairment it then points at, and (c) that this gives us a new object of blame: a community or an institution can be blameworthy for the way its blaming practices erode the agency of the people it blames, even when each individual act of blame seems fine.

  Sketch of the argument, in case you want to aim at it. Step one: I claim the reactive attitudes are the right starting point, not because they're a detection mechanism for some free-standing property, but because the participant stance is constitutive of the kind of relationship in which responsibility talk has a point. Step two: I note that participant-stance capacities are psychologically real, developmentally acquired, and responsive to social treatment — this is the empirical bit, and I lean on it heavily. Step three: from that I argue that the fittingness of blame at a time depends in part on the causal history of how that agent has been held responsible up to that time. Step four: I use that to distinguish two things people normally run together — blame that's unfitting because the agent didn't have the capacity, versus blame that's unfitting because we spent it down. Step five: I extend the accountability to the blamers, via the same apparatus, so it's not a special pleading.

  The committee:

  - The chair is a hardline Strawsonian of the "no metaphysics outside the practice" stripe. Her view is basically that asking whether the attitudes fit some independent fact is already confused, so my talk of fittingness conditions and causal histories sounds to her like I've smuggled in exactly the external standpoint Strawson was trying to dissolve. She'll be polite and devastating.
  - Second reader is a reasons-responsive compatibilist. He wants mechanisms and thresholds, and he'll say "fittingness" is doing zero work until I say what the mechanism is, how much reasons-responsiveness is enough, and how you'd ever tell whether an agent crossed the line.
  - Third reader is an experimental philosopher. She'll want to know what my view predicts that the competition doesn't, whether the plasticity claim is actually testable or just armchair developmental psychology dressed up, and what I'd do if the data went the other way.
  - One visiting faculty member works on oppression, blame and structural injustice. She'll like the plasticity point a lot and then argue that my version is too individualistic — agents and attitudes instead of norms, institutions and structures — and that I've psychologized something that's political.

  What I want from you: roughly eight objections, ordered by how likely they are and how much damage they'd do, phrased the way each of these people would actually put it — I want to be able to hear the accent, so to speak, and I want to know which one is coming from whom. For each: a reply that fits in about two minutes of speaking, a note on where that reply is weak or where I'm bluffing, and whether I should concede it up front or hold the line. Tell me which one or two things I absolutely can't give up without losing the thesis, and which one I'm better off just handing over early. And include the question I'm hoping nobody asks — my own guess is something like "if blame degrades the capacity that makes blame fit, doesn't your view just collapse into the claim that we should basically never blame anyone," which I have a bad feeling about, but tell me if that's not the one I should actually be losing sleep over.

  I've been staring at this chapter for nine months so I've definately lost perspective on wich parts are doing real work and which parts I just think are cool. Be blunt about that too if you can see it from the summary.
