answer: |-
  # Thesis Defense Q&A Prep Sheet
  **Topic:** The Plasticity Constraint on Moral Responsibility
  **Time Limit:** ~2 minutes per reply
  **Tone:** Direct, defensive but charitable, American English

  ---

  ### 1. The "External Standpoint" Objection (The Chair)
  **Who:** The Hardline Strawsonian Chair.
  **The Question:** "You keep talking about 'fittingness conditions' that depend on causal histories of psychological degradation. But Strawson's whole point was that there are no facts about responsibility outside the practice of the reactive attitudes themselves. By judging our practices against these independent 'plasticity facts,' aren't you smuggling in the objective standpoint Strawson warned us against? You're trying to stand outside the participant stance to judge it."

  **The Reply:**
  "I appreciate the force of that, and I want to be clear: I'm not positing independent metaphysical facts. I'm arguing that the *internal aims* of the participant stance generate these constraints. The point of holding someone responsible is to maintain a relationship of mutual recognition. If my blaming practice systematically destroys the capacity for mutual recognition in the target, it defeats its own internal purpose. I'm not judging the practice from outside; I'm showing how the practice can become self-defeating on its own terms. The 'plasticity constraint' isn't an external metric; it's a condition for the sustainability of the participant stance itself. If we blame in a way that makes participation impossible, we aren't being 'more responsible,' we're opting out of the practice entirely."

  **Weakness/Bluff:** You're walking a tightrope. You *are* using empirical facts (psychological degradation) to normatively constrain the practice. A hardliner might say facts about psychology are still "external" to the normative logic of the attitudes.
  **Strategy:** **Hold the line.** This is the core metaphysical move. If you concede you're using an external standpoint, you lose the Strawsonian framework entirely.

  ### 2. The "Collapse into Skepticism" Objection (Your Nightmare)
  **Who:** General Committee / Anyone who grasps the loop.
  **The Question:** "If blame degrades the very capacities that make blame fitting, and unfitting blame is impermissible, doesn't your view collapse into the claim that we should basically never blame anyone? Every act of blame risks degradation. Aren't you arguing yourself out of the possibility of responsibility?"

  **The Reply:**
  "No, because the constraint isn't a prohibition on blame, it's a calibration requirement. I'm not saying blame *always* degrades capacity; I'm saying *excessive* or *structurally biased* blame does. There's a difference between holding someone to account in a way that invites them back into the moral community, and blaming them in a way that casts them out. My view demands we blame *more carefully*, not that we stop. In fact, ignoring the plasticity constraint is what leads to the real skepticism—when we blame people who have been psychologically broken by our own practices, we're treating them as responsible when they no longer are. My view protects responsibility from becoming a sham."

  **Weakness/Bluff:** You need to be sure you can distinguish "calibration" from "prohibition" in practice. It's easy to say, harder to show where the line is.
  **Strategy:** **Hold the line.** This is the existential threat to the project. If you concede this, the thesis becomes "responsibility is impossible," which is not what you wrote.

  ### 3. The "Mechanism and Threshold" Objection (Second Reader)
  **Who:** The Reasons-Responsive Compatibilist.
  **The Question:** "You say fittingness depends on whether capacities have been 'spent down.' But 'fittingness' is doing zero work until you tell me the mechanism. How much reasons-responsiveness is enough? What's the threshold where someone crosses from 'responsible but strained' to 'capacity degraded'? Without that, your view is just a vibe."

  **The Reply:**
  "I agree we need precision, but I resist the idea that 'fittingness' requires a hard threshold like a voltage meter. Responsibility judgments are holistic. However, the plasticity constraint gives us a specific diagnostic tool: we look at the history of treatment. If an agent's responsiveness has dropped correlates with intense, sustained hostility from the community, we have reason to suspect the blaming practice is causing the impairment. We don't need a exact number; we need a causal story. My view adds a historical variable to your mechanism: current capacity is a function of past treatment. That makes the threshold dynamic, not static."

  **Weakness/Bluff:** He's right that "fittingness" is vague. You are bluffing that a "dynamic threshold" is operationally useful enough for a compatibilist.
  **Strategy:** **Concede partially.** Admit you aren't providing a algorithm, but insist that adding the historical variable is an improvement over static models. Don't promise false precision.

  ### 4. The "Psychologizing Politics" Objection (Visitor)
  **Who:** The Oppression/Structural Injustice Scholar.
  **The Question:** "I love the plasticity point, but you're still grounding this in individual agents and individual attitudes. Structural injustice isn't just the sum of individual blaming acts; it's embedded in norms, laws, and institutions. By focusing on the psychology of the blamer and the blamed, aren't you psychologizing something that's fundamentally political?"

  **The Reply:**
  "That's a fair concern, and I agree the political dimension is crucial. But I'd argue you need the psychological mechanism to explain *how* the structure harms agency. Institutions don't act; people acting within institutional roles do. The 'structural' harm happens because the institution licenses individual actors to blame in ways that degrade capacity. My account of institutional blame is meant to bridge that gap: an institution is blameworthy when its norms sustain practices that erode agency. I'm trying to give you the micro-foundations for the macro-claim. Without the psychological plasticity, the structural claim lacks a mechanism of harm."

  **Weakness/Bluff:** You are vulnerable here. Your thesis is heavily individualistic in its setup (reactive attitudes are interpersonal). Extending it to institutions is the weakest link.
  **Strategy:** **Concede up front.** Acknowledge this is a limitation of the current chapter. Frame it as "Step 1: The Mechanism," implying Step 2 is the full political theory. Don't fight them on the scope; fight them on the necessity of the mechanism.

  ### 5. The "Empirical Contingency" Objection (Third Reader)
  **Who:** The Experimental Philosopher.
  **The Question:** "Your whole view hinges on the empirical claim that blame degrades agency. But what if the data goes the other way? Some studies suggest shame can motivate reform. If blame actually *strengthens* reasons-responsiveness in some contexts, doesn't your plasticity constraint flip? And how do you test this without just doing armchair psychology?"

  **The Reply:**
  "If the data showed that blame consistently strengthened agency, then my normative conclusion would flip—we would have a duty to blame more intensely. My view is contingent on the empirical facts, and that's a feature, not a bug. However, the literature on chronic stigma and hostile attribution bias suggests that sustained contempt degrades social-cognitive capacity. I'm not claiming blame *always* degrades; I'm claiming there's a specific profile of blaming—sustained, hostile, non-reparative—that does. The testable prediction is: communities with high-punishment/low-reintegration norms should show lower aggregate agency capacities over time."

  **Weakness/Bluff:** You are betting the farm on specific psych literature. If she cites a specific study contradicting you, you're stuck.
  **Strategy:** **Hold the line on the principle, concede on the data.** Emphasize that the *structure* of the argument holds even if the empirical input changes. You're offering a framework, not a final empirical report.

  ### 6. The "Infinite Regress" Objection (General)
  **Who:** Second Reader or Chair.
  **The Question:** "You say communities can be blamed for eroding agency. But who does the blaming? If we blame the community, aren't we risking further degradation? If the community is impaired, can it respond to blame? Aren't you setting up an infinite regress of blame about blame?"

  **The Reply:**
  "It's not a regress because the levels are distinct. We aren't blaming the community for *being* impaired; we're blaming the practices that *cause* the impairment. The target of the blame shifts from the individual agent to the normative structure sustaining the practice. And yes, the community can respond—not by feeling guilt like an individual, but by reforming its norms. The goal isn't to punish the community into oblivion; it's to interrupt the feedback loop. Once the practice changes, the degradation stops, and the capacity for responsibility can recover."

  **Weakness/Bluff:** "Community guilt" is metaphorical. You're stretching the Strawsonian framework here.
  **Strategy:** **Hold the line.** This is essential for part (c) of your thesis. Just clarify that "institutional blame" looks different than "individual blame."

  ### 7. The "So What?" Objection (General)
  **Who:** Anyone, likely late in the defense when tired.
  **The Question:** "Even if you're right, does this change anything? Strawsonians already say we blame to maintain relationships. You're just adding that we should be nice about it. Is this actually a new theory of responsibility, or just a moral injunction to be kinder?"

  **The Reply:**
  "It's not just an injunction to be kinder; it changes the truth conditions of responsibility claims. On standard views, if you have the capacity, you're responsible, full stop. On my view, you might have the capacity now, but if I helped destroy it yesterday, my blaming you now is unfitting in a way it wouldn't be otherwise. It makes responsibility historically sensitive. That changes who we hold responsible, not just how we treat them. It means some people we currently blame are actually victims of our blaming practices, and that's a metaphysical claim, not just a moral one."

  **Weakness/Bluff:** It's easy for them to dismiss this as "applied ethics" rather than "metaethics."
  **Strategy:** **Hold the line.** Emphasize the "historically sensitive" part. That's the philosophical meat.

  ### 8. The "Agency of the Institution" Objection (Visitor/Chair)
  **Who:** Visitor or Chair.
  **The Question:** "You say institutions can be blameworthy. But institutions don't have reactive attitudes. They don't feel resentment or guilt. How can an entity that can't participate in the participant stance be a target of the participant stance?"

  **The Reply:**
  "I'm not claiming institutions have feelings. I'm claiming they sustain practices that simulate the participant stance. When an institution blames, it's enacting a normative stance through its agents. We hold them responsible by directing reactive attitudes at the *structure*—indignation at the policy, demand for reform. It's an extended sense of the participant stance, analogous to how we hold corporations responsible without expecting them to cry in the dock. The fittingness condition is whether the institutional response preserves or erodes the agency of the participants within it."

  **Weakness/Bluff:** This is the weakest metaphysical link. You are stretching "reactive attitudes" to cover bureaucratic processes.
  **Strategy:** **Concede the stretch.** Admit it's an extension of Strawson, not pure Strawson. Say you're updating the framework for social complexity.

  ---

  ### Blunt Assessment: What's Work vs. What's Cool

  1.  **The Core (Do Not Sacrifice):** Steps 3 and 4. The claim that fittingness depends on the causal history of blaming (Plasticity Constraint) and the distinction between "lack of capacity" vs. "spent capacity." This is your original contribution. If you give this up, you have nothing.
  2.  **The Vulnerable Flank (Concede Early):** Step 5 (Institutional Blame). You are trying to do too much here. The metaphysics of institutional agency is a rabbit hole. If the Visitor or Chair attacks this hard, concede that this is a "promissory note" for future work. Don't let them drag you into defining corporate guilt for an hour. It distracts from the individual plasticity argument, which is stronger.
  3.  **The "Cool" Factor:** The idea that blame is self-fulfilling is rhetorically powerful, but make sure you don't sound like you're saying "blame creates crime." Be precise: it erodes the *capacities* required for responsibility.

  ### The Real Nightmare Question

  You are worried about the **"Collapse into Skepticism"** question ("Should we never blame?").
  **Don't lose sleep over that one.** It's easy to deflect with the "calibration vs. prohibition" distinction.

  **The actual killer is Question #1 (The Chair's "External Standpoint" objection).**
  If the Chair decides you have misunderstood Strawson and are trying to ground norms in empirical facts (naturalizing the normative), she can fail you on methodological grounds. She holds the keys to the kingdom.
  *   **Priority:** Spend 40% of your mental energy preparing for Question #1.
  *   **Mantra:** "I am not judging the practice from outside; I am identifying the internal conditions for its sustainability."
  *   **If you wobble on this:** You look like you don't know the literature.
  *   **If you wobble on the Skepticism question:** You look like you haven't thought about implications.
  *   **Verdict:** The Chair's objection is fatal. The Skepticism objection is manageable.

  ### Final Survival Tip
  When you don't know the answer, do not bluff. Say: "That's a significant challenge to the extension of the view. In this chapter, I've focused on the individual mechanism because I needed to secure that first. I'd want to think more about how that scales before committing to a position." That sounds like a scholar, not a student who forgot their notes. Good luck on Thursday.
