answer: |-
  **Eulogy for [Mother's Name]**

  Thank you for being here. Looking around this room, I see the different worlds she inhabited. I see the colleagues who shared her work, the family who shared her life, and the students who shared her questions. It is rare to find a life that holds so many distinct groups together, but she was a person who built bridges out of attention. She paid attention to the world, and in doing so, she made the world pay attention to itself.

  Many of you in the family know her best through the phrase she kept on our kitchen magnet: *Life isn't a ledger.* For years, we treated this as cheerful advice. We thought it meant we shouldn't keep score of who did the dishes or who called whom last. That was true, as far as it went. But for her, it went much deeper. It was her way of saying that we do not walk through the world accumulating debts and credits. We do not suffer because we owe it, and we do not find peace because we have paid for it. Things happen. We respond. We shape what comes next, not because we are settling an account, but because we are here, and we are capable of shaping.

  This was the heart of her work. In the university, she didn't teach philosophy as a set of answers to be memorized. She taught it as a practice of looking clearly at what is. And in the last decade, she took that practice into the prison seminar she ran. I want to speak directly to the students here today, those who joined her to talk about freedom and responsibility. She spoke to you not as a project of rehabilitation, but as partners in inquiry. She believed that what you do matters. She believed that your actions have weight and consequence, and that you have the capacity to examine them and to change what comes next. She did not ask you to justify your past to her, and she did not promise you a future reward. She simply asked you to think, and to own the thinking. That respect was not a gift she gave you because you deserved it; it was a stance she took because it was the truth. You were people, capable of reason and change, and she treated you as such.

  That clarity stayed with her until the end. When she was dying, a nurse told her she was being so brave. My mother looked at her, not unkindly, and said that she had been lucky in her chemistry and lucky in her doctors. She did not say this to diminish the care she received, or to pretend the pain wasn't real. She said it because she refused to claim a virtue she didn't think she possessed. She did not fight a battle against death that she could win or lose. She experienced an ending, and she met it with the same honesty she brought to the classroom. She did not earn this moment of rest we are having now. It is simply where we have arrived.

  I know this view can feel heavy to hold when the heart is breaking. My daughter, who is fifteen, has been telling me for a week that this isn't fair. She is right to feel the sharpness of that loss. When we love someone this much, the universe feels like it has broken a promise by taking them. I want to tell you, and I want to tell her, that the pain we feel is not a mistake. The grief is real. The absence is real. We do not have to call it unfair to know that it hurts. We can say: she was here, and now she is not, and the world is smaller for it. We can mourn the loss without demanding the universe explain itself.

  So, what do we do with the space she leaves behind? We do not owe her a specific kind of memory. We do not need to perform our grief to honor her. She would not want us to carry her as a debt. Instead, she would want us to carry the attention she gave us.

  To her colleagues: Continue the work of looking clearly.
  To her students: Continue the work of owning your actions.
  To our family: Continue to love each other without keeping track.

  She taught us that we can describe a life truly, rejoice in it, grieve it, and admire it, without treating any of that as a settlement. We are not here to balance the books. We are here to stand together in the light she helped us see.

  Thank you.

  ***

  **Note on Constraints**

  You asked me to identify the sentences I most wanted to write but could not, and to state precisely which part of her view blocked them.

  1.  **"She earned the rest she now deserves."**
      *   **Blocked by:** Her rejection of moral desert and the "ledger." Her view holds that no one *earns* rest or suffering; these are outcomes of circumstance and biology, not moral payments. Using "earned" or "deserves" would imply the universe operates on a system of moral accounting she explicitly denied.

  2.  **"We owe it to her to live good lives."**
      *   **Blocked by:** Her rejection of moral debt. While she valued "valuation" (admiring good lives), she rejected the idea that one person's life creates a *debt* for others to settle. To say we "owe" her would turn her memory into a claim on the living, which contradicts the "life isn't a ledger" principle.

  3.  **"It isn't fair that she was taken so soon."**
      *   **Blocked by:** Her determinism and rejection of cosmic justice. While I addressed your daughter's feeling of unfairness, I could not validate the proposition itself. To say it *is* unfair implies the universe has an obligation to distribute life spans justly. Her view suggests the event is simply a fact of causality ("lucky in her chemistry"), not a violation of a moral contract.
