prompt: |-
  Hey — I'm in a tiny reading group that's working through the population ethics stuff (Parfit's repugnant conclusion, the mere-addition paradox, the bit where a choice changes *who* exists so nobody is harmed), and we decided to write down our gut verdicts on a pile of cases before reading any of the theory, so we don't just end up parroting whichever view we read last. Mine are below and they don't obviously add up. Scale: welfare from -100 to +100, where 0 is a life neither worth living nor not worth living, +100 is about as good as a human life could possibly be. Also: please don't hand me a reading list or point me at papers — I'm offline for a week, so anything I can't get from your answer is useless to me, and explain any jargon (I've seen the phrase critical-level totalism floating around but couldn't tell you what it says).

  My verdicts, as best I can state them:

  - A: ten billion people all at +100. B: the same ten billion at +100, plus ten billion more at +1, living in a galaxy we'll never contact. I think B is fine — not worse than A, maybe a hair better. It feels wrong to me to say adding lives that are barely worth living makes things worse.
  - Z: 10^24 people all at +2. I really don't want to say Z is better than A; my gut says it's worse, or at least that it isn't an improvement. But I also can't find any single step in the chain from A to Z (add a lot of barely-positive lives, nudge everyone else up slightly, repeat) that I'm willing to call a worsening. I know that's the paradox, I'm reporting it anyway.
  - Shrink it down: one person at +100, versus that person plus one more at +1. Fine, slightly better. Two extra. Fine. I can't locate a number where it stops being fine, which is what makes me suspicious of my Z verdict rather than of my B verdict.
  - One person living a thousand years at +50, versus ten people each living a hundred years at +50. I have basically no preference — those feel equally good to me. Which seems to commit me to something total-ish, which pushes me toward Z, which I resist.
  - The ecstatic-minute case: a billion lives that are eighty years of mild tedium at about -3 plus one genuinely transcendent minute worth +10, net +7 each. I *don't* feel these are equivalent to a billion lives at a steady +7; I feel a bit bad about creating the first batch and not at all bad about the second. So I'm apparently not just summing welfare over a life.
  - A dip: a life at +60 for eighty years with one afternoon at -2. Obviously worth living, nothing to complain about. But now imagine ten billion lives like that — a lot of tiny sub-zero segments adding up to a big negative total. I refuse to conclude that world is bad on account of the afternoons.
  - Bad lives: ten people at -80, versus 10^12 people at -0.5. Part of me says the second is vastly worse (so much more suffering in total), part of me says each of those -0.5 lives isn't a tragedy while each -80 life is. I hold both and it bugs me.
  - Procreation: creating a child who will have a life at -5 seems clearly wrong to me. Declining to create a child who would have had +5 seems not wrong — nobody is harmed. But now: a couple can conceive now, or wait a month; conceived now the child has +5, conceived later a *different* child has +95. I feel waiting is (mildly) the better choice, even though the child who exists isn't harmed and the other one never exists. So my asymmetry verdict and this verdict seem to be pulling in opposite directions.
  - Extinction, painless, no future people at all, versus a remnant of a thousand people at +1 whose descendants continue at +1 indefinitely. I'm weakly for the remnant. Against a remnant whose lives are all at -1, I'm strongly against.

  The one I go back and forth on weekly: humanity spreads to the stars and ends up with 10^18 people at a solid +30 — real loves, real projects, real art, nothing diminished — versus staying home with ten billion people at +90. Some days the first sounds obviously better and some days it sounds like a spiritual catastrophe.

  My own stab at a principle, which I'm fairly sure is a mess: sum over everyone of (their lifetime welfare minus a critical level of about 25); but patch it so that (i) lives between 0 and the critical level still contribute a small *positive* amount, so pure addition never makes things worse; (ii) lives below 0 subtract in full; and (iii) there's a bonus for a population containing many genuinely different kinds of valuable life, which tapers off as the population gets enormous. I'm sure step (iii) is bureacratic bullshit and that the threshold in the main clause is arbitrary, but I don't know how to get my verdicts without them.

  So: test that principle against my cases, tell me where it breaks, and give me two to four repaired or rival candidates instead — stated precisely enough that I can apply them myself, with each clause tied to the case that motivates it, and with an honest list of which of my verdicts each one forces me to drop. For each candidate I also want its verdicts on cases I *haven't* listed: an empty world versus one person at exactly +25; two islands nobody travels between, one with 10^9 people at +90 and one with 10^9 at +25, compared against just the first island; an exact duplicate of an existing happy population placed on a second island (does value double, and is that absurd?); 10^40 lives at +0.001; and my galaxy case.

  Format: first a table with these columns — principle_name | statement (one precise sentence, no hedging) | clauses_with_motivating_case | my_verdicts_kept | my_verdicts_overturned | galaxy_verdict | duplicate_island_verdict | empty_vs_plus25_verdict | adhoc_clause_count | fit_out_of_5. Then a JSON object with fields: winner (name), principle_statement (string), clauses (array of objects with keys clause and motivating_case), verdicts_i_should_give_up (array of strings, each with a one-sentence reason), unlisted_predictions (object with keys empty_vs_plus25, two_islands, duplicate_island, 10^40_at_0.001, galaxy_case), repair_of_my_original (string), what_feels_most_unresolved (string), and confidence_0_to_1 (number).
