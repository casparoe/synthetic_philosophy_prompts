answer: |-
  ### Jargon Check
  **Critical-Level Totalism (or Utilitarianism):** This view says you calculate the value of a population by summing everyone's welfare, but first subtracting a "critical level" (say, +25) from each life. Lives above +25 add positive value; lives below +25 add negative value (even if they are still worth living, e.g., +10). This avoids the Repugnant Conclusion (because adding masses of low-positive lives drags the total down) but risks the "Sadistic Conclusion" (adding lives worth living makes things worse).

  ### Testing Your Principle
  Your proposed principle is a **Variable Critical-Level View with Diversity Weighting**. It breaks in three places:
