answer: |-
  hey, this is exactly the right move because you are correct that the literature often seduces you into solving a puzzle rather than solving your problem, and if you don't anchor the theory to the jobs you actually need it to do, you will end up with a precise answer to a question you didn't ask. so here is the spec sheet you need, written out as a continuous narrative so you can see how the constraints pull against each other. first, you need the theory to accommodate the inarticulate expert, like the chicken-sexer or the face recognizer, which means knowing-how cannot be strictly reduced to knowing-that or the ability to articulate propositions, and I would mark this as non-negotiable because if your theory says the expert doesn't know how just because she can't explain it, you have defined away the phenomenon you are trying to study. the next thing i'd ask is that it distinguishes that expert from the brittle beginner who has all the instructions and gets it right slowly but falls apart when conditions deviate, which means knowing-how must involve a robustness or flexibility that mere knowledge of rules does not guarantee, and this is also non-negotiable for your teaching job because if knowing-how were just knowing-that, then handing out the manual would be sufficient for teaching, which your gut already tells you is wrong. then you have to account for the pianist with injured hands who temporarily cannot move her fingers but hasn't forgotten how to play, which requires the theory to separate the possession of the skill from the current ability to execute it, and this is where you hit your first major wall because it conflicts with the simple view that knowing-how is just a disposition to succeed, since the disposition is currently blocked, yet we want to say the knowledge remains. related to that is the case of the person who succeeds by luck, which means the theory needs a non-accidental condition so that getting it right once doesn't count as knowing-how, and this is non-negotiable for your ai assessment job because a model might output correct code by statistical coincidence without understanding the logic. you also need to handle the separation between the aging coach who can see errors but not perform and the athlete who performs beautifully but can't teach, which means knowing-how to do and knowing-how to teach or analyze are distinct capacities, and if the theory collapses these, it won't help you understand what a teacher is producing in a student versus what a performer is producing on the field. now we get to the empirical profile you mentioned, which is that knowing-how decays with disuse and comes back faster on relearning than it was acquired, unlike knowing-that which tends to persist or vanish without that specific recovery curve, and i think this should be a strong constraint even if some philosophers might call it a prejudice, because if the theory treats knowing-how as a static relation to a proposition, it has no resources to explain why the relation degrades like a muscle memory and then reactivates quickly. you also need to ask whether the skill is one thing or many, so the theory should have a stance on granularity, like whether cycling is one skill or if cycling on ice is a different one, because this matters for transfer learning in both humans and machines. another requirement is that the account must handle complements that aren't about producing success, like knowing how not to offend or knowing how to lose gracefully, because if knowing-how is purely teleological toward a successful outcome, it misses the normative constraints that define expertise in social contexts. finally, you need to explain how know-how gets transmitted by demonstration and correction when nothing propositional seems to change hands, which is non-negotiable for your teaching job because if transmission requires propositions, then coaching becomes lecturing, and you already suspect that's wrong. now regarding the conflicts you suspected, you are right that there is a collision course between the requirement not to reduce knowing-how to a current ability (because of the pianist) and the requirement to explain the decay-and-relearning data (which looks like it's about dispositions), because if it's not an ability, why does it behave like one over time, and this tension is where most theories break. i think the single requirement that does the most damage to the most popular views is the decay-and-relearning profile, because both the standard intellectualist view and the standard rylean view treat knowing-how as a static state rather than a dynamic physiological or cognitive trace that fades and reactivates, so almost everyone has to shrug at this data. as for how the camps fare against this list, a strict rylean anti-intellectualism scores well on the brittle beginner and the transmission cases because it emphasizes practice and disposition, but it takes a heavy hit from the pianist case since it often defines knowing-how as the ability itself, and it struggles with the coach case because it downplays the intellectual element required to analyze performance without doing it. the intellectualist reply scores well on the coach case and the pianist case because it locates the knowledge in a propositional attitude that persists despite inability, but it fails the inarticulate expert and the transmission cases because it cannot easily explain how non-propositional demonstration transfers propositional knowledge without inference. so you are left with a choice of which failures you can tolerate, but my advice is to demand that whatever theory you adopt must at least have a place for the decay data, because ignoring the temporal dynamics of skill is what allows the philosophers to keep arguing about static definitions while you are trying to understand learning systems that change over time.
