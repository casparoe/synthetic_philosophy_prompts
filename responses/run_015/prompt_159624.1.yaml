      *   *Critique:* Is "Causal Emergence" too buzzwordy?
      *   *Fix:* Frame it as "Intervention Robustness."
      *   *Critique:* The prompt asks for 8 postdoc-years over 3 years. That's roughly 2-3 postdocs full time. The questions need to be substantial enough.
      *   *Fix:* Ensure the questions are programs of work, not single papers.
      *   *Critique:* The prompt asks specifically about the worry regarding the Monday Test.
      *   *Fix:* Make this a distinct, substantial section.

  8.  **Final Polish:**

      *   Check tone: Professional, analytical, direct (no fluff).
