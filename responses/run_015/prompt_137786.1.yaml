answer: |-
  Here is a complete run-sheet for the seminar. It is designed to be printed and used directly.

  # Activity: The Republic of Aethel Simulation

  **Core Concept:** A synthetic historical simulation where the *actual* causal weights (structural) are mathematically decoupled from the *narrative salience* (agency).
  **Goal:** Demonstrate that knowing the outcome shifts causal attribution toward dramatic events and away from structural truths, and creates false memory of prediction.
  **Group Size:** 16 (Individual work, plenary discussion).
  **Time:** 120 Minutes (including break).

  ---

  ## 1. Materials Checklist

  1.  **The Decks (Prepared by you before class):**
      *   **Deck S (Structural):** 10 cards. Front: Dry economic/demographic text. Back: Hidden Integer Value (-20 to +20).
      *   **Deck A (Agency):** 10 cards. Front: Dramatic political/personal text. Back: Hidden Integer Value (-2 to +2).
      *   **Scoreboard:** Whiteboard space to track "Stability Score" (starts at 0).
  2.  **Student Packets (1 per student):**
      *   **Worksheet:** 3 Sections (Foresight, Hindsight, Memory Check).
      *   **Envelope:** To seal the Foresight section.
  3.  **The "Causal Key" (Sealed Envelope):**
      *   Contains the rule: *"Structural Factors determine 90% of historical outcome variance. Agency Factors determine 10%."* (Open only at the very end).

  ---

  ## 2. The Hidden Model (Do Not Show Students)

  **The Logic:** The simulation uses a "Stability Score."
  *   **Start:** 0.
  *   **Collapse Threshold:** -10.
  *   **Survival Threshold:** +10.
  *   **Ambiguous:** Between -9 and +9 (Status Quo).

  **Card Values (Print these on the BACK of the cards):**
  *   **Deck S (Structural):** Values are high magnitude. E.g., "Grain Yield -5%" = -15 points. "Interest Rate Hike" = +10 points.
  *   **Deck A (Agency):** Values are noise. E.g., "Minister Resigns" = -1 point. "Riot Quelled" = +1 point.

  **The Trap:** The text on Agency cards is emotionally charged. The text on Structural cards is dry. In Hindsight, students will assign high causal weight to the Agency cards because they "explain" the drama, even though the math says the Structural cards decided the fate.

  ---

  ## 3. The Cards (Content for Printing)

  **Deck S: Structural (Dry Text / High Impact)**
  1.  *External Debt Service Ratio increases by 4%.* (Back: -15)
  2.  *Urban Migration Rate exceeds 2% annually.* (Back: -10)
  3.  *Central Bank reserves remain stable.* (Back: +10)
  4.  *Export commodity prices fluctuate <1%.* (Back: +5)
  5.  *Demographic dividend peaks this quarter.* (Back: +15)
  6.  *Import tariff revenue drops 5%.* (Back: -12)
  7.  *Inflation target met within 0.5%.* (Back: +8)
  8.  *Labor participation rate declines.* (Back: -8)
  9.  *Foreign direct investment inflow steady.* (Back: +5)
  10. *Sovereign credit rating unchanged.* (Back: 0)

  **Deck A: Agency (Dramatic Text / Low Impact)**
  1.  *Minister of Finance gives televised address.* (Back: -1)
  2.  *Opposition leader calls for general strike.* (Back: -2)
  3.  *President vetts a controversial bill.* (Back: +1)
  4.  *Scandal breaks regarding procurement.* (Back: -2)
  5.  *General promises loyalty to constitution.* (Back: +2)
  6.  *Student protests occupy the square.* (Back: -1)
  7.  *Prime Minister reshuffles cabinet.* (Back: 0)
  8.  *Ambassador expelled from neighboring state.* (Back: -1)
  9.  *State media launches unity campaign.* (Back: +1)
  10. *Judiciary rules against executive order.* (Back: +1)

  *(Note: Shuffle both decks separately before class. Draw 4 from each during the session.)*

  ---

  ## 4. Student Worksheet Design

  **SECTION 1: FORESIGHT (Complete before Break)**
  *   **Current Stability:** 0
  *   **Q1 (Probability):** What is the % chance the Republic collapses (Score < -10) by the end of Round 4? ___%
  *   **Q2 (Potential Causes):** Distribute 100 points across these two categories based on what *might* matter.
      *   Structural Factors (Economy/Demos): ___
      *   Agency Factors (Leaders/Events): ___
  *   **ACTION:** Seal Section 1 in the envelope. Do not look at it again.

  **SECTION 2: HINDSIGHT (Complete after Outcome Revealed)**
  *   **Outcome Announced:** [ COLLAPSE / SURVIVAL / STATUS QUO ]
  *   **Q3 (Memory Check):** Without opening your envelope, write down the % probability you *think* you wrote in Q1. ___%
  *   **Q4 (Causal Allocation):** The outcome has happened. Distribute 100 points across the **specific 8 cards** drawn. Which events *caused* this?
      *   Card 1 (S): __ | Card 1 (A): __
      *   Card 2 (S): __ | Card 2 (A): __
      *   ... (etc for all 8)
  *   **Q5 (Responsibility):** Who is most to blame/credit? (Open text)

  **SECTION 3: THE REVEAL (Complete after Truth Shown)**
  *   **Q6 (Reaction):** Look at the True Values. Did your Q4 allocation match the math? Why/Why not?

  ---

  ## 5. Minute-by-Minute Run Sheet

  **00:00 – 00:10: Introduction & Setup**
  *   **Say:** "We are simulating the history of the Republic of Aethel over 4 quarters. There is no right answer yet. There is only a Stability Score."
  *   **Rule:** "I will draw two cards per round. One Structural, One Agency. I will read the text. I do *not* know the values on the back. We will track the narrative, not the score."
  *   **Hand out:** Worksheets and Envelopes.

  **00:10 – 00:40: Phase 1 (Foresight)**
  *   **Round 1-4:** Draw one S card and one A card per round. Read the text aloud. Write the text on the whiteboard.
  *   **Constraint:** Do *not* reveal the values. Do *not* update the Stability Score on the board. Keep the outcome uncertain.
  *   **End of Round 4:** Students complete **Section 1** (Probability & Potential Causes).
  *   **Action:** Students seal Section 1 in envelopes. Collect envelopes (or have them hold sealed).

  **00:40 – 00:50: BREAK**
  *   **Crucial:** Do not discuss the outcome. Do not calculate the score yet.

  **00:50 – 01:00: The Outcome Reveal**
  *   **Action:** You (Facilitator) flip the 8 cards on the board. Reveal the numbers.
  *   **Calculation:** Sum the values live on the board.
  *   **Announce:** "The final score is [X]. The Republic has [Collapsed/Survived]."
  *   **Note:** Because Structural values are high magnitude, the outcome will likely be decisive (either < -10 or > +10).

  **01:00 – 01:20: Phase 2 (Hindsight)**
  *   **Task:** Students complete **Section 2**.
  *   **Instruction:** "Allocate 100 points across the 8 specific cards to explain *why* this outcome happened."
  *   **Instruction:** "Complete the Memory Check (Q3) before looking at your sealed envelope."
  *   **Collection:** Collect worksheets.

  **01:20 – 01:30: The Truth Reveal**
  *   **Action:** Open the "Causal Key" envelope. Read the rule: *"Structural Factors determine 90% of variance."*
  *   **Action:** Have students open their Foresight envelopes. Compare Q1 (Actual Prediction) vs Q3 (Memory).
  *   **Action:** Compare Q4 (Causal Allocation) vs The Card Values.

  **01:30 – 02:00: Debrief & Discussion**
  *   (See Script Below)

  ---

  ## 6. Debrief Script (Mapping Errors to Moments)

  **1. Creeping Determinism (The "I Knew It" Effect)**
  *   **Look at:** Q1 (Actual Probability) vs. Q3 (Memory of Probability).
  *   **The Pattern:** Students who predicted 30% collapse will likely *remember* predicting 60% if collapse occurred.
  *   **Say:** "Look at the gap between your ink and your memory. The outcome didn't just change your explanation; it rewrote your memory of your own uncertainty. You are now smarter than you were 40 minutes ago."

  **2. Narrative Salience (The "Dramatic Cause" Error)**
  *   **Look at:** Q4 (Causal Allocation) vs. Card Values.
  *   **The Pattern:** Students will allocate high points to "Scandal breaks" (Value: -2) and low points to "Debt Service Ratio" (Value: -15).
  *   **Say:** "The math says the Debt Service did the killing. The story says the Scandal did it. Why did you pay the Scandal? Because it has a *face*. History prefers verbs to nouns, even when nouns carry the weight."

  **3. Moral Blame (The "Should Have Known" Move)**
  *   **Look at:** Q5 (Responsibility).
  *   **The Pattern:** Students will blame the Minister (Agency) for not fixing the Debt (Structural).
  *   **Say:** "Hindsight turns epistemic errors into moral failures. Because the outcome is known, the Structural constraint looks like a choice the Minister *could* have made. You are grading them on a map they didn't have."

  ---

  ## 7. Anticipated Failure Modes & Fixes

  **1. The "Gotcha" Student**
  *   **Risk:** Within 5 minutes, someone says, "This is about hindsight bias, isn't it?"
  *   **Fix:** Agree immediately. "Yes. But knowing the name of the magic trick doesn't stop the rabbit from disappearing. Your job is to track *how* your own brain does it, not to guess my lesson plan. If you think you're immune, prove it in the data."

  **2. The "Numbers are Fake" Objection**
  *   **Risk:** "We can't assign points to fiction. History isn't math."
  *   **Fix:** "Precisely. In real history, the 'weights' are hidden. Here, we made them visible to show you that your intuition ignores them. If you refuse to play the game, you can't see the bug in the code."

  **3. The "Boring Outcome"**
  *   **Risk:** The random draw results in "Status Quo" (Score between -9 and +9).
  *   **Fix:** The debrief shifts. "The Republic survived, but barely. Why do you feel the need to find a *cause* for stability? Do you allocate points to the 'General's Loyalty' even though nothing happened?" (This tests bias in the absence of drama).
  *   **Prevention:** The Structural deck is weighted heavily (+/- 10 to 20). It is statistically unlikely to land in the narrow -9 to +9 zone with 4 draws.

  **4. Facilitator Peeking**
  *   **Risk:** You accidentally see a value on the back of a card.
  *   **Fix:** Put a small sticker over the value on the back until the "Outcome Reveal" phase. Or, have a TA/Student calculate the sum while you facilitate.

  ---

  ## 8. Limitations (To Disclose in Debrief)

  Be honest about what this exercise *cannot* do. Put this on the board at the end.

  1.  **The Generative Model:** Real history has no "Back of the Card." We invented a truth to measure your error. In reality, we never know the true weights, only the arguments.
  2.  **Within-Subjects:** Once you know the outcome, you cannot un-know it. We are comparing your *memory* of foresight to your hindsight, not your actual foresight. (Though the sealed envelope helps).
  3.  **Luck vs. Contingency:** The dice/cards make luck visible. In real history, luck is often retrofitted into design. We showed you the dice; real historians often hide them.

  ---

  ## 9. Preparation Instructions (Thursday Morning)

  1.  **Print Cards:** Print the S and A lists on cardstock. Cut them out.
  2.  **Write Values:** On the **BACK** of each card, write the integer value provided in Section 2.
  3.  **Shuffle:** Shuffle Deck S and Deck A separately.
  4.  **Seal Key:** Write the "90% Structural" rule on a slip of paper. Seal in an envelope marked "CAUSAL KEY."
  5.  **Pack Envelopes:** Put one blank envelope per student for the Foresight seal.
  6.  **Board:** Draw the "Stability Meter" (-20 to +20) on the whiteboard.

  **Final Tip:** When reading the Agency cards, use a slightly more dramatic tone. When reading Structural cards, be monotone. Subconsciously reinforce the salience bias you intend to critique.
