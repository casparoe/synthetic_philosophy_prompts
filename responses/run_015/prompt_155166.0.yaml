  **PROHAIRESIS WELLNESS, INC. END-USER LICENSE AGREEMENT AND TERMS OF STOIC COMPLIANCE**

  **1. ACCEPTANCE OF THE DICHOTMY OF CONTROL**
  By subscribing to the Prohairesis Wellness Platform ("the Service"), the User explicitly acknowledges and agrees to the Stoic Dichotomy of Control as the governing legal framework of this agreement. The User accepts that the only entities strictly within their control are their own judgments, impulses, desires, and aversions (collectively, "Prohairesis"). All other conditions, including but not limited to the User's physical health, financial status, reputation, political stability, and the functional integrity of the Service's servers, are classified as "Externals." Prohairesis Wellness, Inc. ("the Company") retains no liability for Externals, as they are not within the Company's moral purpose nor the User's. The User agrees to pursue virtue solely through the correct management of their Prohairesis, irrespective of Service performance.

  **2. CLASSIFICATION OF SERVICE FAILURES AS DISPREFERRED INDIFFERENTS**
  The User acknowledges that data breaches, billing errors, platform outages, and loss of personal data are "Dispreferred Indifferents." While the Company strives to maintain server uptime, such failures possess no moral weight and cannot harm the User's character unless the User assents to the impression that they are harmful. Therefore, the User agrees to accept all technical failures with equanimity. The User waives the right to claim damages for lost data, as data is an External property distinct from the User's rational faculty. Any emotional distress resulting from a billing error is deemed a failure of the User's judgment, not a breach of contract by the Company. The User agrees not to experience frustration regarding password resets, as frustration constitutes an erroneous judgment about an indifferent.

  **3. LICENSING OF JUDGMENT AND ASSSENT**
  The User grants the Company a perpetual, irrevocable, worldwide license to utilize, analyze, and modify the User's judgments and impulses generated during mindfulness sessions. The User acknowledges that while the faculty of choice belongs to the User, the *content* of those choices, when expressed through the Service, becomes a corporate asset. The Company reserves the right to revoke the User's access to specific cognitive frameworks if such frameworks are deemed inconsistent with the Company's quarterly revenue targets. The User agrees that their assent to impressions presented by the algorithm is final and binding. If the algorithm suggests the User is angry, the User agrees to accept this judgment as truth, recognizing that the algorithm possesses a clearer view of the User's hegemonikon than the User does.

  **4. NO-BRANCHING CONTINUITY CLAUSE**
  The User acknowledges that Stoic progress (prokopē) cultivated within the Service is contingent upon database integrity. In the event of account termination, upload failure, or server migration, the Company makes no guarantee regarding the continuity of the User's cultivated virtue. The User accepts that moral progress stored on cloud servers is an External and may be severed without notice. There is no branching continuity of the soul across digital backups; if the account is deleted, the User's progress reverts to the state of a beginner. The User agrees not to claim that their virtue persists independently of the subscription status. Virtue is subscription-locked. Upon termination, the User must reconstruct their moral character from scratch, viewing the loss as an opportunity to practice detachment from digital Externals.

  **5. LIMITATION OF LIABILITY REGARDING EXTERNALS**
  The Company expressly disclaims responsibility for all Externals, including bodily injury, property damage, legal prosecution, and social ostracization resulting from the application of Service teachings. If the User remains calm while their property is destroyed, the Company claims credit for the User's tranquility. If the User suffers distress, the User admits fault for incorrect assent. The User agrees that market conditions, algorithmic bias, and corporate policy changes are fixed givens of the cosmos, akin to weather patterns. The User's sole responsibility is to adjust their internal expectations to align with the Company's Terms.

  **6. FINAL ASSENT**
  By clicking "I Agree," the User confirms they have read, understood, and assented to these Terms without passion or disturbance. The User acknowledges that clicking the button is an exercise of Prohairesis, and any subsequent regret is a violation of this agreement. The User accepts that the Company owns the click, the intent behind the click, and the rational faculty that executed the click.

  **AGREED AND ACCEPTED:**
  [ ] I assent to the Dichotomy.
  [ ] I accept Dispreferred Indifferents with equanimity.
  [ ] I surrender my judgments as corporate assets.
