answer: |-
  Hi everyone. Thanks for coming. Thanks for braving the cross-disciplinary traffic.

  Look around the room. We have a split. Half of you worry about possible worlds and rigid designators. The other half worries about actual clinics and patient autonomy. Usually, you talk past each other. The metaphysicians say identity is fixed. The ethicists say harm is what matters. Today I want us to crash those two cars together and see what's left in the wreckage.

  I want to start with a hard claim. I know the philosophers here know it cold, and I know the ethicists hear it and think it's abstract. But for the next hour, I want us to treat origin essentialism not as a puzzle, but as the architecture of the problem.

  Here's the rule. If I come from this specific sperm and this specific egg, I couldn't have come from different ones. Change the gametes, you don't get me with a different life. You get someone else. That means the embryo isn't just a vessel for a person waiting to be optimized. It's the lock on the identity.

  Now, bring that into the IVF clinic. When we talk about embryo selection—screening for disease, selecting for traits—we are often talking as if we are helping a child avoid a bad life. We say we are acting in the best interests of the future child. But if the essentialist claim holds, that sentence breaks.

  If you select Embryo A over Embryo B, you aren't helping Child A avoid a disease. You are ensuring Child A exists instead of Child B. There is no single child across those two scenarios whose interests are being weighed. There are two different possible people.

  This is where I need you. The ethicists here work in harm and autonomy frameworks. You know the non-identity problem. But I want to push it further. If identity is fixed by origin, then "best interests" in selection cases might be a category error. You can't say one life is better for a person who wouldn't exist otherwise. You can only say one life is better than non-existence.

  So here's the tension. If essentialism is true, then selection doesn't harm the child not selected, because there is no child to harm. But it also means we can't claim we are benefiting the child selected, unless their life is so bad it shouldn't be lived at all.

  This leaves us in a weird spot. Clinics operate on the language of best interests. Patients operate on the hope of a healthy child. But if the metaphysics tells us there is no continuous subject across the choice, what are we actually doing? Are we maximizing welfare? Or are we playing god with identity?

  I don't have the answer. I need the metaphysicians to keep me honest on the identity stuff. Don't let me water down the essentialism just to make the ethics easier. And I need the ethicists to tell me if this breaks clinic practice. If "best interests" is incoherent here, what language do we use instead?

  Let's see if we can build a framework where the metaphysics doesn't just ornament the ethics, but drives it. Let's get into it.
