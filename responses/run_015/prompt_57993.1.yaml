answer: |-
  # Teaching Plan: The Two-Envelope Paradox for Backend Engineers

  **Session Duration:** 45 Minutes
  **Audience:** Backend Engineers (Simulation-minded, probability-literate, no decision theory background)
  **Goal:** Guide participants to identify the "bug" in the naive expected value calculation by treating the paradox as a specification error in a random number generation process.

  ---

  ## 1. Recommended Concrete Setup: The `generate_trial` Function

  Do not use abstract "God puts money in envelopes" language. Use a procedural specification that mirrors their daily work.

  **The Setup:**
  Define a function `generate_trial()` that executes the following steps:
  1.  Sample a base amount $A$ from a probability distribution $P(A)$.
  2.  Create two envelopes: one contains $A$, the other contains $2A$.
  3.  Randomly shuffle the envelopes (50/50 chance).
  4.  Return one envelope to the player (value $x$) and keep the other.

  **Inclusions:**
  *   **Explicit Distribution $P(A)$:** You must explicitly state that $A$ comes from *some* distribution, even if you initially leave it undefined.
  *   **Variable Binding:** Treat the observed amount $x$ as a return value from the function, not a universal constant.

  **Simplifications to Avoid:**
  *   **Do not assume a Uniform Distribution over Integers:** This is mathematically impossible over an infinite range. If you suggest this, engineers will try to "fix" it with a large cap (e.g., `randint(1, 10^9)`), which kills the paradox.
  *   **Do not start with a Fixed Pair:** Do not start by saying "Imagine the envelopes contain \$10 and \$20." This resolves the paradox immediately (EV is fixed) and prevents the discussion of the generation procedure. Use the fixed pair only later as a debugging tool.

  ---

  ## 2. Sequence of Components & Dependencies

  ### Phase 1: Pre-Observation Reasoning (Symmetry)
  **Time:** 0–10 Minutes
  **Activity:** Ask the group: "Before you open the envelope, does it matter if you switch?"
  **Concept:** Rely on symmetry. Since the shuffle is 50/50, the expected value of "Envelope 1" equals the expected value of "Envelope 2."
  **Dependency:** This establishes the baseline truth: **Switching blindly yields no gain.**
  **Misconception Addressed:** *Appeal to Symmetry.*
  *   **Action:** If someone argues switching helps here, stop. Ensure consensus that $E[\text{switch}] = E[\text{stay}]$ before opening. This creates the conflict for the next phase.

  ### Phase 2: Post-Observation Reasoning (The Naive Calculation)
  **Time:** 10–20 Minutes
  **Activity:** Reveal the amount $x$ in the chosen envelope. Ask: "Now, what is the expected value of the other envelope?"
  **Concept:** Elicit the naive argument on the whiteboard:
  $$E[\text{other}] = 0.5 \times (2x) + 0.5 \times (x/2) = 1.25x$$
  **Dependency:** This relies on the assumption that, given $x$, the probability of the other envelope being $2x$ or $x/2$ is exactly 50/50.
  **Misconception Addressed:** *Confidence that simulation settles the case.*
  *   **Action:** Ask: "If we code this, what does `rand()` do in line 1 of `generate_trial`?" If they say "uniform random integer," point out that a uniform distribution over infinity is not a valid object in code or math.

  ### Phase 3: The Code Review (Finding the Bug)
  **Time:** 20–35 Minutes
  **Activity:** Treat the naive calculation as a code review. The variable $x$ is being used ambiguously.
  **Concept:** Introduce the **Prior Distribution $P(A)$**.
  *   Explain that the term $0.5 \times (2x)$ assumes $x$ is the *smaller* amount ($A$).
  *   Explain that the term $0.5 \times (x/2)$ assumes $x$ is the *larger* amount ($2A$).
  *   **The Bug:** The probability that $x=A$ is not necessarily 0.5. It depends on how likely $A$ is to be generated compared to $A/2$.
  *   **Contrast:**
      *   *Fixed Pair:* If we hardcode $A=100$, and you see \$100, you know the other is \$200. If you see \$200, you know the other is \$100. The 50/50 assumption holds only *before* seeing the value.
      *   *Procedural:* If $P(A)$ drops off quickly (e.g., normal distribution), seeing a very large $x$ makes it highly probable that $x$ is the larger amount ($2A$), not the smaller.
  **Dependency:** This resolves the conflict between Phase 1 (No gain) and Phase 2 (Gain). The gain calculation is invalid because it assumes an impossible prior (uniform over infinity).
  **Misconception Addressed:** *Treatment of unbounded expectations as a technicality.*
  *   **Action:** Emphasize that this is not a "measure theory edge case." It is a logic error equivalent to dividing by zero. The 50/50 assumption is only valid if the prior distribution is "flat" everywhere, which cannot exist.

  ### Phase 4: Check for Understanding
  **Time:** 35–45 Minutes
  **Activity:** Present the Variant (see below).
  **Concept:** Apply the dependency on $P(A)$ to a decision.

  ---

  ## 3. Addressing Specific Misconceptions

  | Misconception | When to Address | How to Address |
  | :--- | :--- | :--- |
  | **"Simulation with a capped range settles it."** | **Phase 2 (Naive Calc)** | When they suggest coding a simulation, ask them to define the upper bound. If there is a bound $M$, and you see $x > M/2$, you *know* you have the larger envelope. The 50/50 assumption breaks at the boundaries. The paradox relies on the absence of boundaries, which implies an invalid distribution. |
  | **"Symmetry dismisses the problem."** | **Phase 1 (Pre-Observation)** | Validate this. Symmetry *is* correct before opening. The paradox is specifically about why the reasoning *changes* (or fails to change correctly) after observing $x$. Use this to show the naive calculation contradicts this established truth. |
  | **"Unbounded expectations are just math pedantry."** | **Phase 3 (Code Review)** | Frame it as a "Null Pointer Exception." Assuming a uniform prior over infinity is like assuming a function returns a value without defining its domain. The expected value calculation crashes because the sum diverges. |

  ---

  ## 4. Check for Understanding: The "Switching Fee" Variant

  **The Scenario:**
  "You open your envelope and see \$100. I offer to let you switch, but there is a \$10 fee. Do you switch?"

  **Expected Correct Reasoning:**
  *   **Incorrect (Memorized Verdict):** "No, never switch, because the paradox is fake."
  *   **Correct (Procedural Understanding):** "It depends on the generation function `generate_trial`."
      *   If $P(A)$ is such that values around \$100 and \$200 are equally likely (locally flat), the naive $1.25x$ logic *approximately* holds locally, and you might switch (EV gain \$15 vs \$10 cost).
      *   If $P(A)$ decays rapidly (e.g., income distribution), seeing \$100 makes it likely you hold the larger amount ($2A$), so the other is likely \$50. You should not switch.
      *   If you know the hard cap is \$150, you definitely switch.
      *   **Key Takeaway:** Without knowing the prior $P(A)$, the decision is undefined.

  **What to Explicitly Set Aside:**
  *   **Topic:** **Measure Theory and Improper Priors.**
  *   **Reason to Give:** "We are treating this as a software specification problem. In production code, you cannot instantiate a 'uniform random integer' without bounds. We are setting aside the deep mathematical formalism of how to construct distributions that *approximate* this behavior over large ranges, because the core logical bug is assuming a 50/50 split conditional on $x$ without verifying the generator's spec."

  ---

  ## 5. Facilitator Notes for Dependencies

  1.  **Do not solve Phase 2 in Phase 1.** If you explain the prior distribution too early, they won't feel the tension of the paradox. Let them commit to the $1.25x$ calculation first.
  2.  **Ensure the "Fixed Pair" contrast happens in Phase 3.** Use the fixed pair (\$10/\$20) to show *why* the 50/50 logic works there (because the prior is a delta function) and why it fails in the procedural case (because the prior is spread out).
  3.  **Watch for "Average of Averages" errors.** Engineers often try to average over all possible $x$ values to prove the gain is zero. This is correct but tedious. Steer them back to the conditional probability error ($P(\text{smaller} | x) \neq 0.5$). It is the more direct "bug fix."
