      *   **Constraint 2:** Lay out the sequence of components and explain dependencies (when to introduce naive switching, priors, before/after seeing amount).
      *   **Constraint 3:** Recommend a *single concrete setup* (fixed vs. procedural) to carry the session, specifying inclusions/avoidances.
      *   **Constraint 4:** Identify specific misconceptions (simulation limits, symmetry, unbounded expectations) and when to address them.
      *   **Constraint 5:** Conclude with a concrete check for understanding (variant) and note what to set aside (with reason).
      *   **Time:** 45 minutes.

  2.  **Deconstruct the Audience & Topic:**
      *   *Backend Engineers:* They think in terms of state, functions, inputs/outputs, and edge cases. They trust empirical evidence (logs, tests, simulations) over abstract proofs.
      *   *The Paradox:* It hinges on the ambiguity of the probability distribution (the "prior"). The naive argument ($E[switch] = 1.25x$) looks correct syntactically but fails semantically because it treats the observed amount $x$ as a fixed constant while simultaneously treating it as a random variable dependent on the underlying generation process.
      *   *The Trap:* If you simulate with a hard cap (e.g., random int between 1 and 1000), the paradox disappears. Engineers will say "Aha, bounded distribution solves it." The challenge is to show *why* the naive math fails even without running code, or how the code must be written to reflect the math.

  3.  **Develop the Teaching Strategy (The "Single Concrete Setup"):**
      *   *Choice:* I need a setup that bridges the gap between "fixed pair" and "random generation."
      *   *Recommendation:* Use a **Procedural Generation Script** metaphor. Imagine a function `generate_envelopes()` that picks a base amount $A$ from some distribution $P(A)$, puts $A$ in one envelope and $2A$ in the other, then shuffles them.
      *   *Why:* This aligns with engineering mental models (APIs, random number generators). It forces the question: "What is the implementation of `generate_envelopes()`?"
      *   *Avoid:* Don't start with "God puts money in envelopes." Start with "Here is the spec for the random number generator."
      *   *Simplification to Avoid:* Do *not* assume a uniform distribution over all positive integers (impossible). Do *not* cap the range immediately (hides the paradox).

  4.  **Sequence the Components (Dependencies):**
      *   *Step 1: The Naive Calculation.* Get them to commit to the error. (0-10 mins)
      *   *Step 2: The Simulation Trap.* Let them try to code it mentally or discuss why a simple script fails to capture the "infinite" claim. (10-20 mins)
      *   *Step 3: The Prior Distribution.* Introduce $P(A)$. Show how the naive calc assumes an impossible prior. (20-30 mins)
      *   *Step 4: Before vs. After.* Distinguish $E[\text{switch}]$ before opening vs. conditional on seeing $x$. (30-40 mins)
      *   *Step 5: Check for Understanding.* (40-45 mins)

