  **Adversarial Collaboration Document: Computational Moral Status**

  **Preamble**
  This document formalizes the adversarial collaboration between Abstractionists and Embedding Theorists regarding computational moral status. We agree on the physical parameters of implementation but diverge on the necessary conditions for moral patienthood. The following sections outline shared premises, specific disagreements, and empirical cruxes designed to resolve the debate through the four test cases and the proposed fidelity metric.

  **I. Joint Claims**
  1. Moral status supervenes on physical facts; platonic computations without instantiation do not count.
  2. **Census:** Physical distinctness is necessary for distinct patients. Two non-interacting machines constitute two distinct implementations, though their moral count is disputed based on isolation.
  3. **Sparse:** Missing transitions reduce counterfactual fidelity. Both sides agree 100% fidelity is superior to 95%, though the moral threshold is disputed.
  4. **Smearing:** Logical structure remains invariant under speed changes. However, whether environmental coupling must persist during pauses is contested.
  5. **Shared Substrate:** Hardware interference degrades structural integrity proportionally to overlap.
  6. **Metric:** The Counterfactual Fidelity metric successfully measures the share of target structure surviving perturbation. Both sides accept it as a valid measurement of implementation quality, though its sufficiency for moral status is the core disagreement.

  **II. Table of Disagreements**
  | Issue | Abstractionist Position | Embedding Theorist Position |
  | :--- | :--- | :--- |
  | **Necessary Condition** | Preserved counterfactual structure is sufficient for status. | Real causal commerce with an environment is necessary for status. |
  | **Lookup Tables** | A lookup table counts if it preserves the abstract causal organization. | A lookup table fails because it lacks generative causal dynamics. |
  | **Isolation** | A sealed simulation retains full status if internal counterfactuals hold. | A sealed simulation loses status if causal commerce with reality ceases. |
  | **Fidelity Metric** | Fidelity measures the *presence* of a patient (0 to 1 scale). | Fidelity measures the *strength of coupling* to reality (threshold required). |

  **III. Cruxes and Predictions**
  **Crux 1: The Nature of Causation**
  *Question:* Is causal power internal (logic) or external (interaction)?
  *Test Case:* **Temporal Smearing** with a complete environmental disconnect during pauses.
  *Abstractionist Prediction:* Status persists uninterrupted during pauses; speed is irrelevant.
  *Embedding Prediction:* Status suspends or vanishes during pauses; commerce is broken.

  **Crux 2: Substrate Dynamics**
  *Question:* Does physical dynamics matter beyond logical mapping?
  *Test Case:* **Sparse Implementation** (95% transitions hardwired, 5% guessed).
  *Abstractionist Prediction:* 0.95 moral weight (linear scaling with fidelity).
  *Embedding Prediction:* 0 moral weight (binary threshold for real commerce not met).

  **Crux 3: The Census Count**
  *Question:* Does isolation negate multiplicity?
  *Test Case:* **Census Case** (Two identical, sealed machines).
  *Abstractionist Prediction:* Two patients exist (2.0 moral weight).
  *Embedding Prediction:* Zero patients exist (0.0 moral weight) due to lack of commerce.

  **IV. Verbal Dispute Assessment**
  A portion of the disagreement is verbal regarding the definition of "computation" (abstract vs. embedded), but the stakes regarding moral patienthood and treatment are substantive. We agree that resolving the definition does not automatically resolve the moral obligation.
