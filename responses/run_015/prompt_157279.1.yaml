answer: |-
  ### Part 1: Neutral Outlines

  **Hume's Is-Ought Distinction**
  David Hume observed that many philosophical systems move seamlessly from propositions describing what *is* the case (facts about the world, history, or human nature) to propositions describing what *ought* to be the case (requirements, duties, or values). He argued that this transition is logically invalid without explanation. Descriptive premises alone cannot entail prescriptive conclusions; a new relation must be introduced to bridge the gap between fact and requirement.

  **Moore's Open-Question Argument**
  G.E. Moore argued that fundamental evaluative terms (like "good") cannot be defined using purely descriptive or natural properties (like "pleasure" or "evolutionary fitness"). For any proposed definition equating "good" with a natural property $X$, it remains meaningful to ask, "Is $X$ really good?" If the definition were correct, this question would be tautological (closed). Since the question remains significant (open), "good" denotes a simple, non-natural property that cannot be reduced to descriptive terms.

  ***

  ### Part 2: Formal Verification Restatement

  Here I translate these metaethical claims into the vocabulary of specification languages, temporal logic, and system verification.

  **Hume's Claim: The Derivability Gap**
  In terms of **derivability within a calculus**, Hume's claim is that no set of premises describing the **descriptive state-space** (the implementation traces or model behavior) can validly entail a **normative requirement** (the specification) unless the derivation already assumes a higher-order specification axiom.

  Formally, let $\Gamma_{desc}$ be the set of propositions describing the implementation state transitions (the "Is"). Let $\phi_{norm}$ be a temporal logic formula representing the requirement (the "Ought"). Hume asserts:
  $$ \Gamma_{desc} \nvdash \phi_{norm} $$
  unless $\Gamma_{desc}$ is augmented by a bridge axiom $\psi$ such that $\psi$ itself carries normative weight. You cannot synthesize a **specification** purely from an **implementation** trace without injecting an external constraint. The **gap between descriptive state-space and normative requirement** is a failure of logical entailment; the model checker cannot validate a property that has not been implicitly assumed in the verification environment.

  **Moore's Claim: The Open Property Constraint**
  Moore's claim translates to a constraint on **invariant preservation** and property definition. Let $Good$ be a primitive predicate in our logic. Moore argues that $Good$ cannot be defined as a compound formula over natural state variables (e.g., $Good(s) \iff \text{Throughput}(s) > k$).

  In formal terms, if we treat $Good$ as a macro expansion of natural properties, the equivalence should be a **closed property** (a definitional tautology verifiable by syntax alone). Moore argues that for any candidate reduction $\psi(state)$, the equivalence $Good \leftrightarrow \psi$ remains an **open property**—it requires semantic verification rather than syntactic unfolding. Therefore, $Good$ must be treated as an uninterpreted function or atomic proposition that cannot be reduced to the **descriptive state-space** variables without loss of meaning. Any attempt to define **normative requirement** atoms purely via **implementation** state variables leaves a verification condition that cannot be closed by definition alone.

  ***

  ### Part 3: Residue Report

  This section analyzes the fidelity of the translation above. I will categorize the mapping into clean mappings, distortions, and missing counterparts, while flagging computationalist assumptions.

  #### 1. Clean Mappings
  *   **The Structural Gap (Spec vs. Impl):** The distinction between **specifications versus implementations** maps cleanly onto the Is-Ought gap. In FV, the model (implementation) describes what the system *does*; the property (specification) describes what the system *must do*. The model checker verifies the relation, but the property itself is external to the model. This mirrors Hume's insight that requirements are not inherent in the facts of the system's operation.
  *   **Derivability Failure:** Hume's logical gap is structurally identical to the inability to derive a temporal logic formula $\phi$ from a Kripke structure $M$ without assuming $\phi$ (or a stronger $\phi'$) as a verification goal. You cannot prove a safety property holds without asserting it as a target for **invariant preservation**.

  #### 2. Distortions and Forced Mappings
  *   **Normative Force as Liveness:** You asked if treating normative force as a **liveness property** misrepresents it. Yes, significantly.
      *   *In FV:* A liveness property (e.g., $GF\phi$) describes a set of infinite traces where something good *eventually* happens. It is still descriptive of the trace set.
      *   *In Metaethics:* Normativity implies a *binding force* or reason for action. It is not just that the trace *contains* the event, but that the agent *must ensure* the trace contains the event.
      *   *Distortion:* Mapping "ought" to a liveness constraint reduces prescription to description. It turns "You must do X" into "The system trace includes X." This smuggles in the assumption that the system is deterministic or fully compliant, erasing the possibility of voluntary violation which is central to normative claims.
  *   **Moore's "Open" vs. FV "Closed":** In formal logic, definitions are stipulative. If I define `define Good == Safety`, then `Good <-> Safety` is true by definition (closed). Moore claims this is impossible for ethical terms.
      *   *Distortion:* To make Moore's argument work in FV, I had to treat `Good` as an uninterpreted symbol or oracle. But in FV, uninterpreted symbols are just placeholders for *unknown* natural properties, not *non-natural* properties. This forces a computationalist assumption: that "non-natural" maps to "uninterpreted," whereas Moore meant it to be ontologically distinct, not just syntactically undefined.

  #### 3. No Counterpart (The Residue)
  *   **Agency and Violation:** FV lacks a concept of *agency* distinct from *behavior*. In FV, if the implementation violates the spec, the system is "buggy." In ethics, if an agent violates the ought, the agent is "wrong," but the system (the world) continues. FV assumes the specification is a constraint on possibility (in hard verification); Ethics assumes the specification is a constraint on *will* that can be broken. There is no analog in **derivability within a calculus** for "correctly violating a spec."
  *   **The Origin of Specifications:** FV takes specifications as given axioms. It has no internal mechanism to verify the validity of the specification itself, only its consistency with the model. Metaethics questions the source of the "ought." The residue here suggests FV lacks a **meta-specification** layer that can justify why one **normative requirement** is chosen over another without circularity.
  *   **Motivating Reasons:** FV deals with truth conditions (does the trace satisfy the formula?). It does not model *reasons* for satisfying the formula. The "force" of the ought is missing.

  #### 4. Computationalist Assumptions Smuggled In
  *   **Formalizability:** I assumed that normative requirements can be encoded as temporal logic formulas. This assumes norms are computable constraints on state trajectories.
  *   **State-Space Exhaustion:** I assumed the **descriptive state-space** captures all relevant natural facts. Moore would argue that even a complete state-space description misses the "value" property.
  *   **Logic as Normative:** I treated logical entailment ($\vdash$) as the proxy for normative justification. This assumes that if you cannot derive it logically, you cannot justify it normatively, which conflates epistemic justification with logical derivability.

  #### 5. Conclusion: Defect in FV or Gap in Specification?
  The residue reveals a **defect in Formal Verification** regarding its capacity to model normativity, rather than proving the Is-Ought gap has no analog.

  FV is fundamentally a descriptive technology: it describes relations between symbols (models and properties). Even when we write a "requirement," within the formal system it is treated as a boolean constraint on traces (a description of valid behaviors). It lacks the pragmatic layer of *prescription*—the command that binds an agent.

  Therefore, the Is-Ought gap **does work** with no direct analog in system specification because system specification collapses the "ought" into a specific kind of "is" (a set of valid traces). The gap persists in the engineering process (who writes the spec? why?), but disappears inside the formal calculus because the calculus cannot represent the *authority* of the spec, only its *content*. The residue shows that FV can model the *structure* of norms (constraints), but not the *force* of norms (obligation).
