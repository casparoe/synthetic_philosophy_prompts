answer: |-
  ### Brainstorming: Competing Diagnoses and Student Pitfalls

  Before drafting the assessment, it is crucial to map the philosophical terrain to ensure the question targets the specific conceptual friction points.

  *   **The Core Tension:** The Nadia case is not a standard intransitivity pump (where $A \succ B \succ C \succ A$ at a single time). It is a *diachronic* pump driven by *reasonable preference change*. At $t_1$, $G \succ A$. At $t_2$, $A \succ G$. Both choices are synchronically rational. The loss arises from the sequence.
  *   **Competing Diagnoses:**
      1.  **The Stability View:** Rationality requires stable preferences; Nadia is irrational because she changed her mind. (Counter: The prompt stipulates the change is reasonable based on salience/info).
      2.  **The Naivety View:** Nadia is irrational not because of the preferences, but because she failed to anticipate her future self (lack of sophistication).
      3.  **The Separateness View:** Monday-Nadia and Wednesday-Nadia are distinct agents; no single agent is pumped, so no irrationality exists.
      4.  **The Resolute View:** Rationality requires binding oneself to a plan (resolute choice) even when future preferences shift.
  *   **Common Student Conflations:**
      *   Treating any loss of money as proof of irrationality (ignoring that fees were paid for locally preferred options).
      *   Assuming rationality *requires* preference stability (ignoring the prompt's stipulation).
      *   Confusing *sophistication* (backward induction) with *resolution* (willpower/commitment).
      *   Failing to explain *why* sophistication stops the pump (it changes the effective choice set at $t_1$).

  ***

  ### Final Assessment Essay Question

  **Course:** Philosophy of Action & Practical Rationality
  **Assessment:** Final Exam – Essay Question
  **Time Allowed:** 75 Minutes

  **Question:**
  Consider the case of Nadia provided below.

  > *Nadia, a doctoral student, is allocating her summer between three archival placements in different cities, call them Alpha, Beta, and Gamma. On Monday she ranks Gamma above Beta above Alpha because she values quiet writing time most. She knows with certainty that by Wednesday, after her advisor meeting, she will rank Alpha above Gamma above Beta because she will then value networking most, and she knows this shift is predictable and, by her own lights, entirely reasonable given the different information and salience she will have then. A departmental coordinator, who knows her current and predicted rankings, offers her a sequence of voluntary, small-fee trades across the week: on Monday pay a tiny administrative fee to swap an assigned Alpha slot for Gamma, then on Wednesday pay another tiny fee to swap Gamma for Alpha, leaving her where she started minus two fees.*

  Evaluate whether Nadia is diachronically irrational if she accepts both trades. In your answer, you must address: (1) whether the irrationality (if any) lies in her preferences at a time, the pattern of choices over time, or her failure to anticipate future shifts; (2) whether refusing the first trade on Monday would be irrational by her lights *at that time*; and (3) how adopting a 'sophisticated' strategy versus a 'resolute' strategy alters the normative assessment of her agency.

  ***

  ### Model Answer

  The Nadia vignette presents a diachronic money pump driven not by synchronic intransitivity, but by predictable preference reversal. Assessing Nadia's rationality requires distinguishing between local optimality and global coherence, and recognizing the role of foresight in agency.

  If Nadia accepts both trades, she ends at Alpha minus fees. Is this irrational? Synchronically, no. On Monday, Gamma is preferred to Alpha; paying a fee to secure Gamma is instrumentally rational. On Wednesday, Alpha is preferred to Gamma; paying to switch back is also instrumentally rational. The irrationality, if it exists, is purely diachronic: she violates a principle of dynamic consistency where her sequence of choices defeats her own interests over time. However, because the prompt stipulates her preference change is "reasonable" (based on salience shifts regarding writing vs. networking), we cannot condemn the preference shift itself as irrational. Thus, the vulnerability lies not in the preferences, but in the *naivety* regarding them.

  This leads to the second issue: would refusing the first trade be irrational on Monday? If Nadia is naive, refusing seems irrational because she genuinely prefers Gamma. However, if she is *sophisticated*, she employs backward induction. She anticipates that choosing Gamma on Monday leads to Wednesday, where she will trade back to Alpha (minus fees). Therefore, the effective choice on Monday is not between Alpha and Gamma, but between Alpha (status quo) and Alpha (minus fees). Since she prefers Alpha (no fee) to Alpha (minus fees), a sophisticated agent refuses the first trade. Refusing is not irrational; it is the only way to avoid exploitation given her predicted future shifts.

  Finally, the distinction between sophisticated and resolute choice clarifies the nature of her agency. A *sophisticated* agent restricts her current choices based on predicted future behavior. She avoids the pump by conceding to her future weakness, effectively letting her Wednesday self dictate Monday's choice. A *resolute* agent, conversely, commits on Monday to keeping Gamma, intending to override her Wednesday preference shift. Resolute choice treats the plan as the unit of agency, potentially preserving diachronic coherence without requiring backward induction constraints. Alternatively, if one treats Monday-Nadia and Wednesday-Nadia as distinct agents, no pump exists for a single agent, though this dissolves the notion of diachronic rationality entirely.

  In conclusion, Nadia is diachronically irrational only if she is naive about her predictable shifts. The money pump reveals that rational agency requires more than synchronic consistency; it requires managing the temporal extension of the self, either through sophisticated anticipation or resolute commitment.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **A-Range (20–25 Marks): Distinctive Analysis**
  *   **Diagnosis of Irrationality (8 marks):** Clearly distinguishes between synchronic rationality (both trades are locally optimal) and diachronic failure (global loss). Explicitly notes that preference *change* is not the error per se, given the prompt's stipulation of reasonableness. Identifies *naivety* as the true source of vulnerability.
  *   **Strategic Analysis (8 marks):** Correctly explains *sophistication* via backward induction (Monday choice becomes Alpha vs. Alpha-minus-fees). Distinguishes this from *resolution* (committing to stick to Gamma despite future preference). Discusses the "separate agents" view as a conceptual alternative.
  *   **Argumentation & Clarity (9 marks):** Argument is tight, uses the vignette details (Alpha/Gamma/fees) precisely, and avoids generalizations not supported by the case.

  **B-Range (15–19 Marks): Competent but Standard**
  *   **Diagnosis (5–7 marks):** Identifies the money pump and the loss of money. May claim Nadia is irrational simply because she lost money, without fully unpacking the local rationality of each step. May struggle to justify why preference change isn't the primary error.
  *   **Strategic Analysis (5–7 marks):** Mentions sophistication or foresight but fails to explain the mechanism of backward induction clearly. May conflate resolution with sophistication (e.g., treating resolution as just "willpower" without normative structure).
  *   **Argumentation (5–7 marks):** Clear writing but relies on standard textbook definitions of money pumps without adapting them deeply to the Nadia specifics.

  **C-Range (10–14 Marks): Basic Understanding**
  *   **Diagnosis (3–5 marks):** States that intransitive preferences are irrational without noting the diachronic nature. Ignores the prompt's note on reasonable preference change.
  *   **Strategic Analysis (3–5 marks):** Mentions foresight vaguely. Does not explain how refusing the first trade avoids the pump.
  *   **Argumentation (4 marks):** Disorganized or spends too much summarizing the vignette rather than analyzing it.

  **Critical Deductions (Apply to any band):**
  *   **-5 Marks:** Treats any willingness to pay for a preferred option as inherently irrational (fails to understand local utility).
  *   **-5 Marks:** Assumes rationality *requires* stable preferences without argument (contradicts prompt stipulations).
  *   **-3 Marks:** Fails to address the specific question of whether refusing the first trade is irrational.
