answer: |-
  # Axiomatic Taxonomy of Two-Person Bargaining Solutions

  ### I. The Decision Tree
  * Traverse from root to leaf by answering **Yes (Y)** or **No (N)**.*

  ```text
  ROOT: Is the solution Pareto Efficient? (PE)
  │
  ├── N ──► [Disagreement Point]
  │         Geom: The status quo point d.
  │         Note: Rationality violation; trivial solution.
  │
  └── Y ──► Is the solution Symmetric? (SYM)
            │
            ├── N ──► [Dictatorial Solution]
            │         Geom: Player 1 maximizes u₁ on frontier; Player 2 takes remainder.
            │         Logic: Violates SYM by design (prefers P1). Satisfies PE, SI, IIA.
            │
            └── Y ──► Is the solution Scale Invariant? (SI)
                      │
                      ├── N ──► [Egalitarian Solution]
                      │         Geom: Intersection of Pareto frontier and line u₁-d₁ = u₂-d₂.
                      │         Logic: Violates SI (rescaling utilities changes "equal gain" slope).
                      │
                      └── Y ──► Does it satisfy Independence of Irrelevant Alternatives? (IIA)
                                │
                                ├── N ──► [Kalai–Smorodinsky (KS)]
                                │         Geom: Intersection of frontier and line from d to ideal point a.
                                │         Logic: Violates IIA (shrinking set changes ideal point a, rotating line).
                                │
                                └── Y ──► [Nash Bargaining Solution]
                                          Geom: Tangency of frontier and hyperbola (u₁-d₁)(u₂-d₂) = k.
                                          Logic: Unique solution satisfying all four axioms (Nash Thm).
  ```

  ### II. Axiom Mechanics (Derivations)
  *Why the splits occur.*

  1.  **IIA Failure (KS):** IIA requires that if the feasible set $S$ shrinks to $T \subset S$ but the solution $f(S) \in T$, then $f(T) = f(S)$. KS defines the solution via the **ideal point** $a(S) = (\max_{u \in S} u_1, \max_{u \in S} u_2)$. Removing options can lower $a(S)$ to $a(T)$ without removing $f(S)$. This rotates the ray from $d$ through $a$, changing the intersection with the frontier. Thus, $f(T) \neq f(S)$.
  2.  **SI Failure (Egalitarian):** SI requires invariance under positive affine transformations $u'_i = \alpha_i u_i + \beta_i$. The Egalitarian solution solves $u_1 - d_1 = u_2 - d_2$. If we rescale Player 1's utility by $\alpha_1 \neq 1$, the condition becomes $\alpha_1(u_1 - d_1) = u_2 - d_2$. This changes the slope of the solution line from 1 to $1/\alpha_1$, yielding a different intersection point on the frontier.
  3.  **SYM Failure (Dictatorial):** SYM requires that if the problem is symmetric (feasible set symmetric about $45^\circ$ line, $d_1=d_2$), then $u_1 = u_2$. A Dictatorial solution always maximizes Player 1's utility. In a symmetric set where the max $u_1$ point implies $u_1 > u_2$, the solution yields unequal utilities, violating symmetry.
  4.  **Nash Uniqueness:** The function $\prod (u_i - d_i)$ is symmetric, scale invariant (product of scaled gains scales by constant, maximizing argument unchanged), and depends only on the local frontier at the optimum (satisfying IIA). Nash proved this combination uniquely identifies the solution.

  ### III. Logical Space Map
  *Status of the 16 axiom combinations (PE, SYM, SI, IIA).*

  *   **Occupied by Standard Solutions (5):**
      *   **Y,Y,Y,Y:** Nash (Unique).
      *   **Y,Y,Y,N:** Kalai–Smorodinsky (Non-unique; requires Monotonicity to isolate).
      *   **Y,Y,N,Y:** Egalitarian.
      *   **Y,N,Y,Y:** Dictatorial (Player 1 or 2).
      *   **N,N,N,N:** Disagreement Point.
  *   **Empty / Unnatural (10):**
      *   **~PE Combinations:** Generally incoherent for "solutions" (irrational to leave surplus).
      *   **PE, ~SYM, ~SI:** Unnatural (e.g., "Dictatorial but in utils that change with scaling"). No standard construction.
      *   **PE, SYM, ~SI, ~IIA:** Unexplored/Unnatural (No standard solution combines scale-dependence with IIA-violation while maintaining symmetry).
  *   **Indistinguishability Warning:**
      *   This tree perfectly separates the four named solutions (Nash, KS, Egalitarian, Dictatorial).
      *   **However:** The leaf **(PE, SYM, SI, ~IIA)** contains KS but is **not unique** to it. Any solution satisfying Monotonicity instead of IIA lands here (e.g., Gupta-Livne). The Nash leaf **(PE, SYM, SI, IIA)** is the only one guaranteed unique by the axioms alone.
