  I'm preparing my position for a graduate metaphysics seminar on mereology and the ontology of biology, and I'd like an internal consistency check before I present. Here is where I've landed: I accept a restricted answer to the special composition question, holding that artifacts and inanimate aggregates do not compose genuine wholes—there is no table, only simples arranged table-wise—while living organisms do compose unified entities with genuine parts. I take the ground of this exception to be functional integration oriented toward self-maintenance and reproduction, not vitalism or spatiotemporal continuity alone. At the same time, I think functional integration is graded rather than all-or-nothing: there are clear borderline cases, such as extensive symbiont networks or colonial organisms, where it's genuinely unclear whether particular entities are parts of the organism or merely causally coupled to it. Despite this, I reject ontic vagueness across the board; I maintain that every apparent borderline case in biology has a precise fact of the matter, and that the correct compositional criterion must therefore draw a sharp line with no middle ground. I also hold that collective entities—corporations, committees, or coordinated social groups—lack compositional unity even when they exhibit collective intentionality and distributed agency, since functional interdependence in the social domain is structurally different from biological integration. Finally, I want to say that organisms are best understood through a process ontology: they are not enduring substances that contain parts, but stable, self-maintaining processes that temporarily integrate material constituents.

  Please audit this package. Which pairs are in genuine tension, which only appear to conflict, and what is the least costly revision in each case? I am especially concerned about whether my graded, biological-functional account of integration can survive my simultaneous rejection of ontic vagueness and my insistence on a sharp compositional boundary. I am also unsure whether my denial that social collectives compose anything is stable given the structural parallels I allow between biological and social functional integration. Rank the tensions by severity, indicate for each whether the cheapest fix requires giving up a metaphysical principle, a biological judgment, or the process-ontology framing, and tell me whether there is one single revision that would resolve the most conflict without collapsing the view into either universalism or nihilism. Do not offer a reading list or cite specific texts; just trace the logical and motivational commitments.
