prompt: |-
  hey — please act as an expert in democratic theory who's also spent time around how member-run housing organisations actually operate day to day. Take your time with this, do some unstructured thinking before you start writing, and please don't hedge everything into mush.

  I'm on the board of a housing co-op (about 120 units) and we're rewriting our voting rules for the AGM in six weeks. I've been reading about this stuff on my own for a couple years but Ive got no academic background, so keep it readable. Three proposals are on the table and I need a memo I can circulate to the other six board members that lands on one concrete package — not a menu of options — with a rough timeline for getting it through, and that engages the strongest version of whatever you're rejecting instead of knocking down the easy version.

  1. Drop the voting age for co-op decisions from 18 to 15. The 15–17 year olds are members kids living in the building, subject to the same rent share, noise and guest rules as everyone else.
  2. Give a vote to the ~30 adults who live in units but aren't on the membership roll — mostly partners not named on the lease, long-term subletters, and at least one person who's undocumented and terrified of showing up on any official list.
  3. Fix our 20% turnout. Either a small fine for skipping a vote (the compulsory-voting style some countries use) or a rule that any general-meeting decision with under half of eligible voters participating is void and reverts to a board decision.

  The bit I keep going back and forth on: everyone on the board keeps saying the principle is that anyone affected by a decision should get a say, but that doesn't seem to stop at our members. Our rules also govern a shared courtyard and parking lot with the co-op next door, plus two ground-floor workshops rented by people who don't live here. If affectedness doesn't stop at the membership roll, where does it stop — and I definately want the memo to actually answer that rather than shrug at it. Two other things to deal with honestly: two board members say giving 15 year olds a vote just doubles their parents vote because kids will vote how their parents tell them, and we can't really collect fines without going to small claims court, so be realistic about enforcement. Assume we can't change anything about state law — these are internal co-op rules only.
