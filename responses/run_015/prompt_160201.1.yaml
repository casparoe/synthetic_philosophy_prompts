  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Expert in democratic theory + practical experience with member-run housing orgs.
      *   **Tone:** Readable (no academic jargon), decisive (no hedging/mush), concrete (one package, not a menu).
      *   **Task:** Write a memo for a 7-person board of a 120-unit housing co-op.
      *   **Context:** Rewriting voting rules for AGM in 6 weeks.
      *   **Proposals to Evaluate:**
          1.  Lower voting age (18 -> 15).
          2.  Extend vote to non-member residents (partners, subletters, undocumented).
          3.  Fix low turnout (20%): Compulsory voting (fines) OR quorum threshold (reverts to board).
      *   **Key Tension:** "Affectedness principle" (if everyone affected votes, where does it stop? Neighbors? Renters?).
      *   **Specific Objections to Address:**
          *   Teens just doubling parents' votes.
          *   Enforcement of fines (small claims impractical).
      *   **Constraint:** Cannot change state law (internal rules only).
      *   **Output:** A memo with a concrete recommendation package + timeline.

  2.  **Unstructured Thinking & Theoretical Grounding:**
      *   *Democratic Theory:* The "All-Affected Principle" is tricky. If we take it literally, the neighbors across the street should vote on our courtyard rules. But democracy also requires a *boundary* (the demos). In a co-op, the boundary is usually *risk-bearing*. Who bears the long-term risk? Members.
      *   *Co-op Reality:* Co-ops aren't mini-states. They are contractual associations. Membership is a financial and legal stake. Diluting that stake weakens the collective bargaining power and financial stability.
      *   *Proposal 1 (Teens):* 15 is old enough to have opinions, but do they have *independence*? The objection about "doubling the vote" is real but cynical. However, the legal liability rests on the parents. A compromise: Voice, but not Vote. Or a specific proxy arrangement. Actually, in co-ops, membership is usually tied to the lease. If the kid isn't on the lease, they aren't legally liable. *Decision:* Reject full voting rights, but create a formal youth council/consultative role. It respects their agency without blurring legal liability.
      *   *Proposal 2 (Non-members):* This is the hardest one ethically. Undocumented folks, partners. They live there. They are affected. But co-op law usually requires members to be on the lease to protect the asset. If we give voting rights to non-leaseholders, we risk piercing the corporate veil or violating loan covenants. *Decision:* Reject voting rights for non-members *for now*, but create a clear, low-barrier path to membership (especially for partners) and a non-voting resident assembly for input. We can't solve immigration status via bylaws, but we can ensure they have a voice without exposing them to legal risk.
      *   *Proposal 3 (Turnout):* 20% is a crisis. Legitimacy is low.
          *   *Fines:* Unenforceable. You can't fine your neighbors easily without destroying community trust. Small claims is nuclear war.
          *   *Quorum/Revert to Board:* Dangerous. It incentivizes apathy. If I don't like the members, I stay home and let the board rule.
          *   *Better Idea:* Make voting easier (digital/secure) + Social pressure + "Consent by Silence" for low-stakes stuff? No, keep it binary.
          *   *Selection:* The "Revert to Board" rule is the lesser evil *if* paired with a high bar for what constitutes a "General Meeting Decision." But actually, the best democratic fix for low turnout is usually *access*, not coercion. However, the prompt asks to choose between the two or fix it. Let's look at the "Revert to Board" option. It's risky. If turnout is low, the Board takes over? That rewards boycotts.
          *   *Alternative:* Mandatory *participation* (not voting). You have to log in or show up. But enforcement is still hard.
          *   *Real Talk:* The "Affectedness" principle needs a boundary. The boundary is *Membership*. Why? Because members put up the buy-in. They risk their housing.
          *   *Turnout Fix:* Let's go with a hybrid. No fines (unenforceable). No "revert to board" (undemocratic). Instead: **Quorum is required for major changes, but simple majority of *votes cast* for routine stuff, PROVIDED notice was adequate.** Wait, the prompt asks to evaluate the specific proposals. I need to pick a lane.
          *   *Refined Turnout Strategy:* The "Revert to Board" is bad theory (oligarchy risk). Fines are bad practice (enforcement nightmare). The real fix is *culture* and *access*. But I need a rule change. How about: **Quorum remains, but we change *how* we vote (secure online) to boost turnout, and we define a 'super-majority of members present' for big stuff.**
          *   *Wait, I need to be decisive.* The prompt asks me to land on *one concrete package*. I should probably reject the fines (unenforceable) and reject the "revert to board" (dangerous). I should propose a *different* turnout mechanism or modify one of theirs.
          *   *Actually, looking at the prompt:* "Fix our 20% turnout. Either a small fine... or a rule that any general-meeting decision... is void." It implies I should choose one or propose a better third way. A democratic theorist would say coercion (fines) undermines voluntary association. Reverting to board undermines sovereignty.
          *   *Best Path:* Keep the Quorum (void if low turnout) BUT lower the threshold for what needs a full AGM vs. board decision, and invest heavily in digital voting. But if I must choose between the two presented: The Quorum rule is theoretically cleaner, even if risky. *However*, the best expert advice is to say "Neither." Let's propose a **Secure Digital Voting + Quorum** system.
          *   *Wait, let's look at the "Affectedness" boundary.* The prompt specifically asks me to answer where the boundary stops. Answer: **Risk and Liability.** Members sign the lease. Members buy the share. Neighbors and renters do not. That is the hard line.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the stakes. 20% turnout is a legitimacy crisis.
      *   **The Core Principle:** Define the boundary of the "Demos." It's not just "affected." It's "bearing the risk." This answers the neighbor/workshop question.
      *   **Proposal 1 (Teens):** Reject the vote. Why? Legal liability rests with parents. It *does* risk doubling the household vote. *Compromise:* Youth Advisory Seat.
      *   **Proposal 2 (Non-members):** Reject the vote. Why? Legal/Financial structure of co-ops. *Compromise:* Fast-track membership for partners, protected anonymity for undocumented (cash/share work?), Resident Forum for voice without vote.
      *   **Proposal 3 (Turnout):** Reject fines (unenforceable/toxic). Reject "Revert to Board" (incentivizes boycotts). *Solution:* **Secure Online Voting + Quorum Threshold.** If quorum isn't met, the vote fails (status quo remains), it doesn't go to the board. This forces engagement without handing power to the elite.
      *   **Timeline:** 6 weeks is tight. Needs immediate action.
      *   **Tone Check:** Is it hedging? No. Take a stand. "Do not do X." "Do Y."

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Is rejecting the teen vote too paternalistic?
      *   *Fix:* Acknowledge their stake. They follow rules. But the *legal* structure of the co-op is based on the lease. If a 15-year-old votes to raise rents, can they be evicted for non-payment? No. The liability mismatch is the key argument.
      *   *Critique:* The undocumented member issue.
      *   *Fix:* Be careful. Don't suggest they go on a lease if it endangers them. Suggest a "Resident Card" or internal recognition that grants voice without triggering state reporting.
      *   *Critique:* Turnout.
      *   *Fix:* The prompt gives two options (Fine or Revert to Board). If I propose a third (Online Voting), am I following instructions? The prompt says "Fix our 20% turnout. Either... or..." It asks me to engage with these. I should probably advise *against* both and offer the robust alternative, or choose the "Revert to Board" but modify it heavily.
      *   *Decision:* As an expert, I must advise against bad options. Fines are impossible. Reverting to Board is anti-democratic. I will recommend **maintaining the Quorum (vote fails if low turnout)** but *not* reverting to board. Status quo is the check. And mandate digital voting. This is the "Concrete Package."

  5.  **Finalizing the "Affectedness" Boundary:**
      *   This is the theoretical core.
      *   Argument: "All Affected" is infinite. "All Subject to Authority" is better. But in a co-op, it's "All Bearing Risk."
      *   Neighbors/Workshops: They have contracts (easements/leases). They have legal recourse through contract law, not co-op governance. Their boundary is the contract. Our boundary is the membership share.

  6.  **Timeline:**
      *   Week 1: Drafting.
      *   Week 2: Legal review (crucial for bylaws).
      *   Week 3: Member education.
      *   Week 4: Feedback session.
      *   Week 5: Finalize text.
      *   Week 6: AGM Vote.

  7.  **Review against Constraints:**
      *   Readable? Yes.
