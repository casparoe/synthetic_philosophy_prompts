  # JOINT STATEMENT OF THE ADVERSARIAL COLLABORATION ON RELIGION AND PROSOCIALITY

  **Date:** October 24, 2023
  **Scribe:** [Name Redacted], Chair of Philosophy of Religion
  **Parties:** Camp M (Moralizing-Monitoring/Indispensability) & Camp I (Institutional-Substitution)

  ## Section A: Agreed Claims

  The following claims constitute the shared empirical and conceptual foundation for this collaboration. Both camps endorse these propositions as non-trivial premises for further inquiry.

  1.  **Decomposition Necessity:** The proposition "religion makes people better" is empirically ill-posed. Causal attribution requires disaggregating religious practice into four separable components: (i) belief in morally concerned supernatural agents, (ii) costly ritual participation, (iii) embeddedness in a dense, monitoring community, and (iv) explicit moral instruction.
  2.  **Metric Specificity:** Comparisons of prosociality must specify which operational metric is being assessed: the **low-cost anonymity gradient** (difference in conduct between observed and anonymous conditions), the **motivation share** (fraction of acts driven by other-regarding concern vs. sanction-avoidance), or the **circle radius** (extent of conduct toward out-group strangers).
  3.  **Stipulated Correlation Structure:** Accepting the collaboration's background stipulation: Religiosity tracks measures of prosocial conduct across national samples, but this tracking is stronger for self-reported measures and low-cost observable behaviors than for costly anonymous behaviors.
  4.  **Confounding Acknowledgement:** Observed religiosity is heavily confounded with community embeddedness and cultural inheritance. Any causal claim regarding supernatural belief must control for the effects of dense social monitoring and shared normative heritage.
  5.  **Institutional Functionality:** Secular institutions (legal systems, welfare states, reputational registries) currently perform monitoring, sanctioning, and arbitration functions in large-scale societies. Both camps agree these institutions exist and function; the disagreement concerns their historical origin and long-term sustainability independent of religious heritage.
  6.  **Historical Path Dependence:** Contemporary secular normative landscapes are not ex nihilo creations; they are historically downstream from periods of dominant religious practice. Both camps agree that current secular prosociality is, at minimum, historically correlated with prior religious hegemony.

  ## Section B: Disagreements Table

  | Disputed Proposition | Camp M Formulation (Indispensability) | Camp I Formulation (Substitution) | Classification | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **Primary Driver of Large-Scale Cooperation** | Belief in monitoring supernatural agents was the necessary technological innovation that stabilized cooperation among strangers. | Dense community monitoring and credible sanctioning mechanisms were the drivers; supernatural belief was a contingent, replaceable vehicle. | Substantive | Disagreement concerns the necessary conditions for the historical emergence of stability, not merely the correlation. |
  | **Sustainability of Secular Prosociality** | Secular societies are consuming inherited "moral capital" generated by religious antecedents; metrics will decay as this capital depreciates. | Secular societies have replaced religious functions with institutional substitutes; metrics will remain stable provided institutions function. | Substantive | Divergent predictions regarding the time-series stability of prosocial metrics in post-religious populations. |
  | **Definition of "Moral" Improvement** | Priority on **Motivation Share**: True prosociality requires internalized other-regarding concern, not just compliance. | Priority on **Circle Radius** and **Anonymity Gradient**: Outcomes (cooperation with strangers) matter more than the internal motivational state. | Partly Verbal | Disagreement on weighting of metrics, though it implies substantive disagreement on what counts as societal success. |
  | **Causal Efficacy of Supernatural Belief** | Private belief in monitoring agents reduces the anonymity gradient even absent community enforcement. | Private belief has negligible effect on the anonymity gradient absent community enforcement or institutional sanction. | Substantive | Directly testable prediction regarding the isolated effect of component (i) vs. component (iii). |

  ## Section C: The Cruxes

  The following four cruxes identify the specific empirical settlements that would shift the probability weighting of each camp's theory.

  ### 1. Component Crux (Matched-Inheritance Natural Experiment)
  *   **Sub-Question:** In cohorts sharing ancestry and heritage, does retaining ritual/community without belief sustain prosociality better than retaining belief without ritual/community?
  *   **Joint Test:** Compare two cohorts after one generation: Cohort A (Retains ritual calendar/community, drops supernatural belief) vs. Cohort B (Drops practice, retains private belief).
  *   **Camp M Prediction:** Cohort B will show a smaller increase in the **anonymity gradient** (i.e., better anonymous behavior) than Cohort A, but both will decay relative to a religious control. Camp M holds that belief is the engine; without it, ritual is empty signaling.
  *   **Camp I Prediction:** Cohort A will show a significantly smaller **anonymity gradient** (better behavior) than Cohort B. Camp I holds that community monitoring (embeddedness) does the work; private belief without social enforcement is causally inert.
  *   **Ordering:** Camp I predicts Cohort A > Cohort B on prosocial metrics. Camp M predicts Cohort B $\ge$ Cohort A (or equal decay).

  ### 2. Amortization Crux (Decay Schedule)
  *   **Sub-Question:** Does secular prosociality decay over generations, and on what schedule?
  *   **Camp M Prediction:** Measurable decline in **Motivation Share** and **Circle Radius** will begin within 2–3 generations post-secularization, absent religious revival.
  *   **Camp I Prediction:** No measurable decline in these metrics across 3+ generations, provided institutional quality (rule of law, welfare) remains high.
  *   **Falsifiability Assessment:** Low. The timescale (60–90 years) introduces massive confounding variables (war, economic shifts, technological change). While theoretically falsifiable, isolating "secularization" as the independent variable in a multi-generational study is practically near-impossible.

  ### 3. Substitution Crux (Institutional Replacement)
  *   **Sub-Question:** Can secular institutions fully substitute for religious monitoring in a mid-sized jurisdiction?
  *   **Case:** A jurisdiction introducing universal third-party arbitration and reputational registries without religious revival.
  *   **Camp I Vindication:** Stability or improvement in the **anonymity gradient** relative to control jurisdictions.
  *   **Camp M Vindication:** Stability in low-cost compliance, but a statistically significant decline in **Motivation Share** (shift from virtue to compliance) and **Circle Radius** (retreat to in-group preference).
  *   **Decisive Threshold:** Both camps agree that a divergence of >0.5 standard deviations in the **Motivation Share** metric between the treatment jurisdiction and a religious control would be decisive. Camp I views this as irrelevant (compliance is enough); Camp M views it as critical (capital depletion). *Note: This reveals the Metric Weighting disagreement.*

  ### 4. The Transfer Crux (Priming Relevance)
  *   **Sub-Question:** Do laboratory religious priming effects on anonymous giving predict societal stability?
  *   **Camp M Discount:** Lab effects are short-term and do not capture the lifelong enculturation required to build moral capital.
  *   **Camp I Discount:** Lab effects are artifacts of demand characteristics and self-presentation, not genuine shifts in the **anonymity gradient**.
  *   **Crux Status:** **Not a Genuine Crux.** Both camps agree that laboratory priming data is insufficient to adjudicate the macro-sociological question. This is a shared assumption mistakenly treated as a point of contention in the broader literature.

  ## Section D: Falsification Conditions

  **Evidence Against Camp M (Indispensability):**
  Camp M would regard its view as significantly undermined if:
  *   Longitudinal data from high-secularization nations (e.g., Scandinavia, Czechia) shows stable or increasing **Circle Radius** and **Motivation Share** over four generations, controlling for economic wealth.
  *   Cohorts with high supernatural belief but low community embeddedness fail to outperform non-believing, high-embeddedness cohorts on the **anonymity gradient**.

  **Evidence Against Camp I (Substitution):**
  Camp I would regard its view as significantly undermined if:
  *   Secular jurisdictions with high institutional quality show a consistent, generation-over-generation decline in **Motivation Share** that correlates specifically with the loss of religious heritage, not economic stress.
  *   It is demonstrated that secular institutions (law, welfare) historically emerged *only* in contexts where religious moralizing-monitoring had already stabilized cooperation, implying substitution is impossible without the prior religious phase.

  **Joint Movement Condition:**
  Both camps agree that the debate would be genuinely moved by a prospective, pre-registered longitudinal study tracking the **anonymity gradient** and **motivation share** in a rapidly secularizing region versus a stable secular region over 20 years, with controls for institutional quality and economic shocks.

  ## Section E: Scribe's Note (Judgment and Framing Analysis)

  **Settled vs. Contested:**
  Among specialists in the empirical science of religion, it is settled that religiosity correlates with prosociality, and it is settled that this correlation is heavily confounded by community embeddedness. It is *not* settled whether the supernatural belief component has an independent causal effect on costly anonymous behavior, nor is it settled whether secular institutions can indefinitely sustain the **Motivation Share** without the cultural scaffolding of religious heritage.

  **Framing Critique:**
  As the scribe, I must flag three potential slants in the framing provided for this collaboration:

  1.  **"Moral Capital" (Camp M Bias):** The term "moral capital" (Section A, Claim 5) presupposes a finite reservoir that depletes. Camp I might argue this is a category error; they view trust as generated by current institutional performance, not inherited. Using this term in the background stipulation subtly privileges Camp M's amortization model.
  2.  **"Substitution" (Camp I Bias):** The term "substitution" implies functional equivalence. Camp M argues that while institutions can substitute for *sanctioning*, they cannot substitute for *internalized motivation* (Motivation Share). The framing risks conflating compliance with moral motivation, which is the core of Camp M's objection.
  3.  **Metric Weighting:** The three metrics (Anonymity Gradient, Motivation Share, Circle Radius) are presented as neutral. However, Camp I implicitly prioritizes the **Circle Radius** (outcomes for strangers), while Camp M implicitly prioritizes **Motivation Share** (virtue vs. compliance). By treating these as equal variables, the framing obscures the normative disagreement: Is a society of compliant secularists "as moral" as a society of virtuous believers? The document treats this as an empirical question, but it contains a normative core that remains unresolved.

  **Conclusion:**
  The collaboration has successfully isolated the empirical disagreements from the verbal ones. The residual dispute is not about whether secular people behave well (they do), but about the *mechanism* of that behavior and its *sustainability* absent the specific cognitive technology of supernatural monitoring. The cruxes identified in Section C provide the only viable path forward, though the Amortization Crux remains limited by the practical constraints of generational time.

  *Signed,*
  *The Scribe*
