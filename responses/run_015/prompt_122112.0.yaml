  To: Honorary Degrees Commitee
  From: J. Miller (Chair)
  Date: Oct 12, 2023
  Subject: Draft Rec - Vasquez Nomination

  Hey everyone,

  Getting this draft out early so we can chew on it before the Nov 15 vote. I know tensions are high on the Vasquez nomination. After reading the statements from the student coalition and the Board's counter-notes, I'm recommending we **reject** the honorary doctorate.

  I know this is the harder path. The Board's argument isn't weak—it's actually pretty sophisticated. They're leaning on the doctrine of double effect: Vasquez intended to neutralize combatants, the 47 civilian deaths were foreseen but unintended side effects. They also use the engineer analogy: we don't blame the bridge builder if a car crashes because of driver error. If we reject her, are we saying all defense research is off limits?

  Here's why I think that logic doesn't hold here, and why we have to vote no.

  The bridge analogy fails because a bridge doesn't decide who crosses it. Project Sentinel's algorithm *does* decide. It weighs value. When Vasquez wrote the targeting layer, she wasn't just building a tool; she was encoding a decision matrix about who lives and who dies into the software itself. That's not collateral damage in the traditional sense; that's outsourced judgment. Anscombe's point about Truman wasn't just that people died, but that honoring the act validates the principle that some innocents are expendable for the greater good. By giving Vasquez a degree, we aren't just acknowledging her technical skill, we're endorsing the moral framework behind the code.

  The Board says this makes us complicit in direct killing. The students are right—it's not about pulling a trigger. It's about designing the finger that pulls it. If we honor her, we signal that algorithmic distance absolves moral agency. I don't think the university can stand behind that without looking hypocritical, especially given our own mission statement on human welfare.

  So, concrete plan:
  1. We vote to reject on Nov 15.
  2. We issue a statement acknowledging her technical contributions but citing the ethical implications of autonomous targeting as incompatible with the honor.
  3. We invite Vasquez to campus for a closed-door symposium on AI ethics instead—acknowledge the work without awarding the degree.

  This lets us take the moral stand the students are asking for without completely burning the bridge with the engineering school or the Board. We're not canceling her; we're saying this specific honor isn't the right fit.

  Let me know if you see holes in this before I finalize the wording.

  Thanks,
  J.

