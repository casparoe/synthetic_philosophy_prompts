answer: |-
  Good morning, and welcome to Bristol. It is a pleasure to stand here at the University, looking out at a room that is, itself, a kind of experiment. On one side, we have colleagues who spend their lives dissecting the conceptual bones of democracy. On the other, we have councillors and activists who have to build the muscle and skin of it every day. Usually, these two groups speak past one another. The philosophers worry about legitimacy; the practitioners worry about litter bins and bus routes. But today, under the banner of 'Who Gets the Ballot?', I hope we can admit that these are the same worry.

  We are here to discuss three contentious expansions of the franchise: compulsory voting, lowering the age to sixteen, and enfranchising long-term non-citizen residents. Normally, we would treat these as separate policy levers. But this workshop arrives at a peculiar moment for our city. As you know, Bristol is currently piloting a local climate budget referendum. It is a bold scheme, and it is messy. And I want to suggest that the messiness is exactly where the philosophy lives.

  In this pilot, we are inviting sixteen-year-olds and residents who have lived here over ten years without citizenship to cast votes. That is an expansion. But there is a catch. Those votes only count fully if registered citizen turnout hits eighty per cent. If it falls short, their votes become advisory only.

  Now, I know what some of you are thinking. To the activists: this looks like patronage. It says, 'You can play, but only if the adults show up.' To the philosophers: this looks like a violation of the principle of equal respect. It creates a two-tier electorate.

  But I urge you not to dismiss this as mere political compromise. I want us to treat this tension as philosophically revealing. Because this pilot exposes a truth we often hide behind clean theories. We like to talk about the vote as an individual right—a piece of property owned by the autonomous self. But this pilot, like the proposal for compulsory voting, undermines that. You cannot claim this is about pure autonomy when the weight of your vote depends on the behaviour of others, or when the state mandates your participation.

  Equally, we cannot pretend this is straightforward collective self-government. The eighty per cent threshold is clearly protecting a specific kind of citizen privilege. It admits that the 'demos' is not a fixed circle, but a contested boundary.

  So, what is the vote, if it is not merely a right nor simply an expression of will? I propose we consider it as a practice of stewardship.

  When we lower the voting age, we are not just acknowledging capacity; we are acknowledging stake. A sixteen-year-old breathing the air of this city has a stake in its climate future. When we allow non-citizen residents to vote, we acknowledge that residence creates obligation and belonging, regardless of passport status. But the conditional nature of this pilot admits something else: that inclusion requires a infrastructure of legitimacy to hold it.

  The eighty per cent rule is an anxiety made manifest. It is the existing electorate saying, 'We are willing to share power, but we are afraid that without our own high engagement, the system will lose its authority.' It is ugly, yes. But it is honest. It tells us that expanding the franchise is not just about opening the gate; it is about strengthening the ground everyone stands on.

  This is why we need both halves of this room. The philosophers need to help us articulate whether this conditional inclusion is a stepping stone to equality or a ceiling that institutionalises hierarchy. Is it a temporary scaffold, or a permanent class structure? And the practitioners need to tell us whether this conditionality motivates turnout, or whether it breeds resentment among those whose votes are rendered advisory.

  If we frame voting only as autonomy, this pilot makes no sense. If we frame it only as duty, it feels coercive. But if we frame it as a shared practice of maintaining a common world, then the tension becomes productive. It forces us to ask: what do we owe each other to make sure our votes count?

  Over the next two days, I am not asking you to resolve this tension. I am asking you to inhabit it. Do not try to smooth over the contradictions between compulsory participation and conditional weighting. Lean into them. Ask whether the vote is a tool for individual expression or a mechanism for collective survival. Ask whether fairness means everyone gets the same ballot, or everyone gets the same chance to make that ballot matter.

  Bristol has always been a city of conscience and of commerce, of idealism and of hard graft. This workshop needs to be both. Let us not seek a pure theory of democracy that cannot survive contact with the pavement. Let us instead find a philosophy robust enough to handle the compromise, and a practice wise enough to know where the compromise bites too deep.

  Thank you, and welcome to the workshop.
