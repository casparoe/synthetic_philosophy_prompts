      *   *The "Shared Premise":* This needs to be sharp. Both assume *representation* is the bottleneck. Kharum suggests *affordance* is the bottleneck.

  6.  **Final Review against the Prompt:**
      *   Compare explanatory weight? Yes.
      *   Focus on complex infrastructure without persistence/coercion? Yes.
      *   Construct analysis around Kharum? Yes.
      *   Answer Q1 (Harari)? Yes.
      *   Answer Q2 (G&W)? Yes.
      *   Answer Q3 (Shared Premise)? Yes.

  7.  **Final Polish:** (Mental check of the "Kharum" logic). If there are no grave goods and no oral tradition, how do they know *where* to dig? The prompt says "maintain irrigation canals." This implies the canals exist physically. The physical canal is the guide. This is the key to undermining the "symbolic substrate" requirement. The *matter* organizes the *labor*, not the *myth*.

      *(Self-Correction)*: Wait, Harari might argue the *value* of the canal is the myth. "We believe water is sacred." If Kharum has no such belief, why dig? Because they are thirsty. This is biological imperative, not fictional order. Harari distinguishes biological reality from intersubjective reality. Kharum blurs this. I need to highlight this tension.

      *(Refining G&W)*: G&W argue against the "prison of hierarchy." Kharum is a prison of *ecology*. Does G&W account for ecological determinism? They try to minimize it. Kharum challenges their "freedom" narrative by showing rigid ecological determinism without rigid social hierarchy.

      *(Refining Shared Premise)*: The premise is that *social order requires a distinct layer of symbolic mediation.* Kharum suggests social order can be a direct feedback loop with the environment.

