answer: |-
  Dear Colleague,

  First, commiserations on the seminar. Conspiracy theory literature is a peculiar beast; it often feels less like epistemology and more like pathology, which makes it frustrating for a philosopher of science trained to look for rational reconstruction.

  You have put your finger on a genuine gap in the taxonomy. You are quite right to dismiss the usual suspects. Popper's unfalsifiability is a logical property of the system, not a diachronic psychological process. Lakatos's protective belt involves adding *new* auxiliary hypotheses to shield a hard core; in your examples, no new hypotheses are added—the *same* hypothesis is uttered, but its truth conditions silently migrate. Quine's web is too holistic; this is localised semantic slippage. And as you note, equivocation is a rhetorical move made *during* an argument, whereas this is a slow, sincere drift in the believer's own cognitive architecture.

  There is no single, canonical term in the philosophy of mind or language that captures this exact phenomenon. However, given your background in measurement, you will be pleased (or perhaps irritated) to discover that your own field has a name for the structural analogue of this: **Construct Drift**.

  In psychometrics and measurement theory, construct drift occurs when the latent variable a test is supposed to measure changes meaning over time, while the instrument (the questions, the scale) remains the same. The indicator is stable; the construct is not.

  In your conspiracy examples, the sentence token ('They are sitting on the study') is the instrument. The proposition it expresses (the specific claim about a specific suppressed document) is the construct. When the document appears and is boring, the construct shifts (to a *different* suppressed document) to maintain the validity of the instrument (the sentence).

  However, 'Construct Drift' is technical jargon from measurement theory. For the purposes of your seminar in epistemology and philosophy of language, I propose we adapt this into a properly philosophical coinage: **Covert Doxastic Drift (CDD)**.

  Here is a proposal for how to define it, mark its boundaries, and handle your boundary cases.

  ### Definition: Covert Doxastic Drift

  **Covert Doxastic Drift** is a diachronic phenomenon in which a subject maintains a high degree of confidence in a belief ascription *S believes that p*, whilst the truth conditions of *p* shift over time in response to counter-evidence, without the subject's conscious awareness or admission of revision.

  It requires four conditions:
  1.  **Linguistic Stability:** The public (and often private) verbal formulation of the belief remains identical or near-identical over time *t1* to *t2*.
  2.  **Content Migration:** The proposition expressed by that formulation at *t2* is not identical to the proposition expressed at *t1* (due to changes in reference, indexical context, or descriptive content).
  3.  **Sincerity:** The subject is not deliberately equivocating; they sincerely report that their belief has not changed.
  4.  **Immunity:** The drift is triggered by, or functions to preserve the belief against, disconfirming evidence that would have falsified the original proposition.

  ### Boundaries and Distinctions

  To ensure this isn't just a bucket for "things people do when they're being stubborn," we must distinguish CDD from its neighbours.

  **1. Versus Ordinary Gradual Drift of Opinion**
  *   *Ordinary Drift:* I believe 'Jazz is complex' at 20. At 40, I believe 'Jazz is complex', but my understanding of complexity has deepened.
  *   *Distinction:* In ordinary drift, if you pointed out the change, the subject would say, 'Yes, I suppose I see it differently now.' In CDD, the subject denies the change. CDD is defined by the *resistance to acknowledging the shift*.

  **2. Versus Dishonest Revision (The "Sly Revision")**
  *   *Sly Revision:* I know I was wrong about the study, but I don't want to lose face, so I pretend I meant the other study.
  *   *Distinction:* This is lying. CDD requires the **Sincerity Condition**. The subject must genuinely feel that the belief is continuous. The 'migration' happens beneath the level of reflective access.

  **3. Versus Lakatosian Adjustment**
  *   *Lakatos:* 'The study was suppressed, *and* the one they published was forged.' (New claim added).
  *   *CDD:* 'The study was suppressed.' (Same claim, but 'the study' now refers to a different object).
  *   *Distinction:* Lakatos adds weight to the boat; CDD changes the cargo while claiming it's the same shipment.

  ### Addressing Your Boundary Cases

  **Case 1: The Teenager and the Band**
  *   *Scenario:* A teen says 'I love The Smiths' for a decade, but their taste shifts from early punk-inflected tracks to later synth-pop, and finally to Morrissey's solo work which they claim is 'essentially Smiths'.
  *   *Verdict:* This is **Ordinary Drift**, not CDD.
  *   *Reasoning:* There is no *epistemic pressure* forcing the definition to change to avoid falsification. If you asked the adult, 'Did you mean the 1984 Smiths back then?', they would likely say, 'Well, my taste has evolved.' There is no defensive function preserving the belief against a 'falsifier'. It is aesthetic development, not epistemic immunisation.

  **Case 2: The Political Party**
  *   *Scenario:* A party keeps the name 'The Labour Party' and slogans about 'workers', but reverses policies on nationalisation.
  *   *Verdict:* This is **Institutional Equivocation**, not individual CDD.
  *   *Reasoning:* While the *organisation* exhibits drift, the individual members often *do* notice and split (e.g., the SDP split in the 80s). CDD is a psychological phenomenon within a single mind. If the party membership *collectively* fails to notice the contradiction, that is a sociological form of CDD, but philosophically, it breaks down into many individuals, some of whom are lying (strategists) and some of whom are drifting (true believers).

  **Case 3: You and Your Friend (The Disagreement Question)**
  *   *Scenario:* You argue about the moon landing. At *t1*, you disagree on proposition *p1* (specific photos are faked). At *t2*, after explanations, they believe *p2* (subtle fakery).
  *   *Verdict:* At *t1*, you are having a genuine disagreement. At *t2*, you are **talking past one another**.
  *   *Reasoning:* For a disagreement to be genuine, you must be assessing the same proposition (or at least overlapping truth conditions). If the content of their belief has drifted sufficiently via CDD, the sentence 'The moon landing was faked' no longer picks out the same state of affairs. You are assessing *p1* (falsified); they are assessing *p2* (unfalsified).
  *   *Implication:* This is a form of **diachronic incommensurability**. It is not that they are irrational; it is that the identity conditions of their belief have failed to hold. You cannot update their credence because the 'belief' they are holding is not the one you are attacking.

  ### Why This Matters for Your Seminar

  If you introduce **Covert Doxastic Drift** to your students, it solves a pedagogical problem. Usually, when discussing conspiracy theories, we treat the believers as if they are holding a static false belief. We say, 'Here is the evidence against *p*.' They say, 'I still believe *p*.' We call them dogmatic.

  But if you frame it as CDD, you can show that *p-at-time-1* is not *p-at-time-2*. The problem isn't just that they refuse to update; it's that the *object* of their belief is fluid. This moves the critique from 'they are ignoring evidence' to 'their belief lacks identity conditions'.

  It also bridges your work on measurement. You can frame the conspiracy belief as a **measurement instrument that has lost validity**. The sentence is the ruler; the reality is the length. If the ruler shrinks every time you measure the wood, you aren't doing science. You are doing CDD.

  ### A Final Note on Terminology

  If 'Covert Doxastic Drift' feels too neologistic for your taste, the closest existing phrase in the sociology of scientific knowledge is **'Interpretive Flexibility'** (Pinch and Bijker), but that usually applies to technology and is often collective. In the specific literature on conspiracy theories, **Clarke (2002)** and **Sunstein & Vermeule (2009)** discuss 'self-sealing' arguments, but they treat it as a logical feature, not a psychological drift.

  I recommend sticking with **Covert Doxastic Drift**. It is precise, it honours the doxastic nature of the state, and it captures the 'sneakiness' of the content migration without imputing malice to the believer.

  Good luck with the term. It is a proper nuisance when the phenomena outpace the vocabulary, but I suspect this one will stick.

  Yours sincerely,

  [Your Name/AI Assistant]
