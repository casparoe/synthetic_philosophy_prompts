  # Diagnostic Decision Tree: Conceptions of Liberty

  **Instructions:** Start at the root. Answer each question based on your immediate intuition about the specific scenario described. Follow the branch that matches your answer until you reach a leaf.

  ### The Tree

  **Node 1 (Root): The Locked Gate**
  *Case:* You wish to walk through a gate. A neighbor holds the only key. They never lock the gate, never try to stop you, and you never try to leave.
  *Question:* Does the neighbor's *possession of the key* count as preventing you from passing, even if they never use it?
  *   **No:** (Prevention requires action). Go to **Node 2**.
  *   **Yes:** (Prevention includes standing power). Go to **Node 5**.

  **Node 2: The Washed-Out Road**
  *Case:* You wish to drive to town. A bridge has collapsed due to a storm. No person caused this; no person holds the power to fix it.
  *Question:* Does the collapsed bridge count as preventing you from driving, just as a locked gate would?
  *   **Yes:** (Obstacles count, agents do not). Go to **Node 3**.
  *   **No:** (Only human will counts). Go to **Node 4**.

  **Node 3: The Addiction**
  *Case:* You wish to stop drinking. No one is forcing you to drink. Your own physiology and psychology compel you to continue.
  *Question:* Does your own compulsion count as preventing you from quitting, just as a locked gate would?
  *   **Yes:** (Internal barriers count). → **Leaf A**.
  *   **No:** (Only external barriers count). → **Leaf B**.

  **Node 4: The Law You Voted For**
  *Case:* You are required to pay a tax. You voted for this law, you endorse it, and you believe it is just.
  *Question:* Does this requirement count as preventing you from keeping your money, just as a thief would?
  *   **Yes:** (Constraint is constraint). → **Leaf C**.
  *   **No:** (Endorsement removes prevention). → **Leaf D**.

  **Node 5: The Kind Superior**
  *Case:* You are an employee. Your boss has the legal power to fire you without cause. However, they are legally required to consult you, they reliably act in your interest, and they never threaten you.
  *Question:* Does their *power to fire you* count as preventing you from acting as an equal, even if they never use it?
  *   **Yes:** (Dependence is prevention). Go to **Node 6**.
  *   **No:** (Only arbitrary power prevents). Go to **Node 7**.

  **Node 6: The Hidden Key**
  *Case:* Return to the **Locked Gate** (Node 1). You do not know the neighbor holds the key. They never use it.
  *Question:* Does their secret power count as preventing you, even if you are unaware of it?
  *   **Yes:** (Status is objective). → **Leaf E**.
  *   **No:** (Prevention requires awareness). → **Leaf F**.

  **Node 7: The Unlikely Interference**
  *Case:* Return to the **Kind Superior** (Node 5). They have power, but it is statistically improbable they would ever use it.
  *Question:* Does the *risk* of their interference count as preventing you, or only the certainty?
  *   **Yes:** (Risk is prevention). → **Leaf G**.
  *   **No:** (Only high probability counts). → **Leaf H**.

  ***

  ### Leaf Mapping & Logical Space Analysis

  Below, the leaves are mapped to their conventional theoretical labels. Following this is a map of the logical space, identifying occupied and unoccupied cells.

  | Leaf | Intuition Profile | Conventional Label |
  | :--- | :--- | :--- |
  | **A** | Power irrelevant; Structure & Internal constraints count. | **Positive Liberty (Self-Mastery)** |
  | **B** | Power irrelevant; Structure counts; Internal constraints do not. | *Unoccupied (Capability Approach variant)* |
  | **C** | Power irrelevant; Agent required; Endorsement irrelevant. | **Negative Liberty** |
  | **D** | Power irrelevant; Agent required; Endorsement removes constraint. | *Unoccupied (Rousseauvian variant)* |
  | **E** | Power counts; Arbitrariness irrelevant; Awareness irrelevant. | **Freedom as Non-Dependence (Strong)** |
  | **F** | Power counts; Arbitrariness irrelevant; Awareness required. | *Unoccupied (Subjective Domination)* |
  | **G** | Power counts; Arbitrariness matters; Risk counts. | **Republican Liberty (Non-Domination)** |
  | **H** | Power counts; Arbitrariness matters; Risk irrelevant. | *Unoccupied (Probabilistic Liberty)* |

  #### The Logical Space Map

  The tree cuts the logical space along four axes:
  1.  **Interference vs. Power:** (Node 1)
  2.  **Agent vs. Structure:** (Node 2)
  3.  **External vs. Internal:** (Node 3)
  4.  **Arbitrary vs. Non-Arbitrary Power:** (Node 5)
  5.  **Objective vs. Subjective Status:** (Node 6 & 7)

  **Occupied Cells:**
  *   **Negative Liberty:** (Node 1: No, Node 2: No, Node 4: Yes). Unfreedom requires actual interference by an agent, regardless of consent.
  *   **Republican Liberty:** (Node 1: Yes, Node 5: No, Node 7: Yes). Unfreedom is standing power, but only if arbitrary (risk of interference).
  *   **Positive Liberty (Self-Mastery):** (Node 1: No, Node 2: Yes, Node 3: Yes). Unfreedom includes structural barriers and internal psychological constraints.
  *   **Freedom as Non-Dependence:** (Node 1: Yes, Node 5: Yes, Node 6: Yes). Unfreedom is any dependence on another's will, regardless of arbitrariness or awareness.

  **Unoccupied Cells:**
  *   **Leaf B (Structural Positive only):** *Unattractive.* It is theoretically unstable to claim a washed-out road makes you unfree but your own addiction does not. Most Positive theorists accept both.
  *   **Leaf D (Democratic Positive only):** *Unexplored/Incoherent.* If interference doesn't count because you voted for it, this collapses into the Republican view (non-arbitrary power) or requires a metaphysical claim about the "real self" that first-year students rarely hold intuitively without training.
  *   **Leaf F (Subjective Non-Dependence):** *Incoherent.* If dependence itself is the harm, the subject's knowledge of it is secondary. A slave who doesn't know they can be sold is still dominated.
  *   **Leaf H (Probabilistic Republican):** *Unattractive.* Republicanism is a theory of *status*, not risk assessment. If the power exists, the status is compromised, regardless of probability.

  ***

  ### Limitations & Flagged Pairs

  **Flagged Pair: Leaf A (Positive Self-Mastery) and Leaf D (Democratic Positive)**
  *   **Issue:** The tree cannot fully separate the "Internal Constraint" view (Addiction) from the "Endorsed Law" view (Democratic Self-Rule). Both land on variants of Positive Liberty.
  *   **Reason:** Both rely on a distinction between the "real" will and the "actual" will. A student who says addiction makes them unfree (Leaf A) will almost always say an endorsed law makes them free (Leaf D).
  *   **Extra Case Needed:** **The Brainwashed Citizen.** A case where a student endorses a law *because* they were manipulated to do so. This separates "Endorsement" (Leaf D) from "Autonomy" (Leaf A). If they say the brainwashed citizen is unfree despite endorsing the law, they hold a "Real Self" Positive view (Leaf A). If they say the citizen is free because they endorse it, they hold a "Procedural" Positive view (Leaf D).

  **Flagged Pair: Leaf G (Republican) and Leaf E (Strong Non-Dependence)**
  *   **Issue:** These leaves are separated only by the "Kind Superior" node (Arbitrariness). In practice, students often struggle to distinguish between "power that *could* be arbitrary" and "power that *is* arbitrary."
  *   **Extra Case Needed:** **The Benevolent Dictator.** A ruler who has absolute power but is constitutionally incapable of acting against your interests (e.g., an AI programmed for your welfare). Republicans say you are free (non-arbitrary). Strong Non-Dependence theorists say you are unfree (dependent). This sharpens the cut at Node 5.
