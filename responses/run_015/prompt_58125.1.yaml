      *   *Adjustment:* Make sure to explicitly state that Claim 1 is the weak link holding the rest hostage. If Claim 1 is the axiom, 3 and 4 break. If 3 and 5 are axioms, 1 breaks.

  7.  **Final Polish:** (Produces the final response below).
