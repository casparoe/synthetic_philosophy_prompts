answer: |-
  ### Brainstorming: The Moral Geometry of the Extended Self

  When we sit with an advance directive (AD) in a committee room, we are essentially adjudicating a dispute between two temporal stages of a person who may no longer be the same moral agent. The core tension isn't just about autonomy; it's about metaphysics. If the person who signed the paper is psychologically discontinuous with the person in the bed, enforcing the paper looks less like respecting autonomy and more like necrocracy—rule by the dead. But if we discard the paper too easily, we undermine the very purpose of planning, which is to bind our future selves against caprice or degradation. The morally relevant dimensions, then, must capture both the *identity* of the agent and the *quality* of the decision.

  Continuity is the bedrock, but it's not a switch; it's a dimmer. However, continuity alone is insufficient because a continuous person can be misinformed. Information matters because autonomy requires knowledge of the consequences. But even a continuous, informed agent might have signed under duress or depression, so Voluntariness is the third leg. Yet, looking at these three, I realize they all focus on the *past*. They ignore the current state of the patient. A crucial dimension missing from a purely backward-looking principle is the *authenticity of the current wish*. If the current wish is a symptom of mania or anorexia, it lacks moral weight regardless of the AD. Conversely, if the current wish is a rational adaptation to new circumstances, it carries immense weight. The trade-off isn't just between past factors; it's between the past self's right to plan and the current self's right to exist without suffering based on outdated predictions.

  This suggests that some dimensions function as thresholds rather than weights. Competence, for instance, shouldn't be scalar; you are either capable of making a decision or you aren't. Continuity might be scalar, but below a certain point, the authority should drop to zero, not just diminish. The stakes also matter multiplicatively: the authority required to refuse life-saving treatment must be higher than the authority required to refuse a specific antibiotic. A principle that treats all decisions as equally scalable risks allowing a weakly authorized AD to trigger death, which is a categorical error. We need a model that respects the past self's planning without sacrificing the current self's welfare when the two diverge radically.

  ### Case Applications

