      *   **Goodman:** The "New Riddle of Induction." "Grue" (green before time $t$, blue after). Why project "green" and not "grue"? Solution involves "entrenchment" of predicates (linguistic/conceptual history).
      *   **Modern ML (LLMs/Deep Nets):** Models *do* generalize. They *do* pick "green" over "grue" (usually). Why? Inductive biases (architecture, optimization dynamics like SGD, data priors). This looks like a *solution* to the underdetermination problem, but it's not "rational" in the logical sense; it's structural/statistical.
      *   **The Tension:** Hume says there's no *logical* reason for induction. Rationalists (like Chomsky or certain Bayesians) say there must be *innate structure* to make learning possible. ML shows that *implicit* structure (bias) exists, but is it "rational" or just "causal/physical"?

  3.  **Formulate the Verdict:**
