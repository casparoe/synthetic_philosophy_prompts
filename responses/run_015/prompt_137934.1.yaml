          *   *Acausal Threats (TDT/UDT style):* This is trickier. Standard deterrence theory is usually causal/reputational. True "acausal" trade/threats require specific assumptions about logical correlation between agents. Applying this to nation-states is often a category error, but the user wants it interrogated.

