prompt: |-
  I would be grateful for your comments on the essay notes below. They sketch the argument of a paper I am planning on the non-identity problem; I want to know whether its central move can be made to work before I write it up at length. Please do not spend your reply summarising the standard positions in the literature — I know them, and restating them is not useful to me. What I want is pressure on the argument itself.

  ---

  **Slots, Not Persons: Filling-Relative Assessment for Identity-Affecting Choice** *(notes)*

  **§1. Where I take the debate to be stuck.** In the familiar family of cases — a girl conceives at fourteen rather than waiting; a government depletes rather than conserves; prospective parents select for a child who will be deaf when they could have selected otherwise — the agent's act is a condition of the existence of the individual it affects. Whoever ends up existing has a life worth living and would not have existed had the agent acted otherwise. So the act cannot be wrong in virtue of making someone worse off, and yet it seems wrong.

  There are two familiar packages. Keep the person-affecting restriction and accept that such acts are not wrong, unless the life produced is not worth living at all. Or abandon the restriction for an impersonal axiology that ranks outcomes by total or average welfare, and accept that the wrongness of such acts is of a piece with the wrongness of failing to add further happy people to the world. I want to claim that these packages share an assumption, which I will call *identity-determined assessment*: the moral significance of an outcome is a function of which individuals it contains, so that outcomes differing only in who exists are morally incomparable unless one reaches for an impersonal value. The first package holds the assumption and pays in counter-intuitive verdicts; the second abandons it and pays in implications elsewhere.

  **§2. The proposal.** Deny the assumption while keeping the relational structure of wrongness. Distinguish the *occupants* of an act's effects from the *slots* those occupants fill. Slots are the positions that the agent's practical question was about: my first child, the patient who receives this kidney, a resident of this city in 2120, the child of the violinist I hire. Feasible options in identity-affecting cases differ not merely in who fills those slots but in how well they are filled. Proposal: an act is pro tanto wrong when, relative to the practical question the agent actually faced, it fills some slot worse than a feasible alternative fills the corresponding slot, and fills no slot better. Call this *filling-relative assessment*.

  **§3. The complaint.** On this view the child of the girl who conceived at fourteen has a genuine complaint, but not the counterfactual one — not that she would have been better off had her mother waited. The complaint concerns occupancy: the slot you filled, your first child, you filled below the level that was open to you, and you did it knowingly. Wrongness becomes a relation between an agent, a slot her choice filled, and the alternatives she had. It does not require that the complainant would have existed under any alternative, only that she occupies a slot the agent was in a position to fill well. So the view keeps no wrong without a possible complainant while dropping no complainant without counterfactual improvement. That combination is the whole point of the paper.

  **§4. Two claimed payoffs.** First, the view generates no verdicts in different-number cases. Where the options differ in how many slots there are, there is no counterpart matching to perform and filling-relative assessment is undefined. The procreation asymmetry and the repugnant conclusion are therefore outside its scope. I intend to present this as a virtue rather than a gap, on the grounds that these are separate problems needing separate resources, but I am aware it may look like an evasion. Second, the view appears to describe what large-scale institutional reasoning already does: cost-benefit analysis, risk regulation and demographic forecasting compare outcomes slot-wise, by reference to positions and statistical lives rather than to identified individuals, and feel no embarrassment about it.

  **§5. The soft spot: matching.** Filling-relative assessment needs a counterpart relation between slots in distinct outcomes, and identity cannot supply one. My suggestion is that the relation is supplied by the practical question: the slots are those the agent's deliberation was already about, and the matching is fixed by what she was choosing between. I expect this to be where the view fails if it fails. If the practical question can be redrawn freely — individuate the slots by ordering their occupants by welfare, and match in that order — filling-relative assessment becomes a maximising impersonal view in disguise. I gesture at a constraint, that slots must be individuated independently of the welfare levels of their occupants on pain of begging the question, but I do not think I have shown that the constraint bites.

  **§6. The soft spot: propagation.** Consider an orchestra. A conductor can appoint a competent first-chair violinist now, or hold further auditions and appoint a stronger player in five years. Either appointment determines where a person lives, whom she meets, and hence which children come to exist; so the decision fixes the filling of slots indefinitely far downstream, and filling-relative assessment is now comparing whole genealogical futures. If slots propagate without limit, every hiring decision becomes an occasion for optimising the welfare of the descendants of every candidate, and the view collapses back into impersonalism. If they do not propagate, I owe a principled cut-off, and I do not have one. My current line is that the slots that matter are those the agent could have foreseen being affected; but foresight is scalar, which would make the verdicts of the view come in degrees where I had hoped for something binary.

  ---

  **What I would like from you.**

  1. Is the diagnosis in §1 fair, or does filling-relative assessment already sit on the standard menu under a different description? If it is a redescription of a position you recognise, say in your own terms what the redescription is supposed to buy and whether it buys it.
  2. Attack §5. What, if anything, constrains the counterpart relation? Try to construct a case in which the practical question is genuinely indeterminate between two matchings and the verdict flips depending on which one is chosen.
  3. Is the propagation problem in §6 fatal, or is there a non-ad-hoc cut-off? Does the orchestra case show the view is wrong, or only that it must become a view about foresight — and would that be a cost or an unexpected gain?
  4. Is the silence claimed in §4 defensible? A view that falls silent exactly where the number of possible people varies may turn out to have no advantage over the views it was meant to replace.
  5. If you were refereeing this, which section would you say is weakest, and what is the single objection you would put first?

  Tell me where I am wrong rather than where I am unclear, and feel free to say if you think the whole framing of §2 is confused.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the Request:**
      *   **Task:** Critique essay notes on a paper about the Non-Identity Problem (NIP).
      *   **Topic:** "Slots, Not Persons: Filling-Relative Assessment for Identity-Affecting Choice."
      *   **Constraint:** Do *not* summarize standard positions (I know them). Focus on pressure on the argument itself. Tell me where I am wrong, not just unclear.
      *   **Specific Questions:**
          1.  Is the diagnosis in §1 fair? Is this a redescription of an existing view?
          2.  Attack §5 (Matching/Counterpart relation). Construct a case where the verdict flips based on matching.
          3.  Is the propagation problem (§6) fatal? Is there a non-ad-hoc cut-off?
          4.  Is the silence on different-number cases (§4) defensible?
          5.  Referee report: Weakest section and single first objection.

  2.  **Analyze the Core Argument (The "Slots" View):**
      *   **Problem:** NIP cases (e.g., 14-year-old girl). Act creates person $P$. Alternative creates person $Q$. $P$ has a life worth living but worse than $Q$'s would have been. Standard person-affecting views say act isn't wrong (no one harmed). Impersonal views say it is wrong but entail repugnant conclusions/etc.
      *   **Proposal:** Distinguish *occupants* (specific people) from *slots* (roles/positions defined by the practical question, e.g., "my first child").
      *   **Mechanism:** An act is wrong if it fills a slot worse than an alternative fills the *corresponding* slot, without filling any slot better.
      *   **Key Move:** Wrongness is relational (Agent -> Slot -> Alternative), not purely outcome-based or purely person-affecting in the standard sense.
      *   **Claimed Advantage:** Avoids impersonal axiology (no total/average welfare maximization across all possible people) while still condemning NIP cases. Avoids different-number cases (scope limitation).

  3.  **Drafting the Critique - Section by Section:**

      *   **§1 (Diagnosis/Originality):**
          *   *Thought:* Is this new? It sounds like "Person-Affecting Restriction + Counterpart Theory" or "Wide Person-Affecting View" (Parfit). It also resonates with "Harm as Setting Back Interests" but applied to roles. It's very close to the "Same Number Quality Claim" (Q) but tries to ground it without impersonal value.
          *   *Critique:* It looks like a sophisticated version of the "Wide Person-Affecting View" or a specific form of "Counterpart Theory" (e.g., Roberts, Wasserman). The "Slot" language is new, but the logical structure (comparing $P$ in World A to $Q$ in World B via a relation other than identity) is established.
          *   *Value Add:* Does the "Slot" metaphor buy anything? It shifts focus from metaphysics of identity to pragmatics of deliberation. That's the potential gain. But is it stable?

      *   **§5 (Matching/Counterpart Relation):**
          *   *Thought:* This is the metaphysical/semantic engine. If slots are defined by the "practical question," who defines the question? The agent? The theorist?
          *   *Challenge:* The "Re-description Problem." If I can describe the slot as "the happiest possible child," I maximize. If I describe it as "the child born on Tuesday," I might not.
          *   *Specific Case:* Suppose a mother can have Child A (welfare 50) now or Child B (welfare 80) later.
              *   Description 1: Slot = "My biological child." Match: A corresponds to B. Verdict: Wrong to have A.
              *   Description 2: Slot 1 = "Child born in 2024," Slot 2 = "Child born in 2029." Match: No correspondence (different slots). Verdict: Incomparable/No wrong.
              *   The agent's deliberation determines the slots. But agents can deliberate poorly or strategically. If the view relies on the *agent's* conception of the slots, it makes moral wrongness dependent on the agent's conceptual sophistication. If it relies on the *theorist's* reconstruction, it risks circularity (theorist reconstructs slots to get the desired moral verdict).
          *   *The "Flip" Case:* A government policy. Option A: Build dam, displaces 1000 specific people (Slots: Residents of Valley X). Option B: Don't build dam, 1000 different people live there later (due to demographic shifts).
              *   If Slot = "Resident of Valley X at t1," A fills it (badly for some), B leaves it empty? Or B fills it with others?
              *   If the practical question is "How to maximize utility for the constituency," the slots become "constituent-holders," leading to impersonalism.
              *   If the practical question is "Should I build this dam," the slots are opaque.
              *   *Crucial Point:* The "Practical Question" is too malleable. It invites "gerrymandering" of slots to avoid verdicts.

      *   **§6 (Propagation/Downstream Effects):**
          *   *Thought:* This is the "Non-Identity Problem" coming back in through the back door. If choosing Violinist A vs. B changes who exists in 2120, do we compare the "2120 Resident" slot?
          *   *Critique:* If you cut off propagation at "foreseeability," you make moral status depend on epistemic limits. If you don't cut it off, you compare infinite futures -> Impersonalism.
          *   *The "Orchestra" Case:* Conductor hires V1 (good) vs V2 (better). V1 has unhappy descendants. V2 has happy descendants.
              *   If slots propagate: We must compare the "Descendant Slot." This requires summing welfare -> Impersonalism.
              *   If slots don't propagate: Why not? The causal chain is identical to the 14-year-old girl case.
              *   *Fatal Flaw:* The view claims to solve NIP, but NIP *is* the propagation problem. If you solve it for the immediate child but not the grandchildren, you have an arbitrary cutoff. If you solve it for grandchildren, you need a metric to compare the "Grandchild Slot" welfare, which looks exactly like total utility.
              *   *Foresight:* Making it about foresight turns it into a negligence view, not a structural view about wrongness. It loses the "Non-Identity" bite.

      *   **§4 (Different-Number Silence):**
          *   *Thought:* Claiming silence on different-number cases is a "feature, not a bug."
          *   *Critique:* This is the biggest vulnerability. Many NIP cases *are* different-number cases (or borderline). More importantly, if the view cannot handle the Repugnant Conclusion, it hasn't really improved on Total Utilitarianism enough to justify the complexity. It looks like "I only solve the cases where my theory works."
          *   *Defensibility:* It's defensible *only if* the "Slot" ontology genuinely breaks down when numbers differ. But why? If I can have 1 child (Slot A) or 2 children (Slot A + Slot B), can't I compare Slot A in World 1 to Slot A in World 2? The problem is the *extra* slot. The view says "undefined." This looks like an admission that the theory is incomplete.

      *   **Referee Report (Weakest Section/First Objection):**
          *   *Weakest:* §5 (Matching). It's the engine room, and it's under-specified.
          *   *First Objection:* The "Gerrymandering Objection." The agent can manipulate the moral verdict by framing the practical question (and thus the slots) strategically.

  4.  **Refining the Arguments (Self-Correction/Sharpening):**
      *   *On §1:* Be careful not to say "It's just Counterpart Theory." Say "It relies on Counterpart Theory but tries to ground it pragmatically. The risk is that the pragmatic grounding is unstable."
      *   *On §5:* I need a concrete case where the "Practical Question" is ambiguous.
          *   *Case:* A doctor has one kidney. Patient X (young) or Patient Y (old).
          *   *Question 1:* "Who gets the kidney?" -> Slots: Recipient. Match: X to Y.
          *   *Question 2:* "Do I save the young life or the old life?" -> Slots: Young-Life, Old-Life.
          *   *Question 3:* "Do I perform Surgery A or Surgery B?" -> Slots: Surgical Outcome.
          *   If the moral verdict depends on how the agent *happens* to frame the deliberation, the theory is subjective. If the theorist fixes the framing, the theory is paternalistic/circular.
      *   *On §6:* The "Foresight" move is a concession. It turns the NIP (a metaphysical problem about identity) into an epistemic problem (what did you know?). This changes the nature of the wrong. It might be a gain (makes it actionable) but it loses the philosophical punch of solving the NIP.
      *   *On §4:* The "Silence" is dangerous. If the theory works for Same-Number but fails for Different-Number, and Many NIP cases are Different-Number (e.g., conservation policy affects population size), the scope is too narrow.

  5.  **Final Polish:** Ensure tone is critical but constructive. Adhere strictly to the "no summarizing standard views" rule. Focus on internal consistency and argumentative pressure.

      *   *Check:* Did I answer all 5 specific questions? Yes.
      *   *Check:* Did I avoid summarizing Parfit/Sikora/etc.? Yes.
      *   *Check:* Is the critique sharp? Yes, focusing on the malleability of "Slots" and the propagation collapse.

  6.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is the pressure you requested, organized by your five questions.

  ### 1. The Diagnosis (§1) and Originality
  Your diagnosis is fair in identifying the stalemate, but your claim to novelty is precarious. "Filling-relative assessment" is structurally isomorphic to the **Wide Person-Affecting View** (specifically the version utilizing counterpart relations) and shares significant DNA with **role-based obligations** in contractualist frameworks.

  The "Slot" terminology is a useful heuristic, but it does not yet buy you a metaphysical escape from the standard dilemma. The standard Wide Person-Affecting View already claims that $P$ in World 1 can be compared to $Q$ in World 2 if they are "counterparts." Your move is to ground the counterpart relation in the *practical question* rather than metaphysical similarity or causal history.

  **What this buys you:** It shifts the burden from metaphysics (what makes $P$ and $Q$ counterparts?) to pragmatics (what was the agent doing?). This is a genuine gain *if* the pragmatics are stable.
  **What it costs:** It makes moral verdicts dependent on the *description of the deliberation*. If the agent deliberates poorly or under a misleading description, does the moral reality shift? If you say "no, the theorist fixes the slots," you have reintroduced the impersonal arbiter you sought to avoid. If you say "yes, the agent's framing fixes the slots," you allow agents to reason their way out of wrongdoing by narrowing their practical question (e.g., "I wasn't choosing a child's welfare, I was choosing whether to have sex at 2:00 PM").

  ### 2. Attack on Matching (§5)
  This is the engine room, and it is where the view is most vulnerable to **gerrymandering**. The constraint that slots must be "individuated independently of welfare" is necessary but insufficient. The real problem is the **individuation of the slots themselves**.

  **The Flip Case:**
  Consider a government deciding between two infrastructure projects.
  *   **Option A:** Build a dam. 1,000 specific people (Set $S_A$) live in the valley and are displaced. They have welfare 50.
  *   **Option B:** Do not build. 1,000 different people (Set $S_B$) live in the valley over the next century due to demographic drift. They have welfare 80.
  *   **Option C:** Build a bridge elsewhere. No one is displaced. 1,000 people (Set $S_C$) live in the valley (mostly $S_B$). Welfare 80.

  *Practical Question 1:* "How do we manage the Valley's residency?"
  *   **Slots:** "Resident of the Valley."
  *   **Matching:** The slot "Resident" in Option A is matched to "Resident" in Option B.
  *   **Verdict:** Option A is wrong (fills the slot worse).

  *Practical Question 2:* "Should we authorize Construction Project Alpha?"
  *   **Slots:** "Outcome of Project Alpha" vs. "Outcome of No Project."
  *   **Matching:** These are distinct slots. There is no single "Resident" slot being filled differently; rather, different worlds contain different sets of people.
  *   **Verdict:** Filling-relative assessment is undefined (or incomparable). No wrong.

  If the moral verdict flips based on whether the agent frames the choice as *managing a resource* vs. *authorizing a project*, the theory lacks normative grip. You need a rule for which practical questions are morally admissible. If you supply that rule, it will likely look like an impersonal principle (e.g., "frame the question to include all affected interests"), which collapses the view back into the impersonal axiology you rejected in §1.

  ### 3. The Propagation Problem (§6)
  This is not just a soft spot; it is potentially fatal. The Non-Identity Problem *is* a propagation problem. The reason the 14-year-old girl's child is non-identical to the waited-for child is precisely because the choice propagates through gametes and conception timing.

  If you cut off propagation at "foreseeability," you have not solved the Non-Identity Problem; you have **converted it into a negligence standard**.
  *   **The Cost:** You lose the claim that the act is wrong *because* it creates a worse-off person. Instead, it is wrong because the agent *failed to foresee* the downstream identity effects. This makes the wrongness epistemic, not ontological. A prescient agent who knows the downstream effects would, on your view, be forced into impersonal maximization (comparing the infinite genealogical futures). A non-prescient agent escapes the verdict.
  *   **The Gain:** It makes the view actionable. But it surrenders the philosophical high ground. You claimed to solve the puzzle of how an act can be wrong when it harms no one. If the answer is "it harms no one, but the agent was negligent regarding slots," you have changed the subject.
  *   **Non-Ad-Hoc Cutoff:** There is no obvious non-ad-hoc cutoff other than "direct occupancy." But in the 14-year-old case, the child is a direct occupant of the "child" slot. In the orchestra case, the descendants are occupants of the "descendant" slot. If you deny the "descendant" slot exists for the conductor, you must explain why the "child" slot exists for the mother. The causal structure is identical. To distinguish them, you must rely on social conventions about roles, which makes morality contingent on social ontology.

  ### 4. Defensibility of Silence (§4)
  Claiming silence on different-number cases is the most dangerous strategic move in the paper.
  *   **The Vulnerability:** Many paradigmatic Non-Identity cases are different-number cases (e.g., climate policy affects population size over centuries). If your view falls silent on climate policy because the population counts differ, it fails to address the most urgent applications of the problem.
  *   **The "Evasion" Charge:** You anticipate this, but calling it a "virtue" is hard to sustain. A moral theory that cannot compare a world with 10 billion happy people to a world with 10 billion *very* happy people (because the individuals differ) is radically incomplete.
  *   **Defense Strategy:** To defend this, you must argue that "Slots" are ontologically dependent on fixed capacities. E.g., "A family has 2 child-slots." But this is empirically false (families vary in size). If you ground slots in *resources* (e.g., "amount of welfare-support available"), you are back to averaging/totalizing.
  *   **Verdict:** This silence is not defensible as a virtue unless you can show that different-number cases are *conceptually distinct* from same-number cases in a way that matters for agency. Merely stating they are "separate problems" looks like limiting the scope to where the theory works.

  ### 5. Referee Report
  **Weakest Section:** **§5 (Matching).**
  It carries the entire weight of the argument but relies on the notion of a "practical question" which is left under-theorized. Without a rigorous account of how practical questions individuate slots, the view is vulnerable to the description-relativity objection outlined in point 2 above.

  **Single First Objection:**
  **The Description-Relativity Objection:**
  "Filling-relative assessment makes the wrongness of an act dependent on how the agent (or theorist) describes the available options. Since any choice can be described under multiple practical questions (e.g., 'choosing a child' vs. 'choosing a time to conceive'), the verdict of wrongness becomes unstable. If you fix the description objectively to prevent this, you reintroduce the impersonal standpoint you sought to avoid; if you leave it to the agent, you allow moral evasion through narrow framing."

  ### Summary Advice
  The "Slot" metaphor is vivid, but currently functions as a placeholder for a counterpart relation. To make this work, you must harden the account of **slot individuation**. You need to explain why "My First Child" is a morally salient slot that persists across possible worlds, while "The Person Born at 2:00 PM" is not, without appealing to welfare maximization or arbitrary convention. If you cannot ground the ontology of slots independently of the moral verdicts you want them to produce, the view will be accused of circularity.
