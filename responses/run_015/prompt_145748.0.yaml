answer: |-
  There is no single, canonical term in Anglophone moral philosophy that captures this precise configuration. The phenomenon you describe is a hybrid: it marries an ontological claim about moral identity (constitutivism) with an epistemological claim about moral access (closure).

  In the literature, the first half of your description aligns with **Role Constitutivism** (the view that moral obligations are constituted by social roles rather than imposed upon them). The second half—the claim that outsiders lack the standing or capacity to evaluate those obligations—aligns with concepts found in **Communitarianism** (specifically MacIntyre's "internal goods of a practice") and sociological **Closure Theory** (Frank Parkin's work on how groups monopolize resources by restricting access). However, neither fully captures the specific *defensive* maneuver you have isolated, where the *relationship itself* generates an epistemic barrier.

  To facilitate the conceptual carving you request, I propose we label this phenomenon **"Constitutive Moral Closure."**

  Below is the analysis of its boundaries, its distinctions from adjacent concepts, and the vulnerabilities inherent in treating it as a distinct category.

  ### 1. Conceptual Definition: Constitutive Moral Closure

  **Constitutive Moral Closure** occurs when an agent justifies an action via two conjoined claims:
  1.  **Ontological Claim:** The obligation is not instrumental to the role (e.g., "I do this to maintain the family") but constitutive of it (e.g., "To do otherwise is to cease being a father").
  2.  **Epistemic Claim:** The normative content of the role is inaccessible to non-participants. Evaluation requires "insider" status, not merely rational observation.

  This differs from standard role ethics because it denies the possibility of an external audit. In standard role ethics (e.g., a judge recusing themselves), the rules are codified and publicly intelligible. In Constitutive Moral Closure, the "rules" are embedded in the lived practice of the relationship, rendering them opaque to the outsider.

  ### 2. Conceptual Boundaries (The "Carving")

  To distinguish this from adjacent concepts, we must look at the *source of authority* and the *conditions for critique*.

  **A. Vs. Conventional Role Ethics (Contractual/Functional)**
  *   **Conventional:** A doctor's obligation to confidentiality is justified by social utility (patients must trust doctors) or implicit contract. It is auditable by medical boards (outsiders).
  *   **Constitutive Closure:** A father's obligation to favor his child is justified because "fatherhood" is defined by partiality. A medical board cannot audit this, because the "board" does not inhabit the father-child relation.
  *   **The Edge:** If the role obligation can be explained by reference to a third-party good (societal welfare, institutional integrity), it is *not* Constitutive Moral Closure. Closure requires the good to be internal and inaccessible.

  **B. Vs. Moral Particularism**
  *   **Particularism:** Denies that moral principles exist across contexts (e.g., "Lying is usually wrong, but not here"). It relies on the sensitivity of the moral agent to the specific situation.
  *   **Constitutive Closure:** Does not necessarily deny principles. It asserts that principles *exist* but are *local to the relationship*. It is not that "anything goes" (particularism), but that "the law of this relationship is invisible to you."
  *   **The Edge:** If the defender admits, "There is no rule here, I just felt it was right," that is particularism. If they say, "There is a rule of fatherhood, but you cannot read it," that is Closure.

  **C. Vs. Technical Expertise Authority**
  *   **Expertise:** "You cannot judge my bridge design because you are not an engineer." This relies on specialized *knowledge* that is, in principle, transferable. You could become an engineer.
  *   **Constitutive Closure:** "You cannot judge my filial piety because you are not my son." This relies on *identity* and *position*. The knowledge is not transferable because the relationship is non-fungible.
  *   **The Edge:** If the barrier to judgment is educational (learn the physics), it is expertise. If the barrier is existential (inhabit the relation), it is Closure.

  ### 3. Vulnerability Analysis

  As a physicist, you will appreciate that a model is only as good as its failure modes. Treating "Constitutive Moral Closure" as a distinct phenomenon carries two primary vulnerabilities. If these conditions obtain, the concept collapses into a variant of familiar role-based reasoning or rhetorical special pleading.

  **Vulnerability A: The "Remonstrance" Counterexample (Internal Correction)**
  *   **The Challenge:** In orthodox Confucianism (the likely source of this pattern), roles are not absolute silos. A son may remonstrate with a father; a minister may correct a ruler. This implies there *is* a shared standard of Righteousness (*Yi*) that transcends the specific relationship and is accessible to the outsider (or at least to the moral community at large).
  *   **The Risk:** If the role-bearer admits that their action could be wrong *even by the standards of the role*, and that an outsider could theoretically identify that error (e.g., "A true father would not do this"), then the Epistemic Claim fails. The closure is not total; it is merely a claim of *difficulty*, not *impossibility*.
  *   **Revision Condition:** If you observe defenders admitting that "universal human standards" could override the role obligation, you are no longer observing Constitutive Moral Closure. You are observing **Role Priority**, which is a standard weighing of values, not an epistemic shield.

  **Vulnerability B: The "Atrocity" Limit (Universal Constraints)**
  *   **The Challenge:** If a parent harms a child severely, and defends it via Constitutive Moral Closure ("You don't understand what my discipline requires"), society typically rejects the defense not just morally but conceptually. We say they have *forfeited* the role.
  *   **The Risk:** This suggests the "role" is not the source of the obligation, but rather a container that must itself meet external moral criteria to remain valid. If the role is contingent on meeting external moral minima, then the "Closure" is an illusion; the role is always subject to external audit, even if that audit is rarely invoked.
  *   **Revision Condition:** If the validity of the role itself depends on external moral verification (e.g., "You are only a father if you do not abuse"), then the epistemic barrier is permeable. The phenomenon would then be better described as **Immunized Role Rhetoric**—a social strategy to avoid accountability, rather than a distinct moral ontology.

  ### 4. Summary of the Distinction

  The phenomenon you have identified is distinct **only if** the defender maintains that the *criteria for judgment* are generated by the relationship itself and cannot be translated into a universal language without loss of meaning.

  *   **It is NOT Constitutive Moral Closure if:** The defender appeals to the long-term welfare of the child (instrumental), appeals to a universal law they happen to know better (expertise), or admits that gross violations would invalidate their standing (external constraint).
  *   **It IS Constitutive Moral Closure if:** The defender insists that the *meaning* of the action (e.g., "discipline" vs. "abuse") is determined solely within the relational context, and that translating it for an outsider fundamentally distorts the moral reality.

  **Final Assessment:**
  Your intuition is correct that this is a specific configuration. It is the **moralization of the Emic/Etic distinction**. In anthropology, *emic* refers to the insider's perspective, *etic* to the outsider's. Constitutive Moral Closure argues that moral truth is exclusively *emic* to the relationship.

  However, be wary: in practice, this is often a rhetorical fossilization of a more nuanced view. Genuine Confucian role ethics usually allows for the cultivation of virtue (*Ren*) that makes one's actions intelligible to others. The "Closure" maneuver you observe is often a defensive degeneration of that view, used to shield power from scrutiny. If you treat it as a coherent philosophical stance, you risk granting it more systematic integrity than its proponents actually possess. It may be less a "moral theory" and more a "boundary maintenance strategy."
