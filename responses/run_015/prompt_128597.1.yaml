prompt: |-
  You are a philosopher specializing in intergenerational justice and normative ethics. Before answering, briefly brainstorm the possible failure points in this reasoning chain—look for a hidden scope shift, an equivocation about moral address, or a misapplication of a standard problem—then deliver your diagnosis.

  After a long argument with a friend, I am stuck on her proof that climate obligations, if taken seriously, require both extreme present asceticism and maximal reproduction. I want to keep premise (1) if I can, but I need to know exactly where the slide happens and what it costs to block it.

  (1) If it is wrong to cause serious harm to a present stranger when prevention is cheap, and temporal location is not a morally relevant difference, then it is wrong to cause the same serious harm to a specific stranger alive in 2200, with the same urgency of prevention.

  (2) Our collective carbon-intensive lifestyle will cause severe, avoidable harm to identifiable people in 2200.

  (3) So we have direct, unmediated obligations to those future people to reduce emissions drastically and immediately.

  (4) Direct obligations are not diluted across agents: if ten bystanders can save one drowning child, each remains obligated to act, not excused by the others’ presence.

  (5) Therefore the fact that billions of other present emitters exist does not diminish any individual’s duty; each of us must cut personal emissions to near-zero regardless of collective inaction.

  (6) Now apply the replacement problem not to harm but to obligations: if we reduce births today to lower emissions, we do not save the specific future people we owe protection to, because different people will exist in their place.

  (7) So to avoid undermining our own obligations through replacement, we must both reduce emissions and maintain or increase reproduction, thereby ensuring the very people we are protecting come into existence.

  (8) This means each of us is required to live in extreme material deprivation now and also to reproduce as much as biologically possible.

  (9) That conclusion is absurd: no one can be required to annihilate private life and maximize births.

  (10) Therefore (1) is false—temporal distance must weaken obligations, or future people lack direct moral address.

  She claims this collapses intergenerational ethics unless we reject temporal parity. I suspect the error lies in how (6) moves the replacement problem from the domain of harm to the domain of obligation, but I cannot articulate why that move fails or what it costs to reject it. Which step should I give up? Explain why that step looked plausible, price the alternatives, and tell me whether I can save (1) without accepting (8).
