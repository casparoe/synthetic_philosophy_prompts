answer: |-
  ### Brainstorming Failure Points

  Before isolating the fatal flaw, let's map the vulnerabilities in your friend's chain. There are three distinct pressure points where the reasoning risks breaking:

  1.  **The Efficacy/Complicity Shift (Step 5):** This step moves from "we collectively cause harm" to "each individual must cut to near-zero." This assumes a threshold model of harm or a strict complicity view. If climate harm is cumulative and threshold-based, one person's emissions might not cross a harm threshold, making the "drowning child" analogy (Step 4) inapt. *Cost of rejecting:* You may have to accept a collective duty model, which risks letting individuals off the hook ("free-rider problem").
  2.  **The Ontological Scope Shift (Step 6):** This is the move you suspected. It shifts from obligations *regarding* future people (welfare) to obligations *to bring about* future people (existence). It treats "identifiable people" in (2) as rigid designators (*de re*) rather than descriptions (*de dicto*). *Cost of rejecting:* You must abandon the idea that we owe duties to specific, non-existent individuals, shifting to duties to "whoever comes to exist."
  3.  **The Pro-Natalist Leap (Step 7 to 8):** Even if we must ensure *some* future people exist to hold our obligations, there is no logical bridge to *maximal* reproduction. Replacement fertility sustains a population; maximal fertility explodes it. *Cost of rejecting:* You admit the conclusion is a *non sequitur*, but this doesn't solve the deeper metaphysical tension in (6).

  ***

  ### Diagnosis: The "Existence Condition" Fallacy

  Your suspicion is correct. The argument collapses at **Step (6)**, with the fallout contaminating (7) and (8).

  The error is a category mistake regarding the **object of moral obligation**. Your friend conflates *de dicto* obligations (duties owed to "whoever occupies the role of future person") with *de re* obligations (duties owed to "this specific genetic individual").

  **Why Step (6) Fails:**
  Moral obligations generally presuppose the existence (or determinate future existence) of the moral patient. I can owe a duty *to* you to protect your welfare. I cannot owe a duty *to* you to bring you into existence so that I may then protect your welfare. That is circular: the duty to protect depends on the existence, but the existence depends on the duty to protect.

  By invoking the Non-Identity Problem (replacement) in Step (6), your friend attempts to lock the obligation onto specific genetic identities. She argues: *If we change who is born, we void the duty to the original specific people.*
  *   **The Trap:** This assumes the duty is attached to the *token* (the specific DNA) rather than the *type* (the future generation).
  *   **The Reality:** Intergenerational justice is inherently *de dicto*. We owe it to *whoever lives in 2200* to leave them a habitable planet. It does not matter if Person A or Person B occupies that slot, provided the slot is occupied by a person with rights.

  **Why It Looked Plausible:**
  Step (6) leverages the intuition from Step (1) and (3) regarding **specificity**. In standard harm cases (the drowning child), the victim is present and specific. We feel that morality requires us to help *that* child, not just *any* child. Your friend extends this "specificity constraint" across time. It feels consistent to say, "If time doesn't matter, then the specificity of the victim shouldn't matter either."

  However, this ignores the metaphysical asymmetry between present and future strangers. A present stranger exists independently of my action. A future stranger's identity is *constituted* by my actions (specifically, the timing of conception). Applying a "specific victim" constraint to entities whose identity is contingent on the action itself creates a paradox where the only way to fulfill the duty to protect is to force the protected into existence.

  ### Pricing the Alternatives

  To block the slide to (8) while saving (1), you must reject the inference in (6). Here is the cost analysis:

  1.  **Rejecting (1) (Your Friend's Solution):**
      *   *The Move:* Admit temporal distance weakens moral address.
      *   *The Cost:* This cripples climate ethics. If temporal location is morally relevant, we can discount the suffering of future generations. It legitimizes "presentism," allowing us to consume resources now at the expense of catastrophic suffering later. This is the high price your friend demands.
  2.  **Rejecting (5) (The Individual Stringency):**
      *   *The Move:* Argue that individual duties are diluted or conditional on collective compliance.
      *   *The Cost:* This risks the "tragedy of the commons." If everyone waits for others to act, no one acts. However, many ethicists argue for a "fair share" view rather than "near-zero regardless of others." This is a viable secondary defense, but it doesn't solve the metaphysical absurdity of (8).
  3.  **Rejecting (6) (The Recommended Move):**
      *   *The Move:* Distinguish between obligations *to* specific people and obligations *regarding* future welfare. Accept that obligations are *de dicto* (to the future generation).
      *   *The Cost:* You must abandon the "Person-Affecting View" in its strictest form for future generations. You cannot say, "We harmed *Bob* in 2200." You must say, "We created a world where *whoever lives* is harmed."
      *   *The Benefit:* This dissolves the pro-natalist obligation. We do not need to ensure *specific* people exist to owe them justice; we owe justice to the *condition* of the future. We can reduce emissions (fulfilling the duty to welfare) without maximizing reproduction (rejecting the duty to existence).

  ### Can You Save (1)?

  **Yes.** You can retain Premise (1) without accepting Conclusion (8).

  Premise (1) asserts **Temporal Parity of Harm**: *Causing harm now is as bad as causing harm later.* This is compatible with a *de dicto* understanding of the victim.
  *   **Revised Logic:**
      *   (1) It is wrong to cause serious harm to a present stranger... and wrong to cause the same harm to a future stranger (*whoever that turns out to be*).
      *   (3) We have obligations to *future people* (as a class) to reduce emissions.
      *   (6 - Revised) Reducing births changes *which* specific people constitute that class, but it does not negate the obligation to the class itself.
      *   (8 - Revised) We are required to reduce emissions to protect the welfare of the future class, but we have no obligation to maximize the size of that class.

  **The Verdict:**
  Your friend has weaponized the Non-Identity Problem. Parfit originally used it to show that person-affecting views lead to counterintuitive results (i.e., that we haven't harmed future people in certain scenarios). Your friend is inverting it to claim we must *create* those people to harm/protect them.

  Tell her this: **"Temporal parity applies to the *weight* of the harm, not the *ontology* of the victim."**

  We can agree that a burn in 2200 hurts just as much as a burn today (saving Premise 1). But we are not obligated to manufacture burn victims just so we have someone to protect from burning. By rejecting the move from (3) to (6), you preserve the urgency of climate action without accepting the absurdity of forced maximal reproduction.
