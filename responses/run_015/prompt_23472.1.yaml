prompt: |-
  I've got a churn model at work that's pretty well calibarated, so when it spits out something like "10% chance this user cancels" I usually just trust it. But one user it scored at 10% just filed a really angry support ticket an hour ago, and my gut says their odds of churning are way higher right now. A teammate says I should stop second-guessing the model and just use the 10% since its calibrated. But what if the model doesn't even have access to support tickets? I feel like there's a real difference between those two cases and I can't articulate what it is. How do I decide whether to go with the model's number or update it based on what I'm seeing?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user has a well-calibrated churn model (e.g., 10% score $\approx$ 10% actual churn rate).
      *   **Situation:** A specific user got a 10% score, *but* just filed an angry support ticket.
      *   **Conflict:** The user's intuition says churn risk is now much higher. A teammate says stick to the model (10%) because it's calibrated.
      *   **Key Uncertainty:** The user suspects the model *might not* include support ticket data.
      *   **Goal:** How to decide whether to trust the model score or adjust it based on new information (the ticket), and how to articulate the difference between the two scenarios (model has data vs. model doesn't have data).

  2.  **Deconstruct the Core Concepts:**
      *   **Calibration:** A model is calibrated if, out of all instances predicted as $p$, the fraction of positive outcomes is $p$. This is a *population-level* property, not necessarily an *individual-level* truth for every specific context.
      *   **Conditional Probability:** $P(\text{Churn} | \text{Features})$. The model outputs $P(\text{Churn} | \text{Features}_{\text{model}})$.
      *   **New Information:** The support ticket is new information ($E$). The true probability should be $P(\text{Churn} | \text{Features}_{\text{model}}, \text{Ticket})$.
      *   **Data Leakage/Availability:** Did the model see the ticket *before* scoring?
          *   *Case A:* Model includes ticket data (or similar sentiment data).
          *   *Case B:* Model does *not* include ticket data.
      *   **Time Sensitivity:** Churn models are often batch-processed (e.g., nightly). A ticket 1 hour ago might not be in the training data or the input features for the current score.

  3.  **Evaluate the Teammate's Argument:**
      *   *Argument:* "It's calibrated, so trust the 10%."
      *   *Flaw:* Calibration holds *on average* for the distribution the model was trained on. It does not account for *new, unseen evidence* that arises after the score is generated. If the model didn't see the ticket, the 10% is $P(\text{Churn} | \text{Old Info})$. The reality is $P(\text{Churn} | \text{Old Info} + \text{Angry Ticket})$. By Bayes' Theorem, these are different.

  4.  **Evaluate the User's Intuition:**
      *   *Intuition:* "Angry ticket means higher risk."
      *   *Validity:* High. Support interactions are strong predictors of churn. If the model ignores this, it's blind to a major risk factor.
      *   **The "Why":** The user is correctly identifying that the *conditioning set* has changed.

  5.  **Formulate the Decision Framework:**
      *   **Step 1: Check Feature Availability.** Does the model know about the ticket?
          *   If yes (real-time model, includes sentiment): Trust the model (mostly). Maybe the ticket wasn't as "angry" as it felt, or the user is a "complainer who stays."
          *   If no (batch model, no support data): The model is obsolete for this specific instance. The 10% is a prior; the ticket is new evidence.
      *   **Step 2: Check Timing.** When was the score generated?
          *   If 30 days ago: It's definitely stale.
          *   If 1 hour ago: Still might miss the ticket depending on pipeline latency.
      *   **Step 3: Quantify the Update (Mental Bayes).** How much does an angry ticket usually increase churn? (e.g., base rate 10% $\rightarrow$ conditional rate 40%?).
      *   **Step 4: Operationalize.** Don't just "guess." Flag for intervention.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the tension:* It's a classic "Model vs. Context" debate.
      *   *Validate the user:* Your gut is right *if* the model lacks that data. Calibration isn't magic.
      *   *Explain the Math (simply):* Use the concept of $P(A|B)$ vs $P(A|B,C)$.
      *   *Address the Teammate:* They are technically right about calibration *definition*, but wrong about its *application* to new evidence.
      *   *Actionable Advice:*
          1.  Verify feature set (Crucial).
          2.  Check latency.
          3.  Treat the score as a "prior."
          4.  Suggest a "rules overlay" or "trigger."
      *   *Long-term fix:* Retrain model with support data or build a real-time trigger.

  7.  **Refining the Tone:**
      *   Professional, data-literate, empathetic to both the user and the teammate.
      *   Avoid jargon where possible, but use precise terms (conditional probability, features, latency).

  8.  **Self-Correction/Edge Case Consideration:**
      *   *What if the model *does* have support data?* Then the 10% might already account for it. Maybe this user complains often but never leaves. I need to make sure the user checks this first.
      *   *What if overriding the model creates noise?* If everyone overrides based on gut feeling, the process breaks. Need to emphasize *systematic* overrides (rules), not just vibes.

  9.  **Final Structure:**
      *   Direct Answer: You are likely right, here's why.
      *   The Core Concept: Conditional Probability (The "Given What" problem).
      *   The Teammate's Point: Where calibration applies (and where it doesn't).
      *   Decision Framework (3 Questions to ask).
      *   How to handle it operationally (The "Hybrid" approach).
      *   Long-term solution.

  10. (Final Polish): Ensure the distinction between *calibration* (statistical property) and *completeness* (information set) is clear. This is the heart of the user's confusion.

  *(Self-Correction during drafting)*: I should make sure not to tell them to *ignore* the model entirely. The model captures the baseline behavior. The ticket is an *update*. Use the Bayesian analogy.

  11. **Final Output Generation** (similar to the provided good response).
answer: |-
  You are right to trust your gut here, and your teammate is misunderstanding what "calibration" actually means in this context.

  The core issue isn't about whether the model is good; it's about **information sets**.

  Here is how to articulate the difference, the math behind why you're right, and a framework for deciding when to override the model.

  ### 1. The Core Concept: Conditional Probability
  Your model outputs a probability based on a specific set of information ($X$). Let's call the model's score $P(\text{Churn} | X)$.

  *   **If the model includes support ticket data in $X$:** Then the 10% already accounts for the ticket. In this case, your teammate is right. The model might know that this specific user complains often but never leaves, so it kept the score low.
  *   **If the model does NOT include support ticket data in $X$:** Then the 10% is actually $P(\text{Churn} | \text{Usage Data, Demographics, etc.})$. It is blind to the ticket.

  The reality you are observing is $P(\text{Churn} | X + \text{Angry Ticket})$.

  By Bayes' Theorem, adding a strong piece of evidence (an angry ticket) **must** change the probability. A calibrated model is only calibrated *relative to the data it was given*. It cannot be calibrated on data it has never seen.

  ### 2. Why Your Teammate is Half-Wrong
  Your teammate is relying on the definition of calibration: *"Of all users scored at 10%, 10% should churn."*

  This is true **on average, over the long run, for the population the model knows.**

  However, calibration does not grant the model omniscience. If you filter that "10% bucket" down to only the people who *also* just filed an angry ticket, the churn rate in that subgroup will almost certainly be higher than 10%. If you treat them as a generic 10% risk, you are ignoring **conditional risk.**

  **The Analogy:**
  Imagine a weather model says there is a 10% chance of rain today based on satellite data (calibrated over years). But then you look out the window and see dark storm clouds forming *right now*.
  *   **Teammate:** "Don't second-guess the model; it's calibrated."
  *   **You:** "The model didn't see the clouds that formed 5 minutes ago."

  ### 3. Decision Framework: To Override or Not?
  Don't rely on "gut feeling" for every user, or you'll introduce noise. Use this checklist to decide if you should manually adjust the risk:

  **Question 1: What is the feature latency?**
  *   **Batch Model (e.g., runs nightly):** If the score was generated at 2:00 AM and the ticket came in at 10:00 AM, the model is physically incapable of knowing about the ticket. **Verdict: Override/Flag.**
  *   **Real-time Model:** If the model scores on every page load, does it query the support system? If not, it's still blind. **Verdict: Override/Flag.**

  **Question 2: Is this a "Known Blind Spot"?**
  *   Does your feature importance list include support interactions? If "Days Since Last Ticket" or "Ticket Sentiment" is missing from the top 50 features, you have identified a structural gap. **Verdict: Override/Flag.**

  **Question 3: Is this a "One-off" or a "Pattern"?**
  *   If *one* user has a ticket, you can manually intervene.
  *   If *many* users with 10% scores are churning after tickets, you have a business problem, not just a user problem. **Verdict: Escalate to Data Science.**

  ### 4. How to Handle This Operationally
  You shouldn't just mentally change the number to 50% and move on. You need a process that respects the model but accounts for new info.

  **Option A: The "Trigger" Layer (Recommended)**
  Keep the model score as the **Baseline Risk**. Create a business rule that acts as a **Risk Multiplier**.
  *   *Logic:* `If Model_Score > 5% AND Support_Ticket_Sentiment == "Negative": Flag for Retention Team.`
  *   This acknowledges the model (the baseline risk is non-zero) but prioritizes the new evidence.

  **Option B: The "Prior" Approach**
  Treat the model's 10% as your **Prior Probability**.
  *   The angry ticket is **New Evidence**.
  *   You don't need to calculate the exact new percentage, but you acknowledge the direction is up.
  *   *Action:* Move the user from the "Automated Email" track (for 10% risk) to the "Human Outreach" track (for high risk).

  ### 5. The Long-Term Fix
  If your intuition is consistently right about this, the model needs to be updated.
  1.  **Feature Engineering:** Add support ticket volume and sentiment scores to the model inputs.
  2.  **Frequency:** Move from batch scoring (weekly/nightly) to event-triggered scoring (re-score immediately after a support ticket).

  ### Summary Script for Your Teammate
  If you need to explain this to your teammate, try this:

  > "I agree the model is well-calibrated on the data it *has*. But calibration is conditional. If the model didn't ingest support ticket data before generating that score, that 10% is $P(\text{Churn} | \text{No Ticket Info})$. We now have new evidence. Statistically, $P(\text{Churn} | \text{No Ticket Info} + \text{Angry Ticket})$ has to be different. We should treat the model score as a baseline, but apply a business rule override for critical events like negative support interactions."

  **Bottom Line:** If the model didn't see the ticket, the 10% is stale. Trust the new evidence, but formalize the override so it's a rule, not just a vibe.
