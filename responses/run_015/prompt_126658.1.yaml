  **JOINT MEMORANDUM ON RELIGIOUS REASONING IN DELIBERATION**

  **To:** Facilitation Team, Citizens' Assembly on Assisted Dying
  **From:** Commission Drafting Committee
  **Subject:** Guidance on Religious and Comprehensive Convictions

  We, the undersigned, represent differing views on the role of religious conviction in democratic decision-making. However, we agree that this assembly must function with integrity, respect, and clarity. Because the legislature has committed to voting on your recommendations, your work touches on coercive law—rules enforced by state power that restrict liberty or impose duties. This stakes raises the bar for how we justify our positions. The following guidance reflects our shared baseline, followed by a transparent map of where we disagree, so facilitators can navigate these moments without imposing a solution we ourselves have not found.

  **I. Agreed Baselines**

  1.  **The Coercion Principle:** Any recommendation that becomes law will coerce citizens (e.g., by permitting medical procedures some find immoral or forbidding them). We agree that proposing coercion requires a higher standard of justification than personal choice. A participant cannot simply say, "I want this." They must offer a reason why *others* should abide by it.
  2.  **Action vs. Advocacy:** We distinguish between how a citizen votes and how they persuade. A participant may ultimately vote based on their private conscience. However, when advocating for a position that others are asked to join, they owe the group an effort to explain *why* that position serves the common good, not just their own group.
  3.  **The Burden of Clarity:** The duty to provide clear reasons falls most heavily on those drafting the final rationale document and those seeking unanimity. It falls less strictly on participants during early brainstorming. Facilitators should not silence religious language in early stages but should encourage translation into shareable terms as the group moves toward consensus.
  4.  **The Unanimity Norm:** Because this assembly aims for unanimity rather than majority vote, the need for mutual intelligibility is higher. A majority can override a minority without understanding them; a unanimous group cannot. Therefore, reasons that are completely inaccessible to some members create a barrier to the assembly's specific goal.
  5.  **Facilitator Neutrality:** Facilitators are not judges of truth. They should not rule a religious claim "false" or a secular claim "true." Their role is to manage the *process* of justification—asking, "Can you help the group understand how you reached that conclusion?" rather than, "Is that conclusion correct?"

  **II. Areas of Continuing Debate**

  While we agree on the baselines above, we disagree on how strictly to apply them. The following table outlines the four key cruxes where our views diverge. Facilitators should recognize these tensions when they arise in dialogue.

  | Crux | Inclusionist Claim | Restrictivist Claim | Agreed Evidence / Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Formulational**<br>(What counts as a valid reason?) | The requirement is about sincerity. A citizen offers a valid reason if it is what *actually* motivates them. Hiding religious grounds is dishonest. | The requirement is about assessability. A reason is valid only if its *basis* can be examined by others. Revelation cannot be examined by non-believers. | **Case:** A participant says, "My faith forbids this," vs. "Data shows harm." | **Inclusionist:** Predicts honesty fosters trust.<br>**Restrictivist:** Predicts unassailable claims halt debate. |
  | **2. Asymmetric Accessibility**<br>(Religious vs. Contested Secular) | Secular claims (e.g., economic data) are often just as inaccessible to laypeople as religious claims. Banning religious reasons while accepting contested science is biased. | Secular claims are *in principle* accessible (anyone can check the data), whereas revelation is *in principle* private. The distinction holds even if data is complex. | **Case:** A minority cites scripture; a majority cites disputed sociological studies. | **Inclusionist:** Predicts charges of hypocrisy if religious reasons are singled out.<br>**Restrictivist:** Predicts deadlock if all contested claims are treated equally. |
  | **3. Testimony**<br>(Trust vs. Grounds) | A participant with a track record of sound judgment may ask to be trusted on their conclusion without revealing their grounds. Trust is a democratic currency. | Trust without grounds undermines accountability. If the ground is secret, the group cannot verify if the judgment applies to *this* specific law. | **Case:** A respected community leader declines to explain their "deep reasons" but asks for support. | **Inclusionist:** Predicts respect for authority stabilizes the group.<br>**Restrictivist:** Predicts resentment from those excluded from the "inner circle" of trust. |
  | **4. Integrity and Uptake**<br>(Cost and Effect) | The cost of restraint falls unevenly on religious citizens, asking them to be alienated from their deepest convictions. This is a moral wrong, not just etiquette. | The cost of unrestrained religious reasoning falls on non-believers, who cannot engage. This entrenches division. The wrong is imposing unshareable rules. | **Case:** Observation of whether discussion stops or continues after religious claims are made. | **Inclusionist:** Predicts religious citizens will withdraw if silenced.<br>**Restrictivist:** Predicts non-religious citizens will disengage if reasons are opaque. |

  **III. Paths to Resolution**

  We acknowledge that this document does not settle the philosophical dispute. However, we agree on what evidence would shift our respective positions.

  **For the Restrictivist Camp:**
  We would soften our stance if empirical observation of this assembly shows that allowing religious reasons *increases* consensus rather than blocking it. If facilitators document cases where a religious explanation helped a secular participant understand a value they had missed (e.g., the sanctity of life framing a safety protocol), we would accept that religious reasons can serve a shareable function. We are moved by evidence of *bridge-building*.

  **For the Inclusionist Camp:**
  We would accept stricter norms if evidence shows that religious reasons systematically cause withdrawal or anger among non-religious participants. If facilitators record that sessions involving unrestrained religious justification result in lower satisfaction scores or reduced willingness to compromise among the minority, we would acknowledge that the cost to civic friendship is too high. We are moved by evidence of *alienation*.

  **Is There a Settling Fact?**
  We agree on one condition that would settle the matter for both sides: **The Outcome of Deliberation.** If the assembly reaches a unanimous recommendation that the legislature accepts, and the participants report feeling heard and respected regardless of their reasoning style, the practical success overrides the theoretical dispute. If the assembly deadlocks along religious/secular lines, the failure validates the concern that our current norms are insufficient.

  Until then, facilitators must hold both concerns in mind: protect the right of citizens to speak from their whole selves, while guarding the requirement that coercive law rests on grounds the community can own together.

  **Signed,**

  *The Commission Drafting Committee*
