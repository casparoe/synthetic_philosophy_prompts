  2.  **Deconstruct the Seven Precedents:**
      *   *Case 1 (Noise):* Refused. Complainant had done similar (late parties), dismissed earlier complaints against self. *Principle:* Hypocrisy/Dirty Hands (Complainant engaged in same conduct).
      *   *Case 2 (Rumour):* Refused. Complainant hadn't done it but excused it in a friend. *Principle:* Selective Enforcement/Consistency in Blame (Complainant tolerates conduct in others).
      *   *Case 3 (Rubble):* Taken forward. Complainant had done it before but acknowledged, cleared, paid. *Principle:* Restitution/Rehabilitation (Past wrong + Amends = Clean Hands).
      *   *Case 4 (Cycling):* Refused. Complainant designed the system causing the issue. *Principle:* Architectural Responsibility/Estoppel (Complainant created the condition).
      *   *Case 5 (Fire Lane):* Taken forward. Complainant lobbied for system causing issue, benefited, but acknowledged error and offered fix. *Principle:* Acknowledgement of Systemic Fault + Offer to Remedy overrides participation. (Distinguishes from Case 1 & 4).
      *   *Case 6 (Chair's Affair):* Refused. No rule breached, no effect on members. *Principle:* Jurisdiction/Community Interest (Must breach rule or affect community).
      *   *Case 7 (Assault):* Taken forward (as systemic review, not individual grievance). Victim didn't want pursuit. *Principle:* Community Safety overrides Victim Preference (for systemic review), but individual grievance requires victim buy-in (implied).

  3.  **Analyze the New Case (Treasurer vs. Deputy):**
      *   **Accused:** Treasurer (signing without second signature).
      *   **Complainant:** Deputy Treasurer.
