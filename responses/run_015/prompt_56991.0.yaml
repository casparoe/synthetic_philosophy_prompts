  4.  **Derive Candidate Rules (The "Jurisprudence" of the Panel):**
      *   *Rule A (Clean Hands):* You cannot complain of a wrong you have actively participated in without distinction. (Supports Refusal, aligns with Case 1).
      *   *Rule B (Restitution/Remedy):* Past participation is forgiven if acknowledged and remedied. (Supports Taken Forward, aligns with Case 3 & 5).
      *   *Rule C (Community Interest/Rule Breach):* The grievance must concern a breach of agreed rules or tangible community harm. (Supports Taken Forward, aligns with Case 6 inverse).
      *   *Rule D (Motive/Timing):* Does the *reason* for the complaint matter? (Case 7 suggests process matters more than motive, but Case 1 suggests character matters).

      *Refining the Rules based on the 7 cases:*
      1.  **The Principle of Participatory Estoppel:** If you actively participate in the specific breach you complain of, you are barred *unless* you have made amends. (Cases 1, 3, 5).
      2.  **The Principle of Acknowledged Fault:** If you acknowledge the systemic error and offer remedy, your participation is excused. (Cases 3, 5 vs 1, 4).
      3.  **The Principle of Communal Harm:** The grievance must allege a breach of rules or harm to the collective, not just private morality. (Cases 6, 7).

  5.  **Evaluate the New Case against Rules:**
      *   *Participatory Estoppel:* Deputy countersigned 4 times. He participated. (Points to Refusal, like Case 1).
