      *Let's simplify to three robust rules as requested:*
      1.  **The Rule of Participatory Bar:** A complainant is barred if they have engaged in the specific conduct complained of, *unless* they have subsequently acknowledged the wrong and made restitution. (Explains 1, 3, 5).
      2.  **The Rule of Systemic Complicity:** A complainant is barred if they designed or authorised the system causing the grievance, *unless* they now acknowledge the design fault and propose remedy. (Explains 4, 5).
      3.  **The Rule of Communal Interest:** A grievance is only admissible if it alleges a breach of co-op rules or tangible harm to the collective; private morality or individual disputes without wider impact are inadmissible. (Explains 6, 7).

      *Applying to New Case:*
