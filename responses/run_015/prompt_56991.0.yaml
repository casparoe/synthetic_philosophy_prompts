      *   *Communal Harm:* Breach of financial rules is serious (unlike Case 6). Affects solvency/trust. (Points to Taken Forward).
      *   *Treasurer's Claim:* Audit timing. This is about motive. Case 1 looked at past conduct, not motive. Case 7 looked at victim desire vs community safety. Motive hasn't been a primary blocker before, but *credibility* has.

  6.  **Synthesize the "Consistent" Decision:**
