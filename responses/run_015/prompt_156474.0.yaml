      Your objections are far from naive and in fact touch upon distinctions that are central to the philosophy of mathematics and the foundations of set theory. The distinction you drew between the static reading of Hilbert's Hotel as a statement about mappings and the operational reading as a sequence of physical moves is not only valid but is a standard point of analysis when philosophers discuss supertasks and the applicability of mathematics to the physical world. When mathematicians discuss the hotel, they are almost exclusively referring to the static existence of a bijection, a one-to-one correspondence between the set of guests and the set of rooms, which demonstrates that an infinite set can be put into correspondence with a proper subset of itself. This is the defining property of infinite sets in standard set theory and involves no motion, time, or physical rearrangement. The popular book you are reading conflates this mathematical fact with the physical narrative of guests shifting rooms, which introduces the separate and much more problematic concept of a supertask, where infinitely many actions are completed in a finite time. Your suspicion that the vividness of the story is doing the arguing is well-founded, as the physical impossibility of coordinating infinitely many moves is often used to smuggle in the intuition that the mathematical concept itself is flawed, when in fact the mathematics remains consistent regardless of whether a hotel manager could physically perform the shifts.

