  ### The Verdict: What I Would Do

  If handed $1000 for 1000 days with a $10 minimum:

  1.  **Optimization Target:** Maximize $E[\ln(W_{1000})]$. This avoids the EV "bet everything" suicide while acknowledging the finite horizon (unlike asymptotic Kelly).
  2.  **The Strategy (Heuristic):**
