answer: |-
  ### Brainstorm: Mechanics & Tension

  To make the Inside/Outside view tension visceral, the game needs to separate **agency** (their reasoning/effort) from **structure** (the hidden constraints). If the game is purely skill-based, the Inside View wins. If it's purely luck, the Outside View wins trivially. We need a hybrid where their reasoning *feels* relevant but is structurally capped or enabled by a hidden variable.

  **Core Mechanic: The Parallax Deck**
  *   **Hidden Layer (The Outside View):** A "Cohort Card" assigned randomly. This dictates the *success threshold* or *probability weight* for that student. Half the room is "Cohort A" (favorable distribution), half is "Cohort B" (unfavorable). They do not know this exists.
  *   **Visible Layer (The Inside View):** "Narrative Cards" that give specific, plausible reasons for confidence (e.g., "You solved a similar problem last week," "You are well-rested"). These invite causal storytelling.
  *   **The Action:** Students place bets (Prestige Points) on their success. They must publicly justify the bet using *only* the Visible Narrative and their internal assessment of the puzzle.
  *   **The Reveal:** Success is calculated. The disparity between Cohort A and Cohort B outcomes is revealed, showing that the "Base Rate" (Cohort) was a stronger predictor than their "Reasoning" (Narrative).

  **Why this works for Epistemology:**
  It simulates the experience of being structurally disadvantaged (or advantaged) without knowing it. It forces them to articulate an Inside View justification for an outcome that was largely determined by an Outside View variable they were blind to.

  ---

  ### Seminar Design: The Parallax Wager

  **Time:** 90 Minutes
  **Participants:** 10 Grad Students
  **Materials:**
  *   10 Envelopes (sealed).
  *   Inside each: 1 Hidden Cohort Card, 1 Visible Narrative Card, 1 Betting Sheet.
  *   1 Projected Puzzle (The "Target").
  *   Whiteboard for tracking Prestige Points.

  #### Part 1: Setup & The Hook (15 mins)
  *   **No Lecture.** Do not mention Inside/Outside view, base rates, or humility.
  *   **Instructions:** "Today is a workshop on decision-making under uncertainty. You will earn 'Prestige Points' (PP). The top scorer gets [small privilege, e.g., chooses next week's topic/reading]. You will attempt a logical constraint puzzle. Before you see the puzzle, you will receive a private context packet."
  *   **Distribution:** Hand out the sealed envelopes.
  *   **Rule:** "Do not show anyone your cards. You may talk about the puzzle and your reasoning, but you may not reveal the contents of your envelope."

  #### Part 2: The Parallax Deck & Betting (30 mins)
  *   **The Cards:**
      *   **Hidden Cohort Card (Face Down until end):**
          *   5 Cards say **TYPE OMEGA**. (Statistical Reality: 20% Success Rate).
          *   5 Cards say **TYPE ALPHA**. (Statistical Reality: 80% Success Rate).
      *   **Visible Narrative Card (Face Up):**
          *   All cards have positive, specific internal reasons. Examples: *"You have strong working memory," "You solved a Wason task recently," "You feel cognitively fresh today," "You prefer analytic over holistic reasoning."*
          *   *Note:* The Narrative Cards are identical or functionally equivalent across both Cohorts. This ensures the *Inside View* information is the same, but the *Outside View* reality differs.
  *   **The Puzzle:** Project a "Constraint Satisfaction Problem."
      *   *Example:* A variation of the "Knights and Knaves" or a specific logic grid that is solvable but requires a specific, non-obvious inference.
      *   *The Catch:* The puzzle is designed so that **Type Alpha** students are given a subtle hint in their envelope (e.g., "Note: Variable X cannot be null") while **Type Omega** students are not. *Wait, simpler:* The puzzle is the same, but the **Grading Criteria** (Hidden) differs.
      *   *Revised Mechanic for Fairness:* The puzzle is the same. The **Hidden Card** determines the *Pass Threshold*.
          *   **Alpha:** Pass if you get 3/5 key steps correct.
          *   **Omega:** Pass if you get 5/5 key steps correct.
          *   *Crucial:* They do not know the threshold. They just know "Solve the puzzle."
  *   **Betting Round:**
      1.  Students review their Narrative Card.
      2.  They privately write down a **Confidence %** (0-100) on their Betting Sheet.
      3.  They place a **Wager** (1-10 PP) on whether they will "Pass."
      4.  **Public Defense:** Go around the room. Each student states their Wager and justifies it *using their Narrative Card*. (e.g., "I'm betting 8 PP because my card says I have strong working memory and I see the recursion here.")
      5.  *Instructor Role:* Record the wagers. Do not validate or invalidate their reasoning. Just nod and write.

  #### Part 3: Execution & Scoring (15 mins)
  *   Students attempt the puzzle individually (10 mins).
  *   Collect answer sheets.
  *   Grade them silently against their Hidden Cohort Thresholds (Alpha vs. Omega).
  *   *Note:* Since Omega has a stricter threshold, statistically more Omegas will fail even with similar performance quality.
  *   Calculate PP:
      *   Correct Bet (Pass & Bet High, or Fail & Bet Low): +Wager.
      *   Incorrect Bet: -Wager.
      *   *Bonus:* "Calibration Bonus" for Confidence % closest to actual outcome.

  #### Part 4: The Debrief (30 mins)
  *   **The Reveal:** Ask for a show of hands: "Who failed despite high confidence?" (Likely Omegas). "Who succeeded despite low confidence?" (Likely Alphas).
  *   **Open the Envelopes:** Have them reveal their Cohort Cards.
  *   **Map the Tension:**
      1.  **The Narrative (Inside View):** Ask the Omegas who failed: "Your reasoning was sound based on the info you had. Why did you fail?" They will cite the puzzle difficulty.
      2.  **The Cohort (Outside View):** Reveal the Thresholds. "The Alpha cohort needed 60% accuracy. The Omega cohort needed 100%."
      3.  **The Epistemic Lesson:**
          *   **Structural Seduction:** "You argued from the Inside (my skills, my narrative). But the truth was fixed by the Outside (your reference class threshold)."
          *   **Modesty:** "Epistemic modesty isn't just saying 'I might be wrong.' It's acknowledging that your access to the *rules of the game* is limited. You were confident because you couldn't see the Parallax."
          *   **Base Rate Neglect:** "If you had assumed you were a random draw from a population with unknown constraints, how would your bet have changed?"

  ---

  ### Instructor Notes: Running the Simulation

  **1. The "Parallax" Twist:**
  To make this work without lying, the "Threshold" must be real.
  *   Prepare two answer keys.
  *   **Alpha Key:** Marks 3 critical steps. If they hit 3, they pass.
  *   **Omega Key:** Marks 5 critical steps. If they miss 1, they fail.
  *   *Why:* This simulates a "Hostile Environment" vs. "Friendly Environment" without changing the puzzle itself. It mirrors real academic/life scenarios where two people do the same work but face different structural bars for success.

  **2. Managing the "Unfairness":**
  Students may feel cheated. *Lean into this.*
  *   If they complain, say: "In epistemology, the world does not owe you a transparent reference class. The feeling of unfairness you have right now is the feeling of discovering an Outside View variable you ignored. Hold onto that."

  **3. Prestige Points:**
  Make the points matter socially.
  *   "Top scorer leads the discussion next week."
  *   "Lowest scorer must summarize the opposing view in the next debate."
  *   This raises the stakes of the bet, making the Overconfidence more costly.

  ---

  ### Limitations: What This Game Cannot Do

  **1. It cannot simulate "True" Base Rate Knowledge.**
  In the game, the Base Rate (Cohort Threshold) is fixed by you (the Instructor/God). In reality, Base Rates are often contested, fuzzy, or unknown. The game risks teaching them that "Outside View = Instructor's Secret Truth," rather than "Outside View = Aggregated empirical data."
  *   *Fix:* In the debrief, clarify that in the real world, *we* have to construct the reference class. The lesson is to *look* for the Cohort, not that the Cohort is always hidden.

  **2. It creates "Post-Hoc" Modesty.**
  They will be humble *after* losing. Epistemic modesty is valuable *before* the bet. The game creates a shock, but not necessarily a habit.
  *   *Fix:* Emphasize in the debrief that the goal is to internalize the *possibility* of a Hidden Cohort *before* betting next time.

  **3. It isolates Epistemology from Ethics.**
  The "Omega" students were structurally disadvantaged. In real life, this often correlates with systemic bias. The game abstracts this into random cards.
  *   *Fix:* Acknowledge this. "In the real world, Cohorts aren't random. They are historical. That makes the Inside View even more dangerous."

  ---

  ### Predictions: What Will Go Wrong (First Run)

  **1. Collusion/Comparison:**
  *   *Risk:* Students might peek at each other's envelopes or compare puzzle interpretations too closely, realizing the thresholds differ.
  *   *Mitigation:* Seat them apart. Emphasize the "Private Packet" rule strictly. If discovered, disqualify their PP (use this as a lesson on integrity in data).

  **2. The "Omega" Revolt:**
  *   *Risk:* The Omega students who worked hard and failed will feel the simulation was rigged (because it was). They may disengage from the debrief.
  *   *Mitigation:* Validate their frustration immediately. "Your anger is the data point. If you felt it was rigged, imagine how often that happens in research/life without a reveal."

  **3. Time Creep:**
  *   *Risk:* The "Public Defense" of bets can turn into mini-debates.
  *   *Mitigation:* Use a timer. 60 seconds per student to state Wager + Reason. Cut them off mid-sentence if needed. "Save the reasoning for the debrief."

  **4. The Puzzle is Too Easy/Hard:**
  *   *Risk:* If everyone solves it, the Threshold difference doesn't matter. If no one solves it, the Beta is moot.
  *   *Mitigation:* Test the puzzle beforehand. Aim for a 60% raw solve rate. This ensures the Alpha threshold (3/5) catches most, while Omega (5/5) catches few.

  ### Final Checklist for Monday
  *   [ ] 10 Envelopes (5 Alpha, 5 Omega).
  *   [ ] Printed Puzzle (10 copies).
  *   [ ] Betting Sheets (Confidence % + Wager).
  *   [ ] Whiteboard for PP tracking.
  *   [ ] Timer.
  *   [ ] **Mindset:** Do not apologize for the rigging. The rigging is the lesson.
