prompt: |-
  Hi — I cover science and ideas for a magazine (mostly long features, but I also do the final copy pass on freelance pieces a few times a week), and I keep having the same argument with our fact-checker. She wants every sentence hedged into mush; I think roughly half our sentences say "shows" where the study really just got one specific prediction to come out right, and another half say "is consistent with" where the result actually did knock out a live alternative. My friend, who's a physicist, says all hedging is cowardice and that we should print "shows" whenever the authors do, which I'm pretty sure is wrong. What I want isn't a lecture on the philosophy of science — it's something I can paste into our house style guide and actually run.

  Here's the shape I have in mind, and tell me if it's the wrong shape: a ladder of evidential verbs we're allowed to use in copy (something like "shows," "strongly supports," "supports," "is consistent with," "does not rule out," "cannot distinguish between"), plus a short ordered set of tests for picking the highest rung a sentence is allowed to sit on. The tests should be the ones that decide whether the evidence is actually doing any discriminating work: what exactly the account predicted ahead of time, versus a story fitted to the data afterward; whether that prediction was the kind that could easily have come out the other way; whether getting the result required background assumptions the data itself can't check (how the instrument behaves, the measurement model, the statistical model, assumptions about the sample) — I gather there's a name in philosophy for that problem but I can never remember it, so don't bother naming it, just build the step; and, the one I care most about, whether some rival account fits the published numbers about as well. On that last one I've started sorting rivals into what I call "live" ones (a competent person in the field would actually defend it) and "zombie" ones (logically compatible with the data, but nobody would seriously hold it) — because I don't want to hedge every sentence just because some skeptical scenario is logically possible, and I also don't want to write "shows" when the field genuinely has two accounts that fit the same data. Tell me if that split is doing the wrong work, or if I need a third bucket: I keep hitting cases where the rivals are distinguishable in principle but only by an experiment nobody will fund, and cases where the thing being "tested" is a whole framework rather than a claim, so any single study can only ever be consistent or inconsistent with it.

  Constraints: it has to run in about ten minutes at copy-desk stage, by someone with no philosophy training who then has to sign off on the sentence, mostly from the paper itself since the freelancer is often unreachable; and I want it honest about which steps are judgment calls wearing a lab coat. Please say explicitly where the procedure just stops with a no (you may not use a stronger verb, full stop) and where it hands the decision to a human because the trade-off is about values — how much we'd rather over-hedge than over-claim, and so on. Then run it on three cases: (1) a preprint, 120 people recruited online, scores on a psychological scale correlated with how often they shared a false headline, written up by the authors as confirming a motivated-reasoning account over a "people just can't tell what's true" account; (2) a large randomized trial that found no difference between two diets on some biomarker, with a press release saying the trial "refutes" the theory the diets were based on; and (3) a piece I wrote myself last spring (details invented, the structure is what matters) in which I said that a new set of genetic results "confirmed" the leading account of how a population recolonized a region after a bottleneck, and a colleague later pointed out that a second account fits the same data about as well. I'd especially like to know whether the procedure tells me to downgrade that last one, because if it does I have to go tell my editor and eat a correction, and I'd rather not. Last thing: say plainly what the procedure can't do — I don't want anyone on staff walking away thinking that a sentence passing these tests means the study was any good.
reasoning: |-
  Here's a thinking process that leads to the suggested style guide section:

  1.  **Analyze the User and Request:**
      *   **User Role:** Science/Ideas Magazine Writer & Editor (does long features + copy pass).
      *   **Problem:** Constant conflict with a fact-checker over hedging. Fact-checker wants everything hedged ("mush"); User thinks some claims are strong enough for "shows," while others need "consistent with." Friend (physicist) says no hedging ever (User knows this is wrong).
      *   **Goal:** A practical, actionable section for a house style guide. Not philosophy, but operational rules.
      *   **Proposed Structure:** A "ladder" of evidential verbs + a set of tests to determine the highest rung allowed.
      *   **Key Concepts to Incorporate:**
          *   Prediction vs. Post-hoc fitting.
          *   Falsifiability (could it have come out the other way?).
          *   Background assumptions (instrument/model validity).
          *   Rival accounts (Live vs. Zombie vs. Unfundable/In-principle).
          *   Framework vs. Specific Claim.
      *   **Constraints:** Must take ~10 minutes at copy desk. No philosophy training required. Must rely mostly on the paper (freelancer often unreachable). Must admit where judgment calls exist. Must explicitly state where the procedure says "No" vs. "Human Decision." Must run on three specific test cases. Must state limitations (passing tests $\neq$ study quality).
      *   **Tone:** Professional, direct, pragmatic, slightly weary of academic gamesmanship but respectful of uncertainty.

  2.  **Deconstruct the "Ladder" and "Tests":**
      *   *The Ladder:* Needs to be ordered from strongest to weakest.
          *   Shows/Demonstrates/Confirms (Strong)
          *   Strongly Supports (Medium-Strong)
          *   Supports (Medium)
          *   Is Consistent With (Weak)
          *   Does Not Rule Out / Cannot Distinguish (Weakest)
      *   *The Tests:* Need to be binary or clearly defined checkpoints.
          1.  **Prediction:** Was it pre-registered or clearly predicted *before* data collection? (If no, cap at "Consistent With").
          2.  **Risk:** Could the result easily have been null or opposite? (If no, cap at "Consistent With").
          3.  **Assumptions:** Does the claim rely on unverified modeling/instrument assumptions? (If yes, downgrade one rung).
          4.  **Rivals:** Are there "Live" rivals? (If yes, cap at "Supports" or "Consistent With").
      *   *The "Live" vs. "Zombie" vs. "Unfundable" distinction:* This is crucial.
          *   *Live:* Competent peer defends it. -> Must hedge.
          *   *Zombie:* Logically possible but scientifically dead. -> Ignore.
          *   *Unfundable/In-Principle:* Distinguishable only by impossible experiment. -> This is the gray area. The guide needs to address this. It usually means you can't claim "Shows" because the discrimination hasn't happened *yet*.
      *   *Framework vs. Claim:* If testing a whole paradigm, single study = "Consistent With."

  3.  **Drafting the Style Guide Section:**
      *   *Title:* Needs to sound official. "Evidential Verb Protocol."
      *   *Introduction:* Acknowledge the tension (accuracy vs. readability).
      *   *The Ladder:* Define the verbs clearly.
      *   *The Decision Tree (The Tests):* Step-by-step logic.
      *   *The "Stop" Signs:* Where the copy editor must say "No."
      *   *The "Judgment" Signs:* Where the editor must weigh risk tolerance.
      *   *Limitations:* Explicit disclaimer that this checks *language*, not *science*.

  4.  **Refining the "Rivals" Bucket:**
      *   User asked about a third bucket for "distinguishable in principle but unfundable."
      *   *Advice:* Keep it simple for a 10-minute check. Call this "Technically Live." If the experiment * hasn't been done *, the rival is effectively live for the purpose of *this* paper. Don't create a third bucket that requires researching funding landscapes. Treat "Unfundable" as "Live" for now, because the discrimination hasn't occurred.
      *   *Advice on Framework:* If the paper tests a specific mechanism within a framework, you can be stronger. If it tests the framework itself, you must be weaker.

  5.  **Running the Test Cases:**
      *   *Case 1 (Psych Preprint):* Online recruitment, correlation, post-hoc reasoning likely. Rivals: "Motivated Reasoning" vs. "Can't Tell Truth."
          *   *Verdict:* Weak. Correlation $\neq$ Causation. Preprint (less vetted). Likely post-hoc.
          *   *Verb:* "Is consistent with" or "Supports" (if pre-registered). Definitely not "Confirms."
      *   *Case 2 (Diet Trial):* Large RCT, null result. Press release says "Refutes."
          *   *Verdict:* Null results rarely "refute" a whole theory (theory can be tweaked). "Fails to support" or "Does not support." "Refutes" is too strong unless the theory *predicted* a difference and nothing else could explain the null.
          *   *Verb:* "Does not support."
      *   *Case 3 (User's Genetics Piece):* "Confirmed" leading account. Colleague says rival fits data equally well.
          *   *Verdict:* If a rival fits equally well, "Confirmed" is factually incorrect. It's underdetermined.
          *   *Verb:* Must downgrade to "Supports" or "Is consistent with."
          *   *Hard Truth:* Yes, you need to issue a correction/clarification. Honesty is better than being caught later.

  6.  **Addressing the Constraints:**
      *   *10 Minutes:* The flowchart must be linear.
      *   *No Philosophy:* Avoid terms like "underdetermination," "falsificationism," "Duhem-Quine." Use plain English.
      *   *Judgment Calls:* Explicitly mark where the editor decides the risk.
      *   *Limitations:* Add a "What This Is Not" section.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? No, keep it imperative. "Do this." "Don't do that."
      *   *User's Specific Question:* "Tell me if that split [Live/Zombie] is doing the wrong work."
          *   *Answer:* The split is good, but add the "Unfundable" category to "Live" for safety. If the experiment hasn't happened, the rival stands.
      *   *User's Specific Question:* "Do I have to eat a correction?"
          *   *Answer:* Yes, if the rival fits equally well, "confirmed" is wrong. Better to fix it now.
      *   *User's Specific Question:* "Name for the assumption problem?"
          *   *Answer:* User said don't name it, just build the step. (I will respect this, though it's clearly the Duhem-Quine thesis/auxiliary hypotheses).
      *   *Formatting:* Use bolding, lists, and boxes to make it skimmable for a style guide.

  8.  **Final Polish:** Ensure the distinction between "Copy Editor Decision" and "Writer/Editor Decision" is clear. The copy editor needs to know when to flag vs. when to change.

  *(Self-Correction during drafting)*: I initially thought about making a complex flowchart. But for a style guide, a numbered checklist is faster to read. I will structure it as "The Ladder" followed by "The Gatekeepers." I need to make sure I explicitly answer the "third bucket" question in the preamble before giving the guide.

  *(Refining the "Unfundable" bucket)*: If a rival is distinguishable *in principle* but the test is unfunded, the data *currently* does not distinguish them. Therefore, the claim "Shows" is premature. It should be treated as a Live rival for the purpose of *this* text. I will advise merging this into "Live."

  *(Refining Case 3)*: I need to be gentle but firm. If a colleague pointed out a rival fits equally well, "Confirmed" is objectively misleading. The guide should flag this. I will advise the correction.

  *(Final check on constraints)*: Did I say what the procedure can't do? Yes. Did I say where it stops with a No? Yes. Did I say where it hands off to human judgment? Yes.

  Let's assemble.cw
answer: |-
  Here is a draft for your house style guide. It is designed to be pasted directly into your manual, followed by my assessment of your specific questions and the three test cases.

  ***

  # STYLE GUIDE: Evidential Verbs and Claims

  **Purpose:** To standardize how we describe the strength of scientific findings without overstating certainty or drowning readers in hedging. This protocol is for copy editors and writers during the final pass. It is a check on *language*, not a peer review of *science*.

  **Time Budget:** 10 minutes per claim.
  **Source Material:** The paper (abstract, methods, discussion) and the press release. Do not contact authors unless a factual error is obvious.

  ## 1. The Ladder
  Select the strongest verb allowed by the **Gatekeeper Tests** (Section 2). Do not skip rungs.

  *   **RUNG 1 (Strongest):** *Shows, Demonstrates, Confirms, Refutes.*
      *   Use only when the data leaves no reasonable scientific doubt about a specific mechanism or causal link.
  *   **RUNG 2:** *Strongly Supports.*
      *   Use when the evidence is robust but relies on standard modeling assumptions or one live rival remains unlikely but possible.
  *   **RUNG 3:** *Supports, Suggests, Indicates.*
      *   Use for correlational data, observational studies, or when background assumptions are necessary but standard.
  *   **RUNG 4:** *Is Consistent With, Aligns With.*
      *   Use when the data fits the theory but does not discriminate between it and other plausible theories.
  *   **RUNG 5 (Weakest):** *Does Not Rule Out, Cannot Distinguish Between.*
      *   Use when the study was unable to find a difference or when two theories fit the data equally well.

  ## 2. The Gatekeeper Tests
  Apply these tests in order. If the claim fails a test, it is capped at the corresponding Rung.

  **TEST A: The Prediction Check**
  *   **Question:** Was this specific result predicted *before* data collection (pre-registered or explicitly stated as a hypothesis in the intro)?
  *   **Fail:** If the story was fitted to the data after the fact (post-hoc).
  *   **Penalty:** Cap at **Rung 4** (*Is Consistent With*).
  *   **Exception:** Exploratory analyses clearly labeled as such in the paper.

  **TEST B: The Risk Check**
  *   **Question:** Could the experiment easily have produced a null or opposite result if the theory were wrong?
  *   **Fail:** If the setup makes the result inevitable (e.g., self-reporting bias, ceiling effects) or the "prediction" is vague enough to fit any outcome.
  *   **Penalty:** Cap at **Rung 4** (*Is Consistent With*).

  **TEST C: The Assumption Check**
  *   **Question:** Does the conclusion rely on unverified background assumptions (instrument calibration, statistical model choice, sample representativeness) that are not proven by the data itself?
  *   **Fail:** Yes (almost always).
  *   **Penalty:** Downgrade one Rung from the result of Tests A & B. (e.g., if A&B allow Rung 1, you must stop at Rung 2).
  *   **Note:** All studies rely on assumptions. This step ensures we don't claim *Show* when we mean *Support*.

  **TEST D: The Rival Check (Crucial)**
  *   **Question:** Is there a "Live" rival account that fits the published numbers about as well?
      *   **Live:** A competent expert in the field would defend it today.
      *   **Zombie:** Logically possible but scientifically dead (e.g., "the instrument was haunted"). Ignore these.
      *   **Unfundable/In-Principle:** Distinguishable only by an experiment that will not be done. **Treat as Live.**
      *   **Framework:** Is the study testing a specific claim or a whole worldview? If a whole worldview, single studies cannot *Refute* or *Confirm* it.
  *   **Fail:** If a Live rival exists.
  *   **Penalty:** Cap at **Rung 3** (*Supports*). If rivals fit *equally* well, cap at **Rung 5** (*Cannot Distinguish*).

  ## 3. Decision Protocol
  *   **HARD STOP (Copy Editor Authority):** If Test D reveals a rival fits *equally* well, you **may not** use Rung 1 or 2. Change to Rung 5. This is not a judgment call; it is a factual correction.
  *   **JUDGMENT CALL (Senior Editor/Writer):** If Test D reveals a rival is "Live" but less likely, the choice between Rung 2 (*Strongly Supports*) and Rung 3 (*Supports*) is a risk tolerance decision.
      *   *Default:* Prefer under-claiming. We would rather be accused of being timid than of being wrong.
      *   *Action:* If unsure, downgrade.

  ## 4. Limitations
  **Passing these tests does not mean the study is good.** It only means the *language* matches the *reported evidence*. A study can be fatally flawed (bad sample, p-hacking) and still pass this linguistic check. This protocol prevents us from lying about certainty; it does not guarantee truth.

  ***

  # Assessment of Your Proposal

  You asked if your "shape" is right. It is. Specifically:

  1.  **The Ladder:** This is the correct approach. It gives the copy desk a menu rather than a debate.
  2.  **The Rival Buckets:** Your split between **Live** and **Zombie** is doing the right work. However, regarding your third bucket (**"Distinguishable in principle but unfundable"**): Do not create a third bucket. For the purpose of a magazine article, treat this as **Live**. If the experiment hasn't been done, the discrimination hasn't happened. You cannot claim "Shows" if the decisive test is missing, even if the missing test is impossible to fund. Merge this into "Live" to keep the copy-desk check under 10 minutes.
  3.  **The "Assumption" Step:** You mentioned not wanting the philosophy name (it's the Duhem-Quine problem/auxiliary hypotheses). Your instinct to build it as a step is correct. It forces the "Downgrade One Rung" rule, which solves the physicist friend's problem. Even if the authors say "Shows," the reliance on models means you must downgrade to "Supports."

  # Running the Test Cases

  Here is how the protocol handles your three scenarios.

  ### Case 1: The Psych Preprint (Motivated Reasoning)
  *   **Inputs:** Preprint (less vetted), N=120 (small/online), Correlational (scores vs. sharing), Authors claim "Confirming" motivated reasoning over "can't tell truth."
  *   **Test A (Prediction):** Likely post-hoc or vague. Preprints often lack rigorous pre-registration. **Cap at Rung 4.**
  *   **Test B (Risk):** Correlations can always be explained by confounding variables. **Cap at Rung 4.**
  *   **Test D (Rivals):** "People just can't tell what's true" is a Live rival. Correlation does not distinguish between *won't* (motivated) and *can't* (ability).
  *   **Verdict:** **Rung 4 or 5.**
  *   **Copy Edit:** Change "confirming" to *"is consistent with"* or *"does not distinguish between."*
  *   **Reasoning:** Correlational data on a small sample cannot confirm a causal mechanism over a Live rival.

  ### Case 2: The Diet Trial (Null Result)
  *   **Inputs:** Large RCT (Strong design), No difference on biomarker, Press release says "Refutes."
  *   **Test A (Prediction):** RCTs usually have pre-specified outcomes. **Pass.**
  *   **Test B (Risk):** High risk (could have found a difference). **Pass.**
  *   **Test C (Assumptions):** Biomarkers rely on measurement models. **Downgrade one rung.**
  *   **Test D (Rivals/Framework):** Does a null result *refute* the theory? Usually, theories can be tweaked (e.g., "wrong dose," "wrong duration"). Unless the theory *only* allows for that specific biomarker change in that specific timeframe, "Refutes" is too strong.
  *   **Verdict:** **Rung 5.**
  *   **Copy Edit:** Change "refutes" to *"does not support"* or *"fails to show evidence for."*
  *   **Reasoning:** Null results rarely kill theories; they just starve them. "Refutes" implies the theory is impossible, which one trial rarely proves.

  ### Case 3: Your Genetics Piece (The Correction)
  *   **Inputs:** You wrote "Confirmed." Colleague says rival account fits data equally well.
  *   **Test D (Rivals):** A competent colleague defending a rival account makes it **Live**. If it fits *equally* well, the data is underdetermined.
  *   **Protocol Rule:** **HARD STOP.** If rivals fit equally well, you may not use Rung 1 (*Confirms*) or Rung 2 (*Supports*). You must use Rung 5 (*Cannot Distinguish*).
  *   **Verdict:** **You must downgrade.**
  *   **Action:** Yes, you have to eat the correction.
  *   **Reasoning:** This is the exact scenario the guide is built to prevent. If two models fit the data equally well, the data does not "confirm" one over the other. It is objectively inaccurate to say it does.
  *   **How to frame it:** Do not frame it as "I was wrong." Frame it as "New interpretation of the data suggests..." or simply issue a clarifying note. However, strictly speaking, the verb "confirmed" was an error in evidential logic. The protocol flags this immediately. It is better to fix it now than to have a rival publication point it out later.

  # Final Note on Limitations
  You asked me to say plainly what this procedure can't do.
  **It cannot validate the study.** A sentence can pass all these tests and still be garbage science. If the sample was biased, the code was buggy, or the p-values were hacked, the "Ladder" will not catch it. This guide ensures you are not *more certain than the data allows*, but it does not ensure the data is *worth being certain about*. It protects the magazine from accusations of hype, not from accusations of publishing weak science.
