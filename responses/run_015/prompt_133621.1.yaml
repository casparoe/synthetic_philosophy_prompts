answer: |-
  **MEMORANDUM**

  **TO:** Discovery Engines Program Committee
  **FROM:** Chair, Technical Review Committee
  **DATE:** Thursday, October 24
  **SUBJECT:** Decision Recommendation: Reference-Free Universal Prediction (Proposal #409)

  **Recommendation**

  I recommend we **fund a twelve-month scoping award** ($350k) with specific technical milestones, rather than funding the proposal as requested ($2.4M/3yr) or declining it outright.

  This recommendation acknowledges the theoretical ambition of the project while recognizing the substantial risk identified by our reviewers regarding the applicability of asymptotic bounds to finite compute regimes. A scoping phase allows the applicants to demonstrate whether their "Reference-Free" modification yields empirical gains distinct from standard ensemble methods before committing to the full budget.

  **Context and Reviewer Split**

  The proposal seeks to approximate Solomonoff induction by dovetailing searches over four distinct reference machines (register, lambda, concatenative, combinatory), averaging predictions using computed translation constants. Our reviewers split cleanly. Reader A argues the method is uncomputable at the core and that the invariance theorem's additive constant renders the bound vacuous for finite data. Reader B argues that the Solomonoff bound is the only non-circular justification for Occam's razor and that the constant is asymptotically irrelevant, making this an empirical question worth funding at scale.

  **Analysis of Key Questions**

  In reaching this recommendation, the Committee focused on two specific questions raised during the review.

  **1. Is the appeal to the universal prior doing real work, or is it decoration?**
  The applicants argue that averaging over four machines mitigates the arbitrariness of the reference machine choice. However, we must distinguish between a method inspired by a theory and a method that *requires* that theory to function. If the four-machine ensemble outperforms a standard deep learning ensemble of equivalent compute cost, is it because of the Solomonoff framing, or simply because model diversity reduces variance?
  If the "universal prior" label is merely decoration, the project reduces to a heuristic search over virtual machines—a valuable engineering project, but not the foundational advance proposed. To justify the full program budget, the applicants must demonstrate that the *weighting scheme* derived from the universal prior (even approximated) outperforms uniform averaging or standard Bayesian model averaging. Without this ablation, the theoretical framework risks being post-hoc rationalization for a heuristic that stands or falls on benchmark performance alone.

  **2. Does "it's only a constant" answer the reference-machine worry or evade it?**
  Reader B relies on the Invariance Theorem: the complexity difference between two universal machines is bounded by a constant independent of the data string. Asymptotically, this constant vanishes relative to the complexity of the data.
  However, for a "Discovery Engine" operating under a hard two-hour compute budget on finite datasets, we are never in the asymptotic regime. In the finite regime, the additive constant *is* the signal. If the translation constants between the four machines are large relative to the complexity of the patterns they are trying to find, the "Reference-Free" average may converge slower than a single, well-chosen reference machine.
  Reader A's objection is not that the math is wrong, but that the *regime of applicability* is unproven. To assert "it's only a constant" is to assert that the pre-asymptotic behavior is well-behaved enough to ignore. That is an empirical claim, not a theoretical one. The proposal treats it as a theoretical guarantee.

  **The Strongest Version of the Rejected Position**

  In recommending a scoping award rather than full funding, I am effectively rejecting Reader B's call to fund the full three-year request immediately. I want to articulate their position as strongly as possible, because it contains the core truth of why we should not decline the proposal entirely.

  Reader B's argument is that theoretical purity is a luxury we cannot afford if we wish to solve general induction. There is currently no other framework that justifies Occam's razor without circularity; every other machine learning method relies on inductive biases that are justified only by past performance. Solomonoff induction is the *only* anchor we have to objective truth in prediction.
  From this viewpoint, demanding empirical benchmarks before funding the theory is category error. We cannot know if the constant is "too large" without building the system at the scale where the asymptotic behavior begins to emerge. A scoping award risks starving the project before it reaches the critical mass needed to validate the theory. If this approach works, it is a step toward AGI; if it fails, it is a definitive proof that this path is closed. Both outcomes are worth $2.4M. To dilute the funding is to guarantee an inconclusive result, leaving the question of the universal prior's practical utility permanently unresolved.

  **Conditions for the Scoping Award**

  To move from scoping to full implementation, the applicants must satisfy the following conditions within twelve months:

  1.  **Baseline Comparison:** Demonstrate that the four-machine average outperforms a single-machine baseline and a standard uniform ensemble on a standardized set of algorithmic prediction tasks (e.g., Hutter's Large Number Competition datasets).
  2.  **Constant Quantification:** Explicitly measure the translation constants between the four machines. Show that these constants do not dominate the description length of the target patterns in the finite data regime.
  3.  **Compute-Error Curves:** Provide evidence that the error rate decreases as a function of compute budget in a manner consistent with the theoretical bound, rather than plateauing due to the overhead of the dovetailing search.

  **Closing**

  **What would change the Committee's mind?**
  We would be prepared to approve the full $2.4M request immediately if the applicants can provide preliminary data (even from pilot runs) showing that the four-machine average converges significantly faster than a single-machine baseline on non-trivial data. Evidence that the "Reference-Free" twist provides a measurable reduction in sample complexity would override our concern regarding the additive constant.

  **Where is this recommendation most likely to be mistaken?**
  I am most likely mistaken if the value of this project lies not in the specific convergence bounds, but in the infrastructure built to approximate them. It is possible that the "decoration" of the universal prior drives the discovery of novel search heuristics that are valuable regardless of the theoretical guarantees. If the true discovery is a new class of computable approximators that happen to be motivated by Solomonoff induction, a scoping award focused on theoretical validation might undervalue the engineering breakthroughs. We risk optimizing for theoretical correctness at the expense of serendipitous utility.

  **Decision:** Fund 12-Month Scoping Award.
