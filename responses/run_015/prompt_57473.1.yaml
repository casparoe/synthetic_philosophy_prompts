answer: |-
  There is no single canonical noun for this specific structural feature, though it is the engine room of Davidson's entire project. The closest established label is **The Constitutive Ideal of Rationality**, but that describes the *status* of the constraint, not the *mechanism* you're isolating.

  You have correctly identified that "Charity" is the wrong word for what you're seeing. Charity sounds methodological (a nice thing I choose to do). What you are describing is transcendental (a condition that must be met for interpretation to exist at all).

  Here is the carving you are looking for, the boundary cases, and why the "error ledger" behaves the way it does.

  ### 1. The Name: The Asymmetry of Interpretation
  Since there isn't a standard noun, the most precise description of the pattern you've found is **The Asymmetry of Interpretation** (or **The Interpretive Asymmetry**).

  It captures the two features you noticed:
  1.  **Directionality:** You can trade belief-error for meaning-variance, but you cannot trade meaning-variance for belief-error (because belief-error presupposes meaning).
  2.  **The Limit:** The trade stops at unintelligibility, not at massive falsehood.

  In the literature, this is often discussed under the header **The Impossibility of Massive Error**. Davidson's claim is not that people *are* mostly right, but that they *must be interpreted as* mostly right to count as having beliefs at all.

  ### 2. Why "Charity" Doesn't Fit
  You said: *"Charity is a policy I adopt... whereas what I'm describing is about which direction a trade can run."*

  You are right to reject "Charity" as the label.
  *   **Charity** suggests: "I will be generous and assume you are right." (Optional, moralistic).
  *   **Constitutive Rationality** suggests: "If I assume you are wrong, I am no longer interpreting your words, I am describing your noise." (Necessary, structural).

  The mismatch is that Charity implies there is a fact of the matter about your error that I am choosing to overlook. Your insight is deeper: there *is no fact of the matter* about your error until I have fixed your meanings, and I can only fix your meanings by assuming your truth. The error doesn't exist prior to the interpretation.

  ### 3. The Boundary Case: When the Refile Fails
  You asked: *"What would a case look like where the refile genuinely isn't available?"*

  This is the critical test. The refile fails when the pattern of "errors" becomes **incoherent** rather than just **divergent**.

  **The Case:**
  Imagine a speaker who assents to "It is raining" when it is raining, but also assents to "It is not raining" under the exact same conditions, *and* assents to "If it is raining and not raining, then the moon is cheese."

  *   **Attempted Refile:** You try to adjust their meaning of "raining." But to do that, you need some stable anchor (e.g., they use "raining" to mean "wet"). But if they also deny "It is wet" while standing in the rain, you have no anchor.
  *   **The Limit:** You cannot construct a meaning-manual that makes them consistent. The "errors" are not systematic enough to be refiled as a different logic or a different dictionary.
  *   **The Verdict:** You do not conclude they are "massively wrong." You conclude they are **not speaking**. They are making noise.

  **Is this a bug?**
  No, it is the point. This boundary defines the edge of the "mental." To have beliefs is to be mostly right about the world. To be mostly wrong about the world is to have no beliefs. The "squeezing out" of large-scale error isn't a failure of the theory; it's the definition of what it means to be an interpreter/agent.

  ### 4. The Directionality (Why the Ledger Only Goes Down)
  You noted: *"I can't take a real difference in meaning and refile it as one of us being mistaken about the world, because being mistaken about the world already requires the meaning to be settled."*

  This is the **Primacy of Truth**.
  In radical interpretation, Truth is the coordinate system. You cannot measure deviation (error) without a grid (meaning). You cannot build the grid without assuming the points land where they should (truth).

  *   **Standard View:** Meaning $\rightarrow$ Belief $\rightarrow$ Truth Value.
  *   **Davidsonian View:** Truth (Assent) $\rightarrow$ Meaning + Belief (Solved simultaneously).

  Because Truth is the input, Error is the residual. You can shift the residual between Meaning and Belief, but you cannot generate *more* residual than the system can absorb without collapsing.

  ### 5. Summary of the Carving
  If you need a term to use in your own notes that captures the specific dynamic you described:

  **Term:** **The Intelligibility Threshold**
  **Definition:** The limit at which apparent belief-error can no longer be reinterpreted as meaning-variance because doing so would render the speaker's behavior inconsistent with *any* coherent assignment of meaning.
  **Consequence:** Below the threshold, disagreement is impossible (it becomes translation variance). Above the threshold, interpretation is impossible (it becomes noise). Massive localised error occupies the null set between these two states.

  **Why this fits your description:**
  1.  It acknowledges the **ceiling** (you stop interpreting).
  2.  It acknowledges the **trade** (error vs. meaning).
  3.  It explains why **flat-out error** is squeezed out (it falls into the gap between "different language" and "same language").

  You haven't invented a bug. You've identified the structural load-bearing wall of the argument. The reason it feels like there's no name is that most critics attack the *plausibility* of the claim (surely people *are* wrong!) rather than naming the *mechanism* of the claim (wrongness is structurally limited). You are looking at the mechanism.
