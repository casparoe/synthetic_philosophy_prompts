answer: |-
  # Seminar Activity: The Two Faces of the Money Pump

  ## 1. The Currency Constraint: Vouchers vs. Money
  **The Substitution:** We will use **"Chips"** (poker chips or colored tokens) as the medium of exchange. Chips are redeemable at the end of the seminar series for **Consumption Vouchers** (e.g., $5 Coffee, $5 Bookstore, 1 Homework Pass).
  **The Cost:** Unlike money, vouchers have diminishing marginal utility and are not perfectly fungible (a student who hates coffee values a coffee voucher at $0). This introduces noise: a "loss" of chips might not feel like a loss of utility if the student satiates on the reward good.
  **The Compensation:**
  1.  **Linearity:** Establish a fixed redemption rate (1 Chip = $1 value) and offer a *menu* of vouchers so students can diversify, approximating cash.
  2.  **Stakes:** Keep chip transactions small (1–5 chips) relative to endowment (20 chips) to stay in the linear range of utility.
  3.  **Transparency:** Explicitly acknowledge in the debrief that pumping on *goods* is weaker than pumping on *cash*, as preference cycles over goods can sometimes be rationalized by variety-seeking, whereas cycles over cash cannot.

  ## 2. Payoff Scheme & Bankroll
  *   **Dealer Bankroll:** 400 Chips total (approx. $400 value in vouchers).
  *   **Student Endowment:** 20 Chips each at start of Session 1.
  *   **Session 1 Costs:** Transaction fees in Part 1 (1 Chip/trade).
  *   **Session 2/3 Payoffs:** Vouchers purchased with accumulated Chips + Bonus Points for specific choices in Part 2.
  *   **Redemption:** Session 3. Chips convert to vouchers at 1:1 face value.

  ## 3. Part One: The Synchronic Pump (Session 1, 45 mins)
  **Goal:** Demonstrate that cyclic preferences ($A \succ B \succ C \succ A$) allow a sequence of trades that leaves the agent strictly poorer.

  **Materials:**
  *   3 Types of Vouchers (displayed): **Focus** (Coffee), **Calm** (Tea), **Comfort** (Hot Chocolate).
  *   Chips (20 per student).
  *   Recording Sheet (see Section 7).

  **Rules:**
  1.  **Endowment:** Every student receives 1 **Focus** Voucher and 20 Chips.
  2.  **The Market:** You will be offered three opportunities to trade your current voucher for a different one.
  3.  **The Tax:** Each trade costs a **1 Chip Transaction Fee**.
  4.  **Binding:** Once a trade is made, it is final for this session.
  5.  **Goal:** Maximize your final Chip count + Voucher Value.

  **The Mechanism (Facilitator Control):**
  To ensure the cycle occurs without deception, you will use **Attribute Salience**.
  *   *Trade 1 (Focus $\to$ Calm):* "Research shows Tea reduces cortisol levels during exam week. Who wants to swap Focus for Calm? Cost: 1 Chip." (Target: Stress-averse students).
  *   *Trade 2 (Calm $\to$ Comfort):* "Hot Chocolate contains theobromine, a mood elevator. Who wants to swap Calm for Comfort? Cost: 1 Chip." (Target: Mood-focused students).
  *   *Trade 3 (Comfort $\to$ Focus):* "Caffeine is the only proven cognitive enhancer for the upcoming paper. Who wants to swap Comfort for Focus? Cost: 1 Chip." (Target: Grade-focused students).

  *Note:* You are not forcing the trade. You are exploiting the fact that different attributes dominate in different contexts. Students who trade all three end up with their original Voucher but -3 Chips.

  ## 4. Part Two: The Diachronic Pump (Session 1 Setup, Session 2/3 Execution)
  **Goal:** Demonstrate dynamic inconsistency (Planning vs. Acting) and the value of pre-commitment.

  **Timeline:**
  *   **Session 1 (Now):** Plan for Session 3.
  *   **Session 2 (Next Week):** Execute/Revise Plan.
  *   **Session 3 (Week After):** Payoff.

  **Materials:**
  *   **Commitment Contract** (Paper slip).
  *   **Choice Card** (Paper slip).

  **Rules:**
  1.  **The Task:** At Session 3, you will receive a reward.
      *   **Option A (Prudent):** 5 Chips + A "Summary Sheet" (You must submit a 1-page summary of today's lecture by Session 3).
      *   **Option B (Indulgent):** 3 Chips + No Work.
  2.  **Session 1 Choice:**
      *   Most students will prefer **Option A** ex-ante (5 Chips > 3 Chips, work seems easy).
      *   **Commitment Option:** You may pay **2 Chips** now to *lock* yourself into Option A. If you lock, you cannot switch at Session 2.
      *   **Flexible Option:** Pay 0 Chips. You may choose A or B at Session 2.
  3.  **Session 2 Choice (5 mins):**
      *   If you chose Flexible, you now choose A or B. (The work now feels costly; many will switch to B).
      *   If you chose Commitment, you are stuck with A.
  4.  **Session 3 Payoff (5 mins):**
      *   Rewards distributed.

  **The Pump:**
  *   **The Inconsistent Agent:** Chooses Flexible (0 cost). At Session 2, switches to B. Result: 3 Chips.
  *   **The Consistent Agent:** Chooses Flexible. At Session 2, sticks to A. Result: 5 Chips.
  *   **The Self-Aware Agent:** Chooses Commitment (2 cost). Stuck with A. Result: 5 Chips - 2 Cost = 3 Chips net.
  *   *Lesson:* The Self-Aware agent paid a premium (the commitment fee) to protect their earlier self from their later self. The Inconsistent agent paid no fee but suffered a larger loss (2 Chips value) via reversal.

  ## 5. Facilitator's Script

  **Introduction (Session 1):**
  "Welcome. Today we test rationality not with equations, but with wallets. You have 20 Chips. These are real value; at the end of the course, they buy vouchers. In Part 1, you will trade. In Part 2, you will plan. My job is to offer options. Your job is to maximize value. I will not lie to you, but I will not remind you of your previous choices."

  **Handling the Skeptic (Part 1):**
  *Student:* "I see what you're doing. You're trying to make me cycle so I lose chips. I won't trade."
  *Facilitator:* "Excellent. If you see the cycle, the rational move is to refuse. But ask yourself: do you genuinely prefer the new item *enough* to pay the fee? If Tea is truly better than Coffee for you right now, trade. If you're only refusing because you suspect a trap, you might be passing up a genuine improvement. Rationality requires acting on preferences, not guessing the professor's game."

  **Handling the Renegotiator (Part 2, Session 2):**
  *Student:* "I locked in Option A last week, but I don't want to do the work. Can I pay to get out of the contract?"
  *Facilitator:* "No. The definition of a commitment device is that it binds you. If you could renegotiate, it wasn't a commitment. You paid 2 Chips last week for the *right* to be forced. That price is sunk. You must submit the summary to get the 5 Chips."

  **Closing Part 1 (Session 1):**
  "Count your chips. If you have fewer than 20 and the same voucher you started with, you have been money-pumped. Keep your recording sheet. We will analyze why in Session 3."

  **Session 2 Script (5 Minutes):**
  "Take out your Part 2 Choice Card. If you selected 'Flexible' last week, circle A or B now. If you selected 'Commitment,' hand in your contract. You have 2 minutes."

  **Session 3 Script (5 Minutes):**
  "Redemption. Hand in your chips and cards. Receive vouchers. Keep your recording sheets for the debrief."

