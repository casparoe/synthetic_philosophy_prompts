  ## 7. Debrief Map (Session 3)

  **Mapping Moments to Arguments:**

  1.  **Part 1 (The Cycle):**
      *   *Moment:* Student trades Focus $\to$ Tea $\to$ Choc $\to$ Focus.
      *   *Argument:* **Synchronic Incoherence.** Your preferences at $t_1$ violated transitivity. You valued A > B, B > C, C > A simultaneously.
      *   *Takeaway:* Rationality requires structural consistency in valuation, not just "making sense" in the moment.

  2.  **Part 2 (The Reversal):**
      *   *Moment:* Student chooses Flexible at $t_1$, plans A, but chooses B at $t_2$.
      *   *Argument:* **Dynamic Inconsistency.** Your preference ordering changed over time ($A \succ_t B$ but $B \succ_{t+1} A$) without new information.
      *   *Takeaway:* Rationality may require treating your future self as a strategic opponent.

  3.  **Part 2 (The Commitment):**
      *   *Moment:* Student pays 2 Chips to lock Option A.
      *   *Argument:* **Pre-commitment as Rationality.** Paying to restrict freedom is rational if you know you will otherwise act against your long-term interest.
      *   *Takeaway:* Freedom of choice has negative value when self-control is costly.

  **Three Patterns of Planning:**
  1.  **The Resolute:** Chooses Flexible, sticks to Plan A. (Consistent, no cost).
  2.  **The Naive:** Chooses Flexible, switches to Plan B. (Inconsistent, high cost).
  3.  **The Sophisticated:** Chooses Commitment. (Consistent, pays cost to ensure consistency).

  ## 8. Predictable Pitfalls & Mitigations

  | Pitfall | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Stakes too small** | Students treat Chips as game points, not value. | **Redemption Guarantee:** Bring the actual vouchers to Session 1. Show them. Remind them at every trade. |
  | **Satiation** | Student has 3 Coffee vouchers; the 4th is worthless. | **Diverse Menu:** Allow Chips to be redeemed for Cash-equivalent (Bookstore) or Task-avoidance (Homework Pass). |
  | **Suspicion** | Students refuse trades to "beat the game." | **Script:** Frame refusal as potentially irrational if the trade is genuinely preferred. Reward skepticism in Part 2 (Commitment). |
  | **Genuine Preference Change** | "I just decided I hate Tea." | **Debrief:** Distinguish between *taste change* (rational) and *preference reversal* based on proximity (irrational in standard models). |
  | **Outside View** | Hard to tell Foresight from Plan-Honoring. | **Data:** Compare the Commitment group vs. Flexible group. If Commitment group has higher net utility, foresight was valuable. |

  **Honest Note on Limitations:**
  This activity cannot reproduce the **force of being pumped in a neutral medium**. Because we use vouchers, a student can argue, "I didn't lose value, I just enjoyed the variety of holding Tea for a week." A true money pump uses cash, where variety is irrelevant. You must supply the philosophical heavy lifting in the debrief: *"Imagine these were dollars. Would the variety argument still hold?"*

  ## 9. Settled vs. Contested (Theoretical Flagging)

  **Settled (Standard Rational Choice Theory):**
  *   **Exploitability implies Irrationality:** If a set of preferences allows a money pump, it violates the axioms of Expected Utility (Transitivity or Independence).
  *   **Pre-commitment is Instrumentally Rational:** If an agent knows they are dynamically inconsistent, restricting their future choice set maximizes ex-ante utility.

  **Contested (Live Disputes):**
  *   **The Normative Force of Exploitability:** Does the *possibility* of a pump make you irrational, or just vulnerable? Some argue (e.g., *McClennen*) that resolute choice (sticking to a plan without commitment) is a coherent alternative to sophisticated choice.
  *   **Sequential Rationality:** Is it rational to stick to a plan at $t_2$ when you know deviating yields higher utility *at $t_2$*? (The debate between **Sophistication** vs. **Resoluteness**).
  *   **Consumption vs. Cash:** Does being pumped on goods (Coffee/Tea) carry the same normative weight as cash? Some argue goods have context-dependent value, making cycles rational (e.g., *Quasi-cyclic preferences*).

  **Instructor Note:** Do not resolve these debates. Use the students' frustration ("I felt rational at every step!") to motivate the contested literature. The activity proves the *phenomenon* exists; the theory argues over what it *means*.
