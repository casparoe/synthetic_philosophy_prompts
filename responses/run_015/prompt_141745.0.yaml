answer: |-
  Here is the blunt feedback you asked for. I'm treating this as a peer review where I want the argument to survive contact with reality, not a workshop where we hug it out.

  ### 1. The Anchoring/Licensing Split
  **Verdict:** It's doing work, but you're under-explaining the metaphysics of the "mapping."

  You ask if this is just HPC relabeled with deference smuggled in. Here's the risk: If licensing is always borrowed from a homeostatic cluster at *another* scale, then effectively you're saying all projectible kinds are HPC kinds, just not necessarily at the scale we name them. That collapses your distinction into a claim about *reference* rather than *kindhood*.

  To make this stick, you need to be clearer on what happens when the mapping *isn't* to an HPC. You mention "seams" later, which lack homeostatic mechanisms entirely. If licensing can come from a seam (lack of causal traffic) rather than a cluster (presence of homeostatic mechanism), then you have successfully distinguished yourself from standard HPC. But in the gene example, you say it borrows from "molecular machinery that really is homeostatic." That sounds like standard HPC relativization.

  **The Fix:** Lean harder into the "seam" case for the licensing story. If licensing can arise from *negative* facts (absence of traffic) rather than *positive* facts (homeostatic mechanisms), then you've escaped the HPC orbit. If licensing always requires an HPC somewhere, you're just doing HPC theory with extra steps.

  ### 2. Seams vs. Joints
  **Verdict:** This is your most original move, but also the easiest to crush.

  **The Strongest Skeptical Reply:** "A seam is just a joint seen at low resolution."
  The skeptic will argue that a "lack of causal traffic" is itself a homeostatic property. If a language boundary exists because interaction thins out, that thinning is maintained by social mechanisms (geography, identity, politics). That's a homeostatic cluster of negative relations. You haven't found a new ontological category; you've just expanded the list of properties that can enter the cluster to include relational absences.

  **How to defend it:** You need to insist that a joint requires internal cohesion (positive glue), whereas a seam requires only external separation (negative space). If the skeptic says "absence is a property," you need to argue that ontological free-rides (things that exist only because something else *doesn't* happen) are categorically different from things that exist because something *does* happen. Don't let them reduce the seam to a weak joint.

  ### 3. The Gene Case
  **Verdict:** It carries the weight, but it's dangerous terrain.

  The gene is perfect for the "anchoring is messy" claim because everyone agrees the molecular reality is a mess. However, you risk stepping into the "gene concept" pluralism minefield. If there are 14 different definitions of "gene," are you talking about one kind with borrowed license, or 14 kinds being conflated?

  **Species:** I would leave species out of this section. Species are too often used as the paradigm HPC kind. Bringing them in might confuse the "borrowing" argument because species are usually argued to *be* the homeostatic cluster (via interbreeding/ecological niche). If you use species, you'll spend half your word count defending against the standard HPC account of species. Stick with the gene or maybe "mental state types" (which map messily to neural types). The gene case is stronger because the scale jump (population vs. molecular) is explicit in your text.

  ### 4. The Hostile Referee
  **Verdict:** They will attack the "not itself lawful" clause.

  In paragraph 2, you write: *"...because there is a mapping, not itself lawful or even perfectly specifiable..."*
  This is the red flag. If the mapping isn't lawful, why is the induction reliable? If it's not lawful, it's contingent. If it's contingent, why trust the projection?
  The referee will say: "You've solved the problem of induction by positing a magical mapping that works without laws. That's not an explanation; it's a placeholder."

  **The Fix:** You need to clarify what stabilizes the mapping if not lawhood. Is it brute stability? Is it pragmatic utility? If you say "stable enough around here," you risk making natural kinds local conveniences rather than metaphysical categories. You need to bite the bullet: either the mapping is law-governed (and you need to say how) or you are admitting that natural kinds are partially epistemic constructs. Don't hide behind "not perfectly specifiable."

  ### 5. Line-Level & Clarity
  *   **"Inflict it on anyone"**: (From your prompt, not the text) — Keep this energy. The draft is good.
  *   **"Talk of carving nature at its joints runs together two questions..."**: Strong opener.
  *   **"Call them *anchoring* and *licensing*."**: Clear.
  *   **"Borrowed projectibility"**: A bit clunky. "Vicarious projectibility"? "Derivative projectibility"? "Borrowed" implies it might need to be paid back. "Derivative" might be more precise. But "Borrowed" is vivid. Keep it if you define it tightly.
  *   **"Hopeless if you insist on it being one-to-one"**: "Hopeless" is too colloquial for a paper draft. Try "fails" or "breaks down."
  *   **"The long arguement..."**: Typo: "argument."
  *   **"Joints presuppose a single articulation"**: "Articulation" is doing heavy lifting here. Make sure you've defined it or that it's clear from context (skeletal metaphor).
  *   **"Causal traffic is unusually sparse"**: Good phrase. Keep.
  *   **"Interscalar stability"**: This is your money term. Make sure it gets highlighted.
  *   **"Phlogiston, biological race, the 'gene for X'..."**: Good list. Shows you know the stakes.

  **Specific Suggestion on Paragraph 2:**
  *Current:* "...because there is a mapping, not itself lawful or even perfectly specifiable, from K's members onto a genuinely homeostatic cluster..."
  *Critique:* This contradicts paragraph 4 where you say failures happen when the mapping is unstable. If the mapping isn't lawful, what makes it stable enough to borrow from?
  *Edit:* Consider changing "not itself lawful" to "not itself a kind-law." You want to allow that the mapping is robust without committing to it being a fundamental law of nature.

  **Specific Suggestion on Paragraph 3 (Genes):**
  You say: "Anchoring: no. Licensing, by borrowing: yes."
  This is too binary. If anchoring is a mess, is it *no* anchoring, or *messy* anchoring? If it's messy, does that undermine the licensing? Be precise. Maybe: "Anchoring: heterogeneous. Licensing: robust via borrowing."

  ### Summary
  You have a genuine distinction here between the *source* of membership conditions and the *source* of projectibility. That's valuable. But you are trying to have it both ways: you want the objectivity of HPC (via the borrowing target) without the metaphysical commitment (via the "not lawful" mapping). Tighten the account of the mapping, or admit that this makes kindhood partially epistemic. Don't let the "not lawful" clause do too much magic.
