  Two candidate rules explain the five prior rulings consistently. First, the **Literal Asset Rule**: protection extends only to near-identical copying of fixed tangible assets (text, images) or specific sequences. This predicts enforcement in Ruling 2 (dialogue/sequence) and Ruling 5 (cover art), as both involve specific fixed expressions. It predicts non-enforcement in Ruling 1 (premise), Ruling 3 (formula), and Ruling 4 (trope), because premises, mathematical methods, and stock arcs are abstract ideas lacking fixed asset identity. Second, the **Expressive Structure Rule**: protection extends to distinctive structural metaphors reflecting arbitrary authorial choice, excluding functional constraints or generic themes where merger forces a single expression. This also predicts all five rulings. Rulings 2 and 5 involved specific structural or visual choices (scene sequence, art composition) that were not functionally required. Rulings 1, 3, and 4 were denied because premises, formulas, and tropes are either functional necessities or generic conventions lacking distinctive authorial selection. Both rules fit the historical data perfectly. The critical divergence lies in whether protection extends beyond literal assets to underlying expressive structures when cosmetic details differ. The team has never faced a case where the structure was copied but the assets were altered, leaving the true boundary undefined until now. The prompt's hint about "functional constraints" is key: Rule 2 asks if the design was forced by function, while Rule 1 asks if the assets are identical.

  2. "Applying the rules"

  Applying the **Literal Asset Rule** to the new case yields a verdict of **no enforcement**. Under this rule, the competitor's different colors, typography, and animations mean no fixed assets were copied. The vertical timeline is treated as a functional method akin to the scoring formula in Ruling 3, not expressive art. Since the "spine" is implemented with different visual assets, it falls outside protection. This rule assumes UI layouts are functional constraints unless literally identical. Conversely, the **Expressive Structure Rule** yields a verdict of **enforcement**. Here, the "spine/vertebra" metaphor is viewed as a distinctive structural choice, not dictated by function (a timeline could be horizontal, list-based, or radial). Like the scene sequence in Ruling 2, this structure reflects arbitrary authorial choice rather than efficiency. The divergence lies in how we classify the UI layout. Rule 1 classifies it as a functional method unless assets match exactly. Rule 2 classifies it as an expressive metaphor if the specific arrangement is arbitrary. The competitor copied the expressive metaphor, not just the function. If we view the spine as a "visual concept" like Ruling 5, Rule 2 applies. If we view it as a "method of operation" like Ruling 3, Rule 1 applies. The key distinction is whether the "vertebra" imagery is seen as necessary for a timeline (functional) or an arbitrary stylistic flourish (expressive). Most UIs use lines; vertebrae are a specific creative choice.

  3. "The most consistent verdict"

  The team should **enforce**. The closest analog is Ruling 5 (cover art). In Ruling 5, we protected the visual concept despite recoloring and font changes, prioritizing the compositional choice over specific asset details. This suggests we value the underlying expressive structure over literal pixel-matching. Similarly, the "spine/vertebra" is a compositional metaphor, not merely a functional tool like the scoring formula in Ruling 3. Ruling 2 also supports this, as we protected a sequence structure, not just dialogue. Deciding not to enforce would adopt the **Literal Asset Rule**, implying our IP is limited to specific code or graphics, leaving structural innovation open to cloning. Deciding to enforce adopts the **Expressive Structure Rule**, signaling that distinctive metaphoric arrangements are core property. Given Ruling 5's willingness to look past cosmetic changes to the underlying visual concept, enforcement coheres best with our track record. Adopting the Literal Asset Rule now would contradict the principle established in Ruling 5 that cosmetic differences do not negate infringement if the expressive core is taken. We must protect the "vertebra" concept, not just the color of the bone. This maintains consistency with our history of protecting authorial choice over functional necessity. It also protects our product's unique market identity against clones that swap skins but steal the soul.

  4. "The discriminating case"

  To discriminate the rules, bring a case where a competitor copies the **logic** of the spine but changes the **visual metaphor**. Example: A rival app uses the exact same version-history data structure and scroll interaction but renders it as a "tree ring" cross-section instead of a "spine." The **Literal Asset Rule** predicts **no enforcement** because the visual assets and specific metaphor differ; it requires literal similarity in expression. The **Expressive Structure Rule** predicts **enforcement** because the underlying structural logic and interaction choice remain the same, representing the same arbitrary authorial decision. This case isolates whether we protect the visual skin or the structural bone. If we enforce the tree ring case, we confirm Rule 2. If we decline, we confirm Rule 1. This would finally resolve the ambiguity left by the current track record. It forces the team to decide if the "value" is in the look or the structural idea.
