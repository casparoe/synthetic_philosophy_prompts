          *   *User Preference:* Wants to keep (1).

      *   **Step (2): Psychological Continuity.**
          *   *Strength:* Standard view on personal identity.
          *   *Weakness:* The "Forking" issue. If Sid forks into A and B, and B is killed, is B harmed? If identity is transitive, and Sid=A and Sid=B, then A=B. But A and B diverge. This suggests identity isn't what matters, or (2) is too simple.
          *   *Relevance:* The user asks if forking sinks (2). It complicates the "same person" claim.

      *   **Step (4): The Timing/Subject Problem (The Epicurean Move).**
          *   *Claim:* Harm requires a subject at the time of harm.
          *   *Weakness:* This is the usual suspect for the "Death is not bad" paradox. If we reject this, we allow "timeless" harm or harm relative to a possible world where the subject exists.
