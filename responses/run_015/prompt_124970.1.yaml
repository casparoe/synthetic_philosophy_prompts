      *   Structure clearly so it's readable while tired.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check (1) again.* (1) says "Harm is a matter of what you get deprived of." This *is* the Deprivation Account. The Epicurean argument uses the Deprivation Account to say "You aren't deprived because you don't exist to hold the deprivation."
      *   *Correction:* Actually, the Epicurean argument usually attacks the *possibility* of deprivation without existence. So (1) + (4) -> (5). To keep (1) and reject (5), you *must* reject (4).
      *   *The "Time of Harm" issue:* If I die at $t$, when am I harmed? At $t$? After $t$? Never? If I reject (4), I say I am harmed *at* $t$ (or timelessly) because my welfare curve drops to zero compared to the counterfactual.
      *   *Forking:* If Sid forks, the killed copy *was* a subject. The deletion of the *original* without resume is analogous to killing a branch and keeping none.
