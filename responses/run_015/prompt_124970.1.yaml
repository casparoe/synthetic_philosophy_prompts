      *   *Cost of dropping (4)?* You accept "Posthumous Harm." You accept that death is bad for the dead (or rather, bad *for* them, not experienced *by* them).
      *   *Forking Issue:* Forking makes (2) shaky. If Sid splits, the "killed" branch is a distinct subject with a truncated future. This reinforces that deletion is harmful deprivation.

  6.  **Drafting the Response (incorporating the "1 AM Wine" vibe):**
