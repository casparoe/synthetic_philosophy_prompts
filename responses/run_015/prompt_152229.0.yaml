      *   **Core Case:** The user's brother-in-law (BIL) had a stroke. He reports high intensity pain (8/10) but zero bothersomeness (0/10). He refuses analgesia (morphine) but complains about instrumental harms (can't do crosswords). He retains other aversions (tickling, itchy blankets).
      *   **The Two Sides:**
          *   Side A: "Badness is in the sensation itself" (Evaluativism/Imperativism variant? No, more like Phenomenalism about hurtfulness). Let's call them *The Intrinsic Hurt View*.
          *   Side B: "Badness is just disliking plus wanting it to stop" (Motivational/Desire-Based View). Let's call them *The Motivational View*.
      *   **Task:** Draft a joint statement of an adversarial collaboration.
      *   **Format:**
          1.  Numbered section of agreed claims (clinical purpose, case interpretation, neurology requirements).
          2.  Table of disagreements (phrased so each side signs their own wording).
          3.  The "Cruxes" (the most important part):
              *   Is it full intensity/no nastiness OR loss of motivation/nastiness intact?
              *   Is the fight verbal (definition of 'pain')?
              *   Mirror-image case (Drug X: No burning, high urge/loathing).
              *   Opposite direction case (Phantom limb wanted pain).
              *   For each crux: Agreed evidence, Side A prediction, Side B prediction, Falsification conditions.
              *   Conclusion on dissolution vs. settlement and incompatible requirements.
      *   **Tone:** Academic but practical, collaborative, precise, acknowledging the stalemate without resolving it definitively (since the user wants a document, not a verdict).

  2.  **Deconstruct the Philosophical Positions:**
      *   *Side A (Intrinsic Hurt):* Pain *essentially* hurts. If it doesn't hurt (bother), it's not pain, or it's a degraded form. The BIL case suggests a dissociation where the "hurt" component is severed, leaving only sensory discrimination. They likely view the 8/10 as "sensory intensity" but deny the "affective" component is missing *if* it's truly pain. Or they argue the 8/10 *is* the hurt, and the 0/10 is a confabulation or higher-order cognitive disconnect.
      *   *Side B (Motivational/Desire):* Pain is a sensation + a motivational push (desire for it to cease). The BIL case shows these come apart. The sensation remains, the motivation is gone. Therefore, pain's badness is extrinsic (based on the desire), not intrinsic to the qualia.

  3.  **Drafting - Section 1: Agreed Claims (The Common Ground):**
      *   Need to satisfy clinical utility.
      *   Need to acknowledge the BIL case is real data, not just confusion.
