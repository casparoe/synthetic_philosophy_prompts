      *   *Incompatible Requirements:* The prompt asks to flag if requirements can't be satisfied. The requirement to define pain solely by phenomenology *and* solely by function is likely the conflict.

  8.  **Final Polish:** Check formatting (numbered sections, table, clear headings). Ensure the voice is that of a collaborative document, not a third-party observer (though written *for* the user to submit). The prompt asks me to "Draft the joint statement... Call the sides...". So I am writing the document *as* the collaboration.

