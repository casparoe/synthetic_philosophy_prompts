      *   Make sure the clinical advice is actionable. Don't just say "argue." Say "Respect the 0/10 bother score for opioid prescribing, but address the 8/10 intensity for cognitive load."
      *   Check the "Cruxes" requirements: Evidence, Predictions, Falsification for *each*.
