      *   *Neurology:* Need to see specific pathway damage (e.g., cingulate vs. somatosensory).

  4.  **Drafting - Section 2: Table of Disagreements:**
      *   Need to phrase rows so Side A signs Column A and Side B signs Column B.
      *   *Topic:* Nature of the BIL's experience.
      *   *Topic:* Definition of Pain.
      *   *Topic:* Source of Normativity (why pain is bad).

  5.  **Drafting - Section 3: The Cruxes (The Core Request):**
      *   *Crux 1: The BIL's State.* Is the nastiness gone or the motivation gone?
          *   Evidence: fMRI (ACC activity), behavioral avoidance tests.
          *   Predictions: A says ACC silent (no hurt); B says ACC active but disconnected from action planning.
          *   Falsification: If ACC lights up and he *still* says 0 bother, A struggles. If ACC is silent, B struggles to explain the 8/10 intensity as pain.
      *   *Crux 2: Verbal Dispute.* Definition of 'Pain'.
          *   Evidence: Linguistic usage + Clinical coding.
          *   Predictions: A says "Pain" implies hurt; B says "Pain" implies sensory state.
          *   Falsification: IASP definition updates.
      *   *Crux 3: Mirror-Image (Drug X).* No sensation, high urge/loathing.
          *   Evidence: Phenomenological report.
          *   Predictions: A says "Not pain, just anxiety/aversion"; B says "Pain without sensation (pure imperativism)".
          *   Falsification: If patients classify it as pain despite no qualia.
      *   *Crux 4: Wanted Pain (Phantom Limb).*
          *   Evidence: Patient refusal of treatment.
