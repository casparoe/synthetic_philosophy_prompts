      *   *Dissolution/Incompatibility:* The definition of "Badness." Is it phenomenal badness or normative badness? The requirement that a theory must explain *both* the phenomenology and the motivation simultaneously might be the impossible constraint.

  6.  **Refining the Tone and Content:**
      *   Ensure the "Side Names" are neutral enough to be signed.
          *   Side A: *The Phenomenal Hurt View* (Badness is intrinsic).
