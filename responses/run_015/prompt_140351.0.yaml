answer: |-
  Here is a structured breakdown designed for a seminar argument. I've separated the brainstorming phase (to show the fault lines) from the organized reconstruction you can present.

  ### Part 1: Unstructured Brainstorming & Fault Lines

  Before we build the argument, we need to locate where the friction actually is. It is tempting to say "Law says no experience, Medicine says yes experience," but that is too blunt.

  *   **The Law's Actual Target:** Criminal law does not care about *qualia* (what it feels like). It cares about *agency*. The automatism defence is not "I wasn't conscious"; it is "I was not the author of this movement." A person can be fully conscious (e.g., under duress, or having a seizure while aware) but lack legal agency. Therefore, the law is metaphysically agnostic about whether the sleeper was "experiencing" anything. It only requires that the motor output was disconnected from the waking will.
  *   **The Clinic's Actual Target:** Clinical psychology cares about *impact* and *memory*. For PTSD or therapy to work, the dream must leave a causal trace in the waking mind. It does not strictly matter if that trace was laid down by a real-time conscious simulation (Realism) or constructed upon waking (Malcolm). What matters is that the *waking subject* treats it as a memory of an event. However, lucid dreaming research (eye signals) pushes harder toward Realism because it implies a two-way street between dream content and physical output *during* sleep.
  *   **The Malcolm/Dennett Wedge:** Malcolm is the easiest to discard here. If eye signals are genuine, Malcolm's claim that dreams are *only* waking impressions is empirically strained. Dennett is the harder opponent. Dennett allows the eye signals but denies there is a "fact of the matter" about when the consciousness happened. The Clinic acts *as if* there is a fact of the matter (the trauma happened at 3 AM). The Law acts *as if* there is no fact of the matter (the act at 3 AM was not an action).
  *   **The Hypothetical Clause:** This is the most philosophically dangerous idea. Linking responsibility to REM status assumes that *Consciousness* is the locus of responsibility, rather than *Control*. This upends standard criminal law doctrine. It also assumes a Naive Realist view of dreaming that neither Malcolm nor Dennett would accept.

  **The Core Insight:** The Law and Medicine are not contradicting each other on the *metaphysics* of dreaming. They are contradicting each other on the *functional role* of sleep states. Law sees sleep as a **disconnection of output**. Medicine sees sleep as a **connection of memory/affect**. These can coexist. The hypothetical clause fails because it tries to make physiology (REM) a proxy for agency, which is a category error.

  ---

  ### Part 2: Organized Seminar Argument

  Here is how you can structure this in class. It moves from reconstructing the implicit theories to analyzing the hypothetical clause, focusing on "load-bearing" premises.

  #### 1. Reconstructing the Implicit Theories

  You need to argue that both institutions are underdetermined by the philosophy of mind. They rely on functional outcomes, not ontological truths.

  **A. The Legal Presupposition: The "Broken Link" Theory**
  *   **The Doctrine:** Automatism negates the *actus reus* (voluntary act).
  *   **Strict Presupposition:** The law *only* presupposes a dissociation between cognitive intention and motor execution. It does **not** presuppose a lack of conscious experience.
  *   **Load-Bearing Premise:** *Volition is necessary for responsibility.*
  *   **Underdetermined Area:** Whether the sleeper was having a phenomenal experience.
      *   *Why:* I can be responsible for a thought but not a reflex. If a sleepwalker kills someone, the law says the "will" was offline. It does not matter if their "mind" was online watching a movie (dreaming).
      *   *Compatibility:* This is compatible with Malcolm (no experience), Dennett (indeterminate experience), and Realism (full experience). As long as the *motor control* is severed, the legal outcome is the same.
  *   **The "Internal Cause" Nuance:** You mentioned the Canadian distinction (mental disorder automatism vs. non-insane). This classifies sleepwalking as an internal pathology. This implies the sleeper is *defective*, not *absent*. It treats the sleep state as a medical condition affecting the brain's governance, not necessarily a void of consciousness. This actually leans *away* from Malcolm. If it were a total void, it might be treated more like a blackout. Treating it as a disorder suggests something active is happening (a glitch), which fits better with a Realist or Dennettian view where the brain is processing, just not governing.

  **B. The Clinical Presupposition: The "Causal Trace" Theory**
  *   **The Doctrine:** Nightmares cause distress; therapy alters dream content.
  *   **Strict Presupposition:** Sleep states produce memory traces that function like waking memories in the cognitive architecture.
  *   **Load-Bearing Premise:** *Dream content has causal efficacy on the waking self.*
  *   **Underdetermined Area:** The temporal location of the experience.
      *   *Why:* For PTSD, it matters that I *remember* the trauma. It does not strictly matter if the trauma was "lived" in REM or "constructed" upon waking, provided the physiological stress response is identical. Imagery Rehearsal Therapy (IRT) works on the *narrative*. If I change the story I tell myself, the distress drops. This is surprisingly compatible with Malcolm. If dreams are just waking impressions, IRT is just editing the impression.
      *   *The Lucid Dreaming Exception:* The eye-movement signalling is the only point that strains Malcolm. If I agree to look left-right when I see a clock in the dream, and my eyes move left-right in REM, there is a correlation between dream-content and physical state.
      *   *Dennett's Out:* Dennett can handle this. He would say the memory trace was encoded in a way that correlates with the motor output, but he would still deny there is a "fact of the matter" about whether the *experience* of seeing the clock happened *before* the eyes moved or was stitched in later. The Clinic doesn't need to settle this. They just need the correlation to hold.

  **C. Do They Contradict?**
  *   **Argument:** No. They are talking past each other.
  *   **Law:** "Was the body under the command of the agent?" (Answer: No).
  *   **Medicine:** "Did the brain process information that affects the agent?" (Answer: Yes).
  *   **Synthesis:** You can have a brain processing information (Medicine) without the agent commanding the body (Law). A computer can run a virus scan (processing) while the keyboard is locked (no input/output control). The Law locks the keyboard; Medicine studies the scan.

  #### 2. Analyzing the Hypothetical Clause

  *The Clause:* "Automatism defence unavailable if in REM sleep."
  *The Rationale:* REM = Dreaming = Conscious Experience = Responsibility.

  This is where you can really shine in the seminar. This clause is philosophically incoherent under most theories and doctrinally dangerous.

  **A. What Theory of Dreaming Does This Commit To?**
  *   **Commitment:** Naive Realism.
  *   **Why:** It assumes that REM physiology is a perfect proxy for "Conscious Experience."
  *   **Failure under Malcolm:** If Malcolm is right, REM is just a physiological state. The "dream" is a waking fiction. Punishing someone for being in REM would be punishing them for their brain waves, not their experiences. It would be like punishing someone for having a high heart rate.
  *   **Failure under Dennett:** If there is no fact of the matter about *when* the experience occurred, pinning liability on the *physiological window* (REM) is arbitrary. The "consciousness" might be a retrospective gloss laid down after the REM period. The clause assumes consciousness is a substance contained within the REM window. Dennett says it's a narrative gravity that might not align with the clock.

  **B. What Theory of Responsibility Does This Commit To?**
  *   **Commitment:** Consciousness-Based Responsibility (vs. Control-Based).
  *   **The Shift:** Standard criminal law tracks *control* (Could you have done otherwise?). This clause tracks *awareness* (Were you experiencing something?).
  *   **The Problem:** Consciousness is not sufficient for responsibility.
      *   *Example:* I am conscious of a seizure happening. I am conscious of my leg kicking. I am not responsible for the kick.
      *   *Application:* If I am in REM, I might be having a vivid conscious experience (a nightmare), but I am still physiologically inhibited (REM atonia). If that atonia fails (REM Sleep Behavior Disorder), I act out. I am conscious in the dream, but I have no *veridical* access to the real world, and no *voluntary* control over the limbs.
      *   **Result:** The clause punishes people for having a rich inner life while their body is hijacked by physiology.

  **C. Is It Self-Undermining in Practice?**
  *   **Yes, via False Negatives:** It lets off people who were conscious but not in REM.
      *   *Scenario:* NREM Sleepwalking. Recent research suggests complex behavior can happen in NREM. If the subject had some level of conscious awareness (foggy, but present) but was in NREM, this clause grants them automatism. The Law wanted to punish consciousness, but missed it because the physiology was wrong.
  *   **Yes, via False Positives:** It punishes people who were in REM but had no agency.
      *   *Scenario:* A person in REM has a nightmare about being attacked. They flail. They did not "choose" to flail in the legal sense; the motor inhibition failed. The clause punishes them because they were "conscious" (in REM). This violates the principle that *actus reus* requires a voluntary act.

  #### 3. Summary of Load-Bearing Readings (For your handout/notes)

  Use this table to summarize the "Strict Presupposition" vs. "Comfortable Fit."

  | Institution | Strict Presupposition (Load-Bearing) | Comfortable Fit (Underdetermined) | Incompatible With |
  | :--- | :--- | :--- | :--- |
  | **Criminal Law (Automatism)** | **Lack of Volitional Control.** The link between will and muscle is broken. | **Metaphysics of Experience.** Compatible with Malcolm, Dennett, or Realism. | Any theory claiming sleepwalkers have full waking agency. |
  | **Clinical Practice** | **Causal Efficacy of Memory.** Sleep events leave traces that function as memories. | **Temporal Location.** Doesn't strictly matter if experience was real-time or retrospective. | Theories claiming dreams leave *no* cognitive trace (hardline behaviorism). |
  | **Hypothetical Clause** | **Consciousness = Responsibility.** If you experience it, you own it. | **Physiological Proxy.** Assumes REM is a perfect marker for Consciousness. | **Malcolm** (REM isn't experience), **Dennett** (Timing is indeterminate), **Standard Law** (Control > Consciousness). |

  ### Closing Argument for Seminar

  "The tension between the courtroom and the clinic is not a conflict about whether dreams are 'real.' It is a conflict about which features of the mind matter for different purposes. The Law requires a **driver**; the Clinic requires a **passenger** who remembers the ride.

  The hypothetical clause fails because it tries to use the passenger's memory as proof that they were driving. It conflates *phenomenology* (what it was like) with *agency* (who did it). Under Malcolm, the clause is nonsense because there was no passenger. Under Dennett, it's arbitrary because we can't say when the passenger got on board. Under Realism, it's unjust because a passenger is not liable for the crash just because they were awake to see it.

  Therefore, the law is right to stick to **volition**, and medicine is right to stick to **impact**. Trying to merge them by using REM as a proxy for responsibility commits a category error that neither philosophy of mind nor criminal doctrine can support."
