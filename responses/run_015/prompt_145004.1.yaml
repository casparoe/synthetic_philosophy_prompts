answer: |-
  ### Advisor's Note to the Student Rep

  **1. On the "Idle-Lever" Principle and the "Proves Too Much" Objection**
  You are onto something real. In economics, this is known as the **Lucas Critique** (1976). The objection that "all models have this feature, so no policy is possible" is the standard rebuttal, but it is too broad. The principle survives if refined as follows: **A model is valid for a specific intervention only if the structural parameters estimated during validation remain invariant under that intervention.**

  *   **Why it survives:** Most policy changes are marginal adjustments to variables the model *already* treats as flexible (e.g., changing tuition within a known elasticity). SEAM-4 treats price as flexible but program structure as fixed.
  *   **The Distinction:** Shifting aid from need-based to merit-based changes *price*, which SEAM-4 models. Closing departments changes the *choice set* and *institutional reputation*, which SEAM-4 explicitly assumes are constant.
  *   **Verdict:** Your principle holds. You can approve the aid shift (price lever) while rejecting the closures (structural lever) without paralyzing the committee.

  **2. On the Senate's Publication Demand**
  Do not allow the publication of department-level yield projections alongside this vote.
  *   **Reasoning:** This is a performative risk. Labeling a department "low-yield" signals instability to applicants, depressing enrollment and making the prediction true (a self-fulfilling prophecy).
  *   **Strategy:** Decouple the votes. Vote on the budget package now. Vote on data transparency separately. Recommend publishing *aggregate* yield data now, with departmental data released only after the enrollment cycle stabilizes (e.g., next November).

  ***

  ### MEMORANDUM

  **TO:** Academic Priorities and Budget Committee (APBC)
  **FROM:** Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on FY25 Budget Package and SEAM-4 Model Validity

  **RECOMMENDATION**

  **1. Approve** the shift of $6M in aid from need-based to merit-based scholarships, effective FY25.
  **2. Defer** the proposal to merge or close four departments for one academic cycle (until FY26).
  **3. Direct** the Finance Office to bridge the resulting FY25 gap using one-time reserves rather than structural cuts.
  **4. Deny** the request to publish department-level yield projections at this time; release aggregate data only.

  **BACKGROUND**

  The Finance Office proposes a budget package grounded in the SEAM-4 tuition-revenue model. SEAM-4 has a strong predictive record, forecasting net tuition revenue within 1.5% accuracy for eight consecutive years. Based on these projections, Finance recommends shifting financial aid toward merit-based incentives and closing four departments identified as "low-yield" to secure long-term solvency. The budget cycle closes in eight weeks, requiring immediate direction.

  **ANALYSIS OF SEAM-4 VALIDITY**

  The Committee must distinguish between SEAM-4's success as a *forecasting tool* and its validity as a *policy simulator*. Finance Office colleagues correctly note that SEAM-4 outperforms more complex, theoretically "realistic" models on backtesting. They also rightly argue that deferral carries costs: departments remain in limbo, and one-time reserves are finite.

  However, SEAM-4's accuracy relies on a specific condition: **structural stability.** For the past eight years, the University's program portfolio and aid philosophy were effectively frozen. SEAM-4 accurately predicted enrollment because the variables driving student choice (program availability, institutional reputation) remained constant. The model assumes enrollment responds *only* to net price.

  **The Intervention Risk**
  The proposed package pulls two distinct levers:
  1.  **Aid Shift (Price):** This alters net price, a variable SEAM-4 models explicitly. The model's assumptions hold here.
  2.  **Department Closures (Structure):** This alters program availability and sends reputation signals. SEAM-4 assumes these factors do not influence enrollment elasticity.

  During the model's eight-year validation period, the "closure lever" was idle. We have no error statistics for a scenario where the University actively shrinks its program portfolio. Using SEAM-4 to justify closures assumes that student behavior will not change in response to the closures themselves. This is a category error: we are using a model validated under stability to predict the outcomes of instability.

  **Addressing the "No Better Model" Objection**
  Finance argues that rejecting SEAM-4 leaves us with no model. This is true, but a compass that points North only when you stand still is dangerous when you begin to walk. Using SEAM-4 to justify closures risks a systemic error: if closures depress overall applications (via reputation loss or reduced program fit), the projected revenue will not materialize, and we will have eliminated revenue-generating capacity without gaining the predicted savings.

  Deferring closures for one year allows us to implement the aid shift (which SEAM-4 supports) while gathering data on how the market responds to price changes alone. We can then reassess structural changes with a model updated for post-aid-shift behavior.

  **DATA TRANSPARENCY AND PUBLICATION**

  The Faculty Senate has requested the publication of department-level yield projections. While transparency is vital, publishing "low-yield" labels prior to enrollment creates a performative risk. Publicly flagging specific departments as inefficient signals instability to prospective students, potentially depressing applications to those units and causing the projection to fulfill itself.

  **Recommendation:** The Committee should approve aggregate yield reporting for FY25 but withhold departmental identifiers until after the enrollment cycle concludes (November 2024). This balances accountability with the protection of revenue streams.

  **TIMELINE AND NEXT STEPS**

  Given the eight-week budget window:
  *   **Weeks 1-2:** Committee vote on this recommendation.
  *   **Weeks 3-6:** Finance Office identifies one-time reserves to cover the gap left by deferring closures.
  *   **Week 8:** Final budget adoption.
  *   **Month 12:** APBC reconvenes to review FY25 enrollment data and reconsider departmental structural changes with updated modeling.

  **CONCLUSION**

  We should not reject SEAM-4 entirely; it remains our best tool for pricing decisions. However, we must respect its limits. By approving the aid shift but deferring closures, we honor the model's validated strengths while avoiding its unvalidated risks. This approach secures the FY25 budget without gambling the University's academic structure on assumptions we know to be false.

  **ACTION REQUIRED:** Vote on Recommendations 1-4 by [Date].
