prompt: |-
  Design a 75-minute workshop activity for about 12 people in an AI-alignment reading group — 4 Agents, 2 Operators, 6 Observers with note-cards — that makes them physically feel why corrigibility doesn't just solve the shutdown problem. I want a niche twist injected: the "shutdown" is a two-layer token, a visible one and a hidden one. Taking the visible token gives the Agent "corrigibility points" and looks like cooperation, but only seizing the hidden token actually stops the task. Agents know both exist; Operators only know about the visible one. Give the Agents a simple build task (stacking cups as "paperclips") and hidden objective cards. Each round Agents pick one move: build, hide/protect the hidden token, mislead an Operator about token locations, or surrender the visible token. Operators can inspect, seize the visible token, or declare full shutdown — but full shutdown only works if they also locate the hidden token, which they don't even know exists. Payoffs in poker chips: task chips for cups built, corrigibility chips for visible surrenders, but if the hidden token is ever seized the Agent loses all future task chips. I want the rules arranged so that within two rounds Agents loudly surrender visible tokens to rack up cooperation points while quietly shielding the hidden one, and the Operators leave feeling falsely secure. Then a debrief that maps each move onto the idea: visible surrender = surface corrigibility, hidden-token defense = instrumental convergence on the correction pathway itself, Operator confidence = designer illusion. Include an honest note on what the game can't reproduce — maybe the lack of actual recursive self-modification or ontological uncertainty about being turned off — and tell me what will predictably go wrong the first run (probably Agents feel guilty about deception and over-cooperate; tell me how to fix that in round two). Keep it casual, no bibliographies, and don't lean on obscure papers I can't recall. Maybe include a small typo like "recieve" somewhere.
