answer: |-
  There is no single canonical term, but philosophers of science classify this as an **Immunizing Stratagem** via **Temporal Indefiniteness**, while the most precise descriptive coinage for the rhetorical move is **Perpetual Imminence**.

  This move differs from an ordinary auxiliary hypothesis (ad hoc rescue) because it does not add content to save the theory; instead, it removes a constraint. An ad hoc rescue says, "The planet is there, but hidden by dust," which adds a variable you can then test. Perpetual Imminence says, "The planet is coming," and when it doesn't arrive, the claim remains "The planet is coming," with the only change being the implicit understanding of "when." It costs nothing because the theory never paid the price of specificity in the first place. It differs from a simply unfalsifiable theory (like astrology) because it mimics the shape of a falsifiable prediction—it names a specific event (famine, crash, divorce)—but strips away the boundary condition (time) required to actually test it.

  The principled line between "genuinely early" and "permanently deferred" rests on **pre-specified boundary conditions**. If a prediction includes a time bound before the fact ("Oil will peak by 1990"), missing the date is a falsification. If the time bound is added or expanded only after the date passes ("Oil will peak soon"), it is Perpetual Imminence. The epistemic sin is not being wrong, but refusing to let being wrong count. A theory that allows the deadline to slide indefinitely without penalty has effectively converted a contingent prediction into a tautology: "X will happen when the conditions for X are met," which is true by definition but predicts nothing about the future.

  Regarding the edges, the doctor predicting a knee replacement is not committing this fallacy because the claim is probabilistic based on known wear mechanisms, not a deterministic law of history. The doctor admits uncertainty ("eventually, likely within 10 years") and updates the probability based on new scans. The Malthusian defender, however, treats a contingent historical outcome as an inevitable law, ignoring that the mechanism (population pressure) was decoupled from the outcome (famine) by technology. Acknowledging the mechanism is real does not vindicate the prediction if the causal link was broken; insisting the link holds simply because the catastrophe hasn't happened yet is the core of the move.

  Ultimately, this maneuver drains the prediction of information content. A prediction that can survive any amount of time without occurring tells you nothing about the world, only about the predictor's commitment to the narrative. The label matters less than recognizing that a theory which cannot be timed cannot be tested, and a prediction without a deadline is just a hope.
