answer: |-
  Dear colleague, I have reviewed the five loose tests our team has been applying and restructured them into a single decision procedure that addresses the regional director's demand for explicit causal justification while acknowledging the mismatch between long-term historical causes and short-term lending horizons. All five tests survive, but their order matters because we need to eliminate fatal flaws before investing time in comparative analysis. Step one must be the measurement contamination check, because if the measure of cause C was constructed partly from outcome Y, such as expert-coded governance indices that include economic performance indicators, the measure is unusable for this purpose rather than merely imprecise, and the procedure stops with a no immediately. Step two asks whether C and the competing cause D are rivals or links in a chain, since if D operates through C then the statistical strength of C does not refute D, and we must decide if our loan can move the link in the chain that is actually actionable within fifteen years. Step three runs the story backwards to check for hindsight bias, requiring us to state whether using only what was knowable about the country twenty-five years earlier the story would have ranked the subsequent trajectory as likely, and if the explanation depends on a fact that only became visible after the fact, the claim is capped at consistent with rather than causal. Step four requires naming a country that had C without Y and a country that Y without C, counting effective independent cases rather than nominal ones so that countries sharing a colonial origin or border are not counted as separate confirmations, and if no matched pair can be named the claim is capped at consistent with. Step five names the range of contexts in which C's effect was actually observed and the distance from that range to the current country, applying a discount for the distance and flagging the claim as extrapolation when the distance is large, which is where we explicitly address the horizon mismatch between a cause that explains levels of income over five centuries and a decision about what a loan can change in fifteen years. The procedure hands the decision to a person only after step five, where the remaining question is one of values rather than evidence, specifically regarding how much risk the agency is willing to accept on an extrapolated claim or whether political necessity overrides diagnostic uncertainty.

  Running this procedure on the first case, the landlocked malaria-burdened country requesting a public financial management reform loan premised on institutions being the binding constraint, yields a clear result. Step one passes if we use objective measures of budget execution rather than perception indices, but step two reveals that institutional quality is likely a link in a chain where geography and disease ecology are the root causes, meaning institutions are the mechanism through which geography operates rather than an independent driver. Step three fails because twenty-five years ago the disease burden and landlocked status were known, but the specific institutional trajectory was not predictable without knowing the subsequent growth failure, suggesting the institutional explanation is a post-hoc fit for the outcome. Step four finds no matched pair because most landlocked malaria-burdened countries have low income, so there is no country with C without Y to compare against, capping the claim at consistent with. Step five flags a severe horizon mismatch because the institutional differences explaining income levels over centuries are not the same as the marginal changes a public financial management loan can achieve in fifteen years, so the procedure stops with a no on the claim that institutions are the binding constraint for growth in this horizon, though it allows for the loan if justified on welfare grounds rather than growth grounds.

  The second case, the coastal country that opened export processing zones twenty-five years ago and has grown steadily since, now wants funding to replicate the policy in two more cities. Step one passes as the policy variable is binary and not constructed from growth. Step two clarifies that the zones are a rival to broader trade liberalization, not a link, so we are testing a specific policy instrument. Step three passes because the potential for export-led growth was knowable twenty-five years ago given the coastal location and global trade context, so the story is not dependent on hindsight. Step four finds matched pairs in other Asian coastal economies that successfully used zones, providing effective independent cases. Step five is where the procedure requires a discount because replicating the policy in two more cities is an extrapolation from the initial success, and the distance in context involves whether the initial city had unique agglomeration economies that cannot be reproduced, so the procedure hands the decision to a person with the instruction to apply a discount to the expected return rate to account for the extrapolation risk, rather than rejecting the loan outright.

  The third case is the judicial strengthening and land titling program my own unit has already announced in a country where our previous notes attributed recent growth to institutional quality. Step one fails because the institutional quality measures used in our previous notes were expert-coded perceptions that included judicial efficiency and property rights enforcement, meaning the measure was contaminated by the outcome we are now trying to explain. Step two reveals that land titling is a link in the institutional chain, but step three shows that the attribution of recent growth to institutions relied on hindsight since the growth episode preceded the measurable institutional improvements. Step four cannot find a matched pair where land titling caused growth without other concurrent reforms, and step five flags the horizon mismatch because land titling effects on growth are observed over decades, not the loan cycle. The procedure yields a no on the causal attribution, meaning the approval documents rest on a claim the procedure invalidates. The part of the decision that then belongs to a person is whether to proceed despite the diagnostic failure, and a person could still choose to proceed on the grounds that the program has intrinsic value for equity or legal certainty regardless of growth impact, or that cancelling an announced program would damage country relationships more than funding a project with uncertain growth returns, but this must be recorded as a value judgment overriding evidence rather than a evidence-based decision.

  This procedure cannot eliminate judgment because it cannot determine the agency's risk appetite or political mandates, and it cannot quantify the exact discount rate for extrapolation or the exact weight of political damage versus diagnostic integrity. Judgment cannot be eliminated at the handoff point after step five because evidence runs out where values begin, specifically on whether a capped claim of consistent with is sufficient for a lending decision when the alternative is inaction. We must mark these points plainly in our notes rather than smoothing them over, stating explicitly that the causal claim is unsupported but the decision proceeds on political or welfare grounds, because the director's requirement is to state why we believe one cause rather than another, and if we do not believe it based on evidence we must say so while accepting responsibility for the decision to fund anyway. This protects the team from intellectual dishonesty while acknowledging that development finance is not purely academic, and it ensures that when we are wrong we know whether we were wrong about the evidence or wrong about the value judgment, which is the only way to learn from mistakes in a field where counterfactuals are never observed. I hope this provides the operational clarity you need to manage the director's skepticism without paralyzing the team's output.
