      *   *Refinement on Case 9:* The user worries about "groups vs persons." The principle should emphasize *relevant characteristics* vs *protected proxies*. If "communication clarity" measures accent rather than competence, it's a validity issue (a), regardless of group stats.
      *   *Refinement on Case 5:* The user admits tension ("best proxy we have"). The principle needs to acknowledge that sometimes (b) is unavoidable, requiring human oversight, not just rejection.

  5.  **Address the "Torn" Case (Care-Management Program):**
