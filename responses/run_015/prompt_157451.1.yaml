answer: |-
  Based on the track record you provided, your cousin isn't running a consistent rule about *numbers* (headcount) or even *method* (online vs. in-person). She is running a rule about **Sovereignty vs. Intermediaries.**

  Here is the breakdown of her logic, the prediction for the new experiment, and the scenario that proves it.

  ### 1. The Diagnosis: What Rule Is She Running?
  She is applying a **"No Veto" Test.**

  Look at her "No" answers:
  *   **2016 Election:** The people voted, but the **Electoral College** (an intermediary) flipped it. -> *Not Will.*
  *   **Online Survey:** People voted, but the mechanism was **cheap/unverified** (low barrier intermediary). -> *Not Will.*
  *   **CA Marriage Prop:** People voted, but the **Courts** (an intermediary) struck it down. -> *Not Will.*

  Look at her "Yes" answers:
  *   **Brexit:** People voted, result was **binding**. -> *Will.*
  *   **Town Meeting:** 30 people voted, result was **final** (no mayor veto mentioned). -> *Will.*
  *   **2020 Election:** She ignores the Electoral College and points to the **raw total** (no intermediary filter). -> *Will.*

  **The Rule:** "The Will of the People" only exists when the expression of preference is **final** and cannot be overruled by an elite layer (courts, electors, councils, or algorithms).

  ### 2. Will She Call the New Experiment "The Will"?
  **Prediction: No.**

  Even though this experiment fixes the "clicking is cheap" problem (random selection + weekend deliberation is high cost/high effort) and fixes the "small unrepresentative group" problem (random sortition), it fails her Sovereignty Test.

  Because the City Council retains the **veto power**, this body is advisory, not sovereign. To your cousin, this is functionally identical to the CA Marriage Prop: the people decided, but the politicians can still say "no." If politicians can veto it, it isn't *their* will; it's just *their suggestion.*

  ### 3. Which Rule Do I Bet On?
  I am betting on the **Finality/Veto Rule** over the **Physical Presence Rule.**

  You might think she values physical presence because she liked the 30-person town meeting. But that town meeting likely had the power to just *do* the thing (common in small New England-style towns). The CA Prop example is the tiebreaker: people physically went to booths and voted (high cost/presence), but because the Courts overruled it, she dismissed it.

  Therefore, **Finality trumps Presence.**

  ### 4. The Split Scenario (The Stress Test)
  To prove this is her actual rule, you need a scenario that separates **Physical Deliberation** from **Political Veto.**

  **The Scenario:**
  > "Imagine a 'People's Tribunal' where 500 residents are flown to the capital, housed in a hotel for a week, briefed by experts, and debate a law physically in a chamber. They vote 90% in favor. However, the Governor must still sign it for it to become law."

  **Why this splits the rules:**
  *   **If she values Presence/Deliberation:** She has to say this **IS** the will. It's the ultimate version of her town meeting (physical, costly, informed).
  *   **If she values Finality (The Veto Rule):** She has to say this **IS NOT** the will. It's just a fancy focus group because the Governor can kill it.

  **My bet:** She will say **IS NOT**. If she does, you know for a fact she doesn't care about "the people" gathering; she cares about "the people" winning.
