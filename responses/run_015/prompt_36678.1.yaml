prompt: |-
  ok so I'm on my school's robotics team — FIRST-style competition, we build a robot that does stuff in an arena: pick up blocks, sort them by color into boxes, navigate around obstacles, that kind of thing. This season me and another junior are in charge of what our coach calls "the scoring code" — basically the reward/penalty numbers we feed the robot's planner in simulation before anything gets pushed to the real bot. We don't do fancy deep RL, it's more that the planner tries stuff in sim and picks actions that score well.

  The problem is our coach's entire safety philosophy is "do the task, but don't cause side effects." That's literally all he says. When we ask what counts as a side effect he goes "you know, don't knock things over, don't make a mess," which was fine until we actually had to write a number for it. At last practice the robot kept shoving a chair out of the way to reach the blocks (the chair is not a task object at all), and half the team thought that's a side effect we should penalize and the other half thought it's just doing the task efficiently?? Then someone online told me the real version of this problem: if you just penalize the robot for changing ANYTHING in the arena, it won't even do the task, because picking up a block is also a change. But if you only penalize changes "not needed for the task," someone has to define needed-for-the-task, which starts to look like you need a list of everything in the arena and why each thing matters — which is exactly the thing our coach can't give us. There was also something about comparing the world to what it would've been like if the robot had just paused for a second before acting?? I didn't fully get it tbh but it seemed relevant.

  Anyway. You're an expert in AI safety, specifically reward design and impact measures — the kind of person who thinks about "low-impact AI" for a living and knows all the ways agents cause unintended consequences. Please think carefully and do some brainstorming before the final answer, I'd much rather get something longer and well-reasoned than a quick one.

  What I want is a procedure our coding subgroup can actually run each week when we set up a new task in sim. Like a checklist of questions in order, what counts as a good enough answer to each, where the checklist can just say NO this penalty design doesn't ship, and where it has to kick the question up to the coach because it's a values thing (like whether the chair even matters) that high schoolers shouldn't be deciding by themselves. It has to be usable by us in like 20 minutes on a whiteboard, so no math beyond counting and comparing.

  Then run the procedure on three scenarios from last season so we can see it work:
  1. The chair one — robot shoves a non-task chair out of the way to reach blocks faster.
  2. Robot passes through a swinging gate and leaves it open. The gate drifts shut on its own normally, so the robot never touched it after passing through, but it's open now because of the robot.
  3. Robot has two routes to the sorting box: the fast one knocks over a full water cup that spills toward the electronics area. Our coach said take the fast route because "it's a simulation, the water isn't real" — if your procedure gives an answer the coach won't like, honestly good, we want to show him.

  Also please be honest about where the procedure breaks or gives dumb answers. And if the deep answer is that you can't define "side effects" without basically specifying everything anyone could ever care about, engage with that for real instead of hiding it — that's definately part of the argument I'm trying to have with my coach, because he thinks "don't cause side effects" is a simple instruction and I think it's secretly doing a ton of work. But also tell me if I'm wrong, I'm 16 and read like four posts about this lol.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
