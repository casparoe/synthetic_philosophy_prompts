      *   **Role:** Co-lead of "scoring code" (reward function design for a planner in simulation).
      *   **Problem:** The coach's safety instruction ("don't cause side effects") is too vague to implement as a numerical penalty. The team is divided on specific cases (moving a chair, leaving a gate open, spilling water in sim).
      *   **Goal:** A practical, 20-minute whiteboard procedure/checklist for the coding subgroup to evaluate reward/penalty designs weekly. It needs to flag when a decision is a "values" question (kick up to coach) vs. a technical one. It needs to be tested on three specific scenarios.
      *   **Tone/Style:** Expert in AI safety (reward design, impact measures), but accessible to a smart high schooler. Honest about limitations (the "definition of side effects" problem). No heavy math (counting/comparing only).
      *   **Key Insight:** The user suspects that "don't cause side effects" is secretly complex (the "specification problem" in AI safety). They want validation but also a practical tool.

  2.  **Deconstruct the AI Safety Concepts:**
      *   **Impact Measures:** The user mentioned "comparing the world to what it would've been like if the robot had just paused." This refers to *Relative Reachability* or *Attainable Utility Preservation* or simple *State Difference* penalties.
      *   **The "Side Effect" Problem:** Distinguishing between *task-relevant changes* (moving a block to the goal) and *task-irrelevant changes* (knocking over a cup).
      *   **The "Definition" Problem:** You can't penalize *all* change, or the robot does nothing (the "what you measure is what you get" problem).
      *   **Practical Implementation:** Since they aren't doing deep RL but rather a planner scoring actions in sim, they can run counterfactuals (simulate "doing nothing" or "doing the task minimally").

  3.  **Develop the Procedure (The "Whiteboard Checklist"):**
      *   *Constraint:* Must take ~20 mins, no heavy math.
      *   *Structure:* Needs to flow from Task Definition -> Change Detection -> Valuation -> Decision.
      *   *Step 1: Define the "Task State".* What *must* change for the task to be complete? (e.g., Block in Box).
      *   *Step 2: Define the "Baseline".* What happens if the robot does nothing (or just waits)? This addresses the user's intuition about "pausing."
      *   *Step 3: Identify "Collateral Changes".* What else changed compared to the Baseline?
      *   *Step 4: The "Reversibility/Permanence" Check.* Can it fix itself? (Gate example).
      *   *Step 5: The "Values Flag".* If a collateral change is permanent or affects safety/equipment, kick to coach.
      *   *Decision Rule:* If Collateral Change > Threshold AND Reversibility = Low -> Penalty. If Ambiguous -> Coach.

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   *Initial thought:* Use a formula like $Reward = TaskScore - \lambda \times Impact$.
      *   *Correction:* User said "no math beyond counting and comparing." Keep it qualitative/checkbox style.
      *   *Refinement:* Call it the "Side-Effect Stress Test."
      *   *Key Question:* "Did the world end up different than if we waited?" (Counterfactual).
      *   *Key Question:* "Was that difference required to get the points?" (Necessity).
      *   *Key Question:* "Does it stay broken?" (Permanence).

  5.  **Running the Scenarios:**
      *   **Scenario 1 (The Chair):**
          *   Task: Move Block.
          *   Baseline: Block stays, Chair stays.
          *   Action: Block moves, Chair moves.
          *   Necessity: Was moving chair *required*? Maybe there was another path. If yes -> Penalty. If no path -> Values Flag (is blocking allowed?).
          *   *Verdict:* Likely a penalty if alternative exists. If no alternative, it's a "Values Flag" (is the chair an obstacle or a protected object?).
      *   **Scenario 2 (The Gate):**
          *   Task: Pass through.
          *   Baseline: Gate swings shut eventually.
          *   Action: Gate is open now, but will close.
          *   Reversibility: High (self-closing).
          *   *Verdict:* Low penalty or no penalty. It's a transient state change.
      *   **Scenario 3 (The Water Cup):**
          *   Task: Sort blocks.
          *   Baseline: Cup stays full.
          *   Action: Cup spills.
          *   Reversibility: Low (water doesn't un-spill).
          *   Safety: High (electronics).
          *   Coach's view: "It's sim."
          *   *Safety View:* Sim habits transfer to real life. This is a "Values Flag" or hard "NO".
          *   *Verdict:* This is the crux. The procedure should flag this as "Unsafe Habit" even if sim physics don't care.

  6.  **Addressing the Philosophical Core:**
      *   The user is right: "Don't cause side effects" is ill-defined without an ontology of value.
      *   I need to validate this without discouraging them.
      *   Explain *why* it's hard (the "ontology" problem).
      *   Explain *why* the procedure helps (it forces the ambiguity into the open).
      *   Acknowledge where it breaks (novel objects, unseen interactions).

  7.  **Final Review against Constraints:**
      *   20 mins? Yes, checklist is short.
      *   No heavy math? Yes.
      *   Honest about limitations? Yes.
      *   Tone? Respectful of their intelligence (16yo robotics is smart), expert but mentorship-oriented.

  8.  **Constructing the Output:**
      *   **Intro:** Validate their insight (you're spotting a real AI safety problem).
      *   **The Procedure:** "The 5-Step Side-Effect Stress Test."
