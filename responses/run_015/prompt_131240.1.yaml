answer: |-
  This is a classic problem in the micro-politics of voluntary associations, and you are right to sense that simply calling him a "liar" or a "hypocrite" misses the structure of what he is doing. He isn't just breaking the rules; he is playing a different game with a different rulebook. He is operating on a competing theory of what the association *is*.

  Here is the brainstorming process you asked for, followed by the carving of the concept.

  ### The Brainstorm: Three Near-Misses

  **1. Populism (The "Moral Monopoly")**
  *   **The Fit:** This is the closest established concept. Political theorists like Jan-Werner Müller define populism not by policy (left or right), but by a specific claim: "Only I represent the *real* people." When your committee member says the voters who defeated him aren't the "real association," that is a textbook populist move. He is dividing the group into the "authentic" members (founders, old-timers) and the "illegitimate" others (newcomers, sporadic attendees).
  *   **What's Wrong With It:** Populism is usually a macro-political term describing a struggle against an *elite* or an *establishment*. In your association, he *is* part of the establishment (the committee). Also, populism usually relies on a "silent majority." In Episode 1, he didn't just claim a silent majority; he claimed he could retroactively change the nature of the desire itself ("You didn't change your mind, you understood what you wanted"). Populism explains the exclusion (Episode 2) well, but it's too blunt to explain the psychological alchemy of Episode 1.

  **2. Rousseau's "General Will"**
  *   **The Fit:** You mentioned Rousseau, and your instinct is sharp. Rousseau distinguished between the "Will of All" (what people vote for when asked) and the "General Will" (what people *would* want if they understood the common good). Your committee member is doing exactly this in Episode 1. He is arguing that the survey results were just the "Will of All" (confused, superficial), and the lawsuit is the "General Will" (true, latent desire).
  *   **What's Wrong With It:** For Rousseau, the General Will is always *right* and oriented toward the *common good*. Your guy isn't arguing that the lawsuit is morally better or safer for the finances; he is arguing it is more *authentic*. He isn't claiming to be a guardian of the *good*, but a medium for the *real*. Also, Rousseau's theory doesn't easily accommodate Episode 2, where he excludes people based on tenure rather than their capacity for reason.

  **3. Gaslighting / Epistemic Manipulation**
  *   **The Fit:** This captures the psychological effect on the members. Telling someone "You haven't changed your mind, you've finally understood what you always wanted" is a way of destabilizing their trust in their own judgment. It makes them dependent on him to interpret their own internal states.
  *   **What's Wrong With It:** This is a psychological label, not a political one. It implies malicious intent or pathology. You noted that he seems *principled*. He likely believes he is serving the association. Calling it gaslighting dismisses the fact that he has constructed a coherent (albeit dangerous) political logic. It explains the *effect*, but not the *mechanism*.

  ### One Phenomenon or Two?

  These are **one phenomenon**.

  Here is why: Democracy relies on two things: a **Body** (who counts as a member?) and a **Voice** (what do they want?). Usually, we determine these procedurally: if you pay dues, you're in the Body; if you vote, that's the Voice.

  Your committee member is rejecting procedure in favor of **essence**.
  *   In Episode 1, he redefines the **Voice**. (The real voice isn't what you said, it's what I say you meant).
  *   In Episode 2, he redefines the **Body**. (The real body isn't who paid dues, it's who has the right history).

  He is claiming that the *truth* of the association exists prior to and above the *rules* of the association. He isn't trying to win the game; he is claiming the authority to judge which moves count as part of the game.

  ### The Concept: Constitutive Ventriloquism

  Since no single established term captures the combination of sincerity, exclusion, and retroactive will-formation in a micro-political setting, I will coin a term for you. Let's call this **Constitutive Ventriloquism**.

  **The Definition:**
  Constitutive Ventriloquism is a political move where an actor claims to speak *for* a group in a way that simultaneously defines *who belongs* to the group and *what the group truly wants*, rendering actual procedures (votes, surveys) secondary to the actor's interpretation of the group's "essence."

  It is "Ventriloquism" because the actor speaks, but claims the voice belongs to the group (the dummy). It is "Constitutive" because the act of speaking actually *creates* the reality of who the group is.

  **The Carving (What it is, What it isn't, Where the edges are):**

  1.  **It is not Paternalism.**
      *   *Paternalism* says: "I know what is **good** for you, even if you don't want it." (e.g., "We can't fix the roof because it's fiscally irresponsible.")
      *   *Constitutive Ventriloquism* says: "I know what **you** want, even if you think you want something else." (e.g., "You say you want the roof, but you *really* want the lawsuit.")
      *   *The Edge:* If he argued the lawsuit was better for property values, he'd be a paternalist. Because he argues the members *desire* it more, he is a ventriloquist.

  2.  **It is not simple Lying.**
      *   *Lying* acknowledges the truth exists but hides it.
      *   *Constitutive Ventriloquism* claims to reveal a *deeper* truth that makes the surface truth irrelevant.
      *   *The Edge:* If he secretly owned a law firm and wanted the contract, that's corruption. If he believes the "spirit" of the neighborhood demands the lawsuit, that's Constitutive Ventriloquism. The sincerity is what makes it robust.

  3.  **It is not standard Representation.**
      *   *Representation* says: "I am authorized to speak for you because you voted for me."
      *   *Constitutive Ventriloquism* says: "I am authorized to speak for you because I understand what you *are*."
      *   *The Edge:* A standard rep loses a vote and says, "I'll try again next year." A constitutive ventriloquist loses a vote and says, "This vote doesn't reflect who we are."

  **The Boundary Case (To help you see the limit):**
  Imagine a committee member who says: "I know many of you are worried about the roof, but I truly believe the bus depot lawsuit is the moral thing to do, so I will vote for it even if I lose."
  *   This is **Conscience**.
  *   It falls *outside* Constitutive Ventriloquism because he is claiming the stance as his *own*, not projecting it onto the members. He isn't telling the members *they* want it; he is saying *he* wants it.
  *   Your guy crosses the line because he refuses to let the desire remain his own; he insists it is *theirs*, and he insists the voters who disagree are *not theirs*.

  ### Why this matters for you as Secretary

  You are the guardian of the **Procedure** (minutes, votes, surveys). He is the guardian of the **Essence** (history, spirit, true will).

  In a healthy association, Procedure constrains Essence. (We might *feel* like suing the county, but the *vote* said fix the roof).
  In his view, Essence constrains Procedure. (The *vote* said sue the county, because that's who we *are*; the survey was a mistake).

  He is not necessarily a bad actor, but he is operating a **veto on reality**. As long as he can convince the room that he has better access to the "Real Association" than the ballot box does, no vote is safe. The remedy isn't to prove he's lying (he believes he's telling the truth); it's to enforce the procedural boundary. "Mr. X, I understand you feel that represents the spirit of the founders, but the minutes record the vote of the current members as X." You have to be the boring bureaucrat to his exciting visionary. That is your role.
