      *   *Check:* Am I taking sides? *No, diagnosing structure.*

  9.  **Final Polish:** Ensure the distinction between "selecting on the dependent variable" and "aligning time series" is clear. (Aligning isn't always bias, but aligning *only* collapsed cases without controls is). Ensure the "US Forecast" issue is treated as a falsifiability problem.

  *(Self-Correction on "Selecting on the Dependent Variable"):* Strictly speaking, selecting on the dependent variable biases coefficient estimates in regression. In time-series alignment, it's more about *circularity* in pattern recognition. If you define the cycle by the crash, finding a ramp-up before the crash is tautological. I need to be precise here.

