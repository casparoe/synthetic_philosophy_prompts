  2.  **Deconstruct the Disagreement (The "Freeze"):**
      *   *Modellers:* Focus on $N$, patterns, regularities, forecasting utility. Theory = mechanism generating statistical signal. Success = out-of-sample prediction.
      *   *Historians:* Focus on $N=1$ (per case), context, mechanism specificity, narrative coherence. Theory = heuristic or post-hoc label. Success = explanatory depth/accuracy for specific cases.
      *   *The "US Forecast":* This is the flashpoint. Modellers see it as a risky test. Historians see it as unfalsifiable (vague "instability").

  3.  **Evaluate User's Hypothesis 1 (Prediction Definitions):**
      *   *Assessment:* This is accurate and widely recognized in philosophy of social science, but often unacknowledged in the room.
      *   *Nuance:* It's not just "prediction." It's *what* is being predicted. Modellers predict *risk levels* (hazard rates). Historians want *event timing/causation*.
      *   *Verdict:* This is a major fault line, but likely a symptom of the deeper methodological issue (Hypothesis 2).

  4.  **Evaluate User's Hypothesis 2 (Aligning on Crisis/Selection Bias):**
      *   *Assessment:* This is the technical heart of the matter. This is a specific statistical critique known as "superimposition" or "epoch folding."
      *   *The Critique:* If you align time series $t=0$ at the collapse, you *guarantee* a correlation between the pre-collapse trend and the collapse, unless you have a control group of polities that *didn't* collapse at $t=0$.
      *   *The Modeller Defense:* The theory predicts a *sequence* (elite overproduction $\to$ fiscal stress $\to$ collapse), not just a rise. If the sequence holds across cases with different absolute durations, the alignment is justified.
      *   *The Historian Counter:* The sequence is defined by the collapse. "Fiscal stress" is identified *because* the state collapsed.
      *   *Verdict:* This is the strongest technical objection. It touches on "selecting on the dependent variable."
