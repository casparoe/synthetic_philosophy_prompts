answer: |-
  First off, tell your friend you love them, but also tell them that four hours is the exact point where *Les Mis* stops being about justice and starts being about exhaustion. You are both right, and you are both wrong, and the reason you're stuck is that you are trying to map a secular, Enlightenment-era ethical binary onto a deeply theological, Romantic epic.

  Here is the breakdown of where your lens works, where it shatters, and the plain truth about whether you're forcing it.

  ### Where the Lens Illuminates: Javert
  Your friend is strongest here. Javert is indeed the avatar of **Retributivism**. For Javert, the Law is not a tool to create safety; it is a divine structure that must remain intact. If a man steals bread, he breaks the structure. The punishment is not about fixing the man or deterring others; it is about restoring the balance of the moral universe.

  This lens explains why Javert cannot accept Valjean's reformation. In a consequentialist view, a reformed criminal is a success story (zero future crime). In Javert's retributive view, a reformed criminal is a paradox. The past act *demands* a penalty. If the penalty is not paid, the universe is out of joint. This explains his relentless pursuit: it isn't personal; it's gravitational. He is simply fulfilling the equation.

  ### Where the Lens Breaks: The Bishop and Champmathieu
  This is where your skepticism is correct, and where your friend's "textbook" definition fails.

  **1. The Bishop (Myriel)**
  If the Bishop were a consequentialist, he would calculate the utility of the silver. *Will giving this to a convict help society? Will it stop crime?* He doesn't do that. He doesn't even lecture Valjean on social utility. He acts out of **Grace**.
  Grace is distinct from consequentialism. Consequentialism says, "Break the rule because the outcome is better." Grace says, "The rule is irrelevant compared to the soul." The Bishop isn't bending the rules to maximize good; he is operating on a plane where earthly rules (property law) do not apply to spiritual needs. Calling him a consequentialist secularizes a deeply religious act.

  **2. Valjean and Champmathieu**
  This is the smoking gun against the "Valjean = Consequentialist" theory.
  When Valjean stands up in the court to save Champmathieu, he is making the **anti-utilitarian** choice.
  *   **Consequentialist Math:** If Valjean stays silent, he remains Mayor Madeleine. He runs a factory, supports a town, cares for Fantine, raises Cosette, and donates to charity. Thousands benefit. If he confesses, he goes to prison, the factory might fail, Cosette is vulnerable, and an innocent man (Champmathieu) is saved (which is good, but one life vs. thousands). A strict utilitarian calculation suggests he should stay silent.
  *   **Valjean's Choice:** He confesses. Why? Not because it produces the "best outcome," but because he cannot bear to live a lie. This is closer to **Deontology** (duty-based ethics) or, again, **Theology**. He is prioritizing the integrity of his soul over the welfare of his community. He chooses truth over utility.

  ### Where the Lens Shatters: The Suicide
  You hit the nail on the head with Javert's death. This scene resists the Retributivism/Consequentialism binary entirely.

  If Javert were a pure retributivist, he would arrest Valjean. The law demands it.
  If he were a secret consequentialist, he would let Valjean go (since Valjean is good for society) and walk away.

  He does neither. He kills himself. Why?
  Because Valjean sparing him introduces a third variable: **Mercy.**
  Javert's worldview is binary: State vs. Criminal, Law vs. Chaos. He cannot compute "A Criminal who shows Mercy to the State." It breaks his operating system. He isn't dying because his moral math broke; he is dying because he realized that **Goodness can exist outside the Law.** For a man who believes the Law is the only source of Good, realizing the Law is not God is a fatal existential shock. It's not an ethical dilemma; it's a spiritual collapse.

  ### The "Magic Wipe" Thought Experiment
  Your thought experiment is excellent.
  *   **Javert:** Yes, he would still hunt Valjean. For Javert, the "record" isn't paper; it's the stain on the man's ontology. If Valjean was 24601, he is 24601, regardless of the magic wipe. The sin exists metaphysically.
  *   **The Bishop:** Yes, he would still say let him go. But not because "no one knows." He would say let him go because the man is no longer a thief in the eyes of God.

  However, the fact that you are unsure and your friend is sure suggests the binary is straining. The "Magic Wipe" removes social consequence. If Valjean is a consequentialist, and the wipe ensures zero negative social consequence, he *should* take the wipe. But Valjean spends the book punishing *himself*. He lives in fear of exposure even when he is safe. That is **Penance**, not ethics.

  ### The Plain Truth: Are you forcing it?
  **Yes.** You are both forcing a modern, secular ethical split onto a 19th-century Catholic Romantic novel.

  Hugo wasn't writing about Retributivism vs. Consequentialism. Those are largely post-Enlightenment, secular frameworks for organizing society. Hugo was writing about **The Law vs. Grace.**

  *   **The Law (Javert):** Rigid, blind, necessary but insufficient. It judges the act.
  *   **Grace (Valjean/Bishop):** Fluid, seeing, transformative. It judges the soul.

  In philosophy papers, these concepts are abstract. In *Les Mis*, they have bodies. They get hungry, they carry heavy beams, they get sick. The novel adds **suffering** to the debate.
  *   A philosophy paper asks: "Is it right to steal bread?"
  *   The novel asks: "Can you watch a child starve without stealing?"

  The book adds the **cost** of the philosophy.
  *   Retributivism costs Javert his life because it cannot bend.
  *   "Consequentialism" (if we call Valjean that) costs Valjean his happiness, his safety, and his peace, because he constantly chooses the hard right over the easy good.

  ### How to Make Up With Your Friend
  Tell your friend this:
  "You were right that Javert is retributive, and I was right that Valjean isn't a simple consequentialist. But we were both trying to solve an equation that Hugo didn't write. He wasn't writing about how to maximize utility or enforce desert. He was writing about how Love breaks the Law."

  Valjean turning himself in isn't about "good outcomes." It's about **Conscience.**
  Javert jumping in the river isn't about "failed punishment theory." It's about **Awe.**

  The book argues that neither Retributivism nor Consequentialism is enough to save a human being. You need something that looks like neither: you need Mercy.

  Go get a drink with your best friend. The fact that you can argue for four hours about the moral architecture of a convict and a policeman means you both understand the book better than most. Just admit that Hugo wins the argument, not either of you.
