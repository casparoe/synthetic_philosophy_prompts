prompt: |-
  I'm preparing a piece on why real-world voting systems so often get gamed, and I want the technical background to be exactly right. Compare the Gibbard–Satterthwaite theorem with Arrow's impossibility theorem. Both are impossibility results for collective choice, and both assume an unrestricted domain and an onto (surjective) rule, but they target different desiderata. Explain, precisely, how strategy-proofness — the property Gibbard and Satterthwaite single out — differs from Arrow's independence of irrelevant alternatives, and why that substitution shifts the conclusion from Arrow's claim that no rule can satisfy all of his axioms to the Gibbard–Satterthwaite claim that the only strategy-proof rules are dictatorial. On balance, which of the two results is the more serious obstacle to designing a voting system that is at once fair and resistant to strategic manipulation, and why?
