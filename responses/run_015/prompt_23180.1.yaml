answer: |-
  To ensure your piece rests on a rigorous technical foundation, it is essential to distinguish not only the axioms but the *objects* these theorems analyze. While often discussed together, Arrow's Impossibility Theorem and the Gibbard–Satterthwaite (GS) Theorem operate on different mathematical structures. Understanding this distinction clarifies why the shift from Independence of Irrelevant Alternatives (IIA) to Strategy-Proofness (SP) transforms a problem of social *coherence* into a problem of strategic *incentives*.

  ### 1. The Structural Distinction: Welfare vs. Choice

  The most precise starting point is the output of the voting rule in question.

  *   **Arrow's Theorem** concerns a **Social Welfare Function (SWF)**. It takes a profile of individual preference orderings and outputs a complete, transitive *social ordering* of all alternatives. It asks: "Can we rank society's preferences coherently?"
  *   **Gibbard–Satterthwaite** concerns a **Social Choice Function (SCF)**. It takes a profile of individual preference orderings and outputs a *single winner* (or alternative). It asks: "Can we pick a winner without inviting manipulation?"

  Both theorems assume an **Unrestricted Domain** (voters can hold any rational preference ordering) and a non-triviality condition (Arrow uses **Pareto Efficiency**; GS uses **Onto/Surjective**, meaning every candidate *can* win under some profile). Both require at least three alternatives ($|A| \ge 3$).

  ### 2. IIA vs. Strategy-Proofness: Consistency vs. Incentives

  The core of your comparison lies in the specific desideratum each theorem isolates.

  **Arrow's Independence of Irrelevant Alternatives (IIA)**
  IIA is a consistency condition on the aggregation mechanism. It states that the social ranking between any two alternatives, $x$ and $y$, must depend *only* on how individuals rank $x$ against $y$. It must not be influenced by how individuals rank a third "irrelevant" alternative $z$.
  *   *Technical implication:* IIA prevents the voting rule from using cardinal intensity or context-dependent comparisons. It ensures the social preference between $x$ and $y$ is robust to changes in the environment (the presence of $z$).
  *   *The Failure:* Arrow proves that if you demand IIA, Pareto, and Unrestricted Domain, the only way to generate a transitive social ordering is to let one individual (the Dictator) determine the entire ordering.

  **Gibbard–Satterthwaite Strategy-Proofness (SP)**
  SP is an incentive compatibility condition on the agents. A rule is strategy-proof if no voter can ever obtain a more preferred outcome by misrepresenting their true preferences, regardless of how others vote. Truth-telling is a dominant strategy.
  *   *Technical implication:* SP requires that the mechanism be immune to "gaming." If a voter prefers $x$ over $y$, they should never be able to make $y$ win by claiming they prefer $y$ over $x$.
  *   *The Failure:* GS proves that if you demand SP, Onto, and Unrestricted Domain, the only rule that satisfies these is a Dictatorship (where the outcome is always the top choice of a specific fixed voter).

  ### 3. Why the Substitution Shifts the Conclusion

  You asked why substituting SP for IIA shifts the conclusion from Arrow's "no rule exists" to GS's "only dictatorial rules exist." Logically, these conclusions are equivalent (proving "no non-dictatorial rule exists" is the same as proving "only dictatorial rules exist"). However, the *conceptual* shift is profound because **SP essentially implies IIA in the context of single-winner selection.**

  This is the technical bridge often missed in non-specialist accounts:
  1.  **Monotonicity:** If a voting rule is Strategy-Proof, it must satisfy a property called *strong monotonicity*. If candidate $x$ wins, and a voter moves $x$ up in their ranking (without changing the relative order of other candidates), $x$ must still win.
  2.  **The Link to IIA:** This monotonicity restricts the rule so severely that it effectively behaves as if it satisfies IIA. If the rule were sensitive to "irrelevant" alternatives (e.g., the presence of a spoiler $z$ changes the winner between $x$ and $y$), a voter could exploit that sensitivity to manipulate the outcome.
  3.  **The Derivation:** In fact, the standard proof of the Gibbard–Satterthwaite theorem often *uses* Arrow's Theorem. One constructs a Social Welfare Function derived from the Social Choice Function. If the SCF is Strategy-Proof, the induced SWF satisfies Arrow's conditions (including IIA). Since Arrow proves the SWF must be dictatorial, the SCF must also be dictatorial.

  **The Shift:**
  *   **Arrow** tells us that **collective rationality** is impossible. We cannot aggregate preferences into a coherent "will of the people" without deferring to a dictator.
  *   **Gibbard–Satterthwaite** tells us that **truthful revelation** is impossible. We cannot design a mechanism where voters simply report their true desires without deferring to a dictator.

  By swapping IIA for SP, the focus moves from the *output's coherence* (is the social ranking logical?) to the *input's honesty* (will voters lie?). The conclusion shifts from "We can't define a social preference" to "We can't run an election without strategic voting."

  ### 4. Which is the More Serious Obstacle?

  For a piece focused on why voting systems get **gamed**, the **Gibbard–Satterthwaite Theorem is the more serious and direct obstacle.**

  **Reasoning:**
  1.  **Practical Relevance:** Real-world elections select winners (SCF), not complete social rankings (SWF). While Arrow's theorem suggests the "will of the people" is incoherent, a society can still function if it merely picks a leader. However, if that selection process is vulnerable to manipulation (as GS proves), the legitimacy of the specific winner is directly undermined by tactical voting (e.g., "lesser-of-two-evils" voting).
  2.  **Inevitability of Manipulation:** Arrow's theorem can be circumvented in practice by relaxing the requirement for a full transitive ranking (e.g., using a tournament method that allows cycles). GS offers no such escape for single-winner elections. It states that *any* non-dictatorial method (Plurality, Borda, Ranked Choice, etc.) is manipulable *in some scenario*.
  3.  **The "Gaming" Mechanism:** Arrow explains *why* paradoxes occur (cyclical majorities); GS explains *how* actors exploit them. GS provides the game-theoretic justification for why voters do not vote sincerely. It transforms the voting booth from a place of expression into a strategic arena.

  **Nuance for your piece:**
  While GS is the more immediate obstacle to *resistance*, Arrow is the deeper obstacle to *fairness*. GS relies on the structure exposed by Arrow. You might frame it this way: **Arrow's Theorem proves that a perfect mirror of the public will cannot exist; Gibbard–Satterthwaite proves that because it cannot exist, voters are forced to shatter the mirror themselves through strategic lying.**

  ### Summary for Your Background Section
  *   **Common Ground:** Both assume Unrestricted Domain and $\ge 3$ alternatives. Both conclude that Dictatorship is the only escape from impossibility.
  *   **Key Difference:** Arrow analyzes Social *Welfare* (Rankings) using *Independence of Irrelevant Alternatives* (Consistency). GS analyzes Social *Choice* (Winners) using *Strategy-Proofness* (Incentives).
  *   **Technical Link:** Strategy-Proofness implies a form of IIA (Monotonicity). GS is often proved by reducing it to Arrow's conditions.
  *   **Verdict:** For a piece on gaming, GS is the primary citation. It formally establishes that strategic manipulation is not a bug of specific systems (like Plurality), but an inherent feature of *all* non-dictatorial voting systems.
