      *   *Crucial Nuance:* Arrow's theorem is about aggregating preferences into a *social ordering*. GS is about aggregating preferences into a *single winner*. This is a fundamental structural difference, not just an axiom swap. I need to make sure I don't conflate Social Welfare Functions (SWF) with Social Choice Functions (SCF).

