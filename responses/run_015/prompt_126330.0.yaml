answer: |-
  ### Pre-Computation Brainstorm

  **Concrete 20th-Century Branching Point:**
  The **April 1917 return of Vladimir Lenin to Petrograd**.
  *   *Scenario A (Actual):* Germany facilitates Lenin's transit in a sealed train. Lenin arrives, issues the "April Theses," radicalizes the Bolsheviks against the Provisional Government, and seizes power in October. This leads to the USSR, the Comintern, the Cold War, and the specific trajectory of 20th-century decolonization.
  *   *Scenario B (Counterfactual):* Lenin is intercepted or dies in exile. The Bolsheviks remain a fractured minority within the broader socialist movement. The Provisional Government might collapse into a military dictatorship (e.g., Kornilov) or a moderate socialist coalition.
  *   *Significance:* This is a test of whether a single agent's presence (a micro-perturbation) could alter the macro-structure of the global order, or whether Russia's structural pressures (war exhaustion, land hunger) would have produced a similar authoritarian outcome regardless of the Bolshevik label.

  **Strong vs. Weak Path Dependence:**
  *   **Strong Path Dependence:** Initial conditions are amplified over time through increasing returns (e.g., network effects, institutional sunk costs). Small differences lead to divergent, irreversible outcomes. The system does not forget its history; the specific trajectory determines the final state (e.g., the QWERTY keyboard layout).
  *   **Weak Path Dependence:** The system experiences noise and temporary deviations, but structural forces (gravity) pull it toward a stable attractor. Initial conditions affect the *timing* or *texture* of the outcome, but not the final equilibrium. History is contingent in the short run but convergent in the long run (e.g., a ball rolling down a bumpy hill still ends up at the bottom).

  ***

  ### The Contracting Horizon: History as Non-Ergodic Lock-In

  The question of whether history is governed by inevitability or contingency is often framed as a battle between structural determinism and the "great man" theory. However, this dichotomy obscures the deeper mathematical topology of historical time. To understand whether liberal democracy and industrial capitalism were inevitable destinations or contingent accidents, we must abandon the model of history as a Markov process—where the future depends only on the present state with fixed transition probabilities—and instead view history as a **non-ergodic sampling process**.

  In a Markovian view, history possesses fixed absorbing states; if you replay the tape enough times, the system converges on a predictable distribution of outcomes. In a non-ergodic view, the available state-space contracts over time. Every decision prunes the branching tree of future possibilities. Once a branch is cut, it cannot be regrown. Under this framework, I argue that **strong path dependence is real and normatively consequential.** The macro-outcomes of the modern era are not the result of convergent structural pressures finding a natural equilibrium, but rather the result of early institutional crystallizations that locked humanity into a specific, narrow corridor of possibility. The illusion of convergence is merely survivorship bias masking the graves of alternative futures.

  #### The Non-Ergodic Framework

  To claim history is non-ergodic is to assert that the time average of a single historical trajectory does not equal the ensemble average of all possible histories. We inhabit one sample path. In a system with strong path dependence, the "state-space"—the set of viable political and economic configurations—shrinks as complexity increases.

  Consider the difference between building a trail in a virgin forest versus widening a highway. The first pathfinders choose a route based on contingent factors (a fallen tree, a patch of mud). Once the path is trodden, it becomes easier to walk than the surrounding brush. Subsequent travelers follow it not because it is the optimal route, but because the switching costs of blazing a new trail are too high. Eventually, the path is paved. To divert the road now requires demolishing the infrastructure built upon the initial contingent choice.

  This is the mechanism of institutional lock-in. Institutions generate increasing returns: the more people use a legal system, a currency, or a bureaucratic norm, the more valuable and entrenched it becomes. This creates a ratchet effect. History does not oscillate around a mean; it accumulates momentum in the direction of early perturbations.

  #### Industrial Capitalism: Energy vs. Institution

  Proponents of convergence argue that industrial capitalism was inevitable due to deep structural pressures: the energy density of fossil fuels, the logic of technological efficiency, and the necessity of scale. They argue that any society discovering coal and steam would inevitably converge on factory production and market exchange. This is the argument for weak path dependence: the "attractor" of industrial efficiency pulls all societies toward capitalism.

  However, this confuses *industrialization* with *liberal market capitalism*. The extraction of energy is a physical constraint, but the institutional organization of that energy is a historical choice. The specific form of globalized, financialized capitalism dominant today relies on a specific architecture of property rights, corporate personhood, and international trade law that emerged from contingent European conflicts.

  If we replayed the 19th century, industrialization might well have occurred (structural pressure), but it could have easily locked into a state-command model globally, rather than a market-based one. The success of the British model was not due to its inherent superiority over, say, French mercantilism or Chinese statecraft, but due to the specific geopolitical outcomes of the Napoleonic Wars and the subsequent *Pax Britannica*. Once the British institutional model was exported via empire and enforced by naval power, it created a global network effect. Switching costs for late-developing nations became prohibitive. The state-space contracted: to participate in the global economy, nations had to adopt the incumbent rules. This is not convergence; it is lock-in.

  #### Liberal Democracy: The Fragile Peak

  The case for liberal democracy is often treated as the ultimate attractor of modernization theory—the idea that as nations grow wealthy and educated, they naturally become democratic. This assumes weak path dependence: demographics and information costs smooth the road to freedom.

  Yet, the non-ergodic view reveals the fragility of this outcome. Liberal democracy is not a default state; it is a high-energy equilibrium that requires specific institutional maintenance. The emergence of liberal democracy in the West depended on contingent branching points, such as the outcome of World War II. Had the Axis powers achieved a stalemate rather than total defeat, the global state-space would have contracted around authoritarian corporatism or fascism as viable, stable models.

  Furthermore, the specific *liberal* component (individual rights, rule of law) is distinct from the *democratic* component (mass participation). History shows many examples of industrialized societies achieving mass participation without liberalism (populist authoritarianism) or liberalism without mass participation (19th-century propertied republics). The fusion of the two in the late 20th century was not a structural necessity but a contingent achievement secured by the specific ideological victory of the Atlantic Alliance during the Cold War. The "end of history" was not the discovery of a universal truth, but the temporary dominance of one sample path over others. As state-space contracts, the cost of switching to an alternative governance model increases, making the current order feel inevitable even if it rests on shaky foundational choices.

  #### The Verdict: Strong Path Dependence is Real

  We must reject the comforting notion that humanity is sliding inevitably toward progress via structural convergence. The evidence supports **strong path dependence**.

  The argument for convergence relies on the assumption that structural pressures (technology, demographics) operate independently of institutional history. They do not. Technology is developed within institutional frameworks that shape its application. Demographics are managed by policies that reflect prior political choices. The "pressures" themselves are path-dependent.

  If history were ergodic, we would expect to see multiple independent inventions of liberal democratic capitalism stabilizing across different civilizations without contact. We do not. We see one center of innovation (Northwest Europe) exporting its model through coercion and imitation, closing off alternative developmental paths. The fact that today's developing nations adopt Western institutions is not proof of their optimality, but proof of the high switching costs imposed by the existing global order.

  This verdict is normatively consequential. If history is locked in by strong path dependence, then the current global order is not "natural" or "final." It is a artifact of specific past contingencies that could have been otherwise. This means the state-space, while contracted, is not closed. However, it also means that change is not a matter of waiting for structural pressures to align. Because of increasing returns and institutional inertia, shifting to a different trajectory requires overcoming massive sunk costs.

  History is not a river flowing to the sea; it is a labyrinth where walls are built behind you as you walk. The macro-outcomes of liberal democracy and industrial capitalism are not the destination of all roads, but the specific room we happen to have locked ourselves into. Recognizing this lock-in is the first step toward understanding that maintaining these systems requires active effort, not passive reliance on inevitability. The future is not a convergence; it is a continuation of the past's constraints, unless we possess the will to break the lock.
