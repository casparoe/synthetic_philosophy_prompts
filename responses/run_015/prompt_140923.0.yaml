  # The Practical Reasons Diagnostic Tree

  **Instructions:** Start at **Question 1**. Answer based on your intuition about the case described. Follow the arrow to the next question or to a named position. Do not worry about philosophical labels; just answer the concrete question. At the end, you will find a list of "Empty Seats" (combinations nobody defends) and "Blind Spots" (positions this tree cannot separate).

  ---

  ### Q1: The Marla Case (Future Indifference)
  Marla cares absolutely nothing about her own welfare past next Tuesday. She has no desire to save money for her future self, and no amount of arguing will make her care. **Does Marla have a reason to save money for next Wednesday?**

  *   **No:** (Reasons require some link to what the agent cares about). → **Go to Q2**.
  *   **Yes:** (Reasons can exist even if the agent doesn't care). → **Go to Q6**.

  ---

  ### Q2: The Drugged Case (Non-Rational Route)
  Consider a person who has no motivation to do X. The *only* way to make them do X is to drug them or hypnotise them; rational argument will not work. **Do they have a reason to do X?**

  *   **Yes:** (Motivation is enough; the route doesn't matter). → **Position: Loose Humean / Desire-Based View**.
  *   **No:** (The route to motivation must be rational). → **Go to Q3**.

  ---

  ### Q3: The Ignorant Case (True Facts)
  An agent lacks motivation to do X. However, if they learned a **true fact** they currently don't know (e.g., "this glass contains petrol, not gin"), they would immediately be motivated to do X. **Do they have the reason to do X *now*, before they know the fact?**

  *   **No:** (Reasons depend on actual, current psychology). → **Empty Seat A**.
  *   **Yes:** (Reasons survive simple ignorance). → **Go to Q4**.

  ---

  ### Q4: The Bare Capacity Case (Guilt)
  An agent has no existing motivation to do X. However, they have a **bare capacity** to acquire one (e.g., they are capable of feeling guilt if they reflect). **Is this capacity enough to say they have a reason?**

  *   **No:** (Without a current motivational hook, talk of "reasons" is just bluff or advice). → **Position: Error Theory / The Bluff View**.
  *   **Yes:** (A sound deliberative route from capacity counts). → **Go to Q5**.

  ---

  ### Q5: The Egoist Case (Internal Truth)
  A thoroughgoing egoist will not be moved by moral demands, even after ideal reflection. When we say "You have a reason to help," **are we stating a falsehood, or are we stating a truth about internal reasons they simply lack?**

  *   **Falsehood / Nonsense:** (External reason claims are false). → **Position: Williams-Style Internalism** (Note: Williams holds external claims are bluff, but internal ones are real).
  *   **Truth about Internal Reasons:** (They lack the reason, but the concept holds). → **Position: Williams-Style Internalism**.
      *(Note: For the purpose of this tree, both answers lead to Williams, as he distinguishes Internal Reasons [Real] from External Reasons [Bluff].)*

  ---

  ### Q6: The Kitten Case (Bad Desires)
  (You answered **Yes** to Q1). Consider someone who desires to hurt kittens for fun. **Do they have a reason to stop, even if nothing in their psychology wants to stop?**

  *   **No:** (Reasons must still track desires, perhaps idealised ones). → **Go to Q7**.
  *   **Yes:** (Reasons come from value, not desire). → **Go to Q8**.

  ---

  ### Q7: The Ideal Advisor Case (Informed Desire)
  (You answered **No** to Q6). If the kitten-hurter knew all the true facts and deliberated perfectly, **would they still want to hurt kittens? If yes, do they have a reason to do it?**

  *   **Yes:** (Reasons are what we would want if informed). → **Position: Ideal Advisor / Fully-Informed-Desire View**.
  *   **No:** (Then the reason comes from the facts, not the desire). → **Empty Seat B**.

  ---

  ### Q8: The Agency Case (Constitution)
  (You answered **Yes** to Q6). Does the reason to stop hurting kittens come from **the value of the kittens**, or simply from **the conditions required to be an acting agent**?

  *   **Conditions of Agency:** (You can't act without endorsing laws). → **Position: Korsgaard-Style Constitutivism**.
  *   **Value of the Kittens:** (Objective facts give reasons). → **Go to Q9**.

  ---

  ### Q9: The Egoist Response Case (Bindingness)
  (You answered **Value** to Q8). A moral demand exists. The egoist is **incapable** of being moved by it. **Does the reason still exist and bind them, or only if they are capable of responding?**

  *   **Only if capable:** (Reasons exist but require responsiveness). → **Position: Hybrid View (External Reasons, Internal Constraint)**.
  *   **Yes, regardless:** (Reasons exist independently of capacity). → **Position: Parfit-Style Value Externalism**.

  ---

  ## Empty Seats (Unoccupied Combinations)

  These are logical possibilities defined by the tree that no major philosopher defends.

  *   **Empty Seat A (Q3 No):** *Strict Subjectivism.* Claims reasons depend on current motivation and do not survive simple ignorance.
      *   **Diagnosis:** **Incoherent.** Almost everyone agrees correcting false beliefs is part of deliberation.
  *   **Empty Seat B (Q7 No):** *Inconsistent Idealism.* Claims reasons come from ideal desires, but denies the ideal desire determines the reason.
      *   **Diagnosis:** **Incoherent.** Contradicts the definition of the Ideal Advisor view.
  *   **Empty Seat C (Q1 Yes / Q6 No / Q7 No):** *Paternalistic Internalism.* Claims Marla has a reason (External), but Kitten-hurter doesn't (Internal).
      *   **Diagnosis:** **Unattractive.** Arbitrarily switches theories between prudence and morality without justification.

  ## Blind Spots (Indistinguishable Leaves)

  This instrument cannot separate the following positions based *only* on these cases.

  1.  **Williams-Style Internalism vs. The Bluff View (Q4/Q5):**
      *   **Why:** Both agree that if there is no sound deliberative route from the agent's psychology, there is no reason. Williams calls the remaining talk "bluff" regarding *external* reasons, but saves *internal* reasons. A radical Error Theorist might call all reason talk bluff. This tree groups them closely because their practical output on cases is nearly identical.
      *   **Distinction:** You need a meta-ethical question about the *language* of reasons, not a case-based one, to split them fully.

  2.  **Parfit-Style Externalism vs. Robust Realism:**
      *   **Why:** Both claim reasons exist independently of the agent.
      *   **Distinction:** Requires a question about the *ontology* of values (are they part of the fabric of the universe?), which is beyond the scope of a first-year practical reason handout.

  ---

  ## Branch Labels (The Philosophical Splits)

  For the tutor's reference, here is the philosophical claim dividing each branch:

  *   **Q1:** Does a reason require any motivational purchase on this agent at all? (Internalism vs Externalism)
  *   **Q2:** Does "could be motivated" include motivation produced by non-rational means? (Loose vs Strict Internalism)
  *   **Q3:** May deliberation add true beliefs? (Subjectivism vs Deliberative Internalism)
  *   **Q4:** Can a reason come from a bare capacity rather than existing motivation? (Internalism vs Error Theory)
  *   **Q5:** Is the thing doing the work the agent's psychology or a fact about value? (Williams vs Externalism - *Note: Williams locates work in psychology*)
  *   **Q6:** Can a desire for evil generate a reason? (Desire-Based vs Value-Based)
  *   **Q7:** Is the source of the reason the idealised desire or the fact that creates it? (Ideal Advisor vs Value Externalism)
  *   **Q8:** Is the thing doing the work the agent's psychology or a fact about value? (Constitutivism vs Realism)
  *   **Q9:** Must the agent be capable of responding for the reason to bind? (Hybrid vs Robust Externalism)
