      *   *Economist's Critique:* This is close but slightly off. In a standard Prisoner's Dilemma (PD), defection is *always* dominant regardless of what others do. In a "Moloch" or multipolar trap context (often coordination games or assurance games with negative externalities), the *pressure* increases as others defect. It's often a *dynamic* PD where the cost of cooperation rises as the number of cooperators falls.
      *   *Crucial Distinction:* Is the payoff structure changing endogenously? (i.e., Does my cost of compliance go *up* because you stopped complying?) Or is it static?
      *   *Attrition vs. Race:* If compliant firms leave the market, the average behavior of the *remaining* firms looks worse, but no one changed their behavior. This is selection bias, not a race.
      *   *Principal-Agent:* Management wants X, shareholders want Y, or Legal wants X, Product wants Y. This isn't inter-firm competition; it's intra-firm governance.
      *   *Values Disagreement:* Is "the bottom" actually bad? Or do we just disagree on the optimal level of privacy?

