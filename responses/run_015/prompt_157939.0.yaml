  *Economist view:* In a standard Nash Equilibrium, strategies are best responses. In a "race to the bottom," the *payoff matrix itself changes*. If I cooperate while you defect, I go bankrupt. If we both cooperate, we thrive. If the cost of cooperation rises *because* you defected (e.g., market share loss), that is the dynamic element. I will clarify this in the "Brainstorm" section.

