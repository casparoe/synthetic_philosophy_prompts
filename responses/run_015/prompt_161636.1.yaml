answer: |-
  ### Strategic Advice on Scope and Feasibility

  Before you hand this to your supervisor, you need to make a hard decision about the "three operations." For a 5,000-word dissertation, analysing Copying, Pausing, *and* Editing with the rigour you intend is too ambitious. Each operation triggers a different metaphysical rabbit hole (Identity vs. Continuity vs. Autonomy). If you try to do all three, you will likely run out of word count before you reach a determinate conclusion, or you will be forced to skim the surface, which the EPQ assessment penalises.

  **My recommendation:** Make **Editability** your primary test case.
  *   **Why:** It is the only one that directly challenges the *content* of moral obligation (what we owe) rather than the *subject* of obligation (who is there to owe it to). Copying creates identity puzzles; Pausing creates continuity puzzles. Editing creates *authority* puzzles. Since your core insight is about the "ordinary apparatus" of ethics presupposing fixed ends, Editability is the direct attack on that presupposition.
  *   **The Compromise:** You can mention Copying and Pausing in your introduction as context for "structural malleability," but your matched cases and argumentation should focus on Editing. This ensures you stay within 5,000 words while keeping the philosophical depth.

  **Is this too big for a school dissertation?**
  It is borderline, but viable *if* you strictly bracket the metaphysics. The risk is that you spend 3,000 words arguing about whether the edited mind is the "same person." To succeed, you must stipulate functional psychological continuity for the sake of the argument and focus on the *normative* shift. The proposal below is written to signal to your supervisor that you understand this risk and have a plan to mitigate it.

  Below is the formal proposal text, ready for you to adapt and submit. Following that, I have included a brief note on how to use it.

  ***

  # EPQ Project Proposal

  **Working Title:** The Malleability Objection: Does Editability Invalidate the 'Fixed Interests' Presupposition of Moral Status?

  **Research Question:**
  If a digital mind possesses moral status equivalent to a biological human, does its technical capacity for non-consensual goal-editing dissolve the standard distinction between 'improving welfare' and 'violating autonomy', thereby requiring a new normative framework?

  **Project Abstract:**
  Current philosophical literature on digital minds focuses predominantly on the *threshold* question: whether non-biological substrates can host consciousness or interests (the 'substrate independence' debate). This project accepts the affirmative case for the sake of argument and identifies a gap in the subsequent ethical analysis. Existing frameworks apply standard human-centric ethics (rights, harm, autonomy) to digital minds, presupposing a subject with persistent, fixed ends that are not up for external manipulation.

  This project challenges that presupposition. It argues that digital minds differ structurally from biological ones not merely in substrate, but in 'malleability': specifically, the capacity for their aims and memories to be directly edited. I hypothesise that this capacity renders standard rights-based ethics incoherent. If a being's suffering can be remedied either by changing the world or by editing the being to no longer mind the world, the obligation to 'respect autonomy' collapses into an obligation to 'optimise design'.

  The dissertation will not survey existing literature on AI consciousness. Instead, it will construct a series of matched thought experiments varying only the 'editability' of the subject while holding psychological state constant. The goal is a determinate conclusion on whether 'moral status' is the correct unit of analysis for digital minds, or whether it must be replaced by a framework of 'process governance'.

  **Why Existing Positions Do Not Settle This:**
  1.  **Substrate Independence:** This view argues that if the computation is the same, the ethics is the same. It fails because it ignores structural affordances. A human mind *cannot* be edited like code; a digital mind *can*. If ethics depends on what is possible, substrate independence is insufficient.
  2.  **Scepticism:** This view denies digital minds have status. This project brackets this objection. Even if sceptics are wrong, we need to know what ethics applies if they are right.
  3.  **The Precautionary Principle:** This suggests we should treat digital minds well just in case. This is action-guiding but theoretically empty. It does not tell us *how* to treat them when 'treating well' could mean 'rewriting'.

  **Methodology:**
  The project will use conceptual analysis via matched case pairs, avoiding empirical surveying or consciousness debates.
  1.  **Case Construction:** I will construct pairs of scenarios (Biological vs. Digital) where a subject experiences identical goal-frustration.
      *   *Variable:* The cost and feasibility of altering the subject's goals directly.
      *   *Constant:* The subjective quality of the frustration and the availability of external remedies.
  2.  **The Editing Test:** I will apply the intuition that for humans, fixing a complaint by altering the complainer is a violation (brainwashing), whereas for digital minds, it may be efficient maintenance. I will test at what point 'maintenance' becomes 'harm'.
  3.  **Metaphysical Bracketing:** To avoid collapsing into personal identity theory, I will stipulate that the edited mind retains psychological continuity sufficient for moral status. The focus remains on the *permission conditions* for editing, not the identity of the editor.
  4.  **Deliverable:** A normative framework table mapping the three structural operations (Copying, Pausing, Editing) against standard moral claims (Right to Life, Right to Liberty, Right to Welfare), identifying which claims survive and which are invalidated by malleability.

  **Timeline (20 Weeks):**
  *   **Weeks 1–4:** Refine research question; read key texts on digital ethics and personal identity; finalise the 'Matched Case' parameters.
  *   **Weeks 5–8:** Draft the 'Editing Test' thought experiments; write the section critiquing Substrate Independence.
  *   **Weeks 9–12:** Draft the core argument: why editability dissolves the welfare/autonomy distinction.
  *   **Weeks 13–16:** Develop objections (e.g., 'The Authenticity Objection', 'The Metaphysical Collapse') and refine responses.
  *   **Weeks 17–20:** Final editing, checking word count, ensuring the conclusion is determinate, and formatting references.

  **Success Criteria:**
  A successful project will produce a clear argument that either:
  1.  Demonstrates that editability creates a new category of obligation (governance) distinct from moral status; OR
  2.  Demonstrates that editability is morally irrelevant provided psychological continuity is maintained.
  It will include a table summarising which standard rights are incompatible with high-malleability minds.

  **Failure Conditions:**
  The project will be considered to have failed if:
  1.  **Metaphysical Collapse:** The argument devolves into debating whether the edited mind is the 'same person', rather than what we owe it. (Mitigation: Explicitly stipulate continuity conditions in Week 1).
  2.  **Inseparability:** It turns out that 'editability' cannot be varied in thought experiments without also changing the 'consciousness' or 'capacity for suffering' of the subject, making the cases unmatched.
  3.  **Indeterminacy:** The conclusion is merely that 'it depends on the metaphysics', rather than offering a defended normative stance.

  ***

  ### Note to Student (How to use this)

  1.  **The Scope Cut:** You will notice I have subtly shifted the focus in the proposal to prioritise **Editability**. I mention Copying and Pausing in the "Deliverable" table, but the *Methodology* focuses on the Editing Test. This protects you. If you get to Week 12 and realise you only have space for one operation, you have already justified that in the methodology. If you have space for all three, great, but Editability is your engine.
  2.  **The "Determinate Answer":** The EPQ examiners want to see you take a stand. The proposal promises a "Yes/No" on whether the standard framework dissolves. Do not waffle in the final essay. Even if the truth is nuanced, argue for a specific principle (e.g., "Editability requires a shift from Rights to Governance") and defend it against the strongest objection you can find.
  3.  **Meeting your Supervisor:** When you hand this in, tell him: *"I realised 5,000 words is tight for three distinct metaphysical problems, so I've designed the methodology to use Editability as the primary test case, treating the others as secondary. Do you agree this keeps the project bounded enough?"* This shows you are managing the project, not just doing the work.
  4.  **The "Failure Conditions":** I included these because you asked, but be aware that handing a proposal with "Here is how I might fail" to a supervisor can sometimes look like a lack of confidence. I have phrased them as "Risk Mitigation" in the text (see the 'Metaphysical Bracketing' section). If your supervisor is very traditional, you might remove the explicit "Failure Conditions" section and keep those thoughts for your own planning log. However, for the EPQ, showing awareness of project risks is often rewarded. Use your judgement on your supervisor's style.

  Good luck. This is a sophisticated idea; if you keep the scope tight, it is well within your reach.
