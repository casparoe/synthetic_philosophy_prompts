  I'm a political theory PhD student (ABD, still avoiding the diss like it's contagious) and I was arguing with my roommate last night about what actually counts as "the will of the people." We tried to map my gut reactions to some hypothetical cases, and they feel kind of all over the place, but I want to know if there's a coherent principle hiding in them or if I'm just being inconsistent.

  Here's where I definatly land: a national referendum passes 51-49 on stripping judicial review, and I feel like that's the people speaking — razor thin but legit. Parliament votes 60-40 for the exact same reform, and when populists scream "elite betrayal" I think they're wrong; representative democracy is still democratic. But there's been stable 65% support in high-quality polls for five years and committee gridlock kills it every time — that feels like suppression of the will. A president gets elected with 55% after explicitly promising policy X, then does Z and says the people voted for his judgment, not the policy. I think that's a cop-out; the mandate was for X. At a local town hall, 80% of attendees (who are self-selected, older, richer) back a zoning change. Despite the huge margin, I don't think that counts as the people's will. Protest turnout is near zero, so the government claims silent-majority consent. I think that's bogus — absence isn't presence. The one I keep flip-flopping on: a constitutional court strikes down a law that had 70% popular support. Sometimes it feels like the court is protecting a deeper, more stable will against temporary passion; other times it feels like pure anti-democratic overreach. There's tension between the referendum and the town hall (both direct, different margins, different verdicts), and between the court case and the gridlock case (both block popular outcomes, but one feels okay and the other doesn't?).

