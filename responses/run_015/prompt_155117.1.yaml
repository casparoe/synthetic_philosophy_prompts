  ### Quick Brainstorm: Epistemology vs. Decision Theory

  This feels like a boundary case, but I'd place it firmly in **political epistemology** rather than decision theory. Decision theory would treat this as a risk-calculation problem—weighing the known costs of the old against the uncertain costs of the new (like a Bayesian update). But the move you're describing isn't just about weighting risk; it's about shifting the *standards of knowledge* themselves based on temporal status. It claims the old institution *contains* knowledge we can't articulate (tacit knowledge), while the new institution *lacks* knowledge because it hasn't been tested. That's a claim about where wisdom resides and how we access it, not just a utility calculation. It's an epistemic closure mechanism that makes the status quo unfalsifiable.

  ***

  ### 1. Bottom line
  This pattern is a form of **Temporal Epistemic Asymmetry**, where the burden of proof shifts depending on whether an institution is existing or proposed. It renders the status quo immune to falsification by treating survival as evidence of hidden value while treating novelty as evidence of hidden risk.

  ### 2. The carving: what exactly the phenomenon is, what it isn't, and where its edges are
  This phenomenon is an argumentative structure that creates a non-falsifiable defense of existing institutions by manipulating evidentiary standards based on time. It isn't merely preferring the familiar; it is a specific epistemic claim that longevity generates wisdom (the "survival proves value" move) while novelty generates ignorance (the "unknown risks" move). The core mechanism is a double bind: if you challenge the old institution, the goalpost moves from "original purpose" to "hidden adaptive function." If you propose a new institution, the goalpost moves from "solving current problems" to "proving future safety."

  The edges of this concept are defined by its reliance on *tacit knowledge* claims. It differs from simple stubbornness because it offers a principled story about why we can't fully understand the institution (complexity, tradition, evolved wisdom). It also differs from pragmatic gradualism, which might accept change eventually; this structure theoretically blocks change indefinitely because the new can never survive long enough to gain the epistemic credit the old enjoys automatically. It creates a one-way ratchet where institutions gain epistemic credit simply by persisting, but never lose it even when their explicit functions vanish. The boundary is crossed when the defender admits the old institution is harmful *and* removable; this pattern specifically prevents that admission by reinterpreting harm as either necessary cost or misunderstood function.

  ### 3. Residue / near misses: why Chesterton's fence, path dependency, and status quo bias each fail to capture it
  **Chesterton's Fence** is the closest relative but only covers the prospective warning ("don't remove until you know why"). It doesn't account for the retroactive shift where the "reason" changes from explicit purpose to implicit survival value once the original purpose is debunked. Chesterton allows for removal once the reason is known; this pattern suggests the reason might never be fully knowable, permanently blocking removal.

  **Path Dependency** is a descriptive social science concept explaining *how* history locks us into certain outcomes due to switching costs or network effects. It explains why change is *hard*, not why it is *unwise*. Your pattern is normative; it argues we *ought not* change because the new lacks epistemic vetting, not just because it is expensive.

  **Status Quo Bias** is a psychological preference for current conditions, often irrational. It lacks the sophisticated epistemic narrative you're identifying. Status quo bias says "I prefer this because it's here." This pattern says "You should prefer this because its existence proves hidden utility, whereas the alternative's novelty proves hidden danger." It rationalizes the bias with a theory of knowledge, making it resilient to empirical counter-argument.

  ### 4. Provisional name and tight definition, with boundary cases
  **Name:** The Temporal Epistemic Asymmetry (or "The Traditionalist Epistemic Ratchet").

  **Definition:** An argumentative move in political justification where existing institutions are granted a presumption of wisdom based on survival (retrospective validation), while proposed institutions are charged a burden of impossible foresight (prospective skepticism), rendering the status quo immune to empirical falsification.

  **Boundary Cases:**
  *   *Included:* Arguing marriage is vital because it "evolved" (hidden value) while rejecting civil unions because they are "untested experiments" (hidden risk).
  *   *Excluded:* Arguing against change solely due to transition costs (Decision Theory) or admitting an old law is obsolete but keeping it for stability (Pragmatism).
