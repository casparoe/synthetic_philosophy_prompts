  ### 1. The Ruling on Gallipoli
  **Verdict: Admissible.**

  **The Principle: Instrumental Continuity.**
  Your historian is not judging the moral righteousness of the conflict, nor the historical accuracy of the myth. He is judging the *political utility of the survival.*

  His admissible myths (Dunkirk, Camerone, Verdun) all share a specific structural trait: the defeat or slaughter purchased a *future* for the community.
  *   **Dunkirk** was a military disaster, but the evacuation preserved the army to fight another day. The myth focuses on the survival, not the loss of France.
  *   **Camerone** was a tactical annihilation, but it secured the *honor* and continued existence of the Legion as an institution.
  *   **Verdun** was a meat grinder, but it held the line for the French Republic.

  His inadmissible myths (Masada, Vidovdan, The Alamo) are myths of *terminal sacrifice*. They glorify the end of the line. Masada is suicide; Vidovdan is a choice of the heavenly kingdom over the earthly one; The Alamo is a last stand with no survivors that serves expansionist rhetoric rather than defensive continuity.

