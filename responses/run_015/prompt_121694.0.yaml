      *   *Decision:* The practice presupposes that **legitimacy turns on the preservation of the patient's ability to author their own narrative *within the clinical conversation*, even if their behavior is constrained externally.** It distinguishes between *governing the will* (forbidden) and *governing the environment* (permitted). This is a Kantian-ish distinction (treating humanity as an end in the session, as a means in the system).
      *   *Critique:* This is inconsistent. If autonomy matters, CM undermines it just as much as manipulation. If outcomes matter, manipulation is efficient.
