      *   *Third thought:* The core inconsistency lies in a hybrid theory of autonomy that treats the *therapeutic alliance* as a sacred space of rational agency, while treating the *patient's broader life* as a site for pragmatic behavioral management.
      *   *My Position:* The practice presupposes a **Role-Relative Theory of Autonomy** combined with a **Procedural Conception of Rational Agency within the Clinical Dyad**. It is *not* consistent in a universal sense, but it is consistent *functionally* within a specific bureaucratic-therapeutic framework. It relies on a distinction between *internal* validity (the therapy session) and *external* validity (the patient's life context).
      *   *Refining the Position:* The practice actually presupposes that **autonomy is a capacity to be protected within the therapeutic relationship, but a variable to be managed outside of it.** The ban on manipulation protects the *process* of reasoning (MI), while CM and Coercion manage the *outcome* of behavior. The inconsistency is real: it treats "reasons-responsive" influence as ethically mandatory in the room, but "causal" influence as acceptable outside the room.
      *   *Stronger Claim:* The practice relies on a **Transparency + Role-Integrity Condition**. Manipulation is banned not because it influences, but because it corrupts the *source* of agency (the therapist-patient bond) by hiding the mechanism. CM and Coercion are transparent mechanisms of *constraint*, not *corruption*.
