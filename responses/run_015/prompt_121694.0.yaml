      *   *Verdict:* The practice is **philosophically unstable**. It tries to have it both ways: a Kantian respect for persons in the consulting room and a Utilitarian management of populations in the system.
      *   *Recommendation:* If we fix the theory, we must either ban CM/Coercion (hardline autonomy) or allow directive persuasion (hardline paternalism). The middle ground is hypocritical.

  6.  **Addressing Specific Prompts:**
