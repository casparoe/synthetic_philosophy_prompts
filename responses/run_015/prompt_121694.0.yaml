      *   **The Philosophical Puzzle:** Why is psychological conditioning (manipulation) banned while behavioral conditioning (CM) and legal coercion are allowed? Usually, manipulation is seen as worse than coercion because it subverts the will rather than overriding it. But here, *subtle* psychological influence is banned, while *overt* behavioral/legal leverage is allowed.

  3.  **Formulate a Hypothesis (The "Committed Answer"):**
      *   *Initial thought:* Maybe it's about transparency? No, CM is transparent but still bypasses reasoning.
