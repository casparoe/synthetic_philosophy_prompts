answer: |-
  Here is the analysis of your friend's data, the rules that fit it, and the prediction for Case 7.

  ### 1. The Three Rules

  Here are the three candidate rules, how well they fit Cases 1–6, and what they predict for Case 7.

  **Rule A: The Valence Rule (Your Friend's Rule)**
  *   **The Logic:** People call a side effect "intentional" if it is **bad** and "unintentional" if it is **good**. Foresight and causation are secondary to the moral value of the outcome.
  *   **Fit to 1–6:** Excellent. It explains the gap between Case 1 (Bad/81%) and Case 2 (Good/22%). It handles Case 5 (Extra Bad/93%) well. It struggles slightly with Case 4 (Bad/64%), but your friend dismisses this as noise. It handles Case 6 (No Causation) by treating causation as a minimum threshold.
  *   **Prediction for Case 7:** The consequence (customers losing access) is **bad**. It was foreseen. It was caused.
  *   **Predicted Number:** **75% to 85% Yes.** (Your friend's 78% guess sits squarely here.)

  **Rule B: The Blame Rule (Your Preference)**
  *   **The Logic:** The word "intentionally" is not a description of mental states; it is a tool for assigning accountability. Respondents answer "Yes" to "intentionally" when they want to blame the agent. The "Intent" percentage should correlate linearly with the "Blame" score.
  *   **Fit to 1–6:** Near perfect.
      *   Blame 0.8 → 22% Yes
      *   Blame 1.4 → 16% Yes
      *   Blame 3.2 → 64% Yes
      *   Blame 6.4 → 81% Yes
      *   Blame 7.8 → 93% Yes
      *   *Note:* Case 6 (1.4 blame / 16% yes) is the only outlier, likely because broken causation kills intent more than it kills blame.
  *   **Prediction for Case 7:** We must estimate the blame first. The officer followed mandatory rules, attempted mitigation, and was overruled. He is a bureaucrat, not a decision-maker. His blame score should be low, likely lower than Case 4 (3.2). Let's estimate Blame at **2.0**.
      *   Interpolating between Blame 1.4 (16%) and Blame 3.2 (64%): A blame score of 2.0 maps to roughly **35%**.
  *   **Predicted Number:** **30% to 40% Yes.**

  **Rule C: The Norm Violation Rule**
  *   **The Logic:** People call a consequence intentional if the agent **violated a norm** they ought to have respected. It is not enough for the outcome to be bad (Rule A); the agent must have acted wrongly. If the agent had a valid excuse (like a mandatory order), the norm violation is cancelled, and intent drops.
  *   **Fit to 1–6:** Strong.
      *   Case 1: Violated norm of care for children. (High Intent)
      *   Case 2: No norm to help. (Low Intent)
      *   Case 4: Norm violation mitigated by economic necessity/regret. (Lower Intent)
      *   Case 5: Norm violation compounded by malice. (Highest Intent)
      *   Case 6: No causation means no agency to violate a norm. (Low Intent)
  *   **Prediction for Case 7:** Did he violate a norm? He violated the norm of "protecting customers," but he upheld the norm of "obeying the regulator." In hierarchical structures, obeying a legitimate superior usually excuses the lower norm violation. Therefore, the net norm violation is low.
  *   **Predicted Number:** **30% to 45% Yes.** (Directionally same as Blame Rule, but for a structural reason rather than an emotional one.)

  **Do they diverge on Cases 1–6?**
  Only on Case 4. Rule A predicts High (it's bad). Rules B and C predict Lower (blame/norm violation is mitigated). The data supports B and C (64% is significantly lower than 81%).

  ---

  ### 2. My Prediction for Case 7

  **Prediction:** **32% to 38% Yes.**
  **Mean Blame Estimate:** 1.8 to 2.2.

  **Reasons:**
  1.  **Agency Trumps Valence:** Case 7 is not just "Bad Outcome." It is "No Choice." In Case 1, the manager *could* have chosen differently but prioritized cost. In Case 7, the officer *could not* choose differently. Ordinary language reserves "intentionally" for agents who could have done otherwise.
  2.  **The Case 4 Anchor:** In Case 4, the manager expressed regret and cited cost constraints ("there isn't one we could afford"). Intent dropped from 81% to 64%. In Case 7, the constraint is legal and absolute ("mandatory," "refused in writing"). The constraint is stronger, so the intent rating must be lower than 64%.
  3.  **The Case 2 Floor:** In Case 2 (Good outcome, indifferent), intent was 22%. In Case 7 (Bad outcome, coerced), the "Badness" pushes the number up, but the "Coercion" pushes it down. It should settle slightly above the "Good/Indifferent" baseline.

  **What Would Surprise Me:**
  *   **Above 60%:** This would imply that ordinary people ignore coercion entirely when harm is salient. It would suggest "intentionally" simply means "you caused this bad thing," regardless of whether you had a choice.
  *   **Below 15%:** This would imply that "intentionally" requires personal malice. If it drops this low, it means people view the officer as a robot, completely stripping him of agency.

  ---

  ### 3. Distinguishing Blame vs. Norm

  You asked for the shortest change to separate the **Blame Rule** (Intent tracks emotional blame) from the **Norm Rule** (Intent tracks rule-breaking).

  In Case 7, they likely agree (Low Blame, Excused Norm). To separate them, we need a case where the agent **breaks a rule but deserves no blame**, OR **deserves blame but broke no rule**.

  **The Vignette (Modification of Case 2):**
  > Identical to Case 2 (routing cuts traffic past school, noise/fumes get better), **except** the manager says: "I don't care about the school. I picked this route because it delays a competitor's trucks, and I want them to fail."

  *   **The Outcome:** Good (less noise/fumes).
  *   **The Norm:** The agent *upheld* the norm of helping the school (objectively good act).
  *   **The Blame:** The agent is *blameworthy* due to spiteful motive.

  **The Predictions:**
  *   **Norm Rule Predicts:** **Low Intent (~25%).** The act conformed to norms (helping the school). The side effect was good. The rule violation is hidden in the motive, not the act.
  *   **Blame Rule Predicts:** **High Intent (~75%).** The respondents will feel anger toward the manager's spite. To register that blame, they will say he "intentionally" helped the school (as a weapon), or they will shift focus to the harm to the competitor. If asked "Did he intentionally help the school?", the Blame Rule suggests the negative feeling toward him will inflate the ascription of intent, even for a good outcome.

  *Note: If your friend runs this, ask "Did he intentionally improve the air quality?" If the number spikes despite the good outcome, the Blame Rule wins. If it stays low, the Norm Rule wins.*

