  ### 5. What Is At Stake

  You asked what we learn if Case 7 comes in near 30% versus 80%.

  **If Case 7 comes in near 80% (Friend's Prediction):**
  It means ordinary language is **outcome-obsessed**. We use the word "intentionally" to mark **causal responsibility for harm**. It does not matter if you had a choice, followed orders, or tried to stop it. If you pulled the lever and bad things happened, you did it "on purpose." This suggests our moral language is primitive and punitive.

  **If Case 7 comes in near 30% (My Prediction):**
  It means ordinary language is **agency-obsessed**. We use the word "intentionally" to mark **moral accountability**. We reserve it for people who had a choice and chose wrongly. If you were forced, or if you followed legitimate rules, you are not the "author" of the harm, even if your hands moved the lever. This suggests our moral language is sophisticated and distinguishes between *causing* and *authorizing*.

  **The Plain Truth:**
  If the result is ~30%, we have learned that "intentionally" is not a psychological fact-finding tool. It is a social sanctioning tool. We do not use it to describe what happened in the brain; we use it to decide who belongs in the dock. Your friend's survey is not measuring psychology; it is measuring **judgment**.
