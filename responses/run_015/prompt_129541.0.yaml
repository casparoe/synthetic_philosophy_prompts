  ### 4. The Loose End (Willingness)

  > *Before I saw case 2 I had a rule I liked: people call a consequence intentional when the agent was willing to have it happen, and they read not caring as a kind of willingness... Case 2 seems to kill that.*

  **Verdict:** Drop it.

  **Why:** You cannot repair this without collapsing it into Rule A (Valence).
  To make your rule work, you would have to add a clause: *"Indifference counts as willingness **only when the outcome is bad**."*
  *   If the outcome is Bad + Indifferent → Willing → Intentional.
  *   If the outcome is Good + Indifferent → Not Willing → Unintentional.

  This is no longer a rule about "willingness." It is a rule about "badness." You are just describing the Knobe Effect (Rule A) using psychological language. Case 2 proves that indifference is not enough on its own; the *value* of the outcome determines whether indifference is read as willingness or negligence.

