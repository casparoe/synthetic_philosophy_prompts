answer: |-
  You have spotted a rather sophisticated piece of rhetorical judo there. It is a sharp observation, and you are quite right to feel that standard fallacy labels don't quite stick to it.

  The closest established term is **Kettle Logic**. Coined by Freud (in *The Joke and Its Relation to the Unconscious*), it describes a situation where someone offers multiple, mutually contradictory arguments to defend a single position. The classic example is a man accused of returning a borrowed kettle damaged: he argues, firstly, that he returned it undamaged; secondly, that it was already damaged when he borrowed it; and thirdly, that he never borrowed it at all. All three cannot be true, but each is offered as a sufficient defence on its own.

  However, Kettle Logic is typically static (all arguments presented at once or in a list). What you are describing is *dynamic*. It is a tactical switching mechanism designed to exhaust the opponent. Since there isn't a widely recognised term for this specific *cycling* manoeuvre within socio-economic debates, I propose we coin one.

  Let us call it **The Dual-Register Defence**.

  Here is the breakdown of the term, its boundaries, and how it differs from simple equivocation.

  ### The Dual-Register Defence

  **Definition:** A rhetorical tactic wherein a defender of the status quo alternates between two incompatible justificatory frameworks (registers) to protect a single conclusion from critique. When one register is successfully challenged, the arguer retreats to the second register without acknowledging the contradiction, only to return to the first when the second becomes untenable.

  **The Two Registers:**
  In the context of work culture, these are usually:
  1.  **The Agency Register (Virtue):** Work is a matter of choice, character, passion, and moral identity. (e.g., "I work hard because I am dedicated.")
  2.  **The Structure Register (Necessity):** Work is a matter of force, economic survival, and external constraint. (e.g., "I work hard because the market demands it.")

  **Proper Boundaries:**
  For this label to apply, three conditions must be met:

  1.  **Incompatibility:** The two arguments must logically undermine one another. You cannot simultaneously claim total moral agency (I *choose* to suffer for meaning) and total structural determinism (I *must* suffer to survive). If the arguments are merely different facets of the same point, it is not a Dual-Register Defence.
  2.  **Reactive Switching:** The switch between registers must be triggered by counter-argument. If someone simply believes both things equally and states them together, that is standard Kettle Logic. The *Defence* aspect requires the tactical shuffle to evade specific critiques.
  3.  **Status Quo Preservation:** The conclusion remains fixed (e.g., "Long hours are acceptable/unchangeable") whilst the premises shift. The goal is not to find truth, but to make the conclusion unfalsifiable.

  ### How it Differs from Equivocation

  You asked specifically about the difference from equivocation, and it is a crucial distinction.

  **Equivocation** relies on the ambiguity of a single *word*. For example, using the word "freedom" to mean "absence of restraint" in one sentence, and "capacity to act" in the next. It is a semantic sleight of hand.

  **The Dual-Register Defence** relies on the ambiguity of an entire *worldview*. It is not about the definition of "work"; it is about the framework of *reality* in which the work is happening.
  *   In the **Agency Register**, the worker is the protagonist.
  *   In the **Structure Register**, the worker is the victim.

  The fallacy lies in demanding the rights of a protagonist (pride, identity, dignity) whilst claiming the immunity of a victim (no choice, unavoidable necessity). Equivocation is a linguistic trick; the Dual-Register Defence is an ideological shield.

  ### Why it is so effective

  This tactic is exhausting because it forces you to fight a war on two fronts that cannot exist simultaneously. If you attack the economics, they talk about passion. If you attack the passion, they talk about economics. It creates a **Discursive Double Bind**.

  It allows the speaker to have their cake and eat it too: they claim the moral high ground of the "dedicated worker" whilst accepting no responsibility for changing the system because "the system is unchangeable."

  ### Summary

  So, whilst you can accurately call it a dynamic form of **Kettle Logic**, **The Dual-Register Defence** captures the specific mechanism of switching between *Virtue* and *Necessity* to block reform. It applies whenever two incompatible frameworks are used interchangeably to defend a fixed conclusion, specifically to evade structural critique.

  It is a bloody clever bit of rhetorical footwork you've spotted there. Well done.

  Ta.
