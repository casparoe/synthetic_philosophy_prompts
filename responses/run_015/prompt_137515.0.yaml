answer: |-
  Dear Colleague

  I am writing to outline a structured approach for your ninety-minute seminar on epiphenomenalism and the paradox of phenomenal judgement, designed specifically for final-year philosophy students who are already familiar with the basic mind-body problem. The success of this session depends entirely on the logical sequencing of concepts, as introducing the conclusions before the premises will allow students to dismiss the view as obviously absurd without grasping the structural tension that makes it philosophically resilient. You must begin the seminar by securing the principle of the causal closure of the physical, establishing the consensus view that every physical event has a sufficient physical cause. This premise must be laid down before you mention consciousness or qualia, because it is the engine that drives the subsequent argument. Once the students accept that the physical domain is causally self-contained, you can introduce the concept of phenomenal properties as distinct, non-physical qualities of experience. Only at this point, relying on the previously established closure principle, should you introduce the inertness of phenomenal properties, explaining that if physical causes are sufficient, phenomenal properties cannot exert causal influence without violating closure or overdetermining the effect.

  It is crucial that you intercept the first major misconception immediately after establishing this inertness. Students will often conflate epiphenomenalism with eliminativism, assuming that if consciousness has no causal power, it does not exist. You must pause here to clarify that epiphenomenalism is a realist doctrine that affirms the existence of consciousness while denying its causal efficacy, distinguishing it sharply from the view that consciousness is an illusion. To make this abstract distinction concrete, you should introduce your central example of the silent internal alarm. Describe a scenario where a subject possesses an internal gauge that registers danger. For this example to work without smuggling in interactionism, you must specify that the alarm has genuine phenomenal character, meaning there is something it is like to see the gauge flash red, but it must also possess complete causal isolation. You must explicitly state that the flashing of the gauge lacks any behavioural or neural consequence, meaning it triggers no adrenaline release, no motor neuron activation, and no further processing in the cognitive system. It is a light that turns on but is wired to nothing. This visualizes the doctrine without inviting the objection that the feeling of danger obviously causes us to run.

  Once the metaphysics of inertness is secured via the alarm example, you can begin constructing the paradox of phenomenal judgement in stages rather than presenting it as a single contradiction. The first stage is to establish that we do in fact make reports about our consciousness, such as saying I am seeing red. The second stage is to remind students that these reports are physical events, involving vocal cords or typing muscles. The third stage is to apply causal closure again, noting that these physical reports must have sufficient physical causes within the brain. The fourth stage is to recall the inertness of the phenomenal property, meaning the experience of red did not cause the report. The fifth and final stage is to ask why the report is true. If the experience did not cause the report, there is no causal chain linking the reality of the experience to the truth of the statement. This staged construction reveals the paradox gradually, showing how the theory seems to make knowledge of consciousness impossible.

  During this construction, specifically at the stage where you question the truth of the report, you must intercept the second common misconception. Students will likely suggest that the paradox dissolves if we simply admit that our reports are merely unreliable or mistaken. You need to explain that this move fails because it undermines the very evidence used to support epiphenomenalism in the first place. If we cannot trust our judgements about consciousness, we have no reason to believe consciousness exists as described by the epiphenomenalist, rendering the theory self-stultifying. You should emphasize that the paradox is not about whether we are sometimes wrong, but about how we could ever be right if the truth-maker is causally disconnected from the belief. Throughout this entire sequence, you must explicitly omit detailed discussions of interactionist physics, such as debates over the conservation of energy, and contemporary neuroscientific objections regarding neural correlates. These topics distract from the conceptual logic of the paradox and invite empirical disputes that cannot be resolved within the timeframe of a philosophy seminar.

  To conclude the session, you should pose one precise diagnostic question that reveals whether the students have understood the structural tension rather than simply memorizing the claim that consciousness is causally useless. Ask them to explain why an epiphenomenalist cannot consistently claim to know that epiphenomenalism is true. This question forces them to articulate the self-defeating nature of the theory, where the justification for believing the theory relies on a knowledge relation that the theory itself renders impossible. If they answer merely that consciousness cannot cause behaviour, they have missed the epistemological crisis at the heart of the paradox. If they answer that the theory removes the causal link required to validate the truth of the theory itself, they have grasped the lesson. I hope this plan provides the rigorous scaffolding you need to guide your students through this difficult material without allowing the discussion to dissolve into intuitive objections.

  Yours sincerely

  The Teaching Fellow
