prompt: |-
  hey, I'm taking a philosophy of cog sci seminar this term and we're doing a two-week block on ML interpretability, and I've gotten really stuck on the question of whether networks actually have representations or whether that's just a convenient way of talking that helps you write papers. My flatmate does ML and is completely unsympathetic about it — her line is that you can rewrite the inside of a network however you like without changing what it does, so there's no fact of the matter about what any internal state means, and realism about representations is a category error. Concretely, the move she keeps making: take a trained transformer, stick an invertible linear map R in between two layers and undo it with R⁻¹ at the next one, adjust the surrounding weights to match, and you get a network computing literally the same function in which every direction you might have wanted to call a 'feature' now does something completely different. My prof said something in passing that I didn't really follow, to the effect that if representations are only ever defined up to isomorphism then realism is either trivial or empty, and I've been chewing on that since.

  So here's what I'd like you to argue for, and I want you to actually commit to it rather than splitting the difference: that this kind of non-uniqueness worry doesn't stop at the neuron level but goes all the way up, so that the 'features' you get out of sparse autoencoders and other dictionary-learning setups aren't the network's representational contents either. The idea I can't get straight is that there seem to be indefinitely many different dictionaries that fit the activations more or less equally well, all related by the same sort of rewrite, and what picks one out is the sparsity penalty, the dictionary size, the training setup — stuff that lives in our method, not in the network. If that's right then being a realist about neural representations means locating the content one level up, in whatever survives the rewrite: the similarity structure among activations, the maps from one layer's space to the next, which distinctions are available to downstream computation at all. And then you have to own the weird consequence that the content of a representation is only determinate up to a linear transformation. Please steelman this as hard as you can.

  Two things I want handled rather than gestured at. First, I've since realised the rewrite isn't clean for an actual transformer — the elementwise nonlinearities in the MLP blocks and the normalization layers partly break the symmetry, so there's arguably a privileged basis after all, or at least a partly privileged one — and I want to know whether the argument survives once you concede that, e.g. by leaning on the leftover non-uniqueness in the dictionaries instead of on an exact symmetry. Second, I want a real sense of what would change my mind: what sort of result from interpretability would show there is a privileged decomposition, or show the invariance story is wrong, and does any of this depend on something special about transformers or would it go through the same for, say, a small conv net trained on images? Don't give me a reading list or citations, we've barely read anything and I want the argument itself, not pointers to it. And please don't drift into the 'do LLMs understand anything' debate, that's next week's topic — I mean the narrower question of whether the internal states have content at all. Oh and at the end flag the single step you think is most likely to break and how you'd patch it, because I have to present on this thursday and I'd rather know where the soft spot is.
