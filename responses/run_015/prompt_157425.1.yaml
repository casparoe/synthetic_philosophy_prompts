answer: |-
  # Desiderata for a Theory of Analogical Core Cognition

  **To:** Proponents of the "Analogy as Core Cognition" Thesis
  **From:** Philosophy of Mind (ex-Physics)
  **Subject:** Specification of Theoretical Requirements

  The claim that analogy-making is not merely a heuristic tool but the "fuel and fire" of thinking (Hofstadter & Sander) is a bold unification hypothesis. It posits a single cognitive mechanism spanning the gap between the immediacy of seeing a cup as a "container" and the deliberation of mapping Maxwell's equations onto fluid dynamics. To evaluate this claim without succumbing to metaphorical enthusiasm, we require a rigorous specification of what such a theory must achieve.

  Below are the desiderata. Items marked **[Non-Negotiable]** are constrained by empirical data or logical consistency. Items marked **[Camp-Specific]** reflect theoretical preferences that, while important, may admit alternative resolutions.

  ---

  ## I. Range of Phenomena
  *A theory of core analogy must demonstrate coverage across the cognitive hierarchy.*

  1.  **Perceptual Categorization [Non-Negotiable]**
      *   **Requirement:** The theory must explain how sensory input is parsed into objects and categories without presupposing those categories.
      *   **Motivating Case:** Seeing a tilted mug and recognizing it as the same object as an upright mug requires an analogical mapping between the current retinal projection and stored structural descriptions. If analogy is core, this cannot be a separate "perceptual module"; it must be the same mechanism used for higher reasoning.
  2.  **Linguistic Metaphor and Lexicalization [Non-Negotiable]**
      *   **Requirement:** The theory must account for the lifecycle of metaphor, from novel inference to dead metaphor.
      *   **Motivating Case:** "Grasping an idea" is processed differently than "grasping a cup." The theory must explain how a productive analogical mapping becomes a lexicalized, non-analogical semantic primitive over time.
  3.  **Scientific Model-Building and Ontological Discarding [Non-Negotiable]**
      *   **Requirement:** The theory must explain how analogies facilitate derivation while allowing for the later rejection of the source ontology.
      *   **Motivating Case:** 19th-century physicists used hydraulic and electrical analogies to derive fluid dynamics equations before Navier-Stokes formalism was complete. These analogies were heuristically indispensable but ontologically discarded once the mathematics was fixed. The theory must distinguish between *structural utility* and *ontological commitment*.
  4.  **Cross-Domain Mathematical Abstraction [Non-Negotiable]**
      *   **Requirement:** The theory must handle mappings where source and target share no surface features or physical ontology.
      *   **Motivating Case:** Mapping group theory onto crystallographic symmetry. There is no "surface" similarity between an algebraic operation and a physical lattice; the analogy is purely relational. A core theory cannot rely on feature overlap.

  ## II. Conceptual Distinctions
  *A core theory must not collapse critical functional differences into a monolithic blur.*

  5.  **Productive Inference vs. Lexicalized Routine [Non-Negotiable]**
      *   **Requirement:** Distinguish between analogies that generate new predictions and those that retrieve stored associations.
      *   **Motivation:** If all cognition is analogy, the distinction between *reasoning* and *memory retrieval* risks collapse. The theory must specify the computational threshold where a mapping becomes generative rather than reproductive.
  6.  **Structural Alignment vs. Surface Matching [Non-Negotiable]**
      *   **Requirement:** Explicitly model the suppression of superficial attributes in favor of relational structure.
      *   **Motivation:** Humans prefer deep structural matches over surface similarity in expert reasoning (e.g., recognizing a solar system model in an atom despite vast physical differences), but revert to surface matching under cognitive load. The theory must model this trade-off dynamically.
  7.  **Discovery vs. Pedagogy [Camp-Specific]**
      *   **Requirement:** Distinguish between analogies that lead to novel scientific truth and those that merely communicate existing truth.
      *   **Motivation:** While both use similar cognitive machinery, the epistemic status differs. A theory focused on *discovery* must explain risk-taking and error; a theory focused on *pedagogy* must explain clarity and simplification.
  8.  **Explicit Representation vs. Distributed Emergence [Camp-Specific]**
      *   **Requirement:** Specify whether relational structures are explicitly tokenized (symbols/graphs) or emerge from pattern completion (vectors/activations).
      *   **Motivation:** This is the primary architectural fault line. Hofstadter leans toward fluid, emergent symbols; Gentner toward explicit structural graphs. A core theory must commit to a format or provide a translation layer.

  ## III. Empirical and Computational Constraints
  *The theory must fit the hardware and the data.*

  9.  **Effort and Context-Sensitivity [Non-Negotiable]**
      *   **Requirement:** Analogical reasoning must be modeled as resource-intensive and context-dependent, not automatic and universal.
      *   **Evidence:** Reaction time studies show that accessing distant analogies requires working memory and inhibition of salient distractors. If analogy is perception (usually automatic), the theory must explain the *cost* of deep analogy.
  10. **Comparative and Developmental Capacity [Non-Negotiable]**
      *   **Requirement:** The theory must scale down to the capacities of young children and non-human animals.
      *   **Evidence:** Infants and corvids show rudimentary analogical capacities (same/different relations) without language. A "core" theory cannot rely on linguistic scaffolding.
  11. **Distributed System Approximation and Failure Modes [Non-Negotiable]**
      *   **Requirement:** The theory must be compatible with the fact that neural networks can approximate analogical transfer but fail in ways humans do not.
      *   **Evidence:** Transformers capture statistical co-occurrence that mimics analogy but lack systematicity (e.g., they fail on novel relational compositions humans find trivial). The theory must explain *why* human analogy is more robust to distributional shifts.

  ## IV. Boundary Conditions
  *A theory of everything must explain where it stops working.*

  12. **Prediction of Specific Failure Patterns [Non-Negotiable]**
      *   **Requirement:** The theory must predict *when* analogy fails and *what kind* of error results.
      *   **Motivating Case:** Humans exhibit specific biases, such as over-extending surface similarities (e.g., assuming a whale is a fish) or resisting distant structural mappings due to ontological conflict. Treating these as "noise" is insufficient; they are data points on the mechanism's limits.
  13. **Inappropriateness Conditions [Non-Negotiable]**
      *   **Requirement:** Specify conditions under which analogical reasoning is suppressed in favor of logical or algorithmic processing.
      *   **Motivation:** In formal proof or safety-critical engineering, analogy is often explicitly barred. The theory must explain the cognitive switch that inhibits analogical mapping.

  ---

  ## V. Meta-Analysis: Tensions and Exclusionary Power

  ### 1. Joint Unsatisfiability and Tensions
  There is a significant tension, potentially bordering on incompatibility, between **Desideratum 1 (Perceptual Categorization)** and **Desideratum 9 (Effort/Context-Sensitivity)**.

  *   **The Tension:** If analogy is the core of perception (Hofstadter's view), it should be ubiquitous, parallel, and largely automatic, like edge detection. However, if analogy is the engine of scientific discovery (Gentner's view), it is serial, effortful, and working-memory limited.
  *   **The Risk:** A single mechanism that is fast enough for perception is typically too shallow for rigorous scientific mapping. A mechanism deep enough for science is typically too slow for perception.
  *   **Suspected Incompatible Pair:** **Automaticity (Perception)** and **Explicit Relational Representation (Science).** It is unclear how a system can maintain explicit relational structures required for Navier-Stokes derivations while operating at the speed of visual object recognition without a dual-process architecture (which would undermine the "single core mechanism" thesis).

  ### 2. The Most Exclusionary Requirement
  **Desideratum 4 (Cross-Domain Mathematical Abstraction) combined with Desideratum 12 (Prediction of Specific Failure Patterns).**

  *   **Justification:** Many theories can handle surface similarity (associationism) or explicit structure (symbolic AI). Few can handle *purely relational* mapping (math) while also predicting *human-specific* errors.
  *   **Exclusionary Power:** This combination excludes pure statistical/distributed models (which fail at systematicity in math) and rigid symbolic models (which often fail to predict the specific heuristic biases humans exhibit in favor of logical consistency). It forces the theory to explain how abstract structure is represented *and* why it degrades in human-specific ways.

  ### 3. Non-Negotiable vs. Camp-Specific
  *   **Non-Negotiable:** Empirical fit (Reaction times, developmental data, failure modes). If the theory contradicts the data on effort or capacity, it is falsified.
  *   **Camp-Specific:** The format of representation (Explicit Symbols vs. Distributed Vectors). As long as the input/output behavior and constraints are met, the internal architecture is currently underdetermined by data, though this is shifting with neuroimaging.

  ---

  ## VI. Comparative Scoring of Broad Approaches

  *Scoring: **Pass** (Meets criterion well), **Fail** (Significant deficit), **Partial** (Theoretical workaround exists).*

  | Desideratum | Structural-Alignment (Gentner/SME) | High-Level Perception (Hofstadter/Copycat) | Distributed/Statistical (Modern LLMs/Transformers) |
  | :--- | :--- | :--- | :--- |
  | **1. Perceptual Categorization** | **Fail.** Treats perception as input to analogy, not analogy itself. | **Pass.** Perception *is* high-level analogical mapping. | **Partial.** Pattern recognition is core, but "object" status is ambiguous. |
  | **2. Metaphor Lifecycle** | **Partial.** Explains mapping well, less on lexicalization. | **Pass.** Fluid concepts naturally explain slippage and freezing. | **Pass.** Statistical co-occurrence naturally models lexicalization. |
  | **3. Scientific Modeling** | **Pass.** Explicitly designed for structural mapping in science. | **Fail.** Struggles to scale to rigorous, multi-step derivation. | **Fail.** Hallucinates ontology; cannot reliably discard source model. |
  | **4. Cross-Domain Math** | **Pass.** Handles purely relational mapping robustly. | **Partial.** Demonstrated in micro-domains, unproven in higher math. | **Fail.** Fails on systematicity and novel relational composition. |
  | **5. Productive vs. Dead** | **Partial.** Distinction is external to the algorithm. | **Pass.** Emerges from concept stability. | **Pass.** Emerges from weight固化 (solidification). |
  | **6. Structure vs. Surface** | **Pass.** Explicitly prioritizes structure. | **Pass.** Context determines salience dynamically. | **Fail.** Heavily biased toward surface statistical features. |
  | **9. Effort/Context** | **Pass.** Serial processing matches effort data. | **Fail.** Parallel terraced scan implies more automaticity than observed. | **Partial.** Compute cost exists, but doesn't match human working memory limits. |
  | **12. Failure Modes** | **Partial.** Predicts structural errors, misses heuristic biases. | **Pass.** Predicts "slippage" errors well. | **Fail.** Failure modes (hallucination) differ from human analogical error. |

  ### Summary Evaluation
  *   **Structural-Alignment:** Best fits the **Scientific/Math** desiderata but fails the **Perceptual/Ubiquity** claim. It treats analogy as a *tool* of cognition, not the *core*.
  *   **High-Level Perception:** Best fits the **Perceptual/Ubiquity** claim but struggles with the **Rigor/Scale** of scientific discovery. It risks making analogy too fluid to support stable scientific ontology.
  *   **Distributed/Statistical:** Best fits the **Neural Implementation** constraints but fails the **Systematicity/Structure** desiderata. It mimics the *output* of analogy without the *mechanism* of relational mapping.

  **Conclusion:** No current approach satisfies the full specification. The "Analogy as Core Cognition" thesis remains a compelling research program rather than an established theory, primarily because the tension between **Perceptual Automaticity** and **Scientific Explicitness** remains unresolved. A successful theory must either demonstrate how explicit structure emerges from perceptual fluidity without loss of rigor, or admit a dual-process architecture that compromises the "single core" claim.
