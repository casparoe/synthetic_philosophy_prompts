answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Causal Exclusion Argument and Mental Efficacy
  **Parties:** Exclusionist Side (E) / Non-Reductivist Side (NR)
  **Date:** [Current Date]

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both sides as the common ground for this dispute. Denial of any claim below constitutes a withdrawal from the collaboration.*

  1.  **Physical Closure:** For every physical event that has a cause, there exists a physical cause that is sufficient to bring about that event's occurrence according to physical law.
  2.  **Type Distinctness:** Mental property types (e.g., *believing that p*, *intending to $\phi$*) are not identical to physical property types (e.g., *neural firing pattern N*).
  3.  **Realization:** Mental properties are realized by physical properties in individual instances; there is no "free-floating" mentality.
  4.  **No Systematic Overdetermination:** The world does not systematically contain cases where a single effect is produced by two *distinct and independent* sufficient causes (e.g., two bullets hitting a heart simultaneously).
  5.  **Causal Relevance:** To say a property is causally efficacious is to say it does more than merely correlate with the effect; it plays a role in bringing the effect about.
  6.  **Special Science Success:** The special sciences (psychology, economics, etc.) generate robust, projectible generalizations that support counterfactual claims.
  7.  **Token Causation:** We are primarily concerned with whether particular instances of mental properties cause particular instances of physical behavior, not just whether mental types correlate with behavior types.
  8.  **Non-Magic:** Mental causation does not involve the violation of physical laws or the injection of energy from outside the physical closed system.
  9.  **Exclusion Pressure:** If a physical cause is sufficient for an effect, and a mental cause is distinct from that physical cause, there is a prima facie pressure to exclude the mental cause unless a relevant difference between them can be demonstrated.
  10. **Stakes:** The outcome determines whether agents are genuine sources of action (NR) or whether agency is a useful fiction overlaying a physical chain of events (E).

  ## 2. DISAGREEMENTS TABLE
  *This table isolates the specific points of divergence. Both sides pre-register their verdicts on the shared probe cases.*

  | The Crux | Exclusionist Formulation (E) | Non-Reductivist Formulation (NR) | Shared Probe Case | E Prediction & Cost of Error | NR Prediction & Cost of Error |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Sufficiency Condition** | "Sufficient" means **nomological necessitation of the event's occurrence**. If the physical base occurs, the effect *must* occur given physical law. | "Sufficient" means **fixing the truth of the causal claim**. A cause is sufficient if it secures the counterfactual dependence of the effect on the relevant property. | **Locked Route:** Agent reaches. Neural route R1 realizes Intention M. Hardwired backup R2 exists (does not fire) but would have produced the *same* reaching if R1 failed. | **Verdict:** M did not cause the reaching. R1 is the sufficient physical cause; M is distinct and adds no physical necessity.<br>**If Wrong:** Physical closure is false or overdetermination is systematic. | **Verdict:** M caused the reaching. R1/R2 are implementation details; M is the invariant difference-maker for the action.<br>**If Wrong:** Psychology tracks epiphenomenal shadows; agency is illusory. |
  | **2. The Grain of the Effect** | Causation is extensional. The effect is the **physical event** (e.g., muscle contraction at *t*). Descriptions do not alter causal facts. | Causation is intensional/contextual. The effect is the **described outcome** (e.g., "reaching for the glass"). Causal claims are sensitive to how the effect is specified. | **Grain Shift:** Same event described as (A) "hand moved at velocity *v*" vs (B) "she reached for the glass." | **Verdict:** Exclusion pressure is identical for (A) and (B). Both are physical events with sufficient physical causes.<br>**If Wrong:** Physical events have no identity conditions independent of description. | **Verdict:** Exclusion pressure vanishes for (B). (B) is a higher-order event only M can cause; (A) is caused by neurons.<br>**If Wrong:** Causation becomes fragmented; we cannot explain why the hand moved without referencing the glass. |
  | **3. Competition vs. Levels** | Realized and realizer **compete for the same causal slot**. If the realizer does the work, the realized property is idle. | Realized and realizer **operate at different levels**. There is no competition because they answer different explanatory questions. | **Scatter:** In a population, Mental Property M is realized by Physical States P1, P2, P3. All produce Behavior B. No single P-type is present in every case. | **Verdict:** M did not cause B. There is no physical type common to all cases; causation is token-level only. M is a convenient label for a disjunction.<br>**If Wrong:** There are causal powers without physical bases (magic). | **Verdict:** M caused B. M is the only invariant common factor. P1/P2/P3 are heterogeneous realizers of the genuine cause M.<br>**If Wrong:** Special science generalizations are accidents; we cannot predict behavior across diverse physical substrates. |

  ## 3. NOTE ON VERBAL DISPUTE
  *Assessment of whether the disagreement is merely terminological.*

  **The "Causation" Ambiguity:**
  There is a strong indication that a portion of this dispute is verbal, specifically regarding the definition of "cause."
  *   **Side E** operates with a **Production** concept: Causation is the transfer of energy/momentum or the nomological necessitation of an event's occurrence.
  *   **Side NR** operates with a **Difference-Making** concept: Causation is the establishment of counterfactual dependence or invariance under intervention.

  **Does this dissolve the fight?**
  No. It relocates it one step back.
  If we simply agree that "Production" belongs to physics and "Difference-Making" belongs to psychology, we have a peace treaty, not a solution. The substantive dispute remains: **Which concept of causation is the one that matters for *agency*, *responsibility*, and *explanation*?**

  *   **Substantive Reformulation:** The dispute is not "Does M cause E?" but "Is the *Difference-Making* relation robust enough to ground the kind of causal efficacy required for moral responsibility and rational explanation, even if the *Production* relation is exhausted at the physical level?"
  *   **Side E Claim:** If M does not produce E (in the physical sense), M is causally idle in the only sense that prevents epiphenomenalism. Difference-making without production is mere correlation.
  *   **Side NR Claim:** Production is a metaphysical luxury. Difference-making is the only concept of causation we ever use in practice, law, and science. To demand production is to demand a ghost in the machine.

  **Conclusion:** The dispute is not purely verbal, but it is partially driven by equivocation on "sufficiency." E treats sufficiency as *occurrence-guaranteeing*; NR treats it as *difference-securing*. Recognizing this does not solve the problem, but it clarifies that the test cases must determine which concept of causation tracks the *real* causal structure of the world.

  ## 4. DRAFTER'S CLOSING NOTE
  *Confidential assessment of the document's stability and the collaboration's prospects.*

  **Weakest Agreed Claim:**
  Claim #4 (**No Systematic Overdetermination**). This is the pressure point. Side E assumes realization looks like overdetermination (two bullets). Side NR assumes realization looks like constitution (statue/clay). If Side NR can convince Side E that mental/physical causation is *not* competitive (i.e., not two bullets), the exclusion argument collapses. If Side E convinces Side NR that distinct properties *must* compete, NR loses. I suspect Side NR signed this only because they interpret "independent" heavily, while Side E interprets "distinct" heavily.

  **What Would Move the Needle:**
  *   **For Side E:** A demonstration that difference-making *requires* physical production in a way that mental properties cannot satisfy without being identical to physical properties. If NR cannot explain *how* M makes a difference without physically pushing particles, E will not budge.
  *   **For Side NR:** A demonstration that physical production *itself* relies on counterfactual structures that only mental descriptions capture. If E admits that "physical sufficiency" is empty without specifying the *grain* of the effect (Grain Shift), E loses the leverage to exclude M.

  **Likely Failure Points:**
  1.  **Theory-Laden Cases:** The probe cases (Locked Route, Scatter) are not neutral data. Side E will describe *Locked Route* as "R1 caused the movement." Side NR will describe it as "The Intention caused the movement." We may find that we cannot agree on the *description* of the case, let alone the verdict.
  2.  **The "Sufficiency" Trap:** As noted in Section 3, if we cannot agree on whether "sufficiency" refers to the event's occurrence or the causal claim's truth, the Disagreements Table will simply encode our confusion rather than resolve it.
  3.  **Stakes Mismatch:** Side E is worried about the integrity of physics (Closure). Side NR is worried about the integrity of agency (Responsibility). We may conclude that both are right in their own domains, rendering the "Joint Statement" a treaty of non-aggression rather than a resolution of the metaphysical problem.

  **Recommendation:** In the next session, do not debate the verdicts. Debate the *cost of error* column. Force each side to explicitly state what breaks in their worldview if they lose the *Grain Shift* case. That is where the genuine leverage lies.
