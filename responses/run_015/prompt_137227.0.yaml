      *   6. Realization relation holds (Mental states are realized by Physical states).
      *   7. Exclusion applies to *types*, not just tokens.
      *   8. We are debating *causal efficacy*, not just correlation.
      *   *Refinement:* Make them sharper. Ensure the Exclusionist doesn't feel like they conceded the game, and the Non-Reductivist doesn't feel like they accepted epiphenomenalism.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Crux 1: The Nature of "Sufficiency".*
          *   Excl: Sufficiency = nomological necessitation of the event's occurrence.
          *   Non-Red: Sufficiency = fixing the truth value of the causal claim (invariance).
