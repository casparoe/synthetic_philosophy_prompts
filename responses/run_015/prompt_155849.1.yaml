  Dr. Credence sat behind his desk, polishing his betting quotients. Across from him sat Bookie Bayes, holding a ledger open to a blank page.

  "I maintain a robust epistemology," Credence announced. "I accept the Reflection Principle: my current credence in $H$, conditional on my future credence being $x$, must be $x$. I lock in my future betting prices."

  "And the expert testimony?" Bayes asked, pen hovering.

  "Ah, the Convex Skepticism Filter," Credence smiled. "Experts are overconfident. If an expert says 0.9, I discount it convexly to 0.6. But if they say 0.1, I barely adjust. It protects against hubris."

  Bayes nodded slowly. "So, regarding Proposition $H$: The Expert says 0.9. Your current credence $P_{now}(H)$ is 0.6."

  "Correct."

  "But you know that tomorrow, after observing the direct evidence $E$, your filter no longer applies. You'll update linearly. Your future credence $P_{tomorrow}(H)$ will be 0.9."

  "Naturally. Direct evidence trumps the filter."

  "And you accept Reflection?"

  "Absolutely. $P_{now}(H \mid P_{tomorrow}(H) = 0.9) = 0.9$."

  Bayes wrote two lines in the ledger. "Excellent. I'd like to place two bets. First, I'll buy a bet from you on $H$ at your current price. You sell me a ticket for \$0.60 that pays \$1.00 if $H$."

  Credence signed. "Fair. That's my filtered price."

  "Second," Bayes continued, "I'll sell you a conditional bet. It costs \$0.90. It pays \$1.00 if $H$ *and* $P_{tomorrow}(H) = 0.9$."

  Credence paused. "Well, by Reflection, conditional on my future self believing 0.9, the value is 0.9. So that's a fair price." He signed.

  "Done," Bayes said, closing the ledger. "Tomorrow, the evidence arrives. Your credence becomes 0.9. The condition is met."

  "Okay..."

  "If $H$ is true, I pay you \$1.00 on the second bet, you pay me \$1.00 on the first. Net zero."

  "And if $H$ is false?"

  "Nobody pays anything on the outcomes. Net zero."

  Credence frowned, looking at the cash flow. "But... I paid you \$0.90 for the second bet, and you paid me \$0.60 for the first."

  "Exactly," Bayes said, standing up. "You've lost \$0.30 regardless of the truth of $H$."

  "But I can't escape!" Credence cried. "If I raise my current price to avoid the loss, I violate my Skepticism Filter! If I lower the conditional price, I violate Reflection!"

  Bayes tipped his hat. "You're not incoherent, Doctor. You're just arbitrage-proof against yourself."

