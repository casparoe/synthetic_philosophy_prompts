answer: |-
  Hey, I feel your pain. That line—"You couldn't have come from different sperm and egg, that's just obvious"—is the metaphysical equivalent of a door slam. It feels deep, but it's actually a black box hiding a bunch of distinct (and often incompatible) mechanisms. If you let them keep using it as a monolith, they're going to walk away thinking Kripke proved biology rather than modal logic.

  Here is the teardown you need to hand them. It disambiguates the slogan into four distinct readings, rates their plausibility, and checks whether they actually support the "not me" conclusion. Then we'll hit that Gamete vs. Zygote distinction hard.

  ### The Menu of Readings

  **1. The Hard Metaphysical-Necessity Claim (Kripkean)**
  *   **The Claim:** In any possible world where *I* exist, the very particular material substances (this sperm $S$ and this egg $E$) that originated me must have united. It's a brute modal fact.
  *   **Plausibility:** High intuitive pull, but philosophically expensive. It treats origins as rigid designators.
  *   **Does it get the conclusion?** Yes, but only by fiat. It asserts the conclusion rather than explaining it.
  *   **Verdict:** **Substantive but Question-Begging.** It stops the argument because it defines "me" by "this origin." It doesn't explain *why* the origin matters, just that it does.
  *   **The Trap:** It falls apart if you ask *why*. If the student says "because it's necessary," you ask "what grounds that necessity?" If they can't answer, it's dogma.

  **2. The Genetic-Identity Claim**
  *   **The Claim:** I am essentially my genome. Different sperm/egg $\rightarrow$ different DNA $\rightarrow$ different person.
  *   **Plausibility:** Low. Biologically naive.
  *   **Does it get the conclusion?** No. It fails on edge cases.
  *   **Verdict:** **False.**
  *   **The Trap:** Monozygotic twins. They have (roughly) the same genome but are numerically distinct people. If I am essentially my genome, and my twin has my genome, am I my twin? Also, somatic mutation means my genome at birth $\neq$ my genome now. If identity tracks DNA, I die every time a cell mutates.
  *   **IVF Check:** If you use IVF to clone me (nuclear transfer), I have the same DNA but a different origin. Most people intuitively say the clone is a sibling, not me. So DNA isn't sufficient for identity.

  **3. The Psychological-Continuity (Causal) Claim**
  *   **The Claim:** My current mental life is causally dependent on *this* specific conception event. A different sperm/egg breaks the causal chain required for *my* consciousness.
  *   **Plausibility:** Medium. It aligns with Lockean views, but conflicts with biological views of human identity.
  *   **Does it get the conclusion?** It gets a "different person" verdict, but for the wrong reason.
  *   **Verdict:** **Category Error.** This seminar is about *human* identity (organism), not *person* identity (psychology).
  *   **The Trap:** If a different sperm fertilized the egg but produced a being with my exact memories and psychology (magic scenario), is it me? If they say "no," they are biological essentialists. If "yes," they are psychological continuity theorists. This slogan conflates the two.

  **4. The Social/Narrative Claim**
  *   **The Claim:** "Me" is a node in a specific social history. I am the child of *these* parents in *this* relationship.
  *   **Plausibility:** High for social identity, zero for metaphysical identity.
  *   **Does it get the conclusion?** No.
  *   **Verdict:** **Trivial.** Of course your social narrative changes if your parents are different. But metaphysics asks if the *organism* could exist without that narrative.
  *   **The Trap:** This makes identity externalist. It means I wouldn't exist if my parents hadn't met, even if the biological material was identical. It's interesting sociology, but it doesn't solve the modal problem of transworld identity.

  ---

  ### The Niche Distinction: Gamete vs. Zygote Essentialism

  This is where you can really wake them up. The slogan says "sperm and egg," but the metaphysics often hinges on the *fusion*.

  **The Scenario:** IVF. Your mother's egg ($E$) is fertilized.
  *   **World A (Actual):** Sperm $S_1$ fertilizes $E$. Result: You.
  *   **World B (Counterfactual):** Sperm $S_2$ (from the same father, genetically nearly identical to $S_1$) fertilizes $E$. Result: ?

  **1. Gamete Essentialism**
  *   **The View:** The particular haploid cells are essential.
  *   **Verdict on Scenario:** **Not You.** Since $S_2 \neq S_1$, the origin is different. You are not born in World B.
  *   **Why:** It treats the gametes like raw materials. If you build a statue from different clay, it's a different statue (for some hylomorphists).
  *   **Problem:** Gametes are constantly produced and destroyed. Why is *this* specific microscopic cell essential when the parents' bodies persist?

  **2. Zygote Essentialism**
  *   **The View:** The particular fertilized cell (the diploid zygote) is essential.
  *   **Verdict on Scenario:** **Not You.** $S_1 + E$ creates Zygote $Z_1$. $S_2 + E$ creates Zygote $Z_2$. Since $Z_1 \neq Z_2$, the person originating from $Z_2$ is not you.
  *   **Why:** This is the standard Kripkean reading. The origin is the *start of the organism*.
  *   **Problem:** **Embryo Splitting.** If $Z_1$ splits into Twin A and Twin B, which twin is the "original" zygote person?
      *   If Zygote Essentialism is true, the person is identical to the zygote.
      *   But one zygote $\neq$ two people.
      *   Therefore, the zygote cannot be strictly identical to the person. It's a precursor.
      *   *Student Check:* If the zygote splits, did the original person die and two new ones begin? Or was the zygote never a person yet? If the latter, then "zygote essentialism" is false; it should be "fetus essentialism" or something later.

  **3. Genetic Essentialism (The Wildcard)**
  *   **The View:** The code matters, not the matter.
  *   **Verdict on Scenario:** **Maybe You.** If $S_2$ is genetically identical to $S_1$ (impossible naturally, possible in thought experiment), then $Z_2$ has the same code as $Z_1$.
  *   **Why:** This bypasses the material history.
  *   **Problem:** As mentioned, twins kill this. Same code, two people. So even if the code is identical in World B, it might just be a twin, not *you*.

  ---

  ### How to Deploy This in Seminar

  Tell your students their slogan is doing too much heavy lifting. It conflates **Material Origin** (Gametes), **Structural Origin** (Genome), and **Historical Origin** (Causal Chain).

  **The "Shut Down the Shutdown" Move:**
  Ask them: *"Is it the matter or the history?"*
  *   If it's the **matter** (Gamete Essentialism): What if we swap molecules in the sperm one by one until it's entirely new matter but functionally identical? At what point do I cease to exist? (Sorites problem).
  *   If it's the **history** (Zygote Essentialism): What about the twins? One zygote, two histories. Which one is the "real" origin?
  *   If it's the **code** (Genetic Essentialism): Then a clone is me. Do you believe in clones being you?

  **The Verdict Summary for the Board:**
  *   **Hard Metaphysical Claim:** Substantive, but needs grounding. (Don't accept "it's just obvious".)
  *   **Genetic Claim:** False (Twins/Clones).
  *   **Psychological Claim:** Wrong category (Person vs. Organism).
  *   **Gamete vs. Zygote:** Gamete is too granular (molecular swap); Zygote fails the branching test (twins).

  **Final Tip:**
  Push them on the **Intrinsic vs. Extrinsic** distinction. Origin essentialism makes my identity dependent on something *external* to me (my parents' actions). If identity is intrinsic, how can what happened *before* I existed determine *who* I am across worlds? That's the real metaphysical meat. The sperm/egg line is just the wrapper.

  Get them to argue about the wrapper, and you win the seminar. Good luck.
