answer: |-
  # JOINT STATEMENT ON CHANCE, CREDENCE, AND CLIMATE ENSEMBLES
  **Prepared by the Adversarial Collaboration Working Group**
  **Date:** October 26, 2023
  **Signatories:** The Principalist Bloc; The Calibrationist Bloc

  ## 1. AGREED CLAIMS
  We, the undersigned, acknowledge that our dispute has been hindered by imprecise framing. We commit to the following premises as the baseline for all further dialectic. We affirm these claims jointly:

  1.  **Formal Structure of the Principal Principle (PP):** We agree that the normative core of the debate is David Lewis's Principal Principle. Formally: $C(A | Ch(A) = x \ \& \ E) = x$, where $C$ is rational credence, $Ch$ is objective chance, $A$ is a proposition about an event, $x$ is a real number, and $E$ is any *admissible* evidence. We agree that the dispute is not about the logic of this conditional, but about the satisfaction of its antecedents in climate science.
  2.  **The Admissibility Constraint:** We agree that evidence $E$ is "inadmissible" if it provides information about the truth of $A$ that is not mediated by the chance $Ch(A)$. We agree that if $E$ is inadmissible, the PP does not mandate deference to $x$. We disagree only on whether specific types of model-knowledge count as $E$ (admissible) or as information that negates $Ch(A)=x$.
  3.  **Behavior of Ensemble Forecasting:** We agree that operational climate ensembles are generated by deterministic dynamical systems. The "spread" or probability distribution arises from perturbing initial conditions and parameters, not from stochastic terms in the governing equations (excepting sub-grid parameterizations treated as noise). We agree these systems exhibit computational irreducibility and sensitivity to initial conditions (chaos).
  4.  **Normative Responsiveness:** We agree that rational belief must be responsive to evidence. No agent is required to hold a credence that they know to be systematically disconnected from observed frequencies. If a principle mandates a credence known to be erroneous, the principle or its application is flawed.

  ## 2. DISAGREEMENTS TABLE
  *The following positions are stated in the preferred terminology of each camp, vetted by their respective advocates to ensure accuracy.*

  | Feature | **The Principalist Position** | **The Calibrationist Position** |
  | :--- | :--- | :--- |
  | **Status of Ensemble Spread** | The spread of a well-constructed ensemble represents the **objective physical propensity** of the climate system. Because the system is computationally irreducible, the macro-level uncertainty is ontologically equivalent to chance, regardless of micro-level determinism. | The spread of an ensemble is a **measure of epistemic uncertainty** regarding a deterministic trajectory. It is a constructed metric of model disagreement, not a physical property of the atmosphere. |
  | **Deference Condition** | An agent must defer to the ensemble probability ($x$) **if and only if** the ensemble is physically validated. If the agent knows the model is biased, the value $x$ is not the *true* objective chance. The PP requires deference to the *true* chance, not the raw model output. | An agent should **not** treat the ensemble probability as a chance variable requiring deference. Expert knowledge of structural bias is **admissible evidence** that overrides the model output. The link between "model probability" and "credence" is broken by expert judgment. |
  | **Role of Bias Correction** | Bias correction is a procedure to identify the *true* $Ch(A)$. Once corrected, the PP applies strictly. To ignore the corrected chance is irrational. | Bias correction demonstrates that the "chance" label was a misnomer. We adjust credence based on **reliability**, not because we have found a hidden physical propensity. The PP is the wrong normative framework for engineered forecasts. |
  | **Metaphysical Commitment** | Objective chance is compatible with determinism, provided the outcome is unpredictable in principle from the agent's epistemic standpoint (compatibilist chance). | Objective chance requires physical indeterminism. In a deterministic domain, all probabilities are subjective or intersubjective degrees of confirmation, not "chances" to which one defers. |

  ## 3. CRUXES AND EMPIRICAL PREDICTIONS
  *We identify two sub-questions (cruxes) that resolve the theoretical impasse. For each, we specify a concrete scenario and record the divergent predictions.*

  ### Crux 1: The Metaphysics of Macro-Probability
  **Question:** Does determinism at the micro-level undermine the objectivity of macro-level ensemble probabilities?
  **Scenario:** A "Perfect Model" experiment. A high-resolution climate model is run on a supercomputer. It is deterministic. We generate an ensemble by perturbing initial conditions within measurement error. The ensemble predicts a 70% chance of El Niño. The system is physically deterministic.
  **Evidence Bearing on Crux:** Long-run frequency verification of the "Perfect Model" against its own truth-run.

  | Camp | Prediction / Interpretation |
  | :--- | :--- |
  | **Principalists** | If the long-run frequency of El Niño in the ensemble matches the 70% prediction over many trials, this **constitutes** objective chance. The micro-determinism is irrelevant because the macro-outcome is inaccessible. The agent ought to hold 0.7 credence. |
  | **Calibrationists** | Even if the frequency matches, this is merely **statistical reliability**, not chance. The agent holds 0.7 credence because the model is reliable, not because they are deferring to a physical propensity. If the agent discovers the deterministic seed, the "chance" vanishes; therefore, it was never objective chance. |

  ### Crux 2: Calibration Records as Admissibility
  **Question:** Does an agent's awareness of her own calibration record count as inadmissible self-locating information?
  **Scenario:** A regional forecaster uses Model X. Model X outputs a 90% probability of extreme precipitation ($Ch(E)=0.9$). The forecaster knows from a local calibration record that Model X systematically overestimates extreme precipitation in this specific topography by a factor of 2 (true frequency is ~45%).
  **Evidence Bearing on Crux:** The local verification dataset showing the systematic divergence between model output and observed frequency.

  | Camp | Prediction / Interpretation |
  | :--- | :--- |
  | **Principalists** | The forecaster's credence should be **0.45**. However, this is because the *true objective chance* $Ch(E)$ is 0.45, not 0.9. The model output of 0.9 was false information about the chance. The calibration record reveals the true $Ch(E)$. The PP is upheld (defer to true chance). |
  | **Calibrationists** | The forecaster's credence should be **0.45**. This is because the calibration record is **admissible evidence** that trumps the model's claim. The model output is not "false chance"; it is "inadmissible testimony." The PP is suspended because the evidence $E$ (bias record) screens off the model output. |

  ## 4. VERBAL DISPUTE IDENTIFICATION
  *We acknowledge that a portion of this dispute is verbal rather than substantive.*

  **The Dispute:** The definition of "Objective Chance."
  **Precise Location:** The disagreement centers on whether the term "Objective Chance" refers to:
  1.  **A Metaphysical Property:** A mind-independent propensity or stochastic feature of the laws of nature (Principalist requirement).
  2.  **A Functional Role:** Any probability value that plays the role of guiding credence in the face of irreducible uncertainty, regardless of underlying determinism (Calibrationist observation of scientific practice).

  **Why it is Verbal:** If the Principalists concede that "chance" can be compatibilist (macro-level objective uncertainty in deterministic systems), and the Calibrationists concede that "deference" is the correct normative term for reliable model output, the substantive disagreement regarding *what credence to hold* (e.g., 0.45 vs 0.9 in Crux 2) largely dissolves. Both sides agree the agent should believe 0.45. They disagree only on whether that 0.45 is derived via the Principal Principle (as the *true* chance) or via direct evidence (bypassing the Principle).

  ## 5. RESIDUAL DISAGREEMENT
  *Even accounting for verbal variance, the following substantive disagreement remains:*

  **The Normative Source of Constraint:**
  The Principalists maintain that rational credence is constrained by the **world's structure** (the objective chance). If an agent's credence diverges from the objective chance (once known), the agent is in a state of cognitive error, regardless of their evidence processing.

  The Calibrationists maintain that rational credence is constrained by the **agent's evidence**. If an agent's credence diverges from the model output because of bias evidence, the agent is rational, even if the model output was labeled "objective chance."

  **Final Framing:**
  Does the Principal Principle describe a fundamental law of rationality linking minds to physical propensities (Principalist), or is it a heuristic that collapses into standard Bayesian updating when "chance" is understood as a fallible empirical hypothesis about frequency (Calibrationist)? We leave this metaphysical question open.
