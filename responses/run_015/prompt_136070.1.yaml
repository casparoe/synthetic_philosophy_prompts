  **DEPARTMENT OF ONTOLOGICAL STABILITY**
  **BUREAU OF NARRATIVE GRAVITY (BNG)**
  **PUBLIC FAQ SERIES 404: SELFHOOD AND COMPLIANCE**

  **1. Q: My birth certificate lists my status as "Fictional Protagonist (Class I)." Is this a clerical error?**
  A: No. Under Statute 44-Phi, all citizens are legally recognized as centers of narrative gravity rather than immutable metaphysical substances. The disclaimer indicates that your existence is contingent upon the coherence of your autobiographical text. Should your plot thicken excessively without resolution, the State reserves the right to edit subsequent chapters for clarity. Citizens attempting to claim "soul-based" exemptions from taxation will be referred to psychiatric maintainence.

  **2. Q: I suffered partial amnesia following a minor accident. Do I need to file for Continuity Renewal?**
  A: Yes. If memory loss exceeds 15% of your established backstory, your Gravitational Coherence Quotient (GCQ) may fall below the statutory threshold for personhood. Applicants must submit Form 88-Beta alongside three character witnesses capable of reciting your past preferences verbatim. Failure to renew results in reclassification as a "Minor Character," stripping you of voting rights and inheritance liabilty. Note that recovered memories not fitting the established genre may be redacted.

  **3. Q: I have radically changed my political and moral values. Is this considered a Branching Narrative?**
  A: Potentially. Sudden shifts in core values often indicate a splintering of the central narrative thread. If your new values contradict prior sworn testimony, you must petition the Counter-Narrative Appeal Board. They will determine if you are the same protagonist undergoing development or a sequel entity requiring a new Social Security number. Please be advised: Sequel entities are not responsible for the debts of the original run, though creditors may pursue the author.

  **4. Q: Can I be sued for inconsistencies in my personal story?**
  A: Absolutely. Inconsistencies constitute negligence in self-authorship. If a plot hole causes financial damage to a dependent party (e.g., promising to attend an event you later claim you never agreed to), you are liable for breach of contract. The Court views contradictory statements not as lies, but as canonical errors requiring retroactive patching. Repeated offenses may lead to mandatory ghostwriting services.

  **5. Q: What is the protocol for the Day of Indeterminacy?**
  A: On this holiday, citizens celebrate the absence of any further fact of the matter regarding personal identity. Work is prohibited, as labor implies a continuous agent performing tasks. Instead, citizens are encouraged to swap diaries with strangers to reinforce the communal nature of authorship. Please ensure all exchanged journals are notarized to prevent ontological drift. Enjoy the break; nothing really happened anyway.
