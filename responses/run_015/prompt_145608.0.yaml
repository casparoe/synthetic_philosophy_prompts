  ### The Case: The Global Topological Constraint

  **The Scenario**
  Imagine a universe that is spatially finite but unbounded, with the topology of a 3-sphere ($S^3$). The universe contains a distribution of matter and fields that agrees perfectly with standard local dynamical laws (e.g., General Relativity and the Standard Model). Crucially, both the Humean and the Anti-Humean agree on every particular matter of fact: they agree on the metric field values at every point, the distribution of matter, and the global topological structure. They agree that the universe *is* simply connected and *is* a 3-sphere. There is no empirical disagreement.

  **The Candidate Law**
  Consider the proposition: **"Spacetime must be simply connected."**
  This is not a universal generalization over local events (like "all electrons repel"). It is a **global structural constraint**. It fixes a topological property of the entire manifold at once. It does not describe a regularity among distinct parts of the mosaic; it describes a condition on the mosaic as a whole.

  ### The Divergence

  **The Humean Verdict: Not a Law**
  For the strict Lewisian Humean, laws of nature are the axioms and theorems of the *Best System*—the deductive system that best balances simplicity and strength in summarizing the *Humean Mosaic* (the totality of local particular facts).
  *   **Reasoning:** The Humean mosaic consists of local qualities at spacetime points. A statement about the *global topology* is a singular proposition about the entire domain of the mosaic, not a generalization over its contents. While the statement "Spacetime is simply connected" is true, it functions as a **boundary condition** or a **frame** for the mosaic, not a regularity *within* it.
  *   **Classification:** The Humean classifies this as a **cosmic accident** or a **brute fact** about the world's container. It is not a law because it lacks the requisite *generality*. It does not systematize distinct events; it merely describes the stage on which they occur. Even if adding it to the Best System saves space (simplicity), it violates the categorical requirement that laws be *generalizations* over local matters of fact.

  **The Anti-Humean Verdict: Is a Law**
  For the Anti-Humean (e.g., a Primitivist or a Dispositionalist), laws are ontologically distinct entities (relations between universals, powers, or primitive modal facts) that constrain or ground the mosaic.
  *   **Reasoning:** The Anti-Humean holds that the structure of spacetime itself can be nomological. The simple connectivity of the universe is not merely a summary of local points; it is a **constraint** that explains why certain global configurations (like wormholes or non-trivial loops) are absent. It is a fundamental feature of reality that *restricts possibility*.
  *   **Classification:** The Anti-Humean classifies this as a **fundamental law**. It is a law precisely because it is a global constraint that is not reducible to the local facts it governs. The fact that it applies to the universe as a whole (a "one-off" structural fact) does not disqualify it; rather, it highlights that laws can be conditions on the *existence* of the mosaic, not just patterns within it.

  ### Why This Avoids the Excluded Disputes

  1.  **Not an Empirical Disagreement:** Both sides agree the universe *is* simply connected. They are not arguing about the topology; they are arguing about whether that truth counts as *nomological*.
  2.  **Not the Governing vs. Describing Dispute:** The standard "governing" dispute asks whether laws *make* the facts obtain (modal force). Here, we can bracket that. Even if we ask only "Is this proposition part of the set of laws?", they disagree. The Humean says "No, it's a fact." The Anti-Humean says "Yes, it's a law." This is a disagreement about the **extension** of lawhood, not just its modal flavor.
  3.  **Not the Simplicity-Strength Trade-off:** The Humean does not reject the candidate law because it is too complex or weak. They reject it because it is the **wrong logical form** (singular vs. general). The Anti-Humean does not accept it because it simplifies the system, but because it represents a **real constraint**. The divergence persists even if the proposition is maximally simple and strong.

  ### The Real Fault Line Revealed

  This case reveals that the fundamental fault line between Humeanism and Anti-Humeanism is not merely about modal force or systematization, but about **Supervenience vs. Autonomy**.

  *   **The Humean Commitment:** Laws must **supervene on local regularities**. A truth that cannot be analyzed as a pattern of local occurrences (like a global topological fact) cannot be a law, because there is nothing in the local mosaic to ground it other than the totality itself. For the Humean, a "law" that applies only to the whole universe is indistinguishable from a "fact" about the whole universe.
  *   **The Anti-Humean Commitment:** Laws can be **autonomous structural constraints**. Reality possesses nomic features that are not exhausted by local patterns. A global constraint is a law *because* it restricts the space of possible mosaics, regardless of whether it manifests as a repeating local regularity.

  In short, the Humean demands that laws be **immanent** (found within the patterns of the mosaic), while the Anti-Humean allows laws to be **transcendent** (standing over the mosaic as a condition of its possibility). The "Global Topological Constraint" forces this divide into the open because it is a truth about the world that is structurally law-like but factually singular.
