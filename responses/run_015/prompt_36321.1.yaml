answer: |-
  **The question, stated precisely**

  The Repugnant Conclusion arises when a population ethics framework prefers a vast population with lives barely worth living over a smaller, happier population. This project investigates whether this result relies on an equivocation about what constitutes a "life barely worth living." Specifically, it asks whether a population axiology sensitive to the temporal distribution of wellbeing within a life—distinguishing between uniformly drab existence and varied lives with significant peaks and valleys—can block the conclusion without generating new absurdities. The core hypothesis is that the repugnance is driven not by the total sum of wellbeing, but by the flatness of the lives involved, and that correcting for this shape may dissolve the problem.

  **Why the existing debate leaves it open**

  The standard landscape of population ethics treats individual lives as containers of value, where only the total volume matters. Totalism, the view implicit in most cost-effectiveness models, simply sums these containers. It accepts the Repugnant Conclusion as a mathematical necessity: enough small positive values will always outweigh a few large ones. Averagism attempts to avoid this by maximizing mean wellbeing, but it fails to capture the intuition that adding happy lives is good, and it implies we should eliminate those below the average. Person-affecting views restrict moral concern to those who actually exist, avoiding the conclusion by denying that potential people count, but this collapses under non-identity problems where choices determine who exists in the first place.

  Critical-level views set a threshold above neutral wellbeing that a life must reach to count as a positive addition. While this blocks the conclusion by dismissing barely-positive lives, the threshold appears arbitrary and risks implying that adding lives slightly below the line is bad, even if those lives are worth living. Lexical views argue that some higher qualities of life are incomparably better than lower ones, preventing trade-offs entirely. However, these views often violate continuity conditions and struggle to explain why a massive number of high-quality lives shouldn't outweigh a small number of slightly higher-quality ones.

  All these escape routes operate on lifetime totals. They ask how much wellbeing a life contains, not how that wellbeing is structured. None of them isolate the within-life distribution of wellbeing as a variable. They are indifferent between a life of monotonous, marginal comfort and a life of profound struggle punctuated by transcendent joy, provided the integrals are identical. This blind spot leaves open the possibility that the repugnance is not about population size or total utility, but about the qualitative texture of the lives being added. If the "barely worth living" lives in the repugnant scenario are conceived as uniformly drab rather than variated, the intuition against them may stem from a dislike of flatness rather than population size. Existing theories lack the vocabulary to capture this distinction, leaving the question genuinely open for a shape-sensitive approach.

  **Approach**

  The research will proceed over three months of part-time work, moving from conceptual clarification to formal testing. The first month will focus on formalizing the concept of "shape." I will define mathematical representations for intra-personal wellbeing distribution, specifically looking at variance, skew, and peak intensity over time. This requires moving beyond a single scalar value per person to a function mapping time to wellbeing. I will need to determine which features of the shape are morally salient. For example, does a life with a single peak of ecstasy outweigh a life of steady contentment? Or is there a penalty for excessive variance? The output of this month will be a set of candidate metrics for within-life value that diverge from simple summation.

  In the second month, I will construct candidate axiologies using these metrics. I will develop at least two distinct models. The first will be a "peak-weighted" view, where moments above a certain threshold contribute disproportionately to the life's value. The second will be a "variance-sensitive" view, which might penalize uniformly flat lives even if their total is positive. These models will be integrated into a population-level framework to see how they handle trade-offs between population size and individual life quality. I will examine how these views handle the transition from the happy population to the repugnant one, checking if the shape-sensitive metrics drop off faster than the population size grows, thereby blocking the conclusion.

  The third month will be dedicated to stress-testing these models against standard impossibility constraints. I will test the shape-sensitive views against adequacy conditions such as Pareto efficiency (if everyone is better off, the world is better), Non-Elitism (no single life should dominate all others), and Avoidance of the Sadistic Conclusion (avoiding worlds where everyone suffers). The goal is to see if introducing shape-sensitivity simply shifts the impossibility result elsewhere. I will also begin to articulate an independent motivation for shape-sensitivity to counter the charge that it is merely engineered to avoid the Repugnant Conclusion. This involves drawing on psychological data about how people value experiences over time to see if the proposed metrics align with reflective intuitions about a good life, independent of population cases.

  **What a result would look like**

  A successful outcome would be a principled shape-sensitive axiology that avoids the Repugnant Conclusion without violating independently compelling adequacy conditions. This theory would demonstrate that adding trillions of flat, drab lives does not increase value because the marginal contribution of a "flat" positive life diminishes faster than a "varied" positive life. It would provide a formal justification for the intuition that a world of rich, complex lives is preferable to a world of monotonous ones, even if the latter has a higher aggregate sum. This would offer a novel escape route from the impossibility theorems that plague current population ethics.

  However, an instructive failure is equally valuable. The most likely failure mode is the "Ecstatic Spikes" conclusion. A shape-sensitive theory might inadvertently imply that a world containing a few individuals experiencing brief moments of extreme ecstasy is better than a world of billions living long, contented lives. If the model weights peaks too heavily, it could endorse sacrificing stability for intensity in ways that are just as counterintuitive as the Repugnant Conclusion. Demonstrating this trade-off would clarify the boundaries of the problem, showing that we cannot escape repugnance simply by adjusting how we measure individual lives. It would reveal that the tension lies deeper, perhaps in the conflict between total value and the quality of experience itself. Either result advances the debate by isolating within-life distribution as a critical variable previously ignored.

  **Failure conditions and scope**

  Three months of part-time research is a tight constraint for formal ethics. The primary risk is that the formalization in month one proves intractable, leaving insufficient time for the impossibility testing in month three. If this occurs, the scope will be cut to producing a conceptual framework and intuitive case studies rather than a full formal proof. Additionally, I must be candid about the strongest philosophical objection: that shape-sensitivity is ad hoc. Unless I can motivate the preference for varied lives independently of its convenient ability to block the Repugnant Conclusion, the theory will look like gerrymandering. If I cannot find independent psychological or ethical grounding for weighting peaks or variance during the research period, the project may conclude that while the equivocation exists, it cannot be leveraged into a coherent moral theory. This negative result is still useful, as it closes off a promising avenue, but it falls short of providing a usable alternative axiology.

  **Why this matters for grantmaking**

  This research directly impacts how we evaluate global health interventions. Our current cost-effectiveness model aggregates wellbeing gains, implicitly treating a year of life saved as a uniform unit of value. This influences decisions between funding many interventions that provide small, steady benefits versus fewer interventions that might create transformative but uncertain outcomes. If the shape of wellbeing matters, then funding strategies that create peaks of health or capability might be morally superior to those that merely extend flat existence. Understanding whether we should prioritize the intensity of benefits over the sheer number of beneficiaries could shift our portfolio strategy. For a trustee, this offers a rigorous way to defend prioritizing high-impact, transformative grants over diffuse, marginal gains without abandoning cost-effectiveness analysis entirely.
