  1. The theory must distinguish logical impossibility from economic friction, because refactoring is often physically possible but financially forbidden; this is non-negotiable.
  2. It must specify whether transition requires a catastrophic jump or allows incremental stepping, since big-bang migrations are where projects die; this is non-negotiable.
  3. It needs to separate the claim that history mattered from the claim that the current state is worse than a specific named alternative, which is negotiable.
  4. The definition of lock-in must scale with the agent's power, as a regulator can break monopolies that stall startups; this is non-negotiable.
  5. It must account for whether constraints are visible in the code or hidden in organizational memory, since invisible debts cannot be budgeted; this is negotiable.
  6. It must explain why the system stays put without external enforcement, distinguishing inertia from active resistance, which is negotiable.
  7. You cannot jointly satisfy the demand for complete historical reconstruction and the demand for present-state actionability, because tracing every dependency paralyzes intervention. I would drop complete historical reconstruction in favor of mapping current transition costs.
  8. The requirement that the theory must prescribe a perturbation budget excludes most descriptive histories that lack a mechanism for change. The lock-in story fails this by assuming transition costs are infinite, while the convergence story fails by assuming optimal states are easily reachable regardless of history.
