    "survival_is_evidence": "weak but non-zero",
    "deletion_asymmetry_enough": "only for a weaker thesis",
    "surviving_thesis": "Caution is warranted because institutional functions are opaque and removal is irreversible, not because survival proves fitness.",
    "runner_up": "4 to 5"
  }
