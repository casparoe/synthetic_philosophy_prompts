answer: |-
  The break in your colleague's argument occurs at the inference from (3) to (4). While premise (3) correctly identifies that institutional selection pressures are weak compared to market competition, it does not follow that survival provides *no* epistemic evidence. This is a classic error of treating a noisy signal as if it were pure noise. Even if inertia and lock-in explain most survival, the fact that an institution *did* survive a changing environment without causing systemic collapse retains some informational value, however slight. By leaping from "selection is weak" to "survival is no evidence," the argument creates a false dichotomy that clears the ground for the rationalist planning in (5) too easily.

  This addresses your second question: the move from (2)'s "tested" through (3)'s "survived" to (4)'s "fit" is indeed doing unwarranted work. It conflates "imperfectly tested" with "untested." If you keep (3) but reject the inference to (4), you acknowledge that institutions are sticky and imperfectly selected without conceding that they are epistemically blank. The cost of this rejection is symmetric: the conservative must surrender the strong Burkean claim that tradition encodes ancestral wisdom (survival proves fitness), but the reformer must surrender the rationalist license to treat the status quo as a blank slate (survival proves nothing). You are left with a modest epistemic presumption rather than a strong one.

  Regarding your first question on the deletion asymmetry in (6): this principle saves Chesterton's Fence as a rule of caution, but it does not deliver Burkean conservatism as a doctrine. Burke's argument was fundamentally epistemic (the past knows better than the present), whereas (6) is purely decision-theoretic (option value and irreversibility). A rationalist planner can accept (6) without accepting Burke's distrust of abstract planning; they simply add "irreversibility" as a variable in their calculation. Therefore, (6) supports only a weaker thesis of instrumental caution, stripping the fence of its philosophical conservatism while keeping its practical advice.

