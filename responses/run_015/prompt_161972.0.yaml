answer: |-
  Here is the principle that organizes your intuitions, followed by the application to your new cases and an honest audit of where your original verdicts might need adjustment.

  ### The Principle: Normative Expectation of Candor

  The wrong-making feature of deception does not live in the linguistic mechanism (what you literally say) nor solely in the outcome (what the hearer believes). It lives in the **violation of the conversational contract.**

  Every interaction carries a tacit agreement about how much truth the hearer is entitled to expect from the speaker. When you mislead, you are exploiting the gap between what the hearer is *entitled* to expect and what you are *providing*.

  **The Rule:**
  Deception (whether by lie, implication, or silence) is morally wrongful to the degree that it violates a **Duty of Candor** owed to the hearer in that specific context.

  This Duty of Candor is determined by two variables:
  1.  **Reliance:** Does the hearer depend on you for accurate information to make decisions or maintain well-being? (High in family/colleagues, low in strangers).
  2.  **Process Integrity:** Does the interaction serve a system that requires truth to function? (High in legal/administrative settings, low in social advocacy).

  **Why this solves your confusion:**
  *   **Case 1 (Reference Letter):** The reader knows this is advocacy, not a neutral audit. Their entitlement is to a *curated endorsement*, not a full personnel file. You haven't violated the contract; you've fulfilled the role.
  *   **Case 2 (Neighbor):** Neighbors have a mutual aid contract. By saying "I didn't take it," you exploit their entitlement to your help to hide information they rely on. That is a breach of trust.
  *   **Case 5 (Grant Deadline):** Colleagues have a high duty of cooperation. Silence here isn't neutral; it's active sabotage of a shared process.
  *   **Case 8 (The Chair/Lawyer):** This is the strongest violation. In accountability processes, the group is entitled to clear claims they can challenge. "Mistakes were made" is designed to be unchallengeable. It corrupts the mechanism of correction. That is why it feels worse than a lie: a lie can be caught; obfuscation stops the game entirely.

  ### Where the Wrong-Making Feature Lives
  You asked if the wrong is in what the speaker does or what happens to the hearer. Under this principle, it is neither. It is in the **relationship**.

  If you tell a lie to a stranger who doesn't care (Case 3, the ring), there is no breach because there was no entitlement to the truth. If you stay silent with a colleague who relies on you (Case 5), it is a breach because the relationship demands support. The moral weight is in the **betrayal of the specific normative expectation** attached to that role.

  ### Verdicts on Your Three New Cases

  **(i) The Doctor and the Biopsy**
  *   **Verdict:** Wrong (Misleading).
  *   **Reasoning:** This is a high-reliance fiduciary relationship. The patient is entitled to the doctor's best professional assessment to prepare emotionally and logistically. While "we'll know more" is literally true, it exploits the patient's reliance on the doctor's authority to manage the doctor's discomfort with delivering bad news.
  *   **Nuance:** If the 90% certainty is not medically actionable yet, the doctor has a duty to manage hope, but should not imply uncertainty where there is near-certainty. A better phrasing: "The signs are concerning, and we need to prepare for that possibility."

  **(ii) The Delivery App**
  *   **Verdict:** Wrong (Misleading).
  *   **Reasoning:** This is a commercial contract. You are entitled to accurate data to make a purchasing decision. The app is manipulating your reliance on its interface to steer you toward a partner restaurant or balance their driver load. This violates the consumer contract. It is Case 5 (colleague sabotage) applied to a customer.

  **(iii) The Friend's Book**
  *   **Verdict:** Permissible (Politeness).
  *   **Reasoning:** In close social relationships, there is often a competing duty: *Support* vs. *Honesty*. Unless the friend explicitly asked for a critique ("Tell me what you really think"), the normative expectation is encouragement. "So you!!" signals "I support you," which is the truth of the relationship, even if "I loved the prose" is not. This aligns with Case 1 (Advocacy). You are acting as a friend-advocate, not a critic.

  ### Audit: Which of Your Verdicts Must Be Overturned?

  Your intuitions are remarkably consistent, but my principle forces a hard look at two of them.

  **1. Case 7 (The Dad with Dementia)**
  *   **Your Verdict:** Ambivalent/Torn.
  *   **My Principle's Verdict:** **Wrong, but excused.**
  *   **Why:** Strictly speaking, this violates the Duty of Candor. Your father has a high reliance on you for reality-testing. "She's resting" cultivates a false belief. However, this is the one case where the **Duty of Non-Maleficence** (do no harm) overrides the Duty of Candor. If the truth causes acute psychological damage he cannot process, the "conversational contract" of a parent-child relationship shifts from *truth-telling* to *care-taking*.
  *   **Adjustment:** You shouldn't feel torn because you are lying; you should feel clear that you are prioritizing care over truth. The principle holds, but the hierarchy of duties shifts in pathology.

  **2. Case 1 (The Reference Letter)**
  *   **Your Verdict:** Fine.
  *   **My Principle's Verdict:** **Permissible individually, corrosive collectively.**
  *   **Why:** You are right that within the current norms, you haven't violated the contract. The committee expects advocacy. However, if *everyone* does this (omitting dissertation failures), the signal becomes noise, and the hiring process breaks.
  *   **Adjustment:** You don't need to change your behavior tomorrow, but you should acknowledge that this is a "tragedy of the commons" scenario. It is morally permissible only because the system currently accounts for it. If the norms shifted toward full transparency, your action would become Case 5 (sabotage of the process).

  **3. Case 8 (The Chair/Lawyer)**
  *   **Your Verdict:** Worse than a lie.
  *   **My Principle's Verdict:** **Correct.**
  *   **Why:** This is the anchor for the whole theory. In accountability structures, clarity is the currency. Obfuscation is counterfeiting the currency. A lie is a bad transaction; obfuscation is closing the bank.

  ### Summary for Your Draft
  If you need a precise sentence to lift:

  > "The morality of deception is not determined by the literal truth of the statement, but by the **Normative Expectation of Candor** governing the relationship. We are forbidden from exploiting a hearer's reliance on us to cultivate false beliefs, unless the context explicitly suspends that expectation (as in advocacy or social politeness). In systems designed for accountability, obfuscation is worse than lying because it immunizes the speaker from correction."

  This preserves your distinction between the reference letter (advocacy) and the neighbor (reliance), while explaining why the Chair's hedge is more contemptible than a flat lie (corruption of process). It locates the wrong not in the words, but in the breach of the specific trust owed in that room.
