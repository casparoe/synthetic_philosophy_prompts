prompt: |-
  Hey — I'm running a 60-minute reading group on anthropic reasoning next week (continuing-ed crowd, smart, no formal philosophy or stats), and I want to open with a warm-up case before we get to the presumptuous philosopher and the SSA/SIA split. The warm-up has one specific job to do: show that SIA isn't, despite the way it usually gets introduced, the "big worlds are more likely" assumption as such — that the whole SSA/SIA disagreement lives in a single factor (whether the total number of observers in your reference class is itself evidence), and that once you hold that number fixed across the hypotheses the two assumptions collapse into each other and into ordinary "I was sampled from this population" reasoning.

  So: build me a case to that spec. Constraints:

  - One short scenario, a paragraph, terrestrial and ordinary (a hospital night shift, a conference, a prison wing, a theme-park queue, whatever), no cosmology, no aliens, no simulations, no infinite populations, no deity flipping coins. The two hypotheses should differ a lot in how many observers share my evidence (at least 10:1, ideally 100:1) and not at all in how many observers there are in total.
  - The priors have to fall out of something in the story — a procedure, a coin, a stated randomisation — not me just announcing them. Same for why I'm in the evidential situation I'm in.
  - The evidence has to genuinely move the odds under both assumptions. If both theories just shrug and stay at the prior, the agreement is cheap and I don't want it.
  - It should be robust to the reference class: plug in everyone in the scenario, or all humans, or all conscious beings, and the verdict shouldn't budge. Don't let the case do its work by quietly picking a reference class for me.
  - Then run the arithmetic both ways — SSA, SIA — with the actual odds, and show me where the two calculations differ only by a constant that cancels.
  - Tell me which feature of the case is doing the work, and what happens if I remove it. I'm guessing it collapses straight back into the standard presumptuous-philosopher disagreement; if so, say which direction it collapses in and why that's the direction.
  - Since neither assumption comes out badly here, tell me what each side would claim the case shows about the other one, and who's actually right about that.
  - Last thing: someone in the group will definately say the whole SSA/SIA framing is confused and that the case only looks well-behaved because it was built inside that framing. What's the strongest version of that objection, and is it fair to this particular case or only to the literature around it?

  And one anti-cheat note up front: I don't want a case where the totals differ across hypotheses and the priors are then tuned to make the posteriors match. For my purpose that's stipulating the verdict instead of generating it, and it would teach the group the opposite of what I'm after.
reasoning: |-
  Here's a thinking process that leads to the suggested reading group case:

  1.  **Analyze the Request:**
