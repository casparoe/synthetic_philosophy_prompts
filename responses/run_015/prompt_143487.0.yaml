answer: |-
  ### The Warm-Up Case: The Night Shift

  **The Scenario**
  You are a security guard working the night shift at a large, secure data facility. There are exactly 1,000 guards on duty tonight; this number is fixed by contract and does not change based on internal protocols. At the start of the shift, the Chief of Security flips a fair coin to determine the access protocol. If **Heads**, 10 guards are randomly selected to receive a "Master Key" card. If **Tails**, 100 guards are randomly selected to receive a "Master Key" card. The selection is truly random; every guard has an equal chance within the protocol. You wake up from a nap in the breakroom, check your pocket, and find a Master Key card. What are the odds the coin landed Tails?

  ***

  ### The Arithmetic: SSA vs. SIA

  Here is how the two frameworks process this. Note that $N_{total}$ is the total number of observers in your reference class (the guards), and $N_{evidence}$ is the number of guards holding a Master Key.

  **Common Inputs:**
  *   **Prior Odds ($H_T : H_H$):** 1:1 (Fair coin).
  *   **Total Guards ($N_{total}$):** 1,000 (Fixed across both hypotheses).
  *   **Key Holders ($N_{evidence}$):** 100 (if Tails) vs. 10 (if Heads).

  **1. Self-Sampling Assumption (SSA)**
  SSA says: "Assume you are a random sample from the existing observers."
  *   **Likelihood ($P(E|H)$):** The chance a random guard has a key.
      *   $P(E|H_T) = 100 / 1,000 = 1/10$
      *   $P(E|H_H) = 10 / 1,000 = 1/100$
  *   **Posterior Odds:** Prior $\times$ Likelihood Ratio
      *   $1:1 \times (1/10 : 1/100) = \mathbf{10:1}$ in favor of Tails.

  **2. Self-Indication Assumption (SIA)**
  SIA says: "Weight hypotheses by the total number of observers, *then* sample."
  *   **SIA Prior Adjustment:** Weight by $N_{total}$.
      *   Weight($H_T$) $\propto 0.5 \times 1,000$
      *   Weight($H_H$) $\propto 0.5 \times 1,000$
      *   *Since $N_{total}$ is identical, the adjusted prior odds remain 1:1.*
  *   **Likelihood ($P(E|H)$):** The chance a random observer has the evidence (same as SSA).
      *   Ratio is still $(1/10 : 1/100)$.
  *   **Posterior Odds:** Adjusted Prior $\times$ Likelihood Ratio
      *   $1:1 \times (1/10 : 1/100) = \mathbf{10:1}$ in favor of Tails.

  **The Collapse:**
  The calculations are identical. The SIA term that usually drives the wedge ($N_{total}$) appears in the numerator for both hypotheses. Since $N_{total}(H_T) = N_{total}(H_H)$, the term cancels out completely ($1,000/1,000 = 1$). The disagreement vanishes.

  ***

  ### The Feature Doing the Work

  **The Fixed Population Constraint.**
  The work is being done entirely by the stipulation that the total number of observers (1,000 guards) is invariant across the hypotheses.

  **If You Remove It:**
  If you change the scenario so that **Heads** means 1,000 guards exist, but **Tails** means 1,000,000 guards exist (with the same 1% key distribution), the case collapses straight into the **Presumptuous Philosopher** problem.
  *   **Direction of Collapse:** SIA will now favor Tails massively (1,000:1 odds) because it treats the existence of more observers as evidence for that world. SSA will stick to the 1% proportion (1:1 odds), arguing you are no more likely to be *you* in the bigger world.
  *   **Why:** Without the fixed population, the SIA prior adjustment no longer cancels. The disagreement re-emerges as a fight over whether "existing in a world with more people" is itself evidence.

  ***

  ### What Each Side Claims (and Who Is Right)

  **The SSA Proponent says:**
  "This case shows that SIA is harmless when it behaves. It proves that SIA only goes wrong when it tries to infer world-size from existence. In normal, fixed-population cases, SIA converges to standard Bayesian reasoning (which is what SSA is)."
  *   *Verdict:* **Mostly Right.** They correctly identify that the "Presumptuous" result requires variable population sizes.

  **The SIA Proponent says:**
  "This case shows that SSA is harmless when it behaves. It proves that SSA only goes wrong when it ignores the fact that you are more likely to exist in worlds with more observers. In fixed-population cases, SSA converges to standard Bayesian reasoning (which is what SIA is)."
  *   *Verdict:* **Mostly Right.** They correctly identify that the "Doomsday" result (SSA favoring small worlds) requires variable population sizes.

  **The Actual Takeaway:**
  Both are right about the math, but the SIA proponent is right about the *diagnosis*. The entire SSA/SIA conflict is not about how to handle evidence *within* a world (both agree on the 10:1 key ratio); it is exclusively about whether the **total count of observers** ($N_{total}$) belongs in the prior. This case isolates that variable and sets it to zero.

  ***

  ### The "Framing is Confused" Objection

  **The Objection:**
  A participant will argue: *"This whole exercise is category confusion. You aren't 'sampled' from a population. You just exist. Probabilities apply to coins and keys, not to 'being you.' By forcing us to calculate the probability of 'being a guard,' you're manufacturing a problem that dissolves if we just use standard first-person probabilities."*

  **Is it Fair?**
  *   **To the Literature:** **Yes.** Much of the anthropic literature relies on nebulous "centered worlds" or metaphysical sampling that invites this criticism.
  *   **To This Case:** **No.** This scenario is robust against that objection because the "indexical" uncertainty ("Which guard am I?") is physically implemented by the **random key distribution**.
      *   You don't need to calculate the probability of "being you." You only need to calculate the probability that *a randomly selected guard* holds a key.
      *   Because the total number of guards is fixed, "a randomly selected guard" is a standard frequency class, not a metaphysical one.
      *   If the objector accepts that the coin was fair and the key distribution was random, they must accept the 10:1 posterior. The SSA/SIA framing doesn't *create* the result here; it merely tracks the physical randomization already present in the story.

  **Use this to pivot:** "Exactly. This case works *because* it's boring. It shows that the anthropic weirdness isn't in the reasoning, it's in the cosmology. Now that we've seen them agree, let's look at what happens when we break the 'Fixed Population' constraint..."
