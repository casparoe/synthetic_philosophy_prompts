answer: |-
  This is a sophisticated observation. You have identified a mechanism that is distinct from standard information cascades, yet operates through similar social-epistemic channels. While there is no single, universally canonical term for this specific phenomenon in the literature, it sits at the intersection of **social epistemology**, **organizational theory**, and **argumentation theory**.

  The closest existing concepts are **"Epistemic Path Dependence,"** **"Evidentiary Escalation,"** and a distributed form of **"Paradigm Protection"** (à la Kuhn). However, your description of a *second-order cascade*—where the cascade occurs not over the belief itself, but over the *thresholds for disconfirmation*—is a precise and novel framing that warrants unpacking.

  Here is an analysis of the phenomenon, its relationship to existing literature, a proposed precise definition, and an evaluation of its rationality.

  ### 1. Conceptual Neighbors (and why they don't quite fit)

  To isolate this phenomenon, we must distinguish it from its closest relatives:

  *   **Information Cascades (Bikhchandani et al.):** In a standard cascade, individuals ignore private signals to follow public actions. In your cases, individuals are *not* ignoring evidence; they are processing it, but the *weight* required to overturn the consensus increases. This is a cascade over *standards*, not signals.
  *   **Groupthink (Janis):** Groupthink is driven by psychological cohesion and a desire for harmony. Your examples suggest a procedural rationality ("we must be careful," "we need controls"). The barrier is structural, not merely emotional.
  *   **Kuhnian Normal Science:** Thomas Kuhn described how paradigms resist falsification by treating anomalies as solvable puzzles. This is the strongest historical parallel. However, Kuhn focuses on broad scientific revolutions. Your examples occur in micro-epistemic communities (a forum thread, a committee) over short timeframes, suggesting a mechanism that scales down to everyday discourse.
  *   **Escalation of Commitment (Staw):** Organizational behavior literature describes continuing a course of action despite negative feedback. This usually applies to resource allocation. Your phenomenon applies to *epistemic justification*.
  *   **Motte-and-Bailey (Talbert):** This involves retreating to a defensible position when challenged. Your phenomenon is the inverse: the "fortress" expands its defensive perimeter *after* the battle is seemingly won, making the center harder to reach.

  ### 2. Proposed Terminology and Definition

  Given the lack of a single standard term, the most accurate existing label is **Epistemic Path Dependence**. However, to capture the dynamic nature you described, I propose framing it as **Evidentiary Escalation** or a **Second-Order Epistemic Cascade**.

  **Precise Definition:**
  > **Evidentiary Escalation** is a dynamic process in group belief formation where, upon reaching a critical threshold of consensus ($C$), the community updates its *meta-epistemic standards* such that the burden of proof required to falsify the consensus belief ($B$) increases non-linearly.
  >
  > Unlike standard polarization, the probability assigned to $B$ may remain stable or even acknowledge uncertainty. The shift occurs in the **likelihood ratio** required for a dissenting signal ($S$) to update the group posterior. As consensus solidifies, $S$ is no longer evaluated on its own merit but is conditioned on the requirement that it must also explain the *absence* of $S$ in the prior period of consensus.

  **Boundary Conditions:**
  1.  **Distributed Agency:** The raising of standards is not dictated by a leader but emerges from successive, locally rational demands for "due diligence."
  2.  **Composite Burden:** Individual demands are reasonable (e.g., "control for variables"), but their conjunction creates a satisfiability gap.
  3.  **Retroactive Justification:** The new standards are framed as "what we should have required all along," masking the fact that they were not required *until* the consensus formed.

  ### 3. The Rationality Analysis

  You asked whether this is genuinely rational at the individual level while being pathological at the collective level. The answer is **yes**, and it can be modeled using Bayesian updating on social evidence.

  **The Individually Rational Update:**
  When an agent enters a discussion where consensus $C$ already exists, they treat $C$ as **meta-evidence**.
  *   *Prior:* $P(B)$ is the probability the belief is true.
  *   *Meta-Evidence:* The fact that $N$ experts have already reviewed $B$ and not rejected it.
  *   *Update:* The agent infers that "easy" disconfirming evidence has likely already been found and discarded.
  *   *Result:* Therefore, any *new* disconfirming evidence $E$ must be of a higher quality or different *type* than what has already been considered. It is rational to ask, "Why didn't previous reviewers see this?"

  **The Collectively Pathological Outcome:**
  This rational updating creates a **ratchet effect**.
  1.  **The "Anomaly Absorption" Trap:** Because the community assumes previous reviewers were competent, new evidence is treated as an anomaly to be explained away (e.g., "Why hasn't this failure appeared in deployed systems?") rather than a falsification.
  2.  **Combinatorial Explosion:** As each challenger is asked to address a new layer (incentives, literature, deployment history), the space of acceptable disconfirmation shrinks. Eventually, the cost of producing a valid counter-argument exceeds the capacity of any single actor.
  3.  **Suppression of Tail Risks:** In your ML safety example, the "layered standard" effectively filters out novel, non-obvious risks. If a risk is new, it by definition won't appear in "existing literature" or "analogous failures." The evidentiary escalation structurally biases the community against **black swan** events.

  ### 4. Distinguishing from Status Quo Bias and Immunization

  *   **Vs. Status Quo Bias:** Status quo bias is a static preference for the current state. Evidentiary Escalation is *dynamic*. The barriers are constructed *in response* to challenges. It is an active defense, not a passive inertia.
  *   **Vs. Popperian Immunization:** In Popper's account, a theorist adds ad hoc hypotheses to save a specific theory. In Evidentiary Escalation, the *community* adds procedural requirements. It is **Procedural Immunization**. The theory isn't saved by changing the theory; it is saved by changing the rules of the game.
  *   **Vs. Ordinary Accumulation of Auxiliary Hypotheses:** In science, auxiliary hypotheses accumulate to explain data. Here, they accumulate to **raise the cost of entry** for dissent. The function is gatekeeping, not explanatory.

  ### 5. Conclusion: The "Burden of Proof Ratchet"

  This phenomenon is best understood as a **Burden of Proof Ratchet**. It is a second-order cascade where the "signal" being cascaded is the *level of skepticism* appropriate for the topic.

  Once the group signals "We are confident enough to proceed," skepticism is re-categorized from "prudent diligence" to "obstructionism." To avoid being labeled obstructive, challengers must meet higher standards. This is individually rational (signaling competence and alignment with the group's rigor) but collectively dangerous (it creates epistemic blind spots).

  **Is there a name?**
  If you wish to cite this in future discourse, **"Epistemic Path Dependence"** is the most academically robust existing term. However, **"Evidentiary Escalation"** or **"Second-Order Epistemic Cascade"** more precisely captures the mechanism you described. It is a recognized failure mode in **High-Reliability Organizations (HROs)**, where procedural rigor can paradoxically blind the organization to novel threats because the threats do not fit the established procedural categories for "risk."

  Your intuition is correct: this is not merely herding. It is the **structural hardening of belief through the rational accumulation of procedural debt.**
