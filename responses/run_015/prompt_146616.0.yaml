prompt: |-
  I'm writing a chapter on the reliability of animal signals, and I keep finding that the handicap principle is used to mean at least three different things, so before I assess any contender I want the specification. Write the desiderata a theory of honest signalling must meet to be adequate for one purpose: telling a field biologist what to measure when she finds a signal she doesn't understand and wants to know whether to go looking for costs at all. For each requirement give the case behind it — the phenomena it must explain (why signals track quality or need instead of being bluffed; why some perfectly reliable signals are cheap; why some expensive signals carry no information; why receivers respond to displays that merely exploit their existing preferences; why signals that look wasteful persist), the distinctions it must not collapse (signal versus cue versus index versus manipulation; production cost versus differential cost versus receiver-imposed cost; signals of durable quality versus signals of current need; reliability versus costliness), and any game-theoretic or empirical result it cannot contradict. Mark which requirements are non-negotiable and which are the preferences of one camp, and say which single requirement does the most work in excluding candidate theories.

  Then run the list against four hypothetical cases I want to use in the chapter, chosen so that different ways of spelling out the desiderata should come apart:

  1. Borrowed cost: males build a display structure out of material they must steal from rivals, so the ornament is reliable as a indicator of fighting ability, but the cost is borne by the losers rather than by the signaller. Must cost fall on the signaller, or is it enough that there is no cheap way to get the signal?
  2. Deferred cost: the display is cheap to produce, but individuals who display while in poor condition are later attacked by receivers, so the cost arrives after the benefit and only for low-quality signallers.
  3. Aligned interests: a call whose pitch is fixed mechanically by body size, honest, essentially free to produce, and in a context where receiver and signaller both gain from accuracy.
  4. Costly deception: an expensive display that works by hijacking the receiver's pre-existing sensory bias and carries no information whatsoever about the signaller.

  If some subset of your desiderata cannot be satisfied jointly — if requiring signaller-borne cost rules out the aligned-interest case while dropping it lets the manipulation case in — say so, say which requirement you would give up and why, and give each of the main approaches (strategic handicap models, index or unfakeability accounts, receiver-psychology and sensory-exploitation accounts, cost-free honest signalling under aligned interests) one line against the list. Commit: rank the desiderata, state the one you would sacrifice, and be explicit about which of your claims are conceptual and which would actually be settled by data.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Goal:** Write a set of desiderata (requirements) for a theory of honest signalling suitable for a field biologist deciding whether to look for costs.
      *   **Context:** The user notes the "Handicap Principle" is ambiguous (used to mean at least three things). They need a specification to assess contenders.
      *   **Specific Tasks:**
          1.  List desiderata with cases behind them (phenomena to explain, distinctions to maintain, theoretical/empirical constraints).
          2.  Mark requirements as Non-Negotiable vs. Camp Preferences.
          3.  Identify the single requirement that does the most work in excluding candidates.
          4.  Test the list against four hypothetical cases (Borrowed Cost, Deferred Cost, Aligned Interests, Costly Deception).
          5.  Address conflicts (if requirements clash, choose one to sacrifice and explain why).
          6.  Give one-line critiques for four main approaches (Strategic Handicap, Index/Unfakeable, Receiver-Psychology, Cost-Free/Aligned).
          7.  **Commit:** Rank desiderata, state the sacrifice, distinguish conceptual vs. empirical claims.

  2.  **Analyze the Core Problem:**

      *   The "Handicap Principle" (Zahavi) is often conflated with "Costly Signalling Theory" (Grafen/Johnstone).
      *   Biologists often assume *all* honest signals must be costly *to the signaller at the time of signalling*.
      *   However, indices (unfakeable signals) exist.
      *   Aligned interest models (Godrey-Smith, etc.) show honesty can emerge without costs if lying isn't beneficial.
      *   Sensory exploitation shows costly signals can be dishonest/manipulative.
      *   The user wants a *practical* guide for a field biologist: "Should I measure costs?"

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Stability.* The signal must be evolutionarily stable (ESS). Cannot be invaded by liars.
      *   *Requirement 2: Cost/Constraint.* There must be *some* constraint preventing cheap lying. Is it metabolic cost? Risk? Physical impossibility?
      *   *Requirement 3: Correlation.* The signal must correlate with the underlying quality/state.
      *   *Requirement 4: Receiver Benefit.* Why does the receiver listen? (Usually implied, but needs stating).
      *   *Refinement:* The prompt asks specifically about *costs*. So the desiderata need to focus on the *role* of cost in ensuring reliability.
      *   *Key Distinction:* Production Cost vs. Marginal/Differential Cost vs. Constraint.
      *   *Key Distinction:* Signal (evolved to inform) vs. Cue (incidental) vs. Index (physically constrained).

      *Let's formalize the Desiderata:*
      1.  **Stability against Deception:** The system must resist invasion by low-quality liars. (Non-negotiable).
      2.  **Constraint Specification:** Must specify *what* prevents lying (Cost, Physical Index, or Interest Alignment). (Non-negotiable).
      3.  **Cost Localization:** Must specify *who* pays and *when*. (This is where the ambiguity lies).
      4.  **Information Content:** Must distinguish between signals carrying information vs. manipulation.

      *Wait, the prompt asks for a list that tells a biologist "whether to go looking for costs at all."*
      So the primary desideratum is **Predictive Utility regarding Cost Measurement.**
      If a theory says "Look for costs," it must define *which* costs.
      If a theory says "Don't look for costs," it must explain *why* honesty persists.

      *Revised Desiderata List:*
      1.  **Invasion Resistance (Non-negotiable):** Must explain why low-quality individuals do not adopt the high-quality signal.
      2.  **Constraint Mechanism (Non-negotiable):** Must identify the specific barrier to cheating (Metabolic, Risk, Physical, or Strategic).
      3.  **Cost Signal Distinction (Non-negotiable):** Must not equate "costly" with "honest" or "cheap" with "dishonest" axiomatically.
      4.  **Temporal/Spatial Localization (Preference/Negotiable):** Must specify if cost is immediate, deferred, or borne by others.
      5.  **Receiver Agency (Non-negotiable):** Must account for receiver selection pressures (why they don't ignore the signal).

      *Let's refine based on the "Handicap Principle" ambiguity.*
      The ambiguity is usually:
      1.  Signals *must* be costly (Zahavi's original strong claim).
      2.  Signals *must* have differential costs (Grafen's mathematical formalization).
      3.  Signals *must* be constrained (Index/Unfakeable).

      *Okay, let's build the specific list requested.*

      *   **D1: Evolutionary Stability (ESS).** (Non-negotiable). Case: Bluffs. If liars do better, signal collapses.
      *   **D2: Differential Marginal Cost (or Equivalent Constraint).** (Non-negotiable). Case: Why high quality can signal cheaper than low quality. This is the core of Grafen's Handicap.
      *   **D3: Distinction between Signal and Index.** (Non-negotiable). Case: Roaring pitch (physical constraint) vs. Tail length (choice).
      *   **D4: Receiver Benefit/Response Stability.** (Non-negotiable). Case: Sensory exploitation. Why does the receiver respond?
      *   **D5: Cost Timing/Incidence.** (Camp Preference). Case: Deferred cost vs. Immediate cost.

      *Which requirement does the most work?* D2 (Differential Cost/Constraint). If you require *absolute* cost, you lose indices. If you require *differential* cost, you keep handicaps but might lose aligned interests. If you require *constraint*, you keep everything but lose predictive power on *what* to measure.
      Actually, **D1 (Stability against invasion)** is the engine. But **D2 (The nature of the constraint)** is what tells the biologist what to measure.
      Let's go with **D2: The Mechanism of Restraint.** This excludes theories that just say "it's stable" without saying *why* liars don't win.

  4.  **Testing against the Four Cases:**

      1.  **Borrowed Cost:** Cost is on the loser (rival), not signaller.
          *   Standard Handicap: Fails (cost must be on signaller).
          *   ESS view: Passes (if stealing is hard for weak males).
          *   *Biologist instruction:* Measure fighting ability/risk of theft, not metabolic cost of ornament.
      2.  **Deferred Cost:** Cost comes later (punishment).
          *   Standard Handicap: Fails (cost usually modeled as immediate production/maintenance).
          *   Enforcement models: Passes.
          *   *Biologist instruction:* Measure receiver aggression post-signal, not signal metabolism.
      3.  **Aligned Interests (Index):** Cheap, physically constrained, mutual benefit.
          *   Standard Handicap: Fails (requires cost).
          *   Index theory: Passes.
          *   *Biologist instruction:* Measure physical correlation, ignore metabolic cost.
      4.  **Costly Deception:** Expensive, hijacks bias, no info.
          *   Standard Handicap: Fails (assumes cost implies honesty).
          *   Sensory Exploitation: Passes.
          *   *Biologist instruction:* Cost measurement is irrelevant to honesty; measure receiver neural response.

  5.  **Addressing Conflicts & Commitments:**

      *   *Conflict:* If I demand "Signaller-borne immediate cost" (Traditional Handicap), I exclude Cases 1, 2, and 3.
      *   *Conflict:* If I demand "No Cost Necessary" (Aligned Interest), I might fail to explain Case 4 (why cost exists if not needed) or Case 1 (why the cost structure matters).
      *   *Resolution:* The core requirement must be **Restraint on Cheating**, not **Cost** per se. Cost is just one form of restraint.
      *   *Sacrifice:* I must sacrifice the requirement that **"Cost must be metabolic and immediate to the signaller."** This is the traditional Zahavian/Grafen view, but it fails the Index and Deferred cases.
      *   *Ranking:*
          1.  Stability against invasion (The "Why").
          2.  Mechanism of Restraint (The "How" - tells biologist what to measure).
          3.  Signal/Cue Distinction (The "What").
          4.  Signaller-borne immediate cost (The Sacrifice).

  6.  **Drafting the Content (incorporating the "One Liners"):**

      *   *Strategic Handicap:* "Cost is the engine of honesty, but you've defined 'cost' too narrowly to include deferred or borrowed penalties."
      *   *Index/Unfakeable:* "Physics guarantees honesty, but you struggle to explain variable signals where physics allows cheating."
      *   *Receiver-Psychology:* "You explain the response, but often treat the signal's information content as secondary to the trigger."
      *   *Aligned Interests:* "You explain cheap honesty, but cannot account for wasteful signals where interests diverge."

  7.  **Refining the "Biologist Instruction":**

      *   The prompt asks for desiderata *for the purpose of telling a field biologist what to measure.*
      *   So the desiderata must be operational.
      *   Instead of abstract "Stability," it should be "Identify the Barrier."
      *   Instead of "Cost," it should be "Constraint."

  8.  **Final Review against Constraints:**

      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I identify the single requirement doing the most work? Yes (Mechanism of Restraint).
      *   Did I run the 4 cases? Yes.
      *   Did I address the conflict/sacrifice? Yes.
      *   Did I give the one-liners? Yes.
      *   Did I distinguish conceptual vs. empirical? Yes.
      *   Tone: Academic, precise, authoritative (fitting a chapter on reliability).

      *(Self-Correction during drafting)*: Make sure to clearly distinguish between "Handicap Principle" (Zahavi) and "Costly Signalling Theory" (Grafen). The prompt mentions the ambiguity. I need to clarify that in the desiderata. The "Handicap" is often used to mean "Costly Signal," but Zahavi meant "Signal *because* it is costly." Grafen showed "Signal *stable because* costs are differential." I need to ensure the desiderata capture the *logic* rather than the label.

      *Crucial Decision:* The prompt asks me to *Commit*. I need to take a stance. The most robust stance for a *general* theory of reliability is that **Honesty requires a Constraint on Cheating**, where Cost is a *subset* of Constraints. This allows Indices and Aligned Interests to coexist with Handicaps.
      *Sacrifice:* The requirement that "Signals must reduce fitness (be wasteful)."

      *Let's structure the response:*
      1.  Introduction (Acknowledging the ambiguity).
      2.  The Desiderata List (with Case, Distinction, Constraint, Status).
      3.  The "Workhorse" Requirement.
      4.  Application to the 4 Cases.
      5.  Conflict Resolution & Sacrifice.
      6.  One-Liners for the 4 Approaches.
      7.  Final Commitment (Ranking & Conceptual/Empirical distinction).

      *Wait, one more check on Case 1 (Borrowed Cost).* If the cost is borne by the loser, is it a signal cost? It's a *risk* cost to the signaller (risk of failure in stealing). So it fits Differential Cost if modeled as risk. But the prompt frames it as "cost borne by losers." I need to be careful. If the cost is *only* on the loser, it's not a handicap on the signaller. It's a contest. I need to decide if this counts as signalling. If the ornament *is* the stolen material, the *act of stealing* is the cost/risk. I will treat it as a test of the "Signaller-borne" requirement.

      *Case 4 (Costly Deception).* This is the killer for "Cost = Honesty". If a signal is costly but dishonest, then cost is not sufficient for honesty. This reinforces the need to sacrifice "Cost implies Honesty."

      *Okay, ready to write.*
answer: |-
  ### Desiderata for a Theory of Signal Reliability

  To resolve the ambiguity surrounding the Handicap Principle and provide operational guidance to a field biologist, a theory of honest signalling must satisfy the following five requirements. They are ranked by logical priority, with status marked as **Non-Negotiable** (logical prerequisites for reliability) or **Camp Preference** (specific to the Costly Signalling/Handicap tradition).

  #### 1. Invasion Resistance (The Stability Condition)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** Must explain why a population of honest signallers cannot be invaded by "liars" (low-quality individuals producing high-quality signals). If liars gain higher fitness than honest signallers, the correlation between signal and quality decays to zero (the "cheap talk" problem).
  *   **Distinctions:** Distinguishes *evolutionarily stable signals* from *transient bluffs*.
  *   **Constraint:** Cannot contradict the definition of an Evolutionarily Stable Strategy (ESS). A theory claiming honesty persists despite liars having higher net fitness is mathematically incoherent.
  *   **Biologist Instruction:** Do not assume stability; test whether low-quality individuals *could* produce the signal but *do not*.

  #### 2. Mechanism of Restraint (The Constraint Condition)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** Must specify the specific barrier preventing cheating. This explains why signals track quality/need rather than being bluffed.
  *   **Distinctions:** Must distinguish between **Production Costs** (metabolic), **Differential Costs** (marginal cost higher for low quality), **Physical Indices** (unfakeable due to morphology), and **Social Enforcement** (punishment by receivers).
  *   **Constraint:** Cannot contradict game-theoretic results showing that without a restraint mechanism (cost, index, or aligned interest), information transfer collapses in divergent-interest games.
  *   **Biologist Instruction:** This is the primary diagnostic. Identify *which* restraint is operating. If it is an index, measure morphology. If it is a handicap, measure metabolic/risk cost. If it is enforcement, measure receiver aggression.

  #### 3. Signal-Cue-Index Discrimination (The Origin Condition)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** Must explain why some perfectly reliable signals are cheap (indices) while others are expensive (handicaps). A theory that treats all reliable traits as "signals" fails to distinguish traits evolved *to inform* from traits evolved for other purposes that are *used* to inform.
  *   **Distinctions:** **Signal** (evolved for communication), **Cue** (incidental byproduct), **Index** (physically constrained reliability).
  *   **Constraint:** Cannot contradict phylogenetic evidence showing a trait predates the communication context (which suggests cue/index rather than signal).
  *   **Biologist Instruction:** Determine if the trait can vary independently of the quality it signals. If no (e.g., voice pitch vs. size), it is an index; do not look for signalling costs.

  #### 4. Receiver Benefit/Response Stability (The Audience Condition)
  *   **Status:** **Non-Negotiable**
  *   **The Case:** Must explain why receivers respond to displays that merely exploit existing preferences (sensory bias) versus those that convey new information. Receivers must gain a net benefit (informational or otherwise) or be constrained from ignoring the signal.
  *   **Distinctions:** **Manipulation** (receiver fitness reduced) vs. **Cooperation** (receiver fitness increased).
  *   **Constraint:** Cannot contradict models showing that receivers will evolve immunity to signals that consistently reduce their fitness (the "sceptical receiver" problem).
  *   **Biologist Instruction:** Measure receiver fitness outcomes. If the signal reduces receiver fitness without information gain, the system is likely transient or maintained by sensory trap, not reliability.

  #### 5. Signaller-Borne Immediate Cost (The Handicap Condition)
  *   **Status:** **Camp Preference** (Specific to Zahavian/Grafen Handicap models)
  *   **The Case:** Explains why signals that look wasteful persist. Traditional Handicap Theory posits that waste *guarantees* honesty.
  *   **Distinctions:** Collapses if it treats **Reliability** as synonymous with **Costliness**.
  *   **Constraint:** **Must be sacrificed** if it contradicts Cases 1, 2, or 3 (see below). Empirical data shows many honest signals are cheap (indices) and some costly signals are dishonest.
  *   **Biologist Instruction:** *Conditional.* Only measure metabolic/maintenance costs if Mechanisms 1–3 (Cost, Differential Cost, Risk) are identified as the Restraint. Do not measure if Restraint is Physical or Aligned Interest.

  ***

  ### The Workhorse Requirement
  **Requirement #2 (Mechanism of Restraint)** does the most work in excluding candidate theories.
  Many theories claim to explain honesty but fail to specify *why* a low-quality individual stops short of the high-quality signal. A theory that says "honesty is stable" without specifying the *restraint* (cost, physics, or punishment) is descriptively empty. This requirement forces the biologist to choose between measuring metabolism (Handicap), morphology (Index), or social interaction (Enforcement).

  ***

  ### Testing the Desiderata Against Four Cases

  Here is how the desiderata apply to your hypothetical cases. Note where Requirement #5 (Signaller-Borne Immediate Cost) creates conflict.

  #### 1. Borrowed Cost (Stealing the Ornament)
  *   **Analysis:** The ornament indicates fighting ability because only strong males can steal it. The metabolic cost of the ornament is low; the "cost" is the risk of injury during theft, borne potentially by the loser, but the *risk* is borne by the signaller.
  *   **Desiderata Check:**
      *   #1 (Stability): Pass (weak males cannot steal).
      *   #2 (Restraint): Pass (Risk of injury is the restraint).
      *   #5 (Signaller Cost): **Fail** (if defined strictly as metabolic cost of the ornament).
  *   **Biologist Instruction:** Do not measure the cost of *building* the structure. Measure the frequency of injury during *acquisition*.
  *   **Verdict:** Valid signal, but fails the traditional "wasteful ornament" definition of Handicap.

  #### 2. Deferred Cost (Punishment)
  *   **Analysis:** Signal is cheap, but liars are punished later.
  *   **Desiderata Check:**
      *   #1 (Stability): Pass (liars have lower net fitness due to punishment).
      *   #2 (Restraint): Pass (Receiver enforcement is the restraint).
      *   #5 (Signaller Cost): **Fail** (Cost is not immediate/production-based).
  *   **Biologist Instruction:** Do not measure signal metabolism. Measure receiver aggression post-signal.
  *   **Verdict:** Valid signal (Enforcement Model), but excluded by strict Handicap Theory.

  #### 3. Aligned Interests (Index)
  *   **Analysis:** Pitch fixed by size, mutual benefit, cheap.
  *   **Desiderata Check:**
      *   #1 (Stability): Pass (physically impossible to lie).
      *   #2 (Restraint): Pass (Physics is the restraint).
      *   #3 (Signal/Cue): Pass (Identified as Index).
      *   #5 (Signaller Cost): **Fail** (Signal is essentially free).
  *   **Biologist Instruction:** Measure body size correlation. Ignore metabolic cost.
  *   **Verdict:** Valid reliability, but excluded by any theory requiring cost for honesty.

  #### 4. Costly Deception (Sensory Exploitation)
  *   **Analysis:** Expensive display, hijacks bias, no information.
  *   **Desiderata Check:**
      *   #1 (Stability): Pass (can be stable if receiver cannot evolve immunity quickly).
      *   #2 (Restraint): **Fail** (No restraint on deception; deception *is* the strategy).
      *   #4 (Receiver Benefit): **Fail** (Receiver fitness reduced).
      *   #5 (Signaller Cost): **Pass** (Signal is expensive).
  *   **Biologist Instruction:** Cost measurement is irrelevant to honesty. Measure neural response.
  *   **Verdict:** This case proves Cost $\neq$ Honesty. A theory requiring #5 would falsely classify this as an honest signal.

  ***

  ### Conflict Resolution and Commitment

  **The Conflict:**
  You cannot jointly satisfy Requirement #5 (Signaller-Borne Immediate Cost) and maintain coverage of Cases 1, 2, and 3. If you insist that honesty *requires* immediate metabolic cost to the signaller, you must classify Indices and Enforcement signals as "not signalling" or "not honest," which contradicts empirical reality and functional definitions. Conversely, if you drop #5, you risk allowing Case 4 (Costly Deception) to be misidentified as honest if you rely on cost as a proxy for reliability.

  **The Sacrifice:**
  I explicitly sacrifice **Requirement #5 (Signaller-Borne Immediate Cost).**
  *Why:* Cost is a *mechanism* of restraint, not a *definition* of reliability. Case 4 proves cost does not guarantee honesty; Cases 1–3 prove honesty does not guarantee cost. Retaining #5 renders the theory useless for a biologist encountering indices or enforcement systems.

  **One-Line Critiques of Main Approaches:**
  1.  **Strategic Handicap Models:** "You correctly identify cost as a stabilizer but falsely generalize it as the *only* stabilizer."
  2.  **Index/Unfakeable Accounts:** "You explain cheap reliability well but struggle to account for variable, choice-based signals where physics allows cheating."
  3.  **Receiver-Psychology/Sensory-Exploitation:** "You explain the origin of the response but often treat the signal's information content as secondary to the trigger."
  4.  **Cost-Free/Aligned Interest:** "You explain honesty without waste but cannot account for wasteful signals where interests diverge."

  **Final Ranking of Desiderata:**
  1.  **Invasion Resistance** (Logical floor: if liars win, it's not a signal).
  2.  **Mechanism of Restraint** (Operational core: tells the biologist what to measure).
  3.  **Signal-Cue-Index Discrimination** (Categorization: prevents measuring costs for indices).
  4.  **Receiver Benefit** (Context: ensures the system isn't collapsing manipulation).
  5.  **Signaller-Borne Immediate Cost** (**Sacrificed**: useful heuristic, but not a rule).

  **Conceptual vs. Empirical Claims:**
  *   **Conceptual:** The definition of "Signal" requires evolutionary stability (D1) and a mechanism of restraint (D2). These are logical necessities derived from game theory.
  *   **Empirical:** Whether a specific system uses Cost, Index, or Alignment as its Restraint (D2) is settled by data. Whether "Costly Deception" (Case 4) persists long-term is an empirical question regarding the speed of receiver counter-adaptation.

  **Instruction to the Biologist:**
  "Go looking for costs *only if* you have ruled out physical unfakeability (Index) and interest alignment. If you find costs, verify they are *differential* (harder for low quality) rather than absolute. If you find no costs, do not assume deception; look for physical constraints or receiver enforcement."
