      *   *Let's stick to the Prompt's Skeleton closely but adapt for group size.* The prompt says "Design a runnable activity for this group." It doesn't forbid breaking into subgroups. In fact, for 16 people, it's necessary. I will propose 4 simultaneous games. I will provide the "Truth" in sealed envelopes for each table to open *after* the round, so I don't need to be the oracle for all of them simultaneously.

