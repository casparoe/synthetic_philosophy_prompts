  7.  **Addressing Troubleshooting:**
      *   *Refusal to argue:* Assign roles randomly. Remind them it's a simulation of AI, not their personal belief.
      *   *Bad Judge:* The Observer role helps here. In the debrief, highlight specific bad judgments.
      *   *Limitation:* The game assumes honest debaters trying to win. Real AI might collude. Or the "human" judge might be biased in ways the game doesn't capture (e.g., ideological bias vs. cognitive limit).

