      *   Round 3 Sabotage: A card refers to an external regulation ("Clause 4b") not in the packet. A claims it invalidates a vote. Judge can't check Clause 4b.

  9.  **Structuring the Response:**
      *   **Title:** The Oracle's Budget.
      *   **Setup:** Materials, Room arrangement (4 tables).
      *   **Rounds:** Detailed rules, incentives, ground rule changes.
      *   **Debrief:** Scripting the connection to scalable oversight.
      *   **Troubleshooting:** Specific advice.
      *   **Limitations:** What the game misses.
      *   **Self-Critique:** The weakest link.

