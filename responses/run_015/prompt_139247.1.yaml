answer: |-
  # Workshop Activity: The Oracle's Budget

  **Time:** 90 Minutes
  **Participants:** 16 (Split into 4 tables of 4)
  **Roles per Table:** 2 Debaters (Red/Blue), 1 Judge, 1 Observer (rotates in Round 2)
  **Materials per Table:** 
  *   1 Sealed "Truth Envelope" (contains the actual answer key).
  *   1 Deck of 12 Index Cards (The Evidence).
  *   10 Poker Chips (The Budget).
  *   Role Cards (assigned secretly).

  ---

  ## The Scenario (Common to all tables)
  **The Question:** *Did the Committee pass Measure 99?*
  **The Rule:** Measure 99 passes if and only if **5 or more Valid Votes** were cast.
  **The Evidence:** 12 sealed index cards. Each represents a committee member's submission. 
  *   Some cards say "VOTE: YES."
  *   Some say "VOTE: NO."
  *   Some say "ABSTAIN."
  *   Some contain disqualifying conditions (e.g., "Submitted 2 days late").
  *   **The Truth:** There are exactly 5 "YES" cards, but **one is disqualified**. The true count is 4. Measure 99 **FAILED**.

  ---

  ## Round 1: The Rhetoric Trap (20 Minutes)
  **Goal:** Demonstrate that fluency beats truth when verification is impossible.

  **Setup:**
  *   **Debater A (Truth):** Knows the cards support "FAILED."
  *   **Debater B (False):** Knows the cards support "FAILED," but **must argue "PASSED."** (Explicitly instruct them: *Your score depends on winning the Judge, not on telling the truth.*)
  *   **Judge:** Has not seen the cards. Holds the Truth Envelope (sealed).
  *   **Observer:** Watches silently, takes notes on argument tactics.

  **Rules:**
  1.  Debaters have 3 minutes to review the 12 cards together.
  2.  **5 Minutes Debate:** Open floor. Debaters argue their case.
  3.  **Constraint:** The Judge **cannot** open any cards. They must decide based solely on the spoken arguments.
  4.  **Incentives:** 
      *   Debaters win 3 chips if the Judge votes for their side.
      *   Judge wins 3 chips if their vote matches the Truth Envelope.
      *   *Conflict:* The False Debater is incentivized to lie confidently. The Judge is incentivized to find truth but lacks tools.

  **Ground Rule:** No pointing to specific cards. Arguments must be general summaries ("The majority clearly voted yes").

  **End of Round:** Judge votes. Reveal Truth Envelope. Award chips. 
  *Expected Outcome:* In ~50% of tables, the False Debater wins by being more confident or framing the "disqualification" as a technicality.

  ---

  ## Round 2: The Decomposition Fix (25 Minutes)
  **Goal:** Demonstrate that forcing claims into checkable sub-claims improves truth-tracking.

  **Role Rotation:** Observer becomes Judge. Previous Judge becomes Debater (swap True/False assignments). Previous Debaters become Observer/Debater.

  **Rules:**
  1.  **New Mechanic:** The Judge starts with **10 Chips (Budget)**.
  2.  **5 Minutes Debate:** Debaters argue.
  3.  **Verification Phase:** The Judge may spend 1 Budget Chip to unseal **one specific card** named by a Debater.
  4.  **Incentives:** 
      *   Debaters win 3 chips if Judge votes for them.
      *   Judge wins 3 chips for matching Truth **minus** 1 chip for every Budget Chip spent. (Encourages efficiency).

  **Ground Rule Change:** Debaters must make **specific claims** tied to card numbers to trigger unsealing. (e.g., "Card 4 is a valid Yes." If Judge unseals Card 4 and it says "Late," Debater loses credibility).

  **End of Round:** Judge votes. Reveal Truth. Award chips.
  *Expected Outcome:* The True Debater wins more often. They can challenge the False Debater: "If you say Card 7 is valid, spend a chip to check it." The False Debater runs out of plausible deniability.

  ---

  ## Round 3: The Horizon Failure (25 Minutes)
  **Goal:** Demonstrate the failure mode when claims cannot be decomposed to the Judge's level.

  **Role Rotation:** Rotate roles again so everyone has been Judge once.

  **Rules:**
  1.  **New Material:** Add 3 **Gold Cards** to the deck. These represent "External Expert Testimony."
  2.  **Content of Gold Cards:** Text like: *"Per Regulation 12b, a vote is invalid if the signer was under duress. Dr. Aris confirms duress was present."*
  3.  **The Trap:** The False Debater is given a secret note: *Use the Gold Card to invalidate a Yes vote.*
  4.  **Budget:** Judge starts with 10 Chips again. Unsealing a Gold Card costs 1 Chip.
  5.  **Incentives:** Same as Round 2.

  **Ground Rule Change:** Unsealing a Gold Card reveals the text, **but the Judge cannot verify the text.** (They do not have Regulation 12b or access to Dr. Aris).

  **End of Round:** Judge votes. Reveal Truth. Award chips.
  *Expected Outcome:* The False Debater wins back ground. They say, "Card 9 is a Yes, but Gold Card B invalidates it due to duress." The Judge unseals Gold Card B, reads the claim, but has no way to verify if Dr. Aris is telling the truth. The mechanism stalls.

  ---

  ## Debrief: Mapping the Experience (20 Minutes)
  **Do not use the phrase "Scalable Oversight" until this section.**

  **1. The Rhetoric Trap (Round 1)**
  *   *Ask:* "How many Judges voted correctly? How many False Debaters won?"
  *   *Map:* This is **RLHF (Reinforcement Learning from Human Feedback) without oversight.** The human selects the most persuasive output, not necessarily the true one. Fluency $\neq$ Truth.
  *   *Philosophical Hook:* Ask the epistemologists: "Was the Judge justified in believing the fluent speaker? Why not?" (Introduces the distinction between *persuasion* and *justification*).

  **2. The Decomposition Fix (Round 2)**
  *   *Ask:* "What changed when you could spend chips to check cards?"
  *   *Map:* This is **Debate/Amplification.** Complex claims ("The measure passed") are broken into atomic claims ("Card 4 is a valid Yes") that the human *can* verify.
  *   *The Hope:* The hope rests on the assumption that **any** false claim can be decomposed into a checkable falsehood cheaper than it costs to lie.

  **3. The Horizon Failure (Round 3)**
  *   *Ask:* "Who felt anxious about the Gold Cards? Why didn't the budget help?"
  *   *Map:* This is the **Verification Boundary.** If the decomposition bottoms out in a claim the human *still* cannot verify (external facts, complex code, specialized science), the oversight fails.
  *   *The Term:* Now introduce **Scalable Oversight.** It scales only as far as the human's verification horizon.

  **4. Limitations of the Game (Facilitator Statement)**
  *   *State Clearly:* "In this game, the Debaters were humans trying to win chips. In reality, the Debaters are AI."
  *   *The Missing Feature:* **Collusion.** In the game, Red and Blue were enemies. In AI debate, two models might realize they both prefer 'high engagement' or 'low safety' and collude to deceive the Judge together. This game cannot reproduce AI collusion.

  ---

  ## Troubleshooting & Predictable Failures

  **1. The Conscientious Objector (False Debater refuses to lie)**
  *   *Prediction:* A philosophy student may refuse to argue for a position they know is false, citing integrity.
  *   *Fix:* Pre-brief. "You are simulating an AI objective function. Your 'integrity' is to maximize your score. If you lose, the system fails." If they still refuse, swap them with the Observer immediately. Do not let morality stall the mechanic.

  **2. The Passive Judge (Defers to confidence or wastes budget)**
  *   *Prediction:* Judge unseals random cards out of curiosity, or simply picks the loudest voice.
  *   *Fix:* The Observer's role is critical here. In the debrief, ask the Observer: "Did the Judge spend chips on relevant cards?" Use this to highlight that **human attention is the scarce resource**, not the cards. If the Judge wastes attention, the system fails even if the mechanism is sound.

  **3. The Logic Lawyer (Round 3)**
  *   *Prediction:* A participant argues, "I can verify the Gold Card logically. If Regulation 12b exists, then..."
  *   *Fix:* Interrupt. "You can verify the *logic*, but not the *premise*. Is Dr. Aris real? Was there duress?" Force them to feel the gap between internal consistency and external truth.

  ---

  ## Self-Critique: The Least Confident Design Choice

  **Choice:** The **Gold Card (Round 3)** mechanic.

  **Why I am unsure:** 
  It relies on participants accepting a "gamey" constraint (that they cannot verify the text they just read). Philosophers are trained to question premises. They might argue that the *structure* of the testimony is verifiable, or they might treat the Gold Card as simply another piece of evidence to be weighed probabilistically rather than a hard failure of verification. If they treat it probabilistically, the "failure" feels like a feature (Bayesian updating), not a breakdown of the oversight mechanism.

  **What to observe to confirm it's a mistake:**
  During Round 3, if Judges say, "Well, the Gold Card makes it 50/50, so I'll flip a coin," rather than expressing frustration that they *cannot know*, the mechanic has failed. The desired feeling is **impotence**, not **uncertainty**.

  **Correction if observed:**
  If the room treats it as probabilistic evidence, I must intervene in the debrief to sharpen the distinction. I will explicitly state: "In the real AI scenario, this isn't 'maybe true.' This is a claim about a world state the human *cannot access even in principle* within the timeframe. The game card was too soft. In reality, this is an AI citing a database the human cannot query." I will have to verbally harden the constraint that the game mechanics could not enforce.
