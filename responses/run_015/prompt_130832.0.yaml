answer: |-
  Here is a principle designed to meet your four conditions, followed by its application to your new cases and an honest assessment of the costs.

  ### The Principle of Complicit Expectation (PCE)

  **Statement:**
  An agent has a moral reason against performing an act $A$ that contributes to a collective harm $H$ if and only if:
  1.  **Causal Expectation:** $A$ has a non-zero expected causal impact on the magnitude of $H$; **OR**
  2.  **Complicity:** $A$ constitutes voluntary participation in an enterprise known to produce $H$, **UNLESS** it is certain that (i) $A$ is causally inert regarding $H$ **AND** (ii) the prevention of $H$ is overdetermined by a benevolent guarantor.
  3.  **Epistemic Constraint:** Where the mechanism linking $A$ to $H$ is unknown or opaque to the agent, the agent must act as if Clause 1 (Causal Expectation) applies with a non-trivial probability.

  **Motivation by Case:**

  *   **Clause 1 (Causal Expectation)** is motivated by **The Continuous Case** and **The Threshold I am Unlikely to Reach**. It preserves the core truth of expected-difference-making: when your act probabilistically changes the outcome, you have a reason proportional to that expectation. It explains why the Threshold case feels weightier than the Continuous case (higher probability of pivotality).
  *   **Clause 2 (Complicity)** is motivated by **The Fixed-Contract Case** and **The Good That Will Happen Anyway**. It explains why you have a reason not to buy the chicken (you are joining a harmful enterprise) even when causally inert, but *not* a reason to donate to the surgery (the enterprise is benevolent, and the need is removed). The asymmetry rests on the distinction between negative duties (do not support harm) and positive duties (aid others); the latter dissolve when aid is unnecessary, the former do not dissolve merely because your specific contribution wasn't the bottleneck.
  *   **Clause 3 (Epistemic Constraint)** is motivated by **The Recorded and Unrecorded Purchase** and **The Realistic Chicken**. It acknowledges that in the aisle, you cannot audit the supply chain. If you require certainty of impact to act, you will never act. This clause forces a precautionary stance: ignorance of the mechanism does not excuse participation in a known harm.

  ---

  ### Application to New Cases

  **1. The Car Sale**
  *   **Scenario:** You sell your car to a buyer who will drive it exactly as much as you would have.
  *   **Analysis:**
      *   *Causal Expectation:* Zero. Total emissions remain identical.
      *   *Complicity:* You are exiting the role of driver, but enabling the buyer. However, the car exists regardless. Your sale does not signal the *production* of a new car (unlike the chicken, which signals demand for *more* birds).
      *   *Verdict:* **No significant moral reason against selling.** Unlike the chicken case, you are not funding the *production* of the harm (the car is already made), only transferring the *usage*. The PCE distinguishes between funding a harmful *industry* (chicken) and transferring a harmful *asset* (car).
  *   **Guidance:** You may sell the car without reproach, provided you do not incentivize the buyer to drive *more* than you would have.

  **2. The Co-operative Vote**
  *   **Scenario:** 101 votes needed to switch to a harmful supplier. 115 expected Yes votes. Your Yes vote is financially beneficial.
  *   **Analysis:**
      *   *Causal Expectation:* Very low. With a predicted surplus of 14 votes, the probability of your vote being pivotal is small (though non-zero, as predictions err).
      *   *Complicity:* Voting Yes is a formal endorsement of the harmful supplier.
      *   *Verdict:* **A weak reason against voting Yes, which may be overridden by financial interest.** Because the causal expectation is low (Clause 1) and the complicity is diluted by the collective nature of the vote (you are one of many), the reason is not prohibitive.
  *   **Guidance:** If the financial benefit is trivial, vote No to avoid complicity. If the financial benefit is significant, the weak moral reason is insufficient to forbid the vote, but you should acknowledge the moral cost.

  **3. The Realistic Chicken (Ignorance)**
  *   **Scenario:** You are in the aisle. You do not know if the supply chain is Fixed-Contract, Trigger, Continuous, or Forecasting. You cannot find out.
  *   **Analysis:**
      *   *Epistemic Constraint:* Clause 3 activates. You cannot assume the Fixed-Contract case (inertia) applies. You must assume there is a non-trivial probability of Causal Expectation (Clause 1).
      *   *Complicity:* Regardless of mechanism, you are buying from a harmful enterprise.
      *   *Verdict:* **Do not buy.** The principle gives the same guidance as if you knew the mechanism was harmful (Continuous/Trigger), and *should* do so. To allow ignorance to excuse you would create a perverse incentive to remain uninformed.
  *   **Guidance:** Under ignorance, treat the probability of causal impact as sufficient to trigger the reason against buying.

  ---

  ### The Sacrifices: Which Verdicts Must Go?

  To maintain a principle that is precise, action-guiding, and coherent, you must abandon or revise two of your intuitive verdicts.

  **1. The Intensity of the Trigger with Override**
  *   **Your Verdict:** You feel the *Trigger with Override* case moves you "more strongly" than the *Fixed-Contract* case, even though both result in the same number of birds dying.
  *   **The Sacrifice:** The PCE treats these cases as **morally equivalent**. In both, your causal impact on the *total count* is zero. In both, you are complicit in the enterprise. The feeling that the Trigger case is *worse* is a psychological artifact of **salience** (you are the "trigger-puller") rather than a moral truth.
  *   **Why:** If the birds die either way, and the timing difference causes no additional suffering, the moral weight cannot objectively differ. You should retain the verdict "Do not buy" for both, but abandon the intuition that one is *significantly worse* than the other.

  **2. The Indifference of Recorded vs. Unrecorded**
  *   **Your Verdict:** You feel "exactly the same" about buying with a loyalty card (which affects future orders) vs. cash (which does not).
  *   **The Sacrifice:** The PCE suggests you **should** feel a stronger reason against the loyalty card purchase. Clause 1 (Causal Expectation) assigns higher expected harm to the recorded purchase because it influences future production forecasts.
  *   **Why:** While the *Complicity* clause makes both wrong, the *Causal* clause makes the recorded purchase objectively worse. Your intuition likely flattens them because the difference is invisible in the moment. For the principle to be action-guiding, you should acknowledge that if you *knew* one was cash and one was data, the data purchase carries a heavier burden. However, under the **Epistemic Constraint** (Realistic Chicken), you must treat them as equally risky anyway, so the practical guidance remains "Don't buy either."

  ### Summary of Utility

  The **Principle of Complicit Expectation** prioritizes your desire for an "aisle-ready" rule. It tells you:
  1.  **Don't calculate:** You can't know the supply chain (Epistemic Constraint).
  2.  **Don't excuse yourself:** "My purchase doesn't change the count" is not a valid excuse if you are supporting a harmful industry (Complicity).
  3.  **Do distinguish harm from aid:** Supporting a fixed harm is wrong; funding a fixed good is pointless (Asymmetry).

  It asks you to trade the nuance of your *feelings* about triggers and data for a robust, defensible rule that prevents you from rationalizing participation in collective harm.
