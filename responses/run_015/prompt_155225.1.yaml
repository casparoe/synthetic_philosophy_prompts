answer: |-
  You have identified a structural feature of metaphysical debate that is widely felt but rarely named with the precision you are bringing to it. You are describing a move that preserves the *core* commitments of a theory (e.g., "numbers exist" or "numbers are fictions") while insulating that core from the *costs* usually associated with it (e.g., "how do we know them?" or "why are they useful?").

  There is no single, universally standardized noun for this specific object in the literature, but there are three overlapping conceptual frameworks that capture it. The most precise technical label comes from the philosophy of science applied to metaphysics, the most descriptive metaphor comes from the history of theory-change, and the most functional critique comes from naturalistic philosophy of mathematics.

  ### 1. The Technical Term: An Immunizing Auxiliary
  The closest established notion is Karl Popper's concept of an **immunization strategy**, specifically what Imre Lakatos refined as an **ad hoc auxiliary hypothesis (in the second sense)**.

  You rejected "ad hoc" because no empirical prediction failed. However, in metaphysics, the "data" being saved is not empirical observation but **theoretical tenability** or **intelligibility**.
  *   **The Anomaly:** The theory (e.g., Platonism) generates a skeptical paradox (Benacerraf's epistemological problem). The theory predicts "we have mathematical knowledge," but the ontology implies "we cannot have mathematical knowledge."
  *   **The Save:** The clause ("we have a special faculty") removes the contradiction.
  *   **Why it fits your description:** Lakatos distinguishes between *ad hoc* hypotheses that lead to new discoveries (progressive) and those that merely patch the hole without new content (degenerating). Your clauses are **Lakatosian $adhoc_2$**: they have no **independent testability**.

  **Proposed Label:** **Conceptually Immunizing Auxiliary.**
  This distinguishes it from empirical ad hocness. It signals that the clause's sole function is to render the theory immune to a specific conceptual objection without generating new conceptual consequences.

  ### 2. The Functional Mark: Explanatory Idleness
  You asked for the "exact mark separating such a clause from one with genuine content." The boundary is **Independent Leverage** (or **Explanatory Risk**).

  *   **Genuine Content (Field's Nominalism):** Hartry Field's claim that mathematics is *conservative* over nominalistic physics is a substantive claim about logic and proof theory. It could turn out to be false. If mathematics were shown to be *indispensable* for deriving nominalistic predictions (in a way that couldn't be paraphrased), Field's project fails. It puts the theory at risk. It also does work elsewhere (it informs how we reconstruct science).
  *   **Immunizing Clause (The "Special Faculty"):** The claim that we possess a non-causal cognitive faculty for accessing abstract objects has no failure conditions. No mathematical discovery can refute it; no psychological finding can falsify it (since the faculty is defined as whatever bridges the gap). It is **evidentially idle**.

  **The Mark:** A clause has genuine content if it **constrains the world** (or the conceptual space) enough that *something could count against it*. If the clause is compatible with all possible states of affairs regarding the objection it answers, it is an **Explanatory Idlewheel**.

  ### 3. The Package: A Degenerating Metaphysical Programme
  You asked what to call the package (Base View + Clauses). In Lakatosian terms, this is a **Degenerating Research Programme**.

  In the context of philosophy of mathematics specifically, Penelope Maddy provides a critique that aligns perfectly with your observation. In *Second Philosophy*, she distinguishes between:
  *   **Second Philosophy:** Viewing mathematical practice from within, using its own standards of evidence.
  *   **First Philosophy:** Imposing external metaphysical requirements on practice, then adding clauses to satisfy them.

  She argues that when Platonists add "mathematical intuition" to solve Benacerraf's problem, they are engaging in **"Philosophical Overreach."** The package you describe is what results when a metaphysical position becomes **Self-Insulating**.

  ### Summary of Terminology

  If you are looking for a label to use in your own writing, I recommend the following distinction:

  1.  **For the Clause:** Call it an **Immunizing Auxiliary** or a **Dialectical Epicycle**.
      *   *Why:* "Immunizing" captures the removal of failure conditions. "Epicycle" captures the historical analogy of adding complexity to save the phenomenon (tenability) without changing the core (the ontology).
  2.  **For the Boundary:** Call it **Independent Testability** or **Explanatory Leverage**.
      *   *Why:* This distinguishes Field's conservative nominalism (which risks mathematical falsehood) from Gödelian intuition (which risks nothing).
  3.  **For the Package:** Call it an **Immunized Framework** or a **Degenerating Metaphysical Position**.

  ### Why this phenomenon persists
  You noted that these clauses "keep the dispute going indefinitely." This is because they convert a **substantive disagreement** (about the world/math) into a **verbal or structural standoff**.

  *   **Platonist:** "Numbers exist + [We have a magic faculty]."
  *   **Nominalist:** "Numbers don't exist + [Discourse is conservative]."

  Both sides have rendered their positions unfalsifiable by conceptual standards. The dispute continues because neither side can force the other to concede; the "clauses" act as **shock absorbers** for counter-arguments.

  ### A Precise Definition for Your Use
  If you need to define this formally in a paper, you might propose:

  > **Metaphysical Immunization:** The addition of an auxiliary hypothesis $H$ to a theory $T$ such that:
  > 1.  $H$ is motivated solely by a specific objection $O$ to $T$.
  > 2.  $H \cup T$ resolves $O$.
  > 3.  $H$ generates no independent consequences $C$ (where $C$ is not already entailed by $T$ or $O$).
  > 4.  $H$ admits no failure conditions (it is compatible with all possible evidence relevant to $O$).

  This captures exactly what you described: it answers the objection, changes nothing else, and cannot be shown false. It is the engine of indefinite metaphysical stalemate.
