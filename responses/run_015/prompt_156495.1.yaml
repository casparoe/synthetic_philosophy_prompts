prompt: |-
  Hey — I referee for a small interdisciplinary journal (philosophy + cog sci) and maybe one paper in three rests most of its weight on a thought experiment: a trolley variant, an overnight violinist hookup, a neuron-by-neuron brain swap told as a slow ladder. I want a checklist I can actually run in ~15 minutes to decide whether the case is doing real work or just pumping an intuition, and what to put in the report when it's the latter (let it stand / needs a minimal-pair sibling / illustrative only / not fixable in a revision).

  Three failure modes I keep suspecting and want handled: filler-flip, where the reader silently fills the unstated background in from the actual world so two readers are running different cases (test: invert the defualt filler and see if the verdict flips); ramp pumps, where every step of a graded series looks fine and only the endpoint gets rejected (test: shuffle the steps, or skip straight to the end); and self-certifying description, where the case is told using the very term under dispute. Add any mode I'm missing, mark which checks are genuine requirements and which are just one camp's prejudice, and flag the points where it has to hand the decision to a human because it's a values or judgement call.

  Run it on those three cases, plus the colour scientist in the black-and-white room — I think that last one is genuinely persuasive, so if the procedure kills it say so plainly rather than letting it slide. My co-editor signs off on the report, so note which steps she can spot-check quickly. And be honest about what the procedure can't tell me.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Analyze the Request:**
      *   **User:** Referee for a small interdisciplinary journal (Philosophy + Cog Sci).
      *   **Problem:** Too many papers rely heavily on thought experiments (TEs). Need a way to distinguish between TEs doing "real work" vs. just "pumping intuition."
      *   **Goal:** A ~15-minute checklist to evaluate TEs, determine the verdict (let stand, needs sibling, illustrative only, not fixable), and identify specific failure modes.
      *   **Specific Failure Modes to Include:**
          1.  *Filler-flip:* Unstated background assumptions vary between readers.
          2.  *Ramp pumps:* Sorites-style gradualism where the endpoint is rejected despite acceptable steps.
          3.  *Self-certifying description:* Begging the question in the setup.
      *   **Additional Requirements:**
          *   Add missing failure modes.
          *   Mark genuine requirements vs. camp prejudices.
          *   Flag value/judgment calls (human decision needed).
          *   Run the checklist on four specific cases: Trolley Variant, Overnight Violinist, Neuron Swap, Mary the Colour Scientist.
          *   Be honest about limitations (what the procedure *can't* tell).
          *   Note steps the co-editor can spot-check.
      *   **Tone:** Professional, practical, critical, honest.

  2.  **Deconstruct the Checklist Design:**
      *   *Time Limit:* ~15 minutes. This means it can't be a deep dive into the literature. It needs to be heuristic.
      *   *Structure:* Needs to be actionable. "Check X, if Y then Z."
      *   *Verdicts:* The user wants specific outcomes (Let stand, Minimal-pair, Illustrative, Not fixable).
      *   *Failure Modes:* Need to operationalize the three provided + add missing ones.
      *   *Missing Failure Modes:* What else goes wrong with TEs?
          *   *Physical/Nomological Impossibility:* Does it violate laws of nature in a way that breaks the cognitive mechanism being tested? (Relevance constraint).
          *   *Emotional Overload:* Is the case so emotionally charged it drowns out the logic? (e.g., gruesome trolley variants).
          *   *The "Friedman/Schwitzgebel" problem:* Do people actually have the intuition the author claims? (Empirical check).

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Step 1: Setup & Clarity.* Is the case described clearly? (Basic hygiene).
      *   *Step 2: Question-Begging.* (Self-certifying description).
      *   *Step 3: Background Stability.* (Filler-flip).
      *   *Step 4: Gradualism.* (Ramp pumps).
      *   *Step 5: Empirical Plausibility.* (Cog Sci angle).
      *   *Step 6: Intuition Reliability.* (Are we trusting the gut too much?).
      *   *Step 7: Role in Argument.* (Is it the *only* support?).

      *Refining for Time:* Keep it to 5-6 core checks.
      *Refining for "Prejudice vs. Requirement":* Distinguish between "Must be physically possible" (Cog Sci requirement) vs. "Must align with common sense" (Philosophical prejudice).
      *Refining for "Human Call":* Where does the referee have to use judgment? (e.g., weighing the importance of the intuition).

  4.  **Addressing the Specific Failure Modes:**
      *   *Filler-flip:* Test: Invert the default.
      *   *Ramp pumps:* Test: Skip to end / Shuffle.
      *   *Self-certifying:* Test: Remove the loaded term.

  5.  **Running the Checklist on the Four Cases:**
      *   *Trolley Variant:* Classic. Often suffers from filler-flip (how realistic is the switch?) or emotional overload.
      *   *Violinist (Thomson):* Famous. Often suffers from self-certifying ("unconscious violinist" vs "person").
      *   *Neuron Swap:* Gradualism. Classic Ramp Pump risk.
      *   *Mary (Jackson):* User thinks it's persuasive. Need to be careful not to just kill it because it's a TE. Does it pass the "Filler-flip"? (Does everyone agree on what "knows" means?).

  6.  **Developing the Verdict Categories:**
      *   *Let Stand:* TE is robust, necessary, and clear.
      *   *Needs Minimal-Pair:* Sensitivity analysis needed (change one variable).
      *   *Illustrative Only:* TE supports but doesn't prove; needs empirical back-up.
      *   *Not Fixable:* The TE is fundamentally broken (begging the question, incoherent).

  7.  **Addressing the "Co-Editor" Constraint:**
      *   Highlight which steps are objective (e.g., "Is the term defined?") vs. subjective ("Is the intuition shared?").

  8.  **Addressing Limitations:**
      *   A checklist can't determine truth.
      *   It can't resolve deep metaphysical disagreements.
      *   It can't replace empirical data in Cog Sci.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the utility and the risk.
      *   *The Checklist:* 5 Steps.
      *   *Failure Modes:* Define the 3 + 2 new ones (Emotional Overload, Empirical Disconnect).
      *   *Application:* Run the 4 cases.
      *   *Verdict Guide:* When to use which recommendation.
      *   *Limitations:* Honesty section.

  10. **Refining the "Mary" Case:**
      *   The user suspects Mary is *good*. If my checklist kills it, I must admit that.
      *   Why is Mary good? It isolates *physical information* vs. *phenomenal experience*.
      *   Does it beg the question? Some say yes (if you define "know" physically).
      *   Does it have filler-flip? Maybe regarding what the room contains.
      *   *Decision:* The checklist should flag it for "Minimal-Pair" (Physicalist duplicates) rather than "Not Fixable." It survives, but needs careful handling.

  11. **Final Review against Constraints:**
      *   15 mins? Yes, if concise.
      *   Interdisciplinary? Yes, includes Cog Sci plausibility.
      *   Honest about limitations? Yes.
      *   Co-editor spot checks? Marked.

  12. **Writing the Response:** (Proceeding to generate output based on these thoughts). *Self-Correction during drafting:* Make sure I don't sound like I'm dismissing TEs entirely. They are tools. The goal is *calibration*. Ensure the distinction between "Philosophical Requirement" and "Cog Sci Requirement" is clear.

      *Added Failure Mode:* "The Black Box Intuition." Where the TE asks for a verdict but offers no mechanism for *why* we feel that way, which is fatal for Cog Sci.
      *Added Failure Mode:* "Stipulative Stacking." Where too many impossible things are stipulated to force a result.

      *Let's stick to the prompt's requested structure.*

      *Wait, one more thing:* The prompt asks to "mark which checks are genuine requirements and which are just one camp's prejudice." I need a specific icon or notation for this. Let's use [Req] and [Deb].

      *Also:* "Flag the points where it has to hand the decision to a human." I will mark these as [Judgment Call].

      *Let's assemble.*
answer: |-
  This is a practical tool for a specific bottleneck: distinguishing *argumentative leverage* from *rhetorical momentum*. Below is the **15-Minute Thought Experiment Stress Test (TEST)**.

  It is designed for interdisciplinary friction points. Philosophy often tolerates nomological impossibility; Cog Sci does not. This checklist forces the author to declare which game they are playing.

  ### Part 1: The 15-Minute TEST Checklist

  **Instructions:** Read the TE description and the immediate argument built on it. Set a timer. If you hit a [Judgment Call], stop the timer and note it for the report.

  #### 1. The Loaded Term Check (Self-Certifying Description)
  *   **Scan:** Does the setup use the concept under dispute to describe the scenario? (e.g., describing a "person" in an abortion argument, or "conscious" in a mind argument).
  *   **Test:** Remove the loaded term. Replace it with a neutral description (e.g., "biological entity," "system reporting state X"). Does the intuitive verdict hold?
  *   **Status:** [Req] If the verdict vanishes without the loaded term, the TE is question-begging.
  *   **Co-Editor Spot-Check:** Highlight the specific adjectives/nouns used in the setup.

  #### 2. The Background Stability Check (Filler-Flip)
  *   **Scan:** Identify the "silent defaults" (e.g., the trolley driver is sober, the violinist is a stranger, the room is sealed).
  *   **Test:** Invert *one* default assumption (e.g., the driver is the switch-puller's brother; the violinist is a criminal). Does the moral/intuitive verdict flip?
  *   **Status:** [Req] If the verdict flips on irrelevant background details, the TE is unstable.
  *   **Co-Editor Spot-Check:** Ask the author to list the top 3 background assumptions they relied on.

  #### 3. The Gradient Integrity Check (Ramp Pumps)
  *   **Scan:** Is the argument relying on a sorites-style series (Ship of Theseus, Neuron Swap)?
  *   **Test:** Look at the endpoint. If you skipped the ladder and presented *only* the endpoint case, would the reader grant the premise?
  *   **Status:** [Deb] *Philosophy:* Often acceptable to reveal inconsistency. *Cog Sci:* Unacceptable if it claims to model cognitive processing (brains don't process ladders, they process states).
  *   **Judgment Call:** Is the paper claiming a metaphysical point (Phil) or a mechanistic one (Cog Sci)?

  #### 4. The Empirical Anchor Check (Missing Mode: Nomological Drift)
  *   **Scan:** Does the TE violate known physical/psychological laws?
  *   **Test:** Ask: "Does this violation matter for the mechanism being tested?" (e.g., Teleportation matters for personal identity; frictionless planes do not matter for Newtonian gravity).
  *   **Status:** [Req] for Cog Sci claims. [Deb] for pure Metaphysics.
  *   **Co-Editor Spot-Check:** Verify if the paper claims "psychological plausibility." If yes, this is a hard fail if violated.

  #### 5. The Intuition Mechanism Check (Missing Mode: Black Box Intuition)
  *   **Scan:** Does the author ask *what* you think, or *why* you think it?
  *   **Test:** Interdisciplinary papers must explain the cognitive source of the intuition. If the TE says "You will feel X," is there a hypothesis for *why*?
  *   **Status:** [Req] for this journal. An intuition without a mechanism is just an anecdote.
  *   **Judgment Call:** Is the mechanism speculative but testable, or is it mystical?

  ---

  ### Part 2: Verdict Categories & Report Language

  When the checklist flags an issue, use these standard dispositions in your report.

  | Verdict | Condition | Report Language (Template) |
  | :--- | :--- | :--- |
  | **Let Stand** | Passes all [Req] checks. TE is the *only* way to isolate the variable. | "The thought experiment successfully isolates [Variable X] without relying on contested stipulations. It functions as a necessary control case." |
  | **Needs Minimal-Pair** | Fails **Background Stability**. Verdict depends on hidden defaults. | "The intuition appears sensitive to background assumptions (e.g., [Assumption Y]). Please run a minimal-pair variant where [Assumption Y] is inverted to demonstrate robustness." |
  | **Illustrative Only** | Fails **Empirical Anchor** or **Intuition Mechanism**. TE is heuristic, not proof. | "This case serves well as an illustration, but cannot bear the argumentative weight given [Nomological Violation/Lack of Mechanism]. Please downgrade claims from 'demonstrates' to 'suggests'." |
  | **Not Fixable** | Fails **Loaded Term** (Self-Certifying). | "The setup stipulates the conclusion via loaded terminology. Removing terms [A] and [B] collapses the intuition. This argument requires empirical or logical support independent of this case." |

  ---

  ### Part 3: Running the TEST on Your Four Cases

  Here is how the procedure evaluates the specific cases you mentioned.

  #### 1. The Trolley Variant
  *   **Loaded Term:** Usually clean ("pull lever," "divert track").
  *   **Background Stability:** **FAIL (Filler-Flip).** If the person on the track is a specific demographic, or if the lever is sticky, or if the puller knows the victims, verdicts shift wildly.
  *   **Gradient:** N/A (usually binary).
  *   **Empirical Anchor:** **FAIL.** People do not actually act this way in simulations.
  *   **Verdict:** **Illustrative Only.**
  *   **Report Note:** "This variant isolates the doctrine of double effect, but fails the Background Stability check. It should not be used to predict actual behavior (Cog Sci claim), only to map normative commitments (Phil claim)."

  #### 2. The Overnight Violinist (Thomson)
  *   **Loaded Term:** **FAIL (Self-Certifying).** Describing the entity as a "violinist" (implying personhood/artistry) vs "cluster of cells" drives the intuition.
  *   **Background Stability:** **FAIL.** The "kidnapping" element introduces a rights-violation confound unrelated to the right to life.
  *   **Verdict:** **Needs Minimal-Pair.**
  *   **Report Note:** "The 'kidnapping' background may be pumping the intuition of bodily autonomy rather than the right to life. A minimal-pair without the kidnapping element (e.g., voluntary assumption of care) is required to isolate the variable."

  #### 3. Neuron-by-Neuron Swap
  *   **Loaded Term:** Usually clean ("functional duplicate").
  *   **Gradient:** **FAIL (Ramp Pump).** If you present the endpoint (100% silicon) immediately, many reject consciousness. The ladder *creates* the intuition.
  *   **Empirical Anchor:** **FAIL.** Nomologically impossible currently.
  *   **Verdict:** **Illustrative Only** (for Metaphysics); **Not Fixable** (for Cog Sci mechanism).
  *   **Report Note:** "This relies on a Ramp Pump. The intuition at step 100 is not robust if step 1-99 are skipped. For a Cog Sci journal, this cannot serve as evidence for functionalism without empirical backing on partial replacements."

  #### 4. Mary the Colour Scientist (Jackson)
  *   **Loaded Term:** **PASS.** "Knows all physical facts" is the stipulation, not the conclusion. The conclusion is about "knowing what it's like."
  *   **Background Stability:** **PASS.** The room details (black/white) are irrelevant to the core epistemic gap.
  *   **Gradient:** N/A.
  *   **Empirical Anchor:** **DEBATABLE.** It posits a conceptual truth, not a physical one.
  *   **Intuition Mechanism:** **PASS.** It targets the distinction between propositional and phenomenal knowledge.
  *   **Verdict:** **Let Stand** (with caveats).
  *   **Honest Assessment:** The TEST does *not* kill Mary. It survives because it isolates a specific definitional gap (physical facts vs. qualitative experience) without relying on emotional filler or gradualist slipping.
  *   **Report Note:** "This case passes the Loaded Term and Background Stability checks. It effectively isolates the explanatory gap. However, authors must acknowledge that 'physical facts' is a contested term (Judgment Call)."

  ---

  ### Part 4: Limitations & Human Flags

  **What this procedure CANNOT tell you:**
  1.  **Truth:** A robust TE can still support a false theory. (The TEST checks structural integrity, not soundness).
  2.  **The "Camp" Divide:** Physicalists will fail Mary on the **Loaded Term** check (claiming "knows all physical facts" is incoherent). Dualists will pass it.
      *   *Human Flag:* You must decide if the paper is engaging with the opposition fairly or preaching to the choir.
  3.  **Cog Sci Relevance:** A TE can be philosophically valid but scientifically useless.
      *   *Human Flag:* If the paper claims to inform experimental design, a TE is almost always **Illustrative Only**.

  **Co-Editor Spot-Check List:**
  Give your co-editor this short list to verify your report without re-reading the paper:
  1.  Did the referee identify the **Loaded Terms** in the setup? (Yes/No)
  2.  Did the referee specify which **Background Default** was inverted? (Yes/No)
  3.  Is the Verdict category (Stand/Pair/Illustrative/Fixable) consistent with the checklist failures? (Yes/No)

  ### Summary of Failure Modes
  *   **Filler-Flip:** (Background Stability) *Requirement.*
  *   **Ramp Pumps:** (Gradient Integrity) *Requirement for Cog Sci; Debated for Phil.*
  *   **Self-Certifying:** (Loaded Term) *Requirement.*
  *   **Nomological Drift:** (Empirical Anchor) *Requirement for Cog Sci.*
  *   **Black Box Intuition:** (Intuition Mechanism) *Requirement for Interdisciplinary.*

  **Final Advice:** If a paper fails three or more [Req] checks, recommend **Reject** or **Major Revision** with a warning that the TE cannot carry the argument. If it fails only [Deb] checks, recommend **Illustrative Only** downgrading.
