prompt: |-
  I work as an auditor for a mid-sized seafood certification scheme — three of us, roughly 120 farm audits a year between us, mostly tropical shrimp and finfish operations in Southeast Asia and Latin America. My training is in fish health, not philosophy, but animal welfare has become the section of the audit that our retailer and NGO board members fight over, and I am the one who has to turn whatever we decide into something a field auditor can actually execute. The constraints are unglamorous: half a day per site, usually with a translator and a farm manager who decides which ponds I see; a bucket, a thermometer, a phone camera and no lab; about forty minutes of the visit for welfare; and a written finding that has to survive both a retailer's lawyer and an NGO campaigner reading the same paragraph. One of my two junior auditors has no training in animal-based indicators at all, and since the UK's Animal Welfare (Sentience) Act 2022 brought vertebrates and some invertebrates — octopuses and decapods among them — within the scope of sentience law, the board has started asking why our standard treats shrimp so differently from salmon, and I have no principled answer to give them.

  What I need is a decision procedure, not a position paper: the questions in order, what counts as a sufficient answer to each, where the procedure terminates in an automatic no, and where it stops and hands the decision to a person because the disagreement is really about what welfare is — felt experience, or health and normal function, or the chance to live a reasonably natural life. I have a draft I want you to stress-test, rewrite and reorder rather than accept: (1) a capacity-gap default, saying that where we cannot establish whether a taxon has the affective capacity a practice would engage, we score the practice against the more demanding plausible capacity rather than the one the producer assumes absent; (2) a detectability constraint, saying no requirement is admissible unless an auditor can verify compliance and detect non-compliance within a forty-minute visit, and that anything failing this must be labelled as paperwork or self-declaration rather than dressed up as an inspection; (3) a two-account rule, keeping lifetime welfare (roughly, time spent in aversive states) separate from the death itself, with the two non-compensable in both directions, plus whatever aggregation rule makes partial credit possible; (4) a rule for slaughter that immobility is not insensibility, specifying what field-observable evidence of insensibility would count and what to do when no such evidence exists for the taxon in front of me. Tell me which of these survive translation into an audit, which should be deleted, and what is missing.

  Then run the procedure on three real-shaped cases and give a committed verdict on each. First: a whiteleg shrimp hatchery that eyestalk-ablates its broodstock to induce spawning and now wants credit because it has started applying a topical anaesthetic first, with no data on whether the anaesthetic works in that tissue or how long it lasts. Second — the one where I expect to dislike the answer: a grow-out shrimp farm that harvests into an ice slurry and argues that thermal shock is a stun, and which our current standard gives full credit; the neighbouring farm installed an electrical stunner and gets the same credit, and I need to know how an auditor with no instruments distinguishes an animal that has stopped moving from one that cannot feel, and whether either farm passes. Third: a tilapia operation with excellent water quality and very low mortality but chronic crowding and a harvest sequence in which fish are crowded, lifted, and left in air for several minutes before killing. Be committed throughout: tell me which draft rules to keep and which to throw out, take a definite position on all three cases and on whether the chill-kill credit survives, and mark explicitly which steps of the procedure are genuine evidence and which are value judgements wearing a clipboard — along with an honest account of the cases where this procedure will misfire and what it simply cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Auditor for a mid-sized seafood certification scheme.
      *   **Team:** 3 auditors, ~120 audits/year (40 each).
      *   **Scope:** Tropical shrimp and finfish (SE Asia, Latin America).
      *   **Constraints:** 0.5 day/site, 40 mins for welfare, translator/farm manager gatekeeping, basic tools (bucket, thermometer, camera, phone), no lab.
      *   **Stakeholders:** Retailer lawyers (risk mitigation), NGO campaigners (ethical pressure), Board (confused about sentience/shrimp vs. salmon).
      *   **Problem:** Need a *decision procedure* for animal welfare auditing, not a philosophical treatise. Needs to be actionable, defensible, and transparent about where science ends and values begin.
      *   **Input:** A draft 4-point procedure (Capacity-gap default, Detectability constraint, Two-account rule, Slaughter/Immobility rule).
      *   **Task:** Stress-test, rewrite/reorder, decide what to keep/drop, identify missing elements, run on 3 specific cases, provide committed verdicts, and admit limitations.

  2.  **Evaluate the Draft Procedure:**
      *   *(1) Capacity-gap default:* "Score against more demanding plausible capacity."
          *   *Pros:* Precautionary principle. Aligns with UK Sentience Act logic.
          *   *Cons:* In an audit context, "plausible capacity" is vague. If we assume shrimp feel pain like salmon, does the standard collapse? It might make certification impossible for shrimp if the standard is designed for low-welfare assumptions. However, for *auditability*, it shifts the burden of proof to the producer.
          *   *Verdict:* Keep, but refine to "Precautionary Burden of Proof."
      *   *(2) Detectability constraint:* "No requirement admissible unless verifiable in 40 mins."
          *   *Pros:* Crucial for credibility. Prevents "paperwork welfare."
          *   *Cons:* Some welfare is hidden (chronic stress).
          *   *Verdict:* Keep. This is the core operational constraint. Differentiate between *Process Verification* (records) and *Outcome Verification* (animal state).
      *   *(3) Two-account rule:* "Lifetime welfare vs. Death." Non-compensatory.
          *   *Pros:* Prevents "good life justifies bad death."
          *   *Cons:* Hard to audit "lifetime" in a spot check. Requires record tracing.
          *   *Verdict:* Keep, but simplify. Call it "Life Phase Segregation."
      *   *(4) Slaughter/Immobility rule:* "Immobility $\neq$ Insensibility."
          *   *Pros:* Critical for harvest.
          *   *Cons:* Hard to verify without lab equipment (EEG, etc.).
          *   *Verdict:* Keep, but needs specific field proxies (reflex tests).

  3.  **Identify Missing Elements:**
      *   **The "Pass/Fail" Threshold:** When does a finding become a non-conformity vs. an observation?
      *   **The "Proxy" Problem:** How do we measure pain without biomarkers? (Need behavioral proxies).
      *   **The "Taxon" Problem:** How to handle the Shrimp vs. Salmon discrepancy explicitly?
      *   **The "Uncertainty" Flag:** A mechanism to label "We don't know, so we assume worst case."

  4.  **Develop the Revised Decision Procedure (The "Audit Protocol"):**
      *   Need to order it logically for a field auditor.
      *   Step 1: Taxon & Sentience Status (The Precautionary Baseline).
      *   Step 2: Detectability & Evidence Type (Can I see it?).
      *   Step 3: Life Phase Segregation (Husbandry vs. Slaughter).
      *   Step 4: The Insensibility Proxy (Specific to slaughter).
      *   *Add:* A "Value Judgment Flag" to mark where the auditor is making an ethical call, not a scientific one.

  5.  **Run the Procedure on the Three Cases:**

      *   **Case 1: Shrimp Hatchery (Eyestalk Ablation + Anesthetic)**
          *   *Issue:* Efficacy of anesthetic unknown.
          *   *Application:* Capacity-gap (assume they feel pain). Detectability (can't verify anesthetic efficacy in 40 mins).
          *   *Verdict:* Fail/Non-Conformity. Claim is paperwork, not verified outcome.
      *   **Case 2: Shrimp Harvest (Ice Slurry vs. Electrical Stunner)**
          *   *Issue:* Thermal shock vs. Electrical stun. Immobility vs. Insensibility.
          *   *Application:* Immobility $\neq$ Insensibility. Ice slurry causes pain before death (thermal shock). Electrical needs verification of parameters.
          *   *Verdict:* Ice Slurry fails (painful induction). Electrical passes *only if* parameters are logged and spot-checked (reflex test). Current standard giving credit to ice slurry is wrong under this protocol.
      *   **Case 3: Tilapia (Good Water, Bad Harvest)**
          *   *Issue:* Chronic crowding + Air exposure before kill.
          *   *Application:* Two-account rule. Good life (water) doesn't compensate for bad death (air asphyxiation).
          *   *Verdict:* Fail on slaughter phase. Crowding needs verification (density logs).

  6.  **Drafting the Response:**
      *   *Tone:* Professional, direct, operational, slightly weary but rigorous (matching the user's voice).
      *   *Structure:*
          1.  Executive Summary (Keep/Drop/Modify).
          2.  The Revised Decision Procedure (Step-by-Step).
          3.  Case Study Verdicts.
          4.  Limitations & Misfire Analysis.
      *   *Key Constraint:* Be committed. No hedging.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about keeping the "Two-account rule" as written. But for an auditor, "lifetime welfare" is impossible to audit in 40 mins. I need to reframe this as "Input Records vs. Output State."
      *   *Correction:* On the Ice Slurry case. If I say "Fail," the user needs to know *why* specifically. It's because thermal shock is an aversive stimulus before insensibility. The protocol must demand evidence of *time to insensibility* which ice slurry rarely provides.
      *   *Correction:* On the "Value Judgment" flag. I need to be explicit that "Sentience" is a value judgment in the absence of consensus science for invertebrates.
      *   *Refinement:* Ensure the distinction between "Major Non-Conformity" (Certification blocked) and "Minor" (Corrective Action) is clear, though the prompt asks for "Pass/Fail" style commitment. I will stick to "Compliant/Non-Compliant" for clarity.

  8.  **Final Polish:** Check against the "UK Sentience Act" mention. Ensure the shrimp/salmon discrepancy is addressed via the Precautionary Principle. Make sure the "40-minute" constraint is respected in every step.

  *(Self-Correction on Case 2)*: The user says the current standard gives full credit to ice slurry. My protocol must challenge this. If the protocol says "Immobility is not Insensibility," ice slurry usually fails because the animal freezes before losing sensation. I must be firm here.

  *(Self-Correction on Case 1)*: The anesthetic is topical. No data. Under "Capacity-gap," we assume it *doesn't* work until proven. So, Ablation = Mutilation without analgesia = Fail.

  *(Self-Correction on Case 3)*: Air asphyxiation is a major welfare issue in finfish. Even with good water quality, the death phase fails. The "Two-account" rule prevents the good water from cancelling the bad death.

  9.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Rewrite/Reorder draft? Yes.
      *   Committed verdicts? Yes.
      *   Mark evidence vs. value judgments? Yes.
      *   Honest account of misfires? Yes.

  Proceed to generate response.cw
answer: |-
  This is a operational design problem, not an ethical debate. You need a tool that survives legal scrutiny and field reality. Your draft is philosophically sound but operationally leaky. Specifically, your "Capacity-gap default" is too vague for a junior auditor, and your "Two-account rule" is impossible to audit in a spot check without robust record tracing.

  Here is the stress-tested, reordered decision procedure, followed by the verdicts on your three cases.

  ### Part 1: The Revised Decision Procedure (The "Welfare Audit Protocol")

  I have reordered your four points into a logical flow for a field visit and renamed them for operational clarity. I have deleted the "aggregation rule" from your point 3 because aggregation allows trade-offs that NGOs will attack and lawyers will exploit.

  **Step 1: The Precautionary Baseline (Revised Capacity-Gap)**
  *   **The Rule:** For any taxon where sentience is scientifically contested (e.g., decapods), the auditor must proceed *as if* the animal has the highest plausible capacity for affective experience recognized by the scheme's governing body (e.g., UK Sentience Act standards).
  *   **The Test:** Does the producer assume the animal *cannot* feel pain/stress?
  *   **The Verdict:** If **Yes**, and the practice would cause pain/stress in a vertebrate, this is an automatic **Non-Compliance (NC)** unless the producer provides peer-reviewed evidence of insensibility specific to that taxon/tissue.
  *   **Why:** This solves the shrimp/salmon discrepancy without needing new science. It shifts the burden of proof to the producer.
  *   **Constraint:** This is a **Value Judgment**. Mark it as such in the report.

  **Step 2: The Observability Filter (Revised Detectability)**
  *   **The Rule:** A welfare claim is only valid if the auditor can verify the *outcome* (animal state), not just the *input* (policy), within the 40-minute window.
  *   **The Test:** Can I verify this with my eyes, a thermometer, or a reflex test right now?
  *   **The Verdict:**
      *   If **Yes**: It is an **Audit Point**.
      *   If **No** (e.g., "we apply anaesthetic," "water was good last month"): It is a **Documentation Review**. If documentation is the *only* evidence, the finding must be labelled "Unverified Claim" in the public summary.
  *   **Why:** Prevents "paperwork welfare."

  **Step 3: Phase Segregation (Revised Two-Account)**
  *   **The Rule:** Husbandry (Life) and Slaughter (Death) are scored independently. A pass in one cannot compensate for a fail in the other.
  *   **The Test:** Are there distinct failure modes in the grow-out phase vs. the harvest phase?
  *   **The Verdict:** If Slaughter fails, the Certification is **Suspended** regardless of Husbandry score. (Retailers fear slaughter scandals more than crowding).
  *   **Why:** Prevents the "good life justifies bad death" argument.

  **Step 4: The Insensibility Proxy (Revised Slaughter Rule)**
  *   **The Rule:** Immobility is not evidence of insensibility. Evidence of insensibility requires the absence of specific reflexes.
  *   **The Test:** For the specific taxon, is there a field-testable reflex (e.g., tail flip in shrimp, eye roll in fish) that correlates with consciousness?
  *   **The Verdict:**
      *   If a validated reflex exists: Auditor must test 5 random animals. If reflex present = **NC**.
      *   If no validated reflex exists: The method is **Non-Compliant** by default (Precautionary Baseline applies).
  *   **Why:** "Stopped moving" is the most common audit failure point. This forces a biological standard.

  ---

  ### Part 2: Case Verdicts

  Here is the procedure applied to your three cases. I am taking a definite position.

  #### Case 1: Shrimp Hatchery (Eyestalk Ablation + Topical Anaesthetic)
  *   **Application:**
      *   **Step 1 (Precautionary):** We assume ablation causes pain. The burden is on the hatchery to prove the anaesthetic works.
      *   **Step 2 (Observability):** You have no lab. You cannot verify tissue absorption or duration of action in 40 minutes. The claim is "Unverified."
      *   **Step 4 (Insensibility):** There is no field reflex to prove the ablation site is numb.
  *   **Verdict:** **Non-Compliant.**
  *   **Rationale:** Under the Precautionary Baseline, a mutilation without *verified* analgesia is a welfare violation. "We applied cream" is paperwork, not welfare.
  *   **Action:** Credit is denied. The standard must require peer-reviewed data on the specific anaesthetic/shrimp tissue combination before the practice is allowed, or the practice must be banned.

  #### Case 2: Shrimp Harvest (Ice Slurry vs. Electrical Stunner)
  *   **Application:**
      *   **Step 1 (Precautionary):** Thermal shock (ice slurry) causes nociceptive firing before insensibility. We assume shrimp feel this.
      *   **Step 4 (Insensibility):**
          *   *Ice Slurry:* Immobility occurs due to cold paralysis, not necessarily brain shutdown. There is no reflex test available to the auditor to confirm insensibility *before* death. Under Step 4 (If no validated reflex exists = Non-Compliant), this fails.
          *   *Electrical:* If the stunner has a digital readout of voltage/frequency and a log, and the auditor observes a reflex test (e.g., no tail flip response to pinch) on 5 samples post-stun/pre-kill, it passes Step 2 and 4.
  *   **Verdict:** **Ice Slurry Fails. Electrical Passes (conditional).**
  *   **Rationale:** Your current standard giving credit to ice slurry is scientifically indefensible under the Sentience Act framework. Thermal shock is a stressor, not a stun. The auditor distinguishes "stopped moving" from "insensible" by demanding a reflex test. If the shrimp does not react to a tactile stimulus *after* chilling but *before* death, it might be insensible. If you can't test that, you can't certify it.
  *   **Action:** Revoke credit for ice slurry harvest immediately. It is a liability.

  #### Case 3: Tilapia (Good Water, Bad Harvest)
  *   **Application:**
      *   **Step 3 (Phase Segregation):** Water quality (Husbandry) is excellent. Harvest (Slaughter) involves air asphyxiation.
      *   **Step 4 (Insensibility):** Air asphyxiation takes minutes. Consciousness is retained during gill collapse.
      *   **Step 3 (Compensation):** Good water does not cancel bad death.
  *   **Verdict:** **Non-Compliant (Slaughter Phase).**
  *   **Rationale:** Under Phase Segregation, the slaughter failure triggers a suspension regardless of mortality rates. Air asphyxiation is a known high-welfare-risk method.
  *   **Action:** Certification suspended until harvest method changes (e.g., to percussive or electrical stun).

  ---

  ### Part 3: What Survives, What Gets Cut, and What's Missing

  **Keep:**
  *   **The Detectability Constraint:** This is your shield against lawyers. If you can't see it, you can't audit it.
  *   **The Slaughter Rule:** "Immobility $\neq$ Insensibility" is the single most important sentence in your standard.
  *   **The Precautionary Baseline:** This is the only way to answer the Board's question about shrimp vs. salmon without waiting for a PhD thesis.

  **Delete:**
  *   **The Aggregation Rule:** Do not allow "partial credit" that averages out a bad death with a good life. It creates a "welfare laundering" loophole.
  *   **"Reasonably Natural Life":** This is un-auditable. Stick to "Absence of Aversive States" (negative welfare) which is easier to evidence than "positive welfare."

  **Missing:**
  *   **The "Uncertainty Flag":** You need a specific code in your reporting software for "Scientific Uncertainty." When you fail the Ice Slurry farm, the report should read: *Non-Compliant. Reason: Method assumes insensibility without evidence. Status: Scientific Consensus Pending.* This protects you from the producer suing you for "lack of scientific proof" while satisfying the NGO that you aren't ignoring the risk.
  *   **A Reflex Library:** You cannot send auditors in without a one-page laminated card listing the specific reflex test for Shrimp vs. Tilapia vs. Salmon. (e.g., Shrimp: Tail flip response to uropod pinch; Tilapia: Opercular movement/Eye roll).

  ### Part 4: Evidence vs. Value Judgments (The "Clipboard" Disclosure)

  You asked to mark which steps are evidence and which are values. Be explicit about this in your internal guidance to protect your auditors.

  1.  **Precautionary Baseline:** **Value Judgment.** Science does not confirm shrimp pain equivalence to salmon. We *choose* to treat them as such to mitigate risk. *Label this in the report as a "Policy Decision."*
  2.  **Detectability:** **Operational Fact.** Either the auditor saw it or they didn't.
  3.  **Phase Segregation:** **Value Judgment.** We *decide* that death quality outweighs life quality. This is ethical, not scientific.
  4.  **Reflex Tests:** **Scientific Proxy.** It is evidence, but imperfect. A lack of reflex *suggests* insensibility; it does not prove it. *Label as "Best Available Field Proxy."*

  ### Part 5: Where This Procedure Will Misfire

  Be honest with your Board. This protocol has three failure modes:

  1.  **The False Negative (The "Good Farm" Fail):** A farm might be using ice slurry effectively (e.g., super-chilled brine that induces instant insensibility), but because there is no field reflex test validated for that specific temperature/species combo, your auditor must fail them. You will lose good producers because the science hasn't caught up to the audit tool.
      *   *Mitigation:* Create a "Research Exemption" clause where producers can fund the validation study to get certified during the interim.
  2.  **The Translator/Manager Gatekeeper:** In 40 minutes, a farm manager can hide the sick pond or the slow harvest line. The Detectability Constraint assumes honest access. If the manager controls the sample, the reflex test is useless.
      *   *Mitigation:* Randomization protocol. The auditor, not the manager, selects the 5 animals for the reflex test. If the manager refuses, it is an automatic Non-Compliance on "Access."
  3.  **The Invertebrate Wall:** For shrimp, we literally do not know what insensibility looks like behaviorally. The reflex test is a guess. If an NGO challenges you saying "Shrimp don't have the neural architecture for pain," your Precautionary Baseline looks like activism. If they challenge you saying "You treated them like vegetables," it looks like negligence.
      *   *Mitigation:* Consistency. Apply the exact same Precautionary Baseline to all invertebrates in the scheme. Do not make exceptions for "small" farms.

  ### Final Recommendation

  Adopt the **Revised Decision Procedure** immediately. It forces the difficult conversations upstream (with the Board and Standard Committee) rather than downstream (with you in a muddy pond).

  **Immediate Action:**
  1.  Issue a Technical Bulletin stating that **Ice Slurry Harvest no longer qualifies as a "Stun"** under the new Sentience alignment.
  2.  Provide auditors with the **Reflex Library** (laminated).
  3.  Update the audit report template to include the **"Uncertainty Flag"** and **"Value Judgment"** disclosure fields.

  This will not make you popular with the producers using ice slurries. It will make you robust against the NGOs and the UK Act. That is the trade-off. Take it.
