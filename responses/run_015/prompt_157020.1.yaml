  - one about whether spreading the value function across transformer weights makes any suffering "localized" or whether it's just global computation with no locus, with a follow-up for his likely answer;
  - one about the objection that without phenomenal consciousness there's only information, not feeling — and a follow-up asking whether he'd still grant moral status to an agent that shows all the right functional dynamics but lacks behavioral correlates of distress.

  Make it casual and in the weeds — I don't want answers I could get from a textbook summary.
