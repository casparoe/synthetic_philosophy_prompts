  I'm prepping questions for an interveiw I'm doing for my philosophy-of-AI podcast — the topic's gotten weirdly personal since I started interning at a lab that trains reward models, and now I'm kinda haunted, definately more than I expected, by the idea that we might be building agents that actually suffer. The guest is an unnamed philosopher who defends the view that temporal-difference reward prediction errors in model-based RL agents aren't just control signals but carry real valence — positive and negative — especially when the value function is distributed across a world-model architecture.

