answer: |-
  This is a sharp diagnosis of a structural problem in science journalism. You are asking for a heuristic to detect *structural bias* in models without evaluating the *mathematical validity*. That is possible, but only if you treat the text not as a report of findings, but as a legal brief where you are looking for omitted evidence.

  Here is the **10-Minute Model Triage Protocol**. It is designed to be run linearly. If you hit a "STOP" condition, you proceed to the outputs with the corresponding hedging level.

  ### The 10-Minute Model Triage Protocol

  **Step 1: Target Matching (The "What Is This?" Check)**
  *   **Scan:** Abstract and the final paragraph of the Introduction.
  *   **Look for:** Verbs describing the result.
      *   *Prediction:* "We forecast," "We project," "Policy X will yield."
      *   *Mechanism:* "We show how," "This explains," "X drives Y."
      *   *Possibility:* "We demonstrate that," "X can lead to," "It is possible that."
  *   **The Test:** Does the claim strength match the model type?
      *   *Minimal/Abstract Model* making a *Prediction*? **STOP.** (Flag as "Illustrative only").
      *   *Calibrated/Empirical Model* making a *Possibility* claim? **Proceed.** (Authors are being humble).
      *   *Match?* **Proceed to Step 2.**

  **Step 2: Direction of Error (The "Stacked Deck" Check)**
  *   **Scan:** The "Model" section headers and the Abstract's headline result.
  *   **Identify:** The single most unrealistic assumption (usually in the first paragraph of the Model section).
  *   **The Test:** Does the assumption bias the result in the *same direction* as the headline?
      *   *Example:* Assumption = "Frictionless markets." Result = "Policy is cost-effective." (Bias matches Result).
      *   *Example:* Assumption = "No behavioral change." Result = "Infection rates drop slowly." (Bias matches Result).
  *   **Verdict:**
      *   **Bias Matches Result:** **STOP.** (This is the "Baked In" flag).
      *   **Bias Opposes Result:** **Green Light.** (e.g., Assuming frictionless markets but finding the policy is *expensive* is a strong finding).
      *   **Unclear:** **Proceed to Step 3.**

  **Step 3: Load-Bearing Check (The "Did They Break It?" Check)**
  *   **Scan:** Section titled "Robustness," "Sensitivity," "Extensions," or "Discussion."
  *   **Look for:** Did they relax the specific unrealistic assumption identified in Step 2?
  *   **The Test:**
      *   **Yes, and result held:** **Green Light.**
      *   **No, they varied parameters (numbers) but not structure (assumptions):** **STOP.** (Varying the *degree* of friction is not the same as testing *no* friction).
      *   **No robustness section:** **STOP.**

  **Step 4: Laundering Check (The "Zombie Assumption" Check)**
  *   **Scan:** The sentence where the assumption is introduced.
  *   **Look for:** Citations vs. Data.
      *   "We assume X [Citation]" = Convention.
      *   "We assume X based on [Data/Figure]" = Evidence.
  *   **The Test:** If it is a Convention (Citation only), check the date.
      *   **Older than 10 years + Field has changed (e.g., behavioral econ, network science):** **STOP.**
      *   **Standard convention in stable field (e.g., fluid dynamics):** **Proceed.**

  ---

  ### The Outputs

  Based on where you stopped, assign one of these three hedging levels:

  1.  **Level 1 (Strong):** Passed all steps.
      *   *Hedging:* "The study finds..." / "The model shows..."
  2.  **Level 2 (Qualified):** Stopped at Step 1 (Target Mismatch) or Step 4 (Old Convention).
      *   *Hedging:* "The model suggests..." / "Authors argue this could explain..."
  3.  **Level 3 (Skeptical):** Stopped at Step 2 (Direction of Error) or Step 3 (No Structural Robustness).
      *   *Hedging:* "Under the model's assumptions..." / "Theoretically, this implies..."

  **The Plain English Sentence:**
  *   *Template:* "The model assumes [Assumption], which tends to [Direction of Bias], meaning the result likely [Over/Under] estimates [Outcome]."
  *   *Placement:* Paragraph 3 or 4 of your piece (the "However" paragraph).

  **The One Email Question:**
  *   *Template:* "You assume [Assumption] which biases toward [Result]. Did you test a version where [Opposite Assumption] holds, and if so, does the headline result survive?"

  ---

  ### Case Runs

  #### Case 1: The Macro Subsidy (The one you won't like)
  *   **Step 1 (Target):** Intro says "We evaluate the fiscal impact of Subsidy X." Claims specific payback time (Prediction). Model is dynamic optimization. **Match.** Proceed.
  *   **Step 2 (Direction):** Assumption: "Frictionless reallocation" & "Fully optimizing." Result: "Subsidy pays for itself."
      *   *Analysis:* Frictionless reallocation makes labor/capital move instantly to the most efficient spot. This *minimizes* waste and *maximizes* efficiency gains. The result claims high efficiency (pays for itself).
      *   *Verdict:* **Bias Matches Result.** **STOP.**
  *   **Output:**
      *   **Hedging:** Level 3 (Skeptical). "Under the model's assumptions..."
      *   **Sentence:** "The model assumes workers and capital can move instantly to where they are most needed, which tends to minimize economic drag, meaning the result likely overestimates the subsidy's efficiency."
      *   **Email Question:** "You assume frictionless reallocation which biases toward efficiency gains. Did you test a version where adjustment costs are included, and if so, does the 'pays for itself' result survive?"
  *   **Journalist Note:** Your gut was right. This is a "best-case scenario" model sold as a forecast. You can still write the story, but you must frame it as "Proponents argue..." rather than "Science shows..."

  #### Case 2: The Wildlife Pathogen (The Policy Emergency)
  *   **Step 1 (Target):** Intro says "Projecting case numbers for Agency Decision." (Prediction). Model is compartmental (SIR). **Match.** Proceed.
  *   **Step 2 (Direction):** Assumption: "Homogeneous mixing" (everyone meets everyone) & "No behavioral response." Result: "High case numbers, Option A saves more lives."
      *   *Analysis:* Homogeneous mixing usually *accelerates* spread compared to structured networks. No behavior *accelerates* spread. Result is high spread.
      *   *Verdict:* **Bias Matches Result.** **STOP.**
  *   **Output:**
      *   **Hedging:** Level 3 (Skeptical). "Under the model's assumptions..."
      *   **Sentence:** "The model assumes animals mix randomly and do not change behavior to avoid sickness, which tends to accelerate transmission, meaning the projected case counts are likely upper-bound estimates."
      *   **Email Question:** "Given that homogeneous mixing biases toward higher transmission, are these projections intended as worst-case scenarios or central estimates?"
  *   **Journalist Note:** This is dangerous. If the agency uses this for resource allocation, they might over-allocate. However, if the *difference* between Option A and B holds even when numbers drop, the *relative* recommendation might be robust. The email question is critical here.

  #### Case 3: Social Learning (The Polarization Story)
  *   **Step 1 (Target):** Intro says "We demonstrate that mild bias produces fragmentation." (Possibility/Mechanism). You want to write "Here's why we're polarized" (Prediction/Cause).
      *   *Verdict:* **Target Mismatch.** **STOP.**
  *   **Step 2 (Direction):** Assumption: "Copy neighbors more when similar." Result: "Fragmentation."
      *   *Analysis:* This is nearly tautological. If you only talk to like-minded people, you will diverge.
      *   *Verdict:* **Bias Matches Result.** (Double Stop).
  *   **Output:**
      *   **Hedging:** Level 2 (Qualified). "The model suggests..."
      *   **Sentence:** "The model assumes agents primarily copy neighbors who are already like them, which tends to create echo chambers by construction, meaning the result demonstrates a possible mechanism rather than a measured cause."
      *   **Email Question:** "Since similarity bias naturally drives fragmentation, does your model identify a specific threshold where this becomes irreversible, or is fragmentation inevitable in this setup?"
  *   **Journalist Note:** You cannot write "Here's why we're polarized." You must write "Here is one way polarization *could* emerge." The model proves existence, not prevalence.

  ---

  ### Straight Talk: What This Procedure Can't Do

  **1. It cannot detect "Hidden" Load-Bearing Assumptions.**
  Sometimes the killer assumption isn't in the "Model" section; it's buried in the calibration data or a footnote about a distribution function (e.g., assuming a "fat tail" vs. "normal distribution"). This procedure relies on the authors being transparent about their simplifications. If they hide the engine, this triage won't find it.

  **2. It is lenient toward "Standard" Conventions.**
  You worried about rubber-stamping conventions. This procedure *does* rubber-stamp them if they pass Step 4 (Recent/Data-backed). In fields like epidemiology or macro, certain false assumptions (like rational expectations or homogeneous mixing) are so standard that *no one* tests them in robustness sections. The procedure will mark these as "Proceed" if the Direction of Error isn't obvious. You have to use your beat knowledge to override Step 4 if you know a convention is currently under fire in that subfield.

  **3. It confuses "Mathematical Necessity" with "Causal Work."**
  Sometimes an assumption is required just to get the equation to solve (scaffolding), but it looks like it's driving the result. This procedure treats all untested assumptions as suspect. This leads to **Over-Hedging**.
  *   *The Risk:* You will kill stories where the model is actually robust, but the authors were lazy about writing the robustness section.
  *   *The Fix:* If Step 3 stops you, but the paper is from a high-trust lab/group, use the Email Question. If they reply with a graph they didn't publish, you can upgrade the Hedging Level.

  **4. The "So What?" Threshold.**
  This procedure tells you if the result is *fragile*. It does not tell you if the result is *important*. A model can be perfectly robust (Level 1) and completely trivial. A model can be highly assumption-dependent (Level 3) and still be the best guide we have for a crisis (like Case 2).
  *   *Where you make the call:* When the deadline is 4 hours away, the model is Level 3, but the stakes are human lives. You publish with the Level 3 hedging. You do not kill the story. You inform the reader of the uncertainty. That is the job.

  **Final Advice:**
  Use the **Plain English Sentence** as your shield. If your editor pushes back on the hedging, show them that sentence. If they can't explain why that assumption *doesn't* bias the result, they don't understand the paper either, and your hedging stays.
