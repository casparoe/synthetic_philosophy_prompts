  5.  **Drafting Section 3: The Cruxes (The "Why"):**
      *   Crux 1: Positive Liberty vs. Negative Liberty. (Freedom *to* vs. Freedom *from*).
      *   Crux 2: The Source of Good. (Collective action vs. Individual initiative).
      *   Crux 3: The Definition of Fairness. (Equal outcomes/support vs. Equal rules).

  6.  **Drafting Section 4: School Test Cases:**
