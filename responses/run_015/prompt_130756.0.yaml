      *   *Normative Layer:* The user suggests predicting returns $\neq$ predicting survival. This is spot on. Instrumentalism evaluates the *theory*, but if the theory ignores tail risk (survival), it's instrumentally useful until it isn't. This touches on the "domain" problem.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the question. Set the stage (Friedman's 1953 essay).
