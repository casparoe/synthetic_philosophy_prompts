          *   *Proposed Principle:* **The Principle of Improper Channeling.** An act is corrupt if a decision or action regarding a public good is determined by a *particularistic* claim (personal, relational, financial) rather than the *universalistic* criteria mandated by the office's purpose, *unless* the particularistic claim is a matter of basic survival or the office itself is constituted by those particularistic ties.
