prompt: |-
  I am a third-year undergraduate, and I sit as one of two voting student members on my university's Senate Committee on Institutional Values. The committee exists to produce joint recommendations on questions where the disagreement is not about how much of a single good to supply but about which considerations are reasons at all: divestment and the endowment, speech and events policy, memorialisation and naming, partnerships with outside organisations, the terms on which religious and secular student groups share university space. We get perhaps a dozen of these a year. We meet fortnightly for ninety minutes. The other members are two faculty, the university chaplain, the chief investment officer, a member of HR, and the Senate clerk; none of them has studied philosophy. Anything we produce goes to the Senate and, if it touches money, onward to a Board subcommittee, so it has to survive review by people who were not in the room, and it has to state its reasons in plain language inside a page.

  This term I am also taking a seminar on value pluralism and public reason, and I have been trying to turn what I am reading into something my committee could actually run. The framing I find most attractive is the gains-from-trade one: where parties weight issues differently and no party can simply win, a package can leave each side better off than the realistic no-deal outcome, on its own ranking, without anyone converting to anyone else's values. The literature puts obvious pressure on that framing, and I want the pressure built into the procedure rather than left outside it: the pluralist point that the losses here are not commensurable on any single scale; the integrity objection, that a person can be asked to do what they would rather not do but not to become a different kind of person; Margalit's category of rotten compromises, and his worry about agents compromising on behalf of collectives they do not own; the contrast between a modus vivendi and something closer to an overlapping consensus; and the dirty-hands problem, that some residue survives a justified agreement and does not wash off.

  I have drafted six candidate tests, and I am fairly sure some of them are unworkable or duplicate each other. Please turn them into a procedure, cutting, merging, and rewriting as you see fit, and telling me plainly where a step is a rule of thumb rather than something the theory supports.

  1. Gains over the feasible set: each party must prefer the package, on its own ranking, to the no-deal outcome and to every other package actually on the table. My worry: parties rank packages while hating particular clauses, so I do not know whether the test should apply at package level, clause level, or both; and the no-deal baseline is itself contested, since each side threatens a different one.
  2. Non-affirmation: no party may be required to assert, sign, or enact a proposition it takes to be false. Silence, forbearance, and action may be required; assertion may not. My worry: silence can function as endorsement when a party has a standing duty to speak, and some parties will refuse forbearance too.
  3. A residue ledger: for each clause, record who bears residual moral cost, and stop if one side pays in integrity while the other pays only in money, convenience, or reputation. My worry: everyone will inflate their residue, and cross-currency trades may be the only trades available.
  4. The absent-party test: identify who bears the residue without holding a seat, and stop if the residue falls wholly on such parties. My worry: it is easy to weaponise, since every faction will claim to speak for someone not present.
  5. Lock-in and sunset: prefer reversible forms to irreversible ones, and flag clauses that create precedent, path-dependence, or new institutional facts. My worry: some of the goods at stake, such as an apology or a named scholarship, are irreversible by their nature.
  6. Dissent preservation: signatories may publicly record that they signed under protest without voiding their signature. My worry: this seems to collide with the point of a joint statement, since public dissent destroys much of what the other side was buying.

  Two further problems I want handled explicitly. The first is agenda-setting: committee preferences can cycle across packages in the way majority preferences cycle among options, so the feasible set is not well defined, and whoever sets the order of votes partly picks the winner. The second is what I think of as no-cost waiting: if one party can expect to get everything simply by refusing and outlasting the others, no gains-from-trade argument binds it, and I am not sure whether a procedure should say anything about that or simply report it.

  What I want back, in three parts. First, the procedure itself: gates in a fixed order, what counts as a sufficient answer at each gate, where it stops with a no, and where it hands the question to a named person or to a vote because it is a question of values rather than facts. It has to be runnable in about twenty minutes at the end of a meeting, out loud, by the clerk, with the committee answering; it has to produce a short written record the Senate can audit; and it should say how it resists strategic behaviour, especially inflated claims of residue. Second, three worked applications, with the ledger actually shown:

  a. Endowment. A divestment campaign wants withdrawal and condemnation; the chief investment officer says the committee has a fiduciary duty and no view on moral questions. On the table: withdrawal from a narrow, defined slice of holdings, a published transparency report, funded scholarships for students from regions affected by extraction, and no condemnation language anywhere in the document.
  b. Naming. The only deal on offer is that the university changes the name on a building in exchange for the campaigners withdrawing their public allegation that the university knowingly profited, and joining a statement recording that the university acted in good faith throughout. I want the name changed and I think this is the best available outcome; my suspicion is that the procedure will tell me no.
  c. Speech and events. Secular-liberal members want an unqualified expression policy; religious and some identity-based groups want a dignity carve-out and a funded support programme for groups that get targeted. On the table: content-neutral time, place, and manner rules, a commitment that no invited speaker will be disinvited, and money for the support programme. My guess is that this one is genuinely unsettled by any procedure, and I would rather you marked exactly where judgment takes over than forced an answer.

  Third, and briefly, what the procedure cannot do: cases it should not be applied to at all, questions it will silently beg, and the point at which running it becomes a way of laundering a decision someone else has already made.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year undergraduate, voting member of a University Senate Committee on Institutional Values.
      *   **Committee Composition:** 2 students (voting), 2 faculty, chaplain, CIO, HR, Senate clerk. None are philosophers.
      *   **Task:** Produce joint recommendations on value-laden issues (divestment, speech, naming, etc.).
      *   **Constraints:** Fortnightly meetings, 90 mins total (so ~20 mins for this procedure), recommendations go to Senate/Board (must survive review, plain language, <1 page).
      *   **Intellectual Framework:** Value pluralism, public reason, gains-from-trade (logrolling/packaging), but aware of critiques (incommensurability, integrity, rotten compromises, agency, dirty hands).
      *   **Input:** Six draft tests with specific worries about each. Two additional structural problems (agenda-setting, no-cost waiting).
      *   **Output Requirements:**
          1.  A refined procedure (gates, order, stopping rules, audit trail, anti-strategy measures).
          2.  Three worked applications (Endowment, Naming, Speech) with ledgers.
          3.  Limitations (where not to apply, begged questions, laundering risks).

  2.  **Deconstruct and Refine the Six Tests:**
      *   *Test 1 (Gains over feasible set):* Core "gains-from-trade." Needs to be package-level, not clause-level (logrolling requires trade-offs). Baseline issue needs fixing (status quo vs. escalation).
      *   *Test 2 (Non-affirmation):* Core integrity constraint. Needs to distinguish between *doing* and *saying*. Silence issue is real but manageable (abstention vs. assent).
      *   *Test 3 (Residue ledger):* Incommensurability check. Needs to prevent inflation. Focus on *kind* of loss (integrity vs. preference).
      *   *Test 4 (Absent-party test):* Representation issue. Hard to verify. Better to fold into "Residue" or "Non-affirmation" regarding who bears the cost. If the absent party isn't represented, the committee might lack standing. Let's merge this into the "Standing/Agency" check.
      *   *Test 5 (Lock-in/Sunset):* Reversibility. Good heuristic for uncertainty.
      *   *Test 6 (Dissent preservation):* Public reason vs. unity. Needs to allow "concurring/dissenting" opinions without killing the deal.

      *   *Structural Problems:*
          *   Agenda-setting: Needs a "blind" proposal phase or random ordering to prevent cycling manipulation.
          *   No-cost waiting: This is a power asymmetry issue. The procedure can't solve power, but it can *name* it. If one side prefers no-deal, the procedure should flag "No Zone of Agreement."

  3.  **Drafting the Procedure (The "Values Compromise Protocol"):**
      *   *Goal:* 20 minutes, runnable by Clerk, plain language.
      *   *Structure:* Pre-meeting (Agenda), In-meeting (5 Gates).
      *   *Gate 1: The Baseline (No-Deal).* Define the realistic status quo. Prevents threat inflation.
      *   *Gate 2: The Zone of Agreement (Gains).* Does everyone prefer *this* package to the Baseline? (Pareto improvement).
      *   *Gate 3: Integrity Check (Non-Affirmation).* Does anyone have to lie or violate a core duty?
      *   *Gate 4: The Residue Ledger (Incommensurability).* Who pays the moral cost? Is it distributed or dumped on one side? (Addresses the "integrity vs. money" worry).
      *   *Gate 5: Reversibility & Dissent.* Sunset clauses + Right to record dissent.
      *   *Anti-Strategy:* Clerk facilitates, "Inflation" of residue requires specific articulation of duty, not just preference.

  4.  **Developing the Worked Applications:**

      *   *Case A (Endowment):*
          *   Baseline: Status quo investments.
          *   Package: Partial divestment + scholarships + no condemnation.
          *   Analysis: CIO gets fiduciary protection (no condemnation). Campaigners get material change (divestment + scholarships).
          *   Residue: Campaigners (no moral victory/condemnation), CIO (potential return loss, though mitigated).
          *   Verdict: Passes. It's a classic logroll.

      *   *Case B (Naming):*
          *   Baseline: Name stays, allegations continue.
          *   Package: Name changes + Campaigners say "University acted in good faith."
          *   Analysis: User wants this.
          *   Integrity Check: If the University *did not* act in good faith, requiring campaigners to say so is a "Rotten Compromise" (Margalit). It requires asserting a falsehood.
          *   Verdict: Fails Gate 3 (Non-Affirmation). The procedure saves the user from a bad deal.

      *   *Case C (Speech):*
          *   Baseline: Current policy (likely messy).
          *   Package: Neutral rules + No disinvitation + Support money.
          *   Analysis: Secularists get no censorship. Religious/Identity get support.
          *   Residue: Secularists might feel "dignity carve-out" (if implied) undermines neutrality. Religious groups might feel support money is patronizing or insufficient.
          *   Verdict: Borderline. The procedure highlights the "Dignity vs. Liberty" incommensurability. It likely passes but requires the "Dissent Preservation" to work.

  5.  **Addressing Limitations:**
      *   Power asymmetries (No-cost waiting).
      *   True moral absolutes (where compromise is sin).
      *   Laundering (using the procedure to legitimize a pre-made decision).

  6.  **Refining the Tone:**
      *   Academic but practical.
      *   Respectful of the user's sophistication (they know the lit).
      *   Clear instructions for the Clerk.
      *   Honest about where theory ends and judgment begins.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes realistic for 5 gates?
      *   *Fix:* Make the gates yes/no questions with a "stop" rule. If Gate 2 fails, stop. Don't debate Gate 5.
      *   *Critique:* How to handle the "Baseline" contestation?
      *   *Fix:* The Clerk defines the *status quo ante* as the default baseline unless a supermajority agrees a threat is credible. This stops bluffing.
      *   *Critique:* The "Residue Ledger" worries about inflation.
      *   *Fix:* Require the residue to be linked to a specific *role-based duty* (e.g., "As CIO, I cannot..."), not just personal preference.
      *   *Critique:* Agenda setting.
      *   *Fix:* Add a "Blind Submission" rule for proposals before the meeting.

  8.  **Final Polish:** Check against the prompt's specific requests (three parts, specific cases, plain language). Ensure the "Naming" case reflects the user's suspicion that the procedure will say "no." Ensure the "Speech" case admits uncertainty.

  *(Self-Correction on Case B)*: The prompt says "I want the name changed and I think this is the best available outcome; my suspicion is the procedure will tell me no." I need to make sure the analysis validates this suspicion based on the *Non-Affirmation* gate. If the statement requires them to lie about "good faith," it fails.

  *(Self-Correction on Case C)*: The prompt says "I would rather you marked exactly where judgment takes over." I need to explicitly state where the procedure stops and the vote begins.

  *(Self-Correction on Procedure)*: The prompt asks to cut/merge/rewrite the 6 tests.
      *   Merge 1 & 6 (Gains + Dissent).
      *   Keep 2 (Non-affirmation).
      *   Merge 3 & 4 (Residue + Absent Party).
      *   Keep 5 (Lock-in).
      *   Add Agenda/Waiting handling.

  Let's structure the response.

  *   **Part 1: The Procedure.** (The "Values Compromise Protocol"). 5 Gates. Clerk script.
  *   **Part 2: Applications.** (Endowment, Naming, Speech). Ledgers included.
  *   **Part 3: Limitations.** (Power, Absolutes, Laundering).

  *Wait, one detail:* "Two further problems I want handled explicitly... agenda-setting... no-cost waiting." I need to ensure these are embedded in Part 1.
  *   Agenda-setting: Pre-circulation of proposals.
  *   No-cost waiting: Gate 2 (Zone of Agreement) handles this. If one side prefers No-Deal, the procedure halts.

  *Refining the "Residue Ledger":* The user worries about inflation. The fix is to require *public reasons* for the residue that appeal to public roles, not private conscience.

  *Refining "Dissent Preservation":* It doesn't destroy the deal if framed as "I sign this *as the best available institutional action*, though I maintain X." This distinguishes institutional agency from personal conscience.

  Okay, ready to write.
answer: |-
  Here is a refined procedure, three worked applications, and a statement of limitations. I have merged your six tests into five gates, integrated the structural problems of agenda-setting and waiting, and distinguished between rules derived from public reason theory and administrative rules of thumb.

  ### Part 1: The Values Compromise Protocol

  **Purpose:** To determine whether a proposed package of actions constitutes a legitimate compromise on a question of institutional values, or whether it constitutes a "rotten compromise" or a mere surrender.
  **Time:** 20 minutes maximum.
  **Facilitator:** Senate Clerk.
  **Record:** A one-page "Compromise Statement" attached to the Senate recommendation.

  **Pre-Meeting Rule (Agenda Control):**
  To prevent cycling and agenda manipulation, all proposals must be submitted in writing 48 hours before the meeting. The Clerk circulates them in random order. No new proposals may be introduced during the Protocol run.

  **The Five Gates:**
  *At each gate, the Clerk asks the question. If the answer is "No," the package fails. The committee must either revise the package or report "No Zone of Agreement" to the Senate.*

  **Gate 1: The Baseline (Addressing "No-Cost Waiting")**
  *Question:* "Is the 'No-Deal' outcome defined as the current institutional status quo, rather than a threatened escalation?"
  *Rule:* The baseline is the *status quo ante*. Threats (e.g., "we will protest," "we will sue") do not count as the baseline unless the threat is legally binding or physically inevitable.
  *Theory:* Prevents strategic bluffing from distorting the gains-from-trade calculation. If a party prefers the status quo to the deal, there is no surplus to divide.
  *Stop Rule:* If any voting member prefers the Status Quo to the Package, stop. Report "No Zone of Agreement."

  **Gate 2: The Integrity Constraint (Your Test 2)**
  *Question:* "Does this package require any member to assert, sign, or enact a proposition they certify as false or a duty they certify as violated?"
  *Rule:* Members may agree to *actions* they dislike. They may not agree to *statements* they believe are lies. Silence is permitted only if silence is not institutionally coded as assent (e.g., a joint press release requires sign-off; a vote record does not).
  *Theory:* Non-affirmation. Protects integrity without vetoing action.
  *Stop Rule:* If any member says "This requires me to lie," stop. The clause must be rewritten or the package fails.

  **Gate 3: The Residue Ledger (Merging Tests 3 & 4)**
  *Question:* "Who bears the moral cost that remains after the trade, and is it distributed?"
  *Rule:* The Clerk records the "Residue" for each party.
      *   **Permissible Residue:** Loss of preference, convenience, reputation, or money.
      *   **Critical Residue:** Loss of integrity, betrayal of a specific constituency without representation, or violation of a role-based duty.
      *   **Distribution:** The package fails if Critical Residue falls wholly on one side while the other side pays only Permissible Residue.
  *Anti-Inflation Measure:* To claim Critical Residue, a member must cite a *public role duty* (e.g., "As CIO, fiduciary duty prevents..."), not private conscience. To claim representation of absent parties, they must produce evidence of mandate (e.g., a petition), not just assertion.
  *Theory:* Incommensurability and Rotten Compromises. Prevents one side from buying the other's soul with cash.
  *Stop Rule:* If the Ledger shows one side paying Critical Residue and the other Permissible, stop.

  **Gate 4: Reversibility (Your Test 5)**
  *Question:* "Are the irreversible elements of this package justified by the strength of the consensus?"
  *Rule:* Flag clauses that create path-dependence (naming, endowment spending rules). If a clause is irreversible, it requires a higher threshold of agreement (unanimity vs. majority).
  *Theory:* Precautionary principle under pluralism.
  *Stop Rule:* Advisory only. Flags the issue for the Senate/Board.

  **Gate 5: Dissent Preservation (Your Test 6)**
  *Question:* "May signatories record a 'Concurring Dissent'?"
  *Rule:* The final recommendation may include an appendix where members state: "I support this recommendation as the best available institutional action, while maintaining [objection]."
  *Theory:* Public Reason. Distinguishes institutional agency from personal conscience. Allows the "joint statement" to stand without requiring internal conversion.
  *Stop Rule:* None. This is a formatting rule.

  ***

  ### Part 2: Worked Applications

  #### Case A: Endowment (Divestment)
  **Proposal:** Withdraw from narrow slice of holdings; publish transparency report; fund scholarships for affected regions; no condemnation language.
  **Parties:** Campaigners (Students/Faculty) vs. Fiduciary (CIO).

  **Gate 1 (Baseline):**
  *   Status Quo: Full investment, no transparency, no scholarships.
  *   CIO Preference: Status Quo > Package (prefers no divestment).
  *   Campaigner Preference: Package > Status Quo (gets some divestment).
  *   *Correction:* If CIO prefers Status Quo, Gate 1 fails. *However*, assume the "feasible set" includes Board pressure making Status Quo unstable. If CIO accepts Package > Risk of Board imposition, Gate 1 passes.
  *   *Ruling:* **Pass** (Assuming CIO views Package as safer than political risk).

  **Gate 2 (Integrity):**
  *   CIO: Does not have to condemn (no lie).
  *   Campaigners: Do not have to affirm investments are good (silence permitted).
  *   *Ruling:* **Pass**.

  **Gate 3 (Residue Ledger):**
  *   **Campaigners:** Critical Residue? No. They get material change. Permissible Residue: No moral victory (condemnation).
  *   **CIO:** Critical Residue? No. Fiduciary duty protected by "no condemnation." Permissible Residue: Potential return loss (mitigated by narrow slice).
  *   **Distribution:** Mixed. Both pay Permissible Residue (pride/preference). Neither pays Critical Residue (integrity).
  *   *Ruling:* **Pass**.

  **Gate 4 (Reversibility):**
  *   Divestment is reversible (can rebuy). Scholarships are committed funds (harder to reverse).
  *   *Ruling:* **Flag** for Board (spending commitment).

  **Gate 5 (Dissent):**
  *   Campaigners may note they sought full divestment. CIO may note preference for no divestment.
  *   *Ruling:* **Pass**.

  **Verdict:** **Recommend to Senate.** This is a valid gains-from-trade.

  ***

  #### Case B: Naming (The "Good Faith" Trap)
  **Proposal:** University changes building name. Campaigners withdraw allegation of knowingly profiting and join statement: "University acted in good faith throughout."
  **Parties:** Administration vs. Campaigners (You are sympathetic to Campaigners).

  **Gate 1 (Baseline):**
  *   Status Quo: Name stays, allegations continue.
  *   Both sides prefer Package to Status Quo (Admin gets peace, Campaigners get name change).
  *   *Ruling:* **Pass**.

  **Gate 2 (Integrity):**
  *   Question: Does the statement "University acted in good faith" require Campaigners to assert a proposition they take to be false?
  *   Evidence: If the historical record shows the University *did* know, asserting "good faith" is a lie.
  *   *Ruling:* **FAIL.**
  *   *Reasoning:* This is a Non-Affirmation violation. You cannot trade a name change for a lie. Even if the name change is good, the cost is integrity.

  **Gate 3 (Residue Ledger):**
  *   (Not reached, but for record): Campaigners pay Critical Residue (integrity/truth-telling). Admin pays Permissible Residue (reputation). This would have failed Gate 3 as well (unequal distribution of critical cost).

  **Verdict:** **Do Not Recommend.** The procedure saves you from a "rotten compromise." The name change must be decoupled from the historical statement.

  ***

  #### Case C: Speech and Events (The Unsettled Trade)
  **Proposal:** Content-neutral time/place/manner rules; no disinvitation; funded support programme for targeted groups.
  **Parties:** Secular-Liberals vs. Religious/Identity Groups.

  **Gate 1 (Baseline):**
  *   Status Quo: Ad-hoc decisions, frequent conflict.
  *   Both sides prefer Package to Chaos.
  *   *Ruling:* **Pass**.

  **Gate 2 (Integrity):**
  *   Secularists: Do not have to affirm hate speech is good, only that it is permitted.
  *   Religious/Identity: Do not have to affirm hate speech is harmless, only that they will receive support.
  *   *Ruling:* **Pass**.

  **Gate 3 (Residue Ledger):**
  *   **Secularists:** Critical Residue? Some argue neutrality *requires* protection from dignity harms. If they view "neutrality" as complicity, this is Critical.
  *   **Religious/Identity:** Critical Residue? If they view "support money" as patronizing hush-money, this is Critical.
  *   **Distribution:** Both sides claim Critical Residue regarding the *principle* (Liberty vs. Dignity).
  *   *Judgment Call:* The Clerk must ask: "Is this residue based on role-duty or philosophical preference?"
      *   If Secularists cite University Mission (Free Inquiry), it is Role-Based.
      *   If Religious cite University Mission (Community Care), it is Role-Based.
      *   *Result:* The Ledger shows a clash of Role-Based Duties. The Protocol cannot resolve incommensurable duties.
  *   *Ruling:* **Proceed to Vote with Warning.**

  **Gate 4 & 5:**
  *   Flag that policy creates precedent. Allow dissenting opinions on the principle.

  **Verdict:** **Procedurally Unresolved.** The Protocol identifies this as a "Hard Case" where values are incommensurable. It permits the vote to proceed (as a *modus vivendi*), but requires the Senate record to explicitly state: *"Committee acknowledges this agreement leaves a moral residue on both sides regarding the definition of institutional duty."* This prevents the compromise from being read as a philosophical resolution.

  ***

  ### Part 3: Limitations and Risks

  **1. Where Not to Apply:**
  *   **Moral Absolutes:** Do not run this protocol on issues where one side views the other's position as inherently evil (e.g., human rights violations vs. cultural practice). If Gate 2 (Integrity) triggers a "falsehood" claim that cannot be negotiated, the issue is not compromise-ready.
  *   **Pure Resource Allocation:** Do not use this for budget disputes where the only value is efficiency. It adds unnecessary friction to standard cost-benefit analysis.

  **2. Questions It Begs:**
  *   **The Definition of "Status Quo":** Gate 1 assumes the status quo is neutral. It is not. It privileges those currently benefiting from existing arrangements. The protocol manages this but does not solve it.
  *   **The Authority of Representatives:** Gate 3 relies on members knowing what their constituents accept. Students often claim to speak for "students" without a mandate. The anti-inflation measure helps, but cannot fully solve the agency problem.

  **3. The Laundering Risk:**
  *   **Pre-Cooked Deals:** If the Administration and Committee Chair agree on a package *before* the meeting, running this protocol becomes a ritual to legitimize a decision.
  *   **Safeguard:** The "Dissent Preservation" (Gate 5) is the primary defense. If members feel laundered, they must use the Concurring Dissent. If the Clerk suspects laundering, they should record in the minutes: "Protocol run post-hoc on pre-negotiated package."
  *   **Strategic Waiting:** If one party knows they can wait you out (No-Cost Waiting), Gate 1 will fail. The protocol will correctly report "No Zone of Agreement." This is not a failure of the tool; it is a diagnostic of power asymmetry. Do not force a compromise where none exists.

  **Rule of Thumb vs. Theory:**
  *   **Theory:** Gates 2 (Integrity) and 3 (Residue Distribution) are grounded in value pluralism and Margalit.
  *   **Rule of Thumb:** Gate 1 (Status Quo Baseline) and Gate 4 (Reversibility) are administrative heuristics to ensure stability. They are not moral truths, but practical constraints for a university bureaucracy.
  *   **Rule of Thumb:** The 20-minute time limit. Theory requires endless reflection; governance requires decision. The time limit forces prioritization of the most serious objections.
