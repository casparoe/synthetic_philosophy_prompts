answer: |-
  1. **The All-Pay Mechanic**
  "In the classic dollar auction, escalation happens because it's an *all-pay* auction—both the winner and loser pay their bids. In a winner-takes-all auction, you can quit without penalty. In climate treaties, is the 'bid' the domestic mitigation cost or the diplomatic capital? If it's mitigation, only complying countries pay. If it's diplomatic capital, everyone pays regardless of success. Why does the all-pay structure of diplomatic capital drive the escalation more than the winner-takes-all nature of economic advantage?"

  *   **Anticipated Reply:** She will argue that diplomatic capital is the true sunk cost; once spent negotiating, it's lost whether the treaty succeeds or fails, trapping countries in the all-pay dynamic.
  *   **Where to Push:** Ask if diplomatic capital is truly *lost* upon exit, or if it can be redeployed. If it can be redeployed, the all-pay mechanic breaks down.

  2. **Unit of Analysis: Individual vs. State**
  "The sunk-cost fallacy is typically documented as a cognitive bias in individual psychology. States aren't single cognitive agents; they're bureaucracies with changing administrations. How do you aggregate individual biases into state-level action without assuming the state possesses a single, consistent memory of sunk costs that survives election cycles?"

  *   **Anticipated Reply:** She will likely cite institutional path dependence and bureaucratic inertia as the mechanisms that lock individual biases into state policy.
  *   **Where to Push:** Press on turnover. If a new administration enters with no personal investment in the previous negotiations, does the sunk cost reset? If yes, the analogy only holds for stable regimes.

  3. **The Exit Clause Follow-Up**
  "You've anticipated the counter-argument that treaties have formal exit clauses, which legally reduces the price of quitting to zero. But if countries still feel they 'can't' leave, you're arguing the cost is purely reputational. At what point does avoiding reputational damage stop being a behavioral escalation trap and just become a rational cost-benefit calculation of future cooperation?"

  *   **Anticipated Reply:** She will argue that reputational costs are psychologically overweighted by leaders due to loss aversion, making them irrational relative to the actual legal freedom to exit.
  *   **Where to Push:** Ask for the metric. How do we distinguish between a leader rationally protecting future bargaining power versus irrationally throwing good money after bad?

  4. **Falsifiability and Model Integrity**
  "Let's talk about falsification. If a major power were to exit a treaty framework and suffer minimal economic or reputational cost, would that force you to abandon the dollar auction analogy entirely? Or would you argue the costs were just hidden or delayed, thereby moving the curve rather than breaking the model?"

  *   **Anticipated Reply:** She will likely claim costs are always delayed or diffuse (e.g., loss of soft power), making the model hard to falsify with single events.
  *   **Where to Push:** Demand a concrete threshold. Ask her to define a specific scenario—e.g., 'If Country X leaves and gains GDP share within 5 years'—that would prove the model wrong.

  5. **Dynamic Prize Valuation**
  "In the dollar auction, the prize is fixed at one dollar. In climate negotiations, the value of the 'prize'—avoided catastrophic warming—changes as scientific data evolves. How do you disentangle escalation driven by sunk diplomatic costs from escalation driven by the rational realization that the prize has become more valuable over time?"

  *   **Anticipated Reply:** She will contend that emission targets often exceed what cost-benefit analysis suggests is optimal, even accounting for updated climate science.
  *   **Where to Push:** Ask for the baseline. Which economic model is she using to define 'rational' targets? Without a clear baseline, 'overpaying' is subjective.

  6. **Identifying the 'Losing Bidder'**
  "In the dollar auction, the second-highest bidder loses their money and gets nothing. In climate treaties, who plays the role of the losing bidder? Is it the country that over-commits relative to their capacity, or the country that commits heavily only to see others defect? The mechanics of the loss need to be clear to map the escalation."

  *   **Anticipated Reply:** She will identify the 'loser' as nations that incur high domestic mitigation costs while free-riders benefit, creating a pressure to ratchet up demands on others to justify their own spend.
  *   **Where to Push:** Ask if this isn't just the standard free-rider problem in game theory. What makes it *behavioral* escalation rather than strategic bargaining?

  7. **Mechanism Design for De-escalation**
  "If this is a behavioral trap, standard incentives won't work. What specific mechanism design intervention—like a 'cooling-off' period, sunk-cost amnesty, or resetting baselines—would break the escalation cycle without undermining the treaty's integrity? Does revealing the sunk cost explicitly help, or does it deepen the commitment?"

  *   **Anticipated Reply:** She will likely suggest 'resetting baselines' or framing new commitments as fresh starts rather than continuations of past pledges.
  *   **Where to Push:** Ask if allowing a reset isn't functionally identical to enforcing the exit clauses she previously dismissed. If so, is the problem the text or the psychology?
