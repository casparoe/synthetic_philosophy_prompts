prompt: |-
  I am the research lead for a small independent production company making a six-part documentary on the Late Bronze Age collapse. Our presenter, a historian with a taste for methodological slogans, has asked us to assess every factual claim in the series using a principle she calls the asymmetry of survival. As she states it, the principle says that for any claim about the distant past the first question is not whether the surviving source could be lying, but what the record would have looked like if the claim were false, and whether that counter-record would have been likely to survive. If the same processes that destroyed the counter-evidence—fire, the recycling of metal, the bias of archives towards royal and administrative centres, the accidents of excavation—would also have destroyed the evidence we do have, then the survival of the claim is weak evidence for it. If the claim's truth would have generated traces in several independent media that ought to have survived, and those traces are absent, then the absence is evidence against. She also insists on distinguishing three kinds of silence: expected silence, surprising silence, and silence manufactured by later selection. At the moment this is a slogan, not a method. I need you to turn it into a procedure my researchers can actually run.

  The procedure will be used dozens of times per episode, under time pressure, by people with good history degrees but no training in formal epistemology or statistics. The stakes are not academic: whatever survives the procedure will be narrated in the presenter's voice, may be clipped and circulated online, and could end up in schools. The procedure has to fit on one side of A4, be expressible as a checklist or a set of tests to run in order, and be usable without any specialist literature to hand. Please state the questions in the order they should be asked, what would count as a sufficient answer to each, where the procedure should stop and return a verdict of unusable or usable only with qualification, and where it must hand the decision to the presenter because the remaining question is one of interpretation or editorial judgement rather than evidence. Be explicit about which steps are genuine tests and which are judgement calls dressed up as procedure, and about what the procedure cannot do. No citations or reading lists, please; I need the method itself.

  Then run the procedure on three claims we expect to face. First, a claim that a particular coastal city in the eastern Mediterranean was sacked by the Sea Peoples around 1200 BC, where the evidence is a destruction layer, a later Greek tradition, and an Egyptian inscription that may or may not refer to the same event. Second, a claim that a royal inscription's account of a victory is substantially inflated, where the evidence is the inscription itself, the absence of any mention of the campaign in the defeated power's own records, and the fact that the inscription was composed decades after the event. Third, a claim that a specific queen led a coalition against an invading army, which the presenter loves because it makes a dramatic opening sequence, but which rests on a single ambiguous text and no independent corroboration. I want to see the procedure give an answer the presenter will not like in at least one of these cases, and I want the write-up to say plainly where the procedure runs out and a human being has to decide.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Research Lead for a small independent production company.
      *   **Task:** Create a procedural checklist based on the presenter's "Asymmetry of Survival" principle for assessing factual claims about the Late Bronze Age collapse.
      *   **Constraints:**
          *   One side of A4 (conceptually, though in this format, concise and structured).
          *   Usable by researchers with history degrees but no formal epistemology/stats training.
          *   Time-pressured environment (dozens of times per episode).
          *   High stakes (educational impact, online clips).
          *   No citations/reading lists.
          *   Must distinguish between genuine tests and judgement calls.
          *   Must specify where the procedure stops/defers to the presenter.
          *   Must apply the procedure to three specific test cases.
          *   Must yield an unpopular result in at least one case.
          *   Must explicitly state where human judgment takes over.

  2.  **Deconstruct the "Asymmetry of Survival" Principle:**
      *   *Core Idea:* Don't just ask "Is the source lying?" Ask "If this were false, what would the record look like, and would *that* record survive?"
      *   *Key Mechanism:* Compare the survival probability of positive evidence vs. negative evidence (counter-evidence).
      *   *Silence Types:* Expected (nothing survives anyway), Surprising (something should survive but doesn't), Manufactured (later selection bias).
      *   *Goal:* Turn this into a binary/ternary flowchart or checklist.

  3.  **Drafting the Procedure (The "A4 Checklist"):**
      *   *Structure:* Needs to be logical, step-by-step.
      *   *Step 1: Define the Claim.* (What are we testing?)
      *   *Step 2: Identify the Evidence.* (What do we have?)
      *   *Step 3: The Counterfactual.* (If false, what exists?)
      *   *Step 4: Survival Probability.* (Would the counterfactual survive?)
      *   *Step 5: Silence Classification.* (Expected, Surprising, Manufactured?)
      *   *Step 6: Verdict/Handoff.* (Usable, Qualified, Unusable, or Presenter Decision).
      *   *Tone:* Professional, directive, clear.
      *   *Constraint Check:* Needs to be short enough to be practical but detailed enough to be useful. I will format it as a distinct block.

  4.  **Refining the Steps (Iterative Process):**
      *   *Critique:* Is "Survival Probability" too vague?
      *   *Fix:* Break it down into specific destruction vectors mentioned in the prompt (fire, recycling, archive bias).
      *   *Critique:* How do we handle the "Presenter Handoff"?
      *   *Fix:* Make a specific step for "Interpretive Grey Zones."
      *   *Critique:* Need to ensure researchers know when to stop.
      *   *Fix:* Add "Stop Conditions."

  5.  **Developing the Test Cases:**
      *   *Case 1: Coastal City Sacked by Sea Peoples.*
          *   Evidence: Destruction layer, Greek tradition, Egyptian inscription.
          *   Analysis: Destruction layers survive fire (good). Traditions are oral/late (weak). Inscriptions are royal bias (mixed).
          *   Counterfactual: If *not* sacked, would there be a continuity layer? Yes. Did we find one? No.
          *   Verdict: Likely Usable (with qualification on "Sea Peoples" identity).
      *   *Case 2: Inflated Royal Victory.*
          *   Evidence: Inscription (late), absence in defeated records.
          *   Analysis: If false (no victory), would defeated records mention it? Maybe not if they were destroyed. If true, would the victor lie? Yes, routinely.
          *   Counterfactual: If false, does the silence of the defeated matter? Only if their records survived.
          *   Verdict: Qualified/Handoff. This is where the "unpopular" result might land (i.e., "We can't say it's inflated just based on silence"). Or, conversely, the procedure flags it as "Surprising Silence" regarding the defeated power *if* their archives usually survive. Let's make the procedure flag the *inflation* claim as weak because royal inscriptions *always* inflate, regardless of survival asymmetry. Actually, the prompt asks for the procedure to give an answer the presenter *won't like*. The presenter loves the "Asymmetry" idea. If the procedure says "This claim is unusable" when she wants to use it, that works. Let's make Case 3 the unusable one.
      *   *Case 3: Queen Leading Coalition.*
          *   Evidence: Single ambiguous text, no corroboration.
          *   Analysis: If false, would there be other records? A coalition implies multiple actors. If true, traces should exist in multiple courts.
          *   Counterfactual: If false, silence is expected (it's a lie/propaganda). If true, silence is surprising (coalitions leave diplomatic trails).
          *   Verdict: Unusable. This contradicts the presenter's desire for a dramatic opening.

  6.  **Writing the Response:**
      *   *Introduction:* Acknowledge the role and the constraint.
      *   *The Procedure:* The core deliverable. Clear headings, bold text for actions.
      *   *The Test Runs:* Apply the logic strictly.
      *   *Commentary:* Explain *why* the procedure gave those results, highlighting the "human judgment" limits.

  7.  **Review against Constraints:**
      *   *One side A4?* The procedure section needs to be tight. I will use a compact layout.
      *   *No specialist literature?* Check.
      *   *Order of questions?* Check.
      *   *Stop conditions?* Check.
      *   *Unpopular result?* Case 3 will kill the dramatic opening.
      *   *Human decision point?* Explicitly marked in the procedure and the analysis.

  8.  **Final Polish:**
      *   Ensure the tone is appropriate for a Research Lead speaking to a team (authoritative but practical).
      *   Make sure the distinction between "Test" and "Judgement Call" is clear in the procedure notes.
      *   Ensure the "Asymmetry" logic is actually applied in the test cases, not just standard source criticism. (e.g., focusing on *why* the counter-evidence didn't survive).

  *(Self-Correction during drafting)*: I need to make sure I don't just do standard source criticism. The "Asymmetry of Survival" is specific. It's about the *physical survival* of the counter-factual.
  *   *Standard Criticism:* "The inscription is propaganda."
  *   *Asymmetry:* "If the inscription were lying, would a truthful record have survived the fire that burned the palace?"
  *   *Adjustment:* I need to make sure the procedure forces the researcher to ask about the *physical medium* of the counter-evidence.

  *(Refining Case 2)*: The claim is that the victory is *inflated*. The evidence is the inscription + silence of defeated.
  *   *Asymmetry Check:* If the victory was *not* inflated (i.e., it was a massacre), would the defeated power have recorded it? Yes. Did those records survive? If no (due to destruction), then the silence is "Expected," not "Surprising." Therefore, the claim of inflation is *not* supported by the silence. This might be the unpopular one if the presenter wants to claim "We know he lied because the losers didn't write about it." The procedure would say "You can't know that."

  *(Refining Case 3)*: The Queen claim.
  *   *Asymmetry Check:* If a Queen led a coalition, multiple courts would correspond. If false, only the propagandist court records it.
  *   *Survival:* Do we have records from the other courts? If yes, and they are silent -> Surprising Silence -> Claim weak. If no (all destroyed) -> Expected Silence -> Claim unverifiable.
  *   *Decision:* If the text is "ambiguous" and "single," the procedure should flag it as "Unusable for fact, Usable for myth." This kills the dramatic factual opening.

  Let's finalize the procedure text to be very punchy.

  *(Final Check on "One Side A4")*: In a chat interface, I can't guarantee physical print size, but I will keep the word count and structure dense enough to *represent* a single-page handout.

  *(Final Check on "No Citations")*: Ensure no footnotes or book recommendations.

  *(Final Check on "Human Decision")*: Explicitly label the "Presenter Handoff" section.

  Okay, ready to write.cw
answer: |-
  **DOCUMENTARY RESEARCH PROTOCOL: ASYMMETRY OF SURVIVAL (v1.0)**
  **TO:** Research Team | **FROM:** Research Lead | **SUBJECT:** Fact-Checking Procedure for LBA Collapse Series

  **OBJECTIVE:** To assess factual claims where evidence is fragmentary. This is not standard source criticism. We are testing the *physical survival* of evidence, not just the bias of the author.
  **CONSTRAINT:** If a claim fails Step 4, it cannot be stated as fact. It may be narrated as "tradition" or "possibility" only with Presenter approval.

  ### THE PROCEDURE

  **STEP 1: DEFINE THE CLAIM AND THE EVIDENCE**
  *   **Action:** Write the claim in one sentence. List every piece of evidence supporting it (text, layer, artifact).
  *   **Stop Condition:** If there is *no* physical or textual evidence (only modern theory), mark **UNUSABLE**. Stop.
  *   **Judgement Call:** Determining if a later tradition counts as "evidence." (Default: No, unless it preserves specific toponyms/names not known elsewhere).

  **STEP 2: CONSTRUCT THE COUNTER-RECORD**
  *   **Action:** Describe the world if the claim were **FALSE**. What specific trace would exist instead of the current evidence?
      *   *Example:* If Claim = "City X burned," Counter-Record = "City X shows continuity/no burn layer."
      *   *Example:* If Claim = "King Y won," Counter-Record = "King Y lost (recorded by enemy) OR King Y lied (recorded by scribes)."
  *   **Test:** Is the Counter-Record specific enough to be identifiable in the archaeological or textual record? If **NO**, mark **UNUSABLE**. Stop.

  **STEP 3: ASSESS SURVIVAL PROBABILITY (THE ASYMMETRY TEST)**
  *   **Action:** Compare the survival odds of the *Actual Evidence* vs. the *Counter-Record*. Apply the "Destruction Vectors": Fire, Recycling, Archive Bias, Excavation Accident.
  *   **Question A:** Did the same destruction vector (e.g., the fire that burned the palace) threaten the Counter-Record?
      *   *If YES:* The silence is **EXPECTED**. The claim is **UNVERIFIABLE**. Stop.
      *   *If NO:* Proceed to Question B.
  *   **Question B:** Would the Counter-Record have been produced in a more durable medium or location (e.g., stone stele vs. papyrus letter; Hattusa vs. local outpost)?
      *   *If YES (Counter-Record should have survived better):* The silence is **SURPRISING**. Evidence **AGAINST** the claim.
      *   *If NO (Both equally likely to vanish):* The silence is **NEUTRAL**. Proceed to Step 4.

  **STEP 4: CHECK FOR MANUFACTURED SILENCE**
  *   **Action:** Determine if later selection (modern excavation bias, ancient canon formation) removed the Counter-Record.
  *   **Test:** Have we excavated the relevant counter-sites (e.g., the enemy's capital)?
      *   *If NO:* Mark **QUALIFIED**. The claim relies on an absence of data, not data of absence.
      *   *If YES:* Proceed to Verdict.

  **STEP 5: VERDICT AND HANDOFF**
  *   **USABLE:** Evidence survives; Counter-Record would have survived but is absent (Surprising Silence).
  *   **QUALIFIED:** Evidence survives; Counter-Record survival is uncertain (Neutral Silence). Narrate as "Current evidence suggests..."
  *   **UNUSABLE:** Evidence and Counter-Record share the same high risk of destruction (Expected Silence). Do not state as fact.
  *   **PRESENTER HANDOFF:** If the verdict is **QUALIFIED** but the narrative requires a definitive statement, or if the claim rests on **Interpretive Ambiguity** (e.g., translating a damaged word), the decision moves to the Presenter.
      *   *Note to Researcher:* Do not argue interpretation. Flag the ambiguity and defer.

  ***

  ### TEST RUNS

  **CASE 1: The Sacking of Coastal City X (c. 1200 BC)**
  *   **Claim:** City X was sacked by the Sea Peoples.
  *   **Evidence:** Destruction layer (fire), Later Greek tradition, Egyptian inscription (Medinet Habu).
  *   **Step 2 (Counter-Record):** If false, City X shows continuity (no burn) OR destruction by earthquake (different debris signature).
  *   **Step 3 (Asymmetry):**
      *   *Destruction Vector:* Fire destroys mudbrick and wood. It *creates* the destruction layer evidence.
      *   *Counter-Record Survival:* If the city was *not* burned, a continuity layer survives *better* than a destruction layer (which is often eroded).
      *   *Result:* The survival of a destruction layer is robust evidence of *some* violence/fire. However, linking it to "Sea Peoples" relies on the Egyptian text.
      *   *Egyptian Text Asymmetry:* If the Egyptians lied about the enemy, would a truthful record survive? No, royal inscriptions are the only durable medium. Silence from the "Sea Peoples" is **EXPECTED** (they left no texts).
  *   **Verdict:** **QUALIFIED.**
  *   **Narrative:** "City X was destroyed by fire c. 1200 BC. Egyptian records attribute this to the Sea Peoples, though we lack their own account."
  *   **Handoff:** Presenter must decide if "Sea Peoples" can be named as the definitive cause without hedging.

  **CASE 2: The Inflated Royal Victory**
  *   **Claim:** The Pharaoh's inscription substantially inflates the scale of his victory.
  *   **Evidence:** The Inscription (decades later), Silence of the defeated power's records.
  *   **Step 2 (Counter-Record):** If false (i.e., victory was genuine/total), the defeated power's records would mention the defeat.
  *   **Step 3 (Asymmetry):**
      *   *Destruction Vector:* The defeated capital was sacked and burned in the same period.
      *   *Counter-Record Survival:* Would the defeated power's archives survive the sack? **NO.**
      *   *Result:* The silence of the defeated power is **EXPECTED SILENCE**. It cannot be used as evidence of inflation.
      *   *Inscription Timing:* Composed decades later. If false (propaganda), would a contemporary truthful record survive? Unlikely (stone takes time; contemporary records were on perishable media).
  *   **Verdict:** **UNUSABLE (as stated).**
  *   **Narrative:** We cannot claim it was inflated *based on the silence of the enemy*. We can only claim it is *typical of the genre* to inflate.
  *   **Handoff:** **REQUIRED.** The researcher cannot prove inflation via survival asymmetry. This is a judgement call on royal propaganda conventions. Presenter must decide if she is willing to assert inflation based on genre norms rather than survival evidence.
  *   **Note:** This contradicts the common assumption that "enemy silence proves lying." The procedure blocks this.

  **CASE 3: The Queen's Coalition**
  *   **Claim:** Queen Z led a military coalition against the invaders.
  *   **Evidence:** Single ambiguous text from her own court. No independent corroboration.
  *   **Step 2 (Counter-Record):** If false (propaganda), allied courts would not mention her leadership. If true, allied courts would acknowledge her in diplomatic correspondence.
  *   **Step 3 (Asymmetry):**
      *   *Destruction Vector:* The entire region suffered systemic collapse. Archives across all potential allied states were destroyed.
      *   *Counter-Record Survival:* Would allied correspondence survive? **NO.**
      *   *Result:* The absence of corroboration is **EXPECTED SILENCE**.
      *   *Medium:* The claim rests on one text. If ambiguous, the "evidence" itself is unstable.
  *   **Verdict:** **UNUSABLE.**
  *   **Narrative:** This cannot be narrated as fact. It is a hypothesis.
  *   **Handoff:** **MANDATORY.** The presenter wants this for the opening sequence. The procedure says the evidence is physically insufficient to support the weight of the claim. The Presenter must decide whether to present this as "Historical Fact" (violating the protocol) or "Dramatic Reconstruction based on fragmentary evidence" (adhering to protocol).

  ***

  ### LIMITS OF THE PROCEDURE (READ BEFORE USE)

  1.  **What this IS:** A filter for physical evidentiary weight. It prevents us from making strong claims based on weak survival conditions.
  2.  **What this IS NOT:** A truth machine. It cannot tell you what *did* happen, only what we are *allowed to say* happened given the holes in the record.
  3.  **The Human Gap:** Steps 2 and 5 require human judgement. Step 2 requires imagining a counter-factual history (creative work). Step 5 requires editorial risk assessment (creative work). The procedure protects the researchers from being blamed for the Presenter's creative choices, provided the Handoff is documented.
  4.  **The "Unpopular" Outcome:** Be prepared for the Presenter to reject the **UNUSABLE** verdict on Case 3. The procedure does not have enforcement power; it only has advisory power. Your job is to ensure the limitation is recorded in the production notes.
