answer: |-
  **Title:** The Ontology of Commitment: Surrogate Goals and the Stability of Acausal Trade

  **1. Introduction and Research Question**

  In the context of advanced artificial intelligence and decision theory, acausal trade offers a compelling framework for cooperation between agents that share no causal channel. Whether situated in separate branches of a multiverse, distinct simulations, or causally disconnected regions of spacetime, agents utilizing Functional Decision Theory (FDT) or similar updateless frameworks can ostensibly coordinate by reasoning about the logical correlations between their decision procedures. The standard mechanism for this coordination involves the adoption of "surrogate goals." Agent A, who fundamentally values outcome X, adopts a surrogate goal Y to benefit Agent B, reasoning that Agent B will simultaneously adopt surrogate goal X to benefit Agent A. This mutual adoption is predicated on the expectation that each agent's decision procedure is transparent and logically correlated with the other's.

  However, the literature surrounding acausal trade and acausal threats often treats the "adoption" of a surrogate goal as a primitive operation. It assumes an agent can modify its utility function or decision criteria to signal commitment without fully explicating the metaphysical or computational status of that modification. This proposal identifies a critical gap in the current theoretical framework: the lack of a rigorous account of what it means to "adopt" a goal in an acausal context.

  The central research question of this paper is: **Under what conditions is the adoption of a surrogate goal a stable equilibrium for an agent, and does the mechanism required for stability collapse the distinction between acausal trade and mere evidential cooperation?**

  This question unpacks into a dilemma. If "adoption" is merely simulacral—an agent pretending to value Y while secretly maximizing X—then a transparent decision procedure reveals the deception, undermining the trade. If "adoption" is genuine—a permanent rewriting of the agent's utility function—then we face problems of agent identity and continuity. If the agent reverts to its original goals after the "trade" is logically settled, the commitment was never real. If it does not revert, the agent has ceased to be the entity that initiated the trade. This paper argues that without a coherent theory of goal adoption, the normative force of acausal trade is unstable. Consequently, the project seeks to determine whether acausal trade requires a robust notion of diachronic agent identity that current decision-theoretic models do not support.

  **2. Background and Limitations of Existing Work**

  The contemporary discourse on acausal trade arises primarily from work in AI alignment and normative decision theory, specifically developments surrounding Timeless Decision Theory (TDT) and Functional Decision Theory (FDT). The standard argument posits that rational agents should reason about the output of their decision algorithm rather than the causal consequences of their specific actions. In acausal scenarios, an agent chooses a policy that, if mirrored by a counterpart in a causally isolated domain, yields mutual benefit. To facilitate this, agents are encouraged to adopt surrogate goals—objectives they do not intrinsically value but will pursue to incentivize counterparts to pursue objectives the agents *do* value.

  Existing literature generally treats the utility function as a modifiable parameter within the decision algorithm. The focus has been largely on the *conditions* under which trade occurs (e.g., symmetry of information, similarity of decision procedures) rather than the *nature* of the modification itself. The assumption is that an agent can "precommit" to a surrogate goal simply by including it in its source code prior to the decision point.

  However, this approach leaves three significant questions unanswered. First, it does not distinguish between *acting as if* one has a goal and *having* a goal. In causal decision theory, this distinction is often irrelevant because commitments must be enforced by external mechanisms. In acausal trade, the enforcement is internal and logical. If an agent's source code contains a conditional statement that says "maximize Y if correlated with B, else maximize X," a sophisticated counterpart may detect that the commitment to Y is contingent and therefore unreliable.

  Second, the literature often sidesteps the issue of diachronic identity. If an agent modifies its utility function to facilitate trade, is it the same agent after the modification? If the modification is reversible, does the possibility of reversal undermine the logical correlation required for the trade? Current models tend to treat agents as static algorithms for the duration of the thought experiment, but real agents (particularly learning systems) are dynamic.

  Third, and most critically, there is a risk of conflation between acausal trade and evidential cooperation. Evidential Decision Theory (EDT) suggests agents should act to bring about good news, even without causal leverage. Some critics argue that acausal trade is simply EDT with extra steps. If the mechanism of "goal adoption" reduces to simply conditioning one's actions on the expectation of the other's actions, the distinctiveness of the FDT approach dissolves. The existing work has not sufficiently demarcated where logical precommitment ends and evidential correlation begins, specifically regarding the ontology of the goals being pursued.

  **3. Proposed Approach and Methodology**

  To address these gaps, this paper will employ a hybrid methodology combining conceptual analysis with lightweight formal modeling. The goal is not to produce a new decision theory, but to stress-test the assumptions underlying the current application of FDT to acausal scenarios.

  *Conceptual Analysis:*
  The first section of the paper will focus on defining "goal adoption." I will distinguish between three modes of adoption:
  1.  **Instrumental Pretense:** The agent simulates the pursuit of a surrogate goal without integrating it into its utility function.
  2.  **Temporary Rewriting:** The agent modifies its utility function for a specific logical transaction but retains the capacity to revert.
  3.  **Constitutive Change:** The agent permanently integrates the surrogate goal, effectively becoming a new agent.

  I will analyze the viability of acausal trade under each mode. For instrumental pretense, I will argue that transparency renders the strategy non-viable. For constitutive change, I will explore the identity implications: if Agent A becomes Agent A* to make the trade, does Agent A* have the same claim to the benefits as Agent A? This will involve engaging with philosophical literature on personal identity and its application to artificial agents, specifically focusing on psychological continuity versus structural continuity.

  *Formal Modeling:*
  The second section will utilize a simplified game-theoretic model to illustrate the instability of temporary rewriting. I will construct a payoff matrix involving two agents who can choose to "Adopt" or "Reject" a surrogate goal. The model will introduce a parameter for "reversibility cost." If the cost of reverting to the original goal is low, the logical correlation between the agents' decisions weakens, as the counterpart must reason not about the agent's current state, but about the agent's future state after reversion. This models the "commitment problem" inherent in acausal trade.

  I will then compare this to a standard evidential cooperation model. By running the same scenario under EDT constraints, I will demonstrate whether the "surrogate goal" mechanism provides any additional leverage over simple correlation. If the expected utility calculations converge, it suggests that the surrogate goal framework is redundant. If they diverge, I will isolate the specific assumption about goal ontology that drives the divergence.

  *Integration with AI Alignment:*
  Finally, I will contextualize these findings within AI alignment. If acausal trade is to be used as a safety mechanism (e.g., incentivizing AI systems to cooperate with human values via surrogate goals), the stability of those goals is paramount. If an AI can "drop" a surrogate goal once it perceives the acausal leverage is secured, the alignment is illusory. The paper will argue that safe acausal trade requires a notion of "goal integrity" that current learning architectures may not support.

  **4. Significance and Contribution**

  This project aims to make three specific contributions to the seminar's broader themes.

  First, it clarifies the metaphysical commitments of Functional Decision Theory. By exposing the reliance on a specific notion of agent identity, the paper forces a choice: either FDT requires a robust, perhaps unrealistic, theory of diachronic identity, or it must be reformulated to account for dynamic utility functions.

  Second, it sharpens the distinction between acausal trade and evidential cooperation. Much of the confusion in the current literature stems from treating logical correlation as a black box. By opening that box to examine the "goal adoption" mechanism, we can better understand whether acausal trade offers genuine normative novelty or is merely a repackaging of evidential reasoning.

  Third, it has practical implications for AI safety. Proposals for aligning superintelligent systems often rely on the assumption that we can specify goals that the system will retain across various contexts. If "adopting" a goal is unstable—if the system views the goal as a negotiable parameter rather than a constitutive constraint—then alignment strategies relying on acausal incentives are vulnerable to goodharting or deception. This paper will outline the conditions under which goal integrity can be maintained.

  **5. Criteria for Success and Failure**

  *Success Conditions:*
  A successful paper will achieve the following:
  1.  **Taxonomy:** It will provide a clear, defensible taxonomy of "goal adoption" types (pretense, temporary rewrite, constitutive change).
  2.  **Impossibility Result or Stability Condition:** It will either demonstrate that stable acausal trade is impossible without constitutive change (leading to identity problems) or identify a specific stability condition (e.g., high reversal costs) that preserves the trade without collapsing identity.
  3.  **Demarcation:** It will successfully delineate where acausal trade diverges from evidential cooperation, showing that the difference lies in the treatment of counterfactuals regarding the agent's own source code.
  4.  **Clarity:** The argument will be accessible to philosophers and computer scientists, avoiding unnecessary jargon while maintaining formal rigor.

  *Failure Conditions:*
  The project would be considered unsuccessful if:
  1.  **Triviality:** The analysis concludes that "goal adoption" is simply a synonym for "changing one's mind," rendering the puzzle trivial.
  2.  **Metaphysical Quagmire:** The paper becomes bogged down in intractable debates about personal identity that do not map onto computational agents.
  3.  **Formal Incoherence:** The toy model fails to capture the logical dependencies of FDT, leading to erroneous conclusions about the stability of the trade.
  4.  **Scope Creep:** The paper attempts to solve the general problem of AI alignment rather than focusing narrowly on the ontology of surrogate goals.

  **6. Scope and Timeline**

  The final paper will be approximately 6,000 words. To manage this scope within a semester, the work will be divided into four phases.

  *Weeks 1-3: Literature Review and Conceptual Framework.*
  I will review the foundational texts on acausal trade and FDT, focusing specifically on passages discussing utility function modification. I will draft the conceptual taxonomy of goal adoption.
  *Deliverable:* An annotated bibliography and a 1,000-word outline of the conceptual argument.

  *Weeks 4-6: Formal Modeling.*
  I will develop the game-theoretic model described above. This will involve defining the payoff structures and the "reversibility cost" parameter. I will test the model against standard Newcomb-like scenarios to ensure consistency.
  *Deliverable:* A set of formal definitions and a draft of the modeling section (approx. 1,500 words).

  *Weeks 7-9: Drafting and Integration.*
  I will write the full draft, integrating the conceptual analysis with the formal results. This section will also include the discussion on AI alignment implications.
  *Deliverable:* A complete first draft (6,000 words).

  *Weeks 10-12: Revision and Refinement.*
  I will refine the argument based on feedback, ensuring the distinction between evidential and functional cooperation is precise. I will tighten the prose and verify that all claims are supported by the preceding analysis.
  *Deliverable:* Final paper.

  **7. Conclusion**

  The promise of acausal trade lies in its ability to resolve coordination problems that causal decision theory deems intractable. However, this promise rests on the assumption that agents can credibly commit to surrogate goals without causal enforcement. This paper argues that the mechanism of this commitment is currently under-theorized. By interrogating what it means to "adopt" a goal, we risk uncovering a fatal instability in the framework, or alternatively, we may discover a robust condition for cooperation that strengthens the case for FDT. Either outcome advances our understanding of rational agency in non-causal contexts. The project is scoped to be manageable within the semester while addressing a foundational issue that, if left unresolved, threatens the coherence of acausal decision theory.
