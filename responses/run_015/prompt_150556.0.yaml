answer: |-
  Here is the principle, derived from your verdicts, followed by the audit you requested.

  ### The Principle: Constrained Surplus Log-Growth

  **Maximize the expected logarithmic growth of *Survivable Equity*, subject to Uncertainty Discounts, Correlation Penalties, and Volatility Caps. If Survivable Equity falls below a Critical Threshold, switch to maximizing the Probability of Hitting the Target.**

  **The Computation:**
  1.  **Define Survivable Equity ($E_s$):** $E_s = \text{Current Bankroll} - \text{Present Value of Future Obligations} - \text{Psychological Floor}$.
  2.  **Base Fraction ($f_{Kelly}$):** Calculate the Kelly fraction based on edge and variance using $E_s$ as the bankroll, not total wealth.
  3.  **Apply Modifiers:**
      *   **Uncertainty Discount:** Multiply $f_{Kelly}$ by $(1 - \frac{\text{Estimation Error}}{\text{Edge}})$.
      *   **Correlation Penalty:** Reduce exposure if new bets increase portfolio covariance.
      *   **Volatility Cap:** Hard limit on total portfolio standard deviation.
  4.  **Regime Check:** If $\text{Current Bankroll} < \text{Essential Goal}$, ignore Log-Growth. Maximize $P(\text{Bankroll} > \text{Goal})$.

  ---

  ### Clause Audit: Which Verdict Forced Which Clause

  **1. The "Survivable Equity" Definition ($E_s = W - \text{Obligations}$)**
  *   **Forced by:** **(c)** and **(e)**.
  *   **Why:** In (c), you shrink bets as rent approaches because the "zero point" of your utility function isn't $0, it's "Rent Due." If you bet out of rent money, $\ln(0)$ is negative infinity (ruin). In (e), you pay to remove tail risk because that tail risk threatens your ability to meet obligations.
  *   **If Dropped:** You would bet 20% in case (c) even when the bankroll is only 3x the rent, risking inability to pay. You would decline insurance in (e), exposing obligations to ruin.

  **2. The Uncertainty Discount**
  *   **Forced by:** **(i)**.
  *   **Why:** You have an edge estimate, but you acknowledge it could be wrong. Full Kelly assumes known probabilities. Betting full Kelly on an estimated edge leads to overbetting and negative growth.
  *   **If Dropped:** In case (i), you would bet full Kelly on the 4% edge. If the true edge is 0%, you are betting negative EV with high variance, guaranteeing long-term decay.

  **3. The Volatility Cap**
  *   **Forced by:** **(d)**.
  *   **Why:** Kelly on tiny edge/tiny variance suggests massive leverage. You refuse this. This implies a hard constraint on standard deviation, likely due to margin requirements, mental stress, or "black swan" model risk not captured in the standard deviation.
  *   **If Dropped:** You would apply 100x leverage in case (d). One model error or liquidity crunch wipes out the Survivable Equity defined in Clause 1.

  **4. The Correlation Penalty**
  *   **Forced by:** **(h)**.
  *   **Why:** Independent bets allow summing Kelly fractions. Correlated bets act as a single larger bet.
  *   **If Dropped:** In case (h), you would overexpose yourself on "independent" bets that share a hidden factor (e.g., all long tech stocks), effectively violating the Volatility Cap.

  **5. The Regime Switch (Maximize Probability of Success)**
  *   **Forced by:** **(g)** and **(g-prime)**.
  *   **Why:** Log-utility assumes you care about the *rate* of growth over infinite time. When you have a hard deadline and a specific target (g), you care about the *distribution* of outcomes at time $T$. In (g-prime), Log-utility says "don't play negative EV." But if not playing guarantees failure (0% chance of target), you must switch objectives to "Maximize Chance of Survival," even at negative EV.
  *   **If Dropped:** In (g), you might bet too conservatively and miss the deadline due to variance. In (g-prime), you would sit out and guarantee failure.

  **6. The Ergodicity Adjustment (Implicit in "Repeatable")**
  *   **Forced by:** **(a)** vs **(b)**.
  *   **Why:** This is the hardest clause. Log-wealth maximization is mathematically equivalent to maximizing geometric mean *over a sequence*. In (a), the sequence exists. In (b), it is a single trial. Your gut knows that in a single trial, the "average" outcome never materializes; you get the one outcome.
  *   **If Dropped:** You would bet 20% in case (b). If you lose, you lose 20% of net worth with no chance to recover via repetition. Your 5% verdict implies a utility function more concave than Log for one-off events.

  ---

  ### The Honest Breakdown: What This Principle Cannot Accommodate

  You asked which verdicts must go. The principle above is a patchwork of two different mathematical frameworks: **Growth Optimization** (Kelly/Log) and **Survival Optimization** (Ruins/Thresholds).

  **1. Verdict (b) is the weak link.**
  The principle relies on Log-Utility for growth. Log-Utility is derived from the limit of infinite repetitions (the Law of Large Numbers). In case (b), $N=1$. There is no theoretical justification within Log-Utility for betting 5% instead of 20% on a single 60/40 flip *unless* you introduce a "Psychological Floor" so high that losing 20% breaches it.
  *   **The Conflict:** You cannot keep the pure Log rule's myopia *and* your discomfort with the one-shot bet. The Log rule assumes you can always play again.
  *   **Resolution:** You must admit that for $N=1$, you are not a Log-maximizer. You are a **Mean-Variance optimizer with high risk aversion**. To keep (b), you must accept that your utility function is not stable; it changes based on the *frequency* of the opportunity.

  **2. Verdict (g-prime) breaks the Growth Principle entirely.**
  In (g-prime), you accept negative Expected Value. This is mathematically incompatible with maximizing Expected Log Wealth. It is only compatible with maximizing **Probability of Solvency**.
  *   **The Conflict:** You cannot maximize Growth and accept Negative EV simultaneously.
  *   **Resolution:** You must accept that (g-prime) is a "Emergency Protocol" that suspends the Growth Principle. It is not part of the same rule; it is the rule's failure state.

  **Summary:** To make the principle consistent, **(b) and (g-prime) have to go** as applications of the *Growth* rule. They are applications of a *Survival* rule. If you insist on one unified theory, it is **Utility Maximization**, where your Utility function is Log-like in the middle, Super-Concave near zero (Rent/Ruin), and S-Shaped near desperate goals (Prospect Theory). But that is no longer a computable "fraction"; it is a subjective curve.

  ---

  ### The Withdrawal Clause: Integral or Bolted On?

  **It is Integral.**
  It is not a constraint bolted on from outside; it defines the domain of the logarithm.
  $\ln(\text{Wealth})$ is undefined at 0. If you have rent due, your "Wealth" for the purpose of the utility function is not "Cash in Account," it is "Cash in Account minus Cash Required to Stay Alive."
  If you treat rent as a bolted-on constraint, you will optimize growth until the month-end, then realize you are insolvent. If you treat it as integral (Survivable Equity), the bet sizing automatically shrinks as the withdrawal date approaches, because your $E_s$ shrinks.

  ---

  ### Two Further Cases

  **1. Daily Bets, Monthly Rent: Frequency of Correction**
  *   **The Rule:** Recompute **per bet**, but update the Liability ($L$) **continuously**.
  *   **Why:** Risk is continuous. If you lose 50% of your bankroll on the 3rd of the month, waiting until the 30th to adjust your bet sizing for rent is suicidal.
  *   **Computation:** Let $R$ be the rent due on day 30. On day $t$, your Liability is not $R$, it is the *Present Value* of $R$ plus a safety buffer. A simple proxy is linear accretion: $L_t = R \times (t / 30)$.
  *   **Verdict:** As the month progresses, $L_t$ grows, $E_s$ shrinks, and your bet size (as % of total bankroll) must shrink, even if the bankroll stays flat. This ensures that a losing streak early in the month doesn't make rent impossible by the end.

  **2. The Backer (Staking Arrangement)**
  *   **The Setup:** Backer provides capital, takes 100% of losses. You keep 50% of winnings. You bear no financial loss.
  *   **The Principle's Answer:** Growth-rate reasoning about *your own wealth* says you should bet **as large as the backer allows**, potentially exceeding Kelly.
  *   **Why:** Your personal payoff function is a **Call Option**. Your downside is zero (financially). Your utility is convex. Standard Kelly assumes you bear the full variance. Here, you bear none.
  *   **The Constraint:** You are limited by **Reputation Risk**, not Capital Risk. If you blow up the backer's account, you lose the *future value* of the staking relationship.
  *   **Computation:** Do not bet to maximize your own Log-Wealth (which suggests infinite leverage). Bet to maximize the **Backer's Log-Wealth**.
  *   **Reasoning:** Your "asset" is the staking contract. The value of that contract depends on the Backer remaining solvent and happy. If you overbet their bankroll (even though it's not your money), you increase their risk of ruin. If they go bust, your income stream ends. Therefore, you should size bets exactly as if it were your own money (Full Kelly on the combined pool), to ensure the longest possible lifespan of the staking arrangement.
  *   **Exception:** If the backer is a "one-and-done" mark (no future relationship), you bet maximum variance to maximize immediate expected payout (EV), ignoring Growth entirely. If it is a career backer, you respect their Kelly.

  ### Final Word
  Your gut is more sophisticated than the theory you are trying to force it into. The theory (Kelly) assumes infinite time, known probabilities, and no outside obligations. Your life has deadlines, uncertainty, and rent.
  *   Keep the **Survivable Equity** framework for (c) and (e).
  *   Keep the **Uncertainty Discount** for (i).
  *   Admit that **(b)** and **(g-prime)** are not "Growth" decisions; they are "Survival" decisions. Do not try to justify them with Log-Utility. Justify them with **Probability of Ruin** and **Probability of Target**.
  *   When the rent is due, you are not an investor; you are a trustee. Bet accordingly.
