answer: |-
  You have identified a real gap in the taxonomy. While the *components* of what you describe are well-named, the specific *configuration*—the fusion of epistemic reliance, bureaucratic enforcement, and punitive inertia—does not have a single, universally accepted label in philosophy of science or social epistemology.

  Here is the map of the existing terrain, why it falls short, and a proposed term to carve out the space you're describing.

  ### The Near Misses

  1.  **Information Cascade:** This captures the *belief-copying* (you assume the big labs did the homework). However, standard cascade theory assumes individuals are making private decisions based on public signals. It lacks the *structural enforcement* mechanism. In a cascade, you can theoretically opt out without penalty; in your scenario, opting out costs you funding.
  2.  **Path Dependence:** This captures the *historical lock-in* (QWERTY keyboard effect). It explains why we stick with a suboptimal tool because switching costs are high. However, path dependence is usually technical or economic. It doesn't inherently capture the *epistemic* dimension (the assumption that the method is *correct*) nor the *normative* dimension (reviewers actively punishing deviation).
  3.  **Coercive Isomorphism (Sociology):** This is the closest existing concept (DiMaggio & Powell, 1983). It describes organizations becoming similar due to pressure from other organizations (e.g., grant agencies). However, this is an *organizational* theory term. It explains why departments look the same, but it doesn't explicitly track the *epistemic degradation* (the hidden bias in small samples) that results from the conformity.
  4.  **Methodological Monoculture:** This is a descriptive term often used in ecology and economics to describe the *outcome*. It names the field of identical crops, but not the *mechanism* of planting them.

  ### The Gap

  The configuration you lived through adds a **punitive normative layer** to a standard **epistemic cascade**.
  *   **Standard Cascade:** "I use it because I think they know something I don't."
  *   **Your Configuration:** "I use it because I think they know something I don't, *and* if I don't use it, I don't eat."

  Existing terms separate the *belief* (epistemology) from the *rule* (bureaucracy). You need a term that binds them.

  ### The Coinage: **Coercive Epistemic Lock-in**

  I propose **Coercive Epistemic Lock-in**.

  Here is how you carve its boundaries:

  **1. Versus Information Cascade (The Belief Boundary)**
  *   *Information Cascade:* Relies on voluntary signaling. If you have strong private evidence, you can break the cascade.
  *   *Coercive Epistemic Lock-in:* Private evidence is irrelevant because the incentive structure overrides it. Even if you *know* the package is biased for small samples, the grant rubric treats the method as a proxy for rigor. The "coercion" is the funding gatekeeping.

  **2. Versus Path Dependence (The History Boundary)**
  *   *Path Dependence:* Focuses on switching costs (e.g., retraining staff, rewriting code).
  *   *Coercive Epistemic Lock-in:* Focuses on *legitimacy costs*. You could technically switch methods tomorrow, but your work would be deemed "non-standard" by reviewers. The lock-in is not just technical inertia; it is social credentialing.

  **3. Versus Groupthink (The Psychology Boundary)**
  *   *Groupthink:* A psychological desire for harmony within a cohesive group suppresses dissent.
  *   *Coercive Epistemic Lock-in:* No psychological harmony is required. Researchers can privately hate the method (and many did), but the *system* enforces compliance. It is structural, not psychological.

  ### Why This Carving Matters

  Using **Coercive Epistemic Lock-in** allows you to distinguish this from simple conservatism. Conservatism implies a cautious wait-and-see approach. This phenomenon is active enforcement of a specific tool that creates a *systematic blind spot* (the small sample bias).

  It also distinguishes it from **Fraud** or **Misconduct**. Everyone is acting rationally. The grad student isn't cheating; they are optimizing for survival within a system that conflates *methodological conformity* with *epistemic validity*.

  ### Summary
  The sociology exists (**Coercive Isomorphism**), and the economics exists (**Path Dependence**), but the *social epistemology* of this specific bureaucratic-enforced belief system lacks a dedicated label. **Coercive Epistemic Lock-in** captures the triad:
  1.  **Epistemic:** Belief in the method's validity via deference.
  2.  **Coercive:** Institutional punishment for deviation.
  3.  **Lock-in:** Persistence despite evidence of flaw.

  It is a precise fit for the "grant-driven methodological cascade" you observed.
