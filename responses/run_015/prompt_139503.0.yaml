answer: |-
  # Specification for an Account of Causation by Omission

  ## 1. Purpose and Mandate Coherence
  **Purpose:** To identify a theory of causation by omission capable of simultaneously supporting:
  1.  **Explanation:** Singular causal claims in ordinary and specialist discourse (agential and non-agential).
  2.  **Attribution:** The causal step in legal and moral responsibility (linking omission to agent).
  3.  **Modeling:** Integration into variable-based causal models (DAGs, Structural Causal Models) used in epidemiology and engineering.

  **Coherence Assessment:** The triple mandate is **tense but coherent**, provided the account distinguishes between *causal structure* (required for Modeling) and *causal selection* (required for Explanation and Attribution).
  *   **The Tension:** Job (iii) requires duty-free difference-making (if the generator *had* engaged, the system *would* have held). Job (ii) requires duty-bound attribution (the nurse caused the death *because* she ought to have acted).
  *   **The Risk:** If the account makes norms constitutive of causation, it fails Job (iii) (models cannot easily encode "oughts" as structural parameters). If the account makes causation purely objective, it fails Job (ii) (it cannot distinguish the negligent nurse from the bystander who also didn't act).
  *   **Resolution Strategy:** The specification demands the account explicitly locate where norms enter: either into the *relata* (the cause itself is a normative fact), the *relation* (causation is a normative relation), or the *pragmatics* (causation is objective, but citation is normative). An account that conflates these will fail the mandate.

  ---

  ## 2. Requirements Checklist

  **1. The Selection Filter**
  *   **Requirement:** The account must provide a principled filter distinguishing causal omissions from the infinite set of non-occurring preventers (e.g., the Queen not watering the plant vs. the gardener).
  *   **Motivation:** Without a filter, every absence is a cause, rendering the concept useless for Explanation (i) and Attribution (ii).
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** None. All viable accounts admit this is necessary.

  **2. Agency-Neutrality of Structure**
  *   **Requirement:** The underlying causal machinery must handle non-agential omissions (rains, firewall) identically to agential ones (nurse, driver) at the structural level.
  *   **Motivation:** Required for Modeling (iii) and Explanation (i). Engineering models treat "switch not thrown" and "rain not falling" as structurally isomorphic variable states.
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** Tensions with Attribution (ii). If structure is neutral, norms must enter elsewhere to pin responsibility.

  **3. Variable Operationalization**
  *   **Requirement:** The account must specify how an omission maps to a variable value in a causal model without circularity (i.e., without defining the variable's "default" state solely by the outcome it prevents).
  *   **Motivation:** Required for Modeling (iii). In SCMs, we need to know why $Switch=0$ is the baseline and $Switch=1$ is the intervention, not vice versa.
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** High. This is the technical bottleneck for integrating norms into models.

  **4. Transitivity and Chain Continuity**
  *   **Requirement:** The account must specify whether causal chains can sustain multiple omission nodes (Supervisor didn't train $\to$ Guard didn't act $\to$ Death) and whether causal strength attenuates.
  *   **Motivation:** Required for Explanation (i) and Attribution (ii). Legal liability often hinges on breaking the chain; engineering relies on fault trees.
  *   **Status:** **Preference (Camp-Dependent).** Some theories deny transitivity for omissions; others allow it.
  *   **Conflict Flag:** If transitivity is allowed unrestrictedly, it threatens Attribution (ii) by spreading blame too thinly.

  **5. The Overdetermination Constraint**
  *   **Requirement:** The account must deliver a verdict on symmetric overdetermination by omission (two guards sleep; either waking would have saved the victim).
  *   **Motivation:** Required for Attribution (ii). Legal practice often holds both liable, but strict counterfactualism says neither caused the death (since the other didn't act).
  *   **Status:** **Non-negotiable.** (Must deliver *a* verdict, not necessarily the legal one).
  *   **Conflict Flag:** Pure counterfactual accounts fail this without modification (e.g., minimal sufficiency).

  **6. Spatiotemporal Grounding**
  *   **Requirement:** The account must locate the omission. Is it at the agent, the patient, or the spacetime region where the event failed to occur?
  *   **Motivation:** Required for Modeling (iii) and Explanation (i). "The plant died because..." implies a location of the causal interaction.
  *   **Status:** **Preference (Metaphysical Camp).**
  *   **Conflict Flag:** Process theories demand location; Counterfactual theories often treat it as a relation between facts.

  **7. The Intervention Asymmetry**
  *   **Requirement:** The account must explain why we test omissions by intervening to *add* the event (water the plant), not by intervening to *remove* it (since it is already absent).
  *   **Motivation:** Required for Modeling (iii). This is a structural feature of DAGs regarding null values.
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** None. This is a formal constraint of the modeling job.

  **8. Normative Integration (The Fault Line)**
  *   **Requirement:** The account must explicitly state whether norms (duties, expectations, statistical defaults) are constitutive of the causal relation or merely constraints on causal *citation*.
  *   **Motivation:** Required to reconcile Explanation (i) and Attribution (ii) with Modeling (iii).
  *   **Status:** **Non-negotiable.** (Must take a stance).
  *   **Conflict Flag:** **CRITICAL.** If norms are constitutive, Modeling (iii) is compromised (models become moralized). If norms are pragmatic, Attribution (ii) is compromised (causation separates from blame).

  **9. Ontological Parity**
  *   **Requirement:** The account must state whether "omission" refers to a negative event, a fact, an absence, or merely a true proposition.
  *   **Motivation:** Required for metaphysical consistency. "Nothing caused the death" is distinct from "The absence of water caused the death."
  *   **Status:** **Preference (Metaphysical Camp).**
  *   **Conflict Flag:** Process theories usually reject negative events; Counterfactual theories accept facts as relata.

  **10. The Deflation Check**
  *   **Requirement:** The account must identify a truth-condition difference between "O caused E" and "If O had not occurred, E would not have occurred."
  *   **Motivation:** Required to avoid the Deflation Worry. If they are identical, "causation" adds nothing to "counterfactual dependence."
  *   **Status:** **Preference.** Some accounts accept deflation; others resist it.
  *   **Conflict Flag:** Accepting deflation makes the account easier to model (iii) but harder to use for robust Explanation (i).

  **11. Empirical Alignment**
  *   **Requirement:** The account should not systematically contradict robust experimental findings on folk causal attribution regarding omissions, unless justified by error theory.
  *   **Motivation:** Required for Explanation (i) (ordinary discourse).
  *   **Status:** **Negotiable.** Metaphysics may correct folk intuition, but radical divergence limits utility for Job (i).
  *   **Conflict Flag:** Folk intuition is highly norm-sensitive; Modeling is not.

  **12. Fundamental Physics Compatibility**
  *   **Requirement:** The account must explain why omissions appear in special sciences/law but not in fundamental physics equations.
  *   **Motivation:** Metaphysical consistency.
  *   **Status:** **Preference.** Given the triple mandate focuses on special sciences/law, this is secondary.
  *   **Conflict Flag:** If the account requires omissions to be fundamental, it contradicts physics. If it treats them as emergent, it must explain the emergence.

  ---

  ## 3. The Objectivity vs. Normativity Conflict
  **The Fault Line:** Requirement #8 (Normative Integration).
  *   **Side A (Objectivity):** Causation is a mind-independent, duty-free relation of difference-making. Norms enter only at the stage of *selecting* which causes to cite or blame.
      *   *Pros:* Satisfies Modeling (iii) perfectly. Preserves scientific neutrality.
      *   *Cons:* Struggles with Attribution (ii). If the bystander and the nurse are causally equivalent, why is only the nurse responsible? The account must offload this to a separate theory of responsibility, risking a disconnect between "cause" and "liable cause."
  *   **Side B (Normativity):** Causation by omission is inherently normative. A cause is a deviation from a relevant norm/expectation.
      *   *Pros:* Satisfies Attribution (ii) and Explanation (i) naturally. Explains why we don't cite the Queen.
      *   *Cons:* Threatens Modeling (iii). Causal models become relative to moral/legal frameworks. It becomes difficult to build a "duty-free" engineering model if the causal structure itself depends on who was supposed to act.

  **Recommendation:** **Give up Side B as a metaphysical claim, retain it as a semantic/pragmatic constraint.**
  *   *Reasoning:* To satisfy Job (iii) (Modeling), the causal structure must be objective ($X=0$ leads to $Y=0$). If causation itself is normative, we cannot build general epidemiological models without encoding moral duties into the variables.
  *   *Cost:* We must accept that "causation" in the legal sense (Job ii) is a hybrid concept: Objective Dependence + Normative Breach. The account must specify how these combine without calling the breach part of the *causation* strictly speaking. This risks making the account less satisfying for lawyers who want "cause" to do all the work.

  ---

  ## 4. Distinctiveness of Omissions
  **Does the problem dissolve?**
  Once a robust filter (Requirement #1) is in place, **80% of the "problem of omissions" dissolves into the general problem of causal selection.**
  *   *Why:* The Queen/Gardener problem is just the Problem of Profligate Causes applied to absences.
  *   *The Remaining 20%:* The **Ontological/Interventional Asymmetry** (Requirement #7 & #9).
      *   Positive causes involve energy transfer or variable changes from baseline.
      *   Omissive causes involve *maintaining* a baseline that leads to an outcome.
      *   *Distinctive Feature:* Omissions require a **Default/Deviation** structure that positive events do not strictly require. A positive event (explosion) is causal regardless of expectations. An omission (not exploding) is only causal relative to an expectation that it *should* have exploded.
      *   *Conclusion:* Omissions are not a distinct *metaphysical* category, but they are a distinct *modeling* category requiring explicit default values.

  ---

  ## 5. Missing Distinctions
  **1. The Variable-Anchor Distinction**
  *   **Definition:** Distinguishing between the *physical variable* (e.g., Water Level) and the *normative anchor* (e.g., Expected Water Level).
  *   **Case:** The Firewatcher case. The firewatcher sleeps; the forest burns. The passerby sleeps; the forest burns.
      *   *Physical Variable:* Both have $Attention=0$.
      *   *Normative Anchor:* Firewatcher has $Duty=1$; Passerby has $Duty=0$.
  *   **Necessity:** Without this, Modeling (iii) cannot distinguish the two cases, and Attribution (ii) fails. Most accounts conflate the variable state with the normative status.

  **2. Preventive vs. Generative Omissions**
  *   **Definition:** Distinguishing omissions that allow a process to proceed (not braking allows collision) vs. omissions that fail to initiate a saving process (not watering allows death).
  *   **Case:** Double Prevention. (Antidote prevents poison; I don't give antidote).
  *   **Necessity:** Legal and engineering treatments differ. "Failure to engage safety" (generative omission) is treated differently than "Failure to stop hazard" (preventive omission) in liability caps.

  ---

  ## 6. The Single Most Exclusionary Requirement
  **Requirement:** **#3 Variable Operationalization (Non-Circular Defaults).**
  *   **Statement:** *The account must specify how the "zero" or "default" value of a variable is determined independently of the outcome it fails to prevent.*
  *   **Why it excludes attractive views:**
      *   **Pure Counterfactualism:** Often defines the omission as "the event that, had it occurred, would have prevented the outcome." This is circular for modeling (you need the variable definition *before* you test the outcome).
      *   **Pure Normativism:** Defines the default as "what ought to have happened." This excludes Job (iii) because engineering models cannot compute "oughts" without external moral input.
      *   **Process Theories:** Often exclude omissions entirely because there is no physical variable to anchor.
  *   **Defense:** This requirement forces the account to bridge the gap between metaphysics and modeling. It demands a story about *statistical normality* or *system design* that is objective enough for science but specific enough for law. It is the hardest technical hurdle for a unified theory.

  ---

  ## 7. Scorecard

  | Account Type | Performance on Triple Mandate | Primary Failure Point |
  | :--- | :--- | :--- |
  | **Counterfactual / Difference-Making** (e.g., Lewis, Woodward) | **Strong on (iii), Weak on (ii).** Handles modeling and structure well. Struggles to distinguish negligent agent from bystander without pragmatic add-ons. | **Selection Filter.** Requires external norms to solve the "Queen's Garden" problem, threatening the claim that causation is objective. |
  | **Process / Mechanism** (e.g., Salmon, Dowe) | **Strong on Ontology, Fails (i) & (iii).** Rejects omissions as causes (no conserved quantity). Must treat omission claims as elliptical or non-causal explanations. | **Ontology.** Cannot accommodate Job (i) without redefining "causation" to include non-processes, which breaks the theory's core motivation. |
  | **Non-Causal / Explanationist** (e.g., Beebee, McGrath) | **Strong on (i) & (ii), Fails (iii).** Treats omission claims as true explanations but denies they denote causal relations. | **Modeling.** Cannot plug into SCMs/DAGs as causal edges. Forces a bifurcated ontology where science uses "cause" and law uses "cause*" differently. |
