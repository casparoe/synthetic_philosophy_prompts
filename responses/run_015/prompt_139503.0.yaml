      *   Scorecard (3 rows)? Yes.

  10. **Polishing the Tone:**
      *   Needs to be rigorous, philosophical but practical (specification style).
      *   Avoid waffling. Take a stance on the coherence of the mandate.

  *(Self-Correction during drafting)*: I initially thought about dropping the "Fundamental Physics" requirement. But the prompt asks me to prune fake ones. Fundamental physics is relevant *only* if the account claims to be fundamental. Given the mandate (ordinary/legal/modeling), fundamental physics is less critical than modeling compatibility. I will downgrade it to a preference/constraint on reductionism rather than a hard requirement.
  *Correction on "Distinctiveness":* I need to be clear. Is omission a distinct *metaphysical* category or just a *pragmatic* one? The specification should demand the candidate declare this.

  *Final Plan:*
  1.  Introduction: Fix the Purpose & Mandate Coherence.
  2.  The Requirements List (Numbered, with Status/Conflict).
  3.  The Objectivity vs. Normativity Conflict (Deep Dive).
  4.  Distinctiveness of Omissions.
  5.  Missing Distinctions.
  6.  The Single Exclusionary Requirement.
  7.  Scorecard.

