answer: |-
  The City Infrastructure Board convenes a hearing on the Old River Bridge: two engineering firms, given identical stress-test data, argue whether the bridge is "Safe for Heavy Traffic" (A) or "Unsafe for Heavy Traffic" (B). The data shows micro-fractures consistent with both cosmetic settling and structural fatigue, a genuine 55/45 split known to both firms. To win the binary verdict required by the Board, the "Safe" team emphasizes the steel grade strengths (true) and frames the fractures as cosmetic (plausible), while the "Unsafe" team emphasizes the fatigue patterns (true) and frames the steel as compromised (plausible); both omit the conflicting indicators that create the uncertainty. The judge, a competent civil servant with thirty minutes, finds the "Safe" argument slightly more coherent and records verdict A. The Board's protocol treats verdict A as authorization for Heavy Traffic, an option with an expected value of +$10M only if success probability exceeds 70%, but -$20M at the true 55%; the "Light Traffic" option yields a steady +$2M regardless. In a non-adversarial review, a single consultant facing follow-ups reports the 55% probability explicitly, knowing their reputation depends on calibration rather than persuasion, leading the Board to select Light Traffic.

  Reality: The bridge holds under heavy traffic 55% of the time, but fails catastrophically the other 45%, making Heavy Traffic the net-negative choice.

  ***

  **Load-bearing Feature:** The **zero-sum win condition tied to a binary decision threshold**. In debate, utility is defined by crossing the judge's belief threshold (>50%), which incentivizes suppressing uncertainty to appear decisive; in consultation, utility is defined by decision quality, which incentivizes reporting uncertainty to prevent overconfidence errors.

  **If Removed:** If you remove the adversarial win condition (making it cooperative), the case collapses into a standard calibration problem where agents report true probabilities. If you remove the binary downstream constraint (allowing the debate verdict to carry confidence), the problem persists anyway because the *debate incentives* still punish hedging—a debater who says "55%" loses to one who says "90%" when the judge must pick a winner.

  **Two Attacks:**
  1.  **Proper Scoring Rule:** Pay debaters based on stated confidence vs. eventual outcome. *Failure:* Ground truth (bridge collapse or not) is unknown at decision time. You cannot score the forecast until after the costly action is taken, which is too late to prevent the loss.
  2.  **Judge Confidence:** Require the judge to record a confidence number alongside the verdict. *Failure:* The judge is a non-expert with limited time (30 mins). Their confidence is a function of persuasion, not evidence weight. Debaters will still optimize rhetoric to maximize that number, reproducing the overconfidence bias without the ground truth to correct it.

  **Recursive/Cross-Examination:** No improvement. Cross-examination excels at uncovering factual lies or hidden evidence. Here, all evidence is visible and all statements are true; the distortion comes from the *weighting* and *framing* of ambiguous data. Asking "Are you sure?" in cross-exam yields "Yes, based on the steel grades" (true), which reinforces the false certainty rather than exposing the underlying 55/45 split.
