      *   *Reason 2: Selection Bias.* Both sides cherry-pick regions (e.g., Weber picks England/Netherlands; critics pick Italy/Catholic regions with early banking).
      *   *Reason 3: Tautology Risk.* "Spirit of Capitalism" is hard to define independently of "Capitalism."
      *   *Reason 4: The "Switchman" Metaphor.* Weber himself didn't say ideas *create* interests, but that they determine the *direction* of interests. Critics often attack a strawman version of Weber (ideas > matter) rather than his actual nuance (ideas channel matter).

