      *   *The "Heavy Lifting":* Identify that Claim 3 & 4 do the work for the gradual replacement argument.
      *   *The Falsehoods/Confusions:* Address Token vs. Type. Explain how the slogan smuggles in Multiple Realizability as if it were proven fact. Mention Biological Naturalism (Searle) as a counter-view.
