answer: |-
  **Project Title:** The Selective Submission Problem: Endogenizing the Agenda in Epistemic Democracy

  **Project Proposal**

  The Condorcet Jury Theorem (CJT) provides the canonical epistemic defense of majority rule: if voters are competent and independent, the majority likely tracks the truth. However, standard formulations treat the agenda as exogenous. In practice, bodies like juries, boards, and legislatures vote only on questions that survive a prior routing process. Items reach a vote partly *because* they are contested or difficult, meaning the population of voted questions is selected on something close to the dependent variable. This project investigates the "selective submission problem": does endogenizing the agenda undermine the epistemic case for expanding the domain of majority rule?

  I distinguish two claims often run together. First, the *Reliability Claim*: majority rule is reliable for the questions it actually decides. Second, the *Expansion Claim*: a group improves its overall decision quality by routing more questions to majority rule. My hypothesis is that selective submission allows the Reliability Claim to survive while falsifying the Expansion Claim. A body may raise its observed hit rate precisely by keeping hard questions away from the vote, decoupling the epistemic case for majority rule from the epistemic case for majoritarianism.

  This inquiry is orthogonal to standard debates over voter independence, deliberation-induced correlation, or heterogeneous competence. Those critiques accept the question as given and attack the parameters of the voters. My project accepts that voters may satisfy standard competence conditions but argues the *sample* of questions is biased. Settling whether deliberation increases correlation does not settle whether the questions surviving deliberation are systematically harder than the population average. This is a selection effect problem, not a voter psychology problem.

  The method is formal and synthetic, assuming no access to private data on real deliberations. Months 1–2 will define a formal model of the routing mechanism, treating difficulty as a variable correlated with the probability of reaching a vote. Months 3–5 will derive analytic results regarding competence under selection, specifically testing whether selection effects can be bounded without empirical priors. Months 6–7 will run synthetic simulations to illustrate how varying routing thresholds affect overall system accuracy across three illustrative cases: criminal juries (high stakes, unanimous routing), foundation boards (medium stakes, committee routing), and legislative floors (low stakes, partisan routing). These cases establish structural possibilities, not empirical frequencies. Months 8–9 will synthesize results into a final paper and practical guidelines.

  I reject three obvious alternatives. An empirical study of real decision bodies is impossible without data access and would confuse specific institutional pathologies with the structural logical point. A purely conceptual analysis of "competence" misses the structural selection mechanism inherent in routing. Finally, the social-choice literature on agenda control typically assumes strategic setting by actors with preferences over outcomes; my project assumes actors with preferences over *difficulty* or *resolution costs*, focusing on epistemic reliability rather than strategic manipulation. I take from the latter the formal tools for modeling agenda constraints but apply them to epistemic filtering.

  The range of conclusions depends on the bounds of the selection function. The strongest deflationary view—the steelman against my project—argues that selection effects are simply absorbed into a redefined competence parameter for the voted subpopulation. If the routing process filters for questions where voter competence remains above 0.5, the theorem's structure remains untouched, and my project becomes a technical footnote on parameter estimation. The decisive consideration is whether the routing mechanism correlates positively with difficulty such that competence drops below 0.5 for the voted subset even if it holds for the population.

  The project fails if the selection function proves too complex to bound without empirical data, rendering the model indeterminate. It is too big if I attempt to model the routing actors' own competence rather than treating routing as a black-box probability function. I will avoid this by treating routing as a stochastic filter correlated with difficulty, not a rational agent model.

  The practical deliverable for the foundation's bylaw committee will be a conditional rule of thumb: do not expand voting rights to routine administrative decisions unless the routing threshold for disagreement is raised concomitantly. Specifically, if the executive committee routes items only when unanimity fails, the board's observed accuracy will be artificially high, misleading them into trusting majority rule on harder items. The rule must warn that high board accuracy on voted items is evidence of successful filtering, not necessarily voter competence.

  Finally, this framing concedes that reliability is not legitimacy. A proceduralist who values voting for reasons of equality or consent will not be moved by epistemic degradation. This project cannot claim that selective submission makes voting unjust, only that it may make voting less truth-tracking than assumed. It limits the scope of epistemic arguments without touching procedural ones.

  ***

  | Framing considered | What it makes tractable | What it costs | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Selective Submission (Adopted)** | Isolates agenda formation from voter competence; allows formal bounding of epistemic loss. | Requires abstract modeling of "difficulty"; lacks empirical validation. | adopt |
  | **Empirical Institutional Study** | Provides real-world validation; captures nuanced routing behaviors. | Impossible without data access; conflates structure with specific pathology. | reject |
  | **Strategic Agenda Control** | Utilizes existing social choice formalisms; models actor incentives. | Assumes preference-based manipulation rather than epistemic filtering. | fallback |
  | **Conceptual Competence Analysis** | Clarifies definitions of voter ability; addresses heterogeneity. | Ignores the structural selection bias of the questions themselves. | reject |

