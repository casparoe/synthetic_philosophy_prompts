  I see three critical sub-questions. First, **Granularity**: Is the space of behavioral regularities discrete or continuous? If I can define a regularity $R_\epsilon$ that differs from $R$ by an infinitesimal amount, and expectations can track this drift, then "Creep" is possible. Second, **Threshold Sharpness**: Lewis says "almost everyone." Is this a hard cutoff (e.g., 90%) or a fuzzy predicate? If hard, a mathematical gap is inevitable when swapping distinct $R$ and $R^*$. If fuzzy, the transition can be seamless. Third, **Population Unity**: Does "Population $P$" require global homogeneity? If sub-populations can hold distinct conventions simultaneously without the global situation becoming "disordered" (perhaps it becomes a *mixed* convention), the "no convention" state might be avoided.

  The physicist's lab case pulls me toward *Creep*. If the labeling scheme changed monthly without confusion, expectations were met at every stage. Under a charitable reading, each monthly scheme was a convention, linked by a meta-norm of "follow the update." However, the judge's point holds logical force: if $R$ and $R^*$ are *distinct*, one cannot conform to both. At the switch point, conformity to $R$ drops below "almost everyone" before conformity to $R^*$ rises to it. Unless there is an intermediate $R_{mid}$ that *also* satisfies Lewis's conditions. The crux is whether intermediate regularities can sustain the requisite common knowledge during the shift.

  My weakest grip is on whether Common Knowledge can survive the "noise" of transition. Lewis requires CK of conformity. If 80% conform, do we have CK that "almost everyone" conforms? If "almost everyone" is vague, yes. If precise, no. This vagueness is the escape hatch for the *Creep* hypothesis.

