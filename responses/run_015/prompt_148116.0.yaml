rict neutrality your friend implies. The metaphor freezes time, removing the lag between injection and price adjustment. It also suggests substitutability: any oil works. But specific currencies have specific trust networks. Finally, it implies no capacity limit: you can always add more oil. But an engine can be flooded. These nuances are stripped away, leaving a simplified image that supports the friend's conclusion by omission rather than logical necessity.

