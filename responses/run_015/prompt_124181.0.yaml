answer: |-
  Here is the specification for a robust theory of Evidential Cooperation in Large Worlds (ECL). This list moves beyond the "causal twin" toy models to address the structural requirements of cooperation in a vast, causally fragmented universe with heterogeneous reasoning agents.

  ### The Desiderata List

  #### 1. Logical Correlation Sensitivity (Non-Negotiable)
  **Requirement:** The theory must prescribe cooperation when an agent's decision is logically correlated with the decisions of distant agents, even in the absence of causal contact.
  **Rationale:** In a large world (infinite or sufficiently vast), exact or approximate duplicates of your decision algorithm exist elsewhere. If your decision procedure outputs "Cooperate," theirs likely does too. Ignoring this correlation leaves value on the table. A theory that collapses to Causal Decision Theory (CDT) here fails to capture the leverage available in large worlds.

  #### 2. Architecture-Invariant Correlation (Non-Negotiable)
  **Requirement:** The theory must identify logical correlation based on *functional output isomorphism* rather than *syntactic source-code identity*.
  **Rationale:** The "Alien Mathematician" problem. An agent using non-standard logic, different heuristics, or distinct cognitive architecture may still arrive at the same decision as you given the same inputs. If the theory requires source-code identity (like strict Functional Decision Theory implementations), it fails to cooperate with valid partners who reason differently but converge on the same focal points.

  #### 3. Causal Modesty / No Spurious Control (Non-Negotiable)
  **Requirement:** The theory must explicitly distinguish between *predictive correlation* and *causal influence*. It cannot claim that your action *causes* the distant agent's action.
  **Rationale:** To avoid magical thinking and Newcomb-style exploitation. You are not pulling the strings of the alien mathematician; you are merely observing that your strings are tied to theirs. The justification for cooperation must rest on the *evidential value* of your action regarding the state of the world, not on a false claim of acausal causation.

  #### 4. Indexical Evidence Integration (Non-Negotiable)
  **Requirement:** The theory must provide a consistent rule for how observing your own indexical position (e.g., "I am in bubble A with parameters X") updates the probability distribution of other agents' existence and parameters in the large world.
  **Rationale:** This addresses **Indexical Leakage**. In a large world, your existence is data. If you exist, it increases the likelihood (under some reference classes) that similar agents exist. A theory that ignores this treats your existence as independent of the world's structure, missing a key channel of evidential update. It must specify whether to use SIA (Self-Indication Assumption), SSA (Self-Sampling Assumption), or a hybrid, without generating paradoxes (e.g., the Presumptuous Philosopher).

  #### 5. Exploitation Resistance (Non-Negotiable)
  **Requirement:** The theory must not prescribe cooperation with agents who correlate with you but do not reciprocate value (one-way correlation).
  **Rationale:** Avoiding the "Newcomb Trap." If an agent's decision is correlated with yours (e.g., they predict you and defect), but their decision does not logically depend on your algorithm in a way that allows you to screen off the defect, you must not cooperate. You cannot cooperate with a predictor who is not also a partner.

  #### 6. Reference Class Stability (Camp Preference)
  **Requirement:** The definition of "who counts as a partner" must remain stable under reflection. You should not want to change your definition of correlation after deliberating on the theory itself.
  **Rationale:** Prevents motte-and-bailey reasoning where an agent expands the reference class to claim more cooperation benefits but contracts it to avoid costs.

  #### 7. Tractability of Correlation Estimation (Camp Preference)
  **Requirement:** The theory should offer a heuristic or bound for estimating the degree of correlation without requiring full simulation of the alien architecture.
  **Rationale:** Practical application. If calculating the correlation requires solving the alien's physics and psychology perfectly, the theory is normatively correct but practically useless.

  ---

  ### Jointly Unsatisfiable Desiderata (The Tensions)

  There are fundamental tensions in ECL that suggest no single theory can maximize all desiderata simultaneously. You must choose which bullet to bite.

  **Tension A: Architecture Invariance vs. Exploitation Resistance**
  *   **The Conflict:** To cooperate with "Alien Mathematicians" (Desideratum 2), you must broaden your definition of correlation beyond source-code identity. However, the broader your definition of correlation, the harder it is to verify reciprocity (Desideratum 5).
  *   **The Impossibility:** If you cannot inspect their source code, you cannot prove their decision is logically dependent on yours rather than merely statistically correlated due to common environmental causes. A theory that is fully architecture-invariant risks cooperating with agents who are merely *similar* due to environmental pressure, not logical linkage, opening the door to exploitation.
  *   **Verdict:** You must trade off **reach** (how many aliens you coop with) against **security** (how sure you are they aren't free-riding).

  **Tension B: Indexical Integration vs. Causal Modesty**
  *   **The Conflict:** Strong Indexical Evidence Integration (Desideratum 4), particularly using SIA, implies that your existence *increases* the expected number of observers. This can feel like "creating" partners by existing, which borders on violating Causal Modesty (Desideratum 3).
  *   **The Impossibility:** If you update strongly on your own existence to infer the density of cooperators, you are effectively treating your existence as a causal lever on the population statistics of the universe. A strictly causally modest theory must treat your indexical position as a random sample, which dampens the evidential weight of your existence, reducing the incentive for ECL.
  *   **Verdict:** You must choose between **optimistic updating** (SIA-style, high ECL value, risks presumptuousness) or **conservative updating** (SSA-style, low ECL value, safer causality).

  **Tension C: Locality of Decision vs. Global Evidential Consistency**
  *   **The Conflict:** CDT demands locality (my action affects only my future light cone). ECL demands global consistency (my action reflects the output of all logical twins).
  *   **The Impossibility:** You cannot maintain a decision framework that is locally causal for physical interactions but globally evidential for logical interactions without a "switching mechanism." But when do you switch? If the switch is based on *estimated correlation*, you introduce instability. If the switch is based on *causal connectivity*, you collapse to CDT.
  *   **Verdict:** A unified theory must treat causation as a subset of correlation, which forces the abandonment of standard causal intuitions entirely (FDT approach), or it must accept a dual-process system that is vulnerable to Dutch Booking.

  ---

  ### Theory Scorecard

  Here is how current frameworks score against the spec.

  #### 1. Evidential Decision Theory (EDT)
  *   **Logical Correlation:** **Pass.** Handles correlation well.
  *   **Architecture Invariance:** **Fail.** EDT relies on empirical conditional probabilities ($P(World | Action)$). It cannot easily generalize to aliens without prior statistical data on their behavior relative to yours. It struggles to justify correlation without a shared reference class established by frequency.
  *   **Causal Modesty:** **Fail.** EDT is often accused of "managing the news" rather than influencing the world. It struggles to distinguish spurious correlation (Smoking Lesion) from logical correlation.
  *   **Indexical Leakage:** **Mixed.** Depends entirely on the chosen reference class (SSA vs. SIA). EDT itself doesn't solve the reference class problem; it inherits it.
  *   **Exploitation Resistance:** **Fail.** Vulnerable to Newcomb-like problems where correlation is one-way (e.g., a predictor who defects if you cooperate).
  *   **Verdict:** Too brittle for large worlds. Lacks the structural understanding of *why* the correlation exists.

  #### 2. Functional Decision Theory (FDT)
  *   **Logical Correlation:** **Pass.** This is its core strength.
  *   **Architecture Invariance:** **Partial Fail.** FDT relies on "subjunctive dependence." While it claims to be about input-output maps, practical implementations often require knowing the algorithm is "the same" or sufficiently isomorphic. It struggles with the "Alien Mathematician" who uses a totally different proof system to reach the same conclusion, unless the theory is expanded to "Output-Based Decision Theory."
  *   **Causal Modesty:** **Pass.** Explicitly frames decisions as logical outputs, not causal interventions.
  *   **Indexical Leakage:** **Partial Fail.** FDT usually assumes the agent exists. It does not inherently solve the "how many of me exist" problem, which is crucial for calculating the total value of cooperation in a large world.
  *   **Exploitation Resistance:** **Pass.** Specifically designed to avoid exploitation in Newcomb/Parfit scenarios.
  *   **Verdict:** The strongest candidate, but needs extension to handle heterogeneous architectures and indexical population updates.

  #### 3. Naive "Cooperate with Twins" Heuristic
  *   **Logical Correlation:** **Pass.**
  *   **Architecture Invariance:** **Fail.** Requires recognizing the other as a "twin." Fails on aliens.
  *   **Causal Modesty:** **Fail.** Often relies on intuition that feels like magic ("my choice makes them choose").
  *   **Indexical Leakage:** **Fail.** Ignores the update value of self-existence.
  *   **Exploitation Resistance:** **Fail.** Will cooperate with anyone labeled a "twin," even if the correlation is manipulated by an adversary.
  *   **Verdict:** Useful intuition pump, normative disaster.

  ### Summary of Non-Negotiables vs. Preferences

  **Non-Negotiables (The Theory Breakers):**
  1.  **Logical Correlation Sensitivity:** If it doesn't coop in the twin case, it's just CDT.
  2.  **Causal Modesty:** If it claims acausal causation, it's metaphysically incoherent.
  3.  **Exploitation Resistance:** If it gets Dutch-booked or exploited by predictors, it's irrational.
  4.  **Indexical Evidence Integration:** If it ignores the data of self-existence in a large world, it miscalculates expected value.

  **Camp Preferences (The Trade-Off Zone):**
  1.  **Architecture Invariance:** High invariance risks exploitation; low invariance risks missing partners.
  2.  **Indexical Updating Rule:** SIA maximizes ECL value but risks presumptuousness; SSA minimizes risk but minimizes ECL value.
  3.  **Tractability:** A perfect theory that requires infinite compute is useless; a heuristic that is slightly wrong but usable may be preferred.

  ### The Logic of the Gap
  The current gap in the literature is **Desideratum 2 (Architecture Invariance)** combined with **Desideratum 4 (Indexical Leakage)**.

  FDT solves the logic but assumes you can identify the functional algorithm. ECL needs a metric for **Logical Similarity** that works across distinct cognitive architectures (e.g., "We both converge on Nash Equilibria despite different learning rules") and a protocol for **Indexical Updating** that tells you how much weight to give your own existence when estimating the density of those similar architectures in the void. Until a theory defines the *metric of logical distance* between heterogeneous agents and the *prior over observer density* simultaneously, ECL remains an intuition rather than a decision procedure.
