answer: |-
  **Interview Questions: The Fidelity Account of Sunk Costs**

  **1. The Collapse Objection**
  You argue that prospectivism fails because it treats the agent as a time-slice. But consider the "rich description" reply: if I continue a failing marriage because leaving would fracture my self-conception or hurt my children, haven't I just identified a prospective cost of quitting? If every instance of fidelity can be re-described as a prospective concern about identity or relationship maintenance, what substantive work is the "sunk" status doing? Is the fidelity account just prospectivism with a thicker vocabulary?

  *   **Follow-up:** If you reply that **[the cost isn't really sunk]** because it bears on my future identity, does that imply that a truly isolated agent—with no identity tied to the project—would be irrational to honor sunk costs? Or is there a residue of obligation that survives even when the prospective identity-costs are stripped away?

  **2. The Epistemic Reading**
  A common defense of sunk-cost sensitivity is epistemic: my past expenditure signals that I once judged this project promising, perhaps under better information. But on your view, the force is normative, not evidential. If I have full transparency— I know exactly why I spent the money, and I know the project is now doomed—does the outlay still bind me? If yes, why does the evidential value of the cost matter less than the fact of the outlay itself?

  *   **Follow-up:** If you say the obligation holds even with transparent self-knowledge, are you claiming that the mere fact of past effort creates a reason that competes with future utility? How do you weigh that reason when the future utility is starkly negative?

  **3. The Act/Disposition Gap**
  There is a standard argument that we should cultivate a *disposition* to finish what we start to maintain credibility, even if particular acts of finishing are suboptimal. This justifies the habit, not the specific act. Does your fidelity account justify the individual act of honoring a sunk cost, or only the general disposition? If the former, are you committed to a form of rational irrationality—where the well-functioning agent is moved by considerations she knows, in the moment, to be strictly past-looking?

  *   **Follow-up:** If you grant this is "rational irrationality," how do you reconcile that with the practical goal of your book? Are you recommending people be trained *into* sunk-cost reasoning, or merely that they shouldn't be trained out of it?

  **4. Fidelity Under an Adverse Past**
  Fidelity presupposes a relationship worth maintaining. But what if the initial outlay was made by a self I now repudiate? Suppose I invested in a venture based on manipulated information, or a version of myself that was intoxicated or coerced. Does the fidelity account demand I honor costs incurred by a "past self" whose judgment I now reject? Where is the limit of loyalty to one's own history?

  *   **Follow-up:** If you argue that **[that's just loyalty, not error]**, does this loyalty extend to costs imposed on *others* on my behalf? If my team spent resources I didn't authorize, does their outlay create a fidelity obligation for me, or does the account require personal authorization to trigger the diachronic bond?

  **5. The Impersonal Case**
  The "Concorde fallacy" appears in firms, states, and even animal foraging behavior where no persisting "self" or "identity" exists in the philosophical sense. Organizations escalate commitment to failing projects strongly when the original decision-makers are still in charge, and weakly when they are not. If your account relies on the metaphysics of personal agency over time, why does the phenomenon track so closely in impersonal entities? Are you conceding the organizational cases to forward-looking signaling explanations, and if so, does that concession undercut the claim that the personal case is fundamentally different?

  *   **Follow-up:** If the mechanism in firms is signaling (prospective), but in persons it is fidelity (retrospective), why do the behavioral outputs look identical? Is it a problem for your view if the same behavior admits of two completely different rational reconstructions depending on the substrate?

  **6. Retrospective Value**
  Does finishing the cathedral make the earlier labor *non-wasted*, or does it merely add value going forward? To make the fidelity work, do you need the stronger claim that a later event can alter the normative status of an earlier one—that finishing now retroactively redeems the past expenditure? Are you willing to pay the metaphysical price for backward causation of value, or must you settle for the claim that the past waste remains a waste, but we are obligated to compound it?

  *   **Follow-up:** If the waste remains a waste, isn't the "fidelity" just a preference for throwing good money after bad to avoid the psychological pain of admitting waste? How is that distinct from the irrationality the prospectivist diagnoses?

  **7. A Stipulated Pair**
  I want to test the re-description maneuver directly. Consider two cases. In both, the future costs and benefits of continuing vs. quitting are identical. In Case A, you personally authorized the initial outlay. In Case B, the outlay was externally imposed by a benefactor who has since died, leaving no one to disappoint. There are no identity effects, no reputational effects, and no epistemic signals; the only difference is the source of the sunk cost. Do you continue in A but quit in B?

  *   **Follow-up:** If you say the cases differ, you must specify the difference *without* re-describing the options to include future identity or reputation costs. What is the specific normative force present in A that is absent in B, if not a prospective concern? If you say the cases are the same, does that mean personal authorization adds no rational weight to the sunk cost?

  **8. Predictions**
  Your account makes claims about the structure of agency. What pattern of susceptibility does the fidelity account predict across stakes, delay, and decision-maker age? For instance, should we expect agents with a stronger sense of diachronic identity (perhaps older adults) to be *more* sensitive to sunk costs than those with a weaker sense of temporal continuity? Which of the patterns commonly reported in behavioral economics sit badly with a fidelity-based explanation?

  *   **Follow-up:** If empirical data shows that sunk-cost sensitivity correlates with cognitive load or confusion rather than strength of identity, does that threaten the view that this is a rational fidelity mechanism rather than a heuristic glitch?

  **9. Exposure**
  Finally, a question on risk. Given that you can often re-describe a prospective cost as a fidelity issue, or a fidelity issue as a prospective identity cost, what would count against the account? Is there a specific finding or argument that would make you give it up? Given the ever-available re-description move, can the view be stated so as to risk anything at all?

  *   **Follow-up:** If the answer is that no single case can refute it because the description of the agent's temporal extension is always adjustable, are we discussing a normative theory or a hermeneutic stance that interprets all persistence as rational?

  ***

  **Note on Vulnerability**

  The question she is most likely to handle badly is **Question 7 (The Stipulated Pair)**.

  **Why:** Her entire defensive maneuver relies on "enriching the description" of the options to show that the sunk cost is never truly isolated from future goods (identity, relationships, etc.). Question 7 is designed specifically to strip that maneuver away by fiat ("no identity effects, no reputational effects"). She is forced to choose between:
  1.  Admitting that without the prospective "identity" hook, the sunk cost provides no reason (which collapses her view into prospectivism).
  2.  Insisting there is a difference but struggling to articulate *what* that difference is without smuggling in prospective consequences (which makes the view look mystical or question-begging).

  Philosophers of action often rely on the phenomenology of agency to do heavy lifting; when forced to isolate the normative force from the phenomenological consequences, they often struggle to provide a non-circular justification. If she claims there is a difference but cannot specify it without violating the constraints of the thought experiment, the "fidelity" account risks looking like a label for a bias rather than a rational principle.
