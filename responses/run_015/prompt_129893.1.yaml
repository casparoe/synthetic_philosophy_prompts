  **Q&A Prep Sheet**

  **1. Skeptical Metaphysicians**
  **Obj:** Fiction lacks ontological parity; causation requires energy transfer, not textual coherence.
  **Reply:** I argue for structural isomorphism, not identity. Fiction isolates causal structures without physical noise, functioning as a concrete thought experiment. We test theories against intuitive causal judgments preserved in narrative. If a theory fails to map onto coherent narrative causation, it lacks generality. This allows us to stress-test causal accounts against clean cases. Thus, narrative serves as a controlled environment. (Concedes fiction lacks physical efficacy.)

  **2. Lewisian Counterfactualists**
  **Obj:** Textual implication establishes a similarity metric; the text fixes relevant laws for evaluation.
  **Reply:** Text specifies outcomes, not laws governing deviations. When a plot variable changes, the text is silent on background laws, destroying the similarity metric required for Lewisian evaluation. Fiction lacks modal inertia; there is no fact of the matter about the "closest" deviation. Lewisian worlds require lawful continuity; fiction permits abrupt discontinuities. Consequently, nearest-world semantics fail. (Assumes authors never specify modal laws.)

  **3. Interventionists**
  **Obj:** Does "authorial intervention" satisfy the independence condition? The author isn't exogenous.
  **Reply:** The author stands outside the narrative causal graph, manipulating variables without being determined by them, mirroring the exogenous interventionist requirement. The author is the external manipulator who fixes background conditions while varying the plot. This satisfies the modularity condition essential for causal discovery. It treats the author as an ideal experimenter. (Equates creative intent with stochastic intervention.)

  **4. Skeptical Metaphysicians**
  **Obj:** Using fiction to test causation is circular; you presuppose causal coherence to write the story.
  **Reply:** It is diagnostic, not circular. We test whether intuitive causal judgments in narrative align with formal accounts, exposing where theories diverge from practiced reasoning. It reveals theoretical friction points without claiming fiction generates physical causes. We are testing the logic of causation, not the physics of it. This validates the method as philosophical inquiry. (Concedes data is intuitive, not empirical.)

  **5. Lewisian Counterfactualists**
  **Obj:** What about backtracking counterfactuals? Fiction implies if the effect hadn't occurred, the cause wouldn't have.
  **Reply:** Narrative logic typically forbids backtracking to preserve agency. Interventionism captures this forward-directed manipulation better than symmetric counterfactual dependence. We focus on plot progression where causes precede effects rigidly. Readers reject backtracking because it undermines narrative responsibility. This aligns with interventionist asymmetry. (Ignores retrocausal narratives.)

  **6. Interventionists**
  **Obj:** Where is the mechanism? Woodward requires invariant generalizations; plot points are singular.
  **Reply:** Genre conventions provide the invariant generalizations. The mechanism is the normative expectation of narrative consequence within the established fictional framework. Rules of genre act as laws governing variable relationships. These conventions function as ceteris paribus clauses for narrative events. This secures the required invariance. ("Normative expectation" is not physical mechanism.)

  **7. Literary Scholars (LETHAL)**
  **Obj:** You privilege authorial intent, but narrative causality is constructed by the reader, not the writer.
  **Reply:** [Concede model assumes stable text; reader-response suggests causality is emergent. I must distinguish between composition and reception to save the thesis. This undermines the objective status of the causal claim.] (Lethal: If causality is reader-dependent, "authorial intervention" is illusory, collapsing the interventionist analogy entirely.)
