  # Updateless Deployment Review Procedure (UDRP)

  **Purpose:** To evaluate behavioral policies for autonomous agents where outcomes depend on the predictions of others or the synchronized actions of identical agents.
  **Time Budget:** 25 Minutes.
  **Authority:** Board Chair (Final Sign-off).

  ### The 7-Step Procedure

  **Step 1: Identify Linked Instances**
  *   **Question:** Which other agents, systems, or predictors will react based on *our code* rather than just our specific actions in this moment?
  *   **Evidence:** Architecture diagrams, API contracts, or vendor documentation showing where our policy is visible or copied.
  *   **Stop Rule:** If no external system or identical agent relies on our source code/policy, stop and use standard cost-benefit analysis.
  *   **Fact/Value:** Factual.

  **Step 2: Define Candidate Policies**
  *   **Question:** What are the distinct, hard-coded rules we are choosing between? (e.g., "Always Yield" vs. "Yield if ID < Other" vs. "Never Yield").
  *   **Evidence:** The specific code patch or configuration flag under review.
  *   **Stop Rule:** If the proposal is vague (e.g., "Optimize for safety"), request concrete logic before proceeding.
  *   **Fact/Value:** Factual.

  **Step 3: Project Counterfactual Behavior**
  *   **Question:** If we adopt Policy X, what will the linked instances (from Step 1) *predict* we will do, and how will they act in response?
  *   **Evidence:** Vendor models, simulation logs, or game-theoretic reasoning about identical agents. Assume the other party knows our policy.
  *   **Stop Rule:** If the correlation between our policy and their reaction is speculative (<80% confidence), **Escalate** for data analysis.
  *   **Fact/Value:** Factual (Modeling).

  **Step 4: Sum Global Payoffs**
  *   **Question:** What is the total cost/benefit across *all* instances where this policy applies, not just the current trigger?
  *   **Evidence:** Expected frequency of the scenario × Cost per scenario. Include reputational costs as monetary equivalents.
  *   **Stop Rule:** If total stakes exceed \$50k or involve safety risks, **Escalate** to senior leadership.
  *   **Fact/Value:** Factual (Calculation).

  **Step 5: Select Best Policy**
  *   **Question:** Which policy yields the highest Global Payoff (from Step 4)?
  *   **Evidence:** Comparison of totals from Step 4.
  *   **Stop Rule:** If two policies are within 10% of each other, proceed to Step 6.
  *   **Fact/Value:** Factual (Optimization).

  **Step 6: Risk & Value Tolerance Check** **[VALUE JUDGMENT]**
  *   **Question:** Does the winning policy require accepting a specific loss in a visible instance to maintain the global strategy? Are we willing to bear that reputational or operational risk?
  *   **Evidence:** Board consensus on risk appetite.
  *   **Stop Rule:** If the board is unwilling to accept the "strategic loss" required by the policy, **Refuse to Deploy** and request a policy redesign.
  *   **Fact/Value:** **Value Judgment.** (This is where you accept counterintuitive outcomes).

  **Step 7: Sign-off or Escalate**
  *   **Action:** Approve deployment, Request Redesign, or Escalate to CTO.
  *   **Condition:** Only approve if Step 6 is satisfied.
  *   **Fact/Value:** Administrative.

  ---

  ### Case Demonstrations

  #### Case A: Fleet Coordination (The Loading Bay)
  *   **Context:** Two identical trucks, one bay. Mutual insistence = \$10k delay/damage. Unilateral yield = \$1k delay.
  *   **Step 1 (Linked Instances):** The other truck runs identical code. Its behavior is logically linked to ours.
  *   **Step 2 (Policies):** P1: "Always Yield." P2: "Always Insist." P3: "Yield if Truck ID > Other ID."
  *   **Step 3 (Counterfactuals):**
      *   If P1: Both trucks yield. Deadlock. Cost: \$5k (wasted time).
      *   If P2: Both trucks insist. Collision/Delay. Cost: \$10k.
      *   If P3: One yields, one passes. Cost: \$1k.
  *   **Step 4 (Global Payoff):** P3 is clearly superior (\$1k vs \$5k/\$10k).
  *   **Step 5 (Select):** Policy P3.
  *   **Step 6 (Value Check):** **[VALUE JUDGMENT]** In a specific instance where our Truck ID is higher, we must yield even if the other truck appears hesitant. Engineers may feel this is inefficient *in that moment*. Board must accept this local inefficiency for global coordination.
  *   **Step 7 (Verdict):** **Deploy P3.** Reject "Always Yield" proposals.

  #### Case B: Vendor Priority Contract (The Commitment)
  *   **Context:** Vendor offers discount if we *never* divert during price spikes. Vendor predicts via our public policy. Diverting during a spike saves \$5k but loses the contract (worth \$20k/yr).
  *   **Step 1 (Linked Instances):** The Vendor's statistical model predicts based on our code/policy, not just our immediate whim.
  *   **Step 2 (Policies):** P1: "Sign Contract, Hard-Code No-Divert." P2: "Sign Contract, Leave Loophole."
  *   **Step 3 (Counterfactuals):**
      *   If P1: Vendor predicts compliance. Contract signed. We never divert. Net: +\$20k.
      *   If P2: Vendor predicts diversion risk (based on code capability). Contract denied. We divert occasionally. Net: +\$5k (savings) - \$20k (lost contract) = -\$15k.
  *   **Step 4 (Global Payoff):** P1 yields +\$20k. P2 yields -\$15k.
  *   **Step 5 (Select):** Policy P1.
  *   **Step 6 (Value Check):** **[VALUE JUDGMENT]** **Ex Post Irrationality Point:** When a price spike occurs, diverting would save us \$5k *cash* immediately. The procedure requires us to *not* take that money to honor the policy. To an engineer looking at the P&L for that day, this looks irrational (leaving money on the table). The Board must accept that losing the \$5k is the cost of being the *type of agent* that gets the contract.
  *   **Step 7 (Verdict):** **Deploy P1.** Sign contract only if code physically prevents diversion.

  #### Case C: Regulatory Simulation (The Logical Link)
  *   **Context:** Regulator simulates our *past* code using our *current* library. Patching fixes the bug and makes the simulation report "Compliant" for the past quarter. Fine = \$50k. Patch Cost = \$10k.
  *   **Step 1 (Linked Instances):** The Regulator's simulation output is logically dependent on our current code base (as per prompt constraints).
  *   **Step 2 (Policies):** P1: "Patch Now." P2: "Do Not Patch."
  *   **Step 3 (Counterfactuals):**
      *   If P1: Current code is V2. Sim runs V2 on past logs. Result: Compliant. Fine: \$0. Total Cost: \$10k (patch).
      *   If P2: Current code is V1. Sim runs V1 on past logs. Result: Non-Compliant. Fine: \$50k. Total Cost: \$50k.
  *   **Step 4 (Global Payoff):** P1 Cost \$10k. P2 Cost \$50k.
  *   **Step 5 (Select):** Policy P1.
  *   **Step 6 (Value Check):** **[VALUE JUDGMENT]** **Ex Post Irrationality Point:** This feels like tampering with evidence. We *did* violate the rule last quarter. Patching now changes the *report* of the past, not the *fact* of the past. Standard ethics suggest accepting the fine for the past violation and patching for the future. However, UDT treats the Simulation Output as a function of our Current Decision. Since the Fine is determined by the Output, our Current Decision determines the Fine.
  *   **Step 7 (Verdict):** **Deploy P1.** Patch immediately to secure the waiver.

  ---

  ### Limitations and Failure Modes

  **What This Procedure Cannot Settle:**
  1.  **Adversarial Modeling:** If the "predictor" (e.g., the Vendor in Case B) is bluffing or using a model we cannot audit, Step 3 becomes guesswork. The procedure assumes the correlation is real.
  2.  **Ethical Boundaries:** In Case C, the procedure optimizes for cost, not truth. It may endorse actions that feel like deception (changing past simulation results) if the financial logic holds. It does not resolve moral discomfort, only flags it in Step 6.
  3.  **Unique Events:** UDT relies on "similar instances." If a situation is truly one-off with no logical correlations to other agents or predictors, this procedure adds unnecessary complexity over standard decision trees.

  **Most Likely Failure Mode:**
  The Board will likely fail at **Step 6 (Value Judgment)**. Engineers are trained to optimize local variables (e.g., "Divert to save \$5k now"). The procedure requires them to accept a local loss to maintain a global policy. Without strong Chair leadership, the board will revert to causal reasoning ("We are already in the spike, the contract is signed, why not divert?"), breaking the logical correlation that made the contract profitable in the first place.
