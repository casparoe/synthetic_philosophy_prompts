          *   Core claim: Dreams are not rich, unfolding experiences happening *in* sleep. They are confabulations constructed *at* waking.
          *   Reasoning: The brain doesn't have the resources/bandwidth to render a full sensory world during sleep. The "Orwellian" revision happens upon waking. We tell ourselves a story about what *must* have happened based on fragments.
