answer: |-
  # Exercise Design: The Platonia Seminar

  ## I. Materials and Payoffs

  **Total Stakes:** 100 Course Points (approx. 2% of final grade).
  **Distribution:**
  *   **Round 1:** 50 Points (The Pot).
  *   **Round 2:** 25 Points (The Pot).
  *   **Round 3:** 25 Points (The Pot).

  **Physical Materials:**
  *   18 identical envelopes per round (54 total).
  *   18 "Decision Slips" per round (pre-printed, see below).
  *   18 "Multiplier Cards" for Round 3 (6 marked **1**, 6 marked **2**, 6 marked **3**).
  *   One large collection box placed at the front of the room.
  *   A whiteboard for tallying results.
  *   Coins or phones (students provide their own for randomization).

  **Payoff Table (For Instructor Reference Only):**

  | Round | Condition | Payoff to Student | Fate of Pot |
  | :--- | :--- | :--- | :--- |
  | **1** | Exactly 1 Claim | Claimant: 50 pts | Awarded |
  | | 0 or 2+ Claims | Everyone: 0 pts | Destroyed |
  | **2** | $k$ Claimants | Each Claimant: $25/k$ pts | Divided |
  | | 0 Claimants | Everyone: 0 pts | Destroyed |
  | | Passers | Passers: 0 pts | N/A |
  | **3** | Exactly 1 Claim | Claimant: $25 \times \text{Multiplier}$ pts | Awarded |
  | | 0 or 2+ Claims | Everyone: 0 pts | Destroyed |

  ---

  ## II. Student-Facing Decision Slips

  *Note to Instructor: Print these on distinct colored paper for each round to prevent confusion. Do not staple Multiplier Cards to Round 3 slips; hand them out separately.*

  ### Round 1 Slip (White Paper)
  **SEMINAR DECISION SLIP — ROUND 1**

  **The Setup:** There is a pot of **50 course points**.
  **The Rule:**
  *   If **exactly one** person in this room claims the pot, that person receives all 50 points.
  *   If **no one** claims the pot, or if **two or more** people claim it, the pot is destroyed. Everyone gets 0 points.
  *   If you choose to **pass**, you get 0 points regardless of what others do.

  **Your Decision:**
  [ ] I CLAIM the pot.
  [ ] I PASS on the pot.

  *(Optional Note: You may make this decision by flipping a coin, rolling a die, or using any method of chance you prefer.)*

  **Name:** ___________________ (Required for grade recording, kept confidential)

  ---

  ### Round 2 Slip (Blue Paper)
  **SEMINAR DECISION SLIP — ROUND 2**

  **The Setup:** There is a pot of **25 course points**.
  **The Rule:**
  *   The pot is divided equally among **everyone who claims it**.
  *   If **no one** claims the pot, it is destroyed. Everyone gets 0 points.
  *   If you choose to **pass**, you get 0 points.

  *Example: If 5 people claim, each gets 5 points. If 1 person claims, they get 25 points.*

  **Your Decision:**
  [ ] I CLAIM a share.
  [ ] I PASS.

  **Name:** ___________________

  ---

  ### Round 3 Slip (Yellow Paper)
  **SEMINAR DECISION SLIP — ROUND 3**

  **The Setup:** There is a pot of **25 course points**.
  **Your Multiplier:** You have privately drawn a card with a number (**1**, **2**, or **3**). This number multiplies your personal award *only if you win*.
  **The Rule:**
  *   If **exactly one** person in this room claims the pot, that person receives $25 \times \text{their Multiplier}$ points.
  *   If **no one** claims, or if **two or more** claim, the pot is destroyed. Everyone gets 0 points.
  *   If you **pass**, you get 0 points.

  **Known Facts:** There are 18 students. There are six **1s**, six **2s**, and six **3s** in circulation. You know your own number, but not others'.

  **Your Multiplier:** _______ (Write your number here)

  **Your Decision:**
  [ ] I CLAIM the pot.
  [ ] I PASS.

  **Name:** ___________________

  ---

  ## III. Minute-by-Minute Timeline (90 Minutes)

  **0:00 – 0:05 | Introduction & Stakes**
  *   Hand out Round 1 slips.
  *   **Script:** "We are going to run three decision exercises. Points earned are real and count toward your final grade. Total possible is 100 points. No talking, no signaling, no sharing slips. Decisions are private and simultaneous. When I say 'go,' you decide. When I say 'stop,' seal your slip in the envelope and place it in the box."

  **0:05 – 0:20 | Round 1 (Symmetry)**
  *   Students decide. Encourage use of coins/phones if they seem stuck, but do not suggest odds.
  *   Collect slips.

  **0:20 – 0:30 | Reveal 1 & Transition**
  *   Open envelopes at the front. Count "Claim" slips aloud. Write number on board.
  *   **Script:** "In Round 1, we had [X] claimants. The pot [was awarded / was destroyed]."
  *   Hand out Round 2 slips.

  **0:30 – 0:45 | Round 2 (The Lure)**
  *   Students decide. (This usually takes less time as the incentive is clearer).
  *   Collect slips.

  **0:45 – 0:55 | Reveal 2 & Transition**
  *   Count "Claim" slips aloud. Write number on board. Calculate individual payout if applicable.
  *   **Script:** "In Round 2, we had [X] claimants. Each received [Y] points."
  *   Hand out Round 3 slips AND Multiplier Cards (face down).
  *   **Script:** "Do not look at your card yet. Wait for my signal."

  **0:55 – 1:10 | Round 3 (The Multiplier)**
  *   **Script:** "Turn your cards over. Remember, there are six of each number in the room. You know yours; you do not know others'. Decide."
  *   Collect slips and cards.

  **1:10 – 1:30 | Reveal 3 & Debrief**
  *   Count claimants. Reveal the distribution of multipliers among claimants (e.g., "Three people claimed. Two had 3s, one had a 2.").
  *   **Script:** Begin the debrief (see Section V).

  ---

  ## IV. Staging the Reveal

  **The Count:**
  Do not simply announce the number. Make it a ritual.
  1.  Open the box.
  2.  Separate slips into two piles: **CLAIM** and **PASS**.
  3.  Fan the **CLAIM** pile.
  4.  Count them aloud, slowly. "One... two... three..."
  5.  Write the number largely on the whiteboard next to "Round 1," "Round 2," "Round 3."

  **What a Sensible Student Concludes from a High Count:**
  *   **Round 1:** If count > 1, the "symmetry" assumption failed. People thought they could be the *one*.
  *   **Round 2:** If count is high (e.g., 12), the "lure" worked. Everyone tried to get a share, diluting the value.
  *   **Round 3:** If count > 1, specifically among high multipliers, the "rule" failed. People with **3s** likely all claimed, causing collision.

  **Handling "I will reason that way provided enough others do":**
  During the debrief, a student will argue: *"I would have passed in Round 1 if I knew others would pass."*
  **Response:** "That reasoning requires you to know something you cannot know: their choice. If you assume they are like you, you must assume they are also waiting for you to move. You are stuck in a mirror. The only way out is to act in a way that, if mirrored, produces a good result."

  ---

  ## V. The Debrief Script & Mapping

  *Instructor Note: This is the only time you may use technical vocabulary. Connect the felt experience to the theory.*

  **1. The Symmetry Premise (Round 1)**
  *   **Moment:** The Round 1 count. If it was 0 or >1, the pot was lost.
  *   **Point:** "In Round 1, many of you likely thought, 'I should claim, because if everyone passes, we lose.' But if everyone thinks that, we lose. To win, you needed to assume everyone thinks *exactly* like you. If you are rational, and they are rational, and the situation is identical, you must arrive at the same strategy."
  *   **Vocabulary:** This is the **Symmetry Premise**. If you assume it, you cannot all Claim. You cannot all Pass. You must all do the same *mixed* strategy.
  *   **The Math:** "To maximize the chance of exactly one winner, you each needed to claim with probability $1/18$. Did anyone do that? If not, the symmetry broke because you treated yourself as special."

  **2. Public Randomizer vs. Premise (Round 1)**
  *   **Moment:** The optional note on the slip about coins/dice.
  *   **Point:** "A coin flip is a tool. But flipping a coin doesn't solve the problem unless you believe everyone else is flipping a coin with the same odds. A public randomizer (like me rolling a die to pick a winner) solves the coordination problem. Private randomization only works if you trust the *reasoning* behind the odds."
  *   **Limitation:** "The game cannot force you to trust the symmetry. It relies on you believing the others are running your same mental code."

  **3. Two Readings of the Rule (Round 3)**
  *   **Moment:** The Round 3 count, specifically looking at the multipliers of the claimants.
  *   **Point:** "Round 3 breaks the simple symmetry. You have different numbers.
      *   **Reading A (Same Action):** 'Do what you want everyone to do.' If you want everyone to pass, you pass. But if you have a 3, you want the pot won.
      *   **Reading B (Same Rule):** 'Follow the rule appropriate for your type.' If you have a 3, you claim. If you have a 1, you pass.
      *   **The Crash:** There are six students with a 3. If all six follow Reading B and claim, the pot dies. To win, all six 3s would need to randomize among *themselves* (claim with probability $1/6$). Did the 3s coordinate that? No. You felt the split between 'be noble' and 'be smart for your type.'"

  **4. The Fairness Objection (Round 3)**
  *   **Moment:** A student with a **1** who passed while a **3** claimed (or vice versa).
  *   **Point:** "If you held a 1, did you feel it was fair to pass so a 3 could win? If you held a 3, did you feel entitled to claim over the 1s? This is the **Fairness Objection**. Rational choice often ignores fairness. Hofstadter's dilemma asks you to ignore your specific advantage for the sake of the group logic. That is a very fragile demand."

  **5. What Cannot Be Settled (Instructor Assertion)**
  *   **Assert:** "This game cannot prove which reasoning is 'correct.' It only shows the consequences.
      *   **Causal Decision Theory** says: 'My choice doesn't change theirs. I should claim.'
      *   **Evidential Decision Theory** says: 'My choice is evidence of theirs. If I claim, they likely claim. I should pass/randomize.'
      *   I am asserting that in a one-shot game with no communication, the 'Superrational' path (randomizing) is the only one that respects the symmetry. But it feels unnatural because you are in a room with individuals, not clones."

  ---

  ## VI. Predictable Failure Modes & Limitations

  **1. Joking and Signaling**
  *   **Prediction:** Students will make eye contact, laugh, or say "I'm definitely claiming" as a bluff.
  *   **Mitigation:** Enforce silence strictly. If it happens, note it in the debrief: "Communication breaks the one-shot assumption. You tried to turn this into a negotiation."

  **2. The "Rerun" Assumption**
  *   **Prediction:** Students will assume if the pot is destroyed, you will run it again or give partial credit.
  *   **Mitigation:** State clearly at the start: "These are the only three rounds. Destroyed points are gone." In the debrief, ask: "Who played cautiously because you thought I might save the pot?"

  **3. Point-Gaming (Round 2)**
  *   **Prediction:** In Round 2, students might claim even if the share is tiny, just to deny others points.
  *   **Mitigation:** Acknowledge this in debrief. "Spite is a rational preference if you value relative standing over absolute points."

  **4. The "Superrational" Premise (The Core Limitation)**
  *   **Reality:** The exercise *cannot* reproduce the premise that other players are literally running your reasoning.
  *   **Explanation:** "Hofstadter's definition requires you to believe that because you are rational, and they are rational, you are effectively the same agent. In this room, you are not. You heard each other talk last week. You have different risk tolerances. You know the person next to you is reckless. The 'magic' of superrationality requires a isolation that a seminar room does not have."

  **5. One-Shotness**
  *   **Reality:** You will meet next week.
  *   **Explanation:** "Reputation matters. If you claim everything today, you are 'that person' next week. This makes true one-shot reasoning impossible. You are playing a long game with short-game rules."

  ---

  ## VII. Contingency: If Round 1 Fails Completely

  **Scenario:** 0 claimants or 18 claimants.
  **Instructor Action:** Do not hide the failure. Use it.
  **Script:** "We have a result of [0/18]. This proves the symmetry premise is psychologically difficult. Let's solve the math on the board now."
  **Action:** Write $E = p(1-p)^{17}$. Take the derivative. Show $p=1/18$.
  **Point:** "The math is clear. The execution is human. The gap between the calculation and the action is where the philosophy lives."

  **Scenario:** Students ask "What should we have done?" before Round 2.
  **Instructor Action:** "I cannot tell you. You must decide based on what happened in Round 1." (Maintain the silence on norms).
