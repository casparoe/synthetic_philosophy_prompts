prompt: |-
  I teach an upper-level undergraduate seminar on rational choice: 18 students, one 90-minute meeting, no prerequisites beyond a first course in probability. I want a single in-class exercise that makes the students feel, rather than be told, what is at stake in Hofstadter's Platonia dilemma and the luring lottery, and that then makes them feel how fragile the reasoning behind both of them really is.

  Constraints on the design:

  1. No lecture up front and no vocabulary. Neither the handouts nor the facilitator's script may use "prisoner's dilemma," "superrationality," "evidential," "causal," "equilibrium," or "expected value" until the debrief. Use ordinary words instead: claim, pass, the pot, the draw.

  2. Three rounds, each decided privately and simultaneously, at real but small cost: a pot of course points worth roughly two percent of the final grade, destroyed rather than redistributed if it goes unclaimed.

  Round one, symmetric: one pot, awarded only if exactly one of the eighteen claims; if nobody claims, or if two or more claim, the pot vanishes. The students should be able to reach the answer "claim with probability one-eighteenth, by means of a randomizer" themselves, from the setup alone. You may not print that answer on any handout. If you think they will not reach it, say so and say what to run instead.

  Round two, the shrinking pot: same anonymity, but now the pot is divided equally among everyone who claims, so claiming is never worse than passing for the individual and always worse for the group. I want the students to catch themselves in the lure: the hope of being the one person shrewd enough to claim while everyone else nobly stands aside.

  Round three, the variant I most need your help with: each student privately draws a multiplier (six 1s, six 2s, six 3s) that scales only their own award, and the rule stays as before — the pot exists only if exactly one person claims. Now "do what you would want everyone in your situation to do" comes apart into two readings: the same action for everyone, or the same rule applied to each kind of situation. Design the round so that the group runs into this split on its own, including the problem of what to do when several students share the top multiplier.

  Between rounds I will read out the truthful count of claimants from the previous round, publicly counting the slips without names. Tell me how to stage that reveal, what a sensible student should conclude from a high count, and how the debrief should handle the tempting position "I will reason that way provided enough others do" — why it is unstable rather than merely prudent.

  Please give me: the exact text of each student-facing slip; the payoff table in points; the materials; a minute-by-minute timeline; and a debrief that maps particular moments onto (i) the symmetry premise, (ii) what a public randomizer can and cannot do as a substitute for that premise, if you use one, (iii) the two readings of the rule that diverge once stakes differ, and (iv) the fairness objection that a low-multiplier student is being asked to hand the pot to someone else. Be explicit about which of these the game cannot settle and must simply be asserted by the facilitator. Then tell me what will predictably go wrong the first time I run it — joking, attempts to communicate or pre-commit, students who assume I will rerun a spoiled round, point-gaming — and what the exercise cannot reproduce at all, above all the premise that the other players are literally running your reasoning, and the one-shotness that premise needs, since a seminar is a room of people who have just heard one another talk and who will meet again next week.

  Hofstadter's definition, which the students should not see until the debrief: "Superrational thinkers, by recursive definition, include in their calculations the fact that they are in a group of superrational thinkers."

  Please write your answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested exercise design:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergraduate seminar on rational choice. 18 students. 90 minutes. One meeting. Prereq: Intro probability.
      *   **Goal:** A single in-class exercise to make students *feel* Hofstadter's Platonia dilemma and the luring lottery, and then feel the fragility of the reasoning.
      *   **Constraints:**
          *   No lecture/vocabulary upfront (no "prisoner's dilemma," "superrationality," "equilibrium," etc.). Use ordinary words.
          *   Three rounds. Real cost (course points, ~2% total). Pot destroyed if unclaimed/overclaimed (in specific ways).
          *   Round 1: Symmetric. Pot awarded *only* if exactly one claims. (Goal: Students derive $p=1/18$).
          *   Round 2: Shrinking Pot (Luring Lottery). Pot divided among claimants. Claiming is dominant for individual, bad for group.
          *   Round 3: Multiplier Variant. Private draw (1, 2, or 3). Pot exists only if exactly one claims. Multiplier scales individual award. (Goal: Expose split in "do what you want everyone to do" - same action vs. same rule).
          *   Reveal: Truthful count of claimants between rounds.
          *   Deliverables: Student slips, payoff table, materials, timeline, debrief script/notes, prediction of failure modes, limitations of the exercise.
          *   Tone: American English.

  2.  **Deconstruct the Rounds & Logic:**

      *   **Round 1 (The Platonia Dilemma):**
          *   *Mechanism:* $N=18$. Pot $V$. Win if $k=1$ claimant. Lose if $k=0$ or $k>1$.
          *   *Logic:* If everyone thinks alike (symmetry), everyone uses probability $p$. Expected value for individual is $V \cdot p \cdot (1-p)^{N-1}$. Maximize this wrt $p$. Derivative gives $p = 1/N$.
          *   *Challenge:* Will students actually derive this in class without hints?
          *   *Mitigation:* The prompt asks me to say if they won't reach it. Given they have prob prereqs, maximizing $x(1-x)^{17}$ is calculus 101, but *realizing* they need to randomize is the leap. I need to structure the slip to encourage thinking about "chance" without telling them.
          *   *Refinement:* To ensure they *can* reach it, the slip needs to emphasize the symmetry ("Everyone gets the same slip," "No communication").

      *   **Round 2 (The Luring Lottery/Tragedy of the Commons):**
          *   *Mechanism:* Pot $V$. If $k$ claim, each gets $V/k$. If $k=0$, pot destroyed.
          *   *Logic:* Dominant strategy is to claim. If others don't, you get $V$. If others do, you get share. Passing yields 0.
          *   *Goal:* Show the tension between individual rationality (claim) and group outcome (dilution).
          *   *Constraint Check:* The prompt says "pot is divided equally among everyone who claims... claiming is never worse than passing." This is a standard public goods/congestion game.

      *   **Round 3 (The Multiplier/Hofstadter's Twist):**
          *   *Mechanism:* Private multiplier $m \in \{1, 2, 3\}$. Pot $V$. Win if exactly one claims. Winner gets $V \cdot m$.
          *   *Logic:* This is the crux.
              *   *Reading A (Action):* "Do what you want everyone to do." If I want everyone to pass, I pass. But if I have a 3, I want the person with the 3 to claim.
              *   *Reading B (Rule):* "Follow the rule appropriate for your type." If you have a 3, claim. If you have a 1, pass.
              *   *Conflict:* If everyone with a 3 claims, $k$ might be $>1$ (since there are six 3s). The pot vanishes.
              *   *Goal:* Students feel the breakdown of "superrationality" when types differ. Who should claim? The highest multiplier? But there are six of them. Do they randomize among the 3s?
          *   *Design:* Need to make sure the distribution (6 of each) is known, but individual draws are private.

  3.  **Drafting the Materials:**

      *   *Slips:* Need to be clear, neutral, and enforce the constraints.
      *   *Payoffs:* Needs to be meaningful but not grade-destroying. 2% of final grade total across all rounds. Let's say 100 points = 2%. Round 1: 40 pts. Round 2: 30 pts. Round 3: 30 pts. Or simpler: Total pot 100 points.
      *   *Materials:* Envelopes, slips, randomization devices (dice/coins/phones), box for collection.

  4.  **Timeline (90 Minutes):**

      *   0-10: Setup & Round 1 Instructions.
      *   10-25: Round 1 Decision & Collection.
      *   25-35: Reveal R1 & Transition.
      *   35-50: Round 2 Instructions & Decision.
      *   50-60: Reveal R2 & Transition.
      *   60-75: Round 3 Instructions, Draw, Decision.
      *   75-90: Reveal R3 & Debrief.
      *   *Critique:* This is tight. 90 minutes allows for about 20 mins per round including debrief. I need to be strict on timing.

  5.  **Addressing Specific Prompt Requirements:**

      *   *Reveal:* How to stage it? Public count.
      *   *Debrief:* Map moments to (i) symmetry, (ii) public randomizer, (iii) two readings of the rule, (iv) fairness objection.
      *   *Failure Modes:* Joking, communication, expecting reruns, point gaming.
      *   *Limitations:* One-shotness, literal mind-reading premise.

  6.  **Developing Round 3 (The Hard Part):**

      *   *Problem:* If six people have a '3', and they all follow the rule "If 3, Claim", the pot dies (6 claimants).
      *   *Solution:* They need to realize that "Same Rule" means "If 3, Claim with probability $1/6$".
      *   *Tension:* A student with a '1' might feel it's unfair to pass while a '3' claims. But if all '3's claim, everyone loses.
      *   *Slip Design:* Must clearly state the distribution (6 of each) and the privacy.

  7.  **Refining the "No Vocabulary" Constraint:**

      *   Instead of "Nash Equilibrium," use "stable outcome."
      *   Instead of "Superrationality," use "thinking alike."
      *   Instead of "Expected Value," use "average payoff."
      *   *Crucial:* The slips cannot contain the solution. They must pose the problem.

  8.  **Addressing the "Will they reach it?" concern for Round 1:**

      *   *Risk:* Students might just all claim or all pass.
      *   *Mitigation:* The prompt asks me to say if I think they won't reach it.
      *   *Assessment:* Upper-level undergrads with prob prereqs *should* be able to maximize $p(1-p)^{17}$. However, the leap to *coordinated randomization* without communication is the Hofstadter leap.
      *   *Decision:* I will design the slip to hint at "chance" without giving the number. I will add a note to the instructor: If they fail completely (0 or 18 claimants), use the debrief to walk through the math. I won't change the round, but I will warn about the likelihood of failure being part of the lesson.
      *   *Actually:* The prompt says "If you think they will not reach it, say so and say what to run instead."
      *   *Honest Assessment:* In a 90-minute seminar with no lecture, expecting 18 students to independently derive mixed strategy Nash equilibrium logic (even if framed as superrationality) in 15 minutes is optimistic. *However*, the prompt requires this round. I will structure the slip to guide the calculation (ask them to write down their probability). I will advise the instructor that if they don't get it, the *failure* is the data point for the debrief. I won't suggest a different round because the prompt requires Round 1 to be this specific setup. I will instead advise on how to scaffold the *thinking* on the slip without giving the answer.
      *   *Wait, re-reading constraint:* "The students should be able to reach the answer... You may not print that answer... If you think they will not reach it, say so and say what to run instead."
      *   *My Verdict:* They likely won't derive $1/18$ spontaneously without a hint toward randomization. I will add a specific line to the Round 1 slip: "You may decide to claim, pass, or decide by chance." This opens the door without walking them through it. I will note in the instructor guide that if they don't hit it, the debrief must explicitly solve the calculus on the board.

  9.  **Developing the Debrief:**

      *   Need to connect the felt experience to the theory.
      *   (i) Symmetry: Round 1.
      *   (ii) Randomizer: Round 1 (why dice/coins matter).
      *   (iii) Two Readings: Round 3 (Action vs. Rule).
      *   (iv) Fairness: Round 3 (Low multiplier vs. High).
      *   Limitations: Real life isn't one-shot; we know each other.

  10. **Final Review against Constraints:**

      *   American English? Yes.
      *   No forbidden words in slips/script? (Check: Prisoner's dilemma, superrationality, evidential, causal, equilibrium, expected value).
      *   3 Rounds? Yes.
      *   Point costs? Yes.
      *   Reveal mechanism? Yes.
      *   Failure modes? Yes.

  11. **Drafting the Content (Iterative refinement):**

      *   *Slips:* Keep them uniform.
      *   *Payoff:* Let's use "Course Points." Total 100. R1: 50 (High stakes for the hard problem). R2: 25. R3: 25.
      *   *Round 3 Distribution:* 6 ones, 6 twos, 6 threes. Total 18.
      *   *Reveal:* Instructor counts slips aloud. "Claim" vs "Pass".
      *   *Debrief:* Needs to be punchy.

      *(Self-Correction on Round 1)*: If I ask them to calculate probability on the slip, it forces the math. "What is the chance you should claim?" might be too leading. Better: "Describe how you made your decision." No, that's too vague. Let's try: "If you chose to use chance, what odds did you use?" This implies chance is an option.

      *(Self-Correction on Round 3)*: The prompt asks for the split between "same action" and "same rule." If all 3s claim, pot dies. If one 3 claims, pot won. How do they coordinate? They can't. That's the point. The "Superrational" move is for all 3s to randomize with $p=1/6$. But do the 1s and 2s pass? Yes. The friction is: Does a 1 feel obligated to pass so a 3 can win? Or does the 3 feel obligated to pass to avoid collision with other 3s?

      *(Refining the "Fragility")*: The prompt wants them to feel how fragile the reasoning is. The reveal of the counts is crucial here. If Round 1 has 5 claimants, the "symmetry" broke. If Round 3 has 4 claimants (all 3s), the "rule" broke.

      *(Instructor Script)*: Must be careful not to slip up and say "Nash Equilibrium."

      *(Limitations)*: The prompt specifically asks about the "premise that the other players are literally running your reasoning." This is the core of Hofstadter. I need to make sure the debrief highlights that in a real room, they *aren't* running my code, they are running their own.

  12. **Final Polish:** Check word counts, clarity, and tone. Ensure the "American English" requirement is met (e.g., "randomizer" vs "randomiser", "color" vs "colour" - though not likely to come up). Ensure the forbidden words are strictly absent from student-facing materials.

      *Wait, one constraint check:* "No lecture up front and no vocabulary... until the debrief."
      *Okay, I can use the words in the debrief section of the response, just not in the student slips or the facilitator script during the game.*

      *Payoff Table:* Needs to be clear.
      *Timeline:* Needs to be realistic. 90 mins is short for 3 rounds + debrief. I need to be aggressive on timing.

