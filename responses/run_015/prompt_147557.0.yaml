answer: |-
  Thank you for constructing such a vivid case. It cuts directly to the tension between epistemic updating and practical decision rules, which is precisely where I believe many of your colleagues in this seminar have gone astray.

  Let me first correct a misconception regarding the paralysis you anticipate. You suggest that applying maximin leaves you frozen because the "worst cases" across theories are incommensurable—one is a deontological catastrophe, another a prioritarian failure. But my proposal is not a lexical maximin where any non-zero credence in a theory grants it veto power. That would indeed be paralyzing, and it would treat normative theories as stubborn stakeholders rather than hypotheses about the truth.

  I defend a *weighted* maximin rule. We assess the worst-case moral loss associated with each available action *under each theory*, scale those losses by our credence in the theories, and then select the action that minimizes the maximum weighted loss. In your trolley case, you must ask: Is the weighted moral cost of violating the deontological constraint (55% credence × catastrophic violation) greater than the weighted moral cost of allowing five deaths (30% credence × serious harm)? The rule does not paralyze; it forces a comparison of risks, weighted by evidence. It demands you determine which error is *more unacceptable* when adjusted for how likely you think each theory is to be true.

  Now, to your sharper point: dynamic revision. You ask whether recognizing that deontology struggles with emergency numbers should update your credences, and if so, whether this collapses us into Maximizing Expected Choice-worthiness (MEC).

  Here is the distinction you are missing. There is the *epistemic* process of refining your credences via reflective equilibrium, and there is the *practical* rule for choosing under remaining uncertainty. My framework does not lock your credences. If you realize your 55% credence in rigid deontology is unsustainable given the intuition that numbers matter, you ought to lower that credence. Update away! But even after updating, say to 40% deontology and 45% prioritarianism, you remain under moral uncertainty. You are not certain.

  Why not switch to MEC once you've updated? Because MEC assumes a linearity of moral value that is unwarranted. It assumes that a 10% chance of a deontological violation can be "offset" by a 90% chance of prioritarian gain, as if moral truth were a commodity to be averaged. But if the deontological constraint is agent-relative and strict, its violation may constitute a kind of moral ruin that cannot be compensated by aggregate good, regardless of probability. Expected value reasoning smooths over these structural cliffs. Weighted maximin respects the possibility that some moral errors are discontinuous. We update credences based on evidence, yes, but we do not update our *risk attitude* toward moral error to match a gambling model.

  This brings me to why I reject the parliamentary analogy, which I suspect lurks behind your worry about "static weights." In the parliamentary model, theories are like legislators; you give them seats based on credence, and they vote. This implies a democratic compromise, where theories bargain. I reject this. Your credences are not voting power; they are evidential weights indicating likelihood of truth. We are not negotiating a treaty between Deontology and Prioritarianism; we are trying to avoid acting falsely in a world where we are unsure of the moral laws. The weighted maximin rule is not a compromise; it is a risk-management strategy for truth-tracking.

  So, to answer your final challenge: No, allowing dynamic revision does not collapse the view into MEC. You can update your credences as much as the evidence demands, but so long as significant uncertainty remains, the non-linear risk profile of moral error dictates a maximin approach over an expected-value approach.

  However, I am curious about your intuition regarding the "catastrophe." You assume the deontological worst-case is inherently heavier than the prioritarian worst-case. If you were to update your credences based on the emergency context, would you also adjust the *magnitude* of the loss you assign to the deontological violation in that specific context, or do you hold that the constraint's severity is context-invariant? How do you separate the updating of theory-probability from the updating of theory-content?
