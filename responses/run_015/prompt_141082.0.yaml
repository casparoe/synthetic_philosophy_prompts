      *   Round 3: 20 mins.
      *   Debrief: 20 mins.
      *   *Correction:* Scoring takes time. Need to streamline scoring. Pre-print scoring sheets.

  7.  **Predicting Failure Modes:**

      *   *Collusion:* Students talking across roles. *Fix:* Physical separation + strict "no talking" rule enforced by token penalties.
      *   *Gaming the Sample:* Writer asks Operator "What do you want?" *Fix:* Writer only sees past cards, not the Operator.
      *   *Scoring Drag:* Counting tokens takes forever. *Fix:* Self-reporting verified by instructor spot-checks, or simple binary scoring (Win/Loss per round). Let's go with binary Win/Loss per role per round to save time.
      *   *The "Be Clearer" Objection:* Addressed by showing the Writer *did* predict correctly, but the world changed (Round 2) or the rule was insufficient (Round 1).

  8.  **Limitations of the Simulation:**

      *   Scale/Speed: Real AI optimizes millions of times faster.
      *   Stakes: These are tokens, not lives.
