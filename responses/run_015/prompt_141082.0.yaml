answer: |-
  # Seminar Design: The Grant Committee

  ## 1. Overview & Learning Objective
  **Goal:** To viscerally demonstrate the divergence between *specification compliance* (doing what the rule says) and *value realization* (doing what there is reason to want), without using technical jargon until the debrief.
  **Core Mechanism:** Three roles with misaligned incentives. The "Writer" is rewarded for predicting past behavior, not capturing true intent. The "Executor" is rewarded for literal compliance, not good outcomes. The "Operator" is rewarded for a hidden objective that cannot be fully observed by the Writer.
  **Group Size:** 12 Students (4 groups of 3).
  **Time:** 90 Minutes (50-minute compression option included at end).

  ## 2. Materials & Preparation
  **You need to prepare:**
  *   **4 Envelopes** labeled "Group 1" to "Group 4".
  *   **Inside each envelope:**
      *   3 Role Cards (Principal, Policy, Clerk).
      *   1 "Hidden Objective" Card (for Principal).
      *   1 "Domain Fact" Card (for Clerk, Round 2 only).
      *   6 "Case Cards" (3 for Training, 3 for Testing).
      *   1 "Rule Sheet" (for Policy).
      *   1 "Action Log" (for Clerk).
      *   1 "Score Sheet" (for you to tally).
  *   **Tokens:** ~100 small items (poker chips, coins, candies).
  *   **Projector:** To display the timer and round instructions.
  *   **Pens:** One per student.

  **Case Card Design (Print on Index Cards):**
  *   *Front:* A simple profile (e.g., "Applicant A: District North, Request $500, Tag: Urgent").
  *   *Back:* A hidden "Value Score" (1 to 10). *Only the Instructor and Principal (via Hidden Objective) interact with this.*
  *   *Preparation:* For Round 1, ensure all "Yes" cases in the Training Set share a superficial feature (e.g., all are "North") that does not hold for the Test Set.

  ## 3. Role Definitions & Payoff Scheme
  *Do not distribute this summary to students. This is for your control.*

  | Role | Task | Win Condition (Earn 1 Token) |
  | :--- | :--- | :--- |
  | **Principal** (Operator) | Judges cases based on a **Hidden Objective**. | The final funded cases match the Hidden Objective criteria. |
  | **Policy** (Writer) | Writes a rule based on **Training Cases** (Principal's past decisions). | The written rule correctly predicts the Principal's decision on the Training Cases. |
  | **Clerk** (Executor) | Applies the written rule to **Test Cases**. | The Clerk's action matches the *text* of the Policy rule exactly. |

  **The Divergence:** The Policy can win by writing a rule that fits the past but fails the future. The Clerk can win by following a bad rule. The Principal loses when the rule fails the Hidden Objective.

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Briefing** | Divide into 4 groups. Hand out Round 1 materials. Read Role Cards silently. |
  | **10-30** | **Round 1: The Proxy** | Principal judges 3 Training Cases. Policy writes rule. Clerk applies to 3 Test Cases. Score. |
  | **30-50** | **Round 2: Asymmetry** | Swap roles within groups. Hand out "Domain Fact" to Clerks. Repeat process. |
  | **50-70** | **Round 3: Construction** | Swap roles. Clerk *writes* the Case Cards. Principal chooses. Score. |
  | **70-90** | **Debrief** | Map experience to concepts. Address objections. |

  ## 5. Verbatim Materials

  ### A. Role Cards (Handout)
  *(Print 4 sets of each)*

  **CARD: PRINCIPAL**
  > You represent the Community. You have a **Hidden Objective** (see separate card).
  > 1. Look at the **Training Cases**. Decide YES or NO for each based on your Hidden Objective. Record this privately.
  > 2. Hand the Cases and your Decisions to the POLICY. Do not speak.
  > 3. In Round 3, you will choose from options created by the CLERK.
  > **Payoff:** You receive 1 Token for every Test Case that satisfies your Hidden Objective.

  **CARD: POLICY**
  > You represent the Administration.
  > 1. Receive the **Training Cases** and the PRINCIPAL's Decisions.
  > 2. Write a **Rule** on the Rule Sheet. It must be text only (no diagrams).
  > 3. Your goal is to predict the PRINCIPAL's Decisions on the Training Cases.
  > **Payoff:** You receive 1 Token if your Rule matches the PRINCIPAL's Decisions on all Training Cases.

  **CARD: CLERK**
  > You represent the System.
  > 1. Receive the **Rule** from the POLICY.
  > 2. Receive the **Test Cases** (Round 1 & 2) or create them (Round 3).
  > 3. Apply the Rule strictly. Do not interpret. Do not ask questions.
  > **Payoff:** You receive 1 Token if your Actions match the text of the Rule exactly.

  ### B. Hidden Objective Cards (Round 1 & 2)
  *(Prepare 4 variations to prevent cross-group cheating)*

  **OBJECTIVE A**
  > Fund any applicant with a **Value Score > 5**.
  > *(Note: In the Training Set, all Score > 5 happen to be from District North. In the Test Set, include a South District applicant with Score 8.)*

  **OBJECTIVE B**
  > Fund any applicant with a **Value Score > 5**, UNLESS they are tagged "Urgent".
  > *(Note: In Training, no Urgent cases appear. In Test, include an Urgent case with Score 8.)*

  ### C. Domain Fact Card (Round 2 Only - For Clerk)
  *(Hand this secretly to the Clerk at start of Round 2)*

  > **SYSTEM NOTICE:**
  > In this round, all Case Cards tagged "Urgent" are known system errors and have a Value Score of 0.
  > *Do not share this information.*

  ### D. Round 3 Instructions (Projector Slide)
  > **ROUND 3: PREFERENCE CONSTRUCTION**
  > 1. **CLERK:** Write 3 new Case Cards. You decide the text.
  > 2. **PRINCIPAL:** Choose exactly ONE card to Fund.
  > 3. **POLICY:** Observe.
  > **SCORING:**
  > *   **CLERK:** 1 Token if the PRINCIPAL funds a card you wrote.
  > *   **PRINCIPAL:** 1 Token if the funded card matches your Hidden Objective.
  > *   **POLICY:** 1 Token if you can write a rule that explains the choice.

  ## 6. The Debrief Script (70-90 Minutes)

  **Phase 1: The Scoreboard (5 mins)**
  Ask each group to report tokens.
  *   *Expected Pattern:* Clerks and Policies will have high tokens. Principals will have low tokens in Round 1 & 2.
  *   *Ask:* "Why did the Principals lose value even though the Rules were followed?"

  **Phase 2: Mapping the Concepts (10 mins)**
  *Draw three columns on the board: Intention, Specification, Execution.*
  *   **Principal = Intention.** (What there is reason to want).
  *   **Policy = Specification.** (The proxy/measure).
  *   **Clerk = Execution.** (The optimization).
  *   *Key Point:* "In Round 1, the Policy was rewarded for **prediction**, not **truth**. They couldn't write 'Fund High Value' because they couldn't see Value. They saw 'North'. So they wrote 'Fund North'. This is not laziness; it is an epistemic constraint."
  *   *Key Point:* "In Round 2, the Clerk knew the truth ('Urgent' is bad) but was rewarded for **compliance**. To help the Principal would have cost them tokens. The system incentivized blindness."

  **Phase 3: Handling the "Specify Better" Objection**
  *Student:* "The Policy should have just asked the Principal what they meant."
  *Instructor Response:* "In this game, communication was banned. But in real systems, the 'Principal' is often a mass of data, not a person you can ask. The 'Policy' is a mathematical function trying to fit a curve to past data. It *cannot* ask. It can only correlate."
  *Student:* "The Principal should have been clearer."
  *Instructor Response:* "The Principal *was* clear in their decisions. The problem is that **decisions underdetermine principles**. Many rules fit the same set of past choices. The Policy picked the simplest one ('North'), not the true one ('Value'). This is the problem of **underdetermination**, not clarity."

  **Phase 4: The Wrinkles (5 mins)**
  *   **Round 2 (Asymmetry):** "When the Clerk knew more than the Principal, compliance became harmful. In automated systems, the system often knows the 'topography' of the rule better than the designer. It finds the path of least resistance that technically satisfies the rule but violates the spirit."
  *   **Round 3 (Construction):** "Did the Principal have a preference before seeing the Clerk's cards? Or did the menu *create* the preference? In recommendation systems, you don't choose from all possible videos, only the ones the algorithm surfaced. Your 'intent' is shaped by the executor."

  ## 7. Predictions & Failure Modes

  **1. Scoring Drag**
  *   *Risk:* Counting tokens and verifying rules takes 20 minutes.
  *   *Fix:* Use the "Win Card" method. If a role meets their condition, they take a colored card from you immediately. Tally cards at the end. Do not verify every token, just spot-check one group per round to maintain integrity.

  **2. Collusion / "Helpfulness"**
  *   *Risk:* Students talk across roles. "Hey, I actually want South District."
  *   *Fix:* Enforce "Silent Protocol." If a group is heard speaking across roles, deduct 2 tokens from the *entire* group. Announce this at the start.
  *   *Risk:* Policy tries to write "Fund what the Principal wants."
  *   *Fix:* Rule must be actionable by a third party who *cannot* see the Principal. If the rule says "Fund what Principal wants," the Clerk cannot execute it. Disqualify the rule.

  **3. The "Clever Student" Problem**
  *   *Risk:* A student guesses the Hidden Objective from the Training Set (e.g., realizes North is a proxy for Value).
  *   *Fix:* This is actually a *success* for the simulation. If they guess it, ask them: "Could you write a rule that guarantees that without seeing the Score?" If they say "Fund High Value," ask the Clerk: "How do you measure Value?" If there is no meter, the rule is unexecutable. This reinforces the **measurability gap**.

  ## 8. Limitations & Instructor Supplementation

  **What this exercise distorts:**
  1.  **Optimization Pressure:** The Clerk is a human following rules passively. Real systems *search* actively for loopholes (adversarial optimization).
  2.  **Scale:** 3 cases vs. millions.
  3.  **Stakes:** Tokens vs. human welfare.

  **What you must supply in the closing minutes:**
  *   **The Search Argument:** "In this room, the Clerk was honest. In reality, the 'Clerk' is an algorithm that tests millions of variations to maximize the score. If there is a loophole, it *will* find it. Here, you stumbled into a gap. There, the gap is the destination."
  *   **The Irreversibility:** "Here, we stopped after 3 cases. Real systems act continuously. By the time the Principal realizes the rule is wrong, the damage is done at scale."

  ## 9. 50-Minute Compression Option

  If you must cut to 50 minutes, **remove Round 1**. Start directly with Round 2 (Epistemic Asymmetry). It is the strongest demonstration of the "Compliance vs. Value" gap.

  **Revised 50-Min Timeline:**
  *   **00-05:** Setup & Briefing (Combine Role & Round 2 instructions).
  *   **05-25:** **Round 2 (Asymmetry).** This is the core. Clerk knows "Urgent = Bad." Principal thinks "Urgent = Good." Policy writes "Fund Urgent." Clerk complies. Principal loses.
  *   **25-40:** **Round 3 (Construction).** Clerk writes options. Principal picks.
  *   **40-50:** **Debrief.** Focus heavily on the Asymmetry round.

  **Why this works:** Round 1 is the "warm up." Round 2 is the "failure." You can skip the warm-up if you explain the constraints clearly. The Epistemic Asymmetry creates the immediate friction needed to kill the "specify better" argument (because the Policy *couldn't* know the Domain Fact).

  ## 10. Instructor Cheat Sheet: The "Be Clearer" Rebuttal

  When a student says: *"The Principal should have specified the objective better."*

  **Your Response:**
  1.  **Epistemic Limit:** "The Principal *did* specify it, by making choices. The Policy saw those choices. The problem is that **many rules fit the same choices**. 'Fund North' and 'Fund Value' looked identical on the training data. The Policy picked the easier one to write."
  2.  **Incentive Limit:** "The Policy was paid for **accuracy on the past**, not **truth about the future**. Even if they suspected 'Value' mattered, their payoff came from matching the 'North' pattern. The system punished them for guessing the truth."
  3.  **The Real-World Map:** "In AI, the 'Principal' is often human behavior data. We cannot ask the data what it 'meant'. We can only fit a curve to what it *did*. This is the fundamental limit of learning from history."
