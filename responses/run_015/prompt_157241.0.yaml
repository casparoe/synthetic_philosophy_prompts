answer: |-
  **Project Title:** Binding Bets: The Moral Force of Stochastic Promises
  **Applicant:** [Your Name]
  **Duration:** 3 Months (Part-time)
  **Deliverable:** 5,000-word paper and presentation

  **Project Summary**
  Standard philosophical models of promising assume a fixed cost of performance at the time of the undertaking (e.g., "I promise to drive you to the airport"). This project investigates a neglected class of undertakings I term "lottery promises," where the cost of performance is drawn from a known probability distribution at the time of promising, but revealed only later (e.g., "I promise to cover your business losses," or marriage vows "for worse"). The core question is normative: Does the moral force of the promise vary with the realised cost (the "draw"), even when the risk distribution was transparent ex ante?

  There is a tension here. Functionally, promising acts as a commitment device; if obligation dissolves when the cost is high, the device fails to support reliance. Yet, ex post moral and legal intuitions are highly sensitive to realised cost, often releasing promisors from ruinous obligations even when the risk was known. This project tests whether this sensitivity is a defensible normative feature or an artefact of outcome bias.

  **The Philosophical Landscape**
  The project will stress-test four dominant families of promissory theory against the lottery promise case:
  1.  **Practice/Convention Views:** Obligation arises from participating in a social rule. (Does the rule have a cost threshold?)
  2.  **Expectation/Reliance Views:** Obligation arises from induced reliance. (Does reliance vary with the promisor's cost?)
  3.  **Normative Power Views:** Obligation arises from the transfer of a right. (Can one transfer a right to ruin?)
  4.  **No Special Duty Views:** Obligation is reducible to general duties not to harm or mislead.

  The "lottery promise" bites hardest on Practice and Normative Power views, which struggle to explain why a valid transfer of rights or rule-following should dissolve due to cost magnitude. Reliance views may shrug it off if reliance is constant, but this conflicts with the intuition that ruinous cost matters. The project will determine which account, if any, can accommodate the intuition that some risks are permissible to promise while others are not, without collapsing into general cost-benefit analysis.

  **Methodology**
  Rather than deriving obligation from first principles or conducting empirical surveys, I will employ a **parameterised case grid**. This involves constructing a matrix of vignettes varying specific parameters: transparency of the risk distribution, magnitude of the realised cost, fixity of the promisee's reliance, availability of insurance, and the nature of the relationship.

  I will then mechanically derive verdicts from each of the four theoretical families for each cell in the grid.
  *   **Why not derivation?** Pure conceptual analysis often smuggles in unexamined intuitions. The grid forces theories to commit to specific verdicts in edge cases.
  *   **Why not surveys?** Questionnaires measure psychological intuitions (what people *feel*), not normative justification (what is *true*). Since the hypothesis involves "outcome bias," measuring that bias empirically does not tell us whether the bias is morally defensible.
  *   **Why this method?** It treats ethical theories like ecological models: testing their stability under varying parameter loads. This leverages my background in modelling while remaining philosophically rigorous.

  **Outcomes and Failure Conditions**
  A successful result will identify which theoretical family best tracks our considered judgments about stochastic costs, or demonstrate that our judgments are inconsistent. A deflationary result is acceptable: showing that "promissory obligation" dissolves into general risk-management duties in these cases.

  I identify three specific failure modes:
  1.  **Tunability:** Every theory possesses a free parameter (e.g., "reasonable cost") that can be tuned to match any verdict, rendering the grid non-discriminating.
  2.  **Category Collapse:** The distinction between "known risk" and "changed circumstances" proves unstable, reducing the project to existing literature on frustration of purpose.
  3.  **Triviality:** The grid reveals that the answer is obviously "no obligation at ruinous cost," making the theoretical testing redundant.

  **Work Plan**
  *   **Month 1:** Finalise the parameterised grid and conduct a targeted review of literature regarding risk, luck, and promissory thresholds. (Deliverable: Annotated grid).
  *   **Month 2:** Run the theoretical stress tests. Map each family of views against the grid cells to identify contradictions or gaps. (Deliverable: Analytical notes).
  *   **Month 3:** Draft the 5,000-word paper, refine the argument, and prepare the presentation for the reading group. (Deliverable: Final Paper).

  **Novelty and Contribution**
  This is not a rehash of the standard debate on whether promises bind. That debate assumes a static world. By introducing stochastic costs where the *distribution* is known but the *outcome* is not, this project bridges the gap between signalling theory (ex ante commitment) and moral luck (ex post evaluation). It asks whether the "bindingness" of a promise is a property of the act or the outcome. Current literature largely treats cost as a defeasibility condition external to the promise; this project argues cost distribution is internal to the promise's structure.

  **Note on Background**
  I am a retired population ecologist, not a professional philosopher. My expertise lies in modelling stochastic systems and signalling theory, not in the history of ethics. I have read widely in the philosophy of promising but may lack the granular familiarity with recent journal debates that a career philosopher would possess. I view this as a strength: I am applying a modelling mindset to normative structures, looking for structural instabilities rather than exegetical fidelity. I welcome correction on the philosophical framing, provided the core logical tension regarding stochastic costs is addressed.
