  4.  **Analyzing Disanalogies by Function:**

      *   *Prediction:* Does "belief" help predict?
          *   Firm: Yes, hard to simulate every employee.
          *   Model: Maybe, but Design Stance (weights/arch) is often *more* precise for engineering, while Intentional is better for *clinical* intuition.
          *   *Disanalogy:* Model behavior is deterministic (mostly) given seed/weights, firm behavior is emergent chaos.
      *   *Explanation/Fix:*
          *   Firm: "Culture of risk" -> Change incentives.
          *   Model: "Model thought X" -> Fine-tune? Prompt engineering?
          *   *Disanalogy:* You can't retrain a firm like you fine-tune a model. You can't inspect a firm's "weights" like you can a model's (sometimes). Actually, models are *more* inspectable technically but *less* semantically transparent.
      *   *Responsibility:*
