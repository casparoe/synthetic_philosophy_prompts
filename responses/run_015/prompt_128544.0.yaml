          *   *Disanalogy:* Critical. This is where the Compliance Reviewer is right.

  5.  **Addressing Point 1 (Stance):**

      *   Intentional vs. Design vs. Physical.
      *   For Firms: We *must* use Intentional. We can't simulate the physics of employees.
      *   For Models: We *can* use Design (weights, architecture). Circuit-level (mechanistic interpretability) is emerging.
      *   *Verdict:* Intentional stance is a *heuristic* for models, not a necessity. It risks obscuring the Design facts.

  6.  **Addressing Point 2 (Non-reducibility):**

      *   Firm: Group belief $\neq$ Sum of employee beliefs. (Emergent).
      *   Model: Output $\neq$ Single neuron activity.
      *   *The Catch:* Corporate beliefs are grounded in *procedures* that bind humans. Model "beliefs" are statistical correlations.
      *   *Grounding:* Searle's Chinese Room vibes. The model has syntax, not semantics. The corporation has semantics because the humans inside do.
      *   *Verdict:* Non-reducibility in firms implies *functional organization of agents*. In models, it implies *distributed representation*. The former grounds responsibility; the latter does not.

