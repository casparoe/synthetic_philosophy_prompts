          *   *Compliance Reviewer (Anti-Analogy):* Corporations have anchors (resolutions, legal personhood, liability). Model attributions shift blame from humans to artifacts.
          *   *User's Wrinkle:* Firms persist; models are ephemeral instances/types.
      *   **Tasks:**
          1.  Create a correspondence table (Corporate Entity vs. LLM System).
          2.  Separate disanalogies (matter vs. don't matter) sorted by three jobs: Prediction, Explanation/Fix, Responsibility Allocation.
          3.  Address Point 1: Is the Intentional Stance best? (vs. Design/Circuit stance).
          4.  Address Point 2: Non-reducibility (favor or grounding requirement?).
          5.  Verdict: Does the colleague's conclusion survive?
          6.  Alternative Source Domain: Archived memory? Population vs. Organism?

  2.  **Analyze the Core Analogy (Corporation vs. LLM):**

      *   *The Pro Argument:* Functionalism. If it walks like a duck (predicts behavior, explains aggregate output), call it a duck. Dennett's Intentional Stance.
      *   *The Con Argument:* Accountability and Grounding. Corporations are legal fictions with real human backing and liability. Models are mathematical functions without agency or legal standing.
      *   *The User's Insight:* Ontology. Firms are continuants; Models are types with ephemeral tokens.

  3.  **Drafting the Correspondence Table:**

      *   *Members:* Employees/Shareholders vs. Parameters/Weights (or Training Data points?). Let's go with Parameters/Nodes as the structural equivalent, Training Data as the "experience."
      *   *Charter:* Articles of Incorporation vs. System Prompt/Alignment Objectives (RLHF).
      *   *Board Resolutions:* Specific decisions vs. Context Window/In-Context Learning (ephemeral decisions).
      *   *Institutional Memory:* Databases/HR records vs. Weights (frozen memory) + RAG (retrieval).
      *   *Legal Personhood:* Corporate Veil vs. ...? (This is a gap). Maybe "Model Card" or "System ID"?
      *   *Liability:* Fines/Lawsuits vs. Model Deprecation/Recall (but no legal pain).
