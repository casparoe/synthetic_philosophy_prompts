answer: |-
  **Theory**
  The county presupposes a realist theory of dispositions. Flammability is treated as a stable property of the landscape-house assemblage, persisting even when unmanifested. Defensible space and hardening function as *masks*: they block the stimulus (embers) from triggering combustion without removing the underlying disposition (combustible materials). Response capacity is a temporal mask. Prescribed burning is best described as a *fink*: the stimulus (fire) is applied specifically to remove the disposition (fuel load) itself, preventing future manifestations. It is not an ordinary manifestation, as the goal is suppression of future risk, not expression of current fuel. The post-fire cycle—safe until grass returns—implies the disposition regenerates, a latent tendency inherent to the ecosystem rather than a momentary categorical state.

  **Presupposition versus Mere Fit**
  Strictly, the practices do not require metaphysical realism. A categoricalist, tracking only fuel load, moisture, and roof material, could license identical spending based on probabilistic correlations. The package is philosophically underdetermined; rival accounts of dispositions all license the budget. The difference between removing a disposition and masking it is, for practice, merely a matter of timescale and reliability; a mask that holds for a century functions like a removal. However, the rhetoric of "restoring" drainages unburned for a century presupposes a disposition that survives dormancy. A categoricalist sees only present states; the council sees a historical debt coming due. The practice does not need a disposition surviving unmanifested for a hundred years to function technically, but it needs that concept to justify "restoration" versus mere "reduction."

  **Consequences**
  Replacing this with a purely actuarial view (expected loss per year) collapses the mask/fink distinction into probability reductions. Prescribed burning becomes merely a cost-effective risk reducer, not ecological restoration. More critically, an actuarial model might abandon masking strategies (response capacity, defensible space) in high-risk zones if the expected loss exceeds mitigation costs, favoring retreat or total fuel removal instead. The current dispositional view sustains the belief that risks can be indefinitely masked without removal. An actuarial view forces acknowledgment that some dispositions are too costly to mask, potentially shifting funds from suppression to relocation or accepting loss, stripping the practice of its promise that nature can be balanced rather than managed for cost.
