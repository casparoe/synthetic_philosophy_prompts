  **Exclusion vs. Local Practice:** 0.30 — Conspiracy theories often function as load-bearing hinges within their own epistemic communities, regulating evidence interpretation internally.
  **Distinction vs. Circularity:** 0.40 — Defining "practice" without presupposing valid hinges risks circularity or arbitrary boundary-drawing between sane and insane systems.
  **Status (Truth vs. Rule):** 0.50 — Treating hinges as rules rather than propositions clarifies their function but does not inherently grant normative authority over rival rule-systems.
  **Goal (Escape vs. Stop):** 0.60 — Wittgenstein likely intends description over justification, suggesting the desire to "escape" relativism is itself a philosophical misunderstanding.

  **Combination:** The load-bearing test successfully clarifies the *mechanism* of certainty but fails to secure *normative authority* over rival systems; it shows why hinges feel necessary, but not why *our* hinges are right and *theirs* are wrong. Since fanatics often meet the load-bearing criterion within their local practices, the test does not fully rescue the theory from Priya's relativism objection, though it does refine the definition of a hinge.

  **Disagreement:** You and Priya are most likely disagreeing on the first term: whether "load-bearing" implies a universal human form of life (your view) or allows for isolated, coherent local practices (Priya's view).

  **What Would Move Me:** A demonstration that conspiracy-shaped hinges are pragmatically self-defeating in a way that breaks their own load-bearing status, rather than just failing external truth tests.

