      *   *Phenomenal/Access:* Don't retreat to Access; embrace Phenomenal Learning.
      *   *Sommelier:* Illustrates high-level property perception which is reliable due to training, not circular.

      *(Self-Correction during drafting)*: I should be careful about Step (1). Some philosophers argue CPP *is* real but doesn't threaten science. So rejecting (1) isn't the only way. I should emphasize that rejecting (5) is the most productive path.

      *(Refining the Sommelier point)*: The sommelier case is tricky because "minerality" is controversial even among sommeliers. I should use it to show that *calibration* is what saves objectivity, not the absence of penetration.

