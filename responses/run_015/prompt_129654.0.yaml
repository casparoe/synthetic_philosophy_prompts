  ### The Case of the "Teleological Drift"

  **The Scenario**
  Consider a patient, Elias, who executes an advance directive (AD) while fully competent. Elias is a dedicated historian whose identity is deeply constituted by his intellectual projects. His AD states: *"I authorize life-sustaining treatment only insofar as it enables me to continue my life's work of historical research. If I lose the capacity to engage in complex cognitive analysis, I consider my life's project complete and withdraw consent for aggressive intervention."*

  Years later, Elias suffers a frontal lobe injury. He loses the capacity for complex, long-term cognitive analysis (rendering historical research impossible). However, Elias does not descend into pathology or confusion. Instead, he undergoes a **rational value transformation**. Freed from the pressure of productivity, he develops a profound capacity for **relational presence**. He finds deep meaning in immediate emotional connection, mentorship, and community engagement. He operates within a new evaluative framework where "a life worth living" is defined by *interdependence* rather than *intellectual autonomy*.

  When a life-threatening infection arises, Elias (who retains decision-making capacity regarding immediate preferences, though not complex planning) expresses a desire to be treated. He does not frame this as "fighting for his research" (which he knows is gone), but as "staying present for his family." He is not refusing the treatment the earlier self authorized; he is accepting it, but **for a reason the earlier self did not anticipate and explicitly excluded via the "life's work" condition.**

  **The Conceptual Tension: Interpretive Authority over Teleology**
  The standard debate frames this as **Precedent Autonomy** (honor the past refusal/condition) vs. **Present Best Interests** (the current self is happy/flourishing). However, this case presents a distinct normative problem: **The Conflict of Diachronic Teleological Authority.**

  The friction is not simply about *whether* to treat (though that is the outcome), but about **who has the authority to define the *purpose* of the patient's continued existence.**
  *   **Honoring the Directive (Strict Interpretation):** The medical team withholds treatment. They argue that the *condition* for consent ("enable life's work") has failed. To treat him for "relational presence" would be to use his biological life for a goal he explicitly disavowed when competent. It treats the current Elias as a vessel for a "ghost goal."
  *   **Disregarding the Directive (Flexible Interpretation):** The medical team provides treatment. They argue that the *term* "life's work" in the AD should be interpreted dynamically to include the patient's current rationally-held values. To withhold treatment is to enforce a metaphysical definition of "worth" that the current agent has rationally superseded.

  **Why This Is Not "Direct Opposition"**
  In the standard debate, the later self typically *refuses* what the earlier self accepted (or vice versa). Here, **both selves consent to the intervention.** The earlier self said "Yes, *if* for Research." The later self says "Yes, *because* for Relationships." The conflict is not a binary clash of wills regarding the *means* (the antibiotics), but a **normative mismatch regarding the *ends*.** The later self is not merely reversing a preference; they are operating in an incommensurable value framework where the *criteria for authorization* have shifted.

  **Why Standard Appeals Fail**
  1.  **Appeal to Personal Identity:** Asserting that "Elias is still Elias" does not resolve the issue. The problem is not *who* is being treated, but *which version of the good* governs the treatment. Identity continuity confirms the subject is the same, but it is silent on whether the *teleological commitments* of the past self bind the moral agency of the present self when the present self has rationally adopted a new conception of the good.
  2.  **Appeal to Present Welfare:** Both frameworks (Research and Relationships) provide high welfare to the respective selves. A welfare calculation cannot distinguish between "honoring a past commitment to a specific type of flourishing" and "facilitating a current capacity for a different type of flourishing." The problem is not a deficit in welfare, but a **crisis of normative authorization.** We lack a principle to decide whether the *authority to define benefit* resides with the author of the life plan (Past Elias) or the inhabitant of the life (Present Elias).

  **The Distinct Normative Problem**
  This scenario exposes the **"Frustrated Purpose" Dilemma** in bioethics. It asks whether an advance directive functions as a **contract** (binding specific conditions) or a **trust** (empowering surrogates to interpret the patient's good in light of current reality). When the patient's values transform rationally rather than pathologically, honoring the directive risks violating the integrity of the *current* moral agent, while disregarding it risks violating the integrity of the *narrative* agent who planned the life. This tension cannot be resolved by weighing interests, because the very *scale* for weighing those interests has changed.
