  **Project Title:** The Unity of Consciousness in Moore's Organic Unity: A Structural Analysis of Aesthetics and Friendship

  **Project Description**

  G. E. Moore's *Principia Ethica* remains a foundational text in meta-ethics, particularly for its formulation of the principle of organic unity. This principle asserts that the intrinsic value of a whole is not necessarily identical to the sum of the intrinsic values of its parts. Moore identifies two primary categories of intrinsic goods that rely on this principle: the appreciation of beautiful objects (aesthetic experience) and the pleasures of human intercourse (personal friendship). While standard commentary acknowledges these categories as the apex of Moore's ideal utilitarianism, it typically treats them as distinct substantive claims rather than instances of a single structural requirement. This project proposes that Moore's account relies on an unstated metaphysical assumption: that for a complex to exhibit non-additive value, its constituent experiences or relations must be unified within a single conscious perspective over time. If this assumption is essential, Moore's ethics is fundamentally individualistic, excluding collective or distributed practices from the category of intrinsic goods.

  **Research Question**

  The central research question guiding this inquiry is: *Is the unification of parts within a single conscious perspective a necessary condition for intrinsic value in Moore's theory of organic unity?* This question admits of a determinate answer. Either Moore's textual commitments and logical framework require a singular subject of consciousness to bind the parts of a valuable whole, or they permit the unity to be distributed across multiple agents or external relations independent of a single mind. Resolving this binary determines whether Moore's ethical framework can accommodate collaborative goods—such as joint artistic creation or communal friendship networks—without substantive revision.

  **State of the Field and Unresolved Tensions**

  Existing scholarship on Moore generally focuses on the axiological implications of organic unity, analyzing how the value of the whole exceeds the sum of its parts. Commentators frequently analyze Moore's aesthetic examples separately from his remarks on personal affection, treating the former as a matter of cognitive appreciation and the latter as a matter of emotional relation. Consequently, the structural link between these two categories remains under-theorized. Most interpretations assume without argument that the "whole" in Moore's analysis is naturally bounded by the individual mind. They leave unresolved whether this boundary is contingent or constitutive. By neglecting the ontological conditions required for Moorean unity, standard interpretations fail to address whether the value resides in the object, the subject, or the relation itself. This project addresses that gap by isolating the role of consciousness as the potential glue of organic unity. If the unity of consciousness is merely accidental to Moore's examples, collective goods are permissible; if it is essential, Moore's ethics cannot account for value generated through distributed agency.

  **Methodology**

  The semester will be divided into three distinct phases of research and writing. The first phase, comprising the initial six weeks, will focus on close textual reconstruction. I will analyze Moore's definitions of "whole," "part," and "consciousness" to determine if he explicitly or implicitly ties the existence of a valuable whole to a single subject. This involves tracing his arguments regarding the isolation method to see if he consistently isolates properties within a single experiential field.

  The second phase, spanning weeks seven through ten, will involve constructing a formal model of the "Single Consciousness Constraint." I will articulate the conditions under which a complex counts as a unity in Moore's system. Using this model, I will construct test cases involving distributed practices, such as collaborative artworks whose value depends on sustained interaction among multiple agents, or friendship networks that exceed dyadic relations. I will then assess whether these cases satisfy Moore's criteria for organic unity under the proposed constraint.

  The final phase, during the last four weeks, will evaluate the results against Moore's explicit commitments regarding personal relations. I will test whether excluding distributed cases creates inconsistencies within his broader ethical system or whether including them forces a revision of his metaphysics of value. This comparative analysis will determine whether the single-consciousness assumption is a bug or a feature of Moore's theory.

  **Success Conditions and Scope Assessment**

  A successful result will demonstrate definitively whether Moore's framework necessitates a single conscious subject. If the project confirms the constraint, it will demonstrate that Moore's intrinsic goods are inherently individualistic, requiring significant modification to account for collaborative value. If the project refutes the constraint, it will open Moore's framework to social interpretations previously deemed incompatible. Failure would consist only in finding the textual evidence too ambiguous to support a determinate conclusion, though the reconstruction of the argument itself would still yield philosophical value by clarifying the limits of Moorean exegesis.

  Regarding scope, the primary risk lies in the breadth of the textual reconstruction. Moore's writing is dense and often shifts between metaphysical and ethical claims. If time becomes constrained, I will prioritize the exegesis of the relationship between consciousness and value (Phase One) and the evaluation regarding personal friendship (Phase Three). The extension to collaborative artworks (Phase Two) serves as the testing ground but is secondary to the core metaphysical question. Should scheduling conflicts arise, I will drop the specific analysis of collaborative art and focus exclusively on whether dyadic friendship already violates the single-consciousness constraint. This reduction would preserve the core philosophical contribution regarding the structure of organic unity while ensuring the project remains completable within the semester. The final deliverable will be a paper of approximately 8,000 words suitable for submission to a peer-reviewed journal in moral philosophy.
