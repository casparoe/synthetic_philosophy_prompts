prompt: |-
  I've landed on the position that evolutionary psychology is a real science, not a genre of just-so stories in the Kipling sense, and I'd like a map of what would count against it. My working view: the core program -- that a lot of the mind is a suite of domain-specific modules shaped by natural selection in the ancestral environment -- is doing exactly the kind of historical-functional explanation that makes evolutionary biology science, and the standard just-so objection (post-hoc, unfalsifiable, any story can be spun) is a generic attack that would sink paleontology and phylogenetics too, so it doesn't land. What would have to be true for me to be wrong? I want the defeaters sorted from fatal to merely awkward, and I'd be helped if you separated (a) evidence that would count against the modular-architecture claims specifically, (b) evidence that would count against the ancestral-environment reconstruction method, and (c) things that would only embarrass particular famous hypotheses without touching the program. I also want to know which of these a committed evolutionary psychologist would themselves concede as counting against them versus wave away as bad examples, and whether the program has a signature prediction that rival accounts -- say, general-purpose-learning-mechanism views or cultural-evolution accounts -- genuinely don't make, or whether its testability is mostly negative (it's just the absence of a better alternative). One more thing: I suspect part of the defense is definitional, i.e. "any hypothesis that could in principle be tested counts, and we just have to wait for the tests." Is the position insulated that way, and if so, is that a problem for it, or is that just what historical sciences are like? What I'd personally find most persuasive is a case where the program made a risky, dated, specific prediction and got it wrong in a way a rival account got right -- or, failing that, a clear statement of how much of the "science" label is load-bearing versus how much is already on the table from the fact that selection is a real cause.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Core Stance:** The user believes evolutionary psychology (EP) is a real science, not just "just-so stories." They compare it to paleontology/phylogenetics (historical-functional explanation).
      *   **Goal:** A "map of what would count against it" (falsification conditions/defeaters).
      *   **Structure:**
          *   Sort defeaters from fatal to awkward.
          *   Categorize into: (a) Modular-architecture claims, (b) Ancestral-environment reconstruction, (c) Embarrassing specific hypotheses (program-safe).
          *   Distinguish between what committed EPs would concede vs. wave away.
          *   Identify signature predictions vs. rival accounts (general learning, cultural evolution).
          *   Address the "definitional insulation" critique (is it just "wait for tests"?).
          *   Look for risky, dated, specific predictions that failed (or confirm the lack thereof).
          *   Evaluate the "science" label load-bearing status.

  2.  **Deconstruct the Evolutionary Psychology (EP) Program:**

      *   *Core Tenets:* Massive Modularity, Environment of Evolutionary Adaptedness (EEA), Adaptationism (traits are selected solutions), Universal Human Nature.
      *   *Standard Criticisms:* Just-so stories, modularity is neurologically implausible, EEA is a fiction, ignores plasticity/culture, political bias.
      *   *User's Defense:* It's like paleontology (inference to best explanation based on current function + history).

  3.  **Drafting the Defeaters (Categorization & Severity):**

      *   *(a) Modular Architecture:*
          *   *Fatal:* Evidence that the brain is *strictly* domain-general (e.g., a single learning algorithm solves everything). Evidence that "modules" are actually culturally constructed neural pathways.
          *   *Awkward:* Evidence that modules exist but are developmentally plastic (not pre-specified).
      *   *(b) Ancestral Reconstruction (EEA):*
          *   *Fatal:* Evidence that selection pressures varied so wildly that no stable "EEA" existed. Evidence that traits evolved *after* the proposed EEA (mismatch theory failure).
          *   *Awkward:* Evidence that the EEA was different than thought (e.g., more violence, less paternity uncertainty), requiring story tweaks.
      *   *(c) Specific Hypotheses:*
          *   *Fatal:* (Hard to kill the whole program with one hypothesis).
          *   *Embarrassing:* Cheater detection, waist-to-hip ratio, depression as adaptation. If these fail, EPs say "bad hypothesis," not "bad program."

  4.  **Addressing the "Science" Label & Insulation:**

      *   *Definitional Insulation:* "It's testable *in principle*."
      *   *Critique:* If *every* failure is blamed on "wrong specific hypothesis" rather than "wrong framework," the framework is insulated.
      *   *Comparison to Paleontology:* Paleontology makes predictions about fossil layers. EP makes predictions about *current* cognitive mechanisms.
      *   *Risky Predictions:* This is the crux. Did EP predict something *before* the data came in?
          *   *Example:* Cheater detection (Cosmides & Tooby). Wason selection task. They predicted content effects. This was a positive prediction.
          *   *Counter:* General learning accounts also predict content effects (associative learning).
          *   *Real Failure:* The "Depression as Adaptation" hypothesis or specific mating preference shifts.
          *   *The "Null" Problem:* Often EP argues "General learning can't explain X," which is a negative prediction.

  5.  **Addressing Rival Accounts (General Learning/Cultural Evolution):**

      *   *Signature Prediction:* EP predicts *universality* despite cultural variance (underlying structure). General learning predicts variance tracks environmental variance directly.
      *   *Cultural Evolution:* Predicts traits spread via fitness of the *idea*, not the *organism*. EP predicts traits track organismic fitness (inclusive fitness).
      *   *Differentiation:* If a trait tracks cultural fitness but reduces biological fitness (e.g., celibacy), EP calls it a mismatch/byproduct. Cultural Evo calls it selection. This is a key battleground.

  6.  **Synthesizing the "Fatal vs. Awkward" Map:**

      *   *Fatal:* Discovery of a domain-general mechanism that replicates EP's "modules" without pre-specification. Proof that human cognitive universals are actually cultural universals (transmission bias).
      *   *Awkward:* Neuroplasticity shows modules are formed early in development based on input, not genome-hardcoded.
      *   *Program-Safe:* Specific adaptation claims (e.g., step-father abuse) fail. EP absorbs this as "bad adaptationist hypothesis."

  7.  **Refining the "Insulation" Charge:**

      *   Is it *just* "wait for tests"?
      *   Lakatosian Research Programme: EP is the "hard core." Specific hypotheses are the "protective belt."
      *   Problem: If the protective belt absorbs *all* anomalies, the hard core becomes unfalsifiable.
      *   Verdict: It is insulated to a degree, similar to psychoanalysis (historically), but less so than astrology. It relies on the plausibility of the EEA.

  8.  **Drafting the Response (Iterative refinement for tone and precision):**

      *   *Tone:* Respectful, analytical, philosophically rigorous (matching the user's sophistication).
      *   *Structure:* Follow the user's requested categories (a, b, c) + Signature Predictions + Insulation analysis.
      *   *Key Insight:* The user is right that "just-so" applies to all historical science, *but* EP has a unique vulnerability: it infers *past* function from *current* psychology without the fossil record of minds.
      *   *Crucial Distinction:* Adaptation vs. Byproduct. EP often claims Adaptation. If Byproduct explanations become more parsimonious systematically, EP loses ground.

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "risky prediction" request?
      *   *Action:* Need to highlight the Wason Selection Task (Cheater Detection) as the best candidate for a "win," and note where it failed (replication issues, alternative explanations).
      *   *Check:* Did I address the "science label"?
      *   *Action:* Distinguish between "EP is biology" (true) and "EP claims are tested" (mixed).
      *   *Check:* User wants to know what would make them *wrong*.
      *   *Action:* Emphasize that if the brain turns out to be a "statistical learning machine" all the way down, Massive Modularity dies.

  10. **Final Polish:** Ensure clear headings, bullet points for readability, and a concluding summary that directly answers the "load-bearing" question. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note)*: I need to be careful not to strawman EP. The user is sympathetic. I should acknowledge the strength of the adaptationist logic while pinpointing the specific epistemic gaps. The comparison to paleontology is apt but needs nuance (paleontology has fossils; EP has only current brains + speculation).

  *(Refining the "Fatal" criteria)*: What actually kills EP? It's not one failed study. It's the demonstration that *domain-general* mechanisms are sufficient to explain the data EP claims requires *domain-specific* mechanisms. This is the "Poverty of the Stimulus" argument reversed.

  *(Refining the "Insulation")*: The "in principle testable" defense is weak if the "in practice" constraints (can't go back in time) make the tests impossible. I need to highlight the difference between *logical* falsifiability and *practical* falsifiability.

  *(Final Plan)*:
  1. Intro: Validate the paleontology comparison but note the disanalogy (mind fossils).
  2. Section 1: The Defeater Map (Fatal, Awkward, Embarrassing).
  3. Section 2: EP Concessions vs. Deflections.
  4. Section 3: Signature Predictions & Rivals.
  5. Section 4: The Insulation/Science Label question.
  6. Conclusion: The "Load-Bearing" verdict.cw
answer: |-
  This is a sophisticated framing. You are correct that the "just-so story" critique is often wielded lazily; historical sciences (geology, cosmology, phylogenetics) all rely on inference to the best explanation regarding unobservable past events. If EP is unscientific *because* it reconstructs history, then paleontology is too.

  However, EP faces a specific epistemic vulnerability that paleontology does not: **the lack of a fossil record for cognitive algorithms.** Paleontologists have bones; EPs have modern brains and must infer the selection pressures that shaped them. This creates a larger gap between data and theory, widening the "protective belt" around the core assumptions.

  Here is the map of defeaters, sorted by severity, followed by an analysis of the program's insulation and signature predictions.

  ---

  ### I. The Defeater Map

  #### (a) Evidence Against Modular-Architecture Claims
  *The Core Claim:* The mind is not a general-purpose computer but a "Swiss Army knife" of domain-specific adaptations (cheater detection, mate selection, hazard avoidance).

  *   **Fatal (Program-Killing):**
      *   **Sufficiency of Domain-General Mechanisms:** If it is demonstrated that a single, domain-general learning algorithm (e.g., a specific architecture of deep learning or predictive processing) can acquire "modular-like" competencies (like cheater detection) solely through exposure to statistical regularities in the environment, without pre-specified content. If the "module" is an *emergent property* of general learning rather than a *genetic specification*, Massive Modularity is false.
      *   **Neuroplasticity Evidence:** If neuroimaging shows that tasks EP claims are modular (e.g., language, face recognition) can be fully relocated to different cortical areas after early damage without loss of function, this undermines the "hardwired" aspect of the modules. (Note: EPs already concede some plasticity, but there is a limit).

  *   **Awkward (Requires Major Revision):**
      *   **Developmental Calibration:** Evidence that "modules" are not pre-specified in the genome but are *calibrated* during early development based on environmental cues (e.g., a "mating module" that takes its specific parameters entirely from local cultural norms). This shifts the locus of explanation from evolutionary history to developmental plasticity.
      *   **Task-General Neural Substrates:** If fMRI consistently shows that "domain-specific" tasks rely on the same domain-general neural networks (e.g., frontoparietal control networks) rather than distinct, encapsulated circuitry.

  *   **Embarrassing (Specific Hypothesis Failure):**
      *   Failure to find specific neural correlates for proposed modules (e.g., no distinct "jealousy circuit"). EPs will argue the module is functional/computational, not necessarily localized to a single voxel, so this rarely touches the core.

  #### (b) Evidence Against Ancestral-Environment Reconstruction (EEA)
  *The Core Claim:* We can reliably infer the Environment of Evolutionary Adaptedness (EEA) to determine the "design specifications" of the mind.

  *   **Fatal:**
      *   **The "No Stable EEA" Proof:** If anthropological/archaeological consensus establishes that human evolution occurred across such wildly divergent ecological niches with such rapid fluctuation that no stable selection pressure existed long enough to fix complex cognitive adaptations. (i.e., The target was moving too fast to be hit).
      *   **Phylogenetic Mismatch:** If comparative psychology shows that traits EP claims are human-specific adaptations (e.g., certain social reasoning) are present in species that did not share the proposed EEA pressures (e.g., solitary primates or corvids), suggesting the trait is phylogenetically older or convergent for different reasons.

  *   **Awkward:**
      *   **Timeline Mismatch:** If genetic dating shows a trait emerged significantly before or after the proposed EEA window (e.g., a "modern social cognition" trait that appears in *Homo erectus* when the EP model assumes it arose in *Homo sapiens* in the Pleistocene).
      *   **Ecological Error:** Evidence that the ancestral environment was fundamentally different than assumed (e.g., monogamy was the norm, not polygyny; or violence was negligible). This forces story-spinning but doesn't kill the method.

  *   **Embarrassing:**
      *   Specific claims about ancestral diet, group size, or paternity certainty being revised. EPs treat the EEA as a statistical composite, so specific revisions are absorbed easily.

  #### (c) Evidence That Embarrasses Hypotheses but Saves the Program
  *These are the "Just-So" failures that EPs treat as "Bad Science," not "Bad Paradigm."*

  *   **Waist-to-Hip Ratio (WHR):** If it turns out WHR preferences are entirely culturally mediated (media exposure) rather than a fertility cue. (EPs have already largely retreated from strong universality claims here).
  *   **Step-Father Effect:** If the higher rate of abuse by step-fathers is shown to be entirely a function of socioeconomic stress and lack of legal bonding, rather than an evolved "discriminative parental solicitude."
  *   **Depression as Adaptation:** If the "analytical rumination hypothesis" (depression is for solving complex problems) is debunked by evidence that depression degrades cognitive function uniformly.

  ---

  ### II. Concessions vs. Deflections: What EPs Admit

  If you presented the above evidence to a committed Evolutionary Psychologist (like Cosmides, Tooby, or Pinker), here is how they would likely categorize it:

  1.  **They Would Concede (The "Protective Belt"):** They would admit that specific hypotheses (WHR, step-father effect) might be wrong. They view these as *applications* of the theory, not the theory itself. If a specific adaptation claim fails, they assume the *method* of identifying adaptations was flawed, not that adaptationism is flawed.
  2.  **They Would Wave Away (The "Hard Core"):**
      *   **Neuroplasticity:** They argue that plasticity *itself* is an adaptation. "Openness to learning" is a domain-specific module for acquiring local norms. They absorb plasticity into the program.
      *   **General Learning:** They argue "general learning" is a myth. You cannot learn everything from everything. There must be constraints on learning, and those constraints are the "modules."
      *   **Cultural Variation:** They argue surface variation masks deep universals. (e.g., "All cultures have marriage" even if the rules differ).

  **The Danger Zone:** The only thing they cannot easily absorb is a proof that **domain-general mechanisms are sufficient.** If a rival model can predict the data *without* positing ancestral selection pressures for specific content, EP loses its explanatory necessity.

  ---

  ### III. Signature Predictions & Rival Accounts

  You asked for a signature prediction that rival accounts (General Learning, Cultural Evolution) do not make. This is the crux of the testability issue.

  **1. The Signature Prediction of EP:**
  *   **Content-Effects in Reasoning:** EP predicts that human reasoning performance will spike dramatically when a problem is framed in terms of *evolutionarily recurrent content* (e.g., social contracts/cheating) vs. abstract logic, even if the logical structure is identical.
  *   **The Rival Prediction (General Learning):** Performance should track *familiarity* and *frequency of exposure*, not evolutionary content.
  *   **The Verdict:** The famous Wason Selection Task experiments (Cosmides & Tooby) claimed to support EP. However, subsequent research showed that "familiarity" and "deontic rules" (rules about what you *should* do) explain the data without needing an evolved "cheater module." **This is a case where the rival account arguably matched or exceeded EP's predictive power.**

  **2. The Signature Prediction of Cultural Evolution:**
  *   **Maladaptive Traits:** Cultural evolution predicts the spread of traits that enhance the *replication of the idea* even if they reduce *biological fitness* (e.g., celibacy, suicide pacts, low-fertility norms).
  *   **The EP Counter:** EP calls these "mismatches" or "byproducts."
  *   **The Test:** If we find systematic cognitive universals that *consistently* drive behavior contrary to inclusive fitness in *ancestral-like* conditions (not just modern mismatches), EP struggles. EP assumes the mind is designed to maximize inclusive fitness (in the genetic sense). If the mind is designed to maximize *cultural* fitness, EP is wrong.

  **3. The "Risky, Dated, Specific Prediction" Test:**
  *   **Did EP make one and fail?**
      *   *Candidate:* **The "Savannah Principle."** EP predicted we would be universally better at reasoning about stimuli present in the EEA (snakes, spiders, faces) than modern stimuli (guns, cars).
      *   *Result:* Mixed. We do have faster detection of snakes/spiders, *but* we also learn to fear modern dangers quickly. The "preparedness" is real, but it looks more like general learning biases than rigid modules.
      *   *Candidate:* **Sex Differences in Jealousy.** Men distressed by sexual infidelity, women by emotional infidelity.
      *   *Result:* Replication failures and strong cultural moderation. In egalitarian societies, the sex difference shrinks or vanishes. This counts against the "hardwired module" version of the hypothesis.

  ---

  ### IV. The Insulation Charge: "In Principle" vs. "In Practice"

  You suspect the defense is definitional: *"Any hypothesis that could in principle be tested counts."*

  **Is the position insulated that way?**
  Yes, structurally. EP operates as a **Lakatosian Research Programme**.
  *   **Hard Core:** The mind is adapted; the EEA is knowable; modularity is real.
  *   **Protective Belt:** Specific hypotheses about specific traits.

  When a specific hypothesis fails (e.g., WHR), it is discarded to save the Hard Core. This is normal science *until* the protective belt becomes so ad-hoc that the Hard Core generates no novel facts.

  **Is this a problem?**
  It is a problem if the "in principle" tests are "in practice" impossible.
  *   **Paleontology:** Can predict where a fossil will be found. If they dig and it's not there, the phylogeny is wrong.
  *   **EP:** Predicts a cognitive mechanism. If they test and it's not there, they say "The task didn't trigger the module" or "The module is latent."
  *   **The Disanalogy:** Paleontology has a constraint (the rocks). EP's constraint (the mind) is flexible and can be argued to be "context-dependent." This allows EP to explain away null results by claiming the *context* wasn't right, which is hard to falsify.

  **However,** EP is not *entirely* insulated. It is constrained by **parsimony**. If a general-learning explanation is simpler and fits the data equally well, EP loses ground. The "science" label is load-bearing only insofar as EP proponents submit to this constraint. If they insist that *only* adaptationist explanations are valid regardless of parsimony, they exit science.

  ---

  ### V. Verdict: How Much of the "Science" Label is Load-Bearing?

  To answer your final question: **How much of the "science" label is load-bearing versus how much is already on the table from the fact that selection is a real cause?**

  1.  **Selection is Real (The Table):** It is indisputable that the brain was shaped by selection. In this trivial sense, EP is true.
  2.  **The "Science" Claim (The Load):** The claim to be a *generative science* rests on the ability to **predict novel cognitive structures based on ancestral problems.**
      *   **If EP is Science:** It should tell us about the mind we *didn't* know before. (e.g., "Because ancestors had problem X, we should find mechanism Y.")
      *   **If EP is Just-So:** It takes known mechanisms (e.g., "We get jealous") and invents a story for why they exist ("Because paternity uncertainty").

  **The Decisive Factor:**
  EP remains science **only if** it adheres to the **Adaptationist Programme's constraints**:
  1.  It must demonstrate that the trait is not a byproduct (spandrel).
  2.  It must demonstrate that domain-general learning cannot explain the trait.
  3.  It must make predictions about *structure*, not just function.

  **What would make you wrong?**
  If it turns out that **90% of proposed "adaptations" are better explained as byproducts of general intelligence + culture**, then EP collapses into a trivial truth ("evolution happened") rather than a specific explanatory framework ("evolution built *this* specific module").

  Currently, the field is in a tension zone. The "Massive Modularity" claim is taking heavy fire from predictive processing and neural network models. If those models succeed in simulating "modular" behavior without modular architecture, EP's claim to be a distinct *mechanistic* science (rather than a high-level functional description) will fail. It would become a useful *heuristic* for generating hypotheses, but not a true account of cognitive architecture.

  **Summary:** You are right that the "just-so" critique is overused. But EP is more vulnerable than paleontology because it lacks the "fossils" of the mind. Its survival depends on proving that **domain-general learning is insufficient** to explain human cognition. If that proof fails, EP remains a true *historical claim* (we were selected) but a false *mechanistic claim* (we are modular).
