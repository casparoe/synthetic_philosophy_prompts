      *   *Reply:* You are conflating the *ideal* with the *mechanism*. Even alone, you are simulating an audience (your future self). But if we grant the Last Man case: The norm doesn't vanish, it becomes self-regulation. But the *reason* it feels wrong to lie in a diary is that you are corrupting your own cognitive agency.
      *   *Where it breaks:* It breaks on the intuition that truth is a value independent of social accountability. If the user feels that "Truth is intrinsically normative," this view cannot capture that. It reduces epistemology to ethics. I must admit: If there is a sui generis epistemic norm, this view is false. It relies on the claim that epistemology is social all the way down.

  6.  **Refining the Tone:**
      *   Needs to be punchy. "Here is the view." "Here is why the others are wrong."
