      *   **Position:** Assertion is essentially an act of taking responsibility for a claim before an audience who can demand reasons. The Knowledge Norm (KN) is derivative, not basic. It's the shape responsibility takes in standard answerable contexts.
      *   **Key Upshot:** When the answerability relation is severed/scrambled, the norm shifts. The debate is deadlocked because everyone generalizes from fully answerable assertion.
      *   **Required Cases to Address:**
