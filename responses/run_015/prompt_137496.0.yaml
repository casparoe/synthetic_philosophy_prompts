      *   *Actually, the clearest prediction:* **The permissibility of 'Hedging' based on audience capability.** Plain KN says hedge if you don't know. My view says: Hedge *more* when the audience *can* check you (to invite the challenge), but hedge *less* (be more decisive) when they *cannot*, because your decisiveness is part of the care you owe them. A doctor saying "I *think* this might work" when they know the stats is actually *irresponsible* compared to "This will work." The norm shifts from "Reflect your epistemic state" to "Optimize the audience's reliance."
