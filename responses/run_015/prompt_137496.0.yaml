          *   My View: This is the dangerous zone. Because the answerability link is cut, the *epistemic* norm weakens, but the *moral* norm might heighten. However, strictly speaking as an *assertion*, it becomes closer to propaganda or performance. The norm shifts from "Be ready to justify" to "Don't cause harm."
          *   *Stance:* The epistemic norm weakens because the mechanism of enforcement (challenge) is gone. It becomes mere expression.

      *   *Case 3: Doctor/Patient or Teacher/Child (Asymmetric).*
