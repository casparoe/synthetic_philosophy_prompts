          *   *Let's sharpen:* **The "Challenge Right."** Plain KN says the audience has a right to truth. My view says the audience has a right to *challenge*. Therefore, in contexts where challenge is blocked (hypnosis, authoritative command), assertion becomes impermissible *even if you know*, unless you convert it into a different speech act (testimony/guarantee).
          *   *Okay, let's go with the Asymmetric Case Prediction.* Plain KN treats Doctor-Patient same as Peer-Peer. My view predicts that **assertions made to dependent audiences tolerate less uncertainty than assertions made to independent audiences.** A doctor needs a higher confidence threshold to assert than a colleague does, precisely because the colleague can fact-check. The norm scales with the audience's inability to verify.

