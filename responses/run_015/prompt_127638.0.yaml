answer: |-
  **TO:** Acquisition and Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Delaware Valley Urban Renewal Authority Files

  **Recommendation**
  I recommend a vote for **Conditional Accession** of the Delaware Valley Urban Renewal Authority administrative files (1962–1983), contingent upon the simultaneous acquisition and integrated processing of the fragmentary resident records. I propose an eighteen-month implementation timeline to establish a critical cataloging protocol that addresses the collection's ethical liabilities without erasing its evidentiary value.

  **The Evidentiary Imperative**
  Rejecting this collection is not a viable ethical option. While the Authority's records embody an epistemic dominance that excluded tenant voices, these files remain the primary evidence of how that exclusion was engineered. Budget ledgers and demolition orders are not merely bureaucratic artifacts; they are the forensic tools of displacement. To reject them because they are tainted by bias would be to sanitize history, removing the mechanism of harm while leaving the outcome ambiguous. We must preserve the record of power to understand how it was wielded. However, unconditional accession risks re-inscribing the Authority's worldview, validating parcel numbers over human names and administrative efficiency over community destruction.

  **Addressing the Curatorial Concerns**
  The proposal to implement a "negative-space cataloging" protocol is necessary but requires careful refinement to address the concern that it may aestheticize structural violence. Critics rightly worry that treating absence as a metadata object could transform trauma into an abstract curatorial concept, inadvertently legitimizing the archive's silences by making them appear intentional or artistic rather than violent.

  To mitigate this, our processing protocol must not treat absence as an artifact, but as a wound. We will not simply tag missing files; we will explicitly annotate the *cause* of the absence. Where tenant testimony was excluded from minutes, the catalog entry must state: "Testimony excluded per Policy Section 4." Where photos identify only parcel numbers, the metadata must flag: "Occupant identity suppressed." This shifts the focus from the aesthetic of the gap to the violence of the erasure. Furthermore, to prevent this from becoming an abstract exercise, we must ground these annotations in the tangible reality of the displaced residents.

  **Integrating Community Fragments**
  This is why conditional accession must include the separate donation of oral histories and petitions. Critics note these lack institutional provenance, but community archives rarely possess the provenance of the state. Their evidentiary value outweighs their archival irregularity. We must commit resources to cross-reference these fragments with the bureaucratic files. When a petition matches a parcel number, the bureaucratic record is amended to reflect the human cost. This linkage prevents the "negative-space" protocol from becoming theoretical; it forces the bureaucratic record to confront the voices it sought to silence.

  **Implementation Timeline**
  Upon approval, the following timeline will be enacted:

  *   **Months 1–3:** Legal transfer of both collections. Staff training on trauma-informed archival processing.
  *   **Months 4–12:** Integrated processing. Archivists will create dual-linked records: one for the bureaucratic entry, one for the resident fragment. "Negative-space" metadata will be applied to highlight specific instances of exclusion, verified against the resident papers.
  *   **Months 13–18:** Public access launch. The finding aid will be released with a prominent historical note explaining the conditional nature of the accession and the methodology used to highlight silences. A community advisory board, including descendants of displaced residents, will review the public interface before launch.

  **Conclusion**
  This recommendation balances the need to preserve the evidence of institutional power with the epistemic rights of those it excluded. We cannot fix the past violence embedded in these files, but we can refuse to replicate it in our catalog. By accessioning conditionally, we acknowledge that the Authority's record is incomplete by design. Our task is not to fill that silence with curatorial artistry, but to document the violence that created it, ensuring that the archive serves as a testament to resilience rather than a monument to administration.

  I urge the committee to support this conditional approach. It allows us to hold power accountable without losing the evidence required to do so.
