  Here's a thinking process that leads to the suggested handout:

  1.  **Analyze the Request:**
      *   **Topic:** Aristotle's *Politics/Nicomachean Ethics* (account of exchange, money, justice) vs. Shakespeare's *The Merchant of Venice*.
      *   **Goal:** A handout for students that does "real work," not just superficial quoting. It needs to address a specific puzzle: Do Aristotle's categories map onto the play, or do they break down?
      *   **Key Questions to Address:**
          *   Venice (commerce/law) vs. Belmont (gift/fidelity) vs. Aristotle's Natural vs. Unnatural Acquisition.
          *   The Trial Scene: Legal Justice vs. Equity (Aristotle's *epieikeia*).
          *   Shylock's Demand: Is it greed (*pleonexia*) or strict justice?
          *   Limitations: Where does Aristotle's lens distort the play? What does the play show that Aristotle misses?
      *   **Tone:** Honest, critical, pedagogical, nuanced. Avoid forcing a fit. Acknowledge where the theory fails.

  2.  **Deconstruct the Aristotle-Shakespeare Interface:**

      *   *Aristotle on Money/Exchange:*
          *   Natural Acquisition (Oikonomia): Getting goods for the household, limited by need.
          *   Unnatural Acquisition (Chrematistike): Getting money for money's sake (usury/interest is the worst). Money is a measure, not a source of generation.
          *   Justice in Exchange: Reciprocity based on proportionate need, mediated by money.
          *   Legal Justice vs. Equity: Law is universal, but sometimes too rigid; equity corrects the law where it falls short due to generality.
          *   Pleonexia: The vice of wanting more than one's share.

      *   *The Merchant of Venice:*
          *   Antonio: Merchant (risk), lends gratis (friendship), melancholic.
          *   Shylock: Usurer (interest), demands bond (law), marginalized.
          *   Belmont: Portia, caskets (choice/value), rings (tokens of fidelity), mercy.
          *   The Trial: Bond vs. Mercy, Letter vs. Spirit.

      *   *The Tension (The "Puzzle"):*
          *   Superficially: Shylock = Unnatural (Usury), Antonio = Natural (Trade/Friendship).
          *   Deeply: Antonio's trade is speculative/risky (not stable household management). Antonio's "gifts" create binding debts (rings). Shylock's bond is legally valid (justice) but morally repugnant. Portia uses legal trickery (equity?) to defeat him.
          *   The "Measure" Problem: Aristotle thinks money measures value. The play asks if love/flesh/mercy can be measured.

  3.  **Drafting the Handout - Section by Section:**

      *   **Title:** Needs to be engaging. "Measuring Flesh and Fortune."
      *   **Introduction:** Set the stage. Acknowledge the temptation to map Shylock=Aristotle's Villain and Antonio=Aristotle's Hero. State the thesis: The mapping is unstable.
      *   **Section 1: Natural vs. Unnatural Acquisition (The Economic Lens).**
          *   Define Aristotle's terms (*oikonomia* vs. *chrematistike*).
          *   Apply to Shylock (Usury = breeding money).
          *   Apply to Antonio (Ventures = risk, not just household need).
          *   *Critical Twist:* Antonio isn't truly "natural." His wealth is at sea (uncertain). His "gratis" lending creates social debt, not freedom from debt.
      *   **Section 2: Justice, Equity, and the Trial (The Legal Lens).**
          *   Define Aristotle's *epieikeia* (equity corrects law).
          *   Analyze the Trial. Shylock wants Law (Justice). Portia offers Mercy (Equity?).
          *   *Critical Twist:* Portia's "quality of mercy" sounds like equity, but her victory is a legal trap (no blood, alien law). Is this equity or just smarter lawyering?
          *   Shylock's *Pleonexia*: Is he wanting *more*? No, he wants *exactly* the bond. This challenges Aristotle's definition of injustice.
      *   **Section 3: Where the Lens Cracks (The Limits of Aristotle).**
          *   Aristotle assumes a stable polis. Venice is cosmopolitan/unstable.
          *   Aristotle assumes value is commensurable. The play suggests some things (flesh, love) are incommensurable yet traded.
          *   The Ring Plot: Belmont isn't outside economy; it's a different currency (symbolic capital).
      *   **Discussion Questions:** Prompt critical thinking based on the reading.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Aristotle is wrong." I need to show *how* the play uses the concepts to complicate them.
      *   *Nuance on Equity:* Aristotle's equity is about the *legislator's intent* vs. the *letter*. Portia uses the *letter* to defeat the *intent* of the bond (arguing it doesn't allow blood). This is actually a perversion of equity, or a hyper-literalism that mimics Shylock's. I need to highlight this irony.
      *   *Nuance on Shylock:* He claims "justice." Aristotle says injustice is taking more than your share. If the law says you get a pound, and you take a pound, is it unjust? Aristotle would say the law itself might be flawed, but Shylock's *intent* is the issue for Aristotle (harming another for gain). But Shylock claims revenge, not gain. This is a key divergence.

  5.  **Final Polish:**
      *   Ensure the tone is academic but accessible.
      *   Check that all parts of the prompt are answered (Venice/Belmont, Trial/Equity, Shylock's Share, Limitations).
      *   Make sure the "Honesty" requirement is met (explicitly state where Aristotle fails).

  6.  **Final Review against Prompt:**
