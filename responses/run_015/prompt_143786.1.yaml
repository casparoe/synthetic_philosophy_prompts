answer: |-
  # HANDOUT: Measuring Flesh and Fortune
  **Aristotle's Economics of Justice and *The Merchant of Venice***

  ### I. The Temptation of the Map
  It is tempting to read *The Merchant of Venice* as a dramatization of Aristotle's distinction between **natural** and **unnatural** acquisition (*Politics* I.8–10; *Nicomachean Ethics* V.5).

  *   **Aristotle's View:** Natural acquisition (*oikonomia*) serves the household and is limited by need. Unnatural acquisition (*chrematistike*) seeks infinite wealth. The worst form is usury (interest), because it makes money breed money, divorcing gain from the useful goods money is meant to measure.
  *   **The Superficial Fit:** Shylock charges interest (unnatural); Antonio lends gratis and risks goods at sea (natural?). Shylock demands flesh (commodification of life); Portia offers mercy (transcendent value).

  **The Problem:** This fit is too clean. If we look closer, Antonio's wealth is speculative and precarious, not rooted in stable household management. Shylock's demand is not for *more* than his due, but for the *exact* letter of the law. Belmont's "gift economy" relies on tokens (rings) that function as binding contracts.

  This handout asks you to trace where Aristotle's categories illuminate the play, and where the play exposes the limitations of Aristotle's philosophy.

  ---

  ### II. Natural vs. Unnatural: Venice and Belmont
  Aristotle argues that money is a measure of demand, not a source of value itself. When exchange becomes an end in itself, it becomes "unnatural."

  **1. The Merchant's Risk**
  Antonio claims his merchandise is "not in one bottom trusted... nor to one place." To Aristotle, the merchant who trades for profit is suspect, but the usurer is despised.
  *   **Question:** Antonio lends money without interest (seemingly "natural" friendship), yet his capital comes from high-risk global trade. Does Antonio practice "natural" acquisition, or has he simply disguised the risk of *chrematistike* as the virtue of friendship?
  *   **The Twist:** In Act I, Scene 3, Shylock cites Scripture to justify interest as natural increase ("ewes and rams"). Antonio rejects this, asserting money cannot breed. Yet, Antonio's ships *do* breed wealth, just unpredictably. Is the difference between them really about "nature," or about who controls the risk?

  **2. The Economy of Belmont**
  Belmont appears to be a zone of gift and fidelity, opposed to Venice's cold law.
  *   **The Caskets:** Choosing a wife requires risking everything ("hazard all he hath"). This is not household management; it is speculative investment.
  *   **The Rings:** Portia gives Bassanio a ring, making him swear never to part with it. When he gives it away (to the "lawyer"), he breaks a bond.
  *   **Aristotelian Tension:** For Aristotle, gifts create friendship, not debt. But in Belmont, gifts *are* debts. The ring is a currency of fidelity. If Belmont is supposed to be the "natural" alternative to Venice, why does it operate on the same logic of binding obligation and penalty?

  ---

  ### III. The Trial: Legal Justice vs. Equity
  In *Nicomachean Ethics* V.10, Aristotle distinguishes between **Legal Justice** (adhering to the written law) and **Equity** (*epieikeia*).
  *   **The Law:** Universal and rigid. Because it must cover all cases, it sometimes fails in specific instances.
  *   **Equity:** A correction of the law. It looks to the *intent* of the legislator rather than the letter of the statute. It is "just, but better than one kind of justice."

  **1. Shylock and the Letter**
  Shylock insists on the validity of the bond. "I stand here for law." He refuses double payment (6,000 ducats) in favor of the specific penalty.
  *   **Aristotelian Analysis:** Is Shylock unjust? Aristotle defines injustice as *pleonexia*—wanting *more* than one's share. Shylock explicitly rejects more money. He wants *exactly* his share.
  *   **The Distortion:** If Shylock wants only what is legally his, he escapes Aristotle's definition of greed. His "vice" is not wanting *too much*, but wanting something that cannot be measured (a pound of flesh) as if it were a commodity.

  **2. Portia and "Mercy"**
  Portia's "Quality of Mercy" speech sounds like an appeal to Equity. She argues that strict justice ("justice in the world") is insufficient for salvation.
  *   **The Trap:** However, Portia does not actually void the bond through mercy. She voids it through a hyper-literal reading of the law (no blood, exactly one pound).
  *   **Critical Question:** Is this Aristotelian Equity? Or is it a perversion of it? Aristotle's equity softens the law to achieve a fairer outcome. Portia uses the *letter* of the law to destroy the *intent* of the contract. She beats Shylock at his own game (literalism) rather than transcending it. Does the play suggest that "Mercy" is just a rhetorical cover for a more sophisticated exercise of power?

  ---

  ### IV. Where the Lens Cracks: What Aristotle Misses
  If we force *The Merchant of Venice* entirely into Aristotle's framework, we lose the play's specific insights about value, language, and identity.

  **1. Incommensurability**
  Aristotle believes money makes different things commensurable (shoes = houses, via currency). He assumes everything relevant to justice *can* be measured.
  *   **The Play's Challenge:** The play insists on things that resist measure. Can flesh be weighed without blood? Can love be measured by a ring? Can mercy be priced?
  *   **The Limit:** Aristotle's system breaks down when the object of exchange is part of the self (flesh) or a symbol of the self (the ring). The play shows that some obligations are **performative**: saying "I pledge" creates a reality that cannot be undone by arithmetic. Aristotle treats exchange as static; Shakespeare treats it as dramatic and transformative.

  **2. The Social Function of Usury**
  Aristotle condemns usury because it is "barren."
  *   **The Play's Challenge:** In Venice, usury funds the trade that sustains the state. Shylock is marginalized, yet his capital is necessary.
  *   **The Limit:** Aristotle writes for a stable *polis* (city-state) of citizens. He cannot account for a cosmopolitan mercantile hub where the "outsider" (the Jew, the stranger) is essential to the economy but excluded from the social bond. Aristotle's ethics assume a shared community of virtue; *Merchant* depicts a community built on exclusion and contractual enforcement.

  **3. Justice as Revenge**
  For Aristotle, justice is a mean; injustice is a vice of excess.
  *   **The Play's Challenge:** Shylock frames his demand not as economic gain, but as retributive justice ("The villainy you teach me I will execute").
  *   **The Limit:** Aristotle has no category for justice that is indistinguishable from revenge. He assumes the law exists to prevent vendetta. In Venice, the law *is* the vehicle for vendetta. The play suggests that without mercy, legal justice is indistinguishable from violence—a insight Aristotle hints at but does not fully theologicalize.

  ---

  ### V. Discussion Questions
  1.  **The Definition of Gain:** Shylock says, "I will have the heart of him if he forfeit." If he gains no money from this, is it still "unnatural acquisition" in Aristotle's sense? Or is it something else entirely (e.g., sacrificial violence)?
  2.  **The Ring Plot:** In Act V, the conflict over the rings threatens the marriage. If Belmont represents the "gift economy," why does Portia treat the ring as property she can demand back? Does the ending restore Aristotelian friendship, or does it reveal that marriage is just another legal contract?
  3.  **Equity or Trickery?** Compare Aristotle's *epieikeia* (equity) with Portia's interpretation of the bond. Does Portia act as an "equitable" judge who corrects the law's rigidity, or does she exploit the law's loopholes? What does this say about the possibility of true mercy in a legal system?
  4.  **The Failure of Measure:** Aristotle believes money allows us to compare unlike things. Where in the play does the attempt to "measure" value (Shylock's flesh, Bassanio's love, Antonio's ships) fail catastrophically?

  ### VI. Suggested Reading Strategy
  *   **Read Aristotle** to understand the *ideal*: How should exchange work? What is the purpose of money? What is the relationship between law and fairness?
  *   **Read Shakespeare** to see the *rupture*: Where do human desires, hatreds, and symbols break the economic model?
  *   **Do not force the fit.** If a scene feels like it contradicts Aristotle, note it. That contradiction is often where the play's deepest critique lies.
