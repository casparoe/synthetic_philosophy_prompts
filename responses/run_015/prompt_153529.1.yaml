answer: |-
  **Final Exam: Philosophy of Logic**
  **Time Allowed:** 45 Minutes
  **Instructions:** Answer the following question in essay form. No external materials permitted.

  **Question:**
  Consider the **License Regress Thesis (LRT)**: *Every valid inference requires an explicit license that is not one of the original premises, and that license itself requires justification by a further license, ad infinitum.*

  Evaluate whether the LRT accurately diagnoses the problem presented in Carroll's "What the Tortoise Said to Achilles." Does the LRT correctly identify why Achilles fails, or does it misdiagnose the issue by treating logical rules as empirical claims requiring evidential support? In your answer, distinguish between epistemic circularity and the logical circularity Carroll depicts, and specify where the regress must stop without appealing merely to "common knowledge."

  ***

  **Model Answer**

  The License Regress Thesis (LRT) offers a compelling formulation of infinite regress, but it ultimately misdiagnoses the problem in Carroll's dialogue by conflating the justification of belief with the justification of inference. While Carroll demonstrates that adding premises cannot force a conclusion, the LRT assumes that logical rules function like empirical claims needing external validation. This category error obscures the distinct nature of logical necessity.

  Carroll's Tortoise forces Achilles to add Modus Ponens as a premise (C) to move from (A) and (B) to (Z). When this fails, the Tortoise demands another premise (D) to validate the link between A, B, C, and Z. The LRT interprets this as a demand for licenses. However, the LRT suggests that every inference needs an explicit *statement* licensing the move. Carroll's deeper point is that no statement can compel inference. If logical rules are treated as premises (licenses cited as propositions), they become inert objects within the argument rather than the engine driving it. The LRT accepts the Tortoise's framing that a rule must be stated to be used. Carroll shows that stating the rule is precisely what prevents its use.

  This reveals a crucial distinction between applying a rule and citing it. To apply Modus Ponens is to perform an inference; to cite it is to make it a premise. The LRT demands citation where application is required. By treating the rule as an object needing a license, the LRT turns logic into an empirical investigation where rules require evidence. This introduces epistemic circularity (needing evidence to trust the rule) rather than the logical circularity Carroll depicts (needing a rule to use a rule). Achilles fails not because he lacks evidence for Modus Ponens, but because he tries to derive the act of inferring from a set of propositions. Deduction is not impossible; rather, the attempt to justify deduction purely propositionally is what fails.

  Therefore, the regress stops not at a final proposition or "common knowledge," but at a primitive practice. We do not infer the validity of Modus Ponens; we enact it. The stopping point is the agent's disposition to reason in certain ways. If one refuses to apply the rule, no amount of additional licenses will compel them. The LRT assumes that justification must always be propositional. Carroll shows that justification bottoms out in normative practice. We accept logical rules not because they are licensed by higher rules, but because they constitute what we mean by "valid inference."

  Consequently, the LRT captures the structural infinite regress but misidentifies its source. It assumes the problem is a lack of explicit authorization. Carroll shows the problem is the attempt to externalize internal norms. The regress ends where reasoning begins: in the unlicensed act of drawing a conclusion. To demand a license for this act is to misunderstand the nature of logic itself.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Understanding Carroll's Dialogue (4 Marks)**
  *   **4:** Clearly explains that adding rules as premises fails to compel conclusion.
  *   **2-3:** Summarizes the dialogue accurately but lacks analysis of *why* it fails.
  *   **0-1:** Incorrect summary or conflates Achilles and Tortoise positions.

  **2. Analysis of the License Regress Thesis (LRT) (6 Marks)**
  *   **5-6 (A Grade):** Identifies that LRT misdiagnoses the problem by treating rules as empirical claims/premises. Distinguishes LRT's demand for explicit licenses from Carroll's demonstration of rule-application.
  *   **3-4 (B Grade):** Correctly explains Carroll but treats LRT as merely a restatement of Carroll's problem without noting the category error (treating rules as claims).
  *   **0-2:** Accepts LRT as correct without critique or fails to connect it to the dialogue.

  **3. Key Philosophical Distinctions (6 Marks)**
  *   **Applying vs. Citing (2 Marks):** Explicitly distinguishes using a rule (practice) from stating a rule (proposition).
  *   **Epistemic vs. Logical Circularity (2 Marks):** Explains that LRT implies a need for evidence (epistemic), whereas Carroll shows a structural impossibility (logical).
  *   **The Stopping Point (2 Marks):** Identifies the stop as practice/disposition/normativity. *Note: Answers relying solely on "common knowledge" or "intuition" without elaboration cap at 1 mark for this section.*

  **4. Argumentation and Clarity (4 Marks)**
  *   **4:** Coherent thesis, logical flow, precise terminology.
  *   **2-3:** Understandable but disjointed or vague.
  *   **0-1:** Difficult to follow or significant grammatical issues obscuring meaning.

  **Differentiation Guide (A vs. B)**
  *   **B Answer:** Gets Carroll right (infinite regress of premises) but argues LRT is basically the same thing. Says the regress stops at "self-evident truths."
  *   **A Answer:** Argues LRT *diverges* from Carroll by assuming rules need evidential support. Argues the regress stops at *practice* (doing logic vs. talking about logic). Explicitly notes that deduction is not impossible, only propositional justification of deduction is.
