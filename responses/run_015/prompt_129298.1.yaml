      *   *Mill's View:* Mill *does* distinguish between forcing an opinion and forcing the *conditions* for forming an opinion. He supports compulsory education and state examinations (*On Liberty*, Ch. 5). However, he draws a line at *what* is taught.
      *   *Analysis:* The "steelman slot" forces the *content* of the discourse environment, not just the fact of education. It's closer to dictating a curriculum than setting a standard.
