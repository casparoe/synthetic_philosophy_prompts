      *   *Breakdown:* Mill assumed that if you *could* speak, you could be heard (in the aggregate). Algorithms make speech possible but invisible. This is a structural barrier Mill didn't fully anticipate. However, Mill also trusted that truth *would* rise if free. If algorithms suppress truth, that's a market failure.
      *   *User's Error:* Mill might not see an algorithm as "opinion pressure" in the moral sense. It's a private business arrangement. Unless it amounts to a monopoly on truth, he might be less concerned about the *mechanism* than the *outcome*.
