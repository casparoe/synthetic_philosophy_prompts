  I want you to tell me how fair this summary is. which parts would an actual archivist or historian of record-keeping accept, which bits are sneaky misrepresentations or overstatements, and does the conclusion — that historians reproduce domination just by using archives — actually survive once you correct the errors? please be straight with me: if my premise is muddled or I'm mixing up seperate theories, say so plainly rather than politely going along with it.

