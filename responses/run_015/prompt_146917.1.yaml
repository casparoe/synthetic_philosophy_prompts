  1. bottom line — short paragraph, about 100 words, is the summary fair overall?
  2. sentence-by-sentence audit — go through the summary and flag what's accurate, what's a stretch, and what a defender would object to (around 250 words).
  3. does the conclusion follow? — check whether 'historians reproduce domination' holds up once the misrepresentations are stripped out (around 150 words).
  4. pushback on my request — if there's a confused premise here, or if the task doesn't make sense as posed, say it clearly (around 100 words).

  please don't give me a bibliography or reading list — I can't check them without recieveing a pile of books, and I'm asking you to analyse the ideas, not send me away. also keep it casual but precise, and I'm definatly not asking for a generic essay on archives.
