  hey — I'm a software engineer with zero formal philosophy training, so go easy on me. I was reading a popular history blog about archives and power (can't remember the name, not important, definatly not a academic source) and they summarised a view that sounds mostly right but feels like it's overreaching at the end. here's the gist, paraphrased, not a direct quote:

