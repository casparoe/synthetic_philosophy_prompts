      *   Flag omissions? Yes.
      *   Tone appropriate? Yes.

      *(Self-Correction during drafting)*: I initially thought about putting Synthetic Bio higher. But for a *trade* book, Medicine is more relatable. Synthetic bio is cooler but more niche. Drift is essential for the "what is evolution" context. I'll stick with Medicine > Drift > Synthetic.
      *Wait, one major omission:* The **Mechanistic Framework (MDC)**. For a physiologist, this is actually *more* relevant than SE vs CR. CR is often used *within* mechanisms. SE is used *across* generations. The user is a physiologist. They care about *how* the kidney works. The MDC framework (Machamer, Darden, Craver 2000) defines function as the role a component plays in a mechanism. This is basically a sophisticated Cummins view but tailored for mechanistic explanation. I must highlight this.

      *Revised Plan:*
