answer: |-
  The debate survives translation into chemistry intact, though it shifts from metaphysics to operational pragmatics.

  **The Four Positions in Chemical Vocabulary**

  1.  **Platonic Realism:** The 'Ideal Structure' (defined by a specific Space Group and Wyckoff positions) exists independently of any physical crystal, much like the entries in the Cambridge Structural Database exist before you grow the sample. The perfect calcite lattice is a Form in the realm of symmetry operations; any crystal you grow is merely a flawed copy attempting to instantiate that perfect symmetry.
  2.  **Aristotelian Realism:** The structure exists only insofar as it is instantiated in the lattice itself. There is no 'Space Group' floating in abstraction; there is only the arrangement of atoms in this specific chunk of calcium carbonate. The universal 'calcite' is real, but it has no existence outside the particulars that embody it.
  3.  **Resemblance Nominalism:** There is no such entity as 'calcite' or 'Space Group R-3c'. There are only individual crystals that happen to produce similar powder patterns. We apply the label 'calcite' for convenience because the diffraction peaks resemble one another within experimental error, but there is no shared ontological glue holding them together.
  4.  **Trope Theory:** Each crystal possesses its own particular property instances. This unit cell has *a* = 4.989 Å, while that one has *a* = 4.991 Å; these are distinct 'tropes' of cell dimensions. We group them together because these particular properties resemble each other closely enough to satisfy the search criteria in our compound database.

  **Residue Report: Mapping and Strain**

  *   **Platonic Realism:**
      *   *Clean Map:* The International Tables for Crystallography function perfectly as the realm of Forms; the 230 Space Groups exist mathematically regardless of physical instantiation.
      *   *Strained:* No physical crystal is perfect; thermal motion and defects mean the Form is never fully realised, forcing you to treat the 'Form' as an asymptotic limit rather than an existing entity.
      *   *Inexpressible:* The ontology of the Tables. Are they discovered (real) or invented (conceptual)? Chemistry cannot answer where the Tables 'exist' when no chemist is consulting them.
  *   **Aristotelian Realism:**
      *   *Clean Map:* This aligns with the bench reality; if you cannot grow it or detect it via diffraction, the structure effectively does not exist for your purposes.
      *   *Strained:* It struggles with predicted polymorphs. If crystal structure prediction (CSP) identifies a stable lattice that has never been synthesised, Aristotelianism must deny it reality, whereas your screening protocols treat it as a viable target.
      *   *Inexpressible:* The normative force of symmetry. Why is a deviation from the Space Group considered an 'error' or 'strain' rather than just a different particular? Aristotelianism lacks the ideal standard to judge the deviation against.
  *   **Resemblance Nominalism:**
      *   *Clean Map:* Database searching is purely nominalist; you are matching patterns based on similarity metrics, not accessing a shared universal essence.
      *   *Strained:* It cannot easily account for chemical laws. Stoichiometry and valency behave as if there is a real 'Carbon-ness' dictating behaviour, not just a resemblance between carbon atoms.
      *   *Inexpressible:* Causal power. Why does every crystal labelled 'calcite' cleave rhombohedrally? Nominalism says 'because they resemble each other', which is circular; Realism says 'because they share a structure', which explains the causality.
  *   **Trope Theory:**
      *   *Clean Map:* This fits the Rietveld refinement process perfectly. Every parameter you refine is a particular instance subject to standard uncertainty; no two refinements yield identical numbers.
      *   *Strained:* Chemical practice collapses these tropes immediately. You report the average unit cell, not the distribution of tropes, effectively smuggling a universal back in via the mean value.
      *   *Inexpressible:* The threshold of resemblance. Trope theory cannot specify *how much* variance in cell parameters is permitted before the crystal is no longer 'calcite' without appealing to an external standard (a universal).

  **The Smuggling Check: Is Your Vocabulary Inherently Nominalist?**

  Your hunch that structure and composition did all the work is half-correct, but you are smuggling Realism into a nominalist framework. When you search a database using a molecular formula and Space Group as keys, you are treating those keys as Universals. You assume that 'C-12' and 'C-14' are both 'Carbon' because they share the universal property of Atomic Number 6, not merely because they resemble each other. If your vocabulary were purely nominalist, the Periodic Table would be merely a clustering algorithm rather than a statement about nuclear charge essentialism.

  However, you are also fixing parameters, as you suspected. By reporting a single set of unit cell parameters with error bars, you are averaging out the tropes to create a functional universal for the sake of publication. The vocabulary allows for both: the raw data (diffractogram spots) is nominalist/trope-based, but the model (refined structure) is realist. The debate does not dissolve; it becomes the tension between the data (particulars) and the model (universals).

  **Confidence Verdicts**

  *   **Overall Verdict (Debate Survives):** High Confidence. The tension between ideal models and experimental data is structurally identical to the tension between universals and particulars.
  *   **Translation of Trope Theory:** Medium Confidence. While unit cell variations fit well, chemists rarely ontologise individual property instances, making this a slightly forced fit compared to the others.
  *   **Assessment of User's Hunch:** High Confidence. You are correct that you don't *need* metaphysics at the bench, but incorrect that this dissolves the problem; you simply operationalise realism to make prediction possible.

  **Least Sure Point**
  I am least certain about the status of **hypothetical polymorphs** in the Aristotelian translation. In pharma screening, a predicted stable polymorph is treated as 'real' enough to patent or search for, even if never instantiated. Whether this counts as an Aristotelian potentiality or a Platonic Form is a boundary case where the chemical vocabulary becomes ambiguous.
