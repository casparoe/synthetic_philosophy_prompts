  3.  **Step 1: The First Foundational Idea:**
      *   What makes presentism a *problem* rather than just a bias?
      *   It's the distinction between *evaluation* (moral judgment) and *explanation* (causal understanding).
      *   If we condemn, we stop investigating.
      *   *Idea:* "Judgment terminates inquiry." (Or: "Condemnation is not explanation.")

  4.  **Step 2: The Carrying Example:**
