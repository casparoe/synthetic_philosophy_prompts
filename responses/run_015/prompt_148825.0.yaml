      *   *Actually, let's go with **19th-Century Imperialism/Colonial Administration** (specifically something like the British in India or the Scramble for Africa).*
      *   *Better yet:* **The Nuremberg Trials.**
      *   *Why:* It literally invented "Crimes Against Humanity." It is the moment presentism was *institutionalized* as law (ex post facto). It forces the question: Is it fair to judge them by laws that didn't exist? But if we don't, is there justice?
      *   *Let's pivot to something more social/cultural for undergrads.* **The 1920s Eugenics Movement in the US.**
      *   *Why:* It wasn't "Nazis." It was progressives. It was law. It forces students to see that "present values" (human rights) weren't universal, but "past values" (science/race) weren't just "evil," they were "rational" within that framework.
      *   *Decision:* **US Eugenics (1920s-30s).**
      *   *Needs:* Connection to progressive politics (not just racists), legal backing (Buck v. Bell), and scientific consensus of the time.
