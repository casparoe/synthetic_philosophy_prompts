answer: |-
  ### 1. The Foundational Idea
  **Intelligibility vs. Justification.**
  You must establish this distinction before defining presentism. If students think the goal of history is to render a verdict (Justification), presentism seems like a rule of evidence ("don't use new laws"). If they understand the goal is to make the past comprehensible (Intelligibility), presentism becomes a methodological error that destroys data.
  *   **The Hook:** "If you conclude a historical actor was simply 'evil' or 'stupid,' you have stopped doing history. You have closed the file. Presentism is the habit of closing the file too early."

  ### 2. The Carrying Example: *Buck v. Bell* (US Eugenics, 1927)
  Do not use Columbus or the Atomic Bomb; students arrive with rehearsed moral scripts for those. Use the Supreme Court case that authorized the forced sterilization of Carrie Buck, written by liberal icon Oliver Wendell Holmes Jr. ("Three generations of imbeciles are enough").

  *   **What it MUST have:**
      *   **Consensus:** Evidence that this was not a fringe view but supported by progressives, scientists, and both political parties.
      *   **Logic:** Clear primary source text showing the *reasoning* (public health, economic efficiency, scientific advancement) rather than just the *ruling*.
      *   **Proximity:** It must feel close enough to modern values (science, welfare, state protection) that students can see how the logic *could* seem sound, not just alien.
  *   **What it MUST lack:**
      *   **A Villain:** Do not frame Holmes as a racist monster. Frame him as a jurist applying the best available knowledge of his time. If there is a clear villain, students will retreat to moral condemnation and bypass the methodological problem.
      *   **Hindsight Clarity:** Avoid discussing the later discrediting of eugenics in the first pass. Let them sit with the fact that this was considered "progressive" then.

  ### 3. Mapping the Misconceptions
  Students will resist this in two waves. You must intercept them at specific points in the seminar flow.

  **Wave 1: The Relativist Trap ("So history is just opinion?")**
  *   **When it arises:** Immediately after you explain that we cannot judge the past by current moral standards. They will hear "moral suspension" and equate it to "truth suspension."
  *   **Where to head it off:** **Before** you move to the second example.
  *   **The Intervention:** Distinguish *moral judgment* from *causal explanation*. Tell them: "Saying 'we understand why they did this' is not the same as saying 'what they did was okay.' Science explains how a virus spreads; it doesn't endorse the virus. History explains how an atrocity happened; it doesn't endorse the atrocity."

  **Wave 2: The Paralysis Trap ("So we should only use past values?")**
  *   **When it arises:** After they accept they shouldn't judge, they will over-correct and ask if they are forbidden from criticizing slavery, genocide, etc., using modern human rights frameworks.
  *   **Where to head it off:** **During the synthesis phase**, just before the check question.
  *   **The Intervention:** Clarify that historians *do* judge, but they separate the *analysis* from the *conclusion*. "You can write a book arguing the past was morally bankrupt, but you cannot use that conclusion as your *method* of inquiry. You must explain the mechanism before you render the verdict."

  ### 4. The Check Question
  Do not ask "Why does context matter?" (They will parrot the phrase). Do not ask "Is presentism bad?" (They will say yes).

  **Ask this:**
  > "If I successfully explain the *internal logic* that led a historical actor to commit an atrocity, have I **excused** the atrocity? If your answer is 'no,' explain what work is left for the historian to do after the explanation is finished."

  *   **Pass:** They identify that *explanation* (causality) and *exoneration* (moral absolution) are separate categories, and that the remaining work is ethical judgment or contemporary application.
  *   **Fail:** They conflate understanding with forgiving, or they claim the explanation *makes* it less bad.

  ### 5. What to Leave Out
  **The Ontological Debate.**
  Do not introduce the argument that "presentism is inevitable because we are stuck in the present." (e.g., Croce's "All history is contemporary history").
  *   **Why:** For a one-session intro to non-majors, this is a philosophical black hole. It suggests the problem is unsolvable, which encourages nihilism ("Why try if we can't escape it?").
  *   **Focus:** Treat presentism as a *craft error* (like using a dirty microscope), not an *existential condition*. Keep it practical: How do we write better history today? not "Is truth possible?"
