      *   *Why:* It looks like "progress" (treating the mentally ill) but involved involuntary commitment and loss of rights.
      *   *Actually, the prompt asks for "one carrying example."* Let's choose **The Nuremberg Trials**.
      *   *Reasoning:* It is the *ur-text* of presentism. The defense *was* "ex post facto law." The prosecution *was* "universal morality." It crystallizes the tension perfectly.
      *   *Wait, non-majors might find legal theory dry.*
