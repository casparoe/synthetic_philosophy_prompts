  5.  **Step 3: Mapping Misconceptions:**
      *   *Misconception 1:* "So history is just opinion/relativism." (If we can't judge, nothing is true.)
      *   *Misconception 2:* "So we must only use past values." (Moral paralysis.)
      *   *Sequence:*
          1.  Intro Example -> 2. Define Presentism -> 3. Misconception 1 (Relativism) -> 4. Correction -> 5. Misconception 2 (Moral Paralysis) -> 6. Correction -> 7. Synthesis.
      *   *Head off Relativism:* Immediately after defining the problem. Emphasize that *understanding* causes is objective, even if *judging* is subjective.
      *   *Head off Paralysis:* After they grasp understanding. Clarify that historians *can* judge, but must distinguish between *historical analysis* and *moral commentary*.

  6.  **Step 4: The Check Question:**
      *   Needs to avoid "Context matters" (the buzzword).
      *   Needs to force a choice between explanation and judgment.
      *   *Draft:* "Was eugenics wrong?" (Too easy).
      *   *Draft:* "How do we study it?" (Too vague).
      *   *Better:* "If you explain *why* a historical actor made a choice using their own logic, have you excused the choice? Why or why not?"
      *   *Refinement:* "Does explaining the *logic* of a past atrocity reduce its *horror*? Why is that distinction necessary for a historian?"

