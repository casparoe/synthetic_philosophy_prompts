answer: |-
  Here is the argument, drawn from both the text you're reading and the spreadsheets you're filling out.

  ### 1. Is the Scale Discovered or Created?
  You are asking whether the dollar figures in your manual measure a magnitude that is already there (ontological commensurability) or whether the practice creates the scale itself (conventional commensurability).

  Having sat in the meetings where those numbers are set, I can tell you: **The practice presupposes the Aristotelian view.** The numbers are by agreement, not by nature.

  When your agency sets the "Value of a Statistical Life" (VSL), they are not sending surveyors out to measure the metaphysical weight of a human soul. They are looking at wage premiums for risky jobs and insurance payouts to derive a number that allows the spreadsheet to balance. It is a convention established to solve a coordination problem: how to allocate limited public resources across competing needs.

  However, there is a crucial divergence from Aristotle. For Aristotle, the convention is grounded in *reciprocal need*—I build shoes, you build houses, we exchange based on what we need to sustain the polis. In your DOT manual, the convention is grounded in *administrative tractability*. The scale is created to make the decision possible, not necessarily to reflect the true structure of value.

  **The Tension:** The agency talks *as if* the numbers are real measurements when it justifies a project ("This yields $50M in benefits"), but they talk *as if* the numbers are conventional when they defend the limits ("We can't put a price on grief"). This isn't just hypocrisy; it's a necessary fiction. If they admitted the scale was purely conventional every time, the public would revolt ("You're just making up the price of my life!"). If they claimed it was purely natural every time, the public would revolt ("How dare you equate a wetland with travel time!"). They need the ambiguity to function.

  ### 2. The Limits of Exchange: Watersheds and Grief
  You asked if the trading of credits across distance requires real commensurability, while the bans are just politics. It is the opposite.

  **Mitigation Banking (The Trading):** This works *not* because an acre here is ontologically identical to an acre there, but because the agency has defined the "need" abstractly enough to make them substitutable. If the need is "wetland function" (filtration, flood control), and the science says Function A ≈ Function B, the exchange holds. This is Aristotelian exchange based on need.

  **The Watershed Boundary (The Cap):** The rule against trading across watersheds admits that commensurability has a breaking point. Hydrology is local. An acre of wetland in Watershed A cannot satisfy the need for flood control in Watershed B. Here, the "need" is specific, not abstract. Aristotle would approve: exchange is only just if it satisfies the specific need of the parties involved. If the need isn't met, the "equality" in exchange is false.

  **The Grief/Community Ban (The Hard Stop):** This is the most philosophically interesting part. Your econ roommate says "revealed preference," implying that if we calculated it right, we could find the price. The agency says "money can't make you whole."

  This presupposes that some goods are **lexically prior** to the metric. In the spreadsheet, these goods are treated as *constraints*, not *variables*.
  *   **Variable:** Travel time. (Can be traded off against cost).
  *   **Constraint:** Community destruction. (Cannot be traded off).

  This contradicts the logic of the rest of the manual. If money is the universal measure of value, then *everything* should have a price, even if it's a high one. By refusing to price grief, the agency is admitting that the cost-benefit framework is not a complete theory of the good. It is a tool for managing *resources*, not a tool for adjudicating *rights* or *meanings*. They are secretly operating with a pluralistic theory of value (some things are for exchange, some are not) while using a monistic tool (the dollar).

  ### 3. Time, Banking, and Barren Money
  Aristotle's argument that money is "barren" and lending at interest is unnatural is often misunderstood. He means money is a medium of exchange, not a source of production. A cow breeds a calf; a coin does not breed a coin.

  **Mitigation Banking:** This is not lending at interest. It is closer to storing grain. You preserve a wetland now (store the grain) to use the credit later (eat the grain). Aristotle would likely accept this, provided the "credit" represents actual ecological capacity stored, not money lent out to generate more money. It is the banking of *potentiality*, not the breeding of currency.

  **Discounting:** Here is where Aristotle would object. Your manual almost certainly applies a "discount rate" to future benefits. A life saved ten years from now is worth less in present-value dollars than a life saved today. This treats time itself as a commodity that can be arbitraged. It implies that the future is substitutable for the present at a specific rate.
  *   **Aristotle's Critique:** Need is not discountable. If a person drowns in ten years, the loss is absolute. Discounting assumes that the "need" of the future polis is less weighty than the "need" of the current polis.
  *   **Does it force them to stop?** No, because the agency is not a moral agent; it is a budgetary agent. They *must* discount to compare projects with different lifespans. But philosophically, this is the point where the manual commits to a controversial view: **Temporal Utilitarianism.** It assumes the good can be aggregated across time and that proximity matters. A rival view (Rights-Based or Stewardship) would forbid discounting human safety, treating future lives as having equal weight to present ones, which would radically change which projects get built (likely favoring long-term durability over short-term efficiency).

  ### 4. Underdetermination vs. Secret Commitment
  Finally, where is the practice underdetermined, and where is it secretly committed?

  **Underdetermined:**
  A Utilitarian (maximize total welfare) and a Pragmatist (minimize conflict and keep the lights on) could write the exact same manual.
  *   The Utilitarian says: "We maximize dollars because that equals happiness."
  *   The Pragmatist says: "We maximize dollars because it's the only language engineers and politicians both speak."
  The spreadsheet looks the same. The *justification* differs, but the output is identical. This is why your TA talks about commensurability as a theoretical problem, while your supervisors talk about it as a formatting issue.

  **Secret Commitment:**
  The manual is secretly committed to **Radical Substitutability**.
  By putting everything into a single sum (Net Present Value), the manual asserts that *any* loss can be compensated by *any* gain, provided the number is big enough.
  *   **The Contradiction:** This is directly contradicted by the "no grief" rule and the watershed boundaries.
  *   **The Secret:** The agency wants the efficiency of substitutability without the moral cost. They want to trade wetlands for highways (substitutability) but refuse to trade neighborhoods for highways (non-substitutability).
  *   **The Rival Manual:** If they took the "money can't make you whole" claim seriously, the manual wouldn't be a spreadsheet sum. It would be a **Checklist of Constraints**.
      *   *Current Manual:* (Benefits - Costs) > 0? Yes → Build.
      *   *Rival Manual:* Does it destroy a neighborhood? Yes → Stop. Does it destroy a wetland? Yes → Mitigate. Is travel time improved? Yes → Proceed.
      *   In the rival manual, you cannot "net out" a destroyed neighborhood against 1,000 hours of saved travel time. The goods are incommensurable.

  ### Summary
  Your DOT practice presupposes that commensurability is a **regulatory technology**, not a metaphysical truth. It creates a scale by agreement to solve specific problems (allocation), but it relies on external moral intuitions (watershed boundaries, grief bans) to prevent the technology from consuming the very things it's supposed to serve.

  Aristotle would say you are treating money as a measure of need, which is correct, but you have abstracted "need" so far from human flourishing that you risk satisfying the spreadsheet while failing the city. The "barrenness" of money isn't the problem; the barrenness of the *definition of need* is. You are measuring everything, but you have forbidden yourself from asking what the measurements are *for*.
