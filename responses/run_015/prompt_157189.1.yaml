      *   **Constraint:** Write in **British English** (spellings, vocabulary).

  2.  **Evaluate the Core Argument (Germany):**
      *   *Kirchensteuer* is indeed a surcharge on income tax (usually 8-9%) collected by the state on behalf of religious communities recognised as *Körperschaften des öffentlichen Rechts* (corporations under public law).
      *   It is not an 'established church' in the English sense because there is no state church. Membership is voluntary (in theory, though tied to tax registration). One can opt-out by leaving the church (*Kirchenaustritt*).
      *   'Fiscal membership' is a decent framing. It highlights the contractual/financial nature vs. the constitutional/structural nature of the CofE.
      *   Is it just administrative convenience? Historically, it was compensation for secularisation (1803) and later formalised in the Weimar Constitution and Basic Law. It's more than convenience; it's a form of state recognition without state control.

  3.  **Evaluate the French Case ('Negative Establishment'):**
      *   *Laïcité* (1905 law) separates church and state. The state doesn't recognise or fund religions (with exceptions like Alsace-Moselle).
