  Here is a practical workflow for your team. It translates the Hart-Fuller debate into an operational compliance checklist for automated eligibility systems.

  I have corrected the spelling of **promulgation** in the document below for your final draft.

  ***

  # Automated Eligibility Rule Review Protocol (AERRP)

  **Purpose:** To validate draft algorithmic rules against legal authority (Hart) and procedural integrity (Fuller).
  **Usage:** Run this checklist before any code is deployed to production.
  **Decision Logic:**
  1.  **Hart Gate:** Authority Check. (Pass/Fail)
  2.  **Fuller Gate:** Internal Morality Check. (Pass/Fail/Flag)
  3.  **Final Disposition:** Approve, Reject, or Escalate.

  ---

  ## Phase 1: The Hart Gate (Rule of Recognition)
  *Theory:* A rule is valid if it originates from a recognized source of authority, regardless of its moral content or procedural flaws.
  *Action:* Verify statutory authorization.

  **1.1 Statutory Basis**
  *   [ ] Is there a specific county ordinance, state statute, or federal regulation authorizing this specific automated check?
  *   [ ] Does the enabling legislation permit *delegated decision-making* to software, or only *decision-support*?

  **1.2 Chain of Command**
  *   [ ] Was the deployment order signed by an official with delegated authority?
  *   [ ] Is the system within the jurisdictional scope of this county office?

  **🛑 STOP POINT 1:**
  *   **If FAIL:** **REJECT.** The system has no legal authority. Do not proceed.
  *   **If PASS:** Proceed to Phase 2.

  ---

  ## Phase 2: The Fuller Gate (Internal Morality of Law)
  *Theory:* A rule that fails eight procedural principles is not just "bad law," it fails to function as law at all. In an automated context, this means the system cannot guide human conduct.
  *Action:* Test the code and data logic against these eight criteria.

  **2.1 Generality (No Ad-Hoc Code)**
  *   [ ] Does the code apply the same logic to all applicant IDs?
  *   [ ] **Test:** Search for hard-coded exceptions (e.g., `if ID == 12345 then approve`).
  *   [ ] **Fail Condition:** Specific individuals are treated outside the general rule.

  **2.2 Promulgation (Visibility)**
  *   [ ] Is the logic accessible to those subject to it?
  *   [ ] **Test:** Is there a plain-language summary published alongside the code?
  *   [ ] **Fail Condition:** The rule exists only in compiled binaries or proprietary weights with no public explanation.

  **2.3 Non-Retroactivity (Time-Binding)**
  *   [ ] Does the rule apply only to conduct/applications occurring *after* deployment?
  *   [ ] **Test:** If the model retrains, does it recalculate *past* eligibility determinations?
  *   [ ] **Fail Condition:** Updating the model changes the legal status of past cases.

  **2.4 Clarity (Intelligibility)**
  *   [ ] Can a caseworker explain *why* a decision was made?
  *   [ ] **Test:** Input test cases. Does the system output a reason code that maps to policy?
  *   [ ] **Fail Condition:** The system outputs a score without a derivable reason (Black Box).

  **2.5 Non-Contradiction (Consistency)**
  *   [ ] Do multiple modules conflict?
  *   [ ] **Test:** Run edge cases where Module A (Income) and Module B (Assets) might trigger opposing flags.
  *   [ ] **Fail Condition:** System returns "Eligible" and "Ineligible" simultaneously without a tie-breaking rule.

  **2.6 Possibility of Compliance (Feasibility)**
  *   [ ] Can an applicant actually provide the required data?
  *   [ ] **Test:** Verify data inputs against reality (e.g., requiring a digital upload from a homeless applicant without kiosk access).
  *   **Fail Condition:** The rule requires data the applicant cannot physically obtain.

  **2.7 Constancy (Stability)**
  *   [ ] How frequently does the logic change?
  *   [ ] **Test:** Check the version control commit history.
  *   [ ] **Fail Condition:** Rules change daily/weekly without notice, making it impossible for applicants to learn requirements.

  **2.8 Congruence (Alignment)**
  *   [ ] Does the code match the written policy?
  *   [ ] **Test:** Audit a sample of decisions against the written policy manual.
  *   [ ] **Fail Condition:** The code implements a stricter or looser standard than the written law.

  **🛑 STOP POINT 2:**
  *   **If Critical Fail (Retroactivity, Promulgation, Clarity):** **REJECT.** The system cannot guide conduct; it is not functioning law.
  *   **If Minor Fail (Constancy, Congruence):** **FLAG TO BOARD.** Valid authority, but procedurally flawed. Requires human override or policy amendment.
  *   **If PASS:** Proceed to Phase 3.

  ---

  ## Phase 3: Conflict Resolution & Disposition
  *Theory:* Hart and Fuller may conflict. Hart says "It's valid law" (Authority exists); Fuller says "It's not law" (Procedural failure).

  **3.1 The Hart-Fuller Conflict Check**
  *   [ ] Did the system pass Phase 1 (Hart) but fail Phase 2 (Fuller)?
  *   [ ] **Action:** This is the "Valid but Unjust/Flawed" zone.

  **3.2 Final Disposition Matrix**

  | Phase 1 (Hart) | Phase 2 (Fuller) | Disposition | Action |
  | :--- | :--- | :--- | :--- |
  | **FAIL** | N/A | **REJECT** | No authority. Kill project. |
  | **PASS** | **PASS** | **APPROVE** | Deploy to production. |
  | **PASS** | **FAIL (Critical)** | **REJECT** | Procedurally void. Cannot implement. |
  | **PASS** | **FAIL (Minor)** | **ESCALATE** | Send to Policy Board. Note: "Legally authorized but procedurally risky." |

  ---

  ## Application Scenarios

  Here is how your team applies this protocol to the two proposals you mentioned.

  ### Proposal A: Retro-Active Risk-Score Update
  *Description:* The data science team wants to retrain the fraud-risk model using new data. The new model will be applied to *past* cases to identify overpayments that were legal under the old model.

  *   **Phase 1 (Hart):** **PASS.** The County Board authorized the use of risk models for eligibility and recovery.
  *   **Phase 2 (Fuller):**
      *   *Test 2.3 (Non-Retroactivity):* **FAIL.** Applying a new rule to past conduct violates the principle that law must be forward-facing. Applicants could not have complied with a rule that didn't exist.
      *   *Test 2.8 (Congruence):* **FAIL.** The written policy states eligibility is determined at time of application.
  *   **Phase 3 (Disposition):** **REJECT.**
  *   **Reasoning:** While Hart acknowledges the authority exists, Fuller's test reveals this destroys the system's ability to guide conduct. An applicant cannot follow a rule that changes backwards. This is a Critical Fail.

  ### Proposal B: The "Human-Unreadable" Algorithm
  *Description:* A deep-learning neural network that determines eligibility. It is highly accurate, authorized by the Board, but the decision logic is buried in weights that no human can interpret. There is no plain-language summary.

  *   **Phase 1 (Hart):** **PASS.** The County Board authorized the system. Under Positivism, this is valid law because the source is recognized.
  *   **Phase 2 (Fuller):**
      *   *Test 2.2 (Promulgation):* **FAIL.** The rule is buried in code/weights. The public cannot know the law.
      *   *Test 2.4 (Clarity):* **FAIL.** Caseworkers cannot explain denials.
  *   **Phase 3 (Disposition):** **ESCALATE TO BOARD.**
  *   **Reasoning:** This is the core Hart-Fuller conflict.
      *   *Hart View:* It is valid law because the Board said so.
      *   *Fuller View:* It is not law because it fails promulgation and clarity.
      *   *Analyst Recommendation:* Flag as **Valid but Procedurally Void.** Do not deploy. Recommend the Board either (a) demand an explainable model (fix Fuller) or (b) explicitly pass an ordinance stating "Code is Law" even if unreadable (reinforce Hart, but politically risky).

  ***

  **Note for the Team:**
  When you hit the **ESCALATE** status, your memo should read: *"System possesses legal authority (Hart), but fails the internal morality of law (Fuller). Implementation risks legal challenge on due process grounds regarding notice and clarity."*
