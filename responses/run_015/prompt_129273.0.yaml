  ### Supervisory Preamble: Selecting the Framing

  Before we settle on the text, let's look at the framing options. I want you to see why we are choosing one path over the others, because you will need to defend this boundary during the project.

  **Framing 1 (Discarded): The Epistemic Access Problem.**
  This framing asks: "How can we ever know we have the true confounder?" It treats the noisy-partition problem as a skeptical challenge to causal knowledge.
  *Why I'm rejecting it:* It's too broad. A twelve-week project cannot solve skepticism. It also invites the committee to say, "This is just the old problem of induction; move on." It doesn't engage with the specific mechanics of Simpson's Paradox.

  **Framing 2 (Discarded): The Decision-Theoretic Optimization.**
  This framing asks: "Given a proxy with known reliability, which estimate maximizes expected utility?"
  *Why I'm rejecting it:* This turns your project into applied statistics. If you do this, you are competing with biostatisticians on their turf. You will lose. The philosophy must be in the *conceptual preconditions* of the decision, not the calculation of the decision itself.

  **Framing 3 (Selected): The Operational Gap in Causal Dissolution.**
  This framing asks: "Does the causal dissolution of Simpson's Paradox hold when the causal structure is operationally inaccessible?" It treats the "noisy partition" not just as measurement error, but as a structural mismatch between the *causal graph* (the territory) and the *data matrix* (the map).
  *Why this wins:* It allows you to use formal tools without doing pure statistics. It positions the "standard advice" (condition on the confounder) as an idealization that requires philosophical scrutiny when applied to real science. It fits the 6,000-word limit because it focuses on the *validity of the advice* rather than deriving new estimators.

  Below is the proposal text based on Framing 3. I have embedded the "Committee Passage" as a distinct section, as this is often required in interdisciplinary funding applications.

  ***

  # Project Proposal: The Operational Gap in Causal Dissolutions of Simpson's Paradox

  **Project Title:** The Noisy Partition: Measurement Uncertainty and the Stability of Causal Advice in Simpson's Paradox
  **Duration:** 12 Weeks
  **Deliverable:** 6,000-word Philosophical Analysis with Formal Illustration

  ### 1. Research Question
  Standard causal methodology dissolves Simpson's Paradox by instructing researchers to condition on the confounder rather than the aggregate data. This advice presupposes that the variable available for conditioning is identical to the confounder posited in the causal structure. This project asks: **Under what conditions does stratification on a *proxy* variable preserve the normative force of causal advice in Simpson's Paradox scenarios?**

  Specifically, I investigate the "noisy-partition problem": the risk that stratifying on an imperfect measure of a confounder (e.g., disease stage rather than underlying pathology) fails to resolve the paradox, or worse, introduces new bias. The project seeks to determine whether the resolution of Simpson's Paradox is a matter of causal structure alone, or a joint function of causal structure and measurement reliability.

  ### 2. Background and Gap in Existing Approaches
  Simpson's Paradox occurs when a trend present in several different groups of data disappears or reverses when these groups are combined. The dominant contemporary resolution, rooted in causal graphical models, argues that the paradox is not probabilistic but causal: one must condition on the common cause (confounder) to identify the causal effect. Once the correct causal graph is specified, the "paradox" dissolves into a prescription for which conditional probability to calculate.

  However, this dissolution relies on an idealization: that the researcher can identify and measure the confounding variable precisely. In biomedical and social contexts, the variables available for stratification are often proxies (e.g., triage category as a proxy for severity, department as a proxy for selection bias).

  Existing approaches leave a gap here:
  1.  **The Causal-Structure Approach:** Treats the variables in the graph as given. It offers no guidance on what to do when the measured variable $Z^*$ is a noisy partition of the true confounder $Z$. It assumes the map matches the territory.
  2.  **The Measurement-Error Approach:** Treats this as a technical problem of attenuation bias or residual confounding. While it offers correction methods (e.g., regression calibration), it treats the *paradox* as incidental. It does not address the specific normative flip: the point at which the "correct" causal advice (stratify) yields a worse decision than the "incorrect" aggregate advice due to measurement noise.

  The philosophical gap is the lack of an account of **actionability**. If the "causal" answer depends on measurement quality to be superior to the "aggregate" answer, then the authority of the causal dissolution is contingent on empirical measurement assumptions, not just logical causal relations.

  ### 3. Methodology and Work Plan
  This project will proceed through three phases over twelve weeks. It will not attempt to derive new statistical estimators, but rather to analyze the conceptual implications of existing measurement constraints on causal advice.

  **Phase 1: Conceptual Taxonomy (Weeks 1-4)**
  I will formalize the distinction between the *causal confounder* (the node in the structural model) and the *operational partition* (the variable in the dataset). I will categorize the ways a proxy can fail: classical measurement error, systematic misclassification, and structural mismatch (where the proxy captures part of the mediator).
  *Deliverable:* A conceptual framework distinguishing "resolvable" noisy partitions from "structurally deceptive" ones.

  **Phase 2: Formal Illustration (Weeks 5-8)**
  I will construct a simplified formal model (a toy DAG with a proxy variable) to demonstrate the "noisy-partition" effect. Unlike a full simulation study, this will not map the entire parameter space. Instead, it will prove an **existence claim**: that there are plausible parameter values where conditioning on the proxy yields a higher mean squared error for decision-making than conditioning on the aggregate, despite the aggregate being causally biased.
  *Deliverable:* A mathematical illustration showing the "crossover point" where proxy stratification becomes inferior to aggregation.

  **Phase 3: Normative Analysis (Weeks 9-12)**
  I will argue for the philosophical implication: that causal advice is not categorical but *conditional on measurement validity*. I will evaluate whether this requires a shift in how we teach and report causal dissolutions of Simpson's Paradox.
  *Deliverable:* The final 6,000-word paper.

  ### 4. Justification of Approach
  Three alternative approaches were considered and rejected for this scope:
  1.  **Formal Sensitivity Analysis:** While valuable, a full sensitivity analysis is a statistical tool, not a philosophical argument. Using it as the primary method would obscure the conceptual question about the *status* of the causal advice. I will use sensitivity logic only to support the existence claim.
  2.  **Purely Conceptual/Metaphysical:** A paper discussing only the "nature of confounding" without formal illustration risks being dismissed as hand-waving by a methodology committee. The toy model is necessary to ground the philosophical claim in the mechanics of inference.
  3.  **Comprehensive Simulation Study:** Mapping the entire space of proxy reliabilities and effect sizes is a biostatistics project, not a philosophy project. It exceeds the twelve-week scope and distracts from the core argument about the *limits of causal prescription*.

  My approach strikes the necessary balance: enough formalism to be rigorous, but focused on the normative implications rather than the computational optimization.

  ### 5. Success and Failure Conditions
  **Success:** The project successfully demonstrates that the standard causal dissolution of Simpson's Paradox is incomplete without a measurement assumption. A successful result provides a clear criterion for when the "causal" answer is epistemically less secure than the "aggregate" answer due to proxy noise.
  **Failure:** The project fails if it turns out that the "noisy-partition problem" is fully subsumed by standard measurement error theory with no residual philosophical puzzle. If existing statistical machinery already provides a complete normative guide for this scenario (i.e., if the "philosophical" question is just "calculate the reliability coefficient"), then the project lacks distinct philosophical content.

  ### 6. Scope Assessment
  This is a single project, provided the formal work remains an *illustration* rather than an *exhaustive mapping*. If the formal model begins to require deriving new bounds for proxy reliability, the scope has expanded into statistics. I will limit the formal work to demonstrating the *possibility* of the reversal, not characterizing its frequency in real-world data.

  ***

  ### Statement of Philosophical Relevance (For the Committee)

  **Why is this a project in Philosophy of Science rather than Statistics?**

  Statistics asks how to calculate the best estimate given a model and data. Philosophy of science asks what justifies the move from the model to the world. This project does not propose a new estimator; it interrogates the *presuppositions* of the standard estimator.

  When a statistician advises, "Condition on the confounder to resolve Simpson's Paradox," they are offering a normative rule. This project argues that this rule relies on a hidden premise: that the confounder is operationalizable without significant structural distortion. By exposing the "noisy-partition problem," I am not doing statistics; I am analyzing the **conditions of applicability** for statistical norms.

  If the "correct" causal analysis yields worse decisions than the "incorrect" aggregate analysis due to measurement noise, then the definition of "correctness" in causal inference requires philosophical clarification. Is a method correct because it aligns with the true causal graph, or because it leads to better interventions? This project examines the tension between *ontological correctness* (matching the graph) and *epistemic reliability* (working with the data). That tension is the domain of philosophy, not mathematics.

  ***

  ### Supervisor's Note to Student

  *This section is for your eyes only. Do not include this in the application.*

  You have a strong core idea here, but you need to be very careful about how you position the "gap." Here is where I think your framing is most vulnerable, and how you should prepare for it.

  **Where the framing is most likely to be wrong:**
  You are betting that the "noisy-partition problem" is a distinct philosophical puzzle. The risk is that it is simply a specific instance of **residual confounding**, which is a well-trodden path in epidemiology and statistics. If the literature already contains standard warnings like "adjusting for a mismeasured confounder can be worse than not adjusting at all," then your "philosophical discovery" might just be a restatement of a known statistical fact. You need to verify early in Phase 1 that the *normative flip* (that the aggregate is sometimes better) isn't already standard textbook advice in applied biostats.

  **The objection I would least like to hear from a statistician:**
  "Measurement error models already handle this. If you specify the reliability of the proxy, you can adjust the estimate. If you don't know the reliability, you do a sensitivity analysis. There is no paradox here, just missing information."
  If a reviewer says this, they are claiming that the *statistics* already solves the *philosophy*. To counter this, you must argue that sensitivity analysis pushes the problem back one step: it requires the researcher to make a judgment about reliability distributions. Your philosophical point is that the *authority* of the causal graph is diminished because it cannot speak to that reliability judgment. The graph says "Condition on Z," but the world gives you "Z*." The graph is silent on the bridge between them. That silence is your territory.

  **What would convince me the project is misconceived:**
  If you find, during your first two weeks of reading, that the "crossover point" (where aggregation beats proxy-stratification) is vanishingly rare in realistic parameter spaces. If it turns out that proxy-stratification is *almost always* better than aggregation, even with noise, then the "problem" is a theoretical curiosity with no methodological weight.
  *How to test this:* Before you commit fully, run a very quick, dirty R simulation. Just 1,000 iterations. Vary the correlation between the Proxy and the True Confounder. Check how often the Proxy-Adjusted Estimate has higher bias than the Crude Estimate. If the Crude Estimate wins less than 5% of the time in plausible scenarios, the project loses its urgency. If it wins 20-30% of the time, you have a genuine problem worth philosophizing about.

  **Final advice:**
  Don't let the formal toy model become the whole project. The committee is funding a philosopher, not a junior statistician. The math is there to serve the argument about *scientific reasoning*, not to demonstrate technical proficiency. Keep the focus on the *advice* given to scientists, not the *calculation* performed by the data.

  Good luck. This is a sharp topic, provided you don't let it drift into pure methodology.
