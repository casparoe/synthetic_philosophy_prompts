prompt: |-
  You are a philosopher of science who works on causal inference and on the methodology of the biomedical and social sciences, and who has supervised a lot of graduate research proposals. Take a few minutes to brainstorm framings before you write, and deliberately set aside the first one or two that occur to you: I want the framing you'd defend, not the first pass.

  I'm a philosophy master's student putting together an application for a departmental summer award — twelve weeks, one supervisor, a deliverable of a paper of about six thousand words — and the committee that reads it is mostly unsympathetic to philosophy-of-statistics projects, so the proposal has to earn its place. Here is my half-formed idea. Whenever I raise Simpson's paradox with anyone who works with data, I get the same dissolution: stop asking a probabilistic question and ask a causal one, condition on the confounder, don't condition on the mediator or the collider, and the reversal stops being paradoxical. I think that advice quietly assumes that the variable you are being told to condition on is the confounder itself, and in the examples people actually argue about it almost never is. Severity, department, stone size, triage category, disease stage: these are recorded proxies for something the argument needs to be about, and stratifying on a proxy of a confounder is a different operation from stratifying on the confounder. Depending on how good the proxy is, the stratified estimate can be no better than the aggregate one, and which of the two you'd rather act on can flip with the quality of the measurement rather than with the causal structure. I've been calling this the noisy-partition problem. If it's a real problem, then the standard dissolution of the paradox is incomplete in a way that matters, and the question of which number to act on starts to look less like a question about causal structure with a determinate answer and more like a decision made under measurement uncertainty. A friend in biostatistics, when I tried this out on her, said that this is just measurement error and that there are methods for it; I don't know whether that's a dismissal or a research program, and I'd like the proposal to have an answer to it.

  So: turn that into the proposal I would actually submit. I need the question stated precisely enough that it has a determinate answer (or a clear explanation of why it doesn't have one), an account of why the existing answers leave it open, the approach I would really follow across twelve weeks, and — this is the part I expect to be hardest — an argument for why that approach rather than the obvious alternatives, by which I mean a formal sensitivity-analysis treatment, a purely conceptual paper about what the effect of a treatment on an outcome even is, and a simulation study that just maps out when proxy adjustment beats aggregating. Tell me what a successful result would look like and what would count as the project failing, and give me an honest scope assessment: if this is really two projects, say so and tell me which half to cut. I also need a short passage addressed to the committee explaining why this is a philosophical project and not a statistics project, since I will definitely be asked. Don't give me a bibliography or a literature review organized around names and papers; refer to positions and arguments by description if you need them and I'll fill in the citations myself. And if you use the familiar kidney-stone and graduate-admissions cases as illustrations, keep them as illustrations and don't attribute them to particular studies or dates — I'll check any sources I end up relying on.

  Finish with a note addressed to me rather than to the committee, in which you drop the proposal voice: tell me where your framing is most likely to be wrong, which objection you would least like to hear from a statistician, and what would convince you that the whole thing is misconceived — for instance that the proxy problem is already handled well enough by existing machinery that this is a statistics problem wearing a philosopher's coat. Be specific about what would change your mind rather than gesturing at general fallibility.
