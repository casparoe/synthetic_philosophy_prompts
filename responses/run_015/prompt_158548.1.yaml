answer: |-
  # The War-Film Night Flowchart

  **How to use:** Start at **Q1**. Follow the **Yes/No** arrows. Keep track of your answers to Q8–Q10, as they act as "modifiers" that apply to whichever main position you land on.

  ### The Branch Points (Questions)

  **Q1. The Just Shooter (Pacifist Exit)**
  *Case:* A soldier on the objectively **just** side shoots an enemy combatant who is currently attacking him.
  *   **Is this act morally permissible?**
      *   **No:** → **Leaf A (Pacifism)**
      *   **Yes:** → Go to Q2.

  **Q2. The Unjust Shooter (The Core Split)**
  *Case:* A soldier on the objectively **unjust** side shoots a soldier on the just side.
  *   **Is this act as morally permissible as the Just Shooter's act?**
      *   **Yes:** → Go to Q3 (Traditionalist Path).
      *   **No:** → Go to Q4 (Revisionist Path).

  **Q3. Dave's Rule (Consequentialist Override)**
  *Case:* Even if the Unjust Shooter is doing wrong (Q2=No), should we publicly teach soldiers they are *equal* because it makes wars end faster?
  *   **Yes:** → **Leaf B (Rule Consequentialism)**
  *   **No:** → (Return to Q4 path, you are a Truth-Revisionist).

  **Q4. The Conscript (Epistemic Excuse)**
  *Case:* The Unjust Soldier was dragged in at gunpoint and lied to about the cause.
  *   **Does this ignorance make him less 'killable' than a volunteer who knows the truth?**
      *   **Yes:** → Go to Q5 (Epistemic Revisionism).
      *   **No:** → Go to Q6 (Objective Revisionism).

  **Q5. The Sleeping Soldier (Liability Basis)**
  *Case:* The Unjust Soldier is asleep in barracks, posing no immediate threat.
  *   **Is he still a valid target?**
      *   **Yes:** → **Leaf C (Responsibility-Based Revisionism)**
      *   **No:** → **Leaf D (Threat-Based Revisionism)**

  **Q6. The Programmer (Civilian Scope)**
  *Case:* A civilian writes targeting software knowing it aids the invasion.
  *   **Is she as 'killable' as the soldier?**
      *   **Yes:** → **Leaf E (Broad Liability Revisionism)**
      *   **No:** → **Leaf F (Narrow Liability Revisionism)**

  **Q7. The Voter (Democratic Liability)**
  *Case:* A citizen voted for the government that started the war.
  *   **Does this make them a valid target?**
      *   **Yes:** → **Leaf G (Total War Revisionism)** *(Rare/Unstable)*
      *   **No:** → (Confirm Leaf F or C).

  **Q8. The Sadist (Motivation)**
  *Case:* The Just Soldier joined only because he loves killing.
  *   **Does this bad motive make his permissible act morally tainted?**
