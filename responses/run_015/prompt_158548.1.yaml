  ---

  ### The Leaves (Positions)

  | Leaf | Name | The Awkward Pill (What you must swallow) | Verdict on Conscript | Verdict on Programmer |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Contingent Pacifism** | Modern war is so messy that *no* actual war meets the "just" criteria, so you can never shoot. | **Not Killable** (Killing is wrong). | **Not Killable** (Killing is wrong). |
  | **B** | **Rule Consequentialism** | You must publicly lie to soldiers that their cause doesn't matter, even though you know it does. | **Killable** (Rule requires equality). | **Not Killable** (Unless rule extends). |
  | **C** | **Responsibility Revisionism** (McMahan) | A soldier who did everything "right" (followed laws, was ignorant) is still essentially a criminal liable to be killed. | **Less Killable** (Reduced responsibility). | **Killable** (If responsible for threat). |
  | **D** | **Threat-Based Revisionism** | You cannot shoot a general planning a genocide if he is currently asleep, but you can shoot a conscript firing in panic. | **Killable** (If currently threatening). | **Not Killable** (No direct threat). |
  | **E** | **Broad Liability Revisionism** | The war extends to factories and offices; a coder is as much a combatant as a rifleman. | **Less Killable** (If less responsible). | **Killable** (Causal responsibility). |
  | **F** | **Narrow Liability Revisionism** | Only those directly posing threats are liable; the voters and funders who caused it are immune. | **Killable** (If threatening). | **Not Killable** (Too remote). |
  | **G** | **Total War Revisionism** | Every citizen who supports the regime is a legitimate target; there is no civilian immunity. | **Killable**. | **Killable**. |
  | **H** | **Traditionalism** (Walzer) | A soldier fighting for a genocidal regime is morally equal to one fighting in self-defense, provided he follows rules of engagement. | **Equally Killable**. | **Not Killable** (Non-combatant status). |

  *(Note: Leaves H and B often overlap in practice, but differ in justification. Leaves C and F are the most common "Revisionist" combo.)*

  ---

  ### Incoherent or Unheld Combinations

  1.  **Threat-Based + Sleeping Soldier Target:** Incoherent. If liability comes *only* from being a threat, a sleeping soldier is not a threat. (Nobody holds this).
  2.  **Responsibility-Based + Voter Immune + Programmer Liable:** Unstable. If liability tracks responsibility, voters are usually *less* responsible than programmers. If you target the programmer, you must explain why the voter who elected the boss is safe. (Rarely held consistently).
  3.  **Traditionalist + Conscript Excuse:** Incoherent. Traditionalism says status (uniform) determines liability, not knowledge or choice. If you excuse the conscript, you are moving toward Revisionism.
  4.  **Pacifist + Just Shooter Permissible:** Logically impossible by definition.

  ### Indistinguishable Leaves

  **Leaf H (Traditionalism) vs. Leaf B (Rule Consequentialism)**
  *   **Why they blur:** In the fog of war, both tell the soldier to treat the enemy as equally killable.
  *   **How to split them:** Ask: *"If you knew for a fact that treating the enemy as unequal would NOT prolong the war, would you still treat them as equal?"*
      *   **Traditionalist:** Yes (It's about rights/status).
      *   **Consequentialist:** No (Then I'd target the unjust ones).

  **Leaf C (Responsibility Revisionism) vs. Leaf H (Traditionalism) regarding the Conscript**
  *   **Why they blur:** Both might agree the ignorant conscript is "excused" or less liable.
  *   **How to split them:** Ask: *"Is the conscript excused because he lacks **guilt** (Revisionist) or because we can't **know** his guilt (Traditionalist)?"*
      *   **Revisionist:** He is objectively less liable because he isn't responsible.
      *   **Traditionalist:** He is equally liable, but we grant an epistemic exemption because we can't judge his mind in the moment.

  ### Notes on Your Specific Requests

  *   **Dave's "Left-over":** This is handled in **Q10**. Most Revisionists (Leaf C) say **Yes** (you killed a non-liable person, even if excused). Traditionalists (Leaf H) usually say **No** (it was a fair fight).
  *   **Facts vs. Evidence:** This is the split between **Q2** (Facts/Objective) and **Q4** (Evidence/Epistemic).
  *   **Uniform/Dodge:** Traditionalists (Leaf H) say the uniform *is* the answer. Revisionists (Leaf C/F) say it is a dodge; responsibility matters more than cloth.
  *   **Mutual Wrong:** If both sides are unjust (Q9/Fog), Revisionists land on "Nobody is liable to be killed" (War is a crime), whereas Traditionalists land on "Everyone is equally liable" (Symmetry of risk).
