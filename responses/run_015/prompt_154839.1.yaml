answer: |-
  So, here's the thing about the usual explanation for why we love sad stories. Normally, we reckon it's because of the 'safe container' idea. You're sitting on your sofa, watching *Schindler's List* or reading *King Lear*, and you know you're safe. You can cry your eyes out, feel proper grief, but you can also pause it, make a cuppa, and walk away. The pain is real, but the consequences aren't. That's the aesthetic distance doing its job.

  But this whole setup gets properly wobbly when you step into interactive live theatre or VR tragedies.

  Imagine you're wearing a VR headset. You're in a trench war scenario. A wounded soldier crawls towards you, begging for water. You have a canteen, but only enough for one person. There's another soldier nearby who needs it too. You have to physically reach out and choose who gets it. In a film, you're watching a character make that choice. In VR, *you* are making the choice. Your heart rate spikes, your palms sweat, and if you choose wrong, you feel a genuine pang of guilt.

  Here's where the conceptual issue kicks in. For the art to work, you need emotional authenticity—you need to feel like the grief and guilt are real. But if the immersion is too successful, the 'safe container' bursts. You're no longer observing tragedy; you're perpetrating it. The aesthetic distance collapses. If you feel too implicated, it stops being an aesthetic experience and starts feeling like actual trauma or abuse. On the flip side, if you remind yourself too much that it's just a game ("it's only pixels"), the emotional authenticity vanishes, and the piece becomes hollow.

  So, you're stuck in a bind. You need to feel it's real enough to matter, but fake enough to be bearable. In immersive media, holding those two contradictory states in your head at once is much harder than watching a telly drama. The technology is designed to erase the distance, but the art form requires the distance to remain intact so you don't just leave feeling psychologically bruised.

  This specific friction—where the need for genuine emotional impact fights against the need for psychological safety—is the core problem.

  \answer{The Immersion-Distance Tension}
