      *   **Philosophical Label:** This is a *Frankfurt Case* (named after Harry Frankfurt, 1969).
      *   **Core Debate:** Does moral responsibility/free will require the *Principle of Alternative Possibilities* (PAP)? i.e., "A person is morally responsible for what he has done only if he could have done otherwise."
      *   **Frankfurt's Goal:** To show PAP is false. Sam couldn't have done otherwise (Black would have forced him), but intuitively, Sam *is* responsible/acted freely because Black didn't actually intervene.
