      You argue that the chair was empty, but you mistake the state for a mere aggregation of living bodies. The state is a continuous moral person that transcends the lifespan of its functionaries. When the granddaughter speaks, she does not speak as a private heir seeking absolution for her grandfather's sins, but as the current voice of an entity that persists through time. The apology is not a transaction between individuals who are dead and gone; it is a recalibration of the relationship between the enduring Republic and the enduring community of the wronged. The 51–49 vote matters less than the fact that the institution itself has now uttered a truth it previously denied.

