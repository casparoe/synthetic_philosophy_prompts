  2.  **Analyze the Passage:**
      *   *Premise 1:* Belief in invisible intelligent power is widespread but not universal (exceptions exist).
      *   *Premise 2:* Belief is not uniform in ideas/content (no two nations/men agree precisely).
      *   *Definition of Original Instinct:* (a) Absolutely universal in all nations/ages, AND (b) Has a precise, determinate object it inflexibly pursues.
