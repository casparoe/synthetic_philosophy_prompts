answer: |-
  This is a sophisticated puzzle that cuts to the heart of social ontology and moral philosophy. You have constructed a valid argument (the conclusions follow from the premises), but it is **unsound**.

  The "rotten step" is the inference from **arbitrariness of content** to **lack of moral obligation**.

  Specifically, this premise is false: *"The content of the local rule is arbitrary, and so the only consideration in favor of conforming is that nonconformists get sanctioned."*

  Here is the breakdown of why that step fails, why your two consequences do not follow, and how the three cases (queue, crossing, tip) differ significantly.

  ### 1. The Rotten Step: Arbitrariness vs. Obligation

  Your argument relies on a David Lewis-style definition of convention: a solution to a coordination problem where alternative solutions would have worked just as well (e.g., driving on the left vs. the right).

  **The Error:** You conflate the *arbitrariness of the equilibrium* with the *arbitrariness of the obligation to maintain it.*

  While it is arbitrary whether we queue by arrival time or by lottery, it is **not arbitrary** whether we adhere to *whichever equilibrium is currently in place*. Once a convention is established, it generates expectations. Violating those expectations causes concrete harm (confusion, delay, financial loss) to others who are relying on the convention.

  Therefore, the "grip" of the rule is not merely the fear of sanctions (dirty looks); it is the **duty of mutual respect** and the **principle of fair play**. If you benefit from the order provided by the convention (e.g., you enjoy the fact that others don't push past you), you incur an obligation to uphold that order for others.

  ### 2. Refuting Consequence 1 (The Visitor)

  **The Claim:** A visitor owes locals nothing because they didn't join the practice.

  **The Refutation:** Moral obligation in coordination problems does not require explicit consent; it requires **participation**.

  *   **The Fair Play Principle:** By entering the queue, crossing the street, or sitting at the table, the visitor is voluntarily accepting the benefits of the local cooperative scheme. To take the benefit (orderly service, safety, meal service) while rejecting the burden (waiting, signaling, tipping) is "free-riding."
  *   **Harm vs. Etiquette:** You characterize the violation as "at worst impolite." This is empirically false for queues and tips.
      *   If I jump a queue, I do not merely breach etiquette; I impose a **time cost** on every person behind me. I have stolen their time.
      *   If I do not tip in a jurisdiction where tips are wages (like the US), I have consumed labor without paying the agreed price. That is theft, not rudeness.

  The visitor is bound by local conventions not because they signed a contract, but because their actions interact with the expectations of others. To act otherwise is to treat the locals as NPCs in your own story rather than agents with their own legitimate expectations.

  ### 3. Refuting Consequence 2 (Marisburg)

  **The Claim:** A Marisburg visitor is licensed to buy a place in a FCFS (First-Come-First-Served) queue elsewhere.

  **The Refutation:** Conventions are **local equilibria of expectation**.

  In Marisburg, the "property right" to a spot in line is defined by money. In a standard FCFS queue, the "property right" is defined by **time invested**.

  When the Marisburg visitor offers to buy a spot in a FCFS queue, they are not merely applying a different preference; they are introducing a variable that the local system is not designed to process. This is analogous to driving on the left in a right-hand traffic country. You cannot defend yourself by saying, "In my country, this is the correct side." The moral wrong arises from the **clash of expectations** that creates chaos or unfairness.

  Furthermore, the FCFS queue is often grounded in a norm of **equality** (time is the great equalizer). Introducing money violates the specific *moral* foundation of that specific convention, not just the arbitrary rule. The locals are entitled to reject the offer because accepting it would degrade the value of the time they have already invested.

  ### 4. Do the answers come out the same for all three?

  No. While your argument treats them as identical "conventions," they rest on different moral foundations. The "rot" is deeper in some than in others.

  **A. Queueing (Fairness & Efficiency)**
  *   **Nature:** Pure coordination + Fairness.
  *   **Verdict:** Your argument fails strongly here. Queue jumping creates a specific victim (everyone behind you). The "arbitrariness" of the rule (FCFS vs. Lottery) does not negate the harm caused by breaking the *active* rule.
  *   **Marisburg Case:** Buying a spot is morally impermissible in a FCFS zone because it violates the specific fairness metric (time) agreed upon by the participants.

  **B. Jaywalking (Safety & Coordination)**
  *   **Nature:** Safety coordination.
  *   **Verdict:** Your argument fails here, but differently. If *everyone* crosses against the light (a local convention), it may be safe. But if a visitor crosses against the light where locals *do not*, they risk their life and endanger drivers.
  *   **Nuance:** Here, the "sanction" isn't just dirty looks; it's physical danger. The obligation to conform is based on the universal value of safety, not just local custom.

  **C. Tipping (Contract & Wage)**
  *   **Nature:** Deferred Payment Contract.
  *   **Verdict:** Your argument fails most catastrophically here. Tipping in the US is not merely a convention; it is a **substitute for wages**.
  *   **Nuance:** When you eat in a US diner, you enter a contract where the price of the meal is (Menu Price + Expected Tip). To leave no tip is to breach a contract and underpay for services rendered. It is not a coordination problem like driving on the left; it is a transaction. The "arbitrariness" premise is false here; the content is determined by economic necessity, not social whim.

  ### Summary

  The argument is unsound. The rotten step is the claim that **arbitrary origins imply optional compliance.**

  1.  **Premise Failure:** The move from "the rule could have been otherwise" to "the rule binds no one who dislikes sanctions" ignores the harm caused to *others* who are relying on the rule.
  2.  **Visitor Obligation:** Obligation arises from participation and benefit, not explicit consent.
  3.  **Differentiation:**
      *   **Queue:** Violation is unfairness (stealing time).
      *   **Crossing:** Violation is danger (risking safety).
      *   **Tip:** Violation is breach of contract (stealing wages).

  You feel the argument is wrong because it reduces social morality to a game of "might makes right" (or "sanction makes right"). In reality, conventions create **normative expectations**, and violating those expectations is a wrong done to the people who hold them, regardless of your willingness to absorb their disapproval.
