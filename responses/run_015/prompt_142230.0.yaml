prompt: |-
  I keep arriving at an argument I don't like and can't defeat, and I'd like to know which step is rotten.

  Queueing, jaywalking, and restaurant tipping all look like conventions in the philosophers' sense: each is one among several available solutions to a recurring coordination problem, and any of the alternatives would have served just as well. But if that is right, the content of the local rule is arbitrary, and so the only consideration in favor of conforming is that nonconformists get sanctioned — the rule itself has no grip on someone who is willing to absorb the dirty looks. Two consequences seem to follow, and I doubt both.

  First, a visitor appears to owe the locals nothing. She never joined their practice, and it is hardly her fault that their equilibrium differs from the one she grew up with; so jumping a queue in Lisbon, crossing against the signal on a street where everyone else crosses, or leaving nothing on the table in a New York diner is at worst impolite — a breach of local etiquette rather than a wrong done to anyone.

  Second, consider a bakery in a city I will call Marisburg, where a place in line may be given away or sold and a transferred place is treated by everyone as fully valid. If the locals there are entitled to treat standing-when as a tradable good, then a visitor from Marisburg who offers to buy a place in a first-come-first-served queue elsewhere seems to be doing exactly what her own convention licenses, merely in a jurisdiction with a different arbitrary preference.

  Is the argument sound? If not, which premise fails? And does the answer come out the same for the queue, the crossing, and the tip?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Argument:**

      *   **Core Premise:** Queueing, jaywalking, and tipping are *conventions* (in the philosophical sense, likely Lewisian). They are arbitrary solutions to coordination problems. Any alternative solution would have worked just as well.
      *   **Intermediate Conclusion:** Because the content is arbitrary, the only reason to follow the rule is to avoid sanctions (social pressure, dirty looks). The rule itself has no intrinsic moral grip on someone willing to accept the sanctions.
      *   **Consequence 1 (The Visitor):** A visitor owes locals nothing because they didn't join the practice. Violating the convention (jumping queues, jaywalking, not tipping) is merely impolite/etiquette, not morally *wrong*.
      *   **Consequence 2 (The Marisburg Baker):** If a local convention allows selling queue spots (Marisburg), a visitor from Marisburg is licensed to buy/sell spots elsewhere, even where the convention is first-come-first-served. They are just applying their home convention in a different jurisdiction.
      *   **User's Intuition:** The user doubts both consequences. They feel something is "rotten" in the argument but can't pinpoint it.
      *   **Goal:** Identify the flawed premise or reasoning step. Determine if the flaw applies equally to all three cases (queue, crossing, tip).

  2.  **Deconstruct the Philosophical Framework:**

      *   **Convention (Lewis):** A regularity in behavior, sustained by mutual expectations, where alternatives exist.
      *   **Arbitrariness:** Yes, driving on the left vs. right is arbitrary. But does "arbitrary origin" imply "arbitrary moral weight"?
      *   **The "Sanction" Claim:** The argument claims the *only* reason to conform is avoiding sanctions. This ignores the *purpose* of the convention (coordination, fairness, efficiency).
      *   **The "Visitor" Claim:** This relies on a consent-based model of obligation. "I didn't agree to this, so I'm not bound."
      *   **The "Marisburg" Claim:** This relies on a relativistic model of norms. "My local norm travels with me."

  3.  **Identify the Rotten Step:**

      *   *Candidate 1: The definition of Convention.* Are these actually pure conventions?
          *   Queueing: Mostly convention, but has fairness underpinnings.
          *   Jaywalking: Safety/coordination.
          *   Tipping: Wage subsidy/social contract.
          *   *Verdict:* They are conventions, but maybe not *mere* conventions.
      *   *Candidate 2: The "Arbitrariness implies No Intrinsic Grip" step.*
          *   Just because *which* side we drive on is arbitrary doesn't mean *driving on the agreed side* is morally neutral. The moral weight comes from the *harm caused by non-coordination*, not the specific direction.
          *   *Verdict:* This is a strong candidate. The argument conflates the arbitrariness of the *solution* with the arbitrariness of the *obligation*.
      *   *Candidate 3: The "Visitor/Obligation" step.*
          *   Moral obligations often arise from participation or presence, not explicit consent. If I enter a game, I follow the rules. If I enter a society, I follow the norms that prevent harm/inefficiency.
          *   *Verdict:* This is the ethical core of the error. It assumes a transactional view of moral obligation.
      *   *Candidate 4: The "Sanction" step.*
          *   "The only consideration... is that nonconformists get sanctioned." This ignores the *consequences* of non-conformity on others (e.g., breaking the queue causes frustration/delay, not just dirty looks).
          *   *Verdict:* This is the most direct logical flaw. It reduces moral obligation to fear of punishment.

  4.  **Evaluate the Three Cases (Queue, Crossing, Tip):**

      *   **Queueing:** High fairness component. Cutting hurts specific individuals (those behind you). The Marisburg case highlights this. Buying a spot disrupts the expectation of temporal priority.
      *   **Jaywalking:** High safety/coordination component. Crossing against the signal when everyone else does might be safe (safety in numbers), but crossing when no one else does is dangerous. The "Visitor" argument is weak here because safety is universal, not local.
      *   **Tipping:** High economic contract component. In the US, tips are part of the wage. Not tipping steals labor value. This isn't just a coordination problem; it's a deferred payment contract.

      *   *Conclusion:* The argument fails differently or to different degrees in each case. Tipping is the least like a "pure convention" and most like a contract. Jaywalking is about safety. Queueing is about fairness/efficiency.

  5.  **Drafting the Response:**

      *   **Acknowledge the strength:** It's a well-constructed paradox (reminiscent of Hume or Lewis).
      *   **Pinpoint the Rot:** The central error is the move from "The specific rule is arbitrary" to "The obligation to follow the rule is contingent on consent/sanctions."
      *   **Key Concept:** *Fair Play* or *Principle of Cooperation*. When you benefit from a system, you owe it to others to maintain it.
      *   **Address Consequence 1 (The Visitor):** Refute the "consent" model. Presence + Benefit = Obligation. Also, distinguish between *etiquette* and *harm*. Queue jumping harms specific people.
      *   **Address Consequence 2 (Marisburg):** Refute the "norm relativism." Conventions are *local* equilibria. Importing a different equilibrium disrupts the local coordination. It's like driving on the left in a right-hand traffic country.
      *   **Differentiate the Three:**
          *   *Queue:* Fairness/Equality.
          *   *Jaywalking:* Safety/Coordination.
          *   *Tip:* Economic Contract/Wage.
      *   **Final Verdict:** The argument is unsound. The rotten step is the inference that arbitrariness of content negates the moral force of coordination.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Wait, is tipping a convention?* In the US, it's quasi-legal. In Europe, it's optional. So it is conventional. But the *moral* weight comes from the reliance of the server on that income.
      *   *Is the "Sanction" claim the weakest link?* Yes. It ignores the *harm* to others. If I jump a queue, I don't just get dirty looks; I delay everyone behind me. That's a negative externality.
      *   *The "Arbitrariness" trap:* David Hume's "Of the Original Contract" or Lewis's *Convention*. The arbitrariness applies to *which* equilibrium, not *whether* to adhere to the chosen equilibrium.
      *   *Structure:*
          1.  Validate the intuition (the conclusion feels wrong).
          2.  Identify the specific premise that fails (The "Sanction/Arbitrariness" inference).
          3.  Explain *why* it fails (Coordination requires mutual adherence; benefits create obligations).
          4.  Analyze the three cases separately (they aren't identical).
          5.  Address the Marisburg case specifically (it's a category error).

  7.  **Final Polish:** Ensure tone is philosophical but accessible. Use terms like "Free Rider Problem," "Principle of Fair Play," and "Negative Externalities." (Make sure not to get too bogged down in jargon).

      *   *Crucial distinction:* The argument conflates *justification of the rule's content* with *justification of compliance*.
      *   *Re: The Visitor:* The "tacit consent" or "fair play" argument counters this.
      *   *Re: Marisburg:* Conventions are *mutual expectations*. If you act on a different expectation, you break the coordination, regardless of your home norms.

  8.  **Final Review against User Prompt:**
      *   Did I say if it's sound? (No).
      *   Did I say which premise fails? (Yes, the inference from arbitrariness to lack of obligation).
      *   Did I answer if it's the same for all three? (No, they differ in moral weight).

      *(Self-Correction)*: I need to be careful about the "Marisburg" example. If Marisburg allows selling spots, does that license them elsewhere? No, because the *local* expectation defines the property right. In FCFS, the "property" is time spent waiting. In Marisburg, it's money. Bringing money into a time-based system is like bringing a different currency without exchanging it. It disrupts the market.

