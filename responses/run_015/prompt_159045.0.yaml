answer: |-
  Plan
  1. **The Heir's Litigation:** Focus on the legal battle. The heir argues property rights based on the destruction of the source. Ending: A court orders both destroyed. *Critique:* Too external; removes the aesthetic tension and reduces the art to asset value.
  2. **The Director's PR:** Focus on the press release. The museum spins the narrative of "twin originals." Ending: The rededication happens, the secret kept. *Critique:* Too cynical; ignores the conservator's intimate knowledge and the physical reality of the objects.
  3. **The Conservator's Signature:** Focus on the physical object and the act of certification. Elias must validate one. Ending: He signs, but the indeterminacy remains in his hand. *Critique:* Best isolates the wrinkle. It places the ontology of the art in the human ritual of care, not just the physics of the paint.

  Selection: Option 3. It grounds the metaphysical problem in the tactile reality of the protagonist's job, forcing the philosophical question into a physical action.

  ***

  The vault air was cold enough to numb the teeth. Elias stood between the crates, the concrete floor leaching warmth through the soles of his shoes. To his left, Crate 89-A. To his right, Crate 89-B. Inside each lay the *Triptych of the Hollow Year*. Outside, the building hummed with the preparation for Friday's rededication.

  Eleven years Elias had written condition reports on the *Triptych*. He knew the crackle in the Virgin's blue robe like a fingerprint. He knew the specific viscosity of the varnish the artist had mixed before his death. Now, he knew none of it. The relay reconstitution had happened in 1985, before his tenure. The original canvas had been consumed to feed the scanner, ashed into data. What remained were these two outputs, born of a glitched pipeline and forty years of silence.

  Director Vance's memo lay on the folding table. *Select one for display. Dispose of the other. Maintain continuity.* The word "dispose" was underlined. Vance needed a single object to hang above the plaque. The museum could not admit it possessed a duplicate; to admit duplication was to admit the process was generative, not preservative. If the machine could make two, it could make infinite. The scarcity value of the "authorized continuation" would collapse.

  Beside the memo lay a letter from the artist's heir, Ms. Vane. *The source was destroyed. The survivors are forgeries. You hold nothing but plastic and pigment arranged by a algorithm. Return both or face restitution.* She was right, technically. The chain of physical custody had been severed when the original burned. But she was also wrong. The form survived. The eye could not tell. If she took them, she would burn them both, erasing the image entirely. If Vance kept one, he preserved the image but lied about its history.

  Elias put on nitrile gloves. He opened 89-A. The smell was neutral, generic feedstock, none of the turpentine and linseed oil of the old world. He leaned in with a loupe. The brushstrokes were perfect. Too perfect. The thermal noise of the printing process had introduced microscopic variances, a few thousand molecules displaced here, a cluster of pigment shifted there. But to the eye, to the camera, to the spectrometer, they were identical.

  He moved to 89-B. He traced the edge of the left panel. It felt the same. The weight was the same. He imagined the technician in 1985, sweating over a timeout error, hitting restart, watching the machine churn out a second soul for a dead man's work. Had the technician felt guilt? Or had he felt like a god?

  Elias sat on the stool. The silence of the vault pressed against his ears. He thought about the signature on the condition report. His signature. It was the only thing that mattered now. The object did not certify itself. The museum did not certify the object. Elias certified the object for the museum. His ink was the bridge between the physical thing and the institutional truth.

  If he signed for 89-A, it became the Continuation. 89-B became waste.
  If he signed for 89-B, the roles reversed.
  If he signed for neither, the exhibit remained empty, the heir won, and the image vanished from public view.

  He picked up the pen. It was heavy, cold steel. He looked at 89-A. It had sat in the gallery for the last decade. It had absorbed the gaze of thousands. It had dusted itself with the light of the room. 89-B had sat in the dark. Did history accumulate on the surface, or in the ledger? If the gallery object was actually the duplicate from the crate, had it become the original by virtue of being watched?

  Vance wanted the problem gone. Vane wanted the truth acknowledged, even if the truth was nothing. Elias wanted the paint to stay on the wall.

  He opened the file. The form required a single serial number. He looked at the two crates. They were indistinguishable, yet mutually exclusive. To choose one was to lie. To choose neither was to destroy. He realized then that the original hadn't been the canvas from 1984, nor the output from 1985. The original was the decision made in this room, today. The art was not the pigment; it was the authorization.

  Elias uncapped the pen. He hovered over the line for 89-A. He could feel the weight of the other crate behind him, a silent twin waiting in the dark. If he signed, he validated Vance's lie. If he refused, he validated Vane's erasure. There was no third option, only the space between the ink and the paper.

  He pressed the nib down. The ink flowed, black and permanent. He wrote the number for the crate destined for the wall. He did not look at the other crate as he closed the file. He stood up and wheeled 89-A toward the lift. He left 89-B in the shadows, its lid slightly ajar, waiting for a future that would not come. The pen remained in his pocket, warm now, heavy with the weight of the thing he had just created.
