answer: |-
  Here is the diagnosis of your reading group's stalemate, evaluated against your working theories.

  ### The Diagnosis: A Category Error Masquerading as Empirical Dispute

  This is primarily a **Different Questions** disagreement, compounded by a **Verbal** confusion over the term "objectivity."

  Your first working theory is correct: the two camps are answering different questions while using the same vocabulary.
  *   **Camp A (Anti-Realists)** is asking an **Ontological Question**: "Do moral truths exist independently of human psychology?" They treat cultural variation as evidence that there is no single 'moral reality' to latch onto.
  *   **Camp B (Universalists)** is asking a **Structural/Functional Question**: "Do human moral systems serve the same deep evolutionary or rational function?" They treat variation as surface-level noise over a unified substrate (e.g., social cohesion).

  The debate stalls because Camp A thinks Camp B is ignoring the data (variation implies no truth), and Camp B thinks Camp A is ignoring the theory (variation implies different inputs to the same processor). They are talking past each other because one is doing metaethics and the other is doing evolutionary psychology, but both claim to be settling the status of "moral truth."

  ### Evaluating Your "Cluster-Mode" Theory

  Your second theory (morality as a cluster of separate cognitive modes) is a version of **Moral Pluralism** or **Functional Fragmentation**.

  **Does it help?**
  Yes, but only if you reframe the goal. It dissolves the demand for a *single* metric of objectivity. If morality is like your "sport" analogy (or better, a "toolbox"), asking if the *whole toolbox* is objective is a category error. You have to ask if specific tools solve specific problems objectively.
  *   *Example:* Is "Authority" objectively good? No. Is "Authority" objectively effective at maintaining group cohesion in high-threat environments? Maybe.
  *   *The Shift:* This moves the debate from "Which culture is right?" to "Which cognitive mode is adaptive/normative in this specific context?"

  **Does it create confusion?**
  Yes, if your group cares about **normative force**. Pluralism explains *why* we disagree, but it struggles to tell us *what to do* when the modes conflict (e.g., Fairness vs. Loyalty). If the modes don't reduce to each other, there is no higher court of appeal. For the Universalists in your group, this feels like surrendering objectivity. For the Anti-Realists, it feels like relativism with extra steps.

  ### The Hidden Empirical Crux

  You asked if there is a culture-invariant capacity we are missing. The crux isn't capacity; it's **Reducibility under Ideal Reflection**.

  The empirical question that could actually move this is: **Can Binding Foundations (Loyalty, Authority, Purity) be reduced to Individualizing Foundations (Harm, Fairness) if agents deliberate long enough with full information?**

  *   **If Yes:** The Universalists win. Purity is just "spiritual harm" or "long-term social stability." There is one deep currency.
  *   **If No:** The Pluralists/Cluster theorists win. A person can fully understand Harm/Fairness and still genuinely value Authority as a *sui generis* good, not instrumental to harm reduction.

  Current measures (like MFT surveys) don't catch this because they measure *intuitions*, not *reflective equilibrium*. You need experimental philosophy data on cross-cultural deliberation, not just reaction times.

  ### How to Move the Debate

  Stop asking "Is morality objective?" That question is too blunt for the data you have. Instead, force the group to operationalize **Conflict Resolution**:

  1.  **The Test:** Present a scenario where Harm/Fairness directly conflicts with Loyalty/Authority (e.g., whistleblowing on a family member).
  2.  **The Question:** "Is there a rational procedure to resolve this that a WEIRD and a non-WEIRD agent *must* accept, or is the choice ultimately a matter of weighting incommensurable values?"
  3.  **The Outcome:** If they admit there is no rational procedure, Camp A (Anti-Realism) wins on ontology, but Camp B (Universalism) might still hold on evolutionary function. If they claim there *is* a procedure, they must define the metric.

  ### Confidence and Uncertainty

  **Overall Confidence:** 85%
  I am highly confident the stalemate is due to the conflation of metaethical ontology with psychological consensus. This is a standard failure mode in interdisciplinary moral psychology groups.

  **Point of Least Confidence:**
  I am least sure (60% confidence) about whether your **Cluster-Mode idea** will actually satisfy the group or just deepen the frustration.
  *   *Why:* While philosophically robust, it denies the "unity of morality" intuition that drives many Universalists. If your group members are committed to the idea that morality *must* be a unified system to be "real," Pluralism will look like defeatism rather than a solution. It solves the descriptive problem but may exacerbate the normative anxiety.

  **Summary:** The question "Is morality objective?" is ill-posed for this data. Switch the question to "Are moral foundations reducible to a common currency under ideal deliberation?" That is the empirical and philosophical bottleneck.
