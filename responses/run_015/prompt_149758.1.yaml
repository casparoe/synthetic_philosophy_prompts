answer: |-
  The core disagreement isn't about which emotion feels worse, but whether moral psychology is hardcoded legacy infrastructure or configurable social software.

  ### Logical Space: Branching Questions

  **Q1: Is the mapping between transgression types and moral emotions fixed by human psychology?**
  *   **No:** The link is contingent on social infrastructure.
  *   **Yes:** The link is innate/biological.

  **Q2: (If Fixed) Do guilt and shame serve distinct, non-overlapping regulatory functions?**
  *   **Yes:** They handle different classes of errors.
  *   **No:** They are interchangeable tools for the same job.

  **Q3: (If Interchangeable) Which mechanism sustains order with less systemic toxicity?**
  *   **Internal Regulation:** Pain comes from violating your own code.
  *   **External Regulation:** Pain comes from status loss in the network.

  **Q4: (If External) Is a real or imagined audience required for the emotion to trigger?**
  *   **Yes:** The protocol requires a handshake with another agent.
  *   **No:** The protocol runs locally without network access.

  ### Taxonomy Leaves

  **1. Culture-can-choose-by-redesigning-norm-enforcement-architecture**
  *   **Path:** Q1 (No).
  *   **Belief:** A culture can refactor its moral emotions like updating a protocol in a codebase. If you change the enforcement architecture (e.g., replace public ostracization with private restitution), you change the dominant emotion.
  *   **Concrete Case:** The government education reform works because it changes the input/output handling of moral violations, not because it changes human nature.

  **2. They-serve-different-jobs-and-culture-cant-pick**
  *   **Path:** Q1 (Yes) → Q2 (Yes).
  *   **Belief:** Guilt handles private rule-breaking (data integrity); shame handles public status damage (network consensus). You cannot swap them because they solve different classes of problems.
  *   **Concrete Case:** The cheater feels guilt (internal); the fraudster feels shame (external). Trying to make the fraudster feel only guilt ignores the social damage; trying to make the cheater feel shame creates unnecessary noise.

  **3. Guilt-is-better**
  *   **Path:** Q1 (Yes) → Q2 (No) → Q3 (Internal).
  *   **Belief:** Since both enforce norms, internal regulation is superior because it doesn't rely on external visibility and avoids the collateral damage of status destruction.
  *   **Concrete Case:** The cheater feeling bad alone is the ideal outcome; public shaming the fraudster is excessive and risky because it relies on mob coordination.

  **4. Shame-is-better**
  *   **Path:** Q1 (Yes) → Q2 (No) → Q3 (External) → Q4 (Yes).
  *   **Belief:** Internal regulation is too weak or private to sustain large-scale cooperation; external status loss is the only reliable compiler warning for social behavior.
  *   **Concrete Case:** The town publicly shaming the fraudster is necessary and correct; the cheater feeling bad alone is insufficient because it doesn't signal safety to the group.

  **5. Incoherent/Unexplored (Private Shame)**
  *   **Path:** Q1 (Yes) → Q2 (No) → Q3 (External) → Q4 (No).
  *   **Belief:** The pain is derived from external status assessment, but no audience is required to trigger it.
  *   **Concrete Case:** Someone feels shame alone in a room with no possibility of exposure. This is logically unstable because it defines the emotion by external status but decouples it from the external world, effectively collapsing into guilt while retaining the label of shame.

  ### Indistinguishable Pairs

  *   **Guilt-is-better vs. They-serve-different-jobs:** These leaves blur if a respondent believes guilt *can* do both jobs but shame is strictly for public acts. They might answer Q2 (Yes) but still argue Guilt is superior for almost everything, making the functional distinction moot in practice.
  *   **Culture-can-choose vs. They-serve-different-jobs:** These leaves blur if a culture chooses to *emphasize* one distinct job over the other. If culture can't swap the emotions but can swap which emotion is triggered by changing the context (private vs public), the practical outcome looks identical to refactoring the protocol.
