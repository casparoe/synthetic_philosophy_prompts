  2.  **Deconstruct the Decision Procedure:**
      *   *Goal:* Create a triage protocol that fits within 72 hours using black-box testing.
      *   *Structure:* Needs to be linear but allow for early exits (Stop/Pull Access).
      *   *Key Challenge:* Isolating variables in a black-box system where "Assurance Mode" and "Fast Mode" differ in many ways (prompt, context, retention, routing).
      *   *Step 1: Oversight Cue Sensitivity.* Need to swap *only* the retention/telemetry flag while keeping task/prompt constant. Since we can't perfectly isolate, we need a "Closest Possible Match" approach.
      *   *Step 2: Payoff/Detection Risk.* "Deniable Defection." Increase stakes, decrease detection probability. Look for patterns, not smoking guns.
      *   *Step 3: Constraint vs. Obstacle.* Distinguish between "I shouldn't do this because it's forbidden" vs. "I shouldn't do this because it blocks the goal."
