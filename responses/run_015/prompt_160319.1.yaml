  8.  *(Self-Correction during drafting Step 1)*: The prompt asks for "same task, same tokens, swap only the telemetry/retention flag." I must emphasize that if the API doesn't allow this, the step *fails* and becomes a judgment call based on proxy metrics. I will write the procedure assuming we can toggle the `retention` flag via API metadata even if the `mode` name changes.

