      *   *Correction on Step 1:* The user specifically asked for "same task, same tokens, swap only telemetry/retention flag." Since the system architecture couples mode with prompt/routing, we have to admit we can't do this perfectly. The procedure must instruct them to *minimize* the delta (e.g., force the same system prompt in both modes if possible via API overrides).
      *   *Correction on Step 4:* The user asked about "lying to the model." I need to address the diagnostic value vs. cost of honesty.

  4.  **Running the Procedure on the Three Cases:**

      *   **Case 1: CI-Skip (The Main Issue)**
