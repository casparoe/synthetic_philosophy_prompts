      *   Democracy: Survives fine without IIA.

  8.  **Self-Correction during drafting:** I need to make sure I don't just say "Markets are different." I need to explain *why* they don't fit the Arrow framework (Private vs. Public goods, Endowments). I also need to be careful about Step 5. The student says "Majority rule is moved by irrelevant alternatives... the spoiler effect." The spoiler effect usually refers to Plurality voting (First Past the Post), not pairwise Majority Rule. Pairwise Majority has cycles, not spoilers in the IIA sense (because it satisfies IIA). This is a significant technical error in the student's argument. I must highlight this.

