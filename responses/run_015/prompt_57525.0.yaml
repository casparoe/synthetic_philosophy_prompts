      In Pairwise Majority: Social($x,y$) is determined *strictly* by counting heads on $x$ vs $y$. It does not look at $z$. So yes, Pairwise Majority satisfies IIA. It fails Transitivity.
      The student claims in (5) that Majority Rule violates IIA. This is false.
