      *   (2) Defense of IIA (Independence of Irrelevant Alternatives): Claims it's a condition of *minimal rationality*. Argues that social ranking of $x$ vs $y$ should depend *only* on individual rankings of $x$ vs $y$.
      *   (3) Defense of Pareto: Accurate/Standard.
