      *   **Theoretical Constraint (G-S):** Address the "hard to game" claim immediately. Explain that G-S proves *no* system is perfect. This levels the playing field between Plurality and Condorcet proponents.
      *   **Recommendation:** Propose the Schulze Method (or Ranked Pairs). Justify based on Condorcet Criterion (majority support) and resistance to "spoiler" effects compared to Plurality.
      *   **Strategic Voting Mitigation:** Since we can't eliminate it, how do we handle it?
          *   Voter education (how to rank).
          *   Transparency (publish the algorithm).
          *   Acknowledge that in small elections (Grad Assoc), strategic voting is actually *harder* because everyone knows everyone, but we should aim for sincerity.
      *   **Timeline:** Work backward from the 15th.
          *   Need decision by Thursday (meeting).
          *   Finalize wording by Friday/Monday.
          *   Proof ballots by Wednesday.
          *   Print on 15th.
      *   **Conclusion:** Call for consensus.

  5.  **Refining the Tone:**
      *   Needs to sound like a grad student who knows their stuff but isn't being pedantic.
      *   Avoid saying "Plurality is stupid." Instead, "Plurality has known vulnerabilities regarding vote-splitting."
      *   Avoid saying "Condorcet is perfect." Instead, "Condorcet aligns better with majority will, though G-S reminds us it's not strategy-proof."

