      *   *Nuance on G-S:* Make sure to clarify that while G-S says manipulation is *possible*, it doesn't mean it's *easy* or *likely*. Some rules make manipulation computationally difficult or informationally demanding.

  7.  **Final Polish:** Check for clarity, flow, and persuasive impact. Ensure the distinction between "strategy-proof" (impossible) and "resistant" (hard) is clear. (Self-correction: Ensure I don't get too bogged down in math jargon, keep it accessible to the non-seminar members).

