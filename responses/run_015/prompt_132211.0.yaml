      *   **Question 2: The Uncle's Plan (Neglect as Action):**
          *   *Analysis:* Is letting it crumble different from removal? Legally/Philosophically? No. It's "passive removal." It's a way to avoid the political heat of a vote.
          *   *Ethics:* It's arguably more dishonest than a direct vote. It feigns inaction while achieving a specific outcome. It saves the $19k but incurs a "credibility cost."
          *   *Verdict:* It is functionally the same as removal, just slower and less accountable.
      *   **Question 3: The Deed (Legal vs. Moral Obligation):**
          *   *Analysis:* "In perpetuity" clauses are tricky. Courts often rule that public interest/safety overrides private deed restrictions after a certain time (cy pres doctrine). Also, the town likely owns the land.
