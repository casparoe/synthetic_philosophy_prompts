      *   **Language:** American English (e.g., *color* not *colour*, *center* not *centre*, *sidewalk* not *pavement*, *trash* not *rubbish*, *apartment* not *flat*, etc.). Avoid British idioms like "keep your chin up," "have a butcher's," etc. Use American phrasing like "town council," "school year," "fix it up."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. Validate the user's gut feeling. Set the American English constraint explicitly in my head (no "whilst," "amongst," "realise," etc.).
      *   **Question 1: The Plaque (Contextualization vs. Neutrality):**
          *   *Mom's view:* Contextualization. It acknowledges the good and the bad.
          *   *Sister's view:* Neutralization. It strips the honor.
          *   *Analysis:* Is it fudging? Yes, in a way. It tries to have it both ways. It keeps the physical symbol but tries to change the semantic meaning. Does it work? Sometimes yes (Berlin's Topography of Terror), sometimes no (Confederate statues). The key is whether the "lesson" lands.
