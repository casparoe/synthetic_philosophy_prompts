      *   **The Conflict:** Council voted 4-3 to keep it with an explanatory plaque.
      *   **The Positions:**
          *   *Mom (Keep + Plaque):* Preserves history, turns it into a lesson, not a tribute.
          *   *Sister (Remove/Implicitly):* Plaque makes it neutral, so keeping it costs nothing (implies removal is fine or keeping it is meaningless). *Correction:* The prompt says "My sister says the opposite: once it's just an object with a caption on it, nobody is honoring anybody, so keeping it costs nothing." This suggests she thinks keeping it *with* the plaque is fine because it strips the honor, OR she thinks the plaque argument is weak. Actually, reading closely: "My sister says the opposite [of Mom]... so keeping it costs nothing." Mom says keeping it *is* preserving history/lesson. Sister says keeping it *isn't* honoring anyone, so it doesn't matter. Wait, let's re-read carefully.
          *   *Mom:* Keep + Plaque = Lesson (Good). Removing = Erasing history (Bad).
          *   *Sister:* Keep + Plaque = No honor (Neutral). So keeping it costs nothing. (Implies she might be okay with keeping it, but disagrees on the *reasoning*, or perhaps she thinks if it's not honoring anyone, why not just take it down? Actually, "keeping it costs nothing" suggests she thinks the controversy is moot if the plaque is there. But she says the "opposite" of Mom. Mom says it *is* a lesson. Sister says it *isn't* a tribute. So Sister thinks the plaque neutralizes the honor. Mom thinks the plaque contextualizes the honor.)
