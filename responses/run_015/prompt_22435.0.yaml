answer: |-
  You have hit on exactly the right nerve. Your skepticism is shared by many professional game theorists and decision theorists. The "superrationality" argument (popularized by Douglas Hofstadter and later formalized in Timeless Decision Theory and Functional Decision Theory) feels like magic because it tries to bypass causality using logic.

  Here is the breakdown of what is actually doing the work, where the logic holds, and exactly where it collapses in the scenario you described.

  ### 1. What is doing the work? (The "Logical Pin")

  You asked: *Is it just 'assume he cooperates' in a fancy coat, or is there a real logical step?*

  It is **not** "assume he cooperates." It is **"assume he is running the same function as me."**

  The mechanism is **Logical Correlation**, not Causal Influence.
  Imagine you and the other player are identical calculators. You are both given the input `2 + 2`.
  *   If you press `=` and get `4`, do you *cause* the other calculator to show `4`? No.
  *   But, can you logically conclude the other calculator *will* show `4`? Yes.
  *   Why? Because you are both instantiating the same algorithm.

  In Superrationality (and its modern descendants like Functional Decision Theory), your "decision" is not a physical event that sends a signal to the other guy. Your decision is the **output of a logical function**.
  *   If `My_Algorithm(Prisoner_Dilemma) == Cooperate`
  *   And `Other_Algorithm == My_Algorithm`
  *   Then `Other_Algorithm(Prisoner_Dilemma) == Cooperate`

  **What does the work:** The assumption of **isomorphism** (structural identity). The argument claims that if you are both truly rational and have the same information, you cannot logically output different answers to the same problem. If you think "I should Defect," you must conclude "He will think 'I should Defect'." If you think "I should Cooperate," you must conclude "He will think 'I should Cooperate'."

  Therefore, you aren't choosing between *My Cooperate/His Defect* and *My Defect/His Cooperate*. You are choosing between *Both Cooperate* and *Both Defect*. Since *Both Cooperate* pays better, you Cooperate.

  ### 2. Where it breaks (The Exploiter)

  You asked: *What if the other guy is NOT running the same procedure... like a smart agent who's figured out superrationalists are exploitable?*

  **This is exactly where the argument collapses.**

  Superrationality is **conditional**. It only works if the symmetry assumption holds.
  *   **Case A: Symmetric.** You are a Superrationalist. He is a Superrationalist. You both know this. **Result:** You Cooperate. The logic holds.
  *   **Case B: Asymmetric.** You are a Superrationalist. He is a standard Causal Decision Theorist (CDT). He defects regardless of what you do because he knows he can't causally influence you.
      *   If you know he is a CDT agent: The logical correlation is broken. Your output does not predict his output. **You should Defect.**
      *   If you *think* he is a Superrationalist but he is actually a CDT agent: **You get exploited.** You Cooperate, he Defects.

  So, to answer your fear: **Yes, if the other guy is not running the same procedure, the move collapses.**

  In modern decision theory (specifically Functional Decision Theory), the prescription is not "Always Cooperate." It is: **"Cooperate if and only if your decision is logically correlated with the other player's decision."**

  If the other player is an "exploiter" who specifically targets superrationalists, your decision to Cooperate does not logically force him to Cooperate (because his code is different from yours). Therefore, a sophisticated superrationalist should Defect against a known exploiter.

  ### 3. The "Fancy Coat" Accusation

  You asked: *Is it just 'assume he cooperates' in a fancy coat?*

  It is slightly more robust than that, but your intuition is warning you about **circular reasoning.**

  The circularity risk is this:
  1.  I assume he reasons like me.
  2.  I reason that Cooperating is best.
  3.  Therefore he reasons Cooperating is best.
  4.  Therefore he Cooperates.
  5.  Therefore I should Cooperate.

  The weak link is step 1. Why *must* he reason like me?
  In standard Nash Equilibrium game theory, there is no requirement that we reason alike. We just maximize our own utility. Since Defecting dominates Cooperating, we both Defect.

  Superrationality adds a **meta-constraint**: "Rationality implies consistency across identical minds."
  It argues that it is logically inconsistent to say "I am rational, he is rational, we have the same data, but we will come to different conclusions."

  However, if the other agent says, "I know you are a superrationalist, so I will Defect to exploit you," **he has proven he is not reasoning like you.** He is running a different algorithm (an exploitation algorithm vs. a cooperation algorithm). Once that difference is established, the superrationalist must update their model: "Ah, we are not identical." And once they are not identical, the superrationalist defects.

  ### 4. Why this is still controversial

  The reason this is still debated in decision theory blogs is that it requires **acausal reasoning.**

  *   **Causal Decision Theory (Standard):** "My choice cannot physically change his choice. Therefore, I ignore his choice when making mine. Defect."
  *   **Superrationality / FDT:** "My choice is evidence of the output of the logical function we both share. Therefore, choosing Cooperate makes it true that the function outputs Cooperate, which means he Cooperates."

  The "bug" you are sensing is that standard causality says **correlation is not causation.** Superrationality says **logical identity is a form of control.**

  If you view the universe as physical atoms bumping into each other, Superrationality looks like magic (voodoo).
  If you view the universe as containing abstract computations that can be instantiated in multiple places at once, Superrationality looks like math.

  ### Summary: The Chain of Logic

  Here is the exact chain you asked for, with the break points highlighted:

  1.  **Premise:** We are both rational agents facing the same problem. **(Holds)**
  2.  **Assumption:** Rational agents with the same information and goals will compute the same answer. **(Holds, IF we are identical)**
  3.  **Inference:** Therefore, my decision is logically linked to his. We will do the same thing. **(Holds, IF assumption 2 is true)**
  4.  **Calculation:** (Both Cooperate) is better than (Both Defect). **(Holds)**
  5.  **Conclusion:** I should Cooperate. **(Holds, IF 3 is true)**

  **Where it breaks:**
  If the other guy is an exploiter, **Premise 2 is false.** He is not computing the answer based on "what is the rational solution for us"; he is computing "how do I maximize my gain given his strategy." His algorithm is different.
  *   If you know his algorithm is different: The chain breaks at step 3. You Defect.
  *   If you *mistakenly believe* his algorithm is the same: The chain holds in your head, but reality punishes you. You Cooperate, he Defects.

  ### The Verdict

  Superrationality is not a moral command to "be nice." It is a strategy that works **only in a population of agents who can recognize each other's source code.**

  If you are a superrationalist in a world of standard game theorists, you will get exploited unless you can identify them and switch to Defecting. If you cannot identify them (i.e., you can't tell if they are running your code or an exploitation code), then Superrationality is indeed vulnerable, and your intuition that it "collapses" is correct.

  The "work" is being done entirely by the **symmetry assumption**. Remove the symmetry, and the argument evaporates.
