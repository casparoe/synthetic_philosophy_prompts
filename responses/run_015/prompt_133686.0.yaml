prompt: |-
  I'm drafting a proposal for a three-month independent study grant in philosophy of mind and cognitive science, and I need help sharpening a half-formed idea into a tractable project plan. The standard debate over whether global workspace theory (GWT) collapses phenomenal consciousness into access consciousness usually treats "global broadcast" as a binary event: a representation is either made available across cognitive modules or it remains local. I want to propose that this framing is too coarse, and that broadcasting should be decomposed into at least three separable dimensions—spatial scope (how many modules receive the signal), temporal persistence (how long the availability lasts), and cross-modal integration (whether the signal binds with representations in other sensory or mnemonic formats). The core question is whether phenomenal consciousness can be present or absent independently of access consciousness depending on which of these dimensions are satisfied: for instance, could a mental state be globally broadcast in scope and time, yet fail cross-modal integration, yielding a form of "thin" access without full phenomenal presence, or conversely be phenomenally present but only locally integrated in a way that escapes standard reportability measures?

  For the proposal, I need a precise statement of the research question—one that can be addressed through conceptual analysis and modeling of existing empirical paradigms (such as partial-report tasks, inattentional blindness, and masked priming) rather than through new laboratory work, since this is a philosophical rather than experimental grant. I also need you to explain why the existing positions—Block's overflow argument, Dehaene's global neuronal workspace model, and Cohen's emphasis on reportability—leave this dimensional question open, and why treating broadcast as unitary rather than multidimensional obscures the possibility of intermediate states. The method should specify what I would actually do month by month: likely, formalizing the three dimensions, mapping them onto known experimental conditions, and testing whether any combination produces a coherent consciousness-type that is neither purely phenomenal nor fully access-conscious. I need to say what a successful deliverable looks like—perhaps a taxonomy of consciousness profiles indexed to dimensional combinations—and what counts as failure, such as the dimensions turning out to be conceptually inseparable or empirically indistinguishable. Finally, I need an honest scope assessment: what can be done in three months by one researcher, and where the project risks becoming too large without direct collaboration with cognitive scientists.

  Please do not include a bibliography or literature review with citations; I will compile references myself. At the end, please state how confident you are in the framing of this proposal and single out the specific point about which you are least sure—likely whether the proposed dimensional decomposition of broadcast is genuinely independent or merely redescribes familiar distinctions between attention, working memory, and reportability.
