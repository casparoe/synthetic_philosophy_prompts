      *(Refining the Dimensions)*: Ensure "Spatial Scope" doesn't just mean "visual field" but "cognitive module availability."
      *(Refining the Block/Dehaene/Cohen section)*: Keep it high-level. Block = Overflow; Dehaene = Ignition; Cohen = Reportability. Show how they all assume a threshold.

  10. **Final Review against Prompt:**
      *   Precise research question? Yes.
