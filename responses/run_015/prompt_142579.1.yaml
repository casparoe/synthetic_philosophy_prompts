prompt: |-
  I have one fifty-minute seminar to move second-year undergraduates from the simple conditional analysis of dispositions — x is fragile iff x would break if struck — to seeing finks and masks as two different problems rather than two instances of one problem. That schema and one lecture's worth of motivation is all they have; no one has read the literature. Don't explain the debate to me; design the session.

  Give me the order the components must be introduced in and what depends on what — in particular whether the reverse-fink or mimicker case belongs before or after the mask case, and what breaks if you swap them. Give me one central object with two or three variant epicycles rather than three unrelated examples, and say what that object must have and must lack to do the work: I tried a live wire wired to a cut-out device and found that the machinery upstaged the point, so I want to know what feature made it fail. Then give me the misconceptions to expect, including that a mask is just a fink we happen to approve of, that adding a ceteris paribus clause repairs the counterfactual, and that the cases show dispositions are really relations to environment — and name the exact point in the sequence where each should be pre-empted rather than corrected afterwards. End with a single novel case that discriminates between students who have the distinction and students who have only learned the labels.

  Two things I want built into the plan rather than attached to it. First, the students will keep identifying the disposition with its causal basis and thereby collapsing the debate into a verbal one: tell me whether to fight that at the outset or let it surface and put it to work. Second, they must leave able to handle an interference mechanism that is part of what makes the object a well-functioning instance of its kind — a rifle whose safety prevents firing when the trigger is pulled, and which seems more, not less, disposed to fire for having it — since I suspect that case quietly breaks the fink/mask contrast as it is usually drawn, and I want it used as a stress test, not set aside. Finally, say what I should openly refuse to explain in fifty minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** Second-year undergraduates.
      *   **Prior Knowledge:** One lecture on the simple conditional analysis (SCA) of dispositions ($D \leftrightarrow (S \square\rightarrow M)$). No reading.
      *   **Goal:** Move them from seeing finks/masks as one problem to seeing them as *two distinct* problems.
      *   **Constraints:** 50 minutes. One central object with variants (epicycles), not three unrelated examples. Must address specific misconceptions (mask=fink, ceteris paribus, dispositions=relations). Must address the "causal basis collapse" issue. Must handle the "safety mechanism/rifle" stress test. Must state what *not* to explain.
      *   **Specific Questions:** Order of components (Reverse-Fink/Mimicker vs. Mask)? What breaks if swapped? What feature made the "live wire" example fail? Where to preempt misconceptions? Final novel discrimination case.

  2.  **Deconstruct the Philosophical Problem:**

      *   **SCA:** $x$ is $D$ iff if $x$ were $S$, $x$ would $M$.
      *   **Fink:** $x$ is $D$, but if $S$ were to occur, $D$ would disappear before $M$ happens. (SCA says Not-$D$, Reality says $D$). *False Negative.*
      *   **Mask:** $x$ is $D$, $S$ occurs, but something external prevents $M$. (SCA says Not-$D$, Reality says $D$). *False Negative.*
      *   **Mimicker (Reverse Fink):** $x$ is Not-$D$, but if $S$ were to occur, something makes $M$ happen. (SCA says $D$, Reality says Not-$D$). *False Positive.*
      *   **The Crucial Distinction:** Finks involve the *loss of the disposition itself* upon stimulation. Masks involve the *retention of the disposition* but the *blocking of the manifestation*.
      *   **The User's Insight:** The "Rifle Safety" case is tricky. A rifle with a safety on is *still* fragile/disposed to fire, but the safety prevents it. Is the safety a mask? Or is it part of the constitution that makes it a rifle? If the safety is internal, is it a fink? The prompt suggests this case "quietly breaks the fink/mask contrast" and should be used as a stress test.

  3.  **The Central Object:**

      *   *User's Attempt:* Live wire with cut-out device.
      *   *Why it failed:* "Machinery upstaged the point." Too much technical detail about circuits, relays, etc. Students focus on the physics, not the metaphysics.
      *   *Requirement:* Needs to be simple, intuitive, and capable of internal/external modification.
      *   *Selection:* **A Glass Vial containing a volatile liquid.**
          *   *Disposition:* Flammability (or Explosiveness).
          *   *Stimulus:* Exposure to Spark.
          *   *Manifestation:* Explosion.
          *   *Why this works:* Everyone knows glass breaks and liquids explode. It allows for external shields (masks) and internal chemical neutralizers (finks).
          *   *Wait, better option:* **A Smart-Bomb / Missile.**
          *   *Disposition:* Explodability.
          *   *Stimulus:* Impact/Signal.
          *   *Manifestation:* Explosion.
          *   *Problem:* Too complex.
          *   *Better Option:* **A Spring-Loaded Trap (Mouse Trap).**
          *   *Disposition:* Snap-ability.
          *   *Stimulus:* Touching the trigger.
          *   *Manifestation:* Snapping shut.
          *   *Why:* Mechanical, visible, easy to imagine "jamming" (mask) vs. "disarming" (fink).
          *   *Best Option (Simplest):* **A Sugar Cube.**
          *   *Disposition:* Solubility.
          *   *Stimulus:* Immersion in water.
          *   *Manifestation:* Dissolving.
          *   *Problem:* Hard to imagine a "fink" where it loses solubility *upon* immersion without magic.
          *   *Re-evaluating the "Live Wire" failure:* The problem was complexity. The *concept* of an electro-fink is standard (Martin 1994). To make it work, strip the physics.
          *   *Selected Object:* **A "Magic" Lightbulb.** (Or just a standard bulb with a stipulated mechanism).
          *   *Actually, let's go with the User's intuition but simplify:* **A Gun.**
          *   *Disposition:* Lethality/Firing.
          *   *Stimulus:* Pulling Trigger.
          *   *Manifestation:* Firing Bullet.
          *   *Why:* Everyone understands guns. Safety catches are intuitive. Ammo removal is intuitive.
          *   *Refinement:* **A Toy Gun that shoots corks.** Removes ethical baggage, keeps mechanics.
          *   *Wait, the prompt asks for "One central object with two or three variant epicycles".*
          *   *Let's choose:* **A Specific Vial of Acid.**
          *   *Disposition:* Corrosiveness.
          *   *Stimulus:* Contact with Metal.
          *   *Manifestation:* Eating through metal.
          *   *Why:* Chemical reactions are standard dispositions.
          *   *Actually, the "Live Wire" failed because of "machinery".* Let's use **A Fragile Vase.** It's the classic example.
          *   *Disposition:* Fragility.
          *   *Stimulus:* Striking.
          *   *Manifestation:* Breaking.
          *   *Epicycle 1 (Mask):* Packing foam around it.
          *   *Epicycle 2 (Fink):* A sorcerer who makes it non-fragile the moment it is struck (but before it breaks).
          *   *Epicycle 3 (Mimicker):* A sorcerer who makes a steel vase break when struck.
          *   *Wait, the prompt asks about Reverse-Fink/Mimicker vs Mask order.*
          *   *Decision:* The core distinction is Fink vs. Mask. Mimickers are the inverse (False Positives). To distinguish Fink from Mask, we need False Negatives for both.
          *   *Revised Object:* **A "Smart" Grenade.**
          *   *Disposition:* Explosiveness.
          *   *Stimulus:* Pin Pull.
          *   *Manifestation:* Boom.
          *   *Why:* Allows for internal circuitry (Fink) vs External containment (Mask).
          *   *Actually, let's stick to the prompt's hint:* "I tried a live wire... machinery upstaged the point."
          *   *Solution:* **A Biological Organism (e.g., a Pufferfish).**
          *   *Disposition:* Toxicity.
          *   *Stimulus:* Ingestion.
          *   *Manifestation:* Poisoning.
          *   *Too complex.*
          *   *Let's go back to the Vase.* It's the standard for a reason. But to avoid "machinery," the Fink must be stipulated as magic or brute fact.
