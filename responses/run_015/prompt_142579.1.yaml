  ### Session Plan: The Anatomy of Interference (50 Minutes)

  **Central Object:** A simplified **Pistol**.
  *   **Disposition:** Lethality (Disposal to fire a bullet).
  *   **Stimulus:** Pulling the trigger.
  *   **Manifestation:** The bullet exits the barrel.
  *   **Why this object:** It is mechanically intuitive, allows for clear internal/external distinctions, and naturally accommodates the "Safety Catch" stress test without requiring complex engineering schematics.
  *   **Why the Live Wire failed:** Your "cut-out device" sounded like an external switch (a Mask), not an intrinsic change. Students focused on the relay mechanism (physics) rather than the loss of the property (metaphysics). The Pistol avoids this by stipulating the behavior rather than explaining the circuitry.

  ---

  ### 1. The Sequence and Dependencies (0–35 mins)

  **Order:** **Mask $\rightarrow$ Fink $\rightarrow$ Distinction.**
  **Mimickers:** Do not introduce as a core teaching example. Use only in the final assessment.

  **0–5 mins: The Baseline (SCA)**
  *   Establish the Simple Conditional Analysis: *The pistol is disposed to fire iff if the trigger were pulled, it would fire.*
  *   Stipulate a standard, loaded pistol. Intuition and SCA align.

  **5–15 mins: Epicycle 1 — The Mask (Extrinsic Block)**
  *   **Case:** The pistol is loaded. You pack the barrel tightly with wet sand. You pull the trigger. The gun fires (internal mechanism works), but the bullet does not exit (manifestation blocked).
  *   **SCA Verdict:** Not disposed (since it wouldn't fire).
  *   **Intuition:** It *is* disposed (the gunpowder is still there, the mechanism is ready).
  *   **Pre-emption (Ceteris Paribus):** At minute 12, a student will suggest: *"Just add 'all else being equal' to the analysis."*
      *   **Action:** Pre-empt this immediately. Do not let it settle.
      *   **Script:** *"If we add 'all else being equal,' we are begging the question. The sand makes it 'not equal.' We need to know exactly which interferences count as 'unequal' and which are just part of the world. This case shows SCA is too blunt, not that it needs a qualifier."*
  *   **Key Takeaway:** The disposition **persists** through the stimulus; the manifestation is **interfered with**.

  **15–25 mins: Epicycle 2 — The Fink (Intrinsic Loss)**
  *   **Case:** The pistol is loaded. It contains a "Smart Sensor." The millisecond the trigger begins to move (stimulus onset), the sensor instantly vaporizes the gunpowder *before* the hammer strikes. You pull the trigger. Nothing happens.
  *   **SCA Verdict:** Not disposed (since it wouldn't fire).
  *   **Intuition:** It *was* disposed a moment ago, but the stimulus killed the disposition.
  *   **Strategy (Causal Basis):** **Let the collapse surface here.** Students will say, *"But the gunpowder is gone, so it isn't a gun anymore."*
      *   **Action:** Use this. Do not fight it.
      *   **Script:** *"Exactly. In the Mask case, the basis (powder) remained. In the Fink case, the basis vanishes *because* of the stimulus. The Mask blocks the road; the Fink removes the car."*
  *   **Key Takeaway:** The disposition **does not persist**; the stimulus triggers the **loss of the basis**.

  **25–35 mins: The Distinction**
  *   **Board Work:** Draw two timelines.
      *   *Mask:* $t_1$ (Disposed) $\rightarrow$ $t_2$ (Stimulus) $\rightarrow$ $t_3$ (Blocked Manifestation). **Disposition holds at $t_2$.**
      *   *Fink:* $t_1$ (Disposed) $\rightarrow$ $t_2$ (Stimulus triggers Loss) $\rightarrow$ $t_3$ (No Manifestation). **Disposition fails at $t_2$.**
  *   **Pre-emption (Mask = Approved Fink):** At minute 30, a student will ask: *"Isn't the sand just a fink we happen to like?"*
      *   **Action:** Pre-empt by pointing to the timeline.
      *   **Script:** *"No. If I remove the sand, the gun fires. If I remove the Smart Sensor, the gun fires. But in the Fink case, the act of trying to fire is what destroys the power. In the Mask case, the power is waiting, frustrated. One is a shield; the other is a suicide pill."*

  ---

  ### 2. The Stress Test: The Safety Catch (35–45 mins)

  This is where you test if they understand the distinction or just memorized labels.

  **The Case:** A standard pistol with a **Safety Catch**. The safety is ON. You pull the trigger. The gun does not fire.
  *   **Question:** Is the Safety Catch a Mask or a Fink?
  *   **The Trap:** It is intrinsic (part of the gun). Students often think Intrinsic = Fink.
  *   **The Twist:** A pistol *with* a safety is a *better* pistol than one without. If it were a Mask, the better pistol would be *less* disposed. If it were a Fink, the better pistol would *lose* its disposition upon use.
  *   **Resolution:** The Safety Catch is neither. It modifies the **Stimulus Condition**.
      *   SCA Correction: The stimulus is not "Pull Trigger." It is "Pull Trigger **AND** Safety Off."
      *   Since the full stimulus never occurred, the counterfactual is not triggered.
  *   **Pre-emption (Dispositions = Relations):** At minute 40, students will argue: *"This proves dispositions are just relations to the environment."*
      *   **Action:** Pre-empt by contrasting with the Mask.
      *   **Script:** *"If it were a relation to the environment, the Sand in the Barrel (Mask) would also change the stimulus. But it doesn't. We still say 'Pull Trigger' for the sand case. We only change the stimulus definition for the Safety because the Safety is **constitutive** of the kind 'Pistol.' The sand is accidental; the safety is essential. Don't confuse 'context-sensitive' with 'relational.'"*

  ---

  ### 3. Misconception Management Map

  | Misconception | When to Pre-empt | How to Pre-empt |
  | :--- | :--- | :--- |
  | **"Add a *ceteris paribus* clause."** | **After Mask (Min 12).** | Before they propose Fink. Show that Fink cases are *also* "not equal," so the clause doesn't distinguish them. |
  | **"A mask is just a fink we approve of."** | **Transition (Min 30).** | Use the Timeline. Mask = Persistence; Fink = Loss. Approval is irrelevant to metaphysics. |
  | **"Dispositions are relations to environment."** | **Stress Test (Min 40).** | Contrast Safety (Constitutive) vs. Sand (Accidental). Relations imply extrinsicness; Safety is intrinsic but definitional. |
  | **"Disposition = Causal Basis."** | **During Fink (Min 20).** | **Let this surface.** Use it to explain *why* the Fink works (the basis is destroyed). If you fight it, they miss the mechanism of the Fink. |

  ---

  ### 4. Final Discrimination Case (45–50 mins)

  **The Case:** **The "Conscientious" Fuse.**
  *   **Object:** An electrical fuse.
  *   **Disposition:** To melt when current surges.
  *   **Scenario:** The fuse is made of "Smart Metal." When a current surge is detected, the metal instantly changes its molecular structure to have a higher melting point *before* it melts. It never melts.
  *   **Question:** Is this fuse disposed to melt?
  *   **Correct Answer:** **Yes (Finkish).** It has the disposition initially, but the stimulus removes it.
  *   **Contrast:** A fuse covered in heat-proof ceramic (Mask).
  *   **Why this discriminates:**
      *   **Label-Learners:** Will say "No, it doesn't melt, so it isn't disposed." (SCA adherence) OR "It's a Mask because it's a safety device." (Confusing function with metaphysics).
      *   **Understanding Students:** Will identify it as a **Fink** because the *intrinsic basis* changes upon stimulus, unlike the ceramic (extrinsic block). They will recognize that "being a fuse" implies the disposition, even if Finkishly thwarted.

  ---

  ### 5. What to Openly Refuse to Explain

  To stay within 50 minutes, you must explicitly bracket the following at the start (Min 2):

  1.  **The Solution:** *"We are not here to fix the Simple Conditional Analysis. We are here to break it. I will not offer you Lewis's reformed analysis or Bird's powers today. We are diagnosing the disease, not prescribing the cure."*
  2.  **Mimickers:** *"We are focusing on False Negatives (things that are disposed but don't manifest). We are ignoring False Positives (things that manifest but aren't disposed) today, except in the final test."*
  3.  **Ontology:** *"We are not debating whether dispositions are real powers or just reduced to categorical bases. Whether you are a realist or reductionist, these problems apply to you equally."*

  ### Summary of Dependencies
  *   **Mask must precede Fink:** If you do Fink first, students conflate "loss of disposition" with "prevention of manifestation." They will treat the Mask as a "slow Fink." You must establish that the disposition *can* persist through the stimulus (Mask) before showing a case where it *cannot* (Fink).
  *   **Safety Catch must follow Distinction:** If introduced earlier, it collapses the Mask/Fink distinction into a "Stimulus Definition" problem prematurely.
  *   **Causal Basis must surface during Fink:** If suppressed early, the Fink case looks like magic. If suppressed late, it becomes an ontological debate. It must be the *mechanism* of the Fink.
