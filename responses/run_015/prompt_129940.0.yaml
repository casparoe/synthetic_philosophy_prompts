answer: |-
  You dread the lamp of reason burns too bright,
  That health of mind must kill the health of heart.
  Yet reason and the body's vigor stand
  As twin foundations for our fragile joy.
  Without the steady hand of thought to guide,
  The passions crash against the rocks of fate.

  But truth dissolves the glue of daily life,
  It shows the lover's vow is blood and nerve,
  And strips the self of its imagined throne.
  When every ghost is named a trick of light,
  The stage goes dark, the actors leave the scene,
  And we are left with cold and naked facts.

  So keep the veil, though you have lifted it.
  To know the trick and watch the show go on
  Is not a failure, but a higher art.
  We study fire but do not freeze ourselves,
  Accept the tension, knowing, believing,
  Preserving joy that naked truth would kill.
