      *   Mapping: The Tripartite structure (Perpetrator, State/Committee, Victim). Consideration (Truth for Immunity).
      *   Breakdown: The Victim's lack of veto. The State as proxy. The "Full Disclosure" legal standard vs. Moral truth.
      *   Theoretical Conclusion: It reveals transactional forgiveness cannot be fully institutionalized without becoming a state pardon. The "transaction" is legally binding but morally asymmetrical.

