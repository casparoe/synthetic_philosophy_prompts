  6.  **Final Polish:** Check tone (analytical, critical, precise). Ensure the distinction between *legal immunity* and *moral forgiveness* is clear throughout, as this is the crux of the "transactional" tension. (Self-correction: Ensure I don't argue the TRC was a failure, but rather that the *lens* reveals specific tensions.)

  7.  *(Mental Outline of the response)*
