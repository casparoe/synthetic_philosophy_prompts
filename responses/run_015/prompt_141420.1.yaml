prompt: |-
  I run a fortnightly "games, choice and proof" workshop for first-years, mixed maths and philosophy, about 16 people, 80 minutes, one room with moveable tables. I can get printed boards, two colours of counters, index cards and a whiteboard. Almost none of them have met a non-constructive existence proof before.

  I had a long argument with a friend last night about the strategy-stealing argument. She says it's a parlour trick: it tells you the first player wins at Hex and hands you nothing you can actually use, so what has it shown. I kept saying that's the whole point — you find out *which* player without ever getting your hands on a strategy — but I couldn't make her feel it, and I think the only way to feel it is to play. So design me the session: rules, materials, a timeline, and a debrief that maps what happened onto the steps of the argument (the supposition that the second player has a winning strategy, the throwaway opening move, the "pass" you make when the stolen strategy calls for the cell you already took, and the premise that an extra stone of your own colour can never hurt you). No lecture up front and nobody says "strategy stealing" until the last ten minutes — they should run into the move themselves.

  The bit I want you to work out rather than look up, because I invented it on the way home: a variant — call it Stint Hex — where each player has a fixed budget of stones, fewer than half the board, must place one every turn, and looses if the budget runs out before they've connected their sides. In that variant the throwaway move costs something, and I want the group to discover that by trying to rerun the argument on it, not by being told. If who actually wins Stint Hex isn't obvious, say so honestly instead of inventing an answer. There's a second beat if time allows: a free stone of your own colour, placed by someone else, is a gift in Hex — get them to find a game where the same gift is a curse.

  Finally: what goes wrong the first time I run it. I expect people to slide from "the first player wins" into "I can name the winning opening move", and someone to object that finite games are determined anyway so the existence claim was never the news — how do I handle that, and what does the activity just can't show them that only I can say out loud?
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year Maths & Philosophy students (mixed), ~16 people.
      *   **Format:** Fortnightly workshop, 80 minutes, "Games, Choice and Proof" theme.
      *   **Resources:** Printed boards, 2 colors of counters, index cards, whiteboard, moveable tables.
      *   **Prior Knowledge:** Almost none have seen non-constructive existence proofs.
      *   **Core Topic:** Strategy-stealing argument (specifically in Hex).
      *   **Pedagogical Goal:** Students must *discover* the argument through play, not lecture. No mention of "strategy stealing" until the end.
      *   **Specific Innovation:** "Stint Hex" (budgeted stones). Students must discover why the argument fails here (the throwaway move costs resources).
      *   **Second Beat (Optional):** A game where an extra stone is a curse (Zugzwang).
      *   **Anticipated Pitfalls:** Confusing "P1 wins" with "We know the winning move"; Zermelo's Theorem objection (finite games are determined).
      *   **Tone:** Engaging, discovery-based, rigorous debrief.

  2.  **Deconstruct the Session Flow (80 Minutes):**
      *   *Intro (5 mins):* Setup, rules of Hex, no theory.
      *   *Phase 1: Standard Hex (25 mins):* Play, notice P1 advantage, try to find a strategy.
      *   *Phase 2: The "Impossible" Challenge (15 mins):* Ask P2 to prove they can win. Introduce the thought experiment (P1 plays random, then adopts P2's strategy).
      *   *Phase 3: Stint Hex (20 mins):* Introduce the budget constraint. Try the same argument. Fail. Analyze why.
      *   *Phase 4: Debrief & Theory (15 mins):* Map actions to proof steps. Address Zermelo/Zugzwang.

  3.  **Drafting the Content - Section by Section:**

      *   **Materials:** Need Hex boards. 11x11 is standard, but for 80 mins with 16 people (8 pairs), smaller might be faster? Let's stick to 11x11 or 9x9 for authenticity, but emphasize speed. Counters (Red/Blue). Index cards for "Secret Strategies."

      *   **Phase 1: Standard Hex:**
          *   Rules: Connect opposite sides. No draws.
          *   Task: Play 3 games. Swap colors.
          *   Prompt: "Does P1 have an advantage? Can P2 guarantee a win?"
          *   *Hidden Goal:* They should feel P1 *must* win if perfect play exists, but they can't find *how*.

      *   **Phase 2: The Thought Experiment (The "Aha" Moment):**
          *   Don't explain the proof. Give them a scenario.
          *   Scenario: "Suppose P2 has a winning strategy written on this card."
          *   Task: "P1, make a random move. Then pretend you are P2 using the card. If the card says play where you already are, play elsewhere."
          *   *Crucial realization:* They need to see that having an extra stone never hurts in standard Hex.

      *   **Phase 3: Stint Hex (The Innovation):**
          *   *Definition:* Each player gets $N$ stones (e.g., 10 on a 9x9 board). Must place one per turn. If you run out before connecting, you lose.
          *   *Task:* Try the same "Stealing" logic.
          *   *Failure:* The "random" opening move burns a budget stone. The "play elsewhere" move burns *another* stone. P1 runs out of ammo faster.
          *   *Outcome:* The proof breaks. Who wins? Honestly, it's unclear/dependent on $N$. Acknowledge uncertainty.

      *   **Phase 4: The "Curse" (Zugzwang):**
          *   Game: Nim? Or a specific Hex variant?
          *   Better: "Misere Hex" (last player to move loses)? No, that changes win condition.
          *   Better: A simple combinatorial game where having to move is bad. *Nim* with one pile is trivial.
          *   Let's use a specific "Trap" board or just discuss the concept of *Zugzwang* using a simple endgame scenario on the board.
          *   Actually, the prompt asks for "a game where the same gift is a curse."
          *   Idea: *Chomp*? No.
          *   Idea: A specific Hex endgame where filling a spot blocks your own path.
          *   *Decision:* Keep it simple. Use a specific "Blockade" puzzle on the Hex board where an extra stone blocks the only path.

      *   **Debrief & Pitfalls:**
          *   Map the physical actions to logical steps (Assumption -> Contradiction).
          *   Handle the "Zermelo's Theorem" objection (Yes, games are determined, but *knowing* who wins without knowing *how* is the shock).
          *   Handle the "Name the Move" confusion (We know P1 wins, but we don't know *which* first move).

  4.  **Refining the "Stint Hex" Logic:**
      *   I need to be careful here. The prompt says "I invented it on the way home... work out rather than look up."
      *   *Analysis:* In standard Hex, extra stones are monotonic (more is better). In Stint Hex, stones are a resource.
      *   If P1 plays a "throwaway" stone, they have $N-1$ left. P2 has $N$.
      *   If P1 steals P2's strategy, P1 is effectively playing as P2 but with one *fewer* stone available (because of the throwaway).
      *   If the winning strategy requires all $N$ stones, P1 fails.
      *   So the proof fails because the "extra stone is never bad" premise is replaced by "stones are limited."
      *   *Who wins Stint Hex?* If $N$ is very small, P1 might win by speed. If $N$ is large enough to fill the board, it reverts to Hex. If $N$ is tight, it's a resource management game. It is *not* obvious who wins. I must state this honestly.

  5.  **Refining the Pitfalls:**
      *   *Pitfall 1: "So what's the winning move?"*
          *   Response: The proof proves existence, not construction. It's like knowing a root exists without finding it.
      *   *Pitfall 2: "Finite games are determined anyway."*
          *   Response: True (Zermelo). But usually, we determine the winner by analyzing the tree. Here we determine the winner *without* analyzing the tree. That's the non-constructive magic.
      *   *What only I can say:* The philosophical weight of "Existence without Construction." The distinction between Classical and Intuitionistic logic (briefly).

  6.  **Timing Check:**
      *   Intro/Rules: 10 min (Hex rules can be tricky for beginners).
      *   Play Standard: 20 min.
      *   The "Hypothetical" (Proof discovery): 15 min.
      *   Stint Hex: 20 min.
      *   Debrief: 15 min.
      *   Total: 80 min. Tight but doable.

  7.  **Writing the Plan:**
      *   Use clear headings.
      *   Keep instructions to students distinct from facilitator notes.
      *   Ensure the "Stint Hex" rules are precise enough to work but open enough to explore.
      *   Make sure the "Curse" section is concrete.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 80 minutes enough for Hex beginners to understand the game *and* the proof?
      *   *Fix:* Use smaller boards (7x7 or 9x9) for speed. 11x11 takes too long.
      *   *Critique:* How do I ensure they don't Google Hex strategy?
      *   *Fix:* It's a workshop, assume good faith, but the focus is on the *logic*, not mastering Hex.
      *   *Critique:* The "Curse" example needs to be playable.
      *   *Fix:* Create a specific "Endgame Puzzle" handout where placing a stone loses.
      *   *Critique:* The friend's objection ("parlour trick") needs to be addressed in the debrief.
      *   *Fix:* Explicitly link the debrief to the "value of non-constructive proof."

  9.  **Final Polish:** Check tone. Needs to be encouraging but rigorous. Ensure the "Stint Hex" analysis is honest about the unknown winner. (Self-correction: In Stint Hex, if the budget is tight, the game might be a second-player win or depend on the budget parity. I will explicitly state "We do not know" as part of the lesson.)

  10. **Final check on constraints:**
      *   No lecture up front.
      *   No "strategy stealing" term until end.
      *   Address the friend's objection.
      *   Address Zermelo objection.
      *   Address "Name the move" confusion.

  Let's assemble the session plan.cw
answer: |-
  # Workshop Plan: The Ghost Strategy
  **Theme:** Games, Choice and Proof  
  **Duration:** 80 Minutes  
  **Participants:** 16 (8 pairs)  
  **Materials:** 8 Hex boards (9x9 recommended for speed), Red/Blue counters, Index cards, Whiteboard, "Stint Hex" budget tokens (optional, or just use counters as budget).

  ---

  ## 0. Setup & Rules (10 Minutes)
  *Do not mention proof, logic, or strategy stealing.*

  **Room Layout:** 8 tables, 2 students per table. Whiteboard at the front.
  **Handout:** A single sheet with Hex rules and a 9x9 grid diagram.

  **Facilitator Script:**
  "Welcome. Today is about playing, not listening. You are playing **Hex**.
  1. Red wants to connect Top to Bottom. Blue wants to connect Left to Right.
  2. Place one stone per turn on any empty hex.
  3. Stones stay put.
  4. First to connect their sides wins.
  5. **Crucial:** There are no draws. One of you must win.

  Play three games. Swap colours each time. Play fast. If you finish early, start a new board. Your goal is not to become a master, but to feel the flow of the game."

  *(Walk around. Ensure they understand the 'no draw' rule. If they get stuck in long games, suggest they resign and restart.)*

  ---

  ## 1. The Impossible Challenge (15 Minutes)
  *Goal: Induce the feeling that P1 must win, without knowing how.*

  **Facilitator Script:**
  "Stop playing. Look at your boards. In the games you just played, did the First Player (Red) seem to have an advantage?"
  *(Take a show of hands. Likely consensus: Yes.)*

  "Here is a challenge. I want the **Blue** players (Second Player) to write down a **Guaranteed Winning Strategy** on an index card. A set of rules that says 'If Red plays here, I play there' that guarantees Blue wins every time, no matter what Red does."

  *(Give them 3 minutes. They will fail. They will laugh. They will realize the tree is too big.)*

  "Okay. Keep your cards blank. Now, I want you to imagine something. **Suppose** I handed you a card, and on it was written a True Guaranteed Winning Strategy for Blue. A magic algorithm.
  **Red Players:** Your task is to break it.
  You are allowed to make **one** random move anywhere on the board. Just drop a stone.
  After that, you must pretend you are Blue. You look at the Magic Card. It tells Blue where to play. You play that spot with your Red stone.
  If the card says 'Play where you already have a stone,' just play anywhere else.
  Play out the game against your partner (who is playing as Red, trying to beat you)."

  *(Let them play this 'Meta-Game' for 10 minutes. Circulate. Listen for the realization: "Wait, I'm winning as Red even though I'm using Blue's strategy?")*

  **Facilitator Script:**
  "Did the person using the 'Magic Blue Card' win? Even though they were playing Red stones?"
  *(Consensus should be: Yes, having an extra Red stone on the board never hurt them.)*

  ---

  ## 2. Stint Hex (20 Minutes)
  *Goal: Break the argument by introducing a cost to the throwaway move.*

  **Facilitator Script:**
  "We are changing the rules. This is **Stint Hex**.
  1. Same board. Same connection goal.
  2. **Budget:** Each player gets exactly **15 stones** total (for a 9x9 board).
  3. You must place one stone per turn.
  4. **Loss Condition:** If you run out of stones before you connect your sides, you lose immediately.
  5. If both run out simultaneously with no connection, it's a draw (rare)."

  *(Distribute 15 counters of each colour to each player. The rest of the pot is 'the bank'.)*

  "Play two games of Stint Hex. Feel the tension of the budget."
  *(5 Minutes play)*

  "Now, run the **Magic Card** experiment again on Stint Hex.
  Blue Player: Assume you have a Winning Strategy on the card.
  Red Player: Make your random throwaway move. Then adopt the Blue Strategy.
  If the card says 'Play where you already are,' play elsewhere."

  *(Let them attempt this for 10 minutes. They will run into a wall.)*

  **Facilitator Script:**
  "Stop. Did the argument work? Did Red win using Blue's strategy?"
  *(Expected outcome: Red ran out of stones first. The throwaway move cost a budget point. The 'play elsewhere' move cost a second budget point. Red burned 2 stones to mimic Blue's 1.)*

  "Who wins Stint Hex? Does the First Player still have a guaranteed win? Discuss with your partner."
  *(5 Minutes discussion)*

  **Honest Admission:** "I do not know who wins Stint Hex with a budget of 15. Neither does anyone else here. The proof we just found for normal Hex breaks here. The 'extra stone' is no longer a free gift; it's a cost."

  ---

  ## 3. The Gift and The Curse (10 Minutes)
  *Goal: Challenge the premise that 'an extra stone of your colour is never bad'.*

  **Facilitator Script:**
  "In normal Hex, we assumed having an extra Red stone on the board could never hurt Red.
  Is this true for all games?
  I want you to set up this specific endgame scenario on your board."

  *(Project or describe a specific 'Zugzwang' puzzle on the whiteboard. E.g., A narrow bridge where the only path requires the opponent to fill a hole, but if you fill it yourself, you block your own path.)*

  **Scenario:** "Red needs to connect A to B. There is a single narrow path. If Red places a stone on the critical junction 'X', Red blocks their own path and loses. If Blue is forced to play on 'X', Blue helps Red win.
  In this specific situation, if a 'Ghost' placed a Red stone on 'X' for you, would it be a gift?"
  *(Answer: No, it's a curse.)*

  "This is called **Zugzwang**. In games with Zugzwang, the 'Strategy Stealing' argument fails because the premise 'an extra stone never hurts' is false."

  ---

  ## 4. Debrief & Mapping (25 Minutes)
  *Goal: Formalize the intuition and handle objections.*

  **Whiteboard Work:** Draw the logical structure based on their physical actions.

  1.  **Assumption:** Suppose P2 (Blue) has a winning strategy. (The Index Card).
  2.  **Action:** P1 (Red) makes a random opening move. (The Throwaway).
  3.  **Mimicry:** P1 ignores that stone and follows P2's strategy for the rest of the game. (The Theft).
  4.  **Collision:** If the strategy calls for the spot P1 already took, P1 plays randomly elsewhere. (The Pass).
  5.  **Premise:** In normal Hex, having an extra stone of your colour is never a disadvantage. (Monotonicity).
  6.  **Contradiction:** P1 is now playing P2's winning strategy *plus* an extra stone. So P1 must win. But P1 and P2 cannot both win.
  7.  **Conclusion:** The assumption was false. P2 cannot have a winning strategy.
  8.  **Final Deduction:** Since there are no draws, **P1 must win.**

  **Handling the Pitfalls (Facilitator Notes):**

  *   **Pitfall 1: "So, what is the winning move?"**
      *   *Student Objection:* "You proved P1 wins, but you didn't tell me where to put the first stone. What's the use?"
      *   *Your Response:* "This is the heart of **Non-Constructive Proof**. We know the treasure exists. We know the map leads to it. But we don't have the key to the chest. In Maths, knowing a solution *exists* is often enough to build other theories, even if we can't calculate the solution itself. Your friend called it a 'parlour trick'. I call it knowing the destination without knowing the route. That is power."

  *   **Pitfall 2: "Finite games are determined anyway." (Zermelo's Theorem)**
      *   *Student Objection:* "We already knew someone must win. It's a finite game with perfect information. So you haven't told us anything new."
      *   *Your Response:* "Zermelo's Theorem says 'Someone has a winning strategy.' It does not say *who*. To find out who using Zermelo, you have to solve the whole game tree (impossible for Hex). The Strategy Stealing Argument tells us *specifically* that it is the First Player, without solving the tree. It gives us information Zermelo does not."

  *   **Pitfall 3: "Stint Hex is just broken."**
      *   *Student Objection:* "Why bother with Stint Hex if the proof doesn't work?"
      *   *Your Response:* "Because proofs rely on **premises**. By changing the rules (budget), we broke the premise ('extra stones are free'). This teaches you to check the assumptions of a proof, not just the steps. If you change the axioms, the theorem falls."

  **The "Only You Can Say This" Closing:**
  "There is a philosophical split here. Some mathematicians (Intuitionists) say: 'If you can't show me the winning move, you haven't proved P1 wins.' They reject this argument.
  Classical mathematicians say: 'Logic dictates P1 wins, even if we are too stupid to find the move.'
  Today, you didn't just play a game. You enacted a Classical Existence Proof. You felt the discomfort of knowing *that* something is true, without knowing *what* it is. That discomfort is the engine of modern mathematics."

  ---

  ## 5. What Goes Wrong (Post-Mortem for the Facilitator)

  **1. The "Name the Move" Slide**
  *   **Risk:** Students leave thinking "P1 wins" means "I know how to win."
  *   **Mitigation:** In the debrief, explicitly ask: "Can anyone name a winning opening move for Red?" When they say no, emphasize: "The proof guarantees a winner, not a method. That is the definition of Non-Constructive."

  **2. The Zermelo Objection**
  *   **Risk:** A philosophy student shuts down the room by citing Zermelo's Theorem (all finite perfect info games are determined).
  *   **Mitigation:** Acknowledge it immediately. "Correct. But Zermelo doesn't tell us *which* player. Strategy Stealing does. That is the new information."

  **3. Stint Hex Confusion**
  *   **Risk:** Students try to solve Stint Hex and get frustrated that there's no answer.
  *   **Mitigation:** Be firm that the *point* is the failure of the proof, not the solution to the game. "The lesson is not who wins Stint Hex. The lesson is why our previous logic stopped working."

  **4. Time Management**
  *   **Risk:** Hex games drag on.
  *   **Mitigation:** Enforce the 9x9 board. If a game lasts more than 4 minutes, call "Sudden Death" (next move decides).

  **5. The "Pass" Mechanics**
  *   **Risk:** In the Meta-Game, students get confused about who moves when.
  *   **Mitigation:** Clarify: "Red plays a stone. Then Red looks at the Blue Card and plays *another* Red stone (pretending to be Blue). Red is making two moves for every one of Blue's? No."
  *   *Correction for Facilitator:* Wait, the standard argument is P1 plays one stone, then *ignores it*.
  *   *Refined Instruction:* "Red plays one stone. Then, for every Blue move, Red looks at the Magic Card (which tells Blue what to do) and plays that spot as Red. If the card says 'Play the spot Red already took', Red plays anywhere else."
  *   *Crucial:* Ensure they understand Red is effectively playing as Blue *after* the first move. The "Pass" is mental, not skipping a turn.

  **6. The "Curse" Example**
  *   **Risk:** The Zugzwang example is too abstract.
  *   **Mitigation:** Use the "Fill-the-Hole" puzzle. Draw a path that requires an *empty* hex to pass through (e.g., a rule variant or a specific topological trap). Or simpler: "In a game where you lose if you complete a square (Sim/Dots-and-Boxes), an extra line of your colour can force you to complete a square and lose." Use **Dots-and-Boxes** for the "Curse" example if Hex is too rigid. It's faster to explain.
  *   *Decision:* Stick to Hex for continuity, but use a specific "Self-Block" endgame puzzle on the handout.

  ---

  ## Materials Checklist
  1.  **8 Hex Boards:** 9x9 printed on A3 paper (laminated if possible).
  2.  **Counters:** 30 Red, 30 Blue per table (for Stint Hex budget).
  3.  **Index Cards:** 16 total (for the "Magic Strategy").
  4.  **Whiteboard Markers.**
  5.  **Handout:** Rules + Stint Hex Rules + The "Self-Block" Puzzle diagram.

  ## Facilitator's Secret (For your eyes only)
  *   **Standard Hex:** P1 wins (proven by strategy stealing).
  *   **Stint Hex:** Unknown. If budget $N$ is very low, P1 might win by speed. If $N$ is high, it approaches normal Hex. If $N$ is "tight", P2 might win because P1 wastes budget on the throwaway. **Do not fake an answer.** The uncertainty is the lesson.
  *   **The Friend's Objection:** She is half-right. It *is* non-constructive. But in Maths, "Existence" is a stronger claim than "Possibility." The value is knowing you aren't searching for a P2 strategy that doesn't exist.
