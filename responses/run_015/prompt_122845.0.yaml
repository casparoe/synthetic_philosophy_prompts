  ### 2. The Immunity Feature

  **The Feature:** **The Long-Only Constraint (No Shorting).**
  The market architecture permits agents to express belief by *staking money on an outcome*, but does not permit them to express disbelief by *staking money against an outcome* (acting as the bookie).

  **Why it generates immunity:**
  A standard Dutch Book on a partition requires the bookie to take opposite sides of the agent's incoherence.
  *   If $P(A) + P(\neg A) > 1$ (Super-additivity), the Bookie **Sells** both to the Agent. (Requires Agent to Buy).
  *   If $P(A) + P(\neg A) < 1$ (Sub-additivity), the Bookie **Buys** both from the Agent. (Requires Agent to Sell).

  Sarah exhibits **Sub-additivity**. Her immunity exists solely because the market forbids the "Agent Sells" transaction. The incoherence is real, but the *direction* of the incoherence points toward a transaction type that the venue prohibits.

  **The Removal Test:**
  Imagine we patch ForecastFlow to allow **User-to-User Trading** (enabling Shorting).
  *   Sarah posts her buy limits. In a two-way market, her "Buy at 0.45" implies a "Sell at 0.45" (or she would be arbitraged by others instantly).
  *   Even if she only posts Buy prices, Mark can now offer to *Buy* from her.
  *   Mark offers: "I will buy your 'Yes' claim for \$0.45."
  *   Sarah (believing it's worth 0.45 to hold, but willing to sell at fair value) accepts.
  *   Mark offers: "I will buy your 'No' claim for \$0.45."
  *   Sarah accepts.
  *   **The Book Goes Through:** Mark pays \$0.90, collects \$1.00. Sarah loses \$0.10 sure.
  *   The immunity vanishes the moment the "Sell" contract becomes available.

  ---

  ### 3. The Dutch Book Theorist's Reply

  Here is how a sophisticated proponent of Dutch Book Arguments (DBA) would respond to this case, ranked by strength.

  **Reply A: "Credence Implies Two-Way Betting" (The De Finetti Defense)**
  *   **Argument:** "You haven't shown an incoherent agent who is immune; you've shown an agent whose *buying prices* are incoherent, but whose *selling prices* are undefined. A true subjective probability *is* a betting quotient. If Sarah refuses (or is unable) to sell, then 0.45 is not her probability for 'Yes'; it is merely her bid price. Her ask price is effectively $\infty$ (or 1.0). If we use her Ask prices, $Ask(Yes) + Ask(No) \ge 1.0$, and coherence is restored."
  *   **Rating:** **Strong.** This strikes at the definition of credence. If DBA defines rationality via betting behavior, and the behavior is structurally capped, the "credence" attribution is the error, not the DBA theorem.
  *   **Impact:** It suggests DBA tells us what *full* rationality looks like (two-way betting), and Sarah is irrational for participating in a market that prevents her from being fully rational.

  **Reply B: "Sufficiency, Not Necessity" (The Standard Retreat)**
  *   **Argument:** "Dutch Book Arguments were never intended to prove that *all* incoherent agents *will* lose money in *all* contexts. They prove that incoherence *makes you vulnerable* to loss. Sarah is vulnerable in principle. The fact that a specific market structure shields her is like saying a man without a helmet is 'immune' to head injury because he happened to walk under a low doorframe. The risk is inherent to the incoherence, even if the bookie is currently handcuffed."
  *   **Rating:** **Moderate.** This saves the theorem by weakening its claim. It shifts DBA from a pragmatic proof ("You will lose") to a dispositional claim ("You *would* lose if the world allowed it").
  *   **Impact:** It preserves the normative force of probability theory but admits that real-world frictions can mask irrationality.

  **Reply C: "Second-Best Irrationality" (The Economic Critique)**
  *   **Argument:** "Sarah is still irrational, just in a different way. She is leaving money on the table. By buying both Yes and No at 0.45, she guarantees herself a profit of 0.10 against the pool. A coherent agent would realize this is a 'free lunch' and arbitrage the pool until prices sum to 1. Sarah's incoherence prevents her from maximizing her expected utility relative to the market structure. She is a money pump for the House, even if Mark can't be the House."
  *   **Rating:** **Weak/Complementary.** This concedes the point that Mark can't Dutch Book her, but argues she is still pragmatically defective.
  *   **Impact:** It shifts the locus of irrationality from "vulnerability to a bookie" to "failure to optimize against the market."

  **Where this leaves the Claim:**
  This case demonstrates that **Dutch Bookability is not a necessary condition for probabilistic incoherence in constrained environments.**
  If DBA claims "To be incoherent *is* to be Dutch-Bookable," this case falsifies it.
  If DBA claims "To be incoherent is to hold beliefs that *would* be Dutch-Booked in a frictionless market," the claim survives, but becomes a counterfactual about ideal markets rather than a pragmatic guide for real ones.

