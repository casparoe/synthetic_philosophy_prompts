  **UNIVERSITY OVERSIGHT COMMITTEE ON COGNITIVE CLASSIFICATION (UOCCC)**
  **FORM 88-B: APPLICATION FOR REGRADE / COGNITIVE CAPACITY ASSESSMENT**
  **OMB CONTROL NO. 453-092**

  **INSTRUCTIONS:** Complete this form in triplicate for each biological agent subject to federal funding guidelines. Failure to accurately classify cognitive grade may result in retroactive liability for unapproved enrichment or unauthorized suffering. Define all acronyms. Do not anthropomorphize unless certified under Section IV.

  **SECTION I: DARWINIAN GRADE VERIFICATION (HARDWIRED REPERTOIRE)**
  *Applicable to agents whose behavioral output is determined primarily by ancestral selection.*
  1.1 Did the subject consciously select its phylogenetic inheritance prior to conception? [ ] Yes [ ] No [ ] N/A
  1.2 Please list all fixed action patterns that the subject attempted to override via individual deliberation.
  1.3 If the subject survived a predatory encounter due to instinct, provide documentation proving the instinct was not chosen.
  *Compliance Note:* Agents classified as Darwinian are exempt from learning budgets but must certify that no internal state influenced the execution of genetically mandated behaviors. If the subject cannot sign this waiver, the handler must sign on behalf of the genome.

  **SECTION II: SKINNERIAN GRADE VERIFICATION (REINFORCEMENT HISTORY)**
  *Applicable to agents capable of operant conditioning via direct consequence.*
  2.1 Attach itemized ledger of all trials conducted during the subject's lifetime.
  2.2 Calculate total caloric cost of incorrect hypotheses resulting in non-reinforcement.
  2.3 Who bore the liability for fatal trials? [ ] Subject [ ] Handler [ ] Insurance Provider
  *Compliance Note:* Upgrade to Skinnerian status requires proof that the subject paid for its education with its own hide or energy reserves. If the handler subsidized the cost of errors (e.g., providing safety nets during flight testing), the agent remains classified as Darwinian with external scaffolding. Reinforcement must be contiguous. Delayed gratification requires Section III clearance.

  **SECTION III: POPPERIAN GRADE VERIFICATION (INTERNAL MODELING)**
  *Applicable to agents capable of pre-selecting actions via internal simulation.*
  3.1 Did the subject perish during the testing of its most recent hypothesis? [ ] Yes [ ] No
  3.2 If "No," describe the internal mechanism that allowed the hypothesis to die in the subject's stead.
  3.3 Provide validation data for the internal simulator used in 3.2.
  *Fine Print:* Applicants are advised that the internal simulator referenced in 3.2 must itself be validated via Sections I and II. The Committee reserves the right to request the genetic and reinforcement history of the model-building mechanism. If the model was built by selection, the agent reverts to Darwinian status during model construction. If the model was built by reinforcement, the agent reverts to Skinnerian status during training. There is no guard for the guard.

  **SECTION IV: GREGORIAN GRADE VERIFICATION (EXTERNAL SCAFFOLDING)**
  *Applicable to agents utilizing cultural tools, language, or notation.*
  4.1 List all thinking tools imported from the local meme pool (e.g., language, arithmetic, diagrams).
  4.2 Are these tools removable? [ ] Yes [ ] No
  4.3 If "Yes," select status: [ ] Permanent Gregorian [ ] Provisional (Tool-Dependent)
  *Demotion Clause:* Agents designated as Provisional (Tool-Dependent) must submit to a Closed-Tools Regrade Hearing. During this hearing, all notebooks, devices, and linguistic scaffolding will be confiscated. If cognitive capacity drops below threshold during confiscation, the grade is revoked.
  *Limitation:* The Committee acknowledges no principled place to stop tool inclusion. If the agent uses a calculator, is the calculator the mind? If the agent uses a trainer, is the trainer the mind? See Section V.

  **SECTION V: ATTRIBUTION & APPEALS (VICARIOUS HYPOTHESIS LIABILITY)**
  *Applicable to all grades where hypothesis generation is ambiguous.*
  5.1 Were the candidate hypotheses generated by: [ ] The Subject [ ] A Trainer [ ] A Textbook [ ] A Statistical Model
  5.2 If the error died in someone else's stead (e.g., the trainer guessed wrong, not the subject), does the subject deserve credit for the correct subsequent action?
  *Appeals Provision:* In cases where the subject executes a correct action based on a hypothesis supplied by an external agent (trainer/textbook), the cognitive grade belongs to the supplier of the guess. However, if the subject selected the supplier, the grade belongs to the subject. If the subject was directed to the supplier by a previous supplier, a regress loop is declared.
  *Resolution:* In the event of a regress loop, the agent is classified as Darwinian by default until further notice.

  **CERTIFICATION**
  I certify that the mind described herein exists within the skull indicated on the attached diagram and is not distributed across the lab, the funding agency, or the evolutionary history of the species.

  **Handler Signature:** ___________________ **Date:** ____________
  **Subject Signature:** ___________________ (Or paw print/thumbprint)
  **UOCCC Use Only:** [ ] Approved [ ] Denied [ ] Sent to Ethics Board for Philosophical Review
