  # Joint Statement on the Granularity of Moral Character

  **Preamble**

  We, the undersigned defenders of global-trait virtue ethics and proponents of the situationist critique, submit this statement following a period of good-faith adversarial collaboration. Our objective has not been to resolve the metaphysical foundations of human nature, but to locate the empirical and normative stakes of our dispute within a specific psychological framing: whether stable moral dispositions are best modeled as cross-situational global traits (e.g., honesty, compassion as unitary characters) or as locally indexed moral expertise (e.g., domain-specific skills in resource fairness, stranger compassion, or promise-keeping).

  We agree that this framing represents the productive niche where philosophical theory meets psychological reality. We acknowledge that traditional debates have often talked past one another by conflating normative ideals with descriptive claims. This document outlines our shared empirical commitments and specifies the exact points of remaining theoretical divergence. We commit to treating the data generated by our shared protocol as binding evidence for the refinement of our respective models.

  ### Part I: Agreed Claims

  1.  **Limitations of Self-Report:** We agree that traditional self-report personality inventories possess poor predictive validity for specific moral behaviors in concrete contexts. Reliance on global self-assessments alone is insufficient for modeling moral action.
  2.  **Situational Variance:** We agree that situational variables—such as time pressure, social visibility, and ambient environmental cues—explain substantial variance in behavior that global-trait scores fail to absorb. Any adequate model of moral psychology must account for these contextual moderators.
  3.  **Prediction and Explanation:** We agree that predictive failure does not automatically entail explanatory irrelevance, and explanatory relevance does not automatically entail predictive success. A construct may be normatively or theoretically vital even if its statistical predictive power in isolated instances is modest.
  4.  **Coherence of Local Traits:** We agree that the concept of "local traits" or domain-specific moral skills is conceptually coherent and empirically distinguishable from global character. It is an open empirical question whether moral competence is unified or fragmented across domains.
  5.  **Normative Mediation:** We agree that purely descriptive psychology cannot by itself settle normative questions in virtue ethics without mediation by an account of moral development, habituation, or education. Data regarding how people *do* behave cannot directly dictate how they *ought* to behave without a bridging theory of moral improvement.
  6.  **Shared Empirical Protocol:** We commit to a shared empirical protocol to generate data that both sides will treat as bearing on the dispute. This protocol consists of ambulatory experience-sampling of moral micro-decisions across three domains (resource fairness, stranger-directed compassion, and promise-keeping), paired with peer-nomination ratings and independent behavioral coding.

  ### Part II: Disagreements Table

  The following table specifies the residual theoretical disagreements that the shared protocol is designed to address. We have formulated each position to ensure fidelity to the respective camps' core commitments.

  | Crux | Formulation accepted by virtue-ethics defenders | Formulation accepted by situationists | Agreed case, argument, or empirical result that bears on the crux | Predicted outcome by virtue-ethics defenders | Predicted outcome by situationists |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A. Factor Structure of Moral Consistency** | Moral character is best modeled as a unified latent structure; high moral agency implies a general disposition that manifests across distinct domains (fairness, compassion, promise-keeping). | Moral behavior is best modeled as a cluster of independent habits; high moral agency implies specialized competencies that do not necessarily correlate across distinct domains. | Factor analysis of peer-nomination consistency and behavioral coding across the three protocol domains. | **Expectation:** A single latent "global moral character" factor will explain the majority of covariance between domains.<br>**Revision Condition:** We would revise toward a local model if domain correlations remain weak (<0.30) after controlling for situational variables. | **Expectation:** Three largely independent domain-specific factors will emerge, with weak cross-domain correlations.<br>**Revision Condition:** We would revise toward a global model if a single general factor explains substantial variance (>50%) across all three domains. |
  | **B. Transfer of Moral Training** | Virtue is a unified excellence of character; targeted training in one moral domain (e.g., structured compassion exercises) should produce measurable behavioral transfer to an untrained domain (e.g., fairness in resource allocation). | Moral competence is context-specific skill acquisition; targeted training in one moral domain will remain locally confined without explicit bridging instruction. | Longitudinal measurement of behavioral changes in untrained domains following domain-specific intervention. | **Expectation:** Significant positive transfer effects will be observed in untrained domains following training.<br>**Revision Condition:** We would revise if training effects are strictly confined to the trained domain with zero spillover. | **Expectation:** Behavioral improvements will be statistically confined to the trained domain.<br>**Revision Condition:** We would revise if robust transfer effects are observed in untrained domains without explicit bridging. |
  | **C. Expert Consistency vs. Selection** | Individuals rated as "moral experts" by peers exhibit lower cross-situational variability in moral behavior compared to matched controls due to stable internal dispositions. | Individuals rated as "moral experts" exhibit consistency largely as an artifact of self-selection into predictable social environments that minimize moral conflict. | Comparison of behavioral variability scores between peer-nominated experts and controls across high-conflict vs. low-conflict situations. | **Expectation:** Experts will maintain high moral performance even in high-conflict, low-visibility situations where controls fail.<br>**Revision Condition:** We would revise if expert performance drops to control levels in high-conflict situations. | **Expectation:** Experts will show similar variability to controls when placed in novel, high-conflict situations outside their usual environment.<br>**Revision Condition:** We would revise if experts demonstrate significantly lower variability than controls in novel, high-conflict situations. |
  | **D. Normative Grounding of Practices** | Normative virtue ethics requires the presupposition of global traits to ground practices of moral education, praise, and blame; without cross-domain consistency, moral responsibility is undermined. | A "local-virtue" framework can preserve normative practices of education, praise, and blame without requiring cross-domain consistency, focusing instead on reliability within specific contexts. | Philosophical analysis of whether moral praise/blame loses coherence if an agent is compassionate but unfair, or honest but unkind. | **Expectation:** A local-virtue framework will fail to support robust accounts of moral responsibility and holistic moral education.<br>**Revision Condition:** We would revise if a coherent normative theory is demonstrated that sustains responsibility without global traits. | **Expectation:** A local-virtue framework will successfully sustain normative practices by focusing on context-specific reliability rather than global unity.<br>**Revision Condition:** We would revise if it is demonstrated that local frameworks inevitably collapse into skepticism about moral responsibility. |

  ### Closing Commitment

  We recognize that the results of the shared empirical protocol may not fully resolve the normative disagreements outlined in Crux D. However, we agree that clarifying the empirical reality of Cruxes A, B, and C is a necessary condition for progress on D. We commit to publishing the results of the shared protocol jointly, regardless of whether the data favors the global-trait model or the local-expertise model. Our shared goal is not victory for one camp, but a psychologically realistic account of moral agency that can sustain normative ethical practice.
