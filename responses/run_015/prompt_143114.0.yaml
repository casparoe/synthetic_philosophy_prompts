answer: |-
  ### Step-by-Step Design Thinking

  1.  **Objective Calibration:** The goal isn't to teach them *what* dynastic option value is (they're grad students; they can read a definition). The goal is to make them *feel* the frustration of structural asymmetry that persists despite formal equality. Standard economic simulations fail here because they treat risk as a mathematical variable rather than a psychological capacity. I need a mechanic that separates *assets* (taxable) from *risk tolerance* (non-taxable).

  2.  **Group Dynamics:** 14 students is an awkward number for large teams but perfect for pairs. I'll structure them as 7 "Dynasties" of 2 students each. This allows for a literal generational handoff. Student A is Gen 1, Student B is Gen 2. They sit together but play sequentially.

  3.  **The Mechanic (The "Weeds"):**
      *   *Resource:* "Prestige Points" (PP).
      *   *Action:* Choose a career path each round. "Safe" (low reward, no failure state) vs. "Venture" (high reward, high failure state).
      *   *The Trap:* If you fail a Venture, you get nothing. For some, "nothing" is survivable. For others, "nothing" is catastrophic.
      *   *The Twist:* Between Round 1 and Round 2, I enact a "100% Estate Tax." All PP are confiscated. Everyone starts Round 2 at zero.
      *   *The Hidden Variable:* 3 of the 7 Dynasties are secretly assigned a "Safety Net" card. This card allows them to reroll a failure or claim a consolation prize *once per round*. This represents the invisible social capital (housing, networks, parental co-signing) that isn't cash.
      *   *Transmission:* The Safety Net card is passed from Gen 1 to Gen 2 in a sealed envelope. The cash (PP) is taken by the tax man (me).

  4.  **Psychological Arc:**
      *   Round 1: Inequality emerges. Wealthy dynasties take risks; poor dynasties play safe.
      *   The Tax: Creates a sense of reset justice. "Now we're equal."
      *   Round 2: Inequality re-emerges immediately. The "Safe" group realizes their risk capacity was inherited, not bought.
      *   Debrief: Connect the feeling of "why bother trying the Venture?" to the philosophical concept.

  5.  **Anticipating Failure:** Grad students in political philosophy are professionally cynical. They will sniff out the rigging. If I make it too obvious, they'll disengage. If I make it too subtle, they'll miss the point. The "Safety Net" must be private initially but revealed in the debrief. Also, 75 minutes is tight; rule explanation must be under 5 minutes.

  6.  **Limitations:** A game cannot replicate the anxiety of real poverty or the guilt of unearned privilege. The "stakes" are candy or coffee. I need to explicitly acknowledge this gap in the debrief so they don't dismiss the simulation as trivial.

  ---

  ### Workshop Plan: "The Inheritance of Risk"

  **Time:** 75 Minutes
  **Participants:** 14 Grad Students (7 Pairs)
  **Materials:**
  *   7 Envelopes (3 marked "Gold", 4 marked "Standard" — *keep markings hidden from students*)
  *   14 Character Sheets (one per student)
  *   20 Tokens (for Prestige Points)
  *   1 D6 (die)
  *   Whiteboard for scoring

  #### I. Setup & Framing (0:00 – 0:10)
  *   **Seating:** Arrange 7 tables. Seat pairs together. Designate one person in each pair as "Gen 1" (left) and "Gen 2" (right).
  *   **Distribution:** Hand each table an envelope. Tell them: *"This contains your family's starting conditions. Do not open it yet. Do not show it to other tables."*
  *   **Narrative:** "You are building a family legacy over two generations. Your goal is to maximize Prestige Points (PP). PP determine your social standing. At the end, the top 3 Dynasties get priority registration for the next department seminar (or actual chocolate)."
  *   **Rules of Play:**
      1.  **Choice:** Each round, choose **Stable** or **Venture**.
      2.  **Stable:** Gain 2 PP automatically.
      3.  **Venture:** Roll the D6.
          *   Roll 4, 5, 6: Gain 6 PP.
          *   Roll 1, 2, 3: Gain 0 PP (Failure).
      4.  **Survival:** If you end a round with 0 PP, you are not eliminated, but you gain a "Hardship Marker." 2 Hardship Markers freeze your action in the next round (you must choose Stable).
  *   **Open Envelopes:** Gen 1 opens the envelope.
      *   *Standard:* No special rules.
      *   *Gold:* Contains a "Safety Net Card." Rule: *"Once per round, if you roll a Failure on a Venture, you may treat it as a Stable outcome (2 PP) instead."*
      *   *Instruction:* "Keep this card hidden. You may pass it to Gen 2 later."

  #### II. Round 1: Generation 1 (0:10 – 0:25)
  *   **Action:** Gen 1 players make their choice simultaneously.
  *   **Observation:** Watch the tables. The "Gold" families will likely choose Venture (risk mitigated). The "Standard" families will likely choose Stable (fear of Hardship).
  *   **Scoring:** Collect PP totals on the whiteboard.
  *   **The Trap:** Allow the Gold families to accumulate significantly more PP (e.g., 12 vs 4). Let the inequality become visible.

  #### III. The Intervention: 100% Estate Tax (0:25 – 0:35)
  *   **The Announcement:** "In the spirit of equal opportunity, the state is intervening between generations. All accumulated Prestige Points are taxed at 100%."
  *   **Action:** Collect all tokens from the table. Reset everyone to 0 PP. Remove Hardship Markers (fresh start).
  *   **The Handoff:** Gen 1 passes the envelope (and any cards inside) to Gen 2. Gen 1 must remain silent; Gen 2 opens the envelope.
  *   **Psychological Moment:** The Standard families feel relieved (inequality wiped). The Gold families check the envelope, find the Safety Net Card, and realize their advantage wasn't the points—it was the rule exemption.
  *   **Discussion (Brief):** Ask: "Does this feel fair?" (Most will say yes, because assets were equalized).

  #### IV. Round 2: Generation 2 (0:35 – 0:50)
  *   **Action:** Gen 2 players make choices.
  *   **The Outcome:** Because the Safety Net Card was inherited, the Gold Dynasties will *again* choose Venture. The Standard Dynasties, lacking the card and seeing the previous volatility, will likely stick to Stable.
  *   **Result:** Despite starting at 0 PP, the Gold Dynasties pull ahead again by Round 2's end.
  *   **Freeze:** Stop the game immediately after choices are resolved, before final scoring creates too much resentment.

  #### V. Debrief & Mapping (0:50 – 1:15)
  *   **Phase 1: Phenomenology (10 mins):** Ask the Standard Gen 2s: "You started with 0 points, same as the Gold group. Why did you choose Stable?" Ask Gold Gen 2s: "What made you feel safe choosing Venture?"
      *   *Target Answer:* "I couldn't afford to fail" vs. "I knew I wouldn't really fail."
  *   **Phase 2: The Mechanic Mapping (10 mins):** Draw the analogy on the board.
      *   *Prestige Points:* Cash/Assets (Taxable).
      *   *Safety Net Card:* Social Capital/Networks/Downside Insurance (Non-taxable).
      *   *The Tax:* Estate/Inheritance Tax.
      *   *The Result:* Formal equality (0 points) vs. Substantive inequality (Risk Capacity).
  *   **Phase 3: Philosophical Implications (5 mins):** Connect to "Dynastic Option Value."
      *   The advantage isn't what you *have*; it's what you can *attempt*.
      *   Policy that only targets assets leaves the engine of inequality (risk asymmetry) intact.
      *   The "invisible" nature of the card represents how social capital is harder to legislate than cash.

  ---

  ### Predictable Flops & Mitigation

  1.  **The "Game Theory" Break:** Someone will realize the optimal strategy immediately and announce it.
      *   *Mitigation:* Enforce the "Hidden Information" rule strictly. If a table shares their card content with another table, they are disqualified. This mirrors the exclusivity of social networks.
  2.  **Risk Aversion Variance:** Some "Standard" students might gamble anyway just for fun, muddying the data.
      *   *Mitigation:* Emphasize the "Hardship Marker" rule. Make the penalty for failure feel bureaucratic and annoying, not just numeric. Grad students hate inefficiency.
  3.  **Cynical Disengagement:** They might say, "This is rigged, why are we playing?"
      *   *Mitigation:* Lean into it. In the debrief, say: "Yes, it was rigged. That is the point. The system is designed to look fair (the tax) while preserving the advantage (the card)." Validate their cynicism as the correct philosophical response.
  4.  **Time Creep:** The tax collection and envelope handoff always take longer than expected.
      *   *Mitigation:* Have a TA or helper collect tokens if possible. If not, do it yourself aggressively. Cut the Phase 3 discussion short if needed; Phase 1 is the most important.

  ### Limitations: What the Room Can't Reproduce

  You need to supply these verbally in the debrief because the simulation cannot capture them:

  1.  **The Emotional Weight of Ruin:** In the game, "Failure" means losing a plastic token. In reality, failure means debt, homelessness, or permanent career scarring. The students *know* the stakes are fake. You must articulate that the "Safety Net" isn't just about points; it's about the absence of cortisol, the ability to sleep at night while starting a business. The simulation creates cognitive understanding, not somatic fear.
  2.  **The Invisibility of the Network:** In the game, the Safety Net is a physical card. In reality, it's a phone call, a dinner invitation, a name recognized by a hiring committee. It's invisible. The card makes the advantage too visible. You need to explain that real dynastic option value is often indistinguishable from "merit" or "luck" to the outsider.
  3.  **The Multi-Generational Horizon:** Two rounds is not enough to show compounding disadvantage. Real dynastic advantage is about centuries of compounded risk-taking. The game shows the *mechanism*, but you have to describe the *scale*.

  ### Final Note on Execution
  Don't apologize for the rigging. Own it. The friction they feel when the tax fails to equalize the outcome is the learning objective. If they leave angry at the rules, you've succeeded; that anger is the proxy for the political reality you're modeling.
