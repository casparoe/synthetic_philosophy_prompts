  to: legacy archives committee
  from: [your name]
  date: [current date]
  subject: sidgwick papers – recommendation for friday's vote

  hey everyone,

  i've been thinking over the split on the sidgwick psychical research stash. i know we're stuck between worrying about the university looking like we endorse ESP versus worrying about hiding history. after looking at the options (digitize with panel, digitize with warning, or seal for 30 years), i'm recommending we **digitize with an interpretive panel**.

  here's why, especially for those of us who mostly know sidgwick from *the methods of ethics*:

  sidgwick wasn't necessarily trying to prove ghosts were real. his point was that dismissing anomalous claims out of hand is just as unscientific as believing them without proof. he felt a dual pressure: credulity harms knowledge (believing too easily), but suppression harms inquiry (ignoring data because it's awkward). if we seal the papers, we're doing the suppression thing—pretending this rigorous guy didn't spend decades investigating this. it misrepresents his actual ethics.

  but if we just put the letters up without context, we risk the credulity thing. it looks like the university is saying "sidgwick was right about telepathy" rather than "sidgwick was serious about testing claims."

  an interpretive panel fixes this. it lets us frame the collection as a history of scientific methodology, not a confirmation of psychic powers. we can explain that he applied the same rigor to these notes as he did to utilitarian calculus. it respects his commitment to truth without committing us to the truth of the claims.

  **implementation timeline:**
  *   **digitization:** complete scanning by end of current semester.
  *   **panel text:** draft circulated to committee two weeks before launch for approval.
  *   **review cycle:** the panel text should be reviewed every 5 years to ensure the language stays clear and doesn't age poorly as public understanding of science shifts.

  sealing it feels like censorship, and a warning disclaimer feels too defensive. a panel treats the researchers—and the university visitors—as adults capable of understanding context.

  let's talk more on friday.

  best,
  [your name]
