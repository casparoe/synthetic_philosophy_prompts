prompt: |-
  I sit on our university's legacy archives committee, there's 6 of us. We found this stash of Sidgwicks old papers on psychical research — letters with Myers, some session notes from the 1880s, nothing dangerous but it's awkward. There's a proposal to digitize everything and mount it with an interpretive panel, but the committee is split: some say putting it up with a respectful framing makes it look like the university endorses ESP research, others say burying it misrepresents Sidgwicks actual ethics since he insisted on investigating anomalous claims with the same rigor as anything else, and suppressing it violates the duty to pursue truth. We vote next friday.

  Can you draft a short memo — recommend digitize with panel, digitize with a warning disclaimer, or seal for 30 years — with reasoning that takes both sides seriously? I want it to actually engage Sidgwicks position that there's a dual pressure here: credulity harms knowledge, but suppression harms inquiry. Don't ask for citations or a reading list, just make it clear enough that committee members who only know Sidgwick from his ethics book can follow. Also recommend a concrete timeline for implementation if we go the digitize route, like when the panel should be reviewed. Keep it casual, I wrote 'friday' lowercase and probably misspelled something else.
