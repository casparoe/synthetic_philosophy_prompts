  **Decomposition and Calculation**

  I treat the four components as conjunctive necessary conditions. For behavioral success to be *sufficient* for attributing understanding under the stated constraints, all four propositions must hold. I calculate the joint probability as the product of the four assigned values.

  *   **(a) Functionalism Prior: 0.60**
      This is the probability that mental states are defined solely by causal role (input-output mapping) rather than internal constitution. I weight this above 0.5 because functionalism is the dominant operational framework in cognitive science, but I withhold higher confidence due to persistent internalist objections (e.g., qualia, biological naturalism).
  *   **(b) Adversarial Exclusivity: 0.50**
      This is the probability that a finite, domain-specific Turing interaction can logically rule out all non-understanding mimicry (e.g., massive lookup tables or stochastic approximation). I assign 0.50 because while adversarial testing pressures the system, it cannot formally exclude the possibility of a "Blockhead" system that simulates understanding without possessing it.
  *   **(c) Behavioral Sufficiency: 0.70**
      This is the probability that understanding is a graded property fully capturable by external performance. I assign this relatively high value because, in practice, behavioral competence is the only metric available for attributing understanding to other humans, making it the pragmatic standard.
  *   **(d) Mechanism Immunity: 0.19**
      This is the probability that knowledge of a non-compositional, associative mechanism does *not* defeat the attribution of *conceptual* understanding. This is the primary bottleneck. "Conceptual" implies compositionality (systematicity, productivity). If we know the mechanism lacks this structure, the probability that it nonetheless sustains genuine conceptual understanding is very low.

