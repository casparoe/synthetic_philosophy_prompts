answer: |-
  ### 1. The Board's Implicit Rules

  Based on the five settlements, the Board operates on three working principles. They are not written in the Union Act, but they have held in every closed session to date.

  **Rule I: The Symmetry of Dismissal**
  The authority that installs the executive must be the authority that removes it, unless the office is bifurcated.
  *   *Derivation:* In **Sable**, **Verrine Coast**, and **Kalva (Premier)**, the assembly appoints and the assembly removes (via substitution or concurrent majority). In **Ondres**, the electorate appoints and the electorate (via impeachment trial or waiting out the term) removes. In **Kalva (President)**, the electorate appoints, so removal requires the electorate (referendum) plus a supermajority assembly check.
  *   *The Conflict:* **Upper Aule** complicates this with recall, but recall is a voter petition, not an assembly vote. The Board has never allowed a simple assembly majority to unseat a directly elected head of government.

  **Rule II: The Fragmentation Veto**
  A unitary directly elected executive is prohibited in a province where the party system is fragmented (more than two stable blocs) and the executive holds full domestic power.
  *   *Derivation:* **Sable** (fragmented) was denied direct election. **Verrine Coast** (fragmented by region) was denied direct election. **Ondres** (two blocs) was granted it. **Kalva** was granted direct election only because the executive power was split (Semi-Presidential), insulating the domestic agenda from the directly elected President.
  *   *The Conflict:* **Marche** has four disciplined parties and no stable blocs (Fragmented), yet proposes a unitary directly elected Governor (Full Power).

  **Rule III: The Fiscal Leash**
  An executive with access to significant non-legislative revenue must be either fully accountable to the assembly (Parliamentary) or fully independent of it (Fixed Term), but cannot be hybridized.
  *   *Derivation:* In **Ondres**, the Governor has no ordinance power and emergency powers lapse without approval; the audit office is strong. In **Sable**, the cabinet is dependent on the assembly. In **Marche**, the Governor appoints the Basin Authority board (independence) but the Assembly authorizes the revenue (dependence).
  *   *The Conflict:* If the Assembly can fire the Governor, they will strangle the Basin. If they cannot, the Governor rules via the Basin. The proposed "Confidence-Locked Mandate" attempts to bridge this but creates a weaponized budget process.

  ### 2. Application to the Marche Proposal

  **Direct Election:**
  *   *Prediction:* **Violation.** Violates Rule II (Fragmentation Veto). The Board views *Sable* as the warning case: direct election in a multiparty system produces a Governor with 35% support claiming 100% mandate, governing against a hostile assembly.
  *   *Nuance:* The Board might accept it *if* powers were bifurcated like *Kalva*, but the proposal is for a unitary executive.

  **Removal with Named Successor (Confidence-Locked Mandate):**
  *   *Prediction:* **Fatal Violation.** Violates Rule I (Symmetry of Dismissal). This is the "Sable substitution rule" applied to an "Ondres-style mandate."
  *   *Consequence:* It creates two masters. The Governor claims legitimacy from the voters; the Assembly claims the right to fire them. This invites the exact instability seen in *Sable*, but with higher stakes because the Governor can claim the Assembly is usurping the popular will.

  **Once-a-Year Restriction:**
  *   *Prediction:* **Insufficient Mitigation.** The Board views procedural hurdles on removal as secondary to the principle of removal. A "safe" coup is still a coup. In *Kalva*, the removal bar is high (2/3 + Referendum); in *Marche*, it is low (Simple Majority), merely infrequent.

  **Absence of Dissolution:**
  *   *Prediction:* **Asymmetry.** In *Ondres*, the Governor cannot dissolve, but cannot be fired. In *Sable*, the Premier can be fired, but can usually request dissolution (implied in parliamentary norms). In *Marche*, the Assembly can fire the Governor, but the Governor cannot dissolve the Assembly. This makes the Assembly supreme, rendering the direct election cosmetic.

  **Fee-Funded Authority (Basin):**
  *   *Prediction:* **High Risk.** Violates Rule III (Fiscal Leash). Because the Governor appoints the board, they control the *allocation* of the 20%. Because the Assembly authorizes the *revenue*, they control the *flow*. Combined with the removal power, the Assembly can hold the budget hostage to force a resignation without using the formal removal vote.

  ### 3. The Ruling

  **Decision:** **Rejection.** The Charter for Marche is returned to the drafting committee.

  **Closest Analog:** **Sable.**
  *   *Reasoning:* Like Sable, Marche has a fragmented multiparty system without stable coalitions. The Board's priority in *Sable* was preventing executive-legislative deadlock. The *Marche* proposal guarantees deadlock by giving both sides independent legitimacy (Voters vs. Assembly) and a mechanism for war (the removal vote).

  **Dangerous Analog:** **Ondres.**
  *   *Why it is wrong to cite:* Proponents will cite *Ondres* to justify the direct election. This is superficial. *Ondres* worked because the two-party system ensured the Governor had a working majority or a clear opposition. In *Marche*, a 35% Governor faces a 65% hostile assembly. *Ondres* stability cannot be transplanted to *Marche* fragmentation.

  **The Minute (Majority Reasoning):**
  > "The Board finds that the proposed Confidence-Locked Mandate violates the Principle of Symmetric Dismissal established in the Ondres and Kalva settlements. A directly elected executive derives authority from the provincial electorate; to permit a simple legislative majority to terminate that mandate, even with a named successor, reduces the governorship to a committee appointment disguised as a popular mandate.
  >
  > Furthermore, under the Fragmentation Veto observed in Sable and Verrine Coast, a unitary direct executive is incompatible with a four-party assembly lacking stable blocs. The proposal creates a dual-legitimacy crisis: the Governor will claim the Assembly is defying the people, and the Assembly will claim the Governor is defying the coalition. The Basin Authority provisions exacerbate this by providing the Executive with independent fiscal leverage against the very body empowered to remove him. The Board cannot charter a government designed for cohabitation warfare."

  **The Dissent (Minority Opinion):**
  > "The Majority clings to a formalism that ignores the political reality of Marche. In *Kalva*, we granted direct election despite a history of coups because the public demand was undeniable. In *Marche*, seventy percent demand a voice. To deny this is to invite the extra-constitutional pressure we saw in *Kalva*.
  >
  > The Confidence-Locked Mandate is not a violation of principle; it is an evolution of it. It combines the stability of *Sable* (no early elections, named successor) with the accountability of *Ondres* (direct vote). The 'dual legitimacy' the Majority fears is not a bug; it is a feature. It forces the 35% Governor to negotiate with the Assembly, rather than ruling by decree. We are chartering a province, not a machine. If the voters choose a Governor the Assembly cannot work with, the Assembly must have the tool to replace him without dissolving the state. To reject this is to prioritize the Board's taxonomy over the province's peace."

  ### 4. Underdetermination and Amendments

  The five settlements do genuinely underdetermine the sixth. The Board *could* approve *Marche* as a new hybrid model, provided specific amendments are made to align it with the *spirit* of the Rules, even if it bends the letter.

  **Option A: The "Kalva Compromise" (Amend Powers)**
  *   **Amendment:** Strip the Governor of domestic legislative initiative. Confine the Governor to external relations, Basin Authority oversight, and defense. Create a separate Premier elected by the Assembly for domestic policy.
  *   **What it buys:** Consistency with **Rule II (Fragmentation Veto)**. It allows the direct vote (satisfying public demand) but prevents the 35% Governor from gridlocking the Assembly on domestic law.
  *   **Minute Language:** "Bifurcation of the executive mandate to align with the Kalva precedent."

  **Option B: The "Ondres Correction" (Amend Removal)**
  *   **Amendment:** Remove the "Confidence-Locked Mandate." The Governor serves a fixed term. Removal is only by impeachment (2/3 vote) for cause. If the Assembly and Governor deadlock, the Governor cannot dissolve, but the Assembly cannot fire.
  *   **What it buys:** Consistency with **Rule I (Symmetry of Dismissal)**. It acknowledges that if the voters pick the Governor, only the voters (or a supermajority representing near-consensus) can fire them.
  *   **Risk:** High risk of gridlock in a fragmented system.
  *   **Minute Language:** "Restoration of fixed-term integrity per Ondres."

  **Option C: The "Basin Firewall" (Amend Finance)**
  *   **Amendment:** The Basin Authority board is appointed 50% by the Governor, 50% by the Assembly Chair. Revenue authorization is automatic unless vetoed by a concurrent majority (including regional delegations, if applicable, or simply 60% provincial).
  *   **What it buys:** Consistency with **Rule III (Fiscal Leash)**. It prevents the budget from being used as a weapon in the removal game.
  *   **Minute Language:** "Depoliticization of non-tax revenue streams."

  **Recommendation:** If the Board wants to approve the charter, **Option A** is the most robust institutional fix. It admits that *Marche* is too fragmented for a unitary direct executive.

  ### 5. One Altered Fact for Future Conflict

  **The Alteration:**
  The River-Basin Authority does not merely collect fees; it holds **eminent domain powers** and its budget is **constitutionally guaranteed** (not subject to annual assembly authorization), provided the fees are collected. The Assembly can audit, but cannot cut.

  **Why this forces a decisive split:**
  This breaks **Rule III (The Fiscal Leash)** completely.
  *   **The Majority View:** This makes the Governor financially independent of the Assembly. If you combine this with the "Confidence-Locked Mandate" (Assembly can fire Governor), you create an impossible contradiction. The Assembly can fire the Governor, but the Governor controls the money needed to run the government. This is a recipe for a constitutional crisis where the Governor refuses to leave, funding their own defense via the Basin.
  *   **The Dissent View:** This makes the "Confidence-Locked Mandate" *essential*. Because the Governor has independent money, the Assembly *must* have the power to fire them, or the Governor becomes an elected monarch.
  *   **The Conflict:** The Board can no longer compromise. Either the Basin's independence is revoked (angering the economic sector), or the Removal Power is revoked (angering the parties), or the Charter creates a mechanism for civil war. This forces the Board to decide whether **Money** or **Votes** are the true source of sovereignty in Verraine.
