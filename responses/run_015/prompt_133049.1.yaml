      *   **Constraints:** No standard textbook arguments (fusion vs. separation of powers), no authorities/citations/reading lists. The arguments must be internal to the Board's logic and consistent with the provided precedents.
      *   **Deliverables:**
          1.  3-4 implicit rules derived from the 5 precedents that conflict on *Marche*.
          2.  Application of these rules to *Marche's* specific features (direct election, removal mechanism, timing, dissolution, basin authority).
