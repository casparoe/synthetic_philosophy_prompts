  6.  **Predicting the Ruling (Task 3):**
      *   *Outcome:* Rejection or Major Amendment. The Board tends to be institutionalist, not populist. They rejected direct election in *Sable* and *Verrine Coast* despite pressures. They only allowed it in *Ondres* (stable) and *Kalva* (constrained). *Marche* is unstable + unitary power.
      *   *Closest Analog:* *Sable* (Fragmented parties, need stability) or *Kalva* (Direct demand, but needs power split).
      *   *Dangerous Analog:* *Ondres*. It looks like *Ondres* (Direct Governor), but *Ondres* had 2 parties. *Marche* has 4.
      *   *Reasoning:* The "Confidence-Locked Mandate" creates a hybrid that satisfies no one. It undermines the governor's independence (making the election moot) while destabilizing the assembly (encouraging constant coups).
      *   *Dissent:* Argues for *Kalva* logic. People want the vote. Give them the vote, constrain the power (like *Kalva*), or trust the removal mechanism (*Sable* style) to prevent tyranny. The "Mandate Consistency" is fetishism.

  7.  **Underdetermination & Amendments (Task 4):**
