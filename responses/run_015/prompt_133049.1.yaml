          *   *Basin:* Assembly appoints half the board.
      *   *What it buys:* It buys consistency with *Ondres* (Direct = Voter removal) or *Sable* (Assembly = Policy control, not personnel).

  8.  **Altered Fact for Future Conflict (Task 5):**
      *   Need something that breaks the consensus.
      *   *Idea:* The Basin Authority isn't just fees; it has police/enforcement powers. Or, the 35% party is explicitly anti-Union.
      *   *Better Idea:* The "35% party" is actually a coalition of two parties that *refuse* to coalesce, making the fragmentation worse.
      *   *Best Idea:* The Basin Authority revenue is *constitutionally guaranteed* (not subject to annual authorization). This makes the Governor financially independent of the Assembly, making the Assembly's removal power toothless or dangerous.

  9.  **Refining the Output (Self-Correction/Polishing):**
      *   *Tone:* Bureaucratic, precise, analytical. No academic jargon.
      *   *Check:* Did I cite authorities? No. Did I rehearse standard fusion/separation arguments? No, focused on the Board's specific precedents.
      *   *Focus:* Ensure the "Confidence-Locked Mandate" is the central pivot. It's the weird innovation.
      *   *Rule Formulation:* Make sure they sound like *Board* rules, not political science textbook headers. "The Principle of..."
      *   *Dissent:* Needs to be sharp. Not "I feel," but "The precedent implies..."

      *(Self-Correction on Rule 1)*: The prompt asks for rules that "fit all five precedents."
      *   *Sable:* Assembly selects, Assembly removes (Substitution).
      *   *Ondres:* Voters select, Impeachment removes.
      *   *Kalva:* Voters select President (Referendum removes), Assembly selects Premier (Substitution removes).
      *   *Upper Aule:* Voters select Council, Recall removes.
      *   *Verrine Coast:* Assembly selects, Concurrent Majority removes.
      *   *Common Thread:* **The Source of Legitimacy Determines the Mode of Termination.** (Voters = Hard removal / Assembly = Soft removal). *Marche* breaks this.

      *(Self-Correction on Rule 2)*: **The Fragmentation Veto.** Direct unitary executives are barred in fragmented systems unless power is split (*Kalva*) or parties are stable (*Ondres*). *Sable* (Fragmented) = No Direct. *Verrine* (Fragmented by region) = No Direct. *Marche* (Fragmented by party) = Direct? Violation.

      *(Self-Correction on Rule 3)*: **The Fiscal leash.** If the executive has independent money, they need a hard mandate (*Ondres*) OR assembly dependence (*Sable*). *Marche* has independent money source (Basin) + Assembly dependence (Removal). Dangerous.

      *Let's write.*

      *Structure:*
      1. The Three Rules.
      2. Application to Marche.
      3. Ruling, Analogs, Reasoning, Dissent.
      4. Underdetermination & Amendments.
      5. Altered Fact.

      *Tone Check:* "The Board," "The Minute," "The Clerk." Keep it in-universe.

      *Specific focus on the "Confidence-Locked Mandate":* This is the core tension. It treats a Governor like a Premier.
      *Dissent argument:* It's a "Sable solution to an Ondres demand."
      *Majority argument:* It creates a "dual legitimacy" crisis.

      *Wait, one detail:* *Kalva* President is directly elected but removable by 2/3 Assembly + Referendum. This is a hybrid. Does this kill Rule 1?
      *Nuance:* *Kalva* President is *confined to external relations and defence*. The *Marche* Governor is unitary (presumably). Also *Kalva* requires a Referendum. *Marche* is just Assembly vote.
      *Refined Rule 1:* **The Symmetry of Dismissal.** A directly elected head may only be dismissed by the electorate, unless the office is functionally ceremonial or shared (Kalva), in which case a supermajority plus referendum is required. Simple assembly majority is for assembly-appointed heads only.

