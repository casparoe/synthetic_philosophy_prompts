  2.  **Deconstruct the Precedents (The "Case Law"):**

      *   *Sable:* Fragmented multiparty system, instability. *Solution:* Parliamentary + Substitution Rule (constructive no-confidence). *Rejected:* Direct election. *Logic:* Stability requires assembly control; direct election risks deadlock or populism in fragmented systems.
      *   *Ondres:* Stable two-party system, strong institutions. *Solution:* Directly elected Governor (Presidential-ish). *Removal:* Impeachment only (hard). *Logic:* Stability allows for direct mandate; institutions check abuse; public wants delivery, not consultation.
      *   *Kalva:* History of coups, personalist parties, demand for direct election. *Solution:* Semi-Presidential (Dual Executive). President (Foreign/Defense) + Premier (Domestic/Assembly). *Removal:* President (2/3 + Referendum), Premier (Substitution). *Logic:* Compromise. Give people the direct vote they want but cage the power to prevent dictatorship/coups. Split the mandate.
      *   *Upper Aule:* Small, homogeneous, direct democracy tradition, low party trust. *Solution:* Plural Executive (Council), rotating chair, recall. *Rejected:* Strong Mayor. *Logic:* Consensus over leadership; direct democracy checks exist (initiative/referendum).
      *   *Verrine Coast:* Regional cleavage (3 regions, 1 minority). *Solution:* Parliamentary Premier + Concurrent Majority for no-confidence (Region + Province). *Rejected:* Direct Governor. *Logic:* Direct election would let the majority region dominate the minority permanently. Protection of minority via assembly mechanics.

  3.  **Analyze the Current Case: *Marche*:**
      *   *Party System:* 4 parties, PR, low threshold. Largest ~35%. Disciplined but no stable majority/blocs. (Similar to *Sable*, but less fragmented? Or *Kalva* without the coups?)
      *   *Institutions:* Clean admin, independent audit. (Like *Ondres*).
      *   *History:* No coups. (Unlike *Kalva*).
      *   *Cleavages:* No regional cleavage. (Unlike *Verrine Coast*).
      *   *Public Opinion:* 70% want direct election. (Like *Kalva*, unlike *Sable/Ondres* where preference wasn't the driver).
      *   *Unique Feature:* River-basin authority (20% budget), Governor appoints board, Assembly authorizes revenue.
      *   *Proposal:* Direct Governor (4yr), Cabinet outside assembly, No dissolution, "Confidence-Locked Mandate" (Constructive No-Confidence on a *Directly Elected* official).

  4.  **Drafting the Implicit Rules (Task 1):**
      *   *Rule 1 (The Stability/Fragmentation Rule):* Direct election is only safe when the party system is stable (2 blocs) OR when executive power is severely constrained. (*Ondres* = Direct + Stable Parties. *Sable* = No Direct + Unstable Parties. *Kalva* = Direct + Constrained Power).
      *   *Rule 2 (The Accountability/Removal Rule):* If the executive is directly elected, removal must be difficult (Impeachment/Referendum) to respect the mandate. If the executive is assembly-derived, removal is easy (Substitution). You don't mix Direct Mandate with Assembly Dismissal. (*Ondres* = Direct + Hard Removal. *Sable/Kalva Premier* = Assembly + Easy Removal).
      *   *Rule 3 (The Cleavage/Dominance Rule):* Direct election is forbidden if it allows a permanent majority (regional or partisan) to lock out minorities. (*Verrine Coast* = No Direct. *Upper Aule* = No Single Executive).
      *   *Rule 4 (The Fiscal Independence Rule):* An executive with independent revenue sources cannot be easily removable by the assembly, or the assembly must control the revenue. (*Marche* specific, derived from *Ondres* audit/finance strictness).

      *Refining Rule 2:* The prompt highlights the "Confidence-Locked Mandate" as unique. The tension is between *Ondres* (Direct = Hard to fire) and *Sable* (Assembly choice = Easy to swap). *Marche* mixes them.
      *Refining Rule 1:* *Kalva* allows direct election despite instability because power is split. *Marche* proposes a unitary direct executive despite instability.

      *Let's formulate the Rules sharply:*
      1.  **The Mandate Consistency Principle:** The method of selection must match the method of removal. Direct election requires fixed terms/impeachment; Assembly selection allows constructive no-confidence.
      2.  **The Fragmentation Constraint:** A unitary directly elected executive is prohibited in multiparty systems lacking stable coalitions, unless powers are bifurcated (Semi-Presidential).
      3.  **The Fiscal Control Principle:** An executive controlling significant non-tax revenue must either be assembly-dependent (Parliamentary) or subject to strict fiscal oversight (Ondres), but not both independent revenue and assembly dismissal.

  5.  **Applying Rules to *Marche* (Task 2):**
      *   *Direct Election:* Violates Fragmentation Constraint (4 parties, no blocs). Matches Public Will (*Kalva*).
      *   *Removal (Confidence-Locked):* Violates Mandate Consistency. You don't let an assembly fire a directly elected governor like a PM.
      *   *Once-a-Year:* Attempts to mitigate the violation, but doesn't solve the principle.
      *   *No Dissolution:* Standard for Direct Executives (*Ondres, Kalva*), but creates asymmetry if Assembly can fire Governor but Governor can't fire Assembly.
