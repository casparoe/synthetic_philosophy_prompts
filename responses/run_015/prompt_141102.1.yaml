answer: |-
  ### What the method commits us to, in our vocabulary

  Heterophenomenology commits us to treating the patient's utterance not as a window into a private inner world, but as a public text to be interpreted. We are not measuring "pain" or "fatigue" as metaphysical realities; we are measuring the stability and consistency of the *report* of pain or fatigue. The patient is the authority on what they say, not on what exists inside them. This shifts our validity evidence from "does this match the disease?" to "does this text behave consistently across contexts?"

  Your two homemade devices survive this translation. The **Two-route rule** ensures the text emerges from the subject's narrative structure, not the interviewer's script, preventing us from mistaking our own suggestions for their experience. The **Gloss-swap test** checks if clinical language can successfully inhabit the patient's textual universe without breaking it. Both avoid the error of assuming direct access to qualia. They treat the interview as a data-generation machine where the output (the transcript) is the only reality we can verify. We are building an instrument that measures the *reportability* of the condition. If the report shifts wildly based on who is listening or what was asked previously, the text is unstable, and the item is invalid. We commit to killing items that rely on the assumption of a stable inner state when the outer text proves unstable.

  ### The protocol

  **Gate 1: Extraction**
  *   **Question:** Does the concept appear as a distinct semantic unit in the transcript?
  *   **Sufficient Answer:** The term or concept is identifiable and isolated from general distress statements.
  *   **Stop Rule:** No. If the concept is only inferable by the coder (e.g., patient says "I'm tired" but coder labels it "fatigue" without patient usage), reject.
  *   **Escalation:** None.

  **Gate 2: Independence (The Two-Route Rule)**
  *   **Question:** Did the concept appear in spontaneous recall *and* under structured probing, without the interviewer naming it first?
  *   **Sufficient Answer:** Yes. The patient introduced the term, and later confirmed it when asked about specific domains.
  *   **Stop Rule:** No. If the patient only mentions the symptom after the interviewer suggests it, or only spontaneously but denies it when probed, reject. This indicates the concept is an artefact of leading or too fragile to sustain questioning.
  *   **Escalation:** None.

  **Gate 3: Stability (The Gloss-Swap Test)**
  *   **Question:** When the clinician's gloss was substituted for the patient's word later in the interview, did the patient adopt the gloss unprompted?
  *   **Sufficient Answer:** Yes. The patient used the clinical term themselves in subsequent turns.
  *   **Stop Rule:** No. If the patient merely assented ("Yeah, I guess") but reverted to their own language or silence, reject. Assent is politeness, not textual integration.
  *   **Escalation:** If the patient rejects the gloss but offers a consistent alternative, escalate to Lead Linguist for item rewording.

  **Gate 4: Contextual Invariance**
  *   **Question:** Does the report hold across different elicitation contexts (e.g., diary vs. interview, different question orders)?
  *   **Sufficient Answer:** Yes. Severity and frequency reports are consistent regardless of preceding items or audience.
  *   **Stop Rule:** No. If severity shifts by >1 point based on question order or audience (e.g., nurse present), reject as a framing artefact.
  *   **Escalation:** If the shift is consistent (e.g., always lower after pain questions), escalate to Psychometrician. This indicates a construct overlap, not necessarily invalidity, but requires modelling.

  **Gate 5: Final Admission**
  *   **Question:** Does this item serve the intended purpose of the instrument (change detection vs. vocabulary)?
  *   **Sufficient Answer:** Consensus that the text supports the regulatory claim.
  *   **Stop Rule:** No. If the item is stable but irrelevant to the trial endpoint, reject.
  *   **Escalation:** **Mandatory.** This is not an evidence question. The Lead Director must decide if a stable report is clinically useful. This is where we decide if we are measuring the disease or the patient's reaction to it.

  ### Worked applications

  **Case One: Brain Fog**
  The protocol kills this as a headline item. At Gate 1, the concept exists in the text. At Gate 2, it passes spontaneous recall. However, at Gate 4 (Contextual Invariance/Definition), it fails. Patients cannot define it beyond variable metaphors. Heterophenomenology dictates that if the *text* describing the phenomenon varies wildly (clouds, static, wool), the construct is not stable enough for a single item. The sponsor wants it because it is recognizable, but recognizability is not validity. The protocol requires you to decompose "fog" into its constituent textual reports (memory, concentration, processing speed). If you submit "Brain Fog" as a single item, the regulator will ask what varies when the score changes. You cannot answer that. Tell the sponsor: "We can measure the report of fog, but we cannot measure what fog *is*." Break it down or risk rejection.

  **Case Two: Fatigue/Pain Order Effect**
  This triggers Gate 4. The text of "fatigue" changes depending on whether "pain" was just discussed. This is not noise; it is data. It suggests fatigue and pain are not distinct texts for these patients but intertwined narratives. The protocol stops the item from entering as a standalone independent variable. You must escalate to the Psychometrician. The question is no longer "is this real?" but "how do we model the dependency?" You cannot claim these items measure independent constructs. If the trial requires independent endpoints, this item set is flawed. The protocol saves you from claiming independence where there is textual entanglement.

  **Case Three: Diary vs. Interview (Nurse Present)**
  This is a Gate 4 failure on audience invariance. The interview text (with nurse) contradicts the diary text (private). Heterophenomenology treats both as valid texts of different contexts. The diary is the text of *experience*; the interview is the text of *presentation*. For a trial endpoint, you need the text of experience. The protocol dictates you prioritize the diary data for frequency/severity and use the interview only for concept elicitation. Do not average them. If the interview says "severe" and diary says "none," the interview is likely performance for the clinician. Reject the interview data for scoring purposes. This protects you from inflating scores based on social desirability.

  **Item Wording Question**
  Your suspicion is partially correct but misapplied. Heterophenomenology is a third-person *method* for studying first-person *reports*. It does not require items to be written in the third person. Patients report in the first person ("I feel heavy"). To change this to "The patient feels heavy" alters the phenomenology of the report. Keep the items as first-person claims ("I feel..."). The method requires *you* to treat those claims as third-person objects during analysis. Do not resist the sponsor here; the error would be treating the first-person claim as infallible truth, not writing it in the first person.

  ### Where the protocol misfires

  The protocol cannot settle questions of value. It can tell you if "Brain Fog" is a stable text, but it cannot tell you if reducing "Brain Fog" is clinically meaningful. That is a judgement call with procedural clothing if you try to solve it here. Gate 5 explicitly hands this to you. Similarly, the protocol cannot fix your back-translation distrust. It treats the translated transcript as the text, but if the translation distorts the metaphors (e.g., "fog" becomes "cloud" which means something else culturally), Gate 3 might pass falsely. You need a native speaker check outside this logic flow. Finally, the protocol assumes the patient is trying to report accurately. It cannot detect deliberate deception, only inconsistency. If a patient lies consistently, the protocol admits the lie as a valid construct. You must rely on the triad (psychologist, clinician, regulator) to catch systemic dishonesty that the text alone hides. The protocol filters noise, not signal intent.

  ### The one-page version

  **PRO Item Admission Checklist (Heterophenomenology-Based)**

  1.  **Extraction:** Is the concept explicitly in the transcript? (No = Reject)
  2.  **Independence:** Did the patient name it spontaneously *and* under probing? (No = Reject)
  3.  **Interviewer Contamination:** Did the interviewer name it first? (Yes = Reject)
  4.  **Gloss Integration:** Did the patient adopt the clinical term unprompted later? (No = Reject)
  5.  **Context Stability:** Does the score hold across question orders and audiences? (No = Escalate)
  6.  **Purpose Check:** Does this stable text measure what the trial needs? (Director Decision)

  **Red Flags:**
  *   Patient assents to gloss but doesn't use it.
  *   Severity shifts >1 point based on previous questions.
  *   Diary data contradicts interview data (Prioritize Diary).
  *   Metaphors vary wildly between patients (Decompose concept).

  **Note:** We measure the report, not the reality. If the report is unstable, the item is invalid.
