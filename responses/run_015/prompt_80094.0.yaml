  I run a small cleaning business and I've been trying to write a proper operations manual for my crew, and its driving me nuts. Every time I change one part of a procedure — say, which cleaner we use on hardwood floors — I have to go through the entire document and make sure every other section that references it is updated, and I keep missing things. It feels like I'm rewriting the whole manual just to change one line. I read somwhere that AI researchers ran into this exact wall decades ago when they first tried to get computers to reason about the physical world — the problem that it's really hard to specify all the stuff that DOESN'T change when you do something — and that it's still considered a genuinely hard problem. So I'm wondering: is my pain just inherent to writing a manual, or is there a smarter way to structure the document so I only have to write down what actually changed? And if I do switch to that style, what new problems am I signing up for? Could you answer in exactly five numbered points, each just a sentence or two, and skip any intro or wrap-up?
