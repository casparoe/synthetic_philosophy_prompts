  **The Last Afternoon (A Ghazal)**

  The sun hits the floorboards, the light **insistent**, I am a student.
  The dust hangs suspended, the air **resistant**, I am a student.

  The lockers are emptied of books and of **intent**,
  The hallway is silent, I am **present**, I am a student.

  The transcript is sealed and I am not **current**,
  The transcript is sealed and I am **present**, I am a student.

  My friends walk ahead with a casual **gait**,
  They turn at the door, I am **content**, I am a student.

  I sign my true name though the list is **absent**,
  I sign my true name, I am **persistent**, I am a student.

  ***

  **Note on the Form:**
  This poem is structured as a ghazal to perform the work of paraconsistent logic. In a classical logical system, a single contradiction entails everything (the Principle of Explosion), rendering the system trivial. In a paraconsistent system, a contradiction can be true without spreading. 

  The ghazal form mirrors this: each couplet is semantically independent. The contradiction in the third couplet (asserting both "I am not current" and "I am a student" under the exact same condition: "The transcript is sealed") does not force the other couplets into nonsense. The lockers remain empty, the friends still walk ahead, and the light remains insistent. The contradiction is contained; it is a glut, not a gap, and it is not resolved by metaphor or time. It simply stands.
