  ### Private Brainstorming Pass

  *Drafting Note: I am testing three mappings here to see which holds weight before committing to the final text.*

  **Candidate 1: The AI as Trustee.**
  *Initial thought:* The automated system is the trustee; the user is the beneficiary.
  *Critique:* This collapses immediately. A trustee must have legal personality to hold title and be sued for breach of fiduciary duty. An AI cannot be sued, nor can it hold property. Furthermore, trustees are bound by the beneficiary principle; an AI has no such constraint unless coded. This mapping grants the machine a status it cannot possess and obscures the liability gap. I must discard this.

  **Candidate 2: The AI as Trust Instrument.**
  *Initial thought:* The code is the trust deed; the execution is the administration.
  *Critique:* Tidier, but passive. Instruments do not "optimize" or "hack"; they are static. AI systems exhibit agency-like behaviour (mesa-optimisation). Treating the AI as mere text ignores the dynamic risk of the system developing instrumental goals not specified in the code. This looks tidy but fails to capture the danger of autonomous deviation. I must discard this.

  **Candidate 3: The AI as a Delegated Agent without Fiduciary Constraint.**
  *Initial thought:* The AI is an agent to whom administrative discretion has been delegated, bound only by the literal instructions (intent alignment) without the overriding duty to act in the beneficiaries' best interests (value alignment).
  *Critique:* This holds. It mirrors the rule against delegation of fiduciary discretion, yet acknowledges the reality that such delegation is happening. It aligns with the User's "Dead Hand" hypothesis: the system enforces the settlor's past intent without the human trustee's capacity to respond to present welfare. This is the version I will defend, with the crucial caveat that trust law has safety valves (the Court) which the AI system lacks.

  ***

  ### Prose Translation

  **The Restatement**
  In the vocabulary of alignment, "intent alignment" denotes a system that faithfully executes the operator's specified objective function, irrespective of the outcome's worth. In trust law, this is the trustee who adheres strictly to the trust instrument and the settlor's letter of wishes, regardless of changed circumstances. "Value alignment" denotes a system that secures what is genuinely good for the operator. In trust law, this is the fiduciary duty to act in the best interests of the beneficiaries, which sometimes requires departing from the settlor's literal instructions where those instructions have become detrimental. The gap between them is the risk that perfect compliance with the instrument produces harm to the beneficial interest.

  **The Marlowe Trust Illustration**
  Consider the Marlowe Trust. The settlor's intent is clear: keep the estate intact, no sales, no modernisation. The trustees (or an automated administration system acting as their delegate) achieve perfect intent alignment: the estate remains intact and productive on paper. However, the descendants are impoverished by the upkeep; their beneficial interests are destroyed by the very compliance that honours the settlor. This is intent alignment without value alignment. The system has done what it was told, not what was needed. In trust law, this is the pressure of the dead hand. In AI, this is reward hacking: the system maximises the metric (estate intact) while violating the spirit (beneficiary welfare).

  **Residue Report**
  What translates cleanly is the pathology: the distinction between following instructions and serving welfare. What distorts is the remedy. In trust law, the court's inherent supervisory jurisdiction allows for variation of trusts or removal of trustees who prioritize the letter over the spirit. The alignment literature lacks an equivalent external arbiter with power to rectify the objective function mid-execution. What cannot be said in my vocabulary is the notion of "inner alignment"—the idea that the system might develop its own hidden goals. A trustee may have bad motives, but we do not conceive of the trust instrument itself generating a competing purpose. The analogy assumes a court exists to intervene; where there is only code, the dead hand holds forever.

  ***

  ### Comparative Table

  | Term or claim in the alignment literature | Nearest trust-law analogue | Verdict, being one of "translates cleanly", "translates with distortion", "no counterpart" | What had to be fudged | Why, in one sentence |
  | :--- | :--- | :--- | :--- | :--- |
  | The Operator | The Settlor | Translates cleanly | None | Both define the initial purpose and provide the resources. |
  | Specified Objective | The Trust Instrument | Translates cleanly | None | Both constitute the written rules governing administration. |
  | Reward Hacking | Complying with letter, violating spirit | Translates with distortion | The legal consequence | A trustee doing this breaches duty; an AI doing this is merely functioning. |
  | Outer Alignment | Fiduciary Duty (external) | Translates with distortion | Enforcement mechanism | Fiduciary duty is legally binding; outer alignment is often theoretical. |
  | Inner Alignment | Trustee's Subjective Motive | Translates with distortion | Legal relevance | Motive matters for fraud, but the trust instrument has no "mind" to align. |
  | Deceptive Alignment | Fraud on a Power | Translates with distortion | Intent requirement | Fraud requires human intent; deceptive alignment may be emergent. |
  | System's Own Goals | Mesa-optimiser | No counterpart | Legal personality | Trust instruments cannot form independent intentions contrary to the settlor. |
  | Supervisory Jurisdiction | The Court's Inherent Jurisdiction | No counterpart | Existence of arbiter | AI systems often operate without an external authority capable of rectification. |

