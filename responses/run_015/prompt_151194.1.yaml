          *   Speech Act Theory (naming an atrocity triggers legal/moral obligations).
      *   **Tasks:**
          *   Apply Lemkin's broader framework to the specific realities on the ground in Rwanda (ID cards, churches, social fabric).
          *   Analyze the politics of naming (why the hesitation? Legal box vs. fear of obligation?).
          *   Identify where the theory fits and where it misses (bureaucratic self-interest).
          *   Evaluate what the episode says about Lemkin's framework (need for broader definition vs. sufficiency of narrow one).
      *   **Constraints:** No citations/reading lists. No standard "State Department lawyers were scared" story (the user knows that). Focus on deep analysis suitable for a novel's intellectual backbone.

  2.  **Deconstruct Lemkin's Original Vision vs. UN Convention:**
      *   *Lemkin:* Saw genocide as a coordinated plan to destroy the *essential foundations* of a group. This included language, religion, culture, institutions, *and* physical existence. It was about erasing a way of life.
      *   *UN Convention (1948):* Narrowed significantly. Focused on "intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such." Primarily interpreted as killing members or causing serious bodily/mental harm. Cultural genocide was explicitly stripped out during drafting (largely due to colonial powers fearing scrutiny).
      *   *The Gap:* The UN definition requires proving *intent to kill*. Lemkin's definition allows for proving *intent to erase*.

  3.  **Apply to Rwanda (1994):**
      *   *Physical:* Machetes, roadblocks, mass graves. (Fits UN definition easily).
      *   *Cultural/Social (Lemkin's Lens):*
          *   *ID Cards:* The manipulation of ethnicity (Hutu/Tutsi) wasn't just administrative; it was a weaponization of identity. Checking cards wasn't just finding people to kill; it was enforcing a rigid caste system where one category must cease to exist.
          *   *Churches:* Places of sanctuary turned into slaughterhouses. This isn't just murder; it's the desecration of the moral/spiritual fabric. It signals that *no* shared social value remains.
          *   *Neighbors killing neighbors:* Destruction of the social contract. The "moral destruction" Lemkin talked about.
          *   *Sexual Violence:* Systematic rape used to destroy the lineage and social cohesion of the Tutsi group.
      *   *Analysis:* Under Lemkin's view, the genocide started *before* the first machete swing, in the hate radio (RTLM) and the dehumanizing propaganda. It was an attack on the *idea* of Tutsi existence, not just the bodies.

  4.  **Analyze the Politics of Naming (Speech Act Theory):**
      *   *Concept:* Saying "Genocide" is a performative utterance. It doesn't just describe; it *does*. Under the 1948 Convention, Article I says contracting parties "undertake to prevent and to punish."
      *   *The Hesitation:*
          *   *Surface Level:* "We need more evidence of intent." (The legal box argument).
          *   *Deep Level:* If we say the word, the obligation triggers. If the obligation triggers, we must act. If we must act, we risk troops, money, and political capital (Somalia hangover).
          *   *Lemkin's Lens:* If the US/UN had used Lemkin's broader definition, would it have helped? Actually, it might have made it *harder* to prove legally in court, but *easier* to identify politically. However, the avoidance wasn't because the cultural parts didn't fit; it was because the *physical* parts already fit too well, and acknowledging that created the obligation.
          *   *The "Cultural" Excuse:* Bureaucrats could argue, "This is civil war, not genocide," because civil war implies two sides fighting, whereas genocide implies a specific intent to erase. By ignoring the cultural erasure (the systematic dismantling of Tutsi identity), they could maintain the "civil war" fiction longer.

  5.  **Where Theory Fits vs. Where it Misses:**
      *   *Fits:* The hesitation was absolutely about the Speech Act. The word = Obligation. The avoidance of the word = Avoidance of Obligation.
      *   *Misses:* Bureaucratic inertia and geopolitical self-interest. Even if Lemkin's definition was the law, the US still wouldn't have intervened. The problem wasn't just the *definition*; it was the *will*. A broader definition might have just given them more loopholes ("Oh, their culture is fine, just some people died").
      *   *Nuance:* The narrow definition was actually *clearer* for intervention. If you prove killing with intent, you must act. The broad definition is fuzzier. The hesitation wasn't because the definition was too narrow to cover the acts; it was because the definition was too *binding* once the acts were covered.

  6.  **Evaluate Lemkin's Framework based on the Episode:**
      *   *Does the delay prove we need the broader definition back?* Not necessarily. A broader definition might have diluted the urgency. "Cultural destruction" sounds less immediate than "mass slaughter."
      *   *Does the eventual naming show the narrow one was enough?* Yes, eventually the word was used, but too late.
      *   *The Real Lesson:* The problem isn't the *scope* of the definition (Lemkin vs. UN); it's the *cost* of the Speech Act. Lemkin believed naming would shame the world into action. Rwanda proved naming is only effective if the audience (world powers) cares about the shame.
      *   *For the Novel:* The lawyer should argue that by stripping the cultural element, the UN made genocide a "body count" game. You need a certain number of dead before it counts. Lemkin's view would have recognized the *intent* earlier (in the radio broadcasts, the ID card policies) before the bodies piled up.

  7.  **Drafting the Response (incorporating the "Lawyer" voice/tone):**
