answer: |-
  Here is an analysis of the Rwandan crisis through the lens of Lemkin's broader framework and Speech Act theory, tailored for your scene.

  ### 1. Lemkin's Lens on the Ground: Beyond the Body Count
  Under the 1948 UN Convention, genocide is largely treated as a crime of *physical destruction*. You need bodies to prove it. But Lemkin's original conception was sociological. He viewed genocide as the disintegration of a group's *essential foundations*. If you apply Lemkin's broader framework to Rwanda, the genocide didn't begin when the first machete fell in April 1994; it began years prior, and the international community missed it because they were looking for corpses instead of cultural erasure.

  *   **The Identity Cards:** The Belgian colonial legacy of ethnic ID cards wasn't just bureaucracy; it was the fossilization of identity. When the Hutu Power regime began manipulating these cards, they weren't just sorting people; they were ontologically restructuring society. Under Lemkin's view, the systematic stripping of Tutsi status—their removal from civil service, schools, and public life in the years leading up to '94—was already genocidal. It was the destruction of the group's *institutional existence*. The UN missed this because it looked like "discrimination," not "killing."
  *   **The Churches:** The slaughter in churches (like Ntarama or Nyarubuye) wasn't just mass murder; it was the desecration of the moral fabric. In Lemkin's view, destroying the places where a group gathers to practice its moral life is an attack on the group's future. By turning sanctuaries into slaughterhouses, the perpetrators were signaling that the Tutsi had no place in the moral universe of Rwanda. A narrow legal definition sees 5,000 dead in a church; Lemkin sees the destruction of the concept of sanctuary for that group.
  *   **Radio Télévision Libre des Mille Collines (RTLM):** Lemkin understood that language is a precursor to violence. The hate radio didn't just incite killing; it dehumanized the Tutsi into *inyenzi* (cockroaches). This is the "moral destruction" Lemkin warned about. It severs the empathetic bond between neighbors. If the UN had used Lemkin's framework, the broadcast of this dehumanization could have triggered the "prevention" clause of the Convention *before* the killing started. Instead, the world waited for the physical act to confirm the intent.

  ### 2. The Speech Act: Naming as Liability
  You mentioned the concept that naming an atrocity triggers obligations. In legal philosophy, this is a **performative utterance**. To say "This is genocide" is not to describe a state of affairs; it is to *create* a legal reality.

  *   **The Trigger:** Article I of the Genocide Convention states that contracting parties "undertake to prevent and to punish." The word "prevent" is the trap. If you name the crime, you admit the obligation to stop it.
  *   **The Strategy of Euphemism:** The US and UN didn't avoid the word "genocide" because they were confused about the definition. They avoided it because they knew the *physical* evidence already fit the narrow UN definition perfectly. They didn't need Lemkin's broader cultural definition to see the killing. They avoided the word because the narrow definition was *already* satisfied, and admitting that would force a response they had no intention of giving.
  *   **The "Civil War" Shield:** By labeling it a "civil war" or "acts of genocide," they turned a legal obligation into a political debate. "Civil war" implies two armed factions fighting for power; the international response is mediation. "Genocide" implies a predator and prey; the response is intervention. The hesitation wasn't about whether the cultural parts fit the legal box; it was about keeping the box closed so the obligation inside wouldn't spill out.

  ### 3. Where the Theory Fits and Where It Breaks
  For your lawyer character, this is the crux of the argument.

  *   **Where Lemkin Fits:** Lemkin was right that focusing only on killing is reactive. If the international community had adopted his view that *cultural dismantling* is genocide, they could have intervened during the hate radio campaigns or the purging of Tutsi from government. The narrow UN definition requires a body count; Lemkin's definition requires recognizing *intent*. The hesitation in '94 proves that waiting for physical destruction makes prevention impossible.
  *   **Where Lemkin Misses (The Bureaucratic Reality):** However, there is a cynical counter-argument your lawyer should confront. Even if Lemkin's broader definition had been the law, would it have mattered? Bureaucracies are adept at finding loopholes. If "cultural destruction" was included, the State Department might have argued, "Their culture is intact, only their people are dying."
      *   The problem wasn't just the *definition*; it was the *cost* of the Speech Act. The narrow definition is actually *clearer* for intervention. If you prove killing with intent, you must act. A broader definition is fuzzier. The delay proves that legal definitions are powerless against geopolitical self-interest. The US didn't stay out because the definition was too narrow; they stayed out because the definition was too *binding*.

  ### 4. The Verdict on the Framework
  What does Rwanda say back to Lemkin?

  *   **The Danger of the Narrow Box:** The episode proves that the narrow UN definition turned genocide into a "threshold" crime. Diplomats acted as if there was a quota of dead required to unlock the word. They debated the *scale* of killing rather than the *intent*. Lemkin's framework would have shifted the debate to the *nature* of the intent (erasure vs. conquest) much earlier.
  *   **The Hollow Speech Act:** Ultimately, Rwanda demonstrates that a Speech Act only works if the audience accepts the authority of the speaker. When the US finally used the word "genocide" in June 1994 (weeks late), it changed nothing. The obligation was triggered, but it was ignored. This suggests that restoring Lemkin's broader definition is necessary but insufficient.
  *   **The Lawyer's Conclusion:** Your character could argue that we need Lemkin's broader definition not because it forces legal action (states will always find a way to avoid that), but because it changes the *moral vocabulary*.
      *   Under the UN definition, the world asked: "How many have died?"
      *   Under Lemkin's definition, the world would have to ask: "Is this group being erased?"
      *   The first question allows for delay while counting bodies. The second question demands immediate recognition of the *plan*.

  **For the Scene:**
  The lawyer shouldn't just argue that the US was cowardly (which is obvious). They should argue that the US weaponized the *narrowness* of the law. They used the UN Convention as a shield, hiding behind the requirement for "proof of intent to destroy physically" while ignoring the "proof of intent to destroy socially" that was screaming from the radio waves and ID card checkpoints. The tragedy wasn't that the definition was too small to cover the crime; it was that the definition was precise enough to convict, so the powers that be refused to speak the verdict.
