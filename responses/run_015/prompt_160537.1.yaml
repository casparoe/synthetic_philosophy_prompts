answer: |-
  Here is the restatement of the moral trade debate in mechanism design and implementation vocabulary, followed by the residue report and verdict.

  ### 1. The Basic Setup
  **Standard Analogy:** Pure exchange economy with private goods.
  **Moral Trade Reality:** A **Team Production** problem with heterogeneous objective functions over a **Public Good** (the State of the World).

  *   **Agents:** $i \in \{1, \dots, n\}$.
  *   **Types:** $\theta_i \in \Theta_i$ represents the moral theory (objective function). This is private information.
  *   **Action Space:** $A = \times A_i$. Crucially, $A_i$ is not just physically possible acts, but *permissible* acts.
  *   **Outcome Function:** $g: A \to S$, where $S$ is the set of world states.
  *   **Preferences:** $u_i(s, \theta_i)$. Note that $u_i$ ranks the *entire* state $s$, not just a private bundle.

  **Where the Analogy Breaks:**
  In a standard exchange economy, agents consume disjoint bundles $x_i$. Here, agents jointly consume $s$. This is not an exchange problem; it is a **Social Choice** problem where the Social Choice Function (SCF) $f: \Theta \to A$ must be implemented.
  The correct object is a **Cooperative Game with Non-Transferable Utility (NTU)**. The characteristic function $V(C)$ for a coalition $C$ depends on the intersection of their permissible action sets and the aggregation of their objective functions. If $\theta_i$ and $\theta_j$ impose disjoint constraints on $A_i$ and $A_j$, the core may be empty.

  ### 2. The Gains-from-Trade Claim
  **Claim:** Comparative advantage expands the Pareto frontier.
  **Vocabulary:** We are looking for Pareto improvements in an NTU bargaining set.
  *   **Numeraire:** The lack of a common numeraire means utility is not transferable. You cannot compensate Sam with "utils." You must compensate him with *state changes* he values.
  *   **Barter:** Yes, this is barter. In NTU games, the absence of a numeraire does not preclude gains from trade; it merely complicates the characterization of the contract curve.
  *   **The Problem:** The "gains" exist only if the feasible set of joint actions $A_{joint}$ under cooperation is larger than the Nash equilibrium of the non-cooperative game.
  *   **Sam's Objection (Translated):** Sam argues that for him, the action $a_{user}$ (e.g., lying) is not in $A_{Sam}$. It is not that $u_{Sam}(a_{user})$ is low; it is that $a_{user} \notin A_{Sam}$. If the action is not in the domain, you cannot trade it. This turns a preference problem into a **domain restriction** problem.

  ### 3. Enforcement
  **Environment:** No external enforcer (courts), non-verifiable actions (moral quality), irreversible acts.
  **Mechanism:** **Relational Contracting** in an infinitely repeated game.
  *   **Logic:** Folk Theorem. If discount factor $\delta$ is sufficiently high, any feasible, individually rational payoff vector can be sustained as a Subgame Perfect Equilibrium (SPE).
  *   **Verifiability:** Moral quality is soft information. You can verify the *physical* act (e.g., money transferred), but not the *intent* or the *moral permissibility*. This creates a **Moral Hazard** problem.
  *   **Teeth:** Reputation works only if there is sufficient overlap in moral theories to agree on what constitutes a "defection." If your theories are orthogonal, punishment strategies are not credible (Sam won't punish you for violating welfarism; you won't punish him for violating constraints).
  *   **Escrow/Commitment:** Pre-commitment devices (e.g., donating to a cause you hate if you defect) act as bonding costs. This works if the bond is verifiable.

  ### 4. Incentives Over Types
  **Problem:** Private information on $\theta_i$.
  **Impossibility:** **Myerson–Satterthwaite** applies. With two-sided private information regarding valuations (or constraints) and a requirement for ex-post efficiency and budget balance (voluntary participation), there is no mechanism that is both incentive compatible and efficient.
  *   **Does it bite?** Yes. Agents have an incentive to misreport the rigidity of their constraints to extract concessions. (e.g., Sam claims his constraints are harder than they are to force you to do more).
  *   **Workarounds:**
      *   **Public Declaration:** Signaling. If moral theories are costly to fake (e.g., track record), this reduces information asymmetry.
      *   **Mediator with Commitment:** A Groves-Clarke mechanism could elicit truth-telling, but requires transferable utility (numeraire) to balance the budget, which we lack.
      *   **Correlated Evidence:** If actions are observable, past behavior correlates with type. This allows for screening, but not full implementation.

  ### 5. Dirty vs. Clean Trades (The Core Conflict)
  **Definition:**
  *   **Clean Trade:** $a_i$ is feasible ($a_i \in A_i$) but low utility.
  *   **Dirty Trade:** $a_i$ is infeasible by constraint ($a_i \notin A_i$), but the joint state $s$ is high utility.

  **Translation:**
  You are modeling Sam's constraint as a **Lexicographic Preference** within the utility function:
  $$ u_{Sam}(s) = \begin{cases} -\infty & \text{if constraint violated} \\ v(s) & \text{otherwise} \end{cases} $$
  In this model, the trade is "clean" if the compensation raises the expected utility above the reservation value, assuming the $-\infty$ is actually a very large negative number (soft constraint).

  Sam is modeling the constraint as a **Domain Restriction** on the mechanism:
  $$ \text{Domain}(f) \subset \{ a \in A \mid \text{constraints satisfied} \} $$
  In this model, the mechanism cannot even map to a state where the constraint is violated. It is not a cost; it is a structural impossibility for the agent.

  **Can it be restructured?**
  *   **If Lexicographic:** No finite price makes it clean. It collapses to a price only if the constraint is *not* lexicographic (i.e., trade-offs are allowed).
  *   **If Domain Restriction:** You cannot restructure it. You must change the agent (the theory).
  *   **Verdict on "Bulldozing":** You are bulldozing if you treat a domain restriction as a preference parameter. In mechanism design, we usually endogenize constraints into utility for tractability. Sam is insisting that the constraint is **constitutive** of the agent, not a parameter of the agent. You cannot trade away constitutive rules without ceasing to be that type of agent.

  ### 6. Trading with Future Self (Moral Uncertainty)
  **Setup:** Dynamic game, $t=0$ (Theory A), $t=1$ (Theory B).
  **Your View:** **Multiple Selves / Strotz Model.** Time inconsistency. Commitment device to bind future self.
  **Sam's View:** **Agent Identity.** If moral theory defines the agent, then $Agent_{t=0} \neq Agent_{t=1}$. This is not intra-personal commitment; it is inter-personal trade between distinct entities sharing a body.
  **Analysis:**
  *   If identity is psychological continuity (Parfit), you are right: it's a commitment problem.
  *   If identity is normative (constitutive of agency), Sam is right: it's a principal-agent problem between successors.
  *   **Closer:** You are closer on the *mechanics* (it functions like a commitment device), but Sam is closer on the *ontology* (if the theory changes, the objective function changes discontinuously, making the "self" a different player in the game).

  ---

  ### Residue Report

  **1. Carried Over Without Loss:**
  *   **Comparative Advantage:** The logic of coordination to expand the Pareto frontier holds perfectly in NTU cooperative games.
  *   **Enforcement:** The logic of repeated games and relational contracts applies directly.
  *   **Information Asymmetry:** The Myerson-Satterthwaite inefficiencies regarding private moral types are structurally identical to private valuation inefficiencies.

  **2. Carried Over With Distortion:**
  *   **Utility:** Modeling moral constraints as $-\infty$ utility flattens the distinction between "I hate this" and "I cannot do this." It turns a rule into a taste.
  *   **Feasibility:** In market design, feasibility is usually technical (resources, physics). In moral trade, feasibility is normative. Treating normative feasibility as technical feasibility ignores the *reason* for the constraint.
  *   **Agency:** The model assumes a stable agent $i$ with a function $u_i$. Sam argues the agent is *defined* by the constraints. Changing the constraints changes the agent ID.

  **3. No Counterpart (The Blind Spot):**
  *   **Constitutive Rules:** Market design has no vocabulary for rules that define the player rather than constrain the play. In game theory, rules are exogenous. In Sam's view, moral constraints are endogenous to the identity of the agent.
  *   **Normative Force:** The "ought" in morality carries a weight that "preferred" does not. You can model the *behavior* of a deontologist using steep utility cliffs, but you cannot model the *justification*. The framework captures the prediction, but loses the normativity.

  ### Verdict on Sam

  **Is it a blind spot?**
  Yes, but a specific one. Your framework treats all constraints as **incentive constraints** (things you won't do because of costs). Sam is pointing out **eligibility constraints** (things you can't do because they violate the definition of the interaction).

  **Was he bulldozed?**
  Yes, on the "Dirty Trade" point. You translated his "forbidden" into "very costly." In your vocabulary, everything is a trade-off. In his, some things are off-limits regardless of the trade-off. By modeling his constraint as a utility penalty, you assumed the very thing he denied: that consequences can outweigh rules.

  **Was he right?**
  Normatively, yes. Mechanically, no.
  *   **Mechanically:** Coordination will happen regardless of whether you call it "trade" or "complicity." The equilibrium outcomes look the same.
  *   **Normatively:** He is correct that calling it "trade" obscures the moral cost. If the constraint is constitutive, violating it isn't a "cost" you incur; it's a corruption of the agent. Your model predicts the behavior, but it cannot register the *moral loss* as anything other than a utility dip.

  **Recommendation:**
  Keep your mechanism design framework for predicting behavior and designing institutions. It works. But acknowledge that for agents with constitutive constraints, the "feasible set" is not a resource constraint, but an identity constraint. You cannot model that away without changing the subject from "moral trade" to "coordination among consequentialists." Sam isn't wrong about the morality; he's wrong about the incoherence of the coordination. He just refuses to call it "trade" because he reserves that word for permissible exchanges. That's a semantic boundary, not a logical one.
