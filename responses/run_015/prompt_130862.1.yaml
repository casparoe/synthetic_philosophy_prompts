prompt: |-
  In drafting a constitutional fable about a republic that selects its assembly by lot but permits members to extend their tenure through a secondary peer-confirmation vote, I have constructed the following argument, and I find that it collapses every design for democratic representation into absurdity. I wish to preserve the intuition that legitimacy requires citizen accountability and the intuition that careerism corrupts deliberation, yet the reasoning seems to force me to abandon representation altogether. Here are the steps:

  (1) Democratic legitimacy requires that citizens possess a credible mechanism to hold decision-makers accountable for outcomes.
  (2) Under election, accountability operates retrospectively: voters may remove representatives.
  (3) Under sortition with non-renewable terms, retrospective accountability is absent, so legitimacy must be secured prospectively through strict term limits that prevent any individual from accumulating sustained influence.
  (4) But if representatives serve only briefly, they cannot develop the institutional knowledge required for competent governance.
  (5) Consequently, brief representatives become structurally dependent upon a permanent administrative class that retains institutional memory.
  (6) This administrative class, though not elected, exercises de facto legislative influence and survives all changes in the representative body; it therefore constitutes a class of career politicians in all but name.
  (7) Thus strict term limits for representatives, without corresponding limits on administrators, reproduce precisely the careerist corruption that the shift away from elections was intended to eliminate.
  (8) Applying the same term limits to administrators destroys institutional memory altogether, rendering governance incompetent.
  (9) Therefore any representative system either permits careerist corruption (if administrators are permanent) or destroys governing capacity (if they are not).
  (10) Direct democracy avoids both problems but is impractical at scale; hence democratic representation is impossible.

  The conclusion strikes me as false, yet each premise feels defensible. I am especially reluctant to surrender (1) or (3), though I am open to revising (6). Which step should I reject, and what does that rejection cost me? Does it require abandoning the distinction between elected and unelected power, or can I preserve that distinction at a price? If the argument is valid despite my resistance, which of my preferred premises—(1) or (3)—is least costly to weaken?

  Please present your diagnosis in clear prose, naming the specific step, explaining why it appeared sound, and pricing the alternatives: what I must pay to keep (1), what I must pay to keep (3), and whether the error is a hidden equivocation—perhaps between terms such as "career politician" and "permanent administrator"—or whether the premises are individually sound but jointly overreach, and price both possibilities.

  After your analysis, provide a brief structured summary in JSON format with exactly these fields:
  - "rejected_step": the number of the step you diagnose as flawed
  - "why_it_looked_fine": a one-sentence explanation
  - "cost_of_rejection": what the rejection forces the arguer to accept
  - "equivocation_flag": true or false, indicating whether an ambiguity drives the error
  - "status_of_premise_1": "kept", "weakened", or "abandoned"
  - "status_of_premise_3": "kept", "weakened", or "abandoned"
  - "alternative_reading": a one-sentence summary of the most charitable reconstruction that avoids the absurd conclusion
