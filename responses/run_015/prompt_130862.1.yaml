answer: |-
  The flaw in your argument lies in **Step (6)**.

  This step appeared sound because it correctly identifies a real structural vulnerability in representative systems: information asymmetry. It is true that a permanent bureaucracy possesses more institutional memory than a rotating assembly, and that knowledge confers influence. This taps into the valid "Iron Law of Oligarchy" intuition that specialized groups tend to capture generalist bodies.

  However, Step (6) relies on a hidden **equivocation** between "influence" and "authority," and between "career administrator" and "career politician." A permanent administrator may have *influence* over the agenda or the drafting of laws, but they lack the *authority* to vote on them. A "career politician" is defined by the pursuit of discretionary political power and re-election; a "permanent administrator" is defined by technical continuity and implementation. By equating the two, Step (6) assumes that advisory power automatically translates into legislative control, which is not structurally inevitable. It ignores the capacity of a representative body to audit, reject, or counter-balance administrative advice.

  **The Cost of Rejection:**
  To reject Step (6), you must accept that the distinction between elected (or sortitive) power and unelected power is meaningful and maintainable. You pay the price of complexity: you must design specific institutional safeguards (such as independent legislative counsel, audit powers, or the peer-confirmation mechanism in your fable) that allow the assembly to verify administrative claims without possessing the memory themselves. You cannot simply assume the bureaucracy will be benign; you must assume it can be checked.

  **Pricing the Alternatives:**
  If you were forced to weaken your preferred premises instead of rejecting Step (6):
  *   **Keeping (1) [Legitimacy requires accountability):** This is the less costly premise to keep. It is the bedrock of democratic theory. If you abandon this, you cease to argue for a *democratic* republic.
  *   **Weakening (3) [Sortition requires term limits for legitimacy):** This is the more viable candidate for weakening if you wish to escape the dilemma. You could argue that sortition secures legitimacy *prospectively* through the equality of the lottery itself, not merely through term limits. However, since your intuition is that careerism corrupts, you likely want to keep the spirit of (3).

  Therefore, the error is not in your intuitions about legitimacy or careerism, but in the leap that converts bureaucratic necessity into political usurpation. By rejecting (6), you preserve the distinction between elected and unelected power, provided you acknowledge that the former must be actively empowered to scrutinize the latter.

