answer: |-
  Dr. Aris Thorne, owner of a physiotherapy clinic, must finalize the staffing roster for a single, non-repeatable week under a temporary government grant that expires immediately after; the payoff is "billable therapy hours" in a single treatment room where marginal value is strictly constant (the 10th hour is worth exactly the 1st), pinned by her sure-thing attitudes: she is indifferent between a contract for 100 hours versus two contracts for 50 hours, and strictly prefers 40 sure hours to 30 sure hours, establishing linear utility $u(x)=x$. She faces two rosters: Option A (The "Stretch") relies on one senior therapist who is highly productive but flaky, yielding 20 hours if she calls out (20% chance) or 50 hours if she works (80% chance); Option B (The "Split") uses two reliable juniors, yielding 38 hours if one is absent (50% chance) or 44 hours if both work (50% chance). This risk does not smooth into a portfolio because the grant is a one-off pilot with no future weeks to average over, and reputation costs are contractually insulated for this specific pilot, isolating the preference for the distribution of hours themselves.

  ### Outcome Table and Arithmetic

  | Option | Outcome 1 (Low) | Prob 1 | Outcome 2 (High) | Prob 2 | Expected Value (EU) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A** | 20 hours | 0.20 | 50 hours | 0.80 | $0.2(20) + 0.8(50) = \mathbf{44}$ |
  | **B** | 38 hours | 0.50 | 44 hours | 0.50 | $0.5(38) + 0.5(44) = \mathbf{41}$ |

  **EU Calculation:** Since $u(x)=x$, $V_{EU}(A) = 44$ and $V_{EU}(B) = 41$. **EU recommends A.**

  **REU Calculation:** We apply a convex risk-weighting function $r(p) = p^2$ (representing risk aversion in the Buchak/RDU sense, where lower outcomes are overweighted).
  *   **Option A:**
      *   Weight on 50 (Best): $r(0.8) - r(0) = 0.64 - 0 = 0.64$.
      *   Weight on 20 (Worst): $r(1) - r(0.8) = 1 - 0.64 = 0.36$. (Note: Probability was 0.20, Weight is 0.36).
      *   $V_{REU}(A) = 0.64(50) + 0.36(20) = 32 + 7.2 = \mathbf{39.2}$.
  *   **Option B:**
      *   Weight on 44 (Best): $r(0.5) - r(0) = 0.25 - 0 = 0.25$.
      *   Weight on 38 (Worst): $r(1) - r(0.5) = 1 - 0.25 = 0.75$. (Note: Probability was 0.50, Weight is 0.75).
      *   $V_{REU}(B) = 0.25(44) + 0.75(38) = 11 + 28.5 = \mathbf{39.5}$.
  *   **REU recommends B.** ($39.5 > 39.2$).

  **Why EU cannot replicate this without contradiction:** For EU to prefer B ($41 < 44$), the utility function $u$ must be sufficiently concave to penalize A's lower tail. Specifically, we would need $0.2u(20) + 0.8u(50) < 0.5u(38) + 0.5u(44)$. However, this contradicts the pinned sure-thing attitudes. If $u$ were concave enough to reverse the preference, Aris would *not* be indifferent between one 100-hour contract and two 50-hour contracts; she would prefer the split (diversification of sure things). Since she is indifferent, $u$ is linear, and EU is mathematically forced to pick A.

  ### Structural Feature and Ablation

  The reversal turns entirely on the **non-linear weighting of cumulative probabilities in the lower tail**. Option A has a low-probability disaster (20 hours), while Option B has a high-probability mediocrity (38 hours). REU with convex $r$ drastically overweight the 20-hour outcome in Option A (boosting its weight from 0.2 to 0.36), whereas it only modestly overweights the 38-hour outcome in Option B (boosting from 0.5 to 0.75). The penalty on A's tail is disproportionate compared to B's.

  **Ablation Test:**
  1.  **Flatten $r$ (Identity):** Set $r(p)=p$. The weights return to objective probabilities. $V(A)$ becomes 44, $V(B)$ becomes 41. **The reversal is killed.**
  2.  **Flatten $u$ (Linear):** This is the baseline established by the sure-thing attitudes. Keeping $u$ linear while maintaining convex $r$ *preserves* the reversal.
  3.  **Conclusion:** The reversal is not "risk aversion re-described" via utility curvature; it is generated specifically by the risk-weighting function $r$. If you remove $r$'s curvature, the preference flips back to EU, even holding the agent's valuation of sure outcomes constant.

  ### The EU Defender's Objection

  **Objection:** "Your model suffers from description invariance failure. Aris isn't choosing between '20 hours' and '50 hours'; she is choosing between '20 hours + high anxiety about rent' and '38 hours + low anxiety.' If you define the outcomes as composite states including the psychological cost of risk, a standard EU function over *those* richer outcomes explains the choice without needing $r$."

  **Evaluation:** This objection lands only if we allow EU to be unfalsifiable. If any deviation from expected value can be rationalized by positing hidden "anxiety utilities" attached to specific outcomes, EU loses its normative bite—it becomes a tautology where preferences define utilities rather than utilities explaining preferences. REU's advantage is that it separates the *value of the outcome* (pinned by sure-thing tradeoffs) from the *attitude toward the risk structure* (pinned by gamble choices). By holding $u$ constant via the contract indifference, we demonstrate that the preference reversal is driven by the probability structure itself, not hidden consequence utilities. The EU defender's move saves the theory by abandoning its constraint on outcome individuation.
