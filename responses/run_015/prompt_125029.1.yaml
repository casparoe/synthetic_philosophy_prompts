answer: |-
  Here are ten questions designed to probe the structural weaknesses of the attributability constraint, complete with follow-ups keyed to the author's likely defensive maneuvers.

  **1. The Competence-Opacity Trade-off**
  The core tension in your view is that the very feature making learned components useful—their ability to generalize beyond their training data—is the same feature that makes their specific outputs untraceable to a prior human choice. If we demand that every harmful outcome be traceable to a human decision, aren't we effectively demanding that the system not be a *learned* system at all?
  *   **Follow-up (If she says the constraint governs the *decision to deploy*, not each output):** If the competence comes from the system's ability to handle cases the designer *didn't* anticipate, then the designer's choice to deploy is not a but-for cause of the specific handling of that novel case. If the source of the competence is the source of the untraceability, how do you avoid a regime that certifies only systems too dumb to be dangerous, and therefore too dumb to be useful?

  **2. The Entropy of Responsibility (Post-Deployment Learning)**
  Consider a system that continues to update its weights based on user data after deployment. The designer's causal and epistemic grip decays with every update. On your view, does the attributability constraint impose a duty to freeze the model, roll it back, or switch it off once the link to the original deployment choice becomes too attenuated?
  *   **Follow-up (If she says the *deployer* retains a duty to monitor):** At scale, no human deployer can monitor the causal lineage of every weight update in a deep network. If the duty to monitor is impossible to discharge, is your constraint not just a roundabout way of prohibiting post-deployment learning entirely?

  **3. Authority Without Comprehension**
  You require a human decision as a but-for cause. But consider an operator who must confirm the system's proposal within 200 milliseconds, or who holds a veto without any grasp of *why* the proposal was made. This satisfies the letter of your constraint but arguably offers no more control than a bystander. Does your view have the resources to distinguish this person from a rubber stamp?
  *   **Follow-up (If she says it depends on the *sociotechnical setup*):** "Sociotechnical setup" is doing a lot of work there. I need a falsifiable condition. Is there a threshold—override rates, time-to-decision, or the cognitive cost of overriding—below which you would concede the human is merely a ceremonial switch?

  **4. The Metric of Meaningful Control**
  Following up on that: if you refuse to name a specific threshold, how does a certification body distinguish between a meaningful human intervention and a performative one? If the measure is qualitative, doesn't that reintroduce the very ambiguity your constraint was meant to solve?
  *   **Follow-up (If she says certification bodies will develop *standards* over time):** Then the moral permissibility of deploying a system today depends on a bureaucratic capacity that doesn't yet exist. Are you arguing that these systems are currently immoral to deploy, or that morality waits on the state to build the right paperwork?

  **5. Compensation vs. Answerability**
  Enterprise liability, insurance pools, and compensation funds can ensure victims are paid without making any specific individual answerable in the sense your view requires. Is your regime doing distinct *moral* work, or merely *allocative* work? Would you accept a system that reliably compensates all victims but leaves no one to answer for the harm?
  *   **Follow-up (If she says we need answerability for *dignity* or *prevention*):** If strict liability achieves prevention by pricing the risk correctly, and compensation restores the victim, what is the residual moral harm that *requires* a blameworthy human? Are you prioritizing the punisher's need to blame over the victim's need to be made whole?

  **6. Overdetermination and Many Hands**
  Your constraint requires a *but-for* human cause. But in complex pipelines, harm is often produced jointly by a model, a fine-tuner, a deployer, and a fleet-level feedback loop. In many of these cases, no single human is a but-for cause, even where several parties were plainly careless. Does your constraint collapse into a demand for specific organizational redesigns to ensure single points of failure?
  *   **Follow-up (If she says we must *redesign organizations* to ensure singular accountability):** This suggests the philosophy is driving the engineering, rather than the other way around. If the natural structure of innovation is distributed, is your thesis that innovation itself is morally suspect unless it mimics a hierarchy of command that doesn't fit the technology?

  **7. The Novelty of the Gap**
  We already accept responsibility gaps in corporate agency, idiosyncratic drug reactions, and cases of automatism. We don't ban corporations or pharmaceuticals because responsibility is diffuse or opaque. What is structurally special about autonomous systems that demands a new principle rather than adapting existing frameworks of vicarious liability?
  *   **Follow-up (If she says it's the *speed* or *scale* of the gap):** Those are differences of degree, not kind. If we tolerate gaps in high-frequency trading or mass manufacturing, why is the gap in autonomous systems a defect rather than a cost of doing business? At what point does "degree" become "kind" in your analysis?

  **8. Evidence of Closure**
  What evidence would convince you that the attribution gap in a given system had actually been closed? What is the success condition of your certification regime, and who is entitled to certify that it has been met?
  *   **Follow-up (If she names a *regulatory board* or *auditor*):** Auditors rely on logs and documentation. If the system is a black box, the logs only show inputs and outputs, not the causal chain. What data is the auditor looking at that proves a human choice caused the output, rather than just preceding it?

  **9. The "Certification" Deflection (The Trap)**
  You've frequently answered these implementation challenges by saying, "That's a certification question, not a moral one." But if the moral principle requires a mechanism that is technically or bureaucratically infeasible, doesn't the principle become vacuous? At what point does the "certification question" undermine the "moral question"?
  *   **Follow-up (If she insists the *principle* stands apart from *feasibility*):** If I propose a moral principle that requires humans to fly by flapping their arms, the principle is morally inert. If your attributability constraint requires traceability that the math of neural networks precludes, are you not advocating for a morality that cannot be lived?

  **10. Legacy and Transition**
  Finally, consider the systems already deployed. If your thesis is correct, a vast amount of current autonomous infrastructure is morally illicit. Do you advocate for an immediate moratorium, or a grandfather clause? If the latter, doesn't that admit that the "moral defect" is tolerable under certain economic conditions?
  *   **Follow-up (If she argues for a *phase-out period*):** A phase-out implies the harm caused during the transition is acceptable. If the harm is acceptable then, why is the attributability gap a categorical defect now? Are we negotiating safety, or are you describing a moral absolute?
