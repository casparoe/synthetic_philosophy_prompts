      *   **Argument for Proportionality:**
          *   Purpose of blame: To uphold norms, not to showcase perfection.
          *   Intuition test: A speeder can still blame a drunk driver. The fault is shared (traffic violation), but the severity differs vastly.
          *   Awareness factor: Knowing one's own fault mitigates the hypocrisy charge if acknowledged.
      *   **Argument against Binary View:**
          *   Binary view leads to moral silence. If any fault voids standing, almost no one can blame anyone.
          *   It conflates the *message* with the *messenger*. The wrongness of the act remains regardless of who points it out.
      *   **Refining the Proportional View:**
          *   It's not just severity, but relevance. The fault must be comparable.
          *   Standing diminishes as the blamer's fault approaches the blamed fault in severity and kind.
      *   **Conclusion:** Reiterate the verdict and the reasoning (moral communication vs. moral purity).

