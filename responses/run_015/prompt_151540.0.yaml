      *   *Body:* The binary view posits that moral authority requires purity, suggesting that any participation in a wrong forfeits the right to criticize it in others. This stance treats standing as a credential of perfection rather than a function of moral communication. If adopted, it would induce widespread moral silence, as nearly every agent bears some moral blemish. Such silence undermines the social function of blame, which is to reinforce norms and correct behavior, not to certify the blamer's sanctity.

      *   Conversely, the proportional view aligns with our deepest intuitions about moral gravity. Consider a person who occasionally speeds blaming another for reckless drunk driving. Both violate traffic laws, yet the severity and danger differ vastly. To claim the speeder lacks *any* standing is to equate minor negligence with life-endangering malice. The hypocrisy exists, but it does not negate the truth of the criticism nor the urgency of the norm being violated. The blamer's fault creates a debt of acknowledgment, not a gag order.

      *   Crucially, proportional hypocrisy accounts for awareness. A blamer who acknowledges their own similar failings retains more standing than one who conceals them. This suggests standing is relational and dynamic, not static and binary. When a blamer admits their fault, they separate the norm from their personal adherence to it, validating the rule while confessing personal weakness. The binary view cannot accommodate this nuance; it demands an impossible cleanliness that ignores human fallibility.

