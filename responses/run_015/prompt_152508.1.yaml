      *Decision:* I will interpret the prompt's constraint as: "Each reviewer evaluates the *same* paper, but their *source of competence* is derived from their specific pillar expertise, ensuring they don't just copy each other." This satisfies the "pillar" constraint (source of info) without breaking the "same vote" requirement of CJT. I will explicitly note this framing choice in the plan.

      *Wait, one more check:* "voting on publication." Okay. Binary: Publish/Reject. Ground Truth: The paper *should* be published (Valid) or *should not* (Invalid).
      *Competence:* Probability they vote matching Ground Truth.
      *Independence:* Their errors are not linked.

      *Let's finalize the Check-for-Understanding:* It needs to verify they understand the *direction* of the collapse. Not just "it gets worse," but "it converges to certainty in the *wrong* direction."

      *Let's finalize the Math Omission:* The binomial sum $\sum_{k=(n+1)/2}^n \binom{n}{k} p^k (1-p)^{n-k}$. I will suggest showing the *curve* instead.

      *Let's finalize the Misconceptions:*
