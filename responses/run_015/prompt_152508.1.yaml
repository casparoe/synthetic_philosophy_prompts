  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   Core assumptions: Binary choice (True/False, Accept/Reject), Independent voters, Competence $p > 0.5$ (probability of choosing the correct option), Odd number of voters (to avoid ties, though not strictly necessary for the limit theorem).
      *   Core result: As $n \to \infty$, probability of majority being correct $\to 1$. Also, for finite $n$, $P(\text{majority correct}) > p$ if $p > 0.5$.
      *   Failure mode: If $p < 0.5$, adding voters makes the group *worse* than a random guess (converges to 0 correctness).

  3.  **Address Constraint 3 (Order of Operations: Competence vs. Independence):**
      *   *Thought:* Which is more intuitive to define first? Competence ($p$) is a property of the individual. Independence is a property of the *relationship* between individuals.
      *   *Decision:* Define Competence first. You can't talk about independent errors if you haven't defined what an "error" or "correct judgment" probability is. Independence modifies how those probabilities aggregate.
      *   *Why:* Competence sets the baseline ($p$). Independence determines the variance reduction (Law of Large Numbers logic). If you define independence first, it's abstract ("A doesn't affect B"). If you define competence first, it's concrete ("You are right 70% of the time").

  4.  **Develop the Carrying Example (Distributed Peer Review):**
      *   *Scenario:* A complex study has 5 distinct pillars (e.g., Stats, Ethics, Lab Protocol, Clinical Relevance, Data Integrity). 5 Reviewers. Each reviews *one* pillar? Wait, the prompt says "assessing only one methodological pillar... voting on publication."
      *   *Correction/Refinement:* If each assesses only *one* pillar, how do they vote on the *whole* paper?
      *   *Interpretation:* The prompt says "assessing only one methodological pillar of a complex study." This implies specialization. But for CJT, they need to be voting on the *same* binary question (Is the paper valid/true?).
      *   *Adjustment:* To make CJT work, they must all be voting on the *same* ground truth (e.g., "Is the main claim supported?"). The "pillar" aspect might confuse the independence assumption if Reviewer 1 looks at Stats and Reviewer 2 looks at Ethics. If the paper is bad because of Stats, Reviewer 2 might miss it.
      *   *Better Interpretation for CJT:* The prompt says "independent competence in assessing only one methodological pillar." This sounds like they are *experts* in different things but voting on the *overall* validity.
      *   *Critical Fix:* For CJT to apply cleanly, the "correctness" must be objective (Ground Truth: The claim is True/False). The reviewers are estimating this truth. The "pillar" constraint in the prompt is tricky. If Reviewer A only knows Stats, and the error is in Ethics, A is guessing. This violates the $p > 0.5$ assumption for *everyone* on *every* paper.
      *   *Re-reading the Prompt:* "a panel of five reviewers, each with independent competence in assessing only one methodological pillar of a complex study, voting on publication without conferring."
      *   *Challenge:* This setup actually *threatens* the CJT assumptions. If they only assess one pillar, their competence on the *global* truth depends on whether the fatal flaw is in their pillar.
      *   *Solution:* I must frame the scenario carefully. The "pillar" aspect explains *why* they are independent (different expertise sources), but they must all be tasked with judging the *same* binary outcome (e.g., "Is the conclusion robust?"). Their competence $p$ represents the probability that their specific pillar check reveals the truth *sufficiently* to vote correctly.
      *   *Actually, looking closer:* The prompt asks me to use this scenario. I need to make it work.
      *   *Revised Scenario:* The "Truth" is whether the study is fundamentally sound. Each reviewer checks a different angle. If *any* angle finds a fatal flaw, the paper is bad. But CJT requires a majority vote on the *same* proposition.
      *   *Best Fit:* Let's simplify. The "pillar" detail explains the *source* of independence (they aren't copying each other because they look at different data/methods), but they all render a verdict on the *same* binary question: "Accept" vs. "Reject" based on whether the study holds up. Their competence $p$ is the probability their specific lens detects the truth.
      *   *Properties:*
          *   Must Have: Binary outcome (Accept/Reject), Ground Truth (Study is Valid/Invalid), No communication (Blind review).
          *   Must Lack: Shared bias (e.g., all using the same flawed software), Herding (knowing others' votes), Systemic error (all $p < 0.5$).

  5.  **Address Misconceptions:**
      *   *Misconception 1:* "More people always help." (False if $p < 0.5$).
      *   *Misconception 2:* "Correlated errors don't matter much." (Fatal to CJT).
      *   *Misconception 3:* "Majority rule always beats the best expert." (False if one expert has $p=0.9$ and 4 others have $p=0.51$).
      *   *Timing:* Address correlation early (when defining independence). Address $p < 0.5$ at the end (the "collapse"). Address the "best expert" nuance during the aggregation phase.

  6.  **Address the Math Omission:**
      *   *Omit:* The full Binomial Cumulative Distribution Function summation.
      *   *Frame:* "We rely on the Law of Large Numbers intuition rather than the combinatorics." Or "The algebra is tedious; the geometric intuition is what matters for application."

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Minute 0-10:* Intro & Scenario. Define the "Ground Truth."
      *   *Minute 10-20:* Define Competence ($p$). *Crucial:* Do this before Independence. Why? Because independence describes the *joint* distribution of competences.
      *   *Minute 20-30:* The Aggregation (The "Magic"). Show $n=1$ vs $n=5$.
      *   *Minute 30-40:* Assumptions & Misconceptions (Independence/Correlation).
      *   *Minute 40-50:* The Collapse ($p < 0.5$) & Check-for-Understanding.

      *   *Refining the "Pillar" constraint:* I need to be careful not to let the audience think "If I review Stats, I can't judge Ethics." I will frame it as: "Each reviewer is assigned a complex paper. They each have a specialized lens (pillar) that gives them a signal. The signal is noisy but better than random." This preserves the "pillar" constraint while satisfying CJT requirements.

      *   *Refining the Order:* Competence first. You need to define the random variable $X_i$ (1 if correct, 0 if not) with $P(X_i=1) = p$ before you can define the covariance between $X_i$ and $X_j$.

      *   *Refining the Check-for-Understanding:* Needs to be about $p < 0.5$. "If your reviewers are systematically biased against the truth (e.g., $p=0.4$), what happens if you add more reviewers?"

      *   *Refining the Omission:* Binomial sum. Frame it as "Computational detail vs. Conceptual limit."

