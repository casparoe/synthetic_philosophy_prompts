answer: |-
  A professional value judgment is legitimate only if its justification rests on publicly articulable institutional missions or universalizable moral principles when imposing consequences on others, whereas private aesthetic or visceral sentiments are permissible solely when the agent absorbs the resulting professional costs personally.

  This principle distinguishes bias from preference along two axes: the locus of cost (self versus others) and the nature of the justification (public principle versus private sentiment). It saves the climate researcher (Case 2) because her aesthetic rejection of air travel imposes the cost on her own career reach rather than on the rights or safety of others, making her private spirituality a defensible personal sacrifice. It saves the judge (Case 3) and the institutional curator (Case 6) because their decisions impose consequences on others but are grounded in universalizable moral law (human dignity) and explicit institutional mission (emotional sanctuary), respectively, rather than unexamined feeling. It condemns the admissions officer (Case 1), the public-health official (Case 4), and the personal curator (Case 5) because they impose consequences on applicants, the public, and exhibition audiences based on unexamined affinity, poetic resonance, or visceral distaste, none of which constitute publicly articulable professional justifications.

  Under this principle, the AI-safety reviewer (Case 7) is unequivocally biased, aligning her with the public-health official rather than the climate researcher. Like the health official, she overrides empirical metrics (disparate-impact studies versus epidemiological modeling) with private metaphysical aesthetics, and like the health official, her decision imposes societal risk rather than absorbing the cost herself. Her desire for a specific "social world" is a policy imposition on others, not a model for her own conduct. Consequently, none of your six settled judgments must be overturned; the principle coheres perfectly with your intuitions by clarifying that personal integrity allows for aesthetic self-sacrifice, but professional authority demands public justification when wielding power over others.
